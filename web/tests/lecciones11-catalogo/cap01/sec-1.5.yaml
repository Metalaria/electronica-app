          - { expr: "I0_i*(1 - ceil((t - to_i)/1e9)) + ceil((t - to_i)/1e9)*(1 - rueda_i)*max(0, (I0_i + Vx_i/R_i)*exp(-(t - to_i)*R_i/L_i) - Vx_i/R_i)", color: azul, rotulo: "i_{D}", mide: corriente, discontinua: true }
      mandos:
        - { valor: rueda_i }

  - id: rectificador-toma-media
