  - id: sallen-key
    tipo: explorar
    titulo: "Sallen-Key paso bajo"
    texto: "Cambie el condensador que realimenta desde la salida."
    libro: [112]
    widget:
      tipo: circuito
      esquema: sallen-key
      piezas: { fuente: Vp_sk, f: f_sk, r1: R1_sk, r2: R2_sk, c1: C1_sk, c2: C2_sk }
      lectura: { valor: f0_sk, rotulo: "Frecuencia propia" }
      mide: { salida_amp: A_sk, salida_fase: phd_sk }
      grafica:
        x: { id: nu, min: 10, max: 100000, unidad: Hz, rotulo: "f", escala: log }
        y: { min: 0, max: 1.5, unidad: V, rotulo: "amplitud" }
        curvas:
          - { expr: "Vp_sk/sqrt((1 - (2*pi*nu)^2*R1_sk*R2_sk*C1_sk*C2_sk)^2 + (2*pi*nu*C2_sk*(R1_sk + R2_sk))^2)", color: naranja, rotulo: "v_{o}", mide: salida_amp }
      mandos:
        - { valor: C1_sk, lista: [10e-9, 22e-9, 47e-9] }

