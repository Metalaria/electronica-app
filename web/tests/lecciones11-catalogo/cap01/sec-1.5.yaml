# Test lesson (not published): one card for every circuit schematic and graph of the 1.1 widget catalogue
# (contenido/lecciones11/GUIA.md §5), so the unit tests check each schematic's model against ngspice through the
# generator and the browser test renders, operates and audits each one. The values are the book's examples where it has
# them.
# Texts carry no numbers on purpose (the generator would ask for their source).
leccion: cap01/sec-1.5

libro:
  112: "En un circuito lineal con varias fuentes"
  116: "Cualquier red lineal de dos terminales"

