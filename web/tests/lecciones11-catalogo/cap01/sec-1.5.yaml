  - id: media-onda
    tipo: explorar
    titulo: "Media onda con filtro"
    texto: "Cambie el condensador."
    libro: [112]
    widget:
      tipo: circuito
      esquema: media-onda
      piezas: { fuente: V_rp, f: f_red, vd: V_rd, c: C_rf, carga: R_rl }
      lectura: { valor: V_r1, rotulo: "Pico de la salida" }
      grafica:
        x: { id: t, min: 0, max: 0.04, unidad: s, rotulo: "t" }
        y: { min: -18, max: 18, unidad: V, rotulo: "v" }
        curvas:
          - { expr: "V_rp*sin(2*pi*f_red*t)", color: tinta, rotulo: "entrada", mide: entrada, discontinua: true }
          - { expr: "max(V_rp*sin(2*pi*f_red*t) - V_rd, V_r1*exp(-(t - T_red/4 - T_red*floor((t - T_red/4)/T_red))/tau_r))", color: naranja, rotulo: "salida", mide: salida }
      mandos:
        - { valor: C_rf, lista: [470e-6, 1000e-6, 2200e-6] }

  - id: media-onda-sin
    tipo: explorar
    titulo: "Media onda sin filtro"
    texto: "Mueva la carga."
    libro: [112]
    widget:
      tipo: circuito
      esquema: media-onda
      piezas: { fuente: V_rp, f: f_red, vd: V_rd, carga: R_rl }
      dibujo: false
      grafica:
        x: { id: t, min: 0, max: 0.04, unidad: s, rotulo: "t" }
        y: { min: -18, max: 18, unidad: V, rotulo: "v" }
        curvas:
          - { expr: "max(V_rp*sin(2*pi*f_red*t) - V_rd, 0)", color: naranja, rotulo: "salida", mide: salida }
      mandos:
        - { valor: R_rl, lista: [100, 1000] }

  - id: puente
    tipo: explorar
    titulo: "Puente con filtro"
    texto: "Cambie el condensador."
    libro: [112]
    widget:
      tipo: circuito
      esquema: puente
      piezas: { fuente: V_rp, f: f_red, vd: V_rd, c: C_rf, carga: R_rl }
