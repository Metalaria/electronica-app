          - { expr: "Ap_ac*sin(2*pi*f_ac*t)", color: tinta, rotulo: "v_{in}", mide: entrada, discontinua: true }
          - { expr: "Vs_ao*(2*abs(floor((2*pi*f_ac*t - 2*pi*floor(f_ac*t) - th_ac)/pi)) - 1)", color: naranja, rotulo: "v_{o}", mide: salida }
      mandos:
        - { valor: R2_ac, lista: [47000, 100000, 220000] }

  - id: mosfet
