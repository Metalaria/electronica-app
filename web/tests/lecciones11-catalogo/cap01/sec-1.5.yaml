        curvas:
          - { expr: "e_cr - a_cr + 2*a_cr*(t*f_cr - floor(t*f_cr)) + ru_cr*(sin(2*pi*37*f_cr*t) + sin(2*pi*61*f_cr*t) + sin(2*pi*97*f_cr*t))/3", color: tinta, rotulo: "v_{in}", mide: entrada }
          - { expr: "Vs_cr*(1 - 2*ceil((e_cr - a_cr + 2*a_cr*(t*f_cr - floor(t*f_cr)) + ru_cr*(sin(2*pi*37*f_cr*t) + sin(2*pi*61*f_cr*t) + sin(2*pi*97*f_cr*t))/3 - Vr_cr)/1e9))", color: naranja, rotulo: "v_{o}", mide: salida }
