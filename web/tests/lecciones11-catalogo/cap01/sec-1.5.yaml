  - id: recortador
    tipo: explorar
    titulo: "Recortador"
    texto: "Conecte las ramas, cambie el Zener y la referencia."
    libro: [112]
    widget:
      tipo: circuito
      esquema: recortador
      piezas: { fuente: V_kp, f: f_k, r: R_k, vd: V_kd, positivo: k_pos, negativo: k_neg, vz: V_kz, vref: V_kr }
      lectura: { valor: V_ka, rotulo: "Recorte positivo" }
      grafica:
        x: { id: t, min: 0, max: 0.002, unidad: s, rotulo: "t" }
        y: { min: -10, max: 10, unidad: V, rotulo: "v" }
        curvas:
          - { expr: "V_kp*sin(2*pi*f_k*t)", color: tinta, rotulo: "entrada", mide: entrada, discontinua: true }
          - { expr: "max(min(V_kp*sin(2*pi*f_k*t), V_ka), V_kb)", color: naranja, rotulo: "salida", mide: salida }
      mandos:
        - { valor: k_pos, tipo: interruptor, rotulo: "Rama positiva" }
        - { valor: k_neg, tipo: interruptor, rotulo: "Rama negativa" }
        - { valor: V_kz, lista: [3.3, 5.1] }
        - { valor: V_kr, lista: [0, 1] }

  - id: recortador-antiserie
