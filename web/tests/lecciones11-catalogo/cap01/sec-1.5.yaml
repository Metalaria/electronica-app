      mandos:
        - { valor: Vi_ac, min: -3, max: 3, paso: 0.5 }
        - { valor: alto_ac, tipo: interruptor, rotulo: "Salida en alto antes" }

  - id: comparador-schmitt-tiempo
    tipo: explorar
    titulo: "Schmitt en el tiempo"
