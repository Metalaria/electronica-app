        curvas:
          - { expr: "max(abs(Vp_tm*sin(2*pi*f_tm*t)) - Vd_tm, Vpk_tm - I_tm/C_tm*(t - 1/(4*f_tm) - floor(2*f_tm*t - 0.5)/(2*f_tm)))", color: naranja, rotulo: "+V", mide: positivo }
          - { expr: "-(max(abs(Vp_tm*sin(2*pi*f_tm*t)) - Vd_tm, Vpk_tm - I_tm/C_tm*(t - 1/(4*f_tm) - floor(2*f_tm*t - 0.5)/(2*f_tm))))", color: azul, rotulo: "−V", mide: negativo }
