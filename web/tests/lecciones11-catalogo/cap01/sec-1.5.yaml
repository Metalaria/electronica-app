          - { expr: "Ap_ag*(1 - 2*floor(2*(t/T_ag - floor(t/T_ag))))", color: tinta, rotulo: "v_{in}", mide: entrada, discontinua: true }
          - { expr: "-Ap_ag/(R_ag*C_ag)*(T_ag/2 - abs(t - T_ag*floor(t/T_ag) - T_ag/2))", color: naranja, rotulo: "v_{o}", mide: salida }
