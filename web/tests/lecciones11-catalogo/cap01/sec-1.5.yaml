          - { expr: "e_cn - a_cn + 4*a_cn*abs(t*f_cn - floor(t*f_cn + 0.5))", color: tinta, rotulo: "v_{in}", mide: entrada, discontinua: true }
          - { expr: "Vn_cn + (Vs_cn - Vn_cn)*(ceil((t*f_cn - floor(t*f_cn) - ph1_cn)/1e9) - ceil((t*f_cn - floor(t*f_cn) - ph2_cn)/1e9))", color: naranja, rotulo: "v_{o}", mide: salida }
