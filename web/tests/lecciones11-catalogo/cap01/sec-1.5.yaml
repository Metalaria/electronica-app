          - { expr: "Vp_sk*sin(w_sk*t)", color: tinta, rotulo: "entrada", mide: entrada, discontinua: true }
          - { expr: "A_sa*sin(w_sk*t + ph_sa)", color: naranja, rotulo: "v_{o}", mide: salida }
      mandos:
        - { valor: f_sk, lista: [500, 1000, 2000] }

