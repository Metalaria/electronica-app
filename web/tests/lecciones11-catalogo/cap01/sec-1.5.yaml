        curvas:
          - { expr: "VDD_m - (1 - ceil(t*f_w - floor(t*f_w) - D_w))*(VDD_m - Von_w)", color: naranja, rotulo: "v_{D}", mide: drenador }
          - { expr: "Vi_w*(1 - ceil(t*f_w - floor(t*f_w) - D_w))", color: azul, rotulo: "v_{G}", mide: puerta, discontinua: true }
