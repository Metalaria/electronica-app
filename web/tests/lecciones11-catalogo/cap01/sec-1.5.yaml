        x: { id: t, min: 0, max: 0.002, unidad: s, rotulo: "t" }
        y: { min: -0.02, max: 0.02, unidad: A, rotulo: "i" }
        curvas:
          - { expr: "(V_kp*sin(2*pi*f_k*t) - max(min(V_kp*sin(2*pi*f_k*t), V_kz + V_kd), -V_kz - V_kd))/R_k", color: azul, rotulo: "i", mide: i }
      mandos:
        - { valor: V_kz, lista: [3.3, 5.1] }

  - id: fijador
