    et2_dr: { sim: "SALDA", nombre: "etiqueta mal escrita", unidad: "", valor: 0 }
    # grafica con muestras (esquemas12c; sección 22.12: la AM de 100 kHz con 1 kHz) y carga-rc con una marca al 90 %
    Ap_am: { sim: "A", nombre: "amplitud de la portadora", unidad: V, valor: 1 }
    m_am: { sim: "m", nombre: "índice de modulación", unidad: "", valor: 0.5 }
    fp_am: { sim: "f_{p}", nombre: "frecuencia de la portadora", unidad: Hz, valor: 100000 }
    fm_am: { sim: "f_{m}", nombre: "frecuencia moduladora", unidad: Hz, valor: 1000 }
    V_cm: { sim: "V", nombre: "tensión de la fuente", unidad: V, valor: 10 }
    R_cm: { sim: "R", nombre: "resistencia", unidad: Ω, valor: 10000 }
    C_cm: { sim: "C", nombre: "condensador", unidad: F, valor: 100e-6 }
    V0_cm: { sim: "v₀", nombre: "tensión inicial", unidad: V, valor: 0 }
  calculos:
    V_ka: { si: k_pos, entonces: "V_kr + V_kz + V_kd", sino: "1000", sim: "V_{techo}", nombre: "recorte positivo", unidad: V }
    V_kb: { si: k_neg, entonces: "-V_kd", sino: "-1000", sim: "V_{suelo}", nombre: "recorte negativo", unidad: V }
    V_ksh: { si: k_sube, entonces: "V_kp - V_kd", sino: "V_kd - V_kp", sim: "ΔV", nombre: "desplazamiento del fijador", unidad: V }
    V_kdo: { si: k_sube, entonces: "2*V_kp - 2*V_kd", sino: "2*V_kd - 2*V_kp", sim: "V_{salida}", nombre: "salida del doblador", unidad: V }
    I_er: { expr: "(V_ec - V_BE)/R_er", sim: "I_{ref}", nombre: "corriente de referencia", unidad: A }
    I_ec1: { expr: "I_er/(1 + (1 + exp(dV_e/V_Te))/beta)", sim: "I_{C1}", nombre: "corriente de colector de Q1", unidad: A }
    I_eo: { expr: "I_ec1*exp(dV_e/V_Te)", sim: "I_{salida}", nombre: "corriente copiada", unidad: A }
    V_eo: { expr: "V_ec - I_eo*R_el", sim: "V_{C2}", nombre: "tensión de colector de Q2", unidad: V }
    R_cs1: { si: cs_on, entonces: "par(R_cf1, R_ce)", sino: "R_cf1", sim: "R₁", nombre: "resistencia en paralelo con C₁", unidad: Ω }
    R_cs2: { si: cs_on, entonces: "par(R_cf2, R_ce)", sino: "R_cf2", sim: "R₂", nombre: "resistencia en paralelo con C₂", unidad: Ω }
    I_cs: { expr: "V_cs/(R_cs1 + R_cs2)", sim: "I", nombre: "corriente de la fuente", unidad: A }
    V_cs1: { expr: "I_cs*R_cs1", sim: "V₁", nombre: "tensión en C₁", unidad: V }
    V_cs2: { expr: "I_cs*R_cs2", sim: "V₂", nombre: "tensión en C₂", unidad: V }
    I_csf1: { expr: "V_cs1/R_cf1", sim: "I_{f1}", nombre: "fuga de C₁", unidad: A }
    I_csf2: { expr: "V_cs2/R_cf2", sim: "I_{f2}", nombre: "fuga de C₂", unidad: A }
    I_cse: { si: cs_on, entonces: "V_cs1/R_ce", sino: "0", sim: "I_{e}", nombre: "corriente por la de equilibrado", unidad: A }
    R_cb: { expr: "(10*c_1 + c_2)*10^c_m", sim: "R", nombre: "resistencia", unidad: Ω }
    I_cb: { expr: "V_cb/R_cb", sim: "I", nombre: "corriente", unidad: A }
    v_a: { expr: "V_a*exp(-1)", sim: "v(τ)", nombre: "tensión en un τ", unidad: V }
    I_o: { expr: "V_o/R_o", sim: "I", nombre: "corriente", unidad: A }
    I_s: { expr: "V_s/(R_s1 + R_s2 + R_s3 + R_s4)", sim: "I", nombre: "corriente", unidad: A }
    V_s1: { expr: "I_s*R_s1", sim: "V₁", nombre: "tensión en R₁", unidad: V }
    V_s2: { expr: "I_s*R_s2", sim: "V₂", nombre: "tensión en R₂", unidad: V }
    V_s3: { expr: "I_s*R_s3", sim: "V₃", nombre: "tensión en R₃", unidad: V }
    V_s4: { expr: "I_s*R_s4", sim: "V₄", nombre: "tensión en R₄", unidad: V }
    R_mp: { expr: "par(R_m2, R_m3)", sim: "R₂ ‖ R₃", nombre: "paralelo", unidad: Ω }
    I_m: { expr: "V_m/(R_m1 + R_mp)", sim: "I", nombre: "corriente total", unidad: A }
    V_mp: { expr: "I_m*R_mp", sim: "V_{p}", nombre: "tensión del paralelo", unidad: V }
    V_m1: { expr: "I_m*R_m1", sim: "V₁", nombre: "tensión en R₁", unidad: V }
    I_m2: { expr: "V_mp/R_m2", sim: "I₂", nombre: "corriente por R₂", unidad: A }
    I_m3: { expr: "V_mp/R_m3", sim: "I₃", nombre: "corriente por R₃", unidad: A }
    E_k1: { expr: "V_k1*k_on1", sim: "E₁", nombre: "fuente izquierda efectiva", unidad: V }
    E_k2: { expr: "V_k2*k_on2", sim: "E₂", nombre: "fuente derecha efectiva", unidad: V }
    V_kn: { expr: "(E_k1/R_k1 + E_k2/R_k2)/(1/R_k1 + 1/R_k2 + 1/R_k3)", sim: "V_{nodo}", nombre: "tensión del nodo", unidad: V }
    I_k1: { expr: "(E_k1 - V_kn)/R_k1", sim: "I₁", nombre: "corriente de la izquierda", unidad: A }
    I_k2: { expr: "(E_k2 - V_kn)/R_k2", sim: "I₂", nombre: "corriente de la derecha", unidad: A }
    I_k3: { expr: "V_kn/R_k3", sim: "I₃", nombre: "corriente por la carga", unidad: A }
    V_wa0: { expr: "V_w*R_w2/(R_w1 + R_w2)", sim: "V_{a0}", nombre: "punto medio izquierdo en vacío", unidad: V }
    V_wb0: { expr: "V_w*R_w4/(R_w3 + R_w4)", sim: "V_{b0}", nombre: "punto medio derecho en vacío", unidad: V }
    I_wd: { expr: "(V_wa0 - V_wb0)/(par(R_w1, R_w2) + R_wd + par(R_w3, R_w4))", sim: "I_{d}", nombre: "corriente del detector", unidad: A }
    V_wa: { expr: "V_wa0 - I_wd*par(R_w1, R_w2)", sim: "V_{a}", nombre: "punto medio izquierdo", unidad: V }
    V_wb: { expr: "V_wb0 + I_wd*par(R_w3, R_w4)", sim: "V_{b}", nombre: "punto medio derecho", unidad: V }
    V_wab: { expr: "V_wa - V_wb", sim: "V_{ab}", nombre: "tensión del detector", unidad: V, cifras: 3 }
    V_wv: { expr: "V_wa0 - V_wb0", sim: "V_{ab}", nombre: "tensión del detector ideal", unidad: V }
    I_w: { expr: "(V_w - V_wa)/R_w1 + (V_w - V_wb)/R_w3", sim: "I", nombre: "corriente de la fuente", unidad: A }
    V_to: { si: t_on, entonces: "V_t*R_tl/(R_ti + R_tl)", sino: "V_t", sim: "V_{bornes}", nombre: "tensión en bornes", unidad: V }
    I_t: { si: t_on, entonces: "V_t/(R_ti + R_tl)", sino: "0", sim: "I", nombre: "corriente", unidad: A }
    V_ti: { expr: "I_t*R_ti", sim: "V_{int}", nombre: "caída interna", unidad: V }
    V_no: { si: n_on, entonces: "I_n*par(R_n, R_nl)", sino: "I_n*R_n", sim: "V", nombre: "tensión en bornes", unidad: V }
    I_nl: { si: n_on, entonces: "V_no/R_nl", sino: "0", sim: "I_{L}", nombre: "corriente por la carga", unidad: A }
    I_nr: { expr: "V_no/R_n", sim: "I_{R}", nombre: "corriente por R_Th", unidad: A }
    V_2: { expr: "V_1*N_2/N_1", sim: "V₂", nombre: "tensión del secundario", unidad: V }
    I_2: { si: tr_on, entonces: "V_2/R_2l", sino: "0", sim: "I₂", nombre: "corriente del secundario", unidad: A }
    I_1: { expr: "I_2*N_2/N_1", sim: "I₁", nombre: "corriente del primario", unidad: A }
    tau_c: { expr: "R_c*C_c", sim: "τ", nombre: "constante de tiempo", unidad: s }
    V_cf: { si: c_modo, entonces: "V_c", sino: "0", sim: "V_{final}", nombre: "tensión final", unidad: V }
    v_tau: { expr: "V_c0 + 0.632*(V_cf - V_c0)", sim: "v(τ)", nombre: "tensión en un τ", unidad: V }
    tau_l: { expr: "L_l/R_l", sim: "τ", nombre: "constante de tiempo", unidad: s }
    I_lf: { si: l_modo, entonces: "V_l/R_l", sino: "0", sim: "I_{final}", nombre: "corriente final", unidad: A }
    V_lf: { si: l_modo, entonces: "V_l", sino: "0", sim: "V_{fuente}", nombre: "tensión aplicada", unidad: V }
    w_f: { expr: "2*pi*f_f", sim: "ω", nombre: "frecuencia angular", unidad: "rad/s" }
    x_c: { expr: "w_f*R_f*C_f", sim: "ωRC", nombre: "ωRC", unidad: "" }
    A_c: { expr: "V_p/sqrt(1 + x_c^2)", sim: "V_{C}", nombre: "amplitud en C", unidad: V }
    A_r: { expr: "V_p*x_c/sqrt(1 + x_c^2)", sim: "V_{R}", nombre: "amplitud en R", unidad: V }
    ph_c: { expr: "phi_f - atan(x_c)*180/pi", sim: "φ_{C}", nombre: "fase en C", unidad: "°" }
    f_c: { expr: "1/(2*pi*R_f*C_f)", sim: "f_{c}", nombre: "frecuencia de corte", unidad: Hz }
    x_l: { expr: "w_f*L_g/R_g", sim: "ωL/R", nombre: "ωL/R", unidad: "" }
    A_l: { expr: "V_p*x_l/sqrt(1 + x_l^2)", sim: "V_{L}", nombre: "amplitud en L", unidad: V }
    w_r: { expr: "2*pi*f_r", sim: "ω", nombre: "frecuencia angular", unidad: "rad/s" }
    X_r: { expr: "w_r*L_r - 1/(w_r*C_r)", sim: "X", nombre: "reactancia total", unidad: Ω }
    Z_r: { expr: "sqrt(R_r^2 + X_r^2)", sim: "Z", nombre: "impedancia", unidad: Ω }
    ph_i: { expr: "-atan2(X_r, R_r)", sim: "φ_{I}", nombre: "fase de la corriente", unidad: rad }
    f_0: { expr: "1/(2*pi*sqrt(L_r*C_r))", sim: "f₀", nombre: "frecuencia de resonancia", unidad: Hz }
    I_0: { expr: "V_p/R_r", sim: "I_{máx}", nombre: "corriente en resonancia", unidad: A }
    w_p: { expr: "2*pi*f_p", sim: "ω", nombre: "frecuencia angular", unidad: "rad/s" }
    d_pi: { expr: "R_ps*(w_p*C_p - 1/(w_p*L_p))", sim: "d", nombre: "parte imaginaria", unidad: "" }
    d_pr: { expr: "1 + R_ps/R_pp", sim: "d", nombre: "parte real", unidad: "" }
    A_t: { expr: "V_p/sqrt(d_pr^2 + d_pi^2)", sim: "V_{t}", nombre: "amplitud del tanque", unidad: V }
    ph_t: { expr: "-atan2(d_pi, d_pr)", sim: "φ_{t}", nombre: "fase del tanque", unidad: rad }
    f_0p: { expr: "1/(2*pi*sqrt(L_p*C_p))", sim: "f₀", nombre: "frecuencia de resonancia", unidad: Hz }
    I_ds: { expr: "n_d*V_T/R_d*wright(ln(I_S*R_d/(n_d*V_T)) + (V_d + I_S*R_d)/(n_d*V_T)) - I_S", sim: "I_{D}", nombre: "corriente del diodo", unidad: A }
    V_ds: { expr: "V_d - I_ds*R_d", sim: "V_{D}", nombre: "tensión del diodo", unidad: V }
    I_dc: { expr: "max(0, (V_d - V_D)/R_d)", sim: "I_{D}", nombre: "corriente del diodo", unidad: A }
    V_dc: { expr: "V_d - I_dc*R_d", sim: "V_{D}", nombre: "tensión del diodo", unidad: V }
    I_e: { expr: "(V_e - V_fe)/R_e", sim: "I", nombre: "corriente del LED", unidad: A }
    V_zd: { si: z_on, entonces: "V_zi*R_zl/(R_zs + R_zl)", sino: "V_zi", sim: "V_{div}", nombre: "salida sin Zener", unidad: V }
    V_zon: { si: z_on, entonces: "(V_zi/R_zs + V_z/r_z)/(1/R_zs + 1/r_z + 1/R_zl)", sino: "(V_zi/R_zs + V_z/r_z)/(1/R_zs + 1/r_z)", sim: "V_{on}", nombre: "salida con el Zener conduciendo", unidad: V }
    V_zo: { expr: "min(V_zd, V_zon)", sim: "V_{salida}", nombre: "tensión de salida", unidad: V }
    I_zs: { expr: "(V_zi - V_zo)/R_zs", sim: "I_{s}", nombre: "corriente por R_s", unidad: A }
    I_zl: { si: z_on, entonces: "V_zo/R_zl", sino: "0", sim: "I_{L}", nombre: "corriente de carga", unidad: A }
    I_zz: { expr: "I_zs - I_zl", sim: "I_{Z}", nombre: "corriente del Zener", unidad: A }
    T_red: { expr: "1/f_red", sim: "T", nombre: "periodo de la red", unidad: s }
    V_r1: { expr: "V_rp - V_rd", sim: "V_{pico}", nombre: "pico de la salida, media onda", unidad: V }
    V_r2: { expr: "V_rp - 2*V_rd", sim: "V_{pico}", nombre: "pico de la salida, puente", unidad: V }
    tau_r: { expr: "R_rl*C_rf", sim: "τ", nombre: "constante de descarga", unidad: s }
    I_bb: { expr: "max(0, (V_bi - V_BE)/R_bb)", sim: "I_{B}", nombre: "corriente de base", unidad: A }
    I_bc: { expr: "min(beta*I_bb, (V_cc - V_CEs)/R_bc)", sim: "I_{C}", nombre: "corriente de colector", unidad: A }
    V_bce: { expr: "V_cc - I_bc*R_bc", sim: "V_{CE}", nombre: "tensión colector-emisor", unidad: V }
    V_pth: { expr: "V_cc*R_p2/(R_p1 + R_p2)", sim: "V_{Th}", nombre: "tensión de Thévenin", unidad: V }
    I_pb: { expr: "(V_pth - V_BE)/(par(R_p1, R_p2) + (beta + 1)*R_pe)", sim: "I_{B}", nombre: "corriente de base", unidad: A }
    I_pc: { expr: "beta*I_pb", sim: "I_{C}", nombre: "corriente de colector", unidad: A }
    V_pe: { expr: "(beta + 1)*I_pb*R_pe", sim: "V_{E}", nombre: "tensión de emisor", unidad: V }
    V_pb: { expr: "V_pe + V_BE", sim: "V_{B}", nombre: "tensión de base", unidad: V }
    V_pc: { expr: "V_cc - I_pc*R_pc", sim: "V_{C}", nombre: "tensión de colector", unidad: V }
    V_pce: { expr: "V_pc - V_pe", sim: "V_{CE}", nombre: "tensión colector-emisor", unidad: V }
    # fuente-controlada: VCCS (r_o en paralelo) y VCVS (r_o en serie)
    I_fc: { expr: "gm_fc*v_fc", sim: "g_{m} · v", nombre: "corriente controlada", unidad: A }
    V_fco: { si: on_fc, entonces: "I_fc*par(ro_fc, RL_fc)", sino: "I_fc*ro_fc", sim: "v_{o}", nombre: "tensión de salida", unidad: V }
    I_fcl: { si: on_fc, entonces: "V_fco/RL_fc", sino: "0", sim: "I_{L}", nombre: "corriente por la carga", unidad: A }
    I_fcr: { expr: "V_fco/ro_fc", sim: "I_{ro}", nombre: "corriente por r_o", unidad: A }
    E_fc: { expr: "av_fc*v_fc", sim: "A_{v} · v", nombre: "tensión controlada", unidad: V }
    I_fcv: { si: on_fc, entonces: "E_fc/(rs_fc + RL_fc)", sino: "0", sim: "I_{L}", nombre: "corriente por la carga", unidad: A }
    V_fcv: { expr: "E_fc - I_fcv*rs_fc", sim: "v_{o}", nombre: "tensión de salida", unidad: V }
    # figura 22.9: el nodo, (V − 12)/4 + V/3 = 2 en vacío
    V_fta: { si: on_ft, entonces: "(V_ft/Rs_ft + I_ft)/(1/Rs_ft + 1/Rp_ft + 1/RL_ft)", sino: "(V_ft/Rs_ft + I_ft)/(1/Rs_ft + 1/Rp_ft)", sim: "V", nombre: "tensión entre los terminales", unidad: V }
    I_fts: { expr: "(V_ft - V_fta)/Rs_ft", sim: "I₁", nombre: "corriente de la rama de la fuente de tensión", unidad: A }
    I_ftp: { expr: "V_fta/Rp_ft", sim: "I₂", nombre: "corriente por R₂", unidad: A }
    I_ftl: { si: on_ft, entonces: "V_fta/RL_ft", sino: "0", sim: "I_{L}", nombre: "corriente por la carga", unidad: A }
    # sallen-key: H = 1/(1 + s·C₂·(R₁ + R₂) + s²·R₁·R₂·C₁·C₂), ideal
    f0_sk: { expr: "1/(2*pi*sqrt(R1_sk*R2_sk*C1_sk*C2_sk))", sim: "f_{0}", nombre: "frecuencia propia", unidad: Hz }
    Q_sk: { expr: "sqrt(R1_sk*R2_sk*C1_sk*C2_sk)/(C2_sk*(R1_sk + R2_sk))", sim: "Q", nombre: "factor de calidad", unidad: "" }
    w_sk: { expr: "2*pi*f_sk", sim: "ω", nombre: "frecuencia angular", unidad: "rad/s" }
    A_sk: { expr: "Vp_sk/sqrt((1 - w_sk^2*R1_sk*R2_sk*C1_sk*C2_sk)^2 + (w_sk*C2_sk*(R1_sk + R2_sk))^2)", sim: "V_{o}", nombre: "amplitud de salida", unidad: V }
    ph_sk: { expr: "-atan2(w_sk*C2_sk*(R1_sk + R2_sk), 1 - w_sk^2*R1_sk*R2_sk*C1_sk*C2_sk)", sim: "φ", nombre: "fase de la salida", unidad: "" }
    phd_sk: { expr: "ph_sk*180/pi", sim: "φ", nombre: "fase de la salida en grados", unidad: "°" }
    # sallen-key con el operacional real (un polo, A₀ = 10⁵): H = N(s)/D(s), coeficientes en GUIA.md
    wp_sk: { expr: "2*pi*gbw_sk/100000", sim: "ω_{p}", nombre: "polo del operacional", unidad: "rad/s" }
    n0_sk: { expr: "100000*wp_sk", sim: "n₀", nombre: "coeficiente n₀", unidad: "" }
    n1_sk: { expr: "C1_sk*ro_sk*wp_sk", sim: "n₁", nombre: "coeficiente n₁", unidad: "" }
    n2_sk: { expr: "C1_sk*ro_sk*(1 + C2_sk*R2_sk*wp_sk)", sim: "n₂", nombre: "coeficiente n₂", unidad: "" }
    n3_sk: { expr: "C1_sk*C2_sk*R2_sk*ro_sk", sim: "n₃", nombre: "coeficiente n₃", unidad: "" }
    d0_sk: { expr: "100001*wp_sk", sim: "d₀", nombre: "coeficiente d₀", unidad: "" }
    d1_sk: { expr: "1 + wp_sk*(100001*C2_sk*(R1_sk + R2_sk) + C1_sk*(R1_sk + ro_sk))", sim: "d₁", nombre: "coeficiente d₁", unidad: "" }
    d2_sk: { expr: "C1_sk*(R1_sk + ro_sk) + C2_sk*(R1_sk + R2_sk) + wp_sk*C1_sk*C2_sk*(100001*R1_sk*R2_sk + ro_sk*(R1_sk + R2_sk))", sim: "d₂", nombre: "coeficiente d₂", unidad: "" }
    d3_sk: { expr: "C1_sk*C2_sk*(R1_sk*R2_sk + ro_sk*(R1_sk + R2_sk))", sim: "d₃", nombre: "coeficiente d₃", unidad: "" }
    # sallen-key-alto: H = s²·R₁·R₂·C₁·C₂/(1 + s·R₁·(C₁ + C₂) + s²·R₁·R₂·C₁·C₂), ideal
    f0_sa: { expr: "1/(2*pi*sqrt(R1_sa*R2_sa*C1_sa*C2_sa))", sim: "f_{0}", nombre: "frecuencia propia", unidad: Hz }
    T_sa: { expr: "w_sk^2*R1_sa*R2_sa*C1_sa*C2_sa", sim: "ω²T", nombre: "ω²·R₁·R₂·C₁·C₂", unidad: "" }
    A_sa: { expr: "Vp_sk*T_sa/sqrt((1 - T_sa)^2 + (w_sk*R1_sa*(C1_sa + C2_sa))^2)", sim: "V_{o}", nombre: "amplitud de salida", unidad: V }
    ph_sa: { expr: "pi - atan2(w_sk*R1_sa*(C1_sa + C2_sa), 1 - T_sa)", sim: "φ", nombre: "fase de la salida", unidad: "" }

    # 1.2 (esquemas12)
    Vo_ai: { expr: "max(-Vs_ao, min(Vs_ao, -R2_ai/R1_ai*Vi_ai))", sim: "v_{o}", nombre: "tensión de salida", unidad: V }
    Vn_ai: { expr: "(Vi_ai*R2_ai + Vo_ai*R1_ai)/(R1_ai + R2_ai)", sim: "v_{−}", nombre: "tensión de la entrada −", unidad: V }
    I1_ai: { expr: "(Vi_ai - Vn_ai)/R1_ai", sim: "I₁", nombre: "corriente por R₁", unidad: A }
    w_ai: { expr: "2*pi*f_ai", sim: "ω", nombre: "pulsación", unidad: "rad/s" }
    G_an: { expr: "1 + R2_an/R1_an", sim: "G", nombre: "ganancia ideal", unidad: "" }
    fp_an: { expr: "gbw_an/100000", sim: "f_{p}", nombre: "polo en lazo abierto", unidad: Hz }
    G_386: { expr: "1 + R2_386/R1_386", sim: "G", nombre: "ganancia", unidad: "" }
    Vo_as: { expr: "-Rf_as*(Vi_as/R_as + V2_as/R_as + V3_as/R_as)", sim: "v_{o}", nombre: "tensión de salida", unidad: V }
    T_ag: { expr: "1/f_ag", sim: "T", nombre: "periodo", unidad: s }
    Vh_ac: { expr: "Vs_ao*R1_ac/(R1_ac + R2_ac)", sim: "V_{U}", nombre: "umbral", unidad: V }
    hi_ac: { expr: "1 - ceil((Vi_ac - Vh_ac)/1e9)", sim: "a", nombre: "el alto se sostiene", unidad: "" }
    lo_ac: { expr: "ceil((Vi_ac + Vh_ac)/1e9)", sim: "b", nombre: "el bajo se sostiene", unidad: "" }
    Vo_ac: { expr: "Vs_ao*(2*(alto_ac*hi_ac + (1 - alto_ac)*(1 - lo_ac)) - 1)", sim: "v_{o}", nombre: "tensión de salida", unidad: V }
    Vp_ac: { expr: "Vo_ac*R1_ac/(R1_ac + R2_ac)", sim: "v_{+}", nombre: "tensión de la entrada +", unidad: V }
    th_ac: { expr: "asin(Vh_ac/Ap_ac)", sim: "θ₁", nombre: "fase del umbral", unidad: "" }
    I1_as: { expr: "Vi_as/R_as", sim: "I₁", nombre: "corriente de la entrada 1", unidad: A }
    I2_as: { expr: "V2_as/R_as", sim: "I₂", nombre: "corriente de la entrada 2", unidad: A }
    I3_as: { expr: "V3_as/R_as", sim: "I₃", nombre: "corriente de la entrada 3", unidad: A }
    Vov_m: { expr: "max(0, Vi_m - Vth_m)", sim: "V_{ov}", nombre: "tensión de saturación", unidad: V }
    b_m: { expr: "k_m*Vov_m + 1/RD_m", sim: "b", nombre: "coeficiente", unidad: "" }
    Vtri_m: { expr: "(b_m - sqrt(max(0, b_m^2 - 2*k_m*VDD_m/RD_m)))/k_m", sim: "V_{tri}", nombre: "V_DS en zona óhmica", unidad: V }
    Vsat_m: { expr: "VDD_m - RD_m*k_m*Vov_m^2/2", sim: "V_{sat}", nombre: "V_DS en saturación", unidad: V }
    VDS_m: { expr: "max(Vsat_m, min(Vov_m, Vtri_m))", sim: "V_{DS}", nombre: "tensión drenador-fuente", unidad: V }
    ID_m: { expr: "(VDD_m - VDS_m)/RD_m", sim: "I_{D}", nombre: "corriente de drenador", unidad: A }
    Vov_w: { expr: "Vi_w - Vth_m", sim: "V_{ov}", nombre: "sobretensión con la puerta alta", unidad: V }
    b_w: { expr: "k_m*Vov_w + 1/RD_w", sim: "b", nombre: "coeficiente", unidad: "" }
    Von_w: { expr: "(b_w - sqrt(b_w^2 - 2*k_m*VDD_m/RD_w))/k_m", sim: "V_{DS(on)}", nombre: "V_DS conduciendo", unidad: V }
    b_i: { expr: "k_i*(Vg_i - Vth_i) + 1/R_i", sim: "b", nombre: "coeficiente", unidad: "" }
    Von_i: { expr: "(b_i - sqrt(b_i^2 - 2*k_i*VDD_i/R_i))/k_i", sim: "V_{DS(on)}", nombre: "V_DS conduciendo", unidad: V }
    I0_i: { expr: "(VDD_i - Von_i)/R_i", sim: "I_{0}", nombre: "corriente al apagar", unidad: A }
    to_i: { expr: "1/(2*f_i)", sim: "t_{off}", nombre: "instante del apagado", unidad: s }
    Vx_i: { expr: "rueda_i*Vf_i + (1 - rueda_i)*(BV_i - VDD_i)", sim: "V_{ext}", nombre: "tensión de extinción", unidad: V }
    tx_i: { expr: "L_i/R_i*ln(1 + I0_i*R_i/Vx_i)", sim: "t_{ext}", nombre: "tiempo de extinción", unidad: s }
    Vpk_tm: { expr: "Vp_tm - Vd_tm", sim: "V_{pico}", nombre: "pico tras un diodo", unidad: V }
    dV_tm: { expr: "I_tm/(2*f_tm*C_tm)", sim: "ΔV", nombre: "rizado", unidad: V }
    Vmin_tm: { expr: "Vpk_tm - dV_tm", sim: "V_{min}", nombre: "tensión mínima entre pulsos", unidad: V }
    Nb_lm: { expr: "min(10, max(0, floor(10*Vin_lm/Vref_lm)))", sim: "N_{barra}", nombre: "LED encendidos en modo barra", unidad: "" }
    N_lm: { expr: "barra_lm*Nb_lm + (1 - barra_lm)*min(1, Nb_lm)", sim: "N", nombre: "LED encendidos", unidad: "" }
    Iref_lm: { expr: "Vref_lm/Rref_lm", sim: "I_{ref}", nombre: "corriente de R_ref", unidad: A }
    Iled_lm: { expr: "10*Iref_lm", sim: "I_{LED}", nombre: "corriente de un LED", unidad: A }
    It_lm: { expr: "N_lm*Iled_lm", sim: "I_{total}", nombre: "corriente de los LED", unidad: A }
    P_lm: { expr: "It_lm*(Vled_lm - Vf_lm)", sim: "P", nombre: "disipación en el integrado", unidad: W }
    Vset_rg: { expr: "Vr_rg*(1 + R1_rg/R2_rg)", sim: "V_{nom}", nombre: "salida nominal", unidad: V }
    Vo_rg: { expr: "min(Vset_rg, Vi_rg - Vd_rg)", sim: "V_{out}", nombre: "tensión de salida", unidad: V }
    IL_rg: { si: on_rg, entonces: "Vo_rg/RL_rg", sino: "0", sim: "I_{L}", nombre: "corriente de carga", unidad: A }
    Io_rg: { expr: "IL_rg + Vo_rg/(R1_rg + R2_rg)", sim: "I", nombre: "corriente de salida", unidad: A }
    P_rg: { expr: "(Vi_rg - Vo_rg)*Io_rg", sim: "P", nombre: "potencia en el paso", unidad: W }
    th_5: { expr: "ln(2)*(Ra_5 + Rb_5)*C_5", sim: "t_{alto}", nombre: "tiempo en alto", unidad: s }
    tl_5: { expr: "ln(2)*Rb_5*C_5", sim: "t_{bajo}", nombre: "tiempo en bajo", unidad: s }
    T_5: { expr: "th_5 + tl_5", sim: "T", nombre: "periodo", unidad: s }
    tau_sh: { expr: "Ron_sh*C_sh", sim: "τ", nombre: "constante de adquisición", unidad: s }
    Vt_sh: { expr: "V_sh - I_sh*Ron_sh", sim: "V'", nombre: "tensión a la que tiende", unidad: V }
    Vm_sh: { expr: "Vt_sh*(1 - exp(-tm_sh/tau_sh))", sim: "v_{m}", nombre: "tensión muestreada", unidad: V }
    a_re: { expr: "R_re/(2*L_re)", sim: "α", nombre: "amortiguamiento", unidad: "1/s" }
    wd_re: { expr: "sqrt(1/(L_re*C_re) - a_re^2)", sim: "ω_{d}", nombre: "pulsación amortiguada", unidad: "rad/s" }
    G_3f: { expr: "1/R1_3f + 1/R2_3f + 1/R3_3f", sim: "G", nombre: "suma de conductancias", unidad: S }
    sr_3f: { expr: "Vf_3f*(1/R1_3f + cos(2*pi/3)/R2_3f + cos(2*pi/3)/R3_3f)", sim: "a", nombre: "parte real", unidad: A }
    si_3f: { expr: "Vf_3f*(-sin(2*pi/3)/R2_3f + sin(2*pi/3)/R3_3f)", sim: "b", nombre: "parte imaginaria", unidad: A }
    xr_3f: { expr: "(1 - n_3f)*sr_3f/G_3f", sim: "x", nombre: "punto de estrella, real", unidad: V }
    xi_3f: { expr: "(1 - n_3f)*si_3f/G_3f", sim: "y", nombre: "punto de estrella, imaginaria", unidad: V }
    Vn_3f: { expr: "sqrt(xr_3f^2 + xi_3f^2)", sim: "V_{N′}", nombre: "desplazamiento del punto de estrella", unidad: V }
    V1_3f: { expr: "sqrt((Vf_3f - xr_3f)^2 + xi_3f^2)", sim: "V₁", nombre: "tensión de la carga 1", unidad: V }
    V2_3f: { expr: "sqrt((Vf_3f*cos(2*pi/3) - xr_3f)^2 + (-Vf_3f*sin(2*pi/3) - xi_3f)^2)", sim: "V₂", nombre: "tensión de la carga 2", unidad: V }
    V3_3f: { expr: "sqrt((Vf_3f*cos(2*pi/3) - xr_3f)^2 + (Vf_3f*sin(2*pi/3) - xi_3f)^2)", sim: "V₃", nombre: "tensión de la carga 3", unidad: V }
    In_3f: { expr: "n_3f*sqrt(sr_3f^2 + si_3f^2)", sim: "I_{N}", nombre: "corriente del neutro", unidad: A }
    Vc_3e: { expr: "Vf_3f*(1 + (sqrt(3) - 1)*t_3e)", sim: "V_{R}", nombre: "tensión de cada carga", unidad: V }
    Ir_3e: { expr: "Vc_3e/R_3e", sim: "I_{R}", nombre: "corriente de cada carga", unidad: A }
    Il_3e: { expr: "Ir_3e*(1 + (sqrt(3) - 1)*t_3e)", sim: "I_{L}", nombre: "corriente de línea", unidad: A }
    P_3e: { expr: "3*Vc_3e^2/R_3e", sim: "P", nombre: "potencia total", unidad: W }
    Rp_tr: { expr: "RL_tr*(N1_tr/N2_tr)^2", sim: "R'_{L}", nombre: "carga vista desde el primario", unidad: Ω }

    I_fi: { expr: "(1 - 2*inv_fi)*gm_fi*v_fi", sim: "i", nombre: "corriente hacia la salida", unidad: A }
    V_fio: { expr: "I_fi*par(ro_fi, RL_fi)", sim: "v_{o}", nombre: "tensión de salida", unidad: V }
    I_fil: { expr: "V_fio/RL_fi", sim: "I_{L}", nombre: "corriente por la carga", unidad: A }
    Ib_bl: { expr: "max(0, (Vi_bl - Vbe_bl)/Rb_bl)", sim: "I_{B}", nombre: "corriente de base", unidad: A }
    Ic_bl: { expr: "min(b_bl*Ib_bl, (Vcc_bl - Vf_bl - Vs_bl)/Rc_bl)", sim: "I_{C}", nombre: "corriente de colector", unidad: A }
    Vce_bl: { expr: "Vcc_bl - Vf_bl - Ic_bl*Rc_bl", sim: "V_{CE}", nombre: "tensión colector-emisor", unidad: V }
    Ib_bp: { expr: "max(0, (Vi_bp - Vbe_bl)/Rb_bp)", sim: "I_{B}", nombre: "corriente de base", unidad: A }
    Ic_bp: { expr: "min(b_bp*Ib_bp, (Vcc_bp - Vs_bl)/Rc_bp)", sim: "I_{C}", nombre: "corriente de colector", unidad: A }
    Vce_bp: { expr: "Vcc_bp - Ic_bp*Rc_bp", sim: "V_{CE}", nombre: "tensión colector-emisor", unidad: V }
    I_lr: { expr: "(1 - rev_lr)*max(0, (V_lr - Vf_lr)/R_lr)", sim: "I", nombre: "corriente del LED", unidad: A }
    Va_lr: { expr: "V_lr - I_lr*R_lr", sim: "V_{LED}", nombre: "tensión del LED", unidad: V }
    I_dr: { expr: "(1 - rev_lr)*max(0, (V_lr - Vd_dr)/R_lr)", sim: "I", nombre: "corriente del diodo", unidad: A }
    Va_dr: { expr: "V_lr - I_dr*R_lr", sim: "V_{D}", nombre: "tensión del diodo", unidad: V }
    Vup_cn: { expr: "Vr_cn*(1 + R1_cn/R2_cn) - Vn_cn*R1_cn/R2_cn", sim: "V_{alto}", nombre: "umbral de subida", unidad: V }
    Vdn_cn: { expr: "Vr_cn*(1 + R1_cn/R2_cn) - Vs_cn*R1_cn/R2_cn", sim: "V_{bajo}", nombre: "umbral de bajada", unidad: V }
    ph1_cn: { expr: "(Vup_cn - e_cn + a_cn)/(4*a_cn)", sim: "φ₁", nombre: "fase de la subida", unidad: "" }
    ph2_cn: { expr: "0.5 + (e_cn + a_cn - Vdn_cn)/(4*a_cn)", sim: "φ₂", nombre: "fase de la bajada", unidad: "" }
    Vo_cn: { expr: "Vn_cn + alto_cn*(Vs_cn - Vn_cn)", sim: "v_{o}", nombre: "salida en continua", unidad: V }
    Vp_cn: { expr: "(e_cn*R2_cn + Vo_cn*R1_cn)/(R1_cn + R2_cn)", sim: "V₊", nombre: "entrada +", unidad: V }
    Vth_ec: { expr: "Vcc_ec*R2_ec/(R1_ec + R2_ec)", sim: "V_{Th}", nombre: "tensión de Thévenin de la base", unidad: V }
    Ib_ec: { expr: "(Vth_ec - Vbe_ec)/(par(R1_ec, R2_ec) + (b_ec + 1)*Re_ec)", sim: "I_{B}", nombre: "corriente de base", unidad: A }
    Ic_ec: { expr: "b_ec*Ib_ec", sim: "I_{C}", nombre: "corriente de colector", unidad: A }
    Vc_ec: { expr: "Vcc_ec - Ic_ec*Rc_ec", sim: "V_{C}", nombre: "tensión de colector", unidad: V }
    gm_ec: { expr: "Ic_ec/0.02585", sim: "g_{m}", nombre: "transconductancia", unidad: S }
    rpi_ec: { expr: "b_ec/gm_ec", sim: "r_{π}", nombre: "resistencia de entrada de la base", unidad: Ω }
    RLp_ec: { expr: "par(Rc_ec, RL_ec)", sim: "R_{C} ∥ R_{L}", nombre: "carga del colector", unidad: Ω }
    B_ec: { expr: "(b_ec + 1)*Re_ec", sim: "(β + 1)·R_{E}", nombre: "R_E vista desde la base", unidad: Ω }
    tau_ec: { expr: "des_ec*Re_ec*Ce_ec", sim: "τ_{E}", nombre: "constante de tiempo del desvío", unidad: s }
    wt_ec: { expr: "2*pi*f_ec*tau_ec", sim: "ωτ", nombre: "ωτ a la frecuencia de la señal", unidad: "" }
    G_ec: { expr: "b_ec*RLp_ec*sqrt(1 + wt_ec^2)/sqrt((rpi_ec + B_ec)^2 + (wt_ec*rpi_ec)^2)", sim: "|A_{v}|", nombre: "ganancia", unidad: "" }
    Vo_ec: { expr: "A_ec*G_ec", sim: "v_{o}", nombre: "amplitud de salida", unidad: V }
    Ph_ec: { expr: "180 + (atan(wt_ec) - atan(wt_ec*rpi_ec/(rpi_ec + B_ec)))*180/pi", sim: "φ", nombre: "fase de la salida", unidad: "°" }
    D_ec: { expr: "(rpi_ec + B_ec)^2 + (wt_ec*rpi_ec)^2", sim: "D", nombre: "denominador", unidad: "" }
    Yr_ec: { expr: "1/par(R1_ec, R2_ec) + (rpi_ec + B_ec + wt_ec^2*rpi_ec)/D_ec", sim: "Re Y", nombre: "parte real de la admitancia de entrada", unidad: S }
    Yi_ec: { expr: "wt_ec*B_ec/D_ec", sim: "Im Y", nombre: "parte imaginaria de la admitancia de entrada", unidad: S }
    Ii_ec: { expr: "A_ec*sqrt(Yr_ec^2 + Yi_ec^2)", sim: "i_{in}", nombre: "corriente de entrada", unidad: A }
    Zi_ec: { expr: "A_ec/Ii_ec", sim: "Z_{in}", nombre: "impedancia de entrada", unidad: Ω }
    G0_ec: { expr: "b_ec*RLp_ec/(rpi_ec + B_ec)", sim: "|A_{v}|", nombre: "ganancia sin desvío", unidad: "" }
    It_pd: { expr: "(Vee_pd - Vbe_pd)/Ree_pd", sim: "I_{cola}", nombre: "corriente de cola", unidad: A }
    Ic_pd: { expr: "b_pd/(b_pd + 1)*It_pd/2", sim: "I_{C}", nombre: "corriente de cada colector", unidad: A }
    Vc_pd: { expr: "Vcc_pd - Ic_pd*Rc_pd", sim: "V_{C}", nombre: "tensión de colector", unidad: V }
    gm_pd: { expr: "Ic_pd/VT_pd", sim: "g_{m}", nombre: "transconductancia", unidad: S }
    Ad_pd: { expr: "gm_pd*Rc_pd/2", sim: "A_{d}", nombre: "ganancia diferencial (una salida)", unidad: "" }
    Acm_pd: { expr: "b_pd*Rc_pd/(b_pd/gm_pd + 2*(b_pd + 1)*Ree_pd)", sim: "A_{cm}", nombre: "ganancia de modo común", unidad: "" }
    Vd_pd: { expr: "Ad_pd*ad_pd", sim: "v_{c2}", nombre: "señal de salida", unidad: V }
    CMRR_pd: { expr: "Ad_pd/Acm_pd", sim: "CMRR", nombre: "rechazo del modo común", unidad: "" }
    Itc_pd: { expr: "I_pd + (Vee_pd - Vbe_pd)/ro_pd", sim: "I_{cola}", nombre: "corriente de cola", unidad: A }
    Icc_pd: { expr: "b_pd/(b_pd + 1)*Itc_pd/2", sim: "I_{C}", nombre: "corriente de cada colector", unidad: A }
    gmc_pd: { expr: "Icc_pd/VT_pd", sim: "g_{m}", nombre: "transconductancia", unidad: S }
    Acmc_pd: { expr: "b_pd*Rc_pd/(b_pd/gmc_pd + 2*(b_pd + 1)*ro_pd)", sim: "A_{cm}", nombre: "ganancia de modo común", unidad: "" }
    Vcm_pd: { expr: "Acmc_pd*acm_pd", sim: "v_{c}", nombre: "señal de modo común en cada colector", unidad: V }
    Ic1_pd: { expr: "b_pd/(b_pd + 1)*I_pd/(1 + exp(-(v1_pd - v2_pd)/VT_pd))", sim: "I_{C1}", nombre: "corriente de Q₁", unidad: A }
    Ic2_pd: { expr: "b_pd/(b_pd + 1)*I_pd - Ic1_pd", sim: "I_{C2}", nombre: "corriente de Q₂", unidad: A }
    Vbb_ab: { expr: "(1 - pu_ab)*Vbe_ab*(1 + R1_ab/R2_ab)", sim: "V_{BB}", nombre: "tensión de bias", unidad: V }
    Vin_ab: { expr: "-Vbb_ab/2", sim: "V_{driver}", nombre: "nivel del driver", unidad: V }
    Ie_ab: { expr: "max(0, (Vbb_ab - 2*Vbe_ab)/(2*Re_ab))", sim: "I_{E}", nombre: "corriente de reposo de emisor", unidad: A }
    Iq_ab: { expr: "b_ab/(b_ab + 1)*Ie_ab", sim: "I_{Q}", nombre: "corriente de reposo", unidad: A }
    Ir_ab: { expr: "max(Iq_ab, 0.005)", sim: "I_{ref}", nombre: "corriente de referencia de V_BE", unidad: A }
    k_ab: { expr: "Re_ab/RL_ab", sim: "k", nombre: "R_E/R_L", unidad: "" }
    w1_es: { expr: "2*pi*gbw_es/A0_es", sim: "ω₁", nombre: "primer polo", unidad: "rad/s" }
    w2_es: { expr: "2*pi*p2_es", sim: "ω₂", nombre: "segundo polo", unidad: "rad/s" }
    wn_es: { expr: "sqrt(w1_es*w2_es*(1 + A0_es))", sim: "ω_{n}", nombre: "pulsación propia", unidad: "rad/s" }
    z_es: { expr: "(w1_es + w2_es)/(2*wn_es)", sim: "ζ", nombre: "amortiguamiento", unidad: "" }
    G_es: { expr: "A0_es/(1 + A0_es)", sim: "G₀", nombre: "ganancia en continua", unidad: "" }
    wd_es: { expr: "wn_es*sqrt(1 - z_es^2)", sim: "ω_{d}", nombre: "pulsación amortiguada", unidad: "rad/s" }
    so_es: { expr: "100*exp(-pi*z_es/sqrt(1 - z_es^2))", sim: "sobreoscilación", nombre: "sobreoscilación", unidad: "%" }
    t0_es: { expr: "1/(2*f_es)", sim: "t₀", nombre: "instante del escalón", unidad: s }
    wp3_es: { expr: "1/(Ro_es*CL_es)", sim: "ω₃", nombre: "polo de la carga", unidad: "rad/s" }
    G_in: { expr: "(1 + 2*R_in/Rg_in)*R4_in/R3_in", sim: "G", nombre: "ganancia diferencial", unidad: "" }
    Vo_in: { expr: "G_in*(v2_in - v1_in) + Vr_in", sim: "v_{o}", nombre: "tensión de salida", unidad: V }
    Acm_in: { expr: "R4_in*(1 + eps_in)*(R3_in + R4_in)/(R3_in*(R3_in + R4_in*(1 + eps_in))) - R4_in/R3_in", sim: "A_{cm}", nombre: "ganancia de modo común", unidad: "" }
    Vcm_in: { expr: "abs(Acm_in)*acm_in", sim: "v_{o}", nombre: "salida de modo común", unidad: V }
    Vo_ti: { expr: "-Rf_ti*I_ti/(1 + 1/A0_ti)", sim: "v_{o}", nombre: "tensión de salida", unidad: V }
    wp_ti: { expr: "2*pi*gbw_ti/A0_ti", sim: "ω_{p}", nombre: "polo del operacional", unidad: "rad/s" }
    fp_ti: { expr: "sqrt(gbw_ti/(2*pi*Rf_ti*Ci_ti))", sim: "f_{pico}", nombre: "frecuencia del pico", unidad: Hz }
    Vov_mp: { expr: "max(0, VDD_mp - VG_mp - Vth_mp)", sim: "V_{ov}", nombre: "tensión de saturación", unidad: V }
    b_mp: { expr: "k_mp*Vov_mp + 1/RD_mp", sim: "b", nombre: "coeficiente", unidad: "" }
    Vtri_mp: { expr: "(b_mp - sqrt(max(0, b_mp^2 - 2*k_mp*VDD_mp/RD_mp)))/k_mp", sim: "V_{tri}", nombre: "V_SD en zona óhmica", unidad: V }
    Vsat_mp: { expr: "VDD_mp - RD_mp*k_mp*Vov_mp^2/2", sim: "V_{sat}", nombre: "V_SD en saturación", unidad: V }
    VSD_mp: { expr: "max(Vsat_mp, min(Vov_mp, Vtri_mp))", sim: "V_{SD}", nombre: "tensión fuente-drenador", unidad: V }
    ID_mp: { expr: "(VDD_mp - VSD_mp)/RD_mp", sim: "I_{D}", nombre: "corriente de drenador", unidad: A }
    Vd_mp: { expr: "VDD_mp - VSD_mp", sim: "V_{D}", nombre: "tensión de la carga", unidad: V }
    Bn_tg: { expr: "max(0, VDD_tg - Vin_tg - Vt_tg)", sim: "V_{ov,n}", nombre: "sobretensión del NMOS", unidad: V }
    Ap_tg: { expr: "max(0, Vin_tg - Vt_tg)", sim: "V_{ov,p}", nombre: "sobretensión del PMOS", unidad: V }
    Ron_tg: { expr: "1/(k_tg*(Bn_tg + Ap_tg))", sim: "R_{on}", nombre: "resistencia en conducción", unidad: Ω }
    Vo_tg: { expr: "on_tg*Vin_tg*RL_tg/(RL_tg + Ron_tg)", sim: "V_{out}", nombre: "tensión de salida", unidad: V }
    I_tg: { expr: "Vo_tg/RL_tg", sim: "I", nombre: "corriente", unidad: A }
    I_mr: { expr: "VDD_mr/(RD_mr + Ron_mr)", sim: "I_{D}", nombre: "corriente de drenador", unidad: A }
    Vds_mr: { expr: "I_mr*Ron_mr", sim: "V_{DS}", nombre: "tensión drenador-fuente", unidad: V }
    P_mr: { expr: "I_mr^2*Ron_mr", sim: "P", nombre: "potencia en el MOSFET", unidad: W }
    Vo_lm: { expr: "min(1.25*(1 + R2_lm/R1_lm) + Ia_lm*R2_lm, Vi_lm - Vd_lm)", sim: "V_{out}", nombre: "tensión de salida", unidad: V }
    IL_lm: { expr: "on_lm*Vo_lm/RL_lm", sim: "I_{L}", nombre: "corriente por la carga", unidad: A }
    Iin_lm: { expr: "IL_lm + (Vo_lm - Ia_lm*R2_lm)/(R1_lm + R2_lm) + Ia_lm", sim: "I_{in}", nombre: "corriente de entrada", unidad: A }
    Pr_lm: { expr: "(Vi_lm - Vo_lm)*Iin_lm", sim: "P", nombre: "potencia en el regulador", unidad: W }
    K0_sx: { expr: "C1_sx/(C1_sx + C2_sx)", sim: "K₀", nombre: "división en el flanco", unidad: "" }
    Ki_sx: { expr: "R2_sx/(R1_sx + R2_sx)", sim: "K_{∞}", nombre: "división en la meseta", unidad: "" }
    tau_sx: { expr: "par(R1_sx, R2_sx)*(C1_sx + C2_sx)", sim: "τ", nombre: "constante de tiempo", unidad: s }
    vh_sx: { expr: "V_sx*(Ki_sx + (K0_sx - Ki_sx)*exp(-1/(2*f_sx*tau_sx)))", sim: "v_{T/2}", nombre: "salida al final de la meseta alta", unidad: V }
    Cc_sx: { expr: "R1_sx*C1_sx/R2_sx", sim: "C_{2}", nombre: "C₂ que compensa", unidad: F }
    Vu_dr: { expr: "V_dr*(un_dr*par(R2_dr, RL_dr) + (1 - un_dr)*R2_dr)/(R1_dr + un_dr*par(R2_dr, RL_dr) + (1 - un_dr)*R2_dr)", sim: "V_{out}", nombre: "tensión de salida", unidad: V }
    Ve_dr: { expr: "V_dr*(et_dr*par(R2_dr, RL_dr) + (1 - et_dr)*R2_dr)/(R1_dr + et_dr*par(R2_dr, RL_dr) + (1 - et_dr)*R2_dr)", sim: "V_{out}", nombre: "tensión de salida", unidad: V }
    tau_cm: { expr: "R_cm*C_cm", sim: "τ", nombre: "constante de tiempo", unidad: s }

tarjetas:
  - id: resistencia
    tipo: explorar
    titulo: "Una resistencia"
    texto: "Mueva los mandos y mire la corriente."
    libro: [112]
    widget:
      tipo: circuito
      esquema: resistencia
      piezas: { fuente: V_o, r: R_o }
      lectura: { valor: I_o, rotulo: "Corriente" }
      corriente: I_o
      mide: { corriente: I_o, tension: V_o }
      mandos:
        - { valor: V_o, min: 1, max: 24, paso: 1 }
        - { valor: R_o, serie: E12, min: 100, max: 1000 }

  - id: serie
    tipo: explorar
    titulo: "Serie"
    texto: "Mueva los mandos y mire las lecturas."
    libro: [112]
    widget:
      tipo: circuito
      esquema: serie
      piezas: { fuente: V_s, r1: R_s1, r2: R_s2, r3: R_s3, r4: R_s4 }
      lectura: { valor: I_s, rotulo: "Corriente" }
      barras:
        - { valor: V_s1, rotulo: "R₁: {{V_s1}}", color: azul }
        - { valor: V_s2, rotulo: "R₂: {{V_s2}}", color: naranja }
        - { valor: V_s3, rotulo: "R₃: {{V_s3}}", color: verde }
      corriente: I_s
      mide: { corriente: I_s, v1: V_s1, v2: V_s2, v3: V_s3, v4: V_s4 }
      mandos:
        - { valor: R_s1, min: 1, max: 20, paso: 1 }
        - { valor: R_s4, lista: [1, 3, 10] }

  - id: mixto
    tipo: explorar
    titulo: "Red mixta"
    texto: "Mueva los mandos y mire las lecturas."
    libro: [112]
    widget:
      tipo: circuito
      esquema: mixto
      piezas: { fuente: V_m, r1: R_m1, r2: R_m2, r3: R_m3 }
      lectura: { valor: V_mp, rotulo: "Tensión del paralelo" }
      datos:
        - { valor: I_m2, rotulo: "I₂ = {{I_m2}}" }
        - { valor: I_m3, rotulo: "I₃ = {{I_m3}}" }
      corriente: I_m
      mide: { corriente: I_m, i2: I_m2, i3: I_m3, v1: V_m1, paralelo: V_mp }
      mandos:
        - { valor: R_m2, serie: E12, min: 100, max: 1000 }

  - id: kirchhoff
    tipo: explorar
    titulo: "Dos fuentes"
    texto: "Apague una fuente y mire el nodo."
    libro: [112]
    widget:
      tipo: circuito
      esquema: kirchhoff
      piezas: { fuente1: V_k1, fuente2: V_k2, r1: R_k1, r2: R_k2, r3: R_k3, activa1: k_on1, activa2: k_on2 }
      lectura: { valor: V_kn, rotulo: "Tensión del nodo" }
      datos:
        - { valor: I_k1, rotulo: "I₁ = {{I_k1}}" }
        - { valor: I_k2, rotulo: "I₂ = {{I_k2}}" }
        - { valor: I_k3, rotulo: "I₃ = {{I_k3}}" }
      corriente: I_k3
      mide: { nodo: V_kn, i1: I_k1, i2: I_k2, i3: I_k3 }
      mandos:
        - { valor: k_on1, tipo: interruptor, rotulo: "Fuente de la izquierda" }
        - { valor: k_on2, tipo: interruptor, rotulo: "Fuente de la derecha" }
        - { valor: R_k3, min: 500, max: 5000, paso: 500 }

  - id: wheatstone
    tipo: explorar
    titulo: "Puente"
    texto: "Mueva R₄ y busque el equilibrio."
    libro: [112]
    widget:
      tipo: circuito
      esquema: wheatstone
      piezas: { fuente: V_w, r1: R_w1, r2: R_w2, r3: R_w3, r4: R_w4, rd: R_wd }
      lectura: { valor: V_wab, rotulo: "Detector" }
      datos:
        - { valor: I_wd, rotulo: "I_{d} = {{I_wd}}" }
      corriente: I_w
      mide: { salida: V_wab, va: V_wa, vb: V_wb, corriente: I_w, detector: I_wd }
      mandos:
        - { valor: R_w4, min: 990, max: 1010, paso: 1 }

  - id: wheatstone-ideal
    tipo: explorar
    titulo: "Puente con voltímetro"
    texto: "Mueva R₄."
    libro: [112]
    widget:
      tipo: circuito
      esquema: wheatstone
      piezas: { fuente: V_w, r1: R_w1, r2: R_w2, r3: R_w3, r4: R_w4 }
      lectura: { valor: V_wv, rotulo: "Detector" }
      mide: { salida: V_wv, va: V_wa0, vb: V_wb0 }
      mandos:
        - { valor: R_w4, min: 990, max: 1010, paso: 1 }

  - id: thevenin
    tipo: sorpresa
    titulo: "Fuente real"
    texto: "Conecte la carga."
    libro: [116]
    widget:
      tipo: circuito
      esquema: thevenin
      piezas: { fuente: V_t, rth: R_ti, carga: R_tl, interruptor: t_on }
      lectura: { valor: V_to, rotulo: "Tensión en bornes" }
      corriente: I_t
      mide: { salida: V_to, corriente: I_t, interna: V_ti }
      mandos:
        - { valor: t_on, tipo: conectar, boton: "Conectar la carga" }
        - { valor: R_tl, lista: [5, 45, 100] }

  - id: norton
    tipo: explorar
    titulo: "Norton"
    texto: "Mueva la carga."
    libro: [116]
    widget:
      tipo: circuito
      esquema: norton
      piezas: { fuente: I_n, rn: R_n, carga: R_nl, interruptor: n_on }
      lectura: { valor: V_no, rotulo: "Tensión en bornes" }
      corriente: I_nl
      mide: { salida: V_no, carga: I_nl, paralelo: I_nr }
      mandos:
        - { valor: n_on, tipo: interruptor, rotulo: "Carga" }
        - { valor: R_nl, lista: [1, 2.4, 10] }

  - id: transformador
    tipo: explorar
    titulo: "Transformador"
    texto: "Cambie las espiras del secundario."
    libro: [116]
    widget:
      tipo: circuito
      esquema: transformador
      piezas: { fuente: V_1, n1: N_1, n2: N_2, carga: R_2l, interruptor: tr_on }
      lectura: { valor: V_2, rotulo: "Secundario" }
      datos:
        - { valor: I_1, rotulo: "I₁ = {{I_1}}" }
        - { valor: I_2, rotulo: "I₂ = {{I_2}}" }
      corriente: I_2
      mide: { secundario: V_2, i1: I_1, i2: I_2 }
      mandos:
        - { valor: N_2, min: 6, max: 46, paso: 2 }
        - { valor: tr_on, tipo: interruptor, rotulo: "Carga" }

  - id: carga-rc
    tipo: explorar
    titulo: "Carga del condensador"
    texto: "Cambie R y C y mire la curva."
    libro: [112]
    widget:
      tipo: circuito
      esquema: carga-rc
      piezas: { fuente: V_c, r: R_c, c: C_c, v0: V_c0, interruptor: c_modo }
      lectura: { valor: tau_c, rotulo: "Constante de tiempo" }
      grafica:
        x: { id: t, min: 0, max: 5, unidad: s, rotulo: "t" }
        y: { min: -10, max: 10, unidad: V, rotulo: "v" }
        curvas:
          - { expr: "V_c0 + (V_cf - V_c0)*(1 - exp(-t/tau_c))", color: naranja, rotulo: "v_{C}", mide: vc }
          - { expr: "(V_cf - V_c0)*exp(-t/tau_c)", color: azul, rotulo: "v_{R}", mide: vr, discontinua: true }
        marcas:
          - { x: "tau_c", y: "v_tau", rotulo: "τ: {{v_tau}}" }
      mandos:
        - { valor: R_c, lista: [4700, 10000, 22000] }
        - { valor: C_c, lista: [47e-6, 100e-6] }
        - { valor: c_modo, tipo: interruptor, rotulo: "Conmutador en carga" }

  - id: descarga-rc
    tipo: explorar
    titulo: "Descarga"
    texto: "Mueva R."
    libro: [112]
    fijar: { V_c0: 9, c_modo: 0 }
    widget:
      tipo: circuito
      esquema: carga-rc
      piezas: { fuente: V_c, r: R_c, c: C_c, v0: V_c0, interruptor: c_modo }
      dibujo: false
      grafica:
        x: { id: t, min: 0, max: 5, unidad: s, rotulo: "t" }
        y: { min: -0.002, max: 0.0005, unidad: A, rotulo: "i" }
        curvas:
          - { expr: "(V_cf - V_c0)/R_c*exp(-t/tau_c)", color: azul, rotulo: "i(t)", mide: i }
      mandos:
        - { valor: R_c, lista: [4700, 10000, 22000] }

  - id: carga-rl
    tipo: explorar
    titulo: "Bobina: corriente"
    texto: "Mueva R."
    libro: [112]
    widget:
      tipo: circuito
      esquema: carga-rl
      piezas: { fuente: V_l, r: R_l, l: L_l, i0: I_l0, interruptor: l_modo }
      lectura: { valor: tau_l, rotulo: "Constante de tiempo" }
      grafica:
        x: { id: t, min: 0, max: 0.0005, unidad: s, rotulo: "t" }
        y: { min: 0, max: 0.25, unidad: A, rotulo: "i" }
        curvas:
          - { expr: "I_l0 + (I_lf - I_l0)*(1 - exp(-t/tau_l))", color: naranja, rotulo: "i(t)", mide: i }
      mandos:
        - { valor: R_l, lista: [50, 100, 200] }

  - id: rl-tension
    tipo: explorar
    titulo: "Bobina: tensión"
    texto: "Cambie el conmutador."
    libro: [112]
    fijar: { I_l0: 0.05 }
    widget:
      tipo: circuito
      esquema: carga-rl
      piezas: { fuente: V_l, r: R_l, l: L_l, i0: I_l0, interruptor: l_modo }
      grafica:
        x: { id: t, min: 0, max: 0.0005, unidad: s, rotulo: "t" }
        y: { min: -12, max: 12, unidad: V, rotulo: "v" }
        curvas:
          - { expr: "(V_lf - R_l*I_l0)*exp(-t/tau_l)", color: naranja, rotulo: "v_{L}", mide: vl }
          - { expr: "V_lf - (V_lf - R_l*I_l0)*exp(-t/tau_l)", color: azul, rotulo: "v_{R}", mide: vr }
      mandos:
        - { valor: l_modo, tipo: interruptor, rotulo: "Conmutador a la fuente" }

  - id: rc-tiempo
    tipo: explorar
    titulo: "RC en alterna"
    texto: "Mueva la frecuencia."
    libro: [112]
    widget:
      tipo: circuito
      esquema: filtro-rc
      piezas: { fuente: V_p, f: f_f, fase: phi_f, r: R_f, c: C_f }
      lectura: { valor: A_c, rotulo: "Amplitud en C" }
      mide: { vc_amp: A_c, vc_fase: ph_c, vr_amp: A_r }
      grafica:
        x: { id: t, min: 0, max: 0.002, unidad: s, rotulo: "t" }
        y: { min: -1.2, max: 1.2, unidad: V, rotulo: "v" }
        curvas:
          - { expr: "V_p*sin(w_f*t + phi_f*pi/180)", color: tinta, rotulo: "entrada", mide: entrada, discontinua: true }
          - { expr: "A_c*sin(w_f*t + ph_c*pi/180)", color: naranja, rotulo: "v_{C}", mide: vc }
          - { expr: "A_r*sin(w_f*t + phi_f*pi/180 + pi/2 - atan(x_c))", color: azul, rotulo: "v_{R}", mide: vr }
      mandos:
        - { valor: f_f, lista: [500, 1000, 2000] }

  - id: rc-frecuencia
    tipo: explorar
    titulo: "Respuesta en frecuencia"
    texto: "Mueva R."
    libro: [112]
    widget:
      tipo: circuito
      esquema: filtro-rc
      piezas: { fuente: V_p, f: f_f, r: R_f, c: C_f }
      lectura: { valor: f_c, rotulo: "Frecuencia de corte" }
      grafica:
        x: { id: nu, min: 10, max: 100000, unidad: Hz, rotulo: "f", escala: log }
        y: { min: 0, max: 1.1, unidad: V, rotulo: "amplitud" }
        curvas:
          - { expr: "V_p/sqrt(1 + (2*pi*nu*R_f*C_f)^2)", color: naranja, rotulo: "v_{C}", mide: vc_amp }
          - { expr: "V_p*(2*pi*nu*R_f*C_f)/sqrt(1 + (2*pi*nu*R_f*C_f)^2)", color: azul, rotulo: "v_{R}", mide: vr_amp }
        marcas:
          - { x: "f_c", y: "V_p*0.7071", rotulo: "f_{c}" }
      mandos:
        - { valor: R_f, lista: [330, 1000, 3300] }

  - id: rc-fase
    tipo: explorar
    titulo: "Fase y decibelios"
    texto: "Mueva R."
    libro: [112]
    widget:
      tipo: circuito
      esquema: filtro-rc
      piezas: { fuente: V_p, f: f_f, r: R_f, c: C_f }
      dibujo: false
      grafica:
        x: { id: nu, min: 10, max: 100000, unidad: Hz, rotulo: "f", escala: log }
        y: { min: -90, max: 0, unidad: "°", rotulo: "fase" }
        curvas:
          - { expr: "-atan(2*pi*nu*R_f*C_f)*180/pi", color: naranja, rotulo: "fase de v_{C}", mide: vc_fase }
          - { expr: "20*log10(1/sqrt(1 + (2*pi*nu*R_f*C_f)^2))", color: azul, rotulo: "v_{C} en dB", mide: vc_db }
      mandos:
        - { valor: R_f, lista: [330, 1000, 3300] }

  - id: rl-alterna
    tipo: explorar
    titulo: "RL en alterna"
    texto: "Mueva L."
    libro: [112]
    widget:
      tipo: circuito
      esquema: filtro-rl
      piezas: { fuente: V_p, f: f_f, r: R_g, l: L_g }
      lectura: { valor: A_l, rotulo: "Amplitud en L" }
      mide: { vl_amp: A_l }
      grafica:
        x: { id: t, min: 0, max: 0.002, unidad: s, rotulo: "t" }
        y: { min: -1.2, max: 1.2, unidad: V, rotulo: "v" }
        curvas:
          - { expr: "A_l*sin(w_f*t + pi/2 - atan(x_l))", color: naranja, rotulo: "v_{L}", mide: vl }
          - { expr: "V_p/sqrt(1 + x_l^2)*sin(w_f*t - atan(x_l))", color: azul, rotulo: "v_{R}", mide: vr }
      mandos:
        - { valor: L_g, lista: [4.7e-3, 15.9e-3, 47e-3] }

  - id: rl-frecuencia
    tipo: explorar
    titulo: "RL frente a la frecuencia"
    texto: "Mueva L."
    libro: [112]
    widget:
      tipo: circuito
      esquema: filtro-rl
      piezas: { fuente: V_p, f: f_f, r: R_g, l: L_g }
      dibujo: false
      grafica:
        x: { id: nu, min: 10, max: 100000, unidad: Hz, rotulo: "f", escala: log }
        y: { min: 0, max: 0.011, unidad: A, rotulo: "i" }
        curvas:
          - { expr: "V_p/sqrt(R_g^2 + (2*pi*nu*L_g)^2)", color: azul, rotulo: "|i|", mide: i_amp }
      mandos:
        - { valor: L_g, lista: [4.7e-3, 15.9e-3, 47e-3] }

  - id: rlc-resonancia
    tipo: explorar
    titulo: "Resonancia serie"
    texto: "Mueva R y mire el pico."
    libro: [112]
    fijar: { f_r: 5032.92 }
    widget:
      tipo: circuito
      esquema: rlc-serie
      piezas: { fuente: V_p, f: f_r, r: R_r, l: L_r, c: C_r }
      lectura: { valor: f_0, rotulo: "Resonancia" }
      mide: { i_amp: I_0 }
      grafica:
        x: { id: nu, min: 1000, max: 25000, unidad: Hz, rotulo: "f", escala: log }
        y: { min: 0, max: 0.11, unidad: A, rotulo: "i" }
        curvas:
          - { expr: "V_p/sqrt(R_r^2 + (2*pi*nu*L_r - 1/(2*pi*nu*C_r))^2)", color: naranja, rotulo: "|i|", mide: i_amp }
        marcas:
          - { x: "f_0", y: "I_0", rotulo: "f₀" }
      mandos:
        - { valor: R_r, lista: [10, 30, 100] }

  - id: rlc-tiempo
    tipo: explorar
    titulo: "RLC en el tiempo"
    texto: "Mueva la frecuencia."
    libro: [112]
    widget:
      tipo: circuito
      esquema: rlc-serie
      piezas: { fuente: V_p, f: f_r, r: R_r, l: L_r, c: C_r }
      lectura: { valor: Z_r, rotulo: "Impedancia" }
      grafica:
        x: { id: t, min: 0, max: 0.001, unidad: s, rotulo: "t" }
        y: { min: -0.12, max: 0.12, unidad: A, rotulo: "i" }
        curvas:
          - { expr: "V_p/Z_r*sin(w_r*t + ph_i)", color: naranja, rotulo: "i(t)", mide: i }
      mandos:
        - { valor: f_r, lista: [3000, 4000, 6000] }

  - id: tanque
    tipo: explorar
    titulo: "Tanque en paralelo"
    texto: "Mueva las pérdidas."
    libro: [112]
    widget:
      tipo: circuito
      esquema: rlc-paralelo
      piezas: { fuente: V_p, f: f_p, rs: R_ps, l: L_p, c: C_p, r: R_pp }
      lectura: { valor: f_0p, rotulo: "Resonancia" }
      mide: { vt_amp: A_t }
      grafica:
        x: { id: nu, min: 5000, max: 500000, unidad: Hz, rotulo: "f", escala: log }
        y: { min: 0, max: 1, unidad: V, rotulo: "v_{t}" }
        curvas:
          - { expr: "V_p/sqrt((1 + R_ps/R_pp)^2 + (R_ps*(2*pi*nu*C_p - 1/(2*pi*nu*L_p)))^2)", color: verde, rotulo: "|v_{t}|", mide: vt_amp }
      mandos:
        - { valor: R_pp, lista: [1000, 10000, 100000] }

  - id: tanque-tiempo
    tipo: explorar
    titulo: "Tanque en el tiempo"
    texto: "Mueva la frecuencia."
    libro: [112]
    widget:
      tipo: circuito
      esquema: rlc-paralelo
      piezas: { fuente: V_p, f: f_p, rs: R_ps, l: L_p, c: C_p, r: R_pp }
      dibujo: false
      grafica:
        x: { id: t, min: 0, max: 0.00004, unidad: s, rotulo: "t" }
        y: { min: -1, max: 1, unidad: V, rotulo: "v_{t}" }
        curvas:
          - { expr: "A_t*sin(w_p*t + ph_t)", color: verde, rotulo: "v_{t}", mide: vt }
      mandos:
        - { valor: f_p, lista: [40000, 50000, 60000] }

  - id: diodo-shockley
    tipo: explorar
    titulo: "Diodo de Shockley"
    texto: "Mueva la fuente."
    libro: [112]
    widget:
      tipo: circuito
      esquema: diodo
      piezas: { fuente: V_d, r: R_d, is: I_S, n: n_d, vt: V_T }
      lectura: { valor: V_ds, rotulo: "Tensión del diodo" }
      corriente: I_ds
      mide: { corriente: I_ds, vd: V_ds }
      mandos:
        - { valor: V_d, min: -2, max: 10, paso: 0.5 }
        - { valor: R_d, lista: [100, 1000, 10000] }

  - id: diodo-caida
    tipo: explorar
    titulo: "Diodo de caída constante"
    texto: "Mueva la fuente."
    libro: [112]
    inicio: { V_d: 5 }
    widget:
      tipo: circuito
      esquema: diodo
      piezas: { fuente: V_d, r: R_d, vd: V_D }
      lectura: { valor: I_dc, rotulo: "Corriente" }
      corriente: I_dc
      mide: { corriente: I_dc, vd: V_dc }
      mandos:
        - { valor: V_d, min: 1, max: 10, paso: 0.5 }

  - id: led
