# Drafted texts for the author's review (tomo I). Objectives: verbs in the infinitive, strictly from
# the chapter. Summaries of chapters 0-6: based on the summary cards of the 1.1 lessons.
cap00:
  objetivos:
    - Expresar magnitudes en notación científica con el prefijo del SI adecuado y con las cifras significativas que permiten los datos.
    - Despejar relaciones y resolver sistemas lineales, por sustitución y por Cramer, comprobando siempre el resultado.
    - Describir una senoide por su amplitud, frecuencia angular y fase, y pasar de valor de pico a eficaz.
    - Operar con números complejos y fasores en forma binómica y polar, y aplicarlos a la impedancia.
    - Interpretar derivadas, integrales y ecuaciones diferenciales de primer y segundo orden en circuitos con condensadores y bobinas.
    - Usar las transformadas de Laplace y Z, la serie de Fourier y la convolución para describir sistemas lineales.
    - Estimar errores e incertidumbres (peor caso, cuadratura, Monte Carlo) y trazar diagramas de Bode asintóticos en decibelios.
  resumen: >-
    Este capítulo reúne las herramientas matemáticas que el resto del libro da por sabidas, siempre
    con un circuito delante. Empieza por la escritura de las magnitudes: notación científica, prefijos
    que son potencias de mil y cifras significativas que no pueden superar a las de los datos. Sigue el
    álgebra que convierte V = I·R en tres relaciones equivalentes y resuelve las mallas como sistemas de
    ecuaciones. La senoide se describe por su pico, su frecuencia angular y su fase; su valor eficaz es
    Vp/√2, y la red de 230 V llega a 325 V de pico. Los números complejos y los fasores reducen la
    alterna a una ley de Ohm con impedancias, y las derivadas e integrales explican por qué la tensión
    de un condensador y la corriente de una bobina no pueden saltar. Las ecuaciones diferenciales de
    primer orden dan la exponencial con constante τ = R·C; las de segundo orden, la oscilación según el
    amortiguamiento. Laplace convierte derivar en multiplicar por s y sitúa los polos que deciden la
    estabilidad; Fourier descompone una señal en armónicos; la transformada Z hace lo mismo con señales
    muestreadas. El capítulo termina con el tratamiento de la medida: propagación de errores, suma en
    cuadratura, la campana de Gauss y Monte Carlo para tolerancias, el ajuste por mínimos cuadrados, las
    aproximaciones de Taylor de la pequeña señal, el análisis dimensional y el trazado asintótico de
    Bode, donde los decibelios se suman etapa a etapa.
  grado:
    materias: [mat, ss, tc]
    competencias: [FB1, TE7]
  lecturas: [kreyszig, oppenheim, alexander]

cap01:
  objetivos:
    - Definir carga, corriente, tensión, potencia y energía, con sus unidades y su significado físico.
    - Aplicar la ley de Ohm y las leyes de Kirchhoff por mallas y por nudos, distinguiendo los elementos óhmicos de los que no lo son.
    - Simplificar redes con asociaciones serie y paralelo, divisores, la transformación estrella-triángulo y el puente de Wheatstone.
    - Sustituir una red lineal por sus equivalentes de Thévenin y de Norton y aplicar superposición y máxima transferencia de potencia.
    - Calcular valores medio, eficaz y de pico de señales alternas y la frecuencia de resonancia y el factor de calidad de un circuito RLC.
    - Evaluar el efecto de la resistencia interna de las fuentes y de la carga que introducen los instrumentos de medida.
  resumen: >-
    El capítulo asienta las magnitudes y las leyes sobre las que descansa toda la electrónica. La
    corriente es carga por unidad de tiempo y la tensión, energía por unidad de carga medida siempre
    entre dos puntos; P = V·I vale en cualquier elemento, mientras que P = I²·R y P = V²/R solo en los
    óhmicos. La ley de Ohm es una propiedad de ciertos materiales, con una resistencia que depende de
    la geometría y de la temperatura; las leyes de Kirchhoff, en cambio, expresan la conservación de la
    carga y de la energía y valen siempre. Con ellas se analizan las mallas y los nudos, las asociaciones
    serie y paralelo y los divisores, que solo dividen bien en vacío. Los teoremas de superposición,
    Thévenin y Norton reducen cualquier red lineal a una fuente con su resistencia, y la máxima
    transferencia de potencia aparece con un rendimiento del 50 %, útil para señales y no para
    energía. La alterna se caracteriza por su pico, su frecuencia y su fase, y su valor eficaz es el
    que produce el mismo calor; los factores de la senoide no valen para otras formas de onda. La
    resonancia RLC, la transformación estrella-triángulo y el puente de Wheatstone completan el
    análisis. El capítulo cierra con las fuentes reales y su resistencia interna, el rendimiento y la
    autonomía de una batería, y la idea de que todo instrumento forma parte del circuito que mide.
  grado:
    materias: [tc, fis, ie]
    competencias: [CR4, FB2, TE1]
  lecturas: [alexander, hayt, tipler]

cap02:
  objetivos:
    - Relacionar la resistencia con la geometría, el material y la temperatura, y calcular la potencia que disipa.
    - Comparar las tecnologías de resistencias (carbón, película metálica, bobinadas, SMD) por tolerancia, coeficiente de temperatura y ruido.
    - Leer los códigos de colores y de marcado y elegir valores de las series normalizadas E.
    - Describir el funcionamiento y el uso de NTC, PTC, varistores y potenciómetros.
    - Dimensionar divisores, resistencias de pull-up y pull-down y puentes, teniendo en cuenta el efecto de carga.
    - Aplicar la reducción de potencia con la temperatura y el modelo de alta frecuencia al elegir una resistencia.
    - Medir y diagnosticar resistencias con el multímetro, incluidos los valores bajos a cuatro hilos.
  resumen: >-
    La resistencia es el componente más común y el capítulo la estudia de la física al banco. Su valor
    sale de la resistividad, la longitud y la sección, crece con la temperatura en los metales y se
    convierte en calor según P = I²·R. Las tecnologías difieren en lo que importa al diseñar: la de
    carbón es barata y ruidosa, la de película metálica es la de precisión, la bobinada aguanta
    potencia pero es inductiva y la SMD codifica su tamaño en el nombre del encapsulado. La tolerancia
    no dice nada de la deriva, que se mide en ppm/°C, y el ruido térmico depende solo de la resistencia,
    la temperatura y el ancho de banda, mientras que el de exceso depende de la tecnología. El código de
    colores, el marcado numérico y el EIA-96 se leen con método, y las series E reparten los valores en
    progresión geométrica según la tolerancia. Termistores NTC y PTC, varistores y potenciómetros
    amplían el repertorio. En las aplicaciones, el divisor cargado, el puente, las redes R-2R y las
    resistencias de pull-up muestran el mismo principio: la carga debe ser mucho mayor que la
    impedancia que la alimenta. La reducción de potencia con la temperatura, el reparto entre varias
    resistencias y el modelo con inductancia y capacidad parásitas fijan los límites reales. El
    capítulo termina con la medida con el multímetro, la técnica de cuatro hilos, los criterios de
    elección y el análisis estadístico de tolerancias y de ruido.
  grado:
    materias: [tc, te, ie]
    competencias: [CR4, CR5, TE2]
  lecturas: [horowitz, boylestad]

cap03:
  objetivos:
    - Relacionar la capacidad con la geometría y el dieléctrico, y calcular la energía almacenada y la corriente i = C·dv/dt.
    - Calcular la carga y descarga de un circuito RC mediante su constante de tiempo.
    - Determinar la reactancia capacitiva y la frecuencia de corte de los filtros RC paso bajo y paso alto.
    - Comparar los tipos de condensadores (cerámicos, electrolíticos, de película, supercondensadores, de seguridad X e Y) y su modelo real con ESR y ESL.
    - Elegir condensadores de desacoplo y de filtrado teniendo en cuenta la tensión continua aplicada, la temperatura, el envejecimiento y el rizado.
    - Estimar la vida de un electrolítico y diagnosticar condensadores averiados.
  resumen: >-
    El condensador almacena energía en el campo eléctrico de su dieléctrico, con una capacidad que
    fijan el área, la separación y la permitividad del material. Su ley, i = C·dv/dt, explica a la vez
    que no conduzca en continua y que su tensión no pueda cambiar de golpe. En un circuito RC la carga
    y la descarga son exponenciales de constante τ = R·C: el 63,2 % en una constante y prácticamente
    completas en cinco. En alterna presenta una reactancia inversa a la frecuencia, adelanta la
    corriente 90° y no disipa: almacena y devuelve la energía en cada ciclo. Con una resistencia forma
    los filtros RC, cuyo punto de −3 dB no es una frontera sino el comienzo de una caída de 20 dB por
    década. Los tipos se eligen por compromiso: los cerámicos C0G son estables; los X7R e Y5V dan más
    capacidad pero la pierden con la tensión, la temperatura y el tiempo; los electrolíticos ofrecen
    mucha capacidad a costa de polaridad, ESR y una vida que se reduce a la mitad por cada 10 °C. El
    modelo real con ESR y ESL explica la autorresonancia y por qué un desacoplo es una bobina por
    encima de ella. El capítulo cubre también la asociación en serie y su equilibrado, los
    supercondensadores, los condensadores de seguridad X e Y y el diagnóstico en el banco.
  grado:
    materias: [tc, te, fe]
    competencias: [CR4, CR5, FB2]
  lecturas: [horowitz, alexander]

cap04:
  objetivos:
    - Explicar la inductancia a partir de la inducción electromagnética y calcular la tensión v = L·di/dt y la energía almacenada.
    - Calcular el transitorio de un circuito RL y la reactancia inductiva, y dimensionar la protección contra la sobretensión al cortar la corriente.
    - Comparar los materiales de núcleo y evaluar las pérdidas por histéresis y por corrientes de Foucault, la saturación y el efecto del entrehierro.
    - "Analizar el transformador ideal y el real: relación de espiras, impedancia reflejada, pérdidas y rendimiento."
    - Calcular la frecuencia de resonancia, el factor de calidad y el ancho de banda de circuitos LC.
    - Identificar, medir y elegir bobinas, ferritas y choques de modo común según su corriente de saturación y su autorresonancia.
  resumen: >-
    La bobina se opone al cambio de la corriente, no a la corriente: v = L·di/dt lo resume y explica
    tanto el depósito de energía ½·L·I² como los miles de voltios que aparecen al cortarla de golpe. La
    inductancia crece con el cuadrado de las espiras y con la permeabilidad del núcleo, y toda espira la
    tiene, incluso un centímetro de pista. En continua el circuito RL responde con una exponencial de
    constante L/R; en alterna la reactancia crece con la frecuencia hasta la autorresonancia, donde la
    capacidad entre espiras la convierte en condensador. El diodo en antiparalelo protege al transistor
    que conmuta una carga inductiva, a cambio de que el relé suelte más despacio. Los núcleos
    multiplican la inductancia pero imponen límites de frecuencia, saturación y pérdidas por histéresis
    y por corrientes de Foucault; el entrehierro reduce la inductancia a cambio de admitir más corriente
    y guardar la energía en el hueco. El transformador relaciona tensiones y corrientes por las espiras,
    refleja la carga multiplicada por el cuadrado de la relación y, en la práctica, añade corriente
    magnetizante, pérdidas y dispersión. La resonancia LC, el factor de calidad y la selectividad, el
    efecto pelicular, las ferritas y los choques de modo común completan un capítulo que termina en el
    criterio de diseño: la saturación, y no la marca, es el límite real.
  grado:
    materias: [tc, elt, fis]
    competencias: [CR4, FB2, TE1]
  lecturas: [mclyman, alexander, fraile]

cap05:
  objetivos:
    - Explicar la conducción en los semiconductores intrínsecos y dopados y la formación de la unión PN.
    - Aplicar la ecuación de Shockley, la resistencia dinámica y la deriva térmica al análisis de circuitos con diodos.
    - Identificar y comprobar diodos con el multímetro y distinguir sus tipos (rectificador, Schottky, Zener, TVS, varicap, PIN, LED).
    - Diseñar rectificadores de media onda y de onda completa con filtro por condensador, incluidos el rizado y las corrientes de pico.
    - Dimensionar un regulador con diodo Zener en el peor caso de entrada y de carga.
    - Analizar recortadores, fijadores, detectores de pico y multiplicadores de tensión, y la pérdida por recuperación inversa.
  resumen: >-
    El diodo es la primera aplicación del semiconductor, y el capítulo lo construye desde el material.
    La banda prohibida del silicio deja pocos portadores libres y permite gobernar la conductividad con
    el dopaje: el fósforo aporta electrones y el boro, huecos, y el producto n·p se mantiene igual a
    nᵢ². La unión entre dos dopajes crea una barrera que en directa se reduce y deja crecer la corriente
    exponencialmente, y en inversa deja solo una corriente de saturación que se dobla cada 10 °C. La
    ecuación de Shockley explica por qué no hay umbral y por qué, aun así, 0,7 V basta en la mayoría
    de los diseños; su pendiente es la resistencia dinámica y su deriva, unos −2 mV/°C. Los tipos de
    diodo se distinguen por la tecnología: el de unión para la red, el Schottky para la conmutación, el
    Zener y el TVS en ruptura, el varicap por su capacidad y el LED por la luz. En las aplicaciones, el
    rectificador con condensador se carga al pico y obliga a los diodos a conducir en pulsos intensos;
    el regulador Zener se dimensiona en las esquinas de entrada y de carga; recortadores, fijadores,
    detectores de pico y multiplicadores reparten los mismos componentes de otra forma. La recuperación
    inversa, proporcional a la frecuencia, decide el diodo en las fuentes conmutadas.
  grado:
    materias: [fe, ea, ep]
    competencias: [CR5, TE2, TE4]
  lecturas: [streetman, sedra, malvino]

cap06:
  objetivos:
    - Explicar el funcionamiento del transistor bipolar a partir de su estructura y de sus regiones de trabajo.
    - Polarizar un BJT con divisor y resistencia de emisor de forma estable frente a la dispersión de β y a la temperatura.
    - Calcular la ganancia y las impedancias de las configuraciones de emisor común, colector común y base común con el modelo de pequeña señal.
    - Dimensionar el transistor en conmutación con sobreexcitación de base y estimar sus pérdidas.
    - Identificar el patillaje y el estado de un transistor con el multímetro.
    - Analizar el efecto Early, el embalamiento térmico, los espejos de corriente, la distorsión no lineal y el acoplamiento entre etapas.
  resumen: >-
    El transistor bipolar no son dos diodos: lo que lo hace funcionar es una base delgada y poco dopada
    entre dos uniones separadas por fracciones de micra. En la región activa la tensión base-emisor fija
    la corriente de colector, y β·I_B es su consecuencia; cuando esa corriente no cabe en el circuito, el
    transistor se satura. La ganancia β varía mucho entre ejemplares, con la temperatura y con la
    corriente, y por eso el diseño no debe depender de ella: la polarización por divisor con resistencia
    de emisor reduce una variación del 500 % de β a unos pocos por ciento de la corriente. El modelo de
    pequeña señal, con g_m = I_C/V_T, r_π y r_o, da la ganancia del emisor común, la del seguidor y la de
    la base común, que se eligen por lo que falta en cada caso: ganancia, corriente o ancho de banda.
    En conmutación el transistor debe pasar por la zona activa lo más deprisa posible y saturarse con
    una corriente de base forzada; por encima de decenas de kilohercios conviene un MOSFET. El capítulo
    trata también la identificación con el multímetro, el efecto Early y su techo de ganancia, el
    embalamiento térmico y el reparto de corriente, los espejos de corriente con carga activa, la
    distorsión armónica y el punto de intercepción, y el acoplamiento entre etapas.
  grado:
    materias: [fe, ea]
    competencias: [CR5, TE2, TE6]
  lecturas: [sedra, malvino, horowitz]
