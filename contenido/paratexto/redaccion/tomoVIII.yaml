# Drafted texts for the author's review (tomo VIII: chapters 50-53 and appendices A-J).
# Appendices get 4 objectives and a shorter summary (about 150 words).
cap51:
  objetivos:
    - Especificar un amplificador de audio con números y organizarlo como una cadena de cinco bloques.
    - Diseñar el preamplificador con control de volumen y control de tono Baxandall atendiendo al ruido.
    - Diseñar una etapa de potencia en clase AB con sus resistencias de emisor y sus protecciones.
    - Eliminar la distorsión de cruce con un circuito de bias basado en el multiplicador de VBE y ajustarlo.
    - Calcular la potencia, la disipación máxima, la alimentación y el diseño térmico del amplificador.
    - Medir la fidelidad (respuesta, distorsión, ruido) y diagnosticar cuellos térmicos, zumbidos y ruido de fondo.
  resumen: >-
    El tercer proyecto es el clásico analógico por excelencia: un amplificador que convierte una señal
    débil en la potencia capaz de mover un altavoz, con fidelidad. Diseñarlo enseña a pensar por etapas y
    reúne el operacional y la realimentación, los filtros, los transistores, la potencia y la disipación.
    La especificación con números decide su tamaño, su calor y su coste, y la cadena de cinco bloques
    explica por qué cada uno está donde está. El preamplificador decide buena parte del ruido y lleva el
    control de volumen, con su trampa, y el control de tono Baxandall. La etapa de potencia en clase AB,
    con el seguidor complementario, la configuración Darlington y las resistencias de emisor, entrega la
    corriente al altavoz con las protecciones imprescindibles. La distorsión de cruce es el defecto que la
    realimentación no arregla del todo, y el multiplicador de VBE fija el bias con un compromiso que se
    ajusta en el banco. La fidelidad se descompone en cuatro parámetros medibles, con un debate sobre la
    realimentación tratado con honestidad. Tres cálculos encadenados dan la potencia, la disipación, cuyo
    máximo no está a plena potencia, y la alimentación. La lista de materiales, el montaje y la puesta a
    punto, el diagnóstico fino del calor y del zumbido, la interacción con el altavoz y los límites del
    instrumental doméstico para medir distorsiones pequeñas cierran el proyecto.
  grado:
    materias: [ea, ep, ie]
    competencias: [TE2, TE6, TE5]
  lecturas: [self, cordell]

cap52:
  objetivos:
    - Especificar un receptor SDR y decidir dónde se sitúa la frontera entre lo analógico y lo digital.
    - Aplicar el teorema de muestreo y el muestreo en cuadratura I/Q, y corregir el desequilibrio entre canales.
    - Diseñar el front-end bloque a bloque, con su presupuesto de ruido y su rechazo de imagen.
    - Describir la cadena de procesado digital, la demodulación y su carga computacional.
    - Interpretar el espectro y la cascada (waterfall) como herramientas de diagnóstico.
    - Comparar la SDR con el receptor FM7303 y montar un receptor utilizable con su antena y su filtrado.
  resumen: >-
    El último proyecto detallado cierra un círculo que empezó con el FM7303: aquella era una radio hecha de
    hardware, y la radio definida por software hace lo mismo con muy poco hardware, un front-end, un
    mezclador en cuadratura y la tarjeta de sonido como conversor, y resuelve el resto con cálculo. El
    capítulo fija primero la especificación y la arquitectura. La conversión directa necesita dos
    canales, I y Q, porque una señal de radio tiene amplitud y fase y una sola muestra real pierde la
    fase; el teorema de Nyquist vuelve a ser la base, y el desequilibrio entre canales, el defecto que hay
    que corregir. El front-end se desarrolla bloque a bloque: atenuador y preselector, un detector de
    muestreo en cuadratura como mezclador, el oscilador local, la banda base y la alimentación, con un
    presupuesto de ruido que explica por qué no lleva amplificador de bajo ruido y el rechazo de imagen
    en números. A partir del par I/Q, todo es cálculo: las etapas de procesado, la demodulación de cada
    modo y su carga computacional. El espectro instantáneo y la cascada permiten ver la radio en lugar de
    oírla y usarla como instrumento. La comparación bloque a bloque con el FM7303 muestra lo que sigue
    siendo analógico. El montaje real con un receptor comercial, la antena y el ruido del ordenador, y
    cinco ampliaciones, cierran el capítulo.
  grado:
    materias: [com, ss, ea]
    competencias: [TE10, TE7, TE2]
  lecturas: [collins, lyons, bowick]

cap53:
  objetivos:
    - Aplicar el método de diagnóstico (síntoma, hipótesis, medida) con el principio de la causa única.
    - Trabajar con seguridad ante la red, las baterías de litio y la electricidad estática.
    - Inspeccionar y medir sin alimentar, y realizar el primer encendido con límite de corriente o lámpara serie.
    - Comprobar las alimentaciones y rastrear la señal por etapas con seguimiento, inyección y bisección.
    - Localizar cortocircuitos, puntos calientes y fallos intermitentes con el multímetro, el osciloscopio y la cámara térmica.
    - Confirmar las averías típicas de cada familia de componentes y de equipo antes de sustituir, y reparar la placa.
    - Documentar las reparaciones en un cuaderno de averías y entender el marco del ecodiseño y del derecho a reparar.
  resumen: >-
    Reparar electrónica es aplicar el método científico a un circuito averiado: observar el síntoma,
    formular una hipótesis, medir para confirmarla o descartarla y repetir hasta localizar el fallo. El
    capítulo reúne en ese método todo lo que el libro ha enseñado por separado, en un orden que va
    descartando hipótesis: seguridad antes de tocar nada; inspección sin alimentar, el paso que más averías
    resuelve por minuto; medidas sin tensión; primer encendido con límite de corriente o lámpara serie;
    las alimentaciones, primero siempre, y el rastreo por etapas con seguimiento, inyección y bisección.
    Dos secciones enseñan a sacar todo el partido del multímetro Brymen BM869s y del FNIRSI, y otras
    tratan la localización de cortocircuitos sin desoldar, la cámara térmica, los fallos intermitentes y
    sus cuatro causas dominantes, la medida de corriente con el osciloscopio y un trazador de curvas
    improvisado. Las averías típicas se confirman por familia de componentes y por tipo de equipo, con
    procedimientos específicos para fuentes de alimentación, sistemas con microcontrolador y
    amplificadores de audio, y un caso completo de principio a fin. La reparación misma, entender por qué
    falló, el cuaderno de averías, la reparación sin esquema y de la propia placa, los líquidos y la
    corrosión, los límites honestos del instrumental y el marco del ecodiseño y del derecho a reparar
    cierran el capítulo, con una tarjeta de referencia rápida.
  grado:
    materias: [ie, te]
    competencias: [TE5, TE6, CR10]
  lecturas: [pease, horowitz]

cap54:
  objetivos:
    - Delimitar los fines, el encuadre legal y la ética de la ingeniería inversa de hardware.
    - Identificar los componentes de una placa desconocida por su marcado y por su comportamiento.
    - Levantar el esquema completo de una placa, incluidas las multicapa, con un método ordenado.
    - Deducir la función de un circuito por estímulo y respuesta y la arquitectura de bloques analógicos y de RF por sus formas de onda.
    - Descifrar protocolos digitales capturados y valorar la extracción y el análisis del firmware y el trazado del silicio.
    - Documentar y publicar los resultados de forma responsable.
  resumen: >-
    La ingeniería inversa es el diagnóstico llevado al extremo: entender un circuito del que nadie ha dado
    el esquema. El capítulo empieza por el encuadre legal y la ética, que van al principio y no al final:
    entender es legítimo, copiar no. Identificar los componentes de una placa desconocida exige leer el
    marcado o, cuando falta, deducir el componente por su comportamiento. Levantar el esquema es un
    trabajo mecánico y ordenado en seis pasos, de las alimentaciones a los bloques funcionales, la
    continuidad nodo a nodo y la comprobación de lo dibujado; en placas multicapa, donde las pistas no se
    ven, se deduce lo posible sin destruir y se reconstruye por comportamiento. El análisis funcional por
    estímulo y respuesta es a menudo más rápido: el mapa de conectores, el estado de reposo y el
    seguimiento de la señal. Los protocolos digitales se descifran identificando el bus, capturando bien,
    deduciendo el formato y la suma de comprobación y correlacionando con el comportamiento; los bloques
    analógicos y de RF se reconocen por sus frecuencias y su respuesta. El firmware puede extraerse y
    analizarse dentro de límites, y el trazado del silicio es el último recurso. Documentar, anotar la
    incertidumbre y publicar con responsabilidad, tres problemas resueltos y un último ejercicio cierran
    el libro.
  grado:
    materias: [dse, sed, ie]
    competencias: [TE6, TE3, TE5]
  lecturas: [woudenberg, huang]

apA:
  objetivos:
    - Decodificar el valor y la tolerancia de una resistencia de cuatro o cinco bandas según la norma IEC 60062.
    - Asignar a cada color su cifra, su multiplicador, su tolerancia y su coeficiente de temperatura.
    - Seguir ejemplos de lectura resueltos de resistencias de cuatro y cinco bandas.
    - Leer los códigos numéricos de tres y cuatro dígitos de las resistencias SMD y la R como coma decimal.
  resumen: >-
    El apéndice reúne en tablas lo necesario para leer el valor de cualquier resistencia, según la norma
    IEC 60062. La tabla de bandas de color asigna a cada color su cifra, su multiplicador, su letra de
    tolerancia y su coeficiente de temperatura. Con cuatro bandas se leen dos cifras, el multiplicador y
    la tolerancia; con cinco, tres cifras; con seis, la última banda es el coeficiente de temperatura. La
    tabla sigue la edición de 2016 de la norma, que asignó nuevas tolerancias al amarillo y al gris y
    añadió el rosa como multiplicador. Una serie de ejemplos de lectura resueltos muestra el
    procedimiento completo. La última sección trata el marcado numérico de las resistencias de montaje
    superficial: el código de tres dígitos, el de cuatro y la letra R como coma decimal, con remisión a
    la sección 2.5 para el EIA-96 y las resistencias de cero ohmios. Es un apéndice de consulta que
    complementa el capítulo 2.
  grado:
    materias: [te]
    competencias: [CR5]
  lecturas: []

apB:
  objetivos:
    - Encontrar un sustituto para un transistor bipolar, un MOSFET de potencia, un regulador o un integrado común.
    - Comprobar que el equivalente cumple o supera las especificaciones de tensión, corriente y potencia del original.
    - Identificar el dato en que un equivalente queda por debajo del original.
    - Comparar MOSFET por su resistencia en conducción en las condiciones indicadas.
  resumen: >-
    Cuando no se dispone del componente original para una reparación, este apéndice ayuda a encontrar un
    sustituto adecuado, con una advertencia general: el equivalente debe cumplir o superar las
    especificaciones de tensión, corriente y potencia del original. Las tablas cubren cuatro familias. En
    los transistores bipolares se indica entre paréntesis el dato en que el equivalente queda por debajo
    del original, para que la sustitución sea consciente. Los MOSFET de potencia se comparan por su
    resistencia en conducción máxima con una tensión de puerta de 10 V. Siguen los reguladores de tensión
    y una selección de circuitos integrados comunes.
  grado:
    materias: [te]
    competencias: [CR5, TE6]
  lecturas: []

apC:
  objetivos:
    - Elegir el calibre de un cable por su designación AWG.
    - Usar los prefijos y las unidades del Sistema Internacional que aparecen en el libro.
    - Consultar los niveles lógicos de las familias digitales y las constantes físicas útiles.
    - Repasar de un vistazo las fórmulas esenciales del libro.
  resumen: >-
    El apéndice reúne tablas de consulta rápida que el lector necesitará una y otra vez. La primera da los
    calibres de cable según el sistema AWG, que indica el grosor del conductor. La segunda recoge los
    prefijos y las unidades del Sistema Internacional que aparecen en el libro, con su equivalencia y un
    valor de referencia. La tercera da los niveles lógicos de cada familia, con los umbrales de las
    familias CMOS clásicas en proporción a la alimentación. La cuarta reúne las constantes físicas
    útiles. La última es un resumen de las fórmulas esenciales: la ley de Ohm, la potencia, las
    asociaciones de resistencias, la constante de tiempo, las reactancias, la frecuencia de resonancia,
    el divisor de tensión, la ganancia del bipolar, la resistencia de un LED y la frecuencia del 555 en
    astable.
  grado:
    materias: [tc, fis]
    competencias: [CR4, FB2]
  lecturas: []

apD:
  objetivos:
    - Aplicar las normas de seguridad eléctrica en el banco.
    - Proteger los componentes frente a las descargas electrostáticas.
    - Trabajar con seguridad al soldar y al manejar el FNIRSI 2C53T.
    - Gestionar los residuos electrónicos de acuerdo con su peligrosidad.
  resumen: >-
    El apéndice reúne las normas de seguridad y las buenas prácticas del libro en un solo lugar. Empieza
    por la seguridad eléctrica, la más importante para quien trabaja con equipos conectados a la red.
    Las reglas van del transformador de aislamiento y la descarga de los condensadores a la regla de una
    mano en el bolsillo. Sigue la protección contra las descargas electrostáticas, con muñequera, tapete y
    bolsas de apantallamiento, y la seguridad en la soldadura: ventilación con extractor de humos, la
    temperatura de la punta, el soporte del soldador y la higiene tras manipular plomo. Una sección
    específica trata el manejo seguro del FNIRSI 2C53T y sus límites. La última trata la gestión de los
    residuos: los
    componentes electrónicos contienen materiales que no deben desecharse con la basura común y que
    tienen su propio circuito de recogida.
  grado:
    materias: [ie, te]
    competencias: [CR10, TE5]
  lecturas: []

apE:
  objetivos:
    - Numerar las patillas de los encapsulados que usa el kit FM7303.
    - Identificar la función, el encapsulado, la alimentación y las equivalencias de cada integrado del receptor.
    - Relacionar cada integrado con su papel en la cadena del receptor.
    - Recurrir a la hoja de datos del fabricante cuando se necesite un dato exacto patilla por patilla.
  resumen: >-
    El apéndice reúne, en fichas de consulta rápida, los cinco circuitos integrados del receptor FM7303:
    el front-end de FM TA7358AP, el amplificador de FI TA7061BP, el TA7303P con amplificador de FI,
    detector, medida de intensidad de señal y silenciador, el decodificador estéreo PLL TA7343AP y el
    amplificador de potencia de audio estéreo TEA2025. Para cada uno se indican su función, su
    encapsulado, su alimentación, sus equivalencias y su papel concreto en la radio, y una figura muestra
    cómo se numeran las patillas en los dos encapsulados del kit. El apéndice advierte de que las
    funciones patilla por patilla varían entre fabricantes y versiones, por lo que conviene consultar la
    hoja de datos concreta, y se complementa con el apéndice B y con la anatomía por bloques del
    capítulo 15.
  grado:
    materias: [com, ea]
    competencias: [TE2, TE10]
  lecturas: []

apF:
  objetivos:
    - Explicar por qué los componentes se fabrican en series normalizadas de valores.
    - Usar las series E12 y E24 para elegir valores comerciales.
    - Identificar los tipos de encapsulado y su forma de montaje.
    - Relacionar el encapsulado con la técnica de soldadura que exige.
  resumen: >-
    Las resistencias, y muchos condensadores, no se fabrican en cualquier valor, sino en series
    normalizadas, y la primera parte del apéndice reproduce las series E12 y E24 para elegir valores
    comerciales. La segunda parte describe los tipos de encapsulado, la carcasa física de un componente,
    que determina cómo se monta y cómo se suelda, desde los de orificio pasante hasta los de montaje
    superficial. Es un apéndice de consulta que complementa los capítulos de componentes y de soldadura.
  grado:
    materias: [te]
    competencias: [CR5]
  lecturas: []

apG:
  objetivos:
    - Localizar las fuentes directas del proyecto FM7303 y su linaje teórico.
    - Elegir referencias generales de electrónica para consolidar los fundamentos.
    - Encontrar la obra de referencia de cada área del libro.
    - Usar la bibliografía por problema, apoyada en hojas de datos, notas de aplicación y normas.
  resumen: >-
    El apéndice es una selección comentada de fuentes para profundizar, ordenadas por cercanía al
    proyecto. Empieza por las fuentes directas del FM7303, el manual del kit y las hojas de datos de los
    fabricantes, y por el linaje teórico de esta familia de receptores. Siguen las referencias generales
    de electrónica, encabezadas por «The Art of Electronics», y el manual del FNIRSI 2C53T. La última
    sección recoge obras de referencia para cada bloque del libro, de los fundamentos y los
    semiconductores a la potencia, el control, la radiofrecuencia, las placas, la fiabilidad, la
    simulación y el audio, y termina con un consejo: acudir a ellas por problema y no por orden, con las
    hojas de datos y las normas como fuente más actualizada.
  grado:
    materias: [pry]
    competencias: []
  lecturas: []

apH:
  objetivos:
    - Comprobar lo aprendido en seis bloques de preguntas sin consultar el texto.
    - Identificar los bloques en que conviene volver a los capítulos correspondientes.
    - Contrastar las respuestas con el solucionario.
    - Usar el cuestionario como muestra de autoevaluación del curso completo.
  resumen: >-
    El apéndice propone treinta preguntas para comprobar lo aprendido, agrupadas en seis bloques:
    fundamentos, componentes, esquemas e instrumentos, soldadura y diagnóstico, el receptor FM7303 y el
    FNIRSI con sus prácticas. Se recomienda responderlas sin mirar el texto y, si se fallan varias de un
    bloque, volver a los capítulos correspondientes. El solucionario está al final, y el propio apéndice
    advierte de que el cuestionario es una muestra. La autoevaluación por capítulos de esta edición lo
    amplía a todos los capítulos del libro.
  grado:
    materias: []
    competencias: []
  lecturas: []

apI:
  objetivos:
    - Adaptar los procedimientos del libro al instrumental disponible.
    - Identificar qué funciones de cada instrumento usa realmente el libro.
    - Elegir equivalentes por categoría de instrumento y saber en qué no conviene escatimar.
    - Encontrar alternativas al kit FM7303.
  resumen: >-
    El libro usa instrumentos concretos, el osciloscopio portátil FNIRSI 2C53T y el multímetro Brymen
    BM869s, y un receptor concreto, el kit FM7303. Este apéndice explica cómo adaptar sus procedimientos a
    otro instrumental: qué funciones de cada instrumento se usan realmente, qué equivalentes sirven por
    categoría, en qué conviene no escatimar y qué alternativas hay al kit. Termina con la generalización de
    los procedimientos, que en su mayoría no dependen del modelo de instrumento.
  grado:
    materias: [ie]
    competencias: [TE5]
  lecturas: []

apJ:
  objetivos:
    - Identificar los símbolos que más se repiten en el libro, con su significado y su unidad.
    - Interpretar la convención de subíndices de las hojas de datos.
    - Distinguir los valores instantáneos de los de continua por la notación.
    - Localizar el capítulo donde se desarrolla cada magnitud.
  resumen: >-
    El apéndice relaciona los símbolos que más se repiten en el libro con su significado, su unidad y los
    capítulos donde se desarrollan, agrupados en cuatro tablas: magnitudes y circuitos, semiconductores,
    amplificadores con ruido y conversión, y radiofrecuencia con señal digital y fiabilidad. Explica la
    convención de subíndices de las hojas de datos, como VCE o RDS(on), y la que distingue las minúsculas
    de los valores instantáneos de las mayúsculas de los de continua. Las letras griegas y las constantes
    físicas tienen sus propias tablas en la sección 0.1 y en la tabla C.4.
  grado:
    materias: [tc]
    competencias: [FB1]
  lecturas: []
