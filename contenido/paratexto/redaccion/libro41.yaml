  objetivos:
  - 'Diseñar automatismos cableados con contactores: autorretención, enclavamientos y arranque estrella-triángulo.'
  - Elegir y cablear sensores y actuadores de 24 V y las entradas y salidas de un autómata.
  - Calcular el tiempo de respuesta de un autómata cíclico y sus límites.
  - Programar en los lenguajes de la IEC 61131-3.
  - Especificar una secuencia con GRAFCET y traducirla a programa.
  - Describir la parada de emergencia y la estructura de un mando de seguridad.
  resumen: 'Casi todo lo que se mueve en una fábrica sigue una secuencia, y el capítulo trata de cómo se construye. Con contactores, el circuito de mando hace lógica con contactos: la autorretención, con prioridad de paro y sin rearranque al volver la tensión; los enclavamientos eléctrico y mecánico de la inversión de giro; y el arranque estrella-triángulo, que divide por tres la corriente y el par de arranque y necesita una pausa entre contactores. Los sensores industriales (finales de carrera, detectores inductivos, capacitivos y fotoeléctricos) trabajan a 24 V, PNP o NPN, de tres o de dos hilos, y se diseñan con su distancia asegurada y el factor del material. El autómata programable es un ordenador hecho para el armario: sus entradas de 24 V son de los tipos de la IEC 61131-2, y un detector de dos hilos exige comprobar su corriente residual y su caída. Ejecuta el programa en un ciclo de scan sobre una imagen de proceso, su tiempo de respuesta va de uno a dos ciclos y puede no ver los pulsos más cortos que el ciclo. Se programa en los lenguajes de la IEC 61131-3, y las secuencias se especifican con GRAFCET y se traducen a programa con reglas fijas. La parada de emergencia no la gestiona el autómata, sino un relé de seguridad de dos canales con contactos guiados, y la fiabilidad de cada función de seguridad la fijan los niveles de prestaciones de la ISO 13849-1. El capítulo termina comparando el autómata con el microcontrolador y con una estación de marcado llevada de la especificación al programa.'
  typst:
