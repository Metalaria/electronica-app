  objetivos:
  - Analizar un circuito magnético con entrehierro y relacionar la fuerza electromotriz y el par con la misma constante.
  - Caracterizar un transformador trifásico con los ensayos de vacío y cortocircuito e interpretar su grupo de conexión.
  - Calcular el punto de trabajo, el arranque y el frenado de un motor de continua.
  - Resolver el circuito equivalente del motor de inducción y su curva par-velocidad.
  - Describir la máquina síncrona y los motores de imanes permanentes, y su conmutación.
  - Ajustar un variador V/f y explicar el control vectorial y el frenado.
  - Elegir, proteger y dimensionar el accionamiento de una carga.
  resumen: Una máquina eléctrica convierte energía eléctrica en mecánica, o al revés, a través de un campo magnético. El circuito magnético se calcula como uno eléctrico, con fuerzas magnetomotrices y reluctancias, y casi toda su energía, y con ella la fuerza, está en el entrehierro; un conductor en un campo da un par y una fuerza electromotriz con la misma constante, por la conservación de la energía. El transformador trifásico tiene tres columnas y un grupo de conexión, Dyn11 en distribución, y sus parámetros salen de los ensayos de vacío y de cortocircuito, que dan también la caída de tensión, el rendimiento y la corriente de cortocircuito. La máquina de corriente continua tiene una recta par-velocidad, dos constantes de tiempo, un arranque que hay que limitar y un frenado que devuelve energía. El motor de inducción gira con un deslizamiento, y su circuito equivalente da el reparto de potencias, la curva par-velocidad, el par máximo y la punta de arranque. La máquina síncrona gira a la velocidad del campo; con imanes y un inversor da los motores PMSM y BLDC, y el paso a paso es su variante de muchos polos. El variador de frecuencia mantiene el flujo con la ley V/f y su refuerzo, el control vectorial controla el par como en un motor de continua, y el frenado necesita un camino para la energía. La placa de características resume el motor, que se elige por par y velocidad y se protege contra cortocircuito, sobrecarga y falta de fase, y el capítulo termina dimensionando el accionamiento de un polipasto.
  typst:
    normas: '#let normas = normas-referencias(normas: (([IEC 60034\-1, \-5 y \-30\-1], [Máquinas eléctricas rotativas: servicios S1 a S10, grados de protección y clases de rendimiento IE.], (("sec-56.7", "?"),)), ([Reglamento (UE) 2019\/1781], [Exige la clase IE3 a los motores de inducción de 0,75 a 1 000 kW desde julio de 2021, e IE4 a los de 75 a 200 kW desde 2023.], (("sec-56.7", "?"),))), lecturas: (([Jesús Fraile Mora, «Máquinas eléctricas», Ibergarceta, 9.ª ed.], "sugerencia"), ([Stephen J. Chapman, «Electric Machinery Fundamentals», McGraw\-Hill, 5.ª ed., 2012. Hay edición en español: «Máquinas eléctricas», McGraw\-Hill, 5.ª ed., 2012.], "sugerencia"), ([Ned Mohan, Tore M. Undeland y William P. Robbins, «Power Electronics: Converters, Applications, and Design», Wiley, 3.ª ed., 2003.], "sugerencia"),))'
    terminos: '#let terminos = terminos-clave(([Campo giratorio], "sec-56.4", "?"), ([Colector], "sec-56.3", "?"), ([Control vectorial (FOC)], "sec-56.6", "?"), ([Debilitamiento de campo], "sec-56.3", "?"), ([Deslizamiento (s)], "sec-56.4", "?"), ([Tensión de cortocircuito], "sec-56.2", "?"), ([Fuerza electromotriz], "sec-56.1", "?"), ([Grupo de conexión], "sec-56.2", "?"), ([Par máximo], "sec-56.4", "?"), ([Reluctancia], "sec-56.1", "?"), ([Resistencia de frenado], "sec-56.3", "?"), ([Velocidad síncrona], "sec-56.4", "?"), ([Ángulo de carga], "sec-56.5", "?"), ([Curvas en V], "sec-56.5", "?"), ([Sincronización], "sec-56.5", "?"))'
