    ej-K.5: 2
    ej-K.6: 2
  objetivos:
  - Elegir los tipos enteros de tamaño fijo y manejar bits, máscaras y campos de un registro.
  - Predecir el tamaño y la disposición de una estructura en distintos procesadores y transmitir datos sin depender de ellos.
  - Situar cada parte de un programa en la memoria y usar volatile, const y las secciones críticas donde hacen falta.
  - Programar máquinas de estados que no bloquean y búferes circulares entre una interrupción y el programa.
  - Decidir entre coma flotante y coma fija con el coste de cada operación, y medir el tiempo sin errores de desbordamiento.
  - Reconocer la promoción de enteros, los desbordamientos y el comportamiento indefinido, y defenderse de ellos.
  resumen: El apéndice reúne lo que el C de un microcontrolador tiene de particular. El tamaño de los tipos depende del procesador (un int tiene 16 bits en el AVR y 32 en un Cortex-M), y por eso se usan los de tamaño fijo y las constantes sin signo para las máscaras; los campos de un registro se leen y escriben con desplazamientos y máscaras. Las estructuras llevan relleno para alinear sus campos, distinto en cada procesador, y los datos que salen por un bus se escriben byte a byte. El enlazador reparte el programa entre la Flash y la RAM, y en el AVR las constantes se copian a la RAM salvo que se declaren en la Flash. Volatile obliga a hacer cada acceso, pero no lo hace atómico ni ordena los demás, y una variable de varios bytes que cambia una interrupción se lee en una sección crítica. Las máquinas de estados y los búferes circulares son las estructuras de cada día, y sus detalles (tiempos máximos, índices de un byte que cuentan libremente) los hacen robustos. Sin coma flotante en hardware, cada operación tiene su coste, y la coma fija redondea y satura. Los errores típicos salen de la promoción de enteros, de los desbordamientos y del comportamiento indefinido, y se combaten con los avisos del compilador, las pruebas en el PC y las reglas de codificación.
  typst:
    normas: '#let normas = normas-referencias(normas: (([ISO\/IEC 9899 (lenguaje C)], [El estándar del lenguaje: tamaños mínimos de los tipos, conversiones y comportamiento indefinido.], (("sec-K.1", "K.1"), ("sec-K.6", "K.6"))), ([MISRA C], [Reglas de codificación de C para sistemas críticos, nacidas en la industria del automóvil.], (("sec-K.6", "K.6"),))), lecturas: (([Brian W. Kernighan y Dennis M. Ritchie, «The C Programming Language», Prentice Hall, 2.ª ed., 1988. Hay edición en español: «El lenguaje de programación C», Prentice Hall Hispanoamericana, 2.ª ed., 1991.], "sugerencia"), ([Michael Barr, «Embedded C Coding Standard» (BARR\-C:2018), Barr Group, 2018. Se descarga gratis de la web de Barr Group.], "sugerencia"), ([Elecia White, «Making Embedded Systems: Design Patterns for Great Software», O\''Reilly, 2.ª ed., 2024.], "sugerencia"),))'
    resumen: '#let resumen = resumen-capitulo([El apéndice reúne lo que el C de un microcontrolador tiene de particular. El tamaño de los tipos depende del procesador (un int tiene 16 bits en el AVR y 32 en un Cortex-M), y por eso se usan los de tamaño fijo y las constantes sin signo para las máscaras; los campos de un registro se leen y escriben con desplazamientos y máscaras. Las estructuras llevan relleno para alinear sus campos, distinto en cada procesador, y los datos que salen por un bus se escriben byte a byte. El enlazador reparte el programa entre la Flash y la RAM, y en el AVR las constantes se copian a la RAM salvo que se declaren en la Flash. Volatile obliga a hacer cada acceso, pero no lo hace atómico ni ordena los demás, y una variable de varios bytes que cambia una interrupción se lee en una sección crítica. Las máquinas de estados y los búferes circulares son las estructuras de cada día, y sus detalles (tiempos máximos, índices de un byte que cuentan libremente) los hacen robustos. Sin coma flotante en hardware, cada operación tiene su coste, y la coma fija redondea y satura. Los errores típicos salen de la promoción de enteros, de los desbordamientos y del comportamiento indefinido, y se combaten con los avisos del compilador, las pruebas en el PC y las reglas de codificación.])'
    terminos: '#let terminos = terminos-clave(("Búfer circular", "sec-K.4", "K.4"), ("Coma fija", "sec-K.5", "K.5"), ("Comportamiento indefinido", "sec-K.6", "K.6"), ("Máquina de estados", "sec-K.4", "K.4"), ("Promoción de enteros", "sec-K.6", "K.6"), ("Relleno (padding)", "sec-K.2", "K.2"), ("Sección crítica", "sec-K.3", "K.3"), ("Variable volátil (volatile)", "sec-K.3", "K.3"))'
