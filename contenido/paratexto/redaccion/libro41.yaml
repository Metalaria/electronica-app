  objetivos:
  - Describir la arquitectura de un robot y la jerarquía de lazos que lo gobiernan, con la frecuencia de cada uno.
  - Resolver la cinemática directa e inversa de un brazo de tres ejes y deducir de ella la resolución, las velocidades y los pares que piden los motores.
  - Describir un robot con transformaciones homogéneas y la tabla de Denavit-Hartenberg, y programarlo con movimientos articulares y lineales en los sistemas de la herramienta y de la pieza.
  - Elegir y dimensionar la etapa de potencia de un motorreductor, de un servo de modelismo y de un motor paso a paso, y su alimentación.
  - Leer un encoder, estimar la velocidad y diseñar el servo de posición de un eje con perfil trapezoidal y acción anticipativa.
  - Calcular la odometría de un robot diferencial, explicar por qué deriva y combinarla con un giróscopo.
  - 'Aplicar lo esencial de las normas de seguridad de robots a su electrónica: funciones de seguridad, STO y distancias de las protecciones.'
  resumen: 'Un robot reúne motores, puentes, encoders, IMU, lazos de control, temporizadores, baterías y seguridad de máquinas, y el capítulo trata de la electrónica que los une. Sus lazos están anidados y trabajan a frecuencias muy distintas, de la planificación a unos hercios al lazo de corriente a decenas de kilohercios, lo que permite repartirlos entre procesadores. La cinemática de un brazo de tres ejes da los ángulos que hay que pedir a cada motor, y en su forma general, con transformaciones homogéneas y los parámetros de Denavit-Hartenberg, es el modelo que guarda el controlador de cualquier robot; su jacobiano da las velocidades, las singularidades y la resolución en la punta, y el par estático del peor caso, el tamaño de los motores. Los tres actuadores de un robot pequeño tienen su electrónica: el motorreductor, un puente en H cuya caída y cuya corriente de bloqueo hay que contar; el servo de modelismo, un pulso de 50 Hz que un temporizador genera sin coste; y el paso a paso, un driver con troceador y micropaso cuya velocidad útil crece con la tensión. Un eje con encoder necesita estimar la velocidad sin la cuantificación del método de contar cuentas, y su servo de posición sigue mejor un perfil trapezoidal con acción anticipativa que con un PID solo. La odometría de un robot diferencial deriva por los errores sistemáticos de sus ruedas, y un giróscopo corrige la orientación. Las normas de robots añaden las funciones de seguridad, la función STO y las distancias de las protecciones. Un robot industrial se programa en los sistemas de coordenadas de la base, la herramienta y la pieza, con movimientos articulares, lineales y circulares, enseñando los puntos con la consola, que aprovecha su repetibilidad, o fuera de línea, que depende de su exactitud y de su calibración. Un brazo de tres ejes construido por etapas y un robot móvil dimensionado de principio a fin cierran el capítulo.'
  typst:
    normas: '#let normas = normas-referencias(normas: (([ISO 8373], [Vocabulario de la robótica: la definición de robot industrial.], (("sec-57.1", "54.1"),)), ([ISO 10218-1 e ISO 10218-2 (2025)], [Requisitos de seguridad del robot industrial y de su aplicación y su célula; la parte 2 incorpora la ISO\/TS 15066 sobre aplicaciones colaborativas.], (("sec-57.6", "54.6"),)), ([ISO 13849-1 e IEC 60204-1], [Niveles de prestaciones de las funciones de seguridad y categorías de parada del equipo eléctrico de las máquinas.], (("sec-57.6", "54.6"),)), ([ISO 13855 (2024)], [Distancia mínima de las protecciones a la zona de peligro según la velocidad de aproximación del cuerpo.], (("sec-57.6", "54.6"),)), ([IEC 61800-5-2], [Funciones de seguridad de los accionamientos eléctricos, entre ellas la desconexión segura del par (STO).], (("sec-57.6", "54.6"),)), ([ISO 9283], [Criterios de prestaciones de los robots industriales y cómo se miden: repetibilidad y exactitud de posición y de trayectoria.], (("sec-57.7", "54.7"),))), lecturas: (([John J. Craig, «Introduction to Robotics: Mechanics and Control», Pearson, 4.ª ed., 2017.], "sugerencia"), ([Bruno Siciliano, Lorenzo Sciavicco, Luigi Villani y Giuseppe Oriolo, «Robotics: Modelling, Planning and Control», Springer, 2009.], "sugerencia"), ([Peter Corke, «Robotics, Vision and Control: Fundamental Algorithms in Python», Springer, 3.ª ed., 2023.], "sugerencia"),))'
    terminos: '#let terminos = terminos-clave(("Acción anticipativa (feedforward)", "sec-57.4", "54.4"), ("Centro instantáneo de rotación", "sec-57.5", "54.5"), ("Cinemática directa", "sec-57.2", "54.2"), ("Cinemática inversa", "sec-57.2", "54.2"), ("Denavit-Hartenberg (convenio)", "sec-57.2", "54.2"), ("Dispositivo de validación", "sec-57.6", "54.6"), ("Efector final", "sec-57.2", "54.2"), ("Encoder", "sec-57.4", "54.4"), ("Grado de libertad", "sec-57.1", "54.1"), ("Jacobiano", "sec-57.2", "54.2"), ("Micropaso", "sec-57.3", "54.3"), ("Movimiento articular", "sec-57.7", "54.7"), ("Movimiento lineal", "sec-57.7", "54.7"), ("Odometría", "sec-57.5", "54.5"), ("Perfil trapezoidal", "sec-57.4", "54.4"), ("Programación fuera de línea", "sec-57.7", "54.7"), ("Punto central de la herramienta (TCP)", "sec-57.7", "54.7"), ("Referenciado (homing)", "sec-57.8", "54.8"), ("Robot colaborativo", "sec-57.6", "54.6"), ("Robot diferencial", "sec-57.5", "54.5"), ("Robot industrial", "sec-57.1", "54.1"), ("Singularidad", "sec-57.2", "54.2"), ("STO (Safe Torque Off)", "sec-57.6", "54.6"), ("Transformación homogénea", "sec-57.2", "54.2"), ("Troceador (chopper)", "sec-57.3", "54.3"))'
