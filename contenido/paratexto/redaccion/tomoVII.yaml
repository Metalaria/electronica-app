# Drafted texts for the author's review (tomo VII).
cap44:
  objetivos:
    - "Clasificar cualquier bus por cuatro elecciones: serie o paralelo, síncrono o asíncrono, uno o varios maestros, referido a masa o diferencial."
    - Describir el funcionamiento, los niveles y los errores de UART, SPI e I²C, y dimensionar las resistencias de pull-up de I²C.
    - Explicar el arbitraje y los mecanismos de robustez de CAN y la arquitectura host-dispositivo de USB.
    - Elegir el bus adecuado para una aplicación, incluidos 1-Wire, I²S y los enlaces de radio, y diagnosticarlo en orden.
    - Aislar galvánicamente un bus con optoacopladores, aisladores digitales o transformadores, incluida su alimentación.
    - Determinar los límites de longitud y la terminación de un bus, y valorar la fibra óptica.
  resumen: >-
    Un sistema moderno es una conversación entre chips que sigue protocolos con sus reglas, sus virtudes
    y sus límites, y el capítulo enseña a elegir el bus adecuado y a diagnosticarlo con el osciloscopio
    o el analizador lógico. Empieza por el mapa: cuatro preguntas clasifican cualquier bus, y el caudal
    real lo limitan otros factores. La UART envía bytes sin reloj compartido, con niveles que son tres
    cosas distintas y control de flujo; SPI es el síncrono más simple, con modos que causan casi todos sus
    problemas; I²C comparte dos hilos en drenador abierto, y sus resistencias de pull-up, que es lo que
    más se hace mal, se dimensionan entre dos límites opuestos que a veces dejan la ventana vacía. CAN
    nació para el ruido del automóvil, con arbitraje no destructivo y orientación a mensajes, y USB es
    distinto de todos por su asimetría host-dispositivo, la enumeración y las clases. 1-Wire, I²S y otros
    buses de nicho completan el repertorio, y la elección se reduce a cuatro preguntas encadenadas, con un
    diagnóstico en orden y un apartado sobre los enlaces de radio BLE, Zigbee, LoRa y RFID. El
    aislamiento galvánico, con optoacopladores, aisladores digitales o transformadores, sin olvidar la
    alimentación del otro lado, y la terminación y la longitud como límites físicos de cualquier bus
    cierran el capítulo, con una ampliación sobre fibra óptica y un enlace RS-485 de 100 metros.
  grado:
    materias: [ii, sed, com]
    competencias: [TE10, TE3]
  lecturas: [axelson, barr]

cap45:
  objetivos:
    - Explicar la emisión y la detección de luz en los semiconductores.
    - Polarizar LED con resistencia o driver de corriente constante, regular su brillo por PWM y prever su comportamiento térmico.
    - Elegir entre fotodiodo, fototransistor y LDR según la precisión y la velocidad necesarias.
    - Dimensionar optoacopladores teniendo en cuenta el CTR, su envejecimiento y el rechazo de modo común transitorio.
    - Comparar las tecnologías de display y multiplexarlas, incluidos los LED direccionables y su alimentación.
    - Describir la comunicación óptica, el diodo láser con su control de potencia y su seguridad, y los sensores de imagen CCD y CMOS.
  resumen: >-
    La electrónica también ve y emite luz, y el capítulo aplica la física del semiconductor a los
    dispositivos que convierten electricidad en luz y viceversa. Ambos sentidos se explican por lo mismo.
    Un LED se alimenta con corriente, no con tensión: la resistencia en serie solo funciona si deja caer
    una fracción apreciable de la alimentación, el driver de corriente constante resuelve el resto, el
    brillo se regula por PWM porque bajar la corriente cambia el color y la temperatura decide la vida.
    Los tres detectores, fotodiodo, fototransistor y LDR, son tres compromisos distintos, y la luz
    ambiente se combate modulando la fuente. El optoacoplador aísla con luz, con un CTR que envejece y un
    rechazo de modo común transitorio, y los aisladores digitales lo están reemplazando. Los displays se
    eligen por el problema, no por el tamaño: siete segmentos, LCD de caracteres o gráfico, OLED y
    e-ink. El multiplexado ahorra pines a cambio de corriente de pico, y los LED direccionables invierten
    el planteamiento, con la alimentación como problema real. La comunicación por luz, en fibra y en
    espacio libre, el láser, cuyo umbral lo cambia todo y cuya seguridad es real, y los sensores de
    imagen CCD y CMOS, con el obturador y el color, cierran el capítulo.
  grado:
    materias: [fe, ie, te]
    competencias: [CR5, TE2, TE5]
  lecturas: [schubert, horowitz]

cap46:
  objetivos:
    - Definir la fiabilidad y sus métricas (tasa de fallos, FIT, MTBF, curva de bañera) e interpretarlas sin trampas.
    - Identificar los mecanismos de fallo térmicos, electroquímicos, mecánicos y eléctricos.
    - Aplicar el derating y la ley de Arrhenius para estimar la vida de un componente.
    - Diseñar para fabricación y para test, y analizar tolerancias por peor caso y estadísticamente.
    - Gestionar normas, trazabilidad, obsolescencia, componentes falsificados y erratas del silicio.
    - Aplicar redundancia, FMEA, ensayos acelerados HALT y HASS y criterios de mantenibilidad (MTTR).
  resumen: >-
    Que un prototipo funcione en la mesa es solo el principio: un buen diseño debe funcionar en miles de
    unidades, fabricarse sin sobresaltos y durar años en condiciones reales. El capítulo define la
    fiabilidad como una probabilidad, con sus métricas, sus trampas y la curva de bañera, y deja claro que
    un MTBF es una tasa y no una vida útil. Los mecanismos de fallo se agrupan en térmicos,
    electroquímicos, mecánicos y eléctricos, con tres modos de aparición. Un componente falla porque
    trabaja cerca de su límite: el derating, con sus cifras habituales y sus estándares, y la ley de
    Arrhenius, que relaciona la temperatura con la vida, convierten esa idea en números, con la fatiga
    de las soldaduras como excepción. El diseño para fabricación reduce la variedad, facilita el montaje
    y documenta bien, y el diseño para test asegura que una placa se pueda probar. Las tolerancias se
    analizan por peor caso y estadísticamente. Las normas, la trazabilidad y la obsolescencia hacen
    mantenible un producto; los componentes falsificados se detectan con lo que hay en el banco, y la
    errata del silicio es el documento más valioso y menos leído. La redundancia, el FMEA, los ensayos
    HALT y HASS y la mantenibilidad completan el capítulo, ilustrado con cuatro fallos célebres y la
    plaga de condensadores como caso de estudio completo.
  grado:
    materias: [te, dse, pry]
    competencias: [TE6, CR9, FB1]
  lecturas: [oconnor]

cap47:
  objetivos:
    - Elegir los instrumentos de un banco de electrónica y medir sin falsear la medida.
    - Distinguir exactitud de resolución y calcular la incertidumbre combinada, el TUR y la trazabilidad de una calibración.
    - Modelar la transmisión de calor como una cadena de resistencias térmicas, incluida la impedancia térmica transitoria.
    - Dimensionar disipadores y elegir refrigeración activa con ventiladores o células Peltier.
    - Aplicar las reglas de seguridad eléctrica y de laboratorio, las clases de protección, las distancias de aislamiento, las categorías de sobretensión y el código IP.
  resumen: >-
    El capítulo cierra la parte de diseño con tres disciplinas transversales: medir bien, evacuar el calor
    y trabajar seguro. Empieza por los instrumentos de un banco, qué aporta cada uno y en qué orden
    conviene adquirirlos, y reúne una idea que atraviesa el libro: el instrumento forma parte del
    circuito, con cuatro formas de falsear una medida, la regla del ancho de banda, la medida de
    corriente y las medidas flotantes. La exactitud no es la resolución: la incertidumbre se especifica,
    se combina en cuadratura, exige un patrón varias veces mejor y una cadena de trazabilidad, y calibrar
    no es lo mismo que ajustar ni que verificar. La transmisión de calor por conducción sigue una
    ecuación idéntica a la ley de Ohm, de modo que un problema térmico se resuelve como un circuito de
    resistencias, con el material de interfaz como factor decisivo y la impedancia térmica transitoria
    para los pulsos de potencia. El disipador se dimensiona invirtiendo ese cálculo, y la refrigeración
    activa con ventiladores o células Peltier se elige con una tabla. La seguridad eléctrica parte de que
    daña la corriente y no la tensión: el diferencial protege a las personas, y las clases de protección,
    el doble aislamiento, las distancias, las categorías de sobretensión de la IEC 61010 y el código IP
    de la IEC 60529 organizan la protección. Ampliaciones sobre convección, radiación y calibración
    completan el capítulo.
  grado:
    materias: [ie, te]
    competencias: [TE5, CR1, TE6]
  lecturas: [perez-garcia, horowitz]

cap48:
  objetivos:
    - Relacionar cada uno de los cuatro proyectos detallados con los capítulos del libro que integra.
    - Aplicar un método por etapas a un proyecto propio, de la especificación con números a la validación.
    - Elaborar los presupuestos de potencia, de error y de tiempo antes de dibujar el esquema.
    - Documentar y compartir un proyecto con control de versiones.
  resumen: >-
    El capítulo introduce los cuatro proyectos completos que siguen: una estación de medida ambiental
    conectada, una fuente de alimentación de laboratorio, un amplificador de audio de alta fidelidad y una
    radio definida por software. Todos siguen el mismo método, de la especificación a las medidas, y una
    tabla de cobertura muestra qué parte del libro integra cada uno. Su núcleo es el método para abordar
    un proyecto propio, que empieza por evitar el error de abrir el programa de esquemas: primero la
    especificación con números, después el diagrama de bloques, la elección de los componentes clave, el
    esquema, el prototipo y, por último, la placa, el montaje y la validación, con los errores que más
    veces arruinan un proyecto y un presupuesto de tiempo. El paso más difícil es el primero, y el
    capítulo insiste en una línea que suele faltar: la exactitud, que no es lo mismo que la regulación.
    Tres presupuestos conviene hacerlos siempre antes de dibujar nada: el de potencia, el de error, con la
    suma en cuadratura y la regla de que lo que está tres veces por debajo del término dominante apenas
    cuenta, y el de tiempo, con el camino crítico y los márgenes. La documentación, mínima e imprescindible,
    con control de versiones, y el paso de un diagrama de bloques a un diseño completo cierran el
    capítulo.
  grado:
    materias: [pry, dse, tfg]
    competencias: [TE6, CR12]
  lecturas: [horowitz]

cap49:
  objetivos:
    - Redactar la especificación con números de una estación de medida ambiental y derivar de ella la arquitectura.
    - Elegir y montar sensores digitales y un micrófono analógico con su acondicionamiento y su detector de nivel.
    - Diseñar el esquema completo con un ESP32 respetando sus restricciones de pines y su consumo.
    - Dimensionar el bus I²C y el presupuesto de alimentación y de corriente.
    - Estructurar el firmware por ritmos y capas y enviar los datos a la nube con MQTT.
    - Montar, calibrar, validar y proteger el dispositivo frente a ataques.
  resumen: >-
    El primero de los proyectos detallados es una estación que mide el clima, la luz, el sonido y el
    movimiento de una estancia, lo muestra en una pantalla y lo envía a la nube. Se desarrolla de principio
    a fin, empezando por la especificación con números y el criterio de aceptación. La arquitectura sale
    de la restricción que domina el proyecto, el consumo, con un presupuesto por fases y un diagrama de
    tiempos. Los sensores se eligen con preferencia por los digitales, y su montaje, separado del calor
    del resto del circuito, decide la medida. El ESP32 aporta conectividad y recursos a cambio de
    restricciones de pines y de un consumo que decide la alimentación. El esquema completo se presenta
    como documento de trabajo, con anotaciones imprescindibles y comprobaciones previas, y el bus I²C se
    dimensiona para este caso. La medida del nivel sonoro con un micrófono de electret reúne
    acondicionamiento, conversión y procesado. La alimentación, el presupuesto de corriente y la lista de
    materiales, con criterios de compra por especificación, preceden al firmware, organizado en tres
    ritmos, capas y una máquina de estados. Los datos se envían por MQTT a un panel, con la marca de
    tiempo y la seguridad como requisitos. El montaje, la puesta a punto, la calibración, la seguridad
    del dispositivo conectado y cinco ampliaciones cierran el proyecto.
  grado:
    materias: [sed, ie, ii]
    competencias: [TE3, TE5, TE10]
  lecturas: [barr, pallas]

cap50:
  objetivos:
    - Especificar una fuente de alimentación de laboratorio y elegir su arquitectura con prerregulador y regulador lineal.
    - "Aplicar las reglas de seguridad para trabajar con la red: zonas, barrera de aislamiento, primario y tierra de protección."
    - Dimensionar el transformador, el rectificador y el condensador de filtro.
    - Diseñar el lazo de regulación de tensión y el límite de corriente con su estabilidad.
    - Calcular la disipación del elemento de paso, su área de operación segura y el disipador.
    - Medir la regulación de línea y de carga, el rizado y el ruido, y preparar la fabricación de la placa.
  resumen: >-
    El segundo proyecto es la herramienta que más se usa en un banco: una fuente de alimentación regulable
    con límite de corriente. Es electrónica lineal clásica y reúne el rectificador y el filtro, el
    operacional en lazo cerrado, los transistores de paso y su disipación, y la seguridad al trabajar con
    la red, por la que empieza el capítulo: dos zonas y la barrera entre ellas, lo que debe llevar el
    primario y la tierra de protección. La arquitectura resuelve tres problemas a la vez con un
    prerregulador y un regulador lineal, la transición entre modos y la descarga de la salida. De la red a
    la continua, el transformador, el rectificador y el condensador de filtro condicionan todo lo demás.
    La fuente es un lazo de control cuya estabilidad es el problema; el límite de corriente, con su doble
    lazo, la convierte en instrumento. La disipación es el talón de Aquiles del lineal: el caso peor, el
    área de operación segura y el disipador se calculan con números, reunidos y comprobados frente a la
    especificación. La lista de materiales, el montaje por bloques, los ajustes y las pruebas de
    esfuerzo preceden a la medida de las especificaciones que definen una fuente: la regulación de línea
    y de carga, el sensado remoto, el rizado y el ruido. Las ampliaciones, un proyecto ampliado con los
    cálculos revisados y la documentación de fabricación de la placa cierran el capítulo.
  grado:
    materias: [ep, ea, ra]
    competencias: [TE4, TE6, TE8]
  lecturas: [brown, horowitz]
