# Drafted texts for the author's review (tomo III).
cap16:
  objetivos:
    - Explicar el funcionamiento del receptor superheterodino de FM estéreo, la frecuencia intermedia y la frecuencia imagen.
    - Describir la función de cada integrado del FM7303, incluida la decodificación de la señal MPX.
    - Identificar los componentes del kit y relacionar el esquema con la placa por bloques y con la serigrafía.
    - Montar el receptor paso a paso aplicando la técnica de soldadura.
    - Alinear y calibrar el front-end, la FI, el AFC y el decodificador estéreo con el FNIRSI 2C53T en los puntos de prueba.
    - Diagnosticar averías siguiendo el camino de la señal y comparando con el mapa de tensiones.
  resumen: >-
    El capítulo es el más práctico del libro: el montaje, la alineación y la comprensión completa del
    receptor de FM estéreo FM7303 V3.0r7, un proyecto que pone a prueba casi todo lo estudiado. Empieza
    por el juego de chips, cinco integrados clásicos con una función clara cada uno, y por el principio
    del superheterodino: convertir cualquier emisora a una frecuencia intermedia fija de 10,7 MHz, donde
    se amplifica y se filtra siempre igual, a cambio de la frecuencia imagen que debe atenuar el
    circuito sintonizado de entrada. La señal MPX explica cómo se transmite el estéreo de forma
    compatible con los receptores mono. El amplificador de audio, la alimentación y el display completan
    la descripción. La parte constructiva recorre el inventario del kit, el esquema y la placa por
    bloques de colores, los puntos de prueba, el montaje en ocho pasos y la carcasa. El corazón del
    proyecto es la alineación con el FNIRSI 2C53T: comprobación en frío, tensiones, ajuste de RF y FI,
    seguimiento, AFC, el ajuste del estéreo a 38 kHz y el silenciador. El diagnóstico por etapas, la
    lista de materiales, el manual original traducido, las equivalencias de los integrados Toshiba, la
    lectura de la serigrafía, el front-end, el recorrido del esquema de la antena al altavoz y el mapa
    de tensiones convierten el kit en un caso de estudio completo.
  grado:
    materias: [com, ea, ie]
    competencias: [TE2, TE5, TE10]
  lecturas: [arrl, hayward, bowick]

cap17:
  objetivos:
    - Describir los bloques de un microcontrolador, su memoria, su reloj y el ciclo de vida de un programa.
    - Identificar los recursos de la placa Arduino UNO y sus límites eléctricos y de corriente.
    - Programar entradas y salidas digitales, entradas analógicas y salidas PWM, teniendo en cuenta lo que mide el convertidor.
    - Elegir entre UART, I²C y SPI para conectar sensores, actuadores y módulos.
    - Estructurar programas que no bloquean, con millis() y máquinas de estados.
    - Usar la cadena de herramientas y técnicas de depuración para localizar errores de compilación, de carga y de ejecución.
  resumen: >-
    Con el microcontrolador el comportamiento de un circuito pasa a definirse por software. El capítulo
    lo presenta como un ordenador completo en un chip, con cinco bloques, una memoria RAM escasa que
    condiciona el programa, varias opciones de reloj y un ciclo de vida que empieza antes de setup().
    La placa Arduino UNO añade lo mínimo para funcionar y un puente USB; sus pines tienen funciones
    alternativas y límites que hay que respetar. Un pin digital no es un interruptor ideal: alto y bajo
    no son simétricos, una entrada que flota es un problema y las cargas que exceden el pin necesitan un
    transistor. El convertidor de 10 bits mide una proporción de su referencia y tarda un tiempo en
    convertir, y el PWM no es una salida analógica hasta que se filtra. La comunicación se resuelve con
    UART, I²C o SPI, cada una con su uso y sus trampas, y los módulos se tratan como circuitos que hay
    que verificar antes de conectar. Se explica qué ocurre al pulsar «subir», cómo se leen el resultado
    de la compilación y las bibliotecas, y por qué delay() bloquea: la alternativa es comprobar el reloj
    con millis(), con una resta que resuelve el desbordamiento, y organizar el programa como una máquina
    de estados. La alimentación de la placa, sus límites de corriente y la depuración con el puerto
    serie cierran el capítulo.
  grado:
    materias: [sed, inf, ed]
    competencias: [TE3, FB3, TE10]
  lecturas: [monk, barr]

cap18:
  objetivos:
    - Distinguir un ordenador de placa única de un microcontrolador y decidir cuándo conviene cada uno con criterios cuantitativos.
    - Describir el conector GPIO de la Raspberry Pi, su estado al arrancar y sus límites eléctricos a 3,3 V.
    - Controlar el hardware desde Python a través del sistema operativo, con sus permisos y su rendimiento.
    - Explicar el proceso de arranque del sistema operativo y la gestión de la tarjeta de memoria.
    - Integrar interfaces de alto nivel (cámara, pantalla, red, audio, almacenamiento) en un proyecto.
    - Prever el apagado seguro y la alimentación de un sistema basado en Raspberry Pi.
  resumen: >-
    La Raspberry Pi es un ordenador completo del tamaño de una tarjeta, con procesador, memoria,
    almacenamiento, red y vídeo, y el capítulo la estudia frente al microcontrolador. Sus cuarenta pines
    no son cuarenta entradas y salidas equivalentes: cada uno tiene funciones, un estado al arrancar y
    unos límites que deben comprobarse antes de conectar nada, y trabajan a 3,3 V sin tolerar 5 V.
    Programar el hardware desde Python es cómodo, pero el acceso pasa por el sistema operativo, con sus
    permisos, su gestión de recursos y un rendimiento que explica tanto su facilidad como sus límites.
    Los proyectos que justifican un ordenador de placa son los que necesitan una interfaz de alto nivel:
    cámara, pantalla, red, audio o almacenamiento. La comparación con el microcontrolador se plantea
    como dos máquinas con propósitos distintos y se resume en una tabla de decisión y en criterios
    cuantitativos de coste, consumo y autonomía. El arranque del sistema operativo, el sistema de
    ficheros sobre la tarjeta y la configuración del hardware se explican en detalle, con una
    advertencia que recorre el capítulo: el apagado no es opcional, porque cortar la alimentación puede
    corromper la tarjeta. Tres problemas sobre un optoacoplador, los límites del espacio de usuario y el
    apagado seguro cierran el capítulo.
  grado:
    materias: [sed, inf, ii]
    competencias: [TE3, FB3, TE10]
  lecturas: [upton, barr]

cap19:
  objetivos:
    - Repartir el trabajo entre un microcontrolador para el tiempo real y un ordenador de placa para el resto.
    - Elegir el medio de comunicación entre placas (UART, USB, SPI, I²C, Ethernet o wifi) y su nivel físico.
    - Diseñar un protocolo robusto entre placas con delimitación de tramas, detección de errores, confirmación y tiempos de espera.
    - Aplicar watchdog, reinicio en estado seguro, detección de alimentación baja y registro en un sistema que funciona sin parar.
    - Dimensionar el enlace, los tiempos y el consumo de una arquitectura mixta.
    - "Planificar el paso del prototipo al producto: alimentación, caja, despliegue, documentación y obligaciones legales."
  resumen: >-
    El capítulo une el microcontrolador y el ordenador de placa en un mismo sistema. El primero es
    determinista, arranca al instante y consume poco; el segundo aporta procesamiento y conectividad. El
    criterio de reparto se resume en una frase: el microcontrolador para el tiempo real y el ordenador
    para todo lo demás, con una frontera bien trazada que separa un sistema robusto de uno frágil. Las
    placas pueden comunicarse por UART, USB, SPI, I²C, Ethernet o wifi, y la elección se resume en una
    tabla; pero enviar bytes por una UART funciona en el banco y falla en el equipo real, de modo que el
    enlace necesita un protocolo con delimitación de tramas, detección de errores, confirmación con
    reintento y tiempos de espera. La estación de monitorización ambiental sirve de proyecto
    integrador. Un sistema que funciona día y noche necesita además un watchdog bien usado, el registro
    de la causa de cada reinicio, el arranque en un estado seguro y la detección de alimentación baja.
    El paso del prototipo al producto obliga a decidir la alimentación definitiva, la caja, la
    conectividad, la documentación y las obligaciones legales, como el marcado CE y RoHS. Criterios
    cuantitativos sobre el caudal, la tolerancia de reloj de la UART y el presupuesto de fiabilidad, y
    una reflexión sobre el camino por delante, cierran el capítulo.
  grado:
    materias: [sed, ii, dse]
    competencias: [TE3, TE10, TE6]
  lecturas: [ganssle, barr]

cap20:
  objetivos:
    - Dimensionar optoacopladores y relés, incluidas sus protecciones, y elegir entre relé mecánico y de estado sólido.
    - Elegir cristales, resonadores y osciladores y su capacidad de carga para la base de tiempos de un sistema digital.
    - Diseñar la protección y el acondicionamiento de las entradas de un microcontrolador.
    - Comparar sensores por su salida y por sus parámetros, y explicar por qué la industria transmite en lazo de corriente.
    - Leer encoders rotatorios y pulsadores eliminando los rebotes.
    - Elegir conectores y cables teniendo en cuenta la fiabilidad del contacto y los errores de diseño frecuentes.
  resumen: >-
    Un proyecto real usa, además de los componentes básicos, una familia de componentes especializados
    para aislar, conmutar, medir y comunicar, y casi todos se conectan a un microcontrolador. El
    optoacoplador aísla con luz y se dimensiona por su relación de transferencia y su velocidad; el relé
    conmuta lo grande con lo pequeño y necesita dos protecciones imprescindibles, y el relé de estado
    sólido cambia sus virtudes e inconvenientes. Los cristales y resonadores fijan la base de tiempos:
    su exactitud, la capacidad de carga que suele ignorarse y sus modos de fallo condicionan todo el
    sistema digital. Ninguna señal del mundo real entra directamente en un microcontrolador: la
    protección, la adaptación de nivel y el filtrado previo a la conversión forman el acondicionamiento.
    Los sensores se clasifican por su salida en cuatro familias, con razones para preferir el digital,
    y el montaje importa tanto como el sensor. Los buses se estudian desde el punto de vista del
    componente, y los encoders y pulsadores, desde los rebotes y su lectura correcta. Los conectores y
    cables, que ocupan un lugar alto en la lista de averías, reciben su propia sección. Criterios
    cuantitativos para cada familia y tres problemas sobre la no linealidad del puente, el cable de un
    sensor capacitivo y el lazo de 4 a 20 mA cierran el capítulo.
  grado:
    materias: [ie, sed, ii]
    competencias: [TE5, TE10, TE3]
  lecturas: [pallas, horowitz]

cap21:
  objetivos:
    - Describir los tres instrumentos del FNIRSI 2C53T y sus limitaciones de ancho de banda, muestreo y resolución.
    - Compensar la sonda y elegir entre ×1 y ×10, el acoplamiento de entrada y las escalas vertical y horizontal adecuadas.
    - Configurar el disparo para capturar señales repetitivas y eventos únicos.
    - Medir con medidas automáticas y con cursores, sabiendo de dónde salen sus errores.
    - Usar la FFT con la ventana y la resolución adecuadas para medir distorsión y ruido, y el modo X-Y.
    - Aplicar el multímetro True RMS y el generador DDS con un procedimiento de medida seguro, incluidas las medidas flotantes.
  resumen: >-
    El capítulo es la guía completa del FNIRSI 2C53T, el instrumento tres en uno que acompaña a todo el
    libro: osciloscopio, multímetro y generador. Parte de lo que un osciloscopio muestra y lo que no, y
    de cuatro limitaciones que conviene conocer desde el principio. Tras reconocer el panel, los botones
    y la pantalla, la compensación de la sonda se presenta como un paso obligatorio que invalida todas
    las medidas si se omite. Las escalas de voltios y tiempo por división, el acoplamiento AC, DC y GND
    y la elección entre las sondas ×1 y ×10, en la que manda la capacidad, preparan la medida. El
    sistema de disparo se explica a fondo: modos, nivel y flanco, acoplamiento, holdoff, pre-trigger y
    modo único para capturar un fallo raro. Las medidas automáticas y los cursores se comparan por su
    origen de error, y la función matemática añade la resta y la FFT, que el libro usa como instrumento
    para medir distorsión, ruido y oscilaciones: leakage, ventanas, promediado y los errores que
    producen espectros falsos. El modo X-Y, el multímetro True RMS de 19 999 cuentas y el generador
    DDS completan las funciones. Un flujo de trabajo en procedimientos, aplicaciones de diagnóstico, el
    mantenimiento, los límites de ancho de banda, muestreo y aliasing, y los peligros de la masa del
    osciloscopio en medidas flotantes cierran la guía.
  grado:
    materias: [ie]
    competencias: [TE5]
  lecturas: [perez-garcia, horowitz]
