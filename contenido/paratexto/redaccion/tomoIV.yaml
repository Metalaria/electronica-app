# Drafted texts for the author's review (tomo IV).
cap22:
  objetivos:
    - Comprobar experimentalmente la ley de Ohm, el divisor y el efecto de carga del instrumento.
    - Medir la carga y descarga de un circuito RC y la característica I-V de un diodo, punto a punto y en modo X-Y.
    - Medir la rectificación, el rizado y la forma de la corriente de un rectificador de media onda.
    - Levantar el diagrama de Bode de un filtro RC y la curva de resonancia y el factor Q de un circuito RLC.
    - Observar armónicos con la FFT, la modulación AM y FM y su demodulación.
    - Medir el tiempo de subida y el ancho de banda de un sistema de medida, y valores de L y C con puentes y con un medidor LCR.
    - Analizar las discrepancias entre teoría y medida y documentar una práctica en el cuaderno.
  resumen: >-
    El capítulo cierra el círculo entre teoría y banco con doce prácticas guiadas, montables en
    protoboard, que permiten ver y medir con el FNIRSI los fenómenos de los capítulos de teoría. Cada
    práctica indica su objetivo, el material, el montaje, el procedimiento y lo que debería observarse,
    y casi todas provocan un descubrimiento. El divisor de tensión enseña que el instrumento carga el
    circuito y que un divisor no alimenta nada. La carga de un condensador comprueba la exponencial; la
    curva I-V del diodo convierte la ecuación de Shockley en algo visto; el rectificador de media onda
    revela la forma impulsiva de la corriente. El filtro RC se mide punto a punto hasta obtener su
    diagrama de Bode, y la FFT muestra que la simetría de una forma de onda explica los armónicos
    ausentes. El 555 en astable, el transistor como interruptor y la resonancia RLC, con su factor Q y
    la sobretensión que sorprende, completan la parte de circuitos. Las últimas prácticas miden el
    tiempo de subida y el ancho de banda del propio sistema de medida, la modulación AM y FM y su
    demodulación, y las inductancias y capacidades con puentes clásicos y con un medidor LCR. El cierre
    ordena las fuentes de discrepancia entre la teoría y la medida y explica cómo se anota una práctica.
  grado:
    materias: [ie, tc, ea]
    competencias: [TE5, CR4, TE2]
  lecturas: [perez-garcia, horowitz]

cap23:
  objetivos:
    - Describir un circuito con los conceptos topológicos de nudo, rama, malla y árbol, y aplicar la dualidad.
    - Plantear y resolver el análisis por nudos y por mallas, incluidos el supernudo y la supermalla.
    - Aplicar los teoremas de superposición, Thévenin, Norton, Millman y máxima transferencia de potencia, y la transformación de fuentes.
    - Incluir fuentes dependientes en el análisis.
    - Extender los métodos al régimen de alterna con impedancias complejas.
    - Formular el análisis nodal en forma matricial, como lo hacen los simuladores, y aplicar reciprocidad, sustitución y el teorema de Tellegen.
  resumen: >-
    Resolver circuitos caso por caso funciona mientras son pequeños; con diez nudos y varias fuentes
    hace falta un método que no dependa de la intuición. El capítulo lo construye empezando por la
    topología: nudos, ramas y mallas, los números que se deducen de ellos y la dualidad. Las leyes de
    Kirchhoff se revisan en profundidad, incluidos los casos en que dejan de valer. El análisis por
    nudos, el que usan los ordenadores, se desarrolla con su matriz de conductancias y el supernudo para
    las fuentes de tensión; el análisis por mallas, con la supermalla, se reserva para los casos en que
    da menos ecuaciones. Los teoremas permiten sustituir media red por un equivalente: la superposición,
    válida solo en circuitos lineales; Thévenin y Norton, con su medida experimental y sus límites; la
    transformación de fuentes, y la máxima transferencia de potencia, con su rendimiento del 50 % y los
    tres criterios de acoplamiento. Todo se extiende a la alterna con números complejos, y las fuentes
    dependientes cambian una regla de las anteriores. El teorema de Millman es un atajo para nudos con
    muchas ramas; la formulación matricial del análisis nodal es la base de los simuladores, y la
    reciprocidad, la sustitución y el teorema de Tellegen cierran un capítulo que convierte el análisis
    de circuitos en un procedimiento sistemático.
  grado:
    materias: [tc]
    competencias: [CR4, TE1, FB1]
  lecturas: [alexander, hayt]

cap24:
  objetivos:
    - Separar la respuesta de un circuito en transitorio y régimen permanente y resolver circuitos de primer orden con sus tres datos.
    - Resolver la respuesta de segundo orden de un circuito RLC y relacionar el amortiguamiento con el factor de calidad.
    - Describir una senoide por su valor eficaz, su factor de cresta y su desfase, y medir el desfase.
    - Analizar circuitos en régimen senoidal permanente con fasores e impedancias.
    - Calcular las potencias activa, reactiva y aparente y corregir el factor de potencia.
    - Analizar la resonancia serie y paralelo, la admitancia y los límites del factor de calidad.
    - Analizar la inductancia mutua y el transformador en alterna.
  resumen: >-
    Entre el instante en que algo cambia y el momento en que el circuito se asienta hay un transitorio
    gobernado por condensadores y bobinas, y el capítulo lo estudia resolviendo las ecuaciones
    diferenciales del circuito antes de pasar al régimen senoidal permanente. Toda respuesta es la suma
    de una natural, que tiene la forma del circuito y decae, y una forzada, que tiene la forma de la
    fuente; en primer orden bastan el valor inicial, el final y la constante de tiempo. El segundo orden
    lo gobierna el amortiguamiento, equivalente al factor de calidad: el circuito que más oscila tras
    un escalón es el que más selectivamente resuena. La senoide, que no es una convención arbitraria,
    se describe por su valor eficaz, su factor de cresta y su desfase. Los fasores convierten la alterna
    en una continua compleja en la que R, jωL y 1/(jωC) se combinan con Kirchhoff, Thévenin y Norton. En
    alterna hay tres potencias, activa, reactiva y aparente, y el cableado se dimensiona por la aparente;
    un condensador corrige el desfase de una carga inductiva, pero no los armónicos de una fuente
    conmutada. La resonancia serie y paralelo, la admitancia, el factor de calidad cargado y sus límites,
    la inductancia mutua y el transformador en alterna, con su banda limitada, completan el capítulo.
  grado:
    materias: [tc, elt]
    competencias: [CR4, TE1, FB1]
  lecturas: [alexander, hayt]

cap25:
  objetivos:
    - Modelar un bloque como cuadripolo y elegir el juego de parámetros adecuado.
    - Operar con decibelios absolutos y relativos sin errores conceptuales.
    - Trazar diagramas de Bode asintóticos de módulo y fase a partir de polos y ceros.
    - Diseñar filtros pasivos y activos (Sallen-Key, realimentación múltiple, variable de estado) y conocer los de condensadores conmutados.
    - Elegir el orden y la aproximación de un filtro (Butterworth, Chebyshev, elíptico, Bessel) según su compromiso.
    - Diseñar filtros paso banda y banda eliminada y relacionarlos con el factor de calidad.
    - Evaluar la fase y el retardo de grupo de un filtro y sus consecuencias en el dominio del tiempo.
  resumen: >-
    Un circuito de señal interesa por cómo trata cada frecuencia, y el capítulo da el salto al análisis
    en frecuencia. Primero modela cualquier bloque como una caja de dos puertos, con cuatro magnitudes y
    varios juegos de parámetros, de los que dos se usan casi siempre y otros se reservan para la
    radiofrecuencia. El decibelio se presenta como una relación y no como una cantidad, con los valores
    que conviene saber de memoria y los que llevan referencia. La función de transferencia se representa
    en el diagrama de Bode, que se dibuja con asíntotas a partir de los polos y los ceros, con el pico
    de resonancia del segundo orden y una fase que es donde está la dificultad. Los filtros son el uso
    más directo de estas ideas: los pasivos, con sus cuatro tipos y sus parámetros; los activos, que
    resuelven las limitaciones de los pasivos con las topologías de Sallen-Key, de realimentación
    múltiple y de variable de estado, siempre condicionados por el operacional; y los de condensadores
    conmutados, que se sintetizan sin resistencias. El orden coincide con el número de elementos que
    almacenan energía, y las aproximaciones de Butterworth, Chebyshev, elíptica y Bessel reparten de
    forma distinta el compromiso entre pendiente, rizado y fase. Los filtros de banda, el notch y el
    retardo de grupo, que decide si retardar es o no distorsionar, cierran el capítulo.
  grado:
    materias: [tc, ea, ss]
    competencias: [CR4, TE2, TE6]
  lecturas: [franco, alexander]

cap26:
  objetivos:
    - Explicar la estructura de bandas del silicio, la generación y recombinación de portadores y el dopado.
    - Describir la unión PN y la movilidad de los portadores como origen del comportamiento de los dispositivos.
    - Analizar los modos de trabajo del BJT y sus modelos (Ebers-Moll, transporte en la base, pequeña señal, Gummel-Poon).
    - Explicar la formación del canal del MOSFET, sus capacidades, sus regiones y su coeficiente térmico.
    - Relacionar las capacidades de unión y el tiempo de tránsito con la velocidad de los dispositivos.
    - Evaluar el efecto de la temperatura en los parámetros de diodos y transistores.
    - Comparar el silicio con SiC y GaN y explicar la estructura y los límites del IGBT.
  resumen: >-
    Los capítulos 5 a 7 presentaron el diodo y los transistores por lo que hacen en el circuito; este
    abre la caja para explicar de dónde salen las cifras de las hojas de datos. Parte del cristal de
    silicio, que no es buen conductor ni buen aislante sino que está exactamente en medio, de su
    estructura de bandas y de la banda prohibida, que determina casi todo, con el par electrón-hueco y
    la generación y recombinación. El dopado crea portadores libres y la unión PN es donde ocurre todo
    lo demás. Sobre ella se construye el bipolar, con sus cuatro modos de trabajo y cuatro modelos que
    sirven para cosas distintas, de Ebers-Moll a Gummel-Poon, pasando por el transporte en la base y la
    pequeña señal. El MOSFET se explica por su estructura, la formación del canal y unas capacidades que
    son su límite real, y por su comportamiento: dos regiones, un coeficiente térmico decisivo, el diodo
    de cuerpo y la sensibilidad electrostática. La velocidad de los dispositivos depende de dos causas
    físicas, las capacidades de la unión y el tiempo de tránsito, que se combaten de forma distinta. La
    temperatura lo mueve todo, y el capítulo resume sus efectos en una tabla. Los materiales de banda
    ancha, SiC y GaN, rompen los compromisos del silicio, y el IGBT, con la modulación de conductividad,
    su cola de corriente y el riesgo de latch-up, cierra el capítulo.
  grado:
    materias: [fe, fis]
    competencias: [CR5, FB2, TE2]
  lecturas: [streetman, sze]

cap27:
  objetivos:
    - Aplicar el modelo ideal del operacional y reconocer cuándo deja de valer.
    - Cuantificar los beneficios de la realimentación negativa e identificar sus cuatro topologías.
    - Diseñar las configuraciones básicas y los circuitos de operación con señales (sumador, restador, integrador, derivador, logarítmico).
    - Evaluar las limitaciones del operacional real y elegir la familia adecuada.
    - Diseñar comparadores con histéresis y amplificadores de instrumentación.
    - Analizar la estabilidad del lazo con los márgenes de fase y de ganancia y aplicar técnicas de compensación, incluida la carga capacitiva.
  resumen: >-
    Si hubiera que elegir un solo bloque que resume la electrónica analógica moderna, sería el
    amplificador operacional, y con la realimentación se convierte en casi cualquier cosa. El capítulo
    parte del modelo ideal, con sus dos reglas de oro y la condición que se olvida, y de los errores de
    razonamiento habituales. La realimentación negativa convierte una ganancia grande, imprecisa y no
    lineal en otra exacta fijada por resistencias: sus cinco beneficios se cuantifican con el factor
    1 + A·β, junto con lo que no mejora, las cuatro topologías y la masa virtual. Las configuraciones
    básicas resuelven casi todo y se combinan para sumar, restar, integrar, derivar y operar con
    logaritmos. El operacional real tiene límites que en algún momento se notan, y elegirlo es elegir
    por el parámetro que importa. La realimentación positiva da los comparadores con histéresis. El
    amplificador de instrumentación de tres operacionales resuelve la medida de diferencias pequeñas
    sobre una tensión común. La segunda mitad trata la estabilidad: el precio de la realimentación, los
    márgenes de fase y de ganancia, la compensación por polo dominante y por efecto Miller, el caso
    difícil de la carga capacitiva y cómo medir el margen de fase sin analizador de redes. Tres
    problemas de diseño, una célula de carga, un fotodiodo y un termostato, cierran el capítulo.
  grado:
    materias: [ea, ra, ie]
    competencias: [TE2, TE8, TE5]
  lecturas: [franco, mancini, sedra]

cap28:
  objetivos:
    - Enunciar las condiciones de oscilación y clasificar las tres familias de osciladores.
    - Describir el funcionamiento de un PLL y elegir su ancho de banda de lazo.
    - Diseñar osciladores de cristal en configuración Pierce y osciladores RC de baja frecuencia con control de amplitud.
    - Analizar osciladores de relajación y multivibradores.
    - Explicar el ruido de fase y el jitter y sus consecuencias en los sistemas.
    - Asegurar el arranque de un oscilador y la estabilización de su amplitud.
  resumen: >-
    El capítulo trata los circuitos que generan su propia señal, los que sincronizan una señal con otra
    y las referencias que fijan su frecuencia, todos con la realimentación del capítulo anterior puesta
    a trabajar para crear y enganchar; dos de estos bloques están en el FM7303. Un oscilador convierte
    energía continua en una señal periódica: necesita una ganancia de lazo suficiente y una fase
    adecuada, y su estabilidad de frecuencia depende de la familia elegida. El lazo de enganche de fase
    compara la fase de la entrada con la de un oscilador propio y lo corrige hasta que coinciden; su
    ancho de banda es la decisión central, con el enganche, la captura y los espurios del fraccionario.
    El cristal se distingue del circuito LC por su estabilidad y sus dos resonancias, y se monta en el
    circuito de Pierce. Por debajo de unos cientos de kilohercios se usan los osciladores RC, como el
    puente de Wien con control automático de amplitud o los de desplazamiento de fase, y los
    multivibradores de relajación, sencillos e imprecisos. El ruido de fase y el jitter son el mismo
    fenómeno visto en frecuencia y en tiempo, con consecuencias distintas en radio, conversión y
    comunicaciones. El capítulo termina con el arranque y la estabilización de amplitud y con tres
    problemas, uno de ellos una fuente lineal completa desde la especificación.
  grado:
    materias: [ea, com]
    competencias: [TE2, TE6, TE10]
  lecturas: [horowitz, bowick]

cap29:
  objetivos:
    - Explicar la regeneración que justifica la representación digital y sus costes.
    - Simplificar funciones lógicas con el álgebra de Boole y formas canónicas, y prever los glitches.
    - Diseñar circuitos secuenciales con latches y flip-flops respetando sus tiempos.
    - Diseñar máquinas de estados de Moore y Mealy, contadores y registros de desplazamiento.
    - Comparar las tecnologías de memoria (SRAM, DRAM, Flash, EEPROM, FRAM).
    - Aplicar las condiciones de setup, hold y skew para fijar la frecuencia máxima de un diseño síncrono.
    - Representar números en hexadecimal, BCD, complemento a dos, coma fija y coma flotante, y describir cómo se construye un procesador.
  resumen: >-
    La electrónica digital trabaja con dos niveles y, sobre ellos, construye desde una puerta hasta un
    microprocesador; el capítulo es el cimiento teórico de los microcontroladores. Empieza por la razón
    de fondo, la regeneración de la señal, con lo que se paga por ella y lo que siempre seguirá siendo
    analógico. El álgebra de Boole y las puertas reales llevan a la lógica combinacional, con sus bloques
    que se repiten, la simplificación, las formas canónicas y los glitches que no aparecen en la tabla
    de verdad. La memoria llega con la lógica secuencial: latch y flip-flop no son lo mismo, y los
    tiempos son lo que importa. Las máquinas de estados de Moore y Mealy se diseñan paso a paso, con la
    codificación de los estados y el riesgo de los estados no alcanzables; contadores y registros son
    casos particulares. Las memorias, SRAM, DRAM, Flash, EEPROM y FRAM, guardan un bit de cinco formas
    distintas con consecuencias prácticas que se resumen en una tabla. El diseño síncrono se justifica
    como la única forma sensata de controlar retardos que varían con la temperatura, la tensión y el
    ejemplar: setup, hold, skew y frecuencia máxima. La representación numérica, del hexadecimal a la
    coma flotante y el orden de los bytes, y el ensamblaje de un procesador con las piezas vistas cierran
    el capítulo.
  grado:
    materias: [ed, sed]
    competencias: [TE3, TE6]
  lecturas: [mano, harris, floyd]
