# Drafted texts for the author's review (tomo VI).
cap37:
  objetivos:
    - Explicar en qué se diferencia el hardware configurable de un procesador que ejecuta instrucciones.
    - Comparar CPLD y FPGA y describir la estructura interna de una FPGA (LUT, flip-flops, interconexión, bloques especializados).
    - Describir hardware en VHDL y Verilog con estilo síncrono y verificarlo con un banco de pruebas.
    - Seguir el flujo de diseño de una FPGA con sus restricciones, simulación, depuración e informes.
    - Cerrar tiempos con el análisis de slack y resolver el cruce de dominios de reloj.
    - Implementar bloques de DSP en hardware, como filtros FIR y CORDIC, e integrar un procesador RISC-V.
    - Decidir entre FPGA, microcontrolador y ASIC con criterios técnicos y económicos.
  resumen: >-
    La lógica programable resuelve los problemas en los que la secuencialidad de un microcontrolador es
    un cuello de botella: un chip cuya función no se programa con instrucciones, sino describiendo el
    circuito que se quiere que sea. El capítulo empieza por ese cambio mental y por el coste real de la
    tecnología, compara CPLD y FPGA por su arquitectura y abre una FPGA: tablas de consulta, flip-flops,
    una interconexión que es lo que de verdad cuesta, bloques especializados y la configuración. Describir
    hardware no es programar: VHDL y Verilog son concurrentes, distinguen lo combinacional de lo
    secuencial y se escriben en estilo síncrono, y el divisor de frecuencia y un módulo completo con su
    banco de pruebas, que es el verdadero trabajo, lo muestran. El flujo de diseño tiene siete etapas,
    con restricciones tan importantes como el código. La comparación con el microcontrolador concluye que
    a menudo la respuesta son los dos. Una SDR en FPGA, con el CORDIC y el filtro FIR implementados, la
    recreación de sistemas digitales antiguos y el caso de una consola de 8 bits llevan los conceptos a
    proyectos completos. Los ASIC, con su punto de equilibrio económico y su verificación, y un caso real
    con treinta años de distancia, comparan fabricar silicio con configurarlo. Un procesador RISC-V
    dentro de la FPGA, el cierre de tiempos y el cruce de dominios de reloj completan el capítulo.
  grado:
    materias: [sed, ed]
    competencias: [TE3, TE6, TE7]
  lecturas: [chu, harris]

cap38:
  objetivos:
    - Identificar lo que distingue a un sistema empotrado y la diferencia entre tiempo real duro y blando.
    - Describir la anatomía de un microcontrolador y su arquitectura de memoria, y programarlo en bare-metal sobre sus registros.
    - Atender interrupciones controlando la latencia, las prioridades y las variables compartidas.
    - Usar temporizadores, captura, PWM y DMA para tareas con exigencias temporales y de caudal.
    - Diseñar el perfil de consumo con los modos de bajo consumo, y configurar el reloj del sistema y el watchdog.
    - Elegir la arquitectura del firmware (superbucle, cooperativo o RTOS) y aplicar semáforos, mutex y prioridades sin inversión de prioridad.
    - Depurar con herramientas hardware y diseñar el arranque seguro y la actualización del firmware.
  resumen: >-
    Los capítulos de Arduino y Raspberry Pi usaron los microcontroladores como herramientas; este abre la
    caja. Un sistema empotrado es un computador especializado dentro de un producto, que responde al
    mundo físico en tiempo real con poca memoria y poca energía, y el coste de un fallo justifica su
    disciplina. El capítulo describe la anatomía de un microcontrolador y enseña a programarlo atacando
    los registros, con la secuencia de arranque que nadie ve y la habilitación del reloj de cada
    periférico. Las interrupciones atienden al mundo sin esperarlo, a cambio de una latencia que se
    descompone y de un problema real: las variables compartidas. Los temporizadores, con sus modos,
    la captura y el PWM, son el periférico más útil, y el DMA mueve datos sin gastar el procesador. En un
    sistema a batería manda el consumo medio, que se diseña con los modos de bajo consumo y vigilando las
    fugas; el reloj del sistema, el watchdog y la supervisión de alimentación aseguran la fiabilidad. La
    arquitectura del firmware, del superbucle al sistema operativo de tiempo real, decide si un proyecto
    puede crecer; la planificación por prioridades, los semáforos, los mutex y la inversión de prioridad
    se explican con nombres. La depuración dentro del chip, el arranque seguro con firma y doble banco, el
    mapa de memoria con pila y enlazador, y una ampliación sobre arquitectura de computadores cierran el
    capítulo.
  grado:
    materias: [sed, ii, inf]
    competencias: [TE3, TE10, FB3]
  lecturas: [ganssle, barr, harris]

cap39:
  objetivos:
    - Elaborar el presupuesto energético de un equipo y valorar la recolección de energía.
    - Comparar las químicas primarias y secundarias por su tensión, energía, vida y curva de descarga.
    - Interpretar los parámetros de una batería, incluidas la capacidad, la resistencia interna y la vida.
    - Describir la carga CC-CV del Li-ion y las funciones de un sistema de gestión de batería con equilibrado.
    - Diseñar la alimentación de sistemas con varias fuentes y con USB-C Power Delivery.
    - Aplicar las reglas de envejecimiento, manipulación, transporte y reciclaje de las baterías de litio.
  resumen: >-
    En cuanto un equipo se mueve, la batería pasa a definir su autonomía, su tamaño, su peso, su coste y,
    a menudo, su seguridad. El capítulo trata la energía como restricción de diseño: el presupuesto
    energético, lo que aporta cada tecnología y los tres errores del cálculo. Las químicas primarias y
    secundarias se comparan por tensión, densidad de energía y vida, y la curva de descarga decide el
    circuito. La hoja de datos de una batería se lee con atención a la capacidad, a un efecto que
    sorprende, a la resistencia interna y a las tensiones que hay que respetar. La recolección de energía
    hace posible un sensor que funciona durante años: fuentes y números, la célula solar, el arranque en
    frío y la gestión del ciclo de trabajo. El litio no se carga como las demás químicas: el perfil
    CC-CV tiene fases y números que hay que respetar, con un compromiso entre capacidad y vida, y un
    estado de carga difícil de estimar. El sistema de gestión de batería vigila permanentemente la
    celda con cinco protecciones y el equilibrado, pasivo o activo. La alimentación desde varias fuentes,
    la negociación de USB-C Power Delivery, el envejecimiento por dos caminos que se suman y la seguridad
    en la manipulación, el almacenamiento, el transporte y el reciclaje cierran el capítulo con tres
    problemas de dimensionado y elección.
  grado:
    materias: [ep, dse]
    competencias: [TE4, TE6, CR10]
  lecturas: [linden, erickson]

cap40:
  objetivos:
    - Explicar por qué la placa forma parte del circuito y los parámetros de fabricación que lo condicionan.
    - Elegir el apilado de capas y la impedancia de las pistas.
    - Dimensionar pistas y vías por corriente, caída de tensión, inductancia y temperatura según IPC-2221.
    - Diseñar planos de masa y de alimentación y colocar el desacoplo para minimizar el área de los bucles.
    - Diseñar la evacuación térmica a través del cobre de la placa.
    - Colocar y particionar los componentes antes de trazar.
    - Preparar la fabricación con Gerbers, comprobación de reglas, clases IPC, fiduciales y paneles.
  resumen: >-
    Una placa de circuito impreso no es un soporte: es un componente más, con resistencia, capacidad e
    inductancia repartidas que pueden hacer fracasar un circuito correcto sobre el papel. El capítulo
    parte de cómo se fabrica una placa y de las decisiones que se toman antes de trazar nada. El apilado
    de capas fija la impedancia de las pistas y la calidad de los retornos, con tres reglas que ordenan
    cualquier apilado y el diálogo con el fabricante. La anchura de una pista responde a dos preguntas
    distintas que se confunden, la ampacidad, resuelta por la norma IPC-2221, y la caída de tensión; las
    vías son inductancia antes que agujeros, y conducen corriente y calor. El plano de masa no es un cable
    ancho, sino la forma de minimizar el área del bucle, y una ranura bajo una señal lo destruye; el
    desacoplo solo sirve si está en el sitio correcto, con varios valores y el plano como parte de él. La
    placa es también el disipador de los componentes de montaje superficial. La fabricación se prepara
    con los Gerbers, las clases de IPC-6012, los acabados y la comprobación de reglas de diseño. La
    colocación decide la mayor parte del resultado, y el particionado, los fiduciales, los paneles y la
    preparación para producción completan el paso del prototipo a la serie, con un resumen de
    herramientas y errores que conviene evitar.
  grado:
    materias: [dse, te, exp]
    competencias: [TE6, FB5, CR9]
  lecturas: [brooks, coombs, ipc]

cap41:
  objetivos:
    - Determinar cuándo una pista deja de comportarse como un cable a partir del tiempo de flanco.
    - Diseñar pistas de impedancia controlada en microstrip, stripline y pares diferenciales.
    - Elegir la terminación adecuada contra las reflexiones.
    - Reducir la diafonía cercana y lejana entre pistas.
    - Interpretar el diagrama de ojo, el jitter y la ecualización de un enlace digital.
    - Diseñar la red de distribución de alimentación con un objetivo de impedancia y prevenir el rebote de masa.
  resumen: >-
    Cuando las señales son rápidas, las pistas se comportan como líneas de transmisión y aparecen
    reflexiones, diafonía y jitter que corrompen los datos aunque el esquema sea correcto; a la vez, la red
    de alimentación debe sostener la tensión mientras muchas salidas conmutan. El capítulo trata estas
    dos disciplinas, la integridad de señal y la de alimentación, a partir de una idea: lo decide el
    flanco, no la frecuencia. La impedancia controlada convierte la anchura de la pista en un parámetro
    eléctrico, en microstrip, stripline y líneas diferenciales. Las reflexiones se ven en la pantalla y se
    resuelven con tres terminaciones, a menudo con una simple resistencia serie, o reduciendo el flanco.
    La diafonía es acoplamiento entre bucles vecinos, cercana o lejana, y se reduce separando las pistas y
    dándoles retorno propio. El diagrama de ojo resume miles de bits en una pantalla: se lee, se compara
    con una máscara y se abre con ecualización. La red de distribución de alimentación debe presentar
    baja impedancia en todo el margen de frecuencias, con un objetivo de impedancia, condensadores para
    cada banda y cuidado con las antirresonancias. El rebote de masa y el ruido de conmutación
    simultánea, las pérdidas a alta velocidad y los pares diferenciales con su encaminamiento acoplado
    completan el capítulo, que insiste en pensar en bucles y no en pistas.
  grado:
    materias: [dse, com]
    competencias: [TE6, TE10, FB2]
  lecturas: [johnson, bogatin, brooks]

cap42:
  objetivos:
    - Explicar qué resuelve un simulador SPICE y qué no puede predecir.
    - Elegir el tipo de análisis (punto de trabajo, barrido de continua, alterna, transitorio) según la pregunta.
    - Escribir y leer un netlist con subcircuitos y elegir modelos de componentes adecuados.
    - Evaluar tolerancias con análisis de peor caso y de Monte Carlo, y explorar el diseño con barridos paramétricos.
    - Resolver problemas de convergencia con los remedios en orden.
    - Incluir los parásitos de la placa en una simulación post-layout.
  resumen: >-
    SPICE es el simulador estándar de la electrónica analógica: resuelve numéricamente las ecuaciones del
    circuito y predice tensiones, corrientes, respuesta en frecuencia, ruido y comportamiento en el tiempo.
    No sustituye a la medida, pero permite explorar ideas y entender fallos sin gastar una pieza. El
    capítulo explica primero para qué sirve simular y lo que simular no es. Cuatro preguntas dan lugar a
    cuatro análisis, punto de trabajo, barrido de continua, alterna y transitorio, más otros
    complementarios, y elegir mal es un error frecuente. Un simulador no sabe de un componente más que lo
    que dice su modelo, y hay tres niveles de modelo, con el MOSFET como caso ilustrativo; el netlist,
    que es lo que el simulador lee de verdad, se aprende a escribir y a leer. Simular con valores
    nominales es simular un circuito que no existe: el peor caso da la garantía absoluta y Monte Carlo la
    respuesta realista, con una distribución supuesta que importa. Los problemas de convergencia tienen
    causas habituales y remedios en orden. El capítulo insiste en lo que SPICE no puede hacer, porque
    simular no es saber, y en la simulación post-layout, que incluye los parásitos de la placa. El barrido
    paramétrico explora el espacio de diseño, y un resumen de herramientas y fuentes de modelos cierra el
    capítulo.
  grado:
    materias: [mod, tc, ea]
    competencias: [TE7, TE6, FB3]
  lecturas: [vladimirescu, kielkowski]

cap43:
  objetivos:
    - Justificar el uso de transistores discretos frente a los integrados en los casos en que siguen siendo necesarios.
    - Polarizar un transistor con estabilidad frente a la dispersión de β y a la temperatura.
    - Analizar las configuraciones de emisor común, colector común y base común con el modelo híbrido en π.
    - Calcular la respuesta en frecuencia de una etapa y vencer el efecto Miller.
    - Diseñar etapas múltiples y pares diferenciales con carga activa.
    - Comparar las clases de etapas de salida (A, B, AB, C, D) por rendimiento y distorsión, y minimizar el ruido de la primera etapa.
  resumen: >-
    El operacional resolvió la amplificación como bloque, pero diseñar etapas a medida en radiofrecuencia,
    potencia o bajo ruido exige volver al transistor individual. El capítulo empieza por los casos en que
    los discretos siguen siendo la respuesta, con una mirada a la válvula de vacío, y construye el
    amplificador desde el punto de trabajo: la corriente de reposo lo decide todo, la β no es de fiar y
    hay cuatro polarizaciones con distinta estabilidad térmica. Las tres configuraciones básicas, emisor
    común, colector común y base común, se comparan en una tabla, con su equivalente en MOSFET y la forma
    de reconocerlas en un esquema. El análisis en pequeña señal separa el reposo del movimiento con el
    modelo híbrido en π y muestra el efecto de la resistencia de emisor. La ganancia se paga con ancho de
    banda, y en el emisor común manda el efecto Miller, que se vence de tres formas. Las etapas en
    cascada, su acoplamiento, el par diferencial, el CMRR y la carga activa explican lo que hay dentro de
    los integrados. Las clases de salida se presentan como puntos de trabajo, de la A a la D, con sus
    rendimientos máximos deducidos y la sorpresa de que la clase B calienta más a volumen medio. La llave
    analógica, el ruido del amplificador discreto y una ampliación sobre la clase D cierran el capítulo.
  grado:
    materias: [ea, fe]
    competencias: [TE2, TE6, CR5]
  lecturas: [sedra, self, cordell]
