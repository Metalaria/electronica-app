# Drafted texts for the author's review (tomo II). Summaries drafted from the chapter's sections,
# subsection titles and opening sentences (and its own summary section where it has one).
cap07:
  objetivos:
    - Explicar la estructura del MOSFET, la formación del canal y sus regiones de operación.
    - Identificar las variantes de MOSFET y la familia FET por su símbolo, su encapsulado y la medida en el banco.
    - Interpretar los parámetros clave de un MOSFET de potencia en la hoja de datos.
    - Diseñar el MOSFET como interruptor de potencia, incluida la carga de puerta y el driver.
    - Comparar MOSFET y BJT para elegir el adecuado en cada aplicación.
    - Aplicar el diodo de cuerpo, la conmutación síncrona y el área de operación segura al diseño con margen.
  resumen: >-
    El MOSFET se controla por tensión y no por corriente: la puerta, aislada por una capa de óxido,
    forma o suprime un canal entre fuente y drenador sin consumir corriente en continua. El capítulo
    recorre su estructura capa a capa, por qué la puerta es tan frágil, el papel del sustrato y la
    estructura vertical de los dispositivos de potencia, y distingue las cuatro variantes y el resto de
    la familia FET. Sus regiones de operación se describen como las del bipolar, con su propia
    terminología, y el símbolo se aprende a leer en lugar de memorizarlo. En la práctica, elegir un
    MOSFET de potencia es leer bien unos pocos parámetros de la hoja de datos, y su aplicación estrella
    es la conmutación. Que la puerta no consuma en continua no significa que moverla sea gratis: la
    carga de puerta fija la corriente del driver y las pérdidas de conmutación. La comparación con el
    BJT da criterios de elección, y el modelo de pequeña señal, basado en la transconductancia, permite
    usarlo como amplificador. El diodo de cuerpo impide que sea un interruptor bidireccional pero hace
    posible la conmutación síncrona, con el problema de su recuperación inversa. El área de operación
    segura, la focalización térmica y los modos de fallo cierran el capítulo con el diseño con margen y
    tres problemas de elección y de excitación de puerta.
  grado:
    materias: [fe, ea, ep]
    competencias: [CR5, TE2, TE4]
  lecturas: [sedra, erickson, horowitz]

cap08:
  objetivos:
    - Describir el amplificador operacional ideal y real, con sus reglas de análisis y sus parámetros de rechazo.
    - Diseñar las configuraciones inversora, no inversora y seguidora, y comparadores con histéresis.
    - Comparar reguladores lineales y conmutados y sus topologías básicas, y elegir el adecuado.
    - Diseñar osciladores y temporizadores con el NE555 en modo astable y monoestable.
    - Seleccionar un operacional real y una referencia de tensión de precisión por los parámetros que importan en cada aplicación.
    - Aplicar interruptores y multiplexores analógicos, comparadores dedicados y circuitos de muestreo y retención.
  resumen: >-
    El capítulo pasa de los componentes discretos a los circuitos integrados analógicos, y se apoya en
    tres bloques: el amplificador operacional, los reguladores de tensión y el temporizador 555. El
    operacional es un amplificador diferencial de ganancia enorme, entrada de alta impedancia y salida de
    baja impedancia; con dos reglas del modelo ideal y unas pocas resistencias se obtienen el inversor,
    el no inversor y el seguidor, y sin realimentación negativa se convierte en comparador, que la
    histéresis hace inmune al ruido. Los reguladores resuelven que la alimentación nunca sea la que hace
    falta: el lineal es un divisor activo y el conmutado transfiere la energía en paquetes, con tres
    topologías básicas y criterios para elegir entre ambos. El NE555 genera oscilaciones y
    temporizaciones con dos modos de trabajo. La segunda mitad del capítulo es de criterio: no hay un
    operacional «mejor», sino el que cumple el parámetro que importa, y la letra pequeña del
    rail-to-rail lo demuestra. Las referencias de tensión, bandgap o Zener enterrado, fijan la
    exactitud de todo instrumento, y la medida ratiométrica reduce su influencia. Interruptores y
    multiplexores analógicos, comparadores dedicados y circuitos de muestreo y retención, con sus cuatro
    errores, completan el repertorio que usan los capítulos de instrumentación y conversión.
  grado:
    materias: [ea, ie, ep]
    competencias: [TE2, TE5, TE6]
  lecturas: [franco, mancini, horowitz]

cap09:
  objetivos:
    - Aplicar el álgebra de Boole y las leyes de De Morgan para pasar de una tabla de verdad a un circuito.
    - Comparar las familias lógicas por sus niveles de tensión, márgenes de ruido, fan-out y retardo de propagación.
    - Describir puertas, flip-flops, contadores, registros y memorias como bloques combinacionales y secuenciales.
    - Elegir entre salidas tótem-pole, tri-estado y de colector abierto para compartir buses.
    - Adaptar niveles lógicos entre dominios de tensión distintos.
    - Explicar la metaestabilidad y diseñar sincronizadores, entradas limpias y circuitos de reset fiables.
  resumen: >-
    La electrónica digital trabaja con dos estados y, sobre esa aparente simplicidad, construye
    ordenadores, memorias y comunicaciones. El capítulo parte del álgebra de Boole, sus tres operaciones
    con su realidad física y las leyes de De Morgan, y enseña a pasar de la tabla de verdad al circuito.
    Los unos y ceros son niveles de tensión, y cada familia lógica los define a su manera; las puertas
    implementan las operaciones y los flip-flops añaden memoria, con la que se construyen contadores,
    registros y memorias. Cuando varios dispositivos comparten un cable aparecen las salidas tri-estado y
    las de colector o drenador abierto, cuyo precio es un flanco de subida lento. La fiabilidad depende
    de que lo que una puerta entrega como alto sea holgadamente lo que otra reconoce como alto: márgenes
    de ruido, fan-out y retardo de propagación. En una misma placa conviven 5 V, 3,3 V y 1,8 V, y la
    adaptación de niveles se resuelve con una comprobación previa y cinco soluciones de menos a más.
    El capítulo termina con un problema sin solución completa, la metaestabilidad: su tiempo medio entre
    fallos, el sincronizador de dos flip-flops, las entradas limpias y el reset, que suele descuidarse.
  grado:
    materias: [ed, sed]
    competencias: [TE3, CR5]
  lecturas: [mano, floyd, horowitz]

cap10:
  objetivos:
    - Describir el funcionamiento de SCR, TRIAC y DIAC, el control por ángulo de fase y su disparo desde un microcontrolador.
    - Explicar cuándo elegir un IGBT y cómo excitarlo y protegerlo.
    - Seleccionar fusibles y protecciones escalonadas contra sobretensiones y transitorios según su energía y su velocidad.
    - Calcular disipadores a partir de la cadena de resistencias térmicas.
    - Diseñar snubbers, protecciones de polaridad inversa y limitadores de corriente de arranque.
    - Comparar el crowbar y el fusible electrónico y coordinar cada protección con el resto del circuito.
  resumen: >-
    El capítulo trata de lo que ocurre cuando la energía basta para destruir algo. Los tiristores
    conducen hasta que la corriente cae, no hasta que se retira el disparo: ese enclavamiento los hace
    útiles en alterna, con el control por ángulo de fase y sus problemas, y los descarta en continua sin
    un apagado forzado. El IGBT combina la puerta aislada del MOSFET con la conducción del bipolar, a
    cambio de una cola de corriente que limita la frecuencia. Las protecciones se estudian por la
    amenaza que detienen: el fusible, primera línea de defensa, por su velocidad; las sobretensiones,
    que vienen de dentro y de fuera y se especifican en julios, con una protección escalonada de
    varistor, TVS y filtro. Todo componente de potencia disipa, y la gestión térmica con disipadores
    decide su vida. Un snubber no elimina el transitorio de conmutación: lo reparte en el tiempo a costa
    de disipar. La protección de polaridad inversa, la limitación de la corriente de irrupción y el
    crowbar o el fusible electrónico completan el repertorio. La idea que recorre el capítulo es que
    cada protección tiene un modo de fallo que hay que conocer y debe ser más rápida que el daño que
    evita y más lenta que el funcionamiento normal.
  grado:
    materias: [ep, te]
    competencias: [TE4, TE6, CR5]
  lecturas: [rashid, mohan, erickson]

cap11:
  objetivos:
    - Explicar por qué un esquema representa cómo funciona un circuito y no cómo es físicamente.
    - Reconocer los símbolos normalizados de las dos tradiciones (IEC y ANSI/IEEE) y los designadores de referencia.
    - "Leer un esquema con un método sistemático: alimentación, bloques, camino de la señal y notas."
    - Interpretar nudos, etiquetas de red, símbolos de alimentación y buses.
    - Relacionar el esquema con el netlist, la lista de materiales y el ratsnest.
    - Dibujar esquemas legibles y suficientes con criterios de anotación y buenas prácticas.
  resumen: >-
    Un esquema electrónico es el plano funcional de un circuito: muestra qué hace cada componente y cómo
    se conecta, con símbolos normalizados en lugar de dibujos realistas. El capítulo enseña ese
    lenguaje. Empieza por las dos tradiciones de símbolos que conviven, la de IEC y la norteamericana, y
    por lo que un símbolo dice y lo que no dice. Los designadores de referencia identifican cada
    componente con letras normalizadas y una numeración que tiene sus reglas. Las convenciones de dibujo
    no son estética: fijan la disposición, la densidad y lo que debe incluirse siempre, y se comprueban
    con una prueba de legibilidad. La lectura se hace con método, en cinco pasos que van de la
    alimentación y la masa a los bloques, el camino de la señal, la separación entre señal y servicio y
    las notas. Los puntos de unión, las etiquetas de red y los símbolos de alimentación resuelven las
    ambigüedades del dibujo. El esquema es también el origen de los ficheros que fabrican la placa, el
    netlist y la lista de materiales, y debe llevar valores, encapsulados, notas de diseño y bloque de
    título. El capítulo cierra con buenas prácticas, errores frecuentes y criterios cuantitativos de
    anotación, y con dos problemas sobre lo que detecta la comprobación de reglas eléctricas.
  grado:
    materias: [dse, exp]
    competencias: [TE6, FB5]
  lecturas: [horowitz]

cap12:
  objetivos:
    - Reconocer los bloques funcionales de un circuito real y usarlos para orientar el diagnóstico.
    - Identificar las partes de una fuente de alimentación conmutada y su frontera de aislamiento.
    - Interpretar una hoja de datos distinguiendo máximos absolutos, valores garantizados y condiciones de medida.
    - Describir el flujo de una herramienta CAD electrónica, el diseño jerárquico y la comprobación de reglas eléctricas.
    - Gestionar bibliotecas, reutilización y control de versiones de un diseño.
    - Planificar el flujo completo del esquema al prototipo, con sus verificaciones previas a fabricar.
  resumen: >-
    El capítulo da el salto de la lectura de esquemas sencillos a los circuitos reales. Un aparato
    desconocido tiene cientos de componentes, y reconocer bloques funcionales es más rápido que
    analizarlos uno a uno; la fuente conmutada sirve de ejemplo completo, con su frontera de aislamiento,
    los síntomas que delata cada bloque y las medidas seguras. La hoja de datos se presenta como el
    documento que decide si un diseño funciona: los máximos absolutos indican lo que destruye, no lo que
    se usa; de los valores típico, mínimo y máximo solo dos están garantizados, y las condiciones de
    medida y las gráficas contienen lo que las tablas no dicen. Las herramientas CAD reúnen esquema,
    simulación y placa sobre una base de datos común; el capítulo explica cómo elegirlas, el diseño
    jerárquico y la comprobación de reglas eléctricas, y por qué la biblioteca es donde se cuela el
    error caro. La reutilización de bloques probados y el control de versiones dan continuidad al
    trabajo. La ingeniería inversa de una placa sin esquema se trata con un método en cinco fases y sus
    límites legales. El capítulo termina con las nueve etapas del esquema al prototipo, el primer
    encendido y los criterios cuantitativos para saber cuándo un diseño está listo para fabricar.
  grado:
    materias: [dse, te]
    competencias: [TE6, TE7]
  lecturas: [horowitz, brooks]

cap13:
  objetivos:
    - Explicar el mojado, el papel del óxido y del flux y las aleaciones de soldadura con y sin plomo.
    - Elegir y mantener el equipo de soldadura, la punta y la temperatura de trabajo.
    - Soldar componentes de orificio pasante y de montaje superficial, incluida la técnica de arrastre.
    - Desoldar sin dañar la placa con la herramienta adecuada a cada caso.
    - Describir el reflujo, la pasta de soldadura, el perfil térmico, el aire caliente y la soldadura por ola.
    - Reconocer los defectos de soldadura según los criterios de aceptación de IPC-A-610 y repararlos.
  resumen: >-
    La soldadura es la habilidad manual fundamental de la electrónica práctica: una junta defectuosa
    causa un porcentaje enorme de averías, y una buena es a la vez conexión eléctrica y unión mecánica.
    El capítulo parte de la física: soldar no es pegar, sino conseguir el mojado entre la aleación y el
    metal base, con el óxido como enemigo y la transferencia de calor como clave. El equipo importa por
    tres características concretas, y la punta y su cuidado son la fuente del error más frecuente. La
    técnica se enseña paso a paso para los componentes de orificio pasante y para el montaje superficial,
    que resulta más asequible de lo que parece, con la técnica de arrastre para los integrados de paso
    fino y el aire caliente. Desoldar es más difícil que soldar, y el capítulo detalla las herramientas
    y cuándo conviene sacrificar el componente. La transición sin plomo y la normativa RoHS se explican
    por sus consecuencias físicas, incluidos los bigotes de estaño y la oleada de fallos que siguió. El
    flux, el reflujo con pasta y perfil térmico, el horno y la soldadura por ola completan el proceso.
    El capítulo termina con los defectos, cómo se reconocen y el criterio de inspección de la industria,
    y con criterios cuantitativos y dos problemas sobre el calor que se lleva un pad.
  grado:
    materias: [te]
    competencias: [TE6, CR9]
  lecturas: [ipc, coombs]

cap15:
  objetivos:
    - Describir la estructura interna del protoboard, su resistencia de contacto y sus parásitos.
    - Montar y verificar una fuente de alimentación simétrica de ±12 V.
    - Montar un amplificador de audio con LM386 y un indicador de nivel con LM3914, explicando su funcionamiento interno.
    - Controlar la velocidad de un motor de continua con PWM y un MOSFET.
    - Evaluar los límites del protoboard en frecuencia y aplicar un desacoplo correcto.
    - Planificar el paso del protoboard a la placa definitiva y diagnosticar los errores de montaje más comunes.
  resumen: >-
    Entre la teoría y el circuito soldado está el prototipo en protoboard, que permite construir, probar
    y modificar sin soldar. El capítulo explica primero qué hay debajo de los agujeros: tiras de clips
    con una resistencia de contacto que deriva y unos parásitos que se cuantifican, de modo que se sabe
    qué se puede montar y qué no. A continuación propone cuatro proyectos que consolidan los capítulos
    anteriores: una fuente simétrica de ±12 V, calculada paso a paso; un amplificador de audio con
    LM386, con su ganancia ajustable por condensador y la red de Boucherot; un indicador de nivel de
    diez LED con LM3914, en modo punto o barra y con escala ajustable; y un control de velocidad de un
    motor de continua por PWM, que pone en juego el MOSFET, la bobina y la interferencia. La segunda
    parte trata los límites: la inductancia que provoca el rebote de masa, la capacidad que acopla
    nodos y la resistencia que hace caer la alimentación, y cuándo hay que abandonar el protoboard. El
    desacoplo se presenta como una cuestión de distancia antes que de valor. El paso a la placa
    definitiva, con montajes intermedios como el «dead-bug», y un catálogo de errores comunes y de
    criterios cuantitativos cierran el capítulo.
  grado:
    materias: [ea, ep, dse]
    competencias: [TE2, TE6, CR5]
  lecturas: [horowitz, malvino]
