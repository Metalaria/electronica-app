# Drafted texts for the author's review (tomo V).
cap30:
  objetivos:
    - Clasificar las señales y caracterizar los sistemas lineales e invariantes por su respuesta al impulso, su causalidad y su estabilidad.
    - Calcular la convolución continua y discreta y relacionarla con el producto en frecuencia.
    - Aplicar el teorema de muestreo y dimensionar el filtro antialiasing y el sobremuestreo.
    - Usar la transformada Z para obtener la función de transferencia discreta y estudiar su estabilidad en el círculo unidad.
    - Aplicar la FFT con ventanas y el algoritmo de Goertzel, y comparar filtros digitales FIR e IIR.
    - Convertir un circuito en un algoritmo y evaluar los efectos de la coma fija.
    - Usar la correlación, el filtro adaptado y el espectrograma para analizar señales.
  resumen: >-
    El capítulo tiende el puente entre el mundo analógico y el digital con el lenguaje de las señales y
    los sistemas, y desemboca en el procesamiento digital de señal. Una señal puede ser continua o
    discreta en dos ejes independientes, determinista o aleatoria, periódica o no. Un sistema lineal e
    invariante queda descrito por completo por su respuesta al impulso, y su salida es la convolución
    de la entrada con ella, que en frecuencia se convierte en un producto; la FFT permite calcularla
    deprisa. El teorema de muestreo fija la frecuencia mínima, el aliasing es lo que ocurre si no se
    cumple y el filtro antialiasing, hoy apoyado en el sobremuestreo, es su defensa; la cuantificación
    es el otro eje de la discretización. La transformada Z hace con las señales muestreadas lo que
    Laplace con las continuas: el círculo unidad sustituye al eje imaginario como frontera de la
    estabilidad. La FFT cambió el procesado de señal, con las ventanas como detalle que más resultados
    estropea, el algoritmo de Goertzel para una sola frecuencia y los filtros FIR e IIR, que pueden lo
    que el analógico no. El paso del circuito al algoritmo se hace con tres métodos de conversión y las
    trampas de la coma fija. La correlación, el filtro adaptado, el amplificador lock-in como caso
    particular y el espectrograma, con su compromiso inevitable entre resolución en tiempo y en
    frecuencia, cierran el capítulo.
  grado:
    materias: [ss, com, mat]
    competencias: [FB1, TE7, TE10]
  lecturas: [oppenheim, lyons]

cap31:
  objetivos:
    - Describir un sistema de control en lazo abierto y cerrado con la terminología precisa.
    - Sintonizar un controlador PID por métodos clásicos, incluido Ziegler-Nichols, e implementarlo en forma discreta con anti-windup.
    - Analizar la estabilidad de un lazo con los márgenes de fase, de ganancia y de retardo y el lugar de las raíces.
    - Valorar los efectos del muestreo y la cuantificación en un control digital y elegir alternativas al PID cuando no basta.
    - Explicar el planteamiento del control en espacio de estados, la controlabilidad, la observabilidad y el observador.
    - Comparar las modulaciones analógicas y digitales y la multiplexación por su ancho de banda y su robustez frente al ruido.
    - Aplicar la detección y corrección de errores a un enlace de comunicaciones.
  resumen: >-
    El capítulo aplica lo anterior a dos campos que comparten cimiento: el control, que hace que un
    sistema se comporte como se quiere mediante realimentación, y las comunicaciones, que llevan
    información mediante la modulación. Controlar es hacer que una magnitud tome el valor deseado pese a
    las perturbaciones, y el capítulo insiste en decidir antes de elegir el controlador. El PID se
    presenta con sus elementos, la caracterización de la planta y los criterios de calidad, y se lleva
    de la forma de libro a la que funciona: sintonía por cuatro métodos, forma discreta, anti-windup y el
    método de Ziegler-Nichols en sus dos variantes. La estabilidad del lazo se analiza con los márgenes
    de fase, de ganancia y de retardo, el pico de sensibilidad y el lugar de las raíces. El control
    digital añade el retardo del muestreo y el suelo de la cuantificación, y cuando la lógica clásica no
    basta aparecen el todo-nada con histéresis, el control difuso, el adaptativo y el predictivo. Los
    actuadores, último eslabón del lazo, y una ampliación sobre el espacio de estados completan la parte
    de control. En comunicaciones, el capítulo explica por qué hay que modular, el compromiso entre banda
    y ruido de AM, FM y PM, las modulaciones digitales y sus constelaciones, la multiplexación del medio y
    la detección y corrección de errores.
  grado:
    materias: [ra, com, aut]
    competencias: [TE8, CR6, TE10]
  lecturas: [ogata, astrom, haykin]

cap32:
  objetivos:
    - Distinguir ruido de interferencia y describir los ruidos térmico, de disparo, 1/f y en ráfagas.
    - Sumar ruidos en cuadratura con su densidad espectral y su ancho de banda equivalente y referirlos a la entrada.
    - Calcular la relación señal/ruido, la figura de ruido con la fórmula de Friis y la temperatura de ruido de una cadena.
    - Elaborar el presupuesto de ruido de una cadena de medida o de recepción.
    - Identificar las cuatro vías de acoplamiento de una interferencia y distinguir el modo común del diferencial.
    - Aplicar apantallamiento, masas, filtros y ferritas contra la interferencia, y resolver bucles de tierra.
    - Describir los ensayos de emisión e inmunidad de la normativa y realizar medidas de precompliance en el banco.
  resumen: >-
    Ningún circuito vive aislado: sus componentes generan ruido que pone un suelo a la señal, el exterior
    le inyecta interferencias y él ensucia a sus vecinos. La primera mitad del capítulo trata el ruido
    como límite físico. Separa ruido de interferencia, describe sus tipos, térmico, de disparo, 1/f y en
    ráfagas, y establece reglas propias para sumarlo: en cuadratura, con densidad espectral y ancho de
    banda equivalente, referido a la entrada. La relación señal/ruido, la figura de ruido y la fórmula de
    Friis explican por qué la primera etapa decide, y los presupuestos de ruido de una cadena, con
    números, enseñan a calcular antes de montar. El promediado y el amplificador lock-in recuperan
    señales enterradas, y la temperatura de ruido es la forma de expresarlo en radiofrecuencia. La
    segunda mitad aborda la compatibilidad electromagnética. Toda interferencia tiene fuente, camino y
    receptor, y el camino es una de cuatro vías: conducción, acoplamiento capacitivo, inductivo o
    radiación. El modo común, más difícil que el diferencial, decide el filtro; las masas, los planos y
    los bucles de tierra se resuelven por la impedancia común; el apantallamiento y los filtros y
    ferritas tienen sus detalles que lo arruinan todo. La normativa y sus ensayos, la medida de
    precompliance en el banco sin cámara anecoica y el FM7303 como víctima y como fuente cierran el
    capítulo.
  grado:
    materias: [ie, com, dse]
    competencias: [TE5, TE6, FB2]
  lecturas: [ott, horowitz]

cap33:
  objetivos:
    - Explicar por qué conmutar es más eficiente que regular linealmente y dónde se pierde la energía.
    - Analizar los convertidores reductor, elevador y reductor-elevador por el balance voltios-segundo, en modo continuo y discontinuo.
    - Describir las topologías aisladas (flyback, forward) y las de más potencia (push-pull, medio puente, puente completo).
    - Comparar los modos de control en tensión, en corriente y por histéresis, y compensar el lazo con redes de tipo II y III.
    - Diseñar los magnéticos de un convertidor, incluido el transformador de un flyback.
    - Explicar la corrección del factor de potencia, la rectificación síncrona y la conmutación suave.
    - Gobernar motores de continua, paso a paso y BLDC con un puente en H, y describir el principio del motor de inducción.
  resumen: >-
    La sección 8.4 presentó la fuente conmutada como una idea; el capítulo la convierte en una disciplina
    de diseño en la que el rendimiento y el calor mandan. Conmutar es eficiente porque el interruptor no
    disipa idealmente ni abierto ni cerrado, y la bobina promedia los trozos de tensión; todo convertidor
    tiene tres bloques. El reductor se estudia en detalle: dos fases del ciclo, el balance
    voltios-segundo, el rizado y el dimensionado de la bobina, los modos continuo y discontinuo, las
    pérdidas y un trazado que no es un detalle. El elevador usa la bobina como bomba, y el
    reductor-elevador y sus parientes se eligen con una tabla. Las topologías aisladas, flyback y
    forward, y las de más potencia, push-pull, medio puente y puente completo, superan los límites de una
    sola rama. Un convertidor es un lazo de control: el modo tensión, el modo corriente y el de
    histéresis se comparan, y la compensación con redes de tipo II y III se calcula, no se ajusta por
    tanteo. Las pérdidas se reparten en cinco sitios, y la corrección del factor de potencia, la
    rectificación síncrona y la conmutación suave de los convertidores resonantes las reducen. El diseño
    de magnéticos, con el transformador de un flyback calculado con números, y el gobierno de motores
    con el puente en H, ampliado con el motor de continua, el de inducción, el paso a paso y el BLDC,
    completan el capítulo.
  grado:
    materias: [ep, elt, ra]
    competencias: [TE4, TE6, CR4]
  lecturas: [erickson, mohan, brown, mclyman]

cap34:
  objetivos:
    - Cuantificar el error de cuantificación y la mejora que aportan el dither y el sobremuestreo.
    - Describir el muestreo y retención y el límite que impone el jitter de apertura.
    - Comparar las arquitecturas de ADC (flash, SAR, sigma-delta, doble rampa) y de DAC (ponderado, R-2R, string, de corriente, PWM, sigma-delta).
    - Interpretar los errores estáticos y dinámicos (INL, DNL, monotonía, glitch, ENOB) en las especificaciones.
    - "Diseñar el acondicionamiento previo al convertidor: amplificador, filtro antialiasing, referencia y multiplexado."
    - Evaluar la influencia del jitter del reloj de muestreo en un convertidor de alta velocidad.
  resumen: >-
    El capítulo describe la máquina que cruza la frontera entre lo analógico y lo digital: el conversor
    analógico-digital, que mide, y el digital-analógico, que reconstruye. La cuantificación introduce un
    error irreductible de medio LSB, con la regla de los 6,02 dB por bit, pero la cifra honesta es el
    número efectivo de bits; el dither y el sobremuestreo ganan resolución. El muestreo y retención
    congela la señal mientras se convierte, y su jitter de apertura fija el límite. Los errores de un
    DAC, monotonía y glitch incluidos, se miden directamente porque la entrada se controla. Las cuatro
    arquitecturas de ADC, flash, aproximaciones sucesivas, sigma-delta y doble rampa, responden a cuatro
    compromisos, y las de DAC, de las resistencias ponderadas y la escalera R-2R al sigma-delta, a los
    mismos. Un convertidor de 16 bits no tiene 16 bits de exactitud: unos errores se calibran y los de
    linealidad, INL y DNL, no. La etapa que decide la calidad de la medida es el acondicionamiento previo,
    con el amplificador, el filtro antialiasing, la referencia, que es el patrón del sistema, y la
    trampa del multiplexado. Los convertidores de los proyectos del libro, el dither, el jitter del
    reloj de muestreo y un resumen con las herramientas y las pruebas de caracterización cierran el
    capítulo.
  grado:
    materias: [ie, ed, ss]
    competencias: [TE5, TE3, TE6]
  lecturas: [kester, horowitz]

cap35:
  objetivos:
    - Describir la cadena de medida y elaborar su presupuesto de incertidumbre, distinguiendo exactitud, resolución y repetibilidad.
    - Elegir entre RTD, termopar, termistor e integrado para medir temperatura.
    - Medir fuerza y deformación con galgas extensométricas en puente de Wheatstone.
    - Describir sensores de movimiento, campo magnético, proximidad, corriente, luz, gas y humedad.
    - Aplicar el amplificador de instrumentación y la medida ratiométrica en el acondicionamiento.
    - Linealizar, calibrar y filtrar la medida en el orden correcto.
    - Valorar cuándo conviene un sensor inteligente con bus digital frente a uno analógico.
  resumen: >-
    Un sistema electrónico solo es útil si percibe el mundo, y el sensor entrega una señal débil,
    ruidosa y no lineal que hay que acondicionar para que un convertidor la lea con fidelidad. El
    capítulo empieza por la cadena de medida, cuya calidad la fija el eslabón más débil, con sus seis
    etapas, el presupuesto de incertidumbre y la distinción entre exactitud, resolución y repetibilidad.
    La temperatura, la aplicación más común, se reparte entre tres familias con tres físicas distintas:
    la RTD de platino, el termopar y el termistor NTC, con el integrado como respuesta a menudo correcta.
    La galga extensométrica mide deformación como una resistencia que cambia, y el puente de Wheatstone,
    en sus tres configuraciones, la convierte en tensión. Siguen los sensores de movimiento, como
    acelerómetros, giróscopos e IMU; los de campo, proximidad y corriente, con el efecto Hall, el
    transformador de corriente y el shunt; y los de luz, gas y humedad, que se miden indirectamente. El
    amplificador de instrumentación resuelve la medida de diferencias pequeñas sobre una tensión común,
    y la linealización, la calibración y el filtrado convierten el número bruto en un valor útil. La
    excitación del sensor y la medida ratiométrica, los sensores de los proyectos del libro y los
    sensores inteligentes con bus digital cierran el capítulo.
  grado:
    materias: [ie]
    competencias: [TE5, TE6]
  lecturas: [pallas, pallas-webster]

cap36:
  objetivos:
    - Determinar cuándo un conductor debe tratarse como línea de transmisión y calcular reflexiones y relación de onda estacionaria.
    - Interpretar los parámetros S y la carta de Smith.
    - Diseñar redes de adaptación en L, T y π, y con líneas, y relacionar su Q con el ancho de banda.
    - Describir filtros trazados en cobre con stubs y líneas acopladas.
    - Analizar los bloques de un receptor, su intermodulación y su margen dinámico.
    - Describir los parámetros de una antena y el papel del plano de masa y del balun.
    - Calcular el balance de un enlace de radio y diagnosticar la pérdida de sensibilidad de un receptor.
  resumen: >-
    A partir de cierta frecuencia un cable deja de ser un nudo de potencial único y la señal viaja como
    una onda que se refleja en cada discontinuidad. El capítulo da las herramientas de la
    radiofrecuencia empezando por la longitud crítica y la impedancia característica. Las líneas de
    transmisión, el coeficiente de reflexión y la relación de onda estacionaria explican las tres formas
    de terminar una línea digital y el comportamiento del coaxial. En radiofrecuencia no se miden
    tensiones sino ondas, y los parámetros S, medidos en 50 Ω, caracterizan cualquier bloque; la carta
    de Smith sustituye cálculos por movimientos sobre un plano de reflexiones. Las redes de adaptación
    transforman impedancias sin disipar, con un Q que fija el ancho de banda, y por encima de unos
    cientos de megahercios los filtros se trazan en cobre con stubs y líneas acopladas. Los bloques de
    RF se organizan en una cadena con su presupuesto y su margen dinámico, y las antenas se entienden
    como adaptadores de impedancia en los que el plano de masa y el entorno forman parte del diseño. Con
    todo ello se revisa el front-end del FM7303, y la intermodulación y el punto de intercepción dan la
    linealidad del receptor. El diagnóstico de un receptor que recibe poco y el balance de un enlace,
    con la zona de Fresnel, cierran el capítulo.
  grado:
    materias: [com, fis]
    competencias: [TE10, FB2, TE6]
  lecturas: [bowick, pozar, hayward]
