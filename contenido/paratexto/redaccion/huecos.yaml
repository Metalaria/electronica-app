# Gap analysis of the book against Orden CIN/351/2009 (drafted; evidence: headings and text of
# web/public/libro/partes/*.json, keyword scan in datos/_evidencias.json). Chapter keys are the part
# files (cap24 = chapter 23); section numbers are the printed ones.
fuera_alcance:
  - {codigo: FB4, motivo: "Química general, orgánica e inorgánica: materia de primer curso ajena al objeto del libro; solo se toca la química de baterías (cap. 38) y de la soldadura (cap. 13) como aplicación."}
  - {codigo: FB5, motivo: "Expresión gráfica (geometría métrica y descriptiva, CAD mecánico): el libro trata el dibujo de esquemas y el CAD electrónico (caps. 11, 12 y 39), que es otra disciplina."}
  - {codigo: FB6, motivo: "Empresa, marco jurídico y gestión: fuera del objeto de un texto técnico de electrónica."}
  - {codigo: CR1, motivo: "Termodinámica aplicada y transmisión de calor: el libro solo trata la gestión térmica de componentes (caps. 10 y 46, con conducción, convección y radiación en 46.4-46.13); la termodinámica general corresponde a otra asignatura."}
  - {codigo: CR2, motivo: "Mecánica de fluidos (tuberías, canales): ajena a la electrónica."}
  - {codigo: CR3, motivo: "Ciencia y tecnología de materiales en general: el libro trata solo los materiales electrónicos (semiconductores, dieléctricos, núcleos magnéticos, aleaciones de soldadura), no la relación microestructura-propiedades de la ciencia de materiales."}
  - {codigo: CR7, motivo: "Teoría de máquinas y mecanismos: ajena a la electrónica."}
  - {codigo: CR8, motivo: "Resistencia de materiales: ajena a la electrónica (la galga extensométrica de 34.3 mide deformación, pero no enseña la teoría)."}
  - {codigo: CR9, motivo: "Sistemas de producción y fabricación en general: el libro trata la fabricación electrónica (soldadura, reflujo, DFM, cap. 13, 39 y 45) como caso particular, no los sistemas de producción."}
  - {codigo: CR10, motivo: "Tecnologías medioambientales y sostenibilidad: el libro solo menciona RoHS, RAEE y el ecodiseño (13.6, D.5, 52.33)."}
  - {codigo: CR11, motivo: "Organización de empresas: fuera del objeto del libro."}
  - {codigo: CR12, motivo: "Organización y gestión de proyectos y oficina técnica: el libro desarrolla proyectos técnicos por etapas (caps. 47-51), pero no su gestión, planificación ni la oficina de proyectos."}

competencias:
  - codigo: FB1
    cobertura: parcial
    cubren:
      - {parte: cap00, secciones: "0.1-0.21", nota: "notación, álgebra, trigonometría, complejos, derivadas e integrales, EDO de primer y segundo orden, Laplace, Fourier, convolución, transformada Z, Cramer, estadística, Monte Carlo, propagación de errores, mínimos cuadrados, Taylor, análisis dimensional, Bode"}
      - {parte: cap23, secciones: "22.13", nota: "formulación matricial del análisis nodal"}
      - {parte: cap42, secciones: "41.5, 41.6", nota: "Monte Carlo y convergencia por Newton-Raphson, solo citado"}
    comentario: "El libro cubre con rigor las matemáticas que usa la electrónica, siempre aplicadas a un circuito. No cubre lo que la competencia nombra y la electrónica no necesita en primera línea (geometría y geometría diferencial, EDP, optimización general), y trata de pasada dos cosas que un curso sí espera y que el propio libro usa: el álgebra lineal más allá de las nociones de 0.12 (autovalores, que sostienen el espacio de estados de 30.12) y los métodos numéricos (Newton-Raphson e integración de EDO, que explican el comportamiento de SPICE en 41.6)."
    huecos: [P08]
  - codigo: FB2
    cobertura: parcial
    cubren:
      - {parte: cap01, secciones: "1.1, 1.14", nota: "carga, campo y efecto pelicular"}
      - {parte: cap03, secciones: "3.1", nota: "campo eléctrico en el dieléctrico, capacidad"}
      - {parte: cap04, secciones: "4.1, 4.9, 4.10", nota: "inducción (Faraday, Lenz), histéresis, saturación, reluctancia"}
      - {parte: cap26, secciones: "25.1-25.2", nota: "física del estado sólido aplicada"}
      - {parte: cap36, secciones: "35.1-35.8", nota: "ondas en líneas de transmisión y antenas"}
    comentario: "El electromagnetismo aparece siempre aplicado y suficiente para la electrónica. Falta un tratamiento formal de campo: ley de Gauss, ley de Ampère y ecuaciones de Maxwell (citadas solo de pasada en 4.1) y la onda electromagnética que une la línea de transmisión con la antena. Mecánica y termodinámica quedan fuera del objeto del libro, como es normal en un texto de electrónica."
    huecos: [P09]
  - codigo: FB3
    cobertura: parcial
    cubren:
      - {parte: cap17, secciones: "16.3-16.11", nota: "programación de Arduino en C/C++, cadena de herramientas, depuración"}
      - {parte: cap18, secciones: "17.3, 17.6", nota: "Python y sistema operativo Linux en Raspberry Pi"}
      - {parte: cap38, secciones: "37.3, 37.9-37.14", nota: "programación bare-metal, arquitectura del firmware, RTOS"}
      - {parte: cap37, secciones: "36.4-36.7", nota: "descripción de hardware en VHDL y Verilog"}
      - {parte: cap49, secciones: "48.10-48.11", nota: "firmware por capas, MQTT y almacenamiento en un panel"}
    comentario: "La programación aplicada a sistemas empotrados está muy bien cubierta. No hay una introducción a la programación (tipos, estructuras de datos, algoritmos) ni a las bases de datos, que el libro da por sabidas; es razonable en un libro de electrónica, y basta un apéndice de consulta de C."
    huecos: [P12]
  - codigo: CR4
    cobertura: parcial
    cubren:
      - {parte: cap01, secciones: "1.1-1.11", nota: "leyes y teoremas"}
      - {parte: cap23, secciones: "22.1-22.14", nota: "métodos formales de análisis"}
      - {parte: cap24, secciones: "23.1-23.9", nota: "transitorio, alterna, potencias, factor de potencia, transformador"}
      - {parte: cap25, secciones: "24.1-24.9", nota: "cuadripolos, función de transferencia, filtros"}
      - {parte: cap04, secciones: "4.6, 4.9", nota: "transformador ideal y real"}
      - {parte: cap33, secciones: "32.13", nota: "ampliación breve: motor de continua, de inducción, paso a paso y BLDC"}
    comentario: "La teoría de circuitos está completa y a nivel universitario. Las máquinas eléctricas solo aparecen en el transformador y en la ampliación 32.13; no hay ninguna referencia a los sistemas trifásicos (cero apariciones de «trifásico» en todo el libro), ni a la máquina síncrona, ni al circuito equivalente del motor de inducción."
    huecos: [P01, P02]
  - codigo: CR5
    cobertura: completa
    cubren:
      - {parte: cap05, secciones: "5.1-5.11", nota: "diodo"}
      - {parte: cap06, secciones: "6.1-6.15", nota: "BJT"}
      - {parte: cap07, secciones: "7.1-7.11", nota: "MOSFET"}
      - {parte: cap08, secciones: "8.1-8.10", nota: "integrados analógicos"}
      - {parte: cap09, secciones: "9.1-9.10", nota: "integrados digitales"}
      - {parte: cap26, secciones: "25.1-25.10", nota: "semiconductores en profundidad"}
    comentario: "Cubierta de sobra: los fundamentos de la electrónica son el núcleo del libro."
    huecos: []
  - codigo: CR6
    cobertura: parcial
    cubren:
      - {parte: cap31, secciones: "30.1-30.3, 30.5, 30.7, 30.9, 30.11, 30.12", nota: "control realimentado, PID, control digital, otras técnicas"}
      - {parte: cap20, secciones: "19.2, 19.10", nota: "relés y relés de estado sólido como componentes"}
    comentario: "Los métodos de control están bien cubiertos. Los automatismos no: no hay lógica cableada con relés y contactores, autómatas programables, lenguajes IEC 61131-3 ni GRAFCET (una sola mención de «PLC», en 19.13, como receptor de un lazo de 4-20 mA)."
    huecos: [P03]
  - codigo: TE1
    cobertura: parcial
    cubren:
      - {parte: cap24, secciones: "23.2, 23.4, 23.5, 23.8, 23.9", nota: "alterna, potencias, corrección del factor de potencia, transformador"}
      - {parte: cap47, secciones: "46.7, 46.10", nota: "diferencial, clases de protección y aislamiento"}
      - {parte: cap33, secciones: "32.8", nota: "corrección del factor de potencia activa"}
    comentario: "La electrotecnia monofásica está cubierta. Faltan los sistemas trifásicos y las instalaciones de baja tensión con sus protecciones (magnetotérmicos, selectividad, esquemas de conexión a tierra) y el Reglamento electrotécnico para baja tensión, que el libro no cita."
    huecos: [P01, P07]
  - codigo: TE2
    cobertura: completa
    cubren:
      - {parte: cap06, secciones: "6.5-6.14", nota: "etapas con BJT"}
      - {parte: cap08, secciones: "8.1-8.9", nota: "operacional, reguladores, referencias, S&H"}
      - {parte: cap25, secciones: "24.4-24.9", nota: "filtros activos"}
      - {parte: cap27, secciones: "26.1-26.10", nota: "operacional y realimentación, estabilidad"}
      - {parte: cap28, secciones: "27.1-27.7", nota: "osciladores y PLL"}
      - {parte: cap43, secciones: "42.1-42.11", nota: "amplificadores discretos, clases de salida"}
      - {parte: cap51, secciones: "50.1-50.12", nota: "proyecto de amplificador"}
    comentario: "Cubierta con profundidad de grado y con diseño."
    huecos: []
  - codigo: TE3
    cobertura: completa
    cubren:
      - {parte: cap09, secciones: "9.1-9.9", nota: "familias lógicas, metaestabilidad"}
      - {parte: cap29, secciones: "28.1-28.10", nota: "combinacional, secuencial, máquinas de estados, memorias, diseño síncrono, representación numérica, del bit al procesador"}
      - {parte: cap37, secciones: "36.1-36.17", nota: "lógica programable, HDL, cierre de tiempos, RISC-V"}
      - {parte: cap17, secciones: "16.1-16.11", nota: "microcontrolador"}
      - {parte: cap38, secciones: "37.1-37.15", nota: "sistemas empotrados, interrupciones, DMA, arquitectura de computadores"}
    comentario: "Cubierta. La única ausencia frente a una asignatura de microprocesadores es la programación en lenguaje ensamblador y los modos de direccionamiento (solo nueve menciones de «ensamblador»); es una mejora opcional, no un hueco."
    huecos: [P11]
  - codigo: TE4
    cobertura: parcial
    cubren:
      - {parte: cap05, secciones: "5.6, 5.7", nota: "rectificación con diodos y recuperación inversa"}
      - {parte: cap10, secciones: "10.1, 10.2, 10.6", nota: "tiristores con control de fase, IGBT, snubbers"}
      - {parte: cap33, secciones: "32.1-32.16", nota: "convertidores CC-CC, aislados, PFC, rectificación síncrona, resonantes, puente en H, magnéticos, compensación"}
      - {parte: cap50, secciones: "49.1-49.16", nota: "proyecto de fuente lineal"}
    comentario: "La conversión CC-CC está tratada con profundidad de grado. Faltan los convertidores CC-CA (inversores monofásicos y trifásicos con modulación PWM senoidal; ninguna aparición en el libro), los rectificadores controlados trifásicos y el accionamiento de motores de alterna."
    huecos: [P04, P02]
  - codigo: TE5
    cobertura: completa
    cubren:
      - {parte: cap21, secciones: "20.1-20.21", nota: "osciloscopio, FFT, generador, multímetro"}
      - {parte: cap22, secciones: "21.1-21.13", nota: "prácticas de laboratorio"}
      - {parte: cap34, secciones: "33.1-33.10", nota: "conversión de datos"}
      - {parte: cap35, secciones: "34.1-34.11", nota: "sensores y acondicionamiento, cadena de medida"}
      - {parte: cap47, secciones: "46.1-46.3, 46.14", nota: "medida, incertidumbre, calibración, trazabilidad"}
      - {parte: cap20, secciones: "19.5, 19.13", nota: "sensores y lazo de 4-20 mA"}
    comentario: "Cubierta, con un enfoque de banco poco habitual en los textos universitarios. Podría añadirse la terminología de la evaluación de la incertidumbre de tipo A y B, pero el contenido de fondo está."
    huecos: []
  - codigo: TE6
    cobertura: completa
    cubren:
      - {parte: cap40, secciones: "39.1-39.12", nota: "diseño de circuito impreso"}
      - {parte: cap41, secciones: "40.1-40.10", nota: "integridad de señal y alimentación"}
      - {parte: cap46, secciones: "45.1-45.18", nota: "fiabilidad y DFM"}
      - {parte: cap48, secciones: "47.1-47.5", nota: "método de proyecto"}
      - {parte: cap49, secciones: "48.1-48.14", nota: "proyecto IoT"}
      - {parte: cap50, secciones: "49.1-49.16", nota: "proyecto de fuente"}
      - {parte: cap51, secciones: "50.1-50.12", nota: "proyecto de amplificador"}
      - {parte: cap52, secciones: "51.1-51.10", nota: "proyecto SDR"}
    comentario: "Cubierta: además de los cuatro proyectos completos, casi todos los capítulos terminan con problemas de diseño."
    huecos: []
  - codigo: TE7
    cobertura: parcial
    cubren:
      - {parte: cap42, secciones: "41.1-41.10", nota: "simulación de circuitos con SPICE"}
      - {parte: cap31, secciones: "30.12", nota: "espacio de estados, como ampliación"}
      - {parte: cap47, secciones: "46.4, 46.5", nota: "analogía térmica-eléctrica"}
      - {parte: cap30, secciones: "29.2, 29.7", nota: "sistemas LTI y paso del circuito al algoritmo"}
    comentario: "La simulación de circuitos está completa. El modelado de sistemas dinámicos no eléctricos (mecánicos, térmicos, electromecánicos) y su simulación por diagramas de bloques no se tratan, y el libro no usa ninguna herramienta de simulación de sistemas."
    huecos: [P06]
  - codigo: TE8
    cobertura: parcial
    cubren:
      - {parte: cap31, secciones: "30.1-30.3, 30.5, 30.9, 30.11, 30.12", nota: "PID, sintonía, márgenes, lugar de las raíces, control digital"}
      - {parte: cap27, secciones: "26.8-26.10", nota: "estabilidad y compensación del operacional"}
      - {parte: cap33, secciones: "32.6, 32.16", nota: "control de convertidores, redes de tipo II y III"}
      - {parte: cap50, secciones: "49.6, 49.8", nota: "lazos de tensión y corriente"}
    comentario: "El control realimentado se trata con criterio práctico. Frente a una asignatura de regulación automática faltan los criterios formales de estabilidad (Routh-Hurwitz, ninguna aparición; criterio de Nyquist, una mención), el error en régimen permanente y el tipo del sistema, y el diseño sistemático de compensadores de adelanto y retraso (las redes de 32.16 lo son, pero no se presentan así). La aplicación a la automatización industrial depende de P03."
    huecos: [P05, P03]
  - codigo: TE9
    cobertura: ninguna
    cubren: []
    comentario: "No hay contenido de sistemas robotizados (una sola mención de «robots» en la introducción del capítulo 18). Los componentes que un robot necesita sí están: motores y puente en H (32.9, 32.13), encoders (19.9), sensores de movimiento (34.4) y control (cap. 30)."
    huecos: [P10]
  - codigo: TE10
    cobertura: parcial
    cubren:
      - {parte: cap44, secciones: "43.1-43.12", nota: "UART, SPI, I²C, CAN, USB, RS-485, aislamiento, terminación, fibra"}
      - {parte: cap31, secciones: "30.4, 30.6, 30.10, 30.13", nota: "modulación, multiplexación, corrección de errores"}
      - {parte: cap36, secciones: "35.1-35.12", nota: "radiofrecuencia"}
      - {parte: cap38, secciones: "37.9-37.14", nota: "firmware y RTOS"}
      - {parte: cap19, secciones: "18.2, 18.6", nota: "protocolo robusto entre placas; Modbus RTU solo citado"}
    comentario: "Las comunicaciones electrónicas están muy bien cubiertas. La informática industrial no: buses de campo y Ethernet industrial (Modbus, PROFINET, EtherCAT: dos menciones en total), arquitectura de un sistema de automatización con SCADA y OPC UA (ninguna aparición)."
    huecos: [P03, P13]
  - codigo: TE11
    cobertura: parcial
    cubren:
      - {parte: cap31, secciones: "30.14", nota: "problemas de diseño de lazos PID"}
      - {parte: cap33, secciones: "32.16", nota: "diseño de la compensación de un convertidor"}
      - {parte: cap50, secciones: "49.6, 49.8", nota: "diseño de los lazos de una fuente"}
    comentario: "El diseño de lazos de control sí se practica; el diseño de un sistema de automatización industrial (especificación, GRAFCET, autómata, seguridad de máquina) no aparece."
    huecos: [P03]

propuestas:
  - id: P01
    prioridad: esencial
    tipo: sección
    titulo: "Sistemas trifásicos"
    ubicacion: "Nueva sección 23.10 en el capítulo 23 (cap24.json), tras «Inductancia mutua y el transformador en alterna»; el resumen actual pasa a 23.11."
    paginas: 12
    prerrequisitos: [cap24, cap01]
    competencias: [CR4, TE1]
    esquema:
      - "Por qué tres fases: potencia instantánea constante y ahorro de conductor."
      - "Secuencia de fases, tensiones de fase y de línea, factor √3, diagrama fasorial."
      - "Cargas en estrella y en triángulo, equilibradas y desequilibradas; el neutro y su corriente."
      - "Potencias activa, reactiva y aparente en trifásica; corrección del factor de potencia."
      - "Medida de potencia: un vatímetro con neutro y el método de los dos vatímetros (Aron)."
      - "La red de 400/230 V que llega a un taller, con números."
      - "En el banco: por qué no se mide la red trifásica con el FNIRSI y qué instrumento hace falta."
  - id: P02
    prioridad: recomendable
    tipo: capítulo
    titulo: "Máquinas eléctricas y accionamientos"
    ubicacion: "Nuevo capítulo en el bloque «Electrónica de grado», a continuación del capítulo 32 (Electrónica de potencia); absorbe y amplía la ampliación 32.13."
    paginas: 28
    prerrequisitos: [cap04, cap24, cap33]
    competencias: [CR4, TE4, TE8]
    esquema:
      - "El circuito magnético: reluctancia, fuerza magnetomotriz, par y fuerza electromotriz."
      - "El transformador trifásico, grupos de conexión y ensayos de vacío y cortocircuito."
      - "La máquina de corriente continua: ecuaciones, curvas par-velocidad, control por inducido."
      - "El motor de inducción: campo giratorio, deslizamiento, circuito equivalente, curva par-velocidad."
      - "La máquina síncrona y el motor de imanes permanentes (PMSM y BLDC)."
      - "Accionamientos: control escalar V/f, nociones de control vectorial, frenado y cuatro cuadrantes."
      - "Elección y protección de un motor; lectura de la placa de características."
      - "Problemas de diseño: dimensionar un accionamiento para una carga dada."
  - id: P03
    prioridad: esencial
    tipo: capítulo
    titulo: "Automatismos y autómatas programables"
    ubicacion: "Nuevo capítulo en el tomo V, a continuación de «Control y comunicaciones» (cap31.json), o al comienzo del bloque «Diseño y realización»."
    paginas: 26
    prerrequisitos: [cap09, cap20, cap29, cap31]
    competencias: [CR6, TE8, TE10, TE11]
    esquema:
      - "Lógica cableada: relés, contactores, enclavamientos, arranque directo y estrella-triángulo de un motor."
      - "Sensores y actuadores industriales: detectores inductivos y capacitivos, finales de carrera, electroválvulas."
      - "El autómata programable: arquitectura, ciclo de scan, entradas y salidas, tiempo de respuesta."
      - "Lenguajes de la norma IEC 61131-3: diagrama de contactos, bloques funcionales, texto estructurado y SFC."
      - "GRAFCET (IEC 60848): etapas, transiciones, divergencias; del GRAFCET al programa."
      - "Seguridad de máquinas: parada de emergencia, categorías y funciones de seguridad."
      - "Autómata frente a microcontrolador: cuándo cada uno."
      - "Problema de diseño: automatizar una máquina sencilla desde la especificación al programa."
  - id: P04
    prioridad: esencial
    tipo: sección
    titulo: "Inversores y rectificadores controlados"
    ubicacion: "Dos secciones nuevas en el capítulo 32, tras 32.9 «Gobernar motores: puente en H»: 32.10 «Convertidores CC-CA» y 32.11 «Rectificadores controlados»; renumerar las siguientes."
    paginas: 16
    prerrequisitos: [cap10, cap33, cap24]
    competencias: [TE4]
    esquema:
      - "Del puente en H al inversor monofásico: onda cuadrada, cuasi cuadrada y modulación PWM senoidal."
      - "Índice de modulación, sobremodulación, armónicos y filtrado de salida."
      - "El inversor trifásico de seis interruptores y la modulación vectorial (SVPWM), en lo esencial."
      - "Tiempos muertos, drivers de rama y protección de cortocircuito de rama."
      - "Rectificadores controlados monofásicos y trifásicos con tiristores: ángulo de disparo, tensión media, factor de potencia."
      - "Rectificadores trifásicos con diodos (puente de seis pulsos) y su rizado."
      - "Problemas de diseño: un inversor de 500 W para una carga resistiva."
  - id: P05
    prioridad: esencial
    tipo: sección
    titulo: "Análisis y compensación clásicos del lazo de control"
    ubicacion: "Tres secciones nuevas en el capítulo 30, tras 30.9 «Estabilidad del lazo de control»."
    paginas: 14
    prerrequisitos: [cap00, cap25, cap31]
    competencias: [TE8]
    esquema:
      - "Especificaciones temporales del sistema de segundo orden: sobreimpulso, tiempo de pico y de establecimiento."
      - "Tipo del sistema y error en régimen permanente ante escalón, rampa y parábola."
      - "Criterio de Routh-Hurwitz: estabilidad absoluta y margen de una ganancia."
      - "Criterio de Nyquist y su relación con los márgenes de 30.9."
      - "Compensadores de adelanto y de retraso por frecuencia y por lugar de las raíces."
      - "La conexión con las redes de tipo II y III de 32.16."
      - "Problemas de diseño con números."
  - id: P06
    prioridad: recomendable
    tipo: sección
