# ld65 memory map of the NES demo: iNES header, 16 KB of PRG-ROM at $C000 (NROM-128, mirrored at $8000), 8 KB CHR.
MEMORY {
    ZP:     start = $0000, size = $0100, type = rw, file = "";
    RAM:    start = $0300, size = $0500, type = rw, file = "";
    HEADER: start = $0000, size = $0010, type = ro, file = %O, fill = yes;
    PRG:    start = $C000, size = $4000, type = ro, file = %O, fill = yes, fillval = $FF;
    CHR:    start = $0000, size = $2000, type = ro, file = %O, fill = yes;
}
SEGMENTS {
    ZEROPAGE: load = ZP,     type = zp;
    HEADER:   load = HEADER, type = ro;
    CODE:     load = PRG,    type = ro, start = $C000;
    RODATA:   load = PRG,    type = ro;
    VECTORS:  load = PRG,    type = ro, start = $FFFA;
    CHARS:    load = CHR,    type = ro;
}
