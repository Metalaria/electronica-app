# 1.1: new exercises of chapter 25 (printed 24, «Cuadripolos, Función de Transferencia y Filtros»), app only until the
# next edition of the book. Source of contenido/ejercicios_nuevos.py (ESQUEMA.md «Ejercicios nuevos (1.1)»): the app
# shows them marked «Aún no en el libro» and the same text goes, as Typst, to scratchpad/libro11/ejercicios-nuevos.typ.md.
# Markup: paragraphs separated by a blank line, «- » list items, *bold*, $Typst math$ (decimals quoted: "0,707"),
# #nr("label") for a reference. Values: «37 dB ±0,1 dB», «4 MHz ±2%» (contenido/ejercicios.py valor_dsl).
parte: cap25
items:
  - n: 1
    seccion: sec-25.2
    enunciado: |
      Una cadena de recepción tiene un preamplificador de 26 dB, un filtro que pierde 3 dB en su banda de paso y un amplificador de 14 dB. A la entrada llega una señal de −40 dBm.

      Se pide: la ganancia total de la cadena, la potencia de salida en dBm y la ganancia total expresada como relación de tensiones.
    respuestas:
      - nombre: Ganancia total
        valor: 37 dB ±0,1 dB
      - nombre: Potencia de salida
        valor: −3 dBm ±0,1 dBm
      - nombre: Relación de tensiones
        valor: 70,8 ±1%
    pistas:
      - 'Las ganancias en decibelios de etapas en cascada se suman; un nivel absoluto en dBm más una ganancia relativa en dB da otro nivel en dBm. Para tensiones, $"dB" = 20 dot log_10 (V_2 / V_1)$.'
      - 'La ganancia total es $26 - 3 + 14 = 37$ dB, y la relación de tensiones, $10^(37 / 20)$.'
    solucion: |
      Las etapas encadenadas se suman en decibelios: $G = 26 - 3 + 14 = 37$ dB. La salida es el nivel absoluto de entrada más la ganancia relativa: $-40 + 37 = -3$ dBm, unos 0,5 mW. Como relación de tensiones, $10^(37 / 20) approx "70,8"$: cada 20 dB multiplican la tensión por diez y los 17 dB restantes, por unas siete.

  - n: 2
    seccion: sec-25.2
    enunciado: |
      Un analizador de espectro, con su entrada de 50 Ω, marca −10 dBm.

      Se pide: la potencia en milivatios, la tensión eficaz en la entrada y la potencia total, en dBm, si a esa señal se suma otra incorrelada, también de −10 dBm.
    respuestas:
      - nombre: Potencia
        valor: 0,1 mW ±1%
      - nombre: Tensión eficaz
        valor: 70,7 mV ±1%
      - nombre: Potencia de las dos señales
        valor: −7 dBm ±0,1 dBm
    pistas:
      - 'El dBm toma como referencia 1 mW: $P = "1 mW" dot 10^("dBm" / 10)$. La tensión eficaz sobre una resistencia es $V = sqrt(P dot R)$. Las potencias incorreladas se suman en lineal, no en decibelios.'
      - '$P = "0,1"$ mW; dos potencias iguales suman el doble, es decir, 3 dB más.'
    solucion: |
      −10 dBm son una décima de milivatio: $P = "1 mW" dot 10^(-1) = "0,1 mW"$. Sobre 50 Ω, $V = sqrt("0,1" dot 10^(-3) dot 50) approx "70,7 mV"$ eficaces (o, partiendo de la equivalencia del capítulo, 224 mV para 0 dBm divididos por $sqrt(10)$).

      Dos señales incorreladas suman sus potencias: $"0,1" + "0,1" = "0,2 mW"$, es decir, $10 dot log_10 "0,2" approx -7$ dBm. Sumar los decibelios (−20 dBm) sería el error conceptual que señala el capítulo.

  - n: 3
    seccion: sec-25.3
    enunciado: |
      Un filtro paso bajo de primer orden tiene su polo en 2 kHz.

      Se pide: la ganancia a 1 kHz y a 20 kHz y la fase a 200 Hz y a 20 kHz, comparando cada resultado con lo que dan las reglas del trazado asintótico.
    respuestas:
      - nombre: Ganancia a 1 kHz
        valor: −0,97 dB ±0,1 dB
      - nombre: Ganancia a 20 kHz
        valor: −20,04 dB ±0,1 dB
      - nombre: Fase a 200 Hz
        valor: −5,71 ° ±0,2 °
      - nombre: Fase a 20 kHz
        valor: −84,29 ° ±0,2 °
    pistas:
      - 'Con $H(j omega) = 1 / (1 + j omega / omega_c)$, el módulo es $1 / sqrt(1 + (f / f_c)^2)$ y la fase, $-arctan(f / f_c)$.'
      - '1 kHz está una octava por debajo del polo (la asíntota se equivoca en 1 dB); 200 Hz y 20 kHz, una década antes y una después.'
    solucion: |
      A 1 kHz, $f / f_c = "0,5"$: $-10 dot log_10 (1 + "0,25") approx "−0,97 dB"$, el −1 dB de la corrección a una octava. A 20 kHz, $f / f_c = 10$: $-10 dot log_10 101 approx "−20,04 dB"$, prácticamente la asíntota de −20 dB/década.

      La fase a 200 Hz es $-arctan "0,1" approx "−5,71"°$ y a 20 kHz, $-arctan 10 approx "−84,29"°$: los −5,7° y −84° de una década antes y una después del polo.

  - n: 4
    seccion: sec-25.7
    enunciado: |
      Un filtro antialiasing tiene el corte en 5 kHz y debe atenuar al menos 72 dB a 40 kHz.

      Se pide: el orden mínimo (un número entero), la pendiente final de ese filtro y el orden mínimo si, sobremuestreando, la atenuación de 72 dB bastara a 160 kHz.
    respuestas:
      - nombre: Orden mínimo a 40 kHz
        valor: 4 ±0
      - nombre: Pendiente final
        valor: 80 dB/década ±0
      - nombre: Orden mínimo a 160 kHz
        valor: 3 ±0
    pistas:
      - '$"orden" gt.eq A / (20 dot log_10 (f / f_c))$, y el orden es el entero siguiente. Cada orden aporta 20 dB por década.'
      - '$log_10 8 approx "0,903"$ y $log_10 32 approx "1,505"$.'
    solucion: |
      Entre 5 y 40 kHz hay $log_10 8 approx "0,903"$ décadas: $72 / (20 dot "0,903") approx "3,99"$, así que hace falta orden 4, con una pendiente final de $4 dot 20 = 80$ dB/década.

      Si la atenuación basta a 160 kHz, la separación es de $log_10 32 approx "1,505"$ décadas: $72 / (20 dot "1,505") approx "2,39"$, y basta orden 3. Es el argumento del sobremuestreo: separar las bandas abarata el filtro.

  - n: 5
    seccion: sec-25.8
    enunciado: |
      Un filtro paso banda tiene sus cortes a −3 dB en 1,8 kHz y en 2,2 kHz.

      Se pide: su frecuencia central, su ancho de banda y su factor de calidad. Además, un notch de Q = 25 centrado en 50 Hz: ¿qué anchura tiene su banda rechazada?
    respuestas:
      - nombre: 'Frecuencia central $f_0$'
        valor: 1,99 kHz ±0,3%
      - nombre: Ancho de banda $B$
        valor: 400 Hz ±0,5%
      - nombre: Factor de calidad $Q$
        valor: 4,97 ±1%
      - nombre: Anchura del notch
        valor: 2 Hz ±1%
    pistas:
      - 'La frecuencia central es la media geométrica de los cortes, $f_0 = sqrt(f_1 dot f_2)$, no la aritmética; $B = f_2 - f_1$ y $Q = f_0 / B$.'
      - '$sqrt(1800 dot 2200) approx 1990$ Hz; la anchura del notch es $f_0 / Q$.'
    solucion: |
      $f_0 = sqrt(1800 dot 2200) approx 1990$ Hz, es decir, 1,99 kHz (la media aritmética, 2 000 Hz, se queda un poco alta). El ancho de banda es $B = 2200 - 1800 = 400$ Hz y el factor de calidad, $Q = 1990 / 400 approx "4,97"$.

      El notch rechaza una banda de $f_0 / Q = 50 / 25 = 2$ Hz: con un error del 2 % en los componentes, su centro se desplaza 1 Hz, la mitad de esa anchura, y por eso un notch de red se hace ajustable o con componentes de precisión.

  - n: 6
    seccion: sec-25.7
    enunciado: |
      Dos filtros de orden 4 con aplicaciones distintas. En el primero, un tren de pulsos digitales debe limpiarse de ruido sin que los pulsos se deformen. En el segundo, hay que separar dos canales muy próximos en frecuencia y la forma de onda no importa.

      Se pide: la aproximación que conviene en cada caso.
    preguntas:
      - tipo: eleccion
        enunciado: Para los pulsos, que no deben deformarse, ¿qué aproximación conviene?
        opciones:
          - texto: Bessel
            correcta: true
          - texto: Chebyshev de 1 dB
            porque: 'Su rizado y su retardo de grupo muy variable hacen que sobreoscile y timbre ante un escalón: el pulso sale deformado.'
          - texto: Elíptico (Cauer)
            porque: Tiene la transición más abrupta a costa de la peor respuesta temporal de todas.
          - texto: Butterworth
            porque: Es el compromiso razonable cuando no hay una razón clara; aquí la hay, y su sobreoscilación moderada aún deforma los flancos.
        explicacion: 'Bessel optimiza el retardo de grupo constante: todas las frecuencias se retrasan lo mismo y un pulso sale como un pulso, con una sobreoscilación despreciable (un 0,8 % en orden 4).'
      - tipo: eleccion
        enunciado: Para separar los dos canales, ¿cuál consigue la transición más abrupta para un orden dado?
        opciones:
          - texto: Elíptico (Cauer)
            correcta: true
          - texto: Chebyshev I
            porque: Es más abrupto que Butterworth, pero el elíptico, con ceros de transmisión, lo es todavía más.
          - texto: Butterworth
            porque: 'Su transición es media: plano en la banda de paso a cambio de caer más despacio.'
          - texto: Bessel
            porque: Tiene la peor transición de todos; cerca del corte, uno de cuarto orden apenas filtra más que un Butterworth de segundo.
        explicacion: 'El elíptico admite rizado en ambas bandas y, con sus ceros de transmisión, consigue la transición más rápida posible para un orden dado; como aquí la forma de onda no importa, su mala respuesta temporal no estorba.'
    pistas:
      - 'Cuanto más abrupta la transición, peor el comportamiento en el tiempo: cada aproximación optimiza una cosa a costa de otra.'
      - 'Una aproximación optimiza el retardo de grupo plano; otra, la caída más rápida con rizado en las dos bandas.'
    solucion: |
      Para los pulsos, Bessel: su fase casi lineal hace que todas las componentes se retrasen lo mismo, y la forma se conserva. Para separar canales próximos, el elíptico, que tiene la transición más abrupta para un orden dado; su rizado y su respuesta temporal, la peor de todas, no importan cuando solo cuenta separar frecuencias.

  - n: 7
    seccion: sec-25.5
    enunciado: |
      Un filtro activo paso bajo de segundo orden debe tener el corte en 20 kHz y Q = 2, y su atenuación debe mantenerse muy por encima del corte.

      Se pide: el producto ganancia por ancho de banda (GBW) mínimo del operacional según la regla del capítulo y la topología que conviene.
    respuestas:
      - nombre: GBW mínimo
        valor: 4 MHz ±1%
    preguntas:
      - tipo: eleccion
        enunciado: ¿Qué topología conviene para que la atenuación no se detenga muy por encima del corte?
        opciones:
          - texto: Realimentación múltiple (MFB)
            correcta: true
          - texto: Sallen-Key
            porque: Por encima del ancho de banda del operacional, su condensador de realimentación acopla la entrada directamente a la salida, y la atenuación se detiene o incluso revierte.
          - texto: Da igual, si el operacional cumple la regla del GBW
            porque: La regla del GBW asegura el corte y el Q, pero no lo que ocurre una o dos décadas más arriba, donde el Sallen-Key deja de filtrar.
        explicacion: 'La MFB es inversora y no tiene el camino directo de la entrada a la salida que tiene el Sallen-Key, así que se comporta mejor a alta frecuencia; además, tolera mejor el Q alto.'
    pistas:
      - 'La regla: el GBW del operacional, al menos 100 veces la frecuencia de corte multiplicada por el Q.'
      - '$100 dot "20 kHz" dot 2$.'
    solucion: |
      $"GBW" gt.eq 100 dot f_c dot Q = 100 dot "20 kHz" dot 2 = "4 MHz"$.

      Conviene la realimentación múltiple: el Sallen-Key, por encima del ancho de banda del operacional, deja pasar la entrada a través del condensador de realimentación y su atenuación se detiene, mientras que la MFB, inversora, no tiene ese camino directo.

  - n: 8
    seccion: sec-25.6
    enunciado: |
      Un filtro de condensadores conmutados conmuta un condensador de 2 pF a 250 kHz, y su corte sigue al reloj en una relación de 100:1.

      Se pide: la resistencia equivalente, la frecuencia de corte y la frecuencia de reloj necesaria para llevar el corte a 400 Hz.
    respuestas:
      - nombre: Resistencia equivalente
        valor: 2 MΩ ±1%
      - nombre: Frecuencia de corte
        valor: 2,5 kHz ±1%
      - nombre: Reloj para 400 Hz
        valor: 40 kHz ±1%
    pistas:
      - '$R_"equivalente" = 1 / (C dot f)$; el corte es proporcional al reloj.'
      - '$1 / (2 dot 10^(-12) dot "250 000") = 2 dot 10^6$ Ω.'
    solucion: |
      $R_"equivalente" = 1 / ("2 pF" dot "250 kHz") = "2 MΩ"$, una resistencia que en un chip ocupa un espacio ridículo. Con la relación 100:1, el corte está en $"250 kHz" / 100 = "2,5 kHz"$, y para llevarlo a 400 Hz basta un reloj de $400 dot 100 = "40 kHz"$, sin tocar ningún componente.

  - n: 9
    seccion: sec-25.4
    enunciado: |
      Se quiere un filtro paso bajo RC de primer orden (la resistencia en serie y el condensador a masa, con la salida en el condensador) con $f_c = "1 kHz" plus.minus "5 %"$. La resistencia debe estar entre 1 kΩ y 100 kΩ, el condensador entre 1 nF y 1 µF, y los dos han de ser valores de la serie E12.

      Se pide: los valores de R y de C. Vale cualquier diseño que cumpla todas las condiciones.
    preguntas:
      - tipo: diseno
        enunciado: Valores de su diseño
        componentes:
          - {id: R, nombre: R, unidad: Ω, serie: E12, min: 1 kΩ, max: 100 kΩ}
          - {id: C, nombre: C, unidad: F, serie: E12, min: 1 nF, max: 1 µF}
        circuito: |
          * Ejercicio 24.9: paso bajo RC
          Vin in 0 DC 0 AC 1
          R1 in out {R}
          C1 out 0 {C}
        control: |
          ac dec 200 1 1meg
          let gdb = db(v(out))
          meas ac fc WHEN gdb=-3.0103 FALL=1
        medidas:
          - {id: fc, nombre: '$f_c$', unidad: Hz}
        condiciones:
          - medida: fc
            min: 950
            max: 1050
            texto: 1 kHz ± 5 %
            si_baja: 'para subirla, disminuya R o C: $f_c = 1 / (2 pi dot R dot C)$'
            si_alta: 'para bajarla, aumente R o C: $f_c = 1 / (2 pi dot R dot C)$'
        referencia: {R: "3,3 kΩ", C: 47 nF}
        explicacion: 'Hace falta $R dot C = 1 / (2 pi dot "1 kHz") approx 159$ µs, con un 5 % de margen: 3,3 kΩ y 47 nF dan 155 µs y $f_c approx 1026$ Hz; también valen 33 kΩ con 4,7 nF o 39 kΩ con 3,9 nF.'
    pistas:
      - 'El corte de un RC está en $f_c = 1 / (2 pi dot R dot C)$: lo que hay que fijar es el producto R·C. Elija primero el condensador y calcule después la resistencia.'
      - '$R dot C = 1 / (2 pi dot 1000) approx 159$ µs; con un 5 % de margen en $f_c$, el producto puede ir de unos 152 a 168 µs.'
    solucion: |
      La frecuencia de corte solo depende del producto: $R dot C = 1 / (2 pi dot 1000) approx 159$ µs, y para quedar dentro de $"1 kHz" plus.minus "5 %"$ el producto debe estar entre unos 152 y 168 µs.

      Con 47 nF (E12) hace falta $"159 µs" / "47 nF" approx "3,39 kΩ"$, y el valor E12 más próximo, 3,3 kΩ, da $R dot C = 155$ µs y $f_c approx 1026$ Hz, un 2,6 % por encima: cumple. También cumplen 33 kΩ con 4,7 nF y 39 kΩ con 3,9 nF; 15 kΩ con 10 nF, en cambio, da 1 061 Hz y se sale. La comprobación en el banco es la de la sección #nr("sec-25.4"): levantar el Bode y medir el corte real, que las tolerancias desplazan.

  - n: 10
    seccion: sec-25.4
    enunciado: |
      A la entrada de una etapa hay que bloquear la continua con un paso alto RC de primer orden (el condensador en serie y la resistencia a masa, con la salida en la resistencia) con $f_c = "50 Hz" plus.minus "5 %"$. La resistencia es la impedancia de entrada de la etapa y debe ser de al menos 10 kΩ, sin pasar de 1 MΩ; el condensador no puede pasar de 1 µF. Los dos, de la serie E12.

      Se pide: los valores de R y de C. Vale cualquier diseño que cumpla todas las condiciones.
    preguntas:
      - tipo: diseno
        enunciado: Valores de su diseño
        componentes:
          - {id: R, nombre: R, unidad: Ω, serie: E12, min: 10 kΩ, max: 1 MΩ}
          - {id: C, nombre: C, unidad: F, serie: E12, min: 1 nF, max: 1 µF}
        circuito: |
          * Ejercicio 24.10: paso alto RC (bloqueo de continua)
          Vin in 0 DC 0 AC 1
          C1 in out {C}
          R1 out 0 {R}
        control: |
          ac dec 200 0.1 100k
          let gdb = db(v(out))
          meas ac fc WHEN gdb=-3.0103 RISE=1
        medidas:
          - {id: fc, nombre: '$f_c$', unidad: Hz}
        condiciones:
          - medida: fc
            min: 47.5
            max: 52.5
            texto: 50 Hz ± 5 %
            si_baja: 'para subirla, disminuya R o C: $f_c = 1 / (2 pi dot R dot C)$'
            si_alta: 'para bajarla, aumente R o C: $f_c = 1 / (2 pi dot R dot C)$'
        referencia: {R: 68 kΩ, C: 47 nF}
        explicacion: 'Hace falta $R dot C = 1 / (2 pi dot "50 Hz") approx "3,18"$ ms: 68 kΩ con 47 nF dan 3,20 ms y $f_c approx "49,8"$ Hz; también valen 33 kΩ con 100 nF o 680 kΩ con 4,7 nF.'
    pistas:
      - 'El corte del paso alto RC también está en $f_c = 1 / (2 pi dot R dot C)$; con $C lt.eq 1$ µF, la resistencia sale de al menos unos 3,2 kΩ, y la etapa pide 10 kΩ o más.'
      - '$R dot C = 1 / (2 pi dot 50) approx "3,18"$ ms; con un 5 % de margen, de unos 3,03 a 3,35 ms.'
    solucion: |
      $R dot C = 1 / (2 pi dot 50) approx "3,18 ms"$, entre unos 3,03 y 3,35 ms para quedar en $"50 Hz" plus.minus "5 %"$. La condición de la etapa, $R gt.eq "10 kΩ"$, deja el condensador en 330 nF como mucho.

      Eligiendo primero el condensador, 47 nF, hace falta $"3,18 ms" / "47 nF" approx "68 kΩ"$, que es E12: $f_c approx "49,8"$ Hz. También cumplen 33 kΩ con 100 nF (48,2 Hz) o 680 kΩ con 4,7 nF; con 1 µF haría falta una resistencia de 3,2 kΩ, demasiado baja para la etapa.

  - n: 11
    seccion: sec-25.5
    enunciado: |
      Se quiere un filtro activo paso bajo Sallen-Key de ganancia unidad, con la topología de la figura #nr("fig-25.7") y las dos resistencias iguales ($R_1 = R_2 = R$), cuyo corte a −3 dB esté en $"1 kHz" plus.minus "5 %"$ y cuyo factor de calidad esté entre 0,65 y 0,75 (casi Butterworth). Los condensadores, de la serie E12 y entre 100 pF y 1 µF; la resistencia, de la serie E24 y entre 1 kΩ y 100 kΩ. El operacional tiene 1 MHz de GBW.

      Se pide: los valores de R, de $C_1$ (el que va a la salida) y de $C_2$ (el que va a masa). Vale cualquier diseño que cumpla todas las condiciones.
    preguntas:
      - tipo: diseno
        enunciado: Valores de su diseño
        componentes:
          - {id: R, nombre: R, unidad: Ω, serie: E24, min: 1 kΩ, max: 100 kΩ}
          - {id: C1, nombre: '$C_1$', unidad: F, serie: E12, min: 100 pF, max: 1 µF}
          - {id: C2, nombre: '$C_2$', unidad: F, serie: E12, min: 100 pF, max: 1 µF}
        circuito: |
          * Ejercicio 24.11: Sallen-Key paso bajo de ganancia unidad (figura 24.7)
          Vin in 0 DC 0 AC 1
          R1 in a {R}
          R2 a b {R}
          C2 b 0 {C2}
          C1 a out {C1}
          * operacional: ganancia 1e5, polo a 10 Hz (GBW = 1 MHz), 100 ohm de salida
          Eamp n1 0 b out 1e5
          Rp n1 n2 1k
          Cp n2 0 15.915u
          Ebuf n3 0 n2 0 1
          Ro n3 out 100
        control: |
          ac dec 200 10 1meg
          let gdb = db(v(out))
          let gmag = mag(v(out))
          let fase = 180/pi*cph(v(out))
          meas ac fc WHEN gdb=-3.0103 FALL=1
          meas ac q FIND gmag WHEN fase=-90
        medidas:
          - {id: fc, nombre: '$f_c$ (−3 dB)', unidad: Hz}
          - {id: q, nombre: Q, unidad: ''}
        condiciones:
          - medida: fc
            min: 950
            max: 1050
            texto: 1 kHz ± 5 %
            si_baja: 'para subirla, disminuya R o los condensadores (manteniendo su relación): $f_0 = 1 / (2 pi sqrt(R_1 R_2 C_1 C_2))$'
            si_alta: 'para bajarla, aumente R o los condensadores (manteniendo su relación): $f_0 = 1 / (2 pi sqrt(R_1 R_2 C_1 C_2))$'
          - medida: q
            min: 0.65
            max: 0.75
            texto: entre 0,65 y 0,75
            si_baja: 'para subirlo, aumente $C_1$ respecto a $C_2$: con $R_1 = R_2$, $Q = sqrt(C_1 / C_2) / 2$'
            si_alta: 'para bajarlo, reduzca $C_1$ respecto a $C_2$: con $R_1 = R_2$, $Q = sqrt(C_1 / C_2) / 2$'
        referencia: {R: 11 kΩ, C1: 22 nF, C2: 10 nF}
        explicacion: 'Con $R_1 = R_2$, el Q depende solo de la relación de condensadores, $Q = sqrt(C_1 / C_2) / 2$: 22 nF y 10 nF dan 0,74. Con ellos, $f_0 = 1 / (2 pi R sqrt(C_1 C_2))$ pide unos 10,7 kΩ; el E24 de 11 kΩ da $f_0 approx 975$ Hz y, con Q = 0,74, el corte a −3 dB cae un 4,6 % más arriba, en unos 1 020 Hz.'
    pistas:
      - 'Elija primero los condensadores, que fijan el Q: con $R_1 = R_2$, $Q = sqrt(C_1 / C_2) / 2$, y $Q approx "0,7"$ pide $C_1 approx 2 C_2$. Después, $f_0 = 1 / (2 pi R sqrt(C_1 C_2))$ da la resistencia.'
      - 'Con Q = 0,74 el corte a −3 dB queda un 4,6 % por encima de $f_0$: apunte a un $f_0$ algo menor que 1 kHz, entre unos 910 y 1 000 Hz.'
    solucion: |
      Con las dos resistencias iguales, el factor de calidad del Sallen-Key de ganancia unidad depende solo de los condensadores: $Q = sqrt(C_1 / C_2) / 2$. La pareja E12 de la figura #nr("fig-25.7"), $C_1 = 22$ nF y $C_2 = 10$ nF, da $Q = sqrt("2,2") / 2 approx "0,74"$, dentro del margen.

      La frecuencia natural es $f_0 = 1 / (2 pi R sqrt(C_1 C_2))$, y con Q = 0,74 el corte a −3 dB queda un 4,6 % por encima de ella. Para 1 kHz a −3 dB hace falta $f_0 approx 956$ Hz, es decir, $R approx "11,2"$ kΩ: el E24 de 11 kΩ da $f_0 approx 975$ Hz y un corte de unos 1 020 Hz, dentro de $"1 kHz" plus.minus "5 %"$. El E12 de 10 kΩ, en cambio, lo llevaría a 1,12 kHz.

      Es la regla de montaje del capítulo: los condensadores primero, con valores comerciales, y las resistencias después, porque hay muchos más valores de resistencia. Con el operacional de 1 MHz se cumple de sobra la regla del GBW ($100 dot "1 kHz" dot "0,74" = 74$ kHz).
