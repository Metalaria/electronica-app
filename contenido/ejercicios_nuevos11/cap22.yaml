# 1.1: new exercises of chapter 22 (printed 21, «Prácticas de Laboratorio con el FNIRSI 2C53T»), app only until the
# next edition of the book. Format: see cap25.yaml. «banco» links an exercise to its guided practice on the app's test
# bench (#/instrumentos/practica/<n>), where the asked quantities can be read off the simulated instruments.
parte: cap22
items:
  - n: 1
    seccion: sec-22.1
    enunciado: |
      En la práctica 1 se monta el divisor con $R_1 = R_2 = "1 MΩ"$ alimentado con 9 V, y su salida se mide con el osciloscopio. Con la sonda en ×1, la entrada del osciloscopio presenta 1 MΩ; con la sonda en ×10, 10 MΩ.

      Se pide: la resistencia de Thévenin vista desde la salida y la tensión que marca el osciloscopio con la sonda en ×1 y en ×10.
    respuestas:
      - nombre: Resistencia de Thévenin
        valor: 500 kΩ ±1%
      - nombre: Lectura con la sonda en ×1
        valor: 3 V ±2%
      - nombre: Lectura con la sonda en ×10
        valor: 4,29 V ±2%
    banco:
      practica: 1
      texto: 'En el banco, elija el montaje «R1 = R2 = 1 MΩ», lleve la sonda CH1 a la salida y lea con PRM la tensión media, primero con la sonda en ×1 y después en ×10.'
    pistas:
      - 'Visto desde la salida, el divisor es un generador de Thévenin de $V_"th" = 9 dot R_2 / (R_1 + R_2)$ con $R_"th" = R_1 parallel R_2$; la entrada del instrumento forma con $R_"th"$ un nuevo divisor.'
      - '$V_"th" = "4,5"$ V y $R_"th" = 500$ kΩ; con 1 MΩ de entrada, $"4,5" dot 1 / (1 + "0,5")$.'
    solucion: |
      Sin instrumento, la salida es un generador de $V_"th" = "4,5"$ V con $R_"th" = "1 MΩ" parallel "1 MΩ" = "500 kΩ"$. La entrada del osciloscopio forma con ella un divisor: con la sonda en ×1, $"4,5" dot 1 / (1 + "0,5") = 3$ V, un tercio menos de lo que se quería medir; con la sonda en ×10, $"4,5" dot 10 / ("10,5") approx "4,29"$ V, lo mismo que el multímetro de 10 MΩ.

      Es la lección de la práctica: el instrumento forma parte del circuito, y con resistencias de megaohmios la sonda en ×1 es inservible para medir tensiones.

  - n: 2
    seccion: sec-22.2
    enunciado: |
      El circuito RC de la práctica 2, con $R = "10 kΩ"$ y $C = "100 nF"$, se excita con una cuadrada de 0 a 3 V y 100 Hz. Al llegar cada flanco de subida, el condensador está descargado.

      Se pide: la tensión del condensador 2 ms después del flanco de subida, el tiempo que tarda en llegar a 2,4 V y el tiempo de subida del 10 al 90 %.
    respuestas:
      - nombre: Tensión a los 2 ms
        valor: 2,59 V ±2%
      - nombre: Tiempo hasta 2,4 V
        valor: 1,61 ms ±3%
      - nombre: Tiempo de subida 10–90 %
        valor: 2,2 ms ±3%
    banco:
      practica: 2
      texto: 'En el banco, con el montaje «R = 10 kΩ, C = 100 nF» y la cuadrada del generador, mida con los cursores de tiempo y de tensión.'
    pistas:
      - 'La carga sigue $v(t) = V dot (1 - e^(-t / tau))$ con $tau = R dot C$; despejando, $t = -tau dot ln(1 - v / V)$.'
      - '$tau = 1$ ms; 2,4 V es el 80 % de 3 V, y del 10 al 90 % pasan $tau dot ln 9$.'
    solucion: |
      $tau = R dot C = "10 kΩ" dot "100 nF" = 1$ ms, y el semiciclo de 5 ms son cinco constantes de tiempo. A los 2 ms, $v = 3 dot (1 - e^(-2)) approx "2,59"$ V, el 86,5 % de la tabla.

      2,4 V son el 80 % de la tensión final: $t = -tau dot ln(1 - "0,8") = tau dot ln 5 approx "1,61"$ ms. Del 10 al 90 % pasan $tau dot ln 9 approx "2,2"$ ms: el tiempo de subida es 2,2·τ, no τ, que es el error típico de la sección.

  - n: 3
    seccion: sec-22.3
    enunciado: |
      Un diodo de silicio ideal ($n = 1$) cae 0,57 V a 1 mA, y su tensión sube 59,5 mV por cada década de corriente.

      Se pide: la tensión directa a 4 mA y a 50 µA. Además, en un diodo real se miden 0,62 V a 1 mA y 0,725 V a 10 mA: ¿cuál es su coeficiente de emisión?
    respuestas:
      - nombre: '$V_F$ a 4 mA'
        valor: 0,606 V ±0,003 V
      - nombre: '$V_F$ a 50 µA'
        valor: 0,493 V ±0,003 V
      - nombre: Coeficiente de emisión $n$
        valor: 1,76 ±1%
    pistas:
      - 'En escala logarítmica de corriente la curva es una recta: $V_F = "0,57" + "0,0595" dot log_10 (I / "1 mA")$. La pendiente medida, dividida entre los 59,5 mV por década del diodo ideal, da n.'
      - '$log_10 4 approx "0,602"$ y $log_10 "0,05" approx -"1,301"$; el diodo real sube 105 mV en una década.'
    solucion: |
      A 4 mA, $V_F = "0,57" + "0,0595" dot log_10 4 approx "0,606"$ V; a 50 µA, $V_F = "0,57" + "0,0595" dot log_10 "0,05" approx "0,493"$ V, entre los 0,45 V de 10 µA y los 0,51 V de 100 µA de la tabla.

      El diodo real sube $"0,725" - "0,62" = "0,105"$ V en una década, así que $n = 105 / "59,5" approx "1,76"$, en el entorno de los 1,75 de un 1N4148.

  - n: 4
    seccion: sec-22.4
    enunciado: |
      Un rectificador de media onda se alimenta con un secundario de 12 V eficaces a 50 Hz. Lleva un diodo que cae 0,7 V, un condensador de 2 200 µF y una carga que consume 150 mA.

      Se pide: la tensión de pico en el condensador, el rizado según la fórmula $Delta V = I / (f dot C)$ y el rizado con un puente (onda completa) y el mismo condensador. Además, la forma de la corriente del diodo.
    respuestas:
      - nombre: Tensión de pico
        valor: 16,27 V ±1%
      - nombre: Rizado en media onda
        valor: 1,36 V ±2%
      - nombre: Rizado con el puente
        valor: 0,682 V ±2%
    preguntas:
      - tipo: eleccion
        enunciado: Con el condensador puesto, ¿cómo es la corriente que pasa por el diodo?
        opciones:
          - texto: Pulsos estrechos y altos, uno por ciclo
            correcta: true
          - texto: Una senoide de 150 mA de valor medio
            porque: El diodo solo conduce mientras la tensión del secundario supera la del condensador; el resto del ciclo no pasa nada.
          - texto: Una corriente constante de 150 mA
            porque: Constante es la corriente de la carga, que el condensador sostiene; el diodo la repone toda en un instante breve.
          - texto: Media senoide, como sin condensador
            porque: Sin condensador sí conduciría medio ciclo entero; con él, solo conduce cerca del pico.
        explicacion: 'El diodo solo conduce durante el breve instante en que el secundario supera la tensión del condensador, y en ese instante circula un pulso estrecho y alto: con 150 mA de media, el pico pasa con facilidad de 1 A.'
    pistas:
      - '$V_"pico" = V_"ef" dot sqrt(2)$, menos la caída del diodo. En media onda, $f = 50$ Hz; en onda completa, el rizado tiene 100 Hz.'
      - '$12 dot "1,414" approx "16,97"$ V; $"0,15" / (50 dot "0,0022")$.'
    solucion: |
      $V_"pico" = 12 dot sqrt(2) - "0,7" approx "16,27"$ V. El rizado es $Delta V = "0,15" / (50 dot "2200 µF") approx "1,36"$ V; la fórmula es algo pesimista, porque supone que el condensador se descarga durante el periodo entero. Con el puente el rizado tiene 100 Hz y, con el mismo condensador, se reduce a la mitad: $"0,15" / (100 dot "2200 µF") approx "0,682"$ V.

      La corriente del diodo son pulsos estrechos y altos: solo conduce cuando el secundario supera al condensador, y en ese instante repone toda la carga del ciclo. Diodo y condensador deben soportar ese pico, mucho mayor que la media.

  - n: 5
    seccion: sec-22.5
    enunciado: |
      El filtro de la práctica 5 tiene $R = "1,6 kΩ"$ y $C = "100 nF"$, con la salida en el condensador.

      Se pide: la ganancia en decibelios a 500 Hz y a 4 kHz, y el retraso de fase de la salida respecto a la entrada a 4 kHz.
    respuestas:
      - nombre: Ganancia a 500 Hz
        valor: −0,98 dB ±0,25 dB
      - nombre: Ganancia a 4 kHz
        valor: −12,35 dB ±0,4 dB
      - nombre: Retraso de fase a 4 kHz
        valor: 76 ° ±3 °
    banco:
      practica: 5
      texto: 'En el banco, ponga el generador en senoide a 500 Hz y después a 4 kHz; la ganancia es $20 dot log_10$ del cociente de las Vpp de CH2 y CH1 (PRM), y el retraso, $Delta t dot f dot 360°$ con los cursores de tiempo.'
    pistas:
      - '$f_c = 1 / (2 pi dot R dot C)$; la ganancia es $-10 dot log_10 (1 + (f / f_c)^2)$ y el retraso de fase, $arctan(f / f_c)$.'
      - '$f_c approx 995$ Hz: 500 Hz está casi una octava por debajo del corte y 4 kHz, unas cuatro veces por encima.'
    solucion: |
      $f_c = 1 / (2 pi dot 1600 dot "100 nF") approx 995$ Hz. A 500 Hz, $f / f_c approx "0,503"$ y la ganancia es $-10 dot log_10 (1 + "0,253") approx "−0,98"$ dB. A 4 kHz, $f / f_c approx "4,02"$: $-10 dot log_10 (1 + "16,2") approx "−12,35"$ dB, ya cerca de la asíntota de −20 dB/década.

      El retraso de fase a 4 kHz es $arctan "4,02" approx 76°$: de los 45° del corte camina hacia los 90° de muy por encima.

  - n: 6
    seccion: sec-22.6
    enunciado: |
      El generador da una cuadrada de 1 kHz, y su espectro se mira con la FFT del osciloscopio en escala logarítmica.

      Se pide: la frecuencia de la tercera línea del espectro, el nivel del noveno armónico respecto a la fundamental y, con una triangular de la misma frecuencia, el nivel del quinto armónico. Además, qué forma de onda tiene también armónicos pares.
    respuestas:
      - nombre: Tercera línea del espectro
        valor: 5 kHz ±1%
      - nombre: 9.º armónico de la cuadrada
        valor: −19,1 dB ±1 dB
      - nombre: 5.º armónico de la triangular
        valor: −28 dB ±1,5 dB
    preguntas:
      - tipo: eleccion
        enunciado: ¿Cuál de estas formas de onda tiene también armónicos pares?
        opciones:
          - texto: El diente de sierra
            correcta: true
          - texto: La cuadrada
            porque: Tiene simetría de media onda (la segunda mitad es la primera invertida), y eso impide los armónicos pares.
          - texto: La triangular
            porque: 'También tiene simetría de media onda: solo impares, con amplitud 1/n².'
          - texto: La senoide
            porque: Una senoide pura solo tiene la fundamental; lo que aparezca es distorsión del generador o del osciloscopio.
        explicacion: 'El diente de sierra no tiene simetría de media onda, y por eso contiene todos los armónicos, pares e impares, con amplitud 1/n.'
    banco:
      practica: 6
      texto: 'En el banco, con el generador al CH1, elija la cuadrada (y después la triangular) a 1 kHz y lea los armónicos en la FFT.'
    pistas:
      - 'La cuadrada solo tiene armónicos impares, con amplitud 1/n; la triangular, impares con 1/n². En decibelios, $20 dot log_10 (1 / n)$.'
      - 'Las líneas de la cuadrada están en 1, 3, 5… kHz; $20 dot log_10 (1/9)$ y $20 dot log_10 (1/25)$.'
    solucion: |
      La cuadrada solo tiene armónicos impares: sus líneas están en 1, 3 y 5 kHz, así que la tercera es la de 5 kHz. El noveno armónico tiene $1/9$ de la amplitud de la fundamental: $20 dot log_10 (1/9) approx "−19,1"$ dB. En la triangular las amplitudes caen con $1/n^2$: el quinto está en $20 dot log_10 (1/25) approx -28$ dB, muy cerca del suelo, y por eso hace falta la escala logarítmica.

      El diente de sierra es la que tiene también pares, porque no tiene simetría de media onda.

  - n: 7
    seccion: sec-22.7
    enunciado: |
      Un 555 en astable lleva $R_A = "4,7 kΩ"$, $R_B = "22 kΩ"$ y $C = "470 nF"$, alimentado con 9 V.

      Se pide: los tiempos en alto y en bajo, la frecuencia (con la fórmula de 1,44) y el ciclo de trabajo. Además, qué le ocurre a la frecuencia si la alimentación baja a 5 V.
    respuestas:
      - nombre: '$t_"alto"$'
        valor: 8,70 ms ±2%
      - nombre: '$t_"bajo"$'
        valor: 7,17 ms ±2%
      - nombre: Frecuencia
        valor: 62,9 Hz ±2%
      - nombre: Ciclo de trabajo
        valor: 54,8 % ±0,5 pp
    preguntas:
      - tipo: eleccion
        enunciado: Si la alimentación baja de 9 V a 5 V, ¿qué le ocurre a la frecuencia?
        opciones:
          - texto: Prácticamente no cambia
            correcta: true
          - texto: Baja en proporción a la alimentación
            porque: Los umbrales bajan en la misma proporción que la alimentación, y la exponencial recorre la misma fracción del camino en el mismo tiempo.
          - texto: Sube, porque el condensador tiene menos tensión que alcanzar
            porque: 'Tiene menos tensión que alcanzar, pero también se carga más despacio: los dos efectos se cancelan.'
          - texto: El astable deja de oscilar por debajo de 9 V
            porque: El libro propone precisamente comprobar entre 5 y 12 V que la frecuencia apenas cambia.
        explicacion: 'Los umbrales de 1/3 y 2/3 de la alimentación suben y bajan con ella, y la exponencial es más rápida o más lenta en la misma proporción: los dos efectos se cancelan y la frecuencia no depende de la alimentación.'
    pistas:
      - '$t_"alto" = "0,693" dot (R_A + R_B) dot C$, $t_"bajo" = "0,693" dot R_B dot C$ y $f = "1,44" / ((R_A + 2 R_B) dot C)$; el ciclo de trabajo es $t_"alto" / (t_"alto" + t_"bajo")$.'
      - '$R_A + R_B = "26,7"$ kΩ y $R_A + 2 R_B = "48,7"$ kΩ.'
    solucion: |
      $t_"alto" = "0,693" dot "26,7 kΩ" dot "470 nF" approx "8,70"$ ms y $t_"bajo" = "0,693" dot "22 kΩ" dot "470 nF" approx "7,17"$ ms. La frecuencia es $f = "1,44" / ("48,7 kΩ" dot "470 nF") approx "62,9"$ Hz (el periodo, unos 15,9 ms) y el ciclo de trabajo, $"26,7" / "48,7" approx "54,8" %$: con el astable clásico siempre por encima del 50 %.

      Si la alimentación baja a 5 V, la frecuencia prácticamente no cambia: los umbrales de 1/3 y 2/3 de $V_"CC"$ bajan en la misma proporción.

  - n: 8
    seccion: sec-22.9
    enunciado: |
      El RLC serie de la práctica 9 tiene $L = "10 mH"$, con 20 Ω de resistencia de cobre, $C = "100 nF"$ y $R = "100 Ω"$; el generador que lo alimenta tiene 50 Ω de impedancia de salida.

      Se pide: el factor de calidad contando todas las resistencias, el ancho de banda y, en resonancia, la fracción de la tensión en vacío del generador que cae en R.
    respuestas:
      - nombre: Factor de calidad
        valor: 1,86 ±2%
      - nombre: Ancho de banda
        valor: 2,71 kHz ±2%
      - nombre: '$V_R$ / tensión en vacío del generador'
        valor: 0,588 ±3%
    banco:
      practica: 9
      texto: 'En el banco, levante la curva de resonancia con la tabla de la práctica (frecuencia y Vpp en R) y compare la Vpp en R a 5 033 Hz con la del generador en vacío.'
    pistas:
      - '$f_0 = 1 / (2 pi sqrt(L C))$ y $Z_0 = sqrt(L / C)$; el Q es $Z_0$ entre toda la resistencia en serie: la de la bobina y la del generador también cuentan. En resonancia, L y C se cancelan y solo quedan las resistencias.'
      - '$Z_0 approx 316$ Ω y la resistencia total es $100 + 20 + 50 = 170$ Ω.'
    solucion: |
      $f_0 = 1 / (2 pi sqrt("10 mH" dot "100 nF")) approx 5033$ Hz y $Z_0 = sqrt(L / C) approx 316$ Ω. Con toda la resistencia en serie, $Q = 316 / 170 approx "1,86"$, muy lejos de los 3,16 que da R sola: es la discrepancia que la práctica enseña a explicar. El ancho de banda es $f_0 / Q approx "2,71 kHz"$.

      En resonancia la bobina y el condensador se cancelan, y la tensión del generador se reparte entre las resistencias: en R cae $100 / 170 approx "0,588"$ de la tensión en vacío.

  - n: 9
    seccion: sec-22.11
    enunciado: |
      El 2C53T tiene 50 MHz de ancho de banda.

      Se pide: su tiempo de subida propio, el tiempo de subida que mostrará con un flanco que en realidad dura 5 ns y el ancho de banda del conjunto si, con la sonda en ×1, se miden 70 ns. Además, qué indica que el tiempo de subida medido no cambie al quitar la sonda.
    respuestas:
      - nombre: Tiempo de subida propio
        valor: 7 ns ±2%
      - nombre: Tiempo de subida mostrado
        valor: 8,6 ns ±2%
      - nombre: Ancho de banda con la sonda en ×1
        valor: 5 MHz ±2%
    preguntas:
      - tipo: eleccion
        enunciado: Al quitar la sonda y conectar con un BNC directo, el tiempo de subida medido no cambia. ¿Qué indica?
        opciones:
          - texto: Que se está midiendo el flanco del generador, no el instrumento
            correcta: true
          - texto: Que la sonda está mal compensada
            porque: Una sonda mal compensada se delata por la sobreoscilación o un flanco redondeado que cambia al compensarla, no porque el tiempo no cambie al quitarla.
          - texto: Que el osciloscopio es más lento que la sonda
            porque: 'Si lo fuera, quitar la sonda tampoco cambiaría mucho; pero la práctica dice cuál es la causa cuando no cambia: la fuente de flanco.'
          - texto: Que el latiguillo de masa añade timbre
            porque: El latiguillo produce timbre sobre el flanco, no un tiempo de subida que no depende de la sonda.
        explicacion: 'Si el tiempo de subida no cambia al quitar la sonda, el flanco del generador es más lento que el instrumento: lo que se mide es el generador, y hace falta una fuente de flanco más rápido.'
    pistas:
      - '$t_r = "0,35" / "BW"$, y los tiempos de subida se combinan en cuadratura: $t_"medido" = sqrt(t_"señal"^2 + t_"instrumento"^2)$.'
      - '$"0,35" / "50 MHz" = 7$ ns; $sqrt(25 + 49)$.'
    solucion: |
      $t_r = "0,35" / "50 MHz" = 7$ ns. Un flanco de 5 ns se verá con $sqrt(5^2 + 7^2) approx "8,6"$ ns: más lento de lo que es, porque el instrumento no es mucho más rápido que la señal. Con la sonda en ×1, 70 ns corresponden a $"0,35" / "70 ns" = 5$ MHz: la posición ×1 tiene un ancho de banda de pocos megahercios.

      Si el tiempo medido no cambia al quitar la sonda, lo que se está midiendo es el generador y no el instrumento: hace falta una fuente de flanco más rápido.

  - n: 10
    seccion: sec-22.12
    enunciado: |
      En la pantalla, una portadora de 40 kHz modulada en AM por un tono de 2 kHz tiene una envolvente que va de 1,4 V a 2,6 V.

      Se pide: el índice de modulación, la frecuencia de la banda lateral superior y el ancho de banda ocupado. Además, el ancho de banda que estima la regla de Carson si la misma portadora se modula en FM con una desviación de 6 kHz por el mismo tono.
    respuestas:
      - nombre: Índice de modulación $m$
        valor: 0,3 ±1%
      - nombre: Banda lateral superior
        valor: 42 kHz ±0,5%
      - nombre: Ancho de banda en AM
        valor: 4 kHz ±1%
      - nombre: Ancho de banda en FM (Carson)
        valor: 16 kHz ±1%
    pistas:
      - '$m = (A_"max" - A_"min") / (A_"max" + A_"min")$; las bandas laterales están a la frecuencia de la moduladora a cada lado de la portadora, y la regla de Carson es $B approx 2 dot (Delta f + f_m)$.'
      - '$m = "1,2" / 4$; en AM la señal ocupa el doble de la frecuencia de la moduladora.'
    solucion: |
      $m = ("2,6" - "1,4") / ("2,6" + "1,4") = "0,3"$, es decir, un 30 %. Las bandas laterales están en $40 plus.minus 2$ kHz, la superior en 42 kHz, y la señal ocupa el doble de la moduladora: 4 kHz.

      En FM, la regla de Carson da $B approx 2 dot (6 + 2) = 16$ kHz, cuatro veces más que la AM equivalente: el precio de la inmunidad al ruido.
