# 1.1: new exercises of chapter 35 (printed 34, «Sensores y Acondicionamiento de Señal»), app only until the next
# edition of the book. Format: see cap25.yaml.
parte: cap35
items:
  - n: 1
    seccion: sec-35.1
    enunciado: |
      El presupuesto de incertidumbre de una medida de temperatura tiene estas contribuciones, ya referidas a la entrada: sensor ±0,3 °C, deriva del sensor ±0,2 °C, acondicionamiento ±0,1 °C, referencia ±0,1 °C y convertidor ±0,05 °C.

      Se pide: la incertidumbre combinada, la fracción de la varianza combinada que aporta el sensor (tolerancia y deriva juntas) y la combinada si el convertidor se sustituyera por uno perfecto.
    respuestas:
      - nombre: Incertidumbre combinada
        valor: 0,39 °C ±0,005 °C
      - nombre: Fracción de la varianza del sensor
        valor: 85,2 % ±0,5 pp
      - nombre: Combinada con un convertidor perfecto
        valor: 0,387 °C ±0,003 °C
    pistas:
      - 'Las contribuciones independientes se combinan en cuadratura: $u = sqrt(u_1^2 + u_2^2 + …)$; la varianza es la suma de los cuadrados.'
      - 'La suma de los cuadrados es $"0,09" + "0,04" + "0,01" + "0,01" + "0,0025" = "0,1525"$.'
    solucion: |
      $u = sqrt("0,3"^2 + "0,2"^2 + "0,1"^2 + "0,1"^2 + "0,05"^2) = sqrt("0,1525") approx "0,39"$ °C. El sensor aporta $("0,09" + "0,04") / "0,1525" approx "85,2 %"$ de la varianza.

      Con un convertidor perfecto, $sqrt("0,15") approx "0,387"$ °C: mejorar el convertidor no cambia casi nada, porque el sensor domina. Es la lección del presupuesto: gastar donde está el error.

  - n: 2
    seccion: sec-35.2
    enunciado: |
      Una Pt100 (100 Ω a 0 °C y 0,385 Ω/°C) se excita con 1 mA y está a 25 °C.

      Se pide: su resistencia, la tensión en sus bornes, el error en grados si se conecta a dos hilos con 0,4 Ω por hilo y la potencia de autocalentamiento.
    respuestas:
      - nombre: Resistencia a 25 °C
        valor: 109,6 Ω ±0,1%
      - nombre: Tensión
        valor: 109,6 mV ±0,1%
      - nombre: Error a dos hilos
        valor: 2,08 °C ±1%
      - nombre: Potencia de autocalentamiento
        valor: 110 µW ±1%
    pistas:
      - '$R = 100 + "0,385" dot t$; a dos hilos, la resistencia de los dos hilos se suma al sensor y se lee como temperatura; el autocalentamiento es $I^2 dot R$.'
      - 'El cable suma $2 dot "0,4" = "0,8"$ Ω, y cada 0,385 Ω es un grado.'
    solucion: |
      $R = 100 + "0,385" dot 25 approx "109,6"$ Ω, y con 1 mA, $V = "1 mA" dot "109,6 Ω" approx "109,6"$ mV: la sensibilidad es de 385 µV/°C. A dos hilos el cable añade $2 dot "0,4" = "0,8"$ Ω, que se leen como $"0,8" / "0,385" approx "2,08"$ °C de más; por eso las conexiones a tres y cuatro hilos.

      El autocalentamiento es $I^2 dot R = ("1 mA")^2 dot "109,6 Ω" approx 110$ µW, que en aire quieto puede suponer décimas de grado.

  - n: 3
    seccion: sec-35.2
    enunciado: |
      Un termistor NTC tiene 10 kΩ a 25 °C y B = 3 950, y sigue $R = R_0 dot e^(B dot (1/T - 1/T_0))$ con las temperaturas en kelvin ($T = t + "273,15"$). En el mismo equipo, un termopar de tipo K (41 µV/°C) tiene la unión de medida a 300 °C y la fría a 25 °C.

      Se pide: la resistencia de la NTC a 50 °C, su sensibilidad relativa a 25 °C y la tensión del termopar.
    respuestas:
      - nombre: Resistencia a 50 °C
        valor: 3,59 kΩ ±1%
      - nombre: Sensibilidad relativa a 25 °C
        valor: −4,44 % ±0,1 pp
      - nombre: Tensión del termopar
        valor: 11,3 mV ±1%
    pistas:
      - 'Derivando la exponencial, la sensibilidad relativa es $(d R / d T) / R = -B / T^2$. El termopar mide la diferencia entre sus dos uniones.'
      - '$1/"323,15" - 1/"298,15" approx -"2,595" dot 10^(-4)$ K⁻¹; la diferencia de temperaturas del termopar es de 275 °C.'
    solucion: |
      $R("50 °C") = "10 kΩ" dot e^(3950 dot (1/"323,15" - 1/"298,15")) = "10 kΩ" dot e^(-"1,025") approx "3,59"$ kΩ. Su sensibilidad relativa es $-B / T^2 = -3950 / "298,15"^2 approx -"4,44" %$ por grado: el «en torno a un 4 %» del capítulo, unas diez veces la de un RTD.

      El termopar mide la diferencia entre sus uniones: $"41 µV/°C" dot (300 - 25) approx "11,3"$ mV. Sin compensación de unión fría, esos 11,3 mV se leerían como 275 °C.

  - n: 4
    seccion: sec-35.3
    enunciado: |
      Unas galgas de 120 Ω con factor de galga 2,1 sufren 500 µε, en un puente alimentado con 10 V.

      Se pide: el cambio de resistencia de una galga, la salida con un cuarto de puente y con puente completo, y la ganancia que lleva la salida del puente completo a 2 V. Además, la razón principal para usar cuatro galgas.
    respuestas:
      - nombre: Cambio de resistencia ΔR
        valor: 0,126 Ω ±1%
      - nombre: Salida en cuarto de puente
        valor: 2,62 mV ±1%
      - nombre: Salida en puente completo
        valor: 10,5 mV ±1%
      - nombre: Ganancia necesaria
        valor: 190 ±1%
    preguntas:
      - tipo: eleccion
        enunciado: ¿Cuál es la razón principal para usar cuatro galgas en lugar de una?
        opciones:
          - texto: La compensación térmica
            correcta: true
          - texto: Cuadruplicar la señal
            porque: La señal sí se multiplica por cuatro, pero el capítulo dice que la compensación térmica es más importante que doblar la señal.
          - texto: Reducir el consumo del puente
            porque: 'El consumo no baja: con cuatro galgas de 120 Ω y 10 V el puente consume unos 83 mA.'
          - texto: Poder prescindir del amplificador de instrumentación
            porque: Con 10 mV a fondo de escala sigue haciendo falta una ganancia de cientos de veces.
        explicacion: 'Una galga cambia con la temperatura mucho más que con la deformación medida; si las cuatro ramas son galgas iguales a la misma temperatura, el efecto térmico afecta a todas por igual y el puente sigue equilibrado.'
    pistas:
      - '$Delta R / R = "GF" dot epsilon$. Con una galga activa, la salida es aproximadamente $V dot "GF" dot epsilon / 4$, y con el puente completo, cuatro veces más.'
      - '$"GF" dot epsilon = "2,1" dot 500 dot 10^(-6) = "1,05" dot 10^(-3)$.'
    solucion: |
      $Delta R = 120 dot "2,1" dot 500 dot 10^(-6) approx "0,126"$ Ω, un 0,105 %. El cuarto de puente da $10 dot "1,05" dot 10^(-3) / 4 approx "2,62"$ mV y el puente completo, cuatro veces más: 10,5 mV. Para llevar 10,5 mV a 2 V hace falta una ganancia de $2 / "0,0105" approx 190$, el trabajo de un amplificador de instrumentación.

      La razón principal de las cuatro galgas es la compensación térmica: el efecto de la temperatura, mayor que el de la deformación, afecta a todas por igual y se cancela.

  - n: 5
    seccion: sec-35.5
    enunciado: |
      Una fuente mide su corriente de salida, de hasta 20 A, con un shunt de 5 mΩ.

      Se pide: la caída en el shunt y su disipación a 20 A, el valor del shunt que limita la disipación a 0,5 W y la caída que daría. Además, qué sensor elegir para medir 200 A en continua con aislamiento galvánico.
    respuestas:
      - nombre: Caída a 20 A
        valor: 100 mV ±1%
      - nombre: Disipación a 20 A
        valor: 2 W ±1%
      - nombre: Shunt para 0,5 W
        valor: 1,25 mΩ ±1%
      - nombre: Caída con ese shunt
        valor: 25 mV ±1%
    preguntas:
      - tipo: eleccion
        enunciado: Para medir 200 A en continua con aislamiento galvánico, ¿qué sensor conviene?
        opciones:
          - texto: Uno de efecto Hall
            correcta: true
          - texto: Un shunt
            porque: El shunt no aísla y disipa I²·R, que a 200 A es mucho.
          - texto: Un transformador de corriente
            porque: Aísla, pero solo funciona en alterna, porque necesita variación de flujo.
        explicacion: 'El efecto Hall mide el campo de la corriente sin tocar el circuito: da aislamiento, no disipa nada y funciona en continua. Es la elección cuando hace falta aislamiento o la corriente es grande.'
    pistas:
      - '$V = I dot R$ y $P = I^2 dot R$; para una disipación máxima, $R = P / I^2$.'
      - '$20^2 = 400$ A².'
    solucion: |
      A 20 A, $V = 20 dot "5 mΩ" = 100$ mV y $P = 20^2 dot "5 mΩ" = 2$ W. Para no pasar de 0,5 W, $R = "0,5" / 400 = "1,25"$ mΩ, con una caída de $20 dot "1,25 mΩ" = 25$ mV: menos disipación a cambio de menos señal.

      Para 200 A en continua y con aislamiento, un sensor de efecto Hall: el shunt no aísla y el transformador de corriente solo funciona en alterna.

  - n: 6
    seccion: sec-35.7
    enunciado: |
      Un amplificador diferencial de un operacional y cuatro resistencias, de ganancia unidad, tiene en el peor caso un error de modo común proporcional a la tolerancia de sus resistencias: con el 1 %, 20 mV por voltio de modo común.

      Se pide: el error por voltio de modo común con resistencias del 0,1 %, el CMRR correspondiente y el error que producirían, con resistencias del 1 %, los 48 V de modo común de un shunt en el lado alto.
    respuestas:
      - nombre: Error con el 0,1 %
        valor: 2 mV ±2%
      - nombre: CMRR con el 0,1 %
        valor: 54 dB ±0,3 dB
      - nombre: Error con 48 V y el 1 %
        valor: 0,96 V ±2%
    pistas:
      - 'El error es proporcional a la tolerancia; con ganancia unidad, $"CMRR" = 20 dot log_10 (1 / A_"cm")$, donde $A_"cm"$ es el error por voltio de modo común.'
      - 'Diez veces menos tolerancia, diez veces menos error: 2 mV/V, es decir, $A_"cm" = "0,002"$.'
    solucion: |
      Con el 0,1 %, el error es diez veces menor que con el 1 %: 2 mV por voltio. El CMRR es $20 dot log_10 (1 / "0,002") approx 54$ dB, entre los 34 dB del 1 % y los 74 dB del 0,01 %.

      Con resistencias del 1 % y 48 V de modo común, el error sería de $48 dot "20 mV" = "0,96"$ V, del orden de la propia señal de un shunt: por eso esas medidas se hacen con amplificadores de sensado de corriente específicos.

  - n: 7
    seccion: sec-35.10
    enunciado: |
      Un RTD de 100 Ω, bien acoplado a lo que mide (resistencia térmica de 100 °C/W), se excita con 1 mA, lo que da un error de 0,01 °C. Por otro lado, un puente cuya salida amplificada es la mitad de la excitación se lee con un ADC de 16 bits, con $"código" = V_"señal" / V_"referencia" dot 2^n$.

      Se pide: el error de autocalentamiento del RTD con 5 mA, el error con 1 mA en aire quieto (resistencia térmica diez veces mayor) y el código del ADC con una referencia fija de 5 V si la excitación cae a 4,75 V.
    respuestas:
      - nombre: Error con 5 mA
        valor: 0,25 °C ±1%
      - nombre: Error con 1 mA en aire quieto
        valor: 0,1 °C ±1%
      - nombre: Código con referencia fija
        valor: 31130 ±2
    preguntas:
      - tipo: eleccion
        enunciado: ¿Qué código daría el ADC si su referencia fuera la propia excitación de 4,75 V?
        opciones:
          - texto: 32 768, el mismo que con 5 V
            correcta: true
          - texto: 31 130, como con la referencia fija
            porque: Con referencia fija la caída de la excitación pasa a la lectura; con la referencia igual a la excitación se cancela.
          - texto: 34 493
            porque: Sería dividir por una excitación menor sin que la señal bajara con ella; pero la señal es proporcional a la excitación.
        explicacion: 'Con $V_"referencia" = V_"excitación"$ y la señal proporcional a la excitación, el código es $"0,5" dot 2^16 = 32768$ sea cual sea la excitación: es la medida ratiométrica.'
    pistas:
      - 'El error es la potencia, $I^2 dot R$, por la resistencia térmica. En el ADC, la señal es $"0,5" dot V_"excitación"$.'
      - 'Con 5 mA, $25 dot 10^(-6) dot 100 = "2,5"$ mW; la señal con 4,75 V es de 2,375 V.'
    solucion: |
      Con 5 mA, $P = ("5 mA")^2 dot "100 Ω" = "2,5"$ mW, y el error es $"2,5 mW" dot "100 °C/W" = "0,25"$ °C, veinticinco veces el de 1 mA, porque va con el cuadrado de la corriente. En aire quieto, con 1 mA, $"0,1 mW" dot "1000 °C/W" = "0,1"$ °C.

      Con referencia fija, la señal de $"0,5" dot "4,75" = "2,375"$ V da $"2,375" / 5 dot 65536 approx 31130$, un 5 % por debajo de los 32 768 de 5 V. Con la referencia igual a la excitación el código sigue siendo 32 768: la excitación se cancela.

  - n: 8
    seccion: sec-35.8
    enunciado: |
      Un sensor de temperatura, ya linealizado, se calibra en dos puntos: da 0,10 V en hielo fundente (0,0 °C) y 1,30 V en agua hirviendo. Más tarde lee 0,82 V.

      Se pide: la tensión que daría el sensor a 50 °C, la temperatura que corresponde a 0,82 V y la misma temperatura si la calibración se hubiera hecho a 650 m de altitud, donde el agua hierve unos 0,3 °C más baja por cada 100 m. Además, el orden correcto del procesado.
    respuestas:
      - nombre: Tensión a 50 °C
        valor: 0,7 V ±0,5%
      - nombre: Temperatura a 0,82 V
        valor: 60 °C ±0,1 °C
      - nombre: Temperatura con la calibración a 650 m
        valor: 58,8 °C ±0,1 °C
    preguntas:
      - tipo: orden
        enunciado: Ordene las operaciones del procesado, de la primera a la última.
        elementos:
          - Medir
          - Linealizar
          - Calibrar
          - Filtrar
        explicacion: 'Calibrar antes de linealizar da resultados incorrectos, porque la corrección se aplicaría a un valor que aún no está en unidades físicas: medir, linealizar, calibrar y filtrar.'
    pistas:
      - 'Dos puntos corrigen offset y ganancia: $T = (V - V_0) dot (T_1 - T_0) / (V_1 - V_0)$. A 650 m el segundo punto no es 100 °C.'
      - 'A 650 m el agua hierve a $100 - "0,3" dot "6,5" = "98,05"$ °C.'
    solucion: |
      Entre los dos puntos, el sensor sube $"1,30" - "0,10" = "1,2"$ V en 100 °C, 12 mV por grado: a 50 °C da $"0,10" + 50 dot "0,012" = "0,70"$ V, y 0,82 V corresponden a $("0,82" - "0,10") dot 100 / "1,2" = 60$ °C. Si la calibración se hizo a 650 m, el segundo punto era $100 - "0,3" dot "6,5" = "98,05"$ °C, y la misma lectura vale $"0,72" dot "98,05" / "1,2" approx "58,8"$ °C: suponer 100 °C habría dejado un error de 1,2 °C.

      El orden del procesado es medir, linealizar, calibrar y filtrar.

  - n: 9
    seccion: sec-35.4
    enunciado: |
      Un sistema de medida combina varios sensores y hay que saber cómo se comporta cada uno al encender el equipo, y cuál conviene para el CO₂ de una sala.

      Se pide: clasificar cada sensor de posición como absoluto o incremental y elegir el sensor de CO₂.
    preguntas:
      - tipo: clasificar
        enunciado: ¿Absoluto o incremental?
        categorias:
          - Absoluto
          - Incremental
        elementos:
          - {texto: Potenciómetro, cat: 0}
          - {texto: Encoder óptico de dos señales en cuadratura, cat: 1}
          - {texto: Encoder de disco con código Gray, cat: 0}
          - {texto: LVDT, cat: 0}
        explicacion: 'Absoluto: cada posición tiene un valor único y al encender ya sabe dónde está (potenciómetro, encoder con código Gray, LVDT). El encoder de cuadratura mide cambios y necesita referenciarse cada vez que arranca.'
      - tipo: eleccion
        enunciado: Para medir el CO₂ durante años sin recalibrar, ¿qué sensor conviene?
        opciones:
          - texto: Infrarrojo no dispersivo (NDIR)
            correcta: true
          - texto: De óxido metálico (MOS)
            porque: 'No es selectivo, consume por su calefactor y deriva: necesita calibración periódica.'
          - texto: Electroquímico
            porque: 'Es selectivo y exacto, pero se agota: el reactivo se consume esté o no midiendo.'
          - texto: Catalítico (pellistor)
            porque: Es para gases combustibles, y su catalizador se puede envenenar.
        explicacion: 'El NDIR mide la absorción del gas a una longitud de onda característica: es un fenómeno óptico, así que no se agota ni deriva apreciablemente. Es lo que se usa para el CO₂.'
    pistas:
      - 'Absoluto: cada posición tiene un valor único. Incremental: mide cambios y hay que referenciarlo al encender.'
      - 'De los sensores de gas, solo uno mide un fenómeno óptico.'
    solucion: |
      Son absolutos el potenciómetro, el encoder con código Gray y el LVDT: al encender ya saben dónde están. El encoder óptico de cuadratura es incremental: mide cambios, y hay que referenciarlo en cada arranque.

      Para el CO₂, el NDIR: mide la absorción a una longitud de onda característica, y por eso ni se agota ni deriva apreciablemente, al contrario que los de óxido metálico o los electroquímicos.
