# Lección 1.2 de la sección 43.8 «Simulación Post-Layout» (cap42). Formato: contenido/lecciones11/GUIA.md.
# Las inductancias son las del libro (bloque 224: 10 nH/cm de pista, 1,3 nH una vía de placa de 1,6 mm) y los 20 nH
# del bucle crítico (bloque 239). El condensador de desacoplo de 100 nF con 10 mΩ de resistencia serie, y la fuente de
# 1 GΩ con 1 y 5 pF parásitos, son ejemplos: la sección no da esos valores. Se dibujan con los esquemas rlc-serie y
# filtro-rc (no hay esquema de placa). Sin ecuación propia: la fórmula cita la de la resonancia (cap24#154).
leccion: cap42/sec-42.8

libro:
  220: "Una simulación con el esquema ideal predice el comportamiento del circuito, no de la placa."
  223: "Resistencia de las pistas, que en alimentación de corriente alta produce caídas apreciables."
  224: "unos 10 nH por centímetro de pista"
  225: "Capacidad a los planos y entre pistas, que carga las señales y produce diafonía"
  226: "Acoplamiento mutuo entre pistas paralelas."
  229: "contar centímetros de pista y vías, y añadir las inductancias correspondientes al esquema"
  233: "la inductancia del bucle crítico produce los picos de tensión que la simulación ideal no muestra"
  234: "sin la inductancia de las vías, cualquier condensador parece perfecto hasta gigahercios"
  236: "unos picofaradios parásitos sobre una fuente de gigaohmios cambian la respuesta por completo"
  239: "añadir al esquema 20 nH en el bucle formado por el condensador de entrada, el interruptor y el diodo"
  243: "Acoplamientos por radiación, que exigen simulación electromagnética, no SPICE."
  "cap24#154": 'f_("0") = ("1")/("2" π dot.op sqrt(L dot.op C))'

modelo:
  valores:
    V_p: { sim: "V_{p}", nombre: "amplitud de la prueba", unidad: V, valor: 1 }
    f_r: { sim: "f", nombre: "frecuencia", unidad: Hz, valor: 1000000 }
    R_e: { sim: "ESR", nombre: "resistencia serie del condensador (ejemplo)", unidad: Ω, valor: 0.01 }
    L_v: { sim: "L_{par}", nombre: "inductancia de vías y pistas", unidad: H, valor: 1.3e-9 }
    C_d: { sim: "C", nombre: "condensador de desacoplo (ejemplo)", unidad: F, valor: 100e-9 }
    n_v: { sim: "vías", nombre: "número de vías", unidad: "", valor: 2 }
    l_p: { sim: "pista", nombre: "longitud de pista", unidad: "cm", valor: 2 }
    V_g: { sim: "V_{p}", nombre: "amplitud de la fuente", unidad: V, valor: 1 }
    f_g: { sim: "f", nombre: "frecuencia de la señal", unidad: Hz, valor: 1000 }
    R_g: { sim: "R_{fuente}", nombre: "resistencia de la fuente", unidad: Ω, valor: 1e9 }
    C_g: { sim: "C_{par}", nombre: "capacidad parásita", unidad: F, valor: 1e-15 }
  calculos:
    f_0: { expr: "1/(2*pi*sqrt(L_v*C_d))", sim: "f_{res}", nombre: "autorresonancia", unidad: Hz }
    I_f: { expr: "V_p/sqrt(R_e^2 + (2*pi*f_r*L_v - 1/(2*pi*f_r*C_d))^2)", sim: "I", nombre: "corriente de prueba", unidad: A }
    L_e: { expr: "n_v*1.3e-9 + l_p*10e-9", sim: "L", nombre: "inductancia estimada", unidad: H }
    f_cg: { expr: "1/(2*pi*R_g*C_g)", sim: "f_{c}", nombre: "corte por la capacidad parásita", unidad: Hz }
    x_g: { expr: "2*pi*f_g*R_g*C_g", sim: "ωRC", nombre: "ωRC", unidad: "" }
    A_g: { expr: "V_g/sqrt(1 + x_g^2)", sim: "V_{salida}", nombre: "amplitud que llega", unidad: V }

tarjetas:
  - id: explore-desacoplo
    tipo: explorar
    titulo: "El condensador y sus vías"
    texto: "Un condensador de desacoplo de 100 nF (ejemplo) con la inductancia de su montaje. Cambie la inductancia: por encima de su resonancia, se comporta como una bobina."
    libro: [224, 234]
    fijar: { C_d: 100e-9 }
    widget:
      tipo: circuito
      esquema: rlc-serie
      piezas: { fuente: V_p, f: f_r, r: R_e, l: L_v, c: C_d }
      lectura: { valor: f_0, rotulo: "Autorresonancia" }
      mide: { i_amp: I_f }
      grafica:
        x: { id: nu, min: 100000, max: 1000000000, unidad: Hz, rotulo: "f", escala: log }
        y: { min: 0.001, max: 100, unidad: Ω, rotulo: "|Z|", escala: log }
        curvas:
          - { expr: "sqrt(R_e^2 + (2*pi*nu*L_v - 1/(2*pi*nu*C_d))^2)", color: naranja, rotulo: "|Z| real" }
          - { expr: "1/(2*pi*nu*C_d)", color: tinta, rotulo: "condensador ideal", discontinua: true }
      mandos:
        - { valor: L_v, lista: [1.3e-9, 2.6e-9, 20e-9] }

  - id: prediga-ideal
    tipo: predecir
    titulo: "Sin modelar la vía"
    texto: "Si se simula el desacoplo sin la inductancia de las vías, ¿hasta dónde parece que funciona el condensador?"
    libro: [234]
    widget:
      tipo: circuito
      esquema: rlc-serie
      piezas: { fuente: V_p, f: f_r, r: R_e, l: L_v, c: C_d }
      lectura: { valor: f_0, rotulo: "Autorresonancia" }
      mide: { i_amp: I_f }
      ocultar: true
    opciones:
      - texto: "Parece perfecto hasta gigahercios"
        bien: true
        porque: "La reactancia del condensador ideal baja sin fin. Con la vía, a partir de su resonancia la impedancia vuelve a subir."
      - texto: "Hasta su frecuencia de autorresonancia"
        porque: "Esa es la placa real. Sin la inductancia en el esquema, la simulación no tiene autorresonancia."
      - texto: "Solo en continua"
        porque: "Un condensador ideal desacopla mejor cuanto más sube la frecuencia: ese es el engaño."
    escalera:
      - "¿Qué hace la reactancia de un condensador ideal al subir la frecuencia?"
    solucion: "Hasta gigahercios: el engaño del esquema ideal."

  - id: formula-autorresonancia
    tipo: formula
    titulo: "Dónde deja de ser condensador"
    texto: "La inductancia del montaje resuena con la capacidad. Cambie la inductancia y mire la sustitución."
    libro: ["cap24#154", 234]
    ec: "cap24#154"
    sustitucion: "1 / (2π · √({{L_v}} · {{C_d}})) = {{f_0}}"
    widget:
      tipo: circuito
      esquema: rlc-serie
      piezas: { fuente: V_p, f: f_r, r: R_e, l: L_v, c: C_d }
      lectura: { valor: f_0, rotulo: "Autorresonancia" }
      mide: { i_amp: I_f }
      mandos:
        - { valor: L_v, lista: [1.3e-9, 2.6e-9, 20e-9] }

  - id: estime-l
    tipo: pregunta
    fase: "Estime"
    titulo: "Contar centímetros y vías"
    texto: "La estimación manual: dos vías de placa de 1,6 mm y 2 cm de pista hasta el condensador. Estime la inductancia que añadir al esquema."
    libro: [224, 229]
    estimar:
      objetivo: "L_e"
      unidad: H
      min: 0
      max: 50e-9
      paso: 0.1e-9
      inicio: 5e-9
      tol: 0.05
      rotulo: "Inductancia parásita"
    exito: "2 × 1,3 + 2 × 10 = 22,6 nH: la pista pesa mucho más que las vías."
    pistas:
      - { cuando: { valor: estimacion, mayor: 23.7e-9 }, texto: "Demasiado: unos 10 nH por centímetro y 1,3 nH por vía." }
      - { texto: "Poco: cada centímetro de pista son unos 10 nH." }
    escalera:
      - "Pista: 10 nH/cm. Vía: 1,3 nH."
    solucion: "22,6 nH."
    comprobar:
      - { L_e: 22.6e-9 }

  - id: parasitos
    tipo: pregunta
    fase: "Empareje"
    titulo: "Qué parásitos importan"
    texto: "Una cada parásito de la placa con su efecto."
    libro: [223, 224, 225, 226]
    emparejar:
      - ["Resistencia de las pistas", "Caídas en alimentación de corriente alta"]
      - ["Inductancia", "La dominante en conmutación"]
      - ["Capacidad a planos y entre pistas", "Carga las señales y produce diafonía"]
      - ["Acoplamiento mutuo", "Entre pistas paralelas"]
    exito: "La estimación manual de los pocos críticos da casi todo el beneficio."
    pistas:
      - { texto: "En una fuente conmutada manda la inductancia." }
    escalera:
      - "¿Cuál depende de la corriente que circula en continua?"
    solucion: "Resistencia: caídas; inductancia: conmutación; capacidad: diafonía; mutuo: pistas paralelas."

  - id: alta-impedancia
    tipo: sorpresa
    titulo: "Unos picofaradios sobre gigaohmios"
    texto: "Una señal de 1 kHz desde una fuente de 1 GΩ (ejemplo). Añada capacidad parásita: con 1 pF el corte cae a 159 Hz y la señal casi desaparece."
    libro: [236]
    inicio: { C_g: 1e-15 }
    widget:
      tipo: circuito
      esquema: filtro-rc
      piezas: { fuente: V_g, f: f_g, r: R_g, c: C_g }
      lectura: { valor: A_g, rotulo: "Amplitud que llega" }
      datos:
        - { valor: f_cg, rotulo: "Corte: {{f_cg}}" }
      mide: { vc_amp: A_g }
      mandos:
        - { valor: C_g, lista: [1e-15, 1e-12, 5e-12], rotulo: "Capacidad parásita" }
    comprobar:
      - { con: { C_g: 1e-12 }, f_cg: 159 }

  - id: por-que-limpio
    tipo: porque
    titulo: "¿Por qué salen formas limpias?"
    texto: "La simulación ideal de un convertidor reductor da formas de onda limpias; la placa, picos y timbre. ¿Qué le falta al esquema?"
    libro: [233, 239]
    fijar: { L_v: 20e-9 }
    widget:
      tipo: circuito
      esquema: rlc-serie
      piezas: { fuente: V_p, f: f_r, r: R_e, l: L_v, c: C_d }
      lectura: { valor: f_0, rotulo: "Resonancia con 20 nH" }
      mide: { i_amp: I_f }
    opciones:
      - texto: "La inductancia del bucle crítico: con 20 nH aparecen los picos y el timbre"
        bien: true
        porque: "Con ella se puede evaluar un snubber antes de montar nada: la decisión que la simulación debe ayudar a tomar."
      - texto: "Un paso de tiempo más fino"
        porque: "El paso afina lo que hay en el netlist; los 20 nH no están en él."
      - texto: "Un modelo de transistor mejor"
        porque: "Ayuda, pero los picos vienen de la inductancia del bucle, que no está en el esquema."
    escalera:
      - "¿Qué elemento de la placa, que no está en el esquema, se opone a los cambios bruscos de corriente?"
    solucion: "Los 20 nH del bucle crítico."

  - id: sin-modelar
    tipo: pregunta
    titulo: "Lo que sigue sin modelarse"
    texto: "Incluso con todos los parásitos extraídos, ¿qué sigue fuera del alcance de SPICE?"
    libro: [243]
    widget:
      tipo: circuito
      esquema: rlc-serie
      piezas: { fuente: V_p, f: f_r, r: R_e, l: L_v, c: C_d }
      mide: { i_amp: I_f }
    opciones:
      - texto: "Los acoplamientos por radiación"
        bien: true
        porque: "Exigen simulación electromagnética. Tampoco ve los efectos térmicos en régimen, salvo con cosimulación."
      - texto: "La inductancia de las vías"
        porque: "Esa sí: se añade al netlist como cualquier bobina."
      - texto: "La capacidad entre pistas"
        porque: "También se extrae y se añade."
    escalera:
      - "¿Cuál no es un elemento de circuito sino un campo?"
    solucion: "La radiación."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [220, 224, 229, 236]
    ideas:
      - { titulo: "La placa, no el esquema.", texto: "Post-layout: el netlist con los parásitos del trazado." }
      - { titulo: "Las cifras.", texto: "Unos 10 nH por centímetro de pista y 1,3 nH por vía." }
      - { titulo: "Donde cambia.", texto: "Conmutación, desacoplo, circuitos rápidos, alta impedancia y RF." }
      - { titulo: "A mano.", texto: "Contar centímetros y vías da casi todo el beneficio en proyectos pequeños." }
