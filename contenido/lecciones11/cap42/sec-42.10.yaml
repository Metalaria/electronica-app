# Lección 1.2 de la sección 43.10 «Herramientas Adicionales y Resumen» (cap42). Formato: GUIA.md.
# Repaso del capítulo con el netlist del libro (cap42#103: 1 kΩ y 100 nF). La sección no tiene ecuaciones: sin
# tarjeta «fórmula».
leccion: cap42/sec-42.10

libro:
  284: "algunos de ellos ofrecidos por fabricantes de semiconductores con sus modelos incluidos"
  287: "lo que diferencia es el entorno y la biblioteca de modelos"
  289: "Es la fuente preferente."
  290: "para componentes genéricos"
  291: "Construidos a mano a partir de la hoja de datos, cuando no hay modelo."
  292: "Un modelo de un operacional puede reproducir su respuesta en frecuencia y no su comportamiento en saturación."
  294: "La simulación no valida un diseño"
  295: "La calidad la determinan los modelos, no el simulador."
  296: "Si la amplitud importa, transitorio"
  297: "Los parásitos deciden en conmutación y en alta frecuencia"
  299: "Monte Carlo dice si el diseño es fabricable; el barrido paramétrico, dónde gastar en precisión"
  301: "Punto de trabajo primero"
  302: "coincidir da confianza en ambas; discrepar señala lo que no se entendía"
  305: "tener la simulación original permite evaluar el cambio en minutos en lugar de rehacerla entera"
  "cap42#103": "R1 in out 1k"

modelo:
  valores:
    V_p: { sim: "V1", nombre: "fuente AC 1", unidad: V, valor: 1 }
    f_f: { sim: "f", nombre: "frecuencia", unidad: Hz, valor: 1591.55 }
    R_f: { sim: "R1", nombre: "resistencia", unidad: Ω, valor: 1000 }
    C_f: { sim: "C1", nombre: "capacidad", unidad: F, valor: 100e-9 }
  calculos:
    f_c: { expr: "1/(2*pi*R_f*C_f)", sim: "f_{c}", nombre: "frecuencia de corte", unidad: Hz }
    x_c: { expr: "2*pi*f_f*R_f*C_f", sim: "ωRC", nombre: "ωRC", unidad: "" }
    A_c: { expr: "V_p/sqrt(1 + x_c^2)", sim: "v(out)", nombre: "amplitud de la salida", unidad: V }

tarjetas:
  - id: explore-cierre
    tipo: explorar
    titulo: "Un netlist, todo el capítulo"
    texto: "El RC del netlist del libro, guardado con su nota: se puede volver a simular años después. Cambie C1 y mire la respuesta."
    libro: ["cap42#103", 305]
    widget:
      tipo: circuito
      esquema: filtro-rc
      piezas: { fuente: V_p, f: f_f, r: R_f, c: C_f }
      lectura: { valor: f_c, rotulo: "Corte" }
      mide: { vc_amp: A_c }
      grafica:
        x: { id: nu, min: 10, max: 1000000, unidad: Hz, rotulo: "f", escala: log }
        y: { min: 0, max: 1.1, unidad: V, rotulo: "v(out)" }
        curvas:
          - { expr: "V_p/sqrt(1 + (2*pi*nu*R_f*C_f)^2)", color: naranja, rotulo: "v(out)", mide: vc_amp }
      mandos:
        - { valor: C_f, lista: [47e-9, 100e-9, 220e-9], rotulo: "C1" }

  - id: prediga-simuladores
    tipo: predecir
    titulo: "Libre, comercial o en el navegador"
    texto: "Tres simuladores dan resultados distintos para el mismo componente. ¿Qué los diferencia de verdad?"
    libro: [284, 287]
    widget:
      tipo: circuito
      esquema: filtro-rc
      piezas: { fuente: V_p, f: f_f, r: R_f, c: C_f }
      lectura: { valor: A_c, rotulo: "v(out)" }
      mide: { vc_amp: A_c }
      ocultar: true
    opciones:
      - texto: "El entorno y la biblioteca de modelos"
        bien: true
        porque: "El motor de cálculo es esencialmente el mismo, el de Berkeley."
      - texto: "El motor de cálculo"
        porque: "Todos parten de la misma formulación: lo que cambia es lo que le rodea."
      - texto: "Que los libres son menos exactos"
        porque: "Los libres son perfectamente capaces para casi todo lo del libro."
    escalera:
      - "Si el motor es común, ¿qué queda?"
    solucion: "Entorno y modelos."

  - id: flujo
    tipo: pregunta
    fase: "Ordene"
    titulo: "El flujo recomendado"
    texto: "Ordene los pasos de una simulación seria, de lo primero a lo último."
    libro: [301]
    ordenar:
      - "Punto de trabajo primero"
      - "AC para estabilidad y respuesta"
      - "Transitorio para el comportamiento real"
      - "Monte Carlo antes de fabricar"
      - "Post-layout si hay conmutación o alta frecuencia"
      - "Comparar con la medida del prototipo"
    exito: "El último paso cierra el ciclo y enseña a fiarse."
    pistas:
      - { texto: "Si el punto de trabajo no resuelve, nada más funcionará." }
    escalera:
      - "Lo último necesita el prototipo ya montado."
    solucion: "OP, AC, transitorio, Monte Carlo, post-layout, medida."

  - id: retener
    tipo: pregunta
    fase: "Empareje"
    titulo: "Lo que hay que retener"
    texto: "Una cada idea del capítulo con su conclusión."
    libro: [294, 295, 296, 297, 299]
    emparejar:
      - ["La simulación", "Predice un modelo; no valida el diseño"]
      - ["La calidad del resultado", "La deciden los modelos"]
      - ["Si la amplitud importa", "Transitorio"]
      - ["Conmutación y alta frecuencia", "Deciden los parásitos"]
      - ["Monte Carlo", "Si el diseño es fabricable"]
      - ["Barrido paramétrico", "Dónde gastar en precisión"]
    exito: "Seis frases que resumen el capítulo."
    pistas:
      - { texto: "El AC no ve la amplitud." }
    escalera:
      - "Monte Carlo y el barrido responden a preguntas distintas."
    solucion: "Modelo; modelos; transitorio; parásitos; fabricable; precisión."

  - id: fuentes-modelos
    tipo: pregunta
    fase: "Empareje"
    titulo: "De dónde salen los modelos"
    texto: "Una cada fuente de modelos con cuándo se usa."
    libro: [289, 290, 291]
    emparejar:
      - ["El fabricante", "La fuente preferente"]
      - ["La biblioteca del simulador", "Componentes genéricos"]
      - ["Hecho a mano", "Desde la hoja de datos, cuando no hay otro"]
    exito: "Un modelo describe lo que su autor quiso describir."
    pistas:
      - { texto: "Hacerlo a mano es más trabajo y a veces la única opción." }
    escalera:
      - "¿Quién conoce mejor un componente concreto?"
    solucion: "Fabricante: preferente; biblioteca: genéricos; a mano: si no hay otro."

  - id: operacional
    tipo: pregunta
    titulo: "Lo que su autor quiso describir"
    texto: "Un modelo de operacional reproduce muy bien su respuesta en frecuencia. ¿Qué no garantiza?"
    libro: [292]
    widget:
      tipo: circuito
      esquema: filtro-rc
      piezas: { fuente: V_p, f: f_f, r: R_f, c: C_f }
      mide: { vc_amp: A_c }
    opciones:
      - texto: "Su comportamiento en saturación"
        bien: true
        porque: "Un modelo describe lo que su autor quiso describir: puede acertar en frecuencia y no en recorte."
      - texto: "Su ganancia a baja frecuencia"
        porque: "Eso es parte de la respuesta en frecuencia, que sí reproduce."
      - texto: "Su fase"
        porque: "La fase va con la respuesta en frecuencia."
    escalera:
      - "¿Qué queda fuera de la pequeña señal?"
    solucion: "La saturación."

  - id: por-que-medir
    tipo: porque
    titulo: "¿Por qué terminar midiendo?"
    texto: "El flujo acaba comparando con la medida del prototipo. ¿Por qué ese paso es el que enseña a fiarse?"
    libro: [302]
    widget:
      tipo: circuito
      esquema: filtro-rc
      piezas: { fuente: V_p, f: f_f, r: R_f, c: C_f }
      lectura: { valor: A_c, rotulo: "v(out) simulada" }
      mide: { vc_amp: A_c }
    opciones:
      - texto: "Coincidir da confianza en ambas; discrepar señala lo que no se entendía"
        bien: true
        porque: "Es el paso que cierra el ciclo entre la hipótesis y el experimento."
      - texto: "Porque la medida siempre es exacta"
        porque: "También tiene sus errores: lo que enseña es la comparación."
      - texto: "Porque así se ajusta la simulación hasta que coincida"
        porque: "Ajustar a ciegas tira la información: hay que averiguar qué faltaba."
    escalera:
      - "¿Qué aprende de cada resultado: coincidir y discrepar?"
    solucion: "Coincidir da confianza; discrepar, información."

  - id: guardar
    tipo: pregunta
    titulo: "El hábito que hace útil la simulación"
    texto: "Un año después hay que modificar el circuito. ¿Qué ahorra haber guardado la simulación junto al proyecto?"
    libro: [305]
    widget:
      tipo: circuito
      esquema: filtro-rc
      piezas: { fuente: V_p, f: f_f, r: R_f, c: C_f }
      mide: { vc_amp: A_c }
    opciones:
      - texto: "Evaluar el cambio en minutos en lugar de rehacerla entera"
        bien: true
        porque: "Con los ficheros, los modelos y una nota de qué se quería comprobar."
      - texto: "Nada: hay que rehacerla de todas formas"
        porque: "Con el netlist guardado basta cambiar lo que cambia."
      - texto: "No tener que medir el prototipo"
        porque: "La medida sigue siendo la que confirma."
    escalera:
      - "¿Qué cuesta más: cambiar una línea o rehacer el modelo entero?"
    solucion: "Minutos en lugar de rehacerla."

  - id: resumen
    tipo: resumen
    titulo: "Capítulo repasado"
    libro: [287, 294, 296, 301, 302]
    ideas:
      - { titulo: "El motor.", texto: "Es el mismo: lo que cambia es el entorno y los modelos." }
      - { titulo: "El flujo.", texto: "Punto de trabajo, AC, transitorio, Monte Carlo, post-layout y medida." }
      - { titulo: "Las reglas.", texto: "Predice un modelo; si la amplitud importa, transitorio; desconfíe de lo demasiado bueno." }
      - { titulo: "El ciclo.", texto: "Coincidir da confianza; discrepar enseña." }
