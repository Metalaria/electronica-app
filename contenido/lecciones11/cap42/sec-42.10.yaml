# Lección 1.2 de la sección 43.10 «Herramientas Adicionales y Resumen» (cap42). Formato: GUIA.md.
# Repaso del capítulo con el netlist del libro (cap42#103: 1 kΩ y 100 nF). La sección no tiene ecuaciones: sin
# tarjeta «fórmula».
# 1.2.1 (autor121-pot, «aprender haciendo», GUIA §13): repaso haciendo con el netlist del libro: el corte se lleva a
# 3,4 kHz con C1 (objetivo; guardar la simulación, en su «logrado»); el .ac en el corte se predice y se simula; el
# corte se marca en la curva; el de 220 nF y la τ del transitorio se escriben. Quedan dos preguntas de opciones (qué
# diferencia a los simuladores y por qué terminar midiendo); el flujo ordenado, lo que hay que retener, las fuentes de
# modelos y el operacional que no satura pasan al resumen.
leccion: cap42/sec-42.10

libro:
  284: "algunos de ellos ofrecidos por fabricantes de semiconductores con sus modelos incluidos"
  287: "lo que diferencia es el entorno y la biblioteca de modelos"
  289: "Es la fuente preferente."
  290: "para componentes genéricos"
  291: "Construidos a mano a partir de la hoja de datos, cuando no hay modelo."
  292: "Un modelo de un operacional puede reproducir su respuesta en frecuencia y no su comportamiento en saturación."
  294: "La simulación no valida un diseño"
  295: "La calidad la determinan los modelos, no el simulador."
  296: "Si la amplitud importa, transitorio"
  297: "Los parásitos deciden en conmutación y en alta frecuencia"
  299: "Monte Carlo dice si el diseño es fabricable; el barrido paramétrico, dónde gastar en precisión"
  301: "Punto de trabajo primero"
  302: "coincidir da confianza en ambas; discrepar señala lo que no se entendía"
  305: "tener la simulación original permite evaluar el cambio en minutos en lugar de rehacerla entera"
  "cap42#103": "R1 in out 1k"
  "cap22#134": 'f_("c") = ("1")/("2" π dot.op R dot.op C)'

modelo:
  valores:
    V_p: { sim: "V1", nombre: "fuente AC 1", unidad: V, valor: 1 }
    f_f: { sim: "f", nombre: "frecuencia", unidad: Hz, valor: 1591.55 }
    R_f: { sim: "R1", nombre: "resistencia", unidad: Ω, valor: 1000 }
    C_f: { sim: "C1", nombre: "capacidad", unidad: F, valor: 100e-9 }
  calculos:
    f_c: { expr: "1/(2*pi*R_f*C_f)", sim: "f_{c}", nombre: "frecuencia de corte", unidad: Hz }
    x_c: { expr: "2*pi*f_f*R_f*C_f", sim: "ωRC", nombre: "ωRC", unidad: "" }
    p63: { expr: "100*(1 - exp(-1))", sim: "1 − e⁻¹", nombre: "fracción a una τ", unidad: "%" }
    dB3: { expr: "20*log10(0.7071)", sim: "−3 dB", nombre: "caída en el corte", unidad: dB }
    kC: { expr: "C_f/100e-9", sim: "C1/100 nF", nombre: "capacidad relativa", unidad: "" }
    tau: { expr: "R_f*C_f", sim: "τ", nombre: "constante de tiempo", unidad: s }
    A_c: { expr: "V_p/sqrt(1 + x_c^2)", sim: "v(out)", nombre: "amplitud de la salida", unidad: V }

tarjetas:
  - id: explore-cierre
    tipo: explorar
    titulo: "Un netlist, todo el capítulo"
    texto: "El RC del netlist del libro, guardado con su nota. Cambie una línea, la de C1, hasta llevar el corte a unos 3,4 kHz."
    libro: ["cap42#103", "cap22#134", 305]
    inicio: { C_f: 100e-9 }
    widget:
      tipo: circuito
      esquema: filtro-rc
      piezas: { fuente: V_p, f: f_f, r: R_f, c: C_f }
      lectura: { valor: f_c, rotulo: "Corte" }
      mide: { vc_amp: A_c }
      grafica:
        x: { id: nu, min: 10, max: 1000000, unidad: Hz, rotulo: "f", escala: log }
        y: { min: 0, max: 1.1, unidad: V, rotulo: "v(out)" }
        curvas:
          - { expr: "V_p/sqrt(1 + (2*pi*nu*R_f*C_f)^2)", color: naranja, rotulo: "v(out)", mide: vc_amp }
      mandos:
        - { valor: C_f, lista: [47e-9, 100e-9, 220e-9], rotulo: "C1" }
    objetivo:
      condiciones:
        - { valor: f_c, min: 3300, max: 3500, rotulo: "Corte: {{f_c}}" }
      logrado: "Con «C1 out 0 47n», {{f_c}}. Tener la simulación guardada permite evaluar un cambio en minutos en lugar de rehacerla entera."
      pistas:
        - { texto: "Para subir el corte, menos capacidad." }
    escalera:
      - "f_{c} = 1/(2π · R1 · C1)."
    solucion: "47 nF: 3,39 kHz."
    comprobar:
      - { con: { C_f: 47e-9 }, f_c: 3386 }

  - id: simule-ac
    tipo: simular
    titulo: "El .ac, una vez más"
    texto: "Con 1 kΩ, 100 nF y «AC 1», prediga la amplitud de v(out) a 1,59 kHz y compare con el simulador."
    libro: ["cap42#103", 296]
    fijar: { R_f: 1000, C_f: 100e-9, f_f: 1591.55 }
    widget:
      tipo: circuito
      esquema: filtro-rc
      piezas: { fuente: V_p, f: f_f, r: R_f, c: C_f }
      lectura: { valor: A_c, rotulo: "v(out)" }
      mide: { vc_amp: A_c }
      ocultar: true
      mandos: []
    simular:
      objetivo: A_c
      unidad: V
      tol: 0.02
      rotulo: "Amplitud de v(out)"
      medida: vc_amp
      errores:
        - { expr: "V_p/2", texto: "La mitad es la potencia. En amplitud, 1/√2." }
    exito: "0,707 V en el corte: pequeña señal. Si importara la amplitud, transitorio."
    escalera:
      - "Ese es el corte: ωRC = 1."
    solucion: "0,707 V."
    comprobar:
      - { A_c: 0.707, f_c: 1591.5 }

  - id: marque-corte
    tipo: marcar
    titulo: "El corte en la curva"
    texto: "Marque en la curva del .ac el corte del RC de 1 kΩ y 100 nF."
    libro: ["cap42#103", "cap22#134"]
    fijar: { R_f: 1000, C_f: 100e-9 }
    widget:
      tipo: grafica
      x: { id: nu, min: 10, max: 1000000, unidad: Hz, rotulo: "f", escala: log }
      y: { min: 0, max: 1.1, unidad: V, rotulo: "v(out)" }
      curvas:
        - { expr: "V_p/sqrt(1 + (2*pi*nu*R_f*C_f)^2)", color: naranja, rotulo: "v(out)" }
        - { expr: "V_p*0.7071", color: tinta, rotulo: "−3 dB", discontinua: true }
      mandos: []
    marcar:
      modo: x
      curva: 0
      x: "f_c"
      tol: 0.015
      inicio: { x: 50, y: 0 }
      rotulo: "El corte"
    pistas:
      - { cuando: { valor: marca_x, mayor: 1592 }, texto: "Más a la izquierda: ahí ya ha caído más de 3 dB." }
      - { texto: "Más a la derecha: ahí todavía pasa casi todo." }
    exito: "1,59 kHz, donde la curva cruza los −3 dB."
    escalera:
      - "Busque donde la curva naranja cruza la línea de trazos."
    solucion: "En 1,59 kHz."
    comprobar:
      - { f_c: 1591.5, dB3: -3, tol: 0.005 }

  - id: corte-220
    tipo: leer
    titulo: "Otra línea"
    texto: "Se cambia la línea a «C1 out 0 220n». Escriba el nuevo corte."
    libro: ["cap42#103", "cap22#134"]
    fijar: { R_f: 1000, C_f: 220e-9 }
    widget:
      tipo: circuito
      esquema: filtro-rc
      piezas: { fuente: V_p, f: f_f, r: R_f, c: C_f }
      mide: { vc_amp: A_c }
      grafica:
        x: { id: nu, min: 10, max: 1000000, unidad: Hz, rotulo: "f", escala: log }
        y: { min: 0, max: 1.1, unidad: V, rotulo: "v(out)" }
        curvas:
          - { expr: "V_p/sqrt(1 + (2*pi*nu*R_f*C_f)^2)", color: naranja, rotulo: "v(out)", mide: vc_amp }
      mandos: []
    leer:
      objetivo: f_c
      unidad: Hz
      tol: 0.02
      rotulo: "Corte"
      errores:
        - { expr: "2*pi*f_c", texto: "Eso es en rad/s. El corte en hercios es 1/(2πRC)." }
    exito: "723 Hz: 2,2 veces más capacidad, 2,2 veces menos corte."
    escalera:
      - "f_{c} = 1/(2π · 1 kΩ · 220 nF)."
    solucion: "723 Hz."
    comprobar:
      - { f_c: 723.4, kC: 2.2 }

  - id: tau-tran
    tipo: leer
    titulo: "Y en el tiempo"
    texto: "El mismo RC de 100 nF ante un escalón, en un .tran. Lea en la curva la constante de tiempo y escríbala."
    libro: [296]
    fijar: { R_f: 1000, C_f: 100e-9 }
    widget:
      tipo: circuito
      esquema: carga-rc
      piezas: { fuente: V_p, r: R_f, c: C_f }
      grafica:
        x: { id: t, min: 0, max: 0.001, unidad: s, rotulo: "t" }
        y: { min: 0, max: 1.1, unidad: V, rotulo: "v(out)" }
        curvas:
          - { expr: "V_p*(1 - exp(-t/tau))", color: naranja, rotulo: "v(out)", mide: vc }
      mandos: []
    leer:
      objetivo: tau
      unidad: s
      tol: 0.05
      rotulo: "Constante de tiempo"
      errores:
        - { expr: "5*tau", texto: "Eso son cinco τ, cuando ya casi ha llegado. τ es donde va por el 63 %." }
    exito: "0,1 ms = R1·C1: el transitorio da la misma información que el .ac, vista en el tiempo."
    escalera:
      - "Busque dónde la curva pasa por el 63 % de su valor final."
    solucion: "0,1 ms."
    comprobar:
      - { tau: 0.0001, p63: 63.2 }
      - { p63: 63, tol: 0.01 }

  - id: prediga-simuladores
    tipo: pregunta
    titulo: "Libre, comercial o en el navegador"
    texto: "Tres simuladores dan resultados distintos para el mismo componente. ¿Qué los diferencia de verdad?"
    libro: [284, 287]
    widget:
      tipo: circuito
      esquema: filtro-rc
      piezas: { fuente: V_p, f: f_f, r: R_f, c: C_f }
      lectura: { valor: A_c, rotulo: "v(out)" }
      mide: { vc_amp: A_c }
      mandos: []
    opciones:
      - texto: "El entorno y la biblioteca de modelos"
        bien: true
        porque: "El motor de cálculo es esencialmente el mismo, el de Berkeley."
      - texto: "El motor de cálculo"
        porque: "Todos parten de la misma formulación: lo que cambia es lo que le rodea."
      - texto: "Que los libres son menos exactos"
        porque: "Los libres son perfectamente capaces para casi todo lo del libro."
    escalera:
      - "Si el motor es común, ¿qué queda?"
    solucion: "Entorno y modelos."

  - id: por-que-medir
    tipo: porque
    titulo: "¿Por qué terminar midiendo?"
    texto: "El flujo acaba comparando con la medida del prototipo. ¿Por qué ese paso es el que enseña a fiarse?"
    libro: [302]
    widget:
      tipo: circuito
      esquema: filtro-rc
      piezas: { fuente: V_p, f: f_f, r: R_f, c: C_f }
      lectura: { valor: A_c, rotulo: "v(out) simulada" }
      mide: { vc_amp: A_c }
      mandos: []
    opciones:
      - texto: "Coincidir da confianza en ambas; discrepar señala lo que no se entendía"
        bien: true
        porque: "Es el paso que cierra el ciclo entre la hipótesis y el experimento."
      - texto: "Porque la medida siempre es exacta"
        porque: "También tiene sus errores: lo que enseña es la comparación."
      - texto: "Porque así se ajusta la simulación hasta que coincida"
        porque: "Ajustar a ciegas tira la información: hay que averiguar qué faltaba."
    escalera:
      - "¿Qué aprende de cada resultado: coincidir y discrepar?"
    solucion: "Coincidir da confianza; discrepar, información."

  - id: resumen
    tipo: resumen
    titulo: "Capítulo repasado"
    libro: [287, 289, 290, 291, 292, 294, 295, 296, 297, 299, 301, 302]
    ideas:
      - { titulo: "Los modelos.", texto: "Del fabricante, de la biblioteca o a mano; deciden la calidad, y cada uno describe lo que su autor quiso." }
      - { titulo: "El flujo.", texto: "Punto de trabajo, AC, transitorio, Monte Carlo, post-layout y medida." }
      - { titulo: "Las reglas.", texto: "Predice un modelo; si la amplitud importa, transitorio; en conmutación deciden los parásitos." }
      - { titulo: "El ciclo.", texto: "Monte Carlo dice si es fabricable; el barrido, dónde gastar. Coincidir da confianza; discrepar enseña." }
