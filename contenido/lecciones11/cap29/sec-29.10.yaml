# Lección 1.2 de la sección 28.10 «Del Bit al Microcontrolador» (cap29; etiqueta interna sec-29.10). Formato: contenido/lecciones11/GUIA.md (§11).
leccion: cap29/sec-29.10

libro:
  304: "Con esas piezas, y nada más, se construye un procesador"
  306: "La ALU: lógica combinacional (sección 28.3) que suma, resta, compara y opera bit a bit"
  307: "Los registros: n biestables en paralelo"
  308: "El contador de programa: un contador (sección 28.7) que apunta a la instrucción siguiente"
  309: "instrucciones y datos, en un mismo espacio o en dos"
  310: "La unidad de control: una máquina de estados"
  311: "El reloj, que marca el ritmo de todo"
  314: "Buscar: el contador de programa entrega la dirección, la memoria devuelve la instrucción."
  315: "la frecuencia máxima del procesador la fije el camino combinacional más largo entre dos registros (sección 28.8): normalmente, la ALU"
  318: "temporizadores, que son contadores (sección 39.5); puertos serie, que son registros de desplazamiento"
  319: "escribir en un registro de configuración es cargar un biestable"
  322: "comprobando exactamente lo que este capítulo ha descrito —alimentación, reloj, reset—"
  323: "saber que una multiplicación es un circuito y una división es un bucle"
  328: "Diagrama de bloques de un procesador con las piezas del capítulo"

modelo:
  valores: {}
  calculos: {}

tarjetas:
  - id: explore-procesador
    tipo: explorar
    titulo: "Un procesador por dentro"
    texto: "Toque cada bloque y lea de qué pieza del capítulo está hecho."
    libro: [304, 306, 307, 308, 309, 310, 328]
    widget:
      tipo: figura
      figura: fig-29.15
      zonas:
        - { id: pc, rotulo: "Arriba a la izquierda", rect: [8, 30, 102, 51], texto: "Contador de programa: un contador que apunta a la instrucción siguiente, o se carga en un salto." }
        - { id: memoria, rotulo: "Arriba en el centro", rect: [152, 30, 110, 51], texto: "Memoria: instrucciones y datos." }
        - { id: control, rotulo: "Arriba a la derecha", rect: [310, 30, 124, 51], texto: "Unidad de control: una máquina de estados que genera las señales en orden." }
        - { id: registros, rotulo: "Abajo en el centro", rect: [152, 138, 110, 52], texto: "Registros: biestables en paralelo con los operandos y el resultado." }
        - { id: alu, rotulo: "Abajo a la derecha", rect: [310, 130, 74, 67], texto: "ALU: lógica combinacional que suma, resta, compara y opera bit a bit." }
        - { id: reloj, rotulo: "Abajo a la izquierda", rect: [5, 234, 70, 38], texto: "Reloj: marca el ritmo de todo." }
    requiere: { mover: [alu, control] }

  - id: toque-frecuencia
    tipo: tocar
    titulo: "Quién limita la velocidad"
    texto: "Toque el bloque que, normalmente, fija la frecuencia máxima del procesador."
    libro: [311, 315]
    widget:
      tipo: figura
      figura: fig-29.15
      zonas:
        - { id: pc, rotulo: "Arriba a la izquierda", rect: [8, 30, 102, 51] }
        - { id: memoria, rotulo: "Arriba en el centro", rect: [152, 30, 110, 51] }
        - { id: control, rotulo: "Arriba a la derecha", rect: [310, 30, 124, 51] }
        - { id: registros, rotulo: "Abajo en el centro", rect: [152, 138, 110, 52] }
        - { id: alu, rotulo: "Abajo a la derecha", rect: [310, 130, 74, 67] }
        - { id: reloj, rotulo: "Abajo a la izquierda", rect: [5, 234, 70, 38] }
    tocar:
      bien: [alu]
      porque:
        pc: "Es un contador: un registro que suma uno, con poca lógica entre flancos."
        memoria: "La memoria tiene su propio tiempo de acceso, pero el libro señala el camino combinacional entre registros."
        control: "Es una máquina de estados; su lógica no es normalmente el camino más largo."
        registros: "Son biestables: capturan en el flanco, no son el camino combinacional."
        reloj: "Marca el ritmo, pero el límite lo pone el camino más largo que debe caber en un periodo."
    exito: "La ALU: el camino combinacional más largo entre dos registros fija la frecuencia máxima."
    escalera: ["Busque la lógica combinacional más larga entre dos registros."]
    solucion: "Abajo a la derecha: la ALU."

  - id: empareje-piezas
    tipo: pregunta
    fase: "Empareje"
    titulo: "Cada bloque, una pieza conocida"
    texto: "Una cada bloque del procesador con la pieza de la que está hecho."
    libro: [306, 307, 308, 310]
    emparejar:
      - ["ALU", "Lógica combinacional"]
      - ["Registros", "Biestables en paralelo"]
      - ["Contador de programa", "Un contador"]
      - ["Unidad de control", "Una máquina de estados"]
    exito: "Un procesador no tiene nada dentro que no se haya visto ya."
    pistas:
      - { texto: "La que manda en el orden de las señales es una máquina de estados." }
    escalera: ["La ALU no tiene reloj."]
    solucion: "ALU combinacional, registros biestables, contador de programa contador, control máquina de estados."

  - id: ordene-ciclo
    tipo: pregunta
    fase: "Ordene"
    titulo: "El ciclo"
    texto: "Ponga en orden lo que el procesador repite sin parar."
    libro: [314]
    ordenar:
      - "Buscar la instrucción en la memoria."
      - "Decodificar qué operación es."
      - "Ejecutar: opera la ALU, se accede a memoria o se salta."
      - "Escribir el resultado y avanzar el contador."
    exito: "Cada paso es un estado de la máquina de control, y cada estado, un ciclo de reloj."
    pistas:
      - { texto: "No se puede ejecutar lo que aún no se ha leído ni entendido." }
    escalera: ["Empieza el contador de programa entregando la dirección."]
    solucion: "Buscar, decodificar, ejecutar y escribir."

  - id: prediga-temporizador
    tipo: predecir
    titulo: "Un periférico por dentro"
    texto: "Un microcontrolador tiene temporizadores. ¿Qué pieza del capítulo es un temporizador?"
    libro: [318]
    widget:
      tipo: logica
      entradas: [{ id: CLK, reloj: true }]
      piezas:
        - { id: c1, tipo: contador, bits: 4, entradas: [CLK] }
      salidas:
        - { id: Q3, de: c1.q3 }
        - { id: Q2, de: c1.q2 }
        - { id: Q1, de: c1.q1 }
        - { id: Q0, de: c1.q0 }
      ocultar: true
    opciones:
      - { texto: "Un contador", bien: true, porque: "Cuenta pulsos de reloj; los puertos serie, a su vez, son registros de desplazamiento." }
      - { texto: "Un registro de desplazamiento", porque: "Esos son los puertos serie. El temporizador cuenta." }
      - { texto: "Una ALU", porque: "La ALU opera con datos; el temporizador es un contador." }
    escalera: ["¿Qué pieza cuenta pulsos de reloj?"]
    solucion: "Un contador."

  - id: pregunta-registro
    tipo: pregunta
    titulo: "Configurar un periférico"
    texto: "Un programa escribe en un registro de configuración. ¿Qué ocurre en el hardware?"
    libro: [319]
    widget:
      tipo: logica
      entradas: [D, { id: CLK, reloj: true }]
      piezas:
        - { id: f1, tipo: d, entradas: [D, CLK] }
      salidas:
        - { id: Q, de: f1.q }
    opciones:
      - { texto: "Se cargan biestables", bien: true, porque: "Los periféricos aparecen como direcciones del mapa de memoria: escribir es cargar un biestable y leer un puerto es leer un registro." }
      - { texto: "Se ejecuta una función oculta del chip", porque: "No hay magia: toda biblioteca termina cargando biestables." }
      - { texto: "Se graba la Flash", porque: "Los registros de configuración son biestables, no la memoria de programa." }
    escalera: ["¿Qué guarda un registro?"]
    solucion: "Se cargan biestables."

  - id: pregunta-no-arranca
    tipo: pregunta
    titulo: "Un microcontrolador que no arranca"
    texto: "¿Qué se comprueba primero en un microcontrolador que no arranca?"
    libro: [322]
    widget:
      tipo: figura
      figura: fig-29.15
      zonas:
        - { id: reloj, rotulo: "Abajo a la izquierda", rect: [5, 234, 70, 38], texto: "El reloj." }
    opciones:
      - { texto: "Alimentación, reloj y reset", bien: true, porque: "Sin ellos la máquina de estados de control no avanza." }
      - { texto: "El programa, línea a línea", porque: "Si falta el reloj o el reset, no se ejecuta ni una línea: primero lo básico." }
      - { texto: "La ALU", porque: "La ALU no hace nada si la máquina de control no avanza." }
    escalera: ["¿Qué necesita la máquina de estados para dar su primer paso?"]
    solucion: "Alimentación, reloj y reset."

  - id: porque-division
    tipo: porque
    titulo: "¿Por qué dividir cuesta tanto?"
    texto: "En un núcleo pequeño, una división cuesta unas cien veces más que una multiplicación. ¿Por qué?"
    libro: [323]
    widget:
      tipo: figura
      figura: fig-29.15
      zonas:
        - { id: alu, rotulo: "Abajo a la derecha", rect: [310, 130, 74, 67], texto: "ALU." }
    opciones:
      - { texto: "La multiplicación es un circuito; la división, un bucle", bien: true, porque: "Un circuito da el resultado en un ciclo; un bucle necesita muchos." }
      - { texto: "Porque dividir da números negativos", porque: "No es cuestión de signo: el núcleo no tiene un circuito divisor y lo hace en un bucle." }
      - { texto: "Porque la división usa la memoria", porque: "Usa la ALU repetidamente en un bucle; por eso tarda." }
    escalera: ["¿Cuántos ciclos tarda un circuito? ¿Y un bucle?"]
    solucion: "Multiplicar es un circuito; dividir, un bucle."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [306, 310, 315, 319]
    ideas:
      - { titulo: "Las piezas.", texto: "ALU combinacional, registros, contador de programa, memoria, control y reloj." }
      - { titulo: "El ciclo.", texto: "Buscar, decodificar, ejecutar y escribir: un estado por ciclo." }
      - { titulo: "El límite.", texto: "El camino combinacional más largo, normalmente la ALU." }
      - { titulo: "Periféricos.", texto: "Contadores y registros en el mapa de memoria." }
