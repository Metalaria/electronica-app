# Lección 1.2 de la sección 28.2 «Álgebra de Boole y Puertas Lógicas» (cap29; etiqueta interna sec-29.2). Formato: contenido/lecciones11/GUIA.md (§11).
# La avería es la del banco de la sección: la OR de tres NAND con una entrada al aire; la app lee una entrada al aire
# como 1, como TTL (sección 9.3), así que la placa se dice de un 7400.
leccion: cap29/sec-29.2

libro:
  37: "las variables solo valen 0 o 1"
  41: "una XOR con una entrada a 1 es un inversor controlado"
  44: "A + B·C = (A+B)·(A+C)"
  45: "La segunda distributiva no tiene equivalente en el álgebra ordinaria"
  46: "cada vez que una expresión contiene un término y ese mismo término multiplicado por otra cosa, el segundo sobra"
  48: "overline(A + B) = overline(A) dot.op overline(B)"
  49: "una NOR con las entradas invertidas es una AND"
  60: "TTL (74xx): bipolar, robusta, hoy histórica."
  61: "CMOS 4000: lenta, de 3 a 18 V, muy tolerante."
  62: "HCT admite niveles TTL"
  63: "LVC/AUP: rápidas, de baja tensión, para 3,3 V y menos."
  66: "La mayoría de los circuitos digitales que fallan en el banco lo hacen por esas tres cosas, no por su lógica"
  68: "montar una OR con tres NAND —dos como inversores y una tercera—"
  "cap09#42": "el 7400 contiene cuatro puertas NAND de dos entradas"
  "cap09#45": "en TTL tiende a leerse como un 1"

modelo:
  valores: {}
  calculos: {}

tarjetas:
  - id: explore-xor-control
    tipo: explorar
    titulo: "Un inversor controlado"
    texto: "La señal entra por A y el control por C. Pruebe con C = 0 y con C = 1."
    libro: [37, 41]
    widget:
      tipo: logica
      entradas: [A, { id: C, rotulo: "C (control)" }]
      piezas:
        - { id: x1, tipo: xor, entradas: [A, C] }
      salidas:
        - { id: Y, de: x1 }
      tabla: true
    requiere: { mover: [A, C] }

  - id: prediga-paridad
    tipo: predecir
    titulo: "Tres unos encadenados"
    texto: "Dos XOR encadenadas reciben A = 1, B = 1 y C = 1. ¿Qué dan?"
    libro: [41]
    widget:
      tipo: logica
      entradas: [{ id: A, valor: 1 }, { id: B, valor: 1 }, { id: C, valor: 1 }]
      piezas:
        - { id: x1, tipo: xor, entradas: [A, B] }
        - { id: x2, tipo: xor, entradas: [x1, C] }
      salidas:
        - { id: P, de: x2, rotulo: "Paridad" }
      ocultar: true
    opciones:
      - { texto: "1: el número de unos es impar", bien: true, porque: "Encadenada sobre varios bits, la XOR dice si el número de unos es impar: tres lo es." }
      - { texto: "0: las entradas son todas iguales", porque: "Eso vale para una XOR de dos entradas. Encadenada, cuenta la paridad de los unos." }
    escalera: ["Haga primero A ⊕ B, y luego con C."]
    solucion: "1 ⊕ 1 = 0, y 0 ⊕ 1 = 1: tres unos, impar."

  - id: tabla-distributiva
    tipo: tabla
    titulo: "La distributiva rara"
    texto: "Arriba, A + B·C; abajo, (A+B)·(A+C). Rellene las dos columnas y compárelas."
    libro: [44, 45]
    widget:
      tipo: logica
      entradas: [A, B, C]
      piezas:
        - { id: y1, tipo: and, entradas: [B, C] }
        - { id: o1, tipo: or, entradas: [A, y1] }
        - { id: o2, tipo: or, entradas: [A, B] }
        - { id: o3, tipo: or, entradas: [A, C] }
        - { id: y2, tipo: and, entradas: [o2, o3] }
      salidas:
        - { id: Y1, de: o1, rotulo: "A + B·C" }
        - { id: Y2, de: y2, rotulo: "(A+B)·(A+C)" }
      ocultar: true
    tabla:
      salidas: [Y1, Y2]
    exito: "Las dos columnas son iguales: A + B·C = (A+B)·(A+C), la segunda distributiva."
    escalera:
      - "Con A = 1, las dos dan 1."
      - "Con A = 0, las dos se reducen a B·C."
    solucion: "Las dos valen 1 si A = 1 o si B = C = 1: son la misma función."

  - id: porque-distributiva
    tipo: porque
    titulo: "¿Por qué sorprende?"
    texto: "La segunda distributiva es una fuente de errores. ¿Por qué?"
    libro: [45]
    widget:
      tipo: logica
      entradas: [A, B, C]
      piezas:
        - { id: o2, tipo: or, entradas: [A, B] }
        - { id: o3, tipo: or, entradas: [A, C] }
        - { id: y2, tipo: and, entradas: [o2, o3] }
      salidas:
        - { id: Y, de: y2, rotulo: "(A+B)·(A+C)" }
    opciones:
      - { texto: "En números reales a + b·c no es (a+b)·(a+c): la intuición aritmética engaña", bien: true, porque: "No tiene equivalente en el álgebra ordinaria: quien traslada la aritmética no la espera." }
      - { texto: "Porque solo vale con tres variables", porque: "Vale para cualquier expresión. Lo raro es que no se cumple en la aritmética de siempre." }
      - { texto: "Porque es falsa en algunos casos", porque: "La tabla que ha rellenado muestra que se cumple siempre en Boole." }
    escalera: ["Pruebe a = b = c = 1 con números reales."]
    solucion: "En aritmética no se cumple; en Boole, siempre."

  - id: pregunta-absorcion
    tipo: pregunta
    titulo: "La absorción"
    texto: "¿A qué se reduce A + A·B?"
    libro: [44, 46]
    widget:
      tipo: logica
      entradas: [A, B]
      piezas:
        - { id: y1, tipo: and, entradas: [A, B] }
        - { id: o1, tipo: or, entradas: [A, y1] }
      salidas:
        - { id: Y, de: o1, rotulo: "A + A·B" }
      ocultar: true
    opciones:
      - { texto: "A", bien: true, porque: "El término A·B ya está cubierto por A: el segundo sobra." }
      - { texto: "A·B", porque: "Con A = 1 y B = 0, A + A·B vale 1 y A·B vale 0: no son iguales." }
      - { texto: "A + B", porque: "Con A = 0 y B = 1, A + A·B vale 0 y A + B vale 1." }
    escalera: ["Si A = 1, ¿importa A·B? Y si A = 0, ¿cuánto vale A·B?"]
    solucion: "A + A·B = A: la absorción."

  - id: pregunta-nor
    tipo: pregunta
    titulo: "Una sola puerta"
    texto: "Por De Morgan, ¿qué puerta sola hace Ā·B̄?"
    libro: [48, 49]
    widget:
      tipo: logica
      entradas: [A, B]
      piezas:
        - { id: na, tipo: not, entradas: [A] }
        - { id: nb, tipo: not, entradas: [B] }
        - { id: y1, tipo: and, entradas: [na, nb] }
      salidas:
        - { id: Y, de: y1, rotulo: "Ā·B̄" }
      ocultar: true
    opciones:
      - { texto: "Una NOR", bien: true, porque: "La negación de una suma es el producto de las negaciones: Ā·B̄ es la OR negada." }
      - { texto: "Una NAND", porque: "La NAND es Ā + B̄, la suma de las negaciones; aquí es el producto." }
      - { texto: "Una AND", porque: "La AND trabaja con A y B sin negar; aquí las dos entradas llegan negadas." }
    escalera: ["Mire la segunda ley de De Morgan."]
    solucion: "Ā·B̄ = (A+B)': una NOR."

  - id: averia-or
    tipo: averia
    titulo: "La OR de tres NAND"
    texto: "En un 7400, dos NAND invierten A y B y la tercera las une. La OR falla: pruebe, mida con la sonda y diga qué puerta es."
    libro: [66, 68, "cap09#42", "cap09#45"]
    widget:
      tipo: logica
      entradas: [A, B]
      piezas:
        - { id: n1, tipo: nand, entradas: [A, A], rotulo: "N1" }
        - { id: n2, tipo: nand, entradas: [B, B], rotulo: "N2" }
        - { id: n3, tipo: nand, entradas: [n1, n2], rotulo: "N3" }
      salidas:
        - { id: Y, de: n3, rotulo: "A + B" }
    averia:
      eleccion: fija
      sospechosos:
        - { id: n1, rotulo: "N1 (invierte A)" }
        - { id: n2, rotulo: "N2 (invierte B)" }
        - { id: n3, rotulo: "N3 (la de salida)" }
      fallos:
        - { id: n3-al-aire, pieza: n3, tipo: sin-conexion, pin: 1, texto: "La entrada de N3 que viene de N1 quedó al aire: en TTL tiende a leerse como un 1, y la salida solo sigue a B." }
        - { id: n1-a-cero, pieza: n1, tipo: atascada-0, texto: "La salida de N1 está siempre a 0: N3 da 1 sea cual sea la entrada." }
        - { id: n2-a-uno, pieza: n2, tipo: atascada-1, texto: "La salida de N2 está siempre a 1: N3 solo invierte la salida de N1 y sigue a A." }
    escalera:
      - "Pruebe A = 1 con B = 0: una OR debe dar 1."
      - "Mida a la entrada y a la salida de N3: compare con lo que le llega."
    solucion: "Con A = 1 y B = 0 la salida da 0; N1 da 0, pero la patilla de N3 está al aire: N3."

  - id: empareje-familias
    tipo: pregunta
    fase: "Empareje"
    titulo: "Las familias, en una frase"
    texto: "Una cada familia con su frase."
    libro: [60, 61, 62, 63]
    emparejar:
      - ["TTL (74xx)", "Bipolar, robusta, hoy histórica"]
      - ["CMOS 4000", "Lenta, de 3 a 18 V, muy tolerante"]
      - ["HC/HCT", "La CMOS moderna de uso general"]
      - ["LVC/AUP", "Rápidas, de baja tensión, para 3,3 V y menos"]
    exito: "Y al mezclarlas, un 1 de una tiene que superar el umbral de entrada de la otra."
    pistas:
      - { texto: "Solo una es bipolar; la de 18 V es la más antigua de las CMOS." }
    escalera: ["Las de baja tensión son las más modernas."]
    solucion: "TTL histórica, 4000 de 3 a 18 V, HC/HCT de uso general y LVC/AUP de baja tensión."

  - id: pregunta-error-partida
    tipo: pregunta
    titulo: "Por qué fallan en el banco"
    texto: "La mayoría de los circuitos digitales que fallan en el banco, ¿por qué fallan?"
    libro: [66]
    widget:
      tipo: logica
      entradas: [A, B]
      piezas:
        - { id: n1, tipo: nand, entradas: [A, B] }
      salidas:
        - { id: Y, de: n1 }
    opciones:
      - { texto: "Por retardos, entradas al aire y salidas unidas, no por su lógica", bien: true, porque: "El error de partida es tratar las puertas como funciones matemáticas instantáneas." }
      - { texto: "Por errores en la tabla de verdad", porque: "La lógica suele estar bien: fallan las tres cosas en que la puerta real se aparta del símbolo." }
      - { texto: "Porque las puertas se estropean", porque: "Rara vez: el libro atribuye la mayoría de los fallos a retardos, entradas al aire y salidas unidas." }
    escalera: ["¿En qué se aparta una puerta real de su símbolo?"]
    solucion: "Retardos, entradas al aire y salidas unidas."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [41, 45, 46, 49, 66]
    ideas:
      - { titulo: "XOR.", texto: "Detecta diferencias, cuenta la paridad e invierte bajo control." }
      - { titulo: "Las leyes.", texto: "La segunda distributiva y la absorción; De Morgan para cambiar de puertas." }
      - { titulo: "La puerta real.", texto: "Tarda, no admite entradas al aire ni salidas unidas." }
