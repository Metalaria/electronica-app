# Lección de la sección 28.8 «Diseño Síncrono: Setup, Hold, Skew y Frecuencia Máxima» (cap29; etiqueta interna sec-29.8). Formato: contenido/lecciones11/GUIA.md.
# 1.2.1 («aprender haciendo», GUIA §13): la lógica que cabe a 62,5 MHz se busca arrastrando su retardo; la frecuencia
# sin lógica, la de 20 ns de lógica partida en dos etapas y el periodo con 2 ns de skew favorable se calculan y se
# escriben; el camino crítico se recorta con un ajuste. Quedan dos preguntas de opciones: por qué solo limita el camino
# crítico y cómo se arregla un fallo de hold. Las reglas (reloj derivado) y el jitter van en los textos de éxito.
leccion: cap29/sec-29.8

libro:
  242: "todos los elementos de memoria capturan a la vez, con el mismo flanco de reloj"
  246: 'T gt.eq t_("pd") + t_("lógica") + t_("su")'
  247: "Con tpd = 8 ns, tlógica = 5 ns y tsu = 3 ns: T ≥ 16 ns, es decir, 62,5 MHz"
  249: "partiéndola en dos etapas con un registro en medio (segmentación o pipeline)"
  250: "El camino crítico es el más lento de todos, y es el único que limita"
  254: "el periodo de reloj no aparece: es una condición independiente de la frecuencia"
  255: "La cura es añadir retardo en el camino de datos, no bajar el reloj"
  258: "Si el destino recibe el reloj más tarde, gana 2 ns de margen"
  260: "un reloj con 200 ps de jitter reduce el periodo útil en esa cantidad"
  263: "un reloj que sale de una puerta AND tiene glitches y skew impredecible"

modelo:
  valores:
    t_pd: { sim: "t_{pd}", nombre: "retardo del flip-flop", unidad: s, valor: 8e-9 }
    t_l: { sim: "t_{lógica}", nombre: "retardo de la lógica", unidad: s, valor: 5e-9 }
    t_su: { sim: "t_{su}", nombre: "tiempo de setup", unidad: s, valor: 3e-9 }
    t_sk: { sim: "t_{skew}", nombre: "skew favorable del reloj", unidad: s, valor: 2e-9 }
  calculos:
    T_min: { expr: "t_pd + t_l + t_su", sim: "T", nombre: "periodo mínimo", unidad: s }
    f_max: { expr: "1/T_min", sim: "f_{máx}", nombre: "frecuencia máxima", unidad: Hz }
    f_seg: { expr: "1/(t_pd + t_l/2 + t_su)", sim: "f_{máx}", nombre: "frecuencia máxima con la lógica en dos etapas", unidad: Hz }
    t_l2: { expr: "t_l/2", sim: "t_{lógica}/2", nombre: "lógica de cada etapa", unidad: s }
    T_seg: { expr: "t_pd + t_l/2 + t_su", sim: "T", nombre: "periodo de cada etapa", unidad: s }
    T_sk: { expr: "T_min - t_sk", sim: "T", nombre: "periodo mínimo con el skew favorable", unidad: s }

tarjetas:
  - id: explore-fmax
    tipo: explorar
    titulo: "Cada nanosegundo cuenta"
    texto: "Entre dos flip-flops de t_{pd} = 8 ns y t_{su} = 3 ns hay lógica. Añádale retardo hasta que el reloj baje a 62,5 MHz."
    libro: [242, 246, 247]
    inicio: { t_l: 0 }
    widget:
      tipo: grafica
      x: { id: tx, min: 0, max: 0.00000003, unidad: s, rotulo: "t_{lógica}" }
      y: { min: 0, max: 100000000, unidad: Hz, rotulo: "f_{máx}" }
      curvas:
        - { expr: "1/(t_pd + tx + t_su)", color: azul, rotulo: "f_{máx}" }
      asas:
        - { mueve: t_l, x: "t_l", y: "f_max", rotulo: "Su lógica" }
      lectura: { valor: f_max, rotulo: "Frecuencia máxima" }
      datos:
        - { valor: T_min, rotulo: "Periodo mínimo: {{T_min}}" }
      mandos:
        - { valor: t_l, min: 0, max: 0.00000003, paso: 0.000000001, rotulo: "t_{lógica}" }
    objetivo:
      condiciones:
        - { valor: f_max, objetivo: 62500000, tol: 0.01, rotulo: "f_{máx}: {{f_max}}" }
      logrado: "{{t_l}} de lógica: T = 8 + 5 + 3 = {{T_min}}. El dato sale del primero, atraviesa la lógica y llega antes del setup del segundo."
      pistas:
        - { cuando: { valor: f_max, menor: 62000000 }, texto: "Demasiada lógica: el reloj ya va más despacio. Quite un poco." }
        - { texto: "Aún va más deprisa: añada retardo de lógica." }
    escalera: ["T ≥ t_{pd} + t_{lógica} + t_{su}, y f = 1/T."]
    solucion: "5 ns de lógica: T = 16 ns, 62,5 MHz."
    comprobar:
      - { con: { t_l: 5e-9 }, T_min: 16e-9, f_max: 62.5e6 }

  - id: prediga-sin-logica
    tipo: leer
    titulo: "Sin lógica entre medias"
    texto: "Los mismos flip-flops, sin ninguna lógica entre ellos. Calcule hasta qué frecuencia llegan y escríbala."
    libro: [247]
    fijar: { t_l: 0 }
    widget:
      tipo: grafica
      x: { id: tx, min: 0, max: 0.00000003, unidad: s, rotulo: "t_{lógica}" }
      y: { min: 0, max: 100000000, unidad: Hz, rotulo: "f_{máx}" }
      curvas:
        - { expr: "1/(t_pd + tx + t_su)", color: azul, rotulo: "f_{máx}" }
      mandos: []
    leer:
      objetivo: f_max
      unidad: Hz
      tol: 0.02
      rotulo: "Frecuencia máxima"
      errores:
        - { expr: "1/t_pd", texto: "Falta el setup del segundo flip-flop: T = t_{pd} + t_{su}." }
        - { expr: "62500000", texto: "Esos son con 5 ns de lógica. Sin ella, el periodo baja a 11 ns." }
    exito: "{{f_max}}: 1/11 ns. Cada nanosegundo de lógica resta."
    escalera: ["T = t_{pd} + t_{su} cuando no hay lógica."]
    solucion: "1/(8 + 3) ns ≈ 91 MHz."
    comprobar:
      - { T_min: 11e-9, f_max: 90.9e6 }

  - id: ajuste-camino
    tipo: ajuste
    titulo: "Recorte el camino crítico"
    texto: "El camino crítico tiene 20 ns de lógica. Recórtela hasta que el reloj llegue a 62,5 MHz."
    libro: [247, 250]
    inicio: { t_l: 0.00000002 }
    widget:
      tipo: grafica
      x: { id: tx, min: 0, max: 0.00000003, unidad: s, rotulo: "t_{lógica}" }
      y: { min: 0, max: 100000000, unidad: Hz, rotulo: "f_{máx}" }
      curvas:
        - { expr: "1/(t_pd + tx + t_su)", color: azul, rotulo: "f_{máx}" }
      asas:
        - { mueve: t_l, x: "t_l", y: "f_max", rotulo: "Su lógica" }
      lectura: { valor: f_max, rotulo: "Frecuencia máxima" }
      mandos:
        - { valor: t_l, min: 0, max: 0.00000003, paso: 0.000000001, rotulo: "t_{lógica}" }
    ajuste:
      valor: f_max
      objetivo: 62500000
      tol: 0.02
      rotulo: "Frecuencia máxima"
      escala: { min: 0, max: 100000000 }
      bajo: "Aún es lento: recorte más lógica."
      alto: "Se ha pasado: con menos lógica sube por encima del objetivo."
      dentro: "62,5 MHz: el periodo de 16 ns del libro."
    comprobar:
      - { t_l: 20e-9 }

  - id: pregunta-segmentar
    tipo: leer
    titulo: "Segmentar"
    texto: "Un camino crítico de 20 ns de lógica se parte en dos etapas de {{t_l2}} con un registro en medio. Calcule la nueva frecuencia máxima."
    libro: [249]
    fijar: { t_l: 20e-9 }
    widget:
      tipo: grafica
      x: { id: tx, min: 0, max: 0.00000003, unidad: s, rotulo: "t_{lógica}" }
      y: { min: 0, max: 100000000, unidad: Hz, rotulo: "f_{máx}" }
      curvas:
        - { expr: "1/(t_pd + tx + t_su)", color: azul, rotulo: "f_{máx}" }
      lectura: { valor: f_max, rotulo: "Sin segmentar" }
      mandos: []
    leer:
      objetivo: f_seg
      unidad: Hz
      tol: 0.02
      rotulo: "Frecuencia segmentada"
      errores:
        - { expr: "2*f_max", texto: "El doble exacto no se alcanza: t_{pd} y t_{su} se pagan en cada etapa." }
        - { expr: "1/(t_l/2)", texto: "Falta lo del flip-flop: cada etapa paga sus 8 ns de t_{pd} y 3 ns de t_{su}." }
    exito: "{{f_seg}} frente a {{f_max}}: se acerca al doble, pero nunca lo alcanza. A cambio, un ciclo más de latencia."
    escalera: ["Cada etapa: T = t_{pd} + {{t_l2}} + t_{su}."]
    solucion: "1/{{T_seg}} = {{f_seg}}."
    comprobar:
      - { f_max: 32.26e6, f_seg: 47.62e6, t_l2: 10e-9, T_seg: 21e-9, tol: 0.01 }

  - id: porque-critico
    tipo: porque
    titulo: "¿Por qué solo uno?"
    texto: "Acelerar cualquier camino que no sea el crítico no sirve de nada. ¿Por qué?"
    libro: [250]
    widget:
      tipo: grafica
      x: { id: tx, min: 0, max: 0.00000003, unidad: s, rotulo: "t_{lógica}" }
      y: { min: 0, max: 100000000, unidad: Hz, rotulo: "f_{máx}" }
      curvas:
        - { expr: "1/(t_pd + tx + t_su)", color: azul, rotulo: "f_{máx}" }
    opciones:
      - { texto: "Porque el periodo lo fija el camino más lento: los demás ya llegan a tiempo", bien: true, porque: "Por eso las herramientas informan del camino crítico y del margen (slack) que queda." }
      - { texto: "Porque los demás caminos no tienen lógica", porque: "La tienen, pero se asientan antes: el que fija el periodo es el más lento." }
      - { texto: "Porque el reloj solo llega al camino crítico", porque: "El reloj llega a todos los flip-flops; el límite lo pone el camino más lento." }
    escalera: ["Todos deben llegar antes del flanco: ¿cuál llega el último?"]
    solucion: "Solo el camino más lento limita el periodo."

  - id: pregunta-hold
    tipo: porque
    titulo: "Un fallo de hold"
    texto: "Un circuito con un fallo de hold no funciona ni a la frecuencia más baja. ¿Qué se hace?"
    libro: [254, 255]
    widget:
      tipo: grafica
      x: { id: tx, min: 0, max: 0.00000003, unidad: s, rotulo: "t_{lógica}" }
      y: { min: 0, max: 100000000, unidad: Hz, rotulo: "f_{máx}" }
      curvas:
        - { expr: "1/(t_pd + tx + t_su)", color: azul, rotulo: "f_{máx}" }
    opciones:
      - { texto: "Añadir retardo en el camino de datos", bien: true, porque: "El hold usa los retardos mínimos y no depende del periodo: el dato nuevo llega demasiado pronto." }
      - { texto: "Bajar el reloj", porque: "El periodo no aparece en la condición de hold: bajar el reloj no lo arregla." }
      - { texto: "Usar flip-flops más rápidos", porque: "Empeoraría: el problema es que el dato llega antes de tiempo." }
    escalera: ["¿Aparece el periodo en la condición de hold?"]
    solucion: "Añadir retardo en el camino de datos."

  - id: pregunta-skew
    tipo: leer
    titulo: "Un skew de 2 ns"
    texto: "Con 5 ns de lógica, el flip-flop destino recibe el reloj 2 ns más tarde que el origen. Escriba el nuevo periodo mínimo."
    libro: [258, 260, 263]
    fijar: { t_l: 5e-9 }
    widget:
      tipo: grafica
      x: { id: tx, min: 0, max: 0.00000003, unidad: s, rotulo: "t_{lógica}" }
      y: { min: 0, max: 100000000, unidad: Hz, rotulo: "f_{máx}" }
      curvas:
        - { expr: "1/(t_pd + tx + t_su)", color: azul, rotulo: "f_{máx}" }
      lectura: { valor: T_min, rotulo: "Periodo sin skew" }
      mandos: []
    leer:
      objetivo: T_sk
      unidad: s
      tol: 0.02
      rotulo: "Periodo mínimo"
      errores:
        - { expr: "T_min + t_sk", texto: "Al revés: si el destino captura más tarde, el dato tiene 2 ns más. El que pierde es el hold." }
    exito: "{{T_sk}}: gana 2 ns de setup y pierde 2 de hold. El jitter, en cambio, siempre resta; y un reloj que sale de una AND tiene skew impredecible."
    escalera: ["El flanco de captura llega 2 ns más tarde: el dato dispone de 2 ns más."]
    solucion: "16 − 2 = 14 ns."
    comprobar:
      - { T_min: 16e-9, T_sk: 14e-9 }

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [246, 250, 254, 258]
    ideas:
      - { titulo: "Setup.", texto: "T ≥ t_{pd} + t_{lógica} + t_{su}: el camino crítico fija la frecuencia." }
      - { titulo: "Hold.", texto: "Independiente del reloj: se arregla con retardo en los datos." }
      - { titulo: "Skew.", texto: "Lo que gana el setup lo pierde el hold." }
