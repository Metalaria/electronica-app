# Lección de la sección 28.9 «Representación Numérica» (cap29; etiqueta interna sec-29.9). Formato: contenido/lecciones11/GUIA.md.
# 1.2.1 («aprender haciendo», GUIA §13): el salto de 127 a −128 se busca moviendo el código; las conversiones se
# escriben (0xB6, 47 en BCD, −5 leído sin signo, 127 + 1, −1 extendido con ceros, los bytes intercambiados, los
# dígitos de un float). −5 se escribe en binario y los bytes intercambiados en hexadecimal («leer» con base, motor121);
# el resto, en decimal. Quedan dos preguntas de opciones (qué significa un byte y por qué el complemento a dos) y un emparejamiento.
leccion: cap29/sec-29.9

libro:
  273: "ocho bits, que pueden tomar 256 valores (de 0 a 255 sin signo)"
  274: "El mismo byte es el número 65 en binario natural, la letra «A» en ASCII"
  276: "escribir 0xB6 es lo mismo, con cada dígito hexadecimal representando exactamente cuatro bits"
  277: "1000 0000"
  280: "47 se escribe 0100 0111"
  283: "un número negativo se obtiene invirtiendo todos los bits y sumando uno"
  284: "−5 es 1111 1011. El bit más alto indica el signo, y el margen es de −128 a +127"
  287: "Solo hay un cero"
  286: "La suma y la resta son la misma operación"
  289: "127 + 1 con 8 bits da −128, y el hardware no avisa"
  290: "Un −1 mal extendido se convierte en 255"
  293: "se guarda como 78 56 34 12 en un procesador little-endian"
  294: "0x0190 (400) se convierte en 0x9001 (36 865)"
  298: "un float da unos 7 dígitos significativos"

modelo:
  valores:
    u_c: { sim: "código", nombre: "código del byte", unidad: "", valor: 100 }
    h_a: { sim: "B", nombre: "dígito hexadecimal alto", unidad: "", valor: 11 }
    h_b: { sim: "6", nombre: "dígito hexadecimal bajo", unidad: "", valor: 6 }
    n_m: { sim: "n", nombre: "bits efectivos de la mantisa", unidad: "", valor: 24 }
  calculos:
    s_c: { expr: "u_c - 256*floor(u_c/128)", sim: "valor", nombre: "valor en complemento a dos", unidad: "", cifras: 3 }
    d_h: { expr: "16*h_a + h_b", sim: "decimal", nombre: "valor decimal", unidad: "", cifras: 3 }
    dig: { expr: "log10(2^n_m)", sim: "dígitos", nombre: "dígitos decimales de un float", unidad: "", cifras: 3 }

tarjetas:
  - id: explore-signo
    tipo: explorar
    titulo: "Un byte, dos lecturas"
    texto: "El mismo byte leído sin signo y en complemento a dos. Mueva el código hasta el más negativo que cabe en 8 bits."
    libro: [273, 284]
    inicio: { u_c: 100 }
    widget:
      tipo: grafica
      x: { id: cx, min: 0, max: 255, unidad: "", rotulo: "código" }
      y: { min: -128, max: 255, unidad: "", rotulo: "valor" }
      curvas:
        - { expr: "cx", color: tinta, rotulo: "sin signo", discontinua: true }
        - { expr: "cx - 256*floor(cx/128)", color: azul, rotulo: "complemento a dos" }
      asas:
        - { mueve: u_c, x: "u_c", y: "s_c", rotulo: "Su byte" }
      lectura: { valor: s_c, rotulo: "Con signo, en complemento a dos" }
      datos:
        - { valor: u_c, rotulo: "Sin signo: {{u_c}}" }
      mandos:
        - { valor: u_c, min: 0, max: 255, paso: 1, rotulo: "Código" }
    objetivo:
      condiciones:
        - { valor: s_c, max: -128, rotulo: "Con signo: {{s_c}}" }
      logrado: "El código {{u_c}}, 1000 0000, vale −128: justo después del +127. El bit más alto indica el signo; el margen es de −128 a +127."
      pistas:
        - { cuando: { valor: u_c, menor: 128 }, texto: "Por debajo de 128 los dos significados coinciden: suba el código." }
        - { texto: "Ese ya es negativo, pero no el más negativo: busque el salto." }
    escalera: ["Busque dónde la curva azul salta hacia abajo."]
    solucion: "El código 128: −128."
    comprobar:
      - { con: { u_c: 128 }, s_c: -128 }

  - id: prediga-desborde
    tipo: leer
    titulo: "127 + 1"
    texto: "Con 8 bits en complemento a dos, un contador vale 127 y se le suma 1. Escriba lo que queda guardado."
    libro: [289]
    fijar: { u_c: 128 }
    widget:
      tipo: grafica
      x: { id: cx, min: 0, max: 255, unidad: "", rotulo: "código" }
      y: { min: -128, max: 255, unidad: "", rotulo: "valor" }
      curvas:
        - { expr: "cx", color: tinta, rotulo: "sin signo", discontinua: true }
        - { expr: "cx - 256*floor(cx/128)", color: azul, rotulo: "complemento a dos" }
      mandos: []
    leer:
      objetivo: s_c
      unidad: ""
      tol: 0.01
      rotulo: "Resultado con signo"
      errores:
        - { expr: "u_c", texto: "Ese es el código leído sin signo. Con signo, 8 bits solo llegan a +127." }
    exito: "{{s_c}}, y el hardware no avisa: solo pone a 1 el indicador de desbordamiento, que el programa tiene que comprobar."
    escalera: ["Después de +127 viene el código 1000 0000."]
    solucion: "127 + 1 da −128."
    comprobar:
      - { s_c: -128 }

  - id: empareje-hex
    tipo: pregunta
    fase: "Empareje"
    titulo: "Hexadecimal, binario y decimal"
    texto: "Una cada número hexadecimal con su binario."
    libro: [276, 277]
    emparejar:
      - ["0x0F", "0000 1111 (15)"]
      - ["0x80", "1000 0000 (128)"]
      - ["0xFF", "1111 1111 (255)"]
    exito: "Cada dígito hexadecimal son exactamente cuatro bits: se convierte de cuatro en cuatro sin pasar por decimal."
    pistas:
      - { texto: "F es 1111 y 8 es 1000." }
    escalera: ["Convierta cada dígito por separado."]
    solucion: "0x0F = 0000 1111; 0x80 = 1000 0000; 0xFF = 1111 1111."

  - id: estime-b6
    tipo: leer
    titulo: "0xB6 en decimal"
    texto: "0xB6 es 1011 0110. Escriba qué número es en decimal."
    libro: [276]
    fijar: { h_a: 11, h_b: 6, u_c: 182 }
    widget:
      tipo: grafica
      x: { id: cx, min: 0, max: 255, unidad: "", rotulo: "código" }
      y: { min: -128, max: 255, unidad: "", rotulo: "valor" }
      curvas:
        - { expr: "cx", color: tinta, rotulo: "sin signo", discontinua: true }
        - { expr: "cx - 256*floor(cx/128)", color: azul, rotulo: "complemento a dos" }
      mandos: []
    leer:
      objetivo: d_h
      unidad: ""
      tol: 0.005
      rotulo: "Decimal"
      errores:
        - { expr: "10*h_a + h_b", texto: "B no pesa 10: en hexadecimal cada dígito pesa 16 veces el siguiente." }
        - { expr: "16*h_b + h_a", texto: "Ha cambiado los dígitos: B es el de más peso." }
    exito: "{{d_h}}: B vale 11, por 16, más 6. Cada dígito hexadecimal son exactamente cuatro bits."
    escalera: ["0xB6 = B · 16 + 6, con B = 11."]
    solucion: "11 · 16 + 6 = 182."
    comprobar:
      - { d_h: 182 }

  - id: pregunta-codificacion
    tipo: pregunta
    titulo: "¿Qué significa un byte?"
    texto: "Un byte vale 0100 0001. ¿Qué significa?"
    libro: [274]
    widget:
      tipo: grafica
      x: { id: cx, min: 0, max: 255, unidad: "", rotulo: "código" }
      y: { min: -128, max: 255, unidad: "", rotulo: "valor" }
      curvas:
        - { expr: "cx", color: tinta, rotulo: "sin signo" }
    opciones:
      - { texto: "Depende de la codificación: 65, la «A» en ASCII o 41 en BCD", bien: true, porque: "Los bits no dicen nada solos: el convenio asigna un significado a cada combinación." }
      - { texto: "Siempre 65", porque: "65 es en binario natural; en ASCII es la «A» y en BCD, 41." }
      - { texto: "La letra «A»", porque: "Solo en ASCII; en binario natural es 65 y en BCD, 41." }
    escalera: ["¿Quién decide qué significan los bits?"]
    solucion: "La codificación: 65, «A» o 41."

  - id: pregunta-bcd
    tipo: leer
    titulo: "Un reloj en BCD"
    texto: "Un reloj de tiempo real entrega el byte 0100 0111 en BCD. Escriba qué número es."
    libro: [280]
    fijar: { u_c: 71 }
    widget:
      tipo: grafica
      x: { id: cx, min: 0, max: 255, unidad: "", rotulo: "código" }
      y: { min: -128, max: 255, unidad: "", rotulo: "valor" }
      curvas:
        - { expr: "cx", color: tinta, rotulo: "sin signo", discontinua: true }
        - { expr: "cx - 256*floor(cx/128)", color: azul, rotulo: "complemento a dos" }
      mandos: []
    leer:
      objetivo: "4*10 + 7"
      unidad: ""
      tol: 0.01
      rotulo: "Número"
      errores:
        - { expr: "u_c", texto: "Ese es el byte en binario natural. En BCD cada grupo de cuatro bits es una cifra decimal." }
    exito: "47: una cifra en cada grupo de cuatro bits. Desperdicia seis de las dieciséis combinaciones, pero se muestra directamente en un display."
    escalera: ["Lea 0100 y 0111 por separado: cada uno es una cifra."]
    solucion: "0100 es la cifra de las decenas y 0111 la de las unidades: 47."

  - id: pregunta-menos-cinco
    tipo: leer
    titulo: "Menos cinco"
    texto: "+5 es 0000 0101. Escriba −5 en complemento a dos con 8 bits, en binario."
    libro: [283, 284]
    inicio: { u_c: 5 }
    widget:
      tipo: grafica
      x: { id: cx, min: 0, max: 255, unidad: "", rotulo: "código" }
      y: { min: -128, max: 255, unidad: "", rotulo: "valor" }
      curvas:
        - { expr: "cx", color: tinta, rotulo: "sin signo", discontinua: true }
        - { expr: "cx - 256*floor(cx/128)", color: azul, rotulo: "complemento a dos" }
      asas:
        - { mueve: u_c, x: "u_c", y: "s_c", rotulo: "Su byte" }
      lectura: { valor: s_c, rotulo: "Con signo" }
      mandos:
        - { valor: u_c, min: 0, max: 255, paso: 1, rotulo: "Código" }
    leer:
      objetivo: "256 - 5"
      base: 2
      cifras: 8
      rotulo: "−5 en complemento a dos"
      errores:
        - { expr: "128 + 5", texto: "Eso es signo-magnitud, 1000 0101: el complemento a dos invierte todos los bits y suma uno." }
        - { expr: "256 - 6", texto: "Ha invertido los bits, pero falta sumar uno." }
    exito: "1111 1011, 251 sin signo: se invierten todos los bits de +5 y se suma uno. En la gráfica, el código que vale −5 con signo."
    escalera: ["Busque en la gráfica el código que vale −5 con signo."]
    solucion: "1111 1011, que sin signo es 251."

  - id: porque-universal
    tipo: porque
    titulo: "¿Por qué se hizo universal?"
    texto: "Casi todos los procesadores representan los negativos en complemento a dos. ¿Por qué?"
    libro: [286, 287]
    widget:
      tipo: grafica
      x: { id: cx, min: 0, max: 255, unidad: "", rotulo: "código" }
      y: { min: -128, max: 255, unidad: "", rotulo: "valor" }
      curvas:
        - { expr: "cx - 256*floor(cx/128)", color: azul, rotulo: "complemento a dos" }
    opciones:
      - { texto: "Sumar y restar son la misma operación, y solo hay un cero", bien: true, porque: "5 + (−5) da cero descartando el acarreo: el mismo sumador vale para los dos signos." }
      - { texto: "Porque el bit de signo es más fácil de leer", porque: "Signo-magnitud también tiene bit de signo, y necesita circuitos distintos para sumar y restar, y dos ceros." }
      - { texto: "Porque amplía el margen hasta +255", porque: "Con signo, 8 bits llegan solo de −128 a +127." }
    escalera: ["Piense en qué circuito hace falta para restar."]
    solucion: "Un solo sumador para sumar y restar, y un solo cero."

  - id: pregunta-extension
    tipo: leer
    titulo: "Extender el signo"
    texto: "Un −1 de 8 bits, 1111 1111, se pasa a 16 bits rellenando con ceros. Escriba el número que resulta."
    libro: [290]
    fijar: { u_c: 255 }
    widget:
      tipo: grafica
      x: { id: cx, min: 0, max: 255, unidad: "", rotulo: "código" }
      y: { min: -128, max: 255, unidad: "", rotulo: "valor" }
      curvas:
        - { expr: "cx", color: tinta, rotulo: "sin signo", discontinua: true }
        - { expr: "cx - 256*floor(cx/128)", color: azul, rotulo: "complemento a dos" }
      mandos: []
    leer:
      objetivo: u_c
      unidad: ""
      tol: 0.005
      rotulo: "Número de 16 bits"
      errores:
        - { expr: "s_c", texto: "Así habría quedado rellenando con unos. Con ceros delante, el bit de signo de 16 bits es 0." }
    exito: "{{u_c}}: un positivo. Un número negativo se extiende con unos, copiando el bit más alto."
    escalera: ["Con ceros delante, el bit de signo de 16 bits es 0."]
    solucion: "0000 0000 1111 1111 = 255."

  - id: pregunta-endian
    tipo: leer
    titulo: "Bytes intercambiados"
    texto: "Un sensor I²C entrega 400, 0x0190, con el byte alto primero; un micro little-endian copia los dos bytes tal cual. Escriba en hexadecimal lo que lee."
    libro: [293, 294]
    widget:
      tipo: grafica
      x: { id: cx, min: 0, max: 255, unidad: "", rotulo: "código" }
      y: { min: -128, max: 255, unidad: "", rotulo: "valor" }
      curvas:
        - { expr: "cx", color: tinta, rotulo: "sin signo", discontinua: true }
        - { expr: "cx - 256*floor(cx/128)", color: azul, rotulo: "complemento a dos" }
      mandos: []
    leer:
      objetivo: "144*256 + 1"
      base: 16
      cifras: 16
      rotulo: "Valor leído"
      errores:
        - { expr: "400", texto: "Eso sería si se montara el valor con (alto << 8) | bajo. Copiando a ciegas, los bytes se intercambian." }
    exito: "36 865: 0x0190 se convierte en 0x9001. La regla: montar el valor desplazando bytes, (alto << 8) | bajo."
    escalera: ["Intercambie los dos bytes: 0x01 y 0x90."]
    solucion: "0x9001 = 36 865."

  - id: estime-float
    tipo: leer
    titulo: "Los dígitos de un float"
    texto: "La mantisa de un float de 32 bits tiene 24 bits efectivos. Calcule cuántos dígitos decimales son y escríbalo."
    libro: [298]
    widget:
      tipo: grafica
      x: { id: nb, min: 1, max: 32, unidad: "", rotulo: "bits de mantisa" }
      y: { min: 0, max: 10, unidad: "", rotulo: "dígitos" }
      curvas:
        - { expr: "log10(2^nb)", color: azul, rotulo: "dígitos decimales" }
      mandos: []
    leer:
      objetivo: dig
      unidad: ""
      tol: 0.02
      rotulo: "Dígitos"
      errores:
        - { expr: "log10(2^32)", texto: "Esos serían con los 32 bits; la mantisa solo tiene 24 efectivos." }
    exito: "{{dig}}: un float da unos 7 dígitos significativos, y sumar uno grande y otro pequeño pierde el pequeño."
    escalera: ["Dígitos = log₁₀(2^{24})."]
    solucion: "log₁₀(2^{24}) = 7,22."
    comprobar:
      - { dig: 7.22 }

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [276, 284, 289, 298]
    ideas:
      - { titulo: "Hexadecimal.", texto: "Una abreviatura del binario: cuatro bits por dígito." }
      - { titulo: "Complemento a dos.", texto: "Invertir y sumar uno; un solo sumador, de −128 a +127, y 127 + 1 da −128." }
      - { titulo: "En la frontera.", texto: "Extensión de signo y orden de los bytes." }
      - { titulo: "Coma flotante.", texto: "Unos 7 dígitos en 32 bits; la coma fija es más barata y predecible." }
