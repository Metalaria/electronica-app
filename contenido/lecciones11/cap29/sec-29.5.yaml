# Lección 1.2 de la sección 28.5 «Registros, Contadores y Máquinas de Estados» (cap29; etiqueta interna sec-29.5). Formato: contenido/lecciones11/GUIA.md (§11).
leccion: cap29/sec-29.5

libro:
  138: "en cada flanco de reloj, pasa de un estado a otro según sus entradas"
  140: "El registro de estado: los biestables que guardan en cuál está"
  141: "La lógica de transición: combinacional"
  142: "La lógica de salida: qué hace el circuito en cada estado"
  145: "Moore: la salida depende solo del estado"
  146: "hereda los glitches de las entradas"
  147: "Moore por defecto, porque su salida es limpia y analizable"
  150: "Binaria: n biestables para 2ⁿ estados"
  151: "One-hot: un biestable por estado, con uno solo activo"
  154: "cinco estados en tres biestables, hay tres combinaciones que no corresponden a ningún estado"
  "cap29#39": "A+B"
  "cap09#64": "ignorando cambios durante unos 20 ms tras el primero"
  155: "la máquina puede quedarse bloqueada fuera de su diagrama"
  169: "con los biestables que necesitan para los 4 estados del diagrama y para 16 estados"
  156: "todo estado no definido va al estado de reposo"
  158: "Enumerar los estados y darles nombre descriptivo."
  164: "Un contador es una máquina de estados cuyo diagrama es un ciclo"
  170: "Máquina de estados de un antirrebote, con sus cuatro estados y sus transiciones"

modelo:
  valores:
    n_ff: { sim: "n", nombre: "biestables", unidad: "", valor: 3 }
    n_est: { sim: "estados", nombre: "estados usados", unidad: "", valor: 5 }
  calculos:
    comb: { expr: "2^n_ff", sim: "combinaciones", nombre: "combinaciones de los biestables", unidad: "", cifras: 2 }
    huecos: { expr: "2^n_ff - n_est", sim: "sobrantes", nombre: "combinaciones sin estado", unidad: "", cifras: 2 }

tarjetas:
  - id: explore-antirrebote
    tipo: explorar
    titulo: "Un antirrebote como máquina"
    texto: "Toque los estados del diagrama y lea qué hace cada uno."
    libro: [138, 170, "cap29#39", "cap09#64"]
    widget:
      tipo: figura
      figura: fig-29.8
      zonas:
        - { id: reposo, rotulo: "Arriba a la izquierda", rect: [79, 10, 60, 60], texto: "Reposo: salida 0. Si la entrada pasa a 0, va a posible pulsación." }
        - { id: posible-pulsacion, rotulo: "Arriba a la derecha", rect: [310, 10, 60, 60], texto: "Posible pulsación: espera 20 ms. Si rebota a 1 antes, vuelve a reposo." }
        - { id: pulsado, rotulo: "Abajo a la derecha", rect: [310, 118, 60, 60], texto: "Pulsado: salida 1. Si la entrada pasa a 1, va a posible suelta." }
        - { id: posible-suelta, rotulo: "Abajo a la izquierda", rect: [79, 118, 60, 60], texto: "Posible suelta: si la entrada sigue a 1 más de 20 ms, vuelve a reposo." }
    requiere: { mover: [reposo, pulsado] }

  - id: toque-siguiente
    tipo: tocar
    titulo: "El estado siguiente"
    texto: "La máquina está en posible pulsación y la entrada sigue a 0 más de 20 ms. Toque el estado al que pasa."
    libro: [138, 170, "cap29#39", "cap09#64"]
    widget:
      tipo: figura
      figura: fig-29.8
      zonas:
        - { id: reposo, rotulo: "Arriba a la izquierda", rect: [79, 10, 60, 60] }
        - { id: posible-pulsacion, rotulo: "Arriba a la derecha", rect: [310, 10, 60, 60] }
        - { id: pulsado, rotulo: "Abajo a la derecha", rect: [310, 118, 60, 60] }
        - { id: posible-suelta, rotulo: "Abajo a la izquierda", rect: [79, 118, 60, 60] }
    tocar:
      bien: [pulsado]
      porque:
        reposo: "A reposo vuelve si la entrada rebota a 1 antes de 20 ms; aquí ha seguido a 0."
        posible-pulsacion: "Es donde está: tras 20 ms con la entrada a 0, sale de él."
        posible-suelta: "A posible suelta se llega desde pulsado, cuando la entrada pasa a 1."
    exito: "Pulsado: la pulsación queda confirmada y la salida pasa a 1."
    escalera: ["Siga la flecha que sale de posible pulsación con la condición de más de 20 ms."]
    solucion: "Abajo a la derecha: pulsado."

  - id: empareje-partes
    tipo: pregunta
    fase: "Empareje"
    titulo: "Las tres partes"
    texto: "Una cada parte de una máquina de estados con lo que hace."
    libro: [140, 141, 142]
    emparejar:
      - ["Registro de estado", "Los biestables que guardan en cuál está"]
      - ["Lógica de transición", "Decide el estado siguiente con el actual y las entradas"]
      - ["Lógica de salida", "Qué hace el circuito en cada estado"]
    exito: "Biestables y lógica combinacional: las piezas de las secciones anteriores."
    pistas:
      - { texto: "Solo una de las tres tiene memoria." }
    escalera: ["La transición mira el estado actual y las entradas."]
    solucion: "Registro, transición y salida, en ese orden."

  - id: pregunta-mealy
    tipo: pregunta
    titulo: "Moore o Mealy"
    texto: "¿Qué inconveniente tiene una máquina de Mealy frente a una de Moore?"
    libro: [145, 146]
    widget:
      tipo: figura
      figura: fig-29.8
      zonas:
        - { id: pulsado, rotulo: "Abajo a la derecha", rect: [310, 118, 60, 60], texto: "Pulsado: la salida depende solo del estado." }
    opciones:
      - { texto: "Hereda los glitches de las entradas: hay un camino combinacional de entrada a salida", bien: true, porque: "A cambio responde en el mismo ciclo; la de Moore reacciona un ciclo más tarde." }
      - { texto: "Reacciona un ciclo más tarde", porque: "Ese es el precio de la de Moore. La de Mealy responde en el mismo ciclo." }
      - { texto: "Necesita más biestables", porque: "No es cuestión de biestables: la diferencia está en la lógica de salida." }
    escalera: ["¿De qué depende la salida en cada una?"]
    solucion: "Su salida depende de las entradas: hereda sus glitches."

  - id: explore-one-hot
    tipo: explorar
    titulo: "Un biestable por estado"
    texto: "Tres flip-flops en anillo, con un solo 1 que da la vuelta. Mueva el cursor: cada LED es un estado."
    libro: [151, 164, "cap29#39"]
    widget:
      tipo: logica
      entradas: [{ id: CLK, reloj: true }]
      piezas:
        - { id: f1, tipo: d, entradas: [f3.q, CLK], inicial: 1 }
        - { id: f2, tipo: d, entradas: [f1.q, CLK] }
        - { id: f3, tipo: d, entradas: [f2.q, CLK] }
      salidas:
        - { id: E0, de: f1.q }
        - { id: E1, de: f2.q }
        - { id: E2, de: f3.q }
      cronograma: { ciclos: 6, senales: [CLK, E0, E1, E2] }

  - id: prediga-codificacion
    tipo: predecir
    titulo: "Dieciséis estados"
    texto: "Una máquina tiene 16 estados. ¿Cuántos biestables necesita en binaria y cuántos en one-hot?"
    libro: [150, 151, 169]
    widget:
      tipo: logica
      entradas: [{ id: CLK, reloj: true }]
      piezas:
        - { id: f1, tipo: d, entradas: [f3.q, CLK], inicial: 1 }
        - { id: f2, tipo: d, entradas: [f1.q, CLK] }
        - { id: f3, tipo: d, entradas: [f2.q, CLK] }
      salidas:
        - { id: E0, de: f1.q }
        - { id: E1, de: f2.q }
        - { id: E2, de: f3.q }
      ocultar: true
    opciones:
      - { texto: "4 en binaria y 16 en one-hot", bien: true, porque: "2⁴ = 16 en binaria; one-hot gasta uno por estado, a cambio de una lógica mucho más simple." }
      - { texto: "16 en binaria y 4 en one-hot", porque: "Está al revés: one-hot usa un biestable por estado." }
      - { texto: "4 en las dos", porque: "One-hot no codifica: necesita un biestable por cada estado." }
    escalera: ["Binaria: n biestables para 2ⁿ estados."]
    solucion: "Binaria, 4; one-hot, 16."

  - id: estime-huecos
    tipo: pregunta
    fase: "Estime"
    titulo: "Combinaciones sobrantes"
    texto: "Una máquina de cinco estados usa codificación binaria con tres biestables. ¿Cuántas combinaciones no corresponden a ningún estado?"
    libro: [154]
    estimar:
      objetivo: "huecos"
      unidad: ""
      min: 0
      max: 8
      paso: 1
      inicio: 6
      tol: 0.01
      rotulo: "Combinaciones sobrantes"
    exito: "Tres: un transitorio puede dejar el registro en una de ellas."
    pistas:
      - { cuando: { valor: estimacion, mayor: 3 }, texto: "Se ha pasado: reste los cinco estados usados a las ocho combinaciones." }
      - { texto: "Se ha quedado corto: tres biestables dan 2³ = 8 combinaciones." }
    escalera: ["Tres biestables dan 2³ combinaciones."]
    solucion: "8 − 5 = 3."
    comprobar:
      - { huecos: 3, comb: 8, n_est: 5 }

  - id: pregunta-bloqueo
    tipo: pregunta
    titulo: "Una máquina bloqueada"
    texto: "Una interferencia deja el registro en una combinación sin estado y el sistema deja de responder. ¿Cómo se evita?"
    libro: [155, 156]
    widget:
      tipo: figura
      figura: fig-29.8
      zonas:
        - { id: reposo, rotulo: "Arriba a la izquierda", rect: [79, 10, 60, 60], texto: "Reposo." }
    opciones:
      - { texto: "Haciendo que todo estado no definido vaya al reposo", bien: true, porque: "En HDL es «when others» o «default»; omitirla es un error clásico." }
      - { texto: "Quitando la alimentación cuando pase", porque: "Es el síntoma, no la solución: hay que escribir la salida explícita al reposo." }
      - { texto: "Usando más biestables", porque: "Con más biestables hay aún más combinaciones sin estado." }
    escalera: ["¿Adónde debería ir la máquina si se pierde?"]
    solucion: "Todo estado no definido va al reposo."

  - id: ordene-diseno
    tipo: pregunta
    fase: "Ordene"
    titulo: "El diseño, paso a paso"
    texto: "Ponga en orden los siete pasos."
    libro: [158]
    ordenar:
      - "Enumerar los estados y darles nombre."
      - "Dibujar el diagrama con las transiciones y su condición."
      - "Comprobar que de cada estado se sale sin ambigüedad ni huecos."
      - "Decidir las salidas de cada estado."
      - "Elegir la codificación."
      - "Escribirla, con el reposo por defecto."
      - "Añadir un tiempo de expiración en los estados que esperan."
    exito: "El último paso separa una máquina de laboratorio de una que funciona en campo."
    pistas:
      - { texto: "Primero los estados y el diagrama; la codificación y el código, al final." }
    escalera: ["No se puede elegir la codificación sin saber cuántos estados hay."]
    solucion: "Estados, diagrama, comprobación, salidas, codificación, escritura y expiración."

  - id: porque-contador
    tipo: porque
    titulo: "¿Un contador es una máquina?"
    texto: "El libro dice que un contador es una máquina de estados. ¿Por qué?"
    libro: [164]
    widget:
      tipo: logica
      entradas: [{ id: CLK, reloj: true }]
      piezas:
        - { id: c1, tipo: contador, bits: 2, entradas: [CLK] }
      salidas:
        - { id: Q1, de: c1.q1 }
        - { id: Q0, de: c1.q0 }
    opciones:
      - { texto: "Su estado es la cuenta y su diagrama es un ciclo", bien: true, porque: "Un registro de estado más una lógica de transición que suma uno: tan regular que no hace falta dibujarlo." }
      - { texto: "Porque tiene entradas y salidas", porque: "Un circuito combinacional también las tiene; lo que hace falta es estado y transiciones." }
      - { texto: "No lo es: no tiene lógica de transición", porque: "La tiene: es la que suma uno en cada flanco." }
    escalera: ["¿Qué guarda un contador y cómo pasa de un valor al siguiente?"]
    solucion: "Estado = cuenta; transición = sumar uno; diagrama = un ciclo."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [140, 147, 151, 156]
    ideas:
      - { titulo: "Tres partes.", texto: "Registro de estado, lógica de transición y lógica de salida." }
      - { titulo: "Moore por defecto.", texto: "Salida limpia; Mealy solo si un ciclo de latencia no se admite." }
      - { titulo: "Codificación.", texto: "Binaria, one-hot o Gray, según lo que escasee." }
      - { titulo: "Sin bloqueos.", texto: "Todo estado no definido va al reposo." }
