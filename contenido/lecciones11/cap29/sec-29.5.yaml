# Lección de la sección 28.5 «Registros, Contadores y Máquinas de Estados» (cap29; etiqueta interna sec-29.5). Formato: contenido/lecciones11/GUIA.md (§11).
# 1.2.1 («aprender haciendo», GUIA §13): el recorrido de una pulsación limpia y el estado siguiente se tocan en el
# diagrama del antirrebote (figura 28.9); los biestables de 16 estados en binaria y las combinaciones sobrantes se
# escriben; el contador de dos bits, la máquina más regular, se dibuja. Quedan dos preguntas de opciones (Mealy y el
# bloqueo). La exploración one-hot sigue sin objetivo (cronograma).
leccion: cap29/sec-29.5

libro:
  138: "en cada flanco de reloj, pasa de un estado a otro según sus entradas"
  145: "Moore: la salida depende solo del estado"
  146: "hereda los glitches de las entradas"
  147: "Moore por defecto, porque su salida es limpia y analizable"
  150: "Binaria: n biestables para 2ⁿ estados"
  151: "One-hot: un biestable por estado, con uno solo activo"
  154: "cinco estados en tres biestables, hay tres combinaciones que no corresponden a ningún estado"
  "cap09#64": "ignorando cambios durante unos 20 ms tras el primero"
  "cap29#39": "A+B"
  155: "la máquina puede quedarse bloqueada fuera de su diagrama"
  169: "con los biestables que necesitan para los 4 estados del diagrama y para 16 estados"
  156: "todo estado no definido va al estado de reposo"
  164: "Un contador es una máquina de estados cuyo diagrama es un ciclo"
  170: "Máquina de estados de un antirrebote, con sus cuatro estados y sus transiciones"

modelo:
  valores:
    n_ff: { sim: "n", nombre: "biestables", unidad: "", valor: 3 }
    n_est: { sim: "estados", nombre: "estados usados", unidad: "", valor: 5 }
    n_e16: { sim: "N", nombre: "estados de la máquina grande", unidad: "", valor: 16 }
  calculos:
    comb: { expr: "2^n_ff", sim: "combinaciones", nombre: "combinaciones de los biestables", unidad: "", cifras: 2 }
    huecos: { expr: "2^n_ff - n_est", sim: "sobrantes", nombre: "combinaciones sin estado", unidad: "", cifras: 2 }

tarjetas:
  - id: explore-antirrebote
    tipo: tocar
    titulo: "Un antirrebote como máquina"
    texto: "Una pulsación limpia, sin rebotes, de principio a fin. Toque los estados en el orden en que los recorre la máquina."
    libro: [138, 170, "cap09#64", "cap29#39"]
    widget:
      tipo: figura
      figura: fig-29.8
      zonas:
        - { id: reposo, rotulo: "Arriba a la izquierda", rect: [79, 10, 62, 62] }
        - { id: posible-pulsacion, rotulo: "Arriba a la derecha", rect: [310, 10, 62, 62] }
        - { id: pulsado, rotulo: "Abajo a la derecha", rect: [310, 118, 62, 62] }
        - { id: posible-suelta, rotulo: "Abajo a la izquierda", rect: [79, 118, 62, 62] }
    tocar:
      bien: [reposo, posible-pulsacion, pulsado, posible-suelta]
      orden: true
    exito: "En cada flanco de reloj pasa de un estado a otro según su entrada. Las flechas de rebote lo devuelven atrás si la entrada cambia antes de 20 ms."
    escalera:
      - "Empiece por el estado con salida 0 donde espera la máquina."
    solucion: "Reposo, posible pulsación, pulsado y posible suelta."

  - id: toque-siguiente
    tipo: tocar
    titulo: "El estado siguiente"
    texto: "La máquina está en posible pulsación y la entrada sigue a 0 más de 20 ms. Toque el estado al que pasa."
    libro: [138, 170, "cap09#64", "cap29#39"]
    widget:
      tipo: figura
      figura: fig-29.8
      zonas:
        - { id: reposo, rotulo: "Arriba a la izquierda", rect: [79, 10, 60, 60] }
        - { id: posible-pulsacion, rotulo: "Arriba a la derecha", rect: [310, 10, 60, 60] }
        - { id: pulsado, rotulo: "Abajo a la derecha", rect: [310, 118, 60, 60] }
        - { id: posible-suelta, rotulo: "Abajo a la izquierda", rect: [79, 118, 60, 60] }
    tocar:
      bien: [pulsado]
      porque:
        reposo: "A reposo vuelve si la entrada rebota a 1 antes de 20 ms; aquí ha seguido a 0."
        posible-pulsacion: "Es donde está: tras 20 ms con la entrada a 0, sale de él."
        posible-suelta: "A posible suelta se llega desde pulsado, cuando la entrada pasa a 1."
    exito: "Pulsado: la pulsación queda confirmada y la salida pasa a 1."
    escalera: ["Siga la flecha que sale de posible pulsación con la condición de más de 20 ms."]
    solucion: "Abajo a la derecha: pulsado."

  - id: pregunta-mealy
    tipo: porque
    titulo: "Moore o Mealy"
    texto: "¿Qué inconveniente tiene una máquina de Mealy frente a una de Moore?"
    libro: [145, 146]
    widget:
      tipo: figura
      figura: fig-29.8
      zonas:
        - { id: pulsado, rotulo: "Abajo a la derecha", rect: [310, 118, 60, 60], texto: "Pulsado: la salida depende solo del estado." }
    opciones:
      - { texto: "Hereda los glitches de las entradas: hay un camino combinacional de entrada a salida", bien: true, porque: "A cambio responde en el mismo ciclo; la de Moore reacciona un ciclo más tarde." }
      - { texto: "Reacciona un ciclo más tarde", porque: "Ese es el precio de la de Moore. La de Mealy responde en el mismo ciclo." }
      - { texto: "Necesita más biestables", porque: "No es cuestión de biestables: la diferencia está en la lógica de salida." }
    escalera: ["¿De qué depende la salida en cada una?"]
    solucion: "Su salida depende de las entradas: hereda sus glitches."

  - id: explore-one-hot
    tipo: explorar
    titulo: "Un biestable por estado"
    texto: "Tres flip-flops en anillo, con un solo 1 que da la vuelta: cada LED es un estado. Dé pulsos hasta llegar al estado E2."
    libro: [151, 164]
    widget:
      tipo: logica
      entradas: [{ id: CLK, reloj: true }]
      piezas:
        - { id: f1, tipo: d, entradas: [f3.q, CLK], inicial: 1 }
        - { id: f2, tipo: d, entradas: [f1.q, CLK] }
        - { id: f3, tipo: d, entradas: [f2.q, CLK] }
      salidas:
        - { id: E0, de: f1.q }
        - { id: E1, de: f2.q }
        - { id: E2, de: f3.q }
    objetivo:
      condiciones:
        - { led: E2, valor: 1, rotulo: "E2 activo" }
      logrado: "Un pulso por estado, y siempre uno solo activo: decodificar el estado es mirar un biestable."
      pistas:
        - { texto: "Cada pulso pasa el 1 al siguiente biestable." }
    escalera: ["El 1 avanza un biestable por pulso."]
    solucion: "Dos pulsos de reloj."

  - id: prediga-codificacion
    tipo: leer
    titulo: "Dieciséis estados"
    texto: "Una máquina tiene 16 estados. Escriba cuántos biestables necesita con codificación binaria."
    libro: [150, 151, 169]
    widget:
      tipo: logica
      entradas: [{ id: CLK, reloj: true }]
      piezas:
        - { id: c1, tipo: contador, bits: 4, entradas: [CLK] }
      salidas:
        - { id: Q3, de: c1.q3 }
        - { id: Q2, de: c1.q2 }
        - { id: Q1, de: c1.q1 }
        - { id: Q0, de: c1.q0 }
    leer:
      objetivo: "log2(n_e16)"
      unidad: ""
      tol: 0.01
      rotulo: "Biestables en binaria"
      errores:
        - { expr: "n_e16", texto: "Eso son los de one-hot, uno por estado. En binaria, n biestables dan 2ⁿ estados." }
    exito: "Cuatro, como el contador de la figura: 2⁴ = 16. En one-hot harían falta 16, a cambio de una lógica mucho más simple."
    escalera: ["Binaria: n biestables para 2ⁿ estados."]
    solucion: "2⁴ = 16: cuatro biestables."
    comprobar:
      - { n_e16: 16 }

  - id: estime-huecos
    tipo: leer
    titulo: "Combinaciones sobrantes"
    texto: "Una máquina de cinco estados usa codificación binaria con tres biestables. Escriba cuántas combinaciones no corresponden a ningún estado."
    libro: [154]
    widget:
      tipo: logica
      entradas: [{ id: CLK, reloj: true }]
      piezas:
        - { id: c1, tipo: contador, bits: 3, entradas: [CLK] }
      salidas:
        - { id: Q2, de: c1.q2 }
        - { id: Q1, de: c1.q1 }
        - { id: Q0, de: c1.q0 }
    leer:
      objetivo: huecos
      unidad: ""
      tol: 0.01
      rotulo: "Combinaciones sobrantes"
      errores:
        - { expr: "comb", texto: "Esas son todas las combinaciones de tres biestables. Reste los cinco estados que se usan." }
    exito: "{{huecos}}: un transitorio, una interferencia o un fallo de alimentación pueden dejar el registro en una de ellas."
    escalera: ["Tres biestables dan 2³ combinaciones."]
    solucion: "8 − 5 = 3."
    comprobar:
      - { huecos: 3, comb: 8, n_est: 5 }

  - id: pregunta-bloqueo
    tipo: tocar
    titulo: "Una máquina bloqueada"
    texto: "Una interferencia deja el registro de esta máquina en una combinación sin estado. Toque el estado al que debe llevarla la lógica."
    libro: [155, 156, 169]
    widget:
      tipo: figura
      figura: fig-29.7
      zonas:
        - { id: reposo, rotulo: "Arriba a la izquierda", rect: [31, 37, 52, 52] }
        - { id: mide, rotulo: "Arriba a la derecha", rect: [153, 37, 52, 52] }
        - { id: error, rotulo: "Abajo a la izquierda", rect: [31, 134, 52, 52] }
        - { id: envia, rotulo: "Abajo a la derecha", rect: [153, 134, 52, 52] }
    tocar:
      bien: [reposo]
      porque:
        mide: "Ir a medir desde un estado desconocido supone que todo está listo. El punto seguro es el de partida."
        error: "Error espera un fallo de envío concreto; el punto seguro para cualquier combinación sin estado es el de partida."
        envia: "Enviar sin haber medido mandaría un dato sin sentido."
    exito: "Todo estado no definido va al reposo. En HDL es «when others» o «default»; omitirlo deja una máquina que solo se recupera quitando la alimentación."
    escalera: ["¿Cuál es el estado de partida, el que no supone nada?"]
    solucion: "Arriba a la izquierda: reposo."

  - id: porque-contador
    tipo: dibujar
    titulo: "Un contador es una máquina"
    texto: "Un contador es una máquina de estados cuyo diagrama es un ciclo que vuelve al principio. Dibuje su bit alto, Q1."
    libro: [164, "cap29#39"]
    widget:
      tipo: logica
      entradas: [{ id: CLK, reloj: true }]
      piezas:
        - { id: c1, tipo: contador, bits: 2, entradas: [CLK] }
      salidas:
        - { id: Q1, de: c1.q1 }
        - { id: Q0, de: c1.q0 }
      cronograma: { ciclos: 8, senales: [CLK, Q0] }
      dibujo: false
    dibujar:
      senal: Q1
    exito: "Estado = la cuenta; transición = sumar uno. Tan regular que se construye sin dibujar el diagrama."
    escalera:
      - "Q1 cambia cada dos flancos: cuando Q0 baja."
    solucion: "Q1 sube en el segundo flanco, baja en el cuarto, y así cada dos."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [147, 151, 156]
    ideas:
      - { titulo: "Estados y transiciones.", texto: "En cada flanco pasa de un estado a otro según sus entradas." }
      - { titulo: "Moore por defecto.", texto: "Salida limpia; Mealy solo si un ciclo de latencia no se admite." }
      - { titulo: "Codificación.", texto: "Binaria, one-hot o Gray, según lo que escasee." }
      - { titulo: "Sin bloqueos.", texto: "Todo estado no definido va al reposo." }
