# Lección de la sección 28.4 «Lógica Secuencial: la Memoria» (cap29; etiqueta interna sec-29.4). Formato: contenido/lecciones11/GUIA.md (§11).
# El latch SR son dos NAND cruzadas con entradas activas a nivel bajo (S y R en reposo a 1); el latch D, el SR con
# dos NAND de habilitación y un inversor. pregunta-latch-ff compara en un cronograma la pieza `latch` (motor12e, con EN =
# reloj invertido: cambia medio ciclo antes) y el flip-flop D.
# 1.2.1 («aprender haciendo», GUIA §13): las dos NAND de habilitación del latch D se rellenan en su tabla; la Q del
# latch y la del flip-flop, con el mismo D, se dibujan una tras otra; el JK y el T se dibujan. Queda una pregunta de
# opciones (el tiempo para la lógica). La exploración del SR queda sin objetivo hasta que «logica» admita uno.
leccion: cap29/sec-29.4

libro:
  106: "Un circuito secuencial depende además de lo que ocurrió antes"
  107: "Dos inversores enfrentados se sostienen mutuamente en uno de dos estados estables"
  108: "el latch SR con dos NAND cruzadas"
  111: "Mientras esa señal está activa, la salida sigue a la entrada"
  112: "Captura el valor de la entrada en el instante del flanco de reloj y lo mantiene hasta el siguiente"
  113: "con un flip-flop, el instante de captura está definido y los tiempos se pueden analizar"
  116: "Su estado con ambas activas es indeterminado"
  118: "definiendo el estado con ambas entradas activas como «conmutar»"
  119: "es un JK con J = K = 1. Divide la frecuencia por dos"
  122: "hasta 20 ns garantizados en un 74HC74 a 4,5 V"
  123: "a menudo 0 ns garantizados"
  125: "el tiempo disponible para la lógica es el periodo menos el clock-to-Q y menos el setup"

modelo:
  valores: {}
  calculos: {}

tarjetas:
  - id: explore-latch-sr
    tipo: explorar
    titulo: "Dos NAND cruzadas"
    texto: "S̄ y R̄ son activas a nivel bajo. Ponga el cerrojo a 0 y deje después S̄ y R̄ en reposo, a 1."
    libro: [106, 107, 108]
    widget:
      tipo: logica
      entradas: [{ id: S, valor: 1, rotulo: "S̄" }, { id: R, valor: 1, rotulo: "R̄" }]
      piezas:
        - { id: n1, tipo: nand, entradas: [S, n2] }
        - { id: n2, tipo: nand, entradas: [R, n1] }
      salidas:
        - { id: Q, de: n1 }
        - { id: NQ, de: n2, rotulo: "Q̄" }
    objetivo:
      condiciones:
        - { led: Q, valor: 0, rotulo: "Q a 0" }
        - { senal: S, valor: 1, rotulo: "S̄ en reposo" }
        - { senal: R, valor: 1, rotulo: "R̄ en reposo" }
      logrado: "Con S̄ y R̄ en reposo, el lazo recuerda el último 0 de R̄: es memoria. Con las dos a 0 a la vez, Q y Q̄ subirían juntas."
      pistas:
        - { cuando: { senal: R, valor: 0 }, texto: "Ya está a 0: vuelva R̄ al reposo." }
        - { texto: "Ponga R̄ a 0 un momento." }
    escalera: ["R̄ a 0 y otra vez a 1."]
    solucion: "Un pulso a 0 en R̄: Q queda a 0 con las dos entradas en reposo."

  - id: tabla-habilitacion
    tipo: tabla
    titulo: "Cómo se escribe un latch D"
    texto: "Dos NAND de habilitación generan S̄ y R̄ para el SR a partir de D y EN. Rellene las dos columnas."
    libro: [108, 111]
    widget:
      tipo: logica
      entradas: [D, EN]
      piezas:
        - { id: nd, tipo: not, entradas: [D] }
        - { id: a1, tipo: nand, entradas: [D, EN] }
        - { id: a2, tipo: nand, entradas: [nd, EN] }
      salidas:
        - { id: SN, de: a1, rotulo: "S̄" }
        - { id: RN, de: a2, rotulo: "R̄" }
      ocultar: true
    tabla:
      salidas: [SN, RN]
    exito: "Con EN = 0, las dos a 1: el SR mantiene. Con EN = 1, D = 1 activa S̄ y D = 0 activa R̄: la salida copia D. Nunca las dos a la vez."
    escalera:
      - "Una NAND con EN = 0 da 1, valga lo que valga D."
    solucion: "S̄ = 0 solo con D = 1, EN = 1; R̄ = 0 solo con D = 0, EN = 1."

  - id: explore-latch-d
    tipo: dibujar
    titulo: "Un latch D, transparente"
    texto: "El latch está habilitado mientras el reloj está bajo. Dibuje su salida QL: copia D mientras está habilitado."
    nota: "El latch, habilitado con el reloj invertido."
    libro: [111]
    widget:
      tipo: logica
      entradas: [D, { id: CLK, reloj: true }]
      piezas:
        - { id: n1, tipo: not, entradas: [CLK] }
        - { id: l1, tipo: latch, entradas: [D, n1] }
      salidas:
        - { id: QL, de: l1.q, rotulo: "Q del latch" }
      cronograma: { ciclos: 6, estimulo: { D: "011010" }, senales: [CLK, D] }
      dibujo: false
    dibujar:
      senal: QL
    exito: "Mientras está habilitado, la salida sigue a la entrada: el latch es transparente. Al deshabilitarse, congela el último valor."
    escalera:
      - "Con el reloj bajo, QL = D; con el reloj alto, QL no se mueve."
    solucion: "QL cambia en cuanto cambia D, en el tramo bajo del reloj."

  - id: explore-flip-flop
    tipo: dibujar
    titulo: "Un flip-flop D, por flanco"
    texto: "El mismo D llega ahora a un flip-flop. Dibuje su Q: solo mira D en el flanco de subida."
    libro: [112, 113]
    widget:
      tipo: logica
      entradas: [D, { id: CLK, reloj: true }]
      piezas:
        - { id: f1, tipo: d, entradas: [D, CLK] }
      salidas:
        - { id: Q, de: f1.q }
      cronograma: { ciclos: 6, estimulo: { D: "011010" }, senales: [CLK, D] }
      dibujo: false
    dibujar:
      senal: Q
    exito: "Medio ciclo después que el latch: el flip-flop es sensible al flanco y el instante de captura está definido. Por eso el diseño síncrono usa flip-flops."
    escalera:
      - "Q solo cambia en los flancos de subida, con lo que vale D en ese instante."
    solucion: "Q repite D, pero cambiando solo en los flancos de subida."

  - id: dibuje-jk
    tipo: dibujar
    titulo: "El JK resuelve el SR"
    texto: "J pone a 1 y K a 0; con las dos activas, el JK conmuta en lugar de quedar indeterminado. Dibuje Q."
    libro: [116, 118]
    widget:
      tipo: logica
      entradas: [J, K, { id: CLK, reloj: true }]
      piezas:
        - { id: f1, tipo: jk, entradas: [J, K, CLK] }
      salidas:
        - { id: Q, de: f1.q }
      cronograma: { ciclos: 6, estimulo: { J: "101110", K: "011100" }, senales: [CLK, J, K] }
      dibujo: false
    dibujar:
      senal: Q
    exito: "Poner, borrar, conmutar dos veces, poner y mantener. Hoy se implementa con un D y algo de lógica, pero el concepto sigue."
    escalera:
      - "Con J = K = 1, Q cambia en cada flanco."
    solucion: "Q: 1, 0, 1, 0, 1, 1."

  - id: dibuje-t
    tipo: dibujar
    titulo: "Un flip-flop T"
    texto: "Con T = 1, el flip-flop conmuta en cada flanco: es un JK con J = K = 1. Dibuje su salida Q."
    libro: [119]
    widget:
      tipo: logica
      entradas: [{ id: CLK, reloj: true }]
      piezas:
        - { id: t1, tipo: t, entradas: ["1", CLK] }
      salidas:
        - { id: Q, de: t1.q }
      cronograma: { ciclos: 6, senales: [CLK] }
      dibujo: false
    dibujar:
      senal: Q
    exito: "Divide la frecuencia por dos; encadenando varios se obtiene un contador."
    escalera:
      - "Q cambia en cada flanco de subida, y solo ahí."
      - "Empieza en 0: sube en el primer flanco y baja en el segundo."
    solucion: "Una onda cuadrada de la mitad de frecuencia que el reloj."

  - id: pregunta-presupuesto
    tipo: porque
    titulo: "El tiempo para la lógica"
    texto: "Entre dos flip-flops, ¿cuánto tiempo queda para la lógica combinacional?"
    libro: [122, 123, 125]
    widget:
      tipo: logica
      entradas: [D, { id: CLK, reloj: true }]
      piezas:
        - { id: f1, tipo: d, entradas: [D, CLK] }
        - { id: g1, tipo: not, entradas: [f1.q] }
        - { id: f2, tipo: d, entradas: [g1, CLK] }
      salidas:
        - { id: Q2, de: f2.q }
    opciones:
      - { texto: "El periodo menos el clock-to-Q y menos el setup", bien: true, porque: "Esa resta fija la frecuencia máxima. En un 74HC74 a 4,5 V, el setup garantizado llega a 20 ns; el hold, a menudo 0 ns." }
      - { texto: "El periodo entero", porque: "El dato tarda en salir del primero (clock-to-Q) y debe llegar antes del setup del segundo." }
      - { texto: "El periodo menos el hold", porque: "El hold no resta del periodo: es otra condición, la de no llegar demasiado pronto." }
    escalera: ["El dato sale tarde del primero y debe llegar pronto al segundo."]
    solucion: "T − t_{clock-to-Q} − t_{su}."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [107, 111, 112, 113, 125]
    ideas:
      - { titulo: "Memoria.", texto: "Dos inversores, o dos NAND, enfrentados: dos estados estables." }
      - { titulo: "Latch y flip-flop.", texto: "Por nivel, transparente; por flanco, con el instante de captura definido." }
      - { titulo: "Tiempos.", texto: "Setup y hold alrededor del flanco; la lógica cabe en el periodo menos clock-to-Q y setup." }
