# Lección 1.2 de la sección 28.1 «Del Mundo Analógico al Digital» (cap29; etiqueta interna sec-29.1). Formato: contenido/lecciones11/GUIA.md.
leccion: cap29/sec-29.1

libro:
  7: "esa degradación es irreversible"
  8: "mientras el ruido no llegue a la mitad de la separación entre niveles"
  10: "Se puede copiar sin pérdida, indefinidamente"
  11: "Se puede transmitir a distancia con repetidores que regeneran en lugar de amplificar"
  12: "Se puede almacenar sin degradación"
  13: "no es que sea mejor procesando, es que no se degrada"
  15: "con la calidad de un CD (44,1 kHz y 16 bits), son 706 kbit/s"
  16: "Se puede hacer tan pequeño como se quiera añadiendo bits, y nunca es cero"
  17: "esos convertidores son componentes analógicos con todos sus problemas"
  18: "en un lazo de control eso es fase"
  25: "sus flancos, sus umbrales, su ruido y su temporización son problemas analógicos disfrazados"
  26: "no hay circuitos digitales, hay circuitos analógicos que se interpretan como digitales"
  30: "La tendencia es convertir lo antes posible"
  34: "Degradación acumulativa de una señal analógica frente a la regeneración digital"

modelo:
  valores:
    f_m: { sim: "f_{m}", nombre: "frecuencia de muestreo", unidad: Hz, valor: 44100 }
    n_b: { sim: "n", nombre: "bits por muestra", unidad: "", valor: 16 }
  calculos:
    R_b: { expr: "f_m*n_b", sim: "R", nombre: "flujo de un canal", unidad: "bit/s" }

tarjetas:
  - id: explore-regeneracion
    tipo: explorar
    titulo: "Cuatro etapas"
    texto: "Arriba, una señal analógica pasa por cuatro etapas; abajo, una digital. Toque la cuarta etapa de cada una."
    libro: [7, 8, 34]
    widget:
      tipo: figura
      figura: fig-29.1
      zonas:
        - { id: ana0, rotulo: "Arriba, la primera traza", rect: [31, 6, 367, 36], texto: "La original analógica." }
        - { id: ana4, rotulo: "Arriba, la última traza", rect: [31, 111, 367, 36], texto: "Cada etapa atenúa y suma ruido: la degradación es irreversible." }
        - { id: dig0, rotulo: "Abajo, la primera traza", rect: [31, 166, 367, 34], texto: "La original digital." }
        - { id: dig4, rotulo: "Abajo, la última traza", rect: [31, 269, 367, 36], texto: "Llega con ruido, pero el receptor decide con el umbral y la regenera tal cual." }
    requiere: { mover: [ana4, dig4] }

  - id: toque-irrecuperable
    tipo: tocar
    titulo: "Lo que ya no vuelve"
    texto: "Toque la señal que ya no se puede devolver a su forma original."
    libro: [7, 8, 34]
    widget:
      tipo: figura
      figura: fig-29.1
      zonas:
        - { id: ana0, rotulo: "Arriba, la primera traza", rect: [31, 6, 367, 36] }
        - { id: ana4, rotulo: "Arriba, la última traza", rect: [31, 111, 367, 36] }
        - { id: dig0, rotulo: "Abajo, la primera traza", rect: [31, 166, 367, 34] }
        - { id: dig4, rotulo: "Abajo, la última traza", rect: [31, 269, 367, 36] }
    tocar:
      bien: [ana4]
      porque:
        ana0: "Es la original: todavía no ha pasado por ninguna etapa."
        dig0: "Es la original digital, limpia."
        dig4: "Trae ruido, pero mientras no llegue a la mitad de la separación entre niveles, el receptor la reconstruye exacta."
    exito: "La analógica de la cuarta etapa: no hay forma de saber qué parte era la original."
    escalera: ["¿Cuál de las dos tiene un umbral con el que decidir?"]
    solucion: "Arriba, la última traza: la degradación analógica es irreversible."

  - id: prediga-limite
    tipo: predecir
    titulo: "¿Hasta cuándo se regenera?"
    texto: "Un receptor digital decide con un umbral. ¿Hasta qué ruido reconstruye exactamente la señal?"
    libro: [8]
    widget:
      tipo: figura
      figura: fig-29.1
      zonas:
        - { id: dig4, rotulo: "Abajo, la última traza", rect: [31, 269, 367, 36], texto: "Señal recibida con ruido y la regenerada." }
    opciones:
      - { texto: "Mientras no llegue a la mitad de la separación entre niveles", bien: true, porque: "Hasta ahí, cada muestra cae del lado correcto del umbral y se decide bien." }
      - { texto: "Con cualquier ruido: lo digital no se degrada", porque: "Tiene un límite: si el ruido cruza el umbral, el receptor decide mal." }
      - { texto: "Solo si no hay ruido", porque: "Ese es el caso analógico. El digital tolera ruido hasta media separación entre niveles." }
    escalera: ["El umbral está en medio de los dos niveles."]
    solucion: "Hasta la mitad de la separación entre niveles."

  - id: pregunta-razon
    tipo: pregunta
    titulo: "La razón real"
    texto: "¿Por qué se ha vuelto digital casi todo?"
    libro: [10, 13]
    widget:
      tipo: figura
      figura: fig-29.1
      zonas:
        - { id: dig4, rotulo: "Abajo, la última traza", rect: [31, 269, 367, 36], texto: "La señal regenerada." }
    opciones:
      - { texto: "Porque no se degrada: se copia, transmite y almacena sin pérdida", bien: true, porque: "No es que procese mejor: es la regeneración la que lo explica todo." }
      - { texto: "Porque procesa mejor", porque: "El libro lo descarta: la razón real es que no se degrada." }
      - { texto: "Porque necesita menos ancho de banda", porque: "Es al revés: representar con n bits exige transmitir n veces más información." }
    escalera: ["Piense en lo que la figura muestra tras cuatro etapas."]
    solucion: "No se degrada."

  - id: empareje-consecuencias
    tipo: pregunta
    fase: "Empareje"
    titulo: "Tres consecuencias"
    texto: "Una cada acción con lo que permite la regeneración."
    libro: [10, 11, 12]
    emparejar:
      - ["Copiar", "Sin pérdida, indefinidamente"]
      - ["Transmitir", "Con repetidores que regeneran en lugar de amplificar"]
      - ["Almacenar", "Sin degradación"]
    exito: "Las tres definen la electrónica moderna."
    pistas:
      - { texto: "Los repetidores son cosa de la distancia." }
    escalera: ["Un repetidor está en medio de una línea larga."]
    solucion: "Copiar sin pérdida; transmitir con repetidores que regeneran; almacenar sin degradación."

  - id: estime-cd
    tipo: pregunta
    fase: "Estime"
    titulo: "Un canal de CD"
    texto: "Un canal de audio con la calidad de un CD: 44,1 kHz y 16 bits por muestra. ¿Cuántos bits por segundo son?"
    libro: [15]
    estimar:
      objetivo: "R_b"
      unidad: "bit/s"
      min: 0
      max: 2000000
      paso: 1000
      inicio: 1500000
      tol: 0.02
      rotulo: "Flujo de un canal"
    exito: "706 kbit/s, frente a los 20 kHz del canal analógico; la pareja estéreo pasa de 1,4 Mbit/s."
    pistas:
      - { cuando: { valor: estimacion, mayor: 720000 }, texto: "Se ha pasado: es un solo canal, no la pareja estéreo." }
      - { texto: "Se ha quedado corto: cada muestra, 44,1 mil por segundo, lleva 16 bits." }
    escalera: ["Bits por segundo = muestras por segundo × bits por muestra."]
    solucion: "44,1 kHz × 16 bits = 706 kbit/s."
    comprobar:
      - { R_b: 705600 }

  - id: empareje-precio
    tipo: pregunta
    fase: "Empareje"
    titulo: "Lo que se paga"
    texto: "Una cada coste del digital con su explicación."
    libro: [15, 16, 17, 18]
    emparejar:
      - ["Ancho de banda", "n bits exigen transmitir n veces más información"]
      - ["Cuantificación", "Un error que nunca es cero"]
      - ["Complejidad", "Convertidores, que son componentes analógicos"]
      - ["Latencia", "Procesar lleva tiempo: en un lazo de control es fase"]
    exito: "El digital no es gratis: estos cuatro son su precio."
    pistas:
      - { texto: "La cuantificación se hace tan pequeña como se quiera añadiendo bits, pero no desaparece." }
    escalera: ["La latencia es una cuestión de tiempo."]
    solucion: "Ancho de banda, cuantificación, complejidad y latencia, en ese orden."

  - id: porque-analogicos
    tipo: porque
    titulo: "No hay circuitos digitales"
    texto: "El libro dice que no hay circuitos digitales, sino analógicos que se interpretan como digitales. ¿Por qué?"
    libro: [25, 26]
    widget:
      tipo: figura
      figura: fig-29.1
      zonas:
        - { id: dig4, rotulo: "Abajo, la última traza", rect: [31, 269, 367, 36], texto: "La señal que llega es analógica: con ruido." }
    opciones:
      - { texto: "Sus flancos, umbrales, ruido y temporización son problemas analógicos", bien: true, porque: "Por dentro son transistores con tensiones continuas; los ceros y unos son una interpretación." }
      - { texto: "Porque todos llevan un convertidor", porque: "No hace falta convertidor: la propia puerta es un circuito analógico." }
      - { texto: "Porque la alimentación es analógica", porque: "Lo es, pero el libro va más allá: el circuito digital mismo tiene problemas analógicos." }
    escalera: ["¿Qué es un flanco, físicamente?"]
    solucion: "Flancos, umbrales, ruido y tiempos: problemas analógicos disfrazados."

  - id: pregunta-frontera
    tipo: pregunta
    titulo: "Dónde convertir"
    texto: "¿Qué tendencia sigue el diseño al decidir cuánto hacer en analógico antes de convertir?"
    libro: [30]
    widget:
      tipo: figura
      figura: fig-29.1
      zonas:
        - { id: ana4, rotulo: "Arriba, la última traza", rect: [31, 111, 367, 36], texto: "El analógico deriva y se degrada." }
    opciones:
      - { texto: "Convertir lo antes posible, con el acondicionamiento imprescindible", bien: true, porque: "El procesado digital es exacto y reproducible; el analógico deriva." }
      - { texto: "Hacer todo en analógico y convertir al final", porque: "Más circuito analógico es más deriva y más tolerancias." }
      - { texto: "Convertir sin ningún acondicionamiento", porque: "Hay un acondicionamiento imprescindible que no se puede evitar." }
    escalera: ["¿Cuál de los dos dominios deriva?"]
    solucion: "Lo antes posible, con el acondicionamiento imprescindible."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [8, 13, 15, 26]
    ideas:
      - { titulo: "Regeneración.", texto: "Mientras el ruido no pase de media separación entre niveles, se reconstruye exacta." }
      - { titulo: "La razón.", texto: "Lo digital no se degrada: copiar, transmitir y almacenar sin pérdida." }
      - { titulo: "El precio.", texto: "Ancho de banda, cuantificación, convertidores y latencia." }
      - { titulo: "Por dentro.", texto: "Circuitos analógicos que se interpretan como digitales." }
