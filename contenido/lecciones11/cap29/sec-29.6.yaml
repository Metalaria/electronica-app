# Lección de la sección 28.6 «Memorias» (cap29; etiqueta interna sec-29.6). Formato: contenido/lecciones11/GUIA.md (§11).
# 1.2.1 («aprender haciendo», GUIA §13): se espacian las escrituras de un contador hasta que la Flash dure lo que su
# retención (10 años); en la figura 28.10 se tocan la memoria del registrador, las volátiles y la de calibraciones; la
# vida de la Flash escribiendo cada segundo se calcula y se escribe. Quedan dos preguntas de opciones: el borrado por
# bloques y la protección ante un corte.
leccion: cap29/sec-29.6

libro:
  175: "Seis transistores forman dos inversores realimentados"
  176: "es volátil: al quitar la alimentación se pierde"
  180: "64 ms como máximo en el estándar JEDEC, 32 ms por encima de 85 °C"
  186: "Programar solo puede llevar bits de 1 a 0"
  187: "tras 10 000 a 100 000 ciclos las celdas dejan de retener"
  191: "Es la memoria de calibraciones, configuración y contadores"
  193: "10¹⁴ ciclos de resistencia, es decir, prácticamente ilimitada"
  194: "registradores de datos que escriben continuamente"
  199: "Un contador que se guarde cada segundo agota la Flash en horas o días"
  201: "La defensa es escribir con doble copia y suma de comprobación"
  190: "con más resistencia al desgaste: alrededor de un millón de ciclos"
  202: "Las hojas de datos garantizan la retención durante 10 o 20 años"
  206: "Las cinco tecnologías de memoria situadas por sus dos límites"

modelo:
  valores:
    N_c: { sim: "N", nombre: "ciclos de borrado que aguanta", unidad: "", valor: 100000 }
    T_g: { sim: "T", nombre: "intervalo entre escrituras", unidad: s, valor: 1 }
  calculos:
    t_vida: { expr: "N_c*T_g/3600", sim: "t", nombre: "vida de la Flash", unidad: h, cifras: 3 }
    t_anos: { expr: "N_c*T_g/31557600", sim: "t", nombre: "vida de la Flash, en años", unidad: años, cifras: 3 }

tarjetas:
  - id: explore-memorias
    tipo: explorar
    titulo: "Un contador que gasta la Flash"
    texto: "Un contador se guarda en una Flash de 100 000 ciclos. Espacie las escrituras hasta que dure los 10 años que garantiza su retención."
    libro: [187, 199, 202]
    inicio: { T_g: 1 }
    widget:
      tipo: grafica
      x: { id: tx, min: 1, max: 10000, unidad: s, rotulo: "intervalo entre escrituras", escala: log }
      y: { min: 0.00001, max: 100, unidad: años, rotulo: "vida", escala: log }
      curvas:
        - { expr: "N_c*tx/31557600", color: azul, rotulo: "vida de la Flash" }
      asas:
        - { mueve: T_g, x: "T_g", y: "t_anos", rotulo: "Su intervalo" }
      lectura: { valor: t_anos, rotulo: "Vida de la Flash" }
      datos:
        - { valor: t_vida, rotulo: "En horas: {{t_vida}}" }
      mandos:
        - { valor: T_g, lista: [1, 60, 3600], nombres: ["cada segundo", "cada minuto", "cada hora"], rotulo: "Escribir" }
    objetivo:
      condiciones:
        - { valor: t_anos, min: 10, rotulo: "Vida: {{t_anos}}" }
      logrado: "Escribiendo {{T_g}} entre cada dos, {{t_anos}}. Cada escritura gasta el óxido: por eso no se escribe en Flash dentro de un bucle."
      pistas:
        - { texto: "Aún se agota antes: escriba con menos frecuencia." }
    escalera: ["Vida = ciclos × intervalo."]
    solucion: "Cada hora: 100 000 horas, unos 11 años."
    comprobar:
      - { con: { T_g: 3600 }, t_anos: 11.4, tol: 0.01 }

  - id: toque-registrador
    tipo: tocar
    titulo: "Un registrador de datos"
    texto: "Un registrador escribe continuamente y debe conservar el dato ante un corte sin aviso. Toque la memoria que le conviene."
    libro: [193, 194, 206]
    widget:
      tipo: figura
      figura: fig-29.9
      zonas:
        - { id: flash, rotulo: "Arriba a la izquierda", rect: [50, 6, 46, 58] }
        - { id: eeprom, rotulo: "Arriba, junto a la anterior", rect: [98, 30, 85, 38] }
        - { id: fram, rotulo: "Abajo en el centro", rect: [238, 120, 78, 38] }
        - { id: dram, rotulo: "Abajo a la derecha, arriba", rect: [348, 112, 62, 38] }
        - { id: sram, rotulo: "Abajo a la derecha, abajo", rect: [348, 151, 62, 38] }
    tocar:
      bien: [fram]
      porque:
        flash: "Escribir sin parar la agota: está en la zona de desgaste."
        eeprom: "Aguanta más que la Flash, pero escribiendo continuamente también se gasta."
        dram: "Es volátil: un corte se lleva el dato."
        sram: "Es rápida y no se gasta, pero es volátil."
    exito: "La FRAM: escribe tan rápido como la SRAM, no es volátil y aguanta 10¹⁴ ciclos."
    escalera: ["Necesita las dos cosas: no volátil y sin desgaste práctico."]
    solucion: "Abajo en el centro: la FRAM."

  - id: prediga-sram
    tipo: tocar
    titulo: "Se va la alimentación"
    texto: "Toque las dos memorias que pierden el dato al quitar la alimentación."
    libro: [175, 176, 180, 206]
    widget:
      tipo: figura
      figura: fig-29.9
      zonas:
        - { id: flash, rotulo: "Arriba a la izquierda", rect: [50, 6, 46, 58] }
        - { id: eeprom, rotulo: "Arriba, junto a la anterior", rect: [98, 30, 85, 38] }
        - { id: fram, rotulo: "Abajo en el centro", rect: [238, 120, 78, 38] }
        - { id: dram, rotulo: "Abajo a la derecha, arriba", rect: [348, 112, 62, 38] }
        - { id: sram, rotulo: "Abajo a la derecha, abajo", rect: [348, 151, 62, 38] }
    tocar:
      bien: [dram, sram]
      todas: true
      porque:
        flash: "La Flash guarda la carga atrapada en una puerta flotante durante años sin alimentación."
        eeprom: "La EEPROM usa la misma puerta flotante que la Flash: no es volátil."
        fram: "La FRAM guarda el bit en un dipolo cristalino: no es volátil."
    exito: "SRAM y DRAM son volátiles. La DRAM, además, se descarga por fugas aun con alimentación: hay que refrescarla cada 64 ms como máximo."
    escalera: ["Una es un biestable; la otra, un condensador que se descarga."]
    solucion: "Abajo a la derecha, las dos: SRAM y DRAM."

  - id: porque-bloques
    tipo: porque
    titulo: "¿Por qué por bloques?"
    texto: "Para cambiar un solo byte ya escrito en Flash hay que leer el bloque, borrarlo y reescribirlo. ¿Por qué?"
    libro: [186]
    widget:
      tipo: figura
      figura: fig-29.9
      zonas:
        - { id: flash, rotulo: "Arriba a la izquierda", rect: [50, 6, 46, 58], texto: "Flash NOR: borrado por bloque." }
    opciones:
      - { texto: "Programar solo lleva bits de 1 a 0, y el borrado se hace por bloques", bien: true, porque: "Meter y sacar electrones del óxido pide tensión alta y tiempo: la arquitectura optimiza el borrado en bloque." }
      - { texto: "Porque la Flash es volátil", porque: "No lo es: guarda la carga años sin alimentación." }
      - { texto: "Porque cada byte tiene su propio refresco", porque: "La Flash no se refresca; el problema es que solo se pueden bajar bits sin borrar." }
    escalera: ["¿En qué sentido puede cambiar un bit al programar?"]
    solucion: "Solo de 1 a 0: para subir un bit hay que borrar el bloque entero."

  - id: estime-desgaste
    tipo: leer
    titulo: "Un contador en Flash"
    texto: "Un contador se guarda cada segundo en una Flash que aguanta 100 000 ciclos. Calcule cuántas horas dura y escríbalo."
    libro: [187, 199]
    fijar: { T_g: 1 }
    widget:
      tipo: grafica
      x: { id: tx, min: 1, max: 10000, unidad: s, rotulo: "intervalo entre escrituras", escala: log }
      y: { min: 0.00001, max: 100, unidad: años, rotulo: "vida", escala: log }
      curvas:
        - { expr: "N_c*tx/31557600", color: azul, rotulo: "vida de la Flash" }
      mandos: []
    leer:
      objetivo: t_vida
      unidad: h
      tol: 0.03
      rotulo: "Horas"
      errores:
        - { expr: "N_c*T_g/60", texto: "Eso son minutos, no horas. Una hora son 3600 segundos." }
    exito: "{{t_vida}}: horas o días. Para eso está la EEPROM, o mejor la FRAM, o guardar en RAM y volcar al apagar."
    escalera: ["Una escritura por segundo: cuente los segundos y páselos a horas."]
    solucion: "100 000 s / 3600 = 27,8 h."
    comprobar:
      - { t_vida: 27.8, tol: 0.01 }
      - { con: { T_g: 3600 }, t_vida: 100000 }

  - id: empareje-usos
    tipo: tocar
    titulo: "Calibraciones y configuración"
    texto: "Un sistema empotrado guarda unos pocos bytes de calibración con frecuencia, uno a uno. Toque la memoria que se usa para eso."
    libro: [190, 191, 206]
    widget:
      tipo: figura
      figura: fig-29.9
      zonas:
        - { id: flash, rotulo: "Arriba a la izquierda", rect: [50, 6, 46, 58] }
        - { id: eeprom, rotulo: "Arriba, junto a la anterior", rect: [98, 30, 85, 38] }
        - { id: fram, rotulo: "Abajo en el centro", rect: [238, 120, 78, 38] }
        - { id: dram, rotulo: "Abajo a la derecha, arriba", rect: [348, 112, 62, 38] }
        - { id: sram, rotulo: "Abajo a la derecha, abajo", rect: [348, 151, 62, 38] }
    tocar:
      bien: [eeprom]
      porque:
        flash: "La Flash se borra por bloques: cambiar un byte obliga a reescribir el bloque, y se gasta antes."
        fram: "Valdría, pero su densidad y su precio la reservan para escrituras continuas."
        dram: "Es volátil: la calibración se perdería al apagar."
        sram: "Es volátil: la calibración se perdería al apagar."
    exito: "La EEPROM: borra y escribe byte a byte y aguanta alrededor de un millón de ciclos."
    escalera: ["No volátil y borrable por bytes."]
    solucion: "Arriba, junto a la Flash: la EEPROM."

  - id: pregunta-corte
    tipo: porque
    titulo: "Un corte al escribir"
    texto: "¿Cómo se protege un dato en memoria no volátil frente a un corte durante la escritura?"
    libro: [201]
    widget:
      tipo: figura
      figura: fig-29.9
      zonas:
        - { id: eeprom, rotulo: "Arriba, junto a la anterior", rect: [98, 30, 85, 38], texto: "EEPROM." }
    opciones:
      - { texto: "Con doble copia y suma de comprobación, sin sobrescribir el único ejemplar bueno", bien: true, porque: "Si el corte llega a mitad de escritura, la otra copia sigue buena y la suma dice cuál vale." }
      - { texto: "Escribiendo más deprisa", porque: "Reduce el riesgo, pero un corte en mitad de la escritura sigue corrompiendo el dato." }
      - { texto: "Con una memoria volátil", porque: "La volátil lo pierde todo en el corte." }
    escalera: ["¿Qué queda si el corte llega justo a mitad de escritura?"]
    solucion: "Doble copia y suma de comprobación."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [176, 180, 187, 193, 201]
    ideas:
      - { titulo: "Volátiles.", texto: "SRAM (un biestable) y DRAM (un condensador que hay que refrescar)." }
      - { titulo: "No volátiles.", texto: "Flash y EEPROM se desgastan; la FRAM, prácticamente no." }
      - { titulo: "En la práctica.", texto: "No escribir en Flash en un bucle; doble copia ante cortes." }
