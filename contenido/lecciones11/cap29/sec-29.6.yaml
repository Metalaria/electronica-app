# Lección 1.2 de la sección 28.6 «Memorias» (cap29; etiqueta interna sec-29.6). Formato: contenido/lecciones11/GUIA.md (§11).
leccion: cap29/sec-29.6

libro:
  175: "Seis transistores forman dos inversores realimentados"
  176: "es volátil: al quitar la alimentación se pierde"
  177: "Es la memoria de trabajo de los microcontroladores"
  180: "64 ms como máximo en el estándar JEDEC, 32 ms por encima de 85 °C"
  181: "leer es destructivo"
  186: "Programar solo puede llevar bits de 1 a 0"
  187: "tras 10 000 a 100 000 ciclos las celdas dejan de retener"
  188: "que es la que guarda el programa de un microcontrolador"
  191: "Es la memoria de calibraciones, configuración y contadores"
  193: "10¹⁴ ciclos de resistencia, es decir, prácticamente ilimitada"
  194: "registradores de datos que escriben continuamente"
  197: "Ciclos de escritura"
  199: "Un contador que se guarde cada segundo agota la Flash en horas o días"
  201: "La defensa es escribir con doble copia y suma de comprobación"
  206: "Las cinco tecnologías de memoria situadas por sus dos límites"

modelo:
  valores:
    N_c: { sim: "N", nombre: "ciclos de borrado que aguanta", unidad: "", valor: 100000 }
    T_g: { sim: "T", nombre: "intervalo entre escrituras", unidad: s, valor: 1 }
  calculos:
    t_vida: { expr: "N_c*T_g/3600", sim: "t", nombre: "vida de la Flash", unidad: h, cifras: 3 }

tarjetas:
  - id: explore-memorias
    tipo: explorar
    titulo: "Cinco memorias, dos límites"
    texto: "Arriba, lo lento de escribir; a la derecha, lo que aguanta escrituras. Toque cada memoria."
    libro: [193, 197, 206]
    widget:
      tipo: figura
      figura: fig-29.9
      zonas:
        - { id: flash, rotulo: "Arriba a la izquierda", rect: [50, 6, 46, 58], texto: "Flash NOR: se escribe en milisegundos, por bloques, y aguanta de 10 000 a 100 000 ciclos." }
        - { id: eeprom, rotulo: "Arriba, junto a la anterior", rect: [98, 30, 85, 38], texto: "EEPROM: milisegundos por byte y un millón de ciclos." }
        - { id: fram, rotulo: "Abajo en el centro", rect: [238, 120, 78, 38], texto: "FRAM: nanosegundos, no volátil y 10¹⁴ ciclos." }
        - { id: dram, rotulo: "Abajo a la derecha, arriba", rect: [348, 112, 62, 38], texto: "DRAM: volátil y con refresco." }
        - { id: sram, rotulo: "Abajo a la derecha, abajo", rect: [348, 151, 62, 38], texto: "SRAM: volátil, sin refresco, sin desgaste." }
    requiere: { mover: [flash, sram] }

  - id: toque-registrador
    tipo: tocar
    titulo: "Un registrador de datos"
    texto: "Un registrador escribe continuamente y debe conservar el dato ante un corte sin aviso. Toque la memoria que le conviene."
    libro: [193, 194, 206]
    widget:
      tipo: figura
      figura: fig-29.9
      zonas:
        - { id: flash, rotulo: "Arriba a la izquierda", rect: [50, 6, 46, 58] }
        - { id: eeprom, rotulo: "Arriba, junto a la anterior", rect: [98, 30, 85, 38] }
        - { id: fram, rotulo: "Abajo en el centro", rect: [238, 120, 78, 38] }
        - { id: dram, rotulo: "Abajo a la derecha, arriba", rect: [348, 112, 62, 38] }
        - { id: sram, rotulo: "Abajo a la derecha, abajo", rect: [348, 151, 62, 38] }
    tocar:
      bien: [fram]
      porque:
        flash: "Escribir sin parar la agota: está en la zona de desgaste."
        eeprom: "Aguanta más que la Flash, pero escribiendo continuamente también se gasta."
        dram: "Es volátil: un corte se lleva el dato."
        sram: "Es rápida y no se gasta, pero es volátil."
    exito: "La FRAM: escribe tan rápido como la SRAM, no es volátil y aguanta 10¹⁴ ciclos."
    escalera: ["Necesita las dos cosas: no volátil y sin desgaste práctico."]
    solucion: "Abajo en el centro: la FRAM."

  - id: prediga-sram
    tipo: predecir
    titulo: "Se va la alimentación"
    texto: "Una SRAM guarda cada bit en dos inversores realimentados. ¿Qué pasa con el dato al quitar la alimentación?"
    libro: [175, 176]
    widget:
      tipo: logica
      entradas: [{ id: S, valor: 1, rotulo: "S̄" }, { id: R, valor: 1, rotulo: "R̄" }]
      piezas:
        - { id: n1, tipo: nand, entradas: [S, n2] }
        - { id: n2, tipo: nand, entradas: [R, n1] }
      salidas:
        - { id: Q, de: n1 }
      ocultar: true
    opciones:
      - { texto: "Se pierde: la SRAM es volátil", bien: true, porque: "El biestable se sostiene mientras hay alimentación; sin ella, no queda nada." }
      - { texto: "Se conserva años", porque: "Eso es la Flash, con su carga atrapada en una puerta flotante." }
      - { texto: "Dura unos milisegundos, hasta el refresco", porque: "El refresco es cosa de la DRAM; la SRAM no lo necesita, pero pierde el dato sin alimentación." }
    escalera: ["¿Qué sostiene los dos inversores en su estado?"]
    solucion: "Se pierde: es volátil."

  - id: pregunta-dram
    tipo: pregunta
    titulo: "El refresco de la DRAM"
    texto: "¿Cada cuánto, como máximo, hay que refrescar una DRAM según el estándar JEDEC?"
    libro: [180, 181]
    widget:
      tipo: figura
      figura: fig-29.9
      zonas:
        - { id: dram, rotulo: "Abajo a la derecha, arriba", rect: [348, 112, 62, 38], texto: "DRAM: volátil, con refresco." }
    opciones:
      - { texto: "64 ms; 32 ms por encima de 85 °C", bien: true, porque: "El condensador se descarga por fugas: hay que leerlo y reescribirlo, y eso cuesta energía y ancho de banda." }
      - { texto: "Nunca: es una memoria no volátil", porque: "Es volátil, y además pierde la carga por fugas aun con alimentación." }
      - { texto: "Cada vez que se lee", porque: "Leer es destructivo y obliga a reescribir ese valor, pero el refresco periódico es aparte: 64 ms." }
    escalera: ["Es una cifra de decenas de milisegundos."]
    solucion: "64 ms como máximo; 32 ms por encima de 85 °C."

  - id: porque-bloques
    tipo: porque
    titulo: "¿Por qué por bloques?"
    texto: "Para cambiar un solo byte ya escrito en Flash hay que leer el bloque, borrarlo y reescribirlo. ¿Por qué?"
    libro: [186]
    widget:
      tipo: figura
      figura: fig-29.9
      zonas:
        - { id: flash, rotulo: "Arriba a la izquierda", rect: [50, 6, 46, 58], texto: "Flash NOR: borrado por bloque." }
    opciones:
      - { texto: "Programar solo lleva bits de 1 a 0, y el borrado se hace por bloques", bien: true, porque: "Meter y sacar electrones del óxido pide tensión alta y tiempo: la arquitectura optimiza el borrado en bloque." }
      - { texto: "Porque la Flash es volátil", porque: "No lo es: guarda la carga años sin alimentación." }
      - { texto: "Porque cada byte tiene su propio refresco", porque: "La Flash no se refresca; el problema es que solo se pueden bajar bits sin borrar." }
    escalera: ["¿En qué sentido puede cambiar un bit al programar?"]
    solucion: "Solo de 1 a 0: para subir un bit hay que borrar el bloque entero."

  - id: estime-desgaste
    tipo: pregunta
    fase: "Estime"
    titulo: "Un contador en Flash"
    texto: "Un contador se guarda cada segundo en una Flash que aguanta 100 000 ciclos. ¿Cuántas horas dura?"
    libro: [187, 199]
    estimar:
      objetivo: "t_vida"
      unidad: h
      min: 0
      max: 100
      paso: 0.5
      inicio: 80
      tol: 0.05
      rotulo: "Horas"
    exito: "Unas 27,8 horas: horas o días. Para eso está la EEPROM, o mejor la FRAM, o guardar en RAM y volcar al apagar."
    pistas:
      - { cuando: { valor: estimacion, mayor: 29.2 }, texto: "Se ha pasado: una hora son 3600 escrituras." }
      - { texto: "Se ha quedado corto: 100 000 escrituras, una por segundo, son 100 000 segundos." }
    escalera: ["Una escritura por segundo: cuente los segundos y páselos a horas."]
    solucion: "100 000 s / 3600 = 27,8 h."
    comprobar:
      - { t_vida: 27.8, tol: 0.01 }
      - { con: { T_g: 3600 }, t_vida: 100000 }

  - id: empareje-usos
    tipo: pregunta
    fase: "Empareje"
    titulo: "Cada memoria a lo suyo"
    texto: "Una cada memoria con su uso característico."
    libro: [177, 188, 191, 194]
    emparejar:
      - ["SRAM", "Memoria de trabajo y caché"]
      - ["DRAM", "Memoria principal de un ordenador"]
      - ["Flash NOR", "Programa de un microcontrolador"]
      - ["EEPROM", "Calibraciones y configuración"]
      - ["FRAM", "Registradores que escriben continuamente"]
    exito: "Cada uso sale de cómo guarda el bit cada memoria."
    pistas:
      - { texto: "La densidad enorme es de la DRAM; la escritura byte a byte con un millón de ciclos, de la EEPROM." }
    escalera: ["Empiece por la que se ejecuta directamente: la Flash NOR."]
    solucion: "SRAM trabajo, DRAM principal, Flash NOR programa, EEPROM calibraciones, FRAM registradores."

  - id: pregunta-corte
    tipo: pregunta
    titulo: "Un corte al escribir"
    texto: "¿Cómo se protege un dato en memoria no volátil frente a un corte durante la escritura?"
    libro: [201]
    widget:
      tipo: figura
      figura: fig-29.9
      zonas:
        - { id: eeprom, rotulo: "Arriba, junto a la anterior", rect: [98, 30, 85, 38], texto: "EEPROM." }
    opciones:
      - { texto: "Con doble copia y suma de comprobación, sin sobrescribir el único ejemplar bueno", bien: true, porque: "Si el corte llega a mitad de escritura, la otra copia sigue buena y la suma dice cuál vale." }
      - { texto: "Escribiendo más deprisa", porque: "Reduce el riesgo, pero un corte en mitad de la escritura sigue corrompiendo el dato." }
      - { texto: "Con una memoria volátil", porque: "La volátil lo pierde todo en el corte." }
    escalera: ["¿Qué queda si el corte llega justo a mitad de escritura?"]
    solucion: "Doble copia y suma de comprobación."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [176, 180, 187, 193, 201]
    ideas:
      - { titulo: "Volátiles.", texto: "SRAM (un biestable) y DRAM (un condensador que hay que refrescar)." }
      - { titulo: "No volátiles.", texto: "Flash y EEPROM se desgastan; la FRAM, prácticamente no." }
      - { titulo: "En la práctica.", texto: "No escribir en Flash en un bucle; doble copia ante cortes." }
