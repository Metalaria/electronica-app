# Lección de la sección 28.7 «Contadores y Registros de Desplazamiento» (cap29; etiqueta interna sec-29.7). Formato: contenido/lecciones11/GUIA.md (§11).
# El contador asíncrono son flip-flops T disparados por flanco de subida desde la Q̄ del anterior (así cuenta hacia
# arriba); el LFSR de 3 bits realimenta Q2 ⊕ Q3, tomas de longitud máxima (7 estados).
# 1.2.1 («aprender haciendo», GUIA §13): el retraso del bit alto y el periodo del LFSR se escriben; los 4 falsos que
# ve un decodificador se tocan en la figura 28.12; la Q2 del síncrono, la Q4 del registro y la Q1 del LFSR se dibujan.
# Queda una pregunta de opciones (el estado que falta en el LFSR). La exploración del asíncrono es de cronograma.
leccion: cap29/sec-29.7

libro:
  211: "Cada flip-flop T conmuta con la salida del anterior"
  212: "Con 8 etapas de 10 ns, en la transición de 0111 1111 a 1000 0000 el bit más significativo cambia 80 ns después del flanco de reloj"
  213: "verá pulsos espurios en las transiciones"
  215: "Con eso todas las salidas cambian a la vez, y no hay estados intermedios"
  217: "contadores síncronos siempre, salvo como divisor de reloj puro"
  219: "En cada flanco, el dato avanza una posición"
  221: "Serie a paralelo: recibir datos por una línea y presentarlos en paralelo"
  222: "Paralelo a serie: lo contrario, la transmisión"
  223: "Serie a serie: retardar una señal un número exacto de ciclos"
  224: "Paralelo a paralelo: registro simple"
  227: "recorre todos los estados posibles menos uno, el de todo ceros, antes de repetirse"
  238: "Contador asíncrono con sus estados espurios frente al síncrono"
  231: "Un contador debe poder inicializarse"
  236: "se repite exactamente tras 2ⁿ−1 pasos"
  "cap29#39": "A+B"

modelo:
  valores:
    n_s: { sim: "n", nombre: "etapas", unidad: "", valor: 8 }
    t_ff: { sim: "t_{pd}", nombre: "retardo de cada etapa", unidad: s, valor: 10e-9 }
    n_l: { sim: "n", nombre: "bits del LFSR", unidad: "", valor: 3 }
    c_dec: { sim: "N", nombre: "cuenta que se decodifica", unidad: "", valor: 4 }
  calculos:
    t_msb: { expr: "n_s*t_ff", sim: "t", nombre: "retraso del bit más significativo", unidad: s }
    p_l: { expr: "2^n_l - 1", sim: "2^{n} − 1", nombre: "pasos hasta repetirse", unidad: "" }

tarjetas:
  - id: explore-asincrono
    tipo: explorar
    titulo: "Un contador asíncrono"
    texto: "Cada flip-flop T se dispara con el anterior. Dé pulsos hasta que la cuenta en Q2 Q1 Q0 llegue a cinco."
    libro: [211, "cap29#39"]
    widget:
      tipo: logica
      entradas: [{ id: CLK, reloj: true }]
      piezas:
        - { id: t1, tipo: t, entradas: ["1", CLK] }
        - { id: t2, tipo: t, entradas: ["1", t1.nq] }
        - { id: t3, tipo: t, entradas: ["1", t2.nq] }
      salidas:
        - { id: Q2, de: t3.q }
        - { id: Q1, de: t2.q }
        - { id: Q0, de: t1.q }
    objetivo:
      condiciones:
        - { led: Q2, valor: 1, rotulo: "Q2 = 1" }
        - { led: Q1, valor: 0, rotulo: "Q1 = 0" }
        - { led: Q0, valor: 1, rotulo: "Q0 = 1" }
      logrado: "Cinco pulsos. Cada etapa cambia cuando la anterior baja: una cuenta en binario."
      pistas:
        - { texto: "Q0 cambia en cada pulso; Q1, cuando Q0 vuelve a 0." }
    escalera: ["Q0 cambia en cada pulso; Q1, cada dos; Q2, cada cuatro."]
    solucion: "Cinco pulsos de reloj."

  - id: estime-retardo
    tipo: leer
    titulo: "Ocho etapas"
    texto: "Un contador asíncrono de 8 etapas de 10 ns pasa de 0111 1111 a 1000 0000. Escriba cuánto después del flanco cambia el bit más significativo."
    libro: [212]
    widget:
      tipo: grafica
      x: { id: nx, min: 1, max: 8, unidad: "", rotulo: "etapa" }
      y: { min: 0, max: 0.0000001, unidad: s, rotulo: "retraso" }
      curvas:
        - { expr: "nx*t_ff", color: azul, rotulo: "cuándo cambia cada etapa" }
      mandos: []
    leer:
      objetivo: t_msb
      unidad: s
      tol: 0.02
      rotulo: "Retraso del bit alto"
      errores:
        - { expr: "t_ff", texto: "Eso tarda una etapa. Cada una espera a la anterior: los retardos se suman." }
        - { expr: "(n_s - 1)*t_ff", texto: "Eso es lo que llega más tarde que el primero. Desde el flanco son las ocho etapas." }
    exito: "{{t_msb}}, 70 ns más tarde que el primero: entretanto la salida pasa por cuentas que no existen."
    escalera: ["Los retardos se acumulan: cada etapa se dispara con la anterior."]
    solucion: "8 × 10 ns = 80 ns."
    comprobar:
      - { t_msb: 80e-9 }

  - id: prediga-decodificar
    tipo: tocar
    titulo: "Decodificar un asíncrono"
    texto: "Un circuito vigila la cuenta del contador asíncrono de la figura para detectar el {{c_dec}}. Toque las transiciones en las que verá uno falso."
    libro: [213, 217, 238]
    widget:
      tipo: figura
      figura: fig-29.11
      zonas:
        - { id: t12, rotulo: "Primera transición marcada", rect: [134, 107, 36, 36] }
        - { id: t34, rotulo: "Segunda transición marcada", rect: [227, 107, 36, 36] }
        - { id: t56, rotulo: "Tercera transición marcada", rect: [311, 107, 36, 36] }
        - { id: t70, rotulo: "Cuarta transición marcada", rect: [400, 107, 36, 36] }
    tocar:
      bien: [t56, t70]
      todas: true
      porque:
        t12: "Ahí pasa por un 0 falso, no por el valor que se busca."
        t34: "Ahí pasa por dos cuentas falsas, pero no por el {{c_dec}}: el que llega después es el de verdad."
    exito: "Dos pulsos espurios del decodificador: los bits no cambian a la vez. Por eso los asíncronos se usan hoy casi solo como divisores de frecuencia."
    escalera: ["Busque los recuadros rojos con ese número dentro."]
    solucion: "La tercera y la cuarta transiciones marcadas."

  - id: explore-sincrono
    tipo: dibujar
    titulo: "Un contador síncrono"
    texto: "Los tres bits comparten el reloj y cambian a la vez. Dibuje Q2, el bit alto."
    libro: [215, 231]
    widget:
      tipo: logica
      entradas: [{ id: CLK, reloj: true }]
      piezas:
        - { id: c1, tipo: contador, bits: 3, entradas: [CLK] }
      salidas:
        - { id: Q2, de: c1.q2 }
        - { id: Q1, de: c1.q1 }
        - { id: Q0, de: c1.q0 }
      cronograma: { ciclos: 8, senales: [CLK, Q0, Q1] }
      dibujo: false
    dibujar:
      senal: Q2
    exito: "Sin estados intermedios: todos los bits cambian en el mismo flanco. Y como todo contador, debe poder inicializarse."
    escalera:
      - "Q2 vale 1 en la segunda mitad de la cuenta."
    solucion: "Q2 sube a mitad de la cuenta y baja al volver al principio."

  - id: dibuje-q4
    tipo: dibujar
    titulo: "Serie a serie: un retardo exacto"
    texto: "Dibuje Q4, la salida de la cuarta etapa, para esta secuencia en DS."
    libro: [219, 221, 222, 223, 224]
    widget:
      tipo: logica
      entradas: [DS, { id: CLK, reloj: true }]
      piezas:
        - { id: f1, tipo: d, entradas: [DS, CLK] }
        - { id: f2, tipo: d, entradas: [f1.q, CLK] }
        - { id: f3, tipo: d, entradas: [f2.q, CLK] }
        - { id: f4, tipo: d, entradas: [f3.q, CLK] }
      salidas:
        - { id: Q1, de: f1.q }
        - { id: Q4, de: f4.q }
      cronograma: { ciclos: 8, estimulo: { DS: "11001000" }, senales: [CLK, DS] }
      dibujo: false
    dibujar:
      senal: Q4
    exito: "Q4 es DS retrasada un número exacto de ciclos: serie a serie. Serie a paralelo recibe (SPI); paralelo a serie transmite; paralelo a paralelo es un registro simple."
    escalera:
      - "Cada etapa copia la anterior en cada flanco."
      - "Q4 sale cuatro flancos después de que DS entre en la primera."
    solucion: "Q4 repite DS cuatro flancos más tarde."

  - id: sorpresa-lfsr
    tipo: leer
    titulo: "Un azar que se repite"
    texto: "Tres flip-flops con una XOR que realimenta el primero. Mueva el cursor y cuente cuántos pasos tarda en volver el estado inicial."
    libro: [227, 236, "cap29#39"]
    widget:
      tipo: logica
      entradas: [{ id: CLK, reloj: true }]
      piezas:
        - { id: f1, tipo: d, entradas: [x1, CLK], inicial: 1 }
        - { id: f2, tipo: d, entradas: [f1.q, CLK] }
        - { id: f3, tipo: d, entradas: [f2.q, CLK] }
        - { id: x1, tipo: xor, entradas: [f2.q, f3.q] }
      salidas:
        - { id: Q1, de: f1.q }
        - { id: Q2, de: f2.q }
        - { id: Q3, de: f3.q }
      cronograma: { ciclos: 8, senales: [CLK, Q1, Q2, Q3] }
    leer:
      objetivo: p_l
      unidad: ""
      tol: 0.01
      rotulo: "Pasos"
      errores:
        - { expr: "p_l + 1", texto: "Ocho serían todos los estados de tres bits; uno no aparece nunca." }
    exito: "{{p_l}} pasos: 2³ − 1. La secuencia parece aleatoria y es exactamente periódica."
    escalera: ["Anote Q1 Q2 Q3 en el primer tramo y busque cuándo se repite."]
    solucion: "Vuelve tras 7 pasos."
    comprobar:
      - { p_l: 7 }

  - id: dibuje-lfsr
    tipo: dibujar
    titulo: "La secuencia"
    texto: "Dibuje Q1, el primer flip-flop del LFSR: recibe Q2 ⊕ Q3 en cada flanco."
    libro: [227, "cap29#39"]
    widget:
      tipo: logica
      entradas: [{ id: CLK, reloj: true }]
      piezas:
        - { id: f1, tipo: d, entradas: [x1, CLK], inicial: 1 }
        - { id: f2, tipo: d, entradas: [f1.q, CLK] }
        - { id: f3, tipo: d, entradas: [f2.q, CLK] }
        - { id: x1, tipo: xor, entradas: [f2.q, f3.q] }
      salidas:
        - { id: Q1, de: f1.q }
        - { id: Q2, de: f2.q }
        - { id: Q3, de: f3.q }
      cronograma: { ciclos: 7, senales: [CLK, Q2, Q3] }
      dibujo: false
    dibujar:
      senal: Q1
    exito: "Siete valores que parecen al azar. Un LFSR de 32 bits genera más de cuatro mil millones antes de repetirse, con unas pocas puertas: CRC, patrones de prueba, ensanchado."
    escalera:
      - "En cada flanco, Q1 toma la XOR de lo que valen Q2 y Q3 justo antes."
    solucion: "Q1 = Q2 ⊕ Q3 del ciclo anterior, flanco a flanco."

  - id: porque-sin-ceros
    tipo: porque
    titulo: "¿Por qué 2ⁿ − 1?"
    texto: "El LFSR de tres bits recorre siete estados, no ocho. ¿Cuál falta y por qué?"
    libro: [227]
    widget:
      tipo: logica
      entradas: [{ id: CLK, reloj: true }]
      piezas:
        - { id: f1, tipo: d, entradas: [x1, CLK], inicial: 1 }
        - { id: f2, tipo: d, entradas: [f1.q, CLK] }
        - { id: f3, tipo: d, entradas: [f2.q, CLK] }
        - { id: x1, tipo: xor, entradas: [f2.q, f3.q] }
      salidas:
        - { id: Q1, de: f1.q }
        - { id: Q2, de: f2.q }
        - { id: Q3, de: f3.q }
      cronograma: { ciclos: 8, senales: [CLK, Q1, Q2, Q3] }
      dibujo: false
    opciones:
      - { texto: "El de todo ceros: la XOR de ceros da cero y el registro se quedaría ahí", bien: true, porque: "Por eso recorre todos los estados menos uno, y por eso un LFSR no debe arrancar en ceros." }
      - { texto: "El de todo unos, que la XOR no puede generar", porque: "El 111 sí aparece en la secuencia. El que falta es el 000." }
      - { texto: "Ninguno: el octavo es el inicial repetido", porque: "El inicial vuelve tras siete pasos, 2ⁿ − 1. Falta el estado de todo ceros." }
    escalera: ["¿Qué entra en el primer flip-flop si los tres valen 0?"]
    solucion: "El 000: de ceros solo salen ceros."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [212, 217, 219, 227]
    ideas:
      - { titulo: "Asíncrono.", texto: "Los retardos se acumulan y aparecen cuentas intermedias: solo como divisor." }
      - { titulo: "Síncrono.", texto: "Todos los bits cambian a la vez con el mismo reloj." }
      - { titulo: "Registros.", texto: "El dato avanza una posición por flanco: serie, paralelo y retardos exactos." }
      - { titulo: "LFSR.", texto: "Con una XOR, 2ⁿ − 1 estados antes de repetirse." }
