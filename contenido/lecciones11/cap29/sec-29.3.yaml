# Lección de la sección 28.3 «Lógica Combinacional» (cap29; etiqueta interna sec-29.3). Formato: contenido/lecciones11/GUIA.md (§11).
# 1.2.1 («aprender haciendo», GUIA §13): el decodificador, el multiplexor como función, el semisumador, el sumador
# completo y la XOR de dos caminos se rellenan en su tabla; la función del mapa de Karnaugh (figura 28.4) se
# construye con puertas (la referencia mínima usa (A+C)' en lugar de Ā·C̄: cuatro puertas). Queda una pregunta de
# opciones (el glitch como reloj). La exploración del decodificador queda sin objetivo hasta que «logica» admita uno.
leccion: cap29/sec-29.3

libro:
  "cap29#39": "A+B"
  74: "la misma combinación produce siempre el mismo resultado"
  76: "Decodificador: de n entradas a 2ⁿ salidas, con una sola activa"
  78: "basta conectar a sus entradas los valores de la tabla de verdad"
  81: "el semisumador es una XOR para la suma y una AND para el acarreo; el completo añade el acarreo de entrada"
  85: "las casillas adyacentes difieran en un solo bit"
  87: "Mapa de Karnaugh de 4 variables"
  93: "La tabla de verdad no tiene tiempo, y los circuitos sí"
  94: "un glitch es un flanco y cuenta"
  95: "no usar lógica combinacional como reloj"
  102: "En teoría la salida es siempre cero; en el osciloscopio aparece un pulso en cada flanco, tan ancho como el retardo de los dos inversores"

modelo:
  valores: {}
  calculos: {}

tarjetas:
  - id: explore-decodificador
    tipo: explorar
    titulo: "Un decodificador de dos bits"
    texto: "Elija la dirección con A1 y A0: se enciende una sola salida. Busque la combinación que activa Y2."
    libro: ["cap29#39", 76]
    widget:
      tipo: logica
      entradas: [A1, A0, { id: EN, valor: 1, rotulo: "EN" }]
      piezas:
        - { id: d1, tipo: decodificador, bits: 2, entradas: [A0, A1, EN] }
      salidas:
        - { id: Y0, de: d1.y0 }
        - { id: Y1, de: d1.y1 }
        - { id: Y2, de: d1.y2 }
        - { id: Y3, de: d1.y3 }
    objetivo:
      condiciones:
        - { led: Y2, valor: 1, rotulo: "Y2 encendida" }
      logrado: "A1 A0, leídos en binario, dan el número de la salida: una sola activa."
      pistas:
        - { texto: "El número de la salida, en binario, es A1 A0." }
    escalera: ["Y2: A1 = 1, A0 = 0."]
    solucion: "A1 = 1 y A0 = 0."

  - id: prediga-decodificador
    tipo: tabla
    titulo: "Una dirección"
    texto: "Lea A1 A0 como un número binario. Rellene cuándo se activan Y1 e Y2 sin ver los LED."
    libro: ["cap29#39", 76]
    widget:
      tipo: logica
      entradas: [A1, A0]
      piezas:
        - { id: d1, tipo: decodificador, bits: 2, entradas: [A0, A1] }
      salidas:
        - { id: Y1, de: d1.y1 }
        - { id: Y2, de: d1.y2 }
      ocultar: true
    tabla:
      salidas: [Y1, Y2]
    exito: "Una sola salida activa por fila: la de la dirección. A1 es el bit de más peso: A1 A0 = 1 0 es la dirección 2."
    escalera:
      - "A1 vale 2 y A0 vale 1."
    solucion: "Y1 = 1 solo con A1 = 0, A0 = 1; Y2 = 1 solo con A1 = 1, A0 = 0."

  - id: explore-mux
    tipo: tabla
    titulo: "Un multiplexor que es una función"
    texto: "Las entradas de datos llevan fijos 0, 1, 1 y 0: una tabla de verdad. Rellene la salida para cada S1 S0."
    libro: ["cap29#39", 78]
    widget:
      tipo: logica
      entradas: [S1, S0]
      piezas:
        - { id: m1, tipo: mux, bits: 2, entradas: [S0, S1, "0", "1", "1", "0"] }
      salidas:
        - { id: Y, de: m1 }
      ocultar: true
    tabla:
      salidas: [Y]
    exito: "La salida copia la entrada de datos elegida: 0, 1, 1, 0. Es la XOR de S1 y S0, sin ninguna puerta: basta conectar la tabla de verdad."
    escalera:
      - "S1 S0 en binario dice qué entrada de datos pasa a la salida."
    solucion: "Y: 0, 1, 1, 0."

  - id: tabla-semisumador
    tipo: tabla
    titulo: "El semisumador"
    texto: "Una XOR da la suma S y una AND el acarreo C. Rellene las dos columnas."
    libro: ["cap29#39", 81]
    widget:
      tipo: logica
      entradas: [A, B]
      piezas:
        - { id: x1, tipo: xor, entradas: [A, B] }
        - { id: y1, tipo: and, entradas: [A, B] }
      salidas:
        - { id: S, de: x1, rotulo: "Suma" }
        - { id: C, de: y1, rotulo: "Acarreo" }
      ocultar: true
    tabla:
      salidas: [S, C]
    exito: "Con las dos entradas a 1, suma 0 y acarreo 1. Encadenados, hacen la aritmética de cualquier procesador."
    escalera:
      - "La suma es 1 cuando solo una de las entradas es 1."
      - "El acarreo solo aparece con las dos entradas a 1."
    solucion: "S = 0, 1, 1, 0 y C = 0, 0, 0, 1."

  - id: pregunta-completo
    tipo: tabla
    titulo: "El sumador completo"
    texto: "El completo añade el acarreo de entrada, Ci, del bit anterior. Rellene la suma S y el acarreo C."
    libro: ["cap29#39", 81]
    widget:
      tipo: logica
      entradas: [A, B, Ci]
      piezas:
        - { id: x1, tipo: xor, entradas: [A, B] }
        - { id: x2, tipo: xor, entradas: [x1, Ci] }
        - { id: a1, tipo: and, entradas: [A, B] }
        - { id: a2, tipo: and, entradas: [x1, Ci] }
        - { id: o1, tipo: or, entradas: [a1, a2] }
      salidas:
        - { id: S, de: x2, rotulo: "Suma" }
        - { id: C, de: o1, rotulo: "Acarreo" }
      ocultar: true
    tabla:
      salidas: [S, C]
    exito: "Cada fila es A + B + Ci en binario: C S. Encadenados, hacen la aritmética de cualquier procesador."
    escalera:
      - "Cuente los unos de la fila: S es el bit bajo de esa cuenta y C el alto."
    solucion: "S = 1 con uno o tres unos; C = 1 con dos o tres unos."

  - id: sorpresa-glitch
    tipo: tabla
    titulo: "Siempre cero"
    texto: "Una XOR recibe A y la misma A tras dos inversores. Rellene la tabla en reposo."
    libro: ["cap29#39", 93, 102]
    widget:
      tipo: logica
      entradas: [A]
      piezas:
        - { id: i1, tipo: not, entradas: [A] }
        - { id: i2, tipo: not, entradas: [i1] }
        - { id: x1, tipo: xor, entradas: [A, i2] }
      salidas:
        - { id: Y, de: x1 }
      ocultar: true
    tabla:
      salidas: [Y]
    exito: "En teoría, siempre 0. En el osciloscopio, un pulso en cada flanco, tan ancho como el retardo de los dos inversores: la tabla no tiene tiempo; el circuito sí."
    escalera:
      - "Dos inversores seguidos devuelven A."
    solucion: "Y = 0 en las dos filas."

  - id: pregunta-reloj
    tipo: porque
    titulo: "Un glitch en un reloj"
    texto: "Esa salida combinacional se usa como reloj de un biestable. ¿Qué pasa con el glitch?"
    libro: ["cap29#39", 94, 95]
    widget:
      tipo: logica
      entradas: [A]
      piezas:
        - { id: i1, tipo: not, entradas: [A] }
        - { id: i2, tipo: not, entradas: [i1] }
        - { id: x1, tipo: xor, entradas: [A, i2] }
      salidas:
        - { id: Y, de: x1 }
    opciones:
      - { texto: "Es un flanco, y el biestable lo cuenta", bien: true, porque: "Por eso la regla del diseño síncrono: no usar lógica combinacional como reloj." }
      - { texto: "Nada: es demasiado breve", porque: "Unos nanosegundos bastan para disparar un biestable rápido." }
      - { texto: "Lo mismo que con un LED", porque: "Con un LED no importa; con un reloj, un glitch es un flanco más." }
    escalera: ["¿Qué hace un biestable en cada flanco de su reloj?"]
    solucion: "El biestable lo cuenta como un flanco."

  - id: disene-karnaugh
    tipo: diseno
    titulo: "Del mapa a las puertas"
    texto: "El mapa de Karnaugh agrupa los unos vecinos y da F = Ā·C̄ + A·D. Constrúyala con AND, OR e inversores."
    libro: [85, 87]
    widget:
      tipo: logica
      entradas: [A, C, D]
      piezas: []
      salidas:
        - { id: F, de: "0", rotulo: "Ā·C̄ + A·D" }
    diseno:
      salida: F
      permitidas: [and, or, not]
      referencia:
        - { tipo: or, entradas: [A, C] }
        - { tipo: not, entradas: [p1] }
        - { tipo: and, entradas: [A, D] }
        - { tipo: or, entradas: [p2, p3] }
      exigir_minimo: false
    exito: "Dos grupos, dos términos. Y De Morgan ahorra una puerta: Ā·C̄ es la OR de A y C, invertida."
    escalera:
      - "Un término AND por grupo y una OR que los une."
      - "Ā·C̄ = (A + C)': De Morgan."
    solucion: "p1 = OR(A, C), p2 = NOT(p1), p3 = AND(A, D) y F = OR(p2, p3)."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: ["cap29#39", 74, 76, 78, 81, 93]
    ideas:
      - { titulo: "Sin memoria.", texto: "La salida depende solo de las entradas presentes." }
      - { titulo: "Bloques.", texto: "Decodificador, multiplexor, comparador y sumador: XOR para la suma, AND para el acarreo." }
      - { titulo: "Glitches.", texto: "Dos caminos de distinto retardo dan pulsos: no use lógica combinacional como reloj." }
