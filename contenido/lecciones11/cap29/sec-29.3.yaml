# Lección 1.2 de la sección 28.3 «Lógica Combinacional» (cap29; etiqueta interna sec-29.3). Formato: contenido/lecciones11/GUIA.md (§11).
leccion: cap29/sec-29.3

libro:
  "cap29#39": "A+B"
  74: "la misma combinación produce siempre el mismo resultado"
  76: "Decodificador: de n entradas a 2ⁿ salidas, con una sola activa"
  77: "lo que convierte un teclado en un número"
  78: "basta conectar a sus entradas los valores de la tabla de verdad"
  79: "el multiplexor al revés, que reparte una señal"
  80: "dice si dos números son iguales o cuál es mayor, y se construye con XOR"
  81: "el semisumador es una XOR para la suma y una AND para el acarreo; el completo añade el acarreo de entrada"
  85: "las casillas adyacentes difieran en un solo bit"
  91: "con las seis combinaciones no usadas marcadas como indiferentes sale bastante más pequeño"
  93: "La tabla de verdad no tiene tiempo, y los circuitos sí"
  94: "un glitch es un flanco y cuenta"
  95: "no usar lógica combinacional como reloj"
  102: "En teoría la salida es siempre cero; en el osciloscopio aparece un pulso en cada flanco, tan ancho como el retardo de los dos inversores"

modelo:
  valores: {}
  calculos: {}

tarjetas:
  - id: explore-decodificador
    tipo: explorar
    titulo: "Un decodificador de dos bits"
    texto: "Elija la dirección con A1 y A0: se enciende una sola salida."
    libro: ["cap29#39", 76]
    widget:
      tipo: logica
      entradas: [A1, A0, { id: EN, valor: 1, rotulo: "EN" }]
      piezas:
        - { id: d1, tipo: decodificador, bits: 2, entradas: [A0, A1, EN] }
      salidas:
        - { id: Y0, de: d1.y0 }
        - { id: Y1, de: d1.y1 }
        - { id: Y2, de: d1.y2 }
        - { id: Y3, de: d1.y3 }
    requiere: { mover: [A1, A0] }

  - id: prediga-decodificador
    tipo: predecir
    titulo: "Una dirección"
    texto: "Con A1 = 1 y A0 = 0, ¿qué salida se activa?"
    libro: ["cap29#39", 76]
    widget:
      tipo: logica
      entradas: [{ id: A1, valor: 1 }, { id: A0, valor: 0 }, { id: EN, valor: 1, rotulo: "EN" }]
      piezas:
        - { id: d1, tipo: decodificador, bits: 2, entradas: [A0, A1, EN] }
      salidas:
        - { id: Y0, de: d1.y0 }
        - { id: Y1, de: d1.y1 }
        - { id: Y2, de: d1.y2 }
        - { id: Y3, de: d1.y3 }
      ocultar: true
    opciones:
      - { texto: "Y2, solo ella", bien: true, porque: "A1 A0 = 1 0 es el número binario 2: se activa la salida 2 y ninguna más." }
      - { texto: "Y1", porque: "Ha leído los bits al revés: A1 es el de más peso, y 1 0 es 2." }
      - { texto: "Y2 e Y3", porque: "Un decodificador activa una sola salida: la de la dirección." }
    escalera: ["Lea A1 A0 como un número binario."]
    solucion: "1 0 en binario es 2: Y2."

  - id: explore-mux
    tipo: explorar
    titulo: "Un multiplexor que es una función"
    texto: "Las entradas de datos llevan fijos 0, 1, 1 y 0: una tabla de verdad. Mueva S1 y S0 y lea la salida."
    libro: ["cap29#39", 78]
    widget:
      tipo: logica
      entradas: [S1, S0]
      piezas:
        - { id: m1, tipo: mux, bits: 2, entradas: [S0, S1, "0", "1", "1", "0"] }
      salidas:
        - { id: Y, de: m1 }
      tabla: true
    requiere: { mover: [S1, S0] }

  - id: tabla-semisumador
    tipo: tabla
    titulo: "El semisumador"
    texto: "Una XOR da la suma S y una AND el acarreo C. Rellene las dos columnas."
    libro: ["cap29#39", 81]
    widget:
      tipo: logica
      entradas: [A, B]
      piezas:
        - { id: x1, tipo: xor, entradas: [A, B] }
        - { id: y1, tipo: and, entradas: [A, B] }
      salidas:
        - { id: S, de: x1, rotulo: "Suma" }
        - { id: C, de: y1, rotulo: "Acarreo" }
      ocultar: true
    tabla:
      salidas: [S, C]
    exito: "Con las dos entradas a 1, suma 0 y acarreo 1. Encadenados, hacen la aritmética de cualquier procesador."
    escalera:
      - "La suma es 1 cuando solo una de las entradas es 1."
      - "El acarreo solo aparece con las dos entradas a 1."
    solucion: "S = 0, 1, 1, 0 y C = 0, 0, 0, 1."

  - id: pregunta-completo
    tipo: pregunta
    titulo: "Del semisumador al completo"
    texto: "Para sumar números de varios bits, ¿qué añade el sumador completo al semisumador?"
    libro: ["cap29#39", 81]
    widget:
      tipo: logica
      entradas: [A, B]
      piezas:
        - { id: x1, tipo: xor, entradas: [A, B] }
        - { id: y1, tipo: and, entradas: [A, B] }
      salidas:
        - { id: S, de: x1, rotulo: "Suma" }
        - { id: C, de: y1, rotulo: "Acarreo" }
    opciones:
      - { texto: "El acarreo de entrada, del bit anterior", bien: true, porque: "Así se encadenan: cada etapa suma A, B y el acarreo que le llega." }
      - { texto: "Una segunda salida de suma", porque: "Sigue habiendo una suma y un acarreo; lo nuevo es una entrada más." }
      - { texto: "Un multiplexor", porque: "No hace falta: el completo añade el acarreo de entrada." }
    escalera: ["¿Qué le llega a la segunda columna de una suma hecha a mano?"]
    solucion: "El acarreo de entrada."

  - id: empareje-bloques
    tipo: pregunta
    fase: "Empareje"
    titulo: "Los bloques que se repiten"
    texto: "Una cada bloque con lo que hace."
    libro: ["cap29#39", 76, 77, 78, 79, 80]
    emparejar:
      - ["Decodificador", "De n entradas a 2ⁿ salidas, con una activa"]
      - ["Codificador con prioridad", "Convierte un teclado en un número"]
      - ["Multiplexor", "Un conmutador digital: elige una de 2ⁿ entradas"]
      - ["Demultiplexor", "Reparte una señal"]
      - ["Comparador", "Dice si dos números son iguales, con XOR"]
    exito: "Hoy casi nunca se montan con puertas sueltas: aparecen dentro de memorias, FPGA y microcontroladores."
    pistas:
      - { texto: "El demultiplexor es el multiplexor al revés; el codificador, el decodificador al revés." }
    escalera: ["Empiece por el decodificador, que ya ha visto."]
    solucion: "Decodificador, codificador, multiplexor, demultiplexor y comparador, en ese orden."

  - id: sorpresa-glitch
    tipo: sorpresa
    titulo: "Siempre cero"
    texto: "Una XOR recibe A y la misma A tras dos inversores. Mueva A: según la tabla, la salida es siempre 0."
    libro: ["cap29#39", 93, 102]
    widget:
      tipo: logica
      entradas: [A]
      piezas:
        - { id: i1, tipo: not, entradas: [A] }
        - { id: i2, tipo: not, entradas: [i1] }
        - { id: x1, tipo: xor, entradas: [A, i2] }
      salidas:
        - { id: Y, de: x1 }
      tabla: true
    requiere: { mover: [A] }

  - id: porque-glitch
    tipo: porque
    titulo: "¿Por qué hay un pulso?"
    texto: "En el osciloscopio, esa XOR da un pulso en cada flanco de A. ¿Por qué?"
    libro: ["cap29#39", 93, 102]
    widget:
      tipo: logica
      entradas: [A]
      piezas:
        - { id: i1, tipo: not, entradas: [A] }
        - { id: i2, tipo: not, entradas: [i1] }
        - { id: x1, tipo: xor, entradas: [A, i2] }
      salidas:
        - { id: Y, de: x1 }
    opciones:
      - { texto: "Mientras los inversores tardan, las dos entradas son distintas", bien: true, porque: "El pulso es tan ancho como el retardo de los dos inversores: unos 15 ns con un 74HC04 a 5 V." }
      - { texto: "Por ruido en la alimentación", porque: "Aparece en cada flanco, siempre igual: es el retardo de un camino frente al otro." }
      - { texto: "Porque la XOR está mal", porque: "La XOR hace su trabajo: durante un instante sus entradas de verdad son distintas." }
    escalera: ["La tabla de verdad no tiene tiempo; el circuito sí."]
    solucion: "Un camino llega antes que el otro: durante ese retardo la XOR ve entradas distintas."

  - id: pregunta-reloj
    tipo: pregunta
    titulo: "Un glitch en un reloj"
    texto: "Esa salida combinacional se usa como reloj de un biestable. ¿Qué pasa con el glitch?"
    libro: ["cap29#39", 94, 95]
    widget:
      tipo: logica
      entradas: [A]
      piezas:
        - { id: i1, tipo: not, entradas: [A] }
        - { id: i2, tipo: not, entradas: [i1] }
        - { id: x1, tipo: xor, entradas: [A, i2] }
      salidas:
        - { id: Y, de: x1 }
    opciones:
      - { texto: "Es un flanco, y el biestable lo cuenta", bien: true, porque: "Por eso la regla del diseño síncrono: no usar lógica combinacional como reloj." }
      - { texto: "Nada: es demasiado breve", porque: "Unos nanosegundos bastan para disparar un biestable rápido." }
      - { texto: "Lo mismo que con un LED", porque: "Con un LED no importa; con un reloj, un glitch es un flanco más." }
    escalera: ["¿Qué hace un biestable en cada flanco de su reloj?"]
    solucion: "El biestable lo cuenta como un flanco."

  - id: pregunta-indiferentes
    tipo: pregunta
    titulo: "Siete segmentos"
    texto: "Un decodificador BCD a siete segmentos nunca recibe seis de sus dieciséis combinaciones. ¿Qué conviene hacer con ellas?"
    libro: ["cap29#39", 85, 91]
    widget:
      tipo: logica
      entradas: [A1, A0, { id: EN, valor: 1, rotulo: "EN" }]
      piezas:
        - { id: d1, tipo: decodificador, bits: 2, entradas: [A0, A1, EN] }
      salidas:
        - { id: Y0, de: d1.y0 }
        - { id: Y1, de: d1.y1 }
    opciones:
      - { texto: "Marcarlas como indiferentes y dejar que la simplificación las use", bien: true, porque: "El circuito sale bastante más pequeño: es la diferencia entre un diseño ingenuo y uno bien hecho." }
      - { texto: "Darles salida 0", porque: "Funciona, pero desperdicia la libertad: como indiferentes, simplifican el circuito." }
      - { texto: "Añadir lógica que las detecte", porque: "Eso agranda el circuito. Si nunca se dan, mejor que la simplificación las aproveche." }
    escalera: ["Si una combinación nunca se da, su salida da igual."]
    solucion: "Términos indiferentes: la simplificación las usa como convenga."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: ["cap29#39", 74, 76, 78, 81, 93]
    ideas:
      - { titulo: "Sin memoria.", texto: "La salida depende solo de las entradas presentes." }
      - { titulo: "Bloques.", texto: "Decodificador, multiplexor, comparador y sumador: XOR para la suma, AND para el acarreo." }
      - { titulo: "Glitches.", texto: "Dos caminos de distinto retardo dan pulsos: no use lógica combinacional como reloj." }
