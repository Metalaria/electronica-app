# Lección 1.2 de la sección 35.2 «Muestreo y Retención: el Sample and Hold» (cap34; etiqueta interna sec-34.2).
# Formato: contenido/lecciones11/GUIA.md (§5.4 bis, «muestreo-retencion»). El ADC del Arduino del banco del libro:
# 14 pF cargados durante 12 µs a través de la fuente, con un salto de fondo de escala de 5 V (su referencia por defecto,
# sección 35.8) y 10 bits. El error al final de la adquisición, en LSB, es 2^10 · e^(−12 µs/(R·14 pF)): medio LSB hacia
# 110 kΩ, como dice el libro. Los 200 kΩ del mando son las resistencias del divisor del problema 35.C.
leccion: cap34/sec-34.2

libro:
  36: "Un convertidor A/D necesita que la señal no cambie mientras convierte"
  37: "un interruptor y un condensador"
  40: "Tiempo de adquisición: cuánto tarda el condensador en alcanzar la señal"
  41: "Caída (droop): el condensador se descarga por las fugas"
  42: "Pedestal: al abrir el interruptor, parte de la carga de su puerta se inyecta en el condensador"
  43: "Tiempo de apertura y su jitter"
  46: "Adquisición"
  47: "un convertidor rápido tenga un condensador de muestreo diminuto"
  51: '"Δ" V = (d V)/(d t) dot.op "Δ" t'
  53: "Δt < 1 / (2π · f · 2ⁿ)"
  54: "Con 16 bits y 1 MHz, eso son 2,4 picosegundos"
  58: "medir una tensión continua conocida a través de resistencias crecientes"
  59: "con el ADC del Arduino (14 pF y 12 µs de adquisición), el error no llega a medio LSB hasta unos 110 kΩ"
  "cap34#220": "4,88 mV por paso con 5 V"

modelo:
  valores:
    V_s: { sim: "V", nombre: "salto de entrada", unidad: V, valor: 5 }
    R_f: { sim: "R_{fuente}", nombre: "resistencia de la fuente", unidad: Ω, valor: 10000 }
    C_s: { sim: "C_{m}", nombre: "condensador de muestreo", unidad: F, valor: 14e-12 }
    t_a: { sim: "t_{adq}", nombre: "tiempo de adquisición", unidad: s, valor: 12e-6 }
    n_a: { sim: "n", nombre: "bits del ADC", unidad: "", valor: 10 }
    f_j: { sim: "f", nombre: "frecuencia de la señal", unidad: Hz, valor: 1000000 }
    n_j: { sim: "n", nombre: "bits", unidad: "", valor: 16 }
  calculos:
    tau: { expr: "R_f*C_s", sim: "τ", nombre: "constante de tiempo", unidad: s }
    V_m: { expr: "V_s*(1 - exp(-t_a/tau))", sim: "v_{m}", nombre: "tensión muestreada", unidad: V }
    e_L: { expr: "2^n_a*exp(-t_a/tau)", sim: "error", nombre: "error al final de la adquisición", unidad: LSB, cifras: 2 }
    N_j: { expr: "2^n_j", sim: "2ⁿ", nombre: "número de códigos", unidad: "" }
    dt_j: { expr: "1/(2*pi*f_j*N_j)", sim: "Δt", nombre: "jitter máximo", unidad: s }

tarjetas:
  - id: explore-adquisicion
    tipo: explorar
    titulo: "Cargar un condensador"
    texto: "El ADC del Arduino carga 14 pF durante 12 µs a través de la fuente. Cambie la resistencia de la fuente y mire el error al convertir."
    nota: "Salto de 5 V con el condensador descargado; 10 bits."
    libro: [36, 37, 40, 59, "cap34#220"]
    widget:
      tipo: circuito
      esquema: muestreo-retencion
      piezas: { entrada: V_s, ron: R_f, ch: C_s, tm: t_a }
      lectura: { valor: e_L, rotulo: "Error al convertir" }
      datos:
        - { valor: tau, rotulo: "τ = {{tau}}" }
      grafica:
        x: { id: t, min: 0, max: 0.000015, unidad: s, rotulo: "t" }
        y: { min: 0, max: 5.5, unidad: V, rotulo: "v" }
        curvas:
          - { expr: "(1 - ceil((t - t_a)/1e9))*V_s*(1 - exp(-t/tau)) + ceil((t - t_a)/1e9)*V_m", color: naranja, rotulo: "v_{o}", mide: salida }
      mandos:
        - { valor: R_f, lista: [10000, 110000, 200000], rotulo: "R_{fuente}" }
    requiere: { mover: [R_f] }

  - id: prediga-alta
    tipo: predecir
    titulo: "Una fuente de 200 kΩ"
    texto: "Se mide una tensión continua conocida a través de 200 kΩ con ese ADC. ¿Qué lee?"
    libro: [58, 59]
    fijar: { R_f: 200000 }
    widget:
      tipo: circuito
      esquema: muestreo-retencion
      piezas: { entrada: V_s, ron: R_f, ch: C_s, tm: t_a }
      lectura: { valor: e_L, rotulo: "Error al convertir" }
      ocultar: true
      grafica:
        x: { id: t, min: 0, max: 0.000015, unidad: s, rotulo: "t" }
        y: { min: 0, max: 5.5, unidad: V, rotulo: "v" }
        curvas:
          - { expr: "(1 - ceil((t - t_a)/1e9))*V_s*(1 - exp(-t/tau)) + ceil((t - t_a)/1e9)*V_m", color: naranja, rotulo: "v_{o}", mide: salida }
    opciones:
      - { texto: "Menos de lo que hay: el condensador no termina de cargarse", bien: true, porque: "12 µs ya no bastan para cargar 14 pF a través de 200 kΩ: la lectura cae." }
      - { texto: "Lo mismo: en continua no circula corriente", porque: "Al muestrear sí: el condensador se carga a través de la fuente en cada lectura." }
      - { texto: "Más de lo que hay", porque: "Partiendo de una carga menor, el condensador se queda corto, no se pasa." }
    escalera: ["Compare la constante de tiempo con los 12 µs de adquisición."]
    solucion: "τ = 200 kΩ × 14 pF es demasiado larga para 12 µs: la lectura sale baja."

  - id: empareje-parametros
    tipo: pregunta
    fase: "Empareje"
    titulo: "Los cuatro parámetros"
    texto: "Una cada parámetro del muestreo y retención con lo que limita."
    libro: [40, 41, 42, 43]
    emparejar:
      - ["Tiempo de adquisición", "Cuánto tarda en alcanzar la señal; depende de la fuente"]
      - ["Caída (droop)", "Cuánto tiempo se puede retener"]
      - ["Pedestal", "Un salto al abrir: error sistemático que se calibra"]
      - ["Jitter de apertura", "El límite a frecuencias altas"]
    exito: "Y el condensador es el punto de equilibrio entre todos ellos."
    pistas:
      - { texto: "El que se puede calibrar es un salto siempre igual." }
    escalera: ["La caída la producen las fugas durante la retención."]
    solucion: "Adquisición, la fuente; caída, retener; pedestal, calibrable; jitter, alta frecuencia."

  - id: pregunta-condensador
    tipo: pregunta
    titulo: "Un condensador grande"
    texto: "¿Qué da un condensador de muestreo grande frente a uno pequeño?"
    libro: [46]
    widget:
      tipo: circuito
      esquema: muestreo-retencion
      piezas: { entrada: V_s, ron: R_f, ch: C_s, tm: t_a }
      lectura: { valor: tau, rotulo: "τ" }
      grafica:
        x: { id: t, min: 0, max: 0.000015, unidad: s, rotulo: "t" }
        y: { min: 0, max: 5.5, unidad: V, rotulo: "v" }
        curvas:
          - { expr: "(1 - ceil((t - t_a)/1e9))*V_s*(1 - exp(-t/tau)) + ceil((t - t_a)/1e9)*V_m", color: naranja, rotulo: "v_{o}", mide: salida }
    opciones:
      - { texto: "Poca caída, pedestal pequeño y poco ruido, pero adquisición lenta", bien: true, porque: "Los parámetros tiran en direcciones opuestas: el grande gana en todo menos en velocidad." }
      - { texto: "Todo mejor, sin inconvenientes", porque: "Cargarlo lleva más tiempo: la adquisición se hace lenta." }
      - { texto: "Adquisición rápida y mucha caída", porque: "Eso es el pequeño: se carga deprisa y se descarga deprisa." }
    escalera: ["Más capacidad: ¿cuesta más o menos cargarla?"]
    solucion: "Grande: lenta adquisición, poca caída, pedestal pequeño y bajo ruido."

  - id: porque-rapido
    tipo: porque
    titulo: "Unos pocos picofaradios"
    texto: "Un convertidor rápido tiene un condensador de muestreo diminuto. ¿Por qué exige por eso una fuente de baja impedancia?"
    libro: [47]
    fijar: { R_f: 10000 }
    widget:
      tipo: circuito
      esquema: muestreo-retencion
      piezas: { entrada: V_s, ron: R_f, ch: C_s, tm: t_a }
      lectura: { valor: tau, rotulo: "τ" }
      grafica:
        x: { id: t, min: 0, max: 0.000015, unidad: s, rotulo: "t" }
        y: { min: 0, max: 5.5, unidad: V, rotulo: "v" }
        curvas:
          - { expr: "(1 - ceil((t - t_a)/1e9))*V_s*(1 - exp(-t/tau)) + ceil((t - t_a)/1e9)*V_m", color: naranja, rotulo: "v_{o}", mide: salida }
    opciones:
      - { texto: "Hay que cargarlo en nanosegundos, y la fuente está en serie con él", bien: true, porque: "La constante de tiempo es la resistencia de la fuente por el condensador: sin una fuente baja no da tiempo." }
      - { texto: "Porque un condensador pequeño se rompe con alta impedancia", porque: "No se rompe: se queda sin cargar del todo en el poco tiempo disponible." }
      - { texto: "Es un capricho del fabricante", porque: "El libro dice que no lo es: es consecuencia directa del compromiso del condensador." }
    escalera: ["¿Qué resistencia carga el condensador?"]
    solucion: "Debe cargarse en nanosegundos a través de la fuente: la fuente tiene que ser de baja impedancia."

  - id: explore-jitter
    tipo: explorar
    titulo: "El instante exacto"
    texto: "Si el instante de muestreo baila, la tensión muestreada también. Cambie la frecuencia de la señal y los bits, y mire cuánto baile se admite."
    libro: [43, 53]
    widget:
      tipo: grafica
      x: { id: nu, min: 1000, max: 10000000, unidad: Hz, rotulo: "f", escala: log }
      y: { min: 1e-14, max: 1e-6, unidad: s, rotulo: "Δt", escala: log }
      curvas:
        - { expr: "1/(2*pi*nu*N_j)", color: azul, rotulo: "Δt máximo" }
      marcas:
        - { x: "f_j", y: "dt_j", rotulo: "Su señal" }
      lectura: { valor: dt_j, rotulo: "Jitter máximo" }
      mandos:
        - { valor: f_j, lista: [1000, 1000000], rotulo: "Frecuencia de la señal" }
        - { valor: n_j, lista: [8, 16], rotulo: "Bits" }
    requiere: { mover: [f_j] }

  - id: formula-jitter
    tipo: formula
    titulo: "Pendiente por incertidumbre"
    texto: "ΔV = dV/dt · Δt, y una senoide cambia como mucho a 2πfA. Bajo medio LSB: Δt < 1/(2π · f · 2ⁿ)."
    libro: [51, 53]
    ec: 51
    sustitucion: "Δt < 1/(2π · {{f_j}} · {{N_j}}) = {{dt_j}}"
    widget:
      tipo: grafica
      x: { id: nu, min: 1000, max: 10000000, unidad: Hz, rotulo: "f", escala: log }
      y: { min: 1e-14, max: 1e-6, unidad: s, rotulo: "Δt", escala: log }
      curvas:
        - { expr: "1/(2*pi*nu*N_j)", color: azul, rotulo: "Δt máximo" }
      marcas:
        - { x: "f_j", y: "dt_j", rotulo: "Su señal" }
      lectura: { valor: dt_j, rotulo: "Jitter máximo" }
      mandos:
        - { valor: f_j, lista: [1000, 1000000], rotulo: "Frecuencia de la señal" }
        - { valor: n_j, lista: [8, 16], rotulo: "Bits" }

  - id: estime-jitter
    tipo: pregunta
    fase: "Estime"
    titulo: "16 bits a 1 MHz"
    texto: "¿Qué incertidumbre máxima admite el instante de muestreo de un convertidor de 16 bits con una senoide de 1 MHz?"
    libro: [53, 54]
    fijar: { f_j: 1000000, n_j: 16 }
    estimar:
      objetivo: "dt_j"
      unidad: s
      min: 0
      max: 1e-11
      paso: 1e-13
      inicio: 8e-12
      tol: 0.06
      rotulo: "Jitter máximo"
    exito: "2,4 ps: por eso, en alta resolución y alta velocidad, el reloj es el componente crítico."
    pistas:
      - { cuando: { valor: estimacion, mayor: 2.6e-12 }, texto: "Se ha pasado: 2¹⁶ son 65 536 códigos, y entran multiplicando con 2π y 1 MHz." }
      - { texto: "Se ha quedado corto: 1/(2π · 10⁶ · 65 536) son unos pocos picosegundos." }
    escalera: ["Calcule 2π · 1 MHz · 2¹⁶ y tome el inverso."]
    solucion: "1/(2π × 1 MHz × 65 536) = 2,4 ps."
    comprobar:
      - { dt_j: 2.43e-12, N_j: 65536 }

  - id: ajuste-impedancia
    tipo: ajuste
    titulo: "El límite real"
    texto: "Suba la resistencia de la fuente hasta que el error al convertir llegue a medio LSB: ahí deja de bastar la adquisición."
    libro: [58, 59]
    inicio: { R_f: 10000 }
    widget:
      tipo: circuito
      esquema: muestreo-retencion
      piezas: { entrada: V_s, ron: R_f, ch: C_s, tm: t_a }
      lectura: { valor: e_L, rotulo: "Error al convertir" }
      grafica:
        x: { id: t, min: 0, max: 0.000015, unidad: s, rotulo: "t" }
        y: { min: 0, max: 5.5, unidad: V, rotulo: "v" }
        curvas:
          - { expr: "(1 - ceil((t - t_a)/1e9))*V_s*(1 - exp(-t/tau)) + ceil((t - t_a)/1e9)*V_m", color: naranja, rotulo: "v_{o}", mide: salida }
      mandos:
        - { valor: R_f, min: 10000, max: 200000, paso: 5000, rotulo: "R_{fuente}" }
    ajuste:
      valor: e_L
      objetivo: 0.5
      tol: 0.2
      rotulo: "Error al convertir"
      escala: { min: 0, max: 2 }
      bajo: "Todavía sobra tiempo: suba la resistencia."
      alto: "Se ha pasado: el error ya supera el medio LSB; baje la resistencia."
      dentro: "Medio LSB hacia los 110 kΩ, once veces los 10 kΩ que recomienda la hoja."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [37, 46, 53, 59]
    ideas:
      - { titulo: "Interruptor y condensador.", texto: "Cerrado, sigue la señal; abierto, la retiene mientras se convierte." }
      - { titulo: "El condensador es el equilibrio.", texto: "Grande, preciso y lento; pequeño, rápido y exigente con la fuente." }
      - { titulo: "El instante.", texto: "Δt < 1/(2π · f · 2ⁿ): con 16 bits y 1 MHz, 2,4 ps." }
