# Lección de la sección 35.4 «Arquitecturas de ADC» (cap34; etiqueta interna sec-34.4).
# Formato: contenido/lecciones11/GUIA.md. El plano resolución-velocidad es la figura 35.6; los comparadores del flash
# (2ⁿ − 1) y el asentamiento del SAR (ln(2ⁿ⁺¹) constantes de tiempo para un salto de fondo de escala) son las cuentas
# del libro, en gráficas que se mueven.
# 1.2.1 («aprender haciendo», GUIA §13): el convertidor desconocido se toca en el plano de la figura 35.6; los bits del
# flash habitual y los del SAR que pide 9,0 τ se eligen; los comparadores de 10 bits y las τ de 16 bits se escriben;
# el tiempo de integración que anula el zumbido de 50 Hz se busca (rechazo |sen(π·50·T)/(π·50·T)|, la cuenta que
# justifica el «múltiplo del periodo de red» del libro). Quedan dos preguntas de opciones: el buffer y la latencia.
leccion: cap34/sec-34.4

libro:
  90: "Una escalera de 2ⁿ − 1 comparadores"
  92: "8 bits son 255 comparadores y 10 bits serían 1 023"
  93: "a costa de una latencia de varios ciclos"
  95: "una búsqueda binaria que resuelve n bits en n ciclos"
  96: "es la arquitectura más común"
  97: "la entrada debe haberse establecido con una exactitud mejor que medio LSB"
  98: "11,8 τ"
  99: "el error inicial, de 2n LSB, tiene que caer por debajo de medio LSB"
  100: "produzca lecturas erróneas que ningún promediado corrige"
  106: "Se integra la entrada durante un tiempo fijo"
  107: "si el tiempo de integración es un múltiplo del periodo de red, el ruido de 50 Hz se promedia a cero"
  110: "Microcontroladores, control, uso general"
  112: "Un sigma-delta de 24 bits a 1 kS/s puede ser inservible en un lazo de control por su retardo"
  114: "si da megamuestras con 12 y el dato está listo en la misma muestra, es SAR"

modelo:
  valores:
    n_f: { sim: "n", nombre: "bits del flash", unidad: "", valor: 8 }
    n_s: { sim: "n", nombre: "bits del SAR", unidad: "", valor: 12 }
    T_i: { sim: "T_{int}", nombre: "tiempo de integración", unidad: s, valor: 0.015 }
    f_red: { sim: "f_{red}", nombre: "frecuencia de la red", unidad: Hz, valor: 50 }
  calculos:
    N_c: { expr: "2^n_f - 1", sim: "comparadores", nombre: "comparadores del flash", unidad: "" }
    k_t: { expr: "ln(2^(n_s + 1))", sim: "k", nombre: "constantes de tiempo para medio LSB", unidad: "τ", cifras: 3 }
    N_p: { expr: "(2^8 - 1)*n_f/8", sim: "N", nombre: "comparadores si crecieran en proporción", unidad: "" }
    N_d: { expr: "2*(2^8 - 1)", sim: "N", nombre: "el doble de 255", unidad: "" }
    E_0: { expr: "2^n_s", sim: "error inicial", nombre: "error inicial", unidad: LSB }
    r_red: { expr: "abs(sin(pi*f_red*T_i)/(pi*f_red*T_i))", sim: "residuo", nombre: "lo que queda del zumbido de red", unidad: "", cifras: 2 }

tarjetas:
  - id: explore-plano
    tipo: tocar
    titulo: "Un integrado desconocido"
    texto: "Un convertidor da megamuestras por segundo con 12 bits y el dato está listo en la misma muestra. Toque su zona en el plano resolución-velocidad."
    libro: [93, 96, 110, 114]
    widget:
      tipo: figura
      figura: fig-34.6
      zonas:
        - { id: rampa, rotulo: "Abajo a la izquierda", rect: [42, 96, 66, 36] }
        - { id: sigma, rotulo: "Arriba en el centro", rect: [128, 20, 72, 36] }
        - { id: sar, rotulo: "En el centro", rect: [165, 124, 80, 36] }
        - { id: pipeline, rotulo: "A la derecha", rect: [310, 74, 82, 52] }
        - { id: flash, rotulo: "Abajo a la derecha", rect: [362, 124, 62, 52] }
    tocar:
      bien: [sar]
      porque:
        rampa: "La doble rampa da unas pocas medidas por segundo: la de los multímetros."
        sigma: "El sigma-delta da miles de muestras con 24 bits, y su filtro retrasa el dato."
        pipeline: "El pipeline llega a cientos de megamuestras, pero entrega el dato varios ciclos después."
        flash: "El flash da gigamuestras con 6 a 8 bits: osciloscopios y radio."
    exito: "Un SAR: el compromiso más equilibrado, el de los microcontroladores y el control. Resolución y velocidad se intercambian, y cada arquitectura elige su punto."
    escalera: ["Busque la zona de megamuestras y de 8 a 18 bits."]
    solucion: "En el centro: el SAR."

  - id: explore-flash
    tipo: explorar
    titulo: "Comparar con todo a la vez"
    texto: "Un flash tiene un comparador por cada nivel posible. Suba los bits hasta donde suelen llegar los flash reales y mire cuántos hacen falta."
    libro: [90, 92]
    inicio: { n_f: 6 }
    widget:
      tipo: grafica
      x: { id: nx, min: 4, max: 12, unidad: "", rotulo: "bits" }
      y: { min: 10, max: 5000, unidad: "", rotulo: "comparadores", escala: log }
      curvas:
        - { expr: "2^nx - 1", color: azul, rotulo: "Flash" }
      marcas:
        - { x: "n_f", y: "N_c", rotulo: "Sus bits" }
      lectura: { valor: N_c, rotulo: "Comparadores" }
      mandos:
        - { valor: n_f, lista: [6, 8], rotulo: "Bits" }
    objetivo:
      condiciones:
        - { valor: n_f, min: 8, rotulo: "Bits: {{n_f}}" }
      logrado: "{{n_f}} bits: {{N_c}} comparadores, todos comparando a la vez. Es el más rápido posible, y su precio crece igual que su número."
      pistas:
        - { texto: "Los flash llegan a 8 bits: suba." }
    escalera: ["2ⁿ − 1 comparadores."]
    solucion: "8 bits: 255 comparadores."
    comprobar:
      - { con: { n_f: 8 }, N_c: 255 }

  - id: prediga-diez
    tipo: leer
    titulo: "Un flash de 10 bits"
    texto: "Escriba cuántos comparadores llevaría un flash de 10 bits."
    libro: [92]
    fijar: { n_f: 10 }
    widget:
      tipo: grafica
      x: { id: nx, min: 4, max: 12, unidad: "", rotulo: "bits" }
      y: { min: 10, max: 5000, unidad: "", rotulo: "comparadores", escala: log }
      curvas:
        - { expr: "2^nx - 1", color: azul, rotulo: "Flash" }
      mandos: []
    leer:
      objetivo: N_c
      unidad: ""
      tol: 0.002
      rotulo: "Comparadores"
      errores:
        - { expr: "N_p", texto: "El precio no crece en proporción a los bits, sino exponencialmente." }
        - { expr: "N_d", texto: "Eso sería un bit más. Con dos bits más, el cuádruple." }
    exito: "{{N_c}}: cuatro veces más. Área, consumo y capacidad de entrada crecen igual: por eso los flash rara vez pasan de 8 bits."
    escalera: ["2ⁿ − 1 con n = 10."]
    solucion: "2¹⁰ − 1 = 1 023."
    comprobar:
      - { N_c: 1023, N_p: 318.75, N_d: 510 }

  - id: explore-asentamiento
    tipo: explorar
    titulo: "La exigencia oculta del SAR"
    texto: "Un SAR resuelve n bits en n ciclos, con la entrada quieta. Tras un salto, su error de 2ⁿ LSB debe caer bajo medio LSB: elija los bits que piden 9,0 τ."
    libro: [95, 97, 98, 99]
    inicio: { n_s: 8 }
    widget:
      tipo: grafica
      x: { id: tx, min: 0, max: 16, unidad: "τ", rotulo: "t/τ" }
      y: { min: 0.01, max: 300000, unidad: LSB, rotulo: "error", escala: log }
      curvas:
        - { expr: "2^n_s*exp(-tx)", color: azul, rotulo: "Error" }
        - { expr: "0.5", color: tinta, rotulo: "Medio LSB", discontinua: true }
      marcas:
        - { x: "k_t", y: "0.5", rotulo: "Asentado" }
      lectura: { valor: k_t, rotulo: "Constantes de tiempo" }
      mandos:
        - { valor: n_s, lista: [8, 12, 16], rotulo: "Bits" }
    objetivo:
      condiciones:
        - { valor: k_t, objetivo: 9.01, tol: 0.01, rotulo: "Constantes de tiempo: {{k_t}}" }
      logrado: "{{n_s}} bits: {{k_t}}, ln(2ⁿ⁺¹). Los cinco τ del 1 % no bastan ni de lejos."
      pistas:
        - { cuando: { valor: k_t, mayor: 10 }, texto: "Demasiados bits: piden más tiempo." }
        - { texto: "Con menos bits basta menos tiempo: suba." }
    escalera: ["ln(2ⁿ⁺¹) τ."]
    solucion: "12 bits: ln(2¹³) = 9,0 τ."
    comprobar:
      - { con: { n_s: 12 }, k_t: 9.01 }

  - id: estime-dieciseis
    tipo: leer
    titulo: "Dieciséis bits"
    texto: "Calcule cuántas constantes de tiempo necesita la entrada de un SAR de 16 bits tras un salto de fondo de escala, y escríbalo."
    libro: [98, 99]
    fijar: { n_s: 16 }
    widget:
      tipo: grafica
      x: { id: tx, min: 0, max: 16, unidad: "τ", rotulo: "t/τ" }
      y: { min: 0.01, max: 300000, unidad: LSB, rotulo: "error", escala: log }
      curvas:
        - { expr: "2^n_s*exp(-tx)", color: azul, rotulo: "Error" }
        - { expr: "0.5", color: tinta, rotulo: "Medio LSB", discontinua: true }
      mandos: []
    leer:
      objetivo: k_t
      unidad: ""
      tol: 0.02
      rotulo: "Constantes de tiempo"
      errores:
        - { expr: "ln(E_0)", texto: "Eso deja el error en 1 LSB; tiene que bajar a medio: ln(2ⁿ⁺¹)." }
    exito: "{{k_t}}: donde la curva cruza el medio LSB. Con 12 bits, 9,0; con 18, 13,2."
    escalera: ["Son ln(2ⁿ⁺¹) constantes de tiempo."]
    solucion: "ln(2¹⁷) = 11,8 τ."
    comprobar:
      - { k_t: 11.78 }

  - id: porque-buffer
    tipo: porque
    titulo: "Un sensor de alta impedancia"
    texto: "Conectado directamente a un SAR, un sensor de alta impedancia da lecturas erróneas. ¿Por qué no se arreglan promediando?"
    libro: [100]
    fijar: { n_s: 16 }
    widget:
      tipo: grafica
      x: { id: tx, min: 0, max: 16, unidad: "τ", rotulo: "t/τ" }
      y: { min: 0.01, max: 300000, unidad: LSB, rotulo: "error", escala: log }
      curvas:
        - { expr: "2^n_s*exp(-tx)", color: azul, rotulo: "Error" }
        - { expr: "0.5", color: tinta, rotulo: "Medio LSB", discontinua: true }
    opciones:
      - { texto: "El error no es aleatorio: la entrada no llega a asentarse y siempre se queda corta", bien: true, porque: "Promediar quita ruido, no un error sistemático. La solución es un buffer." }
      - { texto: "Porque el SAR no permite promediar", porque: "Sí se puede promediar; lo que no se consigue es quitar un error que se repite igual en cada lectura." }
      - { texto: "Porque el sensor es demasiado ruidoso", porque: "No es ruido: es una carga incompleta del condensador, siempre en el mismo sentido." }
    escalera: ["¿Promediar corrige un error que es igual en todas las muestras?"]
    solucion: "Es un error sistemático: hace falta un buffer, no un promedio."

  - id: pregunta-doble-rampa
    tipo: explorar
    titulo: "20, 100 o 200 ms"
    texto: "Un integrador promedia la entrada durante T_{int}. Elija el tiempo de integración con el que el zumbido de la red de 50 Hz se anula."
    libro: [106, 107]
    inicio: { T_i: 0.015 }
    widget:
      tipo: grafica
      x: { id: tx, min: 0.005, max: 0.045, unidad: s, rotulo: "T_{int}" }
      y: { min: 0, max: 1, unidad: "", rotulo: "residuo de 50 Hz" }
      curvas:
        - { expr: "abs(sin(pi*f_red*tx)/(pi*f_red*tx))", color: azul, rotulo: "Lo que queda del zumbido" }
      marcas:
        - { x: "T_i", y: "r_red", rotulo: "Su integración" }
      lectura: { valor: r_red, rotulo: "Residuo de la red" }
      mandos:
        - { valor: T_i, lista: [0.015, 0.02, 0.025, 0.03], rotulo: "Tiempo de integración" }
    objetivo:
      condiciones:
        - { valor: r_red, max: 0.001, rotulo: "Residuo: {{r_red}}" }
      logrado: "{{T_i}}: un periodo entero de la red. El zumbido se promedia a cero; por eso los multímetros integran 20, 100 o 200 ms."
      pistas:
        - { texto: "Queda zumbido: el integrador corta un periodo de la red por la mitad." }
    escalera: ["Un periodo de la red de 50 Hz dura 20 ms."]
    solucion: "20 ms: un múltiplo del periodo de red."
    comprobar:
      - { con: { T_i: 0.02 }, r_red: 0 }

  - id: pregunta-latencia
    tipo: porque
    titulo: "Más bits, peor control"
    texto: "Para un lazo de control, ¿por qué un sigma-delta de 24 bits a 1 kS/s puede ser peor que un SAR?"
    libro: [112]
    widget:
      tipo: figura
      figura: fig-34.6
      zonas:
        - { id: sar, rotulo: "En el centro", rect: [165, 124, 80, 36] }
    opciones:
      - { texto: "Por su latencia: el filtro digital necesita muchas muestras y retrasa el dato", bien: true, porque: "La latencia es tan importante como la velocidad; un SAR da el dato en la misma muestra." }
      - { texto: "Porque 24 bits son demasiada resolución", porque: "La resolución no estorba; lo que estorba en un lazo es el retardo." }
      - { texto: "Porque es menos lineal", porque: "Al contrario: su linealidad es excelente. Falla por el retardo." }
    escalera: ["¿Qué introduce un retardo en un lazo?"]
    solucion: "La latencia del filtro digital."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [92, 95, 99, 112]
    ideas:
      - { titulo: "Flash.", texto: "2ⁿ − 1 comparadores: rapidísimo y exponencialmente caro." }
      - { titulo: "SAR.", texto: "Búsqueda binaria: n bits en n ciclos, con la entrada asentada en ln(2ⁿ⁺¹) τ." }
      - { titulo: "Sigma-delta y doble rampa.", texto: "Resolución a cambio de velocidad; la latencia cuenta tanto como la velocidad." }
