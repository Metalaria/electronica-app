# Lección 1.2 de la sección 35.11 «Herramientas Adicionales y Resumen» (cap34; etiqueta interna sec-34.11).
# Formato: contenido/lecciones11/GUIA.md (§11.1, figura con zonas). La figura 35.14 reúne las cinco ideas y las cinco
# medidas del capítulo; el «tocar» pide la idea que explica un caso, no leer un rótulo.
leccion: cap34/sec-34.11

libro:
  310: "la cifra honesta no es el número de bits sino el ENOB"
  311: "el filtro antialiasing es analógico y no tiene sustituto"
  312: "La arquitectura decide la latencia, y la latencia importa tanto como la velocidad"
  313: "La referencia es el patrón: la exactitud del sistema es la suya"
  314: "El reloj es el componente crítico en alta velocidad"
  319: "no se puede medir un convertidor mejor que la fuente que lo excita"
  322: "Entrada a masa, mil muestras: la desviación típica da el ruido y de ahí el ENOB real"
  323: "Senoide pura y FFT: da SINAD, THD y espurios"
  324: "Rampa lenta: revela INL y códigos faltantes"
  325: "Escalón: muestra la latencia y distingue la arquitectura"
  326: "Barrido de impedancia de fuente: da el límite real admisible"
  328: "Prescindir del filtro antialiasing porque «la señal es lenta»"
  331: "comprar más allá de ese límite es gastar sin ganar"
  334: "El resultado casi siempre está por debajo de lo nominal"
  "cap34#112": "Un sigma-delta de 24 bits a 1 kS/s puede ser inservible en un lazo de control por su retardo"

modelo:
  valores: {}
  calculos: {}

tarjetas:
  - id: explore-cierre
    tipo: explorar
    titulo: "Cinco ideas y cinco medidas"
    texto: "A la izquierda, lo que hay que retener; a la derecha, cómo se caracteriza un convertidor. Toque una idea y una medida."
    libro: [310, 312, 322, 324]
    widget:
      tipo: figura
      figura: fig-34.14
      zonas:
        - { id: idea1, rotulo: "Primera idea", rect: [4, 22, 166, 36], texto: "El error de cuantificación es irreducible: medio LSB. La cifra honesta, el ENOB." }
        - { id: idea2, rotulo: "Segunda idea", rect: [4, 63, 166, 36], texto: "El aliasing es irreversible: el antialiasing es analógico." }
        - { id: idea3, rotulo: "Tercera idea", rect: [4, 104, 166, 36], texto: "La arquitectura decide la latencia, y la latencia importa tanto como la velocidad." }
        - { id: idea4, rotulo: "Cuarta idea", rect: [4, 143, 166, 37], texto: "La referencia es el patrón: la exactitud del sistema es la suya." }
        - { id: idea5, rotulo: "Quinta idea", rect: [4, 186, 166, 36], texto: "El reloj es el componente crítico en alta velocidad." }
        - { id: medidas, rotulo: "Recuadro de la derecha", rect: [238, 20, 210, 210], texto: "Masa, senoide, rampa, escalón y barrido de impedancia: dicen mucho más que la portada." }
    requiere: { mover: [idea3, medidas] }

  - id: empareje-medidas
    tipo: pregunta
    fase: "Empareje"
    titulo: "Lo que dice cada medida"
    texto: "Una cada medida con lo que revela del convertidor."
    libro: [322, 323, 324, 325, 326, 334]
    emparejar:
      - ["Entrada a masa, mil muestras", "El ruido y el ENOB real"]
      - ["Senoide pura y FFT", "SINAD, THD y espurios"]
      - ["Rampa lenta", "INL y códigos faltantes"]
      - ["Escalón", "La latencia: distingue la arquitectura"]
      - ["Barrido de impedancia de fuente", "El límite real admisible"]
    exito: "El resultado casi siempre queda por debajo de lo nominal: saber cuánto permite diseñar con datos."
    pistas:
      - { texto: "Los códigos faltantes aparecen como saltos al barrer despacio." }
    escalera: ["La FFT mira el espectro: distorsión y espurios."]
    solucion: "Masa, ruido; senoide, SINAD; rampa, INL; escalón, latencia; barrido, impedancia."

  - id: toque-idea
    tipo: tocar
    titulo: "¿Qué idea lo explica?"
    texto: "Un sigma-delta de 24 bits a 1 kS/s resulta inservible en un lazo de control. Toque la idea que lo explica."
    libro: [312, "cap34#112"]
    widget:
      tipo: figura
      figura: fig-34.14
      zonas:
        - { id: idea1, rotulo: "Primera idea", rect: [4, 22, 166, 36] }
        - { id: idea2, rotulo: "Segunda idea", rect: [4, 63, 166, 36] }
        - { id: idea3, rotulo: "Tercera idea", rect: [4, 104, 166, 36] }
        - { id: idea4, rotulo: "Cuarta idea", rect: [4, 143, 166, 37] }
        - { id: idea5, rotulo: "Quinta idea", rect: [4, 186, 166, 36] }
    tocar:
      bien: [idea3]
      porque:
        idea1: "Le sobran bits: el problema no es la resolución."
        idea2: "El aliasing no tiene que ver: lo que falla es el retardo del dato."
        idea4: "La referencia fija la exactitud, no el retardo."
        idea5: "A 1 kS/s el reloj no es el problema."
    exito: "La arquitectura decide la latencia: el filtro digital del sigma-delta retrasa el dato."
    escalera: ["¿Qué estropea un lazo de control aunque la cifra sea buena?"]
    solucion: "La tercera: la latencia importa tanto como la velocidad."

  - id: pregunta-error
    tipo: pregunta
    titulo: "Un error de los que resume el capítulo"
    texto: "La señal de un sensor es lenta. ¿Qué no debe hacerse por ello?"
    libro: [311, 328]
    widget:
      tipo: figura
      figura: fig-34.14
      zonas:
        - { id: idea2, rotulo: "Segunda idea", rect: [4, 63, 166, 36] }
    opciones:
      - { texto: "Prescindir del filtro antialiasing", bien: true, porque: "El aliasing es irreversible: lo que se pliega no se separa después, y el filtro es analógico." }
      - { texto: "Promediar lecturas", porque: "Con una señal lenta, promediar es razonable; el error es quitar el antialiasing." }
      - { texto: "Usar un sigma-delta", porque: "Para señales lentas es justo su nicho." }
    escalera: ["¿Qué ruido de alta frecuencia puede acompañar a una señal lenta?"]
    solucion: "Quitar el antialiasing: el aliasing no tiene arreglo digital."

  - id: pregunta-generador
    tipo: pregunta
    titulo: "El instrumento que limita"
    texto: "Para caracterizar un convertidor con una senoide, ¿qué instrumento limita la medida?"
    libro: [319, 323]
    widget:
      tipo: figura
      figura: fig-34.14
      zonas:
        - { id: medidas, rotulo: "Recuadro de la derecha", rect: [238, 20, 210, 210] }
    opciones:
      - { texto: "El generador de señal: no se mide un convertidor mejor que la fuente que lo excita", bien: true, porque: "Su distorsión aparecería como del convertidor: hace falta uno de baja distorsión." }
      - { texto: "El ordenador que calcula la FFT", porque: "El cálculo es exacto; lo que limita es la pureza de la señal de entrada." }
      - { texto: "El cable", porque: "Puede importar, pero el libro señala el generador como el instrumento limitante." }
    escalera: ["Si la senoide ya trae armónicos, ¿de quién parecerán?"]
    solucion: "El generador de baja distorsión."

  - id: porque-suelo
    tipo: porque
    titulo: "Más bits que el ruido"
    texto: "¿Por qué comprar un convertidor con más bits de los que deja el suelo de ruido es gastar sin ganar?"
    libro: [331, 310]
    widget:
      tipo: figura
      figura: fig-34.14
      zonas:
        - { id: idea1, rotulo: "Primera idea", rect: [4, 22, 166, 36] }
    opciones:
      - { texto: "Los bits por debajo del ruido no informan: el suelo decide cuántos son útiles", bien: true, porque: "La cifra honesta es el ENOB, y la limita el ruido del sistema." }
      - { texto: "Porque los convertidores caros son peores", porque: "No son peores: sus bits de más se pierden bajo el ruido del sistema." }
      - { texto: "Porque el software no los usa", porque: "Se usan, pero solo contienen ruido." }
    escalera: ["¿Qué contiene un bit que está por debajo del ruido?"]
    solucion: "Por debajo del suelo de ruido, los bits solo llevan ruido."

  - id: pregunta-referencia
    tipo: pregunta
    titulo: "El patrón"
    texto: "Un sistema con un convertidor excelente mide con un 1 % de error. ¿Dónde se mira primero?"
    libro: [313]
    widget:
      tipo: figura
      figura: fig-34.14
      zonas:
        - { id: idea4, rotulo: "Cuarta idea", rect: [4, 143, 166, 37] }
    opciones:
      - { texto: "En la referencia: la exactitud del sistema es la suya", bien: true, porque: "Es el patrón: su error pasa entero a todas las medidas." }
      - { texto: "En los bits del convertidor", porque: "Un convertidor excelente no corrige una referencia mala." }
      - { texto: "En el reloj", porque: "El reloj limita en alta velocidad; la exactitud en continua es cosa de la referencia." }
    escalera: ["¿Con qué se compara cada código?"]
    solucion: "La referencia."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [310, 312, 313, 314]
    ideas:
      - { titulo: "ENOB, no bits.", texto: "El error de cuantificación es irreducible y el ruido decide los bits útiles." }
      - { titulo: "Antialiasing, latencia, referencia, reloj.", texto: "Las otras cuatro ideas del capítulo." }
      - { titulo: "Medir.", texto: "Masa, senoide, rampa, escalón y barrido de impedancia." }
