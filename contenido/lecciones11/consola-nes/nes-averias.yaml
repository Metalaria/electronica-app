# «Consolas por dentro» · NES 7: averías típicas. Las dos dolencias clásicas de la NES de carga frontal (el desgaste de
# los 72 contactos y un diálogo del 10NES que falla: Silvestron Board Maps), el bucle de reset de 1 Hz y lo que no
# arregla anular el CIC (ConsoleMods), el ruido del módulo de alimentación original (ConsoleMods, NESRevival PSU) y el
# orden del libro: lo simple primero (capítulo 55).
leccion: consola-nes/nes-averias

libro:
  "nes#16": "Conector de cartucho (72 contactos)"
  "nes#53": "la consola entra en un bucle de reset de 1 Hz"
  "nes#40": "dialoga con la CIC del cartucho con su propio reloj de 4 MHz"
  "nes#58": "Saltarse el bloqueo no arregla las malas conexiones"
  "nes#59": "su famosa avería de la luz roja que parpadea vino del desgaste de los 72 contactos"
  "nes#60": "son las dos dolencias clásicas de la NES de carga frontal"
  "nes#61": "El módulo de alimentación original de la NES es muy ruidoso y está mal trazado"
  "nes#62": "puede afectar a la calidad de la imagen y del sonido"
  "nes#25": "Entrada de +9 V y +5 V desde la placa de alimentación"
  "cap53#39": "Casi siempre es lo simple: alimentación, conector, soldadura, fusible"

modelo:
  valores: {}
  calculos: {}

tarjetas:
  - id: explore-sospechosos
    tipo: explorar
    titulo: "Los sospechosos de siempre"
    texto: "Casi siempre es lo simple: alimentación, conector, soldadura. Toque el conector de alimentación, el del cartucho y el CIC."
    libro: ["cap53#39", "nes#16", "nes#25"]
    requiere: { mover: [p6, cart, cic] }
    widget:
      tipo: figura
      consola: { maquina: nes }
      zonas:
        - { id: p6, hotspot: P6, rotulo: "Alimentación (P6)", texto: "Por aquí llegan los +9 V y los +5 V." }
        - { id: cart, hotspot: P1, rotulo: "Conector de 72 contactos", texto: "Lleva al cartucho los dos buses." }
        - { id: cic, hotspot: U10, rotulo: "CIC", texto: "El chip de bloqueo, que reinicia si no encuentra pareja." }

  - id: prediga-parpadeo
    tipo: predecir
    titulo: "La luz que parpadea"
    texto: "Una NES de carga frontal parpadea y no arranca el juego. ¿Qué es lo primero que sospecha?"
    libro: ["nes#59", "nes#60", "nes#53", "nes#40"]
    widget:
      tipo: figura
      consola: { maquina: nes }
      zonas:
        - { id: cart, hotspot: P1, rotulo: "Conector de 72 contactos" }
    opciones:
      - texto: "El desgaste de los 72 contactos del conector."
        bien: true
        porque: "Es la avería famosa de esta consola: la luz roja que parpadea vino del desgaste de los 72 contactos."
      - texto: "La PPU, que no saca imagen."
        porque: "Una PPU estropeada no explica que la consola se reinicie una y otra vez: eso es el CIC sin su pareja."
      - texto: "El cristal maestro, que se ha parado."
        porque: "El cristal maestro no reinicia la consola: el reinicio lo da el CIC, que va con su propio reloj."
    escalera:
      - "Piense en por dónde dialogan los dos CIC."
    solucion: "El conector de 72 contactos, gastado: la avería clásica de la carga frontal."

  - id: empareje-sintomas
    tipo: pregunta
    fase: "Empareje"
    titulo: "Síntoma y causa"
    texto: "Empareje cada síntoma con su causa más conocida."
    libro: ["nes#59", "nes#53", "nes#62"]
    emparejar:
      - ["Luz roja que parpadea", "Los 72 contactos gastados"]
      - ["Reinicio una vez por segundo", "El CIC no encuentra su pareja"]
      - ["Imagen y sonido con ruido", "El módulo de alimentación original"]
    exito: "Tres síntomas, tres sitios donde mirar."
    pistas:
      - { texto: "El reinicio de 1 Hz lo da el CIC; el ruido, la alimentación." }
    escalera:
      - "La luz que parpadea es la avería famosa del conector."
    solucion: "Parpadeo: los 72 contactos. Reinicio de 1 Hz: el CIC sin pareja. Ruido: el módulo de alimentación."

  - id: por-que-anular
    tipo: porque
    titulo: "Anular el CIC"
    texto: "Alguien propone anular el CIC para acabar con el parpadeo de unos contactos gastados. ¿Sirve?"
    libro: ["nes#58", "nes#59", "nes#16"]
    widget:
      tipo: figura
      consola: { maquina: nes }
      zonas:
        - { id: cic, hotspot: U10, rotulo: "CIC" }
        - { id: cart, hotspot: P1, rotulo: "Conector de 72 contactos" }
    opciones:
      - texto: "No: anular el bloqueo no arregla las malas conexiones."
        bien: true
        porque: "Saltarse el bloqueo no arregla las malas conexiones, y por esos contactos pasan también los dos buses."
      - texto: "Sí: sin CIC ya no hay reinicios."
        porque: "Las malas conexiones siguen ahí: anular el bloqueo no las arregla."
      - texto: "Sí, y además protege las partidas guardadas."
        porque: "Es al revés: anular el bloqueo puede corromper las partidas de juegos con SRAM mapeada."
    escalera:
      - "¿Qué más pasa por esos 72 contactos, además del CIC?"
    solucion: "No: anular el bloqueo no arregla las malas conexiones; hay que arreglar el conector."

  - id: toque-desgaste
    tipo: tocar
    titulo: "Dónde está el desgaste"
    texto: "Toque la pieza cuyo desgaste da la luz que parpadea."
    libro: ["nes#59", "nes#16"]
    widget:
      tipo: figura
      consola: { maquina: nes }
      zonas:
        - { id: cart, hotspot: P1, rotulo: "Conector largo, abajo" }
        - { id: cic, hotspot: U10, rotulo: "Chip pequeño, a la derecha" }
        - { id: exp, hotspot: P2, rotulo: "Conector largo, arriba" }
    tocar:
      bien: [cart]
      porque:
        cic: "El CIC reinicia la consola, pero lo que se gasta es el conector por el que habla."
        exp: "Es el puerto de expansión, que casi no se usó."
    exito: "El conector de 72 contactos: el que se gasta con cada cartucho."
    escalera:
      - "Es el conector que se usa cada vez que se mete un juego."
    solucion: "El conector de cartucho, de 72 contactos, abajo."

  - id: ruido
    tipo: pregunta
    titulo: "Ruido en la imagen"
    texto: "Una NES funciona, pero la imagen tiene interferencias y el sonido, zumbido. ¿Qué sospecha?"
    libro: ["nes#61", "nes#62", "nes#25"]
    widget:
      tipo: figura
      consola: { maquina: nes }
      zonas:
        - { id: p6, hotspot: P6, rotulo: "Alimentación (P6)" }
    opciones:
      - texto: "El módulo de alimentación original, que es ruidoso."
        bien: true
        porque: "Está mal trazado, con una masa enrevesada, y su ruido puede afectar a la imagen y al sonido."
      - texto: "El CIC, que reinicia la consola."
        porque: "Si el CIC reiniciara, la consola no funcionaría. Aquí funciona, con ruido."
      - texto: "El conector de 72 contactos."
        porque: "Unos contactos gastados dan reinicios o fallos del juego, no un ruido constante en imagen y sonido."
    escalera:
      - "La consola funciona: busque algo que ensucie las señales."
    solucion: "El módulo de alimentación original: su ruido llega a la imagen y al sonido."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: ["nes#59", "nes#60", "nes#58", "nes#62"]
    ideas:
      - { titulo: "Lo clásico.", texto: "Los 72 contactos gastados y el diálogo del CIC que falla." }
      - { titulo: "El síntoma.", texto: "Una consola que se reinicia una vez por segundo." }
      - { titulo: "No es atajo.", texto: "Anular el CIC no arregla las malas conexiones." }
      - { titulo: "El ruido.", texto: "El módulo de alimentación original ensucia imagen y sonido." }
