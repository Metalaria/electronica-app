# «Consolas por dentro» · NES 7: averías típicas. Las dos dolencias clásicas de la NES de carga frontal (el desgaste de
# los 72 contactos y un diálogo del 10NES que falla: Silvestron Board Maps), el bucle de reset de 1 Hz y lo que no
# arregla anular el CIC (ConsoleMods), el ruido del módulo de alimentación original (ConsoleMods, NESRevival PSU) y el
# orden del libro: lo simple primero (capítulo 55).
# 1.2.1: un circuito lógico vivo con meta: el juego arranca si los 72 contactos conectan y el bloqueo pasa (llave o
# patilla 4 a masa; nes#16, nes#53, nes#54, nes#58). Lo simple primero se toca en orden en la foto; cada síntoma, en su
# pieza. Sin valores de tensión con fuente: no hay paso «averia».
leccion: consola-nes/nes-averias

libro:
  "nes#16": "Conector de cartucho (72 contactos)"
  "nes#53": "la consola entra en un bucle de reset de 1 Hz"
  "nes#54": "Llevando a masa la patilla 4 de la «cerradura» se desactiva el bloqueo"
  "nes#11": "si no coinciden, reinicia la consola una vez por segundo"
  "nes#40": "dialoga con la CIC del cartucho con su propio reloj de 4 MHz"
  "nes#58": "Saltarse el bloqueo no arregla las malas conexiones"
  "nes#59": "su famosa avería de la luz roja que parpadea vino del desgaste de los 72 contactos"
  "nes#60": "son las dos dolencias clásicas de la NES de carga frontal"
  "nes#61": "El módulo de alimentación original de la NES es muy ruidoso y está mal trazado"
  "nes#62": "puede afectar a la calidad de la imagen y del sonido"
  "nes#25": "Entrada de +9 V y +5 V desde la placa de alimentación"
  "cap53#39": "Casi siempre es lo simple: alimentación, conector, soldadura, fusible"

modelo:
  valores: {}
  calculos: {}

tarjetas:
  - id: explore-arranque
    tipo: explorar
    titulo: "Para que arranque"
    texto: "El juego necesita que los 72 contactos conecten y que el bloqueo pase. Consiga que arranque."
    libro: ["nes#16", "nes#53", "nes#54", "nes#58"]
    widget:
      tipo: logica
      entradas: [{ id: CT, rotulo: "Contactos limpios" }, { id: LL, rotulo: "Llave en el cartucho" }, { id: P4, rotulo: "Patilla 4 a masa" }]
      piezas:
        - { id: o1, tipo: or, entradas: [LL, P4] }
        - { id: a1, tipo: and, entradas: [CT, o1] }
      salidas:
        - { id: JUEGO, de: a1, rotulo: "Arranca el juego" }
    objetivo:
      condiciones:
        - { led: JUEGO, valor: 1, rotulo: "Arranca el juego" }
      logrado: "Contactos limpios y el bloqueo superado. Con los contactos gastados no hay atajo: saltarse el bloqueo no arregla las malas conexiones."
      pistas:
        - { texto: "Por esos 72 contactos pasan los dos buses: sin ellos no hay juego, pase o no el bloqueo." }
    escalera:
      - "Limpie los contactos y ponga la llave, o la patilla 4 a masa."
    solucion: "Contactos limpios y, además, llave o patilla 4 a masa."

  - id: prediga-parpadeo
    tipo: tocar
    fase: "Ordene"
    titulo: "Lo simple primero"
    texto: "Casi siempre es lo simple: alimentación, conector, soldadura, fusible. Toque, por ese orden, las dos primeras piezas que revisaría."
    libro: ["cap53#39", "nes#25", "nes#16"]
    widget:
      tipo: figura
      consola: { maquina: nes }
      recorte: [0, 248, 1514, 754]
      ampliar: 3.8
      zonas:
        - { id: p6, hotspot: P6, rotulo: "Conector azul, a la derecha" }
        - { id: cart, hotspot: P1, rotulo: "Conector largo, abajo" }
        - { id: cic, hotspot: U10, rotulo: "Chip pequeño, en el centro a la derecha" }
        - { id: ppu, hotspot: U5, rotulo: "Chip largo, en el centro" }
    tocar:
      bien: [p6, cart]
      orden: true
      porque:
        cic: "Un chip va después: antes, lo simple, que lleguen las tensiones y que el conector haga contacto."
        ppu: "Un chip va después: antes, lo simple, que lleguen las tensiones y que el conector haga contacto."
    pistas:
      - { texto: "Primero, que lleguen las tensiones; después, el conector." }
    exito: "P6, por donde llegan los +9 V y los +5 V, y el conector de 72 contactos. Los chips, al final."
    escalera:
      - "La alimentación entra por el conector azul."
    solucion: "P6 y luego el conector del cartucho."

  - id: toque-desgaste
    tipo: tocar
    titulo: "Dónde está el desgaste"
    texto: "Una NES de carga frontal parpadea y no arranca el juego. Toque la pieza cuyo desgaste da esa luz roja que parpadea."
    libro: ["nes#59", "nes#60", "nes#16"]
    widget:
      tipo: figura
      consola: { maquina: nes }
      recorte: [0, 99, 1313, 962]
      ampliar: 3.3
      zonas:
        - { id: cart, hotspot: P1, rotulo: "Conector largo, abajo" }
        - { id: cic, hotspot: U10, rotulo: "Chip pequeño, a la derecha" }
        - { id: exp, hotspot: P2, rotulo: "Conector largo, arriba" }
    tocar:
      bien: [cart]
      porque:
        cic: "El CIC reinicia la consola, pero lo que se gasta es el conector por el que habla."
        exp: "Es el puerto de expansión, que casi no se usó."
    exito: "El conector de 72 contactos: el que se gasta con cada cartucho."
    escalera:
      - "Es el conector que se usa cada vez que se mete un juego."
    solucion: "El conector de cartucho, de 72 contactos, abajo."

  - id: empareje-sintomas
    tipo: tocar
    titulo: "Un reinicio por segundo"
    texto: "Con un cartucho sin su chip de bloqueo, la consola se reinicia una vez por segundo. Toque el chip que la reinicia."
    libro: ["nes#53", "nes#40", "nes#11"]
    widget:
      tipo: figura
      consola: { maquina: nes }
      recorte: [0, 248, 1514, 754]
      ampliar: 3.8
      zonas:
        - { id: p6, hotspot: P6, rotulo: "Conector azul, a la derecha" }
        - { id: cart, hotspot: P1, rotulo: "Conector largo, abajo" }
        - { id: cic, hotspot: U10, rotulo: "Chip pequeño, en el centro a la derecha" }
        - { id: ppu, hotspot: U5, rotulo: "Chip largo, en el centro" }
    tocar:
      bien: [cic]
      porque:
        p6: "Una alimentación que falla no reinicia a 1 Hz exactos: eso es el CIC sin pareja."
        cart: "Por el conector dialogan los dos CIC, pero quien reinicia es el de la consola."
        ppu: "La PPU no genera el reset: lo recibe del CIC."
    exito: "El CIC: dialoga con el del cartucho con su propio reloj de 4 MHz y mantiene el reset mientras no se entienden."
    escalera:
      - "Es el chip que genera el /RST de la CPU y de la PPU."
    solucion: "El CIC 3193A (U10)."

  - id: ruido
    tipo: tocar
    titulo: "Ruido en la imagen"
    texto: "Una NES funciona, pero la imagen tiene interferencias y el sonido, zumbido. Toque por dónde entra lo que lo causa."
    libro: ["nes#61", "nes#62", "nes#25"]
    widget:
      tipo: figura
      consola: { maquina: nes }
      recorte: [0, 248, 1514, 754]
      ampliar: 3.8
      zonas:
        - { id: p6, hotspot: P6, rotulo: "Conector azul, a la derecha" }
        - { id: cart, hotspot: P1, rotulo: "Conector largo, abajo" }
        - { id: cic, hotspot: U10, rotulo: "Chip pequeño, en el centro a la derecha" }
        - { id: ppu, hotspot: U5, rotulo: "Chip largo, en el centro" }
    tocar:
      bien: [p6]
      porque:
        cart: "Unos contactos gastados dan reinicios o fallos del juego, no un ruido constante."
        cic: "Si el CIC reiniciara, la consola no funcionaría; aquí funciona, con ruido."
        ppu: "La PPU genera el vídeo, pero el ruido llega de la alimentación."
    exito: "P6, desde el módulo de alimentación original: es muy ruidoso, mal trazado y con una masa enrevesada, y su ruido llega a la imagen y al sonido."
    escalera:
      - "La consola funciona: busque algo que ensucie todas las señales a la vez."
    solucion: "El conector de alimentación P6."

  - id: por-que-anular
    tipo: porque
    titulo: "Anular el CIC"
    texto: "Alguien propone anular el CIC para acabar con el parpadeo de unos contactos gastados. ¿Sirve?"
    libro: ["nes#58", "nes#59", "nes#16"]
    widget:
      tipo: figura
      consola: { maquina: nes }
      recorte: [0, 475, 1313, 545]
      ampliar: 3.3
      zonas:
        - { id: cic, hotspot: U10, rotulo: "CIC" }
        - { id: cart, hotspot: P1, rotulo: "Conector de 72 contactos" }
    opciones:
      - texto: "No: anular el bloqueo no arregla las malas conexiones."
        bien: true
        porque: "Saltarse el bloqueo no arregla las malas conexiones, y por esos contactos pasan también los dos buses."
      - texto: "Sí: sin CIC ya no hay reinicios."
        porque: "Las malas conexiones siguen ahí: anular el bloqueo no las arregla."
      - texto: "Sí, y además protege las partidas guardadas."
        porque: "Es al revés: anular el bloqueo puede corromper las partidas de juegos con SRAM mapeada."
    escalera:
      - "¿Qué más pasa por esos 72 contactos, además del CIC?"
    solucion: "No: anular el bloqueo no arregla las malas conexiones; hay que arreglar el conector."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: ["nes#59", "nes#60", "nes#58", "nes#62"]
    ideas:
      - { titulo: "Lo clásico.", texto: "Los 72 contactos gastados y el diálogo del CIC que falla." }
      - { titulo: "El síntoma.", texto: "Una consola que se reinicia una vez por segundo." }
      - { titulo: "No es atajo.", texto: "Anular el CIC no arregla las malas conexiones." }
      - { titulo: "El ruido.", texto: "El módulo de alimentación original ensucia imagen y sonido." }
