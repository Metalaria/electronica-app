# «Consolas por dentro» · NES 6: el CIC 3193A (10NES). Lo que hace (datos del explorador), el bucle de reset de 1 Hz, la
# patilla 4 y sus advertencias (ConsoleMods, «NES:Disabling CIC Chip», en los hechos externos del manifiesto) y lo que
# cambia entre la NES-CPU-07 de la foto y las -09 a -11 (aviso del explorador).
# 1.2.1: el bloqueo es un circuito lógico vivo: sale del reset si el cartucho trae su llave o si la patilla 4 está a
# masa (nes#53, nes#54), con meta y con su tabla; se escribe el periodo del bucle de reset; se toca el chip de la
# patilla 4. Las maniobras de ConsoleMods (antes un emparejar) y la R17 de las -09 a -11 van en los éxitos.
leccion: consola-nes/nes-bloqueo

libro:
  "nes#0": "La NES-CPU-07 de la foto es eléctricamente la misma placa sin R17 (2,2 kΩ en el reloj de la CIC)"
  "nes#11": "si no coinciden, reinicia la consola una vez por segundo"
  "nes#15": "Su reloj también va al cartucho (CIC-CLK)"
  "nes#40": "mantiene /RST mientras no se entienden"
  "nes#52": "busca su pareja en el cartucho"
  "nes#53": "la consola entra en un bucle de reset de 1 Hz"
  "nes#54": "Llevando a masa la patilla 4 de la «cerradura» se desactiva el bloqueo"
  "nes#55": "el 10NES lleva la marca 3193A"
  "nes#56": "Cortar la patilla 4 sin llevarla a masa no se recomienda del todo"
  "nes#57": "Algunos cartuchos de Nintendo necesitan la señal de reset del cartucho que genera el CIC"
  "nes#58": "puede corromper las partidas de los juegos con SRAM mapeada directamente"

modelo:
  valores:
    T_r: { sim: "T", nombre: "periodo del reset", unidad: s, valor: 1 }
  calculos:
    f_r: { expr: "1/T_r", sim: "f", nombre: "frecuencia del bucle de reset", unidad: Hz }

tarjetas:
  - id: explore-cic
    tipo: explorar
    titulo: "La cerradura"
    texto: "El CIC de la consola busca su pareja, la «llave», en el cartucho; sin ella, mantiene el reset. Consiga que la consola salga del reset."
    libro: ["nes#52", "nes#53", "nes#54", "nes#40"]
    widget:
      tipo: logica
      entradas: [{ id: LL, rotulo: "Llave en el cartucho" }, { id: P4, rotulo: "Patilla 4 a masa" }]
      piezas:
        - { id: o1, tipo: or, entradas: [LL, P4] }
      salidas:
        - { id: SALE, de: o1, rotulo: "Sale del reset" }
    objetivo:
      condiciones:
        - { led: SALE, valor: 1, rotulo: "Sale del reset" }
      logrado: "Con la llave, el CIC del cartucho contesta; con la patilla 4 a masa, el bloqueo queda desactivado. Cualquiera de las dos basta."
      pistas:
        - { texto: "Sin llave y sin tocar la patilla 4, el CIC reinicia la consola una y otra vez." }
    escalera:
      - "Ponga un cartucho con su CIC, o lleve a masa la patilla 4."
    solucion: "Llave en el cartucho, o patilla 4 a masa."

  - id: tabla-cic
    tipo: tabla
    titulo: "Cuándo arranca"
    texto: "Rellene cuándo sale del reset la consola (1: sale)."
    libro: ["nes#53", "nes#54"]
    widget:
      tipo: logica
      entradas: [{ id: LL, rotulo: "Llave en el cartucho" }, { id: P4, rotulo: "Patilla 4 a masa" }]
      piezas:
        - { id: o1, tipo: or, entradas: [LL, P4] }
      salidas:
        - { id: SALE, de: o1, rotulo: "Sale del reset" }
      ocultar: true
    tabla:
      salidas: [SALE]
    exito: "Solo se queda en el bucle sin llave y sin la patilla 4 a masa."
    escalera:
      - "Basta con una de las dos."
    solucion: "Sale en las tres filas con llave o con la patilla 4 a masa; sin ninguna, bucle de reset."

  - id: estime-periodo
    tipo: leer
    titulo: "Cada cuánto"
    texto: "Sin pareja, la consola entra en un bucle de reset de 1 Hz. Escriba cada cuántos segundos se reinicia."
    libro: ["nes#11", "nes#53", "nes#15"]
    widget:
      tipo: figura
      consola: { maquina: nes }
      recorte: [821, 475, 330, 197]
      zonas:
        - { id: cic, hotspot: U10, rotulo: "CIC 3193A" }
    leer:
      objetivo: T_r
      unidad: s
      tol: 0.05
      rotulo: "Periodo del reset"
    exito: "Una vez por segundo: el CIC genera el /RST de la CPU y de la PPU, y el juego no arranca."
    escalera:
      - "El periodo es la inversa de la frecuencia: 1 / 1 Hz."
    solucion: "1 s."
    comprobar:
      - { f_r: 1 }

  - id: toque-cic
    tipo: tocar
    titulo: "Encuentre el CIC"
    texto: "Llevando a masa la patilla 4 de la «cerradura» se desactiva el bloqueo. Toque el chip en el que se hace."
    libro: ["nes#55", "nes#11", "nes#54", "nes#56", "nes#0"]
    widget:
      tipo: figura
      consola: { maquina: nes }
      recorte: [36, 254, 1240, 414]
      ampliar: 3.7
      zonas:
        - { id: cic, hotspot: U10, rotulo: "Chip pequeño, abajo a la derecha" }
        - { id: inv, hotspot: U9, rotulo: "Chip pequeño, más a la derecha" }
        - { id: dec, hotspot: U3, rotulo: "Chip pequeño, arriba a la izquierda" }
    tocar:
      bien: [cic]
      porque:
        inv: "Es U9, los inversores 74HCU04: uno hace el oscilador del CIC, pero no es el CIC."
        dec: "Es U3, el decodificador de direcciones."
    exito: "U10, el 10NES: en las NTSC lleva la marca 3193A. La patilla se corta en su base y se suelda a un hilo a masa: cortarla sin llevarla a masa puede dañarlo."
    escalera:
      - "Está entre la PPU y el modulador, junto a su cristal de 4 MHz."
    solucion: "U10, en el centro a la derecha: 3193A."

  - id: por-que-reset-cartucho
    tipo: porque
    titulo: "Un cartucho que no arranca"
    texto: "Con el CIC anulado, algunos cartuchos de Nintendo no funcionan. ¿Por qué?"
    libro: ["nes#57", "nes#40", "nes#58"]
    widget:
      tipo: figura
      consola: { maquina: nes }
      zonas:
        - { id: cart, hotspot: P1, rotulo: "Conector de cartucho" }
    opciones:
      - texto: "Necesitan la señal de reset del cartucho que genera el CIC."
        bien: true
        porque: "El CIC no solo bloquea: también da el reset del cartucho. Y saltarse el bloqueo puede corromper las partidas de los juegos con SRAM mapeada."
      - texto: "Detectan que la consola es de otra región."
        porque: "No es la región: es una señal del CIC que esos cartuchos usan."
      - texto: "El CIC anulado deja la consola sin reloj."
        porque: "El reloj maestro no pasa por el CIC: lo que falta es su señal de reset del cartucho."
    escalera:
      - "¿Qué más genera el CIC, además del bloqueo?"
    solucion: "Necesitan la señal de reset del cartucho que genera el CIC."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: ["nes#52", "nes#53", "nes#54", "nes#57"]
    ideas:
      - { titulo: "Cerradura y llave.", texto: "El CIC de la consola busca su pareja en el cartucho." }
      - { titulo: "Sin pareja.", texto: "Un bucle de reset de 1 Hz: el juego no arranca." }
      - { titulo: "La patilla 4.", texto: "A masa anula el bloqueo; sin masa puede dañarlo." }
      - { titulo: "Con efectos.", texto: "Algunos cartuchos necesitan el reset del CIC." }
