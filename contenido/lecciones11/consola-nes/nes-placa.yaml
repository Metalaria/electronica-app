# «Consolas por dentro» · NES 1: la placa de un vistazo, sobre la foto de la NES-CPU-07 (figura 38.16 del libro, Evan-Amos,
# dominio público), la del explorador. Fuentes: los datos de la consola (nes#n, scripts/consolas11.mjs) y la sección 38.11
# del libro, el caso de estudio de esta consola.
leccion: consola-nes/nes-placa

libro:
  "nes#2": "Núcleo 6502 (sin modo decimal) con la APU de sonido, el DMA de sprites y la E/S de los mandos integrados"
  "nes#3": "genera el vídeo compuesto NTSC punto a punto"
  "nes#4": "Los 2 KB de RAM de la CPU"
  "nes#5": "Los 2 KB de RAM de la PPU: dos nametables de 1 KB"
  "nes#7": "Doble decodificador 2 a 4"
  "nes#11": "si no coinciden, reinicia la consola una vez por segundo"
  "nes#10": "Seis inversores sin búfer (U = unbuffered) con tres usos"
  "nes#12": "Seis veces la subportadora NTSC (6 × 3,579545 MHz)"
  "nes#16": "Lleva al cartucho los dos buses completos"
  "cap37#325": "un procesador de 8 bits, 2 kB de memoria de trabajo y 2 kB de vídeo"
  "cap37#348": "Integra el generador de sonido y el controlador de acceso directo a memoria"
  "cap37#362": "genera 256 × 240 píxeles"
  "cap37#432": "Placa base de la NES original (NES-CPU-07, 1987)"

modelo:
  valores: {}
  calculos: {}

tarjetas:
  - id: explore-chips
    tipo: explorar
    titulo: "Los chips de la NES"
    texto: "Toque la CPU, la PPU y las dos memorias. Es la placa de la foto del libro, una NES-CPU-07."
    libro: ["nes#2", "nes#3", "nes#4", "nes#5", "cap37#432"]
    requiere: { mover: [cpu, ppu, wram, ciram] }
    widget:
      tipo: figura
      consola: { maquina: nes }
      zonas:
        - { id: cpu, hotspot: U6, rotulo: "CPU RP2A03G", texto: "Un 6502 sin modo decimal, con el sonido, el DMA de sprites y los mandos dentro." }
        - { id: ppu, hotspot: U5, rotulo: "PPU RP2C02G", texto: "Genera el vídeo compuesto NTSC punto a punto." }
        - { id: wram, hotspot: U1, rotulo: "SRAM de trabajo", texto: "Los 2 KB de RAM de la CPU." }
        - { id: ciram, hotspot: U4, rotulo: "SRAM de vídeo", texto: "Los 2 KB de la PPU: dos nametables de 1 KB." }

  - id: toque-cpu
    tipo: tocar
    titulo: "¿Cuál es la CPU?"
    texto: "Toque el chip que lleva dentro el procesador, el sonido y el DMA."
    libro: ["nes#2", "nes#3", "cap37#348"]
    widget:
      tipo: figura
      consola: { maquina: nes }
      zonas:
        - { id: cpu, hotspot: U6, rotulo: "Chip largo, a la izquierda" }
        - { id: ppu, hotspot: U5, rotulo: "Chip largo, en el centro" }
        - { id: wram, hotspot: U1, rotulo: "Chip mediano, abajo a la izquierda" }
    tocar:
      bien: [cpu]
      porque:
        ppu: "Es la PPU: hace el vídeo, no ejecuta el programa."
        wram: "Es la SRAM de trabajo: guarda datos, no los procesa."
    exito: "El RP2A03G: un 6502 con el generador de sonido y el DMA en el mismo encapsulado."
    escalera:
      - "Lea las marcas: busque «RP2A03»."
    solucion: "El chip largo de la izquierda: RP2A03G."

  - id: prediga-memoria
    tipo: predecir
    titulo: "Poca memoria"
    texto: "¿Cuánta RAM tiene la NES en la placa, entre la CPU y la PPU?"
    libro: ["cap37#325", "nes#4", "nes#5"]
    widget:
      tipo: figura
      consola: { maquina: nes }
      zonas:
        - { id: wram, hotspot: U1, rotulo: "SRAM de trabajo" }
        - { id: ciram, hotspot: U4, rotulo: "SRAM de vídeo" }
    opciones:
      - texto: "2 KB de trabajo y 2 KB de vídeo."
        bien: true
        porque: "Dos MB8416A de 2 KB: la de la CPU y la de la PPU, con dos nametables de 1 KB."
      - texto: "2 KB en total, repartidos."
        porque: "Hay dos chips de 2 KB, uno por procesador: 2 KB cada uno."
      - texto: "Toda la del juego: la ROM es RAM."
        porque: "La ROM del juego está en el cartucho y no se escribe. En la placa solo hay 2 KB de trabajo y 2 KB de vídeo."
    escalera:
      - "Hay dos chips de memoria iguales."
    solucion: "2 KB de trabajo (U1) y 2 KB de vídeo (U4)."

  - id: toque-decodificador
    tipo: tocar
    titulo: "El que elige"
    texto: "Toque el chip pequeño que decide qué memoria contesta a cada dirección de la CPU."
    libro: ["nes#7", "nes#2", "nes#10", "nes#11"]
    widget:
      tipo: figura
      consola: { maquina: nes }
      zonas:
        - { id: dec, hotspot: U3, rotulo: "Chip pequeño, arriba a la izquierda" }
        - { id: cic, hotspot: U10, rotulo: "Chip pequeño, en el centro a la derecha" }
        - { id: inv, hotspot: U9, rotulo: "Chip pequeño, a la derecha" }
        - { id: latch, hotspot: U2, rotulo: "Chip mediano, en el centro" }
    tocar:
      bien: [dec]
      porque:
        cic: "Es el CIC, el chip de bloqueo."
        inv: "Son los inversores 74HCU04: osciladores, una puerta y el audio."
        latch: "Es el latch de la PPU: retiene la dirección de su bus."
    exito: "El 74LS139 (U3): un doble decodificador 2 a 4."
    escalera:
      - "Está cerca de la CPU, que es quien pone las direcciones."
    solucion: "Arriba a la izquierda: el SN74LS139N (U3)."

  - id: empareje-chips
    tipo: pregunta
    fase: "Empareje"
    titulo: "Cada chip, su papel"
    texto: "Empareje cada chip de la placa con lo que hace."
    libro: ["nes#2", "nes#3", "nes#7", "nes#11"]
    emparejar:
      - ["RP2A03G", "Procesador, sonido y DMA"]
      - ["RP2C02G", "El vídeo compuesto"]
      - ["74LS139", "Decodifica las direcciones"]
      - ["3193A", "El chip de bloqueo"]
    exito: "Cuatro chips, cuatro papeles: procesar, dibujar, elegir y bloquear."
    pistas:
      - { texto: "El 3193A es el CIC; el 74LS139, un decodificador 2 a 4." }
    escalera:
      - "Toque los chips de la foto en la tarjeta anterior para leer sus fichas."
    solucion: "RP2A03G: CPU. RP2C02G: PPU. 74LS139: decodificador. 3193A: CIC."

  - id: explore-reloj
    tipo: explorar
    titulo: "El cristal y el cartucho"
    texto: "Toque el cristal maestro y el conector del cartucho, abajo."
    libro: ["nes#12", "nes#16"]
    requiere: { mover: [x1, cart] }
    widget:
      tipo: figura
      consola: { maquina: nes }
      zonas:
        - { id: x1, hotspot: X1, rotulo: "Cristal maestro", texto: "21,477 MHz: seis veces la subportadora NTSC." }
        - { id: cart, hotspot: P1, rotulo: "Conector de cartucho", texto: "Lleva al cartucho los dos buses completos, el de la CPU y el de la PPU." }

  - id: por-que-dos-buses
    tipo: porque
    titulo: "Dos buses al cartucho"
    texto: "¿Por qué el cartucho recibe el bus de la CPU y también el de la PPU?"
    libro: ["nes#16", "cap37#362"]
    widget:
      tipo: figura
      consola: { maquina: nes }
      zonas:
        - { id: cart, hotspot: P1, rotulo: "Conector de cartucho (72 contactos)" }
    opciones:
      - texto: "El programa va por el de la CPU y los gráficos por el de la PPU."
        bien: true
        porque: "La PRG-ROM cuelga del bus de la CPU y la CHR, las tablas de patrones, del de la PPU."
      - texto: "Para que el cartucho pueda elegir qué bus usar."
        porque: "Los usa los dos a la vez: el programa por uno y los gráficos por el otro."
      - texto: "Uno lleva la alimentación y el otro los datos."
        porque: "Los dos son buses de direcciones y datos: el de la CPU para el programa y el de la PPU para los gráficos."
    escalera:
      - "Piense en qué lee la PPU para dibujar los mosaicos."
    solucion: "El programa (PRG) va por el bus de la CPU; los gráficos (CHR), por el de la PPU."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: ["nes#2", "nes#3", "cap37#325", "nes#16"]
    ideas:
      - { titulo: "La CPU.", texto: "Un 6502 con el sonido y el DMA dentro: el RP2A03G." }
      - { titulo: "La PPU.", texto: "Genera el vídeo compuesto directamente." }
      - { titulo: "Poca RAM.", texto: "2 KB de trabajo y 2 KB de vídeo." }
      - { titulo: "El cartucho.", texto: "Recibe los dos buses: programa y gráficos." }
