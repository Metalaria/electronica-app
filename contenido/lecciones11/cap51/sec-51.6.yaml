# Lección 1.2 de la sección 52.6 «Fidelidad: Respuesta en Frecuencia y Realimentación» (cap51; etiqueta sec-51.6).
# Proyecto detallado III. Formato: contenido/lecciones11/GUIA.md.
# - Los cuatro parámetros y los que no salen en las hojas, sobre la figura 52.12 (fig-51.12) con zonas.
# - El factor de amortiguamiento efectivo con el cable (bloque 198): 8 Ω/(8 Ω/factor + R_cable), con 2 m de cable de
#   0,5 mm² de ida y vuelta (R = 2·2 m·0,0172 Ω·mm²/m / 0,5 mm² = 0,138 Ω, los «0,14 Ω» del libro): 52 frente a 37.
# 1.2.1 (autor121-ana, «aprender haciendo», GUIA §13): el parámetro que la realimentación no mejora se toca en la
# figura 52.13; el factor efectivo de 52 se predice, el de 100 se lleva por encima de 50 acortando el cable (1 m y
# 0,5 m son de ejemplo) y el nominal a partir del cual el efectivo pasa de 50 con 2 m se marca en la curva; la THD a
# 10 kHz (diez veces la de 1 kHz) se predice. La medida que más dice y el condensador pasan a la pregunta de los
# transitorios y al resumen; quedan el banco (emparejar) y los transitorios (opciones).
leccion: cap51/sec-51.6

libro:
  192: "reproducir la señal de entrada sin añadirle ni quitarle nada"
  194: "típicamente 20 Hz a 20 kHz dentro de ±0,5 dB"
  195: "Por debajo del 0,1 % es inaudible en la práctica"
  196: "Por encima de 90 dB es excelente"
  197: "por encima de 50 es más que suficiente"
  198: "el factor efectivo queda en unos 52 frente a 37"
  200: "mejora los cuatro parámetros por el factor de lazo"
  201: "no reduce el ruido de la primera etapa ni el offset"
  204: "la respuesta al escalón sobreoscila"
  206: "buen margen de fase y realimentación moderada"
  207: "la respuesta al escalón con carga real"
  210: "A 10 kHz puede ser diez veces peor"
  211: "un altavoz no es una resistencia"
  212: "más audible que la armónica"
  215: "Bode con carga resistiva"
  216: "a varias potencias y a varias frecuencias"
  217: "Ruido con la entrada cortocircuitada"
  218: "con un condensador en paralelo que simule una carga reactiva"
  219: "Los cuatro parámetros de fidelidad"

modelo:
  valores:
    F_n: { sim: "factor", nombre: "factor de amortiguamiento nominal", unidad: "", valor: 500 }
    R_L: { sim: "R_{L}", nombre: "altavoz", unidad: Ω, valor: 8 }
    l_c: { sim: "l", nombre: "longitud del cable", unidad: m, valor: 2 }
    rho: { sim: "ρ", nombre: "resistividad del cobre", unidad: "Ω·mm²/m", valor: 0.0172 }
    s_c: { sim: "S", nombre: "sección del cable", unidad: "mm²", valor: 0.5 }
    V_a: { sim: "v", nombre: "tensión de prueba del amplificador", unidad: V, valor: 1 }
    thd1: { sim: "THD_{1 kHz}", nombre: "distorsión a 1 kHz de un buen diseño", unidad: "%", valor: 0.01 }
  calculos:
    Z_o: { expr: "R_L/F_n", sim: "Z_{out}", nombre: "impedancia de salida del amplificador", unidad: Ω }
    R_c: { expr: "2*l_c*rho/s_c", sim: "R_{cable}", nombre: "resistencia del cable, ida y vuelta", unidad: Ω }
    R_s: { expr: "Z_o + R_c", sim: "Z_{out} + R_{cable}", nombre: "lo que ve el altavoz hacia el amplificador", unidad: Ω }
    F_e: { expr: "R_L/R_s", sim: "factor efectivo", nombre: "factor de amortiguamiento efectivo", unidad: "", cifras: 3 }
    V_l: { expr: "V_a*R_L/(R_s + R_L)", sim: "v_{altavoz}", nombre: "tensión en el altavoz", unidad: V }
    I_l: { expr: "V_a/(R_s + R_L)", sim: "i", nombre: "corriente por el altavoz", unidad: A }
    F_50: { expr: "R_L/(R_L/50 - R_c)", sim: "factor nominal", nombre: "nominal que da un efectivo de 50", unidad: "", cifras: 3 }
    thd10: { expr: "10*thd1", sim: "THD_{10 kHz}", nombre: "distorsión a 10 kHz, diez veces peor", unidad: "%" }

tarjetas:
  - id: explore-parametros
    tipo: tocar
    titulo: "Los cuatro parámetros"
    texto: "Ser fiel es no añadir ni quitar nada a la señal. La realimentación mejora casi todo por el factor de lazo: toque el parámetro que no mejora con ella."
    libro: [192, 194, 195, 196, 197, 200, 201, 219]
    widget:
      tipo: figura
      figura: fig-51.12
      zonas:
        - { id: respuesta, rotulo: "Primer panel", rect: [0, 0, 112, 134] }
        - { id: thd, rotulo: "Segundo panel", rect: [119, 0, 103, 134] }
        - { id: ruido, rotulo: "Tercer panel", rect: [231, 0, 103, 134] }
        - { id: amortiguamiento, rotulo: "Cuarto panel", rect: [341, 0, 110, 134] }
    tocar:
      bien: [ruido]
      porque:
        respuesta: "La respuesta se aplana y se ensancha con el lazo."
        thd: "La distorsión se divide por el factor de lazo."
        amortiguamiento: "La impedancia de salida baja con el lazo, y el factor sube."
    exito: "La señal a ruido: el ruido de la primera etapa y el offset no los reduce. Y con poco margen puede comprometer la estabilidad."
    escalera:
      - "¿Qué nace en la entrada, junto a la señal?"
    solucion: "El tercer panel: la relación señal a ruido."

  - id: prediga-cable
    tipo: simular
    titulo: "Factor 500 con cable"
    texto: "La cifra más exagerada en publicidad. Con dos metros de cable de 0,5 mm² (0,14 Ω ida y vuelta) y 8 Ω, ¿qué factor efectivo da un amplificador de factor 500?"
    libro: [198]
    fijar: { F_n: 500, l_c: 2 }
    simular:
      objetivo: F_e
      unidad: ""
      tol: 0.03
      rotulo: "Factor efectivo"
      errores:
        - { expr: "F_n", texto: "Eso sería sin cable. Los 0,14 Ω se suman a la salida y limitan el factor efectivo." }
    exito: "Unos 52; el de factor 100 se queda en 37. El cable manda: pesa mucho más que la salida del amplificador."
    escalera:
      - "Factor efectivo = 8 Ω / (8 Ω/factor + R_{cable})."
    solucion: "8/(0,016 + 0,14) ≈ 52."
    comprobar:
      - { F_e: 52.1, Z_o: 0.016, R_L: 8, tol: 0.005 }
      - { con: { F_n: 100 }, F_e: 36.8, Z_o: 0.08, tol: 0.01 }

  - id: explore-cable
    tipo: explorar
    titulo: "El factor de amortiguamiento real"
    texto: "El amplificador de factor 100 se queda en 37 con dos metros de cable. Acórtelo hasta pasar de 50."
    fijar: { F_n: 100 }
    libro: [197, 198]
    inicio: { l_c: 2 }
    widget:
      tipo: circuito
      esquema: divisor
      piezas: { fuente: V_a, arriba: R_s, abajo: R_L }
      lectura: { valor: F_e, rotulo: "Factor efectivo" }
      datos:
        - { valor: R_c, rotulo: "Cable: {{R_c}}" }
        - { valor: Z_o, rotulo: "Salida del amplificador: {{Z_o}}" }
      corriente: I_l
      mide: { salida: V_l, corriente: I_l }
      mandos:
        - { valor: l_c, lista: [2, 1, 0.5], rotulo: "Cable (m)" }
    objetivo:
      condiciones:
        - { valor: F_e, min: 50, rotulo: "Efectivo: {{F_e}}" }
      logrado: "Con {{l_c}} de cable, {{F_e}}: por encima de 50, más que suficiente. Acortar el cable hace más que quintuplicar la cifra del amplificador."
      pistas:
        - { texto: "Menos cable." }
    escalera:
      - "Factor efectivo = 8 Ω / (8 Ω/factor + R_{cable})."
    solucion: "Un metro basta."
    comprobar:
      - { con: { l_c: 1 }, F_e: 53.8, R_L: 8, tol: 0.005 }

  - id: marque-50
    tipo: marcar
    titulo: "¿A partir de qué cifra no importa?"
    texto: "Con 2 m de cable fino, marque en la curva el factor nominal a partir del cual el efectivo pasa de 50."
    libro: [197, 198, 219]
    fijar: { l_c: 2 }
    widget:
      tipo: grafica
      x: { id: n, min: 10, max: 1000, escala: log, unidad: "", rotulo: "factor nominal" }
      y: { min: 0, max: 100, unidad: "", rotulo: "factor efectivo" }
      curvas:
        - { expr: "R_L/(R_L/n + R_c)", color: naranja, rotulo: "con 2 m de cable fino" }
        - { expr: "50", color: tinta, rotulo: "suficiente", discontinua: true }
    marcar:
      modo: x
      curva: 0
      x: "F_50"
      tol: 0.03
      inicio: { x: 30, y: 0 }
      rotulo: "El nominal que da 50"
    exito: "Hacia {{F_50}}: por encima, la cifra nominal ya casi no cambia lo que oye el altavoz."
    escalera:
      - "Busque dónde la curva cruza la línea de 50."
    solucion: "Donde la curva corta la recta de 50."
    comprobar:
      - { F_50: 357, tol: 0.01 }

  - id: porque-transitorios
    tipo: porque
    titulo: "El debate de la realimentación"
    texto: "Un amplificador con THD magnífica puede portarse mal ante señales rápidas. ¿Qué base técnica tiene?"
    libro: [204, 206, 207, 218]
    widget:
      tipo: figura
      figura: fig-51.12
      zonas:
        - { id: escalon, rotulo: "Gráfica de abajo a la derecha", rect: [275, 150, 175, 112] }
    opciones:
      - texto: "Con margen de fase escaso, el escalón sobreoscila y la corrección llega con retardo"
        bien: true
        porque: "Lo defendible: realimentación moderada y buen margen de fase. Por eso la medida que más dice es el escalón con carga real, repetido con un condensador en paralelo."
      - texto: "La realimentación siempre empeora el sonido"
        porque: "Esa parte del debate no está bien establecida; lo medible es el margen de fase."
      - texto: "La THD no se puede medir bien"
        porque: "Se mide bien; lo que no cuenta es el comportamiento ante transitorios."
    escalera:
      - "Mire las dos respuestas al escalón de la figura."
    solucion: "Margen de fase escaso: sobreoscilación y corrección con retardo."

  - id: empareje-ocultos
    tipo: simular
    titulo: "Lo que no sale en las hojas"
    texto: "Un buen diseño anuncia 0,01 % de THD, medida a 1 kHz, donde la ganancia de lazo es máxima. A 10 kHz puede ser diez veces peor: ¿cuánto?"
    libro: [195, 210, 211, 212]
    simular:
      objetivo: thd10
      unidad: "%"
      tol: 0.02
      rotulo: "THD a 10 kHz"
      errores:
        - { expr: "thd1", texto: "Esa es la de 1 kHz. A 10 kHz el lazo gana menos y corrige menos." }
        - { expr: "thd1/10", texto: "Al revés: a 10 kHz es peor, no mejor." }
    exito: "0,1 %: en el límite de lo audible. Otros ocultos: un altavoz no es una resistencia, y la intermodulación es más audible que la armónica."
    escalera:
      - "Diez veces 0,01 %."
    solucion: "0,1 %."
    comprobar:
      - { thd10: 0.1, thd1: 0.01, tol: 0.001 }

  - id: empareje-banco
    tipo: pregunta
    fase: "Empareje"
    titulo: "En el banco"
    texto: "Una cada medida de fidelidad con cómo se hace."
    libro: [215, 216, 217, 218]
    emparejar:
      - ["Respuesta", "Bode con carga resistiva"]
      - ["THD", "FFT a varias potencias y frecuencias"]
      - ["Ruido", "Con la entrada cortocircuitada"]
      - ["Escalón", "Con un condensador en paralelo con la carga"]
    exito: "El escalón con carga capacitiva es la que más amplificadores caseros suspenden."
    pistas:
      - { texto: "El condensador simula una carga reactiva, como un altavoz." }
    escalera:
      - "¿Qué instrumento da la respuesta en frecuencia? ¿Y los armónicos?"
    solucion: "Respuesta–Bode; THD–FFT; ruido–entrada en corto; escalón–con condensador."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [194, 198, 201, 207]
    ideas:
      - { titulo: "Cuatro parámetros.", texto: "±0,5 dB de 20 Hz a 20 kHz, THD bajo 0,1 %, más de 90 dB y factor sobre 50." }
      - { titulo: "El cable manda.", texto: "Con 2 m de cable fino, factor 500 da unos 52; el de 100, 37." }
      - { titulo: "La realimentación.", texto: "Mejora casi todo, salvo el ruido de entrada y el offset; con poco margen, sobreoscila." }
      - { titulo: "Lo que más dice.", texto: "El escalón con carga real, no la THD a 1 kHz." }
