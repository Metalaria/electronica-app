# Lección 1.2 de la sección 52.10 «Diagnóstico Fino: Cuellos Térmicos y el Origen del Ruido» (cap51; etiqueta
# sec-51.10). Proyecto detallado III. Formato: contenido/lecciones11/GUIA.md. Diagnóstico por comparación, sin cálculo:
# la figura 52.18 (fig-51.16: el ruido por sustracción, los tres zumbidos y la FFT entre canales) con zonas; el mapa
# térmico y los escalones, opciones; las firmas de ruido y zumbido, emparejar.
leccion: cap51/sec-51.10

libro:
  333: "Los dos se localizan por comparación"
  336: "Lo que debe estar caliente: los transistores de salida y su disipador"
  337: "Lo que no debe estarlo: el preamplificador, los drivers"
  340: "Bias descompensado entre canales"
  341: "calienta sin señal audible"
  344: "es normal, no una avería"
  345: "tiene el bias disparado"
  348: "Repetir a unos 31 W, donde la amplitud de pico es el 64 % de la alimentación."
  349: "Si el punto 1 ya está alto, es bias; si el máximo está en el 4, la disipación se ha calculado mal"
  352: "lo que quede es de la etapa de potencia y de la alimentación"
  353: "el incremento es del preamplificador"
  354: "el incremento es del cable y del bucle de masa"
  355: "el incremento es de la fuente"
  358: "Se distingue girando el transformador"
  359: "Aumenta con la potencia entregada"
  360: "masa flotante o pantalla mal conectada"
  361: "Si el zumbido desaparece, entra por la entrada; si permanece, es interno"
  363: "Siseo proporcional al volumen"
  364: "indica ganancia excesiva en ella"
  365: "Crepitación: componente defectuoso"
  366: "potenciómetro sucio"
  370: "cualquier diferencia entre canales idénticos es una avería"
  371: "Localización del ruido por sustracción"

modelo:
  valores: {}
  calculos: {}

tarjetas:
  - id: explore-sustraccion
    tipo: explorar
    titulo: "El ruido, por sustracción"
    texto: "Se añade una etapa en cada medida y el incremento dice de dónde viene el ruido. Toque cada paso y los recuadros."
    libro: [333, 352, 353, 354, 355, 371]
    widget:
      tipo: figura
      figura: fig-51.16
      zonas:
        - { id: paso1, rotulo: "Primer paso", rect: [0, 31, 188, 35], texto: "Entrada de la potencia en corto: lo que queda es de la etapa de potencia y la alimentación; debe ser muy bajo." }
        - { id: paso2, rotulo: "Segundo paso", rect: [0, 72, 188, 35], texto: "Más el preamplificador con su entrada en corto: su incremento es el que suele dominar." }
        - { id: paso3, rotulo: "Tercer paso", rect: [0, 112, 188, 35], texto: "Más la fuente conectada pero apagada: el incremento es del cable y del bucle de masa." }
        - { id: paso4, rotulo: "Cuarto paso", rect: [0, 150, 188, 35], texto: "Todo conectado y funcionando: el incremento es de la fuente." }
        - { id: zumbido, rotulo: "Recuadro de la derecha", rect: [294, 25, 156, 165], texto: "Los tres zumbidos y su firma: 50 Hz, 100 Hz y el que cambia al tocar la entrada." }
        - { id: fft, rotulo: "Recuadro de abajo", rect: [3, 200, 447, 41], texto: "Comparar la FFT de los dos canales: cualquier diferencia entre canales idénticos es una avería." }
    requiere: { mover: [paso1, paso2, zumbido, fft] }

  - id: ordene-sustraccion
    tipo: pregunta
    fase: "Ordene"
    titulo: "Cuatro medidas"
    texto: "Ordene las medidas del ruido por sustracción, de menos a más etapas conectadas."
    libro: [352, 353, 354, 355]
    ordenar:
      - "Entrada de la etapa de potencia en corto"
      - "Preamplificador conectado, su entrada en corto"
      - "Fuente de señal conectada pero apagada"
      - "Todo conectado y en funcionamiento"
    exito: "Cuatro medidas localizan el origen, mucho más deprisa que el esquema."
    pistas:
      - { texto: "Se empieza por lo más cercano al altavoz y se va añadiendo hacia la fuente." }
    escalera:
      - "Cada medida añade una sola cosa a la anterior."
    solucion: "Potencia en corto, más preamplificador, más fuente apagada, todo funcionando."

  - id: empareje-zumbidos
    tipo: pregunta
    fase: "Empareje"
    titulo: "Los tres zumbidos y su firma"
    texto: "Una cada zumbido con su causa."
    libro: [358, 359, 360]
    emparejar:
      - ["A 50 Hz", "Transformador o bucle de masa: se distingue girando el transformador"]
      - ["A 100 Hz", "Rizado que atraviesa el PSRR; crece con la potencia"]
      - ["Cambia al tocar la entrada", "Masa flotante o pantalla mal conectada"]
    exito: "El de 100 Hz es el rizado rectificado: dos picos por ciclo de red."
    pistas:
      - { texto: "El puente rectificador da un rizado del doble de la frecuencia de red." }
    escalera:
      - "¿Cuál depende de la potencia que entrega el amplificador?"
    solucion: "50 Hz–transformador o masa; 100 Hz–rizado y PSRR; al tocar–masa flotante o pantalla."

  - id: pregunta-cortocircuitar
    tipo: pregunta
    titulo: "Masa o acoplamiento, en un minuto"
    texto: "Se desconecta la entrada y se cortocircuita en el propio conector, y el zumbido desaparece. ¿Dónde está?"
    libro: [361]
    widget:
      tipo: figura
      figura: fig-51.16
      zonas:
        - { id: zumbido, rotulo: "Recuadro de la derecha", rect: [294, 25, 156, 165] }
    opciones:
      - texto: "Entra por la entrada: cable o bucle de masa"
        bien: true
        porque: "Si al cortocircuitar en el conector desaparece, venía de fuera; si permanece, es interno."
      - texto: "Es interno, del transformador"
        porque: "Uno interno seguiría con la entrada en corto."
      - texto: "Es el rizado de la alimentación"
        porque: "El rizado entra por las etapas, no por la entrada: no desaparecería."
    escalera:
      - "Con la entrada en corto en el conector, ¿qué parte queda fuera del circuito?"
    solucion: "Entra por la entrada."

  - id: empareje-siseo
    tipo: pregunta
    fase: "Empareje"
    titulo: "El ruido que no es zumbido"
    texto: "Una cada ruido con su origen."
    libro: [363, 364, 365, 366]
    emparejar:
      - ["Siseo proporcional al volumen", "Ruido del preamplificador, de diseño"]
      - ["Siseo independiente del volumen", "Ganancia excesiva en la etapa de potencia"]
      - ["Crepitación", "Un electrolítico o una soldadura defectuosos"]
      - ["Ruido con el mando a media posición", "Potenciómetro sucio"]
    exito: "Cada síntoma señala una etapa sin abrir el esquema."
    pistas:
      - { texto: "Lo que está antes del volumen sube con él; lo que está después, no." }
    escalera:
      - "¿Qué etapas quedan antes y después del control de volumen?"
    solucion: "Proporcional–preamplificador; independiente–potencia; crepitación–componente; media posición–potenciómetro."

  - id: pregunta-mapa
    tipo: pregunta
    titulo: "El mapa térmico"
    texto: "Tras media hora en reposo, un canal está más caliente que el otro. ¿Qué es lo más frecuente?"
    libro: [336, 337, 340, 341]
    widget:
      tipo: figura
      figura: fig-51.16
      zonas:
        - { id: fft, rotulo: "Recuadro de abajo", rect: [3, 200, 447, 41] }
    opciones:
      - texto: "Bias descompensado entre canales"
        bien: true
        porque: "Es lo más frecuente; también puede ser una oscilación de alta frecuencia que no se oye, o un componente derivado."
      - texto: "Que ese canal tiene más volumen"
        porque: "En reposo no hay señal: solo la corriente de reposo calienta."
      - texto: "Es normal: los canales nunca calientan igual"
        porque: "Dos canales idénticos en reposo deben estar igual de tibios."
    escalera:
      - "Sin señal, ¿qué corriente calienta la etapa de salida?"
    solucion: "Bias descompensado entre canales, lo más frecuente."

  - id: predecir-escalones
    tipo: predecir
    titulo: "El diagnóstico por escalones"
    texto: "Temperatura del disipador en reposo, al 25 %, a unos 31 W (el 64 %) y al 100 %: el punto en reposo ya está alto. ¿Qué indica?"
    libro: [348, 349]
    widget:
      tipo: figura
      figura: fig-51.16
      zonas:
        - { id: paso1, rotulo: "Primer paso", rect: [0, 31, 188, 35] }
    opciones:
      - texto: "Un problema de bias"
        bien: true
        porque: "Sin señal solo calienta el reposo. Si el máximo saliera en el 100 %, la disipación estaría mal calculada."
      - texto: "Que la disipación está mal calculada"
        porque: "Eso lo diría un máximo en el 100 %, no un reposo caliente."
      - texto: "Nada: es la curva normal"
        porque: "La normal tiene su máximo en el escalón de unos 31 W, con el reposo templado."
    escalera:
      - "¿Qué calienta el disipador cuando no hay señal?"
    solucion: "Bias: el reposo ya está alto."

  - id: porque-reverso
    tipo: porque
    titulo: "El caso que más engaña"
    texto: "Uno se calienta a volumen medio y no a todo volumen; otro, en reposo, y se enfría al subir el volumen. ¿Cuál tiene avería?"
    libro: [344, 345]
    widget:
      tipo: figura
      figura: fig-51.16
      zonas:
        - { id: paso1, rotulo: "Primer paso", rect: [0, 31, 188, 35] }
    opciones:
      - texto: "El segundo: bias disparado, la compensación térmica no funciona"
        bien: true
        porque: "Calentarse a volumen medio es normal: la disipación máxima está hacia el 64 % de la amplitud."
      - texto: "El primero: debería calentarse más a todo volumen"
        porque: "A todo volumen el transistor disipa menos que a media excursión: es lo esperable."
      - texto: "Los dos"
        porque: "El primero sigue la curva de la clase B; solo el segundo se sale de ella."
    escalera:
      - "¿Dónde estaba el máximo de la disipación en clase B?"
    solucion: "El que se calienta en reposo: bias disparado."

  - id: pregunta-fft
    tipo: pregunta
    titulo: "El diagnóstico más rápido"
    texto: "Con la FFT de la salida y la entrada en corto, ¿por qué conviene compararla entre los dos canales?"
    libro: [370]
    widget:
      tipo: figura
      figura: fig-51.16
      zonas:
        - { id: fft, rotulo: "Recuadro de abajo", rect: [3, 200, 447, 41] }
    opciones:
      - texto: "Cualquier diferencia entre canales idénticos es una avería, sin saber el valor correcto"
        bien: true
        porque: "El otro canal hace de referencia: no hace falta conocer el ruido esperado."
      - texto: "Porque un canal siempre tiene menos ruido"
        porque: "Dos canales idénticos deben dar lo mismo; la diferencia es la pista."
      - texto: "Para sumar el ruido de los dos"
        porque: "Se comparan, no se suman: la diferencia localiza la avería."
    escalera:
      - "¿Qué referencia tiene a mano en un amplificador estéreo?"
    solucion: "El otro canal es la referencia: toda diferencia es avería."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [333, 349, 352, 370]
    ideas:
      - { titulo: "Por comparación.", texto: "Calor y ruido se localizan comparando: entre canales y entre medidas." }
      - { titulo: "Escalones térmicos.", texto: "Reposo alto: bias. Máximo al 100 %: disipación mal calculada." }
      - { titulo: "Ruido por sustracción.", texto: "Cuatro medidas, añadiendo una etapa cada vez." }
      - { titulo: "Zumbidos.", texto: "50 Hz transformador o masa; 100 Hz rizado; al tocar, masa flotante." }
