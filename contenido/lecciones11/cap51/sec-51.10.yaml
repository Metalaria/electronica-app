# Lección 1.2 de la sección 52.10 «Diagnóstico Fino: Cuellos Térmicos y el Origen del Ruido» (cap51; etiqueta
# sec-51.10). Proyecto detallado III. Formato: contenido/lecciones11/GUIA.md. Diagnóstico por comparación, sin cálculo:
# la figura 52.18 (fig-51.16: el ruido por sustracción, los tres zumbidos y la FFT entre canales) con zonas; el mapa
# térmico y los escalones, opciones; las firmas de ruido y zumbido, emparejar.
# 1.2.1 (autor121-ana, «aprender haciendo», GUIA §13): el paso que delata el bucle de masa y el zumbido que crece con
# la potencia se tocan en la figura 52.18; el paso 3 del diagnóstico térmico (unos 31 W, el máximo de la curva) se
# busca con objetivo sobre la curva de disipación (±35 V, 8 Ω); la avería del canal caliente sigue. El orden, el
# cortocircuito de la entrada, el mapa térmico, los escalones, el reverso y la FFT pasan a éxitos, a la avería y al
# resumen; queda el emparejamiento del siseo. Sección de diagnóstico cualitativo: sin preguntas de opciones.
leccion: cap51/sec-51.10

libro:
  333: "Los dos se localizan por comparación"
  336: "Lo que debe estar caliente: los transistores de salida y su disipador"
  337: "Lo que no debe estarlo: el preamplificador, los drivers"
  340: "Bias descompensado entre canales"
  341: "calienta sin señal audible"
  344: "es normal, no una avería"
  345: "tiene el bias disparado"
  348: "Repetir a unos 31 W, donde la amplitud de pico es el 64 % de la alimentación."
  349: "Si el punto 1 ya está alto, es bias; si el máximo está en el 4, la disipación se ha calculado mal"
  352: "lo que quede es de la etapa de potencia y de la alimentación"
  353: "el incremento es del preamplificador"
  354: "el incremento es del cable y del bucle de masa"
  355: "el incremento es de la fuente"
  358: "Se distingue girando el transformador"
  359: "Aumenta con la potencia entregada"
  360: "masa flotante o pantalla mal conectada"
  361: "Si el zumbido desaparece, entra por la entrada; si permanece, es interno"
  363: "Siseo proporcional al volumen"
  364: "indica ganancia excesiva en ella"
  365: "Crepitación: componente defectuoso"
  366: "potenciómetro sucio"
  370: "cualquier diferencia entre canales idénticos es una avería"
  371: "Localización del ruido por sustracción"
  342: "Un componente derivado, típicamente una resistencia de polarización"
  "cap51#168": "esas caídas bajan 2 mV/°C"
  "cap51#172": "su VBE baja con la temperatura al mismo ritmo"
  "cap51#177": "Con resistencias de 0,22 Ω y una corriente de reposo objetivo de 50 mA, la caída es de 11 mV"

modelo:
  valores:
    Vcc: { sim: "V_{CC}", nombre: "alimentación simétrica", unidad: V, valor: 35 }
    Ib: { sim: "I_{B}", nombre: "corriente de la fuente de bias", unidad: A, valor: 0.005 }
    R1: { sim: "R₁", nombre: "resistencia de ajuste del multiplicador", unidad: Ω, valor: 1037 }
    R2: { sim: "R₂", nombre: "resistencia fija del multiplicador", unidad: Ω, valor: 1000 }
    Re: { sim: "R_{E}", nombre: "resistencia de emisor", unidad: Ω, valor: 0.22 }
    RL: { sim: "R_{L}", nombre: "carga resistiva", unidad: Ω, valor: 8 }
    b: { sim: "β", nombre: "ganancia de corriente", unidad: "", valor: 100 }
    dT: { sim: "ΔT", nombre: "calentamiento del disipador", unidad: "°C", valor: 30 }
    Vbe: { sim: "V_{BE}", nombre: "caída base-emisor de los transistores de salida", unidad: V, valor: 0.6 }
    Vbem: { sim: "V_{BE3}", nombre: "caída base-emisor del multiplicador", unidad: V, valor: 0.6 }
    V_p: { sim: "V_{p}", nombre: "amplitud de pico de la salida", unidad: V, valor: 6 }
  calculos:
    Vbb: { expr: "Vbem*(1 + R1/R2)", sim: "V_{BB}", nombre: "tensión entre las bases", unidad: V }
    Ie: { expr: "max(0, (Vbb - 2*Vbe)/(2*Re))", sim: "I_{E}", nombre: "corriente de reposo de emisor", unidad: A }
    Iq: { expr: "b/(b + 1)*Ie", sim: "I_{Q}", nombre: "corriente de reposo", unidad: A }
    Ir: { expr: "max(Iq, 0.0001)", sim: "I_{ref}", nombre: "corriente de referencia de V_BE", unidad: A }
    Vin: { expr: "-Vbb/2", sim: "V_{driver}", nombre: "nivel del driver", unidad: V }
    Vre: { expr: "Ie*Re", sim: "V_{RE}", nombre: "caída en la resistencia de emisor", unidad: V }
    Vr1: { expr: "Vbb - Vbem", sim: "V_{R1}", nombre: "tensión en R₁", unidad: V }
    Vcal: { expr: "0.6 - 0.002*dT", sim: "V_{BE}", nombre: "caída en caliente", unidad: V }
    P_o: { expr: "V_p^2/(2*RL)", sim: "P_{carga}", nombre: "potencia en la carga", unidad: W }
    P_t: { expr: "Vcc*V_p/(pi*RL) - V_p^2/(4*RL)", sim: "P_{transistor}", nombre: "disipación de un transistor", unidad: W }

tarjetas:
  - id: explore-sustraccion
    tipo: tocar
    titulo: "El ruido, por sustracción"
    texto: "Se añade una etapa en cada medida y el incremento dice de dónde viene el ruido. Toque la medida cuyo incremento delata un bucle de masa."
    libro: [333, 352, 353, 354, 355, 370, 371]
    widget:
      tipo: figura
      figura: fig-51.16
      zonas:
        - { id: paso1, rotulo: "Primer paso", rect: [0, 31, 188, 35] }
        - { id: paso2, rotulo: "Segundo paso", rect: [0, 72, 188, 35] }
        - { id: paso3, rotulo: "Tercer paso", rect: [0, 112, 188, 35] }
        - { id: paso4, rotulo: "Cuarto paso", rect: [0, 150, 188, 35] }
        - { id: fft, rotulo: "Recuadro de abajo", rect: [3, 200, 447, 41] }
    tocar:
      bien: [paso3]
      porque:
        paso1: "Con la entrada de la potencia en corto, lo que queda es de la etapa de potencia y de la alimentación."
        paso2: "Ese incremento es del preamplificador, el que suele dominar."
        paso4: "Ese incremento es de la propia fuente."
        fft: "Comparar la FFT de los dos canales localiza averías, no el origen dentro de un canal."
    exito: "La fuente conectada pero apagada: el incremento es del cable y del bucle de masa. Cuatro medidas, en orden, mucho más rápidas que el esquema; y entre canales, cualquier diferencia de la FFT es una avería."
    escalera:
      - "¿Qué se añade en cada paso?"
    solucion: "El tercero: la fuente de señal conectada pero apagada."

  - id: empareje-zumbidos
    tipo: tocar
    titulo: "Los tres zumbidos y su firma"
    texto: "Un zumbido que aumenta con la potencia entregada. Toque su tipo."
    libro: [358, 359, 360, 361]
    widget:
      tipo: figura
      figura: fig-51.16
      zonas:
        - { id: z50, rotulo: "A 50 Hz", rect: [298, 54, 150, 40] }
        - { id: z100, rotulo: "A 100 Hz", rect: [298, 104, 150, 36] }
        - { id: ztoca, rotulo: "Cambia al tocar la entrada", rect: [298, 146, 150, 36] }
    tocar:
      bien: [z100]
      porque:
        z50: "El de 50 Hz viene del transformador o de un bucle de masa: se distingue girando el transformador."
        ztoca: "El que cambia al tocar la entrada es una masa flotante o una pantalla mal conectada."
    exito: "100 Hz: el rizado que atraviesa el PSRR. Y la prueba de un minuto: cortocircuitar la entrada en el conector; si el zumbido desaparece, entra por la entrada; si permanece, es interno."
    escalera:
      - "¿Qué depende de la corriente que pide la etapa de salida?"
    solucion: "El de 100 Hz."

  - id: empareje-siseo
    tipo: pregunta
    fase: "Empareje"
    titulo: "El ruido que no es zumbido"
    texto: "Una cada ruido con su origen."
    libro: [363, 364, 365, 366]
    emparejar:
      - ["Siseo proporcional al volumen", "Ruido del preamplificador, de diseño"]
      - ["Siseo independiente del volumen", "Ganancia excesiva en la etapa de potencia"]
      - ["Crepitación", "Un electrolítico o una soldadura defectuosos"]
      - ["Ruido con el mando a media posición", "Potenciómetro sucio"]
    exito: "Cada síntoma señala una etapa sin abrir el esquema."
    pistas:
      - { texto: "Lo que está antes del volumen sube con él; lo que está después, no." }
    escalera:
      - "¿Qué etapas quedan antes y después del control de volumen?"
    solucion: "Proporcional–preamplificador; independiente–potencia; crepitación–componente; media posición–potenciómetro."

  - id: predecir-escalones
    tipo: explorar
    titulo: "El diagnóstico por escalones"
    texto: "Temperatura del disipador en reposo, al 25 %, a unos 31 W y al 100 %. Con ±35 V y 8 Ω, lleve la salida al paso 3, el de unos 31 W."
    libro: [344, 348, 349]
    inicio: { V_p: 6 }
    widget:
      tipo: grafica
      x: { id: u, min: 0, max: 32, unidad: V, rotulo: "V_{p}" }
      y: { min: 0, max: 70, unidad: W, rotulo: "P" }
      curvas:
        - { expr: "u^2/(2*RL)", color: azul, rotulo: "sobre la carga" }
        - { expr: "Vcc*u/(pi*RL) - u^2/(4*RL)", color: naranja, rotulo: "un transistor" }
      marcas:
        - { x: "V_p", y: "P_t", rotulo: "{{P_t}}" }
      lectura: { valor: P_o, rotulo: "Sobre la carga" }
      datos:
        - { valor: P_t, rotulo: "Un transistor: {{P_t}}" }
      mandos:
        - { valor: V_p, min: 0, max: 32, paso: 1, rotulo: "Amplitud de pico, V_{p}" }
    objetivo:
      condiciones:
        - { valor: P_o, objetivo: 31, tol: 0.03, rotulo: "Sobre la carga: {{P_o}}" }
      logrado: "{{P_t}} por transistor: el máximo, en el paso 3. Si el 1 ya está alto, es bias; si el máximo está en el 4, la disipación se calculó mal."
      pistas:
        - { cuando: { valor: P_o, mayor: 32 }, texto: "Se ha pasado: menos amplitud." }
        - { texto: "Más amplitud." }
    escalera:
      - "Unos 31 W: la amplitud de pico es el 64 % de la alimentación."
    solucion: "Hacia 22 V de pico."
    comprobar:
      - { con: { V_p: 22 }, P_o: 30.25, P_t: 15.52, Vcc: 35, RL: 8, tol: 0.005 }

  - id: averia-canal-caliente
    tipo: averia
    titulo: "El canal que se calienta en reposo"
    texto: "Tras media hora en reposo, con el disipador 30 °C más caliente, este canal calienta más que el otro y se enfría al subir el volumen: bias disparado. Mida y diga qué falla."
    libro: [336, 337, 340, 341, 342, 344, 345, "cap51#168", "cap51#172", "cap51#177"]
    fijar: { dT: 30, Vbe: 0.54, Vbem: 0.54 }
    widget:
      tipo: circuito
      esquema: etapa-clase-ab
      piezas: { vcc: Vcc, entrada: Vin, ib: Ib, r1: R1, r2: R2, re: Re, carga: RL, beta: b, vbe: Vbe, vbem: Vbem, iref: Ir }
      mide: { iq: Iq, vbb: Vbb }
      mandos: []
    averia:
      pasos: 2
      sospechosos:
        - { id: q3, rotulo: "Q₃, el multiplicador" }
        - { id: r1, rotulo: "R₁" }
        - { id: r2, rotulo: "R₂" }
      sondas:
        - { id: caida, rotulo: "Caída en R_{E}", valor: Vre }
        - { id: vbe3, rotulo: "V_{BE} de Q₃, en R₂", valor: Vbem }
        - { id: r1, rotulo: "Tensión en R₁", valor: Vr1 }
        - { id: bases, rotulo: "Tensión entre las bases", valor: Vbb }
      fallos:
        - { id: q3-suelto, pieza: q3, tipo: valor, con: { Vbem: 0.6 }, texto: "Q₃ suelto en la placa: su V_{BE} sigue en frío, el bias no baja con el disipador y la corriente de reposo se dispara." }
        - { id: r1-alta, pieza: r1, tipo: alto, con: { R1: 1141 }, texto: "R₁ derivada hacia arriba: Q₃ sigue la temperatura, pero multiplica más y sobra bias." }
        - { id: r2-baja, pieza: r2, tipo: bajo, con: { R2: 820 }, texto: "R₂ derivada hacia abajo: Q₃ sigue la temperatura, pero R₁/R₂ crece y sobra bias." }
    escalera:
      - "En caliente, cada V_{BE} baja 2 mV/°C: la de Q₃ también, si toca el disipador."
      - "Mida la V_{BE} de Q₃: dice si sigue la temperatura. Luego, la tensión en R₁."
    solucion: "Sano y caliente: 0,54 V en Q₃ y unos 10 mV en R_{E}. Si Q₃ marca lo de frío, está suelto; si no, mire qué resistencia multiplica de más."
    comprobar:
      - { Vcal: 0.54, Vre: 0.0099, tol: 0.01 }

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [333, 349, 352, 363, 365, 370]
    ideas:
      - { titulo: "Por comparación.", texto: "Calor y ruido se localizan comparando: entre canales y entre medidas." }
      - { titulo: "Escalones térmicos.", texto: "Reposo alto: bias. Máximo al 100 %: disipación mal calculada." }
      - { titulo: "Ruido por sustracción.", texto: "Cuatro medidas, añadiendo una etapa cada vez." }
      - { titulo: "Zumbidos.", texto: "50 Hz transformador o masa; 100 Hz rizado; al tocar, masa flotante." }
