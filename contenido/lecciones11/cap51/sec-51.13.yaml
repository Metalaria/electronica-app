# Lección 1.2 de la sección 52.13 «Herramientas Adicionales y Resumen» (cap51; etiqueta sec-51.13). Proyecto
# detallado III. Formato: contenido/lecciones11/GUIA.md. Los instrumentos y lo que se puede medir con ellos, sobre la
# figura 52.21 (fig-51.19) con zonas; la distorsión en decibelios (bloque 416: 0,01 % son −80 dB; 0,1 %, el de la
# especificación, son −60 dB) con 20·log del cociente.
leccion: cap51/sec-51.13

libro:
  407: "no se puede medir una distorsión menor que la de la fuente"
  408: "resistencias de alambre de 8 Ω y al menos 100 W"
  409: "para la distorsión"
  410: "Multímetro para el bias y las tensiones"
  411: "Termómetro o cámara térmica"
  413: "Escalón con carga capacitiva"
  "cap51#210": "muchos amplificadores especifican THD a 1 kHz"
  414: "la que decide si el amplificador está bien hecho"
  416: "hacia −50 o −60 dB: basta para ver la distorsión de cruce o el recorte, pero no para certificar el 0,1 %"
  417: "exige dos generadores de calidad"
  419: "está por debajo del suelo del instrumento"
  421: "La disipación máxima no está a plena potencia"
  424: "detecta antes que ninguna otra un margen de fase insuficiente"
  425: "Lo que se puede medir de un amplificador con instrumental doméstico"

modelo:
  valores:
    d_p: { sim: "THD", nombre: "distorsión", unidad: "%", valor: 0.1 }
    c_20: { sim: "k", nombre: "factor de los decibelios en tensión", unidad: "", valor: 20 }
  calculos:
    r_d: { expr: "d_p/100", sim: "THD", nombre: "distorsión como cociente", unidad: "", cifras: 3 }
    d_db: { expr: "c_20*log10(r_d)", sim: "THD", nombre: "distorsión en decibelios", unidad: dB, cifras: 3 }

tarjetas:
  - id: explore-medible
    tipo: explorar
    titulo: "Lo que se puede medir en casa"
    texto: "Con instrumental doméstico se caracteriza un amplificador hasta un punto. Toque cada parte de la tabla."
    libro: [413, 414, 417, 425]
    widget:
      tipo: figura
      figura: fig-51.19
      zonas:
        - { id: medible, rotulo: "La parte de arriba", rect: [0, 25, 450, 135], texto: "Medible en casa: potencia, respuesta, THD con el límite del generador, ruido, estabilidad y temperatura." }
        - { id: no, rotulo: "La parte de abajo", rect: [0, 161, 450, 80], texto: "Sin más equipo, no: distorsión bajo −80 dB, intermodulación con rigor y respuesta con altavoz real." }
        - { id: nota, rotulo: "La nota del pie", rect: [0, 242, 450, 35], texto: "Más allá del suelo del instrumento, solo se puede decir que está por debajo de él." }
    requiere: { mover: [medible, no, nota] }

  - id: empareje-instrumentos
    tipo: pregunta
    fase: "Empareje"
    titulo: "Los instrumentos"
    texto: "Una cada instrumento con lo que aporta al banco."
    libro: [407, 408, 409, 410, 411]
    emparejar:
      - ["Generador de baja distorsión", "El limitante de la medida de THD"]
      - ["Carga de 8 Ω y 100 W de alambre", "Medir la potencia sin destruirla"]
      - ["FFT", "La distorsión"]
      - ["Multímetro", "El bias y las tensiones"]
      - ["Termómetro o cámara térmica", "La temperatura tras media hora"]
    exito: "Con eso, y el osciloscopio de dos canales, se mide casi todo."
    pistas:
      - { texto: "No se puede medir menos distorsión que la de la propia señal de prueba." }
    escalera:
      - "¿Qué instrumento pone el suelo de la medida de distorsión?"
    solucion: "Generador–límite de THD; carga–potencia; FFT–distorsión; multímetro–bias; termómetro–temperatura."

  - id: estime-db
    tipo: pregunta
    fase: "Estime"
    titulo: "El 0,1 % en decibelios"
    texto: "La FFT de un osciloscopio de 8 bits llega hacia −50 o −60 dB. ¿Cuántos decibelios es el 0,1 % de la especificación?"
    libro: [416]
    estimar:
      objetivo: "d_db"
      unidad: dB
      min: -100
      max: 0
      paso: 1
      inicio: -20
      tol: 0.03
      rotulo: "0,1 % en dB"
    exito: "−60 dB: justo en el suelo del osciloscopio; ve el cruce o el recorte, pero no certifica el 0,1 %."
    pistas:
      - { cuando: { valor: estimacion, mayor: -58 }, texto: "Se ha quedado alto: 0,1 % es una milésima, y en tensión son 20 dB por década." }
      - { texto: "Se ha pasado: 0,01 % ya serían −80 dB." }
    escalera:
      - "0,1 % es 0,001; 20·log de 0,001."
    solucion: "20·log(0,001) = −60 dB."
    comprobar:
      - { d_db: -60, r_d: 0.001, c_20: 20, tol: 0.001 }
      - { con: { d_p: 0.01 }, d_db: -80, tol: 0.001 }

  - id: prediga-generador
    tipo: predecir
    titulo: "El suelo de la medida"
    texto: "Un amplificador de distorsión bajísima se mide con un generador corriente. ¿Qué mide la FFT?"
    libro: [407, 419]
    widget:
      tipo: figura
      figura: fig-51.19
      zonas:
        - { id: nota, rotulo: "La nota del pie", rect: [0, 242, 450, 35] }
    opciones:
      - texto: "Como mucho, la distorsión del generador: solo puede afirmarse que el amplificador está por debajo"
        bien: true
        porque: "No se puede medir una distorsión menor que la de la fuente. Decirlo es lo honesto."
      - texto: "La distorsión exacta del amplificador"
        porque: "La del generador se suma: por debajo de ella no se distingue nada."
      - texto: "Nada útil"
        porque: "Sí es útil: dice que el amplificador está por debajo de ese suelo."
    escalera:
      - "¿Qué llega a la entrada del amplificador además de la senoide?"
    solucion: "El suelo del generador: solo se afirma que está por debajo."

  - id: pregunta-decisiva
    tipo: pregunta
    titulo: "La medida que resume el proyecto"
    texto: "¿Qué medida conviene repetir tras cada modificación?"
    libro: [413, 414, 424, "cap51#210"]
    widget:
      tipo: figura
      figura: fig-51.19
      zonas:
        - { id: medible, rotulo: "La parte de arriba", rect: [0, 25, 450, 135] }
    opciones:
      - texto: "El escalón con carga resistiva y con un condensador en paralelo"
        bien: true
        porque: "Es rápida, no pide generador de calidad y detecta antes que ninguna un margen de fase insuficiente."
      - texto: "La THD a 1 kHz"
        porque: "Necesita buen generador y no ve el margen de fase."
      - texto: "La potencia máxima"
        porque: "No cambia con la mayoría de las modificaciones y no avisa de la inestabilidad."
    escalera:
      - "¿Qué fallo estropea un amplificador con buenas cifras estáticas?"
    solucion: "El escalón con carga capacitiva."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [407, 416, 421, 424]
    ideas:
      - { titulo: "Instrumentos.", texto: "Osciloscopio, generador de baja distorsión, carga de potencia, FFT, multímetro y termómetro." }
      - { titulo: "El suelo.", texto: "No se mide menos distorsión que la del generador; 0,1 % son −60 dB." }
      - { titulo: "Las ideas.", texto: "AB con su reposo, lazo térmico físico, disipación máxima en medio, masas y altavoz protegido." }
      - { titulo: "La prueba.", texto: "El escalón con carga capacitiva, tras cada cambio." }
