# Lección 1.2 de la sección 52.2 «Las Etapas del Amplificador» (cap51; etiqueta sec-51.2). Proyecto detallado III.
# Formato: contenido/lecciones11/GUIA.md. La cadena de bloques sobre la figura 52.3 (fig-51.3, con zonas en sus cinco
# bloques); el reparto de la ganancia (bloque 74: 0,7 V eficaces, 20 V eficaces, unas 29 veces, 29 dB).
# 1.2.1 (autor121-ana, «aprender haciendo», GUIA §13): la cadena se toca en orden, y el bloque de la distorsión y el
# punto al que vuelve la realimentación global se tocan en la figura 52.4; los 29 dB se predicen y se reparten entre
# preamplificador y driver (×2 y ×14,3, los de la figura 52.4) con objetivo. La salida (ganancia ≈ 1) y el reparto
# pasan a los éxitos; la arquitectura queda como emparejamiento y el volumen antes de amplificar como la única
# pregunta de opciones.
leccion: cap51/sec-51.2

libro:
  49: "Un amplificador de audio es una cadena de bloques"
  51: "adapta impedancias, elige la fuente y protege"
  52: "Aquí se decide el ruido del conjunto"
  53: "atenúa y ajusta la respuesta"
  54: "proporciona la ganancia de tensión y la corriente de base"
  55: "con ganancia de tensión aproximadamente uno"
  56: "en audio no es un accesorio"
  58: "La etapa de salida no aporta ninguna: da corriente"
  59: "a volumen bajo deja la señal pequeña frente al ruido de lo que viene después"
  60: "La distorsión la domina la etapa de salida"
  61: "Cuanto más abarca, más corrige y más difícil es la estabilidad"
  63: "Global corrige más y compromete la estabilidad"
  64: "Separarlos mejora el ruido"
  65: "Separada evita que los picos de la etapa de salida contaminen el preamplificador"
  71: "el reparto de ganancia entre etapas se calcula, en lugar de decidirse por costumbre"
  74: "20·log 28,6 ≈ 29 dB"
  76: "La cadena de un amplificador con el reparto de funciones"

modelo:
  valores:
    V_in: { sim: "V_{in}", nombre: "sensibilidad de entrada (eficaz)", unidad: V, valor: 0.7 }
    V_o: { sim: "V_{o}", nombre: "salida eficaz a 50 W sobre 8 Ω", unidad: V, valor: 20 }
    G_p: { sim: "G_{pre}", nombre: "ganancia del preamplificador", unidad: "", valor: 1 }
  calculos:
    G_t: { expr: "V_o/V_in", sim: "G", nombre: "ganancia total", unidad: "", cifras: 3 }
    G_db: { expr: "20*log10(G_t)", sim: "G", nombre: "ganancia total en decibelios", unidad: dB, cifras: 3 }
    G_d: { expr: "G_t/G_p", sim: "G_{driver}", nombre: "ganancia del driver", unidad: "", cifras: 3 }
    Gp_db: { expr: "20*log10(G_p)", sim: "G_{pre}", nombre: "ganancia del preamplificador en decibelios", unidad: dB, cifras: 2 }
    Gd_db: { expr: "20*log10(G_d)", sim: "G_{driver}", nombre: "ganancia del driver en decibelios", unidad: dB, cifras: 3 }

tarjetas:
  - id: explore-cadena
    tipo: tocar
    titulo: "La cadena completa"
    texto: "Verlos juntos explica por qué cada uno está donde está. Toque los cinco bloques en el camino de la señal, de la fuente al altavoz."
    libro: [49, 51, 52, 53, 54, 55, 56, 76]
    widget:
      tipo: figura
      figura: fig-51.3
      zonas:
        - { id: entrada, rotulo: "Primer bloque", rect: [2, 2, 76, 66] }
        - { id: pre, rotulo: "Segundo bloque", rect: [95, 2, 76, 66] }
        - { id: tono, rotulo: "Tercer bloque", rect: [189, 2, 76, 66] }
        - { id: driver, rotulo: "Cuarto bloque", rect: [282, 2, 76, 66] }
        - { id: potencia, rotulo: "Quinto bloque", rect: [376, 2, 76, 66] }
    tocar:
      bien: [entrada, pre, tono, driver, potencia]
      orden: true
    exito: "Entrada, preamplificador, volumen y tono, driver y potencia; y alrededor de todo, la alimentación, que en audio no es un accesorio."
    escalera:
      - "Primero se elige la fuente; lo último es lo que mueve el altavoz."
    solucion: "Entrada, preamplificador, volumen y tono, driver, etapa de potencia."

  - id: empareje-donde
    tipo: tocar
    titulo: "Dónde está la distorsión"
    texto: "El ruido lo decide la primera etapa. Toque el bloque que domina la distorsión."
    libro: [58, 59, 60]
    widget:
      tipo: figura
      figura: fig-51.3
      zonas:
        - { id: entrada, rotulo: "Primer bloque", rect: [2, 2, 76, 66] }
        - { id: pre, rotulo: "Segundo bloque", rect: [95, 2, 76, 66] }
        - { id: tono, rotulo: "Tercer bloque", rect: [189, 2, 76, 66] }
        - { id: driver, rotulo: "Cuarto bloque", rect: [282, 2, 76, 66] }
        - { id: potencia, rotulo: "Quinto bloque", rect: [376, 2, 76, 66] }
    tocar:
      bien: [potencia]
      porque:
        entrada: "La entrada adapta impedancias y protege; la señal ahí es pequeña."
        pre: "En el preamplificador se decide el ruido, no la distorsión."
        tono: "El volumen y el tono atenúan: la señal no es grande ahí."
        driver: "El driver da la ganancia de tensión, pero la señal mayor está después."
    exito: "La etapa de salida: la señal es mayor y los dispositivos trabajan cerca de sus límites. No da ganancia de tensión, da corriente."
    escalera:
      - "¿Dónde es mayor la señal?"
    solucion: "La etapa de potencia."

  - id: porque-orden
    tipo: porque
    titulo: "Atenuar antes de amplificar"
    texto: "Poner el volumen antes de amplificar evita saturar las etapas intermedias. ¿Qué precio tiene?"
    libro: [59]
    widget:
      tipo: figura
      figura: fig-51.3
      zonas:
        - { id: tono, rotulo: "Tercer bloque", rect: [189, 2, 76, 66] }
    opciones:
      - texto: "A volumen bajo, la señal queda pequeña frente al ruido de lo que viene después"
        bien: true
        porque: "La señal atenuada entra en etapas que suman su ruido: proporcionalmente, pesa más."
      - texto: "Que las señales grandes saturan el preamplificador"
        porque: "Eso es lo que se evita atenuando antes."
      - texto: "Ninguno: siempre es mejor"
        porque: "Es un compromiso: se gana en saturación y se pierde en ruido a volumen bajo."
    escalera:
      - "¿Qué pasa con una señal muy atenuada que entra en una etapa con su propio ruido?"
    solucion: "A volumen bajo la señal queda pequeña frente al ruido posterior."

  - id: pregunta-realimentacion
    tipo: tocar
    titulo: "¿Hasta dónde llega el lazo?"
    texto: "La realimentación global se toma de la salida. Toque el bloque a cuya entrada se lleva."
    libro: [61, 63]
    widget:
      tipo: figura
      figura: fig-51.3
      zonas:
        - { id: pre, rotulo: "Segundo bloque", rect: [95, 2, 76, 66] }
        - { id: tono, rotulo: "Tercer bloque", rect: [189, 2, 76, 66] }
        - { id: driver, rotulo: "Cuarto bloque", rect: [282, 2, 76, 66] }
    tocar:
      bien: [driver]
      porque:
        pre: "Abarcaría también el volumen: más etapas dentro del lazo, peor estabilidad."
        tono: "El volumen queda fuera del lazo."
    exito: "Al driver: abarca driver y salida, no el volumen. Global corrige más y compromete la estabilidad; local por etapas, al revés."
    escalera:
      - "Siga la línea discontinua."
    solucion: "El driver."

  - id: estime-db
    tipo: simular
    fase: "Estime"
    titulo: "La ganancia en decibelios"
    texto: "De 0,7 V eficaces a 20 V eficaces son unas 29 veces. ¿Cuántos decibelios?"
    libro: [74]
    simular:
      objetivo: G_db
      unidad: dB
      tol: 0.02
      rotulo: "Ganancia total"
      errores:
        - { expr: "G_db/2", texto: "En tensión el logaritmo se multiplica por 20: ha usado la mitad." }
    exito: "Unos 29 dB: que coincidan las dos cifras es casual."
    escalera:
      - "20 · log 28,6."
    solucion: "20 · log 28,6 ≈ 29 dB."
    comprobar:
      - { G_db: 29.1, G_t: 28.6, tol: 0.005 }

  - id: prediga-reparto
    tipo: explorar
    titulo: "Repartir la ganancia"
    texto: "En decibelios, las ganancias se suman. Reparta los 29 dB hasta dejar al driver los 23 dB de la figura 52.4."
    libro: [71, 74, 76]
    inicio: { G_p: 1 }
    widget:
      tipo: grafica
      x: { id: g, min: 1, max: 30, escala: log, unidad: "", rotulo: "G_{pre}" }
      y: { min: 0, max: 35, unidad: dB, rotulo: "ganancia" }
      curvas:
        - { expr: "20*log10(g)", color: verde, rotulo: "preamplificador" }
        - { expr: "20*log10(G_t/g)", color: azul, rotulo: "driver" }
        - { expr: "G_db", color: tinta, rotulo: "total", discontinua: true }
      marcas:
        - { x: "G_p", y: "Gd_db", rotulo: "{{Gd_db}}" }
      lectura: { valor: G_d, rotulo: "Ganancia del driver" }
      mandos:
        - { valor: G_p, lista: [1, 2, 5, 10], rotulo: "Ganancia del preamplificador" }
    objetivo:
      condiciones:
        - { valor: Gd_db, objetivo: 23, tol: 0.02, rotulo: "Driver: {{Gd_db}}" }
      logrado: "Preamplificador ×{{G_p}} ({{Gp_db}}) y driver ×{{G_d}} ({{Gd_db}}). Demasiada ganancia al principio saturaría las etapas intermedias."
      pistas:
        - { texto: "Más ganancia en el preamplificador, menos en el driver." }
    escalera:
      - "29 − 23 = 6 dB para el preamplificador."
    solucion: "×2 en el preamplificador: 6 dB; el driver, ×14,3."
    comprobar:
      - { con: { G_p: 2 }, G_d: 14.3, Gd_db: 23.1, Gp_db: 6.02, tol: 0.005 }

  - id: empareje-arquitectura
    tipo: pregunta
    fase: "Empareje"
    titulo: "Las decisiones de arquitectura"
    texto: "Una cada decisión con lo que gana."
    libro: [64, 65]
    emparejar:
      - ["Preamplificador separado de la potencia", "Menos ruido, lejos del transformador"]
      - ["Alimentación separada para la señal", "Los picos de la salida no contaminan el preamplificador"]
      - ["Realimentación local por etapas", "Más benigna para la estabilidad"]
    exito: "Cada decisión compra algo: ruido, limpieza o estabilidad."
    pistas:
      - { texto: "El transformador es la fuente de zumbido más cercana al preamplificador." }
    escalera:
      - "Separar acerca o aleja la señal pequeña de lo que molesta."
    solucion: "Separar el preamplificador–ruido; alimentación separada–picos; local–estabilidad."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [49, 55, 58, 61, 74]
    ideas:
      - { titulo: "Cinco bloques.", texto: "Entrada, preamplificador, volumen y tono, driver y potencia, con la alimentación alrededor." }
      - { titulo: "Cada uno, lo suyo.", texto: "La ganancia en preamplificador y driver; la salida da corriente." }
      - { titulo: "Ruido y distorsión.", texto: "El ruido, en la primera etapa; la distorsión, en la de salida." }
      - { titulo: "El reparto.", texto: "29 veces, unos 29 dB, repartidos sin saturar etapas intermedias." }
