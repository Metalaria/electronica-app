# Lección 1.2 de la sección 52.2 «Las Etapas del Amplificador» (cap51; etiqueta sec-51.2). Proyecto detallado III.
# Formato: contenido/lecciones11/GUIA.md. La cadena de bloques sobre la figura 52.3 (fig-51.3, con zonas en sus cinco
# bloques); el reparto de la ganancia (bloque 74: 0,7 V eficaces, 20 V eficaces, unas 29 veces, 29 dB).
leccion: cap51/sec-51.2

libro:
  49: "Un amplificador de audio es una cadena de bloques"
  51: "adapta impedancias, elige la fuente y protege"
  52: "Aquí se decide el ruido del conjunto"
  53: "atenúa y ajusta la respuesta"
  54: "proporciona la ganancia de tensión y la corriente de base"
  55: "con ganancia de tensión aproximadamente uno"
  56: "en audio no es un accesorio"
  58: "La etapa de salida no aporta ninguna: da corriente"
  59: "a volumen bajo deja la señal pequeña frente al ruido de lo que viene después"
  60: "La distorsión la domina la etapa de salida"
  61: "Cuanto más abarca, más corrige y más difícil es la estabilidad"
  63: "Global corrige más y compromete la estabilidad"
  64: "Separarlos mejora el ruido"
  65: "Separada evita que los picos de la etapa de salida contaminen el preamplificador"
  74: "20·log 28,6 ≈ 29 dB"
  76: "La cadena de un amplificador con el reparto de funciones"

modelo:
  valores:
    V_in: { sim: "V_{in}", nombre: "sensibilidad de entrada (eficaz)", unidad: V, valor: 0.7 }
    V_o: { sim: "V_{o}", nombre: "salida eficaz a 50 W sobre 8 Ω", unidad: V, valor: 20 }
  calculos:
    G_t: { expr: "V_o/V_in", sim: "G", nombre: "ganancia total", unidad: "", cifras: 3 }
    G_db: { expr: "20*log10(G_t)", sim: "G", nombre: "ganancia total en decibelios", unidad: dB, cifras: 3 }

tarjetas:
  - id: explore-cadena
    tipo: explorar
    titulo: "La cadena completa"
    texto: "Verlos juntos explica por qué cada uno está donde está. Toque los cinco bloques."
    libro: [49, 51, 52, 53, 54, 55, 76]
    widget:
      tipo: figura
      figura: fig-51.3
      zonas:
        - { id: entrada, rotulo: "Primer bloque", rect: [2, 2, 76, 66], texto: "Entrada y selección: adapta impedancias, elige la fuente y protege." }
        - { id: pre, rotulo: "Segundo bloque", rect: [95, 2, 76, 66], texto: "Preamplificador: lleva la señal al nivel de trabajo. Aquí se decide el ruido del conjunto." }
        - { id: tono, rotulo: "Tercer bloque", rect: [189, 2, 76, 66], texto: "Volumen y tono: atenúa y ajusta la respuesta." }
        - { id: driver, rotulo: "Cuarto bloque", rect: [282, 2, 76, 66], texto: "Driver: da la ganancia de tensión y la corriente de base que pide la salida." }
        - { id: potencia, rotulo: "Quinto bloque", rect: [376, 2, 76, 66], texto: "Etapa de potencia: corriente al altavoz, con ganancia de tensión de casi uno." }
    requiere: { mover: [entrada, pre, tono, driver, potencia] }

  - id: ordene-cadena
    tipo: pregunta
    fase: "Ordene"
    titulo: "De la fuente al altavoz"
    texto: "Ordene los bloques en el camino de la señal."
    libro: [51, 52, 53, 54, 55, 56]
    ordenar:
      - "Entrada y selección"
      - "Preamplificador"
      - "Control de volumen y tono"
      - "Driver"
      - "Etapa de potencia"
    exito: "Y alrededor de todo, la alimentación, que en audio no es un accesorio."
    pistas:
      - { texto: "El driver va justo antes de la etapa de potencia: le da la corriente de base." }
    escalera:
      - "Primero se elige la fuente; lo último es lo que mueve el altavoz."
    solucion: "Entrada, preamplificador, volumen y tono, driver, etapa de potencia."

  - id: empareje-donde
    tipo: pregunta
    fase: "Empareje"
    titulo: "Dónde está cada cosa"
    texto: "Una cada propiedad del amplificador con el bloque que la decide."
    libro: [58, 59, 60, 61]
    emparejar:
      - ["La ganancia de tensión", "Preamplificador y driver"]
      - ["El ruido", "La primera etapa"]
      - ["La distorsión", "La etapa de salida, donde la señal es mayor"]
      - ["La realimentación", "Abarca el driver y la etapa de salida"]
    exito: "Por eso el orden importa y cada bloque se diseña para lo suyo."
    pistas:
      - { texto: "La etapa de salida no da ganancia de tensión: da corriente." }
    escalera:
      - "¿Dónde es mayor la señal y dónde es más pequeña?"
    solucion: "Ganancia–preamplificador y driver; ruido–primera etapa; distorsión–salida; realimentación–driver y salida."

  - id: pregunta-salida
    tipo: pregunta
    titulo: "La etapa de potencia"
    texto: "¿Cuánta ganancia de tensión aporta la etapa de salida?"
    libro: [55, 58]
    widget:
      tipo: figura
      figura: fig-51.3
      zonas:
        - { id: potencia, rotulo: "Quinto bloque", rect: [376, 2, 76, 66] }
    opciones:
      - texto: "Casi uno: da corriente, no tensión"
        bien: true
        porque: "Son seguidores de emisor: la ganancia de tensión está repartida entre preamplificador y driver."
      - texto: "La mayor de la cadena"
        porque: "Esa es la del driver. La salida solo copia la tensión y entrega la corriente."
      - texto: "Ninguna: atenúa"
        porque: "No atenúa: su ganancia es casi uno, y su trabajo es la corriente."
    escalera:
      - "¿Qué configuración copia la tensión y tiene salida baja?"
    solucion: "Casi uno: es un seguidor que da corriente."

  - id: porque-orden
    tipo: porque
    titulo: "Atenuar antes de amplificar"
    texto: "Poner el volumen antes de amplificar evita saturar las etapas intermedias. ¿Qué precio tiene?"
    libro: [59]
    widget:
      tipo: figura
      figura: fig-51.3
      zonas:
        - { id: tono, rotulo: "Tercer bloque", rect: [189, 2, 76, 66] }
    opciones:
      - texto: "A volumen bajo, la señal queda pequeña frente al ruido de lo que viene después"
        bien: true
        porque: "La señal atenuada entra en etapas que suman su ruido: proporcionalmente, pesa más."
      - texto: "Que las señales grandes saturan el preamplificador"
        porque: "Eso es lo que se evita atenuando antes."
      - texto: "Ninguno: siempre es mejor"
        porque: "Es un compromiso: se gana en saturación y se pierde en ruido a volumen bajo."
    escalera:
      - "¿Qué pasa con una señal muy atenuada que entra en una etapa con su propio ruido?"
    solucion: "A volumen bajo la señal queda pequeña frente al ruido posterior."

  - id: pregunta-realimentacion
    tipo: pregunta
    titulo: "¿Global o local?"
    texto: "La realimentación puede abarcar varias etapas o una sola. ¿Qué cambia?"
    libro: [61, 63]
    widget:
      tipo: figura
      figura: fig-51.3
      zonas:
        - { id: driver, rotulo: "Cuarto bloque", rect: [282, 2, 76, 66] }
    opciones:
      - texto: "Global corrige más y compromete la estabilidad; local, al revés"
        bien: true
        porque: "Cuanto más abarca el lazo, más corrige y más difícil es que sea estable."
      - texto: "Global es siempre mejor"
        porque: "Corrige más, pero con más etapas dentro del lazo el margen de fase se complica."
      - texto: "Local corrige más"
        porque: "La local por etapas es más benigna, pero corrige menos."
    escalera:
      - "Más etapas dentro del lazo, ¿más o menos desfase?"
    solucion: "Global: más corrección, menos estabilidad. Local: lo contrario."

  - id: empareje-arquitectura
    tipo: pregunta
    fase: "Empareje"
    titulo: "Las decisiones de arquitectura"
    texto: "Una cada decisión con lo que gana."
    libro: [64, 65]
    emparejar:
      - ["Preamplificador separado de la potencia", "Menos ruido, lejos del transformador"]
      - ["Alimentación separada para la señal", "Los picos de la salida no contaminan el preamplificador"]
      - ["Realimentación local por etapas", "Más benigna para la estabilidad"]
    exito: "Cada decisión compra algo: ruido, limpieza o estabilidad."
    pistas:
      - { texto: "El transformador es la fuente de zumbido más cercana al preamplificador." }
    escalera:
      - "Separar acerca o aleja la señal pequeña de lo que molesta."
    solucion: "Separar el preamplificador–ruido; alimentación separada–picos; local–estabilidad."

  - id: estime-db
    tipo: pregunta
    fase: "Estime"
    titulo: "La ganancia en decibelios"
    texto: "De 0,7 V eficaces a 20 V eficaces son unas 29 veces. ¿Cuántos decibelios?"
    libro: [74]
    estimar:
      objetivo: "G_db"
      unidad: dB
      min: 0
      max: 60
      paso: 0.5
      inicio: 50
      tol: 0.03
      rotulo: "Ganancia total"
    exito: "Unos 29 dB: que coincidan las dos cifras es casual."
    pistas:
      - { cuando: { valor: estimacion, mayor: 30 }, texto: "Se ha pasado: 20·log 28,6." }
      - { texto: "Se ha quedado corto: en tensión se multiplica el logaritmo por 20." }
    escalera:
      - "20 · log 28,6."
    solucion: "20 · log 28,6 ≈ 29 dB."
    comprobar:
      - { G_db: 29.1, G_t: 28.6, tol: 0.005 }

  - id: prediga-reparto
    tipo: predecir
    titulo: "Repartir la ganancia"
    texto: "¿Qué pasa si casi toda la ganancia se pone al principio de la cadena?"
    libro: [74]
    widget:
      tipo: figura
      figura: fig-51.3
      zonas:
        - { id: pre, rotulo: "Segundo bloque", rect: [95, 2, 76, 66] }
    opciones:
      - texto: "Las etapas intermedias se saturan"
        bien: true
        porque: "Repartirla bien es lo que hace que el amplificador funcione a la primera."
      - texto: "Baja el ruido sin ningún coste"
        porque: "Algo de ganancia al principio ayuda al ruido, pero demasiada satura lo que sigue."
      - texto: "Nada: la ganancia total es la misma"
        porque: "El producto es el mismo, pero los niveles intermedios no: una señal grande demasiado pronto recorta."
    escalera:
      - "¿Qué nivel de señal llega a la etapa de tono si el preamplificador gana mucho?"
    solucion: "Saturan las etapas intermedias: el reparto se calcula, no se decide por costumbre."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [49, 58, 61, 74]
    ideas:
      - { titulo: "Cinco bloques.", texto: "Entrada, preamplificador, volumen y tono, driver y potencia, con la alimentación alrededor." }
      - { titulo: "Cada uno, lo suyo.", texto: "La ganancia en preamplificador y driver; la salida da corriente." }
      - { titulo: "Ruido y distorsión.", texto: "El ruido, en la primera etapa; la distorsión, en la de salida." }
      - { titulo: "El reparto.", texto: "29 veces, unos 29 dB, repartidos sin saturar etapas intermedias." }
