# Lección 1.2 de la sección 52.5 «La Distorsión de Cruce y el Bias» (cap51; etiqueta sec-51.5). Proyecto detallado III.
# Formato: contenido/lecciones11/GUIA.md.
# - El cruce: cada transistor empieza a conducir a 0,6 V (bloque 159) menos la mitad de la tensión de bias entre bases;
#   con 1,2 V (dos caídas, bloque 167) no queda hueco. 1.2 (esquemas12c): «explore-cruce», «ajuste-bias» y
#   «sorpresa-termica» sobre la «etapa-clase-ab» viva (±35 V, 0,22 Ω, 8 Ω; bias de 50 mA, β = 100 y senoide de 2 V de
#   ejemplo; iref = I_Q para que la corriente de reposo del simulador sea la del libro). Las otras gráficas, senoide de 1 V.
# - El multiplicador de V_BE de la figura 52.11 (fig-51.11): V_bias = V_BE·(1 + R₁/R₂), ≈ 1,2 V con R₁ ≈ R₂ (la
#   fórmula y el valor son de la figura); R₂ = 1 kΩ de ejemplo.
# - La deriva con la temperatura: 2 mV/°C por unión (bloque 168); el bias fijo frente al multiplicador en el disipador.
# Paso práctico: «ajuste» del bias mirando el escalón (bloque 185: «el escalón desaparece en un punto concreto»).
leccion: cap51/sec-51.5

libro:
  159: "ambos necesitan sus 0,6 V para empezar"
  160: "es proporcionalmente peor a bajo volumen"
  163: "están a frecuencias donde la ganancia de lazo ya ha caído"
  164: "la ganancia de la etapa cae bruscamente"
  165: "el cruce se resuelve en la etapa, con la polarización"
  167: "una tensión de unos 1,2 V —dos caídas base-emisor—"
  168: "esas caídas bajan 2 mV/°C"
  169: "Más corriente, más calor, más corriente"
  171: "genera una tensión que es un múltiplo ajustable de su propio VBE"
  172: "su VBE baja con la temperatura al mismo ritmo"
  174: "debe estar atornillado al disipador, no suelto en la placa"
  177: "Con resistencias de 0,22 Ω y una corriente de reposo objetivo de 50 mA, la caída es de 11 mV"
  178: "ajustar en frío, dejar calentar media hora, y reajustar"
  181: "se acerca a clase A sin sus ventajas"
  182: "El óptimo suele estar entre 20 y 100 mA por rama"
  185: "el escalón desaparece en un punto concreto"
  186: "armónicos de orden alto que se desploman al ajustar bien el bias"
  189: "El multiplicador de VBE y su montaje sobre el disipador"

modelo:
  valores:
    A_s: { sim: "V_{p}", nombre: "amplitud de la señal", unidad: V, valor: 1 }
    f_s: { sim: "f", nombre: "frecuencia de la señal", unidad: Hz, valor: 1000 }
    V_be: { sim: "V_{BE}", nombre: "caída de cada unión", unidad: V, valor: 0.6 }
    R_1: { sim: "R₁", nombre: "resistencia de ajuste del multiplicador", unidad: Ω, valor: 0 }
    R_2: { sim: "R₂", nombre: "resistencia fija del multiplicador", unidad: Ω, valor: 1000 }
    Vbe_t: { sim: "V_{BE}", nombre: "caída de los transistores de salida al calentarse", unidad: V, valor: 0.6 }
    en_d: { tipo: interruptor, nombre: "multiplicador atornillado al disipador", valor: 0 }
    R_e: { sim: "R_{E}", nombre: "resistencia de emisor", unidad: Ω, valor: 0.22 }
    I_q: { sim: "I_{Q}", nombre: "corriente de reposo objetivo", unidad: A, valor: 0.05 }
    Vcc_s: { sim: "V_{CC}", nombre: "alimentación simétrica", unidad: V, valor: 35 }
    Ib_s: { sim: "I_{B}", nombre: "corriente de la fuente de bias", unidad: A, valor: 0.05 }
    RL_s: { sim: "R_{L}", nombre: "carga", unidad: Ω, valor: 8 }
    b_s: { sim: "β", nombre: "ganancia de corriente", unidad: "", valor: 100 }
    bm_s: { sim: "β_{3}", nombre: "ganancia de corriente del multiplicador (sin corriente de base)", unidad: "", valor: 1e9 }
    A_v: { sim: "A", nombre: "amplitud de la senoide en la etapa", unidad: V, valor: 2 }
  calculos:
    V_b: { expr: "V_be*(1 + R_1/R_2)", sim: "V_{bias}", nombre: "tensión entre las bases", unidad: V }
    V_on: { expr: "max(0, V_be - V_b/2)", sim: "V_{hueco}", nombre: "semiancho del hueco de cruce", unidad: V }
    Ie_s: { expr: "max(0, (V_b - 2*V_be)/(2*R_e))", sim: "I_{E}", nombre: "corriente de reposo de emisor", unidad: A }
    Iq_s: { expr: "b_s/(b_s + 1)*Ie_s", sim: "I_{Q}", nombre: "corriente de reposo", unidad: A }
    Ir_s: { expr: "max(Iq_s, 0.01)", sim: "I_{ref}", nombre: "corriente de referencia de V_BE", unidad: A }
    Vin_s: { expr: "-V_b/2", sim: "V_{driver}", nombre: "nivel del driver", unidad: V }
    k_s: { expr: "R_e/RL_s", sim: "k", nombre: "R_E/R_L", unidad: "" }
    sab_s: { expr: "ceil(max(0, V_b - 2*V_be)/1e9)", sim: "AB", nombre: "las dos ramas conducen en reposo", unidad: "" }
    Vbm_t: { expr: "en_d*Vbe_t + (1 - en_d)*V_be", sim: "V_{BE3}", nombre: "caída del multiplicador", unidad: V }
    Vbb_t: { expr: "Vbm_t*(1 + R_1/R_2)", sim: "V_{BB}", nombre: "tensión entre las bases", unidad: V }
    Ie_t: { expr: "max(0, (Vbb_t - 2*Vbe_t)/(2*R_e))", sim: "I_{E}", nombre: "corriente de reposo de emisor", unidad: A }
    Iq_t: { expr: "b_s/(b_s + 1)*Ie_t", sim: "I_{Q}", nombre: "corriente de reposo", unidad: A }
    Ir_t: { expr: "max(Iq_t, 0.01)", sim: "I_{ref}", nombre: "corriente de referencia de V_BE", unidad: A }
    Vin_t: { expr: "-Vbb_t/2", sim: "V_{driver}", nombre: "nivel del driver", unidad: V }
    V_re: { expr: "R_e*I_q", sim: "V_{RE}", nombre: "caída en la resistencia de emisor", unidad: V }

tarjetas:
  - id: explore-cruce
    tipo: explorar
    titulo: "El escalón del cruce"
    texto: "Sin bias, ningún transistor conduce hasta 0,6 V. Suba R₁ del multiplicador y mire el hueco de la salida."
    libro: [159, 167, 171, 189]
    widget:
      tipo: circuito
      esquema: etapa-clase-ab
      piezas: { vcc: Vcc_s, entrada: Vin_s, amplitud: A_v, f: f_s, ib: Ib_s, r1: R_1, r2: R_2, re: R_e, carga: RL_s, beta: b_s, vbe: V_be, iref: Ir_s, betam: bm_s }
      lectura: { valor: V_b, rotulo: "Tensión entre las bases" }
      datos:
        - { valor: V_on, rotulo: "Hueco: ±{{V_on}}" }
      mide: { vbb: V_b }
      grafica:
        x: { id: t, min: 0, max: 0.002, unidad: s, rotulo: "t" }
        y: { min: -2.4, max: 2.4, unidad: V, rotulo: "v" }
        curvas:
          - { expr: "A_v*sin(2*pi*f_s*t)", color: tinta, rotulo: "señal", discontinua: true }
          - { expr: "sab_s*max((A_v*sin(2*pi*f_s*t) - V_b/2 + V_be)/(1 + k_s), min((A_v*sin(2*pi*f_s*t) + V_b/2 - V_be)/(1 + k_s), (2*A_v*sin(2*pi*f_s*t))/(2 + k_s))) + (1 - sab_s)*(max((A_v*sin(2*pi*f_s*t) + V_b/2 - V_be)/(1 + k_s), 0) + min((A_v*sin(2*pi*f_s*t) - V_b/2 + V_be)/(1 + k_s), 0))", color: naranja, rotulo: "salida", mide: salida }
      mandos:
        - { valor: R_1, min: 0, max: 1500, paso: 50, rotulo: "R₁ del multiplicador" }
    requiere: { mover: [R_1] }

  - id: prediga-volumen
    tipo: predecir
    titulo: "¿Cuándo suena peor?"
    texto: "Un amplificador con el bias mal ajustado: ¿cuándo se nota más la distorsión de cruce?"
    libro: [160]
    fijar: { R_1: 0, A_s: 1 }
    widget:
      tipo: grafica
      x: { id: t, min: 0, max: 0.002, unidad: s, rotulo: "t" }
      y: { min: -1.2, max: 1.2, unidad: V, rotulo: "v" }
      curvas:
        - { expr: "max(0, A_s*sin(2*pi*f_s*t) - V_on) + min(0, A_s*sin(2*pi*f_s*t) + V_on)", color: naranja, rotulo: "salida" }
      lectura: { valor: V_on, rotulo: "Hueco" }
      ocultar: true
    opciones:
      - texto: "A bajo volumen"
        bien: true
        porque: "El escalón tiene tamaño fijo y la señal es pequeña: suena mal justo cuando debería sonar bien."
      - texto: "A todo volumen"
        porque: "Con señal grande el escalón fijo es una parte pequeña; a todo volumen manda el recorte."
      - texto: "Igual a cualquier volumen"
        porque: "El escalón mide lo mismo, pero pesa más frente a una señal pequeña."
    escalera:
      - "El hueco no cambia con la señal. ¿Frente a qué señal es mayor?"
    solucion: "A bajo volumen: proporcionalmente peor."

  - id: ajuste-bias
    tipo: ajuste
    titulo: "Ajuste el bias mirando"
    texto: "Mientras mira la salida, suba R₁ hasta que el escalón desaparezca, sin pasarse."
    libro: [167, 181, 185]
    inicio: { R_1: 0 }
    widget:
      tipo: circuito
      esquema: etapa-clase-ab
      piezas: { vcc: Vcc_s, entrada: Vin_s, amplitud: A_v, f: f_s, ib: Ib_s, r1: R_1, r2: R_2, re: R_e, carga: RL_s, beta: b_s, vbe: V_be, iref: Ir_s, betam: bm_s }
      lectura: { valor: V_b, rotulo: "Tensión entre las bases" }
      mide: { vbb: V_b }
      grafica:
        x: { id: t, min: 0, max: 0.002, unidad: s, rotulo: "t" }
        y: { min: -2.4, max: 2.4, unidad: V, rotulo: "v" }
        curvas:
          - { expr: "A_v*sin(2*pi*f_s*t)", color: tinta, rotulo: "señal", discontinua: true }
          - { expr: "sab_s*max((A_v*sin(2*pi*f_s*t) - V_b/2 + V_be)/(1 + k_s), min((A_v*sin(2*pi*f_s*t) + V_b/2 - V_be)/(1 + k_s), (2*A_v*sin(2*pi*f_s*t))/(2 + k_s))) + (1 - sab_s)*(max((A_v*sin(2*pi*f_s*t) + V_b/2 - V_be)/(1 + k_s), 0) + min((A_v*sin(2*pi*f_s*t) - V_b/2 + V_be)/(1 + k_s), 0))", color: naranja, rotulo: "salida", mide: salida }
      mandos:
        - { valor: R_1, min: 0, max: 1500, paso: 50, rotulo: "R₁ del multiplicador" }
    ajuste:
      valor: V_b
      objetivo: 1.2
      tol: 0.03
      rotulo: "Bias entre las bases"
      escala: { min: 0.5, max: 1.6 }
      bajo: "Aún queda escalón: suba R₁."
      alto: "Sobra bias: más corriente de reposo y más calor. Baje R₁."
      dentro: "Unos 1,2 V, dos caídas: el escalón desaparece justo aquí."

  - id: pregunta-darlington
    tipo: pregunta
    titulo: "Con drivers Darlington"
    texto: "Dos uniones piden unos 1,2 V entre las bases; con drivers Darlington hay cuatro en serie. ¿Qué bias hace falta?"
    libro: [167]
    widget:
      tipo: grafica
      x: { id: t, min: 0, max: 0.002, unidad: s, rotulo: "t" }
      y: { min: -1.2, max: 1.2, unidad: V, rotulo: "v" }
      curvas:
        - { expr: "A_s*sin(2*pi*f_s*t)", color: tinta, rotulo: "entrada", discontinua: true }
    opciones:
      - texto: "Unos 2,3 a 2,5 V"
        bien: true
        porque: "Cuatro caídas base-emisor en serie: el doble de uniones, casi el doble de tensión."
      - texto: "Unos 1,2 V, igual"
        porque: "Cada unión en serie pide su caída: con cuatro, hace falta más."
      - texto: "Unos 0,6 V"
        porque: "Esa es una sola caída; entre las bases hay que vencer todas las del camino."
    escalera:
      - "¿Cuántas caídas base-emisor hay entre las dos bases?"
    solucion: "Cuatro uniones: unos 2,3 a 2,5 V."

  - id: sorpresa-termica
    tipo: sorpresa
    titulo: "Caliente el disipador"
    texto: "Las caídas bajan 2 mV/°C. Caliente los transistores de salida y mire la corriente de reposo; luego, atornille el multiplicador al disipador."
    libro: [168, 169, 172, 174]
    fijar: { R_1: 1037 }
    inicio: { Vbe_t: 0.6, en_d: 0 }
    widget:
      tipo: circuito
      esquema: etapa-clase-ab
      piezas: { vcc: Vcc_s, entrada: Vin_t, ib: Ib_s, r1: R_1, r2: R_2, re: R_e, carga: RL_s, beta: b_s, vbe: Vbe_t, vbem: Vbm_t, iref: Ir_t, betam: bm_s }
      lectura: { valor: Iq_t, rotulo: "Corriente de reposo" }
      datos:
        - { valor: Vbb_t, rotulo: "V_{BB} = {{Vbb_t}}" }
      corriente: Iq_t
      mide: { iq: Iq_t, vbb: Vbb_t }
      mandos:
        - { valor: Vbe_t, lista: [0.6, 0.57, 0.54], nombres: [en frío, templados, calientes], rotulo: "Transistores de salida" }
        - { valor: en_d, tipo: interruptor, rotulo: "Multiplicador en el disipador" }
    requiere: { mover: [Vbe_t, en_d] }
    comprobar:
      - { con: { Vbe_t: 0.54, en_d: 1 }, Iq_t: 0.0446, tol: 0.01 }

  - id: porque-lazo
    tipo: porque
    titulo: "La realimentación no basta"
    texto: "La realimentación divide la distorsión por el factor de lazo. ¿Por qué corrige mal la de cruce?"
    libro: [163, 164, 165]
    fijar: { R_1: 0 }
    widget:
      tipo: grafica
      x: { id: t, min: 0, max: 0.002, unidad: s, rotulo: "t" }
      y: { min: -1.2, max: 1.2, unidad: V, rotulo: "v" }
      curvas:
        - { expr: "max(0, A_s*sin(2*pi*f_s*t) - V_on) + min(0, A_s*sin(2*pi*f_s*t) + V_on)", color: naranja, rotulo: "salida" }
    opciones:
      - texto: "Sus armónicos son de orden alto, donde la ganancia de lazo ya ha caído"
        bien: true
        porque: "Y en el cruce la ganancia cae de golpe: el lazo reacciona tarde. Se resuelve en la etapa, con el bias."
      - texto: "Porque la realimentación solo corrige la continua"
        porque: "Corrige la señal en toda su banda; el problema es que los armónicos del cruce caen fuera de ella."
      - texto: "Sí la corrige del todo"
        porque: "La divide por el factor de lazo a cada frecuencia, y a las de esos armónicos queda poco."
    escalera:
      - "¿A qué frecuencias están los armónicos de un escalón brusco?"
    solucion: "Armónicos altos, donde el lazo ya casi no gana: se resuelve con el bias."

  - id: pregunta-montaje
    tipo: pregunta
    titulo: "La regla de montaje"
    texto: "Un amplificador se destruye tras unos minutos de funcionar, con el transistor del multiplicador suelto en la placa. ¿Qué pasa?"
    libro: [169, 174]
    widget:
      tipo: figura
      figura: fig-51.11
      zonas:
        - { id: suelto, rotulo: "Recuadro de abajo a la derecha", rect: [264, 184, 157, 62] }
    opciones:
      - texto: "Su V_{BE} no baja con el disipador: el bias sobra, la corriente sube y se embala"
        bien: true
        porque: "Más corriente, más calor, más corriente: el embalamiento térmico destruye los transistores."
      - texto: "Se calienta él y se quema"
        porque: "Disipa muy poco; el problema es que no siente la temperatura de los de potencia."
      - texto: "Nada: el bias ya se ajustó en frío"
        porque: "En frío estaba bien; al calentarse los de salida piden menos, y el circuito sigue dando lo mismo."
    escalera:
      - "¿Qué temperatura sigue la V_{BE} del multiplicador si no toca el disipador?"
    solucion: "No sigue la temperatura de los de potencia: embalamiento térmico."

  - id: estime-caida
    tipo: pregunta
    fase: "Estime"
    titulo: "Medir la corriente de reposo"
    texto: "Se mide la caída en una R_{E} de 0,22 Ω, sin señal. Para 50 mA de reposo, ¿cuánto debe leer el multímetro?"
    libro: [177]
    estimar:
      objetivo: "V_re"
      unidad: V
      min: 0
      max: 0.05
      paso: 0.0005
      inicio: 0.04
      tol: 0.05
      rotulo: "Caída en R_{E}"
    exito: "11 mV: con el amplificador caliente, no en frío."
    pistas:
      - { cuando: { valor: estimacion, mayor: 0.0116 }, texto: "Se ha pasado: 0,22 Ω por 50 mA son milivoltios." }
      - { texto: "Se ha quedado corto: 0,22 Ω por 50 mA." }
    escalera:
      - "Ley de Ohm: V = R · I."
    solucion: "0,22 Ω × 50 mA = 11 mV."
    comprobar:
      - { V_re: 0.011, tol: 0.001 }

  - id: pregunta-procedimiento
    tipo: pregunta
    titulo: "El procedimiento"
    texto: "Se ajusta en frío y se deja calentar media hora; al reajustar, la corriente sigue subiendo. ¿Qué indica?"
    libro: [178]
    widget:
      tipo: figura
      figura: fig-51.11
      zonas:
        - { id: disipador, rotulo: "El recuadro gris", rect: [63, 66, 138, 152] }
    opciones:
      - texto: "Que la compensación térmica no funciona"
        bien: true
        porque: "La corriente debe derivar al principio y estabilizarse; si sigue subiendo, el lazo térmico no está cerrado."
      - texto: "Que falta tiempo: hay que esperar más"
        porque: "Tras media hora debería estar estable; si sigue subiendo, el problema es la compensación."
      - texto: "Que sobra corriente de reposo: basta bajar R₁"
        porque: "Bajarla solo retrasa el problema: la corriente seguirá subiendo con el calor."
    escalera:
      - "Con la compensación funcionando, ¿qué debería hacer la corriente al calentarse?"
    solucion: "La compensación térmica no está funcionando: debe estabilizarse."

  - id: empareje-compromiso
    tipo: pregunta
    fase: "Empareje"
    titulo: "El compromiso del bias"
    texto: "Una cada corriente de reposo con lo que provoca."
    libro: [181, 182, 186]
    emparejar:
      - ["Poca", "Distorsión de cruce audible"]
      - ["Mucha", "Más calor en reposo: se acerca a clase A sin sus ventajas"]
      - ["Entre 20 y 100 mA por rama", "El óptimo habitual, según la topología"]
    exito: "Y con la FFT se ve: los armónicos de orden alto se desploman al ajustar bien."
    pistas:
      - { texto: "Demasiado bias convierte la AB en una clase A cara." }
    escalera:
      - "Una corriente quita el cruce; demasiada solo añade calor."
    solucion: "Poca–cruce; mucha–calor, casi clase A; 20 a 100 mA–óptimo."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [160, 167, 172, 177]
    ideas:
      - { titulo: "El cruce.", texto: "Un escalón fijo de ±0,6 V: peor a bajo volumen, y el lazo lo corrige mal." }
      - { titulo: "El bias.", texto: "Unos 1,2 V entre las bases, dos caídas; con Darlington, 2,3 a 2,5 V." }
      - { titulo: "El multiplicador de V_{BE}.", texto: "Atornillado al disipador, baja el bias al calentarse: lazo térmico cerrado." }
      - { titulo: "El ajuste.", texto: "11 mV en 0,22 Ω para 50 mA, en caliente." }
