# Lección 1.2 de la sección 52.4 «La Etapa de Potencia Clase AB» (cap51; etiqueta sec-51.4). Proyecto detallado III.
# Formato: contenido/lecciones11/GUIA.md. La etapa de la figura 52.7 (fig-51.7: Q₁ NPN y Q₂ PNP seguidores, R_E de
# 0,22 Ω, polarización por diodos con fuente de corriente, driver Q₃, altavoz de 8 Ω, ±35 V) con zonas; el resto,
# emparejar y opciones con los argumentos del libro, y el ejercicio 52.2 (bloque 377).
# 1.2.1 (autor121-ana, «aprender haciendo», GUIA §13): la polarización que quita el cruce y el driver que da la
# ganancia se tocan en la figura 52.8; la clase AB se ajusta en la etapa viva con R₁ del multiplicador (objetivo:
# reposo pequeño, sin hueco); la R_E que mide el reposo se elige en el esquema y la continua de salida se mide con el
# multímetro. Clases, Darlington, precio de R_E y la FFT pasan a éxitos y resumen; quedan las protecciones
# (emparejar) y el ejercicio 52.2 (opciones).
leccion: cap51/sec-51.4

libro:
  119: "tiene que dar corriente a un altavoz de pocos ohmios"
  121: "25 % en el mejor caso"
  122: "mientras la señal atraviesa la zona de los ±0,6 V"
  123: "lo que elimina el hueco del cruce"
  124: "la corriente de reposo sea el ajuste más delicado"
  126: "un NPN y un PNP, ambos como seguidores de emisor"
  128: "La ganancia la aporta el driver anterior"
  129: "Impedancia de salida baja"
  130: "con la corriente de reposo circulando por ambos alrededor del cero"
  133: "con dos caídas base-emisor —1,4 V—"
  134: "Solo una caída y mejor linealidad"
  135: "permite usar dos transistores de potencia del mismo tipo"
  137: "Unos 0,1 a 0,47 Ω en serie con cada emisor"
  138: "Estabilizan térmicamente la corriente de reposo"
  139: "Reparten la corriente cuando hay transistores en paralelo"
  140: "Permiten medir la corriente de reposo midiendo su caída"
  141: "disipan y reducen ligeramente el rendimiento"
  144: "evita la destrucción con la salida en cortocircuito"
  145: "contra la fuerza contraelectromotriz del altavoz"
  146: "que estabiliza ante la inductancia de la bobina móvil"
  147: "desconecta el altavoz si aparece tensión continua en la salida"
  153: "debe ser baja a potencia media y crecer cerca del recorte"
  154: "Debe ser de milivoltios"
  155: "Etapa de potencia Clase AB con par complementario"
  "cap51#14": "fijan la alimentación en unos ±35 V"
  "cap51#377": "¿Por qué la etapa de potencia necesita alimentación doble y simétrica"

modelo:
  valores:
    Vcc: { sim: "V_{CC}", nombre: "alimentación simétrica", unidad: V, valor: 35 }
    Ib: { sim: "I_{B}", nombre: "corriente de la fuente de bias", unidad: A, valor: 0.05 }
    R1: { sim: "R₁", nombre: "resistencia de ajuste del multiplicador", unidad: Ω, valor: 1037 }
    R2: { sim: "R₂", nombre: "resistencia fija del multiplicador", unidad: Ω, valor: 1000 }
    pu: { tipo: interruptor, nombre: "multiplicador puenteado", valor: 0 }
    Re: { sim: "R_{E}", nombre: "resistencia de emisor", unidad: Ω, valor: 0.22 }
    RL: { sim: "R_{L}", nombre: "altavoz", unidad: Ω, valor: 8 }
    b: { sim: "β", nombre: "ganancia de corriente", unidad: "", valor: 100 }
    bm: { sim: "β_{3}", nombre: "ganancia de corriente del multiplicador (sin corriente de base)", unidad: "", valor: 1e9 }
    Vbe: { sim: "V_{BE}", nombre: "caída base-emisor", unidad: V, valor: 0.6 }
    A: { sim: "A", nombre: "amplitud de la señal del driver", unidad: V, valor: 1 }
    f: { sim: "f", nombre: "frecuencia de la señal", unidad: Hz, valor: 1000 }
  calculos:
    Vbb: { expr: "(1 - pu)*Vbe*(1 + R1/R2)", sim: "V_{BB}", nombre: "tensión entre las bases", unidad: V }
    Ie: { expr: "max(0, (Vbb - 2*Vbe)/(2*Re))", sim: "I_{E}", nombre: "corriente de reposo de emisor", unidad: A }
    Iq: { expr: "b/(b + 1)*Ie", sim: "I_{Q}", nombre: "corriente de reposo", unidad: A }
    Ir: { expr: "max(Iq, 0.01)", sim: "I_{ref}", nombre: "corriente de referencia de V_BE", unidad: A }
    Vin: { expr: "-Vbb/2", sim: "V_{driver}", nombre: "nivel del driver", unidad: V }
    k: { expr: "Re/RL", sim: "k", nombre: "R_E/R_L", unidad: "" }
    sab: { expr: "ceil(max(0, Vbb - 2*Vbe)/1e9)", sim: "AB", nombre: "las dos ramas conducen en reposo", unidad: "" }
    Vo0: { expr: "0*Vbb", sim: "v_{o}", nombre: "continua de la salida en reposo", unidad: V }

tarjetas:
  - id: explore-etapa
    tipo: tocar
    titulo: "La etapa que entrega la potencia"
    texto: "Tiene que dar corriente a un altavoz de pocos ohmios. En clase B, ningún transistor conduce en la zona de ±0,6 V: toque lo que quita ese hueco."
    libro: [119, 122, 123, 126, 155]
    widget:
      tipo: figura
      figura: fig-51.7
      zonas:
        - { id: q1, rotulo: "Transistor de arriba", rect: [135, 65, 40, 38] }
        - { id: q2, rotulo: "Transistor de abajo", rect: [135, 180, 40, 38] }
        - { id: re, rotulo: "Resistencias del centro", rect: [140, 106, 45, 68] }
        - { id: bias, rotulo: "Diodos de la izquierda", rect: [85, 95, 40, 55] }
        - { id: driver, rotulo: "Transistor de la izquierda, abajo", rect: [78, 208, 40, 38] }
        - { id: altavoz, rotulo: "A la derecha", rect: [245, 130, 40, 38] }
    tocar:
      bien: [bias]
      porque:
        q1: "Q₁, NPN, da el semiciclo positivo; sin polarización, también tiene el hueco."
        q2: "Q₂, PNP, da el negativo, con el mismo hueco."
        re: "Las R_{E} estabilizan la corriente de reposo, pero no la crean."
        driver: "Q₃, el driver, da la ganancia de tensión."
        altavoz: "El altavoz de 8 Ω es la carga."
    exito: "La polarización entre las bases: una corriente de reposo pequeña en los dos y el hueco del cruce desaparece. Es la clase AB."
    escalera:
      - "Algo tiene que separar las dos bases unos voltios."
    solucion: "Los diodos con su fuente de corriente, entre las bases."

  - id: explore-seguidor
    tipo: explorar
    titulo: "Clase B y clase AB"
    texto: "Con el multiplicador puenteado, la etapa es de clase B. Quite el puente y ajuste R₁ hasta una corriente de reposo pequeña que borre el hueco."
    libro: [121, 122, 123, 124, 130]
    inicio: { pu: 1, R1: 1200 }
    widget:
      tipo: circuito
      esquema: etapa-clase-ab
      piezas: { vcc: Vcc, entrada: Vin, amplitud: A, f: f, ib: Ib, r1: R1, r2: R2, puente: pu, re: Re, carga: RL, beta: b, vbe: Vbe, iref: Ir, betam: bm }
      lectura: { valor: Iq, rotulo: "Corriente de reposo" }
      corriente: Iq
      mide: { iq: Iq, vbb: Vbb }
      grafica:
        x: { id: t, min: 0, max: 0.002, unidad: s, rotulo: "t" }
        y: { min: -4.5, max: 4.5, unidad: V, rotulo: "v" }
        curvas:
          - { expr: "A*sin(2*pi*f*t)", color: tinta, rotulo: "señal del driver", discontinua: true }
          - { expr: "sab*max((A*sin(2*pi*f*t) - Vbb/2 + Vbe)/(1 + k), min((A*sin(2*pi*f*t) + Vbb/2 - Vbe)/(1 + k), (2*A*sin(2*pi*f*t))/(2 + k))) + (1 - sab)*(max((A*sin(2*pi*f*t) + Vbb/2 - Vbe)/(1 + k), 0) + min((A*sin(2*pi*f*t) - Vbb/2 + Vbe)/(1 + k), 0))", color: naranja, rotulo: "salida", mide: salida }
      mandos:
        - { valor: pu, tipo: interruptor, rotulo: "Multiplicador puenteado (clase B)" }
        - { valor: R1, lista: [1037, 1100, 1200], rotulo: "R₁ del multiplicador" }
        - { valor: A, lista: [1, 2, 4], rotulo: "Amplitud de la señal" }
    objetivo:
      condiciones:
        - { valor: pu, max: 0, rotulo: "Sin puente" }
        - { valor: Iq, min: 0.02, max: 0.055, rotulo: "Reposo: {{Iq}}" }
      logrado: "{{Iq}} de reposo: los dos conducen alrededor del cero y el hueco desaparece, con casi todo el rendimiento de la B. Es el ajuste más delicado."
      pistas:
        - { cuando: { valor: Iq, mayor: 0.055 }, texto: "Demasiada corriente de reposo: se acerca a la clase A, que disipa en reposo." }
        - { texto: "Quite el puente; si sobra corriente, baje R₁." }
    escalera:
      - "V_{BB} = V_{BE} · (1 + R₁/R₂): un poco más de dos V_{BE}."
    solucion: "Sin puente y el R₁ más bajo: unos 50 mA."
    comprobar:
      - { con: { pu: 0, R1: 1037 }, Iq: 0.04995, Vbb: 1.2222, tol: 0.002 }
      - { con: { pu: 0, R1: 1200 }, Iq: 0.27, tol: 0.002 }

  - id: pregunta-ganancia
    tipo: tocar
    titulo: "El seguidor complementario"
    texto: "Q₁ y Q₂ son seguidores de emisor: copian la tensión y dan corriente. Toque quién aporta la ganancia de tensión."
    libro: [126, 128, 129, 133, 134, 135]
    widget:
      tipo: figura
      figura: fig-51.7
      zonas:
        - { id: q1, rotulo: "Transistor de arriba", rect: [135, 65, 40, 38] }
        - { id: q2, rotulo: "Transistor de abajo", rect: [135, 180, 40, 38] }
        - { id: re, rotulo: "Resistencias del centro", rect: [140, 106, 45, 68] }
        - { id: bias, rotulo: "Diodos de la izquierda", rect: [85, 95, 40, 55] }
        - { id: driver, rotulo: "Transistor de la izquierda, abajo", rect: [78, 208, 40, 38] }
        - { id: altavoz, rotulo: "A la derecha", rect: [245, 130, 40, 38] }
    tocar:
      bien: [driver]
      porque:
        q1: "Q₁ es un seguidor: ganancia de casi uno."
        q2: "Q₂ es el otro seguidor."
        re: "Las R_{E} estabilizan y permiten medir el reposo; no dan ganancia."
        bias: "La polarización quita el cruce, no amplifica."
        altavoz: "El altavoz es la carga."
    exito: "El driver. Con β modesta tendría que dar mucha corriente de base: Darlington (1,4 V), Sziklai (una caída, mejor linealidad) o cuasicomplementaria (dos del mismo tipo)."
    escalera:
      - "¿Cuánta ganancia de tensión tiene un seguidor de emisor?"
    solucion: "Q₃, el driver."

  - id: porque-simetrica
    tipo: porque
    titulo: "Alimentación doble"
    texto: "Un ejercicio del capítulo: ¿por qué la etapa necesita ±V y no una sola tensión positiva?"
    libro: ["cap51#377"]
    widget:
      tipo: figura
      figura: fig-51.7
      zonas:
        - { id: q2, rotulo: "Transistor de abajo", rect: [135, 180, 40, 38] }
    opciones:
      - texto: "El PNP lleva la salida por debajo de cero en el semiciclo negativo"
        bien: true
        porque: "Para que la onda baje de cero hace falta un raíl negativo; con uno solo, un condensador grande o un punto medio."
      - texto: "Para doblar la potencia"
        porque: "La potencia la fija el pico sobre la carga; la doble alimentación es para que la salida pase por cero."
      - texto: "Porque el NPN lo necesita para encender"
        porque: "El NPN trabaja con el raíl positivo; el negativo es el del PNP."
    escalera:
      - "El audio sube y baja alrededor de cero. ¿De dónde sale la corriente del semiciclo negativo?"
    solucion: "Un raíl positivo para el NPN y otro negativo para el PNP: la salida oscila alrededor de cero."

  - id: empareje-re
    tipo: elegir
    titulo: "Las resistencias de emisor"
    texto: "Unos 0,1 a 0,47 Ω en serie con cada emisor. Toque la pieza cuya caída permite medir la corriente de reposo."
    libro: [137, 138, 139, 140, 141]
    fijar: { pu: 0, R1: 1037 }
    widget:
      tipo: circuito
      esquema: etapa-clase-ab
      piezas: { vcc: Vcc, entrada: Vin, amplitud: A, f: f, ib: Ib, r1: R1, r2: R2, puente: pu, re: Re, carga: RL, beta: b, vbe: Vbe, iref: Ir, betam: bm }
      corriente: Iq
      mide: { iq: Iq, vbb: Vbb }
      mandos: []
    elegir:
      zonas: [re, r1, r2, ib, carga]
      bien: [re]
      porque:
        r1: "R₁ ajusta la tensión entre las bases; no la recorre la corriente de reposo."
        r2: "R₂ fija la corriente del multiplicador, no la de reposo."
        ib: "La fuente de bias alimenta el multiplicador y la base de Q₁."
        carga: "En reposo, por el altavoz no debe pasar nada."
    exito: "R_{E}: su caída dice la corriente. Además estabiliza térmicamente y reparte entre transistores en paralelo; a cambio disipa, baja algo el rendimiento y sube la impedancia de salida."
    escalera:
      - "Por la ley de Ohm, la caída de una resistencia dice la corriente que pasa."
    solucion: "La resistencia de emisor."

  - id: empareje-protecciones
    tipo: pregunta
    fase: "Empareje"
    titulo: "Las protecciones imprescindibles"
    texto: "Una etapa de potencia sin protección se destruye a la primera. Una cada protección con lo que evita."
    libro: [144, 145, 146, 147]
    emparejar:
      - ["Limitación de corriente", "La salida en cortocircuito"]
      - ["Diodos de recuperación", "La fuerza contraelectromotriz del altavoz"]
      - ["Red Zobel", "La inestabilidad por la inductancia de la bobina"]
      - ["Protección de continua", "Un transistor en corto que quema el altavoz"]
    exito: "Con el retardo de conexión, cinco protecciones que no son opcionales."
    pistas:
      - { texto: "La Zobel es una resistencia y un condensador en serie, de la salida a masa." }
    escalera:
      - "El altavoz es una carga inductiva: dos de ellas vienen de ahí."
    solucion: "Limitación–cortocircuito; diodos–contraelectromotriz; Zobel–inductancia; continua–transistor en corto."

  - id: pregunta-seguridad
    tipo: medir
    fase: "En el banco"
    titulo: "Antes de conectar el altavoz"
    texto: "Con el amplificador en reposo, mida la continua en la salida."
    libro: [154, "cap51#14"]
    fijar: { pu: 0, R1: 1037 }
    widget:
      tipo: circuito
      esquema: etapa-clase-ab
      piezas: { vcc: Vcc, entrada: Vin, amplitud: A, f: f, ib: Ib, r1: R1, r2: R2, puente: pu, re: Re, carga: RL, beta: b, vbe: Vbe, iref: Ir, betam: bm }
      corriente: Iq
      mide: { iq: Iq, vbb: Vbb, vo: Vo0 }
      instrumento: { tipo: multimetro, modos: [V], puntos: [vcc, b1, b2, out, "0"] }
      mandos: []
    medir:
      magnitud: tension
      entre: [out, "0"]
      porque:
        "vcc/0": "Eso es el raíl positivo: unos 35 V."
        "b1/0": "Esa es la base del NPN, no la salida."
        "b2/0": "Esa es la base del PNP: el nivel del driver."
        "b1/b2": "Eso es la tensión de bias entre las bases."
    exito: "Milivoltios: con alimentación simétrica, la salida en reposo está en cero. Voltios serían una avería, y el altavoz lo pagaría."
    escalera:
      - "Una punta en la salida, la otra en masa."
    solucion: "Entre la salida y masa: milivoltios."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [123, 128, 137, 147, 153, 154]
    ideas:
      - { titulo: "Clase AB.", texto: "Una corriente de reposo pequeña quita el hueco del cruce con casi todo el rendimiento." }
      - { titulo: "Seguidores.", texto: "Q₁ y Q₂ dan corriente; la ganancia la aporta el driver. Su distorsión, baja a potencia media y creciente cerca del recorte." }
      - { titulo: "R_{E}.", texto: "Unas décimas de ohmio: estabilizan, reparten y miden el reposo." }
      - { titulo: "Protecciones.", texto: "Corriente, contraelectromotriz, Zobel, continua y retardo: no son opcionales." }
