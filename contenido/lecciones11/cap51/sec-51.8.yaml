# Lección 1.2 de la sección 52.8 «Lista de Materiales (BOM)» (cap51; etiqueta sec-51.8). Proyecto detallado III.
# Formato: contenido/lecciones11/GUIA.md. Sección de compras, casi sin cálculo: la figura 52.14 (fig-51.14, el reparto
# del coste y los componentes que deciden) con zonas; el transformador de 25-0-25 V da 25·√2 ≈ 35,4 V de pico (bloque
# 246 de la sección 52.7); el resto, emparejar y opciones.
leccion: cap51/sec-51.8

libro:
  258: "cada elección responde a un cálculo"
  260: "secundario simétrico de unos 25-0-25 V eficaces y al menos 200 VA"
  261: "al menos 10 000 µF por raíl y por canal"
  262: "los falsificados son un problema real"
  263: "debe poder atornillarse al disipador"
  264: "0,22 Ω de al menos 5 W, de hilo"
  265: "dimensionado para el peor caso del 64 %"
  266: "elegido por ruido"
  268: "10 Ω / 2 W y 100 nF en serie, por canal"
  269: "para aislar cargas capacitivas"
  272: "su resistencia afecta al factor de amortiguamiento"
  277: "Caja metálica, que apantalla y hace de masa de referencia"
  279: "Separación entre el transformador y la etapa de entrada"
  280: "Cable de masa en estrella, con un solo punto de unión"
  282: "Por especificación: transformador, condensadores de filtro, transistores de salida, disipador"
  283: "Por precio: pasivos de señal, resistencias, conectores comunes"
  284: "suelen superar al resto de la electrónica junta"
  287: "un solo canal de 20 W reduce el transformador, el disipador y la caja"
  288: "Reparto del coste de un amplificador"
  "cap51#246": "25 × √2 ≈ 35,4 V, menos el puente"

modelo:
  valores:
    V_s: { sim: "V_{ef}", nombre: "tensión eficaz de cada mitad del secundario", unidad: V, valor: 25 }
  calculos:
    V_pk: { expr: "V_s*sqrt(2)", sim: "V_{pico}", nombre: "pico del secundario", unidad: V }

tarjetas:
  - id: explore-componentes
    tipo: explorar
    titulo: "Los componentes que deciden"
    texto: "Cada elección responde a un cálculo de las secciones anteriores. Toque cada componente."
    libro: [258, 260, 261, 262, 263, 288]
    widget:
      tipo: figura
      figura: fig-51.14
      zonas:
        - { id: trafo, rotulo: "Primer recuadro", rect: [194, 28, 256, 42], texto: "Transformador de 25-0-25 V y al menos 200 VA, toroidal y lejos de la entrada." }
        - { id: condensadores, rotulo: "Segundo recuadro", rect: [194, 74, 256, 38], texto: "Al menos 10 000 µF por raíl y por canal: no solo filtran, entregan los picos." }
        - { id: transistores, rotulo: "Tercer recuadro", rect: [194, 118, 256, 42], texto: "Transistores de salida complementarios, de al menos 100 W y SOA amplio; cuidado con los falsificados." }
        - { id: multiplicador, rotulo: "Cuarto recuadro", rect: [194, 162, 256, 35], texto: "El transistor del multiplicador de V_{BE}: debe poder atornillarse al disipador." }
    requiere: { mover: [trafo, condensadores, transistores, multiplicador] }

  - id: estime-railes
    tipo: pregunta
    fase: "Estime"
    titulo: "Del transformador a los raíles"
    texto: "Cada mitad del secundario da 25 V eficaces. Rectificada y filtrada, ¿a qué tensión de pico llega en vacío?"
    libro: [260, "cap51#246"]
    estimar:
      objetivo: "V_pk"
      unidad: V
      min: 0
      max: 50
      paso: 0.1
      inicio: 45
      tol: 0.03
      rotulo: "Pico en vacío"
    exito: "Unos 35,4 V, menos el puente: los ±35 V del proyecto, que bajan con carga."
    pistas:
      - { cuando: { valor: estimacion, mayor: 36.5 }, texto: "Se ha pasado: el pico es √2 veces el eficaz." }
      - { texto: "Se ha quedado corto: el condensador se carga al pico, √2 veces los 25 V eficaces." }
    escalera:
      - "Pico = eficaz × √2."
    solucion: "25 × √2 ≈ 35,4 V."
    comprobar:
      - { V_pk: 35.4, tol: 0.005 }

  - id: porque-toroidal
    tipo: porque
    titulo: "Dónde va el transformador"
    texto: "¿Por qué el transformador se elige toroidal y se monta lejos de la entrada?"
    libro: [260, 279]
    widget:
      tipo: figura
      figura: fig-51.14
      zonas:
        - { id: trafo, rotulo: "Primer recuadro", rect: [194, 28, 256, 42] }
    opciones:
      - texto: "Su campo disperso es la causa número uno de zumbido"
        bien: true
        porque: "La etapa de entrada maneja la señal más pequeña: cualquier campo cercano se le suma."
      - texto: "Para que no se caliente"
        porque: "El calor no es la razón: lo que molesta es su campo magnético disperso."
      - texto: "Porque pesa mucho"
        porque: "Pesa, pero la razón de la distancia es el zumbido que induce."
    escalera:
      - "¿Qué problema es el número uno de los amplificadores caseros?"
    solucion: "Su campo disperso causa zumbido en la entrada."

  - id: empareje-olvidos
    tipo: pregunta
    fase: "Empareje"
    titulo: "Lo que se olvida"
    texto: "Una cada componente olvidadizo con su papel."
    libro: [268, 269, 272]
    emparejar:
      - ["Red Zobel", "10 Ω / 2 W y 100 nF en serie, por canal"]
      - ["Bobina de salida", "Aislar cargas capacitivas"]
      - ["Conectores de altavoz de calidad", "Su resistencia afecta al factor de amortiguamiento"]
      - ["Relé de retardo", "Conectar el altavoz tras el arranque"]
    exito: "Ninguno sale en el esquema principal, y todos se notan."
    pistas:
      - { texto: "La Zobel es la misma idea que la red de Boucherot del LM386." }
    escalera:
      - "Dos protegen la estabilidad, uno el altavoz al encender y otro el amortiguamiento."
    solucion: "Zobel–10 Ω y 100 nF; bobina–cargas capacitivas; conectores–amortiguamiento; relé–retardo."

  - id: empareje-caja
    tipo: pregunta
    fase: "Empareje"
    titulo: "La caja y el cableado"
    texto: "En este proyecto son la mitad del trabajo. Una cada decisión con su razón."
    libro: [277, 279, 280]
    emparejar:
      - ["Caja metálica", "Apantalla y hace de masa de referencia"]
      - ["Transformador lejos de la entrada", "Menos zumbido inducido"]
      - ["Masa en estrella", "Un solo punto de unión"]
    exito: "El zumbido se decide aquí más que en el esquema."
    pistas:
      - { texto: "Una masa en estrella evita que las corrientes de unas etapas pasen por la masa de otras." }
    escalera:
      - "Todas buscan lo mismo: que nada ajeno se sume a la señal pequeña."
    solucion: "Metálica–apantalla; transformador lejos–zumbido; estrella–un punto."

  - id: pregunta-re
    tipo: pregunta
    titulo: "Las resistencias de emisor"
    texto: "¿Qué piden las resistencias de emisor de la lista?"
    libro: [264]
    widget:
      tipo: figura
      figura: fig-51.14
      zonas:
        - { id: transistores, rotulo: "Tercer recuadro", rect: [194, 118, 256, 42] }
    opciones:
      - texto: "0,22 Ω de al menos 5 W, de hilo y de baja inductancia si es posible"
        bien: true
        porque: "Por ellas pasa toda la corriente del altavoz."
      - texto: "0,22 Ω de un cuarto de vatio"
        porque: "Pasa por ellas toda la corriente de salida: hacen falta vatios."
      - texto: "Decenas de ohmios de precisión"
        porque: "Se comerían la salida: son décimas de ohmio."
    escalera:
      - "¿Qué corriente pasa por una resistencia en serie con el emisor de salida?"
    solucion: "0,22 Ω, al menos 5 W, de hilo."

  - id: pregunta-compra
    tipo: pregunta
    titulo: "Los criterios de compra"
    texto: "¿Qué se compra por especificación y no por precio?"
    libro: [265, 266, 282, 283]
    widget:
      tipo: figura
      figura: fig-51.14
      zonas:
        - { id: condensadores, rotulo: "Segundo recuadro", rect: [194, 74, 256, 38] }
    opciones:
      - texto: "Transformador, condensadores de filtro, transistores de salida y disipador"
        bien: true
        porque: "Son los que fijan potencia, calor y fiabilidad; los pasivos de señal y los conectores comunes, por precio."
      - texto: "Resistencias y pasivos de señal"
        porque: "Esos se compran por precio: cualquiera de su valor sirve."
      - texto: "Los conectores comunes"
        porque: "Por precio; los de altavoz, en cambio, de calidad."
    escalera:
      - "¿Qué componentes vienen de un cálculo de potencia o de calor?"
    solucion: "Transformador, filtro, transistores de salida y disipador."

  - id: prediga-coste
    tipo: predecir
    titulo: "Lo que más cuesta"
    texto: "En un amplificador de este tipo, ¿qué suele costar más?"
    libro: [284, 288]
    widget:
      tipo: figura
      figura: fig-51.14
      zonas:
        - { id: tarta, rotulo: "La tarta de la izquierda", rect: [40, 65, 105, 105] }
    opciones:
      - texto: "La caja, el transformador y el disipador, más que toda la electrónica junta"
        bien: true
        porque: "Es la observación que sorprende: lo que no es «electrónica» es lo caro."
      - texto: "Los transistores de salida"
        porque: "Son importantes, pero entran en la electrónica, que es la parte menor."
      - texto: "El preamplificador"
        porque: "Un operacional y unos pasivos: de lo más barato de la lista."
    escalera:
      - "Mire la tarta: ¿qué porciones no son electrónica?"
    solucion: "Caja, transformador y disipador superan al resto."

  - id: pregunta-un-canal
    tipo: pregunta
    titulo: "La decisión previa"
    texto: "Con la lista delante, ¿por qué empezar por un solo canal de 20 W?"
    libro: [287]
    widget:
      tipo: figura
      figura: fig-51.14
      zonas:
        - { id: tarta, rotulo: "La tarta de la izquierda", rect: [40, 65, 105, 105] }
    opciones:
      - texto: "Reduce transformador, disipador y caja, y se puede duplicar después"
        bien: true
        porque: "Justo las partes caras: enseña lo mismo por una fracción."
      - texto: "Porque 20 W suenan mejor"
        porque: "No es cuestión de sonido: es de coste y tamaño."
      - texto: "Porque dos canales no se pueden alimentar"
        porque: "Se pueden; un canal es para aprender barato y duplicar después."
    escalera:
      - "¿Qué partes de la tarta dependen de la potencia?"
    solucion: "Reduce lo caro (transformador, disipador, caja) y se duplica luego."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [260, 261, 268, 284]
    ideas:
      - { titulo: "Lo que decide.", texto: "Transformador 25-0-25 V y 200 VA, 10 000 µF por raíl y canal, salida de 100 W con SOA amplio." }
      - { titulo: "Lo que se olvida.", texto: "Zobel, bobina de salida, relé, desacoplo y buenos conectores." }
      - { titulo: "Caja y masas.", texto: "Metálica, transformador lejos de la entrada, masa en estrella." }
      - { titulo: "El coste.", texto: "Caja, transformador y disipador superan a la electrónica." }
