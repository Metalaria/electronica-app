# Lección 1.2 de la sección 52.8 «Lista de Materiales (BOM)» (cap51; etiqueta sec-51.8). Proyecto detallado III.
# Formato: contenido/lecciones11/GUIA.md. Sección de compras, casi sin cálculo: la figura 52.14 (fig-51.14, el reparto
# del coste y los componentes que deciden) con zonas; el transformador de 25-0-25 V da 25·√2 ≈ 35,4 V de pico (bloque
# 246 de la sección 52.7); el resto, emparejar y opciones.
# 1.2.1 (autor121-ana, «aprender haciendo», GUIA §13): sección de compras. Los componentes (el que va al disipador,
# el del zumbido y los que se compran por especificación) y las porciones caras de la tarta se tocan en la figura
# 52.15; el pico del secundario se predice. La caja y el canal de 20 W pasan al resumen y al éxito de la tarta;
# quedan los olvidos (emparejar) y las resistencias de emisor (opciones).
leccion: cap51/sec-51.8

libro:
  258: "cada elección responde a un cálculo"
  260: "secundario simétrico de unos 25-0-25 V eficaces y al menos 200 VA"
  261: "al menos 10 000 µF por raíl y por canal"
  262: "los falsificados son un problema real"
  263: "debe poder atornillarse al disipador"
  264: "0,22 Ω de al menos 5 W, de hilo"
  265: "dimensionado para el peor caso del 64 %"
  266: "elegido por ruido"
  268: "10 Ω / 2 W y 100 nF en serie, por canal"
  269: "para aislar cargas capacitivas"
  272: "su resistencia afecta al factor de amortiguamiento"
  277: "Caja metálica, que apantalla y hace de masa de referencia"
  279: "Separación entre el transformador y la etapa de entrada"
  280: "Cable de masa en estrella, con un solo punto de unión"
  282: "Por especificación: transformador, condensadores de filtro, transistores de salida, disipador"
  283: "Por precio: pasivos de señal, resistencias, conectores comunes"
  284: "suelen superar al resto de la electrónica junta"
  287: "un solo canal de 20 W reduce el transformador, el disipador y la caja"
  288: "Reparto del coste de un amplificador"
  "cap51#246": "25 × √2 ≈ 35,4 V, menos el puente"

modelo:
  valores:
    V_s: { sim: "V_{ef}", nombre: "tensión eficaz de cada mitad del secundario", unidad: V, valor: 25 }
  calculos:
    V_pk: { expr: "V_s*sqrt(2)", sim: "V_{pico}", nombre: "pico del secundario", unidad: V }

tarjetas:
  - id: explore-componentes
    tipo: tocar
    titulo: "Los componentes que deciden"
    texto: "Cada elección responde a un cálculo de las secciones anteriores. Toque el que se elige para poder atornillarlo al disipador."
    libro: [258, 260, 261, 262, 263, 288]
    widget:
      tipo: figura
      figura: fig-51.14
      zonas:
        - { id: trafo, rotulo: "Primer recuadro", rect: [194, 28, 256, 42] }
        - { id: condensadores, rotulo: "Segundo recuadro", rect: [194, 74, 256, 38] }
        - { id: transistores, rotulo: "Tercer recuadro", rect: [194, 118, 256, 42] }
        - { id: multiplicador, rotulo: "Cuarto recuadro", rect: [194, 162, 256, 35] }
    tocar:
      bien: [multiplicador]
      porque:
        trafo: "El transformador se elige por tensión y potencia: 25-0-25 V y al menos 200 VA."
        condensadores: "Los condensadores, por capacidad: al menos 10 000 µF por raíl y por canal."
        transistores: "Los de salida van al disipador, pero se eligen por potencia y SOA; cuidado con los falsificados."
    exito: "El transistor del multiplicador de V_{BE}: su V_{BE} tiene que seguir la temperatura de los de salida."
    escalera:
      - "¿Cuál tiene que sentir la temperatura de los transistores de salida?"
    solucion: "El cuarto: el transistor del multiplicador."

  - id: estime-railes
    tipo: explorar
    titulo: "Del transformador a los raíles"
    texto: "Rectificado y filtrado, cada raíl llega en vacío al pico de su mitad del secundario. Elija el secundario que da los ±35 V del proyecto."
    libro: [260, "cap51#246"]
    inicio: { V_s: 15 }
    widget:
      tipo: grafica
      x: { id: t, min: 0, max: 0.04, unidad: s, rotulo: "t" }
      y: { min: -50, max: 50, unidad: V, rotulo: "v" }
      curvas:
        - { expr: "V_s*sqrt(2)*sin(2*pi*50*t)", color: azul, rotulo: "media secundaria" }
      marcas:
        - { x: "0.005", y: "V_pk", rotulo: "{{V_pk}}" }
      lectura: { valor: V_pk, rotulo: "Pico en vacío" }
      mandos:
        - { valor: V_s, lista: [15, 25, 30], rotulo: "Secundario, V eficaces por mitad" }
    objetivo:
      condiciones:
        - { valor: V_pk, objetivo: 35.4, tol: 0.02, rotulo: "Pico: {{V_pk}}" }
      logrado: "{{V_s}} eficaces dan {{V_pk}} de pico, menos el puente: los ±35 V del proyecto, que bajan con carga. Un 25-0-25 V de al menos 200 VA."
      pistas:
        - { texto: "El pico es √2 veces el eficaz." }
    escalera:
      - "Pico = eficaz × √2."
    solucion: "25 V eficaces: 25 × √2 ≈ 35,4 V."
    comprobar:
      - { con: { V_s: 25 }, V_pk: 35.4, tol: 0.005 }

  - id: porque-toroidal
    tipo: tocar
    titulo: "Dónde va el transformador"
    texto: "El zumbido es el problema número uno. Toque el componente que lo causa si se monta cerca de la entrada."
    libro: [260, 279]
    widget:
      tipo: figura
      figura: fig-51.14
      zonas:
        - { id: trafo, rotulo: "Primer recuadro", rect: [194, 28, 256, 42] }
        - { id: condensadores, rotulo: "Segundo recuadro", rect: [194, 74, 256, 38] }
        - { id: transistores, rotulo: "Tercer recuadro", rect: [194, 118, 256, 42] }
        - { id: multiplicador, rotulo: "Cuarto recuadro", rect: [194, 162, 256, 35] }
    tocar:
      bien: [trafo]
      porque:
        condensadores: "Los condensadores de filtro no radian campo."
        transistores: "Los de salida van en el disipador; el campo que molesta es otro."
        multiplicador: "El multiplicador va en el disipador y no radia."
    exito: "El transformador: su campo disperso es la causa número uno de zumbido. Por eso toroidal y lejos de la etapa de entrada, que maneja la señal más pequeña."
    escalera:
      - "¿Qué componente tiene un campo magnético grande?"
    solucion: "El transformador."

  - id: empareje-olvidos
    tipo: pregunta
    fase: "Empareje"
    titulo: "Lo que se olvida"
    texto: "Una cada componente olvidadizo con su papel."
    libro: [268, 269, 272]
    emparejar:
      - ["Red Zobel", "10 Ω / 2 W y 100 nF en serie, por canal"]
      - ["Bobina de salida", "Aislar cargas capacitivas"]
      - ["Conectores de altavoz de calidad", "Su resistencia afecta al factor de amortiguamiento"]
      - ["Relé de retardo", "Conectar el altavoz tras el arranque"]
    exito: "Ninguno sale en el esquema principal, y todos se notan."
    pistas:
      - { texto: "La Zobel es la misma idea que la red de Boucherot del LM386." }
    escalera:
      - "Dos protegen la estabilidad, uno el altavoz al encender y otro el amortiguamiento."
    solucion: "Zobel–10 Ω y 100 nF; bobina–cargas capacitivas; conectores–amortiguamiento; relé–retardo."

  - id: pregunta-re
    tipo: pregunta
    titulo: "Las resistencias de emisor"
    texto: "¿Qué piden las resistencias de emisor de la lista?"
    libro: [264]
    widget:
      tipo: figura
      figura: fig-51.14
      zonas:
        - { id: transistores, rotulo: "Tercer recuadro", rect: [194, 118, 256, 42] }
    opciones:
      - texto: "0,22 Ω de al menos 5 W, de hilo y de baja inductancia si es posible"
        bien: true
        porque: "Por ellas pasa toda la corriente del altavoz."
      - texto: "0,22 Ω de un cuarto de vatio"
        porque: "Pasa por ellas toda la corriente de salida: hacen falta vatios."
      - texto: "Decenas de ohmios de precisión"
        porque: "Se comerían la salida: son décimas de ohmio."
    escalera:
      - "¿Qué corriente pasa por una resistencia en serie con el emisor de salida?"
    solucion: "0,22 Ω, al menos 5 W, de hilo."

  - id: pregunta-compra
    tipo: tocar
    titulo: "Los criterios de compra"
    texto: "Unos se compran por especificación y otros por precio. Toque todos los de la lista que van por especificación."
    libro: [265, 266, 282, 283]
    widget:
      tipo: figura
      figura: fig-51.14
      zonas:
        - { id: trafo, rotulo: "Primer recuadro", rect: [194, 28, 256, 42] }
        - { id: condensadores, rotulo: "Segundo recuadro", rect: [194, 74, 256, 38] }
        - { id: transistores, rotulo: "Tercer recuadro", rect: [194, 118, 256, 42] }
        - { id: multiplicador, rotulo: "Cuarto recuadro", rect: [194, 162, 256, 35] }
    tocar:
      bien: [trafo, condensadores, transistores]
      todas: true
      porque:
        multiplicador: "Es un transistor de señal: basta con que pueda atornillarse al disipador."
    exito: "Transformador, condensadores de filtro y transistores de salida, con el disipador para el peor caso del 64 %: fijan potencia, calor y fiabilidad. Los pasivos de señal y los conectores comunes, por precio."
    escalera:
      - "¿Qué componentes vienen de un cálculo de potencia o de calor?"
    solucion: "Los tres primeros recuadros."

  - id: prediga-coste
    tipo: tocar
    titulo: "Lo que más cuesta"
    texto: "Toque en la tarta las tres partes que, juntas, cuestan más que toda la electrónica."
    libro: [284, 287, 288]
    widget:
      tipo: figura
      figura: fig-51.14
      zonas:
        - { id: electronica, rotulo: "Porción de arriba a la izquierda", rect: [47, 72, 42, 42] }
        - { id: caja, rotulo: "Porción de arriba a la derecha", rect: [93, 72, 42, 42] }
        - { id: disipador, rotulo: "Porción de abajo a la izquierda", rect: [44, 118, 36, 36] }
        - { id: transformador, rotulo: "Porción de abajo a la derecha", rect: [82, 120, 48, 36] }
    tocar:
      bien: [caja, transformador, disipador]
      todas: true
      porque:
        electronica: "Esa es la electrónica: la parte menor."
    exito: "Caja, transformador y disipador: lo que no es «electrónica» es lo caro. Por eso un solo canal de 20 W, que los reduce, enseña lo mismo por una fracción y se duplica después."
    escalera:
      - "¿Qué porciones no son electrónica?"
    solucion: "Caja y mecánica, transformador y disipador."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [260, 261, 268, 277, 280, 284]
    ideas:
      - { titulo: "Lo que decide.", texto: "Transformador 25-0-25 V y 200 VA, 10 000 µF por raíl y canal, salida de 100 W con SOA amplio." }
      - { titulo: "Lo que se olvida.", texto: "Zobel, bobina de salida, relé, desacoplo y buenos conectores." }
      - { titulo: "Caja y masas.", texto: "Metálica, transformador lejos de la entrada, masa en estrella." }
      - { titulo: "El coste.", texto: "Caja, transformador y disipador superan a la electrónica." }
