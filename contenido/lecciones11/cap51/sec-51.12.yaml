# Lección 1.2 de la sección 52.12 «Ampliaciones y Cierre» (cap51; etiqueta sec-51.12). Proyecto detallado III.
# Formato: contenido/lecciones11/GUIA.md. Sección de cierre, sin cálculo: la figura 52.20 (fig-51.18, las cinco
# ampliaciones y la lección general) con zonas; el resto, opciones y emparejar.
leccion: cap51/sec-51.12

libro:
  381: "hay cinco direcciones para ampliarlo"
  383: "Es la ampliación más rentable"
  384: "que es lo que hace útil un vúmetro"
  385: "lo que exige cruzar por cero"
  386: "mucho más rendimiento, menos calor"
  387: "alimentación regulada para el preamplificador"
  390: "Polarización y compensación térmica, con el lazo cerrado físicamente"
  392: "casi todo lo que puede salir mal es medible, y porque sus fallos son audibles"
  394: "Medir lo que importa es distinto de medir lo que es fácil de medir"
  396: "la distorsión a frecuencias altas que no aparece en la especificación a 1 kHz"
  397: "buscar qué parámetro no se ha medido antes de concluir que la medida no sirve"
  400: "En potencia y distorsión, un diseño casero cuidadoso compite"
  401: "Las ampliaciones del amplificador y la lección general"

modelo:
  valores: {}
  calculos: {}

tarjetas:
  - id: explore-ampliaciones
    tipo: explorar
    titulo: "Cinco direcciones"
    texto: "El amplificador básico funciona. Toque cada ampliación y la lección general del proyecto."
    libro: [381, 383, 384, 385, 386, 387, 401]
    widget:
      tipo: figura
      figura: fig-51.18
      zonas:
        - { id: proteccion, rotulo: "Primer recuadro", rect: [3, 20, 264, 50], texto: "Protección del altavoz: continua, retardo y sobretemperatura. La más rentable." }
        - { id: medida, rotulo: "Segundo recuadro", rect: [3, 75, 264, 40], texto: "Medida de potencia: detector de pico o eficaz con escala logarítmica, un vúmetro útil." }
        - { id: digital, rotulo: "Tercer recuadro", rect: [3, 120, 264, 40], texto: "Control digital: volumen con memoria y mando; el atenuador debe conmutar cruzando por cero." }
        - { id: clase-d, rotulo: "Cuarto recuadro", rect: [3, 164, 264, 41], texto: "Clase D como comparación: más rendimiento, menos calor y los problemas de la conmutación." }
        - { id: alimentacion, rotulo: "Quinto recuadro", rect: [3, 210, 264, 40], texto: "Alimentación mejorada: más capacidad, Schottky, preamplificador regulado." }
        - { id: leccion, rotulo: "El recuadro de la derecha", rect: [275, 19, 175, 231], texto: "Todo es medible y audible; las cifras no lo son todo; medir lo que importa." }
    requiere: { mover: [proteccion, digital, leccion] }

  - id: pregunta-rentable
    tipo: pregunta
    titulo: "La ampliación más rentable"
    texto: "De las cinco ampliaciones, ¿cuál rinde más por lo que cuesta?"
    libro: [383]
    widget:
      tipo: figura
      figura: fig-51.18
      zonas:
        - { id: proteccion, rotulo: "Primer recuadro", rect: [3, 20, 264, 50] }
    opciones:
      - texto: "La protección electrónica del altavoz"
        bien: true
        porque: "Protege lo que a menudo es más caro que el amplificador."
      - texto: "El control digital"
        porque: "Es cómodo, pero no salva nada caro si algo falla."
      - texto: "La etapa clase D"
        porque: "Es una comparación instructiva, no una protección."
    escalera:
      - "¿Qué suele costar más que el propio amplificador?"
    solucion: "La protección del altavoz."

  - id: porque-cruce-cero
    tipo: porque
    titulo: "Un atenuador digital"
    texto: "Un volumen por atenuador conmutado debe cambiar de paso cruzando por cero. ¿Por qué?"
    libro: [385]
    widget:
      tipo: figura
      figura: fig-51.18
      zonas:
        - { id: digital, rotulo: "Tercer recuadro", rect: [3, 120, 264, 40] }
    opciones:
      - texto: "Para conmutar sin ruido: en el cero el salto de nivel no produce chasquido"
        bien: true
        porque: "Conmutar con la señal en un pico daría un escalón brusco, audible como un clic."
      - texto: "Para ahorrar energía"
        porque: "La razón es acústica: evitar el chasquido."
      - texto: "Porque el atenuador no funciona con señal"
        porque: "Funciona; el problema es el salto al conmutar fuera del cero."
    escalera:
      - "¿Qué pasa si se cambia la ganancia de golpe en el pico de la señal?"
    solucion: "Para conmutar sin ruido, sin escalón en la señal."

  - id: pregunta-medible
    tipo: pregunta
    titulo: "La lección general"
    texto: "¿Por qué un amplificador de audio es un ejercicio excelente?"
    libro: [392]
    widget:
      tipo: figura
      figura: fig-51.18
      zonas:
        - { id: leccion, rotulo: "El recuadro de la derecha", rect: [275, 19, 175, 231] }
    opciones:
      - texto: "Casi todo lo que sale mal es medible, y sus fallos son audibles"
        bien: true
        porque: "El cruce y el zumbido se oyen, la oscilación calienta, el margen de fase se ve en un escalón."
      - texto: "Porque es el proyecto más barato"
        porque: "No lo es: caja, transformador y disipador cuestan."
      - texto: "Porque no necesita medidas"
        porque: "Al contrario: todo se puede medir, y conviene hacerlo."
    escalera:
      - "¿Qué tienen en común el cruce, el zumbido y la oscilación?"
    solucion: "Todo es medible y audible: teoría y percepción coinciden."

  - id: prediga-cifras
    tipo: predecir
    titulo: "Las cifras no lo son todo"
    texto: "Un amplificador con THD del 0,001 % y margen de fase escaso, frente a otro del 0,01 % con buen margen. ¿Cuál suena mejor con música real?"
    libro: [394]
    widget:
      tipo: figura
      figura: fig-51.18
      zonas:
        - { id: leccion, rotulo: "El recuadro de la derecha", rect: [275, 19, 175, 231] }
    opciones:
      - texto: "Puede que el de 0,01 % con buen margen"
        bien: true
        porque: "La THD es fácil de medir; los transitorios dependen del margen de fase."
      - texto: "El de 0,001 %, siempre"
        porque: "Su THD es mejor, pero con poco margen sobreoscila ante señales rápidas."
      - texto: "Ninguno: los dos son inaudibles"
        porque: "Las dos THD son inaudibles, pero el comportamiento ante transitorios no."
    escalera:
      - "¿Qué cifra dice cómo responde ante un transitorio?"
    solucion: "Puede sonar mejor el de buen margen: medir lo que importa."

  - id: pregunta-debate
    tipo: pregunta
    titulo: "El debate, con honestidad"
    texto: "Algo se percibe y no se mide. ¿Cuál es la postura defendible?"
    libro: [396, 397]
    widget:
      tipo: figura
      figura: fig-51.18
      zonas:
        - { id: leccion, rotulo: "El recuadro de la derecha", rect: [275, 19, 175, 231] }
    opciones:
      - texto: "Buscar qué parámetro no se ha medido antes de concluir que la medida no sirve"
        bien: true
        porque: "Hay efectos con base, como la carga reactiva o la intermodulación, que la especificación a 1 kHz no ve."
      - texto: "Concluir que la medida no sirve"
        porque: "Antes hay que buscar el parámetro que falta por medir."
      - texto: "Concluir que es imaginación"
        porque: "Puede ser un parámetro no medido; hay que buscarlo."
    escalera:
      - "¿Y si la medida que se hizo no era la adecuada?"
    solucion: "Medir, y buscar el parámetro que falta antes de descartar la medida."

  - id: pregunta-comercial
    tipo: pregunta
    titulo: "Frente a uno comercial"
    texto: "Se mide lo mismo en el amplificador construido y en uno comercial. ¿Dónde suele perder el casero?"
    libro: [400]
    widget:
      tipo: figura
      figura: fig-51.18
      zonas:
        - { id: proteccion, rotulo: "Primer recuadro", rect: [3, 20, 264, 50] }
    opciones:
      - texto: "Protecciones, ergonomía, ruido de fondo y ante lo imprevisto"
        bien: true
        porque: "En potencia y distorsión compite; entender en qué pierde y por qué es lo que enseña."
      - texto: "En potencia y distorsión"
        porque: "Ahí un diseño casero cuidadoso compite."
      - texto: "En nada: siempre gana"
        porque: "Pierde en protecciones, ergonomía y ruido de fondo casi siempre."
    escalera:
      - "¿Qué no aparece en el esquema básico?"
    solucion: "Protecciones, ergonomía, ruido de fondo y lo imprevisto."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [383, 390, 392, 394, 397]
    ideas:
      - { titulo: "Ampliar.", texto: "Proteger el altavoz es lo más rentable." }
      - { titulo: "Medible y audible.", texto: "El cruce, el zumbido y la oscilación se oyen y se miden." }
      - { titulo: "Lo que importa.", texto: "Las cifras no lo son todo: el margen de fase pesa más que una THD diminuta." }
      - { titulo: "Honestidad.", texto: "Si se percibe y no se mide, buscar el parámetro que falta." }
