# Lección 1.2 de la sección 52.12 «Ampliaciones y Cierre» (cap51; etiqueta sec-51.12). Proyecto detallado III.
# Formato: contenido/lecciones11/GUIA.md. Sección de cierre, sin cálculo: la figura 52.20 (fig-51.18, las cinco
# ampliaciones y la lección general) con zonas; el resto, opciones y emparejar.
# 1.2.1 (autor121-ana, «aprender haciendo», GUIA §13): la ampliación más rentable se toca en la figura 52.20; el
# atenuador que conmuta en el pico o en el cruce por cero (señal y paso de −6 dB de ejemplo) y el margen de fase frente
# a la THD (escalón de segundo orden normalizado: ζ = 0,42 a 45°, bloque 237 del capítulo 27; ζ = 0,7 de ejemplo) se
# exploran con objetivo. El debate, la comparación con uno comercial y lo medible pasan al resumen; queda una pregunta
# de opciones (lo medible y audible).
leccion: cap51/sec-51.12

libro:
  381: "hay cinco direcciones para ampliarlo"
  383: "Es la ampliación más rentable"
  384: "que es lo que hace útil un vúmetro"
  385: "lo que exige cruzar por cero"
  386: "mucho más rendimiento, menos calor"
  387: "alimentación regulada para el preamplificador"
  390: "Polarización y compensación térmica, con el lazo cerrado físicamente"
  392: "casi todo lo que puede salir mal es medible, y porque sus fallos son audibles"
  394: "Medir lo que importa es distinto de medir lo que es fácil de medir"
  396: "la distorsión a frecuencias altas que no aparece en la especificación a 1 kHz"
  397: "buscar qué parámetro no se ha medido antes de concluir que la medida no sirve"
  400: "En potencia y distorsión, un diseño casero cuidadoso compite"
  401: "Las ampliaciones del amplificador y la lección general"
  "cap27#237": "con 45° el amortiguamiento baja a unos 0,42 y el sobreimpulso ronda el 23 %"

modelo:
  valores:
    f_z: { sim: "f", nombre: "frecuencia de la señal de ejemplo", unidad: Hz, valor: 1000 }
    t_s: { sim: "t_{c}", nombre: "instante del cambio de paso", unidad: s, valor: 0.00025 }
    g_2: { sim: "g", nombre: "ganancia tras el cambio de paso", unidad: "", valor: 0.5 }
    z: { sim: "ζ", nombre: "amortiguamiento del lazo", unidad: "", valor: 0.42 }
  calculos:
    sal: { expr: "100*(1 - g_2)*abs(sin(2*pi*f_z*t_s))", sim: "salto", nombre: "escalón al conmutar, frente a la amplitud", unidad: "%", cifras: 2 }
    so: { expr: "100*exp(-pi*z/sqrt(1 - z^2))", sim: "sobreoscilación", nombre: "sobreoscilación del escalón", unidad: "%", cifras: 2 }

tarjetas:
  - id: explore-ampliaciones
    tipo: tocar
    titulo: "Cinco direcciones"
    texto: "El amplificador básico funciona y hay cinco direcciones para ampliarlo. Toque la que más rinde por lo que cuesta."
    libro: [381, 383, 384, 385, 386, 387, 401]
    widget:
      tipo: figura
      figura: fig-51.18
      zonas:
        - { id: proteccion, rotulo: "Primer recuadro", rect: [3, 20, 264, 50] }
        - { id: medida, rotulo: "Segundo recuadro", rect: [3, 75, 264, 40] }
        - { id: digital, rotulo: "Tercer recuadro", rect: [3, 120, 264, 40] }
        - { id: clase-d, rotulo: "Cuarto recuadro", rect: [3, 164, 264, 41] }
        - { id: alimentacion, rotulo: "Quinto recuadro", rect: [3, 210, 264, 40] }
    tocar:
      bien: [proteccion]
      porque:
        medida: "La medida de potencia hace útil un vúmetro, pero no salva nada caro."
        digital: "El control digital es cómodo: volumen con memoria y mando."
        clase-d: "La clase D es una comparación instructiva: más rendimiento, menos calor."
        alimentacion: "Más capacidad y un preamplificador regulado mejoran, pero no protegen."
    exito: "La protección del altavoz: continua, retardo y sobretemperatura. Protege lo que a menudo cuesta más que el amplificador."
    escalera:
      - "¿Qué suele costar más que el propio amplificador?"
    solucion: "El primero: la protección del altavoz."

  - id: porque-cruce-cero
    tipo: explorar
    titulo: "Un atenuador digital"
    texto: "Un volumen por atenuador conmutado baja un paso. Elija el instante del cambio que no deja escalón en la señal."
    nota: "Señal y paso de ejemplo."
    libro: [385]
    inicio: { t_s: 0.00025 }
    widget:
      tipo: grafica
      x: { id: t, min: 0, max: 0.002, unidad: s, rotulo: "t" }
      y: { min: -1.2, max: 1.2, unidad: V, rotulo: "v" }
      curvas:
        - { expr: "(1 - (1 - g_2)*ceil((t - t_s)/1e9))*sin(2*pi*f_z*t)", color: naranja, rotulo: "salida del atenuador" }
      lectura: { valor: sal, rotulo: "Escalón al conmutar" }
      mandos:
        - { valor: t_s, lista: [0.00025, 0.0005], nombres: ["en un pico", "en el cruce por cero"], rotulo: "Instante del cambio" }
    objetivo:
      condiciones:
        - { valor: sal, max: 1, rotulo: "Escalón: {{sal}}" }
      logrado: "Cruzando por cero, el cambio no deja escalón: sin chasquido. En un pico, el salto brusco se oye como un clic."
      pistas:
        - { texto: "Cambie cuando la señal valga cero." }
    escalera:
      - "¿Qué salto deja cambiar la ganancia cuando la señal vale cero?"
    solucion: "En el cruce por cero."
    comprobar:
      - { sal: 50, tol: 0.001 }
      - { con: { t_s: 0.0005 }, sal: 0, tol: 0.001 }

  - id: pregunta-medible
    tipo: pregunta
    titulo: "La lección general"
    texto: "¿Por qué un amplificador de audio es un ejercicio excelente?"
    libro: [392]
    widget:
      tipo: figura
      figura: fig-51.18
      zonas:
        - { id: leccion, rotulo: "El recuadro de la derecha", rect: [275, 19, 175, 231] }
    opciones:
      - texto: "Casi todo lo que sale mal es medible, y sus fallos son audibles"
        bien: true
        porque: "El cruce y el zumbido se oyen, la oscilación calienta, el margen de fase se ve en un escalón."
      - texto: "Porque es el proyecto más barato"
        porque: "No lo es: caja, transformador y disipador cuestan."
      - texto: "Porque no necesita medidas"
        porque: "Al contrario: todo se puede medir, y conviene hacerlo."
    escalera:
      - "¿Qué tienen en común el cruce, el zumbido y la oscilación?"
    solucion: "Todo es medible y audible: teoría y percepción coinciden."

  - id: prediga-cifras
    tipo: explorar
    titulo: "Las cifras no lo son todo"
    texto: "Uno con THD del 0,001 % y margen de fase escaso, otro del 0,01 % con buen margen: las dos THD son inaudibles. Elija el que apenas sobreoscila ante un escalón."
    libro: [394, "cap27#237"]
    inicio: { z: 0.42 }
    widget:
      tipo: grafica
      x: { id: u, min: 0, max: 15, unidad: "", rotulo: "tiempo (1/ω₀)" }
      y: { min: 0, max: 1.5, unidad: "", rotulo: "salida" }
      curvas:
        - { expr: "1 - exp(-z*u)*(cos(sqrt(1 - z^2)*u) + z/sqrt(1 - z^2)*sin(sqrt(1 - z^2)*u))", color: naranja, rotulo: "escalón" }
      lectura: { valor: so, rotulo: "Sobreoscilación" }
      mandos:
        - { valor: z, lista: [0.42, 0.7], nombres: ["0,001 %, 45° de margen", "0,01 %, buen margen"], rotulo: "Amplificador" }
    objetivo:
      condiciones:
        - { valor: so, max: 5, rotulo: "Sobreoscilación: {{so}}" }
      logrado: "{{so}} frente a un 23 %: el de buen margen se porta mejor con música real, aunque su THD sea diez veces mayor. Medir lo que importa, no lo fácil."
      pistas:
        - { texto: "Mire el margen, no la THD." }
    escalera:
      - "¿Qué cifra dice cómo responde ante un transitorio?"
    solucion: "El de 0,01 % con buen margen."
    comprobar:
      - { so: 23.4, tol: 0.01 }
      - { con: { z: 0.7 }, so: 4.6, tol: 0.01 }

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [383, 390, 392, 394, 396, 397, 400]
    ideas:
      - { titulo: "Ampliar.", texto: "Proteger el altavoz es lo más rentable. Frente a uno comercial, el casero compite en potencia y distorsión y pierde en protecciones y ruido de fondo." }
      - { titulo: "Medible y audible.", texto: "El cruce, el zumbido y la oscilación se oyen y se miden." }
      - { titulo: "Lo que importa.", texto: "Las cifras no lo son todo: el margen de fase pesa más que una THD diminuta." }
      - { titulo: "Honestidad.", texto: "Si se percibe y no se mide, buscar el parámetro que falta." }
