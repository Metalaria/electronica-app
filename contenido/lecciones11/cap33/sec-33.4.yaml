# Lección 1.2 de la sección 33.4 «Topologías Aisladas: Flyback y Forward» (cap33). Formato: GUIA.md.
# - Sección de topologías sin números: la figura 33.4 con zonas (RCD, entrehierro, diodo, bobina de salida, bobinado
#   de desmagnetización y las tres formas de cruzar la barrera) y la foto 33.5 de la fuente del grabador de DVD.
# - Sin paso práctico: no hay un cálculo ni una medida que el lector pueda hacer aquí (el transformador con números
#   es la sección 33.15, sec-33.15).
leccion: cap33/sec-33.4

libro:
  108: "hace falta un transformador"
  110: "funciona como dos bobinas acopladas que almacenan energía"
  111: "El diodo del secundario está en inversa, así que no sale nada"
  112: "toda la energía almacenada pasa al secundario"
  114: "hace falta un entrehierro donde guardar el campo"
  115: "todo lo de menos de unos 100 W"
  116: "Todo flyback lleva un snubber RCD"
  117: "por encima de unos cientos de vatios el flyback deja de ser competitivo"
  119: "una bobina de salida hace el promediado, como en un reductor"
  120: "mayor potencia para el mismo tamaño"
  121: "hay que desmagnetizarlo antes del ciclo siguiente"
  122: "típicamente al 50 % con bobinado de desmagnetización"
  124: "la conducción cruzada"
  126: "el control está en el primario y la señal que hay que medir está en el secundario"
  128: "el diseño debe funcionar con su valor de final de vida"
  129: "su regulación es mediocre porque incluye las caídas y la dispersión"
  130: "un aislador digital para gobernar el interruptor"
  133: "Un transformador que aísla eléctricamente no aísla normativamente"
  135: "la suma de la entrada, la tensión reflejada del secundario y el pico de dispersión"
  136: "Flyback y forward comparados"
  137: "el filtro de entrada de red con su choque de 30 mH"

modelo: { valores: {}, calculos: {} }

tarjetas:
  - id: explore-topologias
    tipo: explorar
    titulo: "Dos maneras de cruzar"
    texto: "Toque las piezas de cada topología: el flyback almacena y entrega; el forward transfiere directamente."
    libro: [108, 110, 114, 116, 119, 121, 136]
    widget:
      tipo: figura
      figura: fig-33.4
      zonas:
        - { id: rcd, rotulo: "Flyback, junto al primario", rect: [36, 36, 40, 58], texto: "El snubber RCD: recoge el pico de la inductancia de dispersión. No es opcional." }
        - { id: entrehierro, rotulo: "Flyback, en el núcleo", rect: [98, 60, 45, 42], texto: "El entrehierro: donde se guarda el campo. Un flyback quiere almacenar energía." }
        - { id: diodo-fb, rotulo: "Flyback, a la salida", rect: [122, 22, 40, 38], texto: "En inversa mientras conduce el interruptor: no sale nada hasta el corte." }
        - { id: bobina-fw, rotulo: "Forward, a la salida", rect: [384, 22, 42, 38], texto: "La bobina de salida promedia, como en un reductor." }
        - { id: nr, rotulo: "Forward, a la izquierda", rect: [246, 72, 40, 42], texto: "El bobinado de desmagnetización, N_{r}: vacía el núcleo en cada ciclo." }
    requiere: { mover: [rcd, entrehierro, bobina-fw] }

  - id: prediga-conduccion
    tipo: predecir
    titulo: "Mientras conduce"
    texto: "En un flyback el interruptor conecta el primario a la entrada. ¿Qué entrega el secundario en esa fase?"
    libro: [111, 112]
    widget:
      tipo: figura
      figura: fig-33.4
      zonas:
        - { id: flyback, rotulo: "El flyback", rect: [0, 0, 225, 190] }
    opciones:
      - texto: "Nada: su diodo está en inversa y la energía se queda en el núcleo"
        bien: true
        porque: "Toda la energía almacenada pasa al secundario en el corte, cuando la tensión se invierte."
      - texto: "La energía, en el mismo instante, como un transformador"
        porque: "Eso es el forward. El flyback funciona como dos bobinas acopladas que almacenan."
      - texto: "La mitad de la energía"
        porque: "No hay reparto: en conducción el diodo está en inversa y no sale nada."
    escalera:
      - "Mire el sentido del diodo del secundario frente a los puntos de los bobinados."
    solucion: "Nada: el diodo está en inversa; la energía pasa al secundario en el corte."

  - id: toque-guarda
    tipo: tocar
    titulo: "Dónde se guarda"
    texto: "Toque dónde guarda el flyback la energía entre conducción y corte."
    libro: [114]
    widget:
      tipo: figura
      figura: fig-33.4
      zonas:
        - { id: rcd, rotulo: "Flyback, junto al primario", rect: [36, 36, 40, 58] }
        - { id: entrehierro, rotulo: "Flyback, en el núcleo", rect: [98, 60, 45, 42] }
        - { id: diodo-fb, rotulo: "Flyback, a la salida", rect: [122, 22, 40, 38] }
        - { id: bobina-fw, rotulo: "Forward, a la salida", rect: [384, 22, 42, 38] }
    tocar:
      bien: [entrehierro]
      porque:
        rcd: "El RCD recoge solo el pico de la dispersión: es una protección, no el almacén."
        diodo-fb: "El diodo deja pasar la energía al secundario; no la guarda."
        bobina-fw: "Esa bobina es del forward: promedia a la salida."
    exito: "En el entrehierro: lo contrario de un transformador normal, que quiere almacenar lo mínimo."
    escalera:
      - "Busque lo que distingue el núcleo del flyback del de un transformador convencional."
    solucion: "El entrehierro del núcleo: ahí se guarda el campo."

  - id: toque-obligatorio
    tipo: tocar
    titulo: "Lo que no es opcional"
    texto: "La parte del flujo que no llega al secundario produce un pico al cortar. Toque lo que lo recoge."
    libro: [116]
    widget:
      tipo: figura
      figura: fig-33.4
      zonas:
        - { id: rcd, rotulo: "Flyback, junto al primario", rect: [36, 36, 40, 58] }
        - { id: entrehierro, rotulo: "Flyback, en el núcleo", rect: [98, 60, 45, 42] }
        - { id: diodo-fb, rotulo: "Flyback, a la salida", rect: [122, 22, 40, 38] }
    tocar:
      bien: [rcd]
      porque:
        entrehierro: "El entrehierro guarda la energía útil; el pico viene de la dispersión."
        diodo-fb: "El diodo del secundario no ve el flujo que no llega al secundario."
    exito: "El snubber RCD: sin él, el pico de la dispersión puede destruir el interruptor."
    escalera:
      - "El pico aparece en el drenador del interruptor: busque lo que está junto al primario."
    solucion: "El snubber RCD junto al primario."

  - id: comparar
    tipo: pregunta
    titulo: "Flyback frente a forward"
    texto: "Empareje cada rasgo con su topología."
    libro: [115, 117, 120, 122, 124]
    widget:
      tipo: figura
      figura: fig-33.4
      zonas:
        - { id: todo, rotulo: "Las dos topologías", rect: [0, 0, 453, 190] }
    emparejar:
      - ["Flyback", "Muy pocos componentes; hasta unos 100 W"]
      - ["Forward", "Mejor aprovechamiento del núcleo; de 100 a 500 W"]
      - ["Push-pull y puentes", "Más potencia; riesgo de conducción cruzada"]
    exito: "Cada salto de potencia reparte el trabajo de otra manera."
    pistas:
      - { texto: "Toda la energía del flyback pasa por el núcleo en paquetes: eso lo limita." }
    escalera:
      - "El que domina en cargadores es el de menos componentes."
    solucion: "Flyback: pocos componentes y poca potencia. Forward: 100 a 500 W. Puentes: más, con conducción cruzada."

  - id: desmagnetizar
    tipo: porque
    titulo: "El precio del forward"
    texto: "El ciclo de trabajo del forward se limita, típicamente, al 50 %. ¿Por qué?"
    libro: [121, 122]
    widget:
      tipo: figura
      figura: fig-33.4
      zonas:
        - { id: nr, rotulo: "Forward, a la izquierda", rect: [246, 72, 40, 42] }
    opciones:
      - texto: "Hay que desmagnetizar el núcleo antes del ciclo siguiente"
        bien: true
        porque: "Hay que dejar tiempo para vaciar el núcleo antes del ciclo siguiente, o acabaría saturando."
      - texto: "Para que la salida no supere la entrada"
        porque: "La relación de espiras permite cualquier salida; el límite está en el tiempo de desmagnetización."
      - texto: "Para que el diodo de salida descanse"
        porque: "El diodo no es el límite: lo es el núcleo, que sin desmagnetizar acabaría saturando."
    escalera:
      - "Si el núcleo necesita un tiempo para vaciarse, ¿cuánto puede durar la conducción?"
    solucion: "El núcleo se magnetiza al conducir: necesita tiempo para vaciarse, el 50 % con bobinado de desmagnetización."

  - id: lazo-aislado
    tipo: pregunta
    titulo: "La realimentación cruza"
    texto: "El control está en el primario y la salida en el secundario. Empareje cada solución con su rasgo."
    libro: [126, 128, 129, 130]
    widget:
      tipo: figura
      figura: fig-33.4
      zonas:
        - { id: opto, rotulo: "Recuadro de la izquierda", rect: [7, 203, 137, 45] }
        - { id: auxiliar, rotulo: "Recuadro del centro", rect: [157, 203, 137, 45] }
        - { id: secundario, rotulo: "Recuadro de la derecha", rect: [305, 203, 137, 45] }
    emparejar:
      - ["Optoacoplador y TL431", "Lo estándar; diseñar con el CTR de final de vida"]
      - ["Bobinado auxiliar", "No cruza la barrera, pero regula mal"]
      - ["Control en el secundario", "Un aislador digital gobierna el interruptor"]
    exito: "Tres compromisos entre coste, regulación y rendimiento."
    pistas:
      - { texto: "El que regula mal incluye las caídas y la dispersión." }
    escalera:
      - "Empiece por el que no cruza la barrera."
    solucion: "Opto y TL431: lo estándar. Bobinado auxiliar: gratis y mediocre. Secundario: aislador digital."

  - id: ctr
    tipo: pregunta
    titulo: "El optoacoplador envejece"
    texto: "El CTR del optoacoplador se degrada con los años. ¿Con qué valor se diseña el lazo?"
    libro: [128]
    widget:
      tipo: figura
      figura: fig-33.4
      zonas:
        - { id: opto, rotulo: "Recuadro de la izquierda", rect: [7, 203, 137, 45] }
    opciones:
      - texto: "Con el de final de vida"
        bien: true
        porque: "La fuente tiene que seguir regulando cuando el CTR haya bajado."
      - texto: "Con el típico de la hoja de datos"
        porque: "El típico es el de un componente nuevo; con los años baja y el lazo dejaría de regular bien."
      - texto: "Con el máximo, por seguridad"
        porque: "El máximo es el caso optimista: el CTR solo baja con el tiempo."
    escalera:
      - "¿Hacia dónde se mueve el CTR con los años?"
    solucion: "Con el CTR de final de vida."

  - id: normativa
    tipo: pregunta
    titulo: "Aislar no es certificar"
    texto: "Un transformador aísla eléctricamente la salida de la red. ¿Basta para vender la fuente como barrera de seguridad?"
    libro: [133]
    widget:
      tipo: figura
      figura: fig-33.4
      zonas:
        - { id: barrera, rotulo: "La línea discontinua del flyback", rect: [90, 0, 40, 190] }
    opciones:
      - texto: "No, salvo que esté construido y ensayado para ello"
        bien: true
        porque: "Hace falta aislamiento certificado, distancias en la placa y un optoacoplador también certificado."
      - texto: "Sí: si aísla, aísla"
        porque: "Aislar eléctricamente no es aislar normativamente: es la diferencia entre un montaje y un producto."
      - texto: "Sí, si además lleva fusible"
        porque: "El fusible protege de sobrecorrientes; la barrera exige transformador, distancias y opto certificados."
    escalera:
      - "Piense en la diferencia entre un montaje que funciona y un producto que puede venderse."
    solucion: "No: la barrera exige transformador certificado, distancias respetadas y optoacoplador certificado."

  - id: toque-foto
    tipo: tocar
    titulo: "Una fuente de verdad"
    texto: "La fuente conmutada de un grabador de DVD, con la disposición típica de un flyback. Toque el transformador de ferrita."
    libro: [137]
    widget:
      tipo: figura
      figura: fig-33.5
      zonas:
        - { id: choque, rotulo: "A la izquierda, con bobinados", rect: [183, 514, 183, 183] }
        - { id: trafo, rotulo: "En el centro", rect: [727, 400, 169, 286] }
        - { id: salida, rotulo: "A la derecha", rect: [1006, 411, 389, 503] }
        - { id: condensador, rotulo: "Cilindro azul grande", rect: [434, 309, 126, 183] }
    tocar:
      bien: [trafo]
      porque:
        choque: "Es el choque de 30 mH del filtro de entrada de red."
        salida: "Ahí están los rectificadores y condensadores de salida."
        condensador: "Es el condensador del bus rectificado de la red, antes del interruptor."
    exito: "En el centro, entre la red a la izquierda y las salidas a la derecha: la barrera."
    escalera:
      - "El transformador separa la red, a la izquierda, de las salidas, a la derecha."
    solucion: "El bloque del centro: el transformador de ferrita."

  - id: drenador
    tipo: pregunta
    titulo: "Lo que se ve en el drenador"
    texto: "Al cortar, la tensión de drenador de un flyback suma tres cosas. Ordénelas de la base a la punta."
    libro: [135]
    widget:
      tipo: figura
      figura: fig-33.4
      zonas:
        - { id: rcd, rotulo: "Flyback, junto al primario", rect: [36, 36, 40, 58] }
    ordenar:
      - "La tensión de entrada"
      - "La tensión reflejada del secundario"
      - "El pico de la dispersión"
    exito: "Si el pico se acerca a la ruptura del transistor, el snubber está mal o el transformador se ha degradado."
    pistas:
      - { texto: "La base es lo que hay con el interruptor abierto y sin nada más: la entrada." }
    escalera:
      - "El pico es lo último: dura un instante sobre las otras dos."
    solucion: "Entrada, reflejada del secundario y, encima, el pico de dispersión."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [110, 116, 119, 128, 133]
    ideas:
      - { titulo: "Flyback.", texto: "Bobinas acopladas que almacenan: entrehierro, pocos componentes y snubber RCD obligatorio." }
      - { titulo: "Forward.", texto: "Transfiere directamente y promedia con una bobina; hay que desmagnetizar cada ciclo." }
      - { titulo: "El lazo cruza.", texto: "Optoacoplador con el CTR de final de vida, bobinado auxiliar o control en el secundario." }
      - { titulo: "Normativa.", texto: "Aislar eléctricamente no es aislar normativamente." }
