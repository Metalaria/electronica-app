# Lección 1.2 de la sección 33.14 «Conmutación Dura y Suave: los Convertidores Resonantes» (cap33, sec-33.12).
# Formato: GUIA.md.
# - El encendido como en la figura 33.13: en conmutación dura la corriente sube en un tiempo τ con la tensión aún
#   alta y luego la tensión cae en otro τ; con ZVS la tensión ya ha caído antes de activar la puerta. La energía de
#   cada encendido duro es V·I·τ (dos triángulos). 400 V, 10 A, τ = 15 ns y las frecuencias de 100 kHz a 1 MHz son
#   míos (el libro no da números aquí): sirven para ver que la pérdida media crece con la frecuencia (bloque 451).
# Sin paso práctico: sección cualitativa; el «banco» del libro es la gráfica que el lector abre con y sin ZVS.
# 1.2.1 (autor121-pot, «aprender haciendo», GUIA §13): se toca en la figura 33.21 la energía de cada encendido duro y
# el instante que demuestra el ZVS; con los valores de ejemplo se calculan la energía por encendido y la pérdida a
# 1 MHz, y se quita esa pérdida con ZVS (objetivo). Quedan dos preguntas (el espectro del LLC y su punto de trabajo);
# las familias, las topologías y los cargadores pasan a explicaciones y resumen.
leccion: cap33/sec-33.12

libro:
  450: "esa superposición es exactamente la energía que se pierde en cada transición"
  451: "subir la frecuencia reduce el tamaño de los magnéticos y aumenta las pérdidas en la misma proporción"
  452: "cuando la tensión o la corriente valen cero"
  454: "se consigue que la tensión sobre el interruptor sea cero antes de encenderlo"
  455: "la pérdida de encendido —descargar esa capacidad— es la que domina en los MOSFET"
  456: "Es más adecuada para IGBT"
  458: "la energía almacenada en la dispersión del transformador consigue ZVS de forma natural"
  459: "es la topología dominante hoy en fuentes de ordenador y de televisión"
  460: "porque el espectro se mueve"
  462: "rendimientos por encima del 95 %"
  463: "conmutan suavemente a frecuencia alta y sus magnéticos son diminutos"
  465: "tienen capacidades de salida y cargas de puerta mucho menores"
  469: "Un LLC mal dimensionado tiene un rendimiento excelente en su punto y mediocre fuera"
  472: "tensión de drenador y señal de puerta en dos canales"
  473: "En ZVS, la tensión ya ha caído a cero cuando la puerta se activa"
  475: "Solapamiento de tensión y corriente en conmutación dura"

modelo:
  valores:
    V_s: { sim: "V", nombre: "tensión que bloquea el interruptor", unidad: V, valor: 400 }
    I_s: { sim: "I", nombre: "corriente que conmuta", unidad: A, valor: 10 }
    tau: { sim: "τ", nombre: "duración de cada rampa", unidad: s, valor: 1.5e-8 }
    t_0: { sim: "t₀", nombre: "instante en que se activa la puerta", unidad: s, valor: 5e-8 }
    zvs: { tipo: interruptor, nombre: "conmutación a tensión nula", valor: 0 }
    f_s: { sim: "f_{s}", nombre: "frecuencia de conmutación", unidad: Hz, valor: 100000 }
  calculos:
    E_on: { expr: "(1 - zvs)*V_s*I_s*tau", sim: "E_{on}", nombre: "energía perdida en cada encendido", unidad: J }
    P_on: { expr: "(1 - zvs)*V_s*I_s*tau*f_s", sim: "P", nombre: "pérdida media de encendido", unidad: W }

tarjetas:
  - id: explore-encendido
    tipo: tocar
    titulo: "Dura o suave"
    texto: "En conmutación dura, la corriente sube con la tensión aún alta. Toque dónde se ve la energía que se pierde en cada encendido."
    libro: [450, 475]
    widget:
      tipo: figura
      figura: fig-33.13
      zonas:
        - { id: solape, rotulo: "Arriba a la izquierda", rect: [70, 22, 62, 70] }
        - { id: triangulo, rotulo: "Abajo a la izquierda", rect: [70, 100, 62, 62] }
        - { id: caida, rotulo: "Arriba a la derecha", rect: [245, 22, 70, 70] }
        - { id: puerta, rotulo: "En medio a la derecha", rect: [312, 92, 46, 36] }
        - { id: cero, rotulo: "Abajo a la derecha", rect: [360, 120, 75, 42] }
    tocar:
      bien: [triangulo]
      porque:
        solape: "Ahí se ven tensión y corriente; la energía perdida es su producto, abajo."
        caida: "Eso es el ZVS: la tensión cae antes de encender."
        puerta: "Ese es el instante en que se activa la puerta con ZVS."
        cero: "Con ZVS, v·i es cero: no hay pérdida de encendido."
    exito: "El triángulo de v·i: esa superposición es exactamente la energía perdida en cada transición."
    escalera:
      - "Busque el producto v·i en la conmutación dura."
    solucion: "Abajo a la izquierda, el triángulo."

  - id: simule-energia
    tipo: simular
    titulo: "Un encendido duro"
    texto: "Valores de ejemplo: 400 V, 10 A y rampas de 15 ns, una de corriente y otra de tensión. ¿Qué energía se pierde en cada encendido?"
    libro: [450]
    fijar: { zvs: 0 }
    widget:
      tipo: grafica
      x: { id: t, min: 0, max: 0.0000001, unidad: s, rotulo: "t" }
      y: { min: 0, max: 1.1, unidad: "", rotulo: "v·i, en tanto por uno" }
      curvas:
        - { expr: "(1 - min(1, max(0, (t - t_0 - tau + 3*zvs*tau)/tau)))*min(1, max(0, (t - t_0)/tau))", color: verde, rotulo: "v·i" }
      lectura: { valor: E_on, rotulo: "Energía por encendido" }
      ocultar: true
    simular:
      objetivo: E_on
      unidad: J
      tol: 0.03
      rotulo: "Energía por encendido"
      errores:
        - { expr: "E_on/2", texto: "Ese es un solo triángulo: hay dos rampas, la de corriente y la de tensión." }
    exito: "60 µJ: dos triángulos de ½·V·I·τ. Parece poco, pero se paga en cada ciclo."
    escalera:
      - "Cada rampa es un triángulo de V·I de altura y τ de base."
    solucion: "Dos triángulos de ½·V·I·τ: 400 V × 10 A × 15 ns = 60 µJ."
    comprobar:
      - { E_on: 0.00006, V_s: 400, I_s: 10, tau: 1.5e-8 }

  - id: prediga-frecuencia
    tipo: simular
    titulo: "El muro de la frecuencia"
    texto: "Con esos 60 µJ por encendido, a 100 kHz se pierden 6 W. Si se sube a 1 MHz para reducir los magnéticos, ¿cuánto se pierde?"
    libro: [451]
    fijar: { zvs: 0, f_s: 1000000 }
    widget:
      tipo: grafica
      x: { id: t, min: 0, max: 0.0000001, unidad: s, rotulo: "t" }
      y: { min: 0, max: 1.1, unidad: "", rotulo: "v·i, en tanto por uno" }
      curvas:
        - { expr: "(1 - min(1, max(0, (t - t_0 - tau + 3*zvs*tau)/tau)))*min(1, max(0, (t - t_0)/tau))", color: verde, rotulo: "v·i en un encendido" }
      lectura: { valor: P_on, rotulo: "Pérdida media" }
      ocultar: true
    simular:
      objetivo: P_on
      unidad: W
      tol: 0.03
      rotulo: "Pérdida de encendido a 1 MHz"
      errores:
        - { expr: "P_on/10", texto: "Esa es a 100 kHz. Cada encendido cuesta lo mismo, y ahora hay diez veces más." }
    exito: "60 W: diez veces más. Es el muro: los magnéticos menguan y las pérdidas crecen en la misma proporción."
    escalera:
      - "Pérdida media = energía por encendido × encendidos por segundo."
    solucion: "60 µJ × 1 MHz = 60 W."
    comprobar:
      - { P_on: 60 }
      - { con: { f_s: 100000 }, P_on: 6 }

  - id: explore-muro
    tipo: explorar
    titulo: "Con y sin ZVS"
    texto: "Valores de ejemplo, a 100 kHz y en conmutación dura. Lleve la frecuencia a 1 MHz sin que se pierda nada en el encendido."
    libro: [451, 452, 454]
    inicio: { f_s: 100000, zvs: 0 }
    widget:
      tipo: grafica
      x: { id: t, min: 0, max: 0.0000001, unidad: s, rotulo: "t" }
      y: { min: 0, max: 1.1, unidad: "", rotulo: "tanto por uno" }
      curvas:
        - { expr: "(1 - min(1, max(0, (t - t_0 - tau + 3*zvs*tau)/tau)))*min(1, max(0, (t - t_0)/tau))", color: verde, rotulo: "v·i" }
      lectura: { valor: P_on, rotulo: "Pérdida media de encendido" }
      mandos:
        - { valor: f_s, lista: [100000, 300000, 1000000], rotulo: "Frecuencia de conmutación" }
        - { valor: zvs, tipo: interruptor, rotulo: "Tensión nula al encender" }
    objetivo:
      condiciones:
        - { valor: f_s, min: 1000000, rotulo: "Frecuencia: {{f_s}}" }
        - { valor: P_on, max: 0, rotulo: "Pérdida de encendido: {{P_on}}" }
      logrado: "A {{f_s}} sin pérdida de encendido: la tensión ya es cero al encender. La conmutación suave rompe el compromiso."
      pistas:
        - { cuando: { valor: f_s, menor: 1000000 }, texto: "Suba la frecuencia a 1 MHz." }
        - { texto: "En conmutación dura se pierde en cada encendido: active la tensión nula." }
    escalera:
      - "Sin tensión al encender no hay solapamiento."
    solucion: "1 MHz con ZVS."
    comprobar:
      - { con: { f_s: 1000000, zvs: 1 }, P_on: 0 }

  - id: banco-zvs
    tipo: tocar
    titulo: "Verlo en el osciloscopio"
    texto: "Tensión de drenador y señal de puerta en dos canales. Toque el instante que demuestra el ZVS."
    libro: [472, 473]
    widget:
      tipo: figura
      figura: fig-33.13
      zonas:
        - { id: solape, rotulo: "Arriba a la izquierda", rect: [70, 22, 62, 70] }
        - { id: triangulo, rotulo: "Abajo a la izquierda", rect: [70, 100, 62, 62] }
        - { id: caida, rotulo: "Arriba a la derecha", rect: [245, 22, 70, 70] }
        - { id: puerta, rotulo: "En medio a la derecha", rect: [312, 92, 46, 36] }
        - { id: cero, rotulo: "Abajo a la derecha", rect: [360, 120, 75, 42] }
    tocar:
      bien: [puerta]
      porque:
        solape: "Ese es el encendido duro, con la tensión todavía alta."
        triangulo: "Esa es la energía perdida en conmutación dura."
        caida: "La tensión cae, sí; lo que demuestra el ZVS es que ya es cero cuando llega la puerta."
        cero: "v·i nulo es la consecuencia; la prueba es cuándo se activa la puerta."
    exito: "La puerta se activa con la tensión ya en cero: el solapamiento desaparece. Se usa la energía de la dispersión para descargar la capacidad de salida."
    escalera:
      - "Busque la línea discontinua de la puerta."
    solucion: "En medio a la derecha: se activa la puerta."

  - id: por-que-llc-emi
    tipo: porque
    titulo: "El precio del LLC"
    texto: "Un LLC regula variando la frecuencia. ¿Por qué complica eso el filtrado de interferencias?"
    libro: [460]
    widget:
      tipo: figura
      figura: fig-33.13
      zonas:
        - { id: todo, rotulo: "Las dos conmutaciones", rect: [0, 0, 436, 210] }
    opciones:
      - texto: "Porque el espectro se mueve con la carga y la entrada"
        bien: true
        porque: "Un filtro pensado para una frecuencia fija no sirve igual para un espectro que se desplaza."
      - texto: "Porque conmuta duro"
        porque: "Al contrario: consigue ZVS en un margen amplio."
      - texto: "Porque no tiene transformador"
        porque: "Lo tiene; la dificultad viene de la frecuencia variable."
    escalera:
      - "¿Qué pasa con las rayas del espectro si la frecuencia cambia?"
    solucion: "El espectro se mueve con el punto de trabajo y es más difícil de filtrar."

  - id: fuera-de-punto
    tipo: pregunta
    titulo: "Fuera de su punto"
    texto: "Un LLC mal dimensionado rinde de maravilla en su punto de trabajo. ¿Y fuera de él?"
    libro: [469]
    widget:
      tipo: figura
      figura: fig-33.13
      zonas:
        - { id: todo, rotulo: "Las dos conmutaciones", rect: [0, 0, 436, 210] }
    opciones:
      - texto: "Mediocre: fuera del margen de ZVS vuelve a conmutar duro"
        bien: true
        porque: "El ZVS solo se consigue en un margen de carga."
      - texto: "Igual de bien: el ZVS es permanente"
        porque: "Depende del punto de trabajo, y de la dispersión."
      - texto: "Se apaga por protección"
        porque: "No se apaga: sigue funcionando, pero conmutando duro."
    escalera:
      - "¿De qué depende que haya ZVS?"
    solucion: "Mediocre: fuera de su margen pierde el ZVS."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [451, 454, 455, 456, 458, 459, 462, 463, 465, 469]
    ideas:
      - { titulo: "El muro.", texto: "En conmutación dura, la pérdida crece con la frecuencia." }
      - { titulo: "ZVS y ZCS.", texto: "Tensión nula al encender (MOSFET) o corriente nula al apagar (IGBT)." }
      - { titulo: "LLC.", texto: "Regula por frecuencia con ZVS en un margen amplio; el desplazamiento de fase, en potencia alta. Cargadores diminutos." }
      - { titulo: "Lo que cuesta.", texto: "Diseño delicado y buen rendimiento solo en su margen." }
