# Lección 1.2 de la sección 33.5 «Más Potencia: Push-Pull, Medio Puente y Puente Completo» (cap33). Formato: GUIA.md.
# - La figura 33.6 (tabla, conducción cruzada y tiempo muerto) con zonas grandes.
# - Las puertas de una rama son una gráfica del modelo: periodo de 10 µs y un tiempo muerto t_m entre −1 y 1 µs
#   (valores míos, solo en los ejes y el mando: el libro no da números); negativo = las dos puertas se solapan.
#   Cada puerta está alta media periodo menos t_m, centrada en su semiperiodo.
# Sin paso práctico: sección de arquitecturas sin cálculo; el «en el banco» (bloques 167–168) es la gráfica del
# tiempo muerto que el lector abre y cierra.
# 1.2.1 (autor121-pot, «aprender haciendo», GUIA §13): se toca el cortocircuito en la figura, se calculan con un bus de
# 400 V (valor de ejemplo) la tensión de un interruptor del push-pull y la del primario del medio puente, se quita el
# solape de las puertas (objetivo) y se lee el tiempo muerto como en el banco. Quedan dos preguntas (el solape y el
# bootstrap); los límites, las arquitecturas, el dominio del puente, las defensas y el desequilibrio, al resumen.
leccion: cap33/sec-33.5

libro:
  141: "El núcleo se usa en un solo cuadrante"
  143: "usando el núcleo en los dos cuadrantes y repartiendo la corriente"
  142: "La corriente de pico en un solo interruptor crece hasta valores incómodos"
  145: "cada interruptor soporta el doble de la tensión de entrada"
  146: "la tensión aplicada al primario es la mitad"
  147: "da el doble de potencia que el medio puente con los mismos componentes"
  149: "Puente completo"
  150: "sus interruptores soportan la tensión mínima posible"
  153: "cortocircuitan la alimentación"
  155: "Debe cubrir el peor caso de retardo de los drivers"
  156: "Drivers con enclavamiento"
  157: "Detección de saturación"
  159: "el interruptor de arriba tiene su fuente flotante"
  161: "lo que impide ciclos de trabajo del 100 %"
  162: "Alimentación aislada con su propio convertidor"
  164: "el núcleo acumula un pequeño desplazamiento en cada ciclo y acaba saturando"
  165: "un condensador en serie con el primario"
  167: "el tiempo muerto, con dos canales del osciloscopio en las señales de puerta de una misma rama"
  168: "Debe haber un intervalo claro en que ambas están inactivas"
  169: "Las topologías de potencia comparadas"

modelo:
  valores:
    T_p: { sim: "T", nombre: "periodo de conmutación", unidad: s, valor: 1e-5 }
    t_m: { sim: "t_{m}", nombre: "tiempo muerto", unidad: s, valor: 5e-7 }
    V_b: { sim: "V_{in}", nombre: "tensión del bus (ejemplo)", unidad: V, valor: 400 }
  calculos:
    solape: { expr: "max(0, -t_m)", sim: "solape", nombre: "tiempo con las dos puertas activas", unidad: s }
    muerto: { expr: "max(0, t_m)", sim: "t_{m}", nombre: "tiempo con las dos apagadas", unidad: s }
    V_pp: { expr: "2*V_b", sim: "V_{interruptor}", nombre: "tensión que soporta un interruptor del push-pull", unidad: V }
    V_mp: { expr: "V_b/2", sim: "V_{primario}", nombre: "tensión en el primario del medio puente", unidad: V }

tarjetas:
  - id: explore-figura
    tipo: tocar
    titulo: "El riesgo común"
    texto: "Si los dos interruptores de una rama conducen a la vez, aunque sea nanosegundos, cortocircuitan la alimentación. Toque dónde lo dibuja la figura."
    libro: [149, 153, 155, 169]
    widget:
      tipo: figura
      figura: fig-33.6
      zonas:
        - { id: tabla, rotulo: "Arriba", rect: [0, 0, 451, 105] }
        - { id: cruzada, rotulo: "Abajo a la izquierda", rect: [20, 145, 160, 165] }
        - { id: muerto, rotulo: "Abajo a la derecha", rect: [205, 145, 240, 140] }
    tocar:
      bien: [cruzada]
      porque:
        tabla: "Es la tabla de topologías: interruptores, tensión que soportan y potencia típica."
        muerto: "Es la defensa: el tiempo muerto, con las dos puertas apagadas un intervalo."
    exito: "La conducción cruzada: cientos de amperios y destrucción inmediata, en todas las topologías de rama."
    escalera:
      - "Busque los dos interruptores de una rama conduciendo."
    solucion: "Abajo a la izquierda."

  - id: arquitecturas
    tipo: simular
    titulo: "El push-pull en la red"
    texto: "Valores de ejemplo: un bus de 400 V. ¿Qué tensión soporta cada interruptor de un push-pull?"
    libro: [145, 149]
    widget:
      tipo: figura
      figura: fig-33.6
      zonas:
        - { id: tabla, rotulo: "La tabla", rect: [0, 0, 451, 105] }
    simular:
      objetivo: V_pp
      unidad: V
      tol: 0.02
      rotulo: "Tensión de un interruptor"
      errores:
        - { expr: "V_b", texto: "Esa es la del medio puente y el puente completo. En el push-pull, la toma central dobla la tensión." }
    exito: "800 V, el doble de la entrada: poco adecuado para alimentación de red. A cambio, los dos interruptores van a masa."
    escalera:
      - "La tabla: 2 × V_{in}."
    solucion: "2 × 400 = 800 V."
    comprobar:
      - { V_pp: 800 }

  - id: medio-puente
    tipo: simular
    titulo: "El primario del medio puente"
    texto: "Con el mismo bus de 400 V, cada interruptor del medio puente soporta solo la entrada. ¿Qué tensión recibe el primario?"
    libro: [146, 147]
    widget:
      tipo: figura
      figura: fig-33.6
      zonas:
        - { id: cruzada, rotulo: "La rama", rect: [20, 145, 160, 165] }
    simular:
      objetivo: V_mp
      unidad: V
      tol: 0.02
      rotulo: "Tensión del primario"
      errores:
        - { expr: "V_b", texto: "Esa la aplica el puente completo, con cuatro interruptores." }
    exito: "200 V, la mitad: el otro extremo va al punto medio de los condensadores. El puente completo aplica la entera y da el doble de potencia."
    escalera:
      - "¿A qué tensión está el punto medio de dos condensadores iguales entre los raíles?"
    solucion: "400/2 = 200 V."
    comprobar:
      - { V_mp: 200 }

  - id: explore-tiempo-muerto
    tipo: explorar
    titulo: "El tiempo muerto"
    texto: "Las dos puertas de una rama se solapan: conducen a la vez. Ajuste el tiempo muerto para dejar un intervalo claro con las dos apagadas."
    libro: [153, 155, 168]
    inicio: { t_m: -3e-7 }
    widget:
      tipo: grafica
      x: { id: t, min: 0, max: 0.00002, unidad: s, rotulo: "t", muestras: 1600 }
      y: { min: -1.2, max: 2.8, unidad: "", rotulo: "puertas" }
      curvas:
        - { expr: "1.5 + min(1, max(0, ceil(0.5 - t_m/T_p - (t/T_p - t_m/(2*T_p) - floor(t/T_p - t_m/(2*T_p))))))", color: naranja, rotulo: "G₁" }
        - { expr: "min(1, max(0, ceil(0.5 - t_m/T_p - (t/T_p - 0.5 - t_m/(2*T_p) - floor(t/T_p - 0.5 - t_m/(2*T_p))))))", color: azul, rotulo: "G₂" }
        - { expr: "-1 + 0.6*min(1, max(0, ceil(0.5 - t_m/T_p - (t/T_p - t_m/(2*T_p) - floor(t/T_p - t_m/(2*T_p))))))*min(1, max(0, ceil(0.5 - t_m/T_p - (t/T_p - 0.5 - t_m/(2*T_p) - floor(t/T_p - 0.5 - t_m/(2*T_p))))))", color: tinta, rotulo: "las dos a la vez" }
      lectura: { valor: solape, rotulo: "Solape" }
      datos:
        - { valor: muerto, rotulo: "Las dos apagadas: {{muerto}}" }
      mandos:
        - { valor: t_m, min: -1e-6, max: 1e-6, paso: 1e-7, rotulo: "Tiempo muerto" }
    objetivo:
      condiciones:
        - { valor: solape, max: 0, rotulo: "Solape: {{solape}}" }
        - { valor: muerto, min: 1e-7, rotulo: "Las dos apagadas: {{muerto}}" }
      logrado: "{{muerto}} con las dos apagadas: la rama ya no cortocircuita. Debe cubrir el peor retardo de los drivers."
      pistas:
        - { cuando: { valor: solape, mayor: 0 }, texto: "Todavía se solapan: la línea de abajo marca cuándo conducen las dos." }
        - { texto: "Sin solape, pero sin margen: deje un intervalo claro." }
    escalera:
      - "Un tiempo muerto positivo apaga una antes de encender la otra."
    solucion: "Cualquier tiempo muerto positivo, por ejemplo 0,5 µs."
    comprobar:
      - { con: { t_m: 5e-7 }, solape: 0, muerto: 5e-7 }
      - { solape: 3e-7 }

  - id: lea-muerto
    tipo: leer
    titulo: "Mídalo en el banco"
    texto: "Lo primero que se mide en un puente: las dos puertas de una rama con dos canales del osciloscopio. Lea el intervalo con las dos inactivas."
    libro: [167, 168]
    fijar: { t_m: 5e-7 }
    widget:
      tipo: grafica
      x: { id: t, min: 0.000004, max: 0.000006, unidad: s, rotulo: "t", muestras: 1600 }
      y: { min: -0.2, max: 2.8, unidad: "", rotulo: "puertas" }
      curvas:
        - { expr: "1.5 + min(1, max(0, ceil(0.5 - t_m/T_p - (t/T_p - t_m/(2*T_p) - floor(t/T_p - t_m/(2*T_p))))))", color: naranja, rotulo: "G₁" }
        - { expr: "min(1, max(0, ceil(0.5 - t_m/T_p - (t/T_p - 0.5 - t_m/(2*T_p) - floor(t/T_p - 0.5 - t_m/(2*T_p))))))", color: azul, rotulo: "G₂" }
      mandos: []
    leer:
      objetivo: muerto
      unidad: s
      tol: 0.1
      rotulo: "Tiempo muerto"
      errores:
        - { expr: "T_p/2", texto: "Ese es medio periodo. El tiempo muerto es el hueco entre que baja una y sube la otra." }
    exito: "Medio microsegundo con las dos inactivas. Si se solaparan aunque sea un poco, el convertidor estaría a un transitorio de destruirse."
    escalera:
      - "Del flanco de bajada de G₁ al de subida de G₂."
    solucion: "0,5 µs."
    comprobar:
      - { muerto: 5e-7 }

  - id: prediga-cruzada
    tipo: predecir
    titulo: "Un solape de nanosegundos"
    texto: "Las dos puertas de una rama se solapan, aunque sea unos nanosegundos. ¿Qué ocurre?"
    libro: [153]
    fijar: { t_m: -3e-7 }
    widget:
      tipo: figura
      figura: fig-33.6
      zonas:
        - { id: muerto, rotulo: "Abajo a la derecha", rect: [205, 145, 240, 140] }
    opciones:
      - texto: "Cortocircuitan la alimentación: cientos de amperios y destrucción inmediata"
        bien: true
        porque: "Los dos interruptores en serie unen V_{in} con masa sin nada que limite la corriente."
      - texto: "Nada grave: es muy poco tiempo"
        porque: "En nanosegundos ya circulan cientos de amperios: la destrucción es inmediata."
      - texto: "Baja un poco el rendimiento"
        porque: "No es una pérdida más: es un cortocircuito de la alimentación."
    escalera:
      - "Siga el camino de V_{in} a masa por los dos interruptores de la rama."
    solucion: "Un cortocircuito de la alimentación: cientos de amperios."

  - id: bootstrap
    tipo: pregunta
    titulo: "El interruptor de arriba"
    texto: "Su fuente flota entre masa y la alimentación. Con un bootstrap, ¿por qué no puede trabajar al 100 %?"
    libro: [159, 161, 162]
    widget:
      tipo: figura
      figura: fig-33.6
      zonas:
        - { id: cruzada, rotulo: "La rama", rect: [20, 145, 160, 165] }
    opciones:
      - texto: "El condensador solo se recarga cuando el nodo baja"
        bien: true
        porque: "Al 100 % el nodo nunca baja y el bootstrap se descarga; una alimentación aislada no tiene ese límite."
      - texto: "Porque el interruptor de abajo se calentaría"
        porque: "Al 100 % el de abajo ni conduce; el problema es recargar el bootstrap."
      - texto: "Porque el tiempo muerto lo impide"
        porque: "El tiempo muerto separa las dos puertas; el límite del 100 % viene del bootstrap."
    escalera:
      - "¿Cuándo se recarga el condensador del bootstrap?"
    solucion: "Necesita que el nodo baje periódicamente para recargarse."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [141, 142, 143, 150, 155, 156, 157, 161, 164, 165]
    ideas:
      - { titulo: "Dos cuadrantes.", texto: "Una sola rama usa el núcleo en un cuadrante y carga un interruptor; push-pull y puentes reparten." }
      - { titulo: "El puente domina.", texto: "Sus interruptores soportan solo V_{in}: menos R_{DS(on)}, menos pérdidas." }
      - { titulo: "Conducción cruzada.", texto: "Tiempo muerto del controlador, enclavamiento del driver y detección de saturación." }
      - { titulo: "El de arriba y el núcleo.", texto: "Bootstrap o alimentación aislada; condensador en serie contra el desequilibrio." }
