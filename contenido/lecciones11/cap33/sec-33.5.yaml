# Lección 1.2 de la sección 33.5 «Más Potencia: Push-Pull, Medio Puente y Puente Completo» (cap33). Formato: GUIA.md.
# - La figura 33.6 (tabla, conducción cruzada y tiempo muerto) con zonas grandes.
# - Las puertas de una rama son una gráfica del modelo: periodo de 10 µs y un tiempo muerto t_m entre −1 y 1 µs
#   (valores míos, solo en los ejes y el mando: el libro no da números); negativo = las dos puertas se solapan.
#   Cada puerta está alta media periodo menos t_m, centrada en su semiperiodo.
# Sin paso práctico: sección de arquitecturas sin cálculo; el «en el banco» (bloques 167–168) es la gráfica del
# tiempo muerto que el lector abre y cierra.
leccion: cap33/sec-33.5

libro:
  141: "El núcleo se usa en un solo cuadrante"
  143: "usando el núcleo en los dos cuadrantes y repartiendo la corriente"
  142: "La corriente de pico en un solo interruptor crece hasta valores incómodos"
  145: "cada interruptor soporta el doble de la tensión de entrada"
  146: "la tensión aplicada al primario es la mitad"
  147: "da el doble de potencia que el medio puente con los mismos componentes"
  149: "Puente completo"
  150: "sus interruptores soportan la tensión mínima posible"
  153: "cortocircuitan la alimentación"
  155: "Debe cubrir el peor caso de retardo de los drivers"
  156: "Drivers con enclavamiento"
  157: "Detección de saturación"
  159: "el interruptor de arriba tiene su fuente flotante"
  161: "lo que impide ciclos de trabajo del 100 %"
  162: "Alimentación aislada con su propio convertidor"
  164: "el núcleo acumula un pequeño desplazamiento en cada ciclo y acaba saturando"
  165: "un condensador en serie con el primario"
  168: "Debe haber un intervalo claro en que ambas están inactivas"
  169: "Las topologías de potencia comparadas"

modelo:
  valores:
    T_p: { sim: "T", nombre: "periodo de conmutación", unidad: s, valor: 1e-5 }
    t_m: { sim: "t_{m}", nombre: "tiempo muerto", unidad: s, valor: 5e-7 }
  calculos:
    solape: { expr: "max(0, -t_m)", sim: "solape", nombre: "tiempo con las dos puertas activas", unidad: s }
    muerto: { expr: "max(0, t_m)", sim: "t_{m}", nombre: "tiempo con las dos apagadas", unidad: s }

tarjetas:
  - id: explore-figura
    tipo: explorar
    titulo: "Más potencia"
    texto: "Toque las tres partes de la figura: la tabla de topologías, el cortocircuito y su defensa."
    libro: [149, 153, 155, 169]
    widget:
      tipo: figura
      figura: fig-33.6
      zonas:
        - { id: tabla, rotulo: "Arriba", rect: [0, 0, 451, 105], texto: "Más interruptores, menos tensión en cada uno: el puente completo soporta solo V_{in}." }
        - { id: cruzada, rotulo: "Abajo a la izquierda", rect: [20, 145, 160, 165], texto: "Si conducen los dos de una rama, cortocircuitan la alimentación: cientos de amperios." }
        - { id: muerto, rotulo: "Abajo a la derecha", rect: [205, 145, 240, 140], texto: "El tiempo muerto: un intervalo con las dos puertas apagadas." }
    requiere: { mover: [tabla, cruzada, muerto] }

  - id: limites
    tipo: pregunta
    titulo: "Por qué una rama no basta"
    texto: "¿Qué dos cosas limitan a unos cientos de vatios las topologías de un interruptor?"
    libro: [141, 142]
    widget:
      tipo: figura
      figura: fig-33.6
      zonas:
        - { id: tabla, rotulo: "La tabla", rect: [0, 0, 451, 105] }
    opciones:
      - texto: "El núcleo en un solo cuadrante y la corriente de pico de un solo interruptor"
        bien: true
        porque: "Se desaprovecha la mitad del núcleo y un interruptor carga con toda la corriente."
      - texto: "La frecuencia de conmutación y el tamaño del condensador"
        porque: "No son el límite que da el libro: lo son el núcleo en un cuadrante y el pico de corriente."
      - texto: "El ruido y el rizado de salida"
        porque: "Son el precio de conmutar en cualquier topología, no lo que limita la potencia."
    escalera:
      - "Piense en cómo se magnetiza el núcleo y en quién lleva la corriente."
    solucion: "Núcleo en un solo cuadrante (hay que desmagnetizar) y pico de corriente en un solo interruptor."

  - id: arquitecturas
    tipo: pregunta
    titulo: "Tres arquitecturas"
    texto: "Empareje cada topología con su rasgo."
    libro: [145, 146, 147]
    widget:
      tipo: figura
      figura: fig-33.6
      zonas:
        - { id: tabla, rotulo: "La tabla", rect: [0, 0, 451, 105] }
    emparejar:
      - ["Push-pull", "Primario con toma central; los dos interruptores a masa"]
      - ["Medio puente", "Transformador entre dos interruptores y dos condensadores"]
      - ["Puente completo", "Cuatro interruptores; tensión completa en ambos sentidos"]
    exito: "Las tres usan el núcleo en los dos cuadrantes y reparten la corriente."
    pistas:
      - { texto: "La toma central es la que deja los dos interruptores referidos a masa." }
    escalera:
      - "Empiece por la de cuatro interruptores."
    solucion: "Push-pull: toma central. Medio puente: punto medio de dos condensadores. Puente completo: cuatro interruptores."

  - id: medio-puente
    tipo: pregunta
    titulo: "El primario del medio puente"
    texto: "En un medio puente, cada interruptor soporta solo la tensión de entrada. ¿Qué tensión recibe el primario?"
    libro: [146, 147]
    widget:
      tipo: figura
      figura: fig-33.6
      zonas:
        - { id: cruzada, rotulo: "La rama", rect: [20, 145, 160, 165] }
    opciones:
      - texto: "La mitad de la entrada"
        bien: true
        porque: "El otro extremo va al punto medio de los condensadores; el puente completo aplica la entera y da el doble de potencia."
      - texto: "La entrada completa"
        porque: "Eso es el puente completo, con cuatro interruptores."
      - texto: "El doble de la entrada"
        porque: "El doble es lo que soporta cada interruptor de un push-pull, no el primario del medio puente."
    escalera:
      - "¿A qué tensión está el punto medio de dos condensadores iguales entre los raíles?"
    solucion: "La mitad de la entrada: por eso el puente completo da el doble de potencia."

  - id: domina-puente
    tipo: pregunta
    titulo: "Por qué domina el puente"
    texto: "Sus interruptores soportan la tensión mínima posible. ¿Qué gana con eso?"
    libro: [149, 150]
    widget:
      tipo: figura
      figura: fig-33.6
      zonas:
        - { id: tabla, rotulo: "La tabla", rect: [0, 0, 451, 105] }
    opciones:
      - texto: "Puede usar dispositivos de menor R_{DS(on)}: menos pérdidas"
        bien: true
        porque: "Un interruptor de menos tensión tiene menos resistencia en conducción."
      - texto: "Puede conmutar sin tiempo muerto"
        porque: "La conducción cruzada amenaza a todas las ramas, también a las del puente."
      - texto: "No necesita transformador"
        porque: "Lo sigue necesitando para aislar; la ventaja está en los interruptores."
    escalera:
      - "¿Qué parámetro de un MOSFET empeora cuanto más tensión soporta?"
    solucion: "Interruptores de menos tensión, con menos R_{DS(on)} y menos pérdidas."

  - id: explore-tiempo-muerto
    tipo: explorar
    titulo: "El tiempo muerto"
    texto: "Las dos puertas de una rama. Haga negativo el tiempo muerto y mire cuándo conducen las dos."
    libro: [153, 155, 168]
    widget:
      tipo: grafica
      x: { id: t, min: 0, max: 0.00002, unidad: s, rotulo: "t", muestras: 1600 }
      y: { min: -1.2, max: 2.8, unidad: "", rotulo: "puertas" }
      curvas:
        - { expr: "1.5 + min(1, max(0, ceil(0.5 - t_m/T_p - (t/T_p - t_m/(2*T_p) - floor(t/T_p - t_m/(2*T_p))))))", color: naranja, rotulo: "G₁" }
        - { expr: "min(1, max(0, ceil(0.5 - t_m/T_p - (t/T_p - 0.5 - t_m/(2*T_p) - floor(t/T_p - 0.5 - t_m/(2*T_p))))))", color: azul, rotulo: "G₂" }
        - { expr: "-1 + 0.6*min(1, max(0, ceil(0.5 - t_m/T_p - (t/T_p - t_m/(2*T_p) - floor(t/T_p - t_m/(2*T_p))))))*min(1, max(0, ceil(0.5 - t_m/T_p - (t/T_p - 0.5 - t_m/(2*T_p) - floor(t/T_p - 0.5 - t_m/(2*T_p))))))", color: tinta, rotulo: "las dos a la vez" }
      lectura: { valor: solape, rotulo: "Solape" }
      datos:
        - { valor: muerto, rotulo: "Las dos apagadas: {{muerto}}" }
      mandos:
        - { valor: t_m, min: -1e-6, max: 1e-6, paso: 1e-7, rotulo: "Tiempo muerto" }
    requiere: { mover: [t_m] }

  - id: prediga-cruzada
    tipo: predecir
    titulo: "Un solape de nanosegundos"
    texto: "Las dos puertas de una rama se solapan, aunque sea unos nanosegundos. ¿Qué ocurre?"
    libro: [153]
    fijar: { t_m: -3e-7 }
    widget:
      tipo: figura
      figura: fig-33.6
      zonas:
        - { id: muerto, rotulo: "Abajo a la derecha", rect: [205, 145, 240, 140] }
    opciones:
      - texto: "Cortocircuitan la alimentación: cientos de amperios y destrucción inmediata"
        bien: true
        porque: "Los dos interruptores en serie unen V_{in} con masa sin nada que limite la corriente."
      - texto: "Nada grave: es muy poco tiempo"
        porque: "En nanosegundos ya circulan cientos de amperios: la destrucción es inmediata."
      - texto: "Baja un poco el rendimiento"
        porque: "No es una pérdida más: es un cortocircuito de la alimentación."
    escalera:
      - "Siga el camino de V_{in} a masa por los dos interruptores de la rama."
    solucion: "Un cortocircuito de la alimentación: cientos de amperios."

  - id: defensas
    tipo: pregunta
    titulo: "Tres defensas"
    texto: "Empareje cada defensa contra la conducción cruzada con cómo actúa."
    libro: [155, 156, 157]
    widget:
      tipo: figura
      figura: fig-33.6
      zonas:
        - { id: muerto, rotulo: "Abajo a la derecha", rect: [205, 145, 240, 140] }
    emparejar:
      - ["Tiempo muerto", "Lo genera el controlador; cubre el peor retardo de los drivers"]
      - ["Enclavamiento", "El driver impide por hardware la conducción simultánea"]
      - ["Detección de saturación", "Corta si el interruptor conduce con tensión alta"]
    exito: "La primera evita el solape; las otras dos lo atrapan si ocurre."
    pistas:
      - { texto: "La que mira la tensión del interruptor conduciendo es la detección de saturación." }
    escalera:
      - "Una es del controlador, otra del driver y otra vigila el propio interruptor."
    solucion: "Tiempo muerto: controlador. Enclavamiento: driver. Saturación: corta si conduce con tensión alta."

  - id: bootstrap
    tipo: pregunta
    titulo: "El interruptor de arriba"
    texto: "Su fuente flota entre masa y la alimentación. Con un bootstrap, ¿por qué no puede trabajar al 100 %?"
    libro: [159, 161, 162]
    widget:
      tipo: figura
      figura: fig-33.6
      zonas:
        - { id: cruzada, rotulo: "La rama", rect: [20, 145, 160, 165] }
    opciones:
      - texto: "El condensador solo se recarga cuando el nodo baja"
        bien: true
        porque: "Al 100 % el nodo nunca baja y el bootstrap se descarga; una alimentación aislada no tiene ese límite."
      - texto: "Porque el interruptor de abajo se calentaría"
        porque: "Al 100 % el de abajo ni conduce; el problema es recargar el bootstrap."
      - texto: "Porque el tiempo muerto lo impide"
        porque: "El tiempo muerto separa las dos puertas; el límite del 100 % viene del bootstrap."
    escalera:
      - "¿Cuándo se recarga el condensador del bootstrap?"
    solucion: "Necesita que el nodo baje periódicamente para recargarse."

  - id: por-que-desequilibrio
    tipo: porque
    titulo: "Semiciclos casi iguales"
    texto: "Si los dos semiciclos de un puente difieren un poco, el núcleo acaba saturando. ¿Por qué?"
    libro: [164, 165]
    widget:
      tipo: figura
      figura: fig-33.6
      zonas:
        - { id: tabla, rotulo: "La tabla", rect: [0, 0, 451, 105] }
    opciones:
      - texto: "Acumula un pequeño desplazamiento en cada ciclo"
        bien: true
        porque: "Lo bloquea un condensador en serie con el primario, o lo equilibra el modo corriente."
      - texto: "Porque el núcleo se calienta con la diferencia"
        porque: "No es calor: es una componente continua que se suma ciclo a ciclo."
      - texto: "Porque se usa en un solo cuadrante"
        porque: "Al revés: las simétricas usan los dos cuadrantes; el riesgo es la asimetría que se acumula."
    escalera:
      - "Si cada ciclo deja un poco de flujo de más, ¿qué pasa tras miles de ciclos?"
    solucion: "Cada ciclo deja un pequeño desplazamiento que se acumula hasta saturar: condensador en serie o modo corriente."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [143, 150, 155, 161, 164]
    ideas:
      - { titulo: "Dos cuadrantes.", texto: "Push-pull, medio puente y puente completo aprovechan el núcleo y reparten la corriente." }
      - { titulo: "El puente domina.", texto: "Sus interruptores soportan solo V_{in}: menos R_{DS(on)}, menos pérdidas." }
      - { titulo: "Conducción cruzada.", texto: "Tiempo muerto, enclavamiento y detección de saturación." }
      - { titulo: "El de arriba y el núcleo.", texto: "Bootstrap o alimentación aislada; condensador en serie contra el desequilibrio." }
