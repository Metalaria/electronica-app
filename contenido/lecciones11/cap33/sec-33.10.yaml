# Lección 1.2 de la sección 33.12 «Por Qué el FM7303 Renuncia a Todo Esto» (cap33, sec-33.10). Formato: GUIA.md.
# - El regulador lineal del receptor, de 9 V a 5 V (bloque 403), con el esquema «regulador-lineal» sin divisor ni
#   dropout; la carga de 50 Ω (100 mA) es mía: el libro solo dice «unos pocos vatios» como mucho.
# - La figura 33.11 con zonas (criterios, solución mixta, el receptor).
# Sin paso práctico: el «banco» del libro (pilas frente a adaptador) es de oído, sin un número que comparar.
# 1.2.1 (autor121-pot, «aprender haciendo», GUIA §13): se baja la entrada hasta que más de la mitad llega al
# receptor (objetivo), se escribe el rendimiento de 9 V a 5 V con las lecturas, se calcula lo que disipa con 100 mA
# (valor de ejemplo) y se tocan en la figura la conmutada para elevar y la solución mixta. Quedan dos preguntas (el
# ruido y las pilas); las razones, los criterios y la ferrita pasan a explicaciones y resumen.
leccion: cap33/sec-33.10

libro:
  401: "Los armónicos de un conmutador a 500 kHz caen dentro de las bandas de recepción"
  402: "la disipación de un lineal es asumible"
  403: "de 9 a 5 V es un 56 %"
  404: "Un regulador lineal son tres componentes"
  406: "la eficiencia no es el único criterio"
  407: "Hay que elevar o invertir"
  408: "conmutada para el grueso, seguida de un LDO para las alimentaciones sensibles"
  409: "cualquier equipo moderno con partes analógicas y digitales"
  414: "Filtrado de la entrada con una bobina o ferrita"
  415: "todo el problema de ruido se traslada a ese adaptador"
  418: "Con pilas, silencio"
  419: "Criterios para elegir entre regulador lineal y conmutada"

modelo:
  valores:
    V_i: { sim: "V_{in}", nombre: "tensión de entrada", unidad: V, valor: 12 }
    V_o5: { sim: "V_{ref}", nombre: "tensión de salida fijada", unidad: V, valor: 5 }
    R_L: { sim: "R_{L}", nombre: "carga del receptor", unidad: Ω, valor: 50 }
  calculos:
    V_o: { expr: "min(V_o5, V_i)", sim: "V_{out}", nombre: "tensión de salida", unidad: V }
    I_L: { expr: "V_o/R_L", sim: "I", nombre: "corriente del receptor", unidad: A }
    P_paso: { expr: "(V_i - V_o)*I_L", sim: "P_{paso}", nombre: "potencia en el elemento de paso", unidad: W }
    eta: { expr: "V_o/V_i*100", sim: "η", nombre: "rendimiento", unidad: "%" }
    P_out: { expr: "V_o*I_L", sim: "P_{out}", nombre: "potencia del receptor", unidad: W }

tarjetas:
  - id: explore-receptor
    tipo: explorar
    titulo: "Un lineal en el receptor"
    texto: "El regulador lineal del receptor da 5 V. Baje la entrada hasta que más de la mitad de la energía llegue al receptor."
    libro: [402, 403]
    inicio: { V_i: 12 }
    widget:
      tipo: circuito
      esquema: regulador-lineal
      piezas: { entrada: V_i, ref: V_o5, carga: R_L }
      lectura: { valor: eta, rotulo: "Rendimiento" }
      datos:
        - { valor: P_paso, rotulo: "Disipa {{P_paso}}" }
      corriente: I_L
      mide: { vout: V_o, iin: I_L, iout: I_L, icarga: I_L, p_paso: P_paso }
      mandos:
        - { valor: V_i, min: 6, max: 15, paso: 0.5, rotulo: "Entrada, V_{in}" }
    objetivo:
      condiciones:
        - { valor: eta, min: 51, rotulo: "Rendimiento: {{eta}}" }
      logrado: "Con {{V_i}}, rinde {{eta}}: con poca diferencia de tensión, el lineal es aceptable."
      pistas:
        - { texto: "Todavía se pierde más de la mitad: baje la entrada." }
    escalera:
      - "Un lineal rinde V_{out}/V_{in}."
    solucion: "9,5 V o menos; con la pila de 9 V, un 56 %."
    comprobar:
      - { con: { V_i: 9.5 }, eta: 52.6 }
      - { con: { V_i: 9 }, eta: 55.6, tol: 0.002 }

  - id: estime-rendimiento
    tipo: leer
    titulo: "De 9 V a 5 V"
    texto: "Con la entrada y la salida que marca el regulador, escriba su rendimiento."
    libro: [403]
    fijar: { V_i: 9 }
    widget:
      tipo: circuito
      esquema: regulador-lineal
      piezas: { entrada: V_i, ref: V_o5, carga: R_L }
      lectura: { valor: V_o, rotulo: "Salida" }
      datos:
        - { valor: V_i, rotulo: "Entrada: {{V_i}}" }
      corriente: I_L
      mide: { vout: V_o, iin: I_L }
      mandos: []
    leer:
      objetivo: eta
      unidad: "%"
      tol: 0.02
      rotulo: "Rendimiento"
      errores:
        - { expr: "100 - eta", texto: "Esa es la parte que se pierde en el paso. El rendimiento es lo que llega." }
    exito: "Un 56 %: pobre en abstracto, aceptable con la potencia de un receptor."
    escalera:
      - "η = V_{out}/V_{in}."
    solucion: "5/9 = 56 %."
    comprobar:
      - { eta: 55.6, tol: 0.002 }

  - id: simule-disipa
    tipo: simular
    titulo: "Lo que se calienta"
    texto: "Valores de ejemplo: el receptor consume 100 mA. ¿Cuánto disipa el regulador de 9 V a 5 V?"
    libro: [402, 403]
    fijar: { V_i: 9, R_L: 50 }
    widget:
      tipo: circuito
      esquema: regulador-lineal
      piezas: { entrada: V_i, ref: V_o5, carga: R_L }
      lectura: { valor: P_paso, rotulo: "Disipa" }
      corriente: I_L
      mide: { p_paso: P_paso, icarga: I_L }
      ocultar: true
      mandos: []
    simular:
      objetivo: P_paso
      unidad: W
      tol: 0.03
      rotulo: "Potencia en el paso"
      medida: p_paso
      errores:
        - { expr: "P_out", texto: "Esa es la del receptor, 5 V por 100 mA. El paso cae la diferencia." }
    exito: "0,4 W: asumible, y no justifica la complejidad de una conmutada. Tres componentes, nada que oscile ni radie."
    escalera:
      - "(9 − 5) V por la corriente."
    solucion: "(9 − 5) V × 100 mA = 0,4 W."
    comprobar:
      - { P_paso: 0.4, P_out: 0.5, I_L: 0.1 }

  - id: ruido
    tipo: pregunta
    titulo: "La razón de fondo"
    texto: "¿Por qué un receptor de radio no lleva fuente conmutada?"
    libro: [401]
    widget:
      tipo: figura
      figura: fig-33.11
      zonas:
        - { id: receptor, rotulo: "Recuadro de abajo a la derecha", rect: [273, 130, 170, 84] }
    opciones:
      - texto: "Los armónicos del conmutador caerían en las bandas de recepción"
        bien: true
        porque: "Un receptor está hecho para detectar señales diminutas: los armónicos de 500 kHz crean puntos ciegos."
      - texto: "Porque el lineal es más eficiente"
        porque: "Al contrario: de 9 a 5 V rinde un 56 %. Se elige pese a eso, por el ruido."
      - texto: "Porque un lineal puede elevar la tensión"
        porque: "Un lineal no eleva: solo puede bajar."
    escalera:
      - "¿Qué hace un receptor, y qué genera un conmutador?"
    solucion: "El ruido: los armónicos de la conmutación caen en las bandas que el receptor quiere oír."

  - id: criterios
    tipo: tocar
    titulo: "Lineal o conmutada"
    texto: "Hay que elevar la tensión, o invertirla. Toque el recuadro de lo que conviene."
    libro: [407, 419]
    widget:
      tipo: figura
      figura: fig-33.11
      zonas:
        - { id: lineal, rotulo: "Recuadro de arriba a la izquierda", rect: [3, 3, 141, 118] }
        - { id: conmutada, rotulo: "Recuadro de arriba a la derecha", rect: [233, 3, 210, 118] }
        - { id: mixta, rotulo: "Abajo a la izquierda", rect: [0, 130, 247, 93] }
        - { id: receptor, rotulo: "Recuadro de abajo a la derecha", rect: [273, 130, 170, 84] }
    tocar:
      bien: [conmutada]
      porque:
        lineal: "Un lineal solo puede bajar la tensión: elevar o invertir no está a su alcance."
        mixta: "La mixta baja con una conmutada y limpia con un LDO; elevar lo hace la conmutada."
        receptor: "El receptor usa un lineal porque su caso es el contrario: poca potencia y ruido que importa."
    exito: "La conmutada: elevar o invertir no deja elección. El lineal, cuando importan el ruido, la poca diferencia o lo analógico sensible."
    escalera:
      - "Un lineal solo puede bajar."
    solucion: "Arriba a la derecha, la conmutada."

  - id: mixta
    tipo: tocar
    titulo: "Lo mejor de los dos"
    texto: "Un equipo moderno con partes analógicas y digitales. Toque la solución que alimenta así lo analógico sensible."
    libro: [408, 409]
    widget:
      tipo: figura
      figura: fig-33.11
      zonas:
        - { id: lineal, rotulo: "Recuadro de arriba a la izquierda", rect: [3, 3, 141, 118] }
        - { id: conmutada, rotulo: "Recuadro de arriba a la derecha", rect: [233, 3, 210, 118] }
        - { id: mixta, rotulo: "Abajo a la izquierda", rect: [0, 130, 247, 93] }
        - { id: receptor, rotulo: "Recuadro de abajo a la derecha", rect: [273, 130, 170, 84] }
    tocar:
      bien: [mixta]
      porque:
        lineal: "Solo lineales: con la potencia de un equipo así, el grueso disiparía demasiado."
        conmutada: "Solo conmutadas: rinden, pero su ruido llega a lo analógico."
        receptor: "El receptor es un caso de poca potencia: le basta un lineal."
    exito: "Conmutada para el grueso y un LDO detrás: rendimiento del conmutador y ruido bajo del lineal, a costa de una caída pequeña."
    escalera:
      - "Busque la que combina las dos."
    solucion: "Abajo a la izquierda, la mixta."

  - id: prediga-pilas
    tipo: predecir
    titulo: "Pilas o adaptador"
    texto: "El receptor se alimenta primero con pilas y luego con un adaptador conmutado barato. ¿Qué se oye?"
    libro: [415, 418]
    widget:
      tipo: figura
      figura: fig-33.11
      zonas:
        - { id: receptor, rotulo: "Recuadro de abajo a la derecha", rect: [273, 130, 170, 84] }
    opciones:
      - texto: "Con pilas silencio; con el adaptador, zumbidos o silbidos en frecuencias concretas"
        bien: true
        porque: "El problema de ruido se traslada al adaptador, que parece culpa del receptor."
      - texto: "Lo mismo: el regulador lineal limpia todo"
        porque: "El lineal ayuda, pero el ruido del adaptador entra igual por la alimentación y por radiación."
      - texto: "Más ruido con pilas"
        porque: "Las pilas no conmutan: son la fuente más silenciosa."
    escalera:
      - "¿Cuál de las dos fuentes conmuta?"
    solucion: "Con pilas silencio; con muchos adaptadores, zumbidos y silbidos."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [401, 403, 404, 406, 408, 414]
    ideas:
      - { titulo: "El ruido manda.", texto: "Un receptor no tolera los armónicos de un conmutador." }
      - { titulo: "Lineal aceptable.", texto: "De 9 a 5 V, un 56 %, con poca potencia." }
      - { titulo: "Más de un criterio.", texto: "Ruido, diferencia de tensión, potencia, simplicidad. Y la ferrita de entrada frena el ruido del adaptador." }
      - { titulo: "Solución mixta.", texto: "Conmutada para el grueso y LDO para lo sensible." }
