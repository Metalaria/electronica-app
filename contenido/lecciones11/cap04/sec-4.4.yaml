# Lección 1.1 de la sección 4.4 «Tipos de Núcleos Magnéticos» (cap04): el núcleo multiplica L por µr y a cambio
# limita (frecuencia, saturación, pérdidas); aire, ferrita, hierro laminado, polvo de hierro y amorfos; las formas
# de núcleo, la tabla de elección y cómo reconocer un núcleo en el banco. Formato: contenido/lecciones11/GUIA.md.
# 1.2.1 (autor121-fund, «aprender haciendo», GUIA §13): pasar del henrio con el núcleo, predecir la ferrita y
# tocar en el mapa de materiales (fig. 4.8) el de cientos de megahercios, el de la red y el polvo de hierro; se eligen
# por qué limita y chapa o ferrita. Saturaciones, Curie, formas y AL quedan en los textos y el resumen.
leccion: cap04/sec-4.4

libro:
  93: "multiplica la inductancia por µr, que puede valer desde 10 hasta 100 000 según el material"
  95: "no satura nunca, no tiene pérdidas de núcleo y es perfectamente lineal"
  96: "el campo se cierra por el aire y por tanto radia"
  98: "es eléctricamente aislante, lo que suprime las corrientes de Foucault"
  99: "útil hasta unos pocos megahercios"
  100: "deja de funcionar de golpe al superar la Curie"
  102: "Saturación alta (1,5 a 2 T)"
  103: "Cuanto más finas las chapas, más alta la frecuencia útil"
  105: "ese aglomerante crea un entrehierro distribuido"
  106: "Saturación suave: la inductancia decae progresivamente con la corriente"
  107: "A cambio, las pérdidas de núcleo son mayores"
  109: "de 1,2 T en los nanocristalinos a 1,5 T en los amorfos de hierro"
  112: "mínima radiación y mínima susceptibilidad a campos externos"
  113: "lo que permite automatizar la producción"
  114: "blindaje excelente, pero mala evacuación del calor"
  115: "es la antena de ferrita de un receptor de AM"
  120: "cada región llega hasta la frecuencia máxima útil del material"
  117: "Transformador de red (50 Hz)"
  119: "un toroide amarillo y blanco es polvo de hierro"
  "cap04#19": "tiene 25,1 µH con núcleo de aire"
  "cap04#341": "Explica por qué un transformador de 50 Hz usa chapa laminada"

modelo:
  valores:
    L_0: { sim: "L_{aire}", nombre: "inductancia del solenoide sin núcleo", unidad: H, valor: 25.13e-6 }
    mu_r: { sim: "µ_{r}", nombre: "permeabilidad relativa del núcleo", unidad: "", valor: 1 }
  calculos:
    L_n: { expr: "mu_r*L_0", sim: "L", nombre: "inductancia con núcleo", unidad: H }

tarjetas:
  - id: explore-multiplica
    tipo: explorar
    titulo: "El núcleo multiplica"
    texto: "El solenoide de la sección 4.1 tiene 25,1 µH sin núcleo, y un núcleo la multiplica por su µr. Busque un material que la lleve por encima del henrio."
    libro: [93, "cap04#19"]
    widget:
      tipo: grafica
      x: { id: m, min: 1, max: 100000, unidad: "", rotulo: "µ_{r}", escala: log }
      y: { min: 0.00001, max: 10, unidad: H, rotulo: "L", escala: log }
      curvas:
        - { expr: "m*L_0", color: naranja, rotulo: "L = µ_{r}·L_{aire}" }
      asas:
        - { mueve: mu_r, x: "mu_r", y: "L_n", rotulo: "Permeabilidad" }
      lectura: { valor: L_n, rotulo: "Inductancia con núcleo" }
      mandos:
        - { valor: mu_r, lista: [1, 10, 100, 1000, 2000, 15000, 100000], rotulo: "Permeabilidad, µ_{r}" }
    inicio: { mu_r: 1 }
    objetivo:
      condiciones:
        - { valor: L_n, min: 1, rotulo: "L = {{L_n}}" }
      logrado: "Con µr = {{mu_r}}, {{L_n}}: de 25,1 µH a más de un henrio sin tocar el bobinado. µr va de 10 a 100 000 según el material."
      pistas:
        - { texto: "Más permeabilidad." }
    escalera:
      - "L = µ_{r}·L_{aire}: hace falta µr de varias decenas de miles."
    solucion: "Con µr = 100 000: 2,51 H."
    comprobar:
      - { L_n: 25.13e-6 }
      - { con: { mu_r: 100000 }, L_n: 2.513 }

  - id: prediga-ferrita
    tipo: simular
    titulo: "Prediga"
    texto: "El mismo solenoide de 25,1 µH, ahora con un núcleo de ferrita de µr = 2000. ¿Qué inductancia tendrá?"
    libro: ["cap04#19"]
    fijar: { mu_r: 2000 }
    widget:
      tipo: figura
      figura: fig-4.1
      zonas:
        - { id: magneticos, rotulo: "Componentes magnéticos reales", rect: [0, 0, 1600, 478] }
    simular:
      objetivo: L_n
      unidad: H
      tol: 0.03
      rotulo: "L con ferrita"
      errores:
        - { razon: { min: 0.0004, max: 0.0006 }, texto: "El núcleo concentra el flujo: multiplica la inductancia por µr." }
    exito: "50,3 mH: dos mil veces 25,1 µH. Esa es la razón de que existan los núcleos."
    escalera:
      - "El núcleo multiplica la inductancia por µr."
    solucion: "2000 × 25,1 µH = 50,3 mH."
    comprobar:
      - { L_n: 50.26e-3 }
  - id: porque-limita
    tipo: porque
    titulo: "Y también limita"
    texto: "Si un núcleo multiplica tanto, ¿por qué hay tantas tecnologías y no una sola, la de µr más alta?"
    libro: [93]
    opciones:
      - texto: "Ningún material es bueno en frecuencia, saturación y pérdidas a la vez"
        bien: true
        porque: "Cada material limita hasta qué frecuencia sirve, cuánto flujo aguanta y cuánto pierde por ciclo."
      - texto: "Por el precio, solo"
        porque: "El precio cuenta, pero lo que decide son tres límites técnicos que ningún material cumple a la vez."
      - texto: "Porque µr alta da poca inductancia"
        porque: "Es al revés: µr multiplica la inductancia. El problema son los límites que trae."
    widget:
      tipo: figura
      figura: fig-4.16
      zonas:
        - { id: entrehierro, rotulo: "Con y sin entrehierro", rect: [0, 0, 440, 213] }
    escalera:
      - "Piense en tres límites: frecuencia, saturación y pérdidas."
    solucion: "Ningún material es bueno en frecuencia, saturación y pérdidas a la vez."

  - id: empareje-frecuencia
    tipo: tocar
    titulo: "Hasta qué frecuencia sirve"
    texto: "Cada región llega hasta la frecuencia máxima útil del material. Toque el núcleo de las cuentas de supresión, útil hasta cientos de megahercios."
    libro: [99, 102, 109, 120]
    widget:
      tipo: figura
      figura: fig-4.8
      zonas:
        - { id: amorfo, rotulo: "Amorfo / nanocristalino", rect: [79, 34, 178, 35] }
        - { id: hierro, rotulo: "Hierro laminado", rect: [47, 69, 74, 35] }
        - { id: mnzn, rotulo: "Ferrita MnZn", rect: [187, 69, 113, 35] }
        - { id: polvo, rotulo: "Polvo de hierro", rect: [79, 125, 217, 35] }
        - { id: nizn, rotulo: "Ferrita NiZn", rect: [300, 104, 108, 55] }
        - { id: aire, rotulo: "Aire", rect: [234, 165, 188, 35] }
    tocar:
      bien: [nizn]
      porque:
        amorfo: "Pérdidas bajas, pero solo hasta cientos de kilohercios."
        hierro: "Conductor: su límite son unos cientos de hercios."
        mnzn: "Útil hasta unos pocos megahercios: la de las conmutadas."
        polvo: "No pasa de las fuentes conmutadas y los filtros de red."
        aire: "Llega igual de arriba, pero no es un material de núcleo: µr = 1."
    exito: "La ferrita NiZn: aislante, sin corrientes de Foucault. Cuanto más aislante el material, más alta la frecuencia útil."
    escalera:
      - "Lea dónde termina cada región en el eje de frecuencia."
    solucion: "Ferrita NiZn."
  - id: empareje-eleccion
    tipo: tocar
    titulo: "Tabla de elección"
    texto: "Transformador de red, 50 Hz: hace falta saturación alta y un material barato. Toque su núcleo."
    libro: [102, 109, 117]
    widget:
      tipo: figura
      figura: fig-4.8
      zonas:
        - { id: amorfo, rotulo: "Amorfo / nanocristalino", rect: [79, 34, 178, 35] }
        - { id: hierro, rotulo: "Hierro laminado", rect: [47, 69, 74, 35] }
        - { id: mnzn, rotulo: "Ferrita MnZn", rect: [187, 69, 113, 35] }
        - { id: polvo, rotulo: "Polvo de hierro", rect: [79, 125, 217, 35] }
        - { id: nizn, rotulo: "Ferrita NiZn", rect: [300, 104, 108, 55] }
        - { id: aire, rotulo: "Aire", rect: [234, 165, 188, 35] }
    tocar:
      bien: [hierro]
      porque:
        amorfo: "Llega a 50 Hz, pero es caro: se usa donde el rendimiento o el tamaño lo justifican."
        mnzn: "No llega tan abajo, y satura pronto: 0,3 a 0,5 T."
        polvo: "Para bobinas con corriente continua; pierde más en el núcleo."
        nizn: "Para radiofrecuencia."
        aire: "Daría muy poca inductancia: haría falta mucho hilo."
    exito: "Hierro laminado: satura a 1,5 a 2 T y el laminado corta las corrientes de Foucault. La frecuencia elige el material; el confinamiento del campo, la forma."
    escalera:
      - "Lea qué región cruza la línea de 50 Hz."
    solucion: "Hierro laminado."
  - id: porque-ferrita
    tipo: porque
    titulo: "Chapa o ferrita"
    texto: "Un transformador de 50 Hz usa chapa laminada; el de una fuente conmutada de 100 kHz, ferrita. ¿Por qué?"
    libro: [98, 102, 103, "cap04#341"]
    opciones:
      - texto: "A 100 kHz, la chapa se llenaría de corrientes de Foucault"
        bien: true
        porque: "Crecen con el cuadrado de la frecuencia. La ferrita, aislante, apenas las permite."
      - texto: "La ferrita satura más tarde"
        porque: "Al contrario: satura antes, de 0,3 a 0,5 T, frente a 1,5 a 2 T del hierro."
      - texto: "La ferrita tiene más permeabilidad"
        porque: "La de la chapa también es alta. Lo que decide es que la ferrita no conduce."
    widget:
      tipo: figura
      figura: fig-4.8
      zonas:
        - { id: materiales, rotulo: "Mapa de materiales de núcleo", rect: [0, 0, 446, 230] }
    escalera:
      - "¿Qué hace un núcleo conductor con un campo que cambia muy deprisa?"
    solucion: "A 100 kHz la chapa se llenaría de corrientes de Foucault; la ferrita, aislante, apenas tiene."

  - id: pregunta-polvo
    tipo: tocar
    titulo: "Polvo de hierro"
    texto: "Un aglomerante crea un entrehierro distribuido: saturación suave a cambio de permeabilidad baja y estable, y más pérdidas. Tóquelo en el mapa."
    libro: [105, 106, 107, 119]
    widget:
      tipo: figura
      figura: fig-4.8
      zonas:
        - { id: amorfo, rotulo: "Amorfo / nanocristalino", rect: [79, 34, 178, 35] }
        - { id: hierro, rotulo: "Hierro laminado", rect: [47, 69, 74, 35] }
        - { id: mnzn, rotulo: "Ferrita MnZn", rect: [187, 69, 113, 35] }
        - { id: polvo, rotulo: "Polvo de hierro", rect: [79, 125, 217, 35] }
        - { id: nizn, rotulo: "Ferrita NiZn", rect: [300, 104, 108, 55] }
        - { id: aire, rotulo: "Aire", rect: [234, 165, 188, 35] }
    tocar:
      bien: [polvo]
      porque:
        amorfo: "Permeabilidad muy alta: no es este."
        hierro: "Chapas apiladas, con µr alta."
        mnzn: "Ferrita, con µr de 1000 a 15 000."
        nizn: "También tiene µr baja, pero es ferrita, útil hasta cientos de megahercios."
        aire: "Sin núcleo: µr = 1."
    exito: "Son los toroides amarillos y blancos. Con unas espiras de prueba se mide su AL, inductancia por espira al cuadrado, para calcular las vueltas."
    escalera:
      - "Busque µr entre 10 y 100 hasta las conmutadas."
    solucion: "El polvo de hierro."
  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [93, 95, 96, 98, 100, 102, 106, 112, 113, 114, 115, 117]
    ideas:
      - { titulo: "Multiplica y limita.", texto: "µr multiplica L, pero cada material limita frecuencia, saturación y pérdidas." }
      - { titulo: "Ferrita.", texto: "Aislante, sin Foucault: llega a megahercios, pero satura pronto y teme la Curie." }
      - { titulo: "Hierro laminado.", texto: "Satura tarde, pero solo sirve hasta unos cientos de hercios." }
      - { titulo: "Polvo, aire y forma.", texto: "El polvo satura suave; el aire no satura nunca, pero radia. El toroide no radia; la barra, sí: la antena de AM." }
