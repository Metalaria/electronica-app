# Lección 1.1 de la sección 4.4 «Tipos de Núcleos Magnéticos» (cap04): el núcleo multiplica L por µr y a cambio
# limita (frecuencia, saturación, pérdidas); aire, ferrita, hierro laminado, polvo de hierro y amorfos; las formas
# de núcleo, la tabla de elección y cómo reconocer un núcleo en el banco. Formato: contenido/lecciones11/GUIA.md.
leccion: cap04/sec-4.4

libro:
  93: "multiplica la inductancia por µr, que puede valer desde 10 hasta 100 000 según el material"
  95: "no satura nunca, no tiene pérdidas de núcleo y es perfectamente lineal"
  96: "el campo se cierra por el aire y por tanto radia"
  98: "es eléctricamente aislante, lo que suprime las corrientes de Foucault"
  99: "útil hasta unos pocos megahercios"
  100: "deja de funcionar de golpe al superar la Curie"
  102: "Saturación alta (1,5 a 2 T)"
  103: "Cuanto más finas las chapas, más alta la frecuencia útil"
  106: "Saturación suave: la inductancia decae progresivamente con la corriente"
  107: "A cambio, las pérdidas de núcleo son mayores"
  109: "de 1,2 T en los nanocristalinos a 1,5 T en los amorfos de hierro"
  112: "mínima radiación y mínima susceptibilidad a campos externos"
  113: "lo que permite automatizar la producción"
  114: "blindaje excelente, pero mala evacuación del calor"
  115: "es la antena de ferrita de un receptor de AM"
  117: "Transformador de red (50 Hz)"
  119: "un toroide amarillo y blanco es polvo de hierro"
  "cap04#19": "tiene 25,1 µH con núcleo de aire"
  "cap04#341": "Explica por qué un transformador de 50 Hz usa chapa laminada"

modelo:
  valores:
    L_0: { sim: "L_{aire}", nombre: "inductancia del solenoide sin núcleo", unidad: H, valor: 25.13e-6 }
    mu_r: { sim: "µ_{r}", nombre: "permeabilidad relativa del núcleo", unidad: "", valor: 1 }
  calculos:
    L_n: { expr: "mu_r*L_0", sim: "L", nombre: "inductancia con núcleo", unidad: H }

tarjetas:
  - id: explore-multiplica
    tipo: explorar
    titulo: "El núcleo multiplica"
    texto: "El solenoide de la sección 4.1 tiene 25,1 µH sin núcleo, y un núcleo la multiplica por su µr. Recorra los materiales."
    nota: "µr va de 10 a 100 000 según el material."
    libro: [93, "cap04#19"]
    widget:
      tipo: grafica
      x: { id: m, min: 1, max: 100000, unidad: "", rotulo: "µ_{r}", escala: log }
      y: { min: 0.00001, max: 10, unidad: H, rotulo: "L", escala: log }
      curvas:
        - { expr: "m*L_0", color: naranja, rotulo: "L = µ_{r}·L_{aire}" }
      asas:
        - { mueve: mu_r, x: "mu_r", y: "L_n", rotulo: "Permeabilidad" }
      lectura: { valor: L_n, rotulo: "Inductancia con núcleo" }
      mandos:
        - { valor: mu_r, lista: [1, 10, 100, 1000, 2000, 15000, 100000], rotulo: "Permeabilidad, µ_{r}" }
    requiere: { mover: [mu_r] }

  - id: prediga-ferrita
    tipo: predecir
    titulo: "Prediga"
    texto: "El mismo solenoide de 25,1 µH, ahora con un núcleo de ferrita de µr = 2000. ¿Qué inductancia tendrá?"
    libro: ["cap04#19"]
    fijar: { mu_r: 2000 }
    widget:
      tipo: grafica
      x: { id: m, min: 1, max: 100000, unidad: "", rotulo: "µ_{r}", escala: log }
      y: { min: 0.00001, max: 10, unidad: H, rotulo: "L", escala: log }
      curvas:
        - { expr: "m*L_0", color: naranja, rotulo: "L = µ_{r}·L_{aire}" }
      lectura: { valor: L_n, rotulo: "Inductancia con núcleo" }
      ocultar: true
    opciones:
      - texto: "50,3 mH"
        bien: true
        porque: "Dos mil veces 25,1 µH. Esa es la razón de que existan los núcleos."
      - texto: "Los mismos 25,1 µH"
        porque: "El núcleo concentra el flujo: multiplica la inductancia por µr."
      - texto: "Algo más, pero poco"
        porque: "No es un retoque: multiplica por µr, aquí por dos mil."
    comprobar:
      - { L_n: 50.26e-3 }
    escalera:
      - "El núcleo multiplica la inductancia por µr."
    solucion: "Dos mil veces 25,1 µH: 50,3 mH."

  - id: porque-limita
    tipo: porque
    titulo: "Y también limita"
    texto: "Si un núcleo multiplica tanto, ¿por qué hay tantas tecnologías y no una sola, la de µr más alta?"
    libro: [93]
    opciones:
      - texto: "Ningún material es bueno en frecuencia, saturación y pérdidas a la vez"
        bien: true
        porque: "Cada material limita hasta qué frecuencia sirve, cuánto flujo aguanta y cuánto pierde por ciclo."
      - texto: "Por el precio, solo"
        porque: "El precio cuenta, pero lo que decide son tres límites técnicos que ningún material cumple a la vez."
      - texto: "Porque µr alta da poca inductancia"
        porque: "Es al revés: µr multiplica la inductancia. El problema son los límites que trae."
    widget:
      tipo: figura
      figura: fig-4.8
      zonas:
        - { id: materiales, rotulo: "Mapa de materiales de núcleo", rect: [0, 0, 446, 230] }
    escalera:
      - "Piense en tres límites: frecuencia, saturación y pérdidas."
    solucion: "Ningún material es bueno en frecuencia, saturación y pérdidas a la vez."

  - id: empareje-saturacion
    tipo: pregunta
    fase: "Empareje"
    titulo: "Cuánto flujo aguanta"
    texto: "Empareje cada material con su saturación."
    libro: [95, 100, 102, 109]
    emparejar:
      - ["Aire", "No satura nunca"]
      - ["Ferrita", "0,3 a 0,5 T"]
      - ["Hierro laminado", "1,5 a 2 T"]
      - ["Nanocristalino", "1,2 T"]
    exito: "Eso es. La ferrita satura pronto; el hierro aguanta casi cuatro veces más."
    pistas:
      - { texto: "El aire, sin dominios magnéticos, no puede saturar. La ferrita es la que antes satura." }
    escalera:
      - "Ordénelos primero de menos a más flujo."
    solucion: "Aire: no satura nunca. Ferrita: 0,3 a 0,5 T. Hierro laminado: 1,5 a 2 T. Nanocristalino: 1,2 T."

  - id: empareje-frecuencia
    tipo: pregunta
    fase: "Empareje"
    titulo: "Hasta qué frecuencia sirve"
    texto: "Empareje cada núcleo con su frecuencia útil."
    libro: [99, 102, 109]
    emparejar:
      - ["Hierro laminado", "Cientos de hercios"]
      - ["Amorfo", "Cientos de kilohercios"]
      - ["Ferrita MnZn", "Pocos megahercios"]
      - ["Ferrita NiZn", "Cientos de megahercios"]
    exito: "Eso es. El metal conductor se queda en baja frecuencia; la ferrita, aislante, llega muy arriba."
    pistas:
      - { texto: "Cuanto más aislante el material, menos corrientes de Foucault y más alta la frecuencia útil." }
    escalera:
      - "Piense en las corrientes de Foucault de cada material."
    solucion: "Hierro laminado: cientos de hercios. Amorfo: cientos de kilohercios. Ferrita MnZn: pocos megahercios. Ferrita NiZn: cientos de megahercios."

  - id: porque-ferrita
    tipo: porque
    titulo: "Chapa o ferrita"
    texto: "Un transformador de 50 Hz usa chapa laminada; el de una fuente conmutada de 100 kHz, ferrita. ¿Por qué?"
    libro: [98, 102, 103, "cap04#341"]
    opciones:
      - texto: "A 100 kHz, la chapa se llenaría de corrientes de Foucault"
        bien: true
        porque: "Crecen con el cuadrado de la frecuencia. La ferrita, aislante, apenas las permite."
      - texto: "La ferrita satura más tarde"
        porque: "Al contrario: satura antes, de 0,3 a 0,5 T, frente a 1,5 a 2 T del hierro."
      - texto: "La ferrita tiene más permeabilidad"
        porque: "La de la chapa también es alta. Lo que decide es que la ferrita no conduce."
    widget:
      tipo: figura
      figura: fig-4.8
      zonas:
        - { id: materiales, rotulo: "Mapa de materiales de núcleo", rect: [0, 0, 446, 230] }
    escalera:
      - "¿Qué hace un núcleo conductor con un campo que cambia muy deprisa?"
    solucion: "A 100 kHz la chapa se llenaría de corrientes de Foucault; la ferrita, aislante, apenas tiene."

  - id: pregunta-curie
    tipo: pregunta
    titulo: "Una avería que tarda en salir"
    texto: "El transformador de ferrita de una conmutada se calienta demasiado. ¿Qué le ocurre?"
    libro: [100]
    opciones:
      - texto: "Deja de funcionar de golpe"
        bien: true
        porque: "Al superar la temperatura de Curie la permeabilidad desaparece: la avería aparece tras minutos de funcionamiento."
      - texto: "Se degrada poco a poco"
        porque: "No es progresivo: por encima de la Curie, la permeabilidad desaparece por completo."
      - texto: "Nada: la ferrita no depende de la temperatura"
        porque: "Su permeabilidad depende mucho de la temperatura."
    widget:
      tipo: figura
      figura: fig-4.8
      zonas:
        - { id: materiales, rotulo: "Mapa de materiales de núcleo", rect: [0, 0, 446, 230] }
    escalera:
      - "¿Qué le pasa a la permeabilidad de la ferrita por encima de su temperatura de Curie?"
    solucion: "Deja de funcionar de golpe: por encima de la Curie, la permeabilidad desaparece."

  - id: pregunta-polvo
    tipo: pregunta
    titulo: "Polvo de hierro"
    texto: "Su aglomerante crea un entrehierro distribuido: miles de huecos entre partículas. ¿Qué gana con eso?"
    libro: [106, 107]
    opciones:
      - texto: "Una saturación suave"
        bien: true
        porque: "La inductancia decae poco a poco con la corriente, en lugar de desplomarse: da margen frente a picos."
      - texto: "Menos pérdidas de núcleo"
        porque: "A cambio, las pérdidas de núcleo son mayores."
      - texto: "Una permeabilidad muy alta"
        porque: "Es baja y estable, de 10 a 100: los huecos la reducen."
    widget:
      tipo: figura
      figura: fig-4.16
      zonas:
        - { id: entrehierro, rotulo: "Con y sin entrehierro", rect: [0, 0, 440, 213] }
    escalera:
      - "¿Qué hacen los huecos con la saturación?"
    solucion: "Una saturación suave: la inductancia decae poco a poco con la corriente."

  - id: empareje-formas
    tipo: pregunta
    fase: "Empareje"
    titulo: "La forma decide"
    texto: "La forma importa tanto como el material. Empareje cada forma con su rasgo."
    libro: [112, 113, 114, 115]
    emparejar:
      - ["Toroide", "Mínima radiación"]
      - ["E-E", "Montaje automático"]
      - ["Olla", "Calor mal evacuado"]
      - ["Barra", "Antena de AM"]
    exito: "Eso es. El camino cerrado no radia; el abierto, la barra, radia y capta, que es lo que quiere una antena."
    pistas:
      - { texto: "El toroide se bobina hilo a hilo por el agujero; el E-E se monta sobre un carrete ya bobinado." }
    escalera:
      - "¿Por dónde se cierra el flujo en cada forma?"
    solucion: "Toroide: mínima radiación. E-E: montaje automático. Olla: calor mal evacuado. Barra: antena de AM."

  - id: empareje-eleccion
    tipo: pregunta
    fase: "Empareje"
    titulo: "Tabla de elección"
    texto: "Empareje cada aplicación con su núcleo."
    libro: [117]
    emparejar:
      - ["Red, 50 Hz", "Hierro laminado"]
      - ["Conmutada, 100 kHz", "Ferrita MnZn, E-E"]
      - ["Supresión de RF", "Ferrita NiZn"]
      - ["Resonante de precisión", "Aire"]
      - ["Antena de AM", "Barra de ferrita"]
    exito: "Eso es. La frecuencia elige el material; el confinamiento del campo, la forma."
    pistas:
      - { texto: "Empiece por la frecuencia: hierro abajo, MnZn en conmutadas, NiZn en RF." }
    escalera:
      - "Empiece por la frecuencia de cada aplicación."
    solucion: "Red, 50 Hz: hierro laminado. Conmutada, 100 kHz: ferrita MnZn, E-E. Supresión de RF: ferrita NiZn. Resonante de precisión: aire. Antena de AM: barra de ferrita."

  - id: pregunta-banco
    tipo: pregunta
    titulo: "Un núcleo recuperado"
    texto: "Un toroide amarillo y blanco sin referencia. ¿Qué es, y qué dato le da medir unas pocas espiras de prueba?"
    libro: [119]
    opciones:
      - texto: "Polvo de hierro; su AL"
        bien: true
        porque: "AL es la inductancia por espira al cuadrado: con ella se calculan las vueltas necesarias."
      - texto: "Ferrita; su µr"
        porque: "La ferrita es gris oscura y quebradiza. Y lo que da la prueba es AL, inductancia por espira al cuadrado."
      - texto: "Hierro laminado; su saturación"
        porque: "El laminado son chapas apiladas, no un anillo de color. Las espiras de prueba dan AL."
    widget:
      tipo: figura
      figura: fig-4.1
      zonas:
        - { id: magneticos, rotulo: "Componentes magnéticos reales", rect: [0, 0, 1600, 478] }
    escalera:
      - "El color dice el material; las espiras de prueba, la inductancia por espira al cuadrado."
    solucion: "Polvo de hierro; su AL, con la que se calculan las espiras."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [93, 96, 98, 102, 106, 117]
    ideas:
      - { titulo: "Multiplica y limita.", texto: "µr multiplica L, pero cada material limita frecuencia, saturación y pérdidas." }
      - { titulo: "Ferrita.", texto: "Aislante, sin Foucault: llega a megahercios, pero satura pronto y teme la Curie." }
      - { titulo: "Hierro laminado.", texto: "Satura tarde, pero solo sirve hasta unos cientos de hercios." }
      - { titulo: "Polvo y aire.", texto: "El polvo satura suave; el aire no satura nunca, pero radia." }
