# Lección 1.1 de la sección 4.2 «Identificación Física de los Inductores» (cap04): el marcado de tres cifras en
# microhenrios, la cifra y letra, lo que dice el aspecto, la confusión con una resistencia, los tres parámetros que
# no van marcados, medir L sin medidor y la prueba del anillo. Formato: contenido/lecciones11/GUIA.md.
leccion: cap04/sec-4.2

libro:
  40: "Bobinado al aire, sin núcleo: pocas espiras, valores de nanohenrios"
  41: "el flujo se cierra por el aire, con lo que radia y capta"
  42: "Núcleo toroidal: el flujo queda confinado dentro del anillo"
  43: "su virtud es precisamente el confinamiento del campo"
  44: "Núcleo laminado de hierro: chapas apiladas, para baja frecuencia y alta potencia"
  46: "con el resultado en microhenrios"
  47: "una bobina medida con el óhmetro da unos pocos ohmios"
  48: "si mide muy poco y parece una resistencia de color raro, comprobar si es una bobina"
  51: "101 son 10 × 10¹ = 100 µH"
  52: "4R7 son 4,7 µH"
  53: "no dice nada de lo que de verdad limita, que es la corriente de saturación"
  56: "Determina las pérdidas de cobre y la caída en continua"
  57: "Una bobina de 100 µH que sature a 0,5 A es inútil en un convertidor de 2 A"
  58: "por encima de la cual la bobina se comporta como un condensador"
  61: "se pone en paralelo un condensador conocido"
  62: "se aplica un escalón a través de una resistencia conocida"
  65: "la prueba del anillo"
  66: "una con espiras en cortocircuito se amortigua en dos o tres"
  69: "10 × 10³ µH = 10 mH"
  "cap04#87": "midiendo el tiempo hasta el 63 % se obtiene τ y con ella L"

modelo:
  valores:
    c_1: { sim: "1.ª cifra", nombre: "primera cifra", unidad: "", valor: 1 }
    c_2: { sim: "2.ª cifra", nombre: "segunda cifra", unidad: "", valor: 0 }
    c_n: { sim: "ceros", nombre: "número de ceros (tercera cifra)", unidad: "", valor: 0 }
    V_m: { sim: "V", nombre: "escalón del generador", unidad: V, valor: 10 }
    R_m: { sim: "R", nombre: "resistencia conocida", unidad: Ω, valor: 100 }
    L_m: { sim: "L", nombre: "inductancia por medir", unidad: H, valor: 0.01 }
  calculos:
    codigo: { expr: "100*c_1 + 10*c_2 + c_n", sim: "código", nombre: "código impreso", unidad: "", cifras: 3, recortar: true }
    L_c: { expr: "(10*c_1 + c_2)*10^c_n*1e-6", sim: "L", nombre: "inductancia marcada", unidad: H, cifras: 3, recortar: true }
    tau_m: { expr: "L_m/R_m", sim: "τ", nombre: "constante de tiempo", unidad: s }
    I_mf: { expr: "V_m/R_m", sim: "I_{final}", nombre: "corriente final", unidad: A }
    v_tau: { expr: "0.632*V_m", sim: "v(τ)", nombre: "tensión en R al cabo de τ", unidad: V }

tarjetas:
  - id: explore-tres-cifras
    tipo: explorar
    titulo: "Tres cifras, en microhenrios"
    texto: "Como en los condensadores: dos dígitos y el número de ceros, con el resultado en microhenrios. Mueva las cifras."
    libro: [46, 51]
    widget:
      tipo: grafica
      x: { id: x, min: 0, max: 4, unidad: "", rotulo: "número de ceros" }
      y: { min: 0.000001, max: 1, unidad: H, rotulo: "L", escala: log }
      curvas:
        - { expr: "(10*c_1 + c_2)*10^x*1e-6", color: naranja, rotulo: "mismas cifras, más ceros" }
      asas:
        - { mueve: c_n, x: "c_n", y: "L_c", rotulo: "Número de ceros" }
      lectura: { valor: L_c, rotulo: "Inductancia" }
      datos:
        - { valor: codigo, rotulo: "Código impreso: «{{codigo}}»" }
      mandos:
        - { valor: c_1, min: 1, max: 9, paso: 1, rotulo: "Primera cifra" }
        - { valor: c_2, min: 0, max: 9, paso: 1, rotulo: "Segunda cifra" }
        - { valor: c_n, min: 0, max: 4, paso: 1, rotulo: "Tercera cifra: ceros" }
    requiere: { mover: [c_1, c_n] }

  - id: prediga-101
    tipo: predecir
    titulo: "Prediga"
    texto: "Una bobina SMD marcada «101». ¿Qué inductancia tiene?"
    libro: [51]
    fijar: { c_1: 1, c_2: 0, c_n: 1 }
    widget:
      tipo: grafica
      x: { id: x, min: 0, max: 4, unidad: "", rotulo: "número de ceros" }
      y: { min: 0.000001, max: 1, unidad: H, rotulo: "L", escala: log }
      curvas:
        - { expr: "(10*c_1 + c_2)*10^x*1e-6", color: naranja, rotulo: "mismas cifras, más ceros" }
      lectura: { valor: L_c, rotulo: "Inductancia" }
      ocultar: true
    opciones:
      - texto: "100 µH"
        bien: true
        porque: "Uno, cero y un cero más: 10 × 10¹ = 100 µH."
      - texto: "101 µH"
        porque: "La tercera cifra no es un dígito del valor: es el número de ceros."
      - texto: "100 Ω"
        porque: "Esa sería la lectura de una resistencia. En una bobina el resultado va en microhenrios."
    comprobar:
      - { L_c: 100e-6 }

  - id: reto-choque
    tipo: reto
    titulo: "Reto: el choque de 10 mH"
    texto: "Una bobina de choque radial de 10 mH. Ponga el código que lleva impreso."
    libro: [69]
    inicio: { c_1: 1, c_2: 0, c_n: 1 }
    widget:
      tipo: grafica
      x: { id: x, min: 0, max: 4, unidad: "", rotulo: "número de ceros" }
      y: { min: 0.000001, max: 1, unidad: H, rotulo: "L", escala: log }
      curvas:
        - { expr: "(10*c_1 + c_2)*10^x*1e-6", color: naranja, rotulo: "mismas cifras, más ceros" }
      asas:
        - { mueve: c_n, x: "c_n", y: "L_c", rotulo: "Número de ceros" }
      lectura: { valor: L_c, rotulo: "Inductancia" }
      datos:
        - { valor: codigo, rotulo: "Código impreso: «{{codigo}}»" }
      mandos:
        - { valor: c_1, min: 1, max: 9, paso: 1, rotulo: "Primera cifra" }
        - { valor: c_2, min: 0, max: 9, paso: 1, rotulo: "Segunda cifra" }
        - { valor: c_n, min: 0, max: 4, paso: 1, rotulo: "Tercera cifra: ceros" }
    condiciones:
      - { valor: L_c, objetivo: 0.01, tol: 0.001, rotulo: "Inductancia: {{L_c}}" }
    exito: "«103»: 10 × 10³ µH = 10 mH, leído como el de las resistencias SMD."
    pistas:
      - { cuando: { valor: L_c, mayor: 0.01001 }, texto: "Se ha pasado: 10 mH son 10 000 µH. Quite ceros o baje las cifras." }
      - { cuando: { valor: L_c, menor: 0.00999 }, texto: "Le falta: 10 mH son 10 000 µH, es decir, 10 seguido de tres ceros." }
    ayuda: "10 mH = 10 000 µH: cifras 1 y 0, y tres ceros."
    comprobar:
      - { con: { c_1: 1, c_2: 0, c_n: 3 }, L_c: 0.01, codigo: 103 }

  - id: pregunta-4r7
    tipo: pregunta
    titulo: "Cifra y letra"
    texto: "Otra bobina lleva impreso «4R7». ¿Qué inductancia tiene?"
    libro: [52]
    opciones:
      - texto: "4,7 µH"
        bien: true
        porque: "La R hace de coma decimal, y en una bobina el resultado va en microhenrios."
      - texto: "47 µH"
        porque: "La R no es un cero: marca dónde va la coma."
      - texto: "4,7 Ω"
        porque: "Sería así en una resistencia. En una bobina, «4R7» son microhenrios."
    comprobar:
      - { con: { c_1: 4, c_2: 7, c_n: 0 }, L_c: 47e-6 }

  - id: pregunta-ohmetro
    tipo: pregunta
    titulo: "¿Resistencia o bobina?"
    texto: "Un componente axial con bandas de color raro. El óhmetro marca casi cero ohmios. ¿Qué es lo más probable?"
    libro: [47, 48]
    opciones:
      - texto: "Una bobina"
        bien: true
        porque: "Una bobina solo tiene la resistencia de su hilo, unos pocos ohmios: si mide muy poco, compruebe si es una bobina."
      - texto: "Una resistencia estropeada"
        porque: "Es la confusión típica. Antes de tirarla, compruebe si es una bobina: el código de colores es el mismo."
      - texto: "Una resistencia de cero ohmios"
        porque: "Podría, pero unas bandas de color raro y casi cero ohmios apuntan a una bobina."

  - id: empareje-aspecto
    tipo: pregunta
    fase: "Empareje"
    titulo: "Lo que dice el aspecto"
    texto: "La construcción delata las propiedades. Empareje cada tipo con lo que lo caracteriza."
    libro: [40, 41, 42, 43, 44]
    emparejar:
      - ["Al aire, sin núcleo", "Nanohenrios, RF"]
      - ["Barra de ferrita", "Radia y capta"]
      - ["Toroide", "Flujo en el anillo"]
      - ["Hierro laminado", "Baja frecuencia"]
    exito: "Eso es. Donde el flujo se cierra por el aire, la bobina radia; donde queda confinado, no."
    pistas:
      - { texto: "Piense por dónde se cierra el flujo: por el aire o dentro del núcleo." }

  - id: pregunta-saturacion
    tipo: pregunta
    titulo: "Lo que la marca no dice"
    texto: "Una bobina de 100 µH, bien marcada, que satura a 0,5 A. ¿Sirve en un convertidor de 2 A?"
    libro: [53, 57]
    opciones:
      - texto: "No: saturaría"
        bien: true
        porque: "Por encima de 0,5 A el núcleo satura y la inductancia se desploma, por correcta que sea la marca."
      - texto: "Sí: la inductancia es la correcta"
        porque: "La marca da la inductancia, pero lo que de verdad limita es la corriente de saturación."
      - texto: "Sí, si su resistencia es baja"
        porque: "La resistencia decide las pérdidas de cobre, no dónde satura el núcleo."

  - id: empareje-parametros
    tipo: pregunta
    fase: "Empareje"
    titulo: "Tres datos sin marcar"
    texto: "Ninguna bobina los lleva escritos, y deciden si sirve. Empareje cada uno con lo que determina."
    libro: [56, 57, 58]
    emparejar:
      - ["DCR", "Pérdidas de cobre"]
      - ["Corriente de saturación", "El límite real"]
      - ["Autorresonancia", "Pasa a condensador"]
    exito: "Eso es. La DCR se mide con el óhmetro; las otras dos, no."
    pistas:
      - { texto: "La DCR es la resistencia del hilo: lo que se pierde en el cobre." }

  - id: estime-tau
    tipo: pregunta
    fase: "Estime"
    titulo: "Medir L con un escalón"
    texto: "Escalón a través de 100 Ω. La marca señala el 63 %: ahí t = τ = L/R. Lea τ y estime L."
    libro: [62, "cap04#87"]
    widget:
      tipo: circuito
      esquema: carga-rl
      piezas: { fuente: V_m, r: R_m, l: L_m }
      lectura: { valor: I_mf, rotulo: "Corriente final" }
      grafica:
        x: { id: t, min: 0, max: 0.0005, unidad: s, rotulo: "t" }
        y: { min: 0, max: 11, unidad: V, rotulo: "v_{R}" }
        curvas:
          - { expr: "V_m*(1 - exp(-t/tau_m))", color: azul, rotulo: "v_{R}", mide: vr }
        marcas:
          - { x: "tau_m", y: "v_tau", rotulo: "63 %" }
    estimar:
      objetivo: "L_m"
      unidad: H
      min: 0
      max: 0.05
      paso: 0.0005
      inicio: 0.04
      tol: 0.05
      rotulo: "L"
    exito: "τ = 100 µs; por 100 Ω, L = 10 mH."
    pistas:
      - { cuando: { valor: estimacion, mayor: 0.0105 }, texto: "Se ha pasado. L = τ·R: lea τ en el eje de tiempos y multiplique por 100 Ω." }
      - { texto: "Se ha quedado corto. L = τ·R, con τ donde la curva llega al 63 %." }
    comprobar:
      - { tau_m: 100e-6, L_m: 0.01 }

  - id: ordene-resonancia
    tipo: pregunta
    fase: "Ordene"
    titulo: "Medir L por resonancia"
    texto: "El otro método, el más preciso, usa el generador. Ordene los pasos."
    libro: [61]
    ordenar:
      - "Poner en paralelo un condensador conocido."
      - "Excitar el conjunto con el generador."
      - "Buscar la frecuencia de resonancia."
      - "Despejar L de esa frecuencia."
    exito: "Ese es el orden. El de la constante de tiempo es menos preciso, pero solo necesita el osciloscopio."
    pistas:
      - { texto: "Sin condensador no hay resonancia que buscar." }

  - id: porque-anillo
    tipo: porque
    titulo: "La prueba del anillo"
    texto: "Excitada con un pulso, una bobina oscila solo dos o tres ciclos, y su resistencia en continua no ha cambiado. ¿Qué tiene?"
    libro: [65, 66]
    opciones:
      - texto: "Espiras en cortocircuito"
        bien: true
        porque: "Una sana oscila muchos ciclos. Es el único fallo de un magnético que el multímetro no ve."
      - texto: "Nada: la DCR es la buena"
        porque: "Las espiras en cortocircuito apenas cambian la DCR. Por eso hace falta esta prueba."
      - texto: "El hilo está abierto"
        porque: "Abierta no oscilaría nada, y el óhmetro marcaría infinito."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [48, 51, 53, 62, 66]
    ideas:
      - { titulo: "Marcas.", texto: "Tres cifras o colores, en microhenrios: «101» = 100 µH. Si mide casi cero, quizá no es una resistencia." }
      - { titulo: "Lo que no se marca.", texto: "DCR, corriente de saturación y autorresonancia; la saturación es el límite real." }
      - { titulo: "Medir L.", texto: "Por constante de tiempo, τ = L/R, o por resonancia con un condensador conocido." }
      - { titulo: "El anillo.", texto: "Pocos ciclos de oscilación delatan espiras en cortocircuito que el óhmetro no ve." }
