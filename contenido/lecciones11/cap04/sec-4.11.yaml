# Lección 1.1 de la sección 4.11 «Ferritas de Supresión y Chokes de Modo Común» (cap04): la cuenta de ferrita como
# resistencia que solo existe en radiofrecuencia (600 Ω a 100 MHz atenúan 17 dB en un sistema de 50 Ω), su caída con
# la corriente continua, la resonancia con el desacoplo, y el choke de modo común (qué ve la señal y qué ve el ruido,
# el fallo de arrollarlo al revés y cómo comprobarlo). Formato: contenido/lecciones11/GUIA.md.
leccion: cap04/sec-4.11

libro:
  239: "deja pasar la señal o la alimentación útil y absorbe el ruido de radiofrecuencia"
  240: "la corriente útil, que circula en sentidos opuestos, no ve inductancia alguna"
  242: "En un sistema de 50 Ω (generador y carga de 50 Ω), 600 Ω en serie atenúan 20·log((600 + 100)/100) = 17 dB"
  243: "una cuenta que da 600 Ω sin corriente puede dar 100 Ω con medio amperio"
  244: "los flujos de la corriente diferencial se cancelan"
  245: "acopla, por su capacidad entre bobinados, la conmutación del primario al secundario en modo común"
  246: "Arrollar los dos hilos en sentidos contrarios"

modelo:
  valores:
    Z_b: { sim: "Z_{cuenta}", nombre: "impedancia de la cuenta", unidad: Ω, valor: 10 }
    R_s: { sim: "R", nombre: "generador más carga", unidad: Ω, valor: 100 }
    dc_on: { tipo: interruptor, nombre: "medio amperio de continua por la cuenta", valor: 0 }
    Z_0: { sim: "Z_{cuenta}", nombre: "impedancia de la cuenta sin corriente", unidad: Ω, valor: 600 }
    Z_dc: { sim: "Z_{cuenta}", nombre: "impedancia de la cuenta con 0,5 A", unidad: Ω, valor: 100 }
  calculos:
    a_b: { expr: "20*log10((Z_b + R_s)/R_s)", sim: "atenuación", nombre: "atenuación de la cuenta", unidad: dB, cifras: 3 }
    Z_e: { si: dc_on, entonces: "Z_dc", sino: "Z_0", sim: "Z_{cuenta}", nombre: "impedancia de la cuenta a 100 MHz", unidad: Ω }
    k_b: { expr: "(Z_b + R_s)/R_s", sim: "(Z + R)/R", nombre: "cociente de la atenuación", unidad: "", cifras: 3 }
    Z_t: { expr: "Z_b + R_s", sim: "Z + R", nombre: "impedancia total del lazo", unidad: Ω }
    l_k: { expr: "log10(k_b)", sim: "log", nombre: "logaritmo del cociente", unidad: "", cifras: 3 }
    a_e: { expr: "20*log10((Z_e + R_s)/R_s)", sim: "atenuación", nombre: "atenuación a 100 MHz", unidad: dB, cifras: 3 }

tarjetas:
  - id: explore-cuenta
    tipo: explorar
    titulo: "Una resistencia de radiofrecuencia"
    texto: "Una cuenta de ferrita en serie, en un sistema de 50 Ω: generador y carga suman 100 Ω. Cambie su impedancia y mire cuánto atenúa."
    libro: [239, 242]
    widget:
      tipo: grafica
      x: { id: z, min: 1, max: 10000, unidad: Ω, rotulo: "Z_{cuenta}", escala: log }
      y: { min: 0, max: 45, unidad: dB, rotulo: "atenuación" }
      curvas:
        - { expr: "20*log10((z + R_s)/R_s)", color: naranja, rotulo: "20·log((Z + 100)/100)" }
      asas:
        - { mueve: Z_b, x: "Z_b", y: "a_b", rotulo: "Impedancia de la cuenta" }
      lectura: { valor: a_b, rotulo: "Atenuación" }
      mandos:
        - { valor: Z_b, lista: [1, 10, 100, 600, 1000, 10000], rotulo: "Impedancia de la cuenta" }
    requiere: { mover: [Z_b] }

  - id: prediga-continua
    tipo: predecir
    titulo: "Prediga"
    texto: "A baja frecuencia, la cuenta es una inductancia pequeña y una resistencia de décimas de ohmio. ¿Qué le hace a la alimentación?"
    libro: [239, 242]
    fijar: { Z_b: 1 }
    widget:
      tipo: grafica
      x: { id: z, min: 1, max: 10000, unidad: Ω, rotulo: "Z_{cuenta}", escala: log }
      y: { min: 0, max: 45, unidad: dB, rotulo: "atenuación" }
      curvas:
        - { expr: "20*log10((z + R_s)/R_s)", color: naranja, rotulo: "20·log((Z + 100)/100)" }
      lectura: { valor: a_b, rotulo: "Atenuación" }
      ocultar: true
    opciones:
      - texto: "Nada"
        bien: true
        porque: "Frente a los 100 Ω del sistema, unas décimas de ohmio no atenúan: deja pasar lo útil."
      - texto: "La atenúa 17 dB"
        porque: "Eso es a 100 MHz, donde presenta 600 Ω. Abajo apenas es nada."
      - texto: "La corta"
        porque: "En continua solo pone su resistencia de décimas de ohmio: no corta nada."
    escalera:
      - "Compare unas décimas de ohmio con los 100 Ω del sistema."
    solucion: "Nada: apenas atenúa y deja pasar la alimentación útil."

  - id: estime-cuenta
    tipo: pregunta
    fase: "Estime"
    titulo: "A 100 MHz"
    texto: "Una cuenta común da 600 Ω a 100 MHz, esencialmente resistivos. Estime cuánto atenúa en el sistema de 50 Ω."
    libro: [242]
    fijar: { Z_b: 600 }
    estimar:
      objetivo: "a_b"
      unidad: dB
      min: 0
      max: 40
      paso: 0.5
      inicio: 35
      tol: 0.05
      rotulo: "Atenuación"
    exito: "17 dB: 20·log(700/100). Y como es resistiva, disipa el ruido en lugar de reflejarlo."
    pistas:
      - { cuando: { valor: estimacion, mayor: 17.8 }, texto: "Se ha pasado: 20·log((600 + 100)/100) = 20·log 7." }
      - { texto: "Se ha quedado corto: 20·log 7, con log 7 ≈ 0,845." }
    comprobar:
      - { a_b: 16.9, tol: 0.01 }
      - { k_b: 7, Z_t: 700, l_k: 0.845 }
    escalera:
      - "En el sistema de 50 Ω, la atenuación es 20·log((Z + 100)/100)."
    solucion: "20·log(700/100) = 20·log 7 ≈ 17 dB."

  - id: sorpresa-corriente
    tipo: sorpresa
    titulo: "Con corriente continua"
    texto: "La cuenta está en una alimentación. Haga pasar medio amperio de continua y mire su impedancia a 100 MHz."
    libro: [243]
    widget:
      tipo: grafica
      x: { id: z, min: 1, max: 10000, unidad: Ω, rotulo: "Z_{cuenta}", escala: log }
      y: { min: 0, max: 45, unidad: dB, rotulo: "atenuación" }
      curvas:
        - { expr: "20*log10((z + R_s)/R_s)", color: naranja, rotulo: "20·log((Z + 100)/100)" }
      marcas:
        - { x: "Z_e", y: "a_e", rotulo: "La cuenta" }
      lectura: { valor: Z_e, rotulo: "Impedancia a 100 MHz" }
      datos:
        - { valor: a_e, rotulo: "Atenúa {{a_e}}" }
      mandos:
        - { valor: dc_on, tipo: conectar, boton: "Pasar 0,5 A de continua" }
    requiere: { conectar: [dc_on] }
    comprobar:
      - { con: { dc_on: 1 }, Z_e: 100, a_e: 6.02 }

  - id: porque-satura
    tipo: porque
    titulo: "¿Por qué cae?"
    texto: "Sin corriente, 600 Ω; con medio amperio, 100 Ω. ¿Qué le ha pasado a la cuenta?"
    libro: [243]
    opciones:
      - texto: "Su núcleo se satura"
        bien: true
        porque: "Por eso, en una alimentación, la cuenta se elige con la curva de la hoja de datos a la corriente real."
      - texto: "Se ha calentado y se ha roto"
        porque: "No está rota: al quitar la corriente vuelve a 600 Ω. Es saturación."
      - texto: "La continua la cortocircuita"
        porque: "La continua pasa igual que antes; lo que cambia es el núcleo, que satura."
    fijar: { dc_on: 1 }
    widget:
      tipo: grafica
      x: { id: z, min: 1, max: 10000, unidad: Ω, rotulo: "Z_{cuenta}", escala: log }
      y: { min: 0, max: 45, unidad: dB, rotulo: "atenuación" }
      curvas:
        - { expr: "20*log10((z + R_s)/R_s)", color: naranja, rotulo: "20·log((Z + 100)/100)" }
      marcas:
        - { x: "Z_e", y: "a_e", rotulo: "La cuenta" }
      lectura: { valor: Z_e, rotulo: "Impedancia a 100 MHz" }
      mandos: []
    escalera:
      - "La cuenta es una ferrita: ¿qué le hace una corriente continua grande a su núcleo?"
    solucion: "Lo satura: la permeabilidad cae y con ella la impedancia. Al quitar la corriente, se recupera."

  - id: porque-perdidas
    tipo: porque
    titulo: "Ferrita de pérdidas, no un choque"
    texto: "Para suprimir interferencias se elige una cuenta de pérdidas y no una bobina de verdad. ¿Por qué?"
    libro: [242]
    opciones:
      - texto: "Disipa el ruido y no forma resonancias"
        bien: true
        porque: "Es resistiva: convierte el ruido en calor. Una bobina lo reflejaría y resonaría con las capacidades vecinas."
      - texto: "Tiene más inductancia"
        porque: "Su inductancia es pequeña, de microhenrios. Lo que cuenta son sus pérdidas a alta frecuencia."
      - texto: "Porque es más barata, solo"
        porque: "Es barata, pero la razón técnica es que disipa en vez de reflejar."
    widget:
      tipo: figura
      figura: fig-4.17
      zonas:
        - { id: cuenta, rotulo: "Impedancia de la cuenta de ferrita", rect: [0, 0, 218, 251] }
    escalera:
      - "Mire la curva R (pérdidas) arriba: ¿qué hace una resistencia con la energía del ruido?"
    solucion: "La convierte en calor: la cuenta disipa el ruido en vez de reflejarlo y no forma resonancias."

  - id: pregunta-desacoplo
    tipo: pregunta
    titulo: "Junto al desacoplo"
    texto: "Una cuenta en una alimentación, junto a sus condensadores de desacoplo. ¿Qué hay que vigilar?"
    libro: [243]
    opciones:
      - texto: "Que formen un LC que resuene"
        bien: true
        porque: "Donde la cuenta aún es inductiva, decenas de megahercios. Se amortigua con una resistencia pequeña o con la ESR de un electrolítico."
      - texto: "Que la cuenta descargue los condensadores"
        porque: "No los descarga: el riesgo es una resonancia del filtro LC que forman."
      - texto: "Nada: la cuenta siempre es resistiva"
        porque: "Solo lo es arriba. En decenas de megahercios aún es inductiva y puede resonar."
    widget:
      tipo: figura
      figura: fig-4.17
      zonas:
        - { id: inductiva, rotulo: "Zona inductiva de la cuenta", rect: [0, 0, 218, 251] }
    escalera:
      - "Por debajo de su zona resistiva, la cuenta es una bobina. ¿Y con un condensador al lado?"
    solucion: "Forman un LC que puede resonar en decenas de megahercios; se amortigua con una resistencia pequeña."

  - id: empareje-choke
    tipo: pregunta
    fase: "Empareje"
    titulo: "El choke de modo común"
    texto: "Los dos hilos de la línea van arrollados juntos sobre el mismo núcleo. Empareje."
    libro: [240, 244, 246]
    emparejar:
      - ["Corriente diferencial", "Flujos que se cancelan"]
      - ["Modo común", "Inductancia completa"]
      - ["Hilos al revés", "Funciona al revés"]
    exito: "Eso es: la señal pasa intacta y el ruido de modo común ve una impedancia alta."
    pistas:
      - { texto: "La corriente útil va por un hilo y vuelve por el otro: sus flujos tienen sentidos opuestos." }
    escalera:
      - "La corriente útil va por un hilo y vuelve por el otro: sus flujos tienen sentidos opuestos."
    solucion: "Diferencial: flujos que se cancelan. Modo común: inductancia completa. Hilos al revés: funciona al revés."

  - id: porque-conmutada
    tipo: porque
    titulo: "El filtro obligado"
    texto: "Casi toda fuente conmutada lleva un choke de modo común a la entrada. ¿De dónde sale su ruido de modo común?"
    libro: [245]
    opciones:
      - texto: "De la capacidad entre bobinados de su transformador"
        bien: true
        porque: "Acopla la conmutación del primario al secundario en modo común. El choke y los condensadores Y lo frenan."
      - texto: "De la corriente de la carga"
        porque: "La de la carga es diferencial: va y vuelve. El modo común entra por la capacidad del transformador."
      - texto: "Del rizado de la salida"
        porque: "El rizado es diferencial. El modo común viene de la capacidad entre bobinados."
    widget:
      tipo: figura
      figura: fig-4.17
      zonas:
        - { id: choke, rotulo: "Choke: modo diferencial y modo común", rect: [222, 0, 223, 251] }
    escalera:
      - "El modo común va por los dos hilos en el mismo sentido: no lo produce la carga."
    solucion: "La capacidad entre bobinados del transformador acopla la conmutación del primario al secundario."

  - id: pregunta-prueba
    tipo: pregunta
    titulo: "¿Está bien arrollado?"
    texto: "Con los dos devanados unidos por un extremo, se mide la inductancia entre los otros dos. ¿Qué debe dar?"
    libro: [246]
    opciones:
      - texto: "Casi nada"
        bien: true
        porque: "Así se cancela el modo diferencial. Cada devanado por separado sí da la inductancia completa."
      - texto: "El doble de un devanado"
        porque: "Eso indicaría que los flujos se suman: está arrollado al revés, y la señal saturaría el núcleo."
      - texto: "La de un devanado"
        porque: "Unidos así, los flujos deben cancelarse: casi nula."
    widget:
      tipo: figura
      figura: fig-4.17
      zonas:
        - { id: diferencial, rotulo: "Flujos opuestos que se cancelan", rect: [222, 0, 223, 125] }
    escalera:
      - "Unidos por un extremo, la corriente recorre un devanado a la ida y el otro a la vuelta."
    solucion: "Casi nada: los flujos se cancelan. Si diera el doble, estaría arrollado al revés."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [242, 243, 244, 246]
    ideas:
      - { titulo: "La cuenta.", texto: "Una resistencia que solo aparece en RF: 600 Ω a 100 MHz atenúan 17 dB en 50 Ω, y disipa sin resonar." }
      - { titulo: "Con continua.", texto: "Su núcleo satura: hay que elegirla a la corriente real." }
      - { titulo: "El choke.", texto: "La señal cancela su flujo y pasa; el modo común ve toda la inductancia." }
      - { titulo: "Al revés.", texto: "Arrollado en sentidos contrarios, funciona exactamente al revés." }
