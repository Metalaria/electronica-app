# Lección 1.1 de la sección 4.9 «Pérdidas en el Núcleo: Histéresis y Corrientes de Foucault» (cap04): cómo crece
# cada mecanismo con la frecuencia (f frente a f²), la ecuación de Steinmetz, el lazo de histéresis, laminar,
# aislar o aglomerar, las pérdidas en vacío, las especificaciones y el ensayo en vacío. Las gráficas van en
# magnitudes relativas (veces las de 50 Hz, veces la excursión inicial). Formato: contenido/lecciones11/GUIA.md.
leccion: cap04/sec-4.9

libro:
  198: "dependen de la frecuencia de forma distinta y se combaten de forma distinta"
  201: "El área encerrada por ese lazo es exactamente la energía perdida por ciclo"
  202: "la potencia perdida es proporcional a la frecuencia, y crece con la amplitud del flujo elevada a una potencia entre 1,6 y 2,5"
  203: 'P_("hist") approx k dot.op f dot.op B^(n)'
  204: "la remanencia (el flujo que queda al retirar el campo) y la coercitividad"
  207: "Su potencia crece con el cuadrado de la frecuencia y con el cuadrado del espesor del material"
  208: "Usar polvo aglomerado las confina dentro de cada partícula"
  210: "Material de lazo estrecho"
  211: "Un núcleo de hierro laminado a 100 kHz no es una mala elección: es una elección imposible"
  213: "B depende de la tensión aplicada y de la frecuencia, no de la corriente de carga"
  214: "sigue disipando sus pérdidas de hierro completas"
  219: "como potencia por unidad de volumen (mW/cm³)"
  220: "unos 80-100 °C en muchas ferritas de potencia"
  222: "la potencia activa que consume entonces son las pérdidas de hierro"
  "cap04#341": "Explica por qué un transformador de 50 Hz usa chapa laminada"

modelo:
  valores:
    f_n: { sim: "f", nombre: "frecuencia de trabajo", unidad: Hz, valor: 50 }
    b_h: { sim: "B/B₀", nombre: "excursión de flujo, en veces la inicial", unidad: "", valor: 1 }
    n_h: { sim: "n", nombre: "exponente de Steinmetz", unidad: "", valor: 2 }
  calculos:
    r_h: { expr: "f_n/50", sim: "P_{hist}", nombre: "pérdidas por histéresis, en veces las de 50 Hz", unidad: "veces", cifras: 3 }
    r_F: { expr: "(f_n/50)^2", sim: "P_{Foucault}", nombre: "pérdidas por Foucault, en veces las de 50 Hz", unidad: "veces", cifras: 3 }
    P_b: { expr: "b_h^n_h", sim: "P/P₀", nombre: "pérdidas por histéresis, en veces las iniciales", unidad: "veces", cifras: 3 }

tarjetas:
  - id: explore-frecuencia
    tipo: explorar
    titulo: "Dos mecanismos, dos ritmos"
    texto: "Un núcleo pierde por histéresis y por corrientes de Foucault. Suba la frecuencia desde 50 Hz y mire cuánto crece cada una."
    nota: "Cada curva, en veces su propio valor a 50 Hz."
    libro: [198, 202, 207, "cap04#341"]
    widget:
      tipo: grafica
      x: { id: nu, min: 10, max: 1000000, unidad: Hz, rotulo: "f", escala: log }
      y: { min: 0.1, max: 1000000000, unidad: "veces", rotulo: "pérdidas", escala: log }
      curvas:
        - { expr: "nu/50", color: azul, rotulo: "histéresis, ∝ f" }
        - { expr: "(nu/50)^2", color: naranja, rotulo: "Foucault, ∝ f²" }
      asas:
        - { mueve: f_n, x: "f_n", y: "r_F", rotulo: "Frecuencia" }
      lectura: { valor: r_F, rotulo: "Foucault, frente a 50 Hz" }
      datos:
        - { valor: r_h, rotulo: "Histéresis: {{r_h}}" }
      mandos:
        - { valor: f_n, lista: [50, 500, 5000, 100000], rotulo: "Frecuencia, f" }
    requiere: { mover: [f_n] }

  - id: prediga-hierro
    tipo: predecir
    titulo: "Prediga"
    texto: "Un núcleo de hierro laminado pasa de 50 Hz a 100 kHz, dos mil veces la frecuencia. ¿Cuánto crecen sus pérdidas por Foucault?"
    libro: [207, 211, "cap04#341"]
    fijar: { f_n: 100000 }
    widget:
      tipo: grafica
      x: { id: nu, min: 10, max: 1000000, unidad: Hz, rotulo: "f", escala: log }
      y: { min: 0.1, max: 1000000000, unidad: "veces", rotulo: "pérdidas", escala: log }
      curvas:
        - { expr: "nu/50", color: azul, rotulo: "histéresis, ∝ f" }
        - { expr: "(nu/50)^2", color: naranja, rotulo: "Foucault, ∝ f²" }
      lectura: { valor: r_F, rotulo: "Foucault, frente a 50 Hz" }
      ocultar: true
    opciones:
      - texto: "Cuatro millones de veces"
        bien: true
        porque: "Van con f²: dos mil al cuadrado. Por eso el hierro a 100 kHz no es mala elección, es imposible: se destruiría."
      - texto: "Dos mil veces"
        porque: "Así crecen las de histéresis, con f. Las de Foucault van con el cuadrado."
      - texto: "Lo mismo: dependen del material"
        porque: "Dependen del material, pero también, y mucho, de la frecuencia: con su cuadrado."
    comprobar:
      - { r_F: 4e6, r_h: 2000 }

  - id: porque-frontera
    tipo: porque
    titulo: "La frontera del kilohercio"
    texto: "La frontera entre el hierro y la ferrita está en el kilohercio, no en la permeabilidad. ¿Por qué?"
    libro: [211]
    opciones:
      - texto: "Foucault crece más deprisa y domina a alta frecuencia"
        bien: true
        porque: "Con f², acaba mandando sobre la histéresis; la ferrita, aislante, casi no tiene Foucault."
      - texto: "Porque la ferrita tiene más permeabilidad"
        porque: "La frontera no la marca la permeabilidad, sino las corrientes de Foucault del metal."
      - texto: "Porque la histéresis crece con f²"
        porque: "Es al revés: la histéresis crece con f y Foucault con f²."

  - id: prediga-flujo
    tipo: predecir
    titulo: "Prediga"
    texto: "Las pérdidas por histéresis crecen con B^{n}, con n entre 1,6 y 2,5. Con n = 2, si dobla la excursión de flujo, ¿cuánto crecen?"
    libro: [202]
    fijar: { b_h: 2, n_h: 2 }
    widget:
      tipo: grafica
      x: { id: b, min: 0, max: 3, unidad: "", rotulo: "B/B₀" }
      y: { min: 0, max: 16, unidad: "veces", rotulo: "P/P₀" }
      curvas:
        - { expr: "b^n_h", color: naranja, rotulo: "P_{hist} ∝ B^{n}" }
      lectura: { valor: P_b, rotulo: "Pérdidas, frente a las iniciales" }
      ocultar: true
    opciones:
      - texto: "Se multiplican por cuatro"
        bien: true
        porque: "B² con B doble: cuatro veces. Con n = 2,5 serían aún más."
      - texto: "Se duplican"
        porque: "Eso sería con n = 1. El exponente está entre 1,6 y 2,5: crecen más que el flujo."
      - texto: "No cambian: dependen de f"
        porque: "Dependen de f y también de la amplitud del flujo, elevada a n."
    comprobar:
      - { P_b: 4 }
      - { con: { b_h: 2, n_h: 1 }, P_b: 2 }

  - id: formula-steinmetz
    tipo: formula
    titulo: "La ecuación de Steinmetz"
    texto: "Se pierde una cantidad fija por ciclo, así que la potencia va con f; y con la amplitud del flujo, elevada a n."
    libro: [202, 203]
    ec: 203
    sustitucion: "P/P₀ = {{b_h}} elevado a {{n_h}} = {{P_b}}"
    widget:
      tipo: grafica
      x: { id: b, min: 0, max: 3, unidad: "", rotulo: "B/B₀" }
      y: { min: 0, max: 16, unidad: "veces", rotulo: "P/P₀" }
      curvas:
        - { expr: "b^n_h", color: naranja, rotulo: "P_{hist} ∝ B^{n}" }
      asas:
        - { mueve: b_h, x: "b_h", y: "P_b", rotulo: "Excursión de flujo" }
      lectura: { valor: P_b, rotulo: "Pérdidas, frente a las iniciales" }
      mandos:
        - { valor: b_h, min: 0, max: 3, paso: 0.1, rotulo: "Excursión de flujo, B/B₀" }
        - { valor: n_h, lista: [1.6, 2, 2.5], rotulo: "Exponente, n" }

  - id: empareje-lazo
    tipo: pregunta
    fase: "Empareje"
    titulo: "El lazo de histéresis"
    texto: "El área del lazo es la energía perdida por ciclo. Empareje cada rasgo del lazo con su significado."
    libro: [201, 204]
    emparejar:
      - ["Remanencia", "Flujo que queda"]
      - ["Coercitividad", "Campo que lo anula"]
      - ["Lazo estrecho", "Transformadores"]
      - ["Lazo ancho", "Imanes permanentes"]
    exito: "Eso es. Un material blando, de lazo estrecho, pierde poco por ciclo."
    pistas:
      - { texto: "Un imán debe conservar su magnetización: lazo ancho." }

  - id: pregunta-chapa
    tipo: pregunta
    titulo: "Chapas más finas"
    texto: "Las pérdidas por Foucault crecen con el cuadrado del espesor. Si las chapas de un núcleo se hacen de la mitad de espesor, ¿cómo quedan?"
    libro: [207]
    opciones:
      - texto: "En la cuarta parte"
        bien: true
        porque: "Con el cuadrado del espesor: la mitad al cuadrado es un cuarto. Por eso el audio usa chapas de decenas de micras."
      - texto: "En la mitad"
        porque: "Sería así si fueran con el espesor. Van con su cuadrado."
      - texto: "Igual: el hierro es el mismo"
        porque: "Laminar corta los caminos de la corriente inducida: cuanto más fino, menos pérdidas."

  - id: empareje-soluciones
    tipo: pregunta
    fase: "Empareje"
    titulo: "Contra Foucault"
    texto: "Empareje cada solución con lo que hace con las corrientes inducidas."
    libro: [208, 210]
    emparejar:
      - ["Laminar", "Corta sus caminos"]
      - ["Material aislante", "Casi las elimina"]
      - ["Polvo aglomerado", "Las encierra en cada grano"]
    exito: "Eso es. Y contra la histéresis, un material de lazo estrecho."
    pistas:
      - { texto: "La ferrita es aislante: las corrientes no tienen por dónde circular." }

  - id: porque-vacio
    tipo: porque
    titulo: "Caliente sin carga"
    texto: "Un transformador de red enchufado y sin carga se calienta. ¿Por qué?"
    libro: [213, 214]
    opciones:
      - texto: "Sus pérdidas de hierro dependen del flujo, no de la carga"
        bien: true
        porque: "B depende de la tensión y la frecuencia. Sin carga disipa sus pérdidas de hierro completas."
      - texto: "Por las pérdidas del cobre"
        porque: "Las de cobre son I²·R y crecen con la carga; sin carga son casi nulas."
      - texto: "Está averiado"
        porque: "Es normal: es lo que consume un cargador olvidado en el enchufe."

  - id: pregunta-temperatura
    tipo: pregunta
    titulo: "Un mínimo peligroso"
    texto: "Las pérdidas de muchas ferritas de potencia tienen un mínimo hacia 80-100 °C y luego vuelven a crecer. ¿Qué riesgo trae?"
    libro: [219, 220]
    opciones:
      - texto: "Embalamiento térmico"
        bien: true
        porque: "Más temperatura, más pérdidas, más temperatura: si el diseño está al límite, se embala."
      - texto: "Ninguno: el mínimo es bueno"
        porque: "Por encima del mínimo las pérdidas crecen con la temperatura, y eso se realimenta."
      - texto: "Que deje de saturar"
        porque: "El riesgo es térmico: pérdidas que suben con la temperatura que ellas mismas provocan."

  - id: pregunta-ensayo
    tipo: pregunta
    titulo: "El ensayo en vacío"
    texto: "Para medir solo las pérdidas de hierro de un transformador, ¿qué se mide?"
    libro: [222]
    opciones:
      - texto: "La potencia activa que toma en vacío"
        bien: true
        porque: "Sin carga, lo que consume en potencia activa es hierro. Exige medir tensión por corriente en fase."
      - texto: "La corriente que toma en vacío"
        porque: "Incluye la corriente magnetizante, que es reactiva y no aporta potencia media."
      - texto: "Entrada menos salida a plena carga"
        porque: "Eso da las pérdidas totales, cobre incluido."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [202, 207, 213, 222]
    ideas:
      - { titulo: "Histéresis.", texto: "Una energía fija por ciclo: va con f y con B^{n}, n de 1,6 a 2,5. Lazo estrecho." }
      - { titulo: "Foucault.", texto: "Va con f² y con el cuadrado del espesor: laminar, o material aislante." }
      - { titulo: "Del flujo, no de la carga.", texto: "Un transformador en vacío disipa sus pérdidas de hierro completas." }
      - { titulo: "Medirlas.", texto: "La potencia activa en vacío son las pérdidas de hierro." }
