# Lección 1.1 de la sección 4.9 «Pérdidas en el Núcleo: Histéresis y Corrientes de Foucault» (cap04): cómo crece
# cada mecanismo con la frecuencia (f frente a f²), la ecuación de Steinmetz, el lazo de histéresis, laminar,
# aislar o aglomerar, las pérdidas en vacío, las especificaciones y el ensayo en vacío. Las gráficas van en
# magnitudes relativas (veces las de 50 Hz, veces la excursión inicial). Formato: contenido/lecciones11/GUIA.md.
# 1.2.1 (autor121-fund, «aprender haciendo», GUIA §13): llevar Foucault a diez mil veces, predecir el hierro a
# 100 kHz, marcar la frontera del kilohercio, predecir el doble de flujo, buscar el exponente y calcular
# la chapa fina; se eligen el calor en vacío y el ensayo. Lazo, soluciones y temperatura quedan en el resumen.
leccion: cap04/sec-4.9

libro:
  198: "dependen de la frecuencia de forma distinta y se combaten de forma distinta"
  201: "El área encerrada por ese lazo es exactamente la energía perdida por ciclo"
  202: "la potencia perdida es proporcional a la frecuencia, y crece con la amplitud del flujo elevada a una potencia entre 1,6 y 2,5"
  203: 'P_("hist") approx k dot.op f dot.op B^(n)'
  204: "la remanencia (el flujo que queda al retirar el campo) y la coercitividad"
  207: "Su potencia crece con el cuadrado de la frecuencia y con el cuadrado del espesor del material"
  208: "Usar polvo aglomerado las confina dentro de cada partícula"
  210: "Material de lazo estrecho"
  211: "Un núcleo de hierro laminado a 100 kHz no es una mala elección: es una elección imposible"
  213: "B depende de la tensión aplicada y de la frecuencia, no de la corriente de carga"
  214: "sigue disipando sus pérdidas de hierro completas"
  219: "como potencia por unidad de volumen (mW/cm³)"
  220: "unos 80-100 °C en muchas ferritas de potencia"
  222: "la potencia activa que consume entonces son las pérdidas de hierro"
  "cap04#341": "Explica por qué un transformador de 50 Hz usa chapa laminada"

modelo:
  valores:
    f_n: { sim: "f", nombre: "frecuencia de trabajo", unidad: Hz, valor: 50 }
    b_h: { sim: "B/B₀", nombre: "excursión de flujo, en veces la inicial", unidad: "", valor: 1 }
    n_h: { sim: "n", nombre: "exponente de Steinmetz", unidad: "", valor: 2 }
    e_l: { sim: "e/e₀", nombre: "espesor de la chapa, en veces el inicial", unidad: "", valor: 1 }
    f_c: { sim: "f_{c}", nombre: "frecuencia en la que Foucault alcanza a la histéresis", unidad: Hz, valor: 1000 }
  calculos:
    r_h: { expr: "f_n/50", sim: "P_{hist}", nombre: "pérdidas por histéresis, en veces las de 50 Hz", unidad: "veces", cifras: 3 }
    r_F: { expr: "(f_n/50)^2", sim: "P_{Foucault}", nombre: "pérdidas por Foucault, en veces las de 50 Hz", unidad: "veces", cifras: 3 }
    P_b: { expr: "b_h^n_h", sim: "P/P₀", nombre: "pérdidas por histéresis, en veces las iniciales", unidad: "veces", cifras: 3 }
    P_e: { expr: "e_l^2", sim: "P/P₀", nombre: "pérdidas por Foucault, en veces las de la chapa inicial", unidad: "veces", cifras: 3 }

tarjetas:
  - id: explore-frecuencia
    tipo: explorar
    titulo: "Dos mecanismos, dos ritmos"
    texto: "Un núcleo pierde por histéresis y por corrientes de Foucault. Suba la frecuencia desde 50 Hz hasta que Foucault crezca diez mil veces."
    libro: [198, 202, 207, "cap04#341"]
    widget:
      tipo: grafica
      x: { id: nu, min: 10, max: 1000000, unidad: Hz, rotulo: "f", escala: log }
      y: { min: 0.1, max: 1000000000, unidad: "veces", rotulo: "pérdidas", escala: log }
      curvas:
        - { expr: "nu/50", color: azul, rotulo: "histéresis, ∝ f" }
        - { expr: "(nu/50)^2", color: naranja, rotulo: "Foucault, ∝ f²" }
      asas:
        - { mueve: f_n, x: "f_n", y: "r_F", rotulo: "Frecuencia" }
      lectura: { valor: r_F, rotulo: "Foucault, frente a 50 Hz" }
      datos:
        - { valor: r_h, rotulo: "Histéresis: {{r_h}}" }
      mandos:
        - { valor: f_n, lista: [50, 500, 5000, 100000], rotulo: "Frecuencia, f" }
    inicio: { f_n: 50 }
    objetivo:
      condiciones:
        - { valor: r_F, min: 9999, rotulo: "Foucault: {{r_F}}" }
      logrado: "A {{f_n}}, la histéresis ha crecido {{r_h}} y Foucault {{r_F}}: una con f, la otra con f². Cada curva, en veces su valor a 50 Hz."
      pistas:
        - { texto: "Más frecuencia." }
    escalera:
      - "Foucault va con f²: diez mil veces es cien veces la frecuencia."
    solucion: "A 5 kHz: histéresis ×100, Foucault ×10 000."
    comprobar:
      - { r_F: 1, r_h: 1 }
      - { con: { f_n: 5000 }, r_F: 10000, r_h: 100 }

  - id: prediga-hierro
    tipo: simular
    titulo: "Prediga"
    texto: "Un núcleo de hierro laminado pasa de 50 Hz a 100 kHz, dos mil veces la frecuencia. ¿Cuántas veces crecen sus pérdidas por Foucault?"
    libro: [207, 211, "cap04#341"]
    fijar: { f_n: 100000 }
    simular:
      objetivo: r_F
      unidad: "veces"
      tol: 0.03
      rotulo: "Foucault, frente a 50 Hz"
      errores:
        - { razon: { min: 0.0004, max: 0.0006 }, texto: "Así crecen las de histéresis, con f. Las de Foucault van con el cuadrado." }
    exito: "Cuatro millones de veces: dos mil al cuadrado. El hierro a 100 kHz no es mala elección, es imposible: se destruiría."
    escalera:
      - "Las de Foucault van con el cuadrado de la frecuencia."
    solucion: "2000² = 4 000 000."
    comprobar:
      - { r_F: 4e6, r_h: 2000 }
  - id: porque-frontera
    tipo: marcar
    titulo: "La frontera del kilohercio"
    texto: "Ahora las dos pérdidas a la misma escala. Marque la frecuencia a partir de la cual domina Foucault."
    libro: [210, 211]
    widget:
      tipo: grafica
      x: { id: nu, min: 10, max: 1000000, unidad: Hz, rotulo: "f", escala: log }
      y: { min: 0.0001, max: 1000000, unidad: "", rotulo: "pérdida relativa", escala: log }
      curvas:
        - { expr: "nu/f_c", color: azul, rotulo: "histéresis, ∝ f" }
        - { expr: "(nu/f_c)^2", color: naranja, rotulo: "Foucault, ∝ f²" }
    marcar:
      modo: x
      curva: 1
      x: "f_c"
      tol: 0.15
      inicio: { x: 100000, y: 1 }
      rotulo: "Desde aquí domina Foucault"
    pistas:
      - { cuando: { valor: marca_x, mayor: 1000 }, texto: "Más a la izquierda: donde las dos rectas se cruzan." }
      - { texto: "Más a la derecha: ahí aún domina la histéresis." }
    exito: "En el kilohercio se cruzan: por encima manda Foucault. Por eso ahí está la frontera entre el hierro y la ferrita, no en la permeabilidad."
    escalera:
      - "Busque el cruce de las dos rectas."
    solucion: "En 1 kHz."
    comprobar:
      - { f_c: 1000 }
  - id: prediga-flujo
    tipo: simular
    titulo: "Prediga"
    texto: "Las pérdidas por histéresis crecen con B^{n}, con n entre 1,6 y 2,5. Con n = 2, si dobla la excursión de flujo, ¿cuántas veces crecen?"
    libro: [202]
    fijar: { b_h: 2, n_h: 2 }
    simular:
      objetivo: P_b
      unidad: "veces"
      tol: 0.03
      rotulo: "Pérdidas, frente a las iniciales"
      errores:
        - { razon: { min: 0.45, max: 0.55 }, texto: "Eso sería con n = 1. El exponente está entre 1,6 y 2,5: crecen más que el flujo." }
    exito: "Cuatro veces: el doble de flujo, al cuadrado. Con n = 2,5, aún más."
    escalera:
      - "Con n = 2, las pérdidas van con B²."
    solucion: "2² = 4."
    comprobar:
      - { P_b: 4 }
      - { con: { n_h: 1 }, P_b: 2 }
  - id: formula-steinmetz
    tipo: explorar
    titulo: "La ecuación de Steinmetz"
    texto: "Se pierde una energía fija por ciclo, así que la potencia va con f; y con el flujo elevado a n. Con el doble de flujo, busque el material que pierde más de cinco veces."
    libro: [201, 202, 203]
    fijar: { b_h: 2 }
    inicio: { n_h: 1.6 }
    widget:
      tipo: grafica
      x: { id: b, min: 0, max: 3, unidad: "", rotulo: "B/B₀" }
      y: { min: 0, max: 16, unidad: "veces", rotulo: "P/P₀" }
      curvas:
        - { expr: "b^n_h", color: naranja, rotulo: "P_{hist} ∝ B^{n}" }
      marcas:
        - { x: "b_h", y: "P_b", rotulo: "Doble flujo" }
      lectura: { valor: P_b, rotulo: "Pérdidas, frente a las iniciales" }
      mandos:
        - { valor: n_h, lista: [1.6, 2, 2.5], rotulo: "Exponente, n" }
    objetivo:
      condiciones:
        - { valor: P_b, min: 5, rotulo: "P/P₀ = {{P_b}}" }
      logrado: "Con n = {{n_h}}, el doble de flujo da {{P_b}} veces las pérdidas. El área del lazo es la energía perdida por ciclo."
      pistas:
        - { texto: "Suba el exponente." }
    escalera:
      - "P ∝ B^{n}: con B doble, 2^{n}."
    solucion: "Con n = 2,5: 5,66 veces."
    comprobar:
      - { P_b: 3.03, tol: 0.01 }
      - { con: { n_h: 2.5 }, P_b: 5.66, tol: 0.01 }
  - id: pregunta-chapa
    tipo: simular
    titulo: "Chapas más finas"
    texto: "Las pérdidas por Foucault crecen con el cuadrado del espesor. Si las chapas se hacen de la mitad de espesor, ¿qué fracción de las pérdidas queda?"
    libro: [207, 208]
    fijar: { e_l: 0.5 }
    simular:
      objetivo: P_e
      unidad: "veces"
      tol: 0.03
      rotulo: "Pérdidas, frente a la chapa inicial"
      errores:
        - { razon: { min: 1.9, max: 2.1 }, texto: "Sería así si fueran con el espesor. Van con su cuadrado." }
        - { razon: { min: 3.9, max: 4.1 }, texto: "Laminar corta los caminos de la corriente inducida: cuanto más fino, menos pérdidas." }
    exito: "La cuarta parte: la mitad al cuadrado. Por eso el audio usa chapas de decenas de micras; la ferrita, aislante, casi las elimina, y el polvo las encierra en cada grano."
    escalera:
      - "Las pérdidas van con el cuadrado del espesor."
    solucion: "0,5² = 0,25."
    comprobar:
      - { P_e: 0.25 }
  - id: porque-vacio
    tipo: porque
    titulo: "Caliente sin carga"
    texto: "Un transformador de red enchufado y sin carga se calienta. ¿Por qué?"
    libro: [213, 214, 203]
    ec: 203
    widget:
      tipo: figura
      figura: fig-4.15
      zonas:
        - { id: perdidas, rotulo: "Lazos y pérdidas frente a la frecuencia", rect: [0, 0, 445, 206] }
    escalera:
      - "En la ecuación de Steinmetz, ¿aparece la corriente de carga?"
    solucion: "No: las pérdidas de hierro dependen de f y de B, y B de la tensión. En vacío siguen completas."
    opciones:
      - texto: "Sus pérdidas de hierro dependen del flujo, no de la carga"
        bien: true
        porque: "B depende de la tensión y la frecuencia. Sin carga disipa sus pérdidas de hierro completas."
      - texto: "Por las pérdidas del cobre"
        porque: "Las de cobre son I²·R y crecen con la carga; sin carga son casi nulas."
      - texto: "Está averiado"
        porque: "Es normal: es lo que consume un cargador olvidado en el enchufe."

  - id: pregunta-ensayo
    tipo: pregunta
    titulo: "El ensayo en vacío"
    texto: "Para medir solo las pérdidas de hierro de un transformador, ¿qué se mide?"
    libro: [222, 203]
    ec: 203
    escalera:
      - "Sin carga, las pérdidas de cobre son casi nulas; las de hierro, completas."
    solucion: "La potencia activa en vacío: la corriente magnetizante es reactiva y no suma potencia media."
    opciones:
      - texto: "La potencia activa que toma en vacío"
        bien: true
        porque: "Sin carga, lo que consume en potencia activa es hierro. Exige medir tensión por corriente en fase."
      - texto: "La corriente que toma en vacío"
        porque: "Incluye la corriente magnetizante, que es reactiva y no aporta potencia media."
      - texto: "Entrada menos salida a plena carga"
        porque: "Eso da las pérdidas totales, cobre incluido."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [201, 202, 204, 207, 210, 213, 219, 220, 222]
    ideas:
      - { titulo: "Histéresis.", texto: "El área del lazo por ciclo: va con f y con B^{n}, n de 1,6 a 2,5. Contra ella, material de lazo estrecho." }
      - { titulo: "Foucault.", texto: "Va con f² y con el cuadrado del espesor: laminar, o material aislante." }
      - { titulo: "Del flujo, no de la carga.", texto: "Un transformador en vacío disipa sus pérdidas de hierro completas." }
      - { titulo: "Medirlas.", texto: "Se dan en mW/cm³; muchas ferritas tienen su mínimo hacia 80-100 °C. En vacío, la potencia activa son las pérdidas de hierro." }
