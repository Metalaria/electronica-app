# Lección 1.2 de la sección 39.2 «Anatomía de un Microcontrolador» (cap38; etiqueta interna sec-38.2).
# Formato: contenido/lecciones11/GUIA.md (§11). Figuras 39.2 (bloques y mapa de direcciones, svg_vista 450,72 × 220,32)
# y 39.3 (árbol de decisión y errata, 450,72 × 205,92).
leccion: cap38/sec-38.2

libro:
  33: "lo que distingue a unos de otros no es tanto el procesador como los periféricos y la memoria"
  35: "la unidad de ejecución"
  36: "donde vive el programa"
  37: "variables y pila, y es lo que primero se acaba"
  39: "temporizadores, convertidores, buses, DMA, controlador de interrupciones"
  44: "¿Qué periféricos hacen falta?"
  45: "lo que no suele decidir: la velocidad del núcleo"
  48: "Las cifras de portada suelen ser del modo más favorable"
  51: "La errata del fabricante, que es el documento más valioso y menos leído"
  52: "consultarla antes de investigar ahorra días"
  55: "buses separados para programa y datos"
  56: "un solo espacio. Más simple de programar, y con posible conflicto de acceso"
  57: "los periféricos se ven como direcciones, y programarlos es escribir en registros"
  60: "Montar el ejemplo más parecido al proyecto y medir el consumo real"
  61: "Comprobar en la errata si alguno de los periféricos que se van a usar tiene limitaciones"
  62: "Arquitectura interna de un microcontrolador"
  63: "El árbol de decisión para elegir microcontrolador"

modelo:
  valores: {}
  calculos: {}

tarjetas:
  - id: explore-bloques
    tipo: explorar
    titulo: "Un chip, cuatro bloques"
    texto: "Procesador, memoria y periféricos en el mismo chip. Toque cada bloque."
    libro: [62, 35, 36, 37, 39]
    widget:
      tipo: figura
      figura: fig-38.2
      zonas:
        - { id: nucleo, rotulo: "Arriba a la izquierda", rect: [17, 37, 94, 42], texto: "Núcleo: la unidad de ejecución, de 8 a 32 bits." }
        - { id: flash, rotulo: "Arriba en el centro", rect: [124, 37, 95, 42], texto: "Flash: donde vive el programa, de kilobytes a megabytes." }
        - { id: ram, rotulo: "Arriba a la derecha", rect: [231, 37, 94, 42], texto: "RAM: variables y pila." }
        - { id: perifericos, rotulo: "Fila de abajo", rect: [17, 143, 307, 46], texto: "Periféricos: temporizadores, convertidores, buses, DMA, controlador de interrupciones." }
    requiere: { mover: [ram, perifericos] }

  - id: toque-se-acaba
    tipo: tocar
    titulo: "Lo que se acaba antes"
    texto: "Su proyecto crece. Toque el bloque que se acaba primero."
    libro: [37, 62]
    widget:
      tipo: figura
      figura: fig-38.2
      zonas:
        - { id: nucleo, rotulo: "Arriba a la izquierda", rect: [17, 37, 94, 42] }
        - { id: flash, rotulo: "Arriba en el centro", rect: [124, 37, 95, 42] }
        - { id: ram, rotulo: "Arriba a la derecha", rect: [231, 37, 94, 42] }
        - { id: perifericos, rotulo: "Fila de abajo", rect: [17, 143, 307, 46] }
    tocar:
      bien: [ram]
      porque:
        nucleo: "El núcleo casi nunca limita: pocos proyectos empotrados se quedan cortos de megahercios."
        flash: "La Flash guarda el programa y suele sobrar antes que la RAM."
        perifericos: "Los periféricos se eligen al principio; no se gastan al crecer el programa."
    exito: "La RAM: variables y pila. Por eso se estima y se multiplica por dos."
    escalera: ["¿Dónde viven las variables y la pila?"]
    solucion: "Arriba a la derecha: la RAM."

  - id: ordene-decision
    tipo: pregunta
    fase: "Ordene"
    titulo: "El árbol de decisión"
    texto: "Ponga en orden las preguntas que deciden el microcontrolador."
    libro: [44]
    ordenar:
      - "¿Qué periféricos hacen falta?"
      - "¿Cuánta RAM?"
      - "¿Qué consumo?"
      - "¿Qué ecosistema?"
      - "¿Disponibilidad a largo plazo?"
    exito: "Los periféricos primero: si hace falta CAN, USB o convertidores de 12 bits, descartan familias enteras."
    pistas:
      - { texto: "La primera pregunta es la que más candidatos descarta." }
    escalera: ["Empiece por lo que descarta familias enteras: CAN, USB, convertidores."]
    solucion: "Periféricos, RAM, consumo, ecosistema y disponibilidad."

  - id: prediga-no-decide
    tipo: predecir
    titulo: "Lo que no suele decidir"
    texto: "¿Qué característica casi nunca decide la elección de un microcontrolador?"
    libro: [45, 63]
    widget:
      tipo: figura
      figura: fig-38.3
      zonas:
        - { id: errata, rotulo: "Recuadro de abajo a la derecha", rect: [290, 67, 156, 134], texto: "La errata del fabricante: los fallos conocidos del silicio." }
    opciones:
      - { texto: "La velocidad del núcleo", bien: true, porque: "Casi ningún proyecto empotrado se limita por megahercios." }
      - { texto: "Los periféricos", porque: "Es lo primero que decide: sin CAN o USB, la familia no sirve." }
      - { texto: "El consumo", porque: "Si va a pilas, decide todo lo demás." }
      - { texto: "La RAM", porque: "Es lo que primero se acaba: se estima y se multiplica por dos." }
    escalera: ["¿Cuántos proyectos empotrados se quedan cortos de megahercios?"]
    solucion: "La velocidad del núcleo."

  - id: pregunta-errata
    tipo: pregunta
    titulo: "Un comportamiento inexplicable"
    texto: "Un periférico hace algo que la hoja de datos no explica. ¿Qué consulta antes de investigar?"
    libro: [51, 52, 63]
    widget:
      tipo: figura
      figura: fig-38.3
      zonas:
        - { id: no-decide, rotulo: "Recuadro de arriba a la derecha", rect: [290, 4, 156, 55], texto: "Lo que no suele decidir: la velocidad del núcleo." }
    opciones:
      - { texto: "La errata del fabricante", bien: true, porque: "Es la lista de fallos conocidos del silicio: muchos comportamientos inexplicables están ahí, y consultarla ahorra días." }
      - { texto: "La primera página de la hoja de datos", porque: "Sus cifras suelen ser del caso más favorable; los fallos del silicio no están ahí." }
      - { texto: "Un foro, después de una semana de pruebas", porque: "Primero la errata: está documentado y ahorra días." }
    escalera: ["El documento más valioso y menos leído."]
    solucion: "La errata: los fallos conocidos del silicio y sus soluciones."

  - id: pregunta-portada
    tipo: pregunta
    titulo: "La cifra de portada"
    texto: "La portada de una hoja de datos da un consumo muy bajo. ¿Qué hay que sospechar?"
    libro: [48, 63]
    widget:
      tipo: figura
      figura: fig-38.3
      zonas:
        - { id: errata, rotulo: "Recuadro de abajo a la derecha", rect: [290, 67, 156, 134], texto: "Leer la errata antes de elegir." }
    opciones:
      - { texto: "Que es la del modo más favorable", bien: true, porque: "Hay que buscar el consumo en cada modo, con sus condiciones exactas." }
      - { texto: "Que es un error de imprenta", porque: "No es un error: es real, pero en las condiciones más favorables." }
      - { texto: "Nada: es el consumo de funcionamiento normal", porque: "Las cifras de portada suelen ser del modo más favorable, no del uso real." }
    escalera: ["¿En qué condiciones se mide la cifra que luce en portada?"]
    solucion: "La del modo más favorable: mire cada modo con sus condiciones."

  - id: empareje-harvard
    tipo: pregunta
    fase: "Empareje"
    titulo: "Dos organizaciones"
    texto: "Una cada organización de la memoria con su consecuencia."
    libro: [55, 56]
    emparejar:
      - ["Harvard", "Busca instrucción y dato a la vez"]
      - ["Von Neumann", "Un solo espacio, con posible conflicto de acceso"]
    exito: "Harvard complica además leer constantes desde la Flash, que a veces exige instrucciones especiales."
    pistas:
      - { texto: "Harvard tiene buses separados para programa y datos." }
    escalera: ["¿Cuál tiene buses separados para programa y datos?"]
    solucion: "Harvard: buses separados, instrucción y dato a la vez. Von Neumann: un espacio, más simple."

  - id: porque-registros
    tipo: porque
    titulo: "Programar un periférico"
    texto: "Toda biblioteca de bajo nivel, por debajo, escribe en direcciones. ¿Por qué?"
    libro: [57, 62]
    widget:
      tipo: figura
      figura: fig-38.2
      zonas:
        - { id: mapa, rotulo: "Columna de la derecha", rect: [395, 30, 52, 166], texto: "Mapa de direcciones: Flash, RAM, periféricos y núcleo en el mismo espacio." }
    opciones:
      - { texto: "Porque los periféricos se ven como direcciones del mapa de memoria", bien: true, porque: "Sus registros están en el mismo mapa que la RAM: configurarlos es escribir en ellos." }
      - { texto: "Porque los periféricos se programan desde la Flash", porque: "La Flash guarda el programa; los periféricos tienen sus propios registros en el mapa." }
      - { texto: "Porque el núcleo no puede leer los periféricos", porque: "Sí puede: leer un registro devuelve el estado de ese hardware." }
    escalera: ["Mire el mapa de direcciones de la figura."]
    solucion: "Los periféricos ocupan direcciones: programarlos es escribir en registros."

  - id: pregunta-banco
    tipo: pregunta
    titulo: "Antes de comprometerse"
    texto: "Antes de elegir el microcontrolador, ¿qué dos comprobaciones ahorran rediseños?"
    libro: [60, 61, 63]
    widget:
      tipo: figura
      figura: fig-38.3
      zonas:
        - { id: errata, rotulo: "Recuadro de abajo a la derecha", rect: [290, 67, 156, 134], texto: "Veinte minutos que evitan un rediseño." }
    opciones:
      - { texto: "Medir el consumo real con el ejemplo más parecido y leer la errata", bien: true, porque: "Veinte minutos de errata evitan descubrir a mitad que dos funciones necesarias son incompatibles." }
      - { texto: "Comparar los megahercios y el precio", porque: "La velocidad casi nunca decide; el consumo real y la errata, sí." }
      - { texto: "Escribir todo el firmware y probarlo", porque: "Demasiado tarde: el rediseño ya sería caro." }
    escalera: ["Una es una medida y la otra, una lectura de veinte minutos."]
    solucion: "Montar el ejemplo más parecido y medir el consumo en el modo previsto; leer la errata de los periféricos."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [33, 37, 44, 51]
    ideas:
      - { titulo: "Un chip.", texto: "Núcleo, Flash, RAM y periféricos; los distinguen periféricos y memoria." }
      - { titulo: "La RAM se acaba.", texto: "Se estima y se multiplica por dos." }
      - { titulo: "Para elegir.", texto: "Periféricos, RAM, consumo, ecosistema y disponibilidad; no los megahercios." }
      - { titulo: "La errata.", texto: "El documento más valioso y menos leído." }
