# Lección 1.2 de la sección 39.2 «Anatomía de un Microcontrolador» (cap38; etiqueta interna sec-38.2).
# Formato: contenido/lecciones11/GUIA.md (§11). Figuras 39.2 (bloques y mapa de direcciones, svg_vista 450,72 × 220,32)
# y 39.3 (árbol de decisión y errata, 450,72 × 205,92).
# 1.2.1 («aprender haciendo», GUIA §13): el mapa de direcciones de la figura 39.2 se explora con un decodificador de
# los tres bits altos de la dirección (Flash en 0x0800 0000: 000; RAM en 0x2000 0000: 001; periféricos en 0x4000 0000:
# 010; núcleo en 0xE000 0000: 111; ilustración coherente con el mapa, no un decodificador concreto del libro); el
# comienzo de los periféricos se lee en hexadecimal; la RAM, la pregunta del consumo y la errata se tocan. Quedan dos
# preguntas de opciones: lo que no decide y la cifra de portada. Harvard y Von Neumann van en el resumen.
leccion: cap38/sec-38.2

libro:
  33: "lo que distingue a unos de otros no es tanto el procesador como los periféricos y la memoria"
  35: "la unidad de ejecución"
  36: "donde vive el programa"
  37: "variables y pila, y es lo que primero se acaba"
  39: "temporizadores, convertidores, buses, DMA, controlador de interrupciones"
  44: "¿Qué periféricos hacen falta?"
  45: "lo que no suele decidir: la velocidad del núcleo"
  48: "Las cifras de portada suelen ser del modo más favorable"
  51: "La errata del fabricante, que es el documento más valioso y menos leído"
  52: "consultarla antes de investigar ahorra días"
  55: "buses separados para programa y datos"
  56: "un solo espacio. Más simple de programar, y con posible conflicto de acceso"
  57: "los periféricos se ven como direcciones, y programarlos es escribir en registros"
  60: "Montar el ejemplo más parecido al proyecto y medir el consumo real"
  61: "Comprobar en la errata si alguno de los periféricos que se van a usar tiene limitaciones"
  62: "Arquitectura interna de un microcontrolador"
  63: "El árbol de decisión para elegir microcontrolador"

modelo:
  valores: {}
  calculos: {}

tarjetas:
  - id: explore-bloques
    tipo: explorar
    titulo: "Periféricos en el mapa"
    texto: "Los tres bits altos de la dirección eligen la zona del mapa: Flash, RAM, periféricos o núcleo. Elija la de los periféricos."
    libro: [57, 62]
    widget:
      tipo: logica
      entradas:
        - { id: A29, rotulo: "A29" }
        - { id: A30, rotulo: "A30" }
        - { id: A31, rotulo: "A31" }
      piezas:
        - { id: dec, tipo: decodificador, bits: 3, entradas: [A29, A30, A31, "1"], rotulo: "Decodificador" }
      salidas:
        - { id: FLASH, de: dec.y0, rotulo: "Flash" }
        - { id: RAM, de: dec.y1, rotulo: "RAM" }
        - { id: PER, de: dec.y2, rotulo: "Periféricos" }
        - { id: CPU, de: dec.y7, rotulo: "Núcleo" }
    objetivo:
      condiciones:
        - { led: PER, valor: 1, rotulo: "Periféricos elegidos" }
      logrado: "Con A30 encendida y las otras apagadas, la zona de los periféricos. Sus registros son direcciones: programarlos es escribir en ellas."
      pistas:
        - { texto: "Mire en el mapa en qué dirección empiezan los periféricos." }
    escalera: ["Cada zona del mapa empieza en una combinación de los bits altos."]
    solucion: "A30 encendida; A31 y A29 apagadas."

  - id: toque-se-acaba
    tipo: tocar
    titulo: "Lo que se acaba antes"
    texto: "Su proyecto crece. Toque el bloque que se acaba primero."
    libro: [35, 36, 37, 39, 62]
    widget:
      tipo: figura
      figura: fig-38.2
      zonas:
        - { id: nucleo, rotulo: "Arriba a la izquierda", rect: [17, 37, 94, 42] }
        - { id: flash, rotulo: "Arriba en el centro", rect: [124, 37, 95, 42] }
        - { id: ram, rotulo: "Arriba a la derecha", rect: [231, 37, 94, 42] }
        - { id: perifericos, rotulo: "Fila de abajo", rect: [17, 143, 307, 46] }
    tocar:
      bien: [ram]
      porque:
        nucleo: "El núcleo casi nunca limita: pocos proyectos empotrados se quedan cortos de megahercios."
        flash: "La Flash guarda el programa y suele sobrar antes que la RAM."
        perifericos: "Los periféricos se eligen al principio; no se gastan al crecer el programa."
    exito: "La RAM: variables y pila. Por eso se estima y se multiplica por dos."
    escalera: ["¿Dónde viven las variables y la pila?"]
    solucion: "Arriba a la derecha: la RAM."

  - id: ordene-decision
    tipo: tocar
    titulo: "A pilas"
    texto: "El aparato va a pilas. Toque la pregunta del árbol que, entonces, decide todo lo demás."
    libro: [44, 63]
    widget:
      tipo: figura
      figura: fig-38.3
      zonas:
        - { id: perifericos, rotulo: "Primera pregunta", rect: [4, 13, 236, 35] }
        - { id: ram, rotulo: "Segunda pregunta", rect: [4, 50, 236, 35] }
        - { id: consumo, rotulo: "Tercera pregunta", rect: [4, 87, 236, 35] }
        - { id: ecosistema, rotulo: "Cuarta pregunta", rect: [4, 124, 236, 35] }
        - { id: disponibilidad, rotulo: "Quinta pregunta", rect: [4, 161, 236, 35] }
    tocar:
      bien: [consumo]
      porque:
        perifericos: "Es la primera criba, la que descarta familias enteras, pero no habla de pilas."
        ram: "La RAM se estima y se multiplica por dos; no depende de las pilas."
        ecosistema: "Herramientas y bibliotecas importan, pero a pilas manda el consumo."
        disponibilidad: "Importa para no rediseñar, no por las pilas."
    exito: "El consumo, tercera pregunta: antes van los periféricos, que descartan familias enteras, y la RAM."
    escalera: ["¿Qué gasta las pilas?"]
    solucion: "La tercera: ¿qué consumo?"

  - id: prediga-no-decide
    tipo: predecir
    titulo: "Lo que no suele decidir"
    texto: "¿Qué característica casi nunca decide la elección de un microcontrolador?"
    libro: [45, 63]
    widget:
      tipo: figura
      figura: fig-38.3
      zonas:
        - { id: errata, rotulo: "Recuadro de abajo a la derecha", rect: [290, 67, 156, 134], texto: "La errata del fabricante: los fallos conocidos del silicio." }
    opciones:
      - { texto: "La velocidad del núcleo", bien: true, porque: "Casi ningún proyecto empotrado se limita por megahercios." }
      - { texto: "Los periféricos", porque: "Es lo primero que decide: sin CAN o USB, la familia no sirve." }
      - { texto: "El consumo", porque: "Si va a pilas, decide todo lo demás." }
      - { texto: "La RAM", porque: "Es lo que primero se acaba: se estima y se multiplica por dos." }
    escalera: ["¿Cuántos proyectos empotrados se quedan cortos de megahercios?"]
    solucion: "La velocidad del núcleo."

  - id: pregunta-errata
    tipo: tocar
    titulo: "Un comportamiento inexplicable"
    texto: "Un periférico hace algo que la hoja de datos no explica. Toque lo que se consulta antes de investigar."
    libro: [51, 52, 61, 63]
    widget:
      tipo: figura
      figura: fig-38.3
      zonas:
        - { id: arbol, rotulo: "Las preguntas de la izquierda", rect: [4, 13, 236, 183] }
        - { id: no-decide, rotulo: "Recuadro de arriba a la derecha", rect: [290, 4, 156, 55] }
        - { id: errata, rotulo: "Recuadro de abajo a la derecha", rect: [290, 67, 156, 134] }
    tocar:
      bien: [errata]
      porque:
        arbol: "El árbol sirve para elegir el chip, no para explicar un fallo."
        no-decide: "La velocidad del núcleo no explica un periférico que falla."
    exito: "La errata: los fallos conocidos del silicio y sus soluciones. Leída antes de elegir, son veinte minutos que evitan un rediseño."
    escalera: ["El documento más valioso y menos leído."]
    solucion: "La errata del fabricante."

  - id: pregunta-portada
    tipo: pregunta
    titulo: "La cifra de portada"
    texto: "La portada de una hoja de datos da un consumo muy bajo. ¿Qué hay que sospechar?"
    libro: [48, 60, 63]
    widget:
      tipo: figura
      figura: fig-38.3
      zonas:
        - { id: errata, rotulo: "Recuadro de abajo a la derecha", rect: [290, 67, 156, 134], texto: "Leer la errata antes de elegir." }
    opciones:
      - { texto: "Que es la del modo más favorable", bien: true, porque: "Busque cada modo con sus condiciones, y mida el real con el ejemplo más parecido al proyecto." }
      - { texto: "Que es un error de imprenta", porque: "No es un error: es real, pero en las condiciones más favorables." }
      - { texto: "Nada: es el consumo de funcionamiento normal", porque: "Las cifras de portada suelen ser del modo más favorable, no del uso real." }
    escalera: ["¿En qué condiciones se mide la cifra que luce en portada?"]
    solucion: "La del modo más favorable: mire cada modo con sus condiciones."

  - id: porque-registros
    tipo: leer
    titulo: "Programar un periférico"
    texto: "En el mapa de direcciones de la figura, ¿a partir de qué dirección empiezan los periféricos? Escríbala en hexadecimal."
    libro: [57, 62]
    widget:
      tipo: figura
      figura: fig-38.2
      zonas:
        - { id: mapa, rotulo: "Columna de la derecha", rect: [395, 30, 52, 166] }
    leer:
      objetivo: "0x40000000"
      base: 16
      cifras: 32
      rotulo: "Dirección"
      errores:
        - { expr: "536870912", texto: "Esa es la RAM; los periféricos van encima." }
    exito: "0x4000 0000: los registros de los periféricos están ahí, en el mismo mapa que la RAM. Toda biblioteca de bajo nivel escribe en ellos."
    escalera: ["Busque el comienzo de la zona de periféricos en la columna de la derecha."]
    solucion: "0x4000 0000."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [33, 37, 44, 51, 55, 56]
    ideas:
      - { titulo: "Un chip.", texto: "Núcleo, Flash, RAM y periféricos en un mapa; Harvard separa los buses de programa y datos." }
      - { titulo: "La RAM se acaba.", texto: "Se estima y se multiplica por dos." }
      - { titulo: "Para elegir.", texto: "Periféricos, RAM, consumo, ecosistema y disponibilidad; no los megahercios." }
      - { titulo: "La errata.", texto: "El documento más valioso y menos leído." }
