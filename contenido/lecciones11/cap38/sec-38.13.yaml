# Lección 1.2 de la sección 39.13 «Ampliación: Planificación en Tiempo Real» (cap38; etiqueta interna sec-38.13).
# Formato: contenido/lecciones11/GUIA.md (§5.2, §11). Figura 39.17 (svg_vista 430,68 × 274,91): cooperativo frente a
# expulsivo con una tarea crítica de 0,5 ms cada 2,5 ms. La cota de rate monotonic, U ≤ n·(2^(1/n) − 1), es la del
# resumen de la sección 39.15 (bloque 474) y la del problema 39.B (78,0 % para tres tareas).
leccion: cap38/sec-38.13

libro:
  394: "una que debe ejecutarse cada milisegundo y otra que tarda cincuenta"
  397: "si añadir una función obliga a reorganizar todas las demás, el bucle ha llegado a su límite"
  399: "Cada tarea se ejecuta hasta que cede voluntariamente el control."
  400: "una tarea no puede ser interrumpida a mitad de una operación"
  401: "una tarea que no cede bloquea el sistema"
  403: "El sistema interrumpe una tarea para ejecutar otra de mayor prioridad."
  404: "la latencia de las tareas críticas está acotada"
  405: "aparecen los problemas de concurrencia"
  407: "asigna más prioridad a las tareas de periodo más corto"
  408: "por debajo de aproximadamente el 69 %, todas las tareas cumplen sus plazos, garantizado"
  412: "la alta queda esperando indefinidamente por culpa de una de prioridad media"
  413: "mientras la tarea baja tenga el recurso, hereda la prioridad de la que espera"
  416: "Pocas tareas, plazos holgados"
  417: "empezar por lo simple"
  420: "Si su duración máxima —no la media— es menor que el plazo más corto, el bucle basta"
  421: "Planificación cooperativa frente a expulsiva, con el criterio de rate monotonic"
  "cap38#522": "cota para 3 tareas = 78,0 %"

modelo:
  valores:
    n_t: { sim: "n", nombre: "número de tareas", unidad: "", valor: 1 }
    C_c: { sim: "C", nombre: "duración de la tarea crítica", unidad: s, valor: 0.0005 }
    T_p: { sim: "T", nombre: "periodo de la tarea crítica", unidad: s, valor: 0.0025 }
  calculos:
    cota: { expr: "n_t*(2^(1/n_t) - 1)*100", sim: "U_{máx}", nombre: "cota de utilización", unidad: "%" }
    U_c: { expr: "C_c/T_p*100", sim: "U", nombre: "utilización de la tarea crítica", unidad: "%" }

tarjetas:
  - id: explore-dos
    tipo: explorar
    titulo: "Cooperativo y expulsivo"
    texto: "La misma tarea crítica y una tarea larga, con dos planificadores. Toque cada uno y compare cuándo empieza la crítica."
    libro: [399, 403, 421]
    widget:
      tipo: figura
      figura: fig-38.17
      zonas:
        - { id: cooperativo, rotulo: "Panel de arriba", rect: [25, 3, 404, 98], texto: "Cooperativo: la crítica espera a que la larga ceda, y cada vez espera distinto." }
        - { id: expulsivo, rotulo: "Panel de abajo", rect: [25, 118, 404, 98], texto: "Expulsivo: la crítica expulsa a la larga en cuanto se activa." }
    requiere: { mover: [cooperativo, expulsivo] }

  - id: pregunta-sintoma
    tipo: pregunta
    titulo: "El bucle se queda corto"
    texto: "¿Cuál de estos es un síntoma de que el bucle principal ha llegado a su límite?"
    libro: [394, 397, 421]
    widget:
      tipo: figura
      figura: fig-38.17
      zonas:
        - { id: cooperativo, rotulo: "Panel de arriba", rect: [25, 3, 404, 98], texto: "Una tarea larga retrasa a la crítica." }
    opciones:
      - { texto: "Una tarea debe ir cada milisegundo y otra tarda cincuenta", bien: true, porque: "Plazos incompatibles: la larga impide cumplir el plazo de la corta." }
      - { texto: "El bucle tiene pocas tareas con plazos holgados", porque: "Es justo el caso en que el bucle basta." }
      - { texto: "El programa ocupa mucha Flash", porque: "El tamaño no dice nada de los plazos." }
    escalera: ["El criterio práctico: añadir una función obliga a reorganizar todas las demás."]
    solucion: "Plazos incompatibles: cada milisegundo frente a una tarea de cincuenta."

  - id: prediga-cooperativo
    tipo: predecir
    titulo: "Una tarea que no cede"
    texto: "En un planificador cooperativo, una tarea entra en un bucle y no devuelve el control. ¿Qué pasa?"
    libro: [399, 401, 421]
    widget:
      tipo: figura
      figura: fig-38.17
      zonas:
        - { id: cooperativo, rotulo: "Panel de arriba", rect: [25, 3, 404, 98], texto: "La crítica espera a que la larga ceda." }
    opciones:
      - { texto: "Se bloquea todo el sistema", bien: true, porque: "Cada tarea se ejecuta hasta que cede: si una no cede, ninguna otra vuelve a ejecutarse." }
      - { texto: "El planificador la interrumpe", porque: "Eso lo hace un expulsivo; el cooperativo depende de que todas se porten bien." }
      - { texto: "Solo se retrasa la tarea crítica", porque: "No se retrasa: no llega nunca, ni ella ni ninguna." }
    escalera: ["¿Quién devuelve el control en un cooperativo?"]
    solucion: "Todo se bloquea: el cooperativo depende de que cada tarea ceda."

  - id: empareje-planificadores
    tipo: pregunta
    fase: "Empareje"
    titulo: "Ventajas e inconvenientes"
    texto: "Una cada rasgo con su planificador."
    libro: [400, 401, 404, 405]
    emparejar:
      - ["Cooperativo, su ventaja", "Una tarea no puede ser interrumpida a mitad de una operación"]
      - ["Cooperativo, su inconveniente", "Una tarea que no cede bloquea el sistema"]
      - ["Expulsivo, su ventaja", "La latencia de las tareas críticas está acotada"]
      - ["Expulsivo, su inconveniente", "Secciones críticas y datos compartidos que proteger"]
    exito: "Lo que gana uno es lo que pierde el otro: concurrencia frente a latencia acotada."
    pistas:
      - { texto: "Los problemas de concurrencia aparecen cuando se puede interrumpir a mitad." }
    escalera: ["¿Cuál de los dos puede expulsar a una tarea?"]
    solucion: "Cooperativo: sin concurrencia, pero bloquea si no cede. Expulsivo: latencia acotada, con concurrencia."

  - id: explore-cota
    tipo: explorar
    titulo: "La cota de rate monotonic"
    texto: "Más prioridad al periodo más corto. Cambie el número de tareas y mire hasta qué utilización se garantizan los plazos."
    libro: [407, 408, "cap38#522"]
    widget:
      tipo: grafica
      x: { id: nn, min: 1, max: 10, unidad: "", rotulo: "tareas" }
      y: { min: 60, max: 105, unidad: "%", rotulo: "U_{máx}" }
      curvas:
        - { expr: "nn*(2^(1/nn) - 1)*100", color: azul, rotulo: "cota" }
        - { expr: "69.3", color: naranja, rotulo: "ln 2", discontinua: true }
      marcas:
        - { x: "n_t", y: "cota", rotulo: "{{cota}}" }
      lectura: { valor: cota, rotulo: "Cota de utilización" }
      mandos:
        - { valor: n_t, min: 1, max: 10, paso: 1, rotulo: "Número de tareas" }
    requiere: { mover: [n_t] }

  - id: estime-critica
    tipo: pregunta
    fase: "Estime"
    titulo: "La tarea crítica"
    texto: "La tarea crítica de la figura dura 0,5 ms cada 2,5 ms. ¿Qué parte del procesador ocupa?"
    libro: [421]
    fijar: { C_c: 0.0005, T_p: 0.0025 }
    widget:
      tipo: figura
      figura: fig-38.17
      zonas:
        - { id: expulsivo, rotulo: "Panel de abajo", rect: [25, 118, 404, 98], texto: "La crítica, en azul." }
    estimar:
      objetivo: "U_c"
      unidad: "%"
      min: 0
      max: 100
      paso: 1
      inicio: 60
      tol: 0.05
      rotulo: "Utilización"
    exito: "Un 20 %: holgado frente a la cota."
    pistas:
      - { cuando: { valor: estimacion, mayor: 20 }, texto: "Se ha pasado: divida lo que dura entre su periodo." }
      - { texto: "Se ha quedado corto: 0,5 entre 2,5 es una quinta parte." }
    escalera: ["Utilización = duración / periodo."]
    solucion: "0,5 / 2,5 = 20 %."
    comprobar:
      - { U_c: 20 }

  - id: porque-inversion
    tipo: porque
    titulo: "La inversión de prioridad"
    texto: "La baja tiene un recurso, la alta lo espera y una media, que no lo usa, expulsa a la baja. ¿Por qué espera la alta indefinidamente?"
    libro: [412, 413]
    widget:
      tipo: figura
      figura: fig-38.17
      zonas:
        - { id: expulsivo, rotulo: "Panel de abajo", rect: [25, 118, 404, 98], texto: "En expulsivo, la de más prioridad expulsa a las demás." }
    opciones:
      - { texto: "La baja no avanza mientras la media la expulse, y no suelta el recurso", bien: true, porque: "La alta depende de la baja, y la baja de la media: la herencia de prioridad lo resuelve." }
      - { texto: "Porque la alta tiene menos prioridad que la media", porque: "Tiene más; espera por el recurso que retiene la baja." }
      - { texto: "Porque el recurso está averiado", porque: "El recurso funciona: quien lo tiene no llega a ejecutarse." }
    escalera: ["¿Quién tiene que avanzar para que el recurso quede libre?"]
    solucion: "La baja retiene el recurso y no avanza: mientras lo tenga, debe heredar la prioridad de la alta."

  - id: empareje-cuando
    tipo: pregunta
    fase: "Empareje"
    titulo: "Cuándo usar cada cosa"
    texto: "Una cada situación con su solución."
    libro: [416, 417]
    emparejar:
      - ["Pocas tareas, plazos holgados", "Bucle con máquinas de estados"]
      - ["Tareas independientes, plazos moderados", "Cooperativo"]
      - ["Plazos estrictos y tareas largas", "Expulsivo"]
      - ["Certificación de seguridad", "Sistema certificado"]
    exito: "Y la recomendación: empezar por lo simple; muchos proyectos con sistema operativo no lo necesitaban."
    pistas:
      - { texto: "Lo más sencillo, para lo más holgado." }
    escalera: ["¿Qué hace falta cuando una tarea larga no puede retrasar a una urgente?"]
    solucion: "Holgado, bucle; moderado, cooperativo; estricto, expulsivo; certificación, sistema certificado."

  - id: pregunta-banco
    tipo: pregunta
    titulo: "¿Basta el bucle?"
    texto: "Un pin conmuta al principio y al final del bucle principal. ¿Cuándo basta el bucle?"
    libro: [420]
    widget:
      tipo: figura
      figura: fig-38.17
      zonas:
        - { id: cooperativo, rotulo: "Panel de arriba", rect: [25, 3, 404, 98], texto: "Las esperas de la crítica dependen de la larga." }
    opciones:
      - { texto: "Si su duración máxima es menor que el plazo más corto", bien: true, porque: "Si el máximo se dispara de vez en cuando, ahí está la tarea que hay que trocear o mover." }
      - { texto: "Si su duración media es menor que el plazo más corto", porque: "La media esconde los picos: cuenta el máximo." }
      - { texto: "Si el pin conmuta muy deprisa", porque: "No hay una frecuencia mágica: se compara con el plazo más corto." }
    escalera: ["En tiempo real, ¿media o peor caso?"]
    solucion: "Si la duración máxima del bucle es menor que el plazo más corto."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [399, 403, 408, 413]
    ideas:
      - { titulo: "Cooperativo.", texto: "Simple y sin concurrencia; depende de que todas cedan." }
      - { titulo: "Expulsivo.", texto: "Latencia acotada, a cambio de proteger lo compartido." }
      - { titulo: "Rate monotonic.", texto: "Periodo corto, prioridad alta: por debajo del 69 %, se cumplen los plazos." }
      - { titulo: "Herencia.", texto: "La baja que tiene el recurso hereda la prioridad de la alta." }
