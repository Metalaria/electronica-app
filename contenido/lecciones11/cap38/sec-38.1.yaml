# Lección 1.2 de la sección 39.1 «Qué Distingue a un Sistema Embebido» (cap38; etiqueta interna sec-38.1).
# Formato: contenido/lecciones11/GUIA.md (§11). La figura 39.1 lleva las seis restricciones y el ejemplo A/B del
# tiempo real; las zonas están en las coordenadas de su svg_vista (450,72 × 263,52).
# 1.2.1 («aprender haciendo», GUIA §13): el ejemplo A/B (bloque 16) se explora eligiendo un plazo (1, 10 o 100 ms, los
# números del libro) que A cumpla siempre y B no; en la figura se tocan la restricción de la recursión, la de la fuga,
# la de recuperarse solo y la de la actualización. Quedan dos preguntas de opciones: duro o blando y prototipo o
# producto. El peor caso, las reglas y el banco van en los textos.
leccion: cap38/sec-38.1

libro:
  3: "un ordenador que está dentro de otra cosa"
  5: "kilobytes de memoria en lugar de gigabytes"
  8: "años sin reiniciar, lo que hace que fugas de memoria y desbordamientos lentos sean fatales"
  9: "El sistema tiene que recuperarse solo"
  10: "Lo que se envíe es lo que habrá durante años"
  14: "incumplir un plazo es un fallo del sistema"
  15: "incumplirlo degrada la calidad"
  16: "el tiempo real no es «rápido», es predecible"
  17: "lo que se mide no sea la media sino el peor caso"
  19: "Nada de asignación dinámica de memoria en sistemas críticos"
  20: "Nada de recursión sin límite acotado, por la pila"
  21: "esperas con tiempo de expiración"
  22: "qué hace el sistema si un sensor no responde"
  23: "separa un prototipo de un producto"
  25: "puede significar una visita a un tejado"
  26: "no sean perfeccionismo, sino lo que hace viable el producto"
  29: "Desconectar sensores, cortar la comunicación, quitar la alimentación en momentos aleatorios"
  30: "Las seis restricciones de un sistema empotrado"

modelo:
  valores:
    t_A: { sim: "t_{A}", nombre: "peor respuesta de A", unidad: s, valor: 0.01 }
    t_B: { sim: "t_{B}", nombre: "peor respuesta de B", unidad: s, valor: 0.1 }
    P: { sim: "plazo", nombre: "plazo", unidad: s, valor: 0.001 }
  calculos:
    ok_A: { expr: "floor(P/t_A)", nombre: "A cumple el plazo", cifras: 2 }
    ok_B: { expr: "floor(P/t_B)", nombre: "B cumple el plazo", cifras: 2 }

tarjetas:
  - id: explore-seis
    tipo: explorar
    titulo: "Predecible, no rápido"
    texto: "A responde siempre en 10 ms; B, en 1 ms casi siempre y en 100 ms a veces. Elija un plazo que A cumpla siempre y B no."
    libro: [16, 17, 30]
    inicio: { P: 0.001 }
    widget:
      tipo: grafica
      x: { id: px, min: 0.0005, max: 0.2, unidad: s, rotulo: "plazo", escala: log }
      y: { min: 0.0005, max: 0.2, unidad: s, rotulo: "tiempo", escala: log }
      curvas:
        - { expr: "px", color: tinta, rotulo: "Plazo", discontinua: true }
        - { expr: "t_A", color: azul, rotulo: "Peor caso de A" }
        - { expr: "t_B", color: naranja, rotulo: "Peor caso de B" }
      marcas:
        - { x: "P", y: "P", rotulo: "Su plazo" }
      mandos:
        - { valor: P, lista: [0.001, 0.01, 0.1], rotulo: "Plazo" }
    objetivo:
      condiciones:
        - { valor: ok_A, min: 1, rotulo: "A cumple" }
        - { valor: ok_B, max: 0, rotulo: "B no cumple" }
      logrado: "Con {{P}}, A cumple siempre y B no, aunque su media sea menor. En tiempo real duro cuenta el peor caso: un plazo incumplido ya es un fallo."
      pistas:
        - { cuando: { valor: ok_A, max: 0 }, texto: "Ni A llega: alargue el plazo." }
        - { texto: "Con ese plazo cumplen los dos: acórtelo." }
    escalera: ["Un sistema cumple si su peor respuesta queda dentro del plazo."]
    solucion: "Un plazo de 10 ms."
    comprobar:
      - { con: { P: 0.01 }, ok_A: 1, ok_B: 0 }

  - id: pregunta-blando
    tipo: pregunta
    titulo: "Duro o blando"
    texto: "¿Cuál de estos plazos es de tiempo real blando?"
    libro: [14, 15]
    widget:
      tipo: figura
      figura: fig-38.1
      zonas:
        - { id: duro-blando, rotulo: "Abajo a la derecha", rect: [295, 112, 152, 145], texto: "Duro: incumplir es un fallo. Blando: degrada la calidad." }
    opciones:
      - { texto: "Enviar datos a la nube", bien: true, porque: "Si llegan tarde, el servicio empeora, pero el sistema no falla: es blando." }
      - { texto: "El disparo de un airbag", porque: "Llegar tarde es un fallo del sistema: es el ejemplo de duro." }
      - { texto: "El control de un motor", porque: "Es duro: un plazo incumplido es un fallo, no una pérdida de calidad." }
      - { texto: "Un muestreo periódico", porque: "El libro lo pone entre los duros: una muestra tarde estropea la medida." }
    escalera: ["Blando: incumplirlo degrada la calidad, pero no es un fallo."]
    solucion: "Enviar datos a la nube, como refrescar una pantalla, es blando."

  - id: toque-recursos
    tipo: tocar
    titulo: "Como en un PC"
    texto: "Un firmware usa memoria dinámica y recursión sin límite, como un programa de escritorio. Toque la restricción que lo desaconseja."
    libro: [5, 19, 20, 21, 30]
    widget:
      tipo: figura
      figura: fig-38.1
      zonas:
        - { id: recursos, rotulo: "Arriba a la izquierda", rect: [4, 3, 144, 47] }
        - { id: mundo, rotulo: "Arriba en el centro", rect: [153, 3, 144, 47] }
        - { id: plazos, rotulo: "Arriba a la derecha", rect: [302, 3, 145, 47] }
        - { id: continuo, rotulo: "En medio a la izquierda", rect: [4, 56, 144, 48] }
        - { id: usuario, rotulo: "En medio en el centro", rect: [153, 56, 144, 48] }
        - { id: actualizacion, rotulo: "En medio a la derecha", rect: [302, 56, 145, 48] }
    tocar:
      bien: [recursos]
      porque:
        mundo: "Sensores y actuadores no tienen que ver con la memoria."
        plazos: "Los plazos importan, pero la pila y el montón son cuestión de memoria."
        continuo: "Años en marcha agravan la fragmentación, pero la raíz es la poca memoria."
        usuario: "Nadie lo reinicia, cierto; lo que prohíbe la recursión libre es la pila limitada."
        actualizacion: "Actualizar no tiene que ver con la pila."
    exito: "Kilobytes, no gigabytes: nada de memoria dinámica ni recursión sin límite. Todo acotado: bucles, esperas con expiración y colas fijas."
    escalera: ["La recursión gasta pila en cada llamada."]
    solucion: "Arriba a la izquierda: recursos limitados."

  - id: pregunta-prototipo
    tipo: pregunta
    titulo: "Prototipo o producto"
    texto: "De las consecuencias prácticas, ¿cuál separa un prototipo de un producto y es la que más se omite?"
    libro: [22, 23, 30, 9, 10]
    widget:
      tipo: figura
      figura: fig-38.1
      zonas:
        - { id: usuario, rotulo: "En medio en el centro", rect: [153, 56, 144, 48], texto: "Sin usuario: nadie lo reinicia; tiene que recuperarse solo." }
        - { id: actualizacion, rotulo: "En medio a la derecha", rect: [302, 56, 145, 48], texto: "Actualización difícil: lo que se envíe es lo que habrá durante años." }
    opciones:
      - { texto: "Definir qué hace el sistema ante lo inesperado", bien: true, porque: "Un sensor que no responde o un valor fuera de rango: es lo que más se omite." }
      - { texto: "No usar asignación dinámica", porque: "Es una regla importante, pero el libro destaca la del comportamiento ante lo inesperado." }
      - { texto: "Usar un procesador más rápido", porque: "No está entre las consecuencias: no hace más fiable el producto." }
    escalera: ["¿Qué hace su aparato si la comunicación se cae?"]
    solucion: "El comportamiento definido ante lo inesperado."

  - id: toque-fuga
    tipo: tocar
    titulo: "Una fuga lenta"
    texto: "Un nodo pierde unos bytes de memoria cada día y, tras meses, se cuelga. Toque la restricción que convierte eso en fatal."
    libro: [8, 30]
    widget:
      tipo: figura
      figura: fig-38.1
      zonas:
        - { id: recursos, rotulo: "Arriba a la izquierda", rect: [4, 3, 144, 47] }
        - { id: mundo, rotulo: "Arriba en el centro", rect: [153, 3, 144, 47] }
        - { id: plazos, rotulo: "Arriba a la derecha", rect: [302, 3, 145, 47] }
        - { id: continuo, rotulo: "En medio a la izquierda", rect: [4, 56, 144, 48] }
        - { id: usuario, rotulo: "En medio en el centro", rect: [153, 56, 144, 48] }
        - { id: actualizacion, rotulo: "En medio a la derecha", rect: [302, 56, 145, 48] }
    tocar:
      bien: [continuo]
      porque:
        recursos: "La poca memoria acelera el final, pero lo fatal es no reiniciar nunca: la fuga se acumula."
        mundo: "Sensores y actuadores no tienen que ver con una fuga de memoria."
        plazos: "No se incumple ningún plazo: el problema crece día a día."
        usuario: "Que nadie lo reinicie agrava el fallo, pero la fuga se acumula porque funciona años seguidos."
        actualizacion: "La actualización no causa la fuga: esta crece porque el aparato no se reinicia."
    exito: "Años sin reiniciar: una fuga lenta, que en un PC nadie nota, acaba con el sistema."
    escalera: ["¿Qué hace que una fuga de unos bytes al día llegue a importar?"]
    solucion: "Funcionamiento continuo: años sin reiniciar."

  - id: porque-coste
    tipo: tocar
    titulo: "Recuperarse solo"
    texto: "El aparato se cuelga de madrugada y no hay nadie para reiniciarlo ni para leer un mensaje de error. Toque la restricción."
    libro: [9, 25, 26, 30]
    widget:
      tipo: figura
      figura: fig-38.1
      zonas:
        - { id: recursos, rotulo: "Arriba a la izquierda", rect: [4, 3, 144, 47] }
        - { id: mundo, rotulo: "Arriba en el centro", rect: [153, 3, 144, 47] }
        - { id: plazos, rotulo: "Arriba a la derecha", rect: [302, 3, 145, 47] }
        - { id: continuo, rotulo: "En medio a la izquierda", rect: [4, 56, 144, 48] }
        - { id: usuario, rotulo: "En medio en el centro", rect: [153, 56, 144, 48] }
        - { id: actualizacion, rotulo: "En medio a la derecha", rect: [302, 56, 145, 48] }
    tocar:
      bien: [usuario]
      porque:
        recursos: "Es cuestión de memoria; aquí falta quien lo atienda."
        mundo: "El mundo físico no reinicia aparatos."
        plazos: "No se habla de un plazo, sino de quién lo saca del cuelgue."
        continuo: "Funcionar años es otra restricción; aquí se trata de quién lo arregla."
        actualizacion: "Actualizar es otra cosa: aquí se trata de recuperarse."
    exito: "Tiene que recuperarse solo. Watchdog, causa de reinicio, modo degradado y arranque seguro no son perfeccionismo: hacen viable el producto."
    escalera: ["¿Quién lo reinicia?"]
    solucion: "En medio en el centro: sin usuario."

  - id: pregunta-banco
    tipo: tocar
    titulo: "En un tejado"
    texto: "El nodo va instalado en un tejado, y lo que se envíe es lo que habrá durante años. Toque la restricción."
    libro: [10, 25, 29, 30]
    widget:
      tipo: figura
      figura: fig-38.1
      zonas:
        - { id: recursos, rotulo: "Arriba a la izquierda", rect: [4, 3, 144, 47] }
        - { id: mundo, rotulo: "Arriba en el centro", rect: [153, 3, 144, 47] }
        - { id: plazos, rotulo: "Arriba a la derecha", rect: [302, 3, 145, 47] }
        - { id: continuo, rotulo: "En medio a la izquierda", rect: [4, 56, 144, 48] }
        - { id: usuario, rotulo: "En medio en el centro", rect: [153, 56, 144, 48] }
        - { id: actualizacion, rotulo: "En medio a la derecha", rect: [302, 56, 145, 48] }
    tocar:
      bien: [actualizacion]
      porque:
        recursos: "La memoria no impide subir al tejado."
        mundo: "Sensores y actuadores están ahí, pero no impiden actualizar."
        plazos: "No hay plazo en juego."
        continuo: "Funcionar años seguidos es otra restricción."
        usuario: "Sin usuario se refiere a recuperarse solo, no a cambiar el firmware."
    exito: "Actualización difícil: un fallo puede significar una visita al tejado. Por eso se prueba maltratándolo: cortando sensores, comunicación y alimentación."
    escalera: ["¿Se puede cambiar el firmware cuando ya está instalado?"]
    solucion: "En medio a la derecha: actualización difícil."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [3, 16, 17, 22]
    ideas:
      - { titulo: "Seis restricciones.", texto: "Recursos, mundo físico, plazos, años en marcha, sin usuario y difícil de actualizar." }
      - { titulo: "Tiempo real.", texto: "Es predecible, no rápido: cuenta el peor caso." }
      - { titulo: "Todo acotado.", texto: "Sin memoria dinámica, sin recursión libre, esperas con expiración." }
      - { titulo: "Lo inesperado.", texto: "Definir qué hacer ante un fallo separa el prototipo del producto." }
