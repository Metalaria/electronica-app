# Lección 1.2 de la sección 39.1 «Qué Distingue a un Sistema Embebido» (cap38; etiqueta interna sec-38.1).
# Formato: contenido/lecciones11/GUIA.md (§11). La figura 39.1 lleva las seis restricciones y el ejemplo A/B del
# tiempo real; las zonas están en las coordenadas de su svg_vista (450,72 × 263,52).
leccion: cap38/sec-38.1

libro:
  3: "un ordenador que está dentro de otra cosa"
  5: "kilobytes de memoria en lugar de gigabytes"
  8: "años sin reiniciar, lo que hace que fugas de memoria y desbordamientos lentos sean fatales"
  9: "El sistema tiene que recuperarse solo"
  10: "Lo que se envíe es lo que habrá durante años"
  14: "incumplir un plazo es un fallo del sistema"
  15: "incumplirlo degrada la calidad"
  16: "el tiempo real no es «rápido», es predecible"
  17: "lo que se mide no sea la media sino el peor caso"
  19: "Nada de asignación dinámica de memoria en sistemas críticos"
  20: "Nada de recursión sin límite acotado, por la pila"
  21: "esperas con tiempo de expiración"
  22: "qué hace el sistema si un sensor no responde"
  23: "separa un prototipo de un producto"
  25: "puede significar una visita a un tejado"
  26: "no sean perfeccionismo, sino lo que hace viable el producto"
  29: "Desconectar sensores, cortar la comunicación, quitar la alimentación en momentos aleatorios"
  30: "Las seis restricciones de un sistema empotrado"

modelo:
  valores: {}
  calculos: {}

tarjetas:
  - id: explore-seis
    tipo: explorar
    titulo: "Seis diferencias"
    texto: "Un sistema empotrado es un ordenador dentro de otra cosa. Toque las restricciones y lea cada una."
    libro: [3, 30, 5, 8, 9, 10]
    widget:
      tipo: figura
      figura: fig-38.1
      zonas:
        - { id: recursos, rotulo: "Arriba a la izquierda", rect: [4, 3, 144, 47], texto: "Recursos limitados: kilobytes de memoria en lugar de gigabytes." }
        - { id: mundo, rotulo: "Arriba en el centro", rect: [153, 3, 144, 47], texto: "Mundo físico: el programa no manipula datos abstractos, manipula cosas." }
        - { id: plazos, rotulo: "Arriba a la derecha", rect: [302, 3, 145, 47], texto: "Plazos: incumplir uno puede ser un fallo grave." }
        - { id: continuo, rotulo: "En medio a la izquierda", rect: [4, 56, 144, 48], texto: "Funcionamiento continuo: años sin reiniciar; las fugas lentas son fatales." }
        - { id: usuario, rotulo: "En medio en el centro", rect: [153, 56, 144, 48], texto: "Sin usuario: nadie lo reinicia; tiene que recuperarse solo." }
        - { id: actualizacion, rotulo: "En medio a la derecha", rect: [302, 56, 145, 48], texto: "Actualización difícil: lo que se envíe es lo que habrá durante años." }
    requiere: { mover: [continuo, usuario] }

  - id: prediga-tiempo-real
    tipo: predecir
    titulo: "¿Cuál es de tiempo real?"
    texto: "A responde siempre en 10 ms; B, en 1 ms casi siempre y en 100 ms a veces. ¿Cuál es de tiempo real?"
    libro: [16, 30]
    widget:
      tipo: figura
      figura: fig-38.1
      zonas:
        - { id: grafica, rotulo: "Abajo a la izquierda", rect: [4, 112, 285, 145], texto: "Respuestas sucesivas de A y de B frente al plazo." }
    opciones:
      - { texto: "A: siempre 10 ms", bien: true, porque: "El tiempo real no es «rápido», es predecible: A cumple siempre su plazo." }
      - { texto: "B: su media es menor", porque: "La media no cuenta: los 100 ms de vez en cuando incumplen el plazo." }
      - { texto: "Los dos: ambos responden en milisegundos", porque: "Responder deprisa casi siempre no basta; B no es predecible." }
    escalera: ["¿Cuál de los dos se puede garantizar que cumple el plazo cada vez?"]
    solucion: "A: siempre 10 ms. B, con 100 ms a veces, no es de tiempo real."

  - id: porque-peor-caso
    tipo: porque
    titulo: "El único número"
    texto: "En tiempo real duro se mide el peor caso, no la media. ¿Por qué?"
    libro: [14, 17]
    widget:
      tipo: figura
      figura: fig-38.1
      zonas:
        - { id: grafica, rotulo: "Abajo a la izquierda", rect: [4, 112, 285, 145], texto: "Cuenta el peor caso, no la media." }
    opciones:
      - { texto: "Porque basta un plazo incumplido para que el sistema falle", bien: true, porque: "En tiempo real duro, incumplir un plazo es un fallo del sistema: una buena media no lo evita." }
      - { texto: "Porque la media es difícil de calcular", porque: "No es cuestión de dificultad: la media esconde justo las respuestas que fallan." }
      - { texto: "Porque el peor caso suele ser el más frecuente", porque: "Al contrario: puede ser raro, pero un solo fallo ya es grave." }
    escalera: ["¿Qué pasa en tiempo real duro cuando una sola respuesta llega tarde?"]
    solucion: "Un solo plazo incumplido es un fallo del sistema: importa el peor caso."

  - id: pregunta-blando
    tipo: pregunta
    titulo: "Duro o blando"
    texto: "¿Cuál de estos plazos es de tiempo real blando?"
    libro: [14, 15]
    widget:
      tipo: figura
      figura: fig-38.1
      zonas:
        - { id: duro-blando, rotulo: "Abajo a la derecha", rect: [295, 112, 152, 145], texto: "Duro: incumplir es un fallo. Blando: degrada la calidad." }
    opciones:
      - { texto: "Enviar datos a la nube", bien: true, porque: "Si llegan tarde, el servicio empeora, pero el sistema no falla: es blando." }
      - { texto: "El disparo de un airbag", porque: "Llegar tarde es un fallo del sistema: es el ejemplo de duro." }
      - { texto: "El control de un motor", porque: "Es duro: un plazo incumplido es un fallo, no una pérdida de calidad." }
      - { texto: "Un muestreo periódico", porque: "El libro lo pone entre los duros: una muestra tarde estropea la medida." }
    escalera: ["Blando: incumplirlo degrada la calidad, pero no es un fallo."]
    solucion: "Enviar datos a la nube, como refrescar una pantalla, es blando."

  - id: empareje-consecuencias
    tipo: pregunta
    fase: "Empareje"
    titulo: "Las consecuencias prácticas"
    texto: "Una cada regla del firmware con su motivo."
    libro: [19, 20, 21, 22]
    emparejar:
      - ["Nada de asignación dinámica", "Puede fallar o fragmentarse de forma impredecible"]
      - ["Nada de recursión sin límite", "La pila es limitada"]
      - ["Esperas con tiempo de expiración", "Todo acotado: bucles, esperas y colas"]
      - ["Decidir qué hacer si un sensor no responde", "Comportamiento definido ante lo inesperado"]
    exito: "Las cuatro salen de las seis restricciones: poca memoria, años en marcha y nadie que lo arregle."
    pistas:
      - { texto: "La recursión gasta pila en cada llamada." }
    escalera: ["Empiece por la memoria: montón y pila."]
    solucion: "Dinámica, fragmentación; recursión, pila; esperas, todo acotado; sensor mudo, comportamiento definido."

  - id: pregunta-prototipo
    tipo: pregunta
    titulo: "Prototipo o producto"
    texto: "De las consecuencias prácticas, ¿cuál separa un prototipo de un producto y es la que más se omite?"
    libro: [22, 23, 30, 9, 10]
    widget:
      tipo: figura
      figura: fig-38.1
      zonas:
        - { id: usuario, rotulo: "En medio en el centro", rect: [153, 56, 144, 48], texto: "Sin usuario: nadie lo reinicia; tiene que recuperarse solo." }
        - { id: actualizacion, rotulo: "En medio a la derecha", rect: [302, 56, 145, 48], texto: "Actualización difícil: lo que se envíe es lo que habrá durante años." }
    opciones:
      - { texto: "Definir qué hace el sistema ante lo inesperado", bien: true, porque: "Un sensor que no responde o un valor fuera de rango: es lo que más se omite." }
      - { texto: "No usar asignación dinámica", porque: "Es una regla importante, pero el libro destaca la del comportamiento ante lo inesperado." }
      - { texto: "Usar un procesador más rápido", porque: "No está entre las consecuencias: no hace más fiable el producto." }
    escalera: ["¿Qué hace su aparato si la comunicación se cae?"]
    solucion: "El comportamiento definido ante lo inesperado."

  - id: toque-fuga
    tipo: tocar
    titulo: "Una fuga lenta"
    texto: "Un nodo pierde unos bytes de memoria cada día y, tras meses, se cuelga. Toque la restricción que convierte eso en fatal."
    libro: [8, 30]
    widget:
      tipo: figura
      figura: fig-38.1
      zonas:
        - { id: recursos, rotulo: "Arriba a la izquierda", rect: [4, 3, 144, 47] }
        - { id: mundo, rotulo: "Arriba en el centro", rect: [153, 3, 144, 47] }
        - { id: plazos, rotulo: "Arriba a la derecha", rect: [302, 3, 145, 47] }
        - { id: continuo, rotulo: "En medio a la izquierda", rect: [4, 56, 144, 48] }
        - { id: usuario, rotulo: "En medio en el centro", rect: [153, 56, 144, 48] }
        - { id: actualizacion, rotulo: "En medio a la derecha", rect: [302, 56, 145, 48] }
    tocar:
      bien: [continuo]
      porque:
        recursos: "La poca memoria acelera el final, pero lo fatal es no reiniciar nunca: la fuga se acumula."
        mundo: "Sensores y actuadores no tienen que ver con una fuga de memoria."
        plazos: "No se incumple ningún plazo: el problema crece día a día."
        usuario: "Que nadie lo reinicie agrava el fallo, pero la fuga se acumula porque funciona años seguidos."
        actualizacion: "La actualización no causa la fuga: esta crece porque el aparato no se reinicia."
    exito: "Años sin reiniciar: una fuga lenta, que en un PC nadie nota, acaba con el sistema."
    escalera: ["¿Qué hace que una fuga de unos bytes al día llegue a importar?"]
    solucion: "Funcionamiento continuo: años sin reiniciar."

  - id: porque-coste
    tipo: porque
    titulo: "No es perfeccionismo"
    texto: "Watchdog, causa de reinicio, modo degradado y arranque seguro: ¿por qué el libro dice que no son perfeccionismo?"
    libro: [25, 26, 30, 9, 10]
    widget:
      tipo: figura
      figura: fig-38.1
      zonas:
        - { id: usuario, rotulo: "En medio en el centro", rect: [153, 56, 144, 48], texto: "Sin usuario: nadie lo reinicia; tiene que recuperarse solo." }
        - { id: actualizacion, rotulo: "En medio a la derecha", rect: [302, 56, 145, 48], texto: "Actualización difícil: lo que se envíe es lo que habrá durante años." }
    opciones:
      - { texto: "Porque un fallo puede costar una visita a un tejado o un vehículo parado", bien: true, porque: "En un PC un fallo se arregla reiniciando; aquí puede ser caro o peligroso." }
      - { texto: "Porque los exige cualquier compilador", porque: "Ningún compilador los exige: son decisiones de diseño." }
      - { texto: "Porque hacen el programa más rápido", porque: "No aceleran nada: hacen que el sistema se recupere solo." }
    escalera: ["Compare qué cuesta un fallo en un PC y en un aparato instalado."]
    solucion: "Un fallo puede significar una visita a un tejado o un daño físico: esas técnicas hacen viable el producto."

  - id: pregunta-banco
    tipo: pregunta
    titulo: "En el banco"
    texto: "¿Qué prueba distingue un firmware empotrado bien hecho?"
    libro: [29, 30, 9, 10]
    widget:
      tipo: figura
      figura: fig-38.1
      zonas:
        - { id: usuario, rotulo: "En medio en el centro", rect: [153, 56, 144, 48], texto: "Sin usuario: nadie lo reinicia; tiene que recuperarse solo." }
        - { id: actualizacion, rotulo: "En medio a la derecha", rect: [302, 56, 145, 48], texto: "Actualización difícil: lo que se envíe es lo que habrá durante años." }
    opciones:
      - { texto: "Dejarlo en marcha y maltratarlo: cortar sensores, comunicación y alimentación", bien: true, porque: "Uno bien escrito sobrevive y sigue; uno mal escrito falla de formas que nunca aparecieron en la mesa." }
      - { texto: "Comprobar que compila sin avisos", porque: "Ayuda, pero no prueba cómo se comporta ante lo inesperado." }
      - { texto: "Medir su tiempo medio de respuesta", porque: "La media no dice nada del peor caso ni de cómo se recupera." }
    escalera: ["¿Qué le pasará en el campo que no le pasa en la mesa?"]
    solucion: "Maltratarlo funcionando: desconectar sensores, cortar la comunicación y la alimentación, enviar datos malformados."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [3, 16, 17, 22]
    ideas:
      - { titulo: "Seis restricciones.", texto: "Recursos, mundo físico, plazos, años en marcha, sin usuario y difícil de actualizar." }
      - { titulo: "Tiempo real.", texto: "Es predecible, no rápido: cuenta el peor caso." }
      - { titulo: "Todo acotado.", texto: "Sin memoria dinámica, sin recursión libre, esperas con expiración." }
      - { titulo: "Lo inesperado.", texto: "Definir qué hacer ante un fallo separa el prototipo del producto." }
