# Lección 1.2 de la sección 39.9 «La Arquitectura del Firmware» (cap38; etiqueta interna sec-38.9).
# Formato: contenido/lecciones11/GUIA.md (§11). Figura 39.13 (fig/w_388.svg, svg_vista 450,72 × 313,92): las tres
# arquitecturas arriba y las capas abajo.
# 1.2.1 («aprender haciendo», GUIA §13): la exploración elige la arquitectura en la que la tarea importante no espera a
# la tarea de 50 ms (bloques 265 y 270; las demás esperas no se modelan); en la figura se tocan el cooperativo, las
# capas en orden, la capa que cambia con el chip y la arquitectura cuya vuelta mide el pin. Quedan dos preguntas de
# opciones: la tarea de 50 ms y lo que no es coste de un RTOS. Prever la actualización va en el resumen.
leccion: cap38/sec-38.9

libro:
  262: "Un bucle infinito que llama a las tareas una tras otra"
  264: "simple, sin sobrecarga, predecible y fácil de depurar"
  265: "Si una tarea tarda 50 ms, ninguna otra puede responder antes de eso"
  267: "Un pequeño planificador llama a cada tarea según su periodo"
  268: "Cubre la mayoría de los proyectos que superan al superloop"
  270: "la latencia de una tarea depende solo de las de mayor prioridad"
  271: "acotar la latencia de lo importante"
  272: "Cada tarea necesita su propia pila"
  273: "La regla es no usar un RTOS por defecto"
  276: "Todo lo específico del chip vive aquí"
  277: "con una interfaz que no dependa del microcontrolador"
  278: "lo que el aparato hace, escrito sin saber en qué hardware corre"
  279: "cambiar de microcontrolador afecta solo a la capa inferior"
  284: "añadir un cargador de arranque después exige reorganizar el mapa de memoria"
  286: "Su periodo es la latencia máxima de cualquier tarea no interrumpida"
  287: "en un sistema con RTOS, la medida equivalente es el uso de pila de cada tarea"
  288: "Las tres arquitecturas de firmware y las capas en que se organiza"

modelo:
  valores:
    t_L: { sim: "t_{larga}", nombre: "la tarea larga", unidad: s, valor: 0.05 }
    m_a: { sim: "modelo", nombre: "arquitectura", unidad: "", valor: 0 }
  calculos:
    lat: { expr: "t_L*(1 - floor(m_a/2))", sim: "espera", nombre: "espera de la tarea importante por la larga", unidad: s }

tarjetas:
  - id: explore-tres
    tipo: explorar
    titulo: "Tres arquitecturas"
    texto: "Una tarea tarda 50 ms y otra, la importante, tiene más prioridad. Elija la arquitectura en que la importante no espera a la larga."
    libro: [262, 265, 267, 270, 271]
    inicio: { m_a: 0 }
    widget:
      tipo: grafica
      x: { id: mx, min: 0, max: 2, unidad: "", rotulo: "superloop · cooperativo · RTOS" }
      y: { min: 0, max: 0.06, unidad: s, rotulo: "espera por la larga" }
      curvas:
        - { expr: "t_L*(1 - floor(mx/2))", color: azul, rotulo: "Espera" }
      marcas:
        - { x: "m_a", y: "lat", rotulo: "Su elección" }
      lectura: { valor: lat, rotulo: "Espera de la importante" }
      mandos:
        - { valor: m_a, lista: [0, 1, 2], nombres: [Superloop, Cooperativo, RTOS], rotulo: "Arquitectura" }
    objetivo:
      condiciones:
        - { valor: lat, max: 0.001, rotulo: "Espera: {{lat}}" }
      logrado: "Con el RTOS, la larga queda suspendida a mitad: la latencia depende solo de las tareas de mayor prioridad. Ese es su beneficio real."
      pistas:
        - { texto: "En el superloop y en el cooperativo, cada tarea termina antes de que corra la siguiente." }
    escalera: ["¿Cuál puede suspender una tarea a mitad?"]
    solucion: "El RTOS."
    comprobar:
      - { con: { m_a: 2 }, lat: 0 }
      - { con: { m_a: 1 }, lat: 0.05 }

  - id: prediga-superloop
    tipo: predecir
    titulo: "Una tarea de 50 ms"
    texto: "En un superloop, una de las tareas tarda 50 ms. ¿Cuánto puede tardar otra en responder?"
    libro: [265, 288]
    widget:
      tipo: figura
      figura: fig-38.13
      zonas:
        - { id: superloop, rotulo: "Panel de arriba a la izquierda", rect: [4, 4, 144, 159], texto: "La petición para A espera una vuelta." }
    opciones:
      - { texto: "Hasta 50 ms: ninguna responde antes de que acabe la larga", bien: true, porque: "En el superloop la latencia de una tarea depende de la duración de todas las demás." }
      - { texto: "Microsegundos: el bucle es rápido", porque: "El bucle solo vuelve a ella cuando acaban las demás, larga incluida." }
      - { texto: "Depende solo de su prioridad", porque: "El superloop no tiene prioridades: eso es un RTOS." }
    escalera: ["Mire la petición para A en el panel del superloop."]
    solucion: "Hasta 50 ms: la latencia depende de todas las tareas."

  - id: toque-cooperativo
    tipo: tocar
    titulo: "Ceder el control"
    texto: "Los periodos de cada tarea están en una tabla, y cada tarea debe terminar y devolver el control. Toque el modelo."
    libro: [264, 267, 268, 288]
    widget:
      tipo: figura
      figura: fig-38.13
      zonas:
        - { id: superloop, rotulo: "Panel de arriba a la izquierda", rect: [4, 4, 144, 159] }
        - { id: cooperativo, rotulo: "Panel de arriba en el centro", rect: [153, 4, 144, 159] }
        - { id: rtos, rotulo: "Panel de arriba a la derecha", rect: [303, 4, 144, 159] }
    tocar:
      bien: [cooperativo]
      porque:
        superloop: "El superloop llama a las tareas una tras otra, sin periodos."
        rtos: "El RTOS no espera a que la tarea ceda: la suspende."
    exito: "El cooperativo con planificador: ordena el código, es determinista y ligero, y cubre la mayoría de los proyectos que superan al superloop."
    escalera: ["¿Cuál llama a cada tarea según su periodo?"]
    solucion: "El panel del centro: cooperativo."

  - id: pregunta-coste
    tipo: pregunta
    titulo: "Lo que trae un RTOS"
    texto: "¿Cuál de estos inconvenientes no es de un RTOS?"
    libro: [265, 272]
    widget:
      tipo: figura
      figura: fig-38.13
      zonas:
        - { id: regla, rotulo: "Recuadro rojo de abajo a la derecha", rect: [269, 175, 178, 75], texto: "La regla: no usar un RTOS por defecto." }
    opciones:
      - { texto: "Una latencia que depende de todas las tareas", bien: true, porque: "Ese es el límite del superloop; el RTOS lo resuelve." }
      - { texto: "Una pila por tarea que hay que dimensionar", porque: "Es un coste del RTOS: dimensionarlas mal corrompe memoria en silencio." }
      - { texto: "La inversión de prioridades", porque: "Es un problema propio del RTOS; se resuelve con herencia de prioridad." }
      - { texto: "Fallos que dependen del entrelazado temporal", porque: "Es la complicación de su depuración: no siempre se reproducen." }
    escalera: ["Uno de ellos es justo lo que el RTOS viene a resolver."]
    solucion: "La latencia que depende de todas es del superloop."

  - id: ordene-capas
    tipo: tocar
    titulo: "Las capas"
    texto: "Toque las capas en orden, de la que habla con el hardware a la de más arriba."
    libro: [276, 277, 278, 288]
    widget:
      tipo: figura
      figura: fig-38.13
      zonas:
        - { id: aplicacion, rotulo: "Primera capa de abajo a la izquierda", rect: [4, 196, 256, 38] }
        - { id: controladores, rotulo: "Segunda capa de abajo a la izquierda", rect: [4, 235, 256, 38] }
        - { id: hal, rotulo: "Tercera capa de abajo a la izquierda", rect: [4, 274, 256, 38] }
    tocar:
      bien: [hal, controladores, aplicacion]
      orden: true
    exito: "HAL, controladores y aplicación: sea cual sea el modelo, un firmware que vaya a durar se organiza así."
    escalera: ["La que toca los registros va abajo del todo."]
    solucion: "HAL, controladores y aplicación."

  - id: toque-cambio-chip
    tipo: tocar
    titulo: "Otro microcontrolador"
    texto: "Cambia de microcontrolador. Toque la única capa que hay que reescribir."
    libro: [279, 288]
    widget:
      tipo: figura
      figura: fig-38.13
      zonas:
        - { id: aplicacion, rotulo: "Primera capa de abajo a la izquierda", rect: [4, 196, 256, 38] }
        - { id: controladores, rotulo: "Segunda capa de abajo a la izquierda", rect: [4, 235, 256, 38] }
        - { id: hal, rotulo: "Tercera capa de abajo a la izquierda", rect: [4, 274, 256, 38] }
    tocar:
      bien: [hal]
      porque:
        aplicacion: "La aplicación se escribe sin saber en qué hardware corre: no cambia."
        controladores: "Tienen una interfaz que no depende del microcontrolador."
    exito: "Todo lo específico del chip vive en la HAL; la aplicación se puede probar en el PC."
    escalera: ["¿Qué capa habla con los registros del chip?"]
    solucion: "La HAL, la capa de abajo."

  - id: pregunta-banco
    tipo: tocar
    titulo: "En el banco"
    texto: "Una salida conmuta en cada vuelta del bucle principal, y su periodo es la latencia máxima de cualquier tarea. Toque la arquitectura que mide así."
    libro: [286, 287, 288]
    widget:
      tipo: figura
      figura: fig-38.13
      zonas:
        - { id: superloop, rotulo: "Panel de arriba a la izquierda", rect: [4, 4, 144, 159] }
        - { id: cooperativo, rotulo: "Panel de arriba en el centro", rect: [153, 4, 144, 159] }
        - { id: rtos, rotulo: "Panel de arriba a la derecha", rect: [303, 4, 144, 159] }
    tocar:
      bien: [superloop]
      porque:
        cooperativo: "En el cooperativo cuenta el tick del planificador; el pin de cada vuelta es la medida del superloop."
        rtos: "Con RTOS, la medida equivalente es el uso de pila de cada tarea."
    exito: "En el superloop, la vuelta pasa por todas las tareas: si crece por encima de lo requerido, hay que cambiar de modelo o repartir el trabajo."
    escalera: ["¿En cuál una vuelta del bucle recorre todas las tareas?"]
    solucion: "El superloop."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [265, 268, 273, 279, 284]
    ideas:
      - { titulo: "Superloop.", texto: "Simple y predecible; la latencia depende de todas las tareas." }
      - { titulo: "Cooperativo.", texto: "El paso intermedio que cubre la mayoría de los proyectos." }
      - { titulo: "RTOS.", texto: "Acota la latencia de lo importante; no se usa por defecto." }
      - { titulo: "Capas.", texto: "HAL, controladores y aplicación; y prever la actualización desde el primer día." }
