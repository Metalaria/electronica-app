# Lección 1.2 de la sección 39.4 «Interrupciones: Atender al Mundo sin Esperarlo» (cap38; etiqueta interna sec-38.4).
# Formato: contenido/lecciones11/GUIA.md (§11). Figura 39.5 (svg_vista 407,52 × 191,52): evento, latencia, ISR y
# retorno. El ejercicio 39.2 (una ISR de 2 ms frente a una interrupción cada 1 ms) cierra la lección.
# 1.2.1 («aprender haciendo», GUIA §13): el ejercicio 39.2 va en el modelo: se escribe cuántas veces llega la otra
# interrupción durante la ISR de 2 ms, y se acorta la ISR hasta no perder ninguna (objetivo); en la figura 39.5 se
# tocan lo que alarga la latencia de las demás, lo que crece al imprimir dentro y lo que mide el pulso del pin. Quedan
# dos preguntas de opciones: sondeo y volatile. Atomicidad, prioridades y errores van en los textos.
leccion: cap38/sec-38.4

libro:
  103: "suspenda lo que el núcleo esté haciendo y ejecute una rutina de atención"
  105: "Permite dormir entre eventos"
  106: "sondeo cuando el bucle es rápido y el evento frecuente"
  110: "cada instrucción dentro de una rutina de interrupción es latencia para todas las demás"
  113: "Leer o escribir el registro del periférico que la provocó."
  114: "la interrupción captura, el bucle procesa"
  115: "imprimir por el puerto serie"
  118: "el bucle nunca ve los cambios que hace la interrupción"
  119: "se lee la mitad antigua y la mitad nueva, dando un valor que nunca existió"
  120: "La solución es la sección crítica"
  121: "un contador++ es lectura-modificación-escritura y sigue necesitando la sección crítica"
  109: "esperar a que termine cualquier sección crítica"
  124: "prioridad alta a lo que pierde información si no se atiende"
  126: "Rutina demasiado larga"
  127: "Olvidar volatile"
  128: "Acceso no atómico"
  129: "No borrar la bandera del periférico"
  132: "la anchura del pulso es la duración de la rutina y el retardo respecto al evento es la latencia"
  134: "Atención a una interrupción"
  "cap38#548": "una ISR que tarda 2 ms en ejecutarse puede arruinar un sistema que debe atender otra interrupción cada 1 ms"

modelo:
  valores:
    t_isr: { sim: "t_{ISR}", nombre: "duración de la ISR", unidad: s, valor: 0.002 }
    T_ev: { sim: "T", nombre: "intervalo de la otra interrupción", unidad: s, valor: 0.001 }
  calculos:
    n_ev: { expr: "t_isr/T_ev", nombre: "llegadas de la otra durante la ISR", cifras: 2 }

tarjetas:
  - id: explore-interrupcion
    tipo: tocar
    titulo: "Lo que el diseñador controla"
    texto: "Cada instrucción dentro de una rutina se suma, para las demás interrupciones, a un tramo de la figura. Tóquelo."
    libro: [103, 109, 110, 134]
    widget:
      tipo: figura
      figura: fig-38.5
      zonas:
        - { id: evento, rotulo: "Arriba en el centro", rect: [81, 4, 115, 40] }
        - { id: latencia, rotulo: "Corchete de abajo a la izquierda", rect: [130, 128, 42, 32] }
        - { id: retorno, rotulo: "A la derecha", rect: [285, 57, 118, 35] }
    tocar:
      bien: [latencia]
      porque:
        evento: "El evento llega cuando llega: no depende de las rutinas."
        retorno: "El retorno restaura el contexto; no espera a nadie."
    exito: "La latencia: terminar la instrucción, guardar el contexto, saltar y, sobre todo, esperar a que acabe otra rutina o sección crítica."
    escalera: ["¿Qué espera una interrupción mientras otra rutina se ejecuta?"]
    solucion: "La latencia."

  - id: prediga-sondeo
    tipo: predecir
    titulo: "Interrupción o sondeo"
    texto: "Un evento muy frecuente y un bucle principal rápido. ¿Qué conviene?"
    libro: [105, 106, 134]
    widget:
      tipo: figura
      figura: fig-38.5
      zonas:
        - { id: retorno, rotulo: "A la derecha", rect: [285, 57, 118, 35], texto: "Cada interrupción guarda y restaura el contexto." }
    opciones:
      - { texto: "Sondeo", bien: true, porque: "Si el bucle es rápido y el evento frecuente, comprobarlo en el bucle es sencillo y fácil de depurar." }
      - { texto: "Interrupción", porque: "Conviene cuando el evento es urgente, raro o debe despertar al sistema." }
      - { texto: "Las dos a la vez", porque: "Duplicaría el trabajo: el criterio elige una según el evento." }
    escalera: ["La interrupción es para lo urgente, lo raro o lo que despierta."]
    solucion: "Sondeo: bucle rápido, evento frecuente."

  - id: pregunta-nunca
    tipo: tocar
    titulo: "Lo que nunca va dentro"
    texto: "La rutina, además de leer el periférico y poner una bandera, imprime por el puerto serie. Toque lo que se alarga."
    libro: [113, 114, 115, 134]
    widget:
      tipo: figura
      figura: fig-38.5
      zonas:
        - { id: latencia, rotulo: "Corchete de abajo a la izquierda", rect: [130, 128, 42, 32] }
        - { id: duracion, rotulo: "Corchete de abajo en el centro", rect: [172, 128, 96, 32] }
        - { id: evento, rotulo: "Arriba en el centro", rect: [81, 4, 115, 40] }
    tocar:
      bien: [duracion]
      porque:
        latencia: "La de esta interrupción no cambia; la de las demás sí, porque esperan a que esta acabe."
        evento: "El evento no cambia: lo que crece es la rutina."
    exito: "Leer, guardar el dato y poner una bandera; el resto, al bucle. Nada de esperas, impresiones ni operaciones largas."
    escalera: ["¿Qué tarda más con la impresión dentro?"]
    solucion: "La duración de la ISR."

  - id: prediga-sin-volatile
    tipo: predecir
    titulo: "Una bandera compartida"
    texto: "La interrupción pone a 1 una bandera, no volatile, que el bucle principal espera. ¿Qué pasa al optimizar?"
    libro: [118, 119, 120, 121, 127, 128]
    widget:
      tipo: figura
      figura: fig-38.5
      zonas:
        - { id: isr, rotulo: "Barra roja del centro", rect: [165, 95, 105, 35], texto: "La ISR pone una bandera." }
    opciones:
      - { texto: "El bucle puede no ver nunca el cambio", bien: true, porque: "La lee una vez y la guarda en un registro. Y si son varios bytes o un contador++, además hace falta una sección crítica." }
      - { texto: "Funciona igual, solo que más rápido", porque: "Ese es el síntoma engañoso: funciona sin optimizar y falla optimizado." }
      - { texto: "El compilador da un error", porque: "Compila sin quejarse: no puede saber que una interrupción toca la variable." }
    escalera: ["¿Ve el compilador alguna escritura de la bandera dentro del bucle?"]
    solucion: "Sin volatile, la lee una sola vez y el bucle no ve los cambios."

  - id: explore-isr
    tipo: explorar
    titulo: "Una ISR demasiado larga"
    texto: "Una ISR de 2 ms y otra interrupción que llega cada 1 ms, con un núcleo rapidísimo. Acorte la ISR hasta que la otra no llegue nunca durante ella."
    libro: ["cap38#548", 110, 126]
    inicio: { t_isr: 0.002 }
    widget:
      tipo: grafica
      x: { id: tx, min: 0.0002, max: 0.003, unidad: s, rotulo: "t_{ISR}" }
      y: { min: 0, max: 3, unidad: "", rotulo: "llegadas durante la ISR" }
      curvas:
        - { expr: "tx/T_ev", color: azul, rotulo: "Llegadas de la otra" }
        - { expr: "1", color: tinta, rotulo: "Una", discontinua: true }
      marcas:
        - { x: "t_isr", y: "n_ev", rotulo: "Su ISR" }
      lectura: { valor: n_ev, rotulo: "Llegadas durante la ISR" }
      mandos:
        - { valor: t_isr, min: 0.0002, max: 0.003, paso: 0.0001, rotulo: "t_{ISR}" }
    objetivo:
      condiciones:
        - { valor: n_ev, max: 0.95, rotulo: "Llegadas: {{n_ev}}" }
      logrado: "Con {{t_isr}}, la otra no la encuentra ocupada. Una rutina larga pierde eventos, por rápido que sea el núcleo: lo largo, al bucle principal."
      pistas:
        - { texto: "Mientras la ISR dure más que el intervalo, la otra llega con ella en marcha." }
    escalera: ["La ISR tiene que acabar antes de que llegue la siguiente."]
    solucion: "Menos de 1 ms."
    comprobar:
      - { n_ev: 2 }
      - { con: { t_isr: 0.0009 }, n_ev: 0.9 }

  - id: toque-banco
    tipo: tocar
    titulo: "Medir con un pin"
    texto: "Pone una salida en alto al entrar en la rutina y en bajo al salir. Toque lo que mide la anchura de ese pulso."
    libro: [129, 132, 134]
    widget:
      tipo: figura
      figura: fig-38.5
      zonas:
        - { id: latencia, rotulo: "Corchete de abajo a la izquierda", rect: [130, 128, 42, 32] }
        - { id: duracion, rotulo: "Corchete de abajo en el centro", rect: [172, 128, 96, 32] }
        - { id: evento, rotulo: "Arriba en el centro", rect: [81, 4, 115, 40] }
    tocar:
      bien: [duracion]
      porque:
        latencia: "La latencia es el retardo del pulso respecto al evento, no su anchura."
        evento: "El evento es lo que dispara la rutina; el pulso empieza después."
    exito: "La anchura es la duración de la rutina; su retardo respecto al evento, la latencia. Si la rutina se repite sin parar, falta borrar la bandera del periférico."
    escalera: ["El pulso empieza al entrar en la rutina y acaba al salir."]
    solucion: "La duración de la ISR, abajo en el centro."

  - id: pregunta-ejercicio
    tipo: leer
    titulo: "Una ISR de 2 ms"
    texto: "La ISR tarda 2 ms y la otra interrupción llega cada 1 ms. Calcule cuántas veces llega mientras dura la ISR."
    libro: ["cap38#548", 110]
    fijar: { t_isr: 0.002 }
    widget:
      tipo: grafica
      x: { id: tx, min: 0.0002, max: 0.003, unidad: s, rotulo: "t_{ISR}" }
      y: { min: 0, max: 3, unidad: "", rotulo: "llegadas durante la ISR" }
      curvas:
        - { expr: "tx/T_ev", color: azul, rotulo: "Llegadas de la otra" }
        - { expr: "1", color: tinta, rotulo: "Una", discontinua: true }
      mandos: []
    leer:
      objetivo: n_ev
      unidad: ""
      tol: 0.02
      rotulo: "Llegadas"
      errores:
        - { expr: "T_ev/t_isr", texto: "Al revés: duración de la ISR entre el intervalo." }
    exito: "{{n_ev}}: al menos un evento se pierde, aunque el núcleo sea rapidísimo. La prioridad alta va a lo que pierde información."
    escalera: ["Duración de la ISR entre el intervalo."]
    solucion: "2 ms / 1 ms = {{n_ev}}."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [110, 114, 118, 120, 124]
    ideas:
      - { titulo: "Breve.", texto: "Cada instrucción de la rutina es latencia para las demás." }
      - { titulo: "Captura y procesa.", texto: "La interrupción guarda el dato; el bucle lo procesa." }
      - { titulo: "Compartir.", texto: "volatile para que se vea el cambio; sección crítica para que sea atómico." }
      - { titulo: "Medir.", texto: "Un pin en alto dentro de la rutina da duración y latencia." }
