# Lección 1.2 de la sección 39.11 «Arranque Seguro y Actualización del Firmware» (cap38; etiqueta interna sec-38.11).
# Formato: contenido/lecciones11/GUIA.md (§11). Figura 39.15 (svg_vista 453,6 × 216): doble banco con confirmación; la
# lista numerada de la izquierda no se usa como zona porque da la respuesta del ordenar.
leccion: cap38/sec-38.11

libro:
  333: "una actualización es la operación más peligrosa que un sistema empotrado realiza"
  336: "decide si hay que actualizar y, si no, salta a la aplicación"
  338: "porque él mismo no se puede actualizar con seguridad"
  339: "comprobar una suma o una firma"
  342: "dos zonas de memoria, una con la versión en uso y otra donde se escribe la nueva"
  344: "Descargar la nueva versión en el banco inactivo."
  345: "una versión que no llega a confirmarse se revierte sola, sin intervención"
  346: "Su coste es el doble de memoria de programa"
  348: "Verificar la integridad con un CRC detecta la corrupción accidental. No detecta una sustitución deliberada."
  349: "Sin la clave privada no se puede producir un firmware que el dispositivo acepte"
  350: "una cadena de confianza desde una raíz inmutable en el silicio"
  354: "Se impide con un contador de versión monótono que el dispositivo no acepta reducir"
  357: "Proyecto propio, actualizable con cable"
  359: "cortar la alimentación a mitad de la escritura, cargar un firmware corrupto a propósito, y cargar uno que no llegue a confirmarse"
  361: "Secuencia de actualización con doble banco y confirmación"

modelo:
  valores: {}
  calculos: {}

tarjetas:
  - id: explore-doble-banco
    tipo: explorar
    titulo: "Dos bancos"
    texto: "Una versión en uso y otra donde se escribe la nueva. Toque el cargador y los dos bancos."
    libro: [336, 342, 361]
    widget:
      tipo: figura
      figura: fig-38.15
      zonas:
        - { id: cargador, rotulo: "Recuadro de arriba a la derecha", rect: [281, 18, 115, 40], texto: "Cargador de arranque: decide qué banco arranca." }
        - { id: banco-a, rotulo: "Recuadro gris de abajo", rect: [234, 107, 94, 55], texto: "Banco A: la versión en uso." }
        - { id: banco-b, rotulo: "Recuadro azul de abajo a la derecha", rect: [353, 107, 95, 55], texto: "Banco B: la versión nueva, que se verifica con CRC o firma." }
    requiere: { mover: [cargador, banco-b] }

  - id: ordene-secuencia
    tipo: pregunta
    fase: "Ordene"
    titulo: "La secuencia segura"
    texto: "Ponga en orden los pasos de una actualización con doble banco."
    libro: [344]
    ordenar:
      - "Descargar la nueva versión en el banco inactivo."
      - "Verificar su integridad."
      - "Marcar el nuevo banco como «a probar»."
      - "Reiniciar y arrancar desde él."
      - "La aplicación nueva se confirma a sí misma."
      - "Si no se confirma en un plazo, volver al banco anterior."
    exito: "Los dos últimos pasos son la clave: una versión que no se confirma se revierte sola."
    pistas:
      - { texto: "Nada se marca ni se arranca sin verificarlo antes." }
    escalera: ["La confirmación la hace la aplicación nueva, ya arrancada."]
    solucion: "Descargar, verificar, marcar, reiniciar, confirmarse y, si no, volver atrás."

  - id: prediga-sin-confirmar
    tipo: predecir
    titulo: "Una versión que no arranca"
    texto: "La versión nueva del banco B se cuelga al arrancar y nunca se confirma. ¿Qué hace el cargador?"
    libro: [345, 361]
    widget:
      tipo: figura
      figura: fig-38.15
      zonas:
        - { id: banco-a, rotulo: "Recuadro gris de abajo", rect: [234, 107, 94, 55], texto: "Banco A: la versión anterior, intacta." }
    opciones:
      - { texto: "Vuelve a arrancar el banco A, sin intervención", bien: true, porque: "Pasado el plazo sin confirmación, el cargador revierte solo a la versión anterior." }
      - { texto: "Se queda esperando a que alguien lo reinicie", porque: "No hay nadie: por eso la vuelta atrás es automática." }
      - { texto: "Borra el banco A para dejar sitio", porque: "El banco A se conserva justo para poder volver a él." }
    escalera: ["¿Para qué sirve el plazo de confirmación?"]
    solucion: "Vuelve al banco A: una versión que no se confirma se revierte sola."

  - id: pregunta-crc
    tipo: pregunta
    titulo: "CRC o firma"
    texto: "Alguien sustituye a propósito el firmware por otro con un CRC correcto. ¿Qué lo detecta?"
    libro: [348, 349, 350]
    widget:
      tipo: figura
      figura: fig-38.15
      zonas:
        - { id: banco-b, rotulo: "Recuadro azul de abajo a la derecha", rect: [353, 107, 95, 55], texto: "Verificación: CRC o firma." }
    opciones:
      - { texto: "La firma criptográfica, verificada con la clave pública", bien: true, porque: "Sin la clave privada del fabricante no se puede producir un firmware que el dispositivo acepte." }
      - { texto: "El CRC", porque: "El CRC detecta la corrupción accidental, no una sustitución deliberada." }
      - { texto: "El doble banco", porque: "El doble banco protege de fallos al actualizar, no de un firmware ajeno." }
    escalera: ["¿Qué verificación no puede falsificar quien no tiene una clave?"]
    solucion: "La firma: el CRC solo detecta errores accidentales."

  - id: porque-cargador
    tipo: porque
    titulo: "Un cargador sencillo"
    texto: "¿Por qué el cargador de arranque debe ser sencillo y estar muy probado?"
    libro: [338, 339]
    widget:
      tipo: figura
      figura: fig-38.15
      zonas:
        - { id: cargador, rotulo: "Recuadro de arriba a la derecha", rect: [281, 18, 115, 40], texto: "Decide qué banco arranca." }
    opciones:
      - { texto: "Porque él mismo no se puede actualizar con seguridad", bien: true, porque: "Si se puede, es la operación más delicada de todas: debe salir bien a la primera." }
      - { texto: "Porque tiene que caber en la RAM", porque: "Vive en una zona protegida de la Flash; el motivo es que no se actualiza." }
      - { texto: "Porque se ejecuta solo una vez en la vida del aparato", porque: "Se ejecuta en cada encendido: decide qué arrancar." }
    escalera: ["¿Quién actualizaría al cargador si falla?"]
    solucion: "No se puede actualizar con seguridad: tiene que estar bien desde el principio."

  - id: pregunta-retroceso
    tipo: pregunta
    titulo: "Una versión antigua"
    texto: "Un atacante instala una versión antigua, bien firmada, con una vulnerabilidad conocida. ¿Qué lo impide?"
    libro: [354]
    widget:
      tipo: figura
      figura: fig-38.15
      zonas:
        - { id: cargador, rotulo: "Recuadro de arriba a la derecha", rect: [281, 18, 115, 40], texto: "El cargador valida lo que va a arrancar." }
    opciones:
      - { texto: "Un contador de versión monótono que no se puede reducir", bien: true, porque: "El dispositivo rechaza cualquier versión más antigua que la instalada." }
      - { texto: "La firma", porque: "La versión antigua también está firmada: la firma la aceptaría." }
      - { texto: "El CRC", porque: "El CRC de la versión antigua es correcto." }
    escalera: ["La versión antigua es auténtica: ¿qué tiene de malo?"]
    solucion: "El antirretroceso: un contador de versión monótono."

  - id: empareje-nivel
    tipo: pregunta
    fase: "Empareje"
    titulo: "El nivel razonable"
    texto: "Una cada caso con la protección razonable."
    libro: [357]
    emparejar:
      - ["Proyecto propio, actualizable con cable", "CRC y poco más"]
      - ["Producto que se actualiza por USB", "CRC, doble banco, vuelta atrás"]
      - ["Producto conectado a internet", "Firma, canal autenticado, antirretroceso"]
      - ["Sistema crítico o con datos sensibles", "Todo, más arranque seguro y bloqueo de lectura"]
    exito: "No todo necesita lo mismo: cada nivel añade defensas al anterior."
    pistas:
      - { texto: "Internet trae atacantes: ahí entra la firma." }
    escalera: ["Ordénelos de menos a más riesgo."]
    solucion: "Cable, CRC; USB, doble banco; internet, firma y antirretroceso; crítico, todo y arranque seguro."

  - id: pregunta-coste
    tipo: pregunta
    titulo: "El precio del doble banco"
    texto: "¿Qué cuesta la arquitectura de doble banco?"
    libro: [346]
    widget:
      tipo: figura
      figura: fig-38.15
      zonas:
        - { id: banco-a, rotulo: "Recuadro gris de abajo", rect: [234, 107, 94, 55], texto: "Banco A." }
        - { id: banco-b, rotulo: "Recuadro azul de abajo a la derecha", rect: [353, 107, 95, 55], texto: "Banco B." }
    opciones:
      - { texto: "El doble de memoria de programa", bien: true, porque: "En un microcontrolador pequeño puede ser prohibitivo; la alternativa de un banco exige un cargador impecable." }
      - { texto: "El doble de RAM", porque: "Los bancos son de memoria de programa, en la Flash." }
      - { texto: "Un arranque el doble de lento", porque: "Se arranca de un solo banco: el coste es de memoria." }
    escalera: ["¿Cuántas copias del programa caben a la vez?"]
    solucion: "El doble de memoria de programa."

  - id: pregunta-banco
    tipo: pregunta
    titulo: "Validar la actualización"
    texto: "¿Cuál de estas pruebas no basta para validar el mecanismo de actualización?"
    libro: [359]
    widget:
      tipo: figura
      figura: fig-38.15
      zonas:
        - { id: cargador, rotulo: "Recuadro de arriba a la derecha", rect: [281, 18, 115, 40], texto: "El cargador debe dejar siempre un estado recuperable." }
    opciones:
      - { texto: "Actualizar varias veces con éxito", bien: true, porque: "Hay que provocar el fallo: si nunca falla en la prueba, no se sabe qué hará cuando falle." }
      - { texto: "Cortar la alimentación a mitad de la escritura", porque: "Es una de las tres pruebas que pide el libro." }
      - { texto: "Cargar un firmware corrupto a propósito", porque: "Es una de las tres pruebas que pide el libro." }
      - { texto: "Cargar uno que no llegue a confirmarse", porque: "Es una de las tres pruebas que pide el libro." }
    escalera: ["La validación se hace provocando el fallo."]
    solucion: "Actualizar con éxito no prueba nada: hay que cortar, corromper y dejar sin confirmar."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [333, 345, 348, 354]
    ideas:
      - { titulo: "Lo más peligroso.", texto: "Actualizar: un fallo a mitad puede dejar el aparato inservible." }
      - { titulo: "Doble banco.", texto: "Lo que no se confirma se revierte solo." }
      - { titulo: "CRC y firma.", texto: "El CRC detecta accidentes; la firma, sustituciones." }
      - { titulo: "Antirretroceso.", texto: "Un contador de versión que no baja." }
