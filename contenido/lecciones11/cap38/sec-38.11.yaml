# Lección 1.2 de la sección 39.11 «Arranque Seguro y Actualización del Firmware» (cap38; etiqueta interna sec-38.11).
# Formato: contenido/lecciones11/GUIA.md (§11). Figura 39.15 (svg_vista 453,6 × 216): doble banco con confirmación; la
# lista numerada de la izquierda no se usa como zona porque da la respuesta del ordenar.
# 1.2.1 («aprender haciendo», GUIA §13): la decisión del cargador (bloques 344–345) se ve como lógica: arranca B si su
# versión está verificada y no ha vencido el plazo sin confirmarse; si no, A. Volver solo a A es el objetivo de la
# exploración, y la salida «arranca B» se dibuja en una secuencia. En la figura se tocan el cargador, dónde se verifica
# la versión nueva y lo que cuesta el doble banco. Quedan dos preguntas de opciones: CRC o firma y el antirretroceso.
# El nivel razonable y las pruebas del banco van en los textos.
leccion: cap38/sec-38.11

libro:
  333: "una actualización es la operación más peligrosa que un sistema empotrado realiza"
  336: "decide si hay que actualizar y, si no, salta a la aplicación"
  338: "porque él mismo no se puede actualizar con seguridad"
  339: "comprobar una suma o una firma"
  340: "Debe tener una vía de recuperación si la aplicación no arranca."
  342: "dos zonas de memoria, una con la versión en uso y otra donde se escribe la nueva"
  344: "Descargar la nueva versión en el banco inactivo."
  345: "una versión que no llega a confirmarse se revierte sola, sin intervención"
  346: "Su coste es el doble de memoria de programa"
  348: "Verificar la integridad con un CRC detecta la corrupción accidental. No detecta una sustitución deliberada."
  349: "Sin la clave privada no se puede producir un firmware que el dispositivo acepte"
  350: "una cadena de confianza desde una raíz inmutable en el silicio"
  354: "Se impide con un contador de versión monótono que el dispositivo no acepta reducir"
  357: "Proyecto propio, actualizable con cable"
  359: "cortar la alimentación a mitad de la escritura, cargar un firmware corrupto a propósito, y cargar uno que no llegue a confirmarse"
  361: "Secuencia de actualización con doble banco y confirmación"

modelo:
  valores: {}
  calculos: {}

tarjetas:
  - id: explore-doble-banco
    tipo: explorar
    titulo: "La vuelta atrás"
    texto: "Así decide el cargador: arranca B si su versión está verificada y no ha vencido el plazo sin confirmarse. Con B verificado, consiga que vuelva solo a A."
    libro: [336, 342, 344, 345]
    widget:
      tipo: logica
      entradas:
        - { id: VER, rotulo: "B verificado" }
        - { id: CONF, rotulo: "B confirmado" }
        - { id: VENC, rotulo: "Plazo vencido" }
      piezas:
        - { id: nc, tipo: not, entradas: [CONF] }
        - { id: rev, tipo: and, entradas: [VENC, nc], rotulo: "Volver atrás" }
        - { id: nr, tipo: not, entradas: [rev] }
        - { id: okb, tipo: and, entradas: [VER, nr], rotulo: "Arrancar B" }
        - { id: na, tipo: not, entradas: [okb] }
      salidas:
        - { id: B, de: okb, rotulo: "Arranca B" }
        - { id: A, de: na, rotulo: "Arranca A" }
    objetivo:
      condiciones:
        - { senal: VER, valor: 1, rotulo: "B verificado" }
        - { led: A, valor: 1, rotulo: "Arranca A" }
      logrado: "Verificada, pero sin confirmarse en el plazo: el cargador vuelve solo al banco anterior, sin intervención. Esa es la clave de una actualización robusta."
      pistas:
        - { cuando: { senal: VER, valor: 0 }, texto: "Primero, una versión nueva verificada." }
        - { texto: "Ahora, que venza el plazo sin que B se confirme." }
    escalera: ["Una versión que no se confirma a tiempo se revierte."]
    solucion: "B verificado, sin confirmar, y el plazo vencido."

  - id: dibuje-arranque
    tipo: dibujar
    titulo: "Qué banco arranca"
    texto: "Se descarga y verifica una versión, vence el plazo sin confirmarse y, en un segundo intento, se confirma. Dibuje cuándo arranca B."
    libro: [344, 345]
    widget:
      tipo: logica
      entradas:
        - { id: VER, rotulo: "B verificado" }
        - { id: CONF, rotulo: "B confirmado" }
        - { id: VENC, rotulo: "Plazo vencido" }
        - { id: CLK, reloj: true, rotulo: "Tiempo" }
      piezas:
        - { id: nc, tipo: not, entradas: [CONF] }
        - { id: rev, tipo: and, entradas: [VENC, nc], rotulo: "Volver atrás" }
        - { id: nr, tipo: not, entradas: [rev] }
        - { id: okb, tipo: and, entradas: [VER, nr], rotulo: "Arrancar B" }
        - { id: na, tipo: not, entradas: [okb] }
      salidas:
        - { id: B, de: okb, rotulo: "Arranca B" }
        - { id: A, de: na, rotulo: "Arranca A" }
      cronograma: { ciclos: 8, estimulo: { VER: "01111111", VENC: "00011100", CONF: "00000011" }, senales: [VER, VENC, CONF] }
      dibujo: false
    dibujar:
      senal: B
    exito: "B arranca mientras está a prueba dentro del plazo y cuando se confirma; si vence sin confirmar, vuelve A."
    escalera:
      - "Sin versión verificada, siempre A."
      - "Con el plazo vencido y sin confirmación, A otra vez."
    solucion: "B en los tramos con la versión verificada y sin vencer el plazo, y de nuevo cuando se confirma."

  - id: toque-verificar
    tipo: tocar
    titulo: "Antes de nada"
    texto: "La versión nueva acaba de descargarse en el banco inactivo. Toque dónde se comprueba su integridad, antes de marcarla y arrancarla."
    libro: [339, 344, 361]
    widget:
      tipo: figura
      figura: fig-38.15
      zonas:
        - { id: cargador, rotulo: "Recuadro de arriba a la derecha", rect: [281, 18, 115, 40] }
        - { id: banco-a, rotulo: "Recuadro gris de abajo", rect: [234, 107, 94, 55] }
        - { id: banco-b, rotulo: "Recuadro azul de abajo a la derecha", rect: [353, 107, 95, 55] }
    tocar:
      bien: [banco-b]
      porque:
        cargador: "El cargador decide después qué arranca; la versión se verifica antes, en su banco."
        banco-a: "El banco A tiene la versión en uso: la nueva no está ahí."
    exito: "En el banco B, con su CRC o su firma: nada se marca «a probar» ni se arranca sin verificarlo."
    escalera: ["¿Dónde está la versión recién descargada?"]
    solucion: "El banco B."

  - id: pregunta-crc
    tipo: pregunta
    titulo: "CRC o firma"
    texto: "Alguien sustituye a propósito el firmware por otro con un CRC correcto. ¿Qué lo detecta?"
    libro: [348, 349, 350]
    widget:
      tipo: figura
      figura: fig-38.15
      zonas:
        - { id: banco-b, rotulo: "Recuadro azul de abajo a la derecha", rect: [353, 107, 95, 55], texto: "Verificación: CRC o firma." }
    opciones:
      - { texto: "La firma criptográfica, verificada con la clave pública", bien: true, porque: "Sin la clave privada del fabricante no se puede producir un firmware que el dispositivo acepte." }
      - { texto: "El CRC", porque: "El CRC detecta la corrupción accidental, no una sustitución deliberada." }
      - { texto: "El doble banco", porque: "El doble banco protege de fallos al actualizar, no de un firmware ajeno." }
    escalera: ["¿Qué verificación no puede falsificar quien no tiene una clave?"]
    solucion: "La firma: el CRC solo detecta errores accidentales."

  - id: porque-cargador
    tipo: tocar
    titulo: "Un cargador sencillo"
    texto: "Una de las tres piezas no se puede actualizar con seguridad, así que debe ser sencilla y estar muy probada. Tóquela."
    libro: [336, 338, 340, 361]
    widget:
      tipo: figura
      figura: fig-38.15
      zonas:
        - { id: cargador, rotulo: "Recuadro de arriba a la derecha", rect: [281, 18, 115, 40] }
        - { id: banco-a, rotulo: "Recuadro gris de abajo", rect: [234, 107, 94, 55] }
        - { id: banco-b, rotulo: "Recuadro azul de abajo a la derecha", rect: [353, 107, 95, 55] }
    tocar:
      bien: [cargador]
      porque:
        banco-a: "Los bancos son justo lo que se actualiza, uno cada vez."
        banco-b: "En el banco B se escribe la versión nueva: se actualiza siempre."
    exito: "El cargador de arranque: si se puede actualizar, es la operación más delicada de todas. Debe validar lo que arranca y tener una vía de recuperación."
    escalera: ["¿Qué decide qué banco arranca?"]
    solucion: "El cargador de arranque."

  - id: pregunta-retroceso
    tipo: pregunta
    titulo: "Una versión antigua"
    texto: "Un atacante instala una versión antigua, bien firmada, con una vulnerabilidad conocida. ¿Qué lo impide?"
    libro: [354]
    widget:
      tipo: figura
      figura: fig-38.15
      zonas:
        - { id: cargador, rotulo: "Recuadro de arriba a la derecha", rect: [281, 18, 115, 40], texto: "El cargador valida lo que va a arrancar." }
    opciones:
      - { texto: "Un contador de versión monótono que no se puede reducir", bien: true, porque: "El dispositivo rechaza cualquier versión más antigua que la instalada." }
      - { texto: "La firma", porque: "La versión antigua también está firmada: la firma la aceptaría." }
      - { texto: "El CRC", porque: "El CRC de la versión antigua es correcto." }
    escalera: ["La versión antigua es auténtica: ¿qué tiene de malo?"]
    solucion: "El antirretroceso: un contador de versión monótono."

  - id: pregunta-coste
    tipo: tocar
    titulo: "El precio del doble banco"
    texto: "La arquitectura de doble banco cuesta el doble de memoria de programa. Toque lo que ocupa esa memoria."
    libro: [346, 357, 359, 361]
    widget:
      tipo: figura
      figura: fig-38.15
      zonas:
        - { id: cargador, rotulo: "Recuadro de arriba a la derecha", rect: [281, 18, 115, 40] }
        - { id: banco-a, rotulo: "Recuadro gris de abajo", rect: [234, 107, 94, 55] }
        - { id: banco-b, rotulo: "Recuadro azul de abajo a la derecha", rect: [353, 107, 95, 55] }
    tocar:
      bien: [banco-a, banco-b]
      todas: true
      porque:
        cargador: "El cargador es pequeño y está siempre; lo que se duplica es la aplicación."
    exito: "Dos copias de la aplicación. Con un solo banco, un corte a mitad deja el aparato sin aplicación válida. Y se valida cortando, corrompiendo y dejando sin confirmar."
    escalera: ["¿Cuántas copias del programa hay a la vez?"]
    solucion: "Los dos bancos."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [333, 345, 348, 354]
    ideas:
      - { titulo: "Lo más peligroso.", texto: "Actualizar: un fallo a mitad puede dejar el aparato inservible." }
      - { titulo: "Doble banco.", texto: "Lo que no se confirma se revierte solo." }
      - { titulo: "CRC y firma.", texto: "El CRC detecta accidentes; la firma, sustituciones." }
      - { titulo: "Antirretroceso.", texto: "Un contador de versión que no baja." }
