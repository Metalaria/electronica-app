# Lección 1.2 de la sección 39.15 «Ampliación: Arquitectura de Computadores» (cap38; etiqueta interna sec-38.15).
# Formato: contenido/lecciones11/GUIA.md (§11). La sección no tiene figura propia: se usan la 39.19a (los dos espacios
# de memoria del ATmega328P, Harvard; svg_vista 325,42 × 198,43) y la 39.2 (bus y mapa de un microcontrolador).
# 1.2.1 («aprender haciendo», GUIA §13): la jerarquía de memoria se explora con la regla del libro, cada nivel unas
# diez veces más lento (objetivo: el nivel cien veces más lento que los registros), y se escribe cuántas veces más
# lenta es la Flash; se tocan el bus compartido de Von Neumann y el espacio de programa del ATmega328P, y se lee en
# hexadecimal dónde empieza su SRAM. Quedan dos preguntas de opciones: los saltos y la caché en tiempo real.
leccion: cap38/sec-38.15

libro:
  470: "una lectura de dato compite con la búsqueda de la siguiente instrucción"
  471: "un salto obliga a descartar las instrucciones ya empezadas"
  472: "Registros, caché, RAM y Flash forman una jerarquía"
  473: "el tiempo de ejecución no es determinista si hay caché"
  "cap38#495": "Los dos espacios de memoria del ATmega328P"
  "cap38#62": "comparten un mismo bus y un único mapa de direcciones"

modelo:
  valores:
    niv: { sim: "nivel", nombre: "nivel de la jerarquía", unidad: "", valor: 0 }
  calculos:
    rel: { expr: "10^niv", sim: "t/t_{registros}", nombre: "veces más lento que los registros", unidad: "" }

tarjetas:
  - id: explore-harvard
    tipo: explorar
    titulo: "La jerarquía de memoria"
    texto: "Registros, caché, RAM y Flash: cada nivel es unas diez veces más lento y mucho mayor que el anterior. Busque el que es unas cien veces más lento que los registros."
    libro: [472]
    inicio: { niv: 0 }
    widget:
      tipo: grafica
      x: { id: nx, min: 0, max: 3, unidad: "", rotulo: "registros · caché · RAM · Flash" }
      y: { min: 1, max: 2000, unidad: "", rotulo: "veces más lento", escala: log }
      curvas:
        - { expr: "10^nx", color: azul, rotulo: "Tiempo de acceso relativo" }
      marcas:
        - { x: "niv", y: "rel", rotulo: "Su nivel" }
      lectura: { valor: rel, rotulo: "Veces más lento" }
      mandos:
        - { valor: niv, lista: [0, 1, 2, 3], nombres: [Registros, Caché, RAM, Flash], rotulo: "Nivel" }
    objetivo:
      condiciones:
        - { valor: rel, objetivo: 100, tol: 0.01, rotulo: "{{rel}} veces" }
      logrado: "La RAM, dos niveles por debajo. Funciona gracias a la localidad: el programa vuelve a las mismas posiciones y a las vecinas."
      pistas:
        - { cuando: { valor: rel, mayor: 101 }, texto: "Ese es más lento aún: suba un nivel." }
        - { texto: "Baje un nivel más." }
    escalera: ["Diez veces por nivel: cien son dos niveles."]
    solucion: "La RAM."
    comprobar:
      - { con: { niv: 2 }, rel: 100 }

  - id: leer-flash
    tipo: leer
    titulo: "Hasta la Flash"
    texto: "Con esa regla, calcule cuántas veces más lento es leer de la Flash que de los registros, y escríbalo."
    libro: [472]
    fijar: { niv: 3 }
    widget:
      tipo: grafica
      x: { id: nx, min: 0, max: 3, unidad: "", rotulo: "registros · caché · RAM · Flash" }
      y: { min: 1, max: 2000, unidad: "", rotulo: "veces más lento", escala: log }
      curvas:
        - { expr: "10^nx", color: azul, rotulo: "Tiempo de acceso relativo" }
      mandos: []
    leer:
      objetivo: rel
      unidad: ""
      tol: 0.02
      rotulo: "Veces más lento"
      errores:
        - { expr: "10*niv", texto: "Los niveles no suman diez: cada uno multiplica por diez." }
    exito: "Unas {{rel}} veces: lo rápido es caro y pequeño, y lo grande, lento."
    escalera: ["Tres niveles: diez por diez por diez."]
    solucion: "Diez por diez por diez: {{rel}}."

  - id: prediga-von-neumann
    tipo: tocar
    titulo: "Un solo bus"
    texto: "En Von Neumann, una lectura de dato compite con la búsqueda de la siguiente instrucción. Toque por dónde compiten."
    libro: [470, "cap38#62"]
    widget:
      tipo: figura
      figura: fig-38.2
      zonas:
        - { id: nucleo, rotulo: "Arriba a la izquierda", rect: [17, 37, 94, 42] }
        - { id: flash, rotulo: "Arriba en el centro", rect: [124, 37, 95, 42] }
        - { id: ram, rotulo: "Arriba a la derecha", rect: [231, 37, 94, 42] }
        - { id: bus, rotulo: "Barra del centro", rect: [17, 98, 307, 36] }
    tocar:
      bien: [bus]
      porque:
        nucleo: "El núcleo pide las dos cosas; compiten por el camino."
        flash: "La Flash guarda las instrucciones; el conflicto está en el camino compartido."
        ram: "La RAM guarda los datos; el conflicto está en el camino compartido."
    exito: "Un solo bus: instrucción y dato se turnan. En Harvard hay buses separados y ambas cosas ocurren a la vez."
    escalera: ["¿Qué comparten instrucciones y datos?"]
    solucion: "El bus interno."

  - id: toque-harvard
    tipo: tocar
    titulo: "Dos memorias, dos buses"
    texto: "El ATmega328P es Harvard: programa y datos en espacios aparte. Toque el espacio donde están los vectores y el código."
    libro: [470, "cap38#495"]
    widget:
      tipo: figura
      figura: fig-new-38-asm
      zonas:
        - { id: datos, rotulo: "Columna de la izquierda", rect: [37, 39, 66, 123] }
        - { id: programa, rotulo: "Columna del centro", rect: [116, 39, 57, 111] }
    tocar:
      bien: [programa]
      porque:
        datos: "Ahí están los registros, la E/S y la SRAM, en bytes: los datos."
    exito: "El espacio de programa, en palabras: buscar una instrucción no compite con leer un dato. Por eso casi todo va en un ciclo."
    escalera: ["Los vectores son direcciones de código."]
    solucion: "La columna del centro: el programa."

  - id: leer-sram
    tipo: leer
    titulo: "Dónde empieza la SRAM"
    texto: "Lea en el espacio de datos del ATmega328P la dirección en que empieza la SRAM y escríbala en hexadecimal."
    libro: ["cap38#495"]
    widget:
      tipo: figura
      figura: fig-new-38-asm
      zonas:
        - { id: datos, rotulo: "Columna de la izquierda", rect: [37, 39, 66, 123] }
    leer:
      objetivo: "0x0100"
      base: 16
      cifras: 16
      rotulo: "Comienzo de la SRAM"
      errores:
        - { expr: "96", texto: "Esa es la E/S ampliada; la SRAM empieza encima." }
    exito: "0x0100: debajo quedan los registros del núcleo y los de E/S. La pila baja desde el final de la SRAM."
    escalera: ["Mire la dirección a la izquierda del bloque grande."]
    solucion: "0x0100."

  - id: pregunta-saltos
    tipo: pregunta
    titulo: "El precio de la segmentación"
    texto: "¿Por qué un código con muchos saltos condicionales es más lento de lo que dice el recuento de instrucciones?"
    libro: [471, "cap38#495"]
    widget:
      tipo: figura
      figura: fig-new-38-asm
      zonas:
        - { id: programa, rotulo: "Columna del centro", rect: [116, 39, 57, 111], texto: "El núcleo lee la siguiente instrucción mientras ejecuta una." }
    opciones:
      - { texto: "Cada salto descarta las instrucciones ya empezadas: ciclos perdidos", bien: true, porque: "Es el riesgo de la segmentación; por eso los compiladores reordenan para evitar saltos." }
      - { texto: "Porque los saltos ocupan más Flash", porque: "No es el tamaño: es el trabajo que se tira al saltar." }
      - { texto: "Porque los saltos desactivan la caché", porque: "La caché sigue; lo que se pierde son las instrucciones a medio ejecutar." }
    escalera: ["Con segmentación, varias instrucciones están a medias a la vez."]
    solucion: "El salto obliga a descartar lo que ya se había empezado."

  - id: porque-cache
    tipo: porque
    titulo: "Caché y tiempo real"
    texto: "¿Por qué una caché rompe el análisis de un sistema de tiempo real duro?"
    libro: [473]
    widget:
      tipo: figura
      figura: fig-38.2
      zonas:
        - { id: ram, rotulo: "Arriba a la derecha", rect: [231, 37, 94, 42], texto: "La RAM." }
    opciones:
      - { texto: "El tiempo de ejecución depende de si el dato está o no en la caché", bien: true, porque: "Deja de ser determinista. Por eso se usan memorias de acceso uniforme o se bloquean líneas de caché." }
      - { texto: "Porque la caché es más lenta que la RAM", porque: "Es más rápida; el problema es que unas veces acierta y otras no." }
      - { texto: "Porque la caché consume mucha energía", porque: "No es cuestión de consumo, sino de tiempo predecible." }
    escalera: ["¿Tarda siempre lo mismo leer un dato con caché?"]
    solucion: "El tiempo depende de si hay acierto: no es determinista."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [470, 471, 472, 473]
    ideas:
      - { titulo: "Harvard.", texto: "Buses separados: instrucción y dato a la vez." }
      - { titulo: "Segmentación.", texto: "Los saltos tiran el trabajo empezado." }
      - { titulo: "Jerarquía.", texto: "Registros, caché, RAM y Flash, gracias a la localidad." }
      - { titulo: "Previsible.", texto: "En tiempo real, la previsibilidad vale más que la velocidad media." }
