# Lección 1.2 de la sección 39.14 «Un RTOS en la Práctica: Semáforos, Mutex y Prioridades» (cap38; etiqueta interna
# sec-38.14). Formato: contenido/lecciones11/GUIA.md (§11). Figura 39.18 (svg_vista 419,37 × 261,7): la inversión de
# prioridad sin herencia (arriba) y con herencia (abajo). Los fragmentos de FreeRTOS son los listados del libro.
# 1.2.1 («aprender haciendo», GUIA §13): cuántas tareas de 512 B caben en 4 kB de pilas es el objetivo de la
# exploración; en los listados se tocan la espera activa, el aviso desde la ISR y la espera con expiración; lo que
# ahorra la herencia a la tarea A (6,0 ms frente a 1,5 ms, figura 39.18) se escribe. Quedan dos preguntas de opciones:
# portYIELD_FROM_ISR y el interbloqueo. Semáforo frente a mutex, la marca de agua y el banco van en los textos.
leccion: cap38/sec-38.14

libro:
  428: "Ocho tareas con 512 bytes cada una son 4 kB de RAM antes de escribir una línea útil"
  431: "el planificador ejecuta siempre la tarea lista de mayor prioridad"
  432: "Wrong: burns the CPU and starves lower-priority tasks."
  434: "una interrupción avisa a una tarea de que hay trabajo"
  435: "xSemaphoreGiveFromISR(sem_dato, &woken);"
  437: "Desde una interrupción se usan las funciones FromISR, y solo esas"
  438: "Sin él, la latencia pasa de microsegundos a hasta un tick entero"
  439: "Un Take que espera indefinidamente convierte cualquier fallo externo en un bloqueo permanente"
  441: "Un mutex protege un recurso compartido"
  443: "el mutex tiene dueño. Solo lo libera quien lo tomó"
  447: "Tarea C (prioridad baja) toma el mutex del bus I²C"
  448: "Tarea A (prioridad alta) despierta, necesita el bus y se bloquea esperando el mutex"
  449: "Tarea B (prioridad media), que no usa el bus, se vuelve lista y desplaza a C"
  450: "A, la más urgente, espera indefinidamente por culpa de B"
  451: "xSemaphoreCreateMutex() la implementa; xSemaphoreCreateBinary() no"
  453: "Numerar los recursos y tomarlos siempre en orden creciente lo hace imposible"
  456: "Una cola de FreeRTOS ya está protegida"
  460: "Se deja el doble de lo consumido"
  427: "cada tarea reserva su pila entera, se use o no"
  466: "primero con semáforo binario y después con mutex, midiendo la latencia de la tarea A"
  467: "Inversión de prioridad con y sin herencia, en un diagrama de tiempos"

modelo:
  valores:
    n_tar: { sim: "n", nombre: "número de tareas", unidad: "", valor: 8 }
    pila: { sim: "pila", nombre: "pila de cada tarea", unidad: "B", valor: 512 }
    w_sin: { sim: "t_{sin}", nombre: "espera de A sin herencia", unidad: s, valor: 0.006 }
    w_con: { sim: "t_{con}", nombre: "espera de A con herencia", unidad: s, valor: 0.0015 }
  calculos:
    ram_pilas: { expr: "n_tar*pila", sim: "RAM", nombre: "RAM de las pilas", unidad: "B" }
    d_w: { expr: "w_sin - w_con", sim: "ahorro", nombre: "espera que ahorra la herencia", unidad: s }

tarjetas:
  - id: explore-herencia
    tipo: explorar
    titulo: "Lo que cuestan las pilas"
    texto: "Cada tarea reserva su pila entera, se use o no. Con pilas de 512 bytes, añada tareas hasta gastar 4 kB de RAM sin escribir una línea útil."
    libro: [427, 428, 460]
    inicio: { n_tar: 2 }
    widget:
      tipo: grafica
      x: { id: nx, min: 1, max: 12, unidad: "", rotulo: "tareas" }
      y: { min: 0, max: 6200, unidad: "B", rotulo: "RAM de las pilas" }
      curvas:
        - { expr: "nx*pila", color: azul, rotulo: "RAM de las pilas" }
      marcas:
        - { x: "n_tar", y: "ram_pilas", rotulo: "Sus tareas" }
      lectura: { valor: ram_pilas, rotulo: "RAM de las pilas" }
      mandos:
        - { valor: n_tar, min: 1, max: 12, paso: 1, rotulo: "Tareas" }
    objetivo:
      condiciones:
        - { valor: ram_pilas, objetivo: 4096, tol: 0.01, rotulo: "Pilas: {{ram_pilas}}" }
      logrado: "{{n_tar}} tareas, {{ram_pilas}}. Cada pila se mide con la marca de agua y se deja el doble de lo consumido."
      pistas:
        - { cuando: { valor: ram_pilas, mayor: 4100 }, texto: "Se ha pasado de 4 kB: quite tareas." }
        - { texto: "Aún no llega: añada tareas." }
    escalera: ["4 kB entre 512 bytes."]
    solucion: "{{n_tar}} tareas."
    comprobar:
      - { con: { n_tar: 8 }, ram_pilas: 4096 }

  - id: prediga-espera-activa
    tipo: tocar
    titulo: "Una espera activa"
    texto: "Una tarea de prioridad alta tiene que esperar. Toque la línea que dejaría sin CPU a las de menor prioridad."
    libro: [431, 432]
    widget:
      tipo: figura
      codigo: "cap38#432"
      zonas:
        - { id: l2, lineas: [2], rotulo: "Segunda línea" }
        - { id: l5, lineas: [5], rotulo: "Quinta línea" }
    tocar:
      bien: [l5]
      porque:
        l2: "vTaskDelay() bloquea la tarea y suelta la CPU: es la forma correcta."
    exito: "El bucle quema la CPU: la tarea nunca se bloquea y el planificador la elige siempre. Corre la lista de más prioridad."
    escalera: ["¿Cuál de las dos sigue lista mientras espera?"]
    solucion: "La quinta: el bucle de espera activa."

  - id: pregunta-fromisr
    tipo: tocar
    titulo: "Señalizar desde una ISR"
    texto: "Una interrupción avisa a una tarea de que hay trabajo. Toque la línea que da el aviso."
    libro: [434, 435, 437]
    widget:
      tipo: figura
      codigo:
        lenguaje: c
        texto: |
          void EXTI0_IRQHandler(void)
          {
              BaseType_t woken = pdFALSE;
              EXTI->PR1 = EXTI_PR1_PIF0;    /* clear the pending flag first */
              xSemaphoreGiveFromISR(sem_dato, &woken);
              portYIELD_FROM_ISR(woken);
          }
      zonas:
        - { id: l4, lineas: [4], rotulo: "Cuarta línea" }
        - { id: l5, lineas: [5], rotulo: "Quinta línea" }
        - { id: l6, lineas: [6], rotulo: "Sexta línea" }
    tocar:
      bien: [l5]
      porque:
        l4: "Borra la bandera del periférico, primero, para que la interrupción no se repita."
        l6: "Hace que la tarea despertada corra al salir; el aviso es la línea anterior."
    exito: "xSemaphoreGiveFromISR(): desde una ISR, solo las funciones FromISR. La versión normal corrompe el planificador."
    escalera: ["Busque la que da el semáforo."]
    solucion: "La quinta."

  - id: porque-yield
    tipo: porque
    titulo: "portYIELD_FROM_ISR"
    texto: "¿Por qué se llama a portYIELD_FROM_ISR(woken) al final de la interrupción?"
    libro: [435, 438]
    widget:
      tipo: figura
      codigo:
        lenguaje: c
        texto: |
          void EXTI0_IRQHandler(void)
          {
              BaseType_t woken = pdFALSE;
              EXTI->PR1 = EXTI_PR1_PIF0;    /* clear the pending flag first */
              xSemaphoreGiveFromISR(sem_dato, &woken);
              portYIELD_FROM_ISR(woken);
          }
      resaltar: [5, 6]
    opciones:
      - { texto: "Para ejecutar ya la tarea despertada, sin esperar al siguiente tick", bien: true, porque: "Sin él, la latencia pasa de microsegundos a hasta un tick entero." }
      - { texto: "Para borrar la bandera del periférico", porque: "La bandera se borra antes, con EXTI->PR1; esto decide qué tarea sigue." }
      - { texto: "Para devolver el semáforo", porque: "El semáforo ya se ha dado con xSemaphoreGiveFromISR()." }
    escalera: ["¿Cuándo cambiaría de tarea el planificador si nadie se lo pide?"]
    solucion: "Cambia a la tarea despertada al salir de la ISR: latencia de microsegundos."

  - id: pregunta-timeout
    tipo: tocar
    titulo: "Esperar para siempre"
    texto: "El sensor deja de responder y nadie da el semáforo. Toque lo que impide que la tarea se quede bloqueada para siempre."
    libro: [435, 439]
    widget:
      tipo: figura
      codigo:
        lenguaje: c
        texto: |
          /* Task side: block until signalled, with a timeout. */
          for (;;) {
              if (xSemaphoreTake(sem_dato, pdMS_TO_TICKS(500)) == pdTRUE) {
                  procesar();
              } else {
                  registrar_fallo();      /* the timeout is not optional */
              }
          }
      zonas:
        - { id: l2, lineas: [2], rotulo: "Segunda línea" }
        - { id: l3, lineas: [3], rotulo: "Tercera línea" }
        - { id: l4, lineas: [4], rotulo: "Cuarta línea" }
    tocar:
      bien: [l3]
      porque:
        l2: "El bucle infinito es lo normal en una tarea; lo que la protege es cómo espera."
        l4: "Solo se procesa si llega el semáforo."
    exito: "El Take espera como mucho 500 ms y, si no llega nada, registra el fallo. Sin expiración, un fallo externo sería un bloqueo permanente."
    escalera: ["¿Dónde se limita la espera?"]
    solucion: "La tercera: el Take con su tiempo de expiración."

  - id: leer-herencia
    tipo: leer
    titulo: "Lo que ahorra la herencia"
    texto: "El escenario de la inversión con semáforo binario y luego con mutex. Lea en la figura cuánto espera A en cada caso y escriba cuánto ahorra la herencia."
    libro: [447, 448, 449, 450, 451, 466, 467]
    widget:
      tipo: figura
      figura: fig-38.18
      zonas:
        - { id: sin, rotulo: "Diagrama de arriba", rect: [38, 8, 380, 90] }
    leer:
      objetivo: d_w
      unidad: s
      tol: 0.05
      rotulo: "Espera ahorrada"
      errores:
        - { expr: "w_sin", texto: "Esa es la espera sin herencia; reste la que queda con ella." }
    exito: "{{d_w}} menos: sin herencia, B desplaza a C y A espera también a B. xSemaphoreCreateMutex() la implementa; un semáforo binario, no."
    escalera: ["Espera sin herencia menos espera con herencia."]
    solucion: "{{w_sin}} − {{w_con}} = {{d_w}}."
    comprobar:
      - { d_w: 0.0045 }

  - id: pregunta-interbloqueo
    tipo: pregunta
    titulo: "Dos mutex"
    texto: "Una tarea toma el mutex A y luego el B; otra, el B y luego el A. ¿Cómo se evita que se abracen?"
    libro: [441, 453, 456]
    widget:
      tipo: figura
      figura: fig-38.18
      zonas:
        - { id: sin, rotulo: "Diagrama de arriba", rect: [38, 8, 380, 90], texto: "Tareas que esperan un mutex." }
    opciones:
      - { texto: "Numerar los recursos y tomarlos siempre en orden creciente", bien: true, porque: "Con un solo orden de toma, el interbloqueo es imposible. Y una cola, ya protegida, evita el mutex por completo." }
      - { texto: "Usar semáforos binarios en vez de mutex", porque: "El abrazo es el mismo, y además se pierde la herencia de prioridad." }
      - { texto: "Subir la prioridad de una de las dos", porque: "La prioridad no deshace el abrazo: cada una tiene lo que la otra espera." }
    escalera: ["El problema es el orden en que se toman."]
    solucion: "Un solo orden de toma: numerar los recursos y tomarlos en orden creciente."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [431, 437, 443, 453]
    ideas:
      - { titulo: "Bloquear, no esperar.", texto: "Corre siempre la lista de más prioridad." }
      - { titulo: "Desde una ISR.", texto: "Solo FromISR, con portYIELD_FROM_ISR y sin esperar." }
      - { titulo: "Mutex.", texto: "Tiene dueño y hereda prioridad; el semáforo, no." }
      - { titulo: "Un solo orden.", texto: "Tomar los recursos siempre en orden creciente." }
