# Lección 1.2 de la sección 39.10 «Depuración: Ver Dentro del Chip» (cap38; etiqueta interna sec-38.10).
# Formato: contenido/lecciones11/GUIA.md (§11). Figura 39.14 (svg_vista 453,6 × 252): herramientas ordenadas por su
# perturbación. Sus filas son estrechas para tocarlas en un teléfono, así que las zonas agrupan dos filas.
# 1.2.1 («aprender haciendo», GUIA §13): el watchpoint se explora como el comparador de la unidad de depuración (bloque
# 322): una escritura en la dirección vigilada detiene el programa (la dirección, A1 encendida y A0 apagada, es de
# ejemplo); en la
# figura se tocan las herramientas para un fallo de tiempo real, para el desbordamiento de pila y para el fallo que
# cambia al observarlo. Queda una pregunta de opciones: el pin de depuración. El printf, la tabla de herramientas y el
# análisis post mortem van en los textos y el resumen.
leccion: cap38/sec-38.10

libro:
  291: "cualquier intento de observarlo lo altera"
  296: "la única forma razonable de descubrir quién está corrompiendo una variable"
  297: "parar el programa detiene el mundo real. Un motor sigue girando"
  300: "el fallo desaparece al intentar observarlo"
  305: "Perturbación mínima: una escritura a un registro, unos nanosegundos."
  306: "Con dos o tres pines y un analizador lógico se ve la estructura temporal completa de un firmware"
  312: "Es la herramienta correcta para los fallos que desaparecen al poner un punto de ruptura"
  314: "Una variable se corrompe"
  316: "antes de depurar, formular la hipótesis"
  317: "del printf al pin, del pin a la traza"
  318: "Herramientas de depuración ordenadas por su perturbación del sistema"
  320: "uno por dato la detiene cuando una dirección de memoria cambia, sin importar quién la escribió"
  321: "el depurador detiene el programa en la instrucción culpable"
  322: "Su implementación está en hardware"
  323: "sobre el final de una pila, para cazar un desbordamiento"
  324: "reservar una zona de RAM que el arranque no borre, y escribir en ella antes de morir"
  326: "La causa del reinicio"
  327: "El contador de programa y la pila en el momento del fallo"
  328: "Las últimas variables de estado"
  329: "Un contador de ocurrencias"

modelo:
  valores: {}
  calculos: {}

tarjetas:
  - id: explore-perturbacion
    tipo: explorar
    titulo: "Un watchpoint"
    texto: "La unidad de depuración compara cada escritura con la dirección vigilada: A1 encendida y A0 apagada. Provoque una escritura que detenga el programa."
    libro: [296, 320, 321, 322]
    widget:
      tipo: logica
      entradas:
        - { id: A1, rotulo: "A1" }
        - { id: A0, rotulo: "A0" }
        - { id: W, rotulo: "Escritura" }
      piezas:
        - { id: n0, tipo: not, entradas: [A0] }
        - { id: eq, tipo: and, entradas: [A1, n0], rotulo: "Dirección vigilada" }
        - { id: st, tipo: and, entradas: [eq, W], rotulo: "Detener" }
      salidas:
        - { id: STOP, de: st, rotulo: "Programa detenido" }
    objetivo:
      condiciones:
        - { led: STOP, valor: 1, rotulo: "Detenido" }
      logrado: "Se detiene en la instrucción que escribió, sin importar quién fuera. Es hardware: no ralentiza nada, y es la forma razonable de encontrar quién corrompe una variable."
      pistas:
        - { texto: "Ponga la dirección vigilada y escriba." }
    escalera: ["A1 encendida, A0 apagada, y una escritura."]
    solucion: "A1 encendida, A0 apagada y escritura."

  - id: toque-tiempo-real
    tipo: tocar
    titulo: "Falla solo en tiempo real"
    texto: "Un fallo desaparece en cuanto se pone un punto de ruptura. Toque el grupo de herramientas que lo ve."
    libro: [297, 312, 318]
    widget:
      tipo: figura
      figura: fig-38.14
      zonas:
        - { id: detienen, rotulo: "Primeras dos filas", rect: [50, 26, 400, 49] }
        - { id: lentas, rotulo: "Filas tercera y cuarta", rect: [50, 76, 400, 47] }
        - { id: ligeras, rotulo: "Filas quinta y sexta", rect: [50, 124, 400, 46] }
    tocar:
      bien: [ligeras]
      porque:
        detienen: "Detienen la ejecución: el mundo real no se para y el fallo se esconde."
        lentas: "Cambian la temporización: el fallo puede esconderse igual."
    exito: "El pin y la traza no detienen nada. La traza reconstruye el historial sin parar; su límite es el ancho de banda del canal."
    escalera: ["¿Cuáles no paran el programa?"]
    solucion: "Pin de depuración y traza."

  - id: porque-pin
    tipo: porque
    titulo: "El pin de depuración"
    texto: "¿Por qué un pin que sube al entrar en una función y baja al salir sirve donde el depurador no?"
    libro: [297, 305, 306]
    widget:
      tipo: figura
      figura: fig-38.14
      zonas:
        - { id: ligeras, rotulo: "Filas quinta y sexta", rect: [50, 124, 400, 46], texto: "Pin de depuración: una escritura a un registro, unos ns." }
    opciones:
      - { texto: "No detiene nada: el sistema sigue en tiempo real", bien: true, porque: "Unos nanosegundos de perturbación y resolución temporal perfecta; el depurador para el programa y el mundo sigue." }
      - { texto: "Porque enseña el valor de las variables", porque: "Un pin solo dice cuándo y cuánto: para los valores está el depurador." }
      - { texto: "Porque no necesita osciloscopio", porque: "Lo necesita, o un analizador lógico: así se ve cuánto dura cada cosa." }
    escalera: ["¿Qué le pasa a un motor cuando un punto de ruptura para el programa?"]
    solucion: "Perturba unos nanosegundos y no detiene el sistema."

  - id: pregunta-pila
    tipo: tocar
    titulo: "Cazar un desbordamiento"
    texto: "Quiere cazar un desbordamiento de pila en el instante en que ocurre, no cuando aparecen sus consecuencias. Toque el grupo de la herramienta."
    libro: [314, 318, 323]
    widget:
      tipo: figura
      figura: fig-38.14
      zonas:
        - { id: detienen, rotulo: "Primeras dos filas", rect: [50, 26, 400, 49] }
        - { id: lentas, rotulo: "Filas tercera y cuarta", rect: [50, 76, 400, 47] }
        - { id: ligeras, rotulo: "Filas quinta y sexta", rect: [50, 124, 400, 46] }
    tocar:
      bien: [detienen]
      porque:
        lentas: "Un printf o un registro cuentan lo que pasó; no paran en el instante."
        ligeras: "El pin mide tiempos; no ve qué dirección se escribe."
    exito: "Un watchpoint sobre el final de la pila: salta en cuanto la pila llega ahí."
    escalera: ["¿Qué herramienta para cuando se escribe una dirección?"]
    solucion: "Las primeras filas: el watchpoint."

  - id: pregunta-banco
    tipo: tocar
    titulo: "Si el fallo cambia al mirarlo"
    texto: "Pone un printf dentro de la interrupción y el fallo cambia de forma. Toque el grupo al que hay que pasar."
    libro: [300, 316, 317, 318]
    widget:
      tipo: figura
      figura: fig-38.14
      zonas:
        - { id: detienen, rotulo: "Primeras dos filas", rect: [50, 26, 400, 49] }
        - { id: lentas, rotulo: "Filas tercera y cuarta", rect: [50, 76, 400, 47] }
        - { id: ligeras, rotulo: "Filas quinta y sexta", rect: [50, 124, 400, 46] }
    tocar:
      bien: [ligeras]
      porque:
        detienen: "Parar es lo que más perturba."
        lentas: "Ahí está el printf: milisegundos por línea, que alteran la temporización."
    exito: "La observación es parte del problema: del printf al pin, del pin a la traza. Y antes de depurar, una hipótesis comprobable."
    escalera: ["Baje en la escala de perturbación."]
    solucion: "Pin de depuración y traza."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [291, 305, 316, 324, 326, 327, 328, 329]
    ideas:
      - { titulo: "Observar altera.", texto: "Cada herramienta paga en perturbación lo que da en visibilidad." }
      - { titulo: "Post mortem.", texto: "Una RAM que el arranque no borra guarda la causa, el contador de programa y el estado." }
      - { titulo: "Pin de depuración.", texto: "Unos nanosegundos, sin detener nada." }
      - { titulo: "Hipótesis.", texto: "Antes de depurar, una hipótesis que se pueda comprobar." }
