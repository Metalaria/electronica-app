# Lección 1.2 de la sección 25.1 «El Cristal Semiconductor» (cap26; etiqueta interna sec-26.1).
# Formato: contenido/lecciones11/GUIA.md. Bandas sobre la figura 25.1 del libro (fig-26.1).
# La curva de portadores frente a la temperatura es la ley del libro n_i² ∝ T³·exp(−E_g/kT) (bloque 232, sección 25.8),
# normalizada al silicio a 25 °C, con kT = V_T·T/300 K (25,85 mV a 300 K, sección 25.4) y los gaps de la tabla del
# bloque 10. El margen de temperaturas (−25 a 300 °C) es mío, para enseñar la sorpresa del bloque 14.
# El LED rojo y el azul (1,8 V → 2,0 eV, 3,0 V → 2,7 eV) son los del bloque 30; la resistencia de 150 Ω y la fuente de
# 5 V son un ejemplo para encenderlos.
leccion: cap26/sec-26.1

libro:
  3: "exactamente en medio"
  5: "no hay portadores libres"
  7: "los estados que ocupan los electrones enlazados"
  8: "los estados en que un electrón puede moverse libremente"
  9: "la energía que separa ambas"
  10: "Germanio"
  13: "con probabilidad que depende exponencialmente del gap"
  14: "SiC y GaN funcionen a temperaturas donde el silicio deja de comportarse como semiconductor"
  15: "un gap ancho soporta campos mucho mayores antes de la avalancha"
  16: "el color depende del material"
  18: "se comporta como una carga positiva móvil"
  19: "Su movilidad es unas tres veces menor que la del electrón"
  22: "que multiplica la generación"
  23: "que genera pares si el fotón tiene energía suficiente"
  24: "lo que hace un diodo polarizado en directa"
  29: "la tensión directa de un LED"
  30: "Un LED rojo que conduce a unos 1,8 V emite fotones de unos 2,0 eV (630 nm)"
  "cap26#232": 'n_(i)^("2") prop T^("3")'

modelo:
  valores:
    E_g: { sim: "E_{g}", nombre: "banda prohibida", unidad: eV, valor: 1.12 }
    T_c: { sim: "T", nombre: "temperatura", unidad: "°C", valor: 25 }
    V_l: { sim: "V_{F}", nombre: "tensión directa del LED", unidad: V, valor: 1.8 }
    V_s: { sim: "V", nombre: "tensión de la fuente", unidad: V, valor: 5 }
    R_l: { sim: "R", nombre: "resistencia del LED", unidad: Ω, valor: 150 }
  calculos:
    kT: { expr: "0.02585*(T_c + 273.15)/300", sim: "kT", nombre: "energía térmica", unidad: eV }
    n_r: { expr: "((T_c + 273.15)/298.15)^1.5*exp(-E_g/(2*kT) + 1.12/(2*0.02585*298.15/300))", sim: "n_{i}", nombre: "portadores frente al silicio a 25 °C", unidad: "", cifras: 2 }
    I_l: { expr: "(V_s - V_l)/R_l", sim: "I", nombre: "corriente del LED", unidad: A }
    E_f: { expr: "2.0 + (V_l - 1.8)*0.7/1.2", sim: "E_{fotón}", nombre: "energía del fotón", unidad: eV, cifras: 2 }
    l_f: { expr: "630e-9 - (V_l - 1.8)*165e-9/1.2", sim: "λ", nombre: "longitud de onda", unidad: m }

tarjetas:
  - id: explore-bandas
    tipo: explorar
    titulo: "Dos bandas y un hueco entre ellas"
    texto: "Toque las dos bandas del silicio puro y la energía que las separa."
    libro: [5, 7, 8, 9]
    widget:
      tipo: figura
      figura: fig-26.1
      zonas:
        - { id: conduccion, rotulo: "Arriba a la izquierda", rect: [21, 16, 88, 35], texto: "Banda de conducción: los estados en que un electrón se mueve libremente. En el cristal puro, casi vacía." }
        - { id: gap, rotulo: "En medio a la izquierda", rect: [10, 52, 100, 72], texto: "La banda prohibida, E_{g}: la energía que separa las dos bandas. Es el parámetro que define el material." }
        - { id: valencia, rotulo: "Abajo a la izquierda", rect: [21, 126, 88, 36], texto: "Banda de valencia: los electrones enlazados. Con todos los enlaces completos, no hay portadores libres." }
    requiere: { mover: [conduccion, gap, valencia] }

  - id: ordene-gaps
    tipo: pregunta
    fase: "Ordene"
    titulo: "De menos a más gap"
    texto: "Ordene los materiales de menor a mayor banda prohibida."
    libro: [10]
    ordenar:
      - "Germanio, 0,67 eV"
      - "Silicio, 1,12 eV"
      - "Carburo de silicio (SiC), 3,3 eV"
      - "Nitruro de galio (GaN), 3,4 eV"
      - "Un aislante, más de 5 eV"
    exito: "El silicio queda en medio: ni buen conductor ni buen aislante, y eso es lo que lo hace controlable."
    pistas:
      - { texto: "El germanio tiene poco más de la mitad de gap que el silicio." }
    escalera:
      - "SiC y GaN son los de banda ancha; el aislante está por encima de todos."
    solucion: "Germanio, silicio, SiC, GaN y el aislante."

  - id: explore-portadores
    tipo: explorar
    titulo: "Cuántos portadores libera el calor"
    texto: "Portadores libres frente al silicio a 25 °C. Elija el material y suba la temperatura."
    nota: "Escala logarítmica: cada raya multiplica por diez."
    libro: [13, 22, "cap26#232"]
    inicio: { E_g: 0.67, T_c: 25 }
    widget:
      tipo: grafica
      x: { id: tc, min: -25, max: 300, unidad: "°C", rotulo: "T" }
      y: { min: 1e-22, max: 1e8, unidad: "", rotulo: "n_{i}", escala: log }
      curvas:
        - { expr: "((tc + 273.15)/298.15)^1.5*exp(-1.12/(2*0.02585*(tc + 273.15)/300) + 1.12/(2*0.02585*298.15/300))", color: tinta, rotulo: "silicio", discontinua: true }
        - { expr: "((tc + 273.15)/298.15)^1.5*exp(-E_g/(2*0.02585*(tc + 273.15)/300) + 1.12/(2*0.02585*298.15/300))", color: naranja, rotulo: "el elegido" }
      marcas:
        - { x: "T_c", y: "n_r", rotulo: "{{n_r}}" }
      lectura: { valor: n_r, rotulo: "Portadores frente al silicio a 25 °C" }
      mandos:
        - { valor: E_g, lista: [0.67, 1.12, 3.3, 3.4], nombres: [germanio, silicio, SiC, GaN], rotulo: "Material" }
        - { valor: T_c, min: -25, max: 300, paso: 25, rotulo: "Temperatura" }
    requiere: { mover: [E_g, T_c] }

  - id: por-que-germanio
    tipo: pregunta
    titulo: "Las fugas del germanio"
    texto: "El germanio tiene muchas más fugas que el silicio. ¿Por qué?"
    libro: [13]
    fijar: { E_g: 0.67, T_c: 25 }
    widget:
      tipo: grafica
      x: { id: tc, min: -25, max: 300, unidad: "°C", rotulo: "T" }
      y: { min: 1e-22, max: 1e8, unidad: "", rotulo: "n_{i}", escala: log }
      curvas:
        - { expr: "((tc + 273.15)/298.15)^1.5*exp(-1.12/(2*0.02585*(tc + 273.15)/300) + 1.12/(2*0.02585*298.15/300))", color: tinta, rotulo: "silicio", discontinua: true }
        - { expr: "((tc + 273.15)/298.15)^1.5*exp(-E_g/(2*0.02585*(tc + 273.15)/300) + 1.12/(2*0.02585*298.15/300))", color: naranja, rotulo: "germanio" }
    opciones:
      - texto: "Su gap es poco más de la mitad, y la generación térmica depende exponencialmente del gap"
        bien: true
        porque: "Un gap menor deja saltar muchos más electrones con la misma agitación térmica: por eso más fugas y peor comportamiento térmico."
      - texto: "Sus electrones tienen menos movilidad"
        porque: "La movilidad dice lo deprisa que se mueven, no cuántos libera el calor. Las fugas cuentan portadores generados."
      - texto: "Se fabrica más dopado"
        porque: "El dopado lo decide el fabricante. La fuga térmica sale del material, de su banda prohibida."
    escalera:
      - "Compare las dos curvas: ¿qué tienen distinto los dos materiales en la tabla?"
    solucion: "Con 0,67 eV frente a 1,12 eV, el calor genera muchos más pares en el germanio."

  - id: prediga-sic
    tipo: predecir
    titulo: "Carburo de silicio caliente"
    texto: "SiC a 300 °C frente a silicio a 25 °C: ¿cuál tiene más portadores libres?"
    libro: [10, 14]
    fijar: { E_g: 3.3, T_c: 300 }
    widget:
      tipo: grafica
      x: { id: tc, min: -25, max: 300, unidad: "°C", rotulo: "T" }
      y: { min: 1e-22, max: 1e8, unidad: "", rotulo: "n_{i}", escala: log }
      curvas:
        - { expr: "((tc + 273.15)/298.15)^1.5*exp(-1.12/(2*0.02585*(tc + 273.15)/300) + 1.12/(2*0.02585*298.15/300))", color: tinta, rotulo: "silicio", discontinua: true }
      lectura: { valor: n_r, rotulo: "SiC a 300 °C, frente al silicio a 25 °C" }
      ocultar: true
    opciones:
      - texto: "El silicio frío: el SiC caliente sigue teniendo muchos menos"
        bien: true
        porque: "Con 3,3 eV de gap, ni a 300 °C genera el calor tantos pares como en el silicio a temperatura ambiente."
      - texto: "El SiC caliente: el calor siempre gana"
        porque: "La generación crece con la temperatura, pero depende exponencialmente del gap, y el del SiC es casi el triple."
      - texto: "Los dos tienen los mismos"
        porque: "Solo coincidirían si el calor compensara justo la diferencia de gap. Aquí se queda muy lejos."
    escalera:
      - "La probabilidad de saltar depende exponencialmente del gap: 3,3 eV frente a 1,12 eV."
    solucion: "El silicio a 25 °C: el SiC a 300 °C sigue muy por debajo."
    comprobar:
      - { T_c: 300 }
      - { con: { T_c: 25 }, T_c: 25 }

  - id: sorpresa-sic
    tipo: sorpresa
    titulo: "Carburo de silicio al rojo"
    texto: "Con SiC, suba la temperatura hasta el final. Compare con el silicio a 25 °C."
    libro: [14]
    fijar: { E_g: 3.3 }
    inicio: { T_c: 25 }
    widget:
      tipo: grafica
      x: { id: tc, min: -25, max: 300, unidad: "°C", rotulo: "T" }
      y: { min: 1e-22, max: 1e8, unidad: "", rotulo: "n_{i}", escala: log }
      curvas:
        - { expr: "((tc + 273.15)/298.15)^1.5*exp(-1.12/(2*0.02585*(tc + 273.15)/300) + 1.12/(2*0.02585*298.15/300))", color: tinta, rotulo: "silicio", discontinua: true }
        - { expr: "((tc + 273.15)/298.15)^1.5*exp(-E_g/(2*0.02585*(tc + 273.15)/300) + 1.12/(2*0.02585*298.15/300))", color: naranja, rotulo: "el elegido" }
      marcas:
        - { x: "T_c", y: "n_r", rotulo: "{{n_r}}" }
      lectura: { valor: n_r, rotulo: "Portadores frente al silicio a 25 °C" }
      mandos:
        - { valor: T_c, min: -25, max: 300, paso: 25, rotulo: "Temperatura" }
    requiere: { mover: [T_c] }

  - id: por-que-sic
    tipo: porque
    titulo: "¿Por qué aguanta el calor?"
    texto: "El SiC trabaja donde el silicio deja de comportarse como semiconductor. ¿Por qué?"
    libro: [14, 15]
    fijar: { E_g: 3.3, T_c: 300 }
    widget:
      tipo: grafica
      x: { id: tc, min: -25, max: 300, unidad: "°C", rotulo: "T" }
      y: { min: 1e-22, max: 1e8, unidad: "", rotulo: "n_{i}", escala: log }
      curvas:
        - { expr: "((tc + 273.15)/298.15)^1.5*exp(-1.12/(2*0.02585*(tc + 273.15)/300) + 1.12/(2*0.02585*298.15/300))", color: tinta, rotulo: "silicio", discontinua: true }
        - { expr: "((tc + 273.15)/298.15)^1.5*exp(-E_g/(2*0.02585*(tc + 273.15)/300) + 1.12/(2*0.02585*298.15/300))", color: naranja, rotulo: "SiC" }
    opciones:
      - texto: "Con gap ancho hace falta mucha más energía térmica para generar portadores"
        bien: true
        porque: "Los portadores térmicos son los que convierten el semiconductor en conductor; con gap ancho apenas aparecen."
      - texto: "Porque disipa mejor el calor"
        porque: "Eso ayuda al montaje, pero no explica que siga siendo semiconductor: lo explica el gap."
      - texto: "Porque está menos dopado"
        porque: "El dopado no cambia la generación térmica de pares, que depende del material."
    escalera:
      - "¿Qué crece con la temperatura y depende del gap?"
    solucion: "Su banda prohibida de 3,3 eV: el calor apenas genera pares."

  - id: empareje-gap
    tipo: pregunta
    fase: "Empareje"
    titulo: "Lo que decide la banda prohibida"
    texto: "Una cada propiedad con lo que le hace la banda prohibida."
    libro: [13, 14, 15, 16]
    emparejar:
      - ["Corriente de fugas", "Crece exponencialmente cuanto menor es el gap"]
      - ["Temperatura máxima", "Más alta con gap ancho: cuesta más generar portadores"]
      - ["Tensión de ruptura", "Un gap ancho soporta más campo antes de la avalancha"]
      - ["Color de un LED", "La energía del fotón es la del salto"]
    exito: "De un solo número salen consecuencias que aparecen en todo el libro."
    pistas:
      - { texto: "El fotón de un LED lleva la energía del salto entre bandas." }
    escalera:
      - "Gap ancho: menos portadores térmicos, más temperatura y más tensión."
    solucion: "Fugas–exponencial, temperatura–gap ancho, ruptura–campo, color–salto."

  - id: el-hueco
    tipo: pregunta
    titulo: "Lo que deja el electrón"
    texto: "Un electrón salta a la banda de conducción. ¿Qué queda en la de valencia?"
    libro: [18, 19]
    widget:
      tipo: figura
      figura: fig-26.1
      zonas:
        - { id: valencia, rotulo: "Abajo a la izquierda", rect: [21, 126, 88, 36] }
    opciones:
      - texto: "Un hueco, que se mueve como una carga positiva"
        bien: true
        porque: "Los vecinos van ocupándolo y el hueco avanza en sentido contrario. No es una partícula, pero se comporta como si lo fuera."
      - texto: "Un ion fijo"
        porque: "Un ion fijo es un átomo con carga que no se mueve. El hueco sí se desplaza."
      - texto: "Nada: la banda se recompone al instante"
        porque: "Queda un enlace incompleto, y eso es un portador más: el par electrón-hueco."
    escalera:
      - "El enlace del que salió el electrón queda incompleto."
    solucion: "Un hueco: una carga positiva móvil, unas tres veces menos móvil que el electrón."

  - id: empareje-generacion
    tipo: pregunta
    fase: "Empareje"
    titulo: "Tres formas de crear pares"
    texto: "Una cada causa con el sitio del libro donde aparece."
    libro: [22, 23, 24]
    emparejar:
      - ["La temperatura", "Las fugas que crecen al calentarse"]
      - ["La luz", "El fotodiodo"]
      - ["La inyección", "El diodo polarizado en directa"]
    exito: "Las tres actúan sobre el mismo equilibrio entre generación y recombinación."
    pistas:
      - { texto: "Un semiconductor sin encapsular es sensible a la luz." }
    escalera:
      - "La luz genera pares si el fotón trae energía suficiente."
    solucion: "Temperatura–fugas, luz–fotodiodo, inyección–diodo en directa."

  - id: explore-led
    tipo: explorar
    titulo: "El LED mide la banda prohibida"
    texto: "La tensión directa de un LED es aproximadamente la energía del fotón en electronvoltios. Cambie el color."
    libro: [29, 30]
    widget:
      tipo: circuito
      esquema: led
      piezas: { fuente: V_s, r: R_l, vf: V_l }
      lectura: { valor: V_l, rotulo: "Tensión directa del LED" }
      datos:
        - { valor: E_f, rotulo: "Fotón: {{E_f}}" }
        - { valor: l_f, rotulo: "Longitud de onda: {{l_f}}" }
      corriente: I_l
      mide: { corriente: I_l, vf: V_l }
      mandos:
        - { valor: V_l, lista: [1.8, 3.0], nombres: [rojo, azul], rotulo: "Color del LED" }

  - id: banco-led
    tipo: banco
    titulo: "Física cuántica con un multímetro"
    texto: "Encienda un LED rojo con su resistencia y mida su tensión directa."
    nota: "Repítalo con otros colores: el orden debe ser el del espectro."
    libro: [29, 30]
    fijar: { V_l: 1.8 }
    banco:
      piezas: ["Fuente de 5 V", "LED rojo con una resistencia de 150 Ω", "Multímetro en V⎓"]
      medir: "La tensión entre los bornes del LED encendido."
      esperado: V_l
      unidad: V
      tol: 0.15
      consejos:
        - { cuando: { valor: desviacion, mayor: 0.15 }, texto: "Mide de más: ¿es rojo? Un azul conduce a unos 3,0 V." }
        - { texto: "Mide de menos: compruebe que las puntas están en los bornes del LED y no en la resistencia." }
    comprobar:
      - { R_l: 150 }

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [3, 9, 13, 18]
    ideas:
      - { titulo: "En medio.", texto: "El silicio no es buen conductor ni buen aislante: está en medio y se puede controlar." }
      - { titulo: "La banda prohibida.", texto: "Separa la banda de valencia de la de conducción y define el material." }
      - { titulo: "Lo que decide.", texto: "Fugas, temperatura máxima, ruptura y color de un LED." }
      - { titulo: "El hueco.", texto: "El electrón que salta deja una carga positiva móvil: el par electrón-hueco." }
