# Lección 1.2 de la sección 25.9 «Más Allá del Silicio: SiC y GaN» (cap26; etiqueta interna sec-26.9).
# Formato: contenido/lecciones11/GUIA.md. Sección corta (tabla 25.1 y un párrafo): la figura 25.16 del libro
# (fig-26.16, banda prohibida frente a campo crítico) para tocar los materiales, la tabla 25.1 para emparejar y el
# ejercicio 25.8. La curva de portadores frente a la temperatura es la de la lección 25.1 (n_i² ∝ T³·exp(−E_g/kT),
# bloque 232, normalizada al silicio a 25 °C), con los gaps de la tabla 25.1.
leccion: cap26/sec-26.9

libro:
  261: "su banda prohibida de 1,1 eV le impone límites de tensión, temperatura y velocidad"
  262: "Alta frecuencia y conmutación rápida"
  263: "vehículos eléctricos, cargadores rápidos, energía solar"
  "cap26#232": 'n_(i)^("2") prop T^("3")'
  "cap26#286": "Porque su banda prohibida es mucho mayor (3,3 eV frente a 1,1 eV)"

modelo:
  valores:
    E_g: { sim: "E_{g}", nombre: "banda prohibida", unidad: eV, valor: 1.1 }
    T_c: { sim: "T", nombre: "temperatura", unidad: "°C", valor: 25 }
  calculos:
    kT: { expr: "0.02585*(T_c + 273.15)/300", sim: "kT", nombre: "energía térmica", unidad: eV }
    n_r: { expr: "((T_c + 273.15)/298.15)^1.5*exp(-E_g/(2*kT) + 1.1/(2*0.02585*298.15/300))", sim: "n_{i}", nombre: "portadores frente al silicio a 25 °C", unidad: "", cifras: 2 }
    r_g: { expr: "3.3/1.1", sim: "×", nombre: "gap del SiC frente al del silicio", unidad: "", cifras: 2 }

tarjetas:
  - id: explore-materiales
    tipo: explorar
    titulo: "Banda ancha"
    texto: "Banda prohibida y campo crítico de ruptura de cuatro materiales. Toque los dos de banda ancha y el silicio."
    libro: [261, 262]
    widget:
      tipo: figura
      figura: fig-26.16
      zonas:
        - { id: si, rotulo: "Abajo a la izquierda", rect: [43, 128, 51, 43], texto: "Silicio: 1,1 eV. Uso general y bajo coste, con límites de tensión, temperatura y velocidad." }
        - { id: gaas, rotulo: "Abajo, en el centro", rect: [100, 140, 100, 34], texto: "Arseniuro de galio: más movilidad que el silicio, para radiofrecuencia y optoelectrónica." }
        - { id: sic, rotulo: "A la derecha, en medio", rect: [228, 68, 112, 34], texto: "Carburo de silicio: 3,3 eV. Alta tensión, potencia y calor." }
        - { id: gan, rotulo: "Arriba a la derecha", rect: [258, 22, 96, 30], texto: "Nitruro de galio: 3,4 eV. Alta frecuencia y conmutación rápida." }
    requiere: { mover: [si, sic, gan] }

  - id: empareje-materiales
    tipo: pregunta
    fase: "Empareje"
    titulo: "Para qué destaca cada uno"
    texto: "Una cada material con su terreno."
    libro: [262]
    emparejar:
      - ["Silicio, 1,1 eV", "Uso general, bajo coste"]
      - ["Carburo de silicio, 3,3 eV", "Alta tensión, potencia y calor"]
      - ["Nitruro de galio, 3,4 eV", "Alta frecuencia y conmutación rápida"]
    exito: "SiC y GaN tienen casi el mismo gap, y destacan en cosas distintas."
    pistas:
      - { texto: "El de las fuentes compactas y la radiofrecuencia es el GaN." }
    escalera:
      - "Los dos de banda ancha aguantan más; uno va hacia la tensión, el otro hacia la velocidad."
    solucion: "Si–general, SiC–tensión y calor, GaN–frecuencia."

  - id: prediga-calor
    tipo: predecir
    titulo: "A 300 °C"
    texto: "El nitruro de galio a 300 °C frente al silicio a 25 °C: ¿cuál tiene más portadores generados por el calor?"
    libro: [261, "cap26#232"]
    fijar: { E_g: 3.4, T_c: 300 }
    widget:
      tipo: grafica
      x: { id: tc, min: -25, max: 300, unidad: "°C", rotulo: "T" }
      y: { min: 1e-22, max: 1e8, unidad: "", rotulo: "n_{i}", escala: log }
      curvas:
        - { expr: "((tc + 273.15)/298.15)^1.5*exp(-1.1/(2*0.02585*(tc + 273.15)/300) + 1.1/(2*0.02585*298.15/300))", color: tinta, rotulo: "silicio", discontinua: true }
      lectura: { valor: n_r, rotulo: "GaN a 300 °C, frente al silicio a 25 °C" }
      ocultar: true
    opciones:
      - texto: "El silicio frío: el GaN caliente tiene muchísimos menos"
        bien: true
        porque: "Con 3,4 eV de gap el calor apenas genera pares: por eso trabaja donde el silicio deja de ser semiconductor."
      - texto: "El GaN caliente"
        porque: "La generación crece con la temperatura, pero el gap manda exponencialmente, y el del GaN es tres veces mayor."
      - texto: "Los dos igual"
        porque: "Solo si el calor compensara justo los 2,3 eV de diferencia. No llega ni de lejos."
    escalera:
      - "Compare las bandas prohibidas: 3,4 eV frente a 1,1 eV."
    solucion: "El silicio a 25 °C: el GaN a 300 °C queda muy por debajo."
    comprobar:
      - { T_c: 300 }
      - { con: { T_c: 25 }, T_c: 25 }
      - { con: { E_g: 2.3 }, E_g: 2.3 }

  - id: explore-calor
    tipo: sorpresa
    titulo: "Tres materiales, una escala"
    texto: "Elija el material y suba la temperatura hasta 300 °C. Compare con el silicio a 25 °C, la línea discontinua."
    libro: [261, "cap26#232"]
    inicio: { E_g: 3.4, T_c: 25 }
    widget:
      tipo: grafica
      x: { id: tc, min: -25, max: 300, unidad: "°C", rotulo: "T" }
      y: { min: 1e-22, max: 1e8, unidad: "", rotulo: "n_{i}", escala: log }
      curvas:
        - { expr: "((tc + 273.15)/298.15)^1.5*exp(-1.1/(2*0.02585*(tc + 273.15)/300) + 1.1/(2*0.02585*298.15/300))", color: tinta, rotulo: "silicio", discontinua: true }
        - { expr: "((tc + 273.15)/298.15)^1.5*exp(-E_g/(2*0.02585*(tc + 273.15)/300) + 1.1/(2*0.02585*298.15/300))", color: naranja, rotulo: "el elegido" }
      marcas:
        - { x: "T_c", y: "n_r", rotulo: "{{n_r}}" }
      lectura: { valor: n_r, rotulo: "Portadores frente al silicio a 25 °C" }
      mandos:
        - { valor: E_g, lista: [1.1, 3.3, 3.4], nombres: [silicio, SiC, GaN], rotulo: "Material" }
        - { valor: T_c, min: -25, max: 300, paso: 25, rotulo: "Temperatura" }
    requiere: { mover: [T_c] }
    comprobar:
      - { con: { T_c: 300 }, T_c: 300 }

  - id: por-que-banda
    tipo: porque
    titulo: "¿Por qué aguantan más?"
    texto: "El SiC soporta más tensión y más temperatura que el silicio. ¿Por qué?"
    libro: ["cap26#286"]
    fijar: { E_g: 3.3, T_c: 300 }
    widget:
      tipo: grafica
      x: { id: tc, min: -25, max: 300, unidad: "°C", rotulo: "T" }
      y: { min: 1e-22, max: 1e8, unidad: "", rotulo: "n_{i}", escala: log }
      curvas:
        - { expr: "((tc + 273.15)/298.15)^1.5*exp(-1.1/(2*0.02585*(tc + 273.15)/300) + 1.1/(2*0.02585*298.15/300))", color: tinta, rotulo: "silicio", discontinua: true }
        - { expr: "((tc + 273.15)/298.15)^1.5*exp(-E_g/(2*0.02585*(tc + 273.15)/300) + 1.1/(2*0.02585*298.15/300))", color: naranja, rotulo: "SiC" }
    opciones:
      - texto: "Su banda prohibida es mucho mayor: liberar portadores cuesta más energía"
        bien: true
        porque: "Aguanta campos más intensos antes de romper y sigue funcionando caliente sin demasiada fuga: 3,3 eV frente a 1,1 eV."
      - texto: "Porque es más puro"
        porque: "La pureza importa para el dopado, pero el límite de tensión y temperatura lo fija el gap."
      - texto: "Porque conduce peor"
        porque: "No se trata de conducir peor: en conducción interesa lo contrario. Es el gap ancho."
    escalera:
      - "¿Qué número de la tabla separa al SiC del silicio?"
    solucion: "Su banda prohibida, unas tres veces mayor."
    comprobar:
      - { r_g: 3 }

  - id: elegir-material
    tipo: pregunta
    titulo: "Un cargador de coche eléctrico"
    texto: "Un convertidor de vehículo eléctrico, a alta tensión y caliente. ¿Qué material pide?"
    libro: [262, 263]
    widget:
      tipo: figura
      figura: fig-26.16
      zonas:
        - { id: ancha, rotulo: "La franja de banda ancha", rect: [296, 2, 86, 176] }
    opciones:
      - texto: "Carburo de silicio"
        bien: true
        porque: "Brilla en alta tensión y potencia, donde aguanta tensiones y temperaturas que harían claudicar al silicio."
      - texto: "Nitruro de galio"
        porque: "También es de banda ancha, pero destaca en alta frecuencia y fuentes compactas, no en alta tensión."
      - texto: "Silicio"
        porque: "Es el de uso general y bajo coste, con límites de tensión y temperatura."
    escalera:
      - "Alta tensión y calor: mire la tabla."
    solucion: "SiC: alta tensión, potencia y calor."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [261, 262, 263]
    ideas:
      - { titulo: "Banda ancha.", texto: "SiC (3,3 eV) y GaN (3,4 eV) frente a 1,1 eV del silicio." }
      - { titulo: "SiC.", texto: "Alta tensión, potencia y calor: vehículos eléctricos, cargadores, solar." }
      - { titulo: "GaN.", texto: "Alta frecuencia y conmutación rápida: fuentes compactas y radiofrecuencia." }
