# Lección 1.2 de la sección 25.9 «Más Allá del Silicio: SiC y GaN» (cap26; etiqueta interna sec-26.9).
# Formato: contenido/lecciones11/GUIA.md. Sección corta (tabla 25.1 y un párrafo): la figura 25.16 del libro
# (fig-26.16, banda prohibida frente a campo crítico) para tocar los materiales, la tabla 25.1 para emparejar y el
# ejercicio 25.8. La curva de portadores frente a la temperatura es la de la lección 25.1 (n_i² ∝ T³·exp(−E_g/kT),
# bloque 232, normalizada al silicio a 25 °C), con los gaps de la tabla 25.1.
# 1.2.1 (autor121-ana, «aprender haciendo», GUIA §13): los dos de banda ancha, el del cargador de coche y el de la
# fuente compacta se tocan en la figura 25.16 (la tabla emparejada pasa a esas tres tarjetas), y el GaN se calienta
# hasta 300 °C sin alcanzar al silicio frío (la predicción se funde con esa exploración). Queda una pregunta de
# opciones (por qué aguantan más).
leccion: cap26/sec-26.9

libro:
  261: "su banda prohibida de 1,1 eV le impone límites de tensión, temperatura y velocidad"
  262: "Alta frecuencia y conmutación rápida"
  263: "vehículos eléctricos, cargadores rápidos, energía solar"
  "cap26#232": 'n_(i)^("2") prop T^("3")'
  264: "Banda prohibida y campo crítico de ruptura del silicio"
  "cap26#286": "Porque su banda prohibida es mucho mayor (3,3 eV frente a 1,1 eV)"

modelo:
  valores:
    E_g: { sim: "E_{g}", nombre: "banda prohibida", unidad: eV, valor: 1.1 }
    T_c: { sim: "T", nombre: "temperatura", unidad: "°C", valor: 25 }
  calculos:
    kT: { expr: "0.02585*(T_c + 273.15)/300", sim: "kT", nombre: "energía térmica", unidad: eV }
    n_r: { expr: "((T_c + 273.15)/298.15)^1.5*exp(-E_g/(2*kT) + 1.1/(2*0.02585*298.15/300))", sim: "n_{i}", nombre: "portadores frente al silicio a 25 °C", unidad: "", cifras: 2 }
    r_g: { expr: "3.3/1.1", sim: "×", nombre: "gap del SiC frente al del silicio", unidad: "", cifras: 2 }

tarjetas:
  - id: explore-materiales
    tipo: tocar
    titulo: "Banda ancha"
    texto: "Banda prohibida y campo crítico de ruptura de cuatro materiales. Toque los dos semiconductores de banda ancha."
    libro: [261, 264]
    widget:
      tipo: figura
      figura: fig-26.16
      zonas:
        - { id: si, rotulo: "Abajo a la izquierda", rect: [43, 128, 51, 43] }
        - { id: gaas, rotulo: "Abajo, en el centro", rect: [100, 140, 100, 34] }
        - { id: sic, rotulo: "A la derecha, en medio", rect: [228, 68, 112, 34] }
        - { id: gan, rotulo: "Arriba a la derecha", rect: [258, 22, 96, 30] }
    tocar:
      bien: [sic, gan]
      todas: true
      porque:
        si: "El silicio, con 1,1 eV: uso general y bajo coste, con límites de tensión, temperatura y velocidad."
        gaas: "El arseniuro de galio tiene más movilidad, pero su gap queda cerca del silicio."
    exito: "SiC, 3,3 eV, y GaN, 3,4 eV: unas tres veces el gap del silicio, y varias veces su campo crítico de ruptura."
    escalera:
      - "Busque la franja sombreada de la derecha."
    solucion: "El carburo de silicio y el nitruro de galio."

  - id: explore-calor
    tipo: explorar
    titulo: "A 300 °C"
    texto: "¿Alcanza el GaN caliente al silicio a 25 °C, la línea discontinua? Elija el GaN y súbalo hasta 300 °C."
    libro: [261, "cap26#232"]
    inicio: { E_g: 1.1, T_c: 25 }
    widget:
      tipo: grafica
      x: { id: tc, min: -25, max: 300, unidad: "°C", rotulo: "T" }
      y: { min: 1e-22, max: 1e8, unidad: "", rotulo: "n_{i}", escala: log }
      curvas:
        - { expr: "((tc + 273.15)/298.15)^1.5*exp(-1.1/(2*0.02585*(tc + 273.15)/300) + 1.1/(2*0.02585*298.15/300))", color: tinta, rotulo: "silicio", discontinua: true }
        - { expr: "((tc + 273.15)/298.15)^1.5*exp(-E_g/(2*0.02585*(tc + 273.15)/300) + 1.1/(2*0.02585*298.15/300))", color: naranja, rotulo: "el elegido" }
      marcas:
        - { x: "T_c", y: "n_r", rotulo: "{{n_r}}" }
      lectura: { valor: n_r, rotulo: "Portadores frente al silicio a 25 °C" }
      mandos:
        - { valor: E_g, lista: [1.1, 3.3, 3.4], nombres: [silicio, SiC, GaN], rotulo: "Material" }
        - { valor: T_c, min: -25, max: 300, paso: 25, rotulo: "Temperatura" }
    objetivo:
      condiciones:
        - { valor: E_g, min: 3.4, rotulo: "GaN" }
        - { valor: T_c, min: 300, rotulo: "A {{T_c}}" }
      logrado: "A 300 °C, el GaN tiene {{n_r}} de los portadores del silicio frío: sigue siendo semiconductor donde el silicio dejó de serlo."
      pistas:
        - { cuando: { valor: E_g, max: 3.3 }, texto: "Elija el nitruro de galio." }
        - { texto: "Suba la temperatura hasta el final del eje." }
    escalera:
      - "El gap manda exponencialmente: 3,4 eV frente a 1,1 eV."
    solucion: "GaN a 300 °C: muchísimos menos portadores que el silicio a 25 °C."
    comprobar:
      - { con: { E_g: 3.4, T_c: 300 }, T_c: 300 }

  - id: por-que-banda
    tipo: porque
    titulo: "¿Por qué aguantan más?"
    texto: "El SiC soporta más tensión y más temperatura que el silicio. ¿Por qué?"
    libro: ["cap26#286"]
    fijar: { E_g: 3.3, T_c: 300 }
    widget:
      tipo: grafica
      x: { id: tc, min: -25, max: 300, unidad: "°C", rotulo: "T" }
      y: { min: 1e-22, max: 1e8, unidad: "", rotulo: "n_{i}", escala: log }
      curvas:
        - { expr: "((tc + 273.15)/298.15)^1.5*exp(-1.1/(2*0.02585*(tc + 273.15)/300) + 1.1/(2*0.02585*298.15/300))", color: tinta, rotulo: "silicio", discontinua: true }
        - { expr: "((tc + 273.15)/298.15)^1.5*exp(-E_g/(2*0.02585*(tc + 273.15)/300) + 1.1/(2*0.02585*298.15/300))", color: naranja, rotulo: "SiC" }
    opciones:
      - texto: "Su banda prohibida es mucho mayor: liberar portadores cuesta más energía"
        bien: true
        porque: "Aguanta campos más intensos antes de romper y sigue funcionando caliente sin demasiada fuga: 3,3 eV frente a 1,1 eV."
      - texto: "Porque es más puro"
        porque: "La pureza importa para el dopado, pero el límite de tensión y temperatura lo fija el gap."
      - texto: "Porque conduce peor"
        porque: "No se trata de conducir peor: en conducción interesa lo contrario. Es el gap ancho."
    escalera:
      - "¿Qué número de la tabla separa al SiC del silicio?"
    solucion: "Su banda prohibida, unas tres veces mayor."
    comprobar:
      - { r_g: 3 }

  - id: elegir-material
    tipo: tocar
    titulo: "Un cargador de coche eléctrico"
    texto: "Un convertidor de vehículo eléctrico, a alta tensión y caliente. Toque el material que pide."
    libro: [262, 263, 264]
    widget:
      tipo: figura
      figura: fig-26.16
      zonas:
        - { id: si, rotulo: "Abajo a la izquierda", rect: [43, 128, 51, 43] }
        - { id: gaas, rotulo: "Abajo, en el centro", rect: [100, 140, 100, 34] }
        - { id: sic, rotulo: "A la derecha, en medio", rect: [228, 68, 112, 34] }
        - { id: gan, rotulo: "Arriba a la derecha", rect: [258, 22, 96, 30] }
    tocar:
      bien: [sic]
      porque:
        gan: "También es de banda ancha, pero destaca en alta frecuencia y fuentes compactas, no en alta tensión."
        si: "Es el de uso general y bajo coste: claudicaría con esa tensión y ese calor."
        gaas: "Es el de la radiofrecuencia y la optoelectrónica, no el de la potencia."
    exito: "El carburo de silicio: alta tensión, potencia y calor. Vehículos eléctricos, cargadores rápidos y energía solar."
    escalera:
      - "Alta tensión y calor: mire la tabla."
    solucion: "SiC: alta tensión, potencia y calor."

  - id: fuente-compacta
    tipo: tocar
    titulo: "Una fuente diminuta"
    texto: "Una fuente de alimentación compacta que conmuta muy deprisa. Toque el material que pide."
    libro: [262, 263, 264]
    widget:
      tipo: figura
      figura: fig-26.16
      zonas:
        - { id: si, rotulo: "Abajo a la izquierda", rect: [43, 128, 51, 43] }
        - { id: gaas, rotulo: "Abajo, en el centro", rect: [100, 140, 100, 34] }
        - { id: sic, rotulo: "A la derecha, en medio", rect: [228, 68, 112, 34] }
        - { id: gan, rotulo: "Arriba a la derecha", rect: [258, 22, 96, 30] }
    tocar:
      bien: [gan]
      porque:
        sic: "El SiC brilla en alta tensión y potencia; en conmutación rápida destaca el otro de banda ancha."
        si: "El silicio tiene límites de velocidad: por eso las fuentes compactas buscan otro material."
        gaas: "El arseniuro de galio va a radiofrecuencia y optoelectrónica, no a fuentes de potencia."
    exito: "El nitruro de galio: alta frecuencia y conmutación rápida, en fuentes compactas y radiofrecuencia."
    escalera:
      - "Alta frecuencia y conmutación rápida: mire la tabla."
    solucion: "GaN."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [261, 262, 263]
    ideas:
      - { titulo: "Banda ancha.", texto: "SiC (3,3 eV) y GaN (3,4 eV) frente a 1,1 eV del silicio." }
      - { titulo: "SiC.", texto: "Alta tensión, potencia y calor: vehículos eléctricos, cargadores, solar." }
      - { titulo: "GaN.", texto: "Alta frecuencia y conmutación rápida: fuentes compactas y radiofrecuencia." }
