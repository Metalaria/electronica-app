    titulo: "El efecto que hay que anticipar"
    texto: "Los Zener tienen una capacidad de unión apreciable: con 1 kΩ y 200 pF, el corte cae en 796 kHz. ¿Qué significa?"
    libro: [344]
    fijar: { R_q: 1000, V_q: 10, V_zz: 5.6 }
