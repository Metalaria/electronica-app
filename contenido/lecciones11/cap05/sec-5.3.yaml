    ideas:
      - { titulo: "No hay umbral.", texto: "I = I_{S}·(e^{V/nV_{T}} − 1): 59,5 mV por década con n = 1; 119 mV con n = 2." }
      - { titulo: "Por eso 0,7 V.", texto: "De 1 a 100 mA la tensión sube 119 mV: la caída constante basta en el 90 % de los diseños; por tramos, para la disipación de un puente." }
      - { titulo: "r_{d} = n·V_{T}/I.", texto: "La pendiente en el punto de trabajo; baja con la corriente: 2,59 Ω a 10 mA." }
      - { titulo: "Temperatura y dispersión.", texto: "Unos −2 mV/°C. Con poca tensión sobre la resistencia, la dispersión de V_{f} manda." }
