# Lección 1.1 de la sección 5.8 «El Diodo Zener como Regulador y Referencia» (cap05): el regulador con resistencia
# serie (ej. 5.3 y 5.8), el peor caso sin carga, la resistencia dinámica que decide la calidad (tabla de r_z), las dos
# físicas de la ruptura y su deriva térmica, el ruido y cuándo sí y cuándo no usarlo. Formato:
# contenido/lecciones11/GUIA.md.
# 1.2.1 (autor121-fund, «aprender haciendo», GUIA §13): predecir la salida con 15 V, subir la entrada hasta que
# el Zener lleve 15 mA, el reto de R_s, quitar la carga, predecir los 450 mV del de 3,3 V, comparar tres Zener,
# calcular la R_s del 5.8 y la avería; se eligen el peor caso y cuándo no usarlo. Deriva, ruido y la referencia
# baja quedan en los textos y el resumen.
leccion: cap05/sec-5.8

libro:
  242: "la mantiene casi constante aunque varíe mucho la corriente que lo atraviesa"
  243: "la resistencia absorbe el exceso de tensión y fija una corriente"
  246: "el mínimo está entre 5 y 7 V"
  247: "450 mV (14 %)"
  248: "se usa un Zener de 5,1 o 5,6 V seguido de un divisor o un seguidor"
  250: "Un Zener de 27 V deriva unos +23 mV/°C"
  251: "La avalancha es un proceso aleatorio y genera ruido"
  252: "porque el rendimiento es pésimo"
  254: "toda la corriente pasa por el Zener y no debe superar su disipación"
  "cap05#348": "Diseña un regulador Zener que entregue 5,1 V a una carga que consume 20 mA, desde una entrada de 12 V"

modelo:
  valores:
    V_zi: { sim: "V_{in}", nombre: "tensión de entrada", unidad: V, valor: 12 }
    R_zs: { sim: "R_{s}", nombre: "resistencia en serie", unidad: Ω, valor: 270 }
    V_z: { sim: "V_{Z}", nombre: "tensión Zener", unidad: V, valor: 5.1 }
    R_zl: { sim: "R_{L}", nombre: "carga de 20 mA", unidad: Ω, valor: 255 }
    z_on: { tipo: interruptor, nombre: "carga conectada", valor: 1 }
    I_q: { sim: "I_{Z}", nombre: "corriente del Zener", unidad: A, valor: 0.005 }
  calculos:
    V_zd: { si: z_on, entonces: "V_zi*R_zl/(R_zs + R_zl)", sino: "V_zi", sim: "V_{div}", nombre: "salida sin Zener", unidad: V }
    V_zo: { expr: "min(V_zd, V_z)", sim: "V_{salida}", nombre: "tensión de salida", unidad: V }
    I_zs: { expr: "(V_zi - V_zo)/R_zs", sim: "I_{s}", nombre: "corriente por R_s", unidad: A }
    I_zl: { si: z_on, entonces: "V_zo/R_zl", sino: "0", sim: "I_{L}", nombre: "corriente de carga", unidad: A }
    I_zz: { expr: "I_zs - I_zl", sim: "I_{Z}", nombre: "corriente del Zener", unidad: A }
    P_z: { expr: "V_zo*I_zz", sim: "P_{Z}", nombre: "potencia en el Zener", unidad: W }
    P_s: { expr: "(V_zi - V_zo)*I_zs", sim: "P_{R}", nombre: "potencia en R_s", unidad: W }
    R_53: { expr: "(V_zi - V_z)/(0.005 + 0.02)", sim: "R_{s}", nombre: "resistencia del ejercicio 5.3", unidad: Ω }
    R_58: { expr: "(V_zi - V_z)/(0.02 + 0.01)", sim: "R_{s}", nombre: "resistencia del ejercicio 5.8", unidad: Ω }
    d33: { expr: "(I_q - 0.005)*30", sim: "ΔV", nombre: "variación del Zener de 3,3 V", unidad: V }
    d51: { expr: "(I_q - 0.005)*7", sim: "ΔV", nombre: "variación del Zener de 5,1 V", unidad: V }
    d27: { expr: "(I_q - 0.005)*25", sim: "ΔV", nombre: "variación del Zener de 27 V", unidad: V }
    p33: { expr: "d33/3.3*100", sim: "ΔV/V_{Z}", nombre: "variación relativa del Zener de 3,3 V", unidad: "%", cifras: 2 }

tarjetas:
  - id: prediga-entrada
    tipo: simular
    titulo: "Prediga"
    texto: "Un regulador de 5,1 V (Zener y 270 Ω desde la entrada) alimenta una carga de 20 mA. Si la entrada sube de 12 a 15 V, ¿qué tensión da la salida?"
    libro: [242, 243]
    fijar: { V_zi: 15 }
    simular:
      objetivo: V_zo
      unidad: V
      tol: 0.02
      rotulo: "Salida con 15 V"
      errores:
        - { razon: { min: 1.35, max: 1.5 }, texto: "Eso haría un divisor. El Zener mantiene su tensión aunque cambie mucho su corriente." }
        - { razon: { min: 1.55, max: 1.63 }, texto: "Esos 3 V de más se los queda la resistencia en serie, no la salida." }
    exito: "5,1 V: la resistencia se queda con el exceso de tensión y la corriente sobrante pasa por el Zener, que clava la salida."
    escalera:
      - "El Zener mantiene su tensión aunque cambie mucho su corriente."
    solucion: "Sigue en 5,1 V."
    comprobar:
      - { V_zo: 5.1, V_zd: 7.29, tol: 0.01 }
  - id: explore-regulador
    tipo: explorar
    titulo: "El regulador más simple"
    texto: "Un Zener de 5,1 V con una resistencia en serie alimenta una carga de 20 mA. Suba la entrada hasta que el Zener lleve más de 15 mA."
    libro: [242, 243, "cap05#348"]
    widget:
      tipo: circuito
      esquema: zener
      piezas: { fuente: V_zi, rs: R_zs, vz: V_z, carga: R_zl, interruptor: z_on }
      lectura: { valor: V_zo, rotulo: "Salida" }
      datos:
        - { valor: I_zz, rotulo: "I_{Z} = {{I_zz}}" }
        - { valor: I_zs, rotulo: "I_{s} = {{I_zs}}" }
      corriente: I_zs
      mide: { salida: V_zo, serie: I_zs, iz: I_zz, carga: I_zl }
      mandos:
        - { valor: V_zi, min: 12, max: 15, paso: 0.5, rotulo: "Entrada, V_{in}" }
    inicio: { V_zi: 12 }
    objetivo:
      condiciones:
        - { valor: I_zz, min: 0.015, rotulo: "I_{Z} = {{I_zz}}" }
      logrado: "Con {{V_zi}}, la salida sigue en {{V_zo}} y el Zener lleva {{I_zz}}: la resistencia absorbe el exceso de tensión, y el Zener, el de corriente."
      pistas:
        - { texto: "Más entrada." }
    escalera:
      - "Lo que la entrada sube lo absorbe R_{s}, y la corriente de más va al Zener."
    solucion: "Con 15 V: 16,7 mA."
    comprobar:
      - { I_zz: 0.0056, tol: 0.02 }
      - { con: { V_zi: 15 }, I_zz: 0.0167, V_zo: 5.1, tol: 0.02 }

  - id: reto-rs
    tipo: reto
    titulo: "Reto: la resistencia serie"
    texto: "5,1 V para una carga de 20 mA desde 12 V; el Zener necesita al menos 5 mA. Elija la mayor resistencia E12 que se los deja."
    libro: ["cap05#348"]
    fijar: { V_zi: 12, z_on: 1 }
    inicio: { R_zs: 150 }
    widget:
      tipo: circuito
      esquema: zener
      piezas: { fuente: V_zi, rs: R_zs, vz: V_z, carga: R_zl, interruptor: z_on }
      lectura: { valor: I_zz, rotulo: "Corriente del Zener" }
      datos:
        - { valor: R_53, rotulo: "Cálculo: {{R_53}}" }
      corriente: I_zs
      mide: { salida: V_zo, serie: I_zs, iz: I_zz, carga: I_zl }
      mandos:
        - { valor: R_zs, serie: E12, min: 100, max: 1000, rotulo: "R_{s} (E12)" }
    condiciones:
      - { valor: I_zz, min: 0.005, rotulo: "Zener: {{I_zz}}" }
      - { valor: R_zs, min: 270, rotulo: "La mayor que cumple" }
    exito: "R_{s} = 6,9/0,025 = 276 Ω; la E12 de 270 Ω deja {{I_zz}} al Zener y disipa 0,176 W."
    pistas:
      - { cuando: { valor: I_zz, menor: 0.005 }, texto: "El Zener se queda sin su corriente mínima: baje R_{s}." }
      - { cuando: { valor: R_zs, menor: 270 }, texto: "Cumple, pero hay una E12 mayor que también deja 5 mA." }
    escalera:
      - "Por R_{s} pasan la carga y el Zener: 20 + 5 mA, con 12 − 5,1 V."
    solucion: "R_{s} = (12 − 5,1)/(0,005 + 0,020) = 276 Ω: la E12 justo por debajo, 270 Ω."
    comprobar:
      - { R_53: 276 }
      - { con: { R_zs: 270 }, P_s: 0.176 }

  - id: sorpresa-sin-carga
    tipo: sorpresa
    titulo: "Quite la carga"
    texto: "El regulador de 270 Ω entrega 5,1 V a una carga de 20 mA. Desconecte la carga y mire el Zener."
    libro: ["cap05#348"]
    fijar: { V_zi: 12, R_zs: 270 }
    inicio: { z_on: 1 }
    widget:
      tipo: circuito
      esquema: zener
      piezas: { fuente: V_zi, rs: R_zs, vz: V_z, carga: R_zl, interruptor: z_on }
      lectura: { valor: I_zz, rotulo: "Corriente del Zener" }
      datos:
        - { valor: P_z, rotulo: "El Zener disipa {{P_z}}" }
      corriente: I_zs
      mide: { salida: V_zo, serie: I_zs, iz: I_zz, carga: I_zl }
      mandos:
        - { valor: z_on, tipo: interruptor, rotulo: "Carga" }
    objetivo:
      condiciones:
        - { valor: z_on, max: 0, rotulo: "Carga desconectada" }
      logrado: "Sin carga, el Zener pasa de 5,6 mA a {{I_zz}} y disipa {{P_z}}: toda la corriente de R_{s} va por él."
      pistas:
        - { texto: "Abra el interruptor de la carga." }
    escalera:
      - "Desconecte la carga."
    solucion: "25,6 mA y 0,13 W."
    comprobar:
      - { I_zz: 0.0056, tol: 0.02 }
      - { con: { z_on: 0 }, I_zz: 0.0256, P_z: 0.13 }

  - id: porque-peor-caso
    tipo: porque
    titulo: "El peor caso del Zener"
    texto: "Sin carga, el Zener pasa de 5,6 mA a 25,6 mA y disipa 0,13 W. ¿Por qué es ese su peor caso?"
    libro: [254, "cap05#348"]
    opciones:
      - texto: "R_{s} fija la corriente, y sin carga toda pasa por el Zener"
        bien: true
        porque: "Con la entrada máxima y sin carga se elige su potencia. La otra condición es entrada mínima con carga máxima."
      - texto: "Porque sube la tensión de salida"
        porque: "La salida se queda en 5,1 V. Lo que sube es la corriente del Zener."
      - texto: "Porque la resistencia deja pasar más corriente"
        porque: "La corriente por R_{s} apenas cambia: lo que cambia es adónde va, toda al Zener."
    fijar: { V_zi: 12, R_zs: 270, z_on: 0 }
    widget:
      tipo: circuito
      esquema: zener
      piezas: { fuente: V_zi, rs: R_zs, vz: V_z, carga: R_zl, interruptor: z_on }
      lectura: { valor: I_zz, rotulo: "Corriente del Zener" }
      corriente: I_zs
      mide: { salida: V_zo, serie: I_zs, iz: I_zz, carga: I_zl }
      mandos: []
    escalera:
      - "R_{s} fija la corriente total. Sin carga, ¿por dónde tiene que pasar toda?"
    solucion: "Por el Zener: con la entrada máxima y sin carga lleva su corriente mayor, y con ella se elige su potencia."

  - id: prediga-33
    tipo: simular
    titulo: "Prediga"
    texto: "La tensión de un Zener crece con su corriente, según su r_{z}. Uno de 3,3 V con r_{z} = 30 Ω pasa de 5 a 20 mA: ¿cuánto se mueve su tensión?"
    libro: [247, 248]
    fijar: { I_q: 0.02 }
    simular:
      objetivo: d33
      unidad: V
      tol: 0.03
      rotulo: "Variación de V_{Z}"
      errores:
        - { razon: { min: 0.21, max: 0.25 }, texto: "Eso se mueve uno de 5,1 V, con r_{z} = 7 Ω. El de 3,3 V tiene 30 Ω." }
    exito: "450 mV, un 14 %: un Zener de 3,3 V es un regulador pésimo."
    escalera:
      - "ΔV = r_{z}·ΔI: multiplique 30 Ω por lo que sube la corriente."
    solucion: "30 Ω × (20 − 5) mA = 450 mV."
    comprobar:
      - { d33: 0.45, p33: 13.6 }
  - id: explore-rz
    tipo: explorar
    titulo: "La resistencia dinámica"
    texto: "La tensión de un Zener crece con su corriente, según su r_{z}. Suba la corriente a 20 mA y compare tres Zener."
    libro: [246, 247]
    inicio: { I_q: 0.005 }
    widget:
      tipo: grafica
      x: { id: i, min: 0, max: 0.025, unidad: A, rotulo: "I_{Z}" }
      y: { min: -3, max: 19, unidad: "%", rotulo: "variación de V_{Z}" }
      curvas:
        - { expr: "(i - 0.005)*30/3.3*100", color: naranja, rotulo: "3,3 V" }
        - { expr: "(i - 0.005)*7/5.1*100", color: verde, rotulo: "5,1 V" }
        - { expr: "(i - 0.005)*25/27*100", color: azul, rotulo: "27 V" }
      asas:
        - { mueve: I_q, x: "I_q", y: "p33", rotulo: "Corriente" }
      lectura: { valor: d33, rotulo: "Zener de 3,3 V" }
      datos:
        - { valor: d51, rotulo: "5,1 V: {{d51}}" }
        - { valor: d27, rotulo: "27 V: {{d27}}" }
      mandos:
        - { valor: I_q, min: 0.005, max: 0.02, paso: 0.0025, rotulo: "Corriente del Zener" }
    objetivo:
      condiciones:
        - { valor: I_q, min: 0.02, rotulo: "I_{Z} = {{I_q}}" }
      logrado: "3,3 V: {{d33}}; 5,1 V: {{d51}}; 27 V: {{d27}}. El mínimo está entre 5 y 7 V: para 3,3 V estables, uno de 5,1 o 5,6 V y un divisor."
      pistas:
        - { texto: "Más corriente." }
    escalera:
      - "r_{z} típicas: 30 Ω a 3,3 V, 7 Ω a 5,1 V y 25 Ω a 27 V."
    solucion: "A 20 mA: 450, 105 y 375 mV."
    comprobar:
      - { d33: 0 }
      - { con: { I_q: 0.02 }, d33: 0.45, d51: 0.105, d27: 0.375 }

  - id: estime-58
    tipo: simular
    fase: "Estime"
    titulo: "Diez miliamperios para el Zener"
    texto: "Un regulador de 5,1 V desde 12 V, con una carga de 20 mA, y se quiere que el Zener lleve otros 10 mA. Calcule la resistencia serie."
    libro: ["cap05#348"]
    fijar: { V_zi: 12 }
    simular:
      objetivo: R_58
      unidad: Ω
      tol: 0.03
      rotulo: "R_{s}"
      errores:
        - { razon: { min: 1.45, max: 1.55 }, texto: "Por R_{s} pasan la corriente de la carga y la del Zener: 30 mA." }
        - { razon: { min: 1.7, max: 1.78 }, texto: "R_{s} se queda con 12 − 5,1 = 6,9 V, no con los 12 V." }
    exito: "230 Ω, comercial 220 Ω. Disipa unos 0,21 W: mejor de 1/2 W."
    escalera:
      - "Por R_{s} pasan la corriente de la carga y la del Zener: 30 mA, con 6,9 V."
    solucion: "6,9 V / 30 mA = 230 Ω."
    comprobar:
      - { R_58: 230 }
  - id: pregunta-cuando-no
    tipo: pregunta
    titulo: "Cuándo sí y cuándo no"
    texto: "¿En cuál de estos casos un Zener con resistencia serie es mala elección?"
    libro: [252]
    opciones:
      - texto: "Alimentar un circuito que consume una corriente grande y variable"
        bien: true
        porque: "Lo que no va a la carga se disipa en el Zener: rendimiento pésimo. Un regulador integrado lo hace mucho mejor."
      - texto: "Fijar el umbral de un comparador"
        porque: "Es su uso ideal: una referencia de baja corriente con carga fija."
      - texto: "Proteger una entrada frente a sobretensión"
        porque: "Es un uso adecuado, como recortador o protección de entrada."
    fijar: { V_zi: 12, R_zs: 270 }
    inicio: { z_on: 1 }
    widget:
      tipo: circuito
      esquema: zener
      piezas: { fuente: V_zi, rs: R_zs, vz: V_z, carga: R_zl, interruptor: z_on }
      lectura: { valor: P_z, rotulo: "Potencia en el Zener" }
      datos:
        - { valor: P_s, rotulo: "En R_{s}: {{P_s}}" }
      corriente: I_zs
      mide: { salida: V_zo, serie: I_zs, iz: I_zz, carga: I_zl }
      mandos:
        - { valor: z_on, tipo: interruptor, rotulo: "Carga" }
    escalera:
      - "Lo que no toma la carga se disipa en el Zener. ¿Cuándo es eso mucho?"
    solucion: "Con una carga grande y variable: el rendimiento es pésimo y hace falta un regulador de verdad."

  - id: averia-regulador
    tipo: averia
    titulo: "Busque la avería"
    texto: "Este regulador de 5,1 V, con 270 Ω y una carga de 20 mA, no da su salida. Mida y diga qué pieza falla."
    libro: [242, 243, "cap05#348"]
    fijar: { V_zi: 12, R_zs: 270, z_on: 1 }
    widget:
      tipo: circuito
      esquema: zener
      piezas: { fuente: V_zi, rs: R_zs, vz: V_z, carga: R_zl, interruptor: z_on }
      mide: { salida: V_zo, serie: I_zs, iz: I_zz, carga: I_zl }
      mandos: []
    averia:
      pasos: 2
      eleccion: fija
      sospechosos:
        - { id: rs, rotulo: "R_{s}" }
        - { id: vz, rotulo: "El Zener" }
        - { id: carga, rotulo: "La carga" }
      sondas:
        - { id: salida, rotulo: "Salida", valor: V_zo }
        - { id: serie, rotulo: "Corriente por R_{s}", valor: I_zs }
        - { id: iz, rotulo: "Corriente del Zener", valor: I_zz }
      fallos:
        - { id: zener-abierto, pieza: vz, tipo: abierta, con: { V_z: 100 }, texto: "El Zener está abierto: queda un divisor de 270 Ω y la carga, y la salida sube por encima de 5,1 V." }
        - { id: rs-abierta, pieza: rs, tipo: abierta, con: { R_zs: 1000000000 }, texto: "R_{s} está abierta: no llega corriente y la salida cae a cero." }
        - { id: carga-corto, pieza: carga, tipo: corto, con: { R_zl: 0.001 }, texto: "La carga está en cortocircuito: la salida cae a cero y R_{s} lleva toda la corriente que permite." }
        - { id: zener-otro, pieza: vz, tipo: valor, con: { V_z: 3.3 }, texto: "Han montado un Zener de 3,3 V: la salida se queda en 3,3 V y el Zener lleva mucha más corriente." }
    escalera:
      - "Mida primero la salida: cero, algo más de 5,1 V o un valor menor dicen cosas distintas."
      - "Si la salida es cero, la corriente por R_{s} separa un abierto de un cortocircuito."
    solucion: "Salida alta: Zener abierto. Cero sin corriente: R_{s} abierta. Cero con corriente: carga en corto. Salida baja: Zener equivocado."
    comprobar:
      - { V_zo: 5.1, I_zs: 0.0256, tol: 0.01 }
      - { con: { V_z: 3.3 }, V_zo: 3.3 }

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [243, 246, 247, 250, 251, 252, 254]
    ideas:
      - { titulo: "R_{s} = (V_{in} − V_{Z})/(I_{Z} + I_{L}).", texto: "La resistencia absorbe el exceso; el Zener clava la salida mientras le quede su corriente mínima." }
      - { titulo: "Peor caso.", texto: "Sin carga y con la entrada máxima, toda la corriente pasa por el Zener: así se elige su potencia." }
      - { titulo: "r_{z} manda.", texto: "Mínima entre 5 y 7 V; un Zener de 3,3 V se mueve un 14 % de 5 a 20 mA." }
      - { titulo: "5,6 V.", texto: "Túnel abajo (−2 mV/°C a 3,3 V), avalancha arriba (+23 mV/°C a 27 V): a 5,6 V la deriva casi se anula. La avalancha, además, hace ruido." }
