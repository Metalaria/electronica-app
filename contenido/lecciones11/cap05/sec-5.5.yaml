# Lección 1.1 de la sección 5.5 «Tipos de Diodos y sus Aplicaciones» (cap05): rectificador de unión, Schottky (caída
# baja y sin recuperación, a cambio de fuga y poca tensión inversa), Zener y avalancha, TVS, varicap, LED (la tensión
# depende del color; el silicio no emite; el blanco es azul con fósforo), PIN y túnel, y la tabla de decisión.
# Formato: contenido/lecciones11/GUIA.md.
# 1.2.1 (autor121-fund, «aprender haciendo», GUIA §13): buscar dónde la caída pesa más, predecir el 12 %, el color
# que más corriente lleva, predecir el LED azul y el reto de 12 V; se eligen el Schottky rápido y el LED de silicio.
# El precio del Schottky, TVS, LED blanco, especialistas y la tabla de decisión quedan en los textos y el resumen.
leccion: cap05/sec-5.5

libro:
  170: "cada tecnología optimiza un parámetro distinto a costa de los demás"
  172: "Esa región es precisamente la que lo hace lento"
  173: "Es la elección para rectificar la red a 50 Hz"
  175: "no hay inyección de minoritarios"
  176: "0,4 V sobre 3,3 V ya es el 12 % del rendimiento"
  177: "la fuga inversa es mucho mayor (microamperios frente a nanoamperios)"
  180: "hacia 5,6 V se compensan"
  182: "responde en picosegundos, mucho antes que un varistor"
  184: "relaciones de 3:1 a 10:1 de capacidad son típicas"
  185: "Por eso se usan en configuración antiserie o con la señal atenuada"
  187: "de ahí que la tensión directa dependa del color"
  188: "Vf típica"
  189: "su banda prohibida es indirecta"
  190: "es un LED azul con un fósforo que convierte parte de la luz a amarillo"
  192: "se usa como conmutador y atenuador de radiofrecuencia"
  194: "Rueda libre en un convertidor"
  "cap05#6": "1,12 eV en el silicio"
  "cap05#121": "El diodo es una fuente de 0,7 V (0,3 en Schottky) cuando conduce"
  "cap05#133": "Alimentar un LED rojo de 2,0 V nominales a 20 mA desde 5 V."
  "cap05#348": "Quieres alimentar un LED azul (VF = 3,2 V, IF = 20 mA) desde una fuente de 12 V"

modelo:
  valores:
    V_k: { sim: "V_{D}", nombre: "caída del diodo", unidad: V, valor: 0.7 }
    V_o: { sim: "V_{salida}", nombre: "tensión de salida de la fuente", unidad: V, valor: 3.3 }
    V_e: { sim: "V", nombre: "tensión de la fuente", unidad: V, valor: 5 }
    R_e: { sim: "R", nombre: "resistencia del LED", unidad: Ω, valor: 150 }
    V_fe: { sim: "V_{f}", nombre: "tensión del LED", unidad: V, valor: 2 }
  calculos:
    perd: { expr: "V_k/V_o*100", sim: "pérdida", nombre: "parte del rendimiento que se lleva el diodo", unidad: "%", cifras: 2 }
    I_e: { expr: "(V_e - V_fe)/R_e", sim: "I", nombre: "corriente del LED", unidad: A }
    R_c: { expr: "(V_e - V_fe)/0.02", sim: "R", nombre: "resistencia para 20 mA", unidad: Ω }

tarjetas:
  - id: explore-schottky
    tipo: explorar
    titulo: "Lo que cuesta la caída"
    texto: "En el secundario de una fuente conmutada, la caída del diodo se resta a la salida. Busque el diodo y la salida con los que la caída se lleva más del 20 %."
    libro: [176, "cap05#121"]
    widget:
      tipo: grafica
      x: { id: v, min: 1, max: 12, unidad: V, rotulo: "V_{salida}" }
      y: { min: 0, max: 50, unidad: "%", rotulo: "pérdida" }
      curvas:
        - { expr: "0.7/v*100", color: azul, rotulo: "silicio" }
        - { expr: "0.4/v*100", color: naranja, rotulo: "Schottky" }
      asas:
        - { mueve: V_o, x: "V_o", y: "perd", rotulo: "Tensión de salida" }
      lectura: { valor: perd, rotulo: "Pérdida por la caída" }
      mandos:
        - { valor: V_k, lista: [0.4, 0.7], nombres: [Schottky, silicio], rotulo: "Diodo" }
        - { valor: V_o, lista: [3.3, 5, 12], rotulo: "Tensión de salida" }
    inicio: { V_k: 0.4, V_o: 12 }
    objetivo:
      condiciones:
        - { valor: perd, min: 20, rotulo: "Pérdida: {{perd}}" }
      logrado: "{{V_k}} sobre {{V_o}}: {{perd}}. Cuanto más baja la salida, más pesa la caída: por eso en baja tensión manda el Schottky."
      pistas:
        - { cuando: { valor: V_o, min: 5 }, texto: "Baje la tensión de salida." }
        - { texto: "Pruebe el diodo de silicio." }
    escalera:
      - "Pérdida = caída / salida."
    solucion: "Silicio con 3,3 V: 21 %."
    comprobar:
      - { perd: 3.33, tol: 0.01 }
      - { con: { V_k: 0.7, V_o: 3.3 }, perd: 21.2, tol: 0.01 }

  - id: prediga-33
    tipo: simular
    titulo: "Prediga"
    texto: "Un Schottky que cae 0,4 V en una fuente conmutada de 3,3 V. ¿Qué parte del rendimiento se lleva su caída?"
    libro: [176]
    fijar: { V_k: 0.4, V_o: 3.3 }
    simular:
      objetivo: perd
      unidad: "%"
      tol: 0.03
      rotulo: "Pérdida por la caída"
      errores:
        - { razon: { min: 1.7, max: 1.8 }, texto: "Eso sería con silicio, 0,7 V." }
    exito: "El 12 %: 0,4 V sobre 3,3 V. Con silicio, casi el doble."
    escalera:
      - "Divida la caída entre la tensión de salida."
    solucion: "0,4 V / 3,3 V: el 12 %."
    comprobar:
      - { perd: 12.1 }
  - id: porque-schottky-rapido
    tipo: porque
    titulo: "Metal en lugar de unión"
    texto: "Un Schottky une un metal con silicio tipo N y, además de caer menos, apenas tiene recuperación inversa. ¿Por qué?"
    libro: [172, 175]
    opciones:
      - texto: "No hay inyección de minoritarios: no hay carga almacenada que evacuar"
        bien: true
        porque: "La corriente la llevan solo electrones, mayoritarios a ambos lados. Solo hay que cargar la capacidad de unión."
      - texto: "Porque el metal conduce mejor"
        porque: "No es la conductividad: es que no inyecta minoritarios, así que al apagar no hay carga que retirar."
      - texto: "Porque su región de deriva es más ancha"
        porque: "Una región de deriva ancha y poco dopada es lo que hace lento al rectificador de unión."
    widget:
      tipo: figura
      figura: fig-5.16
      zonas:
        - { id: recuperacion, rotulo: "Recuperación: unión frente a Schottky", rect: [0, 0, 439, 259] }
    escalera:
      - "En un Schottky la corriente la llevan solo electrones, mayoritarios a ambos lados."
    solucion: "No inyecta minoritarios: no queda carga almacenada que evacuar al apagar."

  - id: empareje-led
    tipo: explorar
    titulo: "El color fija la tensión"
    texto: "La energía del fotón es la de la banda prohibida. Desde 5 V con 150 Ω, busque el color que más corriente lleva."
    libro: [187, 188]
    fijar: { V_e: 5, R_e: 150 }
    inicio: { V_fe: 3.2 }
    widget:
      tipo: grafica
      x: { id: v, min: 1, max: 3.5, unidad: V, rotulo: "V_{f}" }
      y: { min: 0, max: 0.03, unidad: A, rotulo: "I" }
      curvas:
        - { expr: "(V_e - v)/R_e", color: naranja, rotulo: "(5 − V_{f})/150" }
      marcas:
        - { x: "V_fe", y: "I_e", rotulo: "El LED" }
      lectura: { valor: I_e, rotulo: "Corriente del LED" }
      mandos:
        - { valor: V_fe, lista: [1.5, 2, 3, 3.2], nombres: [infrarrojo, rojo, verde, azul], rotulo: "Color del LED" }
    objetivo:
      condiciones:
        - { valor: I_e, min: 0.022, rotulo: "LED: {{I_e}}" }
      logrado: "Infrarrojo, {{V_fe}}: {{I_e}}. Menos energía por fotón, menos tensión. Infrarrojo, 1,2 – 1,5 V; rojo, 1,8 – 2,2; verde, 2,0 – 3,0; azul o blanco, 2,8 – 3,4."
      pistas:
        - { texto: "Menos energía por fotón: hacia el rojo y más allá." }
    escalera:
      - "Cuanto menor V_{f}, más tensión queda para la resistencia."
    solucion: "El infrarrojo: 23 mA."
    comprobar:
      - { I_e: 0.012 }
      - { con: { V_fe: 1.5 }, I_e: 0.0233, tol: 0.01 }
  - id: explore-led
    tipo: simular
    titulo: "Rojo y azul"
    texto: "Un LED rojo de 2,0 V lleva 20 mA desde 5 V con 150 Ω. Si se cambia por uno azul de 3,2 V, ¿qué corriente lleva?"
    libro: [187, "cap05#133", "cap05#348"]
    fijar: { V_e: 5, R_e: 150, V_fe: 3.2 }
    simular:
      objetivo: I_e
      unidad: A
      tol: 0.03
      rotulo: "Corriente del LED azul"
      errores:
        - { razon: { min: 1.6, max: 1.75 }, texto: "La tensión depende del color: al azul le queda menos sobre la resistencia." }
    exito: "12 mA: (5 − 3,2)/150. El blanco es un azul con un fósforo que pasa parte de la luz a amarillo: cae lo mismo."
    escalera:
      - "(5 − 3,2)/150 Ω."
    solucion: "1,8 V / 150 Ω = 12 mA."
    comprobar:
      - { I_e: 0.012 }
      - { con: { V_fe: 2 }, I_e: 0.02 }
  - id: reto-azul
    tipo: reto
    titulo: "Reto: el LED azul"
    texto: "Un LED azul de 3,2 V y 20 mA, desde 12 V. Elija la resistencia de la serie E12 más próxima que no pase de 20 mA."
    libro: ["cap05#348"]
    fijar: { V_e: 12, V_fe: 3.2 }
    inicio: { R_e: 220 }
    widget:
      tipo: circuito
      esquema: led
      piezas: { fuente: V_e, r: R_e, vf: V_fe }
      lectura: { valor: I_e, rotulo: "Corriente del LED" }
      datos:
        - { valor: R_c, rotulo: "Para 20 mA justos: {{R_c}}" }
      corriente: I_e
      mide: { corriente: I_e, vf: V_fe }
      mandos:
        - { valor: R_e, serie: E12, min: 100, max: 1000, rotulo: "R (E12)" }
    condiciones:
      - { valor: I_e, min: 0.018, max: 0.02, rotulo: "LED: {{I_e}}" }
    exito: "440 Ω no existe; el E12 por encima, 470 Ω, da {{I_e}}, aceptable. Disipa 0,165 W: una de 1/4 W basta."
    pistas:
      - { cuando: { valor: I_e, mayor: 0.02 }, texto: "Pasa de 20 mA: elija una resistencia mayor." }
      - { cuando: { valor: I_e, menor: 0.018 }, texto: "Se ha ido demasiado lejos: hay un valor E12 más cerca de 440 Ω." }
    escalera:
      - "La resistencia se queda con 12 − 3,2 = 8,8 V: 8,8/0,020 = 440 Ω."
    solucion: "440 Ω no está en la E12: el valor inmediatamente por encima, 470 Ω, no pasa de 20 mA."
    comprobar:
      - { con: { R_e: 470 }, I_e: 0.0187 }
      - { R_c: 440 }

  - id: porque-silicio-led
    tipo: porque
    titulo: "No hay LED de silicio"
    texto: "Los LED se fabrican con arseniuro o nitruro de galio. ¿Por qué no con silicio, que es mucho más barato?"
    libro: [189, "cap05#6"]
    opciones:
      - texto: "Su banda prohibida es indirecta: la recombinación da calor, no luz"
        bien: true
        porque: "La energía se va en vibración de la red. Por eso los LED se hacen con compuestos III-V."
      - texto: "Porque el silicio no conduce en directa"
        porque: "Conduce perfectamente; lo que no hace es emitir la energía de la recombinación como fotón."
      - texto: "Porque su banda prohibida es demasiado pequeña"
        porque: "1,12 eV daría infrarrojo; el problema es que es indirecta, no su tamaño."
    fijar: { V_e: 5, R_e: 150 }
    inicio: { V_fe: 2 }
    widget:
      tipo: circuito
      esquema: led
      piezas: { fuente: V_e, r: R_e, vf: V_fe }
      lectura: { valor: I_e, rotulo: "Corriente del LED" }
      corriente: I_e
      mide: { corriente: I_e, vf: V_fe }
      mandos:
        - { valor: V_fe, lista: [2, 3.2], nombres: [rojo, azul], rotulo: "Color del LED" }
    escalera:
      - "En el silicio, ¿adónde va la energía cuando un electrón se recombina con un hueco?"
    solucion: "A vibración de la red, calor: su banda prohibida es indirecta y no emite luz."

  # 1.3 (motor13b, GUIA §13.14): el LED azul del reto, montado en la protoboard sin guía
  - id: monte-azul
    tipo: montar
    titulo: "Monte el LED azul"
    texto: "Monte el LED azul con su resistencia de 470 Ω, mirando el esquema. Ojo: la pata larga del LED es el ánodo."
    libro: ["cap05#348"]
    fijar: { V_e: 12, V_fe: 3.2, R_e: 470 }
    widget:
      tipo: circuito
      esquema: led
      piezas: { fuente: V_e, r: R_e, vf: V_fe }
      lectura: { valor: I_e, rotulo: "Corriente del LED" }
      corriente: I_e
      mide: { corriente: I_e, vf: V_fe }
      mandos: []
    montar:
      ayuda: libre
      medir: { entre: [an, "0"], valor: V_fe, tol: 0.05, rotulo: "Tensión del LED" }
      porque:
        an: "Entre la resistencia y el LED hay un nudo: la pata de la resistencia y la pata larga del LED, en la misma tira."
    exito: "El LED azul lleva {{I_e}}: la resistencia de 470 Ω se queda con lo que el LED no cae."
    escalera:
      - "La resistencia va del carril + a una tira; en esa tira, la pata larga del LED; la corta, al carril −."
    solucion: "R del carril + a una tira; el ánodo (pata larga) del LED en esa tira y el cátodo en el carril −."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [170, 173, 175, 177, 180, 182, 184, 185, 187, 189, 190, 192, 194]
    ideas:
      - { titulo: "Unión de silicio.", texto: "Tensión y corriente altas, pero lento: para la red de 50 Hz, el 1N4007." }
      - { titulo: "Schottky.", texto: "Cae menos y no tiene recuperación: el de rueda libre en un convertidor. A cambio, fuga microamperios y aguanta poca tensión inversa." }
      - { titulo: "Especialistas.", texto: "Zener y TVS en ruptura (el TVS, en picosegundos); el varicap, de 3:1 a 10:1 de capacidad; el PIN, una resistencia controlable." }
      - { titulo: "LED.", texto: "La tensión depende del color; el blanco es azul con fósforo. El silicio no emite: su banda prohibida es indirecta." }
