# Lección 1.1 de la sección 5.1 «El Semiconductor: Silicio Intrínseco y Dopaje» (cap05): bandas de energía, el
# silicio puro casi no conduce, el dopaje (donadores y aceptores) cambia seis órdenes de magnitud, huecos con su
# movilidad, mayoritarios y minoritarios (n·p = nᵢ²), arrastre y difusión, y lo que el dopaje no puede hacer solo.
# Formato: contenido/lecciones11/GUIA.md.
leccion: cap05/sec-5.1

libro:
  6: "1,12 eV en el silicio, 0,67 en el germanio"
  7: "Un semiconductor, sí."
  10: "Silicio intrínseco (300 K)"
  11: "son uno por cada cinco billones de átomos"
  12: "esa población depende exponencialmente de la temperatura"
  14: "Cada impureza donadora aporta, por tanto, un electrón libre"
  15: "la resistividad cae de 320 000 a 0,52 Ω·cm"
  16: "El boro (tres electrones de valencia) hace lo contrario"
  18: "unos 500 cm²/V·s frente a los 1 450 de los electrones"
  19: "es más lento y tiene menos ganancia que un NPN equivalente"
  21: "La ley de acción de masas relaciona ambas poblaciones"
  22: 'n dot.op p = n_(i)^("2")'
  23: "Los mayoritarios explican la conducción; los minoritarios, el dispositivo."
  24: "y por eso conmutan mucho más deprisa"
  27: "una velocidad media proporcional al campo"
  28: "Un gradiente de concentración produce un flujo de donde hay más a donde hay menos"
  29: "Ambos coeficientes están ligados por la relación de Einstein"
  31: "pero simétrica: conduce igual en los dos sentidos"
  33: "se dobla cada 10 °C, y en 60 °C se multiplica por 64"

modelo:
  valores:
    N_D: { sim: "N_{D}", nombre: "concentración de donadores", unidad: "cm⁻³", valor: 1e10 }
    n_i: { sim: "n_{i}", nombre: "concentración intrínseca del silicio", unidad: "cm⁻³", valor: 1e10 }
    d_T: { sim: "ΔT", nombre: "calentamiento", unidad: "°C", valor: 0 }
    E_f: { sim: "E", nombre: "campo eléctrico", unidad: "V/cm", valor: 100 }
  calculos:
    n_e: { expr: "max(N_D, n_i)", sim: "n", nombre: "electrones libres", unidad: "cm⁻³" }
    p_h: { expr: "n_i^2/n_e", sim: "p", nombre: "huecos", unidad: "cm⁻³" }
    n_p: { expr: "n_e*p_h", sim: "n·p", nombre: "producto de las dos poblaciones", unidad: "cm⁻⁶" }
    veces: { expr: "n_e/n_i", sim: "n/n_{i}", nombre: "veces más electrones que en el silicio puro", unidad: "" }
    fuga: { expr: "2^(d_T/10)", sim: "×", nombre: "veces la fuga inicial", unidad: "", cifras: 2, recortar: true }
    v_n: { expr: "1450*E_f", sim: "v_{n}", nombre: "velocidad media de los electrones", unidad: "cm/s" }
    v_p: { expr: "500*E_f", sim: "v_{p}", nombre: "velocidad media de los huecos", unidad: "cm/s" }

tarjetas:
  - id: explore-dopaje
    tipo: explorar
    titulo: "Una impureza lo cambia todo"
    texto: "El silicio puro tiene 10¹⁰ electrones libres por cm³. Añada fósforo, N_{D}, y mire las dos poblaciones: electrones y huecos."
    libro: [10, 11, 14]
    widget:
      tipo: grafica
      x: { id: x, min: 1e10, max: 1e19, unidad: "cm⁻³", rotulo: "N_{D}", escala: log }
      y: { min: 1, max: 1e20, unidad: "cm⁻³", rotulo: "concentración", escala: log }
      curvas:
        - { expr: "max(x, n_i)", color: azul, rotulo: "electrones, n" }
        - { expr: "n_i^2/max(x, n_i)", color: naranja, rotulo: "huecos, p" }
      asas:
        - { mueve: N_D, x: "N_D", y: "n_e", rotulo: "Dopaje" }
      lectura: { valor: n_e, rotulo: "Electrones libres" }
      datos:
        - { valor: p_h, rotulo: "Huecos: {{p_h}}" }
      mandos:
        - { valor: N_D, lista: [1e10, 1e12, 1e14, 1e16, 1e18, 1e19], rotulo: "Donadores, N_{D}" }
    requiere: { mover: [N_D] }

  - id: prediga-millon
    tipo: predecir
    titulo: "Prediga"
    texto: "Al silicio de 320 000 Ω·cm se le añaden 10¹⁶ cm⁻³ de fósforo: una impureza por cada cinco millones de átomos. ¿Qué resistividad queda?"
    libro: [15]
    fijar: { N_D: 1e16 }
    widget:
      tipo: grafica
      x: { id: x, min: 1e10, max: 1e19, unidad: "cm⁻³", rotulo: "N_{D}", escala: log }
      y: { min: 1, max: 1e20, unidad: "cm⁻³", rotulo: "concentración", escala: log }
      curvas:
        - { expr: "max(x, n_i)", color: azul, rotulo: "electrones, n" }
      lectura: { valor: veces, rotulo: "Veces más electrones" }
      ocultar: true
    opciones:
      - texto: "0,52 Ω·cm"
        bien: true
        porque: "Los portadores pasan de 10¹⁰ a 10¹⁶: un millón de veces más. Seis órdenes de magnitud con una impureza inapreciable."
      - texto: "Casi lo mismo"
        porque: "Es poca impureza, pero cada átomo de fósforo aporta un electrón libre, y el silicio puro casi no tiene."
      - texto: "La mitad"
        porque: "No es un retoque: los electrones libres se multiplican por un millón."
    comprobar:
      - { veces: 1000000 }
    escalera:
      - "Los portadores libres pasan de 10¹⁰ a 10¹⁶ cm⁻³."
    solucion: "Un millón de veces más portadores: de 320 000 a 0,52 Ω·cm."

  - id: empareje-bandas
    tipo: pregunta
    fase: "Empareje"
    titulo: "La banda prohibida"
    texto: "Lo que separa conductor, semiconductor y aislante es la banda prohibida. Empareje cada material con la suya."
    libro: [6]
    emparejar:
      - ["Metal", "Las bandas se solapan: no hay banda prohibida"]
      - ["Germanio", "0,67 eV"]
      - ["Silicio", "1,12 eV"]
      - ["Diamante", "5 eV o más"]
    exito: "Eso es. La del silicio es bastante para que casi no haya electrones libres y poca para poder gobernarlo."
    pistas:
      - { texto: "El aislante tiene la banda más ancha; el metal, ninguna. El germanio va por debajo del silicio." }
    escalera:
      - "El aislante tiene la banda más ancha; el metal, ninguna. El germanio va por debajo del silicio."
    solucion: "Metal: sin banda prohibida. Germanio: 0,67 eV. Silicio: 1,12 eV. Diamante: 5 eV o más."

  - id: porque-semiconductor
    tipo: porque
    titulo: "¿Por qué un semiconductor?"
    texto: "El cobre conduce muchísimo mejor que el silicio. ¿Por qué la electrónica se hace con silicio?"
    libro: [7, 15]
    opciones:
      - texto: "Porque su conductividad se puede fijar desde fuera, dopándolo"
        bien: true
        porque: "Un conductor no se puede hacer menos conductor a voluntad, ni un aislante conductor. Un semiconductor, sí."
      - texto: "Porque conduce poco y así gasta menos"
        porque: "Conducir poco no sirve de nada por sí solo: lo valioso es poder gobernar cuánto conduce."
      - texto: "Porque es más barato que el cobre"
        porque: "No es el precio: es que su conductividad se controla con el dopaje, seis órdenes de magnitud."
    widget:
      tipo: grafica
      x: { id: x, min: 1e10, max: 1e19, unidad: "cm⁻³", rotulo: "N_{D}", escala: log }
      y: { min: 1, max: 1e20, unidad: "cm⁻³", rotulo: "concentración", escala: log }
      curvas:
        - { expr: "max(x, n_i)", color: azul, rotulo: "electrones, n" }
        - { expr: "n_i^2/max(x, n_i)", color: naranja, rotulo: "huecos, p" }
      lectura: { valor: n_e, rotulo: "Electrones libres" }
      mandos:
        - { valor: N_D, lista: [1e10, 1e12, 1e14, 1e16, 1e18, 1e19], rotulo: "Donadores, N_{D}" }
    escalera:
      - "Mueva el dopaje: ¿se puede hacer lo mismo con un trozo de cobre?"
    solucion: "No: la conductividad del silicio se fija desde fuera con el dopaje; la de un conductor, no."

  - id: pregunta-boro
    tipo: pregunta
    titulo: "El boro"
    texto: "El fósforo, con cinco electrones de valencia, aporta un electrón libre. ¿Qué deja en la red el boro, que tiene tres?"
    libro: [14, 16]
    opciones:
      - texto: "Un enlace incompleto: un hueco"
        bien: true
        porque: "Un electrón vecino salta a él y el hueco aparece donde estaba: se mueve en sentido contrario a los electrones."
      - texto: "Un electrón libre, como el fósforo"
        porque: "Eso hace el fósforo, con un electrón de sobra. Al boro le falta uno."
      - texto: "Nada: con tres electrones no se enlaza"
        porque: "Se enlaza con tres vecinos y deja el cuarto enlace sin completar: eso es el hueco."
    widget:
      tipo: figura
      figura: fig-5.3
      zonas:
        - { id: escala, rotulo: "La escala del dopaje", rect: [0, 0, 438, 169] }
    escalera:
      - "El silicio forma cuatro enlaces. ¿Cuántos puede completar el boro?"
    solucion: "Tres: deja un enlace incompleto, un hueco, que se mueve al revés que los electrones."

  - id: prediga-huecos
    tipo: predecir
    titulo: "Prediga"
    texto: "En silicio tipo N con n = 10¹⁶ cm⁻³ (el puro tiene n_{i} = 10¹⁰ cm⁻³), los huecos no desaparecen: se siguen generando. ¿Cuántos quedan?"
    libro: [21, 23]
    fijar: { N_D: 1e16 }
    widget:
      tipo: grafica
      x: { id: x, min: 1e10, max: 1e19, unidad: "cm⁻³", rotulo: "N_{D}", escala: log }
      y: { min: 1, max: 1e20, unidad: "cm⁻³", rotulo: "concentración", escala: log }
      curvas:
        - { expr: "max(x, n_i)", color: azul, rotulo: "electrones, n" }
        - { expr: "n_i^2/max(x, n_i)", color: naranja, rotulo: "huecos, p" }
      lectura: { valor: p_h, rotulo: "Huecos" }
      ocultar: true
    opciones:
      - texto: "10⁴ cm⁻³"
        bien: true
        porque: "Un billón de veces menos que los electrones: cuantos más mayoritarios, menos minoritarios."
      - texto: "10¹⁰ cm⁻³, como en el silicio puro"
        porque: "Los electrones de más se recombinan con los huecos: la población de huecos baja."
      - texto: "Ninguno"
        porque: "La agitación térmica los sigue generando, en cantidad ínfima pero no nula."
    comprobar:
      - { p_h: 10000 }
    escalera:
      - "n·p = nᵢ²: divida (10¹⁰)² entre 10¹⁶."
    solucion: "p = 10²⁰ / 10¹⁶ = 10⁴ cm⁻³."

  - id: formula-masas
    tipo: formula
    titulo: "La ley de acción de masas"
    texto: "Mueva el dopaje: los electrones suben y los huecos bajan en la misma proporción. El producto no cambia."
    libro: [21, 22]
    ec: 22
    sustitucion: "{{n_e}} · {{p_h}} = {{n_p}}"
    widget:
      tipo: grafica
      x: { id: x, min: 1e10, max: 1e19, unidad: "cm⁻³", rotulo: "N_{D}", escala: log }
      y: { min: 1, max: 1e20, unidad: "cm⁻³", rotulo: "concentración", escala: log }
      curvas:
        - { expr: "max(x, n_i)", color: azul, rotulo: "electrones, n" }
        - { expr: "n_i^2/max(x, n_i)", color: naranja, rotulo: "huecos, p" }
      asas:
        - { mueve: N_D, x: "N_D", y: "p_h", rotulo: "Huecos" }
      lectura: { valor: n_p, rotulo: "n · p" }
      mandos:
        - { valor: N_D, lista: [1e10, 1e12, 1e14, 1e16, 1e18, 1e19], rotulo: "Donadores, N_{D}" }

  - id: pregunta-minoritarios
    tipo: pregunta
    titulo: "¿Quién manda?"
    texto: "Los huecos de un material N son un billón de veces menos que los electrones. ¿De cuál de las dos poblaciones depende la fuga de un diodo?"
    libro: [23]
    opciones:
      - texto: "De los minoritarios, los huecos"
        bien: true
        porque: "La fuga, la recuperación inversa y la deriva térmica dependen de ellos. Los mayoritarios explican la conducción; los minoritarios, el dispositivo."
      - texto: "De los mayoritarios, los electrones"
        porque: "Ellos dan la conducción, pero el comportamiento fino, la fuga incluida, depende de los minoritarios."
      - texto: "De ninguna: la fuga es del encapsulado"
        porque: "La fuga es la parte intrínseca del silicio que no se ha podido eliminar: portadores minoritarios generados por el calor."
    fijar: { N_D: 1e16 }
    widget:
      tipo: grafica
      x: { id: x, min: 1e10, max: 1e19, unidad: "cm⁻³", rotulo: "N_{D}", escala: log }
      y: { min: 1, max: 1e20, unidad: "cm⁻³", rotulo: "concentración", escala: log }
      curvas:
        - { expr: "max(x, n_i)", color: azul, rotulo: "electrones, n" }
        - { expr: "n_i^2/max(x, n_i)", color: naranja, rotulo: "huecos, p" }
      lectura: { valor: p_h, rotulo: "Huecos" }
      mandos: []
    escalera:
      - "Los mayoritarios explican la conducción. ¿Y el comportamiento fino del dispositivo?"
    solucion: "De los minoritarios: la fuga, la recuperación inversa y la deriva térmica dependen de ellos."

  - id: sorpresa-calor
    tipo: sorpresa
    titulo: "Caliéntelo"
    texto: "La población intrínseca depende exponencialmente de la temperatura. Caliente un diodo con el secador y mire su fuga inversa."
    nota: "Por eso un dispositivo que dependiera de los portadores intrínsecos sería inservible."
    libro: [12, 33]
    inicio: { d_T: 0 }
    widget:
      tipo: grafica
      x: { id: x, min: 0, max: 60, unidad: "°C", rotulo: "ΔT" }
      y: { min: 0, max: 70, unidad: "", rotulo: "fuga relativa" }
      curvas:
        - { expr: "2^(x/10)", color: naranja, rotulo: "fuga" }
      asas:
        - { mueve: d_T, x: "d_T", y: "fuga", rotulo: "Calentamiento" }
      lectura: { valor: fuga, rotulo: "Veces la fuga inicial" }
      mandos:
        - { valor: d_T, min: 0, max: 60, paso: 10, rotulo: "Calentamiento, ΔT" }
    requiere: { mover: [d_T] }
    comprobar:
      - { con: { d_T: 60 }, fuga: 64 }

  - id: pregunta-pnp
    tipo: pregunta
    titulo: "Huecos más lentos"
    texto: "Los huecos del silicio tienen una movilidad de unos 500 cm²/V·s; los electrones, 1 450. ¿Qué transistor es más lento?"
    libro: [18, 19]
    opciones:
      - texto: "El PNP, que conduce con huecos"
        bien: true
        porque: "Casi tres veces menos movilidad: un PNP es más lento y tiene menos ganancia que su NPN equivalente."
      - texto: "El NPN, que conduce con electrones"
        porque: "Los electrones tienen casi tres veces más movilidad: el NPN es el rápido."
      - texto: "Iguales: el hueco no es una partícula real"
        porque: "El hueco tiene su propia movilidad, y esa diferencia física se nota en todo el libro."
    widget:
      tipo: grafica
      x: { id: e, min: 0, max: 1000, unidad: "V/cm", rotulo: "E" }
      y: { min: 0, max: 1500000, unidad: "cm/s", rotulo: "velocidad media" }
      curvas:
        - { expr: "1450*e", color: azul, rotulo: "electrones" }
        - { expr: "500*e", color: naranja, rotulo: "huecos" }
      lectura: { valor: v_p, rotulo: "Velocidad de los huecos" }
      datos:
        - { valor: v_n, rotulo: "Electrones: {{v_n}}" }
      mandos:
        - { valor: E_f, lista: [100, 500, 1000], rotulo: "Campo, E" }
    escalera:
      - "Con el mismo campo, la velocidad media es proporcional a la movilidad."
    solucion: "El PNP: sus huecos van casi tres veces más despacio que los electrones del NPN."

  - id: empareje-transporte
    tipo: pregunta
    fase: "Empareje"
    titulo: "Dos formas de moverse"
    texto: "Los portadores se mueven por dos causas. Empareje cada una con lo que la define."
    libro: [27, 28, 29]
    emparejar:
      - ["Arrastre", "Un campo eléctrico: velocidad media proporcional al campo"]
      - ["Difusión", "Un gradiente: de donde hay más a donde hay menos"]
      - ["Relación de Einstein", "Liga los dos coeficientes con V_{T}"]
    exito: "Eso es. Son la misma agitación térmica vista de dos maneras; por eso V_{T} aparece en la ecuación del diodo."
    pistas:
      - { texto: "La difusión no necesita campo; el arrastre, sí." }
    escalera:
      - "La difusión no necesita campo; el arrastre, sí."
    solucion: "Arrastre: un campo. Difusión: un gradiente. Relación de Einstein: liga los dos coeficientes con V_{T}."

  - id: porque-asimetria
    tipo: porque
    titulo: "Lo que el dopaje no da"
    texto: "Un trozo de silicio N es una resistencia excelente y controlable. ¿Por qué no sirve, solo, para rectificar?"
    libro: [31]
    opciones:
      - texto: "Conduce igual en los dos sentidos: falta una asimetría"
        bien: true
        porque: "Ningún material homogéneo distingue un sentido del otro. Lo hace la frontera entre dos dopajes distintos: la unión."
      - texto: "Tiene demasiada resistencia"
        porque: "Su resistencia se fija con el dopaje donde se quiera. El problema es que es simétrica."
      - texto: "Le faltan huecos"
        porque: "Un material P, con huecos, tampoco rectifica solo: también conduce igual en los dos sentidos."
    widget:
      tipo: figura
      figura: fig-5.5
      zonas:
        - { id: union, rotulo: "La unión P-N y su zona de agotamiento", rect: [0, 0, 222, 184] }
    escalera:
      - "Un material homogéneo, ¿cómo distinguiría un sentido del otro?"
    solucion: "No puede: conduce igual en los dos sentidos. La asimetría la da la frontera entre dos dopajes, la unión."

  - id: pregunta-unipolares
    tipo: pregunta
    titulo: "Bipolares y unipolares"
    texto: "Un diodo de unión funciona inyectando minoritarios; un Schottky o un MOSFET, solo con mayoritarios. ¿Cuál conmuta más deprisa?"
    libro: [24]
    opciones:
      - texto: "Los unipolares, Schottky y MOSFET"
        bien: true
        porque: "Los bipolares almacenan la carga de minoritarios y tardan en apagar; los unipolares no tienen esa carga."
      - texto: "Los bipolares, diodo de unión y BJT"
        porque: "Al contrario: la carga de minoritarios inyectados hay que evacuarla al apagar, y eso los hace lentos."
      - texto: "Igual: depende solo del tamaño"
        porque: "Depende del mecanismo: inyectar minoritarios obliga a evacuarlos después."
    widget:
      tipo: figura
      figura: fig-5.16
      zonas:
        - { id: recuperacion, rotulo: "La corriente que sigue al apagar", rect: [0, 0, 439, 259] }
    escalera:
      - "Los minoritarios inyectados hay que evacuarlos al apagar. ¿Quién no los tiene?"
    solucion: "Los unipolares, Schottky y MOSFET: sin carga de minoritarios que evacuar, conmutan mucho más deprisa."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [7, 15, 22, 23, 31]
    ideas:
      - { titulo: "Gobernable.", texto: "La banda prohibida del silicio, 1,12 eV, deja pocos portadores libres y permite fijar su conductividad desde fuera." }
      - { titulo: "Dopaje.", texto: "Una impureza por millones de átomos multiplica los portadores por un millón: el fósforo da electrones; el boro, huecos." }
      - { titulo: "n · p = nᵢ².", texto: "Los mayoritarios explican la conducción; los minoritarios, ínfimos, la fuga, la recuperación y la deriva." }
      - { titulo: "Falta la unión.", texto: "Un material dopado es simétrico: la asimetría la da la frontera entre dos dopajes." }
