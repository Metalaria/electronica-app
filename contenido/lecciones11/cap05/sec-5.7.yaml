# Lección 1.1 de la sección 5.7 «Recuperación Inversa y Conmutación» (cap05): el diodo que conduce al revés tras
# apagarse (carga almacenada, Q_rr, I_RM, suavidad), los tiempos de cada tecnología, la pérdida ½·V·I_RM·t_rr·f
# frente a la frecuencia, por qué el Schottky no la sufre y dónde muerde en la práctica. Formato:
# contenido/lecciones11/GUIA.md.
# 1.2.1 (autor121-fund, «aprender haciendo», GUIA §13): subir la frecuencia hasta perder un vatio, predecir los
# 20 W a 100 kHz, marcar dónde se pierde un vatio, calcular el ultrarrápido y sustituir el diodo; se eligen por qué
# conduce al revés y por qué el Schottky no lo sufre. Tiempos, suavidad, dónde muerde y el osciloscopio quedan en los
# textos y el resumen.
leccion: cap05/sec-5.7

libro:
  224: "durante un tiempo trr conduce en sentido inverso"
  225: "La causa es la carga almacenada"
  226: "un corte abrupto excita la inductancia parásita del circuito"
  228: "trr típico"
  229: "La pérdida por recuperación es aproximadamente ½·V·IRM·trr por conmutación"
  230: "Pérdida (100 V, IRM = 2 A)"
  231: "Poner un 1N4007 en una fuente conmutada es el error de sustitución más caro que existe"
  233: "no hay minoritarios inyectados, luego no hay carga que evacuar"
  235: "Es la razón de los tiempos muertos"
  236: "La cura clásica son condensadores de 10 nF en paralelo con cada diodo del puente"
  237: "su carga se suma a la corriente del transistor"
  239: "su anchura es trr"
  "cap05#348": "su trr es casi nulo y conmuta limpio"

modelo:
  valores:
    V_c: { sim: "V", nombre: "tensión que bloquea", unidad: V, valor: 100 }
    I_c: { sim: "I_{RM}", nombre: "pico de corriente inversa", unidad: A, valor: 2 }
    t_rr: { sim: "t_{rr}", nombre: "tiempo de recuperación inversa", unidad: s, valor: 2e-6 }
    f_c: { sim: "f", nombre: "frecuencia de conmutación", unidad: Hz, valor: 50 }
  calculos:
    P_rr: { expr: "0.5*V_c*I_c*t_rr*f_c", sim: "P", nombre: "pérdida por recuperación", unidad: W }
    E_rr: { expr: "0.5*V_c*I_c*t_rr", sim: "E", nombre: "energía perdida en cada conmutación", unidad: J }
    T_c: { expr: "1/f_c", sim: "T", nombre: "periodo de conmutación", unidad: s }
    f_1: { expr: "1/(0.5*V_c*I_c*t_rr)", sim: "f_{1 W}", nombre: "frecuencia a la que pierde un vatio", unidad: Hz }

tarjetas:
  - id: explore-frecuencia
    tipo: explorar
    titulo: "Cada conmutación cuesta"
    texto: "Un 1N4007, t_{rr} = 2 µs, bloquea 100 V con 2 A de pico inverso y en cada apagado pierde ½·V·I_{RM}·t_{rr}. Suba la frecuencia hasta que pierda más de un vatio."
    libro: [229, 230]
    fijar: { t_rr: 2e-6 }
    inicio: { f_c: 50 }
    widget:
      tipo: grafica
      x: { id: x, min: 30, max: 600000, unidad: Hz, rotulo: "f", escala: log }
      y: { min: 0.000001, max: 300, unidad: W, rotulo: "pérdida", escala: log }
      curvas:
        - { expr: "0.5*V_c*I_c*t_rr*x", color: naranja, rotulo: "1N4007" }
      asas:
        - { mueve: f_c, x: "f_c", y: "P_rr", rotulo: "Frecuencia" }
      lectura: { valor: P_rr, rotulo: "Pérdida por recuperación" }
      datos:
        - { valor: E_rr, rotulo: "Por conmutación: {{E_rr}}" }
      mandos:
        - { valor: f_c, lista: [50, 1000, 10000, 100000], rotulo: "Frecuencia de conmutación" }
    objetivo:
      condiciones:
        - { valor: P_rr, min: 1, rotulo: "Pérdida: {{P_rr}}" }
      logrado: "A {{f_c}}, {{P_rr}}: pierde lo mismo en cada conmutación, {{E_rr}}, y la pérdida crece con la frecuencia."
      pistas:
        - { texto: "Más frecuencia." }
    escalera:
      - "Pérdida = energía por conmutación × frecuencia."
    solucion: "A 10 kHz: 2 W."
    comprobar:
      - { P_rr: 0.01, E_rr: 0.0002 }
      - { con: { f_c: 10000 }, P_rr: 2 }

  - id: prediga-100k
    tipo: simular
    titulo: "Prediga"
    texto: "Un 1N4007 (t_{rr} = 2 µs, 100 V, 2 A de pico inverso) pierde 10 mW a 50 Hz. ¿Cuánto pierde en una conmutada de 100 kHz?"
    libro: [230]
    fijar: { t_rr: 2e-6, f_c: 100000 }
    simular:
      objetivo: P_rr
      unidad: W
      tol: 0.03
      rotulo: "Pérdida a 100 kHz"
      errores:
        - { razon: { min: 0.0004, max: 0.0006 }, texto: "Pierde lo mismo en cada conmutación, pero a 100 kHz conmuta dos mil veces más a menudo." }
    exito: "20 W: se destruye en segundos. Su t_{rr} de 2 µs es ya una buena parte del periodo de 10 µs."
    escalera:
      - "Pierde lo mismo en cada conmutación: ¿cuántas veces más conmuta a 100 kHz que a 50 Hz?"
    solucion: "10 mW × 2000 = 20 W."
    comprobar:
      - { P_rr: 20, T_c: 10e-6 }
  - id: marque-vatio
    tipo: marcar
    titulo: "¿Hasta dónde sirve?"
    texto: "La recta es la pérdida del 1N4007 frente a la frecuencia. Marque la frecuencia a la que ya pierde un vatio."
    libro: [229, 230]
    fijar: { t_rr: 2e-6 }
    widget:
      tipo: grafica
      x: { id: x, min: 30, max: 600000, unidad: Hz, rotulo: "f", escala: log }
      y: { min: 0.000001, max: 300, unidad: W, rotulo: "pérdida", escala: log }
      curvas:
        - { expr: "0.5*V_c*I_c*t_rr*x", color: naranja, rotulo: "1N4007" }
    marcar:
      modo: x
      curva: 0
      x: "f_1"
      tol: 0.1
      inicio: { x: 100, y: 1 }
      rotulo: "Un vatio"
    pistas:
      - { cuando: { valor: marca_x, mayor: 5000 }, texto: "Más a la izquierda: ahí ya pierde más." }
      - { texto: "Más a la derecha: ahí pierde menos de un vatio." }
    exito: "Hacia los 5 kHz. Perfecto a 50 Hz, nada más: en una conmutada se usa un ultrarrápido o un Schottky."
    escalera:
      - "Busque en la recta el punto de 1 W."
    solucion: "A 5 kHz."
    comprobar:
      - { f_1: 5000 }
  - id: estime-ultrarrapido
    tipo: simular
    titulo: "Un ultrarrápido"
    texto: "Un ultrarrápido de t_{rr} = 35 ns, en una conmutada de 100 kHz, bloquea 100 V con 2 A de pico inverso. ¿Cuánto pierde por recuperación?"
    libro: [229, 230]
    fijar: { t_rr: 35e-9, f_c: 100000 }
    widget:
      tipo: grafica
      x: { id: x, min: 30, max: 600000, unidad: Hz, rotulo: "f", escala: log }
      y: { min: 0.000001, max: 300, unidad: W, rotulo: "pérdida", escala: log }
      curvas:
        - { expr: "0.5*V_c*I_c*35e-9*x", color: azul, rotulo: "ultrarrápido" }
      marcas:
        - { x: "f_c", y: "P_rr", rotulo: "100 kHz" }
      ocultar: curvas
    simular:
      objetivo: P_rr
      unidad: W
      tol: 0.03
      rotulo: "Pérdida por recuperación, P"
      errores:
        - { expr: "E_rr", texto: "Esa es la energía de una sola conmutación, en julios: multiplíquela por las cien mil conmutaciones de cada segundo." }
        - { expr: "V_c*I_c*t_rr*f_c", texto: "Ha olvidado el ½: la pérdida es ½·V·I_{RM}·t_{rr} por cada conmutación." }
    exito: "350 mW frente a 20 W: es la diferencia entre un diodo que funciona y uno que se destruye."
    escalera:
      - "Cada apagado pierde ½·V·I_{RM}·t_{rr}; multiplíquelo por la frecuencia."
    solucion: "½ × 100 × 2 × 35 ns = 3,5 µJ por conmutación, por 100 000 cada segundo: 350 mW."
    comprobar:
      - { E_rr: 3.5e-6, P_rr: 0.35 }

  - id: sorpresa-sustitucion
    tipo: sorpresa
    titulo: "El error de sustitución más caro"
    texto: "En una conmutada de 100 kHz, sustituya el ultrarrápido por un rectificador estándar, que parece equivalente en tensión y corriente."
    libro: [230, 231]
    fijar: { f_c: 100000 }
    inicio: { t_rr: 35e-9 }
    widget:
      tipo: grafica
      x: { id: x, min: 30, max: 600000, unidad: Hz, rotulo: "f", escala: log }
      y: { min: 0.000001, max: 300, unidad: W, rotulo: "pérdida", escala: log }
      curvas:
        - { expr: "0.5*V_c*I_c*2e-6*x", color: naranja, rotulo: "1N4007" }
        - { expr: "0.5*V_c*I_c*35e-9*x", color: azul, rotulo: "ultrarrápido" }
      lectura: { valor: P_rr, rotulo: "Pérdida por recuperación" }
      mandos:
        - { valor: t_rr, lista: [35e-9, 2e-6], nombres: [ultrarrápido, rectificador estándar], rotulo: "Diodo" }
    objetivo:
      condiciones:
        - { valor: P_rr, min: 10, rotulo: "Pérdida: {{P_rr}}" }
      logrado: "{{P_rr}} frente a 350 mW: es el error de sustitución más caro que existe. 1N4007, 2 – 30 µs; ultrarrápido, 25 – 75 ns; 1N4148, 4 ns."
      pistas:
        - { texto: "Elija el rectificador estándar." }
    escalera:
      - "Pruebe el rectificador estándar."
    solucion: "Con el 1N4007, 20 W."
    comprobar:
      - { P_rr: 0.35 }
      - { con: { t_rr: 2e-6 }, P_rr: 20 }

  - id: porque-al-reves
    tipo: porque
    titulo: "Conduce después de apagarse"
    texto: "Al invertir la tensión, un diodo de unión sigue conduciendo al revés durante t_{rr}, con una corriente que puede superar la directa. ¿Por qué?"
    libro: [224, 225]
    opciones:
      - texto: "Hay que evacuar los minoritarios almacenados antes de formar la zona de agotamiento"
        bien: true
        porque: "La carga Q_{rr} es proporcional a la corriente directa que circulaba y a la vida media de los minoritarios."
      - texto: "Por la capacidad de la unión"
        porque: "Esa es la única que tiene un Schottky, y es pequeña. En el de unión manda la carga de minoritarios."
      - texto: "Porque el diodo está averiado"
        porque: "Lo hace todo diodo de unión sano: es la física de la carga almacenada."
    widget:
      tipo: figura
      figura: fig-5.16
      zonas:
        - { id: recuperacion, rotulo: "La corriente que sigue al invertir", rect: [0, 0, 439, 259] }
    escalera:
      - "En directa, el diodo de unión inyecta minoritarios. ¿Qué hay que hacer con ellos antes de bloquear?"
    solucion: "Evacuarlos: hasta que no salen no se forma la zona de agotamiento, y mientras tanto conduce al revés."

  - id: porque-schottky
    tipo: porque
    titulo: "El Schottky no lo sufre"
    texto: "En la misma conmutada de 100 kHz, un Schottky funciona sin calentarse. ¿Por qué?"
    libro: [233, "cap05#348"]
    opciones:
      - texto: "Lo llevan mayoritarios: no hay carga de minoritarios que evacuar"
        bien: true
        porque: "Solo hay que cargar la capacidad de la unión, pequeña y que no depende de la corriente previa."
      - texto: "Porque cae menos tensión en directa"
        porque: "Eso reduce la pérdida de conducción. La de recuperación desaparece por otra razón: no almacena minoritarios."
      - texto: "Porque aguanta más tensión inversa"
        porque: "Aguanta menos, de 20 a 100 V típicamente. Lo que no tiene es carga almacenada."
    fijar: { f_c: 100000 }
    inicio: { t_rr: 35e-9 }
    widget:
      tipo: grafica
      x: { id: x, min: 30, max: 600000, unidad: Hz, rotulo: "f", escala: log }
      y: { min: 0.000001, max: 300, unidad: W, rotulo: "pérdida", escala: log }
      curvas:
        - { expr: "0.5*V_c*I_c*2e-6*x", color: naranja, rotulo: "1N4007" }
        - { expr: "0.5*V_c*I_c*35e-9*x", color: azul, rotulo: "ultrarrápido" }
      lectura: { valor: P_rr, rotulo: "Pérdida por recuperación" }
      mandos:
        - { valor: t_rr, lista: [35e-9, 2e-6], nombres: [ultrarrápido, rectificador estándar], rotulo: "Diodo" }
    escalera:
      - "La pérdida va con t_{rr}, y t_{rr} con la carga de minoritarios almacenada."
    solucion: "Lo llevan mayoritarios: no hay carga que evacuar, solo la pequeña capacidad de la unión."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [224, 225, 226, 228, 229, 231, 233, 235, 236, 237, 239]
    ideas:
      - { titulo: "Carga almacenada.", texto: "Un diodo de unión conduce al revés durante t_{rr} mientras evacúa sus minoritarios: en el osciloscopio, una excursión negativa tras el flanco." }
      - { titulo: "Pérdida ∝ f.", texto: "½·V·I_{RM}·t_{rr} en cada conmutación: 10 mW a 50 Hz son 20 W a 100 kHz." }
      - { titulo: "Elegir bien.", texto: "1N4007 para la red; ultrarrápido o Schottky en conmutadas: el Schottky solo carga su capacidad." }
      - { titulo: "Dónde muerde.", texto: "Un corte abrupto excita la inductancia parásita. Obliga a tiempos muertos en un puente de transistores y a 10 nF por diodo en el de red." }
