# Lección 1.1 de la sección 5.4 «Identificación Física de los Diodos» (cap05): la banda marca el cátodo y sus
# excepciones, la prueba de diodos (la punta roja entrega la corriente; la caída dice la tecnología), el marcaje de las
# familias y de los SMD, qué hacer sin marcaje y el error clásico de montarlo al revés. Formato:
# contenido/lecciones11/GUIA.md.
# 1.2.1 (autor121-fund, «aprender haciendo», GUIA §13): girar el diodo para que conduzca, medir la caída con la
# roja en el ánodo, medirlo al revés, tocar el cátodo en la foto (fig. 5.11) y buscar el LED rojo por su caída; se
# elige la avería que da OL en los dos sentidos. Encapsulados, familias, SMD, la secuencia sin marcaje y el montaje
# al revés quedan en los textos y el resumen.
leccion: cap05/sec-5.4

libro:
  151: "cuál es el cátodo y qué diodo es este"
  153: "la banda marca el cátodo"
  155: "la referencia fiable es el chaflán, no la longitud"
  157: "El instrumento entrega corriente por la punta roja"
  158: "Tecnología probable"
  161: "Como cuestan lo mismo, en la práctica se compra el 4007 para todo"
  162: "No hay forma de deducirlo; hay que consultar una tabla de códigos SMD"
  163: "Sin marcaje legible, la secuencia es"
  165: "Montar un diodo al revés en un rectificador produce"
  166: "rectificador de la serie 1N400x, con la franja plateada en el cátodo"
  "cap05#121": "El diodo es una fuente de 0,7 V"

modelo:
  valores:
    V_d: { sim: "V", nombre: "tensión de la pila", unidad: V, valor: 5 }
    R_d: { sim: "R", nombre: "resistencia", unidad: Ω, valor: 1000 }
    V_D: { sim: "V_{D}", nombre: "caída del diodo", unidad: V, valor: 0.7 }
  calculos:
    I_dc: { expr: "max(0, (V_d - V_D)/R_d)", sim: "I_{D}", nombre: "corriente del diodo", unidad: A }
    V_dc: { expr: "V_d - I_dc*R_d", sim: "V_{D}", nombre: "tensión del diodo", unidad: V }

tarjetas:
  - id: explore-sentido
    tipo: explorar
    titulo: "La banda es el cátodo"
    texto: "La banda marca el cátodo: el terminal por el que sale la corriente cuando el diodo conduce. Gire el diodo hasta que conduzca."
    libro: [151, 153, "cap05#121"]
    inicio: { V_d: -5 }
    widget:
      tipo: circuito
      esquema: diodo
      piezas: { fuente: V_d, r: R_d, vd: V_D }
      lectura: { valor: I_dc, rotulo: "Corriente" }
      datos:
        - { valor: V_dc, rotulo: "Tensión del diodo: {{V_dc}}" }
      corriente: I_dc
      mide: { corriente: I_dc, vd: V_dc }
      mandos:
        - { valor: V_d, lista: [-5, 5], nombres: [banda al positivo, banda al negativo], rotulo: "Sentido del diodo" }
    objetivo:
      condiciones:
        - { valor: I_dc, min: 0.001, rotulo: "Corriente: {{I_dc}}" }
      logrado: "Con la banda al negativo pasan {{I_dc}} y el diodo cae {{V_dc}}: la corriente sale por el cátodo. Al revés, bloquea."
      pistas:
        - { texto: "Gire el diodo: la banda, al negativo." }
    escalera:
      - "La corriente solo puede salir por la banda."
    solucion: "Banda al negativo: 4,3 mA."
    comprobar:
      - { I_dc: 0 }
      - { con: { V_d: 5 }, I_dc: 0.0043, V_dc: 0.7 }

  - id: pregunta-punta-roja
    tipo: medir
    titulo: "La prueba de diodos"
    texto: "El instrumento entrega corriente por la punta roja. Mida la caída del diodo con cada punta donde debe ir."
    libro: [157]
    fijar: { V_d: 5 }
    widget:
      tipo: circuito
      esquema: diodo
      piezas: { fuente: V_d, r: R_d, vd: V_D }
      corriente: I_dc
      mide: { corriente: I_dc, vd: V_dc }
      instrumento: { tipo: multimetro, modos: [V] }
      mandos: []
    medir:
      magnitud: tension
      entre: [an, "0"]
      polaridad: true
      valor: V_dc
      porque:
        "0/an": "Puntas al revés: la roja entrega la corriente y va al ánodo; la negra, al cátodo."
        "fte/0": "Así mide la pila, no el diodo."
        "fte/an": "Así mide la resistencia."
    exito: "0,7 V con la roja en el ánodo y la negra en el cátodo: solo hay caída si la corriente entra por el ánodo."
    escalera:
      - "La roja en el ánodo, la negra en la banda."
    solucion: "Roja entre la resistencia y el diodo, negra en la masa: 0,7 V."
    comprobar:
      - { V_dc: 0.7 }
  - id: prediga-reves
    tipo: medir
    titulo: "Al revés"
    texto: "Ahora el diodo, con la banda al positivo, bloquea. Mida la tensión que soporta, la roja en su ánodo."
    libro: [153]
    fijar: { V_d: -5 }
    widget:
      tipo: circuito
      esquema: diodo
      piezas: { fuente: V_d, r: R_d, vd: V_D }
      corriente: I_dc
      mide: { corriente: I_dc, vd: V_dc }
      instrumento: { tipo: multimetro, modos: [V] }
      mandos: []
    medir:
      magnitud: tension
      entre: [an, "0"]
      polaridad: true
      valor: V_dc
      porque:
        "0/an": "Puntas al revés: la roja, al ánodo."
        "fte/0": "Así mide la pila, no el diodo."
        "fte/an": "Así mide la resistencia: sin corriente, no cae nada."
    exito: "−5 V: toda la pila sobre el diodo, que bloquea. No pasa corriente."
    escalera:
      - "Sin corriente, la resistencia no cae nada."
    solucion: "Entre el ánodo y la masa: −5 V."
    comprobar:
      - { V_dc: -5, I_dc: 0 }
  - id: empareje-encapsulados
    tipo: tocar
    titulo: "La banda es el cátodo"
    texto: "En la foto (a), un rectificador de la serie 1N400x. Toque su cátodo."
    libro: [153, 155, 161, 166]
    widget:
      tipo: figura
      figura: fig-5.11
      zonas:
        - { id: banda, rotulo: "(a), el extremo izquierdo del cuerpo", rect: [110, 120, 140, 250] }
        - { id: centro, rotulo: "(a), el centro del cuerpo", rect: [255, 120, 205, 250] }
        - { id: extremo, rotulo: "(a), el extremo derecho del cuerpo", rect: [465, 120, 175, 250] }
    tocar:
      bien: [banda]
      porque:
        centro: "Ahí va impresa la referencia."
        extremo: "Ese es el ánodo: la banda está en el otro extremo."
    exito: "La franja plateada. Toda la familia es de 1 A y cuesta lo mismo: se compra el 4007, de 1000 V, para todo. En el LED, el chaflán; en el TO-220, la lengüeta, que está viva."
    escalera:
      - "Busque la franja."
    solucion: "La franja plateada del extremo izquierdo."
  - id: empareje-caidas
    tipo: explorar
    titulo: "La caída dice la tecnología"
    texto: "Cuatro diodos sin marcar. Pruébelos y busque el LED rojo por su caída directa."
    libro: [158, 163]
    inicio: { V_D: 0.3 }
    widget:
      tipo: grafica
      x: { id: i, min: 0, max: 10, unidad: mA, rotulo: "corriente de la prueba" }
      y: { min: 0, max: 3.5, unidad: V, rotulo: "caída" }
      curvas:
        - { expr: "V_D", color: naranja, rotulo: "caída del diodo probado" }
      lectura: { valor: V_D, rotulo: "Caída directa" }
      mandos:
        - { valor: V_D, lista: [0.3, 0.7, 1.8, 3], nombres: ["diodo A", "diodo B", "diodo C", "diodo D"], rotulo: "Diodo probado" }
    objetivo:
      condiciones:
        - { valor: V_D, min: 1.6, max: 2, rotulo: "Caída: {{V_D}}" }
      logrado: "{{V_D}}: el LED rojo, de 1,6 a 2,0 V. Schottky, 0,15 – 0,45 V; silicio, 0,55 – 0,75 V; LED azul o blanco, 2,6 – 3,4 V. Sin marcaje, esta medida es lo primero."
      pistas:
        - { cuando: { valor: V_D, max: 0.75 }, texto: "Esa caída es de un Schottky o de un silicio: el LED cae más." }
        - { texto: "Se ha pasado: esa es de un LED azul o blanco." }
    escalera:
      - "Un LED rojo cae de 1,6 a 2,0 V."
    solucion: "El diodo C: 1,8 V."
    comprobar:
      - { V_D: 0.3 }
      - { con: { V_D: 1.8 }, V_D: 1.8 }
  - id: pregunta-averias
    tipo: pregunta
    titulo: "OL en los dos sentidos"
    texto: "Un diodo da OL con las puntas en un sentido y también en el otro. ¿Qué puede ser?"
    libro: [158]
    opciones:
      - texto: "Está abierto, o es un LED de tensión mayor que la del instrumento"
        bien: true
        porque: "Ninguno de los dos conduce con la prueba. Un diodo en cortocircuito daría 0 V en ambos sentidos."
      - texto: "Está en cortocircuito"
        porque: "Un cortocircuito marca 0 V en los dos sentidos, no OL."
      - texto: "Es un Schottky"
        porque: "Un Schottky sano marca de 0,15 a 0,45 V en directa."
    fijar: { V_d: 5 }
    widget:
      tipo: circuito
      esquema: diodo
      piezas: { fuente: V_d, r: R_d, vd: V_D }
      lectura: { valor: V_dc, rotulo: "Tensión del diodo" }
      corriente: I_dc
      mide: { corriente: I_dc, vd: V_dc }
      mandos: []
    escalera:
      - "Un diodo en corto marca 0 V en los dos sentidos. ¿Qué no conduce en ninguno?"
    solucion: "Un diodo abierto, o un LED cuya tensión supera la que da el instrumento."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [151, 153, 155, 157, 158, 161, 162, 163, 165]
    ideas:
      - { titulo: "La banda.", texto: "Marca el cátodo. En el LED, el chaflán; en el TO-220, la lengüeta, que está viva." }
      - { titulo: "La medida.", texto: "La roja entrega la corriente: hay lectura con la roja en el ánodo. La caída dice la tecnología." }
      - { titulo: "El marcaje.", texto: "Con patillas, la referencia (BAT, Schottky; BZX, Zener); en SMD, una clave que hay que buscar en una tabla." }
      - { titulo: "Al revés.", texto: "Sin salida, fusible fundido o electrolítico reventado: dos minutos de medida lo evitan." }
