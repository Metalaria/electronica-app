# Lección 1.2 de la sección 17.3 «Control del Hardware con Python» (cap18; etiquetas sec-18.N = impresas 17.N).
# - La latencia al escribir un pin desde un sistema operativo y lo que se puede hacer bien, sobre la figura 17.7
#   (fig-18.7, fichero 18.6.svg), con zonas.
# - Sin modelo numérico.
# Paso práctico: «tocar» la forma correcta de hablar con un periférico exigente (los buses en hardware).
# 1.2.1 (autor121-sens, «aprender haciendo», GUIA §13): en la figura 17.7 se tocan la cola que impide la
# temporización estricta (el explorar ya no la cuenta), los buses, el PWM por hardware y adónde va lo crítico; en un
# fragmento de Python (propio, ilustra el bloque 87) se toca la construcción que apaga el motor aunque haya un error.
# Los permisos pasan al resumen. Queda una pregunta de opciones: la interrupción de un pin.
leccion: cap18/sec-18.3

libro:
  86: "En un microcontrolador, el programa es dueño de todo"
  73: "la petición atraviesa la biblioteca, el sistema operativo y su controlador"
  74: "normalmente decenas de microsegundos, y ocasionalmente milisegundos si el planificador decide otra cosa"
  76: "nada que exija temporización estricta debe hacerse así"
  78: "Leer y escribir pines a ritmos de kilohercios, sin problema"
  79: "sirve para un pulsador, no para contar pulsos rápidos"
  80: "Es la forma correcta de hablar con cualquier periférico exigente"
  81: "el PWM por software tiene el mismo problema de temporización que todo lo demás"
  84: "Ejecutarlo todo con privilegios de administrador funciona y es mala práctica"
  87: "Sin eso, matar el programa deja un motor girando"
  90: "Mover lo crítico a un microcontrolador"
  93: "mucho más revelador, la irregularidad"
  94: "Distribución de la latencia al escribir un pin desde un sistema operativo"

modelo: { valores: {}, calculos: {} }

tarjetas:
  - id: explore-latencia
    tipo: explorar
    titulo: "La dispersión, no la lentitud"
    texto: "Cien mil escrituras de un pin: microcontrolador frente a sistema operativo. Toque la gráfica y los recuadros."
    libro: [73, 74, 94]
    widget:
      tipo: figura
      figura: fig-18.7
      zonas:
        - { id: micro, rotulo: "Barra verde, a la izquierda", rect: [50, 30, 36, 155], texto: "El microcontrolador escribe un registro: siempre lo mismo, nanosegundos." }
        - { id: so, rotulo: "Pico rojo del centro", rect: [130, 55, 50, 130], texto: "Con sistema operativo, la petición atraviesa biblioteca, sistema y controlador: decenas de microsegundos." }
        - { id: bien, rotulo: "Recuadros verdes, a la derecha", rect: [267, 28, 170, 114], texto: "Pines a kilohercios, buses y PWM por hardware: eso se hace bien." }
    requiere: { mover: [micro, so] }

  - id: predecir-cola
    tipo: tocar
    titulo: "Lo preocupante"
    texto: "Escribe un pin desde Python cien mil veces. Toque en la gráfica lo que impide la temporización estricta."
    libro: [74, 76]
    widget:
      tipo: figura
      figura: fig-18.7
      zonas:
        - { id: micro, rotulo: "Barra verde, a la izquierda", rect: [50, 30, 36, 155] }
        - { id: so, rotulo: "Pico rojo del centro", rect: [130, 55, 50, 130] }
        - { id: cola, rotulo: "Cola roja, a la derecha", rect: [185, 85, 55, 100] }
    tocar:
      bien: [cola]
      porque:
        micro: "Es el microcontrolador: siempre lo mismo, nanosegundos."
        so: "Decenas de microsegundos es lento, pero lento y constante se podría compensar."
    exito: "La cola: milisegundos de vez en cuando, cuando el planificador decide otra cosa. Lo que rompe es la dispersión, no la lentitud."
    escalera:
      - "¿Qué es peor: tardar siempre lo mismo o, de vez en cuando, mucho más?"
    solucion: "La cola de la derecha: los milisegundos ocasionales."

  - id: toque-buses
    tipo: tocar
    titulo: "Un periférico exigente"
    texto: "Debe hablar con un sensor de temporización exigente. Toque la forma correcta de hacerlo desde la Pi."
    libro: [80, 94]
    widget:
      tipo: figura
      figura: fig-18.7
      zonas:
        - { id: pines, rotulo: "Primer recuadro verde", rect: [267, 28, 170, 36] }
        - { id: buses, rotulo: "Segundo recuadro verde", rect: [267, 68, 170, 36] }
        - { id: pwm, rotulo: "Tercer recuadro verde", rect: [267, 106, 170, 36] }
        - { id: estricta, rotulo: "Recuadro rojo", rect: [267, 145, 170, 36] }
    tocar:
      bien: [buses]
      porque:
        pines: "Leer y escribir pines a kilohercios va bien, pero un protocolo exigente pide más."
        pwm: "El PWM por hardware genera una señal, no habla con un sensor."
        estricta: "Eso es justo lo que no se puede hacer por software."
    exito: "Los buses, en hardware: dentro de cada transferencia la temporización la marca el periférico."
    escalera:
      - "Busque lo que hace el hardware, no el planificador."
    solucion: "Los buses: I²C, SPI y serie."

  - id: pregunta-interrupcion
    tipo: pregunta
    titulo: "Interrupciones de un pin"
    texto: "Desde Python, atiende la interrupción de un pin. ¿Para qué sirve?"
    libro: [79]
    widget:
      tipo: figura
      figura: fig-18.7
      zonas:
        - { id: cola, rotulo: "Cola roja, a la derecha", rect: [185, 85, 55, 100] }
    opciones:
      - texto: "Para un pulsador, no para contar pulsos rápidos"
        bien: true
        porque: "La latencia no está acotada: entre dos pulsos rápidos puede perderse alguno."
      - texto: "Para contar pulsos de cualquier frecuencia"
        porque: "La latencia no está acotada: los pulsos rápidos se pierden."
      - texto: "Para nada: no hay interrupciones"
        porque: "Sí las hay; lo que no hay es latencia garantizada."
    escalera:
      - "¿Está acotado lo que tarda en atenderla?"
    solucion: "Para un pulsador."

  - id: predecir-pwm
    tipo: tocar
    titulo: "PWM sin sobresaltos"
    texto: "Necesita un PWM regular desde la Pi. Toque la forma de generarlo que escapa del planificador."
    libro: [81, 94]
    widget:
      tipo: figura
      figura: fig-18.7
      zonas:
        - { id: pines, rotulo: "Primer recuadro verde", rect: [267, 28, 170, 36] }
        - { id: buses, rotulo: "Segundo recuadro verde", rect: [267, 68, 170, 36] }
        - { id: pwm, rotulo: "Tercer recuadro verde", rect: [267, 106, 170, 36] }
        - { id: estricta, rotulo: "Recuadro rojo", rect: [267, 145, 170, 36] }
    tocar:
      bien: [pwm]
      porque:
        pines: "Un bucle en Python que conmuta un pin depende del planificador: el PWM sale irregular."
        buses: "Los buses hablan con periféricos; no generan un PWM."
        estricta: "Eso es justo lo que no se puede hacer por software."
    exito: "El PWM por hardware, en los pines que lo tienen. El de software tiene el mismo problema de temporización que todo lo demás."
    escalera:
      - "¿Quién decide cuándo corre un bucle de Python?"
    solucion: "El PWM por hardware."

  - id: porque-motor
    tipo: tocar
    titulo: "Un motor girando"
    texto: "Si el programa falla, el motor no debe quedarse girando. Toque la línea que garantiza que se apaga aunque haya un error."
    libro: [86, 87]
    widget:
      tipo: figura
      codigo:
        lenguaje: python
        texto: |
          motor = abrir_salida(PIN_MOTOR)
          try:
              while True:
                  controlar(motor)
          finally:
              motor.apagar()
              motor.liberar()
      zonas:
        - { id: l1, lineas: [1], rotulo: "Primera línea" }
        - { id: l2, lineas: [2], rotulo: "Segunda línea" }
        - { id: l4, lineas: [4], rotulo: "Cuarta línea" }
        - { id: l5, lineas: [5], rotulo: "Quinta línea" }
    tocar:
      bien: [l5]
      porque:
        l1: "Abre el pin: hace falta, pero no protege de nada."
        l2: "Empieza el bloque protegido; lo que se ejecuta pase lo que pase viene después."
        l4: "Es el trabajo normal: si falla aquí, se salta lo que queda del bucle."
    exito: "finally: se ejecuta aunque haya un error, y apaga y libera el pin. Con eso y manejando la señal de terminación, matar el programa no deja un motor girando."
    escalera:
      - "Busque la construcción que se ejecuta siempre, haya error o no."
    solucion: "La de finally."

  - id: pregunta-banco
    tipo: tocar
    titulo: "En el banco"
    texto: "En el osciloscopio, un pin conmutado desde Python da pulsos que de vez en cuando duran mucho más. Toque adónde lleva lo que es crítico en tiempo."
    libro: [90, 93]
    widget:
      tipo: figura
      figura: fig-18.7
      zonas:
        - { id: micro, rotulo: "Barra verde, a la izquierda", rect: [50, 30, 36, 155] }
        - { id: so, rotulo: "Pico rojo del centro", rect: [130, 55, 50, 130] }
        - { id: cola, rotulo: "Cola roja, a la derecha", rect: [185, 85, 55, 100] }
    tocar:
      bien: [micro]
      porque:
        so: "Ahí está el problema: el sistema operativo y su planificador."
        cola: "La cola es el síntoma, no el sitio adonde llevarlo."
    exito: "A un microcontrolador: esa dispersión es la razón de que el tiempo real no viva aquí."
    escalera:
      - "¿Qué escribe un pin siempre en el mismo tiempo?"
    solucion: "La barra verde: un microcontrolador."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [74, 78, 80, 84, 87]
    ideas:
      - { titulo: "Pasa por el sistema.", texto: "Decenas de µs, y a veces ms: latencia variable." }
      - { titulo: "Lo que va bien.", texto: "Pines a kilohercios, buses y PWM por hardware." }
      - { titulo: "Lo que no.", texto: "Temporización estricta: a un microcontrolador." }
      - { titulo: "Recursos.", texto: "Grupo adecuado, no administrador; liberar y apagar al salir." }
