# Lección 1.2 de la sección 17.1 «Un Ordenador Completo en una Placa» (cap18; etiquetas sec-18.N = impresas 17.N,
# salvo sec-new-18-datos = 17.10 y sec-18.10 = 17.11).
# - Las partes de la Raspberry Pi 4 sobre la figura 17.1 (fig-18.1) y lo que trae resuelto y lo que cuesta sobre la
#   figura 17.2 (fig-18.2), con zonas.
# - Sin modelo numérico.
# Paso práctico: «tocar» en la placa lo que la distingue de un ordenador cualquiera (la cabecera GPIO).
leccion: cap18/sec-18.1

libro:
  3: "No es un microcontrolador grande: es otra categoría de aparato"
  4: "Su elemento definitorio es que ejecuta un sistema operativo"
  13: "Arranque de decenas de segundos"
  14: "el planificador puede interrumpir cualquier cosa"
  15: "Consumo de cientos de miliamperios"
  16: "es la causa número uno de fallo de estos equipos"
  24: "Y el conector GPIO, que es lo que lo distingue de un ordenador cualquiera"
  29: "Es el paso natural de un prototipo a un producto"
  33: "Si es leer un sensor y encender un relé, un microcontrolador lo hace mejor"
  37: "Cronometrar el arranque desde que se aplica tensión hasta que la aplicación responde"
  38: "La placa Raspberry Pi"
  39: "Lo que un ordenador de placa trae resuelto y lo que cuesta, con la pregunta que decide."

modelo: { valores: {}, calculos: {} }

tarjetas:
  - id: explore-placa
    tipo: explorar
    titulo: "Un ordenador en una tarjeta"
    texto: "Procesador, memoria, almacenamiento, red y vídeo en el tamaño de una tarjeta. Toque las piezas."
    libro: [3, 24, 38]
    widget:
      tipo: figura
      figura: fig-18.1
      zonas:
        - { id: soc, rotulo: "Chip grande del centro", rect: [178, 89, 44, 44], texto: "El procesador (SoC): ARM de varios núcleos, con GPU integrada." }
        - { id: sd, rotulo: "Recuadro discontinuo, a la izquierda", rect: [107, 106, 42, 36], texto: "La tarjeta microSD, por debajo: contiene el sistema operativo." }
        - { id: gpio, rotulo: "Fila de pines, arriba", rect: [134, 36, 148, 36], texto: "La cabecera GPIO de 40 pines: acceso directo a pines, buses y periféricos." }
        - { id: red, rotulo: "Conectores de la derecha", rect: [303, 51, 62, 46], texto: "Ethernet; debajo, los USB." }
        - { id: alimentacion, rotulo: "Conector de abajo a la izquierda", rect: [130, 180, 36, 36], texto: "La alimentación por USB-C." }
    requiere: { mover: [soc, sd] }

  - id: toque-gpio
    tipo: tocar
    titulo: "Lo que lo hace útil en electrónica"
    texto: "Toque lo que distingue a esta placa de un ordenador cualquiera."
    libro: [24, 38]
    widget:
      tipo: figura
      figura: fig-18.1
      zonas:
        - { id: soc, rotulo: "Chip grande del centro", rect: [178, 89, 44, 44] }
        - { id: gpio, rotulo: "Fila de pines, arriba", rect: [134, 36, 148, 36] }
        - { id: red, rotulo: "Conectores de la derecha", rect: [303, 51, 62, 46] }
        - { id: hdmi, rotulo: "Conectores de abajo, en el centro", rect: [178, 180, 62, 36] }
    tocar:
      bien: [gpio]
      porque:
        soc: "Todo ordenador tiene procesador: no es lo que lo distingue."
        red: "Ethernet y USB los tiene cualquier ordenador."
        hdmi: "Salida de vídeo: la tiene cualquier ordenador."
    exito: "El conector GPIO: acceso directo a pines, buses y periféricos."
    escalera:
      - "¿Qué le deja hablar con el hardware además de con la red?"
    solucion: "La cabecera GPIO de 40 pines."

  - id: pregunta-definitorio
    tipo: pregunta
    titulo: "Otra categoría"
    texto: "¿Qué es lo que define a un ordenador de placa frente a un microcontrolador?"
    libro: [3, 4, 39]
    widget:
      tipo: figura
      figura: fig-18.2
      zonas:
        - { id: so, rotulo: "Recuadro de arriba", rect: [131, 4, 192, 36] }
    opciones:
      - texto: "Que ejecuta un sistema operativo"
        bien: true
        porque: "De ahí salen todas sus virtudes y todas sus limitaciones."
      - texto: "Que es un microcontrolador más grande"
        porque: "No lo es: es otra categoría de aparato."
      - texto: "Que tiene más pines"
        porque: "Lo definitorio es el sistema operativo, no los pines."
    escalera:
      - "Mire el recuadro del que salen las dos flechas."
    solucion: "Ejecuta un sistema operativo."

  - id: empareje-cuesta
    tipo: pregunta
    titulo: "Lo que cuesta"
    texto: "Empareje cada aspecto con su precio en un ordenador de placa."
    libro: [13, 14, 15, 16, 39]
    widget:
      tipo: figura
      figura: fig-18.2
      zonas:
        - { id: cuesta, rotulo: "Recuadro rojo", rect: [234, 62, 210, 100] }
    emparejar:
      - ["El arranque", "Decenas de segundos"]
      - ["El tiempo", "El planificador puede interrumpir cualquier cosa"]
      - ["El consumo", "Cientos de miliamperios"]
      - ["El almacenamiento", "Un corte puede corromper la tarjeta"]
    exito: "Todo sale de lo mismo: ejecuta un sistema operativo."
    pistas:
      - { texto: "Un microcontrolador durmiendo consume microamperios." }
    escalera:
      - "El planificador es parte del sistema operativo."
    solucion: "Arranque, decenas de segundos; tiempo, planificador; consumo, cientos de mA; tarjeta, corrupción."

  - id: predecir-fallo
    tipo: predecir
    titulo: "La causa número uno"
    texto: "¿Cuál es la causa número uno de fallo de estos equipos?"
    libro: [16]
    widget:
      tipo: figura
      figura: fig-18.1
      zonas:
        - { id: sd, rotulo: "Recuadro discontinuo, a la izquierda", rect: [107, 106, 42, 36] }
    opciones:
      - texto: "Un corte de alimentación que corrompe la tarjeta"
        bien: true
        porque: "La fragilidad del almacenamiento: el sistema escribe constantemente."
      - texto: "El calor del procesador"
        porque: "El libro señala la tarjeta como la causa número uno."
      - texto: "Los pines GPIO dañados"
        porque: "Son frágiles, pero la causa número uno es la tarjeta corrompida."
    escalera:
      - "¿Qué pieza guarda el sistema operativo?"
    solucion: "El corte de alimentación que corrompe la tarjeta."

  - id: pregunta-cuando
    tipo: pregunta
    titulo: "Cuándo elegirlo"
    texto: "El proyecto es leer un sensor y encender un relé. ¿Qué usa?"
    libro: [33, 39]
    widget:
      tipo: figura
      figura: fig-18.2
      zonas:
        - { id: pregunta, rotulo: "Recuadro naranja, abajo", rect: [10, 173, 434, 75] }
    opciones:
      - texto: "Un microcontrolador"
        bien: true
        porque: "Arranca al instante, consume mil veces menos y no tiene tarjeta que corromperse."
      - texto: "Un ordenador de placa"
        porque: "Funcionaría, pero nada de eso pide un sistema operativo."
      - texto: "Los dos a la vez"
        porque: "Sin tiempo real crítico ni red compleja, basta el microcontrolador."
    escalera:
      - "¿La razón del proyecto es algo que solo un sistema operativo da?"
    solucion: "Un microcontrolador."

  - id: pregunta-producto
    tipo: pregunta
    titulo: "Del prototipo al producto"
    texto: "Su prototipo con Raspberry Pi funciona y va a ser un producto. ¿Qué paso es el natural?"
    libro: [29]
    widget:
      tipo: figura
      figura: fig-18.1
      zonas:
        - { id: placa, rotulo: "La placa entera", rect: [115, 42, 245, 162] }
    opciones:
      - texto: "Un módulo de cómputo en una placa propia"
        bien: true
        porque: "La misma electrónica sin conectores, para integrar en una placa propia."
      - texto: "Seguir con la placa de desarrollo"
        porque: "Funciona, pero el paso natural es el módulo de cómputo."
      - texto: "Cambiar a un microcontrolador"
        porque: "Si la razón del proyecto pide sistema operativo, no; el paso es el módulo."
    escalera:
      - "La misma electrónica, sin los conectores."
    solucion: "Un módulo de cómputo."

  - id: pregunta-banco
    tipo: pregunta
    titulo: "En el banco"
    texto: "Antes de comprometerse con esta plataforma, ¿qué cronometra?"
    libro: [37]
    widget:
      tipo: figura
      figura: fig-18.1
      zonas:
        - { id: alimentacion, rotulo: "Conector de abajo a la izquierda", rect: [130, 180, 36, 36] }
    opciones:
      - texto: "De aplicar tensión a que la aplicación responda"
        bien: true
        porque: "Si ese tiempo es inaceptable para el uso, la decisión de arquitectura está tomada."
      - texto: "Lo que tarda en conmutar un pin"
        porque: "Importa, pero el libro pide cronometrar el arranque completo."
      - texto: "Lo que tarda el escritorio en aparecer"
        porque: "Lo que cuenta es cuándo responde la aplicación, no el escritorio."
    escalera:
      - "¿Cuál es el coste más visible del sistema operativo?"
    solucion: "El arranque, hasta que la aplicación responde. Y el consumo real."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [4, 16, 24, 33]
    ideas:
      - { titulo: "Un sistema operativo.", texto: "De ahí sus virtudes y sus limitaciones: otra categoría de aparato." }
      - { titulo: "Lo que trae.", texto: "Red, ficheros, vídeo, cálculo y el GPIO, que habla con el hardware." }
      - { titulo: "Lo que cuesta.", texto: "Arranque lento, tiempo imprevisible, consumo y una tarjeta frágil." }
      - { titulo: "La pregunta.", texto: "¿Lo que pide el proyecto solo lo da un sistema operativo?" }
