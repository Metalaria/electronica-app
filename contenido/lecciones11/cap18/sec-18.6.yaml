# Lección 1.2 de la sección 17.6 «El Sistema Operativo y el Arranque» (cap18; etiquetas sec-18.N = impresas 17.N).
# - El reparto del tiempo de arranque y las defensas contra la corrupción de la tarjeta, sobre la figura 17.10
#   (fig-18.10, fichero 18.9.svg), con zonas.
# - Sin modelo numérico.
# Paso práctico: «tocar» la defensa que elimina el problema de raíz (la raíz de solo lectura).
# 1.2.1 (autor121-sens, «aprender haciendo», GUIA §13): en la barra del arranque completo de la figura 17.9
# (tramos de 18.9.py, 3,44 px por segundo) se tocan la etapa que desaparece sin escritorio y la que acortan los
# servicios; en la foto de la familia (fig-18.3) se toca la placa que responde al instante; en la placa (fig-18.1), lo
# que se comprueba ante corrupciones repetidas. Queda una pregunta de opciones: declarar el hardware.
leccion: cap18/sec-18.6

libro:
  156: "Arrancar la aplicación como servicio del sistema, sin"
  150: "ese proceso lleva decenas de segundos"
  151: "La ROM del chip arranca y busca el cargador de segunda etapa"
  155: "Suele ser lo que más ahorra"
  158: "un arranque de 40 segundos baja a 10 o 15"
  161: "un corte durante una escritura corrompe la tarjeta"
  163: "Es la solución robusta, y exige diseñar para ello"
  164: "las tarjetas industriales están pensadas para escritura continua"
  167: "Aporta portabilidad y cuesta latencia e imprevisibilidad"
  169: "El arranque se diagnostica por el puerto serie de consola"
  170: "una fuente insuficiente produce reinicios que corrompen"
  171: "Reparto del tiempo de arranque, las tres defensas contra la corrupción de la tarjeta"
  "cap18#38": "La placa Raspberry Pi"
  "cap18#40": "La familia Raspberry Pi a la misma escala"

modelo: { valores: {}, calculos: {} }

tarjetas:
  - id: explore-arranque
    tipo: explorar
    titulo: "Dónde se va el tiempo"
    texto: "Arriba, el arranque de un sistema completo con escritorio; abajo, el de uno mínimo. Toque las dos barras."
    libro: [150, 151, 171]
    widget:
      tipo: figura
      figura: fig-18.10
      zonas:
        - { id: completa, rotulo: "Barra de arriba", rect: [60, 78, 150, 36], texto: "Completa, con escritorio: la ROM busca el cargador, este carga el firmware, el núcleo monta los ficheros, el sistema lanza servicios y, al final, el entorno." }
        - { id: minima, rotulo: "Barra de abajo", rect: [60, 125, 52, 36], texto: "Mínima, con la aplicación como servicio: las mismas etapas, más cortas." }
        - { id: defensas, rotulo: "Recuadros verdes, a la derecha", rect: [262, 45, 170, 112], texto: "Las tres defensas contra la corrupción de la tarjeta." }
    requiere: { mover: [completa, minima] }

  - id: ordene-arranque
    tipo: tocar
    titulo: "Sin escritorio"
    texto: "Arranca la aplicación como servicio, sin esperar a un entorno de escritorio. Toque la etapa que desaparece entera."
    libro: [151, 156, 171]
    widget:
      tipo: figura
      figura: fig-18.10
      zonas:
        - { id: primeras, rotulo: "Primer tramo de la barra de arriba", rect: [72, 76, 34, 36] }
        - { id: servicios, rotulo: "Tramo central de la barra de arriba", rect: [106, 76, 48, 36] }
        - { id: entorno, rotulo: "Último tramo de la barra de arriba", rect: [154, 76, 62, 36] }
    tocar:
      bien: [entorno]
      porque:
        primeras: "ROM, cargador y núcleo hacen falta siempre: sin ellos no hay sistema."
        servicios: "Los servicios se acortan, pero la aplicación es uno de ellos: no desaparecen."
    exito: "El entorno de usuario: con la aplicación como servicio no hace falta escritorio."
    escalera:
      - "¿Cuál es la última etapa, la que solo está si hay escritorio?"
    solucion: "El último tramo: el entorno."

  - id: pregunta-acortar
    tipo: tocar
    titulo: "Acortar el arranque"
    texto: "Desactivar lo que no se usa (gráficos, impresión, Bluetooth) suele ser lo que más ahorra. Toque la etapa que acorta."
    libro: [155, 158, 171]
    widget:
      tipo: figura
      figura: fig-18.10
      zonas:
        - { id: primeras, rotulo: "Primer tramo de la barra de arriba", rect: [72, 76, 34, 36] }
        - { id: servicios, rotulo: "Tramo central de la barra de arriba", rect: [106, 76, 48, 36] }
        - { id: entorno, rotulo: "Último tramo de la barra de arriba", rect: [154, 76, 62, 36] }
    tocar:
      bien: [servicios]
      porque:
        primeras: "ROM, cargador y núcleo no dependen de lo que se active después."
        entorno: "El entorno es el escritorio; los gráficos, la impresión y el Bluetooth son servicios."
    exito: "Los servicios. Con eso, la aplicación como servicio y una distribución mínima, un arranque de 40 s baja a 10 o 15."
    escalera:
      - "Gráficos, impresión y Bluetooth los lanza el sistema de inicio."
    solucion: "El tramo central: los servicios."

  - id: predecir-instante
    tipo: tocar
    titulo: "Responder al instante"
    texto: "El aparato debe responder en cuanto se enciende, aunque el sistema tarde en arrancar. Toque la placa que atendería mientras tanto."
    libro: [158, "cap18#40"]
    widget:
      tipo: figura
      figura: fig-18.3
      zonas:
        - { id: pi5, rotulo: "Placa grande, arriba a la izquierda", rect: [0, 0, 770, 500] }
        - { id: zero, rotulo: "Placa mediana, abajo a la izquierda", rect: [230, 610, 570, 270] }
        - { id: pico, rotulo: "Placa estrecha, abajo a la derecha", rect: [910, 650, 460, 190] }
    tocar:
      bien: [pico]
      porque:
        pi5: "Es la que tarda decenas de segundos: no puede atenderse a sí misma mientras arranca."
        zero: "Arranca el mismo sistema: tampoco responde al instante."
    exito: "Un microcontrolador, que atiende desde el primer milisegundo mientras el sistema grande arranca a su ritmo."
    escalera:
      - "¿Qué arranca en milisegundos?"
    solucion: "La Pico, un microcontrolador."

  - id: toque-defensa
    tipo: tocar
    titulo: "La solución robusta"
    texto: "Un corte durante una escritura corrompe la tarjeta. Toque la defensa que elimina el problema de raíz."
    libro: [161, 163, 164, 171]
    widget:
      tipo: figura
      figura: fig-18.10
      zonas:
        - { id: raiz, rotulo: "Primer recuadro verde", rect: [262, 45, 170, 36] }
        - { id: reducir, rotulo: "Segundo recuadro verde", rect: [262, 82, 170, 36] }
        - { id: apagado, rotulo: "Tercer recuadro verde", rect: [262, 120, 170, 36] }
        - { id: industrial, rotulo: "Recuadro violeta", rect: [262, 158, 170, 36] }
    tocar:
      bien: [raiz]
      porque:
        reducir: "Escribir menos reduce el riesgo, pero no lo elimina."
        apagado: "Da tiempo a cerrar; depende de detectar la caída y de que el respaldo dure."
        industrial: "Dura mucho más, pero un corte en mitad de una escritura la sigue corrompiendo."
    exito: "Raíz de solo lectura: si no hay escrituras, un corte no corrompe nada. Exige diseñar para ello."
    escalera:
      - "¿Qué pasa con un corte si no se escribe nada?"
    solucion: "La raíz de solo lectura."

  - id: porque-declarar
    tipo: porque
    titulo: "Declarar el hardware"
    texto: "Aquí los periféricos no se configuran con registros: se declaran al sistema operativo. ¿Qué se gana y qué se paga?"
    libro: [167]
    widget:
      tipo: figura
      figura: fig-18.10
      zonas:
        - { id: completa, rotulo: "Barra de arriba", rect: [60, 78, 150, 36] }
    opciones:
      - texto: "Se gana portabilidad; se paga latencia"
        bien: true
        porque: "El sistema gestiona el hardware y la aplicación pide servicios: portabilidad a cambio de latencia e imprevisibilidad."
      - texto: "Se gana velocidad; no se paga nada"
        porque: "Pasar por el sistema añade latencia, no velocidad."
      - texto: "Se gana tiempo real"
        porque: "Al contrario: cuesta imprevisibilidad."
    escalera:
      - "¿Quién toca el hardware: la aplicación o el sistema?"
    solucion: "Portabilidad, a cambio de latencia e imprevisibilidad."

  - id: pregunta-banco
    tipo: tocar
    titulo: "En el banco"
    texto: "La tarjeta se corrompe una y otra vez. Antes de cambiarla, toque lo que comprueba."
    libro: [169, 170, "cap18#38"]
    widget:
      tipo: figura
      figura: fig-18.1
      zonas:
        - { id: soc, rotulo: "Chip grande del centro", rect: [178, 89, 44, 44] }
        - { id: sd, rotulo: "Recuadro discontinuo, a la izquierda", rect: [107, 106, 42, 36] }
        - { id: red, rotulo: "Conectores de la derecha", rect: [303, 51, 62, 46] }
        - { id: alimentacion, rotulo: "Conector de abajo a la izquierda", rect: [130, 180, 36, 36] }
    tocar:
      bien: [alimentacion]
      porque:
        soc: "El procesador no corrompe la tarjeta: lo hacen los reinicios en mitad de una escritura."
        sd: "Es la víctima, no la causa: cambiarla no arregla nada si se repite."
        red: "La red no escribe en la tarjeta por sí sola."
    exito: "La alimentación: una fuente insuficiente produce reinicios que corrompen, y se atribuyen a la tarjeta. Y el arranque se diagnostica por el puerto serie de consola."
    escalera:
      - "¿Qué produce reinicios en mitad de una escritura?"
    solucion: "La entrada de alimentación: la fuente."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [151, 158, 163, 170]
    ideas:
      - { titulo: "Cinco etapas.", texto: "ROM, cargador, núcleo, servicios y entorno: decenas de segundos." }
      - { titulo: "Acortarlo.", texto: "Sin servicios inútiles ni escritorio, de 40 s a 10 o 15 s." }
      - { titulo: "La tarjeta.", texto: "Raíz de solo lectura, menos escrituras y apagado ordenado." }
      - { titulo: "La fuente.", texto: "Ante corrupciones repetidas, compruebe primero la alimentación." }
