# Lección 1.2 de la sección 17.6 «El Sistema Operativo y el Arranque» (cap18; etiquetas sec-18.N = impresas 17.N).
# - El reparto del tiempo de arranque y las defensas contra la corrupción de la tarjeta, sobre la figura 17.10
#   (fig-18.10, fichero 18.9.svg), con zonas.
# - Sin modelo numérico.
# Paso práctico: «tocar» la defensa que elimina el problema de raíz (la raíz de solo lectura).
leccion: cap18/sec-18.6

libro:
  150: "ese proceso lleva decenas de segundos"
  151: "La ROM del chip arranca y busca el cargador de segunda etapa"
  155: "Suele ser lo que más ahorra"
  158: "un arranque de 40 segundos baja a 10 o 15"
  161: "un corte durante una escritura corrompe la tarjeta"
  163: "Es la solución robusta, y exige diseñar para ello"
  164: "las tarjetas industriales están pensadas para escritura continua"
  167: "Aporta portabilidad y cuesta latencia e imprevisibilidad"
  169: "El arranque se diagnostica por el puerto serie de consola"
  170: "una fuente insuficiente produce reinicios que corrompen"
  171: "Reparto del tiempo de arranque, las tres defensas contra la corrupción de la tarjeta"

modelo: { valores: {}, calculos: {} }

tarjetas:
  - id: explore-arranque
    tipo: explorar
    titulo: "Dónde se va el tiempo"
    texto: "Un sistema completo con escritorio frente a uno mínimo como servicio. Toque las dos barras y las defensas."
    libro: [150, 158, 171]
    widget:
      tipo: figura
      figura: fig-18.10
      zonas:
        - { id: completa, rotulo: "Barra de arriba", rect: [60, 78, 150, 36], texto: "Completa, con escritorio: los servicios y el entorno se llevan la mayor parte." }
        - { id: minima, rotulo: "Barra de abajo", rect: [60, 125, 52, 36], texto: "Mínima, como servicio y sin escritorio: decenas de segundos menos." }
        - { id: defensas, rotulo: "Recuadros verdes, a la derecha", rect: [262, 45, 170, 112], texto: "Las tres defensas contra la corrupción de la tarjeta." }
    requiere: { mover: [completa, minima] }

  - id: ordene-arranque
    tipo: pregunta
    titulo: "Del encendido al escritorio"
    texto: "Ordene las etapas del arranque."
    libro: [151]
    widget:
      tipo: figura
      figura: fig-18.10
      zonas:
        - { id: completa, rotulo: "Barra de arriba", rect: [60, 78, 150, 36] }
    ordenar:
      - "La ROM del chip busca el cargador"
      - "El cargador inicia la memoria y carga el firmware"
      - "El núcleo detecta el hardware y monta el sistema de ficheros"
      - "El sistema de inicio lanza los servicios"
      - "El entorno de usuario, si lo hay"
    exito: "De esa secuencia salen las decisiones que importan en un proyecto empotrado."
    pistas:
      - { texto: "Sin sistema de ficheros montado no se pueden lanzar servicios." }
    escalera:
      - "Lo primero está grabado en el propio chip."
    solucion: "ROM, cargador, núcleo, servicios y entorno."

  - id: pregunta-acortar
    tipo: pregunta
    titulo: "Acortar el arranque"
    texto: "Desactiva servicios, arranca la aplicación como servicio y usa una distribución mínima. ¿A cuánto baja un arranque de 40 s?"
    libro: [155, 158]
    widget:
      tipo: figura
      figura: fig-18.10
      zonas:
        - { id: minima, rotulo: "Barra de abajo", rect: [60, 125, 52, 36] }
    opciones:
      - texto: "A 10 o 15 s"
        bien: true
        porque: "Por debajo hace falta trabajo específico."
      - texto: "A menos de un segundo"
        porque: "Eso ya no se consigue así: para responder al instante, un microcontrolador."
      - texto: "Apenas cambia"
        porque: "Desactivar servicios suele ser lo que más ahorra: baja a 10 o 15 s."
    escalera:
      - "Compare las dos barras de la figura."
    solucion: "A 10 o 15 s."

  - id: predecir-instante
    tipo: predecir
    titulo: "Responder al instante"
    texto: "El aparato debe responder en cuanto se enciende. ¿Cómo se consigue con un ordenador de placa?"
    libro: [158]
    widget:
      tipo: figura
      figura: fig-18.10
      zonas:
        - { id: completa, rotulo: "Barra de arriba", rect: [60, 78, 150, 36] }
    opciones:
      - texto: "Un microcontrolador atiende mientras el sistema arranca"
        bien: true
        porque: "Atiende desde el primer milisegundo; el sistema grande arranca a su ritmo."
      - texto: "Quitando más servicios"
        porque: "Por debajo de 10 o 15 s hace falta trabajo específico; al instante, no llega."
      - texto: "Con una tarjeta más rápida"
        porque: "Ayuda poco: el núcleo y los servicios siguen tardando segundos."
    escalera:
      - "¿Qué arranca en milisegundos?"
    solucion: "Con un microcontrolador que atienda desde el primer milisegundo."

  - id: toque-defensa
    tipo: tocar
    titulo: "La solución robusta"
    texto: "Un corte durante una escritura corrompe la tarjeta. Toque la defensa que elimina el problema de raíz."
    libro: [161, 163, 164, 171]
    widget:
      tipo: figura
      figura: fig-18.10
      zonas:
        - { id: raiz, rotulo: "Primer recuadro verde", rect: [262, 45, 170, 36] }
        - { id: reducir, rotulo: "Segundo recuadro verde", rect: [262, 82, 170, 36] }
        - { id: apagado, rotulo: "Tercer recuadro verde", rect: [262, 120, 170, 36] }
        - { id: industrial, rotulo: "Recuadro violeta", rect: [262, 158, 170, 36] }
    tocar:
      bien: [raiz]
      porque:
        reducir: "Escribir menos reduce el riesgo, pero no lo elimina."
        apagado: "Da tiempo a cerrar; depende de detectar la caída y de que el respaldo dure."
        industrial: "Dura mucho más, pero un corte en mitad de una escritura la sigue corrompiendo."
    exito: "Raíz de solo lectura: si no hay escrituras, un corte no corrompe nada. Exige diseñar para ello."
    escalera:
      - "¿Qué pasa con un corte si no se escribe nada?"
    solucion: "La raíz de solo lectura."

  - id: porque-declarar
    tipo: porque
    titulo: "Declarar el hardware"
    texto: "Aquí los periféricos no se configuran con registros: se declaran al sistema operativo. ¿Qué se gana y qué se paga?"
    libro: [167]
    widget:
      tipo: figura
      figura: fig-18.10
      zonas:
        - { id: completa, rotulo: "Barra de arriba", rect: [60, 78, 150, 36] }
    opciones:
      - texto: "Se gana portabilidad; se paga latencia"
        bien: true
        porque: "El sistema gestiona el hardware y la aplicación pide servicios: portabilidad a cambio de latencia e imprevisibilidad."
      - texto: "Se gana velocidad; no se paga nada"
        porque: "Pasar por el sistema añade latencia, no velocidad."
      - texto: "Se gana tiempo real"
        porque: "Al contrario: cuesta imprevisibilidad."
    escalera:
      - "¿Quién toca el hardware: la aplicación o el sistema?"
    solucion: "Portabilidad, a cambio de latencia e imprevisibilidad."

  - id: pregunta-banco
    tipo: pregunta
    titulo: "En el banco"
    texto: "La tarjeta se corrompe una y otra vez. ¿Qué comprueba antes de cambiarla?"
    libro: [169, 170]
    widget:
      tipo: figura
      figura: fig-18.10
      zonas:
        - { id: defensas, rotulo: "Recuadros verdes, a la derecha", rect: [262, 45, 170, 112] }
    opciones:
      - texto: "La fuente de alimentación"
        bien: true
        porque: "Una fuente insuficiente produce reinicios que corrompen, y se culpa a la tarjeta."
      - texto: "La marca de la tarjeta"
        porque: "Importa, pero las corrupciones repetidas apuntan a la fuente."
      - texto: "El escritorio"
        porque: "No corrompe la tarjeta; los reinicios por la fuente sí."
    escalera:
      - "¿Qué produce reinicios en mitad de una escritura?"
    solucion: "La alimentación: los reinicios corrompen."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [151, 158, 163, 170]
    ideas:
      - { titulo: "Cinco etapas.", texto: "ROM, cargador, núcleo, servicios y entorno: decenas de segundos." }
      - { titulo: "Acortarlo.", texto: "Sin servicios inútiles ni escritorio, de 40 s a 10 o 15 s." }
      - { titulo: "La tarjeta.", texto: "Raíz de solo lectura, menos escrituras y apagado ordenado." }
      - { titulo: "La fuente.", texto: "Ante corrupciones repetidas, compruebe primero la alimentación." }
