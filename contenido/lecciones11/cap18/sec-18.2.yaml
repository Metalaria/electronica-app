# Lección 1.2 de la sección 17.2 «Los Pines GPIO» (cap18; etiquetas sec-18.N = impresas 17.N).
# - La cabecera de 40 pines sobre la figura 17.4 (fig-18.4, fichero 18.3.svg), con zonas por grupos de función (los
#   pines sueltos miden menos de lo que se toca en un teléfono).
# - Sin modelo numérico.
# Paso práctico: «tocar» los pines que se pierden como GPIO al activar la UART.
# 1.2.1 (autor121-sens, «aprender haciendo», GUIA §13): en la cabecera de la figura 17.4 se lee el GPIO del pin
# físico 12 (el 18, según 18.3.py) y se tocan los pines del convertidor I²C y los de la EEPROM del sombrero; el relé
# durante el arranque se vive en un circuito «logica» (el pin como salida tri-estado que aún no conduce, con y sin
# resistencia externa); se escribe cuántos pines a 16 mA caben en los 50 mA. Queda una pregunta de opciones: las masas.
leccion: cap18/sec-18.2

libro:
  55: "Sí hay"
  44: "no son cuarenta entradas y salidas equivalentes"
  46: "5 V (directo de la fuente, sin regular)"
  47: "usarlas todas y no solo una reduce la inductancia del retorno"
  49: "activar esos buses consume esos pines"
  50: "Una biblioteca que espere una y reciba la otra actúa sobre el pin equivocado"
  52: "durante el arranque, los pines no están donde el programa los deja"
  53: "una resistencia externa que fije el estado seguro"
  56: "No hay: entradas analógicas"
  58: "una EEPROM de identificación"
  62: "Que la señal no supere 3,3 V, porque los pines no toleran 5"
  66: "Cabecera GPIO de 40 pines de la Raspberry Pi"

modelo:
  valores:
    p_fis: { sim: "pin", nombre: "pin físico", unidad: "", valor: 12 }
    I_pp: { sim: "I_{pin}", nombre: "corriente por pin", unidad: A, valor: 0.016 }
    I_pt: { sim: "I_{total}", nombre: "corriente total", unidad: A, valor: 0.05 }
  calculos:
    g_12: { expr: "p_fis + 6", sim: "GPIO", nombre: "GPIO del pin físico 12", unidad: "" }
    n_led: { expr: "floor(I_pt/I_pp)", sim: "n", nombre: "pines a 16 mA", unidad: "" }

tarjetas:
  - id: explore-cabecera
    tipo: explorar
    titulo: "Cuarenta pines, no cuarenta GPIO"
    texto: "Alimentaciones, masas y pines de doble función. Toque los grupos."
    libro: [44, 46, 49, 66]
    widget:
      tipo: figura
      figura: fig-18.4
      zonas:
        - { id: i2c, rotulo: "Pines verdes, arriba a la izquierda", rect: [40, 31, 110, 36], texto: "I²C: las líneas SDA y SCL, en dos pines concretos." }
        - { id: uart, rotulo: "Pines violetas, arriba a la derecha", rect: [125, 58, 100, 36], texto: "UART: las líneas TXD y RXD del puerto serie." }
        - { id: spi, rotulo: "Pines azules, a la izquierda", rect: [40, 148, 110, 45], texto: "SPI: MOSI, MISO y SCLK, más las selecciones CE0 y CE1." }
        - { id: eeprom, rotulo: "Pines de trazo discontinuo", rect: [35, 198, 190, 36], texto: "Reservados para la EEPROM del sombrero." }
        - { id: aviso, rotulo: "Recuadro rojo, a la derecha", rect: [277, 178, 173, 66], texto: "Pin físico no es número de GPIO; 3,3 V que no toleran 5 V." }
    requiere: { mover: [i2c, aviso] }

  - id: toque-uart
    tipo: tocar
    titulo: "Activar un bus consume pines"
    texto: "Activa el puerto serie de la cabecera. Toque los pines que deja de tener como GPIO genéricos."
    libro: [49, 66]
    widget:
      tipo: figura
      figura: fig-18.4
      zonas:
        - { id: i2c, rotulo: "Pines verdes, arriba a la izquierda", rect: [40, 31, 110, 36] }
        - { id: uart, rotulo: "Pines violetas, arriba a la derecha", rect: [125, 58, 100, 36] }
        - { id: spi, rotulo: "Pines azules, a la izquierda", rect: [40, 148, 110, 45] }
        - { id: eeprom, rotulo: "Pines de trazo discontinuo", rect: [35, 198, 190, 36] }
    tocar:
      bien: [uart]
      porque:
        i2c: "Son los de I²C, SDA y SCL."
        spi: "Son los de SPI."
        eeprom: "Están reservados para la EEPROM del sombrero, no para la UART."
    exito: "TXD y RXD: activar el bus consume esos pines. Es la primera fuente de conflictos."
    escalera:
      - "El puerto serie tiene una línea para transmitir y otra para recibir."
    solucion: "Los dos violetas: TXD y RXD."

  - id: predecir-numeracion
    tipo: leer
    titulo: "Dos numeraciones"
    texto: "Una biblioteca espera números de GPIO, y su relé está en el pin físico 12. Búsquelo en la figura y escriba el número que le pasa."
    libro: [50, 66]
    widget:
      tipo: figura
      figura: fig-18.4
      zonas:
        - { id: cabecera, rotulo: "La cabecera", rect: [70, 10, 160, 305], texto: "En el círculo, el pin físico; al lado, su número de GPIO." }
    leer:
      objetivo: g_12
      unidad: ""
      tol: 0.01
      rotulo: "Número de GPIO"
      errores:
        - { expr: "p_fis", texto: "Ese es el número físico, por posición en el conector: la biblioteca actuaría sobre otro pin." }
    exito: "GPIO 18. La física (posición) y la lógica (GPIO del chip) no coinciden: una biblioteca que espere una y reciba la otra actúa sobre el pin equivocado."
    escalera:
      - "Busque el círculo con el 12, en la columna de la derecha, y lea el GPIO de al lado."
    solucion: "El pin físico 12 es el GPIO 18."
    comprobar:
      - { g_12: 18, p_fis: 12 }

  - id: predecir-arranque
    tipo: explorar
    titulo: "Un relé que chasquea"
    texto: "Dos relés en dos GPIO, uno sin nada más y otro con una resistencia a masa. Reinicie la Pi y mire cuál queda quieto mientras arranca."
    libro: [52, 53]
    widget:
      tipo: logica
      entradas:
        - { id: PROG, valor: 1, rotulo: "Programa en marcha" }
        - { id: D, valor: 0, rotulo: "Lo que manda el programa" }
      piezas:
        - { id: t1, tipo: tri, entradas: [D, PROG], rotulo: "GPIO sin resistencia" }
        - { id: t2, tipo: tri, entradas: [D, PROG], rotulo: "GPIO con resistencia" }
        - { id: l1, tipo: bus, entradas: [t1], pullup: ninguna, rotulo: "Relé 1" }
        - { id: l2, tipo: bus, entradas: [t2], pullup: 0, rotulo: "Relé 2" }
      salidas:
        - { id: R1, de: l1, rotulo: "Relé sin resistencia" }
        - { id: R2, de: l2, rotulo: "Relé con resistencia a masa" }
    objetivo:
      condiciones:
        - { led: R1, valor: Z, rotulo: "Relé sin resistencia: sin nivel" }
        - { led: R2, valor: 0, rotulo: "Relé con resistencia: apagado" }
      logrado: "Durante el arranque los pines no están donde el programa los deja: el relé sin resistencia puede activarse solo. La resistencia externa fija el estado seguro."
      pistas:
        - { texto: "Mientras el programa corre, los dos obedecen. Quite «programa en marcha»." }
    escalera:
      - "¿Quién manda en el pin antes de que corra el programa?"
    solucion: "Programa parado: el relé sin resistencia flota y el otro queda a cero."

  - id: pregunta-analogica
    tipo: tocar
    titulo: "Medir una tensión"
    texto: "Quiere leer un potenciómetro, y ningún pin del conector llega a un convertidor A/D. Toque los pines por los que conectaría uno externo por I²C."
    libro: [55, 56, 66]
    widget:
      tipo: figura
      figura: fig-18.4
      zonas:
        - { id: i2c, rotulo: "Pines verdes, arriba a la izquierda", rect: [40, 31, 110, 36] }
        - { id: uart, rotulo: "Pines violetas, arriba a la derecha", rect: [125, 58, 100, 36] }
        - { id: spi, rotulo: "Pines azules, a la izquierda", rect: [40, 148, 110, 45] }
        - { id: eeprom, rotulo: "Pines de trazo discontinuo", rect: [35, 198, 190, 36] }
    tocar:
      bien: [i2c]
      porque:
        uart: "Es el puerto serie, TXD y RXD."
        spi: "Es SPI: también valdría para un convertidor, pero ha pedido I²C."
        eeprom: "Están reservados para la EEPROM del sombrero."
    exito: "SDA y SCL. No hay entradas analógicas: es una diferencia estructural con el Arduino, y se resuelve con un convertidor por I²C o SPI."
    escalera:
      - "I²C son dos líneas: SDA y SCL."
    solucion: "Los dos verdes, SDA y SCL."

  - id: pregunta-sombrero
    tipo: tocar
    titulo: "Los sombreros"
    texto: "Una placa de expansión configura sola los pines al arrancar. Toque los pines por los que el sistema sabe qué placa hay."
    libro: [58, 66]
    widget:
      tipo: figura
      figura: fig-18.4
      zonas:
        - { id: i2c, rotulo: "Pines verdes, arriba a la izquierda", rect: [40, 31, 110, 36] }
        - { id: uart, rotulo: "Pines violetas, arriba a la derecha", rect: [125, 58, 100, 36] }
        - { id: spi, rotulo: "Pines azules, a la izquierda", rect: [40, 148, 110, 45] }
        - { id: eeprom, rotulo: "Pines de trazo discontinuo", rect: [35, 198, 190, 36] }
    tocar:
      bien: [eeprom]
      porque:
        i2c: "Es el I²C general, para sus sensores."
        uart: "Es el puerto serie."
        spi: "Es SPI, para pantallas y convertidores."
    exito: "Los reservados para la EEPROM de identificación: el sistema la lee al arrancar y configura los pines. Muchas placas baratas no la llevan."
    escalera:
      - "Busque los pines con trazo distinto."
    solucion: "Los de trazo discontinuo, ID SD e ID SC."

  - id: empareje-comprobar
    tipo: leer
    titulo: "Antes de conectar nada"
    texto: "Cada pin da 16 mA y el total de la cabecera, 50 mA. Escriba cuántos pines puede tener a 16 mA a la vez."
    libro: [62]
    widget:
      tipo: figura
      figura: fig-18.4
      zonas:
        - { id: aviso, rotulo: "Recuadro rojo, a la derecha", rect: [277, 178, 173, 66], texto: "3,3 V que no toleran 5 V." }
    leer:
      objetivo: n_led
      unidad: ""
      tol: 0.01
      rotulo: "Pines a 16 mA"
      errores:
        - { expr: "I_pt/I_pp", texto: "No se encienden fracciones de pin: con el cuarto ya pasaría de 50 mA." }
    exito: "Tres. Las otras dos comprobaciones: que la señal no supere 3,3 V y que los pines de la función no se solapen. Ninguna cuesta más de dos minutos."
    escalera:
      - "Divida 50 entre 16 y quédese con la parte entera."
    solucion: "Tres: con el cuarto pasaría de 50 mA."
    comprobar:
      - { n_led: 3 }

  - id: pregunta-masas
    tipo: pregunta
    titulo: "Ocho masas"
    texto: "La cabecera tiene masas repartidas. ¿Por qué conviene usarlas todas?"
    libro: [47]
    widget:
      tipo: figura
      figura: fig-18.4
      zonas:
        - { id: cabecera, rotulo: "La cabecera", rect: [70, 10, 160, 305] }
    opciones:
      - texto: "Reduce la inductancia del retorno"
        bien: true
        porque: "Repartir el retorno por varias masas lo acorta."
      - texto: "Para tener más corriente de 3,3 V"
        porque: "Las masas no dan corriente: son el retorno."
      - texto: "Por estética del conector"
        porque: "Tiene un motivo eléctrico: la inductancia del retorno."
    escalera:
      - "Por las masas vuelve la corriente."
    solucion: "Reduce la inductancia del retorno."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [44, 50, 52, 56]
    ideas:
      - { titulo: "No son equivalentes.", texto: "Alimentaciones, masas y pines de doble función: un bus consume sus pines." }
      - { titulo: "Dos numeraciones.", texto: "Pin físico y número de GPIO no coinciden." }
      - { titulo: "El arranque.", texto: "Los pines no están donde el programa los deja: resistencia externa." }
      - { titulo: "Sin analógicas.", texto: "Para medir tensiones, un convertidor externo por I²C o SPI." }
