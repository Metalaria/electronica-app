# Lección 1.2 de la sección 17.4 «Aplicaciones y Proyectos» (cap18; etiquetas sec-18.N = impresas 17.N).
# - Qué proyectos justifican un ordenador de placa y cuáles no, sobre la figura 17.8 (fig-18.8, fichero 18.7.svg);
#   las preguntas de clasificación usan la figura 17.2 (fig-18.2), que no lleva las respuestas escritas.
# - Sin modelo numérico.
leccion: cap18/sec-18.4

libro:
  99: "Un microcontrolador no puede, y aquí el ordenador de placa aporta cámara, bibliotecas y potencia"
  100: "Ficheros, base de datos y red, tres cosas que el sistema operativo trae hechas"
  106: "un microcontrolador con un reloj de tiempo real lo hace con menos consumo"
  107: "un microcontrolador con wifi lo hace mejor"
  108: "exige temporización que el sistema operativo no garantiza"
  109: "usar un ordenador de placa funciona y añade fragilidad"
  112: "La aplicación como servicio del sistema, que arranca sola, se reinicia si falla y registra lo que hace"
  113: "Configuración separada del código"
  114: "Registro con rotación, para que no llene el disco"
  115: "evita necesitar pantalla y teclado"
  121: "que arranque solo y recupere su estado, sin intervención"
  123: "dejarlo funcionando una semana y ver qué pasa"
  124: "Una semana los saca casi todos"
  125: "Qué proyectos justifican un ordenador de placa y cuáles no"
  "cap18#39": "con la pregunta que decide"

modelo: { valores: {}, calculos: {} }

tarjetas:
  - id: explore-proyectos
    tipo: explorar
    titulo: "Los que lo justifican"
    texto: "Unos proyectos piden un sistema operativo; otros solo lo soportan. Toque los dos recuadros y el de abajo."
    libro: [99, 100, 109, 125]
    widget:
      tipo: figura
      figura: fig-18.8
      zonas:
        - { id: si, rotulo: "Recuadro verde, a la izquierda", rect: [10, 5, 210, 142], texto: "Visión, registro y servidor de datos, pasarelas, interfaz táctil y procesado pesado." }
        - { id: no, rotulo: "Recuadro rojo, a la derecha", rect: [234, 5, 210, 142], texto: "Un relé a una hora, un sensor a internet o un motor: funciona, pero añade fragilidad." }
        - { id: prever, rotulo: "Recuadro naranja, abajo", rect: [10, 158, 434, 96], texto: "Acceso remoto, actualizaciones, copias y el arranque tras un corte, desde el principio." }
    requiere: { mover: [si, no] }

  - id: empareje-proyectos
    tipo: pregunta
    titulo: "Cada proyecto, su plataforma"
    texto: "Empareje cada proyecto con lo que mejor lo resuelve."
    libro: [99, 106, 107, 108, "cap18#39"]
    widget:
      tipo: figura
      figura: fig-18.2
      zonas:
        - { id: pregunta, rotulo: "Recuadro naranja, abajo", rect: [10, 173, 434, 75] }
    emparejar:
      - ["Contar piezas con una cámara", "Ordenador de placa"]
      - ["Encender un relé a una hora", "Microcontrolador con reloj de tiempo real"]
      - ["Leer un sensor y enviarlo a internet", "Microcontrolador con wifi"]
      - ["Controlar un motor", "Microcontrolador, por su temporización"]
    exito: "Solo la visión pide de verdad un sistema operativo; en los otros tres, añade fragilidad."
    pistas:
      - { texto: "Un microcontrolador no puede procesar imágenes." }
    escalera:
      - "¿Cuál necesita cámara, bibliotecas y potencia?"
    solucion: "Cámara, ordenador de placa; relé, reloj de tiempo real; internet, wifi; motor, microcontrolador."

  - id: empareje-estructura
    tipo: pregunta
    titulo: "La estructura que funciona"
    texto: "Empareje cada decisión con lo que consigue."
    libro: [112, 113, 114, 115]
    widget:
      tipo: figura
      figura: fig-18.8
      zonas:
        - { id: si, rotulo: "Recuadro verde, a la izquierda", rect: [10, 5, 210, 142] }
    emparejar:
      - ["La aplicación como servicio", "Arranca sola y se reinicia si falla"]
      - ["La configuración separada", "Se cambia sin recompilar"]
      - ["El registro con rotación", "No llena el disco"]
      - ["La interfaz web", "Sin pantalla ni teclado"]
    exito: "Y un microcontrolador para lo crítico, si hay algo con requisitos temporales."
    pistas:
      - { texto: "Un registro que crece sin límite acaba con el disco." }
    escalera:
      - "El servicio del sistema se ocupa de arrancar y reiniciar."
    solucion: "Servicio, arranca solo; configuración, sin recompilar; rotación, disco; web, sin pantalla."

  - id: predecir-registro
    tipo: predecir
    titulo: "A los meses"
    texto: "Su registrador guarda un fichero de registro que nunca rota. ¿Qué espera a los meses?"
    libro: [114]
    widget:
      tipo: figura
      figura: fig-18.8
      zonas:
        - { id: prever, rotulo: "Recuadro naranja, abajo", rect: [10, 158, 434, 96] }
    opciones:
      - texto: "Que se llene el disco y falle"
        bien: true
        porque: "Es una causa real de fallo a los meses: el registro necesita rotación."
      - texto: "Nada: el sistema borra lo viejo"
        porque: "Solo si se ha previsto la rotación; si no, el disco se llena."
      - texto: "Que vaya más lento, sin fallar"
        porque: "Cuando el disco se llena, el aparato falla."
    escalera:
      - "Un fichero que solo crece, en un disco finito."
    solucion: "Se llena el disco."

  - id: pregunta-corte
    tipo: pregunta
    titulo: "Tras un corte"
    texto: "El aparato está instalado lejos y se va la luz. ¿Qué debe hacer al volver?"
    libro: [121]
    widget:
      tipo: figura
      figura: fig-18.8
      zonas:
        - { id: prever, rotulo: "Recuadro naranja, abajo", rect: [10, 158, 434, 96] }
    opciones:
      - texto: "Arrancar solo y recuperar su estado"
        bien: true
        porque: "Sin intervención: hay que preverlo desde el principio."
      - texto: "Esperar a que alguien lo reinicie"
        porque: "Instalado, nadie va a estar allí: debe arrancar solo."
      - texto: "Volver a la configuración de fábrica"
        porque: "Debe recuperar su estado, no perderlo."
    escalera:
      - "¿Quién va a estar allí cuando vuelva la luz?"
    solucion: "Arrancar solo y recuperar su estado."

  - id: pregunta-banco
    tipo: pregunta
    titulo: "En el banco"
    texto: "¿Cuál es la prueba que valida un proyecto de este tipo y que casi siempre se salta?"
    libro: [123, 124]
    widget:
      tipo: figura
      figura: fig-18.8
      zonas:
        - { id: prever, rotulo: "Recuadro naranja, abajo", rect: [10, 158, 434, 96] }
    opciones:
      - texto: "Dejarlo funcionando una semana"
        bien: true
        porque: "Los fallos llegan con el disco lleno, la red que cae o una actualización: una semana los saca casi todos."
      - texto: "Probarlo cinco minutos con todo conectado"
        porque: "Estos fallos no aparecen en cinco minutos."
      - texto: "Medir el arranque"
        porque: "Importa, pero no revela los fallos que llegan con el tiempo."
    escalera:
      - "Los fallos de estos sistemas tardan en aparecer."
    solucion: "Dejarlo funcionando una semana."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [99, 109, 112, 124]
    ideas:
      - { titulo: "Sí lo justifican.", texto: "Visión, datos con servidor, pasarelas, interfaz rica y procesado pesado." }
      - { titulo: "No lo justifican.", texto: "Un relé a una hora, un sensor a internet, un motor." }
      - { titulo: "Bien organizado.", texto: "Servicio, configuración aparte, registro con rotación e interfaz web." }
      - { titulo: "Una semana.", texto: "La prueba que saca casi todos los fallos." }
