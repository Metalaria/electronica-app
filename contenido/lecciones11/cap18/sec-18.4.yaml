# Lección 1.2 de la sección 17.4 «Aplicaciones y Proyectos» (cap18; etiquetas sec-18.N = impresas 17.N).
# - Qué proyectos justifican un ordenador de placa y cuáles no, sobre la figura 17.8 (fig-18.8, fichero 18.7.svg);
#   las preguntas de clasificación usan la figura 17.2 (fig-18.2), que no lleva las respuestas escritas.
# - Sin modelo numérico.
# 1.2.1 (autor121-sens, «aprender haciendo», GUIA §13): en la foto de la familia Raspberry Pi (fig-18.3) se tocan
# las placas que pueden contar piezas con una cámara, la que enciende mejor un relé a una hora y la que controla un
# motor; se escribe cuánto crece en un año un registro de texto sin rotación (bloque 258 de la sección 17.10). El corte
# de luz pasa al resumen. Quedan una pregunta de opciones (el banco) y la estructura, por emparejar. Sección de
# criterios: 4 de 6 haciendo.
# 1.3 (contenido13): la exploración de la figura lleva objetivo de zonas («explorar sin modelo», GUIA §13.3): 4/7 → 5/7.
leccion: cap18/sec-18.4

libro:
  99: "Un microcontrolador no puede, y aquí el ordenador de placa aporta cámara, bibliotecas y potencia"
  100: "Ficheros, base de datos y red, tres cosas que el sistema operativo trae hechas"
  106: "un microcontrolador con un reloj de tiempo real lo hace con menos consumo"
  108: "exige temporización que el sistema operativo no garantiza"
  109: "usar un ordenador de placa funciona y añade fragilidad"
  112: "La aplicación como servicio del sistema, que arranca sola, se reinicia si falla y registra lo que hace"
  113: "Configuración separada del código"
  114: "Registro con rotación, para que no llene el disco"
  115: "evita necesitar pantalla y teclado"
  121: "que arranque solo y recupere su estado, sin intervención"
  123: "dejarlo funcionando una semana y ver qué pasa"
  124: "Una semana los saca casi todos"
  125: "Qué proyectos justifican un ordenador de placa y cuáles no"
  "cap18#40": "La familia Raspberry Pi a la misma escala"
  "cap18#258": "Son cuatro medidas cada 10 s"

modelo:
  valores:
    n_m: { sim: "n", nombre: "medidas cada 10 s", unidad: "", valor: 4 }
    b_l: { sim: "b", nombre: "bytes por línea", unidad: "", valor: 35 }
    d_an: { sim: "d", nombre: "días de un año", unidad: "", valor: 365 }
  calculos:
    f_dia: { expr: "n_m*86400/10", sim: "N_{día}", nombre: "líneas al día", unidad: "" }
    b_ano: { expr: "f_dia*d_an*b_l", sim: "B_{año}", nombre: "bytes al año", unidad: B }

tarjetas:
  - id: explore-proyectos
    tipo: explorar
    titulo: "Los que lo justifican"
    texto: "Unos proyectos piden un sistema operativo; otros solo lo soportan. Toque los dos recuadros y el de abajo."
    libro: [99, 100, 109, 125]
    widget:
      tipo: figura
      figura: fig-18.8
      zonas:
        - { id: si, rotulo: "Recuadro verde, a la izquierda", rect: [10, 5, 210, 142], texto: "Visión, registro y servidor de datos, pasarelas, interfaz táctil y procesado pesado." }
        - { id: no, rotulo: "Recuadro rojo, a la derecha", rect: [234, 5, 210, 142], texto: "Un relé a una hora, un sensor a internet o un motor: funciona, pero añade fragilidad." }
        - { id: prever, rotulo: "Recuadro naranja, abajo", rect: [10, 158, 434, 96], texto: "Acceso remoto, actualizaciones, copias y el arranque tras un corte, desde el principio." }
    objetivo:
      condiciones:
        - { zona: si, rotulo: "Recuadro de la izquierda" }
        - { zona: no, rotulo: "Recuadro de la derecha" }
        - { zona: prever, rotulo: "Recuadro de abajo" }
      logrado: "Unos proyectos piden un sistema operativo, otros solo lo soportan, y en los dos hay que prever desde el principio el acceso remoto, las copias y el arranque tras un corte."
      pistas:
        - { texto: "Toque los recuadros que faltan." }
    escalera:
      - "Son tres: dos arriba y uno abajo."
    solucion: "Toque los tres recuadros."

  - id: empareje-proyectos
    tipo: tocar
    titulo: "Contar piezas con una cámara"
    texto: "El proyecto es contar piezas con una cámara. Toque las placas que pueden hacerlo."
    libro: [99, "cap18#40"]
    widget:
      tipo: figura
      figura: fig-18.3
      zonas:
        - { id: pi5, rotulo: "Placa grande, arriba a la izquierda", rect: [0, 0, 770, 500] }
        - { id: zero, rotulo: "Placa mediana, abajo a la izquierda", rect: [230, 610, 570, 270] }
        - { id: pico, rotulo: "Placa estrecha, abajo a la derecha", rect: [910, 650, 460, 190] }
    tocar:
      bien: [pi5, zero]
      todas: true
      porque:
        pico: "Un microcontrolador no puede procesar imágenes."
    exito: "Las dos con sistema operativo: cámara, bibliotecas y potencia. La visión artificial lo justifica claramente."
    escalera:
      - "Hacen falta bibliotecas de imagen y potencia de cálculo."
    solucion: "La Pi 5 y la Zero 2 W."

  - id: toque-rele-hora
    tipo: tocar
    titulo: "Un relé a una hora"
    texto: "El proyecto es encender un relé a una hora fija, con un reloj de tiempo real. Toque la placa que lo hace mejor."
    libro: [106, 109, "cap18#40"]
    widget:
      tipo: figura
      figura: fig-18.3
      zonas:
        - { id: pi5, rotulo: "Placa grande, arriba a la izquierda", rect: [0, 0, 770, 500] }
        - { id: zero, rotulo: "Placa mediana, abajo a la izquierda", rect: [230, 610, 570, 270] }
        - { id: pico, rotulo: "Placa estrecha, abajo a la derecha", rect: [910, 650, 460, 190] }
    tocar:
      bien: [pico]
      porque:
        pi5: "Funciona y añade fragilidad: arranque lento, tarjeta que se corrompe, actualizaciones y consumo."
        zero: "Pequeña, pero con el mismo sistema operativo que mantener."
    exito: "Un microcontrolador con un reloj de tiempo real: menos consumo, arranque instantáneo y sin tarjeta que se corrompa."
    escalera:
      - "¿Pide algo que solo da un sistema operativo?"
    solucion: "La Pico."

  - id: toque-motor
    tipo: tocar
    titulo: "Controlar un motor"
    texto: "El proyecto es controlar un motor. Toque la placa que le garantiza la temporización."
    libro: [108, "cap18#40"]
    widget:
      tipo: figura
      figura: fig-18.3
      zonas:
        - { id: pi5, rotulo: "Placa grande, arriba a la izquierda", rect: [0, 0, 770, 500] }
        - { id: zero, rotulo: "Placa mediana, abajo a la izquierda", rect: [230, 610, 570, 270] }
        - { id: pico, rotulo: "Placa estrecha, abajo a la derecha", rect: [910, 650, 460, 190] }
    tocar:
      bien: [pico]
      porque:
        pi5: "El planificador puede interrumpir cualquier cosa: la temporización no está garantizada."
        zero: "El mismo sistema operativo, el mismo planificador."
    exito: "El microcontrolador: el motor exige temporización que el sistema operativo no garantiza."
    escalera:
      - "¿Quién puede interrumpir el control en una placa con sistema operativo?"
    solucion: "La Pico."

  - id: empareje-estructura
    tipo: pregunta
    titulo: "La estructura que funciona"
    texto: "Empareje cada decisión con lo que consigue."
    libro: [112, 113, 114, 115]
    widget:
      tipo: figura
      figura: fig-18.8
      zonas:
        - { id: si, rotulo: "Recuadro verde, a la izquierda", rect: [10, 5, 210, 142] }
    emparejar:
      - ["La aplicación como servicio", "Arranca sola y se reinicia si falla"]
      - ["La configuración separada", "Se cambia sin recompilar"]
      - ["El registro con rotación", "No llena el disco"]
      - ["La interfaz web", "Sin pantalla ni teclado"]
    exito: "Y un microcontrolador para lo crítico, si hay algo con requisitos temporales."
    pistas:
      - { texto: "Un registro que crece sin límite acaba con el disco." }
    escalera:
      - "El servicio del sistema se ocupa de arrancar y reiniciar."
    solucion: "Servicio, arranca solo; configuración, sin recompilar; rotación, disco; web, sin pantalla."

  - id: predecir-registro
    tipo: leer
    titulo: "A los meses"
    texto: "Un registrador guarda en texto cuatro medidas cada 10 s, unos 35 bytes por línea, y el fichero nunca rota. Escriba cuánto crece en un año."
    libro: [114, "cap18#258"]
    widget:
      tipo: figura
      figura: fig-18.8
      zonas:
        - { id: si, rotulo: "Recuadro verde, a la izquierda", rect: [10, 5, 210, 142], texto: "Registro y servidor de datos: lo justifica." }
    leer:
      objetivo: b_ano
      unidad: B
      tol: 0.05
      rotulo: "Crecimiento en un año"
      errores:
        - { expr: "f_dia*b_l", texto: "Eso es lo de un día; el año tiene 365." }
    exito: "Unos 450 MB al año, sin parar: un registro sin rotación llena el disco a los meses. Es una causa real de fallo."
    escalera:
      - "Cuatro cada 10 s son 34 560 líneas al día."
      - "Por 365 días y por 35 bytes."
    solucion: "34 560 · 365 · 35 B ≈ 450 MB."
    comprobar:
      - { f_dia: 34560, b_ano: 441504000, d_an: 365, tol: 0.03 }

  - id: pregunta-banco
    tipo: pregunta
    titulo: "En el banco"
    texto: "¿Cuál es la prueba que valida un proyecto de este tipo y que casi siempre se salta?"
    libro: [123, 124]
    widget:
      tipo: figura
      figura: fig-18.8
      zonas:
        - { id: prever, rotulo: "Recuadro naranja, abajo", rect: [10, 158, 434, 96] }
    opciones:
      - texto: "Dejarlo funcionando una semana"
        bien: true
        porque: "Los fallos llegan con el disco lleno, la red que cae o una actualización: una semana los saca casi todos."
      - texto: "Probarlo cinco minutos con todo conectado"
        porque: "Estos fallos no aparecen en cinco minutos."
      - texto: "Medir el arranque"
        porque: "Importa, pero no revela los fallos que llegan con el tiempo."
    escalera:
      - "Los fallos de estos sistemas tardan en aparecer."
    solucion: "Dejarlo funcionando una semana."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [99, 112, 121, 124]
    ideas:
      - { titulo: "Sí lo justifican.", texto: "Visión, datos con servidor, pasarelas, interfaz rica y procesado pesado." }
      - { titulo: "Prever.", texto: "Acceso remoto, actualizaciones, copias y que arranque solo tras un corte." }
      - { titulo: "Bien organizado.", texto: "Servicio, configuración aparte, registro con rotación e interfaz web." }
      - { titulo: "Una semana.", texto: "La prueba que saca casi todos los fallos." }
