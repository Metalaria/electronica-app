# Lección 1.2 de la sección 17.5 «Microcontrolador frente a Microprocesador: Cuándo Cada Uno» (cap18; sec-18.N = 17.N).
# - La tabla de decisión y la arquitectura de los dos sobre la figura 17.9 (fig-18.9, fichero 18.8.svg), con zonas.
# - Sin modelo numérico.
# Paso práctico: «tocar» la parte de la arquitectura mixta que sigue controlando si el ordenador se cuelga.
leccion: cap18/sec-18.5

libro:
  128: "la mayoría de las malas decisiones vienen de pedirle a uno lo que el otro hace bien"
  129: "uno ejecuta un programa y el otro ejecuta un sistema operativo"
  131: "El planificador puede interrumpir el programa en cualquier momento y durante milisegundos"
  132: "una Pi tarda decenas de segundos en arrancar Linux"
  133: "un corte de alimentación puede corromper la tarjeta"
  135: "unos 600 mA una Raspberry Pi 4 sin hacer nada"
  137: "Temporización de microsegundos"
  140: "Un enlace serie entre ambos con un protocolo robusto"
  141: "si el ordenador se cuelga o se reinicia, el microcontrolador sigue controlando el proceso"
  144: "cubre el 80 % de lo que se pedía a un ordenador de placa"
  146: "cronometrar la tarea crítica en el candidato más sencillo"
  147: "Comparación de capacidades entre microcontrolador y ordenador de placa."

modelo: { valores: {}, calculos: {} }

tarjetas:
  - id: explore-dos
    tipo: explorar
    titulo: "No compiten"
    texto: "Uno ejecuta un programa; el otro, un sistema operativo. Toque la tabla y los recuadros."
    libro: [128, 129, 137, 147]
    widget:
      tipo: figura
      figura: fig-18.9
      zonas:
        - { id: tabla, rotulo: "La tabla de la izquierda", rect: [5, 15, 275, 210], texto: "Tiempo real, arranque, consumo y coste, para el microcontrolador; red, ficheros, vídeo, para el ordenador." }
        - { id: micro, rotulo: "Recuadro verde, a la derecha", rect: [294, 32, 151, 47], texto: "El microcontrolador se ocupa del tiempo real: sensores, señales, actuadores, seguridad." }
        - { id: placa, rotulo: "Recuadro azul, a la derecha", rect: [294, 118, 151, 46], texto: "El ordenador de placa, de lo demás: red, almacenamiento, interfaz y procesado pesado." }
        - { id: intermedio, rotulo: "Recuadro naranja, abajo a la derecha", rect: [294, 205, 151, 36], texto: "El caso intermedio: microcontroladores con red, como el ESP32." }
    requiere: { mover: [tabla, micro, placa] }

  - id: empareje-so
    tipo: pregunta
    titulo: "Lo que cambia con un sistema operativo"
    texto: "Empareje cada aspecto con lo que supone tener sistema operativo."
    libro: [131, 132, 133, 135]
    widget:
      tipo: figura
      figura: fig-18.9
      zonas:
        - { id: tabla, rotulo: "La tabla de la izquierda", rect: [5, 15, 275, 210] }
    emparejar:
      - ["Multitarea", "Interrupciones de milisegundos en cualquier momento"]
      - ["Arranque", "Decenas de segundos"]
      - ["Sistema de ficheros", "Una ventaja, y la tarjeta que se corrompe"]
      - ["Consumo", "Unos 600 mA sin hacer nada"]
    exito: "La diferencia de fondo no es la potencia, sino programa frente a sistema operativo."
    pistas:
      - { texto: "El planificador es lo que hace imposible la temporización estricta." }
    escalera:
      - "Una Raspberry Pi 4 parada sigue gastando cientos de miliamperios."
    solucion: "Multitarea, milisegundos; arranque, decenas de segundos; ficheros, tarjeta; consumo, 600 mA."

  - id: pregunta-pilas
    tipo: pregunta
    titulo: "Meses a pilas"
    texto: "Un nodo debe funcionar meses con pilas. ¿Qué lo puede hacer?"
    libro: [135]
    widget:
      tipo: figura
      figura: fig-18.9
      zonas:
        - { id: tabla, rotulo: "La tabla de la izquierda", rect: [5, 15, 275, 210] }
    opciones:
      - texto: "Solo un microcontrolador"
        bien: true
        porque: "Microamperios durmiendo frente a unos 600 mA de una Pi 4 en reposo: la diferencia más brutal."
      - texto: "Un ordenador de placa con pilas grandes"
        porque: "Con cientos de miliamperios en reposo, no dura meses."
      - texto: "Cualquiera de los dos"
        porque: "El consumo los separa por completo."
    escalera:
      - "Compare el consumo en reposo de los dos."
    solucion: "Solo un microcontrolador."

  - id: toque-sigue
    tipo: tocar
    titulo: "Si el ordenador se cuelga"
    texto: "En la arquitectura con los dos, toque la parte que sigue controlando el proceso si el ordenador se cuelga."
    libro: [140, 141]
    widget:
      tipo: figura
      figura: fig-18.9
      zonas:
        - { id: micro, rotulo: "Recuadro verde, a la derecha", rect: [294, 32, 151, 47] }
        - { id: placa, rotulo: "Recuadro azul, a la derecha", rect: [294, 118, 151, 46] }
        - { id: intermedio, rotulo: "Recuadro naranja, abajo a la derecha", rect: [294, 205, 151, 36] }
    tocar:
      bien: [micro]
      porque:
        placa: "Es el que se cuelga o se reinicia en este caso."
        intermedio: "Es otra opción, no una parte de la arquitectura de los dos."
    exito: "La parte crítica no depende de la compleja: es lo que hace falta en un sistema seguro."
    escalera:
      - "¿Cuál de los dos se ocupa del tiempo real y la seguridad?"
    solucion: "El microcontrolador."

  - id: pregunta-enlace
    tipo: pregunta
    titulo: "Cómo se hablan"
    texto: "Microcontrolador y ordenador de placa trabajan juntos. ¿Cómo se comunican?"
    libro: [140]
    widget:
      tipo: figura
      figura: fig-18.9
      zonas:
        - { id: enlace, rotulo: "Entre los dos recuadros", rect: [294, 80, 151, 36] }
    opciones:
      - texto: "Por un enlace serie con un protocolo robusto"
        bien: true
        porque: "Cada uno a lo suyo, unidos por un enlace serie."
      - texto: "Compartiendo la misma tarjeta"
        porque: "No comparten almacenamiento: se unen por un enlace serie."
      - texto: "Por GPIO sueltos, bit a bit"
        porque: "Lo habitual es un enlace serie con un protocolo robusto."
    escalera:
      - "Mire la flecha entre los dos recuadros."
    solucion: "Un enlace serie con un protocolo robusto."

  - id: pregunta-intermedio
    tipo: pregunta
    titulo: "Un proyecto conectado"
    texto: "Para la mayoría de los proyectos conectados, ¿cuál es hoy la elección correcta?"
    libro: [144]
    widget:
      tipo: figura
      figura: fig-18.9
      zonas:
        - { id: intermedio, rotulo: "Recuadro naranja, abajo a la derecha", rect: [294, 205, 151, 36] }
    opciones:
      - texto: "Un microcontrolador con red, como el ESP32"
        bien: true
        porque: "Cubre el 80 % de lo que se pedía a un ordenador de placa, con determinismo y bajo consumo."
      - texto: "Siempre un ordenador de placa"
        porque: "Se reserva para vídeo, bases de datos, imagen o servicios de red complejos."
      - texto: "Un microcontrolador sin red y un módem"
        porque: "Los microcontroladores con red integrada ya lo resuelven."
    escalera:
      - "Hay una categoría entre los dos."
    solucion: "Un microcontrolador con red."

  - id: pregunta-banco
    tipo: pregunta
    titulo: "En el banco"
    texto: "¿Qué medida orienta la decisión antes de elegir?"
    libro: [146]
    widget:
      tipo: figura
      figura: fig-18.9
      zonas:
        - { id: tabla, rotulo: "La tabla de la izquierda", rect: [5, 15, 275, 210] }
    opciones:
      - texto: "Cronometrar la tarea crítica en el candidato más sencillo"
        bien: true
        porque: "Si la cumple con margen, no hay razón para complicarse; si no, ninguna optimización lo arregla."
      - texto: "Comparar los megahercios"
        porque: "La diferencia de fondo no es la potencia: es la tarea crítica, medida."
      - texto: "Probar primero en el más potente"
        porque: "Se empieza por el más sencillo: si cumple, sobra lo demás."
    escalera:
      - "Empiece por lo más sencillo."
    solucion: "Cronometrar la tarea crítica en el candidato más sencillo."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [129, 135, 141, 144]
    ideas:
      - { titulo: "Programa o sistema operativo.", texto: "Esa es la diferencia de fondo, no la potencia." }
      - { titulo: "La tabla.", texto: "Tiempo real, arranque, µA y coste; o red, ficheros y vídeo." }
      - { titulo: "Los dos.", texto: "El micro, el tiempo real; el ordenador, lo demás; un enlace serie." }
      - { titulo: "El caso intermedio.", texto: "Micro con red: el 80 % de los proyectos conectados." }
