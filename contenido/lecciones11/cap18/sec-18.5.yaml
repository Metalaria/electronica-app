# Lección 1.2 de la sección 17.5 «Microcontrolador frente a Microprocesador: Cuándo Cada Uno» (cap18; sec-18.N = 17.N).
# - La tabla de decisión y la arquitectura de los dos sobre la figura 17.9 (fig-18.9, fichero 18.8.svg), con zonas.
# - Sin modelo numérico.
# Paso práctico: «tocar» la parte de la arquitectura mixta que sigue controlando si el ordenador se cuelga.
# 1.2.1 (autor121-sens, «aprender haciendo», GUIA §13): en la tabla de la figura 17.9 (filas de 18.8.py, de dos en
# dos: 48 px) se tocan las filas que deciden un equipo con vídeo y base de datos y un nodo a pilas barato; en los
# recuadros, la parte que sigue controlando y la elección para un proyecto conectado. Quedan dos preguntas de opciones:
# el enlace. En el banco se toca en la foto de la familia (fig-18.3) el candidato más sencillo.
leccion: cap18/sec-18.5

libro:
  134: "Red y protocolos de alto nivel resueltos"
  143: "Entre ambos hay una categoría que ha crecido mucho"
  128: "la mayoría de las malas decisiones vienen de pedirle a uno lo que el otro hace bien"
  129: "uno ejecuta un programa y el otro ejecuta un sistema operativo"
  131: "El planificador puede interrumpir el programa en cualquier momento y durante milisegundos"
  132: "una Pi tarda decenas de segundos en arrancar Linux"
  133: "un corte de alimentación puede corromper la tarjeta"
  135: "unos 600 mA una Raspberry Pi 4 sin hacer nada"
  137: "Temporización de microsegundos"
  140: "Un enlace serie entre ambos con un protocolo robusto"
  141: "si el ordenador se cuelga o se reinicia, el microcontrolador sigue controlando el proceso"
  144: "cubre el 80 % de lo que se pedía a un ordenador de placa"
  146: "cronometrar la tarea crítica en el candidato más sencillo"
  147: "Comparación de capacidades entre microcontrolador y ordenador de placa."
  "cap18#40": "La familia Raspberry Pi a la misma escala"

modelo: { valores: {}, calculos: {} }

tarjetas:
  - id: explore-dos
    tipo: explorar
    titulo: "No compiten"
    texto: "Uno ejecuta un programa; el otro, un sistema operativo. Toque la tabla y los recuadros."
    libro: [128, 129, 137, 147]
    widget:
      tipo: figura
      figura: fig-18.9
      zonas:
        - { id: tabla, rotulo: "La tabla de la izquierda", rect: [5, 15, 275, 210], texto: "Tiempo real, arranque, consumo y coste, para el microcontrolador; red, ficheros, vídeo, para el ordenador." }
        - { id: micro, rotulo: "Recuadro verde, a la derecha", rect: [294, 32, 151, 47], texto: "El microcontrolador se ocupa del tiempo real: sensores, señales, actuadores, seguridad." }
        - { id: placa, rotulo: "Recuadro azul, a la derecha", rect: [294, 118, 151, 46], texto: "El ordenador de placa, de lo demás: red, almacenamiento, interfaz y procesado pesado." }
        - { id: intermedio, rotulo: "Recuadro naranja, abajo a la derecha", rect: [294, 205, 151, 36], texto: "El caso intermedio: microcontroladores con red, como el ESP32." }
    requiere: { mover: [tabla, micro, placa] }

  - id: empareje-so
    tipo: tocar
    titulo: "Lo que pide un sistema operativo"
    texto: "Un equipo debe mostrar vídeo y guardar sus datos en una base de datos. Toque las filas de la tabla que lo deciden."
    libro: [131, 132, 133, 134, 137, 147]
    widget:
      tipo: figura
      figura: fig-18.9
      zonas:
        - { id: r01, rotulo: "Filas primera y segunda", rect: [4, 35, 275, 48] }
        - { id: r23, rotulo: "Filas tercera y cuarta", rect: [4, 83, 275, 48] }
        - { id: r45, rotulo: "Filas quinta y sexta", rect: [4, 131, 275, 48] }
        - { id: r67, rotulo: "Filas séptima y octava", rect: [4, 179, 275, 48] }
    tocar:
      bien: [r45, r67]
      todas: true
      porque:
        r01: "Tiempo real y arranque: ahí gana el microcontrolador, y este equipo no lo pide."
        r23: "Consumo y coste: tampoco es lo que pide este equipo."
    exito: "Ficheros y bases de datos, vídeo e imagen: lo que el sistema operativo trae hecho. Su precio: el planificador, decenas de segundos de arranque y una tarjeta que se corrompe."
    escalera:
      - "Busque las filas donde el ordenador de placa dice «Sí»."
    solucion: "Las cuatro de abajo: red, ficheros, vídeo y actualización."

  - id: pregunta-pilas
    tipo: tocar
    titulo: "Meses a pilas"
    texto: "Un nodo debe funcionar meses con pilas, y costar poco. Toque las filas de la tabla que lo deciden."
    libro: [135, 137, 147]
    widget:
      tipo: figura
      figura: fig-18.9
      zonas:
        - { id: r01, rotulo: "Filas primera y segunda", rect: [4, 35, 275, 48] }
        - { id: r23, rotulo: "Filas tercera y cuarta", rect: [4, 83, 275, 48] }
        - { id: r45, rotulo: "Filas quinta y sexta", rect: [4, 131, 275, 48] }
        - { id: r67, rotulo: "Filas séptima y octava", rect: [4, 179, 275, 48] }
    tocar:
      bien: [r23]
      porque:
        r01: "El tiempo real y el arranque no deciden la duración de las pilas."
        r45: "Red y ficheros son lo que da un sistema operativo; este nodo no los pide."
        r67: "Vídeo y actualización compleja: no es lo que pide este nodo."
    exito: "Consumo de µA y coste: solo un microcontrolador. Una Pi 4 sin hacer nada gasta unos 600 mA: la diferencia más brutal."
    escalera:
      - "¿Qué fila habla de microamperios?"
    solucion: "Consumo y coste."

  - id: toque-sigue
    tipo: tocar
    titulo: "Si el ordenador se cuelga"
    texto: "En la arquitectura con los dos, toque la parte que sigue controlando el proceso si el ordenador se cuelga."
    libro: [140, 141]
    widget:
      tipo: figura
      figura: fig-18.9
      zonas:
        - { id: micro, rotulo: "Recuadro verde, a la derecha", rect: [294, 32, 151, 47] }
        - { id: placa, rotulo: "Recuadro azul, a la derecha", rect: [294, 118, 151, 46] }
        - { id: intermedio, rotulo: "Recuadro naranja, abajo a la derecha", rect: [294, 205, 151, 36] }
    tocar:
      bien: [micro]
      porque:
        placa: "Es el que se cuelga o se reinicia en este caso."
        intermedio: "Es otra opción, no una parte de la arquitectura de los dos."
    exito: "La parte crítica no depende de la compleja: es lo que hace falta en un sistema seguro."
    escalera:
      - "¿Cuál de los dos se ocupa del tiempo real y la seguridad?"
    solucion: "El microcontrolador."

  - id: pregunta-enlace
    tipo: pregunta
    titulo: "Cómo se hablan"
    texto: "Microcontrolador y ordenador de placa trabajan juntos. ¿Cómo se comunican?"
    libro: [140]
    widget:
      tipo: figura
      figura: fig-18.9
      zonas:
        - { id: enlace, rotulo: "Entre los dos recuadros", rect: [294, 80, 151, 36] }
    opciones:
      - texto: "Por un enlace serie con un protocolo robusto"
        bien: true
        porque: "Cada uno a lo suyo, unidos por un enlace serie."
      - texto: "Compartiendo la misma tarjeta"
        porque: "No comparten almacenamiento: se unen por un enlace serie."
      - texto: "Por GPIO sueltos, bit a bit"
        porque: "Lo habitual es un enlace serie con un protocolo robusto."
    escalera:
      - "Mire la flecha entre los dos recuadros."
    solucion: "Un enlace serie con un protocolo robusto."

  - id: pregunta-intermedio
    tipo: tocar
    titulo: "Un proyecto conectado"
    texto: "Para la mayoría de los proyectos conectados hay hoy una elección correcta. Toque dónde está."
    libro: [143, 144]
    widget:
      tipo: figura
      figura: fig-18.9
      zonas:
        - { id: micro, rotulo: "Recuadro verde, a la derecha", rect: [294, 32, 151, 47] }
        - { id: placa, rotulo: "Recuadro azul, a la derecha", rect: [294, 118, 151, 46] }
        - { id: intermedio, rotulo: "Recuadro naranja, abajo a la derecha", rect: [294, 205, 151, 36] }
    tocar:
      bien: [intermedio]
      porque:
        micro: "Un microcontrolador sin red obliga a implementar TCP/IP: considerablemente más trabajo."
        placa: "Se reserva para vídeo, bases de datos, imagen o servicios de red complejos."
    exito: "Un microcontrolador con red, como el ESP32: cubre el 80 % de lo que se pedía a un ordenador de placa, con determinismo y bajo consumo."
    escalera:
      - "Hay una categoría entre los dos."
    solucion: "El recuadro naranja: microcontroladores con red."

  - id: pregunta-banco
    tipo: tocar
    titulo: "En el banco"
    texto: "Antes de elegir, se cronometra la tarea crítica en el candidato más sencillo. Toque con cuál empieza."
    libro: [146, "cap18#40"]
    widget:
      tipo: figura
      figura: fig-18.3
      zonas:
        - { id: pi5, rotulo: "Placa grande, arriba a la izquierda", rect: [0, 0, 770, 500] }
        - { id: zero, rotulo: "Placa mediana, abajo a la izquierda", rect: [230, 610, 570, 270] }
        - { id: pico, rotulo: "Placa estrecha, abajo a la derecha", rect: [910, 650, 460, 190] }
    tocar:
      bien: [pico]
      porque:
        pi5: "Es el candidato más complejo: se prueba solo si el sencillo no cumple."
        zero: "Lleva un sistema operativo entero: no es el más sencillo."
    exito: "El microcontrolador. Si cumple la tarea con margen, no hay razón para complicarse; si no la cumple, ninguna optimización lo arreglará."
    escalera:
      - "¿Cuál no lleva sistema operativo?"
    solucion: "La Pico, un microcontrolador."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [129, 135, 141, 144]
    ideas:
      - { titulo: "Programa o sistema operativo.", texto: "Esa es la diferencia de fondo, no la potencia." }
      - { titulo: "La tabla.", texto: "Tiempo real, arranque, µA y coste; o red, ficheros y vídeo." }
      - { titulo: "Los dos.", texto: "El micro, el tiempo real; el ordenador, lo demás; un enlace serie." }
      - { titulo: "El caso intermedio.", texto: "Micro con red: el 80 % de los proyectos conectados." }
