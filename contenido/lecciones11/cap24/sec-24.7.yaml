# Lección 1.2 de la sección 23.7 «Resonancia Serie y Paralelo, Admitancia y los Límites del Q» (cap24).
# Formato: contenido/lecciones11/GUIA.md. El RLC serie del ajuste es el de la práctica 9 (cap22#235: 100 Ω, 10 mH,
# 100 nF). El tanque usa la misma L y C con unas pérdidas de 63,2 kΩ para el Q propio de 200 del libro (bloque 179) y
# resistencias de fuente de 1 MΩ, 70 kΩ y 7 kΩ, ilustrativas, hasta el Q cargado de 20. La admitancia es la del
# bloque 199 (R = 100 Ω, X = +140 Ω), con la bobina de 22,28 mH a 1 kHz que da esos 140 Ω (ilustrativa).
leccion: cap24/sec-24.7

libro:
  165: "Es un circuito aceptador: deja pasar su frecuencia."
  166: "Es un circuito rechazador, o tanque"
  167: "la corriente entre L y C no se cancela, sino que circula entre ambos Q veces mayor que la de entrada"
  171: "Con f₀ = 1 MHz y Q = 100, la banda es de 10 kHz."
  176: "La resistencia del bobinado, que a alta frecuencia crece por el efecto pelicular"
  177: "Las pérdidas del núcleo"
  178: "Las pérdidas del dieléctrico del condensador, medidas por su factor de disipación"
  179: "un tanque con Q propio de 200 conectado a una etapa de baja impedancia puede quedarse en 20"
  180: "las etapas se acoplen ligeramente para no destruir la selectividad"
  187: "Buscando el máximo de corriente, que en un circuito de Q bajo es una curva plana y poco precisa."
  188: "Buscando el cruce de fase por cero, que es mucho más preciso."
  189: "la amplitud cae a 1/e en Q/π ciclos"
  198: 'Y = ("1")/(R + j X) = (R)/(R^("2") + X^("2")) - j (X)/(R^("2") + X^("2"))'
  199: "Con R = 100 Ω y X = +140 Ω (una bobina), G = 3,38 mS y B = −4,73 mS, mientras que 1/R serían 10 mS."
  200: "en paralelo las admitancias se suman, igual que las impedancias en serie"
  "cap22#235": "L = 10 mH, C = 100 nF, R = 100 Ω"

modelo:
  valores:
    V_p: { sim: "V_{p}", nombre: "amplitud de la fuente", unidad: V, valor: 1 }
    f_p: { sim: "f", nombre: "frecuencia de la fuente", unidad: Hz, valor: 5032.92 }
    R_ps: { sim: "R_{s}", nombre: "resistencia de la fuente", unidad: Ω, valor: 1000000 }
    L_p: { sim: "L", nombre: "inductancia del tanque", unidad: H, valor: 0.01 }
    C_p: { sim: "C", nombre: "capacidad del tanque", unidad: F, valor: 100e-9 }
    R_pp: { sim: "R_{p}", nombre: "pérdidas del tanque", unidad: Ω, valor: 63245.6 }
    f_s: { sim: "f", nombre: "frecuencia del generador", unidad: Hz, valor: 5032.92 }
    R_s: { sim: "R", nombre: "resistencia del RLC serie", unidad: Ω, valor: 100 }
    L_s: { sim: "L", nombre: "inductancia del RLC serie", unidad: H, valor: 0.01 }
    C_s: { sim: "C", nombre: "capacidad del RLC serie", unidad: F, valor: 100e-9 }
    f_g: { sim: "f", nombre: "frecuencia del RL", unidad: Hz, valor: 1000 }
    R_g: { sim: "R", nombre: "resistencia del RL", unidad: Ω, valor: 100 }
    L_g: { sim: "L", nombre: "inductancia del RL", unidad: H, valor: 0.022282 }
    Q_t: { sim: "Q", nombre: "factor de calidad del tanque que se excita", unidad: "", valor: 100 }
  calculos:
    w_p: { expr: "2*pi*f_p", sim: "ω", nombre: "frecuencia angular", unidad: "rad/s" }
    f_0: { expr: "1/(2*pi*sqrt(L_p*C_p))", sim: "f₀", nombre: "resonancia del tanque", unidad: Hz }
    Z_0: { expr: "sqrt(L_p/C_p)", sim: "Z_{0}", nombre: "impedancia característica", unidad: Ω }
    G_t: { expr: "1/R_pp + 1/R_ps", sim: "G", nombre: "conductancia total vista por el tanque", unidad: S }
    B_t: { expr: "w_p*C_p - 1/(w_p*L_p)", sim: "B", nombre: "susceptancia del tanque", unidad: S }
    A_t: { expr: "V_p/R_ps/sqrt(G_t^2 + B_t^2)", sim: "V_{t}", nombre: "amplitud del tanque", unidad: V }
    I_l: { expr: "A_t/(w_p*L_p)", sim: "I_{L}", nombre: "corriente por la bobina", unidad: A }
    I_e: { expr: "A_t*sqrt(1/R_pp^2 + B_t^2)", sim: "I", nombre: "corriente de entrada", unidad: A }
    k_i: { expr: "I_l/I_e", sim: "I_{L}/I", nombre: "cociente de corrientes", unidad: "" }
    Q_0: { expr: "R_pp/Z_0", sim: "Q₀", nombre: "Q propio del tanque", unidad: "" }
    Q_c: { expr: "par(R_pp, R_ps)/Z_0", sim: "Q_{c}", nombre: "Q cargado", unidad: "", cifras: 3 }
    I_s: { expr: "V_p/sqrt(R_s^2 + (2*pi*f_s*L_s - 1/(2*pi*f_s*C_s))^2)", sim: "I", nombre: "corriente del RLC serie", unidad: A }
    ph_s: { expr: "-atan((2*pi*f_s*L_s - 1/(2*pi*f_s*C_s))/R_s)*180/pi", sim: "φ_{I}", nombre: "fase de la corriente", unidad: "°", cifras: 3 }
    f_0s: { expr: "1/(2*pi*sqrt(L_s*C_s))", sim: "f₀", nombre: "resonancia del RLC serie", unidad: Hz }
    X_l: { expr: "2*pi*f_g*L_g", sim: "X", nombre: "reactancia de la bobina", unidad: Ω }
    G_y: { expr: "R_g/(R_g^2 + X_l^2)", sim: "G", nombre: "conductancia", unidad: S }
    B_y: { expr: "-X_l/(R_g^2 + X_l^2)", sim: "B", nombre: "susceptancia", unidad: S }
    X_2: { expr: "X_l^2", sim: "X²", nombre: "cuadrado de la reactancia", unidad: "" }
    R_2: { expr: "R_g^2", sim: "R²", nombre: "cuadrado de la resistencia", unidad: "" }
    G_mal: { expr: "1/R_g", sim: "1/R", nombre: "inversa de R", unidad: S }
    I_g: { expr: "V_p/sqrt(R_g^2 + X_l^2)", sim: "I", nombre: "corriente del RL", unidad: A }
    n_e: { expr: "Q_t/pi", sim: "n", nombre: "ciclos hasta 1/e", unidad: "", cifras: 3 }

tarjetas:
  - id: explore-tanque
    tipo: explorar
    titulo: "El tanque rechaza su frecuencia"
    texto: "Una bobina y un condensador en paralelo, alimentados a través de una resistencia. Mueva la frecuencia de la fuente y mire la corriente de entrada y la de la bobina."
    libro: [166]
    fijar: { R_ps: 1000000, R_pp: 63245.6 }
    widget:
      tipo: circuito
      esquema: rlc-paralelo
      piezas: { fuente: V_p, f: f_p, rs: R_ps, l: L_p, c: C_p, r: R_pp }
      lectura: { valor: I_e, rotulo: "Corriente de entrada" }
      datos:
        - { valor: I_l, rotulo: "Por la bobina: {{I_l}}" }
      mide: { vt_amp: A_t, i_amp: I_e, il_amp: I_l }
      mandos:
        - { valor: f_p, lista: [2000, 4000, 5032.92, 6000, 12000], rotulo: "Frecuencia" }

  - id: prediga-circula
    tipo: predecir
    titulo: "Dentro del tanque"
    texto: "En resonancia, el tanque apenas toma corriente de la fuente. ¿Cuánta circula entre la bobina y el condensador?"
    libro: [167]
    fijar: { R_ps: 1000000, R_pp: 63245.6, f_p: 5032.92 }
    widget:
      tipo: circuito
      esquema: rlc-paralelo
      piezas: { fuente: V_p, f: f_p, rs: R_ps, l: L_p, c: C_p, r: R_pp }
      lectura: { valor: k_i, rotulo: "I_{L} / I de entrada" }
      mide: { i_amp: I_e, il_amp: I_l }
      ocultar: true
    opciones:
      - texto: "Q veces la de entrada: aquí, unas 200 veces"
        bien: true
        porque: "Las corrientes de L y C se cancelan en la entrada, no dentro: la energía da vueltas entre ambos."
      - texto: "Ninguna: se cancelan"
        porque: "Se cancelan en el punto de entrada. Entre L y C circula una corriente Q veces mayor."
      - texto: "La misma que la de entrada"
        porque: "Eso sería sin resonancia. En ella, la de dentro es Q veces la de fuera."
    escalera:
      - "¿Dónde se cancelan las corrientes de L y de C?"
    solucion: "Q veces la de entrada: con Q = 200, doscientas veces."
    comprobar:
      - { Q_0: 200, k_i: 200 }

  - id: formula-admitancia
    tipo: formula
    titulo: "La admitancia de un RL"
    texto: "Invertir Z = R + jX mezcla las dos partes. Con R = 100 Ω y X = +140 Ω, cambie la frecuencia y mire G y B."
    libro: [198, 199]
    ec: 198
    sustitucion: "G = {{R_g}} / ({{R_g}}² + {{X_l}}²) = {{G_y}}; B = {{B_y}}"
    widget:
      tipo: circuito
      esquema: filtro-rl
      piezas: { fuente: V_p, f: f_g, r: R_g, l: L_g }
      lectura: { valor: G_y, rotulo: "Conductancia G" }
      datos:
        - { valor: B_y, rotulo: "Susceptancia B: {{B_y}}" }
      mide: { i_amp: I_g }
      mandos:
        - { valor: f_g, lista: [500, 1000, 2000] }
    comprobar:
      - { con: { f_g: 1000 }, X_l: 140, G_y: 0.00338, B_y: -0.00473 }

  - id: estime-g
    tipo: pregunta
    fase: "Estime"
    titulo: "No es 1/R"
    texto: "R = 100 Ω en serie con una bobina de X = +140 Ω. Estime la conductancia G del conjunto, en siemens."
    libro: [199]
    fijar: { R_g: 100, f_g: 1000, L_g: 0.022282 }
    estimar:
      objetivo: "G_y"
      unidad: S
      min: 0
      max: 0.012
      paso: 0.00005
      inicio: 0.01
      tol: 0.05
      rotulo: "Conductancia G"
    exito: "3,38 mS, no los 10 mS de 1/R: solo el módulo y el ángulo se invierten limpiamente."
    pistas:
      - { cuando: { valor: estimacion, mayor: 0.00355 }, texto: "Demasiado: ha usado 1/R. Con reactancia en serie, G = R/(R² + X²)." }
      - { texto: "Poco: G = 100/(100² + 140²)." }
    escalera:
      - "G = R/(R² + X²)."
    solucion: "100/(10 000 + 19 600) = 3,38 mS."
    comprobar:
      - { G_y: 0.00338, G_mal: 0.01, X_2: 19600, R_2: 10000 }

  - id: ajuste-fase
    tipo: ajuste
    titulo: "Localice la resonancia por la fase"
    texto: "El RLC de la práctica, 100 Ω, 10 mH y 100 nF. Mueva el generador hasta que la corriente quede en fase con la tensión."
    libro: [188, "cap22#235"]
    fijar: { R_s: 100, L_s: 0.01, C_s: 100e-9 }
    inicio: { f_s: 3000 }
    widget:
      tipo: circuito
      esquema: rlc-serie
      piezas: { fuente: V_p, f: f_s, r: R_s, l: L_s, c: C_s }
      lectura: { valor: ph_s, rotulo: "Fase de la corriente" }
      datos:
        - { valor: I_s, rotulo: "Amplitud: {{I_s}}" }
      mide: { i_amp: I_s, i_fase: ph_s }
      mandos:
        - { valor: f_s, min: 1000, max: 20000, paso: 10, rotulo: "Frecuencia del generador" }
    ajuste:
      valor: ph_s
      objetivo: 0
      min: -2
      max: 2
      rotulo: "Fase de la corriente"
      escala: { min: -90, max: 90 }
      bajo: "La corriente se retrasa: es inductivo, baje la frecuencia."
      alto: "La corriente se adelanta: es capacitivo, suba la frecuencia."
      dentro: "En fase: está en la resonancia, unos 5 kHz."
    comprobar:
      - { con: { f_s: 5030 }, f_0s: 5033 }

  - id: mas-precisa
    tipo: pregunta
    titulo: "La forma más precisa"
    texto: "En ese RLC de Q bajo, ¿qué indica mejor dónde está la resonancia?"
    libro: [187, 188]
    fijar: { R_s: 100, L_s: 0.01, C_s: 100e-9, f_s: 5032.92 }
    widget:
      tipo: circuito
      esquema: rlc-serie
      piezas: { fuente: V_p, f: f_s, r: R_s, l: L_s, c: C_s }
      mide: { i_amp: I_s }
      grafica:
        x: { id: nu, min: 1000, max: 25000, unidad: Hz, rotulo: "f", escala: log }
        y: { min: 0, max: 0.011, unidad: A, rotulo: "|i|" }
        curvas:
          - { expr: "V_p/sqrt(R_s^2 + (2*pi*nu*L_s - 1/(2*pi*nu*C_s))^2)", color: naranja, rotulo: "|i|", mide: i_amp }
    opciones:
      - texto: "El cruce de la fase por cero"
        bien: true
        porque: "La fase cambia de signo justo en f₀ y gira deprisa ahí: mucho más preciso que buscar un máximo."
      - texto: "El máximo de la corriente"
        porque: "Con Q bajo, el máximo es una curva plana: varios cientos de hercios dan casi la misma amplitud."
      - texto: "El punto donde la corriente cae a cero"
        porque: "En serie, la corriente es máxima en la resonancia, no nula."
    escalera:
      - "¿Qué es más fácil de ver: la cima de una curva plana o un cambio de signo?"
    solucion: "El cruce de fase por cero."

  - id: timbre
    tipo: pregunta
    fase: "Estime"
    titulo: "La prueba de timbre"
    texto: "Se excita con un pulso un tanque de Q = 100. ¿En cuántos ciclos cae la amplitud de su oscilación a 1/e?"
    libro: [171, 189]
    estimar:
      objetivo: "n_e"
      unidad: ""
      min: 0
      max: 100
      paso: 0.5
      inicio: 60
      tol: 0.05
      rotulo: "Ciclos"
    exito: "Q/π ≈ 32 ciclos. Una espira en corto hunde el Q y la oscilación muere en pocos."
    pistas:
      - { cuando: { valor: estimacion, mayor: 33.4 }, texto: "Demasiado: son Q/π ciclos, no Q." }
      - { texto: "Poco: con Q = 100 timbra bastante." }
    escalera:
      - "La amplitud cae a 1/e en Q/π ciclos."
    solucion: "100/π ≈ 32 ciclos."
    comprobar:
      - { n_e: 31.8 }

  - id: q-cargado
    tipo: sorpresa
    titulo: "Del Q propio al Q cargado"
    texto: "Un tanque de Q propio 200. Baje la resistencia de la etapa que lo alimenta: la curva se ensancha y el Q cae hasta 20."
    libro: [179]
    fijar: { R_pp: 63245.6, f_p: 5032.92 }
    inicio: { R_ps: 1000000 }
    widget:
      tipo: circuito
      esquema: rlc-paralelo
      piezas: { fuente: V_p, f: f_p, rs: R_ps, l: L_p, c: C_p, r: R_pp }
      lectura: { valor: Q_c, rotulo: "Q cargado" }
      mide: { vt_amp: A_t }
      grafica:
        x: { id: nu, min: 2000, max: 12000, unidad: Hz, rotulo: "f", escala: log }
        y: { min: 0, max: 1.1, unidad: "", rotulo: "v_{t} relativa" }
        curvas:
          - { expr: "1/sqrt(1 + (Q_c*(nu/f_0 - f_0/nu))^2)", color: verde, rotulo: "|v_{t}| / máximo" }
      mandos:
        - { valor: R_ps, lista: [1000000, 70000, 7000], rotulo: "Resistencia de la etapa" }
    comprobar:
      - { con: { R_ps: 7000 }, Q_c: 20, tol: 0.01 }
      - { con: { R_ps: 1000000 }, Q_c: 188 }

  - id: por-que-ligero
    tipo: porque
    titulo: "¿Por qué acoplar ligeramente?"
    texto: "En radio, las etapas se acoplan ligeramente a los circuitos sintonizados. ¿Por qué?"
    libro: [179, 180]
    fijar: { R_pp: 63245.6, f_p: 5032.92, R_ps: 7000 }
    widget:
      tipo: circuito
      esquema: rlc-paralelo
      piezas: { fuente: V_p, f: f_p, rs: R_ps, l: L_p, c: C_p, r: R_pp }
      lectura: { valor: Q_c, rotulo: "Q cargado" }
      mide: { vt_amp: A_t }
    opciones:
      - texto: "Para no destruir la selectividad: la carga se suma a las pérdidas y baja el Q"
        bien: true
        porque: "La carga conectada a menudo domina: el Q que importa es el cargado, no el propio."
      - texto: "Para no quemar la bobina"
        porque: "No es cuestión de potencia: una etapa de baja impedancia en paralelo baja el Q."
      - texto: "Para subir la frecuencia de resonancia"
        porque: "La carga resistiva no cambia f₀: ensancha la curva."
    escalera:
      - "Una resistencia en paralelo con el tanque, ¿suma o quita pérdidas?"
    solucion: "La carga baja el Q: acoplando poco se conserva la selectividad."

  - id: limites-q
    tipo: pregunta
    fase: "Empareje"
    titulo: "Lo que limita el Q"
    texto: "Una cada causa de pérdidas con su origen."
    libro: [176, 177, 178, 179]
    emparejar:
      - ["El bobinado", "Su resistencia crece con el efecto pelicular"]
      - ["El núcleo de la bobina", "Sus pérdidas, si lo tiene"]
      - ["El dieléctrico del condensador", "Su factor de disipación"]
      - ["La carga conectada", "El Q cargado, que a menudo domina"]
    exito: "Las cuatro suman pérdidas; la carga suele ser la mayor."
    pistas:
      - { texto: "El factor de disipación es propio del condensador." }
    escalera:
      - "Dos son de la bobina, una del condensador y una de fuera."
    solucion: "Bobinado: pelicular; núcleo: sus pérdidas; dieléctrico: disipación; carga: Q cargado."

  - id: duales
    tipo: pregunta
    fase: "Empareje"
    titulo: "Serie y paralelo, duales"
    texto: "Una cada circuito o asociación con lo que le corresponde en resonancia."
    libro: [165, 166, 200]
    emparejar:
      - ["RLC serie en resonancia", "Impedancia mínima: deja pasar su frecuencia"]
      - ["Tanque paralelo en resonancia", "Impedancia máxima: bloquea su frecuencia"]
      - ["Elementos en serie", "Se suman las impedancias"]
      - ["Elementos en paralelo", "Se suman las admitancias"]
    exito: "Cambiando Z por Y, el análisis del paralelo es el del serie."
    pistas:
      - { texto: "El serie es un aceptador; el paralelo, un rechazador." }
    escalera:
      - "En serie quedan solo las pérdidas en serie: impedancia mínima."
    solucion: "Serie: mínima, aceptador; paralelo: máxima, tanque; serie suma Z; paralelo suma Y."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [167, 179, 188, 199]
    ideas:
      - { titulo: "Duales.", texto: "Serie: impedancia mínima. Paralelo: máxima, con Q veces la corriente dando vueltas dentro." }
      - { titulo: "Admitancia.", texto: "Y = 1/Z: G no es 1/R si hay reactancia en serie (3,38 mS, no 10)." }
      - { titulo: "El Q que importa.", texto: "El cargado: una etapa de baja impedancia baja un 200 a 20." }
      - { titulo: "En el banco.", texto: "La fase por cero localiza la resonancia; el timbre mide el Q." }
