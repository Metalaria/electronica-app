# Lección 1.2 de la sección 23.9 «Inductancia Mutua y el Transformador en Alterna» (cap24). Formato: GUIA.md.
# El altavoz de 8 Ω con 10:1 (bloque 221) y el ejercicio 23.8 (cap24#329: 3:1, 72 Ω) son del libro; los 230 V del
# primario son los de la red (bloque 24), y el esquema es el del transformador ideal (se comprueba en continua).
# El límite inferior de la banda se ve con un RL ilustrativo (1 kΩ de fuente y 1 H de magnetizante, corte en 159 Hz):
# la sección no da valores.
leccion: cap24/sec-24.9

libro:
  211: 'M = k dot.op sqrt(L_("1") dot.op L_("2"))'
  215: "Confundirlos invierte la fase de la salida, y en un circuito realimentado convierte una realimentación negativa en positiva"
  218: '(V_("2"))/(V_("1")) = (N_("2"))/(N_("1")) = n'
  219: '(I_("2"))/(I_("1")) = ("1")/(n)'
  220: 'Z_("reflejada") = (Z_("carga"))/(n^("2"))'
  221: "Un altavoz de 8 Ω a través de un transformador 10:1 se ve desde el primario como 800 Ω."
  222: "la válvula quiere miles de ohmios y el altavoz ofrece ocho"
  225: "Ldisp = L₁·(1−k²). Con k = 0,95, es el 10 % de L₁."
  226: "por debajo de cierta frecuencia su reactancia ωL es tan pequeña que cortocircuita la fuente y apenas llega señal al secundario"
  230: "limitada por abajo por la magnetizante y por arriba por la dispersión y la capacidad"
  234: "Barrera de seguridad"
  238: "Si en cortocircuito se mide el 9,75 % de lo medido en abierto, k = 0,95."
  "cap24#24": "los 230 V de la red son eficaces"
  "cap24#329": "Una carga de 8 Ω está en el secundario de un transformador con relación de espiras 3:1"

modelo:
  valores:
    V_1: { sim: "V₁", nombre: "tensión del primario", unidad: V, valor: 230 }
    N_1: { sim: "N₁", nombre: "espiras del primario", unidad: "", valor: 100 }
    N_2: { sim: "N₂", nombre: "espiras del secundario", unidad: "", valor: 100 }
    R_2l: { sim: "R_{L}", nombre: "carga del secundario", unidad: Ω, valor: 8 }
    tr_on: { tipo: interruptor, nombre: "carga conectada", valor: 1 }
    V_m: { sim: "V_{p}", nombre: "amplitud del generador", unidad: V, valor: 1 }
    f_m: { sim: "f", nombre: "frecuencia del generador", unidad: Hz, valor: 1000 }
    R_m: { sim: "R", nombre: "resistencia de la fuente", unidad: Ω, valor: 1000 }
    L_m: { sim: "L_{m}", nombre: "inductancia magnetizante", unidad: H, valor: 1 }
    k_c: { sim: "k", nombre: "coeficiente de acoplamiento", unidad: "", valor: 0.95 }
  calculos:
    V_2: { expr: "V_1*N_2/N_1", sim: "V₂", nombre: "tensión del secundario", unidad: V }
    I_2: { si: tr_on, entonces: "V_2/R_2l", sino: "0", sim: "I₂", nombre: "corriente del secundario", unidad: A }
    I_1: { expr: "I_2*N_2/N_1", sim: "I₁", nombre: "corriente del primario", unidad: A }
    Z_r: { expr: "R_2l*(N_1/N_2)^2", sim: "Z_{refl}", nombre: "impedancia vista desde el primario", unidad: Ω }
    n_r: { expr: "N_1/N_2", sim: "N₁/N₂", nombre: "relación de espiras", unidad: "" }
    x_m: { expr: "2*pi*f_m*L_m/R_m", sim: "ωL/R", nombre: "ωL/R", unidad: "" }
    A_m: { expr: "V_m*x_m/sqrt(1 + x_m^2)", sim: "V_{2}", nombre: "amplitud que llega al secundario", unidad: V }
    f_m0: { expr: "R_m/(2*pi*L_m)", sim: "f_{inf}", nombre: "límite inferior de la banda", unidad: Hz }
    d_k: { expr: "1 - k_c^2", sim: "L_{disp}/L₁", nombre: "fracción de dispersión", unidad: "" }
    k_med: { expr: "sqrt(1 - 0.0975)", sim: "k", nombre: "acoplamiento medido", unidad: "", cifras: 3 }

tarjetas:
  - id: explore-trafo
    tipo: explorar
    titulo: "Tensión, corriente e impedancia"
    texto: "Un transformador ideal con 230 V en el primario y un altavoz de 8 Ω. Cambie las espiras del primario y mire qué impedancia ve la red."
    libro: [218, 219, "cap24#24"]
    widget:
      tipo: circuito
      esquema: transformador
      piezas: { fuente: V_1, n1: N_1, n2: N_2, carga: R_2l, interruptor: tr_on }
      lectura: { valor: Z_r, rotulo: "Impedancia vista desde el primario" }
      datos:
        - { valor: V_2, rotulo: "V₂ = {{V_2}}" }
        - { valor: I_1, rotulo: "I₁ = {{I_1}}" }
        - { valor: I_2, rotulo: "I₂ = {{I_2}}" }
      corriente: I_2
      mide: { secundario: V_2, i1: I_1, i2: I_2 }
      mandos:
        - { valor: N_1, lista: [100, 200, 300, 500, 1000], rotulo: "Espiras del primario" }

  - id: prediga-altavoz
    tipo: predecir
    titulo: "El altavoz visto desde el primario"
    texto: "Un altavoz de 8 Ω en el secundario de un transformador 10:1. ¿Qué impedancia ve el primario?"
    libro: [221]
    fijar: { N_1: 1000, N_2: 100, R_2l: 8, tr_on: 1 }
    widget:
      tipo: circuito
      esquema: transformador
      piezas: { fuente: V_1, n1: N_1, n2: N_2, carga: R_2l, interruptor: tr_on }
      lectura: { valor: Z_r, rotulo: "Impedancia vista desde el primario" }
      corriente: I_2
      mide: { secundario: V_2, i1: I_1, i2: I_2 }
      ocultar: true
    opciones:
      - texto: "800 Ω"
        bien: true
        porque: "Con el cuadrado de la relación: 8 × 10² = 800 Ω. La tensión sube 10 veces y la corriente baja 10."
      - texto: "80 Ω"
        porque: "Ha usado la relación sin elevarla al cuadrado. La impedancia es tensión entre corriente, y las dos cambian."
      - texto: "0,08 Ω"
        porque: "Al revés: desde el lado de más espiras la impedancia se ve mayor, no menor."
    escalera:
      - "Visto desde el primario, V₁ es 10 veces V₂ e I₁ es la décima parte de I₂."
    solucion: "8 × 10² = 800 Ω."
    comprobar:
      - { Z_r: 800, n_r: 10 }
      - { con: { N_1: 316.23 }, Z_r: 80 }

  - id: formula-reflejada
    tipo: formula
    titulo: "Con el cuadrado de la relación"
    texto: "Un transformador transforma impedancias con n². Cambie las espiras del primario."
    libro: [220]
    ec: 220
    sustitucion: "{{R_2l}} / ({{N_2}}/{{N_1}})² = {{Z_r}}"
    fijar: { N_2: 100, tr_on: 1 }
    widget:
      tipo: circuito
      esquema: transformador
      piezas: { fuente: V_1, n1: N_1, n2: N_2, carga: R_2l, interruptor: tr_on }
      lectura: { valor: Z_r, rotulo: "Z reflejada" }
      corriente: I_2
      mide: { secundario: V_2, i1: I_1, i2: I_2 }
      mandos:
        - { valor: N_1, lista: [100, 200, 300, 500, 1000], rotulo: "Espiras del primario" }

  - id: estime-72
    tipo: pregunta
    fase: "Estime"
    titulo: "El ejercicio del 3:1"
    texto: "Una carga de 8 Ω en el secundario de un transformador 3:1, primario a secundario. Estime la impedancia que ve el primario."
    libro: ["cap24#329", 220]
    fijar: { N_1: 300, N_2: 100, R_2l: 8 }
    estimar:
      objetivo: "Z_r"
      unidad: Ω
      min: 0
      max: 200
      paso: 1
      inicio: 24
      tol: 0.05
      rotulo: "Impedancia en el primario"
    exito: "(3/1)² × 8 = 9 × 8 = 72 Ω."
    pistas:
      - { cuando: { valor: estimacion, menor: 68 }, texto: "Poco: ¿ha usado 3 en lugar de 3²?" }
      - { texto: "Demasiado: 8 Ω por el cuadrado de 3." }
    escalera:
      - "Z_{primario} = n² · Z_{carga}, con n = 3."
    solucion: "9 × 8 = 72 Ω."
    comprobar:
      - { Z_r: 72 }

  - id: tres-relaciones
    tipo: pregunta
    fase: "Empareje"
    titulo: "Las relaciones del transformador"
    texto: "Una cada magnitud con cómo la cambia el transformador o cómo se calcula."
    libro: [211, 218, 219, 220]
    emparejar:
      - ["La tensión", "Escala con las vueltas, n"]
      - ["La corriente", "Al revés, 1/n"]
      - ["La impedancia", "Con el cuadrado de la relación"]
      - ["La inductancia mutua", "k · √(L₁ · L₂)"]
    exito: "Lo que sube la tensión lo baja la corriente; la impedancia, cociente de ambas, cambia con el cuadrado."
    pistas:
      - { texto: "La potencia se conserva en el transformador ideal: si sube la tensión, baja la corriente." }
    escalera:
      - "Z = V/I: ¿cómo cambia si V se multiplica por n y I se divide por n?"
    solucion: "Tensión ×n, corriente ×1/n, impedancia con n², M = k√(L₁L₂)."

  - id: puntos
    tipo: pregunta
    titulo: "Los puntos de polaridad"
    texto: "En un amplificador realimentado se conecta el secundario con los puntos de polaridad cambiados. ¿Qué ocurre?"
    libro: [215]
    widget:
      tipo: circuito
      esquema: transformador
      piezas: { fuente: V_1, n1: N_1, n2: N_2, carga: R_2l, interruptor: tr_on }
      corriente: I_2
      mide: { secundario: V_2 }
    opciones:
      - texto: "La salida se invierte y la realimentación negativa pasa a positiva"
        bien: true
        porque: "Los puntos marcan los extremos cuyos flujos se suman. Cambiarlos invierte la fase, y un lazo puede ponerse a oscilar."
      - texto: "Nada: el transformador no tiene polaridad"
        porque: "La tiene en alterna: el signo de M depende de la orientación de los bobinados."
      - texto: "La relación de espiras se invierte"
        porque: "La relación no cambia; cambia el signo, la fase de la salida."
    escalera:
      - "El término M·di/dt puede sumar o restar."
    solucion: "Fase invertida: la realimentación negativa se vuelve positiva."

  - id: estime-k
    tipo: pregunta
    fase: "Estime"
    titulo: "El acoplamiento, medido"
    texto: "Con el secundario en corto, el primario mide el 9,75 % de su inductancia en abierto. Estime el coeficiente de acoplamiento k."
    libro: [225, 238]
    estimar:
      objetivo: "k_med"
      unidad: ""
      min: 0
      max: 1
      paso: 0.005
      inicio: 0.5
      tol: 0.01
      rotulo: "Coeficiente k"
    exito: "k = √(1 − 0,0975) = 0,95. La dispersión, L₁·(1 − k²), es casi el 10 % de L₁."
    pistas:
      - { cuando: { valor: estimacion, menor: 0.94 }, texto: "Poco: la dispersión es pequeña, así que el acoplamiento es casi perfecto." }
      - { texto: "Demasiado: k = 1 sería sin ninguna dispersión." }
    escalera:
      - "k = √(1 − L_{cc}/L_{ab})."
    solucion: "√(1 − 0,0975) = 0,95."
    comprobar:
      - { k_med: 0.95, d_k: 0.0975 }

  - id: banda-baja
    tipo: sorpresa
    titulo: "Por abajo no pasa la señal"
    texto: "La magnetizante es una bobina en paralelo (valores de ejemplo: 1 H con 1 kΩ de fuente). Baje la frecuencia: su reactancia cortocircuita la fuente."
    libro: [226, 230]
    inicio: { f_m: 1000 }
    widget:
      tipo: circuito
      esquema: filtro-rl
      piezas: { fuente: V_m, f: f_m, r: R_m, l: L_m }
      lectura: { valor: A_m, rotulo: "Lo que llega al secundario" }
      datos:
        - { valor: f_m0, rotulo: "Límite inferior: {{f_m0}}" }
      mide: { vl_amp: A_m }
      grafica:
        x: { id: nu, min: 10, max: 10000, unidad: Hz, rotulo: "f", escala: log }
        y: { min: 0, max: 1.1, unidad: V, rotulo: "amplitud" }
        curvas:
          - { expr: "V_m*(2*pi*nu*L_m/R_m)/sqrt(1 + (2*pi*nu*L_m/R_m)^2)", color: naranja, rotulo: "v_{L}", mide: vl_amp }
      mandos:
        - { valor: f_m, lista: [20, 50, 159, 1000, 5000], rotulo: "Frecuencia" }
    comprobar:
      - { f_m0: 159 }

  - id: por-que-cuadrado
    tipo: porque
    titulo: "¿Por qué con el cuadrado?"
    texto: "La relación de espiras es 10, pero la impedancia vista cambia 100 veces. ¿Por qué?"
    libro: [218, 219, 220]
    fijar: { N_1: 1000, N_2: 100, R_2l: 8, tr_on: 1 }
    widget:
      tipo: circuito
      esquema: transformador
      piezas: { fuente: V_1, n1: N_1, n2: N_2, carga: R_2l, interruptor: tr_on }
      lectura: { valor: Z_r, rotulo: "Z reflejada" }
      datos:
        - { valor: I_1, rotulo: "I₁ = {{I_1}}" }
        - { valor: I_2, rotulo: "I₂ = {{I_2}}" }
      corriente: I_2
      mide: { secundario: V_2, i1: I_1, i2: I_2 }
    opciones:
      - texto: "La tensión cambia con n y la corriente con 1/n: su cociente, con n²"
        bien: true
        porque: "Z = V/I. Desde el primario hay 10 veces la tensión y la décima parte de la corriente: 100 veces la impedancia."
      - texto: "Porque el núcleo multiplica la inductancia"
        porque: "En el transformador ideal no interviene el núcleo: basta con las dos primeras relaciones."
      - texto: "Porque se pierde potencia en el cobre"
        porque: "El ideal no pierde nada; el n² sale solo de las relaciones de tensión y corriente."
    escalera:
      - "Escriba Z₁ = V₁/I₁ con V₁ = V₂/n e I₁ = n·I₂."
    solucion: "V × 10 e I ÷ 10: la impedancia, × 100."
    comprobar:
      - { Z_r: 800, n_r: 10 }

  - id: usos
    tipo: pregunta
    fase: "Empareje"
    titulo: "Para qué se usa"
    texto: "Una cada función del transformador con su ejemplo."
    libro: [234]
    emparejar:
      - ["Cambiar tensión", "Transformador de red"]
      - ["Aislar galvánicamente", "Barrera de seguridad"]
      - ["Adaptar impedancias", "Salida de válvulas, redes de RF"]
      - ["Medir corriente", "Pinza amperimétrica"]
      - ["Acoplar sin continua", "Ethernet, audio balanceado"]
    exito: "Varios no buscan cambiar la tensión: usan el acoplamiento magnético para otra cosa."
    pistas:
      - { texto: "La válvula quiere miles de ohmios y el altavoz ofrece ocho." }
    escalera:
      - "Una pinza es un transformador cuyo primario es el propio cable."
    solucion: "Red: tensión; barrera: aislar; válvulas: adaptar; pinza: medir; Ethernet: sin continua."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [215, 220, 222, 225, 230]
    ideas:
      - { titulo: "Tres relaciones.", texto: "Tensión con n, corriente con 1/n, impedancia con n²: 8 Ω con 10:1 son 800 Ω." }
      - { titulo: "Polaridad.", texto: "Los puntos marcan el signo de M; cambiarlos invierte la fase." }
      - { titulo: "El real.", texto: "Dispersión L₁(1 − k²) en serie; magnetizante en paralelo." }
      - { titulo: "La banda.", texto: "Por abajo la limita la magnetizante; por arriba, la dispersión y la capacidad." }
