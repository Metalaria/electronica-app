# Lección 1.2 de la sección 23.9 «Inductancia Mutua y el Transformador en Alterna» (cap24). Formato: GUIA.md.
# El altavoz de 8 Ω con 10:1 (bloque 221) y el ejercicio 23.8 (cap24#329: 3:1, 72 Ω) son del libro; los 230 V del
# primario son los de la red (bloque 24), y el esquema es el del transformador ideal (se comprueba en continua).
# La banda se ve con el esquema «transformador-real»: el altavoz de 8 Ω con 10:1 (800 Ω reflejados), la dispersión
# L₁·(1 − k²) del bloque 225 con k = 0,95 y la magnetizante tomada como L₁. EJEMPLO: 1 kΩ de fuente y L₁ = 1 H (la
# sección no da valores): límite inferior (1 k ‖ 800)/(2π·1 H) = 70,7 Hz; superior (1 k + 800)/(2π·L_disp).
# 1.2.1 (autor121-pot, «aprender haciendo», GUIA §13): la red se lleva a ver 200 Ω con las espiras (objetivo); la
# tensión del secundario 10:1 se mide; la impedancia del altavoz, la del 3:1 y k medido se escriben; la banda baja se
# hunde bajando la frecuencia y la alta se ensancha subiendo k (objetivos). Quedan dos preguntas de opciones (los
# puntos de polaridad y por qué con el cuadrado), los usos emparejados y, en el resumen, las tres relaciones.
leccion: cap24/sec-24.9

libro:
  211: 'M = k dot.op sqrt(L_("1") dot.op L_("2"))'
  215: "Confundirlos invierte la fase de la salida, y en un circuito realimentado convierte una realimentación negativa en positiva"
  218: '(V_("2"))/(V_("1")) = (N_("2"))/(N_("1")) = n'
  219: '(I_("2"))/(I_("1")) = ("1")/(n)'
  220: 'Z_("reflejada") = (Z_("carga"))/(n^("2"))'
  221: "Un altavoz de 8 Ω a través de un transformador 10:1 se ve desde el primario como 800 Ω."
  222: "la válvula quiere miles de ohmios y el altavoz ofrece ocho"
  225: "Ldisp = L₁·(1−k²). Con k = 0,95, es el 10 % de L₁."
  226: "por debajo de cierta frecuencia su reactancia ωL es tan pequeña que cortocircuita la fuente y apenas llega señal al secundario"
  230: "limitada por abajo por la magnetizante y por arriba por la dispersión y la capacidad"
  232: "entrelazar los bobinados (primario, secundario, primario) reduce la dispersión"
  234: "Barrera de seguridad"
  238: "Si en cortocircuito se mide el 9,75 % de lo medido en abierto, k = 0,95."
  "cap24#24": "los 230 V de la red son eficaces"
  "cap24#329": "Una carga de 8 Ω está en el secundario de un transformador con relación de espiras 3:1"

modelo:
  valores:
    V_1: { sim: "V₁", nombre: "tensión del primario", unidad: V, valor: 230 }
    N_1: { sim: "N₁", nombre: "espiras del primario", unidad: "", valor: 100 }
    N_2: { sim: "N₂", nombre: "espiras del secundario", unidad: "", valor: 100 }
    R_2l: { sim: "R_{L}", nombre: "carga del secundario", unidad: Ω, valor: 8 }
    tr_on: { tipo: interruptor, nombre: "carga conectada", valor: 1 }
    V_m: { sim: "V_{p}", nombre: "amplitud del generador", unidad: V, valor: 1 }
    f_m: { sim: "f", nombre: "frecuencia del generador", unidad: Hz, valor: 1000 }
    R_m: { sim: "R", nombre: "resistencia de la fuente", unidad: Ω, valor: 1000 }
    L_m: { sim: "L_{m}", nombre: "inductancia magnetizante", unidad: H, valor: 1 }
    k_c: { sim: "k", nombre: "coeficiente de acoplamiento", unidad: "", valor: 0.95 }
    N_a: { sim: "N₁", nombre: "espiras del primario del transformador real", unidad: "", valor: 1000 }
    N_b: { sim: "N₂", nombre: "espiras del secundario del transformador real", unidad: "", valor: 100 }
  calculos:
    V_2: { expr: "V_1*N_2/N_1", sim: "V₂", nombre: "tensión del secundario", unidad: V }
    I_2: { si: tr_on, entonces: "V_2/R_2l", sino: "0", sim: "I₂", nombre: "corriente del secundario", unidad: A }
    I_1: { expr: "I_2*N_2/N_1", sim: "I₁", nombre: "corriente del primario", unidad: A }
    Z_r: { expr: "R_2l*(N_1/N_2)^2", sim: "Z_{refl}", nombre: "impedancia vista desde el primario", unidad: Ω }
    n_r: { expr: "N_1/N_2", sim: "N₁/N₂", nombre: "relación de espiras", unidad: "" }
    L_d: { expr: "L_m*(1 - k_c^2)", sim: "L_{disp}", nombre: "inductancia de dispersión", unidad: H }
    R_p: { expr: "R_2l*(N_a/N_b)^2", sim: "R′_{L}", nombre: "altavoz visto desde el primario", unidad: Ω }
    w_m: { expr: "2*pi*f_m", sim: "ω", nombre: "frecuencia angular", unidad: "rad/s" }
    A_m: { expr: "N_b/N_a*V_m*w_m*L_m*R_p/sqrt((R_m*R_p - w_m^2*L_d*L_m)^2 + (w_m*(L_m*(R_m + R_p) + L_d*R_p))^2)", sim: "V_{2}", nombre: "amplitud que llega al altavoz", unidad: V }
    f_m0: { expr: "par(R_m, R_p)/(2*pi*L_m)", sim: "f_{inf}", nombre: "límite inferior de la banda", unidad: Hz }
    f_m1: { expr: "(R_m + R_p)/(2*pi*L_d)", sim: "f_{sup}", nombre: "límite superior de la banda", unidad: Hz }
    d_k: { expr: "1 - k_c^2", sim: "L_{disp}/L₁", nombre: "fracción de dispersión", unidad: "" }
    Z_mal: { expr: "R_2l*N_1/N_2", sim: "n·R_{L}", nombre: "carga por la relación sin cuadrado", unidad: Ω }
    A_med: { expr: "N_b/N_a*V_m*R_p/(R_m + R_p)", sim: "V_{2}", nombre: "amplitud en el centro de la banda", unidad: V }
    k_med: { expr: "sqrt(1 - 0.0975)", sim: "k", nombre: "acoplamiento medido", unidad: "", cifras: 3 }

tarjetas:
  - id: explore-trafo
    tipo: explorar
    titulo: "Tensión, corriente e impedancia"
    texto: "Un transformador ideal con 230 V en el primario y un altavoz de 8 Ω. Cambie las espiras del primario hasta que la red vea 200 Ω."
    libro: [218, 219, 220, "cap24#24"]
    fijar: { N_2: 100, tr_on: 1 }
    inicio: { N_1: 100 }
    widget:
      tipo: circuito
      esquema: transformador
      piezas: { fuente: V_1, n1: N_1, n2: N_2, carga: R_2l, interruptor: tr_on }
      lectura: { valor: Z_r, rotulo: "Impedancia vista desde el primario" }
      datos:
        - { valor: V_2, rotulo: "V₂ = {{V_2}}" }
        - { valor: I_1, rotulo: "I₁ = {{I_1}}" }
        - { valor: I_2, rotulo: "I₂ = {{I_2}}" }
      corriente: I_2
      mide: { secundario: V_2, i1: I_1, i2: I_2 }
      mandos:
        - { valor: N_1, lista: [100, 200, 300, 500, 1000], rotulo: "Espiras del primario" }
    objetivo:
      condiciones:
        - { valor: Z_r, objetivo: 200, tol: 0.02, rotulo: "Z vista: {{Z_r}}" }
      logrado: "Con {{N_1}} espiras, relación 5: la tensión baja 5 veces, la corriente sube 5 y la impedancia cambia con n²."
      pistas:
        - { texto: "Divida 200 entre 8: ¿de qué relación es ese número el cuadrado?" }
    escalera:
      - "Z_{primario} = n² · Z_{carga}."
    solucion: "500 espiras: 5² × 8 = 200 Ω."
    comprobar:
      - { con: { N_1: 500 }, Z_r: 200, n_r: 5 }

  - id: prediga-altavoz
    tipo: leer
    titulo: "El altavoz visto desde el primario"
    texto: "Un altavoz de 8 Ω en el secundario de un transformador 10:1, con 230 V. Lea la corriente del primario y escriba la impedancia que ve, V₁/I₁."
    libro: [221, 222]
    fijar: { N_1: 1000, N_2: 100, R_2l: 8, tr_on: 1 }
    widget:
      tipo: circuito
      esquema: transformador
      piezas: { fuente: V_1, n1: N_1, n2: N_2, carga: R_2l, interruptor: tr_on }
      lectura: { valor: I_1, rotulo: "Corriente del primario" }
      corriente: I_2
      mide: { secundario: V_2, i1: I_1, i2: I_2 }
      mandos: []
    leer:
      objetivo: Z_r
      unidad: Ω
      tol: 0.02
      rotulo: "Impedancia vista desde el primario"
      errores:
        - { expr: "Z_mal", texto: "Ha usado la relación sin elevarla al cuadrado. La impedancia es tensión entre corriente, y las dos cambian." }
        - { expr: "R_2l/(N_1/N_2)^2", texto: "Al revés: desde el lado de más espiras la impedancia se ve mayor, no menor." }
    exito: "230 V / 0,2875 A = 800 Ω = 8 × 10². Así una válvula, que quiere miles de ohmios, mueve un altavoz de ocho."
    escalera:
      - "Divida los 230 V por la corriente de la lectura."
    solucion: "8 × 10² = 800 Ω."
    comprobar:
      - { Z_r: 800, n_r: 10, I_1: 0.2875, Z_mal: 80 }

  - id: mida-secundario
    tipo: medir
    titulo: "La tensión del secundario"
    texto: "Con el 10:1 y 230 V en el primario, ponga las puntas donde mediría la tensión que recibe el altavoz."
    libro: [218, "cap24#24"]
    fijar: { N_1: 1000, N_2: 100, R_2l: 8, tr_on: 1 }
    widget:
      tipo: circuito
      esquema: transformador
      piezas: { fuente: V_1, n1: N_1, n2: N_2, carga: R_2l, interruptor: tr_on }
      corriente: I_2
      mide: { secundario: V_2, i1: I_1, i2: I_2 }
      instrumento:
        tipo: multimetro
        modos: [V]
      mandos: []
    medir:
      magnitud: tension
      entre: [s, "0"]
      valor: V_2
      porque:
        fte: "Esa punta está en el primario: mide los 230 V de la red."
    exito: "23 V: la tensión escala con las vueltas, V₂/V₁ = N₂/N₁."
    escalera:
      - "El altavoz está en el secundario, a la derecha."
    solucion: "Roja en el secundario y negra abajo: 23 V."
    comprobar:
      - { V_2: 23 }

  - id: estime-72
    tipo: leer
    titulo: "El ejercicio del 3:1"
    texto: "Una carga de 8 Ω en el secundario de un transformador 3:1, primario a secundario. Escriba la impedancia que ve el primario."
    libro: ["cap24#329", 220]
    fijar: { N_1: 300, N_2: 100, R_2l: 8, tr_on: 1 }
    widget:
      tipo: circuito
      esquema: transformador
      piezas: { fuente: V_1, n1: N_1, n2: N_2, carga: R_2l, interruptor: tr_on }
      lectura: { valor: V_2, rotulo: "Tensión del secundario" }
      corriente: I_2
      mide: { secundario: V_2, i1: I_1, i2: I_2 }
      mandos: []
    leer:
      objetivo: Z_r
      unidad: Ω
      tol: 0.02
      rotulo: "Impedancia en el primario"
      errores:
        - { expr: "Z_mal", texto: "Ha usado 3 en lugar de 3²." }
    exito: "(3/1)² × 8 = 9 × 8 = 72 Ω."
    escalera:
      - "Z_{primario} = n² · Z_{carga}, con n = 3."
    solucion: "9 × 8 = 72 Ω."
    comprobar:
      - { Z_r: 72, Z_mal: 24 }

  - id: puntos
    tipo: pregunta
    titulo: "Los puntos de polaridad"
    texto: "En un amplificador realimentado se conecta el secundario con los puntos de polaridad cambiados. ¿Qué ocurre?"
    libro: [215]
    widget:
      tipo: circuito
      esquema: transformador
      piezas: { fuente: V_1, n1: N_1, n2: N_2, carga: R_2l, interruptor: tr_on }
      corriente: I_2
      mide: { secundario: V_2 }
    opciones:
      - texto: "La salida se invierte y la realimentación negativa pasa a positiva"
        bien: true
        porque: "Los puntos marcan los extremos cuyos flujos se suman. Cambiarlos invierte la fase, y un lazo puede ponerse a oscilar."
      - texto: "Nada: el transformador no tiene polaridad"
        porque: "La tiene en alterna: el signo de M depende de la orientación de los bobinados."
      - texto: "La relación de espiras se invierte"
        porque: "La relación no cambia; cambia el signo, la fase de la salida."
    escalera:
      - "El término M·di/dt puede sumar o restar."
    solucion: "Fase invertida: la realimentación negativa se vuelve positiva."

  - id: estime-k
    tipo: leer
    titulo: "El acoplamiento, medido"
    texto: "Con el secundario en corto, el primario mide el 9,75 % de su inductancia en abierto. Escriba el coeficiente de acoplamiento k."
    libro: [211, 225, 238]
    widget:
      tipo: grafica
      x: { id: kk, min: 0.8, max: 1, unidad: "", rotulo: "k" }
      y: { min: 0, max: 0.4, unidad: "", rotulo: "L_{cc}/L_{ab}" }
      curvas:
        - { expr: "1 - kk^2", color: azul, rotulo: "1 − k²" }
        - { expr: "0.0975", color: naranja, rotulo: "lo medido", discontinua: true }
      mandos: []
    leer:
      objetivo: k_med
      unidad: ""
      tol: 0.005
      rotulo: "Coeficiente k"
      errores:
        - { expr: "1 - 0.0975", texto: "Eso es 1 − k², no k: falta la raíz." }
    exito: "k = √(1 − 0,0975) = 0,95. La dispersión, L₁·(1 − k²), es casi el 10 % de L₁; la mutua, M = k·√(L₁L₂)."
    escalera:
      - "Busque dónde la curva cruza lo medido."
      - "k = √(1 − L_{cc}/L_{ab})."
    solucion: "√(1 − 0,0975) = 0,95."
    comprobar:
      - { k_med: 0.95, d_k: 0.0975 }

  - id: banda-baja
    tipo: sorpresa
    titulo: "Por abajo no pasa la señal"
    texto: "La magnetizante va en paralelo con el primario. Baje la frecuencia hasta que al altavoz llegue mucho menos que en el centro."
    nota: "Ejemplo: 1 kΩ de fuente, L₁ = 1 H y k = 0,95."
    libro: [226, 230]
    fijar: { R_2l: 8, k_c: 0.95 }
    inicio: { f_m: 1000 }
    widget:
      tipo: circuito
      esquema: transformador-real
      piezas: { fuente: V_m, f: f_m, rs: R_m, lm: L_m, ld: L_d, n1: N_a, n2: N_b, carga: R_2l }
      lectura: { valor: A_m, rotulo: "Lo que llega al altavoz" }
      datos:
        - { valor: A_med, rotulo: "En el centro de la banda: {{A_med}}" }
      mide: { salida_amp: A_m }
      grafica:
        x: { id: nu, min: 1, max: 1000000, unidad: Hz, rotulo: "f", escala: log }
        y: { min: -70, max: -20, unidad: dB, rotulo: "v_{2}" }
        curvas:
          - { expr: "20*log10(N_b/N_a*V_m*2*pi*nu*L_m*R_p/sqrt((R_m*R_p - (2*pi*nu)^2*L_d*L_m)^2 + (2*pi*nu*(L_m*(R_m + R_p) + L_d*R_p))^2))", color: naranja, rotulo: "v_{2} en dB", mide: salida_db }
      mandos:
        - { valor: f_m, lista: [20, 50, 200, 1000], rotulo: "Frecuencia" }
    objetivo:
      condiciones:
        - { valor: A_m, max: 0.0314, rotulo: "Llega: {{A_m}}" }
      logrado: "A {{f_m}}, por debajo de los {{f_m0}} del límite inferior, ωL es tan pequeña que cortocircuita la fuente."
      pistas:
        - { texto: "Todavía llega casi todo: baje más la frecuencia." }
    escalera:
      - "El límite inferior es (1 kΩ ‖ 800 Ω)/(2π · 1 H)."
    solucion: "A 50 Hz o menos."
    comprobar:
      - { f_m0: 70.7, R_p: 800, A_med: 0.04444, tol: 0.005 }
      - { con: { f_m: 50 }, A_m: 0.0257, tol: 0.02 }

  - id: banda-alta
    tipo: explorar
    titulo: "Por arriba manda la dispersión"
    texto: "La dispersión, L₁·(1 − k²), queda en serie. Suba el acoplamiento k hasta llevar el límite superior por encima de 100 kHz."
    libro: [225, 230, 232]
    fijar: { R_2l: 8, f_m: 1000 }
    inicio: { k_c: 0.95 }
    widget:
      tipo: circuito
      esquema: transformador-real
      piezas: { fuente: V_m, f: f_m, rs: R_m, lm: L_m, ld: L_d, n1: N_a, n2: N_b, carga: R_2l }
      lectura: { valor: f_m1, rotulo: "Límite superior" }
      datos:
        - { valor: L_d, rotulo: "Dispersión: {{L_d}}" }
      mide: { salida_amp: A_m }
      grafica:
        x: { id: nu, min: 1, max: 1000000, unidad: Hz, rotulo: "f", escala: log }
        y: { min: -70, max: -20, unidad: dB, rotulo: "v_{2}" }
        curvas:
          - { expr: "20*log10(N_b/N_a*V_m*2*pi*nu*L_m*R_p/sqrt((R_m*R_p - (2*pi*nu)^2*L_d*L_m)^2 + (2*pi*nu*(L_m*(R_m + R_p) + L_d*R_p))^2))", color: naranja, rotulo: "v_{2} en dB", mide: salida_db }
      mandos:
        - { valor: k_c, lista: [0.95, 0.99, 0.999], rotulo: "Acoplamiento k" }
    objetivo:
      condiciones:
        - { valor: f_m1, min: 100000, rotulo: "Límite superior: {{f_m1}}" }
      logrado: "Con k = {{k_c}}, la dispersión baja a {{L_d}} y la banda llega a {{f_m1}}. Entrelazar los bobinados reduce la dispersión."
      pistas:
        - { texto: "Todavía hay mucha dispersión: más acoplamiento." }
    escalera:
      - "El límite superior es (1 kΩ + 800 Ω)/(2π · L_{disp})."
    solucion: "k = 0,999: unos 143 kHz."
    comprobar:
      - { L_d: 0.0975, f_m1: 2938, tol: 0.005 }
      - { con: { k_c: 0.999 }, f_m1: 143300, tol: 0.003 }

  - id: por-que-cuadrado
    tipo: porque
    titulo: "¿Por qué con el cuadrado?"
    texto: "La relación de espiras es 10, pero la impedancia vista cambia 100 veces. ¿Por qué?"
    libro: [218, 219, 220]
    fijar: { N_1: 1000, N_2: 100, R_2l: 8, tr_on: 1 }
    widget:
      tipo: circuito
      esquema: transformador
      piezas: { fuente: V_1, n1: N_1, n2: N_2, carga: R_2l, interruptor: tr_on }
      lectura: { valor: Z_r, rotulo: "Z reflejada" }
      datos:
        - { valor: I_1, rotulo: "I₁ = {{I_1}}" }
        - { valor: I_2, rotulo: "I₂ = {{I_2}}" }
      corriente: I_2
      mide: { secundario: V_2, i1: I_1, i2: I_2 }
    opciones:
      - texto: "La tensión cambia con n y la corriente con 1/n: su cociente, con n²"
        bien: true
        porque: "Z = V/I. Desde el primario hay 10 veces la tensión y la décima parte de la corriente: 100 veces la impedancia."
      - texto: "Porque el núcleo multiplica la inductancia"
        porque: "En el transformador ideal no interviene el núcleo: basta con las dos primeras relaciones."
      - texto: "Porque se pierde potencia en el cobre"
        porque: "El ideal no pierde nada; el n² sale solo de las relaciones de tensión y corriente."
    escalera:
      - "Escriba Z₁ = V₁/I₁ con V₁ = V₂/n e I₁ = n·I₂."
    solucion: "V × 10 e I ÷ 10: la impedancia, × 100."
    comprobar:
      - { Z_r: 800, n_r: 10 }

  - id: usos
    tipo: pregunta
    fase: "Empareje"
    titulo: "Para qué se usa"
    texto: "Una cada función del transformador con su ejemplo."
    libro: [234]
    emparejar:
      - ["Cambiar tensión", "Transformador de red"]
      - ["Aislar galvánicamente", "Barrera de seguridad"]
      - ["Adaptar impedancias", "Salida de válvulas, redes de RF"]
      - ["Medir corriente", "Pinza amperimétrica"]
      - ["Acoplar sin continua", "Ethernet, audio balanceado"]
    exito: "Varios no buscan cambiar la tensión: usan el acoplamiento magnético para otra cosa."
    pistas:
      - { texto: "La válvula quiere miles de ohmios y el altavoz ofrece ocho." }
    escalera:
      - "Una pinza es un transformador cuyo primario es el propio cable."
    solucion: "Red: tensión; barrera: aislar; válvulas: adaptar; pinza: medir; Ethernet: sin continua."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [211, 215, 220, 222, 225, 230]
    ideas:
      - { titulo: "Tres relaciones.", texto: "Tensión con n, corriente con 1/n, impedancia con n²: 8 Ω con 10:1 son 800 Ω. M = k√(L₁L₂)." }
      - { titulo: "Polaridad.", texto: "Los puntos marcan el signo de M; cambiarlos invierte la fase." }
      - { titulo: "El real.", texto: "Dispersión L₁(1 − k²) en serie; magnetizante en paralelo." }
      - { titulo: "La banda.", texto: "Por abajo la limita la magnetizante; por arriba, la dispersión y la capacidad." }
