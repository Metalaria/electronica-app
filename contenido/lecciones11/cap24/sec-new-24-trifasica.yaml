# Lección 1.2 de la sección 23.10 «Sistemas Trifásicos» (cap24, etiqueta sec-new-24-trifasica). Formato: GUIA.md.
# Todos los números son del libro: 230 V, 10 A y φ = 30° por fase (bloque 246); 400/230,9 V (254); las tres
# resistencias de 53,3 Ω (262); la estufa, el radiador y las lámparas del neutro cortado (269, 270, 316); el motor de
# 11 kW (280-282); la tabla de los dos vatímetros (298). El desfase de 90° y 150° de la primera tarjeta es solo para
# ver que la suma se anula con 120°. Estrella o triángulo y el neutro cortado, con el esquema «trifasica» (fuentes de
# pico √2·230,94 V: las lecturas de las tarjetas son eficaces y las medidas, de pico).
leccion: cap24/sec-new-24-trifasica

libro:
  245: "tres senoides iguales desfasadas 120° suman cero en todo instante"
  246: "cada fase oscila entre −308 W y 4 292 W alrededor de su media de 1 992 W, y la suma de las tres es una recta en 5 976 W"
  252: 'V_"LL" = sqrt(3) dot.op V_"f"'
  254: "326,6 V entre fase y neutro y 565,7 V entre fases"
  253: "su base mide 2·Vf·cos 30° = √3·Vf"
  260: "En triángulo no hay punto de estrella, y por tanto no hay neutro que conectar."
  261: "un triángulo de Z equivale a una estrella de Z/3"
  262: "Tres resistencias de 53,3 Ω sobre la red de 400/230 V."
  263: "con 230 V por devanado y un tercio de la corriente y del par de arranque"
  269: "Con una estufa de 2 kW en L1, un radiador de 1 kW en L2 y nada en L3, las corrientes son 8,66 A y 4,33 A, y el neutro no lleva su suma aritmética, 12,99 A, sino |8,66 + 4,33∠−120°| = 7,50 A."
  270: "las cargas reciben 139 V, 263 V y 331 V"
  272: "en el neutro los tres se suman en lugar de cancelarse"
  274: "el neutro puede ser el conductor más cargado de la instalación"
  281: 'I_"L" = P/(sqrt(3) dot.op V_"LL" dot.op cos φ)'
  298: "0,3 (72,5°)"
  299: "por debajo de 0,5 su lectura es negativa"
  311: "La entrada del osciloscopio admite ±400 V."
  "cap24#280": "Un motor de 11 kW en el eje, con un rendimiento de 0,90 y cos φ = 0,85"

modelo:
  valores:
    V_f: { sim: "V_{f}", nombre: "tensión de fase", unidad: V, valor: 230.94 }
    f_r: { sim: "f", nombre: "frecuencia de la red", unidad: Hz, valor: 50 }
    d_g: { sim: "Δφ", nombre: "desfase entre fases", unidad: "°", valor: 120 }
    V_p: { sim: "V", nombre: "tensión por fase de la carga", unidad: V, valor: 230 }
    I_p: { sim: "I", nombre: "corriente por fase", unidad: A, valor: 10 }
    ph_c: { sim: "φ", nombre: "ángulo de la carga", unidad: "°", valor: 30 }
    tri: { tipo: interruptor, nombre: "conexión en triángulo", valor: 0 }
    R_y: { sim: "R", nombre: "resistencia de cada rama", unidad: Ω, valor: 53.3 }
    P_1: { sim: "P₁", nombre: "carga de L1", unidad: W, valor: 2000 }
    P_2: { sim: "P₂", nombre: "carga de L2", unidad: W, valor: 1000 }
    P_3: { sim: "P₃", nombre: "carga de L3", unidad: W, valor: 0 }
    R_1: { sim: "R₁", nombre: "estufa", unidad: Ω, valor: 26.45 }
    R_2: { sim: "R₂", nombre: "radiador", unidad: Ω, valor: 52.9 }
    R_3: { sim: "R₃", nombre: "lámparas", unidad: Ω, valor: 264.5 }
    n_on: { tipo: interruptor, nombre: "neutro conectado", valor: 1 }
    P_e: { sim: "P_{eje}", nombre: "potencia en el eje", unidad: W, valor: 11000 }
    eta: { sim: "η", nombre: "rendimiento", unidad: "", valor: 0.9 }
    c_m: { sim: "cos φ", nombre: "factor de potencia del motor", unidad: "", valor: 0.85 }
    V_LL: { sim: "V_{LL}", nombre: "tensión de línea", unidad: V, valor: 400 }
    I_a: { sim: "I_{L}", nombre: "corriente de línea de la tabla", unidad: A, valor: 10 }
    ph_a: { sim: "φ", nombre: "ángulo de la carga equilibrada", unidad: "°", valor: 30 }
  calculos:
    w_r: { expr: "2*pi*f_r", sim: "ω", nombre: "frecuencia angular", unidad: "rad/s" }
    d_r: { expr: "d_g*pi/180", sim: "Δφ", nombre: "desfase en radianes", unidad: "rad" }
    s_3: { expr: "1 + 2*cos(d_r)", sim: "suma", nombre: "amplitud de la suma, en veces la de una fase", unidad: "" }
    Vpk: { expr: "sqrt(2)*V_f", sim: "V_{pico}", nombre: "pico de la tensión de fase", unidad: V }
    VLL: { expr: "sqrt(3)*V_f", sim: "V_{LL}", nombre: "tensión de línea", unidad: V }
    VLLp: { expr: "sqrt(2)*VLL", sim: "V_{LL, pico}", nombre: "pico de la tensión de línea", unidad: V }
    phr: { expr: "ph_c*pi/180", sim: "φ", nombre: "ángulo en radianes", unidad: "rad" }
    p_med: { expr: "V_p*I_p*cos(phr)", sim: "P_{fase}", nombre: "media de cada fase", unidad: W }
    p_max: { expr: "V_p*I_p*(cos(phr) + 1)", sim: "p_{máx}", nombre: "máximo de cada fase", unidad: W }
    p_min: { expr: "V_p*I_p*(cos(phr) - 1)", sim: "p_{mín}", nombre: "mínimo de cada fase", unidad: W }
    p_tot: { expr: "3*p_med", sim: "p", nombre: "potencia total", unidad: W }
    V_r: { si: tri, entonces: "VLL", sino: "V_f", sim: "V", nombre: "tensión sobre cada resistencia", unidad: V }
    I_r: { expr: "V_r/R_y", sim: "I", nombre: "corriente de cada resistencia", unidad: A }
    I_lin: { si: tri, entonces: "sqrt(3)*I_r", sino: "I_r", sim: "I_{L}", nombre: "corriente de línea", unidad: A }
    Vr_p: { expr: "sqrt(2)*V_r", sim: "V_{pico}", nombre: "pico de la tensión de cada resistencia", unidad: V }
    Ir_p: { expr: "sqrt(2)*I_r", sim: "I_{pico}", nombre: "pico de la corriente de cada resistencia", unidad: A }
    Il_p: { expr: "sqrt(2)*I_lin", sim: "I_{L, pico}", nombre: "pico de la corriente de línea", unidad: A }
    P_r: { expr: "V_r^2/R_y", sim: "P", nombre: "potencia de cada resistencia", unidad: W }
    I_1: { expr: "P_1/V_f", sim: "I₁", nombre: "corriente de L1", unidad: A }
    I_2: { expr: "P_2/V_f", sim: "I₂", nombre: "corriente de L2", unidad: A }
    I_3: { expr: "P_3/V_f", sim: "I₃", nombre: "corriente de L3", unidad: A }
    I_N: { expr: "sqrt((I_1 - (I_2 + I_3)/2)^2 + 0.75*(I_3 - I_2)^2)", sim: "I_{N}", nombre: "corriente del neutro", unidad: A }
    I_ar: { expr: "I_1 + I_2 + I_3", sim: "ΣI", nombre: "suma aritmética", unidad: A }
    Y_t: { expr: "1/R_1 + 1/R_2 + 1/R_3", sim: "ΣY", nombre: "suma de conductancias", unidad: S }
    s_re: { si: n_on, entonces: "0", sino: "V_f*(1/R_1 - (1/R_2 + 1/R_3)/2)/Y_t", sim: "V_{s}", nombre: "punto de estrella, parte real", unidad: V }
    s_im: { si: n_on, entonces: "0", sino: "V_f*0.8660254*(1/R_3 - 1/R_2)/Y_t", sim: "V_{s}", nombre: "punto de estrella, parte imaginaria", unidad: V }
    V_s: { expr: "sqrt(s_re^2 + s_im^2)", sim: "V_{NN′}", nombre: "desplazamiento del punto de estrella", unidad: V }
    U_1: { expr: "sqrt((V_f - s_re)^2 + s_im^2)", sim: "V₁", nombre: "tensión de la estufa", unidad: V }
    U_2: { expr: "sqrt((-V_f/2 - s_re)^2 + (-0.8660254*V_f - s_im)^2)", sim: "V₂", nombre: "tensión del radiador", unidad: V }
    U_3: { expr: "sqrt((-V_f/2 - s_re)^2 + (0.8660254*V_f - s_im)^2)", sim: "V₃", nombre: "tensión de las lámparas", unidad: V }
    Up_1: { expr: "sqrt(2)*U_1", sim: "V₁", nombre: "pico de la tensión de la estufa", unidad: V }
    Up_2: { expr: "sqrt(2)*U_2", sim: "V₂", nombre: "pico de la tensión del radiador", unidad: V }
    Up_3: { expr: "sqrt(2)*U_3", sim: "V₃", nombre: "pico de la tensión de las lámparas", unidad: V }
    Vs_p: { expr: "sqrt(2)*V_s", sim: "V_{NN′}", nombre: "pico del desplazamiento del punto de estrella", unidad: V }
    P_m: { expr: "P_e/eta", sim: "P", nombre: "potencia que toma de la red", unidad: W }
    I_m: { expr: "P_m/(sqrt(3)*V_LL*c_m)", sim: "I_{L}", nombre: "corriente de línea del motor", unidad: A, cifras: 4 }
    phm: { expr: "atan2(sqrt(1 - c_m^2), c_m)", sim: "φ", nombre: "ángulo del motor", unidad: "rad" }
    P_mal: { expr: "sqrt(3)*V_LL*I_m*cos(phm + pi/6)", sim: "P", nombre: "potencia con el ángulo equivocado", unidad: W }
    W_1: { expr: "V_LL*I_a*cos((ph_a - 30)*pi/180)", sim: "W₁", nombre: "lectura del primer vatímetro", unidad: W }
    W_2: { expr: "V_LL*I_a*cos((ph_a + 30)*pi/180)", sim: "W₂", nombre: "lectura del segundo vatímetro", unidad: W }
    W_t: { expr: "W_1 + W_2", sim: "P", nombre: "suma de las lecturas", unidad: W }
    T_r: { expr: "1/f_r", sim: "T", nombre: "periodo de la red", unidad: s }
    t_mx: { expr: "-T_r/12", sim: "t", nombre: "instante del máximo de u₁₂", unidad: s }
    t_ce: { expr: "T_r/4 - T_r/12", sim: "t", nombre: "primer cero de u₁₂", unidad: s }
    u_0: { expr: "VLLp*cos(pi/6)", sim: "u₁₂(0)", nombre: "u₁₂ en t = 0", unidad: V }

tarjetas:
  - id: explore-suma
    tipo: explorar
    titulo: "Tres senoides que suman cero"
    texto: "Tres tensiones de fase de 230,9 V eficaces. Cambie el desfase entre ellas: solo con 120° la suma, a trazos, se anula en todo instante."
    libro: [245]
    widget:
      tipo: grafica
      x: { id: t, min: 0, max: 0.04, unidad: s, rotulo: "t" }
      y: { min: -1000, max: 1000, unidad: V, rotulo: "v" }
      curvas:
        - { expr: "Vpk*cos(w_r*t)", color: azul, rotulo: "v₁" }
        - { expr: "Vpk*cos(w_r*t - d_r)", color: naranja, rotulo: "v₂" }
        - { expr: "Vpk*cos(w_r*t + d_r)", color: verde, rotulo: "v₃" }
        - { expr: "Vpk*s_3*cos(w_r*t)", color: tinta, rotulo: "suma", discontinua: true }
      lectura: { valor: s_3, rotulo: "Suma, en veces una fase" }
      mandos:
        - { valor: d_g, lista: [90, 120, 150], rotulo: "Desfase entre fases" }

  - id: prediga-total
    tipo: predecir
    titulo: "La potencia de las tres"
    texto: "Cada fase entrega 230 V y 10 A con φ = 30°: su potencia pulsa entre −308 W y 4292 W. ¿Cómo es la suma de las tres?"
    libro: [246]
    fijar: { V_p: 230, I_p: 10, ph_c: 30 }
    widget:
      tipo: grafica
      x: { id: t, min: 0, max: 0.02, unidad: s, rotulo: "t" }
      y: { min: -1000, max: 7000, unidad: W, rotulo: "p" }
      curvas:
        - { expr: "p_med + V_p*I_p*cos(2*w_r*t - phr)", color: azul, rotulo: "p₁" }
        - { expr: "p_med + V_p*I_p*cos(2*w_r*t - phr - 4*pi/3)", color: naranja, rotulo: "p₂" }
        - { expr: "p_med + V_p*I_p*cos(2*w_r*t - phr + 4*pi/3)", color: verde, rotulo: "p₃" }
      lectura: { valor: p_tot, rotulo: "Potencia total" }
      ocultar: true
    opciones:
      - texto: "Constante: una recta en 5976 W"
        bien: true
        porque: "Los términos que oscilan quedan a 240° entre sí, otra terna, y se anulan. El motor da un par sin pulsación."
      - texto: "Pulsa a 100 Hz, el triple de alto"
        porque: "Eso pasaría si las tres pulsaran a la vez. Van desfasadas y se compensan."
      - texto: "Pulsa al triple de frecuencia"
        porque: "Las oscilaciones no solo se reparten: se anulan del todo. Queda la media, 3 × 1992 W."
    escalera:
      - "Los términos oscilantes de cada fase, ¿cómo están desfasados entre sí?"
    solucion: "Constante: 3 × 1992 = 5976 W."
    comprobar:
      - { p_med: 1992, p_max: 4292, p_min: -308, p_tot: 5976 }

  - id: formula-linea
    tipo: formula
    titulo: "Fase y línea"
    texto: "Entre dos fases hay la diferencia de dos fasores a 120°: √3 veces la de fase."
    libro: [252, 254]
    ec: 252
    sustitucion: "√3 · {{V_f}} = {{VLL}}"
    widget:
      tipo: grafica
      x: { id: t, min: 0, max: 0.04, unidad: s, rotulo: "t" }
      y: { min: -600, max: 600, unidad: V, rotulo: "v" }
      curvas:
        - { expr: "Vpk*cos(w_r*t)", color: azul, rotulo: "v₁" }
        - { expr: "Vpk*cos(w_r*t - 2*pi/3)", color: naranja, rotulo: "v₂" }
        - { expr: "Vpk*cos(w_r*t) - Vpk*cos(w_r*t - 2*pi/3)", color: tinta, rotulo: "u₁₂ = v₁ − v₂" }
      lectura: { valor: VLL, rotulo: "Tensión de línea" }
    comprobar:
      - { VLL: 400, Vpk: 326.6, VLLp: 565.7 }

  - id: estime-pico
    tipo: pregunta
    fase: "Estime"
    titulo: "El pico entre fases"
    texto: "La tensión de línea es de 400 V eficaces. Estime su valor de pico."
    libro: [254]
    estimar:
      objetivo: "VLLp"
      unidad: V
      min: 0
      max: 800
      paso: 1
      inicio: 400
      tol: 0.02
      rotulo: "Pico de línea"
    exito: "400 × √2 = 565,7 V; con un 10 % de más, 622 V."
    pistas:
      - { cuando: { valor: estimacion, mayor: 577 }, texto: "Demasiado: es el eficaz por √2, no por √3." }
      - { texto: "Poco: el pico es √2 veces el eficaz." }
    escalera:
      - "Pico = eficaz × √2."
    solucion: "565,7 V."
    comprobar:
      - { VLLp: 565.7 }

  - id: estrella-triangulo
    tipo: explorar
    titulo: "Estrella o triángulo"
    texto: "Tres resistencias de 53,3 Ω: en estrella cada una recibe la tensión de fase; en triángulo, la de línea. Cambie la conexión."
    libro: [261, 262, 263]
    inicio: { tri: 0 }
    widget:
      tipo: circuito
      esquema: trifasica
      piezas: { fuente: Vpk, f: f_r, r1: R_y, r2: R_y, r3: R_y, triangulo: tri }
      lectura: { valor: P_r, rotulo: "Potencia de cada resistencia" }
      datos:
        - { valor: I_r, rotulo: "Corriente de rama: {{I_r}}" }
        - { valor: I_lin, rotulo: "Corriente de línea: {{I_lin}}" }
      mide: { v1_amp: Vr_p, ir1_amp: Ir_p, i1_amp: Il_p }
      mandos:
        - { valor: tri, tipo: interruptor, rotulo: "En triángulo" }
    comprobar:
      - { I_r: 4.333, I_lin: 4.333, tol: 0.003 }
      - { con: { tri: 1 }, I_r: 7.505, I_lin: 13.0, tol: 0.003 }

  - id: formula-motor
    tipo: formula
    titulo: "La corriente de un motor"
    texto: "Un motor de 11 kW en el eje, rendimiento 0,90 y cos φ = 0,85, toma 12,22 kW de la red de 400 V."
    libro: [281, "cap24#280"]
    ec: 281
    sustitucion: "{{P_m}} / (√3 · {{V_LL}} · {{c_m}}) = {{I_m}}"
    comprobar:
      - { P_m: 12222, I_m: 20.75 }

  - id: estime-neutro
    tipo: pregunta
    fase: "Estime"
    titulo: "Lo que lleva el neutro"
    texto: "Una estufa de 2 kW en L1, un radiador de 1 kW en L2 y nada en L3. Estime la corriente del neutro."
    libro: [269]
    fijar: { P_1: 2000, P_2: 1000, P_3: 0 }
    estimar:
      objetivo: "I_N"
      unidad: A
      min: 0
      max: 20
      paso: 0.05
      inicio: 0
      tol: 0.03
      rotulo: "Corriente del neutro"
    exito: "|8,66 + 4,33∠−120°| = 7,50 A, no la suma aritmética de 12,99 A."
    pistas:
      - { cuando: { valor: estimacion, mayor: 7.73 }, texto: "Demasiado: las corrientes están a 120° y se suman como fasores." }
      - { texto: "Poco: con las cargas desiguales, el neutro sí lleva corriente." }
    escalera:
      - "I₁ = 8,66 A a 0° e I₂ = 4,33 A a −120°."
      - "Sume por separado las partes reales y las imaginarias de los dos fasores."
    solucion: "7,50 A."
    comprobar:
      - { I_1: 8.66, I_2: 4.33, I_N: 7.5, I_ar: 12.99 }

  - id: neutro-cortado
    tipo: sorpresa
    titulo: "El neutro cortado"
    texto: "Estufa de 2 kW, radiador de 1 kW y lámparas de 200 W, una por fase. Corte el neutro: el punto de estrella se desplaza y la carga más pequeña recibe más tensión."
    libro: [270]
    fijar: { R_1: 26.45, R_2: 52.9, R_3: 264.5 }
    inicio: { n_on: 1 }
    widget:
      tipo: circuito
      esquema: trifasica
      piezas: { fuente: Vpk, f: f_r, r1: R_1, r2: R_2, r3: R_3, neutro: n_on }
      grafica:
        x: { id: t, min: 0, max: 0.04, unidad: s, rotulo: "t" }
        y: { min: -600, max: 600, unidad: V, rotulo: "v de cada carga" }
        curvas:
          - { expr: "Vpk*sin(w_r*t) - sqrt(2)*(s_re*sin(w_r*t) + s_im*cos(w_r*t))", color: azul, rotulo: "estufa", mide: t_v1 }
          - { expr: "Vpk*sin(w_r*t - 2*pi/3) - sqrt(2)*(s_re*sin(w_r*t) + s_im*cos(w_r*t))", color: naranja, rotulo: "radiador", mide: t_v2 }
          - { expr: "Vpk*sin(w_r*t + 2*pi/3) - sqrt(2)*(s_re*sin(w_r*t) + s_im*cos(w_r*t))", color: verde, rotulo: "lámparas", mide: t_v3 }
      lectura: { valor: U_3, rotulo: "Tensión de las lámparas" }
      datos:
        - { valor: U_1, rotulo: "Estufa: {{U_1}}" }
        - { valor: U_2, rotulo: "Radiador: {{U_2}}" }
        - { valor: V_s, rotulo: "Punto de estrella: {{V_s}}" }
      mide: { v1_amp: Up_1, v2_amp: Up_2, v3_amp: Up_3, vn_amp: Vs_p }
      mandos:
        - { valor: n_on, tipo: interruptor, rotulo: "Neutro conectado" }
    comprobar:
      - { con: { n_on: 0 }, U_1: 139, U_2: 263, U_3: 331, V_s: 112.7, tol: 0.006 }

  - id: por-que-armonicos
    tipo: porque
    titulo: "¿Por qué se suman en el neutro?"
    texto: "Tres rectificadores con condensador, uno por fase, cargan el neutro con 1,73 veces la corriente de una fase. ¿Por qué no se cancelan sus terceros armónicos?"
    libro: [272, 274]
    widget:
      tipo: grafica
      x: { id: t, min: 0, max: 0.02, unidad: s, rotulo: "t" }
      y: { min: -3.5, max: 3.5, unidad: "", rotulo: "relativa" }
      curvas:
        - { expr: "cos(3*w_r*t)", color: azul, rotulo: "3.º armónico de L1" }
        - { expr: "cos(3*(w_r*t - 2*pi/3))", color: naranja, rotulo: "de L2", discontinua: true }
        - { expr: "cos(3*(w_r*t + 2*pi/3))", color: verde, rotulo: "de L3", discontinua: true }
        - { expr: "3*cos(3*w_r*t)", color: tinta, rotulo: "en el neutro" }
    opciones:
      - texto: "Porque el tercer armónico de cada fase está a 3 × 120° = 360°: en fase con los otros"
        bien: true
        porque: "En lugar de cancelarse como la fundamental, se suman. Pasa con todos los múltiplos de tres."
      - texto: "Porque las fuentes conmutadas desequilibran la carga"
        porque: "Las tres son iguales: la carga está equilibrada. El problema es la forma de la corriente, no el reparto."
      - texto: "Porque el neutro tiene menos sección"
        porque: "La sección no cambia la corriente que llega: decide lo que se calienta."
    escalera:
      - "Multiplique por tres el desfase de 120° entre fases."
    solucion: "3 × 120° = 360°: los terceros armónicos están en fase y se suman."

  - id: aron
    tipo: pregunta
    titulo: "Un vatímetro en negativo"
    texto: "Dos vatímetros en conexión de Aron sobre una carga de 400 V y 10 A con cos φ = 0,3: W₂ marca −869 W. ¿Qué ocurre?"
    libro: [298, 299]
    fijar: { V_LL: 400, I_a: 10, ph_a: 72.54 }
    widget:
      tipo: grafica
      x: { id: g, min: 0, max: 90, unidad: "°", rotulo: "φ" }
      y: { min: -2000, max: 4500, unidad: W, rotulo: "lectura" }
      curvas:
        - { expr: "V_LL*I_a*cos((g - 30)*pi/180)", color: azul, rotulo: "W₁" }
        - { expr: "V_LL*I_a*cos((g + 30)*pi/180)", color: naranja, rotulo: "W₂" }
      marcas:
        - { x: "ph_a", y: "W_2", rotulo: "W₂" }
    opciones:
      - texto: "Nada raro: por debajo de cos φ = 0,5 una lectura sale negativa; P = W₁ + W₂"
        bien: true
        porque: "Es lo normal en un motor en vacío. Uno analógico tiraría la aguja contra el tope: se invierte su bobina y se resta."
      - texto: "El vatímetro está mal conectado"
        porque: "La conexión es la correcta: con φ > 60°, cos(φ + 30°) es negativo."
      - texto: "La carga devuelve potencia a la red"
        porque: "La suma, 2078 W, es positiva: la carga consume. Solo una lectura es negativa."
    escalera:
      - "W₂ = V_{LL}·I_{L}·cos(φ + 30°): ¿qué signo tiene con φ = 72,5°?"
    solucion: "W₁ = 2947 W y W₂ = −869 W: P = 2078 W."
    comprobar:
      - { W_1: 2947, W_2: -869, W_t: 2078 }

  - id: dibuje-linea
    tipo: dibujar
    titulo: "Dibuje la tensión de línea"
    texto: "v₁ tiene 326,6 V de pico y su máximo en t = 0. Dibuje u₁₂ = v₁ − v₂ durante un periodo de 20 ms."
    libro: [253, 254]
    dibujar:
      x: { id: t, min: 0, max: 0.02, unidad: s, rotulo: "t" }
      y: { min: -600, max: 600, unidad: V, rotulo: "u₁₂" }
      curva: "VLLp*cos(w_r*t + pi/6)"
      puntos: 21
      tol: 0.08
      holgura: 0.03
      rotulo: "Tensión entre L1 y L2"
    exito: "565,7 V de pico, adelantada 30° respecto a v₁: llega a su máximo antes que ella."
    pistas:
      - { cuando: { valor: amplitud, menor: 0.85 }, texto: "Le falta altura: es √3 veces la de fase, 565,7 V de pico." }
      - { cuando: { valor: amplitud, mayor: 1.15 }, texto: "Demasiado alta: 400 V eficaces son 565,7 V de pico." }
      - { texto: "Va adelantada 30°: en t = 0 ya ha pasado su máximo." }
    escalera:
      - "El pico es √2 × 400 V."
      - "Adelantada 30°: su máximo cae en −1,67 ms, antes de t = 0."
    solucion: "565,7·cos(ωt + 30°): unos 490 V en t = 0, cero a los 3,33 ms."
    comprobar:
      - { VLLp: 565.7, Vpk: 326.6, T_r: 0.02, t_mx: -0.00167, t_ce: 0.00333, u_0: 490 }

  - id: fnirsi
    tipo: pregunta
    titulo: "¿Con el osciloscopio del kit?"
    texto: "¿Por qué no se mide la tensión entre dos fases de un cuadro con el FNIRSI 2C53T?"
    libro: [311]
    widget:
      tipo: grafica
      x: { id: t, min: 0, max: 0.02, unidad: s, rotulo: "t" }
      y: { min: -700, max: 700, unidad: V, rotulo: "u₁₂" }
      curvas:
        - { expr: "VLLp*cos(w_r*t + pi/6)", color: naranja, rotulo: "u₁₂" }
        - { expr: "400", color: tinta, rotulo: "+400 V", discontinua: true }
        - { expr: "-400", color: tinta, rotulo: "−400 V", discontinua: true }
    opciones:
      - texto: "Su pico, 566 V, supera los ±400 V de la entrada, y un cuadro es CAT III"
        bien: true
        porque: "Además los canales comparten masa. Se mide con un multímetro CAT III o CAT IV."
      - texto: "Porque no tiene resolución suficiente"
        porque: "No es cuestión de precisión, sino de seguridad: pico, categoría y masa común."
      - texto: "Basta con poner la sonda en ×10"
        porque: "La sonda llega a 600 V, pero en CAT II: un cuadro es CAT III."
    escalera:
      - "Compare el pico de la tensión de línea con la entrada del osciloscopio."
    solucion: "565,7 V de pico frente a ±400 V, y categoría CAT II frente al CAT III del cuadro."
    comprobar:
      - { VLLp: 565.7 }

  - id: conexiones
    tipo: pregunta
    fase: "Empareje"
    titulo: "Estrella y triángulo"
    texto: "Una cada conexión o maniobra con lo que la caracteriza."
    libro: [260, 261, 263]
    emparejar:
      - ["Estrella", "Cada carga, la tensión de fase; puede tener neutro"]
      - ["Triángulo", "Cada carga, la tensión de línea; sin neutro"]
      - ["Un triángulo de Z", "Equivale a una estrella de Z/3"]
      - ["Arranque estrella-triángulo", "Un tercio de la corriente y del par"]
    exito: "Las mismas tres impedancias consumen el triple en triángulo."
    pistas:
      - { texto: "En triángulo no hay punto de estrella." }
    escalera:
      - "¿Qué tensión recibe cada impedancia en cada conexión?"
    solucion: "Estrella: fase y neutro; triángulo: línea; Z en triángulo = Z/3 en estrella; arranque: un tercio."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [245, 252, 261, 269, 272]
    ideas:
      - { titulo: "Tres fases.", texto: "Suman cero: potencia constante y retorno sin corriente en equilibrio." }
      - { titulo: "400/230 V.", texto: "V_{LL} = √3·V_{f}; picos de 326,6 y 565,7 V." }
      - { titulo: "El neutro.", texto: "Suma fasorial: 7,50 A, no 12,99; cortado, la carga menor recibe 331 V." }
      - { titulo: "Armónicos.", texto: "Los terceros se suman en el neutro: 1,73 veces una fase." }
