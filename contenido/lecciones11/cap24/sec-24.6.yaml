# Lección 1.2 de la sección 23.6 «Resonancia y Factor de Calidad» (cap24). Formato: contenido/lecciones11/GUIA.md.
# El RLC es el del recuadro de deducción (bloque 160: 50 Ω, 10 mH, 100 nF); el de la radio, el del bloque 158
# (100 µH, 100 pF, 10 Ω, Q = 100); el del banco, el de la práctica 9 (cap22#235: 100 Ω, 10 mH, 100 nF), ficha 33.
# El sobreimpulso del 78 % se ve con el esquema «rlc-escalon» y un escalón de 1 V (EJEMPLO: el libro no da tensión).
# 1.2.1 (autor121-pot, «aprender haciendo», GUIA §13): Q ≥ 30 se consigue con R; R × 10 hunde Q sin mover f₀
# (objetivo); f₀ se lleva a 7,3 kHz con C; el corte inferior de −3 dB y la resonancia se marcan en la curva (f₀, media
# geométrica de los cortes); f₀, BW y la atenuación de la emisora adyacente del sintonizado de radio se escriben. Queda
# una pregunta de opciones (por qué timbra), los resonadores del FM7303 emparejados y el banco.
leccion: cap24/sec-24.6

libro:
  153: "un circuito RLC serie presenta impedancia mínima (solo R) y la corriente es máxima"
  154: 'f_("0") = ("1")/("2" π dot.op sqrt(L dot.op C))'
  155: "el rango de frecuencias entre los puntos de −3 dB"
  156: '"BW" = (f_("0"))/(Q)'
  158: "una emisora a 9 kHz solo cae unos 3,6 dB"
  159: "Resonancia y amortiguamiento son dos caras de lo mismo"
  160: "√(4650,74 × 5446,51) = 5032,92 Hz = f₀ exactamente, mientras que la media aritmética da 5048,62 Hz"
  "cap24#329": "Un circuito sintonizado tiene L = 100 µH y C = 100 pF"
  "cap22#235": "L = 10 mH, C = 100 nF, R = 100 Ω"
  "cap22#246": "un 10 % de tolerancia en C son un 5 % en f₀"
  "cap22#248": "La resistencia de la bobina"
  "cap22#251": "Al cambiar R de 100 Ω a 1 kΩ, la frecuencia de resonancia no se mueve y el Q cae de 3 a 0,3"

modelo:
  valores:
    V_p: { sim: "V_{p}", nombre: "amplitud de la fuente", unidad: V, valor: 1 }
    f_r: { sim: "f", nombre: "frecuencia de la fuente", unidad: Hz, valor: 5032.92 }
    R_r: { sim: "R", nombre: "resistencia", unidad: Ω, valor: 50 }
    L_r: { sim: "L", nombre: "inductancia", unidad: H, valor: 0.01 }
    C_r: { sim: "C", nombre: "capacidad", unidad: F, valor: 100e-9 }
    V_e: { sim: "V", nombre: "escalón de la fuente", unidad: V, valor: 1 }
    f_m: { sim: "f", nombre: "frecuencia de la emisora", unidad: Hz, valor: 1591549 }
    R_m: { sim: "R", nombre: "resistencia del sintonizado", unidad: Ω, valor: 10 }
    L_m: { sim: "L", nombre: "inductancia del sintonizado", unidad: H, valor: 100e-6 }
    C_m: { sim: "C", nombre: "capacidad del sintonizado", unidad: F, valor: 100e-12 }
  calculos:
    f_0: { expr: "1/(2*pi*sqrt(L_r*C_r))", sim: "f₀", nombre: "frecuencia de resonancia", unidad: Hz, cifras: 4 }
    Q_r: { expr: "sqrt(L_r/C_r)/R_r", sim: "Q", nombre: "factor de calidad", unidad: "", cifras: 3 }
    BW: { expr: "f_0/Q_r", sim: "BW", nombre: "ancho de banda", unidad: Hz }
    I_0: { expr: "V_p/R_r", sim: "I_{máx}", nombre: "corriente en resonancia", unidad: A }
    I_f: { expr: "V_p/sqrt(R_r^2 + (2*pi*f_r*L_r - 1/(2*pi*f_r*C_r))^2)", sim: "I", nombre: "amplitud de la corriente", unidad: A }
    f_1: { expr: "sqrt(f_0^2 + (BW/2)^2) - BW/2", sim: "f₁", nombre: "corte inferior", unidad: Hz, cifras: 6 }
    f_2: { expr: "sqrt(f_0^2 + (BW/2)^2) + BW/2", sim: "f₂", nombre: "corte superior", unidad: Hz, cifras: 6 }
    f_g: { expr: "sqrt(f_1*f_2)", sim: "√(f₁f₂)", nombre: "media geométrica de los cortes", unidad: Hz, cifras: 6 }
    f_a: { expr: "(f_1 + f_2)/2", sim: "(f₁+f₂)/2", nombre: "media aritmética de los cortes", unidad: Hz, cifras: 6 }
    I_1: { expr: "I_0*0.7071", sim: "I", nombre: "corriente en los cortes", unidad: A }
    z_r: { expr: "R_r/2*sqrt(C_r/L_r)", sim: "ζ", nombre: "amortiguamiento", unidad: "", cifras: 3 }
    OS: { expr: "100*exp(-pi*z_r/sqrt(max(1 - z_r^2, 1e-12)))", sim: "SO", nombre: "sobreimpulso ante un escalón", unidad: "%" }
    a_r: { expr: "R_r/(2*L_r)", sim: "α", nombre: "amortiguamiento del escalón", unidad: "1/s" }
    wd_r: { expr: "sqrt(max(1/(L_r*C_r) - a_r^2, 1))", sim: "ω_{d}", nombre: "pulsación amortiguada", unidad: "rad/s" }
    f_0m: { expr: "1/(2*pi*sqrt(L_m*C_m))", sim: "f₀", nombre: "resonancia del sintonizado", unidad: Hz }
    Q_m: { expr: "sqrt(L_m/C_m)/R_m", sim: "Q", nombre: "factor de calidad del sintonizado", unidad: "" }
    BW_m: { expr: "f_0m/Q_m", sim: "BW", nombre: "ancho de banda del sintonizado", unidad: Hz }
    I_m: { expr: "V_p/sqrt(R_m^2 + (2*pi*f_m*L_m - 1/(2*pi*f_m*C_m))^2)", sim: "I", nombre: "corriente del sintonizado", unidad: A }
    f_9: { expr: "f_0m + 9000", sim: "f", nombre: "emisora adyacente", unidad: Hz }
    I_0m: { expr: "V_p/R_m", sim: "I_{máx}", nombre: "corriente del sintonizado en resonancia", unidad: A }
    I_9: { expr: "V_p/sqrt(R_m^2 + (2*pi*f_9*L_m - 1/(2*pi*f_9*C_m))^2)", sim: "I", nombre: "corriente con la emisora adyacente", unidad: A }
    a_9: { expr: "20*log10(sqrt(R_m^2 + (2*pi*f_9*L_m - 1/(2*pi*f_9*C_m))^2)/R_m)", sim: "a", nombre: "atenuación de la adyacente", unidad: dB, cifras: 2 }

tarjetas:
  - id: explore-resonancia
    tipo: explorar
    titulo: "Donde las reactancias se cancelan"
    texto: "La corriente de un RLC serie de 10 mH y 100 nF frente a la frecuencia. Cambie R hasta que el pico sea muy agudo, con Q de 30 o más."
    libro: [153, 155]
    fijar: { L_r: 0.01, C_r: 100e-9 }
    inicio: { R_r: 100 }
    widget:
      tipo: circuito
      esquema: rlc-serie
      piezas: { fuente: V_p, f: f_r, r: R_r, l: L_r, c: C_r }
      lectura: { valor: Q_r, rotulo: "Factor de calidad Q" }
      datos:
        - { valor: f_0, rotulo: "f₀ = {{f_0}}" }
        - { valor: BW, rotulo: "Ancho de banda: {{BW}}" }
      mide: { i_amp: I_f }
      grafica:
        x: { id: nu, min: 1000, max: 25000, unidad: Hz, rotulo: "f", escala: log }
        y: { min: 0, max: 0.11, unidad: A, rotulo: "|i|" }
        curvas:
          - { expr: "V_p/sqrt(R_r^2 + (2*pi*nu*L_r - 1/(2*pi*nu*C_r))^2)", color: naranja, rotulo: "|i|", mide: i_amp }
        marcas:
          - { x: "f_0", y: "I_0", rotulo: "f₀" }
      mandos:
        - { valor: R_r, lista: [10, 50, 100, 1000] }
    objetivo:
      condiciones:
        - { valor: Q_r, min: 30, rotulo: "Q: {{Q_r}}" }
      logrado: "Con {{R_r}}, Q = {{Q_r}} y una banda de {{BW}}: en resonancia la impedancia es solo R, y la corriente, máxima."
      pistas:
        - { texto: "El pico todavía es ancho: menos resistencia." }
    escalera:
      - "Q = √(L/C)/R = 316/R."
    solucion: "R = 10 Ω: Q = 31,6."
    comprobar:
      - { con: { R_r: 10 }, Q_r: 31.6, BW: 159.2, tol: 0.003 }

  - id: prediga-r
    tipo: explorar
    titulo: "Si se multiplica R por diez"
    texto: "El RLC de la práctica, 100 Ω, 10 mH y 100 nF, tiene Q = 3,16. Multiplique R por diez y mire la resonancia."
    libro: ["cap22#235", "cap22#251"]
    fijar: { L_r: 0.01, C_r: 100e-9 }
    inicio: { R_r: 100 }
    widget:
      tipo: circuito
      esquema: rlc-serie
      piezas: { fuente: V_p, f: f_r, r: R_r, l: L_r, c: C_r }
      lectura: { valor: f_0, rotulo: "Resonancia" }
      datos:
        - { valor: Q_r, rotulo: "Q = {{Q_r}}" }
      mide: { i_amp: I_f }
      grafica:
        x: { id: nu, min: 1000, max: 25000, unidad: Hz, rotulo: "f", escala: log }
        y: { min: 0, max: 0.11, unidad: A, rotulo: "|i|" }
        curvas:
          - { expr: "V_p/sqrt(R_r^2 + (2*pi*nu*L_r - 1/(2*pi*nu*C_r))^2)", color: naranja, rotulo: "|i|", mide: i_amp }
      mandos:
        - { valor: R_r, lista: [10, 50, 100, 1000] }
    objetivo:
      condiciones:
        - { valor: R_r, min: 1000, rotulo: "R: {{R_r}}" }
      logrado: "f₀ sigue en {{f_0}} y Q cae a {{Q_r}}: la resonancia la fijan L y C; el amortiguamiento, R."
      pistas:
        - { texto: "Elija 1 kΩ." }
    escalera:
      - "¿Aparece R en f₀ = 1/(2π√(LC))?"
    solucion: "Con 1 kΩ: la misma f₀ y Q = 0,316."
    comprobar:
      - { f_0: 5033, Q_r: 3.16 }
      - { con: { R_r: 1000 }, Q_r: 0.316 }

  - id: formula-f0
    tipo: explorar
    titulo: "La frecuencia de resonancia"
    texto: "Las reactancias se igualan cuando ωL = 1/(ωC): f₀ = 1/(2π√(LC)). Cambie C hasta llevar el pico a unos 7,3 kHz."
    libro: [154]
    fijar: { R_r: 50, L_r: 0.01 }
    inicio: { C_r: 100e-9 }
    widget:
      tipo: circuito
      esquema: rlc-serie
      piezas: { fuente: V_p, f: f_r, r: R_r, l: L_r, c: C_r }
      lectura: { valor: f_0, rotulo: "Resonancia" }
      mide: { i_amp: I_f }
      grafica:
        x: { id: nu, min: 1000, max: 25000, unidad: Hz, rotulo: "f", escala: log }
        y: { min: 0, max: 0.11, unidad: A, rotulo: "|i|" }
        curvas:
          - { expr: "V_p/sqrt(R_r^2 + (2*pi*nu*L_r - 1/(2*pi*nu*C_r))^2)", color: naranja, rotulo: "|i|", mide: i_amp }
      mandos:
        - { valor: C_r, lista: [47e-9, 100e-9, 220e-9] }
    objetivo:
      condiciones:
        - { valor: f_0, objetivo: 7341, tol: 0.02, rotulo: "f₀: {{f_0}}" }
      logrado: "Con {{C_r}}, {{f_0}}: menos capacidad, más frecuencia, con la raíz. Un 10 % de tolerancia en C son un 5 % en f₀."
      pistas:
        - { texto: "Para subir f₀, menos capacidad." }
    escalera:
      - "f₀ va con 1/√C."
    solucion: "47 nF: 7,34 kHz."
    comprobar:
      - { con: { C_r: 47e-9 }, f_0: 7341 }

  - id: formula-q
    tipo: marcar
    titulo: "Q y el ancho de banda"
    texto: "Con 50 Ω, Q = 6,32. Marque en la curva el corte inferior de −3 dB, la línea de trazos."
    libro: [155, 156, 160]
    fijar: { R_r: 50, L_r: 0.01, C_r: 100e-9 }
    widget:
      tipo: grafica
      x: { id: nu, min: 3500, max: 7000, unidad: Hz, rotulo: "f" }
      y: { min: 0, max: 0.022, unidad: A, rotulo: "|i|" }
      curvas:
        - { expr: "V_p/sqrt(R_r^2 + (2*pi*nu*L_r - 1/(2*pi*nu*C_r))^2)", color: naranja, rotulo: "|i|" }
        - { expr: "I_1", color: tinta, rotulo: "−3 dB", discontinua: true }
      mandos: []
    marcar:
      modo: x
      curva: 0
      x: "f_1"
      tol: 0.02
      inicio: { x: 3800, y: 0 }
      rotulo: "El corte inferior"
      pasos: 175
    pistas:
      - { cuando: { valor: marca_x, mayor: 4800 }, texto: "Más a la izquierda: busque donde la curva cruza la línea de −3 dB por su lado bajo." }
      - { texto: "Más a la derecha: ahí la curva aún está por debajo de la línea de −3 dB." }
    exito: "4650,74 Hz. El otro corte cae en 5446,51 Hz: BW = f₀/Q = 796 Hz."
    escalera:
      - "Busque donde la curva naranja corta la línea de trazos, a la izquierda del pico."
    solucion: "En 4650,74 Hz."
    comprobar:
      - { f_1: 4650.74, f_2: 5446.51, BW: 795.8, Q_r: 6.3246 }

  - id: estime-f0
    tipo: leer
    titulo: "Un sintonizado de radio"
    texto: "Un circuito sintonizado tiene L = 100 µH y C = 100 pF. Escriba su frecuencia de resonancia."
    libro: [154, "cap24#329"]
    widget:
      tipo: circuito
      esquema: rlc-serie
      piezas: { fuente: V_p, f: f_m, r: R_m, l: L_m, c: C_m }
      lectura: { valor: I_0m, rotulo: "Corriente en resonancia" }
      mide: { i_amp: I_m }
      mandos: []
    leer:
      objetivo: f_0m
      unidad: Hz
      tol: 0.02
      rotulo: "Resonancia"
      errores:
        - { expr: "1/sqrt(L_m*C_m)", texto: "Eso es ω₀, en rad/s. La frecuencia es ω₀/(2π)." }
    exito: "1/(2π·√(10⁻⁴ × 10⁻¹⁰)) = 1/(2π × 10⁻⁷) ≈ 1,59 MHz: la parte alta de la onda media."
    escalera:
      - "LC = 10⁻¹⁴; su raíz, 10⁻⁷ s."
    solucion: "1/(2π × 10⁻⁷) ≈ 1,59 MHz."
    comprobar:
      - { f_0m: 1591549 }

  - id: estime-bw
    tipo: leer
    titulo: "Su ancho de banda"
    texto: "Ese sintonizado de 1,59 MHz, con 10 Ω de resistencia, tiene Q = 100. Escriba su ancho de banda."
    libro: [156, 158]
    widget:
      tipo: circuito
      esquema: rlc-serie
      piezas: { fuente: V_p, f: f_m, r: R_m, l: L_m, c: C_m }
      lectura: { valor: Q_m, rotulo: "Factor de calidad Q" }
      mide: { i_amp: I_m }
      mandos: []
    leer:
      objetivo: BW_m
      unidad: Hz
      tol: 0.02
      rotulo: "Ancho de banda"
      errores:
        - { expr: "f_0m*Q_m", texto: "Ha multiplicado. Cuanto más Q, más estrecha la banda: BW = f₀/Q." }
    exito: "1,59 MHz / 100 ≈ 15,9 kHz: estrecho frente a la onda media, de 531 a 1602 kHz."
    escalera:
      - "BW = f₀/Q."
    solucion: "1,59 MHz / 100 ≈ 15,9 kHz."
    comprobar:
      - { Q_m: 100, BW_m: 15915 }

  - id: adyacente
    tipo: leer
    titulo: "La emisora de al lado"
    texto: "Una emisora a 9 kHz de la sintonizada da la corriente de la lectura; en resonancia hay 100 mA. Escriba cuántos decibelios cae."
    libro: [158]
    widget:
      tipo: circuito
      esquema: rlc-serie
      piezas: { fuente: V_p, f: f_m, r: R_m, l: L_m, c: C_m }
      lectura: { valor: I_9, rotulo: "Corriente a +9 kHz" }
      mide: { i_amp: I_m }
      grafica:
        x: { id: nu, min: 1500000, max: 1700000, unidad: Hz, rotulo: "f" }
        y: { min: 0, max: 0.11, unidad: A, rotulo: "|i|" }
        curvas:
          - { expr: "V_p/sqrt(R_m^2 + (2*pi*nu*L_m - 1/(2*pi*nu*C_m))^2)", color: naranja, rotulo: "|i|", mide: i_amp }
        marcas:
          - { x: "f_9", y: "I_9", rotulo: "+9 kHz" }
      mandos: []
    leer:
      objetivo: a_9
      unidad: dB
      tol: 0.03
      rotulo: "Lo que cae a 9 kHz"
      errores:
        - { expr: "10*log10(I_0m/I_9)", texto: "Eso es en potencia sobre corrientes: para corrientes, 20·log₁₀." }
    exito: "Solo unos 3,6 dB: atenúa mucho las alejadas, pero no separa dos adyacentes. Los receptores encadenan sintonizados o usan la frecuencia intermedia."
    escalera:
      - "20·log₁₀(100 mA / la lectura)."
    solucion: "20·log₁₀(0,1/0,066) ≈ 3,6 dB."
    comprobar:
      - { a_9: 3.6, BW_m: 15915, I_0m: 0.1, I_9: 0.0661, tol: 0.02 }

  - id: media-geometrica
    tipo: marcar
    titulo: "f₀ no está en el centro"
    texto: "Los cortes del RLC de 50 Ω caen en 4650,74 y 5446,51 Hz. Marque en la curva la resonancia: no está en su media aritmética."
    libro: [160]
    fijar: { R_r: 50, L_r: 0.01, C_r: 100e-9 }
    widget:
      tipo: grafica
      x: { id: nu, min: 4400, max: 5700, unidad: Hz, rotulo: "f" }
      y: { min: 0, max: 0.022, unidad: A, rotulo: "|i|" }
      curvas:
        - { expr: "V_p/sqrt(R_r^2 + (2*pi*nu*L_r - 1/(2*pi*nu*C_r))^2)", color: naranja, rotulo: "|i|" }
        - { expr: "I_1", color: tinta, rotulo: "−3 dB", discontinua: true }
      mandos: []
    marcar:
      modo: x
      curva: 0
      x: "f_0"
      tol: 0.008
      inicio: { x: 5500, y: 0 }
      rotulo: "La resonancia"
      pasos: 130
    pistas:
      - { cuando: { valor: marca_x, mayor: 5045 }, texto: "Más a la izquierda: busque la cima exacta. La media aritmética, 5048,62 Hz, se pasa." }
      - { texto: "Más a la derecha: la cima está más cerca del corte superior que del inferior en hercios." }
    exito: "5032,92 Hz = √(4650,74 × 5446,51): la media geométrica. La curva es simétrica en escala logarítmica."
    escalera:
      - "Busque la cima de la curva."
    solucion: "En 5032,92 Hz, no en 5048,62 Hz."
    comprobar:
      - { f_1: 4650.74, f_2: 5446.51, f_g: 5032.92, f_a: 5048.62, f_0: 5032.92 }

  - id: por-que-oscila
    tipo: porque
    titulo: "¿Por qué el 78 %?"
    texto: "Ese RLC de Q = 6,32, ante un escalón, se pasa un 78 % del valor final. ¿Por qué un circuito selectivo timbra tanto?"
    libro: [159, 160]
    fijar: { R_r: 50, L_r: 0.01, C_r: 100e-9 }
    widget:
      tipo: circuito
      esquema: rlc-escalon
      piezas: { fuente: V_e, r: R_r, l: L_r, c: C_r }
      lectura: { valor: z_r, rotulo: "Amortiguamiento ζ" }
      datos:
        - { valor: OS, rotulo: "Sobreimpulso: {{OS}}" }
      grafica:
        x: { id: t, min: 0, max: 0.002, unidad: s, rotulo: "t" }
        y: { min: 0, max: 2, unidad: V, rotulo: "v_{C}" }
        curvas:
          - { expr: "V_e*(1 - exp(-a_r*t)*(cos(wd_r*t) + a_r/wd_r*sin(wd_r*t)))", color: verde, rotulo: "v_{C} tras un escalón de 1 V", mide: vc }
          - { expr: "V_e", color: tinta, rotulo: "valor final", discontinua: true }
    opciones:
      - texto: "Porque Q alto es ζ bajo: ζ = 1/(2Q) = 0,079"
        bien: true
        porque: "Amortiguamiento y selectividad son el mismo parámetro, visto desde el tiempo o desde la frecuencia."
      - texto: "Porque la fuente le inyecta energía en cada ciclo"
        porque: "Ante un escalón no hay ciclos que inyectar: es su respuesta natural la que oscila, con poco amortiguamiento."
      - texto: "Porque R es demasiado grande"
        porque: "Al revés: con R pequeña Q sube y ζ baja, y el circuito timbra más."
    escalera:
      - "Recuerde la relación entre ζ y Q."
    solucion: "ζ = 1/(2 × 6,3246) = 0,0791: muy poco amortiguado."
    comprobar:
      - { Q_r: 6.32, z_r: 0.0791, OS: 78 }

  - id: fm7303
    tipo: pregunta
    fase: "Empareje"
    titulo: "Los resonadores del FM7303"
    texto: "El receptor del capítulo 15 tiene resonadores en tres puntos. Una cada uno con su función."
    libro: [158]
    emparejar:
      - ["L1 + C4A", "Preselecciona la emisora a la entrada"]
      - ["L2 + C4B", "Fija la frecuencia del oscilador local"]
      - ["Filtros cerámicos de 10,7 MHz", "Rechazan las emisoras vecinas"]
    exito: "La selectividad fina la da la frecuencia intermedia, con una banda de unos 280 kHz."
    pistas:
      - { texto: "Los dos circuitos LC van en el condensador variable doble; los cerámicos, en la frecuencia intermedia." }
    escalera:
      - "A, la entrada; B, el oscilador."
    solucion: "L1 + C4A: entrada; L2 + C4B: oscilador local; cerámicos: vecinas."

  - id: banco-resonancia
    tipo: banco
    titulo: "Mida la resonancia"
    texto: "Monte el RLC de la práctica, 100 Ω, 10 mH y 100 nF, barra el generador y anote la frecuencia del máximo sobre la resistencia."
    libro: ["cap22#235", "cap22#246", "cap22#248"]
