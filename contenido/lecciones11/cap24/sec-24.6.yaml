# Lección 1.2 de la sección 23.6 «Resonancia y Factor de Calidad» (cap24). Formato: contenido/lecciones11/GUIA.md.
# El RLC es el del recuadro de deducción (bloque 160: 50 Ω, 10 mH, 100 nF); el de la radio, el del bloque 158
# (100 µH, 100 pF, 10 Ω, Q = 100); el del banco, el de la práctica 9 (cap22#235: 100 Ω, 10 mH, 100 nF), ficha 33.
leccion: cap24/sec-24.6

libro:
  153: "un circuito RLC serie presenta impedancia mínima (solo R) y la corriente es máxima"
  154: 'f_("0") = ("1")/("2" π dot.op sqrt(L dot.op C))'
  155: "el rango de frecuencias entre los puntos de −3 dB"
  156: '"BW" = (f_("0"))/(Q)'
  158: "una emisora a 9 kHz solo cae unos 3,6 dB"
  159: "Resonancia y amortiguamiento son dos caras de lo mismo"
  160: "√(4650,74 × 5446,51) = 5032,92 Hz = f₀ exactamente, mientras que la media aritmética da 5048,62 Hz"
  "cap24#329": "Un circuito sintonizado tiene L = 100 µH y C = 100 pF"
  "cap22#235": "L = 10 mH, C = 100 nF, R = 100 Ω"
  "cap22#246": "un 10 % de tolerancia en C son un 5 % en f₀"
  "cap22#248": "La resistencia de la bobina"
  "cap22#251": "Al cambiar R de 100 Ω a 1 kΩ, la frecuencia de resonancia no se mueve y el Q cae de 3 a 0,3"

modelo:
  valores:
    V_p: { sim: "V_{p}", nombre: "amplitud de la fuente", unidad: V, valor: 1 }
    f_r: { sim: "f", nombre: "frecuencia de la fuente", unidad: Hz, valor: 5032.92 }
    R_r: { sim: "R", nombre: "resistencia", unidad: Ω, valor: 50 }
    L_r: { sim: "L", nombre: "inductancia", unidad: H, valor: 0.01 }
    C_r: { sim: "C", nombre: "capacidad", unidad: F, valor: 100e-9 }
    f_m: { sim: "f", nombre: "frecuencia de la emisora", unidad: Hz, valor: 1591549 }
    R_m: { sim: "R", nombre: "resistencia del sintonizado", unidad: Ω, valor: 10 }
    L_m: { sim: "L", nombre: "inductancia del sintonizado", unidad: H, valor: 100e-6 }
    C_m: { sim: "C", nombre: "capacidad del sintonizado", unidad: F, valor: 100e-12 }
  calculos:
    f_0: { expr: "1/(2*pi*sqrt(L_r*C_r))", sim: "f₀", nombre: "frecuencia de resonancia", unidad: Hz, cifras: 4 }
    Q_r: { expr: "sqrt(L_r/C_r)/R_r", sim: "Q", nombre: "factor de calidad", unidad: "", cifras: 3 }
    BW: { expr: "f_0/Q_r", sim: "BW", nombre: "ancho de banda", unidad: Hz }
    I_0: { expr: "V_p/R_r", sim: "I_{máx}", nombre: "corriente en resonancia", unidad: A }
    I_f: { expr: "V_p/sqrt(R_r^2 + (2*pi*f_r*L_r - 1/(2*pi*f_r*C_r))^2)", sim: "I", nombre: "amplitud de la corriente", unidad: A }
    f_1: { expr: "sqrt(f_0^2 + (BW/2)^2) - BW/2", sim: "f₁", nombre: "corte inferior", unidad: Hz, cifras: 6 }
    f_2: { expr: "sqrt(f_0^2 + (BW/2)^2) + BW/2", sim: "f₂", nombre: "corte superior", unidad: Hz, cifras: 6 }
    f_g: { expr: "sqrt(f_1*f_2)", sim: "√(f₁f₂)", nombre: "media geométrica de los cortes", unidad: Hz, cifras: 6 }
    f_a: { expr: "(f_1 + f_2)/2", sim: "(f₁+f₂)/2", nombre: "media aritmética de los cortes", unidad: Hz, cifras: 6 }
    I_1: { expr: "I_0*0.7071", sim: "I", nombre: "corriente en los cortes", unidad: A }
    z_r: { expr: "R_r/2*sqrt(C_r/L_r)", sim: "ζ", nombre: "amortiguamiento", unidad: "", cifras: 3 }
    OS: { expr: "100*exp(-pi*z_r/sqrt(max(1 - z_r^2, 1e-12)))", sim: "SO", nombre: "sobreimpulso ante un escalón", unidad: "%" }
    f_0m: { expr: "1/(2*pi*sqrt(L_m*C_m))", sim: "f₀", nombre: "resonancia del sintonizado", unidad: Hz }
    Q_m: { expr: "sqrt(L_m/C_m)/R_m", sim: "Q", nombre: "factor de calidad del sintonizado", unidad: "" }
    BW_m: { expr: "f_0m/Q_m", sim: "BW", nombre: "ancho de banda del sintonizado", unidad: Hz }
    I_m: { expr: "V_p/sqrt(R_m^2 + (2*pi*f_m*L_m - 1/(2*pi*f_m*C_m))^2)", sim: "I", nombre: "corriente del sintonizado", unidad: A }
    f_9: { expr: "f_0m + 9000", sim: "f", nombre: "emisora adyacente", unidad: Hz }
    a_9: { expr: "20*log10(sqrt(R_m^2 + (2*pi*f_9*L_m - 1/(2*pi*f_9*C_m))^2)/R_m)", sim: "a", nombre: "atenuación de la adyacente", unidad: dB, cifras: 2 }

tarjetas:
  - id: explore-resonancia
    tipo: explorar
    titulo: "Donde las reactancias se cancelan"
    texto: "La corriente de un RLC serie de 10 mH y 100 nF frente a la frecuencia. Cambie R: el pico no se mueve, pero se estrecha o se ensancha."
    libro: [153, 155]
    widget:
      tipo: circuito
      esquema: rlc-serie
      piezas: { fuente: V_p, f: f_r, r: R_r, l: L_r, c: C_r }
      lectura: { valor: f_0, rotulo: "Resonancia" }
      datos:
        - { valor: Q_r, rotulo: "Q = {{Q_r}}" }
        - { valor: BW, rotulo: "Ancho de banda: {{BW}}" }
      mide: { i_amp: I_f }
      grafica:
        x: { id: nu, min: 1000, max: 25000, unidad: Hz, rotulo: "f", escala: log }
        y: { min: 0, max: 0.11, unidad: A, rotulo: "|i|" }
        curvas:
          - { expr: "V_p/sqrt(R_r^2 + (2*pi*nu*L_r - 1/(2*pi*nu*C_r))^2)", color: naranja, rotulo: "|i|", mide: i_amp }
        marcas:
          - { x: "f_0", y: "I_0", rotulo: "f₀" }
      mandos:
        - { valor: R_r, lista: [10, 50, 100, 1000] }

  - id: prediga-r
    tipo: predecir
    titulo: "Si se multiplica R por diez"
    texto: "Un RLC serie de 10 mH y 100 nF pasa de R = 100 Ω a 1 kΩ. ¿Qué le ocurre a su resonancia?"
    libro: ["cap22#235", "cap22#251"]
    fijar: { R_r: 1000, L_r: 0.01, C_r: 100e-9, f_r: 5032.92 }
    widget:
      tipo: circuito
      esquema: rlc-serie
      piezas: { fuente: V_p, f: f_r, r: R_r, l: L_r, c: C_r }
      lectura: { valor: f_0, rotulo: "Resonancia" }
      datos:
        - { valor: Q_r, rotulo: "Q = {{Q_r}}" }
      mide: { i_amp: I_f }
      ocultar: true
    opciones:
      - texto: "f₀ no se mueve; Q cae de 3 a 0,3 y la curva se aplana"
        bien: true
        porque: "La resonancia la fijan L y C; el amortiguamiento, R. Son dos propiedades independientes."
      - texto: "f₀ baja a la décima parte"
        porque: "R no aparece en f₀ = 1/(2π√(LC)). Confundir frecuencia y amortiguamiento es un error conceptual frecuente."
      - texto: "Q sube a 30: la curva se afila"
        porque: "Al revés: Q = √(L/C)/R, así que más resistencia es menos Q."
    escalera:
      - "¿Aparece R en la fórmula de f₀?"
    solucion: "La misma f₀; Q diez veces menor."
    comprobar:
      - { f_0: 5033, Q_r: 0.316 }
      - { con: { R_r: 100 }, Q_r: 3.16 }

  - id: formula-f0
    tipo: formula
    titulo: "La frecuencia de resonancia"
    texto: "Las reactancias se igualan cuando ωL = 1/(ωC). Cambie C y vea moverse el pico."
    libro: [154]
    ec: 154
    sustitucion: "1 / (2π · √({{L_r}} · {{C_r}})) = {{f_0}}"
    widget:
      tipo: circuito
      esquema: rlc-serie
      piezas: { fuente: V_p, f: f_r, r: R_r, l: L_r, c: C_r }
      lectura: { valor: f_0, rotulo: "Resonancia" }
      mide: { i_amp: I_f }
      grafica:
        x: { id: nu, min: 1000, max: 25000, unidad: Hz, rotulo: "f", escala: log }
        y: { min: 0, max: 0.11, unidad: A, rotulo: "|i|" }
        curvas:
          - { expr: "V_p/sqrt(R_r^2 + (2*pi*nu*L_r - 1/(2*pi*nu*C_r))^2)", color: naranja, rotulo: "|i|", mide: i_amp }
      mandos:
        - { valor: C_r, lista: [47e-9, 100e-9, 220e-9] }

  - id: formula-q
    tipo: formula
    titulo: "Q y el ancho de banda"
    texto: "Q mide la nitidez: el ancho de banda entre los puntos de −3 dB es f₀/Q. Cambie R."
    libro: [155, 156]
    ec: 156
    sustitucion: "Q = √({{L_r}}/{{C_r}}) / {{R_r}} = {{Q_r}}; BW = {{BW}}"
    fijar: { L_r: 0.01, C_r: 100e-9 }
    widget:
      tipo: circuito
      esquema: rlc-serie
      piezas: { fuente: V_p, f: f_r, r: R_r, l: L_r, c: C_r }
      lectura: { valor: BW, rotulo: "Ancho de banda" }
      mide: { i_amp: I_f }
      grafica:
        x: { id: nu, min: 1000, max: 25000, unidad: Hz, rotulo: "f", escala: log }
        y: { min: 0, max: 0.11, unidad: A, rotulo: "|i|" }
        curvas:
          - { expr: "V_p/sqrt(R_r^2 + (2*pi*nu*L_r - 1/(2*pi*nu*C_r))^2)", color: naranja, rotulo: "|i|", mide: i_amp }
          - { expr: "I_1", color: tinta, rotulo: "−3 dB", discontinua: true }
      mandos:
        - { valor: R_r, lista: [10, 50, 100, 1000] }

  - id: estime-f0
    tipo: pregunta
    fase: "Estime"
    titulo: "Un sintonizado de radio"
    texto: "Un circuito sintonizado tiene L = 100 µH y C = 100 pF. Estime su frecuencia de resonancia."
    libro: [154, "cap24#329"]
    estimar:
      objetivo: "f_0m"
      unidad: Hz
      min: 0
      max: 5000000
      paso: 10000
      inicio: 500000
      tol: 0.05
      rotulo: "Resonancia"
    exito: "1/(2π·√(10⁻⁴ × 10⁻¹⁰)) = 1/(2π × 10⁻⁷) ≈ 1,59 MHz: la parte alta de la onda media."
    pistas:
      - { cuando: { valor: estimacion, mayor: 1670000 }, texto: "Demasiado: √(LC) = 10⁻⁷ s, y luego divida 1 entre 2π veces eso." }
      - { texto: "Poco: √(10⁻⁴ × 10⁻¹⁰) = 10⁻⁷, y 1/(2π × 10⁻⁷) pasa del megahercio." }
    escalera:
      - "LC = 10⁻¹⁴; su raíz, 10⁻⁷ s."
    solucion: "1/(2π × 10⁻⁷) ≈ 1,59 MHz."
    comprobar:
      - { f_0m: 1591549 }

  - id: estime-bw
    tipo: pregunta
    fase: "Estime"
    titulo: "Su ancho de banda"
    texto: "Ese sintonizado de 1,59 MHz, con 10 Ω de resistencia, tiene Q = 100. Estime su ancho de banda."
    libro: [156, 158]
    estimar:
      objetivo: "BW_m"
      unidad: Hz
      min: 0
      max: 100000
      paso: 100
      inicio: 50000
      tol: 0.05
      rotulo: "Ancho de banda"
    exito: "1,59 MHz / 100 ≈ 15,9 kHz: estrecho frente a la onda media, de 531 a 1602 kHz."
    pistas:
      - { cuando: { valor: estimacion, mayor: 16700 }, texto: "Demasiado: es la centésima parte de f₀." }
      - { texto: "Poco: 1,59 MHz entre 100." }
    escalera:
      - "BW = f₀/Q."
    solucion: "1,59 MHz / 100 ≈ 15,9 kHz."
    comprobar:
      - { Q_m: 100, BW_m: 15915 }

  - id: adyacente
    tipo: pregunta
    titulo: "La emisora de al lado"
    texto: "Con ese sintonizado de Q = 100, una emisora a 9 kHz de la sintonizada, ¿queda rechazada?"
    libro: [158]
    widget:
      tipo: circuito
      esquema: rlc-serie
      piezas: { fuente: V_p, f: f_m, r: R_m, l: L_m, c: C_m }
      lectura: { valor: a_9, rotulo: "Atenuación a 9 kHz" }
      mide: { i_amp: I_m }
      grafica:
        x: { id: nu, min: 1500000, max: 1700000, unidad: Hz, rotulo: "f" }
        y: { min: 0, max: 0.11, unidad: A, rotulo: "|i|" }
        curvas:
          - { expr: "V_p/sqrt(R_m^2 + (2*pi*nu*L_m - 1/(2*pi*nu*C_m))^2)", color: naranja, rotulo: "|i|", mide: i_amp }
        marcas:
          - { x: "f_9", y: "V_p/sqrt(R_m^2 + (2*pi*f_9*L_m - 1/(2*pi*f_9*C_m))^2)", rotulo: "+9 kHz" }
    opciones:
      - texto: "No: solo cae unos 3,6 dB"
        bien: true
        porque: "Atenúa mucho las alejadas, pero no separa dos adyacentes: los receptores encadenan sintonizados o usan la frecuencia intermedia."
      - texto: "Sí: queda fuera de la banda y desaparece"
        porque: "Fuera de la banda de −3 dB no significa desaparecer: la curva cae despacio cerca de f₀."
      - texto: "Sí, porque Q = 100 es muy alto"
        porque: "Q = 100 da 16 kHz de banda: una emisora a 9 kHz está casi en el borde."
    escalera:
      - "La banda es de unos 16 kHz: ¿dónde cae una emisora a 9 kHz?"
    solucion: "Cae unos 3,6 dB: no basta para separarla."
    comprobar:
      - { a_9: 3.6, BW_m: 15915, tol: 0.02 }

  - id: media-geometrica
    tipo: sorpresa
    titulo: "f₀ no está en el centro"
    texto: "Los cortes del RLC de 50 Ω caen en 4650,74 y 5446,51 Hz; f₀ no es su media aritmética, sino la geométrica. Cambie R."
    libro: [160]
    fijar: { L_r: 0.01, C_r: 100e-9 }
    inicio: { R_r: 50 }
    widget:
      tipo: circuito
      esquema: rlc-serie
      piezas: { fuente: V_p, f: f_r, r: R_r, l: L_r, c: C_r }
      lectura: { valor: f_g, rotulo: "Media geométrica" }
      datos:
        - { valor: f_a, rotulo: "Media aritmética: {{f_a}}" }
        - { valor: f_0, rotulo: "f₀ = {{f_0}}" }
      mide: { i_amp: I_f }
      grafica:
        x: { id: nu, min: 1000, max: 25000, unidad: Hz, rotulo: "f", escala: log }
        y: { min: 0, max: 0.11, unidad: A, rotulo: "|i|" }
        curvas:
          - { expr: "V_p/sqrt(R_r^2 + (2*pi*nu*L_r - 1/(2*pi*nu*C_r))^2)", color: naranja, rotulo: "|i|", mide: i_amp }
        marcas:
          - { x: "f_1", y: "I_1", rotulo: "f₁" }
          - { x: "f_2", y: "I_1", rotulo: "f₂" }
      mandos:
        - { valor: R_r, lista: [10, 50, 100, 1000] }
    comprobar:
      - { con: { R_r: 50 }, f_1: 4650.74, f_2: 5446.51, f_g: 5032.92, f_a: 5048.62 }

  - id: por-que-oscila
    tipo: porque
    titulo: "¿Por qué el 78 %?"
    texto: "Ese RLC de Q = 6,32, ante un escalón, se pasa un 78 % del valor final. ¿Por qué un circuito selectivo timbra tanto?"
    libro: [159, 160]
    fijar: { R_r: 50, L_r: 0.01, C_r: 100e-9 }
    widget:
      tipo: circuito
      esquema: rlc-serie
      piezas: { fuente: V_p, f: f_r, r: R_r, l: L_r, c: C_r }
      lectura: { valor: z_r, rotulo: "Amortiguamiento ζ" }
      datos:
        - { valor: OS, rotulo: "Sobreimpulso: {{OS}}" }
      mide: { i_amp: I_f }
      grafica:
        x: { id: nu, min: 1000, max: 25000, unidad: Hz, rotulo: "f", escala: log }
        y: { min: 0, max: 0.11, unidad: A, rotulo: "|i|" }
        curvas:
          - { expr: "V_p/sqrt(R_r^2 + (2*pi*nu*L_r - 1/(2*pi*nu*C_r))^2)", color: naranja, rotulo: "|i|", mide: i_amp }
    opciones:
      - texto: "Porque Q alto es ζ bajo: ζ = 1/(2Q) = 0,079"
        bien: true
        porque: "Amortiguamiento y selectividad son el mismo parámetro, visto desde el tiempo o desde la frecuencia."
      - texto: "Porque la fuente le inyecta energía en cada ciclo"
        porque: "Ante un escalón no hay ciclos que inyectar: es su respuesta natural la que oscila, con poco amortiguamiento."
      - texto: "Porque R es demasiado grande"
        porque: "Al revés: con R pequeña Q sube y ζ baja, y el circuito timbra más."
    escalera:
      - "Recuerde la relación entre ζ y Q."
    solucion: "ζ = 1/(2 × 6,3246) = 0,0791: muy poco amortiguado."
    comprobar:
      - { Q_r: 6.32, z_r: 0.0791, OS: 78 }

  - id: fm7303
    tipo: pregunta
    fase: "Empareje"
    titulo: "Los resonadores del FM7303"
    texto: "El receptor del capítulo 15 tiene resonadores en tres puntos. Una cada uno con su función."
    libro: [158]
    emparejar:
      - ["L1 + C4A", "Preselecciona la emisora a la entrada"]
      - ["L2 + C4B", "Fija la frecuencia del oscilador local"]
      - ["Filtros cerámicos de 10,7 MHz", "Rechazan las emisoras vecinas"]
    exito: "La selectividad fina la da la frecuencia intermedia, con una banda de unos 280 kHz."
    pistas:
      - { texto: "Los dos circuitos LC van en el condensador variable doble; los cerámicos, en la frecuencia intermedia." }
    escalera:
      - "A, la entrada; B, el oscilador."
    solucion: "L1 + C4A: entrada; L2 + C4B: oscilador local; cerámicos: vecinas."

  - id: banco-resonancia
    tipo: banco
    titulo: "Mida la resonancia"
    texto: "Monte el RLC de la práctica, 100 Ω, 10 mH y 100 nF, barra el generador y anote la frecuencia del máximo sobre la resistencia."
    libro: ["cap22#235", "cap22#246", "cap22#248"]
    fijar: { R_r: 100, L_r: 0.01, C_r: 100e-9 }
    banco:
      piezas: ["R = 100 Ω, L = 10 mH y C = 100 nF", "Generador del FNIRSI de 1 a 20 kHz", "Canal 2 sobre la resistencia"]
      medir: "La frecuencia a la que la amplitud sobre la resistencia es máxima."
      esperado: f_0
      unidad: Hz
      tol: 0.05
      consejos:
        - { cuando: { valor: desviacion, mayor: 0.05 }, texto: "Sale alta: mida C; un 10 % menos de capacidad sube f₀ un 5 %." }
        - { texto: "Sale baja: mida C y L; un 10 % más de capacidad baja f₀ un 5 %. La curva será además más plana por la resistencia de la bobina." }
      ficha: { n: 33, titulo: "Práctica 9 · Resonancia de un RLC y factor Q" }
    comprobar:
      - { f_0: 5033 }

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [153, 154, 156, 160]
    ideas:
      - { titulo: "Resonancia.", texto: "f₀ = 1/(2π√(LC)): en serie, impedancia mínima y corriente máxima." }
      - { titulo: "Q y la banda.", texto: "Q = √(L/C)/R y BW = f₀/Q: R decide el ancho, no la frecuencia." }
      - { titulo: "Simétrica en log.", texto: "f₀ es la media geométrica de los cortes." }
      - { titulo: "Q y ζ.", texto: "ζ = 1/(2Q): el más selectivo es el que más timbra." }
