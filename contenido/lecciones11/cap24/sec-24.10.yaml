# Lección 1.2 de la sección 23.11 «Resumen del Capítulo» (cap24, etiqueta sec-24.10). Formato: GUIA.md.
# Repaso del capítulo con sus propios ejemplos: el RC de 1 kΩ y 100 nF a 1 kHz (23.4), el RLC de 50 Ω, 10 mH y
# 100 nF (23.6, ζ = 0,079) y el transformador ideal con el altavoz de 8 Ω (23.9). El escalón del RLC, con el esquema
# «rlc-escalon» y 1 V (EJEMPLO: el libro no da tensión).
leccion: cap24/sec-24.10

libro:
  319: "A 5τ falta el 0,674 %, y para 12 bits hacen falta unos 8,3τ."
  320: "Con ζ = 0,079 (Q = 6,32) el sobreimpulso es del 78 %."
  321: "Las magnitudes en cuadratura se suman como catetos, no como números."
  322: "el factor de cresta decide si un multímetro de valor medio acierta: solo con senoides"
  323: "El cableado se dimensiona por S, la factura por P."
  324: "con f₀ en la media geométrica de los cortes"
  325: "su banda la limitan la inductancia magnetizante por abajo y la dispersión y la capacidad por arriba"
  327: "Sumar como números tensiones o impedancias que están en cuadratura."
  "cap24#133": "dimensionarse para 2 300 VA"
  "cap24#22": 'V_("ef") = (V_("pico"))/(sqrt("2"))'
  "cap24#87": "Un RC serie de 1 kΩ y 100 nF a 1 kHz"
  "cap24#160": "Para los números de este recuadro se usa un RLC serie con R = 50 Ω, L = 10 mH y C = 100 nF."
  "cap24#221": "Un altavoz de 8 Ω a través de un transformador 10:1 se ve desde el primario como 800 Ω."

modelo:
  valores:
    V_p: { sim: "V_{p}", nombre: "amplitud de la fuente", unidad: V, valor: 1 }
    f_f: { sim: "f", nombre: "frecuencia de la fuente", unidad: Hz, valor: 1000 }
    R_f: { sim: "R", nombre: "resistencia", unidad: Ω, valor: 1000 }
    C_f: { sim: "C", nombre: "capacidad", unidad: F, valor: 100e-9 }
    f_r: { sim: "f", nombre: "frecuencia del RLC", unidad: Hz, valor: 5032.92 }
    R_r: { sim: "R", nombre: "resistencia del RLC", unidad: Ω, valor: 50 }
    L_r: { sim: "L", nombre: "inductancia del RLC", unidad: H, valor: 0.01 }
    C_r: { sim: "C", nombre: "capacidad del RLC", unidad: F, valor: 100e-9 }
    V_e: { sim: "V", nombre: "escalón de la fuente", unidad: V, valor: 1 }
    V_1: { sim: "V₁", nombre: "tensión del primario", unidad: V, valor: 230 }
    N_1: { sim: "N₁", nombre: "espiras del primario", unidad: "", valor: 1000 }
    N_2: { sim: "N₂", nombre: "espiras del secundario", unidad: "", valor: 100 }
    R_2l: { sim: "R_{L}", nombre: "altavoz", unidad: Ω, valor: 8 }
    V_pk: { sim: "V_{pico}", nombre: "pico de la red", unidad: V, valor: 325.27 }
  calculos:
    w_f: { expr: "2*pi*f_f", sim: "ω", nombre: "frecuencia angular", unidad: "rad/s" }
    X_c: { expr: "1/(w_f*C_f)", sim: "X_{C}", nombre: "reactancia", unidad: Ω }
    Z_m: { expr: "sqrt(R_f^2 + X_c^2)", sim: "|Z|", nombre: "módulo de la impedancia", unidad: Ω }
    I_a: { expr: "V_p/Z_m", sim: "I", nombre: "amplitud de la corriente", unidad: A }
    A_r: { expr: "I_a*R_f", sim: "V_{R}", nombre: "amplitud en R", unidad: V }
    A_c: { expr: "I_a*X_c", sim: "V_{C}", nombre: "amplitud en C", unidad: V }
    S_ab: { expr: "A_r + A_c", sim: "V_{R} + V_{C}", nombre: "suma de las amplitudes", unidad: V }
    S_q: { expr: "sqrt(A_r^2 + A_c^2)", sim: "√(V_{R}² + V_{C}²)", nombre: "suma como catetos", unidad: V }
    f_0: { expr: "1/(2*pi*sqrt(L_r*C_r))", sim: "f₀", nombre: "resonancia", unidad: Hz, cifras: 6 }
    Q_r: { expr: "sqrt(L_r/C_r)/R_r", sim: "Q", nombre: "factor de calidad", unidad: "", cifras: 3 }
    z_r: { expr: "1/(2*Q_r)", sim: "ζ", nombre: "amortiguamiento", unidad: "", cifras: 2 }
    OS: { expr: "100*exp(-pi*z_r/sqrt(1 - z_r^2))", sim: "SO", nombre: "sobreimpulso", unidad: "%" }
    a_r: { expr: "R_r/(2*L_r)", sim: "α", nombre: "amortiguamiento del escalón", unidad: "1/s" }
    wd_r: { expr: "sqrt(max(1/(L_r*C_r) - a_r^2, 1))", sim: "ω_{d}", nombre: "pulsación amortiguada", unidad: "rad/s" }
    BW: { expr: "f_0/Q_r", sim: "BW", nombre: "ancho de banda", unidad: Hz }
    f_1: { expr: "sqrt(f_0^2 + (BW/2)^2) - BW/2", sim: "f₁", nombre: "corte inferior", unidad: Hz, cifras: 6 }
    f_2: { expr: "sqrt(f_0^2 + (BW/2)^2) + BW/2", sim: "f₂", nombre: "corte superior", unidad: Hz, cifras: 6 }
    I_r: { expr: "V_p/sqrt(R_r^2 + (2*pi*f_r*L_r - 1/(2*pi*f_r*C_r))^2)", sim: "I", nombre: "corriente del RLC", unidad: A }
    V_2: { expr: "V_1*N_2/N_1", sim: "V₂", nombre: "tensión del secundario", unidad: V }
    I_2: { expr: "V_2/R_2l", sim: "I₂", nombre: "corriente del secundario", unidad: A }
    I_1: { expr: "I_2*N_2/N_1", sim: "I₁", nombre: "corriente del primario", unidad: A }
    Z_r: { expr: "R_2l*(N_1/N_2)^2", sim: "Z_{refl}", nombre: "impedancia vista desde el primario", unidad: Ω }
    V_ef: { expr: "V_pk/sqrt(2)", sim: "V_{ef}", nombre: "eficaz de la red", unidad: V }
    f5: { expr: "100*exp(-5)", sim: "falta", nombre: "lo que falta a 5τ", unidad: "%", cifras: 3 }

tarjetas:
  - id: explore-repaso
    tipo: explorar
    titulo: "El capítulo en un RC"
    texto: "El RC de 1 kΩ y 100 nF. Cambie la frecuencia: la misma senoide sale con otra amplitud y otra fase, y R y C se reparten la tensión en cuadratura."
    libro: [321, "cap24#87"]
    widget:
      tipo: circuito
      esquema: filtro-rc
      piezas: { fuente: V_p, f: f_f, r: R_f, c: C_f }
      lectura: { valor: Z_m, rotulo: "Módulo de la impedancia" }
      barras:
        - { valor: A_r, rotulo: "V_{R}: {{A_r}}", color: azul }
        - { valor: A_c, rotulo: "V_{C}: {{A_c}}", color: naranja }
      mide: { vr_amp: A_r, vc_amp: A_c }
      mandos:
        - { valor: f_f, lista: [500, 1000, 2000] }

  - id: prediga-78
    tipo: predecir
    titulo: "El RLC del capítulo"
    texto: "El RLC de 50 Ω, 10 mH y 100 nF tiene Q = 6,32. Ante un escalón, ¿cuánto se pasa la tensión del condensador?"
    libro: [320, "cap24#160"]
    nota: "Solo la subida: el pico llega después."
    widget:
      tipo: circuito
      esquema: rlc-escalon
      piezas: { fuente: V_e, r: R_r, l: L_r, c: C_r }
      lectura: { valor: OS, rotulo: "Sobreimpulso" }
      datos:
        - { valor: z_r, rotulo: "ζ = {{z_r}}" }
      grafica:
        x: { id: t, min: 0, max: 0.00004, unidad: s, rotulo: "t" }
        y: { min: 0, max: 2, unidad: V, rotulo: "v_{C}" }
        curvas:
          - { expr: "V_e*(1 - exp(-a_r*t)*(cos(wd_r*t) + a_r/wd_r*sin(wd_r*t)))", color: verde, rotulo: "v_{C} tras un escalón de 1 V", mide: vc }
      ocultar: true
    opciones:
      - texto: "Un 78 %"
        bien: true
        porque: "ζ = 1/(2Q) = 0,079: muy poco amortiguado. El que más resuena es el que más se pasa."
      - texto: "Nada: Q alto es un circuito estable"
        porque: "Q alto es ζ bajo: el circuito oscila mucho antes de asentarse."
      - texto: "Un 6,32 %"
        porque: "Q no es el sobreimpulso. Con ζ = 0,079, e^{−πζ/√(1−ζ²)} da un 78 %."
    escalera:
      - "Pase de Q a ζ con ζ = 1/(2Q)."
    solucion: "ζ = 0,079: un 78 % de sobreimpulso."
    comprobar:
      - { Q_r: 6.32, z_r: 0.079, OS: 78 }

  - id: formula-eficaz
    tipo: formula
    titulo: "El eficaz de una senoide"
    texto: "Pico entre √2. Solo para senoides: con otra forma cambia el factor de cresta."
    libro: [322, "cap24#22"]
    ec: "cap24#22"
    sustitucion: "{{V_pk}} / √2 = {{V_ef}}"
    comprobar:
      - { V_ef: 230 }

  - id: estime-5tau
    tipo: pregunta
    fase: "Estime"
    titulo: "Lo que falta a 5τ"
    texto: "Un transitorio de primer orden, a cinco constantes de tiempo. Estime qué fracción del recorrido falta todavía."
    libro: [319]
    estimar:
      objetivo: "f5"
      unidad: "%"
      min: 0
      max: 5
      paso: 0.01
      inicio: 2
      tol: 0.05
      rotulo: "Lo que falta"
    exito: "e⁻⁵ = 0,674 %. Para 12 bits hacen falta unas 8,3τ."
    pistas:
      - { cuando: { valor: estimacion, mayor: 0.71 }, texto: "Demasiado: a 5τ casi ha terminado." }
      - { texto: "Poco: no es cero; la exponencial no llega nunca." }
    escalera:
      - "Falta e^{−t/τ} del recorrido."
    solucion: "e⁻⁵ = 0,674 %."
    comprobar:
      - { f5: 0.674 }

  - id: catetos
    tipo: sorpresa
    titulo: "Lo que no suma"
    texto: "La suma de las dos amplitudes pasa de la fuente de 1 V; como catetos, en cambio, cuadra. Cambie la frecuencia."
    libro: [321, 327]
    inicio: { f_f: 1000 }
    widget:
      tipo: circuito
      esquema: filtro-rc
      piezas: { fuente: V_p, f: f_f, r: R_f, c: C_f }
      lectura: { valor: S_ab, rotulo: "V_{R} + V_{C}" }
      datos:
        - { valor: S_q, rotulo: "Como catetos: {{S_q}}" }
      mide: { vr_amp: A_r, vc_amp: A_c }
      mandos:
        - { valor: f_f, lista: [500, 1000, 2000] }

  - id: por-que-geometrica
    tipo: porque
    titulo: "¿Por qué la media geométrica?"
    texto: "Los cortes del RLC de 50 Ω caen en 4650,74 y 5446,51 Hz, y f₀ = 5032,92 Hz es su media geométrica. ¿Por qué no la aritmética?"
    libro: [324]
    widget:
      tipo: circuito
      esquema: rlc-serie
      piezas: { fuente: V_p, f: f_r, r: R_r, l: L_r, c: C_r }
      lectura: { valor: f_0, rotulo: "Resonancia" }
      mide: { i_amp: I_r }
      grafica:
        x: { id: nu, min: 1000, max: 25000, unidad: Hz, rotulo: "f", escala: log }
        y: { min: 0, max: 0.022, unidad: A, rotulo: "|i|" }
        curvas:
          - { expr: "V_p/sqrt(R_r^2 + (2*pi*nu*L_r - 1/(2*pi*nu*C_r))^2)", color: naranja, rotulo: "|i|", mide: i_amp }
        marcas:
          - { x: "f_1", y: "V_p/R_r*0.7071", rotulo: "f₁" }
          - { x: "f_2", y: "V_p/R_r*0.7071", rotulo: "f₂" }
    opciones:
      - texto: "Porque la curva es simétrica en escala logarítmica, no en lineal"
        bien: true
        porque: "Las reactancias van con f y con 1/f: a f₀·k y a f₀/k se compensan igual. Por eso los Bode se dibujan en log."
      - texto: "Por redondeo del cálculo"
        porque: "No es redondeo: la geométrica da f₀ exactamente; la aritmética, 5048,62 Hz."
      - texto: "Porque R desplaza el máximo"
        porque: "R no mueve f₀: ensancha la curva, simétrica en logaritmos."
    escalera:
      - "X_{L} va con f; X_{C}, con 1/f."
    solucion: "Simetría logarítmica: f₀ = √(f₁·f₂)."
    comprobar:
      - { f_1: 4650.74, f_2: 5446.51, f_0: 5032.92 }

  - id: errores
    tipo: pregunta
    fase: "Empareje"
    titulo: "Los errores característicos"
    texto: "Una cada error del capítulo con lo que hay que hacer en su lugar."
    libro: [327]
    emparejar:
      - ["Sumar como números tensiones en cuadratura", "Sumarlas como catetos"]
      - ["Suponer G = 1/R con reactancia en serie", "Invertir Z completa: G = R/(R² + X²)"]
      - ["Medir corriente no senoidal con valor medio", "Usar verdadero valor eficaz"]
      - ["Corregir con condensadores una carga electrónica", "Corrección activa (PFC)"]
      - ["Aplicar fasores a un transitorio", "Dominio del tiempo o Laplace"]
    exito: "Los cinco errores del libro, cada uno con su remedio."
    pistas:
      - { texto: "Un condensador corrige desfase, no armónicos." }
    escalera:
      - "Cada error viola una condición: cuadratura, inversión, forma de onda, armónicos o régimen permanente."
    solucion: "Catetos; invertir Z; verdadero eficaz; PFC; dominio del tiempo."

  - id: dimensionar
    tipo: pregunta
    titulo: "Cables y factura"
    texto: "Una carga toma 2300 VA y 1840 W. ¿Por qué potencia se dimensiona el cableado y por cuál se paga?"
    libro: [323, "cap24#133"]
    widget:
      tipo: circuito
      esquema: filtro-rc
      dibujo: false
      piezas: { fuente: V_p, f: f_f, r: R_f, c: C_f }
      mide: { vr_amp: A_r }
      grafica:
        x: { id: t, min: 0, max: 0.002, unidad: s, rotulo: "t" }
        y: { min: -1.2, max: 1.2, unidad: V, rotulo: "v" }
        curvas:
          - { expr: "V_p*sin(w_f*t)", color: tinta, rotulo: "tensión", mide: entrada, discontinua: true }
          - { expr: "A_r*sin(w_f*t + atan(X_c/R_f))", color: azul, rotulo: "corriente (en v_{R})", mide: vr }
    opciones:
      - texto: "El cableado por S, 2300 VA; la factura por P, 1840 W"
        bien: true
        porque: "Por los cables pasa toda la corriente; la energía consumida es solo la activa."
      - texto: "Las dos por P"
        porque: "El cable no sabe qué parte de la corriente hace trabajo: lleva toda, y se dimensiona por S."
      - texto: "Las dos por S"
        porque: "Al usuario doméstico se le factura la activa, P."
    escalera:
      - "¿Qué ve el cable: la corriente total o solo la parte en fase?"
    solucion: "Cable por S; factura por P."

  - id: banda-trafo
    tipo: pregunta
    titulo: "La banda del transformador"
    texto: "El transformador del altavoz de 8 Ω, 10:1. ¿Qué limita su banda pasante por abajo?"
    libro: [325, "cap24#221"]
    widget:
      tipo: circuito
      esquema: transformador
      piezas: { fuente: V_1, n1: N_1, n2: N_2, carga: R_2l }
      lectura: { valor: Z_r, rotulo: "Impedancia vista desde el primario" }
      corriente: I_2
      mide: { secundario: V_2, i1: I_1, i2: I_2 }
    opciones:
      - texto: "La inductancia magnetizante, que a baja frecuencia cortocircuita la fuente"
        bien: true
        porque: "Su reactancia ωL baja con la frecuencia. Por arriba limitan la dispersión y la capacidad."
      - texto: "La inductancia de dispersión"
        porque: "La dispersión, en serie, limita por arriba."
      - texto: "La relación de espiras"
        porque: "La relación fija tensión, corriente e impedancia (800 Ω aquí), no la banda."
    escalera:
      - "¿Qué reactancia se hace pequeña al bajar la frecuencia?"
    solucion: "La magnetizante, por abajo; dispersión y capacidad, por arriba."
    comprobar:
      - { Z_r: 800 }

  - id: resumen
    tipo: resumen
    titulo: "Capítulo repasado"
    libro: [319, 320, 321, 323, 325]
    ideas:
      - { titulo: "Transitorio.", texto: "Natural + forzada; a 5τ falta un 0,674 %. ζ y Q = 1/(2ζ) son lo mismo." }
      - { titulo: "Fasores.", texto: "R, jωL y 1/(jωC) como resistencias; en cuadratura, catetos." }
      - { titulo: "Potencia.", texto: "P, Q y S; cables por S, factura por P; el condensador no corrige armónicos." }
      - { titulo: "Resonancia y transformador.", texto: "f₀ en la media geométrica; el transformador escala con n, 1/n y n²." }
