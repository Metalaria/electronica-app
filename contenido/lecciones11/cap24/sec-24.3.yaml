# Lección 1.2 de la sección 23.3 «Respuesta de Segundo Orden (RLC)» (cap24). Formato: contenido/lecciones11/GUIA.md.
# El RLC es el del ejercicio 23.2 (cap24#329: R = 220 Ω, L = 10 mH, C = 1 µF, ζ = 1,1). La respuesta al escalón es
# la normalizada v_C/V de un RLC serie (no hay esquema de transitorio RLC: petición al motor), con una sola expresión
# para los tres casos (cos·cosh y sen/ω + senh/ω, y el término t del caso crítico).
leccion: cap24/sec-24.3

libro:
  48: "el transitorio es lo que rompe cosas"
  55: "La tensión de un condensador no puede cambiar instantáneamente, porque exigiría corriente infinita."
  56: "La corriente de una bobina no puede cambiar instantáneamente, porque exigiría tensión infinita."
  57: "se sabe el valor en t = 0⁺ porque es el de t = 0⁻"
  58: "valor inicial, valor final y constante de tiempo"
  60: "ζ = (R/2)·√(C/L)"
  61: "Sobreamortiguado (ζ > 1): dos exponenciales, sin oscilación, lento."
  62: "Críticamente amortiguado (ζ = 1): el más rápido sin sobreoscilación."
  63: "un 53 % con ζ = 0,2"
  64: "ζ y Q son la misma cosa vista de dos formas, con Q = 1/(2ζ)"
  67: "la corriente de irrupción de los condensadores de entrada"
  68: "Al desconectar una carga inductiva: el pico de tensión"
  69: "la respuesta del lazo de regulación, que es donde se ve su margen de fase"
  70: "lo que decide si algo se rompe es el transitorio, no el régimen permanente"
  73: "De ella salen la constante de tiempo, el amortiguamiento y el sobreimpulso"
  "cap24#156": 'Q = (ω_("0") dot.op L)/(R) = ("1")/(R) dot.op sqrt((L)/(C))'
  "cap24#159": "El circuito que más oscila en el transitorio (sección 23.3) es el mismo que más selectivamente resuena en frecuencia."
  "cap24#329": "Un RLC serie tiene R = 220 Ω, L = 10 mH y C = 1 µF"
  "cap24#7": "un condensador de 100 nF a través de 10 kΩ conectado de golpe a 5 V"

modelo:
  valores:
    V_s: { sim: "V_{p}", nombre: "amplitud de la fuente", unidad: V, valor: 1 }
    f_s: { sim: "f", nombre: "frecuencia de la fuente", unidad: Hz, valor: 1591.55 }
    R_s: { sim: "R", nombre: "resistencia", unidad: Ω, valor: 220 }
    L_s: { sim: "L", nombre: "inductancia", unidad: H, valor: 0.01 }
    C_s: { sim: "C", nombre: "capacidad", unidad: F, valor: 1e-6 }
    V_c: { sim: "V", nombre: "tensión de la fuente del RC", unidad: V, valor: 5 }
    R_c: { sim: "R", nombre: "resistencia del RC", unidad: Ω, valor: 10000 }
    C_c: { sim: "C", nombre: "capacidad del RC", unidad: F, valor: 100e-9 }
  calculos:
    z: { expr: "(R_s/2)*sqrt(C_s/L_s)", sim: "ζ", nombre: "factor de amortiguamiento", unidad: "", cifras: 3 }
    w0: { expr: "1/sqrt(L_s*C_s)", sim: "ω₀", nombre: "frecuencia natural", unidad: "rad/s" }
    Q_s: { expr: "1/(2*z)", sim: "Q", nombre: "factor de calidad", unidad: "", cifras: 3 }
    wa: { expr: "w0*sqrt(max(1 - z^2, 0))", sim: "ω_{d}", nombre: "frecuencia de la oscilación amortiguada", unidad: "rad/s" }
    wb: { expr: "w0*sqrt(max(z^2 - 1, 0))", sim: "ω_{b}", nombre: "separación de las dos exponenciales", unidad: "rad/s" }
    OS: { expr: "100*exp(-pi*z/sqrt(max(1 - z^2, 1e-12)))", sim: "SO", nombre: "sobreimpulso", unidad: "%", cifras: 3 }
    I_s: { expr: "V_s/sqrt(R_s^2 + (2*pi*f_s*L_s - 1/(2*pi*f_s*C_s))^2)", sim: "I", nombre: "amplitud de la corriente", unidad: A }
    OSu: { expr: "OS/100", sim: "SO", nombre: "sobreimpulso en tanto por uno", unidad: "" }
    ex_o: { expr: "pi*z/sqrt(max(1 - z^2, 1e-12))", sim: "πζ/√(1−ζ²)", nombre: "exponente del sobreimpulso", unidad: "" }
    tau_c: { expr: "R_c*C_c", sim: "τ", nombre: "constante de tiempo del RC", unidad: s }

tarjetas:
  - id: explore-tres
    tipo: explorar
    titulo: "Tres maneras de llegar"
    texto: "La tensión del condensador de un RLC serie tras un escalón, en tanto por uno del valor final. Cambie R: se pasa y oscila, o llega despacio."
    libro: [61, 62, 63]
    fijar: { L_s: 0.01, C_s: 1e-6 }
    widget:
      tipo: grafica
      x: { id: t, min: 0, max: 0.003, unidad: s, rotulo: "t" }
      y: { min: 0, max: 2, unidad: "", rotulo: "v_{C}/V" }
      curvas:
        - { expr: "1 - exp(-z*w0*t)*(cos(wa*t)*(exp(wb*t) + exp(-wb*t))/2 + z*w0*(sin(wa*t)/max(wa, 1e-9) + (exp(wb*t) - exp(-wb*t))/(2*max(wb, 1e-9)) + t*max(0, 1 - (wa + wb)*1e9)))", color: naranja, rotulo: "v_{C}/V" }
        - { expr: "1", color: tinta, rotulo: "valor final", discontinua: true }
      lectura: { valor: z, rotulo: "Amortiguamiento ζ" }
      datos:
        - { valor: OS, rotulo: "Sobreimpulso: {{OS}}" }
      mandos:
        - { valor: R_s, lista: [10, 40, 100, 200, 220, 400], rotulo: "R" }

  - id: prediga-regimen
    tipo: predecir
    titulo: "El RLC del ejercicio"
    texto: "Un RLC serie con R = 220 Ω, L = 10 mH y C = 1 µF recibe un escalón. ¿Cómo responde?"
    libro: [60, 61, "cap24#329"]
    fijar: { R_s: 220, L_s: 0.01, C_s: 1e-6 }
    widget:
      tipo: circuito
      esquema: rlc-serie
      piezas: { fuente: V_s, f: f_s, r: R_s, l: L_s, c: C_s }
      lectura: { valor: z, rotulo: "Amortiguamiento ζ" }
      mide: { i_amp: I_s }
      ocultar: true
    opciones:
      - texto: "Sobreamortiguado: dos exponenciales, sin oscilar"
        bien: true
        porque: "ζ = 110 · √(10⁻⁶/10⁻²) = 1,1. Como ζ > 1, llega despacio y no oscila."
      - texto: "Subamortiguado: oscila y se pasa"
        porque: "Oscilaría con ζ < 1. Aquí ζ = 1,1: la resistencia gasta la energía antes de que pueda ir y venir."
      - texto: "Críticamente amortiguado"
        porque: "Ese es el límite exacto, ζ = 1, con R = 200 Ω. Con 220 Ω se pasa al lado sobreamortiguado."
    escalera:
      - "Calcule ζ = (R/2)·√(C/L)."
      - "√(C/L) = √(10⁻⁶/10⁻²) = 0,01."
    solucion: "ζ = 110 × 0,01 = 1,1: sobreamortiguado."
    comprobar:
      - { z: 1.1, w0: 10000 }
      - { con: { R_s: 200 }, z: 1.0 }

  - id: formula-q
    tipo: formula
    titulo: "ζ y Q, lo mismo"
    texto: "El factor de calidad de la resonancia es el amortiguamiento visto desde la frecuencia: Q = 1/(2ζ). Mueva R y compare."
    libro: ["cap24#156", 64]
    ec: "cap24#156"
    sustitucion: "Q = (1/{{R_s}}) · √({{L_s}} / {{C_s}}) = {{Q_s}}; ζ = {{z}}"
    fijar: { L_s: 0.01, C_s: 1e-6 }
    widget:
      tipo: grafica
      x: { id: t, min: 0, max: 0.003, unidad: s, rotulo: "t" }
      y: { min: 0, max: 2, unidad: "", rotulo: "v_{C}/V" }
      curvas:
        - { expr: "1 - exp(-z*w0*t)*(cos(wa*t)*(exp(wb*t) + exp(-wb*t))/2 + z*w0*(sin(wa*t)/max(wa, 1e-9) + (exp(wb*t) - exp(-wb*t))/(2*max(wb, 1e-9)) + t*max(0, 1 - (wa + wb)*1e9)))", color: naranja, rotulo: "v_{C}/V" }
      lectura: { valor: Q_s, rotulo: "Factor de calidad Q" }
      mandos:
        - { valor: R_s, lista: [10, 40, 100, 200, 220, 400], rotulo: "R" }

  - id: ajuste-critico
    tipo: ajuste
    titulo: "Lo más rápido sin pasarse"
    texto: "Con L = 10 mH y C = 1 µF, mueva R hasta el amortiguamiento crítico: llega antes que ninguno sin sobreoscilar."
    libro: [62, "cap24#329"]
    fijar: { L_s: 0.01, C_s: 1e-6 }
    inicio: { R_s: 40 }
    widget:
      tipo: grafica
      x: { id: t, min: 0, max: 0.003, unidad: s, rotulo: "t" }
      y: { min: 0, max: 2, unidad: "", rotulo: "v_{C}/V" }
      curvas:
        - { expr: "1 - exp(-z*w0*t)*(cos(wa*t)*(exp(wb*t) + exp(-wb*t))/2 + z*w0*(sin(wa*t)/max(wa, 1e-9) + (exp(wb*t) - exp(-wb*t))/(2*max(wb, 1e-9)) + t*max(0, 1 - (wa + wb)*1e9)))", color: naranja, rotulo: "v_{C}/V" }
        - { expr: "1", color: tinta, rotulo: "valor final", discontinua: true }
      lectura: { valor: z, rotulo: "Amortiguamiento ζ" }
      mandos:
        - { valor: R_s, min: 10, max: 400, paso: 2, rotulo: "R" }
    ajuste:
      valor: z
      objetivo: 1
      tol: 0.02
      rotulo: "Amortiguamiento ζ"
      escala: { min: 0, max: 2 }
      bajo: "Todavía oscila y se pasa: suba R."
      alto: "Ya no oscila, pero llega despacio: baje R."
      dentro: "Crítico: ζ = 1, con unos 200 Ω."
    comprobar:
      - { con: { R_s: 200 }, z: 1.0 }

  - id: estime-sobreimpulso
    tipo: pregunta
    fase: "Estime"
    titulo: "El sobreimpulso con ζ = 0,2"
    texto: "Ante un escalón, un RLC con ζ = 0,2 se pasa del valor final. Estime cuánto, en tanto por ciento del salto."
    libro: [63]
    fijar: { R_s: 40, L_s: 0.01, C_s: 1e-6 }
    estimar:
      objetivo: "OS"
      unidad: "%"
      min: 0
      max: 100
      paso: 1
      inicio: 10
      tol: 0.08
      rotulo: "Sobreimpulso"
    exito: "Un 53 %: con ζ = 0,2 casi se pasa la mitad del salto. Por encima de ζ = 0,8, casi nada."
    pistas:
      - { cuando: { valor: estimacion, mayor: 57 }, texto: "Demasiado: incluso con ζ = 0,2 queda por debajo del doble del valor final." }
      - { texto: "Se queda corto: con tan poco amortiguamiento se pasa mucho." }
    escalera:
      - "El sobreimpulso vale e^{−πζ/√(1−ζ²)}."
      - "Con ζ = 0,2: e^{−0,641}."
    solucion: "e^{−0,641} ≈ 0,53: un 53 %."
    comprobar:
      - { z: 0.2, OS: 52.7, OSu: 0.527, ex_o: 0.641 }

  - id: continuidad
    tipo: pregunta
    titulo: "El valor en t = 0⁺"
    texto: "Un condensador descargado se conecta de golpe a 5 V a través de 10 kΩ. ¿Por qué su tensión sigue valiendo 0 V justo después?"
    libro: [55, 57, "cap24#7"]
    widget:
      tipo: circuito
      esquema: carga-rc
      piezas: { fuente: V_c, r: R_c, c: C_c }
      lectura: { valor: tau_c, rotulo: "Constante de tiempo" }
      grafica:
        x: { id: t, min: 0, max: 0.005, unidad: s, rotulo: "t" }
        y: { min: 0, max: 5.5, unidad: V, rotulo: "v_{C}" }
        curvas:
          - { expr: "V_c*(1 - exp(-t/tau_c))", color: naranja, rotulo: "v_{C}", mide: vc }
    opciones:
      - texto: "Porque cambiarla de golpe exigiría una corriente infinita"
        bien: true
        porque: "i = C·dv/dt: un salto de tensión necesita dv/dt infinito. Por eso el valor en 0⁺ es el de 0⁻."
      - texto: "Porque la resistencia todavía no deja pasar corriente"
        porque: "Sí la deja: en t = 0⁺ la corriente es máxima, 5 V/10 kΩ. Lo que no salta es la tensión del condensador."
      - texto: "Porque la fuente tarda en subir"
        porque: "La fuente sube de golpe. Es el condensador el que no puede cambiar su tensión instantáneamente."
    escalera:
      - "Recuerde i = C·dv/dt."
    solucion: "Un salto de tensión exigiría corriente infinita: v_{C}(0⁺) = v_{C}(0⁻) = 0 V."

  - id: tres-lineas
    tipo: pregunta
    fase: "Ordene"
    titulo: "El método de tres líneas"
    texto: "Ordene los pasos que resuelven cualquier circuito de primer orden sin escribir la ecuación diferencial."
    libro: [57, 58]
    ordenar:
      - "Valor inicial: el de t = 0⁻, por continuidad"
      - "Valor final: el del régimen permanente"
      - "Constante de tiempo τ del circuito"
      - "Entre ambos valores, una exponencial con esa τ"
    exito: "Valor inicial, valor final y τ: tres líneas."
    pistas:
      - { texto: "Primero los dos extremos de la curva; luego, lo deprisa que va de uno a otro." }
    escalera:
      - "La continuidad da el principio; el régimen permanente, el final."
    solucion: "Inicial, final, τ y la exponencial que los une."

  - id: oscila-resuena
    tipo: sorpresa
    titulo: "El que más oscila, más resuena"
    texto: "Baje R a 10 Ω: ζ = 0,05 y Q = 10. El circuito que más timbra tras el escalón es el que más selectivamente resuena en frecuencia."
    libro: [64, "cap24#159"]
    fijar: { L_s: 0.01, C_s: 1e-6 }
    inicio: { R_s: 220 }
    widget:
      tipo: grafica
      x: { id: t, min: 0, max: 0.003, unidad: s, rotulo: "t" }
      y: { min: 0, max: 2, unidad: "", rotulo: "v_{C}/V" }
      curvas:
        - { expr: "1 - exp(-z*w0*t)*(cos(wa*t)*(exp(wb*t) + exp(-wb*t))/2 + z*w0*(sin(wa*t)/max(wa, 1e-9) + (exp(wb*t) - exp(-wb*t))/(2*max(wb, 1e-9)) + t*max(0, 1 - (wa + wb)*1e9)))", color: naranja, rotulo: "v_{C}/V" }
      lectura: { valor: Q_s, rotulo: "Factor de calidad Q" }
      datos:
        - { valor: z, rotulo: "ζ = {{z}}" }
      mandos:
        - { valor: R_s, lista: [10, 40, 100, 200, 220, 400], rotulo: "R" }
    comprobar:
      - { con: { R_s: 10 }, z: 0.05, Q_s: 10 }

  - id: por-que-rompe
    tipo: porque
    titulo: "¿Por qué rompe el transitorio?"
    texto: "Con ζ = 0,2 la tensión llega a superar en un 53 % su valor final. ¿Por qué se dice que el transitorio es lo que rompe cosas?"
    libro: [48, 70]
    fijar: { R_s: 40, L_s: 0.01, C_s: 1e-6 }
    widget:
      tipo: grafica
      x: { id: t, min: 0, max: 0.003, unidad: s, rotulo: "t" }
      y: { min: 0, max: 2, unidad: "", rotulo: "v_{C}/V" }
      curvas:
        - { expr: "1 - exp(-z*w0*t)*(cos(wa*t)*(exp(wb*t) + exp(-wb*t))/2 + z*w0*(sin(wa*t)/max(wa, 1e-9) + (exp(wb*t) - exp(-wb*t))/(2*max(wb, 1e-9)) + t*max(0, 1 - (wa + wb)*1e9)))", color: naranja, rotulo: "v_{C}/V" }
        - { expr: "1", color: tinta, rotulo: "permanente", discontinua: true }
      lectura: { valor: OS, rotulo: "Sobreimpulso" }
    opciones:
      - texto: "Porque los picos de tensión y de corriente solo aparecen durante el cambio"
        bien: true
        porque: "El pico de una bobina, la irrupción de un condensador, el sobreimpulso de un lazo: ninguno se ve en el régimen permanente."
      - texto: "Porque en el transitorio los componentes están fríos"
        porque: "No es cuestión de temperatura: es el valor de pico que se alcanza mientras el circuito se asienta."
      - texto: "Porque el régimen permanente no disipa"
        porque: "Sí disipa, pero sus valores son los de diseño. Lo inesperado son los picos del transitorio."
    escalera:
      - "Compare el máximo de la curva con el valor final."
    solucion: "Los picos que superan los valores de diseño solo existen durante el transitorio."
    comprobar:
      - { OS: 52.7 }

  - id: prever
    tipo: pregunta
    fase: "Empareje"
    titulo: "Los transitorios que hay que prever"
    texto: "Una cada maniobra con el transitorio que produce."
    libro: [67, 68, 69]
    emparejar:
      - ["Al conectar", "La corriente de irrupción de los condensadores de entrada"]
      - ["Al desconectar una carga inductiva", "El pico de tensión"]
      - ["Ante un escalón de carga", "La respuesta del lazo de regulación"]
    exito: "En los tres, lo que decide si algo se rompe es el transitorio."
    pistas:
      - { texto: "Un condensador descargado se comporta al principio como un corto; una bobina se opone a que su corriente cambie." }
    escalera:
      - "¿Qué componente pide corriente al conectar y cuál protesta al cortar?"
    solucion: "Conectar: irrupción; desconectar la bobina: pico; escalón de carga: el lazo."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [56, 57, 60, 64, 73]
    ideas:
      - { titulo: "Primer orden.", texto: "Valor inicial, valor final y τ: la continuidad de v_{C} e i_{L} da el principio." }
      - { titulo: "Segundo orden.", texto: "ζ = (R/2)·√(C/L): sobreamortiguado, crítico o subamortiguado." }
      - { titulo: "ζ y Q.", texto: "Q = 1/(2ζ): el que más oscila es el que más resuena." }
      - { titulo: "En el banco.", texto: "Un escalón en disparo único da τ, el amortiguamiento y el sobreimpulso." }
