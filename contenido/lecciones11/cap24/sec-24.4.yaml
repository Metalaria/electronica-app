# Lección 1.2 de la sección 23.4 «Régimen Senoidal Permanente: Fasores Aplicados» (cap24). Formato: GUIA.md.
# El RC es el del libro (bloque 87: 1 kΩ y 100 nF a 1 kHz). El libro aplica 1 V eficaz; la fuente del esquema se
# da en amplitud (1 V de pico): las cifras (0,532 y 0,847) son las mismas en proporción, porque el circuito es lineal.
# El RLC de la sobretensión es el de la práctica 9 (cap22#235: 100 Ω, 10 mH, 100 nF; Q = 3,16).
leccion: cap24/sec-24.4

libro:
  80: "La derivada, en particular, se convierte en multiplicar por jω"
  84: "la ley de Ohm vale igual que en continua: V = I·Z"
  87: "Un RC serie de 1 kΩ y 100 nF a 1 kHz"
  88: 'X_("C") = ("1")/("2" π dot.op "1000" dot.op "100" n) = "1 592 Ω"'
  90: "1 880 Ω"
  91: "fase = −57,9°"
  92: "La tensión sobre la resistencia es 0,532 V en fase con la corriente, y sobre el condensador 0,532 mA × 1592 Ω = 0,847 V"
  93: "las magnitudes en cuadratura se suman como vectores, no como números"
  98: "Reactancia (X): la parte imaginaria. No disipa: almacena y devuelve"
  99: "la admitancia Y = 1/Z = G + jB"
  102: "Solo régimen permanente."
  103: "Solo una frecuencia a la vez."
  104: "Solo circuitos lineales."
  105: "Solo senoides."
  110: "los vectores de VL y VC pueden ser mucho mayores que el total"
  112: "la relación de amplitudes da el módulo de la impedancia y el desfase entre trazas da su argumento"
  "cap22#235": "L = 10 mH, C = 100 nF, R = 100 Ω"
  "cap22#256": "Con Q = 3 y 1 V de entrada, 3 V sobre cada uno, en oposición de fase"

modelo:
  valores:
    V_p: { sim: "V_{p}", nombre: "amplitud de la fuente", unidad: V, valor: 1 }
    f_f: { sim: "f", nombre: "frecuencia de la fuente", unidad: Hz, valor: 1000 }
    R_f: { sim: "R", nombre: "resistencia", unidad: Ω, valor: 1000 }
    C_f: { sim: "C", nombre: "capacidad", unidad: F, valor: 100e-9 }
    f_r: { sim: "f", nombre: "frecuencia del RLC", unidad: Hz, valor: 5032.92 }
    R_r: { sim: "R", nombre: "resistencia del RLC", unidad: Ω, valor: 100 }
    L_r: { sim: "L", nombre: "inductancia del RLC", unidad: H, valor: 0.01 }
    C_r: { sim: "C", nombre: "capacidad del RLC", unidad: F, valor: 100e-9 }
  calculos:
    w_f: { expr: "2*pi*f_f", sim: "ω", nombre: "frecuencia angular", unidad: "rad/s" }
    X_c: { expr: "1/(w_f*C_f)", sim: "X_{C}", nombre: "reactancia del condensador", unidad: Ω }
    Z_m: { expr: "sqrt(R_f^2 + X_c^2)", sim: "|Z|", nombre: "módulo de la impedancia", unidad: Ω }
    Z_s: { expr: "R_f + X_c", sim: "R + X_{C}", nombre: "suma como números", unidad: Ω }
    ph_z: { expr: "-atan(X_c/R_f)*180/pi", sim: "φ_{Z}", nombre: "fase de la impedancia", unidad: "°" }
    I_a: { expr: "V_p/Z_m", sim: "I", nombre: "amplitud de la corriente", unidad: A }
    ph_i: { expr: "atan(X_c/R_f)*180/pi", sim: "φ_{I}", nombre: "fase de la corriente", unidad: "°" }
    A_r: { expr: "I_a*R_f", sim: "V_{R}", nombre: "amplitud en R", unidad: V }
    A_c: { expr: "I_a*X_c", sim: "V_{C}", nombre: "amplitud en C", unidad: V }
    ph_c: { expr: "ph_i - 90", sim: "φ_{C}", nombre: "fase en C", unidad: "°" }
    S_ab: { expr: "A_r + A_c", sim: "V_{R} + V_{C}", nombre: "suma de las dos amplitudes", unidad: V }
    S_q: { expr: "sqrt(A_r^2 + A_c^2)", sim: "√(V_{R}² + V_{C}²)", nombre: "suma como catetos", unidad: V }
    A_resta: { expr: "V_p - A_r", sim: "V − V_{R}", nombre: "resta como números", unidad: V }
    A_suma: { expr: "V_p*X_c/(R_f + X_c)", sim: "V_{C}", nombre: "divisor con R y X_C sumadas como números", unidad: V }
    I_r: { expr: "V_p/R_r", sim: "I_{0}", nombre: "corriente en resonancia", unidad: A }
    A_lr: { expr: "I_r*2*pi*f_r*L_r", sim: "V_{L}", nombre: "amplitud en L en resonancia", unidad: V }
    Z_0: { expr: "sqrt(L_r/C_r)", sim: "Z_{0}", nombre: "reactancia de L o de C en resonancia", unidad: Ω }
    Z_d: { expr: "X_c - R_f", sim: "X_{C} − R", nombre: "resta como números", unidad: Ω }
    A_cr: { expr: "I_r/(2*pi*f_r*C_r)", sim: "V_{C}", nombre: "amplitud en C en resonancia", unidad: V }

tarjetas:
  - id: explore-rc
    tipo: explorar
    titulo: "Tres senoides de la misma frecuencia"
    texto: "El RC de 1 kΩ y 100 nF, con 1 V de amplitud. Cambie la frecuencia: cambian las amplitudes y los desfases, nunca la forma."
    libro: [87]
    widget:
      tipo: circuito
      esquema: filtro-rc
      piezas: { fuente: V_p, f: f_f, r: R_f, c: C_f }
      lectura: { valor: Z_m, rotulo: "Módulo de la impedancia" }
      datos:
        - { valor: ph_z, rotulo: "Fase de Z: {{ph_z}}" }
      mide: { vc_amp: A_c, vr_amp: A_r, i_amp: I_a, i_fase: ph_i }
      grafica:
        x: { id: t, min: 0, max: 0.002, unidad: s, rotulo: "t" }
        y: { min: -1.2, max: 1.2, unidad: V, rotulo: "v" }
        curvas:
          - { expr: "V_p*sin(w_f*t)", color: tinta, rotulo: "fuente", mide: entrada, discontinua: true }
          - { expr: "A_r*sin(w_f*t + ph_i*pi/180)", color: azul, rotulo: "v_{R}", mide: vr }
          - { expr: "A_c*sin(w_f*t + ph_c*pi/180)", color: naranja, rotulo: "v_{C}", mide: vc }
      mandos:
        - { valor: f_f, lista: [500, 1000, 2000] }

  - id: prediga-z
    tipo: predecir
    titulo: "La impedancia a 1 kHz"
    texto: "A 1 kHz, R = 1000 Ω y X_{C} = 1592 Ω. ¿Cuánto vale el módulo de la impedancia del RC serie?"
    libro: [88, 90, 91]
    fijar: { V_p: 1, f_f: 1000, R_f: 1000, C_f: 100e-9 }
    widget:
      tipo: circuito
      esquema: filtro-rc
      piezas: { fuente: V_p, f: f_f, r: R_f, c: C_f }
      lectura: { valor: Z_m, rotulo: "Módulo de la impedancia" }
      datos:
        - { valor: ph_z, rotulo: "Fase: {{ph_z}}" }
      mide: { i_amp: I_a, i_fase: ph_i }
      ocultar: true
    opciones:
      - texto: "Unos 1880 Ω"
        bien: true
        porque: "Z = 1000 − j1592: R y X_{C} están en cuadratura y se suman como catetos, con fase −57,9°."
      - texto: "2592 Ω"
        porque: "Es la suma como números. La reactancia está girada 90° respecto a la resistencia: se suman como vectores."
      - texto: "592 Ω"
        porque: "Restarlas tampoco: el −j no es un signo menos sobre el módulo, es un giro de −90°."
    escalera:
      - "Z = R − jX_{C}: parte real y parte imaginaria."
      - "|Z| = √(R² + X_{C}²)."
    solucion: "√(1000² + 1592²) ≈ 1880 Ω."
    comprobar:
      - { X_c: 1592, Z_m: 1880, ph_z: -57.9, Z_s: 2592, Z_d: 592 }

  - id: formula-xc
    tipo: formula
    titulo: "La reactancia del condensador"
    texto: "La derivada se convierte en multiplicar por jω; por eso X_{C} = 1/(ωC) baja al subir la frecuencia."
    libro: [80, 88]
    ec: 88
    sustitucion: "1 / (2π · {{f_f}} · {{C_f}}) = {{X_c}}"
    widget:
      tipo: circuito
      esquema: filtro-rc
      piezas: { fuente: V_p, f: f_f, r: R_f, c: C_f }
      lectura: { valor: X_c, rotulo: "Reactancia X_{C}" }
      datos:
        - { valor: Z_m, rotulo: "|Z| = {{Z_m}}" }
      mide: { i_amp: I_a }
      mandos:
        - { valor: f_f, lista: [500, 1000, 2000] }

  - id: simule-vc
    tipo: simular
    titulo: "Prediga la tensión del condensador"
    texto: "Con 1 V de amplitud a 1 kHz, la corriente es de 0,532 mA y la resistencia se queda 0,532 V. ¿Qué amplitud tiene v_{C}?"
    libro: [92]
    fijar: { V_p: 1, f_f: 1000, R_f: 1000, C_f: 100e-9 }
    widget:
      tipo: circuito
      esquema: filtro-rc
      piezas: { fuente: V_p, f: f_f, r: R_f, c: C_f }
      lectura: { valor: A_c, rotulo: "Amplitud en C" }
      mide: { vc_amp: A_c }
      ocultar: true
      mandos: []
    simular:
      objetivo: A_c
      unidad: V
      tol: 0.03
      rotulo: "Amplitud en C, V_{C}"
      medida: vc_amp
      errores:
        - { expr: "A_resta", texto: "Ha restado como números (1 − 0,532). V_{R} y V_{C} están en cuadratura: no suman la tensión de la fuente." }
        - { expr: "A_suma", texto: "Ha sumado R y X_{C} como números (2592 Ω). El divisor en alterna usa |Z| = 1880 Ω." }
    exito: "0,532 mA × 1592 Ω = 0,847 V, atrasada 90° respecto a la corriente."
    escalera:
      - "V_{C} = I · X_{C}."
      - "0,532 mA × 1592 Ω."
    solucion: "0,847 V."
    comprobar:
      - { I_a: 0.000532, A_r: 0.532, A_c: 0.847, A_resta: 0.468, A_suma: 0.614, Z_s: 2592, Z_m: 1880 }

  - id: tres-terminos
    tipo: pregunta
    fase: "Empareje"
    titulo: "Tres términos que no se confunden"
    texto: "Una cada magnitud con lo que es."
    libro: [98, 99]
    emparejar:
      - ["Resistencia, R", "La parte real: disipa potencia"]
      - ["Reactancia, X", "La parte imaginaria: almacena y devuelve"]
      - ["Impedancia, Z", "El conjunto, R + jX"]
      - ["Admitancia, Y", "1/Z = G + jB, cómoda en paralelo"]
    exito: "Solo la parte real disipa; la reactancia va y vuelve."
    pistas:
      - { texto: "La admitancia es la inversa de la impedancia." }
    escalera:
      - "¿Cuál de las dos partes de Z convierte energía en calor?"
    solucion: "R real y disipa; X imaginaria, no disipa; Z = R + jX; Y = 1/Z."

  - id: mas-que-fuente
    tipo: sorpresa
    titulo: "Suman más que la fuente"
    texto: "Mire las dos amplitudes y su suma: 0,53 + 0,85 = 1,38 V, con una fuente de 1 V. Cambie la frecuencia: la suma nunca cuadra."
    libro: [92]
    fijar: { V_p: 1, R_f: 1000, C_f: 100e-9 }
    inicio: { f_f: 1000 }
    widget:
      tipo: circuito
      esquema: filtro-rc
      piezas: { fuente: V_p, f: f_f, r: R_f, c: C_f }
      lectura: { valor: S_ab, rotulo: "V_{R} + V_{C}" }
      barras:
        - { valor: A_r, rotulo: "V_{R}: {{A_r}}", color: azul }
        - { valor: A_c, rotulo: "V_{C}: {{A_c}}", color: naranja }
      datos:
        - { valor: S_q, rotulo: "Como catetos: {{S_q}}" }
      mide: { vr_amp: A_r, vc_amp: A_c }
      mandos:
        - { valor: f_f, lista: [500, 1000, 2000] }
    comprobar:
      - { S_ab: 1.38, S_q: 1.0 }

  - id: por-que-no-suman
    tipo: porque
    titulo: "¿Por qué no suman 1 V?"
    texto: "Un multímetro mide 0,53 V en R y 0,85 V en C, con 1 V en la fuente. ¿Dónde está el error?"
    libro: [92, 93]
    fijar: { V_p: 1, f_f: 1000, R_f: 1000, C_f: 100e-9 }
    widget:
      tipo: circuito
      esquema: filtro-rc
      piezas: { fuente: V_p, f: f_f, r: R_f, c: C_f }
      barras:
        - { valor: A_r, rotulo: "V_{R}: {{A_r}}", color: azul }
        - { valor: A_c, rotulo: "V_{C}: {{A_c}}", color: naranja }
      mide: { vr_amp: A_r, vc_amp: A_c }
    opciones:
      - texto: "En ninguno: están en cuadratura y se suman como catetos"
        bien: true
        porque: "0,532² + 0,847² = 1,00. Las magnitudes desfasadas 90° se suman como vectores, no como números."
      - texto: "El multímetro mide mal en alterna"
        porque: "Mide bien las dos. Lo que falla es sumar como números tensiones que no están en fase."
      - texto: "El condensador amplifica"
        porque: "Un RC pasivo no amplifica: cada tensión es menor que la de la fuente. Lo que no cuadra es la suma."
    escalera:
      - "¿Están v_{R} y v_{C} en fase?"
    solucion: "Desfasadas 90°: √(0,532² + 0,847²) = 1,00 V."
    comprobar:
      - { S_q: 1.0 }

  - id: limites
    tipo: pregunta
    titulo: "Los límites del método"
    texto: "Los fasores convierten la alterna en álgebra, con condiciones estrictas. ¿Cuál de estas NO es un límite del método?"
    libro: [102, 103, 104, 105]
    widget:
      tipo: circuito
      esquema: filtro-rc
      piezas: { fuente: V_p, f: f_f, r: R_f, c: C_f }
      lectura: { valor: Z_m, rotulo: "Módulo de la impedancia" }
      mide: { i_amp: I_a }
    opciones:
      - texto: "Que no admite condensadores ni bobinas"
        bien: true
        porque: "Al contrario: para eso existe. R, jωL y 1/(jωC) se tratan como resistencias complejas."
      - texto: "Que solo describe el régimen permanente"
        porque: "Ese sí es un límite: el transitorio necesita el dominio del tiempo o Laplace."
      - texto: "Que solo vale para circuitos lineales"
        porque: "También es un límite: con un diodo o un transistor en gran señal no aplica."
      - texto: "Que trata una frecuencia a la vez"
        porque: "Es un límite: con varias, se analiza cada una y se superpone."
    escalera:
      - "Tres de las cuatro son condiciones del método; una es justo lo contrario de su razón de ser."
    solucion: "No es un límite que no admita reactancias: es lo que resuelve."

  - id: sobretension
    tipo: pregunta
    fase: "Estime"
    titulo: "Más tensión que la fuente"
    texto: "El RLC de la práctica de resonancia (100 Ω, 10 mH, 100 nF, Q = 3,16) en resonancia, con 1 V de entrada. ¿Qué amplitud tiene el condensador?"
    libro: [110, "cap22#235", "cap22#256"]
    widget:
      tipo: circuito
      esquema: rlc-serie
      piezas: { fuente: V_p, f: f_r, r: R_r, l: L_r, c: C_r }
      lectura: { valor: I_r, rotulo: "Corriente en resonancia" }
      mide: { i_amp: I_r, vc_amp: A_cr, vl_amp: A_lr }
    estimar:
      objetivo: "A_cr"
      unidad: V
      min: 0
      max: 5
      paso: 0.05
      inicio: 1
      tol: 0.08
      rotulo: "Amplitud en C"
    exito: "Q veces la entrada: unos 3 V en C y otros tantos en L, en oposición de fase. Su suma es casi cero."
    pistas:
      - { cuando: { valor: estimacion, menor: 2.9 }, texto: "Más: en resonancia, V_{L} y V_{C} son Q veces la tensión aplicada." }
      - { texto: "Menos: Q = 3,16 con 1 V de entrada." }
    escalera:
      - "En resonancia la corriente es V/R, y V_{C} = I·X_{C}."
      - "X_{C} = √(L/C) = 316 Ω en resonancia."
    solucion: "10 mA × 316 Ω ≈ 3,16 V: Q veces la entrada."
    comprobar:
      - { I_r: 0.01, A_cr: 3.16, A_lr: 3.16, Z_0: 316 }

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [84, 93, 102, 112]
    ideas:
      - { titulo: "Fasores.", texto: "Derivar es multiplicar por jω: R, jωL y 1/(jωC) se asocian como resistencias." }
      - { titulo: "En cuadratura.", texto: "1000 y 1592 Ω dan 1880 Ω; 0,532 y 0,847 V dan 1 V: catetos, no sumas." }
      - { titulo: "Los límites.", texto: "Régimen permanente, una frecuencia, circuito lineal y senoides." }
      - { titulo: "En el banco.", texto: "Dos canales: la relación de amplitudes da |Z|; el desfase, su argumento." }
