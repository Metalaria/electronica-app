# «Consolas por dentro» · Game Boy Color 1: la placa, por lo que cambia respecto a la Game Boy (foto principal del
# explorador: CGB-CPU-04, cara de componentes, gbhwdb, CC BY-SA 4.0; y la cara de los botones): la VRAM ya no es un
# chip aparte, el segundo bus del SoC va ahora a una WRAM de 32 KB, el cristal es el doble, la pantalla recibe 18 bits
# de color y aparece el puerto de infrarrojos. La ranura y su temporización no cambian. Fuentes: los datos de la
# consola (gbc#n).
leccion: consola-gbc/gbc-placa

libro:
  "gbc#2": "SM83 que puede ir al doble de velocidad, PPU con paletas de 15 bits, 16 KB de VRAM dentro del chip"
  "gbc#3": "32 KB en ocho bancos de 4 KB"
  "gbc#4": "2²³ Hz, el doble que la Game Boy"
  "gbc#5": "Altavoz y auriculares"
  "gbc#6": "Genera las tensiones de la pantalla TFT"
  "gbc#7": "18 bits de color (LDR/LDG/LDB 0–5, con el bit bajo repetido)"
  "gbc#8": "Comunicación por infrarrojos ($FF56)"
  "gbc#12": "Igual que en la Game Boy: A0–A15, D0–D7"
  "gbc#15": "Entrada externa de 3 V"
  "gbc#21": "Placa conmutada que saca +5 V, +3,3 V y las tensiones de la pantalla de las dos pilas AA"
  "gbc#22": "Patillas del conector, numeradas"
  "gbc#23": "Patillas del puerto serie"
  "gbc#24": "LED y fototransistor"
  "gbc#42": "Su segundo bus externo (MA/MD) ya no va a la VRAM sino a la WRAM"
  "gbc#45": "El mismo conector y la misma temporización que en la Game Boy"

modelo:
  valores: {}
  calculos: {}

tarjetas:
  - id: explore-cambios
    tipo: explorar
    titulo: "Parece la misma placa"
    texto: "Toque el SoC, la memoria, el cristal y el chip que alimenta la pantalla en color."
    libro: ["gbc#2", "gbc#3", "gbc#4", "gbc#6"]
    requiere: { mover: [soc, wram, xtal, reg] }
    widget:
      tipo: figura
      consola: { maquina: gbc }
      zonas:
        - { id: soc, hotspot: soc, rotulo: "CPU CGB C", texto: "SM83 con doble velocidad y paletas de 15 bits." }
        - { id: wram, hotspot: wram, rotulo: "WRAM", texto: "32 KB en ocho bancos de 4 KB." }
        - { id: xtal, hotspot: xtal, rotulo: "Cristal", texto: "8,388608 MHz: el doble que la Game Boy." }
        - { id: reg, hotspot: reg, rotulo: "CGB-REG", texto: "Las tensiones de la pantalla TFT." }

  - id: toque-vram
    tipo: tocar
    titulo: "¿Dónde está la VRAM?"
    texto: "En la Game Boy, la VRAM era un chip junto al SoC. Toque dónde está en la Game Boy Color."
    libro: ["gbc#2", "gbc#3", "gbc#6", "gbc#5"]
    widget:
      tipo: figura
      consola: { maquina: gbc }
      zonas:
        - { id: soc, hotspot: soc, rotulo: "Chip cuadrado, arriba en el centro" }
        - { id: wram, hotspot: wram, rotulo: "Chip alargado, a la izquierda del grande" }
        - { id: reg, hotspot: reg, rotulo: "Chip pequeño, arriba del todo a la izquierda" }
        - { id: amp, hotspot: amp, rotulo: "Chip pequeño, debajo del grande" }
    tocar:
      bien: [soc]
      porque:
        wram: "Es la WRAM de 32 KB: la memoria de trabajo, no la de vídeo."
        reg: "Es el CGB-REG: da las tensiones de la pantalla."
        amp: "Es el amplificador de audio."
    exito: "Dentro del CPU CGB: 16 KB de VRAM que no salen por ninguna patilla."
    escalera:
      - "No hay ningún chip de memoria junto al SoC salvo la WRAM."
      - "Lea la ficha del SoC: ¿qué lleva dentro?"
    solucion: "Dentro del CPU CGB C."

  - id: por-que-bus
    tipo: porque
    titulo: "Un bus que cambia de dueño"
    texto: "En la Game Boy, el bus MA/MD era de la VRAM. ¿Qué cuelga de él en la Game Boy Color?"
    libro: ["gbc#42", "gbc#3", "gbc#2"]
    widget:
      tipo: figura
      consola: { maquina: gbc }
      zonas:
        - { id: wram, hotspot: wram, rotulo: "WRAM" }
        - { id: soc, hotspot: soc, rotulo: "SoC" }
    opciones:
      - texto: "La WRAM: la VRAM se ha metido dentro del SoC."
        bien: true
        porque: "Con la VRAM dentro, el segundo bus queda libre para la WRAM de 32 KB."
      - texto: "Sigue siendo la VRAM, ahora de 16 KB."
        porque: "Los 16 KB de VRAM están dentro del chip; por MA/MD va la WRAM."
      - texto: "El cartucho."
        porque: "El cartucho sigue en su bus de siempre, A0–A15 y D0–D7."
    escalera:
      - "¿Hay algún chip de VRAM en la placa?"
    solucion: "La WRAM de 32 KB."

  - id: empareje-cambios
    tipo: pregunta
    fase: "Empareje"
    titulo: "Lo que cambia"
    texto: "Empareje cada pieza con cómo es en la Game Boy Color."
    libro: ["gbc#4", "gbc#2", "gbc#3", "gbc#7"]
    emparejar:
      - ["Cristal", "El doble: 8,388608 MHz"]
      - ["VRAM", "16 KB, dentro del chip"]
      - ["WRAM", "32 KB en ocho bancos"]
      - ["Pantalla", "18 bits de color"]
    exito: "Más reloj, más memoria y color: la placa se parece, pero cambia por dentro."
    pistas:
      - { texto: "La VRAM ya no es un chip de la placa." }
    escalera:
      - "Toque las piezas de la primera tarjeta para leer sus fichas."
    solucion: "Cristal: el doble. VRAM: 16 KB dentro. WRAM: 32 KB. Pantalla: 18 bits."

  - id: explore-dorso
    tipo: explorar
    titulo: "La otra cara"
    texto: "Dé la vuelta a la placa. Toque el convertidor, los infrarrojos, el enlace y los contactos del cartucho."
    libro: ["gbc#21", "gbc#24", "gbc#23", "gbc#22"]
    requiere: { mover: [dcdc, ir, link, cart] }
    widget:
      tipo: figura
      consola: { maquina: gbc, foto: dorso }
      zonas:
        - { id: dcdc, hotspot: b-dcdc, rotulo: "Convertidor U5", texto: "+5 V, +3,3 V y la pantalla, de dos pilas AA." }
        - { id: ir, hotspot: b-ir, rotulo: "Infrarrojos", texto: "LED y fototransistor." }
        - { id: link, hotspot: b-link, rotulo: "Enlace", texto: "Las patillas del puerto serie." }
        - { id: cart, hotspot: b-cart, rotulo: "Cartucho", texto: "Las 32 patillas, numeradas." }

  - id: toque-ir
    tipo: tocar
    titulo: "Un puerto nuevo"
    texto: "Toque el puerto que la Game Boy no tenía."
    libro: ["gbc#8", "gbc#15"]
    widget:
      tipo: figura
      consola: { maquina: gbc }
      zonas:
        - { id: ir, hotspot: ir, rotulo: "Dos piezas de colores, arriba" }
        - { id: link, hotspot: link, rotulo: "Conector, a la derecha" }
        - { id: dcj, hotspot: dcj, rotulo: "Conector, abajo" }
    tocar:
      bien: [ir]
      porque:
        link: "Es el puerto de enlace: ya estaba en la Game Boy."
        dcj: "Es la toma de alimentación externa, de 3 V."
    exito: "El puerto de infrarrojos: un LED que emite y un fototransistor que recibe."
    escalera:
      - "Busque algo que parezca un LED."
    solucion: "El LED emisor y el fototransistor, arriba."

  - id: prediga-cartuchos
    tipo: predecir
    titulo: "¿Y los cartuchos viejos?"
    texto: "¿Puede la Game Boy Color leer un cartucho de Game Boy?"
    libro: ["gbc#12", "gbc#45"]
    widget:
      tipo: figura
      consola: { maquina: gbc }
      zonas:
        - { id: cart, hotspot: cart, rotulo: "Ranura" }
    opciones:
      - texto: "Sí: la ranura y su temporización son las mismas."
        bien: true
        porque: "El mismo conector de 32 contactos y la misma temporización que en la Game Boy."
      - texto: "Solo con un adaptador."
        porque: "No hace falta: el conector es igual."
      - texto: "No: el bus del cartucho va al doble."
        porque: "Solo en doble velocidad, y si el juego la pide: un juego de Game Boy no la pide."
    escalera:
      - "Compare la ranura de las dos consolas en el explorador."
    solucion: "Sí: el mismo conector y la misma temporización."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: ["gbc#2", "gbc#42", "gbc#4", "gbc#8"]
    ideas:
      - { titulo: "VRAM dentro.", texto: "16 KB dentro del CPU CGB." }
      - { titulo: "WRAM fuera.", texto: "32 KB en el bus que dejó libre la VRAM." }
      - { titulo: "El doble de reloj.", texto: "Un cristal de 8,388608 MHz." }
      - { titulo: "Infrarrojos.", texto: "Un puerto nuevo; la ranura, la de siempre." }
