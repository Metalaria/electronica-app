# «Consolas por dentro» · Game Boy Color 2: la alimentación, por lo que cambia respecto a la Game Boy: dos pilas AA (y
# una toma de 3 V) en vez de cuatro, así que el convertidor U5 tiene que subir la tensión hasta +5 V (un elevador:
# libro, sección 33.3, Vout = Vin / (1 − D); la corriente de entrada es mayor que la de salida), y las redes del
# esquema de Natalie the Nerd: VCC tras el interruptor, +5V, +3V3 (la salida de U7, un RN5RT33A alimentado desde +5V)
# y las tensiones de la pantalla. Fuentes: los datos de la consola (gbc#n, gb#n) y el libro.
# 1.2.1: el ciclo de trabajo es un explorar con meta; se tocan el convertidor (cara de los botones) y lo que alimenta la
# red +3V3; se escribe cuánta más corriente toma de las pilas un elevador ideal (V_out / V_in, con la potencia que se
# conserva). El camino de la corriente pasa por las dos caras: queda como ordenar.
leccion: consola-gbc/gbc-alimentacion

libro:
  "gbc#6": "Genera las tensiones de la pantalla TFT a partir de la alimentación"
  "gbc#11": "Interruptor deslizante"
  "gbc#15": "Entrada externa de 3 V"
  "gbc#21": "Placa conmutada que saca +5 V y las tensiones de la pantalla de las dos pilas AA"
  "gbc#50": "Dos pilas AA; el convertidor U5 saca +5 V, el regulador U7 baja de ellos los +3,3 V"
  "gbc#97": "Red +3V3 del esquema (alimentación)"
  "gbc#98": "Red +5V del esquema (alimentación)"
  "gbc#99": "Red -14.6v del esquema (alimentación): llega a C22, D1, P2, R22, U5"
  "gbc#105": "Red VCC del esquema (alimentación): llega a C13, C31, R7, SW1, U3, U5"
  "gb#60": "Cuatro pilas AA o la toma de 6 V"
  "cap08#67": "necesita unos 2 V de diferencia entre entrada y salida para funcionar"
  "cap33#79": "El elevador funciona de otro modo"
  "cap33#84": "Vout = Vin / (1 − D)"
  "cap33#85": "Con 3,7 V de batería y 5 V de salida, D = 0,26"
  "cap33#87": "La corriente de entrada es mayor que la de salida"

modelo:
  valores:
    V_in: { sim: "V_{in}", nombre: "tensión de las pilas", unidad: V, valor: 3 }
    V_n: { sim: "V_{out}", nombre: "tensión de la lógica", unidad: V, valor: 5 }
    D: { sim: "D", nombre: "ciclo de trabajo", unidad: "", valor: 0.2 }
  calculos:
    V_out: { expr: "V_in/(1 - D)", sim: "V_{out}", nombre: "salida de un elevador ideal", unidad: V, cifras: 3 }
    k_i: { expr: "V_n/V_in", sim: "I_{in} / I_{out}", nombre: "corriente de las pilas por cada amperio de salida (ideal)", unidad: "", cifras: 3 }
    D_5: { expr: "1 - V_in/V_n", sim: "D", nombre: "ciclo de trabajo para 5 V", unidad: "", cifras: 2 }

tarjetas:
  - id: prediga-elevador
    tipo: tocar
    titulo: "De 3 V a 5 V"
    texto: "Dos pilas AA dan 3 V y la lógica pide +5 V: un 78xx no puede, porque necesita unos 2 V más en la entrada. Toque lo que eleva la tensión."
    libro: ["gbc#21", "gbc#15", "cap33#79", "cap08#67", "gb#60"]
    widget:
      tipo: figura
      consola: { maquina: gbc, foto: dorso }
      ampliar: 1.9
      zonas:
        - { id: dcdc, hotspot: b-dcdc, rotulo: "Placa pequeña, abajo a la izquierda" }
        - { id: led, hotspot: b-led, rotulo: "Pieza pequeña, arriba a la izquierda" }
        - { id: cart, hotspot: b-cart, rotulo: "Fila de patillas, en el centro" }
    tocar:
      bien: [dcdc]
      porque:
        led: "Es el LED de encendido."
        cart: "Son las patillas del cartucho."
    exito: "U5, un elevador. La Game Boy, con cuatro pilas o la toma de 6 V, tenía la entrada por encima de 5 V; la Color, con dos pilas o la toma de 3 V, la tiene por debajo."
    escalera:
      - "Es una placa conmutada aparte."
    solucion: "El convertidor U5."

  - id: ajuste-ciclo
    tipo: explorar
    titulo: "El ciclo de trabajo"
    texto: "Un elevador ideal da Vout = Vin / (1 − D). Con 3 V de pilas, ajuste D hasta 5 V."
    libro: ["cap33#84", "cap33#85", "gbc#15"]
    inicio: { D: 0.2 }
    widget:
      tipo: grafica
      x: { id: d, min: 0, max: 0.8, unidad: "", rotulo: "D" }
      y: { min: 0, max: 16, unidad: V, rotulo: "V_{out}" }
      curvas:
        - { expr: "V_in/(1 - d)", color: azul, rotulo: "V_{in} / (1 − D)" }
      marcas:
        - { x: "D", y: "V_out", rotulo: "{{V_out}}" }
      mandos: [ { valor: D, min: 0, max: 0.8, paso: 0.01, rotulo: "Ciclo de trabajo, D" } ]
    objetivo:
      condiciones:
        - { valor: V_out, objetivo: 5, tol: 0.01, rotulo: "Salida: {{V_out}}" }
      logrado: "5 V con D = {{D}}: más que los 0,26 de una batería de 3,7 V, porque hay que subir más."
      pistas:
        - { cuando: { valor: V_out, mayor: 5.05 }, texto: "Se ha pasado: baje D." }
        - { texto: "Falta tensión: suba D." }
    escalera:
      - "Despeje D: 1 − V_{in}/V_{out}."
    solucion: "D = 0,40."
    comprobar:
      - { con: { D: 0.4 }, V_out: 5 }
      - { D_5: 0.4 }

  - id: por-que-corriente
    tipo: leer
    titulo: "Más corriente en las pilas"
    texto: "En un elevador, la corriente de entrada es mayor que la de salida. Si fuera ideal, sin pérdidas, ¿cuántos amperios tomaría de las pilas de 3 V por cada amperio a 5 V?"
    libro: ["cap33#87", "gbc#21", "gbc#15"]
    widget:
      tipo: figura
      consola: { maquina: gbc, foto: dorso }
      zonas:
        - { id: dcdc, hotspot: b-dcdc, rotulo: "U5" }
    leer:
      objetivo: k_i
      unidad: ""
      tol: 0.02
      rotulo: "Amperios de las pilas por amperio de salida"
      errores:
        - { expr: "V_in/V_n", texto: "Al revés: con menos tensión a la entrada, hace falta más corriente." }
    exito: "Unos {{k_i}}: la potencia, como mucho, se conserva; con menos tensión a la entrada, más corriente."
    escalera:
      - "Iguale las potencias: 3 V · I_{in} = 5 V · 1 A."
    solucion: "5 / 3 ≈ 1,67 A por cada amperio."
    comprobar:
      - { k_i: 1.667 }

  - id: ordene-camino
    tipo: pregunta
    fase: "Ordene"
    titulo: "El camino de la corriente"
    texto: "Ordene el camino desde las pilas hasta los +5 V."
    libro: ["gbc#21", "gbc#105", "gbc#98", "gbc#11"]
    ordenar:
      - "Las dos pilas AA."
      - "El interruptor SW1."
      - "VCC, hasta el convertidor U5."
      - "U5 saca los +5 V."
    exito: "Encender y elevar: el convertidor hace todo el trabajo."
    pistas:
      - { texto: "La red VCC une el interruptor con U5." }
    escalera:
      - "Lo último es la conversión."
    solucion: "Pilas, SW1, VCC hasta U5 y los +5 V."

  - id: empareje-redes
    tipo: tocar
    titulo: "La red de 3,3 V"
    texto: "El regulador U7 baja de los +5 V los +3,3 V de la lógica. Según el esquema, toque las tres piezas a las que llega la red +3V3."
    libro: ["gbc#97", "gbc#98", "gbc#50", "gbc#99", "gbc#6"]
    widget:
      tipo: figura
      consola: { maquina: gbc }
      zonas:
        - { id: soc, hotspot: soc, rotulo: "Chip cuadrado, arriba en el centro" }
        - { id: wram, hotspot: wram, rotulo: "Chip alargado, a la izquierda del grande" }
        - { id: ffc, hotspot: ffc, rotulo: "Conector ancho, arriba" }
        - { id: amp, hotspot: amp, rotulo: "Chip pequeño, debajo del grande" }
        - { id: cart, hotspot: cart, rotulo: "Ranura, en el centro" }
    tocar:
      bien: [soc, wram, ffc]
      todas: true
      porque:
        amp: "El amplificador, U3, está en la red +5V."
        cart: "El cartucho, P1, está en la red +5V."
    exito: "La CPU (U1), la WRAM (U2) y la pantalla (P2): la red +3V3. El cartucho y el amplificador van con los +5 V de U5; la pantalla recibe además la tensión negativa de U5 y las del CGB-REG."
    escalera:
      - "Los chips digitales de la placa y el conector de la pantalla."
    solucion: "El SoC, la WRAM y el conector de la pantalla."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: ["gbc#21", "cap33#84", "cap33#87", "gbc#98"]
    ideas:
      - { titulo: "Dos pilas.", texto: "3 V: por debajo de los 5 V de la lógica." }
      - { titulo: "Elevar.", texto: "Vout = Vin / (1 − D): el ciclo de trabajo fija la subida." }
      - { titulo: "Más corriente.", texto: "Las pilas dan más corriente de la que sale." }
      - { titulo: "Varias redes.", texto: "+5V y la pantalla salen de U5; +3V3, de U7." }
