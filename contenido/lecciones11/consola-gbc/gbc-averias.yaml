# «Consolas por dentro» · Game Boy Color 7: averías y diagnóstico. Lo simple primero (libro, capítulo 55, e iFixit:
# interruptor, pilas AA nuevas, cartucho), una consola que no enciende (pilas, interruptor o convertidor U5: medir a lo
# largo del camino del esquema, con los 3 V de las pilas y los +5 V de U5; no se presenta como la avería más común) y
# los síntomas de iFixit (pantalla, altavoz, cartucho). Fuentes: los datos de la consola (gbc#n), iFixit «Game Boy
# Color Troubleshooting» y el libro. No he encontrado una fuente de averías típicas de la placa CGB que se pueda citar.
# 1.2.1: un circuito lógico con meta (los +5 V llegan si las pilas, el interruptor y U5 están bien); el orden de iFixit
# y el juego que se cuelga se tocan en la foto. Quedan dos preguntas: medir antes la entrada y el LED que luce.
# 1.4 (contenido14): las fuentes de averías que mandó el dueño, comprobadas (scratchpad/fuentes-averias-14.md): Game
# Boy Resource (interruptor de la toma de auriculares, altavoz de 8 Ω, fusibles F1 y F2, toma de continua corroída,
# interruptor sucio) y RetroRegen (líneas de la pantalla). Sin auriculares, ahora también vale la toma (su interruptor).
# No se usan, porque no se han podido confirmar: C32, C35 y C38 como causa del volumen bajo (Console5 no abre; la página
# de RetroSix no muestra su lista).
leccion: consola-gbc/gbc-averias

libro:
  "gbc#11": "Interruptor deslizante"
  "gbc#13": "Altavoz"
  "gbc#14": "Toma de auriculares"
  "gbc#15": "Entrada externa de 3 V"
  "gbc#20": "LED rojo"
  "gbc#21": "Placa conmutada que saca +5 V"
  "gbc#84": "comprobar que el interruptor está en «on» y poner pilas AA nuevas"
  "gbc#85": "Si se enciende el LED junto a la pantalla pero no hay imagen, puede que haya que cambiar la pantalla"
  "gbc#86": "probar con auriculares; si se oyen, lo que falla es el altavoz"
  "gbc#87": "Colores corridos o manchas que se ven incluso con la pantalla apagada: la pantalla está rota"
  "gbc#88": "volver a meter el cartucho hasta el clic y quitarle el polvo"
  "gbc#89": "abierto, la consola apaga el altavoz, y la corrosión o un golpe pueden dejarlo siempre abierto"
  "gbc#90": "Un altavoz sano mide 8 Ω"
  "gbc#91": "otro en la entrada de alimentación externa (la toma de continua en la Color)"
  "gbc#92": "Una toma de continua dañada puede hacer que una Game Boy Color parezca muerta"
  "gbc#95": "Las líneas en la pantalla vienen de un fallo en la unión interna de la cinta del LCD con el cristal"
  "gbc#96": "no tiene arreglo casero permanente"
  "gbc#105": "Red VCC del esquema (alimentación): llega a C13, C31, R7, SW1, U3, U5"
  "cap53#39": "Casi siempre es lo simple: alimentación, conector, soldadura, fusible"
  "cap53#92": "conviene confirmarlos con el óhmetro"

modelo:
  valores:
    V_p: { sim: "V_{pilas}", nombre: "tensión de las pilas", unidad: V, valor: 3 }
    V_o: { sim: "V_{+5V}", nombre: "salida de U5", unidad: V, valor: 5 }
    bt: { tipo: interruptor, nombre: "pilas cargadas", valor: 1 }
    sw: { tipo: interruptor, nombre: "interruptor sano", valor: 1 }
    dc: { tipo: interruptor, nombre: "U5 sano", valor: 1 }
  calculos:
    V_bat: { expr: "V_p*bt", sim: "V_{pilas}", nombre: "tensión en los contactos de las pilas", unidad: V, cifras: 3 }
    R_sw: { si: sw, entonces: "0", sino: "1e9", sim: "R_{SW1}", nombre: "resistencia del interruptor encendido, sin pilas", unidad: Ω }
    V_5: { expr: "V_o*bt*sw*dc", sim: "V_{+5V}", nombre: "tensión de la red +5V", unidad: V, cifras: 3 }

tarjetas:
  - id: explore-simple
    tipo: explorar
    titulo: "Lo primero, lo simple"
    texto: "La corriente va de las pilas al interruptor y del interruptor, por VCC, al convertidor U5. Consiga que lleguen los +5 V."
    libro: ["cap53#39", "gbc#11", "gbc#105", "gbc#21"]
    widget:
      tipo: logica
      entradas: [{ id: BT, rotulo: "Pilas cargadas" }, { id: SW, rotulo: "Interruptor sano" }, { id: DC, rotulo: "U5 sano" }]
      piezas:
        - { id: a1, tipo: and, entradas: [BT, SW, DC] }
      salidas:
        - { id: CINCO, de: a1, rotulo: "Red +5V" }
    objetivo:
      condiciones:
        - { led: CINCO, valor: 1, rotulo: "Red +5V" }
      logrado: "Las tres en serie: con que falle una, no hay +5 V. Por eso se mide a lo largo del camino, desde las pilas."
      pistas:
        - { texto: "Todavía falla una pieza del camino." }
    escalera:
      - "Pilas, interruptor y U5: los tres bien."
    solucion: "Pilas, interruptor y U5, los tres sanos."

  - id: ordene-antes
    tipo: tocar
    fase: "Ordene"
    titulo: "Antes de abrirla"
    texto: "La consola no enciende. Con pilas AA nuevas, toque, en el orden de iFixit, lo que revisaría antes de abrirla: el interruptor y el cartucho."
    libro: ["gbc#84", "gbc#88", "cap53#39"]
    widget:
      tipo: figura
      consola: { maquina: gbc }
      ampliar: 2.35
      zonas:
        - { id: sw, hotspot: sw, rotulo: "Pieza alargada, a la izquierda" }
        - { id: cart, hotspot: cart, rotulo: "Ranura, en el centro" }
        - { id: soc, hotspot: soc, rotulo: "Chip cuadrado, arriba en el centro" }
        - { id: amp, hotspot: amp, rotulo: "Chip pequeño, debajo del grande" }
    tocar:
      bien: [sw, cart]
      orden: true
      porque:
        soc: "Un chip va al final, después de abrir y medir."
        amp: "Un chip va al final, después de abrir y medir."
    pistas:
      - { texto: "iFixit empieza por el interruptor y las pilas." }
    exito: "Interruptor en «on» y pilas nuevas; después, el cartucho hasta el clic y sin polvo; por último, abrir y medir."
    escalera:
      - "¿Qué se puede probar sin destornillador?"
    solucion: "El interruptor y luego la ranura."

  - id: averia-no-enciende
    tipo: averia
    titulo: "No enciende"
    texto: "Mida a lo largo del camino del esquema y señale la pieza: las pilas, el interruptor o el convertidor U5."
    libro: ["gbc#15", "gbc#105", "gbc#21", "gbc#84", "cap53#92"]
    widget:
      tipo: figura
      consola: { maquina: gbc }
      ampliar: 2.35
      zonas:
        - { id: sw, hotspot: sw, rotulo: "Interruptor SW1" }
        - { id: dcj, hotspot: dcj, rotulo: "Toma P4" }
    averia:
      pasos: 3
      eleccion: fija
      sospechosos:
        - { id: pilas, rotulo: "Pilas" }
        - { id: interruptor, rotulo: "Interruptor SW1" }
        - { id: u5, rotulo: "Convertidor U5" }
      sondas:
        - { id: bat, rotulo: "Pilas, en sus contactos", valor: V_bat }
        - { id: sw1, rotulo: "Interruptor encendido, sin pilas", valor: R_sw }
        - { id: mas5, rotulo: "Red +5V", valor: V_5 }
      fallos:
        - { id: pilas-gastadas, pieza: pilas, tipo: abierta, con: { bt: 0 }, texto: "Las pilas no dan tensión: ponga unas AA nuevas antes de abrir nada." }
        - { id: sw-abierto, pieza: interruptor, tipo: abierta, con: { sw: 0 }, texto: "El interruptor no cierra: VCC no llega a U5." }
        - { id: u5-muerto, pieza: u5, tipo: abierta, con: { dc: 0 }, texto: "Pilas e interruptor bien, pero la red +5V a cero: falla el convertidor U5." }
    exito: "Pilas, interruptor y convertidor: la medida dice dónde se corta."
    escalera:
      - "Empiece por las pilas: deben dar sus 3 V."
      - "Si las pilas y el interruptor están bien pero no hay +5 V, queda U5."
    solucion: "Pilas sin tensión: las pilas. Interruptor abierto: SW1. Los dos bien y +5V a cero: U5."
    comprobar:
      - { V_bat: 3, R_sw: 0, V_5: 5 }

  - id: por-que-pilas
    tipo: porque
    titulo: "Empezar por la entrada"
    texto: "La red +5V está a cero. ¿Por qué medir antes las pilas que culpar a U5?"
    libro: ["gbc#21", "gbc#105", "cap53#39"]
    widget:
      tipo: figura
      consola: { maquina: gbc, foto: dorso }
      zonas:
        - { id: dcdc, hotspot: b-dcdc, rotulo: "Convertidor U5" }
    opciones:
      - texto: "Sin entrada, U5 no puede dar salida: su cero no lo acusa."
        bien: true
        porque: "U5 saca los +5 V de las pilas por VCC: primero hay que ver que le llega algo."
      - texto: "Porque U5 nunca se estropea."
        porque: "Puede fallar; pero solo se le culpa cuando su entrada está bien."
      - texto: "Porque medir U5 es peligroso."
        porque: "No es por peligro: es por orden. Una salida a cero sin entrada no dice nada del convertidor."
    escalera:
      - "¿De dónde saca U5 la energía para sus +5 V?"
    solucion: "Primero la entrada: sin pilas ni VCC, U5 no tiene la culpa."

  - id: prediga-led
    tipo: predecir
    titulo: "El LED luce"
    texto: "No hay imagen, pero el LED rojo junto a la pantalla está encendido. ¿Dónde mira primero?"
    libro: ["gbc#85", "gbc#20"]
    widget:
      tipo: figura
      consola: { maquina: gbc, foto: dorso }
      ampliar: 1.9
      zonas:
        - { id: led, hotspot: b-led, rotulo: "LED D4" }
    opciones:
      - texto: "En la pantalla: la consola recibe corriente."
        bien: true
        porque: "iFixit lo dice así: con el LED encendido y sin imagen, puede que haya que cambiar la pantalla."
      - texto: "En las pilas."
        porque: "Si el LED luce, llega corriente: las pilas no son lo primero."
      - texto: "En el altavoz."
        porque: "El altavoz no tiene que ver con la imagen."
    escalera:
      - "¿Qué le dice el LED encendido?"
    solucion: "La pantalla: la alimentación llega."

  - id: tocar-altavoz
    tipo: tocar
    titulo: "Sin sonido"
    texto: "No suena por el altavoz, pero sí por los auriculares. Toque una pieza que puede fallar."
    libro: ["gbc#86", "gbc#89", "gbc#90", "gbc#13", "gbc#14"]
    widget:
      tipo: figura
      consola: { maquina: gbc }
      zonas:
        - { id: ls, hotspot: ls, rotulo: "Pieza redonda, abajo a la izquierda" }
        - { id: hp, hotspot: hp, rotulo: "Conector, abajo en el centro" }
        - { id: amp, hotspot: amp, rotulo: "Chip pequeño, debajo del grande" }
    tocar:
      bien: [ls, hp]
      porque:
        amp: "El amplificador funciona: los auriculares suenan."
    exito: "El altavoz (sano mide 8 Ω) o el interruptor de la toma de auriculares: si la corrosión lo deja abierto, la consola apaga el altavoz aunque los auriculares suenen."
    escalera:
      - "Piense en el propio altavoz y en lo que decide si suena él o los auriculares."
    solucion: "El altavoz SP1 o el interruptor de la toma de auriculares."

  - id: toque-toma
    tipo: tocar
    titulo: "Muerta con la fuente externa"
    texto: "Con la alimentación externa enchufada, la consola parece muerta. Toque la pieza que revisaría."
    libro: ["gbc#92", "gbc#91", "gbc#15"]
    widget:
      tipo: figura
      consola: { maquina: gbc }
      zonas:
        - { id: dcj, hotspot: dcj, rotulo: "Conector pequeño, en el borde" }
        - { id: soc, hotspot: soc, rotulo: "Chip cuadrado, arriba en el centro" }
        - { id: cart, hotspot: cart, rotulo: "Ranura, en el centro" }
    tocar:
      bien: [dcj]
      porque:
        soc: "Antes que el chip, lo simple: por dónde entra la alimentación."
        cart: "El cartucho no hace que la consola parezca muerta."
    exito: "La toma de continua: la humedad corroe sus contactos y deja abierto su interruptor. En esa entrada hay además un fusible, que se mide con continuidad."
    escalera:
      - "Empiece por donde entra la alimentación externa."
    solucion: "La toma de alimentación externa."

  - id: empareje-sintomas
    tipo: tocar
    titulo: "El juego se cuelga"
    texto: "La consola enciende, pero el juego se cuelga. Toque lo que revisaría."
    libro: ["gbc#88", "gbc#87", "gbc#85"]
    widget:
      tipo: figura
      consola: { maquina: gbc }
      zonas:
        - { id: cart, hotspot: cart, rotulo: "Ranura, en el centro" }
        - { id: soc, hotspot: soc, rotulo: "Chip cuadrado, arriba en el centro" }
        - { id: ffc, hotspot: ffc, rotulo: "Conector ancho, arriba" }
    tocar:
      bien: [cart]
      porque:
        soc: "Antes de sospechar del chip, lo simple: el cartucho."
        ffc: "Es el conector de la pantalla: un fallo de pantalla da manchas o falta de imagen, no cuelgues."
    exito: "La ranura: volver a meter el cartucho hasta el clic y quitarle el polvo. Las manchas que se ven incluso con la pantalla apagada son de una pantalla rota."
    escalera:
      - "El juego vive en el cartucho."
    solucion: "La ranura del cartucho."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: ["cap53#39", "gbc#84", "gbc#105", "gbc#86", "gbc#95", "gbc#96"]
    ideas:
      - { titulo: "Lo simple.", texto: "Interruptor, pilas nuevas y cartucho, antes de abrir." }
      - { titulo: "El camino.", texto: "Pilas, interruptor y U5: la medida dice dónde se corta." }
      - { titulo: "Descartar.", texto: "El LED y los auriculares dicen qué parte funciona." }
      - { titulo: "Las líneas.", texto: "Las de la pantalla vienen de la unión de su cinta con el cristal: sin arreglo casero permanente." }
