# «Consolas por dentro» · Game Boy Color 4: bancos e infrarrojos, por lo que cambia respecto a la Game Boy. La WRAM de
# 32 KB en ocho bancos de 4 KB por el bus MA/MD (el banco 0 en $C000–$CFFF y el de SVBK en $D000–$DFFF; SVBK = 0
# elige el 1), la VRAM interna de dos bancos (VBK: solo cuenta el bit 0), la HDMA (un motor de copia, como el DMA del
# libro, 39.8) y el puerto de infrarrojos RP ($FF56: circuito lógico y tabla de la habilitación de lectura, el LED, el
# consumo y el receptor que se adapta). Fuentes: el decodificador del explorador (arquitectura gbc.ts), Pan Docs «CGB
# Registers» y «Video Display», y el libro.
# 1.2.1: se toca el chip que pone el banco; se escriben la dirección de la SRAM (banco × 4096 + $123, en hexadecimal),
# el banco que da VBK = $FF y el valor de RP tras enviar ($00); el circuito de la lectura de RP tiene meta. Queda una
# pregunta: la HDMA.
leccion: consola-gbc/gbc-buses

libro:
  "gbc#3": "32 KB en ocho bancos de 4 KB: MA0–MA12 más RA0/RA1 desde el SoC, que pone el banco de SVBK ($FF70)"
  "gbc#8": "Comunicación por infrarrojos ($FF56)"
  "gbc#43": "$C000–$CFFF es siempre el banco 0; $D000–$DFFF, el banco de SVBK ($FF70, 1–7)"
  "gbc#52": "VRAM interna del CPU CGB (banco de VBK, $FF4F)"
  "gbc#53": "Decodificador, lectura en $C000"
  "gbc#54": "Dirección de la SRAM = banco × 4096 + $123"
  "gbc#58": "Registros de la DMA a VRAM (HDMA): origen, destino y longitud/modo"
  "gbc#59": "SVBK: los bits 0–2 eligen el banco de WRAM de $D000–$DFFF (0 equivale a 1)"
  "gbc#62": "la HDMA a la VRAM"
  "gbc#65": "los bits 6 y 7 habilitan la lectura (3) o no (0)"
  "gbc#66": "hay que poner RP a $00 para volver a reducir el consumo de las pilas"
  "gbc#67": "una señal larga con el LED encendido puede tomarse como apagado"
  "gbc#74": "VBK ($FF4F) cambia el banco de VRAM: solo cuenta el bit 0"
  "cap38#231": "El DMA (acceso directo a memoria) es un motor de copia independiente"

modelo:
  valores:
    b_w: { sim: "b", nombre: "banco de SVBK", unidad: "", valor: 7 }
    vbk: { sim: "VBK", nombre: "valor escrito en VBK", unidad: "", valor: 255 }
  calculos:
    d_s: { expr: "b_w*4096 + 291", sim: "dirección", nombre: "dirección en la SRAM de $D123", unidad: "" }
    b_v: { expr: "vbk - 2*floor(vbk/2)", sim: "banco", nombre: "banco de VRAM (bit 0 de VBK)", unidad: "" }

tarjetas:
  - id: explore-wram
    tipo: tocar
    titulo: "Ocho bancos"
    texto: "La WRAM son 32 KB en ocho bancos de 4 KB. Toque el chip que le pone el banco, con RA0 y RA1."
    libro: ["gbc#3", "gbc#43"]
    widget:
      tipo: figura
      consola: { maquina: gbc }
      zonas:
        - { id: soc, hotspot: soc, rotulo: "Chip cuadrado, arriba en el centro" }
        - { id: wram, hotspot: wram, rotulo: "Chip alargado, a la izquierda del grande" }
        - { id: amp, hotspot: amp, rotulo: "Chip pequeño, debajo del grande" }
    tocar:
      bien: [soc]
      porque:
        wram: "Es la propia WRAM: recibe el banco, no lo elige."
        amp: "Es el amplificador de audio."
    exito: "La CPU CGB: pone MA0–MA12 y, con RA0/RA1, el banco que el juego escribió en SVBK ($FF70)."
    escalera:
      - "El banco lo elige un registro del SoC."
    solucion: "El SoC CPU CGB C."

  - id: empareje-bancos
    tipo: pregunta
    fase: "Empareje"
    titulo: "¿Qué banco se ve?"
    texto: "Empareje cada acceso con la memoria y el banco que contestan."
    libro: ["gbc#43", "gbc#53", "gbc#59", "gbc#52"]
    emparejar:
      - ["Leer $C123", "WRAM, banco 0"]
      - ["Leer $D123 con SVBK = 7", "WRAM, banco 7"]
      - ["Leer $D123 con SVBK = 0", "WRAM, banco 1"]
      - ["Escribir en $8000", "VRAM interna, banco de VBK"]
    exito: "Banco 0 fijo abajo; el de SVBK arriba; y el 0 no se puede poner arriba."
    pistas:
      - { texto: "SVBK = 0 equivale a 1." }
    escalera:
      - "$C000–$CFFF es siempre el banco 0."
    solucion: "$C123: banco 0. $D123: el de SVBK, con 0 = 1. $8000: VRAM interna."

  - id: prediga-sram
    tipo: leer
    titulo: "¿Qué celda de la SRAM?"
    texto: "Con SVBK = 7, la CPU lee $D123. El SoC rehace la dirección como banco × 4096 + $123: escríbala en hexadecimal."
    libro: ["gbc#54", "gbc#3"]
    widget:
      tipo: figura
      consola: { maquina: gbc }
      zonas:
        - { id: wram, hotspot: wram, rotulo: "WRAM" }
    leer:
      objetivo: d_s
      base: 16
      cifras: 16
      rotulo: "Dirección en la SRAM"
      errores:
        - { expr: "53539", texto: "Esa es la dirección de la CPU: la SRAM solo tiene 32 KB y se rehace con el banco." }
        - { expr: "291", texto: "Eso sería el banco 0: con SVBK = 7, el banco 7 entra en los bits altos." }
    exito: "El banco 7 delante de $123: los bits bajos son los de la CPU; los altos, el banco."
    escalera:
      - "Multiplicar por 4096 es poner el banco en la cifra hexadecimal más alta."
    solucion: "La cifra hexadecimal más alta es el banco, 7, y detrás va $123."
    comprobar:
      - { d_s: 28963 }

  - id: prediga-vbk
    tipo: leer
    titulo: "Un registro de un bit"
    texto: "El juego escribe $FF en VBK, y de VBK solo cuenta el bit 0. Escriba el banco de VRAM que ve la CPU."
    libro: ["gbc#74", "gbc#52"]
    widget:
      tipo: figura
      consola: { maquina: gbc }
      zonas:
        - { id: soc, hotspot: soc, rotulo: "La VRAM está aquí dentro" }
    leer:
      objetivo: b_v
      unidad: ""
      tol: 0.01
      rotulo: "Banco de VRAM"
      errores:
        - { expr: "vbk", texto: "Ese es el valor entero: VBK solo mira el bit 0." }
    exito: "El banco 1: el bit 0 de $FF es 1, y VBK ignora los demás."
    escalera:
      - "¿Cuánto vale el bit 0 de $FF?"
    solucion: "El banco 1."
    comprobar:
      - { b_v: 1 }

  - id: por-que-hdma
    tipo: porque
    titulo: "Copiar sin la CPU"
    texto: "La CPU podría copiar a la VRAM byte a byte. ¿Para qué está la HDMA?"
    libro: ["gbc#58", "cap38#231", "gbc#62"]
    widget:
      tipo: figura
      consola: { maquina: gbc }
      zonas:
        - { id: soc, hotspot: soc, rotulo: "CPU CGB" }
    opciones:
      - texto: "Es un motor de copia: se le dan origen, destino y longitud, y copia solo."
        bien: true
        porque: "Como el DMA del libro: la CPU no gasta una instrucción por byte."
      - texto: "Para copiar más rápido en doble velocidad."
        porque: "Al revés: la HDMA no cambia con la doble velocidad."
      - texto: "Para escribir en la WRAM."
        porque: "Es la DMA a la VRAM: copia hacia la memoria de vídeo."
    escalera:
      - "¿Qué tres datos se le dan a la HDMA?"
    solucion: "Copia bloques a la VRAM sin la CPU."

  - id: explore-rp
    tipo: explorar
    titulo: "El puerto de infrarrojos"
    texto: "En RP ($FF56), los bits 7 y 6 habilitan la lectura de los infrarrojos. Consiga habilitarla."
    libro: ["gbc#65", "gbc#8"]
    widget:
      tipo: logica
      entradas: [{ id: B7, rotulo: "Bit 7" }, { id: B6, rotulo: "Bit 6" }]
      piezas:
        - { id: y, tipo: and, entradas: [B7, B6] }
      salidas:
        - { id: LEER, de: y, rotulo: "Lectura habilitada" }
    objetivo:
      condiciones:
        - { led: LEER, valor: 1, rotulo: "Lectura habilitada" }
      logrado: "Los dos bits a la vez: 3 habilita, 0 no."
      pistas:
        - { texto: "Con un solo bit no basta." }
    escalera:
      - "La fuente da dos valores: 3 o 0."
    solucion: "Bit 7 y bit 6 a uno."

  - id: tabla-rp
    tipo: tabla
    titulo: "La tabla de la lectura"
    texto: "Rellene en qué filas está habilitada la lectura."
    libro: ["gbc#65"]
    widget:
      tipo: logica
      entradas: [{ id: B7, rotulo: "Bit 7" }, { id: B6, rotulo: "Bit 6" }]
      piezas:
        - { id: y, tipo: and, entradas: [B7, B6] }
      salidas:
        - { id: LEER, de: y, rotulo: "Lectura habilitada" }
      ocultar: true
    tabla:
      salidas: [LEER]
    exito: "Los dos bits a la vez: 3 habilita, 0 deshabilita."
    escalera:
      - "La fuente da dos valores: 3 o 0."
    solucion: "Solo con los dos bits a uno."

  - id: prediga-rp
    tipo: leer
    titulo: "Después de enviar"
    texto: "El juego ha terminado de enviar por infrarrojos y debe volver a reducir el consumo de las pilas. Escriba en hexadecimal el valor que pone en RP."
    libro: ["gbc#66", "gbc#67"]
    widget:
      tipo: figura
      consola: { maquina: gbc }
      zonas:
        - { id: ir, hotspot: ir, rotulo: "LED y fototransistor" }
    leer:
      objetivo: "0x00"
      base: 16
      cifras: 8
      rotulo: "Valor de RP"
    exito: "$00. Y no sirve dejar el LED encendido para que el otro siga recibiendo: el receptor se adapta y una señal larga encendida acaba leyéndose como apagada."
    escalera:
      - "Todo a cero: LED apagado y lectura deshabilitada."
    solucion: "$00."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: ["gbc#43", "gbc#74", "gbc#58", "gbc#66"]
    ideas:
      - { titulo: "SVBK.", texto: "El banco de WRAM de $D000–$DFFF." }
      - { titulo: "VBK.", texto: "Dos bancos de VRAM: solo cuenta el bit 0." }
      - { titulo: "HDMA.", texto: "Copia a la VRAM sin la CPU." }
      - { titulo: "RP.", texto: "Infrarrojos: habilitar, usar y volver a $00." }
