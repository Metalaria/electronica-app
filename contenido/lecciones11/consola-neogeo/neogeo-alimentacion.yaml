# «Consolas por dentro» · Neo Geo AES 2: la alimentación, 5 V justos. La NEO-AES de primera generación no lleva
# regulador: toma 5 V ± 0,2 V del adaptador PRO-POW (5 V, 3 A), con una protección que actúa por encima de 5,4 V; la
# polaridad (exterior positivo) sin protección contra la inversión; el NEO-POW3 de 10 V que puede quemarla; y las
# placas de «9 V» con LM2576. Fuentes: los datos de la consola (neogeo#n), NeoGeo Development Wiki («Power
# requirements», «Power supply») y el libro (potencia, sección 1.2).
# 1.2.1: se toca la protección; la ventana de 5 V ± 0,2 V es un explorar con meta; se escriben la potencia a 2 A, la
# del PRO-POW (5 V, 3 A) y cuánto se pasa el NEO-POW3 de lo que aguanta la placa. La polaridad y la protección van en
# los éxitos. Queda una pregunta: de dónde salen los 5 V.
leccion: consola-neogeo/neogeo-alimentacion

libro:
  "neogeo#28": "Circuito que actúa por encima de 5,4 V"
  "neogeo#30": "Interruptor deslizante de la alimentación"
  "neogeo#54": "LM2576T-5 (U37) Alimentación de 5 V"
  "neogeo#95": "La mayoría de las AES de primera generación (placa NEO-AES) son solo de 5 V"
  "neogeo#96": "Piden 5 V ± 0,2 V y 2 A"
  "neogeo#97": "Por encima de 5,2 V se acaban muriendo componentes; por debajo de 4,8 V puede haber fallos de imagen o reinicios"
  "neogeo#98": "Algunas, con la placa NEO-POWER-0, piden 9 V: llevan una bobina grande de cobre y un LM2576 de 5 patillas"
  "neogeo#100": "el exterior es el positivo y el interior, masa"
  "neogeo#101": "Las primeras consolas no tienen protección contra la polaridad invertida"
  "neogeo#102": "salida de 5 V de continua y 3 A"
  "neogeo#103": "El NEO-POW3 da 10 V de continua y 1 A (otra versión, 11 V y 700 mA) y puede quemar las primeras consolas de 5 V"
  "cap01#27": "P = V dot.op I"

modelo:
  valores:
    V_ad: { sim: "V_{adaptador}", nombre: "tensión del adaptador", unidad: V, valor: 6 }
    V_n: { sim: "V_{nominal}", nombre: "tensión que pide la placa", unidad: V, valor: 5 }
    I: { sim: "I", nombre: "corriente de la consola", unidad: A, valor: 1 }
    I_pp: { sim: "I_{PRO-POW}", nombre: "corriente del PRO-POW", unidad: A, valor: 3 }
    V_p3: { sim: "V_{NEO-POW3}", nombre: "tensión del NEO-POW3", unidad: V, valor: 10 }
    V_max: { sim: "V_{máx}", nombre: "máximo que aguanta la placa", unidad: V, valor: 5.2 }
  calculos:
    P_pp: { expr: "V_n*I_pp", sim: "P", nombre: "potencia del PRO-POW", unidad: W }
    V_ex: { expr: "V_p3 - V_max", sim: "ΔV", nombre: "lo que se pasa el NEO-POW3", unidad: V }
    V_pl: { expr: "V_ad", sim: "V_{placa}", nombre: "tensión en la placa", unidad: V, cifras: 3 }
    P: { expr: "V_n*I", sim: "P", nombre: "potencia de la consola", unidad: W, cifras: 3 }

tarjetas:
  - id: explore-alim
    tipo: tocar
    titulo: "La alimentación en la foto"
    texto: "La NEO-AES de primera generación no lleva regulador, pero vigila la entrada. Toque la protección de sobretensión, el transistor del disipador verde."
    libro: ["neogeo#30", "neogeo#28", "neogeo#97"]
    widget:
      tipo: figura
      consola: { maquina: neogeo }
      zonas:
        - { id: prot, hotspot: prot, rotulo: "Pieza con disipador, abajo a la izquierda" }
        - { id: power, hotspot: power, rotulo: "Interruptor, abajo del todo a la izquierda" }
        - { id: reset, hotspot: reset, rotulo: "Botón, a la izquierda" }
    tocar:
      bien: [prot]
      porque:
        power: "Es el interruptor de encendido."
        reset: "Es el botón de reset."
    exito: "Actúa por encima de 5,4 V: sin regulador, una sobretensión del adaptador llegaría directa a los chips, y por encima de 5,2 V se acaban muriendo."
    escalera:
      - "Busque un transistor en un disipador verde."
    solucion: "La protección de sobretensión."

  - id: prediga-regulador
    tipo: predecir
    titulo: "¿Dónde está el regulador?"
    texto: "En esta NEO-AES de primera generación no hay ningún regulador. ¿De dónde salen sus 5 V?"
    libro: ["neogeo#95", "neogeo#102"]
    widget:
      tipo: figura
      consola: { maquina: neogeo }
      zonas:
        - { id: prot, hotspot: prot, rotulo: "Protección" }
        - { id: power, hotspot: power, rotulo: "Interruptor" }
    opciones:
      - texto: "Del adaptador: el PRO-POW da ya 5 V."
        bien: true
        porque: "La NEO-AES de primera generación es solo de 5 V: el adaptador da 5 V de continua y 3 A."
      - texto: "De un regulador escondido bajo la placa auxiliar."
        porque: "No lo hay: la placa toma los 5 V tal cual del adaptador."
      - texto: "Del cartucho."
        porque: "El cartucho recibe los 5 V de la consola; no los genera."
    escalera:
      - "Mire qué da el adaptador original."
    solucion: "Del adaptador PRO-POW, que da 5 V de continua."

  - id: formula-potencia
    tipo: leer
    titulo: "Diez vatios a 5 V"
    texto: "La placa pide 5 V y hasta 2 A. Escriba la potencia."
    libro: ["cap01#27", "neogeo#96"]
    fijar: { I: 2 }
    widget:
      tipo: grafica
      x: { id: i, min: 0, max: 3, unidad: A, rotulo: "I" }
      y: { min: 0, max: 16, unidad: W, rotulo: "P" }
      curvas:
        - { expr: "V_n*i", color: naranja, rotulo: "P = V · I" }
      mandos: []
    leer:
      objetivo: P
      unidad: W
      tol: 0.01
      rotulo: "Potencia"
    exito: "5 V · 2 A = 10 W."
    escalera:
      - "P = V · I."
    solucion: "10 W."
    comprobar:
      - { P: 10 }

  - id: ajuste-ventana
    tipo: explorar
    titulo: "Una ventana estrecha"
    texto: "Sin regulador, la placa recibe justo lo que da el adaptador, y pide 5 V ± 0,2 V. Ajuste el adaptador hasta que esté dentro."
    libro: ["neogeo#96", "neogeo#97"]
    inicio: { V_ad: 6 }
    widget:
      tipo: grafica
      x: { id: v, min: 3, max: 7, unidad: V, rotulo: "V_{adaptador}" }
      y: { min: 3, max: 7, unidad: V, rotulo: "V_{placa}" }
      curvas:
        - { expr: "v", color: azul, rotulo: "tensión en la placa" }
      marcas:
        - { x: "V_ad", y: "V_pl", rotulo: "{{V_pl}}" }
      lectura: { valor: V_pl, rotulo: "Tensión en la placa" }
      mandos: [ { valor: V_ad, min: 3, max: 7, paso: 0.1, rotulo: "Adaptador, V_{adaptador}" } ]
    objetivo:
      condiciones:
        - { valor: V_pl, objetivo: 5, tol: 0.04, rotulo: "En la placa: {{V_pl}}" }
      logrado: "{{V_pl}}: dentro de 5 V ± 0,2 V. Por encima de 5,2 V se acaban muriendo componentes; por debajo de 4,8 V, fallos de imagen o reinicios."
      pistas:
        - { cuando: { valor: V_pl, mayor: 5.2 }, texto: "Por encima de 5,2 V se mueren componentes: bájela." }
        - { texto: "Por debajo de 4,8 V: fallos de imagen o reinicios. Súbala." }
    escalera:
      - "La ventana va de 4,8 V a 5,2 V."
    solucion: "Entre 4,8 V y 5,2 V; lo ideal, 5 V."
    comprobar:
      - { con: { V_ad: 5 }, V_pl: 5 }

  - id: prediga-pow3
    tipo: leer
    titulo: "El adaptador equivocado"
    texto: "Alguien conecta un NEO-POW3, de 10 V, a esta NEO-AES de 5 V, que aguanta hasta 5,2 V. Escriba cuántos voltios se pasa."
    libro: ["neogeo#103", "neogeo#97"]
    widget:
      tipo: figura
      consola: { maquina: neogeo }
      zonas:
        - { id: prot, hotspot: prot, rotulo: "Protección" }
    leer:
      objetivo: V_ex
      unidad: V
      tol: 0.01
      rotulo: "Lo que se pasa"
      errores:
        - { expr: "V_p3 - V_n", texto: "Ha restado los 5 V nominales; el límite es 5,2 V." }
    exito: "4,8 V de más: el NEO-POW3 puede quemar las primeras consolas de 5 V. Las placas de «9 V», con LM2576, son otras."
    escalera:
      - "10 − 5,2."
    solucion: "10 V − 5,2 V = 4,8 V."
    comprobar:
      - { V_ex: 4.8 }

  - id: empareje-adaptadores
    tipo: leer
    titulo: "El adaptador original"
    texto: "El PRO-POW, el adaptador original, da 5 V de continua y 3 A. Escriba la potencia máxima que puede dar."
    libro: ["neogeo#102", "neogeo#100", "neogeo#101", "neogeo#95", "neogeo#98", "neogeo#54", "cap01#27"]
    widget:
      tipo: figura
      consola: { maquina: neogeo }
      zonas:
        - { id: power, hotspot: power, rotulo: "Interruptor de encendido" }
    leer:
      objetivo: P_pp
      unidad: W
      tol: 0.01
      rotulo: "Potencia del PRO-POW"
    exito: "15 W, con margen sobre los 10 W de la placa. Su clavija: exterior positivo e interior a masa, y las primeras consolas no se protegen contra la polaridad invertida. Las placas de «9 V» llevan un LM2576."
    escalera:
      - "P = V · I con los datos del adaptador."
    solucion: "5 V · 3 A = 15 W."
    comprobar:
      - { P_pp: 15 }

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: ["neogeo#95", "neogeo#96", "neogeo#28", "neogeo#103"]
    ideas:
      - { titulo: "Sin regulador.", texto: "La primera NEO-AES toma 5 V del adaptador." }
      - { titulo: "Ventana estrecha.", texto: "5 V ± 0,2 V: fuera, fallos o daños." }
      - { titulo: "Protección.", texto: "Un circuito vigila que no pase de 5,4 V." }
      - { titulo: "Ojo al adaptador.", texto: "Uno de 10 V puede quemarla." }
