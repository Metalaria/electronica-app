# «Consolas por dentro» · Neo Geo AES 4: el mapa del 68000 y el bus P. El decodificador del explorador (arquitectura
# neogeo.ts sobre sus direcciones de ejemplo: «Neo-Geo Hardware Specification» de SNK y esquemas MV4), el mapa partido
# por A23 y A22 (circuito lógico y su tabla: los cuartos son los del mapa del explorador, no el circuito del PRO-C0),
# el espejo de la RAM, la VRAM vista solo por los registros del LSPC y el buzón de sonido en $320000. Fuentes: neogeo#n
# y el libro (decodificador, 28.3; los espejos, 38.11).
# 1.2.1: se tocan el chip que decodifica, la RAM que contesta a $10FD80 y el chip del buzón de sonido; el mapa por
# A23 y A22 tiene meta (la tarjeta); el espejo y el registro de dato del LSPC se escriben en hexadecimal.
leccion: consola-neogeo/neogeo-buses

libro:
  "neogeo#7": "Decodifica las direcciones del 68000 (A1–A4, A17–A23, /AS, /UDS, /LDS, R/W)"
  "neogeo#67": "Bus de 24 bits de dirección (A1–A23 más /UDS y /LDS para los bytes) y 16 de datos"
  "neogeo#3": "lee el programa de la ROM M1 del cartucho"
  "neogeo#11": "64 KB de RAM de trabajo en $100000–$10FFFF"
  "neogeo#83": "Sus registros se escriben por los puertos $04–$07 del Z80"
  "neogeo#19": "Doble conector de 2 × 120 contactos"
  "neogeo#84": "Escribir en $320000 deja el código y dispara la NMI del Z80"
  "neogeo#87": "Decodificador, lectura en $000100: ROM P, banco fijo (1 MB)"
  "neogeo#88": "Decodificador, escritura en $10FD80: RAM de usuario (64 KB, espejada)"
  "neogeo#89": "Solo se decodifican A1–A15: el resto de la zona son espejos"
  "neogeo#90": "deja el código para el Z80 en el latch del PRO-B0 y le provoca una NMI"
  "neogeo#91": "El 68000 solo ve la VRAM por ellos, por palabras y sin esperas"
  "neogeo#92": "RAM de paleta ($400000–$401FFF, espejada)"
  "neogeo#93": "Tarjeta de 8 bits: una de 2 KB ocupa $800000–$800FFF"
  "neogeo#94": "ROM del sistema NEO-EP0, $C00000–$C1FFFF"
  "cap29#76": "Decodificador: de n entradas a 2ⁿ salidas, con una sola activa"
  "cap37#359": "aparecen porque la decodificación de direcciones es incompleta"

modelo:
  valores: {}
  calculos: {}

tarjetas:
  - id: explore-buses
    tipo: tocar
    titulo: "Un bus de 16 bits"
    texto: "El 68000 tiene 24 bits de dirección y 16 de datos, y un chip a medida decide quién contesta a cada dirección. Tóquelo."
    libro: ["neogeo#67", "neogeo#19", "neogeo#7"]
    widget:
      tipo: figura
      consola: { maquina: neogeo }
      zonas:
        - { id: proc0, hotspot: proc0, rotulo: "Chip cuadrado, abajo a la derecha" }
        - { id: prob0, hotspot: prob0, rotulo: "Chip cuadrado, abajo en el centro" }
        - { id: lspc, hotspot: lspc, rotulo: "Chip cuadrado, a la izquierda" }
        - { id: wram, hotspot: wram, rotulo: "Chips, arriba en el centro" }
        - { id: bios, hotspot: bios, rotulo: "Chip largo, arriba" }
        - { id: z80, hotspot: z80, rotulo: "Chip largo, en el centro" }
    tocar:
      bien: [proc0]
      porque:
        prob0: "El PRO-B0 lleva la paleta, los mandos y el buzón del sonido."
        lspc: "El LSPC-A0 elige los sprites."
        wram: "Es la RAM de usuario: contesta cuando la eligen."
        bios: "Es la BIOS: contesta cuando la eligen."
        z80: "Es el Z80, la CPU del sonido."
    exito: "El PRO-C0: decodifica A1–A4, A17–A23, /AS, /UDS, /LDS y R/W, y baja la selección que toca."
    escalera:
      - "Es uno de los tres chips de SNK."
    solucion: "El PRO-C0."

  - id: prediga-ram
    tipo: tocar
    titulo: "Escribir en $10FD80"
    texto: "El 68000 escribe en $10FD80. Toque lo que contesta."
    libro: ["neogeo#88", "neogeo#87", "neogeo#94", "neogeo#11"]
    widget:
      tipo: figura
      consola: { maquina: neogeo }
      zonas:
        - { id: proc0, hotspot: proc0, rotulo: "Chip cuadrado, abajo a la derecha" }
        - { id: prob0, hotspot: prob0, rotulo: "Chip cuadrado, abajo en el centro" }
        - { id: lspc, hotspot: lspc, rotulo: "Chip cuadrado, a la izquierda" }
        - { id: wram, hotspot: wram, rotulo: "Chips, arriba en el centro" }
        - { id: bios, hotspot: bios, rotulo: "Chip largo, arriba" }
        - { id: z80, hotspot: z80, rotulo: "Chip largo, en el centro" }
    tocar:
      bien: [wram]
      porque:
        proc0: "El PRO-C0 baja la selección; el dato lo guarda otro."
        prob0: "El PRO-B0 no guarda datos del programa."
        lspc: "El LSPC contesta en sus registros, no en $10FD80."
        bios: "La BIOS está en $C00000–$C1FFFF, y es una ROM: no se escribe."
        z80: "El Z80 tiene su propio mapa."
    exito: "La RAM de usuario, de 64 KB en $100000–$10FFFF: el PRO-C0 baja su /WE."
    escalera:
      - "La RAM de usuario empieza en $100000."
    solucion: "La RAM de usuario."

  - id: explore-mapa
    tipo: explorar
    titulo: "El mapa en cuatro cuartos"
    texto: "Los dos bits altos, A23 y A22, dicen en qué cuarto del mapa cae la dirección. Consiga que conteste la tarjeta de memoria."
    libro: ["neogeo#87", "neogeo#92", "neogeo#93", "neogeo#94", "cap29#76"]
    widget:
      tipo: logica
      entradas: [{ id: A23, rotulo: "A23" }, { id: A22, rotulo: "A22" }]
      piezas:
        - { id: dec, tipo: decodificador, bits: 2, entradas: [A22, A23] }
      salidas:
        - { id: PROG, de: dec.y0, rotulo: "ROM, RAM y puertos" }
        - { id: PAL, de: dec.y1, rotulo: "Paleta" }
        - { id: TARJ, de: dec.y2, rotulo: "Tarjeta" }
        - { id: BIOS, de: dec.y3, rotulo: "BIOS" }
    objetivo:
      condiciones:
        - { led: TARJ, valor: 1, rotulo: "Contesta la tarjeta" }
      logrado: "A23 = 1 y A22 = 0: $800000, la tarjeta de memoria."
      pistas:
        - { cuando: { led: BIOS, valor: 1 }, texto: "Con los dos a 1 contesta la BIOS: baje A22." }
        - { texto: "La tarjeta está en la mitad alta del mapa: A23 a 1." }
    escalera:
      - "$800000 tiene A23 = 1 y A22 = 0."
    solucion: "A23 = 1, A22 = 0."

  - id: tabla-mapa
    tipo: tabla
    titulo: "La tabla del mapa"
    texto: "Rellene cuándo quedan elegidas (1) la tarjeta de memoria y la BIOS."
    libro: ["neogeo#93", "neogeo#94", "cap29#76"]
    widget:
      tipo: logica
      entradas: [{ id: A23, rotulo: "A23" }, { id: A22, rotulo: "A22" }]
      piezas:
        - { id: dec, tipo: decodificador, bits: 2, entradas: [A22, A23] }
      salidas:
        - { id: TARJ, de: dec.y2, rotulo: "Tarjeta" }
        - { id: BIOS, de: dec.y3, rotulo: "BIOS" }
      ocultar: true
    tabla:
      salidas: [TARJ, BIOS]
    exito: "La tarjeta en $800000 y la BIOS en $C00000: los dos cuartos con A23 = 1."
    escalera:
      - "$800000 tiene A23 = 1 y A22 = 0."
      - "$C00000 tiene los dos a 1."
    solucion: "Tarjeta: solo en la fila A23 = 1, A22 = 0. BIOS: solo con los dos a 1."

  - id: empareje-direcciones
    tipo: pregunta
    fase: "Empareje"
    titulo: "Cada dirección, quien contesta"
    texto: "Empareje cada acceso del 68000 con quien contesta."
    libro: ["neogeo#87", "neogeo#88", "neogeo#90", "neogeo#94"]
    emparejar:
      - ["Leer $000100", "La ROM P del cartucho"]
      - ["Escribir $10FD80", "La RAM de usuario"]
      - ["Escribir $320000", "El buzón del Z80"]
      - ["Leer $C00402", "La BIOS"]
    exito: "El PRO-C0 baja una sola selección por zona."
    pistas:
      - { texto: "$320000 está en la zona de puertos; $C00402, en la de la BIOS." }
    escalera:
      - "Lo más bajo es el cartucho; lo más alto, la BIOS."
    solucion: "$000100: ROM P. $10FD80: RAM. $320000: buzón del Z80. $C00402: BIOS."

  - id: por-que-espejo
    tipo: leer
    titulo: "La misma RAM, dos direcciones"
    texto: "En la RAM de usuario solo se decodifican A1–A15: el resto de la zona son espejos. Escriba en hexadecimal la dirección de $100000–$10FFFF a la que llega $1FF000."
    libro: ["neogeo#89", "neogeo#11", "cap37#359"]
    widget:
      tipo: figura
      consola: { maquina: neogeo }
      zonas:
        - { id: wram, hotspot: wram, rotulo: "RAM de usuario" }
    leer:
      objetivo: "0x10F000"
      base: 16
      cifras: 24
      rotulo: "Dirección de la RAM"
    exito: "$10F000: los bits que distinguen las dos direcciones no se decodifican. Nadie copia nada."
    escalera:
      - "Conserve los 16 bits bajos y ponga delante el principio de la zona, $10."
    solucion: "$10F000."

  - id: prediga-vram
    tipo: leer
    titulo: "¿Dónde está la VRAM?"
    texto: "La VRAM no está en el mapa del 68000: la ve solo por los registros del LSPC, con la dirección en $3C0000. Escriba en hexadecimal el registro del dato."
    libro: ["neogeo#91"]
    widget:
      tipo: figura
      consola: { maquina: neogeo }
      zonas:
        - { id: lspc, hotspot: lspc, rotulo: "LSPC-A0" }
        - { id: svram, hotspot: svram, rotulo: "VRAM lenta" }
    leer:
      objetivo: "0x3C0002"
      base: 16
      cifras: 24
      rotulo: "Registro del dato"
      errores:
        - { expr: "3932160", texto: "$3C0000 es el registro de la dirección; el del dato es el siguiente." }
    exito: "$3C0002: la dirección de VRAM en $3C0000, el dato en $3C0002 y el autoincremento en $3C0004. Por palabras y sin esperas."
    escalera:
      - "Los registros son de 16 bits: van de dos en dos."
    solucion: "$3C0002."

  - id: prediga-sonido
    tipo: tocar
    titulo: "Pedir un sonido"
    texto: "Para pedir un efecto, el 68000 escribe un código en $320000; queda en un buzón de un byte y el Z80 recibe una NMI. Toque el chip del buzón."
    libro: ["neogeo#90", "neogeo#84", "neogeo#3", "neogeo#83"]
    widget:
      tipo: figura
      consola: { maquina: neogeo }
      zonas:
        - { id: proc0, hotspot: proc0, rotulo: "Chip cuadrado, abajo a la derecha" }
        - { id: prob0, hotspot: prob0, rotulo: "Chip cuadrado, abajo en el centro" }
        - { id: lspc, hotspot: lspc, rotulo: "Chip cuadrado, a la izquierda" }
        - { id: wram, hotspot: wram, rotulo: "Chips, arriba en el centro" }
        - { id: bios, hotspot: bios, rotulo: "Chip largo, arriba" }
        - { id: z80, hotspot: z80, rotulo: "Chip largo, en el centro" }
    tocar:
      bien: [prob0]
      porque:
        proc0: "El PRO-C0 decodifica la dirección, pero el buzón está en otro chip."
        lspc: "El LSPC es el vídeo."
        wram: "La RAM de usuario no la ve el Z80."
        bios: "La BIOS es una ROM."
        z80: "El Z80 lee el buzón, pero no lo tiene dentro."
    exito: "El PRO-B0: su latch guarda el código y dispara la NMI del Z80, que tiene su programa en la ROM M1 y habla con el YM2610 por sus puertos."
    escalera:
      - "Es el chip de SNK que también lee los mandos."
    solucion: "El PRO-B0."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: ["neogeo#7", "neogeo#89", "neogeo#91", "neogeo#90"]
    ideas:
      - { titulo: "El mapa.", texto: "Programa, RAM y puertos abajo; paleta, tarjeta y BIOS arriba." }
      - { titulo: "Espejos.", texto: "La RAM solo mira A1–A15." }
      - { titulo: "La VRAM, aparte.", texto: "El 68000 la ve solo por los registros del LSPC." }
      - { titulo: "Un buzón.", texto: "Un código en $320000 y una NMI para el Z80." }
