# «Consolas por dentro» · Neo Geo AES 1: la placa de un vistazo, sobre la foto del explorador (NEO-AES de 1990, la
# figura 38.22 del libro, Evan-Amos, dominio público): las dos CPU y el YM2610 de catálogo, los tres chips de vídeo a
# medida de SNK, las memorias y la placa auxiliar PL241S, cuya función no está confirmada. Fuentes: los datos de la
# consola (neogeo#n, scripts/consolas11.mjs) y la sección 38.14 del libro, que usa esta consola de caso.
leccion: consola-neogeo/neogeo-placa

libro:
  "neogeo#2": "CPU principal de 16/32 bits a 12 MHz (24 MHz ÷ 2)"
  "neogeo#3": "Z80 a 4 MHz (reloj 4M del LSPC) dedicado al sonido"
  "neogeo#4": "OPNB a 8 MHz: 4 canales FM, 3 SSG, 6 ADPCM-A y 1 ADPCM-B"
  "neogeo#5": "Controlador de sprites y de vídeo de 1.ª generación"
  "neogeo#6": "Chip a medida de 1.ª generación con tres funciones"
  "neogeo#7": "Decodifica las direcciones del 68000"
  "neogeo#10": "ROHM BR6116-100 (2 KB)"
  "neogeo#11": "64 KB de RAM de trabajo en $100000–$10FFFF, en dos chips de 32K × 8"
  "neogeo#12": "32K × 16: atributos de los sprites"
  "neogeo#13": "Es rápida porque el LSPC la recorre entera para elegir los 96 sprites de cada línea"
  "neogeo#14": "oculta en la foto"
  "neogeo#24": "Es probable que sea la placa de limpieza de vídeo (PLL de subportadora), pero sigue sin confirmar"
  "cap37#551": "Lo que no existía en el mercado era el sistema de vídeo, y por eso SNK lo integró en chips propios"
  "cap37#553": "380 objetos simultáneos, con hasta 96 por línea"
  "cap37#595": "Placa base de una Neo Geo AES"

modelo:
  valores: {}
  calculos: {}

tarjetas:
  - id: explore-chips
    tipo: explorar
    titulo: "Lo que se compraba"
    texto: "Toque el 68000, el Z80 y el YM2610: los tres son de catálogo."
    libro: ["neogeo#2", "neogeo#3", "neogeo#4", "cap37#595"]
    requiere: { mover: [m68k, z80, ym] }
    widget:
      tipo: figura
      consola: { maquina: neogeo }
      zonas:
        - { id: m68k, hotspot: 68k, rotulo: "CPU 68000", texto: "La CPU principal, a 12 MHz." }
        - { id: z80, hotspot: z80, rotulo: "Z80", texto: "La CPU del sonido, a 4 MHz." }
        - { id: ym, hotspot: ym2610, rotulo: "YM2610", texto: "FM, SSG y ADPCM." }

  - id: toque-cpu
    tipo: tocar
    titulo: "¿Cuál es la CPU principal?"
    texto: "Toque el procesador que ejecuta el juego a 12 MHz."
    libro: ["neogeo#2", "neogeo#3", "neogeo#4"]
    widget:
      tipo: figura
      consola: { maquina: neogeo }
      zonas:
        - { id: m68k, hotspot: 68k, rotulo: "Chip largo, arriba en el centro" }
        - { id: ym, hotspot: ym2610, rotulo: "Chip largo, arriba a la derecha" }
        - { id: z80, hotspot: z80, rotulo: "Chip largo, en el centro" }
    tocar:
      bien: [m68k]
      porque:
        ym: "Es el YM2610: el sintetizador de sonido."
        z80: "Es el Z80: un procesador, pero solo para el sonido, a 4 MHz."
    exito: "El Toshiba TMP68HC000N-12: un 68000 a 12 MHz."
    escalera:
      - "Lea las marcas: busque «68HC000»."
    solucion: "Arriba en el centro: Toshiba TMP68HC000N-12."

  - id: prediga-medida
    tipo: predecir
    titulo: "Lo que no se podía comprar"
    texto: "La CPU, la del sonido y el sintetizador se compraban. ¿Qué tuvo que hacer SNK a medida?"
    libro: ["cap37#551", "neogeo#5", "neogeo#6", "neogeo#7", "neogeo#10", "neogeo#11"]
    widget:
      tipo: figura
      consola: { maquina: neogeo }
      zonas:
        - { id: lspc, hotspot: lspc, rotulo: "LSPC-A0" }
        - { id: prob0, hotspot: prob0, rotulo: "PRO-B0" }
        - { id: proc0, hotspot: proc0, rotulo: "PRO-C0" }
    opciones:
      - texto: "El sistema de vídeo: el LSPC-A0, el PRO-B0 y el PRO-C0."
        bien: true
        porque: "El sistema de vídeo no existía en el mercado: SNK lo integró en chips propios."
      - texto: "La memoria RAM."
        porque: "Las RAM son de Sony y de ROHM, de catálogo. Lo que no existía era el sistema de vídeo."
      - texto: "El chip de sonido."
        porque: "El YM2610 es de Yamaha, de catálogo. Lo hecho a medida es el vídeo."
    escalera:
      - "Busque los chips que llevan «SNK CORP» en la foto."
    solucion: "El vídeo: LSPC-A0, PRO-B0 y PRO-C0, chips de SNK."

  - id: toque-lspc
    tipo: tocar
    titulo: "El que elige los sprites"
    texto: "Toque el chip que recorre la VRAM y elige los sprites de cada línea."
    libro: ["neogeo#5", "neogeo#6", "neogeo#7", "cap37#553"]
    widget:
      tipo: figura
      consola: { maquina: neogeo }
      zonas:
        - { id: lspc, hotspot: lspc, rotulo: "Chip cuadrado, a la izquierda" }
        - { id: prob0, hotspot: prob0, rotulo: "Chip cuadrado, abajo en el centro" }
        - { id: proc0, hotspot: proc0, rotulo: "Chip cuadrado, abajo a la derecha" }
    tocar:
      bien: [lspc]
      porque:
        prob0: "Es el PRO-B0: paleta, mandos y el buzón del sonido."
        proc0: "Es el PRO-C0: decodifica las direcciones del 68000."
    exito: "El LSPC-A0: hasta 96 sprites por línea."
    escalera:
      - "Lea las marcas: busque «LSPC»."
    solucion: "A la izquierda: SNK LSPC-A0."

  - id: empareje-chips
    tipo: pregunta
    fase: "Empareje"
    titulo: "Cada chip, su papel"
    texto: "Empareje cada chip de la placa con lo que hace."
    libro: ["neogeo#2", "neogeo#4", "neogeo#5", "neogeo#7"]
    emparejar:
      - ["68000", "Ejecuta el juego"]
      - ["YM2610", "FM y ADPCM"]
      - ["LSPC-A0", "Sprites y vídeo"]
      - ["PRO-C0", "Decodifica direcciones"]
    exito: "Tres chips de catálogo y tres de SNK."
    pistas:
      - { texto: "Los «PRO-» y el LSPC son de SNK." }
    escalera:
      - "Toque los chips en las tarjetas anteriores para leer sus fichas."
    solucion: "68000: el juego. YM2610: sonido. LSPC-A0: sprites. PRO-C0: direcciones."

  - id: explore-memorias
    tipo: explorar
    titulo: "Muchas memorias"
    texto: "Toque la RAM del 68000, las dos VRAM y la RAM del Z80."
    libro: ["neogeo#11", "neogeo#12", "neogeo#13", "neogeo#14"]
    requiere: { mover: [wram, svram, fvram, z80ram] }
    widget:
      tipo: figura
      consola: { maquina: neogeo }
      zonas:
        - { id: wram, hotspot: wram, rotulo: "RAM del 68000", texto: "64 KB de trabajo." }
        - { id: svram, hotspot: svram, rotulo: "VRAM lenta", texto: "32K × 16: atributos de los sprites." }
        - { id: fvram, hotspot: fvram, rotulo: "VRAM rápida", texto: "El LSPC la recorre entera en cada línea." }
        - { id: z80ram, hotspot: z80ram, rotulo: "RAM del Z80", texto: "2 KB para el sonido." }

  - id: por-que-rapida
    tipo: porque
    titulo: "Una VRAM rápida"
    texto: "¿Por qué una de las dos VRAM es de 35 ns, mucho más rápida que la otra?"
    libro: ["neogeo#13", "cap37#553"]
    widget:
      tipo: figura
      consola: { maquina: neogeo }
      zonas:
        - { id: fvram, hotspot: fvram, rotulo: "VRAM rápida" }
    opciones:
      - texto: "El LSPC la recorre entera en cada línea para elegir sus 96 sprites."
        bien: true
        porque: "Guarda posición, altura y reducción de cada sprite: hay que leerla toda antes de cada línea."
      - texto: "Guarda los gráficos de los sprites."
        porque: "Los gráficos están en las ROM C del cartucho. Esta VRAM guarda posiciones y tamaños."
      - texto: "La usa el 68000 para ir más deprisa."
        porque: "La recorre el LSPC; el 68000 solo la ve por los registros del LSPC."
    escalera:
      - "¿Cuántos sprites puede haber por línea?"
    solucion: "El LSPC la lee entera en cada línea para elegir hasta 96 sprites."

  - id: sorpresa-pl241s
    tipo: predecir
    titulo: "Una placa encima de la placa"
    texto: "A la derecha hay una placa pequeña, la PL241S, con contadores y un cristal. ¿Qué hace?"
    libro: ["neogeo#24"]
    widget:
      tipo: figura
      consola: { maquina: neogeo }
      zonas:
        - { id: pl241s, hotspot: pl241s, rotulo: "Placa PL241S" }
    opciones:
      - texto: "Probablemente engancha la subportadora de color, pero no está confirmado."
        bien: true
        porque: "Es la hipótesis del wiki de neogeodev, y el LSPC-A0 no tiene las patillas de ese PLL. Sin esquema, no se puede afirmar."
      - texto: "Es la CPU de una ampliación."
        porque: "Solo lleva contadores 74LS161, un cristal y un ajuste: no hay CPU."
      - texto: "Es la fuente de alimentación."
        porque: "No: contadores, un cristal y un ajuste apuntan a algo de reloj, no a la alimentación."
    escalera:
      - "Contadores, un cristal y un ajuste: ¿qué suele hacer eso?"
    solucion: "Probablemente el PLL de la subportadora de color; sin esquema, queda sin confirmar."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: ["neogeo#2", "cap37#551", "neogeo#5", "neogeo#24"]
    ideas:
      - { titulo: "De catálogo.", texto: "68000, Z80 y YM2610 se compraban." }
      - { titulo: "A medida.", texto: "El vídeo: LSPC-A0, PRO-B0 y PRO-C0." }
      - { titulo: "Memorias.", texto: "Una VRAM lenta, otra rápida y la RAM de cada CPU." }
      - { titulo: "Sin confirmar.", texto: "Lo que no tiene fuente se dice así." }
