# Lección 1.2 de la sección K.3 «volatile, const y el Modelo de Memoria» (apK). Formato: contenido/lecciones11/GUIA.md
# (§11). Figura K.1a (svg_vista 325,42 × 187,09): secciones en la Flash y en la RAM. La comprobación en simavr de
# ticks_lee() (46 valores imposibles de 20 000 sin ATOMIC_BLOCK) es la del bloque 35 (Complementos/codigo/apK/atomico).
# 1.2.1 («aprender haciendo», GUIA §13): las secciones y la falta de volatile se tocan; los bytes de la tabla se
# escriben; la lectura a medias es un objetivo lógico en pequeño (ticks de dos bits, uno por «byte», copiados por dos
# cerrojos: la copia con los dos bits a uno con ticks en 2); el orden de ATOMIC_BLOCK se toca en un listado desordenado que lo desarrolla
# (bloque 34). Quedan dos preguntas de opciones: __flash y el cálculo que se mueve.
leccion: apK/sec-K.3

libro:
  25: "las variables con valor inicial en .data, que ocupa RAM y cuyo valor inicial se copia desde la Flash antes de main()"
  26: "Una tabla de un seno de 256 valores de 16 bits son 512 bytes, la cuarta parte de los 2 KB del ATmega328P"
  28: "Es imprescindible en tres sitios"
  30: "No hace atómico el acceso."
  33: "ATOMIC_BLOCK(ATOMIC_RESTORESTATE)"
  34: "guarda SREG, deshabilita las interrupciones y, al salir del bloque, devuelve SREG como estaba"
  35: "20 000 lecturas directas dan 46 valores que nunca existieron, uno de cada 435"
  "apK#69": "en el AVR las constantes también se copian a la RAM salvo que se declaren en la Flash"

modelo:
  valores:
    n_tab: { sim: "n", nombre: "valores de la tabla", unidad: "", valor: 256 }
    b_val: { sim: "bytes", nombre: "bytes por valor", unidad: "B", valor: 2 }
    ram_avr: { sim: "RAM", nombre: "RAM del ATmega328P", unidad: "B", valor: 2048 }
  calculos:
    tab: { expr: "n_tab*b_val", sim: "tabla", nombre: "tamaño de la tabla", unidad: "B" }
    tab_mal: { expr: "n_tab", nombre: "un byte por valor", unidad: "B" }
    frac_ram: { expr: "tab/ram_avr", sim: "fracción", nombre: "fracción de la RAM", unidad: "", cifras: 2 }

tarjetas:
  - id: explore-secciones
    tipo: tocar
    titulo: "Dónde acaba cada cosa"
    texto: "El enlazador reparte el programa en secciones. Una variable global con valor inicial vive en .data, en la RAM: toque dónde está ese valor al encender."
    libro: [25, "apK#69"]
    widget:
      tipo: figura
      figura: fig-K.1
      zonas:
        - { id: text, rotulo: "Flash, arriba", rect: [9, 37, 62, 50] }
        - { id: rodata, rotulo: "Flash, en medio", rect: [9, 86, 62, 26] }
        - { id: valores, rotulo: "Flash, abajo", rect: [9, 112, 62, 26] }
        - { id: data, rotulo: "RAM, arriba", rect: [108, 30, 62, 26] }
        - { id: pila, rotulo: "RAM, abajo", rect: [108, 106, 62, 28] }
    tocar:
      bien: [valores]
      porque:
        text: "Ahí va el código, .text."
        rodata: "Ahí van las constantes, .rodata."
        data: "Ahí vivirá la variable, pero la RAM no guarda nada sin alimentación."
        pila: "La pila es para las locales, al final de la RAM."
    exito: "En la Flash, junto al código: se copia a la RAM antes de main(). Las variables sin valor inicial, en .bss, se ponen a cero."
    escalera: ["¿Qué memoria conserva los datos sin alimentación?"]
    solucion: "La Flash, abajo: los valores de .data."

  - id: toque-tabla-avr
    tipo: tocar
    titulo: "Una tabla const en el AVR"
    texto: "En el AVR declara const una tabla, sin __flash ni PROGMEM. Toque dónde la lee el programa al ejecutarse."
    libro: [25, "apK#69"]
    widget:
      tipo: figura
      figura: fig-K.1
      zonas:
        - { id: rodata, rotulo: "Flash, en medio", rect: [9, 86, 62, 26] }
        - { id: data, rotulo: "RAM, arriba", rect: [108, 30, 62, 26] }
        - { id: pila, rotulo: "RAM, abajo", rect: [108, 106, 62, 28] }
    tocar:
      bien: [data]
      porque:
        rodata: "Así es en un Cortex-M; en el AVR, Harvard, las lecturas de datos no llegan a la Flash."
        pila: "La pila es para las locales: una tabla global no va ahí."
    exito: "Se copia a la RAM con .data: ocupa RAM aunque sea constante."
    escalera: ["El AVR es Harvard: ¿llegan sus instrucciones de datos a la Flash?"]
    solucion: "En la RAM, con .data."

  - id: estime-seno
    tipo: leer
    titulo: "Una tabla de seno"
    texto: "Una tabla const de un seno de 256 valores de 16 bits, copiada a la RAM del ATmega328P. Calcule cuántos bytes de RAM se come."
    libro: [26]
    widget:
      tipo: figura
      figura: fig-K.1
      zonas:
        - { id: data, rotulo: "RAM, arriba", rect: [108, 30, 62, 26] }
    leer:
      objetivo: tab
      unidad: B
      tol: 0.01
      rotulo: "Tamaño de la tabla"
      errores:
        - { expr: "tab_mal", texto: "Cada valor de 16 bits ocupa 2 bytes." }
    exito: "512 bytes: la cuarta parte de los 2 KB de RAM, por una tabla que nunca cambia."
    escalera: ["256 valores de 2 bytes."]
    solucion: "256 × 2 = 512 bytes."
    comprobar:
      - { tab: 512, frac_ram: 0.25, ram_avr: 2048, b_val: 2 }

  - id: pregunta-flash
    tipo: pregunta
    titulo: "Dejarla en la Flash"
    texto: "Declara la tabla en el espacio __flash del avr-gcc. ¿Qué cambia al leerla?"
    libro: [26]
    widget:
      tipo: figura
      figura: fig-K.1
      zonas:
        - { id: rodata, rotulo: "Flash, en medio", rect: [9, 86, 62, 26], texto: "Lo declarado __flash se queda aquí." }
    opciones:
      - { texto: "Se lee con lpm, un ciclo más lenta que de la RAM", bien: true, porque: "A cambio no ocupa RAM: es la memoria de programa de la sección 39.16." }
      - { texto: "Nada: se lee igual", porque: "La Flash del AVR se lee con lpm, una instrucción aparte." }
      - { texto: "Ya no se puede leer", porque: "Se lee, con pgm_read_word() o directamente con __flash." }
    escalera: ["¿Qué instrucción lee la memoria de programa?"]
    solucion: "lpm: un ciclo más que de la RAM, sin gastar RAM."

  - id: pregunta-donde-volatile
    tipo: tocar
    titulo: "Dónde hace falta volatile"
    texto: "volatile es imprescindible en los registros, en las variables que cambia una interrupción y en las que consulta un bucle de espera. Toque la declaración a la que le falta."
    libro: [28]
    widget:
      tipo: figura
      codigo:
        lenguaje: c
        texto: |
          static uint16_t ticks;       /* written by the ISR */
          const uint8_t tabla[4];      /* never written      */
          uint16_t copia;              /* local of a function */
      zonas:
        - { id: l1, lineas: [1], rotulo: "Primera línea" }
        - { id: l2, lineas: [2], rotulo: "Segunda línea" }
        - { id: l3, lineas: [3], rotulo: "Tercera línea" }
    tocar:
      bien: [l1]
      porque:
        l2: "Nadie la cambia: es constante."
        l3: "Solo la usa su función: el compilador lo ve todo."
    exito: "ticks la cambia una interrupción que el compilador no ve: sin volatile, puede leerla una sola vez y no enterarse nunca."
    escalera: ["¿Cuál cambia fuera de lo que ve el compilador?"]
    solucion: "La primera: ticks."

  - id: prediga-atomico
    tipo: explorar
    titulo: "volatile no basta"
    texto: "Leer ticks son dos instrucciones, un byte y luego el otro; en pequeño, ticks tiene dos bits, uno por byte. Consiga una copia con los dos a uno mientras ticks pasa de 1 a 2."
    libro: [30, 35]
    widget:
      tipo: logica
      entradas: [{ id: CLK, reloj: true, rotulo: "Interrupción: ticks++" }, { id: EB, rotulo: "Copiar el bajo" }, { id: EA, rotulo: "Copiar el alto" }]
      piezas:
        - { id: c1, tipo: contador, bits: 2, entradas: [CLK], rotulo: "ticks" }
        - { id: lb, tipo: latch, entradas: [c1.q0, EB], rotulo: "Copia del bajo" }
        - { id: la, tipo: latch, entradas: [c1.q1, EA], rotulo: "Copia del alto" }
      salidas:
        - { id: T1, de: c1.q1, rotulo: "ticks, alto" }
        - { id: T0, de: c1.q0, rotulo: "ticks, bajo" }
        - { id: A, de: la.q, rotulo: "Copia, alto" }
        - { id: B, de: lb.q, rotulo: "Copia, bajo" }
    objetivo:
      condiciones:
        - { contador: c1, valor: 2, rotulo: "ticks vale 2" }
        - { led: A, valor: 1, rotulo: "Copia, alto a uno" }
        - { led: B, valor: 1, rotulo: "Copia, bajo a uno" }
      logrado: "El bajo copiado antes de pasar de 1 a 0 y el alto después: un valor que nunca existió. volatile no hace atómico el acceso."
      pistas:
        - { cuando: { contador: c1, valor: 0 }, texto: "Primero, una interrupción: ticks a 1." }
        - { texto: "Copie el bajo con ticks en 1, ciérrelo, deje pasar otra interrupción y copie el alto." }
    escalera: ["Con ticks en 1, copie el bajo; con ticks en 2, el alto."]
    solucion: "Pulso, copiar el bajo, otro pulso, copiar el alto: la copia tiene los dos a uno y ticks vale 2. De 20 000 lecturas directas, 46 son así."

  - id: ordene-atomic
    tipo: tocar
    titulo: "ATOMIC_BLOCK por dentro"
    texto: "Así desarrolla ATOMIC_BLOCK(ATOMIC_RESTORESTATE) la copia de ticks, con las líneas desordenadas. Tóquelas en el orden en que se ejecutan."
    libro: [33, 34]
    widget:
      tipo: figura
      codigo:
        lenguaje: c
        texto: |
          SREG = sreg;           /* restore it as it was */
          copia = ticks;         /* two bytes, one copy  */
          uint8_t sreg = SREG;   /* save the I flag      */
          cli();                 /* disable interrupts   */
      zonas:
        - { id: l1, lineas: [1], rotulo: "Primera línea" }
        - { id: l2, lineas: [2], rotulo: "Segunda línea" }
        - { id: l3, lineas: [3], rotulo: "Tercera línea" }
        - { id: l4, lineas: [4], rotulo: "Cuarta línea" }
    tocar:
      bien: [l3, l4, l2, l1]
      orden: true
    exito: "Guardar SREG, deshabilitar, copiar y devolver SREG como estaba: no habilita las interrupciones si ya estaban deshabilitadas."
    escalera: ["Antes de tocar las interrupciones, se apunta cómo estaban."]
    solucion: "Guardar SREG, cli(), copiar y restaurar SREG."

  - id: porque-orden
    tipo: porque
    titulo: "Un ciclo imposible"
    texto: "PORTB = 1; cinematica_inversa(…); PORTB = 0; y el pin mide un ciclo. ¿Por qué?"
    libro: [30]
    widget:
      tipo: figura
      figura: fig-K.1
      zonas:
        - { id: text, rotulo: "Flash, arriba", rect: [9, 37, 62, 50], texto: "El código, en el orden que elige el compilador." }
    opciones:
      - { texto: "El compilador movió el cálculo después de la segunda escritura", bien: true, porque: "volatile no ordena los accesos que no lo son. Se arregla guardando el resultado en una variable volatile antes de bajar el pin." }
      - { texto: "Porque la cinemática es muy rápida", porque: "No tarda un ciclo: es que se ejecuta fuera del pulso." }
      - { texto: "Porque PORTB no es volatile", porque: "Lo es: por eso las dos escrituras quedan; lo que se mueve es el cálculo." }
    escalera: ["¿Obliga volatile a mantener en su sitio un cálculo cuyo resultado no se usa entre las escrituras?"]
    solucion: "El cálculo se movió tras la segunda escritura: volatile no ordena lo que no es volatile."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [25, 26, 28, 30]
    ideas:
      - { titulo: "Secciones.", texto: "Código en .text; lo inicializado, en .data, copiado desde la Flash." }
      - { titulo: "AVR y const.", texto: "Las constantes van a la RAM salvo con __flash: lpm, un ciclo más." }
      - { titulo: "volatile.", texto: "Cada acceso se hace de verdad, pero no es atómico ni ordena lo demás." }
      - { titulo: "ATOMIC_BLOCK.", texto: "Guarda SREG, deshabilita, copia y restaura." }
