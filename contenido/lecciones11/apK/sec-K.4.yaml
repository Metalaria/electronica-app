# Lección 1.2 de la sección K.4 «Máquinas de Estados y Búferes Circulares» (apK). Formato: contenido/lecciones11/GUIA.md
# (§5.2, §11). La máquina es la del referenciado del brazo (bloque 39) y el búfer el del bloque 43, los dos probados en
# Complementos/codigo/apK (estados, bufer). El número de datos guardados es (uint8_t)(cabeza − cola): la gráfica lo
# dibuja frente a la cabeza con la cola fija, con la vuelta de 255 a 0; figura K.1b (cola 254, cabeza 3: 5 datos) y
# ejercicio K.5 (cabeza 3, cola 250: 9 datos).
# 1.2.1 («aprender haciendo», GUIA §13): los 5 datos de la figura K.1b son un objetivo (la cabeza da la vuelta); los 9
# del ejercicio se escriben; las fases se tocan en orden en el enum, desordenado; la línea del tiempo máximo y la que
# publica el dato se tocan en el código. Quedan dos preguntas de opciones: la potencia de dos y comparar restando.
leccion: apK/sec-K.4

libro:
  38: "un enum con los estados y un switch que, en cada uno, decide la salida y cuándo cambiar"
  39: "fast to the switch, back off"
  40: "Los tiempos se comparan restando, ahora - r->inicio, que funciona aunque el contador de milisegundos se desborde"
  42: "la cabeza, donde escribe el que produce los datos"
  43: "static volatile uint8_t cabeza;"
  44: "cabeza - cola es siempre el número de datos guardados, incluso cuando el contador ha dado la vuelta"
  45: "24 263 bytes llegan en orden y sin errores"
  "apK#69": "la cabeza va 5 posiciones por delante de la cola"
  "apK#70": "(uint8_t)(3 − 250) = 9 datos"

modelo:
  valores:
    cab: { sim: "cabeza", nombre: "índice de la cabeza", unidad: "", valor: 3 }
    col: { sim: "cola", nombre: "índice de la cola", unidad: "", valor: 254 }
  calculos:
    n_dat: { expr: "cab - col - 256*floor((cab - col)/256)", sim: "datos", nombre: "datos guardados", unidad: "" }

tarjetas:
  - id: explore-bufer
    tipo: explorar
    titulo: "Cabeza menos cola"
    texto: "La cabeza escribe y la cola lee, con índices de 8 bits que cuentan libremente de 0 a 255. Con la cola en 254, mueva la cabeza hasta que el búfer guarde 5 datos."
    libro: [42, 44, "apK#69"]
    fijar: { col: 254 }
    inicio: { cab: 254 }
    widget:
      tipo: grafica
      x: { id: hh, min: 0, max: 255, unidad: "", rotulo: "cabeza" }
      y: { min: 0, max: 260, unidad: "", rotulo: "datos guardados" }
      curvas:
        - { expr: "hh - col - 256*floor((hh - col)/256)", color: azul, rotulo: "cabeza − cola" }
      marcas:
        - { x: "cab", y: "n_dat", rotulo: "{{n_dat}}" }
      lectura: { valor: n_dat, rotulo: "Datos guardados" }
      mandos:
        - { valor: cab, min: 0, max: 255, paso: 1, rotulo: "Cabeza" }
    objetivo:
      condiciones:
        - { valor: n_dat, objetivo: 5, tol: 0.01, rotulo: "Datos: {{n_dat}}" }
      logrado: "La cabeza en {{cab}}: ha pasado de 255 a 0, y (uint8_t)(cabeza − cola) sigue contando {{n_dat}} datos."
      pistas:
        - { cuando: { valor: n_dat, mayor: 5 }, texto: "Demasiados: la cabeza va solo 5 posiciones por delante de la cola." }
        - { texto: "Faltan: avance la cabeza; al pasar de 255 vuelve a 0." }
    escalera: ["254, 255, 0, 1, 2: la quinta posición tras la cola es la 3."]
    solucion: "Cabeza en 3: 5 datos."
    comprobar:
      - { con: { cab: 3, col: 254 }, n_dat: 5 }

  - id: estime-datos
    tipo: leer
    titulo: "Un búfer que ha dado la vuelta"
    texto: "Índices uint8_t que cuentan libremente: la cabeza está en 3 y la cola en 250. Calcule cuántos datos guarda."
    libro: ["apK#70"]
    fijar: { cab: 3, col: 250 }
    widget:
      tipo: grafica
      x: { id: hh, min: 0, max: 255, unidad: "", rotulo: "cabeza" }
      y: { min: 0, max: 260, unidad: "", rotulo: "datos guardados" }
      curvas:
        - { expr: "hh - col - 256*floor((hh - col)/256)", color: azul, rotulo: "cabeza − cola" }
      mandos: []
    leer:
      objetivo: n_dat
      unidad: ""
      tol: 0.01
      rotulo: "Datos guardados"
      errores:
        - { expr: "col - cab", texto: "Ha restado al revés: son cabeza menos cola, y en uint8_t la resta da la vuelta." }
    exito: "9 datos: la resta en uint8_t da la vuelta igual que los índices."
    escalera: ["(uint8_t)(3 − 250): sume 256 a la resta."]
    solucion: "(uint8_t)(3 − 250) = 9 datos."
    comprobar:
      - { n_dat: 9 }
      - { con: { col: 254 }, n_dat: 5 }

  - id: porque-potencia
    tipo: porque
    titulo: "Potencia de dos"
    texto: "¿Por qué el búfer debe medir una potencia de dos que divida a 256, y no, por ejemplo, 48 bytes?"
    libro: [44, "apK#70"]
    widget:
      tipo: figura
      figura: fig-K.1
      zonas:
        - { id: bufer, rotulo: "Anillo de la derecha", rect: [195, 30, 120, 135], texto: "La posición es el índice enmascarado." }
    opciones:
      - { texto: "Para que el índice enmascarado siga la vuelta de 255 a 0 sin saltos", bien: true, porque: "Con 48, al pasar el índice de 255 a 0 la posición saltaría; con 64, siguen siendo vecinas, y lleno y vacío no se confunden." }
      - { texto: "Porque el compilador no admite otros tamaños", porque: "Los admite: el #error lo pone el propio código para evitar el fallo." }
      - { texto: "Para ahorrar memoria", porque: "No ahorra nada: es para que la cuenta libre de los índices funcione." }
    escalera: ["El índice cuenta hasta 255 y vuelve a 0; la posición es el índice enmascarado."]
    solucion: "La vuelta del índice debe coincidir con una vuelta del búfer: tamaño potencia de dos que divida a 256."

  - id: ordene-referenciado
    tipo: tocar
    titulo: "Referenciar la base del brazo"
    texto: "Un enum con los estados y un switch: buscar el final de carrera deprisa, retroceder un poco y buscarlo despacio. Toque los estados en el orden en que los recorre si todo va bien."
    libro: [38, 39]
    widget:
      tipo: figura
      codigo:
        lenguaje: c
        texto: |
          typedef enum {
              BUSCA_LENTO,
              HECHO,
              BUSCA_RAPIDO,
              RETROCEDE,
              FALLO
          } fase_t;
      zonas:
        - { id: lento, lineas: [2], rotulo: "Segunda línea" }
        - { id: hecho, lineas: [3], rotulo: "Tercera línea" }
        - { id: rapido, lineas: [4], rotulo: "Cuarta línea" }
        - { id: retrocede, lineas: [5], rotulo: "Quinta línea" }
        - { id: fallo, lineas: [6], rotulo: "Sexta línea" }
    tocar:
      bien: [rapido, retrocede, lento, hecho]
      orden: true
      porque:
        fallo: "FALLO solo se alcanza si un estado se pasa de su tiempo máximo: cuando todo va bien, no se pasa por él."
    exito: "Deprisa, atrás, despacio y hecho. La función se llama cada milisegundo y nunca espera; FALLO queda para cuando algo se pasa de tiempo."
    escalera: ["Para buscar despacio, antes hay que separarse del final de carrera."]
    solucion: "BUSCA_RAPIDO, RETROCEDE, BUSCA_LENTO y HECHO."

  - id: prediga-fallo
    tipo: tocar
    titulo: "Un final de carrera roto"
    texto: "En BUSCA_RAPIDO, el final de carrera no llega nunca porque está roto. Toque la línea que impide que el motor gire para siempre."
    libro: [39, 40]
    widget:
      tipo: figura
      codigo:
        lenguaje: c
        texto: |
          int16_t referencia(referencia_t *r, bool final_carrera,
                             uint32_t ahora)
          {
              switch (r->fase) {
              case BUSCA_RAPIDO:
                  if (final_carrera) { r->fase = RETROCEDE; r->inicio = ahora; }
                  else if (ahora - r->inicio > 15000u) r->fase = FALLO;
                  else return -800;
                  return 0;
      zonas:
        - { id: l6, lineas: [6], rotulo: "Sexta línea" }
        - { id: l7, lineas: [7], rotulo: "Séptima línea" }
        - { id: l8, lineas: [8], rotulo: "Octava línea" }
        - { id: l9, lineas: [9], rotulo: "Novena línea" }
    tocar:
      bien: [l7]
      porque:
        l6: "Esa solo actúa si el final de carrera llega, y está roto."
        l8: "Esa pide seguir girando: es la que no debe repetirse para siempre."
        l9: "Devuelve velocidad 0, pero solo tras cambiar de fase."
    exito: "Cada estado tiene un tiempo máximo: pasado, va a FALLO y devuelve velocidad 0."
    escalera: ["¿Qué comprueba BUSCA_RAPIDO además del final de carrera?"]
    solucion: "La séptima: el tiempo máximo, que lleva a FALLO."

  - id: pregunta-restar
    tipo: pregunta
    titulo: "Comparar tiempos"
    texto: "¿Por qué la máquina compara ahora - r->inicio con el intervalo, y no ahora con inicio + intervalo?"
    libro: [40]
    widget:
      tipo: figura
      figura: fig-K.1
      zonas:
        - { id: bufer, rotulo: "Anillo de la derecha", rect: [195, 30, 120, 135], texto: "Un contador sin signo da la vuelta, como estos índices." }
    opciones:
      - { texto: "Restando funciona aunque el contador de milisegundos se desborde", bien: true, porque: "La resta sin signo da la vuelta igual que el contador: el intervalo sale bien." }
      - { texto: "Es más rápido de calcular", porque: "Cuestan lo mismo: la diferencia está en el desbordamiento." }
      - { texto: "Da igual una que otra", porque: "inicio + intervalo puede desbordarse y hacer la comparación cierta antes de tiempo." }
    escalera: ["¿Qué pasa cuando el contador pasa de su máximo a cero?"]
    solucion: "La resta funciona a través del desbordamiento; la suma, no."

  - id: porque-sin-seccion
    tipo: tocar
    titulo: "Sin sección crítica"
    texto: "La interrupción mete bytes y el bucle los saca sin deshabilitar interrupciones. Toque la línea que, puesta antes, dejaría leer un dato aún no escrito."
    libro: [43, 44, 45]
    widget:
      tipo: figura
      codigo:
        lenguaje: c
        texto: |
          bool bufer_pon(uint8_t x)
          {
              uint8_t c = cabeza;
              if ((uint8_t)(c - cola) == TAM) return false;
              datos[c & (TAM - 1u)] = x;
              cabeza = (uint8_t)(c + 1u);
              return true;
          }
      zonas:
        - { id: l3, lineas: [3], rotulo: "Tercera línea" }
        - { id: l4, lineas: [4], rotulo: "Cuarta línea" }
        - { id: l5, lineas: [5], rotulo: "Quinta línea" }
        - { id: l6, lineas: [6], rotulo: "Sexta línea" }
    tocar:
      bien: [l6]
      porque:
        l3: "Lee la cabeza, que solo escribe este lado."
        l4: "Comprueba si está lleno; no publica nada."
        l5: "Es la escritura del dato: lo que debe ir antes."
    exito: "Publicar la cabeza después de escribir: un escritor por índice, de un byte. En simavr, 24 263 bytes llegan en orden y sin errores."
    escalera: ["¿Qué línea le dice al consumidor que hay un dato nuevo?"]
    solucion: "La sexta: cabeza = c + 1, después del dato."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [38, 40, 44]
    ideas:
      - { titulo: "Máquina de estados.", texto: "Un enum y un switch, que no espera y no toca el hardware." }
      - { titulo: "Tiempos.", texto: "Cada estado con su máximo; se compara restando." }
      - { titulo: "Búfer circular.", texto: "Índices que cuentan libremente: cabeza − cola son los datos." }
      - { titulo: "Sin cerrojos.", texto: "Un productor, un consumidor y un escritor por índice." }
