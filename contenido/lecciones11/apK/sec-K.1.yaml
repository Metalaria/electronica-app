# Lección 1.2 de la sección K.1 «Tipos Enteros y Operadores de Bits» (apK). Formato: contenido/lecciones11/GUIA.md
# (§11.6). Las operaciones sobre un bit (bloque 9) se ven como puertas: un bit del registro (R) y el mismo bit de la
# máscara (M). El ejemplo del campo es el del libro: los bits 6 a 4 de 0xB5 (181) valen 3. Código comprobado en
# Complementos/codigo/apK/bits.
# 1.2.1 («aprender haciendo», GUIA §13): las tres operaciones son un objetivo (OR y AND a uno, XOR a cero); el mayor
# int del AVR, el campo leído y el registro escrito se escriben en hexadecimal o en binario; el tipo del registro se
# toca en un listado. Quedan dos preguntas de opciones: la constante del bit 15 y la comprobación de ancho.
leccion: apK/sec-K.1

libro:
  3: "un int tiene al menos 16 bits y un long, al menos 32"
  4: "Tamaño de los tipos en bytes"
  5: "En el AVR un int tiene 16 bits: va de −32 768 a 32 767"
  6: "uint8_t, int16_t, uint32_t"
  7: "1u << 15 vale 32 768 y 1ul << 20, 1 048 576"
  9: "reg |= 1u << n, reg &= ~(1u << n), reg ^= 1u << n y if (reg & (1u << n))"
  10: "static inline uint32_t campo_lee(uint32_t reg, unsigned pos, unsigned ancho)"
  11: "campo_lee(0xB5, 4, 3) vale 3, y escribir 6 (110) en ese campo da 0xE5"
  12: "sirven para guardar banderas en la memoria propia, no para describir un registro o una trama"

modelo:
  valores:
    reg_b: { sim: "reg", nombre: "valor del registro", unidad: "", valor: 181 }
    pos: { sim: "pos", nombre: "bit de comienzo del campo", unidad: "", valor: 4 }
  calculos:
    int_max: { expr: "2^15 - 1", nombre: "mayor int del AVR", unidad: "" }
    uint_max: { expr: "2^16 - 1", nombre: "mayor unsigned int del AVR", unidad: "" }
    campo: { expr: "floor(reg_b/2^pos) - 8*floor(reg_b/2^(pos + 3))", sim: "campo", nombre: "campo de 3 bits", unidad: "" }

tarjetas:
  - id: explore-bits
    tipo: explorar
    titulo: "Bits con máscaras"
    texto: "Un bit del registro y el mismo bit de la máscara 1u << n: poner es una OR, invertir una XOR y probar una AND. Consiga que poner y probar den uno e invertir, cero."
    libro: [9]
    widget:
      tipo: logica
      entradas: [{ id: R, rotulo: "Bit del registro" }, { id: M, rotulo: "Bit de la máscara" }]
      piezas:
        - { id: o1, tipo: or, entradas: [R, M] }
        - { id: x1, tipo: xor, entradas: [R, M] }
        - { id: a1, tipo: and, entradas: [R, M] }
      salidas:
        - { id: S, de: o1, rotulo: "reg |= m" }
        - { id: T, de: x1, rotulo: "reg ^= m" }
        - { id: P, de: a1, rotulo: "reg & m" }
      tabla: true
    objetivo:
      condiciones:
        - { led: S, valor: 1, rotulo: "Poner da uno" }
        - { led: T, valor: 0, rotulo: "Invertir da cero" }
        - { led: P, valor: 1, rotulo: "Probar da uno" }
      logrado: "Bit a uno y máscara a uno: la OR lo deja en uno, la XOR lo invierte a cero y la AND dice que estaba puesto."
      pistas:
        - { cuando: { senal: M, valor: 0 }, texto: "Sin máscara, ninguna operación toca el bit: ponga M a uno." }
        - { texto: "La AND solo da uno si el bit del registro también lo es." }
    escalera: ["R y M a uno."]
    solucion: "R = 1 y M = 1."

  - id: disene-borrar
    tipo: diseno
    titulo: "Borrar un bit"
    texto: "Construya reg &= ~(1u << n) para un bit: la salida es R con M = 0 y 0 con M = 1. Use las menos puertas posibles."
    libro: [9]
    widget:
      tipo: logica
      entradas: [{ id: R, rotulo: "Bit del registro" }, { id: M, rotulo: "Bit de la máscara" }]
      piezas: []
      salidas:
        - { id: C, de: "0", rotulo: "reg &= ~m" }
    diseno:
      salida: C
      permitidas: [and, or, not]
      referencia:
        - { tipo: not, entradas: [M] }
        - { tipo: and, entradas: [R, p1] }
      exigir_minimo: true
    exito: "Una NOT para la máscara y una AND: es lo que hace ~ y luego &=."
    escalera: ["Primero invierta la máscara, como hace ~."]
    solucion: "p1 = NOT(M) y C = AND(R, p1)."

  - id: prediga-int
    tipo: leer
    titulo: "Un programa del PC en el Arduino"
    texto: "El C solo garantiza que un int tenga al menos 16 bits, y en el AVR tiene justo esos, con signo. Escriba en hexadecimal el mayor int del AVR."
    libro: [3, 4, 5]
    widget:
      tipo: figura
      codigo:
        lenguaje: c
        texto: |
          #include <stdint.h>

          int16_t  a;   /* what an int is in the AVR: 16 bits, signed */
          uint16_t b;   /* 16 bits, unsigned */
          int32_t  c;   /* what an int is in a Cortex-M or a PC */
      resaltar: [3]
    leer:
      objetivo: int_max
      base: 16
      cifras: 16
      rotulo: "Mayor int del AVR"
      errores:
        - { expr: "uint_max", texto: "Ese es el mayor sin signo: el int lleva el bit de más peso para el signo." }
    exito: "0x7FFF, 32 767: un contador que en el PC llega a cien mil se desborda en el Arduino. Además, allí un double es un float de 32 bits."
    escalera: ["Quince unos detrás del bit de signo, que queda a cero."]
    solucion: "0x7FFF = 32 767."
    comprobar:
      - { int_max: 32767, uint_max: 65535 }

  - id: pregunta-stdint
    tipo: tocar
    titulo: "El tipo de un registro"
    texto: "Un registro de un periférico tiene 32 bits. Toque la declaración que le da ese tamaño en cualquier procesador."
    libro: [4, 6]
    widget:
      tipo: figura
      codigo:
        lenguaje: c
        texto: |
          unsigned int r1;
          long         r2;
          uint32_t     r3;
          uint8_t      r4;
      zonas:
        - { id: l1, lineas: [1], rotulo: "Primera línea" }
        - { id: l2, lineas: [2], rotulo: "Segunda línea" }
        - { id: l3, lineas: [3], rotulo: "Tercera línea" }
        - { id: l4, lineas: [4], rotulo: "Cuarta línea" }
    tocar:
      bien: [l3]
      porque:
        l1: "En el AVR serían 16 bits: el tamaño no está garantizado."
        l2: "En el PC son 8 bytes, y además lleva signo."
        l4: "Dice su tamaño, pero son 8 bits."
    exito: "uint32_t: los tipos de stdint.h dicen su tamaño en el nombre. Se usan siempre que el tamaño importe."
    escalera: ["¿Qué tipo lleva el tamaño en el nombre?"]
    solucion: "La tercera: uint32_t."

  - id: pregunta-constantes
    tipo: pregunta
    titulo: "Las constantes tienen tipo"
    texto: "En el AVR, ¿cuál de estas máscaras es correcta para el bit 15?"
    libro: [7]
    widget:
      tipo: logica
      entradas: [{ id: R, rotulo: "Bit del registro" }, { id: M, rotulo: "Bit de la máscara" }]
      piezas:
        - { id: a1, tipo: and, entradas: [R, M] }
      salidas:
        - { id: P, de: a1, rotulo: "reg & m" }
    opciones:
      - { texto: "1u << 15", bien: true, porque: "Sin signo cabe: vale 32 768. Las máscaras se escriben sin signo, y con ul si pasan del bit 15." }
      - { texto: "1 << 15", porque: "1 es un int de 16 bits con signo: 1 << 15 no cabe, y su comportamiento es indefinido." }
      - { texto: "Las dos valen igual", porque: "1 << 15 es indefinido en un int de 16 bits; 1u << 15, no." }
    escalera: ["¿Qué tipo tiene la constante 1 en el AVR?"]
    solucion: "1u << 15: 32 768."

  - id: estime-campo
    tipo: leer
    titulo: "Leer un campo"
    texto: "0xB5 es 1011 0101 en binario. Escriba en binario campo_lee(0xB5, 4, 3), los bits 6 a 4."
    libro: [10, 11]
    widget:
      tipo: figura
      codigo:
        lenguaje: c
        texto: |
          /* Field of 'ancho' bits starting at bit 'pos' of a 32-bit register. */
          static inline uint32_t campo_lee(uint32_t reg, unsigned pos,
                                           unsigned ancho)
          {
              uint32_t mascara = (ancho < 32u)
                                 ? ((1ul << ancho) - 1u) : 0xFFFFFFFFul;
              return (reg >> pos) & mascara;
          }
      resaltar: [6, 7, 8]
    leer:
      objetivo: campo
      base: 2
      cifras: 3
      rotulo: "Valor del campo"
    exito: "011, que vale 3: desplazar 4 bits a la derecha y enmascarar los tres bits bajos."
    escalera: ["Cuente desde la derecha: el bit 0 es el último."]
    solucion: "Los bits 6 a 4 son 011, que vale 3."
    comprobar:
      - { campo: 3, reg_b: 181, pos: 4 }

  - id: pregunta-escribir
    tipo: leer
    titulo: "Escribir un campo"
    texto: "Escribe 6 (110) en los bits 6 a 4 de 0xB5, borrando antes el campo. Escriba en hexadecimal lo que queda."
    libro: [11]
    widget:
      tipo: figura
      codigo:
        lenguaje: c
        texto: |
          static inline uint32_t campo_escribe(uint32_t reg, unsigned pos,
                                               unsigned ancho, uint32_t valor)
          {
              uint32_t mascara = (ancho < 32u)
                                 ? ((1ul << ancho) - 1u) : 0xFFFFFFFFul;
              return (reg & ~(mascara << pos))
                     | ((valor & mascara) << pos);
          }
      resaltar: [6, 7]
    leer:
      objetivo: "0xE5"
      base: 16
      cifras: 8
      rotulo: "Registro tras escribir"
      errores:
        - { expr: "245", texto: "Ha hecho la OR sin borrar antes el campo: el 011 y el 110 se mezclan." }
        - { expr: "101", texto: "Se ha perdido el bit de más a la izquierda, que no es del campo y no debe cambiar." }
    exito: "0xE5: el campo pasa de 011 a 110 y el resto no cambia."
    escalera: ["Borre los bits 6 a 4 de 1011 0101 y meta 110."]
    solucion: "0xE5: el campo pasa de 011 a 110."

  - id: porque-ancho
    tipo: porque
    titulo: "La comprobación de ancho"
    texto: "campo_lee comprueba ancho < 32 antes de calcular 1ul << ancho. ¿Por qué no es un adorno?"
    libro: [10, 11]
    widget:
      tipo: figura
      codigo:
        lenguaje: c
        texto: |
          /* Field of 'ancho' bits starting at bit 'pos' of a 32-bit register. */
          static inline uint32_t campo_lee(uint32_t reg, unsigned pos,
                                           unsigned ancho)
          {
              uint32_t mascara = (ancho < 32u)
                                 ? ((1ul << ancho) - 1u) : 0xFFFFFFFFul;
              return (reg >> pos) & mascara;
          }
      resaltar: [6, 7]
    opciones:
      - { texto: "Desplazar tantos bits como tiene el tipo es comportamiento indefinido", bien: true, porque: "Cada procesador da una cosa: en un PC lo deja como estaba y en un ARM da cero." }
      - { texto: "Porque un campo de 32 bits no existe", porque: "Puede existir: es el registro entero, y para él la máscara se escribe aparte." }
      - { texto: "Para que sea más rápido", porque: "No es velocidad: sin ella, el resultado depende del procesador." }
    escalera: ["¿Qué dice el estándar de desplazar 32 bits un valor de 32 bits?"]
    solucion: "Es comportamiento indefinido: un PC y un ARM dan cosas distintas."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [5, 6, 7, 9, 12]
    ideas:
      - { titulo: "Tamaños.", texto: "En el AVR, int de 16 bits y double de 32: use los tipos de stdint.h." }
      - { titulo: "Constantes.", texto: "Máscaras sin signo, y con ul si pasan del bit 15." }
      - { titulo: "Bits.", texto: "OR pone, AND con ~ borra, XOR invierte, AND prueba." }
      - { titulo: "Campos.", texto: "Desplazar y enmascarar; borrar antes de escribir. Un registro, con máscaras, nunca con campos de bits." }
