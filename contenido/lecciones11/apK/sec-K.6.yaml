# Lección 1.2 de la sección K.6 «Errores Típicos» (apK). Formato: contenido/lecciones11/GUIA.md (§5.2, §11). Todos los
# resultados son los del libro: el bloque de promoción compilado en el PC y en simavr (bloque 63; Complementos/codigo/
# apK/promocion) y el ejercicio K.1 (300 × 300 = 24 464 en el AVR). La gráfica dibuja lo que queda de un producto en un
# int de 16 bits, como lo da en la práctica el avr-gcc (90 000 − 65 536 = 24 464; 60 000 − 65 536 = −5 536).
# 1.2.1 («aprender haciendo», GUIA §13): el producto que sale negativo es un objetivo; c se escribe en binario, los 16
# bits de 1000 * 60 en hexadecimal (0xEA60, que como int es −5 536) y 300 × 300 en decimal; las expresiones que dan 0
# se tocan en el listado. Quedan dos preguntas de opciones: el destino y el comportamiento indefinido.
leccion: apK/sec-K.6

libro:
  60: "C convierte todo lo que es más pequeño que un int en int"
  61: "uint8_t  a = 200, b = 100, e = 0x80;"
  62: "en la práctica el avr-gcc da −5 536, que convertido a uint32_t son 4 294 961 760"
  63: "El bloque, compilado para el PC y ejecutado, da c = 44, d = 1, f = 0, g = 60 000, h = 60 000 e i = 0"
  65: "puede convertir if (x + 1 > x) en if (1)"
  66: "leer o escribir fuera de un vector"
  68: "-fsanitize=undefined,address"
  "apK#70": "el avr-gcc da en la práctica 90 000 − 65 536 = 24 464"

modelo:
  valores:
    prod: { sim: "producto", nombre: "producto exacto", unidad: "", valor: 60000 }
    ua: { sim: "a", nombre: "primer factor", unidad: "", valor: 300 }
    ub: { sim: "b", nombre: "segundo factor", unidad: "", valor: 300 }
  calculos:
    i16: { expr: "prod - 65536*floor((prod + 32768)/65536)", sim: "int", nombre: "lo que queda en un int de 16 bits", unidad: "" }
    u16: { expr: "ua*ub - 65536*floor(ua*ub/65536)", sim: "uint16_t", nombre: "lo que queda en 16 bits sin signo", unidad: "" }
    c_suma: { expr: "(200 + 100) - 256", sim: "c", nombre: "a + b guardado en un uint8_t", unidad: "" }
    bits_g: { expr: "prod - 65536*floor(prod/65536)", nombre: "los 16 bits del producto", unidad: "" }

tarjetas:
  - id: explore-desborde
    tipo: explorar
    titulo: "Un producto que no cabe"
    texto: "En el AVR, dos int dan un producto int de 16 bits. Elija el producto exacto que, en la práctica, el avr-gcc deja negativo."
    libro: [62, "apK#70"]
    inicio: { prod: 30000 }
    widget:
      tipo: grafica
      x: { id: pp, min: 0, max: 100000, unidad: "", rotulo: "producto exacto" }
      y: { min: -35000, max: 35000, unidad: "", rotulo: "int de 16 bits" }
      curvas:
        - { expr: "pp - 65536*floor((pp + 32768)/65536)", color: azul, rotulo: "lo que queda" }
      marcas:
        - { x: "prod", y: "i16", rotulo: "{{i16}}" }
      lectura: { valor: i16, rotulo: "Resultado en el AVR" }
      mandos:
        - { valor: prod, lista: [30000, 60000, 90000], rotulo: "Producto exacto" }
    objetivo:
      condiciones:
        - { valor: i16, max: -1, rotulo: "Resultado: {{i16}}" }
      logrado: "{{prod}} no cabe en un int de 16 bits: queda en {{i16}}. Con 90 000, en cambio, vuelve a salir positivo."
      pistas:
        - { texto: "Ese aún sale positivo: pruebe otro producto." }
    escalera: ["Lo que pasa de lo que cabe en un int de 16 bits da la vuelta a los negativos."]
    solucion: "60 000: queda en −5 536."
    comprobar:
      - { con: { prod: 60000 }, i16: -5536 }
      - { con: { prod: 90000 }, i16: 24464 }

  - id: prediga-suma
    tipo: leer
    titulo: "200 + 100 en un uint8_t"
    texto: "C convierte todo lo menor que un int en int antes de operar. uint8_t a = 200, b = 100, c; c = a + b; Escriba c en binario."
    libro: [60, 61, 63]
    widget:
      tipo: figura
      codigo: "apK#61"
      resaltar: [3, 4]
    leer:
      objetivo: c_suma
      base: 2
      cifras: 8
      rotulo: "c"
      errores:
        - { expr: "255", texto: "No satura: se pierden los bits que no caben." }
    exito: "44: a + b es el int 300, de 9 bits, y al guardarlo en 8 se pierde el bit 8."
    escalera: ["Pase 300 a binario y quédese con los 8 bits bajos."]
    solucion: "44: el int 300 sin su bit 8."
    comprobar:
      - { c_suma: 44 }

  - id: empareje-promocion
    tipo: tocar
    titulo: "Las conversiones habituales"
    texto: "Si se mezclan con signo y sin signo del mismo tamaño, el que tiene signo pasa a sin signo. Toque todas las asignaciones que dan 0."
    libro: [60, 61, 62, 63]
    widget:
      tipo: figura
      codigo:
        lenguaje: c
        texto: |
          uint8_t  a = 200, b = 100, e = 0x80;

          void promocion(void)
          {
              c = a + b;
              d = a + b > 255;
              f = ~e == 0x7F;
              g = 1000 * 60;
              h = 1000ul * 60;
              i = -1 < 1u;
          }
      zonas:
        - { id: l5, lineas: [5], rotulo: "Quinta línea" }
        - { id: l6, lineas: [6], rotulo: "Sexta línea" }
        - { id: l7, lineas: [7], rotulo: "Séptima línea" }
        - { id: l8, lineas: [8], rotulo: "Octava línea" }
        - { id: l9, lineas: [9], rotulo: "Novena línea" }
        - { id: l10, lineas: [10], rotulo: "Décima línea" }
    tocar:
      bien: [l7, l10]
      todas: true
      porque:
        l5: "c vale 44: el int 300 truncado a 8 bits."
        l6: "d vale 1: comparado como int, 300 sí es mayor que 255."
        l8: "En el AVR, g vale 4 294 961 760; en el PC, 60 000."
        l9: "h vale 60 000 en cualquier compilador."
    exito: "~e es el int 0xFF7F, no 0x7F; y −1 pasa a ser el mayor unsigned. Por eso for (unsigned k = n - 1; k >= 0; k--) nunca termina."
    escalera: ["~ se aplica después de convertir e en int; −1 se convierte al tipo sin signo del otro."]
    solucion: "f = ~e == 0x7F e i = -1 < 1u."

  - id: prediga-g
    tipo: leer
    titulo: "1000 * 60 en un uint32_t"
    texto: "En el Arduino UNO, 1000 * 60 son dos int y su producto, 60 000, no cabe en uno de 16 bits con signo. Escriba en hexadecimal los 16 bits que quedan."
    libro: [62, 63]
    fijar: { prod: 60000 }
    widget:
      tipo: grafica
      x: { id: pp, min: 0, max: 100000, unidad: "", rotulo: "producto exacto" }
      y: { min: -35000, max: 35000, unidad: "", rotulo: "int de 16 bits" }
      curvas:
        - { expr: "pp - 65536*floor((pp + 32768)/65536)", color: azul, rotulo: "lo que queda" }
      mandos: []
    leer:
      objetivo: bits_g
      base: 16
      cifras: 16
      rotulo: "Los 16 bits del producto"
    exito: "0xEA60: como int con signo es −5 536, y convertido a uint32_t son 4 294 961 760. En el PC, 60 000."
    escalera: ["60 000 cabe en 16 bits sin signo: páselo a hexadecimal."]
    solucion: "60 000 = 0xEA60, que como int es −5 536."
    comprobar:
      - { bits_g: 60000, i16: -5536 }

  - id: estime-300
    tipo: leer
    titulo: "300 × 300"
    texto: "En el Arduino UNO, uint16_t x = 300 * 300; Calcule cuánto vale x en la práctica."
    libro: ["apK#70"]
    widget:
      tipo: grafica
      x: { id: pp, min: 0, max: 100000, unidad: "", rotulo: "producto exacto" }
      y: { min: -35000, max: 35000, unidad: "", rotulo: "int de 16 bits" }
      curvas:
        - { expr: "pp - 65536*floor((pp + 32768)/65536)", color: azul, rotulo: "lo que queda" }
      mandos: []
    leer:
      objetivo: u16
      unidad: ""
      tol: 0.001
      rotulo: "Valor de x"
      errores:
        - { expr: "ua*ub", texto: "90 000 no cabe en 16 bits: dé la vuelta en 65 536." }
    exito: "24 464, y también en un Cortex-M, porque 90 000 no cabe en un uint16_t."
    escalera: ["300 × 300 son 90 000; 16 bits dan la vuelta en 65 536."]
    solucion: "90 000 − 65 536 = 24 464."
    comprobar:
      - { u16: 24464 }

  - id: porque-destino
    tipo: porque
    titulo: "El destino no importa"
    texto: "uint32_t g = 1000 * 60; guarda en 32 bits. ¿Por qué se desborda igual en el AVR?"
    libro: [62]
    widget:
      tipo: grafica
      x: { id: pp, min: 0, max: 100000, unidad: "", rotulo: "producto exacto" }
      y: { min: -35000, max: 35000, unidad: "", rotulo: "int de 16 bits" }
      curvas:
        - { expr: "pp - 65536*floor((pp + 32768)/65536)", color: azul, rotulo: "lo que queda" }
    opciones:
      - { texto: "El tipo de una operación lo deciden sus operandos, no dónde se guarda", bien: true, porque: "Dos int dan un int de 16 bits; la conversión a 32 llega tarde. Se arregla con 1000ul." }
      - { texto: "Porque uint32_t no existe en el AVR", porque: "Existe: el problema es el producto, que se hace antes en int." }
      - { texto: "Porque 60 es un número negativo", porque: "No lo es: lo que no cabe es el producto, 60 000." }
    escalera: ["¿Qué se calcula antes, el producto o la asignación?"]
    solucion: "Los operandos son int: el producto se desborda antes de guardarse."

  - id: pregunta-indefinido
    tipo: pregunta
    titulo: "Comportamiento indefinido"
    texto: "int x; if (x + 1 > x) … ¿Qué puede hacer el compilador con esa comparación?"
    libro: [65, 66]
    widget:
      tipo: grafica
      x: { id: pp, min: 0, max: 100000, unidad: "", rotulo: "producto exacto" }
      y: { min: -35000, max: 35000, unidad: "", rotulo: "int de 16 bits" }
      curvas:
        - { expr: "pp - 65536*floor((pp + 32768)/65536)", color: azul, rotulo: "con signo" }
    opciones:
      - { texto: "Convertirla en if (1): supone que el desbordamiento con signo no ocurre", bien: true, porque: "Es comportamiento indefinido: el programa puede funcionar hasta que cambie la optimización." }
      - { texto: "Comprobarla siempre en tiempo de ejecución", porque: "Puede quitarla: el estándar no le obliga a nada si hay desbordamiento." }
      - { texto: "Dar un error", porque: "No es un error de compilación: es indefinido al ejecutar." }
    escalera: ["Con signo, ¿está definido qué pasa al desbordarse?"]
    solucion: "if (1): optimiza suponiendo que no hay desbordamiento con signo."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [60, 62, 65, 68]
    ideas:
      - { titulo: "Promoción.", texto: "Todo lo menor que un int se opera como int." }
      - { titulo: "Operandos.", texto: "El tipo lo deciden los operandos, no el destino: 1000ul." }
      - { titulo: "Indefinido.", texto: "Con signo, el desbordamiento no existe para el compilador." }
      - { titulo: "Defensa.", texto: "Avisos, sanitizadores en el PC y prueba en el procesador real." }
