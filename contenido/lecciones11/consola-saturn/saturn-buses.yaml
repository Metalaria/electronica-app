# «Consolas por dentro» · Sega Saturn 4: los buses y el mapa. El bus de la CPU (las dos SH-2 y la WORK RAM-H), el
# bus lento del 315-5778 (ROM, SMPC, respaldo, WORK RAM-L), el bus A (cartucho y CD) y el bus B (VDP1, VDP2, SCSP), con
# la SCU entre ellos. Fuentes: los datos de la consola (saturn#n: el modelo de arquitectura con el mapa del manual de
# la SCU y las selecciones del esquema).
leccion: consola-saturn/saturn-buses

libro:
  "saturn#4": "une el bus de la CPU con el bus A (cartucho y CD) y el bus B (VDP1, VDP2 y SCSP)"
  "saturn#142": "el CD y el cartucho van en el bus A; VDP1, VDP2 y SCSP, en el bus B"
  "saturn#89": "Recibe /CS0 de las SH-2 y lo reparte"
  "saturn#82": "SDRAM con su propia selección /CS3 de las SH-2"
  "saturn#106": "Decodificador, lectura en $00000000"
  "saturn#109": "Decodificador, escritura en $06000000"
  "saturn#110": "Decodificador, lectura en $25890000"
  "saturn#112": "Decodificador, escritura en $25E00000"
  "saturn#113": "Decodificador, escritura en $25F00000"
  "saturn#107": "Decodificador, escritura en $20100001"
  "saturn#84": "Cartuchos de memoria de respaldo o de RAM"
  "saturn#85": "Matriz de puertas del bloque de CD"
  "saturn#6": "Hace de puente entre el bus de la CPU y el bus lento"

modelo:
  valores: {}
  calculos: {}

tarjetas:
  - id: explore-buses
    tipo: explorar
    titulo: "Cuatro buses"
    texto: "Toque la SCU, el controlador de la DRAM y los chips de cada lado: así se reparte la placa."
    libro: ["saturn#4", "saturn#89", "saturn#142"]
    requiere: { mover: [scu, dcc] }
    widget:
      tipo: figura
      consola: { maquina: saturn, foto: va8 }
      ampliar: 2.5
      zonas:
        - { id: scu, hotspot: scu, rotulo: "SCU", texto: "Une el bus de la CPU con el bus A y el bus B." }
        - { id: dcc, hotspot: dcc, rotulo: "Controlador", texto: "Reparte /CS0: ROM, SMPC, respaldo y WORK RAM-L." }
        - { id: sh2m, hotspot: sh2m, rotulo: "SH-2 maestra", texto: "Saca las direcciones." }
        - { id: wramh, hotspot: wramh, rotulo: "WORK RAM-H", texto: "En el bus de la CPU, con /CS3." }

  - id: toque-busb
    tipo: tocar
    titulo: "El bus B"
    texto: "Toque los tres chips que cuelgan del bus B."
    libro: ["saturn#142", "saturn#4"]
    widget:
      tipo: figura
      consola: { maquina: saturn, foto: va8 }
      ampliar: 2.5
      zonas:
        - { id: vdp1, hotspot: vdp1, rotulo: "Chip cuadrado, abajo a la izquierda del centro" }
        - { id: vdp2, hotspot: vdp2, rotulo: "Chip cuadrado, a la izquierda del centro" }
        - { id: scsp, hotspot: scsp, rotulo: "Chip cuadrado, a la izquierda" }
        - { id: ygr, hotspot: ygr, rotulo: "Chip cuadrado, arriba a la derecha" }
        - { id: smpc, hotspot: smpc, rotulo: "Chip cuadrado, abajo" }
    tocar:
      bien: [vdp1, vdp2, scsp]
      todas: true
      porque:
        ygr: "Es el bloque de CD: va en el bus A."
        smpc: "Es el SMPC: va en el bus lento del controlador."
    exito: "VDP1, VDP2 y SCSP: el bus B."
    escalera:
      - "Los dos VDP y el chip de sonido."
    solucion: "VDP1, VDP2 y SCSP."

  - id: toque-busa
    tipo: tocar
    titulo: "El bus A"
    texto: "Toque lo que cuelga del bus A."
    libro: ["saturn#142", "saturn#84", "saturn#85"]
    widget:
      tipo: figura
      consola: { maquina: saturn, foto: va8 }
      ampliar: 2.8
      zonas:
        - { id: cart, hotspot: cart, rotulo: "Ranura metálica, arriba" }
        - { id: ygr, hotspot: ygr, rotulo: "Chip cuadrado, arriba a la derecha" }
        - { id: vdp2, hotspot: vdp2, rotulo: "Chip cuadrado, a la izquierda del centro" }
        - { id: wramh, hotspot: wramh, rotulo: "Chip cuadrado, abajo a la derecha del centro" }
    tocar:
      bien: [cart, ygr]
      todas: true
      porque:
        vdp2: "Es el VDP2: va en el bus B."
        wramh: "Es la WORK RAM-H: va en el bus de la CPU."
    exito: "La ranura de cartucho y el bloque de CD: el bus A."
    escalera:
      - "Cartucho y CD."
    solucion: "La ranura CN1 y el YGR019."

  - id: toque-cs0
    tipo: tocar
    titulo: "La dirección 0"
    texto: "La SH-2 maestra lee su primera palabra en $00000000: baja /CS0. Toque el chip que recibe /CS0 y elige la memoria."
    libro: ["saturn#106", "saturn#89", "saturn#6"]
    widget:
      tipo: figura
      consola: { maquina: saturn, foto: va8 }
      recorte: [900, 680, 650, 620]
      ampliar: 2.5
      zonas:
        - { id: dcc, hotspot: dcc, rotulo: "Chip cuadrado, en el centro" }
        - { id: ipl, hotspot: ipl, rotulo: "Chip alargado, abajo" }
        - { id: wraml, hotspot: wraml, rotulo: "Dos chips alargados, arriba" }
    tocar:
      bien: [dcc]
      porque:
        ipl: "Es la ROM: contesta, pero porque el controlador le baja /ROMCE."
        wraml: "Es la WORK RAM-L: también cuelga de /CS0, pero no decide."
    exito: "El controlador (315-5778 en la VA0.5): recibe /CS0 y baja /ROMCE de la ROM."
    escalera:
      - "Está entre la WORK RAM-L y la ROM."
    solucion: "El controlador de la DRAM (IC6)."

  - id: toque-cs3
    tipo: tocar
    titulo: "Sin intermediarios"
    texto: "Una escritura en $06000000 baja /CS3. Toque la memoria que contesta directamente."
    libro: ["saturn#109", "saturn#82"]
    widget:
      tipo: figura
      consola: { maquina: saturn, foto: va8 }
      recorte: [800, 680, 750, 620]
      ampliar: 2.5
      zonas:
        - { id: wramh, hotspot: wramh, rotulo: "Chip cuadrado, abajo" }
        - { id: wraml, hotspot: wraml, rotulo: "Dos chips alargados, arriba a la derecha" }
        - { id: dcc, hotspot: dcc, rotulo: "Chip cuadrado, en el centro" }
    tocar:
      bien: [wramh]
      porque:
        wraml: "Es la WORK RAM-L: va por el controlador, con /CS0."
        dcc: "Es el controlador: atiende /CS0, no /CS3."
    exito: "La WORK RAM-H: la SDRAM contesta directamente a /CS3."
    escalera:
      - "Es la SDRAM."
    solucion: "La NEC D489020GF (IC3)."

  - id: toque-cram
    tipo: tocar
    titulo: "Una escritura en $25F00000"
    texto: "La SH-2 escribe en $25F00000 (la zona «sin caché»): la SCU la pasa al bus B. Toque el chip que la guarda."
    libro: ["saturn#113", "saturn#4"]
    widget:
      tipo: figura
      consola: { maquina: saturn, foto: va8 }
      ampliar: 2.5
      zonas:
        - { id: vdp2, hotspot: vdp2, rotulo: "Chip cuadrado, a la izquierda del centro" }
        - { id: vdp1, hotspot: vdp1, rotulo: "Chip cuadrado, abajo a la izquierda del centro" }
        - { id: scsp, hotspot: scsp, rotulo: "Chip cuadrado, a la izquierda" }
    tocar:
      bien: [vdp2]
      porque:
        vdp1: "El VDP1 está en $25C00000."
        scsp: "La SCSP está en $25A00000 y $25B00000."
    exito: "El VDP2: es su CRAM, la paleta de 4 KB."
    escalera:
      - "La paleta es del VDP que compone la imagen."
    solucion: "El VDP2 (IC14)."

  - id: toque-smpc
    tipo: tocar
    titulo: "Una escritura en $20100001"
    texto: "Una escritura en $20100001 va a un registro de órdenes. Toque el chip."
    libro: ["saturn#107"]
    widget:
      tipo: figura
      consola: { maquina: saturn, foto: va8 }
      recorte: [400, 1000, 900, 400]
      ampliar: 2.5
      zonas:
        - { id: smpc, hotspot: smpc, rotulo: "Chip cuadrado, a la izquierda" }
        - { id: wramh, hotspot: wramh, rotulo: "Chip cuadrado, a la derecha" }
        - { id: ipl, hotspot: ipl, rotulo: "Chip alargado, a la derecha del todo" }
    tocar:
      bien: [smpc]
      porque:
        wramh: "La WORK RAM-H está en $06000000."
        ipl: "La ROM está en $00000000 y no se escribe."
    exito: "El SMPC: sus registros están en los bytes impares desde $00100000."
    escalera:
      - "Reset, mandos, reloj: órdenes."
    solucion: "El SMPC (IC9)."

  - id: empareje-direcciones
    tipo: pregunta
    fase: "Empareje"
    titulo: "Cada dirección, su selección"
    texto: "Empareje cada dirección con la selección que baja."
    libro: ["saturn#106", "saturn#109", "saturn#112", "saturn#110"]
    emparejar:
      - ["$00000000", "/CS0 → /ROMCE"]
      - ["$06000000", "/CS3"]
      - ["$25E00000", "/CS2 → /BCS2 (VDP2)"]
      - ["$25890000", "/CS2 → /ACS2 (CD)"]
    exito: "ROM por el controlador, SDRAM directa, VDP2 por el bus B y CD por el bus A."
    pistas: [ { texto: "Las zonas de los VDP y del CD pasan por la SCU." } ]

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: ["saturn#4", "saturn#89", "saturn#82", "saturn#142"]
    ideas:
      - { titulo: "Bus de la CPU.", texto: "Las dos SH-2 y la WORK RAM-H." }
      - { titulo: "/CS0.", texto: "El controlador reparte ROM, SMPC, respaldo y WORK RAM-L." }
      - { titulo: "La SCU.", texto: "Lleva al bus A (cartucho, CD) y al bus B (VDP, SCSP)." }
