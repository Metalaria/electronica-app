# «Consolas por dentro» · Sega Saturn 6: el bloqueo regional. El SMPC devuelve un código de zona, el disco lleva sus
# símbolos de zona y el juego solo arranca si coinciden; el SH-1 del bloque de CD comprueba el anillo del disco; la
# placa PAL cambia el cristal X1. Fuentes: los datos de la consola (saturn#n: manuales del SMPC, de formato de disco y de
# servicio de Sega, y Rodrigo Copetti).
leccion: consola-saturn/saturn-bloqueo

libro:
  "saturn#137": "El SMPC devuelve un código de zona: 1 Japón, 2 Asia NTSC, 4 Norteamérica, 5 Centro y Sudamérica NTSC, 6 Corea, A Asia PAL, C Europa PAL"
  "saturn#139": "J Japón, T Asia NTSC, U Norteamérica (con Centro y Sudamérica NTSC) y E Europa PAL"
  "saturn#140": "el juego solo arranca si el símbolo de zona y el código de zona coinciden"
  "saturn#143": "un SH-1 comprueba la presencia del anillo del disco"
  "saturn#133": "Las patillas R50–R53 del SMPC son entradas de configuración por puentes"
  "saturn#8": "comprobación del disco"
  "saturn#11": "un microcontrolador de 4 bits de Hitachi"
  "saturn#20": "Un SH-1 a 20 MHz"
  "saturn#131": "El cristal X1 de la placa PAL es de 17,7344 MHz"
  "saturn#118": "X1 (17,7344 MHz en la placa PAL) alimenta el PLL IC20"

modelo:
  valores: {}
  calculos: {}

tarjetas:
  - id: explore-zona
    tipo: explorar
    titulo: "Quién sabe de qué zona es"
    texto: "Toque el SMPC, la ROM de arranque y el SH-1 del bloque de CD."
    libro: ["saturn#137", "saturn#8", "saturn#143"]
    requiere: { mover: [smpc, ipl, sh1] }
    widget:
      tipo: figura
      consola: { maquina: saturn, foto: va8 }
      ampliar: 2.5
      zonas:
        - { id: smpc, hotspot: smpc, rotulo: "SMPC", texto: "Devuelve el código de zona." }
        - { id: ipl, hotspot: ipl, rotulo: "ROM de arranque", texto: "Comprueba el disco." }
        - { id: sh1, hotspot: sh1, rotulo: "SH-1", texto: "Comprueba el anillo del disco." }

  - id: toque-smpc
    tipo: tocar
    titulo: "El código de zona"
    texto: "Toque el chip que devuelve a las CPU el código de zona de la consola."
    libro: ["saturn#137", "saturn#133", "saturn#11"]
    widget:
      tipo: figura
      consola: { maquina: saturn, foto: va8 }
      recorte: [400, 1000, 900, 400]
      ampliar: 2.5
      zonas:
        - { id: smpc, hotspot: smpc, rotulo: "Chip cuadrado, a la izquierda" }
        - { id: wramh, hotspot: wramh, rotulo: "Chip cuadrado, a la derecha" }
        - { id: ipl, hotspot: ipl, rotulo: "Chip alargado, a la derecha del todo" }
    tocar:
      bien: [smpc]
      porque:
        wramh: "Es la WORK RAM-H: no guarda la zona."
        ipl: "Es la ROM: la que pregunta la zona, no la que la da."
    exito: "El SMPC. Sus patillas R50–R53 son entradas de configuración por puentes."
    escalera:
      - "Es el microcontrolador de 4 bits."
    solucion: "El SMPC (IC9)."

  - id: logica-arranque
    tipo: explorar
    titulo: "¿Arranca el juego?"
    texto: "El disco lleva los símbolos de sus zonas (J, T, U, E). Consiga que el juego arranque."
    libro: ["saturn#140", "saturn#139", "saturn#143"]
    widget:
      tipo: logica
      entradas: [{ id: ZON, rotulo: "Símbolo del disco = zona de la consola" }, { id: ANI, rotulo: "Anillo del disco presente" }]
      piezas:
        - { id: a1, tipo: and, entradas: [ZON, ANI] }
      salidas:
        - { id: ARR, de: a1, rotulo: "El juego arranca" }
    objetivo:
      condiciones:
        - { led: ARR, valor: 1, rotulo: "El juego arranca" }
      logrado: "Las dos: la zona coincide y el SH-1 ha visto el anillo de un disco original."
      pistas:
        - { texto: "Falta una de las dos condiciones." }
    escalera:
      - "Encienda las dos entradas."
    solucion: "Zona que coincide y anillo presente."

  - id: toque-sh1
    tipo: tocar
    titulo: "El anillo del disco"
    texto: "Toque el procesador que comprueba el anillo del disco sin pasar por las CPU principales."
    libro: ["saturn#143", "saturn#20"]
    widget:
      tipo: figura
      consola: { maquina: saturn, foto: va8 }
      ampliar: 2.5
      zonas:
        - { id: sh1, hotspot: sh1, rotulo: "Chip cuadrado pequeño, arriba a la derecha" }
        - { id: sh2m, hotspot: sh2m, rotulo: "Chip cuadrado, en el centro" }
        - { id: scu, hotspot: scu, rotulo: "Chip cuadrado, arriba en el centro" }
    tocar:
      bien: [sh1]
      porque:
        sh2m: "Es la CPU maestra: la comprobación no pasa por ella."
        scu: "Es la SCU."
    exito: "El SH-1 del bloque de CD."
    escalera:
      - "Está en el bloque de CD."
    solucion: "El SH-1 (IC36 en la VA8)."

  - id: toque-ipl
    tipo: tocar
    titulo: "Quién compara"
    texto: "Toque la memoria con el programa que comprueba el disco al arrancar."
    libro: ["saturn#8", "saturn#140"]
    widget:
      tipo: figura
      consola: { maquina: saturn, foto: va8 }
      recorte: [900, 1050, 650, 300]
      ampliar: 2.5
      zonas:
        - { id: ipl, hotspot: ipl, rotulo: "Chip alargado, a la derecha" }
        - { id: wramh, hotspot: wramh, rotulo: "Chip cuadrado, a la izquierda" }
    tocar:
      bien: [ipl]
      porque:
        wramh: "Es la WORK RAM-H: se borra al apagar."
    exito: "La ROM de arranque (IPL)."
    escalera:
      - "Es una ROM."
    solucion: "La MPR-17941 (IC7)."

  - id: toque-pal
    tipo: tocar
    titulo: "La placa PAL"
    texto: "La placa PAL lleva el cristal X1 de 17,7344 MHz. Toque el chip que lo recibe."
    libro: ["saturn#131", "saturn#118"]
    widget:
      tipo: figura
      consola: { maquina: saturn, foto: va8 }
      recorte: [500, 800, 600, 400]
      ampliar: 2.5
      zonas:
        - { id: pll, hotspot: pll, rotulo: "Chip pequeño, en el centro" }
        - { id: sh2s, hotspot: sh2s, rotulo: "Chip cuadrado, a la derecha" }
        - { id: vdp1, hotspot: vdp1, rotulo: "Chip cuadrado, a la izquierda" }
    tocar:
      bien: [pll]
      porque:
        sh2s: "Es una CPU: recibe el reloj del PLL."
        vdp1: "Es el VDP1: recibe el reloj del PLL."
    exito: "El PLL IC20."
    escalera:
      - "Es el generador de relojes."
    solucion: "IC20."

  - id: empareje-codigos
    tipo: pregunta
    fase: "Empareje"
    titulo: "Códigos de zona"
    texto: "Empareje cada código de zona del SMPC con su zona."
    libro: ["saturn#137"]
    emparejar:
      - ["1", "Japón"]
      - ["4", "Norteamérica"]
      - ["C", "Europa PAL"]
      - ["A", "Asia PAL"]
    exito: "1 Japón, 4 Norteamérica, C Europa PAL y A Asia PAL."
    pistas: [ { texto: "Las zonas PAL tienen letras." } ]

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: ["saturn#137", "saturn#140", "saturn#143", "saturn#131"]
    ideas:
      - { titulo: "El SMPC.", texto: "Devuelve el código de zona." }
      - { titulo: "El disco.", texto: "Arranca si su zona coincide con la de la consola." }
      - { titulo: "El SH-1.", texto: "Comprueba el anillo del disco." }
      - { titulo: "PAL.", texto: "Otro cristal X1: 17,7344 MHz." }
