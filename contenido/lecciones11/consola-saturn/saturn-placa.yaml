# «Consolas por dentro» · Sega Saturn 1: la placa de un vistazo, sobre las fotos de Evan-Amos de una placa VA8 (dominio
# público): dos SH-2, la SCU, los dos VDP, el sonido y el bloque de CD. El esquema es el de la VA0.5 (RGBeter y el manual
# de Sega); la foto, de una placa posterior con los mismos papeles. Fuentes: los datos de la consola (saturn#n,
# scripts/consolas11.mjs).
leccion: consola-saturn/saturn-placa

libro:
  "saturn#2": "CPU principal de 32 bits (RISC, con 4 KB de caché)"
  "saturn#3": "conectada como esclava"
  "saturn#4": "une el bus de la CPU con el bus A (cartucho y CD) y el bus B (VDP1, VDP2 y SCSP)"
  "saturn#12": "Dibuja sprites y polígonos de cuatro lados"
  "saturn#13": "Genera la imagen al ritmo del barrido"
  "saturn#14": "Procesador de sonido de Yamaha"
  "saturn#15": "CPU de 16 bits a 11,3 MHz"
  "saturn#19": "La matriz de puertas del bloque de CD"
  "saturn#20": "Un SH-1 a 20 MHz"
  "saturn#5": "1 MB de SDRAM en el bus de la CPU"
  "saturn#7": "1 MB de DRAM normal"
  "saturn#8": "El programa inicial (IPL)"
  "saturn#29": "SDRAM del VDP1"
  "saturn#30": "512 KB de VRAM del VDP2 en dos bancos"
  "saturn#31": "DRAM de 4 Mbit que comparten la SCSP"
  "saturn#128": "la HST-3210 lo pasó a la placa principal"

modelo:
  valores: {}
  calculos: {}

tarjetas:
  - id: explore-cpus
    tipo: explorar
    titulo: "Dos procesadores iguales"
    texto: "Toque las dos SH-2, la SCU y el 68EC000 de esta placa."
    libro: ["saturn#2", "saturn#3", "saturn#4", "saturn#15"]
    requiere: { mover: [sh2m, sh2s, scu, m68k] }
    widget:
      tipo: figura
      consola: { maquina: saturn, foto: va8 }
      ampliar: 2.5
      zonas:
        - { id: sh2m, hotspot: sh2m, rotulo: "SH-2 maestra", texto: "CPU RISC de 32 bits con 4 KB de caché." }
        - { id: sh2s, hotspot: sh2s, rotulo: "SH-2 esclava", texto: "La misma CPU, como esclava." }
        - { id: scu, hotspot: scu, rotulo: "SCU", texto: "Une el bus de la CPU con los buses A y B." }
        - { id: m68k, hotspot: m68k, rotulo: "68EC000", texto: "La CPU del sonido, de 16 bits." }

  - id: toque-scu
    tipo: tocar
    titulo: "El que une los buses"
    texto: "Toque el chip que une el bus de la CPU con el bus A (cartucho y CD) y el bus B (los VDP y el sonido)."
    libro: ["saturn#4", "saturn#2", "saturn#13"]
    widget:
      tipo: figura
      consola: { maquina: saturn, foto: va8 }
      ampliar: 2.5
      zonas:
        - { id: scu, hotspot: scu, rotulo: "Chip cuadrado, arriba en el centro" }
        - { id: sh2m, hotspot: sh2m, rotulo: "Chip cuadrado, en el centro" }
        - { id: vdp2, hotspot: vdp2, rotulo: "Chip cuadrado, a la izquierda del centro" }
        - { id: ygr, hotspot: ygr, rotulo: "Chip cuadrado, arriba a la derecha" }
    tocar:
      bien: [scu]
      porque:
        sh2m: "Es la SH-2 maestra: usa el bus de la CPU, no lo une con los otros."
        vdp2: "Es el VDP2: está en el bus B."
        ygr: "Es el YGR019 del bloque de CD: está en el bus A."
    exito: "La SCU: puente entre el bus de la CPU, el bus A y el bus B."
    escalera:
      - "Lea las marcas: busque «315-5966»."
      - "Es el chip grande de arriba, junto a la ranura de cartucho."
    solucion: "Arriba en el centro: SEGA 315-5966 (IC5)."

  - id: ordene-papeles
    tipo: tocar
    fase: "Ordene"
    titulo: "Cada chip, su papel"
    texto: "Toque, por este orden: el que dibuja sprites y polígonos, el que compone la imagen, el del sonido y la CPU del sonido."
    libro: ["saturn#12", "saturn#13", "saturn#14", "saturn#15"]
    widget:
      tipo: figura
      consola: { maquina: saturn, foto: va8 }
      ampliar: 3
      zonas:
        - { id: vdp1, hotspot: vdp1, rotulo: "Chip cuadrado, abajo a la izquierda del centro" }
        - { id: vdp2, hotspot: vdp2, rotulo: "Chip cuadrado, a la izquierda del centro" }
        - { id: scsp, hotspot: scsp, rotulo: "Chip cuadrado, a la izquierda" }
        - { id: m68k, hotspot: m68k, rotulo: "Chip cuadrado, abajo a la izquierda" }
        - { id: scu, hotspot: scu, rotulo: "Chip cuadrado, arriba en el centro" }
        - { id: sh2s, hotspot: sh2s, rotulo: "Chip cuadrado, abajo en el centro" }
    tocar:
      bien: [vdp1, vdp2, scsp, m68k]
      orden: true
      porque:
        scu: "Es la SCU: reparte los buses."
        sh2s: "Es la SH-2 esclava."
    pistas:
      - { texto: "315-5883, 315-5890, 315-5687 (YMF292) y MC68EC000." }
    exito: "VDP1 (sprites y polígonos), VDP2 (la imagen), SCSP (el sonido) y el 68EC000 que la programa."
    escalera:
      - "Toque los chips en la primera tarjeta para leer sus fichas."
    solucion: "VDP1, VDP2, SCSP y 68EC000."

  - id: toque-ram
    tipo: tocar
    titulo: "Dos RAM de trabajo"
    texto: "La RAM de trabajo son 2 MB: 1 MB de SDRAM rápida y 1 MB de DRAM normal. Toque los chips de la DRAM normal."
    libro: ["saturn#5", "saturn#7"]
    widget:
      tipo: figura
      consola: { maquina: saturn, foto: va8 }
      recorte: [900, 680, 600, 600]
      ampliar: 3
      zonas:
        - { id: wraml, hotspot: wraml, rotulo: "Dos chips alargados, a la derecha" }
        - { id: wramh, hotspot: wramh, rotulo: "Chip cuadrado, abajo a la derecha del centro" }
        - { id: ipl, hotspot: ipl, rotulo: "Chip alargado, abajo a la derecha" }
        - { id: bram, hotspot: bram, rotulo: "Chip pequeño, a la derecha" }
    tocar:
      bien: [wraml]
      porque:
        wramh: "Es la WORK RAM-H: el MB de SDRAM rápida."
        ipl: "Es la ROM de arranque, no RAM."
        bram: "Es la RAM de respaldo de las partidas, de 32 KB."
    exito: "La WORK RAM-L: dos DRAM de 256K × 16, 1 MB más lento que la SDRAM."
    escalera:
      - "Lea las marcas: M5M44260CJ."
    solucion: "Los dos M5M44260CJ de la derecha (IC31 e IC32)."

  - id: toque-rom
    tipo: tocar
    titulo: "El programa del arranque"
    texto: "Toque la ROM con el programa inicial: la pantalla de arranque y la comprobación del disco."
    libro: ["saturn#8", "saturn#5"]
    widget:
      tipo: figura
      consola: { maquina: saturn, foto: va8 }
      ampliar: 3
      zonas:
        - { id: ipl, hotspot: ipl, rotulo: "Chip alargado, abajo a la derecha" }
        - { id: wramh, hotspot: wramh, rotulo: "Chip cuadrado, abajo a la derecha del centro" }
        - { id: smpc, hotspot: smpc, rotulo: "Chip cuadrado, abajo a la izquierda del centro" }
    tocar:
      bien: [ipl]
      porque:
        wramh: "Es la WORK RAM-H."
        smpc: "Es el SMPC: el reset y los mandos."
    exito: "La MPR-17941: 512 KB con el programa inicial (IPL)."
    escalera:
      - "Busque «MPR» en las marcas."
    solucion: "Abajo a la derecha: SEGA MPR-17941-MX (IC7)."

  - id: toque-cd
    tipo: tocar
    titulo: "El bloque de CD"
    texto: "Esta placa lleva el bloque de CD dentro. Toque sus dos chips: la matriz de puertas y el procesador."
    libro: ["saturn#19", "saturn#20", "saturn#128"]
    widget:
      tipo: figura
      consola: { maquina: saturn, foto: va8 }
      ampliar: 3
      zonas:
        - { id: ygr, hotspot: ygr, rotulo: "Chip cuadrado, arriba a la derecha" }
        - { id: sh1, hotspot: sh1, rotulo: "Chip cuadrado pequeño, arriba a la derecha" }
        - { id: scu, hotspot: scu, rotulo: "Chip cuadrado, arriba en el centro" }
        - { id: sh2m, hotspot: sh2m, rotulo: "Chip cuadrado, en el centro" }
    tocar:
      bien: [ygr, sh1]
      todas: true
      porque:
        scu: "Es la SCU: lleva el bus A hasta el bloque de CD."
        sh2m: "Es la SH-2 maestra: pide los datos al bloque de CD."
    exito: "El YGR019 y el SH-1. En la primera Saturn iban en una placa aparte; la HST-3210 los pasó a la placa principal."
    escalera:
      - "Busque «YGR019» y «HD6437097»."
    solucion: "Arriba a la derecha: YGR019B (IC37) y HD6437097F (IC36)."

  - id: toque-memorias-b
    tipo: tocar
    titulo: "Las memorias de la otra cara"
    texto: "Dé la vuelta a la placa. Toque la VRAM del VDP2, los dos bancos que lee a la vez."
    libro: ["saturn#29", "saturn#30", "saturn#31"]
    widget:
      tipo: figura
      consola: { maquina: saturn, foto: va8-b }
      ampliar: 2.8
      zonas:
        - { id: vram2, hotspot: b-vram2, rotulo: "Dos chips, a la derecha del centro, arriba" }
        - { id: vram1, hotspot: b-vram, rotulo: "Tres chips, abajo en el centro" }
        - { id: snd, hotspot: b-snd, rotulo: "Chip alargado, a la derecha" }
        - { id: cdbuf, hotspot: b-cdbuf, rotulo: "Chip alargado, arriba a la izquierda" }
    tocar:
      bien: [vram2]
      porque:
        vram1: "Es la memoria del VDP1: su VRAM y sus dos búferes de imagen."
        snd: "Es la RAM de sonido, que comparten la SCSP y el 68EC000."
        cdbuf: "Es el búfer del bloque de CD."
    exito: "Dos SDRAM HM5221605: 512 KB de VRAM del VDP2 en dos bancos."
    escalera:
      - "Son dos chips iguales, uno al lado del otro."
    solucion: "Arriba a la derecha del centro: IC15 e IC16."

  - id: por-que-dos-sh2
    tipo: porque
    titulo: "¿Para qué dos SH-2?"
    texto: "Las dos SH-2 son el mismo chip. ¿Qué las distingue en la placa?"
    libro: ["saturn#2", "saturn#3"]
    widget:
      tipo: figura
      consola: { maquina: saturn, foto: va8 }
      ampliar: 2.5
      zonas:
        - { id: sh2m, hotspot: sh2m, rotulo: "Maestra" }
        - { id: sh2s, hotspot: sh2s, rotulo: "Esclava" }
    opciones:
      - texto: "Cómo están conectadas: una es maestra y la otra esclava, en el mismo bus."
        bien: true
        porque: "Comparten el bus de la CPU; la esclava pide el bus a la maestra para cada acceso."
      - texto: "Una hace la imagen y la otra el sonido."
        porque: "La imagen la hacen los VDP y el sonido la SCSP con el 68EC000; las dos SH-2 ejecutan el juego."
      - texto: "Cada una tiene su propia RAM de trabajo."
        porque: "No: las dos usan las mismas WORK RAM-H y WORK RAM-L, por el mismo bus."
    escalera:
      - "Lea la ficha de la SH-2 esclava."
    solucion: "La conexión: maestra y esclava comparten el bus de la CPU."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: ["saturn#2", "saturn#4", "saturn#13", "saturn#19"]
    ideas:
      - { titulo: "Dos SH-2.", texto: "Maestra y esclava, en el mismo bus." }
      - { titulo: "La SCU.", texto: "Une el bus de la CPU con el bus A y el bus B." }
      - { titulo: "Dos VDP.", texto: "El VDP1 dibuja y el VDP2 compone la imagen." }
      - { titulo: "El CD.", texto: "YGR019 y SH-1: aparte en la primera placa, dentro en la VA8." }
