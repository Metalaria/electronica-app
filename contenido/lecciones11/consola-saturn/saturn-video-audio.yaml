# «Consolas por dentro» · Sega Saturn 5: imagen y sonido. El VDP1 dibuja en sus búferes, el VDP2 compone la imagen al
# vuelo, el CXA1645 la codifica; la SCSP y el 68EC000 hacen el sonido y el TDA1386 lo convierte. Fuentes: los datos de
# la consola (saturn#n) y Rodrigo Copetti, «Sega Saturn Architecture».
leccion: consola-saturn/saturn-video-audio

libro:
  "saturn#97": "Lee una lista de órdenes de su VRAM y dibuja sprites y polígonos en uno de los dos búferes de imagen"
  "saturn#99": "Compone la imagen al ritmo del barrido"
  "saturn#144": "El VDP2 genera la imagen al vuelo, sin búfer de imagen"
  "saturn#145": "El VDP1 dibuja en uno de sus dos búferes de imagen mientras el otro se muestra"
  "saturn#17": "Convierte el RGB y el sincronismo del VDP2 en vídeo compuesto y S-vídeo"
  "saturn#18": "Convierte en analógico el audio digital en serie que sale de la SCSP"
  "saturn#23": "Conector de A/V: RGB, vídeo compuesto, S-vídeo y audio estéreo"
  "saturn#29": "su VRAM de 512 KB, donde están las órdenes y las texturas, y los dos búferes de imagen de 256 KB"
  "saturn#31": "DRAM de 4 Mbit que comparten la SCSP (muestras) y el 68EC000 (programa)"
  "saturn#101": "mezcla el audio del CD"
  "saturn#102": "Ejecuta el programa de sonido desde la RAM de sonido y programa la SCSP"

modelo:
  valores: {}
  calculos: {}

tarjetas:
  - id: explore-av
    tipo: explorar
    titulo: "De los chips al conector"
    texto: "Toque los dos VDP, el codificador, el DAC y el conector de A/V."
    libro: ["saturn#97", "saturn#99", "saturn#17", "saturn#18", "saturn#23"]
    requiere: { mover: [vdp1, vdp2, enc, dac, av] }
    widget:
      tipo: figura
      consola: { maquina: saturn, foto: va8 }
      ampliar: 4
      zonas:
        - { id: vdp1, hotspot: vdp1, rotulo: "VDP1", texto: "Dibuja sprites y polígonos." }
        - { id: vdp2, hotspot: vdp2, rotulo: "VDP2", texto: "Compone la imagen." }
        - { id: enc, rect: [390, 295, 59, 120], rotulo: "Codificador", texto: "RGB a compuesto y S-vídeo." }
        - { id: dac, rect: [188, 315, 59, 105], rotulo: "DAC", texto: "El audio, a analógico." }
        - { id: av, hotspot: av, rotulo: "A/V", texto: "RGB, compuesto, S-vídeo y audio." }

  - id: toque-vdp1
    tipo: tocar
    titulo: "El que dibuja"
    texto: "Toque el chip que dibuja sprites y polígonos en un búfer mientras se muestra el otro."
    libro: ["saturn#97", "saturn#145"]
    widget:
      tipo: figura
      consola: { maquina: saturn, foto: va8 }
      ampliar: 2.5
      zonas:
        - { id: vdp1, hotspot: vdp1, rotulo: "Chip cuadrado, abajo a la izquierda del centro" }
        - { id: vdp2, hotspot: vdp2, rotulo: "Chip cuadrado, a la izquierda del centro" }
        - { id: scu, hotspot: scu, rotulo: "Chip cuadrado, arriba en el centro" }
    tocar:
      bien: [vdp1]
      porque:
        vdp2: "Es el VDP2: compone la imagen sin búfer."
        scu: "Es la SCU: reparte los buses."
    exito: "El VDP1: dibuja en un búfer y los intercambia al acabar."
    escalera:
      - "Es el chip cuadrado de abajo, junto al 68EC000."
    solucion: "El VDP1 (IC10)."

  - id: toque-vdp2
    tipo: tocar
    titulo: "Sin búfer"
    texto: "Toque el chip que genera la imagen al vuelo, al ritmo del haz del televisor."
    libro: ["saturn#144", "saturn#99"]
    widget:
      tipo: figura
      consola: { maquina: saturn, foto: va8 }
      ampliar: 4
      zonas:
        - { id: vdp2, hotspot: vdp2, rotulo: "Chip cuadrado, a la izquierda del centro" }
        - { id: vdp1, hotspot: vdp1, rotulo: "Chip cuadrado, abajo a la izquierda del centro" }
        - { id: enc, rect: [390, 295, 59, 120], rotulo: "Chip estrecho, arriba a la izquierda" }
    tocar:
      bien: [vdp2]
      porque:
        vdp1: "Es el VDP1: él sí dibuja en búferes."
        enc: "Es el codificador: recibe la imagen ya hecha."
    exito: "El VDP2: mezcla sus planos con el búfer del VDP1 mientras se barre la pantalla."
    escalera:
      - "Es el chip cuadrado de arriba, junto a la SCSP."
    solucion: "El VDP2 (IC14)."

  - id: toque-bufer
    tipo: tocar
    titulo: "Los búferes, en la otra cara"
    texto: "Toque la memoria del VDP1, con su VRAM y sus dos búferes de imagen."
    libro: ["saturn#29"]
    widget:
      tipo: figura
      consola: { maquina: saturn, foto: va8-b }
      ampliar: 2.8
      zonas:
        - { id: vram1, hotspot: b-vram, rotulo: "Tres chips, abajo en el centro" }
        - { id: vram2, hotspot: b-vram2, rotulo: "Dos chips, a la derecha del centro, arriba" }
        - { id: snd, hotspot: b-snd, rotulo: "Chip alargado, a la derecha" }
    tocar:
      bien: [vram1]
      porque:
        vram2: "Es la VRAM del VDP2."
        snd: "Es la RAM de sonido."
    exito: "Tres SDRAM: la VRAM de 512 KB y los dos búferes de 256 KB."
    escalera:
      - "Son tres chips en fila."
    solucion: "IC11, IC12 e IC13."

  - id: toque-enc
    tipo: tocar
    titulo: "Del RGB al compuesto"
    texto: "Toque el chip que convierte el RGB del VDP2 en vídeo compuesto y S-vídeo."
    libro: ["saturn#17", "saturn#23"]
    widget:
      tipo: figura
      consola: { maquina: saturn, foto: va8 }
      recorte: [100, 250, 450, 250]
      ampliar: 2.5
      zonas:
        - { id: enc, hotspot: enc, rotulo: "Chip estrecho, a la derecha" }
        - { id: dac, hotspot: dac, rotulo: "Chip estrecho, a la izquierda" }
    tocar:
      bien: [enc]
      porque:
        dac: "Es el DAC: el audio."
    exito: "El Sony CXA1645M."
    escalera:
      - "Busque «CXA1645»."
    solucion: "IC21."

  - id: toque-sonido
    tipo: tocar
    titulo: "Quién mezcla el audio del CD"
    texto: "El audio del CD llega en serie por el bus A. Toque el chip que lo mezcla con el resto del sonido."
    libro: ["saturn#101", "saturn#102"]
    widget:
      tipo: figura
      consola: { maquina: saturn, foto: va8 }
      ampliar: 4
      zonas:
        - { id: scsp, hotspot: scsp, rotulo: "Chip cuadrado, a la izquierda" }
        - { id: m68k, hotspot: m68k, rotulo: "Chip cuadrado, abajo a la izquierda" }
        - { id: dac, rect: [188, 315, 59, 105], rotulo: "Chip estrecho, arriba a la izquierda" }
    tocar:
      bien: [scsp]
      porque:
        m68k: "Es el 68EC000: ejecuta el programa de sonido."
        dac: "Es el DAC: recibe el sonido ya mezclado."
    exito: "La SCSP: mezcla el audio del CD con sus 32 canales."
    escalera:
      - "Es el chip de Yamaha."
    solucion: "La SCSP (IC17)."

  - id: toque-ram-sonido
    tipo: tocar
    titulo: "Una RAM para dos"
    texto: "Toque la RAM que comparten la SCSP (las muestras) y el 68EC000 (el programa)."
    libro: ["saturn#31"]
    widget:
      tipo: figura
      consola: { maquina: saturn, foto: va8-b }
      ampliar: 2.8
      zonas:
        - { id: snd, hotspot: b-snd, rotulo: "Chip alargado, a la derecha" }
        - { id: cdbuf, hotspot: b-cdbuf, rotulo: "Chip alargado, arriba a la izquierda" }
        - { id: vram2, hotspot: b-vram2, rotulo: "Dos chips, a la derecha del centro, arriba" }
    tocar:
      bien: [snd]
      porque:
        cdbuf: "Es el búfer del CD."
        vram2: "Es la VRAM del VDP2."
    exito: "La HM514270: 4 Mbit de RAM de sonido."
    escalera:
      - "Busque «HM514270»."
    solucion: "IC19."

  - id: ordene-video
    tipo: pregunta
    fase: "Ordene"
    titulo: "El camino de la imagen"
    texto: "Ordene el camino de un sprite hasta el conector."
    libro: ["saturn#97", "saturn#99", "saturn#17", "saturn#23"]
    ordenar:
      - "El VDP1 lo dibuja en su búfer de imagen."
      - "El VDP2 lee el búfer y lo mezcla con sus planos."
      - "El VDP2 saca RGB y sincronismo."
      - "El CXA1645 forma el compuesto y el S-vídeo."
      - "Todo sale por el conector de A/V."
    exito: "VDP1, VDP2, codificador y conector."
    pistas: [ { texto: "El VDP1 dibuja; el VDP2 compone." } ]

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: ["saturn#145", "saturn#144", "saturn#101", "saturn#18"]
    ideas:
      - { titulo: "VDP1.", texto: "Dibuja en dos búferes que se alternan." }
      - { titulo: "VDP2.", texto: "Compone la imagen al vuelo, sin búfer." }
      - { titulo: "SCSP.", texto: "Mezcla el sonido, también el del CD." }
      - { titulo: "A la salida.", texto: "CXA1645 para el vídeo y TDA1386 para el audio." }
