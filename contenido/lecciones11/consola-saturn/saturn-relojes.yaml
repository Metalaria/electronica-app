# «Consolas por dentro» · Sega Saturn 3: los relojes. El PLL (IC20) da el reloj de las SH-2 y los VDP en dos modos de
# punto que elige el SMPC; la SCSP va a 512 fs; el SMPC y el bloque de CD llevan sus propios cristales. Fuentes: los
# datos de la consola (saturn#n: el modelo de arquitectura, el manual del SMPC y el manual de servicio PAL de Sega).
leccion: consola-saturn/saturn-relojes

libro:
  "saturn#79": "El PLL multiplica el cristal X1"
  "saturn#16": "Multiplica el cristal X1 para dar los relojes de las CPU, los VDP y la SCSP"
  "saturn#20": "Un SH-1 a 20 MHz"
  "saturn#127": "un cristal de 20 MHz en X101"
  "saturn#92": "SMPC (315-5744 (IC9) · 4 MHz)"
  "saturn#11": "lleva el reloj de tiempo real"
  "saturn#135": "La SCSP recibe un reloj maestro de 512 fs: 22,58 MHz"
  "saturn#14": "32 canales PCM/FM hasta 44,1 kHz"
  "saturn#136": "la orden CKCHG352 los pasa al modo de 352 puntos, 28,6364 MHz (NTSC) o 28,4375 MHz (PAL)"

modelo:
  valores:
    f_352: { sim: "f_{352}", nombre: "reloj de las SH-2 en el modo de 352 puntos, NTSC", unidad: Hz, valor: 28636400 }
  calculos:
    T_352: { expr: "1/f_352", sim: "T", nombre: "periodo del reloj de las SH-2", unidad: s, cifras: 3 }

tarjetas:
  - id: explore-relojes
    tipo: explorar
    titulo: "Cuatro relojes"
    texto: "Toque los cuatro chips que tienen reloj propio o lo reparten: el PLL, la SCSP, el SMPC y el SH-1."
    libro: ["saturn#16", "saturn#135", "saturn#92", "saturn#20"]
    requiere: { mover: [pll, scsp, smpc, sh1] }
    widget:
      tipo: figura
      consola: { maquina: saturn, foto: va8 }
      ampliar: 4
      zonas:
        - { id: pll, rect: [733, 940, 59, 120], rotulo: "PLL", texto: "Multiplica el cristal X1." }
        - { id: scsp, hotspot: scsp, rotulo: "SCSP", texto: "Reloj maestro de 512 fs." }
        - { id: smpc, hotspot: smpc, rotulo: "SMPC", texto: "Su cristal de 4 MHz." }
        - { id: sh1, hotspot: sh1, rotulo: "SH-1", texto: "20 MHz, el del bloque de CD." }

  - id: toque-pll
    tipo: tocar
    titulo: "Un cristal para casi todo"
    texto: "Toque el chip que multiplica el cristal X1 y da los relojes de las CPU, los VDP y la SCSP."
    libro: ["saturn#16", "saturn#79"]
    widget:
      tipo: figura
      consola: { maquina: saturn, foto: va8 }
      recorte: [500, 800, 600, 400]
      ampliar: 2.5
      zonas:
        - { id: pll, hotspot: pll, rotulo: "Chip pequeño, en el centro" }
        - { id: sh2s, hotspot: sh2s, rotulo: "Chip cuadrado, a la derecha" }
        - { id: vdp1, hotspot: vdp1, rotulo: "Chip cuadrado, a la izquierda" }
    tocar:
      bien: [pll]
      porque:
        sh2s: "Es una CPU: recibe el reloj, no lo genera."
        vdp1: "Es el VDP1: recibe el reloj."
    exito: "El generador de relojes (IC20): un PLL que multiplica el cristal X1."
    escalera:
      - "Es un chip pequeño junto a un cristal metálico."
    solucion: "IC20, junto al cristal X1."

  - id: toque-scsp
    tipo: tocar
    titulo: "El reloj del sonido"
    texto: "Un chip recibe un reloj maestro de 512 veces la frecuencia de muestreo: 22,58 MHz. Tóquelo."
    libro: ["saturn#135", "saturn#14"]
    widget:
      tipo: figura
      consola: { maquina: saturn, foto: va8 }
      ampliar: 2.5
      zonas:
        - { id: scsp, hotspot: scsp, rotulo: "Chip cuadrado, a la izquierda" }
        - { id: m68k, hotspot: m68k, rotulo: "Chip cuadrado, abajo a la izquierda" }
        - { id: vdp2, hotspot: vdp2, rotulo: "Chip cuadrado, a la izquierda del centro" }
    tocar:
      bien: [scsp]
      porque:
        m68k: "Es el 68EC000: ejecuta el programa de sonido, pero el reloj de 512 fs es de la SCSP."
        vdp2: "Es el VDP2: va con el reloj de las CPU."
    exito: "La SCSP: 512 fs = 22,58 MHz, para muestrear a 44,1 kHz."
    escalera:
      - "Es el chip de sonido de Yamaha."
    solucion: "La SCSP (IC17)."

  - id: toque-smpc
    tipo: tocar
    titulo: "Un cristal de 4 MHz"
    texto: "Toque el chip que va con su propio cristal de 4 MHz y lleva el reloj de tiempo real."
    libro: ["saturn#92", "saturn#11"]
    widget:
      tipo: figura
      consola: { maquina: saturn, foto: va8 }
      recorte: [400, 1000, 900, 400]
      ampliar: 2.5
      zonas:
        - { id: smpc, hotspot: smpc, rotulo: "Chip cuadrado, a la izquierda" }
        - { id: wramh, hotspot: wramh, rotulo: "Chip cuadrado, a la derecha" }
        - { id: ipl, hotspot: ipl, rotulo: "Chip alargado, a la derecha del todo" }
    tocar:
      bien: [smpc]
      porque:
        wramh: "Es la WORK RAM-H: no lleva cristal."
        ipl: "Es la ROM de arranque."
    exito: "El SMPC, a 4 MHz: reset, mandos y reloj de tiempo real."
    escalera:
      - "Busque «315-5744»."
    solucion: "El SMPC (IC9)."

  - id: toque-sh1
    tipo: tocar
    titulo: "El reloj del CD"
    texto: "El bloque de CD lleva su propio cristal de 20 MHz. Toque el procesador que va con él."
    libro: ["saturn#20", "saturn#127"]
    widget:
      tipo: figura
      consola: { maquina: saturn, foto: va8 }
      ampliar: 2.5
      zonas:
        - { id: sh1, hotspot: sh1, rotulo: "Chip cuadrado pequeño, arriba a la derecha" }
        - { id: ygr, hotspot: ygr, rotulo: "Chip cuadrado, arriba a la derecha" }
        - { id: scu, hotspot: scu, rotulo: "Chip cuadrado, arriba en el centro" }
    tocar:
      bien: [sh1]
      porque:
        ygr: "Es el YGR019: recibe el reloj del SH-1."
        scu: "Es la SCU: va con el reloj de las CPU."
    exito: "El SH-1, a 20 MHz."
    escalera:
      - "Busque «HD6437097»."
    solucion: "El SH-1 (IC36 en esta placa, SH1-IC101 en la del esquema)."

  - id: toque-modo
    tipo: tocar
    titulo: "Quién cambia la velocidad"
    texto: "El reloj de las CPU y los VDP tiene dos modos (320 y 352 puntos); se pasa de uno a otro con la orden CKCHG352. Toque el chip que la recibe."
    libro: ["saturn#136", "saturn#92"]
    widget:
      tipo: figura
      consola: { maquina: saturn, foto: va8 }
      recorte: [400, 900, 900, 450]
      ampliar: 2.5
      zonas:
        - { id: smpc, hotspot: smpc, rotulo: "Chip cuadrado, a la izquierda" }
        - { id: pll, hotspot: pll, rotulo: "Chip pequeño, arriba" }
        - { id: wramh, hotspot: wramh, rotulo: "Chip cuadrado, a la derecha" }
    tocar:
      bien: [smpc]
      porque:
        pll: "El PLL cambia de frecuencia, pero porque se lo dice otro chip con DOTSEL."
        wramh: "Es la WORK RAM-H."
    exito: "El SMPC: con la orden CKCHG352 le dice al PLL que pase a 28,6364 MHz (NTSC) o 28,4375 MHz (PAL)."
    escalera:
      - "Es el chip que recibe órdenes de las CPU para el reset y los mandos."
    solucion: "El SMPC (IC9)."

  - id: estime-periodo
    tipo: pregunta
    fase: "Estime"
    titulo: "Un ciclo de la SH-2"
    texto: "En el modo de 352 puntos (NTSC) las SH-2 van a 28,6364 MHz. ¿Cuánto dura un ciclo?"
    libro: ["saturn#136"]
    estimar:
      objetivo: "T_352*1e9"
      unidad: ns
      min: 10
      max: 100
      paso: 0.5
      inicio: 80
      tol: 0.05
      rotulo: "1 / 28,6364 MHz"
    exito: "Unos 34,9 ns."
    pistas:
      - { cuando: { valor: estimacion, mayor: 36.6 }, texto: "Demasiado largo: 1 / 28,6364 MHz." }
      - { texto: "Demasiado corto: 1 / 28,6364 MHz." }

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: ["saturn#16", "saturn#136", "saturn#135", "saturn#127"]
    ideas:
      - { titulo: "El PLL.", texto: "De X1 saca el reloj de las CPU, los VDP y la SCSP." }
      - { titulo: "Dos modos.", texto: "320 o 352 puntos, los elige el SMPC." }
      - { titulo: "El sonido.", texto: "512 fs: 22,58 MHz para 44,1 kHz." }
      - { titulo: "Cristales propios.", texto: "4 MHz el SMPC y 20 MHz el SH-1 del CD." }
