# Lección de la sección 13.8 «Flux: Tipos, Función y Limpieza» (cap13). Formato: contenido/lecciones11/GUIA.md.
# El circuito es un EJEMPLO para el residuo no-clean del bloque 204 («caminos de fuga de gigaohmios» en circuitos de
# muy alta impedancia): un divisor de 12 V con dos resistencias iguales (10 kΩ, 1 MΩ o 100 MΩ) y la fuga del residuo,
# 1 GΩ, en paralelo con la de abajo. 1.2.1 (aprender haciendo): poner el residuo, calcular su error en alta
# impedancia, subir la impedancia hasta que importe, tocar la función, el flux culpable y los casos de flux
# adicional. Dos preguntas: la junta que no moja y por qué limpiar un no-clean.
# 1.2.1, segunda pasada: sin listas de respuestas disfrazadas; quedan las tarjetas que se hacen y dos preguntas.
# 1.3 (contenido13b): +leer la corriente de fuga del residuo en alta impedancia y +tocar la función que falta
# en la fig-13.12 (bloque 200): 3/5 → 5/7.
leccion: cap13/sec-13.8

libro:
  197: "El flux no es un pegamento ni un lubricante"
  202: "Los tipos y sus consecuencias"
  207: "Las presentaciones"
  209: "Líquido, en bote con pincel o en pluma"
  212: "Cuándo hace falta flux adicional"
  214: "Desoldar cualquier cosa (sección 13.5)"
  219: "Y una advertencia sobre los limpiadores de contactos y los"
  198: "Disuelve los óxidos existentes sobre el cobre y sobre el propio estaño."
  199: "Impide que se formen nuevos."
  200: "Reduce la tensión superficial del estaño fundido"
  201: "el flux se agota"
  203: "feo pero inofensivo"
  204: "puede formar caminos de fuga de gigaohmios que sí importan"
  205: "Si no se limpia, la placa se corroe en semanas."
  206: "Nunca se usa en electrónica."
  208: "insuficiente para desoldar, para retrabajos y para la técnica de arrastre"
  210: "el más práctico para SMD"
  213: "Con soldadura normal de componentes nuevos, el del hilo basta."
  216: "poder inspeccionar la junta"
  218: "alcohol isopropílico y un cepillo de cerdas duras"
  222: "Las tres funciones simultáneas del flux"

modelo:
  valores:
    V_in: { sim: "V", nombre: "tensión de alimentación", unidad: V, valor: 12 }
    R_h: { sim: "R", nombre: "resistencia de cada rama", unidad: Ω, valor: 10000 }
    R_f: { sim: "R_{fuga}", nombre: "fuga del residuo", unidad: Ω, valor: 1000000000 }
    f_on: { tipo: interruptor, nombre: "residuo de flux sin limpiar", valor: 0 }
  calculos:
    R_ab: { si: f_on, entonces: "par(R_h, R_f)", sino: "R_h", sim: "R_{abajo}", nombre: "rama de abajo con la fuga", unidad: Ω }
    V_out: { expr: "V_in*R_ab/(R_h + R_ab)", sim: "V_{salida}", nombre: "tensión de salida", unidad: V }
    I: { expr: "V_in/(R_h + R_ab)", sim: "I", nombre: "corriente", unidad: A }
    I_f: { si: f_on, entonces: "V_out/R_f", sino: "0", sim: "I_{fuga}", nombre: "corriente de fuga", unidad: A }
    e_f: { expr: "(V_in/2 - V_out)/(V_in/2)*100", sim: "error", nombre: "error por la fuga", unidad: "%", cifras: 2 }

tarjetas:
  - id: explore-residuo
    tipo: explorar
    titulo: "Un residuo que conduce un poco"
    texto: "El residuo no-clean deja una fuga de gigaohmios en paralelo con R. Póngalo y mire cuánto cambia la salida."
    nota: "Divisor de ejemplo."
    libro: [204]
    fijar: { R_h: 10000 }
    widget:
      tipo: circuito
      esquema: divisor
      piezas: { fuente: V_in, arriba: R_h, abajo: R_h, carga: R_f, interruptor: f_on }
      lectura: { valor: V_out, rotulo: "Tensión de salida" }
      datos:
        - { valor: e_f, rotulo: "Error: {{e_f}}" }
      corriente: I
      mide: { salida: V_out, corriente: I, carga: I_f }
      mandos:
        - { valor: f_on, tipo: interruptor, rotulo: "Residuo de flux" }
    objetivo:
      condiciones:
        - { valor: f_on, min: 1, rotulo: "Residuo puesto" }
      logrado: "Con ramas de 10 kΩ, la fuga de 1 GΩ apenas se nota: {{e_f}} de error."
      pistas:
        - { texto: "Ponga el residuo de flux." }
    escalera:
      - "El interruptor de debajo deja el residuo."
    solucion: "Con 10 kΩ, el error es despreciable."

  - id: prediga-alta-impedancia
    tipo: simular
    titulo: "En alta impedancia"
    texto: "Ahora cada rama es de 100 MΩ y queda el residuo de 1 GΩ. ¿Cuánto error pone en la salida?"
    libro: [204]
    fijar: { R_h: 100000000, f_on: 1 }
    simular:
      objetivo: e_f
      unidad: "%"
      tol: 0.05
      rotulo: "Error por la fuga"
      errores:
        - { expr: "0.01", texto: "Ese sería con ramas pequeñas: con 100 MΩ, 1 GΩ en paralelo ya se nota." }
        - { expr: "50", texto: "La mitad sería un corto: 1 GΩ es diez veces la rama, no cero." }
    exito: "Un 4,76 %: 5,71 V en lugar de 6 V. El residuo no-clean sigue ahí."
    escalera:
      - "La rama de abajo queda en 100 MΩ ‖ 1 GΩ = 90,9 MΩ."
    solucion: "Un 4,76 %: 5,71 V en lugar de 6 V."
    comprobar:
      - { e_f: 4.76, V_out: 5.71, R_ab: 90909091, tol: 0.002 }
      - { con: { f_on: 0 }, V_out: 6 }

  - id: sorpresa-impedancia
    tipo: sorpresa
    titulo: "Solo importa en alta impedancia"
    texto: "Con el residuo puesto, suba la resistencia de las ramas hasta que el error se note de verdad."
    libro: [204, 216]
    fijar: { f_on: 1 }
    inicio: { R_h: 10000 }
    widget:
      tipo: circuito
      esquema: divisor
      piezas: { fuente: V_in, arriba: R_h, abajo: R_h, carga: R_f, interruptor: f_on }
      lectura: { valor: e_f, rotulo: "Error por la fuga" }
      corriente: I
      mide: { salida: V_out, corriente: I, carga: I_f }
      mandos:
        - { valor: R_h, lista: [10000, 1000000, 100000000], rotulo: "R de cada rama" }
    objetivo:
      condiciones:
        - { valor: e_f, min: 4, rotulo: "Error: {{e_f}}" }
      logrado: "Con ramas de {{R_h}}, la misma fuga da {{e_f}}: en alta impedancia, el residuo sí importa."
      pistas:
        - { texto: "Suba la resistencia de las ramas." }
    escalera:
      - "La fuga pesa cuando las ramas se acercan a su valor."
    solucion: "Con las ramas más altas, el error se dispara."

  - id: lea-fuga
    tipo: leer
    titulo: "Lo que se va por el residuo"
    texto: "Ramas de 100 MΩ y el residuo puesto. Meta el amperímetro en la rama del residuo y escriba la corriente de fuga."
    nota: "Divisor de ejemplo."
    libro: [204]
    fijar: { R_h: 100000000, f_on: 1 }
    widget:
      tipo: circuito
      esquema: divisor
      piezas: { fuente: V_in, arriba: R_h, abajo: R_h, carga: R_f, interruptor: f_on }
      mide: { salida: V_out, corriente: I, carga: I_f }
      instrumento: { tipo: multimetro, modos: [A] }
      mandos: []
    leer:
      objetivo: I_f
      unidad: A
      tol: 0.03
      rotulo: "Corriente de fuga"
      medida: { rama: vcarga }
      errores:
        - { expr: "I", texto: "Esa es la corriente de la fuente: el amperímetro estaba en la rama de arriba." }
    exito: "{{I_f}}: unos nanoamperios, la décima parte de lo que pasa por la rama de abajo, y bastan para bajar la salida a {{V_out}}."
    escalera:
      - "La fuga es la rama que cuelga de la salida, en paralelo con la resistencia de abajo."
    solucion: "5,71 V / 1 GΩ: unos 5,7 nA."
    comprobar:
      - { I_f: 5.714e-9, tol: 0.002 }

  - id: toque-funcion
    tipo: tocar
    titulo: "Una bola que no se extiende"
    texto: "El estaño fundido se queda en bola sobre el pad en lugar de extenderse. Toque la función del flux que está faltando."
    libro: [198, 199, 200, 222]
    widget:
      tipo: figura
      figura: fig-13.12
      zonas:
        - { id: oxidos, rotulo: "Primera función", rect: [4, 4, 135, 86] }
        - { id: aisla, rotulo: "Segunda función", rect: [150, 4, 140, 86] }
        - { id: tension, rotulo: "Tercera función", rect: [300, 4, 148, 86] }
    tocar:
      bien: [tension]
      porque:
        oxidos: "Disolver los óxidos deja el cobre limpio para mojar; la forma de la gota depende de la tensión superficial."
        aisla: "Aislar del oxígeno impide que se formen óxidos nuevos; no cambia la forma de la gota."
    exito: "Reducir la tensión superficial: con flux, el estaño se extiende en cono; sin él, se queda en bola."
    escalera:
      - "¿Qué decide si una gota se extiende o se queda redonda?"
    solucion: "La tercera: reduce la tensión superficial."

  - id: se-agota
    tipo: pregunta
    titulo: "Una junta que no moja"
    texto: "Lleva tres segundos calentando y la junta no moja. ¿Qué hace?"
    libro: [201]
    fijar: { R_h: 10000, f_on: 0 }
    widget:
      tipo: circuito
      esquema: divisor
      piezas: { fuente: V_in, arriba: R_h, abajo: R_h, carga: R_f, interruptor: f_on }
      lectura: { valor: V_out, rotulo: "Tensión de salida" }
      mide: { salida: V_out, corriente: I }
    opciones:
      - texto: "Retirar, limpiar y aplicar flux fresco"
        bien: true
        porque: "El flux se consume con los óxidos y se evapora con el calor; agotado, ya no moja."
      - texto: "Seguir calentando hasta que moje"
        porque: "Una junta que no moja tras dos o tres segundos no va a mojar."
      - texto: "Subir la temperatura de la punta"
        porque: "Más calor agota antes el flux."
    escalera:
      - "¿Qué le pasa al flux con el calor y el tiempo?"
    solucion: "Retirar, limpiar y flux fresco."

  - id: por-que-limpiar
    tipo: porque
    titulo: "¿Por qué limpiar un no-clean?"
    texto: "Su nombre dice que no hace falta limpiarlo. ¿Por qué merece hacerlo a veces?"
    libro: [204, 216]
    fijar: { R_h: 100000000, f_on: 1 }
    widget:
      tipo: circuito
      esquema: divisor
      piezas: { fuente: V_in, arriba: R_h, abajo: R_h, carga: R_f, interruptor: f_on }
      lectura: { valor: e_f, rotulo: "Error por la fuga" }
      mide: { salida: V_out, corriente: I, carga: I_f }
    opciones:
      - texto: "Por la fuga en alta impedancia y para poder inspeccionar la junta"
        bien: true
        porque: "El residuo sigue ahí: conduce gigaohmios y tapa grietas y poros."
      - texto: "Porque corroe la placa en semanas"
        porque: "Ese es el soluble en agua; el no-clean no es corrosivo."
      - texto: "Porque es conductor como un cable"
        porque: "Conduce muy poco: solo importa donde las resistencias son enormes."
    escalera:
      - "Recuerde el error con ramas pequeñas y con ramas de 100 MΩ."
    solucion: "Fugas en alta impedancia e inspección."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [198, 201, 204, 205, 197, 199, 200, 202, 203, 206, 207, 208, 209, 210, 212, 213, 214, 218, 219]
    ideas:
      - { titulo: "Tres funciones.", texto: "Disuelve óxidos, impide los nuevos y baja la tensión superficial." }
      - { titulo: "Se agota.", texto: "Si no moja en dos o tres segundos: retirar, limpiar y flux fresco." }
      - { titulo: "Los tipos.", texto: "Colofonia y no-clean, limpieza opcional; soluble en agua, obligatoria; el ácido, nunca." }
      - { titulo: "Alta impedancia.", texto: "Hasta el residuo no-clean cuenta: allí se limpia." }
