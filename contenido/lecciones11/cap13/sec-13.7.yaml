# Lección de la sección 13.7 «La Transición sin Plomo y sus Consecuencias» (cap13). Formato: contenido/lecciones11/GUIA.md.
# La gráfica es un perfil de refusión de EJEMPLO (los tiempos son ilustrativos: rampa hasta 150 °C en 60 s, remojo
# hasta 200 °C a los 150 s, pico a los 180 s mantenido hasta los 200 s y enfriamiento en 100 s). El pico sin plomo
# es el de la sección 13.9 (unos 240 °C con SAC305, cap13#240); con plomo, el mismo perfil 35 °C más bajo (el libro:
# «sube unos 30 a 40 °C»). El límite del componente es el de 260 °C (sección 13.11, cap13#296). 1.2.1 (aprender
# haciendo): pasar a sin plomo hasta el margen estrecho, leerlo, tocar el cambio que agrieta, lo que el horno no
# corrige, lo que lo resolvió y dónde buscar la fatiga. Dos preguntas: el mecanismo y de quién fue la culpa.
# 1.2.1, segunda pasada: sin listas de respuestas disfrazadas; quedan las tarjetas que se hacen y dos preguntas.
# 1.3 (contenido13): vuelven, haciendo, el mecanismo de fatiga (tocar en la fig-13.11), cómo se resolvió (bajar la amplitud
# del ciclado con Coffin–Manson, exponente 2 de la sección 47.4: cap46#122), el ensayo acelerado (1000 ciclos = 16 000
# encendidos, cap46#123) y la junta agrietada (tocar en la fig-13.15): 2/4 → 6/7.
leccion: cap13/sec-13.7

libro:
  164: "Qué cambió exactamente"
  176: "La reparación casera que ilustra el mecanismo"
  178: "Es un buen recordatorio de la sección 55.15"
  179: "Cómo se resolvió de verdad"
  181: "Reducir el ciclado térmico, con mejor disipación y con"
  182: "Alivio mecánico"
  183: "Aleaciones mejoradas, con formulaciones más dúctiles que"
  184: "Cualificación con ciclado térmico como ensayo obligatorio"
  185: "Lo que queda para quien repara hoy"
  187: "La temperatura de la punta cambia"
  188: "El aspecto normal es distinto"
  189: "Los bigotes de estaño volvieron a ser un problema al"
  190: "En el banco"
  191: "La comprobación que enseña la diferencia en cinco minutos"
  192: "La de plomo queda brillante y lisa"
  165: "funden alrededor de 217 °C"
  166: "Treinta y cuatro grados no parecen mucho."
  167: "El perfil de refusión sube unos 30 a 40 °C"
  168: "La ventana de proceso se estrecha."
  169: "La junta es más rígida y menos dúctil."
  170: "El mojado es peor"
  172: "grietas en las juntas de encapsulados grandes"
  173: "tienen coeficientes de dilatación distintos"
  174: "era más lento porque el material admitía más deformación plástica"
  175: "no fue un fallo de la soldadura sin plomo en sí"
  177: "con resultados temporales"
  180: "No volviendo atrás —la normativa siguió— sino cambiando el diseño"
  186: "mezclarlas produce juntas de composición intermedia"
  193: "el daño se acumula a lo largo de cientos o miles de ciclos"
  "cap13#240": "unos 240 °C con SAC305"
  "cap13#296": "260 °C durante 10 s como máximo en la patilla"
  194: "Perfiles de refusión con y sin plomo, y el mecanismo de fatiga de la junta"
  "cap13#286": "Los nueve defectos de soldadura con su aspecto, su causa y su consecuencia"
  "cap46#122": "con un exponente de alrededor de 2 para el estaño-plomo"
  "cap46#123": "Mil ciclos de ensayo equivalen así a unos 16 000 encendidos"

modelo:
  valores:
    T_pk: { sim: "T_{pico}", nombre: "pico del perfil sin plomo", unidad: "°C", valor: 240 }
    s_p: { tipo: interruptor, nombre: "aleación sin plomo", valor: 1 }
    L_c: { sim: "T_{máx}", nombre: "temperatura que tolera la patilla", unidad: "°C", valor: 260 }
    D_T: { sim: "ΔT", nombre: "amplitud de cada ciclo", unidad: "°C", valor: 100 }
    D_0: { sim: "ΔT₀", nombre: "amplitud del ciclo de ensayo", unidad: "°C", valor: 100 }
    n_cm: { sim: "n", nombre: "exponente de Coffin–Manson del estaño-plomo", unidad: "", valor: 2 }
    N_e: { sim: "N", nombre: "ciclos de ensayo", unidad: "", valor: 1000 }
    D_d: { sim: "ΔT", nombre: "amplitud de un encendido diario", unidad: "°C", valor: 25 }
  calculos:
    d_p: { expr: "35*(1 - s_p)", sim: "Δ", nombre: "descenso del perfil con plomo", unidad: "°C" }
    T_pico: { expr: "T_pk - d_p", sim: "T_{pico}", nombre: "pico del perfil", unidad: "°C" }
    M_v: { expr: "L_c - T_pico", sim: "margen", nombre: "margen hasta el límite del componente", unidad: "°C" }
    k_d: { expr: "(D_T/D_0)^n_cm", sim: "daño", nombre: "daño de cada ciclo frente al de 100 °C", unidad: "", cifras: 3 }
    N_eq: { expr: "N_e*(D_0/D_d)^n_cm", sim: "N_{eq}", nombre: "encendidos diarios equivalentes", unidad: "" }
    N_1: { expr: "N_e*D_0/D_d", sim: "N", nombre: "sin elevar al exponente", unidad: "" }

tarjetas:
  - id: explore-perfil
    tipo: explorar
    titulo: "El perfil sube"
    texto: "Pase de con plomo a sin plomo hasta que quede poco margen a los 260 °C que tolera la patilla."
    nota: "Perfil de ejemplo: los tiempos son ilustrativos."
    libro: [167, "cap13#240", "cap13#296"]
    widget:
      tipo: grafica
      x: { id: t, min: 0, max: 320, unidad: s, rotulo: "t" }
      y: { min: 0, max: 300, unidad: "°C", rotulo: "placa" }
      curvas:
        - { expr: "25 + 125*min(1, max(0, t/60)) + 50*min(1, max(0, (t - 60)/90)) + (T_pk - 200)*min(1, max(0, (t - 150)/30)) - (T_pk - 25)*min(1, max(0, (t - 200)/100)) - d_p*(min(1, max(0, t/60)) - min(1, max(0, (t - 200)/100)))", color: naranja, rotulo: "perfil" }
        - { expr: "L_c", color: tinta, rotulo: "límite del componente", discontinua: true }
      lectura: { valor: M_v, rotulo: "Margen hasta 260 °C" }
      datos:
        - { valor: T_pico, rotulo: "Pico: {{T_pico}}" }
      mandos:
        - { valor: s_p, tipo: interruptor, rotulo: "Sin plomo" }
    inicio: { s_p: 0 }
    objetivo:
      condiciones:
        - { valor: M_v, max: 25, rotulo: "Margen: {{M_v}}" }
      logrado: "Con el pico en {{T_pico}}, solo quedan {{M_v}} hasta el límite: piezas que iban holgadas trabajan cerca de él."
      pistas:
        - { texto: "Pase a la aleación sin plomo." }
    escalera:
      - "Sin plomo, el perfil sube unos 30 a 40 °C."
    solucion: "Sin plomo: pico en 240 °C."

  - id: prediga-ventana
    tipo: leer
    titulo: "Lo que queda de ventana"
    texto: "Sin plomo, lea en la gráfica cuántos grados quedan entre el pico del perfil y el límite del componente."
    libro: [165, 166, 167, 168]
    fijar: { s_p: 1 }
    widget:
      tipo: grafica
      x: { id: t, min: 0, max: 320, unidad: s, rotulo: "t" }
      y: { min: 0, max: 300, unidad: "°C", rotulo: "placa" }
      curvas:
        - { expr: "25 + 125*min(1, max(0, t/60)) + 50*min(1, max(0, (t - 60)/90)) + (T_pk - 200)*min(1, max(0, (t - 150)/30)) - (T_pk - 25)*min(1, max(0, (t - 200)/100)) - d_p*(min(1, max(0, t/60)) - min(1, max(0, (t - 200)/100)))", color: naranja, rotulo: "perfil" }
        - { expr: "L_c", color: tinta, rotulo: "límite del componente", discontinua: true }
      lectura: { valor: M_v, rotulo: "Margen hasta 260 °C" }
      mandos: []
    leer:
      objetivo: M_v
      unidad: "°C"
      tol: 0.1
      rotulo: "Margen hasta el límite"
      errores:
        - { expr: "55", texto: "Ese era el margen con plomo: sin plomo el pico está más arriba." }
        - { expr: "T_pico", texto: "Esa es la altura del pico; el margen es lo que falta hasta el límite." }
    exito: "Unos 20 °C: la ventana se estrecha, y el control del perfil pasa de recomendable a crítico."
    escalera:
      - "Reste el pico de la línea del límite."
    solucion: "260 − 240 = 20 °C."
    comprobar:
      - { M_v: 20 }
      - { con: { s_p: 0 }, M_v: 55 }

  - id: mecanismo
    tipo: tocar
    titulo: "La oleada de fallos"
    texto: "Tras meses de encender y apagar, se agrietan las juntas de los procesadores gráficos. La placa dilata más que el encapsulado: toque cuándo queda cizallada la junta."
    libro: [172, 173, 194]
    widget:
      tipo: figura
      figura: fig-13.11
      zonas:
        - { id: perfiles, rotulo: "Gráfica de la izquierda", rect: [5, 15, 260, 165] }
        - { id: frio, rotulo: "Dibujo de la izquierda", rect: [292, 62, 70, 68] }
        - { id: caliente, rotulo: "Dibujo de la derecha", rect: [365, 62, 80, 68] }
    tocar:
      bien: [caliente]
      porque:
        perfiles: "Son los perfiles de soldadura: la fatiga viene después, en cada encendido."
        frio: "En frío, encapsulado y placa están alineados y la junta, recta."
    exito: "En caliente: silicio, encapsulado y placa dilatan distinto y la junta se deforma en cada ciclo, hasta agrietarse. La sin plomo, más rígida, lo admite peor."
    escalera:
      - "Busque la junta inclinada."
    solucion: "El dibujo de la derecha, en caliente."

  - id: por-que-culpa
    tipo: porque
    titulo: "¿Fue culpa del sin plomo?"
    texto: "Las juntas sin plomo se agrietaban. ¿Por qué el libro dice que no fue un fallo de la soldadura en sí?"
    libro: [174, 175]
    fijar: { s_p: 1 }
    widget:
      tipo: grafica
      x: { id: t, min: 0, max: 320, unidad: s, rotulo: "t" }
      y: { min: 0, max: 300, unidad: "°C", rotulo: "placa" }
      curvas:
        - { expr: "25 + 125*min(1, max(0, t/60)) + 50*min(1, max(0, (t - 60)/90)) + (T_pk - 200)*min(1, max(0, (t - 150)/30)) - (T_pk - 25)*min(1, max(0, (t - 200)/100)) - d_p*(min(1, max(0, t/60)) - min(1, max(0, (t - 200)/100)))", color: naranja, rotulo: "perfil" }
    opciones:
      - texto: "Los diseños estaban hechos para el material anterior y no se revisaron"
        bien: true
        porque: "El mecanismo ya existía con plomo, más lento; diseños al límite pasaron a fallar dentro de su vida."
      - texto: "Porque los fallos eran de los condensadores"
        porque: "Fallaban las juntas de los encapsulados grandes."
      - texto: "Porque el sin plomo es más resistente"
        porque: "Es más rígido y menos dúctil: acumula fatiga."
    escalera:
      - "¿Existía la fatiga con estaño-plomo?"
    solucion: "Diseños dimensionados para la aleación anterior."

  - id: explore-ciclado
    tipo: explorar
    titulo: "Cómo se resolvió: menos ciclado"
    texto: "La fatiga la gobierna la amplitud de cada ciclo, con exponente de alrededor de 2. Baje la amplitud hasta que cada ciclo dañe 16 veces menos que uno de 100 °C."
    libro: [181, "cap46#122", "cap46#123"]
    inicio: { D_T: 100 }
    widget:
      tipo: grafica
      x: { id: dt, min: 0, max: 110, unidad: "°C", rotulo: "ΔT" }
      y: { min: 0, max: 1.2, unidad: "", rotulo: "daño por ciclo, relativo" }
      curvas:
        - { expr: "(dt/D_0)^n_cm", color: naranja, rotulo: "daño por ciclo" }
      marcas:
        - { x: "D_T", y: "k_d", rotulo: "{{k_d}}" }
      lectura: { valor: k_d, rotulo: "Daño frente a 100 °C" }
      mandos:
        - { valor: D_T, lista: [25, 50, 75, 100], rotulo: "Amplitud de cada ciclo" }
    objetivo:
      condiciones:
        - { valor: k_d, max: 0.0626, rotulo: "Daño: {{k_d}}" }
      logrado: "Con {{D_T}}, un dieciseisavo: la cuarta parte de amplitud, dieciséis veces menos daño. Mejor disipación y menos excursiones de temperatura alargan la vida de la junta."
      pistas:
        - { texto: "Aún daña de más: baje la amplitud." }
    escalera:
      - "Con exponente 2, la mitad de amplitud daña la cuarta parte."
    solucion: "25 °C: (25/100)² = 1/16."
    comprobar:
      - { k_d: 1 }
      - { con: { D_T: 25 }, k_d: 0.0625 }
      - { con: { D_T: 50 }, k_d: 0.25 }

  - id: simule-ensayo
    tipo: simular
    titulo: "En el banco no se ve en cinco minutos"
    texto: "Un ensayo hace 1000 ciclos de 100 °C; un equipo que se enciende cada día, ciclos de 25 °C. Con exponente 2, ¿a cuántos encendidos diarios equivale el ensayo?"
    libro: [193, "cap46#122", "cap46#123"]
    simular:
      objetivo: N_eq
      unidad: ""
      tol: 0.02
      rotulo: "Encendidos equivalentes"
      errores:
        - { expr: "N_1", texto: "Ha usado la razón de amplitudes sin elevarla al cuadrado: con exponente 2, cada ciclo de 100 °C daña 16 veces más." }
    exito: "Unos 16 000: más de cuarenta años de uso diario. Por eso unas flexiones en el banco no agrietan una junta sana: el daño se acumula en cientos o miles de ciclos."
    escalera:
      - "Cada ciclo de ensayo daña (100/25)² veces más que uno diario."
    solucion: "1000 × (100/25)² = 16 000."
    comprobar:
      - { N_eq: 16000, N_1: 4000, N_e: 1000 }

  - id: toque-agrietada
    tipo: tocar
    titulo: "Lo que se ve años después"
    texto: "Un regulador lleva años encendiéndose y apagándose, y ahora falla cuando se calienta. Toque el defecto que buscar en sus juntas."
    libro: [193, "cap13#286"]
    widget:
      tipo: figura
      figura: fig-13.15
      zonas:
        - { id: fria, rotulo: "Recuadro de arriba en el centro", rect: [153, 2, 147, 78] }
        - { id: seca, rotulo: "Segunda fila, a la derecha", rect: [304, 84, 148, 78] }
        - { id: agrietada, rotulo: "Tercera fila, a la izquierda", rect: [2, 166, 148, 79] }
        - { id: bolas, rotulo: "Tercera fila, a la derecha", rect: [304, 166, 148, 79] }
    tocar:
      bien: [agrietada]
      porque:
        fria: "Una junta fría lo es desde el principio: poco calor o movimiento al soldar."
        seca: "La insuficiente es de poco estaño al soldar, no de años de uso."
        bolas: "Las bolas de estaño vienen de la humedad en la pasta, al soldar."
    exito: "La agrietada: fatiga térmica, con el aro oscuro alrededor de la patilla. Resoldarla sin corregir la causa solo aplaza el fallo."
    escalera:
      - "Busque el defecto cuya causa es la fatiga."
    solucion: "La agrietada, en la tercera fila a la izquierda."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [167, 169, 175, 186, 164, 170, 176, 177, 178, 179, 180, 181, 182, 183, 184, 185, 187, 188, 189, 190, 191, 192, 193]
    ideas:
      - { titulo: "Más alto, menos margen.", texto: "El perfil sube 30 a 40 °C hacia el mismo límite del componente." }
      - { titulo: "Fatiga.", texto: "La junta sin plomo, más rígida, se agrieta antes con el ciclado térmico." }
      - { titulo: "La lección.", texto: "Fallaron diseños hechos para el material anterior; se resolvió rediseñando." }
      - { titulo: "Hoy.", texto: "Conviven las dos aleaciones: no mezclarlas y juzgar cada una por su aspecto normal." }
