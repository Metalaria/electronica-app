# Lección 1.2 de la sección 13.9 «Reflujo, Pasta y Aire Caliente» (cap13). Formato: contenido/lecciones11/GUIA.md.
# La gráfica es un perfil de refusión de EJEMPLO con las temperaturas del libro (precalentamiento hasta unos 150 °C,
# remojo de 150 a 200 °C, reflujo por encima de la fusión, unos 240 °C con SAC305; fusión de la SAC305, 217 °C,
# sección 13.6) y tiempos ilustrativos: rampa hasta 150 °C en 60 s, remojo hasta los 150 s, subida al pico en 30 s,
# pico hasta los 200 s y enfriamiento en 100 s. El tiempo sobre la fusión sale de esas rectas; la banda de 30 a 60 s
# es la del libro (bloque 240).
leccion: cap13/sec-13.9

libro:
  226: "se aplica pasta de soldadura a todas las almohadillas, se colocan los componentes y se calienta el conjunto"
  231: "hay que dejarla llegar a temperatura ambiente cerrada antes de abrirla, o condensa humedad"
  235: "poner demasiada pasta, que produce puentes entre patillas"
  238: "Precalentamiento, hasta unos 150 °C con una rampa suave: evita el choque térmico"
  239: "Remojo, entre 150 y 200 °C: iguala la temperatura de toda la placa"
  240: "unos 240 °C con SAC305 (sección 13.6)— durante 30 a 60 segundos"
  241: "Enfriamiento controlado"
  242: "el tiempo por encima del punto de fusión es corto y crítico"
  247: "hay que caracterizarlo con un termopar antes de fiarse"
  250: "el ladrón de estaño, que recoge el exceso que si no formaría un puente"
  252: "un desequilibrio térmico entre las dos almohadillas"
  253: "Puentes: exceso de pasta."
  254: "Bolas de soldadura dispersas: pasta vieja o rampa demasiado rápida."
  255: "Juntas mates y granuladas, que en sin plomo pueden ser normales"
  "cap13#133": "Funden en torno a 217–220 °C"

modelo:
  valores:
    T_pk: { sim: "T_{pico}", nombre: "temperatura de pico", unidad: "°C", valor: 240 }
    T_f: { sim: "T_{fusión}", nombre: "fusión de la SAC305", unidad: "°C", valor: 217 }
  calculos:
    t_up: { expr: "150 + 30*(T_f - 200)/(T_pk - 200)", sim: "t_{sube}", nombre: "instante en que cruza la fusión al subir", unidad: s }
    t_dn: { expr: "200 + (T_pk - T_f)*100/(T_pk - 25)", sim: "t_{baja}", nombre: "instante en que la cruza al bajar", unidad: s }
    t_al: { expr: "t_dn - t_up", sim: "t_{sobre}", nombre: "tiempo sobre la fusión", unidad: s }

tarjetas:
  - id: explore-perfil
    tipo: explorar
    titulo: "Las cuatro fases"
    texto: "El perfil sube, se mantiene, pasa la fusión y se enfría. Cambie el pico y mire el tiempo por encima de la fusión."
    nota: "Tiempos de ejemplo."
    libro: [238, 239, 240, 241, "cap13#133"]
    widget:
      tipo: grafica
      x: { id: t, min: 0, max: 320, unidad: s, rotulo: "t" }
      y: { min: 0, max: 300, unidad: "°C", rotulo: "placa" }
      curvas:
        - { expr: "25 + 125*min(1, max(0, t/60)) + 50*min(1, max(0, (t - 60)/90)) + (T_pk - 200)*min(1, max(0, (t - 150)/30)) - (T_pk - 25)*min(1, max(0, (t - 200)/100))", color: naranja, rotulo: "perfil" }
        - { expr: "T_f", color: tinta, rotulo: "fusión", discontinua: true }
      marcas:
        - { x: "t_up", y: "T_f", rotulo: "Funde" }
        - { x: "t_dn", y: "T_f", rotulo: "Solidifica" }
      lectura: { valor: t_al, rotulo: "Tiempo sobre la fusión" }
      mandos:
        - { valor: T_pk, lista: [225, 240, 255], rotulo: "Pico" }
    requiere: { mover: [T_pk] }

  - id: ordene-fases
    tipo: pregunta
    fase: "Ordene"
    titulo: "Cada fase, su razón"
    texto: "Ponga en orden las fases del perfil térmico."
    libro: [238, 239, 240, 241]
    ordenar:
      - "Precalentamiento hasta unos 150 °C: evita el choque térmico."
      - "Remojo entre 150 y 200 °C: iguala la temperatura de la placa."
      - "Reflujo por encima de la fusión, de 30 a 60 s: suelda."
      - "Enfriamiento controlado: ni tensiones ni granos grandes."
    exito: "Cada fase tiene una razón; la soldadura ocurre solo en el reflujo."
    pistas:
      - { texto: "Antes de fundir, toda la placa debe estar a la misma temperatura." }
    escalera:
      - "Las temperaturas van subiendo: 150, luego 200, luego la fusión."
    solucion: "Precalentamiento, remojo, reflujo y enfriamiento."

  - id: prediga-remojo
    tipo: predecir
    titulo: "Para qué el remojo"
    texto: "Entre 150 y 200 °C el perfil se mantiene. ¿Qué consigue esa fase?"
    libro: [239]
    fijar: { T_pk: 240 }
    widget:
      tipo: grafica
      x: { id: t, min: 0, max: 320, unidad: s, rotulo: "t" }
      y: { min: 0, max: 300, unidad: "°C", rotulo: "placa" }
      curvas:
        - { expr: "25 + 125*min(1, max(0, t/60)) + 50*min(1, max(0, (t - 60)/90)) + (T_pk - 200)*min(1, max(0, (t - 150)/30)) - (T_pk - 25)*min(1, max(0, (t - 200)/100))", color: naranja, rotulo: "perfil" }
      lectura: { valor: t_al, rotulo: "Tiempo sobre la fusión" }
      ocultar: true
    opciones:
      - texto: "Igualar la placa: grandes y pequeños llegan igual al reflujo, y el flux limpia"
        bien: true
        porque: "Un componente grande y uno pequeño llegan al reflujo a la misma temperatura gracias a esta fase."
      - texto: "Soldar los componentes pequeños antes"
        porque: "Aún no se ha llegado a la fusión: no suelda nada."
      - texto: "Enfriar después del pico"
        porque: "El remojo va antes del reflujo, no después."
    escalera:
      - "¿Qué pasaría si un componente grande y uno pequeño llegaran a distinta temperatura?"
    solucion: "Iguala la temperatura y el flux limpia los óxidos."

  - id: ajuste-pico
    tipo: ajuste
    titulo: "Ajuste el pico"
    texto: "Mueva el pico hasta que el tiempo sobre la fusión quede entre 30 y 60 s."
    libro: [240, 242]
    inicio: { T_pk: 220 }
    widget:
      tipo: grafica
      x: { id: t, min: 0, max: 320, unidad: s, rotulo: "t" }
      y: { min: 0, max: 300, unidad: "°C", rotulo: "placa" }
      curvas:
        - { expr: "25 + 125*min(1, max(0, t/60)) + 50*min(1, max(0, (t - 60)/90)) + (T_pk - 200)*min(1, max(0, (t - 150)/30)) - (T_pk - 25)*min(1, max(0, (t - 200)/100))", color: naranja, rotulo: "perfil" }
        - { expr: "T_f", color: tinta, rotulo: "fusión", discontinua: true }
      marcas:
        - { x: "t_up", y: "T_f", rotulo: "Funde" }
        - { x: "t_dn", y: "T_f", rotulo: "Solidifica" }
      mandos:
        - { valor: T_pk, min: 218, max: 280, paso: 1, rotulo: "Pico" }
    ajuste:
      valor: t_al
      min: 30
      max: 60
      rotulo: "Tiempo sobre la fusión"
      escala: { min: 0, max: 90 }
      bajo: "Poco tiempo: no mojará. Suba el pico."
      alto: "Demasiado tiempo: se dañan componentes y placa. Baje el pico."
      dentro: "Dentro de la banda del libro."

  - id: pasta-frio
    tipo: pregunta
    titulo: "La pasta, de la nevera al banco"
    texto: "La pasta se guarda en frío. ¿Cómo se abre para usarla?"
    libro: [231]
    widget:
      tipo: grafica
      x: { id: t, min: 0, max: 320, unidad: s, rotulo: "t" }
      y: { min: 0, max: 300, unidad: "°C", rotulo: "placa" }
      curvas:
        - { expr: "25 + 125*min(1, max(0, t/60)) + 50*min(1, max(0, (t - 60)/90)) + (T_pk - 200)*min(1, max(0, (t - 150)/30)) - (T_pk - 25)*min(1, max(0, (t - 200)/100))", color: naranja, rotulo: "perfil" }
    opciones:
      - texto: "Dejándola llegar cerrada a temperatura ambiente"
        bien: true
        porque: "Abierta en frío condensa humedad; y una pasta mal conservada deja bolas sueltas."
      - texto: "Abriéndola en frío, recién sacada"
        porque: "Condensa humedad, que luego da bolas de soldadura."
      - texto: "Calentándola con el aire caliente"
        porque: "Se separaría; basta con dejarla atemperar cerrada."
    escalera:
      - "¿Qué le pasa a algo frío expuesto al aire húmedo?"
    solucion: "Cerrada, hasta temperatura ambiente."

  - id: defectos-reflujo
    tipo: pregunta
    fase: "Empareje"
    titulo: "Los defectos del reflujo"
    texto: "Una cada defecto con su causa habitual."
    libro: [252, 253, 254, 255, 235]
    emparejar:
      - ["Tombstoning", "Las dos almohadillas, térmicamente desiguales"]
      - ["Puentes", "Exceso de pasta"]
      - ["Bolas dispersas", "Pasta vieja o rampa demasiado rápida"]
      - ["Juntas mates y granuladas", "En sin plomo, pueden ser normales"]
    exito: "En reflujo, casi todos se previenen con la pasta y el diseño de los pads."
    pistas:
      - { texto: "El tombstoning nace de que un extremo funde antes que el otro." }
    escalera:
      - "Demasiada pasta produce puentes entre patillas."
    solucion: "Lápida: pads desiguales; puentes: pasta; bolas: pasta vieja o rampa; mate: normal sin plomo."

  - id: por-que-tiempo
    tipo: porque
    titulo: "¿Por qué es crítico el tiempo sobre la fusión?"
    texto: "El pico se puede ajustar. ¿Por qué importa tanto el tiempo que el perfil pasa por encima de la fusión?"
    libro: [242]
    fijar: { T_pk: 240 }
    widget:
      tipo: grafica
      x: { id: t, min: 0, max: 320, unidad: s, rotulo: "t" }
      y: { min: 0, max: 300, unidad: "°C", rotulo: "placa" }
      curvas:
        - { expr: "25 + 125*min(1, max(0, t/60)) + 50*min(1, max(0, (t - 60)/90)) + (T_pk - 200)*min(1, max(0, (t - 150)/30)) - (T_pk - 25)*min(1, max(0, (t - 200)/100))", color: naranja, rotulo: "perfil" }
        - { expr: "T_f", color: tinta, rotulo: "fusión", discontinua: true }
      lectura: { valor: t_al, rotulo: "Tiempo sobre la fusión" }
    opciones:
      - texto: "Poco tiempo y no moja; mucho, y se dañan componentes y placa"
        bien: true
        porque: "Es la regla que resume el perfil: corto y crítico."
      - texto: "Porque la pasta se evapora si no"
        porque: "Lo que se agota es el flux; el límite de arriba lo ponen componentes y placa."
      - texto: "No importa: basta con llegar al pico"
        porque: "La soldadura ocurre durante ese tiempo: si es corto, no moja."
    escalera:
      - "¿Qué falla por cada lado de la banda de 30 a 60 s?"
    solucion: "Poco no moja; mucho daña."

  - id: ladron
    tipo: pregunta
    titulo: "El pad de más"
    texto: "En soldadura por ola, cada fila de patillas acaba en un pad sin patilla. ¿Para qué sirve?"
    libro: [250]
    widget:
      tipo: grafica
      x: { id: t, min: 0, max: 320, unidad: s, rotulo: "t" }
      y: { min: 0, max: 300, unidad: "°C", rotulo: "placa" }
      curvas:
        - { expr: "25 + 125*min(1, max(0, t/60)) + 50*min(1, max(0, (t - 60)/90)) + (T_pk - 200)*min(1, max(0, (t - 150)/30)) - (T_pk - 25)*min(1, max(0, (t - 200)/100))", color: naranja, rotulo: "perfil" }
    opciones:
      - texto: "Es el ladrón de estaño: recoge el exceso que formaría un puente"
        bien: true
        porque: "Por eso las filas van paralelas al avance de la ola."
      - texto: "Es un punto de prueba"
        porque: "Los puntos de prueba van en señales que medir; este está al final de la fila."
      - texto: "Sujeta el componente contra la ola"
        porque: "Lo que sujeta los SMD de la cara inferior es un punto de adhesivo."
    escalera:
      - "Al final de una fila se acumula el estaño sobrante."
    solucion: "El ladrón de estaño: evita el puente."

  - id: horno-casero
    tipo: pregunta
    titulo: "Un horno de sobremesa"
    texto: "Ha modificado un horno de sobremesa con control de temperatura. ¿Qué hace antes de fiarse?"
    libro: [247]
    widget:
      tipo: grafica
      x: { id: t, min: 0, max: 320, unidad: s, rotulo: "t" }
      y: { min: 0, max: 300, unidad: "°C", rotulo: "placa" }
      curvas:
        - { expr: "25 + 125*min(1, max(0, t/60)) + 50*min(1, max(0, (t - 60)/90)) + (T_pk - 200)*min(1, max(0, (t - 150)/30)) - (T_pk - 25)*min(1, max(0, (t - 200)/100))", color: naranja, rotulo: "perfil" }
    opciones:
      - texto: "Caracterizarlo con un termopar"
        bien: true
        porque: "Su limitación es la uniformidad: los bordes se calientan distinto que el centro."
      - texto: "Nada: el control ya sigue el perfil"
        porque: "El control mide en un punto; la placa no se calienta igual en todas partes."
      - texto: "Subir el pico por si acaso"
        porque: "Más tiempo sobre la fusión daña componentes y placa."
    escalera:
      - "¿Se calienta igual el borde que el centro?"
    solucion: "Caracterizarlo con un termopar."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [226, 239, 242, 253]
    ideas:
      - { titulo: "Reflujo.", texto: "Pasta en las almohadillas, componentes encima y calor para todo el conjunto." }
      - { titulo: "Cuatro fases.", texto: "Precalentar, igualar, fundir y enfriar, cada una por una razón." }
      - { titulo: "Corto y crítico.", texto: "De 30 a 60 s sobre la fusión: menos no moja, más daña." }
      - { titulo: "La pasta.", texto: "Atemperada antes de abrir y en su justa medida: el exceso da puentes." }
