# Lección de la sección 13.9 «Reflujo, Pasta y Aire Caliente» (cap13). Formato: contenido/lecciones11/GUIA.md.
# La gráfica es un perfil de refusión de EJEMPLO con las temperaturas del libro (precalentamiento hasta unos 150 °C,
# remojo de 150 a 200 °C, reflujo por encima de la fusión, unos 240 °C con SAC305; fusión de la SAC305, 217 °C,
# sección 13.6) y tiempos ilustrativos: rampa hasta 150 °C en 60 s, remojo hasta los 150 s, subida al pico en 30 s,
# pico hasta los 200 s y enfriamiento en 100 s. El tiempo sobre la fusión sale de esas rectas; la banda de 30 a 60 s
# es la del libro (bloque 240). 1.2.1 (aprender haciendo): poner el pico del libro, marcar dónde funde, ordenar las
# fases por su razón, ajustar el tiempo sobre la fusión, tocar la causa de las bolas y el ladrón de estaño. Dos
# preguntas: la pasta fría y el horno casero.
# 1.2.1, segunda pasada: sin listas de respuestas disfrazadas; quedan las tarjetas que se hacen y dos preguntas.
# 1.3 (contenido13b): +marcar dónde vuelve a cruzar la fusión al enfriarse y +tocar la fase de las bolas dispersas
# (fig-13.14, bloque 254): 3/5 → 5/7.
leccion: cap13/sec-13.9

libro:
  228: "Es una suspensión de microesferas de aleación en flux"
  237: "El calentamiento no es directo"
  248: "La soldadura por ola"
  249: "Los componentes de inserción se sueldan en serie de otra"
  251: "Los defectos característicos"
  259: "El perfil térmico de reflujo con sus cuatro fases"
  226: "se aplica pasta de soldadura a todas las almohadillas, se colocan los componentes y se calienta el conjunto"
  231: "hay que dejarla llegar a temperatura ambiente cerrada antes de abrirla, o condensa humedad"
  235: "poner demasiada pasta, que produce puentes entre patillas"
  238: "Precalentamiento, hasta unos 150 °C con una rampa suave: evita el choque térmico"
  239: "Remojo, entre 150 y 200 °C: iguala la temperatura de toda la placa"
  240: "unos 240 °C con SAC305 (sección 13.6)— durante 30 a 60 segundos"
  241: "Enfriamiento controlado"
  242: "el tiempo por encima del punto de fusión es corto y crítico"
  247: "hay que caracterizarlo con un termopar antes de fiarse"
  250: "el ladrón de estaño, que recoge el exceso que si no formaría un puente"
  252: "un desequilibrio térmico entre las dos almohadillas"
  253: "Puentes: exceso de pasta."
  254: "Bolas de soldadura dispersas: pasta vieja o rampa demasiado rápida."
  255: "Juntas mates y granuladas, que en sin plomo pueden ser normales"
  "cap13#133": "Funden en torno a 217–220 °C"

modelo:
  valores:
    T_pk: { sim: "T_{pico}", nombre: "temperatura de pico", unidad: "°C", valor: 240 }
    T_f: { sim: "T_{fusión}", nombre: "fusión de la SAC305", unidad: "°C", valor: 217 }
  calculos:
    t_up: { expr: "150 + 30*(T_f - 200)/(T_pk - 200)", sim: "t_{sube}", nombre: "instante en que cruza la fusión al subir", unidad: s }
    t_dn: { expr: "200 + (T_pk - T_f)*100/(T_pk - 25)", sim: "t_{baja}", nombre: "instante en que la cruza al bajar", unidad: s }
    t_al: { expr: "t_dn - t_up", sim: "t_{sobre}", nombre: "tiempo sobre la fusión", unidad: s }

tarjetas:
  - id: explore-perfil
    tipo: explorar
    titulo: "Las cuatro fases"
    texto: "El perfil sube, se mantiene, pasa la fusión y se enfría. Ponga el pico que da el libro para SAC305 y mire el tiempo por encima de la fusión."
    nota: "Tiempos de ejemplo."
    libro: [238, 239, 240, 241, "cap13#133"]
    widget:
      tipo: grafica
      x: { id: t, min: 0, max: 320, unidad: s, rotulo: "t" }
      y: { min: 0, max: 300, unidad: "°C", rotulo: "placa" }
      curvas:
        - { expr: "25 + 125*min(1, max(0, t/60)) + 50*min(1, max(0, (t - 60)/90)) + (T_pk - 200)*min(1, max(0, (t - 150)/30)) - (T_pk - 25)*min(1, max(0, (t - 200)/100))", color: naranja, rotulo: "perfil" }
        - { expr: "T_f", color: tinta, rotulo: "fusión", discontinua: true }
      marcas:
        - { x: "t_up", y: "T_f", rotulo: "Funde" }
        - { x: "t_dn", y: "T_f", rotulo: "Solidifica" }
      lectura: { valor: t_al, rotulo: "Tiempo sobre la fusión" }
      mandos:
        - { valor: T_pk, lista: [225, 240, 255], rotulo: "Pico" }
    inicio: { T_pk: 225 }
    objetivo:
      condiciones:
        - { valor: T_pk, objetivo: 240, tol: 0.01, rotulo: "Pico: {{T_pk}}" }
      logrado: "Con el pico de la SAC305, {{T_pk}}, el perfil pasa {{t_al}} sobre la fusión: entre funde y solidifica."
      pistas:
        - { texto: "Elija el pico del libro para SAC305." }
    escalera:
      - "El libro da unos 240 °C con SAC305."
    solucion: "Pico de 240 °C."

  - id: marque-funde
    tipo: marcar
    titulo: "Donde empieza el reflujo"
    texto: "Marque en el perfil el instante en que la placa cruza la fusión al subir: ahí empieza la soldadura."
    libro: [240]
    fijar: { T_pk: 240 }
    widget:
      tipo: grafica
      x: { id: t, min: 0, max: 320, unidad: s, rotulo: "t" }
      y: { min: 0, max: 300, unidad: "°C", rotulo: "placa" }
      curvas:
        - { expr: "25 + 125*min(1, max(0, t/60)) + 50*min(1, max(0, (t - 60)/90)) + (T_pk - 200)*min(1, max(0, (t - 150)/30)) - (T_pk - 25)*min(1, max(0, (t - 200)/100))", color: naranja, rotulo: "perfil" }
        - { expr: "T_f", color: tinta, rotulo: "fusión", discontinua: true }
      mandos: []
    marcar:
      modo: x
      curva: 0
      x: "t_up"
      tol: 0.02
      inicio: { x: 60, y: 0 }
      rotulo: "Funde"
    pistas:
      - { cuando: { valor: marca_x, menor: 150 }, texto: "Ahí aún está en el remojo, por debajo de 200 °C: más a la derecha." }
      - { texto: "Ya ha pasado la fusión: más a la izquierda, en la subida al pico." }
    exito: "En la subida al pico, tras el remojo: desde ahí empieza a contar el tiempo sobre la fusión."
    escalera:
      - "Busque dónde la curva naranja corta la línea discontinua al subir."
    solucion: "Hacia los 163 s, en la subida al pico."
    comprobar:
      - { t_up: 162.75, tol: 0.01 }

  - id: marque-solidifica
    tipo: marcar
    titulo: "Donde termina el reflujo"
    texto: "Marque ahora el instante en que la placa vuelve a cruzar la fusión al enfriarse: ahí termina el tiempo crítico."
    libro: [240, 242]
    fijar: { T_pk: 240 }
    widget:
      tipo: grafica
      x: { id: t, min: 0, max: 320, unidad: s, rotulo: "t" }
      y: { min: 0, max: 300, unidad: "°C", rotulo: "placa" }
      curvas:
        - { expr: "25 + 125*min(1, max(0, t/60)) + 50*min(1, max(0, (t - 60)/90)) + (T_pk - 200)*min(1, max(0, (t - 150)/30)) - (T_pk - 25)*min(1, max(0, (t - 200)/100))", color: naranja, rotulo: "perfil" }
        - { expr: "T_f", color: tinta, rotulo: "fusión", discontinua: true }
      mandos: []
    marcar:
      modo: x
      curva: 0
      x: "t_dn"
      tol: 0.02
      inicio: { x: 60, y: 0 }
      rotulo: "Solidifica"
    pistas:
      - { cuando: { valor: marca_x, menor: 200 }, texto: "Ahí aún sube o está en el pico: más a la derecha, en la bajada." }
      - { texto: "Ya está por debajo de la fusión: más a la izquierda, al empezar la bajada." }
    exito: "Hacia los {{t_dn}}: entre los dos cruces quedan {{t_al}} sobre la fusión, dentro de los 30 a 60 s."
    escalera:
      - "Busque dónde la curva naranja corta la línea discontinua al bajar."
    solucion: "Hacia los 211 s, al empezar el enfriamiento."
    comprobar:
      - { t_dn: 210.7, tol: 0.01 }

  - id: ajuste-pico
    tipo: ajuste
    titulo: "Ajuste el pico"
    texto: "Mueva el pico hasta que el tiempo sobre la fusión quede entre 30 y 60 s."
    libro: [240, 242]
    inicio: { T_pk: 220 }
    widget:
      tipo: grafica
      x: { id: t, min: 0, max: 320, unidad: s, rotulo: "t" }
      y: { min: 0, max: 300, unidad: "°C", rotulo: "placa" }
      curvas:
        - { expr: "25 + 125*min(1, max(0, t/60)) + 50*min(1, max(0, (t - 60)/90)) + (T_pk - 200)*min(1, max(0, (t - 150)/30)) - (T_pk - 25)*min(1, max(0, (t - 200)/100))", color: naranja, rotulo: "perfil" }
        - { expr: "T_f", color: tinta, rotulo: "fusión", discontinua: true }
      marcas:
        - { x: "t_up", y: "T_f", rotulo: "Funde" }
        - { x: "t_dn", y: "T_f", rotulo: "Solidifica" }
      mandos:
        - { valor: T_pk, min: 218, max: 280, paso: 1, rotulo: "Pico" }
    ajuste:
      valor: t_al
      min: 30
      max: 60
      rotulo: "Tiempo sobre la fusión"
      escala: { min: 0, max: 90 }
      bajo: "Poco tiempo: no mojará. Suba el pico."
      alto: "Demasiado tiempo: se dañan componentes y placa. Baje el pico."
      dentro: "Dentro de la banda del libro."

  - id: toque-bolas
    tipo: tocar
    titulo: "Bolas dispersas"
    texto: "Tras el horno aparecen bolas de soldadura dispersas, y la pasta es nueva. Toque la fase del perfil que hay que corregir."
    libro: [238, 254, 259]
    widget:
      tipo: figura
      figura: fig-13.14
      zonas:
        - { id: pre, rotulo: "Primera fase", rect: [38, 4, 100, 172] }
        - { id: remojo, rotulo: "Segunda fase", rect: [140, 4, 118, 172] }
        - { id: reflujo, rotulo: "Tercera fase", rect: [262, 4, 86, 172] }
        - { id: frio, rotulo: "Cuarta fase", rect: [352, 4, 90, 172] }
    tocar:
      bien: [pre]
      porque:
        remojo: "El remojo iguala la temperatura de la placa; las bolas vienen de subir demasiado deprisa antes."
        reflujo: "En el reflujo la pasta ya funde; las bolas dispersas vienen de antes: pasta vieja o rampa demasiado rápida."
        frio: "El enfriamiento llega cuando ya ha fundido; las bolas dispersas vienen de pasta vieja o de una rampa demasiado rápida."
    exito: "El precalentamiento: con pasta buena, las bolas dispersas son una rampa demasiado rápida. Debe subir suave hasta unos 150 °C."
    escalera:
      - "Con la pasta descartada, queda la rampa."
    solucion: "La primera fase: el precalentamiento."

  - id: pasta-frio
    tipo: pregunta
    titulo: "La pasta, de la nevera al banco"
    texto: "La pasta se guarda en frío. ¿Cómo se abre para usarla?"
    libro: [231]
    widget:
      tipo: grafica
      x: { id: t, min: 0, max: 320, unidad: s, rotulo: "t" }
      y: { min: 0, max: 300, unidad: "°C", rotulo: "placa" }
      curvas:
        - { expr: "25 + 125*min(1, max(0, t/60)) + 50*min(1, max(0, (t - 60)/90)) + (T_pk - 200)*min(1, max(0, (t - 150)/30)) - (T_pk - 25)*min(1, max(0, (t - 200)/100))", color: naranja, rotulo: "perfil" }
    opciones:
      - texto: "Dejándola llegar cerrada a temperatura ambiente"
        bien: true
        porque: "Abierta en frío condensa humedad; y una pasta mal conservada deja bolas sueltas."
      - texto: "Abriéndola en frío, recién sacada"
        porque: "Condensa humedad, que luego da bolas de soldadura."
      - texto: "Calentándola con el aire caliente"
        porque: "Se separaría; basta con dejarla atemperar cerrada."
    escalera:
      - "¿Qué le pasa a algo frío expuesto al aire húmedo?"
    solucion: "Cerrada, hasta temperatura ambiente."

  - id: horno-casero
    tipo: pregunta
    titulo: "Un horno de sobremesa"
    texto: "Ha modificado un horno de sobremesa con control de temperatura. ¿Qué hace antes de fiarse?"
    libro: [247]
    widget:
      tipo: grafica
      x: { id: t, min: 0, max: 320, unidad: s, rotulo: "t" }
      y: { min: 0, max: 300, unidad: "°C", rotulo: "placa" }
      curvas:
        - { expr: "25 + 125*min(1, max(0, t/60)) + 50*min(1, max(0, (t - 60)/90)) + (T_pk - 200)*min(1, max(0, (t - 150)/30)) - (T_pk - 25)*min(1, max(0, (t - 200)/100))", color: naranja, rotulo: "perfil" }
    opciones:
      - texto: "Caracterizarlo con un termopar"
        bien: true
        porque: "Su limitación es la uniformidad: los bordes se calientan distinto que el centro."
      - texto: "Nada: el control ya sigue el perfil"
        porque: "El control mide en un punto; la placa no se calienta igual en todas partes."
      - texto: "Subir el pico por si acaso"
        porque: "Más tiempo sobre la fusión daña componentes y placa."
    escalera:
      - "¿Se calienta igual el borde que el centro?"
    solucion: "Caracterizarlo con un termopar."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [226, 239, 242, 253, 228, 235, 237, 248, 249, 250, 251, 252, 254, 255, 259]
    ideas:
      - { titulo: "Reflujo.", texto: "Pasta en las almohadillas, componentes encima y calor para todo el conjunto." }
      - { titulo: "Cuatro fases.", texto: "Precalentar, igualar, fundir y enfriar, cada una por una razón." }
      - { titulo: "Corto y crítico.", texto: "De 30 a 60 s sobre la fusión: menos no moja, más daña." }
      - { titulo: "La pasta.", texto: "Atemperada antes de abrir y en su justa medida: el exceso da puentes." }
