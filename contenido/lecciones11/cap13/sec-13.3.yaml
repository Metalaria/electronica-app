# Lección de la sección 13.3 «Soldadura Through-Hole (THT) Paso a Paso» (cap13). Formato: contenido/lecciones11/GUIA.md.
# El circuito es un EJEMPLO para ver la soldadura fría de la caja 65 (conduce al principio y falla al golpear o
# mover la placa): una pila de 5 V y una resistencia de 220 Ω soldada, con su junta J dibujada como una resistencia
# en serie. Valores de ejemplo: junta bien hecha 1 mΩ; junta fría, 1 mΩ en reposo y abierta (1 GΩ) al golpear.
# 1.2.1 (aprender haciendo): poner la junta fría y golpear la placa hasta que falle, ordenar los pasos tocando, tocar
# en la figura 13.5 la fría y las que hay que rehacer, y en la 13.4 lo que se retira primero. Dos preguntas: el
# estaño sobre la punta y por qué la fría es la más insidiosa.
# 1.2.1, segunda pasada: sin listas de respuestas disfrazadas; quedan las tarjetas que se hacen y dos preguntas.
leccion: cap13/sec-13.3

libro:
  59: "La soldadura de componentes de orificio pasante es la más"
  60: "Técnica de soldadura THT en cuatro pasos"
  61: "Apoya la punta del soldador tocando A LA VEZ la isla de cobre y la patilla"
  63: "Una buena soldadura tiene forma de cono o volcán, con superficie lisa y brillante"
  64: "fría (mate y grumosa), insuficiente (poco estaño), exceso (bola), puente (cortocircuita islas adyacentes) y sin mojado (el estaño no se adhiere)"
  65: "Si una avería aparece y desaparece al golpear, mover o calentar la placa, sospecha de una soldadura fría."
  "cap13#330": "el estaño se funde por el calor de la punta antes de que la isla y la patilla estén suficientemente calientes"

modelo:
  valores:
    V_j: { sim: "V", nombre: "tensión de la pila", unidad: V, valor: 5 }
    R_r: { sim: "R", nombre: "resistencia soldada", unidad: Ω, valor: 220 }
    j_t: { sim: "junta", nombre: "estado de la junta", unidad: "", valor: 1 }
    g_v: { tipo: interruptor, nombre: "placa golpeada", valor: 0 }
  calculos:
    R_J: { expr: "0.001 + (j_t - 1)*g_v*1000000000", sim: "J", nombre: "resistencia de la junta", unidad: Ω }
    I_j: { expr: "V_j/(R_r + R_J)", sim: "I", nombre: "corriente", unidad: A }
    V_r: { expr: "I_j*R_r", sim: "V_{R}", nombre: "tensión en la resistencia", unidad: V }
    V_J: { expr: "I_j*R_J", sim: "V_{J}", nombre: "tensión en la junta", unidad: V }

tarjetas:
  - id: explore-junta
    tipo: explorar
    titulo: "Una junta, dos acabados"
    texto: "La junta J une la resistencia a la placa. Póngala fría y compare la corriente con la de una bien hecha."
    nota: "Pila, resistencia y junta son un ejemplo."
    libro: [65]
    widget:
      tipo: circuito
      esquema: serie
      piezas: { fuente: V_j, r1: R_r, r2: R_J }
      lectura: { valor: I_j, rotulo: "Corriente" }
      corriente: I_j
      mide: { corriente: I_j, v1: V_r, v2: V_J }
      mandos:
        - { valor: j_t, lista: [1, 2], nombres: [bien hecha, fría], rotulo: "Junta" }
    objetivo:
      condiciones:
        - { valor: j_t, min: 2, rotulo: "Junta fría" }
      logrado: "Con la junta fría, en reposo, la corriente sigue en {{I_j}}: conduce igual. Por eso sale de fábrica."
      pistas:
        - { texto: "Elija la junta fría." }
    escalera:
      - "El mando de debajo cambia el acabado de la junta."
    solucion: "Fría: en reposo conduce igual."

  - id: prediga-estano-punta
    tipo: predecir
    titulo: "El estaño sobre la punta"
    texto: "Se funde el estaño en la punta y se lleva a una unión todavía fría. ¿Qué sale?"
    libro: ["cap13#330", 61]
    fijar: { j_t: 2, g_v: 0 }
    widget:
      tipo: circuito
      esquema: serie
      piezas: { fuente: V_j, r1: R_r, r2: R_J }
      lectura: { valor: I_j, rotulo: "Corriente" }
      mide: { corriente: I_j, v1: V_r, v2: V_J }
      ocultar: true
    opciones:
      - texto: "Una bola sin mojar o una junta fría"
        bien: true
        porque: "Isla y patilla no estaban calientes: el estaño no las moja. Debe fundirlo el calor de la unión."
      - texto: "Un cono perfecto, más rápido"
        porque: "El estaño llega fundido, pero las superficies frías no lo dejan mojar."
      - texto: "Un puente entre islas"
        porque: "El puente viene de exceso de estaño; aquí el fallo es de mojado."
    escalera:
      - "¿Quién debe fundir el estaño: la punta o el calor de la unión?"
    solucion: "Bola sin mojado o junta fría."

  - id: cinco-defectos
    tipo: tocar
    titulo: "La más insidiosa"
    texto: "Una junta mate, grumosa y agrietada: el circuito funciona hasta que se golpea la placa. Tóquela."
    libro: [63, 64, 65]
    widget:
      tipo: figura
      figura: fig-13.5
      zonas:
        - { id: correcta, rotulo: "Arriba a la izquierda", rect: [30, 25, 90, 90] }
        - { id: fria, rotulo: "Arriba en el centro", rect: [180, 25, 90, 90] }
        - { id: insuficiente, rotulo: "Arriba a la derecha", rect: [330, 25, 90, 90] }
        - { id: exceso, rotulo: "Abajo a la izquierda", rect: [30, 160, 90, 95] }
        - { id: puente, rotulo: "Abajo en el centro", rect: [175, 160, 105, 95] }
        - { id: sinmojado, rotulo: "Abajo a la derecha", rect: [330, 160, 90, 95] }
    tocar:
      bien: [fria]
      porque:
        correcta: "Es la buena: cono cóncavo y brillante."
        insuficiente: "Le falta estaño: no cubre la isla, pero no es grumosa."
        exceso: "Es una bola que oculta la unión."
        puente: "Une dos islas vecinas: un cortocircuito, no un fallo intermitente."
        sinmojado: "El estaño no se adhiere a la isla: forma una bola."
    exito: "La fría: si una avería aparece y desaparece al golpear, mover o calentar, sospeche de ella. Se recalienta con flux nuevo o se rehace con malla."
    escalera:
      - "Busque la superficie mate y grumosa."
    solucion: "Arriba en el centro: la fría."

  - id: rehacer
    tipo: tocar
    titulo: "Las que hay que rehacer"
    texto: "Toque todas las juntas de la figura que hay que rehacer."
    libro: [63, 64]
    widget:
      tipo: figura
      figura: fig-13.5
      zonas:
        - { id: correcta, rotulo: "Arriba a la izquierda", rect: [30, 25, 90, 90] }
        - { id: fria, rotulo: "Arriba en el centro", rect: [180, 25, 90, 90] }
        - { id: insuficiente, rotulo: "Arriba a la derecha", rect: [330, 25, 90, 90] }
        - { id: exceso, rotulo: "Abajo a la izquierda", rect: [30, 160, 90, 95] }
        - { id: puente, rotulo: "Abajo en el centro", rect: [175, 160, 105, 95] }
        - { id: sinmojado, rotulo: "Abajo a la derecha", rect: [330, 160, 90, 95] }
    tocar:
      bien: [fria, insuficiente, exceso, puente, sinmojado]
      todas: true
      porque:
        correcta: "Esa es la buena: cono o volcán liso que moja isla y patilla."
    exito: "Las cinco: solo el cono cóncavo que moja isla y patilla es una junta buena. Una bola es defecto por mucho estaño que tenga."
    escalera:
      - "Solo una es un cono cóncavo que moja isla y patilla."
    solucion: "Todas menos la de arriba a la izquierda."

  - id: retirar
    tipo: tocar
    titulo: "Lo que se retira primero"
    texto: "La junta ya ha fluido y formado el cono. Toque lo que se retira primero."
    libro: [60, 61]
    widget:
      tipo: figura
      figura: fig-13.4
      zonas:
        - { id: estano, rotulo: "Hilo, arriba a la izquierda del cuarto dibujo", rect: [334, 24, 44, 48] }
        - { id: soldador, rotulo: "Punta, arriba a la derecha del cuarto dibujo", rect: [400, 24, 46, 56] }
    tocar:
      bien: [estano]
      porque:
        soldador: "El soldador se retira después: si se quita antes, el estaño se solidifica con el hilo dentro."
    exito: "Primero el estaño, luego el soldador, y dos segundos sin mover mientras solidifica."
    escalera:
      - "El calor tiene que seguir mientras se retira el hilo."
    solucion: "El hilo de estaño."

  - id: sorpresa-golpe
    tipo: sorpresa
    titulo: "Funciona hasta que se golpea"
    texto: "La junta es fría y el circuito funciona. Golpee la placa hasta que deje de pasar corriente."
    libro: [65]
    fijar: { j_t: 2 }
    inicio: { g_v: 0 }
    widget:
      tipo: circuito
      esquema: serie
      piezas: { fuente: V_j, r1: R_r, r2: R_J }
      lectura: { valor: I_j, rotulo: "Corriente" }
      datos:
        - { valor: V_J, rotulo: "Tensión en la junta: {{V_J}}" }
      corriente: I_j
      mide: { corriente: I_j, v1: V_r, v2: V_J }
      mandos:
        - { valor: g_v, tipo: interruptor, rotulo: "Golpear la placa" }
    objetivo:
      condiciones:
        - { valor: I_j, max: 0.000001, rotulo: "Corriente: {{I_j}}" }
      logrado: "Al golpear, la junta fría se abre: la corriente cae a {{I_j}}. Un fallo intermitente, muy difícil de diagnosticar."
      pistas:
        - { texto: "Golpee la placa." }
    escalera:
      - "El interruptor de debajo golpea la placa."
    solucion: "Al golpear, la junta fría se abre y no pasa corriente."

  - id: por-que-insidiosa
    tipo: porque
    titulo: "¿Por qué es la más insidiosa?"
    texto: "De todos los defectos, ¿por qué la soldadura fría es el más difícil de cazar?"
    libro: [65]
    fijar: { j_t: 2, g_v: 1 }
    widget:
      tipo: circuito
      esquema: serie
      piezas: { fuente: V_j, r1: R_r, r2: R_J }
      lectura: { valor: I_j, rotulo: "Corriente" }
      mide: { corriente: I_j, v1: V_r, v2: V_J }
    opciones:
      - texto: "Porque funciona al principio y falla luego, de forma intermitente"
        bien: true
        porque: "La unión se degrada con el tiempo o la temperatura, y la avería aparece y desaparece."
      - texto: "Porque no se ve nunca"
        porque: "Sí se ve: mate, grumosa o agrietada. Lo traicionero es que al principio funciona."
      - texto: "Porque destruye el componente"
        porque: "No lo destruye: da un contacto que va y viene."
    escalera:
      - "¿Qué hace el circuito con la placa quieta, y qué al golpearla?"
    solucion: "Funciona al principio y falla de forma intermitente."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [61, 63, 64, 65, 59]
    ideas:
      - { titulo: "El procedimiento.", texto: "Calentar isla y patilla a la vez, el estaño en la unión, y no mover al solidificar." }
      - { titulo: "La forma.", texto: "Un cono liso que moja isla y patilla." }
      - { titulo: "Los defectos.", texto: "Fría, insuficiente, exceso, puente y sin mojado." }
      - { titulo: "La fría.", texto: "Funciona al principio y falla al golpear o calentar: rehacerla con flux." }
