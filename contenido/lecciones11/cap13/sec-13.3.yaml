# Lección 1.2 de la sección 13.3 «Soldadura Through-Hole (THT) Paso a Paso» (cap13). Formato: contenido/lecciones11/GUIA.md.
# El circuito es un EJEMPLO para ver la soldadura fría de la caja 65 (conduce al principio y falla al golpear o
# mover la placa): una pila de 5 V y una resistencia de 220 Ω soldada, con su junta J dibujada como una resistencia
# en serie. Valores de ejemplo: junta bien hecha 1 mΩ; junta fría, 1 mΩ en reposo y abierta (1 GΩ) al golpear.
leccion: cap13/sec-13.3

libro:
  61: "Apoya la punta del soldador tocando A LA VEZ la isla de cobre y la patilla"
  63: "Una buena soldadura tiene forma de cono o volcán, con superficie lisa y brillante"
  64: "fría (mate y grumosa), insuficiente (poco estaño), exceso (bola), puente (cortocircuita islas adyacentes) y sin mojado (el estaño no se adhiere)"
  65: "Si una avería aparece y desaparece al golpear, mover o calentar la placa, sospecha de una soldadura fría."
  "cap13#330": "el estaño se funde por el calor de la punta antes de que la isla y la patilla estén suficientemente calientes"

modelo:
  valores:
    V_j: { sim: "V", nombre: "tensión de la pila", unidad: V, valor: 5 }
    R_r: { sim: "R", nombre: "resistencia soldada", unidad: Ω, valor: 220 }
    j_t: { sim: "junta", nombre: "estado de la junta", unidad: "", valor: 1 }
    g_v: { tipo: interruptor, nombre: "placa golpeada", valor: 0 }
  calculos:
    R_J: { expr: "0.001 + (j_t - 1)*g_v*1000000000", sim: "J", nombre: "resistencia de la junta", unidad: Ω }
    I_j: { expr: "V_j/(R_r + R_J)", sim: "I", nombre: "corriente", unidad: A }
    V_r: { expr: "I_j*R_r", sim: "V_{R}", nombre: "tensión en la resistencia", unidad: V }
    V_J: { expr: "I_j*R_J", sim: "V_{J}", nombre: "tensión en la junta", unidad: V }

tarjetas:
  - id: explore-junta
    tipo: explorar
    titulo: "Una junta, dos acabados"
    texto: "La junta J une la resistencia a la placa. Cambie entre bien hecha y fría, y mire la corriente."
    nota: "Pila, resistencia y junta son un ejemplo."
    libro: [65]
    widget:
      tipo: circuito
      esquema: serie
      piezas: { fuente: V_j, r1: R_r, r2: R_J }
      lectura: { valor: I_j, rotulo: "Corriente" }
      corriente: I_j
      mide: { corriente: I_j, v1: V_r, v2: V_J }
      mandos:
        - { valor: j_t, lista: [1, 2], nombres: [bien hecha, fría], rotulo: "Junta" }
    requiere: { mover: [j_t] }

  - id: prediga-estano-punta
    tipo: predecir
    titulo: "El estaño sobre la punta"
    texto: "Se funde el estaño en la punta y se lleva a una unión todavía fría. ¿Qué sale?"
    libro: ["cap13#330", 61]
    fijar: { j_t: 2, g_v: 0 }
    widget:
      tipo: circuito
      esquema: serie
      piezas: { fuente: V_j, r1: R_r, r2: R_J }
      lectura: { valor: I_j, rotulo: "Corriente" }
      mide: { corriente: I_j, v1: V_r, v2: V_J }
      ocultar: true
    opciones:
      - texto: "Una bola sin mojar o una junta fría"
        bien: true
        porque: "Isla y patilla no estaban calientes: el estaño no las moja. Debe fundirlo el calor de la unión."
      - texto: "Un cono perfecto, más rápido"
        porque: "El estaño llega fundido, pero las superficies frías no lo dejan mojar."
      - texto: "Un puente entre islas"
        porque: "El puente viene de exceso de estaño; aquí el fallo es de mojado."
    escalera:
      - "¿Quién debe fundir el estaño: la punta o el calor de la unión?"
    solucion: "Bola sin mojado o junta fría."

  - id: ordene-pasos
    tipo: pregunta
    fase: "Ordene"
    titulo: "Los seis pasos"
    texto: "Ponga en orden la soldadura de un componente de orificio pasante."
    libro: [61]
    ordenar:
      - "Insertar el componente y doblar un poco las patillas."
      - "Apoyar la punta tocando a la vez la isla y la patilla."
      - "Aplicar el estaño en la unión, no sobre la punta."
      - "Dejar fluir lo justo para el cono y retirar el estaño."
      - "Retirar el soldador sin mover la unión mientras solidifica."
      - "Cortar el exceso de patilla sobre el cono."
    exito: "El estaño se retira antes que el soldador, y la unión no se mueve hasta que solidifica."
    pistas:
      - { texto: "Primero se calienta, después el estaño; y el soldador se retira el último." }
    escalera:
      - "Antes de aplicar estaño, isla y patilla deben estar calientes."
    solucion: "Insertar, calentar ambos, estaño en la unión, fluir y retirar estaño, retirar soldador, cortar."

  - id: cinco-defectos
    tipo: pregunta
    fase: "Empareje"
    titulo: "Los cinco defectos"
    texto: "Una cada aspecto de la figura de los defectos con su nombre."
    libro: [64]
    emparejar:
      - ["Mate y grumosa", "Fría"]
      - ["Poco estaño", "Insuficiente"]
      - ["Una bola", "Exceso"]
      - ["Une islas vecinas", "Puente"]
      - ["El estaño no se adhiere", "Sin mojado"]
    exito: "Reconocerlos a la vista permite detectarlos y corregirlos."
    pistas:
      - { texto: "El puente es el único que cortocircuita dos islas." }
    escalera:
      - "Empiece por los evidentes: la bola es exceso; unir islas es un puente."
    solucion: "Mate: fría; poco: insuficiente; bola: exceso; une islas: puente; no se adhiere: sin mojado."

  - id: forma-buena
    tipo: pregunta
    titulo: "La soldadura perfecta"
    texto: "Con estaño-plomo, ¿qué aspecto tiene una buena junta de orificio pasante?"
    libro: [63]
    fijar: { j_t: 1, g_v: 0 }
    widget:
      tipo: circuito
      esquema: serie
      piezas: { fuente: V_j, r1: R_r, r2: R_J }
      lectura: { valor: I_j, rotulo: "Corriente" }
      mide: { corriente: I_j, v1: V_r, v2: V_J }
    opciones:
      - texto: "Un cono o volcán liso y brillante que moja isla y patilla"
        bien: true
        porque: "Es la forma del mojado completo; con sin plomo el acabado sería mate, sin ser un defecto."
      - texto: "Una bola redonda y brillante"
        porque: "Una bola es exceso de estaño o falta de mojado, por mucho que brille."
      - texto: "Una capa plana y mate"
        porque: "Con estaño-plomo, el mate y grumoso es la firma de la soldadura fría."
    escalera:
      - "¿Qué forma deja el estaño cuando moja la isla y sube por la patilla?"
    solucion: "Cono o volcán liso y brillante."

  - id: sorpresa-golpe
    tipo: sorpresa
    titulo: "Funciona hasta que se golpea"
    texto: "La junta es fría y el circuito funciona. Golpee la placa y mire la corriente."
    libro: [65]
    fijar: { j_t: 2 }
    inicio: { g_v: 0 }
    widget:
      tipo: circuito
      esquema: serie
      piezas: { fuente: V_j, r1: R_r, r2: R_J }
      lectura: { valor: I_j, rotulo: "Corriente" }
      datos:
        - { valor: V_J, rotulo: "Tensión en la junta: {{V_J}}" }
      corriente: I_j
      mide: { corriente: I_j, v1: V_r, v2: V_J }
      mandos:
        - { valor: g_v, tipo: interruptor, rotulo: "Golpear la placa" }
    requiere: { mover: [g_v] }

  - id: por-que-insidiosa
    tipo: porque
    titulo: "¿Por qué es la más insidiosa?"
    texto: "De todos los defectos, ¿por qué la soldadura fría es el más difícil de cazar?"
    libro: [65]
    fijar: { j_t: 2, g_v: 1 }
    widget:
      tipo: circuito
      esquema: serie
      piezas: { fuente: V_j, r1: R_r, r2: R_J }
      lectura: { valor: I_j, rotulo: "Corriente" }
      mide: { corriente: I_j, v1: V_r, v2: V_J }
    opciones:
      - texto: "Porque funciona al principio y falla luego, de forma intermitente"
        bien: true
        porque: "La unión se degrada con el tiempo o la temperatura, y la avería aparece y desaparece."
      - texto: "Porque no se ve nunca"
        porque: "Sí se ve: mate, grumosa o agrietada. Lo traicionero es que al principio funciona."
      - texto: "Porque destruye el componente"
        porque: "No lo destruye: da un contacto que va y viene."
    escalera:
      - "¿Qué hace el circuito con la placa quieta, y qué al golpearla?"
    solucion: "Funciona al principio y falla de forma intermitente."

  - id: reparar-fria
    tipo: pregunta
    titulo: "Cómo se arregla"
    texto: "Ha encontrado una soldadura fría. ¿Qué hace?"
    libro: [65]
    widget:
      tipo: circuito
      esquema: serie
      piezas: { fuente: V_j, r1: R_r, r2: R_J }
      lectura: { valor: I_j, rotulo: "Corriente" }
      mide: { corriente: I_j, v1: V_r, v2: V_J }
    opciones:
      - texto: "Recalentarla con flux nuevo y, si no queda bien, quitar el estaño con malla y rehacerla"
        bien: true
        porque: "El flux nuevo deja mojar; si a la primera no sale, se empieza de cero."
      - texto: "Añadir más estaño encima"
        porque: "Saldría una junta más grande e igual de fría."
      - texto: "Dejarla si ahora conduce"
        porque: "Conducir en reposo no basta: volverá a fallar con la vibración o el calor."
    escalera:
      - "¿Qué le falta a una junta que no ha mojado?"
    solucion: "Recalentar con flux; si no, malla y rehacer."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [61, 63, 64, 65]
    ideas:
      - { titulo: "El procedimiento.", texto: "Calentar isla y patilla a la vez, el estaño en la unión, y no mover al solidificar." }
      - { titulo: "La forma.", texto: "Un cono liso que moja isla y patilla." }
      - { titulo: "Los defectos.", texto: "Fría, insuficiente, exceso, puente y sin mojado." }
      - { titulo: "La fría.", texto: "Funciona al principio y falla al golpear o calentar: rehacerla con flux." }
