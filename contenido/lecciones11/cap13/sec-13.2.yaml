# Lección 1.2 de la sección 13.2 «El Equipo de Soldadura» (cap13). Formato: contenido/lecciones11/GUIA.md.
# La gráfica es cualitativa, como la figura 13.3 (recuperación térmica con y sin control): el libro no da cifras de
# esa caída, así que sus valores son un EJEMPLO y la nota lo dice. Valores de ejemplo: consigna 330 °C (la del
# estaño-plomo, bloque 46); caída de 60 °C con punta de aguja y la mitad con cincel, proporcional a 60 W / potencia;
# con control se recupera con τ = 0,5 s; sin control baja hacia un equilibrio con τ = 1 s y no vuelve.
leccion: cap13/sec-13.2

libro:
  30: "su punta se enfría al tocar la pieza, precisamente cuando hace falta calor"
  31: "Recuperación térmica: cuánto tarda en recuperar la temperatura tras ceder calor."
  32: "una punta fina de aguja tiene poca reserva de calor y se enfría al instante"
  33: "Un soldador de 60 W bien regulado suelda mejor que uno de 100 W sin control."
  35: "una punta de cincel de 2 o 3 mm transfiere el calor mucho mejor"
  36: "Con una punta de aguja, el operario tiende a subir la temperatura y a prolongar el contacto"
  37: "la punta más grande que quepa"
  40: "Estañarla siempre antes de apagar y al encender."
  41: "No limarla ni rascarla"
  42: "Limpiarla en viruta de latón en lugar de en esponja húmeda"
  43: "Bajar la temperatura en las pausas"
  44: "el estaño ya no se adhiere y forma bolas que resbalan"
  46: "350 – 380 °C"
  47: "la temperatura más baja que permita hacer la soldadura en dos o tres segundos"
  49: "los humos son del flux, y son irritantes respiratorios"
  "cap13#155": "El humo de soldar no es del plomo"
  54: "debe fluir y formar el cono cóncavo en dos segundos"
  55: "el problema está casi siempre en la punta"

modelo:
  valores:
    T_0: { sim: "T_{consigna}", nombre: "temperatura ajustada", unidad: "°C", valor: 330 }
    c_on: { tipo: interruptor, nombre: "control de temperatura", valor: 1 }
    p_t: { sim: "punta", nombre: "tipo de punta", unidad: "", valor: 1 }
    P_s: { sim: "P", nombre: "potencia del soldador", unidad: W, valor: 60 }
    t_p: { sim: "t", nombre: "tiempo de la soldadura de prueba", unidad: s, valor: 2 }
  calculos:
    D_t: { expr: "60/p_t*60/P_s", sim: "ΔT", nombre: "caída de la punta (ejemplo)", unidad: "°C" }
    T_2: { expr: "T_0 - D_t*(c_on*4*exp(-3) + (1 - c_on)*(1 - exp(-2)))", sim: "T(2 s)", nombre: "temperatura de la punta a los 2 s", unidad: "°C" }

tarjetas:
  - id: explore-control
    tipo: explorar
    titulo: "La punta toca la junta"
    texto: "La punta toca una junta al empezar. Quite el control de temperatura y cambie la punta."
    nota: "Curva cualitativa con valores de ejemplo, como la figura 13.3."
    libro: [30, 31, 32]
    widget:
      tipo: grafica
      x: { id: t, min: 0, max: 4, unidad: s, rotulo: "t" }
      y: { min: 250, max: 340, unidad: "°C", rotulo: "punta" }
      curvas:
        - { expr: "T_0 - D_t*(c_on*(t/0.5)*exp(1 - t/0.5) + (1 - c_on)*(1 - exp(-t)))", color: naranja, rotulo: "temperatura de la punta" }
        - { expr: "T_0", color: tinta, rotulo: "consigna", discontinua: true }
      lectura: { valor: T_2, rotulo: "Punta a los 2 s" }
      mandos:
        - { valor: c_on, tipo: interruptor, rotulo: "Control de temperatura" }
        - { valor: p_t, lista: [1, 2], nombres: [aguja, cincel], rotulo: "Punta" }
    requiere: { mover: [c_on, p_t] }

  - id: prediga-potencia
    tipo: predecir
    titulo: "¿Más vatios o control?"
    texto: "Uno de 60 W bien regulado frente a uno de 100 W sin control. ¿Cuál suelda mejor?"
    libro: [33]
    fijar: { c_on: 1, p_t: 2, P_s: 60 }
    widget:
      tipo: grafica
      x: { id: t, min: 0, max: 4, unidad: s, rotulo: "t" }
      y: { min: 250, max: 340, unidad: "°C", rotulo: "punta" }
      curvas:
        - { expr: "T_0 - D_t*(c_on*(t/0.5)*exp(1 - t/0.5) + (1 - c_on)*(1 - exp(-t)))", color: naranja, rotulo: "temperatura de la punta" }
      lectura: { valor: T_2, rotulo: "Punta a los 2 s" }
      ocultar: true
    opciones:
      - texto: "El de 60 W regulado"
        bien: true
        porque: "Mantener la temperatura importa más que la potencia: el regulado mide y compensa al ceder calor."
      - texto: "El de 100 W sin control"
        porque: "Sin control, su punta se enfría al tocar la pieza, justo cuando hace falta calor."
      - texto: "Igual: lo que cuenta es la temperatura ajustada"
        porque: "La temperatura ajustada importa menos que la capacidad de mantenerla."
    escalera:
      - "¿Qué pasa con la temperatura de la punta al tocar una junta fría?"
    solucion: "El de 60 W regulado: mantiene la temperatura."

  - id: punta-fina
    tipo: pregunta
    titulo: "La punta para trabajo fino"
    texto: "Hay que soldar componentes pequeños. ¿Qué punta conviene?"
    libro: [35, 36, 37]
    fijar: { c_on: 1, P_s: 60 }
    widget:
      tipo: grafica
      x: { id: t, min: 0, max: 4, unidad: s, rotulo: "t" }
      y: { min: 250, max: 340, unidad: "°C", rotulo: "punta" }
      curvas:
        - { expr: "T_0 - D_t*(c_on*(t/0.5)*exp(1 - t/0.5) + (1 - c_on)*(1 - exp(-t)))", color: naranja, rotulo: "temperatura de la punta" }
      mandos:
        - { valor: p_t, lista: [1, 2], nombres: [aguja, cincel], rotulo: "Punta" }
    opciones:
      - texto: "Un cincel de 2 o 3 mm: la más grande que quepa"
        bien: true
        porque: "Más contacto térmico: el calor llega antes. La aguja queda para donde no cabe otra cosa."
      - texto: "Una aguja: el componente es pequeño"
        porque: "Es la intuición equivocada: con aguja se tiende a subir la temperatura y prolongar el contacto."
      - texto: "Da igual la punta si se sube la temperatura"
        porque: "Subir la temperatura y alargar el contacto son justo las dos cosas que dañan la placa."
    escalera:
      - "¿Qué decide que el calor llegue antes: el tamaño del componente o el contacto?"
    solucion: "Cincel de 2 o 3 mm: la punta más grande que quepa."

  - id: cuidar-punta
    tipo: pregunta
    fase: "Empareje"
    titulo: "Cuidar la punta"
    texto: "Una cada momento con lo que hay que hacer para que la punta dure años."
    libro: [40, 41, 42, 43]
    emparejar:
      - ["Al encender y antes de apagar", "Estañarla"]
      - ["Al limpiarla", "Viruta de latón, no esponja húmeda"]
      - ["Si parece sucia o gastada", "Nunca limarla ni rascarla"]
      - ["En las pausas", "Bajar la temperatura"]
    exito: "El estaño protege el recubrimiento; el choque térmico y la lima lo destruyen."
    pistas:
      - { texto: "La esponja húmeda da un choque térmico en cada limpieza." }
    escalera:
      - "Bajo el recubrimiento de hierro está el cobre, que el estaño disuelve."
    solucion: "Estañar al encender y apagar; latón; nunca limar; bajar en pausas."

  - id: temperatura-sac
    tipo: pregunta
    fase: "Estime"
    titulo: "La punta para sin plomo"
    texto: "¿A qué temperatura se trabaja la punta con SAC305?"
    libro: [46]
    estimar:
      objetivo: "365"
      unidad: "°C"
      min: 250
      max: 450
      paso: 5
      inicio: 300
      tol: 0.042
      rotulo: "Temperatura de punta"
    exito: "Entre 350 y 380 °C; con estaño-plomo, de 300 a 330 °C."
    pistas:
      - { cuando: { valor: estimacion, mayor: 380 }, texto: "Se ha pasado: por encima de 380 °C la punta se oxida deprisa." }
      - { texto: "Se ha quedado corto: eso es para estaño-plomo; el sin plomo pide más." }
    escalera:
      - "Con estaño-plomo se trabaja a 300 – 330 °C, y el sin plomo funde más alto."
    solucion: "De 350 a 380 °C."

  - id: sorpresa-vatios
    tipo: sorpresa
    titulo: "Menos vatios, mejor soldadura"
    texto: "Compare el de 100 W sin control con el de 60 W regulado. Mire la punta a los 2 s."
    nota: "Valores de ejemplo; la conclusión es la del libro."
    libro: [33]
    fijar: { p_t: 2 }
    inicio: { c_on: 0, P_s: 100 }
    widget:
      tipo: grafica
      x: { id: t, min: 0, max: 4, unidad: s, rotulo: "t" }
      y: { min: 250, max: 340, unidad: "°C", rotulo: "punta" }
      curvas:
        - { expr: "T_0 - D_t*(c_on*(t/0.5)*exp(1 - t/0.5) + (1 - c_on)*(1 - exp(-t)))", color: naranja, rotulo: "temperatura de la punta" }
        - { expr: "T_0", color: tinta, rotulo: "consigna", discontinua: true }
      lectura: { valor: T_2, rotulo: "Punta a los 2 s" }
      mandos:
        - { valor: P_s, lista: [60, 100], rotulo: "Potencia" }
        - { valor: c_on, tipo: interruptor, rotulo: "Control de temperatura" }
    requiere: { mover: [P_s, c_on] }

  - id: por-que-punta
    tipo: porque
    titulo: "¿Por qué no subir la temperatura?"
    texto: "La soldadura de prueba tarda y el estaño no moja. ¿Por qué no es la solución subir la temperatura?"
    libro: [47, 55, 44]
    fijar: { c_on: 1, p_t: 2, P_s: 60 }
    widget:
      tipo: grafica
      x: { id: t, min: 0, max: 4, unidad: s, rotulo: "t" }
      y: { min: 250, max: 340, unidad: "°C", rotulo: "punta" }
      curvas:
        - { expr: "T_0 - D_t*(c_on*(t/0.5)*exp(1 - t/0.5) + (1 - c_on)*(1 - exp(-t)))", color: naranja, rotulo: "temperatura de la punta" }
    opciones:
      - texto: "Porque casi siempre falla la punta, oxidada o mal estañada"
        bien: true
        porque: "Una punta que no moja forma bolas que resbalan. Y subir la temperatura acelera su oxidación."
      - texto: "Porque el estaño no aguanta más temperatura"
        porque: "El problema no es el estaño: la punta oxidada no transfiere el calor."
      - texto: "Sí lo es: más temperatura, junta más rápida"
        porque: "El criterio es la temperatura más baja que suelde en dos o tres segundos; subirla arriesga las pistas."
    escalera:
      - "¿Qué es lo primero que la gente sube, y dónde está casi siempre el fallo?"
    solucion: "La punta oxidada o mal estañada, no la temperatura."

  - id: humos
    tipo: pregunta
    titulo: "La aspiración no es opcional"
    texto: "¿De dónde salen los humos al soldar?"
    libro: [49, "cap13#155"]
    widget:
      tipo: grafica
      x: { id: t, min: 0, max: 4, unidad: s, rotulo: "t" }
      y: { min: 250, max: 340, unidad: "°C", rotulo: "punta" }
      curvas:
        - { expr: "T_0 - D_t*(c_on*(t/0.5)*exp(1 - t/0.5) + (1 - c_on)*(1 - exp(-t)))", color: naranja, rotulo: "temperatura de la punta" }
    opciones:
      - texto: "Del flux: son irritantes respiratorios"
        bien: true
        porque: "Por eso hace falta aspiración con cualquier aleación."
      - texto: "Del plomo, que se evapora"
        porque: "El plomo no se evapora a esas temperaturas; su riesgo es la ingestión."
      - texto: "Del cobre de la placa al calentarse"
        porque: "El cobre no humea al soldar: el humo es del flux."
    escalera:
      - "¿Qué componente del hilo de estaño se quema al soldar?"
    solucion: "Del flux."

  - id: banco-prueba
    tipo: banco
    titulo: "La soldadura de prueba"
    texto: "Haga una junta en una placa de descarte y cronometre hasta que el estaño fluya y forme el cono."
    libro: [54, 55]
    banco:
      piezas: ["El soldador que quiere comprobar", "Una placa de descarte", "Hilo de estaño", "Un cronómetro"]
      medir: "El tiempo desde que apoya la punta hasta que se forma el cono cóncavo."
      esperado: t_p
      unidad: s
      tol: 0.5
      consejos:
        - { cuando: { valor: desviacion, mayor: 0.5 }, texto: "Tarda de más: revise la punta, oxidada o mal estañada, antes de subir la temperatura." }
        - { texto: "Bien de tiempo: compruebe además que el cono es cóncavo y moja pad y patilla." }
    comprobar:
      - { t_p: 2 }

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [33, 37, 40, 47]
    ideas:
      - { titulo: "Mantener, no ajustar.", texto: "Importa más mantener la temperatura que la que se ajusta: control y recuperación." }
      - { titulo: "La punta.", texto: "La más grande que quepa; la aguja solo donde no cabe otra." }
      - { titulo: "Su cuidado.", texto: "Estañarla, latón y nunca limarla." }
      - { titulo: "La temperatura.", texto: "La más baja que suelde en dos o tres segundos." }
