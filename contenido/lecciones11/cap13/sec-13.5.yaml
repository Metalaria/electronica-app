# Lección 1.2 de la sección 13.5 «Desoldadura» (cap13). Formato: contenido/lecciones11/GUIA.md.
# La gráfica es el enfriamiento de una patilla al retirar la punta, para ver por qué la aleación de bajo punto de
# fusión (58 °C, bloque 109) mantiene líquidas todas las patillas a la vez. Es un EJEMPLO: enfriamiento exponencial
# hacia 25 °C con τ = 1 s (el libro no da esa constante); las temperaturas de punta son las del libro (300 a 350 °C)
# y las de fusión, 183 °C (estaño-plomo) y 58 °C.
leccion: cap13/sec-13.5

libro:
  100: "al desoldar hay que fundirlo todo a la vez y retirar el componente en esa ventana"
  103: "Es la mejor opción para limpiar pads, eliminar puentes y desoldar componentes de dos terminales."
  104: "la malla debe estar quieta hasta que absorba"
  105: "casi siempre es porque el flux se ha agotado"
  106: "Buena para agujeros metalizados de componentes con patillas"
  107: "Es la herramienta correcta para desoldar integrados con patillas de muchos pines"
  108: "funde todas las juntas simultáneamente"
  109: "la clásica de Chip Quik, a 58 °C"
  117: "Añadir estaño antes de quitarlo."
  118: "Nunca tirar del componente antes de que el estaño esté líquido."
  122: "cortarle las patillas y retirarlas una a una es mucho más seguro para la placa"
  123: "la placa vale más que el componente"
  127: "La comprobación tras una desoldadura complicada es de continuidad"
  "cap13#46": "300 – 330 °C"

modelo:
  valores:
    T_p: { sim: "T_{punta}", nombre: "temperatura de la punta", unidad: "°C", valor: 330 }
    T_m: { sim: "T_{fusión}", nombre: "temperatura de fusión de la junta", unidad: "°C", valor: 183 }
    T_a: { sim: "T_{amb}", nombre: "temperatura ambiente", unidad: "°C", valor: 25 }
    tau_e: { sim: "τ", nombre: "constante de enfriamiento (ejemplo)", unidad: s, valor: 1 }
  calculos:
    t_liq: { expr: "tau_e*ln((T_p - T_a)/(T_m - T_a))", sim: "t_{líquida}", nombre: "tiempo que sigue líquida", unidad: s }

tarjetas:
  - id: explore-enfriamiento
    tipo: explorar
    titulo: "Al retirar la punta"
    texto: "La patilla se enfría al retirar la punta y solidifica al cruzar los 183 °C. Cambie la temperatura de la punta."
    nota: "Enfriamiento de ejemplo."
    libro: [100, "cap13#46"]
    fijar: { T_m: 183 }
    widget:
      tipo: grafica
      x: { id: t, min: 0, max: 4, unidad: s, rotulo: "t" }
      y: { min: 0, max: 360, unidad: "°C", rotulo: "patilla" }
      curvas:
        - { expr: "T_a + (T_p - T_a)*exp(-t/tau_e)", color: naranja, rotulo: "temperatura de la patilla" }
        - { expr: "T_m", color: tinta, rotulo: "fusión", discontinua: true }
      marcas:
        - { x: "t_liq", y: "T_m", rotulo: "Solidifica" }
      lectura: { valor: t_liq, rotulo: "Sigue líquida" }
      mandos:
        - { valor: T_p, lista: [300, 330, 350], rotulo: "Punta" }
    requiere: { mover: [T_p] }

  - id: prediga-bajo-punto
    tipo: predecir
    titulo: "Una aleación que funde a 58 °C"
    texto: "Se mezcla con el estaño de las juntas de un integrado. ¿Qué consigue?"
    libro: [109]
    fijar: { T_m: 58, T_p: 330 }
    widget:
      tipo: grafica
      x: { id: t, min: 0, max: 4, unidad: s, rotulo: "t" }
      y: { min: 0, max: 360, unidad: "°C", rotulo: "patilla" }
      curvas:
        - { expr: "T_a + (T_p - T_a)*exp(-t/tau_e)", color: naranja, rotulo: "temperatura de la patilla" }
        - { expr: "T_m", color: tinta, rotulo: "fusión", discontinua: true }
      lectura: { valor: t_liq, rotulo: "Sigue líquida" }
      ocultar: true
    opciones:
      - texto: "Todas las patillas siguen líquidas a la vez con un solo soldador"
        bien: true
        porque: "Baja el punto de fusión del conjunto: se desliza la punta por la fila y el integrado se levanta."
      - texto: "Soldar después el integrado nuevo con ella"
        porque: "No sirve para soldar de vuelta: hay que limpiar bien sus restos."
      - texto: "Trabajar con la punta a 58 °C"
        porque: "La punta sigue a su temperatura; lo que baja es la fusión de la mezcla."
    escalera:
      - "¿Qué hace falta para levantar un integrado: fundir una patilla o todas a la vez?"
    solucion: "Todas las patillas líquidas a la vez."

  - id: sorpresa-bajo-punto
    tipo: sorpresa
    titulo: "Más de tres veces más tiempo líquida"
    texto: "Cambie la junta de estaño-plomo a la aleación de bajo punto y mire cuánto sigue líquida."
    libro: [109]
    fijar: { T_p: 330 }
    inicio: { T_m: 183 }
    widget:
      tipo: grafica
      x: { id: t, min: 0, max: 4, unidad: s, rotulo: "t" }
      y: { min: 0, max: 360, unidad: "°C", rotulo: "patilla" }
      curvas:
        - { expr: "T_a + (T_p - T_a)*exp(-t/tau_e)", color: naranja, rotulo: "temperatura de la patilla" }
        - { expr: "T_m", color: tinta, rotulo: "fusión", discontinua: true }
      marcas:
        - { x: "t_liq", y: "T_m", rotulo: "Solidifica" }
      lectura: { valor: t_liq, rotulo: "Sigue líquida" }
      mandos:
        - { valor: T_m, lista: [183, 58], nombres: [estaño-plomo, bajo punto de fusión], rotulo: "Junta" }
    requiere: { mover: [T_m] }
    nota: "Mismo enfriamiento de ejemplo."

  - id: herramientas
    tipo: pregunta
    fase: "Empareje"
    titulo: "Cada herramienta, su caso"
    texto: "Una cada herramienta de desoldadura con lo que mejor hace."
    libro: [103, 106, 107, 108]
    emparejar:
      - ["Malla", "Limpiar pads, quitar puentes, dos terminales"]
      - ["Bomba de vacío", "Agujeros metalizados de piezas con patillas"]
      - ["Estación de vacío", "Integrados con patillas de muchos pines"]
      - ["Aire caliente", "SMD de más de dos terminales"]
    exito: "Cada una funde y retira el estaño de otra manera; elegir bien evita levantar pads."
    pistas:
      - { texto: "El aire caliente funde todas las juntas a la vez." }
    escalera:
      - "La malla absorbe por capilaridad: ¿dónde llega mal?"
    solucion: "Malla: pads y puentes; bomba: orificios; estación: muchos pines; aire: SMD."

  - id: malla-no-absorbe
    tipo: pregunta
    titulo: "La malla no absorbe"
    texto: "Apoya la malla y el soldador encima, y el estaño no sube. ¿Qué hace?"
    libro: [104, 105]
    widget:
      tipo: grafica
      x: { id: t, min: 0, max: 4, unidad: s, rotulo: "t" }
      y: { min: 0, max: 360, unidad: "°C", rotulo: "patilla" }
      curvas:
        - { expr: "T_a + (T_p - T_a)*exp(-t/tau_e)", color: naranja, rotulo: "temperatura de la patilla" }
    opciones:
      - texto: "Cortar el trozo usado y añadir flux nuevo"
        bien: true
        porque: "Casi siempre es que el flux se ha agotado."
      - texto: "Apretar y arrastrar la malla"
        porque: "Es el error típico: la malla debe estar quieta hasta que absorba."
      - texto: "Retirar el soldador y luego la malla"
        porque: "Al enfriarse se pega y arranca el pad: se retira con el soldador aún apoyado."
    escalera:
      - "¿Qué lleva impregnado la malla y se consume con el calor?"
    solucion: "Cortar el trozo usado y añadir flux."

  - id: no-tirar
    tipo: pregunta
    titulo: "El componente no sale"
    texto: "Calienta las juntas y el componente no se suelta. ¿Qué hace?"
    libro: [118]
    widget:
      tipo: grafica
      x: { id: t, min: 0, max: 4, unidad: s, rotulo: "t" }
      y: { min: 0, max: 360, unidad: "°C", rotulo: "patilla" }
      curvas:
        - { expr: "T_a + (T_p - T_a)*exp(-t/tau_e)", color: naranja, rotulo: "temperatura de la patilla" }
        - { expr: "T_m", color: tinta, rotulo: "fusión", discontinua: true }
    opciones:
      - texto: "No tirar: algo no ha fundido, y hay que fundirlo"
        bien: true
        porque: "Tirar antes de que el estaño esté líquido es la causa número uno de pads arrancados."
      - texto: "Tirar con más fuerza mientras calienta"
        porque: "Así se arrancan los pads: si no sale solo, algo no ha fundido."
      - texto: "Subir mucho la temperatura y esperar"
        porque: "Más temperatura y más tiempo es justamente lo que levanta los pads."
    escalera:
      - "Si el componente no sale solo, ¿qué indica?"
    solucion: "No tirar: falta fundir algo."

  - id: por-que-anadir
    tipo: porque
    titulo: "¿Por qué añadir estaño para quitarlo?"
    texto: "Para desoldar una junta vieja y oxidada, primero se le añade estaño. ¿Por qué?"
    libro: [117]
    widget:
      tipo: grafica
      x: { id: t, min: 0, max: 4, unidad: s, rotulo: "t" }
      y: { min: 0, max: 360, unidad: "°C", rotulo: "patilla" }
      curvas:
        - { expr: "T_a + (T_p - T_a)*exp(-t/tau_e)", color: naranja, rotulo: "temperatura de la patilla" }
    opciones:
      - texto: "Aporta flux nuevo y mejor contacto térmico: todo funde a la vez"
        bien: true
        porque: "Sin añadir nada hacen falta más temperatura y más tiempo, que levantan los pads."
      - texto: "Para que la malla tenga más que absorber"
        porque: "No es cuestión de cantidad: el estaño fresco trae flux y conduce el calor."
      - texto: "Para bajar el punto de fusión, como el de bajo punto"
        porque: "El estaño normal no baja la fusión; mejora el mojado y la transferencia."
    escalera:
      - "¿Qué trae consigo el hilo de estaño, además del metal?"
    solucion: "Flux nuevo y mejor transferencia de calor."

  - id: sacrificar
    tipo: pregunta
    titulo: "Un DIP averiado"
    texto: "Un integrado DIP está averiado y no se va a reutilizar. ¿Cómo lo saca?"
    libro: [122, 123]
    widget:
      tipo: grafica
      x: { id: t, min: 0, max: 4, unidad: s, rotulo: "t" }
      y: { min: 0, max: 360, unidad: "°C", rotulo: "patilla" }
      curvas:
        - { expr: "T_a + (T_p - T_a)*exp(-t/tau_e)", color: naranja, rotulo: "temperatura de la patilla" }
    opciones:
      - texto: "Cortar las patillas por el cuerpo y sacarlas una a una"
        bien: true
        porque: "Convierte una operación arriesgada en una trivial: la placa vale más que el componente."
      - texto: "Desoldarlo entero con mucho calor"
        porque: "Arriesga la placa por un componente que se tira."
      - texto: "Arrancarlo con unos alicates"
        porque: "Se llevaría pads y pistas."
    escalera:
      - "¿Qué vale más, la placa o un componente averiado?"
    solucion: "Cortar patillas y retirarlas una a una."

  - id: continuidad
    tipo: pregunta
    titulo: "Después de una desoldadura difícil"
    texto: "Ha sustituido un componente tras una desoldadura complicada. ¿Qué comprueba antes de dar la reparación por buena?"
    libro: [127]
    widget:
      tipo: grafica
      x: { id: t, min: 0, max: 4, unidad: s, rotulo: "t" }
      y: { min: 0, max: 360, unidad: "°C", rotulo: "patilla" }
      curvas:
        - { expr: "T_a + (T_p - T_a)*exp(-t/tau_e)", color: naranja, rotulo: "temperatura de la patilla" }
    opciones:
      - texto: "La continuidad de los pads hasta donde deben llegar"
        bien: true
        porque: "Una pista rota bajo un pad levantado da una avería nueva que se atribuye al componente."
      - texto: "Nada: si el componente es nuevo, funciona"
        porque: "La avería nueva puede ser de la placa, no del componente."
      - texto: "Solo el brillo de las juntas nuevas"
        porque: "El brillo no dice si la pista de debajo sigue entera."
    escalera:
      - "¿Qué puede romperse bajo un pad que se ha levantado?"
    solucion: "Continuidad de los pads."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [100, 109, 117, 118]
    ideas:
      - { titulo: "Todo a la vez.", texto: "Desoldar exige fundir todas las juntas en la misma ventana." }
      - { titulo: "La herramienta.", texto: "Malla, bomba, estación de vacío, aire caliente o aleación de bajo punto, según el caso." }
      - { titulo: "Añadir antes de quitar.", texto: "El estaño fresco aporta flux y calor; y nunca tirar en frío." }
      - { titulo: "La placa primero.", texto: "Sacrificar el componente averiado y comprobar continuidad al final." }
