# Lección de la sección 13.4 «Soldadura de Montaje Superficial (SMD)» (cap13). Formato: contenido/lecciones11/GUIA.md.
# El circuito es el divisor del libro (sección 1.4: 12 V, 10 kΩ y 5 kΩ, 4,00 V) montado en SMD; el puente de estaño
# entre las dos islas de R₂ se dibuja como una carga de 1 mΩ en paralelo con ella (valor de ejemplo de un corto).
# 1.2.1 (aprender haciendo): quitar el puente hasta recuperar la salida, tocar el encapsulado de prototipos, ordenar
# tocando los dos procedimientos, tocar el parámetro del aire mal elegido y la inspección del BGA en la foto 13.8.
# Dos preguntas: por qué es más fácil y por qué rehacer el primer pad.
# 1.2.1, segunda pasada: sin listas de respuestas disfrazadas; quedan las tarjetas que se hacen y dos preguntas.
# 1.3 (contenido13): vuelven, haciendo y sobre figuras del libro, la técnica para paso fino (fig-53.34), el puente
# continuo y el flux del arrastre (fig-13.7) y el efecto lápida (fig-13.15): 2/4 → 6/8.
leccion: cap13/sec-13.4

libro:
  70: "Los encapsulados y hasta dónde llega la mano"
  73: "El procedimiento para dos terminales"
  76: "La técnica de arrastre para integrados de paso fino"
  77: "Con un TSSOP o un QFP de paso 0,5 mm, soldar patilla a"
  80: "Aire caliente"
  81: "Para QFN, componentes con almohadilla térmica inferior y"
  97: "El encapsulado BGA"
  68: "soldar SMD a mano es más rápido que soldar componentes con patillas"
  71: "Cómodo: el recomendado para prototipos"
  72: "El 0805 es el punto dulce para trabajo manual"
  74: "Estañar un solo pad, con poca cantidad."
  75: "El paso 4 es el que más se olvida"
  78: "Alinear el chip con cuidado"
  79: "El resultado intermedio parece un desastre —un puente continuo— y no lo es."
  82: "el mínimo que caliente, porque un caudal alto desplaza los componentes pequeños"
  83: "proteger los componentes vecinos con cinta kapton o lámina de aluminio"
  85: "se corrige recalentando ambos a la vez"
  87: "se quitan igual, con malla y no rascando"
  88: "Solo se comprueba por rayos X o por la temperatura en funcionamiento."
  91: "Lo que no hace falta: pulso perfecto"
  "cap01#83": "Con 12 V, 10 kΩ y 5 kΩ, la salida es 4,00 V"
  96: "los cuatro pasos de la técnica de arrastre"
  "cap13#129": "Las cinco técnicas de SMD con soldador"
  "cap13#286": "Los nueve defectos de soldadura con su aspecto, su causa y su consecuencia"

modelo:
  valores:
    V_in: { sim: "V_{entrada}", nombre: "tensión de la pila", unidad: V, valor: 12 }
    R_1: { sim: "R₁", nombre: "resistencia de arriba", unidad: Ω, valor: 10000 }
    R_2: { sim: "R₂", nombre: "resistencia de abajo", unidad: Ω, valor: 5000 }
    R_p: { sim: "puente", nombre: "puente de estaño", unidad: Ω, valor: 0.001 }
    p_on: { tipo: interruptor, nombre: "puente de estaño entre las islas de R₂", valor: 1 }
  calculos:
    R_ab: { si: p_on, entonces: "par(R_2, R_p)", sino: "R_2", sim: "R_{abajo}", nombre: "resistencia de abajo con el puente", unidad: Ω }
    V_out: { expr: "V_in*R_ab/(R_1 + R_ab)", sim: "V_{salida}", nombre: "tensión de salida", unidad: V }
    I: { expr: "V_in/(R_1 + R_ab)", sim: "I", nombre: "corriente", unidad: A }
    I_2: { expr: "V_out/R_2", sim: "I₂", nombre: "corriente por R₂", unidad: A }
    I_p: { si: p_on, entonces: "V_out/R_p", sino: "0", sim: "I_{puente}", nombre: "corriente por el puente", unidad: A }

tarjetas:
  - id: explore-puente
    tipo: explorar
    titulo: "Un puente entre islas"
    texto: "Un puente de estaño une las dos islas de R₂. Quítelo con malla hasta que la salida vuelva a ser la del divisor."
    nota: "El divisor del libro, en SMD."
    libro: [87, "cap01#83"]
    widget:
      tipo: circuito
      esquema: divisor
      piezas: { fuente: V_in, arriba: R_1, abajo: R_2, carga: R_p, interruptor: p_on }
      lectura: { valor: V_out, rotulo: "Tensión de salida" }
      corriente: I
      mide: { salida: V_out, corriente: I, abajo: I_2, carga: I_p }
      mandos:
        - { valor: p_on, tipo: interruptor, rotulo: "Puente de estaño" }
    objetivo:
      condiciones:
        - { valor: V_out, min: 3.9, rotulo: "Salida: {{V_out}}" }
      logrado: "Sin el puente, la salida vuelve a {{V_out}}. Los puentes se quitan con malla y flux, no rascando."
      pistas:
        - { texto: "Quite el puente de estaño." }
    escalera:
      - "Con el puente, R₂ queda en cortocircuito."
    solucion: "Sin puente: 4,00 V."
    comprobar:
      - { con: { p_on: 0 }, V_out: 4.0 }

  - id: mas-facil
    tipo: pregunta
    titulo: "Más fácil de lo que parece"
    texto: "¿Por qué soldar SMD a mano es más rápido que soldar componentes con patillas?"
    libro: [68, 91]
    fijar: { p_on: 0 }
    widget:
      tipo: circuito
      esquema: divisor
      piezas: { fuente: V_in, arriba: R_1, abajo: R_2, carga: R_p, interruptor: p_on }
      lectura: { valor: V_out, rotulo: "Tensión de salida" }
      mide: { salida: V_out, corriente: I }
    opciones:
      - texto: "No hay que insertar ni cortar patillas, y el calor llega antes"
        bien: true
        porque: "Lo que sí hace falta es cambiar la técnica, no el pulso."
      - texto: "No lo es: hace falta pulso de cirujano"
        porque: "Las pinzas sujetan: no hace falta pulso perfecto ni microscopio."
      - texto: "Porque se suelda sin estaño"
        porque: "Se suelda con estaño; lo que cambia es el procedimiento."
    escalera:
      - "Piense en los pasos de una junta THT que aquí desaparecen."
    solucion: "Sin insertar ni cortar, y el calor llega antes."

  - id: toque-tecnica
    tipo: tocar
    titulo: "Paso fino"
    texto: "Con un QFP de paso 0,5 mm, soldar patilla a patilla es lento y produce puentes. Toque la técnica que funciona."
    libro: [77, "cap13#129"]
    widget:
      tipo: figura
      figura: fig-53.34
      zonas:
        - { id: puente, rotulo: "Primer recuadro", rect: [5, 5, 88, 128] }
        - { id: malla, rotulo: "Segundo recuadro", rect: [100, 5, 84, 128] }
        - { id: hilo, rotulo: "Tercer recuadro", rect: [187, 5, 84, 128] }
        - { id: baja, rotulo: "Cuarto recuadro", rect: [274, 5, 84, 128] }
        - { id: arrastre, rotulo: "Quinto recuadro", rect: [361, 5, 86, 128] }
    tocar:
      bien: [arrastre]
      porque:
        puente: "Sirve para dos terminales, de 0805 y 0603; no para una fila de patillas."
        malla: "La malla es para retirar estaño y desoldar, no para soldar la fila."
        hilo: "El hilo de acero bajo las patillas es para desoldar."
        baja: "La aleación de baja fusión es para desoldar todas a la vez."
    exito: "El arrastre: la contraria de soldar patilla a patilla, y sorprende a quien no la conoce. Así se sueldan 0,5 mm con un soldador corriente."
    escalera:
      - "Busque la punta de cincel a lo largo de la fila."
    solucion: "El quinto recuadro, el arrastre."

  - id: toque-desastre
    tipo: tocar
    titulo: "Parece un desastre"
    texto: "Tras arrastrar la punta, la fila es un puente continuo. Toque el paso que la deja limpia."
    libro: [78, 79, 96]
    widget:
      tipo: figura
      figura: fig-13.7
      zonas:
        - { id: alinear, rotulo: "Primer paso", rect: [235, 18, 216, 37] }
        - { id: flux, rotulo: "Segundo paso", rect: [235, 60, 216, 37] }
        - { id: arrastrar, rotulo: "Tercer paso", rect: [235, 101, 216, 37] }
        - { id: malla, rotulo: "Cuarto paso", rect: [235, 142, 216, 38] }
    tocar:
      bien: [malla]
      porque:
        alinear: "Ese va antes de soldar nada: una vez soldado un pin, alinear es rehacer."
        flux: "El flux ya se puso; lo que se lleva el sobrante es otra cosa."
        arrastrar: "Es justo lo que ha hecho: el puente es el resultado intermedio."
    exito: "Malla y más flux: el sobrante se acumula al final de la fila y la malla se lo lleva sin arrancar nada. El puente continuo no es un desastre."
    escalera:
      - "¿Qué herramienta se lleva el estaño sobrante?"
    solucion: "El cuarto paso: quitar los puentes con malla y flux."

  - id: toque-flux
    tipo: tocar
    titulo: "Lo que lo hace funcionar"
    texto: "Si en el arrastre se escatima algo, el estaño se queda entre los pines. Toque el paso que no puede faltar."
    libro: [78, 79, 96]
    widget:
      tipo: figura
      figura: fig-13.7
      zonas:
        - { id: alinear, rotulo: "Primer paso", rect: [235, 18, 216, 37] }
        - { id: flux, rotulo: "Segundo paso", rect: [235, 60, 216, 37] }
        - { id: arrastrar, rotulo: "Tercer paso", rect: [235, 101, 216, 37] }
        - { id: malla, rotulo: "Cuarto paso", rect: [235, 142, 216, 38] }
    tocar:
      bien: [flux]
      porque:
        alinear: "Alinear es el paso crítico para la posición, pero no evita los puentes."
        arrastrar: "Arrastrar sin flux deja el estaño entre los pines."
        malla: "La malla quita puentes, pero sin flux de antes no hay tensión superficial que ayude."
    exito: "El flux abundante: con él, por tensión superficial, el estaño prefiere quedarse en el metal y no entre los pines."
    escalera:
      - "¿Qué hace que el estaño prefiera el metal?"
    solucion: "El segundo paso: flux líquido abundante."

  - id: por-que-rehacer
    tipo: porque
    titulo: "¿Por qué rehacer el primero?"
    texto: "El primer pad ya sujeta el componente. ¿Por qué hay que volver a él al final?"
    libro: [74, 75]
    fijar: { p_on: 0 }
    widget:
      tipo: circuito
      esquema: divisor
      piezas: { fuente: V_in, arriba: R_1, abajo: R_2, carga: R_p, interruptor: p_on }
      lectura: { valor: V_out, rotulo: "Tensión de salida" }
      mide: { salida: V_out, corriente: I }
    opciones:
      - texto: "Porque quedó con poco estaño y sin flux fresco: puede ser una junta fría"
        bien: true
        porque: "Sirvió para posicionar, no para soldar bien. Es el paso que más se olvida."
      - texto: "Para que el componente quede recto"
        porque: "Ya se alineó en el segundo paso, con la pinza quieta."
      - texto: "No hace falta si ya conduce"
        porque: "Una junta fría conduce al principio: por eso se rehace."
    escalera:
      - "¿Cuánto estaño y cuánto flux se puso en el primer pad?"
    solucion: "Quedó con poco estaño y sin flux fresco."

  - id: almohadilla-oculta
    tipo: tocar
    titulo: "Lo que no se ve"
    texto: "Las uniones de un BGA, como la almohadilla inferior de un QFN, quedan ocultas. Toque la única forma de inspeccionarlas sin desoldar."
    libro: [88, 97]
    widget:
      tipo: figura
      figura: fig-13.8
      zonas:
        - { id: cara, rotulo: "Foto de la izquierda", rect: [10, 10, 470, 430] }
        - { id: seccion, rotulo: "Foto del centro", rect: [520, 10, 600, 430] }
        - { id: rayos, rotulo: "Foto de la derecha", rect: [1150, 10, 440, 430] }
    tocar:
      bien: [rayos]
      porque:
        cara: "Es la cara inferior antes de montar: con el chip soldado, las bolas quedan debajo."
        seccion: "Un corte del encapsulado: para verlo hay que destruirlo."
    exito: "Rayos X, o la temperatura en funcionamiento: una almohadilla sin soldar dobla o triplica la resistencia térmica."
    escalera:
      - "¿Qué atraviesa el chip sin desoldarlo?"
    solucion: "La radiografía, a la derecha."

  - id: toque-lapida
    tipo: tocar
    titulo: "Efecto lápida"
    texto: "Al soldar a mano una resistencia SMD, calentó los dos extremos a destiempo. Toque el defecto que le puede salir."
    libro: [85, "cap13#286"]
    widget:
      tipo: figura
      figura: fig-13.15
      zonas:
        - { id: fria, rotulo: "Recuadro de arriba en el centro", rect: [153, 2, 147, 78] }
        - { id: puente, rotulo: "Recuadro del centro", rect: [153, 84, 147, 78] }
        - { id: levantado, rotulo: "Tercera fila, en el centro", rect: [153, 166, 147, 79] }
        - { id: lapida, rotulo: "Recuadro de abajo a la izquierda", rect: [2, 250, 148, 78] }
    tocar:
      bien: [lapida]
      porque:
        fria: "La fría sale de poco calor o de mover la pieza, no de calentar los extremos a destiempo."
        puente: "El puente es exceso de estaño entre dos islas."
        levantado: "El pad se levanta por exceso de calor o un tirón, no se levanta el componente."
    exito: "Tombstoning: el componente se levanta de un extremo y queda en circuito abierto. Se corrige recalentando ambos a la vez."
    escalera:
      - "Busque un componente de dos terminales de pie."
    solucion: "Abajo a la izquierda: tombstoning."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [68, 72, 75, 79, 70, 71, 73, 76, 77, 78, 80, 81, 82, 83, 85]
    ideas:
      - { titulo: "Otra técnica.", texto: "Sin insertar ni cortar: más rápido que con patillas; el 0805 es el punto dulce." }
      - { titulo: "Dos terminales.", texto: "Estañar un pad, posicionar, soldar el otro y rehacer el primero." }
      - { titulo: "Arrastre.", texto: "Alinear, mucho flux, arrastrar y quitar los puentes con malla." }
      - { titulo: "Aire caliente.", texto: "Caudal mínimo, movimiento circular y vecinos protegidos." }
