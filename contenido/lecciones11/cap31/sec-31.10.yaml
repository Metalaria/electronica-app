# Lección 1.2 de la sección 30.13 «Multiplexación: Compartir el Medio» (cap31, sec-31.10). Formato: GUIA.md.
# - Sección sin números: la figura 30.25 con zonas (las cinco dimensiones) y preguntas sobre el acceso al medio, el
#   coste y Shannon.
# Paso práctico: «tocar» en la figura 30.25 la única multiplexación que aumenta la capacidad (la espacial).
# 1.2.1 (autor121-senpro, «aprender haciendo», GUIA §13): las dimensiones se tocan en la figura 30.25 (por código, la
# óptica, la que pide sincronía y la que suma capacidad); el arbitraje no destructivo de CAN se hace en un bus de
# drenador abierto con resistencia de pull-up (el nodo que pone el dominante gana sin destruir nada); y el caudal útil
# se sube alargando la carga útil frente a una cabecera de ejemplo de 10 bytes. Quedan dos preguntas de opciones: el
# usuario de más en CDM y el acceso para un lazo de control.
leccion: cap31/sec-31.10

libro:
  444: "hay cinco formas de hacerlo"
  446: "si los relojes se separan, los turnos se solapan"
  447: "exige filtros y bandas de guarda entre canales"
  448: "cada uno con un código ortogonal distinto"
  449: "añadir un usuario degrada un poco a todos en lugar de rechazarlo"
  450: "la versión óptica del FDM, con varios colores por la misma fibra"
  451: "Es la base de MIMO"
  454: "La latencia está acotada, que es lo que hace falta en control"
  455: "latencia no acotada, porque una colisión puede repetirse"
  456: "el arbitraje no destructivo de CAN (sección 45.5), donde el mensaje ganador no se pierde"
  459: "Reduce el caudal útil respecto al bruto"
  463: "ninguna crea capacidad de la nada"
  464: "La única que la aumenta de verdad es la espacial"
  466: "con el analizador lógico (sección 39.10)"
  468: "Las cinco dimensiones de multiplexación y las dos filosofías de acceso al medio"

modelo:
  valores:
    c_b: { sim: "cabecera", nombre: "cabecera de ejemplo", unidad: "bytes", valor: 10 }
    p_b: { sim: "datos", nombre: "carga útil", unidad: "bytes", valor: 8 }
  calculos:
    u_t: { expr: "100*p_b/(p_b + c_b)", sim: "útil", nombre: "caudal útil frente al bruto", unidad: "%", cifras: 3 }

tarjetas:
  - id: explore-dimensiones
    tipo: tocar
    titulo: "Cinco formas de repartir"
    texto: "Varias comunicaciones, un solo medio, cinco formas de repartirlo. Toque la que los pone a todos a la vez y en la misma banda."
    libro: [444, 448, 468]
    widget:
      tipo: figura
      figura: fig-31.19
      zonas: &zonas-mux
        - { id: tdm, rotulo: "Primer recuadro, arriba", rect: [3, 2, 84, 128] }
        - { id: fdm, rotulo: "Segundo recuadro, arriba", rect: [93, 2, 85, 128] }
        - { id: cdm, rotulo: "Tercer recuadro, arriba", rect: [182, 2, 85, 128] }
        - { id: wdm, rotulo: "Cuarto recuadro, arriba", rect: [272, 2, 86, 128] }
        - { id: sdm, rotulo: "Quinto recuadro, arriba", rect: [362, 2, 85, 128] }
    tocar:
      bien: [cdm]
      porque:
        tdm: "Esa reparte el tiempo: cada uno en su turno."
        fdm: "Esa reparte la frecuencia: cada uno en su banda."
        wdm: "Esa reparte colores de luz por una fibra."
        sdm: "Esa usa varios caminos físicos."
    exito: "CDM, por código: cada uno con un código ortogonal distinto, y el receptor separa el suyo correlacionando."
    escalera:
      - "Si no reparten tiempo ni banda, ¿qué los distingue?"
    solucion: "El tercer recuadro, CDM."

  - id: empareje-dimensiones
    tipo: tocar
    titulo: "Cada una, su recurso"
    texto: "Toque la versión óptica del FDM: varios colores por la misma fibra."
    libro: [446, 447, 448, 450, 451]
    widget:
      tipo: figura
      figura: fig-31.19
      zonas: *zonas-mux
    tocar:
      bien: [wdm]
      porque:
        tdm: "TDM exige una sincronización precisa, no colores."
        fdm: "Ese es el FDM eléctrico, con filtros y bandas de guarda."
        cdm: "CDM usa códigos ortogonales."
        sdm: "SDM usa varias antenas y las reflexiones: es la base de MIMO."
    exito: "WDM, por longitud de onda. Todas resuelven el mismo problema con recursos distintos."
    escalera:
      - "Longitud de onda, en la luz, es el color."
    solucion: "El cuarto recuadro, WDM."

  - id: predecir-cdm
    tipo: predecir
    titulo: "Un usuario más"
    texto: "En un sistema por código, todos transmiten a la vez en la misma banda. ¿Qué pasa al añadir un usuario más?"
    libro: [448, 449]
    widget:
      tipo: figura
      figura: fig-31.19
      zonas:
        - { id: todo, rotulo: "Las cinco dimensiones", rect: [0, 0, 453, 219] }
    opciones:
      - texto: "Degrada un poco a todos, en lugar de rechazarlo"
        bien: true
        porque: "La capacidad no está dividida rígidamente: los demás se ven como ruido."
      - texto: "Se le rechaza: no quedan turnos"
        porque: "Eso pasaría en un reparto rígido por turnos o bandas."
      - texto: "Nadie lo nota, porque los códigos son ortogonales"
        porque: "Cada usuario más suma algo de ruido a los demás."
    escalera:
      - "Para un receptor, ¿qué son las señales de los demás?"
    solucion: "Degrada un poco a todos; es lo que usan el GPS y varias generaciones de telefonía."

  - id: tdm-relojes
    tipo: tocar
    titulo: "Turnos que se pisan"
    texto: "Si los relojes del emisor y del receptor se separan, los turnos se solapan. Toque la multiplexación que exige esa sincronización precisa."
    libro: [446, 466]
    widget:
      tipo: figura
      figura: fig-31.19
      zonas: *zonas-mux
    tocar:
      bien: [tdm]
      porque:
        fdm: "En FDM se solaparían bandas, y lo evitan las guardas."
        cdm: "CDM separa por código, no por turnos."
        wdm: "WDM separa por colores."
        sdm: "SDM separa por caminos."
    exito: "TDM, por turnos. Se ve con el analizador lógico (sección 39.10)."
    escalera:
      - "¿Qué recurso se reparte por turnos?"
    solucion: "El primer recuadro, TDM."

  - id: acceso-control
    tipo: pregunta
    titulo: "Quién habla"
    texto: "Un bus lleva medidas y órdenes de un lazo de control. ¿Qué filosofía de acceso conviene?"
    libro: [454, 455]
    widget:
      tipo: figura
      figura: fig-31.19
      zonas:
        - { id: todo, rotulo: "Las cinco dimensiones", rect: [0, 0, 453, 219] }
    opciones:
      - texto: "Determinista: turnos, testigo o maestro, con latencia acotada"
        bien: true
        porque: "Un lazo necesita saber cuánto tarda lo peor; el retardo resta margen."
      - texto: "Por contienda, porque rinde más"
        porque: "Rinde más con tráfico irregular, pero su latencia no está acotada."
      - texto: "Da igual, si el bus es rápido"
        porque: "Rápido de media no es acotado: una colisión puede repetirse."
    escalera:
      - "¿Qué necesita un lazo: rendimiento medio o retardo máximo conocido?"
    solucion: "Determinista: latencia acotada."

  - id: porque-contienda
    tipo: explorar
    titulo: "Latencia sin techo"
    texto: "Por contienda, una colisión puede repetirse; en CAN el dominante manda en la línea y el ganador no se pierde. Haga ganar al nodo B con el A en recesivo."
    libro: [455, 456]
    widget:
      tipo: logica
      entradas: [{ id: A, rotulo: "Nodo A" }, { id: B, rotulo: "Nodo B", valor: 1 }]
      piezas:
        - { id: d1, tipo: od, entradas: [A] }
        - { id: d2, tipo: od, entradas: [B] }
        - { id: linea, tipo: bus, entradas: [d1, d2], pullup: 1 }
      salidas:
        - { id: L, de: linea, rotulo: "Línea" }
    objetivo:
      condiciones:
        - { senal: A, valor: 1, rotulo: "Nodo A en recesivo" }
        - { led: L, valor: 0, rotulo: "Línea en dominante" }
      logrado: "La línea queda en dominante: el bit del nodo B llega intacto, y el A lee un nivel que no puso y se retira. Arbitraje no destructivo."
      pistas:
        - { cuando: { senal: A, valor: 0 }, texto: "El nodo A está poniendo el dominante: póngalo en recesivo." }
        - { texto: "Nadie tira de la línea: el nodo B tiene que poner el dominante." }
    escalera:
      - "En drenador abierto, basta un nodo que tire a nivel bajo para que la línea quede baja."
    solucion: "Nodo A en alto (recesivo) y nodo B en bajo (dominante)."

  - id: sobrecarga
    tipo: explorar
    titulo: "Ninguna es gratis"
    texto: "Cabeceras, sincronización y guardas reducen el caudal útil frente al bruto. Alargue la carga útil de cada trama hasta que la cabecera se lleve menos de una quinta parte."
    nota: "Cabecera de ejemplo."
    libro: [459]
    inicio: { p_b: 8 }
    widget:
      tipo: grafica
      x: { id: n, min: 1, max: 100, unidad: "bytes", rotulo: "carga útil" }
      y: { min: 0, max: 100, unidad: "%", rotulo: "caudal útil" }
      curvas:
        - { expr: "100*n/(n + c_b)", color: naranja, rotulo: "útil frente al bruto" }
      marcas:
        - { x: "p_b", y: "u_t", rotulo: "{{u_t}}" }
      lectura: { valor: u_t, rotulo: "Caudal útil" }
      mandos:
        - { valor: p_b, lista: [8, 16, 32, 64], rotulo: "Carga útil" }
    objetivo:
      condiciones:
        - { valor: u_t, min: 80, rotulo: "Útil: {{u_t}}" }
      logrado: "Con {{p_b}} de datos por trama, la cabecera pesa menos. Pero tramas largas tardan más: el coste de compartir siempre se paga en caudal o en latencia."
      pistas:
        - { texto: "La cabecera aún se come mucho: más datos por trama." }
    escalera:
      - "Útil = datos / (datos + cabecera)."
    solucion: "64 bytes: un 86 %."
    comprobar:
      - { con: { p_b: 64 }, u_t: 86.5, tol: 0.01 }

  - id: toque-capacidad
    tipo: tocar
    titulo: "La única que suma"
    texto: "Todas reparten una capacidad que acota Shannon. Toque la única que la aumenta de verdad."
    libro: [463, 464, 468]
    widget:
      tipo: figura
      figura: fig-31.19
      zonas:
        - { id: tdm, rotulo: "Primer recuadro, arriba", rect: [3, 2, 84, 128] }
        - { id: fdm, rotulo: "Segundo recuadro, arriba", rect: [93, 2, 85, 128] }
        - { id: cdm, rotulo: "Tercer recuadro, arriba", rect: [182, 2, 85, 128] }
        - { id: wdm, rotulo: "Cuarto recuadro, arriba", rect: [272, 2, 86, 128] }
        - { id: sdm, rotulo: "Quinto recuadro, arriba", rect: [362, 2, 85, 128] }
    tocar:
      bien: [sdm]
      porque:
        tdm: "Reparte el tiempo de un canal: no crea capacidad."
        fdm: "Reparte la banda de un canal: no crea capacidad."
        cdm: "Reparte la misma banda con códigos: no crea capacidad."
        wdm: "Reparte los colores de una fibra: multiplica lo que pasa por ella, pero sigue siendo un canal repartido."
    exito: "La espacial: no reparte un canal, emplea varios caminos físicos. Por eso MIMO multiplicó la capacidad inalámbrica."
    escalera:
      - "¿Cuál usa caminos físicos distintos?"
    solucion: "SDM, el quinto recuadro: varias antenas, varios caminos."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [444, 449, 454, 459, 464]
    ideas:
      - { titulo: "Cinco dimensiones.", texto: "Tiempo, frecuencia, código, longitud de onda y espacio." }
      - { titulo: "Acceso.", texto: "Determinista para control; contienda, más rendimiento sin latencia acotada." }
      - { titulo: "Coste.", texto: "Sobrecarga, latencia y sincronización." }
      - { titulo: "Shannon.", texto: "Todas reparten; solo el espacio suma caminos." }
