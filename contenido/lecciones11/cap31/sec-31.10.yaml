# Lección 1.2 de la sección 30.13 «Multiplexación: Compartir el Medio» (cap31, sec-31.10). Formato: GUIA.md.
# - Sección sin números: la figura 30.25 con zonas (las cinco dimensiones) y preguntas sobre el acceso al medio, el
#   coste y Shannon.
# Paso práctico: «tocar» en la figura 30.25 la única multiplexación que aumenta la capacidad (la espacial).
leccion: cap31/sec-31.10

libro:
  444: "hay cinco formas de hacerlo"
  446: "si los relojes se separan, los turnos se solapan"
  447: "exige filtros y bandas de guarda entre canales"
  448: "cada uno con un código ortogonal distinto"
  449: "añadir un usuario degrada un poco a todos en lugar de rechazarlo"
  450: "la versión óptica del FDM, con varios colores por la misma fibra"
  451: "Es la base de MIMO"
  454: "La latencia está acotada, que es lo que hace falta en control"
  455: "latencia no acotada, porque una colisión puede repetirse"
  456: "el arbitraje no destructivo de CAN (sección 45.5), donde el mensaje ganador no se pierde"
  459: "Reduce el caudal útil respecto al bruto"
  463: "ninguna crea capacidad de la nada"
  464: "La única que la aumenta de verdad es la espacial"
  466: "con el analizador lógico (sección 39.10)"
  468: "Las cinco dimensiones de multiplexación y las dos filosofías de acceso al medio"

modelo: { valores: {}, calculos: {} }

tarjetas:
  - id: explore-dimensiones
    tipo: explorar
    titulo: "Cinco formas de repartir"
    texto: "Varias comunicaciones, un solo medio. Toque cada forma de repartirlo."
    libro: [444, 468]
    widget:
      tipo: figura
      figura: fig-31.19
      zonas:
        - { id: tdm, rotulo: "Primer recuadro, arriba", rect: [3, 2, 84, 128], texto: "TDM, en el tiempo: cada uno en su turno. Exige relojes sincronizados." }
        - { id: fdm, rotulo: "Segundo recuadro, arriba", rect: [93, 2, 85, 128], texto: "FDM, en frecuencia: cada uno en su banda, a la vez, con bandas de guarda." }
        - { id: cdm, rotulo: "Tercer recuadro, arriba", rect: [182, 2, 85, 128], texto: "CDM, en código: todos a la vez y en la misma banda, cada uno con su código ortogonal." }
        - { id: wdm, rotulo: "Cuarto recuadro, arriba", rect: [272, 2, 86, 128], texto: "WDM, en longitud de onda: el FDM óptico, varios colores por la misma fibra." }
        - { id: sdm, rotulo: "Quinto recuadro, arriba", rect: [362, 2, 85, 128], texto: "SDM, en el espacio: varias antenas y caminos. MIMO aprovecha las reflexiones." }
    requiere: { mover: [tdm, fdm, cdm, wdm, sdm] }

  - id: empareje-dimensiones
    tipo: pregunta
    titulo: "Cada una, su recurso"
    texto: "Empareje cada multiplexación con lo que exige o aprovecha."
    libro: [446, 447, 448, 450, 451]
    widget:
      tipo: figura
      figura: fig-31.19
      zonas:
        - { id: todo, rotulo: "Las cinco dimensiones", rect: [0, 0, 453, 219] }
    emparejar:
      - ["TDM", "Una sincronización precisa"]
      - ["FDM", "Filtros y bandas de guarda"]
      - ["CDM", "Códigos ortogonales y correlación"]
      - ["WDM", "Varios colores por una fibra"]
      - ["SDM", "Varias antenas y las reflexiones"]
    exito: "Todas resuelven el mismo problema con recursos distintos."
    pistas:
      - { texto: "WDM es la versión óptica de FDM." }
    escalera:
      - "Tiempo, frecuencia, código, longitud de onda y espacio, por orden de las letras."
    solucion: "TDM sincronía; FDM guardas; CDM códigos; WDM colores; SDM antenas."

  - id: predecir-cdm
    tipo: predecir
    titulo: "Un usuario más"
    texto: "En un sistema por código, todos transmiten a la vez en la misma banda. ¿Qué pasa al añadir un usuario más?"
    libro: [448, 449]
    widget:
      tipo: figura
      figura: fig-31.19
      zonas:
        - { id: todo, rotulo: "Las cinco dimensiones", rect: [0, 0, 453, 219] }
    opciones:
      - texto: "Degrada un poco a todos, en lugar de rechazarlo"
        bien: true
        porque: "La capacidad no está dividida rígidamente: los demás se ven como ruido."
      - texto: "Se le rechaza: no quedan turnos"
        porque: "Eso pasaría en un reparto rígido por turnos o bandas."
      - texto: "Nadie lo nota, porque los códigos son ortogonales"
        porque: "Cada usuario más suma algo de ruido a los demás."
    escalera:
      - "Para un receptor, ¿qué son las señales de los demás?"
    solucion: "Degrada un poco a todos; es lo que usan el GPS y varias generaciones de telefonía."

  - id: tdm-relojes
    tipo: pregunta
    titulo: "Turnos que se pisan"
    texto: "En un enlace por turnos, los relojes del emisor y del receptor se separan poco a poco. ¿Qué pasa?"
    libro: [446, 466]
    widget:
      tipo: figura
      figura: fig-31.19
      zonas:
        - { id: todo, rotulo: "Las cinco dimensiones", rect: [0, 0, 453, 219] }
    opciones:
      - texto: "Los turnos se solapan"
        bien: true
        porque: "Por eso TDM exige una sincronización precisa."
      - texto: "Las bandas se solapan"
        porque: "Eso es FDM sin bandas de guarda; aquí se reparte el tiempo."
      - texto: "Nada, cada uno sigue en su frecuencia"
        porque: "En TDM todos usan la misma frecuencia por turnos."
    escalera:
      - "¿Qué recurso reparte TDM?"
    solucion: "Los turnos se solapan."

  - id: acceso-control
    tipo: pregunta
    titulo: "Quién habla"
    texto: "Un bus lleva medidas y órdenes de un lazo de control. ¿Qué filosofía de acceso conviene?"
    libro: [454, 455]
    widget:
      tipo: figura
      figura: fig-31.19
      zonas:
        - { id: todo, rotulo: "Las cinco dimensiones", rect: [0, 0, 453, 219] }
    opciones:
      - texto: "Determinista: turnos, testigo o maestro, con latencia acotada"
        bien: true
        porque: "Un lazo necesita saber cuánto tarda lo peor; el retardo resta margen."
      - texto: "Por contienda, porque rinde más"
        porque: "Rinde más con tráfico irregular, pero su latencia no está acotada."
      - texto: "Da igual, si el bus es rápido"
        porque: "Rápido de media no es acotado: una colisión puede repetirse."
    escalera:
      - "¿Qué necesita un lazo: rendimiento medio o retardo máximo conocido?"
    solucion: "Determinista: latencia acotada."

  - id: porque-contienda
    tipo: porque
    titulo: "Latencia sin techo"
    texto: "¿Por qué el acceso por contienda no puede garantizar un retardo máximo?"
    libro: [455, 456]
    widget:
      tipo: figura
      figura: fig-31.19
      zonas:
        - { id: todo, rotulo: "Las cinco dimensiones", rect: [0, 0, 453, 219] }
    opciones:
      - texto: "Porque una colisión puede repetirse"
        bien: true
        porque: "CAN lo resuelve con arbitraje no destructivo: el mensaje ganador no se pierde."
      - texto: "Porque los mensajes son más largos"
        porque: "La longitud no es el problema; lo es no saber cuántas veces habrá que repetir."
      - texto: "Porque no hay sincronización"
        porque: "La falta de sincronía no impide acotar; las colisiones repetidas sí."
    escalera:
      - "¿Qué pasa tras una colisión?"
    solucion: "Una colisión puede repetirse sin límite."

  - id: sobrecarga
    tipo: pregunta
    titulo: "Ninguna es gratis"
    texto: "Cabeceras, sincronización, bandas de guarda y tiempos entre turnos. ¿Qué reducen?"
    libro: [459]
    widget:
      tipo: figura
      figura: fig-31.19
      zonas:
        - { id: todo, rotulo: "Las cinco dimensiones", rect: [0, 0, 453, 219] }
    opciones:
      - texto: "El caudal útil frente al bruto"
        bien: true
        porque: "Es la sobrecarga; además están la latencia y la complejidad de sincronizar."
      - texto: "La relación señal a ruido"
        porque: "Ocupan tiempo o banda, no añaden ruido."
      - texto: "Nada: se compensan con más velocidad"
        porque: "Siempre se pagan: es el coste de compartir."
    escalera:
      - "Ese tiempo y esa banda, ¿llevan datos del usuario?"
    solucion: "El caudal útil."

  - id: toque-capacidad
    tipo: tocar
    titulo: "La única que suma"
    texto: "Todas reparten una capacidad que acota Shannon. Toque la única que la aumenta de verdad."
    libro: [463, 464, 468]
    widget:
      tipo: figura
      figura: fig-31.19
      zonas:
        - { id: tdm, rotulo: "Primer recuadro, arriba", rect: [3, 2, 84, 128] }
        - { id: fdm, rotulo: "Segundo recuadro, arriba", rect: [93, 2, 85, 128] }
        - { id: cdm, rotulo: "Tercer recuadro, arriba", rect: [182, 2, 85, 128] }
        - { id: wdm, rotulo: "Cuarto recuadro, arriba", rect: [272, 2, 86, 128] }
        - { id: sdm, rotulo: "Quinto recuadro, arriba", rect: [362, 2, 85, 128] }
    tocar:
      bien: [sdm]
      porque:
        tdm: "Reparte el tiempo de un canal: no crea capacidad."
        fdm: "Reparte la banda de un canal: no crea capacidad."
        cdm: "Reparte la misma banda con códigos: no crea capacidad."
        wdm: "Reparte los colores de una fibra: multiplica lo que pasa por ella, pero sigue siendo un canal repartido."
    exito: "La espacial: no reparte un canal, emplea varios caminos físicos. Por eso MIMO multiplicó la capacidad inalámbrica."
    escalera:
      - "¿Cuál usa caminos físicos distintos?"
    solucion: "SDM, el quinto recuadro: varias antenas, varios caminos."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [444, 449, 454, 459, 464]
    ideas:
      - { titulo: "Cinco dimensiones.", texto: "Tiempo, frecuencia, código, longitud de onda y espacio." }
      - { titulo: "Acceso.", texto: "Determinista para control; contienda, más rendimiento sin latencia acotada." }
      - { titulo: "Coste.", texto: "Sobrecarga, latencia y sincronización." }
      - { titulo: "Shannon.", texto: "Todas reparten; solo el espacio suma caminos." }
