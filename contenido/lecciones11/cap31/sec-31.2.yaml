# Lección 1.2 de la sección 30.2 «El Controlador PID» (cap31, sec-31.2). Formato: GUIA.md.
# - La respuesta al escalón en lazo abierto con sus tres parámetros (figura 30.4, izquierda): y = K·(1 − e^(−(t − L)/τ))
#   desde t = L, en % del valor final; L = 1,2 s y τ = 2,5 s son los de la figura. Un RC vivo (carga-rc) como planta de
#   primer orden: el 63 % de la sección 21.2, que el libro cita para medir τ.
# - El compromiso de la ganancia se toca sobre la figura 30.4 (derecha): con retardo no hay fórmula cerrada del lazo
#   cerrado que la app pueda dibujar.
# Pasos prácticos: «dibujar» la respuesta en lazo abierto (retardo plano y 63 % en L + τ) y «banco» opcional: medir τ
# de un RC con la ficha 26 del cuaderno (10 kΩ y 100 nF, como en cap53/sec-53.16).
leccion: cap31/sec-31.2

libro:
  43: "Un sistema en lazo cerrado mide el resultado, lo compara con lo deseado y actúa sobre la diferencia"
  47: "un lazo no puede controlar mejor de lo que mide"
  48: "Comparador: calcula el error"
  49: "Controlador: decide la acción a partir del error"
  50: "Actuador: la ejecuta"
  51: "Planta: el sistema físico"
  52: "Si el termómetro tiene 2 °C de error, el lazo mantendrá la temperatura con 2 °C de error"
  55: "Ganancia estática: cuánto cambia la salida por unidad de entrada, en régimen"
  56: "Constante de tiempo: cuánto tarda en responder"
  57: "Retardo puro (tiempo muerto): cuánto tarda en empezar a responder"
  58: "el controlador actúa sin ver el efecto de lo que ya hizo, lo que le lleva a excederse"
  61: "Error en régimen permanente: cuánto se aparta de la consigna al estabilizarse"
  62: "Tiempo de subida: cuánto tarda en llegar"
  63: "Sobreoscilación: cuánto se pasa"
  64: "Tiempo de establecimiento: cuánto tarda en quedarse dentro de una banda"
  65: "Margen de estabilidad: cuánto se puede degradar el sistema antes de oscilar"
  66: "subir la ganancia reduce el error y el tiempo de subida, y aumenta la sobreoscilación y acerca la inestabilidad"
  69: "si se conoce la perturbación antes de que afecte, se puede compensar sin esperar al error"
  71: "Su ventaja es que actúa sin retardo"
  73: "se aplica un escalón en lazo abierto y se registra la respuesta"
  74: "la ganancia del valor final, la constante de tiempo del 63 %"
  75: "se puede ajustar un PID por métodos tabulados (sección 30.14) sin tocar el sistema real"
  77: "Respuesta al escalón en lazo abierto con sus tres parámetros, y el efecto de la ganancia del lazo"

modelo:
  valores:
    L_m: { sim: "L", nombre: "retardo puro", unidad: s, valor: 1.2 }
    tau_m: { sim: "τ", nombre: "constante de tiempo", unidad: s, valor: 2.5 }
    V_r: { sim: "V", nombre: "escalón de entrada", unidad: V, valor: 5 }
    R_r: { sim: "R", nombre: "resistencia", unidad: Ω, valor: 10000 }
    C_r: { sim: "C", nombre: "capacidad", unidad: F, valor: 100e-9 }
  calculos:
    t_63: { expr: "L_m + tau_m", sim: "t_{63}", nombre: "instante del 63 %", unidad: s }
    y_63: { expr: "63.2", sim: "y", nombre: "respuesta en L + τ", unidad: "%" }
    tau_rc: { expr: "R_r*C_r", sim: "τ", nombre: "constante de tiempo del RC", unidad: s }
    v_63: { expr: "0.632*V_r", sim: "v(τ)", nombre: "tensión en un τ", unidad: V }

tarjetas:
  - id: explore-escalon
    tipo: explorar
    titulo: "Tres números de una curva"
    texto: "Escalón en lazo abierto. Cambie el retardo y la constante de tiempo, y mire dónde cae el 63 %."
    libro: [55, 56, 57, 74]
    widget:
      tipo: grafica
      x: { id: t, min: 0, max: 12, unidad: s, rotulo: "t" }
      y: { min: 0, max: 110, unidad: "%", rotulo: "respuesta" }
      curvas:
        - { expr: "100*(1 - exp(-max(0, t - L_m)/tau_m))", color: naranja, rotulo: "respuesta" }
        - { expr: "100", color: tinta, rotulo: "valor final", discontinua: true }
      marcas:
        - { x: "t_63", y: "y_63", rotulo: "63 %" }
        - { x: "L_m", y: "0", rotulo: "L" }
      lectura: { valor: t_63, rotulo: "Llega al 63 % en" }
      mandos:
        - { valor: L_m, lista: [0.5, 1.2, 2.5], rotulo: "Retardo, L" }
        - { valor: tau_m, lista: [1, 2.5, 5], rotulo: "Constante de tiempo, τ" }
    requiere: { mover: [L_m, tau_m] }

  - id: explore-rc
    tipo: explorar
    titulo: "Una planta que cabe en la mano"
    texto: "Un RC es una planta de primer orden sin retardo. Cambie R y mire el 63 %: τ = R·C."
    libro: [56, 74]
    inicio: { R_r: 10000 }
    widget:
      tipo: circuito
      esquema: carga-rc
      piezas: { fuente: V_r, r: R_r, c: C_r }
      lectura: { valor: tau_rc, rotulo: "Constante de tiempo" }
      grafica:
        x: { id: t, min: 0, max: 0.005, unidad: s, rotulo: "t" }
        y: { min: 0, max: 6, unidad: V, rotulo: "v" }
        curvas:
          - { expr: "V_r*(1 - exp(-t/tau_rc))", color: naranja, rotulo: "v_{C}", mide: vc }
        marcas:
          - { x: "tau_rc", y: "v_63", rotulo: "63 %" }
      mandos:
        - { valor: R_r, lista: [4700, 10000, 22000] }
    requiere: { mover: [R_r] }

  - id: empareje-elementos
    tipo: pregunta
    titulo: "Los elementos del lazo"
    texto: "Empareje cada elemento con lo que hace."
    libro: [48, 49, 50, 51, 47]
    widget:
      tipo: figura
      figura: fig-31.1
      zonas:
        - { id: todo, rotulo: "El lazo cerrado", rect: [0, 0, 450, 162] }
    emparejar:
      - ["Sensor", "Mide lo que hay"]
      - ["Comparador", "Calcula el error"]
      - ["Controlador", "Decide la acción a partir del error"]
      - ["Actuador", "Ejecuta la acción"]
      - ["Planta", "El sistema físico"]
    exito: "Y la exactitud del sensor es el techo de todo el sistema."
    pistas:
      - { texto: "El controlador decide; el actuador ejecuta." }
    escalera:
      - "Uno mide, uno resta, uno decide, uno hace y uno es el horno."
    solucion: "Sensor mide, comparador resta, controlador decide, actuador ejecuta, planta es el sistema."

  - id: predecir-termometro
    tipo: predecir
    titulo: "Un termómetro que miente"
    texto: "El termómetro de un horno marca 2 °C de más. Con un controlador excelente, ¿qué temperatura se mantiene?"
    libro: [47, 52]
    widget:
      tipo: figura
      figura: fig-31.1
      zonas:
        - { id: todo, rotulo: "El lazo cerrado", rect: [0, 0, 450, 162] }
    opciones:
      - texto: "Con 2 °C de error: el lazo lleva a la consigna lo que mide"
        bien: true
        porque: "Mejorar el controlador no compensa un mal sensor."
      - texto: "La consigna exacta, porque el controlador lo corrige"
        porque: "El controlador solo ve la medida; no sabe que miente."
      - texto: "Oscila alrededor de la consigna"
        porque: "Un error fijo del sensor desplaza el punto, no desestabiliza."
    escalera:
      - "¿Qué compara el comparador: la temperatura real o la medida?"
    solucion: "Se mantiene con 2 °C de error: un lazo no controla mejor de lo que mide."

  - id: dibuje-escalon
    tipo: dibujar
    titulo: "Dibuje la respuesta"
    texto: "Planta con L = 1,2 s y τ = 2,5 s. Dibuje su respuesta a un escalón en lazo abierto."
    libro: [56, 57, 74]
    fijar: { L_m: 1.2, tau_m: 2.5 }
    widget:
      tipo: grafica
      x: { id: t, min: 0, max: 12, unidad: s, rotulo: "t" }
      y: { min: 0, max: 110, unidad: "%", rotulo: "respuesta" }
      curvas:
        - { expr: "100", color: tinta, rotulo: "valor final", discontinua: true }
    dibujar:
      x: { id: t, min: 0, max: 12, unidad: s, rotulo: "t" }
      y: { min: 0, max: 110, unidad: "%", rotulo: "respuesta" }
      curva: "100*(1 - exp(-max(0, t - L_m)/tau_m))"
      puntos: 25
      tol: 0.08
      holgura: 0.03
      rotulo: "Respuesta en lazo abierto"
    exito: "Plana durante el retardo, y el 63 % en L + τ = 3,7 s."
    pistas:
      - { cuando: { valor: desfase, menor: -0.05 }, texto: "Arranca demasiado pronto: durante 1,2 s no pasa nada." }
      - { cuando: { valor: desfase, mayor: 0.05 }, texto: "Va tarde: tras el retardo, en 2,5 s más llega al 63 %." }
      - { texto: "Mire la forma: tramo plano, subida rápida que se curva y se acerca al valor final." }
    escalera:
      - "Hasta t = 1,2 s, cero. Después, una exponencial."
    solucion: "Cero hasta 1,2 s; 63 % en 3,7 s; después se acerca al valor final."
    comprobar:
      - { t_63: 3.7 }

  - id: retardo-peor
    tipo: pregunta
    titulo: "El parámetro que más molesta"
    texto: "¿Cuál de los tres parámetros de la planta causa más problemas al controlar?"
    libro: [55, 56, 57, 58]
    widget:
      tipo: figura
      figura: fig-31.4
      zonas:
        - { id: todo, rotulo: "Las dos gráficas", rect: [0, 0, 446, 190] }
    opciones:
      - texto: "El retardo puro"
        bien: true
        porque: "Durante el retardo el controlador actúa sin ver el efecto de lo que hizo, y se excede."
      - texto: "La constante de tiempo"
        porque: "Una planta lenta pide paciencia, no es lo difícil; lo difícil es un retardo grande frente a τ."
      - texto: "La ganancia estática"
        porque: "La ganancia se compensa con la del controlador; no esconde el efecto de la acción."
    escalera:
      - "¿Qué ve el controlador mientras la planta aún no ha empezado a responder?"
    solucion: "El retardo: con él grande frente a τ, el control clásico deja de bastar."

  - id: empareje-criterios
    tipo: pregunta
    titulo: "Cómo se juzga un lazo"
    texto: "Empareje cada criterio de calidad con lo que mide."
    libro: [61, 62, 63, 64, 65]
    widget:
      tipo: figura
      figura: fig-31.4
      zonas:
        - { id: todo, rotulo: "Las dos gráficas", rect: [0, 0, 446, 190] }
    emparejar:
      - ["Error en régimen permanente", "Cuánto se aparta al estabilizarse"]
      - ["Tiempo de subida", "Cuánto tarda en llegar"]
      - ["Sobreoscilación", "Cuánto se pasa"]
      - ["Tiempo de establecimiento", "Cuánto tarda en quedarse en una banda"]
      - ["Margen de estabilidad", "Cuánto se degrada antes de oscilar"]
    exito: "Y a veces se contradicen."
    pistas:
      - { texto: "«Llegar» y «quedarse» no son lo mismo." }
    escalera:
      - "Dos son tiempos: uno hasta llegar, otro hasta quedarse."
    solucion: "Error, lo que se aparta; subida, llegar; sobreoscilación, pasarse; establecimiento, quedarse; margen, degradarse."

  - id: toque-compromiso
    tipo: tocar
    titulo: "El compromiso central"
    texto: "La misma planta con control P y tres ganancias. Toque la respuesta con menos error en régimen."
    libro: [66, 77]
    widget:
      tipo: figura
      figura: fig-31.4
      zonas:
        - { id: alta, rotulo: "Curva roja, rótulo de arriba", rect: [330, 36, 112, 36] }
        - { id: media, rotulo: "Curva naranja, en medio", rect: [380, 72, 62, 35] }
        - { id: baja, rotulo: "Curva verde, abajo", rect: [336, 107, 106, 36] }
    tocar:
      bien: [alta]
      porque:
        media: "Se queda más lejos de la consigna que la de ganancia alta."
        baja: "Ganancia baja: lenta y con mucho error."
    exito: "La de ganancia alta: menos error y más rápida, pero sobreoscila y se acerca a la inestabilidad."
    escalera:
      - "Subir la ganancia reduce el error."
    solucion: "La roja, ganancia alta: menos error, a cambio de sobreoscilación."

  - id: anticipativo
    tipo: pregunta
    titulo: "Compensar antes del error"
    texto: "Un horno mide la temperatura ambiente y ajusta la potencia base. ¿Qué gana y qué no puede hacer?"
    libro: [69, 71]
    widget:
      tipo: figura
      figura: fig-31.1
      zonas:
        - { id: todo, rotulo: "El lazo cerrado", rect: [0, 0, 450, 162] }
    opciones:
      - texto: "Actúa sin retardo, pero solo compensa lo que se puede predecir"
        bien: true
        porque: "Es control anticipativo: no espera al error, y el lazo cerrado corrige lo que quede."
      - texto: "Sustituye al lazo cerrado: ya no hace falta medir el horno"
        porque: "Solo compensa lo que se conoce; lo demás lo sigue corrigiendo el lazo cerrado."
      - texto: "Elimina el riesgo de oscilar del lazo cerrado"
        porque: "Complementa al lazo, no cambia su estabilidad."
    escalera:
      - "¿Espera a ver el error para actuar?"
    solucion: "Actúa sin retardo; su límite es que solo compensa lo predecible."

  - id: banco-tau
    tipo: banco
    titulo: "Caracterice una planta"
    texto: "Mida en el banco la constante de tiempo de un RC: 10 kΩ y 100 nF con una cuadrada lenta."
    libro: [73, 74]
    fijar: { R_r: 10000, C_r: 100e-9 }
    banco:
      piezas: ["Generador de cuadrada lenta y osciloscopio", "Resistencia de 10 kΩ", "Condensador de 100 nF"]
      medir: "El tiempo desde el flanco hasta que el condensador llega al 63 % del escalón."
      esperado: tau_rc
      unidad: s
      tol: 0.15
      consejos:
        - { cuando: { valor: desviacion, menor: -0.15 }, texto: "Sale corto: el condensador tiene menos capacidad de la marcada, o la cuadrada es demasiado rápida." }
        - { cuando: { valor: desviacion, mayor: 0.15 }, texto: "Sale largo: compruebe la resistencia y tome el 63 % del escalón, no del pico a pico." }
        - { texto: "Dentro de lo esperado: así se lee τ de cualquier planta de primer orden." }
      ficha: { n: 26, titulo: "Práctica 2 · Carga y descarga de un condensador" }
    comprobar:
      - { tau_rc: 0.001 }

  - id: porque-caracterizar
    tipo: porque
    titulo: "Media hora que ahorra días"
    texto: "¿Por qué medir la respuesta al escalón antes de ajustar el controlador ahorra tanto trabajo?"
    libro: [73, 74, 75]
    widget:
      tipo: figura
      figura: fig-31.4
      zonas:
        - { id: todo, rotulo: "Las dos gráficas", rect: [0, 0, 446, 190] }
    opciones:
      - texto: "Con ganancia, τ y retardo, unas tablas dan el PID sin tocar el sistema real"
        bien: true
        porque: "Se llega mucho más cerca del ajuste final que probando a ciegas."
      - texto: "Porque el escalón deja la planta ya sintonizada"
        porque: "El escalón solo mide la planta; el ajuste sale después, de sus tres números."
      - texto: "Porque así el lazo ya no puede oscilar"
        porque: "Conocer la planta no quita el riesgo; ayuda a elegir una ganancia con margen."
    escalera:
      - "¿Qué se puede hacer con tres números en una tabla?"
    solucion: "Los tres números entran en métodos tabulados (sección 30.14) y dan un primer ajuste sin probar."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [43, 47, 57, 58, 66, 74]
    ideas:
      - { titulo: "Los elementos.", texto: "Sensor, comparador, controlador, actuador y planta; el sensor pone el techo." }
      - { titulo: "La planta.", texto: "Ganancia, constante de tiempo (63 %) y retardo, de un escalón en lazo abierto." }
      - { titulo: "El retardo.", texto: "El controlador actúa sin ver su efecto y se excede." }
      - { titulo: "El compromiso.", texto: "Más ganancia: menos error y más rapidez, más sobreoscilación." }
