# Lección 1.2 de la sección 30.1 «Sistemas de Control» (cap31, sec-31.1). Formato: GUIA.md.
# - La figura 30.1 con zonas (el lazo cerrado y sus términos) y una gráfica del efecto de una perturbación en lazo
#   abierto y en lazo cerrado proporcional, con la planta térmica del problema 30.B (0,8 °C/W, 120 s): en lazo abierto
#   la salida cae K·d·(1 − e^(−t/τ)); en lazo cerrado, K·d/(1 + K_p·K) con constante de tiempo τ/(1 + K_p·K).
#   La perturbación de 10 W es un valor de ejemplo (lo dice la tarjeta).
# Paso práctico: «tocar» en la figura 30.1 el bloque que pone el techo de exactitud (el sensor).
# 1.2.1 (autor121-senpro, «aprender haciendo», GUIA §13): los bloques se tocan en la figura 30.1 (el que da el error,
# el que da la variable manipulada, el techo) y en orden (medir, comparar, decidir, actuar); K_p se sube hasta dejar la
# caída por debajo de 1 °C y la caída con K_p = 5 se predice; el amortiguamiento de un segundo orden de ejemplo se
# elige para un horno (sin sobreoscilación); la constante de tiempo de la planta se marca en su respuesta al escalón.
# Quedan dos preguntas de opciones: el precio del lazo cerrado y seguimiento frente a regulación.
leccion: cap31/sec-31.1

libro:
  4: "Controlar es hacer que una magnitud física tome el valor que se quiere"
  5: "medir, comparar, decidir, actuar"
  7: "Lazo abierto: se aplica una acción calculada y se confía"
  8: "no puede volverse inestable, y no corrige nada"
  9: "Lazo cerrado: se mide el resultado y se actúa sobre el error"
  10: "a cambio puede oscilar"
  11: "Ese intercambio es el mismo de la realimentación negativa"
  13: "Consigna o referencia: lo que se quiere"
  14: "Variable de proceso: lo que hay, medido"
  15: "Error: la diferencia"
  16: "Variable manipulada: lo que el controlador ajusta"
  17: "Perturbación: lo que altera el proceso desde fuera"
  18: "Planta: el proceso físico"
  19: "seguimiento —que la salida siga una consigna cambiante— y regulación"
  26: "el sensor es el techo del sistema"
  29: "rápido con sobreoscilación, o lento sin ella"
  30: "en un horno la sobreoscilación puede ser inaceptable; en un servo, la lentitud lo es"
  32: "elegir un PID y ponerse a ajustar parámetros sin haber caracterizado la planta"
  33: "Sin conocer la ganancia, la constante de tiempo y el retardo"
  34: "Media hora midiendo la respuesta al escalón ahorra ese trabajo entero"
  36: "caracterizar la planta en lazo abierto con un escalón"
  38: "Sistema de control en lazo cerrado con realimentación negativa"
  "cap31#686": "ganancia 0,8 °C/W y constante de tiempo 120 s"

modelo:
  valores:
    K_g: { sim: "K", nombre: "ganancia de la planta", unidad: "°C/W", valor: 0.8 }
    T_p: { sim: "τ", nombre: "constante de tiempo de la planta", unidad: s, valor: 120 }
    K_p: { sim: "K_{p}", nombre: "ganancia proporcional", unidad: "W/°C", valor: 1 }
    d_w: { sim: "d", nombre: "pérdida de calor de ejemplo", unidad: W, valor: 10 }
    z_c: { sim: "ζ", nombre: "amortiguamiento de ejemplo", unidad: "", valor: 0.3 }
    w_c: { sim: "ω_{n}", nombre: "pulsación natural de ejemplo", unidad: rad/s, valor: 0.05 }
  calculos:
    caida_a: { expr: "K_g*d_w", sim: "Δy_{abierto}", nombre: "caída en lazo abierto", unidad: "°C" }
    caida_c: { expr: "K_g*d_w/(1 + K_p*K_g)", sim: "Δy_{cerrado}", nombre: "caída en lazo cerrado", unidad: "°C" }
    tau_c: { expr: "T_p/(1 + K_p*K_g)", sim: "τ_{c}", nombre: "constante de tiempo en lazo cerrado", unidad: s }
    M_p: { expr: "100*exp(-pi*z_c/sqrt(max(0.000001, 1 - z_c^2)))", sim: "M_{p}", nombre: "sobreoscilación", unidad: "%", cifras: 2 }
    p_63: { expr: "100*(1 - exp(-1))", sim: "63 %", nombre: "lo que ha subido en una constante de tiempo", unidad: "%", cifras: 3 }
    y_t: { expr: "K_g*d_w*(1 - exp(-1))", sim: "y(τ)", nombre: "subida en una constante de tiempo", unidad: "°C" }

tarjetas:
  - id: explore-lazo
    tipo: tocar
    titulo: "Medir, comparar, decidir, actuar"
    texto: "La consigna es lo que se quiere; la variable de proceso, lo que hay medido. Toque el bloque que las resta: de ahí sale el error."
    libro: [5, 13, 14, 15, 38]
    widget:
      tipo: figura
      figura: fig-31.1
      zonas: &zonas-lazo
        - { id: consigna, rotulo: "Entrada, a la izquierda", rect: [20, 30, 62, 40] }
        - { id: comparador, rotulo: "Círculo con Σ", rect: [88, 28, 44, 46] }
        - { id: controlador, rotulo: "Bloque azul", rect: [164, 33, 76, 37] }
        - { id: planta, rotulo: "Bloque naranja", rect: [309, 33, 75, 37] }
        - { id: sensor, rotulo: "Bloque verde, abajo", rect: [233, 113, 79, 36] }
    tocar:
      bien: [comparador]
      porque:
        consigna: "Esa es la consigna, lo que se quiere: entra en el comparador."
        controlador: "El controlador recibe el error ya calculado y decide la acción."
        planta: "La planta es el proceso físico: no compara nada."
        sensor: "El sensor mide lo que hay y lo lleva de vuelta al comparador."
    exito: "El comparador, Σ: resta la medida a la consigna. Lo que sale es el error, la diferencia."
    escalera:
      - "Busque el símbolo de la suma."
    solucion: "El círculo con Σ."

  - id: empareje-terminos
    tipo: tocar
    titulo: "Los términos, con precisión"
    texto: "La variable manipulada es lo que se ajusta para corregir el error; la perturbación altera el proceso desde fuera. Toque el bloque que entrega la variable manipulada."
    libro: [13, 14, 15, 16, 17, 18]
    widget:
      tipo: figura
      figura: fig-31.1
      zonas: *zonas-lazo
    tocar:
      bien: [controlador]
      porque:
        consigna: "La consigna no se ajusta: es lo que se quiere."
        comparador: "El comparador entrega el error, no la acción."
        planta: "La planta recibe la variable manipulada y la perturbación: es el proceso físico."
        sensor: "El sensor entrega la variable de proceso, lo medido."
    exito: "El controlador: decide la acción a partir del error. La planta, el horno o el motor, la recibe."
    escalera:
      - "¿Qué bloque decide cuánto calentar?"
    solucion: "El bloque azul, el controlador."

  - id: explore-perturbacion
    tipo: explorar
    titulo: "Una perturbación, dos lazos"
    texto: "Horno de 0,8 °C/W y 120 s; a t = 0 pierde 10 W. Suba K_{p} hasta que la caída en lazo cerrado no llegue a 1 °C."
    nota: "Los 10 W son de ejemplo."
    libro: ["cap31#686", 7, 9]
    inicio: { K_p: 1 }
    widget:
      tipo: grafica
      x: { id: t, min: 0, max: 600, unidad: s, rotulo: "t" }
      y: { min: -9, max: 1, unidad: "°C", rotulo: "Δy" }
      curvas:
        - { expr: "-K_g*d_w*(1 - exp(-t/T_p))", color: azul, rotulo: "lazo abierto", discontinua: true }
        - { expr: "-K_g*d_w/(1 + K_p*K_g)*(1 - exp(-t*(1 + K_p*K_g)/T_p))", color: naranja, rotulo: "lazo cerrado" }
      lectura: { valor: caida_c, rotulo: "Caída en lazo cerrado" }
      datos:
        - { valor: caida_a, rotulo: "En lazo abierto: {{caida_a}}" }
        - { valor: tau_c, rotulo: "Constante de tiempo cerrada: {{tau_c}}" }
      mandos:
        - { valor: K_p, lista: [1, 2, 10, 20], rotulo: "Ganancia proporcional" }
    objetivo:
      condiciones:
        - { valor: caida_c, max: 1, rotulo: "Caída: {{caida_c}}" }
      logrado: "Con K_{p} = {{K_p}}, {{caida_c}} frente a los {{caida_a}} del lazo abierto, y además {{tau_c}} de constante de tiempo: el lazo corrige sin saber qué ha pasado."
      pistas:
        - { texto: "Aún cae demasiado: más ganancia." }
    escalera:
      - "La caída cerrada es la abierta dividida por 1 + K_{p}·K."
    solucion: "K_{p} = 10 o más."
    comprobar:
      - { d_w: 10, caida_a: 8 }
      - { con: { K_p: 10 }, caida_c: 0.889, tol: 0.01 }

  - id: predecir-corriente-aire
    tipo: simular
    titulo: "Termostato o tiempo fijo"
    texto: "La corriente de aire le quita 10 W al horno. Con un termostato de K_{p} = 5 W/°C, ¿cuánto cae su temperatura?"
    libro: [7, 8, 9, 10, "cap31#686"]
    fijar: { K_p: 5 }
    widget:
      tipo: grafica
      x: { id: t, min: 0, max: 600, unidad: s, rotulo: "t" }
      y: { min: -9, max: 1, unidad: "°C", rotulo: "Δy" }
      curvas:
        - { expr: "-K_g*d_w*(1 - exp(-t/T_p))", color: azul, rotulo: "lazo abierto", discontinua: true }
        - { expr: "-K_g*d_w/(1 + K_p*K_g)*(1 - exp(-t*(1 + K_p*K_g)/T_p))", color: naranja, rotulo: "lazo cerrado" }
      lectura: { valor: caida_c, rotulo: "Caída con termostato" }
      ocultar: true
      mandos: []
    simular:
      objetivo: caida_c
      unidad: "°C"
      tol: 0.03
      rotulo: "Caída con termostato"
      errores:
        - { expr: "caida_a", texto: "Esos 8 °C son los del tiempo fijo, que no se entera: el termostato mide y calienta más." }
        - { expr: "K_g*d_w/(K_p*K_g)", texto: "Falta el 1: la caída es K·d/(1 + K_{p}·K)." }
    exito: "1,6 °C frente a 8 °C: el lazo cerrado corrige sin saber qué ha pasado. El abierto no puede volverse inestable, pero no corrige nada."
    escalera:
      - "1 + K_{p}·K = 1 + 5 × 0,8 = 5."
    solucion: "8 °C / 5 = 1,6 °C."
    comprobar:
      - { caida_c: 1.6, caida_a: 8 }
      - { con: { K_p: 1 }, K_p: 1, d_w: 10 }

  - id: porque-oscilar
    tipo: porque
    titulo: "El precio del lazo cerrado"
    texto: "El lazo cerrado corrige todo. ¿Por qué no se usa siempre sin pensarlo?"
    libro: [8, 10, 11]
    widget:
      tipo: figura
      figura: fig-31.1
      zonas:
        - { id: todo, rotulo: "El lazo cerrado", rect: [0, 0, 450, 162] }
    opciones:
      - texto: "Porque a cambio puede oscilar: es el intercambio de la realimentación negativa"
        bien: true
        porque: "No es casualidad: el lazo de control es la misma realimentación negativa del amplificador."
      - texto: "Porque necesita saber qué perturbación ha ocurrido"
        porque: "Al revés: corrige sin saberlo, solo ve que la salida no es la que debe."
      - texto: "Porque no compensa el envejecimiento de los componentes"
        porque: "Eso es lo que no corrige el lazo abierto; el cerrado sí."
    escalera:
      - "¿Qué riesgo no tiene nunca un lazo abierto?"
    solucion: "Puede oscilar: es el mismo intercambio de la realimentación negativa."

  - id: ordene-estructura
    tipo: tocar
    titulo: "La misma estructura siempre"
    texto: "Un horno, un motor o una fuente: toque en orden los bloques que miden, comparan, deciden y reciben la acción."
    libro: [5]
    widget:
      tipo: figura
      figura: fig-31.1
      zonas: *zonas-lazo
    tocar:
      bien: [sensor, comparador, controlador, planta]
      orden: true
      porque:
        consigna: "La consigna no hace nada en cada vuelta: es la referencia fija."
    exito: "Medir, comparar, decidir y actuar, sea cual sea el proceso."
    escalera:
      - "Sin medida no hay nada que comparar: el sensor va primero."
    solucion: "Sensor, comparador, controlador y planta."

  - id: toque-techo
    tipo: tocar
    titulo: "El techo del sistema"
    texto: "Toque el bloque cuya exactitud limita todo el lazo, por bueno que sea el controlador."
    libro: [26, 38]
    widget:
      tipo: figura
      figura: fig-31.1
      zonas:
        - { id: controlador, rotulo: "Bloque azul", rect: [164, 33, 76, 37] }
        - { id: planta, rotulo: "Bloque naranja", rect: [309, 33, 75, 37] }
        - { id: sensor, rotulo: "Bloque verde, abajo", rect: [233, 113, 79, 36] }
        - { id: comparador, rotulo: "Círculo con Σ", rect: [88, 28, 44, 46] }
    tocar:
      bien: [sensor]
      porque:
        controlador: "Un controlador mejor no compensa un mal sensor: corrige hacia lo que se mide."
        planta: "La planta pone la rapidez posible, no la exactitud: el lazo la corrige."
        comparador: "Resta sin error; lo que resta es la medida que le llega."
    exito: "El sensor: un lazo no puede controlar mejor de lo que mide."
    escalera:
      - "El lazo lleva el error a cero. ¿El error frente a qué?"
    solucion: "El sensor, bloque verde: el sensor es el techo del sistema."

  - id: seguimiento-regulacion
    tipo: pregunta
    titulo: "Dos objetivos distintos"
    texto: "Un horno que debe mantener su temperatura al abrir la puerta. ¿Qué objetivo es?"
    libro: [19]
    widget:
      tipo: figura
      figura: fig-31.1
      zonas:
        - { id: todo, rotulo: "El lazo cerrado", rect: [0, 0, 450, 162] }
    opciones:
      - texto: "Regulación: mantenerse ante perturbaciones"
        bien: true
        porque: "La consigna no cambia; lo que llega es una perturbación."
      - texto: "Seguimiento: seguir una consigna cambiante"
        porque: "Eso sería un perfil de temperatura que cambia con el tiempo."
      - texto: "Los dos son lo mismo; un buen lazo hace ambos igual de bien"
        porque: "Son objetivos distintos: un lazo optimizado para uno no lo está para el otro."
    escalera:
      - "¿Cambia la consigna o llega algo de fuera?"
    solucion: "Regulación; y un lazo optimizado para ella no lo está para el seguimiento."

  - id: empareje-comportamiento
    tipo: explorar
    titulo: "Rápido o sin sobreoscilación"
    texto: "Respuesta al escalón de un lazo de ejemplo. Ajústela para un horno, donde pasarse de temperatura es inaceptable."
    nota: "Lazo de segundo orden de ejemplo."
    libro: [29, 30]
    inicio: { z_c: 0.3 }
    widget:
      tipo: grafica
      x: { id: t, min: 0, max: 300, unidad: s, rotulo: "t", muestras: 600 }
      y: { min: 0, max: 1.6, unidad: "", rotulo: "salida / consigna" }
      curvas:
        - { expr: "1 - exp(-z_c*w_c*t)*(cos(w_c*sqrt(max(0.000001, 1 - z_c^2))*t) + z_c/sqrt(max(0.000001, 1 - z_c^2))*sin(w_c*sqrt(max(0.000001, 1 - z_c^2))*t))", color: naranja, rotulo: "respuesta" }
        - { expr: "1", color: tinta, rotulo: "consigna", discontinua: true }
      lectura: { valor: M_p, rotulo: "Sobreoscilación" }
      mandos:
        - { valor: z_c, lista: [0.3, 0.5, 0.7, 1], rotulo: "Amortiguamiento, ζ" }
    objetivo:
      condiciones:
        - { valor: M_p, max: 0.1, rotulo: "Sobreoscilación: {{M_p}}" }
      logrado: "Sin pasarse, pero más lento: lo que pide un horno. A un servo, en cambio, no le vale la lentitud."
      pistas:
        - { texto: "Se pasa de la consigna: amortigüe más." }
    escalera:
      - "Rápido con sobreoscilación, o lento sin ella."
    solucion: "ζ = 1."
    comprobar:
      - { con: { z_c: 1 }, M_p: 0 }

  - id: primer-paso
    tipo: marcar
    titulo: "El error más común"
    texto: "Antes de elegir un PID, se caracteriza la planta con un escalón en lazo abierto. Los 10 W de ejemplo al horno: marque su constante de tiempo."
    libro: [32, 33, 34, 36, "cap31#686"]
    widget:
      tipo: grafica
      x: { id: t, min: 0, max: 600, unidad: s, rotulo: "t" }
      y: { min: 0, max: 9, unidad: "°C", rotulo: "Δy" }
      curvas:
        - { expr: "K_g*d_w*(1 - exp(-t/T_p))", color: naranja, rotulo: "respuesta al escalón" }
        - { expr: "K_g*d_w", color: tinta, rotulo: "valor final", discontinua: true }
      mandos: []
    marcar:
      modo: x
      curva: 0
      x: "T_p"
      tol: 0.02
      inicio: { x: 500, y: 0 }
      rotulo: "La constante de tiempo"
      pasos: 120
    pistas:
      - { cuando: { valor: marca_x, menor: 120 }, texto: "Ahí aún no ha subido el {{p_63}} del salto: más a la derecha." }
      - { texto: "Ahí ya ha subido más del {{p_63}}: más a la izquierda." }
    exito: "{{T_p}}: ha subido {{y_t}} de {{caida_a}}. Con la ganancia, la constante y el retardo medidos, el ajuste se calcula: media hora que ahorra horas de prueba y error."
    escalera:
      - "En una constante de tiempo, la curva sube el {{p_63}} del salto."
    solucion: "En {{T_p}}."
    comprobar:
      - { T_p: 120, p_63: 63.2, y_t: 5.06, d_w: 10, tol: 0.003 }

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [4, 9, 10, 26, 19, 36]
    ideas:
      - { titulo: "Controlar.", texto: "Medir, comparar, decidir, actuar, contra perturbaciones y componentes imperfectos." }
      - { titulo: "Abierto o cerrado.", texto: "El abierto no corrige nada; el cerrado corrige todo y puede oscilar." }
      - { titulo: "El sensor manda.", texto: "Un lazo no controla mejor de lo que mide." }
      - { titulo: "Primero la planta.", texto: "Un escalón en lazo abierto antes de elegir el controlador." }
