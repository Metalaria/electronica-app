# Lección 1.2 de la sección 30.7 «Más Allá del PID: Otras Técnicas de Control» (cap31, sec-31.7). Formato: GUIA.md.
# - Todo-nada con histéresis sobre la planta térmica del problema 30.B (0,8 °C/W, 120 s): con el calefactor encendido
#   tiende a T_max = T_a + 0,8·P, apagado a T_a; oscila entre consigna ± banda/2 con t_on = τ·ln((T_max − T_bajo)/
#   (T_max − T_alto)) y t_off = τ·ln((T_alto − T_a)/(T_bajo − T_a)). La curva es el régimen periódico desde T_bajo.
#   El calefactor de 100 W, el ambiente de 20 °C y la consigna de 60 °C son de ejemplo (lo dice la tarjeta).
# Sin paso práctico: sección de criterios (la tabla de decisión se empareja).
# 1.2.1 (autor121-senpro, «aprender haciendo», GUIA §13): la banda se elige dos veces sobre la misma planta (un grado
# de la consigna con al menos 10 s de periodo; y, si se acepta más oscilación, conmutar como mucho una vez por minuto,
# especificación de ejemplo); el periodo con 1 °C se predice; ciclos enteros frente a ángulo de fase se elige sobre la
# corriente de la carga (red de 50 Hz y disparo a 90°, de ejemplo); y la oscilación aceptada en la figura 30.14 se
# calcula. Se quita la pregunta del adaptativo (su riesgo va al éxito de la tabla). Quedan la pregunta del difuso y la
# tabla de decisión por emparejar.
leccion: cap31/sec-31.7

libro:
  243: "el sistema es muy no lineal, el modelo es desconocido, o las reglas de decisión son cualitativas"
  246: "Con una banda de histéresis para no conmutar continuamente"
  247: "la variable oscila dentro de la banda con un periodo que depende de la inercia del sistema"
  248: "no necesita modelo, no se desestabiliza"
  249: "su amplitud es al menos la banda de histéresis"
  252: "no genera armónicos, porque siempre conmuta en el cruce por cero"
  255: "no necesita modelo matemático"
  256: "no hay garantías de estabilidad demostrables"
  258: "Sirve cuando la planta cambia"
  259: "puede volverse inestable si el algoritmo de adaptación se realimenta con ruido"
  261: "Es lo mejor cuando hay retardos grandes o restricciones que respetar"
  263: "Oscilación aceptable, sistema lento"
  264: "empezar por lo más simple que cumpla la especificación"
  267: "Con histéresis, la temperatura oscila dentro de la banda y el ajuste es trivial"
  268: "en muchos casos la conclusión honesta es que la histéresis bastaba"
  269: "Histéresis frente a PID sobre la misma planta"
  "cap31#684": "Problema 30.B"
  "cap31#686": "ganancia 0,8 °C/W y constante de tiempo 120 s"

modelo:
  valores:
    K_g: { sim: "K", nombre: "ganancia de la planta", unidad: "°C/W", valor: 0.8 }
    T_p: { sim: "τ", nombre: "constante de tiempo", unidad: s, valor: 120 }
    P_h: { sim: "P", nombre: "potencia del calefactor de ejemplo", unidad: W, valor: 100 }
    T_a: { sim: "T_{a}", nombre: "temperatura ambiente de ejemplo", unidad: "°C", valor: 20 }
    T_s: { sim: "T_{c}", nombre: "consigna de ejemplo", unidad: "°C", valor: 60 }
    h_b: { sim: "h", nombre: "banda de histéresis", unidad: "°C", valor: 2 }
    k_c: { sim: "modo", nombre: "regular por ciclos enteros", unidad: "", valor: 0 }
    T_1: { sim: "T_{mín}", nombre: "mínimo del todo-nada en la figura", unidad: "°C", valor: 19.3 }
    T_2: { sim: "T_{máx}", nombre: "máximo del todo-nada en la figura", unidad: "°C", valor: 21.8 }
  calculos:
    T_mx: { expr: "T_a + K_g*P_h", sim: "T_{max}", nombre: "temperatura con el calefactor siempre encendido", unidad: "°C" }
    T_lo: { expr: "T_s - h_b/2", sim: "T_{bajo}", nombre: "umbral de encendido", unidad: "°C" }
    T_hi: { expr: "T_s + h_b/2", sim: "T_{alto}", nombre: "umbral de apagado", unidad: "°C" }
    t_on: { expr: "T_p*ln((T_mx - T_lo)/(T_mx - T_hi))", sim: "t_{on}", nombre: "tiempo encendido", unidad: s }
    t_of: { expr: "T_p*ln((T_hi - T_a)/(T_lo - T_a))", sim: "t_{off}", nombre: "tiempo apagado", unidad: s }
    P_o: { expr: "t_on + t_of", sim: "T_{osc}", nombre: "periodo de la oscilación", unidad: s }
    s_c: { expr: "1 - k_c", sim: "salto", nombre: "salto de corriente al conmutar", unidad: "" }
    d_T: { expr: "T_2 - T_1", sim: "ΔT", nombre: "oscilación del todo-nada", unidad: "°C" }

tarjetas:
  - id: explore-histeresis
    tipo: explorar
    titulo: "El termostato"
    texto: "Por debajo de la banda, encender; por encima, apagar. Elija la banda más ancha que la deja a un grado de la consigna."
    nota: "Problema 30.B; 100 W, 20 °C de ambiente y 60 °C de consigna, de ejemplo."
    libro: [246, 247, "cap31#684", "cap31#686"]
    inicio: { h_b: 10 }
    widget:
      tipo: grafica
      x: { id: t, min: 0, max: 600, unidad: s, rotulo: "t", muestras: 2000 }
      y: { min: 50, max: 70, unidad: "°C", rotulo: "T" }
      curvas:
        - { expr: "(1 - ceil((t - P_o*floor(t/P_o) - t_on)/1e9))*(T_mx - (T_mx - T_lo)*exp(-(t - P_o*floor(t/P_o))/T_p)) + ceil((t - P_o*floor(t/P_o) - t_on)/1e9)*(T_a + (T_hi - T_a)*exp(-(t - P_o*floor(t/P_o) - t_on)/T_p))", color: naranja, rotulo: "temperatura" }
        - { expr: "T_hi", color: tinta, rotulo: "apagar", discontinua: true }
        - { expr: "T_lo", color: tinta, rotulo: "encender", discontinua: true }
      lectura: { valor: P_o, rotulo: "Periodo de la oscilación" }
      mandos:
        - { valor: h_b, lista: [1, 2, 5, 10], rotulo: "Banda de histéresis" }
    objetivo:
      condiciones:
        - { valor: T_hi, max: 61, rotulo: "Hasta {{T_hi}}" }
        - { valor: P_o, min: 10, rotulo: "Periodo: {{P_o}}" }
      logrado: "Banda de {{h_b}}: oscila dentro de ella con un periodo de {{P_o}}, que depende de la inercia del horno."
      pistas:
        - { cuando: { valor: T_hi, mayor: 61 }, texto: "Se aleja más de un grado: estreche la banda." }
        - { texto: "A un grado, pero conmutando sin parar: ensánchela un poco." }
    escalera:
      - "Un grado a cada lado son dos de banda."
    solucion: "Banda de 2 °C."
    comprobar:
      - { P_h: 100, T_a: 20, T_s: 60, T_mx: 100 }
      - { con: { h_b: 2 }, P_o: 12, tol: 0.02 }

  - id: predecir-banda
    tipo: simular
    titulo: "Una banda más estrecha"
    texto: "Se estrecha la banda de histéresis a 1 °C. ¿Cuánto dura ahora cada oscilación?"
    libro: [246, 249]
    fijar: { h_b: 1 }
    widget:
      tipo: grafica
      x: { id: t, min: 0, max: 600, unidad: s, rotulo: "t", muestras: 2000 }
      y: { min: 50, max: 70, unidad: "°C", rotulo: "T" }
      curvas:
        - { expr: "T_hi", color: tinta, rotulo: "apagar", discontinua: true }
        - { expr: "T_lo", color: tinta, rotulo: "encender", discontinua: true }
      lectura: { valor: P_o, rotulo: "Periodo de la oscilación" }
      ocultar: true
      mandos: []
    simular:
      objetivo: P_o
      unidad: s
      tol: 0.08
      rotulo: "Periodo de la oscilación"
      errores:
        - { expr: "t_on", texto: "Eso es solo el tiempo encendido; el periodo suma también el apagado." }
    exito: "Unos 6 s: oscila menos, pero conmuta mucho más a menudo. La amplitud es al menos la banda: la oscilación es inevitable."
    escalera:
      - "Con 2 °C de banda el periodo era de unos 12 s; la mitad de banda, la mitad de recorrido."
    solucion: "Unos 6 s."
    comprobar:
      - { P_o: 6, tol: 0.01 }
      - { con: { h_b: 2 }, P_o: 12, tol: 0.02 }

  - id: virtudes-histeresis
    tipo: explorar
    titulo: "Lo simple, bien elegido"
    texto: "Si la oscilación de varios grados es aceptable, ensanche la banda hasta que el calefactor conmute como mucho una vez por minuto."
    nota: "Especificación de ejemplo."
    libro: [248, 249]
    inicio: { h_b: 1 }
    widget:
      tipo: grafica
      x: { id: t, min: 0, max: 600, unidad: s, rotulo: "t", muestras: 2000 }
      y: { min: 50, max: 70, unidad: "°C", rotulo: "T" }
      curvas:
        - { expr: "(1 - ceil((t - P_o*floor(t/P_o) - t_on)/1e9))*(T_mx - (T_mx - T_lo)*exp(-(t - P_o*floor(t/P_o))/T_p)) + ceil((t - P_o*floor(t/P_o) - t_on)/1e9)*(T_a + (T_hi - T_a)*exp(-(t - P_o*floor(t/P_o) - t_on)/T_p))", color: naranja, rotulo: "temperatura" }
        - { expr: "T_hi", color: tinta, rotulo: "apagar", discontinua: true }
        - { expr: "T_lo", color: tinta, rotulo: "encender", discontinua: true }
      lectura: { valor: P_o, rotulo: "Periodo de la oscilación" }
      mandos:
        - { valor: h_b, lista: [1, 2, 5, 10], rotulo: "Banda de histéresis" }
    objetivo:
      condiciones:
        - { valor: P_o, min: 60, rotulo: "Periodo: {{P_o}}" }
      logrado: "Sin modelo, sin riesgo de desestabilizarse y con un ajuste trivial: si la oscilación se acepta, la histéresis es la solución correcta."
      pistas:
        - { texto: "Aún conmuta demasiado a menudo: más banda." }
    escalera:
      - "Más banda, más tiempo para recorrerla."
    solucion: "Banda de 10 °C."
    comprobar:
      - { con: { h_b: 10 }, P_o: 60.3, tol: 0.02 }

  - id: ciclos-enteros
    tipo: explorar
    titulo: "Ciclos enteros"
    texto: "Una resistencia calefactora de red. Elija la forma de regular que no da saltos de corriente al conmutar."
    nota: "Red y disparo de ejemplo."
    libro: [252]
    inicio: { k_c: 0 }
    widget:
      tipo: grafica
      x: { id: t, min: 0, max: 0.1, unidad: s, rotulo: "t", muestras: 1600 }
      y: { min: -1.2, max: 1.2, unidad: "", rotulo: "corriente" }
      curvas:
        - { expr: "(1 - k_c)*sin(2*pi*50*t)*min(1, max(0, ((t - 0.01*floor(t/0.01))/0.01 - 0.5)*1000000)) + k_c*sin(2*pi*50*t)*min(1, max(0, (0.04 - t)*1000000))", color: naranja, rotulo: "corriente en la carga" }
      lectura: { valor: s_c, rotulo: "Saltos al conmutar" }
      mandos:
        - { valor: k_c, lista: [0, 1], nombres: [ángulo de fase, ciclos enteros], rotulo: "Forma de regular" }
    objetivo:
      condiciones:
        - { valor: s_c, max: 0, rotulo: "Sin saltos" }
      logrado: "Ciclos enteros: conmuta siempre en el cruce por cero y no genera armónicos. Su límite: la potencia va a escalones de un ciclo, solo para cargas de mucha inercia."
      pistas:
        - { texto: "Disparando a media senoide la corriente salta de golpe: armónicos." }
    escalera:
      - "¿En qué instante de la senoide no hay salto?"
    solucion: "Ciclos enteros."
    comprobar:
      - { con: { k_c: 1 }, s_c: 0 }

  - id: porque-difuso
    tipo: porque
    titulo: "La ventaja real del difuso"
    texto: "«Si el error es grande y crece, actuar fuerte». ¿Cuál es la ventaja real del control difuso?"
    libro: [243, 255, 256]
    widget:
      tipo: figura
      figura: fig-31.14
      zonas:
        - { id: todo, rotulo: "Histéresis frente a PID", rect: [0, 0, 446, 202] }
    opciones:
      - texto: "Que no necesita modelo matemático: se diseña con la experiencia de quien conoce el proceso"
        bien: true
        porque: "Su límite: no hay garantías de estabilidad y el ajuste es empírico."
      - texto: "Que es más inteligente que un PID"
        porque: "No lo es: con un sistema bien modelado, un PID bien ajustado suele ser mejor."
      - texto: "Que garantiza la estabilidad"
        porque: "Al revés: no hay garantías de estabilidad demostrables."
    escalera:
      - "¿Qué falta en el proceso para que el difuso tenga sentido?"
    solucion: "No necesita modelo matemático."

  - id: empareje-tecnicas
    tipo: pregunta
    titulo: "La tabla de decisión"
    texto: "Empareje cada situación con la técnica."
    libro: [258, 259, 261, 263]
    widget:
      tipo: figura
      figura: fig-31.14
      zonas:
        - { id: todo, rotulo: "Histéresis frente a PID", rect: [0, 0, 446, 202] }
    emparejar:
      - ["Oscilación aceptable, sistema lento", "Todo-nada con histéresis"]
      - ["Carga térmica de red", "Ciclos enteros"]
      - ["Sistema modelable", "PID"]
      - ["Sin modelo, con experiencia del proceso", "Difuso"]
      - ["Planta que cambia mucho", "Adaptativo"]
      - ["Retardo grande o restricciones", "Predictivo"]
    exito: "Las dos primeras filas resuelven la mayoría de los problemas. El adaptativo, solo con variación grande y conocida: puede desestabilizarse si se adapta al ruido."
    pistas:
      - { texto: "El predictivo usa un modelo para mirar hacia delante: le sientan bien los retardos." }
    escalera:
      - "El adaptativo ajusta sus parámetros mientras la planta cambia."
    solucion: "Histéresis, ciclos enteros, PID, difuso, adaptativo y predictivo, en ese orden."

  - id: porque-simple
    tipo: simular
    titulo: "La conclusión honesta"
    texto: "La misma planta: el todo-nada oscila entre 19,3 y 21,8 °C y el PID se queda en la consigna. ¿Cuántos grados de oscilación hay que aceptar para ahorrarse el PID?"
    libro: [264, 267, 268, 269]
    widget:
      tipo: figura
      figura: fig-31.14
      zonas:
        - { id: todo, rotulo: "Histéresis frente a PID", rect: [0, 0, 446, 202] }
    simular:
      objetivo: d_T
      unidad: "°C"
      tol: 0.03
      rotulo: "Oscilación aceptada"
      errores:
        - { expr: "d_T/2", texto: "Esa es la mitad, lo que se aparta a cada lado; la oscilación va de 19,3 a 21,8 °C." }
    exito: "2,5 °C. Si se aceptan, la histéresis bastaba: se empieza por lo más simple que cumpla la especificación."
    escalera:
      - "Del mínimo al máximo."
    solucion: "21,8 − 19,3 = 2,5 °C."
    comprobar:
      - { d_T: 2.5, T_1: 19.3, T_2: 21.8 }

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [247, 249, 252, 255, 261, 264]
    ideas:
      - { titulo: "Histéresis.", texto: "Oscila dentro de la banda, sin modelo y sin inestabilidad." }
      - { titulo: "Ciclos enteros.", texto: "Sin armónicos, para cargas de mucha inercia." }
      - { titulo: "Difuso, adaptativo, predictivo.", texto: "Sin modelo; planta que cambia; retardos y restricciones." }
      - { titulo: "El criterio.", texto: "Lo más simple que cumpla la especificación." }
