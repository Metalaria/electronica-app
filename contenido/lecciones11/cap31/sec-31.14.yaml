# Lección 1.2 de la sección 30.19 «Problemas de Diseño» (cap31, sec-31.14). Formato: GUIA.md.
# - 30.B: el error permanente del proporcional, 1/(1 + K_p·K) con K = 0,8 °C/W (tabla del libro: 20,0 % con 5,
#   5,9 % con 20).
# - 30.D: Ziegler-Nichols desde Routh (K_u = 572, T_u = 0,958 s) y la tabla de los tres PID; la forma paralela del
#   diseño por colocación de ceros, K_p = K_c·(1 + T′_d/T′_i) con K_c = 133,7, T′_i = 1 s y T′_d = 1/3 s.
# - 30.C: cuatro decibelios son multiplicar la potencia por 10^0,4 = 2,5. La curva de BPSK, Q(√(2·E_b/N₀)) =
#   erfc(√(E_b/N₀))/2 (motor12e: `erfc`), en explore-ber (los tres puntos de la tabla) y en margen-enlace.
# Paso práctico: «simular» la K_p de Ziegler-Nichols del problema 30.D (343; errores típicos: las filas del P y del PI).
# 1.2.1 (autor121-senpro, «aprender haciendo», GUIA §13): 30.B, K_p se elige para el 20 % de la tabla y el error con
# 20 W/°C y la fase del integrador se predicen; 30.D, el cero del PI (1/T_i) se lleva sobre el polo lento (1 rad/s) y
# la K_p de la colocación de ceros se predice; 30.A, el margen de un sobreimpulso del 40 % se marca en la curva de
# ζ ≈ MF/100 de la sección 30.9 (28°, «menos de 30°»); 30.C, E_b/N_0 se sube hasta un error por millón y los 4 dB se
# predicen. Quedan dos preguntas de opciones (lo que da la receta y el margen de enlace) y las tres sintonías, por
# emparejar.
leccion: cap31/sec-31.14

libro:
  673: "Problema 30.A — Sintonizar un PID de verdad"
  680: "se usan reglas más suaves (por ejemplo, Kp = 0,33·Ku en lugar de 0,6)"
  682: "un sobreimpulso del 25 % ya corresponde a unos 40°, y uno del 40 % a menos de 30°, que es poco. Si necesitas 60°, baja Kp"
  684: "Problema 30.B — Por qué hace falta el término integral"
  686: "ganancia 0,8 °C/W y constante de tiempo 120 s"
  690: "5,9 %"
  692: "Subir Kp lo reduce pero no lo anula, y a cambio acerca la inestabilidad"
  693: "el integrador añade 90° de retardo de fase"
  697: "Problema 30.C — Cuánta potencia necesita un enlace digital"
  699: "Un enlace digital debe alcanzar una tasa de error de 10⁻⁶ con modulación BPSK"
  702: "Para BPSK, la probabilidad de error es Q(√(2·Eb/N₀))"
  703: "7,7 × 10⁻⁴"
  704: "Entre 7 y 11 dB, cuatro decibelios, la tasa de error mejora en tres órdenes de magnitud"
  705: "Cuatro decibelios son multiplicar la potencia por 2,5"
  706: "margen de enlace de al menos 6 a 10 dB sobre el mínimo teórico"
  710: "Problema 30.D — Del papel al ajuste: un PID por márgenes"
  715: "Ku = 572 y Tu = 2π/√43 = 0,958 s"
  716: "54,2 % · 2,62 s"
  717: "el cero del PI cae en 2,09 rad/s, por encima del polo lento de la planta (1 rad/s)"
  718: "los ceros van sobre los dos polos lentos: T′i = 1 s y T′d = 1/3 s"
  719: "una perturbación de carga se corrige con su constante de tiempo de 1 s"

modelo:
  valores:
    K_g: { sim: "K", nombre: "ganancia de la planta térmica", unidad: "°C/W", valor: 0.8 }
    Kp_b: { sim: "K_{p}", nombre: "ganancia proporcional", unidad: "W/°C", valor: 5 }
    K_ud: { sim: "K_{u}", nombre: "ganancia crítica", unidad: "", valor: 572 }
    Kc_d: { sim: "K_{c}", nombre: "ganancia del PID serie", unidad: "", valor: 133.7 }
    Ti_s: { sim: "T′_{i}", nombre: "tiempo integral serie", unidad: s, valor: 1 }
    Td_s: { sim: "T′_{d}", nombre: "tiempo derivativo serie", unidad: s, valor: 0.33333 }
    dB_c: { sim: "Δ", nombre: "decibelios de más", unidad: dB, valor: 4 }
    Eb_c: { sim: "E_{b}/N_{0}", nombre: "energía por bit frente al ruido", unidad: dB, valor: 7 }
    T_iz: { sim: "T_{i}", nombre: "tiempo integral del PI", unidad: s, valor: 0.479 }
    p_l: { sim: "p_{lento}", nombre: "polo lento de la planta", unidad: "rad/s", valor: 1 }
    M_40: { sim: "M_{p}", nombre: "sobreimpulso medido", unidad: "%", valor: 40 }
  calculos:
    e_b: { expr: "100/(1 + Kp_b*K_g)", sim: "e", nombre: "error permanente", unidad: "%" }
    Kp_zn: { expr: "0.6*K_ud", sim: "K_{p}", nombre: "K_p de Ziegler-Nichols", unidad: "" }
    Kp_P: { expr: "0.5*K_ud", sim: "K_{p}", nombre: "fila del P", unidad: "" }
    Kp_PI: { expr: "0.45*K_ud", sim: "K_{p}", nombre: "fila del PI", unidad: "" }
    Kp_33: { expr: "0.33*K_ud", sim: "K_{p}", nombre: "regla suave", unidad: "" }
    Kp_pz: { expr: "Kc_d*(1 + Td_s/Ti_s)", sim: "K_{p}", nombre: "K_p de la colocación de ceros", unidad: "" }
    Ti_p: { expr: "Ti_s + Td_s", sim: "T_{i}", nombre: "T_i paralelo", unidad: s }
    Td_p: { expr: "Ti_s*Td_s/(Ti_s + Td_s)", sim: "T_{d}", nombre: "T_d paralelo", unidad: s }
    g_c: { expr: "10^(dB_c/10)", sim: "P₂/P₁", nombre: "razón de potencias", unidad: "" }
    # (motor12e: erfc) BPSK, Q(√(2·E_b/N₀)) = erfc(√(E_b/N₀))/2, with E_b/N₀ in dB
    ber: { expr: "0.5*erfc(sqrt(10^(Eb_c/10)))", sim: "BER", nombre: "tasa de error", unidad: "", cifras: 2 }
    n_err: { expr: "1/ber", sim: "N", nombre: "bits por cada error", unidad: "", cifras: 4 }
    z_pi: { expr: "1/T_iz", sim: "1/T_{i}", nombre: "cero del PI", unidad: "rad/s" }
    f_int: { expr: "90", sim: "φ", nombre: "retardo de fase del integrador", unidad: "°" }
    MF_40: { expr: "100*(-ln(M_40/100))/sqrt(pi^2 + ln(M_40/100)^2)", sim: "MF", nombre: "margen de fase de ese sobreimpulso", unidad: "°" }
    e_b1: { expr: "100/(Kp_b*K_g)", sim: "e", nombre: "sin el 1", unidad: "%" }
    e_b2: { expr: "100/(1 + Kp_b)", sim: "e", nombre: "sin la K", unidad: "%" }
    g_20: { expr: "10^(dB_c/20)", sim: "P₂/P₁", nombre: "con 20 en lugar de 10", unidad: "" }

tarjetas:
  - id: explore-30b
    tipo: explorar
    titulo: "30.B: el error que no se va"
    texto: "La planta térmica de 0,8 °C/W con solo proporcional. Elija la K_{p} que deja un error permanente del 20 %."
    libro: [684, 686, 692]
    inicio: { Kp_b: 1 }
    widget:
      tipo: grafica
      x: { id: k, min: 0, max: 40, unidad: "W/°C", rotulo: "K_{p}" }
      y: { min: 0, max: 100, unidad: "%", rotulo: "error permanente" }
      curvas:
        - { expr: "100/(1 + k*K_g)", color: naranja, rotulo: "1/(1 + K_{p}·K)" }
      marcas:
        - { x: "Kp_b", y: "e_b", rotulo: "{{e_b}}" }
      lectura: { valor: e_b, rotulo: "Error permanente" }
      mandos:
        - { valor: Kp_b, lista: [1, 5, 20, 40], rotulo: "Ganancia proporcional" }
    objetivo:
      condiciones:
        - { valor: e_b, objetivo: 20, tol: 0.01, rotulo: "Error: {{e_b}}" }
      logrado: "K_{p} = {{Kp_b}}: 1/(1 + 5 × 0,8) = 20 %. Subir K_{p} lo reduce pero no lo anula."
      pistas:
        - { cuando: { valor: e_b, mayor: 20.2 }, texto: "Más error del pedido: suba K_{p}." }
        - { texto: "Menos error del pedido: baje K_{p}." }
    escalera:
      - "e = 1/(1 + K_{p}·K): con K = 0,8, ¿qué K_{p} da 1/5?"
    solucion: "K_{p} = 5 W/°C."
    comprobar:
      - { con: { Kp_b: 5 }, e_b: 20 }

  - id: estime-30b
    tipo: simular
    titulo: "30.B: con K_{p} = 20"
    texto: "Con K_{p} = 20 W/°C y la planta de 0,8 °C/W, ¿qué error permanente queda?"
    libro: [686, 690]
    fijar: { Kp_b: 20 }
    widget:
      tipo: grafica
      x: { id: k, min: 0, max: 40, unidad: "W/°C", rotulo: "K_{p}" }
      y: { min: 0, max: 100, unidad: "%", rotulo: "error permanente" }
      curvas:
        - { expr: "100/(1 + k*K_g)", color: naranja, rotulo: "1/(1 + K_{p}·K)" }
      mandos: []
    simular:
      objetivo: e_b
      unidad: "%"
      tol: 0.03
      rotulo: "Error permanente"
      errores:
        - { expr: "e_b1", texto: "Falta el 1: e = 1/(1 + K_{p}·K)." }
        - { expr: "e_b2", texto: "Falta multiplicar K_{p} por la ganancia de la planta, 0,8." }
    exito: "5,9 %: lo reduce, no lo anula, y acerca la inestabilidad."
    escalera:
      - "e = 1/(1 + K_{p}·K)."
    solucion: "1/(1 + 20 × 0,8) = 5,9 %."
    comprobar:
      - { e_b: 5.88, tol: 0.003 }

  - id: precio-integral
    tipo: simular
    titulo: "30.B: el precio de la integral"
    texto: "La integral elimina el error estructural, pero no gratis. ¿Cuántos grados de retardo de fase añade un integrador?"
    libro: [692, 693]
    widget:
      tipo: grafica
      x: { id: k, min: 0, max: 40, unidad: "W/°C", rotulo: "K_{p}" }
      y: { min: 0, max: 100, unidad: "%", rotulo: "error permanente" }
      curvas:
        - { expr: "100/(1 + k*K_g)", color: naranja, rotulo: "1/(1 + K_{p}·K)" }
      mandos: []
    simular:
      objetivo: f_int
      unidad: "°"
      tol: 0.02
      rotulo: "Retardo de fase"
      errores:
        - { expr: "180", texto: "Eso son dos integradores: uno, 1/s, gira un cuarto de vuelta." }
        - { expr: "45", texto: "Esos 45° son los de un polo en su frecuencia de corte; el integrador da 90° a todas." }
    exito: "90°, que consumen margen de estabilidad; y si el actuador satura, windup, lento de descargar con τ = 120 s."
    escalera:
      - "1/(jω) tiene fase constante."
    solucion: "90°."
    comprobar:
      - { f_int: 90 }

  - id: simule-30d
    tipo: simular
    titulo: "30.D: Ziegler-Nichols desde Routh"
    texto: "La planta K/((s + 1)(s + 3)(s + 10)) tiene, por Routh, K_{u} = 572. ¿Qué K_{p} da la tabla para un PID?"
    libro: [710, 715]
    simular:
      objetivo: Kp_zn
      unidad: ""
      tol: 0.01
      rotulo: "K_{p} del PID"
      errores:
        - { expr: "Kp_P", texto: "Esa es la fila del P. El PID pone 0,6·K_{u}." }
        - { expr: "Kp_PI", texto: "Esa es la fila del PI. El PID pone 0,6·K_{u}." }
    exito: "K_{p} = 343, con T_{i} = 0,479 s y T_{d} = 0,120 s."
    escalera:
      - "Fila del PID: K_{p} = 0,6·K_{u}."
    solucion: "0,6 × 572 = 343."
    comprobar:
      - { Kp_zn: 343, Kp_P: 286, Kp_PI: 257.4, tol: 0.003 }

  - id: predecir-30d
    tipo: predecir
    titulo: "30.D: lo que da la receta"
    texto: "Con ese PID de Ziegler-Nichols, ¿qué margen de fase y qué sobreimpulso tiene el lazo?"
    libro: [716, 717]
    widget:
      tipo: grafica
      x: { id: k, min: 0, max: 40, unidad: "W/°C", rotulo: "K_{p}" }
      y: { min: 0, max: 100, unidad: "%", rotulo: "error permanente" }
      curvas:
        - { expr: "100/(1 + k*K_g)", color: naranja, rotulo: "1/(1 + K_{p}·K)" }
    opciones:
      - texto: "25,2° y un 54,2 %"
        bien: true
        porque: "Lo que advierte la sección 30.14: agresivo, un punto de partida."
      - texto: "60° y menos de un 10 %"
        porque: "Ese es el objetivo de diseño; Ziegler-Nichols no lo busca."
      - texto: "Inestable"
        porque: "Es estable, con poco margen."
    escalera:
      - "Ziegler-Nichols admite que cada pico sea la cuarta parte del anterior."
    solucion: "25,2° de margen y un 54,2 % de sobreimpulso."

  - id: porque-ti
    tipo: explorar
    titulo: "30.D: dónde está el defecto"
    texto: "Bajar K_{p} a 0,33·K_{u} apenas mejora el margen: el defecto está en el cero del PI, que cae en 1/T_{i}. Llévelo sobre el polo lento de la planta."
    libro: [680, 716, 717]
    inicio: { T_iz: 0.479 }
    widget:
      tipo: grafica
      x: { id: w, min: 0.3, max: 30, unidad: "rad/s", rotulo: "ω", escala: log }
      y: { min: 0, max: 1, unidad: "", rotulo: "" }
      curvas:
        - { expr: "0", color: tinta, rotulo: "eje", discontinua: true }
      marcas:
        - { x: "p_l", y: "0.3", rotulo: "polo lento" }
        - { x: "3", y: "0.3", rotulo: "polo" }
        - { x: "10", y: "0.3", rotulo: "polo" }
        - { x: "z_pi", y: "0.7", rotulo: "cero del PI" }
      lectura: { valor: z_pi, rotulo: "Cero del PI" }
      mandos:
        - { valor: T_iz, lista: [0.479, 0.75, 1], rotulo: "T_{i}" }
    objetivo:
      condiciones:
        - { valor: z_pi, max: 1.01, rotulo: "Cero en {{z_pi}}" }
      logrado: "Con T_{i} = 1 s, el cero cae sobre el polo de 1 rad/s y su retraso de fase ya no llega al cruce. Con 2,09 rad/s, la ganancia no lo arreglaba."
      pistas:
        - { texto: "El cero sigue por encima del polo lento: alargue T_{i}." }
    escalera:
      - "El cero está en 1/T_{i}."
    solucion: "T_{i} = 1 s."
    comprobar:
      - { z_pi: 2.09, Kp_33: 189, tol: 0.003 }
      - { con: { T_iz: 1 }, z_pi: 1 }

  - id: formula-ceros
    tipo: simular
    titulo: "30.D: colocar los ceros"
    texto: "Los ceros del PID van sobre los dos polos lentos: T′_{i} = 1 s y T′_{d} = 1/3 s, con K_{c} = 133,7. ¿Qué K_{p} paralela sale, K_{c}·(1 + T′_{d}/T′_{i})?"
    libro: [718]
    widget:
      tipo: grafica
      x: { id: k, min: 0, max: 40, unidad: "W/°C", rotulo: "K_{p}" }
      y: { min: 0, max: 100, unidad: "%", rotulo: "error permanente" }
      curvas:
        - { expr: "100/(1 + k*K_g)", color: naranja, rotulo: "1/(1 + K_{p}·K)" }
      mandos: []
    simular:
      objetivo: Kp_pz
      unidad: ""
      tol: 0.02
      rotulo: "K_{p} paralela"
      errores:
        - { expr: "Kc_d", texto: "La serie y la paralela no tienen la misma ganancia: se multiplica por 1 + T′_{d}/T′_{i}." }
        - { expr: "Kp_zn", texto: "Esa es la de Ziegler-Nichols, que daba 25° de margen." }
    exito: "178, con T_{i} = 1,333 s y T_{d} = 0,250 s: 63,1° de margen y un 5,0 % de sobreimpulso."
    escalera:
      - "1 + (1/3)/1 = 4/3."
    solucion: "133,7 × 4/3 = 178."
    comprobar:
      - { Kp_pz: 178.3, Ti_p: 1.333, Td_p: 0.25, tol: 0.003 }

  - id: empareje-30d
    tipo: pregunta
    titulo: "30.D: tres PID, tres resultados"
    texto: "Empareje cada sintonía con su sobreimpulso."
    libro: [716, 719]
    widget:
      tipo: grafica
      x: { id: k, min: 0, max: 40, unidad: "W/°C", rotulo: "K_{p}" }
      y: { min: 0, max: 100, unidad: "%", rotulo: "error permanente" }
      curvas:
        - { expr: "100/(1 + k*K_g)", color: naranja, rotulo: "1/(1 + K_{p}·K)" }
    emparejar:
      - ["Ziegler-Nichols", "54,2 %"]
      - ["K_{p} = 0,33·K_{u}", "48,8 %"]
      - ["Colocación de ceros", "5,0 %"]
    exito: "Y se establece tres veces antes; el precio, una cola de 1 s ante una perturbación de carga."
    pistas:
      - { texto: "Bajar K_{p} apenas mejora; mover los ceros, mucho." }
    escalera:
      - "El que pone los ceros sobre los polos lentos es el de 60° de margen."
    solucion: "Ziegler-Nichols 54,2 %; 0,33·K_{u} 48,8 %; ceros 5,0 %."

  - id: margen-30a
    tipo: marcar
    titulo: "30.A: el sobreimpulso dice el margen"
    texto: "Tras sintonizar, el escalón se pasa un 40 %. Con la regla de la sección 30.9, marque en la curva qué margen de fase le corresponde."
    libro: [673, 682]
    widget:
      tipo: grafica
      x: { id: m, min: 10, max: 80, unidad: "°", rotulo: "margen de fase" }
      y: { min: 0, max: 80, unidad: "%", rotulo: "sobreimpulso" }
      curvas:
        - { expr: "100*exp(-pi*(m/100)/sqrt(1 - (m/100)^2))", color: naranja, rotulo: "sobreimpulso" }
      mandos: []
    marcar:
      modo: x
      curva: 0
      x: "MF_40"
      tol: 0.02
      inicio: { x: 70, y: 0 }
      rotulo: "El margen de un 40 %"
      pasos: 140
    pistas:
      - { cuando: { valor: marca_x, mayor: 28.5 }, texto: "Ahí se pasa menos de un 40 %: más a la izquierda." }
      - { texto: "Ahí se pasa más de un 40 %: más a la derecha." }
    exito: "Menos de 30°: poco. Un 25 % ya corresponde a unos 40°; si se necesitan 60°, se baja K_{p}."
    escalera:
      - "Busque dónde la curva cruza el 40 %."
    solucion: "Unos {{MF_40}}."
    comprobar:
      - { MF_40: 28, tol: 0.01 }

  - id: explore-ber
    tipo: explorar
    titulo: "30.C: una curva muy vertical"
    texto: "BPSK: la tasa de error es Q(√(2·E_{b}/N_{0})). Suba E_{b}/N_{0} hasta que haya menos de un error por cada millón de bits."
    libro: [699, 702, 703, 704]
    inicio: { Eb_c: 7 }
    widget:
      tipo: grafica
      x: { id: d, min: 0, max: 12, unidad: dB, rotulo: "E_{b}/N_{0}" }
      y: { min: 1e-8, max: 1, unidad: "", rotulo: "tasa de error", escala: log }
      curvas:
        - { expr: "0.5*erfc(sqrt(10^(d/10)))", color: naranja, rotulo: "BPSK" }
      marcas:
        - { x: "Eb_c", y: "ber", rotulo: "{{ber}}" }
      lectura: { valor: ber, rotulo: "Tasa de error" }
      datos:
        - { valor: n_err, rotulo: "Un error cada {{n_err}} bits" }
      mandos:
        - { valor: Eb_c, lista: [7, 9, 11], rotulo: "E_{b}/N_{0}" }
    objetivo:
      condiciones:
        - { valor: n_err, min: 1000000, rotulo: "Un error cada {{n_err}} bits" }
      logrado: "Con {{Eb_c}}: de un error cada mil bits a 7 dB a uno cada varios millones. Cada paso de 2 dB gana más de un orden de magnitud."
      pistas:
        - { texto: "Aún demasiados errores: más E_{b}/N_{0}." }
    escalera:
      - "La tasa pedida es 10⁻⁶."
    solucion: "11 dB."
    comprobar:
      - { ber: 0.00077, n_err: 1294, tol: 0.005 }
      - { con: { Eb_c: 9 }, ber: 0.0000336, n_err: 29738, tol: 0.01 }
      - { con: { Eb_c: 11 }, ber: 0.00000026, n_err: 3826919, tol: 0.01 }

  - id: estime-30c
    tipo: simular
    titulo: "30.C: cuatro decibelios"
    texto: "Entre 7 y 11 dB de E_{b}/N_{0}, la tasa de error mejora tres órdenes de magnitud. ¿Por cuánto se multiplica la potencia con esos 4 dB?"
    libro: [697, 704, 705]
    widget:
      tipo: grafica
      x: { id: d, min: 0, max: 10, unidad: dB, rotulo: "decibelios" }
      y: { min: 0, max: 10, unidad: "", rotulo: "razón de potencias" }
      curvas:
        - { expr: "10^(d/10)", color: naranja, rotulo: "10^{dB/10}" }
      mandos: []
    simular:
      objetivo: g_c
      unidad: ""
      tol: 0.03
      rotulo: "P₂/P₁"
      errores:
        - { expr: "g_20", texto: "Eso es en tensión, con 20; la potencia va con 10^{dB/10}." }
        - { expr: "dB_c", texto: "Los decibelios no son veces: 10^{4/10}." }
    exito: "Por 2,5: poca potencia compra muchísima fiabilidad, y poca pérdida la arruina."
    escalera:
      - "10^{4/10}."
    solucion: "10^{0,4} = 2,5."
    comprobar:
      - { g_c: 2.51, tol: 0.003 }

  - id: margen-enlace
    tipo: porque
    titulo: "30.C: margen de enlace"
    texto: "¿Por qué un enlace digital se diseña con 6 a 10 dB por encima del mínimo teórico?"
    libro: [702, 704, 705, 706]
    widget:
      tipo: grafica
      x: { id: d, min: 0, max: 12, unidad: dB, rotulo: "E_{b}/N_{0}" }
      y: { min: 1e-8, max: 1, unidad: "", rotulo: "tasa de error", escala: log }
      curvas:
        - { expr: "0.5*erfc(sqrt(10^(d/10)))", color: naranja, rotulo: "BPSK" }
    opciones:
      - texto: "La curva es tan vertical que perder 4 dB multiplica los errores por miles"
        bien: true
        porque: "De un error cada cuatro millones de bits a uno cada mil: lluvia o un conector sucio bastan."
      - texto: "Para ahorrar potencia"
        porque: "El margen gasta potencia: la compra fiabilidad ante degradaciones."
      - texto: "Porque la tasa de error baja despacio con la potencia"
        porque: "Al contrario: baja de golpe; por eso el borde es peligroso."
    escalera:
      - "¿Qué pasa si se trabaja justo en el punto teórico y se pierden unos decibelios?"
    solucion: "Por lo abrupto de la curva: una pequeña degradación tumba el enlace."

  - id: resumen
    tipo: resumen
