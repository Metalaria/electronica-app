# Lección 1.2 de la sección 30.6 «Modulaciones Digitales» (cap31, sec-31.6). Formato: GUIA.md.
# - Bits por símbolo, log₂ M, de la tabla del libro; las figuras 30.11 (ASK, FSK, PSK), 30.12 (constelaciones con el
#   mismo ruido) y 30.13 (la cadena completa) con zonas.
# Paso práctico: «tocar» en la figura 30.12 la constelación que antes confunde un punto con su vecino; el diagnóstico
# de la constelación (tabla del libro) se empareja.
leccion: cap31/sec-31.6

libro:
  206: "el conjunto de puntos posibles es la constelación"
  208: "256-QAM"
  209: "Con el mismo ancho de banda, 256-QAM transmite ocho veces más que BPSK"
  211: "Una BER de 10⁻⁶ es un bit equivocado de cada millón"
  212: "Cuantos más puntos hay en la constelación, más juntos están"
  213: "Eb/N0 para una tasa de error de 10⁻⁶"
  214: "QPSK necesita lo mismo que BPSK transmitiendo el doble"
  215: "cada salto cuesta unos 4 a 6 dB"
  218: "El enlace no se cae: se hace más lento"
  219: "la velocidad de una conexión wifi cambie al alejarse del router"
  221: "su espectro es infinito y se solapa con los canales vecinos"
  222: "conformar el pulso con un filtro de coseno alzado"
  223: "con 0,35, el canal ocupa un 35 % más que el mínimo teórico"
  227: "Constelación girando"
  228: "la dispersión de cada punto mide el margen antes del error"
  231: "con un EVM del 8 % no se puede usar 256-QAM"
  235: "Modulaciones digitales: ASK (amplitud), FSK (frecuencia) y PSK (fase)"
  236: "Tres constelaciones con el mismo ruido"
  238: "la codificación de fuente comprime la información quitando redundancia"
  239: "cada bloque deshace lo que hizo su pareja, en orden inverso"

modelo:
  valores:
    M_c: { sim: "M", nombre: "puntos de la constelación", unidad: "", valor: 2 }
  calculos:
    n_b: { expr: "log10(M_c)/log10(2)", sim: "n", nombre: "bits por símbolo", unidad: "", cifras: 2 }
    r_p: { expr: "M_c/2", sim: "M/2", nombre: "puntos frente a BPSK", unidad: "" }

tarjetas:
  - id: explore-ask-fsk-psk
    tipo: explorar
    titulo: "Los mismos tres parámetros"
    texto: "Los mismos bits modulan amplitud, frecuencia o fase. Toque cada fila."
    libro: [235]
    widget:
      tipo: figura
      figura: fig-31.11
      zonas:
        - { id: ask, rotulo: "Segunda fila, azul", rect: [0, 56, 435, 40], texto: "ASK: la amplitud. Un bit a cero apaga la portadora." }
        - { id: fsk, rotulo: "Tercera fila, violeta", rect: [0, 103, 435, 42], texto: "FSK: la frecuencia. Cada bit tiene la suya." }
        - { id: psk, rotulo: "Cuarta fila, naranja", rect: [0, 150, 435, 42], texto: "PSK: la fase. La portadora salta media vuelta al cambiar el bit." }
    requiere: { mover: [ask, fsk, psk] }

  - id: explore-bits
    tipo: explorar
    titulo: "Bits por símbolo"
    texto: "Cada símbolo es un punto de la constelación. Elija cuántos puntos hay y mire cuántos bits lleva cada símbolo."
    libro: [206, 208]
    widget:
      tipo: grafica
      x: { id: m, min: 2, max: 256, unidad: "", rotulo: "puntos, M", escala: log }
      y: { min: 0, max: 9, unidad: "", rotulo: "bits por símbolo" }
      curvas:
        - { expr: "log10(m)/log10(2)", color: naranja, rotulo: "log₂ M" }
      marcas:
        - { x: "M_c", y: "n_b", rotulo: "{{n_b}}" }
      lectura: { valor: n_b, rotulo: "Bits por símbolo" }
      mandos:
        - { valor: M_c, lista: [2, 4, 16, 64, 256], nombres: [BPSK, QPSK, 16-QAM, 64-QAM, 256-QAM], rotulo: "Modulación" }
    requiere: { mover: [M_c] }

  - id: ocho-veces
    tipo: pregunta
    titulo: "En la misma banda"
    texto: "Con el mismo ancho de banda, ¿cuánto más transmite 256-QAM que BPSK?"
    libro: [208, 209]
    fijar: { M_c: 256 }
    widget:
      tipo: grafica
      x: { id: m, min: 2, max: 256, unidad: "", rotulo: "puntos, M", escala: log }
      y: { min: 0, max: 9, unidad: "", rotulo: "bits por símbolo" }
      curvas:
        - { expr: "log10(m)/log10(2)", color: naranja, rotulo: "log₂ M" }
    opciones:
      - texto: "Ocho veces más"
        bien: true
        porque: "Ocho bits por símbolo frente a uno."
      - texto: "128 veces más"
        porque: "Tiene 128 veces más puntos, pero los bits son el logaritmo en base 2: 8 frente a 1."
      - texto: "Lo mismo: la banda manda"
        porque: "La banda fija los símbolos por segundo; cada símbolo de 256-QAM lleva más bits."
    escalera:
      - "Bits por símbolo = log₂ M."
    solucion: "8 bits frente a 1: ocho veces más."
    comprobar:
      - { n_b: 8, r_p: 128 }

  - id: toque-constelacion
    tipo: tocar
    titulo: "El mismo ruido"
    texto: "Tres constelaciones con la misma potencia y el mismo ruido. Toque la que antes confunde un punto con su vecino."
    libro: [212, 236]
    widget:
      tipo: figura
      figura: fig-31.12
      zonas:
        - { id: izquierda, rotulo: "Constelación de la izquierda", rect: [0, 0, 130, 177] }
        - { id: centro, rotulo: "Constelación del centro", rect: [152, 0, 130, 177] }
        - { id: derecha, rotulo: "Constelación de la derecha", rect: [302, 0, 128, 177] }
    tocar:
      bien: [derecha]
      porque:
        izquierda: "Cuatro puntos muy separados: las nubes de ruido no llegan a tocarse."
        centro: "Dieciséis puntos: más juntos, pero aún separados."
    exito: "64-QAM: los puntos están más juntos y la nube de ruido llega al vecino."
    escalera:
      - "Cuantos más puntos, más juntos."
    solucion: "La de la derecha, 64-QAM: necesita 18,8 dB frente a 10,5 dB."

  - id: predecir-qpsk
    tipo: predecir
    titulo: "Un caso eficiente"
    texto: "Para una tasa de error de 10⁻⁶, BPSK necesita 10,5 dB de E_{b}/N_{0}. ¿Cuánto necesita QPSK, que transmite el doble?"
    libro: [211, 213, 214]
    widget:
      tipo: figura
      figura: fig-31.12
      zonas:
        - { id: todo, rotulo: "Las tres constelaciones", rect: [0, 0, 430, 177] }
    opciones:
      - texto: "Lo mismo, 10,5 dB"
        bien: true
        porque: "Sus cuatro puntos siguen a la máxima distancia posible: por eso QPSK es tan usada."
      - texto: "Unos 4 a 6 dB más"
        porque: "Eso cuesta cada salto a partir de QPSK: 16-QAM pide 14,4 dB."
      - texto: "El doble de decibelios"
        porque: "Los decibelios no se duplican con los bits; y QPSK es el caso especial."
    escalera:
      - "Mire la tabla: BPSK y QPSK."
    solucion: "Lo mismo, 10,5 dB, transmitiendo el doble."

  - id: adaptativa
    tipo: pregunta
    titulo: "Al alejarse del router"
    texto: "Un enlace con modulación adaptativa pierde calidad. ¿Qué hace?"
    libro: [215, 218, 219]
    widget:
      tipo: figura
      figura: fig-31.12
      zonas:
        - { id: todo, rotulo: "Las tres constelaciones", rect: [0, 0, 430, 177] }
    opciones:
      - texto: "Baja a una constelación menor: se hace más lento, no se cae"
        bien: true
        porque: "De 256-QAM a 64-QAM, 16-QAM y QPSK: cambia caudal por relación señal a ruido."
      - texto: "Sube a 256-QAM para compensar"
        porque: "Al revés: la constelación grande pide más señal a ruido."
      - texto: "Mantiene la modulación y se cae"
        porque: "Eso es lo que evita la modulación adaptativa."
    escalera:
      - "¿Qué constelación aguanta más ruido?"
    solucion: "Baja de modulación: más lento, pero sigue funcionando."

  - id: coseno-alzado
    tipo: pregunta
    titulo: "La forma del pulso"
    texto: "Pulsos conformados con coseno alzado y factor de caída 0,35. ¿Cuánta banda ocupa el canal?"
    libro: [221, 222, 223]
    widget:
      tipo: figura
      figura: fig-31.11
      zonas:
        - { id: todo, rotulo: "ASK, FSK y PSK", rect: [0, 0, 435, 222] }
    opciones:
      - texto: "Un 35 % más que el mínimo teórico"
        bien: true
        porque: "Y el filtro es realizable; con menos caída se ahorra banda a costa de un filtro más largo."
      - texto: "Infinita, como con pulsos rectangulares"
        porque: "El rectangular sí tiene espectro infinito; el coseno alzado limita la banda."
      - texto: "El mínimo teórico exacto"
        porque: "Ese sería un factor de caída cero: un filtro irrealizable."
    escalera:
      - "El factor de caída es el exceso de banda sobre el mínimo."
    solucion: "Un 35 % por encima del mínimo."

  - id: empareje-diagnostico
    tipo: pregunta
    titulo: "Leer una constelación"
    texto: "Cada defecto tiene su firma. Empareje lo que se ve con su causa."
    libro: [227, 228]
    widget:
      tipo: figura
      figura: fig-31.12
      zonas:
        - { id: todo, rotulo: "Las tres constelaciones", rect: [0, 0, 430, 177] }
    emparejar:
      - ["Puntos dispersos como nubes", "Ruido"]
      - ["Constelación girando", "Error de frecuencia del oscilador local"]
      - ["Rotada un ángulo fijo", "Error de fase"]
      - ["Puntos exteriores hacia el centro", "Compresión: el amplificador satura"]
      - ["Rectangular en lugar de cuadrada", "Desequilibrio I/Q"]
    exito: "Es el diagrama de ojo de las modulaciones digitales: la dispersión mide el margen."
    pistas:
      - { texto: "Un error de frecuencia acumula fase sin parar; uno de fase es fijo." }
    escalera:
      - "Solo el amplificador que satura afecta a los puntos de mayor amplitud."
    solucion: "Nubes, ruido; giro, frecuencia; ángulo fijo, fase; exteriores, compresión; rectángulo, I/Q."

  - id: evm
    tipo: pregunta
    titulo: "El EVM"
    texto: "Un transmisor mide un EVM del 8 % con un canal excelente. ¿Puede usar 256-QAM?"
    libro: [231]
    widget:
      tipo: figura
      figura: fig-31.12
      zonas:
        - { id: todo, rotulo: "Las tres constelaciones", rect: [0, 0, 430, 177] }
    opciones:
      - texto: "No: con ese EVM no, por buena que sea la relación señal a ruido"
        bien: true
        porque: "El EVM es el error del propio transmisor: sus puntos ya salen lejos de donde deben."
      - texto: "Sí, porque el canal es excelente"
        porque: "El canal no arregla los puntos mal colocados por el transmisor."
      - texto: "Sí, si se baja el factor de caída"
        porque: "El factor de caída cambia la banda, no la precisión de los puntos."
    escalera:
      - "¿De quién es el error que mide el EVM?"
    solucion: "No: con un EVM del 8 % no se puede usar 256-QAM."

  - id: ordene-cadena
    tipo: pregunta
    titulo: "La cadena completa"
    texto: "Ordene los bloques del emisor al receptor."
    libro: [238, 239]
    widget:
      tipo: figura
      figura: fig-31.13
      zonas:
        - { id: todo, rotulo: "El sistema de comunicación", rect: [0, 0, 453, 187] }
    ordenar:
      - "Codificación de fuente: comprime"
      - "Codificación de canal: añade redundancia"
      - "Modulación"
      - "Canal: ruido y atenuación"
      - "Demodulación"
      - "Decodificación de canal: corrige"
      - "Decodificación de fuente: reconstruye"
    exito: "Cada bloque del receptor deshace lo que hizo su pareja, en orden inverso."
    pistas:
      - { texto: "Primero se quita redundancia y luego se añade la útil." }
    escalera:
      - "El receptor recorre la cadena del emisor al revés."
    solucion: "Fuente, canal, modulación, canal físico, demodulación, decodificación de canal y de fuente."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [208, 212, 214, 218, 227, 239]
    ideas:
      - { titulo: "Constelación.", texto: "M puntos llevan log₂ M bits por símbolo." }
      - { titulo: "El precio.", texto: "Más puntos, más juntos: más relación señal a ruido. QPSK, la excepción." }
      - { titulo: "Adaptativa.", texto: "Cambiar de modulación: el enlace se hace lento en vez de caerse." }
      - { titulo: "Diagnóstico.", texto: "Cada defecto deja su firma en la constelación." }
