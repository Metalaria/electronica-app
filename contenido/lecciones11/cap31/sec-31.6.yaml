# Lección 1.2 de la sección 30.6 «Modulaciones Digitales» (cap31, sec-31.6). Formato: GUIA.md.
# - Bits por símbolo, log₂ M, de la tabla del libro; las figuras 30.11 (ASK, FSK, PSK), 30.12 (constelaciones con el
#   mismo ruido) y 30.13 (la cadena completa) con zonas.
# Paso práctico: «tocar» en la figura 30.12 la constelación que antes confunde un punto con su vecino; el diagnóstico
# de la constelación (tabla del libro) se empareja.
# 1.2.1 (autor121-senpro, «aprender haciendo», GUIA §13): la PSK se toca en la figura 30.11; se elige la modulación de
# 6 bits por símbolo; la ventaja de 256-QAM se predice; E_b/N_0 se sube hasta una BER de 10⁻⁶ (BPSK y QPSK,
# 0,5·erfc(√(E_b/N_0)), 10,5 dB); con un enlace de ejemplo de 16 dB se elige la constelación más rápida que aguanta
# (los 10,5, 14,4 y 18,8 dB de la tabla del libro); y el error de fase de una QPSK se corrige girándola (ángulo de
# ejemplo). Quedan dos preguntas de opciones (coseno alzado y EVM) y la cadena completa por ordenar.
leccion: cap31/sec-31.6

libro:
  206: "el conjunto de puntos posibles es la constelación"
  208: "256-QAM"
  209: "Con el mismo ancho de banda, 256-QAM transmite ocho veces más que BPSK"
  211: "Una BER de 10⁻⁶ es un bit equivocado de cada millón"
  212: "Cuantos más puntos hay en la constelación, más juntos están"
  213: "Eb/N0 para una tasa de error de 10⁻⁶"
  214: "QPSK necesita lo mismo que BPSK transmitiendo el doble"
  215: "cada salto cuesta unos 4 a 6 dB"
  218: "El enlace no se cae: se hace más lento"
  219: "la velocidad de una conexión wifi cambie al alejarse del router"
  221: "su espectro es infinito y se solapa con los canales vecinos"
  222: "conformar el pulso con un filtro de coseno alzado"
  223: "con 0,35, el canal ocupa un 35 % más que el mínimo teórico"
  227: "Constelación girando"
  228: "la dispersión de cada punto mide el margen antes del error"
  231: "con un EVM del 8 % no se puede usar 256-QAM"
  235: "Modulaciones digitales: ASK (amplitud), FSK (frecuencia) y PSK (fase)"
  236: "Tres constelaciones con el mismo ruido"
  238: "la codificación de fuente comprime la información quitando redundancia"
  239: "cada bloque deshace lo que hizo su pareja, en orden inverso"

modelo:
  valores:
    M_c: { sim: "M", nombre: "puntos de la constelación", unidad: "", valor: 2 }
    E_n: { sim: "E_{b}/N_{0}", nombre: "relación energía por bit a ruido", unidad: dB, valor: 6 }
    S_l: { sim: "S/N", nombre: "margen del enlace, de ejemplo", unidad: dB, valor: 16 }
    p_e: { sim: "φ_{e}", nombre: "error de fase, de ejemplo", unidad: "°", valor: 20 }
  calculos:
    n_b: { expr: "log10(M_c)/log10(2)", sim: "n", nombre: "bits por símbolo", unidad: "", cifras: 2 }
    r_p: { expr: "M_c/2", sim: "M/2", nombre: "puntos frente a BPSK", unidad: "" }
    r_b: { expr: "n_b/1", sim: "veces", nombre: "bits por símbolo frente a BPSK", unidad: "" }
    BER: { expr: "0.5*erfc(sqrt(10^(E_n/10)))", sim: "BER", nombre: "tasa de error de bit", unidad: "", cifras: 2 }
    E_q: { expr: "10.5*max(0, 1 - abs(M_c - 4)/12) + 14.4*max(0, 1 - abs(M_c - 16)/12)*max(0, min(1, (64 - M_c)/48)) + 18.8*max(0, min(1, (M_c - 16)/48))", sim: "E_{b}/N_{0}", nombre: "lo que pide la modulación", unidad: dB }

tarjetas:
  - id: explore-ask-fsk-psk
    tipo: tocar
    titulo: "Los mismos tres parámetros"
    texto: "Los mismos bits modulan amplitud, frecuencia o fase. Toque la fila en que la portadora salta media vuelta al cambiar el bit."
    libro: [235]
    widget:
      tipo: figura
      figura: fig-31.11
      zonas:
        - { id: ask, rotulo: "Segunda fila, azul", rect: [0, 56, 435, 40] }
        - { id: fsk, rotulo: "Tercera fila, violeta", rect: [0, 103, 435, 42] }
        - { id: psk, rotulo: "Cuarta fila, naranja", rect: [0, 150, 435, 42] }
    tocar:
      bien: [psk]
      porque:
        ask: "Esa es la ASK: un bit a cero apaga la portadora."
        fsk: "Esa es la FSK: cada bit tiene su frecuencia."
    exito: "La PSK: la fase. La portadora salta media vuelta al cambiar el bit."
    escalera:
      - "Busque la portadora que no cambia ni de amplitud ni de ritmo."
    solucion: "La cuarta fila, naranja: PSK."

  - id: explore-bits
    tipo: explorar
    titulo: "Bits por símbolo"
    texto: "Cada símbolo es un punto de la constelación y lleva log₂ M bits. Elija la modulación que lleva 6 bits por símbolo."
    libro: [206, 208]
    inicio: { M_c: 2 }
    widget:
      tipo: grafica
      x: { id: m, min: 2, max: 256, unidad: "", rotulo: "puntos, M", escala: log }
      y: { min: 0, max: 9, unidad: "", rotulo: "bits por símbolo" }
      curvas:
        - { expr: "log10(m)/log10(2)", color: naranja, rotulo: "log₂ M" }
      marcas:
        - { x: "M_c", y: "n_b", rotulo: "{{n_b}}" }
      lectura: { valor: n_b, rotulo: "Bits por símbolo" }
      mandos:
        - { valor: M_c, lista: [2, 4, 16, 64, 256], nombres: [BPSK, QPSK, 16-QAM, 64-QAM, 256-QAM], rotulo: "Modulación" }
    objetivo:
      condiciones:
        - { valor: n_b, objetivo: 6, tol: 0.01, rotulo: "{{n_b}} bits por símbolo" }
      logrado: "64-QAM: 64 puntos, 2⁶. Cada punto de más dobla los puntos para un solo bit más."
      pistas:
        - { cuando: { valor: n_b, mayor: 6.1 }, texto: "Demasiados puntos." }
        - { texto: "Pocos puntos: cada bit más dobla la constelación." }
    escalera:
      - "Seis bits son 2⁶ puntos."
    solucion: "64-QAM."
    comprobar:
      - { con: { M_c: 64 }, n_b: 6 }

  - id: ocho-veces
    tipo: simular
    titulo: "En la misma banda"
    texto: "Con el mismo ancho de banda, ¿cuántas veces más transmite 256-QAM que BPSK?"
    libro: [208, 209]
    fijar: { M_c: 256 }
    widget:
      tipo: grafica
      x: { id: m, min: 2, max: 256, unidad: "", rotulo: "puntos, M", escala: log }
      y: { min: 0, max: 9, unidad: "", rotulo: "bits por símbolo" }
      curvas:
        - { expr: "log10(m)/log10(2)", color: naranja, rotulo: "log₂ M" }
      mandos: []
    simular:
      objetivo: r_b
      unidad: ""
      tol: 0.02
      rotulo: "Veces más"
      errores:
        - { expr: "r_p", texto: "Tiene 128 veces más puntos, pero los bits son el logaritmo en base 2: 8 frente a 1." }
        - { expr: "M_c", texto: "Esos son los puntos de la constelación; lo que cuenta son los bits de cada símbolo." }
    exito: "Ocho veces: la banda fija los símbolos por segundo, y cada símbolo de 256-QAM lleva 8 bits frente a 1."
    escalera:
      - "Bits por símbolo = log₂ M."
    solucion: "8 bits frente a 1: ocho veces más."
    comprobar:
      - { n_b: 8, r_p: 128, r_b: 8 }

  - id: toque-constelacion
    tipo: tocar
    titulo: "El mismo ruido"
    texto: "Tres constelaciones con la misma potencia y el mismo ruido. Toque la que antes confunde un punto con su vecino."
    libro: [212, 236]
    widget:
      tipo: figura
      figura: fig-31.12
      zonas:
        - { id: izquierda, rotulo: "Constelación de la izquierda", rect: [0, 0, 130, 177] }
        - { id: centro, rotulo: "Constelación del centro", rect: [152, 0, 130, 177] }
        - { id: derecha, rotulo: "Constelación de la derecha", rect: [302, 0, 128, 177] }
    tocar:
      bien: [derecha]
      porque:
        izquierda: "Cuatro puntos muy separados: las nubes de ruido no llegan a tocarse."
        centro: "Dieciséis puntos: más juntos, pero aún separados."
    exito: "64-QAM: los puntos están más juntos y la nube de ruido llega al vecino."
    escalera:
      - "Cuantos más puntos, más juntos."
    solucion: "La de la derecha, 64-QAM: necesita 18,8 dB frente a 10,5 dB."

  - id: predecir-qpsk
    tipo: explorar
    titulo: "Un caso eficiente"
    texto: "La tasa de error de BPSK y QPSK frente a E_{b}/N_{0}. Suba la señal hasta un bit equivocado de cada millón."
    libro: [211, 213, 214]
    inicio: { E_n: 6 }
    widget:
      tipo: grafica
      x: { id: e, min: 0, max: 14, unidad: dB, rotulo: "E_{b}/N_{0}" }
      y: { min: 0.0000000001, max: 0.1, unidad: "", rotulo: "BER", escala: log }
      curvas:
        - { expr: "0.5*erfc(sqrt(10^(e/10)))", color: naranja, rotulo: "BPSK y QPSK" }
      marcas:
        - { x: "E_n", y: "BER", rotulo: "{{BER}}" }
      lectura: { valor: BER, rotulo: "Tasa de error" }
      mandos:
        - { valor: E_n, min: 6, max: 14, paso: 0.5, rotulo: "E_{b}/N_{0}" }
    objetivo:
      condiciones:
        - { valor: BER, max: 0.0000011, rotulo: "BER: {{BER}}" }
      logrado: "Con {{E_n}}, del orden de 10⁻⁶. QPSK necesita lo mismo que BPSK transmitiendo el doble: sus cuatro puntos siguen a la máxima distancia."
      pistas:
        - { texto: "Aún demasiados errores: más señal." }
    escalera:
      - "Una BER de 10⁻⁶ es un bit equivocado de cada millón."
    solucion: "10,5 dB."
    comprobar:
      - { con: { E_n: 10.5 }, BER: 0.00000108, tol: 0.05 }

  - id: adaptativa
    tipo: explorar
    titulo: "Al alejarse del router"
    texto: "Lejos del router, el enlace solo tiene 16 dB. Elija la modulación más rápida que aún cumple."
    nota: "Enlace de ejemplo."
    libro: [213, 215, 218, 219]
    inicio: { M_c: 64 }
    widget:
      tipo: grafica
      x: { id: m, min: 2, max: 128, unidad: "", rotulo: "puntos, M", escala: log }
      y: { min: 0, max: 25, unidad: dB, rotulo: "E_{b}/N_{0}" }
      curvas:
        - { expr: "S_l", color: azul, rotulo: "lo que da el enlace", discontinua: true }
      marcas:
        - { x: "M_c", y: "E_q", rotulo: "pide {{E_q}}" }
      lectura: { valor: E_q, rotulo: "Lo que pide la modulación" }
      datos:
        - { valor: n_b, rotulo: "Bits por símbolo: {{n_b}}" }
      mandos:
        - { valor: M_c, lista: [4, 16, 64], nombres: [QPSK, 16-QAM, 64-QAM], rotulo: "Modulación" }
    objetivo:
      condiciones:
        - { valor: E_q, max: 16, rotulo: "Pide {{E_q}}" }
        - { valor: n_b, min: 4, rotulo: "{{n_b}} bits por símbolo" }
      logrado: "16-QAM: el enlace no se cae, se hace más lento. Cada salto de constelación cuesta unos 4 a 6 dB."
      pistas:
        - { cuando: { valor: E_q, mayor: 16 }, texto: "64-QAM pide 18,8 dB: el enlace no llega. Baje de modulación." }
        - { texto: "QPSK cumple de sobra: puede ir más rápido." }
    escalera:
      - "Busque la mayor constelación que pida menos de 16 dB."
    solucion: "16-QAM, que pide 14,4 dB."
    comprobar:
      - { con: { M_c: 16 }, E_q: 14.4, n_b: 4 }
      - { con: { M_c: 64 }, E_q: 18.8 }
      - { con: { M_c: 4 }, E_q: 10.5 }

  - id: coseno-alzado
    tipo: pregunta
    titulo: "La forma del pulso"
    texto: "Pulsos conformados con coseno alzado y factor de caída 0,35. ¿Cuánta banda ocupa el canal?"
    libro: [221, 222, 223]
    widget:
      tipo: figura
      figura: fig-31.11
      zonas:
        - { id: todo, rotulo: "ASK, FSK y PSK", rect: [0, 0, 435, 222] }
    opciones:
      - texto: "Un 35 % más que el mínimo teórico"
        bien: true
        porque: "Y el filtro es realizable; con menos caída se ahorra banda a costa de un filtro más largo."
      - texto: "Infinita, como con pulsos rectangulares"
        porque: "El rectangular sí tiene espectro infinito; el coseno alzado limita la banda."
      - texto: "El mínimo teórico exacto"
        porque: "Ese sería un factor de caída cero: un filtro irrealizable."
    escalera:
      - "El factor de caída es el exceso de banda sobre el mínimo."
    solucion: "Un 35 % por encima del mínimo."

  - id: empareje-diagnostico
    tipo: explorar
    titulo: "Leer una constelación"
    texto: "Cada defecto deja su firma: rotada un ángulo fijo es error de fase; girando, de frecuencia. Corrija la fase de esta QPSK."
    nota: "Error de ejemplo."
    libro: [227, 228]
    inicio: { p_e: 20 }
    widget:
      tipo: grafica
      aspecto: igual
      x: { id: x, min: -1.3, max: 1.3, unidad: "", rotulo: "I" }
      y: { min: -1.3, max: 1.3, unidad: "", rotulo: "Q" }
      curvas:
        - { param: { id: th, min: 0, max: "2*pi" }, x: "cos(th)", y: "sin(th)", color: tinta, rotulo: "amplitud", discontinua: true }
      marcas:
        - { x: "cos((45 + p_e)*pi/180)", y: "sin((45 + p_e)*pi/180)", rotulo: "00" }
        - { x: "cos((135 + p_e)*pi/180)", y: "sin((135 + p_e)*pi/180)", rotulo: "01" }
        - { x: "cos((225 + p_e)*pi/180)", y: "sin((225 + p_e)*pi/180)", rotulo: "11" }
        - { x: "cos((315 + p_e)*pi/180)", y: "sin((315 + p_e)*pi/180)", rotulo: "10" }
      lectura: { valor: p_e, rotulo: "Error de fase" }
      mandos:
        - { valor: p_e, min: -30, max: 30, paso: 5, rotulo: "Corrección de fase" }
    objetivo:
      condiciones:
        - { valor: p_e, objetivo: 0, tol: 0.001, rotulo: "Fase: {{p_e}}" }
      logrado: "Los cuatro puntos, en sus diagonales. Nubes serían ruido; los exteriores hacia el centro, compresión; un rectángulo, desequilibrio I/Q."
      pistas:
        - { texto: "Los puntos siguen fuera de las diagonales: gire la constelación." }
    escalera:
      - "En QPSK cada punto va a medio camino entre los dos ejes."
    solucion: "Fase a 0°."
    comprobar:
      - { con: { p_e: 0 }, p_e: 0 }

  - id: evm
    tipo: pregunta
    titulo: "El EVM"
    texto: "Un transmisor mide un EVM del 8 % con un canal excelente. ¿Puede usar 256-QAM?"
    libro: [231]
    widget:
      tipo: figura
      figura: fig-31.12
      zonas:
        - { id: todo, rotulo: "Las tres constelaciones", rect: [0, 0, 430, 177] }
    opciones:
      - texto: "No: con ese EVM no, por buena que sea la relación señal a ruido"
        bien: true
        porque: "El EVM es el error del propio transmisor: sus puntos ya salen lejos de donde deben."
      - texto: "Sí, porque el canal es excelente"
        porque: "El canal no arregla los puntos mal colocados por el transmisor."
      - texto: "Sí, si se baja el factor de caída"
        porque: "El factor de caída cambia la banda, no la precisión de los puntos."
    escalera:
      - "¿De quién es el error que mide el EVM?"
    solucion: "No: con un EVM del 8 % no se puede usar 256-QAM."

  - id: ordene-cadena
    tipo: pregunta
    titulo: "La cadena completa"
    texto: "Ordene los bloques del emisor al receptor."
    libro: [238, 239]
    widget:
      tipo: figura
      figura: fig-31.13
      zonas:
        - { id: todo, rotulo: "El sistema de comunicación", rect: [0, 0, 453, 187] }
    ordenar:
      - "Codificación de fuente: comprime"
      - "Codificación de canal: añade redundancia"
      - "Modulación"
      - "Canal: ruido y atenuación"
      - "Demodulación"
      - "Decodificación de canal: corrige"
      - "Decodificación de fuente: reconstruye"
    exito: "Cada bloque del receptor deshace lo que hizo su pareja, en orden inverso."
    pistas:
      - { texto: "Primero se quita redundancia y luego se añade la útil." }
    escalera:
      - "El receptor recorre la cadena del emisor al revés."
    solucion: "Fuente, canal, modulación, canal físico, demodulación, decodificación de canal y de fuente."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [208, 212, 214, 218, 227, 239]
    ideas:
      - { titulo: "Constelación.", texto: "M puntos llevan log₂ M bits por símbolo." }
      - { titulo: "El precio.", texto: "Más puntos, más juntos: más relación señal a ruido. QPSK, la excepción." }
      - { titulo: "Adaptativa.", texto: "Cambiar de modulación: el enlace se hace lento en vez de caerse." }
      - { titulo: "Diagnóstico.", texto: "Cada defecto deja su firma en la constelación." }
