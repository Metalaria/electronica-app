# Lección 1.2 de la sección 30.8 «El Final del Camino» (cap31, sec-31.8). Formato: GUIA.md.
# - La característica de un actuador con zona muerta y saturación (bloques 282 y 284): salida = min(max(u − z, 0), s)
#   frente a la orden u, en fracción del fondo de escala. La zona muerta y la saturación de los mandos son de ejemplo.
# Paso práctico: «ajuste» de la orden, subiéndola poco a poco hasta que el actuador empieza a moverse (el banco del
# libro, bloque 295: así se mide la zona muerta).
# 1.2.1 (autor121-senpro, «aprender haciendo», GUIA §13): la característica se ajusta hasta que una orden de 0,5 dé
# 0,2; la orden se sube hasta saturar; la holgura se quita hasta que el ciclo límite desaparece (dibujo esquemático);
# un encoder se añade al paso a paso para que se entere de los pasos perdidos (tres pasos perdidos a partir del
# décimo, de ejemplo); se elige un actuador más rápido que la planta (dos primeros órdenes en serie, planta de 1 s, de
# ejemplo); y el dimensionado de 8 A se predice. Quedan una pregunta de opciones (la corriente) y las familias por
# emparejar.
leccion: cap31/sec-31.8

libro:
  272: "ese último eslabón es el que más veces limita el conjunto"
  274: "Su desventaja son las escobillas"
  275: "conmutación electrónica"
  276: "pueden perder pasos en silencio si el par no basta, y el sistema no se entera"
  277: "motor, reductora, sensor y electrónica de control en un solo bloque"
  279: "lentos y con mucha inercia"
  280: "recorrido de micras con resolución nanométrica"
  282: "si el actuador se satura, el lazo pierde el control por mucho que el error crezca"
  283: "Un actuador más lento que la planta domina la dinámica"
  284: "produce oscilación de ciclo límite alrededor de la consigna"
  285: "la ganancia del lazo cambie con el punto de trabajo"
  288: "Medida de corriente, que a menudo es la variable que de verdad se controla"
  290: "elegir el actuador por el régimen permanente y no por el transitorio"
  291: "Un motor que mantiene una carga con 2 A puede necesitar 8 A para acelerarla"
  292: "El dimensionado sale del peor caso dinámico, no del estático"
  295: "subiendo la consigna poco a poco hasta que empieza a moverse"
  296: "Las familias de actuador, lo que hay que mirar en cualquiera y el error de dimensionado"

modelo:
  valores:
    u_a: { sim: "u", nombre: "orden al actuador", unidad: "", valor: 0.5 }
    z_a: { sim: "z", nombre: "zona muerta de ejemplo", unidad: "", valor: 0.15 }
    s_a: { sim: "s", nombre: "saturación de ejemplo", unidad: "", valor: 0.7 }
    h_g: { sim: "holgura", nombre: "holgura de la reductora, de ejemplo", unidad: "", valor: 0.3 }
    k_e: { sim: "encoder", nombre: "realimentación de posición", unidad: "", valor: 0 }
    t_ac: { sim: "τ_{a}", nombre: "constante del actuador", unidad: s, valor: 2 }
    t_pl: { sim: "τ_{p}", nombre: "constante de la planta, de ejemplo", unidad: s, valor: 1 }
    I_m: { sim: "I_{mantener}", nombre: "corriente para mantener la carga", unidad: A, valor: 2 }
    I_a: { sim: "I_{acelerar}", nombre: "corriente para acelerarla", unidad: A, valor: 8 }
  calculos:
    y_a: { expr: "min(max(u_a - z_a, 0), s_a)", sim: "y", nombre: "respuesta del actuador", unidad: "" }
    y_h: { expr: "min(max(0.5 - z_a, 0), s_a)", sim: "y(0,5)", nombre: "respuesta a una orden de 0,5", unidad: "" }
    p_l: { expr: "3*(1 - k_e)", sim: "pasos perdidos", nombre: "pasos perdidos sin corregir", unidad: "" }
    I_d: { expr: "max(I_m, I_a)", sim: "I", nombre: "corriente de dimensionado", unidad: A }

tarjetas:
  - id: explore-actuador
    tipo: explorar
    titulo: "Lo que de verdad hace un actuador"
    texto: "Respuesta frente a la orden, en fracción del fondo de escala. Ponga un actuador que, con una orden de 0,5, solo dé 0,2."
    nota: "Valores de ejemplo."
    libro: [282, 284]
    inicio: { z_a: 0, s_a: 1 }
    widget:
      tipo: grafica
      x: { id: u, min: 0, max: 1, unidad: "", rotulo: "orden" }
      y: { min: 0, max: 1, unidad: "", rotulo: "respuesta" }
      curvas:
        - { expr: "min(max(u - z_a, 0), s_a)", color: naranja, rotulo: "actuador real" }
        - { expr: "u", color: tinta, rotulo: "ideal", discontinua: true }
      mandos:
        - { valor: z_a, lista: [0, 0.15, 0.3], rotulo: "Zona muerta" }
        - { valor: s_a, lista: [0.5, 0.7, 1], rotulo: "Saturación" }
      lectura: { valor: y_h, rotulo: "Respuesta a una orden de 0,5" }
    objetivo:
      condiciones:
        - { valor: y_h, objetivo: 0.2, tol: 0.01, rotulo: "Responde {{y_h}}" }
      logrado: "Una zona muerta de {{z_a}}: las órdenes pequeñas se pierden. Arriba, la saturación pone el techo."
      pistas:
        - { texto: "Responde más de lo pedido: hace falta más zona muerta." }
    escalera:
      - "La respuesta es la orden menos la zona muerta, hasta la saturación."
    solucion: "Zona muerta de 0,3."
    comprobar:
      - { con: { z_a: 0.3, s_a: 1 }, y_h: 0.2, u_a: 0.5 }

  - id: ajuste-zona-muerta
    tipo: ajuste
    titulo: "Mida la zona muerta"
    texto: "Como en el banco: suba la orden poco a poco hasta que el actuador empiece a moverse."
    libro: [295]
    fijar: { z_a: 0.15, s_a: 0.7 }
    inicio: { u_a: 0 }
    widget:
      tipo: grafica
      x: { id: u, min: 0, max: 1, unidad: "", rotulo: "orden" }
      y: { min: 0, max: 1, unidad: "", rotulo: "respuesta" }
      curvas:
        - { expr: "min(max(u - z_a, 0), s_a)", color: naranja, rotulo: "actuador" }
      marcas:
        - { x: "u_a", y: "y_a", rotulo: "orden actual" }
      lectura: { valor: y_a, rotulo: "Respuesta" }
      mandos:
        - { valor: u_a, min: 0, max: 1, paso: 0.01, rotulo: "Orden" }
    ajuste:
      valor: y_a
      min: 0.005
      max: 0.03
      rotulo: "Respuesta"
      escala: { min: 0, max: 0.2 }
      bajo: "Todavía no se mueve: está dentro de la zona muerta. Suba la orden."
      alto: "Se ha pasado: ya responde con soltura. Baje hasta el primer movimiento."
      dentro: "Empieza a moverse: la orden de ahora es la zona muerta."

  - id: ciclo-limite
    tipo: explorar
    titulo: "Corregir eternamente"
    texto: "Un posicionador con holgura en la reductora oscila alrededor de la consigna sin llegar nunca. Quite la holgura hasta que llegue."
    nota: "Dibujo esquemático."
    libro: [284]
    inicio: { h_g: 0.3 }
    widget:
      tipo: grafica
      x: { id: t, min: 0, max: 10, unidad: s, rotulo: "t", muestras: 800 }
      y: { min: 0, max: 1.6, unidad: "", rotulo: "posición" }
      curvas:
        - { expr: "(1 - exp(-t)) + h_g*min(1, t/3)*sin(2*pi*0.6*t)", color: naranja, rotulo: "posición" }
        - { expr: "1", color: tinta, rotulo: "consigna", discontinua: true }
      lectura: { valor: h_g, rotulo: "Holgura" }
      mandos:
        - { valor: h_g, lista: [0.3, 0.15, 0], rotulo: "Holgura" }
    objetivo:
      condiciones:
        - { valor: h_g, max: 0, rotulo: "Holgura: {{h_g}}" }
      logrado: "Sin zona muerta llega. Con ella, el actuador no responde a las órdenes pequeñas de cerca de la consigna: ciclo límite."
      pistas:
        - { texto: "Mientras haya holgura, el sistema corrige eternamente sin llegar." }
    escalera:
      - "Cerca de la consigna, ¿son grandes o pequeñas las órdenes?"
    solucion: "Holgura nula."
    comprobar:
      - { con: { h_g: 0 }, h_g: 0 }

  - id: predecir-saturacion
    tipo: explorar
    titulo: "El actuador a tope"
    texto: "El error crece y el controlador pide más. Suba la orden hasta que pedir más ya no dé más respuesta."
    libro: [282]
    fijar: { z_a: 0.15, s_a: 0.7 }
    inicio: { u_a: 0.3 }
    widget:
      tipo: grafica
      x: { id: u, min: 0, max: 1, unidad: "", rotulo: "orden" }
      y: { min: 0, max: 1, unidad: "", rotulo: "respuesta" }
      curvas:
        - { expr: "min(max(u - z_a, 0), s_a)", color: naranja, rotulo: "actuador" }
      marcas:
        - { x: "u_a", y: "y_a", rotulo: "orden actual" }
      lectura: { valor: y_a, rotulo: "Respuesta" }
      mandos:
        - { valor: u_a, min: 0, max: 1, paso: 0.05, rotulo: "Orden" }
    objetivo:
      condiciones:
        - { valor: y_a, min: 0.7, rotulo: "Respuesta: {{y_a}}" }
      logrado: "Saturado: por mucho que crezca el error, no hay más acción y el lazo pierde el control. La integral sigue acumulando: windup."
      pistas:
        - { texto: "Aún responde más al pedir más: siga subiendo." }
    escalera:
      - "Busque dónde la curva se aplana."
    solucion: "Orden de 0,85 o más."
    comprobar:
      - { con: { u_a: 0.85 }, y_a: 0.7 }

  - id: empareje-familias
    tipo: pregunta
    titulo: "Las familias"
    texto: "Empareje cada actuador con su rasgo."
    libro: [274, 275, 276, 277, 279, 280]
    widget:
      tipo: figura
      figura: fig-31.15
      zonas:
        - { id: todo, rotulo: "Actuadores", rect: [0, 0, 453, 226] }
    emparejar:
      - ["Motor de continua", "Escobillas que se desgastan y hacen ruido"]
      - ["Motor sin escobillas", "Conmutación electrónica y posición del rotor"]
      - ["Paso a paso", "Posiciona sin realimentación"]
      - ["Servo", "Motor, reductora, sensor y control en un bloque"]
      - ["Elemento térmico", "Lento y con mucha inercia"]
      - ["Piezoeléctrico", "Micras con resolución nanométrica"]
    exito: "El actuador es el eslabón que más veces limita el conjunto."
    pistas:
      - { texto: "El servo recibe una consigna de posición y se ocupa de todo." }
    escalera:
      - "El que no necesita realimentación gira en incrementos definidos."
    solucion: "Continua, escobillas; sin escobillas, conmutación electrónica; paso a paso, sin realimentación; servo, todo en uno; térmico, lento; piezo, micras."

  - id: pasos-perdidos
    tipo: explorar
    titulo: "Pasos perdidos"
    texto: "Un paso a paso posiciona sin realimentación: si el par no basta, pierde pasos en silencio. Haga que el sistema se entere."
    nota: "Pasos perdidos de ejemplo."
    libro: [276]
    inicio: { k_e: 0 }
    widget:
      tipo: grafica
      x: { id: n, min: 0, max: 30, unidad: "", rotulo: "pasos ordenados" }
      y: { min: 0, max: 32, unidad: "", rotulo: "posición" }
      curvas:
        - { expr: "n", color: tinta, rotulo: "ordenada", discontinua: true }
        - { expr: "n - p_l*min(1, max(0, n - 10))", color: naranja, rotulo: "real" }
      lectura: { valor: p_l, rotulo: "Pasos perdidos sin corregir" }
      mandos:
        - { valor: k_e, lista: [0, 1], nombres: [sin encoder, con encoder], rotulo: "Realimentación" }
    objetivo:
      condiciones:
        - { valor: p_l, max: 0, rotulo: "Perdidos: {{p_l}}" }
      logrado: "Midiendo la posición, el lazo ve los pasos perdidos y los repone. Sin medida, la impresora desplaza la capa y no se entera."
      pistas:
        - { texto: "Nadie mide la posición real: los pasos perdidos no se ven." }
    escalera:
      - "¿Qué mide la posición real?"
    solucion: "Con encoder."
    comprobar:
      - { con: { k_e: 1 }, p_l: 0 }

  - id: velocidad
    tipo: explorar
    titulo: "Más lento que la planta"
    texto: "Actuador y planta en serie ante un escalón. Elija un actuador que no frene la planta: cinco veces más rápido que ella."
    nota: "Planta de ejemplo."
    libro: [283, 285]
    inicio: { t_ac: 2 }
    widget:
      tipo: grafica
      x: { id: t, min: 0, max: 15, unidad: s, rotulo: "t", muestras: 600 }
      y: { min: 0, max: 1.1, unidad: "", rotulo: "salida" }
      curvas:
        - { expr: "1 - exp(-t/t_pl)", color: tinta, rotulo: "la planta sola", discontinua: true }
        - { expr: "1 - (t_ac*exp(-t/t_ac) - t_pl*exp(-t/t_pl))/(t_ac - t_pl)", color: naranja, rotulo: "actuador y planta" }
      lectura: { valor: t_ac, rotulo: "Constante del actuador" }
      mandos:
        - { valor: t_ac, lista: [2, 0.5, 0.2, 5], rotulo: "Constante del actuador" }
    objetivo:
      condiciones:
        - { valor: t_ac, max: 0.2, rotulo: "Actuador: {{t_ac}}" }
      logrado: "El conjunto sigue a la planta. Un actuador más lento que ella domina la dinámica: el lazo no va más deprisa que su eslabón más lento."
      pistas:
        - { texto: "El actuador marca el ritmo: elija uno más rápido." }
    escalera:
      - "Cinco veces más rápido que 1 s."
    solucion: "τ_{a} = 0,2 s."
    comprobar:
      - { con: { t_ac: 0.2 }, t_ac: 0.2, t_pl: 1 }

  - id: dimensionado
    tipo: simular
    titulo: "El error de dimensionado"
    texto: "Un motor mantiene la carga con 2 A y necesita 8 A para acelerarla en el tiempo pedido. ¿Para cuántos amperios se dimensionan el driver y la fuente?"
    libro: [290, 291, 292, 296]
    widget:
      tipo: figura
      figura: fig-31.15
      zonas:
        - { id: todo, rotulo: "Actuadores", rect: [0, 0, 453, 226] }
    simular:
      objetivo: I_d
      unidad: A
      tol: 0.03
      rotulo: "Corriente del driver"
      errores:
        - { expr: "I_m", texto: "Es el error más frecuente: con el régimen permanente el lazo satura en cada aceleración." }
        - { expr: "(I_m + I_a)/2", texto: "El transitorio pide los 8 A enteros mientras dura: no vale la media." }
    exito: "8 A: el dimensionado sale del peor caso dinámico, no del estático."
    escalera:
      - "¿Cuándo pide más corriente el motor?"
    solucion: "8 A."
    comprobar:
      - { I_d: 8, I_m: 2, I_a: 8 }

  - id: porque-corriente
    tipo: porque
    titulo: "El driver es parte del actuador"
    texto: "¿Por qué el driver de un motor suele medir la corriente?"
    libro: [288]
    widget:
      tipo: figura
      figura: fig-31.15
      zonas:
        - { id: todo, rotulo: "Actuadores", rect: [0, 0, 453, 226] }
    opciones:
      - texto: "Porque la corriente es a menudo la variable que de verdad se controla"
        bien: true
        porque: "En un motor de continua, el par es proporcional a la corriente."
      - texto: "Solo para saber cuánto consume"
        porque: "Es más que un consumo: suele ser la variable controlada."
      - texto: "Para aislar el controlador"
        porque: "El aislamiento es otra exigencia del driver, distinta de la medida."
    escalera:
      - "¿Qué magnitud es proporcional al par en un motor de continua?"
    solucion: "Porque la corriente suele ser la variable que se controla."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [272, 282, 284, 292, 295]
    ideas:
      - { titulo: "El último eslabón.", texto: "El actuador limita rapidez, exactitud y potencia." }
      - { titulo: "Qué mirar.", texto: "Saturación, velocidad, zona muerta y linealidad." }
      - { titulo: "Dimensionar.", texto: "Por el peor caso dinámico, no por el estático." }
      - { titulo: "En el banco.", texto: "Un escalón y una orden que sube poco a poco: velocidad, zona muerta y saturación." }
