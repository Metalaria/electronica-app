# «Consolas por dentro» · Nintendo 64 7: averías típicas. Lo simple primero (el piloto, el cartucho y su conector,
# el Jumper Pak); una consola con el piloto encendido y sin imagen: los 12 V de la fuente, el 78M05 o el diálogo con el
# CIC (Cold Reset del PIF a 0 V); los 3,3 V del PIF. Fuentes: N64brew, «Non-Booting Troubleshooting» (hechos externos
# del manifiesto), Copetti (Jumper Pak), los datos de la consola (n64#n) y el libro (reparación, capítulo 55).
leccion: consola-n64/n64-averias

libro:
  "n64#10": "Dos MX8330 · SOP de 8 patas"
  "n64#13": "Saca de los 12 V los 5 V del codificador de vídeo (ENC-NUS) y del Multi Out."
  "n64#70": "La fuente de la Nintendo 64 da dos tensiones: 3,3 V y 12 V."
  "n64#71": "Los 5 V y los 12 V alimentan el audio y el vídeo"
  "n64#72": "si no se enciende, o luce débil, sospeche de la fuente"
  "n64#73": "Casi siempre la culpa es del cartucho o de su conector"
  "n64#74": "la patilla 14 es masa y la 28 lleva 3,3 V; si faltan, pueden ser condensadores de la placa"
  "n64#75": "La patilla 6 del PIF (Cold Reset) está a 3,3 V con la consola en marcha y a 0 V en reset"
  "n64#86": "Sin el Jumper Pak ni el Expansion Pak, la consola no arranca ni da imagen."
  "cap53#39": "Casi siempre es lo simple: alimentación, conector, soldadura, fusible"

modelo:
  valores:
    V_12: { sim: "V_{12}", nombre: "tensión alta de la fuente", unidad: V, valor: 12 }
    V_5: { sim: "V_{5}", nombre: "salida del 78M05", unidad: V, valor: 5 }
    V_33: { sim: "V_{3,3}", nombre: "tensión de la lógica", unidad: V, valor: 3.3 }
    fu: { tipo: interruptor, nombre: "la fuente da sus 12 V", valor: 1 }
    re: { tipo: interruptor, nombre: "78M05 sano", valor: 1 }
    ci: { tipo: interruptor, nombre: "el CIC del cartucho contesta", valor: 1 }
  calculos:
    V_ent: { expr: "V_12*fu", sim: "V_{entrada}", nombre: "entrada del 78M05", unidad: V, cifras: 3 }
    V_sal: { expr: "V_5*fu*re", sim: "V_{salida}", nombre: "salida del 78M05", unidad: V, cifras: 3 }
    V_cr: { expr: "V_33*ci", sim: "V_{Cold Reset}", nombre: "patilla 6 del PIF (Cold Reset)", unidad: V, cifras: 3 }

tarjetas:
  - id: ordene-simple
    tipo: tocar
    fase: "Ordene"
    titulo: "Lo simple primero"
    texto: "La consola no da imagen. Toque, por orden: lo que se mira antes de abrir nada, la ranura donde está casi siempre la culpa y la de la memoria de expansión."
    libro: ["cap53#39", "n64#72", "n64#73", "n64#86"]
    widget:
      tipo: figura
      consola: { maquina: n64 }
      recorte: [201, 128, 1158, 1223]
      ampliar: 3.3
      zonas:
        # (the LED's box, 47 × 26 px, is too small for a finger across the whole board: a slightly larger rect)
        - { id: led, rect: [734, 1199, 56, 50], rotulo: "Pieza roja, abajo" }
        - { id: cart, hotspot: cart, rotulo: "Ranura larga, arriba" }
        - { id: exp, hotspot: exp, rotulo: "Conector, abajo en el centro" }
        - { id: pif, hotspot: pif, rotulo: "Chip alargado, a la derecha" }
    tocar:
      bien: [led, cart, exp]
      orden: true
      porque:
        pif: "Medir en el PIF viene después de lo simple."
    pistas:
      - { texto: "El piloto, la ranura del cartucho y la del Jumper Pak." }
    exito: "Piloto (si no luce, la fuente), cartucho (sacarlo y meterlo, o probar otro) y Jumper Pak: sin él no hay imagen."
    escalera:
      - "Empiece por lo que se ve sin herramientas."
    solucion: "Piloto, cartucho y ranura de expansión."

  - id: averia-sin-imagen
    tipo: averia
    titulo: "Piloto encendido, sin imagen"
    texto: "El piloto luce, pero no hay imagen. Mida y señale la causa: la fuente de 12 V, el 78M05 o el cartucho."
    libro: ["n64#70", "n64#71", "n64#13", "n64#75"]
    widget:
      tipo: figura
      consola: { maquina: n64 }
      recorte: [900, 420, 400, 660]
      ampliar: 1.3
      zonas:
        - { id: reg5, hotspot: reg5, rotulo: "78M05 (U13)" }
        - { id: pif, hotspot: pif, rotulo: "PIF (U6)" }
    averia:
      pasos: 2
      eleccion: fija
      sospechosos:
        - { id: fuente, rotulo: "Fuente (12 V)" }
        - { id: regulador, rotulo: "Regulador 78M05" }
        - { id: cartucho, rotulo: "Cartucho (CIC)" }
      sondas:
        - { id: entrada, rotulo: "Entrada del 78M05", valor: V_ent }
        - { id: salida, rotulo: "Salida del 78M05", valor: V_sal }
        - { id: coldreset, rotulo: "Patilla 6 del PIF", valor: V_cr }
      fallos:
        - { id: fuente-sin-12, pieza: fuente, tipo: abierta, con: { fu: 0 }, texto: "Faltan los 12 V de la fuente: sin ellos tampoco hay 5 V, y el audio y el vídeo se quedan sin alimentar. El piloto luce con los 3,3 V." }
        - { id: regulador-muerto, pieza: regulador, tipo: abierta, con: { re: 0 }, texto: "El 78M05 recibe sus 12 V pero no da los 5 V del codificador de vídeo." }
        - { id: cic-sin-respuesta, pieza: cartucho, tipo: abierta, con: { ci: 0 }, texto: "Cold Reset a 0 V: ha fallado la negociación con el CIC del cartucho. Limpie y vuelva a meter el cartucho, o pruebe otro." }
    exito: "Las tensiones separan la fuente del regulador; el Cold Reset del PIF dice si el cartucho contesta."
    escalera:
      - "Empiece por la entrada del 78M05: si no llegan los 12 V, la culpa es de antes."
      - "La patilla 6 del PIF está a 3,3 V con la consola en marcha."
    solucion: "Sin 12 V a la entrada: la fuente. Con 12 V y sin 5 V: el 78M05. Tensiones bien y Cold Reset a 0 V: el cartucho."
    comprobar:
      - { V_ent: 12, V_sal: 5, V_cr: 3.3 }

  - id: averia-en-placa
    tipo: explorar
    titulo: "Con el polímetro en la placa"
    texto: "Piloto encendido y sin imagen. Mida en la placa y señale la pieza."
    libro: ["n64#70", "n64#71", "n64#13", "n64#75"]
    widget:
      tipo: averia-placa
      maquina: n64
    objetivo:
      condiciones:
        - { averia: encontrada, rotulo: "La pieza averiada, señalada" }
      logrado: "Encontrada: las tensiones separan la fuente del 78M05, y el Cold Reset dice si el cartucho contesta."
      pistas:
        - { texto: "Mida primero la entrada del 78M05: si no llegan los 12 V, la culpa es de antes." }
    escalera:
      - "Entrada y salida del 78M05, y la patilla 6 del PIF."
    solucion: "Sin 12 V a la entrada: la fuente. Con 12 V y sin 5 V: el 78M05. Tensiones bien y Cold Reset a 0 V: el cartucho."

  - id: toque-pif-tension
    tipo: tocar
    titulo: "La alimentación del PIF"
    texto: "Con la consola encendida, uno de los chips debe tener 3,3 V en su patilla 28 y masa en la 14. Tóquelo."
    libro: ["n64#74", "n64#10"]
    widget:
      tipo: figura
      consola: { maquina: n64 }
      recorte: [878, 647, 512, 445]
      ampliar: 1.5
      zonas:
        - { id: pif, hotspot: pif, rotulo: "Chip alargado, a la derecha" }
        - { id: clk, hotspot: clk, rotulo: "Chips pequeños y cristales" }
        - { id: amp, hotspot: amp, rotulo: "Chip alargado, arriba a la derecha" }
    tocar:
      bien: [pif]
      porque:
        clk: "Los MX8330 tienen 8 patillas: no hay patilla 28."
        amp: "El AMP-NUS va a 12 V."
    exito: "El PIF: si faltan los 3,3 V en la patilla 28, pueden ser condensadores de la placa."
    escalera:
      - "Busque un chip con 28 patillas."
    solucion: "El PIF-NUS."

  - id: toque-jumper
    tipo: tocar
    titulo: "Una consola de segunda mano"
    texto: "Una consola sin imagen llega sin nada en la ranura de la memoria de expansión. Toque la ranura."
    libro: ["n64#86"]
    widget:
      tipo: figura
      consola: { maquina: n64 }
      recorte: [560, 760, 420, 460]
      ampliar: 1.4
      zonas:
        - { id: exp, hotspot: exp, rotulo: "Conector, abajo" }
        - { id: rdram, hotspot: rdram, rotulo: "Dos chips alargados" }
    tocar:
      bien: [exp]
      porque:
        rdram: "Las RDRAM están soldadas en la placa."
    exito: "Sin el Jumper Pak ni el Expansion Pak, la consola no arranca ni da imagen: antes de buscar averías, ponga uno."
    escalera:
      - "Es la ranura que se ve al abrir la tapa de arriba."
    solucion: "La ranura de expansión, P1."

  - id: por-que-cartucho
    tipo: porque
    titulo: "Un juego que solo va a veces"
    texto: "Un cartucho arranca a la segunda o a la tercera. ¿Qué es lo primero que se prueba?"
    libro: ["n64#73", "cap53#39"]
    widget:
      tipo: figura
      consola: { maquina: n64 }
      recorte: [280, 200, 960, 240]
      zonas:
        - { id: cart, hotspot: cart, rotulo: "Ranura del cartucho" }
    opciones:
      - texto: "Sacarlo y meterlo con la consola apagada, o probar otro cartucho."
        bien: true
        porque: "Casi siempre la culpa es del cartucho o de su conector; meterlo y sacarlo rasca la suciedad de los contactos."
      - texto: "Cambiar el PIF."
        porque: "Antes que un chip, lo simple: el conector."
      - texto: "Cambiar la fuente."
        porque: "Si arranca a veces, la fuente da sus tensiones; lo simple es el contacto del cartucho."
    escalera:
      - "Lo simple primero."
    solucion: "Sacarlo y meterlo, con la consola apagada, o probar otro."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: ["n64#72", "n64#73", "n64#71", "n64#75"]
    ideas:
      - { titulo: "Lo simple.", texto: "Piloto, cartucho y Jumper Pak antes de medir." }
      - { titulo: "Dos tensiones.", texto: "3,3 V para lo digital; 12 V, y de ellos 5 V, para audio y vídeo." }
      - { titulo: "El Cold Reset.", texto: "A 0 V, el CIC no ha contestado." }
      - { titulo: "El conector.", texto: "Casi siempre la culpa es del cartucho." }
