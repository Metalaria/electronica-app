# «Consolas por dentro» · Nintendo 64 5: vídeo y sonido. El RCP dibuja en la RDRAM y el VI saca cada punto por un bus
# de 7 bits multiplexado (21 bits por punto) al VDC-NUS; el ENC-NUS hace Y, C y el compuesto; el Multi Out no lleva
# RGB. El sonido: el RSP mezcla, el AI manda la serie al BU9480F y el AMP-NUS, a 12 V, la amplifica. La placa PAL
# normal: el DENC-NUS. Fuentes: los datos de la consola (n64#n), BitBuilt y el manual de programación (3.7).
leccion: consola-n64/n64-video-audio

libro:
  "n64#6": "Recibe el color del RCP por un bus multiplexado de 7 bits (SRGB0–SRGB6), 21 bits por punto"
  "n64#7": "Convierte el RGB del VDC-NUS en luminancia (Y), crominancia (C) y vídeo compuesto"
  "n64#8": "Recibe las muestras estéreo del RCP en serie (AUDCLK, AUDDAT, AUDLRCLK)"
  "n64#9": "Filtra y amplifica los dos canales del DAC hacia el Multi Out."
  "n64#18": "No lleva RGB."
  "n64#57": "El RCP no tiene chip de sonido: el RSP mezcla y el AI manda las muestras en serie"
  "n64#82": "La placa PAL normal tiene un solo chip de vídeo, el DENC-NUS, que no saca RGB"
  "n64#89": "el audio, a 44,1 kHz estéreo"

modelo:
  valores:
    b_p: { sim: "b_{punto}", nombre: "bits de color por punto", unidad: "", valor: 21 }
    b_bus: { sim: "b_{bus}", nombre: "hilos del bus SRGB", unidad: "", valor: 7 }
    f_s: { sim: "f_{s}", nombre: "frecuencia de muestreo", unidad: Hz, valor: 44100 }
  calculos:
    partes: { expr: "b_p/b_bus", sim: "n", nombre: "envíos por punto", unidad: "", cifras: 2 }
    t_s: { expr: "1/f_s", sim: "T_{s}", nombre: "tiempo entre dos muestras", unidad: s, cifras: 4 }

tarjetas:
  - id: explore-salidas
    tipo: explorar
    titulo: "Dos caminos"
    texto: "Toque los dos chips del vídeo y los dos del sonido."
    libro: ["n64#6", "n64#7", "n64#8", "n64#9"]
    widget:
      tipo: figura
      consola: { maquina: n64 }
      recorte: [913, 532, 473, 280]
      ampliar: 1.4
      zonas:
        - { id: vdc, hotspot: vdc, rotulo: "VDC-NUS", texto: "21 bits por punto por un bus de 7." }
        - { id: enc, hotspot: enc, rotulo: "ENC-NUS", texto: "Y, C y compuesto." }
        - { id: dac, hotspot: dac, rotulo: "BU9480F", texto: "El DAC de audio." }
        - { id: amp, hotspot: amp, rotulo: "AMP-NUS", texto: "Amplifica los dos canales." }
    objetivo:
      condiciones:
        - { zona: vdc, rotulo: "VDC-NUS" }
        - { zona: enc, rotulo: "ENC-NUS" }
        - { zona: dac, rotulo: "DAC" }
        - { zona: amp, rotulo: "AMP-NUS" }
      logrado: "Los ha tocado todos: lea sus fichas."

  - id: ordene-video
    tipo: tocar
    fase: "Ordene"
    titulo: "El punto, hasta el conector"
    texto: "Toque, por orden: quien manda el color del punto, el DAC de vídeo, el codificador y el conector."
    libro: ["n64#6", "n64#7", "n64#18"]
    widget:
      tipo: figura
      consola: { maquina: n64 }
      recorte: [590, 190, 850, 880]
      ampliar: 1.8
      zonas:
        - { id: rcp, hotspot: rcp, rotulo: "Chip cuadrado, en el centro" }
        - { id: vdc, hotspot: vdc, rotulo: "Chip alargado, a la derecha del centro" }
        - { id: enc, hotspot: enc, rotulo: "Chip pequeño, arriba a la derecha" }
        - { id: av, hotspot: av, rotulo: "Conector, arriba a la derecha" }
    tocar:
      bien: [rcp, vdc, enc, av]
      orden: true
    pistas:
      - { texto: "RCP, VDC-NUS, ENC-NUS y Multi Out." }
    exito: "El VI del RCP, el VDC-NUS, el ENC-NUS y el Multi Out, que no lleva RGB."
    escalera:
      - "El color sale del RCP."
    solucion: "RCP, VDC-NUS, ENC-NUS y Multi Out."

  - id: leer-partes
    tipo: leer
    titulo: "21 bits por 7 hilos"
    texto: "Cada punto tiene 21 bits de color y el bus SRGB, 7 hilos. Escriba en cuántos envíos llega cada punto."
    libro: ["n64#6"]
    widget:
      tipo: figura
      consola: { maquina: n64 }
      recorte: [590, 470, 500, 360]
      ampliar: 1.3
      zonas:
        - { id: rcp, hotspot: rcp, rotulo: "RCP" }
        - { id: vdc, hotspot: vdc, rotulo: "VDC-NUS" }
    leer:
      objetivo: partes
      unidad: ""
      tol: 0.001
      rotulo: "Envíos por punto"
      errores:
        - { expr: "b_p", texto: "Esos son los bits: repártalos entre los hilos." }
    exito: "Tres envíos de 7 bits por punto; por eso el bus va más deprisa que el punto."
    escalera:
      - "21 ÷ 7."
    solucion: "21 ÷ 7 = 3."
    comprobar:
      - { con: { b_p: 21, b_bus: 7 }, partes: 3 }

  - id: ordene-audio
    tipo: tocar
    fase: "Ordene"
    titulo: "El sonido"
    texto: "Toque, por orden: quien manda las muestras, el DAC, el amplificador y el conector."
    libro: ["n64#57", "n64#8", "n64#9"]
    widget:
      tipo: figura
      consola: { maquina: n64 }
      recorte: [521, 120, 977, 761]
      ampliar: 2.8
      zonas:
        - { id: rcp, hotspot: rcp, rotulo: "Chip cuadrado, en el centro" }
        - { id: dac, hotspot: dac, rotulo: "Chip pequeño, a la derecha" }
        - { id: amp, hotspot: amp, rotulo: "Chip alargado, a la derecha del todo" }
        - { id: av, hotspot: av, rotulo: "Conector, arriba a la derecha" }
    tocar:
      bien: [rcp, dac, amp, av]
      orden: true
    pistas:
      - { texto: "RCP, BU9480F, AMP-NUS y Multi Out." }
    exito: "No hay chip de sonido: el RSP mezcla, el AI manda la serie al BU9480F y el AMP-NUS la lleva al Multi Out."
    escalera:
      - "El sonido también sale del RCP."
    solucion: "RCP, BU9480F, AMP-NUS y Multi Out."

  - id: leer-muestra
    tipo: leer
    titulo: "Una muestra"
    texto: "El audio va a 44,1 kHz. Escriba cuánto tiempo pasa entre dos muestras."
    libro: ["n64#89", "n64#8"]
    widget:
      tipo: figura
      consola: { maquina: n64 }
      recorte: [1040, 640, 360, 200]
      ampliar: 1.3
      zonas:
        - { id: dac, hotspot: dac, rotulo: "BU9480F" }
    leer:
      objetivo: t_s
      unidad: s
      tol: 0.005
      rotulo: "Tiempo entre muestras"
      errores:
        - { expr: "f_s", texto: "Esa es la frecuencia: el tiempo es su inversa." }
    exito: "Unos 22,68 µs: en ese tiempo el DAC recibe una muestra de cada canal."
    escalera:
      - "La inversa de 44,1 kHz."
    solucion: "La inversa de 44,1 kHz: 22,68 µs."
    comprobar:
      - { con: { f_s: 44100 }, t_s: 22.676e-6 }

  - id: por-que-rgb
    tipo: porque
    titulo: "Y el RGB de las PAL"
    texto: "En la placa NTSC, el VDC-NUS da RGB. ¿Por qué la placa PAL normal no lo da?"
    libro: ["n64#82", "n64#18"]
    widget:
      tipo: figura
      consola: { maquina: n64 }
      recorte: [900, 440, 300, 300]
      zonas:
        - { id: vdc, hotspot: vdc, rotulo: "VDC-NUS" }
        - { id: enc, hotspot: enc, rotulo: "ENC-NUS" }
    opciones:
      - texto: "Lleva un solo chip, el DENC-NUS, que no saca RGB."
        bien: true
        porque: "La NTSC separa el DAC (VDC-NUS, con RGB) y el codificador (ENC-NUS); la PAL normal los junta en el DENC-NUS."
      - texto: "Porque el Multi Out de las PAL no tiene patillas para él."
        porque: "Tampoco el NTSC lleva RGB al Multi Out: el problema está en el chip."
      - texto: "Porque el RCP de las PAL es otro."
        porque: "Lo que cambia en el vídeo es el chip que hace la señal, el DENC-NUS."
    escalera:
      - "Compare los chips de vídeo de las dos placas."
    solucion: "El DENC-NUS no saca RGB."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: ["n64#6", "n64#7", "n64#57", "n64#82"]
    ideas:
      - { titulo: "Tres envíos.", texto: "21 bits por punto por un bus de 7." }
      - { titulo: "Y, C y compuesto.", texto: "Del ENC-NUS al Multi Out, sin RGB." }
      - { titulo: "Sin chip de sonido.", texto: "El RSP mezcla; el AI manda la serie al DAC." }
      - { titulo: "La PAL normal.", texto: "Un solo chip, el DENC-NUS." }
