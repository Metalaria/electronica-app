# «Consolas por dentro» · Nintendo 64 6: el PIF y el CIC. El PIF tiene la consola en reset hasta que el CIC del
# cartucho contesta, y lo vuelve a comprobar durante el juego; el arranque (IPL1 en la ROM del PIF); sin Jumper Pak no
# hay arranque; la región se impone con la forma del cartucho; el PIF es, en la práctica, el chip de la región.
# Fuentes: los datos de la consola (n64#n) y los hechos externos (Copetti, N64brew, BitBuilt).
leccion: consola-n64/n64-bloqueo

libro:
  "n64#5": "comprueba el CIC del cartucho y mantiene la consola en reset si no contesta"
  "n64#14": "además el CIC (SECCLK, SEC1, SEC2)"
  "n64#58": "maneja el reset y la NMI"
  "n64#78": "Con un cartucho PAL en una consola NTSC, los datos del CIC pueden salir mal."
  "n64#80": "El PIF-NUS es, en la práctica, el chip de la región de la Nintendo 64."
  "n64#84": "lo vuelve a comprobar durante el juego y, si no es válido, la consola se queda congelada"
  "n64#85": "se hace con la forma del cartucho, no con la electrónica"
  "n64#86": "Sin el Jumper Pak ni el Expansion Pak, la consola no arranca ni da imagen."
  "n64#87": "La CPU arranca en 0xBFC00000, en la ROM interna del PIF (IPL1)"
  "cap29#37": "las variables solo valen 0 o 1"

modelo:
  valores: {}
  calculos: {}

tarjetas:
  - id: explore-arranque
    tipo: explorar
    titulo: "Cuándo arranca"
    texto: "La consola arranca si el CIC del cartucho contesta, si el bus de la memoria está terminado (Jumper Pak o Expansion Pak) y nadie pulsa reset. Consiga que arranque."
    libro: ["n64#5", "n64#86", "n64#58"]
    widget:
      tipo: logica
      entradas: [{ id: CIC, rotulo: "El CIC contesta" }, { id: PAK, rotulo: "Jumper o Expansion Pak" }, { id: RES, rotulo: "Reset pulsado" }]
      piezas:
        - { id: n1, tipo: not, entradas: [RES] }
        - { id: y1, tipo: and, entradas: [CIC, PAK, n1] }
      salidas:
        - { id: MARCHA, de: y1 }
    objetivo:
      condiciones:
        - { led: MARCHA, valor: 1, rotulo: "La consola arranca" }
      logrado: "CIC, Pak y el reset suelto: si falta el CIC, el PIF deja la consola en reset; si falta el Pak, no hay imagen."
      pistas:
        - { cuando: { led: MARCHA, valor: 0 }, texto: "Hace falta un cartucho que conteste, un Pak en la ranura y no pulsar reset." }
    escalera:
      - "Las tres condiciones a la vez."
    solucion: "El CIC contesta, hay Pak y el reset está suelto."

  - id: tabla-cic
    tipo: tabla
    titulo: "La tabla del PIF"
    texto: "Con el Pak puesto, rellene cuándo arranca la consola (1) y cuándo se queda en reset (0)."
    libro: ["n64#5", "n64#58", "cap29#37"]
    widget:
      tipo: logica
      entradas: [{ id: CIC, rotulo: "El CIC contesta" }, { id: RES, rotulo: "Reset pulsado" }]
      piezas:
        - { id: n1, tipo: not, entradas: [RES] }
        - { id: y1, tipo: and, entradas: [CIC, n1] }
      salidas:
        - { id: MARCHA, de: y1 }
      ocultar: true
    tabla:
      salidas: [MARCHA]
    exito: "Una sola fila de cuatro: el CIC contesta y nadie pulsa reset. Y el PIF lo vuelve a comprobar durante el juego."
    escalera:
      - "Si el CIC no contesta, da igual el botón."
    solucion: "MARCHA vale 1 solo cuando el CIC contesta y el reset está suelto."

  - id: toque-pif
    tipo: tocar
    titulo: "El guardián"
    texto: "Toque el chip que habla con el CIC del cartucho y tiene la CPU en reset."
    libro: ["n64#5", "n64#80", "n64#87"]
    widget:
      tipo: figura
      consola: { maquina: n64 }
      recorte: [900, 440, 400, 640]
      ampliar: 1.3
      zonas:
        - { id: pif, hotspot: pif, rotulo: "Chip alargado, a la derecha" }
        - { id: clk, hotspot: clk, rotulo: "Chips pequeños y cristales" }
        - { id: enc, hotspot: enc, rotulo: "Chip pequeño, arriba" }
    tocar:
      bien: [pif]
      porque:
        clk: "Son los generadores de reloj."
        enc: "Es el ENC-NUS, el codificador de vídeo."
    exito: "El PIF-NUS: en la práctica, el chip de la región. Guarda también el arranque: la CPU arranca en 0xBFC00000, en su ROM."
    escalera:
      - "Lea las marcas: «PIF-NUS»."
    solucion: "El PIF-NUS, U6."

  - id: ordene-cic
    tipo: tocar
    fase: "Ordene"
    titulo: "El camino del diálogo"
    texto: "Toque, por orden: la ranura del cartucho, donde está el CIC; el chip que lo comprueba; y la CPU, que se queda en reset si falla."
    libro: ["n64#14", "n64#5", "n64#58"]
    widget:
      tipo: figura
      consola: { maquina: n64 }
      recorte: [220, 200, 1080, 900]
      ampliar: 1.4
      zonas:
        - { id: cart, hotspot: cart, rotulo: "Ranura larga, arriba" }
        - { id: pif, hotspot: pif, rotulo: "Chip alargado, a la derecha" }
        - { id: cpu, hotspot: cpu, rotulo: "Chip cuadrado, a la izquierda" }
        - { id: rcp, hotspot: rcp, rotulo: "Chip cuadrado, en el centro" }
    tocar:
      bien: [cart, pif, cpu]
      orden: true
      porque:
        rcp: "El RCP no toma parte en el diálogo con el CIC."
    pistas:
      - { texto: "Cartucho, PIF y CPU." }
    exito: "SECCLK, SEC1 y SEC2 del cartucho al PIF; el PIF maneja el reset y la NMI de la CPU."
    escalera:
      - "El CIC va dentro del cartucho."
    solucion: "Cartucho, PIF y CPU."

  - id: toque-pak
    tipo: tocar
    titulo: "Otra condición"
    texto: "Toque lo que, si falta, deja la consola sin arrancar aunque el CIC conteste."
    libro: ["n64#86"]
    widget:
      tipo: figura
      consola: { maquina: n64 }
      recorte: [590, 759, 340, 521]
      ampliar: 1.9
      zonas:
        - { id: exp, hotspot: exp, rotulo: "Conector, abajo" }
        - { id: rdram, hotspot: rdram, rotulo: "Dos chips alargados" }
        - { id: led, hotspot: led, rotulo: "Pieza roja" }
    tocar:
      bien: [exp]
      porque:
        rdram: "Las RDRAM están soldadas: no se quitan."
        led: "El piloto no impide nada."
    exito: "La ranura del Jumper Pak: sin él ni el Expansion Pak, no arranca ni da imagen."
    escalera:
      - "Es lo que el usuario puede quitar."
    solucion: "La ranura de expansión."

  - id: por-que-region
    tipo: porque
    titulo: "Un juego de otra región"
    texto: "¿Qué impide sobre todo poner un juego japonés en una consola europea?"
    libro: ["n64#85", "n64#78"]
    widget:
      tipo: figura
      consola: { maquina: n64 }
      recorte: [280, 200, 960, 240]
      zonas:
        - { id: cart, hotspot: cart, rotulo: "Ranura del cartucho" }
    opciones:
      - texto: "La forma del cartucho."
        bien: true
        porque: "El bloqueo regional se hace con la forma del cartucho; además, los datos del CIC pueden salir mal entre regiones."
      - texto: "Un chip distinto en la ranura."
        porque: "La ranura no lleva chip: el CIC está en el cartucho y el PIF en la placa."
      - texto: "La frecuencia de la CPU."
        porque: "La CPU va igual en las dos: lo que impide meterlo es la forma."
    escalera:
      - "Piense antes de encender: ¿entra?"
    solucion: "La forma del cartucho."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: ["n64#5", "n64#84", "n64#86", "n64#85"]
    ideas:
      - { titulo: "El PIF manda.", texto: "Sin respuesta del CIC, la consola se queda en reset." }
      - { titulo: "Y sigue mirando.", texto: "Lo comprueba también durante el juego." }
      - { titulo: "El Pak.", texto: "Sin él no hay arranque ni imagen." }
      - { titulo: "La región.", texto: "Sobre todo, la forma del cartucho." }
