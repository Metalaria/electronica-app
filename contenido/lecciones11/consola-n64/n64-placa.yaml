# «Consolas por dentro» · Nintendo 64 1: la placa de un vistazo, sobre la foto principal del explorador (la NUS-CPU-04
# sin disipadores de la guía de iFixit, CC BY-NC-SA 3.0; recuadros llevados desde la PCB de OpeN64). La CPU que no
# toca la memoria, el RCP por el que pasa todo, la RDRAM y su ranura de expansión, el camino del vídeo y el PIF.
# Fuentes: los datos de la consola (n64#n: explorador, arquitectura y los hechos externos del manifiesto).
leccion: consola-n64/n64-placa

libro:
  "n64#2": "No toca la memoria: todo lo pide al RCP por el bus SysAD de 32 bits"
  "n64#3": "El corazón de la placa, a 62,5 MHz"
  "n64#4": "La memoria de toda la consola: 4 MB útiles"
  "n64#5": "comprueba el CIC del cartucho y mantiene la consola en reset si no contesta"
  "n64#6": "Recibe el color del RCP por un bus multiplexado de 7 bits"
  "n64#7": "Convierte el RGB del VDC-NUS en luminancia (Y), crominancia (C) y vídeo compuesto"
  "n64#14": "El bus del cartucho (PI): 16 bits de direcciones y datos multiplexados"
  "n64#15": "el Jumper Pak lo termina y el Expansion Pak añade otros 4,5 MB"
  "n64#18": "Vídeo compuesto, S-vídeo (Y y C), sincronismo, audio estéreo y 5 V. No lleva RGB."
  "n64#80": "El PIF-NUS es, en la práctica, el chip de la región de la Nintendo 64."
  "n64#86": "Sin el Jumper Pak ni el Expansion Pak, la consola no arranca ni da imagen."

modelo:
  valores: {}
  calculos: {}

tarjetas:
  - id: explore-chips
    tipo: explorar
    titulo: "Cuatro chips grandes"
    texto: "Toque la CPU, el RCP, la memoria y el PIF para leer qué hace cada uno."
    libro: ["n64#2", "n64#3", "n64#4", "n64#5"]
    widget:
      tipo: figura
      consola: { maquina: n64 }
      recorte: [220, 470, 1060, 620]
      ampliar: 1.4
      zonas:
        - { id: cpu, hotspot: cpu, rotulo: "CPU VR4300", texto: "MIPS de 64 bits a 93,75 MHz; no toca la memoria." }
        - { id: rcp, hotspot: rcp, rotulo: "RCP", texto: "Gráficos, sonido y todas las interfaces, a 62,5 MHz." }
        - { id: rdram, hotspot: rdram, rotulo: "RDRAM", texto: "4 MB útiles en un bus Rambus de 9 bits." }
        - { id: pif, hotspot: pif, rotulo: "PIF", texto: "Arranque, CIC y mandos." }
    objetivo:
      condiciones:
        - { zona: cpu, rotulo: "CPU" }
        - { zona: rcp, rotulo: "RCP" }
        - { zona: rdram, rotulo: "RDRAM" }
        - { zona: pif, rotulo: "PIF" }
      logrado: "Los ha tocado todos: lea sus fichas."

  - id: toque-memoria
    tipo: tocar
    titulo: "¿Con quién habla la memoria?"
    texto: "La CPU no tiene bus de memoria. Toque el chip que conecta la memoria con todo lo demás."
    libro: ["n64#2", "n64#3", "n64#4"]
    widget:
      tipo: figura
      consola: { maquina: n64 }
      recorte: [220, 470, 1060, 620]
      ampliar: 1.4
      zonas:
        - { id: cpu, hotspot: cpu, rotulo: "Chip cuadrado, a la izquierda" }
        - { id: rcp, hotspot: rcp, rotulo: "Chip cuadrado, en el centro" }
        - { id: rdram, hotspot: rdram, rotulo: "Dos chips alargados, debajo del centro" }
        - { id: pif, hotspot: pif, rotulo: "Chip alargado, a la derecha" }
    tocar:
      bien: [rcp]
      porque:
        cpu: "Es la CPU: todo lo pide al RCP por SysAD."
        rdram: "Es la propia memoria: contesta al RCP, no reparte."
        pif: "Es el PIF: arranque, CIC y mandos."
    exito: "El RCP: la CPU le pide cada dato por SysAD y él va a buscarlo a la RDRAM."
    escalera:
      - "Busque el chip grande que está entre la CPU y la memoria."
    solucion: "El RCP, el chip cuadrado del centro."

  - id: toque-rdram
    tipo: tocar
    titulo: "La memoria de toda la consola"
    texto: "Toque la memoria de la consola."
    libro: ["n64#4", "n64#15"]
    widget:
      tipo: figura
      consola: { maquina: n64 }
      recorte: [600, 560, 700, 640]
      ampliar: 1.5
      zonas:
        - { id: rdram, hotspot: rdram, rotulo: "Dos chips alargados, debajo del centro" }
        - { id: exp, hotspot: exp, rotulo: "Conector, abajo en el centro" }
        - { id: vdc, hotspot: vdc, rotulo: "Chip alargado, a la derecha del centro" }
        - { id: pif, hotspot: pif, rotulo: "Chip alargado, a la derecha" }
    tocar:
      bien: [rdram]
      porque:
        exp: "Es la ranura de expansión: el bus Rambus sigue hasta ella, pero la memoria de la placa está en los dos chips."
        vdc: "Es el VDC-NUS, el DAC de vídeo."
        pif: "Es el PIF."
    exito: "Las dos RDRAM: 4 MB útiles. El bus sigue hasta la ranura de expansión, donde el Jumper Pak lo termina."
    escalera:
      - "Son dos chips iguales, uno encima del otro."
    solucion: "Los dos chips RDRAM, U14 y U11."

  - id: ordene-video
    tipo: tocar
    fase: "Ordene"
    titulo: "El camino del vídeo"
    texto: "Toque, por este orden, lo que recorre la imagen: el chip que la dibuja, el DAC de vídeo, el codificador y el conector."
    libro: ["n64#3", "n64#6", "n64#7", "n64#18"]
    widget:
      tipo: figura
      consola: { maquina: n64 }
      recorte: [590, 190, 850, 880]
      ampliar: 1.8
      zonas:
        - { id: rcp, hotspot: rcp, rotulo: "Chip cuadrado, en el centro" }
        - { id: vdc, hotspot: vdc, rotulo: "Chip alargado, a la derecha del centro" }
        - { id: enc, hotspot: enc, rotulo: "Chip pequeño, arriba a la derecha" }
        - { id: av, hotspot: av, rotulo: "Conector, arriba a la derecha" }
        - { id: pif, hotspot: pif, rotulo: "Chip alargado, a la derecha" }
    tocar:
      bien: [rcp, vdc, enc, av]
      orden: true
      porque:
        pif: "El PIF no toca el vídeo."
    pistas:
      - { texto: "El RCP, el VDC-NUS, el ENC-NUS y el Multi Out." }
    exito: "RCP, VDC-NUS (RGB), ENC-NUS (Y, C y compuesto) y Multi Out, que no lleva RGB."
    escalera:
      - "Empiece por el chip que dibuja."
    solucion: "RCP, VDC-NUS, ENC-NUS y Multi Out."

  - id: toque-cartucho
    tipo: tocar
    titulo: "Dos ranuras"
    texto: "La placa tiene dos ranuras. Toque la del bus de 16 bits del cartucho."
    libro: ["n64#14", "n64#15", "n64#86"]
    widget:
      tipo: figura
      consola: { maquina: n64 }
      recorte: [280, 200, 960, 1000]
      ampliar: 1.4
      zonas:
        - { id: cart, hotspot: cart, rotulo: "Ranura larga, arriba" }
        - { id: exp, hotspot: exp, rotulo: "Conector, abajo en el centro" }
    tocar:
      bien: [cart]
      porque:
        exp: "Es la ranura de expansión, la del Jumper Pak: sin él o sin el Expansion Pak, la consola no arranca ni da imagen."
    exito: "La ranura del cartucho: 16 bits que llevan direcciones y datos por los mismos hilos."
    escalera:
      - "El cartucho entra por arriba."
    solucion: "La ranura larga de arriba, P5 en la serigrafía."

  - id: toque-region
    tipo: tocar
    titulo: "El chip de la región"
    texto: "Toque el chip que, en la práctica, decide la región de la consola."
    libro: ["n64#5", "n64#80"]
    widget:
      tipo: figura
      consola: { maquina: n64 }
      recorte: [900, 540, 400, 540]
      ampliar: 1.3
      zonas:
        - { id: pif, hotspot: pif, rotulo: "Chip alargado, a la derecha" }
        - { id: clk, hotspot: clk, rotulo: "Chips pequeños y cristales" }
        - { id: enc, hotspot: enc, rotulo: "Chip pequeño, arriba a la derecha" }
    tocar:
      bien: [pif]
      porque:
        clk: "Los relojes cambian entre NTSC y PAL, pero el chip de la región es otro."
        enc: "El ENC-NUS hace el vídeo compuesto."
    exito: "El PIF-NUS: comprueba el CIC del cartucho y mantiene la consola en reset si no contesta."
    escalera:
      - "Lea la marca: está escrita en el chip."
    solucion: "El PIF-NUS, U6."

  - id: prediga-jumper
    tipo: predecir
    titulo: "Sin el Jumper Pak"
    texto: "Si se quita el Jumper Pak y no se pone el Expansion Pak, ¿qué hace la consola?"
    libro: ["n64#15", "n64#86"]
    widget:
      tipo: figura
      consola: { maquina: n64 }
      recorte: [560, 1000, 420, 220]
      zonas:
        - { id: exp, hotspot: exp, rotulo: "Ranura de expansión" }
    opciones:
      - texto: "No arranca ni da imagen."
        bien: true
        porque: "El bus Rambus llega hasta la ranura y alguien tiene que terminarlo: el Jumper Pak o el Expansion Pak."
      - texto: "Arranca con 4 MB."
        porque: "Los 4 MB están en la placa, pero el bus sin terminar no funciona."
      - texto: "Arranca, pero sin sonido."
        porque: "No es cosa del sonido: sin terminar el bus de la memoria no hay arranque."
    escalera:
      - "Lea la ficha de la ranura de expansión."
    solucion: "No arranca ni da imagen."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: ["n64#2", "n64#3", "n64#4", "n64#80"]
    ideas:
      - { titulo: "La CPU pide.", texto: "El VR4300 no toca la memoria: lo pide todo al RCP." }
      - { titulo: "El RCP lo hace todo.", texto: "Gráficos, sonido y todas las interfaces." }
      - { titulo: "Rambus.", texto: "4 MB útiles, y el bus terminado en la ranura de expansión." }
      - { titulo: "El PIF.", texto: "Arranque, CIC, mandos y, en la práctica, la región." }
