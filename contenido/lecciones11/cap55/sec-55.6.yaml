# Lección de la sección 31.6 «GRAFCET (IEC 60848)» (cap55; etiqueta interna sec-55.6).
# Formato: contenido/lecciones11/GUIA.md (§11). La traducción del libro (una variable por etapa; transiciones con las
# etapas del principio de la vuelta, luego desactivaciones y activaciones) es una máquina de estados con un biestable D
# por etapa y el reloj de la vuelta: franquea una transición por vuelta. Con 0 → 1 → 2 y las dos receptividades a la
# vez, la etapa 1 dura una vuelta en la traducción y cero en el GRAFCET (la evolución fugaz del libro).
# 1.2.1 («aprender haciendo», GUIA §13): en la figura 31.6 se tocan la divergencia que pide receptividades
# excluyentes, la convergencia que sincroniza y las etapas que siguen activas con la convergencia en Y sin validar (el
# ejercicio 31.8 llevado a las etapas de la figura); X2 y X1 de la traducción se dibujan. Queda una pregunta de
# opciones (la acción de la evolución fugaz). La exploración de la traducción queda sin objetivo (petición abierta).
leccion: cap55/sec-55.6

libro:
  90: "describe un automatismo secuencial antes de programarlo"
  91: "Las iniciales, de cuadrado doble, son las activas al arrancar"
  92: "Es una máquina de estados de tipo Moore"
  94: "Franqueo de una transición"
  96: "las receptividades de una divergencia en O tienen que ser excluyentes"
  98: "Con 0 → 1 → 2 y las dos receptividades verdaderas a la vez"
  101: "Transiciones: cada una, la Y de sus etapas anteriores y su receptividad"
  102: "Esta traducción franquea una transición por vuelta"
  "cap55#138": "t5 no está validada sin la 4"

modelo:
  valores:
    # the step numbers of figure 31.6 (right-hand GRAFCET), so that the texts can name them
    n12: { sim: "12", nombre: "etapa de abajo de la rama izquierda", unidad: "", valor: 12 }
    n21: { sim: "21", nombre: "etapa de arriba de la rama derecha", unidad: "", valor: 21 }
    n22: { sim: "22", nombre: "etapa de abajo de la rama derecha", unidad: "", valor: 22 }
  calculos: {}

tarjetas:
  - id: explore-elementos
    tipo: tocar
    titulo: "Receptividades excluyentes"
    texto: "Toque el punto del GRAFCET donde las receptividades tienen que ser excluyentes, porque si se cumplieran dos a la vez se activarían dos ramas."
    libro: [90, 91, 96]
    widget:
      tipo: figura
      figura: fig-55.6
      zonas:
        - { id: div-o, rotulo: "Bajo la etapa 1", rect: [10, 66, 105, 26] }
        - { id: conv-o, rotulo: "Sobre la etapa 4", rect: [20, 110, 85, 28] }
        - { id: div-y, rotulo: "Trazo doble de arriba", rect: [192, 34, 75, 28] }
        - { id: conv-y, rotulo: "Trazo doble de abajo", rect: [192, 108, 75, 28] }
    tocar:
      bien: [div-o]
      porque:
        conv-o: "Una convergencia en O recoge ramas: no elige entre ellas."
        div-y: "En una divergencia en Y se activan todas las ramas a propósito, con una sola receptividad."
        conv-y: "La convergencia en Y espera a las ramas; tiene una sola receptividad."
    exito: "La divergencia en O: a · b̄ y b no pueden cumplirse a la vez. Si pudieran, el GRAFCET franquearía las dos: garantizarlo es cosa de quien diseña."
    escalera: ["Busque donde una etapa elige entre dos transiciones."]
    solucion: "Bajo la etapa 1: la divergencia en O."

  - id: toque-sincroniza
    tipo: tocar
    titulo: "Esperar a las dos ramas"
    texto: "Toque el elemento que solo deja seguir cuando han terminado todas las ramas."
    libro: [96]
    widget:
      tipo: figura
      figura: fig-55.6
      zonas:
        - { id: div-o, rotulo: "Bajo la etapa 1", rect: [10, 66, 105, 26] }
        - { id: conv-o, rotulo: "Sobre la etapa 4", rect: [20, 110, 85, 28] }
        - { id: div-y, rotulo: "Trazo doble de arriba", rect: [192, 34, 75, 28] }
        - { id: conv-y, rotulo: "Trazo doble de abajo", rect: [192, 108, 75, 28] }
    tocar:
      bien: [conv-y]
      porque:
        div-o: "Es una divergencia en O: elige una rama, no espera a ninguna."
        conv-o: "Una convergencia en O deja pasar a la rama que llegue; no sincroniza."
        div-y: "Es la divergencia en Y: arranca las dos ramas, pero no espera a que terminen."
    exito: "La convergencia en Y, bajo trazo doble: solo está validada con las dos ramas terminadas."
    escalera: ["Busque el trazo doble que recoge ramas."]
    solucion: "El trazo doble de abajo: la convergencia en Y."

  - id: explore-traduccion
    tipo: explorar
    titulo: "Un biestable por etapa"
    texto: "La secuencia 0 → 1 → 2 traducida: cada etapa es un biestable y el reloj es la vuelta. Llévela hasta la etapa 2."
    libro: [101, 102]
    widget:
      tipo: logica
      entradas: [{ id: A, rotulo: "a" }, { id: B, rotulo: "b" }, { id: CLK, reloj: true, rotulo: "Vuelta" }]
      piezas:
        - { id: na, tipo: not, entradas: [A] }
        - { id: nb, tipo: not, entradas: [B] }
        - { id: t01, tipo: and, entradas: [x0.q, A], rotulo: "t01" }
        - { id: t12, tipo: and, entradas: [x1.q, B], rotulo: "t12" }
        - { id: h0, tipo: and, entradas: [x0.q, na] }
        - { id: h1, tipo: and, entradas: [x1.q, nb] }
        - { id: s1, tipo: or, entradas: [t01, h1] }
        - { id: s2, tipo: or, entradas: [t12, x2.q] }
        - { id: x0, tipo: d, entradas: [h0, CLK], inicial: 1, rotulo: "X0" }
        - { id: x1, tipo: d, entradas: [s1, CLK], rotulo: "X1" }
        - { id: x2, tipo: d, entradas: [s2, CLK], rotulo: "X2" }
      salidas:
        - { id: X0, de: x0.q }
        - { id: X1, de: x1.q }
        - { id: X2, de: x2.q }
    objetivo:
      condiciones:
        - { led: X2, valor: 1, rotulo: "Etapa 2 activa" }
      logrado: "Una transición por vuelta: la Y de su etapa anterior y su receptividad."
      pistas:
        - { texto: "Cada transición pide su etapa activa y su receptividad: a, y luego b." }
    escalera: ["a = 1 y una vuelta; luego b = 1 y otra vuelta."]
    solucion: "a, vuelta, b, vuelta."

  - id: dibuje-x2
    tipo: dibujar
    titulo: "Paso a paso"
    texto: "Primero sube a y, dos vueltas después, b. Dibuje la etapa 2, X2, vuelta a vuelta."
    libro: [101, 102]
    widget:
      tipo: logica
      entradas: [{ id: A, rotulo: "a" }, { id: B, rotulo: "b" }, { id: CLK, reloj: true, rotulo: "Vuelta" }]
      piezas:
        - { id: na, tipo: not, entradas: [A] }
        - { id: nb, tipo: not, entradas: [B] }
        - { id: t01, tipo: and, entradas: [x0.q, A], rotulo: "t01" }
        - { id: t12, tipo: and, entradas: [x1.q, B], rotulo: "t12" }
        - { id: h0, tipo: and, entradas: [x0.q, na] }
        - { id: h1, tipo: and, entradas: [x1.q, nb] }
        - { id: s1, tipo: or, entradas: [t01, h1] }
        - { id: s2, tipo: or, entradas: [t12, x2.q] }
        - { id: x0, tipo: d, entradas: [h0, CLK], inicial: 1, rotulo: "X0" }
        - { id: x1, tipo: d, entradas: [s1, CLK], rotulo: "X1" }
        - { id: x2, tipo: d, entradas: [s2, CLK], rotulo: "X2" }
      salidas:
        - { id: X1, de: x1.q }
        - { id: X2, de: x2.q }
      cronograma: { ciclos: 6, estimulo: { A: "011111", B: "000111" }, senales: [CLK, A, B, X1] }
      dibujo: false
    dibujar:
      senal: X2
    exito: "Cada transición es la Y de su etapa anterior y su receptividad; cada etapa, un biestable que cambia con la vuelta. X2 sube en la vuelta en que b ya vale 1 con la 1 activa, y se queda."
    escalera:
      - "X2 solo puede subir cuando X1 vale 1 y b vale 1."
    solucion: "X2 sube en el flanco en que b ya vale 1 y no vuelve a bajar."

  - id: dibuje-fugaz
    tipo: dibujar
    titulo: "Dibuje X1"
    texto: "a y b suben a la vez. Dibuje la etapa 1, X1, vuelta a vuelta."
    libro: [98, 102]
    widget:
      tipo: logica
      entradas: [{ id: A, rotulo: "a" }, { id: B, rotulo: "b" }, { id: CLK, reloj: true, rotulo: "Vuelta" }]
      piezas:
        - { id: na, tipo: not, entradas: [A] }
        - { id: nb, tipo: not, entradas: [B] }
        - { id: t01, tipo: and, entradas: [x0.q, A], rotulo: "t01" }
        - { id: t12, tipo: and, entradas: [x1.q, B], rotulo: "t12" }
        - { id: h0, tipo: and, entradas: [x0.q, na] }
        - { id: h1, tipo: and, entradas: [x1.q, nb] }
        - { id: s1, tipo: or, entradas: [t01, h1] }
        - { id: s2, tipo: or, entradas: [t12, x2.q] }
        - { id: x0, tipo: d, entradas: [h0, CLK], inicial: 1, rotulo: "X0" }
        - { id: x1, tipo: d, entradas: [s1, CLK], rotulo: "X1" }
        - { id: x2, tipo: d, entradas: [s2, CLK], rotulo: "X2" }
      salidas:
        - { id: X1, de: x1.q }
        - { id: X2, de: x2.q }
      cronograma: { ciclos: 5, estimulo: { A: "01111", B: "01111" }, senales: [CLK, A, B, X2] }
      dibujo: false
    dibujar:
      senal: X1
    exito: "X1 vale 1 una sola vuelta: la evolución fugaz dura un ciclo en lugar de cero."
    escalera:
      - "En el flanco en que a ya vale 1, la etapa 0 pasa a la 1."
      - "En el flanco siguiente, b franquea t12."
    solucion: "X1 sube en el primer flanco con a = 1 y baja en el siguiente."

  - id: porque-fugaz
    tipo: porque
    titulo: "Una vuelta de más"
    texto: "En el GRAFCET la etapa 1 tiene actividad de duración nula. ¿Qué cambia que dure una vuelta en la traducción?"
    libro: [98, 102]
    widget:
      tipo: figura
      figura: fig-55.6
      zonas:
        - { id: accion, rotulo: "Recuadro junto a la etapa 1", rect: [76, 44, 30, 28] }
    opciones:
      - { texto: "Sus acciones continuas aparecen durante ese ciclo, aunque no deberían", bien: true, porque: "En una evolución fugaz no se ejecutan. Casi nunca importa; si importa, se repiten las transiciones hasta la estabilidad." }
      - { texto: "Nada: el resultado final es el mismo", porque: "La situación estable sí, pero mientras tanto la acción de la etapa 1 sale una vuelta." }
      - { texto: "Que se salta la etapa 2", porque: "Llega a la 2, solo que una vuelta después." }
    escalera: ["¿Qué hace una acción continua mientras su etapa está activa?"]
    solucion: "Durante esa vuelta la acción continua de la etapa 1 vale 1."

  - id: pregunta-convergencia
    tipo: tocar
    titulo: "Una convergencia que espera"
    texto: "Están activas las etapas {{n12}} y {{n21}}, y a0 · b0 se cumple. Toque las etapas que quedan activas tras evolucionar."
    libro: [94, 96, "cap55#138"]
    widget:
      tipo: figura
      figura: fig-55.6
      zonas:
        - { id: e10, rotulo: "Etapa de arriba a la derecha", rect: [214.5, 5, 35, 35] }
        - { id: e11, rotulo: "Rama izquierda, arriba", rect: [183.5, 47.5, 35, 35] }
        - { id: e12, rotulo: "Rama izquierda, abajo", rect: [183.5, 82.5, 35, 35] }
        - { id: e21, rotulo: "Rama derecha, arriba", rect: [240.5, 47.5, 35, 35] }
        - { id: e22, rotulo: "Rama derecha, abajo", rect: [240.5, 82.5, 35, 35] }
        - { id: e30, rotulo: "Etapa de abajo", rect: [214.5, 126.5, 35, 35] }
    tocar:
      bien: [e12, e21]
      todas: true
      porque:
        e10: "La etapa inicial ya se desactivó al arrancar las dos ramas."
        e11: "Ya pasó a la {{n12}} con a1."
        e22: "La {{n21}} solo pasa a la {{n22}} cuando se cumpla b1."
        e30: "La convergencia en Y solo está validada con la {{n12}} y la {{n22}} activas: aún falta la {{n22}}."
    exito: "Siguen la {{n12}} y la {{n21}}: la convergencia en Y no está validada sin la {{n22}}, aunque su receptividad se cumpla. Una transición se franquea cuando está validada y su receptividad es verdadera."
    escalera: ["Una transición está validada cuando todas sus etapas anteriores están activas."]
    solucion: "La {{n12}} y la {{n21}}: la rama derecha aún no ha llegado a la {{n22}}."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [91, 92, 96, 102]
    ideas:
      - { titulo: "Una máquina de Moore.", texto: "Etapas, transiciones y acciones, con varias etapas activas a la vez." }
      - { titulo: "Divergencias.", texto: "En O, receptividades excluyentes; en Y, ramas que se sincronizan al converger." }
      - { titulo: "La traducción.", texto: "Un biestable por etapa y una transición por vuelta: lo fugaz dura un ciclo." }
