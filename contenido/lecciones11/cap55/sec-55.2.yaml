# Lección 1.2 de la sección 31.2 «Sensores y Actuadores Industriales» (cap55; etiqueta interna sec-55.2).
# Formato: contenido/lecciones11/GUIA.md (§11). La distancia de trabajo asegurada es Sa = 0,81·Sn·k (lista del libro y
# ejemplo del M18); el ejercicio 31.3 da el M12. Las electroválvulas se ven como lógica: la monoestable sigue a su bobina
# y la biestable es una memoria (un cerrojo de dos NOR).
leccion: cap55/sec-55.2

libro:
  23: "Los sensores de un automatismo casi nunca miden: detectan"
  25: "el único que se admite sin más en funciones de seguridad si tiene maniobra positiva de apertura"
  27: "hasta 0,81·Sn"
  28: "Con aluminio, en el peor caso, 4,05 × 0,35 = 1,42 mm"
  29: "Los fotoeléctricos pueden ser de barrera"
  31: "marrón al positivo, azul al negativo, negro a la salida"
  32: "El PNP conmuta el positivo"
  35: "es una memoria neumática"
  "cap55#138": "Un inductivo M12 no enrasado tiene Sn = 4 mm"
  "cap55#44": "Detector de dos hilos con una resistencia Rp"

modelo:
  valores:
    S_n: { sim: "S_{n}", nombre: "distancia nominal", unidad: m, valor: 0.005 }
    k_m: { sim: "k", nombre: "factor del material", unidad: "", valor: 1 }
    d_m: { sim: "d", nombre: "distancia de montaje", unidad: m, valor: 0.002 }
  calculos:
    S_a: { expr: "0.81*S_n*k_m", sim: "S_{a}", nombre: "distancia de trabajo asegurada", unidad: m }

tarjetas:
  - id: explore-distancia
    tipo: explorar
    titulo: "Lo que alcanza un inductivo"
    texto: "La distancia asegurada es 0,81 · S_{n} · k. Cambie el material y mire si llega a la pieza, montada a 2 mm."
    libro: [27, 28]
    widget:
      tipo: grafica
      x: { id: kx, min: 0.2, max: 1, unidad: "", rotulo: "k (material)" }
      y: { min: 0, max: 0.008, unidad: m, rotulo: "S_{a}" }
      curvas:
        - { expr: "0.81*S_n*kx", color: azul, rotulo: "S_{a}" }
        - { expr: "d_m", color: tinta, rotulo: "Montaje", discontinua: true }
      marcas:
        - { x: "k_m", y: "S_a", rotulo: "Su pieza" }
      lectura: { valor: S_a, rotulo: "Distancia asegurada" }
      mandos:
        - { valor: k_m, min: 0.25, max: 1, paso: 0.05, rotulo: "Factor del material" }
        - { valor: S_n, lista: [0.004, 0.005, 0.008], nombres: [M12 no enrasado, M18 enrasado, M18 no enrasado], rotulo: "Detector" }
    requiere: { mover: [k_m] }

  - id: prediga-aluminio
    tipo: predecir
    titulo: "Aluminio a 2 mm"
    texto: "Un M18 enrasado (S_{n} = 5 mm), montado a 2 mm de piezas de aluminio, con k = 0,35 en el peor caso. ¿Las detectará?"
    libro: [28]
    fijar: { S_n: 0.005, k_m: 0.35, d_m: 0.002 }
    widget:
      tipo: grafica
      x: { id: kx, min: 0.2, max: 1, unidad: "", rotulo: "k (material)" }
      y: { min: 0, max: 0.008, unidad: m, rotulo: "S_{a}" }
      curvas:
        - { expr: "0.81*S_n*kx", color: azul, rotulo: "S_{a}" }
        - { expr: "d_m", color: tinta, rotulo: "Montaje", discontinua: true }
      lectura: { valor: S_a, rotulo: "Distancia asegurada" }
      ocultar: true
    opciones:
      - { texto: "Unos ejemplares sí y otros no", bien: true, porque: "S_{a} = 4,05 × 0,35 = 1,42 mm, menos que los 2 mm del montaje: no está asegurado." }
      - { texto: "Sí: 5 mm sobran", porque: "5 mm es la nominal con acero dulce. La asegurada es 0,81 veces esa, y el aluminio la multiplica por 0,35." }
      - { texto: "Nunca: el inductivo no ve el aluminio", porque: "Detecta cualquier metal, pero a menos distancia: el factor del aluminio va de 0,35 a 0,5." }
    escalera: ["Calcule 0,81 · S_{n} y multiplique por el factor del material."]
    solucion: "0,81 × 5 × 0,35 = 1,42 mm: menos que 2 mm, la detección no está asegurada."
    comprobar:
      - { S_a: 0.00142 }

  - id: reto-detector
    tipo: reto
    titulo: "Elija el detector"
    texto: "Las piezas siguen siendo de aluminio en el peor caso, a 2 mm. Elija un M18 que las detecte siempre."
    libro: [28]
    fijar: { k_m: 0.35, d_m: 0.002 }
    inicio: { S_n: 0.005 }
    widget:
      tipo: grafica
      x: { id: kx, min: 0.2, max: 1, unidad: "", rotulo: "k (material)" }
      y: { min: 0, max: 0.008, unidad: m, rotulo: "S_{a}" }
      curvas:
        - { expr: "0.81*S_n*kx", color: azul, rotulo: "S_{a}" }
        - { expr: "d_m", color: tinta, rotulo: "Montaje", discontinua: true }
      marcas:
        - { x: "k_m", y: "S_a", rotulo: "Aluminio" }
      lectura: { valor: S_a, rotulo: "Distancia asegurada" }
      mandos:
        - { valor: S_n, lista: [0.004, 0.005, 0.008], nombres: [M12 no enrasado, M18 enrasado, M18 no enrasado], rotulo: "Detector" }
    condiciones:
      - { valor: S_a, min: 0.002, rotulo: "Asegurada: {{S_a}}" }
    exito: "El no enrasado da 2,27 mm y resuelve el problema, a cambio de pedir espacio libre de metal alrededor."
    pistas:
      - { cuando: { valor: S_a, menor: 0.002 }, texto: "No llega a los 2 mm: hace falta un detector de más distancia nominal." }
    escalera: ["El no enrasado del mismo tamaño tiene S_{n} = 8 mm."]
    solucion: "M18 no enrasado: 0,81 × 8 × 0,35 = 2,27 mm."
    comprobar:
      - { con: { S_n: 0.008 }, S_a: 0.00227 }

  - id: estime-inoxidable
    tipo: pregunta
    fase: "Estime"
    titulo: "Un M12 con inoxidable"
    texto: "Un M12 no enrasado tiene S_{n} = 4 mm. ¿Qué distancia asegura con acero inoxidable de factor 0,7?"
    libro: ["cap55#138"]
    fijar: { S_n: 0.004, k_m: 0.7 }
    estimar:
      objetivo: "S_a"
      unidad: m
      min: 0
      max: 0.004
      paso: 0.00001
      inicio: 0.0035
      tol: 0.03
      rotulo: "Distancia asegurada"
    exito: "2,27 mm: a 2 mm la detecta, con poco margen pero seguro."
    pistas:
      - { cuando: { valor: estimacion, mayor: 0.00234 }, texto: "Se ha pasado: no olvide el 0,81 de la distancia asegurada." }
      - { texto: "Se ha quedado corto: 0,81 × 4 mm son 3,24 mm, y el inoxidable las multiplica por 0,7." }
    escalera: ["Primero 0,81 × 4 mm; después, por el factor."]
    solucion: "0,81 × 4 = 3,24 mm; × 0,7 = 2,27 mm."
    comprobar:
      - { S_a: 0.00227 }

  - id: pregunta-laton
    tipo: pregunta
    titulo: "El mismo M12 con latón"
    texto: "El M12 (S_{n} = 4 mm) a 2 mm de piezas de latón, de factor 0,4, asegura 1,30 mm. ¿Qué se hace?"
    libro: ["cap55#138"]
    fijar: { S_n: 0.004, k_m: 0.4, d_m: 0.002 }
    widget:
      tipo: grafica
      x: { id: kx, min: 0.2, max: 1, unidad: "", rotulo: "k (material)" }
      y: { min: 0, max: 0.008, unidad: m, rotulo: "S_{a}" }
      curvas:
        - { expr: "0.81*S_n*kx", color: azul, rotulo: "S_{a}" }
        - { expr: "d_m", color: tinta, rotulo: "Montaje", discontinua: true }
      marcas:
        - { x: "k_m", y: "S_a", rotulo: "Latón" }
      lectura: { valor: S_a, rotulo: "Distancia asegurada" }
    opciones:
      - { texto: "Acercarlo a 1 mm, o usar uno mayor o de factor 1", bien: true, porque: "1,30 mm es menos que 2 mm: hay que montarlo más cerca o cambiar de detector." }
      - { texto: "Dejarlo: detecta la mayoría", porque: "Unos ejemplares la verán y otros no: la distancia asegurada es la que se usa para diseñar." }
      - { texto: "Subir la tensión del detector", porque: "La distancia asegurada ya cuenta un 10 % de variación con la tensión: no se gana así." }
    escalera: ["Compare 1,30 mm con el montaje."]
    solucion: "1,30 mm < 2 mm: acercarlo a 1 mm o cambiar de detector."
    comprobar:
      - { S_a: 0.0013 }

  - id: empareje-detectores
    tipo: pregunta
    fase: "Empareje"
    titulo: "Otros detectores"
    texto: "Una cada detector con lo que lo distingue."
    libro: [29]
    emparejar:
      - ["Capacitivo", "Ve plásticos y líquidos, pero le afectan la humedad y la suciedad"]
      - ["Fotoeléctrico de barrera", "Emisor y receptor enfrentados: el de más alcance"]
      - ["Fotoeléctrico réflex", "Contra un reflector, con luz polarizada"]
      - ["Fotoeléctrico difuso", "La luz vuelve de la pieza: depende de su color"]
    exito: "Y el inductivo, solo metales, sin contacto ni desgaste."
    pistas:
      - { texto: "El de menos alcance es el que no tiene ni receptor enfrente ni reflector." }
    escalera: ["La luz polarizada evita confundir una pieza brillante con el reflector."]
    solucion: "Capacitivo, cualquier material; barrera, más alcance; réflex, reflector polarizado; difuso, la propia pieza."

  - id: pregunta-pnp
    tipo: pregunta
    titulo: "El hilo negro"
    texto: "Un detector PNP de tres hilos detecta una pieza. ¿Qué hace su hilo negro?"
    libro: [31, 32, "cap55#44"]
    widget:
      tipo: figura
      figura: fig-55.3
      zonas:
        - { id: pnp, rotulo: "Detector de la izquierda", rect: [25, 38, 48, 58] }
        - { id: npn, rotulo: "Detector del centro", rect: [178, 38, 48, 58] }
    opciones:
      - { texto: "Pone 24 V y entrega corriente a una carga que va a 0 V", bien: true, porque: "El PNP conmuta el positivo: es una fuente de corriente. En Europa se usa casi siempre." }
      - { texto: "Lo une a 0 V y absorbe la corriente de la carga", porque: "Eso hace el NPN, que conmuta el negativo." }
      - { texto: "Lo lleva al azul", porque: "El azul es el negativo; el negro es la salida, que el PNP lleva al positivo." }
    escalera: ["P de positivo: ¿qué conmuta?"]
    solucion: "Lleva el negro a +24 V: entrega corriente a la carga."

  - id: explore-valvulas
    tipo: explorar
    titulo: "Válvulas con y sin memoria"
    texto: "Arriba, una 5/2 monoestable; abajo, una biestable. Mande cada una y después quite toda la tensión."
    libro: [35]
    widget:
      tipo: logica
      entradas: [{ id: Y1, rotulo: "Bobina monoestable" }, { id: A, rotulo: "Bobina avance" }, { id: R, rotulo: "Bobina retroceso" }]
      piezas:
        - { id: mono, tipo: buf, entradas: [Y1], rotulo: "Muelle" }
        - { id: q, tipo: nor, entradas: [R, nq] }
        - { id: nq, tipo: nor, entradas: [A, q] }
      salidas:
        - { id: C1, de: mono, rotulo: "Cilindro 1 fuera" }
        - { id: C2, de: q, rotulo: "Cilindro 2 fuera" }
    requiere: { mover: [Y1, A] }

  - id: porque-valvula
    tipo: porque
    titulo: "Una decisión de seguridad"
    texto: "¿Por qué elegir entre monoestable, biestable o 5/3 de centro cerrado es una decisión de seguridad?"
    libro: [35]
    widget:
      tipo: logica
      entradas: [{ id: Y1, rotulo: "Bobina monoestable" }, { id: A, rotulo: "Bobina avance" }, { id: R, rotulo: "Bobina retroceso" }]
      piezas:
        - { id: mono, tipo: buf, entradas: [Y1], rotulo: "Muelle" }
        - { id: q, tipo: nor, entradas: [R, nq] }
        - { id: nq, tipo: nor, entradas: [A, q] }
      salidas:
        - { id: C1, de: mono, rotulo: "Cilindro 1 fuera" }
        - { id: C2, de: q, rotulo: "Cilindro 2 fuera" }
    opciones:
      - { texto: "Porque fija qué hace la máquina si falla la energía", bien: true, porque: "Sin tensión, la monoestable vuelve al reposo, la biestable se queda donde estaba y la 5/3 bloquea el cilindro." }
      - { texto: "Porque la biestable consume más", porque: "Las bobinas de 24 V gastan de 1 a 5 W; lo que cambia es qué pasa sin tensión." }
      - { texto: "Porque la monoestable es más rápida", porque: "La velocidad no es lo que decide: es la posición del cilindro cuando falta la energía." }
    escalera: ["Quite la tensión en el circuito: ¿qué cilindro se queda fuera?"]
    solucion: "La válvula decide la posición del cilindro sin energía: eso es seguridad."

  - id: pregunta-final-carrera
    tipo: pregunta
    titulo: "El final de carrera"
    texto: "¿Qué permite usar un final de carrera sin más en una función de seguridad?"
    libro: [25]
    widget:
      tipo: logica
      entradas: [{ id: E, rotulo: "Actuador empujado" }]
      piezas:
        - { id: nc, tipo: not, entradas: [E], rotulo: "Contacto cerrado" }
      salidas:
        - { id: C, de: nc, rotulo: "Circuito cerrado" }
    opciones:
      - { texto: "La maniobra positiva: el actuador abre el contacto por empuje directo, aunque esté soldado", bien: true, porque: "Sin muelles intermedios, el contacto cerrado se separa aunque se haya soldado." }
      - { texto: "Que no necesite tocar la pieza", porque: "Al revés: tocar la pieza es uno de sus inconvenientes." }
      - { texto: "Que no tenga rebotes", porque: "Los tiene, como cualquier contacto; lo que lo hace seguro es la maniobra positiva." }
    escalera: ["Busque la flecha dentro de un círculo."]
    solucion: "La maniobra positiva de apertura (IEC 60947-5-1)."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [23, 27, 32, 35]
    ideas:
      - { titulo: "Detectan, no miden.", texto: "Dan un 1 o un 0 según haya pieza o no." }
      - { titulo: "Distancia asegurada.", texto: "0,81 · S_{n} por el factor del material: es la que se usa para diseñar." }
      - { titulo: "PNP y válvulas.", texto: "En Europa, PNP; y la válvula decide qué hace el cilindro sin energía." }
