# Lección de la sección 31.8 «Autómata o Microcontrolador» (cap55; etiqueta interna sec-55.8).
# Formato: contenido/lecciones11/GUIA.md (§11). Sección corta, de criterio: la tabla del libro y su regla (autómata para
# máquinas que se hacen por unidades y se mantienen veinte años; microcontrolador para series, microsegundos o consumo).
# Los dibujos son las figuras 31.4 (el bucle que comparten) y 31.3 (las E/S de 24 V del autómata).
# 1.2.1 («aprender haciendo», GUIA §13): el bucle común se toca en orden en la figura 31.4; lo que en una placa propia
# es trabajo de quien la diseña (la entrada aislada) se toca en la figura 31.3; la respuesta de un autómata con el
# ciclo más corto se calcula y se escribe (filtro de 3 ms y ciclo de 1 ms, de la sección 31.4). Sección de criterio:
# se queda en 3 de 5 tarjetas haciendo, con una pregunta de opciones y un emparejamiento de casos.
leccion: cap55/sec-55.8

libro:
  116: "leer entradas, ejecutar un programa en bucle y escribir salidas"
  117: "Repuestos y herramientas durante décadas"
  118: "deben mantenerse veinte años y las tocará alguien que no las diseñó"
  "cap55#52": "Un autómata no ejecuta su programa cuando cambia una entrada"
  "cap55#44": "Cableado de entradas a 24 V"
  "cap55#54": "va de un milisegundo a unas decenas"
  "cap55#56": 't_("e") + 2 dot.op T_("c") + t_("s")'

modelo:
  valores:
    T_c: { sim: "T_{c}", nombre: "tiempo de ciclo", unidad: s, valor: 0.001 }
    t_e: { sim: "t_{e}", nombre: "retardo del filtro de entrada", unidad: s, valor: 0.003 }
  calculos:
    t_max: { expr: "t_e + 2*T_c", sim: "t_{r,máx}", nombre: "respuesta máxima con salida de transistor", unidad: s }

tarjetas:
  - id: explore-bucle
    tipo: tocar
    titulo: "Lo mismo en lo esencial"
    texto: "Un autómata compacto y un Arduino hacen lo mismo en lo esencial. Toque los tres pasos de su bucle en el orden del autómata."
    libro: [116, "cap55#52"]
    widget:
      tipo: figura
      figura: fig-55.4
      zonas:
        - { id: escribir, rotulo: "Primer recuadro", rect: [12, 9, 85, 37] }
        - { id: leer, rotulo: "Segundo recuadro", rect: [12, 43, 85, 37] }
        - { id: ejecutar, rotulo: "Tercer recuadro", rect: [12, 77, 85, 37] }
        - { id: comunicar, rotulo: "Cuarto recuadro", rect: [12, 111, 85, 37] }
    tocar:
      bien: [escribir, leer, ejecutar]
      orden: true
      porque:
        comunicar: "Eso lo hace entre vueltas; el bucle esencial son los otros tres."
    exito: "Escribir salidas, leer entradas y ejecutar: la diferencia entre los dos está en todo lo demás."
    escalera: ["Empieza escribiendo lo que calculó la vuelta anterior."]
    solucion: "Escribir salidas, leer entradas y ejecutar el programa."

  - id: toque-aislada
    tipo: tocar
    titulo: "Trabajo propio"
    texto: "En una placa propia, protecciones, aislamiento y ensayos son trabajo de quien la diseña. Toque lo que en un autómata ya viene ensayado para el armario."
    libro: [117, "cap55#44"]
    widget:
      tipo: figura
      figura: fig-55.3
      zonas:
        - { id: pnp, rotulo: "Detector de la izquierda", rect: [25, 38, 48, 58] }
        - { id: entrada, rotulo: "Recuadro de la izquierda", rect: [110, 62, 42, 74] }
    tocar:
      bien: [entrada]
      porque:
        pnp: "El detector es el mismo con un autómata o con una placa: lo que cambia es quién lo recibe."
    exito: "La entrada de 24 V, aislada por optoacoplador y protegida, ensayada según la IEC 61131-2. Con un microcontrolador, ese circuito lo diseña y lo ensaya usted."
    escalera: ["Busque el módulo del autómata, no lo que se le conecta."]
    solucion: "El recuadro del autómata: su entrada aislada."

  - id: lea-ciclo
    tipo: explorar
    titulo: "Milisegundos"
    texto: "El tiempo de ciclo de un autómata va de un milisegundo a unas decenas. Con filtro de 3 ms y salida de transistor, consiga la respuesta máxima más corta posible."
    libro: [118, "cap55#54", "cap55#56"]
    inicio: { T_c: 0.01 }
    widget:
      tipo: grafica
      x: { id: tc, min: 0.001, max: 0.02, unidad: s, rotulo: "T_{c}" }
      y: { min: 0, max: 0.05, unidad: s, rotulo: "t_{r,máx}" }
      curvas:
        - { expr: "t_e + 2*tc", color: azul, rotulo: "respuesta máxima" }
      asas:
        - { mueve: T_c, x: "T_c", y: "t_max", rotulo: "Su ciclo" }
      lectura: { valor: t_max, rotulo: "Respuesta máxima" }
      mandos:
        - { valor: T_c, lista: [0.001, 0.005, 0.01, 0.02], rotulo: "Tiempo de ciclo" }
    objetivo:
      condiciones:
        - { valor: t_max, max: 0.005, rotulo: "Respuesta máxima: {{t_max}}" }
      logrado: "Con {{T_c}} de ciclo, {{t_max}}: milisegundos, incluso en el mejor caso. Si hacen falta microsegundos o un consumo mínimo, un microcontrolador."
      pistas:
        - { texto: "Aún se puede bajar el ciclo." }
    escalera: ["t_{r,máx} = t_{e} + 2 · T_{c}."]
    solucion: "1 ms de ciclo: 3 + 2 × 1 = 5 ms."
    comprobar:
      - { con: { T_c: 0.001 }, t_max: 0.005 }

  - id: empareje-casos
    tipo: pregunta
    fase: "Empareje"
    titulo: "Cada caso, su elección"
    texto: "Una cada caso con lo que conviene."
    libro: [117, 118]
    emparejar:
      - ["Una estación de montaje única, que mantendrán otros veinte años", "Autómata"]
      - ["Un aparato que se fabricará por miles", "Microcontrolador: manda el coste por unidad"]
      - ["Un control de microsegundos con consumo mínimo", "Microcontrolador con control total del hardware"]
      - ["Practicar los ejemplos con pulsadores y LED", "Autómata por software en una Raspberry Pi"]
    exito: "Autómata para máquinas por unidades; microcontrolador para series, microsegundos o consumo; y entre los dos, los autómatas por software."
    pistas:
      - { texto: "Si la máquina es única, el coste por unidad pesa poco frente a la ingeniería." }
    escalera: ["En una serie, la ingeniería se reparte entre todas las unidades."]
    solucion: "Autómata, microcontrolador, microcontrolador y autómata por software."

  - id: porque-legible
    tipo: porque
    titulo: "Quien no lo diseñó"
    texto: "¿Por qué pesa tanto que el programa del autómata sea IEC 61131-3 y modificable en marcha?"
    libro: [117, 118]
    widget:
      tipo: figura
      figura: fig-55.4
      zonas:
        - { id: ejecutar, rotulo: "Tercer paso", rect: [12, 77, 85, 37] }
    opciones:
      - { texto: "Porque la máquina la mantendrá durante años alguien que no la diseñó", bien: true, porque: "Un técnico lo lee y lo cambia; un programa en C lo lee bien quien lo escribió." }
      - { texto: "Porque se ejecuta más deprisa", porque: "Al contrario: el microcontrolador es el rápido; la ventaja es quién puede mantenerlo." }
      - { texto: "Porque ocupa menos memoria", porque: "La memoria no es lo que decide: lo que pesa es el mantenimiento durante veinte años." }
    escalera: ["¿Quién tocará la máquina dentro de diez años?"]
    solucion: "La mantendrá otro, durante años: tiene que poder leer y cambiar el programa."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [116, 117, 118]
    ideas:
      - { titulo: "El mismo bucle.", texto: "Leer, ejecutar y escribir: la diferencia está en todo lo demás." }
      - { titulo: "Autómata.", texto: "Máquinas por unidades, veinte años de vida, mantenidas por otros." }
      - { titulo: "Microcontrolador.", texto: "Series, microsegundos o consumo mínimo." }
