# Lección 1.2 de la sección 31.8 «Autómata o Microcontrolador» (cap55; etiqueta interna sec-55.8).
# Formato: contenido/lecciones11/GUIA.md (§11). Sección corta, de criterio: la tabla del libro y su regla (autómata para
# máquinas que se hacen por unidades y se mantienen veinte años; microcontrolador para series, microsegundos o consumo).
# Los dibujos son las figuras 31.4 (el bucle que comparten) y 31.3 (las E/S de 24 V del autómata).
leccion: cap55/sec-55.8

libro:
  116: "leer entradas, ejecutar un programa en bucle y escribir salidas"
  117: "Repuestos y herramientas durante décadas"
  118: "deben mantenerse veinte años y las tocará alguien que no las diseñó"
  "cap55#52": "Un autómata no ejecuta su programa cuando cambia una entrada"

modelo:
  valores: {}
  calculos: {}

tarjetas:
  - id: explore-bucle
    tipo: explorar
    titulo: "Lo mismo en lo esencial"
    texto: "Un autómata compacto y un Arduino leen entradas, ejecutan un programa en bucle y escriben salidas. Toque los pasos."
    libro: [116, "cap55#52"]
    widget:
      tipo: figura
      figura: fig-55.4
      zonas:
        - { id: escribir, rotulo: "Primer paso", rect: [12, 9, 85, 37], texto: "Escribir salidas: en el autómata, módulos de 24 V aislados y protegidos." }
        - { id: leer, rotulo: "Segundo paso", rect: [12, 43, 85, 37], texto: "Leer entradas: en una placa propia, el aislamiento y las protecciones son trabajo de quien la diseña." }
        - { id: ejecutar, rotulo: "Tercer paso", rect: [12, 77, 85, 37], texto: "Ejecutar: en el autómata, IEC 61131-3; en el microcontrolador, C o C++." }
    requiere: { mover: [leer, ejecutar] }

  - id: empareje-automata
    tipo: pregunta
    fase: "Empareje"
    titulo: "Lo que aporta el autómata"
    texto: "Una cada aspecto con lo que ofrece el autómata frente a una placa propia."
    libro: [117]
    emparejar:
      - ["Entorno", "Ensayado para el armario, E/S de 24 V aisladas"]
      - ["Programa", "Legible por mantenimiento y modificable en marcha"]
      - ["Vida", "Repuestos y herramientas durante décadas"]
      - ["Seguridad", "Autómatas y relés de seguridad certificados"]
    exito: "A cambio, es caro por unidad y lento: ciclo de milisegundos."
    pistas:
      - { texto: "Certificar una función propia es un proyecto en sí: eso está del lado de la placa." }
    escalera: ["Piense en quién toca la máquina después de quien la diseñó."]
    solucion: "Entorno ensayado, programa legible, décadas de repuestos y seguridad certificada."

  - id: pregunta-maquina
    tipo: pregunta
    titulo: "Una máquina única"
    texto: "Una estación de montaje se hace una vez, debe mantenerse veinte años y la tocarán técnicos que no la diseñaron. ¿Qué lleva?"
    libro: [118]
    widget:
      tipo: figura
      figura: fig-55.3
      zonas:
        - { id: entrada, rotulo: "Entrada de la izquierda", rect: [110, 62, 42, 74] }
    opciones:
      - { texto: "Un autómata", bien: true, porque: "Se hace por unidades: el coste por unidad pesa poco frente a la ingeniería, y lo mantiene otro." }
      - { texto: "Un microcontrolador en placa propia", porque: "Abarata cada unidad, pero aquí hay una sola; y en C solo lo lee bien quien lo escribió." }
    escalera: ["¿Pesa más el coste de cada unidad o el de la ingeniería?"]
    solucion: "Un autómata: máquina por unidades, larga vida y mantenimiento por otros."

  - id: pregunta-serie
    tipo: pregunta
    titulo: "Un producto de serie"
    texto: "Un aparato se fabricará por miles y cada euro por unidad cuenta. ¿Qué conviene?"
    libro: [117, 118]
    widget:
      tipo: figura
      figura: fig-55.4
      zonas:
        - { id: ejecutar, rotulo: "Tercer paso", rect: [12, 77, 85, 37] }
    opciones:
      - { texto: "Un microcontrolador", bien: true, porque: "En una serie manda el coste por unidad; la ingeniería se reparte entre todas." }
      - { texto: "Un autómata compacto", porque: "Es alto por unidad: multiplicado por miles, pierde frente a una placa propia." }
    escalera: ["Bajo por unidad, alto en ingeniería: ¿cuándo compensa?"]
    solucion: "Un microcontrolador: manda el coste por unidad."

  - id: pregunta-tiempos
    tipo: pregunta
    titulo: "Microsegundos"
    texto: "Un control debe reaccionar en microsegundos con un consumo mínimo. ¿Qué elige?"
    libro: [117, 118]
    widget:
      tipo: figura
      figura: fig-55.4
      zonas:
        - { id: peor, rotulo: "Abajo en el centro", rect: [110, 84, 225, 44] }
    opciones:
      - { texto: "Un microcontrolador, con control total del hardware", bien: true, porque: "El autómata trabaja con ciclos de milisegundos; el microcontrolador, en microsegundos." }
      - { texto: "Un autómata con una tarea rápida", porque: "Las tareas rápidas ayudan, pero el autómata sigue en milisegundos y no busca un consumo mínimo." }
    escalera: ["Compare el ciclo de un autómata con lo que se pide."]
    solucion: "Un microcontrolador: microsegundos y consumo mínimo."

  - id: porque-legible
    tipo: porque
    titulo: "Quien no lo diseñó"
    texto: "¿Por qué pesa tanto que el programa del autómata sea IEC 61131-3 y modificable en marcha?"
    libro: [117, 118]
    widget:
      tipo: figura
      figura: fig-55.4
      zonas:
        - { id: ejecutar, rotulo: "Tercer paso", rect: [12, 77, 85, 37] }
    opciones:
      - { texto: "Porque la máquina la mantendrá durante años alguien que no la diseñó", bien: true, porque: "Un técnico lo lee y lo cambia; un programa en C lo lee bien quien lo escribió." }
      - { texto: "Porque se ejecuta más deprisa", porque: "Al contrario: el microcontrolador es el rápido; la ventaja es quién puede mantenerlo." }
      - { texto: "Porque ocupa menos memoria", porque: "La memoria no es lo que decide: lo que pesa es el mantenimiento durante veinte años." }
    escalera: ["¿Quién tocará la máquina dentro de diez años?"]
    solucion: "La mantendrá otro, durante años: tiene que poder leer y cambiar el programa."

  - id: pregunta-software
    tipo: pregunta
    titulo: "Entre los dos"
    texto: "¿Qué es un autómata por software?"
    libro: [118]
    widget:
      tipo: figura
      figura: fig-55.4
      zonas:
        - { id: escribir, rotulo: "Primer paso", rect: [12, 9, 85, 37] }
    opciones:
      - { texto: "Un entorno IEC 61131-3 que corre en un ordenador industrial", bien: true, porque: "Hay entornos libres que corren en una Raspberry Pi: sirven para practicar con pulsadores y LED." }
      - { texto: "Un simulador que no controla nada", porque: "Controla de verdad: es el mismo ciclo, en otro hardware." }
      - { texto: "Un Arduino programado en LD", porque: "Es un entorno IEC 61131-3 completo sobre un ordenador, no un microcontrolador." }
    escalera: ["Piense en la norma de los lenguajes, sin el hardware del armario."]
    solucion: "Un entorno IEC 61131-3 sobre un ordenador industrial, o una Raspberry Pi."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [116, 117, 118]
    ideas:
      - { titulo: "El mismo bucle.", texto: "Leer, ejecutar y escribir: la diferencia está en todo lo demás." }
      - { titulo: "Autómata.", texto: "Máquinas por unidades, veinte años de vida, mantenidas por otros." }
      - { titulo: "Microcontrolador.", texto: "Series, microsegundos o consumo mínimo." }
