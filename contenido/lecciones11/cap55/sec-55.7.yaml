# Lección de la sección 31.7 «Seguridad de Máquinas: la Parada de Emergencia» (cap55; etiqueta interna sec-55.7).
# Formato: contenido/lecciones11/GUIA.md (§11). Los dos contactores en serie en la fuerza son una Y: con uno soldado
# (una entrada fija a 1) el otro sigue cortando, y el bucle de realimentación impide rearmar.
# 1.2.1 («aprender haciendo», GUIA §13): en la figura 31.7 se tocan los dos canales, la salida que solo informa al
# autómata y el bucle que descubre un contactor soldado; el contactor soldado se busca con la sonda. Sección de normas
# de seguridad: se queda en 4 de 7 tarjetas haciendo, con una pregunta de opciones (el rearme) y un emparejamiento
# (las categorías de parada). La exploración de los contactores en serie queda sin objetivo (petición abierta).
leccion: cap55/sec-55.7

libro:
  104: "La seguridad de una máquina no se añade al final"
  107: "Rearmarla no pone la máquina en marcha"
  108: "la 2, una parada controlada sin corte de energía, que no sirve como parada de emergencia"
  110: "Si un contactor se ha soldado, el relé no rearma"
  111: "dos contactores en serie en la fuerza"
  113: "3, de dos canales, en la que un fallo no hace perder la función"
  114: "Un paro, por bien cableado que esté, no es una parada de emergencia"

modelo:
  valores: {}
  calculos: {}

tarjetas:
  - id: explore-rele
    tipo: tocar
    titulo: "El relé de seguridad"
    texto: "El relé lee la seta por dos canales y detecta un cruce entre ellos o que uno no abra. Toque los dos canales."
    libro: [107, 110, 111]
    widget:
      tipo: figura
      figura: fig-55.7
      zonas:
        - { id: seta, rotulo: "A la izquierda", rect: [32, 46, 26, 32] }
        - { id: canal1, rotulo: "Contacto de arriba", rect: [60, 52, 48, 32] }
        - { id: canal2, rotulo: "Contacto de abajo", rect: [80, 96, 34, 34] }
        - { id: salidas, rotulo: "Contactos dentro del relé", rect: [160, 42, 60, 36] }
        - { id: bucle, rotulo: "Abajo en el centro", rect: [140, 152, 72, 34] }
        - { id: automata, rotulo: "Salida a la derecha", rect: [205, 120, 72, 28] }
        - { id: bobinas, rotulo: "Abajo a la derecha", rect: [246, 138, 64, 30] }
    tocar:
      bien: [canal1, canal2]
      todas: true
      porque:
        seta: "Es la seta S5: roja, enclavada al pulsarla. Sus dos contactos son los canales."
        salidas: "Son las salidas del relé, 13-14 y 23-24: alimentan los contactores."
        bucle: "Es el bucle de realimentación Y1-Y2, con los contactos espejo y el rearme."
        automata: "Es el 41-42, que solo informa al autómata."
        bobinas: "Son KM1 y KM2, los contactores de la fuerza."
    exito: "S11-S12 y S21-S22: dos contactos de maniobra positiva de la misma seta. Si uno no abre, el relé lo detecta."
    escalera: ["Busque los dos contactos que salen de la seta."]
    solucion: "El contacto de arriba y el de abajo, S11-S12 y S21-S22."

  - id: explore-serie
    tipo: explorar
    titulo: "Dos contactores en serie"
    texto: "Los contactos de KM1 y KM2 están en serie en la fuerza: el motor solo gira con los dos cerrados. Párelo con la seta."
    libro: [111]
    widget:
      tipo: logica
      entradas: [{ id: SEG, valor: 1, rotulo: "Seta sin pulsar" }]
      piezas:
        - { id: km1, tipo: buf, entradas: [SEG], rotulo: "KM1" }
        - { id: km2, tipo: buf, entradas: [SEG], rotulo: "KM2" }
        - { id: fuerza, tipo: and, entradas: [km1, km2], rotulo: "Fuerza en serie" }
      salidas:
        - { id: M, de: fuerza, rotulo: "Motor" }
    objetivo:
      condiciones:
        - { led: M, valor: 0, rotulo: "Motor parado" }
      logrado: "La seta abre los dos contactores: con uno solo que abra, la fuerza ya queda cortada."
      pistas:
        - { texto: "Pulse la seta." }
    escalera: ["Dos contactos en serie: basta uno abierto."]
    solucion: "Pulsar la seta."

  - id: prediga-soldado
    tipo: averia
    titulo: "Un contactor soldado"
    texto: "Uno de los dos contactores tiene los contactos soldados. Pulse la seta, mida con la sonda y diga cuál."
    libro: [110, 111, 113]
    widget:
      tipo: logica
      entradas: [{ id: SEG, valor: 1, rotulo: "Seta sin pulsar" }]
      piezas:
        - { id: km1, tipo: buf, entradas: [SEG], rotulo: "KM1" }
        - { id: km2, tipo: buf, entradas: [SEG], rotulo: "KM2" }
        - { id: fuerza, tipo: and, entradas: [km1, km2], rotulo: "Fuerza en serie" }
      salidas:
        - { id: M, de: fuerza, rotulo: "Motor" }
    averia:
      eleccion: fija
      sospechosos:
        - { id: km1, rotulo: "KM1" }
        - { id: km2, rotulo: "KM2" }
      fallos:
        - { id: km1-soldado, pieza: km1, tipo: atascada-1, texto: "KM1 está soldado: sigue cerrado con la seta pulsada. El motor se para igual, porque KM2 abre." }
        - { id: km2-soldado, pieza: km2, tipo: atascada-1, texto: "KM2 está soldado: sigue cerrado con la seta pulsada. KM1, en serie, corta el motor." }
    exito: "Un fallo no hace perder la función: el otro contactor corta. Y el relé no rearma, porque el contacto espejo del soldado sigue abierto. Es la estructura de categoría 3 o 4."
    escalera:
      - "Con la seta pulsada, los dos deberían abrir: mida la salida de cada uno."
    solucion: "Con la seta pulsada, la sonda marca 1 a la salida de KM1: está soldado."

  - id: porque-automata
    tipo: tocar
    titulo: "Fuera del autómata"
    texto: "La parada de emergencia corta por hardware y el autómata solo se entera, por una entrada. Toque el contacto por el que se entera."
    libro: [110]
    widget:
      tipo: figura
      figura: fig-55.7
      zonas:
        - { id: seta, rotulo: "A la izquierda", rect: [32, 46, 26, 32] }
        - { id: canal1, rotulo: "Contacto de arriba", rect: [60, 52, 48, 32] }
        - { id: canal2, rotulo: "Contacto de abajo", rect: [80, 96, 34, 34] }
        - { id: salidas, rotulo: "Contactos dentro del relé", rect: [160, 42, 60, 36] }
        - { id: bucle, rotulo: "Abajo en el centro", rect: [140, 152, 72, 34] }
        - { id: automata, rotulo: "Salida a la derecha", rect: [205, 120, 72, 28] }
        - { id: bobinas, rotulo: "Abajo a la derecha", rect: [246, 138, 64, 30] }
    tocar:
      bien: [automata]
      porque:
        seta: "La seta pide la parada al relé, no al autómata."
        canal1: "Es un canal de la seta hacia el relé."
        canal2: "Es el otro canal de la seta hacia el relé."
        salidas: "Esas alimentan los contactores: son las que cortan."
        bucle: "El bucle vigila los contactores para el rearme."
        bobinas: "Son los contactores que cortan la fuerza."
    exito: "El 41-42. Un autómata normal no es un equipo de seguridad: una CPU bloqueada, un transistor en corto o un error de programa dejarían la emergencia sin efecto."
    escalera: ["Busque la salida del relé que no va a ningún contactor."]
    solucion: "La salida a la derecha, el 41-42."

  - id: empareje-paradas
    tipo: pregunta
    fase: "Empareje"
    titulo: "Categorías de parada"
    texto: "Una cada categoría de parada de la IEC 60204-1 con lo que hace."
    libro: [108]
    emparejar:
      - ["Categoría 0", "Corta de inmediato la energía de los accionadores"]
      - ["Categoría 1", "Frena con energía y la corta al detenerse"]
      - ["Categoría 2", "Para sin cortar la energía: no vale para emergencia"]
    exito: "La parada de emergencia es de categoría 0 o 1."
    pistas:
      - { texto: "Un variador que frena con una rampa y luego desconecta es la del medio." }
    escalera: ["La 0 es la parada no controlada."]
    solucion: "0, corte inmediato; 1, controlada y corte; 2, controlada sin corte."

  - id: pregunta-rearme
    tipo: porque
    titulo: "Rearmar la seta"
    texto: "La seta, pulsada y enclavada, se rearma a mano. ¿Qué hace la máquina?"
    libro: [104, 107, 114]
    widget:
      tipo: figura
      figura: fig-55.7
      zonas:
        - { id: seta, rotulo: "A la izquierda", rect: [32, 46, 26, 32] }
    opciones:
      - { texto: "Nada: solo permite volver a arrancarla con la marcha normal", bien: true, porque: "Rearmar no pone la máquina en marcha." }
      - { texto: "Vuelve a arrancar donde se quedó", porque: "Sería peligroso: quien rearma puede no ver a quien está junto a la máquina." }
      - { texto: "Arranca a velocidad reducida", porque: "No arranca de ninguna forma: espera la marcha normal." }
    escalera: ["Rearmar y arrancar son dos acciones distintas."]
    solucion: "Nada; hay que pulsar la marcha."
    exito: "Y la emergencia solo sirve a quien ve el peligro: para los demás están los resguardos con enclavamiento y las barreras fotoeléctricas, según la evaluación de riesgos."

  - id: toque-soldado
    tipo: tocar
    titulo: "Quién descubre el contacto soldado"
    texto: "Si un contactor se suelda, el relé no rearma. Toque la parte del circuito que lo descubre."
    libro: [110]
    widget:
      tipo: figura
      figura: fig-55.7
      zonas:
        - { id: seta, rotulo: "A la izquierda", rect: [32, 46, 26, 32] }
        - { id: salidas, rotulo: "Contactos dentro del relé", rect: [160, 42, 60, 36] }
        - { id: bucle, rotulo: "Abajo en el centro", rect: [140, 152, 72, 34] }
        - { id: automata, rotulo: "Salida a la derecha", rect: [205, 120, 72, 28] }
    tocar:
      bien: [bucle]
      porque:
        seta: "La seta pide la parada; no sabe nada de los contactores."
        salidas: "Son las salidas del relé, de contactos guiados: vigilan sus propios relés, no los contactores."
        automata: "Ese contacto solo informa al autómata, que no forma parte de la seguridad."
    exito: "El bucle Y1-Y2: los contactos espejo no pueden estar cerrados si un principal lo está."
    escalera: ["Busque los auxiliares de KM1 y KM2 en serie con el rearme."]
    solucion: "El bucle de realimentación Y1-Y2."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [107, 110, 113]
    ideas:
      - { titulo: "Por hardware.", texto: "La emergencia corta contactores y válvulas; el autómata solo se entera." }
      - { titulo: "Redundancia.", texto: "Dos canales, dos contactores en serie y un bucle que descubre el soldado." }
      - { titulo: "Rearmar no arranca.", texto: "Solo permite volver a arrancar con la marcha normal." }
