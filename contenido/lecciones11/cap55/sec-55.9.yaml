# Lección de la sección 31.9 «Problemas de Diseño» (cap55; etiqueta interna sec-55.9): el problema 31.A, la
# estación de marcado. Formato: contenido/lecciones11/GUIA.md (§11). La divergencia en O tras la etapa 4 son las dos
# transiciones del programa en ST (T41 y T40) como puertas: su tabla muestra que nunca valen 1 a la vez. El ciclo, la
# producción y el recorrido tras B1 son los del cálculo del libro (transistor de 0,1 ms, contactor de 15 ms al abrir).
# 1.2.1 («aprender haciendo», GUIA §13): las etapas se tocan en orden en la figura 31.8; en el programa ST del libro se
# tocan la transición que espera el flanco y la línea que vuelve a la etapa 0 tras la emergencia; la divergencia se
# rellena; el ciclo, la producción y el recorrido máximo se escriben; la dispersión se baja con el tiempo de ciclo.
# Quedan dos preguntas de opciones (receptividades excluyentes y el cable del paro) y un emparejamiento (E/S).
leccion: cap55/sec-55.9

libro:
  123: "lleva piezas de 40 mm a 0,2 m/s, separadas unos 250 mm"
  126: "%IX0.0 S0 (paro, cerrado: vale 1 sin pulsar)"
  127: "el flanco y no el nivel, porque al volver a la etapa 1 la pieza recién marcada sigue delante del detector"
  129: "T41 := X4 AND B11 AND NOT FIN;  T40 := X4 AND B11 AND FIN;"
  130: "el cilindro tarda 0,4 s en bajar y 0,3 s en subir"
  131: "1 043"
  132: "de 3 + 10 + 0,1 + 15 = 28,1 ms a 38,1 ms"
  133: "así que al rearmar no se mueve nada hasta pulsar marcha"
  135: "Soltar el cable de S0 con la estación en marcha: debe terminar la pieza y pararse arriba"
  136: "2 mm de dispersión en la parada"
  "cap55#94": "varias transiciones franqueables a la vez se franquean a la vez"
  128: "con el método de la sección 31.6"
  137: "La estación de marcado del problema"

modelo:
  valores:
    v_c: { sim: "v", nombre: "velocidad de la cinta", unidad: "m/s", valor: 0.2 }
    L_p: { sim: "L", nombre: "separación entre piezas", unidad: m, valor: 0.25 }
    t_b: { sim: "t_{baja}", nombre: "bajada del cilindro", unidad: s, valor: 0.4 }
    t_m: { sim: "t_{marca}", nombre: "marcado", unidad: s, valor: 1.5 }
    t_u: { sim: "t_{sube}", nombre: "subida del cilindro", unidad: s, valor: 0.3 }
    T_c: { sim: "T_{c}", nombre: "tiempo de ciclo", unidad: s, valor: 0.01 }
    t_e: { sim: "t_{e}", nombre: "filtro de entrada", unidad: s, valor: 0.003 }
    t_s: { sim: "t_{s}", nombre: "salida de transistor", unidad: s, valor: 0.0001 }
    t_k: { sim: "t_{KM1}", nombre: "apertura del contactor", unidad: s, valor: 0.015 }
    h_s: { sim: "h", nombre: "segundos en una hora", unidad: s, valor: 3600 }
  calculos:
    T_p: { expr: "L_p/v_c + t_b + t_m + t_u", sim: "T_{pieza}", nombre: "tiempo de ciclo por pieza", unidad: s }
    N_h: { expr: "h_s/T_p", sim: "N", nombre: "producción", unidad: "piezas/h", cifras: 4 }
    x_1: { expr: "v_c*(t_e + T_c + t_s + t_k)", sim: "x_{mín}", nombre: "recorrido mínimo tras B1", unidad: m }
    x_2: { expr: "v_c*(t_e + 2*T_c + t_s + t_k)", sim: "x_{máx}", nombre: "recorrido máximo tras B1", unidad: m }
    d_x: { expr: "v_c*T_c", sim: "Δx", nombre: "dispersión de la parada", unidad: m }

tarjetas:
  - id: explore-estacion
    tipo: tocar
    titulo: "La estación de marcado"
    texto: "Una pieza, desde la marcha hasta que se cuenta. Toque las etapas del GRAFCET en el orden en que se recorren."
    libro: [123, 127, 137]
    widget:
      tipo: figura
      figura: fig-55.8
      zonas:
        - { id: e0, rotulo: "Etapa de arriba", rect: [55, 12, 90, 37] }
        - { id: e1, rotulo: "Segunda etapa", rect: [55, 52, 70, 37] }
        - { id: e23, rotulo: "Etapas centrales", rect: [55, 96, 55, 60] }
        - { id: e4, rotulo: "Etapa de abajo", rect: [55, 166, 85, 37] }
    tocar:
      bien: [e0, e1, e23, e4]
      orden: true
    exito: "Espera la marcha; mueve la cinta hasta ↑B1; baja el cilindro y marca 1,5 s; lo sube y cuenta la pieza. Luego, una divergencia en O: a la 1 o a la 0."
    escalera: ["La etapa inicial espera la marcha con el cilindro arriba."]
    solucion: "Etapa de arriba, segunda, centrales y la de abajo."

  - id: empareje-es
    tipo: pregunta
    fase: "Empareje"
    titulo: "La lista de E/S"
    texto: "Una cada dirección del autómata con lo que lleva conectado."
    libro: [126]
    emparejar:
      - ["%IX0.0", "S0, el paro: vale 1 sin pulsar"]
      - ["%IX0.2", "B1: pieza en posición"]
      - ["%IX0.5", "SEG: 1 si la emergencia está rearmada"]
      - ["%QX0.0", "KM1, la cinta"]
      - ["%QX0.1", "1Y1, la válvula del cilindro"]
    exito: "Seis entradas y tres salidas, en lógica positiva y con entradas de tipo 3."
    pistas:
      - { texto: "Las direcciones con Q son salidas." }
    escalera: ["%IX es una entrada; %QX, una salida."]
    solucion: "%IX0.0 S0, %IX0.2 B1, %IX0.5 SEG, %QX0.0 KM1, %QX0.1 1Y1."

  - id: pregunta-flanco
    tipo: tocar
    titulo: "↑B1 y no B1"
    texto: "La etapa 1 mueve la cinta hasta ↑B1, el flanco de subida del detector. Toque, en el programa, la línea con la transición que lo espera."
    libro: [127, 128, 129]
    widget:
      tipo: figura
      # (the book's listing, block 129, cut to the lines that matter and split so that it reads on a phone)
      codigo:
        lenguaje: st
        texto: |-
          IF FIRST_SCAN OR NOT SEG THEN     (* 1. initialisation *)
              X0 := TRUE; X1 := FALSE; X2 := FALSE;
              X3 := FALSE; X4 := FALSE;
          END_IF;
          FB1(CLK := B1);
          PARO(S := NOT S0, R1 := X0);
          FIN := C1.Q OR PARO.Q1;
          T01 := X0 AND S1 AND B11 AND SEG;  (* 2. transitions *)
          T12 := X1 AND FB1.Q;
          T41 := X4 AND B11 AND NOT FIN;
          T40 := X4 AND B11 AND FIN;
          (* 3. evolution: first off, then on *)
          T3(IN := X3, PT := T#1.5s);        (* 4. actions *)
          KM1 := X1;  Y1 := X2 OR X3;
      zonas:
        - { id: l1, lineas: [1], rotulo: "Primera línea" }
        - { id: l4, lineas: [5], rotulo: "Quinta línea" }
        - { id: l5, lineas: [9], rotulo: "Novena línea" }
        - { id: l7, lineas: [10, 11], rotulo: "Líneas diez y once" }
        - { id: l17, lineas: [13], rotulo: "Línea trece" }
    tocar:
      bien: [l5]
      porque:
        l1: "Esa es la inicialización: en la primera vuelta o sin SEG."
        l4: "Ahí se calcula el flanco con FB1; la transición que lo usa viene después."
        l7: "Esas son las dos transiciones que salen de la etapa 4."
        l17: "Esa arranca el temporizador del marcado: es una acción."
    exito: "T12 := X1 AND FB1.Q: el flanco y no el nivel, porque al volver a la etapa 1 la pieza recién marcada sigue delante de B1. Con el nivel, la cinta no arrancaría."
    escalera: ["Busque la transición de la etapa 1 a la 2."]
    solucion: "La novena línea: T12 := X1 AND FB1.Q."

  - id: tabla-divergencia
    tipo: tabla
    titulo: "Las dos salidas de la etapa 4"
    texto: "T41 vuelve a la etapa 1 y T40 a la 0, como en el programa. Rellene las dos columnas."
    libro: [129]
    widget:
      tipo: logica
      entradas: [{ id: X4, rotulo: "X4" }, { id: B11, rotulo: "1B1 (arriba)" }, { id: FIN, rotulo: "FIN" }]
      piezas:
        - { id: nf, tipo: not, entradas: [FIN] }
        - { id: t41, tipo: and, entradas: [X4, B11, nf], rotulo: "T41" }
        - { id: t40, tipo: and, entradas: [X4, B11, FIN], rotulo: "T40" }
      salidas:
        - { id: T41, de: t41 }
        - { id: T40, de: t40 }
      ocultar: true
    tabla:
      salidas: [T41, T40]
    exito: "Nunca valen 1 a la vez: la receptividad de una lleva FIN y la de la otra su negación."
    escalera:
      - "Las dos necesitan X4 = 1 y el cilindro arriba."
      - "Con esas dos a 1, FIN decide cuál."
    solucion: "Solo valen 1 con X4 = 1 y 1B1 = 1: T41 sin FIN, T40 con FIN."

  - id: porque-excluyentes
    tipo: porque
    titulo: "¿Por qué excluyentes?"
    texto: "¿Qué pasaría si las dos receptividades tras la etapa 4 pudieran valer 1 a la vez?"
    libro: [127, "cap55#94"]
    widget:
      tipo: figura
      figura: fig-55.8
      zonas:
        - { id: div, rotulo: "Bifurcación final", rect: [10, 200, 150, 37] }
    opciones:
      - { texto: "Se franquearían las dos: se activarían a la vez la etapa 1 y la 0", bien: true, porque: "Las transiciones franqueables a la vez se franquean a la vez: la estación seguiría y se pararía al mismo tiempo." }
      - { texto: "Ganaría la de la izquierda", porque: "Eso admite el SFC; el GRAFCET franquea las dos." }
      - { texto: "No pasaría nada: el contador decide", porque: "El contador solo entra en FIN; si las dos se cumplen, se franquean las dos." }
    escalera: ["Mire la regla de los franqueos simultáneos."]
    solucion: "Las dos etapas a la vez: por eso una lleva FIN y la otra su negación."

  - id: estime-ciclo
    tipo: leer
    titulo: "El ciclo por pieza"
    texto: "Transporte de 250 mm a 0,2 m/s, bajada de 0,4 s, marcado de 1,5 s y subida de 0,3 s. Calcule cuánto dura cada pieza y escríbalo."
    libro: [123, 130, 131]
    widget:
      tipo: figura
      figura: fig-55.8
      zonas:
        - { id: e0, rotulo: "Etapa de arriba", rect: [55, 12, 90, 37] }
        - { id: e1, rotulo: "Segunda etapa", rect: [55, 52, 70, 37] }
        - { id: e23, rotulo: "Etapas centrales", rect: [55, 96, 55, 60] }
        - { id: e4, rotulo: "Etapa de abajo", rect: [55, 166, 85, 37] }
    leer:
      objetivo: T_p
      unidad: s
      tol: 0.01
      rotulo: "Ciclo por pieza"
      errores:
        - { expr: "t_b + t_m + t_u", texto: "Falta el transporte: 250 mm a 0,2 m/s son 1,25 s." }
    exito: "{{T_p}}; la simulación da 3,47 s, porque suma lecturas, el contactor y una vuelta del temporizador."
    escalera: ["El transporte: 250 mm a 0,2 m/s son 1,25 s."]
    solucion: "1,25 + 0,4 + 1,5 + 0,3 = 3,45 s."
    comprobar:
      - { T_p: 3.45 }

  - id: estime-produccion
    tipo: leer
    titulo: "Piezas por hora"
    texto: "Con ese ciclo por pieza, calcule cuántas piezas marca la estación en una hora y escríbalo."
    libro: [131]
    widget:
      tipo: figura
      figura: fig-55.8
      zonas:
        - { id: e0, rotulo: "Etapa de arriba", rect: [55, 12, 90, 37] }
        - { id: e1, rotulo: "Segunda etapa", rect: [55, 52, 70, 37] }
        - { id: e23, rotulo: "Etapas centrales", rect: [55, 96, 55, 60] }
        - { id: e4, rotulo: "Etapa de abajo", rect: [55, 166, 85, 37] }
    leer:
      objetivo: N_h
      unidad: "piezas/h"
      tol: 0.005
      rotulo: "Producción"
    exito: "{{N_h}}; la simulación, 1 036."
    escalera: ["3 600 s entre el ciclo por pieza."]
    solucion: "3 600/3,45 = 1 043 piezas por hora."
    comprobar:
      - { N_h: 1043.5, h_s: 3600, tol: 0.001 }

  - id: explore-recorrido
    tipo: explorar
    titulo: "Dónde se para la pieza"
    texto: "Tras llegar a B1, la pieza recorre la velocidad por la cadena de respuesta y el contactor. Baje el ciclo hasta que la dispersión quede por debajo de medio milímetro."
    libro: [132]
    inicio: { T_c: 0.01 }
    widget:
      tipo: grafica
      x: { id: xr, min: 0, max: 0.012, unidad: m, rotulo: "recorrido" }
      y: { min: 0, max: 1.2, unidad: "", rotulo: "reparto" }
      curvas:
        - { expr: "ceil((xr - x_1)/1e9)*(1 - ceil((xr - x_2)/1e9))", color: azul, rotulo: "Paradas" }
      marcas:
        - { x: "x_1", y: "1", rotulo: "Mínimo" }
        - { x: "x_2", y: "1", rotulo: "Máximo" }
      lectura: { valor: d_x, rotulo: "Dispersión" }
      datos:
        - { valor: x_1, rotulo: "Mínimo: {{x_1}}" }
        - { valor: x_2, rotulo: "Máximo: {{x_2}}" }
      mandos:
        - { valor: T_c, lista: [0.002, 0.005, 0.01], rotulo: "Tiempo de ciclo" }
    objetivo:
      condiciones:
        - { valor: d_x, max: 0.0005, rotulo: "Dispersión: {{d_x}}" }
      logrado: "Con {{T_c}}, {{d_x}}: la dispersión es la velocidad por un ciclo. Lo fijo, el mínimo, se compensa montando B1 antes."
      pistas:
        - { texto: "Aún varía demasiado: un ciclo más corto." }
    escalera: ["Dispersión = v · T_{c}."]
    solucion: "2 ms de ciclo: 0,2 m/s × 2 ms = 0,4 mm."
    comprobar:
      - { con: { T_c: 0.002 }, d_x: 0.0004 }

  - id: prediga-dispersion
    tipo: leer
    titulo: "Con 10 ms de ciclo"
    texto: "Con el ciclo de 10 ms del problema, calcule el recorrido máximo de la pieza tras llegar a B1 y escríbalo."
    libro: [132, 136]
    fijar: { T_c: 0.01 }
    widget:
      tipo: grafica
      x: { id: xr, min: 0, max: 0.012, unidad: m, rotulo: "recorrido" }
      y: { min: 0, max: 1.2, unidad: "", rotulo: "reparto" }
      curvas:
        - { expr: "ceil((xr - x_1)/1e9)*(1 - ceil((xr - x_2)/1e9))", color: azul, rotulo: "Paradas" }
      mandos: []
    leer:
      objetivo: x_2
      unidad: m
      tol: 0.02
      rotulo: "Recorrido máximo"
      errores:
        - { expr: "x_1", texto: "Ese es el mínimo, con un solo ciclo. En el peor caso son dos." }
        - { expr: "v_c*(t_e + 2*T_c + t_s)", texto: "Falta el contactor: tarda 15 ms en abrir, y la cinta sigue mientras." }
    exito: "{{x_2}}, y el mínimo {{x_1}}: 2 mm de dispersión. B1 se monta 6,6 mm antes y la pieza se para a ±1,0 mm."
    escalera: ["v · (t_{e} + 2 · T_{c} + t_{s} + t_{KM1})."]
    solucion: "0,2 m/s × 38,1 ms = 7,62 mm."
    comprobar:
      - { d_x: 0.002, x_1: 0.00562, x_2: 0.00762 }

  - id: pregunta-paro
    tipo: porque
    titulo: "El paro con la estación en marcha"
    texto: "Con la estación marcando, se suelta el cable de S0. ¿Qué debe hacer?"
    libro: [126, 135]
    widget:
      tipo: figura
      figura: fig-55.8
      zonas:
        - { id: e4, rotulo: "Etapa de abajo", rect: [55, 166, 85, 37] }
    opciones:
      - { texto: "Terminar la pieza y pararse con el cilindro arriba", bien: true, porque: "Un cable suelto es como pulsar el paro: PARO se recuerda y la divergencia lleva a la etapa 0 tras la etapa 4." }
      - { texto: "Pararse al instante, a mitad de marcado", porque: "Eso haría la emergencia. El paro termina el ciclo en curso." }
      - { texto: "Seguir: el paro no está pulsado", porque: "S0 está cableado cerrado: un cable suelto pone su entrada a 0, como pulsarlo." }
    escalera: ["¿Cuánto vale %IX0.0 con el cable suelto?"]
    solucion: "Termina la pieza y se para arriba, en la etapa 0."

  - id: pregunta-emergencia
    tipo: tocar
    titulo: "Tras la emergencia"
    texto: "La seta corta KM1 y 1Y1; el autómata ve SEG a 0. Toque la línea del programa que lleva el GRAFCET a la etapa 0."
    libro: [129, 133]
    widget:
      tipo: figura
      # (the book's listing, block 129, cut to the lines that matter and split so that it reads on a phone)
      codigo:
        lenguaje: st
        texto: |-
          IF FIRST_SCAN OR NOT SEG THEN     (* 1. initialisation *)
              X0 := TRUE; X1 := FALSE; X2 := FALSE;
              X3 := FALSE; X4 := FALSE;
          END_IF;
          FB1(CLK := B1);
          PARO(S := NOT S0, R1 := X0);
          FIN := C1.Q OR PARO.Q1;
          T01 := X0 AND S1 AND B11 AND SEG;  (* 2. transitions *)
          T12 := X1 AND FB1.Q;
          T41 := X4 AND B11 AND NOT FIN;
          T40 := X4 AND B11 AND FIN;
          (* 3. evolution: first off, then on *)
          T3(IN := X3, PT := T#1.5s);        (* 4. actions *)
          KM1 := X1;  Y1 := X2 OR X3;
      zonas:
        - { id: l1, lineas: [1], rotulo: "Primera línea" }
        - { id: l4, lineas: [5], rotulo: "Quinta línea" }
        - { id: l5, lineas: [9], rotulo: "Novena línea" }
        - { id: l7, lineas: [10, 11], rotulo: "Líneas diez y once" }
        - { id: l17, lineas: [13], rotulo: "Línea trece" }
    tocar:
      bien: [l1]
      porque:
        l4: "Ahí se calculan el flanco de B1 y el biestable del paro."
        l5: "Esas son transiciones: no fuerzan ninguna etapa."
        l7: "Esas deciden entre la etapa 1 y la 0 tras la 4, solo en marcha normal."
        l17: "Esa es una acción: el temporizador del marcado."
    exito: "IF FIRST_SCAN OR NOT SEG: la inicialización se repite tras la emergencia. Al rearmar no se mueve nada hasta pulsar marcha."
    escalera: ["Busque dónde aparece SEG negada."]
    solucion: "La primera línea: la inicialización."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [127, 131, 132, 136]
    ideas:
      - { titulo: "De la especificación al programa.", texto: "E/S, un GRAFCET de cinco etapas y su traducción en ST." }
      - { titulo: "Flancos y excluyentes.", texto: "↑B1 para no franquear con la pieza vieja; FIN y su negación en la divergencia." }
      - { titulo: "Los números.", texto: "3,45 s por pieza, unas mil por hora y 2 mm de dispersión en la parada." }
