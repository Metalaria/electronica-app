# Lección de la sección 31.1 «Lógica Cableada: Contactores y el Circuito de Mando» (cap55; etiqueta interna sec-55.1).
# Formato: contenido/lecciones11/GUIA.md (§11). El mando es lógica de Boole escrita con contactos: cada contacto es una
# pieza del circuito lógico (S0 y el 95-96 de F2, cerrados, son inversores de su pulsación) y la autorretención es el lazo
# OR-AND del libro. Los números del arranque estrella-triángulo son los del ejemplo de 11 kW y los del ejercicio 31.2.
# 1.2.1 («aprender haciendo», GUIA §13): el contacto de retención se toca en la figura 31.1; KM1 se dibuja con una
# secuencia de pulsaciones (marcha, paro, los dos a la vez); el mando se repara con la sonda; el ejemplo de 11 kW se
# consigue con los mandos; la estrella del ejercicio 31.2, la corriente de KM1 y el hueco de la pausa se calculan y
# se escriben. Queda una pregunta de opciones (el enclavamiento mecánico). La exploración de la autorretención queda
# sin objetivo hasta que «logica» admita uno.
leccion: cap55/sec-55.1

libro:
  4: "tres contactos principales (bornes 1-2, 3-4 y 5-6)"
  7: "El mando es lógica de Boole (sección 9.1) escrita con contactos"
  8: "Al pulsar S1 la bobina se excita, KM1 cierra su 13-14"
  9: 'overline("S0")'
  10: "Con marcha y paro pulsados a la vez el motor se para"
  12: "Hacen falta los dos"
  14: "toma de seis a ocho veces su corriente nominal"
  15: 'T_("arr,Y") = (T_("arr,Δ"))/(3)'
  16: "toma 147 A en directo y 49 A en estrella"
  17: "In/√3 = 12,12 A"
  18: "Con 50 ms de pausa el hueco es de 43 ms como mínimo"
  "cap55#138": "Escribe la ecuación de un contactor KM1 con autorretención"

modelo:
  valores:
    I_n: { sim: "I_{n}", nombre: "corriente nominal", unidad: A, valor: 21 }
    k_a: { sim: "k", nombre: "veces la nominal al arrancar", unidad: "", valor: 7 }
    t_p: { sim: "t_{pausa}", nombre: "pausa entre KM3 y KM2", unidad: s, valor: 0.05 }
    t_ci: { sim: "t_{cierre}", nombre: "cierre más rápido de KM2", unidad: s, valor: 0.012 }
    t_ab: { sim: "t_{apertura}", nombre: "apertura más lenta de KM3", unidad: s, valor: 0.019 }
  calculos:
    I_d: { expr: "k_a*I_n", sim: "I_{arr,Δ}", nombre: "corriente de arranque en directo", unidad: A }
    I_y: { expr: "k_a*I_n/3", sim: "I_{arr,Y}", nombre: "corriente de arranque en estrella", unidad: A }
    I_km: { expr: "I_n/sqrt(3)", sim: "I_{KM1}", nombre: "corriente de KM1 y KM2", unidad: A }
    h_m: { expr: "t_p + t_ci - t_ab", sim: "hueco", nombre: "hueco mínimo entre contactos", unidad: s }

tarjetas:
  - id: explore-esquemas
    tipo: tocar
    titulo: "Fuerza y mando"
    texto: "En el esquema de mando, toque el contacto que sigue alimentando la bobina cuando se suelta la marcha."
    libro: [4, 7, 8]
    widget:
      tipo: figura
      figura: fig-55.1
      zonas:
        - { id: q1, rotulo: "Fuerza, arriba", rect: [8, 20, 60, 26] }
        - { id: km1-fuerza, rotulo: "Fuerza, en el centro", rect: [8, 52, 60, 28] }
        - { id: f2-fuerza, rotulo: "Fuerza, abajo", rect: [8, 82, 60, 27] }
        - { id: motor, rotulo: "El motor", rect: [30, 116, 40, 38] }
        - { id: paro, rotulo: "Mando, segundo contacto", rect: [150, 61, 58, 28] }
        - { id: s1, rotulo: "Mando, a la izquierda", rect: [150, 92, 52, 28] }
        - { id: retencion, rotulo: "Mando, a la derecha", rect: [208, 92, 50, 28] }
        - { id: bobina, rotulo: "Mando, abajo", rect: [170, 142, 50, 26] }
    tocar:
      bien: [retencion]
      porque:
        q1: "Es Q1, la protección de la fuerza: se encarga del cortocircuito."
        km1-fuerza: "Son los contactos principales de KM1: llevan la corriente del motor, no la del mando."
        f2-fuerza: "Es el relé térmico en la fuerza: protege de la sobrecarga."
        motor: "Es el motor: lo que se gobierna."
        paro: "Es el paro S0: un contacto cerrado que corta la bobina al pulsarlo."
        s1: "Es la marcha S1: al soltarla se abre. Busque el que queda en paralelo con ella."
        bobina: "Es la bobina A1-A2: lo que se alimenta, no lo que la alimenta."
    exito: "El auxiliar 13-14 de KM1, en paralelo con S1: al cerrarse KM1, se retiene a sí mismo. Es la autorretención."
    escalera: ["Busque el contacto dibujado en paralelo con la marcha."]
    solucion: "Mando, a la derecha: el 13-14 de KM1."

  - id: explore-autorretencion
    tipo: explorar
    titulo: "La autorretención"
    texto: "S1 y S0 valen 1 mientras se pulsan. Consiga la bobina KM1 excitada con la marcha, S1, ya soltada."
    nota: "KM1 = (S1 + KM1) · S̄0 · F̄2: un biestable."
    libro: [8, 9]
    widget:
      tipo: logica
      entradas: [{ id: S1, rotulo: "S1 (marcha)" }, { id: S0, rotulo: "S0 (paro)" }, { id: F2, rotulo: "F2 (térmico)" }]
      piezas:
        - { id: c-s0, tipo: not, entradas: [S0], rotulo: "S0, 21-22" }
        - { id: c-f2, tipo: not, entradas: [F2], rotulo: "F2, 95-96" }
        - { id: c-13, tipo: buf, entradas: [km1], rotulo: "KM1, 13-14" }
        - { id: o1, tipo: or, entradas: [S1, c-13] }
        - { id: km1, tipo: and, entradas: [o1, c-s0, c-f2], rotulo: "Bobina KM1" }
      salidas:
        - { id: KM1, de: km1 }
    objetivo:
      condiciones:
        - { led: KM1, valor: 1, rotulo: "KM1 excitada" }
        - { senal: S1, valor: 0, rotulo: "S1 soltada" }
      logrado: "Al soltar S1, el contacto 13-14 de KM1 mantiene la bobina: es la autorretención. Solo S0 o el térmico la sueltan."
      pistas:
        - { cuando: { led: KM1, valor: 0 }, texto: "Pulse la marcha, S1, sin paro ni térmico." }
        - { texto: "Ahora suelte S1." }
    escalera: ["Pulse S1 y suéltelo."]
    solucion: "S1 a 1 y otra vez a 0: KM1 se queda excitada por su propio contacto."

  - id: prediga-prioridad
    tipo: dibujar
    titulo: "Marcha, paro y los dos a la vez"
    texto: "Alguien pulsa la marcha, luego el paro y luego los dos a la vez. Dibuje KM1 tramo a tramo."
    libro: [8, 9, 10]
    widget:
      tipo: logica
      entradas: [{ id: S1, rotulo: "S1 (marcha)" }, { id: S0, rotulo: "S0 (paro)" }, { id: F2, rotulo: "F2 (térmico)" }, { id: CLK, reloj: true }]
      piezas:
        - { id: c-s0, tipo: not, entradas: [S0], rotulo: "S0, 21-22" }
        - { id: c-f2, tipo: not, entradas: [F2], rotulo: "F2, 95-96" }
        - { id: c-13, tipo: buf, entradas: [km1], rotulo: "KM1, 13-14" }
        - { id: o1, tipo: or, entradas: [S1, c-13] }
        - { id: km1, tipo: and, entradas: [o1, c-s0, c-f2], rotulo: "Bobina KM1" }
      salidas:
        - { id: KM1, de: km1 }
      cronograma: { ciclos: 8, estimulo: { S1: "01000110", S0: "00010100" }, senales: [S1, S0] }
      dibujo: false
    dibujar:
      senal: KM1
    exito: "Se retiene al soltar la marcha, cae con el paro y, con los dos pulsados, se queda parado: S̄0 multiplica a todo. Es un mando con prioridad de paro."
    escalera:
      - "KM1 = (S1 + KM1) · S̄0: con S0 pulsado, 0 siempre."
      - "Sin pulsar nada, KM1 conserva lo que tenía."
    solucion: "KM1: 0, 1, 1, 0, 0, 0, 1, 1."

  - id: averia-mando
    tipo: averia
    titulo: "Un mando que falla"
    texto: "Una de las piezas del mando está averiada. Pulse, suelte y mida con la sonda; después diga cuál es."
    libro: [8, 10]
    widget:
      tipo: logica
      entradas: [{ id: S1, rotulo: "S1 (marcha)" }, { id: S0, rotulo: "S0 (paro)" }, { id: F2, rotulo: "F2 (térmico)" }]
      piezas:
        - { id: c-s1, tipo: buf, entradas: [S1], rotulo: "S1, 13-14" }
        - { id: c-s0, tipo: not, entradas: [S0], rotulo: "S0, 21-22" }
        - { id: c-f2, tipo: not, entradas: [F2], rotulo: "F2, 95-96" }
        - { id: c-13, tipo: buf, entradas: [km1], rotulo: "KM1, 13-14" }
        - { id: o1, tipo: or, entradas: [c-s1, c-13] }
        - { id: km1, tipo: and, entradas: [o1, c-s0, c-f2], rotulo: "Bobina KM1" }
      salidas:
        - { id: KM1, de: km1 }
    averia:
      eleccion: fija
      sospechosos:
        - { id: c-s1, rotulo: "La marcha S1" }
        - { id: c-s0, rotulo: "El paro S0" }
        - { id: c-f2, rotulo: "El 95-96 de F2" }
        - { id: c-13, rotulo: "El auxiliar 13-14 de KM1" }
      fallos:
        - { id: retencion-abierta, pieza: c-13, tipo: atascada-0, texto: "El auxiliar 13-14 no cierra: la bobina solo se excita mientras se pulsa S1. Falta la autorretención." }
        - { id: termico-abierto, pieza: c-f2, tipo: atascada-0, texto: "El 95-96 está abierto, como con el térmico disparado: la bobina no se excita nunca." }
        - { id: paro-pegado, pieza: c-s0, tipo: atascada-1, texto: "El contacto del paro no abre: la máquina arranca, pero el paro no la para." }
        - { id: marcha-abierta, pieza: c-s1, tipo: atascada-0, texto: "La marcha no cierra: pulsarla no hace nada, aunque el resto del mando esté bien." }
    exito: "Y el paro es cerrado a propósito: si se rompe su cable o se afloja un borne, la máquina se para en lugar de quedarse sin paro."
    escalera:
      - "Pulse S1, suéltelo y pulse S0: ¿qué parte del comportamiento falta?"
      - "Mida la salida de cada contacto con su pulsador pulsado y sin pulsar."
    solucion: "Compare cada contacto con lo que debe dar: el que no sigue a su pulsador, o a la bobina, es el averiado."

  - id: formula-estrella
    tipo: explorar
    titulo: "Un tercio de corriente y de par"
    texto: "En estrella, la corriente de línea baja a la tercera parte. Ponga el motor de 11 kW del libro: 49 A al arrancar en estrella."
    libro: [14, 15, 16]
    inicio: { I_n: 14.5, k_a: 6.5 }
    widget:
      tipo: grafica
      x: { id: ix, min: 0, max: 30, unidad: A, rotulo: "I_{n}" }
      y: { min: 0, max: 250, unidad: A, rotulo: "I_{arr}" }
      curvas:
        - { expr: "k_a*ix", color: azul, rotulo: "En directo" }
        - { expr: "k_a*ix/3", color: naranja, rotulo: "En estrella" }
      marcas:
        - { x: "I_n", y: "I_d", rotulo: "Directo" }
        - { x: "I_n", y: "I_y", rotulo: "Estrella" }
      lectura: { valor: I_y, rotulo: "Arranque en estrella" }
      datos:
        - { valor: I_d, rotulo: "En directo: {{I_d}}" }
      mandos:
        - { valor: I_n, lista: [14.5, 21], rotulo: "Corriente nominal" }
        - { valor: k_a, lista: [6.5, 7], rotulo: "Múltiplo de arranque" }
    objetivo:
      condiciones:
        - { valor: I_y, objetivo: 49, tol: 0.01, rotulo: "En estrella: {{I_y}}" }
      logrado: "21 A y 7 veces: {{I_d}} en directo y {{I_y}} en estrella, la tercera parte. El par también baja a un tercio."
      pistas:
        - { texto: "Es el motor de 21 A nominales y 7 veces la nominal al arrancar." }
    escalera: ["I_{arr,Y} = I_{arr,Δ}/3."]
    solucion: "21 A y 7 veces: 147 A en directo, 49 A en estrella."
    comprobar:
      - { con: { I_n: 21, k_a: 7 }, I_d: 147, I_y: 49 }

  - id: estime-estrella
    tipo: leer
    titulo: "Un motor de 7,5 kW"
    texto: "Un motor de 14,5 A nominales arranca en directo con 6,5 veces la nominal. Calcule cuánto toma en estrella y escríbalo."
    libro: ["cap55#138"]
    fijar: { I_n: 14.5, k_a: 6.5 }
    widget:
      tipo: grafica
      x: { id: ix, min: 0, max: 30, unidad: A, rotulo: "I_{n}" }
      y: { min: 0, max: 250, unidad: A, rotulo: "I_{arr}" }
      curvas:
        - { expr: "k_a*ix", color: azul, rotulo: "En directo" }
        - { expr: "k_a*ix/3", color: naranja, rotulo: "En estrella" }
      mandos: []
    leer:
      objetivo: I_y
      unidad: A
      tol: 0.02
      rotulo: "Corriente de arranque en estrella"
      errores:
        - { expr: "I_d", texto: "Esa es la de directo. En estrella, la tercera parte." }
        - { expr: "I_d/sqrt(3)", texto: "La corriente de devanado baja en √3, pero la de línea baja a la tercera parte." }
    exito: "{{I_y}}, la tercera parte de los {{I_d}} del directo; y un tercio del par."
    escalera:
      - "Primero el directo: múltiplo de arranque por corriente nominal."
    solucion: "6,5 × 14,5 = 94,25 A en directo; en estrella, 94,25/3 = 31,42 A."
    comprobar:
      - { I_d: 94.25, I_y: 31.42 }

  - id: empareje-contactores
    tipo: leer
    titulo: "Qué lleva KM1"
    texto: "Motor de 21 A nominales en estrella-triángulo: en marcha, KM1 y KM2 llevan la corriente de devanado. Calcúlela y escríbala."
    libro: [17]
    fijar: { I_n: 21, k_a: 7 }
    widget:
      tipo: grafica
      x: { id: ix, min: 0, max: 30, unidad: A, rotulo: "I_{n}" }
      y: { min: 0, max: 250, unidad: A, rotulo: "I_{arr}" }
      curvas:
        - { expr: "k_a*ix", color: azul, rotulo: "En directo" }
        - { expr: "k_a*ix/3", color: naranja, rotulo: "En estrella" }
      mandos: []
    leer:
      objetivo: I_km
      unidad: A
      tol: 0.02
      rotulo: "Corriente de KM1"
      errores:
        - { expr: "I_n", texto: "Esa es la de línea en triángulo. Por cada devanado pasa √3 veces menos." }
        - { expr: "I_n/3", texto: "Esa es la de KM3, que solo trabaja al arrancar: In/3." }
    exito: "{{I_km}}, el 58 % de la nominal: así se eligen KM1 y KM2, y a eso se ajusta el relé térmico tras KM1. KM3 basta para el 33 %."
    escalera: ["Corriente de devanado = I_{n}/√3."]
    solucion: "21/√3 = 12,12 A."
    comprobar:
      - { I_km: 12.12 }

  - id: porque-pausa
    tipo: leer
    titulo: "Una pausa de 50 ms"
    texto: "Se abre KM3, se esperan 50 ms y se cierra KM2, que cierra en 12 ms como poco; KM3 abre en 19 ms como mucho. Escriba el hueco mínimo entre contactos."
    libro: [18]
    widget:
      tipo: grafica
      x: { id: tx, min: 0, max: 0.1, unidad: s, rotulo: "pausa" }
      y: { min: -0.02, max: 0.1, unidad: s, rotulo: "hueco" }
      curvas:
        - { expr: "tx + t_ci - t_ab", color: azul, rotulo: "hueco mínimo" }
      mandos: []
    leer:
      objetivo: h_m
      unidad: s
      tol: 0.02
      rotulo: "Hueco mínimo"
      errores:
        - { expr: "t_p", texto: "La pausa no es el hueco: hay que sumar lo que tarda KM2 en cerrar y restar lo que tarda KM3 en abrir." }
        - { expr: "t_p - t_ci + t_ab", texto: "Ha tomado los tiempos al revés: lo peor es que KM2 cierre pronto y KM3 abra tarde." }
    exito: "{{h_m}}: de sobra para que se separen los contactos de KM3 y se apague su arco, que puede durar 10 ms. Sin pausa, KM2 cerraría sobre un cortocircuito entre fases."
    escalera: ["Hueco = pausa + cierre más rápido de KM2 − apertura más lenta de KM3."]
    solucion: "50 + 12 − 19 = 43 ms."
    comprobar:
      - { h_m: 0.043 }

  - id: pregunta-dos-enclavamientos
    tipo: porque
    titulo: "Eléctrico y mecánico"
    texto: "Los contactores de giro, y KM2 y KM3, llevan un enclavamiento eléctrico y otro mecánico. ¿Contra qué protege el mecánico?"
    libro: [12, 18]
    widget:
      tipo: figura
      figura: fig-55.1
      zonas:
        - { id: q1, rotulo: "Fuerza, arriba", rect: [8, 20, 60, 26] }
        - { id: km1-fuerza, rotulo: "Fuerza, en el centro", rect: [8, 52, 60, 28] }
        - { id: f2-fuerza, rotulo: "Fuerza, abajo", rect: [8, 82, 60, 27] }
        - { id: motor, rotulo: "El motor", rect: [30, 116, 40, 38] }
        - { id: paro, rotulo: "Mando, segundo contacto", rect: [150, 61, 58, 28] }
        - { id: s1, rotulo: "Mando, a la izquierda", rect: [150, 92, 52, 28] }
        - { id: retencion, rotulo: "Mando, a la derecha", rect: [208, 92, 50, 28] }
        - { id: bobina, rotulo: "Mando, abajo", rect: [170, 142, 50, 26] }
    opciones:
      - { texto: "Contra un contactor con los contactos soldados", bien: true, porque: "Soldado, tiene la bobina sin tensión y su auxiliar cerrado: el eléctrico no lo ve." }
      - { texto: "Contra excitar las dos bobinas a la vez", porque: "Eso ya lo cubre el eléctrico: un contacto cerrado de cada contactor en serie con la bobina del otro." }
      - { texto: "Contra un error del programa del autómata", porque: "El enclavamiento por programa se añade a los dos, no los sustituye; el mecánico es otra cosa." }
    escalera: ["¿Qué fallo deja al auxiliar del contactor diciendo lo contrario de lo que pasa?"]
    solucion: "El mecánico cubre el contactor soldado; el eléctrico, la pulsación de los dos."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [7, 9, 10, 15, 18]
    ideas:
      - { titulo: "Contactos y Boole.", texto: "En serie, Y; en paralelo, O; un contacto cerrado, la negación." }
      - { titulo: "Autorretención.", texto: "S1 en paralelo con el 13-14 de KM1 y el paro cerrado en serie: biestable con prioridad de paro." }
      - { titulo: "Estrella-triángulo.", texto: "Un tercio de corriente y de par, enclavamientos y una pausa al cambiar." }
