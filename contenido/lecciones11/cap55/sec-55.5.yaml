# Lección de la sección 31.5 «Los Lenguajes de la Norma IEC 61131-3» (cap55; etiqueta interna sec-55.5).
# Formato: contenido/lecciones11/GUIA.md (§11). La red 1 de la figura 31.5 es el lazo OR-AND del circuito lógico, con
# los contactos como en LD: abiertos = «la variable vale 1». El error clásico (S0 programado con un contacto cerrado) es
# el mismo circuito con un inversor en S0. El intermitente de dos TON usa la ecuación del libro.
# 1.2.1 («aprender haciendo», GUIA §13): el contacto de retención se toca en la figura 31.5 y en el listado ST del
# libro se tocan la autorretención y la instancia del TON; el error del paro cerrado se dibuja (la máquina solo marcha
# con el paro pulsado); el ciclo con el que el intermitente se acerca a 1 s se elige; el de dos TON de 300 ms se
# calcula y se escribe. Quedan una pregunta de opciones (una salida en dos redes) y un emparejamiento (los lenguajes).
leccion: cap55/sec-55.5

libro:
  66: "La norma define cinco lenguajes"
  68: "Contacto abierto -| |-: conduce si la variable vale 1"
  69: "da una máquina que solo arranca con el paro pulsado"
  70: "una salida se escribe en una sola bobina (si aparece en dos redes, gana la última"
  74: "el lenguaje habitual de los autómatas de seguridad"
  75: "La autorretención con arranque retardado 2 s"
  76: "el que se impone en los programas nuevos"
  78: "un TON al que no se llama no se entera de que pasa el tiempo"
  79: "La tercera edición de la norma la declaró obsoleta y la cuarta la ha suprimido"
  81: "El SFC no sirve para escribir operaciones sino para estructurar un programa secuencial"
  85: "el periodo sale de 1 020 ms con Tc = 10 ms, de 1 022 ms con 7 ms y de 1 002 ms con 1 ms"
  86: '2 dot.op ⌈ (P T)/(T_("c")) ⌉'
  87: "las tareas periódicas y las marcas de reloj del autómata"
  "cap55#138": "Un intermitente se programa con dos TON de 300 ms"
  77: "T_ARR(IN := MARCHA, PT := T#2s);"
  83: "Un intermitente se suele programar con dos TON"
  84: "T1(IN := NOT T2.Q, PT := T#500ms);"

modelo:
  valores:
    P_T: { sim: "PT", nombre: "tiempo programado de cada TON", unidad: s, valor: 0.5 }
    T_c: { sim: "T_{c}", nombre: "tiempo de ciclo", unidad: s, valor: 0.01 }
  calculos:
    n_v: { expr: "ceil(P_T/T_c)", sim: "n", nombre: "vueltas de cada TON", unidad: "" }
    T_b: { expr: "2*ceil(P_T/T_c)*T_c + 2*T_c", sim: "T", nombre: "periodo del intermitente", unidad: s }
    e_b: { expr: "100*(T_b - 2*P_T)/(2*P_T)", sim: "error", nombre: "error del periodo", unidad: "%", cifras: 2 }

tarjetas:
  - id: explore-ld-fbd
    tipo: tocar
    titulo: "El mismo programa, dos dibujos"
    texto: "Arriba, la autorretención con arranque retardado en contactos. Toque el contacto que mantiene MARCHA a 1 cuando se suelta S1."
    libro: [68, 74, 75]
    widget:
      tipo: figura
      figura: fig-55.5
      zonas:
        - { id: s1, rotulo: "Primer contacto de la red 1", rect: [40, 16, 28, 28] }
        - { id: retencion, rotulo: "Contacto debajo del primero", rect: [34, 46, 40, 28] }
        - { id: s0, rotulo: "Segundo contacto de la red 1", rect: [84, 16, 28, 28] }
        - { id: bobina, rotulo: "Bobina de la red 1", rect: [254, 18, 32, 28] }
        - { id: ton, rotulo: "Bloque de la red 2", rect: [112, 68, 50, 38] }
        - { id: o-fbd, rotulo: "Primer bloque de abajo", rect: [60, 126, 32, 36] }
        - { id: y-fbd, rotulo: "Segundo bloque de abajo", rect: [117, 126, 30, 52] }
    tocar:
      bien: [retencion]
      porque:
        s1: "Es la marcha S1: al soltarla deja de conducir."
        s0: "Es el paro S0, en serie: corta, no retiene."
        bobina: "Es la bobina MARCHA: la memoria que se escribe, no el contacto que la sostiene."
        ton: "Es el TON de la red 2: retrasa el arranque 2 s."
        o-fbd: "Esa es la O en el dibujo de bloques de abajo; la pregunta es por el contacto de arriba."
        y-fbd: "Esa es la Y de los bloques de abajo; busque el contacto en paralelo con S1."
    exito: "El contacto MARCHA en paralelo con S1. En FBD, los contactos en paralelo son una puerta O y los de serie, una Y."
    escalera: ["Busque el contacto dibujado en paralelo con S1."]
    solucion: "El contacto debajo del primero: MARCHA."

  - id: sorpresa-contacto-cerrado
    tipo: dibujar
    titulo: "Un contacto cerrado para S0"
    texto: "Alguien programó S0, que vale 1 sin pulsar, con un contacto cerrado como el del esquema. Dibuje MARCHA con estas pulsaciones."
    libro: [68, 69]
    widget:
      tipo: logica
      entradas: [{ id: S1, rotulo: "S1 (marcha)" }, { id: S0, rotulo: "S0 (1 sin pulsar)" }, { id: F2, valor: 1, rotulo: "F2 (1 sin disparar)" }, { id: CLK, reloj: true }]
      piezas:
        - { id: c-s0, tipo: not, entradas: [S0], rotulo: "Contacto cerrado" }
        - { id: o1, tipo: or, entradas: [S1, marcha] }
        - { id: marcha, tipo: and, entradas: [o1, c-s0, F2], rotulo: "MARCHA" }
      salidas:
        - { id: M, de: marcha, rotulo: "MARCHA" }
      cronograma: { ciclos: 7, estimulo: { S1: "0100100", S0: "1110001" }, senales: [S1, S0] }
      dibujo: false
    dibujar:
      senal: M
    exito: "Solo marcha con el paro pulsado, y se para al soltarlo. En LD un contacto cerrado conduce si la variable vale 0: el paro, cableado cerrado, se programa con un contacto abierto."
    escalera:
      - "El contacto cerrado de S0 solo conduce cuando S0 vale 0, es decir, pulsado."
    solucion: "MARCHA: 0, 0, 0, 0, 1, 1, 0."

  - id: pregunta-instancia
    tipo: tocar
    titulo: "La figura en texto estructurado"
    texto: "La figura 31.5 en ST. Toque la línea que declara el temporizador como una instancia, con su memoria propia."
    libro: [66, 76, 77, 78]
    widget:
      tipo: figura
      codigo: "cap55#77"
      zonas:
        - { id: l2, lineas: [2], rotulo: "Segunda línea" }
        - { id: l3, lineas: [3], rotulo: "Tercera línea" }
        - { id: l5, lineas: [5], rotulo: "Quinta línea" }
        - { id: l6, lineas: [6], rotulo: "Sexta línea" }
        - { id: l7, lineas: [7], rotulo: "Séptima línea" }
    tocar:
      bien: [l3]
      porque:
        l2: "Esa declara MARCHA, una variable BOOL: la memoria de la autorretención, no un temporizador."
        l5: "Esa es la autorretención: la red 1 escrita en una línea."
        l6: "Esa llama a la instancia, con sus entradas por nombre; se declara antes."
        l7: "Esa lee la salida Q de la instancia."
    exito: "T_ARR : TON. Un bloque de función tiene memoria propia y se declara como instancia, como un objeto. Y hay que llamarlo en cada vuelta: si no, no se entera de que pasa el tiempo."
    escalera: ["Busque la línea con el tipo TON."]
    solucion: "La tercera línea: T_ARR : TON."

  - id: toque-autorretencion
    tipo: tocar
    titulo: "La red 1 en una línea"
    texto: "Toque la línea del mismo programa que hace la autorretención."
    libro: [76, 77]
    widget:
      tipo: figura
      codigo: "cap55#77"
      zonas:
        - { id: l2, lineas: [2], rotulo: "Segunda línea" }
        - { id: l5, lineas: [5], rotulo: "Quinta línea" }
        - { id: l6, lineas: [6], rotulo: "Sexta línea" }
        - { id: l7, lineas: [7], rotulo: "Séptima línea" }
    tocar:
      bien: [l5]
      porque:
        l2: "Esa solo declara MARCHA; no dice cuándo vale 1."
        l6: "Esa arranca el retardo de 2 s con MARCHA."
        l7: "Esa da KM1 cuando acaba el retardo."
    exito: "MARCHA := (S1 OR MARCHA) AND S0 AND F2: la O de S1 con la propia MARCHA, en serie con el paro y el térmico, cableados cerrados."
    escalera: ["Busque la línea en la que MARCHA aparece a los dos lados."]
    solucion: "La quinta línea."

  - id: pregunta-dos-bobinas
    tipo: porque
    titulo: "Una salida en dos redes"
    texto: "La misma salida KM1 aparece en dos bobinas normales, en dos redes. ¿Qué vale?"
    libro: [70]
    widget:
      tipo: figura
      figura: fig-55.5
      zonas:
        - { id: km1, rotulo: "Bobina de la red 2", rect: [254, 70, 32, 28] }
    opciones:
      - { texto: "Lo que diga la última red", bien: true, porque: "Se ejecuta red a red, de arriba abajo: la última escritura gana. Por eso una salida, una sola bobina." }
      - { texto: "La O de las dos redes", porque: "No se combinan: cada bobina escribe la variable, y la segunda pisa a la primera." }
      - { texto: "Lo que diga la primera red", porque: "La primera escribe, pero la segunda vuelve a escribir en la misma vuelta." }
    escalera: ["¿En qué orden se ejecutan las redes?"]
    solucion: "Gana la última; las bobinas S y R son la excepción, pensadas para eso."

  - id: explore-intermitente
    tipo: explorar
    titulo: "Un intermitente de 1 Hz... casi"
    texto: "Dos TON de 500 ms se encienden uno a otro, y solo se actualizan cuando se les llama. Elija el ciclo con el que el periodo se acerca más a 1 s."
    libro: [83, 84, 85, 86]
    fijar: { P_T: 0.5 }
    inicio: { T_c: 0.01 }
    widget:
      tipo: grafica
      x: { id: tx, min: 0.0005, max: 0.012, unidad: s, rotulo: "T_{c}" }
      y: { min: 0.98, max: 1.06, unidad: s, rotulo: "T" }
      curvas:
        - { expr: "2*ceil(P_T/tx)*tx + 2*tx", color: azul, rotulo: "Periodo" }
        - { expr: "2*P_T", color: tinta, rotulo: "Lo pedido", discontinua: true }
      marcas:
        - { x: "T_c", y: "T_b", rotulo: "Su ciclo" }
      lectura: { valor: T_b, rotulo: "Periodo" }
      datos:
        - { valor: e_b, rotulo: "Error: {{e_b}}" }
      mandos:
        - { valor: T_c, lista: [0.001, 0.007, 0.01], rotulo: "Tiempo de ciclo" }
    objetivo:
      condiciones:
        - { valor: T_b, max: 1.005, rotulo: "Periodo: {{T_b}}" }
      logrado: "Con {{T_c}}, {{T_b}}. Cada TON tarda el primer múltiplo de T_{c} que no es menor que PT, y cada reinicio pierde una vuelta: T = 2 · ⌈PT/T_{c}⌉ · T_{c} + 2 · T_{c}."
      pistas:
        - { texto: "Con ese ciclo se pierde demasiado: cada vuelta perdida cuenta un T_{c} entero." }
    escalera: ["Cuanto más corto el ciclo, menos se pierde en cada vuelta."]
    solucion: "Con 1 ms: 1 002 ms."
    comprobar:
      - { T_b: 1.02 }
      - { con: { T_c: 0.007 }, T_b: 1.022 }
      - { con: { T_c: 0.001 }, T_b: 1.002 }

  - id: estime-intermitente
    tipo: leer
    titulo: "Dos TON de 300 ms"
    texto: "Un intermitente con dos TON de 300 ms y un ciclo constante de 8 ms. Calcule su periodo y escríbalo."
    libro: ["cap55#138", 86, 87]
    fijar: { P_T: 0.3, T_c: 0.008 }
    widget:
      tipo: grafica
      x: { id: tx, min: 0.0005, max: 0.012, unidad: s, rotulo: "T_{c}" }
      y: { min: 0.58, max: 0.66, unidad: s, rotulo: "T" }
      curvas:
        - { expr: "2*ceil(P_T/tx)*tx + 2*tx", color: azul, rotulo: "Periodo" }
        - { expr: "2*P_T", color: tinta, rotulo: "Lo pedido", discontinua: true }
      mandos: []
    leer:
      objetivo: T_b
      unidad: s
      tol: 0.003
      rotulo: "Periodo"
      errores:
        - { expr: "2*P_T", texto: "Eso sería con un ciclo infinitamente corto: cada TON tarda un número entero de vueltas." }
        - { expr: "2*ceil(P_T/T_c)*T_c", texto: "Faltan las dos vueltas que se pierden al reiniciar cada TON." }
    exito: "{{T_b}} en vez de 600 ms: un {{e_b}} de error. Para medir tiempo de verdad, el reloj del sistema, una tarea periódica o una marca de reloj."
    escalera:
      - "⌈300/8⌉ = 38 vueltas por TON."
    solucion: "2 × 38 × 8 + 2 × 8 = 624 ms."
    comprobar:
      - { T_b: 0.624, n_v: 38, e_b: 4 }

  - id: empareje-lenguajes
    tipo: pregunta
    fase: "Empareje"
    titulo: "Cinco lenguajes"
    texto: "Una cada lenguaje de la IEC 61131-3 con su papel."
    libro: [66, 74, 76, 79, 81]
    emparejar:
      - ["LD (contactos)", "El esquema de mando girado; el que leen los electricistas"]
      - ["FBD (bloques)", "Circuito de puertas; el de los autómatas de seguridad"]
      - ["ST (texto)", "Alto nivel, de la familia del Pascal; se impone en lo nuevo"]
      - ["IL (lista)", "Tipo ensamblador; obsoleto y suprimido en la cuarta edición"]
      - ["SFC", "Estructura un programa en etapas y transiciones"]
    exito: "Sea cual sea el lenguaje, el programa corre dentro del ciclo de scan."
    pistas:
      - { texto: "Solo uno no escribe operaciones: las organiza." }
    escalera: ["El que tiene IF, CASE y FOR es de alto nivel."]
    solucion: "LD contactos, FBD bloques, ST texto, IL obsoleto, SFC etapas."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [68, 69, 78, 86]
    ideas:
      - { titulo: "Contacto abierto.", texto: "En LD significa «la variable vale 1»; un paro cableado cerrado se programa abierto." }
      - { titulo: "Bloques con memoria.", texto: "Cada TON es una instancia, y hay que llamarlo en cada vuelta." }
      - { titulo: "El ciclo se cuela.", texto: "Un TON tarda un número entero de vueltas: el intermitente sale un poco lento." }
