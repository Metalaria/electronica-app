# Lección de la sección 9.2 «Familias Lógicas y Niveles de Tensión» (cap09). Formato: contenido/lecciones11/GUIA.md.
# 1.2.1 («aprender haciendo», GUIA §13): el umbral de la HC se lleva a 3,5 V moviendo la alimentación; los niveles se
# tocan en la figura 9.2 (dónde cae 2,4 V en una entrada HC, qué familia copia los umbrales TTL, qué entrada de 5 V
# acepta 3,3 V); el umbral a 3,3 V se lee en la gráfica; la entrada en la zona prohibida se marca sobre una rampa lenta
# (de ejemplo, 0 a 5 V en 1 ms). Quedan dos preguntas de opciones: por qué TTL solo existe a 5 V y la tolerancia a 5 V.
leccion: cap09/sec-9.2

libro:
  28: "La respuesta depende de la familia lógica"
  29: "Mezclar familias requiere comprobar que las salidas de una caen en las zonas válidas de la otra"
  30: "existe una zona prohibida entre el nivel alto y el bajo"
  33: "con umbrales garantizados de 0,8 V para bajo y 2,0 V para alto"
  34: "con umbrales al 30 y 70 % (1,5 y 3,5 V a 5 V)"
  35: "de ahí los disparadores de Schmitt en las entradas que reciben señales lentas"
  36: "una salida a 3,3 V ataca sin problema una entrada TTL de 5 V"
  37: "si no lo dice, hay que suponer que no"

modelo:
  valores:
    V_DD: { sim: "V_{DD}", nombre: "alimentación", unidad: V, valor: 5 }
    T_r: { sim: "T", nombre: "duración de la rampa", unidad: s, valor: 0.001 }
  calculos:
    V_IH: { expr: "0.7*V_DD", sim: "V_{IH}", nombre: "umbral alto de entrada", unidad: V }
    V_IL: { expr: "0.3*V_DD", sim: "V_{IL}", nombre: "umbral bajo de entrada", unidad: V }
    t_IL: { expr: "0.3*T_r", sim: "t_{IL}", nombre: "instante en que la rampa cruza V_{IL}", unidad: s }

tarjetas:
  - id: explore-escala
    tipo: explorar
    titulo: "Los umbrales siguen a V_{DD}"
    texto: "Una CMOS HC conmuta al 30 y al 70 % de su alimentación. Arrástrela hasta que el umbral alto valga 3,5 V."
    libro: [28, 34]
    inicio: { V_DD: 3 }
    widget:
      tipo: grafica
      x: { id: vdd, min: 2, max: 6, unidad: V, rotulo: "V_{DD}" }
      y: { min: 0, max: 6, unidad: V, rotulo: "umbral" }
      curvas:
        - { expr: "0.7*vdd", color: azul, rotulo: "V_{IH}, 70 %" }
        - { expr: "0.3*vdd", color: naranja, rotulo: "V_{IL}, 30 %" }
        - { expr: "vdd", color: tinta, rotulo: "V_{DD}", discontinua: true }
      asas:
        - { mueve: V_DD, x: "V_DD", y: "V_IH", rotulo: "Su alimentación" }
      lectura: { valor: V_IH, rotulo: "Umbral alto, V_{IH}" }
      datos:
        - { valor: V_IL, rotulo: "Umbral bajo, V_{IL}: {{V_IL}}" }
      mandos:
        - { valor: V_DD, min: 2, max: 6, paso: 0.1, rotulo: "V_{DD}" }
    objetivo:
      condiciones:
        - { valor: V_IH, objetivo: 3.5, tol: 0.01, rotulo: "V_{IH}: {{V_IH}}" }
      logrado: "Con {{V_DD}}, 3,5 V para un 1 y {{V_IL}} para un 0: los umbrales de la HC a 5 V. Todo escala con la alimentación."
      pistas:
        - { cuando: { valor: V_IH, mayor: 3.5 }, texto: "Se ha pasado: baje la alimentación." }
        - { texto: "Le falta: suba la alimentación." }
    escalera:
      - "V_{IH} = 0,7 · V_{DD}."
    solucion: "V_{DD} = 5 V: 0,7 · 5 = 3,5 V."
    comprobar:
      - { con: { V_DD: 5 }, V_IH: 3.5, V_IL: 1.5 }

  - id: prediga-ttl-en-hc
    tipo: tocar
    titulo: "2,4 V en una entrada HC"
    texto: "Una salida TTL entrega su alto garantizado, 2,4 V, a una entrada CMOS HC a 5 V. En la columna de la HC, toque la franja donde cae."
    libro: [29, 30, 33, 34]
    widget:
      tipo: figura
      figura: fig-9.2
      zonas:
        - { id: alto, rotulo: "Franja de arriba, segunda columna", rect: [161, 54, 40, 53] }
        - { id: prohibida, rotulo: "Franja del medio, segunda columna", rect: [161, 107, 40, 71] }
        - { id: bajo, rotulo: "Franja de abajo, segunda columna", rect: [161, 178, 40, 53] }
    tocar:
      bien: [prohibida]
      porque:
        alto: "El 1 válido de la HC empieza en 3,5 V: 2,4 V no llega. Los 2,0 V son el umbral de una entrada TTL."
        bajo: "El 0 válido de la HC acaba en 1,5 V: 2,4 V lo supera."
    exito: "En la zona prohibida: la entrada no garantiza nada. Mezclar familias exige que las salidas de una caigan en las zonas válidas de la otra."
    escalera:
      - "Compare 2,4 V con los umbrales de la segunda columna, no con los de la primera."
    solucion: "La franja del medio: 2,4 V está entre 1,5 y 3,5 V."

  - id: estime-vih
    tipo: leer
    titulo: "Una HC a 3,3 V"
    texto: "La misma serie HC, alimentada a 3,3 V. Lea en la gráfica desde qué tensión garantiza la entrada un 1 y escríbala."
    libro: [34]
    fijar: { V_DD: 3.3 }
    widget:
      tipo: grafica
      x: { id: vdd, min: 2, max: 6, unidad: V, rotulo: "V_{DD}" }
      y: { min: 0, max: 6, unidad: V, rotulo: "umbral" }
      curvas:
        - { expr: "0.7*vdd", color: azul, rotulo: "V_{IH}, 70 %" }
        - { expr: "0.3*vdd", color: naranja, rotulo: "V_{IL}, 30 %" }
      mandos: []
    leer:
      objetivo: V_IH
      unidad: V
      tol: 0.03
      rotulo: "Umbral alto a 3,3 V"
      errores:
        - { expr: "V_IL", texto: "Ese es el umbral bajo, el 30 %: hasta ahí se garantiza un 0." }
        - { expr: "0.7*5", texto: "Esos 3,5 V son el umbral a 5 V. A 3,3 V baja en proporción." }
    exito: "{{V_IH}}: el 70 % de 3,3 V. Todo escala con la alimentación."
    escalera: ["El umbral alto es el 70 % de V_{DD}: busque la curva azul en 3,3 V."]
    solucion: "0,7 · 3,3 = 2,31 V."
    comprobar:
      - { V_IH: 2.31, V_IL: 0.99 }

  - id: empareje-familias
    tipo: tocar
    titulo: "Umbrales de TTL sin ser TTL"
    texto: "Una de las familias CMOS modernas tiene los mismos umbrales de entrada que TTL, 0,8 y 2,0 V, por diseño. Tóquela."
    libro: [33, 36]
    widget:
      tipo: figura
      figura: fig-9.2
      zonas:
        - { id: ttl, rotulo: "Primera columna", rect: [58, 50, 44, 182] }
        - { id: hc, rotulo: "Segunda columna", rect: [159, 50, 44, 182] }
        - { id: lv33, rotulo: "Tercera columna", rect: [260, 110, 44, 122] }
        - { id: lv18, rotulo: "Cuarta columna", rect: [362, 160, 44, 72] }
    tocar:
      bien: [lv33]
      porque:
        ttl: "Esa es la propia TTL. Busque otra familia con sus mismos umbrales."
        hc: "La HC a 5 V conmuta al 30 y 70 %: 1,5 y 3,5 V."
        lv18: "A 1,8 V los niveles son más pequeños y los márgenes, menores."
    exito: "La LVCMOS a 3,3 V: 0,8 y 2,0 V, compatibles con TTL. La HCT hace lo mismo a 5 V: CMOS con umbrales de entrada TTL."
    escalera:
      - "Busque la columna cuyos números en azul y verde son 2,0 y 0,8, sin contar la primera."
    solucion: "La tercera columna, LVCMOS a 3,3 V."

  - id: pregunta-33-a-5
    tipo: tocar
    titulo: "Una salida de 3,3 V"
    texto: "Una salida a 3,3 V ataca entradas de 5 V. Toque la familia de 5 V que la reconoce como 1 con garantía."
    libro: [33, 34, 36]
    widget:
      tipo: figura
      figura: fig-9.2
      zonas:
        - { id: ttl, rotulo: "Primera columna", rect: [58, 50, 44, 182] }
        - { id: hc, rotulo: "Segunda columna", rect: [159, 50, 44, 182] }
    tocar:
      bien: [ttl]
      porque:
        hc: "La HC a 5 V necesita 3,5 V para garantizar un 1: 3,3 V se queda corto."
    exito: "Solo la TTL: 3,3 V supera los 2,0 V garantizados, pero no los 3,5 V de la HC. El sentido y la familia deciden."
    escalera: ["Compare 3,3 V con los 2,0 V de TTL y los 3,5 V de la HC a 5 V."]
    solucion: "La primera columna, TTL: 3,3 V supera 2,0 V."

  - id: porque-ttl-5v
    tipo: porque
    titulo: "TTL solo a 5 V"
    texto: "Una CMOS funciona a muchas tensiones; una TTL, solo a 5 V. ¿Por qué?"
    libro: [33, 34]
    widget:
      tipo: figura
      figura: fig-9.2
      zonas:
        - { id: ttl, rotulo: "Primera columna", rect: [58, 50, 44, 182], texto: "TTL: conmuta en torno a 1,3 V." }
    opciones:
      - { texto: "Sus niveles salen de los 0,7 V de las uniones, que no escalan", bien: true, porque: "Conmuta en torno a 1,3 V, dos caídas de unión: esos umbrales no siguen a la alimentación." }
      - { texto: "Porque sus MOSFET no conducen con menos tensión", porque: "TTL es bipolar, no lleva MOSFET. Sus niveles los fijan las uniones de los transistores." }
      - { texto: "Por una norma de los fabricantes", porque: "No es un convenio: los niveles salen del circuito de salida y de las uniones de 0,7 V." }
    escalera: ["¿De dónde sale el umbral de 1,3 V de una entrada TTL?"]
    solucion: "Dos caídas de unión de 0,7 V fijan los niveles: no escalan con la alimentación."

  - id: pregunta-schmitt
    tipo: marcar
    titulo: "Una señal lenta"
    texto: "Una rampa lenta sube de 0 a 5 V en {{T_r}} hacia una entrada HC. Marque el instante en que entra en la zona prohibida."
    nota: "Rampa de ejemplo."
    libro: [34, 35]
    widget:
      tipo: grafica
      x: { id: t, min: 0, max: 0.001, unidad: s, rotulo: "t" }
      y: { min: 0, max: 5.5, unidad: V, rotulo: "v" }
      curvas:
        - { expr: "5*t/T_r", color: azul, rotulo: "rampa" }
        - { expr: "V_IL + 0*t", color: naranja, rotulo: "V_{IL}", discontinua: true }
        - { expr: "V_IH + 0*t", color: tinta, rotulo: "V_{IH}", discontinua: true }
      mandos: []
    marcar:
      modo: x
      curva: 0
      x: "t_IL"
      tol: 0.03
      inicio: { x: 0.0008, y: 0 }
      rotulo: "La entrada en la zona prohibida"
      pasos: 100
    pistas:
      - { cuando: { valor: marca_x, mayor: 0.00033 }, texto: "Ahí la rampa ya pasó de 1,5 V: más a la izquierda." }
      - { texto: "Ahí la rampa aún es un 0 válido: más a la derecha, donde cruza 1,5 V." }
    exito: "Desde ahí hasta 3,5 V, los dos transistores de entrada conducen a medias: corriente de cortocircuito y salidas erráticas. Por eso las señales lentas llevan un Schmitt."
    escalera:
      - "La zona prohibida empieza en V_{IL}, 1,5 V a 5 V."
    solucion: "Donde la rampa cruza 1,5 V: a {{t_IL}}."
    comprobar:
      - { t_IL: 0.0003 }

  - id: pregunta-tolerancia
    tipo: pregunta
    titulo: "¿Tolera 5 V?"
    texto: "La hoja de datos de un chip de 3,3 V no dice nada de «5 V tolerant». ¿Qué hay que suponer?"
    libro: [37]
    widget:
      tipo: figura
      figura: fig-9.2
      zonas:
        - { id: lv33, rotulo: "Tercera columna", rect: [260, 110, 44, 122], texto: "LVCMOS a 3,3 V." }
    opciones:
      - { texto: "Que no lo tolera", bien: true, porque: "Si no lo dice, no lo es: un diodo interno a la alimentación conduciría y alimentaría el chip por la entrada." }
      - { texto: "Que lo tolera, porque es lo normal", porque: "Algunas entradas lo admiten y otras no. Sin la mención explícita, hay que suponer que no." }
      - { texto: "Que lo tolera si se pone una resistencia", porque: "La hoja de datos no dice eso; sin la mención, la entrada puede dañarse o alimentar el chip." }
    escalera: ["¿Qué conduce dentro de la entrada cuando le llegan 5 V?"]
    solucion: "Que no: si no lo dice, hay que suponer que no."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [30, 33, 34, 36]
    ideas:
      - { titulo: "Tres zonas.", texto: "Bajo válido, zona prohibida y alto válido: en medio, la puerta no garantiza nada." }
      - { titulo: "TTL.", texto: "Niveles de las uniones: 0,8 y 2,0 V, y solo a 5 V." }
      - { titulo: "CMOS.", texto: "Umbrales al 30 y 70 % de la alimentación: escalan con V_{DD}." }
      - { titulo: "Al mezclar.", texto: "3,3 V ataca una entrada TTL, no una CMOS de 5 V." }
