# Lección de la sección 9.1 «El Álgebra de Boole» (cap09). Formato: contenido/lecciones11/GUIA.md (§11: circuito lógico vivo).
# 1.2.1 («aprender haciendo», GUIA §13): las operaciones se prueban en el circuito vivo y se anotan en su tabla; De
# Morgan se comprueba rellenando dos columnas y construyendo la NAND con OR e inversores y la OR solo con NAND; la suma
# de productos de la XOR se rellena y luego se repara con la sonda lógica; la zona prohibida se toca en la figura 9.2.
# Quedan dos preguntas de opciones: por qué la suma de productos es la XOR y qué ahorra simplificar en una FPGA.
leccion: cap09/sec-9.1

libro:
  4: "Una expresión booleana es simultáneamente una fórmula"
  5: "distinguir diez niveles exigiría márgenes diez veces menores"
  7: "la salida es 1 solo si todas las entradas son 1"
  8: "la salida es 1 si alguna entrada es 1"
  10: "1 + 1 = 1 en Boole, no 2"
  14: "overline(A dot.op B) = overline(A) + overline(B)"
  16: "negar una AND equivale a hacer OR de las negaciones"
  17: "Con NOT y una de las dos se construye la otra"
  18: "en el cajón solo hay NAND, De Morgan da la conversión"
  19: "Una NAND dibujada como OR con las entradas negadas es exactamente el mismo chip"
  22: "Obtener la suma de productos"
  23: "es exactamente la XOR de la sección 9.3"
  24: "la simplificación no ahorra nada"
  26: "se monta la expresión antes de simplificar y después"
  "cap09#199": "Construye la tabla de verdad de la función Y = A·B + C"

modelo:
  valores: {}
  calculos: {}

tarjetas:
  - id: explore-and-or
    tipo: explorar
    titulo: "Dos operaciones vivas"
    texto: "Pruebe los interruptores y encienda la OR con la AND apagada. Fíjese en la última fila de la OR: 1 + 1 = 1."
    libro: [7, 8, 10]
    widget:
      tipo: logica
      entradas: [A, B]
      piezas:
        - { id: y1, tipo: and, entradas: [A, B] }
        - { id: o1, tipo: or, entradas: [A, B] }
      salidas:
        - { id: AND, de: y1, rotulo: "A·B" }
        - { id: OR, de: o1, rotulo: "A+B" }
      tabla: true
    objetivo:
      condiciones:
        - { led: OR, valor: 1, rotulo: "OR encendida" }
        - { led: AND, valor: 0, rotulo: "AND apagada" }
      logrado: "A la OR le basta una entrada encendida; la AND pide las dos."
      pistas:
        - { texto: "Encienda una sola de las dos entradas." }
    escalera: ["La OR se enciende con una entrada; la AND, solo con las dos."]
    solucion: "Una sola entrada encendida, A o B."

  - id: explore-de-morgan
    tipo: tabla
    titulo: "Dos circuitos, una tabla"
    texto: "Arriba, una NAND; abajo, una OR con las entradas negadas. Rellene las dos columnas sin ver los LED."
    libro: [14, 16]
    widget:
      tipo: logica
      entradas: [A, B]
      piezas:
        - { id: n1, tipo: nand, entradas: [A, B] }
        - { id: na, tipo: not, entradas: [A] }
        - { id: nb, tipo: not, entradas: [B] }
        - { id: o1, tipo: or, entradas: [na, nb] }
      salidas:
        - { id: Y1, de: n1, rotulo: "NAND" }
        - { id: Y2, de: o1, rotulo: "OR negada" }
      ocultar: true
    tabla:
      salidas: [Y1, Y2]
    exito: "Las dos columnas son iguales: negar una AND equivale a hacer OR de las negaciones. Es De Morgan."
    escalera:
      - "La NAND es la AND invertida: 0 solo con las dos entradas a 1."
      - "La OR de abajo recibe Ā y B̄: da 0 solo si las dos negaciones son 0."
    solucion: "Las dos columnas: 1, 1, 1, 0."

  - id: pregunta-mismo-chip
    tipo: diseno
    titulo: "La NAND, con OR"
    texto: "Construya Y = (A·B)' solo con OR e inversores. Es el mismo chip dibujado de otra manera."
    libro: [16, 19]
    widget:
      tipo: logica
      entradas: [A, B]
      piezas: []
      salidas:
        - { id: Y, de: "0" }
    diseno:
      salida: Y
      permitidas: [or, not]
      referencia:
        - { tipo: not, entradas: [A] }
        - { tipo: not, entradas: [B] }
        - { tipo: or, entradas: [p1, p2] }
      exigir_minimo: false
    exito: "Una OR con las entradas negadas: por eso los esquemas dibujan la NAND así cuando quieren resaltar que basta una entrada a 0."
    escalera:
      - "De Morgan: (A·B)' = Ā + B̄."
      - "Invierta cada entrada y únalas con la OR."
    solucion: "p1 = NOT(A), p2 = NOT(B) e Y = OR(p1, p2)."

  - id: pregunta-doble-negacion
    tipo: diseno
    titulo: "En el cajón solo hay NAND"
    texto: "El diseño pide Y = A + B y solo tiene puertas NAND. Constrúyala con las menos posibles."
    libro: [17, 18]
    widget:
      tipo: logica
      entradas: [A, B]
      piezas: []
      salidas:
        - { id: Y, de: "0" }
    diseno:
      salida: Y
      permitidas: [nand]
      referencia:
        - { tipo: nand, entradas: [A, A] }
        - { tipo: nand, entradas: [B, B] }
        - { tipo: nand, entradas: [p1, p2] }
      exigir_minimo: true
    exito: "(Ā·B̄)' = A + B: una NAND con las entradas negadas es una OR. Con NOT y una de las dos operaciones se construye la otra."
    escalera:
      - "Una NAND con las dos entradas unidas es un inversor."
      - "Aplique De Morgan a (Ā·B̄)'."
    solucion: "p1 = NAND(A, A), p2 = NAND(B, B) e Y = NAND(p1, p2)."

  - id: tabla-ab-mas-c
    tipo: tabla
    titulo: "Y = A·B + C"
    texto: "Rellene la columna Y para las ocho combinaciones: una AND de A y B, en OR con C."
    libro: ["cap09#199", 24]
    widget:
      tipo: logica
      entradas: [A, B, C]
      piezas:
        - { id: y1, tipo: and, entradas: [A, B] }
        - { id: o1, tipo: or, entradas: [y1, C] }
      salidas:
        - { id: Y, de: o1, rotulo: "A·B + C" }
      ocultar: true
    tabla:
      salidas: [Y]
    exito: "Y vale 1 siempre que C = 1, y además con A = B = 1. Una FPGA guarda justo esta tabla en una tabla de consulta."
    escalera:
      - "Con C = 1 la OR ya da 1, valgan lo que valgan A y B."
      - "Con C = 0, Y es la AND: solo da 1 con A = 1 y B = 1."
    solucion: "Y = 1 en las cuatro filas con C = 1 y en la fila A = 1, B = 1, C = 0."

  - id: sorpresa-xor
    tipo: tabla
    titulo: "La suma de productos"
    texto: "La suma de productos lleva un término AND por cada fila con salida 1: aquí, Ā·B + A·B̄. Rellene su tabla."
    libro: [22, 23]
    widget:
      tipo: logica
      entradas: [A, B]
      piezas:
        - { id: na, tipo: not, entradas: [A] }
        - { id: nb, tipo: not, entradas: [B] }
        - { id: t1, tipo: and, entradas: [na, B] }
        - { id: t2, tipo: and, entradas: [A, nb] }
        - { id: o1, tipo: or, entradas: [t1, t2] }
      salidas:
        - { id: Y, de: o1, rotulo: "Ā·B + A·B̄" }
      ocultar: true
    tabla:
      salidas: [Y]
    exito: "Vale 1 cuando las entradas son distintas: es exactamente la XOR. Dos inversores, dos AND y una OR, o una de las cuatro puertas de un 74HC86."
    escalera:
      - "Ā·B solo vale 1 con A = 0 y B = 1."
      - "A·B̄ solo vale 1 con A = 1 y B = 0."
    solucion: "Y: 0, 1, 1, 0."

  - id: averia-xor
    tipo: averia
    titulo: "En el banco, no cuadra"
    texto: "Montó la suma de productos y su tabla no sale. Pruebe combinaciones, mida con la sonda y diga qué puerta falla."
    libro: [23, 26]
    widget:
      tipo: logica
      entradas: [A, B]
      piezas:
        - { id: na, tipo: not, entradas: [A], rotulo: "Inversor de A" }
        - { id: nb, tipo: not, entradas: [B], rotulo: "Inversor de B" }
        - { id: t1, tipo: and, entradas: [na, B], rotulo: "AND de arriba" }
        - { id: t2, tipo: and, entradas: [A, nb], rotulo: "AND de abajo" }
        - { id: o1, tipo: or, entradas: [t1, t2], rotulo: "OR de salida" }
      salidas:
        - { id: Y, de: o1, rotulo: "Ā·B + A·B̄" }
    averia:
      eleccion: fija
      sospechosos:
        - { id: na, rotulo: "Inversor de A" }
        - { id: nb, rotulo: "Inversor de B" }
        - { id: t1, rotulo: "AND de arriba (Ā·B)" }
        - { id: t2, rotulo: "AND de abajo (A·B̄)" }
        - { id: o1, rotulo: "OR de salida" }
      fallos:
        - { id: t2-a-cero, pieza: t2, tipo: atascada-0, texto: "La salida de la AND de abajo está siempre a 0: falta el término A·B̄ y la fila A = 1, B = 0 da 0." }
        - { id: na-a-uno, pieza: na, tipo: atascada-1, texto: "El inversor de A da siempre 1: el término de arriba se queda en B y la fila A = 1, B = 1 da 1." }
        - { id: nb-a-cero, pieza: nb, tipo: atascada-0, texto: "El inversor de B da siempre 0: la AND de abajo nunca recibe B̄ y la fila A = 1, B = 0 da 0." }
        - { id: t1-a-uno, pieza: t1, tipo: atascada-1, texto: "La AND de arriba da siempre 1: la salida se queda en 1 en las cuatro filas." }
        - { id: o1-a-cero, pieza: o1, tipo: atascada-0, texto: "La OR de salida da siempre 0: ninguna fila enciende el LED." }
    escalera:
      - "Pruebe la fila A = 1, B = 0: la XOR debe dar 1."
      - "Mida la salida de cada AND: cada una cubre una fila."
    solucion: "Con A = 1 y B = 0, la AND de abajo debería dar 1 y la sonda marca 0: está averiada."

  - id: porque-xor
    tipo: porque
    titulo: "¿Por qué es la XOR?"
    texto: "La suma de productos y la XOR dan la misma columna. ¿Por qué?"
    libro: [22, 23]
    widget:
      tipo: logica
      entradas: [A, B]
      piezas:
        - { id: x1, tipo: xor, entradas: [A, B] }
      salidas:
        - { id: Y, de: x1, rotulo: "XOR" }
      tabla: true
    opciones:
      - { texto: "Cada término AND cubre una de las dos filas con entradas distintas", bien: true, porque: "Ā·B vale 1 solo con A = 0, B = 1, y A·B̄ solo con A = 1, B = 0: su OR es 1 cuando las entradas difieren." }
      - { texto: "Porque se ha simplificado con un mapa de Karnaugh", porque: "Esa suma de productos no admite simplificación: ya es la XOR tal cual sale de la tabla." }
      - { texto: "Porque los inversores se anulan", porque: "Cada inversor niega una entrada distinta; no se anulan entre sí." }
    escalera: ["¿En qué filas vale 1 cada término AND?"]
    solucion: "Ā·B y A·B̄ son las dos filas con salida 1: las de entradas distintas."

  - id: pregunta-dos-valores
    tipo: tocar
    titulo: "Por qué solo dos valores"
    texto: "En la segunda columna, la de la familia CMOS, toque la franja donde una entrada no se lee ni como 0 ni como 1."
    libro: [5]
    widget:
      tipo: figura
      figura: fig-9.2
      zonas:
        - { id: alto, rotulo: "Franja de arriba, segunda columna", rect: [161, 54, 40, 53] }
        - { id: prohibida, rotulo: "Franja del medio, segunda columna", rect: [161, 107, 40, 71] }
        - { id: bajo, rotulo: "Franja de abajo, segunda columna", rect: [161, 178, 40, 53] }
    tocar:
      bien: [prohibida]
      porque:
        alto: "Es la franja azul: cualquier tensión ahí se lee como un 1 válido."
        bajo: "Es la franja verde: cualquier tensión ahí se lee como un 0 válido."
    exito: "La zona prohibida. Con dos valores, cada uno tiene una franja ancha; distinguir diez niveles exigiría márgenes diez veces menores."
    escalera:
      - "Busque la franja roja."
    solucion: "La franja del medio, la roja: ni 0 ni 1."

  - id: pregunta-fpga
    tipo: pregunta
    titulo: "Simplificar en una FPGA"
    texto: "En una FPGA, ¿qué ahorra simplificar una función de hasta seis entradas?"
    libro: [24]
    widget:
      tipo: logica
      entradas: [A, B]
      piezas:
        - { id: x1, tipo: xor, entradas: [A, B] }
      salidas:
        - { id: Y, de: x1, rotulo: "XOR" }
      tabla: true
    opciones:
      - { texto: "Nada: cualquier función de hasta seis entradas cabe en una tabla de consulta", bien: true, porque: "La FPGA guarda la tabla de verdad entera; el álgebra sigue haciendo falta para leer y depurar lo que produce la herramienta." }
      - { texto: "La mitad de las puertas", porque: "En una FPGA no hay puertas sueltas que ahorrar: la función es una tabla de consulta." }
      - { texto: "El retardo de cada puerta", porque: "Dentro de una tabla de consulta no hay cadena de puertas; simplificar no cambia nada." }
    escalera: ["Piense en qué es una tabla de consulta: la tabla de verdad guardada."]
    solucion: "Nada: la función cabe entera en una tabla de consulta."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [4, 7, 8, 16, 22]
    ideas:
      - { titulo: "AND y OR.", texto: "La AND da 1 solo si todas las entradas son 1; la OR, si alguna lo es. 1 + 1 = 1." }
      - { titulo: "De Morgan.", texto: "Negar una AND es hacer OR de las negaciones: una NAND es una OR con las entradas negadas." }
      - { titulo: "De la tabla al circuito.", texto: "Tabla de verdad, suma de productos y simplificación." }
      - { titulo: "Por qué binario.", texto: "Dos valores es lo que más robustez da frente al ruido." }
