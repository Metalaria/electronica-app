# Lección 1.2 de la sección 9.1 «El Álgebra de Boole» (cap09). Formato: contenido/lecciones11/GUIA.md (§11: circuito lógico vivo).
leccion: cap09/sec-9.1

libro:
  3: "En 1854 George Boole formalizó un álgebra"
  4: "Una expresión booleana es simultáneamente una fórmula"
  5: "distinguir diez niveles exigiría márgenes diez veces menores"
  7: "la salida es 1 solo si todas las entradas son 1"
  8: "la salida es 1 si alguna entrada es 1"
  10: "1 + 1 = 1 en Boole, no 2"
  14: "overline(A dot.op B) = overline(A) + overline(B)"
  16: "negar una AND equivale a hacer OR de las negaciones"
  19: "Una NAND dibujada como OR con las entradas negadas es exactamente el mismo chip"
  22: "Obtener la suma de productos"
  23: "es exactamente la XOR de la sección 9.3"
  24: "la simplificación no ahorra nada"
  "cap09#199": "Construye la tabla de verdad de la función Y = A·B + C"

modelo:
  valores: {}
  calculos: {}

tarjetas:
  - id: explore-and-or
    tipo: explorar
    titulo: "Dos operaciones vivas"
    texto: "Toque A y B. Mire cuándo se enciende cada LED y qué fila marca la tabla."
    libro: [7, 8]
    widget:
      tipo: logica
      entradas: [A, B]
      piezas:
        - { id: y1, tipo: and, entradas: [A, B] }
        - { id: o1, tipo: or, entradas: [A, B] }
      salidas:
        - { id: AND, de: y1, rotulo: "A·B" }
        - { id: OR, de: o1, rotulo: "A+B" }
      tabla: true
    requiere: { mover: [A, B] }

  - id: prediga-uno-mas-uno
    tipo: predecir
    titulo: "Uno más uno"
    texto: "Con A = 1 y B = 1, ¿qué da la OR?"
    libro: [8, 10]
    widget:
      tipo: logica
      entradas: [{ id: A, valor: 1 }, { id: B, valor: 1 }]
      piezas:
        - { id: o1, tipo: or, entradas: [A, B] }
      salidas:
        - { id: Y, de: o1, rotulo: "A+B" }
      ocultar: true
    opciones:
      - { texto: "1", bien: true, porque: "La OR da 1 si alguna entrada es 1. En Boole no hay más valores: 1 + 1 = 1." }
      - { texto: "2", porque: "Es la suma de la aritmética. En Boole solo existen 0 y 1, y 1 + 1 = 1." }
      - { texto: "0", porque: "La OR solo da 0 cuando las dos entradas son 0; aquí las dos son 1." }
    escalera: ["La OR se parece a la suma, pero con un límite: no hay más valores que 0 y 1."]
    solucion: "1 + 1 = 1 en Boole, no 2."

  - id: explore-de-morgan
    tipo: explorar
    titulo: "Dos circuitos, una tabla"
    texto: "Arriba, una NAND; abajo, una OR con las entradas negadas. Pruebe las cuatro combinaciones: ¿difieren alguna vez?"
    libro: [16, 19]
    widget:
      tipo: logica
      entradas: [A, B]
      piezas:
        - { id: n1, tipo: nand, entradas: [A, B] }
        - { id: na, tipo: not, entradas: [A] }
        - { id: nb, tipo: not, entradas: [B] }
        - { id: o1, tipo: or, entradas: [na, nb] }
      salidas:
        - { id: Y1, de: n1, rotulo: "NAND" }
        - { id: Y2, de: o1, rotulo: "OR negada" }
      tabla: true
    requiere: { mover: [A, B] }

  - id: pregunta-mismo-chip
    tipo: pregunta
    titulo: "¿Por qué el mismo chip?"
    texto: "Un esquema dibuja una NAND como una OR con las entradas negadas. ¿Por qué es exactamente el mismo chip?"
    libro: [16, 19]
    widget:
      tipo: logica
      entradas: [A, B]
      piezas:
        - { id: na, tipo: not, entradas: [A] }
        - { id: nb, tipo: not, entradas: [B] }
        - { id: o1, tipo: or, entradas: [na, nb] }
      salidas:
        - { id: Y, de: o1, rotulo: "OR negada" }
    opciones:
      - { texto: "Por De Morgan, las dos dan la misma tabla de verdad", bien: true, porque: "Negar una AND equivale a hacer OR de las negaciones: es la misma función con otro dibujo." }
      - { texto: "Porque el fabricante mete dos puertas en el encapsulado", porque: "El chip es una sola NAND. El símbolo de OR negada es otra forma de dibujarla." }
      - { texto: "Porque una OR es una NAND", porque: "Sin negar las entradas no: con A = B = 0, la OR da 0 y la NAND da 1." }
    escalera: ["Compare las dos columnas de la tarjeta anterior."]
    solucion: "Por De Morgan: la NAND es la OR de las entradas negadas."

  - id: pregunta-doble-negacion
    tipo: pregunta
    titulo: "Dos negaciones"
    texto: "Por De Morgan, ¿a qué equivale (A'·B')'?"
    libro: [14, "cap09#199"]
    widget:
      tipo: logica
      entradas: [A, B]
      piezas:
        - { id: na, tipo: not, entradas: [A] }
        - { id: nb, tipo: not, entradas: [B] }
        - { id: n1, tipo: nand, entradas: [na, nb] }
      salidas:
        - { id: Y, de: n1, rotulo: "(A'·B')'" }
      ocultar: true
    opciones:
      - { texto: "A + B: una OR", bien: true, porque: "La negación del producto es la suma de las negaciones, y la doble negación se cancela: A + B." }
      - { texto: "A·B: una AND", porque: "Ha cancelado las negaciones sin cambiar la operación. De Morgan convierte el producto negado en una suma." }
      - { texto: "A' + B'", porque: "Esa sería la NAND de A y B. Aquí las entradas ya llegan negadas, y negarlas otra vez las devuelve a A y B." }
    escalera:
      - "Aplique (X·Y)' = X' + Y' con X = A' e Y = B'."
    solucion: "(A'·B')' = (A')' + (B')' = A + B: una NAND con las entradas negadas es una OR."

  - id: tabla-ab-mas-c
    tipo: tabla
    titulo: "Y = A·B + C"
    texto: "Rellene la columna Y para las ocho combinaciones: una AND de A y B, en OR con C."
    libro: ["cap09#199"]
    widget:
      tipo: logica
      entradas: [A, B, C]
      piezas:
        - { id: y1, tipo: and, entradas: [A, B] }
        - { id: o1, tipo: or, entradas: [y1, C] }
      salidas:
        - { id: Y, de: o1, rotulo: "A·B + C" }
      ocultar: true
    tabla:
      salidas: [Y]
    exito: "La salida es 1 en cinco de los ocho casos: siempre que C = 1, y además con A = B = 1."
    escalera:
      - "Con C = 1 la OR ya da 1, valgan lo que valgan A y B."
      - "Con C = 0, Y es la AND: solo da 1 con A = 1 y B = 1."
    solucion: "Y = 1 en las cuatro filas con C = 1 y en la fila A = 1, B = 1, C = 0."

  - id: ordene-procedimiento
    tipo: pregunta
    fase: "Ordene"
    titulo: "De la tabla al circuito"
    texto: "Ponga en orden el procedimiento estándar."
    libro: [22]
    ordenar:
      - "Escribir la tabla de verdad con la salida deseada."
      - "Obtener la suma de productos: un término AND por cada fila con salida 1."
      - "Simplificar, con el álgebra o con un mapa de Karnaugh."
    exito: "La suma de productos da un circuito correcto pero no óptimo: por eso se simplifica al final."
    pistas:
      - { texto: "Primero la tabla, de ella los términos y, al final, la simplificación." }
    escalera: ["Sin tabla no hay filas de las que sacar los términos."]
    solucion: "Tabla, suma de productos y, al final, simplificar."

  - id: sorpresa-xor
    tipo: sorpresa
    titulo: "Cinco puertas o una"
    texto: "Arriba, la suma de productos Ā·B + A·B̄; abajo, una sola XOR. Pruebe las cuatro combinaciones."
    libro: [23]
    widget:
      tipo: logica
      entradas: [A, B]
      piezas:
        - { id: na, tipo: not, entradas: [A] }
        - { id: nb, tipo: not, entradas: [B] }
        - { id: t1, tipo: and, entradas: [na, B] }
        - { id: t2, tipo: and, entradas: [A, nb] }
        - { id: o1, tipo: or, entradas: [t1, t2] }
        - { id: x1, tipo: xor, entradas: [A, B] }
      salidas:
        - { id: SP, de: o1, rotulo: "Suma de productos" }
        - { id: XOR, de: x1, rotulo: "XOR" }
      tabla: true
    requiere: { mover: [A, B] }

  - id: porque-xor
    tipo: porque
    titulo: "¿Por qué es la XOR?"
    texto: "La suma de productos y la XOR dan la misma columna. ¿Por qué?"
    libro: [22, 23]
    widget:
      tipo: logica
      entradas: [A, B]
      piezas:
        - { id: x1, tipo: xor, entradas: [A, B] }
      salidas:
        - { id: Y, de: x1, rotulo: "XOR" }
      tabla: true
    opciones:
      - { texto: "Cada término AND cubre una de las dos filas con entradas distintas", bien: true, porque: "Ā·B vale 1 solo con A = 0, B = 1, y A·B̄ solo con A = 1, B = 0: su OR es 1 cuando las entradas difieren." }
      - { texto: "Porque se ha simplificado con un mapa de Karnaugh", porque: "Esa suma de productos no admite simplificación: ya es la XOR tal cual sale de la tabla." }
      - { texto: "Porque los inversores se anulan", porque: "Cada inversor niega una entrada distinta; no se anulan entre sí." }
    escalera: ["¿En qué filas vale 1 cada término AND?"]
    solucion: "Ā·B y A·B̄ son las dos filas con salida 1: las de entradas distintas."

  - id: pregunta-dos-valores
    tipo: pregunta
    titulo: "¿Por qué solo dos valores?"
    texto: "Todo circuito digital es binario. ¿Cuál es la razón de fondo?"
    libro: [3, 5]
    widget:
      tipo: figura
      figura: fig-9.2
      zonas:
        - { id: prohibida, rotulo: "Zona roja de la CMOS HC", rect: [161, 107, 40, 71], texto: "La zona prohibida: ni 0 ni 1." }
    opciones:
      - { texto: "Distinguir dos estados es muy fiable; diez niveles exigirían márgenes diez veces menores", bien: true, porque: "Conduce o no conduce, cerca de cero o cerca de la alimentación: dos valores maximizan la robustez frente al ruido y la deriva." }
      - { texto: "Porque Boole lo eligió así en 1854", porque: "Boole formalizó el álgebra; la razón de usarla en circuitos es física, no histórica." }
      - { texto: "Porque es la notación más cómoda", porque: "No es una cuestión de notación: un circuito distingue dos estados con enorme fiabilidad." }
    escalera: ["Piense en el ruido: ¿qué pasa con los márgenes si caben más niveles?"]
    solucion: "Dos valores es el número que maximiza la robustez: más niveles exigirían márgenes menores."

  - id: pregunta-fpga
    tipo: pregunta
    titulo: "Simplificar en una FPGA"
    texto: "En una FPGA, ¿qué ahorra simplificar una función de hasta seis entradas?"
    libro: [24]
    widget:
      tipo: logica
      entradas: [A, B]
      piezas:
        - { id: x1, tipo: xor, entradas: [A, B] }
      salidas:
        - { id: Y, de: x1, rotulo: "XOR" }
      tabla: true
    opciones:
      - { texto: "Nada: cualquier función de hasta seis entradas cabe en una tabla de consulta", bien: true, porque: "La FPGA guarda la tabla de verdad entera; el álgebra sigue haciendo falta para leer y depurar lo que produce la herramienta." }
      - { texto: "La mitad de las puertas", porque: "En una FPGA no hay puertas sueltas que ahorrar: la función es una tabla de consulta." }
      - { texto: "El retardo de cada puerta", porque: "Dentro de una tabla de consulta no hay cadena de puertas; simplificar no cambia nada." }
    escalera: ["Piense en qué es una tabla de consulta: la tabla de verdad guardada."]
    solucion: "Nada: la función cabe entera en una tabla de consulta."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [4, 7, 8, 16, 22]
    ideas:
      - { titulo: "AND y OR.", texto: "La AND da 1 solo si todas las entradas son 1; la OR, si alguna lo es. 1 + 1 = 1." }
      - { titulo: "De Morgan.", texto: "Negar una AND es hacer OR de las negaciones: una NAND es una OR con las entradas negadas." }
      - { titulo: "De la tabla al circuito.", texto: "Tabla de verdad, suma de productos y simplificación." }
      - { titulo: "Por qué binario.", texto: "Dos valores es lo que más robustez da frente al ruido." }
