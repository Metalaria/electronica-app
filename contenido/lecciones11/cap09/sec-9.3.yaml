# Lección de la sección 9.3 «Puertas Lógicas» (cap09). Formato: contenido/lecciones11/GUIA.md (§11: circuito lógico vivo).
# 1.2.1 («aprender haciendo», GUIA §13): las siete puertas se prueban en vivo; la XOR y la XNOR y las construcciones
# con NAND se rellenan en su tabla; la OR se construye con NAND y con NOR; la entrada al aire se busca con la sonda
# lógica (en TTL se lee como un 1); el glitch de dos caminos se rellena primero en su tabla (la función estable es 0).
# Quedan dos preguntas de opciones: por qué la NAND es más barata en CMOS y qué pasa durante la transición.
leccion: cap09/sec-9.3

libro:
  40: "implementan físicamente las operaciones del álgebra de Boole"
  41: "AND negada (puerta universal)"
  42: "el 7400 contiene cuatro puertas NAND de dos entradas"
  43: "una NAND con las entradas unidas es un inversor"
  44: "La inversión es gratis en CMOS y la no inversión cuesta una etapa"
  45: "en TTL tiende a leerse como un 1"
  46: "aparecen pulsos espurios (glitches) durante la transición"
  47: "La NAND como puerta universal"
  "cap09#199": "Una puerta XOR recibe A=1 y B=1"

modelo:
  valores: {}
  calculos: {}

tarjetas:
  - id: explore-siete
    tipo: explorar
    titulo: "Las siete puertas"
    texto: "Toque A y B y mire qué LED se encienden con cada combinación. Busque la única que apaga la NAND."
    libro: [40, 41]
    widget:
      tipo: logica
      entradas: [A, B]
      piezas:
        - { id: g-and, tipo: and, entradas: [A, B] }
        - { id: g-or, tipo: or, entradas: [A, B] }
        - { id: g-not, tipo: not, entradas: [A] }
        - { id: g-nand, tipo: nand, entradas: [A, B] }
        - { id: g-nor, tipo: nor, entradas: [A, B] }
        - { id: g-xor, tipo: xor, entradas: [A, B] }
        - { id: g-xnor, tipo: xnor, entradas: [A, B] }
      salidas:
        - { id: AND, de: g-and }
        - { id: OR, de: g-or }
        - { id: NOT, de: g-not, rotulo: "NOT A" }
        - { id: NAND, de: g-nand }
        - { id: NOR, de: g-nor }
        - { id: XOR, de: g-xor }
        - { id: XNOR, de: g-xnor }
    objetivo:
      condiciones:
        - { led: NAND, valor: 0, rotulo: "NAND apagada" }
      logrado: "Solo con las dos entradas encendidas se apaga la NAND: es la AND negada."
      pistas:
        - { texto: "La NAND está encendida casi siempre: pruebe a encender las dos." }
    escalera: ["NAND es «no AND»."]
    solucion: "A y B encendidas."

  - id: prediga-xor
    tipo: tabla
    titulo: "La que detecta diferencias"
    texto: "Rellene la XOR y la XNOR sin ver los LED. La XOR detecta diferencias."
    libro: [41, 42, "cap09#199"]
    widget:
      tipo: logica
      entradas: [A, B]
      piezas:
        - { id: x1, tipo: xor, entradas: [A, B] }
        - { id: x2, tipo: xnor, entradas: [A, B] }
      salidas:
        - { id: XOR, de: x1 }
        - { id: XNOR, de: x2 }
      ocultar: true
    tabla:
      salidas: [XOR, XNOR]
    exito: "Con A = 1 y B = 1 la XOR da 0: las entradas no difieren. La XNOR es su negada: detecta igualdad. De la XOR salen los sumadores y la paridad."
    escalera:
      - "La XOR da 1 solo si las entradas son distintas."
      - "La XNOR da justo lo contrario en cada fila."
    solucion: "XOR: 0, 1, 1, 0. XNOR: 1, 0, 0, 1."

  - id: explore-universal
    tipo: tabla
    titulo: "Todo con NAND"
    texto: "Arriba, una NAND con las entradas unidas; abajo, una NAND seguida de otra que invierte. Rellene las dos columnas."
    libro: [43, 47]
    widget:
      tipo: logica
      entradas: [A, B]
      piezas:
        - { id: n1, tipo: nand, entradas: [A, A] }
        - { id: n2, tipo: nand, entradas: [A, B] }
        - { id: n3, tipo: nand, entradas: [n2, n2] }
      salidas:
        - { id: Y1, de: n1, rotulo: "NAND unida" }
        - { id: Y2, de: n3, rotulo: "NAND + inversor" }
      ocultar: true
    tabla:
      salidas: [Y1, Y2]
    exito: "Arriba, un inversor de A; abajo, una AND. Con NAND se hace cualquier cosa: por eso TTL se construye alrededor de ella."
    escalera:
      - "Con las entradas unidas, la NAND recibe A y A: solo da 0 si A = 1."
      - "Invertir una NAND devuelve la AND."
    solucion: "Y1: 1, 1, 0, 0 (NOT A). Y2: 0, 0, 0, 1 (AND)."

  - id: disene-or-nand
    tipo: diseno
    titulo: "Una OR con un 7400"
    texto: "Solo tiene puertas NAND. Haga Y = A + B con las menos posibles."
    libro: [42, 43]
    widget:
      tipo: logica
      entradas: [A, B]
      piezas: []
      salidas:
        - { id: Y, de: "0", rotulo: "A + B" }
    diseno:
      salida: Y
      permitidas: [nand]
      referencia:
        - { tipo: nand, entradas: [A, A] }
        - { tipo: nand, entradas: [B, B] }
        - { tipo: nand, entradas: [p1, p2] }
      exigir_minimo: true
    exito: "Dos inversores en las entradas de una NAND dan una OR, por De Morgan."
    escalera:
      - "Una NAND con las entradas unidas es un inversor."
      - "Invierta A y B, y únalas con una tercera NAND."
    solucion: "p1 = NAND(A, A), p2 = NAND(B, B) e Y = NAND(p1, p2)."

  - id: disene-or-nor
    tipo: diseno
    titulo: "Ahora solo NOR"
    texto: "La NOR también es universal. Haga Y = A + B solo con puertas NOR, con las menos posibles."
    libro: [43]
    widget:
      tipo: logica
      entradas: [A, B]
      piezas: []
      salidas:
        - { id: Y, de: "0", rotulo: "A + B" }
    diseno:
      salida: Y
      permitidas: [nor]
      referencia:
        - { tipo: nor, entradas: [A, B] }
        - { tipo: nor, entradas: [p1, p1] }
      exigir_minimo: true
    exito: "Una NOR y otra NOR con las entradas unidas, que invierte: la OR. Solo con NOR también se construye cualquier función."
    escalera:
      - "La NOR es la OR invertida."
      - "Una NOR con las entradas unidas es un inversor."
    solucion: "p1 = NOR(A, B) e Y = NOR(p1, p1)."

  - id: disene-xor-7400
    tipo: diseno
    titulo: "Un 7400 y paciencia"
    texto: "Con las cuatro NAND de un 7400, haga la XOR: Y = 1 cuando A y B son distintas."
    libro: [42, 43]
    widget:
      tipo: logica
      entradas: [A, B]
      piezas: []
      salidas:
        - { id: Y, de: "0", rotulo: "A ⊕ B" }
    diseno:
      salida: Y
      permitidas: [nand]
      referencia:
        - { tipo: nand, entradas: [A, B] }
        - { tipo: nand, entradas: [A, p1] }
        - { tipo: nand, entradas: [B, p1] }
        - { tipo: nand, entradas: [p2, p3] }
      exigir_minimo: false
      max_puertas: 6
    exito: "Cuatro NAND, un solo chip: un 7400 resuelve, con paciencia, cualquier problema pequeño."
    escalera:
      - "Empiece por la NAND de A y B."
      - "Lleve esa salida a otras dos NAND, una con A y otra con B, y júntelas con la cuarta."
    solucion: "p1 = NAND(A, B), p2 = NAND(A, p1), p3 = NAND(B, p1) e Y = NAND(p2, p3)."

  - id: porque-cmos
    tipo: porque
    titulo: "¿Por qué la NAND es más barata?"
    texto: "En CMOS, una NAND de dos entradas lleva cuatro transistores y una AND, seis. ¿Por qué?"
    libro: [44]
    widget:
      tipo: logica
      entradas: [A, B]
      piezas:
        - { id: n1, tipo: nand, entradas: [A, B] }
        - { id: n2, tipo: not, entradas: [n1] }
      salidas:
        - { id: Y, de: n2, rotulo: "AND" }
    opciones:
      - { texto: "La salida invertida sale sola de la estructura; no invertir cuesta un inversor más", bien: true, porque: "Dos N en serie y dos P en paralelo dan la NAND; la AND añade una etapa inversora." }
      - { texto: "Porque la AND tiene más entradas", porque: "Las dos tienen dos entradas. La diferencia es la etapa que deshace la inversión." }
      - { texto: "Porque la NAND usa transistores bipolares", porque: "Se habla de CMOS: son MOSFET en las dos. La AND es una NAND más un inversor." }
    escalera: ["Una AND es una NAND más un inversor."]
    solucion: "La inversión es gratis en CMOS: AND = NAND + inversor, seis transistores."

  - id: prediga-al-aire
    tipo: averia
    titulo: "Una entrada al aire"
    texto: "Una AND hecha con dos NAND de un 7400 TTL da 1 con A = 1 y B = 0. Mida con la sonda y diga qué puerta falla."
    libro: [42, 45]
    widget:
      tipo: logica
      entradas: [A, B]
      piezas:
        - { id: n1, tipo: nand, entradas: [A, B], rotulo: "NAND de entrada" }
        - { id: n2, tipo: nand, entradas: [n1, n1], rotulo: "NAND inversora" }
      salidas:
        - { id: Y, de: n2, rotulo: "A·B" }
    averia:
      eleccion: fija
      sospechosos:
        - { id: n1, rotulo: "NAND de entrada" }
        - { id: n2, rotulo: "NAND inversora" }
      fallos:
        - { id: n1-b-al-aire, pieza: n1, tipo: sin-conexion, pin: 2, texto: "La entrada B de la primera NAND está al aire: en TTL tiende a leerse como un 1, y la AND sigue solo a A." }
        - { id: n2-a-cero, pieza: n2, tipo: atascada-0, texto: "La salida de la NAND inversora está siempre a 0: la AND no da 1 nunca." }
    exito: "Toda entrada sin uso va a masa, a la alimentación o a otra entrada de la misma puerta; nunca al aire."
    escalera:
      - "Ponga A = 1 y B = 0 y mida las dos patillas de entrada de la primera NAND."
    solucion: "La sonda no ve nivel en la patilla B de la NAND de entrada: está al aire y se lee como 1."

  - id: tabla-glitch
    tipo: tabla
    titulo: "Dos caminos"
    texto: "A llega a la XOR directamente y a través de dos inversores. Rellene la tabla en reposo."
    libro: [46]
    widget:
      tipo: logica
      entradas: [A]
      piezas:
        - { id: i1, tipo: not, entradas: [A] }
        - { id: i2, tipo: not, entradas: [i1] }
        - { id: x1, tipo: xor, entradas: [A, i2] }
      salidas:
        - { id: Y, de: x1 }
      ocultar: true
    tabla:
      salidas: [Y]
    exito: "En reposo, la XOR compara A consigo misma: siempre 0. La tabla describe el estado estable, no el camino entre estados."
    escalera:
      - "Dos inversores seguidos devuelven A."
    solucion: "Y = 0 en las dos filas."

  - id: pregunta-glitch
    tipo: pregunta
    titulo: "Durante la transición"
    texto: "La tabla dice 0 siempre, pero el camino de los inversores es más largo. ¿Qué pasa cuando A cambia?"
    libro: [46]
    widget:
      tipo: logica
      entradas: [A]
      piezas:
        - { id: i1, tipo: not, entradas: [A] }
        - { id: i2, tipo: not, entradas: [i1] }
        - { id: x1, tipo: xor, entradas: [A, i2] }
      salidas:
        - { id: Y, de: x1 }
    opciones:
      - { texto: "Sale un pulso espurio, aunque la función final sea correcta", bien: true, porque: "Cada puerta tarda unos nanosegundos: mientras un camino ya cambió y el otro no, la XOR ve entradas distintas y da un glitch." }
      - { texto: "Nada: la tabla de verdad lo garantiza", porque: "La tabla describe el estado estable. Durante la transición los retardos distintos producen pulsos." }
      - { texto: "La puerta se estropea", porque: "No se daña: da un pulso espurio breve y vuelve a su valor." }
    escalera: ["¿Cambian los dos caminos a la vez si sus retardos son distintos?"]
    solucion: "Un glitch: un pulso breve mientras los caminos no coinciden."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [41, 43, 44, 45]
    ideas:
      - { titulo: "Siete puertas.", texto: "AND, OR, NOT y sus negadas; la XOR detecta diferencias." }
      - { titulo: "Universal.", texto: "Solo con NAND (o solo con NOR) se hace cualquier función: la OR son tres NAND." }
      - { titulo: "En CMOS.", texto: "La inversión es gratis: la NAND son cuatro transistores; la AND, seis." }
      - { titulo: "Nunca al aire.", texto: "Toda entrada sin uso va a masa o a la alimentación." }
