# Lección de la sección 9.4 «Circuitos Secuenciales: Flip-Flops» (cap09). Formato: contenido/lecciones11/GUIA.md (§11: circuito lógico y cronograma).
# 1.2.1 («aprender haciendo», GUIA §13): la Q del D, la del JK y la del divisor por dos se dibujan sobre el cronograma
# (los estímulos del D y del JK son los de la figura 9.5); el flanco que captura el primer 1 se toca en la figura; la
# frecuencia del divisor se lee con un reloj de ejemplo (1 kHz). Quedan dos preguntas de opciones: setup y hold, y de
# dónde sale la memoria. La exploración del D tiene objetivo sobre el LED (motor121): guardar un 1.
leccion: cap09/sec-9.4

libro:
  49: "cuya salida depende también del estado anterior"
  50: "El flip-flop D captura el valor de su entrada en cada flanco de reloj"
  51: "Captura el valor de su entrada D en el instante del flanco de reloj y lo mantiene hasta el siguiente"
  52: "mantener, poner a 1, poner a 0 y conmutar (toggle)"
  53: "actualizan su estado solo en el flanco de una señal de reloj común"
  54: "Dos inversores en anillo tienen dos estados estables"
  55: "desde un tiempo antes del flanco (setup, tsu) hasta un tiempo después (hold, th)"
  56: "una onda cuadrada de la mitad de la frecuencia del reloj"

modelo:
  valores:
    f_clk: { sim: "f_{reloj}", nombre: "frecuencia del reloj", unidad: Hz, valor: 1000 }
  calculos:
    f_q: { expr: "f_clk/2", sim: "f_{Q}", nombre: "frecuencia de Q", unidad: Hz }

tarjetas:
  - id: explore-d
    tipo: explorar
    titulo: "Un bit guardado"
    texto: "Guarde un 1 en el flip-flop. Cambiar D no basta: Q no se mueve hasta el flanco de reloj."
    libro: [49, 51, 53]
    widget:
      tipo: logica
      entradas: [D, { id: CLK, reloj: true }]
      piezas:
        - { id: f1, tipo: d, entradas: [D, CLK] }
      salidas:
        - { id: Q, de: f1.q }
    objetivo:
      condiciones:
        - { led: Q, valor: 1, rotulo: "Q encendida" }
      logrado: "Capturado: Q guarda el 1 aunque ahora cambie D, hasta el siguiente flanco."
      pistas:
        - { texto: "Ponga D a 1 y dé un pulso de reloj." }
    escalera: ["El flip-flop D copia D en el flanco del reloj."]
    solucion: "D a 1 y un pulso de reloj."

  - id: dibuje-q
    tipo: dibujar
    titulo: "Dibuje Q"
    texto: "Con este D, dibuje la salida Q tramo a tramo."
    libro: [50, 51]
    widget:
      tipo: logica
      entradas: [D, { id: CLK, reloj: true }]
      piezas:
        - { id: f1, tipo: d, entradas: [D, CLK] }
      salidas:
        - { id: Q, de: f1.q }
      cronograma: { ciclos: 8, estimulo: { D: "01101001" }, senales: [CLK, D] }
      dibujo: false
    dibujar:
      senal: Q
    exito: "Q copia D en cada flanco de subida y lo mantiene hasta el siguiente, aunque D cambie entre medias."
    escalera:
      - "Q solo cambia en los flancos de subida del reloj."
      - "En cada flanco, Q toma el valor que tiene D en ese instante."
    solucion: "Q: 0, 1, 1, 0, 1, 0, 0, 1, cambiando solo en los flancos."

  - id: toque-flanco
    tipo: tocar
    titulo: "El flanco que captura"
    texto: "En el cronograma del D de la figura, toque el flanco de reloj en que Q pasa a 1 por primera vez."
    libro: [50, 51]
    widget:
      tipo: figura
      figura: fig-9.5
      zonas:
        - { id: f1, rotulo: "Primer flanco", rect: [50, 30, 46, 92] }
        - { id: f2, rotulo: "Segundo flanco", rect: [98, 30, 46, 92] }
        - { id: f3, rotulo: "Tercer flanco", rect: [146, 30, 46, 92] }
        - { id: f4, rotulo: "Cuarto flanco", rect: [194, 30, 46, 92] }
    tocar:
      bien: [f2]
      porque:
        f1: "En ese flanco D aún vale 0: Q se queda en 0."
        f3: "Q ya valía 1 desde el flanco anterior: aquí lo mantiene."
        f4: "Aquí D ya ha bajado: Q pasa a 0."
    exito: "D sube entre dos flancos, pero Q espera al siguiente flanco de subida para copiarlo."
    escalera:
      - "Busque el primer flanco en que D ya está arriba."
    solucion: "El segundo flanco: D ya vale 1 y Q lo captura."

  - id: explore-jk
    tipo: dibujar
    titulo: "El flip-flop JK"
    texto: "J y K cambian como en la figura del libro. Dibuje Q, sabiendo que J pone a 1 y K pone a 0."
    libro: [50, 52]
    widget:
      tipo: logica
      entradas: [J, K, { id: CLK, reloj: true }]
      piezas:
        - { id: f1, tipo: jk, entradas: [J, K, CLK] }
      salidas:
        - { id: Q, de: f1.q }
      cronograma: { ciclos: 8, estimulo: { J: "01001110", K: "00011111" }, senales: [CLK, J, K] }
      dibujo: false
    dibujar:
      senal: Q
    exito: "Mantener con las dos a 0, poner a 1 con J, poner a 0 con K, y conmutar con las dos a 1."
    escalera:
      - "Con J = K = 0, Q se queda como estaba."
      - "Con J = K = 1, Q cambia en cada flanco."
    solucion: "Q: 0, 1, 1, 0, 1, 0, 1, 0."

  - id: sorpresa-divisor
    tipo: dibujar
    titulo: "Q̄ en su propia D"
    texto: "Este D lleva su salida negada a su entrada. Dibuje Q."
    libro: [56]
    widget:
      tipo: logica
      entradas: [{ id: CLK, reloj: true }]
      piezas:
        - { id: f1, tipo: d, entradas: [f1.nq, CLK] }
      salidas:
        - { id: Q, de: f1.q }
      cronograma: { ciclos: 6, senales: [CLK] }
      dibujo: false
    dibujar:
      senal: Q
    exito: "Q cambia en cada flanco de subida: un ciclo de Q por cada dos del reloj. Lo mismo hace un JK con J = K = 1."
    escalera:
      - "En cada flanco, D vale lo contrario de Q."
    solucion: "Q: 1, 0, 1, 0, 1, 0: cambia en cada flanco."

  - id: lea-divisor
    tipo: leer
    titulo: "¿A qué frecuencia?"
    texto: "El reloj va a {{f_clk}}. Cuente en el cronograma cuántos ciclos de reloj dura uno de Q y escriba la frecuencia de Q."
    nota: "Reloj de ejemplo."
    libro: [56]
    widget:
      tipo: logica
      entradas: [{ id: CLK, reloj: true }]
      piezas:
        - { id: f1, tipo: d, entradas: [f1.nq, CLK] }
      salidas:
        - { id: Q, de: f1.q }
      cronograma: { ciclos: 6, senales: [CLK, Q] }
    leer:
      objetivo: f_q
      unidad: Hz
      tol: 0.02
      rotulo: "Frecuencia de Q"
      errores:
        - { expr: "f_clk", texto: "Esa es la del reloj. Q necesita dos flancos de subida para subir y volver a bajar." }
        - { expr: "f_clk*2", texto: "Q es más lenta que el reloj, no más rápida: cambia una vez por flanco de subida." }
    exito: "{{f_q}}: la mitad. Un divisor por dos; encadenando varios sale un contador."
    escalera:
      - "Un ciclo de Q dura dos ciclos de reloj."
    solucion: "{{f_clk}} / 2 = {{f_q}}."
    comprobar:
      - { f_q: 500 }

  - id: pregunta-setup-hold
    tipo: pregunta
    titulo: "La ventana del flanco"
    texto: "¿Qué exige un flip-flop D a su entrada alrededor del flanco de reloj?"
    libro: [55]
    widget:
      tipo: logica
      entradas: [D, { id: CLK, reloj: true }]
      piezas:
        - { id: f1, tipo: d, entradas: [D, CLK] }
      salidas:
        - { id: Q, de: f1.q }
      cronograma: { ciclos: 4, estimulo: { D: "0110" }, senales: [CLK, D, Q] }
      dibujo: false
    opciones:
      - { texto: "Que esté estable un tiempo antes (setup) y un tiempo después (hold)", bien: true, porque: "Si cambia dentro de esa ventana, la salida puede quedarse indecisa: metaestabilidad." }
      - { texto: "Que cambie justo en el flanco", porque: "Es lo contrario: un cambio dentro de la ventana puede dejar la salida indecisa." }
      - { texto: "Nada: captura lo que haya", porque: "El flip-flop necesita la entrada quieta alrededor del flanco; si no, puede quedar metaestable." }
    escalera: ["Piense en qué ocurre si D cambia en el mismo instante en que se captura."]
    solucion: "Estable desde t_{su} antes del flanco hasta t_{h} después."

  - id: pregunta-memoria
    tipo: pregunta
    titulo: "De dónde sale la memoria"
    texto: "¿Qué guarda un bit mientras hay alimentación?"
    libro: [54]
    widget:
      tipo: logica
      entradas: [{ id: CLK, reloj: true }, D]
      piezas:
        - { id: f1, tipo: d, entradas: [D, CLK] }
      salidas:
        - { id: Q, de: f1.q }
    opciones:
      - { texto: "Dos inversores en anillo, que se sostienen el uno al otro", bien: true, porque: "Es realimentación positiva: si uno está en alto, el otro en bajo lo mantiene así." }
      - { texto: "Un condensador cargado", porque: "Eso es la DRAM. El biestable guarda el bit con dos inversores realimentados." }
      - { texto: "Una sola puerta NAND", porque: "Una puerta sola es combinacional: sin realimentación no recuerda nada." }
    escalera: ["Piense en un lazo que se sostiene a sí mismo."]
    solucion: "Dos inversores en anillo: dos estados estables."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [51, 52, 55, 56]
    ideas:
      - { titulo: "Flip-flop D.", texto: "Captura D en el flanco de reloj y lo mantiene hasta el siguiente." }
      - { titulo: "JK.", texto: "Mantener, poner a 1, poner a 0 y conmutar." }
      - { titulo: "Divisor por dos.", texto: "Con Q̄ en su D cambia en cada flanco: la mitad de la frecuencia." }
      - { titulo: "Setup y hold.", texto: "La entrada, quieta alrededor del flanco." }
