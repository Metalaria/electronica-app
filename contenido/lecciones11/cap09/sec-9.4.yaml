# Lección 1.2 de la sección 9.4 «Circuitos Secuenciales: Flip-Flops» (cap09). Formato: contenido/lecciones11/GUIA.md (§11: circuito lógico y cronograma).
leccion: cap09/sec-9.4

libro:
  49: "cuya salida depende también del estado anterior"
  50: "El flip-flop D captura el valor de su entrada en cada flanco de reloj"
  51: "Captura el valor de su entrada D en el instante del flanco de reloj y lo mantiene hasta el siguiente"
  52: "mantener, poner a 1, poner a 0 y conmutar (toggle)"
  53: "actualizan su estado solo en el flanco de una señal de reloj común"
  54: "Dos inversores en anillo tienen dos estados estables"
  55: "desde un tiempo antes del flanco (setup, tsu) hasta un tiempo después (hold, th)"
  56: "una onda cuadrada de la mitad de la frecuencia del reloj"

modelo:
  valores: {}
  calculos: {}

tarjetas:
  - id: explore-d
    tipo: explorar
    titulo: "Un bit guardado"
    texto: "Cambie D y mire Q: no se mueve. Después dé un pulso de reloj."
    libro: [49, 51]
    widget:
      tipo: logica
      entradas: [D, { id: CLK, reloj: true }]
      piezas:
        - { id: f1, tipo: d, entradas: [D, CLK] }
      salidas:
        - { id: Q, de: f1.q }
    requiere: { mover: [D, CLK] }

  - id: prediga-sin-flanco
    tipo: predecir
    titulo: "Sin flanco"
    texto: "Al encender, Q vale 0; luego se pone D = 1 sin ningún pulso de reloj. ¿Qué marca Q?"
    libro: [51, 53]
    widget:
      tipo: logica
      entradas: [{ id: D, valor: 1 }, { id: CLK, reloj: true }]
      piezas:
        - { id: f1, tipo: d, entradas: [D, CLK] }
      salidas:
        - { id: Q, de: f1.q }
      ocultar: true
    opciones:
      - { texto: "0", bien: true, porque: "El flip-flop solo mira D en el flanco de reloj. Sin flanco, mantiene lo que tenía." }
      - { texto: "1", porque: "Q no sigue a D: lo captura solo en el instante del flanco, y aún no ha llegado ninguno." }
    escalera: ["¿Cuándo mira el flip-flop su entrada D?"]
    solucion: "Sin flanco de reloj, Q mantiene su 0."

  - id: explore-cronograma-d
    tipo: explorar
    titulo: "D en cada flanco"
    texto: "Mueva el cursor por el cronograma. Compare Q con lo que valía D en cada flanco de subida."
    libro: [50, 51]
    widget:
      tipo: logica
      entradas: [D, { id: CLK, reloj: true }]
      piezas:
        - { id: f1, tipo: d, entradas: [D, CLK] }
      salidas:
        - { id: Q, de: f1.q }
      cronograma: { ciclos: 8, estimulo: { D: "01101001" }, senales: [CLK, D, Q] }

  - id: dibuje-q
    tipo: dibujar
    titulo: "Dibuje Q"
    texto: "Con este D, dibuje la salida Q tramo a tramo."
    libro: [50, 51]
    widget:
      tipo: logica
      entradas: [D, { id: CLK, reloj: true }]
      piezas:
        - { id: f1, tipo: d, entradas: [D, CLK] }
      salidas:
        - { id: Q, de: f1.q }
      cronograma: { ciclos: 8, estimulo: { D: "10011100" }, senales: [CLK, D] }
      dibujo: false
    dibujar:
      senal: Q
    exito: "Q copia D en cada flanco de subida y lo mantiene hasta el siguiente."
    escalera:
      - "Q solo cambia en los flancos de subida del reloj."
      - "En cada flanco, Q toma el valor que tiene D en ese instante."
    solucion: "Q repite D con medio ciclo de retraso: cambia solo en los flancos."

  - id: explore-jk
    tipo: explorar
    titulo: "El flip-flop JK"
    texto: "Elija J y K y dé pulsos de reloj. Busque sus cuatro comportamientos."
    libro: [52]
    widget:
      tipo: logica
      entradas: [J, K, { id: CLK, reloj: true }]
      piezas:
        - { id: f1, tipo: jk, entradas: [J, K, CLK] }
      salidas:
        - { id: Q, de: f1.q }
    requiere: { mover: [J, K, CLK] }

  - id: empareje-jk
    tipo: pregunta
    fase: "Empareje"
    titulo: "J y K"
    texto: "Una cada combinación con lo que hace el JK en el flanco."
    libro: [50, 52, 56]
    emparejar:
      - ["J = 0, K = 0", "Mantener"]
      - ["J = 1, K = 0", "Poner a 1"]
      - ["J = 0, K = 1", "Poner a 0"]
      - ["J = 1, K = 1", "Conmutar"]
    exito: "J pone a 1, K pone a 0, las dos a la vez conmutan y ninguna mantiene."
    pistas:
      - { texto: "Pruébelo en el JK de la tarjeta anterior: J es la entrada de poner a 1." }
    escalera: ["Con J = K = 1 es un divisor por dos: conmuta en cada flanco."]
    solucion: "00 mantiene, J pone a 1, K pone a 0 y las dos juntas conmutan."

  - id: sorpresa-divisor
    tipo: sorpresa
    titulo: "Q̄ en su propia D"
    texto: "Este D lleva su salida negada a su entrada. Mueva el cursor y compare Q con el reloj."
    libro: [56]
    widget:
      tipo: logica
      entradas: [{ id: CLK, reloj: true }]
      piezas:
        - { id: f1, tipo: d, entradas: [f1.nq, CLK] }
      salidas:
        - { id: Q, de: f1.q }
      cronograma: { ciclos: 6, senales: [CLK, Q] }

  - id: porque-mitad
    tipo: porque
    titulo: "¿Por qué la mitad?"
    texto: "La salida Q es una onda cuadrada de la mitad de la frecuencia del reloj. ¿Por qué?"
    libro: [56]
    widget:
      tipo: logica
      entradas: [{ id: CLK, reloj: true }]
      piezas:
        - { id: f1, tipo: d, entradas: [f1.nq, CLK] }
      salidas:
        - { id: Q, de: f1.q }
      cronograma: { ciclos: 6, senales: [CLK, Q] }
      dibujo: false
    opciones:
      - { texto: "Q cambia en cada flanco de subida: un ciclo de Q necesita dos del reloj", bien: true, porque: "Q̄ en D obliga a cambiar en cada flanco: sube en uno, baja en el siguiente." }
      - { texto: "Q cambia en los dos flancos del reloj", porque: "Entonces seguiría al reloj. Solo mira D en el flanco de subida." }
      - { texto: "El biestable tarda medio ciclo en responder", porque: "El retardo son nanosegundos, no medio ciclo: la mitad sale de cambiar una vez por flanco de subida." }
    escalera: ["¿Cuántos flancos de subida hacen falta para que Q suba y vuelva a bajar?"]
    solucion: "Dos flancos por cada ciclo de Q: un divisor por dos."

  - id: pregunta-setup-hold
    tipo: pregunta
    titulo: "La ventana del flanco"
    texto: "¿Qué exige un flip-flop D a su entrada alrededor del flanco de reloj?"
    libro: [55]
    widget:
      tipo: logica
      entradas: [D, { id: CLK, reloj: true }]
      piezas:
        - { id: f1, tipo: d, entradas: [D, CLK] }
      salidas:
        - { id: Q, de: f1.q }
      cronograma: { ciclos: 4, estimulo: { D: "0110" }, senales: [CLK, D, Q] }
      dibujo: false
    opciones:
      - { texto: "Que esté estable un tiempo antes (setup) y un tiempo después (hold)", bien: true, porque: "Si cambia dentro de esa ventana, la salida puede quedarse indecisa: metaestabilidad." }
      - { texto: "Que cambie justo en el flanco", porque: "Es lo contrario: un cambio dentro de la ventana puede dejar la salida indecisa." }
      - { texto: "Nada: captura lo que haya", porque: "El flip-flop necesita la entrada quieta alrededor del flanco; si no, puede quedar metaestable." }
    escalera: ["Piense en qué ocurre si D cambia en el mismo instante en que se captura."]
    solucion: "Estable desde t_{su} antes del flanco hasta t_{h} después."

  - id: pregunta-memoria
    tipo: pregunta
    titulo: "De dónde sale la memoria"
    texto: "¿Qué guarda un bit mientras hay alimentación?"
    libro: [54]
    widget:
      tipo: logica
      entradas: [{ id: CLK, reloj: true }, D]
      piezas:
        - { id: f1, tipo: d, entradas: [D, CLK] }
      salidas:
        - { id: Q, de: f1.q }
    opciones:
      - { texto: "Dos inversores en anillo, que se sostienen el uno al otro", bien: true, porque: "Es realimentación positiva: si uno está en alto, el otro en bajo lo mantiene así." }
      - { texto: "Un condensador cargado", porque: "Eso es la DRAM. El biestable guarda el bit con dos inversores realimentados." }
      - { texto: "Una sola puerta NAND", porque: "Una puerta sola es combinacional: sin realimentación no recuerda nada." }
    escalera: ["Piense en un lazo que se sostiene a sí mismo."]
    solucion: "Dos inversores en anillo: dos estados estables."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [51, 52, 55, 56]
    ideas:
      - { titulo: "Flip-flop D.", texto: "Captura D en el flanco de reloj y lo mantiene hasta el siguiente." }
      - { titulo: "JK.", texto: "Mantener, poner a 1, poner a 0 y conmutar." }
      - { titulo: "Divisor por dos.", texto: "Con Q̄ en su D cambia en cada flanco: la mitad de la frecuencia." }
      - { titulo: "Setup y hold.", texto: "La entrada, quieta alrededor del flanco." }
