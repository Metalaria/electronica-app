# Lección 1.2 de la sección 9.8 «Adaptación de Niveles entre Familias» (cap09). Formato: contenido/lecciones11/GUIA.md.
leccion: cap09/sec-9.8

libro:
  108: "una salida de 3,3 V puede no alcanzar el umbral de entrada alto de un circuito de 5 V"
  109: "inyecta corriente por sus diodos de protección y puede destruirla"
  114: "Con CMOS a 3,3 V, VOH ≈ 3,2 V"
  115: "3,3 V ataca directamente a una entrada TTL o TTL-compatible (HCT), y no a una CMOS pura (HC)"
  118: "con 10 kΩ vistos desde ella (por ejemplo, 15 kΩ y 30 kΩ, que dan 3,33 V) y 20 pF de capacidad de entrada, la constante es de 200 ns"
  119: "Diodo en serie con pull-up"
  120: "MOSFET de canal N con dos pull-up"
  121: "Funciona en ambos sentidos y solo con buses en drenador abierto"
  122: "Traductor unidireccional dedicado"
  123: "Traductor bidireccional automático"
  125: "Bajar tensión, señal lenta"
  128: "un traductor unidireccional puesto al revés no da ningún síntoma útil, solo silencio"
  133: "el enlace funciona por casualidad"
  "cap09#29": "Mezclar familias requiere comprobar que las salidas de una caen en las zonas válidas de la otra"

modelo:
  valores:
    V_in: { sim: "V_{entrada}", nombre: "salida de 5 V", unidad: V, valor: 5 }
    R_1: { sim: "R₁", nombre: "resistencia de arriba", unidad: Ω, valor: 15000 }
    R_2: { sim: "R₂", nombre: "resistencia de abajo", unidad: Ω, valor: 30000 }
    C_e: { sim: "C_{e}", nombre: "capacidad de entrada", unidad: F, valor: 20e-12 }
  calculos:
    V_out: { expr: "V_in*R_2/(R_1 + R_2)", sim: "V_{salida}", nombre: "tensión en la entrada de 3,3 V", unidad: V }
    I_d: { expr: "V_in/(R_1 + R_2)", sim: "I", nombre: "corriente del divisor", unidad: A }
    R_th: { expr: "par(R_1, R_2)", sim: "R₁ ‖ R₂", nombre: "resistencia vista desde la entrada", unidad: Ω }
    tau_d: { expr: "R_th*C_e", sim: "τ", nombre: "constante de tiempo", unidad: s }

tarjetas:
  - id: toque-familia
    tipo: tocar
    titulo: "Un 1 de 3,3 V"
    texto: "Una salida CMOS de 3,3 V da como mucho 3,2 V en alto. Toque la entrada de 5 V que no la reconoce con garantía."
    libro: [114, 115, "cap09#29"]
    widget:
      tipo: figura
      figura: fig-9.2
      zonas:
        - { id: ttl, rotulo: "Primera columna", rect: [58, 50, 44, 182] }
        - { id: hc, rotulo: "Segunda columna", rect: [159, 50, 44, 182] }
        - { id: lv33, rotulo: "Tercera columna", rect: [260, 110, 44, 122] }
        - { id: lv18, rotulo: "Cuarta columna", rect: [362, 160, 44, 72] }
    tocar:
      bien: [hc]
      porque:
        ttl: "TTL exige 2,0 V en alto: 3,2 V los supera con holgura y funciona directamente."
        lv33: "Es una entrada de 3,3 V, no de 5 V: allí 3,2 V es un alto válido."
        lv18: "Es una entrada de baja tensión, no de 5 V; con ella el problema sería el contrario, de alta a baja."
    exito: "La CMOS HC a 5 V exige 0,7 × 5 = 3,5 V: 3,2 V cae en su zona prohibida."
    escalera: ["Compare 3,2 V con el borde inferior del azul de cada columna de 5 V."]
    solucion: "La segunda columna, CMOS HC: exige 3,5 V."

  - id: prediga-alta-baja
    tipo: predecir
    titulo: "De alta a baja"
    texto: "Una salida de 5 V ataca una entrada de 3,3 V que no tolera 5 V. ¿Qué riesgo hay?"
    libro: [109]
    widget:
      tipo: figura
      figura: fig-9.2
      zonas:
        - { id: lv33, rotulo: "Tercera columna", rect: [260, 110, 44, 122], texto: "LVCMOS a 3,3 V: su escala acaba en 3,3 V." }
    opciones:
      - { texto: "Inyectar corriente por sus diodos de protección y destruirla", bien: true, porque: "O alimentar parcialmente el chip por sus pines. Es el fallo opuesto al de baja a alta." }
      - { texto: "Que no reconozca el 1", porque: "Ese es el fallo de baja a alta. Aquí sobra tensión, no falta." }
      - { texto: "Ninguno: 5 V es un 1 más claro", porque: "Pasa del techo de una entrada de 3,3 V: si no es tolerante a 5 V, la corriente entra por sus diodos." }
    escalera: ["¿Por dónde entra la tensión que sobra por encima de la alimentación?"]
    solucion: "Corriente por los diodos de protección: puede destruirla."

  - id: explore-divisor
    tipo: explorar
    titulo: "Un divisor para bajar"
    texto: "Un divisor baja los 5 V a la entrada de 3,3 V. Cambie las resistencias y mire la tensión y la constante de tiempo."
    libro: [118]
    widget:
      tipo: circuito
      esquema: divisor
      piezas: { fuente: V_in, arriba: R_1, abajo: R_2 }
      lectura: { valor: V_out, rotulo: "Tensión en la entrada" }
      datos:
        - { valor: tau_d, rotulo: "Con 20 pF de entrada, τ = {{tau_d}}" }
      corriente: I_d
      mide: { salida: V_out, corriente: I_d }
      mandos:
        - { valor: R_1, lista: [1000, 10000, 15000], rotulo: "R₁" }
        - { valor: R_2, lista: [2000, 20000, 30000], rotulo: "R₂" }
    requiere: { mover: [R_1, R_2] }

  - id: estime-tau
    tipo: pregunta
    fase: "Estime"
    titulo: "La velocidad del divisor"
    texto: "Con 15 kΩ y 30 kΩ y una entrada de 20 pF, ¿qué constante de tiempo tiene la señal?"
    libro: [118]
    fijar: { R_1: 15000, R_2: 30000 }
    widget:
      tipo: circuito
      esquema: divisor
      piezas: { fuente: V_in, arriba: R_1, abajo: R_2 }
      lectura: { valor: V_out, rotulo: "Tensión en la entrada" }
      mide: { salida: V_out }
    estimar:
      objetivo: "tau_d"
      unidad: s
      min: 0
      max: 0.000001
      paso: 0.00000001
      inicio: 0.0000006
      tol: 0.05
      rotulo: "τ"
    exito: "200 ns: sirve hasta unos cientos de kilohercios, no más."
    pistas:
      - { cuando: { valor: estimacion, mayor: 0.00000021 }, texto: "Se ha pasado: la entrada no ve las dos resistencias en serie, sino en paralelo." }
      - { texto: "Se ha quedado corto: 15 kΩ en paralelo con 30 kΩ dan 10 kΩ; multiplíquelos por 20 pF." }
    escalera: ["La entrada ve las dos resistencias en paralelo."]
    solucion: "15 ‖ 30 = 10 kΩ; 10 kΩ · 20 pF = 200 ns."
    comprobar:
      - { V_out: 3.33, R_th: 10000, tau_d: 0.0000002 }

  - id: porque-lento
    tipo: porque
    titulo: "¿Por qué es lento?"
    texto: "Un divisor en una línea de reloj rápida convierte los flancos en rampas. ¿Por qué?"
    libro: [118]
    widget:
      tipo: circuito
      esquema: divisor
      piezas: { fuente: V_in, arriba: R_1, abajo: R_2 }
      mide: { salida: V_out }
    opciones:
      - { texto: "La capacidad de entrada se carga a través de las dos resistencias en paralelo", bien: true, porque: "Con 10 kΩ y 20 pF, τ = 200 ns: el flanco se redondea y la frecuencia útil queda en cientos de kilohercios." }
      - { texto: "El divisor resta tensión al flanco", porque: "Reduce el nivel, como se busca; lo que redondea el flanco es la constante de tiempo con la capacidad." }
      - { texto: "Las resistencias se calientan", porque: "Con decenas de kilohmios disipan muy poco; el límite es la constante R · C." }
    escalera: ["¿Qué hay en la entrada, además de su umbral?"]
    solucion: "Una RC: la resistencia vista por la capacidad de entrada."

  - id: ordene-soluciones
    tipo: pregunta
    fase: "Ordene"
    titulo: "Cinco soluciones"
    texto: "Ordene las soluciones de menos a más."
    libro: [118, 119, 120, 122, 123]
    ordenar:
      - "Divisor resistivo"
      - "Diodo en serie con pull-up"
      - "MOSFET de canal N con dos pull-up"
      - "Traductor unidireccional dedicado"
      - "Traductor bidireccional automático"
    exito: "Del divisor, que solo baja tensión y es lento, al traductor que detecta el sentido solo."
    pistas:
      - { texto: "Empiece por dos resistencias y acabe por el integrado que detecta el sentido." }
    escalera: ["Las dos últimas son integrados; la primera, dos resistencias."]
    solucion: "Divisor, diodo con pull-up, MOSFET, traductor unidireccional y bidireccional automático."

  - id: empareje-decision
    tipo: pregunta
    fase: "Empareje"
    titulo: "La tabla de decisión"
    texto: "Una cada situación con su solución."
    libro: [121, 125]
    emparejar:
      - ["3,3 V → entrada TTL/HCT", "Nada"]
      - ["Bajar tensión, señal lenta", "Divisor"]
      - ["Bus I²C entre dominios", "MOSFET + pull-up"]
      - ["SPI o líneas rápidas unidireccionales", "Traductor dedicado"]
      - ["Sentido desconocido o mixto", "Bidireccional automático"]
    exito: "La comprobación previa resuelve la mitad de los casos: 3,3 V ataca TTL sin nada."
    pistas:
      - { texto: "I²C es de drenador abierto y bidireccional: solo una de las soluciones respeta las dos cosas." }
    escalera: ["Empiece por la que no necesita nada."]
    solucion: "Nada, divisor, MOSFET, traductor dedicado y bidireccional automático, en ese orden."

  - id: pregunta-al-reves
    tipo: pregunta
    titulo: "Un traductor al revés"
    texto: "Un traductor unidireccional se ha montado en el sentido contrario. ¿Qué síntoma da?"
    libro: [128]
    widget:
      tipo: figura
      figura: fig-9.9
      zonas:
        - { id: todo, rotulo: "La figura entera", rect: [0, 0, 450, 261], texto: "Qué solución corresponde a cada caso." }
    opciones:
      - { texto: "Ninguno útil: solo silencio", bien: true, porque: "Por eso se olvida tan fácilmente: no hay humo ni niveles raros, simplemente no pasa la señal." }
      - { texto: "Se calienta enseguida", porque: "No da ese aviso: el traductor puesto al revés no da ningún síntoma útil." }
      - { texto: "Invierte la señal", porque: "No la invierte: con el sentido equivocado no la transmite." }
    escalera: ["Piense en el error más silencioso de los tres."]
    solucion: "Silencio: no pasa nada por la línea."

  - id: pregunta-banco
    tipo: pregunta
    titulo: "La medida de un minuto"
    texto: "El enlace entre dos familias parece funcionar. ¿Qué se mide para saber si es por casualidad?"
    libro: [133]
    widget:
      tipo: figura
      figura: fig-9.2
      zonas:
        - { id: hc, rotulo: "Segunda columna", rect: [159, 50, 44, 182], texto: "CMOS HC: V_{IH} = 3,5 V." }
    opciones:
      - { texto: "El nivel alto real en la entrada del receptor, con el emisor dando un 1", bien: true, porque: "Si no supera con margen el V_{IH} del receptor, fallará con la temperatura o con otra unidad." }
      - { texto: "La tensión de la salida en vacío", porque: "Importa lo que llega a la entrada, con la carga puesta, no la salida sin conectar." }
      - { texto: "Nada: si funciona, funciona", porque: "Sin margen funciona por casualidad, y falla una vez cada mil transferencias." }
    escalera: ["¿Dónde importa el nivel: en la salida o en la entrada que lo lee?"]
    solucion: "El alto real en la entrada del receptor, frente a su V_{IH}."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [108, 109, 115, 125]
    ideas:
      - { titulo: "Dos fallos.", texto: "De baja a alta, no se reconoce el 1; de alta a baja, se daña la entrada." }
      - { titulo: "Antes, comparar.", texto: "V_{OH} frente a V_{IH}: 3,3 V ataca TTL y HCT, no HC." }
      - { titulo: "El divisor.", texto: "Solo baja tensión, y es lento: τ = (R₁ ‖ R₂) · C." }
      - { titulo: "I²C.", texto: "MOSFET con dos pull-up: bidireccional y en drenador abierto." }
