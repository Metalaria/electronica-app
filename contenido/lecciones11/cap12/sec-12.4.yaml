# Lección 1.2 de la sección 12.4 «Herramientas CAD para Electrónica» (cap12). Formato: GUIA.md.
# El esquema que se «captura» es el divisor del libro (sección 1.4: 12 V, 10 kΩ y 5 kΩ), con designadores R1 y R2.
leccion: cap12/sec-12.4

libro:
  100: "varias funciones que comparten una base de datos común"
  101: "Captura de esquemas"
  102: "Diseño de la placa"
  103: "que unen símbolo, encapsulado y metadatos"
  104: "Gerbers, taladro, lista de materiales, posiciones de montaje"
  105: "visualización 3D"
  106: "el esquema y la placa comparten la misma lista de conexiones"
  108: "libre, multiplataforma"
  109: "Su coste las sitúa en el ámbito de empresa."
  110: "el proyecto vive en un servicio ajeno"
  111: "dejó de venderlo y de darle soporte el 7 de junio de 2026"
  112: "la herramienta importa menos que el método"
  114: "si es texto, se versiona"
  119: "abrirlo dentro de dos años puede dar un resultado distinto del que se fabricó"
  120: "incrustar las bibliotecas en el proyecto"
  123: "malos en todo lo demás"
  124: "No verifica el circuito"
  125: "No conoce el componente real"
  128: "especificación → diagrama de bloques → esquema → ERC →"
  129: "→ asignación de encapsulados → colocación → trazado → DRC →"
  130: "→ visualización 3D → salidas → fabricación → montaje → validación"
  133: "imprimir la placa a escala 1:1"
  134: "el que detecta los errores que ninguna comprobación automática ve"
  "cap01#83": "Con 12 V, 10 kΩ y 5 kΩ, la salida es 4,00 V"

modelo:
  valores:
    V_in: { sim: "V_{entrada}", nombre: "tensión de la pila", unidad: V, valor: 12 }
    R_1: { sim: "R1", nombre: "resistencia de arriba", unidad: Ω, valor: 10000 }
    R_2: { sim: "R2", nombre: "resistencia de abajo", unidad: Ω, valor: 5000 }
  calculos:
    V_out: { expr: "V_in*R_2/(R_1 + R_2)", sim: "V_{salida}", nombre: "tensión de salida", unidad: V }
    I: { expr: "V_in/(R_1 + R_2)", sim: "I", nombre: "corriente", unidad: A }

tarjetas:
  - id: explore-anotacion
    tipo: explorar
    titulo: "Una sola base de datos"
    texto: "En un CAD, esquema y placa comparten la lista de conexiones. Cambie R2 en el esquema: el cambio llega a la placa y a la BOM."
    libro: [100, 106, "cap01#83"]
    widget:
      tipo: circuito
      esquema: divisor
      piezas: { fuente: V_in, arriba: R_1, abajo: R_2 }
      lectura: { valor: V_out, rotulo: "Tensión de salida" }
      corriente: I
      mide: { salida: V_out, corriente: I }
      mandos:
        - { valor: R_2, lista: [5000, 10000], rotulo: "R2 en el esquema" }
    requiere: { mover: [R_2] }

  - id: funciones
    tipo: pregunta
    fase: "Empareje"
    titulo: "Lo que reúne un CAD"
    texto: "Una cada función con lo que hace."
    libro: [101, 102, 103, 104, 105]
    emparejar:
      - ["Captura de esquemas", "Símbolos y comprobación de reglas"]
      - ["Diseño de la placa", "Reglas de trazado, enrutado y DRC"]
      - ["Bibliotecas", "Símbolo, encapsulado y metadatos"]
      - ["Generación de salidas", "Gerbers, taladro, BOM y posiciones"]
      - ["Visualización 3D", "Comprobar la mecánica"]
    exito: "Lo que las une es la anotación: el esquema y la placa comparten la misma lista de conexiones."
    pistas:
      - { texto: "El DRC es de la placa; el ERC, del esquema." }
    escalera:
      - "La biblioteca une tres cosas de cada componente."
    solucion: "Captura–símbolos y ERC; placa–trazado y DRC; bibliotecas–tres partes; salidas–fabricación; 3D–mecánica."

  - id: opciones-cad
    tipo: pregunta
    fase: "Empareje"
    titulo: "Las opciones"
    texto: "Una cada herramienta con lo que la caracteriza."
    libro: [108, 109, 110, 111]
    emparejar:
      - ["KiCad", "Libre, multiplataforma y plenamente capaz"]
      - ["Altium, Cadence, Siemens EDA", "Profesionales, de ámbito de empresa"]
      - ["EasyEDA", "En navegador: el proyecto vive en un servicio ajeno"]
      - ["Eagle", "Sin soporte desde 2026: importar en KiCad o Fusion"]
    exito: "KiCad es la elección natural para trabajo propio, formación y proyectos pequeños o medianos."
    pistas:
      - { texto: "Autodesk integró Eagle en Fusion." }
    escalera:
      - "La del navegador está ligada a un fabricante o distribuidor."
    solucion: "KiCad–libre; Altium y demás–empresa; EasyEDA–navegador; Eagle–sin soporte."

  - id: prediga-metodo
    tipo: predecir
    titulo: "Herramienta o método"
    texto: "Un buen diseño hecho con KiCad frente a uno malo hecho con Altium. ¿Cuál es mejor?"
    libro: [112]
    widget:
      tipo: circuito
      esquema: divisor
      piezas: { fuente: V_in, arriba: R_1, abajo: R_2 }
      lectura: { valor: V_out, rotulo: "Tensión de salida" }
      mide: { salida: V_out, corriente: I }
      ocultar: true
      mandos: []
    opciones:
      - texto: "El bueno con KiCad"
        bien: true
        porque: "La herramienta importa menos que el método: lo dicho del esquema y de la placa vale con cualquier programa."
      - texto: "El de Altium, por ser profesional"
        porque: "Un programa caro no arregla un mal diseño."
      - texto: "Ninguno: depende de la placa"
        porque: "Sí hay respuesta: el método manda sobre la herramienta."
    escalera:
      - "¿Qué decide la calidad: el programa o cómo se usa?"
    solucion: "El buen diseño, sea cual sea el programa."

  - id: formato-texto
    tipo: pregunta
    titulo: "Al elegir"
    texto: "¿Por qué conviene una herramienta cuyos ficheros de diseño son texto?"
    libro: [114]
    widget:
      tipo: circuito
      esquema: divisor
      piezas: { fuente: V_in, arriba: R_1, abajo: R_2 }
      lectura: { valor: V_out, rotulo: "Tensión de salida" }
      mide: { salida: V_out, corriente: I }
      mandos: []
    opciones:
      - texto: "Porque se versionan y se recuperan dentro de años"
        bien: true
        porque: "Con un formato binario y propietario se depende del programa."
      - texto: "Porque ocupan menos"
        porque: "El tamaño no es el motivo: lo es poder versionarlos y abrirlos sin el programa."
      - texto: "Porque se editan a mano"
        porque: "No se trata de editarlos a mano, sino de versionarlos y no depender del programa."
    escalera:
      - "Piense en el control de versiones."
    solucion: "Se versionan y se pueden recuperar años después."

  - id: por-que-incrustar
    tipo: porque
    titulo: "La biblioteca externa"
    texto: "El proyecto depende de bibliotecas externas que después cambian. ¿Por qué conviene incrustarlas en él?"
    libro: [119, 120]
    widget:
      tipo: circuito
      esquema: divisor
      piezas: { fuente: V_in, arriba: R_1, abajo: R_2 }
      lectura: { valor: V_out, rotulo: "Tensión de salida" }
      mide: { salida: V_out, corriente: I }
      mandos: []
    opciones:
      - texto: "Porque al abrirlo años después podría dar otra cosa que lo fabricado"
        bien: true
        porque: "Incrustadas, el proyecto es autocontenido: conviene activarlo siempre."
      - texto: "Porque así el programa va más rápido"
        porque: "No es cuestión de velocidad: es que el proyecto no cambie solo."
      - texto: "Porque las externas tienen errores"
        porque: "Pueden estar bien; el problema es que cambien después de fabricar."
    escalera:
      - "¿Qué pasa si un símbolo de la biblioteca externa se modifica?"
    solucion: "Para que el proyecto no cambie cuando cambia la biblioteca."

  - id: no-hace
    tipo: pregunta
    fase: "Empareje"
    titulo: "Lo que la herramienta no hace"
    texto: "Una cada limitación con su explicación."
    libro: [123, 124, 125]
    emparejar:
      - ["No diseña", "No sabe qué señales son críticas ni dónde importa el retorno"]
      - ["No verifica el circuito", "ERC y DRC comprueban coherencia, no que funcione"]
      - ["No conoce el componente real", "Símbolo y encapsulado los une quien los introdujo"]
    exito: "El enrutado automático es aceptable en placas digitales sencillas y malo en todo lo demás."
    pistas:
      - { texto: "El ERC es como un compilador: no prueba que el programa haga lo que debe." }
    escalera:
      - "La correspondencia símbolo-encapsulado es responsabilidad humana."
    solucion: "No diseña–no sabe lo crítico; no verifica–solo coherencia; no conoce la pieza–la une usted."

  - id: flujo
    tipo: pregunta
    fase: "Ordene"
    titulo: "El flujo completo"
    texto: "Ordene las etapas, de la especificación a la validación."
    libro: [128, 129, 130]
    ordenar:
      - "Especificación"
      - "Diagrama de bloques"
      - "Esquema y ERC"
      - "Asignación de encapsulados"
      - "Colocación y trazado"
      - "DRC y visualización 3D"
      - "Salidas, fabricación, montaje y validación"
    exito: "Con dos retornos previstos: del trazado al esquema y de la validación al diseño."
    pistas:
      - { texto: "El ERC es del esquema; el DRC, de la placa ya trazada." }
    escalera:
      - "Los encapsulados se asignan antes de colocar."
    solucion: "Especificación, bloques, esquema y ERC, encapsulados, colocación y trazado, DRC y 3D, salidas."

  - id: impresion
    tipo: pregunta
    titulo: "En el banco"
    texto: "¿Qué paso del flujo no depende del programa y detecta lo que ninguna comprobación automática ve?"
    libro: [133, 134]
    widget:
      tipo: circuito
      esquema: divisor
      piezas: { fuente: V_in, arriba: R_1, abajo: R_2 }
      lectura: { valor: V_out, rotulo: "Tensión de salida" }
      mide: { salida: V_out, corriente: I }
      mandos: []
    opciones:
      - texto: "Imprimir la placa a escala 1:1 y colocar encima los componentes reales"
        bien: true
        porque: "Enlaza la herramienta con la realidad: almohadillas, contornos y conectores se comprueban con las piezas."
      - texto: "Pasar el DRC dos veces"
        porque: "El DRC es automático y depende del programa; la impresión 1:1 no."
      - texto: "Mirar el modelo 3D"
        porque: "El modelo 3D también es del programa: si la huella está mal, el 3D la dibuja igual de mal."
    escalera:
      - "Necesita papel y las piezas de verdad."
    solucion: "La impresión 1:1 con los componentes encima."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [106, 112, 120, 123]
    ideas:
      - { titulo: "Una base de datos.", texto: "Esquema y placa comparten la lista de conexiones." }
      - { titulo: "El método.", texto: "Importa más que la herramienta." }
      - { titulo: "Al elegir.", texto: "Ficheros de texto, portabilidad, bibliotecas y comunidad; bibliotecas incrustadas." }
      - { titulo: "No diseña.", texto: "Ni verifica el circuito ni conoce la pieza real." }
