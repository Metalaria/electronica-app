# Lección de la sección 12.4 «Herramientas CAD para Electrónica» (cap12). Formato: GUIA.md.
# El esquema que se «captura» es el divisor del libro (sección 1.4: 12 V, 10 kΩ y 5 kΩ), con designadores R1 y R2.
# 1.2.1 (aprender haciendo): cambiar R2 hasta un objetivo, tocar la función, la herramienta, el criterio y la
# limitación que pide cada caso, y ordenar el flujo tocando. Dos preguntas: el método y la biblioteca incrustada.
# 1.2.1, segunda pasada: sin listas de respuestas disfrazadas; quedan las tarjetas que se hacen y dos preguntas.
leccion: cap12/sec-12.4

libro:
  135: "Lo que reúne un paquete de CAD y lo que la herramienta no"
  115: "Portabilidad"
  116: "Bibliotecas disponibles para los componentes que se van a"
  117: "Comunidad y documentación, que en la práctica determinan"
  122: "Merece enunciarse porque se espera de más"
  127: "Reuniendo lo que se ha ido diciendo"
  131: "Con dos puntos de retorno que conviene prever"
  100: "varias funciones que comparten una base de datos común"
  101: "Captura de esquemas"
  102: "Diseño de la placa"
  103: "que unen símbolo, encapsulado y metadatos"
  104: "Gerbers, taladro, lista de materiales, posiciones de montaje"
  105: "visualización 3D"
  106: "el esquema y la placa comparten la misma lista de conexiones"
  108: "libre, multiplataforma"
  109: "Su coste las sitúa en el ámbito de empresa."
  110: "el proyecto vive en un servicio ajeno"
  111: "dejó de venderlo y de darle soporte el 7 de junio de 2026"
  112: "la herramienta importa menos que el método"
  114: "si es texto, se versiona"
  119: "abrirlo dentro de dos años puede dar un resultado distinto del que se fabricó"
  120: "incrustar las bibliotecas en el proyecto"
  123: "malos en todo lo demás"
  124: "No verifica el circuito"
  125: "No conoce el componente real"
  128: "especificación → diagrama de bloques → esquema → ERC →"
  129: "→ asignación de encapsulados → colocación → trazado → DRC →"
  130: "→ visualización 3D → salidas → fabricación → montaje → validación"
  133: "imprimir la placa a escala 1:1"
  134: "el que detecta los errores que ninguna comprobación automática ve"
  "cap01#83": "Con 12 V, 10 kΩ y 5 kΩ, la salida es 4,00 V"

modelo:
  valores:
    V_in: { sim: "V_{entrada}", nombre: "tensión de la pila", unidad: V, valor: 12 }
    R_1: { sim: "R1", nombre: "resistencia de arriba", unidad: Ω, valor: 10000 }
    R_2: { sim: "R2", nombre: "resistencia de abajo", unidad: Ω, valor: 5000 }
  calculos:
    V_out: { expr: "V_in*R_2/(R_1 + R_2)", sim: "V_{salida}", nombre: "tensión de salida", unidad: V }
    I: { expr: "V_in/(R_1 + R_2)", sim: "I", nombre: "corriente", unidad: A }

tarjetas:
  - id: explore-anotacion
    tipo: explorar
    titulo: "Una sola base de datos"
    texto: "En un CAD, esquema y placa comparten la lista de conexiones. Cambie R2 hasta que la salida sea la mitad: el cambio llega a la placa y a la BOM."
    libro: [100, 106, "cap01#83"]
    widget:
      tipo: circuito
      esquema: divisor
      piezas: { fuente: V_in, arriba: R_1, abajo: R_2 }
      lectura: { valor: V_out, rotulo: "Tensión de salida" }
      corriente: I
      mide: { salida: V_out, corriente: I }
      mandos:
        - { valor: R_2, lista: [5000, 10000], rotulo: "R2 en el esquema" }
    objetivo:
      condiciones:
        - { valor: V_out, objetivo: 6, tol: 0.02, rotulo: "Salida: {{V_out}}" }
      logrado: "R2 = {{R_2}} en el esquema, y la herramienta lo propaga a la placa señalando lo que hay que corregir."
      pistas:
        - { texto: "Elija para R2 el mismo valor que R1." }
    escalera:
      - "La mitad cae en R2 cuando vale lo mismo que R1."
    solucion: "R2 = 10 kΩ."
    comprobar:
      - { con: { R_2: 10000 }, V_out: 6 }

  - id: lista-comun
    tipo: tocar
    titulo: "El cambio llega solo"
    texto: "Cambia R2 en el esquema y el cambio aparece en la placa y en la BOM. Toque lo que lo garantiza."
    libro: [106, 135]
    widget:
      tipo: figura
      figura: fig-12.6
      zonas:
        - { id: captura, rotulo: "Captura de esquemas", rect: [4, 26, 112, 38] }
        - { id: placa, rotulo: "Diseño de la placa", rect: [130, 26, 112, 38] }
        - { id: lista, rotulo: "Lista de conexiones común", rect: [33, 76, 180, 36] }
        - { id: bibliotecas, rotulo: "Bibliotecas", rect: [4, 125, 112, 38] }
    tocar:
      bien: [lista]
      porque:
        captura: "Ahí se hizo el cambio; no es lo que lo propaga."
        placa: "La placa recibe el cambio; no lo propaga."
        bibliotecas: "Unen símbolo y encapsulado, no los cambios de valor."
    exito: "Esquema y placa comparten la misma lista de conexiones: siempre coinciden."
    escalera:
      - "Esquema y placa comparten algo."
    solucion: "La lista de conexiones común."

  - id: autorrutador
    tipo: tocar
    titulo: "Una pista crítica mal llevada"
    texto: "El autorrutador llevó una pista crítica por un camino malo. Toque lo que la herramienta no hace."
    libro: [123, 135]
    widget:
      tipo: figura
      figura: fig-12.6
      zonas:
        - { id: nodisena, rotulo: "No diseña", rect: [256, 26, 195, 42] }
        - { id: noverifica, rotulo: "No verifica el circuito", rect: [256, 77, 195, 44] }
        - { id: noconoce, rotulo: "No conoce el componente real", rect: [256, 128, 195, 44] }
    tocar:
      bien: [nodisena]
      porque:
        noverifica: "Eso es que el diseño funcione; aquí el problema es el trazado."
        noconoce: "Eso es la correspondencia símbolo-encapsulado."
    exito: "El autorrutado no sabe qué señales son críticas ni dónde importa el retorno."
    escalera:
      - "¿Qué decide qué pista es crítica?"
    solucion: "No diseña."

  - id: pasa-drc
    tipo: tocar
    titulo: "Pasa el ERC y el DRC"
    texto: "El diseño pasa el ERC y el DRC sin avisos, y el circuito no funciona. Toque lo que la herramienta no hace."
    libro: [124, 135]
    widget:
      tipo: figura
      figura: fig-12.6
      zonas:
        - { id: nodisena, rotulo: "No diseña", rect: [256, 26, 195, 42] }
        - { id: noverifica, rotulo: "No verifica el circuito", rect: [256, 77, 195, 44] }
        - { id: noconoce, rotulo: "No conoce el componente real", rect: [256, 128, 195, 44] }
    tocar:
      bien: [noverifica]
      porque:
        nodisena: "Eso es el trazado automático."
        noconoce: "Eso es la correspondencia símbolo-encapsulado."
    exito: "ERC y DRC comprueban coherencia y geometría, no que el diseño funcione."
    escalera:
      - "¿Qué comprueban ERC y DRC?"
    solucion: "No verifica el circuito."

  - id: prediga-metodo
    tipo: predecir
    titulo: "Herramienta o método"
    texto: "Un buen diseño hecho con KiCad frente a uno malo hecho con Altium. ¿Cuál es mejor?"
    libro: [112]
    widget:
      tipo: circuito
      esquema: divisor
      piezas: { fuente: V_in, arriba: R_1, abajo: R_2 }
      lectura: { valor: V_out, rotulo: "Tensión de salida" }
      mide: { salida: V_out, corriente: I }
      ocultar: true
      mandos: []
    opciones:
      - texto: "El bueno con KiCad"
        bien: true
        porque: "La herramienta importa menos que el método: lo dicho del esquema y de la placa vale con cualquier programa."
      - texto: "El de Altium, por ser profesional"
        porque: "Un programa caro no arregla un mal diseño."
      - texto: "Ninguno: depende de la placa"
        porque: "Sí hay respuesta: el método manda sobre la herramienta."
    escalera:
      - "¿Qué decide la calidad: el programa o cómo se usa?"
    solucion: "El buen diseño, sea cual sea el programa."

  - id: por-que-incrustar
    tipo: porque
    titulo: "La biblioteca externa"
    texto: "El proyecto depende de bibliotecas externas que después cambian. ¿Por qué conviene incrustarlas en él?"
    libro: [119, 120]
    widget:
      tipo: circuito
      esquema: divisor
      piezas: { fuente: V_in, arriba: R_1, abajo: R_2 }
      lectura: { valor: V_out, rotulo: "Tensión de salida" }
      mide: { salida: V_out, corriente: I }
      mandos: []
    opciones:
      - texto: "Porque al abrirlo años después podría dar otra cosa que lo fabricado"
        bien: true
        porque: "Incrustadas, el proyecto es autocontenido: conviene activarlo siempre."
      - texto: "Porque así el programa va más rápido"
        porque: "No es cuestión de velocidad: es que el proyecto no cambie solo."
      - texto: "Porque las externas tienen errores"
        porque: "Pueden estar bien; el problema es que cambien después de fabricar."
    escalera:
      - "¿Qué pasa si un símbolo de la biblioteca externa se modifica?"
    solucion: "Para que el proyecto no cambie cuando cambia la biblioteca."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [106, 112, 120, 123, 101, 102, 103, 104, 105, 108, 109, 110, 111, 114, 115, 116, 117, 122, 124, 125, 127, 128, 129, 130, 131, 133, 134]
    ideas:
      - { titulo: "Una base de datos.", texto: "Esquema y placa comparten la lista de conexiones." }
      - { titulo: "El método.", texto: "Importa más que la herramienta." }
      - { titulo: "Al elegir.", texto: "Ficheros de texto, portabilidad, bibliotecas y comunidad; bibliotecas incrustadas." }
      - { titulo: "No diseña.", texto: "Ni verifica el circuito ni conoce la pieza real." }
