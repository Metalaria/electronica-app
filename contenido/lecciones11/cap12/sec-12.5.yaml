# Lección de la sección 12.5 «Diseño Jerárquico y Comprobación de Reglas (ERC)» (cap12). Formato: GUIA.md.
# La alimentación sin fuente (bloque 148) se ve con el LED del libro (sección 5.4: LED rojo de 2,0 V a 20 mA desde
# 5 V, con 150 Ω): sin el símbolo que une la red VCC a la fuente, nadie entrega tensión a esa red.
# 1.2 (esquemas12d): el `led` con `etiqueta` (VCC, la de la fuente) y `etiqueta2` (VCC_A, la del LED): abierto, el LED
# cuelga de VCC_A, una red a la que nada entrega tensión (bloques 148 y 160); un toque en su etiqueta la corrige.
# 1.2.1 (aprender haciendo): encender el LED corrigiendo la red, tocar la ventaja, el aviso, la causa y la revisión que
# pide cada caso, y ordenar la puesta en marcha. Dos preguntas: una frase por hoja y los avisos «conocidos».
# 1.2.1, segunda pasada: sin listas de respuestas disfrazadas; quedan las tarjetas que se hacen y dos preguntas.
# 1.3 (contenido13): vuelven, haciendo, la medida de la red sin fuente (antes de corregirla), abrir un bloque en su
# hoja (objetivo de zonas en orden, fig-12.7) y la depuración por bloques empezando por la fuente: 3/4 → 6/7.
leccion: cap12/sec-12.5

libro:
  166: "El diseño jerárquico y el papel del ERC"
  138: "Un esquema de treinta componentes cabe en una hoja y se"
  144: "Lo que encuentra"
  155: "Las tres causas habituales"
  159: "Además del ERC hay tres comprobaciones que conviene hacer"
  161: "Revisión de la BOM"
  163: "Y cuando el esquema pasa todas estas revisiones, se guarda"
  139: "organiza el esquema en niveles"
  140: "un bloque probado se copia a otro proyecto entero"
  141: "si no se puede describir en una frase, está mal repartida"
  143: "es el equivalente al compilador de un programa"
  145: "Casi siempre es una etiqueta mal escrita"
  146: "distingue «lo he decidido» de «se me ha olvidado»"
  147: "Dos salidas conectadas entre sí"
  148: "una red marcada como VCC a la que ningún componente entrega tensión"
  149: "Componentes duplicados o sin designador."
  151: "llegar a cero"
  152: "el error número cuarenta y uno pasará desapercibido"
  154: "el ERC no lo detecta"
  156: "pin 1 en el sitio contrario"
  157: "verificar contra la hoja de datos"
  160: "VCC y VCC_A"
  162: "la única que detecta los conceptuales"
  165: "siempre con límite de corriente en la fuente"
  "cap05#133": "Alimentar un LED rojo de 2,0 V nominales a 20 mA desde 5 V."
  "cap53#176": "Una alimentación incorrecta explica casi cualquier síntoma, y por eso es la primera medida de todo diagnóstico"

modelo:
  valores:
    V_e: { sim: "VCC", nombre: "tensión de la fuente", unidad: V, valor: 5 }
    R_e: { sim: "R1", nombre: "resistencia del LED", unidad: Ω, valor: 150 }
    V_fe: { sim: "V_{f}", nombre: "tensión del LED", unidad: V, valor: 2 }
    unida: { tipo: interruptor, sim: "VCC", nombre: "la red del LED es la de la fuente", valor: 0 }
    et2: { sim: "VCC_A", nombre: "red del LED sin fuente", unidad: "", valor: 0 }
  calculos:
    I_e: { expr: "unida*max(0, (V_e - V_fe)/R_e)", sim: "I", nombre: "corriente del LED", unidad: A }
    V_a: { expr: "unida*(V_e - I_e*R_e)", sim: "V_{LED}", nombre: "tensión del LED", unidad: V }

tarjetas:
  - id: mida-sin-fuente
    tipo: medir
    titulo: "El dibujo parece correcto"
    texto: "El ERC avisa de una alimentación sin fuente, pero el esquema parece bien. Ponga las puntas donde se ve si al LED le llega tensión."
    libro: [148, 160]
    fijar: { unida: 0 }
    widget:
      tipo: circuito
      esquema: led
      piezas: { fuente: V_e, r: R_e, vf: V_fe, etiqueta: unida, etiqueta2: et2 }
      corriente: I_e
      mide: { corriente: I_e, vf: V_a }
      instrumento:
        tipo: multimetro
        modos: [V]
        puntos: { fte: "Arriba de la fuente", a: "Tras la etiqueta del LED", "0": "Masa, abajo" }
      mandos: []
    medir:
      magnitud: tension
      entre: [a, "0"]
      valor: V_a
      porque:
        fte: "Esa es la fuente: tiene sus 5 V. El LED cuelga de otra etiqueta."
    exito: "0 V tras la etiqueta: VCC_A no es VCC. Dos redes con nombres parecidos que deberían ser la misma."
    escalera:
      - "Mida justo después de la etiqueta de la que cuelga el LED."
    solucion: "Roja tras la etiqueta del LED y negra en masa: 0 V."
    comprobar:
      - { V_a: 0, I_e: 0 }

  - id: explore-sin-fuente
    tipo: explorar
    titulo: "Una alimentación sin fuente"
    texto: "El LED cuelga de VCC_A, una red a la que nada entrega tensión. Llame VCC a su etiqueta hasta que el LED encienda."
    nota: "El LED rojo del libro: 2,0 V a 20 mA desde 5 V."
    libro: [148, 160, "cap05#133"]
    widget:
      tipo: circuito
      esquema: led
      piezas: { fuente: V_e, r: R_e, vf: V_fe, etiqueta: unida, etiqueta2: et2 }
      lectura: { valor: I_e, rotulo: "Corriente del LED" }
      corriente: I_e
      mide: { corriente: I_e, vf: V_a }
      mandos:
        - { valor: unida, tipo: interruptor, rotulo: "Etiqueta del LED: VCC" }
    objetivo:
      condiciones:
        - { valor: I_e, min: 0.015, rotulo: "LED: {{I_e}}" }
      logrado: "Unida a VCC, la red del LED ya tiene quien le entregue tensión: {{I_e}}."
      pistas:
        - { texto: "Llame VCC a la etiqueta del LED." }
    escalera:
      - "Una red sin nadie que le entregue tensión es una alimentación sin fuente."
    solucion: "Etiqueta del LED en VCC: 20 mA."
    comprobar:
      - { con: { unida: 1 }, I_e: 0.02 }

  - id: explore-jerarquia
    tipo: explorar
    titulo: "Bloques que se abren"
    texto: "La hoja superior tiene bloques unidos por buses y señales, y cada uno se abre en su hoja. Toque el bloque de adquisición y después su hoja."
    libro: [139, 166]
    widget:
      tipo: figura
      figura: fig-12.7
      zonas:
        - { id: fuente, rotulo: "Bloque de arriba a la izquierda", rect: [5, 30, 64, 67] }
        - { id: adquisicion, rotulo: "Bloque de arriba a la derecha", rect: [69, 30, 64, 67] }
        - { id: comunicacion, rotulo: "Bloque de abajo a la izquierda", rect: [5, 97, 64, 68] }
        - { id: interfaz, rotulo: "Bloque de abajo a la derecha", rect: [69, 97, 64, 68] }
        - { id: hoja, rotulo: "Hoja de la derecha", rect: [144, 30, 98, 135], texto: "La hoja «Adquisición»: su circuito, que entra y sale por puertos." }
    objetivo:
      orden: true
      condiciones:
        - { zona: adquisicion, rotulo: "El bloque" }
        - { zona: hoja, rotulo: "Su hoja" }
      logrado: "Cada bloque se abre en su propia hoja: la misma idea que las funciones en programación, con la misma legibilidad y la misma reutilización."
      pistas:
        - { texto: "Empiece por el bloque de arriba a la derecha de la hoja superior." }
    escalera:
      - "Primero el bloque «Adquisición»; luego la hoja a la que se abre."
    solucion: "El bloque de arriba a la derecha y la hoja «Adquisición»."

  - id: una-frase
    tipo: pregunta
    titulo: "Una hoja, una función"
    texto: "¿Cómo sabe si una hoja de un diseño jerárquico está bien repartida?"
    libro: [141]
    widget:
      tipo: circuito
      esquema: led
      piezas: { fuente: V_e, r: R_e, vf: V_fe, etiqueta: unida, etiqueta2: et2 }
      lectura: { valor: I_e, rotulo: "Corriente del LED" }
      mide: { corriente: I_e, vf: V_a }
      mandos: []
    opciones:
      - texto: "Si su función se describe en una frase"
        bien: true
        porque: "Cada hoja debe tener una función identificable; si no cabe en una frase, está mal repartida."
      - texto: "Si tiene el mismo número de componentes que las demás"
        porque: "El reparto es por función, no por número de piezas."
      - texto: "Si cabe en una hoja A4"
        porque: "Caber es necesario, pero lo que decide es que tenga una función identificable."
    escalera:
      - "Piense en una función de un programa bien escrita."
    solucion: "Si su función se puede describir en una frase."

  - id: arquitectura
    tipo: tocar
    titulo: "Sin detalle"
    texto: "Quiere ver la arquitectura del aparato sin perderse en el detalle. Toque la hoja."
    libro: [140, 166]
    widget:
      tipo: figura
      figura: fig-12.7
      zonas:
        - { id: superior, rotulo: "Hoja superior", rect: [5, 30, 128, 135] }
        - { id: adquisicion, rotulo: "Hoja «Adquisición»", rect: [144, 30, 98, 135] }
    tocar:
      bien: [superior]
      porque:
        adquisicion: "Ahí está el detalle de un bloque, que entra y sale por puertos."
    exito: "En la hoja superior se ve la arquitectura sin detalle."
    escalera:
      - "Cada bloque es una hoja de abajo."
    solucion: "La hoja superior."

  - id: aviso-nuevo
    tipo: tocar
    titulo: "Que el nuevo se vea"
    texto: "Quiere que el próximo aviso del ERC no pase desapercibido. Toque lo que lo consigue."
    libro: [151, 152, 166]
    widget:
      tipo: figura
      figura: fig-12.7
      zonas:
        - { id: superior, rotulo: "Hoja superior", rect: [5, 30, 128, 135] }
        - { id: detecta, rotulo: "Recuadro «Lo que detecta»", rect: [256, 40, 195, 90] }
        - { id: cero, rotulo: "Recuadro «Llegar a cero avisos»", rect: [256, 138, 195, 46] }
    tocar:
      bien: [cero]
      porque:
        superior: "La jerarquía ordena el esquema; no gestiona los avisos."
        detecta: "Es lo que el ERC encuentra, no cómo tratarlo."
    exito: "Llegar a cero avisos, marcando lo intencionado como «no conectado»."
    escalera:
      - "Con cuarenta conocidos, el cuarenta y uno se pierde."
    solucion: "Llegar a cero avisos."

  - id: toque-depurar
    tipo: tocar
    titulo: "Depurar por bloques"
    texto: "El aparato no funciona y se diagnostica por bloques. Toque el que se comprueba primero."
    libro: [140, "cap53#176"]
    widget:
      tipo: figura
      figura: fig-12.7
      zonas:
        - { id: fuente, rotulo: "Bloque de arriba a la izquierda", rect: [5, 30, 64, 67] }
        - { id: adquisicion, rotulo: "Bloque de arriba a la derecha", rect: [69, 30, 64, 67] }
        - { id: comunicacion, rotulo: "Bloque de abajo a la izquierda", rect: [5, 97, 64, 68] }
        - { id: interfaz, rotulo: "Bloque de abajo a la derecha", rect: [69, 97, 64, 68] }
    tocar:
      bien: [fuente]
      porque:
        adquisicion: "Si la alimentación falla, la adquisición también parecerá rota: primero, lo que alimenta a todos."
        comunicacion: "Un raíl bajo hace fallar la comunicación sin que la culpa sea suya."
        interfaz: "La interfaz depende de la fuente como los demás bloques."
    exito: "La fuente: una alimentación incorrecta explica casi cualquier síntoma, y por eso es la primera medida de todo diagnóstico."
    escalera:
      - "¿De qué bloque dependen todos los demás?"
    solucion: "El bloque de la fuente, arriba a la izquierda."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [139, 143, 151, 157, 138, 140, 144, 145, 146, 147, 149, 154, 155, 156, 159, 161, 162, 163, 165]
    ideas:
      - { titulo: "Jerarquía.", texto: "Niveles de hojas, cada una con una función que cabe en una frase." }
      - { titulo: "ERC.", texto: "Un compilador del esquema: detecta lo mecánico, no que funcione." }
      - { titulo: "Cero avisos.", texto: "Marcando lo intencionado; si no, el siguiente error se pierde." }
      - { titulo: "Patillaje.", texto: "El ERC no lo ve: contra la hoja de datos." }
