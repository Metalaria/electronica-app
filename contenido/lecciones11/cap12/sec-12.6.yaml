# Lección de la sección 12.6 «Bibliotecas, Reutilización y Control de Versiones» (cap12). Formato: GUIA.md.
# La huella girada (bloque 175) se ve con el LED del libro (sección 5.4: LED rojo de 2,0 V a 20 mA desde 5 V, con
# 150 Ω): girada respecto a la serigrafía, la pieza queda al revés y no conduce (se simula invirtiendo la tensión que
# ve el LED). 1.2.1 (aprender haciendo): montar según la huella girada hasta que el LED no luzca, tocar la parte, el
# error, la verificación y el aporte que pide cada caso. Dos preguntas: el error caro y la fiabilidad del bloque.
# 1.2.1, segunda pasada: sin listas de respuestas disfrazadas; quedan las tarjetas que se hacen y dos preguntas.
leccion: cap12/sec-12.6

libro:
  196: "Las tres partes de un componente de biblioteca y las"
  169: "En una herramienta de diseño, un componente reúne"
  172: "Los tres errores de encapsulado"
  177: "Antes de enviar a fabricar, tres comprobaciones sobre los"
  184: "Los ficheros de las herramientas modernas son texto, y se"
  170: "con la geometría de las almohadillas y la correspondencia pin-almohadilla"
  171: "el encapsulado es donde se cometen los errores caros"
  173: "el orden de las patillas varía entre fabricantes"
  174: "un contorno que no corresponde al componente real"
  175: "Orientación del pin 1"
  178: "Cotejar el patillaje"
  179: "cinco minutos y una hoja de papel"
  181: "porque un bloque probado tiene los errores ya encontrados"
  182: "como hoja jerárquica independiente"
  185: "qué cambió, cuándo y por qué"
  186: "etiquetar la versión exacta que se envía a fabricar"
  189: "Biblioteca propia por encima de las genéricas."
  193: "un componente descatalogado obliga a rediseñar"
  195: "colocar los componentes en su sitio sin soldar"
  "cap05#133": "Alimentar un LED rojo de 2,0 V nominales a 20 mA desde 5 V."

modelo:
  valores:
    V_e: { sim: "+5V", nombre: "tensión de la fuente", unidad: V, valor: 5 }
    R_e: { sim: "R1", nombre: "resistencia del LED", unidad: Ω, valor: 150 }
    V_fe: { sim: "V_{f}", nombre: "tensión del LED", unidad: V, valor: 2 }
    rev: { tipo: interruptor, nombre: "LED montado según la huella girada", valor: 0 }
  calculos:
    I_e: { expr: "(1 - rev)*max(0, (V_e - V_fe)/R_e)", sim: "I", nombre: "corriente del LED", unidad: A }

tarjetas:
  - id: explore-huella
    tipo: explorar
    titulo: "Una huella girada"
    texto: "La huella del LED en la biblioteca está girada respecto a la serigrafía. Móntelo según la huella hasta que el LED se apague."
    nota: "El LED rojo del libro: 2,0 V a 20 mA desde 5 V."
    libro: [175, "cap05#133"]
    widget:
      tipo: circuito
      esquema: led
      piezas: { fuente: V_e, r: R_e, vf: V_fe, reves: rev }
      lectura: { valor: I_e, rotulo: "Corriente del LED" }
      corriente: I_e
      mide: { corriente: I_e }
      mandos:
        - { valor: rev, tipo: interruptor, rotulo: "Montado según la huella girada" }
    objetivo:
      condiciones:
        - { valor: I_e, max: 0.000001, rotulo: "LED: {{I_e}}" }
      logrado: "Montado según la huella girada, el LED queda al revés y no luce: el error no se ve hasta tener la placa."
      pistas:
        - { texto: "Monte el LED según la huella." }
    escalera:
      - "El pin 1 girado respecto a la serigrafía monta la pieza al revés."
    solucion: "Según la huella girada, el LED queda al revés: 0 mA."
    comprobar:
      - { con: { rev: 1 }, I_e: 0 }

  - id: huella-girada
    tipo: tocar
    titulo: "Dónde estaba el error"
    texto: "La huella girada no se vio hasta tener la placa fabricada. Toque la parte del componente donde estaba."
    libro: [171, 196]
    widget:
      tipo: figura
      figura: fig-12.8
      zonas:
        - { id: simbolo, rotulo: "Símbolo", rect: [4, 4, 140, 140] }
        - { id: encapsulado, rotulo: "Encapsulado", rect: [156, 4, 140, 140] }
        - { id: metadatos, rotulo: "Metadatos", rect: [310, 4, 140, 140] }
    tocar:
      bien: [encapsulado]
      porque:
        simbolo: "Un error de símbolo se ve al dibujar o lo detecta el ERC."
        metadatos: "Los metadatos van a la lista de materiales."
    exito: "Un error de encapsulado no se ve hasta tener la placa fabricada."
    escalera:
      - "¿Qué parte describe las almohadillas?"
    solucion: "El encapsulado."

  - id: to92
    tipo: tocar
    titulo: "TO-92 y TO-220"
    texto: "Va a usar un transistor en TO-92 de un fabricante nuevo. Toque la comprobación que no se puede saltar."
    libro: [196]
    widget:
      tipo: figura
      figura: fig-12.8
      zonas:
        - { id: cotejar, rotulo: "Cotejar el patillaje", rect: [4, 170, 140, 52] }
        - { id: imprimir, rotulo: "Imprimir a escala 1:1", rect: [156, 170, 140, 52] }
        - { id: modelo3d, rotulo: "Revisar el modelo 3D", rect: [310, 170, 140, 52] }
    tocar:
      bien: [cotejar]
      porque:
        imprimir: "Comprueba tamaños, no el orden de las patillas."
        modelo3d: "Comprueba alturas y colisiones."
    exito: "En TO-92 y TO-220 el orden de patillas varía: con la hoja de datos del componente exacto."
    escalera:
      - "¿Qué cambia de un fabricante a otro?"
    solucion: "Cotejar el patillaje."

  - id: papel
    tipo: tocar
    titulo: "Cinco minutos"
    texto: "Toque la comprobación más eficaz, que cuesta cinco minutos y una hoja de papel."
    libro: [196]
    widget:
      tipo: figura
      figura: fig-12.8
      zonas:
        - { id: cotejar, rotulo: "Cotejar el patillaje", rect: [4, 170, 140, 52] }
        - { id: imprimir, rotulo: "Imprimir a escala 1:1", rect: [156, 170, 140, 52] }
        - { id: modelo3d, rotulo: "Revisar el modelo 3D", rect: [310, 170, 140, 52] }
    tocar:
      bien: [imprimir]
      porque:
        cotejar: "Necesita la hoja de datos, no papel impreso."
        modelo3d: "Se hace en el programa, no en papel."
    exito: "Imprimir a escala 1:1 y colocar encima las piezas reales."
    escalera:
      - "Se colocan las piezas reales encima."
    solucion: "Imprimir a escala 1:1."

  - id: prediga-caro
    tipo: predecir
    titulo: "¿Dónde está el error caro?"
    texto: "Un error en el símbolo frente a uno en el encapsulado. ¿Cuál cuesta más, y por qué?"
    libro: [171]
    widget:
      tipo: circuito
      esquema: led
      piezas: { fuente: V_e, r: R_e, vf: V_fe, reves: rev }
      lectura: { valor: I_e, rotulo: "Corriente del LED" }
      mide: { corriente: I_e }
      ocultar: true
      mandos: []
    opciones:
      - texto: "El del encapsulado: no se ve hasta tener la placa fabricada"
        bien: true
        porque: "El del símbolo suele detectarse al dibujar o con el ERC; el del encapsulado cuesta una revisión de la placa."
      - texto: "El del símbolo: el ERC no lo ve nunca"
        porque: "Un error de símbolo suele aparecer al dibujar o con el ERC."
      - texto: "Cuestan lo mismo"
        porque: "No: uno se corrige en el dibujo y el otro exige fabricar otra placa."
    escalera:
      - "¿Cuándo se descubre cada uno?"
    solucion: "El del encapsulado: aparece con la placa ya fabricada."

  - id: por-que-reutilizar
    tipo: porque
    titulo: "Bloques probados"
    texto: "Reutilizar un bloque que ya funciona ahorra tiempo. ¿Por qué aporta además fiabilidad?"
    libro: [181, 182]
    widget:
      tipo: circuito
      esquema: led
      piezas: { fuente: V_e, r: R_e, vf: V_fe, reves: rev }
      lectura: { valor: I_e, rotulo: "Corriente del LED" }
      mide: { corriente: I_e }
      mandos: []
    opciones:
      - texto: "Porque tiene los errores ya encontrados"
        bien: true
        porque: "Para poder reutilizarlo, se diseña como hoja jerárquica independiente, con interfaces claras."
      - texto: "Porque es más sencillo"
        porque: "No tiene por qué serlo: lo que aporta es que ya se probó."
      - texto: "Porque lleva componentes más caros"
        porque: "El precio no tiene que ver: lo valioso es lo que ya se depuró."
    escalera:
      - "¿Qué le pasó a ese bloque en el proyecto anterior?"
    solucion: "Un bloque probado tiene los errores ya encontrados."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [171, 179, 181, 186, 169, 170, 172, 173, 174, 177, 178, 184, 185, 189, 193, 195]
    ideas:
      - { titulo: "El error caro.", texto: "Está en el encapsulado: no se ve hasta tener la placa." }
      - { titulo: "Impresión 1:1.", texto: "Cinco minutos y una hoja de papel." }
      - { titulo: "Reutilizar.", texto: "Un bloque probado trae los errores ya encontrados." }
      - { titulo: "Versiones.", texto: "Etiquetar lo que se fabrica, con Gerbers y BOM." }
