# Lección de la sección 12.3 «Cómo Leer una Hoja de Datos (Datasheet)» (cap12). Formato: GUIA.md.
# La gráfica de R_DS(on) frente a V_GS pasa por los tres puntos del libro (20 mΩ a 10 V, 36 mΩ a 4,5 V y unos 70 mΩ a
# 3,3 V, a 25 °C); entre ellos es una curva de ejemplo, R = a + b/(V_GS − V₀) ajustada a esos tres puntos.
# 1.2.1 (aprender haciendo): bajar la puerta hasta que la resistencia se dispare, tocar el margen de diseño, leer la
# R_DS(on) a 4,5 V en la gráfica, tocar la línea de condiciones, el documento de las erratas y las señales de alarma.
# Dos preguntas: la portada y mínimo y máximo.
# 1.2.1, segunda pasada: sin listas de respuestas disfrazadas; quedan las tarjetas que se hacen y dos preguntas.
# 1.3 (contenido13): vuelven, haciendo, las ideas de las tarjetas quitadas: las cuatro partes de la hoja (objetivo de
# zonas en la fig-12.5), el máximo absoluto (tocar), los tres márgenes del microcontrolador (bloque 74, en una gráfica
# viva) y las condiciones de la hFE del 2N2222A (leer la figura y calcular la base); «solo típico», al éxito: 2/4 → 6/8.
leccion: cap12/sec-12.3

libro:
  72: "La tabla de Absolute Maximum Ratings enumera los valores"
  81: "Cada número de la tabla va acompañado de sus condiciones, y"
  85: "Las tablas dan un punto"
  94: "Tres cosas que deben hacer desconfiar"
  96: "Un componente de una marca conocida con una hoja de datos"
  66: "es un contrato técnico"
  69: "esos tres números no se dan simultáneamente"
  70: "sobre todo, en las gráficas"
  73: "los máximos absolutos no son condiciones de funcionamiento"
  74: "un microcontrolador con máximo absoluto de 6 V, condiciones recomendadas de 2,7 a 5,5 V, y especificaciones garantizadas solo entre 4,5 y 5,5 V"
  77: "Valor central de la distribución de producción"
  78: "el circuito debe funcionar con el mínimo y con el máximo simultáneamente"
  79: "el fabricante no lo garantiza en absoluto"
  82: "puede ser de 36 mΩ a 4,5 V"
  83: "leer siempre la columna de condiciones antes que la de valores."
  89: "Notas de aplicación"
  90: "Errata sheets"
  91: "Modelos SPICE"
  92: "El paquete de calificación"
  95: "Parámetros clave solo con valor típico."
  97: "Estructura de una hoja de datos y qué garantiza cada parte"
  "cap12#82": "Una hFE mínima de 100 a IC = 150 mA y VCE = 10 V (2N2222A) se queda en 40 a 500 mA"

modelo:
  valores:
    V_g: { sim: "V_{GS}", nombre: "tensión de puerta", unidad: V, valor: 10 }
    V_dd: { sim: "V_{DD}", nombre: "alimentación", unidad: V, valor: 12 }
    R_c: { sim: "R_{L}", nombre: "carga", unidad: Ω, valor: 10 }
    k_m: { sim: "k", nombre: "parámetro de transconductancia", unidad: "A/V²", valor: 20 }
    Vt_m: { sim: "V_{th}", nombre: "tensión umbral", unidad: V, valor: 2 }
    V_mc: { sim: "V_{DD}", nombre: "alimentación del microcontrolador", unidad: V, valor: 6.5 }
    I_c5: { sim: "I_{C}", nombre: "corriente que conmuta el 2N2222A", unidad: A, valor: 0.5 }
    h_5: { sim: "h_{FE}", nombre: "hFE mínima a 500 mA", unidad: "", valor: 40 }
    h_1: { sim: "h_{FE}", nombre: "hFE mínima a 150 mA", unidad: "", valor: 100 }
  calculos:
    R_45: { expr: "0.0142789 + 0.0427173/(4.5 - 2.533373)", sim: "R_{DS(on)}", nombre: "resistencia en conducción a 4,5 V", unidad: Ω }
    R_g: { expr: "0.0142789 + 0.0427173/(V_g - 2.533373)", sim: "R_{DS(on)}", nombre: "resistencia en conducción a 25 °C", unidad: Ω }
    I_m: { expr: "V_dd/(R_c + R_g)", sim: "I_{D}", nombre: "corriente de drenador", unidad: A }
    V_m: { expr: "I_m*R_g", sim: "V_{DS}", nombre: "tensión drenador-fuente", unidad: V }
    m_abs: { expr: "ceil((V_mc - 6)/1e9)", sim: "abs", nombre: "por encima del máximo absoluto", unidad: "" }
    m_rec: { expr: "(1 - ceil((2.7 - V_mc)/1e9))*(1 - ceil((V_mc - 5.5)/1e9))", sim: "rec", nombre: "dentro de las condiciones recomendadas", unidad: "" }
    m_gar: { expr: "(1 - ceil((4.5 - V_mc)/1e9))*(1 - ceil((V_mc - 5.5)/1e9))", sim: "gar", nombre: "dentro de lo garantizado a la frecuencia máxima", unidad: "" }
    I_b5: { expr: "I_c5/h_5", sim: "I_{B}", nombre: "corriente de base mínima a 500 mA", unidad: A }
    I_b1: { expr: "I_c5/h_1", sim: "I_{B}", nombre: "con la hFE de 150 mA", unidad: A }

tarjetas:
  - id: explore-condiciones
    tipo: explorar
    titulo: "La letra pequeña"
    texto: "La tabla dice 20 mΩ, a V_{GS} = 10 V y 25 °C. Baje la tensión de puerta hasta que la resistencia pase de 50 mΩ."
    nota: "Entre los puntos del libro, curva de ejemplo."
    libro: [70, 82]
    widget:
      tipo: circuito
      esquema: mosfet
      piezas: { vdd: V_dd, rd: R_c, entrada: V_g, k: k_m, vth: Vt_m, rdson: R_g }
      lectura: { valor: R_g, rotulo: "R_{DS(on)}" }
      datos:
        - { valor: V_m, rotulo: "V_{DS} = {{V_m}}" }
      corriente: I_m
      mide: { id: I_m, vds: V_m }
      mandos:
        - { valor: V_g, lista: [3.3, 4.5, 10], rotulo: "Tensión de puerta" }
    inicio: { V_g: 10 }
    objetivo:
      condiciones:
        - { valor: R_g, min: 0.05, rotulo: "R_{DS(on)}: {{R_g}}" }
      logrado: "Con {{V_g}} de puerta, {{R_g}}: el mismo transistor, más del triple. Las condiciones cambian el número."
      pistas:
        - { texto: "Baje más la tensión de puerta." }
    escalera:
      - "Pruebe la tensión de puerta más baja."
    solucion: "Con 3,3 V de puerta, unos 70 mΩ."
    comprobar:
      - { R_g: 0.02, tol: 0.001 }
      - { con: { V_g: 4.5 }, R_g: 0.036, tol: 0.001 }
      - { con: { V_g: 3.3 }, R_g: 0.07, tol: 0.001 }

  - id: explore-hoja
    tipo: explorar
    titulo: "Un contrato con partes"
    texto: "Una hoja de datos es un contrato técnico: el fabricante garantiza lo que dice, y solo eso. Toque sus cuatro partes."
    libro: [66, 97]
    widget:
      tipo: figura
      figura: fig-12.5
      zonas:
        - { id: portada, rotulo: "Recuadro rojo, a la izquierda", rect: [3, 2, 107, 95], texto: "Cifras llamativas medidas en condiciones ideales que no se dan a la vez: no es un compromiso." }
        - { id: maximos, rotulo: "Recuadro naranja", rect: [117, 2, 107, 95], texto: "Lo que, superado, puede dañar el componente. No son condiciones de trabajo." }
        - { id: recomendadas, rotulo: "Recuadro azul", rect: [231, 2, 107, 95], texto: "El margen dentro del cual se diseña." }
        - { id: tablas, rotulo: "Recuadro verde, a la derecha", rect: [345, 2, 107, 95], texto: "Mínimo y máximo, garantizados; el típico, no. Las gráficas dan la deriva real." }
    objetivo:
      condiciones:
        - { zona: portada, rotulo: "Recuadro rojo" }
        - { zona: maximos, rotulo: "Recuadro naranja" }
        - { zona: recomendadas, rotulo: "Recuadro azul" }
        - { zona: tablas, rotulo: "Recuadro verde" }
      logrado: "Portada, máximos absolutos, condiciones recomendadas y tablas con gráficas: solo las dos últimas dicen con qué se diseña."
      pistas:
        - { texto: "Toque los recuadros de arriba que faltan." }
    escalera:
      - "Son los cuatro recuadros de arriba."
    solucion: "Toque los cuatro recuadros de arriba."

  - id: prediga-portada
    tipo: predecir
    titulo: "La portada"
    texto: "La primera página anuncia «100 V, 30 A, 20 mΩ». ¿Puede contar con los tres a la vez?"
    libro: [69]
    widget:
      tipo: grafica
      x: { id: vg, min: 3, max: 10.5, unidad: V, rotulo: "V_{GS}" }
      y: { min: 0, max: 0.08, unidad: Ω, rotulo: "R_{DS(on)}" }
      curvas:
        - { expr: "0.0142789 + 0.0427173/(vg - 2.533373)", color: azul, rotulo: "a 25 °C" }
      lectura: { valor: R_g, rotulo: "R_{DS(on)}" }
      ocultar: true
    opciones:
      - texto: "No: se miden en condiciones ideales y no se dan a la vez"
        bien: true
        porque: "25 °C de encapsulado, pulsos cortos, puerta al máximo: ninguna aplicación real reúne esas condiciones."
      - texto: "Sí: es lo que garantiza el fabricante"
        porque: "La portada es la parte comercial; lo garantizado está en las tablas, con sus condiciones."
      - texto: "Sí, si hay disipador"
        porque: "Ni con disipador: los tres números salen de condiciones distintas."
    escalera:
      - "Recuerde de qué depende la R_{DS(on)} que acaba de ver."
    solucion: "No: los tres números no se dan simultáneamente."

  - id: toque-maximo
    tipo: tocar
    titulo: "Lo que destruye, no lo que se usa"
    texto: "Un integrado con máximo absoluto de 7 V no está pensado para trabajar a 6,9 V. Toque la parte de la hoja con la que se diseña."
    libro: [72, 73, 97]
    widget:
      tipo: figura
      figura: fig-12.5
      zonas:
        - { id: portada, rotulo: "Recuadro rojo, a la izquierda", rect: [3, 2, 107, 95] }
        - { id: maximos, rotulo: "Recuadro naranja", rect: [117, 2, 107, 95] }
        - { id: recomendadas, rotulo: "Recuadro azul", rect: [231, 2, 107, 95] }
        - { id: tablas, rotulo: "Recuadro verde, a la derecha", rect: [345, 2, 107, 95] }
    tocar:
      bien: [recomendadas]
      porque:
        portada: "Son cifras comerciales, en condiciones ideales: no comprometen nada."
        maximos: "Es lo que destruye: el límite para no romperse si accidentalmente los ve, no para trabajar."
        tablas: "Ahí están los parámetros garantizados, pero el margen de trabajo lo fijan las condiciones recomendadas."
    exito: "Las Recommended Operating Conditions: el diseño se hace con esas. La nota de los máximos lo dice: «operation at or beyond these limits is not implied»."
    escalera:
      - "Busque la parte que da el margen dentro del cual se trabaja."
    solucion: "El recuadro azul, las condiciones recomendadas."

  - id: explore-margenes
    tipo: explorar
    titulo: "Tres márgenes en la misma hoja"
    texto: "Un microcontrolador: máximo absoluto de 6 V, recomendadas de 2,7 a 5,5 V y especificaciones garantizadas a la frecuencia máxima solo de 4,5 a 5,5 V. Elija una alimentación con todo garantizado."
    libro: [74]
    inicio: { V_mc: 6.5 }
    widget:
      tipo: grafica
      x: { id: vv, min: 2, max: 7, unidad: V, rotulo: "V_{DD}" }
      y: { min: 0, max: 1.4, unidad: "", rotulo: "" }
      curvas:
        - { expr: "1.2*ceil((vv - 6)/1e9)", color: naranja, rotulo: "más allá del máximo absoluto" }
        - { expr: "(1 - ceil((2.7 - vv)/1e9))*(1 - ceil((vv - 5.5)/1e9))", color: azul, rotulo: "condiciones recomendadas" }
        - { expr: "0.6*(1 - ceil((4.5 - vv)/1e9))*(1 - ceil((vv - 5.5)/1e9))", color: verde, rotulo: "garantizado a la frecuencia máxima" }
      marcas:
        - { x: "V_mc", y: "0.3", rotulo: "{{V_mc}}" }
      lectura: { valor: V_mc, rotulo: "Alimentación" }
      mandos:
        - { valor: V_mc, min: 2, max: 7, paso: 0.1, rotulo: "Alimentación" }
    objetivo:
      condiciones:
        - { valor: m_gar, min: 1, rotulo: "Todo garantizado" }
      logrado: "Con {{V_mc}}, dentro de lo recomendado y de lo garantizado a la frecuencia máxima. Tres márgenes distintos en la misma hoja."
      pistas:
        - { cuando: { valor: m_abs, min: 1 }, texto: "Por encima del máximo absoluto: puede dañarse de forma permanente. Baje mucho." }
        - { cuando: { valor: m_rec, max: 0 }, texto: "Fuera de las condiciones recomendadas: no está pensado para trabajar ahí." }
        - { texto: "Dentro de lo recomendado, pero a la frecuencia máxima solo se garantiza de 4,5 a 5,5 V." }
    escalera:
      - "El margen más estrecho de los tres es el que manda."
    solucion: "Entre 4,5 y 5,5 V; por ejemplo, 5 V."
    comprobar:
      - { m_abs: 1, m_rec: 0, m_gar: 0 }
      - { con: { V_mc: 5 }, m_gar: 1, m_rec: 1, m_abs: 0 }
      - { con: { V_mc: 3.3 }, m_gar: 0, m_rec: 1 }

  - id: lea-45
    tipo: leer
    titulo: "Lea la gráfica"
    texto: "La tabla da 20 mΩ a 10 V. Su circuito tiene 4,5 V de puerta: lea en la gráfica la R_{DS(on)} que tendrá."
    libro: [70, 82, 85]
    widget:
      tipo: grafica
      x: { id: vg, min: 3, max: 10.5, unidad: V, rotulo: "V_{GS}" }
      y: { min: 0, max: 0.08, unidad: Ω, rotulo: "R_{DS(on)}" }
      curvas:
        - { expr: "0.0142789 + 0.0427173/(vg - 2.533373)", color: azul, rotulo: "a 25 °C" }
      mandos: []
    leer:
      objetivo: R_45
      unidad: Ω
      tol: 0.06
      rotulo: "R_{DS(on)} a 4,5 V"
      errores:
        - { expr: "0.02", texto: "Esos 20 mΩ son los de 10 V de puerta: con 4,5 V la curva está más arriba." }
    exito: "Unos 36 mΩ: casi el doble. Las tablas dan un punto; las gráficas, el comportamiento."
    escalera:
      - "Busque V_{GS} = 4,5 V en el eje horizontal y suba hasta la curva."
    solucion: "Unos 36 mΩ a 4,5 V."
    comprobar:
      - { R_45: 0.036, tol: 0.001 }

  - id: simule-hfe
    tipo: simular
    titulo: "Las condiciones de la hFE"
    texto: "Un 2N2222A conmuta 500 mA, y su tabla da hFE mínima de 100 a 150 mA. Busque en la figura la de su corriente y calcule la base mínima."
    libro: ["cap12#82", 83, 97]
    fijar: { I_c5: 0.5 }
    widget:
      tipo: figura
      figura: fig-12.5
      zonas:
        - { id: hfe, rotulo: "Fila de la hFE", rect: [10, 170, 430, 40], texto: "hFE: 100 a 150 mA; 40 a 500 mA." }
    simular:
      objetivo: I_b5
      unidad: A
      tol: 0.02
      rotulo: "Corriente de base mínima"
      errores:
        - { expr: "I_b1", texto: "Ha usado la hFE de 150 mA. A 500 mA la mínima baja a 40: hace falta más base." }
    exito: "12,5 mA, no 5: con 500 mA la hFE mínima se queda en 40. Leer las condiciones antes que los valores evita el 90 % de las sorpresas."
    escalera:
      - "En la fila de la hFE, la columna de otras condiciones: 40 a 500 mA. I_{B} = I_{C}/h_{FE}."
    solucion: "500 mA / 40 = 12,5 mA."
    comprobar:
      - { I_b5: 0.0125, I_b1: 0.005, h_5: 40, h_1: 100 }

  - id: min-max
    tipo: predecir
    titulo: "Típico, mínimo y máximo"
    texto: "La tabla da mínimo, típico y máximo de un parámetro del que depende su circuito. ¿Con cuáles debe funcionar?"
    libro: [77, 78]
    widget:
      tipo: grafica
      x: { id: vg, min: 3, max: 10.5, unidad: V, rotulo: "V_{GS}" }
      y: { min: 0, max: 0.08, unidad: Ω, rotulo: "R_{DS(on)}" }
      curvas:
        - { expr: "0.0142789 + 0.0427173/(vg - 2.533373)", color: azul, rotulo: "a 25 °C" }
      lectura: { valor: R_g, rotulo: "R_{DS(on)}" }
      ocultar: true
    opciones:
      - texto: "Con el mínimo y con el máximo a la vez"
        bien: true
        porque: "Son los garantizados. Diseñar con el típico es diseñar para la mitad de las unidades."
      - texto: "Con el típico"
        porque: "El típico es el centro de la producción y no está garantizado: la mitad de las unidades queda fuera."
      - texto: "Solo con el máximo"
        porque: "También con el mínimo: en producción, las dos colas existen."
    exito: "Mínimo y máximo, garantizados. Un parámetro clave con solo valor típico no está garantizado en absoluto: es una señal de alarma."
    escalera:
      - "¿Cuáles de las tres columnas garantiza el fabricante?"
    solucion: "Con el mínimo y el máximo simultáneamente."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [66, 73, 78, 83, 72, 74, 79, 81, 89, 90, 91, 92, 94, 95, 96]
    ideas:
      - { titulo: "Contrato.", texto: "El fabricante garantiza lo que dice la hoja, y solo eso." }
      - { titulo: "Máximos absolutos.", texto: "Lo que destruye; se diseña con las condiciones recomendadas." }
      - { titulo: "Mínimo y máximo.", texto: "Garantizados; el típico, no." }
      - { titulo: "Condiciones primero.", texto: "Leer las condiciones antes que los valores." }
