# Lección de la sección 12.8 «El Flujo Completo: del Esquema al Prototipo» (cap12). Formato: GUIA.md.
# El consumo del primer encendido se ve con el esquema «resistencia»: la placa como una carga de 50 Ω (sana) o de 1 Ω
# (un corto), alimentada a 5 V; la especificación de menos de 200 mA a 5 V es la del ejemplo del libro (bloque 243).
# 1.2.1 (aprender haciendo): detectar el consumo fuera de la especificación, ordenar el flujo y el primer encendido
# tocando, tocar los pasos que se saltan, la verificación de la colocación y lo más valioso de documentar. Dos
# preguntas: la segunda versión y por qué ese orden.
# 1.2.1, segunda pasada: sin listas de respuestas disfrazadas; quedan las tarjetas que se hacen y dos preguntas.
leccion: cap12/sec-12.8

libro:
  245: "Las nueve etapas del flujo de diseño con sus dos retornos"
  230: "Qué verificar en cada paso"
  231: "Porque un error detectado tarde cuesta diez veces más"
  234: "Merece su propio protocolo, porque es donde se destruyen"
  237: "Lo que hay que documentar sobre la marcha"
  238: "Y no después, porque después no se hace (sección 18.8)"
  239: "Las decisiones y su motivo"
  242: "La costumbre que más mejora el resultado de un proyecto"
  223: "el orden importa más que la habilidad en cada uno"
  224: "Especificación"
  225: "el tiempo se pierde en los pasos que se saltan"
  228: "Del trazado al esquema"
  229: "Prácticamente ninguna placa funciona perfectamente a la primera"
  232: "Gerbers en visor independiente"
  235: "Comprobar cortocircuitos"
  236: "Ese orden convierte la mayoría de los errores en un aviso en lugar de en humo."
  240: "los problemas resueltos son exactamente lo que se olvida"
  243: "consumo menor de 200 mA"
  244: "esas cuatro decisiones se toman por separado y luego no encajan"

modelo:
  valores:
    V_u: { sim: "+5V", nombre: "alimentación por USB", unidad: V, valor: 5 }
    R_pl: { sim: "placa", nombre: "carga que presenta la placa", unidad: Ω, valor: 50 }
  calculos:
    I_pl: { expr: "V_u/R_pl", sim: "I", nombre: "consumo de la placa", unidad: A }

tarjetas:
  - id: explore-consumo
    tipo: explorar
    titulo: "Mida el consumo"
    texto: "La especificación pide menos de 200 mA a 5 V. Pase la placa a cortocircuitada hasta que el consumo se salga de la especificación."
    nota: "La placa como una carga de ejemplo."
    libro: [235, 243]
    widget:
      tipo: circuito
      esquema: resistencia
      piezas: { fuente: V_u, r: R_pl }
      lectura: { valor: I_pl, rotulo: "Consumo" }
      corriente: I_pl
      mide: { corriente: I_pl, tension: V_u }
      mandos:
        - { valor: R_pl, lista: [1, 50], nombres: [en corto, sana], rotulo: "Placa" }
    inicio: { R_pl: 50 }
    objetivo:
      condiciones:
        - { valor: I_pl, min: 0.2, rotulo: "Consumo: {{I_pl}}" }
      logrado: "{{I_pl}}: muy distinto de lo esperado. Con límite de corriente es un aviso; sin él, humo. Apague y averigüe."
      pistas:
        - { texto: "Pase la placa a «en corto»." }
    escalera:
      - "Un corto baja mucho la carga que ve la fuente."
    solucion: "En corto, 5 A: fuera de la especificación."

  - id: retorno-validacion
    tipo: tocar
    titulo: "La validación encuentra un error"
    texto: "La validación descubre un fallo de concepto. Toque la etapa a la que vuelve el flujo."
    libro: [228, 229, 245]
    widget:
      tipo: figura
      figura: fig-12.10
      zonas:
        - { id: e1, rotulo: "Especificación", rect: [4, 20, 80, 44] }
        - { id: e2, rotulo: "Diagrama de bloques", rect: [96, 20, 80, 44] }
        - { id: e3, rotulo: "Esquema", rect: [187, 20, 80, 44] }
        - { id: e7, rotulo: "Trazado y DRC", rect: [279, 99, 80, 44] }
    tocar:
      bien: [e1]
      porque:
        e2: "El retorno de la validación llega más atrás."
        e3: "Al esquema vuelve el trazado, no la validación."
        e7: "Es el trazado."
    exito: "El segundo retorno: de la validación al diseño, la segunda revisión."
    escalera:
      - "Siga la flecha naranja que sale de la validación."
    solucion: "La especificación."

  - id: retorno-trazado
    tipo: tocar
    titulo: "El trazado no cabe"
    texto: "Durante el trazado hay que cambiar una conexión. Toque la etapa a la que vuelve."
    libro: [245]
    widget:
      tipo: figura
      figura: fig-12.10
      zonas:
        - { id: e1, rotulo: "Especificación", rect: [4, 20, 80, 44] }
        - { id: e3, rotulo: "Esquema", rect: [187, 20, 80, 44] }
        - { id: e5, rotulo: "Encapsulados y BOM", rect: [370, 20, 80, 44] }
        - { id: e6, rotulo: "Colocación", rect: [370, 99, 80, 44] }
    tocar:
      bien: [e3]
      porque:
        e1: "Esa es la vuelta de la validación."
        e5: "Es encapsulados y BOM."
        e6: "Es la colocación, que va antes del trazado."
    exito: "El primer retorno: del trazado al esquema, el normal."
    escalera:
      - "Siga la flecha naranja que sale del trazado."
    solucion: "El esquema."

  - id: se-saltan
    tipo: tocar
    titulo: "Los que se saltan"
    texto: "Toque las tres etapas que más se saltan."
    libro: [245]
    widget:
      tipo: figura
      figura: fig-12.10
      zonas:
        - { id: e1, rotulo: "Especificación", rect: [4, 20, 80, 44] }
        - { id: e2, rotulo: "Diagrama de bloques", rect: [96, 20, 80, 44] }
        - { id: e3, rotulo: "Esquema", rect: [187, 20, 80, 44] }
        - { id: e4, rotulo: "ERC y revisión", rect: [279, 20, 80, 44] }
        - { id: e5, rotulo: "Encapsulados y BOM", rect: [370, 20, 80, 44] }
        - { id: e9, rotulo: "Validación", rect: [96, 99, 80, 44] }
    tocar:
      bien: [e1, e4, e9]
      todas: true
      porque:
        e2: "El diagrama de bloques se suele hacer."
        e3: "Sin esquema no hay placa."
        e5: "Encapsulados y BOM son obligados."
    exito: "Especificación, ERC y revisión, y validación: ahí se pierde el tiempo."
    escalera:
      - "Están en rojo."
    solucion: "Especificación, ERC y validación."

  - id: por-que-segunda
    tipo: porque
    titulo: "Contar con una segunda versión"
    texto: "Conviene prever desde el principio una vuelta de la validación al diseño. ¿Por qué?"
    libro: [228, 229]
    widget:
      tipo: circuito
      esquema: resistencia
      piezas: { fuente: V_u, r: R_pl }
      lectura: { valor: I_pl, rotulo: "Consumo" }
      mide: { corriente: I_pl, tension: V_u }
      mandos: []
    opciones:
      - texto: "Porque prácticamente ninguna placa funciona perfectamente a la primera"
        bien: true
        porque: "Cambia la actitud: se hacen prototipos para aprender, no para acertar."
      - texto: "Porque el primer diseño siempre es malo"
        porque: "No es que sea malo: es que la placa real enseña cosas que el papel no."
      - texto: "Porque el fabricante lo exige"
        porque: "Nadie lo exige; es lo que enseña la experiencia."
    escalera:
      - "¿Cuántas placas salen perfectas a la primera?"
    solucion: "Casi ninguna placa sale perfecta a la primera."

  - id: por-que-orden
    tipo: porque
    titulo: "¿Por qué ese orden?"
    texto: "El consumo de la placa en corto se disparaba. ¿Qué gana siguiendo el protocolo en su orden?"
    libro: [236]
    widget:
      tipo: circuito
      esquema: resistencia
      piezas: { fuente: V_u, r: R_pl }
      lectura: { valor: I_pl, rotulo: "Consumo" }
      corriente: I_pl
      mide: { corriente: I_pl, tension: V_u }
      mandos: []
    opciones:
      - texto: "Que la mayoría de los errores den un aviso en lugar de humo"
        bien: true
        porque: "El primer encendido es donde se destruyen los prototipos."
      - texto: "Que la placa funcione antes"
        porque: "No la hace funcionar antes: evita destruirla."
      - texto: "Que no haga falta medir"
        porque: "Al contrario: el protocolo es medir en cada paso antes de seguir."
    escalera:
      - "¿Dónde se destruyen los prototipos?"
    solucion: "Los errores avisan en lugar de echar humo."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [223, 225, 236, 243, 224, 230, 231, 232, 234, 237, 238, 239, 240, 242, 244]
    ideas:
      - { titulo: "Nueve etapas.", texto: "El orden importa más que la habilidad en cada una." }
      - { titulo: "Lo que se salta.", texto: "Especificación, ERC y validación: ahí se pierde el tiempo." }
      - { titulo: "Primer encendido.", texto: "Cortos, límite de corriente, consumo, raíles, calor y funciones." }
      - { titulo: "Especificar primero.", texto: "Cinco líneas con números antes de dibujar." }
