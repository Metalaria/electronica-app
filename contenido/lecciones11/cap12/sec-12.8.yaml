# Lección 1.2 de la sección 12.8 «El Flujo Completo: del Esquema al Prototipo» (cap12). Formato: GUIA.md.
# El consumo del primer encendido se ve con el esquema «resistencia»: la placa como una carga de 50 Ω (sana) o de 1 Ω
# (un corto), alimentada a 5 V; la especificación de menos de 200 mA a 5 V es la del ejemplo del libro (bloque 243).
leccion: cap12/sec-12.8

libro:
  223: "el orden importa más que la habilidad en cada uno"
  224: "Especificación"
  225: "el tiempo se pierde en los pasos que se saltan"
  228: "Del trazado al esquema"
  229: "Prácticamente ninguna placa funciona perfectamente a la primera"
  232: "Gerbers en visor independiente"
  235: "Comprobar cortocircuitos"
  236: "Ese orden convierte la mayoría de los errores en un aviso en lugar de en humo."
  240: "los problemas resueltos son exactamente lo que se olvida"
  243: "consumo menor de 200 mA"
  244: "esas cuatro decisiones se toman por separado y luego no encajan"

modelo:
  valores:
    V_u: { sim: "+5V", nombre: "alimentación por USB", unidad: V, valor: 5 }
    R_pl: { sim: "placa", nombre: "carga que presenta la placa", unidad: Ω, valor: 50 }
  calculos:
    I_pl: { expr: "V_u/R_pl", sim: "I", nombre: "consumo de la placa", unidad: A }

tarjetas:
  - id: explore-consumo
    tipo: explorar
    titulo: "Mida el consumo"
    texto: "La especificación pide menos de 200 mA a 5 V. Pase la placa de sana a cortocircuitada y lea el consumo."
    nota: "La placa como una carga de ejemplo."
    libro: [235, 243]
    widget:
      tipo: circuito
      esquema: resistencia
      piezas: { fuente: V_u, r: R_pl }
      lectura: { valor: I_pl, rotulo: "Consumo" }
      corriente: I_pl
      mide: { corriente: I_pl, tension: V_u }
      mandos:
        - { valor: R_pl, lista: [1, 50], nombres: [en corto, sana], rotulo: "Placa" }
    requiere: { mover: [R_pl] }

  - id: etapas
    tipo: pregunta
    fase: "Ordene"
    titulo: "Del concepto al prototipo"
    texto: "Ordene las etapas del flujo completo."
    libro: [223, 224]
    ordenar:
      - "Especificación con números"
      - "Diagrama de bloques"
      - "Esquema, bloque a bloque"
      - "ERC y revisión"
      - "Encapsulados y BOM"
      - "Colocación, trazado y DRC"
      - "Fabricación, montaje y validación"
    exito: "El orden importa más que la habilidad en cada paso."
    pistas:
      - { texto: "La validación se hace contra la especificación del primer paso." }
    escalera:
      - "Los encapsulados se asignan antes de colocar."
    solucion: "Especificación, bloques, esquema, ERC, encapsulados, colocación y trazado, fabricación y validación."

  - id: prediga-saltan
    tipo: predecir
    titulo: "Dónde se pierde el tiempo"
    texto: "¿En qué pasos del flujo se pierde casi siempre el tiempo?"
    libro: [225]
    widget:
      tipo: circuito
      esquema: resistencia
      piezas: { fuente: V_u, r: R_pl }
      lectura: { valor: I_pl, rotulo: "Consumo" }
      mide: { corriente: I_pl, tension: V_u }
      ocultar: true
      mandos: []
    opciones:
      - texto: "En los que se saltan: especificación, ERC y revisión, y validación"
        bien: true
        porque: "Casi siempre el 1, el 4 y el 9: lo que no se hizo a tiempo se paga después."
      - texto: "En el trazado, que es el más difícil"
        porque: "El trazado lleva trabajo, pero el tiempo se pierde en lo que se salta."
      - texto: "En la fabricación"
        porque: "Fabricar lleva su plazo; lo que hace perder tiempo es lo que no se comprobó antes."
    escalera:
      - "No son los pasos difíciles, sino los que se omiten."
    solucion: "En los que se saltan: el 1, el 4 y el 9."

  - id: por-que-segunda
    tipo: porque
    titulo: "Contar con una segunda versión"
    texto: "Conviene prever desde el principio una vuelta de la validación al diseño. ¿Por qué?"
    libro: [228, 229]
    widget:
      tipo: circuito
      esquema: resistencia
      piezas: { fuente: V_u, r: R_pl }
      lectura: { valor: I_pl, rotulo: "Consumo" }
      mide: { corriente: I_pl, tension: V_u }
      mandos: []
    opciones:
      - texto: "Porque prácticamente ninguna placa funciona perfectamente a la primera"
        bien: true
        porque: "Cambia la actitud: se hacen prototipos para aprender, no para acertar."
      - texto: "Porque el primer diseño siempre es malo"
        porque: "No es que sea malo: es que la placa real enseña cosas que el papel no."
      - texto: "Porque el fabricante lo exige"
        porque: "Nadie lo exige; es lo que enseña la experiencia."
    escalera:
      - "¿Cuántas placas salen perfectas a la primera?"
    solucion: "Casi ninguna placa sale perfecta a la primera."

  - id: verificar
    tipo: pregunta
    fase: "Empareje"
    titulo: "Qué verificar en cada paso"
    texto: "Una cada paso con su verificación."
    libro: [232]
    emparejar:
      - ["Especificación", "¿Tiene números? ¿Son alcanzables?"]
      - ["Esquema", "ERC en cero y revisión por otra persona"]
      - ["Encapsulados", "Cotejar patillaje con la hoja de datos"]
      - ["Colocación", "Impresión 1:1 con los componentes encima"]
      - ["Trazado", "DRC en cero y Gerbers en visor independiente"]
      - ["Montaje", "Una unidad primero, verificada entera"]
    exito: "Un error detectado tarde cuesta diez veces más."
    pistas:
      - { texto: "El DRC es del trazado; el ERC, del esquema." }
    escalera:
      - "Se monta una unidad antes que las demás."
    solucion: "Especificación–números; esquema–ERC; encapsulados–patillaje; colocación–1:1; trazado–DRC; montaje–una unidad."

  - id: primer-encendido
    tipo: pregunta
    fase: "Ordene"
    titulo: "El primer encendido"
    texto: "Ordene el protocolo del primer encendido de un prototipo."
    libro: [235]
    ordenar:
      - "Comprobar cortocircuitos sin alimentar"
      - "Alimentar con límite de corriente"
      - "Medir el consumo"
      - "Verificar la tensión de cada raíl"
      - "Tocar los componentes buscando calor anormal"
      - "Empezar a probar funciones"
    exito: "Si el consumo es muy distinto de lo esperado, se apaga y se averigua."
    pistas:
      - { texto: "Lo primero se hace con la placa apagada." }
    escalera:
      - "Las funciones se prueban al final, cuando la alimentación está comprobada."
    solucion: "Cortos, límite de corriente, consumo, raíles, calor y funciones."

  - id: por-que-orden
    tipo: porque
    titulo: "¿Por qué ese orden?"
    texto: "El consumo de la placa en corto se disparaba. ¿Qué gana siguiendo el protocolo en su orden?"
    libro: [236]
    widget:
      tipo: circuito
      esquema: resistencia
      piezas: { fuente: V_u, r: R_pl }
      lectura: { valor: I_pl, rotulo: "Consumo" }
      corriente: I_pl
      mide: { corriente: I_pl, tension: V_u }
      mandos: []
    opciones:
      - texto: "Que la mayoría de los errores den un aviso en lugar de humo"
        bien: true
        porque: "El primer encendido es donde se destruyen los prototipos."
      - texto: "Que la placa funcione antes"
        porque: "No la hace funcionar antes: evita destruirla."
      - texto: "Que no haga falta medir"
        porque: "Al contrario: el protocolo es medir en cada paso antes de seguir."
    escalera:
      - "¿Dónde se destruyen los prototipos?"
    solucion: "Los errores avisan en lugar de echar humo."

  - id: documentar
    tipo: pregunta
    titulo: "Documentar sobre la marcha"
    texto: "Decisiones, cambios, medidas y problemas resueltos. ¿Cuál es el más valioso y el que más se omite?"
    libro: [240]
    widget:
      tipo: circuito
      esquema: resistencia
      piezas: { fuente: V_u, r: R_pl }
      lectura: { valor: I_pl, rotulo: "Consumo" }
      mide: { corriente: I_pl, tension: V_u }
      mandos: []
    opciones:
      - texto: "Los problemas encontrados y cómo se resolvieron"
        bien: true
        porque: "Es lo que se olvida y lo que se repite en el proyecto siguiente."
      - texto: "Las medidas de la validación"
        porque: "Se anotan, pero no son lo que más se omite."
      - texto: "Los cambios en el esquema"
        porque: "Son imprescindibles, pero el libro destaca los problemas resueltos."
    escalera:
      - "¿Qué se repite en el proyecto siguiente?"
    solucion: "Los problemas encontrados y su solución."

  - id: especificacion
    tipo: pregunta
    titulo: "Cinco líneas antes de dibujar"
    texto: "«5 V por USB, menos de 200 mA, temperatura de −10 a 50 °C con 0,5 °C, envío serie cada minuto.» ¿Qué evita escribirlo antes?"
    libro: [243, 244]
    widget:
      tipo: circuito
      esquema: resistencia
      piezas: { fuente: V_u, r: R_pl }
      lectura: { valor: I_pl, rotulo: "Consumo" }
      mide: { corriente: I_pl, tension: V_u }
      mandos: []
    opciones:
      - texto: "Que sensor, convertidor, micro y alimentación se elijan por separado y no encajen"
        bien: true
        porque: "Esas cinco líneas determinan las cuatro decisiones a la vez."
      - texto: "Nada: se puede escribir al final"
        porque: "Al final ya no sirve: las decisiones se habrían tomado sin ella."
      - texto: "Tener que dibujar el diagrama de bloques"
        porque: "El diagrama sigue haciendo falta; la especificación lo orienta."
    escalera:
      - "Cada línea fija una pieza del diseño."
    solucion: "Que las decisiones se tomen por separado y luego no encajen."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [223, 225, 236, 243]
    ideas:
      - { titulo: "Nueve etapas.", texto: "El orden importa más que la habilidad en cada una." }
      - { titulo: "Lo que se salta.", texto: "Especificación, ERC y validación: ahí se pierde el tiempo." }
      - { titulo: "Primer encendido.", texto: "Cortos, límite de corriente, consumo, raíles, calor y funciones." }
      - { titulo: "Especificar primero.", texto: "Cinco líneas con números antes de dibujar." }
