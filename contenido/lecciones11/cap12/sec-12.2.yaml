# Lección de la sección 12.2 «Anatomía de una Fuente de Alimentación Conmutada» (cap12). Formato: GUIA.md.
# El rectificador y el condensador primario se ven con el esquema «puente» (230 V de red: unos 325 V de pico, del
# ejercicio del capítulo; carga de 10 kΩ y 100 µF de ejemplo). El electrolítico que pierde capacidad se ve con el
# mismo puente a 17 V de pico, 100 Ω y 1000 µF frente a 220 µF (valores de ejemplo): más rizado y menos tensión media.
# 1.2.1 (aprender haciendo): envejecer el electrolítico, tocar en la figura 12.4 la zona de un síntoma y las piezas
# que cruzan la frontera, predecir el condensador primario, poner la sonda en el secundario y ordenar lo que más
# falla tocando. Una pregunta: el disipador.
leccion: cap12/sec-12.2

libro:
  47: "La estructura anterior permite acotar una avería por lo que"
  49: "Esa tabla resuelve buena parte de los diagnósticos antes de"
  51: "Por orden, y coincide con la lista universal (sección"
  63: "Los seis bloques de una fuente conmutada y la frontera"
  33: "todas siguen la misma estructura"
  35: "fusible, varistor, NTC de irrupción"
  36: "un electrolítico grande, de 400 V"
  37: "un MOSFET, a veces integrado con su controlador"
  38: "que es la barrera de seguridad"
  39: "diodo rápido o rectificación síncrona"
  40: "el optoacoplador y la referencia TL431"
  42: "una línea física que separa el primario del secundario"
  43: "una ranura fresada"
  44: "incluido el disipador del interruptor"
  45: "antes de tocar nada, localizar la frontera"
  48: "Salida baja con rizado alto"
  52: "Los electrolíticos de salida"
  53: "El interruptor"
  54: "La NTC de irrupción"
  55: "El optoacoplador"
  57: "solo se mide el secundario"
  59: "el rizado en acoplamiento AC"
  "cap12#303": "unos 325 V con red de 230 V, de ahí los condensadores de 400 V"

modelo:
  valores:
    V_rp: { sim: "V_{p}", nombre: "pico de la entrada", unidad: V, valor: 16.97 }
    f_red: { sim: "f", nombre: "frecuencia de la red", unidad: Hz, valor: 50 }
    V_rd: { sim: "V_{D}", nombre: "caída de cada diodo", unidad: V, valor: 0.7 }
    C_rf: { sim: "C", nombre: "electrolítico", unidad: F, valor: 1000e-6 }
    R_rl: { sim: "R_{L}", nombre: "carga", unidad: Ω, valor: 100 }
    V_red: { sim: "V_{red}", nombre: "tensión eficaz de la red", unidad: V, valor: 230 }
    C_pr: { sim: "C", nombre: "condensador primario", unidad: F, valor: 100e-6 }
    R_pr: { sim: "R_{L}", nombre: "carga del primario", unidad: Ω, valor: 10000 }
  calculos:
    V_r2: { expr: "V_rp - 2*V_rd", sim: "V_{pico}", nombre: "pico de la salida", unidad: V }
    T_red: { expr: "1/f_red", sim: "T", nombre: "periodo de la red", unidad: s }
    tau_r: { expr: "R_rl*C_rf", sim: "τ", nombre: "constante de descarga", unidad: s }
    V_pk: { expr: "V_red*sqrt(2)", sim: "V_{p}", nombre: "pico de la red", unidad: V }
    V_pp: { expr: "V_pk - 2*V_rd", sim: "V_{C}", nombre: "tensión del condensador primario", unidad: V }
    tau_p: { expr: "R_pr*C_pr", sim: "τ", nombre: "constante de descarga del primario", unidad: s }

tarjetas:
  - id: explore-rizado
    tipo: explorar
    titulo: "Un electrolítico que envejece"
    texto: "El electrolítico pierde capacidad con el calor y el rizado. Déjelo con la que le queda tras años de uso y mire la salida."
    nota: "Valores de ejemplo."
    libro: [48, 52]
    widget:
      tipo: circuito
      esquema: puente
      piezas: { fuente: V_rp, f: f_red, vd: V_rd, c: C_rf, carga: R_rl }
      lectura: { valor: V_r2, rotulo: "Pico de la salida" }
      grafica:
        x: { id: t, min: 0, max: 0.04, unidad: s, rotulo: "t" }
        y: { min: 0, max: 18, unidad: V, rotulo: "v" }
        curvas:
          - { expr: "max(V_rp*abs(sin(2*pi*f_red*t)) - 2*V_rd, V_r2*exp(-(t - T_red/4 - T_red/2*floor((t - T_red/4)/(T_red/2)))/tau_r))", color: naranja, rotulo: "salida", mide: salida }
      mandos:
        - { valor: C_rf, lista: [220e-6, 1000e-6], rotulo: "Capacidad que le queda" }
    inicio: { C_rf: 0.001 }
    objetivo:
      condiciones:
        - { valor: C_rf, max: 0.00022, rotulo: "Capacidad: {{C_rf}}" }
      logrado: "Más rizado y menos tensión media: salida baja con rizado alto, el síntoma de los electrolíticos de salida."
      pistas:
        - { texto: "Elija la capacidad menor." }
    escalera:
      - "El mando de debajo cambia la capacidad que le queda."
    solucion: "Con la capacidad menor, el rizado crece y la media baja."

  - id: sintomas
    tipo: tocar
    titulo: "Lo que delata cada síntoma"
    texto: "La fuente llega con el fusible fundido y ennegrecido. Toque el bloque donde está la avería probable."
    libro: [35, 37, 39, 47, 48, 49, 53, 63]
    widget:
      tipo: figura
      figura: fig-12.4
      zonas:
        - { id: entrada, rotulo: "Primer bloque", rect: [4, 48, 70, 56] }
        - { id: rectificador, rotulo: "Segundo bloque", rect: [86, 48, 70, 56] }
        - { id: interruptor, rotulo: "Tercer bloque", rect: [172, 48, 70, 56] }
        - { id: transformador, rotulo: "Cuarto bloque", rect: [254, 48, 74, 56] }
        - { id: secundario, rotulo: "Quinto bloque", rect: [348, 48, 76, 56] }
    tocar:
      bien: [interruptor]
      porque:
        entrada: "La entrada sin consumo apunta al fusible; aquí el fusible ha saltado por algo que tiró de él."
        rectificador: "El puente puede fallar, pero el fusible ennegrecido es la firma del interruptor en corto."
        transformador: "El transformador rara vez se lleva el fusible por delante."
        secundario: "Un corto en el secundario hace disparar la protección: chasquido repetido."
    exito: "El interruptor, que suele fallar en cortocircuito y llevarse el fusible. La tabla de síntomas resuelve mucho antes de medir."
    escalera:
      - "¿Qué pieza falla en cortocircuito y tira de la red?"
    solucion: "El interruptor, el MOSFET."

  - id: frontera
    tipo: tocar
    titulo: "Lo que cruza la frontera"
    texto: "Antes de tocar nada, se localiza la frontera entre primario y secundario. Toque las dos piezas que la cruzan."
    libro: [38, 40, 42, 43, 45, 63]
    widget:
      tipo: figura
      figura: fig-12.4
      zonas:
        - { id: interruptor, rotulo: "Tercer bloque, arriba", rect: [172, 48, 70, 56] }
        - { id: transformador, rotulo: "Cuarto bloque, arriba", rect: [254, 48, 74, 56] }
        - { id: opto, rotulo: "Bloque de abajo, en el centro", rect: [262, 124, 70, 36] }
        - { id: tl431, rotulo: "Bloque de abajo, a la derecha", rect: [358, 124, 52, 36] }
    tocar:
      bien: [transformador, opto]
      todas: true
      porque:
        interruptor: "Está entero en el primario, con su disipador a tensión de red."
        tl431: "La referencia está en el secundario; lo que cruza es el optoacoplador."
    exito: "El transformador es la barrera; el optoacoplador lleva la realimentación de vuelta. Del lado del primario, todo está a tensión de red."
    escalera:
      - "La frontera es la ranura vertical: busque lo que tiene un lado a cada lado."
    solucion: "El transformador y el optoacoplador."

  - id: prediga-325
    tipo: simular
    titulo: "El condensador primario"
    texto: "El puente rectifica directamente la red de 230 V. ¿A qué tensión se carga el condensador primario?"
    libro: [36, "cap12#303"]
    fijar: { V_red: 230 }
    simular:
      objetivo: V_pp
      unidad: V
      tol: 0.03
      rotulo: "Tensión del condensador primario"
      errores:
        - { expr: "V_red", texto: "230 V es el valor eficaz: el condensador se carga al pico, √2 veces más." }
        - { expr: "V_red/sqrt(2)", texto: "Ha dividido por √2: el pico es mayor que el eficaz, no menor." }
    exito: "Unos 325 V, el pico de la red: por eso es un electrolítico de 400 V, el más voluminoso del primario."
    escalera:
      - "El condensador se carga al pico: eficaz por √2."
    solucion: "230 V · √2 ≈ 325 V, menos las dos caídas del puente."
    comprobar:
      - { V_pk: 325, tol: 0.002 }

  - id: por-que-disipador
    tipo: porque
    titulo: "Solo un trozo de metal"
    texto: "El disipador del interruptor parece inofensivo. ¿Por qué no se toca con la fuente enchufada?"
    libro: [44]
    widget:
      tipo: circuito
      esquema: puente
      piezas: { fuente: V_pk, f: f_red, vd: V_rd, c: C_pr, carga: R_pr }
      lectura: { valor: V_pp, rotulo: "Condensador primario" }
      grafica:
        x: { id: t, min: 0, max: 0.04, unidad: s, rotulo: "t" }
        y: { min: 0, max: 340, unidad: V, rotulo: "v" }
        curvas:
          - { expr: "max(V_pk*abs(sin(2*pi*f_red*t)) - 2*V_rd, V_pp*exp(-(t - T_red/4 - T_red/2*floor((t - T_red/4)/(T_red/2)))/tau_p))", color: naranja, rotulo: "condensador", mide: salida }
      mandos: []
    opciones:
      - texto: "Está del lado del primario, a menudo a un potencial peligroso"
        bien: true
        porque: "Todo lo que está del lado del primario está a tensión de red, incluido ese disipador."
      - texto: "Porque quema"
        porque: "Puede estar caliente, pero el peligro es eléctrico: está a tensión de red."
      - texto: "Porque se descarga la fuente"
        porque: "Tocarlo no descarga nada: el riesgo es para usted."
    escalera:
      - "¿De qué lado de la frontera está?"
    solucion: "Está en el primario, a tensión de red."

  - id: medidas
    tipo: medir
    titulo: "Las medidas seguras"
    texto: "Sin transformador de aislamiento, solo se mide el secundario. Ponga la sonda donde verá el rizado de la salida."
    libro: [57, 59]
    widget:
      tipo: circuito
      esquema: puente
      piezas: { fuente: V_rp, f: f_red, vd: V_rd, c: C_rf, carga: R_rl }
      grafica:
        x: { id: t, min: 0, max: 0.04, unidad: s, rotulo: "t" }
        y: { min: 0, max: 18, unidad: V, rotulo: "v" }
        curvas:
          - { expr: "max(V_rp*abs(sin(2*pi*f_red*t)) - 2*V_rd, V_r2*exp(-(t - T_red/4 - T_red/2*floor((t - T_red/4)/(T_red/2)))/tau_r))", color: naranja, rotulo: "salida", mide: salida }
      instrumento: { tipo: osciloscopio, puntos: [p, s], curvas: { s: 0 } }
      mandos: []
    medir:
      magnitud: senal
      punto: s
      porque:
        p: "Ese borne es la entrada alterna, antes del puente: en una fuente real, el lado de la red."
    exito: "La salida, con la masa de la sonda en la masa de salida. El rizado en AC delata los electrolíticos antes de que se mueva la media."
    escalera:
      - "El rizado está donde el condensador alisa la salida."
    solucion: "La sonda en la salida, positivo."

  - id: mas-fallan
    tipo: tocar
    titulo: "Lo que más falla"
    texto: "Toque los componentes de una conmutada de más a menos frecuentes en las averías."
    libro: [51, 52, 53, 54, 55]
    widget:
      tipo: figura
      codigo:
        lenguaje: texto
        texto: |-
          El optoacoplador
          El interruptor
          Los electrolíticos de salida
          La NTC de irrupción
      zonas:
        - { id: opto, lineas: [1], rotulo: "El optoacoplador" }
        - { id: interruptor, lineas: [2], rotulo: "El interruptor" }
        - { id: electroliticos, lineas: [3], rotulo: "Los electrolíticos de salida" }
        - { id: ntc, lineas: [4], rotulo: "La NTC de irrupción" }
    tocar:
      bien: [electroliticos, interruptor, ntc, opto]
      orden: true
    exito: "Electrolíticos, interruptor, NTC y optoacoplador, cuyo CTR se degrada y deja una regulación que se va con los años."
    escalera:
      - "Lo primero, lo que sufre corriente de rizado y calor."
    solucion: "Electrolíticos de salida, interruptor, NTC y optoacoplador."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [33, 45, 48, 57]
    ideas:
      - { titulo: "Seis bloques.", texto: "Entrada, rectificador, interruptor, transformador, secundario y realimentación." }
      - { titulo: "La frontera.", texto: "Antes de tocar nada; el primario está a tensión de red." }
      - { titulo: "Síntomas.", texto: "Rizado alto con salida baja: electrolíticos de salida." }
      - { titulo: "Medidas seguras.", texto: "Sin aislamiento, solo el secundario, y el rizado en AC." }
