# Lección 1.2 de la sección 20.6 «Las Dos Escalas Fundamentales: VOLT/DIV y TIME/DIV» (cap21; etiqueta interna
# sec-21.6). Formato: contenido/lecciones11/GUIA.md. Una pantalla simulada de 12 × 8 divisiones: la senoide se dibuja
# en divisiones (amplitud/(V/div)) y se recorta en ± 4 divisiones; el eje horizontal son las 12 divisiones, cada una
# de s/div segundos. La señal de partida es la de los ejercicios 20.2 y 20.3 (1 V de pico, 2 V de pico a pico) a
# 1 kHz, la frecuencia del ejemplo del bloque 122; los ejercicios usan 200 Hz.
leccion: cap21/sec-21.6

libro:
  110: "una rejilla de 8 divisiones verticales por 12 horizontales"
  111: "una señal que ocupa media pantalla se mide bien"
  113: '"amplitud en pantalla"'
  114: "entre 4 y 6 de las 8 divisiones verticales"
  116: "una señal recortada puede parecer una cuadrada perfectamente legítima"
  119: '"ciclos en pantalla"'
  121: "La forma general y la frecuencia"
  122: "Para 1 kHz y dos ciclos: 2/(12 × 1000) ≈ 170 µs/div, y se elige 200 µs/div"
  128: "sirve para ver lo que ocurre antes del evento (disparo a la derecha)"
  131: "AUTO es para empezar, no para trabajar"
  133: "leer «cuatro divisiones» y anotar 4 V cuando la escala está en 500 mV/div (son 2 V)"
  134: "comprobar que el orden de magnitud coincide con lo que se esperaba"
  136: "recorrer todas las escalas verticales"
  138: "resolución desperdiciada, ajuste correcto y recorte"
  "cap21#607": "una onda senoidal ocupa 4 divisiones verticales de pico a pico, con la escala en 0,5 V/div"

modelo:
  valores:
    A_s: { sim: "V_{p}", nombre: "tensión de pico de la señal", unidad: V, valor: 1 }
    f_s: { sim: "f", nombre: "frecuencia de la señal", unidad: Hz, valor: 1000 }
    v_div: { sim: "V/div", nombre: "escala vertical", unidad: V, valor: 0.1 }
    s_div: { sim: "s/div", nombre: "base de tiempos", unidad: s, valor: 0.001 }
  calculos:
    V_pp: { expr: "2*A_s", sim: "V_{pp}", nombre: "tensión de pico a pico", unidad: V }
    d_pp: { expr: "V_pp/v_div", sim: "div", nombre: "divisiones de pico a pico", unidad: div, cifras: 2 }
    ciclos: { expr: "12*s_div*f_s", sim: "ciclos", nombre: "ciclos en pantalla", unidad: "", cifras: 2 }
    d_ciclo: { expr: "1/(f_s*s_div)", sim: "div", nombre: "divisiones por ciclo", unidad: div, cifras: 2 }

tarjetas:
  - id: explore-escalas
    tipo: explorar
    titulo: "Las dos escalas son el instrumento"
    texto: "La misma senoide en una pantalla de 8 por 12 divisiones. Mueva VOLT/DIV y TIME/DIV."
    libro: [110, 111]
    widget:
      tipo: grafica
      x: { id: d, min: 0, max: 12, unidad: div, rotulo: "horizontal" }
      y: { min: -4, max: 4, unidad: div, rotulo: "vertical" }
      curvas:
        - { expr: "max(-4, min(4, A_s*sin(2*pi*f_s*d*s_div)/v_div))", color: naranja, rotulo: "CH1" }
      lectura: { valor: d_pp, rotulo: "Alto en pantalla" }
      datos:
        - { valor: ciclos, rotulo: "Ciclos en pantalla: {{ciclos}}" }
      mandos:
        - { valor: v_div, lista: [0.05, 0.1, 0.2, 0.5, 1, 2], rotulo: "VOLT/DIV" }
        - { valor: s_div, lista: [0.00005, 0.0001, 0.0002, 0.0005, 0.001], rotulo: "TIME/DIV" }
    requiere: { mover: [v_div, s_div] }

  - id: formula-vertical
    tipo: formula
    titulo: "Divisiones de alto"
    texto: "La amplitud en pantalla es la de la señal dividida por la escala. Busque entre 4 y 6 divisiones."
    libro: [113, 114]
    ec: 113
    sustitucion: "{{V_pp}} / {{v_div}} = {{d_pp}}"
    widget:
      tipo: grafica
      x: { id: d, min: 0, max: 12, unidad: div, rotulo: "horizontal" }
      y: { min: -4, max: 4, unidad: div, rotulo: "vertical" }
      curvas:
        - { expr: "max(-4, min(4, A_s*sin(2*pi*f_s*d*s_div)/v_div))", color: naranja, rotulo: "CH1" }
      lectura: { valor: d_pp, rotulo: "Alto en pantalla" }
      mandos:
        - { valor: v_div, lista: [0.05, 0.1, 0.2, 0.5, 1, 2], rotulo: "VOLT/DIV" }

  - id: toque-recorte
    tipo: tocar
    titulo: "La que miente sin avisar"
    texto: "Tres escalas para la misma señal. Toque la que da un pico a pico falso."
    libro: [114, 116, 138]
    widget:
      tipo: figura
      figura: fig-21.11
      zonas:
        - { id: grande, rotulo: "A la izquierda", rect: [0, 20, 148, 105] }
        - { id: buena, rotulo: "En el centro", rect: [153, 20, 148, 105] }
        - { id: recorte, rotulo: "A la derecha", rect: [306, 20, 147, 105] }
    tocar:
      bien: [recorte]
      porque:
        grande: "Desperdicia resolución, pero el pico a pico es el de la señal: solo se mide con pocos niveles."
        buena: "Ocupa 5 divisiones: dentro de las 4 a 6 que se buscan."
    exito: "A 0,5 V/div la señal ocupa 10 divisiones: los picos se recortan y la medida pierde la información."
    escalera: ["Una pantalla tiene 8 divisiones: ¿cuál no cabe?"]
    solucion: "A la derecha: 10 divisiones, picos recortados."

  - id: formula-horizontal
    tipo: formula
    titulo: "Cuántos ciclos"
    texto: "Los ciclos en pantalla son las 12 divisiones por la base de tiempos por la frecuencia."
    libro: [119, 121]
    fijar: { v_div: 0.5 }
    ec: 119
    sustitucion: "12 · {{s_div}} · {{f_s}} = {{ciclos}}"
    widget:
      tipo: grafica
      x: { id: d, min: 0, max: 12, unidad: div, rotulo: "horizontal" }
      y: { min: -4, max: 4, unidad: div, rotulo: "vertical" }
      curvas:
        - { expr: "max(-4, min(4, A_s*sin(2*pi*f_s*d*s_div)/v_div))", color: naranja, rotulo: "CH1" }
      lectura: { valor: ciclos, rotulo: "Ciclos en pantalla" }
      mandos:
        - { valor: s_div, lista: [0.00005, 0.0001, 0.0002, 0.0005, 0.001], rotulo: "TIME/DIV" }

  - id: ajuste-base
    tipo: ajuste
    titulo: "Dos a cuatro ciclos"
    texto: "Para ver la forma y la frecuencia de esta senoide de 1 kHz, deje entre 2 y 4 ciclos en pantalla."
    libro: [121, 122]
    fijar: { v_div: 0.5, f_s: 1000 }
    inicio: { s_div: 0.001 }
    widget:
      tipo: grafica
      x: { id: d, min: 0, max: 12, unidad: div, rotulo: "horizontal" }
      y: { min: -4, max: 4, unidad: div, rotulo: "vertical" }
      curvas:
        - { expr: "max(-4, min(4, A_s*sin(2*pi*f_s*d*s_div)/v_div))", color: naranja, rotulo: "CH1" }
      lectura: { valor: ciclos, rotulo: "Ciclos en pantalla" }
      mandos:
        - { valor: s_div, lista: [0.00001, 0.00002, 0.00005, 0.0001, 0.0002, 0.0005, 0.001, 0.002], rotulo: "TIME/DIV" }
    ajuste:
      valor: ciclos
      min: 2
      max: 4
      rotulo: "Ciclos en pantalla"
      escala: { min: 0, max: 13 }
      bajo: "Menos de dos ciclos: alargue la base de tiempos."
      alto: "Demasiados ciclos para ver la forma: acorte la base de tiempos."
      dentro: "2/(12 × 1000) ≈ 170 µs/div: se elige 200 µs/div, el valor más próximo."

  - id: sorpresa-recorte
    tipo: sorpresa
    titulo: "Una cuadrada que no lo es"
    texto: "Esta señal parece una cuadrada legítima. Suba VOLT/DIV y mire qué aparece."
    libro: [116, 138]
    fijar: { A_s: 2.5, s_div: 0.0005 }
    inicio: { v_div: 0.2 }
    widget:
      tipo: grafica
      x: { id: d, min: 0, max: 12, unidad: div, rotulo: "horizontal" }
      y: { min: -4, max: 4, unidad: div, rotulo: "vertical" }
      curvas:
        - { expr: "max(-4, min(4, A_s*sin(2*pi*f_s*d*s_div)/v_div))", color: naranja, rotulo: "CH1" }
      lectura: { valor: d_pp, rotulo: "Alto de la señal" }
      mandos:
        - { valor: v_div, lista: [0.2, 0.5, 1, 2], rotulo: "VOLT/DIV" }
    requiere: { mover: [v_div] }

  - id: estime-vpp
    tipo: pregunta
    titulo: "Lea la amplitud"
    texto: "Una senoide ocupa 4 divisiones de pico a pico, con 0,5 V/div. ¿Cuánto vale de pico a pico?"
    libro: [113, "cap21#607"]
    fijar: { A_s: 1, f_s: 200, v_div: 0.5, s_div: 0.001 }
    widget:
      tipo: grafica
      x: { id: d, min: 0, max: 12, unidad: div, rotulo: "horizontal" }
      y: { min: -4, max: 4, unidad: div, rotulo: "vertical" }
      curvas:
        - { expr: "max(-4, min(4, A_s*sin(2*pi*f_s*d*s_div)/v_div))", color: naranja, rotulo: "CH1" }
    estimar:
      objetivo: "V_pp"
      unidad: V
      min: 0
      max: 5
      paso: 0.1
      inicio: 4
      tol: 0.03
      rotulo: "V_{pp}"
    exito: "4 div × 0,5 V/div = 2 V de pico a pico: 1 V de pico."
    pistas:
      - { cuando: { valor: estimacion, mayor: 2.06 }, texto: "Se ha pasado: ¿ha anotado las divisiones como si fueran voltios? Cada una vale 0,5 V." }
      - { texto: "Se ha quedado corto: multiplique las 4 divisiones por los 0,5 V de cada una." }
    escalera:
      - "Divisiones por voltios por división."
    solucion: "4 × 0,5 V = 2 V."
    comprobar:
      - { V_pp: 2 }

  - id: estime-frecuencia
    tipo: pregunta
    titulo: "Lea la frecuencia"
    texto: "La misma onda completa un ciclo cada 5 divisiones, con 1 ms/div. ¿Qué frecuencia tiene?"
    libro: [119, "cap21#607"]
    fijar: { A_s: 1, f_s: 200, v_div: 0.5, s_div: 0.001 }
    widget:
      tipo: grafica
      x: { id: d, min: 0, max: 12, unidad: div, rotulo: "horizontal" }
      y: { min: -4, max: 4, unidad: div, rotulo: "vertical" }
      curvas:
        - { expr: "max(-4, min(4, A_s*sin(2*pi*f_s*d*s_div)/v_div))", color: naranja, rotulo: "CH1" }
    estimar:
      objetivo: "f_s"
      unidad: Hz
      min: 0
      max: 1000
      paso: 10
      inicio: 800
      tol: 0.05
      rotulo: "f"
    exito: "T = 5 div × 1 ms/div = 5 ms, y f = 1/T = 200 Hz."
    pistas:
      - { cuando: { valor: estimacion, mayor: 210 }, texto: "Se ha pasado: el periodo es 5 ms, no 1 ms." }
      - { texto: "Se ha quedado corto: halle el periodo, 5 ms, y luego f = 1/T." }
    escalera:
      - "Primero el periodo: divisiones por segundos por división."
    solucion: "T = 5 ms; f = 1/0,005 = 200 Hz."
    comprobar:
      - { d_ciclo: 5, ciclos: 2.4 }

  - id: lectura-escala
    tipo: pregunta
    titulo: "Leer sin mirar la escala"
    texto: "Cuenta cuatro divisiones y la escala está en 500 mV/div. ¿Qué anota?"
    libro: [133, 134]
    fijar: { A_s: 1, v_div: 0.5, s_div: 0.0005 }
    widget:
      tipo: grafica
      x: { id: d, min: 0, max: 12, unidad: div, rotulo: "horizontal" }
      y: { min: -4, max: 4, unidad: div, rotulo: "vertical" }
      curvas:
        - { expr: "max(-4, min(4, A_s*sin(2*pi*f_s*d*s_div)/v_div))", color: naranja, rotulo: "CH1" }
    opciones:
      - texto: "2 V"
        bien: true
        porque: "Cuatro divisiones de 500 mV son 2 V. Antes de anotar, se lee la escala."
      - texto: "4 V"
        porque: "Es la equivocación más común: anotar las divisiones como si cada una valiera un voltio."
      - texto: "20 V"
        porque: "Eso sería multiplicar por diez de más, como con la sonda en ×10 y el menú en ×1."
    escalera:
      - "Cada división vale lo que dice la escala."
    solucion: "4 × 500 mV = 2 V."

  - id: auto-limites
    tipo: pregunta
    titulo: "Cuando AUTO falla"
    texto: "AUTO acierta casi siempre con una señal periódica y estable. ¿Con cuál falla?"
    libro: [131]
    widget:
      tipo: figura
      figura: fig-21.10
      zonas:
        - { id: escalas, rotulo: "Las escalas", rect: [0, 0, 446, 267] }
    opciones:
      - texto: "Un evento único que ocurre una vez"
        bien: true
        porque: "Falla en lo que más interesa: no periódicas, eventos únicos, muy lentas o con mucha continua y poca alterna."
      - texto: "Una senoide de 1 kHz"
        porque: "Periódica y estable: ahí acierta casi siempre."
      - texto: "Una cuadrada del generador"
        porque: "También es periódica y estable."
    escalera:
      - "AUTO necesita una señal que se repita para ajustarse."
    solucion: "El evento único. AUTO es para empezar, no para trabajar."

  - id: posicion
    tipo: pregunta
    titulo: "El disparo a la derecha"
    texto: "En una captura única de un fallo, pone el instante del disparo a la derecha de la pantalla. ¿Qué ve?"
    libro: [128]
    widget:
      tipo: figura
      figura: fig-21.10
      zonas:
        - { id: escalas, rotulo: "Las escalas", rect: [0, 0, 446, 267] }
    opciones:
      - texto: "Lo que ocurre antes del evento: la causa"
        bien: true
        porque: "La pantalla queda a la izquierda del disparo: lo anterior."
      - texto: "Lo que ocurre después: la consecuencia"
        porque: "Eso es con el disparo a la izquierda."
      - texto: "Lo mismo: la posición horizontal no cambia nada"
        porque: "Decide si se ve la causa o la consecuencia."
    escalera:
      - "Si el disparo está a la derecha, ¿qué queda en el resto de la pantalla?"
    solucion: "Lo que ocurre antes del evento."

  - id: banco-ciclo
    tipo: banco
    titulo: "Cinco divisiones por ciclo"
    texto: "Con la cuadrada de 1 kHz del generador a 200 µs/div, cuente cuántas divisiones ocupa un ciclo."
    libro: [122, 136]
    fijar: { f_s: 1000, s_div: 0.0002 }
    banco:
      piezas: ["FNIRSI 2C53T con una sonda ×10 compensada", "La salida DDS: cuadrada de 1 kHz"]
      medir: "Las divisiones horizontales de un ciclo, de flanco de subida a flanco de subida."
      esperado: d_ciclo
      unidad: div
      tol: 0.05
      consejos:
        - { cuando: { valor: desviacion, mayor: 0.05 }, texto: "Le salen de más: compruebe la base de tiempos en pantalla y la frecuencia del generador." }
        - { cuando: { valor: desviacion, menor: -0.05 }, texto: "Le salen de menos: ¿está a 200 µs/div? Mida entre dos flancos iguales." }
        - { texto: "Bien. Recorra ahora todas las escalas, de un píxel a salirse, y de un flanco a cientos de ciclos." }
    comprobar:
      - { d_ciclo: 5 }

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [113, 114, 116, 119, 133]
    ideas:
      - { titulo: "Vertical.", texto: "Entre 4 y 6 de las 8 divisiones: ni resolución desperdiciada ni recorte." }
      - { titulo: "Horizontal.", texto: "Ciclos = 12 · s/div · f; de 2 a 4 para la forma." }
      - { titulo: "El recorte engaña.", texto: "Puede parecer una cuadrada: baje la sensibilidad y mire si salen picos." }
      - { titulo: "Lea la escala.", texto: "Antes de anotar, y compruebe el orden de magnitud." }
