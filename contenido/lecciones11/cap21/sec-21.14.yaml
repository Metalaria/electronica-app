# Lección 1.2 de la sección 20.14 «Modo X-Y y Curvas de Lissajous» (cap21; etiqueta interna sec-21.14). Formato:
# contenido/lecciones11/GUIA.md. La elipse de dos senoides de igual frecuencia y amplitud (normalizadas a 1) con
# desfase φ se dibuja como sus dos ramas, y = x·cos φ ± √(1 − x²)·sen φ, con x de −1 a 1; corta el eje vertical en
# ± sen φ (A/B de la figura 20.29). El trazador de curvas, con el generador del 2C53T (de 0 a 3 V) y 1 kΩ: la
# resistencia es una recta de pendiente 1/R; el diodo, la ecuación de Shockley ilustrativa (I_S = 1 nA, n = 2), sin
# pasar de 3 mA; solo el primer cuadrante, como dice el bloque 403.
leccion: cap21/sec-21.14

libro:
  378: "un canal gobierna la horizontal y el otro la vertical"
  382: "Recta a 45°"
  383: "contar las tangencias"
  385: "poco precisa cerca de 90°, donde el seno apenas cambia con el ángulo"
  388: "la tensión del componente en X y la caída en la resistencia (proporcional a la corriente) en Y"
  390: "Una resistencia como una recta cuya pendiente es su conductancia"
  391: "sin alimentación y sin desoldar nada"
  397: "no se sabe en qué orden se recorre la figura ni a qué velocidad"
  399: "a frecuencias altas eso convierte una recta en una elipse falsa"
  403: "su salida es siempre positiva, de 0 a 3 V como máximo"
  404: "la forma de la elipse indica el desfase (sen φ = A/B)"

modelo:
  valores:
    phi: { sim: "φ", nombre: "desfase", unidad: "°", valor: 0 }
    comp: { sim: "componente", nombre: "componente bajo prueba", unidad: "", valor: 0 }
    R_t: { sim: "R", nombre: "resistencia de prueba", unidad: Ω, valor: 1000 }
  calculos:
    A_B: { expr: "sin(phi*pi/180)", sim: "A/B", nombre: "corte con el eje vertical frente a la altura", unidad: "", cifras: 2 }

tarjetas:
  - id: explore-lissajous
    tipo: explorar
    titulo: "Una señal contra otra"
    texto: "Dos senoides iguales, una en X y otra en Y. Cambie el desfase y mire la figura."
    libro: [378, 382, 404]
    inicio: { phi: 0 }
    widget:
      tipo: grafica
      x: { id: x, min: -1, max: 1, unidad: "", rotulo: "CH1 (X)" }
      y: { min: -1.2, max: 1.2, unidad: "", rotulo: "CH2 (Y)" }
      curvas:
        - { expr: "x*cos(phi*pi/180) + sqrt(max(0, 1 - x^2))*sin(phi*pi/180)", color: azul, rotulo: "XY" }
        - { expr: "x*cos(phi*pi/180) - sqrt(max(0, 1 - x^2))*sin(phi*pi/180)", color: azul, rotulo: "XY" }
      lectura: { valor: A_B, rotulo: "A/B = sen φ" }
      mandos:
        - { valor: phi, lista: [0, 30, 45, 90, 135, 180], rotulo: "Desfase" }
    requiere: { mover: [phi] }

  - id: figuras
    tipo: pregunta
    titulo: "Relación y figura"
    texto: "Empareje cada par de senoides con la figura que dibujan."
    libro: [382]
    widget:
      tipo: figura
      figura: fig-21.29
      zonas:
        - { id: figuras, rotulo: "Figuras de Lissajous", rect: [0, 0, 420, 307] }
    emparejar:
      - ["1:1 en fase", "Recta a 45°"]
      - ["1:1 a 90°, amplitudes iguales", "Círculo"]
      - ["1:1, desfase intermedio", "Elipse"]
      - ["1:2", "Figura de ocho"]
    exito: "La relación de frecuencias se lee contando las tangencias con los bordes."
    pistas:
      - { texto: "En fase, X e Y suben juntas; a 90°, cuando una está en su pico la otra pasa por cero." }
    escalera:
      - "Si las dos son iguales en todo instante, ¿qué dibuja Y frente a X?"
    solucion: "En fase, recta; a 90°, círculo; intermedio, elipse; 1:2, un ocho."

  - id: estime-desfase
    tipo: pregunta
    titulo: "Lea el desfase"
    texto: "La elipse corta el eje vertical a la mitad de su altura máxima. ¿Qué desfase hay?"
    libro: [385, 404]
    fijar: { phi: 30 }
    widget:
      tipo: grafica
      x: { id: x, min: -1, max: 1, unidad: "", rotulo: "CH1 (X)" }
      y: { min: -1.2, max: 1.2, unidad: "", rotulo: "CH2 (Y)" }
      curvas:
        - { expr: "x*cos(phi*pi/180) + sqrt(max(0, 1 - x^2))*sin(phi*pi/180)", color: azul, rotulo: "XY" }
        - { expr: "x*cos(phi*pi/180) - sqrt(max(0, 1 - x^2))*sin(phi*pi/180)", color: azul, rotulo: "XY" }
    estimar:
      objetivo: "phi"
      unidad: "°"
      min: 0
      max: 90
      paso: 1
      inicio: 75
      tol: 0.07
      rotulo: "Desfase"
    exito: "sen φ = A/B = 0,5: φ = 30°."
    pistas:
      - { cuando: { valor: estimacion, mayor: 32 }, texto: "Se ha pasado: ¿qué ángulo tiene un seno de 0,5?" }
      - { texto: "Se ha quedado corto: sen φ = A/B = 0,5." }
    escalera:
      - "sen φ = A/B."
    solucion: "A/B = 0,5, así que φ = 30°."
    comprobar:
      - { A_B: 0.5 }

  - id: precision-90
    tipo: predecir
    titulo: "Cerca de 90°"
    texto: "¿Dónde es más precisa la medida de desfase con la elipse?"
    libro: [385]
    fijar: { phi: 90 }
    widget:
      tipo: grafica
      x: { id: x, min: -1, max: 1, unidad: "", rotulo: "CH1 (X)" }
      y: { min: -1.2, max: 1.2, unidad: "", rotulo: "CH2 (Y)" }
      curvas:
        - { expr: "x*cos(phi*pi/180) + sqrt(max(0, 1 - x^2))*sin(phi*pi/180)", color: azul, rotulo: "XY" }
        - { expr: "x*cos(phi*pi/180) - sqrt(max(0, 1 - x^2))*sin(phi*pi/180)", color: azul, rotulo: "XY" }
      lectura: { valor: A_B, rotulo: "A/B = sen φ" }
      ocultar: true
    opciones:
      - texto: "Cerca de 0° y de 180°"
        bien: true
        porque: "Ahí el seno cambia mucho con el ángulo; cerca de 90° apenas cambia y la lectura es poco precisa."
      - texto: "Cerca de 90°"
        porque: "Es donde peor: el seno apenas cambia con el ángulo, y A/B casi no se mueve."
      - texto: "Igual en todo el margen"
        porque: "La precisión sigue a la pendiente del seno, que no es constante."
    escalera:
      - "¿Dónde cambia más deprisa el seno con el ángulo?"
    solucion: "Cerca de 0° y de 180°."

  - id: explore-trazador
    tipo: explorar
    titulo: "El trazador de curvas"
    texto: "Tensión del componente en X y caída en la resistencia en Y: su curva I-V. Cambie el componente."
    libro: [388, 390]
    inicio: { comp: 0 }
    widget:
      tipo: grafica
      x: { id: v, min: 0, max: 3, unidad: V, rotulo: "X: tensión del componente" }
      y: { min: 0, max: 0.0035, unidad: A, rotulo: "Y: corriente" }
      curvas:
        - { expr: "(1 - comp)*v/R_t + comp*min(0.003, 0.000000001*(exp(v/0.0517) - 1))", color: naranja, rotulo: "I-V" }
      mandos:
        - { valor: comp, lista: [0, 1], nombres: [resistencia, diodo], rotulo: "Componente" }
    requiere: { mover: [comp] }

  - id: prediga-zener
    tipo: predecir
    titulo: "La ruptura de un Zener"
    texto: "Con el generador del 2C53T monta el trazador para ver la ruptura de un Zener. ¿La verá?"
    libro: [403]
    fijar: { comp: 1 }
    widget:
      tipo: grafica
      x: { id: v, min: 0, max: 3, unidad: V, rotulo: "X: tensión del componente" }
      y: { min: 0, max: 0.0035, unidad: A, rotulo: "Y: corriente" }
      curvas:
        - { expr: "(1 - comp)*v/R_t + comp*min(0.003, 0.000000001*(exp(v/0.0517) - 1))", color: naranja, rotulo: "I-V" }
    opciones:
      - texto: "No: solo se dibuja el primer cuadrante"
        bien: true
        porque: "La salida es siempre positiva, de 0 a 3 V: nunca hay tensión inversa. Hace falta una alterna simétrica."
      - texto: "Sí, con más amplitud"
        porque: "Más amplitud no da tensión inversa: la salida sigue siendo positiva."
      - texto: "Sí, invirtiendo el canal Y"
        porque: "Invertir la representación no aplica tensión inversa al componente."
    escalera:
      - "¿Qué signo tiene siempre la salida del generador del 2C53T?"
    solucion: "No: el generador va de 0 a 3 V y solo dibuja el primer cuadrante."

  - id: diagnostico
    tipo: pregunta
    titulo: "Por qué gusta en reparación"
    texto: "¿Qué hace tan útil el trazado de curvas comparativo en una placa?"
    libro: [390, 391]
    widget:
      tipo: figura
      figura: fig-21.29
      zonas:
        - { id: figuras, rotulo: "Figuras XY", rect: [0, 0, 420, 307] }
    opciones:
      - texto: "Compara nodo a nodo con una placa buena, sin alimentar ni desoldar"
        bien: true
        porque: "Revela diferencias que ninguna medida estática detecta."
      - texto: "Mide el valor exacto de cada componente"
        porque: "No mide valores: compara firmas entre un componente bueno y uno sospechoso."
      - texto: "Funciona con la placa encendida"
        porque: "Al revés: se hace sin alimentación."
    escalera:
      - "Se compara con una placa idéntica."
    solucion: "Compara dos placas nodo a nodo, sin alimentación y sin desoldar."

  - id: limites
    tipo: porque
    titulo: "Una elipse que no existe"
    texto: "Dos señales en fase deberían dar una recta, pero a frecuencia alta sale una elipse. ¿Por qué?"
    libro: [397, 399]
    fijar: { phi: 30 }
    widget:
      tipo: grafica
      x: { id: x, min: -1, max: 1, unidad: "", rotulo: "CH1 (X)" }
      y: { min: -1.2, max: 1.2, unidad: "", rotulo: "CH2 (Y)" }
      curvas:
        - { expr: "x*cos(phi*pi/180) + sqrt(max(0, 1 - x^2))*sin(phi*pi/180)", color: azul, rotulo: "XY" }
        - { expr: "x*cos(phi*pi/180) - sqrt(max(0, 1 - x^2))*sin(phi*pi/180)", color: azul, rotulo: "XY" }
    opciones:
      - texto: "El desfase propio del instrumento entre canales"
        bien: true
        porque: "Aparece como un desfase que no existe: a frecuencias altas convierte la recta en una elipse falsa."
      - texto: "Las señales se han desfasado de verdad"
        porque: "Puede, pero primero hay que descartar el instrumento: sus canales también desfasan."
      - texto: "Falta el eje de tiempo"
        porque: "Sin eje de tiempo no se sabe el orden de recorrido, pero eso no dibuja una elipse."
    escalera:
      - "¿Retrasan los dos canales del osciloscopio exactamente lo mismo?"
    solucion: "El desfase propio entre canales, que crece con la frecuencia."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [378, 383, 388, 403]
    ideas:
      - { titulo: "Sin tiempo.", texto: "Un canal en X, otro en Y: la relación entre dos señales." }
      - { titulo: "Lissajous.", texto: "Tangencias para la relación de frecuencias; sen φ = A/B para el desfase." }
      - { titulo: "Trazador.", texto: "La característica I-V de un componente, para comparar con uno bueno." }
      - { titulo: "Con el 2C53T.", texto: "Su generador va de 0 a 3 V: solo el primer cuadrante." }
