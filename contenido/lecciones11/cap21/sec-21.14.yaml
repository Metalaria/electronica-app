# Lección 1.2 de la sección 20.14 «Modo X-Y y Curvas de Lissajous» (cap21; etiqueta interna sec-21.14). Formato:
# contenido/lecciones11/GUIA.md. La elipse de dos senoides de igual frecuencia y amplitud (normalizadas a 1) con
# desfase φ se dibuja como sus dos ramas, y = x·cos φ ± √(1 − x²)·sen φ, con x de −1 a 1; corta el eje vertical en
# ± sen φ (A/B de la figura 20.29). El trazador de curvas, con el generador del 2C53T (de 0 a 3 V) y 1 kΩ: la
# resistencia es una recta de pendiente 1/R; el diodo, la ecuación de Shockley ilustrativa (I_S = 1 nA, n = 2), sin
# pasar de 3 mA; solo el primer cuadrante, como dice el bloque 403. 1.2.1 (aprender haciendo): dibujar el círculo,
# tocar la relación por tangencias, leer el desfase, tocar la figura menos precisa, ver el diodo y tocar la causa de la
# elipse falsa. Dos preguntas: el Zener con el generador del 2C53T y el trazado comparativo.
# 1.2.1, segunda pasada: sin listas de respuestas disfrazadas; quedan las tarjetas que se hacen y dos preguntas.
# 1.3 (contenido13b): +tocar la figura de tres tangencias (relación 1:3, bloque 383): 4/6 → 5/7.
leccion: cap21/sec-21.14

libro:
  384: "Antes de los frecuencímetros digitales, esa era la forma de"
  396: "Sus limitaciones"
  378: "un canal gobierna la horizontal y el otro la vertical"
  382: "Recta a 45°"
  383: "contar las tangencias"
  385: "poco precisa cerca de 90°, donde el seno apenas cambia con el ángulo"
  388: "la tensión del componente en X y la caída en la resistencia (proporcional a la corriente) en Y"
  390: "Una resistencia como una recta cuya pendiente es su conductancia"
  391: "sin alimentación y sin desoldar nada"
  397: "no se sabe en qué orden se recorre la figura ni a qué velocidad"
  399: "a frecuencias altas eso convierte una recta en una elipse falsa"
  403: "su salida es siempre positiva, de 0 a 3 V como máximo"
  404: "la forma de la elipse indica el desfase (sen φ = A/B)"

modelo:
  valores:
    phi: { sim: "φ", nombre: "desfase", unidad: "°", valor: 0 }
    comp: { sim: "componente", nombre: "componente bajo prueba", unidad: "", valor: 0 }
    R_t: { sim: "R", nombre: "resistencia de prueba", unidad: Ω, valor: 1000 }
  calculos:
    A_B: { expr: "sin(phi*pi/180)", sim: "A/B", nombre: "corte con el eje vertical frente a la altura", unidad: "", cifras: 2 }

tarjetas:
  - id: explore-lissajous
    tipo: explorar
    titulo: "Una señal contra otra"
    texto: "Dos senoides iguales, una en X y otra en Y. Busque el desfase que dibuja un círculo."
    libro: [378, 382, 404]
    inicio: { phi: 0 }
    widget:
      tipo: grafica
      x: { id: x, min: -1, max: 1, unidad: "", rotulo: "CH1 (X)" }
      y: { min: -1.2, max: 1.2, unidad: "", rotulo: "CH2 (Y)" }
      curvas:
        - { expr: "x*cos(phi*pi/180) + sqrt(max(0, 1 - x^2))*sin(phi*pi/180)", color: azul, rotulo: "XY" }
        - { expr: "x*cos(phi*pi/180) - sqrt(max(0, 1 - x^2))*sin(phi*pi/180)", color: azul, rotulo: "XY" }
      lectura: { valor: A_B, rotulo: "A/B = sen φ" }
      mandos:
        - { valor: phi, lista: [0, 30, 45, 90, 135, 180], rotulo: "Desfase" }
    objetivo:
      condiciones:
        - { valor: phi, min: 90, max: 90, rotulo: "Desfase: {{phi}}" }
      logrado: "A 90° y con amplitudes iguales, un círculo; en fase, una recta; entre medias, elipses."
      pistas:
        - { cuando: { valor: phi, mayor: 90 }, texto: "Se ha pasado: vuelva atrás." }
        - { texto: "Aumente el desfase." }
    escalera:
      - "La recta se abre en elipse al desfasar."
    solucion: "90°."

  - id: estime-desfase
    tipo: leer
    titulo: "Lea el desfase"
    texto: "La elipse corta el eje vertical a la mitad de su altura máxima. Lea el desfase."
    libro: [385, 404]
    fijar: { phi: 30 }
    widget:
      tipo: grafica
      x: { id: x, min: -1, max: 1, unidad: "", rotulo: "CH1 (X)" }
      y: { min: -1.2, max: 1.2, unidad: "", rotulo: "CH2 (Y)" }
      curvas:
        - { expr: "x*cos(phi*pi/180) + sqrt(max(0, 1 - x^2))*sin(phi*pi/180)", color: azul, rotulo: "XY" }
        - { expr: "x*cos(phi*pi/180) - sqrt(max(0, 1 - x^2))*sin(phi*pi/180)", color: azul, rotulo: "XY" }
    exito: "sen φ = A/B = 0,5: φ = 30°."
    leer:
      objetivo: phi
      unidad: "°"
      tol: 0.05
      rotulo: "Desfase"
      errores:
        - { expr: "A_B", texto: "Eso es A/B, el seno: falta pasar al ángulo." }
        - { expr: "90 - phi", texto: "Ese es el ángulo cuyo coseno vale A/B: use el seno." }
    escalera:
      - "sen φ = A/B."
    solucion: "A/B = 0,5, así que φ = 30°."
    comprobar:
      - { A_B: 0.5 }

  - id: precision-90
    tipo: tocar
    titulo: "La medida menos precisa"
    texto: "Toque la figura en la que el desfase se mide con menos precisión."
    libro: [385, 404]
    widget:
      tipo: figura
      figura: fig-21.29
      zonas:
        - { id: p0, rotulo: "Arriba a la izquierda", rect: [0, 0, 118, 145] }
        - { id: p45, rotulo: "Arriba en el centro", rect: [150, 0, 120, 145] }
        - { id: p90, rotulo: "Arriba a la derecha", rect: [300, 0, 120, 145] }
        - { id: p180, rotulo: "Abajo a la izquierda", rect: [0, 165, 118, 140] }
        - { id: r12, rotulo: "Abajo en el centro", rect: [150, 165, 120, 140] }
        - { id: r13, rotulo: "Abajo a la derecha", rect: [300, 165, 120, 140] }
    tocar:
      bien: [p90]
      porque:
        p0: "Cerca de 0° la medida es rápida y precisa."
        p45: "Lejos de 90°, el seno aún cambia con el ángulo."
        p180: "Cerca de 180° también es precisa."
        r12: "No es de igual frecuencia: se lee contando tangencias."
        r13: "No es de igual frecuencia: se lee contando tangencias."
    exito: "Cerca de 90° el seno apenas cambia con el ángulo."
    escalera:
      - "¿Dónde cambia menos el seno?"
    solucion: "Arriba a la derecha: el círculo de 90°."

  - id: toque-tangencias
    tipo: tocar
    titulo: "Contar tangencias"
    texto: "Una frecuencia desconocida en Y frente a un patrón en X: la figura toca tres veces el borde de arriba y una el lateral. Tóquela."
    libro: [382, 383, 404]
    widget:
      tipo: figura
      figura: fig-21.29
      zonas:
        - { id: p0, rotulo: "Arriba a la izquierda", rect: [0, 0, 118, 145] }
        - { id: p45, rotulo: "Arriba en el centro", rect: [150, 0, 120, 145] }
        - { id: p90, rotulo: "Arriba a la derecha", rect: [300, 0, 120, 145] }
        - { id: p180, rotulo: "Abajo a la izquierda", rect: [0, 165, 118, 140] }
        - { id: r12, rotulo: "Abajo en el centro", rect: [150, 165, 120, 140] }
        - { id: r13, rotulo: "Abajo a la derecha", rect: [300, 165, 120, 140] }
    tocar:
      bien: [r13]
      porque:
        p0: "Una recta es la misma frecuencia en fase: no tiene tangencias que contar."
        p45: "Una elipse es la misma frecuencia con desfase."
        p90: "El círculo es la misma frecuencia a 90°."
        p180: "Una recta inversa: la misma frecuencia en oposición."
        r12: "Esa toca dos veces arriba y una al lado: la relación 1:2."
    exito: "Tres tangencias arriba frente a una al lado: la frecuencia de Y es el triple de la del patrón, la relación 1:3."
    escalera:
      - "Cuente los puntos naranjas del borde de arriba."
    solucion: "Abajo a la derecha: 1:3."

  - id: explore-trazador
    tipo: explorar
    titulo: "El trazador de curvas"
    texto: "Tensión del componente en X y caída en la resistencia en Y: su curva I-V. Pase de la resistencia al diodo."
    libro: [388, 390]
    inicio: { comp: 0 }
    widget:
      tipo: grafica
      x: { id: v, min: 0, max: 3, unidad: V, rotulo: "X: tensión del componente" }
      y: { min: 0, max: 0.0035, unidad: A, rotulo: "Y: corriente" }
      curvas:
        - { expr: "(1 - comp)*v/R_t + comp*min(0.003, 0.000000001*(exp(v/0.0517) - 1))", color: naranja, rotulo: "I-V" }
      mandos:
        - { valor: comp, lista: [0, 1], nombres: [resistencia, diodo], rotulo: "Componente" }
    objetivo:
      condiciones:
        - { valor: comp, min: 1, rotulo: "Componente: diodo" }
      logrado: "El diodo muestra su rodilla y su tensión directa; la resistencia era una recta de pendiente 1/R."
      pistas:
        - { texto: "Pase al diodo." }
    escalera:
      - "X es la tensión del componente; Y, su corriente."
    solucion: "El diodo."

  - id: prediga-zener
    tipo: predecir
    titulo: "La ruptura de un Zener"
    texto: "Con el generador del 2C53T monta el trazador para ver la ruptura de un Zener. ¿La verá?"
    libro: [403]
    fijar: { comp: 1 }
    widget:
      tipo: grafica
      x: { id: v, min: 0, max: 3, unidad: V, rotulo: "X: tensión del componente" }
      y: { min: 0, max: 0.0035, unidad: A, rotulo: "Y: corriente" }
      curvas:
        - { expr: "(1 - comp)*v/R_t + comp*min(0.003, 0.000000001*(exp(v/0.0517) - 1))", color: naranja, rotulo: "I-V" }
    opciones:
      - texto: "No: solo se dibuja el primer cuadrante"
        bien: true
        porque: "La salida es siempre positiva, de 0 a 3 V: nunca hay tensión inversa. Hace falta una alterna simétrica."
      - texto: "Sí, con más amplitud"
        porque: "Más amplitud no da tensión inversa: la salida sigue siendo positiva."
      - texto: "Sí, invirtiendo el canal Y"
        porque: "Invertir la representación no aplica tensión inversa al componente."
    escalera:
      - "¿Qué signo tiene siempre la salida del generador del 2C53T?"
    solucion: "No: el generador va de 0 a 3 V y solo dibuja el primer cuadrante."

  - id: diagnostico
    tipo: pregunta
    titulo: "Por qué gusta en reparación"
    texto: "¿Qué hace tan útil el trazado de curvas comparativo en una placa?"
    libro: [390, 391]
    widget:
      tipo: figura
      figura: fig-21.29
      zonas:
        - { id: figuras, rotulo: "Figuras XY", rect: [0, 0, 420, 307] }
    opciones:
      - texto: "Compara nodo a nodo con una placa buena, sin alimentar ni desoldar"
        bien: true
        porque: "Revela diferencias que ninguna medida estática detecta."
      - texto: "Mide el valor exacto de cada componente"
        porque: "No mide valores: compara firmas entre un componente bueno y uno sospechoso."
      - texto: "Funciona con la placa encendida"
        porque: "Al revés: se hace sin alimentación."
    escalera:
      - "Se compara con una placa idéntica."
    solucion: "Compara dos placas nodo a nodo, sin alimentación y sin desoldar."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [378, 383, 388, 403, 384, 396, 397, 399]
    ideas:
      - { titulo: "Sin tiempo.", texto: "Un canal en X, otro en Y: la relación entre dos señales." }
      - { titulo: "Lissajous.", texto: "Tangencias para la relación de frecuencias; sen φ = A/B para el desfase." }
      - { titulo: "Trazador.", texto: "La característica I-V de un componente, para comparar con uno bueno." }
      - { titulo: "Con el 2C53T.", texto: "Su generador va de 0 a 3 V: solo el primer cuadrante." }
