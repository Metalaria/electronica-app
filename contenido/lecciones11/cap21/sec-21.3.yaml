# Lección 1.2 de la sección 20.3 «Los Botones y su Función» (cap21; etiqueta interna sec-21.3). Formato:
# contenido/lecciones11/GUIA.md. Sin modelo numérico: la figura 20.3 (fig-21.3, el panel frontal) con zonas en los
# botones (la figura 20.5 es una tabla de filas de 24 unidades, demasiado estrechas para tocarlas en un teléfono).
# Coordenadas en el svg_vista de la figura (432 × 338,4); la cruceta es una sola zona (su botón central, Run/Stop,
# no cabe como zona propia).
leccion: cap21/sec-21.3

libro:
  39: "se controla con diez botones más la cruceta direccional"
  42: "si no responde a la primera, mantenlo"
  43: "elige entre los tres modos: Osciloscopio, Multímetro y Generador de señal"
  44: "Pulsándolo se alterna qué canal (CH1 o CH2) es el «activo»"
  45: "Es el equivalente a la tecla «Enter»"
  46: "el tipo (Auto/Normal/Single), la fuente (CH1/CH2), el flanco (ascendente/descendente) y el nivel"
  47: "Activa y desactiva la visualización de las medidas automáticas"
  48: "acoplamiento (AC/DC), factor de sonda (×1/×10), inversión de la señal"
  49: "Las flechas arriba/abajo (▲▼) cambian la escala vertical (VOLT/DIV)"
  50: "En STOP, la última captura queda fija en pantalla para analizarla con calma"
  51: "Es el primer recurso cuando no se ve la señal o aparece inestable"
  52: "tras activar la opción «USB Sharing» en la configuración"

modelo:
  valores: {}
  calculos: {}

tarjetas:
  - id: explore-botones
    tipo: explorar
    titulo: "Diez botones y una cruceta"
    texto: "Toque los botones y lea qué hace cada uno. Empiece por AUTO y la cruceta."
    libro: [39, 42, 43, 46, 47, 49, 51]
    widget:
      tipo: figura
      figura: fig-21.3
      zonas:
        - { id: move, rotulo: "MOVE", rect: [127, 153, 46, 36], texto: "Mueve la traza en vertical. Cada pulsación alterna el canal activo, CH1 o CH2." }
        - { id: select, rotulo: "SELECT", rect: [172, 153, 46, 36], texto: "Confirma la opción resaltada o entra en un submenú: es la tecla «Enter»." }
        - { id: trigger, rotulo: "TRIGGER", rect: [216, 153, 46, 36], texto: "El disparo: tipo, fuente, flanco y nivel." }
        - { id: prm, rotulo: "PRM", rect: [261, 153, 46, 36], texto: "Muestra u oculta las medidas automáticas: pico a pico, frecuencia, periodo." }
        - { id: ch1, rotulo: "CH1", rect: [127, 187, 46, 36], texto: "Activa o desactiva el canal 1 y abre su menú: acoplamiento, factor de sonda e inversión." }
        - { id: ch2, rotulo: "CH2", rect: [261, 187, 46, 36], texto: "Lo mismo para el otro canal." }
        - { id: auto, rotulo: "AUTO", rect: [127, 220, 46, 36], texto: "Autoconfiguración: ajusta escalas y disparo. El primer recurso si no se ve la señal o está inestable." }
        - { id: save, rotulo: "SAVE", rect: [261, 220, 46, 36], texto: "Guarda una captura de pantalla o los datos de la forma de onda." }
        - { id: cruceta, rotulo: "Cruceta y Run/Stop", rect: [180, 184, 73, 73], texto: "▲▼: escala vertical o valor. ◄►: base de tiempos o posición. En el centro, Run/Stop congela la captura." }
        - { id: encendido, rotulo: "Encendido", rect: [132, 260, 36, 36], texto: "Enciende y apaga. Si no responde a una pulsación corta, manténgalo." }
        - { id: menu, rotulo: "MENU", rect: [261, 262, 46, 34], texto: "Elige el modo: osciloscopio, multímetro o generador. Y la configuración del sistema." }
    requiere: { mover: [auto, cruceta] }

  - id: toque-auto
    tipo: tocar
    titulo: "No se ve la señal"
    texto: "La señal no aparece, o corre inestable por la pantalla. Toque el primer recurso."
    libro: [51]
    widget:
      tipo: figura
      figura: fig-21.3
      zonas:
        - { id: trigger, rotulo: "Arriba, el tercero", rect: [216, 153, 46, 36] }
        - { id: ch1, rotulo: "Izquierda, el segundo", rect: [127, 187, 46, 36] }
        - { id: auto, rotulo: "Izquierda, el tercero", rect: [127, 220, 46, 36] }
        - { id: cruceta, rotulo: "En el centro", rect: [180, 184, 73, 73] }
    tocar:
      bien: [auto]
      porque:
        trigger: "El disparo estabiliza la imagen, pero hay que saber qué ajustar. Lo primero es dejar que el instrumento lo ajuste solo."
        ch1: "Abre el menú del canal; no ajusta escalas ni disparo."
        cruceta: "Con las flechas se cambian las escalas a mano: más lento que el primer recurso."
    exito: "AUTO analiza la señal y ajusta escalas y disparo para verla estable."
    escalera: ["Busque la autoconfiguración."]
    solucion: "Izquierda, el tercero: AUTO."

  - id: toque-congelar
    tipo: tocar
    titulo: "Congelar la imagen"
    texto: "Quiere que la última captura quede fija para analizarla con calma. Toque dónde."
    libro: [50, 52]
    widget:
      tipo: figura
      figura: fig-21.3
      zonas:
        - { id: save, rotulo: "Derecha, el tercero", rect: [261, 220, 46, 36] }
        - { id: select, rotulo: "Arriba, el segundo", rect: [172, 153, 46, 36] }
        - { id: cruceta, rotulo: "En el centro", rect: [180, 184, 73, 73] }
        - { id: prm, rotulo: "Arriba, el cuarto", rect: [261, 153, 46, 36] }
    tocar:
      bien: [cruceta]
      porque:
        save: "Guarda la captura en un fichero, pero no detiene la adquisición."
        select: "Confirma una opción del menú: es la tecla «Enter»."
        prm: "Muestra u oculta las medidas automáticas."
    exito: "El botón del centro de la cruceta: Run/Stop. En STOP, la última captura queda fija."
    escalera: ["Está en el centro de las flechas."]
    solucion: "En el centro: Run/Stop, en medio de la cruceta."

  - id: toque-multimetro
    tipo: tocar
    titulo: "Pasar al multímetro"
    texto: "Está en el osciloscopio y quiere usar el multímetro. Toque el botón."
    libro: [43]
    widget:
      tipo: figura
      figura: fig-21.3
      zonas:
        - { id: encendido, rotulo: "Abajo a la izquierda", rect: [132, 260, 36, 36] }
        - { id: menu, rotulo: "Abajo a la derecha", rect: [261, 262, 46, 34] }
        - { id: prm, rotulo: "Arriba, el cuarto", rect: [261, 153, 46, 36] }
        - { id: move, rotulo: "Arriba, el primero", rect: [127, 153, 46, 36] }
    tocar:
      bien: [menu]
      porque:
        encendido: "Enciende y apaga el equipo; no cambia de modo."
        prm: "Son las medidas automáticas del osciloscopio, no el multímetro."
        move: "Mueve la traza en vertical y alterna el canal activo."
    exito: "MENU abre el menú principal: osciloscopio, multímetro o generador."
    escalera: ["El modo se elige en el menú principal."]
    solucion: "Abajo a la derecha: MENU, el naranja."

  - id: toque-acoplamiento
    tipo: tocar
    titulo: "El acoplamiento y la sonda"
    texto: "Quiere poner el canal 1 en AC y cambiar su factor de sonda. Toque el botón que abre ese menú."
    libro: [48]
    widget:
      tipo: figura
      figura: fig-21.3
      zonas:
        - { id: ch1, rotulo: "Izquierda, el segundo", rect: [127, 187, 46, 36] }
        - { id: trigger, rotulo: "Arriba, el tercero", rect: [216, 153, 46, 36] }
        - { id: menu, rotulo: "Abajo a la derecha", rect: [261, 262, 46, 34] }
        - { id: move, rotulo: "Arriba, el primero", rect: [127, 153, 46, 36] }
    tocar:
      bien: [ch1]
      porque:
        trigger: "El disparo también tiene acoplamiento, pero el de la entrada y el factor de sonda son del canal."
        menu: "Elige el modo del instrumento y la configuración del sistema, no los ajustes de un canal."
        move: "Mueve la traza; no abre el menú del canal."
    exito: "CH1 abre el menú del canal: acoplamiento, factor de sonda e inversión."
    escalera: ["Cada canal tiene su botón con su menú."]
    solucion: "Izquierda, el segundo: CH1."

  - id: empareje-cruceta
    tipo: pregunta
    titulo: "Las flechas y los demás"
    texto: "Empareje cada control con lo que cambia."
    libro: [44, 45, 49]
    widget:
      tipo: figura
      figura: fig-21.3
      zonas:
        - { id: cruceta, rotulo: "Cruceta", rect: [180, 184, 73, 73] }
    emparejar:
      - ["▲▼", "La escala vertical, VOLT/DIV"]
      - ["◄►", "La base de tiempos, TIME/DIV"]
      - ["SELECT", "Confirmar, como la tecla «Enter»"]
      - ["MOVE", "La posición vertical de la traza"]
    exito: "Arriba y abajo, voltios; izquierda y derecha, tiempo."
    pistas:
      - { texto: "El eje vertical es tensión y el horizontal, tiempo: las flechas siguen a sus ejes." }
    escalera:
      - "Las flechas que van en vertical cambian la escala vertical."
    solucion: "▲▼ VOLT/DIV, ◄► TIME/DIV, SELECT confirma, MOVE mueve la traza."

  - id: prediga-move
    tipo: predecir
    titulo: "MOVE dos veces"
    texto: "Con CH1 activo, pulsa MOVE dos veces. ¿Qué canal queda activo?"
    libro: [44]
    widget:
      tipo: figura
      figura: fig-21.3
      zonas:
        - { id: move, rotulo: "MOVE", rect: [127, 153, 46, 36] }
    opciones:
      - texto: "CH1"
        bien: true
        porque: "Cada pulsación alterna el canal activo: la primera pasa a CH2 y la segunda vuelve a CH1."
      - texto: "CH2"
        porque: "Eso sería con una sola pulsación. La segunda lo devuelve a CH1."
      - texto: "Los dos a la vez"
        porque: "MOVE no activa los dos: alterna cuál de los dos se mueve con las flechas."
    escalera:
      - "Cada pulsación alterna entre CH1 y CH2."
    solucion: "CH1: dos alternancias vuelven al principio."

  - id: disparo
    tipo: pregunta
    titulo: "Lo que se elige en TRIGGER"
    texto: "¿Qué se ajusta en el menú de TRIGGER?"
    libro: [46, 48]
    widget:
      tipo: figura
      figura: fig-21.3
      zonas:
        - { id: trigger, rotulo: "TRIGGER", rect: [216, 153, 46, 36] }
    opciones:
      - texto: "Tipo, fuente, flanco y nivel del disparo"
        bien: true
        porque: "Auto, Normal o Single; CH1 o CH2; flanco de subida o de bajada; y el nivel."
      - texto: "El acoplamiento AC/DC y el factor de sonda"
        porque: "Eso es del menú de cada canal, que se abre con CH1 o CH2."
      - texto: "La escala vertical y la base de tiempos"
        porque: "Las escalas se cambian con las flechas de la cruceta."
    escalera:
      - "El disparo decide cuándo empieza cada barrido."
    solucion: "Tipo, fuente, flanco y nivel."

  - id: usb
    tipo: pregunta
    titulo: "Las capturas en el ordenador"
    texto: "Ha guardado capturas con SAVE, pero el ordenador no ve el instrumento por el USB-C. ¿Qué falta?"
    libro: [52]
    widget:
      tipo: figura
      figura: fig-21.3
      zonas:
        - { id: save, rotulo: "SAVE", rect: [261, 220, 46, 36] }
    opciones:
      - texto: "Activar «USB Sharing» en la configuración"
        bien: true
        porque: "Los ficheros se pasan por el USB-C solo tras activar esa opción."
      - texto: "Pulsar SAVE otra vez"
        porque: "SAVE guarda la captura; no comparte nada con el ordenador."
      - texto: "Pasar al modo multímetro"
        porque: "El modo no tiene que ver: la transferencia se activa en la configuración."
    escalera:
      - "Es una opción de la configuración del sistema."
    solucion: "Activar «USB Sharing» en la configuración, que se abre desde MENU."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [43, 49, 50, 51]
    ideas:
      - { titulo: "AUTO primero.", texto: "Si no se ve la señal o está inestable." }
      - { titulo: "La cruceta.", texto: "▲▼ la escala vertical, ◄► la base de tiempos; en el centro, Run/Stop." }
      - { titulo: "MENU.", texto: "Osciloscopio, multímetro o generador." }
      - { titulo: "Cada canal.", texto: "CH1 y CH2 abren acoplamiento, factor de sonda e inversión." }
