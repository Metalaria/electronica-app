# Lección 1.2 de la sección 20.21 «La Masa del Osciloscopio: Peligros y Medidas Flotantes» (cap21; etiqueta interna
# sec-21.21). Formato: contenido/lecciones11/GUIA.md. Sin modelo numérico: la figura 20.47 (fig-21.47) con zonas;
# coordenadas en su svg_vista (450,72 × 194,22). Reutiliza el ejercicio 20.11 del capítulo.
leccion: cap21/sec-21.21

libro:
  603: "en un osciloscopio alimentado de la red, está conectada a la toma de tierra"
  604: "colocar la pinza de CH2 en un punto distinto de la de CH1 cortocircuita lo que hay entre ambos"
  605: "usar dos canales y restar con la función Math (A − B), emplear una sonda diferencial, o usar un instrumento aislado"
  607: "pinzarla a un nudo vivo lo cortocircuita a tierra"

modelo:
  valores: {}
  calculos: {}

tarjetas:
  - id: explore-masas
    tipo: explorar
    titulo: "Dos pinzas, un solo nodo"
    texto: "Los dos canales del FNIRSI comparten masa. Toque los dos montajes."
    libro: [604]
    widget:
      tipo: figura
      figura: fig-21.47
      zonas:
        - { id: mal, rotulo: "Montaje de la izquierda", rect: [0, 0, 225, 194], texto: "Incorrecto: la pinza de CH2 entre R₁ y R₂, la de CH1 abajo. Unidas dentro del FNIRSI, cortocircuitan R₂." }
        - { id: bien, rotulo: "Montaje de la derecha", rect: [225, 0, 225, 194], texto: "Correcto: las dos pinzas al mismo punto de masa. V_{R2} es CH2 y V_{R1} es CH1 − CH2." }
    requiere: { mover: [mal, bien] }

  - id: toque-corto
    tipo: tocar
    titulo: "Lo que queda en corto"
    texto: "En el montaje incorrecto, las dos pinzas están unidas dentro del instrumento. Toque lo que cortocircuitan."
    libro: [604]
    widget:
      tipo: figura
      figura: fig-21.47
      zonas:
        - { id: fuente, rotulo: "La fuente", rect: [30, 85, 40, 50] }
        - { id: r1, rotulo: "La resistencia de arriba", rect: [85, 45, 45, 35] }
        - { id: r2, rotulo: "La resistencia de la derecha", rect: [145, 88, 40, 45] }
    tocar:
      bien: [r2]
      porque:
        fuente: "La fuente queda entre la masa y el nudo de arriba, no entre las dos pinzas."
        r1: "R₁ queda entre la punta de CH2 y la pinza de CH2: no la puentean las dos masas."
    exito: "R₂ está entre la pinza de CH2 y la de CH1: unidas por dentro, la cortocircuitan."
    escalera: ["Busque lo que hay entre las dos pinzas de masa."]
    solucion: "La resistencia de la derecha, R₂: está entre las dos pinzas."

  - id: prediga-red
    tipo: predecir
    titulo: "Un osciloscopio de red"
    texto: "Con un osciloscopio de red, pinza la masa de la sonda en un nudo del circuito que no es masa. ¿Qué pasa?"
    libro: [603, 607]
    widget:
      tipo: figura
      figura: fig-21.47
      zonas:
        - { id: mal, rotulo: "El montaje incorrecto", rect: [0, 0, 225, 194] }
    opciones:
      - texto: "Ese nudo queda unido a tierra: un cortocircuito"
        bien: true
        porque: "La pinza de masa va a la toma de tierra: en el mejor caso falsea la medida, en el peor hay chispas y daños."
      - texto: "Mide la tensión entre ese nudo y la punta"
        porque: "Lo haría un instrumento aislado. El de red une ese nudo a tierra."
      - texto: "Nada, mientras no toque la punta"
        porque: "Basta la pinza: el nudo queda unido a tierra a través del instrumento."
    escalera:
      - "¿A qué está unida la pinza de masa de un osciloscopio enchufado?"
    solucion: "Lo une a tierra: un cortocircuito. Jamás en un punto vivo de la red."

  - id: flotante
    tipo: pregunta
    titulo: "La tensión en R₁"
    texto: "Ningún extremo de R₁ está a masa. Con los dos canales, ¿cómo mide su tensión?"
    libro: [604, 605]
    widget:
      tipo: figura
      figura: fig-21.47
      zonas:
        - { id: bien, rotulo: "El montaje correcto", rect: [225, 0, 225, 194] }
    opciones:
      - texto: "Las dos pinzas a masa, una punta en cada extremo, y CH1 − CH2"
        bien: true
        porque: "Es la resta de la función Math: la tensión entre dos puntos que no son masa."
      - texto: "Cada pinza en un extremo de R₁"
        porque: "Las pinzas están unidas por dentro: cortocircuitaría lo que hay entre ellas."
      - texto: "Imposible sin una sonda diferencial"
        porque: "Es uno de los tres caminos; la resta de dos canales es otro."
    escalera:
      - "Hay tres caminos: restar dos canales, una sonda diferencial o un instrumento aislado."
    solucion: "Pinzas a la misma masa y CH1 − CH2."

  - id: bateria
    tipo: pregunta
    titulo: "La ventaja de la batería"
    texto: "¿Qué ofrece el FNIRSI, a batería y aislado, frente a un osciloscopio de banco enchufado?"
    libro: [605, 607]
    widget:
      tipo: figura
      imagen: img/foto_fnirsi_kit.jpg
      zonas:
        - { id: kit, rotulo: "El 2C53T", rect: [0, 0, 1490, 1490] }
    opciones:
      - texto: "Medidas flotantes: su masa no está atada al enchufe"
        bien: true
        porque: "Con más seguridad; aun así, las tensiones altas siguen siendo peligrosas."
      - texto: "Poder medir la red sin precauciones"
        porque: "No: las tensiones altas siguen siendo peligrosas, aunque el instrumento esté aislado."
      - texto: "Que sus dos canales tengan masas independientes"
        porque: "No: sus dos canales siguen compartiendo masa."
    escalera:
      - "Un instrumento de red tiene la masa unida a tierra; uno a batería, no."
    solucion: "Medidas flotantes, porque su masa no está unida a tierra."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [603, 604, 605]
    ideas:
      - { titulo: "De red, a tierra.", texto: "Su pinza de masa en un nudo vivo es un cortocircuito." }
      - { titulo: "Un solo nodo.", texto: "Las dos pinzas del FNIRSI están unidas: nunca en dos puntos distintos." }
      - { titulo: "Flotante.", texto: "Restar dos canales, sonda diferencial o instrumento aislado." }
      - { titulo: "A batería.", texto: "Masa flotante, más segura; las tensiones altas siguen siendo peligrosas." }
