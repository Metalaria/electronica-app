# Lección 1.2 de la sección 20.1 «Introducción: Un Instrumento Tres-en-Uno» (cap21; etiqueta interna sec-21.1).
# Formato: contenido/lecciones11/GUIA.md. La cuadrada de 5 V al 50 % frente a la continua de 2,5 V (bloque 3, figura
# 20.1, con su periodo de 10 µs); la amplitud que enseña un instrumento de 50 MHz frente a la frecuencia se dibuja con
# el modelo de primer orden (1/√(1 + (f/BW)²): 71 % en el corte, como dice el bloque 21).
leccion: cap21/sec-21.1

libro:
  2: "el multímetro dice cuánto; el osciloscopio dice qué está pasando"
  3: "una señal cuadrada de 5 V al 50 % y una continua de 2,5 V dan la misma lectura"
  7: "Para ver corriente hay que convertirla antes con un shunt o una sonda de corriente"
  8: "Todo lo que ocurre entre muestra y muestra es invisible"
  11: "Osciloscopio de dos canales, 50 MHz de ancho de banda y 250 MS/s"
  12: "útil por comodidad pero no por exactitud"
  13: "Generador de funciones DDS, de 1 Hz a 50 kHz con trece formas de onda"
  14: "funciona con batería, lo que hace su masa flotante"
  17: "Las dos escalas"
  18: "una sonda mal compensada falsea todas las medidas de amplitud y de forma"
  21: "a 50 MHz enseña solo el 71 % de la real"
  23: "256 niveles por pantalla, es decir, un escalón del 0,4 % del fondo de escala"
  24: "puede deformar la señal e incluso detener un oscilador"
  27: "la misma lectura frente a la forma real"

modelo:
  valores:
    forma: { sim: "forma", nombre: "forma de la señal", unidad: "", valor: 1 }
    V_a: { sim: "V", nombre: "amplitud de la cuadrada", unidad: V, valor: 5 }
    f_x: { sim: "f", nombre: "frecuencia de la senoide", unidad: Hz, valor: 5000000 }
    BW: { sim: "BW", nombre: "ancho de banda", unidad: Hz, valor: 50000000 }
  calculos:
    V_med: { expr: "V_a/2", sim: "V_{media}", nombre: "lo que marca el multímetro", unidad: V }
    A_v: { expr: "100/sqrt(1 + (f_x/BW)^2)", sim: "A", nombre: "amplitud que enseña", unidad: "%", cifras: 2 }

tarjetas:
  - id: explore-cuanto
    tipo: explorar
    titulo: "Cuánto frente a qué"
    texto: "Cambie entre la continua y la cuadrada. Mire la forma y lo que marca el multímetro."
    libro: [2, 3, 27]
    widget:
      tipo: grafica
      x: { id: t, min: 0, max: 0.00003, unidad: s, rotulo: "t" }
      y: { min: -1, max: 7, unidad: V, rotulo: "v" }
      curvas:
        - { expr: "forma*V_a*(1 - floor(2*t/0.00001) + 2*floor(t/0.00001)) + (1 - forma)*V_med", color: azul, rotulo: "la señal" }
      lectura: { valor: V_med, rotulo: "El multímetro marca" }
      mandos:
        - { valor: forma, lista: [0, 1], nombres: [continua, cuadrada], rotulo: "Señal" }
    requiere: { mover: [forma] }

  - id: diagnostico
    tipo: pregunta
    titulo: "La forma diagnostica"
    texto: "Empareje lo que se ve con lo que delata."
    libro: [3, 27]
    widget:
      tipo: figura
      figura: fig-21.1
      zonas:
        - { id: osciloscopio, rotulo: "El osciloscopio", rect: [225, 0, 222, 178] }
    emparejar:
      - ["Un flanco redondeado", "Capacidad de más"]
      - ["Una oscilación tras el flanco", "Inductancia parásita"]
      - ["Un escalón en el paso por cero", "Distorsión de cruce"]
      - ["Una caída momentánea", "La alimentación no aguanta"]
    exito: "Ver la forma es lo que permite diagnosticar."
    pistas:
      - { texto: "La capacidad tarda en cargarse; la inductancia resuena." }
    escalera:
      - "Un flanco lento es un condensador cargándose."
    solucion: "Redondeado, capacidad; oscilación, inductancia; escalón en el cero, cruce; caída, alimentación."

  - id: corriente
    tipo: pregunta
    titulo: "Ver una corriente"
    texto: "Quiere ver cómo cambia una corriente con el tiempo. ¿Qué hace?"
    libro: [7]
    widget:
      tipo: figura
      figura: fig-21.1
      zonas:
        - { id: eje, rotulo: "El eje vertical", rect: [225, 0, 222, 178] }
    opciones:
      - texto: "Convertirla en tensión con un shunt o una sonda de corriente"
        bien: true
        porque: "El eje vertical es siempre tensión: la corriente hay que convertirla antes."
      - texto: "Conectar la sonda en serie con el circuito"
        porque: "La sonda mide tensión entre la punta y la masa; en serie no convierte nada en tensión."
      - texto: "Cambiar el eje vertical a amperios en el menú"
        porque: "No existe ese ajuste: el eje vertical es siempre tensión."
    escalera:
      - "¿Qué magnitud es siempre el eje vertical?"
    solucion: "Con un shunt o una sonda de corriente: el osciloscopio solo ve tensión."

  - id: entre-muestras
    tipo: porque
    titulo: "Lo que no muestra"
    texto: "El osciloscopio no ve la señal: ve muestras que luego une. ¿Por qué eso importa?"
    libro: [8]
    widget:
      tipo: figura
      figura: fig-21.1
      zonas:
        - { id: traza, rotulo: "La traza", rect: [225, 0, 222, 178] }
    opciones:
      - texto: "Lo que pasa entre muestra y muestra es invisible"
        bien: true
        porque: "De ahí salen el aliasing y la mayor parte de los engaños del instrumento."
      - texto: "Porque las muestras añaden ruido a la traza"
        porque: "El problema no es el ruido: es lo que queda entre dos muestras, que no se ve."
      - texto: "No importa: unirlas reconstruye la señal exacta"
        porque: "Unirlas solo es fiel si las muestras son bastante seguidas; si no, aparecen señales falsas."
    escalera:
      - "¿Qué sabe el instrumento de la señal entre dos muestras?"
    solucion: "Lo que ocurre entre muestras no se ve: de ahí el aliasing y casi todos los engaños."

  - id: tres-instrumentos
    tipo: pregunta
    titulo: "Tres en uno"
    texto: "Empareje cada función del 2C53T con lo que la caracteriza."
    libro: [11, 12, 13]
    widget:
      tipo: figura
      imagen: img/foto_fnirsi_kit.jpg
      zonas:
        - { id: kit, rotulo: "El 2C53T y sus accesorios", rect: [0, 0, 1490, 1490] }
    emparejar:
      - ["Osciloscopio", "Dos canales, 50 MHz y 250 MS/s"]
      - ["Multímetro", "Útil por comodidad, no por exactitud"]
      - ["Generador DDS", "De 1 Hz a 50 kHz, trece formas"]
    exito: "Para medidas de precisión está el Brymen; el generador es modesto pero suficiente."
    pistas:
      - { texto: "Los megahercios son del osciloscopio; los kilohercios, del generador." }
    escalera:
      - "La función principal es la que tiene más ancho de banda."
    solucion: "Osciloscopio de 50 MHz; multímetro por comodidad; generador de 1 Hz a 50 kHz."

  - id: masa-flotante
    tipo: pregunta
    titulo: "Funciona con batería"
    texto: "El 2C53T funciona con batería y su masa es flotante. ¿Qué permite?"
    libro: [14]
    widget:
      tipo: figura
      imagen: img/foto_fnirsi_kit.jpg
      zonas:
        - { id: kit, rotulo: "El 2C53T", rect: [0, 0, 1490, 1490] }
    opciones:
      - texto: "Medir sobre componentes que no tienen un extremo a masa"
        bien: true
        porque: "Es su gran ventaja, y una responsabilidad: hay que conocer sus precauciones."
      - texto: "Medir más deprisa que uno de red"
        porque: "La batería no cambia el ancho de banda ni el muestreo."
      - texto: "Olvidarse de dónde va la pinza de masa"
        porque: "Al revés: la masa flotante exige precauciones propias."
    escalera:
      - "Un instrumento de red tiene la masa unida a la tierra del enchufe."
    solucion: "Medir sobre componentes sin un extremo a masa, con sus precauciones."

  - id: orden
    tipo: pregunta
    titulo: "Lo que hay que aprender, en orden"
    texto: "Ordene lo que hay que aprender de un osciloscopio, de lo primero a lo último."
    libro: [17, 18]
    ordenar:
      - "Las dos escalas, voltios y tiempo por división"
      - "El acoplamiento"
      - "La sonda y su compensación"
      - "El disparo"
      - "Las medidas, automáticas y con cursores"
      - "FFT, XY y matemáticas"
    exito: "Las dos escalas son el 80 % del uso; una sonda mal compensada falsea todo lo demás."
    pistas:
      - { texto: "Lo que se usa siempre va primero; las funciones avanzadas, al final." }
    escalera:
      - "Empiece por lo que fija qué se ve en la pantalla."
    solucion: "Escalas, acoplamiento, sonda, disparo, medidas y funciones avanzadas."

  - id: prediga-50mhz
    tipo: predecir
    titulo: "Una senoide de 50 MHz"
    texto: "El 2C53T tiene 50 MHz de ancho de banda. ¿Qué parte de una senoide de 50 MHz enseña?"
    libro: [11, 21]
    fijar: { f_x: 50000000 }
    widget:
      tipo: grafica
      x: { id: nu, min: 1000000, max: 1000000000, unidad: Hz, rotulo: "f", escala: log }
      y: { min: 0, max: 110, unidad: "%", rotulo: "amplitud que enseña" }
      curvas:
        - { expr: "100/sqrt(1 + (nu/BW)^2)", color: naranja, rotulo: "lo que enseña" }
      lectura: { valor: A_v, rotulo: "A 50 MHz enseña" }
      ocultar: true
    opciones:
      - texto: "El 71 %"
        bien: true
        porque: "El ancho de banda es donde la amplitud cae al 71 %: la señal sale más pequeña de lo que es."
      - texto: "Toda la amplitud"
        porque: "Esa sería una señal muy por debajo del ancho de banda. En el límite ya cae."
      - texto: "Nada: no la ve"
        porque: "La ve, más pequeña. Por encima del ancho de banda sigue cayendo, sin cortarse de golpe."
    escalera:
      - "El ancho de banda no es donde la señal desaparece, sino donde empieza a perder."
    solucion: "El 71 %: a 50 MHz enseña solo el 71 % de la real."
    comprobar:
      - { A_v: 71 }

  - id: explore-ancho
    tipo: explorar
    titulo: "Más allá de 50 MHz"
    texto: "Mueva la frecuencia de la senoide y mire qué parte de su amplitud enseña el instrumento."
    libro: [21]
    widget:
      tipo: grafica
      x: { id: nu, min: 1000000, max: 1000000000, unidad: Hz, rotulo: "f", escala: log }
      y: { min: 0, max: 110, unidad: "%", rotulo: "amplitud que enseña" }
      curvas:
        - { expr: "100/sqrt(1 + (nu/BW)^2)", color: naranja, rotulo: "lo que enseña" }
      marcas:
        - { x: "f_x", y: "A_v", rotulo: "{{A_v}}" }
      lectura: { valor: A_v, rotulo: "Amplitud que enseña" }
      mandos:
        - { valor: f_x, lista: [5000000, 20000000, 50000000, 100000000, 200000000], rotulo: "Frecuencia" }
    requiere: { mover: [f_x] }

  - id: estime-8bits
    tipo: pregunta
    titulo: "Ocho bits"
    texto: "La pantalla tiene 256 niveles. ¿Qué parte del fondo de escala es un escalón?"
    libro: [23]
    widget:
      tipo: grafica
      x: { id: t, min: 0, max: 1, unidad: "", rotulo: "ciclo" }
      y: { min: -1.1, max: 1.1, unidad: "", rotulo: "señal" }
      curvas:
        - { expr: "round(sin(2*pi*t)*8)/8", color: azul, rotulo: "en escalones" }
    estimar:
      objetivo: "100/256"
      unidad: "%"
      min: 0
      max: 2
      paso: 0.01
      inicio: 1.5
      tol: 0.05
      rotulo: "Un escalón"
    exito: "1/256 ≈ 0,4 %: un detalle menor no se ve, por mucho que se amplíe."
    pistas:
      - { cuando: { valor: estimacion, mayor: 0.41 }, texto: "Se ha pasado: reparta todo el fondo de escala entre los 256 niveles." }
      - { texto: "Se ha quedado corto: el fondo de escala entre 256 niveles da algo menos de medio punto." }
    escalera:
      - "Divida el fondo de escala entre el número de niveles."
    solucion: "1/256 ≈ 0,4 % del fondo de escala por escalón."

  - id: sonda-carga
    tipo: pregunta
    titulo: "La sonda es parte del circuito"
    texto: "La sonda en ×10 presenta 10 MΩ y unos 20 pF. ¿Qué puede hacer esa capacidad?"
    libro: [24]
    widget:
      tipo: figura
      imagen: img/foto_fnirsi_kit.jpg
      zonas:
        - { id: kit, rotulo: "El 2C53T y sus sondas", rect: [0, 0, 1490, 1490] }
    opciones:
      - texto: "Deformar la señal e incluso detener un oscilador"
        bien: true
        porque: "La capacidad carga lo que se mide: la sonda forma parte del circuito."
      - texto: "Nada: 10 MΩ es casi un circuito abierto"
        porque: "La resistencia sí es alta; la que carga es la capacidad, cada vez más con la frecuencia."
      - texto: "Solo bajar la amplitud diez veces"
        porque: "Eso es la atenuación de la sonda ×10, que el instrumento corrige. La capacidad es otra cosa."
    escalera:
      - "Un condensador en paralelo con un nudo, ¿qué le hace a una señal rápida?"
    solucion: "Puede deformar la señal e incluso detener un oscilador."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [2, 8, 21, 23]
    ideas:
      - { titulo: "Qué está pasando.", texto: "El multímetro dice cuánto; el osciloscopio enseña la forma, y la forma diagnostica." }
      - { titulo: "Muestras.", texto: "Lo que ocurre entre muestra y muestra es invisible." }
      - { titulo: "Límites.", texto: "50 MHz (el 71 % en el límite), 8 bits (escalones del 0,4 %) y una sonda que carga." }
      - { titulo: "En orden.", texto: "Escalas, acoplamiento, sonda, disparo, medidas y funciones avanzadas." }
