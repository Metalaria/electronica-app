# Lección 1.2 de la sección 20.19 «Mantenimiento y Buenas Prácticas» (cap21; etiqueta interna sec-21.19). Formato:
# contenido/lecciones11/GUIA.md. Sin modelo numérico: la figura 20.43 (fig-21.43, las cuatro prácticas y los límites)
# con zonas por recuadro; coordenadas en su svg_vista (450,72 × 234,72).
leccion: cap21/sec-21.19

libro:
  537: "una sonda descompensada falsea todas las medidas de flancos"
  542: "lo que se admite en continua no se admite a un megahercio"
  543: "Cambiar el conmutador de la sonda cambia el límite, y esa es una fuente real de averías"
  545: "No tirar del cable para desconectar, sino del cuerpo del conector."
  546: "No enrollar apretado"
  547: "su rotura produce medidas con muchísimo ruido que se atribuyen al circuito"
  548: "No usar la sonda como polímetro"
  555: "Tras un cambio apreciable de temperatura ambiente."
  556: "se lanza con una pulsación larga de AUTO y con las sondas retiradas"
  558: "no dejarlo descargado largos periodos, no almacenarlo al 100 %, y evitar el calor"
  559: "puede aparecer con la celda por debajo del umbral de seguridad y ya no recargable"
  561: "anotar cuándo se calibró, qué se midió como referencia y qué salió"
  565: "Las cuatro prácticas de mantenimiento y los límites que no hay que superar"

modelo:
  valores: {}
  calculos: {}

tarjetas:
  - id: explore-practicas
    tipo: explorar
    titulo: "Cuatro prácticas y cuatro límites"
    texto: "Un osciloscopio bien tratado dura décadas. Toque una práctica y un límite."
    libro: [565]
    widget:
      tipo: figura
      figura: fig-21.43
      zonas:
        - { id: compensar, rotulo: "Compensar las sondas", rect: [5, 25, 217, 50], texto: "Al cambiar de canal o de sonda: una sonda descompensada falsea los flancos." }
        - { id: revisar, rotulo: "Revisar las sondas", rect: [5, 78, 217, 50], texto: "Un latiguillo de masa roto da un ruido que se atribuye al circuito." }
        - { id: autocal, rotulo: "Autocalibración", rect: [5, 131, 217, 50], texto: "Tras cambios de temperatura y cada pocos meses, con las entradas desconectadas." }
        - { id: registro, rotulo: "Registro de uso", rect: [5, 183, 217, 50], texto: "Medir la referencia con cada canal y anotarla con su fecha." }
        - { id: tension, rotulo: "Tensión máxima de entrada", rect: [228, 25, 217, 50], texto: "Superarla destruye el atenuador de entrada; baja con la frecuencia y cambia con ×1/×10." }
        - { id: masa, rotulo: "Masa común a los dos canales", rect: [228, 78, 217, 50], texto: "Las dos pinzas son el mismo nodo: a dos puntos distintos, cortocircuito." }
        - { id: ac, rotulo: "El acoplamiento AC no protege", rect: [228, 131, 217, 50], texto: "El condensador soporta toda la continua aunque no se vea." }
        - { id: x10, rotulo: "Sonda en ×10 por defecto", rect: [228, 183, 217, 50], texto: "La ×1 carga el circuito y limita el ancho de banda." }
    requiere: { mover: [revisar, tension] }

  - id: prediga-conmutador
    tipo: predecir
    titulo: "Cambiar el conmutador"
    texto: "Mide una tensión alta con la sonda en ×10, cerca del límite, y pasa el conmutador a ×1. ¿Qué pasa con el límite?"
    libro: [543]
    widget:
      tipo: figura
      figura: fig-21.43
      zonas:
        - { id: tension, rotulo: "Tensión máxima de entrada", rect: [228, 25, 217, 50] }
    opciones:
      - texto: "Vuelve a ser el del instrumento: diez veces menor"
        bien: true
        porque: "Con ×10 el límite se multiplica por diez; con ×1, no. Es una fuente real de averías."
      - texto: "No cambia: el límite es del instrumento"
        porque: "El del instrumento es el mismo, pero con ×10 a la entrada llega la décima parte."
      - texto: "Sube, porque la ×1 no atenúa"
        porque: "Al revés: sin atenuar, toda la tensión llega a la entrada."
    escalera:
      - "¿Qué parte de la tensión llega a la entrada con ×10 y con ×1?"
    solucion: "Vuelve al del instrumento, diez veces menor que con ×10."

  - id: frecuencia
    tipo: pregunta
    titulo: "En continua sí, a 1 MHz no"
    texto: "La entrada admite una tensión en continua. ¿Admite la misma a un megahercio?"
    libro: [542]
    widget:
      tipo: figura
      figura: fig-21.43
      zonas:
        - { id: tension, rotulo: "Tensión máxima de entrada", rect: [228, 25, 217, 50] }
    opciones:
      - texto: "No necesariamente: en muchos instrumentos baja con la frecuencia"
        bien: true
        porque: "Lo que se admite en continua no se admite a un megahercio: mire la curva de su instrumento."
      - texto: "Sí, la tensión máxima es una sola"
        porque: "Es un caso que se olvida: en muchos instrumentos disminuye con la frecuencia."
      - texto: "Admite más, porque la alterna se reparte"
        porque: "La tendencia es la contraria: menos a frecuencias altas."
    escalera:
      - "¿Es la tensión máxima un valor fijo en todas las frecuencias?"
    solucion: "No: en muchos instrumentos el límite baja con la frecuencia."

  - id: toque-ruido
    tipo: tocar
    titulo: "Un ruido que no es del circuito"
    texto: "Las medidas salen con muchísimo ruido y lo achaca al circuito. Toque la práctica que lo habría evitado."
    libro: [547, 565]
    widget:
      tipo: figura
      figura: fig-21.43
      zonas:
        - { id: compensar, rotulo: "Izquierda, el primero", rect: [5, 25, 217, 50] }
        - { id: revisar, rotulo: "Izquierda, el segundo", rect: [5, 78, 217, 50] }
        - { id: autocal, rotulo: "Izquierda, el tercero", rect: [5, 131, 217, 50] }
        - { id: registro, rotulo: "Izquierda, el cuarto", rect: [5, 183, 217, 50] }
    tocar:
      bien: [revisar]
      porque:
        compensar: "Una sonda descompensada falsea los flancos, no llena la traza de ruido."
        autocal: "La autocalibración corrige derivas de offset y ganancia, no un ruido enorme."
        registro: "El registro dice si el instrumento se ha movido con el tiempo; no explica el ruido."
    exito: "Revisar las sondas: un latiguillo de masa roto produce muchísimo ruido. Compruebe su continuidad."
    escalera: ["¿Qué pieza de la sonda es la que más falla?"]
    solucion: "Izquierda, el segundo: revisar las sondas y la continuidad del latiguillo."

  - id: cuidados
    tipo: pregunta
    titulo: "El trato de las sondas"
    texto: "Empareje cada mala práctica con la parte de la sonda que estropea."
    libro: [545, 546, 548]
    widget:
      tipo: figura
      figura: fig-21.43
      zonas:
        - { id: revisar, rotulo: "Revisar las sondas", rect: [5, 78, 217, 50] }
    emparejar:
      - ["Tirar del cable para desconectar", "El cable, en vez del cuerpo del conector"]
      - ["Enrollar apretado", "Fatiga el coaxial fino"]
      - ["Usar la sonda como polímetro", "La punta, que es frágil"]
    exito: "Se desconecta del cuerpo del conector, se enrolla suelto y la punta no se fuerza."
    pistas:
      - { texto: "Cada mala práctica castiga la parte que más se esfuerza." }
    escalera:
      - "El coaxial fino no aguanta curvas cerradas."
    solucion: "Tirar del cable, el cable; enrollar apretado, el coaxial; como polímetro, la punta."

  - id: autoajuste
    tipo: pregunta
    titulo: "La calibración de la línea base"
    texto: "¿Cómo se lanza la autocalibración en el 2C53T?"
    libro: [555, 556]
    widget:
      tipo: figura
      figura: fig-21.43
      zonas:
        - { id: autocal, rotulo: "Autocalibración", rect: [5, 131, 217, 50] }
    opciones:
      - texto: "Pulsación larga de AUTO, con las sondas retiradas"
        bien: true
        porque: "Usa referencias internas: las entradas, desconectadas."
      - texto: "Con la cuadrada del generador en CH1"
        porque: "Eso es compensar la sonda. La autocalibración se hace con las entradas desconectadas."
      - texto: "Desde SAVE"
        porque: "SAVE guarda capturas; la calibración de la línea base va con AUTO."
    escalera:
      - "La rutina usa referencias internas. ¿Qué debe haber en las entradas?"
    solucion: "Pulsación larga de AUTO con las sondas retiradas."

  - id: bateria
    tipo: porque
    titulo: "Un año en el cajón"
    texto: "Guarda el 2C53T un año con la batería a cero y al sacarlo no carga. ¿Por qué?"
    libro: [558, 559]
    widget:
      tipo: figura
      imagen: img/foto_fnirsi_kit.jpg
      zonas:
        - { id: kit, rotulo: "El 2C53T", rect: [0, 0, 1490, 1490] }
    opciones:
      - texto: "La celda cayó por debajo del umbral de seguridad"
        bien: true
        porque: "Ya no es recargable. Ni descargado mucho tiempo, ni guardado al 100 %, y lejos del calor."
      - texto: "Se desprogramó el firmware"
        porque: "No es el firmware: es la celda, que se descargó por debajo de su umbral."
      - texto: "Hay que calibrarlo antes de cargar"
        porque: "La calibración no tiene que ver con la carga de la batería."
    escalera:
      - "¿Qué le pasa a una celda que pasa mucho tiempo descargada?"
    solucion: "La celda quedó por debajo del umbral de seguridad: no se puede recargar."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [537, 543, 547, 561]
    ideas:
      - { titulo: "Las sondas.", texto: "Compensarlas al cambiar de canal; revisar el latiguillo de masa." }
      - { titulo: "Los límites.", texto: "Bajan con la frecuencia y cambian con el conmutador ×1/×10." }
      - { titulo: "Autoajuste.", texto: "En el 2C53T, pulsación larga de AUTO con las sondas fuera." }
      - { titulo: "Un registro.", texto: "Cuándo se calibró, qué se midió y qué salió." }
