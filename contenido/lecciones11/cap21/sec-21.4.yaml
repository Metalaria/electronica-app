# Lección 1.2 de la sección 20.4 «Anatomía de la Pantalla del Osciloscopio» (cap21; etiqueta interna sec-21.4).
# Formato: contenido/lecciones11/GUIA.md. Figuras 20.6 (fig-21.6, la pantalla) y 20.7 (fig-21.7, los indicadores) con
# zonas; coordenadas en su svg_vista (453,6 × 338,4 y 453,6 × 237,6). La lectura de la figura 20.7 (5 div a
# 500 mV/div) se hace con el modelo. Los escalones del convertidor: 256 niveles en 8 divisiones, 32 por división; la
# gráfica dibuja una senoide normalizada a su pico con 32·h niveles de pico a pico (h divisiones de altura).
leccion: cap21/sec-21.4

libro:
  55: "Hay cinco zonas, y cada una dice algo"
  57: "8 divisiones verticales por 12 horizontales"
  58: "La señal debe ocupar entre 4 y 6 divisiones verticales"
  60: "son el dato que convierte divisiones en unidades"
  62: "dice dónde está el cero de esa traza"
  63: "hace que todas las amplitudes sean falsas por un factor diez"
  65: "El indicador de disparo, con su nivel y su fuente"
  64: "explica por qué una señal aparece centrada en cero cuando debería tener continua"
  66: "filtra a 20 MHz y limpia mucho el ruido"
  69: "Si la señal está recortada o mal escalada, la medida es incorrecta sin avisar"
  70: "«amplitud» puede ser pico a pico, o la diferencia entre los niveles alto y bajo excluyendo el sobreimpulso"
  71: "convenga comprobarla con los cursores"
  77: "al alargar la base de tiempo el instrumento baja la velocidad de muestreo"
  79: "leer los factores de escala, el factor de sonda y el marcador de tierra. Tres segundos."
  80: "medir la misma señal con la señal ocupando una división y ocupando seis"
  81: "Elementos de la pantalla del osciloscopio"
  82: "Los indicadores de la pantalla que hay que leer antes de interpretar una medida"

modelo:
  valores:
    h_div: { sim: "h", nombre: "altura de la señal en divisiones", unidad: div, valor: 1 }
    n_div: { sim: "n", nombre: "divisiones de pico a pico", unidad: div, valor: 5 }
    k_v: { sim: "V/div", nombre: "escala vertical", unidad: V, valor: 0.5 }
  calculos:
    niveles: { expr: "32*h_div", sim: "N", nombre: "niveles que usa la señal", unidad: "" }
    V_pp: { expr: "n_div*k_v", sim: "V_{pp}", nombre: "tensión de pico a pico", unidad: V }

tarjetas:
  - id: explore-pantalla
    tipo: explorar
    titulo: "Antes de medir, leer"
    texto: "La pantalla dice más de lo que parece. Toque el marcador de tierra de CH1 y las medidas automáticas."
    libro: [55, 62, 65, 81]
    widget:
      tipo: figura
      figura: fig-21.6
      zonas:
        - { id: base, rotulo: "Base de tiempos", rect: [104, 48, 50, 36], texto: "Segundos por división: convierte divisiones horizontales en tiempo." }
        - { id: run, rotulo: "Captura en marcha", rect: [180, 48, 44, 36], texto: "RUN o STOP: si la captura está en marcha o detenida." }
        - { id: tierra-ch1, rotulo: "Marcador de tierra de CH1", rect: [62, 112, 35, 36], texto: "Dónde está el cero de esa traza. Sin él, la posición vertical no significa nada." }
        - { id: tierra-ch2, rotulo: "Marcador de tierra de CH2", rect: [62, 215, 35, 36], texto: "El cero del otro canal: cada traza tiene el suyo." }
        - { id: nivel, rotulo: "Nivel de disparo", rect: [360, 103, 35, 36], texto: "La altura a la que dispara el barrido." }
        - { id: prm, rotulo: "Medidas automáticas", rect: [86, 236, 135, 36], texto: "Frecuencia, pico a pico, eficaz. Miden lo que hay en pantalla." }
        - { id: estado-ch1, rotulo: "Escala, sonda y acoplamiento de CH1", rect: [84, 266, 48, 36], texto: "Voltios por división, factor de sonda y acoplamiento del canal." }
        - { id: disparo, rotulo: "Modo, flanco y fuente del disparo", rect: [198, 266, 55, 36], texto: "El indicador de disparo: su modo, su flanco y su fuente." }
    requiere: { mover: [tierra-ch1, prm] }

  - id: toque-sonda
    tipo: tocar
    titulo: "Diez veces mal"
    texto: "Todas las amplitudes salen falsas por un factor diez. Toque el indicador que hay que mirar."
    libro: [63, 82]
    widget:
      tipo: figura
      figura: fig-21.7
      zonas:
        - { id: escala, rotulo: "Arriba, el primero", rect: [26, 26, 52, 35] }
        - { id: sonda, rotulo: "Arriba, el segundo", rect: [90, 26, 36, 35] }
        - { id: acoplamiento, rotulo: "Arriba, el tercero", rect: [126, 26, 35, 35] }
        - { id: banda, rotulo: "Arriba, el cuarto", rect: [168, 26, 40, 35] }
    tocar:
      bien: [sonda]
      porque:
        escala: "La escala convierte divisiones en voltios, pero una escala mal leída no da justo un factor diez."
        acoplamiento: "El acoplamiento quita o deja la continua; no multiplica las amplitudes."
        banda: "La limitación de banda quita ruido y detalle, no un factor diez."
    exito: "El factor de sonda: si no coincide con la sonda real, todas las amplitudes fallan por diez."
    escalera: ["¿Qué posición de la sonda divide la señal por diez?"]
    solucion: "Arriba, el segundo: el factor de sonda, ×10."

  - id: toque-acoplamiento
    tipo: tocar
    titulo: "Sin su continua"
    texto: "Una señal aparece centrada en cero, cuando debería tener continua. Toque el indicador que lo explica."
    libro: [64, 82]
    widget:
      tipo: figura
      figura: fig-21.7
      zonas:
        - { id: escala, rotulo: "Arriba, el primero", rect: [26, 26, 52, 35] }
        - { id: sonda, rotulo: "Arriba, el segundo", rect: [90, 26, 36, 35] }
        - { id: acoplamiento, rotulo: "Arriba, el tercero", rect: [126, 26, 35, 35] }
        - { id: tierra, rotulo: "A la izquierda, la flecha", rect: [4, 158, 35, 35] }
    tocar:
      bien: [acoplamiento]
      porque:
        escala: "La escala cambia el tamaño, no quita la continua."
        sonda: "El factor de sonda falsea por diez, pero no centra la señal."
        tierra: "El marcador dice dónde está el cero; no quita la continua de la señal."
    exito: "El acoplamiento: en AC desaparece la continua y la señal queda centrada."
    escalera: ["Hay un ajuste que deja pasar o no la continua."]
    solucion: "Arriba, el tercero: el acoplamiento (DC, AC o GND)."

  - id: toque-banda
    tipo: tocar
    titulo: "Limpia, pero sin el detalle"
    texto: "La traza sale muy limpia de ruido, pero falta un detalle rápido que debería verse. Toque el indicador culpable."
    libro: [66, 82]
    widget:
      tipo: figura
      figura: fig-21.7
      zonas:
        - { id: sonda, rotulo: "Arriba, el segundo", rect: [90, 26, 36, 35] }
        - { id: acoplamiento, rotulo: "Arriba, el tercero", rect: [126, 26, 35, 35] }
        - { id: banda, rotulo: "Arriba, el cuarto", rect: [168, 26, 40, 35] }
        - { id: disparo, rotulo: "Abajo a la derecha", rect: [190, 197, 52, 35] }
    tocar:
      bien: [banda]
      porque:
        sonda: "El factor de sonda cambia las amplitudes por diez, no el ruido."
        acoplamiento: "El acoplamiento decide si pasa la continua, no lo rápido."
        disparo: "El disparo estabiliza la imagen; no filtra la señal."
    exito: "La limitación de banda, a 20 MHz: limpia el ruido y oculta lo que se quiere ver si está puesta sin querer."
    escalera: ["Un filtro que quita ruido también quita lo rápido."]
    solucion: "Arriba, el cuarto: BW 20M, la limitación de banda."

  - id: estime-lectura
    tipo: pregunta
    titulo: "Leer la escala"
    texto: "En la figura, la cuadrada ocupa 5 divisiones a 500 mV/div. ¿Cuánto vale de pico a pico?"
    libro: [60, 82]
    fijar: { n_div: 5, k_v: 0.5 }
    widget:
      tipo: figura
      figura: fig-21.7
      zonas:
        - { id: escala, rotulo: "La escala vertical", rect: [26, 26, 52, 35] }
        - { id: altura, rotulo: "La altura, en divisiones", rect: [88, 80, 40, 95] }
    estimar:
      objetivo: "V_pp"
      unidad: V
      min: 0
      max: 5
      paso: 0.05
      inicio: 4
      tol: 0.04
      rotulo: "V_{pp}"
    exito: "5 div × 500 mV/div = 2,5 V. El factor de escala convierte divisiones en voltios."
    pistas:
      - { cuando: { valor: estimacion, mayor: 2.6 }, texto: "Se ha pasado: multiplique las divisiones por los voltios de cada una." }
      - { texto: "Se ha quedado corto: cada una de las 5 divisiones vale 500 mV." }
    escalera:
      - "Divisiones por voltios por división."
    solucion: "5 × 0,5 V = 2,5 V de pico a pico."
    comprobar:
      - { V_pp: 2.5 }

  - id: explore-niveles
    tipo: explorar
    titulo: "Una división o seis"
    texto: "La misma senoide ocupando más o menos divisiones. Mire los escalones del convertidor."
    libro: [58, 80]
    inicio: { h_div: 1 }
    widget:
      tipo: grafica
      x: { id: t, min: 0, max: 1, unidad: "", rotulo: "ciclo" }
      y: { min: -1.1, max: 1.1, unidad: "", rotulo: "fracción del pico" }
      curvas:
        - { expr: "round(sin(2*pi*t)*16*h_div)/(16*h_div)", color: azul, rotulo: "lo que se ve" }
      lectura: { valor: niveles, rotulo: "Niveles que usa" }
      mandos:
        - { valor: h_div, lista: [1, 2, 4, 6], rotulo: "Altura en pantalla, divisiones" }
    requiere: { mover: [h_div] }
    comprobar:
      - { niveles: 32 }

  - id: cuantas-divisiones
    tipo: predecir
    titulo: "Ni pequeña ni recortada"
    texto: "La pantalla tiene 8 divisiones verticales. ¿Cuántas debe ocupar la señal?"
    libro: [57, 58]
    fijar: { h_div: 6 }
    widget:
      tipo: grafica
      x: { id: t, min: 0, max: 1, unidad: "", rotulo: "ciclo" }
      y: { min: -1.1, max: 1.1, unidad: "", rotulo: "fracción del pico" }
      curvas:
        - { expr: "round(sin(2*pi*t)*16*h_div)/(16*h_div)", color: azul, rotulo: "lo que se ve" }
      lectura: { valor: niveles, rotulo: "Niveles que usa" }
      ocultar: true
    opciones:
      - texto: "Entre 4 y 6"
        bien: true
        porque: "Menos desaprovecha niveles del convertidor; más, y se recorta."
      - texto: "Las 8, para aprovecharlas todas"
        porque: "Sin margen, cualquier pico se sale y se recorta."
      - texto: "Una, para que quepa con holgura"
        porque: "Una división usa solo 32 de los 256 niveles."
    escalera:
      - "Hay que aprovechar los niveles sin llegar a recortar."
    solucion: "Entre 4 y 6 divisiones."

  - id: medidas-trampa
    tipo: pregunta
    titulo: "Una medida sin aviso"
    texto: "La señal se sale de la pantalla por arriba y por abajo. ¿Qué da la medida automática de pico a pico?"
    libro: [69]
    widget:
      tipo: figura
      figura: fig-21.6
      zonas:
        - { id: prm, rotulo: "Medidas automáticas", rect: [86, 236, 135, 36] }
    opciones:
      - texto: "Un valor incorrecto, sin avisar"
        bien: true
        porque: "Mide lo que hay en pantalla: si la señal está recortada, la medida también."
      - texto: "El valor bueno, porque mide la señal y no la pantalla"
        porque: "Las medidas automáticas calculan con lo que hay en pantalla, no con lo que se sale."
      - texto: "Un aviso de señal recortada"
        porque: "Ese es el peligro: el resultado es incorrecto sin ningún aviso."
    escalera:
      - "¿De dónde saca sus números la medida automática?"
    solucion: "Un valor incorrecto sin avisar: miden lo que hay en pantalla."

  - id: cursores
    tipo: porque
    titulo: "Con timbre"
    texto: "En una señal con timbre, la «amplitud» automática no coincide con la que usted quería. ¿Por qué?"
    libro: [70, 71]
    widget:
      tipo: figura
      figura: fig-21.6
      zonas:
        - { id: prm, rotulo: "Medidas automáticas", rect: [86, 236, 135, 36] }
    opciones:
      - texto: "Puede medir pico a pico, o entre niveles sin el sobreimpulso"
        bien: true
        porque: "Las definiciones importan. Ante una medida crítica, los cursores miden exactamente lo que se les señala."
      - texto: "Porque las medidas automáticas no ven el timbre"
        porque: "Lo ven: el problema es qué definición de amplitud aplican."
      - texto: "Porque la amplitud solo vale en senoides"
        porque: "Vale en cualquier señal; lo que cambia es si cuenta el sobreimpulso o no."
    escalera:
      - "¿Cuenta el sobreimpulso en la amplitud?"
    solucion: "Hay dos definiciones de amplitud; con los cursores decide usted qué se mide."

  - id: memoria
    tipo: pregunta
    titulo: "El glitch que desaparece"
    texto: "Alarga la base de tiempos y un glitch que se veía desaparece. ¿Por qué?"
    libro: [77]
    widget:
      tipo: figura
      figura: fig-21.6
      zonas:
        - { id: base, rotulo: "Base de tiempos", rect: [104, 48, 50, 36] }
    opciones:
      - texto: "Con poca memoria baja la velocidad de muestreo"
        bien: true
        porque: "La memoria fija las muestras por captura: más tiempo con las mismas muestras es muestrear más despacio."
      - texto: "El glitch ha dejado de ocurrir"
        porque: "Sigue ahí: lo que cambió es cada cuánto se toma una muestra."
      - texto: "La limitación de banda se activa sola"
        porque: "La base de tiempos no activa ningún filtro; baja el muestreo."
    escalera:
      - "Las muestras por captura son fijas. ¿Qué pasa si cubren más tiempo?"
    solucion: "Baja la velocidad de muestreo: el glitch cae entre dos muestras."

  - id: habito
    tipo: pregunta
    titulo: "Tres segundos"
    texto: "Ordene lo que hay que leer antes de interpretar una captura."
    libro: [79]
    ordenar:
      - "Los factores de escala"
      - "El factor de sonda"
      - "El marcador de tierra"
      - "Interpretar la captura"
    exito: "Escala, sonda y tierra: tres segundos que evitan más errores que nada."
    pistas:
      - { texto: "Interpretar va al final; lo primero es lo que convierte divisiones en unidades." }
    escalera:
      - "Primero lo que da las unidades; al final, la interpretación."
    solucion: "Escalas, sonda, tierra; y después, interpretar."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [58, 60, 63, 69, 79]
    ideas:
      - { titulo: "Leer antes.", texto: "Factores de escala, factor de sonda y marcador de tierra." }
      - { titulo: "Entre 4 y 6.", texto: "Divisiones verticales: ni desaprovechar niveles ni recortar." }
      - { titulo: "Las automáticas.", texto: "Miden lo que hay en pantalla; ante lo crítico, cursores." }
      - { titulo: "La memoria.", texto: "Con la base de tiempos larga baja el muestreo y lo rápido desaparece." }
