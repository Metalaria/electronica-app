# Lección 1.2 de la sección 20.5 «Calibración de la Sonda — Paso Obligatorio» (cap21; etiqueta interna sec-21.5).
# Formato: contenido/lecciones11/GUIA.md. La sonda ×10 es el divisor compensado de la figura 20.8: 9 MΩ ‖ C₁ en la
# punta y 1 MΩ ‖ C₂ en la entrada. Con k = R₁C₁/(R₂C₂), el escalón inicial de la cuadrada vale C₁/(C₁ + C₂) y la
# meseta la décima parte, así que su relación es 10·k/(k + 9); el trimmer cambia C₂ (c = C₂ respecto a la que
# compensa, k = 1/c). Se dibuja la cuadrada de 1 kHz en régimen: cada flanco salta esa fracción y luego tiende a la
# meseta con una constante ilustrativa de 0,1 ms. La Práctica 10 (cap22, sec-22.11) ya ajusta la sonda para medir
# flancos; aquí se aprende el porqué, el procedimiento y la comprobación del banco (ficha 24).
leccion: cap21/sec-21.5

libro:
  85: "es un divisor de tensión compensado en frecuencia"
  86: "el producto R·C debe ser igual en ambas ramas"
  87: "sirve para igualar esa constante a la capacidad de entrada del osciloscopio concreto"
  90: "Compensada: la parte plana del cuadrado es realmente plana, con esquinas rectas."
  91: "Sobrecompensada: hay un pico al principio de cada semiciclo y luego decae."
  92: "Subcompensada: la esquina es redondeada y el nivel sube lentamente."
  94: "Los tiempos de subida medidos son falsos"
  95: "exactamente las medidas para las que se compró el osciloscopio"
  97: "la cuadrada de 1 kHz la da su propio generador por la salida DDS"
  98: "hay que hacerlo cada vez que se cambia de osciloscopio o de canal"
  100: "uno metálico añade su propia capacidad a la mano del que ajusta"
  102: "Se ajusta con una señal de frecuencia más baja y afecta a la planitud en escalas de tiempo largas"
  104: "desajustarla deliberadamente mientras se mira"
  105: "sin que la señal real haya cambiado en absoluto"
  106: "9 MΩ ‖ C₁ en la punta y 1 MΩ ‖ C₂ en la entrada"
  107: "Ajustar el trimmer hasta lograr la forma central"
  "cap21#607": "como mucho 3 V"

modelo:
  valores:
    c_t: { sim: "C₂/C₂ideal", nombre: "capacidad del trimmer respecto a la que compensa", unidad: "", valor: 1.4 }
    T_c: { sim: "T", nombre: "periodo de la cuadrada", unidad: s, valor: 0.001 }
    V_cal: { sim: "V", nombre: "amplitud de la cuadrada de calibración", unidad: V, valor: 3 }
    R1_s: { sim: "R₁", nombre: "resistencia de la punta", unidad: Ω, valor: 9000000 }
    C1_s: { sim: "C₁", nombre: "condensador de la punta", unidad: F, valor: 11e-12 }
    R2_s: { sim: "R₂", nombre: "resistencia de entrada del osciloscopio", unidad: Ω, valor: 1000000 }
  calculos:
    k_p: { expr: "1/c_t", sim: "k", nombre: "R₁C₁/R₂C₂", unidad: "", cifras: 2 }
    r_0: { expr: "10*k_p/(k_p + 9)*100", sim: "escalón", nombre: "escalón inicial respecto a la meseta", unidad: "%" }
    f_s: { expr: "1/T_c", sim: "f", nombre: "frecuencia de la cuadrada", unidad: Hz }
    V_s: { expr: "V_cal", sim: "V", nombre: "cuadrada de calibración", unidad: V }
    C2_s: { expr: "c_t*R1_s*C1_s/R2_s", sim: "C₂", nombre: "capacidad de entrada con el trimmer", unidad: F }
    K0_s: { expr: "C1_s/(C1_s + C2_s)", sim: "K₀", nombre: "división en el flanco", unidad: "" }
    Ki_s: { expr: "R2_s/(R1_s + R2_s)", sim: "K_{∞}", nombre: "división en la meseta", unidad: "" }
    tau_s: { expr: "par(R1_s, R2_s)*(C1_s + C2_s)", sim: "τ", nombre: "constante de tiempo", unidad: s }
    vh_s: { expr: "V_s*(Ki_s + (K0_s - Ki_s)*exp(-1/(2*f_s*tau_s)))", sim: "v(T/2)", nombre: "salida al final de la primera mitad", unidad: V }

tarjetas:
  - id: explore-divisor
    tipo: explorar
    titulo: "Un divisor, no un cable"
    texto: "La sonda ×10 divide por diez con dos resistencias, y cada una lleva una capacidad en paralelo. Toque las piezas."
    libro: [85, 87, 106]
    widget:
      tipo: figura
      figura: fig-21.8
      zonas:
        - { id: c1, rotulo: "C₁, en la punta", rect: [56, 17, 44, 34], texto: "La capacidad en paralelo con R₁, dentro de la punta." }
        - { id: r1, rotulo: "R₁ = 9 MΩ", rect: [56, 51, 46, 34], texto: "Con el millón de ohmios de la entrada, forma la división por diez." }
        - { id: c2, rotulo: "C₂, ajustable", rect: [52, 88, 42, 42], texto: "Cable, entrada y trimmer. El trimmer iguala la constante a la entrada de cada osciloscopio." }
        - { id: r2, rotulo: "R₂ = 1 MΩ", rect: [96, 88, 40, 42], texto: "La entrada del osciloscopio." }
        - { id: pantalla, rotulo: "Onda de calibración", rect: [237, 18, 196, 180], texto: "Lo que se ve según la relación entre R₁C₁ y R₂C₂." }
    requiere: { mover: [c1, c2] }

  - id: explore-trimmer
    tipo: explorar
    titulo: "Gire el trimmer"
    texto: "La cuadrada de 1 kHz, un periodo desde el reposo, vista con la sonda. Mueva el trimmer y mire las esquinas."
    libro: [86, 90, 91, 92]
    inicio: { c_t: 1.4 }
    widget:
      tipo: circuito
      esquema: sonda-x10
      piezas: { entrada: V_s, f: f_s, r1: R1_s, c1: C1_s, r2: R2_s, c2: C2_s }
      lectura: { valor: r_0, rotulo: "Escalón inicial" }
      grafica:
        x: { id: t, min: 0, max: 0.00099, unidad: s, rotulo: "t" }
        y: { min: -0.2, max: 0.6, unidad: V, rotulo: "v" }
        curvas:
          - { expr: "(ceil(t/1e9) - ceil((t - 1/(2*f_s))/1e9))*V_s*(Ki_s + (K0_s - Ki_s)*exp(-t/tau_s)) + ceil((t - 1/(2*f_s))/1e9)*(vh_s - V_s*K0_s)*exp(-max(0, t - 1/(2*f_s))/tau_s)", color: naranja, rotulo: "lo que se ve", mide: salida }
      mandos:
        - { valor: c_t, lista: [0.6, 0.8, 1, 1.2, 1.4], rotulo: "Trimmer, C₂" }
    requiere: { mover: [c_t] }

  - id: prediga-sobre
    tipo: predecir
    titulo: "R₁C₁ mayor que R₂C₂"
    texto: "El trimmer deja R₁C₁ mayor que R₂C₂. ¿Qué se ve en la cuadrada?"
    libro: [86, 91, 106]
    fijar: { c_t: 0.6 }
    widget:
      tipo: circuito
      esquema: sonda-x10
      piezas: { entrada: V_s, f: f_s, r1: R1_s, c1: C1_s, r2: R2_s, c2: C2_s }
      lectura: { valor: r_0, rotulo: "Escalón inicial" }
      grafica:
        x: { id: t, min: 0, max: 0.00099, unidad: s, rotulo: "t" }
        y: { min: -0.2, max: 0.6, unidad: V, rotulo: "v" }
        curvas:
          - { expr: "(ceil(t/1e9) - ceil((t - 1/(2*f_s))/1e9))*V_s*(Ki_s + (K0_s - Ki_s)*exp(-t/tau_s)) + ceil((t - 1/(2*f_s))/1e9)*(vh_s - V_s*K0_s)*exp(-max(0, t - 1/(2*f_s))/tau_s)", color: naranja, rotulo: "lo que se ve", mide: salida }
      ocultar: true
    opciones:
      - texto: "Un pico al principio de cada semiciclo"
        bien: true
        porque: "Sobrecompensada: la rama de la punta deja pasar de más lo rápido. La sonda exagera las frecuencias altas."
      - texto: "Esquinas redondeadas"
        porque: "Eso es con R₁C₁ menor que R₂C₂: subcompensada, la sonda atenúa lo rápido."
      - texto: "Una cuadrada perfecta"
        porque: "Solo con los dos productos R·C iguales."
    escalera:
      - "Con más capacidad relativa en la punta, ¿pasa más o menos de lo rápido?"
    solucion: "Un pico que decae en cada semiciclo: sobrecompensada."

  - id: toque-sub
    tipo: tocar
    titulo: "La sonda que atenúa lo rápido"
    texto: "Toque la imagen de una sonda que atenúa las frecuencias altas."
    libro: [90, 91, 92, 107]
    widget:
      tipo: figura
      figura: fig-21.9
      zonas:
        - { id: sub, rotulo: "A la izquierda", rect: [2, 14, 140, 135] }
        - { id: buena, rotulo: "En el centro", rect: [155, 14, 140, 135] }
        - { id: sobre, rotulo: "A la derecha", rect: [308, 14, 140, 135] }
    tocar:
      bien: [sub]
      porque:
        buena: "Esquinas rectas y mesetas planas: compensada, la misma división a todas las frecuencias."
        sobre: "El pico que decae es lo contrario: la sonda exagera lo rápido."
    exito: "Subcompensada: la esquina se redondea y el nivel sube lentamente."
    escalera: ["Si lo rápido se atenúa, el flanco tarda en llegar arriba."]
    solucion: "A la izquierda: esquinas redondeadas, subcompensada."

  - id: ajuste-trimmer
    tipo: ajuste
    titulo: "Compense la sonda"
    texto: "Con el destornillador de plástico, gire el trimmer hasta que la parte plana lo esté."
    libro: [97, 107]
    inicio: { c_t: 1.4 }
    widget:
      tipo: circuito
      esquema: sonda-x10
      piezas: { entrada: V_s, f: f_s, r1: R1_s, c1: C1_s, r2: R2_s, c2: C2_s }
      lectura: { valor: r_0, rotulo: "Escalón inicial" }
      grafica:
        x: { id: t, min: 0, max: 0.00099, unidad: s, rotulo: "t" }
        y: { min: -0.2, max: 0.6, unidad: V, rotulo: "v" }
        curvas:
          - { expr: "(ceil(t/1e9) - ceil((t - 1/(2*f_s))/1e9))*V_s*(Ki_s + (K0_s - Ki_s)*exp(-t/tau_s)) + ceil((t - 1/(2*f_s))/1e9)*(vh_s - V_s*K0_s)*exp(-max(0, t - 1/(2*f_s))/tau_s)", color: naranja, rotulo: "lo que se ve", mide: salida }
      mandos:
        - { valor: c_t, min: 0.5, max: 1.5, paso: 0.01, rotulo: "Trimmer, C₂" }
    ajuste:
      valor: r_0
      objetivo: 100
      tol: 0.02
      rotulo: "Escalón inicial"
      escala: { min: 50, max: 150 }
      bajo: "Subcompensada: esquinas redondeadas. Baje C₂."
      alto: "Sobrecompensada: pico al principio. Suba C₂."
      dentro: "Compensada: esquinas rectas y meseta plana."

  - id: sorpresa-desajuste
    tipo: sorpresa
    titulo: "La señal no ha cambiado"
    texto: "Ya compensada, desajústela a propósito mientras mira. La cuadrada real es la misma en todo momento."
    libro: [104, 105]
    widget:
      tipo: circuito
      esquema: sonda-x10
      piezas: { entrada: V_s, f: f_s, r1: R1_s, c1: C1_s, r2: R2_s, c2: C2_s }
      lectura: { valor: r_0, rotulo: "Escalón inicial" }
      grafica:
        x: { id: t, min: 0, max: 0.00099, unidad: s, rotulo: "t" }
        y: { min: -0.2, max: 0.6, unidad: V, rotulo: "v" }
        curvas:
          - { expr: "(ceil(t/1e9) - ceil((t - 1/(2*f_s))/1e9))*V_s*Ki_s", color: tinta, rotulo: "la señal real ÷ 10", discontinua: true }
          - { expr: "(ceil(t/1e9) - ceil((t - 1/(2*f_s))/1e9))*V_s*(Ki_s + (K0_s - Ki_s)*exp(-t/tau_s)) + ceil((t - 1/(2*f_s))/1e9)*(vh_s - V_s*K0_s)*exp(-max(0, t - 1/(2*f_s))/tau_s)", color: naranja, rotulo: "lo que se ve", mide: salida }
      mandos:
        - { valor: c_t, lista: [0.6, 0.8, 1, 1.2, 1.4], rotulo: "Trimmer, C₂" }
    requiere: { mover: [c_t] }

  - id: consecuencias
    tipo: pregunta
    titulo: "Lo que falla"
    texto: "Con la sonda descompensada, ¿qué medidas salen mal?"
    libro: [94, 95]
    widget:
      tipo: figura
      figura: fig-21.9
      zonas:
        - { id: tres, rotulo: "Las tres imágenes", rect: [2, 14, 446, 135] }
    opciones:
      - texto: "Tiempos de subida, pulsos cortos y sobreimpulsos"
        bien: true
        porque: "Justo las medidas para las que se compró el osciloscopio."
      - texto: "Solo la frecuencia"
        porque: "La frecuencia apenas cambia; lo que falla es la forma: flancos, picos y pulsos cortos."
      - texto: "Ninguna, si se usa el modo AUTO"
        porque: "AUTO ajusta escalas y disparo; no compensa la sonda."
    escalera:
      - "La sonda descompensada cambia la forma de lo rápido."
    solucion: "Tiempos de subida, amplitud de pulsos cortos y sobreimpulsos."

  - id: procedimiento
    tipo: pregunta
    titulo: "El procedimiento"
    texto: "Ordene los pasos para compensar la sonda del 2C53T."
    libro: [97]
    ordenar:
      - "Sonda en ×10 y su pinza de masa conectada"
      - "Punta a la cuadrada de 1 kHz del generador, por la salida DDS"
      - "Escala con dos o tres ciclos en buena parte de la pantalla"
      - "Girar el trimmer hasta que la parte plana lo esté"
      - "Repetir con el otro canal"
    exito: "Repetir con cada canal: sus capacidades de entrada difieren."
    pistas:
      - { texto: "Primero la sonda, luego la señal, después la imagen y el ajuste." }
    escalera:
      - "El 2C53T no tiene terminal de calibración: la cuadrada sale del generador."
    solucion: "Sonda en ×10, cuadrada del DDS, dos o tres ciclos, trimmer y repetir con el otro canal."

  - id: destornillador
    tipo: porque
    titulo: "El destornillador de plástico"
    texto: "Con un destornillador metálico, la compensación cambia al retirarlo. ¿Por qué?"
    libro: [100]
    widget:
      tipo: figura
      figura: fig-21.8
      zonas:
        - { id: c2, rotulo: "C₂, ajustable", rect: [52, 88, 42, 42] }
    opciones:
      - texto: "El metal añade su capacidad y la de la mano"
        bien: true
        porque: "Se ajusta con una capacidad de más que desaparece al retirarlo. Por eso las sondas traen uno de plástico."
      - texto: "El metal descarga el trimmer"
        porque: "No hay carga que perder: el problema es la capacidad que añade mientras toca."
      - texto: "El metal raya el trimmer"
        porque: "Puede, pero no explica que la compensación cambie al retirarlo."
    escalera:
      - "El ajuste iguala capacidades. ¿Qué es un trozo de metal y una mano junto al trimmer?"
    solucion: "El metal añade su capacidad y la de la mano; al retirarlo, el ajuste se desplaza."

  - id: cada-cuando
    tipo: pregunta
    titulo: "¿Cada cuánto?"
    texto: "Compensó la sonda en CH1 ayer y hoy la pasa a CH2. ¿Qué hace?"
    libro: [87, 98, 102]
    widget:
      tipo: figura
      figura: fig-21.8
      zonas:
        - { id: c2, rotulo: "C₂, ajustable", rect: [52, 88, 42, 42] }
    opciones:
      - texto: "Compensarla otra vez"
        bien: true
        porque: "Cada canal tiene su capacidad de entrada: hay que hacerlo al cambiar de osciloscopio o de canal."
      - texto: "Nada: se compensa una vez en la vida"
        porque: "Ese es el error: la compensación es de una sonda con una entrada concreta."
      - texto: "Ajustar la compensación de baja frecuencia"
        porque: "Ese segundo ajuste, en el BNC de algunas sondas, es para escalas de tiempo largas."
    escalera:
      - "¿Con qué capacidad se igualó la constante de la sonda?"
    solucion: "Compensarla otra vez: cada canal tiene su capacidad de entrada."

  - id: banco-compensar
    tipo: banco
    titulo: "Compense sus dos sondas"
    texto: "Compense cada sonda con la cuadrada del generador y mida su pico a pico con PRM."
    libro: [97, 104, "cap21#607"]
    fijar: { V_cal: 3 }
    banco:
      piezas: ["FNIRSI 2C53T con sus dos sondas", "Cable BNC con pinzas del generador", "Destornillador de plástico de la sonda"]
      medir: "La tensión de pico a pico de la cuadrada de 1 kHz, sonda compensada."
      esperado: V_cal
      unidad: V
      tol: 0.1
      consejos:
        - { cuando: { valor: desviacion, mayor: 1 }, texto: "Mide diez veces más: el factor de sonda del menú no coincide con el conmutador." }
        - { cuando: { valor: desviacion, menor: -0.8 }, texto: "Mide diez veces menos: la sonda está en ×10 y el menú en ×1." }
        - { cuando: { valor: desviacion, mayor: 0.1 }, texto: "Mide de más: ¿hay un pico en la esquina? Compense antes de medir." }
        - { cuando: { valor: desviacion, menor: -0.1 }, texto: "Mide de menos: ¿esquinas redondeadas, o la amplitud del generador por debajo? Compense y revise." }
        - { texto: "Bien. Ahora desajústela a propósito y mire cómo cambia una señal que no cambia." }
      ficha: { n: 24, titulo: "Puesta a punto del FNIRSI: sonda, medidas automáticas y aliasing" }

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [86, 90, 98, 100]
    ideas:
      - { titulo: "Un divisor compensado.", texto: "R·C igual en las dos ramas: la misma división a todas las frecuencias." }
      - { titulo: "Pico o esquina.", texto: "Sobrecompensada exagera lo rápido; subcompensada lo atenúa." }
      - { titulo: "Siempre.", texto: "Al cambiar de osciloscopio o de canal, con la cuadrada de 1 kHz del generador." }
      - { titulo: "De plástico.", texto: "Uno metálico añade capacidad y el ajuste cambia al retirarlo." }
