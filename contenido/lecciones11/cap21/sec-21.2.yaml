# Lección 1.2 de la sección 20.2 «El Panel Frontal — Reconociendo tu Equipo» (cap21; etiqueta interna sec-21.2).
# Formato: contenido/lecciones11/GUIA.md. Sin modelo numérico: la figura 20.3 (fig-21.3, el panel frontal) con zonas
# que se tocan. Coordenadas en el svg_vista de la figura (432 × 338,4).
leccion: cap21/sec-21.2

libro:
  30: "el FNIRSI 2C53T se opera enteramente con botones y una cruceta direccional"
  31: "Panel frontal del FNIRSI 2C53T"
  33: "están las entradas de osciloscopio CH1 y CH2 (conectores BNC) y la salida del generador, rotulada DDS"
  36: "La punta negra va SIEMPRE aquí en todas las mediciones"
  37: "una punta de categoría inferior anula la del instrumento"

modelo:
  valores: {}
  calculos: {}

tarjetas:
  - id: explore-panel
    tipo: explorar
    titulo: "El panel, sin ruedas"
    texto: "Arriba, los conectores del osciloscopio y del generador; abajo, los bornes del multímetro. Toque un conector de arriba y un borne de abajo."
    libro: [30, 31, 33]
    widget:
      tipo: figura
      figura: fig-21.3
      zonas:
        - { id: ch1, rotulo: "CH1, entrada BNC", rect: [144, 4, 40, 36], texto: "Entrada del canal 1 del osciloscopio. Aquí va la sonda P6100, ×1/×10." }
        - { id: ch2, rotulo: "CH2, entrada BNC", rect: [196, 4, 40, 36], texto: "Entrada del otro canal. Los tres BNC están muy juntos: una sonda de carcasa ancha puede no encajar." }
        - { id: dds, rotulo: "DDS, salida del generador", rect: [248, 4, 40, 36], texto: "No es una entrada: es la salida del generador de señal." }
        - { id: pantalla, rotulo: "Pantalla", rect: [128, 66, 176, 86], texto: "La pantalla. Todos los ajustes se hacen navegando con las flechas: no hay ruedas que girar." }
        - { id: b10a, rotulo: "Borne 10A", rect: [124, 292, 44, 42], texto: "Entrada de corriente alta, hasta 10 A, con fusible independiente." }
        - { id: bma, rotulo: "Borne mA", rect: [170, 292, 44, 42], texto: "Entrada de corriente baja, hasta unos 1 A, con fusible propio." }
        - { id: bcom, rotulo: "Borne COM", rect: [217, 292, 44, 42], texto: "Común: negativo, masa. La punta negra va siempre aquí." }
        - { id: bvo, rotulo: "Borne VΩ", rect: [264, 292, 44, 42], texto: "Tensión, resistencia, continuidad, capacidad, diodo y temperatura: la punta roja va aquí." }
    requiere: { mover: [dds, bcom] }

  - id: toque-sonda
    tipo: tocar
    titulo: "La sonda del canal 1"
    texto: "Va a conectar la sonda de osciloscopio al canal 1. Toque dónde."
    libro: [33]
    widget:
      tipo: figura
      figura: fig-21.3
      zonas:
        - { id: ch1, rotulo: "Arriba, el primero", rect: [144, 4, 40, 36] }
        - { id: ch2, rotulo: "Arriba, el segundo", rect: [196, 4, 40, 36] }
        - { id: dds, rotulo: "Arriba, el tercero", rect: [248, 4, 40, 36] }
        - { id: bvo, rotulo: "Abajo, el cuarto", rect: [264, 292, 44, 42] }
    tocar:
      bien: [ch1]
      porque:
        ch2: "Es el BNC de CH2. Sirve igual, pero la sonda iría al otro canal."
        dds: "Es la salida del generador, no una entrada: ahí no se mide nada."
        bvo: "Es un borne banana del multímetro, para las puntas roja y negra, no para la sonda."
    exito: "CH1 es el primero de los tres BNC de arriba, de izquierda a derecha."
    escalera: ["Las sondas de osciloscopio llevan conector BNC."]
    solucion: "Arriba, el primero: CH1. Luego CH2 y la salida DDS."

  - id: toque-generador
    tipo: tocar
    titulo: "La salida del generador"
    texto: "Quiere sacar una cuadrada del generador para probar la sonda. Toque de dónde sale."
    libro: [33]
    widget:
      tipo: figura
      figura: fig-21.3
      zonas:
        - { id: ch1, rotulo: "Arriba, el primero", rect: [144, 4, 40, 36] }
        - { id: ch2, rotulo: "Arriba, el segundo", rect: [196, 4, 40, 36] }
        - { id: dds, rotulo: "Arriba, el tercero", rect: [248, 4, 40, 36] }
        - { id: bma, rotulo: "Abajo, el segundo", rect: [170, 292, 44, 42] }
    tocar:
      bien: [dds]
      porque:
        ch1: "Es una entrada del osciloscopio: recibe la señal, no la da."
        ch2: "Es la otra entrada del osciloscopio."
        bma: "Es la entrada de corriente baja del multímetro."
    exito: "El tercer BNC, rotulado DDS, es la salida del generador."
    escalera: ["Es un BNC como los de las sondas, pero no es una entrada."]
    solucion: "Arriba, el tercero: DDS."

  - id: toque-negra
    tipo: tocar
    titulo: "La punta negra"
    texto: "Va a usar el multímetro. Toque el borne donde va la punta negra."
    libro: [36]
    widget:
      tipo: figura
      figura: fig-21.3
      zonas:
        - { id: b10a, rotulo: "Abajo, el primero", rect: [124, 292, 44, 42] }
        - { id: bma, rotulo: "Abajo, el segundo", rect: [170, 292, 44, 42] }
        - { id: bcom, rotulo: "Abajo, el tercero", rect: [217, 292, 44, 42] }
        - { id: bvo, rotulo: "Abajo, el cuarto", rect: [264, 292, 44, 42] }
    tocar:
      bien: [bcom]
      porque:
        b10a: "Es la entrada de corriente alta: ahí va la roja, y solo para medir corriente."
        bma: "Es la entrada de corriente baja: también para la roja."
        bvo: "Es la de la punta roja para tensión, resistencia y demás."
    exito: "COM: el común. La punta negra va siempre ahí, en todas las medidas."
    escalera: ["Es el común, la masa."]
    solucion: "Abajo, el tercero: COM."

  - id: toque-amperios
    tipo: tocar
    titulo: "Varios amperios"
    texto: "Va a medir una corriente de varios amperios. Toque el borne de la punta roja."
    libro: [36]
    widget:
      tipo: figura
      figura: fig-21.3
      zonas:
        - { id: b10a, rotulo: "Abajo, el primero", rect: [124, 292, 44, 42] }
        - { id: bma, rotulo: "Abajo, el segundo", rect: [170, 292, 44, 42] }
        - { id: bcom, rotulo: "Abajo, el tercero", rect: [217, 292, 44, 42] }
        - { id: bvo, rotulo: "Abajo, el cuarto", rect: [264, 292, 44, 42] }
    tocar:
      bien: [b10a]
      porque:
        bma: "Es la entrada de corriente baja, hasta unos 1 A: varios amperios fundirían su fusible."
        bcom: "Ahí va la punta negra, no la roja."
        bvo: "Es para tensión y resistencia: no mide corriente."
    exito: "10A: corriente alta, hasta 10 A, con su propio fusible."
    escalera: ["Hay dos bornes de corriente; uno llega hasta unos 1 A."]
    solucion: "Abajo, el primero: 10A, hasta 10 A."

  - id: empareje-bornes
    tipo: pregunta
    titulo: "Cada borne, su uso"
    texto: "Empareje cada borne con lo que se mide en él."
    libro: [36]
    emparejar:
      - ["10A", "Corriente alta, con fusible independiente"]
      - ["mA", "Corriente baja, hasta unos 1 A"]
      - ["COM", "La punta negra, siempre"]
      - ["VΩ", "Tensión, resistencia, continuidad, capacidad, diodo"]
    exito: "La negra en COM siempre; la roja en VΩ salvo para corriente."
    pistas:
      - { texto: "Dos bornes son de corriente; uno es el común; el último sirve para todo lo demás." }
    escalera:
      - "COM es la masa: el de la punta negra."
    solucion: "10A, corriente alta; mA, corriente baja; COM, la negra; VΩ, tensión y el resto."

  - id: porque-corto
    tipo: predecir
    titulo: "La punta que se quedó en mA"
    texto: "Tras medir una corriente, mide una tensión sin devolver la punta roja a VΩ. ¿Qué pasa?"
    libro: [37]
    widget:
      tipo: figura
      figura: fig-21.3
      zonas:
        - { id: bma, rotulo: "Borne mA", rect: [170, 292, 44, 42] }
        - { id: bvo, rotulo: "Borne VΩ", rect: [264, 292, 44, 42] }
    opciones:
      - texto: "Un cortocircuito a través del amperímetro"
        bien: true
        porque: "El amperímetro tiene resistencia casi nula: puede fundir el fusible, dañar el equipo o causar un arco."
      - texto: "Marca cero y no pasa nada"
        porque: "Las puntas en paralelo con una fuente y casi sin resistencia entre ellas no son inofensivas: es un corto."
      - texto: "Mide bien, porque detecta la magnitud sola"
        porque: "La autodetección no cambia el borne: la punta sigue en la entrada del amperímetro."
    escalera:
      - "¿Qué resistencia tiene un amperímetro entre sus bornes?"
    solucion: "Un cortocircuito por el amperímetro. Tras medir corriente, la roja vuelve siempre a VΩ."

  - id: categoria
    tipo: pregunta
    titulo: "En un cuadro eléctrico"
    texto: "Tiene que medir en la red y en un cuadro eléctrico. ¿Qué instrumento usa?"
    libro: [37]
    widget:
      tipo: figura
      figura: fig-21.3
      zonas:
        - { id: bornes, rotulo: "Los bornes del multímetro", rect: [124, 292, 184, 42] }
    opciones:
      - texto: "El Brymen BM869s, CAT IV 1000 V"
        bien: true
        porque: "Es el adecuado para la red y los cuadros: su manual lo certifica CAT IV 1000 V."
      - texto: "El 2C53T, que mide hasta 1000 V"
        porque: "Esos 1000 V son lo que declara medir; su manual no da una categoría de medida."
      - texto: "Cualquiera, con puntas de categoría alta"
        porque: "Las puntas no suben la categoría del instrumento: la de menor categoría es la que manda."
    escalera:
      - "Una tensión máxima no es una categoría de seguridad."
    solucion: "El Brymen BM869s, CAT IV 1000 V. Una punta de categoría inferior anula la del instrumento."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [30, 33, 36, 37]
    ideas:
      - { titulo: "Arriba, BNC.", texto: "CH1 y CH2 son entradas; DDS es la salida del generador." }
      - { titulo: "Abajo, bananas.", texto: "La negra siempre en COM; la roja en VΩ, o en mA o 10A solo para corriente." }
      - { titulo: "El error peligroso.", texto: "Medir tensión con la roja en un borne de corriente es un cortocircuito." }
      - { titulo: "Sin ruedas.", texto: "Todo se ajusta con botones y la cruceta." }
