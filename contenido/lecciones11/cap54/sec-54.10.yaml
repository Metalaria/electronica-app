# Lección 1.2 de la sección 56.10 «Documentar, Publicar y Divulgar de Forma Responsable» (cap54; etiquetas sec-54.N =
# impresas 56.N).
# - Qué documentar (bloques 396 a 401), la incertidumbre (403 a 407), el formato (409 a 411), la atribución (413), la
#   divulgación coordinada (416 a 422), qué no publicar (424 a 426), el valor acumulado (428, 429) y el cierre en el
#   banco (431 a 433). Figura 56.15 (fig-54.15).
# Sección sin cálculos: sin modelo (aviso de secuencia «sin tarjeta de fórmula»).
# Pasos prácticos: «ordenar» la divulgación coordinada y «tocar» en la figura el paso de la divulgación que se salta
# quien publica sin avisar.
leccion: cap54/sec-54.10

libro:
  394: "Un trabajo de ingeniería inversa que vive en la cabeza de quien lo hizo se pierde."
  397: "Esa última columna es la que distingue un documento honesto de uno engañoso"
  398: "Son irrecuperables si se pierde la placa."
  401: "Lo que no se pudo averiguar. Es tan valioso como lo demás, porque evita que el siguiente repita el intento."
  404: "Confirmado: medido directamente y verificado por segunda vía."
  405: "Deducido: coherente con todo lo observado, sin comprobación independiente."
  406: "Supuesto: la explicación más probable, sin evidencia directa."
  407: "Un esquema donde todo aparece con la misma autoridad, cuando la mitad son suposiciones, hace perder tiempo a quien lo use."
  409: "Un esquema en formato editable, no solo una imagen."
  410: "que dentro de diez años seguirán abriéndose"
  413: "si un dato heredado resulta erróneo, la trazabilidad permite corregirlo"
  417: "1. Comunicar al fabricante primero"
  418: "Noventa días es la convención habitual, ajustable según la gravedad y la dificultad."
  419: "3. Publicar después, con el fabricante informado, tanto si corrigió como si no."
  420: "describir la vulnerabilidad no exige publicar una herramienta lista para explotarla"
  421: "el objetivo es que se arregle, no demostrar habilidad"
  422: "Si el fabricante no responde o el producto está abandonado, el plazo sigue corriendo y la publicación sigue siendo defendible"
  424: "Se publica el análisis, no el binario."
  425: "Datos personales que hayan aparecido en volcados o capturas."
  426: "Claves o credenciales de servicios de terceros."
  428: "buena parte de lo que hoy se puede reparar, recrear o mantener existe porque alguien documentó su trabajo y lo publicó"
  433: "Es probable que a alguien le ahorre exactamente el tiempo que a uno le costó."
  434: "Qué documentar, cómo anotar la incertidumbre y la divulgación coordinada."

modelo: { valores: {}, calculos: {} }

tarjetas:
  - id: explore-documento
    tipo: explorar
    titulo: "Hacerlo utilizable"
    texto: "Un trabajo que vive en la cabeza de quien lo hizo se pierde. Toque qué documentar y cómo anotar la incertidumbre."
    libro: [394, 434]
    widget:
      tipo: figura
      figura: fig-54.15
      zonas:
        - { id: documentar, rotulo: "Arriba a la izquierda", rect: [5, 5, 210, 125], texto: "Esquema, tabla con su certeza, fotos, medidas, protocolo y lo que no se pudo averiguar." }
        - { id: incertidumbre, rotulo: "Arriba a la derecha", rect: [226, 5, 220, 125], texto: "Confirmado, deducido o supuesto: cada afirmación con su grado." }
        - { id: divulgacion, rotulo: "Abajo", rect: [5, 138, 440, 112], texto: "La divulgación coordinada de un hallazgo de seguridad." }
    requiere: { mover: [documentar, incertidumbre] }

  - id: empareje-certeza
    tipo: pregunta
    titulo: "Anotar la incertidumbre"
    texto: "Es lo que más se descuida. Empareje cada etiqueta con su significado."
    libro: [397, 404, 405, 406, 407]
    widget:
      tipo: figura
      figura: fig-54.15
      zonas:
        - { id: documentar, rotulo: "Arriba a la izquierda", rect: [5, 5, 210, 125] }
    emparejar:
      - ["Confirmado", "Medido directamente y verificado por segunda vía"]
      - ["Deducido", "Coherente con todo, sin comprobación independiente"]
      - ["Supuesto", "La explicación más probable, sin evidencia directa"]
    exito: "Esa columna distingue un documento honesto de uno engañoso: todo a la misma autoridad hace perder tiempo a quien lo use."
    pistas:
      - { texto: "Solo una de las tres tiene una segunda vía de comprobación." }
    escalera:
      - "Ordene las tres por cuánta evidencia tienen."
    solucion: "Confirmado: medido y verificado. Deducido: coherente. Supuesto: lo más probable."

  - id: porque-no-averiguado
    tipo: porque
    titulo: "Lo que no se pudo averiguar"
    texto: "El documento incluye también lo que no se consiguió averiguar. ¿Por qué ponerlo?"
    libro: [401, 398]
    widget:
      tipo: figura
      figura: fig-54.15
      zonas:
        - { id: documentar, rotulo: "Arriba a la izquierda", rect: [5, 5, 210, 125] }
    opciones:
      - texto: "Evita que el siguiente repita el intento"
        bien: true
        porque: "Es tan valioso como lo demás."
      - texto: "Para que el documento sea más largo"
        porque: "No es relleno: ahorra trabajo a quien siga."
      - texto: "No conviene: delata lo que no se sabe"
        porque: "Al revés: decir lo que no se sabe es lo que hace honesto el documento."
    escalera:
      - "¿Qué haría quien retome el trabajo si no sabe que algo ya se intentó?"
    solucion: "Porque evita que otro repita lo que ya se intentó sin éxito."

  - id: predecir-formato
    tipo: predecir
    titulo: "El formato"
    texto: "Va a guardar el esquema del aparato para que otros lo continúen. ¿Cómo?"
    libro: [409, 410]
    widget:
      tipo: figura
      figura: fig-54.15
      zonas:
        - { id: documentar, rotulo: "Arriba a la izquierda", rect: [5, 5, 210, 125] }
    opciones:
      - texto: "En formato editable, y las notas en texto plano o formatos abiertos"
        bien: true
        porque: "Quien lo continúe querrá corregirlo, y dentro de diez años tiene que seguir abriéndose."
      - texto: "Como una imagen de alta resolución"
        porque: "Una imagen no se puede corregir: el esquema va editable."
      - texto: "En el formato de un programa de pago"
        porque: "Puede no abrirse dentro de diez años, ni para quien no lo tenga."
    escalera:
      - "¿Qué necesitará quien encuentre un error en su esquema?"
    solucion: "Editable, con notas en formatos abiertos."

  - id: ordene-divulgacion
    tipo: pregunta
    titulo: "Divulgación coordinada"
    texto: "El análisis revela una clave fija en el firmware. Ordene la práctica aceptada."
    libro: [417, 418, 419, 420]
    widget:
      tipo: figura
      figura: fig-54.15
      zonas:
        - { id: incertidumbre, rotulo: "Arriba a la derecha", rect: [226, 5, 220, 125] }
    ordenar:
      - "Comunicarlo al fabricante, con detalle para reproducirlo"
      - "Darle un plazo razonable para corregirlo"
      - "Publicar después, corrigiera o no"
    exito: "Y al publicar, omitir lo que facilite el abuso: describir no exige publicar una herramienta lista para explotarla."
    pistas:
      - { texto: "El fabricante se entera primero." }
    escalera:
      - "Avisar, esperar y publicar."
    solucion: "Comunicar, dar plazo y publicar."

  - id: toque-salto
    tipo: tocar
    titulo: "Publicar sin avisar"
    texto: "Alguien publica la vulnerabilidad el mismo día que la encuentra. Toque el paso que se ha saltado."
    libro: [417, 421]
    widget:
      tipo: figura
      figura: fig-54.15
      zonas:
        - { id: comunicar, rotulo: "Abajo, el primero", rect: [10, 163, 96, 50] }
        - { id: plazo, rotulo: "Abajo, el segundo", rect: [122, 163, 96, 50] }
        - { id: publicar, rotulo: "Abajo, el tercero", rect: [234, 163, 96, 50] }
        - { id: omitir, rotulo: "Abajo, el cuarto", rect: [346, 163, 96, 50] }
    tocar:
      bien: [comunicar]
      porque:
        plazo: "Sin aviso no hay plazo que dar; el que se salta primero es el anterior."
        publicar: "Publicar es justo lo que ha hecho."
        omitir: "Omitir lo que facilita el abuso es al publicar; aquí falta algo antes."
    exito: "Comunicar al fabricante primero: publicar sin avisar deja expuestos a usuarios que no eligieron ser parte del experimento."
    escalera:
      - "¿Quién debería haberse enterado antes que nadie?"
    solucion: "Abajo, el primero: comunicar al fabricante."

  - id: prediga-sin-respuesta
    tipo: predecir
    titulo: "El fabricante no contesta"
    texto: "Avisó al fabricante y no responde; el producto parece abandonado. ¿Qué hace?"
    libro: [422, 418]
    widget:
      tipo: figura
      figura: fig-54.15
      zonas:
        - { id: divulgacion, rotulo: "Abajo", rect: [5, 138, 440, 112] }
    opciones:
      - texto: "El plazo sigue corriendo; al acabar, publicar es defendible"
        bien: true
        porque: "Los usuarios tienen derecho a saber que su equipo es vulnerable."
      - texto: "No publicar nunca"
        porque: "Dejaría a los usuarios sin saber que su equipo es vulnerable."
      - texto: "Publicar ya, sin esperar"
        porque: "El plazo se respeta aunque no conteste."
    escalera:
      - "¿Para quién es la publicación, al final?"
    solucion: "Esperar el plazo y publicar."

  - id: pregunta-publicar
    tipo: pregunta
    titulo: "Qué no publicar"
    texto: "Su volcado de firmware y sus capturas están analizados. ¿Qué publica?"
    libro: [424, 425, 426]
    widget:
      tipo: figura
      figura: fig-54.15
      zonas:
        - { id: divulgacion, rotulo: "Abajo", rect: [5, 138, 440, 112] }
    opciones:
      - texto: "El análisis, sin el binario, sin datos personales ni claves de terceros"
        bien: true
        porque: "El firmware ajeno es obra protegida; los datos personales y las credenciales de terceros no son suyos."
      - texto: "El binario, para que otros lo comprueben"
        porque: "Se publica el análisis, no el binario."
      - texto: "Las capturas tal cual"
        porque: "Pueden llevar datos personales o claves de servicios de terceros."
    escalera:
      - "¿Qué de todo eso es suyo?"
    solucion: "El análisis; ni el binario, ni datos personales, ni credenciales."

  - id: porque-atribuir
    tipo: porque
    titulo: "Citar de dónde viene cada cosa"
    texto: "Casi nunca se empieza de cero, y citar las notas y los esquemas ajenos es lo mínimo. ¿Qué más consigue?"
    libro: [413, 428, 433]
    widget:
      tipo: figura
      figura: fig-54.15
      zonas:
        - { id: documentar, rotulo: "Arriba a la izquierda", rect: [5, 5, 210, 125] }
    opciones:
      - texto: "Si un dato heredado resulta erróneo, la trazabilidad permite corregirlo"
        bien: true
        porque: "Y publicar lo propio contribuye al acervo: a alguien le ahorrará el tiempo que a uno le costó."
      - texto: "Que el documento parezca más serio"
        porque: "No es apariencia: es poder corregir un dato erróneo."
      - texto: "Nada más"
        porque: "Además de justo, protege: se sabe de dónde vino cada error."
    escalera:
      - "¿Qué pasa si un dato copiado de un foro estaba mal?"
    solucion: "Protege: si un dato heredado está mal, se sabe de dónde vino."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [401, 407, 417, 424]
    ideas:
      - { titulo: "Qué documentar.", texto: "Esquema, tabla, fotos, medidas, protocolo y lo que no se averiguó." }
      - { titulo: "La certeza.", texto: "Confirmado, deducido o supuesto, en cada afirmación." }
      - { titulo: "Divulgación coordinada.", texto: "Avisar, dar plazo y publicar; el objetivo es que se arregle." }
      - { titulo: "No publicar.", texto: "Ni el binario ajeno, ni datos personales, ni claves de terceros." }
