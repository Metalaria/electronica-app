# Lección 1.2 de la sección 56.11 «Problemas de Diseño» (cap54; etiquetas sec-54.N = impresas 56.N).
# - Problema 56.A, el equipo sin esquema (bloques 437 a 447); 56.B, el sensor con protocolo desconocido (449 a 459);
#   56.C, el integrado sin marca (461 a 471); 56.D, copiar o rediseñar (473 a 482).
# - La sección no tiene figuras: las tarjetas usan las del capítulo (cuándo parar, fig-54.5; tramas, fig-54.7; zonas de
#   la placa, fig-54.2; el método, fig-54.4). La caída del puente bipolar frente al de MOSFET cita el capítulo de
#   robótica (cap57#51: L298, 1,8 V con 1 A; TB6612FNG, 0,5 Ω).
# Sección sin cálculos: sin modelo (aviso de secuencia «sin tarjeta de fórmula»).
# Pasos prácticos: «ordenar» la solución de los problemas 56.A, 56.B y 56.D.
leccion: cap54/sec-54.11

libro:
  437: "Llega un instrumento de laboratorio de los años noventa que no enciende"
  440: "el objetivo es reparar, y para reparar basta el bloque implicado"
  442: "1. Inspección visual con luz rasante, antes de tocar nada"
  443: "2. Identificar el bloque de alimentación y levantar solo su esquema"
  444: "Un instrumento que no enciende falla en la alimentación en la gran mayoría de los casos"
  445: "buscar el reloj y el reinicio del procesador, que son las otras dos causas de que un sistema digital no arranque"
  446: "5. Solo entonces, si nada de lo anterior lo explica, ampliar el esquema al bloque sospechoso."
  447: "El trabajo dedicado será de una tarde en lugar de una semana"
  449: "Un sensor industrial entrega datos por dos hilos a una unidad de control que ha muerto"
  452: "La primera tarea es identificar, no decodificar"
  454: "Si una es periódica y estricta, es el reloj: bus síncrono."
  455: "la anchura del pulso más estrecho da el tiempo de bit"
  456: "su presencia sugiere drenador abierto, y con ello I²C o un bus de un hilo"
  457: "Capturar muchas tramas variando deliberadamente la magnitud medida"
  458: "Con eso ya se puede leer, aunque no se entienda la trama entera."
  459: "o sustituir el sensor por uno documentado, que suele ser más barato que el análisis"
  461: "En una placa aparece un integrado de dieciséis patillas con la serigrafía borrada deliberadamente. Está en el camino entre el microcontrolador y un motor."
  464: "es casi con seguridad un puente o un controlador de motor"
  468: "los diodos de recirculación internos aparecen como uniones"
  469: "La caída identifica si es un puente con transistores bipolares —caída notable— o con MOSFET."
  471: "para reparar no hace falta la referencia exacta, basta un equivalente con el mismo patillaje y prestaciones iguales o mejores"
  478: "produce una placa con la tecnología de hace treinta años"
  480: "La decisión razonada: rediseñar, salvo que haya una restricción mecánica o de conector que obligue a reproducir la placa exactamente."
  481: "levantar el esquema funcional de la unidad que funciona (secciones 56.3 y 56.5), verificarlo comparando su comportamiento con el de la unidad real, y solo entonces diseñar la placa nueva"
  482: "La unidad averiada, que no tiene arreglo, es la candidata para las técnicas destructivas si hiciera falta."
  "cap57#51": "su hoja de datos da una caída total (transistor superior más inferior) de 1,8 V típicos"

modelo: { valores: {}, calculos: {} }

tarjetas:
  - id: explore-objetivo
    tipo: explorar
    titulo: "El equipo sin esquema"
    texto: "Un instrumento de los noventa no enciende, sin esquema ni fabricante: el objetivo decide hasta dónde llegar. Toque reparar."
    libro: [437, 440]
    widget:
      tipo: figura
      figura: fig-54.5
      zonas:
        - { id: reparar, rotulo: "Abajo, la primera", rect: [8, 165, 105, 52], texto: "Reparar: basta el bloque implicado." }
        - { id: interoperar, rotulo: "Abajo, la segunda", rect: [118, 165, 105, 52], texto: "Interoperar: basta la interfaz." }
        - { id: recrear, rotulo: "Abajo, la tercera", rect: [228, 165, 105, 52], texto: "Recrear: el comportamiento completo." }
        - { id: reproducir, rotulo: "Abajo, la cuarta", rect: [338, 165, 105, 52], texto: "Reproducir la placa: todo, y casi siempre compensa rediseñar." }
    requiere: { mover: [reparar] }

  - id: ordene-a
    tipo: pregunta
    titulo: "El instrumento que no enciende"
    texto: "Ordene el trabajo para diagnosticar el instrumento con el mínimo esfuerzo."
    libro: [442, 443, 444, 445, 446, 447]
    widget:
      tipo: figura
      figura: fig-54.4
      zonas:
        - { id: pasos, rotulo: "Los seis pasos", rect: [3, 3, 205, 216] }
    ordenar:
      - "Inspección visual con luz rasante"
      - "Levantar solo el esquema de la alimentación"
      - "Comprobar las tensiones que ese esquema predice"
      - "Buscar el reloj y el reinicio del procesador"
      - "Solo entonces, ampliar al bloque sospechoso"
    exito: "Una tarde en lugar de una semana, y el esquema parcial sirve para futuras averías."
    pistas:
      - { texto: "Antes de tocar nada, mirar." }
    escalera:
      - "De lo más barato a lo más caro: mirar, la alimentación, el arranque y, al final, ampliar."
    solucion: "Inspección, esquema de la alimentación, tensiones, reloj y reinicio, y ampliar."

  - id: porque-a
    tipo: porque
    titulo: "No levantar todo"
    texto: "La tentación es levantar el esquema completo de las ochenta piezas. ¿Por qué es un error de método?"
    libro: [440, 444]
    widget:
      tipo: figura
      figura: fig-54.5
      zonas:
        - { id: reparar, rotulo: "Abajo, la primera", rect: [8, 165, 105, 52] }
    opciones:
      - texto: "El objetivo es reparar, y para reparar basta el bloque implicado"
        bien: true
        porque: "Y uno que no enciende falla en la alimentación en la gran mayoría de los casos."
      - texto: "Porque ochenta piezas no se pueden levantar"
        porque: "Se puede, pero lleva una semana que no hace falta."
      - texto: "Porque sin esquema no se puede reparar"
        porque: "Se repara con el esquema del bloque implicado."
    escalera:
      - "¿Qué parte del circuito explica que no encienda?"
    solucion: "Porque para reparar basta el bloque implicado."

  - id: prediga-arranque
    tipo: predecir
    titulo: "La alimentación está bien"
    texto: "Las tensiones de la alimentación son las que predice su esquema, y el instrumento sigue sin arrancar. ¿Qué se mira ahora?"
    libro: [445]
    widget:
      tipo: figura
      figura: fig-54.2
      zonas:
        - { id: procesador, rotulo: "La columna del centro", rect: [101, 28, 74, 214] }
    opciones:
      - texto: "El reloj y el reinicio del procesador"
        bien: true
        porque: "Son las otras dos causas de que un sistema digital no arranque."
      - texto: "Todo el esquema, desde el principio"
        porque: "Ampliar va al final, si nada de esto lo explica."
      - texto: "El firmware"
        porque: "Antes que el programa, lo que le deja ejecutarse: reloj y reinicio."
    escalera:
      - "¿Qué necesita un procesador, además de alimentación, para arrancar?"
    solucion: "El reloj y el reinicio."

  - id: ordene-b
    tipo: pregunta
    titulo: "Un sensor por dos hilos"
    texto: "La unidad de control murió y quiere leer el sensor con un microcontrolador propio. Ordene el plan."
    libro: [449, 452, 454, 455, 456, 457, 458]
    widget:
      tipo: figura
      figura: fig-54.7
      zonas:
        - { id: columnas, rotulo: "Las tramas", rect: [72, 32, 228, 130] }
    ordenar:
      - "Mirar las dos líneas: ¿hay un reloj?"
      - "Medir la velocidad por el pulso más estrecho"
      - "Buscar pull-ups hacia la alimentación"
      - "Capturar muchas tramas variando la magnitud"
      - "Localizar los bytes que siguen a la magnitud"
    exito: "Con eso ya se puede leer, aunque no se entienda la trama entera. Primero identificar, después decodificar."
    pistas:
      - { texto: "Identificar el bus va antes que capturar tramas." }
    escalera:
      - "Primero qué bus es; después qué dice."
    solucion: "Reloj, velocidad, pull-ups, capturas y bytes que siguen a la magnitud."

  - id: prediga-pullup
    tipo: predecir
    titulo: "Pull-ups en los dos hilos"
    texto: "Las dos líneas del sensor tienen resistencias hacia la alimentación. ¿Qué sugiere?"
    libro: [456]
    widget:
      tipo: figura
      figura: fig-54.7
      zonas:
        - { id: columnas, rotulo: "Las tramas", rect: [72, 32, 228, 130] }
    opciones:
      - texto: "Drenador abierto: I²C o un bus de un hilo"
        bien: true
        porque: "Las salidas solo tiran a masa y las resistencias suben la línea."
      - texto: "Un bus diferencial"
        porque: "Un diferencial tiene un nivel de reposo entre hilos, sin pull-ups así."
      - texto: "Que el sensor está averiado"
        porque: "Las pull-ups son parte normal de ciertos buses."
    escalera:
      - "¿Qué salidas necesitan una resistencia que suba la línea?"
    solucion: "Drenador abierto, y con ello I²C o un hilo."

  - id: prediga-cifrado
    tipo: predecir
    titulo: "Si las tramas nunca se repiten"
    texto: "Con el sensor en la misma condición, las tramas son siempre distintas, sin contador visible. ¿Qué vías quedan?"
    libro: [459]
    widget:
      tipo: figura
      figura: fig-54.7
      zonas:
        - { id: aviso, rotulo: "La franja de abajo", rect: [4, 195, 443, 40] }
    opciones:
      - texto: "Volcar el firmware de la unidad muerta, o cambiar el sensor por uno documentado"
        bien: true
        porque: "Sustituirlo suele ser más barato que el análisis."
      - texto: "Seguir capturando hasta que se repitan"
        porque: "Con cifrado o código variable no se van a repetir: el tráfico se acaba."
      - texto: "Ninguna: el sensor es inservible"
        porque: "Quedan dos vías: el firmware, si no está protegido, o un sensor documentado."
    escalera:
      - "¿Dónde está la clave del cifrado, si no está en el tráfico?"
    solucion: "El firmware de la unidad, o un sensor documentado."

  - id: prediga-c
    tipo: predecir
    titulo: "Dieciséis patillas borradas"
    texto: "Un integrado de dieciséis patillas, con la serigrafía borrada a propósito, está entre el microcontrolador y un motor. ¿Qué es, casi con seguridad?"
    libro: [461, 464]
    widget:
      tipo: figura
      figura: fig-54.2
      zonas:
        - { id: conversion, rotulo: "Abajo a la izquierda", rect: [18, 138, 76, 104] }
    opciones:
      - texto: "Un puente o un controlador de motor"
        bien: true
        porque: "La posición, entre lógica y potencia, acota mucho."
      - texto: "Una memoria"
        porque: "Una memoria no va entre el microcontrolador y un motor."
      - texto: "Un regulador"
        porque: "Un regulador tiene tres patillas y va en la alimentación."
    escalera:
      - "¿Qué hay entre una señal lógica y un motor?"
    solucion: "Un puente o un controlador de motor."

  - id: prediga-caida
    tipo: predecir
    titulo: "La caída lo delata"
    texto: "En funcionamiento, con 1 A, el integrado se come 1,8 V entre la alimentación y el motor. ¿Qué transistores lleva?"
    libro: [469, "cap57#51", 468]
    widget:
      tipo: figura
      figura: fig-54.2
      zonas:
        - { id: conversion, rotulo: "Abajo a la izquierda", rect: [18, 138, 76, 104] }
    opciones:
      - texto: "Bipolares: la caída es notable"
        bien: true
        porque: "Como el L298, con 1,8 V típicos con 1 A; uno de MOSFET caería mucho menos."
      - texto: "MOSFET"
        porque: "Un puente de MOSFET como el TB6612FNG, con 0,5 Ω, caería 0,5 V con 1 A."
      - texto: "No se puede saber sin desoldarlo"
        porque: "La caída en funcionamiento lo identifica sin desoldar nada."
    escalera:
      - "¿Qué puente cae casi dos voltios con un amperio?"
    solucion: "Bipolares: la caída notable delata el puente bipolar."

  - id: porque-referencia
    tipo: porque
    titulo: "Sin la referencia exacta"
    texto: "Encapsulado, patillaje y prestaciones dejan dos o tres candidatos. ¿Por qué basta para reparar?"
    libro: [471]
    widget:
      tipo: figura
      figura: fig-54.2
      zonas:
        - { id: conversion, rotulo: "Abajo a la izquierda", rect: [18, 138, 76, 104] }
    opciones:
      - texto: "Basta un equivalente con el mismo patillaje y prestaciones iguales o mejores"
        bien: true
        porque: "Los candidatos suelen ser intercambiables en la práctica."
      - texto: "No basta: sin la referencia exacta no se puede"
        porque: "Para reparar no hace falta: hace falta que sea equivalente."
      - texto: "Porque todos los puentes son iguales"
        porque: "No lo son: por eso se exige el mismo patillaje y prestaciones al menos iguales."
    escalera:
      - "¿Qué necesita el circuito del integrado nuevo?"
    solucion: "Porque basta un equivalente con el mismo patillaje y prestaciones al menos iguales."

  - id: ordene-d
    tipo: pregunta
    titulo: "Fabricar un repuesto"
    texto: "Hay una placa descatalogada que funciona y otra sin arreglo; se rediseña. Ordene el trabajo."
    libro: [480, 481, 482, 478]
    widget:
      tipo: figura
      figura: fig-54.5
      zonas:
        - { id: reproducir, rotulo: "Abajo, la cuarta", rect: [338, 165, 105, 52] }
    ordenar:
      - "Levantar el esquema funcional de la unidad que funciona"
      - "Verificarlo con el comportamiento de la unidad real"
      - "Diseñar la placa nueva con criterios actuales"
    exito: "Rediseñar, salvo restricción mecánica o de conector. La unidad averiada queda para técnicas destructivas si hicieran falta."
    pistas:
      - { texto: "No se diseña nada antes de verificar el esquema." }
    escalera:
      - "Entender, comprobar y después fabricar."
    solucion: "Esquema funcional, verificación y placa nueva."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [440, 452, 471, 480]
    ideas:
      - { titulo: "Reparar.", texto: "Basta el bloque implicado: empiece por la alimentación." }
      - { titulo: "Protocolos.", texto: "Identificar antes de decodificar; si hay cifrado, firmware o sustituir." }
      - { titulo: "Sin marca.", texto: "Posición, patillas, uniones y caída: basta un equivalente." }
      - { titulo: "Repuestos.", texto: "Rediseñar desde el esquema funcional verificado." }
