# Lección 1.2 de la sección 56.1 «Qué es la Ingeniería Inversa, y sus Límites» (cap54; etiquetas sec-54.N = impresas
# 56.N).
# - Qué es y para qué se hace (bloques 3 a 11), el encuadre legal (14 a 22, en términos generales y en la UE, como el
#   libro: ninguna afirmación jurídica que no esté en él), la ética (24 a 27), lo que se puede con un banco casero (30 a
#   33; figura 56.1, fig-54.1), el método (35, 36) y el ejercicio del banco (38, 39).
# Sección sin cálculos: sin modelo (aviso de secuencia «sin tarjeta de fórmula»).
# Pasos prácticos: «tocar» en la figura dónde cae leer una memoria con la protección activada y «ordenar» el método.
leccion: cap54/sec-54.1

libro:
  4: "La ingeniería inversa es el conjunto de métodos para deducir cómo está hecho algo a partir del objeto mismo"
  7: "Reparar. Sin esquema, localizar la avería exige deducir primero la parte del circuito implicada"
  8: "Mantener lo obsoleto."
  9: "Interoperar. Conectar un equipo con otro exige conocer su protocolo"
  10: "Recrear. Reconstruir un sistema en lógica programable"
  11: "Verificar. Comprobar de forma independiente que un dispositivo hace lo que promete y no otra cosa"
  14: "en la Unión Europea la ingeniería inversa está amparada cuando persigue interoperabilidad, cuando es necesaria para reparar o mantener un producto que se posee, y en el marco de la investigación de seguridad"
  16: "Copiar el diseño para fabricarlo y venderlo no es ingeniería inversa"
  17: "Las patentes protegen la invención aunque uno la deduzca por su cuenta."
  18: "El firmware es una obra protegida. Analizarlo para interoperar tiene amparo; redistribuirlo, no."
  21: "entender es legítimo; copiar, no"
  22: "Ante cualquier caso comercial concreto, la consulta es jurídica y no técnica."
  25: "Atribuir el trabajo previo."
  26: "Publicar de forma responsable."
  27: "No dañar a terceros."
  30: "Se puede: levantar el esquema de una placa de una o dos capas"
  31: "Se puede con esfuerzo y equipo: placas multicapa, protocolos rápidos, señales de radiofrecuencia."
  32: "No se puede razonablemente: leer una memoria con la protección activada, trazar el silicio de un integrado moderno, o romper criptografía correctamente implementada"
  33: "Saber dónde está esa frontera ahorra semanas."
  35: "observar sin tocar, formular una hipótesis, y comprobarla con la medida más barata que la distinga"
  36: "aquí se busca qué es lo normal, y hay que construirlo desde cero"
  39: "No repararlo: entenderlo."
  40: "Los límites legales y prácticos de la ingeniería inversa."

modelo: { valores: {}, calculos: {} }

tarjetas:
  - id: explore-limites
    tipo: explorar
    titulo: "Los límites, primero"
    texto: "Deducir cómo está hecho algo a partir del objeto mismo tiene límites legales y prácticos. Toque lo amparado y lo que no se puede en casa."
    libro: [4, 14, 18, 40]
    widget:
      tipo: figura
      figura: fig-54.1
      zonas:
        - { id: amparado, rotulo: "Arriba a la izquierda", rect: [2, 22, 220, 99], texto: "Amparado, en términos generales en la UE: interoperar, reparar y mantener lo propio, e investigar la seguridad." }
        - { id: no-amparado, rotulo: "Arriba a la derecha", rect: [232, 22, 220, 99], texto: "No amparado: copiar para fabricar y vender, fabricar lo patentado, redistribuir el firmware." }
        - { id: se-puede, rotulo: "Abajo a la izquierda", rect: [2, 174, 145, 76], texto: "Se puede en casa: placas de una o dos capas, buses lentos y medios, firmware sin protección." }
        - { id: esfuerzo, rotulo: "Abajo en el centro", rect: [154, 174, 145, 76], texto: "Con esfuerzo y equipo: multicapa, protocolos rápidos, radiofrecuencia." }
        - { id: no-casa, rotulo: "Abajo a la derecha", rect: [306, 174, 145, 76], texto: "No, razonablemente: memoria protegida, silicio moderno, criptografía bien implementada." }
    requiere: { mover: [amparado, no-casa] }

  - id: empareje-motivos
    tipo: pregunta
    titulo: "Para qué se hace"
    texto: "Empareje cada motivo legítimo con un ejemplo."
    libro: [7, 8, 9, 10, 11]
    widget:
      tipo: figura
      figura: fig-54.1
      zonas:
        - { id: amparado, rotulo: "Arriba a la izquierda", rect: [2, 22, 220, 99] }
    emparejar:
      - ["Reparar", "Deducir la parte del circuito implicada sin esquema"]
      - ["Mantener lo obsoleto", "Un equipo cuyo fabricante desapareció"]
      - ["Interoperar", "Conocer un protocolo que no está publicado"]
      - ["Recrear", "Reconstruir un sistema en lógica programable"]
      - ["Verificar", "Comprobar que un dispositivo hace lo que promete y no otra cosa"]
    exito: "No es una actividad marginal ni sospechosa: mantiene vivos equipos sin soporte."
    pistas:
      - { texto: "Verificar es la base de la investigación en seguridad." }
    escalera:
      - "¿Qué se consigue en cada caso: arreglar, conservar, conectar, reconstruir o comprobar?"
    solucion: "Reparar: sin esquema. Obsoleto: sin fabricante. Interoperar: protocolo. Recrear: lógica programable. Verificar: lo que promete."

  - id: prediga-patente
    tipo: predecir
    titulo: "Lo deduje yo solo"
    texto: "Alguien deduce por su cuenta cómo funciona un circuito patentado. ¿Puede fabricarlo?"
    libro: [17, 16]
    widget:
      tipo: figura
      figura: fig-54.1
      zonas:
        - { id: no-amparado, rotulo: "Arriba a la derecha", rect: [232, 22, 220, 99] }
    opciones:
      - texto: "No: la patente protege la invención aunque se deduzca solo"
        bien: true
        porque: "Descubrir cómo funciona algo no da derecho a fabricarlo si está patentado."
      - texto: "Sí, si no copió ningún documento"
        porque: "Da igual cómo se obtuviera: la patente protege la invención."
      - texto: "Sí, porque la ingeniería inversa está amparada"
        porque: "Lo está para entender, reparar o interoperar; no para fabricar lo patentado."
    escalera:
      - "¿Qué protege una patente: el documento o la invención?"
    solucion: "No: la patente protege la invención en sí."

  - id: porque-regla
    tipo: porque
    titulo: "Entender es legítimo; copiar, no"
    texto: "Esa es la regla práctica que resume el encuadre legal. ¿Qué decide de qué lado se está?"
    libro: [21, 22]
    widget:
      tipo: figura
      figura: fig-54.1
      zonas:
        - { id: regla, rotulo: "La franja del centro", rect: [40, 125, 380, 35] }
    opciones:
      - texto: "El resultado: conocimiento, o un producto que compite usando el diseño ajeno"
        bien: true
        porque: "Un esquema para reparar o un protocolo para conectar es terreno razonable; un clon, no. Ante un caso comercial, la consulta es jurídica."
      - texto: "Las herramientas que se usen"
        porque: "El osciloscopio es el mismo en los dos lados; lo que cambia es qué se hace con lo aprendido."
      - texto: "Si el aparato funciona o no"
        porque: "Funcione o no, lo que importa es si el resultado es conocimiento o una copia."
    escalera:
      - "¿Qué sale del trabajo al final?"
    solucion: "El resultado: conocimiento es razonable; un producto que compite con el diseño ajeno, no."

  - id: toque-memoria
    tipo: tocar
    titulo: "Una memoria protegida"
    texto: "Quiere leer la memoria de un microcontrolador con la protección de lectura activada. Toque dónde cae, con un banco casero."
    libro: [30, 31, 32, 33]
    widget:
      tipo: figura
      figura: fig-54.1
      zonas:
        - { id: se-puede, rotulo: "Abajo a la izquierda", rect: [2, 174, 145, 76] }
        - { id: esfuerzo, rotulo: "Abajo en el centro", rect: [154, 174, 145, 76] }
        - { id: no-casa, rotulo: "Abajo a la derecha", rect: [306, 174, 145, 76] }
    tocar:
      bien: [no-casa]
      porque:
        se-puede: "En casa se extrae firmware cuando la protección está desactivada, no activada."
        esfuerzo: "Con esfuerzo caen la multicapa y la radiofrecuencia; la memoria protegida exige laboratorio."
    exito: "No razonablemente: exige laboratorio, y a veces no es viable. Saber dónde está la frontera ahorra semanas."
    escalera:
      - "¿Qué columna habla de protección activada?"
    solucion: "Abajo a la derecha: no se puede razonablemente."

  - id: empareje-etica
    tipo: pregunta
    titulo: "Más allá de lo legal"
    texto: "Empareje cada exigencia ética con su concreción."
    libro: [25, 26, 27]
    widget:
      tipo: figura
      figura: fig-54.1
      zonas:
        - { id: regla, rotulo: "La franja del centro", rect: [40, 125, 380, 35] }
    emparejar:
      - ["Atribuir el trabajo previo", "Citar foros, notas y esquemas parciales de otros"]
      - ["Publicar de forma responsable", "Avisar primero al fabricante y darle plazo"]
      - ["No dañar a terceros", "No comprometer la privacidad ni la seguridad de usuarios ajenos"]
    exito: "Casi nada se descubre desde cero: citar es lo mínimo."
    pistas:
      - { texto: "Un fallo de seguridad no se publica sin avisar antes." }
    escalera:
      - "Una mira al pasado (de quién se aprendió), otra al fabricante y otra a los usuarios."
    solucion: "Atribuir: citar. Publicar: avisar y dar plazo. No dañar: privacidad y seguridad ajenas."

  - id: ordene-metodo
    tipo: pregunta
    titulo: "El método, en una frase"
    texto: "Es el mismo de la reparación, aplicado a entender. Ordénelo."
    libro: [35]
    widget:
      tipo: figura
      figura: fig-54.1
      zonas:
        - { id: se-puede, rotulo: "Abajo a la izquierda", rect: [2, 174, 145, 76] }
    ordenar:
      - "Observar sin tocar"
      - "Formular una hipótesis"
      - "Comprobarla con la medida más barata que la distinga"
    exito: "Lo que cambia es el objetivo: aquí se busca qué es lo normal, y se construye desde cero."
    pistas:
      - { texto: "Antes de medir, una idea de qué se espera encontrar." }
    escalera:
      - "Mirar, pensar, medir."
    solucion: "Observar, formular una hipótesis y comprobarla con la medida más barata."

  - id: prediga-normal
    tipo: predecir
    titulo: "Reparar o entender"
    texto: "En reparación se busca lo que se ha desviado de lo normal. ¿Qué se busca en ingeniería inversa?"
    libro: [36]
    widget:
      tipo: figura
      figura: fig-54.1
      zonas:
        - { id: se-puede, rotulo: "Abajo a la izquierda", rect: [2, 174, 145, 76] }
    opciones:
      - texto: "Qué es lo normal, construyéndolo desde cero"
        bien: true
        porque: "No hay esquema con el que comparar: hay que deducirlo."
      - texto: "Lo mismo, la avería"
        porque: "El aparato puede funcionar perfectamente: se quiere entender, no arreglar."
      - texto: "El componente más caro"
        porque: "El objetivo es entender el conjunto, no valorar piezas."
    escalera:
      - "Sin esquema, ¿con qué se compara una medida?"
    solucion: "Qué es lo normal: no hay referencia, se construye."

  - id: porque-aparato
    tipo: porque
    titulo: "El aparato del capítulo"
    texto: "El primer ejercicio: elegir un aparato sencillo y barato y proponerse entenderlo entero. ¿Por qué entenderlo y no repararlo?"
    libro: [39]
    widget:
      tipo: figura
      figura: fig-54.1
      zonas:
        - { id: se-puede, rotulo: "Abajo a la izquierda", rect: [2, 174, 145, 76] }
    opciones:
      - texto: "Porque al terminar el capítulo se tiene su esquema completo, hecho por uno mismo"
        bien: true
        porque: "Qué hace cada componente, por dónde va la energía, qué señales circulan: sobre él se practican las secciones siguientes."
      - texto: "Porque un aparato barato no se puede reparar"
        porque: "Se elige barato para practicar sin miedo, no porque no se pueda reparar."
      - texto: "Para venderlo después"
        porque: "El objetivo es conocimiento, no un producto."
    escalera:
      - "¿Qué se tiene al final si se entiende todo?"
    solucion: "Porque entenderlo entero deja su esquema completo, que es el objetivo del capítulo."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [4, 21, 32, 35]
    ideas:
      - { titulo: "Qué es.", texto: "Deducir cómo está hecho algo a partir del objeto mismo." }
      - { titulo: "El encuadre.", texto: "Entender es legítimo; copiar, no. Un caso comercial, al jurista." }
      - { titulo: "La frontera.", texto: "Memoria protegida, silicio moderno y buena criptografía: fuera del banco casero." }
      - { titulo: "El método.", texto: "Observar, hipótesis y la medida más barata que la distinga." }
