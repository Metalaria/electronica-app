# Lección 1.2 de la sección 56.12 «El Último Ejercicio» (cap54; etiquetas sec-54.N = impresas 56.N).
# - Lo que el libro ha intentado transmitir (bloques 487 a 490), lo que queda fuera (493 a 498), cómo seguir (500 a
#   504), el oficio (506 a 508) y el aparato averiado (510 a 512). Figura 56.16 (fig-54.16).
# Sección sin cálculos: sin modelo (aviso de secuencia «sin tarjeta de fórmula»).
# Paso práctico: «tocar» en la figura dónde queda la compatibilidad electromagnética de certificación.
leccion: cap54/sec-54.12

libro:
  485: "este cierre no es un resumen de lo visto, sino una nota sobre lo que sigue"
  487: "Un procedimiento sirve para el caso previsto; el mecanismo sirve para el que no lo estaba, que es la mayoría."
  488: "cuando el resultado no cuadra con lo esperado, ahí está exactamente lo que falta por entender"
  489: "La teoría dice qué hacer; la física dice si se puede."
  490: "Nada es ideal, y las desviaciones son precisamente lo que explica el comportamiento real."
  497: "La compatibilidad electromagnética de certificación, que exige medios que no están en un banco."
  498: "Cada una de ellas tiene sus propios libros, y este ha intentado dejar preparado para abordarlos."
  500: "Un circuito montado enseña más que diez leídos, porque obliga a decidir."
  501: "porque el circuito no lo diseñó uno y hay que entenderlo de verdad"
  502: "Midiendo, y anotando las discrepancias, que son donde está el aprendizaje."
  503: "Leyendo hojas de datos completas, incluidas las erratas"
  504: "Documentando lo propio, que es lo que permite que el trabajo de hace dos años siga sirviendo"
  506: "se puede comprobar"
  507: "cada vez que algo funciona hay una razón concreta, y cada vez que falla hay algo que aprender"
  508: "casi todo se puede reparar"
  511: "tiene una virtud que ningún proyecto propio da: el circuito no lo diseñó uno"
  512: "Si eso sale bien, el libro ha cumplido su función."
  513: "Lo que el libro ha intentado transmitir, lo que queda fuera y cómo seguir."

modelo: { valores: {}, calculos: {} }

tarjetas:
  - id: explore-cierre
    tipo: explorar
    titulo: "Una nota sobre lo que sigue"
    texto: "El cierre no es un resumen: es lo que sigue. Toque lo que el libro ha intentado transmitir y cómo seguir."
    libro: [485, 513]
    widget:
      tipo: figura
      figura: fig-54.16
      zonas:
        - { id: transmitir, rotulo: "Arriba a la izquierda", rect: [5, 5, 218, 68], texto: "El mecanismo antes que el procedimiento, medir antes que suponer, límites físicos, nada es ideal." }
        - { id: fuera, rotulo: "Arriba a la derecha", rect: [231, 5, 218, 68], texto: "Lo que queda fuera: microelectrónica, RF alta, potencia industrial, software complejo, EMC de certificación." }
        - { id: seguir, rotulo: "En el centro", rect: [8, 78, 438, 66], texto: "Cómo seguir: construyendo, reparando, midiendo, leyendo hojas de datos y documentando." }
        - { id: ejercicio, rotulo: "Abajo", rect: [8, 150, 438, 38], texto: "El ejercicio que lo reúne todo: un aparato averiado." }
    requiere: { mover: [transmitir, seguir] }

  - id: prediga-mecanismo
    tipo: predecir
    titulo: "Mecanismo o procedimiento"
    texto: "Un procedimiento sirve para el caso previsto. ¿Para qué sirve entender el mecanismo?"
    libro: [487]
    widget:
      tipo: figura
      figura: fig-54.16
      zonas:
        - { id: transmitir, rotulo: "Arriba a la izquierda", rect: [5, 5, 218, 68] }
    opciones:
      - texto: "Para el caso que no estaba previsto, que es la mayoría"
        bien: true
        porque: "Por eso el libro explica por qué funcionan las cosas, no solo cómo hacerlas."
      - texto: "Para memorizar mejor los procedimientos"
        porque: "Lo que se busca es no depender de la memoria."
      - texto: "Para nada práctico"
        porque: "Al revés: es lo que resuelve los casos reales, que casi nunca son los previstos."
    escalera:
      - "¿Cuántos de los problemas reales estaban previstos?"
    solucion: "Para lo imprevisto, que es la mayoría."

  - id: porque-medir
    tipo: porque
    titulo: "Medir antes que suponer"
    texto: "El resultado de una medida no cuadra con lo esperado. ¿Por qué es una buena noticia?"
    libro: [488, 490, 502]
    widget:
      tipo: figura
      figura: fig-54.16
      zonas:
        - { id: transmitir, rotulo: "Arriba a la izquierda", rect: [5, 5, 218, 68] }
    opciones:
      - texto: "Ahí está exactamente lo que falta por entender"
        bien: true
        porque: "Las discrepancias son donde está el aprendizaje: nada es ideal, y las desviaciones explican el comportamiento real."
      - texto: "Porque el instrumento está mal"
        porque: "El instrumento no miente: lo que no cuadra es lo esperado."
      - texto: "No lo es: hay que repetirla hasta que cuadre"
        porque: "Repetir hasta que cuadre es esconder justo lo que enseña."
    escalera:
      - "¿Quién se equivoca más a menudo: el instrumento o la suposición?"
    solucion: "Porque señala lo que falta por entender."

  - id: toque-emc
    tipo: tocar
    titulo: "Lo que queda fuera"
    texto: "Certificar la compatibilidad electromagnética de un producto. Toque dónde la sitúa el libro."
    libro: [497, 498]
    widget:
      tipo: figura
      figura: fig-54.16
      zonas:
        - { id: transmitir, rotulo: "Arriba a la izquierda", rect: [5, 5, 218, 68] }
        - { id: fuera, rotulo: "Arriba a la derecha", rect: [231, 5, 218, 68] }
        - { id: seguir, rotulo: "En el centro", rect: [8, 78, 438, 66] }
    tocar:
      bien: [fuera]
      porque:
        transmitir: "Ahí están las ideas que el libro sí ha intentado transmitir."
        seguir: "Ahí está cómo seguir aprendiendo; la EMC de certificación necesita otros medios."
    exito: "Fuera: exige medios que no están en un banco. Cada disciplina tiene sus libros, y este ha intentado dejar preparado."
    escalera:
      - "¿Cabe una cámara de certificación en un banco?"
    solucion: "Arriba a la derecha: lo que queda fuera."

  - id: empareje-seguir
    tipo: pregunta
    titulo: "Cómo seguir"
    texto: "Empareje cada manera de seguir aprendiendo con su razón."
    libro: [500, 501, 502, 503, 504]
    widget:
      tipo: figura
      figura: fig-54.16
      zonas:
        - { id: seguir, rotulo: "En el centro", rect: [8, 78, 438, 66] }
    emparejar:
      - ["Construyendo", "Un circuito montado enseña más que diez leídos"]
      - ["Reparando", "El circuito no lo diseñó uno: hay que entenderlo de verdad"]
      - ["Midiendo", "Las discrepancias anotadas son el aprendizaje"]
      - ["Leyendo hojas de datos", "Completas, incluidas las erratas"]
      - ["Documentando", "El trabajo de hace dos años sigue sirviendo"]
    exito: "Montar obliga a decidir; reparar obliga a entender."
    pistas:
      - { texto: "Reparar obliga a entender un circuito ajeno." }
    escalera:
      - "Cada verbo tiene su ganancia: decidir, entender, aprender de lo que no cuadra, conocer las piezas y no perder lo hecho."
    solucion: "Construir: decidir. Reparar: entender. Medir: discrepancias. Hojas: erratas. Documentar: que siga sirviendo."

  - id: porque-oficio
    tipo: porque
    titulo: "Una nota sobre el oficio"
    texto: "La electrónica es exigente y satisfactoria a partes iguales. ¿Por qué, según el libro?"
    libro: [506, 507, 508]
    widget:
      tipo: figura
      figura: fig-54.16
      zonas:
        - { id: seguir, rotulo: "En el centro", rect: [8, 78, 438, 66] }
    opciones:
      - texto: "Se puede comprobar: funciona o no, y cada fallo enseña algo"
        bien: true
        porque: "Y casi todo se puede reparar: un aparato averiado es un problema con solución."
      - texto: "Porque es fácil"
        porque: "No admite interpretación: eso la hace exigente, no fácil."
      - texto: "Porque todo está en los manuales"
        porque: "Lo que la hace satisfactoria es que cada resultado tiene una razón concreta."
    escalera:
      - "¿Admite un circuito que funciona a medias una opinión?"
    solucion: "Porque se puede comprobar: cada éxito tiene una razón y cada fallo, algo que aprender."

  - id: prediga-ultimo
    tipo: predecir
    titulo: "El último ejercicio"
    texto: "Coger un aparato averiado, entenderlo y arreglarlo. ¿Qué virtud tiene que ningún proyecto propio da?"
    libro: [511, 512]
    widget:
      tipo: figura
      figura: fig-54.16
      zonas:
        - { id: ejercicio, rotulo: "Abajo", rect: [8, 150, 438, 38] }
    opciones:
      - texto: "El circuito no lo diseñó uno"
        bien: true
        porque: "Reúne todo: leer o deducir el esquema, medir con criterio, formar hipótesis y comprobarlas. Si sale bien, el libro ha cumplido su función."
      - texto: "Que es más barato"
        porque: "La virtud es de aprendizaje, no de coste."
      - texto: "Que no hace falta medir"
        porque: "Hace falta medir con criterio más que nunca."
    escalera:
      - "¿Qué diferencia hay entre arreglar lo propio y arreglar lo ajeno?"
    solucion: "Que el circuito no lo diseñó uno: hay que entenderlo de verdad."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [487, 489, 500, 511]
    ideas:
      - { titulo: "El mecanismo.", texto: "Sirve para lo imprevisto, que es la mayoría." }
      - { titulo: "La física.", texto: "La teoría dice qué hacer; la física dice si se puede." }
      - { titulo: "Seguir.", texto: "Construyendo, reparando, midiendo, leyendo y documentando." }
      - { titulo: "El último ejercicio.", texto: "Un aparato averiado: entenderlo y arreglarlo." }
