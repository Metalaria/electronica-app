# Lección 1.2 de la sección 56.3 «Levantar el Esquema: el Método Completo» (cap54; etiquetas sec-54.N = impresas 56.N).
# - Lo que hace falta (bloques 84 a 87) y los seis pasos (89 a 119; figura 56.4, fig-54.4): preparar, alimentaciones,
#   bloques, continuidad nodo a nodo, dibujar mientras se mide y comprobar lo dibujado.
# - Las dos advertencias (109, 110) y los componentes en paralelo (121, 122). El ejercicio del banco (124, 125).
# Sección sin cálculos: sin modelo (aviso de secuencia «sin tarjeta de fórmula»).
# Pasos prácticos: «ordenar» los seis pasos y el procedimiento de continuidad, y «tocar» en la figura el error del diodo
# que hace pitar al multímetro.
leccion: cap54/sec-54.3

libro:
  82: "Con método, una placa de una o dos capas con cincuenta componentes lleva una tarde"
  87: "Lo que no se anota se repite."
  90: "Voltear la imagen de la cara inferior en horizontal, para que las posiciones coincidan con las de la superior. Sin esto, todo lo demás se hace mal."
  93: "son los nodos con más conexiones y porque estructuran todo lo demás"
  96: "lo que queda sin marcar son las señales, y suelen ser muchas menos de las que parecía"
  104: "porque los diseñadores agrupan por función"
  107: "Anotar el nodo, no la conexión"
  109: "Medir siempre sin alimentación, y con los condensadores descargados"
  110: "si en un sentido conduce y en el otro no, hay un semiconductor por medio"
  113: "cuando aparece un operacional con una resistencia de la salida a la entrada inversora, ya se sabe qué buscar en el resto de sus pines, y se comprueba en lugar de explorar"
  114: "Dibujar por función, no por posición."
  117: "Un pin olvidado es un error, no una casualidad."
  118: "Un divisor que da una tensión imposible, una realimentación con ganancia absurda o un filtro con frecuencia de corte fuera de lugar indican una lectura equivocada"
  119: "Si no funciona sobre el papel, el error está en el papel."
  122: "si el multímetro marca unos ohmios en lugar de cero, hay una resistencia de valor bajo en medio que hay que dibujar"
  124: "levantar el esquema del bloque de alimentación, que es siempre el más asequible y el más útil"
  125: "Con eso ya se puede diagnosticar la mitad de las averías del aparato"
  126: "Los seis pasos del método y los dos errores sistemáticos."

modelo: { valores: {}, calculos: {} }

tarjetas:
  - id: explore-metodo
    tipo: explorar
    titulo: "Mecánico y ordenado"
    texto: "Con método, una placa de dos capas y cincuenta componentes lleva una tarde. Toque el segundo paso y los errores."
    libro: [82, 126]
    widget:
      tipo: figura
      figura: fig-54.4
      zonas:
        - { id: p1, rotulo: "El primer paso", rect: [3, 3, 205, 36], texto: "Preparar: numerar sobre la foto, voltear la cara inferior y superponerlas." }
        - { id: p2, rotulo: "El segundo paso", rect: [3, 39, 205, 36], texto: "Alimentaciones, lo primero: son los nodos con más conexiones." }
        - { id: p3, rotulo: "El tercer paso", rect: [3, 75, 205, 36], texto: "Bloques funcionales: entrada, conversión, procesamiento, interfaz y potencia." }
        - { id: p4, rotulo: "El cuarto paso", rect: [3, 111, 205, 36], texto: "Continuidad nodo a nodo: anotar el nodo y tachar lo resuelto." }
        - { id: p5, rotulo: "El quinto paso", rect: [3, 147, 205, 36], texto: "Dibujar mientras se mide: el sentido del esquema guía la medida." }
        - { id: p6, rotulo: "El sexto paso", rect: [3, 183, 205, 36], texto: "Comprobar: cada pin conectado, valores coherentes y un circuito que funcione." }
        - { id: errores, rotulo: "Arriba a la derecha", rect: [222, 5, 225, 96], texto: "Los dos errores sistemáticos: medir alimentado y tomar una unión por una pista." }
    requiere: { mover: [p2, errores] }

  - id: ordene-pasos
    tipo: pregunta
    titulo: "Los seis pasos"
    texto: "Ordene los pasos para levantar el esquema."
    libro: [90, 93, 104, 107, 113, 117]
    widget:
      tipo: figura
      figura: fig-54.4
      zonas:
        - { id: consejo, rotulo: "Abajo a la derecha", rect: [222, 108, 225, 112] }
    ordenar:
      - "Preparar las fotos y numerar"
      - "Trazar masa y alimentaciones"
      - "Dividir en bloques funcionales"
      - "Continuidad, nodo a nodo"
      - "Dibujar mientras se mide"
      - "Comprobar lo dibujado"
    exito: "Es un trabajo mecánico y ordenado, no un ejercicio de intuición."
    pistas:
      - { texto: "Antes que ninguna señal, las alimentaciones." }
    escalera:
      - "De lo que estructura (fotos, alimentaciones, bloques) a lo fino (nodos), y comprobar al final."
    solucion: "Preparar, alimentaciones, bloques, continuidad, dibujar y comprobar."

  - id: prediga-voltear
    tipo: predecir
    titulo: "La cara de abajo"
    texto: "Tiene fotos de las dos caras. ¿Qué hay que hacer con la de la cara inferior antes de empezar?"
    libro: [90]
    widget:
      tipo: figura
      figura: fig-54.4
      zonas:
        - { id: p1, rotulo: "El primer paso", rect: [3, 3, 205, 36] }
    opciones:
      - texto: "Voltearla en horizontal, para que las posiciones coincidan con la superior"
        bien: true
        porque: "Sin esto, todo lo demás se hace mal; luego se superponen con transparencia."
      - texto: "Girarla un cuarto de vuelta"
        porque: "Vista desde abajo la placa está en espejo: hay que voltearla, no girarla."
      - texto: "Nada: se trabaja con cada una por separado"
        porque: "Superponerlas es lo que convierte una placa de dos caras en algo legible."
    escalera:
      - "Al dar la vuelta a una placa, ¿qué lado queda donde estaba el otro?"
    solucion: "Voltearla en horizontal."

  - id: porque-alimentaciones
    tipo: porque
    titulo: "Las alimentaciones, lo primero"
    texto: "Antes que ninguna señal se trazan la masa y las alimentaciones. ¿Por qué?"
    libro: [93, 96]
    widget:
      tipo: figura
      figura: fig-54.4
      zonas:
        - { id: p2, rotulo: "El segundo paso", rect: [3, 39, 205, 36] }
    opciones:
      - texto: "Son los nodos con más conexiones y estructuran todo lo demás"
        bien: true
        porque: "Al terminar, lo que queda sin marcar son las señales, y suelen ser muchas menos de las que parecía."
      - texto: "Porque son las que antes se averían"
        porque: "Aquí no se busca una avería: se ordena el trabajo."
      - texto: "Porque son las más fáciles de dibujar"
        porque: "Lo que importa es cuántos pines resuelven de una vez."
    escalera:
      - "¿Qué nodo reúne más pines de toda la placa?"
    solucion: "Porque son los nodos más grandes y ordenan la placa."

  - id: ordene-continuidad
    tipo: pregunta
    titulo: "Continuidad, nodo a nodo"
    texto: "Es el trabajo grueso. Ordene el procedimiento."
    libro: [107, 87]
    widget:
      tipo: figura
      figura: fig-54.4
      zonas:
        - { id: p4, rotulo: "El cuarto paso", rect: [3, 111, 205, 36] }
    ordenar:
      - "Elegir un componente y un pin"
      - "Con una punta fija, tocar los pines cercanos hasta que pite"
      - "Anotar el nodo, no la conexión"
      - "Tachar en la fotografía lo ya resuelto"
    exito: "Cada punto eléctrico común recibe un número. Lo que no se anota se repite."
    pistas:
      - { texto: "Lo que se anota es el nodo: todos los pines que dan continuidad con él." }
    escalera:
      - "Punto de partida, búsqueda, anotación y marca."
    solucion: "Elegir, buscar con la punta, anotar el nodo y tachar."

  - id: toque-union
    tipo: tocar
    titulo: "Un pitido sospechoso"
    texto: "El multímetro pita entre dos pines, pero al invertir las puntas ya no. Toque el error que está a punto de cometer."
    libro: [109, 110]
    widget:
      tipo: figura
      figura: fig-54.4
      zonas:
        - { id: alimentada, rotulo: "Arriba a la derecha, el primero", rect: [222, 20, 225, 38] }
        - { id: union, rotulo: "Arriba a la derecha, el segundo", rect: [222, 60, 225, 38] }
        - { id: consejo, rotulo: "Abajo a la derecha", rect: [222, 108, 225, 112] }
    tocar:
      bien: [union]
      porque:
        alimentada: "Ese error es medir con la placa alimentada; aquí lo delata el sentido."
        consejo: "Dibujar mientras se mide ayuda, pero no explica un pitido en un solo sentido."
    exito: "Tomar una unión por una pista: si conduce en un sentido y no en el otro, hay un semiconductor por medio."
    escalera:
      - "¿Qué componente conduce en un sentido y no en el otro?"
    solucion: "El segundo error: un diodo en directa puede hacer pitar."

  - id: prediga-ohmios
    tipo: predecir
    titulo: "Unos ohmios en lugar de cero"
    texto: "Entre dos pines que dan continuidad, el multímetro marca unos ohmios en lugar de cero. ¿Qué hay entre ellos?"
    libro: [122]
    widget:
      tipo: figura
      figura: fig-54.4
      zonas:
        - { id: p4, rotulo: "El cuarto paso", rect: [3, 111, 205, 36] }
    opciones:
      - texto: "Una resistencia de valor bajo, que hay que dibujar"
        bien: true
        porque: "Por eso se mide la resistencia y no solo la continuidad."
      - texto: "Una ferrita o un fusible"
        porque: "Esos miden casi lo mismo que una pista: solo se descubren mirando qué hay entre las almohadillas."
      - texto: "Una pista larga"
        porque: "Una pista mide décimas de ohmio o menos, como las propias puntas."
    escalera:
      - "¿Qué mide unos ohmios y no casi cero?"
    solucion: "Una resistencia de valor bajo."

  - id: porque-dibujar
    tipo: porque
    titulo: "Dibujar mientras se mide"
    texto: "Es el consejo que más cambia el resultado: dibujar a la vez que se mide, aunque quede feo. ¿Por qué?"
    libro: [113, 114]
    widget:
      tipo: figura
      figura: fig-54.4
      zonas:
        - { id: consejo, rotulo: "Abajo a la derecha", rect: [222, 108, 225, 112] }
    opciones:
      - texto: "Porque el sentido del esquema guía la medida: se comprueba en lugar de explorar"
        bien: true
        porque: "Un operacional con una resistencia de salida a la inversora ya dice qué buscar en sus otros pines."
      - texto: "Para terminar antes el dibujo"
        porque: "Lo que se gana es medir mejor, no dibujar antes."
      - texto: "Para reproducir la disposición de la placa"
        porque: "Al revés: se dibuja por función, no por posición."
    escalera:
      - "¿Qué pasa cuando un trozo del esquema empieza a reconocerse?"
    solucion: "Porque al reconocer el circuito se sabe qué medir después."

  - id: empareje-comprobar
    tipo: pregunta
    titulo: "Comprobar lo dibujado"
    texto: "Tres comprobaciones detectan casi todos los errores. Empareje cada una con lo que delata."
    libro: [117, 118, 119]
    widget:
      tipo: figura
      figura: fig-54.4
      zonas:
        - { id: p6, rotulo: "El sexto paso", rect: [3, 183, 205, 36] }
    emparejar:
      - ["Un pin sin conectar ni marcado", "Un error, no una casualidad"]
      - ["Un divisor que da una tensión imposible", "Una lectura equivocada"]
      - ["Un circuito que no funciona sobre el papel", "El error está en el papel"]
    exito: "Recorrerlo mentalmente: la energía entra, se convierte y llega donde debe."
    pistas:
      - { texto: "Una ganancia absurda o un filtro fuera de lugar son valores incoherentes." }
    escalera:
      - "Pines, valores y funcionamiento."
    solucion: "Pin suelto: error. Valor imposible: lectura equivocada. No funciona: el papel."

  - id: porque-fuente
    tipo: porque
    titulo: "Por dónde empezar en el banco"
    texto: "Sobre el aparato elegido, el ejercicio empieza por levantar el esquema de su bloque de alimentación. ¿Por qué ese?"
    libro: [124, 125]
    widget:
      tipo: figura
      figura: fig-54.4
      zonas:
        - { id: p2, rotulo: "El segundo paso", rect: [3, 39, 205, 36] }
    opciones:
      - texto: "Es el más asequible y el más útil: ya diagnostica la mitad de las averías"
        bien: true
        porque: "Y se practica el método completo sobre una parte acotada."
      - texto: "Porque es el único que tiene esquema"
        porque: "No hay esquema de ninguno: por eso se levanta."
      - texto: "Porque es donde está el firmware"
        porque: "El firmware está en el procesador, no en la alimentación."
    escalera:
      - "¿Qué bloque tienen todos los aparatos y falla a menudo?"
    solucion: "Porque es el más asequible y el más útil para diagnosticar."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [93, 107, 110, 113]
    ideas:
      - { titulo: "Método.", texto: "Preparar, alimentaciones, bloques, continuidad, dibujar y comprobar." }
      - { titulo: "Nodos.", texto: "Anotar el nodo, no la conexión, y tachar lo resuelto." }
      - { titulo: "Dos errores.", texto: "Medir alimentado y tomar una unión por una pista." }
      - { titulo: "Dibujar midiendo.", texto: "Por función, y el sentido del esquema guía la medida." }
