# Lección 1.2 de la sección 56.8 «Firmware: Extracción, Análisis y sus Límites» (cap54; etiquetas sec-54.N = impresas
# 56.N).
# - Qué se busca (bloques 316 a 320), por dónde se extrae (322 a 325; figura 56.10, fig-54.10), la protección de lectura
#   (328 a 332), qué hacer con un volcado (335 a 339), los formatos (341 a 343), lo que no se puede hacer con el
#   resultado (345), la alternativa de un firmware propio (347, 348) y el banco (350 a 352). La cabecera EJTAG de la
#   figura 56.11 (foto img/foto_jtag.jpg; zonas en píxeles de la foto).
# Sección sin cálculos: sin modelo (aviso de secuencia «sin tarjeta de fórmula»).
# Pasos prácticos: «tocar» la cabecera de depuración en la foto, «tocar» en la figura la vía que no toca el equipo y
# «ordenar» qué hacer con un volcado.
leccion: cap54/sec-54.8

libro:
  313: "buena parte del comportamiento no está en el circuito: está en el programa"
  320: "Y solo el último exige análisis profundo. Los tres primeros se resuelven casi siempre buscando cadenas de texto y patrones."
  322: "Una memoria serie externa —una flash SPI junto al procesador— se lee con un programador de pinza o desoldándola"
  323: "El puerto de depuración del microcontrolador"
  325: "Si el fabricante distribuye ficheros de actualización, ahí está el firmware sin tocar el equipo, aunque puede venir cifrado o comprimido."
  329: "Intentar desactivarlo suele borrar la memoria, que es exactamente lo que la protección pretende."
  330: "No son de banco doméstico."
  332: "Reconocer pronto que el firmware está protegido evita perder semanas"
  335: "Si todo el fichero parece ruido uniforme, está cifrado o comprimido, y no hay nada que analizar hasta resolver eso."
  336: "Buscar cadenas de texto."
  337: "Identificar la arquitectura por los patrones de instrucciones y por los vectores de interrupción"
  338: "Localizar las tablas"
  339: "Buscar la dirección de carga."
  345: "Compartir el resultado del análisis —el formato de un protocolo, la ubicación de una calibración— es distinto de compartir el binario."
  348: "escribir un programa nuevo desde cero puede llevar menos tiempo que descifrar el ajeno"
  352: "Después, activar el bit de protección de lectura y volver a intentarlo. Esa segunda parte es la que enseña la frontera de la sección de forma que no se olvida."
  353: "Vías de extracción de firmware y la frontera de la protección de lectura."
  354: "Cabecera de depuración EJTAG (la fila doble de patillas de abajo"

modelo: { valores: {}, calculos: {} }

tarjetas:
  - id: explore-vias
    tipo: explorar
    titulo: "El programa como objeto de estudio"
    texto: "Buena parte del comportamiento está en el programa. Toque las vías de extracción y lo que se hace con el volcado."
    libro: [313, 322, 353]
    widget:
      tipo: figura
      figura: fig-54.10
      zonas:
        - { id: spi, rotulo: "Arriba a la izquierda", rect: [5, 5, 145, 46], texto: "Una flash SPI externa: con pinza o desoldándola. Lo más accesible." }
        - { id: depuracion, rotulo: "La segunda de la izquierda", rect: [5, 53, 145, 46], texto: "El puerto de depuración: si está habilitado, lee la memoria interna." }
        - { id: arranque, rotulo: "La tercera de la izquierda", rect: [5, 102, 145, 46], texto: "El cargador de arranque, si quedó activo un modo de actualización." }
        - { id: actualizaciones, rotulo: "La cuarta de la izquierda", rect: [5, 150, 145, 46], texto: "Las actualizaciones publicadas: sin tocar el equipo." }
        - { id: volcado, rotulo: "A la derecha", rect: [275, 5, 170, 187], texto: "Qué hacer con un volcado: entropía, cadenas, arquitectura, tablas y dirección de carga." }
        - { id: protegido, rotulo: "Abajo a la izquierda", rect: [5, 200, 220, 57], texto: "Protegido: no se lee con medios normales; intentarlo suele borrar la memoria." }
    requiere: { mover: [depuracion, volcado] }

  - id: prediga-esfuerzo
    tipo: predecir
    titulo: "Qué se busca"
    texto: "Una copia de seguridad, una calibración, un protocolo o rehacer el firmware entero. ¿Cuál exige análisis profundo?"
    libro: [320]
    widget:
      tipo: figura
      figura: fig-54.10
      zonas:
        - { id: volcado, rotulo: "A la derecha", rect: [275, 5, 170, 187] }
    opciones:
      - texto: "Rehacer el firmware de un equipo abandonado"
        bien: true
        porque: "Los otros tres se resuelven casi siempre buscando cadenas de texto y patrones."
      - texto: "La copia de seguridad"
        porque: "Es el caso más común y el más simple: basta leerlo."
      - texto: "Averiguar una calibración"
        porque: "Las tablas de calibración tienen estructura reconocible: no exige entenderlo todo."
    escalera:
      - "¿En cuál hay que entender todo el programa?"
    solucion: "Rehacer el firmware: solo ese exige análisis profundo."

  - id: toque-ejtag
    tipo: tocar
    titulo: "El puerto de depuración"
    texto: "En la placa de un cortafuegos de red, una cabecera de patillas no se conecta a nada en el uso normal. Tóquela."
    libro: [354, 323]
    widget:
      tipo: figura
      figura: fig-54.11
      zonas:
        - { id: cabecera, rotulo: "Abajo en el centro", rect: [120, 395, 350, 145] }
        - { id: integrado, rotulo: "El integrado del centro", rect: [195, 215, 140, 140] }
        - { id: condensador, rotulo: "Arriba a la derecha", rect: [430, 110, 215, 170] }
        - { id: disipador, rotulo: "Arriba a la izquierda", rect: [0, 0, 145, 215] }
    tocar:
      bien: [cabecera]
      porque:
        integrado: "Es un integrado de la placa; el puerto es una fila de patillas libres."
        condensador: "Es un condensador electrolítico."
        disipador: "Es un disipador."
    exito: "La cabecera EJTAG: dos filas de patillas. Si el puerto está habilitado, se lee la memoria interna."
    escalera:
      - "Busque una fila doble de patillas sin nada pinchado."
    solucion: "Abajo en el centro: la cabecera EJTAG1."

  - id: toque-actualizacion
    tipo: tocar
    titulo: "Sin tocar el equipo"
    texto: "El fabricante distribuye ficheros de actualización en su web. Toque la vía de extracción que eso abre."
    libro: [325]
    widget:
      tipo: figura
      figura: fig-54.10
      zonas:
        - { id: spi, rotulo: "Arriba a la izquierda", rect: [5, 5, 145, 46] }
        - { id: depuracion, rotulo: "La segunda de la izquierda", rect: [5, 53, 145, 46] }
        - { id: arranque, rotulo: "La tercera de la izquierda", rect: [5, 102, 145, 46] }
        - { id: actualizaciones, rotulo: "La cuarta de la izquierda", rect: [5, 150, 145, 46] }
    tocar:
      bien: [actualizaciones]
      porque:
        spi: "Leer la flash exige una pinza o desoldarla: se toca el equipo."
        depuracion: "El puerto de depuración está en la placa."
        arranque: "El cargador de arranque se usa en el propio equipo."
    exito: "El firmware sin tocar el equipo, aunque puede venir cifrado o comprimido."
    escalera:
      - "¿Cuál de las cuatro se descarga de internet?"
    solucion: "La cuarta: las actualizaciones publicadas."

  - id: prediga-proteccion
    tipo: predecir
    titulo: "El bit de protección"
    texto: "El fabricante activó la protección de lectura del microcontrolador. ¿Qué pasa si intenta desactivarla?"
    libro: [329, 330, 332]
    widget:
      tipo: figura
      figura: fig-54.10
      zonas:
        - { id: protegido, rotulo: "Abajo a la izquierda", rect: [5, 200, 220, 57] }
    opciones:
      - texto: "Suele borrarse la memoria: es lo que pretende la protección"
        bien: true
        porque: "Lo demás es de laboratorio. Reconocerlo pronto evita semanas y lleva al análisis de comportamiento."
      - texto: "Se lee normalmente"
        porque: "No se lee con medios normales. Punto."
      - texto: "Se lee con un programador de pinza"
        porque: "La pinza sirve para una flash externa; la protección es de la memoria interna."
    escalera:
      - "¿Para qué existe ese bit?"
    solucion: "Suele borrar la memoria: no se lee con medios normales."

  - id: ordene-volcado
    tipo: pregunta
    titulo: "Qué hacer con un volcado"
    texto: "Tiene el fichero. Ordene el análisis."
    libro: [335, 336, 337, 338, 339]
    widget:
      tipo: figura
      figura: fig-54.10
      zonas:
        - { id: alternativa, rotulo: "Abajo a la derecha", rect: [232, 200, 213, 57] }
    ordenar:
      - "Mirar su entropía"
      - "Buscar cadenas de texto"
      - "Identificar la arquitectura por los vectores"
      - "Localizar las tablas"
      - "Deducir la dirección de carga"
    exito: "Las cadenas son lo más rentable con diferencia: a menudo revelan la estructura en minutos."
    pistas:
      - { texto: "Si todo parece ruido, no hay nada que analizar: eso va primero." }
    escalera:
      - "Primero, si se puede leer; después, lo barato; al final, lo que hace cuadrar las referencias."
    solucion: "Entropía, cadenas, arquitectura, tablas y dirección de carga."

  - id: prediga-entropia
    tipo: predecir
    titulo: "Un volcado que parece ruido"
    texto: "Todo el fichero parece ruido uniforme, sin zonas de código, de datos ni vacías. ¿Qué indica?"
    libro: [335]
    widget:
      tipo: figura
      figura: fig-54.10
      zonas:
        - { id: volcado, rotulo: "A la derecha", rect: [275, 5, 170, 187] }
    opciones:
      - texto: "Está cifrado o comprimido"
        bien: true
        porque: "No hay nada que analizar hasta resolver eso."
      - texto: "Es código muy optimizado"
        porque: "El código tiene estructura visible, por optimizado que esté."
      - texto: "La memoria estaba vacía"
        porque: "Una memoria vacía es uniforme, pero no ruido: todo el mismo valor."
    escalera:
      - "¿Qué deja un fichero sin ninguna estructura visible?"
    solucion: "Cifrado o comprimido."

  - id: porque-compartir
    tipo: porque
    titulo: "Lo que se puede compartir"
    texto: "Analizó el firmware para interoperar. ¿Por qué puede publicar el formato del protocolo y no el binario?"
    libro: [345]
    widget:
      tipo: figura
      figura: fig-54.10
      zonas:
        - { id: volcado, rotulo: "A la derecha", rect: [275, 5, 170, 187] }
    opciones:
      - texto: "El firmware es una obra protegida; el resultado del análisis es conocimiento"
        bien: true
        porque: "Analizarlo para interoperar o reparar tiene amparo; redistribuirlo, no."
      - texto: "Porque el binario ocupa demasiado"
        porque: "No es cuestión de tamaño: es de derechos."
      - texto: "Puede publicar los dos"
        porque: "Publicar o redistribuir el binario no tiene amparo."
    escalera:
      - "¿Qué es del fabricante y qué es suyo?"
    solucion: "Porque el binario es obra protegida y el formato es conocimiento derivado del análisis."

  - id: porque-propio
    tipo: porque
    titulo: "Escribir uno nuevo"
    texto: "El equipo tiene un microcontrolador conocido y el hardware ya está documentado. ¿Por qué puede ser mejor escribir un firmware propio?"
    libro: [348]
    widget:
      tipo: figura
      figura: fig-54.10
      zonas:
        - { id: alternativa, rotulo: "Abajo a la derecha", rect: [232, 200, 213, 57] }
    opciones:
      - texto: "Puede llevar menos tiempo que descifrar el ajeno"
        bien: true
        porque: "Es lo que hacen muchos proyectos de recuperación de equipos abandonados."
      - texto: "Porque el ajeno siempre está cifrado"
        porque: "No siempre; pero aun legible, entenderlo entero puede costar más que reescribirlo."
      - texto: "Porque así se puede vender el equipo"
        porque: "La razón es de esfuerzo técnico."
    escalera:
      - "¿Qué cuesta más: escribir lo que se sabe que hace falta, o descifrar lo que otro escribió?"
    solucion: "Porque escribirlo de nuevo puede costar menos que descifrar el existente."

  - id: porque-banco
    tipo: porque
    titulo: "Proteger su propio montaje"
    texto: "En el banco se vuelca el firmware de un montaje propio, y después se activa su protección de lectura y se vuelve a intentar. ¿Para qué?"
    libro: [352]
    widget:
      tipo: figura
      figura: fig-54.10
      zonas:
        - { id: protegido, rotulo: "Abajo a la izquierda", rect: [5, 200, 220, 57] }
    opciones:
      - texto: "Para ver la frontera de la protección de forma que no se olvide"
        bien: true
        porque: "Con el programa conocido, cada hallazgo se verifica; y con la protección, ya no se lee."
      - texto: "Para comprobar que la protección no funciona"
        porque: "Funciona: eso es lo que se aprende."
      - texto: "Para hacer una copia de seguridad"
        porque: "La copia se hace antes; lo segundo es el experimento."
    escalera:
      - "¿Qué pasa al intentar leerlo de nuevo?"
    solucion: "Para comprobar en primera persona que con la protección ya no se lee."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [320, 329, 336, 345]
    ideas:
      - { titulo: "El objetivo.", texto: "Solo rehacer el firmware exige análisis profundo." }
      - { titulo: "Extraer.", texto: "Flash externa, depuración, cargador o actualizaciones." }
      - { titulo: "La frontera.", texto: "Con la protección activada no se lee; insistir la borra." }
      - { titulo: "El volcado.", texto: "Entropía, cadenas, arquitectura, tablas y dirección de carga." }
