# Lección 1.2 de la sección 56.5 «Análisis Funcional sin Esquema: Estímulo y Respuesta» (cap54; etiquetas sec-54.N =
# impresas 56.N).
# - El principio (bloque 168), los cinco pasos (171 a 210; figura 56.6, fig-54.6): mapa de conectores, estado de reposo,
#   estímulo y respuesta, seguir la señal y caracterizar los bloques; las precauciones (212 a 215) y el banco (217 a 219).
# - El ajuste caracteriza un bloque sin abrirlo: «barrer la frecuencia y ver dónde cae» (bloque 207) sobre una caja
#   negra que es el esquema filtro-rc con el dibujo oculto (R = 1 kΩ y C = 159 nF, de ejemplo y rotulados: un paso bajo
#   de 1 kHz). La medida es la ganancia en dB, comprobada con ngspice en alterna; la banda, de −3,3 a −2,7 dB.
# Pasos prácticos: «ordenar» los pasos, «ajuste» del ancho de banda de una caja negra y «tocar» en la figura la forma de
# onda de un control de brillo.
leccion: cap54/sec-54.5

libro:
  165: "en lugar de reconstruir el circuito, averiguar qué hace aplicando estímulos y observando respuestas"
  166: "también cuando lo es, porque valida lo dibujado"
  168: "Si se controla lo que entra y se observa lo que sale, se puede construir un modelo de su comportamiento sin abrir la caja."
  178: "medir la tensión continua en todos los pines accesibles y anotarla"
  180: "Los pines a 0 V o a la alimentación son masa, alimentación o salidas en reposo."
  181: "Los pines a la mitad de la alimentación suelen ser entradas analógicas polarizadas o nodos de un divisor."
  182: "Los pines a una tensión intermedia estable con una resistencia hacia la alimentación son entradas con pull-up."
  183: "Los pines que fluctúan llevan señal."
  186: "Cambiar una sola cosa cada vez."
  189: "cada correspondencia hallada es una entrada del esquema funcional, aunque no se sepa por dónde va la pista"
  193: "O desde la salida hacia atrás, que a menudo es más rápido porque las salidas son accesibles."
  198: "Una cuadrada de ciclo variable es PWM: control de potencia, de brillo o de posición."
  206: "Ganancia: aplicar una señal conocida y medir la salida."
  207: "Ancho de banda: barrer la frecuencia y ver dónde cae."
  210: "Esos cuatro números describen un bloque analógico lo bastante bien como para reproducirlo"
  212: "Antes de aplicar nada a un pin, comprobar que es entrada: si al forzarlo la corriente crece, es salida y se está peleando con ella."
  215: "Documentar antes de desmontar"
  219: "comparándolo con el esquema de la sección 56.3, cada uno valida al otro"
  220: "El método de estímulo y respuesta, y lo que revela cada forma de onda."

modelo:
  valores:
    V_p: { sim: "V_{p}", nombre: "amplitud del estímulo", unidad: V, valor: 1 }
    f_f: { sim: "f", nombre: "frecuencia del estímulo", unidad: Hz, valor: 100 }
    R_f: { sim: "R", nombre: "resistencia de la caja", unidad: Ω, valor: 1000 }
    C_f: { sim: "C", nombre: "capacidad de la caja", unidad: F, valor: 159.15e-9 }
  calculos:
    x_c: { expr: "2*pi*f_f*R_f*C_f", sim: "ωRC", nombre: "frecuencia normalizada", unidad: "" }
    A_c: { expr: "V_p/sqrt(1 + x_c^2)", sim: "V_{salida}", nombre: "amplitud de la salida", unidad: V }
    G_db: { expr: "-10*log10(1 + x_c^2)", sim: "G", nombre: "ganancia de la caja", unidad: dB }
    f_c: { expr: "1/(2*pi*R_f*C_f)", sim: "f_{c}", nombre: "frecuencia de corte", unidad: Hz }

tarjetas:
  - id: explore-caja
    tipo: explorar
    titulo: "Una caja con entradas y salidas"
    texto: "Si se controla lo que entra y se observa lo que sale, se construye un modelo sin abrir la caja. Toque la caja y una forma de onda."
    libro: [165, 168, 220]
    widget:
      tipo: figura
      figura: fig-54.6
      zonas:
        - { id: caja, rotulo: "Arriba en el centro", rect: [175, 18, 103, 80], texto: "El sistema desconocido: estímulos a la izquierda, respuestas a la derecha." }
        - { id: cuadrada, rotulo: "La primera de la tercera fila", rect: [4, 143, 108, 76], texto: "Cuadrada fija: un reloj, y su frecuencia sugiere para qué sirve." }
        - { id: rafagas, rotulo: "La tercera de la tercera fila", rect: [229, 143, 108, 76], texto: "Ráfagas y silencios: comunicación en serie." }
        - { id: senoide, rotulo: "La primera de abajo", rect: [60, 224, 108, 76], texto: "Senoide: un oscilador o una señal analógica." }
        - { id: nada, rotulo: "La tercera de abajo", rect: [285, 224, 108, 76], texto: "Nada: una entrada, una línea muerta o algo demasiado rápido para el instrumento." }
    requiere: { mover: [caja] }

  - id: ordene-pasos
    tipo: pregunta
    titulo: "Los cinco pasos"
    texto: "Ordene el análisis funcional."
    libro: [178, 186, 193, 207, 215]
    widget:
      tipo: figura
      figura: fig-54.6
      zonas:
        - { id: caja, rotulo: "Arriba en el centro", rect: [175, 18, 103, 80] }
    ordenar:
      - "Hacer el mapa de conectores"
      - "Medir el estado de reposo"
      - "Estímulo y respuesta, una cosa cada vez"
      - "Seguir la señal por un camino"
      - "Caracterizar los bloques"
    exito: "Y antes de desmontar nada, fotografiar conectores y cables: el estado original es información."
    pistas:
      - { texto: "El estado de reposo es la referencia de todo lo demás: va antes de estimular." }
    escalera:
      - "Catalogar, medir quieto, estimular, seguir y, al final, poner números."
    solucion: "Conectores, reposo, estímulo y respuesta, seguir la señal y caracterizar."

  - id: empareje-reposo
    tipo: pregunta
    titulo: "El estado de reposo"
    texto: "Alimentado y sin hacer nada, la tensión de cada pin ya dice mucho. Empareje cada lectura con lo que suele ser."
    libro: [180, 181, 182, 183]
    widget:
      tipo: figura
      figura: fig-54.6
      zonas:
        - { id: caja, rotulo: "Arriba en el centro", rect: [175, 18, 103, 80] }
    emparejar:
      - ["0 V o la alimentación", "Masa, alimentación o una salida en reposo"]
      - ["La mitad de la alimentación", "Entrada analógica polarizada o nodo de un divisor"]
      - ["Intermedia estable, con una resistencia a la alimentación", "Entrada con pull-up"]
      - ["Fluctúa", "Lleva señal"]
    exito: "Ese conjunto de números es la referencia contra la que se compara todo lo demás."
    pistas:
      - { texto: "Un divisor deja su nodo entre los dos extremos." }
    escalera:
      - "Piense en qué fija la tensión de cada pin: una fuente, un divisor, una resistencia o una señal."
    solucion: "Extremos: masa, alimentación o salida. Mitad: polarizada o divisor. Con resistencia: pull-up. Fluctúa: señal."

  - id: porque-una
    tipo: porque
    titulo: "Una sola cosa cada vez"
    texto: "Pulsar un botón, tapar un sensor, conectar una carga: el método pide cambiar una sola cosa cada vez. ¿Por qué?"
    libro: [186, 189]
    widget:
      tipo: figura
      figura: fig-54.6
      zonas:
        - { id: caja, rotulo: "Arriba en el centro", rect: [175, 18, 103, 80] }
    opciones:
      - texto: "Para saber a qué estímulo responde cada pin"
        bien: true
        porque: "Cada correspondencia es una entrada del esquema funcional, aunque no se sepa por dónde va la pista."
      - texto: "Para no estropear el equipo"
        porque: "Hay precauciones para eso; esta regla es para poder atribuir cada respuesta."
      - texto: "Porque el analizador tiene pocos canales"
        porque: "Con varios canales a la vez se observa mejor, pero dos estímulos juntos no se distinguen."
    escalera:
      - "Si cambian dos cosas y responde un pin, ¿a cuál de las dos responde?"
    solucion: "Para atribuir cada respuesta a su estímulo."

  - id: toque-brillo
    tipo: tocar
    titulo: "El brillo de un LED"
    texto: "Mide el pin que controla el brillo de un indicador. Toque la forma de onda que espera ver."
    libro: [198, 220]
    widget:
      tipo: figura
      figura: fig-54.6
      zonas:
        - { id: cuadrada, rotulo: "Tercera fila, la primera", rect: [4, 143, 108, 76] }
        - { id: ciclo, rotulo: "Tercera fila, la segunda", rect: [117, 143, 108, 76] }
        - { id: rafagas, rotulo: "Tercera fila, la tercera", rect: [229, 143, 108, 76] }
        - { id: rampa, rotulo: "Tercera fila, la cuarta", rect: [342, 143, 108, 76] }
        - { id: senoide, rotulo: "Abajo, la primera", rect: [60, 224, 108, 76] }
    tocar:
      bien: [ciclo]
      porque:
        cuadrada: "Una cuadrada de frecuencia y ciclo fijos es un reloj: no gradúa nada."
        rafagas: "Las ráfagas son comunicación en serie."
        rampa: "Una rampa es un integrador, un barrido o un convertidor."
        senoide: "Una senoide es un oscilador o una señal analógica."
    exito: "PWM: el ciclo de trabajo gradúa la potencia, el brillo o la posición."
    escalera:
      - "¿Qué cambia en la señal cuando se sube el brillo?"
    solucion: "La cuadrada de ciclo variable: PWM."

  - id: ajuste-banda
    tipo: ajuste
    titulo: "Caracterizar sin abrir"
    texto: "Una caja negra recibe una senoide. Barra la frecuencia hasta que la salida caiga 3 dB: ahí acaba su ancho de banda."
    nota: "La caja es de ejemplo."
    libro: [207, 206, 210]
    inicio: { f_f: 100 }
    widget:
      tipo: circuito
      esquema: filtro-rc
      piezas: { fuente: V_p, f: f_f, r: R_f, c: C_f }
      dibujo: false
      mide: { vc_db: G_db }
      grafica:
        x: { id: nu, min: 10, max: 100000, unidad: Hz, rotulo: "f", escala: log }
        y: { min: -30, max: 3, unidad: dB, rotulo: "G" }
        curvas:
          - { expr: "-10*log10(1 + (2*pi*nu*R_f*C_f)^2)", color: azul, rotulo: "ganancia medida", mide: vc_db }
        marcas:
          - { x: "f_f", y: "G_db", rotulo: "{{G_db}}" }
      mandos:
        - { valor: f_f, min: 100, max: 5000, paso: 50, rotulo: "Frecuencia del estímulo" }
    ajuste:
      valor: G_db
      min: -3.3
      max: -2.7
      rotulo: "Ganancia de la caja"
      bajo: "Ha caído más de 3 dB: baje la frecuencia."
      alto: "Aún no ha caído 3 dB: suba la frecuencia."
      dentro: "Ahí cae 3 dB: el ancho de banda de la caja, medido sin saber qué lleva dentro."
    comprobar:
      - { con: { f_f: 1000 }, G_db: -3.01, f_c: 1000, tol: 0.003 }

  - id: prediga-salida
    tipo: predecir
    titulo: "Antes de inyectar"
    texto: "Aplica una señal a un pin desconocido a través de una resistencia en serie, y al forzarlo la corriente crece. ¿Qué es el pin?"
    libro: [212]
    widget:
      tipo: figura
      figura: fig-54.6
      zonas:
        - { id: caja, rotulo: "Arriba en el centro", rect: [175, 18, 103, 80] }
    opciones:
      - texto: "Una salida, y se está peleando con ella"
        bien: true
        porque: "Antes de aplicar nada a un pin, hay que comprobar que es entrada."
      - texto: "Una entrada, que acepta la señal"
        porque: "Una entrada apenas toma corriente; si crece al forzarla, algo empuja en contra."
      - texto: "Masa"
        porque: "Masa estaría a 0 V en reposo; lo que delata es que alguien empuja el pin."
    escalera:
      - "¿Qué pin empuja en contra de quien intenta cambiar su tensión?"
    solucion: "Una salida: no se inyecta señal en ella."

  - id: porque-validar
    tipo: porque
    titulo: "Dos esquemas que se validan"
    texto: "En el banco se construye la tabla de estímulo y respuesta del aparato. ¿Para qué compararla con el esquema levantado por continuidad?"
    libro: [219, 166]
    widget:
      tipo: figura
      figura: fig-54.6
      zonas:
        - { id: caja, rotulo: "Arriba en el centro", rect: [175, 18, 103, 80] }
    opciones:
      - texto: "Porque cada uno valida al otro"
        bien: true
        porque: "Lo que depende de qué, por medida, frente a lo que está unido con qué: las discrepancias son errores."
      - texto: "Porque la tabla sustituye al esquema"
        porque: "Lo complementa: el esquema funcional dice qué depende de qué, no los componentes."
      - texto: "No hace falta: basta con uno"
        porque: "Basta para muchas cosas, pero compararlos detecta errores de los dos."
    escalera:
      - "Dos métodos distintos que llegan al mismo circuito: ¿qué pasa si no coinciden?"
    solucion: "Para validarse mutuamente."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [168, 178, 186, 207]
    ideas:
      - { titulo: "Caja negra.", texto: "Controlar lo que entra y observar lo que sale." }
      - { titulo: "Reposo.", texto: "La tensión de cada pin, anotada, es la referencia." }
      - { titulo: "Una cosa cada vez.", texto: "Cada respuesta, una entrada del esquema funcional." }
      - { titulo: "Caracterizar.", texto: "Ganancia, ancho de banda, umbrales y retardo, sin abrir nada." }
