# Lección 1.2 de la sección 56.9 «Trazado del Silicio: Leer el Circuito Dentro del Chip» (cap54; etiquetas sec-54.N =
# impresas 56.N).
# - El límite (bloque 358), el proceso en seis pasos y la verificación (360 a 366, 378 a 380; figura 56.12, fig-54.12),
#   las celdas repetidas (368 a 370), cómo se reconocen los elementos (372 a 376), la alternativa razonable (383, 384) y
#   el banco (386 a 388). Las fotos del dado de la EPROM y del 6502 (figura 56.14, img/foto_eprom_dado.jpg; zonas en
#   píxeles de la foto, puestas por la descripción del pie: arriba la PLA, en el centro el control, abajo los datos).
# Sección sin cálculos: sin modelo (aviso de secuencia «sin tarjeta de fórmula»).
# Pasos prácticos: «ordenar» el proceso y «tocar» la PLA del 6502 y la ventana de la EPROM en la foto.
# Duda: las zonas del dado del 6502 son aproximadas (franjas de arriba, centro y abajo), según el pie de la figura.
leccion: cap54/sec-54.9

libro:
  357: "es la técnica más laboriosa de este capítulo"
  358: "esto funciona con silicio antiguo, de geometrías grandes y pocas capas de metal"
  360: "1. Decapado."
  361: "Exige campana de extracción, protección completa y formación."
  364: "el proceso es irreversible: un error significa empezar con otra unidad"
  366: "6. Reconstrucción."
  369: "El trabajo real no es reconocer un millón de transistores: es reconocer treinta celdas distintas y después localizarlas."
  370: "dada una plantilla de celda, la busca automáticamente en toda la imagen"
  372: "Los transistores son cruces entre polisilicio y difusión"
  373: "Las resistencias son tiras largas y estrechas"
  374: "Los condensadores son áreas amplias de dos capas superpuestas."
  375: "Las almohadillas de conexión están en el borde, y son el punto de entrada"
  376: "Las estructuras regulares y grandes son memoria; las irregulares, lógica."
  378: "Un esquema reconstruido a partir de fotografías contiene errores, siempre."
  379: "termina cuando la simulación del esquema reconstruido reproduce el comportamiento del chip real ante los mismos estímulos"
  383: "Solo cuando se necesita reproducir con exactitud de ciclo"
  384: "Los chips históricos de interés han sido fotografiados y publicados por proyectos de conservación"
  387: "Hay integrados en encapsulado con ventana —las memorias borrables por ultravioleta— cuyo silicio se ve directamente."
  388: "deja de ser una caja negra y pasa a ser un circuito muy pequeño"
  389: "El proceso de trazado del silicio y sus límites."
  391: "arriba, la PLA de decodificación, de estructura regular; en el centro, la lógica de control, irregular; abajo, el camino de datos, repetido bit a bit"

modelo: { valores: {}, calculos: {} }

tarjetas:
  - id: explore-proceso
    tipo: explorar
    titulo: "Mirar dentro"
    texto: "Cuando el integrado no se identifica y su comportamiento no basta, queda mirar dentro. Toque el decapado y lo que lo hace posible."
    libro: [357, 361, 389]
    widget:
      tipo: figura
      figura: fig-54.12
      zonas:
        - { id: decapado, rotulo: "El primer paso", rect: [3, 2, 250, 35], texto: "Decapado con ácido caliente: campana, protección y formación. Hay servicios que lo hacen." }
        - { id: capas, rotulo: "El cuarto paso", rect: [3, 104, 250, 35], texto: "Retirada de capas: metal, polisilicio, difundido. Irreversible." }
        - { id: verificacion, rotulo: "El último paso", rect: [3, 206, 250, 35], texto: "Verificación: simular el esquema y compararlo con el chip real." }
        - { id: celdas, rotulo: "Arriba a la derecha", rect: [262, 5, 183, 140], texto: "Celdas repetidas: identificada una, aparece cientos de veces." }
        - { id: limite, rotulo: "Abajo a la derecha", rect: [262, 152, 183, 112], texto: "El límite: solo silicio antiguo, de geometrías grandes y pocas capas." }
    requiere: { mover: [decapado, celdas] }

  - id: ordene-proceso
    tipo: pregunta
    titulo: "El proceso"
    texto: "Ordene el trazado del silicio."
    libro: [360, 364, 366, 379]
    widget:
      tipo: figura
      figura: fig-54.12
      zonas:
        - { id: limite, rotulo: "Abajo a la derecha", rect: [262, 152, 183, 112] }
    ordenar:
      - "Decapado"
      - "Limpieza"
      - "Fotografía por zonas"
      - "Retirada de capas"
      - "Alineación de las capas"
      - "Reconstrucción del esquema"
      - "Verificación por simulación"
    exito: "Cada capa se fotografía antes de quitar la siguiente: un error obliga a empezar con otra unidad."
    pistas:
      - { texto: "Sin limpiar no se fotografía bien; sin alinear, no se sabe qué conecta con qué." }
    escalera:
      - "Destapar, limpiar, fotografiar, pelar capas, alinear, dibujar y comprobar."
    solucion: "Decapado, limpieza, fotografía, capas, alineación, reconstrucción y verificación."

  - id: porque-celdas
    tipo: porque
    titulo: "Un millón de transistores"
    texto: "Un chip antiguo tiene miles de transistores. ¿Por qué trazarlo es laborioso pero no imposible?"
    libro: [369, 370]
    widget:
      tipo: figura
      figura: fig-54.12
      zonas:
        - { id: celdas, rotulo: "Arriba a la derecha", rect: [262, 5, 183, 140] }
    opciones:
      - texto: "Porque se diseña con celdas repetidas: se reconocen unas treinta y se localizan"
        bien: true
        porque: "Y hay software que, con una plantilla de celda, la busca en toda la imagen."
      - texto: "Porque cada transistor está rotulado en el silicio"
        porque: "No lo está: se reconocen por su geometría."
      - texto: "Porque el fabricante publica el esquema"
        porque: "Si lo publicara, no haría falta trazarlo."
    escalera:
      - "¿Cuántas formas distintas de NAND hay en un chip?"
    solucion: "Por las celdas repetidas: reconocer treinta y localizarlas."

  - id: empareje-elementos
    tipo: pregunta
    titulo: "Reconocer los elementos"
    texto: "Empareje cada elemento con su aspecto en el silicio."
    libro: [372, 373, 374, 375, 376]
    widget:
      tipo: figura
      figura: fig-54.13
      zonas:
        - { id: dado, rotulo: "El dado", rect: [100, 80, 1000, 740] }
    emparejar:
      - ["Transistor", "Cruce de polisilicio y difusión"]
      - ["Resistencia", "Tira larga y estrecha"]
      - ["Condensador", "Área amplia de dos capas superpuestas"]
      - ["Almohadillas de conexión", "En el borde: el punto de entrada"]
      - ["Memoria", "Estructura regular y grande"]
    exito: "Lo irregular es lógica. Identificar las almohadillas de alimentación y masa orienta todo lo demás."
    pistas:
      - { texto: "El polisilicio hace de puerta del transistor." }
    escalera:
      - "Piense en la forma: cruce, tira, superficie, borde o rejilla."
    solucion: "Transistor: cruce. Resistencia: tira. Condensador: área. Almohadillas: borde. Memoria: regular."

  - id: toque-pla
    tipo: tocar
    titulo: "El dado del 6502"
    texto: "En el dado del procesador del que deriva la CPU de la NES, toque la decodificación de estructura regular."
    libro: [391, 376]
    widget:
      tipo: figura
      figura: fig-54.14
      zonas:
        - { id: pla, rotulo: "El dado, la franja de arriba", rect: [1030, 10, 550, 190] }
        - { id: control, rotulo: "El dado, la franja del centro", rect: [1030, 210, 550, 200] }
        - { id: datos, rotulo: "El dado, la franja de abajo", rect: [1030, 420, 550, 220] }
        - { id: ventana, rotulo: "La foto de la izquierda", rect: [380, 220, 300, 230] }
    tocar:
      bien: [pla]
      porque:
        control: "En el centro está la lógica de control, irregular."
        datos: "Abajo va el camino de datos, repetido bit a bit."
        ventana: "Es la ventana de cuarzo de la EPROM, en la otra foto."
    exito: "La PLA de decodificación: estructura regular, como una memoria."
    escalera:
      - "Lo regular y grande suele ser memoria o decodificación."
    solucion: "La franja de arriba del dado: la PLA."

  - id: prediga-moderno
    tipo: predecir
    titulo: "Un integrado moderno"
    texto: "Quiere trazar el silicio de un microcontrolador actual. ¿Qué cabe esperar?"
    libro: [358]
    widget:
      tipo: figura
      figura: fig-54.12
      zonas:
        - { id: limite, rotulo: "Abajo a la derecha", rect: [262, 152, 183, 112] }
    opciones:
      - texto: "No es viable: miles a millones de veces más transistores y capas que tapan lo de debajo"
        bien: true
        porque: "La diferencia con el silicio antiguo no es de grado: es de viabilidad."
      - texto: "Lo mismo, con más fotos"
        porque: "Las capas superpuestas ocultan lo que hay debajo: no es cuestión de más tomas."
      - texto: "Más fácil, porque está mejor fabricado"
        porque: "Geometrías pequeñas y muchas capas lo hacen inviable, no más fácil."
    escalera:
      - "¿Con qué silicio funciona la técnica?"
    solucion: "No es viable: solo funciona con silicio antiguo."

  - id: porque-verificar
    tipo: porque
    titulo: "Un dibujo bonito"
    texto: "El esquema reconstruido ya está dibujado. ¿Por qué el trabajo no termina ahí?"
    libro: [378, 379]
    widget:
      tipo: figura
      figura: fig-54.12
      zonas:
        - { id: verificacion, rotulo: "El último paso", rect: [3, 206, 250, 35] }
    opciones:
      - texto: "Siempre tiene errores: termina cuando su simulación reproduce el chip real"
        bien: true
        porque: "Un contacto mal interpretado, una capa mal alineada, una celda confundida: sin comparar, no es un modelo fiable."
      - texto: "Porque hay que pasarlo a limpio"
        porque: "La forma importa poco; importa que reproduzca el comportamiento."
      - texto: "Termina ahí: las fotos no mienten"
        porque: "Las fotos se interpretan, y la interpretación se equivoca."
    escalera:
      - "¿Cómo se sabe que el esquema es correcto?"
    solucion: "Porque siempre hay errores: se verifica simulando frente al chip real."

  - id: prediga-alternativa
    tipo: predecir
    titulo: "Cuándo compensa"
    texto: "Caracterizar el comportamiento basta para reparar y sustituir. ¿Cuándo aporta el trazado del silicio lo que ningún otro método da?"
    libro: [383, 384]
    widget:
      tipo: figura
      figura: fig-54.12
      zonas:
        - { id: limite, rotulo: "Abajo a la derecha", rect: [262, 152, 183, 112] }
    opciones:
      - texto: "Cuando hay que reproducir el chip con exactitud de ciclo"
        bien: true
        porque: "Como al recrear en lógica los chips de las consolas. Y antes, buscar si otros ya lo publicaron."
      - texto: "Siempre que se quiera reparar"
        porque: "Para reparar basta caracterizar el comportamiento."
      - texto: "Cuando el chip es moderno"
        porque: "Con un chip moderno no es viable."
    escalera:
      - "¿Qué precisión no da la caracterización por comportamiento?"
    solucion: "Para reproducir con exactitud de ciclo."

  - id: toque-ventana
    tipo: tocar
    titulo: "Silicio a la vista"
    texto: "En el banco, la única parte doméstica: fotografiar un chip ya destapado. Toque por dónde se ve el silicio de la EPROM."
    libro: [387, 388]
    widget:
      tipo: figura
      figura: fig-54.14
      zonas:
        - { id: ventana, rotulo: "La foto de la izquierda, el centro", rect: [380, 220, 300, 230] }
        - { id: encapsulado, rotulo: "La foto de la izquierda, abajo", rect: [250, 470, 450, 200] }
        - { id: dado, rotulo: "La foto de la derecha", rect: [1030, 10, 550, 630] }
    tocar:
      bien: [ventana]
      porque:
        encapsulado: "Es el plástico del encapsulado, con la referencia."
        dado: "Ese es el dado de otro chip, el 6502, ya fotografiado."
    exito: "La ventana de cuarzo de las memorias borrables por ultravioleta: el integrado pasa a ser un circuito muy pequeño."
    escalera:
      - "¿Por dónde se borra con luz ultravioleta una EPROM?"
    solucion: "La ventana de cuarzo, en el centro de la foto de la izquierda."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [358, 369, 379, 383]
    ideas:
      - { titulo: "El límite.", texto: "Silicio antiguo, de geometrías grandes y pocas capas." }
      - { titulo: "Celdas.", texto: "Reconocer treinta y localizarlas cientos de veces." }
      - { titulo: "Verificar.", texto: "El esquema vale cuando su simulación reproduce el chip." }
      - { titulo: "Casi siempre, otra vía.", texto: "Caracterizar el comportamiento o consultar trazados publicados." }
