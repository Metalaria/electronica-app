# Lección 1.2 de la sección 56.4 «Placas Multicapa: Cuando las Pistas no se Ven» (cap54; etiquetas sec-54.N = impresas
# 56.N).
# - Lo que se deduce sin ver nada (bloques 132 a 136; figura 56.5, fig-54.5), cuándo hace falta ver el interior
#   (138 a 141), la reconstrucción por comportamiento (143 a 145), los encapsulados sin acceso (147 a 152), cuándo parar
#   (155 a 158) y el ejercicio del banco (160, 161).
# Sección sin cálculos: sin modelo (aviso de secuencia «sin tarjeta de fórmula»).
# Pasos prácticos: «tocar» en la figura la vía que une capas internas y «tocar» hasta dónde llegar si el objetivo es
# interoperar.
leccion: cap54/sec-54.4

libro:
  129: "En cuanto la placa tiene cuatro o más, una parte de las conexiones es invisible"
  132: "Lo que se pierde no es la conexión, es el trazado"
  133: "El trazado solo importa si el objetivo es reproducir la placa, no entenderla."
  134: "Los planos internos se identifican por continuidad desde cualquier punto de masa o de alimentación."
  135: "una vía que no conecta con nada visible en ninguna de las dos caras une dos capas internas"
  136: "Un bus de datos sale del procesador como un haz de pistas paralelas hacia la memoria"
  139: "Rayos X. Es lo que usa la industria, y no es de banco doméstico."
  140: "Lijado sucesivo. Destructivo y accesible"
  141: "Transiluminación. Con una placa de fibra de vidrio fina y una luz potente detrás, a veces se intuyen las capas internas. Funciona mal y no cuesta nada probarlo."
  144: "Si un pin del procesador conmuta cuando se pulsa un botón, ese pin es la entrada de ese botón, independientemente del camino que siga por dentro"
  145: "no se reconstruye la placa, se reconstruye el circuito"
  149: "Buscar el punto de prueba, si el diseñador lo dejó"
  150: "Medir en el otro extremo."
  152: "Retirar el componente, destructivo"
  155: "Si el objetivo es reparar, basta con el bloque implicado."
  156: "Si es interoperar, basta con la interfaz."
  158: "una placa nueva hecha con criterios actuales suele salir mejor que una copia"
  161: "para entender un circuito no hace falta saber por dónde van las pistas"
  162: "Qué se conserva en una placa multicapa y cuándo parar."

modelo: { valores: {}, calculos: {} }

tarjetas:
  - id: explore-capas
    tipo: explorar
    titulo: "Cuando las pistas están dentro"
    texto: "Con cuatro capas o más, parte de las conexiones es invisible. Toque las vías y lo que conserva el óhmetro."
    libro: [129, 162]
    widget:
      tipo: figura
      figura: fig-54.5
      zonas:
        - { id: via-masa, rotulo: "La vía de la izquierda", rect: [18, 22, 40, 92], texto: "Vía a masa: unida al plano interno." }
        - { id: pasante, rotulo: "La vía del centro", rect: [92, 22, 40, 92], texto: "Pasante sin nada visible en las caras: une capas internas." }
        - { id: enterrada, rotulo: "La vía de la derecha", rect: [145, 55, 40, 50], texto: "Vía enterrada: no se ve desde fuera." }
        - { id: continuidad, rotulo: "El recuadro de la derecha", rect: [280, 5, 168, 142], texto: "La continuidad sigue funcionando: se sabe qué está unido con qué, no por dónde va." }
        - { id: parar, rotulo: "La franja de abajo", rect: [3, 155, 443, 65], texto: "Cuándo parar: según el objetivo." }
    requiere: { mover: [pasante, continuidad] }

  - id: prediga-continuidad
    tipo: predecir
    titulo: "El óhmetro en una multicapa"
    texto: "La pista entre dos pines va por una capa interna. ¿Qué dice el óhmetro?"
    libro: [132, 133]
    widget:
      tipo: figura
      figura: fig-54.5
      zonas:
        - { id: continuidad, rotulo: "El recuadro de la derecha", rect: [280, 5, 168, 142] }
    opciones:
      - texto: "Que están unidos: se pierde el trazado, no la conexión"
        bien: true
        porque: "Para levantar un esquema eso es todo lo que hace falta."
      - texto: "Nada: la pista no se ve"
        porque: "El óhmetro no necesita verla: mide la unión eléctrica."
      - texto: "Por dónde va la pista"
        porque: "Eso es justo lo que se pierde: el recorrido es invisible."
    escalera:
      - "¿Mide el óhmetro caminos o uniones?"
    solucion: "Que están unidos, aunque no por dónde."

  - id: toque-pasante
    tipo: tocar
    titulo: "Una vía que no va a ninguna parte"
    texto: "Una vía no conecta con nada visible en ninguna de las dos caras. Tóquela: ¿qué une?"
    libro: [135, 134]
    widget:
      tipo: figura
      figura: fig-54.5
      zonas:
        - { id: via-masa, rotulo: "La vía de la izquierda", rect: [18, 22, 40, 92] }
        - { id: pasante, rotulo: "La vía del centro", rect: [92, 22, 40, 92] }
        - { id: enterrada, rotulo: "La vía de la derecha", rect: [145, 55, 40, 50] }
    tocar:
      bien: [pasante]
      porque:
        via-masa: "Esta está unida al plano de masa: se identifica por continuidad desde masa."
        enterrada: "Esta ni siquiera se ve desde fuera: es enterrada."
    exito: "Une dos capas internas, y su posición acota por dónde va la señal."
    escalera:
      - "Busque la que atraviesa la placa sin pista en ninguna cara."
    solucion: "La del centro: une capas internas."

  - id: empareje-interior
    tipo: pregunta
    titulo: "Ver el interior"
    texto: "Reproducir la placa o localizar una rotura interna lo justifican. Empareje cada método con su rasgo."
    libro: [139, 140, 141]
    widget:
      tipo: figura
      figura: fig-54.5
      zonas:
        - { id: capas, rotulo: "El corte de la placa", rect: [5, 22, 200, 115] }
    emparejar:
      - ["Rayos X", "Lo de la industria; juntas bajo encapsulados sin acceso"]
      - ["Lijado sucesivo", "Destructivo: cuando hay dos unidades y una se puede perder"]
      - ["Transiluminación", "Funciona mal y no cuesta nada probarlo"]
    exito: "Hay servicios que hacen inspecciones puntuales de rayos X a precio razonable."
    pistas:
      - { texto: "El lijado fotografía la placa capa por capa." }
    escalera:
      - "¿Cuál destruye la placa y cuál solo necesita una luz?"
    solucion: "Rayos X: industria. Lijado: destructivo. Transiluminación: barata y poco fiable."

  - id: porque-comportamiento
    tipo: porque
    titulo: "Reconstruir por comportamiento"
    texto: "Un pin del procesador conmuta cuando se pulsa un botón. ¿Por qué basta eso, sin saber por dónde va la pista?"
    libro: [144, 145]
    widget:
      tipo: figura
      figura: fig-54.5
      zonas:
        - { id: continuidad, rotulo: "El recuadro de la derecha", rect: [280, 5, 168, 142] }
    opciones:
      - texto: "Porque ese pin es la entrada del botón, siga el camino que siga"
        bien: true
        porque: "Se reconstruye el circuito, no la placa: para reparar, interoperar y recrear es lo que hace falta."
      - texto: "Porque el botón está siempre en el pin más cercano"
        porque: "La posición no lo garantiza; lo que lo demuestra es la respuesta al estímulo."
      - texto: "No basta: hay que ver la pista"
        porque: "El trazado solo importa para reproducir la placa."
    escalera:
      - "¿Qué demuestra que el pin cambie justo al pulsar?"
    solucion: "Porque la respuesta al estímulo identifica la función del pin."

  - id: prediga-bga
    tipo: predecir
    titulo: "Bolas que no se tocan"
    texto: "Los pines de un encapsulado de matriz de bolas no se alcanzan con la punta. ¿Qué se intenta primero?"
    libro: [149, 150, 152]
    widget:
      tipo: figura
      figura: fig-54.5
      zonas:
        - { id: capas, rotulo: "El corte de la placa", rect: [5, 22, 200, 115] }
    opciones:
      - texto: "El punto de prueba, o medir en el otro extremo de la señal"
        bien: true
        porque: "En placas bien diseñadas las señales importantes salen a algún sitio medible."
      - texto: "Retirar el componente"
        porque: "Es destructivo: se deja para cuando no hay otra salida."
      - texto: "Nada: la señal es inaccesible"
        porque: "Casi siempre llega a un conector, a otro integrado o a un punto de prueba."
    escalera:
      - "¿Adónde va la señal al salir del encapsulado?"
    solucion: "Buscar el punto de prueba o medir en el otro extremo."

  - id: toque-parar
    tipo: tocar
    titulo: "Cuándo parar"
    texto: "Quiere conectar el equipo con otro. Toque el objetivo que le dice hasta dónde llegar."
    libro: [155, 156]
    widget:
      tipo: figura
      figura: fig-54.5
      zonas:
        - { id: reparar, rotulo: "Abajo, la primera", rect: [8, 165, 105, 52] }
        - { id: interoperar, rotulo: "Abajo, la segunda", rect: [118, 165, 105, 52] }
        - { id: recrear, rotulo: "Abajo, la tercera", rect: [228, 165, 105, 52] }
        - { id: reproducir, rotulo: "Abajo, la cuarta", rect: [338, 165, 105, 52] }
    tocar:
      bien: [interoperar]
      porque:
        reparar: "Para reparar basta el bloque implicado; aquí se quiere conectar."
        recrear: "Recrear pide el comportamiento completo, con firmware y silicio."
        reproducir: "Reproducir la placa pide todo, y casi siempre compensa rediseñarla."
    exito: "Para interoperar basta con la interfaz: es la decisión que más tiempo ahorra."
    escalera:
      - "¿Qué parte del equipo habla con el otro?"
    solucion: "La segunda: interoperar, basta la interfaz."

  - id: porque-redisenar
    tipo: porque
    titulo: "Copiar o rediseñar"
    texto: "Si el objetivo es reproducir la placa, hace falta todo. ¿Por qué suele ser mejor rediseñarla desde el esquema funcional?"
    libro: [158]
    widget:
      tipo: figura
      figura: fig-54.5
      zonas:
        - { id: reproducir, rotulo: "Abajo, la cuarta", rect: [338, 165, 105, 52] }
    opciones:
      - texto: "Una placa nueva con criterios actuales suele salir mejor que una copia"
        bien: true
        porque: "Y evita trazar capas que no se ven."
      - texto: "Porque copiar es siempre ilegal"
        porque: "La razón que da aquí el libro es técnica: el rediseño sale mejor."
      - texto: "Porque el esquema funcional ya es la placa"
        porque: "No lo es: falta el trazado, que se hace de nuevo."
    escalera:
      - "¿Qué se arrastra al copiar una placa antigua capa a capa?"
    solucion: "Porque una placa nueva con criterios actuales suele ser mejor que la copia."

  - id: porque-bus
    tipo: porque
    titulo: "Un bus en una placa de ordenador"
    texto: "El ejercicio: trazar un solo bus de una placa multicapa vieja con el óhmetro. ¿Qué enseña?"
    libro: [161, 136]
    widget:
      tipo: figura
      figura: fig-54.5
      zonas:
        - { id: continuidad, rotulo: "El recuadro de la derecha", rect: [280, 5, 168, 142] }
    opciones:
      - texto: "Que las conexiones se determinan y el recorrido es invisible: no hace falta para entender"
        bien: true
        porque: "Para entender un circuito no hace falta saber por dónde van las pistas."
      - texto: "Que una multicapa no se puede analizar en casa"
        porque: "Se analiza: lo que no se ve es el recorrido, que no hace falta."
      - texto: "Que el bus no sale del procesador"
        porque: "Sale como un haz de pistas paralelas, aunque desaparezca a mitad de camino."
    escalera:
      - "¿Qué consigue el óhmetro y qué no?"
    solucion: "Las conexiones salen; el recorrido no, y no hace falta."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [132, 135, 145, 156]
    ideas:
      - { titulo: "Continuidad.", texto: "Se pierde el trazado, no la conexión: basta para el esquema." }
      - { titulo: "Vías.", texto: "Una que no va a nada visible une capas internas." }
      - { titulo: "Comportamiento.", texto: "Se reconstruye el circuito, no la placa." }
      - { titulo: "Parar a tiempo.", texto: "Reparar: el bloque; interoperar: la interfaz; reproducir: mejor rediseñar." }
