# Lección 1.2 de la sección 41.11 «Herramientas Adicionales y Resumen» (cap40, sec-40.11). Formato: GUIA.md.
# - La figura 41.15 (fig-40.15) con zonas: las seis ideas y la comprobación de los Gerbers.
# - «0,8 nH por milímetro» (bloque 336) en una gráfica L = 0,8·h: con 1,6 mm, 1,28 nH (el libro: unos 1,3 nH).
# Paso práctico: «tocar» la idea que resuelve un plano cortado bajo una señal.
leccion: cap40/sec-40.11

libro:
  326: "Programa de CAD electrónico"
  327: "no debe ser el del mismo programa que los generó"
  328: "dan la anchura para un incremento de temperatura dado"
  329: "con la advertencia de calcular con el apilado real del fabricante"
  330: "cotejar el patillaje con la hoja de datos"
  331: "Visualización 3D, que detecta colisiones mecánicas antes de fabricar"
  333: "La placa es un componente, no un soporte"
  334: "La colocación decide el 80 % del resultado"
  335: "El plano de masa continuo resuelve por sí solo la mayoría de los problemas de retorno"
  336: "del orden de 0,8 nH por milímetro: unos 1,3 nH una vía pasante en placa de 1,6 mm"
  337: "Lo térmico se diseña, con cobre, vías térmicas y área"
  338: "Los Gerbers son lo que se fabrica, no lo que se dibujó."
  340: "Huella con patillaje equivocado, que ningún DRC detecta."
  343: "DRC en cero con las reglas del fabricante concreto."
  344: "Gerbers en visor externo, capa por capa."
  346: "Impresión 1:1 con los componentes reales encima."
  348: "Serigrafía legible y sin quedar bajo los componentes."
  351: "pistas que no llegan, máscaras que cubren almohadillas, taladros descolocados y textos invertidos"
  352: "Las seis ideas del diseño de placas"

modelo:
  valores:
    k_l: { sim: "L/h", nombre: "inductancia por milímetro", unidad: "nH/mm", valor: 0.8 }
    h_l: { sim: "h", nombre: "espesor de la placa", unidad: mm, valor: 1.6 }
  calculos:
    L_l: { expr: "k_l*h_l", sim: "L", nombre: "inductancia de la vía", unidad: nH }

tarjetas:
  - id: explore-ideas
    tipo: explorar
    titulo: "Las seis ideas"
    texto: "El capítulo en seis recuadros. Toque al menos tres."
    libro: [333, 334, 335, 336, 337, 338, 352]
    widget:
      tipo: figura
      figura: fig-40.15
      zonas:
        - { id: componente, rotulo: "Arriba a la izquierda", rect: [5, 4, 142, 44], texto: "La placa es un componente, no un soporte." }
        - { id: colocacion, rotulo: "Arriba en el centro", rect: [154, 4, 142, 44], texto: "La colocación decide el 80 % del resultado." }
        - { id: plano, rotulo: "Arriba a la derecha", rect: [303, 4, 142, 44], texto: "El plano de masa continuo resuelve por sí solo la mayoría de los retornos." }
        - { id: vias, rotulo: "Abajo a la izquierda", rect: [5, 54, 142, 44], texto: "Las vías son inductancia: unos 1,3 nH una pasante en 1,6 mm." }
        - { id: termico, rotulo: "Abajo en el centro", rect: [154, 54, 142, 44], texto: "Lo térmico se diseña, con cobre, vías térmicas y área." }
        - { id: gerbers, rotulo: "Abajo a la derecha", rect: [303, 54, 142, 44], texto: "Se fabrican los Gerbers, no lo que se dibujó." }
    requiere: { mover: [plano, vias, gerbers] }

  - id: toque-plano
    tipo: tocar
    titulo: "Un retorno que rodea"
    texto: "Una señal rápida emite y capta ruido porque su retorno da un rodeo. Toque la idea que lo resuelve."
    libro: [333, 334, 335, 337]
    widget:
      tipo: figura
      figura: fig-40.15
      zonas:
        - { id: componente, rotulo: "Arriba a la izquierda", rect: [5, 4, 142, 44] }
        - { id: colocacion, rotulo: "Arriba en el centro", rect: [154, 4, 142, 44] }
        - { id: plano, rotulo: "Arriba a la derecha", rect: [303, 4, 142, 44] }
        - { id: termico, rotulo: "Abajo en el centro", rect: [154, 54, 142, 44] }
    tocar:
      bien: [plano]
      porque:
        componente: "Explica por qué pasa, pero no da el remedio."
        colocacion: "Ayuda a acortar bucles, pero el retorno lo resuelve el plano."
        termico: "Es del calor, no del retorno."
    exito: "El plano de masa continuo: cada retorno va bajo su pista sin que nadie lo diseñe."
    escalera:
      - "¿Qué da a cada corriente su camino de vuelta?"
    solucion: "El plano de masa continuo."

  - id: estime-via
    tipo: pregunta
    titulo: "Las vías son inductancia"
    texto: "Del orden de 0,8 nH por milímetro de longitud. ¿Cuánto tiene una vía pasante en una placa de 1,6 mm?"
    libro: [336]
    fijar: { k_l: 0.8, h_l: 1.6 }
    widget:
      tipo: grafica
      x: { id: hh, min: 0, max: 3.2, unidad: mm, rotulo: "h" }
      y: { min: 0, max: 3, unidad: nH, rotulo: "L" }
      curvas:
        - { expr: "k_l*hh", color: naranja, rotulo: "0,8 nH/mm" }
    estimar:
      objetivo: "L_l"
      unidad: nH
      min: 0
      max: 3
      paso: 0.05
      inicio: 2.5
      tol: 0.05
      rotulo: "Inductancia de la vía"
    exito: "Unos 1,3 nH: parece nada, y en el desacoplo pesa más que el condensador."
    pistas:
      - { cuando: { valor: estimacion, mayor: 1.35 }, texto: "Se ha pasado: 0,8 por 1,6." }
      - { texto: "Se ha quedado corto: 0,8 por 1,6." }
    escalera:
      - "Multiplique la inductancia por milímetro por el espesor."
    solucion: "0,8 × 1,6 ≈ 1,3 nH."
    comprobar:
      - { L_l: 1.28 }

  - id: empareje-herramientas
    tipo: pregunta
    titulo: "Las herramientas del flujo"
    texto: "Empareje cada herramienta con su advertencia o su uso."
    libro: [326, 327, 328, 329, 330, 331]
    emparejar:
      - ["Visor de Gerbers", "Independiente del programa que los generó"]
      - ["Calculadora IPC-2221", "Anchura para una subida de temperatura"]
      - ["Calculadora de impedancia", "Con el apilado real del fabricante"]
      - ["Biblioteca de huellas", "Cotejar el patillaje con la hoja"]
      - ["Visualización 3D", "Colisiones mecánicas"]
    exito: "Herramientas libres cubren perfectamente el trabajo de un aficionado."
    pistas:
      - { texto: "La impedancia depende del apilado." }
    escalera:
      - "El visor no puede ser el mismo programa."
    solucion: "Visor, independiente; IPC, anchura; impedancia, apilado real; huellas, hoja; 3D, colisiones."

  - id: pregunta-drc
    tipo: pregunta
    titulo: "El error que nadie detecta"
    texto: "De los errores que resume el capítulo, ¿cuál no lo detecta ningún DRC?"
    libro: [340]
    widget:
      tipo: figura
      figura: fig-40.15
      zonas:
        - { id: gerbers, rotulo: "Abajo a la derecha", rect: [303, 54, 142, 44] }
    opciones:
      - texto: "Una huella con el patillaje equivocado"
        bien: true
        porque: "El cobre cumple las reglas aunque las patillas estén cambiadas: se coteja con la hoja de datos."
      - texto: "Una separación por debajo de la regla"
        porque: "Eso es justo lo que comprueba el DRC."
      - texto: "Una pista más estrecha que el mínimo"
        porque: "Las anchuras mínimas también las comprueba el DRC."
    escalera:
      - "El DRC mira geometría, no a qué patilla va cada almohadilla."
    solucion: "La huella con el patillaje equivocado."

  - id: empareje-lista
    tipo: pregunta
    titulo: "La lista final antes de enviar"
    texto: "Empareje cada comprobación con cómo se hace."
    libro: [343, 344, 346, 348]
    emparejar:
      - ["DRC", "En cero, con las reglas del fabricante concreto"]
      - ["Gerbers", "En visor externo, capa por capa"]
      - ["Impresión 1:1", "Con los componentes reales encima"]
      - ["Serigrafía", "Legible y no bajo los componentes"]
    exito: "Más taladros con sus diámetros, y la vista 3D."
    pistas:
      - { texto: "Las reglas son las del fabricante que va a hacer la placa." }
    escalera:
      - "La impresión se comprueba con las piezas de verdad."
    solucion: "DRC, reglas del fabricante; Gerbers, visor; 1:1, componentes; serigrafía, legible."

  - id: porque-gerbers
    tipo: porque
    titulo: "Diez minutos que evitan devoluciones"
    texto: "¿Por qué recorrer los Gerbers capa a capa en un visor, si el editor ya enseña la placa?"
    libro: [338, 351]
    widget:
      tipo: figura
      figura: fig-40.15
      zonas:
        - { id: comprobacion, rotulo: "Recuadro de abajo", rect: [5, 106, 440, 80] }
    opciones:
      - texto: "El visor enseña lo que verá el fabricante: lo que el editor esconde"
        bien: true
        porque: "Pistas que no llegan, máscaras sobre almohadillas, taladros descolocados, textos invertidos."
      - texto: "Porque el editor no dibuja las capas"
        porque: "Las dibuja; pero enseña lo que se dibujó, no lo que se exportó."
      - texto: "Para medir la impedancia"
        porque: "La impedancia se mide en la placa, con reflectometría."
    escalera:
      - "Se fabrican los ficheros, no el dibujo."
    solucion: "Porque solo el visor enseña lo que se va a fabricar."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [333, 334, 335, 338]
    ideas:
      - { titulo: "Un componente.", texto: "La placa no es un soporte." }
      - { titulo: "Colocación y plano.", texto: "La colocación decide el 80 %; el plano continuo, los retornos." }
      - { titulo: "Vías y calor.", texto: "Unos 1,3 nH por vía; lo térmico se diseña." }
      - { titulo: "Gerbers.", texto: "Se fabrica lo exportado: visor independiente, capa a capa." }
