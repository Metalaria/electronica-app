# Lección 1.2 de la sección 41.12 «Problemas de Diseño» (cap40, sec-40.12). Formato: contenido/lecciones11/GUIA.md.
# - 41.A: los apilados A y B (bloque 359) y la tabla de Z₀ (bloque 364): 50 Ω con h = 0,36 mm piden unos 0,65 mm.
# - 41.B: la corona de la vía, π·d·espesor = 0,0236 mm² con 0,3 mm y 25 µm (bloque 377), con la fórmula IPC de la
#   sección 41.3 (I = k·ΔT^0,44·A^0,725, A en mils², 1 mil = 0,0254 mm): 1,8 A por fuera, 0,9 A por dentro (bloque 378).
# - 41.C: la pista que hace de fusible.
# Paso práctico: «simular» la corriente de la vía con el criterio exterior (1,8 A; errores: el agujero entero, sin π).
# 1.2.1 (autor121-pc, «aprender haciendo», GUIA §13): la tabla de Z₀ del bloque 364 se vuelve un modelo (un polinomio
# de Lagrange por los cuatro puntos de cada columna: exacto en las anchuras de la tabla, y su cruce con 50 Ω cae en
# 0,34 mm y 0,64 mm, los «0,34 mm exactos» y «unos 0,65 mm» del bloque 365); se consigue 50 Ω eligiendo anchura y
# dieléctrico, y se marca la anchura del dieléctrico grueso. La capa con referencia de alimentación del apilado A se
# toca en la figura 41.3 (es el clásico), y la vía de masa en la 41.6. La corriente de la vía se simula, el número
# mínimo de vías para 5 A y la caída de cinco vías en paralelo se escriben. Quedan dos preguntas de opciones (41.C).
leccion: cap40/sec-40.12

libro:
  354: "Elegir el apilado de cuatro capas"
  "cap40#112": "necesita una vía de masa cerca por donde hacerlo"
  356: "Una placa mixta (microcontrolador, convertidor conmutado y entradas analógicas) se va a fabricar en cuatro capas"
  359: "Alimentación"
  360: "su corriente de retorno debe cruzar entre planos por los condensadores de desacoplo, alargando el bucle"
  361: "Opción B da a todas las señales un plano de masa contiguo"
  363: "El dato que decide es la altura al plano de referencia"
  364: "0,7 mm"
  365: "con h = 0,36 mm harían falta unos 0,65 mm, casi el doble de espacio"
  366: "La decisión: apilado B con dieléctrico fino entre las capas 1-2 y 3-4"
  367: "Hay que poner una vía de masa junto a cada vía de señal que cambie de plano de referencia"
  371: "Cuántas vías necesita una corriente"
  373: "Vías de 0,3 mm con 25 µm de metalizado en placa de 1,6 mm"
  376: "Una vía conduce por la corona de cobre depositada en su pared"
  377: '"sección" = π dot.op d dot.op "espesor"'
  378: "eso da 1,8 A con el coeficiente de pista exterior y 0,9 A con el de pista interior"
  379: "para 5 A: al menos 5 vías, y en la práctica 6 u 8 para dejar margen"
  381: "En un camino de conmutación (capítulo 33) esta es la que manda, no la corriente"
  382: "Conduce, pero su inductancia arruina el bucle de conmutación"
  386: "La pista que se convierte en fusible"
  393: "el fusible debe fundir antes de que la pista se dañe"
  394: "una pista estrecha con un fusible generoso"
  396: "ensanchar los últimos centímetros desde el conector"
  "cap40#75": 'I = k dot.op "Δ" T^("0,44") dot.op A^("0,725")'

modelo:
  valores:
    w_36: { sim: "w", nombre: "anchura para 50 Ω con h = 0,36 mm", unidad: mm, valor: 0.65 }
    d_t: { sim: "d", nombre: "diámetro del taladro", unidad: mm, valor: 0.3 }
    e_m: { sim: "e", nombre: "espesor del metalizado", unidad: mm, valor: 0.025 }
    k_e: { sim: "k", nombre: "coeficiente de pista", unidad: "", valor: 0.048 }
    dT_v: { sim: "ΔT", nombre: "subida de temperatura", unidad: "°C", valor: 10 }
    w_m: { sim: "w", nombre: "anchura de la pista", unidad: mm, valor: 0.5 }
    h_m: { sim: "h", nombre: "dieléctrico hasta el plano", unidad: mm, valor: 0.36 }
    I5: { sim: "I", nombre: "corriente de la pista de potencia", unidad: A, valor: 5 }
    I1v: { sim: "I_{vía}", nombre: "corriente por vía (regla conservadora)", unidad: A, valor: 1 }
    R_v1: { sim: "R_{vía}", nombre: "resistencia de una vía de 1,6 mm", unidad: Ω, valor: 0.0012 }
    n_v5: { sim: "n", nombre: "vías en paralelo", unidad: "", valor: 5 }
  calculos:
    A_v: { expr: "pi*d_t*e_m", sim: "A", nombre: "sección de la corona", unidad: "mm²" }
    w_eq: { expr: "A_v/0.035", sim: "w", nombre: "pista equivalente de 35 µm", unidad: mm }
    I_via: { expr: "k_e*dT_v^0.44*(A_v/0.0254^2)^0.725", sim: "I", nombre: "corriente de la vía", unidad: A }
    I_int: { expr: "0.024*dT_v^0.44*(A_v/0.0254^2)^0.725", sim: "I", nombre: "con el coeficiente interior", unidad: A }
    I_agujero: { expr: "k_e*dT_v^0.44*(pi*d_t^2/4/0.0254^2)^0.725", sim: "I", nombre: "con el agujero entero", unidad: A }
    I_sinpi: { expr: "k_e*dT_v^0.44*(d_t*e_m/0.0254^2)^0.725", sim: "I", nombre: "sin π", unidad: A }
    Z_1: { expr: "58.4*(w_m-0.35)*(w_m-0.5)*(w_m-0.7)/(-0.01125) + 49.2*(w_m-0.25)*(w_m-0.5)*(w_m-0.7)/0.00525 + 40*(w_m-0.25)*(w_m-0.35)*(w_m-0.7)/(-0.0075) + 32.1*(w_m-0.25)*(w_m-0.35)*(w_m-0.5)/0.0315", sim: "Z₀", nombre: "impedancia con h = 0,2 mm (tabla)", unidad: Ω, cifras: 3 }
    Z_2: { expr: "77.7*(w_m-0.35)*(w_m-0.5)*(w_m-0.7)/(-0.01125) + 67.6*(w_m-0.25)*(w_m-0.5)*(w_m-0.7)/0.00525 + 57*(w_m-0.25)*(w_m-0.35)*(w_m-0.7)/(-0.0075) + 47.4*(w_m-0.25)*(w_m-0.35)*(w_m-0.5)/0.0315", sim: "Z₀", nombre: "impedancia con h = 0,36 mm (tabla)", unidad: Ω, cifras: 3 }
    Z_t: { expr: "Z_1 + (h_m - 0.2)/0.16*(Z_2 - Z_1)", sim: "Z₀", nombre: "impedancia de la pista", unidad: Ω, cifras: 3 }
    n_min: { expr: "ceil(I5/I1v)", sim: "n", nombre: "vías mínimas", unidad: "" }
    V_v: { expr: "I5*R_v1/n_v5", sim: "ΔV", nombre: "caída en las vías en paralelo", unidad: V }
    V_v1: { expr: "I5*R_v1", sim: "ΔV", nombre: "caída con una sola vía", unidad: V }

tarjetas:
  - id: porque-a
    tipo: tocar
    titulo: "Problema 41.A: dos apilados"
    texto: "Una placa mixta de cuatro capas. El apilado A es el clásico de la izquierda: toque la capa de señal cuya referencia es la alimentación."
    libro: [354, 356, 359, 360, 361]
    widget:
      tipo: figura
      figura: fig-40.3
      zonas:
        - { id: s1, rotulo: "Clásico: la primera capa", rect: [18, 23, 114, 14] }
        - { id: m, rotulo: "Clásico: la segunda", rect: [18, 40, 114, 15] }
        - { id: a, rotulo: "Clásico: la tercera", rect: [18, 58, 114, 15] }
        - { id: s4, rotulo: "Clásico: la cuarta", rect: [18, 76, 114, 15] }
    tocar:
      bien: [s4]
      porque:
        s1: "La capa 1 tiene debajo el plano de masa: su retorno es directo."
        m: "Es el plano de masa, no una capa de señal."
        a: "Es el plano de alimentación: la referencia de la capa que se busca."
    exito: "La capa 4: su retorno cruza entre planos por los desacoplos y alarga el bucle. El apilado B, señal-masa-señal-masa, da masa contigua a todas."
    escalera:
      - "¿Qué plano tiene justo encima la capa de abajo?"
    solucion: "La cuarta capa, sobre el plano de alimentación."

  - id: estime-anchura
    tipo: explorar
    fase: "Consiga"
    titulo: "50 Ω en el menor espacio"
    texto: "Pistas exteriores de 35 µm en FR4. Elija la anchura y el dieléctrico de la tabla hasta conseguir unos 50 Ω."
    libro: [363, 364, 365]
    inicio: { w_m: 0.5, h_m: 0.36 }
    widget:
      tipo: grafica
      x: { id: q, min: 0.25, max: 0.7, unidad: mm, rotulo: "anchura de la pista" }
      y: { min: 25, max: 85, unidad: Ω, rotulo: "Z₀" }
      curvas:
        - { expr: "58.4*(q-0.35)*(q-0.5)*(q-0.7)/(-0.01125) + 49.2*(q-0.25)*(q-0.5)*(q-0.7)/0.00525 + 40*(q-0.25)*(q-0.35)*(q-0.7)/(-0.0075) + 32.1*(q-0.25)*(q-0.35)*(q-0.5)/0.0315", color: azul, rotulo: "h = 0,2 mm" }
        - { expr: "77.7*(q-0.35)*(q-0.5)*(q-0.7)/(-0.01125) + 67.6*(q-0.25)*(q-0.5)*(q-0.7)/0.00525 + 57*(q-0.25)*(q-0.35)*(q-0.7)/(-0.0075) + 47.4*(q-0.25)*(q-0.35)*(q-0.5)/0.0315", color: naranja, rotulo: "h = 0,36 mm" }
        - { expr: "50 + 0*q", color: tinta, rotulo: "50 Ω", discontinua: true }
      marcas:
        - { x: "w_m", y: "Z_t", rotulo: "{{Z_t}}" }
      lectura: { valor: Z_t, rotulo: "Impedancia de la pista" }
      mandos:
        - { valor: w_m, lista: [0.25, 0.35, 0.5, 0.7], rotulo: "Anchura de la pista" }
        - { valor: h_m, lista: [0.2, 0.36], rotulo: "Dieléctrico, h" }
    objetivo:
      condiciones:
        - { valor: Z_t, objetivo: 50, tol: 0.02, rotulo: "Z₀: {{Z_t}}" }
      logrado: "Con {{h_m}} de dieléctrico, {{w_m}} de pista: {{Z_t}}. El dato que decide es la altura al plano."
      pistas:
        - { cuando: { valor: Z_t, mayor: 51 }, texto: "Demasiada impedancia: ensanche la pista o acerque el plano." }
        - { texto: "Poca impedancia: estreche la pista o aleje el plano." }
    escalera:
      - "Más ancha, menos impedancia; más lejos del plano, más."
    solucion: "h = 0,2 mm y 0,35 mm de pista: 49,2 Ω."
    comprobar:
      - { con: { w_m: 0.35, h_m: 0.2 }, Z_t: 49.2, tol: 0.001 }
      - { con: { w_m: 0.7, h_m: 0.36 }, Z_t: 47.4, tol: 0.001 }
      - { con: { w_m: 0.25, h_m: 0.36 }, Z_t: 77.7, tol: 0.001 }

  - id: marque-grueso
    tipo: marcar
    titulo: "Con el dieléctrico grueso"
    texto: "Con h = 0,36 mm ninguna anchura de la tabla da 50 Ω. Marque en su curva la anchura que los daría."
    libro: [364, 365]
    widget:
      tipo: grafica
      x: { id: q, min: 0.25, max: 0.7, unidad: mm, rotulo: "anchura de la pista" }
      y: { min: 25, max: 85, unidad: Ω, rotulo: "Z₀" }
      curvas:
        - { expr: "58.4*(q-0.35)*(q-0.5)*(q-0.7)/(-0.01125) + 49.2*(q-0.25)*(q-0.5)*(q-0.7)/0.00525 + 40*(q-0.25)*(q-0.35)*(q-0.7)/(-0.0075) + 32.1*(q-0.25)*(q-0.35)*(q-0.5)/0.0315", color: azul, rotulo: "h = 0,2 mm" }
        - { expr: "77.7*(q-0.35)*(q-0.5)*(q-0.7)/(-0.01125) + 67.6*(q-0.25)*(q-0.5)*(q-0.7)/0.00525 + 57*(q-0.25)*(q-0.35)*(q-0.7)/(-0.0075) + 47.4*(q-0.25)*(q-0.35)*(q-0.5)/0.0315", color: naranja, rotulo: "h = 0,36 mm" }
        - { expr: "50 + 0*q", color: tinta, rotulo: "50 Ω", discontinua: true }
      mandos: []
    marcar:
      modo: x
      curva: 1
      x: "w_36"
      tol: 0.03
      inicio: { x: 0.3, y: 70 }
      rotulo: "La anchura de 50 Ω con h = 0,36 mm"
      pasos: 90
    pistas:
      - { cuando: { valor: marca_x, menor: 0.64 }, texto: "Ahí la impedancia aún pasa de 50 Ω: más ancha." }
      - { texto: "Ahí ya baja de 50 Ω: algo más estrecha." }
    exito: "Unos 0,65 mm, casi el doble que con 0,2 mm: de ahí el apilado B con dieléctrico fino entre las capas 1-2 y 3-4."
    escalera:
      - "Busque dónde la curva naranja cruza la línea de 50 Ω, entre 0,5 y 0,7 mm."
    solucion: "Unos 0,65 mm."

  - id: pregunta-via-masa
    tipo: tocar
    titulo: "El detalle que lo hace funcionar"
    texto: "En el apilado B una señal pasa de la capa 1 a la 3, y su retorno salta del plano 2 al 4. Toque lo que necesita al lado."
    libro: [367, "cap40#112"]
    widget:
      tipo: figura
      figura: fig-40.6
      zonas:
        - { id: inductancia, rotulo: "Recuadro de arriba", rect: [249, 29, 198, 42] }
        - { id: retorno, rotulo: "Segundo recuadro", rect: [249, 77, 198, 40] }
        - { id: corriente, rotulo: "Tercer recuadro", rect: [249, 125, 198, 40] }
        - { id: pasta, rotulo: "Recuadro de abajo", rect: [249, 172, 198, 40] }
    tocar:
      bien: [retorno]
      porque:
        inductancia: "La inductancia de la vía no se quita; lo que falta es el paso del retorno entre planos."
        corriente: "Varias vías en paralelo son para la corriente de potencia, no para el retorno de una señal."
        pasta: "Es un detalle de las vías térmicas bajo una almohadilla."
    exito: "Una vía de masa junto a cada vía de señal que cambia de plano de referencia; si no, el bucle de retorno se dispara."
    escalera:
      - "El retorno tiene que pasar del plano 2 al 4: ¿por dónde?"
    solucion: "El segundo recuadro: una vía de masa al lado."

  - id: simule-via
    tipo: simular
    titulo: "Problema 41.B: la corriente de una vía"
    texto: "Vía de 0,3 mm con 25 µm de metalizado. Con el criterio IPC exterior y 10 °C, ¿cuánta corriente admite?"
    libro: [371, 373, 376, 377, 378, "cap40#75"]
    fijar: { d_t: 0.3, e_m: 0.025, k_e: 0.048, dT_v: 10 }
    widget:
      tipo: grafica
      x: { id: ss, min: 0, max: 0.08, unidad: "mm²", rotulo: "sección" }
      y: { min: 0, max: 5, unidad: A, rotulo: "I" }
      curvas:
        - { expr: "k_e*dT_v^0.44*(ss/0.0254^2)^0.725", color: naranja, rotulo: "Exterior, 10 °C" }
      lectura: { valor: I_via, rotulo: "Corriente de la vía" }
      datos:
        - { valor: A_v, rotulo: "Sección de la corona: {{A_v}}" }
      ocultar: true
    simular:
      objetivo: I_via
      unidad: A
      tol: 0.05
      rotulo: "Corriente de la vía, I"
      errores:
        - { expr: "I_agujero", texto: "Ha usado el agujero entero: la vía conduce por la corona de cobre de su pared." }
        - { expr: "I_sinpi", texto: "Ha olvidado el π: la corona es el perímetro π·d por el espesor." }
    exito: "1,8 A por fuera y 0,9 A por dentro: del orden de 1 A por vía."
    escalera:
      - "Sección = π × 0,3 mm × 0,025 mm; pásela a mils cuadrados."
    solucion: "0,0236 mm², como 0,67 mm de pista de 35 µm: 1,8 A."
    comprobar:
      - { A_v: 0.0236, w_eq: 0.67, I_via: 1.8, I_int: 0.9, tol: 0.01 }
      - { I_agujero: 3.99, I_sinpi: 0.79, tol: 0.02 }

  - id: pregunta-cuantas
    tipo: leer
    titulo: "Para 5 A"
    texto: "Una pista de potencia de 5 A cambia de capa. Con 1 A por vía como regla conservadora, escriba cuántas vías hacen falta como mínimo."
    libro: [373, 379, 381]
    fijar: { I5: 5, I1v: 1 }
    widget:
      tipo: grafica
      x: { id: nv, min: 1, max: 8, unidad: "", rotulo: "vías" }
      y: { min: 0, max: 5.5, unidad: A, rotulo: "I por vía" }
      curvas:
        - { expr: "I5/nv", color: naranja, rotulo: "corriente por vía" }
        - { expr: "I1v + 0*nv", color: tinta, rotulo: "1 A por vía", discontinua: true }
      mandos: []
    leer:
      objetivo: n_min
      unidad: ""
      tol: 0.01
      rotulo: "Vías mínimas"
      errores:
        - { expr: "1", texto: "Una sola conduce, pero llevaría 5 A: un punto caliente, y su inductancia arruina el bucle de conmutación." }
    exito: "Al menos 5; en la práctica, 6 u 8 para dejar margen, y más si es un camino de conmutación."
    escalera:
      - "5 A entre 1 A por vía."
    solucion: "Cinco como mínimo; seis u ocho en la práctica."
    comprobar:
      - { n_min: 5 }

  - id: empareje-criterios
    tipo: leer
    titulo: "Los tres criterios a la vez"
    texto: "Cada vía de 1,6 mm aporta unos 1,2 mΩ. Con cinco en paralelo y 5 A, escriba la caída entre las dos capas."
    libro: [381, 382]
    fijar: { I5: 5, R_v1: 0.0012, n_v5: 5 }
    widget:
      tipo: grafica
      x: { id: nv, min: 1, max: 8, unidad: "", rotulo: "vías en paralelo" }
      y: { min: 0, max: 0.007, unidad: V, rotulo: "ΔV" }
      curvas:
        - { expr: "I5*R_v1/nv", color: naranja, rotulo: "caída" }
      mandos: []
    leer:
      objetivo: V_v
      unidad: V
      tol: 0.05
      rotulo: "Caída en las cinco vías"
      errores:
        - { expr: "V_v1", texto: "Esa es la de una sola vía: en paralelo, la resistencia se divide entre cinco." }
    exito: "Unos 1,2 mV: despreciable. En conmutación manda la inductancia, de 1 a 2 nH por vía: más vías la reducen."
    escalera:
      - "Cinco iguales en paralelo: la quinta parte de la resistencia."
    solucion: "5 A × 1,2 mΩ / 5 = 1,2 mV."
    comprobar:
      - { V_v: 0.0012, V_v1: 0.006 }

  - id: pregunta-fusible
    tipo: predecir
    titulo: "Problema 41.C: la pista fusible"
    texto: "Una pista estrecha protegida por un fusible generoso sufre un cortocircuito. ¿Qué pasa?"
    libro: [386, 393, 394]
    widget:
      tipo: figura
      figura: fig-40.4
      zonas:
        - { id: grafica, rotulo: "La gráfica", rect: [0, 0, 342, 210] }
    opciones:
      - texto: "La pista hace de fusible: se vaporiza, y puede haber un arco"
        bien: true
        porque: "No es una protección limpia: es una placa destruida."
      - texto: "Funde el fusible"
        porque: "Un fusible generoso tarda más de lo que aguanta la pista."
      - texto: "Nada: la pista aguanta"
        porque: "Es estrecha: su I²t es menor que el del fusible."
    escalera:
      - "¿Qué funde antes: la pista o el fusible?"
    solucion: "Funde la pista: se vaporiza y puede haber un arco."

  - id: pregunta-regla
    tipo: pregunta
    titulo: "La regla operativa"
    texto: "¿Cómo se dimensiona una pista de alimentación protegida por fusible?"
    libro: [393, 396]
    widget:
      tipo: figura
      figura: fig-40.4
      zonas:
        - { id: grafica, rotulo: "La gráfica", rect: [0, 0, 342, 210] }
    opciones:
      - texto: "Para la corriente normal, con el fusible coordinado y ensanchando la entrada"
        bien: true
        porque: "El fusible funde antes de que la pista se dañe; los últimos centímetros desde el conector, más anchos."
      - texto: "Para la corriente de cortocircuito, siempre"
        porque: "Es válido, pero exige pistas anchas; lo habitual es la corriente normal con protección coordinada."
      - texto: "Lo más estrecha posible, para que haga de fusible"
        porque: "Solo si se calcula y se documenta; por accidente es suicida."
    escalera:
      - "El fusible debe fundir antes que la pista."
    solucion: "Corriente normal, coordinación con el fusible y entrada ensanchada."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [366, 367, 378, 396]
    ideas:
      - { titulo: "Apilado B.", texto: "Masa contigua, 0,2 mm y pistas de 0,35 mm para 50 Ω." }
      - { titulo: "Vía de masa.", texto: "Junto a cada vía de señal que cambia de plano." }
      - { titulo: "Vías de potencia.", texto: "1,8 A por fuera, 0,9 por dentro: unos 1 A; 6 u 8 para 5 A." }
      - { titulo: "Fusible.", texto: "Corriente normal, coordinación y la entrada más ancha." }
