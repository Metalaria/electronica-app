# Lección 1.2 de la sección 41.8 «Fabricación: Gerbers, DRC y Clases» (cap40, sec-40.8). Formato: GUIA.md.
# - La figura 41.12 (fig-40.12) con zonas: los cuatro acabados y lo que decide el precio.
# - Sin fórmula ni números que calcular (sección de criterio). Paso práctico: «tocar» el acabado para un BGA.
# 1.2.1 (autor121-pc, «aprender haciendo», GUIA §13): el acabado se toca en la figura 41.12 para tres casos (BGA, placas
# que esperan meses, prototipo barato), el factor de precio de la clase 3 y el de las cuatro capas en la misma figura,
# el fichero de los taladros en el paquete de fabricación (un listado con los ficheros del bloque 222-224) y la
# comprobación del visor en la figura 41.15. Quedan dos preguntas de opciones (las excepciones del DRC y qué se
# comprueba al recibir las placas). Sección de criterio, sin números: 70 % sin pasar de dos opciones.
# 1.2.1, segunda pasada: sin listas de respuestas disfrazadas; quedan las tarjetas que se hacen y dos preguntas.
leccion: cap40/sec-40.8

libro:
  222: "un fichero por capa (cobre, máscara, serigrafía, pasta) más el de contorno"
  223: "Fichero de taladro (Excellon), con posiciones, diámetros y qué taladros son metalizados y cuáles no"
  224: "Notas de fabricación: espesor, material, número de capas, acabado, color de máscara, clase IPC"
  225: "el formato ODB++ o IPC-2581, que reúne todo en un solo fichero"
  227: "La norma IPC-6012 define tres clases según la exigencia"
  228: "Aeroespacial, médico, automoción"
  229: "pedir clase 3 cuando basta la 2 multiplica el coste sin aportar nada"
  230: "Diseñar dentro de las capacidades estándar (no las mínimas)"
  233: "la superficie no queda plana, lo que dificulta el montaje de encapsulados de paso fino"
  234: "superficie plana, excelente para paso fino y para contactos"
  235: "una vez abierto conviene montar la placa en pocos días"
  236: "alternativas planas de coste intermedio"
  237: "HASL para prototipos con componentes de paso normal, ENIG en cuanto haya paso fino o BGA, y OSP en producción con montaje inmediato"
  239: "hay que llegar a cero avisos, marcando explícitamente las excepciones intencionadas"
  240: "detecta capas invertidas, máscaras ausentes y contornos mal definidos"
  243: "Área de la placa."
  244: "cuatro capas suele salir mejor que dos en cuanto el circuito tenga alguna complejidad"
  246: "inspección visual con lupa"
  247: "el fabricante debe entregar el cupón de prueba con su medida"
  248: "Los cuatro acabados superficiales y lo que decide el precio de una placa"
  "cap40#352": "Las seis ideas del diseño de placas y la comprobación de los Gerbers"

modelo: { valores: {}, calculos: {} }

tarjetas:
  - id: explore-acabados
    tipo: explorar
    titulo: "Los cuatro acabados"
    texto: "El cobre desnudo se oxida: las almohadillas llevan un acabado. Toque los cuatro."
    libro: [233, 234, 235, 236, 248]
    widget:
      tipo: figura
      figura: fig-40.12
      zonas:
        - { id: hasl, rotulo: "HASL", rect: [5, 19, 214, 37], texto: "Estaño fundido soplado: el más barato, con la superficie no plana." }
        - { id: enig, rotulo: "ENIG", rect: [5, 61, 214, 37], texto: "Níquel y oro por inmersión: plano, para paso fino y contactos; más caro." }
        - { id: osp, rotulo: "OSP", rect: [5, 103, 214, 37], texto: "Recubrimiento orgánico: barato y plano, con vida limitada." }
        - { id: plata, rotulo: "Plata o estaño", rect: [5, 145, 214, 37], texto: "Por inmersión: alternativas planas de coste intermedio." }
    requiere: { mover: [hasl, enig, osp, plata] }

  - id: toque-bga
    tipo: tocar
    titulo: "Una placa con un BGA"
    texto: "La placa lleva un BGA y componentes de paso fino. Toque el acabado que elige el libro."
    libro: [233, 234, 235, 237]
    widget:
      tipo: figura
      figura: fig-40.12
      zonas:
        - { id: hasl, rotulo: "Primer recuadro de la izquierda", rect: [5, 19, 214, 37] }
        - { id: enig, rotulo: "Segundo recuadro de la izquierda", rect: [5, 61, 214, 37] }
        - { id: osp, rotulo: "Tercer recuadro de la izquierda", rect: [5, 103, 214, 37] }
    tocar:
      bien: [enig]
      porque:
        hasl: "Su superficie no queda plana y dificulta el paso fino: es para prototipos de paso normal."
        osp: "Plano, pero de vida limitada: para producción con montaje inmediato."
    exito: "ENIG: superficie plana, para paso fino y BGA."
    escalera:
      - "Hace falta una superficie plana que se conserve."
    solucion: "ENIG, el segundo recuadro."

  - id: toque-osp
    tipo: tocar
    titulo: "Placas que esperan"
    texto: "Las placas pasarán meses en el almacén antes de montarlas. Toque el acabado que no conviene."
    libro: [235, 248]
    widget:
      tipo: figura
      figura: fig-40.12
      zonas:
        - { id: hasl, rotulo: "Primer recuadro de la izquierda", rect: [5, 19, 214, 37] }
        - { id: enig, rotulo: "Segundo recuadro de la izquierda", rect: [5, 61, 214, 37] }
        - { id: osp, rotulo: "Tercer recuadro de la izquierda", rect: [5, 103, 214, 37] }
        - { id: plata, rotulo: "Cuarto recuadro de la izquierda", rect: [5, 145, 214, 37] }
    tocar:
      bien: [osp]
      porque:
        hasl: "Se conserva bien; su problema es que no queda plano."
        enig: "Plano y con buena conservación: aguanta el almacén."
        plata: "Alternativa plana de coste intermedio; el de vida limitada es otro."
    exito: "El OSP: unos meses en su envase sellado y, una vez abierto, montar en pocos días. Es para producción inmediata."
    escalera:
      - "Busque el acabado con vida limitada."
    solucion: "El tercero, OSP."

  - id: toque-hasl
    tipo: tocar
    titulo: "Un prototipo barato"
    texto: "Un prototipo con componentes de paso normal y poco presupuesto. Toque el acabado que elige el libro."
    libro: [233, 237]
    widget:
      tipo: figura
      figura: fig-40.12
      zonas:
        - { id: hasl, rotulo: "Primer recuadro de la izquierda", rect: [5, 19, 214, 37] }
        - { id: enig, rotulo: "Segundo recuadro de la izquierda", rect: [5, 61, 214, 37] }
        - { id: osp, rotulo: "Tercer recuadro de la izquierda", rect: [5, 103, 214, 37] }
        - { id: plata, rotulo: "Cuarto recuadro de la izquierda", rect: [5, 145, 214, 37] }
    tocar:
      bien: [hasl]
      porque:
        enig: "Excelente, pero más caro: se reserva para paso fino o BGA."
        osp: "Es para producción con montaje inmediato."
        plata: "Es plano, de coste intermedio; con paso normal basta el más barato."
    exito: "HASL, estaño fundido soplado: el más barato. No queda plano, pero con paso normal no importa."
    escalera:
      - "Con paso normal, la planitud no hace falta: busque el más barato."
    solucion: "El primero, HASL."

  - id: porque-clase
    tipo: tocar
    titulo: "Las clases IPC"
    texto: "La IPC-6012 tiene tres clases: 1 consumo, 2 industrial, 3 aeroespacial y médica. Se pide la 3 por prudencia: toque el factor del precio que se dispara."
    libro: [227, 228, 229, 230]
    widget:
      tipo: figura
      figura: fig-40.12
      zonas:
        - { id: r1, rotulo: "Primer recuadro de la derecha", rect: [233, 19, 213, 37] }
        - { id: r2, rotulo: "Segundo recuadro de la derecha", rect: [233, 61, 213, 37] }
        - { id: r3, rotulo: "Tercer recuadro de la derecha", rect: [233, 103, 213, 37] }
        - { id: r4, rotulo: "Cuarto recuadro de la derecha", rect: [233, 145, 213, 37] }
    tocar:
      bien: [r3]
      porque:
        r1: "El área y las capas no cambian con la clase."
        r2: "La cantidad y el plazo no dependen de la clase."
        r4: "Son requisitos especiales, como la impedancia controlada; la clase va en otro recuadro."
    exito: "Pedir clase 3 cuando basta la 2 multiplica el coste sin aportar nada: la clase se elige por la aplicación."
    escalera:
      - "La clase va junto con el acabado."
    solucion: "El tercero: acabado y clase."

  - id: pregunta-drc
    tipo: pregunta
    titulo: "La comprobación de reglas"
    texto: "El DRC da tres avisos de separación que son intencionados. ¿Qué se hace?"
    libro: [239]
    widget:
      tipo: figura
      figura: fig-40.12
      zonas:
        - { id: especiales, rotulo: "Recuadro naranja de la derecha", rect: [233, 145, 213, 37] }
    opciones:
      - texto: "Marcarlos como excepciones y llegar a cero avisos"
        bien: true
        porque: "Como con el ERC del esquema: cero avisos, con las excepciones explícitas."
      - texto: "Dejarlos: ya se sabe que son intencionados"
        porque: "Entre tres avisos conocidos se esconde fácilmente uno nuevo que no lo es."
      - texto: "Desactivar esa regla"
        porque: "Dejaría pasar las separaciones que sí son errores."
    escalera:
      - "Es lo mismo que se hace con el ERC."
    solucion: "Cero avisos, marcando las excepciones intencionadas."

  - id: pregunta-visor
    tipo: tocar
    titulo: "Lo que la fábrica va a ver"
    texto: "Una capa invertida o una máscara ausente no se ven en el editor. Toque la comprobación que las descubre."
    libro: [240, "cap40#352"]
    widget:
      tipo: figura
      figura: fig-40.15
      zonas:
        - { id: componente, rotulo: "Arriba a la izquierda", rect: [4, 4, 142, 44] }
        - { id: colocacion, rotulo: "Arriba en el centro", rect: [153, 4, 142, 44] }
        - { id: vias, rotulo: "En medio a la izquierda", rect: [4, 53, 142, 44] }
        - { id: visor, rotulo: "Recuadro grande de abajo", rect: [6, 106, 438, 80] }
    tocar:
      bien: [visor]
      porque:
        componente: "Es la idea de fondo del capítulo, no una comprobación."
        colocacion: "La colocación se decide antes de trazar; no ve los ficheros."
        vias: "Habla de la inductancia de las vías, no de los ficheros."
    exito: "Abrir los Gerbers en un visor independiente, capa por capa: es la única forma de ver lo que la fábrica va a ver."
    escalera:
      - "¿Qué recibe la fábrica: el dibujo o los ficheros?"
    solucion: "El recuadro de abajo: los Gerbers en un visor independiente."

  - id: predecir-capas
    tipo: tocar
    titulo: "Dos o cuatro capas"
    texto: "Un circuito con alguna complejidad. Toque el factor de precio que conviene subir, porque ahorra tiempo, revisiones y componentes."
    libro: [243, 244]
    widget:
      tipo: figura
      figura: fig-40.12
      zonas:
        - { id: r1, rotulo: "Primer recuadro de la derecha", rect: [233, 19, 213, 37] }
        - { id: r2, rotulo: "Segundo recuadro de la derecha", rect: [233, 61, 213, 37] }
        - { id: r3, rotulo: "Tercer recuadro de la derecha", rect: [233, 103, 213, 37] }
        - { id: r4, rotulo: "Cuarto recuadro de la derecha", rect: [233, 145, 213, 37] }
    tocar:
      bien: [r1]
      porque:
        r2: "Pedir más placas o más deprisa no resuelve problemas eléctricos."
        r3: "Un acabado o una clase más cara no da un plano de masa."
        r4: "Los requisitos especiales encarecen sin dar el plano de masa."
    exito: "Las capas: de dos a cuatro es el mayor salto de precio, y aun así suele salir mejor por el plano de masa continuo."
    escalera:
      - "¿Qué da el plano de masa continuo?"
    solucion: "El primero: el número de capas."

  - id: pregunta-recibir
    tipo: pregunta
    titulo: "Al recibir las placas"
    texto: "Llegan las placas. ¿Qué se comprueba antes de montar?"
    libro: [246, 247]
    widget:
      tipo: figura
      figura: fig-40.12
      zonas:
        - { id: especiales, rotulo: "Recuadro naranja de la derecha", rect: [233, 145, 213, 37] }
    opciones:
      - texto: "Lupa, continuidad de las alimentaciones y resistencia alta entre raíles y masa"
        bien: true
        porque: "Y con impedancia controlada, el cupón de prueba con su medida."
      - texto: "Nada: el fabricante ya las ha probado"
        porque: "Grietas, pistas rotas o un corto entre raíles se ven antes de montar, no después."
      - texto: "Solo que el color de la máscara es el pedido"
        porque: "Lo que importa es lo eléctrico: continuidad y aislamiento entre raíles."
    escalera:
      - "Mire con lupa y mida entre los raíles y masa."
    solucion: "Inspección con lupa, continuidad y resistencia entre raíles y masa; el cupón si hay impedancia."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [222, 229, 237, 240, 223, 224, 225]
    ideas:
      - { titulo: "Los ficheros.", texto: "Gerbers por capa, taladros Excellon y notas; o todo en ODB++." }
      - { titulo: "La clase.", texto: "Por la aplicación: la 3 sin necesitarla multiplica el coste." }
      - { titulo: "El acabado.", texto: "HASL en prototipos; ENIG con paso fino o BGA; OSP con montaje inmediato." }
      - { titulo: "Verificar.", texto: "DRC a cero y Gerbers en un visor independiente." }
