# Lección 1.2 de la sección 41.8 «Fabricación: Gerbers, DRC y Clases» (cap40, sec-40.8). Formato: GUIA.md.
# - La figura 41.12 (fig-40.12) con zonas: los cuatro acabados y lo que decide el precio.
# - Sin fórmula ni números que calcular (sección de criterio). Paso práctico: «tocar» el acabado para un BGA.
leccion: cap40/sec-40.8

libro:
  222: "un fichero por capa (cobre, máscara, serigrafía, pasta) más el de contorno"
  223: "Fichero de taladro (Excellon), con posiciones, diámetros y qué taladros son metalizados y cuáles no"
  224: "Notas de fabricación: espesor, material, número de capas, acabado, color de máscara, clase IPC"
  225: "el formato ODB++ o IPC-2581, que reúne todo en un solo fichero"
  227: "La norma IPC-6012 define tres clases según la exigencia"
  228: "Aeroespacial, médico, automoción"
  229: "pedir clase 3 cuando basta la 2 multiplica el coste sin aportar nada"
  230: "Diseñar dentro de las capacidades estándar (no las mínimas)"
  233: "la superficie no queda plana, lo que dificulta el montaje de encapsulados de paso fino"
  234: "superficie plana, excelente para paso fino y para contactos"
  235: "una vez abierto conviene montar la placa en pocos días"
  236: "alternativas planas de coste intermedio"
  237: "HASL para prototipos con componentes de paso normal, ENIG en cuanto haya paso fino o BGA, y OSP en producción con montaje inmediato"
  239: "hay que llegar a cero avisos, marcando explícitamente las excepciones intencionadas"
  240: "detecta capas invertidas, máscaras ausentes y contornos mal definidos"
  243: "Área de la placa."
  244: "cuatro capas suele salir mejor que dos en cuanto el circuito tenga alguna complejidad"
  246: "inspección visual con lupa"
  247: "el fabricante debe entregar el cupón de prueba con su medida"
  248: "Los cuatro acabados superficiales y lo que decide el precio de una placa"

modelo: { valores: {}, calculos: {} }

tarjetas:
  - id: explore-acabados
    tipo: explorar
    titulo: "Los cuatro acabados"
    texto: "El cobre desnudo se oxida: las almohadillas llevan un acabado. Toque los cuatro."
    libro: [233, 234, 235, 236, 248]
    widget:
      tipo: figura
      figura: fig-40.12
      zonas:
        - { id: hasl, rotulo: "HASL", rect: [5, 19, 214, 37], texto: "Estaño fundido soplado: el más barato, con la superficie no plana." }
        - { id: enig, rotulo: "ENIG", rect: [5, 61, 214, 37], texto: "Níquel y oro por inmersión: plano, para paso fino y contactos; más caro." }
        - { id: osp, rotulo: "OSP", rect: [5, 103, 214, 37], texto: "Recubrimiento orgánico: barato y plano, con vida limitada." }
        - { id: plata, rotulo: "Plata o estaño", rect: [5, 145, 214, 37], texto: "Por inmersión: alternativas planas de coste intermedio." }
    requiere: { mover: [hasl, enig, osp, plata] }

  - id: toque-bga
    tipo: tocar
    titulo: "Una placa con un BGA"
    texto: "La placa lleva un BGA y componentes de paso fino. Toque el acabado que elige el libro."
    libro: [233, 234, 235, 237]
    widget:
      tipo: figura
      figura: fig-40.12
      zonas:
        - { id: hasl, rotulo: "Primer recuadro de la izquierda", rect: [5, 19, 214, 37] }
        - { id: enig, rotulo: "Segundo recuadro de la izquierda", rect: [5, 61, 214, 37] }
        - { id: osp, rotulo: "Tercer recuadro de la izquierda", rect: [5, 103, 214, 37] }
    tocar:
      bien: [enig]
      porque:
        hasl: "Su superficie no queda plana y dificulta el paso fino: es para prototipos de paso normal."
        osp: "Plano, pero de vida limitada: para producción con montaje inmediato."
    exito: "ENIG: superficie plana, para paso fino y BGA."
    escalera:
      - "Hace falta una superficie plana que se conserve."
    solucion: "ENIG, el segundo recuadro."

  - id: empareje-ficheros
    tipo: pregunta
    titulo: "Lo que se envía a fabricar"
    texto: "Empareje cada fichero con lo que contiene."
    libro: [222, 223, 224, 225]
    emparejar:
      - ["Gerbers", "Un fichero por capa, más el contorno"]
      - ["Excellon", "Posiciones, diámetros y si se metalizan"]
      - ["Notas de fabricación", "Espesor, material, acabado, clase"]
      - ["ODB++ o IPC-2581", "Todo en un solo fichero"]
    exito: "Lo ambiguo se resuelve en la fábrica con suposiciones: mejor no dejar nada ambiguo."
    pistas:
      - { texto: "Excellon es el formato de los taladros." }
    escalera:
      - "Las notas recogen lo que no es geometría."
    solucion: "Gerbers, capas; Excellon, taladros; notas, espesor y acabado; ODB++, todo junto."

  - id: empareje-clases
    tipo: pregunta
    titulo: "Las clases IPC"
    texto: "Empareje cada clase de la IPC-6012 con su aplicación."
    libro: [227, 228]
    emparejar:
      - ["Clase 1", "Electrónica de consumo básica"]
      - ["Clase 2", "Industrial y general"]
      - ["Clase 3", "Aeroespacial, médico, automoción"]
    exito: "Tolerancias amplias, las habituales y estrictas."
    pistas:
      - { texto: "La más estricta es para lo que no puede fallar." }
    escalera:
      - "La clase 2 es lo habitual."
    solucion: "1, consumo básica; 2, industrial; 3, aeroespacial, médico y automoción."

  - id: porque-clase
    tipo: porque
    titulo: "Clase 3 por si acaso"
    texto: "¿Por qué no pedir clase 3 por prudencia, si basta la 2?"
    libro: [229, 230]
    widget:
      tipo: figura
      figura: fig-40.12
      zonas:
        - { id: clase, rotulo: "Recuadro rojo de la derecha", rect: [233, 103, 213, 37] }
    opciones:
      - texto: "Multiplica el coste sin aportar nada"
        bien: true
        porque: "La clase se elige por la aplicación; y se diseña dentro de las capacidades estándar."
      - texto: "Porque la clase 3 es peor"
        porque: "Es más estricta, no peor; lo malo es pagarla sin necesitarla."
      - texto: "Porque ningún fabricante la hace"
        porque: "La hacen, para aeroespacial, médico y automoción."
    escalera:
      - "Mire qué dice el recuadro rojo sobre el coste."
    solucion: "Porque multiplica el coste sin aportar nada."

  - id: pregunta-drc
    tipo: pregunta
    titulo: "La comprobación de reglas"
    texto: "El DRC da tres avisos de separación que son intencionados. ¿Qué se hace?"
    libro: [239]
    widget:
      tipo: figura
      figura: fig-40.12
      zonas:
        - { id: especiales, rotulo: "Recuadro naranja de la derecha", rect: [233, 145, 213, 37] }
    opciones:
      - texto: "Marcarlos como excepciones y llegar a cero avisos"
        bien: true
        porque: "Como con el ERC del esquema: cero avisos, con las excepciones explícitas."
      - texto: "Dejarlos: ya se sabe que son intencionados"
        porque: "Entre tres avisos conocidos se esconde fácilmente uno nuevo que no lo es."
      - texto: "Desactivar esa regla"
        porque: "Dejaría pasar las separaciones que sí son errores."
    escalera:
      - "Es lo mismo que se hace con el ERC."
    solucion: "Cero avisos, marcando las excepciones intencionadas."

  - id: pregunta-visor
    tipo: pregunta
    titulo: "El visor independiente"
    texto: "¿Qué detecta abrir los Gerbers en un visor independiente?"
    libro: [240]
    widget:
      tipo: figura
      figura: fig-40.12
      zonas:
        - { id: hasl, rotulo: "Recuadro HASL", rect: [5, 19, 214, 37] }
    opciones:
      - texto: "Capas invertidas, máscaras ausentes y contornos mal definidos"
        bien: true
        porque: "Es la única forma de ver lo que la fábrica va a ver."
      - texto: "Las separaciones por debajo de las reglas"
        porque: "Eso lo hace el DRC."
      - texto: "Que la huella coincide con el patillaje"
        porque: "Eso se coteja con la hoja de datos; el visor no lo sabe."
    escalera:
      - "Son errores de los ficheros, no del dibujo."
    solucion: "Capas invertidas, máscaras ausentes y contornos mal definidos."

  - id: ordene-precio
    tipo: pregunta
    titulo: "Lo que decide el precio"
    texto: "Ordene los factores del precio de una placa, del que más pesa al que menos."
    libro: [243, 248]
    widget:
      tipo: figura
      figura: fig-40.12
      zonas:
        - { id: precio, rotulo: "Lo que decide el precio", rect: [233, 0, 216, 185] }
    ordenar:
      - "Área de la placa."
      - "Número de capas."
      - "Cantidad."
      - "Plazo."
      - "Acabado y clase."
      - "Requisitos especiales."
    exito: "El salto de 2 a 4 capas es el mayor de los de las capas."
    pistas:
      - { texto: "Primero lo que se paga por superficie y por capa." }
    escalera:
      - "El área va la primera; la impedancia controlada y las vías ciegas, al final."
    solucion: "Área, capas, cantidad, plazo, acabado y clase, requisitos especiales."

  - id: predecir-capas
    tipo: predecir
    titulo: "Dos o cuatro capas"
    texto: "Un circuito con alguna complejidad. Cuatro capas cuestan más por placa: ¿qué suele salir mejor?"
    libro: [243, 244]
    widget:
      tipo: figura
      figura: fig-40.12
      zonas:
        - { id: capas, rotulo: "Primer recuadro de la derecha", rect: [233, 19, 213, 37] }
    opciones:
      - texto: "Cuatro capas"
        bien: true
        porque: "El plano de masa continuo resuelve problemas que en dos capas cuestan tiempo, revisiones y componentes."
      - texto: "Dos capas, porque son más baratas"
        porque: "La placa sí; los problemas de retorno que trae se pagan en revisiones y componentes."
      - texto: "Da igual"
        porque: "El salto de 2 a 4 capas es el mayor en precio, y también en comportamiento."
    escalera:
      - "Cuente también lo que cuestan las revisiones."
    solucion: "Cuatro capas, por el plano de masa continuo."

  - id: pregunta-recibir
    tipo: pregunta
    titulo: "Al recibir las placas"
    texto: "Llegan las placas. ¿Qué se comprueba antes de montar?"
    libro: [246, 247]
    widget:
      tipo: figura
      figura: fig-40.12
      zonas:
        - { id: especiales, rotulo: "Recuadro naranja de la derecha", rect: [233, 145, 213, 37] }
    opciones:
      - texto: "Lupa, continuidad de las alimentaciones y resistencia alta entre raíles y masa"
        bien: true
        porque: "Y con impedancia controlada, el cupón de prueba con su medida."
      - texto: "Nada: el fabricante ya las ha probado"
        porque: "Grietas, pistas rotas o un corto entre raíles se ven antes de montar, no después."
      - texto: "Solo que el color de la máscara es el pedido"
        porque: "Lo que importa es lo eléctrico: continuidad y aislamiento entre raíles."
    escalera:
      - "Mire con lupa y mida entre los raíles y masa."
    solucion: "Inspección con lupa, continuidad y resistencia entre raíles y masa; el cupón si hay impedancia."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [222, 229, 237, 240]
    ideas:
      - { titulo: "Los ficheros.", texto: "Gerbers por capa, taladros Excellon y notas; o todo en ODB++." }
      - { titulo: "La clase.", texto: "Por la aplicación: la 3 sin necesitarla multiplica el coste." }
      - { titulo: "El acabado.", texto: "HASL en prototipos; ENIG con paso fino o BGA; OSP con montaje inmediato." }
      - { titulo: "Verificar.", texto: "DRC a cero y Gerbers en un visor independiente." }
