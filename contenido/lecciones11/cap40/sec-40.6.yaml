# Lección 1.2 de la sección 41.6 «Desacoplo: el Condensador en el Sitio Correcto» (cap40, sec-40.6).
# Formato: contenido/lecciones11/GUIA.md.
# - La figura 41.10 (fig-40.10) viva: |Z| del mismo 100 nF con los tres lazos de la figura (0,8, 2 y 10 nH), con la
#   ESR de 20 mΩ de un cerámico del problema 42.B (cap41#335): |Z| = √(ESR² + (2πfL − 1/(2πfC))²). Resonancias de
#   17,8, 11,3 y 5,03 MHz, como en la figura.
# - La resonancia f = 1/(2π√(LC)) es la del problema 42.B (cap41#334).
# - Sin fórmula propia de la sección (se cita la del problema 42.B en la tarjeta «simular»).
# Paso práctico: «simular» la resonancia del 100 nF con pista corta y vía (2 nH): 11,3 MHz (errores: solo la vía,
# 0,8 nH; sin el 2π).
leccion: cap40/sec-40.6

libro:
  165: "Esa corriente no puede venir de la fuente, porque el camino tiene inductancia y no responde en nanosegundos"
  166: "es un depósito local que la suministra"
  167: "lo que importe no sea su capacidad sino la inductancia del bucle"
  170: "milímetros, no centímetros"
  171: "unos 1,3 nH si atraviesa una placa de 1,6 mm"
  172: "pistas cortas y anchas hacia las vías, nunca un cuello largo y fino"
  174: "Vía al lado de la almohadilla, no al final de una pista"
  175: "la inductancia se reduce casi a la mitad"
  176: "El condensador en la misma cara que el integrado"
  178: "por encima de la cual se comporta como una bobina"
  179: "100 nF para el grueso, 1 nF o 10 nF para frecuencias más altas"
  180: "puede crear antirresonancias entre ellos"
  181: "tiende a usar varios del mismo valor en lugar de valores escalonados"
  184: "Con un dieléctrico de 0,1 mm, la capacidad es de aproximadamente 40 pF por centímetro cuadrado"
  186: "el condensador acaba a dos centímetros con una pista fina"
  187: "colocarlo antes que nada al empezar el trazado"
  189: "osciloscopio en acoplamiento AC sobre el pin de alimentación del integrado, con masa corta"
  190: "Comparar el mismo circuito con el condensador cerca y a dos centímetros"
  191: "Un lazo largo encierra más área y añade inductancia"
  192: "Impedancia del mismo condensador con tres montajes distintos"
  "cap40#108": "0,8 nH por milímetro"
  "cap40#153": "unos 20 pF por centímetro cuadrado"
  "cap41#334": 'f_("ar") = (1)/(2 π sqrt("2 nH" times "0,99 nF"))'
  "cap41#335": "Con ESR de 10 a 20 mΩ en los cerámicos"

modelo:
  valores:
    C_d: { sim: "C", nombre: "condensador de desacoplo", unidad: F, valor: 100e-9 }
    L_m: { sim: "L", nombre: "inductancia del lazo", unidad: H, valor: 2e-9 }
    esr: { sim: "ESR", nombre: "resistencia serie de un cerámico", unidad: Ω, valor: 0.02 }
  calculos:
    f_r: { expr: "1/(2*pi*sqrt(L_m*C_d))", sim: "f_{r}", nombre: "autorresonancia", unidad: Hz }
    fr_via: { expr: "1/(2*pi*sqrt(0.8e-9*C_d))", sim: "f_{r}", nombre: "con solo la vía", unidad: Hz }
    fr_sin2pi: { expr: "1/sqrt(L_m*C_d)", sim: "f", nombre: "sin el 2π", unidad: Hz }

tarjetas:
  - id: explore-lazo
    tipo: explorar
    titulo: "Lejos o pegado"
    texto: "El mismo condensador, lejos del integrado y pegado a sus pines. Toque los dos lazos."
    libro: [167, 191]
    widget:
      tipo: figura
      figura: fig-40.9
      zonas:
        - { id: lejos, rotulo: "Lazo de la izquierda", rect: [92, 84, 108, 56], texto: "Pistas largas y finas: el lazo encierra mucha área, añade inductancia y anula el desacoplo a alta frecuencia." }
        - { id: pegado, rotulo: "Lazo de la derecha", rect: [312, 78, 60, 40], texto: "Vía junto a la almohadilla y condensador pegado: lazo mínimo, baja inductancia, desacoplo eficaz." }
    requiere: { mover: [lejos, pegado] }

  - id: pregunta-deposito
    tipo: pregunta
    titulo: "Qué hace realmente"
    texto: "Un integrado digital toma corriente en pulsos de nanosegundos. ¿Por qué no puede tomarla de la fuente?"
    libro: [165, 166]
    widget:
      tipo: figura
      figura: fig-40.9
      zonas:
        - { id: pegado, rotulo: "Lazo de la derecha", rect: [312, 78, 60, 40] }
    opciones:
      - texto: "El camino hasta la fuente tiene inductancia y no responde en nanosegundos"
        bien: true
        porque: "El condensador es un depósito local que la suministra y luego se recarga despacio."
      - texto: "La fuente no da tanta corriente"
        porque: "La corriente media la da; lo que no puede es seguir los pulsos rápidos."
      - texto: "Sí puede, si las pistas son anchas"
        porque: "Una pista ancha tiene menos resistencia, pero el camino sigue teniendo inductancia."
    escalera:
      - "¿Qué se opone a los cambios rápidos de corriente?"
    solucion: "La inductancia del camino: por eso hace falta un depósito local."

  - id: porque-bucle
    tipo: porque
    titulo: "Lo que importa"
    texto: "¿Qué decide si un condensador de desacoplo sirve?"
    libro: [167]
    widget:
      tipo: figura
      figura: fig-40.9
      zonas:
        - { id: lejos, rotulo: "Lazo de la izquierda", rect: [92, 84, 108, 56] }
    opciones:
      - texto: "La inductancia del bucle que forma con el integrado"
        bien: true
        porque: "Condensador, vías, planos y pines: todo está en serie con la capacidad."
      - texto: "Su capacidad: cuanto más grande, mejor"
        porque: "No es la capacidad: con mucha inductancia en el bucle, la capacidad no llega."
      - texto: "Su tensión nominal"
        porque: "La tensión nominal debe bastar, pero no decide el desacoplo a alta frecuencia."
    escalera:
      - "Mire el área encerrada por el lazo de la izquierda."
    solucion: "La inductancia del bucle, no la capacidad."

  - id: explore-montajes
    tipo: explorar
    titulo: "Tres montajes del mismo 100 nF"
    texto: "Cambie el lazo del condensador y mire dónde queda su resonancia. Por encima, es una bobina."
    libro: [178, 192, "cap41#335"]
    widget:
      tipo: grafica
      x: { id: nu, min: 100000, max: 1000000000, unidad: Hz, rotulo: "f", escala: log }
      y: { min: 0.01, max: 1000, unidad: Ω, rotulo: "|Z|", escala: log }
      curvas:
        - { expr: "sqrt(esr^2 + (2*pi*nu*L_m - 1/(2*pi*nu*C_d))^2)", color: naranja, rotulo: "|Z| del desacoplo" }
      marcas:
        - { x: "f_r", y: "esr", rotulo: "{{f_r}}" }
      lectura: { valor: f_r, rotulo: "Autorresonancia" }
      mandos:
        - { valor: L_m, lista: [0.8e-9, 2e-9, 10e-9], nombres: ["vía junto", "pista corta y vía", "a dos centímetros"], rotulo: "Montaje" }
    requiere: { mover: [L_m] }

  - id: simule-resonancia
    tipo: simular
    titulo: "Prediga la resonancia"
    texto: "Un 100 nF con pista corta y vía: 2 nH de lazo. ¿A qué frecuencia resuena?"
    libro: [179, "cap40#108", "cap41#334"]
    fijar: { C_d: 100e-9, L_m: 2e-9 }
    widget:
      tipo: grafica
      x: { id: nu, min: 100000, max: 1000000000, unidad: Hz, rotulo: "f", escala: log }
      y: { min: 0.01, max: 1000, unidad: Ω, rotulo: "|Z|", escala: log }
      curvas:
        - { expr: "sqrt(esr^2 + (2*pi*nu*L_m - 1/(2*pi*nu*C_d))^2)", color: naranja, rotulo: "|Z|" }
      lectura: { valor: f_r, rotulo: "Autorresonancia" }
      ocultar: true
    simular:
      objetivo: f_r
      unidad: Hz
      tol: 0.05
      rotulo: "Autorresonancia, f_{r}"
      errores:
        - { expr: "fr_via", texto: "Ha usado solo los 0,8 nH de la vía junto a la almohadilla: la pista corta añade inductancia." }
        - { expr: "fr_sin2pi", texto: "Ha olvidado el 2π: f = 1/(2π√(LC))." }
    exito: "Unos 11 MHz: por encima, ese 100 nF ya es una bobina."
    escalera:
      - "f = 1/(2π√(LC)) con L = 2 nH y C = 100 nF."
    solucion: "1/(2π√(2 nH × 100 nF)) = 11,3 MHz."
    comprobar:
      - { f_r: 11.25e6, fr_via: 17.8e6, fr_sin2pi: 70.7e6, tol: 0.01 }

  - id: toque-dos-vias
    tipo: tocar
    titulo: "Las reglas de trazado"
    texto: "Toque la regla que reduce la inductancia casi a la mitad."
    libro: [174, 175, 176, 181]
    widget:
      tipo: figura
      figura: fig-40.10
      zonas:
        - { id: via, rotulo: "Primer recuadro", rect: [262, 26, 180, 36] }
        - { id: dos, rotulo: "Segundo recuadro", rect: [262, 63, 180, 42] }
        - { id: cara, rotulo: "Tercer recuadro", rect: [262, 107, 180, 35] }
        - { id: iguales, rotulo: "Cuarto recuadro", rect: [262, 141, 180, 38] }
    tocar:
      bien: [dos]
      porque:
        via: "La vía al lado de la almohadilla acorta el lazo, pero la regla de la mitad es otra."
        cara: "En la misma cara que el integrado evita atravesar la placa; no divide la inductancia."
        iguales: "Varios del mismo valor evitan antirresonancias."
    exito: "Dos vías por terminal: algo menos de la mitad, por el acoplamiento entre ellas."
    escalera:
      - "Dos caminos en paralelo reparten la inductancia."
    solucion: "Dos vías por terminal en las posiciones críticas."

  - id: empareje-bucle
    tipo: pregunta
    titulo: "Lo que alarga el bucle"
    texto: "Empareje cada elemento del bucle con su regla."
    libro: [170, 171, 172]
    emparejar:
      - ["Distancia al pin", "Milímetros, no centímetros"]
      - ["Las vías", "Unos 1,3 nH cada una: la mayor contribución"]
      - ["Las almohadillas", "Pistas cortas y anchas, nunca un cuello fino"]
    exito: "Las vías suelen ser lo que más pesa: cortas y junto a las almohadillas."
    pistas:
      - { texto: "Una vía que atraviesa 1,6 mm ya tiene 1,3 nH." }
    escalera:
      - "Lo que se pasa por alto son las vías."
    solucion: "Distancia, milímetros; vías, 1,3 nH; almohadillas, cortas y anchas."

  - id: pregunta-valores
    tipo: pregunta
    titulo: "Varios valores o varios iguales"
    texto: "¿Por qué la práctica moderna usa varios condensadores del mismo valor en lugar de valores escalonados?"
    libro: [178, 180, 181]
    widget:
      tipo: figura
      figura: fig-40.10
      zonas:
        - { id: iguales, rotulo: "Cuarto recuadro", rect: [262, 141, 180, 38] }
    opciones:
      - texto: "Muchos valores distintos crean antirresonancias entre ellos"
        bien: true
        porque: "Picos de impedancia en las frecuencias intermedias; los iguales son más predecibles."
      - texto: "Porque son más baratos"
        porque: "La razón es eléctrica: evitar los picos de impedancia."
      - texto: "Porque un solo valor cubre todas las frecuencias"
        porque: "Un valor solo cubre una banda; por eso se usan varios en paralelo."
    escalera:
      - "Entre dos resonancias distintas puede aparecer un pico."
    solucion: "Para evitar antirresonancias entre valores distintos."

  - id: pregunta-plano
    tipo: predecir
    titulo: "El plano como desacoplo"
    texto: "Con 0,2 mm de dieléctrico, los planos dan unos 20 pF por cm². ¿Y con 0,1 mm?"
    libro: [184, "cap40#153"]
    widget:
      tipo: figura
      figura: fig-40.10
      zonas:
        - { id: grafica, rotulo: "La gráfica", rect: [35, 20, 210, 180] }
    opciones:
      - texto: "Unos 40 pF por cm²"
        bien: true
        porque: "Más cerca los planos, más capacidad; y sin ninguna inductancia de conexión."
      - texto: "Unos 10 pF por cm²"
        porque: "Al acercar los planos la capacidad sube, no baja."
      - texto: "Lo mismo: depende solo del área"
        porque: "Depende del área y de la distancia entre los planos."
    escalera:
      - "Un condensador plano: capacidad inversa a la distancia."
    solucion: "Unos 40 pF por centímetro cuadrado."

  - id: pregunta-error
    tipo: pregunta
    titulo: "El error más frecuente"
    texto: "En el esquema el condensador está junto al integrado; en la placa, a dos centímetros. ¿Cómo se evita?"
    libro: [186, 187]
    widget:
      tipo: figura
      figura: fig-40.9
      zonas:
        - { id: lejos, rotulo: "Lazo de la izquierda", rect: [92, 84, 108, 56] }
    opciones:
      - texto: "Colocándolo antes que nada al empezar el trazado"
        bien: true
        porque: "Y dibujándolo junto a su integrado en el esquema, para que quien trace lo recuerde."
      - texto: "Con una pista ancha hasta él"
        porque: "Sigue lejos: el lazo encierra la misma área."
      - texto: "Con un condensador más grande"
        porque: "Lo que falla es la inductancia del lazo, no la capacidad."
    escalera:
      - "El esquema no impone posiciones."
    solucion: "Colocarlo primero, pegado al pin."

  - id: pregunta-banco
    tipo: pregunta
    titulo: "En el banco"
    texto: "¿Cómo se comprueba si el desacoplo cumple?"
    libro: [189, 190]
    widget:
      tipo: figura
      figura: fig-40.9
      zonas:
        - { id: pegado, rotulo: "Lazo de la derecha", rect: [312, 78, 60, 40] }
    opciones:
      - texto: "Osciloscopio en AC sobre el pin de alimentación, con masa corta"
        bien: true
        porque: "Aparece el ruido de conmutación; con el condensador cerca y a dos centímetros la diferencia es clara."
      - texto: "Midiendo la capacidad con el polímetro"
        porque: "La capacidad no dice nada del lazo."
      - texto: "Con el multímetro en continua en el pin"
        porque: "La continua no ve los pulsos de nanosegundos."
    escalera:
      - "Se mide el ruido donde lo ve el integrado."
    solucion: "Osciloscopio en AC en el pin, con masa corta."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [167, 175, 181, 187]
    ideas:
      - { titulo: "El bucle.", texto: "Lo que importa es su inductancia, no la capacidad." }
      - { titulo: "Pegado.", texto: "Vía junto a la almohadilla; dos vías por terminal en lo crítico." }
      - { titulo: "Resonancia.", texto: "Por encima, el condensador es una bobina; el lazo la decide." }
      - { titulo: "Iguales.", texto: "Varios del mismo valor evitan antirresonancias." }
