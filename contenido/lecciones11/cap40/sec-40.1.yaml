# Lección 1.2 de la sección 41.1 «Del Esquema a la Placa» (cap40, sec-40.1). Formato: contenido/lecciones11/GUIA.md.
# 1.2.1 (autor121-pc, «aprender haciendo», GUIA §13): las capas, el apilado recomendado y las comprobaciones antes de
# fabricar se tocan en la figura 41.1; la idea de fondo y la colocación, en el resumen de la figura 41.15; el peso del
# cobre se elige en una gráfica (onzas → µm, bloques 14 y 94). Quedan una pregunta de opciones (el grabado) y el
# emparejamiento de los parámetros.
leccion: cap40/sec-40.1

libro:
  3: "una placa las realiza con conductores reales, que tienen resistencia, inductancia y capacidad entre sí"
  4: "la placa no es un soporte, es un componente"
  7: "fibra de vidrio impregnada en resina epoxi"
  8: "su resolución limita la anchura de pista y la separación mínimas"
  9: "Los taladros se hacen mecánicamente y se metalizan para conectar capas"
  11: "El acabado protege el cobre expuesto"
  14: "1 oz son 35 µm"
  15: "El espesor total, típicamente 1,6 mm"
  16: "La constante dieléctrica del FR4, alrededor de 4,5"
  17: "diseñar por debajo de ellas encarece o impide la fabricación"
  20: "Dos capas: barato, y sin plano de masa continuo"
  21: "tener un plano de masa continuo resuelve por sí solo la mayoría de los problemas de retorno"
  22: "Seis o más: cuando hay muchas señales o hace falta control de impedancia riguroso"
  23: "en cuanto haya señales rápidas o un microcontrolador con reloj apreciable, cuatro capas"
  25: "determina el 80 % de la calidad del resultado"
  31: "Imprimir la placa a escala 1:1 y colocar encima los componentes reales"
  32: "es la única forma de ver lo que el fabricante va a recibir"
  "cap40#94": "en placas de potencia se llega a 105 o 140 µm"

modelo:
  valores:
    oz: { sim: "oz", nombre: "peso del cobre, en onzas por pie cuadrado", unidad: "", valor: 1 }
    e_1: { sim: "e_{1 oz}", nombre: "espesor de una onza", unidad: m, valor: 0.000035 }
  calculos:
    e_cu: { expr: "oz*e_1", sim: "e", nombre: "espesor del cobre", unidad: m, cifras: 3 }

tarjetas:
  - id: toque-planos
    tipo: tocar
    titulo: "Lo que tiene la de cuatro"
    texto: "La placa de dos capas no tiene una de las capas del apilado de cuatro, y es la que lo cambia todo. Tóquela."
    libro: [20, 21]
    widget:
      tipo: figura
      figura: fig-40.1
      recorte: [152, 0, 146, 160]
      ampliar: 1.35
      zonas:
        - { id: s1, rotulo: "Primera capa del centro", rect: [160, 24, 105, 16] }
        - { id: masa, rotulo: "Segunda capa del centro", rect: [160, 40, 105, 22] }
        - { id: alim, rotulo: "Tercera capa del centro", rect: [160, 62, 105, 22] }
        - { id: s2, rotulo: "Cuarta capa del centro", rect: [160, 84, 105, 16] }
    tocar:
      bien: [masa]
      porque:
        s1: "La de dos capas también tiene una capa de señal arriba."
        s2: "La de dos capas también tiene una capa de señal abajo."
        alim: "También es un plano, pero el salto lo da el otro: el que ofrece el retorno a todas las señales."
    exito: "El plano de masa continuo: resuelve por sí solo la mayoría de los problemas de retorno."
    escalera:
      - "Busque el plano por el que vuelven las corrientes de las señales."
    solucion: "La segunda capa, el plano de masa."

  - id: toque-cuatro
    tipo: tocar
    titulo: "Con un microcontrolador"
    texto: "Una placa con un microcontrolador de reloj apreciable. Toque el número de capas que recomienda el libro."
    libro: [20, 22, 23]
    widget:
      tipo: figura
      figura: fig-40.1
      zonas:
        - { id: dos, rotulo: "Recuadro de la izquierda", rect: [4, 3, 150, 155] }
        - { id: cuatro, rotulo: "Recuadro del centro", rect: [154, 3, 146, 155] }
        - { id: seis, rotulo: "Recuadro de la derecha", rect: [303, 3, 145, 155] }
    tocar:
      bien: [cuatro]
      porque:
        dos: "Dos capas no tienen plano de masa continuo: solo valen para circuitos lentos y de baja potencia."
        seis: "Seis o más se reservan para muchas señales o control de impedancia riguroso."
    exito: "Cuatro capas: la diferencia de coste es pequeña y la de comportamiento, enorme."
    escalera:
      - "Busque el apilado que da un plano de masa continuo sin pasarse."
    solucion: "El del centro, cuatro capas."

  - id: explore-cobre
    tipo: explorar
    fase: "Consiga"
    titulo: "El cobre, en onzas"
    texto: "El cobre se mide en onzas por pie cuadrado. Una placa de potencia pide 105 µm: elija el peso de cobre que los da."
    libro: [14, "cap40#94"]
    inicio: { oz: 1 }
    widget:
      tipo: grafica
      x: { id: q, min: 0, max: 4.5, unidad: "", rotulo: "onzas por pie cuadrado" }
      y: { min: 0, max: 0.00016, unidad: m, rotulo: "espesor" }
      curvas:
        - { expr: "q*e_1", color: naranja, rotulo: "espesor del cobre" }
      marcas:
        - { x: "oz", y: "e_cu", rotulo: "{{e_cu}}" }
      lectura: { valor: e_cu, rotulo: "Espesor del cobre" }
      mandos:
        - { valor: oz, lista: [1, 2, 3, 4], rotulo: "Peso del cobre (oz)" }
    objetivo:
      condiciones:
        - { valor: e_cu, objetivo: 0.000105, tol: 0.01, rotulo: "Espesor: {{e_cu}}" }
      logrado: "{{oz}} oz: {{e_cu}}. Cada onza son 35 µm; más cobre, más corriente y menos resistencia."
      pistas:
        - { cuando: { valor: e_cu, mayor: 0.00011 }, texto: "Se ha pasado: menos onzas." }
        - { texto: "Falta cobre: cada onza añade 35 µm." }
    escalera:
      - "Una onza son 35 µm: ¿cuántas veces caben en 105?"
    solucion: "3 oz: 3 · 35 = 105 µm."
    comprobar:
      - { con: { oz: 3 }, e_cu: 0.000105 }

  - id: pregunta-grabado
    tipo: pregunta
    titulo: "Cómo se fabrica"
    texto: "¿Qué paso de la fabricación limita la anchura de pista y la separación mínimas?"
    libro: [7, 8, 9, 11]
    widget:
      tipo: figura
      figura: fig-40.1
      zonas:
        - { id: dos, rotulo: "Recuadro de dos capas", rect: [4, 3, 150, 155] }
    opciones:
      - texto: "El grabado, por su resolución"
        bien: true
        porque: "El grabado elimina el cobre que no forma parte del circuito, y su resolución fija lo más fino que se puede hacer."
      - texto: "Los taladros"
        porque: "Los taladros se hacen mecánicamente y se metalizan para conectar capas; limitan los agujeros, no las pistas."
      - texto: "El acabado"
        porque: "El acabado protege el cobre expuesto y decide planitud y soldabilidad, no la anchura."
    escalera:
      - "Las pistas son el cobre que queda tras quitar el resto."
    solucion: "El grabado: su resolución limita la anchura y la separación mínimas."

  - id: empareje-parametros
    tipo: pregunta
    titulo: "Los parámetros que hay que conocer"
    texto: "Empareje cada parámetro con su valor o su consecuencia."
    libro: [14, 15, 16, 17]
    emparejar:
      - ["Cobre de 1 onza", "35 µm de espesor"]
      - ["Espesor total típico", "1,6 mm"]
      - ["Constante dieléctrica del FR4", "Alrededor de 4,5"]
      - ["Diseñar bajo las reglas del fabricante", "Encarece o impide la fabricación"]
    exito: "El cobre fija corriente y resistencia; el espesor, la rigidez; la constante dieléctrica, la impedancia."
    pistas:
      - { texto: "La onza mide el cobre; los milímetros, la placa entera." }
    escalera:
      - "Una onza por pie cuadrado son unas decenas de micras."
    solucion: "1 oz, 35 µm; espesor, 1,6 mm; FR4, unos 4,5; por debajo de las reglas, más caro o imposible."

  - id: toque-idea
    tipo: tocar
    titulo: "El mismo esquema, otra placa"
    texto: "Dos placas del mismo esquema se comportan distinto con señales rápidas. Toque la idea que lo explica."
    libro: [3, 4]
    widget:
      tipo: figura
      figura: fig-40.15
      zonas:
        - { id: componente, rotulo: "Arriba a la izquierda", rect: [4, 4, 142, 44] }
        - { id: colocacion, rotulo: "Arriba en el centro", rect: [153, 4, 142, 44] }
        - { id: masa, rotulo: "Arriba a la derecha", rect: [302, 4, 142, 44] }
        - { id: vias, rotulo: "En medio a la izquierda", rect: [4, 53, 142, 44] }
        - { id: termico, rotulo: "En medio, en el centro", rect: [153, 53, 142, 44] }
        - { id: gerbers, rotulo: "En medio a la derecha", rect: [302, 53, 142, 44] }
    tocar:
      bien: [componente]
      porque:
        colocacion: "La colocación decide la calidad, pero aquí esquema y componentes son los mismos: cambian los conductores."
        masa: "El plano ayuda a los retornos; la razón de fondo es más general: los conductores son reales."
        vias: "Es un caso concreto. La idea general: todo conductor de la placa tiene resistencia, inductancia y capacidad."
        termico: "Lo térmico no explica una diferencia con señales rápidas."
        gerbers: "Habla de lo que se fabrica, no de cómo se comporta."
    exito: "Sus conductores tienen resistencia, inductancia y capacidad que el esquema no dibuja: la placa es un componente."
    escalera:
      - "¿Qué tiene una pista real que una línea del esquema no tiene?"
    solucion: "Arriba a la izquierda: la placa no es un soporte, es un componente."

  - id: toque-colocacion
    tipo: tocar
    titulo: "Antes de trazar nada"
    texto: "Un trazado excelente no arregla un error previo. Toque la decisión que fija el 80 % de la calidad."
    libro: [25]
    widget:
      tipo: figura
      figura: fig-40.15
      zonas:
        - { id: componente, rotulo: "Arriba a la izquierda", rect: [4, 4, 142, 44] }
        - { id: colocacion, rotulo: "Arriba en el centro", rect: [153, 4, 142, 44] }
        - { id: masa, rotulo: "Arriba a la derecha", rect: [302, 4, 142, 44] }
        - { id: termico, rotulo: "En medio, en el centro", rect: [153, 53, 142, 44] }
    tocar:
      bien: [colocacion]
      porque:
        componente: "Es la idea de fondo, no una decisión de diseño."
        masa: "El plano y su continuidad se deciden antes de trazar, pero no fijan el 80 %."
        termico: "La estrategia térmica también se decide antes; la que pesa el 80 % es otra."
    exito: "La colocación: un trazado excelente no arregla una colocación mala."
    escalera:
      - "Es lo que se hace antes de tirar la primera pista: dónde va cada pieza."
    solucion: "Arriba en el centro: la colocación."

  - id: toque-huella
    tipo: tocar
    fase: "En el banco"
    titulo: "Antes de enviar a fabricar"
    texto: "Una huella del tamaño equivocado no se ve en el ordenador. Toque la comprobación que la descubre."
    libro: [31, 32]
    widget:
      tipo: figura
      figura: fig-40.1
      zonas:
        - { id: imprimir, rotulo: "Abajo a la izquierda", rect: [4, 175, 219, 77] }
        - { id: gerbers, rotulo: "Abajo a la derecha", rect: [228, 175, 220, 77] }
    tocar:
      bien: [imprimir]
      porque:
        gerbers: "El visor enseña lo que recibirá el fabricante, pero una huella mal dimensionada solo se ve con el componente real encima."
    exito: "Impresa a escala 1:1, con los componentes reales encima: huellas, tamaños y acceso a los conectores."
    escalera:
      - "¿Con qué se compara una huella para saber si es del tamaño bueno?"
    solucion: "Abajo a la izquierda: imprimir 1:1 y poner encima los componentes reales."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [4, 23, 25, 32]
    ideas:
      - { titulo: "Un componente.", texto: "La placa no es un soporte: sus conductores tienen resistencia, inductancia y capacidad." }
      - { titulo: "Cuatro capas.", texto: "Con señales rápidas o un microcontrolador, el plano de masa continuo lo cambia todo." }
      - { titulo: "Colocación.", texto: "Decide el 80 % del resultado." }
      - { titulo: "Antes de fabricar.", texto: "Impresión 1:1 y Gerbers en un visor independiente." }
