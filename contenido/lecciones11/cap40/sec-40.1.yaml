# Lección 1.2 de la sección 41.1 «Del Esquema a la Placa» (cap40, sec-40.1). Formato: contenido/lecciones11/GUIA.md.
# - La figura 41.1 (fig-40.1) con zonas: dos, cuatro y seis capas, y las dos comprobaciones antes de fabricar.
# - Sin fórmula (la sección no tiene ecuaciones). Paso práctico: «tocar» el número de capas recomendado.
leccion: cap40/sec-40.1

libro:
  3: "una placa las realiza con conductores reales, que tienen resistencia, inductancia y capacidad entre sí"
  4: "la placa no es un soporte, es un componente"
  7: "fibra de vidrio impregnada en resina epoxi"
  8: "su resolución limita la anchura de pista y la separación mínimas"
  9: "Los taladros se hacen mecánicamente y se metalizan para conectar capas"
  11: "El acabado protege el cobre expuesto"
  14: "1 oz son 35 µm"
  15: "El espesor total, típicamente 1,6 mm"
  16: "La constante dieléctrica del FR4, alrededor de 4,5"
  17: "diseñar por debajo de ellas encarece o impide la fabricación"
  20: "Dos capas: barato, y sin plano de masa continuo"
  21: "tener un plano de masa continuo resuelve por sí solo la mayoría de los problemas de retorno"
  22: "Seis o más: cuando hay muchas señales o hace falta control de impedancia riguroso"
  23: "en cuanto haya señales rápidas o un microcontrolador con reloj apreciable, cuatro capas"
  25: "determina el 80 % de la calidad del resultado"
  31: "Imprimir la placa a escala 1:1 y colocar encima los componentes reales"
  32: "es la única forma de ver lo que el fabricante va a recibir"

modelo: { valores: {}, calculos: {} }

tarjetas:
  - id: explore-capas
    tipo: explorar
    titulo: "Dos, cuatro o seis capas"
    texto: "El número de capas es la primera decisión y condiciona todo lo demás. Toque cada recuadro."
    libro: [20, 21, 22]
    widget:
      tipo: figura
      figura: fig-40.1
      zonas:
        - { id: dos, rotulo: "Recuadro de dos capas", rect: [4, 3, 150, 155], texto: "Barato, y sin plano de masa continuo: aceptable en circuitos lentos y de baja potencia." }
        - { id: cuatro, rotulo: "Recuadro de cuatro capas", rect: [154, 3, 146, 155], texto: "Señal, masa, alimentación, señal. El plano de masa continuo resuelve por sí solo la mayoría de los problemas de retorno." }
        - { id: seis, rotulo: "Recuadro de seis o más", rect: [303, 3, 145, 155], texto: "Cuando hay muchas señales o hace falta control de impedancia riguroso." }
    requiere: { mover: [dos, cuatro, seis] }

  - id: predecir-componente
    tipo: predecir
    titulo: "El mismo esquema, otra placa"
    texto: "Dos placas del mismo esquema se comportan distinto con señales rápidas. ¿Por qué?"
    libro: [3, 4]
    widget:
      tipo: figura
      figura: fig-40.1
      zonas:
        - { id: capas, rotulo: "Los tres apilados", rect: [4, 3, 444, 155] }
    opciones:
      - texto: "Sus conductores tienen resistencia, inductancia y capacidad que el esquema no dibuja"
        bien: true
        porque: "A partir de cierta velocidad, esas propiedades importan tanto como los componentes: la placa es un componente."
      - texto: "Porque los componentes de una son peores"
        porque: "El esquema y los componentes son los mismos; lo que cambia son los conductores reales."
      - texto: "No puede ser: el esquema define el circuito"
        porque: "El esquema describe conexiones ideales; la placa las realiza con conductores reales."
    escalera:
      - "¿Qué tiene una pista real que una línea del esquema no tiene?"
    solucion: "Resistencia, inductancia y capacidad entre conductores: la placa no es un soporte, es un componente."

  - id: pregunta-grabado
    tipo: pregunta
    titulo: "Cómo se fabrica"
    texto: "¿Qué paso de la fabricación limita la anchura de pista y la separación mínimas?"
    libro: [7, 8, 9, 11]
    widget:
      tipo: figura
      figura: fig-40.1
      zonas:
        - { id: dos, rotulo: "Recuadro de dos capas", rect: [4, 3, 150, 155] }
    opciones:
      - texto: "El grabado, por su resolución"
        bien: true
        porque: "El grabado elimina el cobre que no forma parte del circuito, y su resolución fija lo más fino que se puede hacer."
      - texto: "Los taladros"
        porque: "Los taladros se hacen mecánicamente y se metalizan para conectar capas; limitan los agujeros, no las pistas."
      - texto: "El acabado"
        porque: "El acabado protege el cobre expuesto y decide planitud y soldabilidad, no la anchura."
    escalera:
      - "Las pistas son el cobre que queda tras quitar el resto."
    solucion: "El grabado: su resolución limita la anchura y la separación mínimas."

  - id: empareje-parametros
    tipo: pregunta
    titulo: "Los parámetros que hay que conocer"
    texto: "Empareje cada parámetro con su valor o su consecuencia."
    libro: [14, 15, 16, 17]
    emparejar:
      - ["Cobre de 1 onza", "35 µm de espesor"]
      - ["Espesor total típico", "1,6 mm"]
      - ["Constante dieléctrica del FR4", "Alrededor de 4,5"]
      - ["Diseñar bajo las reglas del fabricante", "Encarece o impide la fabricación"]
    exito: "El cobre fija corriente y resistencia; el espesor, la rigidez; la constante dieléctrica, la impedancia."
    pistas:
      - { texto: "La onza mide el cobre; los milímetros, la placa entera." }
    escalera:
      - "Una onza por pie cuadrado son unas decenas de micras."
    solucion: "1 oz, 35 µm; espesor, 1,6 mm; FR4, unos 4,5; por debajo de las reglas, más caro o imposible."

  - id: toque-cuatro
    tipo: tocar
    titulo: "Con un microcontrolador"
    texto: "Una placa con un microcontrolador de reloj apreciable. Toque el número de capas que recomienda el libro."
    libro: [20, 22, 23]
    widget:
      tipo: figura
      figura: fig-40.1
      zonas:
        - { id: dos, rotulo: "Recuadro de la izquierda", rect: [4, 3, 150, 155] }
        - { id: cuatro, rotulo: "Recuadro del centro", rect: [154, 3, 146, 155] }
        - { id: seis, rotulo: "Recuadro de la derecha", rect: [303, 3, 145, 155] }
    tocar:
      bien: [cuatro]
      porque:
        dos: "Dos capas no tienen plano de masa continuo: solo valen para circuitos lentos y de baja potencia."
        seis: "Seis o más se reservan para muchas señales o control de impedancia riguroso."
    exito: "Cuatro capas: la diferencia de coste es pequeña y la de comportamiento, enorme."
    escalera:
      - "Busque el apilado que da un plano de masa continuo sin pasarse."
    solucion: "El del centro, cuatro capas."

  - id: porque-plano
    tipo: porque
    titulo: "El salto cualitativo"
    texto: "¿Por qué pasar de dos a cuatro capas cambia tanto el comportamiento?"
    libro: [21]
    widget:
      tipo: figura
      figura: fig-40.1
      zonas:
        - { id: cuatro, rotulo: "Recuadro de cuatro capas", rect: [154, 3, 146, 155] }
    opciones:
      - texto: "Porque un plano de masa continuo resuelve la mayoría de los problemas de retorno"
        bien: true
        porque: "Es lo que da la capa de masa interna, y lo hace sin diseñarlo pista a pista."
      - texto: "Porque caben el doble de pistas"
        porque: "Caben más, pero el salto viene del plano de masa, no del espacio."
      - texto: "Porque el cobre es más grueso"
        porque: "El número de capas no cambia el espesor de cobre de cada una."
    escalera:
      - "Mire qué hay en la segunda capa del recuadro de cuatro."
    solucion: "El plano de masa continuo, que resuelve por sí solo la mayoría de los problemas de retorno."

  - id: pregunta-colocacion
    tipo: pregunta
    titulo: "Antes de trazar nada"
    texto: "¿Qué decisión determina el 80 % de la calidad del resultado?"
    libro: [25]
    widget:
      tipo: figura
      figura: fig-40.1
      zonas:
        - { id: capas, rotulo: "Los tres apilados", rect: [4, 3, 444, 155] }
    opciones:
      - texto: "La colocación de los componentes"
        bien: true
        porque: "Un trazado excelente no arregla una colocación mala."
      - texto: "El trazado de las pistas"
        porque: "El trazado viene después y no compensa una colocación mala."
      - texto: "El color de la máscara"
        porque: "La máscara protege; no decide el comportamiento eléctrico."
    escalera:
      - "Es lo que se hace antes de tirar la primera pista."
    solucion: "La colocación: el 80 % de la calidad."

  - id: pregunta-gerbers
    tipo: pregunta
    titulo: "Antes de enviar a fabricar"
    texto: "¿Por qué abrir los Gerbers en un visor distinto del programa que los generó?"
    libro: [31, 32]
    widget:
      tipo: figura
      figura: fig-40.1
      zonas:
        - { id: imprimir, rotulo: "Abajo a la izquierda", rect: [4, 175, 219, 77], texto: "Imprimir la placa a escala 1:1 y colocar encima los componentes reales." }
        - { id: gerbers, rotulo: "Abajo a la derecha", rect: [228, 175, 220, 77], texto: "Abrir los Gerbers en un visor independiente." }
    opciones:
      - texto: "Es la única forma de ver lo que recibirá el fabricante"
        bien: true
        porque: "El visor enseña lo que se envía, no lo que uno cree haber dibujado."
      - texto: "Porque el programa de diseño no sabe abrirlos"
        porque: "Sí sabe; el problema es que enseña lo que uno dibujó."
      - texto: "Para comprobar las huellas con los componentes reales"
        porque: "Eso es la otra comprobación: imprimir a escala 1:1 y poner encima los componentes."
    escalera:
      - "¿Qué recibe la fábrica: el dibujo o los ficheros?"
    solucion: "Para ver lo que el fabricante va a recibir, y no lo que uno cree haber dibujado."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [4, 23, 25, 32]
    ideas:
      - { titulo: "Un componente.", texto: "La placa no es un soporte: sus conductores tienen resistencia, inductancia y capacidad." }
      - { titulo: "Cuatro capas.", texto: "Con señales rápidas o un microcontrolador, el plano de masa continuo lo cambia todo." }
      - { titulo: "Colocación.", texto: "Decide el 80 % del resultado." }
      - { titulo: "Antes de fabricar.", texto: "Impresión 1:1 y Gerbers en un visor independiente." }
