# Lección 1.2 de la sección 41.5 «Planos de Masa y de Alimentación» (cap40, sec-40.5). Formato: contenido/lecciones11/GUIA.md.
# - La figura 41.8 (fig-40.8) con zonas: el retorno bajo la pista con plano continuo y el rodeo por la ranura.
# - «Dividirla por cuatro son 12 dB» (bloque 140): 20·log10(4) = 12,0 dB, como «estimar» sobre la curva 20·log10.
# - El condensador gratuito: 20 pF/cm² con 0,2 mm de FR4 (bloque 153); los 100 cm² del plano son un valor de ejemplo
#   (rotulado): 2 nF.
# - Sin fórmula del libro (la sección no tiene ecuaciones) ni paso práctico: sección de criterio, con «tocar» la ranura.
leccion: cap40/sec-40.5

libro:
  135: "no es su baja resistencia: es su baja inductancia"
  136: "la corriente de retorno se concentra justo debajo de la pista de ida, siguiéndola como una sombra"
  137: "Con un plano continuo, eso ocurre solo, sin que nadie lo diseñe"
  140: "dividirla por cuatro son 12 dB"
  141: "el plano de masa minimiza automáticamente el área de todos los bucles a la vez"
  143: "la corriente de retorno no puede seguir su camino natural y tiene que rodear la ranura"
  144: "Una ranura de unos centímetros bajo una línea rápida puede empeorar la emisión en 20 dB"
  145: "ninguna señal debe cruzar una discontinuidad del plano de retorno"
  148: "una masa dividida es una ranura"
  150: "Un solo plano continuo, sin cortes."
  151: "se separa dónde están las cosas, no el cobre"
  153: "con un dieléctrico de 0,2 mm en FR4, unos 20 pF por centímetro cuadrado"
  154: "ese condensador distribuido cubre el rango de cientos de megahercios"
  156: "dar caminos cortos al retorno cuando una señal cambia de capa, y evitar que las zonas de plano actúen como resonadores"
  157: "una vía cada λ/20 de la frecuencia más alta de interés"
  160: "El camino de retorno con plano continuo y con una ranura"

modelo:
  valores:
    k_a: { sim: "k", nombre: "factor de reducción del área", unidad: "", valor: 4 }
    A_pl: { sim: "A", nombre: "área enfrentada de los planos (ejemplo)", unidad: "cm²", valor: 100 }
    c_pl: { sim: "c", nombre: "capacidad por cm² con 0,2 mm", unidad: F, valor: 20e-12 }
  calculos:
    dB_a: { expr: "20*log10(k_a)", sim: "Δ", nombre: "reducción de la emisión", unidad: dB }
    C_pl: { expr: "c_pl*A_pl", sim: "C", nombre: "capacidad entre planos", unidad: F }

tarjetas:
  - id: explore-retorno
    tipo: explorar
    titulo: "Por dónde vuelve la corriente"
    texto: "Compare el retorno con plano continuo y con una ranura. Toque las tres zonas."
    libro: [136, 143, 160]
    widget:
      tipo: figura
      figura: fig-40.8
      zonas:
        - { id: continuo, rotulo: "Panel de la izquierda", rect: [5, 25, 210, 125], texto: "El retorno va justo debajo de la pista, como una sombra: área del bucle casi nula." }
        - { id: ranura, rotulo: "Rectángulo rojo vertical", rect: [356, 34, 48, 108], texto: "Una ranura en el plano bajo la pista: el retorno no puede seguir su camino natural." }
        - { id: area, rotulo: "Texto de abajo a la derecha", rect: [235, 148, 215, 37], texto: "El retorno rodea la ranura: el área del bucle crece, y con ella la inductancia y la emisión." }
    requiere: { mover: [continuo, ranura, area] }

  - id: predecir-sombra
    tipo: predecir
    titulo: "A unos pocos kilohercios"
    texto: "Una pista sobre un plano de masa lleva una señal de varios kilohercios. ¿Por dónde vuelve la corriente?"
    libro: [136, 137]
    widget:
      tipo: figura
      figura: fig-40.8
      zonas:
        - { id: continuo, rotulo: "Panel de la izquierda", rect: [5, 25, 210, 125] }
    opciones:
      - texto: "Justo debajo de la pista de ida"
        bien: true
        porque: "Vuelve por donde la inductancia del bucle es mínima: el área más pequeña."
      - texto: "Por el camino más corto entre receptor y emisor"
        porque: "Eso es en continua, abriéndose en abanico; a partir de unos kilohercios sigue a la pista."
      - texto: "Repartida por todo el plano por igual"
        porque: "Se concentra bajo la pista; el plano solo le deja hacerlo."
    escalera:
      - "La corriente busca el bucle de menor inductancia."
    solucion: "Justo debajo de la pista, como una sombra."

  - id: porque-plano
    tipo: porque
    titulo: "No es un cable ancho"
    texto: "¿Cuál es la razón de ser de un plano de masa?"
    libro: [135, 137]
    widget:
      tipo: figura
      figura: fig-40.8
      zonas:
        - { id: continuo, rotulo: "Panel de la izquierda", rect: [5, 25, 210, 125] }
    opciones:
      - texto: "Su baja inductancia, y que cada corriente encuentre su retorno óptimo"
        bien: true
        porque: "Con un plano continuo eso ocurre solo, sin diseñar el retorno pista a pista."
      - texto: "Su baja resistencia"
        porque: "Ayuda, pero no es la razón: lo que cuenta es la inductancia del bucle."
      - texto: "Apantallar la placa de la caja"
        porque: "El libro no da esa razón: el plano sirve para el camino de retorno."
    escalera:
      - "Piense en el bucle, no en el cable."
    solucion: "Baja inductancia y retorno óptimo para cada corriente."

  - id: estime-db
    tipo: pregunta
    titulo: "El área y la emisión"
    texto: "La emisión radiada es proporcional al área del bucle. Si el área se divide por cuatro, ¿cuántos dB baja?"
    libro: [140]
    fijar: { k_a: 4 }
    widget:
      tipo: grafica
      x: { id: kk, min: 1, max: 10, unidad: "", rotulo: "área dividida por" }
      y: { min: 0, max: 22, unidad: dB, rotulo: "menos emisión" }
      curvas:
        - { expr: "20*log10(kk)", color: naranja, rotulo: "20·log₁₀" }
    estimar:
      objetivo: "dB_a"
      unidad: dB
      min: 0
      max: 20
      paso: 0.5
      inicio: 4
      tol: 0.05
      rotulo: "Reducción"
    exito: "12 dB: el área es la palanca más rentable."
    pistas:
      - { cuando: { valor: estimacion, mayor: 12.5 }, texto: "Se ha pasado: lea la curva en 4." }
      - { texto: "Se ha quedado corto: lea la curva en 4." }
    escalera:
      - "Busque en la curva el punto de abscisa 4."
    solucion: "12 dB."
    comprobar:
      - { dB_a: 12, tol: 0.01 }

  - id: empareje-area
    tipo: pregunta
    titulo: "Todo sale del área"
    texto: "Empareje cada efecto con su relación con el área del bucle."
    libro: [140, 141]
    emparejar:
      - ["Inductancia del camino", "Proporcional al área: rebote y picos"]
      - ["Emisión radiada", "Proporcional al área"]
      - ["Captación de interferencias", "La misma área, por reciprocidad"]
      - ["Diafonía", "Cuánto se solapan los bucles"]
    exito: "El plano minimiza a la vez el área de todos los bucles."
    pistas:
      - { texto: "Lo que emite un bucle, también lo capta." }
    escalera:
      - "La reciprocidad une emitir y captar."
    solucion: "Inductancia y emisión, proporcionales; captación, por reciprocidad; diafonía, solape."

  - id: toque-ranura
    tipo: tocar
    titulo: "El error que destruye el plano"
    texto: "Toque lo que obliga al retorno a dar un rodeo."
    libro: [143, 144]
    widget:
      tipo: figura
      figura: fig-40.8
      zonas:
        - { id: pista, rotulo: "Línea azul de la derecha", rect: [270, 58, 80, 35] }
        - { id: ranura, rotulo: "Rectángulo vertical", rect: [356, 34, 48, 108] }
        - { id: receptor, rotulo: "Recuadro de la derecha del todo", rect: [410, 45, 40, 45] }
    tocar:
      bien: [ranura]
      porque:
        pista: "Es la ida; el problema está en el plano que hay debajo."
        receptor: "El receptor no corta el plano."
    exito: "La ranura: el área pasa de casi cero a toda la que la rodea."
    escalera:
      - "Busque un corte en el plano bajo la pista."
    solucion: "La ranura vertical."

  - id: pregunta-ranura
    tipo: pregunta
    titulo: "Una ranura bajo una línea rápida"
    texto: "Una ranura de unos centímetros queda bajo una línea rápida. ¿Qué cabe esperar?"
    libro: [144, 145]
    widget:
      tipo: figura
      figura: fig-40.8
      zonas:
        - { id: area, rotulo: "Texto de abajo a la derecha", rect: [235, 148, 215, 37] }
    opciones:
      - texto: "Hasta 20 dB más de emisión y reflexiones visibles"
        bien: true
        porque: "Por eso ninguna señal debe cruzar una discontinuidad del plano de retorno."
      - texto: "Nada, si la ranura es estrecha"
        porque: "Lo que cuenta es el rodeo del retorno, no la anchura de la ranura."
      - texto: "Solo algo más de resistencia"
        porque: "El efecto es de área: inductancia, emisión y diafonía."
    escalera:
      - "Mire el rodeo que da el retorno en la figura."
    solucion: "Hasta 20 dB más de emisión y reflexiones."

  - id: pregunta-masas
    tipo: pregunta
    titulo: "Masa analógica y digital"
    texto: "Una placa mixta, con señales de varios megahercios. ¿Cómo se separan las dos partes?"
    libro: [148, 150, 151]
    widget:
      tipo: figura
      figura: fig-40.8
      zonas:
        - { id: ranura, rotulo: "Rectángulo vertical", rect: [356, 34, 48, 108] }
    opciones:
      - texto: "Un solo plano continuo y cada parte en su zona"
        bien: true
        porque: "Se separa dónde están las cosas, no el cobre: los retornos no se solapan."
      - texto: "Dos planos unidos en un solo punto"
        porque: "Válido a baja frecuencia; por encima de unos megahercios una masa dividida es una ranura."
      - texto: "Dos planos sin unir"
        porque: "Toda señal que cruce tendría su retorno interrumpido."
    escalera:
      - "Una masa dividida, ¿a qué se parece?"
    solucion: "Un plano continuo, particionado por colocación."

  - id: estime-condensador
    tipo: pregunta
    titulo: "El condensador gratuito"
    texto: "Un plano de alimentación frente a uno de masa, a 0,2 mm en FR4, con 100 cm² enfrentados (valor de ejemplo). ¿Qué capacidad forman?"
    libro: [153]
    fijar: { A_pl: 100, c_pl: 20e-12 }
    widget:
      tipo: grafica
      x: { id: aa, min: 0, max: 200, unidad: "cm²", rotulo: "área" }
      y: { min: 0, max: 4.5e-9, unidad: F, rotulo: "C" }
      curvas:
        - { expr: "c_pl*aa", color: naranja, rotulo: "20 pF/cm²" }
    estimar:
      objetivo: "C_pl"
      unidad: F
      min: 0
      max: 4e-9
      paso: 1e-10
      inicio: 3.5e-9
      tol: 0.05
      rotulo: "Capacidad entre planos"
    exito: "2 nF: poca capacidad, y sin pistas ni terminales."
    pistas:
      - { cuando: { valor: estimacion, mayor: 2.1e-9 }, texto: "Se ha pasado: 20 pF por cada centímetro cuadrado." }
      - { texto: "Se ha quedado corto: 20 pF por cada centímetro cuadrado." }
    escalera:
      - "Multiplique el área por 20 pF."
    solucion: "100 × 20 pF = 2 nF."
    comprobar:
      - { C_pl: 2e-9 }

  - id: porque-condensador
    tipo: porque
    titulo: "Poca capacidad, mucho efecto"
    texto: "¿Por qué ese condensador entre planos actúa donde los discretos fallan?"
    libro: [153, 154]
    widget:
      tipo: grafica
      x: { id: aa, min: 0, max: 200, unidad: "cm²", rotulo: "área" }
      y: { min: 0, max: 4.5e-9, unidad: F, rotulo: "C" }
      curvas:
        - { expr: "c_pl*aa", color: naranja, rotulo: "20 pF/cm²" }
    opciones:
      - texto: "Su inductancia es prácticamente nula: no hay pistas ni terminales"
        bien: true
        porque: "Por eso cubre cientos de megahercios, por encima de las autorresonancias de los discretos."
      - texto: "Porque tiene más capacidad que los discretos"
        porque: "Tiene muy poca; su virtud es la inductancia."
      - texto: "Porque el FR4 es un dieléctrico excelente"
        porque: "La clave no es el dieléctrico sino la ausencia de conexiones."
    escalera:
      - "¿Qué limita a un condensador discreto a alta frecuencia?"
    solucion: "La inductancia casi nula de un condensador distribuido."

  - id: pregunta-costura
    tipo: pregunta
    titulo: "Vías de costura"
    texto: "Varios planos de masa unidos con vías repartidas. ¿Para qué?"
    libro: [156, 157]
    widget:
      tipo: figura
      figura: fig-40.8
      zonas:
        - { id: continuo, rotulo: "Panel de la izquierda", rect: [5, 25, 210, 125] }
    opciones:
      - texto: "Caminos cortos al retorno y que el plano no resuene"
        bien: true
        porque: "La regla habitual: una vía cada λ/20 de la frecuencia más alta de interés."
      - texto: "Para llevar más corriente de continua"
        porque: "Unen planos de masa para el retorno de las señales, no para potencia."
      - texto: "Para disipar calor"
        porque: "Eso son las vías térmicas, bajo un componente."
    escalera:
      - "Una señal que cambia de capa necesita que su retorno también cambie."
    solucion: "Retornos cortos y planos sin resonancias, una vía cada λ/20."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [136, 141, 145, 151]
    ideas:
      - { titulo: "Como una sombra.", texto: "El retorno va bajo la pista: el área del bucle es mínima." }
      - { titulo: "El área.", texto: "Inductancia, emisión, captación y diafonía crecen con ella." }
      - { titulo: "Sin ranuras.", texto: "Ninguna señal cruza un corte del plano: hasta 20 dB más de emisión." }
      - { titulo: "Un plano.", texto: "Se separa dónde están las cosas, no el cobre." }
