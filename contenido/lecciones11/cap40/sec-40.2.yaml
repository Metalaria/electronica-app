# Lección 1.2 de la sección 41.2 «Apilado de Capas (Stackup)» (cap40, sec-40.2). Formato: contenido/lecciones11/GUIA.md.
# 1.2.1 (autor121-pc, «aprender haciendo», GUIA §13): todo se toca en las figuras. En la 41.2 (fig-40.2), los dos
# planos que forman el condensador distribuido y el retorno de la cara inferior; en la 41.3 (fig-40.3), la capa
# enterrada y apantallada del apilado de seis, y en su recuadro de reglas, la que evita el alabeo y lo que se hace con
# el fabricante; en la 42.3 (fig-41.3), el punto de 50 Ω con el plano a 0,1 mm; en la 41.1 (fig-40.1), la cara que se
# rellena de masa cuando solo hay dos capas. Queda una pregunta de opciones (por qué el apilado de alta velocidad
# renuncia al plano de alimentación) y el emparejamiento de las comprobaciones del banco. Sin fórmula: la sección no
# tiene ecuaciones.
leccion: cap40/sec-40.2

libro:
  36: "determina la impedancia de las pistas, la calidad de los retornos y el comportamiento en alta frecuencia"
  37: "cambiarlo después obliga a rehacer el trazado"
  39: "Sin plano continuo, los retornos van por donde pueden"
  40: "su virtud es que cada capa de señal tiene un plano adyacente"
  41: "Sacrifica el plano de alimentación a cambio de que todas las señales tengan retorno de masa contiguo"
  42: "capas de señal enterradas entre ellos, que quedan apantalladas de forma natural"
  44: "Toda capa de señal debe tener un plano adyacente"
  45: "forman un condensador distribuido que ayuda al desacoplo en alta frecuencia"
  46: "o la placa se alabea al enfriarse tras el prensado"
  49: "más ancha, menos impedancia"
  50: "más lejos, más impedancia"
  53: "con FR4 y un dieléctrico de 0,2 mm, una pista de 0,35 mm da alrededor de 50 Ω"
  55: "el apilado real lo hace el fabricante"
  56: "Diseñar con valores genéricos y esperar que coincidan es una fuente de placas que no cumplen"
  59: "Rellenar de masa todo el espacio libre de la cara inferior"
  60: "Trazar las señales críticas por la cara superior, sobre ese relleno"
  61: "No sustituye a un plano continuo y reduce mucho el daño"
  63: "la impedancia de una línea se comprueba por reflectometría"
  64: "pedir al fabricante el apilado concreto que va a usar para el pedido"
  65: "los planos internos continuos ofrecen retornos de baja impedancia"
  "cap41#40": "Con el plano a 0,1 mm, la misma impedancia exige la mitad de anchura"

modelo: { valores: {}, calculos: {} }

tarjetas:
  - id: explore-apilados
    tipo: explorar
    titulo: "Tres apilados habituales"
    texto: "El apilado decide impedancias y retornos, y cambiarlo obliga a rehacer el trazado. Toque los tres."
    libro: [36, 37, 40, 41, 42]
    widget:
      tipo: figura
      figura: fig-40.3
      zonas:
        - { id: clasico, rotulo: "Cuatro capas, clásico", rect: [15, 0, 120, 115], texto: "Cada capa de señal tiene un plano adyacente." }
        - { id: alta, rotulo: "Cuatro capas, alta velocidad", rect: [165, 0, 122, 115], texto: "Masa, masa: todas las señales con retorno de masa contiguo." }
        - { id: seis, rotulo: "Seis capas", rect: [318, 0, 122, 150], texto: "Dos planos de masa; las señales enterradas entre ellos quedan apantalladas de forma natural." }
    requiere: { mover: [clasico, alta, seis] }

  - id: explore-apilado
    tipo: tocar
    titulo: "Señal, masa, alimentación, señal"
    texto: "En el apilado clásico, dos capas juntas forman un condensador distribuido que desacopla en alta frecuencia. Tóquelas."
    libro: [36, 40, 45, 65]
    widget:
      tipo: figura
      figura: fig-40.2
      zonas:
        - { id: arriba, rotulo: "Primera capa", rect: [120, 3, 173, 35] }
        - { id: masa, rotulo: "Segunda capa", rect: [120, 39, 173, 35] }
        - { id: alimentacion, rotulo: "Tercera capa", rect: [120, 78, 173, 35] }
        - { id: abajo, rotulo: "Cuarta capa", rect: [120, 114, 173, 35] }
    tocar:
      bien: [masa, alimentacion]
      todas: true
      porque:
        arriba: "Es una capa de señal, con pistas sueltas: no es un plano continuo."
        abajo: "Es una capa de señal, con pistas sueltas: no es un plano continuo."
    exito: "Los planos de masa y alimentación, juntos y próximos: con dieléctrico fino, su capacidad llega donde ningún condensador discreto llega."
    escalera:
      - "Un condensador son dos placas enfrentadas: busque las dos capas continuas."
    solucion: "La segunda y la tercera: el plano de masa y el de alimentación."

  - id: toque-retorno
    tipo: tocar
    titulo: "El retorno de la cara inferior"
    texto: "Una pista de la cara inferior lleva una señal rápida. Toque la capa por la que vuelve su corriente."
    libro: [40, 65]
    widget:
      tipo: figura
      figura: fig-40.2
      zonas:
        - { id: arriba, rotulo: "Primera capa", rect: [120, 3, 173, 35] }
        - { id: masa, rotulo: "Segunda capa", rect: [120, 39, 173, 35] }
        - { id: alimentacion, rotulo: "Tercera capa", rect: [120, 78, 173, 35] }
        - { id: abajo, rotulo: "Cuarta capa", rect: [120, 114, 173, 35] }
    tocar:
      bien: [alimentacion]
      porque:
        arriba: "Es otra capa de señal: no es un plano continuo."
        masa: "Es el retorno de la cara superior; la inferior tiene más cerca el plano de alimentación."
        abajo: "Es la capa de la propia pista: la ida, no la vuelta."
    exito: "El plano contiguo a la pista: el de alimentación. Cada capa de señal tiene un plano adyacente."
    escalera:
      - "El retorno va por el plano más próximo a la pista."
    solucion: "La tercera capa, el plano de alimentación."

  - id: explore-tres
    tipo: tocar
    titulo: "Una señal apantallada"
    texto: "En el apilado de seis capas, toque la capa de señal que queda apantallada de forma natural."
    libro: [42]
    widget:
      tipo: figura
      figura: fig-40.3
      recorte: [300, 0, 153.6, 150]
      ampliar: 1.6
      zonas:
        - { id: s1, rotulo: "Seis capas: la primera", rect: [321, 23, 113, 14] }
        - { id: m1, rotulo: "Seis capas: la segunda", rect: [321, 40, 113, 15] }
        - { id: s2, rotulo: "Seis capas: la tercera", rect: [321, 58, 113, 15] }
        - { id: a1, rotulo: "Seis capas: la cuarta", rect: [321, 76, 113, 15] }
        - { id: m2, rotulo: "Seis capas: la quinta", rect: [321, 94, 113, 15] }
        - { id: s3, rotulo: "Seis capas: la sexta", rect: [321, 112, 113, 15] }
    tocar:
      bien: [s2]
      porque:
        s1: "Es una capa exterior: tiene un plano debajo, pero aire encima."
        s3: "Es una capa exterior: tiene un plano encima, pero aire debajo."
        m1: "Es un plano de masa, no una capa de señal."
        a1: "Es el plano de alimentación, no una capa de señal."
        m2: "Es un plano de masa, no una capa de señal."
    exito: "La señal enterrada, entre dos planos: apantallada de forma natural."
    escalera:
      - "Busque una capa de señal con un plano a cada lado."
    solucion: "La tercera capa, la señal enterrada."

  - id: pregunta-alta
    tipo: porque
    titulo: "El apilado de alta velocidad"
    texto: "Señal, masa, masa, señal. ¿Por qué renuncia al plano de alimentación?"
    libro: [41]
    widget:
      tipo: figura
      figura: fig-40.3
      zonas:
        - { id: alta, rotulo: "Apilado del centro", rect: [165, 0, 122, 115] }
    opciones:
      - texto: "Para que todas las señales tengan retorno de masa contiguo"
        bien: true
        porque: "La alimentación va por las capas de señal; a alta velocidad importa más el retorno de masa contiguo."
      - texto: "Para ganar espacio para las pistas"
        porque: "Sigue teniendo dos capas de señal: el segundo plano es de masa, no de pistas."
      - texto: "Porque el plano de alimentación no sirve para nada"
        porque: "Sirve: con el de masa forma un condensador distribuido. Se sacrifica a cambio del retorno."
    escalera:
      - "Compare la tercera capa con la del clásico."
    solucion: "Sacrifica el plano de alimentación para que todas las señales tengan retorno de masa contiguo."

  - id: toque-simetria
    tipo: tocar
    titulo: "Una placa alabeada"
    texto: "Un apilado eléctricamente perfecto sale alabeado del prensado. Toque la regla que incumple."
    libro: [44, 45, 46]
    widget:
      tipo: figura
      figura: fig-40.3
      recorte: [4, 160, 312, 73]
      ampliar: 3.75
      zonas:
        - { id: r1, rotulo: "Primera regla", rect: [8, 179, 400, 12] }
        - { id: r2, rotulo: "Segunda regla", rect: [8, 191, 400, 12] }
        - { id: r3, rotulo: "Tercera regla", rect: [8, 203, 400, 12] }
    tocar:
      bien: [r3]
      porque:
        r1: "El plano adyacente fija el retorno y la inductancia del bucle: es eléctrica, no mecánica."
        r2: "Masa y alimentación juntas ayudan al desacoplo: también es eléctrica."
    exito: "La simetría respecto al centro: sin ella, la placa se alabea al enfriarse tras el prensado."
    escalera:
      - "Una de las tres no es eléctrica: es del prensado."
    solucion: "La tercera: simetría respecto al centro."

  - id: predecir-plano
    tipo: tocar
    titulo: "El plano más cerca"
    texto: "Con el plano a 0,2 mm, 0,35 mm dan unos 50 Ω. Acérquelo a 0,1 mm: toque la anchura que da los mismos 50 Ω."
    libro: [49, 50, 53, "cap41#40"]
    widget:
      tipo: figura
      figura: fig-41.3
      recorte: [0, 0, 215, 198.65]
      ampliar: 1.55
      zonas:
        - { id: verde, rotulo: "Punto de 50 Ω, a la izquierda", rect: [50, 103, 20, 20] }
        - { id: azul, rotulo: "Punto de 50 Ω, en el centro", rect: [82, 103, 20, 20] }
        - { id: naranja, rotulo: "Cruce de 50 Ω, a la derecha", rect: [146, 103, 20, 20] }
    tocar:
      bien: [verde]
      porque:
        azul: "Es la pista de 0,35 mm con el plano a 0,2 mm: la del punto de partida."
        naranja: "Esa es la curva del plano más lejano: más lejos, más impedancia, y hace falta una pista más ancha."
    exito: "La mitad de anchura: la impedancia la fija la relación entre anchura y distancia al plano, no la anchura sola."
    escalera:
      - "Más cerca del plano, menos impedancia: para volver a 50 Ω hay que estrechar la pista."
    solucion: "El punto de la izquierda, en la curva verde: la mitad de anchura."

  - id: pregunta-fabricante
    tipo: tocar
    titulo: "El apilado real"
    texto: "Hace falta impedancia controlada. Toque en el recuadro lo que decide con qué espesores se calcula."
    libro: [55, 56, 64]
    widget:
      tipo: figura
      figura: fig-40.3
      recorte: [4, 160, 312, 73]
      ampliar: 3.75
      zonas:
        - { id: r1, rotulo: "Primera regla", rect: [8, 179, 400, 12] }
        - { id: r2, rotulo: "Segunda regla", rect: [8, 191, 400, 12] }
        - { id: r3, rotulo: "Tercera regla", rect: [8, 203, 400, 12] }
        - { id: fab, rotulo: "La última línea", rect: [8, 215, 400, 13] }
    tocar:
      bien: [fab]
      porque:
        r1: "La regla del plano adyacente ordena las capas, pero no da sus espesores."
        r2: "Dice que masa y alimentación vayan juntas, no con qué espesores."
        r3: "La simetría es una exigencia mecánica; los espesores los fija otro."
    exito: "El apilado real lo hace el fabricante: se calcula con sus espesores de prepreg y núcleo, o se le encarga el cálculo."
    escalera:
      - "¿Quién elige el prepreg y el núcleo que se usan en el pedido?"
    solucion: "La última línea: calcular con los espesores del fabricante."

  - id: pregunta-dos-capas
    tipo: tocar
    titulo: "Si solo hay dos capas"
    texto: "El coste obliga a dos capas. Toque la cara que se rellena de masa, conectada abundantemente."
    libro: [39, 59, 60, 61]
    widget:
      tipo: figura
      figura: fig-40.1
      recorte: [2, 0, 148, 160]
      ampliar: 1.1
      zonas:
        - { id: superior, rotulo: "Dos capas: la de arriba", rect: [10, 22, 140, 20] }
        - { id: inferior, rotulo: "Dos capas: la de abajo", rect: [10, 84, 140, 20] }
    tocar:
      bien: [inferior]
      porque:
        superior: "Por la de arriba van las señales críticas, sobre el relleno: no se corta con pistas."
    exito: "La inferior, rellena de masa; las señales críticas, arriba y encima. No sustituye a un plano continuo, pero reduce mucho el daño."
    escalera:
      - "Las señales críticas van por la cara superior, sobre el relleno."
    solucion: "La de abajo: se rellena de masa todo el espacio libre."

  - id: empareje-banco
    tipo: pregunta
    titulo: "En el banco"
    texto: "El apilado no se mide directamente. Empareje cada comprobación con su método."
    libro: [63, 64]
    emparejar:
      - ["La impedancia de una línea", "Reflectometría"]
      - ["La calidad del retorno", "El timbre de los flancos"]
      - ["Los cálculos, antes de enviar", "El apilado concreto del fabricante"]
    exito: "Las consecuencias del apilado sí se miden; y la comprobación más barata es pedir el apilado del pedido."
    pistas:
      - { texto: "La reflectometría envía un escalón y mira lo que vuelve." }
    escalera:
      - "Un mal retorno se nota en los flancos de las señales."
    solucion: "Impedancia, reflectometría; retorno, timbre de los flancos; cálculos, el apilado del fabricante."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [37, 44, 50, 55]
    ideas:
      - { titulo: "Primero.", texto: "El apilado se decide antes de trazar: cambiarlo obliga a rehacer el trazado." }
      - { titulo: "Plano adyacente.", texto: "Cada capa de señal tiene su plano, que es su retorno." }
      - { titulo: "Impedancia.", texto: "Más ancha, menos; más lejos del plano, más." }
      - { titulo: "El fabricante.", texto: "Se calcula con su apilado real, no con valores genéricos." }
