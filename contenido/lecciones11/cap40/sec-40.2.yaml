# Lección 1.2 de la sección 41.2 «Apilado de Capas (Stackup)» (cap40, sec-40.2). Formato: contenido/lecciones11/GUIA.md.
# - Las figuras 41.2 (fig-40.2, el apilado de cuatro capas con los retornos) y 41.3 (fig-40.3, tres apilados y las
#   tres reglas) con zonas.
# - Sin fórmula (la sección no tiene ecuaciones). Paso práctico: «tocar» el plano de retorno de la cara inferior.
leccion: cap40/sec-40.2

libro:
  36: "determina la impedancia de las pistas, la calidad de los retornos y el comportamiento en alta frecuencia"
  37: "cambiarlo después obliga a rehacer el trazado"
  39: "Sin plano continuo, los retornos van por donde pueden"
  40: "su virtud es que cada capa de señal tiene un plano adyacente"
  41: "Sacrifica el plano de alimentación a cambio de que todas las señales tengan retorno de masa contiguo"
  42: "capas de señal enterradas entre ellos, que quedan apantalladas de forma natural"
  44: "Toda capa de señal debe tener un plano adyacente"
  45: "forman un condensador distribuido que ayuda al desacoplo en alta frecuencia"
  46: "o la placa se alabea al enfriarse tras el prensado"
  49: "más ancha, menos impedancia"
  50: "más lejos, más impedancia"
  53: "con FR4 y un dieléctrico de 0,2 mm, una pista de 0,35 mm da alrededor de 50 Ω"
  55: "el apilado real lo hace el fabricante"
  56: "Diseñar con valores genéricos y esperar que coincidan es una fuente de placas que no cumplen"
  59: "Rellenar de masa todo el espacio libre de la cara inferior"
  60: "Trazar las señales críticas por la cara superior, sobre ese relleno"
  61: "No sustituye a un plano continuo y reduce mucho el daño"
  63: "la impedancia de una línea se comprueba por reflectometría"
  64: "pedir al fabricante el apilado concreto que va a usar para el pedido"
  65: "los planos internos continuos ofrecen retornos de baja impedancia"

modelo: { valores: {}, calculos: {} }

tarjetas:
  - id: explore-apilado
    tipo: explorar
    titulo: "Señal, masa, alimentación, señal"
    texto: "El apilado clásico de cuatro capas. Toque los dos planos internos."
    libro: [36, 40, 45, 65]
    widget:
      tipo: figura
      figura: fig-40.2
      zonas:
        - { id: arriba, rotulo: "Capa de señal superior", rect: [120, 3, 173, 35], texto: "Señal: su plano adyacente es el de masa." }
        - { id: masa, rotulo: "Plano de masa", rect: [120, 39, 173, 35], texto: "Continuo: el retorno de las pistas de arriba, justo debajo de ellas." }
        - { id: alimentacion, rotulo: "Plano de alimentación", rect: [120, 78, 173, 35], texto: "Junto con el de masa forma un condensador distribuido, y hace de retorno de la cara inferior." }
        - { id: abajo, rotulo: "Capa de señal inferior", rect: [120, 114, 173, 35], texto: "Señal: su plano adyacente es el de alimentación." }
    requiere: { mover: [masa, alimentacion] }

  - id: toque-retorno
    tipo: tocar
    titulo: "El retorno de la cara inferior"
    texto: "Una pista de la cara inferior lleva una señal rápida. Toque la capa por la que vuelve su corriente."
    libro: [40, 65]
    widget:
      tipo: figura
      figura: fig-40.2
      zonas:
        - { id: arriba, rotulo: "Primera capa", rect: [120, 3, 173, 35] }
        - { id: masa, rotulo: "Segunda capa", rect: [120, 39, 173, 35] }
        - { id: alimentacion, rotulo: "Tercera capa", rect: [120, 78, 173, 35] }
        - { id: abajo, rotulo: "Cuarta capa", rect: [120, 114, 173, 35] }
    tocar:
      bien: [alimentacion]
      porque:
        arriba: "Es otra capa de señal: no es un plano continuo."
        masa: "Es el retorno de la cara superior; la inferior tiene más cerca el plano de alimentación."
        abajo: "Es la capa de la propia pista: la ida, no la vuelta."
    exito: "El plano contiguo a la pista: el de alimentación. Cada capa de señal tiene un plano adyacente."
    escalera:
      - "El retorno va por el plano más próximo a la pista."
    solucion: "La tercera capa, el plano de alimentación."

  - id: explore-tres
    tipo: explorar
    titulo: "Tres apilados habituales"
    texto: "Compare el clásico, el de alta velocidad y el de seis capas."
    libro: [40, 41, 42]
    widget:
      tipo: figura
      figura: fig-40.3
      zonas:
        - { id: clasico, rotulo: "Cuatro capas, clásico", rect: [15, 0, 120, 115], texto: "Cada capa de señal tiene un plano adyacente." }
        - { id: alta, rotulo: "Cuatro capas, alta velocidad", rect: [165, 0, 122, 115], texto: "Masa, masa: todas las señales con retorno de masa contiguo." }
        - { id: seis, rotulo: "Seis capas", rect: [318, 0, 122, 150], texto: "Dos planos de masa; las señales enterradas entre ellos quedan apantalladas de forma natural." }
    requiere: { mover: [clasico, alta, seis] }

  - id: pregunta-alta
    tipo: porque
    titulo: "El apilado de alta velocidad"
    texto: "Señal, masa, masa, señal. ¿Por qué renuncia al plano de alimentación?"
    libro: [41]
    widget:
      tipo: figura
      figura: fig-40.3
      zonas:
        - { id: alta, rotulo: "Apilado del centro", rect: [165, 0, 122, 115] }
    opciones:
      - texto: "Para que todas las señales tengan retorno de masa contiguo"
        bien: true
        porque: "La alimentación va por las capas de señal; a alta velocidad importa más el retorno de masa contiguo."
      - texto: "Para ganar espacio para las pistas"
        porque: "Sigue teniendo dos capas de señal: el segundo plano es de masa, no de pistas."
      - texto: "Porque el plano de alimentación no sirve para nada"
        porque: "Sirve: con el de masa forma un condensador distribuido. Se sacrifica a cambio del retorno."
    escalera:
      - "Compare la tercera capa con la del clásico."
    solucion: "Sacrifica el plano de alimentación para que todas las señales tengan retorno de masa contiguo."

  - id: empareje-reglas
    tipo: pregunta
    titulo: "Las tres reglas"
    texto: "Empareje cada regla del apilado con su razón."
    libro: [44, 45, 46]
    widget:
      tipo: figura
      figura: fig-40.3
      zonas:
        - { id: reglas, rotulo: "Las tres reglas", rect: [2, 162, 450, 70] }
    emparejar:
      - ["Un plano junto a cada capa de señal", "Es su camino de retorno"]
      - ["Masa y alimentación juntas y próximas", "Condensador distribuido para el desacoplo"]
      - ["Simetría respecto al centro", "Si no, la placa se alabea"]
    exito: "La tercera es mecánica: por eso los apilados son simétricos aunque eléctricamente no haría falta."
    pistas:
      - { texto: "Una de las tres no es eléctrica: es del prensado." }
    escalera:
      - "Dos planos enfrentados con dieléctrico fino son un condensador."
    solucion: "Plano adyacente, retorno; masa con alimentación, desacoplo; simetría, que no se alabee."

  - id: predecir-plano
    tipo: predecir
    titulo: "Lo que fija la impedancia"
    texto: "Con FR4 y un dieléctrico de 0,2 mm, una pista de 0,35 mm da unos 50 Ω. ¿Qué pasa si el plano queda más lejos?"
    libro: [49, 50, 53]
    widget:
      tipo: figura
      figura: fig-40.2
      zonas:
        - { id: arriba, rotulo: "Pista sobre su plano", rect: [120, 8, 173, 65] }
    opciones:
      - texto: "La impedancia sube"
        bien: true
        porque: "Más lejos del plano, más impedancia: por eso cambiar el apilado cambia las anchuras."
      - texto: "La impedancia baja"
        porque: "Baja al ensanchar la pista; al alejar el plano, sube."
      - texto: "No cambia: la fija la anchura"
        porque: "La anchura es solo uno de los factores; la distancia al plano pesa tanto como ella."
    escalera:
      - "Ensanchar la pista baja la impedancia; alejar el plano hace lo contrario."
    solucion: "Sube: más lejos, más impedancia."

  - id: pregunta-fabricante
    tipo: pregunta
    titulo: "El diálogo con el fabricante"
    texto: "Hace falta impedancia controlada. ¿Con qué espesores se calcula?"
    libro: [55, 56]
    widget:
      tipo: figura
      figura: fig-40.3
      zonas:
        - { id: reglas, rotulo: "Las tres reglas y la advertencia", rect: [2, 162, 450, 70] }
    opciones:
      - texto: "Con los del apilado real que da el fabricante"
        bien: true
        porque: "El apilado real lo hace él con su prepreg y sus núcleos: se le piden o se le encarga el cálculo."
      - texto: "Con valores genéricos de FR4"
        porque: "Esperar que coincidan es una fuente de placas que no cumplen."
      - texto: "Da igual: la impedancia la fija la anchura"
        porque: "La fija la relación entre anchura y distancia al plano, y esa distancia es la del fabricante."
    escalera:
      - "¿Quién decide de verdad el espesor de cada dieléctrico?"
    solucion: "Con el apilado real del fabricante, o encargándole a él el cálculo."

  - id: pregunta-dos-capas
    tipo: pregunta
    titulo: "Cuando solo hay dos capas"
    texto: "El coste obliga a dos capas. ¿Qué mitiga lo peor?"
    libro: [39, 59, 60, 61]
    widget:
      tipo: figura
      figura: fig-40.2
      zonas:
        - { id: abajo, rotulo: "Cara inferior", rect: [120, 114, 173, 35] }
    opciones:
      - texto: "Rellenar de masa la cara inferior y trazar las señales críticas encima, sin cortar el relleno"
        bien: true
        porque: "No sustituye a un plano continuo, pero reduce mucho el daño."
      - texto: "Trazar las señales críticas por la cara inferior"
        porque: "Van por la superior, sobre el relleno de masa, para tener retorno debajo."
      - texto: "Nada: sin plano los retornos van por donde pueden"
        porque: "Van por donde pueden si no se hace nada; el relleno de masa les da un camino."
    escalera:
      - "Hay que fabricar algo parecido a un plano con lo que queda de cobre."
    solucion: "Relleno de masa abajo, bien conectado, y las señales críticas arriba sobre él."

  - id: empareje-banco
    tipo: pregunta
    titulo: "En el banco"
    texto: "El apilado no se mide directamente. Empareje cada comprobación con su método."
    libro: [63, 64]
    widget:
      tipo: figura
      figura: fig-40.2
      zonas:
        - { id: todo, rotulo: "El apilado", rect: [120, 8, 173, 139] }
    emparejar:
      - ["La impedancia de una línea", "Reflectometría"]
      - ["La calidad del retorno", "El timbre de los flancos"]
      - ["Antes de enviar", "Pedir al fabricante su apilado"]
    exito: "Se miden las consecuencias; el apilado se verifica antes, con el fabricante."
    pistas:
      - { texto: "La reflectometría envía un escalón y mira lo que vuelve." }
    escalera:
      - "Un retorno malo se ve en los flancos."
    solucion: "Impedancia, reflectometría; retorno, timbre; antes de enviar, el apilado concreto del fabricante."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [37, 44, 50, 55]
    ideas:
      - { titulo: "Primero.", texto: "El apilado se decide antes de trazar: cambiarlo obliga a rehacer el trazado." }
      - { titulo: "Plano adyacente.", texto: "Cada capa de señal tiene su plano, que es su retorno." }
      - { titulo: "Impedancia.", texto: "Más ancha, menos; más lejos del plano, más." }
      - { titulo: "El fabricante.", texto: "Se calcula con su apilado real, no con valores genéricos." }
