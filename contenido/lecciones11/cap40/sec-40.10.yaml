# Lección 1.2 de la sección 41.10 «Fiduciales, Paneles y Preparación para Producción» (cap40, sec-40.10).
# Formato: contenido/lecciones11/GUIA.md.
# - La figura 41.14 (fig-40.14) con zonas: los dos paneles, el borde de agarre, un fiducial y una pestaña.
# - Sin fórmula ni números que calcular. Paso práctico: «tocar» el panel para un contorno redondeado (mouse bites).
leccion: cap40/sec-40.10

libro:
  292: "elementos que no tienen función eléctrica y que la producción necesita"
  294: "la máquina de montaje usa como referencia óptica para saber exactamente dónde está la placa"
  295: "Hacen falta al menos tres, no alineados, cerca de las esquinas"
  296: "no pueden llevar máscara encima"
  300: "Se separa doblando, deja un borde limpio y solo sirve para contornos rectos"
  301: "Un componente demasiado cerca puede dañarse al separar la placa"
  302: "la línea de montaje necesita unos milímetros a cada lado para sujetar el panel, sin componentes"
  305: "con sus coordenadas, rotación y cara"
  306: "el CAD y la máquina pueden usar convenciones distintas para el ángulo cero de un componente"
  307: "La revisión es lo que evita fabricar la versión equivocada"
  308: "Componentes que no se montan (DNP)"
  310: "se monta una unidad y se comprueba entera contra el diseño"
  314: "la serie revela problemas de rendimiento que el prototipo ocultaba"
  316: "un componente que cuesta un euro de más es irrelevante en un prototipo y son mil euros en una serie"
  319: "Poner la revisión y la fecha en la serigrafía"
  320: "Montar y verificar una unidad completa antes de montar el resto"
  321: "Paneles de producción con fiduciales, borde de agarre en los dos lados largos"

modelo: { valores: {}, calculos: {} }

tarjetas:
  - id: explore-panel
    tipo: explorar
    titulo: "De una placa a muchas"
    texto: "La producción necesita elementos sin función eléctrica. Toque los dos paneles, un fiducial y el borde de agarre."
    libro: [292, 294, 302, 321]
    widget:
      tipo: figura
      figura: fig-40.14
      zonas:
        - { id: vscore, rotulo: "Panel de la izquierda", rect: [10, 60, 216, 92], texto: "V-scoring: un surco en V de borde a borde. Se separa doblando." }
        - { id: mouse, rotulo: "Panel de la derecha", rect: [258, 60, 182, 92], texto: "Mouse bites: el contorno se fresa y queda unido por pestañas con taladros." }
        - { id: fiducial, rotulo: "Círculo de abajo a la izquierda", rect: [4, 148, 36, 36], texto: "Un fiducial: la referencia óptica de la máquina de montaje." }
        - { id: agarre, rotulo: "Franja de arriba a la derecha", rect: [270, 22, 170, 36], texto: "El borde de agarre: unos milímetros a cada lado, sin componentes, para sujetar el panel." }
    requiere: { mover: [vscore, mouse, fiducial, agarre] }

  - id: predecir-fiduciales
    tipo: predecir
    titulo: "Cuántos fiduciales"
    texto: "La máquina de montaje tiene que saber exactamente dónde está la placa. ¿Cuántos fiduciales, y dónde?"
    libro: [294, 295]
    widget:
      tipo: figura
      figura: fig-40.14
      zonas:
        - { id: fiducial, rotulo: "Círculo de abajo a la izquierda", rect: [4, 148, 36, 36] }
    opciones:
      - texto: "Al menos tres, no alineados, cerca de las esquinas"
        bien: true
        porque: "Y fiduciales locales junto a los componentes de paso muy fino."
      - texto: "Uno en el centro"
        porque: "Un solo punto no da el giro ni la deformación de la placa."
      - texto: "Dos, en una diagonal"
        porque: "El libro pide al menos tres no alineados."
    escalera:
      - "Tres puntos no alineados fijan un plano."
    solucion: "Al menos tres, no alineados, cerca de las esquinas."

  - id: pregunta-mascara
    tipo: pregunta
    titulo: "Un fiducial bien hecho"
    texto: "¿Qué no puede tener un fiducial?"
    libro: [294, 296]
    widget:
      tipo: figura
      figura: fig-40.14
      zonas:
        - { id: fiducial, rotulo: "Círculo de abajo a la izquierda", rect: [4, 148, 36, 36] }
    opciones:
      - texto: "Máscara encima, o algo cerca que la cámara pueda confundir"
        bien: true
        porque: "Es cobre desnudo con una zona despejada alrededor."
      - texto: "Forma circular"
        porque: "Lo normal es precisamente un círculo de cobre."
      - texto: "Cobre desnudo"
        porque: "Es justo lo que es: una marca de cobre desnudo."
    escalera:
      - "La cámara tiene que verlo limpio."
    solucion: "Máscara encima ni nada cerca que la cámara confunda."

  - id: toque-contorno
    tipo: tocar
    titulo: "Un contorno redondeado"
    texto: "Las placas tienen las esquinas redondeadas. Toque el panel que permite separarlas."
    libro: [300]
    widget:
      tipo: figura
      figura: fig-40.14
      zonas:
        - { id: vscore, rotulo: "Panel de la izquierda", rect: [10, 60, 216, 92] }
        - { id: mouse, rotulo: "Panel de la derecha", rect: [258, 60, 182, 92] }
    tocar:
      bien: [mouse]
      porque:
        vscore: "El V-scoring es un corte recto de borde a borde: solo sirve para contornos rectos."
    exito: "Mouse bites: sirven para cualquier contorno, con un borde rugoso que a veces hay que limar."
    escalera:
      - "Un surco en V solo puede ser una línea recta."
    solucion: "El de la derecha, con pestañas y taladros."

  - id: empareje-separar
    tipo: pregunta
    titulo: "Separar las placas"
    texto: "Empareje cada elemento del panel con su característica."
    libro: [300, 301, 302]
    emparejar:
      - ["V-scoring", "Borde limpio, solo contornos rectos"]
      - ["Mouse bites", "Cualquier contorno, borde rugoso"]
      - ["Borde de agarre", "Unos milímetros sin componentes"]
    exito: "Y espacio libre junto a las líneas de separación: un componente cerca puede dañarse."
    pistas:
      - { texto: "El borde rugoso lo dejan los puentes de material." }
    escalera:
      - "El surco en V se separa doblando."
    solucion: "V-scoring, limpio y recto; mouse bites, cualquier forma y rugoso; agarre, sin componentes."

  - id: empareje-produccion
    tipo: pregunta
    titulo: "Preparar para la producción"
    texto: "Empareje cada preparación con lo que evita o aporta."
    libro: [305, 306, 307, 308]
    emparejar:
      - ["Fichero de posiciones", "Coordenadas, rotación y cara"]
      - ["Comprobar las rotaciones", "Integrados montados girados"]
      - ["Revisión en la placa", "Fabricar la versión equivocada"]
      - ["Marcar las DNP", "Posiciones previstas sin poblar"]
    exito: "El ángulo cero del CAD y el de la máquina pueden no coincidir."
    pistas:
      - { texto: "DNP son los componentes que no se montan." }
    escalera:
      - "Una placa sin revisión impresa se confunde con otra."
    solucion: "Posiciones, coordenadas; rotaciones, girados; revisión, versión; DNP, sin poblar."

  - id: pregunta-serie
    tipo: pregunta
    titulo: "Del prototipo a la serie"
    texto: "El prototipo funcionaba. ¿Qué puede revelar la serie que él ocultaba?"
    libro: [314, 316]
    widget:
      tipo: figura
      figura: fig-40.14
      zonas:
        - { id: vscore, rotulo: "Panel de la izquierda", rect: [10, 60, 216, 92] }
    opciones:
      - texto: "Problemas de rendimiento por la dispersión del proceso"
        bien: true
        porque: "Las tolerancias producen dispersión que en una unidad no se ve."
      - texto: "Nada: si una funciona, funcionan todas"
        porque: "Una unidad no muestra la dispersión de mil."
      - texto: "Solo diferencias de coste"
        porque: "El coste cambia el criterio, pero la serie también revela problemas de rendimiento."
    escalera:
      - "Una unidad es una muestra de uno."
    solucion: "Problemas de rendimiento que la dispersión del proceso saca a la luz."

  - id: pregunta-banco
    tipo: pregunta
    titulo: "Cinco placas propias"
    texto: "Para un proyecto propio de cinco placas, ¿qué conviene adoptar de todo esto?"
    libro: [310, 319, 320]
    widget:
      tipo: figura
      figura: fig-40.14
      zonas:
        - { id: mouse, rotulo: "Panel de la derecha", rect: [258, 60, 182, 92] }
    opciones:
      - texto: "Revisión y fecha en la serigrafía, y verificar una placa antes de montar el resto"
        bien: true
        porque: "Montar cinco placas con el mismo error cuesta más que comprobar una."
      - texto: "Nada: es solo para producción"
        porque: "Casi todo, sí; estas dos cuestan cero o casi cero."
      - texto: "Fiduciales y panel"
        porque: "Con cinco placas montadas a mano no hacen falta."
    escalera:
      - "Lo que cuesta cero y evita confusiones."
    solucion: "Revisión y fecha impresas, y montar y probar una primero."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [295, 300, 307, 310]
    ideas:
      - { titulo: "Fiduciales.", texto: "Al menos tres, no alineados, sin máscara." }
      - { titulo: "El panel.", texto: "V-scoring para cortes rectos; mouse bites para cualquier contorno." }
      - { titulo: "Producción.", texto: "Posiciones, rotaciones, revisión y DNP." }
      - { titulo: "Primer artículo.", texto: "Una unidad comprobada entera antes de la serie." }
