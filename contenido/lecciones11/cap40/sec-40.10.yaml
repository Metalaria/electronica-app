# Lección 1.2 de la sección 41.10 «Fiduciales, Paneles y Preparación para Producción» (cap40, sec-40.10).
# Formato: contenido/lecciones11/GUIA.md.
# - La figura 41.14 (fig-40.14) con zonas: los dos paneles, el borde de agarre, un fiducial y una pestaña.
# - Sin fórmula ni números que calcular. Paso práctico: «tocar» el panel para un contorno redondeado (mouse bites).
# 1.2.1 (autor121-pc, «aprender haciendo», GUIA §13): los fiduciales, el panel para un contorno redondeado, el borde
# de agarre y la pestaña donde un componente se daña se tocan en la figura 41.14; el sobrecoste de un euro en una
# serie de mil se escribe. Quedan una pregunta de opciones (lo que se adopta en cinco placas propias) y el
# emparejamiento de la preparación.
# 1.3 (contenido13): la exploración de la figura lleva objetivo de zonas («explorar sin modelo», GUIA §13.3): 5/8 → 6/8.
leccion: cap40/sec-40.10

libro:
  292: "elementos que no tienen función eléctrica y que la producción necesita"
  294: "la máquina de montaje usa como referencia óptica para saber exactamente dónde está la placa"
  295: "Hacen falta al menos tres, no alineados, cerca de las esquinas"
  296: "no pueden llevar máscara encima"
  300: "Se separa doblando, deja un borde limpio y solo sirve para contornos rectos"
  301: "Un componente demasiado cerca puede dañarse al separar la placa"
  302: "la línea de montaje necesita unos milímetros a cada lado para sujetar el panel, sin componentes"
  305: "con sus coordenadas, rotación y cara"
  306: "el CAD y la máquina pueden usar convenciones distintas para el ángulo cero de un componente"
  307: "La revisión es lo que evita fabricar la versión equivocada"
  308: "Componentes que no se montan (DNP)"
  310: "se monta una unidad y se comprueba entera contra el diseño"
  314: "la serie revela problemas de rendimiento que el prototipo ocultaba"
  313: "Los componentes deben existir en carrete"
  315: "La trazabilidad pasa a importar"
  316: "un componente que cuesta un euro de más es irrelevante en un prototipo y son mil euros en una serie"
  319: "Poner la revisión y la fecha en la serigrafía"
  320: "Montar y verificar una unidad completa antes de montar el resto"
  321: "Paneles de producción con fiduciales, borde de agarre en los dos lados largos"

modelo:
  valores:
    c_e: { sim: "c", nombre: "sobrecoste de un componente", unidad: "€", valor: 1 }
    n_s: { sim: "N", nombre: "placas de la serie", unidad: "", valor: 1000 }
  calculos:
    sobre: { expr: "c_e*n_s", sim: "N·c", nombre: "sobrecoste de la serie", unidad: "€" }

tarjetas:
  - id: explore-panel
    tipo: explorar
    titulo: "De una placa a muchas"
    texto: "La producción necesita elementos sin función eléctrica. Toque los dos paneles, un fiducial y el borde de agarre."
    libro: [292, 294, 302, 321]
    widget:
      tipo: figura
      figura: fig-40.14
      zonas:
        - { id: vscore, rotulo: "Panel de la izquierda", rect: [10, 60, 216, 92], texto: "V-scoring: un surco en V de borde a borde. Se separa doblando." }
        - { id: mouse, rotulo: "Panel de la derecha", rect: [258, 60, 182, 92], texto: "Mouse bites: el contorno se fresa y queda unido por pestañas con taladros." }
        - { id: fiducial, rotulo: "Círculo de abajo a la izquierda", rect: [2, 146, 56, 40], texto: "Un fiducial: la referencia óptica de la máquina de montaje." }
        - { id: agarre, rotulo: "Franja de arriba a la derecha", rect: [270, 22, 170, 36], texto: "El borde de agarre: unos milímetros a cada lado, sin componentes, para sujetar el panel." }
    objetivo:
      condiciones:
        - { zona: vscore, rotulo: "Un panel" }
        - { zona: mouse, rotulo: "El otro panel" }
        - { zona: fiducial, rotulo: "Una referencia para la máquina" }
        - { zona: agarre, rotulo: "Por dónde se sujeta" }
      logrado: "Dos formas de separar las placas, las referencias ópticas de la máquina y el borde de agarre: nada de eso tiene función eléctrica, y hay que preverlo en el diseño."
      pistas:
        - { cuando: { zona: fiducial, valor: 0 }, texto: "Falta un círculo de cobre de una esquina." }
        - { cuando: { zona: agarre, valor: 0 }, texto: "Falta la franja del borde, sin placas." }
        - { texto: "Toque los dos paneles." }
    escalera:
      - "Dos paneles grandes, un círculo en una esquina y una franja en el borde."
    solucion: "Los dos paneles, el círculo de abajo a la izquierda y la franja de arriba a la derecha."

  - id: predecir-fiduciales
    tipo: tocar
    titulo: "Los fiduciales"
    texto: "La máquina de montaje necesita al menos tres referencias ópticas, no alineadas, cerca de las esquinas. Toque las del panel de la izquierda."
    libro: [294, 295, 296]
    widget:
      tipo: figura
      figura: fig-40.14
      zonas:
        - { id: f1, rotulo: "Círculo de arriba a la izquierda", rect: [2, 20, 56, 38] }
        - { id: f2, rotulo: "Círculo de abajo a la izquierda", rect: [2, 148, 56, 38] }
        - { id: f3, rotulo: "Círculo de abajo a la derecha", rect: [170, 148, 56, 38] }
        - { id: esquina, rotulo: "Esquina de arriba a la derecha", rect: [170, 20, 56, 38] }
        - { id: placa, rotulo: "Placa de arriba a la izquierda", rect: [62, 60, 90, 80] }
    tocar:
      bien: [f1, f2, f3]
      todas: true
      porque:
        esquina: "Ahí no hay fiducial: con tres no alineados la máquina ya sabe dónde está el panel."
        placa: "Es una de las placas; los fiduciales del panel están en el borde."
    exito: "Tres, no alineados, cerca de las esquinas: cobre desnudo, sin máscara encima ni nada cerca que la cámara confunda."
    escalera:
      - "Busque los círculos de cobre de las esquinas."
    solucion: "Los tres círculos: arriba a la izquierda, abajo a la izquierda y abajo a la derecha."

  - id: toque-contorno
    tipo: tocar
    titulo: "Un contorno redondeado"
    texto: "Las placas tienen las esquinas redondeadas. Toque el panel que permite separarlas."
    libro: [300]
    widget:
      tipo: figura
      figura: fig-40.14
      zonas:
        - { id: vscore, rotulo: "Panel de la izquierda", rect: [10, 60, 216, 92] }
        - { id: mouse, rotulo: "Panel de la derecha", rect: [258, 60, 182, 92] }
    tocar:
      bien: [mouse]
      porque:
        vscore: "El V-scoring es un corte recto de borde a borde: solo sirve para contornos rectos."
    exito: "Mouse bites: sirven para cualquier contorno, con un borde rugoso que a veces hay que limar."
    escalera:
      - "Un surco en V solo puede ser una línea recta."
    solucion: "El de la derecha, con pestañas y taladros."

  - id: empareje-separar
    tipo: tocar
    titulo: "El borde de agarre"
    texto: "La línea de montaje sujeta el panel por unos milímetros a cada lado. En el panel de la derecha, toque esa franja."
    libro: [302, 321]
    widget:
      tipo: figura
      figura: fig-40.14
      zonas:
        - { id: agarre, rotulo: "Franja de arriba", rect: [262, 20, 176, 38] }
        - { id: placa, rotulo: "Placa de la izquierda", rect: [272, 64, 70, 70] }
        - { id: pestana, rotulo: "Puntos de abajo, a la izquierda", rect: [280, 132, 60, 36] }
    tocar:
      bien: [agarre]
      porque:
        placa: "Es una placa, con sus componentes."
        pestana: "Es una pestaña con taladros: une la placa al panel hasta separarla."
    exito: "El borde de agarre, sin componentes. Si la placa no lo tiene, el panel debe añadirlo."
    escalera:
      - "Busque una franja continua en el borde, sin placa."
    solucion: "La franja de arriba."

  - id: toque-pestana
    tipo: tocar
    titulo: "Un componente dañado"
    texto: "Al separar las placas, un componente del borde se rompió. Toque el sitio junto al que estaba demasiado cerca."
    libro: [300, 301]
    widget:
      tipo: figura
      figura: fig-40.14
      zonas:
        - { id: agarre, rotulo: "Franja de arriba", rect: [262, 20, 176, 38] }
        - { id: placa, rotulo: "Centro de la placa izquierda", rect: [270, 64, 70, 60] }
        - { id: pestana, rotulo: "Puntos de abajo, a la izquierda", rect: [280, 132, 60, 36] }
    tocar:
      bien: [pestana]
      porque:
        agarre: "El borde de agarre se sujeta, no se rompe; y no lleva componentes."
        placa: "El centro de la placa no sufre al separarla."
    exito: "La línea de separación: hay que dejar espacio libre junto a ella, y el material sobrante de los mouse bites puede chocar con la caja."
    escalera:
      - "¿Dónde se parte el panel?"
    solucion: "La pestaña con taladros."

  - id: empareje-produccion
    tipo: pregunta
    titulo: "Preparar para la producción"
    texto: "Empareje cada preparación con lo que evita o aporta."
    libro: [305, 306, 307, 308]
    emparejar:
      - ["Fichero de posiciones", "Coordenadas, rotación y cara"]
      - ["Comprobar las rotaciones", "Integrados montados girados"]
      - ["Revisión en la placa", "Fabricar la versión equivocada"]
      - ["Marcar las DNP", "Posiciones previstas sin poblar"]
    exito: "El ángulo cero del CAD y el de la máquina pueden no coincidir."
    pistas:
      - { texto: "DNP son los componentes que no se montan." }
    escalera:
      - "Una placa sin revisión impresa se confunde con otra."
    solucion: "Posiciones, coordenadas; rotaciones, girados; revisión, versión; DNP, sin poblar."

  - id: pregunta-serie
    tipo: leer
    titulo: "Del prototipo a la serie"
    texto: "Un componente cuesta un euro de más. En un prototipo es irrelevante; escriba lo que suma en una serie de mil placas."
    libro: [313, 314, 315, 316]
    widget:
      tipo: grafica
      x: { id: nn, min: 1, max: 1000, unidad: "", rotulo: "placas" }
      y: { min: 0, max: 1100, unidad: "€", rotulo: "sobrecoste" }
      curvas:
        - { expr: "c_e*nn", color: naranja, rotulo: "un euro por placa" }
      mandos: []
    leer:
      objetivo: sobre
      unidad: "€"
      tol: 0.01
      rotulo: "Sobrecoste de la serie"
      errores:
        - { expr: "c_e", texto: "Ese es el euro de una placa: en la serie se paga en cada una." }
    exito: "Mil euros: el coste unitario cambia el criterio de todas las decisiones. Y la serie trae carretes, dispersión y trazabilidad."
    escalera:
      - "Un euro por cada placa de la serie."
    solucion: "1000 placas × 1 € = 1000 €."
    comprobar:
      - { sobre: 1000 }

  - id: pregunta-banco
    tipo: pregunta
    titulo: "Cinco placas propias"
    texto: "Para un proyecto propio de cinco placas, ¿qué conviene adoptar de todo esto?"
    libro: [310, 319, 320]
    widget:
      tipo: figura
      figura: fig-40.14
      zonas:
        - { id: mouse, rotulo: "Panel de la derecha", rect: [258, 60, 182, 92] }
    opciones:
      - texto: "Revisión y fecha en la serigrafía, y verificar una placa antes de montar el resto"
        bien: true
        porque: "Montar cinco placas con el mismo error cuesta más que comprobar una."
      - texto: "Nada: es solo para producción"
        porque: "Casi todo, sí; estas dos cuestan cero o casi cero."
      - texto: "Fiduciales y panel"
        porque: "Con cinco placas montadas a mano no hacen falta."
    escalera:
      - "Lo que cuesta cero y evita confusiones."
    solucion: "Revisión y fecha impresas, y montar y probar una primero."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [295, 300, 307, 310]
    ideas:
      - { titulo: "Fiduciales.", texto: "Al menos tres, no alineados, sin máscara." }
      - { titulo: "El panel.", texto: "V-scoring para cortes rectos; mouse bites para cualquier contorno." }
      - { titulo: "Producción.", texto: "Posiciones, rotaciones, revisión y DNP." }
      - { titulo: "Primer artículo.", texto: "Una unidad comprobada entera antes de la serie." }
