# Lección 1.2 de la sección 41.7 «Térmica en la Placa» (cap40, sec-40.7). Formato: contenido/lecciones11/GUIA.md.
# - La tabla del bloque 199 en un mando de lista: 1, 5, 10 y 25 cm² → 70 (el punto que dibuja la figura 41.11 en el
#   intervalo 60–80 del libro), 35, 25 y 20 °C/W. La gráfica es T = T_a + P·R frente a la potencia.
# - Paso práctico: «ajuste» del área de cobre para un SMD que disipa 2 W (valor de ejemplo, rotulado) en una caja a
#   50 °C (bloque 93: «dentro de una caja puede estar ya a 50 o 60 °C») sin pasar de 110 °C (cap10#129, «diseñar para
#   100 o 110 °C de unión en el peor caso»): 5 cm² da 120 °C, 10 cm² da 100 °C.
# - Sin fórmula del libro (la sección no tiene ecuaciones; la subida es resistencia × potencia, sección 10.5).
leccion: cap40/sec-40.7

libro:
  195: "el calor sale por las almohadillas hacia el cobre de la placa, que actúa de disipador"
  196: "no es una propiedad del componente, sino del conjunto componente-más-placa"
  199: "5 cm²"
  201: "Doblar el área no divide por dos la resistencia térmica"
  202: "A partir de unos 25 cm² apenas se gana"
  204: "Prácticamente dobla la superficie efectiva"
  205: "los planos internos conducen el calor lateralmente mucho mejor que una sola cara"
  206: "Cobre más grueso (70 µm, «2 oz»)"
  207: "Dos reguladores juntos se calientan mutuamente"
  208: "los componentes sensibles abajo y los calientes arriba"
  211: "electrolíticos (cuya vida se divide por dos cada 10 °C"
  212: "ningún electrolítico junto a un disipador o a un regulador"
  214: "El derating debe aplicarse a la temperatura interior de la caja"
  216: "la temperatura del componente más caliente, la del ambiente dentro de la caja y la exterior"
  217: "el modelo de resistencia térmica usado no correspondía a la placa real"
  218: "Resistencia térmica según el área de cobre"
  "cap40#93": "dentro de una caja puede estar ya a 50 o 60 °C"
  "cap10#129": "Diseñar para 100 o 110 °C de unión en el peor caso es la práctica sensata"

modelo:
  valores:
    R_cu: { sim: "R_{θ}", nombre: "resistencia térmica del cobre", unidad: "°C/W", valor: 35 }
    P_t: { sim: "P", nombre: "potencia disipada (ejemplo)", unidad: W, valor: 1 }
    T_at: { sim: "T_{a}", nombre: "temperatura ambiente", unidad: "°C", valor: 25 }
  calculos:
    T_c: { expr: "T_at + P_t*R_cu", sim: "T", nombre: "temperatura del componente", unidad: "°C" }
    dT_c: { expr: "P_t*R_cu", sim: "ΔT", nombre: "subida", unidad: "°C" }

tarjetas:
  - id: explore-figura
    tipo: explorar
    titulo: "La placa es el disipador"
    texto: "En un SMD el calor sale por las almohadillas al cobre. Toque la curva y los tres grupos que hay que vigilar."
    libro: [195, 211, 218]
    widget:
      tipo: figura
      figura: fig-40.11
      zonas:
        - { id: curva, rotulo: "La gráfica", rect: [30, 18, 205, 180], texto: "Resistencia térmica según el área de cobre: baja deprisa al principio y apenas a partir de 25 cm²." }
        - { id: disipan, rotulo: "Recuadro rojo", rect: [255, 29, 182, 45], texto: "Los que disipan más de unos cientos de miliwatios: reguladores lineales, transistores de potencia, resistencias de sensado." }
        - { id: sensibles, rotulo: "Recuadro naranja", rect: [255, 76, 182, 45], texto: "Los sensibles al calor: electrolíticos, cristales, referencias y sensores." }
        - { id: lado, rotulo: "Recuadro azul", rect: [255, 122, 182, 40], texto: "Los que están al lado: el calor del vecino entra en su cadena térmica." }
    requiere: { mover: [curva, disipan, sensibles] }

  - id: porque-hoja
    tipo: porque
    titulo: "La cifra de la hoja de datos"
    texto: "¿Por qué la resistencia térmica de un SMD que da su hoja de datos no vale para cualquier placa?"
    libro: [196]
    widget:
      tipo: figura
      figura: fig-40.11
      zonas:
        - { id: curva, rotulo: "La gráfica", rect: [30, 18, 205, 180] }
    opciones:
      - texto: "Es del conjunto componente más placa de referencia normalizada"
        bien: true
        porque: "Con una placa distinta el resultado es distinto: la placa es el disipador."
      - texto: "Porque los fabricantes la exageran"
        porque: "No es un problema de exageración: se mide sobre una placa concreta."
      - texto: "Sí vale: es una propiedad del componente"
        porque: "En un SMD el camino principal del calor es la placa, que cambia de un diseño a otro."
    escalera:
      - "¿Por dónde sale el calor de un SMD?"
    solucion: "Porque se mide sobre una placa de referencia: es del conjunto."

  - id: explore-area
    tipo: explorar
    titulo: "Cuánto disipa un área de cobre"
    texto: "Cobre de 35 µm en una cara, convección natural. Cambie el área y la potencia, y mire la temperatura."
    libro: [199, 218]
    widget:
      tipo: grafica
      x: { id: pp, min: 0, max: 3, unidad: W, rotulo: "P" }
      y: { min: 0, max: 250, unidad: "°C", rotulo: "T" }
      curvas:
        - { expr: "T_at + pp*R_cu", color: naranja, rotulo: "T = T_a + P·R" }
      marcas:
        - { x: "P_t", y: "T_c", rotulo: "{{T_c}}" }
      lectura: { valor: T_c, rotulo: "Temperatura del componente" }
      datos:
        - { valor: R_cu, rotulo: "Resistencia térmica: {{R_cu}}" }
      mandos:
        - { valor: R_cu, lista: [70, 35, 25, 20], nombres: ["1 cm²", "5 cm²", "10 cm²", "25 cm²"], rotulo: "Área de cobre" }
        - { valor: P_t, min: 0.25, max: 3, paso: 0.25, rotulo: "Potencia, P" }
    requiere: { mover: [R_cu] }

  - id: predecir-doble
    tipo: predecir
    titulo: "El doble de cobre"
    texto: "Con 5 cm² la resistencia térmica es de unos 35 °C/W. ¿Y con 10 cm²?"
    libro: [199, 201]
    fijar: { R_cu: 25 }
    widget:
      tipo: grafica
      x: { id: pp, min: 0, max: 3, unidad: W, rotulo: "P" }
      y: { min: 0, max: 250, unidad: "°C", rotulo: "T" }
      curvas:
        - { expr: "T_at + pp*R_cu", color: naranja, rotulo: "T = T_a + P·R" }
      lectura: { valor: R_cu, rotulo: "Resistencia térmica" }
      ocultar: true
      mandos: []
    opciones:
      - texto: "Unos 25 °C/W"
        bien: true
        porque: "Doblar el área no divide por dos: el calor se extiende peor cuanto más lejos."
      - texto: "La mitad de 35 °C/W"
        porque: "Sería así si fuera proporcional; el cobre tiene resistencia térmica lateral."
      - texto: "Unos 35 °C/W: no cambia"
        porque: "Sí baja, aunque cada vez menos."
    escalera:
      - "Mire la tabla: rendimiento decreciente."
    solucion: "Unos 25 °C/W: menos de lo que se esperaría."

  - id: pregunta-25
    tipo: pregunta
    titulo: "Más allá de 25 cm²"
    texto: "Con 25 cm² de cobre el componente sigue demasiado caliente. ¿Qué hacer?"
    libro: [202]
    widget:
      tipo: figura
      figura: fig-40.11
      zonas:
        - { id: curva, rotulo: "La gráfica", rect: [30, 18, 205, 180] }
    opciones:
      - texto: "Otra cosa: disipador atornillado, ventilación o menos potencia"
        bien: true
        porque: "A partir de unos 25 cm² apenas se gana con más cobre."
      - texto: "Doblar el área de cobre"
        porque: "En esa zona la curva es casi plana: apenas baja."
      - texto: "Quitar la máscara del cobre"
        porque: "El libro no la da como solución; el cuello de botella es el área."
    escalera:
      - "Mire la zona sombreada de la gráfica."
    solucion: "Disipador, ventilación o reducir la potencia."

  - id: ajuste-area
    tipo: ajuste
    titulo: "Ajuste el cobre"
    texto: "Un SMD disipa 2 W (valor de ejemplo) en una caja a 50 °C. Elija el área para no pasar de 110 °C."
    libro: [199, "cap40#93", "cap10#129"]
    fijar: { P_t: 2, T_at: 50 }
    inicio: { R_cu: 70 }
    widget:
      tipo: grafica
      x: { id: pp, min: 0, max: 3, unidad: W, rotulo: "P" }
      y: { min: 0, max: 250, unidad: "°C", rotulo: "T" }
      curvas:
        - { expr: "T_at + pp*R_cu", color: naranja, rotulo: "T = T_a + P·R" }
      marcas:
        - { x: "P_t", y: "T_c", rotulo: "{{T_c}}" }
      lectura: { valor: T_c, rotulo: "Temperatura del componente" }
      mandos:
        - { valor: R_cu, lista: [70, 35, 25, 20], nombres: ["1 cm²", "5 cm²", "10 cm²", "25 cm²"], rotulo: "Área de cobre" }
    ajuste:
      valor: T_c
      max: 110
      rotulo: "Temperatura"
      escala: { min: 50, max: 200 }
      alto: "Demasiado caliente: más área de cobre."
      dentro: "Dentro: diseñar para 100 o 110 °C en el peor caso es la práctica sensata."
    exito: "Con 10 cm², 100 °C; con 5 cm² serían 120 °C."
    comprobar:
      - { con: { R_cu: 25 }, T_c: 100 }
      - { con: { R_cu: 35 }, T_c: 120 }

  - id: empareje-mejorar
    tipo: pregunta
    titulo: "Cómo mejorar la evacuación"
    texto: "Empareje cada recurso con lo que consigue."
    libro: [204, 205, 206, 207]
    emparejar:
      - ["Cobre en ambas caras con vías térmicas", "Casi dobla la superficie efectiva"]
      - ["Planos internos", "Conducen el calor lateralmente"]
      - ["Cobre de 70 µm", "Mejor conducción y ampacidad"]
      - ["Separar los componentes calientes", "No se calientan mutuamente"]
    exito: "Dos reguladores juntos se calientan entre sí y ninguno cumple su cálculo."
    pistas:
      - { texto: "Las vías térmicas unen el cobre de las dos caras." }
    escalera:
      - "Dos onzas son más cobre para el calor y para la corriente."
    solucion: "Ambas caras, el doble; internos, lateral; 70 µm, conducción; separar, sin calentarse."

  - id: toque-regla
    tipo: tocar
    titulo: "La regla que vale mucho"
    texto: "Una fuente falla justamente por el condensador que estaba al lado del regulador. Toque el grupo de ese condensador."
    libro: [211, 212]
    widget:
      tipo: figura
      figura: fig-40.11
      zonas:
        - { id: disipan, rotulo: "Recuadro rojo", rect: [255, 29, 182, 45] }
        - { id: sensibles, rotulo: "Recuadro naranja", rect: [255, 76, 182, 45] }
        - { id: lado, rotulo: "Recuadro azul", rect: [255, 122, 182, 40] }
    tocar:
      bien: [sensibles]
      porque:
        disipan: "Ahí está el regulador, que genera el calor; el electrolítico lo sufre."
        lado: "Estar al lado es la causa, pero el electrolítico es del grupo de los sensibles."
    exito: "Su vida se divide por dos cada 10 °C: ningún electrolítico junto a un disipador o un regulador."
    escalera:
      - "Un electrolítico no genera calor, pero lo sufre."
    solucion: "El naranja: los sensibles al calor."

  - id: pregunta-vertical
    tipo: pregunta
    titulo: "Una placa vertical"
    texto: "La placa irá vertical dentro del equipo. ¿Cómo se reparten los componentes?"
    libro: [208]
    widget:
      tipo: figura
      figura: fig-40.11
      zonas:
        - { id: disipan, rotulo: "Recuadro rojo", rect: [255, 29, 182, 45] }
    opciones:
      - texto: "Los sensibles abajo y los calientes arriba"
        bien: true
        porque: "El aire que calientan sube sin pasar por los demás; y espacio libre encima."
      - texto: "Los calientes abajo, para que el aire los enfríe primero"
        porque: "Ese aire caliente subiría por todos los demás."
      - texto: "Da igual: la convección no depende de la posición"
        porque: "Depende: el aire caliente sube."
    escalera:
      - "¿Hacia dónde va el aire caliente?"
    solucion: "Sensibles abajo, calientes arriba."

  - id: pregunta-caja
    tipo: pregunta
    titulo: "La componente que se olvida"
    texto: "Un equipo cerrado funciona al sol. ¿A qué temperatura se aplica el derating?"
    libro: [214, 216, 217]
    widget:
      tipo: figura
      figura: fig-40.11
      zonas:
        - { id: lado, rotulo: "Recuadro azul", rect: [255, 122, 182, 40] }
    opciones:
      - texto: "A la del interior de la caja, medida"
        bien: true
        porque: "Esa temperatura hay que medirla, no suponerla; con termopar y el equipo en régimen."
      - texto: "A la del laboratorio"
        porque: "Dentro de la caja el ambiente es muy superior."
      - texto: "A la del componente más caliente"
        porque: "Esa es la que se calcula; el derating parte del ambiente que lo rodea."
    escalera:
      - "El calor también entra desde fuera."
    solucion: "A la temperatura interior de la caja, medida."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [196, 201, 202, 212]
    ideas:
      - { titulo: "La placa disipa.", texto: "La cifra de la hoja es del componente sobre una placa de referencia." }
      - { titulo: "Rendimiento decreciente.", texto: "Doblar el área no divide por dos; a partir de 25 cm² apenas se gana." }
      - { titulo: "Más cobre.", texto: "Dos caras con vías, planos internos, 70 µm." }
      - { titulo: "Colocación.", texto: "Ningún electrolítico junto a un disipador o un regulador." }
