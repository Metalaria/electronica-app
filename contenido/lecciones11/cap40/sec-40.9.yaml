# Lección 1.2 de la sección 41.9 «Colocación y Particionado» (cap40, sec-40.9). Formato: contenido/lecciones11/GUIA.md.
# - La figura 41.13 (fig-40.13) con zonas: interfaz, analógico, A/D en la frontera, digital y potencia.
# - Sin fórmula ni números que calcular (sección de criterio). Paso práctico: «tocar» la zona de ruido y calor.
# 1.2.1 (autor121-pc, «aprender haciendo», GUIA §13): las zonas, el A/D en la frontera y tres reglas «que no admiten
# negociación» (la más incumplida, la del transitorio, la del cristal caliente) se tocan en la figura 41.13; la
# orientación uniforme, en la figura 47.9 (DFM); la impresión 1:1 contra las trampas mecánicas, en la figura 41.1.
# Quedan una pregunta de opciones (por qué la colocación manda) y el orden de colocación.
leccion: cap40/sec-40.9

libro:
  251: "una buena colocación hace el trazado fácil, y una mala lo hace imposible"
  252: "la colocación determina la longitud de las conexiones, el área de los bucles y qué corrientes comparten camino"
  254: "Lo que tiene posición fija: conectores, tornillos, indicadores"
  255: "Los componentes grandes y calientes"
  256: "Los integrados principales, orientados según el flujo de señal"
  257: "Lo demás, agrupado con el integrado al que pertenece"
  258: "va de lo más restringido a lo más libre"
  261: "Potencia: fuente, conmutación, disipación. Es la fuente de ruido y de calor."
  262: "Analógico sensible"
  263: "Digital rápido"
  264: "Interfaz externa"
  265: "Un convertidor A/D se coloca en la frontera entre lo analógico y lo digital"
  268: "Desacoplo: pegado al pin, con vías cortas"
  269: "Cristal: lo más cerca posible del microcontrolador"
  270: "El bucle de conmutación de una fuente"
  271: "la pista que sensa la salida debe medir donde importa la tensión"
  272: "Componentes de RF: según la nota de aplicación, al milímetro"
  273: "Protecciones de entrada: junto al conector"
  275: "Componentes polarizados en la misma dirección siempre que se pueda"
  276: "alineados en filas y columnas"
  277: "debe poder desoldarse sin dañar los vecinos"
  278: "Acceso a los ajustes y a los puntos de prueba desde arriba"
  281: "un electrolítico alto bajo una carcasa baja"
  285: "La defensa es el modelo 3D"
  287: "imprimir la placa a tamaño real, recortarla y meterla en la caja"
  288: "si un electrolítico o un cristal está notablemente más caliente de lo que debería"
  289: "Particionado por zonas funcionales"
  "cap40#31": "Imprimir la placa a escala 1:1 y colocar encima los componentes reales"
  "cap46#145": "una fila de marcas alineadas"

modelo: { valores: {}, calculos: {} }

tarjetas:
  - id: explore-zonas
    tipo: explorar
    titulo: "Particionar por función"
    texto: "Agrupar por función evita que los retornos se solapen. Toque las cuatro zonas."
    libro: [261, 262, 263, 264, 289]
    widget:
      tipo: figura
      figura: fig-40.13
      zonas:
        - { id: interfaz, rotulo: "Interfaz", rect: [14, 26, 88, 57], texto: "Interfaz externa: conectores, protecciones, aisladores." }
        - { id: analogico, rotulo: "Analógico", rect: [119, 26, 100, 57], texto: "Analógico sensible: sensores, amplificadores, referencias, convertidores." }
        - { id: digital, rotulo: "Digital", rect: [290, 26, 149, 57], texto: "Digital rápido: microcontrolador, memorias, buses." }
        - { id: potencia, rotulo: "Potencia", rect: [265, 100, 174, 36], texto: "Fuente, conmutación, disipación: la fuente de ruido y de calor." }
    requiere: { mover: [interfaz, analogico, digital, potencia] }

  - id: porque-colocacion
    tipo: porque
    titulo: "El trazado empieza por la colocación"
    texto: "¿Por qué una mala colocación no la arregla ningún trazado?"
    libro: [251, 252]
    widget:
      tipo: figura
      figura: fig-40.13
      zonas:
        - { id: placa, rotulo: "La placa", rect: [4, 2, 440, 135] }
    opciones:
      - texto: "Decide la longitud de las conexiones, el área de los bucles y qué corrientes comparten camino"
        bien: true
        porque: "Son los tres factores de los capítulos 41 y 42: el trazado ya no los cambia."
      - texto: "Porque las pistas no pueden doblarse"
        porque: "Pueden; lo que no pueden es acortar lo que la colocación alargó."
      - texto: "No es así: un buen trazado lo arregla todo"
        porque: "Un trazado excelente no arregla una colocación mala."
    escalera:
      - "Piense en qué fija la posición de cada pieza."
    solucion: "Longitudes, áreas de bucle y caminos compartidos."

  - id: ordene-colocacion
    tipo: pregunta
    titulo: "El orden en que se coloca"
    texto: "Ordene la colocación, de lo primero a lo último."
    libro: [254, 255, 256, 257, 258]
    widget:
      tipo: figura
      figura: fig-40.13
      zonas:
        - { id: placa, rotulo: "La placa", rect: [4, 2, 440, 135] }
    ordenar:
      - "Lo de posición fija: conectores, tornillos, indicadores."
      - "Lo grande y caliente: transformadores, disipadores."
      - "Los integrados principales, según el flujo de señal."
      - "Lo demás, con su integrado."
    exito: "De lo más restringido a lo más libre."
    pistas:
      - { texto: "Empiece por lo que no es negociable." }
    escalera:
      - "Lo que asoma por la caja no se puede mover."
    solucion: "Fijo, grande y caliente, integrados, el resto."

  - id: toque-potencia
    tipo: tocar
    titulo: "Ruido y calor"
    texto: "Toque la zona que es la fuente de ruido y de calor de la placa."
    libro: [261]
    widget:
      tipo: figura
      figura: fig-40.13
      zonas:
        - { id: interfaz, rotulo: "Recuadro naranja", rect: [14, 26, 88, 57] }
        - { id: analogico, rotulo: "Recuadro verde", rect: [119, 26, 100, 57] }
        - { id: digital, rotulo: "Recuadro azul", rect: [290, 26, 149, 57] }
        - { id: potencia, rotulo: "Recuadro rojo", rect: [265, 100, 174, 36] }
    tocar:
      bien: [potencia]
      porque:
        interfaz: "Conectores y protecciones reciben transitorios, pero no son la fuente."
        analogico: "Es lo sensible: la víctima, no la fuente."
        digital: "Conmuta, pero la fuente de ruido y de calor es la potencia."
    exito: "La potencia: fuente, conmutación y disipación."
    escalera:
      - "Donde se conmuta y se disipa más energía."
    solucion: "El recuadro rojo, la potencia."

  - id: pregunta-ad
    tipo: tocar
    titulo: "El convertidor A/D"
    texto: "La señal fluye en un sentido, de una zona a otra. Toque dónde se coloca el convertidor A/D."
    libro: [265]
    widget:
      tipo: figura
      figura: fig-40.13
      zonas:
        - { id: interfaz, rotulo: "Recuadro naranja", rect: [14, 26, 88, 57] }
        - { id: analogico, rotulo: "Recuadro verde", rect: [119, 26, 100, 57] }
        - { id: ad, rotulo: "Recuadro morado", rect: [220, 44, 69, 33] }
        - { id: digital, rotulo: "Recuadro azul", rect: [290, 26, 149, 57] }
        - { id: potencia, rotulo: "Recuadro rojo", rect: [265, 100, 174, 36] }
    tocar:
      bien: [ad]
      porque:
        interfaz: "Es la entrada de la placa: conectores y protecciones."
        analogico: "Dentro de lo analógico quedaría lejos del digital que lee sus datos."
        digital: "Dentro de lo digital, su parte analógica quedaría rodeada de ruido de conmutación."
        potencia: "Junto a la fuente de ruido y calor es donde peor estaría."
    exito: "En la frontera, con su parte analógica mirando a lo analógico: tiene un pie en cada mundo."
    escalera:
      - "Tiene un pie en cada mundo."
    solucion: "El recuadro morado, en la frontera."

  - id: empareje-casos
    tipo: tocar
    titulo: "Lo que no admite negociación"
    texto: "Toque la regla de colocación más incumplida y la de mayor efecto."
    libro: [268, 269, 270, 271, 272, 273]
    widget:
      tipo: figura
      figura: fig-40.13
      zonas:
        - { id: desacoplo, rotulo: "Abajo, primera regla de la izquierda", rect: [15, 168, 210, 16] }
        - { id: cristal, rotulo: "Abajo, segunda de la izquierda", rect: [15, 184, 210, 16] }
        - { id: bucle, rotulo: "Abajo, tercera de la izquierda", rect: [15, 200, 210, 16] }
        - { id: realim, rotulo: "Abajo, primera de la derecha", rect: [230, 168, 215, 16] }
        - { id: rf, rotulo: "Abajo, segunda de la derecha", rect: [230, 184, 215, 16] }
        - { id: protecciones, rotulo: "Abajo, tercera de la derecha", rect: [230, 200, 215, 16] }
    tocar:
      bien: [desacoplo]
      porque:
        cristal: "Esa regla es otra: cristal junto al micro, sin nada que conmute cerca."
        bucle: "Esa regla es otra: el bucle de conmutación de una fuente, en el área mínima."
        realim: "Esa regla es otra: la realimentación del regulador mide donde importa la tensión."
        rf: "Esa regla es otra: los componentes de RF, al milímetro según la nota de aplicación."
        protecciones: "Esa regla es otra: las protecciones de entrada, junto al conector."
    exito: "El desacoplo, pegado al pin y con vías cortas: la más incumplida y la de mayor efecto."
    escalera:
      - "Es la que se ve en casi todos los integrados de la placa."
    solucion: "La primera de la izquierda: el desacoplo."

  - id: toque-transitorio
    tipo: tocar
    titulo: "Un transitorio que recorre la placa"
    texto: "Una descarga en el conector de entrada recorre media placa antes de llegar a su protección. Toque la regla que se incumplió."
    libro: [273]
    widget:
      tipo: figura
      figura: fig-40.13
      zonas:
        - { id: desacoplo, rotulo: "Abajo, primera regla de la izquierda", rect: [15, 168, 210, 16] }
        - { id: cristal, rotulo: "Abajo, segunda de la izquierda", rect: [15, 184, 210, 16] }
        - { id: bucle, rotulo: "Abajo, tercera de la izquierda", rect: [15, 200, 210, 16] }
        - { id: realim, rotulo: "Abajo, primera de la derecha", rect: [230, 168, 215, 16] }
        - { id: rf, rotulo: "Abajo, segunda de la derecha", rect: [230, 184, 215, 16] }
        - { id: protecciones, rotulo: "Abajo, tercera de la derecha", rect: [230, 200, 215, 16] }
    tocar:
      bien: [protecciones]
      porque:
        desacoplo: "Esa regla es otra: desacoplo pegado al pin, con vías cortas."
        cristal: "Esa regla es otra: cristal junto al micro, sin nada que conmute cerca."
        bucle: "Esa regla es otra: el bucle de conmutación de una fuente, en el área mínima."
        realim: "Esa regla es otra: la realimentación del regulador mide donde importa la tensión."
        rf: "Esa regla es otra: los componentes de RF, al milímetro según la nota de aplicación."
    exito: "Las protecciones de entrada van junto al conector, para que el transitorio no recorra la placa."
    escalera:
      - "¿Dónde entra el transitorio?"
    solucion: "La tercera de la derecha: protecciones junto al conector."

  - id: pregunta-banco
    tipo: tocar
    fase: "En el banco"
    titulo: "En el banco, ya montada"
    texto: "Con la placa funcionando, el cristal está notablemente más caliente de lo que debería: lo colocaron junto a la fuente. Toque la regla incumplida."
    libro: [269, 288]
    widget:
      tipo: figura
      figura: fig-40.13
      zonas:
        - { id: desacoplo, rotulo: "Abajo, primera regla de la izquierda", rect: [15, 168, 210, 16] }
        - { id: cristal, rotulo: "Abajo, segunda de la izquierda", rect: [15, 184, 210, 16] }
        - { id: bucle, rotulo: "Abajo, tercera de la izquierda", rect: [15, 200, 210, 16] }
        - { id: realim, rotulo: "Abajo, primera de la derecha", rect: [230, 168, 215, 16] }
        - { id: rf, rotulo: "Abajo, segunda de la derecha", rect: [230, 184, 215, 16] }
        - { id: protecciones, rotulo: "Abajo, tercera de la derecha", rect: [230, 200, 215, 16] }
    tocar:
      bien: [cristal]
      porque:
        desacoplo: "Esa regla es otra: desacoplo pegado al pin, con vías cortas."
        bucle: "Esa regla es otra: el bucle de conmutación de una fuente, en el área mínima."
        realim: "Esa regla es otra: la realimentación del regulador mide donde importa la tensión."
        rf: "Esa regla es otra: los componentes de RF, al milímetro según la nota de aplicación."
        protecciones: "Esa regla es otra: las protecciones de entrada, junto al conector."
    exito: "El cristal, junto al micro y sin nada que conmute cerca. Si está más caliente de lo debido, la colocación lo puso donde no debía."
    escalera:
      - "Busque la regla que habla del cristal."
    solucion: "La segunda de la izquierda: el cristal."

  - id: empareje-montaje
    tipo: tocar
    titulo: "La orientación y el montaje"
    texto: "Un diodo montado al revés pasa la inspección sin que nadie lo vea. Toque la regla de montaje que lo habría delatado."
    libro: [275, 276, 277, 278, "cap46#145"]
    widget:
      tipo: figura
      figura: fig-46.9
      zonas:
        - { id: orientacion, rotulo: "Columna del centro, arriba", rect: [153, 29, 142, 50] }
        - { id: lado, rotulo: "Columna del centro, en medio", rect: [153, 86, 142, 50] }
        - { id: ocultos, rotulo: "Columna del centro, abajo", rect: [153, 144, 142, 50] }
    tocar:
      bien: [orientacion]
      porque:
        lado: "Montar por un solo lado ahorra una pasada de reflujo; no delata piezas giradas."
        ocultos: "Evitar contactos ocultos facilita la inspección de soldaduras, no la polaridad."
    exito: "Polarizados en la misma dirección: una fila de marcas alineadas delata la pieza girada. Y dos terminales en filas, espacio de retrabajo y ajustes accesibles."
    escalera:
      - "¿Qué hace que una pieza girada salte a la vista?"
    solucion: "Orientación uniforme."

  - id: pregunta-trampas
    tipo: tocar
    titulo: "Las trampas mecánicas"
    texto: "Un electrolítico alto queda bajo una carcasa baja, y se descubre tarde. Toque la comprobación que lo habría detectado a tiempo."
    libro: [281, 285, 287, "cap40#31"]
    widget:
      tipo: figura
      figura: fig-40.1
      zonas:
        - { id: imprimir, rotulo: "Abajo a la izquierda", rect: [4, 175, 219, 77] }
        - { id: gerbers, rotulo: "Abajo a la derecha", rect: [228, 175, 220, 77] }
    tocar:
      bien: [imprimir]
      porque:
        gerbers: "El visor enseña los ficheros, no la placa dentro de su caja: no ve alturas."
    exito: "Imprimir a tamaño real, recortar y meterla en la caja con los componentes encima: cinco minutos que detectan colisiones y alturas imposibles. O el modelo 3D."
    escalera:
      - "Hace falta ver la placa dentro de la caja."
    solucion: "Abajo a la izquierda: la impresión 1:1."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [251, 258, 265, 268]
    ideas:
      - { titulo: "Primero colocar.", texto: "La colocación decide longitudes, bucles y caminos compartidos." }
      - { titulo: "En orden.", texto: "Lo fijo, lo grande y caliente, los integrados, el resto." }
      - { titulo: "Por zonas.", texto: "Potencia, analógico, digital e interfaz; la señal en un sentido." }
      - { titulo: "Sin negociar.", texto: "Desacoplo pegado, cristal junto al micro, bucle mínimo." }
