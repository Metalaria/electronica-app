# Lección 1.2 de la sección 41.9 «Colocación y Particionado» (cap40, sec-40.9). Formato: contenido/lecciones11/GUIA.md.
# - La figura 41.13 (fig-40.13) con zonas: interfaz, analógico, A/D en la frontera, digital y potencia.
# - Sin fórmula ni números que calcular (sección de criterio). Paso práctico: «tocar» la zona de ruido y calor.
leccion: cap40/sec-40.9

libro:
  251: "una buena colocación hace el trazado fácil, y una mala lo hace imposible"
  252: "la colocación determina la longitud de las conexiones, el área de los bucles y qué corrientes comparten camino"
  254: "Lo que tiene posición fija: conectores, tornillos, indicadores"
  255: "Los componentes grandes y calientes"
  256: "Los integrados principales, orientados según el flujo de señal"
  257: "Lo demás, agrupado con el integrado al que pertenece"
  258: "va de lo más restringido a lo más libre"
  261: "Potencia: fuente, conmutación, disipación. Es la fuente de ruido y de calor."
  262: "Analógico sensible"
  263: "Digital rápido"
  264: "Interfaz externa"
  265: "Un convertidor A/D se coloca en la frontera entre lo analógico y lo digital"
  268: "Desacoplo: pegado al pin, con vías cortas"
  269: "Cristal: lo más cerca posible del microcontrolador"
  270: "El bucle de conmutación de una fuente"
  271: "la pista que sensa la salida debe medir donde importa la tensión"
  273: "Protecciones de entrada: junto al conector"
  275: "Componentes polarizados en la misma dirección siempre que se pueda"
  276: "alineados en filas y columnas"
  277: "debe poder desoldarse sin dañar los vecinos"
  278: "Acceso a los ajustes y a los puntos de prueba desde arriba"
  281: "un electrolítico alto bajo una carcasa baja"
  285: "La defensa es el modelo 3D"
  287: "imprimir la placa a tamaño real, recortarla y meterla en la caja"
  288: "si un electrolítico o un cristal está notablemente más caliente de lo que debería"
  289: "Particionado por zonas funcionales"

modelo: { valores: {}, calculos: {} }

tarjetas:
  - id: explore-zonas
    tipo: explorar
    titulo: "Particionar por función"
    texto: "Agrupar por función evita que los retornos se solapen. Toque las cuatro zonas."
    libro: [261, 262, 263, 264, 289]
    widget:
      tipo: figura
      figura: fig-40.13
      zonas:
        - { id: interfaz, rotulo: "Interfaz", rect: [14, 26, 88, 57], texto: "Interfaz externa: conectores, protecciones, aisladores." }
        - { id: analogico, rotulo: "Analógico", rect: [119, 26, 100, 57], texto: "Analógico sensible: sensores, amplificadores, referencias, convertidores." }
        - { id: digital, rotulo: "Digital", rect: [290, 26, 149, 57], texto: "Digital rápido: microcontrolador, memorias, buses." }
        - { id: potencia, rotulo: "Potencia", rect: [265, 100, 174, 36], texto: "Fuente, conmutación, disipación: la fuente de ruido y de calor." }
    requiere: { mover: [interfaz, analogico, digital, potencia] }

  - id: porque-colocacion
    tipo: porque
    titulo: "El trazado empieza por la colocación"
    texto: "¿Por qué una mala colocación no la arregla ningún trazado?"
    libro: [251, 252]
    widget:
      tipo: figura
      figura: fig-40.13
      zonas:
        - { id: placa, rotulo: "La placa", rect: [4, 2, 440, 135] }
    opciones:
      - texto: "Decide la longitud de las conexiones, el área de los bucles y qué corrientes comparten camino"
        bien: true
        porque: "Son los tres factores de los capítulos 41 y 42: el trazado ya no los cambia."
      - texto: "Porque las pistas no pueden doblarse"
        porque: "Pueden; lo que no pueden es acortar lo que la colocación alargó."
      - texto: "No es así: un buen trazado lo arregla todo"
        porque: "Un trazado excelente no arregla una colocación mala."
    escalera:
      - "Piense en qué fija la posición de cada pieza."
    solucion: "Longitudes, áreas de bucle y caminos compartidos."

  - id: ordene-colocacion
    tipo: pregunta
    titulo: "El orden en que se coloca"
    texto: "Ordene la colocación, de lo primero a lo último."
    libro: [254, 255, 256, 257, 258]
    widget:
      tipo: figura
      figura: fig-40.13
      zonas:
        - { id: placa, rotulo: "La placa", rect: [4, 2, 440, 135] }
    ordenar:
      - "Lo de posición fija: conectores, tornillos, indicadores."
      - "Lo grande y caliente: transformadores, disipadores."
      - "Los integrados principales, según el flujo de señal."
      - "Lo demás, con su integrado."
    exito: "De lo más restringido a lo más libre."
    pistas:
      - { texto: "Empiece por lo que no es negociable." }
    escalera:
      - "Lo que asoma por la caja no se puede mover."
    solucion: "Fijo, grande y caliente, integrados, el resto."

  - id: toque-potencia
    tipo: tocar
    titulo: "Ruido y calor"
    texto: "Toque la zona que es la fuente de ruido y de calor de la placa."
    libro: [261]
    widget:
      tipo: figura
      figura: fig-40.13
      zonas:
        - { id: interfaz, rotulo: "Recuadro naranja", rect: [14, 26, 88, 57] }
        - { id: analogico, rotulo: "Recuadro verde", rect: [119, 26, 100, 57] }
        - { id: digital, rotulo: "Recuadro azul", rect: [290, 26, 149, 57] }
        - { id: potencia, rotulo: "Recuadro rojo", rect: [265, 100, 174, 36] }
    tocar:
      bien: [potencia]
      porque:
        interfaz: "Conectores y protecciones reciben transitorios, pero no son la fuente."
        analogico: "Es lo sensible: la víctima, no la fuente."
        digital: "Conmuta, pero la fuente de ruido y de calor es la potencia."
    exito: "La potencia: fuente, conmutación y disipación."
    escalera:
      - "Donde se conmuta y se disipa más energía."
    solucion: "El recuadro rojo, la potencia."

  - id: pregunta-ad
    tipo: pregunta
    titulo: "El convertidor A/D"
    texto: "¿Dónde se coloca el convertidor A/D?"
    libro: [265]
    widget:
      tipo: figura
      figura: fig-40.13
      zonas:
        - { id: analogico, rotulo: "Recuadro verde", rect: [119, 26, 100, 57] }
        - { id: digital, rotulo: "Recuadro azul", rect: [290, 26, 149, 57] }
    opciones:
      - texto: "En la frontera, con su parte analógica mirando a lo analógico"
        bien: true
        porque: "La señal fluye de una zona a otra en un sentido, sin cruces."
      - texto: "Dentro de la zona digital, junto al microcontrolador"
        porque: "Sus entradas analógicas cruzarían la zona digital."
      - texto: "Junto a la fuente"
        porque: "La potencia es la fuente de ruido: lo más lejos posible de lo sensible."
    escalera:
      - "Tiene un pie en cada mundo."
    solucion: "En la frontera, con su parte analógica hacia esa zona."

  - id: empareje-casos
    tipo: pregunta
    titulo: "Lo que no admite negociación"
    texto: "Empareje cada componente con su regla de colocación."
    libro: [268, 269, 270, 271, 273]
    emparejar:
      - ["Desacoplo", "Pegado al pin, con vías cortas"]
      - ["Cristal", "Junto al micro, nada que conmute cerca"]
      - ["Bucle de conmutación", "Área mínima"]
      - ["Realimentación del regulador", "Sensar donde importa la tensión"]
      - ["Protecciones de entrada", "Junto al conector"]
    exito: "El desacoplo es la más incumplida y la de mayor efecto."
    pistas:
      - { texto: "Un transitorio no debe recorrer la placa." }
    escalera:
      - "La protección va donde entra el transitorio."
    solucion: "Desacoplo, pegado; cristal, junto al micro; bucle, mínimo; realimentación, donde importa; protecciones, en el conector."

  - id: empareje-montaje
    tipo: pregunta
    titulo: "La orientación y el montaje"
    texto: "Empareje cada costumbre de montaje con su regla."
    libro: [275, 276, 277, 278]
    emparejar:
      - ["Componentes polarizados", "En la misma dirección"]
      - ["Componentes de dos terminales", "En filas y columnas"]
      - ["Lo que puede sustituirse", "Desoldable sin dañar a los vecinos"]
      - ["Ajustes y puntos de prueba", "Accesibles desde arriba"]
    exito: "Reglas que facilitan montar, revisar y reparar."
    pistas:
      - { texto: "La polaridad se revisa mejor si todas miran igual." }
    escalera:
      - "Piense en quien monta y en quien repara."
    solucion: "Polarizados, misma dirección; dos terminales, filas; retrabajo, espacio; ajustes, desde arriba."

  - id: pregunta-trampas
    tipo: pregunta
    titulo: "Las trampas mecánicas"
    texto: "Un electrolítico alto queda bajo una carcasa baja. ¿Qué lo habría detectado a tiempo?"
    libro: [281, 285, 287]
    widget:
      tipo: figura
      figura: fig-40.13
      zonas:
        - { id: placa, rotulo: "La placa", rect: [4, 2, 440, 135] }
    opciones:
      - texto: "El modelo 3D, o la impresión a tamaño real metida en la caja"
        bien: true
        porque: "Cinco minutos que detectan colisiones, conectores mal situados y alturas imposibles."
      - texto: "El DRC"
        porque: "El DRC mira cobre y separaciones, no alturas dentro de la caja."
      - texto: "La revisión del esquema"
        porque: "El esquema no tiene alturas ni carcasa."
    escalera:
      - "Hace falta ver la placa dentro de la caja."
    solucion: "El modelo 3D o la impresión 1:1 en la caja."

  - id: pregunta-banco
    tipo: predecir
    titulo: "En el banco, ya montada"
    texto: "Con la placa funcionando, un cristal está notablemente más caliente de lo que debería. ¿Qué indica?"
    libro: [288]
    widget:
      tipo: figura
      figura: fig-40.13
      zonas:
        - { id: potencia, rotulo: "Recuadro rojo", rect: [265, 100, 174, 36] }
    opciones:
      - texto: "Que la colocación lo puso donde no debía"
        bien: true
        porque: "La comprobación de colocación con la placa montada es térmica."
      - texto: "Que el cristal está defectuoso"
        porque: "Un cristal apenas disipa: el calor le llega de un vecino."
      - texto: "Nada: los cristales siempre se calientan"
        porque: "No generan calor apreciable; si está caliente, lo recibe."
    escalera:
      - "¿De dónde le llega el calor?"
    solucion: "Que la colocación lo puso junto a algo caliente."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [251, 258, 265, 268]
    ideas:
      - { titulo: "Primero colocar.", texto: "La colocación decide longitudes, bucles y caminos compartidos." }
      - { titulo: "En orden.", texto: "Lo fijo, lo grande y caliente, los integrados, el resto." }
      - { titulo: "Por zonas.", texto: "Potencia, analógico, digital e interfaz; la señal en un sentido." }
      - { titulo: "Sin negociar.", texto: "Desacoplo pegado, cristal junto al micro, bucle mínimo." }
