# Lección 1.2 de la sección 41.4 «Vías» (cap40, sec-40.4). Formato: contenido/lecciones11/GUIA.md.
# - La fórmula del bloque 107, L ≈ 0,2·h·[ln(4h/d) + 1] nH con h y d en mm, en una gráfica viva frente al taladro:
#   1,6 mm y 0,3 mm dan 1,30 nH (1,21 nH con 0,4 mm y 1,43 nH con 0,2 mm), los del bloque 108.
# - 1,3 nH a 100 MHz son 0,82 Ω; con 2 ns y 20 mA, 13 mV; ocho salidas, 104 mV (bloque 109).
# - La figura 41.6 (fig-40.6) con zonas y la foto de la microsección 41.7 (fig-40.7).
# Paso práctico: «simular» la inductancia de la vía de 1,6 × 0,3 mm (errores: sin el «+ 1», el radio por el diámetro).
# 1.2.1 (autor121-pc, «aprender haciendo», GUIA §13): el taladro se cambia con una meta (1,2 nH con 0,4 mm), la
# soldadura se toca en la microsección, la reactancia, las dos vías del desacoplo y la subida sin vías térmicas se
# escriben, las ocho salidas y las vías del raíl se buscan con una meta (el raíl de 4 A y el ~1 A por vía son del
# modelo: el libro da «en torno a 1 A» por vía y «cuatro o seis» en un raíl), y la vía de masa se toca en la figura
# 41.6. Quedan la fórmula, el emparejamiento de los tipos y una pregunta de opciones (el stub).
leccion: cap40/sec-40.4

libro:
  103: "En la placa es un componente con tres propiedades que importan: inductancia, resistencia y capacidad"
  107: 'L approx 0","2 dot.op h dot.op lr([ ln((4 h)/d) + 1 ]) quad "nH"'
  108: "En una placa estándar de 1,6 mm con taladro de 0,3 mm da unos 1,3 nH (1,2 nH con 0,4 mm y 1,4 nH con 0,2 mm)"
  109: "a 100 MHz eso es 0,82 Ω. Con un flanco de 2 ns y 20 mA, desarrolla 13 mV; con ocho salidas conmutando a la vez, 104 mV"
  111: "dos vías de 1,3 nH suman 2,6 nH, más que la propia inductancia del condensador"
  112: "necesita una vía de masa cerca por donde hacerlo"
  113: "toda vía de señal rápida debe tener una vía de masa a menos de un par de milímetros"
  115: "Una vía de 0,3 mm de taladro con la metalización habitual admite en torno a 1 A"
  116: "Con cuatro o seis, el problema desaparece"
  118: "una matriz de vías conduce el calor a las capas internas y a la cara opuesta"
  119: "una almohadilla sin vías puede tener una resistencia térmica de unos 40 °C/W; con nueve o dieciséis vías, baja a unos 15 °C/W. Con 2 W, eso son 80 °C de diferencia frente a 30"
  120: "las vías bajo la almohadilla absorben pasta de soldadura por capilaridad"
  122: "Microvía"
  123: "En diseño doméstico o de bajo volumen, la respuesta casi siempre es rediseñar para no necesitarlas"
  126: "ese stub resuena y produce una atenuación acusada a una frecuencia concreta"
  127: "la solución es el back-drilling"
  132: "el gris que rellena el agujero y forma los meniscos es la soldadura"

modelo:
  valores:
    h_v: { sim: "h", nombre: "espesor de la placa", unidad: mm, valor: 1.6 }
    d_v: { sim: "d", nombre: "diámetro del taladro", unidad: mm, valor: 0.3 }
    f_v: { sim: "f", nombre: "frecuencia", unidad: Hz, valor: 100000000 }
    i_v: { sim: "Δi", nombre: "corriente conmutada por salida", unidad: A, valor: 0.02 }
    t_v: { sim: "Δt", nombre: "duración del flanco", unidad: s, valor: 2e-9 }
    n_v: { sim: "N", nombre: "salidas a la vez", unidad: "", valor: 8 }
    I_r: { sim: "I", nombre: "corriente del raíl (ejemplo)", unidad: A, valor: 4 }
    n_vias: { sim: "n", nombre: "vías en paralelo", unidad: "", valor: 1 }
    P_t: { sim: "P", nombre: "potencia del componente", unidad: W, valor: 2 }
    Rth0: { sim: "R_{θ}", nombre: "resistencia térmica sin vías", unidad: "°C/W", valor: 40 }
    Rth9: { sim: "R_{θ}", nombre: "resistencia térmica con nueve vías", unidad: "°C/W", valor: 15 }
  calculos:
    L_v: { expr: "0.2*h_v*(ln(4*h_v/d_v) + 1)", sim: "L", nombre: "inductancia de la vía", unidad: nH }
    q_v: { expr: "4*h_v/d_v", sim: "4h/d", nombre: "cociente del logaritmo", unidad: "" }
    h4_v: { expr: "4*h_v", sim: "4h", nombre: "cuatro veces el espesor", unidad: mm }
    L_sin1: { expr: "0.2*h_v*ln(4*h_v/d_v)", sim: "L", nombre: "sin el «+ 1»", unidad: nH }
    L_radio: { expr: "0.2*h_v*(ln(8*h_v/d_v) + 1)", sim: "L", nombre: "con el radio en lugar del diámetro", unidad: nH }
    X_v: { expr: "2*pi*f_v*L_v*1e-9", sim: "X_{L}", nombre: "reactancia de la vía", unidad: Ω }
    v_1: { expr: "L_v*1e-9*i_v/t_v", sim: "v", nombre: "tensión con una salida", unidad: V }
    v_n: { expr: "n_v*v_1", sim: "v", nombre: "tensión con N salidas", unidad: V }
    X_sin2pi: { expr: "f_v*L_v*1e-9", sim: "f·L", nombre: "sin el 2π", unidad: Ω }
    L_2v: { expr: "2*L_v", sim: "L", nombre: "las dos vías del desacoplo", unidad: nH }
    I_via: { expr: "I_r/n_vias", sim: "I_{vía}", nombre: "corriente por vía", unidad: A }
    dT0: { expr: "Rth0*P_t", sim: "ΔT", nombre: "subida sin vías", unidad: "°C" }
    dT9: { expr: "Rth9*P_t", sim: "ΔT", nombre: "subida con nueve vías", unidad: "°C" }

tarjetas:
  - id: explore-via
    tipo: explorar
    fase: "Consiga"
    titulo: "Una vía es un componente"
    texto: "En el esquema no existe; en la placa tiene inductancia. En una placa de 1,6 mm, cambie el taladro hasta bajar a unos 1,2 nH."
    libro: [103, 107, 108]
    fijar: { h_v: 1.6 }
    inicio: { d_v: 0.2 }
    widget:
      tipo: grafica
      x: { id: dd, min: 0.1, max: 0.6, unidad: mm, rotulo: "d" }
      y: { min: 0, max: 3, unidad: nH, rotulo: "L" }
      curvas:
        - { expr: "0.2*h_v*(ln(4*h_v/dd) + 1)", color: naranja, rotulo: "L(d)" }
      marcas:
        - { x: "d_v", y: "L_v", rotulo: "{{L_v}}" }
      lectura: { valor: L_v, rotulo: "Inductancia de la vía" }
      mandos:
        - { valor: d_v, lista: [0.2, 0.3, 0.4], rotulo: "Taladro, d" }
    objetivo:
      condiciones:
        - { valor: L_v, max: 1.25, rotulo: "Inductancia: {{L_v}}" }
      logrado: "Con {{d_v}}, {{L_v}}: el taladro va dentro de un logaritmo y apenas cuenta. Manda la longitud: unos 0,8 nH por milímetro."
      pistas:
        - { texto: "Todavía pasa de 1,2 nH: un taladro más grueso." }
    escalera:
      - "Más diámetro, menos inductancia, pero poca."
    solucion: "El taladro de 0,4 mm: 1,2 nH."
    comprobar:
      - { con: { h_v: 1.6, d_v: 0.4 }, L_v: 1.2, tol: 0.01 }

  - id: explore-foto
    tipo: tocar
    titulo: "Un taladro metalizado por dentro"
    texto: "Microsección de una placa a 50 aumentos. Toque la soldadura que rellena el agujero y forma los meniscos."
    libro: [132]
    widget:
      tipo: figura
      figura: fig-40.7
      zonas:
        - { id: patilla, rotulo: "Franja clara vertical", rect: [340, 0, 130, 860] }
        - { id: soldadura, rotulo: "Menisco gris de abajo", rect: [742, 650, 108, 210] }
        - { id: placa, rotulo: "Bloque oscuro del centro", rect: [515, 385, 285, 315] }
    tocar:
      bien: [soldadura]
      porque:
        patilla: "Es una patilla, que atraviesa su taladro metalizado."
        placa: "Es el sustrato: las finas líneas claras de sus bordes son el cobre, que sigue por la pared del taladro."
    exito: "El gris que rellena el agujero y forma los meniscos es la soldadura."
    escalera:
      - "Busque la forma curva, gris, donde la patilla sale del agujero."
    solucion: "El menisco gris de abajo."

  - id: formula-inductancia
    tipo: formula
    titulo: "La inductancia de la vía"
    texto: "Un cilindro de longitud h, el espesor de la placa, y diámetro d, el del taladro, en milímetros."
    libro: [107, 108]
    ec: 107
    sustitucion: "0,2 · {{h_v}} · [ln(4 · {{h_v}} / {{d_v}}) + 1] = {{L_v}}"
    widget:
      tipo: grafica
      x: { id: dd, min: 0.1, max: 0.6, unidad: mm, rotulo: "d" }
      y: { min: 0, max: 3, unidad: nH, rotulo: "L" }
      curvas:
        - { expr: "0.2*h_v*(ln(4*h_v/dd) + 1)", color: naranja, rotulo: "L(d)" }
      marcas:
        - { x: "d_v", y: "L_v", rotulo: "{{L_v}}" }
      lectura: { valor: L_v, rotulo: "Inductancia de la vía" }
      mandos:
        - { valor: d_v, lista: [0.2, 0.3, 0.4], rotulo: "Taladro, d" }
        - { valor: h_v, min: 0.8, max: 3.2, paso: 0.1, rotulo: "Espesor, h" }
    comprobar:
      - { con: { h_v: 1.6, d_v: 0.4 }, L_v: 1.2, tol: 0.01 }
      - { con: { h_v: 1.6, d_v: 0.2 }, L_v: 1.4, tol: 0.03 }

  - id: simule-via
    tipo: simular
    titulo: "Prediga la inductancia"
    texto: "Una vía pasante en una placa estándar de 1,6 mm con taladro de 0,3 mm. ¿Cuántos nanohenrios tiene?"
    libro: [107, 108]
    fijar: { h_v: 1.6, d_v: 0.3 }
    widget:
      tipo: grafica
      x: { id: dd, min: 0.1, max: 0.6, unidad: mm, rotulo: "d" }
      y: { min: 0, max: 3, unidad: nH, rotulo: "L" }
      curvas:
        - { expr: "0.2*h_v*(ln(4*h_v/dd) + 1)", color: naranja, rotulo: "L(d)" }
      lectura: { valor: L_v, rotulo: "Inductancia de la vía" }
      ocultar: true
    simular:
      objetivo: L_v
      unidad: nH
      tol: 0.05
      rotulo: "Inductancia de la vía, L"
      errores:
        - { expr: "L_sin1", texto: "Ha olvidado el «+ 1» del corchete: ln(4h/d) + 1." }
        - { expr: "L_radio", texto: "Ha usado el radio: d es el diámetro del taladro, 0,3 mm." }
    exito: "Unos 1,3 nH: del orden de 0,8 nH por milímetro de placa."
    escalera:
      - "4h/d = 6,4/0,3; tome su logaritmo neperiano y súmele 1."
    solucion: "0,2 × 1,6 × [ln(21,3) + 1] = 1,30 nH."
    comprobar:
      - { L_v: 1.3, L_sin1: 0.98, L_radio: 1.52, q_v: 21.3, h4_v: 6.4, tol: 0.01 }

  - id: estime-reactancia
    tipo: leer
    titulo: "Parece nada"
    texto: "Esos 1,3 nH a 100 MHz: lea la curva o calcúlelo, y escriba cuántos ohmios son."
    libro: [109]
    fijar: { h_v: 1.6, d_v: 0.3, f_v: 100000000 }
    widget:
      tipo: grafica
      x: { id: nu, min: 1000000, max: 1000000000, unidad: Hz, rotulo: "f", escala: log }
      y: { min: 0.001, max: 10, unidad: Ω, rotulo: "X", escala: log }
      curvas:
        - { expr: "2*pi*nu*L_v*1e-9", color: naranja, rotulo: "X = 2πfL" }
      mandos: []
    leer:
      objetivo: X_v
      unidad: Ω
      tol: 0.05
      rotulo: "Impedancia de la vía a 100 MHz"
      errores:
        - { expr: "X_sin2pi", texto: "Ha olvidado el 2π: X = 2π·f·L." }
    exito: "0,82 Ω: una vía sola ya pesa en el desacoplo."
    escalera:
      - "X = 2π·f·L."
    solucion: "2π × 100 MHz × 1,3 nH = 0,82 Ω."
    comprobar:
      - { X_v: 0.82, tol: 0.01 }

  - id: predecir-ocho
    tipo: explorar
    fase: "Consiga"
    titulo: "Ocho salidas por la misma vía"
    texto: "Flancos de 2 ns y 20 mA por salida: una da 13 mV sobre la vía. Sume salidas hasta que la vía desarrolle 104 mV."
    libro: [109]
    fijar: { h_v: 1.6, d_v: 0.3, i_v: 0.02, t_v: 2e-9 }
    inicio: { n_v: 1 }
    widget:
      tipo: grafica
      x: { id: nn, min: 1, max: 16, unidad: "", rotulo: "salidas" }
      y: { min: 0, max: 0.25, unidad: V, rotulo: "v" }
      curvas:
        - { expr: "nn*L_v*1e-9*i_v/t_v", color: naranja, rotulo: "v = N·L·Δi/Δt" }
      marcas:
        - { x: "n_v", y: "v_n", rotulo: "{{v_n}}" }
      lectura: { valor: v_n, rotulo: "Tensión sobre la vía" }
      mandos:
        - { valor: n_v, min: 1, max: 16, paso: 1, rotulo: "Salidas a la vez, N" }
    objetivo:
      condiciones:
        - { valor: v_n, objetivo: 0.104, tol: 0.02, rotulo: "Sobre la vía: {{v_n}}" }
      logrado: "{{n_v}} salidas: {{v_n}}. Comparten la vía: sus corrientes no se reparten, se suman."
      pistas:
        - { cuando: { valor: v_n, mayor: 0.106 }, texto: "Se ha pasado: menos salidas." }
        - { texto: "Faltan salidas: cada una suma 13 mV." }
    escalera:
      - "104 mV entre 13 mV por salida."
    solucion: "Ocho salidas: 8 × 13 mV = 104 mV."
    comprobar:
      - { con: { n_v: 8 }, v_1: 0.013, v_n: 0.104, tol: 0.01 }

  - id: porque-desacoplo
    tipo: leer
    titulo: "Las vías del desacoplo"
    texto: "Un condensador de desacoplo se une al plano con dos vías como esta, en serie con él. Escriba la inductancia que suman."
    libro: [108, 111]
    fijar: { h_v: 1.6, d_v: 0.3 }
    widget:
      tipo: grafica
      x: { id: dd, min: 0.1, max: 0.6, unidad: mm, rotulo: "d" }
      y: { min: 0, max: 3, unidad: nH, rotulo: "L" }
      curvas:
        - { expr: "0.2*h_v*(ln(4*h_v/dd) + 1)", color: naranja, rotulo: "una vía" }
      marcas:
        - { x: "d_v", y: "L_v", rotulo: "{{L_v}}" }
      mandos: []
    leer:
      objetivo: L_2v
      unidad: nH
      tol: 0.03
      rotulo: "Inductancia de las dos vías"
      errores:
        - { expr: "L_v", texto: "Esa es una sola vía. Las dos están en el bucle, en serie: se suman." }
    exito: "2,6 nH, más que la propia inductancia del condensador: vías cortas y, si se puede, varias en paralelo."
    escalera:
      - "Inductancias en serie se suman."
    solucion: "1,3 + 1,3 = 2,6 nH."
    comprobar:
      - { L_2v: 2.6, tol: 0.01 }

  - id: pregunta-retorno
    tipo: tocar
    titulo: "Cuando una señal cambia de capa"
    texto: "Una señal rápida pasa de una capa a otra por una vía. Toque lo que necesita al lado."
    libro: [112, 113, 120]
    widget:
      tipo: figura
      figura: fig-40.6
      zonas:
        - { id: inductancia, rotulo: "Recuadro de arriba", rect: [249, 29, 198, 42] }
        - { id: retorno, rotulo: "Segundo recuadro", rect: [249, 77, 198, 40] }
        - { id: corriente, rotulo: "Tercer recuadro", rect: [249, 125, 198, 40] }
        - { id: pasta, rotulo: "Recuadro de abajo", rect: [249, 172, 198, 40] }
    tocar:
      bien: [retorno]
      porque:
        inductancia: "La inductancia de la vía está ahí siempre; lo que falta es el camino de vuelta de la corriente."
        corriente: "Eso es para llevar corriente de alimentación; una señal necesita su retorno."
        pasta: "Es un detalle de las vías térmicas: bajo la almohadilla absorben pasta de soldadura por capilaridad."
    exito: "Su retorno también cambia de capa: una vía de masa a menos de un par de milímetros. Sin ella, rodea y el bucle crece."
    escalera:
      - "Piense en la corriente de vuelta, en el plano."
    solucion: "El segundo recuadro: una vía de masa al lado."

  - id: pregunta-corriente
    tipo: explorar
    fase: "Consiga"
    titulo: "Un raíl que cambia de capa"
    texto: "Un raíl de 4 A cambia de capa. Cada vía de 0,3 mm admite en torno a 1 A: ponga vías hasta que ninguna pase de ahí."
    libro: [115, 116]
    fijar: { I_r: 4 }
    inicio: { n_vias: 1 }
    widget:
      tipo: grafica
      x: { id: nv, min: 1, max: 8, unidad: "", rotulo: "vías" }
      y: { min: 0, max: 4.5, unidad: A, rotulo: "I por vía" }
      curvas:
        - { expr: "I_r/nv", color: naranja, rotulo: "corriente por vía" }
      marcas:
        - { x: "n_vias", y: "I_via", rotulo: "{{I_via}}" }
      lectura: { valor: I_via, rotulo: "Corriente por vía" }
      mandos:
        - { valor: n_vias, min: 1, max: 8, paso: 1, rotulo: "Vías en paralelo" }
    objetivo:
      condiciones:
        - { valor: I_via, max: 1, rotulo: "Por vía: {{I_via}}" }
      logrado: "{{n_vias}} vías, {{I_via}} cada una. Una sola introduce resistencia y un punto caliente; con cuatro o seis, el problema desaparece."
      pistas:
        - { texto: "Cada vía lleva demasiado: añada vías en paralelo, no una más grande." }
    escalera:
      - "Reparta los 4 A entre vías de 1 A."
    solucion: "Cuatro vías o más."
    comprobar:
      - { con: { n_vias: 4 }, I_via: 1 }

  - id: pregunta-termicas
    tipo: leer
    titulo: "Las vías térmicas"
    texto: "Un componente disipa 2 W sobre su almohadilla térmica, sin vías debajo. Escriba cuánto se calienta."
    libro: [118, 119]
    fijar: { P_t: 2 }
    widget:
      tipo: grafica
      x: { id: pp, min: 0, max: 3, unidad: W, rotulo: "P" }
      y: { min: 0, max: 130, unidad: "°C", rotulo: "subida" }
      curvas:
        - { expr: "Rth0*pp", color: naranja, rotulo: "sin vías, 40 °C/W" }
        - { expr: "Rth9*pp", color: azul, rotulo: "nueve vías, 15 °C/W" }
      mandos: []
    leer:
      objetivo: dT0
      unidad: "°C"
      tol: 0.03
      rotulo: "Subida sin vías"
      errores:
        - { expr: "Rth0", texto: "40 son los °C/W, la resistencia térmica: multiplique por los 2 W." }
        - { expr: "dT9", texto: "Esa es la subida con nueve vías; aquí no hay ninguna." }
    exito: "80 °C sin vías, frente a 30 con nueve: la diferencia entre un componente que dura y uno que no."
    escalera:
      - "Subida = resistencia térmica × potencia."
    solucion: "40 °C/W × 2 W = 80 °C."
    comprobar:
      - { dT0: 80, dT9: 30 }

  - id: empareje-tipos
    tipo: pregunta
    titulo: "Los tipos y su coste"
    texto: "Empareje cada tipo de vía con lo que conecta."
    libro: [122, 123]
    emparejar:
      - ["Pasante", "De la cara superior a la inferior"]
      - ["Ciega", "Una cara con una capa interna"]
      - ["Enterrada", "Dos capas internas"]
      - ["Microvía", "Capas adyacentes, por láser"]
    exito: "Las tres últimas multiplican el coste: en bajo volumen, mejor rediseñar para no necesitarlas."
    pistas:
      - { texto: "La enterrada no asoma a ninguna cara." }
    escalera:
      - "La ciega asoma por una sola cara."
    solucion: "Pasante, cara a cara; ciega, cara e interna; enterrada, dos internas; microvía, adyacentes por láser."

  - id: pregunta-stub
    tipo: pregunta
    titulo: "El stub"
    texto: "Una vía pasante une la capa 1 con la 2 en un enlace de gigabits. ¿Qué hace el resto de la vía?"
    libro: [126, 127]
    widget:
      tipo: figura
      figura: fig-40.6
      zonas:
        - { id: inductancia, rotulo: "Recuadro rojo", rect: [249, 29, 198, 57] }
    opciones:
      - texto: "Es un stub que resuena y atenúa a una frecuencia concreta"
        bien: true
        porque: "Donde la velocidad lo exige se quita con back-drilling, que es caro."
      - texto: "Nada: no lleva corriente"
        porque: "No conduce, pero es un trozo de línea abierta, y a frecuencias altas resuena."
      - texto: "Ayuda al retorno"
        porque: "El retorno necesita una vía de masa; el stub es parte de la vía de señal."
    escalera:
      - "Un trozo de línea abierta tiene una resonancia."
    solucion: "Un stub que resuena; se elimina con back-drilling."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [108, 113, 115, 119]
    ideas:
      - { titulo: "Inductancia.", texto: "Unos 1,3 nH una vía pasante de 1,6 mm: 0,82 Ω a 100 MHz." }
      - { titulo: "Retorno.", texto: "Toda vía de señal rápida, con una vía de masa al lado." }
      - { titulo: "Corriente.", texto: "En torno a 1 A por vía: varias en paralelo." }
      - { titulo: "Calor.", texto: "Con vías térmicas, de 40 a 15 °C/W bajo la almohadilla." }
