# Lección 1.2 de la sección 29.6 «Procesamiento Digital de Señal (DSP)» (cap30, sec-30.6). Formato: GUIA.md.
# - El coste de la tabla del bloque 181: N² frente a N·log₂N (log₂ como ln/ln 2), con su factor.
# - Δf = f_s/N (bloque 185): 46,9 Hz con 48 kHz y 1 024 puntos; el tiempo de observación es N/f_s = 1/Δf (21 ms;
#   200 ms para 5 Hz, bloque 186). Ganancia de proceso 10·log₁₀(N/2), unos 27 dB con N = 1 024 (bloque 189).
# - La fuga (bloque 191): la captura repetida, sen(2π·c·frac(t)) con frac(t) = t − floor(t), con c ciclos en la
#   ventana, sin ventana o con Hann (0,5 − 0,5·cos 2π·frac(t)). Los ciclos son de ejemplo.
# Paso práctico: «simular» el tiempo de observación para 5 Hz de resolución (200 ms; error típico: los 21 ms de
# 1 024 puntos).
# 1.2.1 (autor121-senpro, «aprender haciendo», GUIA §13): N se sube hasta pasar del millón de operaciones directas;
# el factor de 4 096 y la ganancia de proceso se calculan (simular sobre el modelo); N se sube hasta bajar de 5 Hz de
# resolución; la unión de la captura se arregla con la Hann sin tocar los ciclos; la ventana se elige por sus lóbulos
# (los de la tabla del libro; el dibujo de cada pico es esquemático: anchura 1, 2, 3 y 5 casillas, de ejemplo) para ver
# un tono 50 dB por debajo; Goertzel se explora con M hasta el último tono que gana con N = 205; y FIR o IIR se elige
# sobre un pulso (media móvil de 0,3 s frente a un polo de τ = 0,15 s, de ejemplo). Quedan dos preguntas de opciones:
# la Hann entre casillas y lo que el digital no puede.
leccion: cap30/sec-30.6

libro:
  179: "Con N = 1 024 son más de un millón"
  180: "explota la simetría del problema"
  181: "16 777 216"
  182: "da exactamente el mismo resultado que la definición directa, solo que más deprisa"
  185: '"Δ" f = (f_("s"))/(N)'
  186: "N puntos a 48 kHz son 21 ms; para 5 Hz de resolución harían falta 200 ms"
  187: "No se puede saber con precisión qué frecuencia tiene algo que dura poco"
  188: "repartido en N/2 puntos útiles"
  189: "Con N = 1 024 son unos 27 dB"
  191: "en el punto de unión aparece una discontinuidad que no existe en la señal real"
  192: "una ventana que se anule suavemente en los extremos"
  193: "Medir amplitudes con exactitud"
  194: "menos fuga a costa de peor resolución"
  195: "se muestra hasta 1,4 dB por debajo de su amplitud real"
  197: "Cuando solo interesan unas pocas"
  201: "Goertzel gana mientras M sea menor que log₂N"
  204: "siempre estable (no hay realimentación) y puede tener fase exactamente lineal"
  205: "típicamente diez veces menos"
  206: "FIR cuando la forma de onda importa"
  209: "Fase perfectamente lineal, imposible en un filtro analógico causal"
  210: "lo que no puede: actuar antes del convertidor"
  212: "cambiando la base de tiempos cambia la resolución según Δf = fs/N"

modelo:
  valores:
    N_f: { sim: "N", nombre: "número de puntos", unidad: "", valor: 256 }
    f_s: { sim: "f_{s}", nombre: "frecuencia de muestreo", unidad: Hz, valor: 48000 }
    d_r: { sim: "Δf", nombre: "resolución deseada", unidad: Hz, valor: 5 }
    c_y: { sim: "c", nombre: "ciclos en la ventana", unidad: "", valor: 3 }
    v_h: { sim: "Hann", nombre: "ventana Hann", unidad: "", valor: 0 }
    k_w: { sim: "ventana", nombre: "ventana elegida", unidad: "", valor: 0 }
    M_g: { sim: "M", nombre: "frecuencias que interesan", unidad: "", valor: 1 }
    N_g: { sim: "N", nombre: "puntos del detector DTMF", unidad: "", valor: 205 }
    k_f: { sim: "filtro", nombre: "filtro elegido", unidad: "", valor: 1 }
    W_f: { sim: "W", nombre: "media móvil de ejemplo", unidad: s, valor: 0.3 }
    t_f: { sim: "τ", nombre: "constante del IIR de ejemplo", unidad: s, valor: 0.15 }
    L_p: { sim: "L", nombre: "nivel del tono pequeño", unidad: dB, valor: -50 }
  calculos:
    d_n: { expr: "N_f^2", sim: "N²", nombre: "operaciones directas", unidad: "" }
    f_n: { expr: "N_f*log2(N_f)", sim: "N·log₂N", nombre: "operaciones de la FFT", unidad: "" }
    l_2: { expr: "log2(N_f)", sim: "log₂N", nombre: "logaritmo en base dos de N", unidad: "" }
    m_2: { expr: "N_f/2", sim: "N/2", nombre: "casillas útiles", unidad: "" }
    fac: { expr: "N_f/log2(N_f)", sim: "factor", nombre: "factor de ahorro", unidad: "" }
    df: { expr: "f_s/N_f", sim: "Δf", nombre: "resolución en frecuencia", unidad: Hz }
    T_n: { expr: "N_f/f_s", sim: "T", nombre: "tiempo de observación", unidad: s }
    T_r: { expr: "1/d_r", sim: "T", nombre: "tiempo para la resolución deseada", unidad: s }
    T_m: { expr: "1/(2*d_r)", sim: "T", nombre: "la mitad del tiempo necesario", unidad: s }
    G_p: { expr: "10*log10(N_f/2)", sim: "G", nombre: "ganancia de proceso", unidad: dB, cifras: 2 }
    s_j: { expr: "abs(sin(2*pi*c_y))*(1 - v_h)", sim: "salto", nombre: "salto en la unión", unidad: "", cifras: 2 }
    lob: { expr: "-13*max(0, 1 - abs(k_w)) - 31*max(0, 1 - abs(k_w - 1)) - 58*max(0, 1 - abs(k_w - 2)) - 90*max(0, 1 - abs(k_w - 3))", sim: "lóbulos", nombre: "lóbulos laterales", unidad: dB }
    w_k: { expr: "1 + k_w + max(0, 1 - abs(k_w - 3))", sim: "anchura", nombre: "anchura esquemática del pico, en casillas", unidad: "" }
    l_g: { expr: "log2(N_g)", sim: "log₂N", nombre: "logaritmo en base dos de N", unidad: "", cifras: 2 }
    c_g: { expr: "M_g*N_g", sim: "M·N", nombre: "coste de Goertzel", unidad: "" }
    c_f: { expr: "N_g*log2(N_g)", sim: "N·log₂N", nombre: "coste de la FFT", unidad: "" }
    g_ok: { expr: "max(0, min(1, (l_g - M_g)*10))*max(0, min(1, (M_g - l_g + 1)*10))", sim: "último", nombre: "el último M con el que Goertzel gana", unidad: "" }
    fir: { expr: "1 - k_f", sim: "FIR", nombre: "el filtro elegido es el FIR", unidad: "" }

tarjetas:
  - id: explore-coste
    tipo: explorar
    titulo: "N² frente a N·log₂N"
    texto: "Las operaciones del cálculo directo y de la FFT, en escala logarítmica. Suba N hasta que el cálculo directo pase del millón."
    libro: [179, 180, 181]
    inicio: { N_f: 256 }
    widget:
      tipo: grafica
      x: { id: n, min: 100, max: 100000, unidad: "", rotulo: "N", escala: log }
      y: { min: 100, max: 10000000000, unidad: "", rotulo: "operaciones", escala: log }
      curvas:
        - { expr: "n^2", color: azul, rotulo: "directa, N²" }
        - { expr: "n*log2(n)", color: naranja, rotulo: "FFT, N·log₂N" }
      marcas:
        - { x: "N_f", y: "d_n", rotulo: "directa" }
        - { x: "N_f", y: "f_n", rotulo: "FFT" }
      lectura: { valor: fac, rotulo: "Factor de ahorro" }
      mandos:
        - { valor: N_f, lista: [256, 1024, 4096, 65536], rotulo: "Puntos, N" }
    objetivo:
      condiciones:
        - { valor: d_n, min: 1000000, rotulo: "Directa: {{d_n}} operaciones" }
      logrado: "Con N = {{N_f}}, más de un millón de operaciones directas; la FFT, {{f_n}}. Explota la simetría del problema."
      pistas:
        - { texto: "Aún no llega al millón: suba N." }
    escalera:
      - "La directa cuesta N²: mil por mil es un millón."
    solucion: "N = 1 024."
    comprobar:
      - { fac: 32 }
      - { con: { N_f: 1024 }, d_n: 1048576 }
      - { con: { N_f: 65536 }, fac: 4096 }

  - id: estime-factor
    tipo: simular
    titulo: "Cuánto ahorra"
    texto: "Con N = 4 096, el cálculo directo cuesta casi diecisiete millones de operaciones. Calcule cuántas veces menos cuesta la FFT."
    libro: [179, 181, 182]
    fijar: { N_f: 4096 }
    widget:
      tipo: figura
      figura: fig-30.12
      zonas:
        - { id: todo, rotulo: "Coste de la FFT y tres ventanas", rect: [0, 0, 448, 206] }
    simular:
      objetivo: fac
      unidad: ""
      tol: 0.05
      rotulo: "Factor de ahorro"
      errores:
        - { expr: "N_f/log10(N_f)", texto: "Ha usado el logaritmo decimal: el de la FFT es en base dos, log₂ 4 096 = 12." }
        - { expr: "N_f", texto: "Eso es N²/N: falta el log₂N que cuesta la FFT." }
    exito: "341 veces: 49 152 operaciones en lugar de 16 777 216. Y da exactamente el mismo resultado."
    escalera:
      - "Divida N² entre N·log₂N."
    solucion: "4 096/12 ≈ 341."
    comprobar:
      - { fac: 341, d_n: 16777216, f_n: 49152, l_2: 12, tol: 0.002 }

  - id: formula-resolucion
    tipo: explorar
    titulo: "La resolución en frecuencia"
    texto: "Cada casilla de la FFT mide Δf = f_{s}/N. A 48 kHz, suba N hasta que la resolución baje de 5 Hz."
    libro: [185, 186, 188, 212]
    inicio: { N_f: 256 }
    widget:
      tipo: grafica
      x: { id: n, min: 100, max: 100000, unidad: "", rotulo: "N", escala: log }
      y: { min: 0.1, max: 1000, unidad: Hz, rotulo: "Δf", escala: log }
      curvas:
        - { expr: "f_s/n", color: naranja, rotulo: "Δf = f_{s}/N" }
      marcas:
        - { x: "N_f", y: "df", rotulo: "{{df}}" }
      lectura: { valor: df, rotulo: "Resolución" }
      datos:
        - { valor: T_n, rotulo: "Tiempo de observación: {{T_n}}" }
      mandos:
        - { valor: N_f, lista: [256, 1024, 4096, 65536], rotulo: "Puntos, N" }
    objetivo:
      condiciones:
        - { valor: df, max: 5, rotulo: "Resolución: {{df}}" }
      logrado: "{{df}}, pero a costa de {{T_n}} de señal: más resolución exige más tiempo de observación."
      pistas:
        - { texto: "Las casillas aún son anchas: más puntos." }
    escalera:
      - "Δf baja al subir N, y el tiempo observado es N/f_{s}."
    solucion: "N = 65 536."
    comprobar:
      - { con: { N_f: 1024 }, df: 46.9, T_n: 0.021, tol: 0.02 }
      - { con: { N_f: 65536 }, df: 0.732, tol: 0.01 }

  - id: simule-observacion
    tipo: simular
    titulo: "Dos tonos a 5 Hz"
    texto: "Quiere 5 Hz de resolución. ¿Cuánto tiempo de señal tiene que observar la FFT, sea cual sea el muestreo?"
    libro: [186, 187]
    fijar: { d_r: 5, N_f: 1024, f_s: 48000 }
    simular:
      objetivo: T_r
      unidad: s
      tol: 0.03
      rotulo: "Tiempo de observación, T"
      errores:
        - { expr: "T_n", texto: "Esos son los 1 024 puntos a 48 kHz: 21 ms dan 46,9 Hz, no 5 Hz." }
        - { expr: "T_m", texto: "Le falta la mitad: Δf = f_{s}/N = 1/T, sin ningún 2." }
    exito: "200 ms: no se puede saber con precisión qué frecuencia tiene algo que dura poco."
    escalera:
      - "N/f_{s} es el tiempo observado, y Δf = f_{s}/N."
    solucion: "T = 1/Δf = 1/5 Hz = 200 ms."
    comprobar:
      - { T_r: 0.2, T_n: 0.021, T_m: 0.1, df: 46.9, tol: 0.02 }

  - id: porque-ganancia
    tipo: simular
    titulo: "Por debajo del suelo de ruido"
    texto: "La FFT reparte el ruido entre N/2 casillas útiles y concentra el tono en una. Calcule esa ganancia de proceso, 10·log₁₀(N/2), con N = 1 024."
    libro: [188, 189]
    fijar: { N_f: 1024 }
    widget:
      tipo: figura
      figura: fig-30.12
      zonas:
        - { id: todo, rotulo: "Coste de la FFT y tres ventanas", rect: [0, 0, 448, 206] }
    simular:
      objetivo: G_p
      unidad: dB
      tol: 0.02
      rotulo: "Ganancia de proceso"
      errores:
        - { expr: "10*log10(N_f)", texto: "Ha usado las N casillas: las útiles son N/2." }
        - { expr: "20*log10(N_f/2)", texto: "Es un reparto de potencia: diez veces el logaritmo, no veinte." }
    exito: "Unos 27 dB: cada casilla lleva una fracción del ruido y el tono emerge entero sobre él."
    escalera:
      - "Con N = 1 024 hay 512 casillas útiles."
    solucion: "10·log₁₀(512) ≈ 27 dB."
    comprobar:
      - { G_p: 27.1, m_2: 512, tol: 0.01 }

  - id: explore-fuga
    tipo: explorar
    titulo: "La discontinuidad que no existe"
    texto: "La FFT repite el trozo capturado: con ciclos no enteros, la unión salta. Sin volver a un número entero de ciclos, quite el salto."
    nota: "Ciclos de ejemplo."
    libro: [191, 192]
    inicio: { c_y: 3.25, v_h: 0 }
    widget:
      tipo: grafica
      x: { id: t, min: 0, max: 2, unidad: "", rotulo: "ventanas", muestras: 1200 }
      y: { min: -1.2, max: 1.2, unidad: "", rotulo: "x" }
      curvas:
        - { expr: "sin(2*pi*c_y*(t - floor(t)))*(1 - v_h*(0.5 + 0.5*cos(2*pi*(t - floor(t)))))", color: naranja, rotulo: "captura repetida" }
        - { expr: "0", color: tinta, rotulo: "cero", discontinua: true }
      lectura: { valor: c_y, rotulo: "Ciclos en la ventana" }
      mandos:
        - { valor: c_y, lista: [3, 3.25, 3.5], rotulo: "Ciclos, c" }
        - { valor: v_h, lista: [0, 1], nombres: [rectangular, Hann], rotulo: "Ventana" }
    objetivo:
      condiciones:
        - { valor: c_y, min: 3.2, rotulo: "Ciclos no enteros" }
        - { valor: s_j, max: 0.01, rotulo: "Salto: {{s_j}}" }
      logrado: "La Hann se anula suavemente en los extremos: la discontinuidad que no existía en la señal desaparece, y con ella casi toda la fuga."
      pistas:
        - { cuando: { valor: c_y, max: 3.1 }, texto: "Con ciclos enteros ya empalma, pero una señal real no se ajusta a la ventana: vuelva a un número no entero." }
        - { texto: "La rectangular corta en seco: pruebe otra ventana." }
    escalera:
      - "Una ventana que valga cero en los dos extremos empalma siempre."
    solucion: "Ventana Hann con 3,25 ciclos."
    comprobar:
      - { con: { c_y: 3.25, v_h: 1 }, s_j: 0 }

  - id: empareje-ventanas
    tipo: explorar
    titulo: "Cada ventana para lo suyo"
    texto: "Quiere ver un tono pequeño, a {{L_p}}, junto a uno enorme. Elija la ventana que lo permite sin ensanchar de más."
    nota: "Anchura del pico esquemática."
    libro: [193, 194]
    inicio: { k_w: 0 }
    widget:
      tipo: grafica
      x: { id: nu, min: -8, max: 8, unidad: "", rotulo: "casillas" }
      y: { min: -100, max: 5, unidad: dB, rotulo: "nivel" }
      curvas:
        - { expr: "max(lob, -100*abs(nu)/w_k)", color: azul, rotulo: "tono enorme y su fuga" }
        - { expr: "L_p - 100*abs(nu - 5)/w_k", color: naranja, rotulo: "tono pequeño" }
      lectura: { valor: lob, rotulo: "Lóbulos laterales" }
      mandos:
        - { valor: k_w, lista: [0, 1, 2, 3], nombres: [rectangular, Hann, Blackman, flat-top], rotulo: "Ventana" }
    objetivo:
      condiciones:
        - { valor: lob, max: -50, min: -60, rotulo: "Fuga: {{lob}}" }
      logrado: "La Blackman: lóbulos a −58 dB, por debajo del tono pequeño. Menos fuga a costa de peor resolución."
      pistas:
        - { cuando: { valor: lob, menor: -60 }, texto: "La flat-top también lo vería, pero su pico es muy ancho: es para medir amplitudes." }
        - { texto: "Su fuga tapa el tono pequeño: hace falta una ventana de lóbulos más bajos." }
    escalera:
      - "Los lóbulos de la tabla: −13, −31, −58 y −90 dB."
    solucion: "Blackman."
    comprobar:
      - { con: { k_w: 2 }, lob: -58 }

  - id: predecir-hann
    tipo: predecir
    titulo: "Medir un nivel"
    texto: "Mide la amplitud de un tono con ventana Hann y el tono cae entre dos casillas. ¿Qué marca la FFT?"
    libro: [195]
    widget:
      tipo: figura
      figura: fig-30.12
      zonas:
        - { id: todo, rotulo: "Coste de la FFT y tres ventanas", rect: [0, 0, 448, 206] }
    opciones:
      - texto: "Hasta 1,4 dB menos de su amplitud real"
        bien: true
        porque: "Es el error más frecuente al medir con FFT. Para niveles, flat-top, o corregir."
      - texto: "Su amplitud exacta"
        porque: "Solo si cae justo en una casilla; entre dos, la Hann pierde hasta 1,4 dB."
      - texto: "El doble, porque aparece en dos casillas"
        porque: "La energía se reparte entre las dos: cada una marca menos, no más."
    escalera:
      - "¿Qué ventana de la tabla se usa para medir amplitudes?"
    solucion: "Hasta 1,4 dB por debajo: para medir niveles, flat-top."

  - id: pregunta-goertzel
    tipo: explorar
    titulo: "Solo unas pocas frecuencias"
    texto: "Goertzel cuesta del orden de M·N; la FFT, N·log₂N. Con N = 205, suba M hasta el último número de tonos con el que Goertzel aún gana."
    libro: [197, 201]
    inicio: { M_g: 1 }
    widget:
      tipo: grafica
      x: { id: m, min: 0, max: 10, unidad: "", rotulo: "M" }
      y: { min: 0, max: 2200, unidad: "", rotulo: "operaciones" }
      curvas:
        - { expr: "m*N_g", color: naranja, rotulo: "Goertzel, M·N" }
        - { expr: "c_f", color: azul, rotulo: "FFT, N·log₂N", discontinua: true }
      marcas:
        - { x: "M_g", y: "c_g", rotulo: "M = {{M_g}}" }
      lectura: { valor: c_g, rotulo: "Coste de Goertzel" }
      datos:
        - { valor: c_f, rotulo: "FFT: {{c_f}}" }
      mandos:
        - { valor: M_g, min: 1, max: 10, paso: 1, rotulo: "Tonos, M" }
    objetivo:
      condiciones:
        - { valor: g_ok, min: 1, rotulo: "El último M que gana" }
      logrado: "M = {{M_g}}, por debajo de log₂N = {{l_g}}. Los ocho tonos DTMF ya cuestan como una FFT."
      pistas:
        - { cuando: { valor: M_g, mayor: 7.7 }, texto: "Ahí Goertzel ya cuesta más que la FFT: baje." }
        - { texto: "Todavía sobra margen: suba M." }
    escalera:
      - "Goertzel gana mientras M sea menor que log₂N = 7,7."
    solucion: "M = 7."
    comprobar:
      - { con: { M_g: 7 }, g_ok: 1, l_g: 7.68 }

  - id: pregunta-fir-iir
    tipo: explorar
    titulo: "FIR o IIR"
    texto: "Hay que filtrar pulsos de datos sin deformar su forma de onda. Elija el filtro que retarda todas las frecuencias lo mismo."
    nota: "Filtros de ejemplo."
    libro: [204, 205, 206, 209]
    inicio: { k_f: 1 }
    widget:
      tipo: grafica
      x: { id: t, min: 0, max: 3, unidad: s, rotulo: "t", muestras: 900 }
      y: { min: -0.1, max: 1.2, unidad: "", rotulo: "x" }
      curvas:
        - { expr: "min(max((t - 1)*1000000, 0), 1) - min(max((t - 2)*1000000, 0), 1)", color: tinta, rotulo: "pulso", discontinua: true }
        - { expr: "(1 - k_f)*(min(max((t - 1)/W_f, 0), 1) - min(max((t - 2)/W_f, 0), 1)) + k_f*((1 - exp(-max(t - 1, 0)/t_f)) - (1 - exp(-max(t - 2, 0)/t_f)))", color: naranja, rotulo: "salida del filtro" }
      mandos:
        - { valor: k_f, lista: [1, 0], nombres: [IIR, FIR], rotulo: "Filtro" }
    objetivo:
      condiciones:
        - { valor: fir, min: 1, rotulo: "Pulso sin deformar" }
      logrado: "El FIR: sin realimentación, siempre estable y con fase exactamente lineal; las dos caras del pulso salen simétricas. Su precio, muchos coeficientes."
      pistas:
        - { texto: "El IIR sube y baja con colas distintas: deforma. Ahorra coeficientes, típicamente diez veces menos, pero no tiene fase lineal." }
    escalera:
      - "¿Cuál de los dos realimenta salidas anteriores?"
    solucion: "El FIR."
    comprobar:
      - { con: { k_f: 0 }, fir: 1 }

  - id: porque-antes-convertidor
    tipo: porque
    titulo: "Lo que el digital no puede"
    texto: "Fase lineal, coeficientes exactos, filtros que cambian en marcha. ¿Qué no puede hacer nunca un filtro digital?"
    libro: [209, 210]
    widget:
      tipo: figura
      figura: fig-30.12
      zonas:
        - { id: todo, rotulo: "Coste de la FFT y tres ventanas", rect: [0, 0, 448, 206] }
    opciones:
      - texto: "Actuar antes del convertidor: el antialiasing tiene que ser analógico"
        bien: true
        porque: "Lo que se pliega al muestrear ya está dentro de los datos, y no se recupera."
      - texto: "Tener fase lineal"
        porque: "Al contrario: la fase lineal es imposible en un analógico causal y fácil en un FIR."
      - texto: "Tener coeficientes sin deriva"
        porque: "Es una de sus ventajas: ni tolerancia, ni temperatura, ni envejecimiento."
    escalera:
      - "¿Dónde está el filtro digital respecto al muestreo?"
    solucion: "Actuar antes del convertidor."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
