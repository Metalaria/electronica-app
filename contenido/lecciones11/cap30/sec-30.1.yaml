# Lección 1.2 de la sección 29.1 «Qué es una Señal» (cap30, sec-30.1). Formato: GUIA.md.
# - Los dos ejes de la tabla del bloque 10 en una sola curva: el tiempo discreto como muestra y retención
#   (t → T·floor(t/T)) y la amplitud cuantificada como redondeo a cuartos. La senoide de 1 Hz, el periodo de muestreo
#   de 1/16 s y los cuatro niveles por unidad son de ejemplo (para verlo en pantalla); no salen como números.
# - Las señales elementales: un pulso de anchura w y área uno (el impulso cuando w tiende a cero), su integral (una
#   rampa de subida w que tiende al escalón) y la integral de esta (la rampa), como dice el bloque 30.
# Paso práctico: «tocar» en la figura 29.2 la señal que da un sample-and-hold (bloque 11).
leccion: cap30/sec-30.1

libro:
  4: "Una señal es una magnitud que transporta información"
  7: "En el tiempo: continua si está definida en todo instante"
  8: "En amplitud: continua si puede tomar cualquier valor"
  9: "de las cuatro combinaciones salen cuatro tipos"
  10: "Amplitud cuantificada"
  11: "un sample-and-hold da una señal muestreada de amplitud continua"
  13: "Determinista: se puede predecir"
  14: "una señal perfectamente predecible no transporta nada"
  15: "la información es lo impredecible"
  17: "Su espectro es discreto"
  18: "Un pulso aislado contiene todas las frecuencias"
  19: "la FFT supone periodicidad en el trozo capturado"
  21: "Valor medio, que en una señal de alterna pura es cero"
  22: "Valor eficaz, que da la potencia"
  23: "una periódica tiene energía infinita y potencia finita"
  24: "Ancho de banda, que es lo que determina el canal necesario"
  27: "infinitamente estrecho y de área uno"
  28: "su respuesta muestra a la vez rapidez, sobreoscilación y amortiguamiento"
  29: "Rampa, senoide y exponencial"
  30: "el escalón es la integral del impulso, la rampa la del escalón"
  32: "La señal de prueba que más dice por unidad de esfuerzo es el escalón"
  33: "de una sola captura, más información sobre un sistema que con un barrido completo de frecuencia"
  35: "Los cuatro tipos de señal"

modelo:
  valores:
    m_t: { sim: "t", nombre: "eje del tiempo", unidad: "", valor: 0 }
    q_a: { sim: "A", nombre: "eje de la amplitud", unidad: "", valor: 0 }
    f_e: { sim: "f", nombre: "frecuencia de ejemplo", unidad: Hz, valor: 1 }
    T_e: { sim: "T", nombre: "periodo de muestreo de ejemplo", unidad: s, valor: 0.0625 }
    w_p: { sim: "w", nombre: "anchura del pulso", unidad: s, valor: 1 }
  calculos:
    h_p: { expr: "1/w_p", sim: "1/w", nombre: "altura del pulso", unidad: "" }
    a_p: { expr: "h_p*w_p", sim: "área", nombre: "área del pulso", unidad: "" }

tarjetas:
  - id: explore-ejes
    tipo: explorar
    titulo: "Dos ejes independientes"
    texto: "Haga discreto el tiempo de esta senoide, luego la amplitud, luego los dos: cada eje cambia la señal por su cuenta."
    nota: "Valores de ejemplo, para verlo en pantalla."
    libro: [7, 8, 10]
    widget:
      tipo: grafica
      x: { id: t, min: 0, max: 2, unidad: s, rotulo: "t", muestras: 1200 }
      y: { min: -1.2, max: 1.2, unidad: "", rotulo: "x(t)" }
      curvas:
        - { expr: "sin(2*pi*f_e*t)", color: tinta, rotulo: "original", discontinua: true }
        - { expr: "(1 - q_a)*sin(2*pi*f_e*((1 - m_t)*t + m_t*T_e*floor(t/T_e))) + q_a*round(4*sin(2*pi*f_e*((1 - m_t)*t + m_t*T_e*floor(t/T_e))))/4", color: naranja, rotulo: "señal" }
      mandos:
        - { valor: m_t, lista: [0, 1], nombres: [continuo, discreto], rotulo: "Tiempo" }
        - { valor: q_a, lista: [0, 1], nombres: [continua, cuantificada], rotulo: "Amplitud" }
    requiere: { mover: [m_t, q_a] }

  - id: empareje-tipos
    tipo: pregunta
    titulo: "Cuatro combinaciones, cuatro tipos"
    texto: "Empareje cada tipo de señal con sus dos ejes."
    libro: [9, 10, 11]
    widget:
      tipo: figura
      figura: fig-30.1
      zonas:
        - { id: todo, rotulo: "De la señal continua a la muestreada", rect: [0, 0, 443, 159] }
    emparejar:
      - ["Analógica", "Tiempo continuo y amplitud continua"]
      - ["Muestreada", "Tiempo discreto y amplitud continua"]
      - ["Cuantificada", "Tiempo continuo y amplitud cuantificada"]
      - ["Digital", "Tiempo discreto y amplitud cuantificada"]
    exito: "La digital es discreta en ambos ejes: el paso completo que da un convertidor."
    pistas:
      - { texto: "Muestrear discretiza el tiempo; cuantificar, la amplitud." }
    escalera:
      - "«Muestreada» habla del tiempo; «cuantificada», de la amplitud."
    solucion: "Analógica, nada discreto; muestreada, el tiempo; cuantificada, la amplitud; digital, los dos."

  - id: toque-sample-hold
    tipo: tocar
    titulo: "La salida de un sample-and-hold"
    texto: "Un sample-and-hold toma muestras y las retiene, sin redondear su valor. Toque la señal que entrega."
    libro: [11, 35]
    widget:
      tipo: figura
      figura: fig-30.2
      zonas:
        - { id: analogica, rotulo: "Arriba a la izquierda", rect: [36, 28, 195, 94] }
        - { id: cuantificada, rotulo: "Arriba a la derecha", rect: [243, 28, 193, 94] }
        - { id: muestreada, rotulo: "Abajo a la izquierda", rect: [36, 147, 195, 96] }
        - { id: digital, rotulo: "Abajo a la derecha", rect: [243, 147, 193, 96] }
    tocar:
      bien: [muestreada]
      porque:
        analogica: "La analógica está definida en todo instante; el sample-and-hold solo toma instantes concretos."
        cuantificada: "Esa redondea la amplitud y no muestrea: justo lo contrario de un sample-and-hold."
        digital: "Esa además está redondeada: es lo que sale después del convertidor, no del sample-and-hold."
    exito: "Muestreada: tiempo discreto, amplitud continua. Una de las dos casillas intermedias."
    escalera:
      - "Tomar muestras discretiza el tiempo. ¿Discretiza también la amplitud?"
    solucion: "Abajo a la izquierda, la muestreada: tiempo discreto y amplitud continua."

  - id: pregunta-informacion
    tipo: predecir
    titulo: "Lo que transporta información"
    texto: "¿Cuál de estas señales puede transportar información?"
    libro: [13, 14, 15]
    widget:
      tipo: figura
      figura: fig-30.1
      zonas:
        - { id: todo, rotulo: "De la señal continua a la muestreada", rect: [0, 0, 443, 159] }
    opciones:
      - texto: "Una secuencia de datos que, vista de lejos, parece ruido"
        bien: true
        porque: "La información es lo impredecible: por eso una señal con datos se parece estadísticamente al ruido."
      - texto: "Una senoide perfecta, de amplitud y frecuencia fijas"
        porque: "Es determinista: se puede predecir entera, y una señal perfectamente predecible no transporta nada."
      - texto: "Ninguna aleatoria: lo aleatorio es ruido y no informa"
        porque: "Al revés: la información útil también solo se describe estadísticamente, como el ruido."
    escalera:
      - "Si el receptor ya sabe lo que va a llegar, ¿qué aprende al recibirlo?"
    solucion: "La de datos: la información es lo impredecible."

  - id: pregunta-pulso
    tipo: pregunta
    titulo: "El espectro de un pulso"
    texto: "Una señal periódica tiene un espectro de líneas: la fundamental y sus armónicos. ¿Y un pulso aislado?"
    libro: [17, 18]
    widget:
      tipo: figura
      figura: fig-30.1
      zonas:
        - { id: todo, rotulo: "De la señal continua a la muestreada", rect: [0, 0, 443, 159] }
    opciones:
      - texto: "Un espectro continuo: contiene todas las frecuencias"
        bien: true
        porque: "Lo que no se repite no tiene una fundamental: su espectro no son líneas sino un continuo."
      - texto: "Una sola línea, en el inverso de su duración"
        porque: "Una línea sola es una senoide, que se repite. El pulso aislado no se repite."
      - texto: "Ninguno: si no se repite no tiene frecuencias"
        porque: "Las tiene todas: un pulso aislado contiene todas las frecuencias."
    escalera:
      - "Las líneas del espectro salen de la repetición. Sin repetición…"
    solucion: "Continuo: un pulso aislado contiene todas las frecuencias."

  - id: porque-fuga
    tipo: porque
    titulo: "La FFT y la periodicidad"
    texto: "Al medir con la FFT aparece fuga espectral, que las ventanas mitigan. ¿De dónde sale?"
    libro: [19]
    widget:
      tipo: figura
      figura: fig-30.1
      zonas:
        - { id: todo, rotulo: "De la señal continua a la muestreada", rect: [0, 0, 443, 159] }
    opciones:
      - texto: "La FFT supone que el trozo capturado se repite, y la señal real no lo hace"
        bien: true
        porque: "Trata la captura como periódica; si no lo es, el espectro de líneas se emborrona."
      - texto: "Del ruido del convertidor"
        porque: "El ruido sube el suelo, pero la fuga aparece aun sin ruido: es la periodicidad supuesta."
      - texto: "De muestrear demasiado deprisa"
        porque: "Muestrear deprisa no crea fuga; lo que la crea es suponer periodicidad donde no la hay."
    escalera:
      - "¿Qué supone la FFT sobre lo que pasa fuera del trozo capturado?"
    solucion: "Supone periodicidad en el trozo; sin ella, aparece la fuga."

  - id: empareje-magnitudes
    tipo: pregunta
    titulo: "Las magnitudes que la describen"
    texto: "Empareje cada magnitud con lo que dice de la señal."
    libro: [21, 22, 23, 24]
    widget:
      tipo: figura
      figura: fig-30.1
      zonas:
        - { id: todo, rotulo: "De la señal continua a la muestreada", rect: [0, 0, 443, 159] }
    emparejar:
      - ["Valor medio", "Cero en una alterna pura"]
      - ["Valor eficaz", "Da la potencia"]
      - ["Energía finita", "Una señal de duración finita"]
      - ["Ancho de banda", "Fija el canal y la frecuencia de muestreo"]
    exito: "Y una periódica tiene energía infinita y potencia finita: es una señal de potencia."
    pistas:
      - { texto: "El eficaz se define precisamente por la potencia que entrega." }
    escalera:
      - "Empiece por la alterna pura: sube tanto como baja."
    solucion: "Medio, cero en alterna; eficaz, potencia; energía finita, duración finita; ancho de banda, canal y muestreo."

  - id: explore-elementales
    tipo: explorar
    titulo: "Del impulso a la rampa"
    texto: "Un pulso de área uno, su integral y la integral de esta. Estreche el pulso sin cambiar su área."
    nota: "Con anchura nula sería el impulso, que no es realizable."
    libro: [27, 29, 30]
    widget:
      tipo: grafica
      x: { id: t, min: 0, max: 4, unidad: s, rotulo: "t", muestras: 1600 }
      y: { min: 0, max: 4.2, unidad: "", rotulo: "x(t)" }
      curvas:
        - { expr: "(min(max((t - 1)*1000000, 0), 1) - min(max((t - 1 - w_p)*1000000, 0), 1))/w_p", color: azul, rotulo: "pulso de área uno" }
        - { expr: "min(max((t - 1)/w_p, 0), 1)", color: naranja, rotulo: "su integral" }
        - { expr: "min(max(t - 1, 0), w_p)^2/(2*w_p) + max(0, t - 1 - w_p)", color: verde, rotulo: "la integral de esta" }
      lectura: { valor: a_p, rotulo: "Área del pulso" }
      datos:
        - { valor: h_p, rotulo: "Altura: {{h_p}}" }
      mandos:
        - { valor: w_p, lista: [1, 0.5, 0.25], rotulo: "Anchura del pulso, w" }
    requiere: { mover: [w_p] }

  - id: pregunta-integral
    tipo: pregunta
    titulo: "Escalón e impulso"
    texto: "El escalón es la integral del impulso. ¿Qué relación hay entre la respuesta de un sistema al escalón y su respuesta al impulso?"
    libro: [30]
    widget:
      tipo: grafica
      x: { id: t, min: 0, max: 4, unidad: s, rotulo: "t", muestras: 1600 }
      y: { min: 0, max: 4.2, unidad: "", rotulo: "x(t)" }
      curvas:
        - { expr: "(min(max((t - 1)*1000000, 0), 1) - min(max((t - 1 - w_p)*1000000, 0), 1))/w_p", color: azul, rotulo: "pulso de área uno" }
        - { expr: "min(max((t - 1)/w_p, 0), 1)", color: naranja, rotulo: "su integral" }
    opciones:
      - texto: "La del escalón es la integral de la del impulso: dan la misma información"
        bien: true
        porque: "Si la entrada se integra, la salida de un sistema lineal también: ninguna dice más que la otra."
      - texto: "La del impulso es la integral de la del escalón"
        porque: "Al revés: el escalón es la integral del impulso, no su derivada."
      - texto: "No tienen relación: son dos ensayos distintos"
        porque: "Las une la misma integral que une las dos entradas."
    escalera:
      - "Lo que se hace a la entrada de un sistema lineal se refleja en la salida."
    solucion: "La respuesta al escalón es la integral de la respuesta al impulso."

  - id: porque-escalon
    tipo: porque
    titulo: "La señal de prueba más rentable"
    texto: "Con una cuadrada de flanco rápido y un osciloscopio, una sola captura dice más que un barrido de frecuencia. ¿Por qué el escalón?"
    libro: [28, 32, 33]
    widget:
      tipo: figura
      figura: fig-30.1
      zonas:
        - { id: todo, rotulo: "De la señal continua a la muestreada", rect: [0, 0, 443, 159] }
    opciones:
      - texto: "Su respuesta muestra a la vez rapidez, sobreoscilación y amortiguamiento"
        bien: true
        porque: "Por eso caracteriza un filtro, un lazo de control, una fuente y un amplificador."
      - texto: "Porque no tiene armónicos y no excita resonancias"
        porque: "Al contrario: un flanco rápido tiene mucho contenido en frecuencia, y por eso revela tanto."
      - texto: "Porque es el impulso, que caracteriza el sistema"
        porque: "No es el impulso, pero su respuesta es la integral de la del impulso: dice lo mismo."
    escalera:
      - "Piense en lo que se ve en la pantalla tras el flanco."
    solucion: "Una captura enseña la rapidez, la sobreoscilación y el amortiguamiento."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [4, 10, 15, 18, 30, 32]
    ideas:
      - { titulo: "Dos ejes.", texto: "Tiempo continuo o discreto y amplitud continua o cuantificada: la digital es discreta en ambos." }
      - { titulo: "Información.", texto: "Lo impredecible: una señal con datos se parece al ruido." }
      - { titulo: "Espectro.", texto: "Periódica, de líneas; un pulso aislado, continuo." }
      - { titulo: "Escalón.", texto: "La integral del impulso y la señal de prueba más rentable." }
