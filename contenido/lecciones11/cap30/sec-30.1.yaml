# Lección 1.2 de la sección 29.1 «Qué es una Señal» (cap30, sec-30.1). Formato: GUIA.md.
# - Los dos ejes de la tabla del bloque 10 en una sola curva: el tiempo discreto como muestra y retención
#   (t → T·floor(t/T)) y la amplitud cuantificada como redondeo a cuartos. La senoide de 1 Hz, el periodo de muestreo
#   de 1/16 s y los cuatro niveles por unidad son de ejemplo (para verlo en pantalla); no salen como números.
# - Las señales elementales: un pulso de anchura w y área uno (el impulso cuando w tiende a cero), su integral (una
#   rampa de subida w que tiende al escalón) y la integral de esta (la rampa), como dice el bloque 30.
# 1.2.1 (autor121-senpro, «aprender haciendo», GUIA §13): la digital se consigue con los dos mandos; los tipos se tocan
# en la figura 29.2; la fuga de la FFT se ve repitiendo la captura (una ventana de 1 s, 1,25 s… de una senoide de
# 1 Hz, de ejemplo) hasta que empalma sin salto; el valor medio se lleva a cero quitando la continua de ejemplo; el
# pulso se estrecha hasta una altura de 4; el escalón se marca donde la integral del pulso llega a 1; y la
# sobreoscilación se marca en una respuesta al escalón de segundo orden de ejemplo (ζ = 0,3, ω_n = 2π rad/s). Quedan
# dos preguntas de opciones: lo que transporta información y el espectro de un pulso aislado.
leccion: cap30/sec-30.1

libro:
  4: "Una señal es una magnitud que transporta información"
  7: "En el tiempo: continua si está definida en todo instante"
  8: "En amplitud: continua si puede tomar cualquier valor"
  9: "de las cuatro combinaciones salen cuatro tipos"
  10: "Amplitud cuantificada"
  11: "un sample-and-hold da una señal muestreada de amplitud continua"
  13: "Determinista: se puede predecir"
  14: "una señal perfectamente predecible no transporta nada"
  15: "la información es lo impredecible"
  17: "Su espectro es discreto"
  18: "Un pulso aislado contiene todas las frecuencias"
  19: "la FFT supone periodicidad en el trozo capturado"
  21: "Valor medio, que en una señal de alterna pura es cero"
  22: "Valor eficaz, que da la potencia"
  23: "una periódica tiene energía infinita y potencia finita"
  24: "Ancho de banda, que es lo que determina el canal necesario"
  27: "infinitamente estrecho y de área uno"
  28: "su respuesta muestra a la vez rapidez, sobreoscilación y amortiguamiento"
  29: "Rampa, senoide y exponencial"
  30: "el escalón es la integral del impulso, la rampa la del escalón"
  32: "La señal de prueba que más dice por unidad de esfuerzo es el escalón"
  33: "de una sola captura, más información sobre un sistema que con un barrido completo de frecuencia"
  35: "Los cuatro tipos de señal"

modelo:
  valores:
    m_t: { sim: "t", nombre: "eje del tiempo", unidad: "", valor: 0 }
    q_a: { sim: "A", nombre: "eje de la amplitud", unidad: "", valor: 0 }
    f_e: { sim: "f", nombre: "frecuencia de ejemplo", unidad: Hz, valor: 1 }
    T_e: { sim: "T", nombre: "periodo de muestreo de ejemplo", unidad: s, valor: 0.0625 }
    w_p: { sim: "w", nombre: "anchura del pulso", unidad: s, valor: 1 }
    T_w: { sim: "T_{captura}", nombre: "duración de la captura", unidad: s, valor: 0.75 }
    V_dc: { sim: "V_{cc}", nombre: "continua de ejemplo", unidad: V, valor: 0.5 }
    z_e: { sim: "ζ", nombre: "amortiguamiento de ejemplo", unidad: "", valor: 0.3 }
    w_n: { sim: "ω_{n}", nombre: "pulsación natural de ejemplo", unidad: rad/s, valor: 6.283185307 }
  calculos:
    d_g: { expr: "m_t*q_a", sim: "digital", nombre: "señal digital (los dos ejes discretos)", unidad: "" }
    h_p: { expr: "1/w_p", sim: "1/w", nombre: "altura del pulso", unidad: "" }
    a_p: { expr: "h_p*w_p", sim: "área", nombre: "área del pulso", unidad: "" }
    t_e: { expr: "1 + w_p", sim: "t_{1}", nombre: "instante en que la integral llega a 1", unidad: s }
    s_c: { expr: "abs(sin(2*pi*f_e*T_w))", sim: "salto", nombre: "salto al repetir la captura", unidad: "", cifras: 2 }
    V_med: { expr: "V_dc", sim: "V_{media}", nombre: "valor medio", unidad: V }
    V_ef: { expr: "sqrt(V_dc^2 + 0.5)", sim: "V_{ef}", nombre: "valor eficaz", unidad: V }
    t_pk: { expr: "pi/(w_n*sqrt(1 - z_e^2))", sim: "t_{p}", nombre: "instante del pico", unidad: s }

tarjetas:
  - id: explore-ejes
    tipo: explorar
    titulo: "Dos ejes independientes"
    texto: "Cada mando discretiza un eje de esta senoide. Consiga la señal digital."
    nota: "Valores de ejemplo, para verlo en pantalla."
    libro: [7, 8, 10]
    inicio: { m_t: 0, q_a: 0 }
    widget:
      tipo: grafica
      x: { id: t, min: 0, max: 2, unidad: s, rotulo: "t", muestras: 1200 }
      y: { min: -1.2, max: 1.2, unidad: "", rotulo: "x(t)" }
      curvas:
        - { expr: "sin(2*pi*f_e*t)", color: tinta, rotulo: "original", discontinua: true }
        - { expr: "(1 - q_a)*sin(2*pi*f_e*((1 - m_t)*t + m_t*T_e*floor(t/T_e))) + q_a*round(4*sin(2*pi*f_e*((1 - m_t)*t + m_t*T_e*floor(t/T_e))))/4", color: naranja, rotulo: "señal" }
      mandos:
        - { valor: m_t, lista: [0, 1], nombres: [continuo, discreto], rotulo: "Tiempo" }
        - { valor: q_a, lista: [0, 1], nombres: [continua, cuantificada], rotulo: "Amplitud" }
    objetivo:
      condiciones:
        - { valor: d_g, min: 1, rotulo: "Tiempo y amplitud discretos" }
      logrado: "Digital: escalones en el tiempo y niveles en la amplitud. Cada eje se discretiza por su cuenta."
      pistas:
        - { cuando: { valor: m_t, max: 0 }, texto: "El tiempo sigue continuo: discretícelo." }
        - { texto: "La amplitud aún toma cualquier valor: cuantifíquela." }
    escalera:
      - "Digital quiere decir discreta en los dos ejes."
    solucion: "Tiempo discreto y amplitud cuantificada."

  - id: empareje-tipos
    tipo: tocar
    titulo: "Cuatro combinaciones, cuatro tipos"
    texto: "De las cuatro combinaciones salen cuatro tipos. Toque la de tiempo continuo y amplitud cuantificada."
    libro: [9, 10, 35]
    widget:
      tipo: figura
      figura: fig-30.2
      zonas:
        - { id: analogica, rotulo: "Arriba a la izquierda", rect: [36, 28, 195, 94] }
        - { id: cuantificada, rotulo: "Arriba a la derecha", rect: [243, 28, 193, 94] }
        - { id: muestreada, rotulo: "Abajo a la izquierda", rect: [36, 147, 195, 96] }
        - { id: digital, rotulo: "Abajo a la derecha", rect: [243, 147, 193, 96] }
    tocar:
      bien: [cuantificada]
      porque:
        analogica: "Esa toma cualquier valor: su amplitud es continua."
        muestreada: "Esa tiene el tiempo discreto: solo existe en instantes concretos."
        digital: "Esa es discreta en los dos ejes: tiempo y amplitud."
    exito: "La cuantificada: definida en todo instante, pero solo con ciertos niveles."
    escalera:
      - "Busque una curva continua en el tiempo hecha de escalones de altura."
    solucion: "Arriba a la derecha: la cuantificada."

  - id: toque-sample-hold
    tipo: tocar
    titulo: "La salida de un sample-and-hold"
    texto: "Un sample-and-hold toma muestras y las retiene, sin redondear su valor. Toque la señal que entrega."
    libro: [11, 35]
    widget:
      tipo: figura
      figura: fig-30.2
      zonas:
        - { id: analogica, rotulo: "Arriba a la izquierda", rect: [36, 28, 195, 94] }
        - { id: cuantificada, rotulo: "Arriba a la derecha", rect: [243, 28, 193, 94] }
        - { id: muestreada, rotulo: "Abajo a la izquierda", rect: [36, 147, 195, 96] }
        - { id: digital, rotulo: "Abajo a la derecha", rect: [243, 147, 193, 96] }
    tocar:
      bien: [muestreada]
      porque:
        analogica: "La analógica está definida en todo instante; el sample-and-hold solo toma instantes concretos."
        cuantificada: "Esa redondea la amplitud y no muestrea: justo lo contrario de un sample-and-hold."
        digital: "Esa además está redondeada: es lo que sale después del convertidor, no del sample-and-hold."
    exito: "Muestreada: tiempo discreto, amplitud continua. Una de las dos casillas intermedias."
    escalera:
      - "Tomar muestras discretiza el tiempo. ¿Discretiza también la amplitud?"
    solucion: "Abajo a la izquierda, la muestreada: tiempo discreto y amplitud continua."

  - id: pregunta-informacion
    tipo: predecir
    titulo: "Lo que transporta información"
    texto: "¿Cuál de estas señales puede transportar información?"
    libro: [13, 14, 15]
    widget:
      tipo: figura
      figura: fig-30.1
      zonas:
        - { id: todo, rotulo: "De la señal continua a la muestreada", rect: [0, 0, 443, 159] }
    opciones:
      - texto: "Una secuencia de datos que, vista de lejos, parece ruido"
        bien: true
        porque: "La información es lo impredecible: por eso una señal con datos se parece estadísticamente al ruido."
      - texto: "Una senoide perfecta, de amplitud y frecuencia fijas"
        porque: "Es determinista: se puede predecir entera, y una señal perfectamente predecible no transporta nada."
      - texto: "Ninguna aleatoria: lo aleatorio es ruido y no informa"
        porque: "Al revés: la información útil también solo se describe estadísticamente, como el ruido."
    escalera:
      - "Si el receptor ya sabe lo que va a llegar, ¿qué aprende al recibirlo?"
    solucion: "La de datos: la información es lo impredecible."

  - id: pregunta-pulso
    tipo: pregunta
    titulo: "El espectro de un pulso"
    texto: "Una señal periódica tiene un espectro de líneas: la fundamental y sus armónicos. ¿Y un pulso aislado?"
    libro: [17, 18]
    widget:
      tipo: figura
      figura: fig-30.1
      zonas:
        - { id: todo, rotulo: "De la señal continua a la muestreada", rect: [0, 0, 443, 159] }
    opciones:
      - texto: "Un espectro continuo: contiene todas las frecuencias"
        bien: true
        porque: "Lo que no se repite no tiene una fundamental: su espectro no son líneas sino un continuo."
      - texto: "Una sola línea, en el inverso de su duración"
        porque: "Una línea sola es una senoide, que se repite. El pulso aislado no se repite."
      - texto: "Ninguno: si no se repite no tiene frecuencias"
        porque: "Las tiene todas: un pulso aislado contiene todas las frecuencias."
    escalera:
      - "Las líneas del espectro salen de la repetición. Sin repetición…"
    solucion: "Continuo: un pulso aislado contiene todas las frecuencias."

  - id: porque-fuga
    tipo: explorar
    titulo: "La FFT y la periodicidad"
    texto: "La FFT supone que el trozo capturado se repite. Cambie la duración de la captura hasta que la repetición empalme sin salto."
    nota: "Una senoide de 1 Hz, de ejemplo."
    libro: [19]
    inicio: { T_w: 0.75 }
    widget:
      tipo: grafica
      x: { id: t, min: 0, max: 3, unidad: s, rotulo: "t", muestras: 1200 }
      y: { min: -1.2, max: 1.2, unidad: "", rotulo: "x(t)" }
      curvas:
        - { expr: "sin(2*pi*f_e*(t - T_w*floor(t/T_w)))", color: naranja, rotulo: "lo que supone la FFT" }
        - { expr: "sin(2*pi*f_e*t)", color: tinta, rotulo: "señal real", discontinua: true }
      lectura: { valor: s_c, rotulo: "Salto al empalmar" }
      mandos:
        - { valor: T_w, lista: [0.75, 1.25, 1.5, 2], rotulo: "Duración de la captura" }
    objetivo:
      condiciones:
        - { valor: s_c, max: 0.01, rotulo: "Salto: {{s_c}}" }
      logrado: "Con {{T_w}} caben ciclos enteros: la repetición coincide con la señal. Si no, el salto es la fuga espectral que las ventanas mitigan."
      pistas:
        - { texto: "Aún hay salto: la captura corta la senoide a medio ciclo." }
    escalera:
      - "La senoide es de 1 Hz: busque una captura que dure ciclos enteros."
    solucion: "La captura de dos ciclos enteros."
    comprobar:
      - { con: { T_w: 2 }, s_c: 0 }

  - id: empareje-magnitudes
    tipo: explorar
    titulo: "El valor medio de una alterna"
    texto: "Esta senoide lleva una continua encima. Quítela hasta dejar una alterna pura."
    nota: "Valores de ejemplo."
    libro: [21, 22, 23, 24]
    inicio: { V_dc: 0.5 }
    widget:
      tipo: grafica
      x: { id: t, min: 0, max: 2, unidad: s, rotulo: "t" }
      y: { min: -1.6, max: 1.6, unidad: V, rotulo: "v(t)" }
      curvas:
        - { expr: "V_dc + sin(2*pi*f_e*t)", color: azul, rotulo: "señal" }
        - { expr: "V_dc", color: tinta, rotulo: "valor medio", discontinua: true }
      lectura: { valor: V_med, rotulo: "Valor medio" }
      datos:
        - { valor: V_ef, rotulo: "Valor eficaz: {{V_ef}}" }
      mandos:
        - { valor: V_dc, min: -0.5, max: 0.5, paso: 0.25, rotulo: "Continua" }
    objetivo:
      condiciones:
        - { valor: V_med, objetivo: 0, tol: 0.001, rotulo: "Media: {{V_med}}" }
      logrado: "Alterna pura: media cero, pero el eficaz no es cero, porque da la potencia."
      pistas:
        - { cuando: { valor: V_dc, min: 0.1 }, texto: "La media sigue por encima de cero: baje la continua." }
        - { texto: "La media está por debajo de cero: suba la continua." }
    escalera:
      - "Una alterna pura sube tanto como baja."
    solucion: "Continua a 0 V."
    comprobar:
      - { con: { V_dc: 0 }, V_med: 0 }

  - id: explore-elementales
    tipo: explorar
    titulo: "Del impulso a la rampa"
    texto: "Un pulso de área uno, su integral y la integral de esta. Estreche el pulso hasta que su altura llegue a 4."
    nota: "Con anchura nula sería el impulso, que no es realizable."
    libro: [27, 29, 30]
    inicio: { w_p: 1 }
    widget:
      tipo: grafica
      x: { id: t, min: 0, max: 4, unidad: s, rotulo: "t", muestras: 1600 }
      y: { min: 0, max: 4.2, unidad: "", rotulo: "x(t)" }
      curvas:
        - { expr: "(min(max((t - 1)*1000000, 0), 1) - min(max((t - 1 - w_p)*1000000, 0), 1))/w_p", color: azul, rotulo: "pulso de área uno" }
        - { expr: "min(max((t - 1)/w_p, 0), 1)", color: naranja, rotulo: "su integral" }
        - { expr: "min(max(t - 1, 0), w_p)^2/(2*w_p) + max(0, t - 1 - w_p)", color: verde, rotulo: "la integral de esta" }
      lectura: { valor: a_p, rotulo: "Área del pulso" }
      datos:
        - { valor: h_p, rotulo: "Altura: {{h_p}}" }
      mandos:
        - { valor: w_p, lista: [1, 0.5, 0.25], rotulo: "Anchura del pulso, w" }
    objetivo:
      condiciones:
        - { valor: h_p, min: 3.99, rotulo: "Altura: {{h_p}}" }
      logrado: "Más estrecho y más alto, con el área en {{a_p}}: así se acerca al impulso. Su integral sube cada vez más deprisa, hacia el escalón."
      pistas:
        - { texto: "Todavía es ancho: estréchelo más." }
    escalera:
      - "Área = anchura × altura: para que siga en uno, la altura es 1/w."
    solucion: "w = 0,25 s: altura 4."
    comprobar:
      - { con: { w_p: 0.25 }, h_p: 4, a_p: 1 }

  - id: pregunta-integral
    tipo: marcar
    titulo: "Escalón e impulso"
    texto: "La integral del pulso sube mientras dura el pulso. Marque en la curva naranja el instante en que llega a 1, el escalón ya completo."
    libro: [30]
    fijar: { w_p: 0.5 }
    widget:
      tipo: grafica
      x: { id: t, min: 0, max: 4, unidad: s, rotulo: "t", muestras: 1600 }
      y: { min: 0, max: 2.2, unidad: "", rotulo: "x(t)" }
      curvas:
        - { expr: "(min(max((t - 1)*1000000, 0), 1) - min(max((t - 1 - w_p)*1000000, 0), 1))/w_p", color: azul, rotulo: "pulso de área uno" }
        - { expr: "min(max((t - 1)/w_p, 0), 1)", color: naranja, rotulo: "su integral" }
      mandos: []
    marcar:
      modo: x
      curva: 1
      x: "t_e"
      tol: 0.02
      inicio: { x: 3, y: 1 }
      rotulo: "Donde la integral llega a 1"
      pasos: 80
    pistas:
      - { cuando: { valor: marca_x, menor: 1.4 }, texto: "Ahí el pulso aún no ha terminado: la integral sigue subiendo." }
      - { texto: "Ahí ya lleva tiempo en 1: marque donde deja de subir." }
    exito: "En {{t_e}}, al acabar el pulso: el área completa es el escalón. Por eso la respuesta al escalón es la integral de la respuesta al impulso."
    escalera:
      - "La integral deja de subir cuando el pulso vuelve a cero."
    solucion: "En {{t_e}}: el pulso empieza en 1 s y dura {{w_p}}."
    comprobar:
      - { t_e: 1.5 }

  - id: porque-escalon
    tipo: marcar
    titulo: "La señal de prueba más rentable"
    texto: "Una sola captura del escalón enseña rapidez, sobreoscilación y amortiguamiento. Marque el pico de la sobreoscilación."
    nota: "Un sistema de segundo orden de ejemplo."
    libro: [28, 32, 33]
    widget:
      tipo: grafica
      x: { id: t, min: 0, max: 3, unidad: s, rotulo: "t", muestras: 900 }
      y: { min: 0, max: 1.6, unidad: "", rotulo: "salida" }
      curvas:
        - { expr: "1 - exp(-z_e*w_n*t)*(cos(w_n*sqrt(1 - z_e^2)*t) + z_e/sqrt(1 - z_e^2)*sin(w_n*sqrt(1 - z_e^2)*t))", color: azul, rotulo: "respuesta al escalón" }
        - { expr: "1", color: tinta, rotulo: "valor final", discontinua: true }
      mandos: []
    marcar:
      modo: x
      curva: 0
      x: "t_pk"
      tol: 0.03
      inicio: { x: 2.5, y: 1 }
      rotulo: "El pico"
      pasos: 120
    pistas:
      - { cuando: { valor: marca_x, menor: 0.4 }, texto: "Ahí la salida aún sube: el pico viene después." }
      - { texto: "Ahí ya está bajando o asentándose: el pico es antes." }
    exito: "Ese pico es la sobreoscilación; lo que tarda en subir, la rapidez; cómo se apagan las oscilaciones, el amortiguamiento. Todo de una captura."
    escalera:
      - "Busque el punto más alto de la curva."
    solucion: "En {{t_pk}}, el máximo de la curva."
    comprobar:
      - { t_pk: 0.524, tol: 0.01 }

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [4, 10, 15, 18, 30, 32]
    ideas:
      - { titulo: "Dos ejes.", texto: "Tiempo continuo o discreto y amplitud continua o cuantificada: la digital es discreta en ambos." }
      - { titulo: "Información.", texto: "Lo impredecible: una señal con datos se parece al ruido." }
      - { titulo: "Espectro.", texto: "Periódica, de líneas; un pulso aislado, continuo. La FFT supone periodicidad." }
      - { titulo: "Escalón.", texto: "La integral del impulso y la señal de prueba más rentable." }
