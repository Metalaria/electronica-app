# Lección 1.2 de la sección 29.5 «La Transformada Z» (cap30, sec-30.5). Formato: GUIA.md.
# - El filtro del bloque 146, y[n] = a·x[n] + (1 − a)·y[n − 1], con su polo en z = 1 − a (bloques 149 y 150). Respuesta
#   al escalón en las muestras: 1 − (1 − a)^(n + 1), retenida entre ellas (n = floor(t)). Los valores de a son de
#   ejemplo.
# - El experimento del banco (bloque 174) con un par de polos r·e^(±jθ): su modo natural r^n·cos(θ·n), retenido. θ = 30°
#   es de ejemplo. El plano z con el círculo unidad como dos semicurvas (sqrt(max(0, 1 − x²))).
# - El ejercicio 29.4 (polos en 0,8 y 1,2).
# Paso práctico: «ajuste» del módulo del polo hasta el círculo unidad (un oscilador, bloque 159).
leccion: cap30/sec-30.5

libro:
  139: "la herramienta equivalente es la transformada Z"
  140: 'X lr(( z )) = "Σ" x lr([ n ]) dot.op z^(- n)'
  142: "un retardo de una muestra ⟷ multiplicar por z⁻¹"
  146: 'y lr([ n ]) = a dot.op x lr([ n ])'
  148: 'Y lr(( z )) = a dot.op X lr(( z ))'
  149: "H(z) = a / (1 − (1−a)·z⁻¹)"
  150: "Un polo en z = 1−a"
  152: "en Z, sobre el círculo unidad"
  153: 'z = "e"^(j ω dot.op T)'
  154: "Recorrer ese círculo una vuelta completa equivale a recorrer las frecuencias de cero a la de muestreo"
  155: "Esa es la explicación geométrica del aliasing"
  158: "Todos los polos dentro del círculo unidad"
  159: "Un polo justo sobre el círculo es un oscilador; fuera, la salida crece sin límite"
  160: "al cuantificar los coeficientes, los polos se desplazan"
  161: "Es la razón de descomponer en secciones de segundo orden"
  163: "lleva el semiplano izquierdo dentro del círculo unidad"
  164: "Su precio es la compresión de frecuencias"
  167: "Polos cerca del círculo: resonancias pronunciadas a esa frecuencia"
  168: "Ceros sobre el círculo: rechazo total a esa frecuencia"
  169: "Polos cerca del origen: respuesta rápida y poco selectiva"
  170: "Ángulo: la frecuencia a la que afecta"
  171: "colocando un par de ceros exactamente en el ángulo correspondiente a 50 Hz"
  174: "acercar deliberadamente un polo al círculo unidad subiendo un coeficiente"
  175: "los polos dentro del círculo unidad garantizan la estabilidad"
  "cap30#350": "Un filtro digital tiene un polo en z = 0,8 y otro en z = 1,2"

modelo:
  valores:
    a_f: { sim: "a", nombre: "coeficiente del filtro", unidad: "", valor: 0.3 }
    r_p: { sim: "r", nombre: "módulo de los polos", unidad: "", valor: 0.8 }
    th_p: { sim: "θ", nombre: "ángulo de los polos de ejemplo", unidad: "°", valor: 30 }
  calculos:
    p_z: { expr: "1 - a_f", sim: "z_{p}", nombre: "polo del filtro", unidad: "", cifras: 2 }

tarjetas:
  - id: explore-polo
    tipo: explorar
    titulo: "Un filtro y su polo"
    texto: "El filtro y[n] = a·x[n] + (1 − a)·y[n − 1] ante un escalón. Cambie a y mire dónde queda su polo, z = 1 − a."
    nota: "Valores de a de ejemplo."
    libro: [146, 150, 169]
    widget:
      tipo: grafica
      x: { id: k, min: 0, max: 20, unidad: "", rotulo: "n" }
      y: { min: 0, max: 1.1, unidad: "", rotulo: "y[n]" }
      curvas:
        - { expr: "1 - (1 - a_f)^(floor(k) + 1)", color: naranja, rotulo: "respuesta al escalón" }
      lectura: { valor: p_z, rotulo: "Polo en z" }
      mandos:
        - { valor: a_f, lista: [0.1, 0.3, 0.6, 0.9], rotulo: "Coeficiente, a" }
    requiere: { mover: [a_f] }

  - id: formula-hz
    tipo: formula
    titulo: "La función de transferencia discreta"
    texto: "Un retardo de una muestra es multiplicar por z⁻¹: la ecuación en diferencias se vuelve algebraica. Despejando, H(z) = a / (1 − (1 − a)·z⁻¹)."
    libro: [140, 142, 148, 149, 150]
    ec: 148
    sustitucion: "z_{p} = 1 − {{a_f}} = {{p_z}}"
    widget:
      tipo: grafica
      x: { id: x, min: -1.2, max: 1.2, unidad: "", rotulo: "parte real de z" }
      y: { min: -1.2, max: 1.2, unidad: "", rotulo: "parte imaginaria de z" }
      curvas:
        - { expr: "sqrt(max(0, 1 - x^2))", color: tinta, rotulo: "círculo unidad", discontinua: true }
        - { expr: "-sqrt(max(0, 1 - x^2))", color: tinta, rotulo: "círculo unidad", discontinua: true }
      marcas:
        - { x: "p_z", y: "0", rotulo: "polo" }
      lectura: { valor: p_z, rotulo: "Polo en z" }
      mandos:
        - { valor: a_f, lista: [0.1, 0.3, 0.6, 0.9], rotulo: "Coeficiente, a" }

  - id: empareje-planos
    tipo: pregunta
    titulo: "De Laplace a Z"
    texto: "Empareje cada idea del dominio continuo con su equivalente discreto."
    libro: [139, 152, 158, 163]
    widget:
      tipo: figura
      figura: fig-30.10
      zonas:
        - { id: todo, rotulo: "El plano Z y el círculo unidad", rect: [0, 0, 289, 267] }
    emparejar:
      - ["Ecuación diferencial", "Ecuación en diferencias"]
      - ["Eje imaginario", "Círculo unidad"]
      - ["Semiplano izquierdo", "Dentro del círculo unidad"]
      - ["Laplace", "Transformada Z"]
    exito: "La transformación bilineal lleva el semiplano izquierdo dentro del círculo: conserva la estabilidad."
    pistas:
      - { texto: "La respuesta en frecuencia se evalúa en el eje imaginario en s y en el círculo unidad en z." }
    escalera:
      - "Empiece por las herramientas: ¿qué transformada usa cada dominio?"
    solucion: "Diferencial, en diferencias; eje imaginario, círculo; semiplano izquierdo, dentro del círculo; Laplace, Z."

  - id: explore-plano
    tipo: explorar
    titulo: "Un par de polos en el plano z"
    texto: "Dos polos conjugados de ejemplo, a ±30°. Cambie su módulo: el ángulo dice a qué frecuencia afectan; la cercanía al círculo, cuánto."
    libro: [167, 170, 175]
    widget:
      tipo: grafica
      x: { id: x, min: -1.2, max: 1.2, unidad: "", rotulo: "parte real de z" }
      y: { min: -1.2, max: 1.2, unidad: "", rotulo: "parte imaginaria de z" }
      curvas:
        - { expr: "sqrt(max(0, 1 - x^2))", color: tinta, rotulo: "círculo unidad", discontinua: true }
        - { expr: "-sqrt(max(0, 1 - x^2))", color: tinta, rotulo: "círculo unidad", discontinua: true }
      marcas:
        - { x: "r_p*cos(th_p*pi/180)", y: "r_p*sin(th_p*pi/180)", rotulo: "polo" }
        - { x: "r_p*cos(th_p*pi/180)", y: "-r_p*sin(th_p*pi/180)", rotulo: "polo" }
      lectura: { valor: r_p, rotulo: "Módulo de los polos" }
      mandos:
        - { valor: r_p, lista: [0.5, 0.8, 0.95], rotulo: "Módulo, r" }
    requiere: { mover: [r_p] }
    comprobar:
      - { th_p: 30 }

  - id: ajuste-oscilador
    tipo: ajuste
    titulo: "Acerque el polo al círculo"
    texto: "La respuesta al impulso de esos dos polos. Suba su módulo hasta que el filtro oscile solo, sin apagarse ni crecer."
    libro: [159, 174]
    inicio: { r_p: 0.8 }
    widget:
      tipo: grafica
      x: { id: k, min: 0, max: 40, unidad: "", rotulo: "n" }
      y: { min: -4, max: 4, unidad: "", rotulo: "h[n]" }
      curvas:
        - { expr: "r_p^floor(k)*cos(th_p*pi/180*floor(k))", color: naranja, rotulo: "respuesta al impulso" }
      lectura: { valor: r_p, rotulo: "Módulo de los polos" }
      mandos:
        - { valor: r_p, min: 0.5, max: 1.03, paso: 0.01, rotulo: "Módulo, r" }
    ajuste:
      valor: r_p
      min: 0.995
      max: 1.005
      rotulo: "Módulo de los polos"
      escala: { min: 0.5, max: 1.05 }
      bajo: "La oscilación se apaga: el polo sigue dentro del círculo. Súbalo."
      alto: "La salida crece sin límite: el polo ha salido del círculo. Bájelo."
      dentro: "Sobre el círculo: un oscilador. Cuanto más cerca de él, más resonante era el filtro."

  - id: predecir-estable
    tipo: predecir
    titulo: "Dos polos, uno fuera"
    texto: "Un filtro digital tiene un polo en z = 0,8 y otro en z = 1,2. ¿Es estable?"
    libro: [158, 159, "cap30#350"]
    widget:
      tipo: figura
      figura: fig-30.10
      zonas:
        - { id: todo, rotulo: "El plano Z y el círculo unidad", rect: [0, 0, 289, 267] }
    opciones:
      - texto: "No: el polo en 1,2 está fuera del círculo unidad"
        bien: true
        porque: "Basta un polo fuera: su modo crece como 1,2ⁿ, sin límite."
      - texto: "Sí: uno de los dos está dentro"
        porque: "La condición es para todos los polos; uno fuera basta para que la salida crezca."
      - texto: "Sí, porque los dos son reales y positivos"
        porque: "Ser real no salva nada: lo que cuenta es el módulo, y 1,2 es mayor que 1."
    escalera:
      - "Mire el módulo de cada polo frente a 1."
    solucion: "No: estable exige todos los polos dentro, y 1,2 está fuera."

  - id: pregunta-vuelta
    tipo: pregunta
    titulo: "Una vuelta al círculo"
    texto: "Recorrer el círculo unidad una vuelta completa es recorrer las frecuencias de cero a la de muestreo. ¿Qué le pasa a una frecuencia por encima de Nyquist?"
    libro: [153, 154, 155]
    widget:
      tipo: figura
      figura: fig-30.10
      zonas:
        - { id: todo, rotulo: "El plano Z y el círculo unidad", rect: [0, 0, 289, 267] }
    opciones:
      - texto: "Vuelve a caer sobre el mismo círculo, encima de otra frecuencia: el aliasing"
        bien: true
        porque: "Es la explicación geométrica del aliasing, y muestra por qué es irreversible."
      - texto: "Cae fuera del círculo y el filtro se vuelve inestable"
        porque: "Las frecuencias siempre están sobre el círculo; fuera solo pueden estar los polos."
      - texto: "Desaparece: el plano z no la representa"
        porque: "Sí la representa, pero en el mismo punto que una frecuencia más baja: ahí está el problema."
    escalera:
      - "z = e^{jωT}: ¿qué pasa con el ángulo cuando ωT pasa de una vuelta?"
    solucion: "Da otra vuelta y cae sobre una frecuencia legítima: el aliasing."

  - id: empareje-lectura
    tipo: pregunta
    titulo: "Leer el diagrama sin calcular"
    texto: "Empareje cada configuración con lo que hace el filtro."
    libro: [167, 168, 169, 170, 171]
    widget:
      tipo: figura
      figura: fig-30.10
      zonas:
        - { id: todo, rotulo: "El plano Z y el círculo unidad", rect: [0, 0, 289, 267] }
    emparejar:
      - ["Polos cerca del círculo", "Resonancia pronunciada"]
      - ["Ceros sobre el círculo", "Rechazo total a esa frecuencia"]
      - ["Polos cerca del origen", "Respuesta rápida y poco selectiva"]
      - ["El ángulo", "La frecuencia a la que afecta"]
    exito: "Un notch de red: dos ceros en el ángulo de 50 Hz y dos polos algo más adentro para estrechar la banda."
    pistas:
      - { texto: "Un cero anula; un polo realza." }
    escalera:
      - "Distancia al círculo, cuánto; ángulo, dónde."
    solucion: "Polos al borde, resonancia; ceros en el círculo, rechazo; polos en el origen, rápido; ángulo, la frecuencia."

  - id: porque-secciones
    tipo: porque
    titulo: "El filtro que cambia al programarlo"
    texto: "Un IIR funciona en el ordenador y es inestable en el microcontrolador. ¿Por qué se descompone en secciones de segundo orden?"
    libro: [160, 161]
    widget:
      tipo: figura
      figura: fig-30.11
      zonas:
        - { id: todo, rotulo: "Polos desplazados al cuantificar", rect: [0, 0, 437, 196] }
    opciones:
      - texto: "Al cuantificar los coeficientes los polos se mueven; en secciones de segundo orden se mueven mucho menos"
        bien: true
        porque: "Un polo muy cerca del círculo puede quedar fuera al redondear; las secciones lo hacen menos sensible."
      - texto: "Porque las secciones de segundo orden calculan más deprisa"
        porque: "El motivo no es la velocidad, sino la sensibilidad de los polos al redondeo."
      - texto: "Porque el microcontrolador no admite filtros de orden alto"
        porque: "Los admite; lo que falla es la posición de los polos con coeficientes redondeados."
    escalera:
      - "¿Qué les pasa a los coeficientes al guardarlos con menos bits?"
    solucion: "Para que el redondeo desplace poco los polos."

  - id: porque-bilineal
    tipo: porque
    titulo: "Un filtro estable sigue estable"
    texto: "La transformación bilineal convierte un filtro analógico estable en uno digital siempre estable. ¿Por qué?"
    libro: [163, 164]
    widget:
      tipo: figura
      figura: fig-30.10
      zonas:
        - { id: todo, rotulo: "El plano Z y el círculo unidad", rect: [0, 0, 289, 267] }
    opciones:
      - texto: "Lleva todo el semiplano izquierdo de s dentro del círculo unidad"
        bien: true
        porque: "Los polos estables caen dentro del círculo. Su precio es la compresión de frecuencias, que corrige el preajuste."
      - texto: "Porque muestrea la respuesta al impulso"
        porque: "Eso es la invarianza al impulso, que además sufre aliasing; la bilineal es un mapeo de planos."
      - texto: "Porque no tiene polos"
        porque: "Los conserva, pero los lleva dentro del círculo."
    escalera:
      - "¿Dónde están los polos estables en s, y adónde van?"
    solucion: "Mapea el semiplano izquierdo dentro del círculo unidad."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [142, 150, 154, 158, 167]
    ideas:
      - { titulo: "z⁻¹.", texto: "Un retardo de una muestra: la ecuación en diferencias se vuelve algebraica." }
      - { titulo: "El círculo unidad.", texto: "Hace de eje imaginario; una vuelta va de cero a f_{s}." }
      - { titulo: "Estabilidad.", texto: "Todos los polos dentro; sobre el círculo, un oscilador." }
      - { titulo: "Leer el plano.", texto: "Ángulo, la frecuencia; cercanía al círculo, la resonancia." }
