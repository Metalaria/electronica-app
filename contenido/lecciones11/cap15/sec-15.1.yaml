# Lección de la sección 14.1 «El Protoboard: Estructura Interna» (cap15; etiqueta interna sec-15.1).
# Formato: contenido/lecciones11/GUIA.md. El circuito es el raíl de 3,3 V del bloque 11 que llega al integrado por
# cinco contactos de 50 mΩ (la tabla del bloque 10); el consumo del integrado se dibuja como la resistencia que da
# 10 mA, 100 mA o 1 A. El contacto gastado de 1 Ω de la sorpresa es un ejemplo de «puede subir a ohmios» (bloque 8).
# El banco usa 30 mΩ por contacto, el centro de los 10 a 50 mΩ de una placa nueva (ficha 4 del cuaderno).
# 1.2.1 (aprender haciendo): subir el consumo hasta perder 250 mV, calcular la caída a 100 mA, tocar en la figura 15.3
# el corte del raíl y los puentes, gastar los contactos, calcular la capacidad entre filas, tocar lo que no se monta y
# medir en el banco. Dos preguntas: «funciona a veces» y la red.
# 1.2.1, segunda pasada: sin listas de respuestas disfrazadas; quedan las tarjetas que se hacen y dos preguntas.
leccion: cap15/sec-15.1

libro:
  13: "Los parásitos, con números"
  15: "Inductancia por contacto y tira"
  17: "Qué se puede y qué no se puede montar"
  23: "Alimentar los dos lados de los raíles partidos, con puentes"
  29: "Estructura interna de un protoboard con sus raíles partidos"
  4: "Un protoboard es un bloque de plástico con centenares de"
  9: "Las consecuencias son proporcionales a la corriente"
  5: "El canal central tiene la anchura exacta de un encapsulado DIP"
  8: "Cada contacto tiene una resistencia de 10 a 50 mΩ cuando el protoboard es nuevo."
  10: "Con cinco contactos en el camino"
  11: "un raíl de 3,3 V que pierde 250 mV por el camino puede dejar de alimentar correctamente"
  12: "la primera sospecha debe ser el propio protoboard"
  14: "Capacidad entre filas adyacentes: 2 a 5 pF."
  16: "por encima de unos 10 MHz un protoboard deja de comportarse como un conjunto de nodos ideales"
  18: "Cualquier cosa con tensión de red"
  19: "los contactos están accesibles con el dedo y no hay ninguna barrera de seguridad"
  24: "abren los clips permanentemente y estropean esa fila para siempre"
  27: "medir la tensión de alimentación en los pines del integrado, no en el raíl"
  "cap15#310": "Las columnas centrales están conectadas verticalmente en grupos de cinco orificios"

modelo:
  valores:
    C_f: { sim: "C", nombre: "capacidad entre filas adyacentes", unidad: F, valor: 3.5e-12 }
    V_s: { sim: "V", nombre: "raíl de alimentación", unidad: V, valor: 3.3 }
    r_c: { sim: "r_{c}", nombre: "resistencia de cada contacto", unidad: Ω, valor: 0.05 }
    N_c: { sim: "N", nombre: "contactos en el camino", unidad: "", valor: 5 }
    I_t: { sim: "I", nombre: "consumo del integrado", unidad: A, valor: 0.01 }
  calculos:
    R_cc: { expr: "N_c*r_c", sim: "R_{contactos}", nombre: "los contactos del camino", unidad: Ω }
    R_L: { expr: "V_s/I_t - R_cc", sim: "R_{chip}", nombre: "consumo del integrado", unidad: Ω }
    I_p: { expr: "V_s/(R_cc + R_L)", sim: "I", nombre: "corriente", unidad: A }
    V_c: { expr: "I_p*R_cc", sim: "V_{contactos}", nombre: "caída en los contactos", unidad: V }
    V_chip: { expr: "I_p*R_L", sim: "V_{pines}", nombre: "tensión en los pines del integrado", unidad: V }

tarjetas:
  - id: explore-contactos
    tipo: explorar
    titulo: "Cinco contactos en el camino"
    texto: "El raíl de 3,3 V llega al integrado por cinco contactos de 50 mΩ. Suba el consumo hasta que los contactos se coman más de 200 mV."
    libro: [10, 11]
    fijar: { r_c: 0.05 }
    widget:
      tipo: circuito
      esquema: serie
      piezas: { fuente: V_s, r1: R_cc, r2: R_L }
      lectura: { valor: V_c, rotulo: "Caída en los contactos" }
      datos:
        - { valor: V_chip, rotulo: "En los pines: {{V_chip}}" }
      corriente: I_p
      mide: { corriente: I_p, v1: V_c, v2: V_chip }
      mandos:
        - { valor: I_t, lista: [0.01, 0.1, 1], rotulo: "Consumo" }
    inicio: { I_t: 0.01 }
    objetivo:
      condiciones:
        - { valor: V_c, min: 0.2, rotulo: "Caída: {{V_c}}" }
      logrado: "Con {{I_p}}, {{V_c}} se quedan en los contactos: el raíl de 3,3 V llega al chip con {{V_chip}}. No es para cientos de miliamperios."
      pistas:
        - { texto: "Suba el consumo." }
    escalera:
      - "La caída es proporcional a la corriente."
    solucion: "Con 1 A: 250 mV en los contactos."

  - id: prediga-amperio
    tipo: simular
    titulo: "Con cien miliamperios"
    texto: "El integrado consume 100 mA a través de cinco contactos de 50 mΩ. ¿Cuánto se pierde por el camino?"
    libro: [9, 10]
    fijar: { r_c: 0.05, I_t: 0.1 }
    simular:
      objetivo: V_c
      unidad: V
      tol: 0.03
      rotulo: "Caída en los contactos"
      errores:
        - { expr: "r_c*I_t", texto: "Eso es un solo contacto: en el camino hay cinco." }
        - { expr: "N_c*r_c*0.01", texto: "Eso sería con 10 mA: aquí son 100 mA." }
    exito: "25 mV: un circuito de señal no lo nota; uno de cientos de miliamperios, sí."
    escalera:
      - "Cinco contactos en serie: 5 · 50 mΩ, por la corriente."
    solucion: "5 · 50 mΩ · 100 mA = 25 mV."
    comprobar:
      - { V_c: 0.025, R_cc: 0.25 }

  - id: estructura
    tipo: tocar
    titulo: "El raíl partido"
    texto: "La mitad derecha del montaje se ha quedado sin alimentación. Toque, en el raíl de abajo, dónde está el corte."
    libro: [4, 5, 24, 29, "cap15#310"]
    widget:
      tipo: figura
      figura: fig-15.3
      zonas:
        - { id: puentes, rotulo: "Arcos verdes, arriba", rect: [118, 24, 44, 36] }
        - { id: canal, rotulo: "Franja gris del centro", rect: [60, 118, 120, 36] }
        - { id: fila, rotulo: "Columna de la izquierda, arriba", rect: [8, 66, 36, 56] }
        - { id: corte, rotulo: "Centro del raíl de abajo", rect: [122, 204, 40, 36] }
    tocar:
      bien: [corte]
      porque:
        puentes: "Esos son los puentes que unen las mitades del raíl de arriba: ahí ya está resuelto."
        canal: "Es el canal central: separa las filas, no los raíles."
        fila: "Es una fila de cinco orificios: no lleva la alimentación a lo largo. Y una patilla gruesa abriría sus clips para siempre."
    exito: "Los raíles de muchos modelos están partidos por la mitad: el fallo de montaje más frecuente. Se alimentan los dos lados con puentes."
    escalera:
      - "Busque la interrupción de la línea roja y azul."
    solucion: "El corte, en el centro del raíl de abajo."

  - id: puentes
    tipo: tocar
    titulo: "La solución del raíl"
    texto: "Toque lo que une las dos mitades del raíl de arriba."
    libro: [23, 29]
    widget:
      tipo: figura
      figura: fig-15.3
      zonas:
        - { id: puentes, rotulo: "Arcos verdes, arriba", rect: [118, 24, 44, 36] }
        - { id: canal, rotulo: "Franja gris del centro", rect: [60, 118, 120, 36] }
        - { id: corte, rotulo: "Centro del raíl de abajo", rect: [122, 204, 40, 36] }
    tocar:
      bien: [puentes]
      porque:
        corte: "Ese es el corte del raíl de abajo, todavía sin puentear."
        canal: "El canal central separa las dos mitades de las filas."
    exito: "Dos puentes cortos, uno por raíl. Y antes de encender, se comprueba con el multímetro que llega a los dos lados."
    escalera:
      - "Busque los arcos que saltan el hueco del centro."
    solucion: "Los arcos verdes del raíl de arriba."

  - id: sorpresa-gastado
    tipo: sorpresa
    titulo: "Un contacto gastado"
    texto: "Con el uso los clips se abren y su resistencia puede subir a ohmios. Desgaste los contactos a 100 mA y compare la caída con la de antes."
    nota: "El contacto de 1 Ω es un ejemplo."
    libro: [8, 11]
    fijar: { I_t: 0.1 }
    inicio: { r_c: 0.05 }
    widget:
      tipo: circuito
      esquema: serie
      piezas: { fuente: V_s, r1: R_cc, r2: R_L }
      lectura: { valor: V_chip, rotulo: "En los pines del integrado" }
      datos:
        - { valor: V_c, rotulo: "Caída: {{V_c}}" }
      corriente: I_p
      mide: { corriente: I_p, v1: V_c, v2: V_chip }
      mandos:
        - { valor: r_c, lista: [0.05, 1], nombres: [nuevo, gastado], rotulo: "Cada contacto" }
    objetivo:
      condiciones:
        - { valor: V_c, min: 0.4, rotulo: "Caída: {{V_c}}" }
      logrado: "Con los contactos gastados, {{V_c}} a solo 100 mA: veinte veces más que nuevos."
      pistas:
        - { texto: "Desgaste los contactos." }
    escalera:
      - "Gastados, cada contacto puede subir a ohmios."
    solucion: "Gastados: 0,5 V de caída."

  - id: funciona-a-veces
    tipo: pregunta
    titulo: "Funciona a veces"
    texto: "Un montaje en protoboard falla y vuelve a funcionar al tocarlo. ¿Qué sospecha primero?"
    libro: [12]
    fijar: { r_c: 0.05, I_t: 0.1 }
    widget:
      tipo: circuito
      esquema: serie
      piezas: { fuente: V_s, r1: R_cc, r2: R_L }
      lectura: { valor: V_chip, rotulo: "En los pines del integrado" }
      mide: { corriente: I_p, v1: V_c, v2: V_chip }
    opciones:
      - texto: "El propio protoboard: un contacto intermitente"
        bien: true
        porque: "Esas averías consumen horas buscando un fallo de diseño que no existe."
      - texto: "Un error en el esquema"
        porque: "Un error de diseño no aparece y desaparece al tocar el montaje."
      - texto: "Que el integrado está defectuoso"
        porque: "Antes que el chip, el soporte: es lo que cambia al tocarlo."
    escalera:
      - "¿Qué cambia cuando se toca el montaje?"
    solucion: "El propio protoboard."

  - id: capacidad-filas
    tipo: simular
    titulo: "Entre dos filas vecinas"
    texto: "¿Qué capacidad hay entre dos filas adyacentes de un protoboard?"
    libro: [13, 14]
    simular:
      objetivo: C_f
      unidad: F
      tol: 0.43
      rotulo: "Capacidad entre filas"
      errores:
        - { expr: "3.5e-11", texto: "Diez veces menos: son unos pocos picofaradios." }
        - { expr: "3.5e-9", texto: "Eso son nanofaradios: entre filas hay picofaradios." }
    exito: "De 2 a 5 pF: poco, y suficiente para acoplar señales rápidas o cargar una entrada de alta impedancia."
    escalera:
      - "Unos pocos picofaradios."
    solucion: "De 2 a 5 pF."
    comprobar:
      - { C_f: 3.5e-12 }

  - id: por-que-red
    tipo: porque
    titulo: "¿Por qué nunca la red?"
    texto: "Un montaje con tensión de red en protoboard podría funcionar. ¿Por qué no se hace nunca?"
    libro: [19]
    fijar: { r_c: 0.05, I_t: 0.1 }
    widget:
      tipo: circuito
      esquema: serie
      piezas: { fuente: V_s, r1: R_cc, r2: R_L }
      lectura: { valor: V_chip, rotulo: "En los pines del integrado" }
      mide: { corriente: I_p, v1: V_c, v2: V_chip }
    opciones:
      - texto: "Sin aislamiento entre filas, contactos al alcance del dedo y ninguna barrera"
        bien: true
        porque: "Es una cuestión de seguridad, no de prestaciones."
      - texto: "Porque los contactos se calientan"
        porque: "El motivo es el aislamiento y el contacto accesible, no la temperatura."
      - texto: "Porque la red tiene demasiada frecuencia"
        porque: "Los 50 Hz no son el problema: lo es la tensión con contactos expuestos."
    escalera:
      - "¿Qué protege al usuario de tocar un contacto en un protoboard?"
    solucion: "Sin aislamiento ni barrera: peligro."

  - id: banco-pines
    tipo: banco
    titulo: "En los pines, no en el raíl"
    texto: "Con un consumo de 100 mA, mida la alimentación en el raíl y en los pines del integrado. La diferencia es la caída en los contactos."
    libro: [27, 8]
    fijar: { r_c: 0.03, I_t: 0.1, N_c: 5 }
    banco:
      piezas: ["Protoboard nueva", "Fuente de 3,3 V con límite de corriente", "Una carga de unos 100 mA", "Brymen en mV⎓"]
      medir: "La tensión del raíl menos la de los pines del integrado."
      esperado: V_c
      unidad: V
      tol: 0.67
      consejos:
        - { cuando: { valor: desviacion, mayor: 0.67 }, texto: "Cae de más: algún contacto está gastado. Cambie de fila y vuelva a medir." }
        - { texto: "Cae muy poco: compruebe que mide en los pines del chip y no al lado del raíl." }
      ficha: { n: 4, titulo: "Comprobar la protoboard: raíles, filas y contactos" }
    comprobar:
      - { V_c: 0.015 }

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [5, 8, 12, 18, 15, 16, 17]
    ideas:
      - { titulo: "La estructura.", texto: "Filas de cinco, un canal del ancho de un DIP y raíles a menudo partidos." }
      - { titulo: "Los contactos.", texto: "De 10 a 50 mΩ nuevos: la caída crece con la corriente." }
      - { titulo: "Funciona a veces.", texto: "La primera sospecha es el propio protoboard." }
      - { titulo: "Nunca la red.", texto: "Sin aislamiento ni barrera: nada conectado a la red." }
