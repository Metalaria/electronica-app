# Lección 1.2 de la sección 14.10 «Criterios Cuantitativos» (cap15; etiqueta sec-15.10).
# Formato: contenido/lecciones11/GUIA.md. La gráfica es v = L·ΔI/Δt (sección 14.6, cap15#147) con los números del
# bloque 265: 100 nH de un cable de 10 cm y un pico de 100 mA en 100 ns, 100 mV. Los flancos de 10 ns y 1 µs del mando
# son un EJEMPLO para ver la proporción. El banco es la medida de la resistencia de contacto de la ficha 4: 30 mΩ,
# el centro de los 10 a 50 mΩ de la tabla (bloque 263).
leccion: cap15/sec-15.10

libro:
  263: "~100 nH"
  264: "la capacidad y la inductancia son las que limitan, no la resistencia"
  265: "un pico de corriente de 100 mA en 100 ns produce 100 mV de caída"
  268: "comprobando que ninguno supera el amperio"
  270: "nada debería pasar de unos 250 mW"
  273: "Más de 1 MΩ de impedancia en un nodo sensible."
  274: "es una fuente de conclusiones falsas"
  276: "Placa perforada con islas"
  279: "Con una fuente de corriente conocida y midiendo la caída en un contacto, sale la resistencia real."
  280: "un montaje que funcionaba deja de hacerlo al cabo de meses"
  "cap15#147": 'v = L dot.op (d i)/(d t)'

modelo:
  valores:
    L_w: { sim: "L", nombre: "inductancia del cable", unidad: H, valor: 100e-9 }
    dI_w: { sim: "ΔI", nombre: "pico de corriente", unidad: A, valor: 0.1 }
    dt_w: { sim: "Δt", nombre: "duración del pico", unidad: s, valor: 1e-6 }
    R_k: { sim: "R_{contacto}", nombre: "resistencia de un contacto", unidad: Ω, valor: 0.03 }
  calculos:
    v_w: { expr: "L_w*dI_w/dt_w", sim: "v", nombre: "caída en el cable", unidad: V }

tarjetas:
  - id: explore-cable
    tipo: explorar
    titulo: "Un cable de 10 cm"
    texto: "Un cable de 10 cm tiene unos 100 nH. Pida un pico de 100 mA cada vez más rápido y mire la caída."
    nota: "Los flancos de 10 ns y 1 µs son un ejemplo."
    libro: [263, 265]
    widget:
      tipo: grafica
      x: { id: tt, min: 1e-9, max: 1e-5, unidad: s, rotulo: "Δt", escala: log }
      y: { min: 0, max: 1.2, unidad: V, rotulo: "caída" }
      curvas:
        - { expr: "min(1.2, L_w*dI_w/tt)", color: naranja, rotulo: "caída en el cable" }
      marcas:
        - { x: "dt_w", y: "v_w", rotulo: "Su pico" }
      lectura: { valor: v_w, rotulo: "Caída en el cable" }
      mandos:
        - { valor: dt_w, lista: [1e-6, 1e-7, 1e-8], rotulo: "Duración del pico" }
    requiere: { mover: [dt_w] }

  - id: prediga-limita
    tipo: predecir
    titulo: "Lo que de verdad limita"
    texto: "En la tabla de límites del protoboard, ¿qué es lo que limita?"
    libro: [264]
    fijar: { dt_w: 1e-7 }
    widget:
      tipo: grafica
      x: { id: tt, min: 1e-9, max: 1e-5, unidad: s, rotulo: "Δt", escala: log }
      y: { min: 0, max: 1.2, unidad: V, rotulo: "caída" }
      curvas:
        - { expr: "min(1.2, L_w*dI_w/tt)", color: naranja, rotulo: "caída en el cable" }
      lectura: { valor: v_w, rotulo: "Caída en el cable" }
      ocultar: true
    opciones:
      - texto: "La capacidad y la inductancia, no la resistencia"
        bien: true
        porque: "Con 5 pF entre filas y un nodo de alta impedancia, o 100 nH en un cable, las cuentas salen enseguida."
      - texto: "La resistencia de los contactos"
        porque: "Importa con corriente alta, pero la tabla dice que limitan la capacidad y la inductancia."
      - texto: "La tensión máxima de 50 V"
        porque: "Es un límite razonable de seguridad, no el que limita el comportamiento."
    escalera:
      - "Los parásitos que dependen de la velocidad de las señales."
    solucion: "La capacidad y la inductancia."
    comprobar:
      - { v_w: 0.1 }

  - id: formula-cable
    tipo: formula
    titulo: "La caída en el cable"
    texto: "La tensión de una inductancia sigue a lo rápido que cambia la corriente. Cambie la duración del pico."
    libro: ["cap15#147", 265]
    ec: "cap15#147"
    sustitucion: "{{L_w}} · {{dI_w}} / {{dt_w}} = {{v_w}}"
    widget:
      tipo: grafica
      x: { id: tt, min: 1e-9, max: 1e-5, unidad: s, rotulo: "Δt", escala: log }
      y: { min: 0, max: 1.2, unidad: V, rotulo: "caída" }
      curvas:
        - { expr: "min(1.2, L_w*dI_w/tt)", color: naranja, rotulo: "caída en el cable" }
      marcas:
        - { x: "dt_w", y: "v_w", rotulo: "Su pico" }
      lectura: { valor: v_w, rotulo: "Caída" }
      mandos:
        - { valor: dt_w, lista: [1e-6, 1e-7, 1e-8], rotulo: "Duración del pico" }
    comprobar:
      - { con: { dt_w: 1e-7 }, v_w: 0.1 }

  - id: limites
    tipo: pregunta
    fase: "Empareje"
    titulo: "Los límites medibles"
    texto: "Una cada magnitud con su valor típico en un protoboard."
    libro: [263]
    emparejar:
      - ["Resistencia de contacto", "10 a 50 mΩ, y crece con el uso"]
      - ["Capacidad entre filas adyacentes", "2 a 5 pF"]
      - ["Inductancia de un cable de 10 cm", "Unos 100 nH"]
      - ["Corriente, si importa la caída", "Menos de 200 mA"]
      - ["Frecuencia práctica", "Unos 10 MHz"]
      - ["Tensión razonable", "Hasta 50 V"]
    exito: "Conocerlos evita atribuir al circuito lo que es del montaje."
    pistas:
      - { texto: "Los picofaradios son de la capacidad; los nanohenrios, del cable." }
    escalera:
      - "La resistencia de contacto se mide en miliohmios."
    solucion: "Contacto: 10–50 mΩ; filas: 2–5 pF; cable: 100 nH; 200 mA; 10 MHz; 50 V."

  - id: disipacion
    tipo: pregunta
    titulo: "Sin disipador"
    texto: "En protoboard no hay disipador. ¿Hasta cuánta disipación debería llegar cada componente?"
    libro: [270, 268]
    fijar: { dt_w: 1e-7 }
    widget:
      tipo: grafica
      x: { id: tt, min: 1e-9, max: 1e-5, unidad: s, rotulo: "Δt", escala: log }
      y: { min: 0, max: 1.2, unidad: V, rotulo: "caída" }
      curvas:
        - { expr: "min(1.2, L_w*dI_w/tt)", color: naranja, rotulo: "caída en el cable" }
    opciones:
      - texto: "Unos 250 mW"
        bien: true
        porque: "Y ningún contacto debería llevar más de un amperio."
      - texto: "Varios vatios, como un regulador"
        porque: "Eso pide disipador: no se monta así en protoboard."
      - texto: "No hay límite si hay aire"
        porque: "Sin disipador, nada debería pasar de unos 250 mW."
    escalera:
      - "Es del orden de un cuarto de vatio."
    solucion: "Unos 250 mW."

  - id: umbrales
    tipo: pregunta
    titulo: "Los umbrales que descartan la protoboard"
    texto: "¿Cuál de estos circuitos SÍ se puede probar en protoboard?"
    libro: [273]
    fijar: { dt_w: 1e-7 }
    widget:
      tipo: grafica
      x: { id: tt, min: 1e-9, max: 1e-5, unidad: s, rotulo: "Δt", escala: log }
      y: { min: 0, max: 1.2, unidad: V, rotulo: "caída" }
      curvas:
        - { expr: "min(1.2, L_w*dI_w/tt)", color: naranja, rotulo: "caída en el cable" }
    opciones:
      - texto: "Un sensor lento que consume unos miliamperios"
        bien: true
        porque: "No cae en ningún umbral: ni rápido, ni de corriente, ni de alta impedancia."
      - texto: "Un nodo sensible de más de 1 MΩ"
        porque: "Más de 1 MΩ en un nodo sensible es uno de los umbrales."
      - texto: "Una señal útil de menos de 1 mV"
        porque: "También es un umbral: el montaje la estropea."
      - texto: "Flancos de menos de 20 ns"
        porque: "Es un umbral: el rebote aparece a cualquier reloj."
    escalera:
      - "Busque el único que no es rápido, ni débil, ni de alta impedancia."
    solucion: "El sensor lento."

  - id: por-que-falsas
    tipo: porque
    titulo: "¿Por qué conclusiones falsas?"
    texto: "Si un circuito cae en un umbral, montarlo en protoboard no es una simplificación. ¿Por qué?"
    libro: [274]
    fijar: { dt_w: 1e-8 }
    widget:
      tipo: grafica
      x: { id: tt, min: 1e-9, max: 1e-5, unidad: s, rotulo: "Δt", escala: log }
      y: { min: 0, max: 1.2, unidad: V, rotulo: "caída" }
      curvas:
        - { expr: "min(1.2, L_w*dI_w/tt)", color: naranja, rotulo: "caída en el cable" }
      lectura: { valor: v_w, rotulo: "Caída en el cable" }
    opciones:
      - texto: "Porque se mide el montaje y no el circuito: los parásitos dominan"
        bien: true
        porque: "Lo que se observa lo ponen los parásitos, y se atribuye al diseño."
      - texto: "Porque los componentes se estropean"
        porque: "No se estropean: el resultado engaña."
      - texto: "Porque el protoboard es caro"
        porque: "Es barato; lo costoso es la conclusión falsa."
    escalera:
      - "¿Qué está midiendo realmente cuando los parásitos dominan?"
    solucion: "Se mide el montaje, no el circuito."

  - id: alternativa
    tipo: pregunta
    titulo: "Cuando la protoboard se queda corta"
    texto: "El circuito supera los límites y no se justifica una placa fabricada. ¿Qué paso es el natural?"
    libro: [276]
    widget:
      tipo: grafica
      x: { id: tt, min: 1e-9, max: 1e-5, unidad: s, rotulo: "Δt", escala: log }
      y: { min: 0, max: 1.2, unidad: V, rotulo: "caída" }
      curvas:
        - { expr: "min(1.2, L_w*dI_w/tt)", color: naranja, rotulo: "caída en el cable" }
    opciones:
      - texto: "Placa perforada con islas"
        bien: true
        porque: "Elimina los contactos de pinza, reduce mucho capacidad e inductancia y conserva la flexibilidad."
      - texto: "Otra protoboard más grande"
        porque: "Tiene los mismos contactos y parásitos."
      - texto: "Cables de puente más largos y ordenados"
        porque: "Más largos, más inductancia."
    escalera:
      - "¿Qué soporte suelda los contactos y sigue siendo de prototipo?"
    solucion: "La placa perforada con islas."

  - id: banco-contacto
    tipo: banco
    titulo: "La resistencia de un contacto"
    texto: "Haga pasar 100 mA por una fila y mida la caída en un contacto. Divida para obtener su resistencia."
    libro: [279, 280, 263]
    banco:
      piezas: ["Protoboard nueva y, si tiene, una gastada", "Hilo rígido del calibre adecuado", "Fuente con límite de 100 mA", "Brymen en mV⎓ y en A"]
      medir: "La caída en el contacto dividida entre la corriente."
      esperado: R_k
      unidad: Ω
      tol: 0.67
      consejos:
        - { cuando: { valor: desviacion, mayor: 0.67 }, texto: "Sale de más: es un contacto gastado; en una protoboard vieja suele ser un orden de magnitud más." }
        - { texto: "Sale de menos: use REL para anular las puntas y mida justo sobre la placa." }
      ficha: { n: 4, titulo: "Comprobar la protoboard: raíles, filas y contactos" }
    comprobar:
      - { R_k: 0.03 }

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [263, 264, 270, 273]
    ideas:
      - { titulo: "Los límites.", texto: "10 a 50 mΩ, 2 a 5 pF, 100 nH por cable, 200 mA, 10 MHz y 50 V." }
      - { titulo: "Lo que limita.", texto: "La capacidad y la inductancia, no la resistencia." }
      - { titulo: "Antes de montar.", texto: "Consumo, corriente por contacto, desacoplo y no más de 250 mW." }
      - { titulo: "Los umbrales.", texto: "Rápido, más de 1 A, alta impedancia, RF o menos de 1 mV: a placa." }
