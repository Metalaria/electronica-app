# Lección de la sección 14.10 «Criterios Cuantitativos» (cap15; etiqueta sec-15.10).
# Formato: contenido/lecciones11/GUIA.md. La gráfica es v = L·ΔI/Δt (sección 14.6, cap15#147) con los números del
# bloque 265: 100 nH de un cable de 10 cm y un pico de 100 mA en 100 ns, 100 mV. Los flancos de 10 ns y 1 µs del mando
# son un EJEMPLO para ver la proporción. El banco es la medida de la resistencia de contacto de la ficha 4: 30 mΩ,
# el centro de los 10 a 50 mΩ de la tabla (bloque 263). 1.2.1 (aprender haciendo): acortar el pico hasta 1 V de
# caída, leer la de 100 ns, tocar lo que limita, el cálculo de la disipación y los umbrales que descartan, y el banco.
# Dos preguntas: qué limita de verdad y por qué conclusiones falsas.
# 1.2.1, segunda pasada: sin listas de respuestas disfrazadas; quedan las tarjetas que se hacen y dos preguntas.
# 1.3 (contenido13b): +calcular la caída de 1 A en un contacto de 50 mΩ (tabla del bloque 263) y +reto de la
# resistencia que no pasa de 250 mW sin disipador (bloque 270, con los 12 V de la sección 1.1): 3/5 → 5/7.
leccion: cap15/sec-15.10

libro:
  260: "Los números del montaje en protoboard"
  261: "Una protoboard tiene límites concretos, y conocerlos evita"
  262: "Los límites medibles"
  266: "Los cálculos que hay que hacer antes de montar"
  267: "Consumo total, para elegir la fuente y su límite (sección"
  269: "Desacoplo"
  271: "Los umbrales que descartan la protoboard"
  272: "Y son los de la sección 14.6, con números"
  275: "La alternativa intermedia"
  263: "~100 nH"
  264: "la capacidad y la inductancia son las que limitan, no la resistencia"
  265: "un pico de corriente de 100 mA en 100 ns produce 100 mV de caída"
  268: "comprobando que ninguno supera el amperio"
  270: "nada debería pasar de unos 250 mW"
  273: "Más de 1 MΩ de impedancia en un nodo sensible."
  274: "es una fuente de conclusiones falsas"
  276: "Placa perforada con islas"
  279: "Con una fuente de corriente conocida y midiendo la caída en un contacto, sale la resistencia real."
  280: "un montaje que funcionaba deja de hacerlo al cabo de meses"
  "cap15#147": 'v = L dot.op (d i)/(d t)'
  "cap01#33": "Una resistencia de 220 Ω se conecta a una fuente de 12 V."

modelo:
  valores:
    L_w: { sim: "L", nombre: "inductancia del cable", unidad: H, valor: 100e-9 }
    dI_w: { sim: "ΔI", nombre: "pico de corriente", unidad: A, valor: 0.1 }
    dt_w: { sim: "Δt", nombre: "duración del pico", unidad: s, valor: 1e-6 }
    R_k: { sim: "R_{contacto}", nombre: "resistencia de un contacto", unidad: Ω, valor: 0.03 }
    R_kp: { sim: "R_{contacto}", nombre: "resistencia de un contacto gastado", unidad: Ω, valor: 0.05 }
    I_k: { sim: "I", nombre: "corriente por el contacto", unidad: A, valor: 1 }
    V_r: { sim: "V", nombre: "tensión de la fuente", unidad: V, valor: 12 }
    R_r: { sim: "R", nombre: "resistencia", unidad: Ω, valor: 220 }
  calculos:
    v_w: { expr: "L_w*dI_w/dt_w", sim: "v", nombre: "caída en el cable", unidad: V }
    v_k: { expr: "I_k*R_kp", sim: "v_{contacto}", nombre: "caída en el contacto", unidad: V }
    I_r: { expr: "V_r/R_r", sim: "I", nombre: "corriente de la resistencia", unidad: A }
    P_r: { expr: "V_r^2/R_r", sim: "P", nombre: "potencia disipada", unidad: W }

tarjetas:
  - id: explore-cable
    tipo: explorar
    titulo: "Un cable de 10 cm"
    texto: "Un cable de 10 cm tiene unos 100 nH. Acorte el pico de 100 mA hasta que la caída llegue a 1 V."
    nota: "Los flancos de 10 ns y 1 µs son un ejemplo."
    libro: [263, 265]
    widget:
      tipo: grafica
      x: { id: tt, min: 1e-9, max: 1e-5, unidad: s, rotulo: "Δt", escala: log }
      y: { min: 0, max: 1.2, unidad: V, rotulo: "caída" }
      curvas:
        - { expr: "min(1.2, L_w*dI_w/tt)", color: naranja, rotulo: "caída en el cable" }
      marcas:
        - { x: "dt_w", y: "v_w", rotulo: "Su pico" }
      lectura: { valor: v_w, rotulo: "Caída en el cable" }
      mandos:
        - { valor: dt_w, lista: [1e-6, 1e-7, 1e-8], rotulo: "Duración del pico" }
    inicio: { dt_w: 1e-6 }
    objetivo:
      condiciones:
        - { valor: v_w, min: 0.9, rotulo: "Caída: {{v_w}}" }
      logrado: "Con un pico de {{dt_w}}, el cable de 10 cm se come {{v_w}}: la inductancia, no la resistencia, es la que limita."
      pistas:
        - { texto: "Haga el pico más rápido." }
    escalera:
      - "La caída es L·ΔI/Δt: crece al acortar el pico."
    solucion: "Con 10 ns, 1 V."

  - id: prediga-limita
    tipo: predecir
    titulo: "Lo que de verdad limita"
    texto: "En la tabla de límites del protoboard, ¿qué es lo que limita?"
    libro: [264]
    fijar: { dt_w: 1e-7 }
    widget:
      tipo: grafica
      x: { id: tt, min: 1e-9, max: 1e-5, unidad: s, rotulo: "Δt", escala: log }
      y: { min: 0, max: 1.2, unidad: V, rotulo: "caída" }
      curvas:
        - { expr: "min(1.2, L_w*dI_w/tt)", color: naranja, rotulo: "caída en el cable" }
      lectura: { valor: v_w, rotulo: "Caída en el cable" }
      ocultar: true
    opciones:
      - texto: "La capacidad y la inductancia, no la resistencia"
        bien: true
        porque: "Con 5 pF entre filas y un nodo de alta impedancia, o 100 nH en un cable, las cuentas salen enseguida."
      - texto: "La resistencia de los contactos"
        porque: "Importa con corriente alta, pero la tabla dice que limitan la capacidad y la inductancia."
      - texto: "La tensión máxima de 50 V"
        porque: "Es un límite razonable de seguridad, no el que limita el comportamiento."
    escalera:
      - "Los parásitos que dependen de la velocidad de las señales."
    solucion: "La capacidad y la inductancia."
    comprobar:
      - { v_w: 0.1 }

  - id: formula-cable
    tipo: leer
    titulo: "La caída en el cable"
    texto: "v = L·ΔI/Δt. Lea en la gráfica la caída que produce en el cable de 10 cm un pico de 100 mA en 100 ns."
    libro: ["cap15#147", 265]
    fijar: { dt_w: 1e-7 }
    widget:
      tipo: grafica
      x: { id: tt, min: 1e-9, max: 1e-5, unidad: s, rotulo: "Δt", escala: log }
      y: { min: 0, max: 1.2, unidad: V, rotulo: "caída" }
      curvas:
        - { expr: "min(1.2, L_w*dI_w/tt)", color: naranja, rotulo: "caída en el cable" }
      mandos: []
    leer:
      objetivo: v_w
      unidad: V
      tol: 0.05
      rotulo: "Caída en el cable"
      errores:
        - { expr: "L_w*dI_w/1e-8", texto: "Esa es la de 10 ns: busque 100 ns, una década más a la derecha." }
    exito: "100 mV: 100 nH · 100 mA / 100 ns."
    escalera:
      - "Busque 100 ns en el eje logarítmico y suba hasta la curva."
    solucion: "100 mV."
    comprobar:
      - { con: { dt_w: 1e-7 }, v_w: 0.1 }

  - id: calcule-contacto
    tipo: simular
    titulo: "Un amperio por un contacto"
    texto: "Un contacto gastado de 50 mΩ, el peor de la tabla, lleva 1 A, el máximo absoluto. ¿Cuánto cae en él?"
    libro: [263, 268]
    fijar: { I_k: 1, R_kp: 0.05 }
    simular:
      objetivo: v_k
      unidad: V
      tol: 0.03
      rotulo: "Caída en el contacto"
      errores:
        - { expr: "I_k/R_kp", texto: "Ha dividido: la caída es I·R." }
        - { expr: "I_k*R_kp*1000", texto: "Revise el prefijo: 50 mΩ son 0,05 Ω." }
    exito: "{{v_k}} en un solo contacto, y crece con el uso. Por eso, si importa la caída, mejor por debajo de 200 mA."
    escalera:
      - "Ley de Ohm: v = I·R."
    solucion: "1 A · 0,05 Ω = 50 mV."
    comprobar:
      - { v_k: 0.05 }

  - id: reto-disipacion
    tipo: reto
    titulo: "Reto: sin disipador"
    texto: "En el protoboard no hay disipador. Con 12 V, elija la resistencia más pequeña de la E12 que no pase de unos 250 mW."
    libro: [270, "cap01#33"]
    fijar: { V_r: 12 }
    inicio: { R_r: 220 }
    widget:
      tipo: circuito
      esquema: resistencia
      piezas: { fuente: V_r, r: R_r }
      lectura: { valor: P_r, rotulo: "Potencia" }
      corriente: I_r
      mide: { corriente: I_r, tension: V_r }
      mandos:
        - { valor: R_r, serie: E12, min: 100, max: 10000, rotulo: "R (E12)" }
    condiciones:
      - { valor: P_r, max: 0.25, rotulo: "Potencia: {{P_r}}" }
    exito: "680 Ω: {{P_r}}. La de 220 Ω del libro disipa 0,655 W: en el protoboard se quemaría sin donde evacuar el calor."
    pistas:
      - { texto: "Disipa más de 250 mW: suba R." }
    escalera:
      - "P = V²/R: a más resistencia, menos potencia."
    solucion: "La E12 de 680 Ω: 212 mW."
    comprobar:
      - { con: { R_r: 680 }, P_r: 0.2118 }
      - { P_r: 0.6545 }

  - id: por-que-falsas
    tipo: porque
    titulo: "¿Por qué conclusiones falsas?"
    texto: "Si un circuito cae en un umbral, montarlo en protoboard no es una simplificación. ¿Por qué?"
    libro: [274]
    fijar: { dt_w: 1e-8 }
    widget:
      tipo: grafica
      x: { id: tt, min: 1e-9, max: 1e-5, unidad: s, rotulo: "Δt", escala: log }
      y: { min: 0, max: 1.2, unidad: V, rotulo: "caída" }
      curvas:
        - { expr: "min(1.2, L_w*dI_w/tt)", color: naranja, rotulo: "caída en el cable" }
      lectura: { valor: v_w, rotulo: "Caída en el cable" }
    opciones:
      - texto: "Porque se mide el montaje y no el circuito: los parásitos dominan"
        bien: true
        porque: "Lo que se observa lo ponen los parásitos, y se atribuye al diseño."
      - texto: "Porque los componentes se estropean"
        porque: "No se estropean: el resultado engaña."
      - texto: "Porque el protoboard es caro"
        porque: "Es barato; lo costoso es la conclusión falsa."
    escalera:
      - "¿Qué está midiendo realmente cuando los parásitos dominan?"
    solucion: "Se mide el montaje, no el circuito."

  - id: banco-contacto
    tipo: banco
    titulo: "La resistencia de un contacto"
    texto: "Haga pasar 100 mA por una fila y mida la caída en un contacto. Divida para obtener su resistencia."
    libro: [279, 280, 263]
    banco:
      piezas: ["Protoboard nueva y, si tiene, una gastada", "Hilo rígido del calibre adecuado", "Fuente con límite de 100 mA", "Brymen en mV⎓ y en A"]
      medir: "La caída en el contacto dividida entre la corriente."
      esperado: R_k
      unidad: Ω
      tol: 0.67
      consejos:
        - { cuando: { valor: desviacion, mayor: 0.67 }, texto: "Sale de más: es un contacto gastado; en una protoboard vieja suele ser un orden de magnitud más." }
        - { texto: "Sale de menos: use REL para anular las puntas y mida justo sobre la placa." }
      ficha: { n: 4, titulo: "Comprobar la protoboard: raíles, filas y contactos" }
    comprobar:
      - { R_k: 0.03 }

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [263, 264, 270, 273, 260, 261, 262, 266, 267, 268, 269, 271, 272, 275, 276]
    ideas:
      - { titulo: "Los límites.", texto: "10 a 50 mΩ, 2 a 5 pF, 100 nH por cable, 200 mA, 10 MHz y 50 V." }
      - { titulo: "Lo que limita.", texto: "La capacidad y la inductancia, no la resistencia." }
      - { titulo: "Antes de montar.", texto: "Consumo, corriente por contacto, desacoplo y no más de 250 mW." }
      - { titulo: "Los umbrales.", texto: "Rápido, más de 1 A, alta impedancia, RF o menos de 1 mV: a placa." }
