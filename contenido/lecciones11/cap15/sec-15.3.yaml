# Lección 1.2 de la sección 14.3 «Proyecto 2: Amplificador de Audio con LM386» (cap15; etiqueta sec-15.3).
# Formato: contenido/lecciones11/GUIA.md. La gráfica es la salida sobre 8 Ω con los números del libro: ganancia 20
# (26 dB) o 200 con 10 µF entre las patillas 1 y 8, y recorte a unos 6 V pico a pico con 9 V (medio vatio: 6²/(8·8) =
# 0,56 W). La señal de prueba es una senoide de 1 kHz (la de la ficha 6) con amplitudes de entrada de EJEMPLO (5, 15,
# 50 y 150 mV de pico); el recorte se dibuja como un corte limpio en ±3 V. El LM386 se dibuja con el esquema
# «ao-no-inversor» como bloque de ganancia (R₁ = 1 kΩ y R₂ de 19 o 199 kΩ, de EJEMPLO: dan 20 y 200) con V_sat = 3 V;
# sin su nivel de continua V_s/2 ni el condensador de salida: la señal va centrada en 0.
leccion: cap15/sec-15.3

libro:
  59: "Alimentación, entrada por un potenciómetro, un condensador de acoplo a la salida y el altavoz."
  61: "Ganancia 200 poniendo un condensador de 10 µF entre las patillas 1 y 8."
  62: "con 9 V de alimentación, la excursión útil es de unos 6 V pico a pico"
  64: "una resistencia de realimentación fija que establece la ganancia 20"
  65: "El condensador no aporta ganancia: quita realimentación"
  68: "una resistencia de unos 10 Ω en serie con un condensador de 47 nF"
  69: "Su función es estabilizar el amplificador ante una carga inductiva."
  70: "Omitirla es la causa más frecuente de que un LM386 oscile"
  72: "necesita un electrolítico grande y un cerámico junto a la patilla de alimentación"
  73: "La entrada y la salida deben tener retornos separados que se unan en un solo punto."
  74: "a ganancia 200 es notable"
  75: "Distorsión al subir el volumen, que es el recorte esperado."
  81: "comprobando el factor diez"
  "cap15#61": "Ganancia 20 por defecto, es decir, 26 dB."

modelo:
  valores:
    c_18: { tipo: interruptor, nombre: "condensador de 10 µF entre 1 y 8", valor: 0 }
    v_i: { sim: "v_{entrada}", nombre: "amplitud de la entrada", unidad: V, valor: 0.015 }
    V_cl: { sim: "V_{máx}", nombre: "pico de la salida al recorte", unidad: V, valor: 3 }
    R_L: { sim: "R_{L}", nombre: "altavoz", unidad: Ω, valor: 8 }
    f_s: { sim: "f", nombre: "frecuencia de la señal", unidad: Hz, valor: 1000 }
    cero_g: { sim: "0", nombre: "nivel de continua", unidad: V, valor: 0 }
    R1_g: { sim: "R₁", nombre: "resistencia interna a masa", unidad: Ω, valor: 1000 }
  calculos:
    R2_g: { expr: "19000 + 180000*c_18", sim: "R₂", nombre: "realimentación efectiva", unidad: Ω }
    G: { expr: "1 + R2_g/R1_g", sim: "G", nombre: "ganancia", unidad: "" }
    G_db: { expr: "20*log10(G)", sim: "G", nombre: "ganancia en decibelios", unidad: dB }
    A_o: { expr: "min(V_cl, G*v_i)", sim: "V_{p}", nombre: "pico de la salida", unidad: V }
    P_o: { expr: "A_o^2/(2*R_L)", sim: "P", nombre: "potencia en el altavoz", unidad: W }
    P_x: { expr: "(2*V_cl)^2/(8*R_L)", sim: "P_{máx}", nombre: "potencia al recorte", unidad: W }

tarjetas:
  - id: explore-ganancia
    tipo: explorar
    titulo: "Ganancia 20, o 200"
    texto: "Ponga el condensador entre las patillas 1 y 8 y cambie la entrada. Mire la salida sobre el altavoz."
    nota: "El LM386 como bloque de ganancia, sin su continua de media alimentación. Entradas de ejemplo."
    libro: [59, 61, "cap15#61"]
    widget:
      tipo: circuito
      esquema: ao-no-inversor
      piezas: { entrada: cero_g, amplitud: v_i, f: f_s, r1: R1_g, r2: R2_g, vsat: V_cl }
      grafica:
        x: { id: t, min: 0, max: 0.002, unidad: s, rotulo: "t" }
        y: { min: -4, max: 4, unidad: V, rotulo: "salida" }
        curvas:
          - { expr: "max(-V_cl, min(V_cl, G*v_i*sin(2*pi*f_s*t)))", color: naranja, rotulo: "salida", mide: salida }
      lectura: { valor: G, rotulo: "Ganancia" }
      datos:
        - { valor: A_o, rotulo: "Pico de salida: {{A_o}}" }
      mandos:
        - { valor: c_18, tipo: interruptor, rotulo: "10 µF entre 1 y 8" }
        - { valor: v_i, lista: [0.005, 0.015, 0.05, 0.15], rotulo: "Entrada (pico)" }
    requiere: { mover: [c_18, v_i] }

  - id: prediga-condensador
    tipo: predecir
    titulo: "Qué hace el condensador"
    texto: "Con 10 µF entre las patillas 1 y 8 la ganancia pasa de 20 a 200. ¿Qué hace el condensador?"
    libro: [64, 65]
    fijar: { c_18: 1, v_i: 0.005 }
    widget:
      tipo: circuito
      esquema: ao-no-inversor
      piezas: { entrada: cero_g, amplitud: v_i, f: f_s, r1: R1_g, r2: R2_g, vsat: V_cl }
      grafica:
        x: { id: t, min: 0, max: 0.002, unidad: s, rotulo: "t" }
        y: { min: -4, max: 4, unidad: V, rotulo: "salida" }
        curvas:
          - { expr: "max(-V_cl, min(V_cl, G*v_i*sin(2*pi*f_s*t)))", color: naranja, rotulo: "salida", mide: salida }
      lectura: { valor: G, rotulo: "Ganancia" }
      ocultar: true
    opciones:
      - texto: "Cortocircuita en alterna parte de la red de realimentación: quita realimentación"
        bien: true
        porque: "No aporta ganancia: reduce la realimentación, y la ganancia en lazo cerrado sube."
      - texto: "Aporta ganancia, como una etapa más"
        porque: "Un condensador no amplifica: lo que hace es quitar realimentación."
      - texto: "Filtra los graves"
        porque: "No cambia la forma de la señal en audio: cambia cuánto se realimenta."
    escalera:
      - "Entre 1 y 8 hay accesible una parte de la red de realimentación interna."
    solucion: "Quita realimentación."

  - id: estime-db
    tipo: pregunta
    fase: "Estime"
    titulo: "La ganancia en decibelios"
    texto: "Sin condensador entre 1 y 8, la ganancia es 20. ¿Cuántos decibelios son?"
    libro: ["cap15#61"]
    fijar: { c_18: 0 }
    estimar:
      objetivo: "G_db"
      unidad: dB
      min: 0
      max: 60
      paso: 1
      inicio: 50
      tol: 0.04
      rotulo: "Ganancia"
    exito: "26 dB: 20 · log₁₀ 20. Con 200, 46 dB."
    pistas:
      - { cuando: { valor: estimacion, mayor: 27 }, texto: "Se ha pasado: 20 veces son 20 · log₁₀ 20." }
      - { texto: "Se ha quedado corto: 20 veces en tensión son más de 20 dB." }
    escalera:
      - "En tensión, G en dB = 20 · log₁₀ G."
    solucion: "26 dB."
    comprobar:
      - { G_db: 26.0, tol: 0.003 }
      - { con: { c_18: 1 }, G_db: 46.0, tol: 0.003 }

  - id: estime-potencia
    tipo: pregunta
    fase: "Estime"
    titulo: "Medio vatio"
    texto: "Con 9 V la salida recorta en unos 6 V pico a pico sobre 8 Ω. ¿Qué potencia da en ese punto?"
    libro: [62]
    estimar:
      objetivo: "P_x"
      unidad: W
      min: 0
      max: 3
      paso: 0.01
      inicio: 2.5
      tol: 0.08
      rotulo: "Potencia al recorte"
    exito: "0,56 W: 6² / (8 · 8). Alrededor de medio vatio."
    pistas:
      - { cuando: { valor: estimacion, mayor: 0.61 }, texto: "Se ha pasado: con pico a pico, P = V_{pp}² / (8 · R_{L})." }
      - { texto: "Se ha quedado corto: con el valor pico a pico, P = V_{pp}² / (8 · R_{L})." }
    escalera:
      - "Use el valor pico a pico al cuadrado, entre ocho veces la carga."
    solucion: "6² / (8 · 8) = 0,56 W."
    comprobar:
      - { P_x: 0.5625, tol: 0.003 }

  - id: sorpresa-recorte
    tipo: sorpresa
    titulo: "Subir el volumen"
    texto: "Con ganancia 200, suba la entrada. La salida no pasa de unos 6 V pico a pico."
    libro: [75, 62]
    fijar: { c_18: 1 }
    inicio: { v_i: 0.005 }
    widget:
      tipo: circuito
      esquema: ao-no-inversor
      piezas: { entrada: cero_g, amplitud: v_i, f: f_s, r1: R1_g, r2: R2_g, vsat: V_cl }
      grafica:
        x: { id: t, min: 0, max: 0.002, unidad: s, rotulo: "t" }
        y: { min: -4, max: 4, unidad: V, rotulo: "salida" }
        curvas:
          - { expr: "max(-V_cl, min(V_cl, G*v_i*sin(2*pi*f_s*t)))", color: naranja, rotulo: "salida", mide: salida }
      lectura: { valor: A_o, rotulo: "Pico de salida" }
      datos:
        - { valor: P_o, rotulo: "Potencia: {{P_o}}" }
      mandos:
        - { valor: v_i, lista: [0.005, 0.015, 0.05, 0.15], rotulo: "Entrada (pico)" }
    requiere: { mover: [v_i] }

  - id: por-que-diez
    tipo: porque
    titulo: "¿Por qué exactamente diez veces?"
    texto: "La ganancia no sube a un valor cualquiera: pasa de 20 a 200. ¿Por qué?"
    libro: [64, 65]
    fijar: { c_18: 1, v_i: 0.005 }
    widget:
      tipo: circuito
      esquema: ao-no-inversor
      piezas: { entrada: cero_g, amplitud: v_i, f: f_s, r1: R1_g, r2: R2_g, vsat: V_cl }
      grafica:
        x: { id: t, min: 0, max: 0.002, unidad: s, rotulo: "t" }
        y: { min: -4, max: 4, unidad: V, rotulo: "salida" }
        curvas:
          - { expr: "max(-V_cl, min(V_cl, G*v_i*sin(2*pi*f_s*t)))", color: naranja, rotulo: "salida", mide: salida }
      lectura: { valor: G, rotulo: "Ganancia" }
    opciones:
      - texto: "Porque lo fija la red de realimentación interna, no el condensador"
        bien: true
        porque: "El condensador solo cortocircuita una parte de la red; el factor sale de esa red."
      - texto: "Porque el condensador es de 10 µF"
        porque: "Su valor solo debe ser grande para el audio; el factor lo pone la red interna."
      - texto: "Porque el altavoz es de 8 Ω"
        porque: "La carga no fija la ganancia: la fija la realimentación."
    escalera:
      - "Con una resistencia en serie con el condensador se obtienen valores intermedios: ¿qué se está cambiando?"
    solucion: "Lo fija la red de realimentación."

  - id: boucherot
    tipo: pregunta
    titulo: "La red de Boucherot"
    texto: "En la salida hay 10 Ω en serie con 47 nF hacia masa. ¿Para qué sirve?"
    libro: [68, 69, 70]
    fijar: { c_18: 0, v_i: 0.015 }
    widget:
      tipo: circuito
      esquema: ao-no-inversor
      piezas: { entrada: cero_g, amplitud: v_i, f: f_s, r1: R1_g, r2: R2_g, vsat: V_cl }
      grafica:
        x: { id: t, min: 0, max: 0.002, unidad: s, rotulo: "t" }
        y: { min: -4, max: 4, unidad: V, rotulo: "salida" }
        curvas:
          - { expr: "max(-V_cl, min(V_cl, G*v_i*sin(2*pi*f_s*t)))", color: naranja, rotulo: "salida", mide: salida }
    opciones:
      - texto: "Estabiliza el amplificador ante la carga inductiva del altavoz"
        bien: true
        porque: "Presenta una carga resistiva a alta frecuencia y restaura el margen de fase. Sin ella, el LM386 oscila."
      - texto: "Es un adorno: no cambia nada"
        porque: "Parece un adorno y no lo es: omitirla es la causa más frecuente de oscilación."
      - texto: "Sube la potencia de salida"
        porque: "No toca la potencia en audio: actúa a alta frecuencia."
    escalera:
      - "Un altavoz no es una resistencia: su impedancia sube con la frecuencia."
    solucion: "Estabiliza ante la carga inductiva."

  - id: problemas
    tipo: pregunta
    fase: "Empareje"
    titulo: "Los problemas característicos"
    texto: "Una cada síntoma con su causa."
    libro: [70, 72, 73, 74, 75]
    emparejar:
      - ["Oscilación", "Falta la red de Boucherot o el desacoplo"]
      - ["Zumbido", "Entrada y salida con el mismo retorno de masa"]
      - ["Ruido de fondo a ganancia 200", "Un integrado antiguo, no silencioso"]
      - ["Distorsión al subir el volumen", "El recorte esperado"]
    exito: "Masas separadas unidas en un punto, y desacoplo junto a la alimentación."
    pistas:
      - { texto: "El zumbido viene de la corriente de salida circulando por la masa de la entrada." }
    escalera:
      - "La distorsión al subir el volumen no es una avería."
    solucion: "Oscila: Boucherot o desacoplo; zumbido: masas; ruido: el chip; distorsión: recorte."

  - id: banco-ganancia
    tipo: banco
    titulo: "Mida la ganancia"
    texto: "Sin nada entre las patillas 1 y 8, mida la ganancia con una senoide de 1 kHz y la carga de 8 Ω."
    libro: [81, "cap15#61"]
    fijar: { c_18: 0 }
    banco:
      piezas: ["LM386 con 9 V", "Carga de 8 Ω", "Red de Boucherot y desacoplo", "FNIRSI: generador y dos canales"]
      medir: "La amplitud sobre la carga dividida entre la de la patilla de entrada."
      esperado: G
      unidad: ""
      tol: 0.15
      consejos:
        - { cuando: { valor: desviacion, mayor: 0.15 }, texto: "Sale de más: compruebe que no queda nada entre las patillas 1 y 8." }
        - { texto: "Sale de menos: mire si la salida recorta; baje la entrada hasta ver una senoide limpia." }
      ficha: { n: 6, titulo: "Amplificador de audio con LM386" }
    comprobar:
      - { G: 20 }

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [62, 65, 69, 73]
    ideas:
      - { titulo: "Ganancia.", texto: "20 por defecto; 200 con 10 µF entre 1 y 8, que quita realimentación." }
      - { titulo: "Medio vatio.", texto: "Unos 6 V pico a pico sobre 8 Ω con 9 V." }
      - { titulo: "Estabilidad.", texto: "La red de Boucherot y el desacoplo evitan que oscile." }
      - { titulo: "Masas.", texto: "Retornos de entrada y salida separados, unidos en un punto." }
