# Lección 1.2 de la sección 16.11 «Depuración y Buenas Prácticas» (cap17; etiquetas sec-17.N = impresas 16.N).
# - El orden de depuración sin depurador de la figura 16.16 (fig-17.16).
# - La Ec. 1 del convertidor, V = analogRead·5 V/1023, como gráfica frente al código (0 a 1023), y la forma centrada
#   (k + 0,5)·V_ref/1024 del libro: difieren media LSB (±2,44 mV) en los extremos y nada en 512.
# 1.2.1 (autor121-sens, «aprender haciendo», GUIA §13): en la figura 16.16 se toca la pregunta sin responder (filas
# de 17.16.py: 37,4 px por paso); la Ec. 1 se explora hasta leer 1 V; se escribe la tensión de 512; en la gráfica de la
# diferencia se marca el código en que /1023 y la centrada coinciden (511,5); se escribe el error de una referencia de
# 4,8 V en el fondo de escala. El trazador serie pasa al resumen. Queda una pregunta de opciones: la masa común.
leccion: cap17/sec-17.11

libro:
  280: "el trazador serie (Serial Plotter) dibuja los valores como una gráfica en el tiempo"
  281: "La masa debe ser común a todo lo conectado"
  283: 'V_("entrada") = "analogRead" space lr(( "pin" )) times ("5 V")/("1023")'
  285: "Un ADC de 10 bits divide el margen de referencia en 1024 escalones, no 1023"
  288: 'V approx (lr(( k + "0,5" )) dot.op V_("ref"))/("1024")'
  290: "2,50244 V"
  291: "La diferencia es de ±2,44 mV, es decir, media LSB"
  292: "cerca del fondo de escala son unos 200 mV, ochenta veces más que la media LSB"
  294: "El orden de depuración sin depurador y el límite de la depuración por impresión."
  "cap17#342": "(512 × 5)/1023 = 2560/1023 = 2,50 V"

modelo:
  valores:
    k_a: { sim: "k", nombre: "código leído", unidad: "", valor: 300 }
    V_rf: { sim: "V_{ref}", nombre: "referencia", unidad: V, valor: 5 }
    V_rr: { sim: "V_{CC}", nombre: "referencia real", unidad: V, valor: 4.8 }
  calculos:
    V_a: { expr: "k_a*V_rf/1023", sim: "V_{entrada}", nombre: "tensión con /1023", unidad: V, cifras: 4 }
    V_c: { expr: "(k_a + 0.5)*V_rf/1024", sim: "V_{centrada}", nombre: "tensión centrada", unidad: V, cifras: 4 }
    d_v: { expr: "V_a - V_c", sim: "ΔV", nombre: "diferencia entre las dos", unidad: V, cifras: 3 }
    k_co: { expr: "1023*0.5/(1024 - 1023)", sim: "k_{0}", nombre: "código en que coinciden", unidad: "" }
    e_rf: { expr: "V_rf - V_rr", sim: "e", nombre: "error de la referencia en el fondo de escala", unidad: V }

tarjetas:
  - id: explore-orden
    tipo: explorar
    titulo: "Depurar sin depurador"
    texto: "Un orden de preguntas, de la alimentación al bus, y el límite de imprimir por serie. Toque las dos partes."
    libro: [280, 294]
    widget:
      tipo: figura
      figura: fig-17.16
      zonas:
        - { id: orden, rotulo: "Los seis pasos de la izquierda", rect: [0, 5, 190, 220], texto: "Alimentación y reset, arranque, por dónde pasa, cuánto tarda, qué valen las variables y qué sale por el bus." }
        - { id: limite, rotulo: "La gráfica de la derecha", rect: [262, 28, 184, 105], texto: "Enviar una línea por serie roba muchísimo más tiempo que poner un pin en alto." }
        - { id: aviso, rotulo: "Recuadro rojo, abajo a la derecha", rect: [280, 186, 150, 40], texto: "Si el fallo cambia al añadir una impresión, la impresión es parte del problema: use un pin de depuración." }
    requiere: { mover: [orden, aviso] }

  - id: ordene-depuracion
    tipo: tocar
    titulo: "El orden"
    texto: "La tensión en el propio chip es buena, pero el LED que se enciende en las primeras líneas no luce. Toque la pregunta que se ha quedado sin respuesta."
    libro: [294]
    widget:
      tipo: figura
      figura: fig-17.16
      zonas:
        - { id: p1, rotulo: "Primer paso", rect: [0, 3, 190, 35] }
        - { id: p2, rotulo: "Segundo paso", rect: [0, 40, 190, 35] }
        - { id: p3, rotulo: "Tercer paso", rect: [0, 77, 190, 35] }
        - { id: p4, rotulo: "Cuarto paso", rect: [0, 115, 190, 35] }
        - { id: p5, rotulo: "Quinto paso", rect: [0, 152, 190, 35] }
        - { id: p6, rotulo: "Sexto paso", rect: [0, 189, 190, 35] }
    tocar:
      bien: [p2]
      porque:
        p1: "Esa ya está respondida: la tensión en el chip es buena."
        p3: "Antes de saber por dónde pasa, hay que saber que el programa arranca."
        p4: "Medir tiempos no tiene sentido si el programa no arranca."
        p5: "Las variables vienen después: primero, que el programa corra."
        p6: "El bus es lo último: lo más fino."
    exito: "¿Arranca el programa? De lo más básico a lo más fino: sin arranque, nada de lo demás importa."
    escalera:
      - "Un LED en las primeras líneas responde a una sola pregunta."
    solucion: "El segundo paso: ¿arranca el programa?"

  - id: pregunta-masa
    tipo: pregunta
    titulo: "Buenas prácticas"
    texto: "Un sensor alimentado aparte da lecturas sin sentido aunque el programa está bien. ¿Qué falta?"
    libro: [281]
    widget:
      tipo: figura
      figura: fig-17.16
      zonas:
        - { id: orden, rotulo: "Los seis pasos de la izquierda", rect: [0, 5, 190, 220] }
    opciones:
      - texto: "Unir las masas"
        bien: true
        porque: "La masa debe ser común a todo lo conectado, o las señales no tendrán referencia."
      - texto: "Más Serial.print"
        porque: "Imprimir no da referencia a una señal: hace falta masa común."
      - texto: "Activar INPUT_PULLUP"
        porque: "Eso evita entradas al aire, pero sin masa común la señal sigue sin referencia."
    escalera:
      - "Una tensión siempre se mide respecto a algo."
    solucion: "Masa común."

  - id: formula-adc
    tipo: explorar
    titulo: "Del código a la tensión"
    texto: "La conversión que usan casi todos los programas de Arduino, de la Ec. 1. Mueva el código leído hasta que corresponda a 1 V."
    libro: [283]
    widget:
      tipo: grafica
      x: { id: cod, min: 0, max: 1023, unidad: "", rotulo: "analogRead" }
      y: { min: 0, max: 5, unidad: V, rotulo: "V_{entrada}" }
      curvas:
        - { expr: "cod*V_rf/1023", color: azul, rotulo: "/1023" }
      marcas:
        - { x: "k_a", y: "V_a", rotulo: "{{V_a}}" }
      lectura: { valor: V_a, rotulo: "Tensión de entrada" }
      mandos:
        - { valor: k_a, min: 0, max: 1023, paso: 1, rotulo: "Código, analogRead" }
    objetivo:
      condiciones:
        - { valor: V_a, objetivo: 1, tol: 0.004, rotulo: "Entrada: {{V_a}}" }
      logrado: "{{k_a}} · 5 V / 1023 = {{V_a}}: dividir entre 1023 hace que el código máximo corresponda exactamente a la referencia."
      pistas:
        - { cuando: { valor: V_a, mayor: 1 }, texto: "Se pasa: baje el código." }
        - { texto: "Le falta: suba el código." }
    escalera:
      - "1 V es la quinta parte de 5 V: la quinta parte de 1023."
    solucion: "Unos 205."
    comprobar:
      - { con: { k_a: 205 }, V_a: 1.002 }

  - id: estime-512
    tipo: leer
    titulo: "Lee 512"
    texto: "analogRead() devuelve 512 con referencia de 5 V. Escriba la tensión de la entrada con la Ec. 1."
    libro: ["cap17#342", 283]
    fijar: { k_a: 512 }
    widget:
      tipo: grafica
      x: { id: cod, min: 0, max: 1023, unidad: "", rotulo: "analogRead" }
      y: { min: 0, max: 5, unidad: V, rotulo: "V_{entrada}" }
      curvas:
        - { expr: "cod*V_rf/1023", color: azul, rotulo: "/1023" }
    leer:
      objetivo: V_a
      unidad: V
      tol: 0.004
      rotulo: "Tensión de entrada"
    exito: "2,50 V: la mitad del rango, la mitad de la referencia."
    escalera:
      - "512 es casi la mitad de 1023."
    solucion: "512 · 5 / 1023 = 2,50 V."
    comprobar:
      - { V_a: 2.5024 }

  - id: pregunta-1024
    tipo: marcar
    titulo: "¿1023 o 1024?"
    texto: "La curva es la diferencia entre la Ec. 1 (/1023) y la forma centrada, (k + 0,5)/1024. Marque el código en que coinciden."
    libro: [285, 288, 290, 291]
    widget:
      tipo: grafica
      x: { id: cod, min: 0, max: 1023, unidad: "", rotulo: "analogRead" }
      y: { min: -0.003, max: 0.003, unidad: V, rotulo: "ΔV" }
      curvas:
        - { expr: "cod*V_rf/1023 - (cod + 0.5)*V_rf/1024", color: naranja, rotulo: "/1023 menos centrada" }
    marcar:
      modo: x
      curva: 0
      x: k_co
      tol: 0.02
      inicio: { x: 100, y: 0 }
      rotulo: "Código en que coinciden"
    exito: "Hacia la mitad, en 512, coinciden; en los extremos difieren ±2,44 mV, media LSB, del orden del error de cuantificación: en la práctica da igual cuál se use."
    escalera:
      - "Busque dónde la curva cruza el cero."
    solucion: "Hacia el código 512: la tabla del libro da 0 ahí."
    comprobar:
      - { k_co: 511.5 }

  - id: porque-referencia
    tipo: leer
    titulo: "Lo que ninguna arregla"
    texto: "La referencia es VCC, que vale 4,8 V y no 5,0, y en el fondo de escala el programa lee 5 V. Escriba el error."
    libro: [292]
    widget:
      tipo: grafica
      x: { id: cod, min: 0, max: 1023, unidad: "", rotulo: "analogRead" }
      y: { min: 0, max: 5, unidad: V, rotulo: "V" }
      curvas:
        - { expr: "cod*5/1023", color: azul, rotulo: "con 5 V" }
        - { expr: "cod*4.8/1023", color: naranja, rotulo: "con 4,8 V reales" }
    leer:
      objetivo: e_rf
      unidad: V
      tol: 0.02
      rotulo: "Error en el fondo de escala"
      errores:
        - { expr: "0.00244", texto: "Esa es la diferencia entre las dos fórmulas; el error de la referencia es mucho mayor." }
    exito: "Unos 200 mV, ochenta veces la media LSB: el error real lo domina la referencia, no la fórmula. Use una referencia interna o externa."
    escalera:
      - "En el fondo de escala la entrada vale lo que valga la referencia real."
    solucion: "5,0 − 4,8 = 0,2 V: unos 200 mV."
    comprobar:
      - { e_rf: 0.2, V_rr: 4.8 }

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [280, 281, 291, 292]
    ideas:
      - { titulo: "Serial.print.", texto: "Mensajes en el monitor y gráficas en el trazador; y un orden para depurar." }
      - { titulo: "Buenas prácticas.", texto: "INPUT_PULLUP, masa común y aislar el fallo comentando código." }
      - { titulo: "/1023 o /1024.", texto: "Difieren media LSB: en la práctica, da igual." }
      - { titulo: "La referencia manda.", texto: "Con 4,8 V en vez de 5, un 4 %: unos 200 mV." }
