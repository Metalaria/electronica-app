# Lección 1.2 de la sección 16.8 «El Entorno y la Cadena de Herramientas» (cap17; etiquetas sec-17.N = impresas 16.N).
# - Las cuatro etapas de la cadena y el cargador de arranque sobre la figura 16.13 (fig-17.13), con zonas.
# - Sin modelo numérico.
# Paso práctico: «tocar» la pieza que escribe el programa en la Flash (el cargador de arranque).
# 1.2.1 (autor121-sens, «aprender haciendo», GUIA §13): en la figura 16.13 se tocan en orden las cuatro etapas, la
# que da «referencia no definida», el cargador y la línea TX/RX en la que estorba un módulo (zonas de 17.13.py, 3,6 px
# por unidad); se escribe el 70 % de los 2 KB de RAM; en un fragmento de biblioteca (propio, ilustra el bloque 213) se
# toca la línea que bloquea. Queda una pregunta de opciones: el parpadeo en la placa sola.
leccion: cap17/sec-17.8

libro:
  199: "Lo que ocurre al pulsar «subir» son cuatro etapas"
  200: "el código que se compila no es exactamente el que se escribió"
  201: "Los errores de esta etapa son de sintaxis o de tipos, y señalan una línea concreta"
  202: "significan que falta una biblioteca o una función"
  203: "el cargador de arranque residente en el chip recibe el programa por el puerto serie y lo escribe en Flash"
  204: "Distinguir en qué etapa falla es lo que orienta la solución"
  208: "ese número no incluye la pila ni las variables locales"
  209: "Por debajo del 70 % se está razonablemente seguro"
  213: "muchas usan delay() internamente, bloqueando el programa"
  215: "mirar su código"
  218: "cable de solo carga sin datos"
  219: "algo conectado a los pines 0 y 1"
  220: "el reset queda retenido por un condensador externo"
  228: "Si funciona, el problema está en el programa o en el circuito"
  229: "De un fichero de texto a un chip programado, con el papel del cargador de arranque."

modelo:
  valores:
    r_ram: { sim: "RAM", nombre: "RAM del ATmega328P", unidad: "", valor: 2048 }
    f_seg: { sim: "f", nombre: "fracción segura de globales", unidad: "", valor: 0.7 }
  calculos:
    g_seg: { expr: "f_seg*r_ram", sim: "m", nombre: "globales con margen", unidad: "" }

tarjetas:
  - id: explore-cadena
    tipo: explorar
    titulo: "Del texto al chip"
    texto: "Al pulsar «subir» pasan cuatro etapas. Toque cada una."
    libro: [199, 200, 201, 202, 229]
    widget:
      tipo: figura
      figura: fig-17.13
      zonas:
        - { id: pre, rotulo: "Recuadro naranja, arriba", rect: [80, 34, 94, 71], texto: "Preprocesado: añade las declaraciones que faltan y lo convierte en C++ válido." }
        - { id: comp, rotulo: "Recuadro azul, arriba", rect: [187, 34, 94, 71], texto: "Compilación: cada fichero a código objeto. Errores de sintaxis o de tipos, con su línea." }
        - { id: enl, rotulo: "Recuadro violeta, arriba", rect: [294, 34, 94, 71], texto: "Enlazado: une los objetos con las bibliotecas. «Referencia no definida»: falta algo." }
        - { id: carga, rotulo: "Recuadro verde, abajo a la derecha", rect: [375, 150, 70, 62], texto: "Carga: el binario llega por USB y el puerto serie al cargador del chip." }
    requiere: { mover: [pre, enl] }

  - id: ordene-etapas
    tipo: tocar
    titulo: "Cuatro etapas"
    texto: "Toque, en orden, las cuatro etapas que pasan al pulsar «subir»."
    libro: [199, 200, 201, 202, 203]
    widget:
      tipo: figura
      figura: fig-17.13
      zonas:
        - { id: enl, rotulo: "Recuadro violeta, arriba", rect: [294, 34, 94, 71] }
        - { id: carga, rotulo: "Recuadro verde, abajo a la derecha", rect: [375, 150, 70, 62] }
        - { id: pre, rotulo: "Recuadro naranja, arriba", rect: [80, 34, 94, 71] }
        - { id: comp, rotulo: "Recuadro azul, arriba", rect: [187, 34, 94, 71] }
    tocar:
      bien: [pre, comp, enl, carga]
      orden: true
    exito: "Preprocesado, compilación, enlazado y carga. Distinguir en qué etapa falla es la primera pregunta ante cualquier mensaje."
    escalera:
      - "No se puede enlazar lo que aún no está compilado; lo último ocurre ya en la placa."
    solucion: "Preprocesado, compilación, enlazado y carga."

  - id: empareje-errores
    tipo: tocar
    titulo: "Cada error, su etapa"
    texto: "Al subir aparece «referencia no definida». Toque la etapa que se queja."
    libro: [200, 201, 202, 204]
    widget:
      tipo: figura
      figura: fig-17.13
      zonas:
        - { id: pre, rotulo: "Recuadro naranja, arriba", rect: [80, 34, 94, 71] }
        - { id: comp, rotulo: "Recuadro azul, arriba", rect: [187, 34, 94, 71] }
        - { id: enl, rotulo: "Recuadro violeta, arriba", rect: [294, 34, 94, 71] }
        - { id: carga, rotulo: "Recuadro verde, abajo a la derecha", rect: [375, 150, 70, 62] }
    tocar:
      bien: [enl]
      porque:
        pre: "El preprocesado da errores en código que usted no escribió, no referencias que faltan."
        comp: "La compilación señala una línea concreta: sintaxis o tipos."
        carga: "Los errores de carga son de comunicación, no de código."
    exito: "El enlazado: falta una biblioteca o una función. No es una errata."
    escalera:
      - "¿Qué etapa une los objetos con las bibliotecas?"
    solucion: "El enlazado."

  - id: toque-cargador
    tipo: tocar
    titulo: "Quién escribe la Flash"
    texto: "En la placa, toque lo que recibe su programa por el puerto serie y lo escribe en la Flash."
    libro: [203, 229]
    widget:
      tipo: figura
      figura: fig-17.13
      zonas:
        - { id: programa, rotulo: "Recuadro azul de la Flash", rect: [185, 182, 100, 36] }
        - { id: cargador, rotulo: "Recuadro rojo de la Flash", rect: [287, 180, 47, 38] }
        - { id: conversor, rotulo: "Recuadro verde, abajo a la derecha", rect: [375, 150, 70, 62] }
        - { id: reset, rotulo: "Recuadro rojo, abajo a la izquierda", rect: [13, 144, 153, 47] }
    tocar:
      bien: [cargador]
      porque:
        programa: "Es el sitio donde acaba su programa, no quien lo escribe."
        conversor: "El conversor traduce el USB a serie; quien escribe en Flash está dentro del chip."
        reset: "Explica cuándo arranca el cargador, pero no es quien escribe."
    exito: "El cargador de arranque: medio kilobyte residente en la Flash."
    escalera:
      - "Está dentro del chip, en la misma Flash."
    solucion: "El cargador de arranque, el recuadro rojo de la Flash."

  - id: predecir-ram
    tipo: leer
    titulo: "La RAM de verdad"
    texto: "El informe de la compilación cuenta solo las globales, sobre los 2 KB de RAM. Escriba hasta cuántos bytes de globales se está razonablemente seguro."
    libro: [208, 209]
    widget:
      tipo: figura
      figura: fig-17.13
      zonas:
        - { id: micro, rotulo: "Recuadro del ATmega328P", rect: [177, 144, 160, 93], texto: "2 KB de RAM para globales, pila y locales." }
    leer:
      objetivo: g_seg
      unidad: ""
      tol: 0.03
      rotulo: "Bytes de globales"
    exito: "Por debajo del 70 %: la pila y las locales se añaden en ejecución. Un programa que compila con el 80 % puede fallar en marcha, sin avisar."
    escalera:
      - "El libro da el porcentaje seguro: el 70 %."
    solucion: "El 70 % de 2048 bytes: unos 1434 bytes."
    comprobar:
      - { g_seg: 1433.6, r_ram: 2048 }

  - id: pregunta-biblioteca
    tipo: tocar
    titulo: "Una biblioteca sospechosa"
    texto: "Al añadir una biblioteca, el programa deja de responder a tiempo. Mira su código: toque la línea que lo bloquea."
    libro: [213, 215]
    widget:
      tipo: figura
      codigo:
        lenguaje: c
        texto: |
          float Sensor::leer() {
            iniciarConversion();
            delay(750);          // wait for the conversion
            return resultado();
          }
      zonas:
        - { id: l1, lineas: [1], rotulo: "Primera línea" }
        - { id: l2, lineas: [2], rotulo: "Segunda línea" }
        - { id: l3, lineas: [3], rotulo: "Tercera línea" }
        - { id: l4, lineas: [4], rotulo: "Cuarta línea" }
    tocar:
      bien: [l3]
      porque:
        l1: "Es la cabecera de la función: no ejecuta nada."
        l2: "Arranca la conversión y vuelve enseguida."
        l4: "Devuelve el resultado: es inmediato."
    exito: "Un delay() dentro de la biblioteca bloquea el programa entero. Es texto en el disco, y a menudo el problema está a la vista en veinte líneas."
    escalera:
      - "¿Qué línea se queda parada esperando?"
    solucion: "La del delay()."

  - id: empareje-carga
    tipo: tocar
    titulo: "Los errores de carga"
    texto: "Falla la sincronización al subir, con un módulo conectado a los pines 0 y 1. Toque la línea en la que estorba."
    libro: [203, 218, 219, 220, 229]
    widget:
      tipo: figura
      figura: fig-17.13
      zonas:
        - { id: programa, rotulo: "Recuadro azul de la Flash", rect: [185, 182, 100, 36] }
        - { id: cargador, rotulo: "Recuadro rojo de la Flash", rect: [287, 180, 47, 38] }
        - { id: txrx, rotulo: "Flecha de arriba, a la derecha del chip", rect: [330, 152, 52, 36] }
        - { id: dtr, rotulo: "Flecha de abajo, a la derecha del chip", rect: [330, 190, 52, 36] }
    tocar:
      bien: [txrx]
      porque:
        programa: "Ahí acaba el programa cuando la carga va bien; el fallo es antes, en la comunicación."
        cargador: "Un cargador dañado también la estropea, pero un módulo en los pines 0 y 1 estorba en la línea que le trae el programa."
        dtr: "La DTR solo reinicia la placa para que arranque el cargador."
    exito: "TX/RX: los pines 0 y 1. Los errores de carga son de comunicación: un cable de solo carga, algo en los pines 0 y 1, o un reset retenido por un condensador externo."
    escalera:
      - "¿Por qué línea recibe el cargador el programa?"
    solucion: "La línea TX/RX, los pines 0 y 1."

  - id: pregunta-banco
    tipo: pregunta
    titulo: "En el banco"
    texto: "Ante un problema que parece del entorno, carga el parpadeo en la placa sola y funciona. ¿Dónde busca?"
    libro: [228]
    widget:
      tipo: figura
      figura: fig-17.13
      zonas:
        - { id: placa, rotulo: "Recuadro gris de abajo", rect: [5, 130, 440, 117] }
    opciones:
      - texto: "En el programa o en el circuito"
        bien: true
        porque: "Si el parpadeo funciona, placa, cable y controlador están bien."
      - texto: "En el controlador del ordenador"
        porque: "Con el parpadeo funcionando, el controlador está bien."
      - texto: "En el cargador de arranque"
        porque: "Ha cargado el parpadeo: el cargador funciona."
    escalera:
      - "¿Qué ha quedado demostrado al cargar el parpadeo?"
    solucion: "En el programa o en el circuito."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [199, 203, 209, 228]
    ideas:
      - { titulo: "Cuatro etapas.", texto: "Preprocesado, compilación, enlazado y carga: ¿en cuál falla?" }
      - { titulo: "El cargador.", texto: "Recibe el programa por el puerto serie y lo escribe en Flash." }
      - { titulo: "La RAM de verdad.", texto: "El informe no cuenta pila ni locales: por debajo del 70 %." }
      - { titulo: "El parpadeo.", texto: "En la placa sola separa el software del hardware en un minuto." }
