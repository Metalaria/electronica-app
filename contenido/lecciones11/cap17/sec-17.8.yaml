# Lección 1.2 de la sección 16.8 «El Entorno y la Cadena de Herramientas» (cap17; etiquetas sec-17.N = impresas 16.N).
# - Las cuatro etapas de la cadena y el cargador de arranque sobre la figura 16.13 (fig-17.13), con zonas.
# - Sin modelo numérico.
# Paso práctico: «tocar» la pieza que escribe el programa en la Flash (el cargador de arranque).
leccion: cap17/sec-17.8

libro:
  199: "Lo que ocurre al pulsar «subir» son cuatro etapas"
  200: "el código que se compila no es exactamente el que se escribió"
  201: "Los errores de esta etapa son de sintaxis o de tipos, y señalan una línea concreta"
  202: "significan que falta una biblioteca o una función"
  203: "el cargador de arranque residente en el chip recibe el programa por el puerto serie y lo escribe en Flash"
  204: "Distinguir en qué etapa falla es lo que orienta la solución"
  208: "ese número no incluye la pila ni las variables locales"
  209: "Por debajo del 70 % se está razonablemente seguro"
  213: "muchas usan delay() internamente, bloqueando el programa"
  215: "mirar su código"
  218: "cable de solo carga sin datos"
  219: "algo conectado a los pines 0 y 1"
  220: "el reset queda retenido por un condensador externo"
  228: "Si funciona, el problema está en el programa o en el circuito"
  229: "De un fichero de texto a un chip programado, con el papel del cargador de arranque."

modelo: { valores: {}, calculos: {} }

tarjetas:
  - id: explore-cadena
    tipo: explorar
    titulo: "Del texto al chip"
    texto: "Al pulsar «subir» pasan cuatro etapas. Toque cada una."
    libro: [199, 200, 201, 202, 229]
    widget:
      tipo: figura
      figura: fig-17.13
      zonas:
        - { id: pre, rotulo: "Recuadro naranja, arriba", rect: [80, 34, 94, 71], texto: "Preprocesado: añade las declaraciones que faltan y lo convierte en C++ válido." }
        - { id: comp, rotulo: "Recuadro azul, arriba", rect: [187, 34, 94, 71], texto: "Compilación: cada fichero a código objeto. Errores de sintaxis o de tipos, con su línea." }
        - { id: enl, rotulo: "Recuadro violeta, arriba", rect: [294, 34, 94, 71], texto: "Enlazado: une los objetos con las bibliotecas. «Referencia no definida»: falta algo." }
        - { id: carga, rotulo: "Recuadro verde, abajo a la derecha", rect: [375, 150, 70, 62], texto: "Carga: el binario llega por USB y el puerto serie al cargador del chip." }
    requiere: { mover: [pre, enl] }

  - id: ordene-etapas
    tipo: pregunta
    titulo: "Cuatro etapas"
    texto: "Ordene lo que pasa al pulsar «subir»."
    libro: [199, 200, 201, 202, 203]
    widget:
      tipo: figura
      figura: fig-17.13
      zonas:
        - { id: ordenador, rotulo: "Recuadro gris de arriba", rect: [5, 5, 440, 112] }
    ordenar:
      - "Preprocesado: el entorno lo convierte en C++ válido"
      - "Compilación: cada fichero a código objeto"
      - "Enlazado: los objetos con las bibliotecas"
      - "Carga: el cargador lo escribe en Flash"
    exito: "Distinguir en qué etapa falla es la primera pregunta ante cualquier mensaje."
    pistas:
      - { texto: "Lo último ocurre ya en la placa." }
    escalera:
      - "No se puede enlazar lo que aún no está compilado."
    solucion: "Preprocesado, compilación, enlazado y carga."

  - id: empareje-errores
    tipo: pregunta
    titulo: "Cada error, su etapa"
    texto: "Empareje cada mensaje con la etapa en que aparece."
    libro: [200, 201, 202, 204]
    widget:
      tipo: figura
      figura: fig-17.13
      zonas:
        - { id: ordenador, rotulo: "Recuadro gris de arriba", rect: [5, 5, 440, 112] }
    emparejar:
      - ["Error de tipos en una línea concreta", "Compilación"]
      - ["«Referencia no definida»", "Enlazado"]
      - ["Un error en código que usted no escribió", "Preprocesado"]
      - ["No se encuentra el puerto", "Carga"]
    exito: "La etapa orienta la solución: un error de enlazado no es una errata, es que falta algo."
    pistas:
      - { texto: "El enlazado se queja de lo que falta, no de cómo está escrito." }
    escalera:
      - "Los errores de carga son de comunicación, no de código."
    solucion: "Tipos, compilación; referencia, enlazado; código ajeno, preprocesado; puerto, carga."

  - id: toque-cargador
    tipo: tocar
    titulo: "Quién escribe la Flash"
    texto: "En la placa, toque lo que recibe su programa por el puerto serie y lo escribe en la Flash."
    libro: [203, 229]
    widget:
      tipo: figura
      figura: fig-17.13
      zonas:
        - { id: programa, rotulo: "Recuadro azul de la Flash", rect: [185, 182, 100, 36] }
        - { id: cargador, rotulo: "Recuadro rojo de la Flash", rect: [287, 180, 47, 38] }
        - { id: conversor, rotulo: "Recuadro verde, abajo a la derecha", rect: [375, 150, 70, 62] }
        - { id: reset, rotulo: "Recuadro rojo, abajo a la izquierda", rect: [13, 144, 153, 47] }
    tocar:
      bien: [cargador]
      porque:
        programa: "Es el sitio donde acaba su programa, no quien lo escribe."
        conversor: "El conversor traduce el USB a serie; quien escribe en Flash está dentro del chip."
        reset: "Explica cuándo arranca el cargador, pero no es quien escribe."
    exito: "El cargador de arranque: medio kilobyte residente en la Flash."
    escalera:
      - "Está dentro del chip, en la misma Flash."
    solucion: "El cargador de arranque, el recuadro rojo de la Flash."

  - id: predecir-ram
    tipo: predecir
    titulo: "El 80 % de la RAM"
    texto: "El programa compila y el entorno dice que las globales ocupan el 80 % de la RAM. ¿Está a salvo?"
    libro: [208, 209]
    widget:
      tipo: figura
      figura: fig-17.13
      zonas:
        - { id: micro, rotulo: "Recuadro del ATmega328P", rect: [177, 144, 160, 93] }
    opciones:
      - texto: "No: puede fallar al ejecutarse"
        bien: true
        porque: "Ese número no incluye la pila ni las locales. Por debajo del 70 % se está razonablemente seguro."
      - texto: "Sí: si compila, cabe"
        porque: "Las locales y la pila se añaden en ejecución, y el desbordamiento es silencioso."
      - texto: "Sí, mientras no se llene del todo"
        porque: "Ese porcentaje es solo de globales: la pila crece en marcha y choca antes."
    escalera:
      - "¿Qué no cuenta ese número?"
    solucion: "No: la pila y las locales se suman en marcha. Conviene medir la memoria libre."

  - id: pregunta-biblioteca
    tipo: pregunta
    titulo: "Una biblioteca sospechosa"
    texto: "Al añadir una biblioteca, el programa deja de responder a tiempo. ¿Qué comprobación hace?"
    libro: [213, 215]
    widget:
      tipo: figura
      figura: fig-17.13
      zonas:
        - { id: enl, rotulo: "Recuadro violeta, arriba", rect: [294, 34, 94, 71] }
    opciones:
      - texto: "Mirar su código"
        bien: true
        porque: "Es texto y está en el disco; muchas usan delay() por dentro, y a menudo se ve en veinte líneas."
      - texto: "Reinstalar el entorno"
        porque: "El problema está en la biblioteca: su código lo dice."
      - texto: "Cambiar de placa"
        porque: "La placa no tiene la culpa de un delay() dentro de una biblioteca."
    escalera:
      - "Una biblioteca es texto en el disco."
    solucion: "Mirar su código: quizá bloquea con delay()."

  - id: empareje-carga
    tipo: pregunta
    titulo: "Los errores de carga"
    texto: "Empareje cada síntoma al subir con su causa más frecuente."
    libro: [218, 219, 220]
    widget:
      tipo: figura
      figura: fig-17.13
      zonas:
        - { id: placa, rotulo: "Recuadro gris de abajo", rect: [5, 130, 440, 117] }
    emparejar:
      - ["No se encuentra el puerto", "Un cable de solo carga, sin datos"]
      - ["Falla la sincronización", "Algo conectado a los pines 0 y 1"]
      - ["Carga bien y no hace nada", "La lógica, o el reset retenido"]
    exito: "Los errores de carga son de comunicación, no de código."
    pistas:
      - { texto: "La sincronización la estropea lo que comparte la UART." }
    escalera:
      - "Si ni siquiera aparece el puerto, el ordenador no ve la placa."
    solucion: "Puerto, cable; sincronización, pines 0 y 1; nada, la lógica o el reset."

  - id: pregunta-banco
    tipo: pregunta
    titulo: "En el banco"
    texto: "Ante un problema que parece del entorno, carga el parpadeo en la placa sola y funciona. ¿Dónde busca?"
    libro: [228]
    widget:
      tipo: figura
      figura: fig-17.13
      zonas:
        - { id: placa, rotulo: "Recuadro gris de abajo", rect: [5, 130, 440, 117] }
    opciones:
      - texto: "En el programa o en el circuito"
        bien: true
        porque: "Si el parpadeo funciona, placa, cable y controlador están bien."
      - texto: "En el controlador del ordenador"
        porque: "Con el parpadeo funcionando, el controlador está bien."
      - texto: "En el cargador de arranque"
        porque: "Ha cargado el parpadeo: el cargador funciona."
    escalera:
      - "¿Qué ha quedado demostrado al cargar el parpadeo?"
    solucion: "En el programa o en el circuito."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [199, 203, 209, 228]
    ideas:
      - { titulo: "Cuatro etapas.", texto: "Preprocesado, compilación, enlazado y carga: ¿en cuál falla?" }
      - { titulo: "El cargador.", texto: "Recibe el programa por el puerto serie y lo escribe en Flash." }
      - { titulo: "La RAM de verdad.", texto: "El informe no cuenta pila ni locales: por debajo del 70 %." }
      - { titulo: "El parpadeo.", texto: "En la placa sola separa el software del hardware en un minuto." }
