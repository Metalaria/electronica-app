# Lección 1.2 de la sección 16.5 «Entradas Analógicas y Salidas PWM» (cap17; etiquetas sec-17.N = impresas 16.N).
# - El convertidor de 10 bits: LSB = V_ref/2¹⁰ (4,88 mV con 5 V), la referencia, la impedancia de la fuente
#   (figura 16.9, fig-17.9) y el promediado (√n).
# - El PWM de analogWrite() como gráfica: una onda cuadrada de 490 Hz entre 0 y 5 V con ciclo de trabajo valor/255
#   (figura 16.8): v = 5·(1 − ⌊frac(t·f) + 1 − D⌋), alta mientras frac(t·f) < D; su media, 5·D.
# Paso práctico: «dibujar» la onda de analogWrite(pin, 191) (75 %, ejercicio 16.4).
# 1.2.1 (autor121-sens, «aprender haciendo», GUIA §13): se escriben el LSB, las lecturas para dividir el ruido por
# diez, las muestras por segundo y el rizado del RC de 10 ms (ΔV ≈ V·D·(1 − D)·T/τ al 50 %: 0,255 V, los «unos
# 0,25 V» del libro); la medida ratiométrica se vive en una gráfica del código frente a la alimentación real (hay que
# llegar a 512 con la alimentación por encima de 5 V); el PWM se lleva a 2,5 V de media antes de dibujar el 75 %.
# Queda una pregunta de opciones (la impedancia de la fuente) y dos emparejar (referencias y quién promedia).
leccion: cap17/sec-17.5

libro:
  121: "Con 5 V, cada paso vale 4,88 mV"
  123: "Una medida «de 2,5 V» significa en realidad «la mitad de lo que valga la alimentación en ese instante»"
  124: "la variación se cancela y la referencia deja de importar"
  125: "sale baja si antes se midió una tensión menor"
  126: "La hoja de datos recomienda menos de 10 kΩ de impedancia de fuente"
  127: "el último bit o los dos últimos suelen ser ruido"
  128: "Cuatro lecturas lo dividen por dos; para dividir por diez hacen falta cien"
  130: "algo menos de 10 000 muestras por segundo como máximo"
  133: "analogWrite() no genera una tensión: genera una onda cuadrada de ciclo de trabajo variable"
  134: "La entrada de un circuito analógico: no promedia nada"
  135: "con 10 ms quedan todavía unos 0,25 V de rizado pico a pico"
  145: "fracción del periodo en alto, valor/255"
  146: "Efecto de la impedancia de la fuente en la lectura del convertidor"
  "cap17#342": "valor = 0,75 × 255 = 191"

modelo:
  valores:
    V_rf: { sim: "V_{ref}", nombre: "referencia del convertidor", unidad: V, valor: 5 }
    n_b: { sim: "n", nombre: "bits del convertidor", unidad: "", valor: 10 }
    a_w: { sim: "valor", nombre: "valor de analogWrite()", unidad: "", valor: 64 }
    f_p: { sim: "f_{PWM}", nombre: "frecuencia del PWM", unidad: Hz, valor: 490 }
    V_pw: { sim: "V", nombre: "tensión del pin en alto", unidad: V, valor: 5 }
    V_al: { sim: "V_{alim}", nombre: "alimentación real", unidad: V, valor: 5.2 }
    m_r: { sim: "m", nombre: "lo que se mide", unidad: "", valor: 0 }
    V_fij: { sim: "V_{in}", nombre: "tensión fija medida", unidad: V, valor: 2.5 }
    k_r: { sim: "k", nombre: "factor de reducción del ruido", unidad: "", valor: 10 }
    t_cv: { sim: "t_{conv}", nombre: "tiempo de una conversión", unidad: s, valor: 0.000104 }
    tau_f: { sim: "\\tau", nombre: "constante de tiempo del filtro", unidad: s, valor: 0.01 }
  calculos:
    LSB: { expr: "V_rf/2^n_b", sim: "LSB", nombre: "valor de un paso", unidad: V, cifras: 3 }
    D_w: { expr: "100*a_w/255", sim: "D", nombre: "ciclo de trabajo", unidad: "%", cifras: 3 }
    V_md: { expr: "V_pw*a_w/255", sim: "V_{media}", nombre: "tensión media", unidad: V }
    T_p: { expr: "1/f_p", sim: "T", nombre: "periodo del PWM", unidad: s }
    t_al: { expr: "T_p*a_w/255", sim: "t_{alto}", nombre: "tiempo en alto", unidad: s }
    t_ba: { expr: "T_p - t_al", sim: "t_{bajo}", nombre: "tiempo en bajo", unidad: s }
    c_ad: { expr: "2^n_b*(m_r*0.5*V_al + (1 - m_r)*V_fij)/V_al", sim: "N", nombre: "código del convertidor", unidad: "", cifras: 3 }
    c_med: { expr: "2^n_b/2", sim: "N_{mitad}", nombre: "mitad de la escala", unidad: "" }
    n_pr: { expr: "k_r^2", sim: "n", nombre: "lecturas que promediar", unidad: "" }
    f_mu: { expr: "1/t_cv", sim: "f_{s}", nombre: "muestras por segundo", unidad: Hz }
    V_riz: { expr: "V_pw*0.5*0.5*T_p/tau_f", sim: "\\Delta V", nombre: "rizado pico a pico al 50 %", unidad: V }

tarjetas:
  - id: estime-lsb
    tipo: leer
    titulo: "Un paso del convertidor"
    texto: "El ATmega328P convierte con 10 bits: 1024 códigos entre 0 y 5 V. Escriba cuánto vale un paso."
    libro: [121]
    widget:
      tipo: figura
      figura: fig-17.9
      zonas:
        - { id: adc, rotulo: "Gráfica de la izquierda", rect: [0, 0, 210, 199], texto: "La lectura del convertidor, código a código." }
    leer:
      objetivo: LSB
      unidad: V
      tol: 0.02
      rotulo: "Un paso, LSB"
      errores:
        - { expr: "V_rf/n_b", texto: "Ha dividido entre los bits; se divide entre los códigos, 2¹⁰ = 1024." }
    exito: "4,88 mV: el límite de resolución. Pero la resolución es lo de menos."
    escalera:
      - "Divida la referencia entre el número de códigos."
    solucion: "5 V / 1024 = 4,88 mV."
    comprobar:
      - { LSB: 0.004883 }

  - id: pregunta-referencia
    tipo: explorar
    titulo: "Lo que de verdad mide"
    texto: "El convertidor mide respecto a la alimentación, que no vale 5,000 V. Con la alimentación real por encima de 5 V, consiga que analogRead() dé la mitad de la escala."
    libro: [123, 124]
    widget:
      tipo: grafica
      x: { id: u, min: 4.8, max: 5.2, unidad: V, rotulo: "alimentación real" }
      y: { min: 470, max: 550, unidad: "", rotulo: "código" }
      curvas:
        - { expr: "2^n_b*V_fij/u", color: naranja, rotulo: "2,5 V fijos" }
        - { expr: "2^n_b*0.5", color: azul, rotulo: "potenciómetro a mitad" }
      lectura: { valor: c_ad, rotulo: "analogRead()" }
      mandos:
        - { valor: V_al, lista: [4.8, 4.9, 5, 5.1, 5.2], rotulo: "Alimentación real" }
        - { valor: m_r, lista: [0, 1], nombres: ["2,5 V aparte", "Potenciómetro a mitad"], rotulo: "Lo que mide" }
    objetivo:
      condiciones:
        - { valor: V_al, min: 5.05, rotulo: "Alimentación por encima de 5 V" }
        - { valor: c_ad, objetivo: 512, tol: 0.001, rotulo: "analogRead(): {{c_ad}}" }
      logrado: "Medida ratiométrica: el sensor se alimenta de la misma tensión, la variación se cancela y la referencia deja de importar."
      pistas:
        - { cuando: { valor: m_r, max: 0.5 }, texto: "Los 2,5 V fijos se leen como una fracción distinta de cada alimentación. Cambie lo que mide." }
        - { texto: "Suba la alimentación real." }
    escalera:
      - "«2,5 V» significa «la mitad de lo que valga la alimentación en ese instante»."
    solucion: "El potenciómetro de la misma alimentación: siempre 512."
    comprobar:
      - { c_med: 512 }

  - id: empareje-referencias
    tipo: pregunta
    titulo: "Tres salidas"
    texto: "Empareje cada alternativa a la alimentación con lo que hay que saber de ella."
    libro: [124]
    widget:
      tipo: figura
      figura: fig-17.9
      zonas:
        - { id: adc, rotulo: "Gráfica de la izquierda", rect: [0, 0, 210, 199] }
    emparejar:
      - ["Referencia interna de 1,1 V", "Estable, pero hay que calibrarla una vez"]
      - ["Referencia externa por AREF", "Una tensión de referencia aparte"]
      - ["Medida ratiométrica", "El sensor se alimenta de la misma tensión"]
    exito: "En la ratiométrica la variación se cancela y la referencia deja de importar."
    pistas:
      - { texto: "La interna tiene una tolerancia inicial de 1,0 a 1,2 V." }
    escalera:
      - "Una de las tres hace que la referencia deje de importar."
    solucion: "1,1 V, calibrar; AREF, externa; ratiométrica, misma alimentación."

  - id: predecir-impedancia
    tipo: predecir
    titulo: "Un potenciómetro de 100 kΩ"
    texto: "Lee un potenciómetro de 100 kΩ justo después de leer otro canal con menos tensión. ¿Cómo sale la lectura?"
    libro: [125, 126, 146]
    widget:
      tipo: figura
      figura: fig-17.9
      zonas:
        - { id: adc, rotulo: "Gráfica de la izquierda", rect: [0, 0, 210, 199] }
    opciones:
      - texto: "Baja, y ningún promediado lo arregla"
        bien: true
        porque: "El condensador de muestreo no llega a cargarse y arrastra la lectura anterior. Se recomiendan menos de 10 kΩ."
      - texto: "Correcta, aunque con más ruido"
        porque: "No es ruido: es un error de establecimiento, siempre hacia la tensión anterior."
      - texto: "Alta"
        porque: "Arrastra la tensión anterior, que era menor: sale baja."
    escalera:
      - "Cada muestra carga un condensador de unos 14 pF a través de la fuente."
    solucion: "Baja. Un buffer, menos impedancia o un condensador en la entrada."

  - id: pregunta-promedio
    tipo: leer
    titulo: "Promediar"
    texto: "Los dos últimos bits son ruido aleatorio. Escriba cuántas lecturas hay que promediar para dividirlo por diez."
    libro: [127, 128]
    widget:
      tipo: figura
      figura: fig-17.9
      zonas:
        - { id: adc, rotulo: "Gráfica de la izquierda", rect: [0, 0, 210, 199], texto: "El último bit o los dos últimos suelen ser ruido." }
    leer:
      objetivo: n_pr
      unidad: ""
      tol: 0.01
      rotulo: "Lecturas promediadas"
      errores:
        - { expr: "k_r", texto: "El ruido baja con √n, no con n: diez lecturas lo dividen por algo más de tres." }
    exito: "Cien: promediar n lecturas divide el ruido aleatorio por √n. Cuatro lo dividen por dos."
    escalera:
      - "Cuatro lecturas lo dividen por dos: la raíz de cuatro."
    solucion: "√100 = 10: cien lecturas."
    comprobar:
      - { n_pr: 100 }

  - id: pregunta-velocidad
    tipo: leer
    titulo: "El tiempo de conversión"
    texto: "Cada conversión tarda unos 104 µs. Escriba cuántas muestras por segundo puede dar, como mucho."
    libro: [130]
    widget:
      tipo: figura
      figura: fig-17.9
      zonas:
        - { id: adc, rotulo: "Gráfica de la izquierda", rect: [0, 0, 210, 199], texto: "13 ciclos de un reloj de 125 kHz por conversión." }
    leer:
      objetivo: f_mu
      unidad: Hz
      tol: 0.05
      rotulo: "Muestras por segundo"
      errores:
        - { expr: "125000", texto: "Ese es el reloj del convertidor; cada conversión gasta 13 de sus ciclos." }
    exito: "Algo menos de 10 000, y eso sin hacer nada más: para audio o señales rápidas, es el límite."
    escalera:
      - "Invierta 104 µs."
    solucion: "1 / 104 µs: algo menos de 10 000 muestras por segundo."
    comprobar:
      - { f_mu: 9615 }

  - id: explore-pwm
    tipo: explorar
    titulo: "El PWM no es analógico"
    texto: "analogWrite() da una onda cuadrada de 490 Hz. Cambie el valor hasta que la media sea la mitad de los 5 V."
    libro: [133, 145]
    widget:
      tipo: grafica
      x: { id: t, min: 0, max: 0.0061, unidad: s, rotulo: "t", muestras: 1200 }
      y: { min: -0.5, max: 5.5, unidad: V, rotulo: "v" }
      curvas:
        - { expr: "V_pw*(1 - floor(t*f_p - floor(t*f_p) + 1 - a_w/255))", color: azul, rotulo: "pin" }
        - { expr: "V_md", color: naranja, rotulo: "media", discontinua: true }
      lectura: { valor: V_md, rotulo: "Tensión media" }
      datos:
        - { valor: D_w, rotulo: "Ciclo de trabajo: {{D_w}}" }
      mandos:
        - { valor: a_w, min: 0, max: 255, paso: 1, rotulo: "analogWrite(pin, valor)" }
    objetivo:
      condiciones:
        - { valor: V_md, objetivo: 2.5, tol: 0.01, rotulo: "Media: {{V_md}}" }
      logrado: "Con {{a_w}}, el pin pasa en alto {{D_w}} de cada periodo: la media es 5 V por valor/255. Pero el pin solo vale 0 o 5 V."
      pistas:
        - { cuando: { valor: V_md, mayor: 2.5 }, texto: "Demasiado tiempo en alto: baje el valor." }
        - { texto: "Poco tiempo en alto: suba el valor." }
    escalera:
      - "La media es 5 V · valor/255."
    solucion: "analogWrite(pin, 128): la mitad de 255."
    comprobar:
      - { con: { a_w: 128 }, V_md: 2.51 }

  - id: dibuje-pwm
    tipo: dibujar
    titulo: "Dibuje el 75 %"
    texto: "Dibuje la tensión del pin con analogWrite(pin, 191), durante dos periodos."
    libro: [145, "cap17#342"]
    fijar: { a_w: 191 }
    dibujar:
      x: { id: t, min: 0, max: 0.00408, unidad: s, rotulo: "t" }
      y: { min: -0.5, max: 5.5, unidad: V, rotulo: "v" }
      curva: "V_pw*(1 - floor(t*f_p - floor(t*f_p) + 1 - a_w/255))"
      puntos: 41
      tol: 0.15
      holgura: 0.03
      rotulo: "Tensión del pin"
    exito: "Tres cuartos de cada periodo en alto y uno en bajo: la media es de 3,75 V."
    pistas:
      - { cuando: { valor: media, menor: -0.05 }, texto: "Le sobra tiempo en bajo: 191 de 255 son tres cuartos del periodo en alto." }
      - { cuando: { valor: media, mayor: 0.05 }, texto: "Le sobra tiempo en alto: un cuarto de cada periodo está a 0 V." }
      - { texto: "Es una onda cuadrada: solo 0 o 5 V, nunca valores intermedios." }
    escalera:
      - "El pin solo vale 0 o 5 V; lo que cambia es cuánto tiempo pasa en alto."
      - "191/255 son tres cuartos de cada periodo de 2,04 ms."
    solucion: "Alto unos 1,53 ms y bajo unos 0,51 ms, dos veces."
    comprobar:
      - { V_md: 3.745, D_w: 74.9, T_p: 0.002041, t_al: 0.001529, t_ba: 0.000512 }

  - id: empareje-promedia
    tipo: pregunta
    titulo: "Quién promedia"
    texto: "El efecto analógico lo da el promediado. Empareje cada carga con quién lo hace."
    libro: [134]
    widget:
      tipo: figura
      figura: fig-17.9
      zonas:
        - { id: pwm, rotulo: "Gráfica de la derecha", rect: [245, 0, 199, 199] }
    emparejar:
      - ["Un LED", "El ojo"]
      - ["Un motor", "Su inercia mecánica y eléctrica"]
      - ["Un altavoz", "En parte: se oye la portadora"]
      - ["Un circuito analógico", "Nadie: hace falta un filtro o un DAC"]
    exito: "La entrada de un circuito analógico no promedia nada."
    pistas:
      - { texto: "Solo uno de los cuatro necesita un filtro paso bajo." }
    escalera:
      - "Al LED y al motor se les puede dar el PWM directamente."
    solucion: "LED, el ojo; motor, la inercia; altavoz, en parte; circuito analógico, nadie."

  - id: pregunta-rizado
    tipo: leer
    titulo: "Filtrar 490 Hz"
    texto: "Un filtro RC de 10 ms sobre el PWM de 490 Hz al 50 %. Escriba el rizado pico a pico que deja."
    libro: [135]
    widget:
      tipo: figura
      figura: fig-17.9
      zonas:
        - { id: pwm, rotulo: "Gráfica de la derecha", rect: [245, 0, 199, 199], texto: "El PWM y lo que queda tras el filtro." }
    leer:
      objetivo: V_riz
      unidad: V
      tol: 0.06
      rotulo: "Rizado pico a pico"
    exito: "Unos 0,25 V: todavía mucho. Para acercarse a una LSB de 8 bits hacen falta unos 100 ms, y el control se vuelve lento."
    escalera:
      - "En cada periodo el condensador sube y baja un poco: ΔV ≈ 5 V · D · (1 − D) · T / τ."
      - "Al 50 %, D · (1 − D) es un cuarto; T es la inversa de 490 Hz."
    solucion: "5 V · 0,25 · 2,04 ms / 10 ms ≈ 0,25 V."
    comprobar:
      - { V_riz: 0.2551, T_p: 0.002041 }

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [121, 123, 126, 133]
    ideas:
      - { titulo: "10 bits, 4,88 mV.", texto: "Pero mandan la referencia, la impedancia de la fuente y el ruido." }
      - { titulo: "Menos de 10 kΩ.", texto: "Con más, el condensador de muestreo no se carga y la lectura sale baja." }
      - { titulo: "√n.", texto: "Promediar cuatro lecturas divide el ruido por dos." }
      - { titulo: "PWM no es tensión.", texto: "Una onda cuadrada de 490 Hz: la carga o un filtro la promedian." }
