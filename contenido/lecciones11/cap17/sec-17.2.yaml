# Lección 1.2 de la sección 16.2 «La Placa Arduino UNO» (cap17; etiquetas sec-17.N = impresas 16.N).
# - Las piezas de la placa sobre la figura 16.2 (fig-17.2) y el reset automático sobre el esquema de la figura 16.4
#   (fig-17.4), con zonas en cada pieza.
# - Sin modelo numérico salvo los 5 V del raíl que se miden en el banco.
# Paso práctico: «banco» de la ficha 18 del cuaderno (cargar el parpadeo y medir el raíl de 5 V).
leccion: cap17/sec-17.2

libro:
  30: "La placa UNO es un microcontrolador con lo mínimo para funcionar, más un puente USB"
  31: "32 KB de Flash"
  32: "su presencia explica que los pines 0 y 1 estén ocupados"
  33: "El regulador lineal"
  34: "El cristal de 16 MHz"
  37: "la señal DTR del conversor USB provoca un reset del microcontrolador a través de un condensador"
  39: "El programa se reinicia al abrir el monitor serie"
  41: "El puente RESET-EN, que se puede cortar para desactivarlo"
  44: "Interrupciones externas"
  45: "Necesitar dos interrupciones externas obliga a usar el 2 y el 3"
  47: "50 mA en el raíl de 3,3 V"
  49: "el mismo microcontrolador en formato reducido"
  50: "más pines, más memoria, mismo enfoque"
  51: "funcionan a 3,3 V"
  52: "con wifi integrado"
  53: "cuando la RAM, la velocidad o los pines se queden cortos, y no antes"
  55: "medir con el multímetro los raíles de 5 V y 3,3 V"
  56: "la placa está sana y cualquier problema posterior está en el circuito o en el programa"
  57: "La placa Arduino UNO y sus partes principales"
  59: "Funciones alternativas de los pines de la placa UNO y el reset automático."
  "cap17#277": "Si baja de 4,7 V, el sistema está al borde"

modelo:
  valores:
    V_5: { sim: "V_{5V}", nombre: "raíl de 5 V", unidad: V, valor: 5 }
  calculos:
    V_borde: { expr: "4.7", sim: "V_{borde}", nombre: "tensión al borde", unidad: V }

tarjetas:
  - id: explore-placa
    tipo: explorar
    titulo: "Lo que hay en la placa"
    texto: "Un microcontrolador con lo mínimo para funcionar, más un puente USB. Toque las piezas."
    libro: [30, 31, 33, 34, 57]
    widget:
      tipo: figura
      figura: fig-17.2
      zonas:
        - { id: micro, rotulo: "Chip largo, abajo a la derecha", rect: [214, 175, 139, 38], texto: "El ATmega328P: 32 KB de Flash, 2 KB de RAM y 1 KB de EEPROM, a 16 MHz." }
        - { id: conversor, rotulo: "Chip cuadrado, arriba en el centro", rect: [163, 76, 36, 36], texto: "El conversor USB-serie: traduce entre el USB del ordenador y la UART del microcontrolador." }
        - { id: cristal, rotulo: "Pieza ovalada, en el centro", rect: [158, 119, 40, 36], texto: "El cristal de 16 MHz, con sus condensadores." }
        - { id: regulador, rotulo: "Chip pequeño, abajo en el centro", rect: [158, 180, 36, 36], texto: "El regulador lineal, con un límite térmico (sección 16.10)." }
        - { id: jack, rotulo: "Conector negro, abajo a la izquierda", rect: [100, 191, 52, 36], texto: "El jack de alimentación externa, que pasa por el regulador." }
    requiere: { mover: [micro, conversor] }

  - id: toque-pines01
    tipo: tocar
    titulo: "Pines ocupados"
    texto: "Los pines 0 y 1 no conviene usarlos como E/S. Toque la pieza que lo explica."
    libro: [32, 57]
    widget:
      tipo: figura
      figura: fig-17.2
      zonas:
        - { id: micro, rotulo: "Chip largo, abajo a la derecha", rect: [214, 175, 139, 38] }
        - { id: conversor, rotulo: "Chip cuadrado, arriba en el centro", rect: [163, 76, 36, 36] }
        - { id: cristal, rotulo: "Pieza ovalada, en el centro", rect: [158, 119, 40, 36] }
        - { id: regulador, rotulo: "Chip pequeño, abajo en el centro", rect: [158, 180, 36, 36] }
    tocar:
      bien: [conversor]
      porque:
        micro: "Los pines 0 y 1 son del microcontrolador, pero quien los ocupa es otro chip conectado a ellos."
        cristal: "El cristal da el reloj de 16 MHz; no está en los pines 0 y 1."
        regulador: "El regulador alimenta la placa; no toca los pines de señal."
    exito: "El conversor USB-serie está conectado a la UART, que sale por los pines 0 y 1."
    escalera:
      - "¿Qué pieza habla con el ordenador por el puerto serie?"
    solucion: "El conversor USB-serie: un segundo chip unido a los pines 0 y 1."

  - id: toque-reset
    tipo: tocar
    titulo: "Se reinicia solo"
    texto: "El programa se reinicia cada vez que abre el monitor serie. Toque la pieza por la que llega ese reset."
    libro: [37, 39, 59]
    widget:
      tipo: figura
      figura: fig-17.4
      zonas:
        - { id: conversor, rotulo: "Recuadro azul, abajo a la izquierda", rect: [3, 157, 50, 42] }
        - { id: condensador, rotulo: "Pieza entre DTR y las almohadillas", rect: [68, 152, 36, 36] }
        - { id: resistencia, rotulo: "Pieza vertical junto a +5 V", rect: [146, 140, 36, 36] }
        - { id: micro, rotulo: "Recuadro blanco del centro", rect: [195, 157, 67, 42] }
    tocar:
      bien: [condensador]
      porque:
        conversor: "El conversor da la señal DTR, pero el impulso de reset pasa por otra pieza."
        resistencia: "Es la resistencia que mantiene RESET en alto en reposo, no la que lo baja."
        micro: "El microcontrolador recibe el reset; no lo provoca."
    exito: "DTR baja y el condensador lleva RESET a nivel bajo un instante: el micro se reinicia."
    escalera:
      - "Una señal que cambia de nivel pasa por un componente que deja pasar los cambios."
    solucion: "El condensador entre DTR y RESET."

  - id: pregunta-reset-en
    tipo: pregunta
    titulo: "Cuando el reset estorba"
    texto: "Ese reinicio le borra el estado acumulado del programa. ¿Qué hace?"
    libro: [39, 41]
    widget:
      tipo: figura
      figura: fig-17.4
      zonas:
        - { id: reset-en, rotulo: "Las dos almohadillas del centro", rect: [108, 152, 36, 36] }
    opciones:
      - texto: "Cortar el puente RESET-EN"
        bien: true
        porque: "Existe precisamente para los casos en que ese reset estorba."
      - texto: "Quitar el conversor USB-serie"
        porque: "Sin él no se programa ni se usa el monitor; basta con cortar el puente."
      - texto: "Nada: no se puede desactivar"
        porque: "Sí se puede: el puente RESET-EN se corta para desactivarlo."
    escalera:
      - "Mire lo que hay entre el condensador y RESET."
    solucion: "Cortar el puente RESET-EN."

  - id: empareje-pines
    tipo: pregunta
    titulo: "Los pines no son intercambiables"
    texto: "Empareje cada función con los pines que la ofrecen en la UNO."
    libro: [44, 45, 59]
    widget:
      tipo: figura
      figura: fig-17.4
      zonas:
        - { id: pines, rotulo: "La fila de pines", rect: [0, 20, 453, 70] }
    emparejar:
      - ["UART hardware", "0 y 1"]
      - ["Interrupciones externas", "2 y 3"]
      - ["I²C", "A4 y A5"]
      - ["LED integrado", "13"]
    exito: "Dos interrupciones externas obligan a usar el 2 y el 3."
    pistas:
      - { texto: "Las interrupciones externas están justo después de los pines del puerto serie." }
    escalera:
      - "El puerto serie ocupa los dos primeros pines digitales."
    solucion: "UART, 0 y 1; interrupciones, 2 y 3; I²C, A4 y A5; LED, 13."

  - id: pregunta-33
    tipo: pregunta
    titulo: "El raíl de 3,3 V"
    texto: "¿Cuánta corriente conviene pedir, como mucho, al pin de 3,3 V de la placa?"
    libro: [47]
    widget:
      tipo: figura
      figura: fig-17.2
      zonas:
        - { id: power, rotulo: "Conector de abajo, en el centro", rect: [210, 215, 80, 36] }
    opciones:
      - texto: "50 mA"
        bien: true
        porque: "Es el límite del raíl de 3,3 V: no alimenta casi nada."
      - texto: "200 mA"
        porque: "Eso es el total del microcontrolador, no lo que da el raíl de 3,3 V."
      - texto: "20 mA"
        porque: "Eso es lo recomendado por pin de E/S, no el raíl de 3,3 V."
    escalera:
      - "Hay tres cifras distintas: por pin, total y raíl de 3,3 V."
    solucion: "50 mA."

  - id: empareje-variantes
    tipo: pregunta
    titulo: "Las variantes"
    texto: "Empareje cada placa con lo que la distingue de la UNO."
    libro: [49, 50, 51, 52]
    widget:
      tipo: figura
      figura: fig-17.2
      zonas:
        - { id: placa, rotulo: "La placa entera", rect: [105, 30, 270, 210] }
    emparejar:
      - ["Nano", "El mismo micro en formato reducido"]
      - ["Mega", "Más pines y más memoria"]
      - ["Placas de 32 bits", "Más potencia, pero a 3,3 V"]
      - ["ESP32", "Wifi integrado"]
    exito: "Para un proyecto conectado, hoy la elección natural es el ESP32."
    pistas:
      - { texto: "La Nano no cambia de microcontrolador: solo de tamaño." }
    escalera:
      - "Una lleva radio; otra cambia de tensión de trabajo."
    solucion: "Nano, formato; Mega, pines y memoria; 32 bits, 3,3 V; ESP32, wifi."

  - id: pregunta-salto
    tipo: pregunta
    titulo: "Cuándo cambiar de placa"
    texto: "Su proyecto cabe en una UNO. ¿Cuándo conviene pasar a una placa mayor?"
    libro: [53]
    widget:
      tipo: figura
      figura: fig-17.2
      zonas:
        - { id: micro, rotulo: "Chip largo, abajo a la derecha", rect: [214, 175, 139, 38] }
    opciones:
      - texto: "Cuando la RAM, la velocidad o los pines se queden cortos"
        bien: true
        porque: "Y no antes: lo que cabe en una UNO funciona mejor ahí que en una placa sobredimensionada."
      - texto: "Desde el principio, por si acaso"
        porque: "Una placa sobredimensionada no funciona mejor: se cambia cuando algo se queda corto."
      - texto: "Cuando salga una placa más moderna"
        porque: "El criterio es lo que pide el proyecto, no la novedad de la placa."
    escalera:
      - "El libro dice «y no antes»."
    solucion: "Cuando la RAM, la velocidad o los pines se queden cortos."

  - id: banco-railes
    tipo: banco
    titulo: "En el banco: placa sana"
    texto: "Cargue el ejemplo de parpadeo y mida con el multímetro el raíl de 5 V de la placa."
    libro: [55, 56, "cap17#277"]
    banco:
      piezas: ["Arduino UNO y su cable USB", "El ejemplo de parpadeo", "Brymen en V⎓"]
      medir: "La tensión entre el pin 5V y GND, con la placa por USB."
      esperado: V_5
      unidad: V
      tol: 0.06
      consejos:
        - { cuando: { valor: medida, menor: 4.7 }, texto: "Por debajo de 4,7 V el sistema está al borde: cualquier pico lo cruzará (sección 16.10)." }
        - { cuando: { valor: desviacion, mayor: 0.06 }, texto: "Mide de más: revise la escala del Brymen y que la punta negra esté en GND." }
        - { texto: "Raíl correcto. Mida también el de 3,3 V." }
      ficha: { n: 18, titulo: "El Arduino UNO y su alimentación" }
    comprobar:
      - { V_5: 5, V_borde: 4.7 }

  - id: pregunta-sana
    tipo: pregunta
    titulo: "Separar el problema"
    texto: "El parpadeo funciona y los raíles están bien, pero su montaje no. ¿Dónde busca?"
    libro: [56]
    widget:
      tipo: figura
      figura: fig-17.2
      zonas:
        - { id: placa, rotulo: "La placa entera", rect: [105, 30, 270, 210] }
    opciones:
      - texto: "En el circuito o en el programa"
        bien: true
        porque: "La placa está sana: es exactamente la separación que ahorra tiempo."
      - texto: "En el microcontrolador"
        porque: "Si parpadea y los raíles están bien, la placa está sana."
      - texto: "En el cable USB"
        porque: "Con el cable se ha cargado el parpadeo: funciona."
    escalera:
      - "¿Qué ha demostrado el parpadeo?"
    solucion: "En el circuito o en el programa."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [30, 37, 45, 56]
    ideas:
      - { titulo: "Lo mínimo y un puente USB.", texto: "Micro, conversor USB-serie, regulador, cristal y reset automático." }
      - { titulo: "El reset al abrir el monitor.", texto: "DTR y un condensador; se desactiva cortando RESET-EN." }
      - { titulo: "Pines con dueño.", texto: "0 y 1 para la UART, 2 y 3 para las interrupciones, A4 y A5 para I²C." }
      - { titulo: "Placa sana.", texto: "Parpadeo y raíles bien: el problema está en el circuito o en el programa." }
