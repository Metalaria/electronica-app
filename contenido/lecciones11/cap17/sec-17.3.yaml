# Lección 1.2 de la sección 16.3 «Estructura de un Programa Arduino» (cap17; etiquetas sec-17.N = impresas 16.N).
# - El arranque, setup() y loop() y dónde vive cada variable sobre la figura 16.6 (fig-17.6), con zonas.
# - Sin modelo numérico: la sección es de estructura del programa.
# Paso práctico: «tocar» el sitio donde se guarda el estado de una tarea (local estática).
# 1.2.1 (autor121-sens, «aprender haciendo», GUIA §13): en la figura 16.6 se tocan en orden arranque, setup() y
# loop(), y la declaración del estado de una tarea y del dato compartido con una interrupción; en tres fragmentos de
# loop() (propios, ilustran los bloques 70, 80 y 83) se tocan la línea que estropea el temporizador 0, las de una
# pasada en su orden y la que hace ignorar el pulsador. Queda una pregunta de opciones: el periodo de un segundo.
leccion: cap17/sec-17.3

libro:
  64: "setup() se ejecuta una vez al arrancar"
  65: "loop() se ejecuta indefinidamente después"
  66: "el programa no termina nunca"
  69: "Se libera el reset y se ejecuta el código de arranque"
  70: "modificarlo para cambiar la frecuencia del PWM altera todas las funciones de tiempo"
  73: "las únicas que pueden compartirse con una interrupción"
  74: "pierdan su valor entre llamadas"
  75: "Es la forma correcta de guardar el estado de una tarea entre pasadas del bucle"
  76: "Declararlas para que residan en Flash libera memoria"
  78: "loop() no debe bloquear nunca"
  80: "Leer las entradas que haya que atender"
  81: "añadir una más no rompe las existentes"
  83: "Usar delay() para todo, con lo que el programa deja de responder"
  89: "una salida que conmute en cada pasada de loop(), mirada con el osciloscopio"
  90: "si es de un segundo, hay un delay()"
  91: "Estructura de un programa de Arduino y dónde vive cada tipo de variable."

modelo: { valores: {}, calculos: {} }

tarjetas:
  - id: explore-estructura
    tipo: explorar
    titulo: "Un programa que nunca termina"
    texto: "Arranque, setup() una vez y loop() para siempre. Toque los tres recuadros de la izquierda."
    libro: [64, 65, 66, 91]
    widget:
      tipo: figura
      figura: fig-17.6
      zonas:
        - { id: arranque, rotulo: "Recuadro gris, arriba a la izquierda", rect: [25, 26, 180, 36], texto: "El arranque: la pila, las variables globales, millis(), el ADC y los temporizadores del PWM." }
        - { id: setup, rotulo: "Recuadro verde, a la izquierda", rect: [25, 75, 180, 36], texto: "setup(), una sola vez: configura pines, inicia buses, lee la configuración guardada." }
        - { id: loop, rotulo: "Recuadro azul, abajo a la izquierda", rect: [25, 118, 180, 46], texto: "loop(), indefinidamente: al terminar, se vuelve a llamar. Leer, actualizar tareas, escribir." }
    requiere: { mover: [setup, loop] }

  - id: ordene-arranque
    tipo: tocar
    titulo: "Antes de setup()"
    texto: "Toque en orden lo que se ejecuta desde que se alimenta la placa."
    libro: [65, 69]
    widget:
      tipo: figura
      figura: fig-17.6
      zonas:
        - { id: loop, rotulo: "Recuadro azul, abajo a la izquierda", rect: [25, 118, 180, 46] }
        - { id: setup, rotulo: "Recuadro verde, a la izquierda", rect: [25, 75, 180, 36] }
        - { id: arranque, rotulo: "Recuadro gris, arriba a la izquierda", rect: [25, 26, 180, 36] }
    tocar:
      bien: [arranque, setup, loop]
      orden: true
    exito: "El arranque ya deja en marcha millis(), el PWM y el A/D: por eso millis() funciona desde el primer instante sin que nadie lo configure."
    escalera:
      - "Lo primero es liberar el reset; lo último, lo que se repite."
    solucion: "Arranque, setup() y loop()."

  - id: predecir-temporizador
    tipo: tocar
    titulo: "Un temporizador ocupado"
    texto: "Reconfigura el temporizador 0 para cambiar la frecuencia del PWM. Toque la línea de este loop() que deja de ir bien."
    libro: [69, 70]
    widget:
      tipo: figura
      codigo:
        lenguaje: c
        texto: |
          void loop() {
            boton = digitalRead(PIN_BOTON);
            if (millis() - ultima >= intervalo) {
              ultima = millis();
              estado = !estado;
            }
            Serial.println(boton);
          }
      zonas:
        - { id: l2, lineas: [2], rotulo: "Segunda línea" }
        - { id: l3, lineas: [3], rotulo: "Tercera línea" }
        - { id: l7, lineas: [7], rotulo: "Séptima línea" }
    tocar:
      bien: [l3]
      porque:
        l2: "Leer un pin no depende de ningún temporizador."
        l7: "El puerto serie no usa el temporizador 0."
    exito: "El temporizador 0 es el de millis(): tocarlo altera todas las funciones de tiempo, también delay()."
    escalera:
      - "¿Qué inicia el entorno con el temporizador 0 antes de setup()?"
    solucion: "La de millis()."

  - id: toque-estatica
    tipo: tocar
    titulo: "El estado de una tarea"
    texto: "Una tarea debe recordar su estado entre pasadas de loop(), y nadie más debe verlo. Toque cómo la declara."
    libro: [74, 75, 91]
    widget:
      tipo: figura
      figura: fig-17.6
      zonas:
        - { id: globales, rotulo: "Recuadro violeta, arriba a la derecha", rect: [233, 26, 213, 40] }
        - { id: locales, rotulo: "Recuadro naranja, a la derecha", rect: [233, 72, 213, 40] }
        - { id: estaticas, rotulo: "Recuadro verde, a la derecha", rect: [233, 117, 213, 40] }
        - { id: flash, rotulo: "Recuadro azul, abajo a la derecha", rect: [233, 162, 213, 40] }
    tocar:
      bien: [estaticas]
      porque:
        globales: "Recordaría el estado, pero la vería todo el programa y ocuparía RAM siempre."
        locales: "Viven en la pila mientras dura la función: pierden su valor entre llamadas."
        flash: "En Flash van constantes: el estado de una tarea cambia."
    exito: "Local estática: vive como una global y solo se ve dentro de su función."
    escalera:
      - "Necesita la vida de una global con la visibilidad de una local."
    solucion: "Local estática."

  - id: empareje-variables
    tipo: tocar
    titulo: "Compartir con una interrupción"
    texto: "Un dato se escribe en una interrupción y se lee en loop(). Toque cómo lo declara."
    libro: [73, 74, 76, 91]
    widget:
      tipo: figura
      figura: fig-17.6
      zonas:
        - { id: globales, rotulo: "Recuadro violeta, arriba a la derecha", rect: [233, 26, 213, 40] }
        - { id: locales, rotulo: "Recuadro naranja, a la derecha", rect: [233, 72, 213, 40] }
        - { id: estaticas, rotulo: "Recuadro verde, a la derecha", rect: [233, 117, 213, 40] }
        - { id: flash, rotulo: "Recuadro azul, abajo a la derecha", rect: [233, 162, 213, 40] }
    tocar:
      bien: [globales]
      porque:
        locales: "Una local solo existe dentro de su función: la interrupción no la ve."
        estaticas: "Solo es visible dentro de su función: la interrupción no puede tocarla."
        flash: "En Flash van constantes, y este dato cambia."
    exito: "Global y volátil: las globales son las únicas que pueden compartirse con una interrupción."
    escalera:
      - "Tiene que verla tanto la interrupción como loop()."
    solucion: "Global, declarada volátil."

  - id: ordene-pasada
    tipo: tocar
    titulo: "La estructura que escala"
    texto: "Este loop() hace sus tres cosas desordenadas. Toque las tres partes en el orden en que deben ir en cada pasada."
    libro: [78, 80, 81]
    widget:
      tipo: figura
      codigo:
        lenguaje: c
        texto: |
          void loop() {
            digitalWrite(LED, estado);
            if (millis() - ultima >= intervalo) {
              ultima += intervalo;
              estado = !estado;
            }
            boton = digitalRead(PIN_BOTON);
          }
      zonas:
        - { id: escribir, lineas: [2], rotulo: "Segunda línea" }
        - { id: tarea, lineas: [3, 6], rotulo: "El bloque del if" }
        - { id: leer, lineas: [7], rotulo: "Séptima línea" }
    tocar:
      bien: [leer, tarea, escribir]
      orden: true
    exito: "Leer, actualizar cada tarea si le toca por tiempo y escribir: miles de vueltas por segundo, y añadir una tarea no rompe las demás."
    escalera:
      - "Primero se mira el mundo; al final se actúa sobre él."
    solucion: "La lectura del pulsador, el bloque del if y la escritura del LED."

  - id: pregunta-errores
    tipo: tocar
    titulo: "Un pulsador ignorado"
    texto: "Este programa casi nunca atiende el pulsador. Toque la línea que lo provoca."
    libro: [78, 83]
    widget:
      tipo: figura
      codigo:
        lenguaje: c
        texto: |
          void loop() {
            if (digitalRead(PIN_BOTON) == LOW) {
              cambiarModo();
            }
            digitalWrite(LED, HIGH);
            delay(1000);
            digitalWrite(LED, LOW);
          }
      zonas:
        - { id: l2, lineas: [2], rotulo: "Segunda línea" }
        - { id: l3, lineas: [3], rotulo: "Tercera línea" }
        - { id: l5, lineas: [5], rotulo: "Quinta línea" }
        - { id: l6, lineas: [6], rotulo: "Sexta línea" }
    tocar:
      bien: [l6]
      porque:
        l2: "Leer el pin es instantáneo; el problema es cuánto tarda en volver aquí."
        l3: "Solo se ejecuta si se ha leído el pulsador pulsado."
        l5: "Escribir un pin dura microsegundos: no bloquea."
    exito: "Con delay(), el programa deja de responder: solo mira el pulsador un instante por pasada. loop() no debe bloquear nunca."
    escalera:
      - "¿En qué línea se queda el programa parado sin mirar nada?"
    solucion: "La del delay(): espera parada."

  - id: pregunta-banco
    tipo: pregunta
    titulo: "En el banco: el tiempo de ciclo"
    texto: "En el osciloscopio, una salida que conmuta en cada pasada de loop() tiene un periodo de un segundo. ¿Qué indica?"
    libro: [89, 90]
    widget:
      tipo: figura
      figura: fig-17.6
      zonas:
        - { id: loop, rotulo: "Recuadro azul, abajo a la izquierda", rect: [25, 118, 180, 46] }
    opciones:
      - texto: "Hay un delay() en el bucle"
        bien: true
        porque: "Un segundo por pasada es la firma de un delay(). Sin bloqueos serían microsegundos."
      - texto: "Que el programa responde bien"
        porque: "Responde bien si el periodo es de microsegundos, no de un segundo."
      - texto: "Que el reloj del micro va lento"
        porque: "Un reloj lento no multiplica el ciclo hasta un segundo: eso es un delay()."
    escalera:
      - "Microsegundos: responde; milisegundos: algo bloquea; un segundo: …"
    solucion: "Un delay() dentro del bucle."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [64, 65, 75, 78]
    ideas:
      - { titulo: "setup() y loop().", texto: "Una vez al arrancar, y después para siempre: el programa no termina." }
      - { titulo: "Antes de setup().", texto: "millis(), el PWM y el A/D ya funcionan; el temporizador 0 está ocupado." }
      - { titulo: "Dónde vive cada variable.", texto: "Globales, locales, locales estáticas y constantes en Flash." }
      - { titulo: "No bloquear.", texto: "Leer, actualizar tareas y escribir: el periodo de la pasada lo dice." }
