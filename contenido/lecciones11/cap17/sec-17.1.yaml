# Lección 1.2 de la sección 16.1 «¿Qué es un Microcontrolador?» (cap17; etiquetas sec-17.N = impresas 16.N).
# - Los cinco bloques del ATmega328P sobre la figura 16.1 (fig-17.1), con zonas en cada bloque.
# - El tiempo por instrucción a 16 MHz (62,5 ns) como estimación: t = 1/f.
# Paso práctico: «tocar» el bloque que se agota sin avisar (la SRAM).
# 1.2.1 (autor121-sens, «aprender haciendo», GUIA §13): en la figura 16.1 se tocan los bloques que el microprocesador
# no lleva dentro, el que se agota y el que guarda la calibración; se escriben el tiempo por instrucción, los bytes del
# array y la deriva del cristal; en un esqueleto de Arduino se toca la línea que sigue a la última de loop(). Quedan dos
# preguntas de opciones: la interrupción breve y lo primero que se mide.
leccion: cap17/sec-17.1

libro:
  3: "Un microcontrolador integra en un solo chip el núcleo"
  4: "el microcontrolador es un dispositivo de control, no de cómputo"
  6: "a 16 MHz, 62,5 ns por instrucción"
  7: "Se escribe al programar y se desgasta con los ciclos"
  8: "esa cifra es la que más limita en la práctica"
  9: "para calibraciones, contadores y configuración que deban sobrevivir al apagado"
  10: "La elección de un microcontrolador se hace por sus periféricos, no por su velocidad"
  12: "un array de 100 lecturas de 16 bits, 200"
  13: "Y el fallo por agotamiento no avisa"
  17: "Cristal de cuarzo"
  18: "para un reloj o una medida de tiempo, cristal"
  20: "ese programa llama a setup() una vez"
  21: "el microcontrolador nunca «termina»"
  23: "un periférico o un pin dispara una interrupción"
  24: "las rutinas de interrupción deben ser brevísimas"
  26: "Lo primero que conviene medir en un microcontrolador nuevo es su consumo"
  27: "Los cinco bloques de un microcontrolador y para qué sirve cada uno."

modelo:
  valores:
    f_ck: { sim: "f", nombre: "frecuencia del reloj", unidad: Hz, valor: 16000000 }
    ppm_x: { sim: "\\epsilon", nombre: "exactitud del cristal", unidad: "", valor: 0.00005 }
    t_dia: { sim: "t_{día}", nombre: "segundos de un día", unidad: s, valor: 86400 }
    n_lec: { sim: "n", nombre: "lecturas del array", unidad: "", valor: 100 }
    b_lec: { sim: "b", nombre: "bytes por lectura de 16 bits", unidad: "", valor: 2 }
  calculos:
    t_ins: { expr: "1/f_ck", sim: "t", nombre: "tiempo por instrucción", unidad: s }
    der_x: { expr: "ppm_x*t_dia", sim: "\\Delta t", nombre: "deriva del cristal en un día", unidad: s }
    ram_a: { expr: "n_lec*b_lec", sim: "m", nombre: "SRAM del array", unidad: "" }

tarjetas:
  - id: explore-bloques
    tipo: explorar
    titulo: "Un ordenador en un chip"
    texto: "Núcleo, Flash, SRAM, EEPROM y periféricos, en un solo chip. Toque los bloques y lea para qué sirve cada uno."
    libro: [3, 27]
    widget:
      tipo: figura
      figura: fig-17.1
      zonas:
        - { id: nucleo, rotulo: "Recuadro blanco, a la izquierda", rect: [60, 71, 90, 72], texto: "El núcleo ejecuta las instrucciones: 8 bits, RISC y Harvard, la mayoría en un solo ciclo." }
        - { id: flash, rotulo: "Recuadro azul, arriba", rect: [176, 13, 101, 52], texto: "Flash: el programa, no volátil. Se desgasta con los ciclos de escritura." }
        - { id: perifericos, rotulo: "Recuadro verde, arriba a la derecha", rect: [299, 13, 97, 70], texto: "Periféricos: E/S, temporizadores, A/D, PWM, UART, I²C, SPI, watchdog." }
        - { id: sram, rotulo: "Recuadro rojo, abajo", rect: [176, 137, 101, 64], texto: "SRAM: las variables mientras el programa corre. Volátil, y la cifra que más limita." }
        - { id: eeprom, rotulo: "Recuadro naranja, abajo a la derecha", rect: [299, 137, 97, 64], texto: "EEPROM: calibraciones y configuración que deben sobrevivir al apagado. Escritura lenta." }
    requiere: { mover: [nucleo, sram] }

  - id: pregunta-integra
    tipo: tocar
    titulo: "Qué lo distingue"
    texto: "Un microprocesador es solo una unidad de cálculo. Toque todo lo que el microcontrolador lleva dentro y al microprocesador le falta."
    libro: [3, 4]
    widget:
      tipo: figura
      figura: fig-17.1
      zonas:
        - { id: nucleo, rotulo: "Recuadro blanco, a la izquierda", rect: [60, 71, 90, 72] }
        - { id: flash, rotulo: "Recuadro azul, arriba", rect: [176, 13, 101, 52] }
        - { id: perifericos, rotulo: "Recuadro verde, arriba a la derecha", rect: [299, 13, 97, 70] }
        - { id: sram, rotulo: "Recuadro rojo, abajo", rect: [176, 137, 101, 64] }
        - { id: eeprom, rotulo: "Recuadro naranja, abajo a la derecha", rect: [299, 137, 97, 64] }
    tocar:
      bien: [flash, perifericos, sram, eeprom]
      todas: true
      porque:
        nucleo: "El núcleo lo tienen los dos: es justo la unidad de cálculo del microprocesador."
    exito: "Memorias y periféricos dentro del chip: con muy pocos componentes externos gobierna un sistema entero. Es un dispositivo de control, no de cómputo."
    escalera:
      - "Al microprocesador le hacen falta memoria externa y controladores de periféricos."
    solucion: "Flash, SRAM, EEPROM y periféricos; el núcleo lo tienen los dos."

  - id: estime-instruccion
    tipo: leer
    titulo: "Una instrucción por ciclo"
    texto: "El ATmega328P ejecuta casi todas sus instrucciones en un solo ciclo de su reloj de 16 MHz. Escriba cuánto dura una."
    libro: [6]
    widget:
      tipo: figura
      figura: fig-17.1
      zonas:
        - { id: nucleo, rotulo: "Recuadro blanco, a la izquierda", rect: [60, 71, 90, 72], texto: "8 bits, RISC y Harvard: la mayoría de las instrucciones en un solo ciclo." }
    leer:
      objetivo: t_ins
      unidad: s
      tol: 0.02
      rotulo: "Tiempo por instrucción"
    exito: "62,5 ns: unos 16 millones de instrucciones por segundo."
    escalera:
      - "Un ciclo dura 1/f."
    solucion: "1 / 16 MHz = 62,5 ns."
    comprobar:
      - { t_ins: 62.5e-9 }

  - id: toque-agotada
    tipo: tocar
    titulo: "Funcionaba y ha dejado de funcionar"
    texto: "Al añadir una biblioteca gráfica, el programa se cuelga y se reinicia sin ningún mensaje. Toque el bloque que se ha agotado."
    libro: [8, 13]
    widget:
      tipo: figura
      figura: fig-17.1
      zonas:
        - { id: nucleo, rotulo: "Recuadro blanco, a la izquierda", rect: [60, 71, 90, 72] }
        - { id: flash, rotulo: "Recuadro azul, arriba", rect: [176, 13, 101, 52] }
        - { id: sram, rotulo: "Recuadro rojo, abajo", rect: [176, 137, 101, 64] }
        - { id: eeprom, rotulo: "Recuadro naranja, abajo a la derecha", rect: [299, 137, 97, 64] }
    tocar:
      bien: [sram]
      porque:
        nucleo: "El núcleo no se agota: ejecuta lo que le den, aunque las variables estén pisadas."
        flash: "Si faltara Flash, el compilador lo diría al compilar; no fallaría en marcha."
        eeprom: "La EEPROM guarda calibraciones; el programa no vive de ella mientras corre."
    exito: "La SRAM: la pila y las variables dinámicas chocan, y el fallo no avisa."
    escalera:
      - "Busque la memoria volátil donde viven las variables."
    solucion: "La SRAM de 2 KB, abajo en rojo."

  - id: pregunta-array
    tipo: leer
    titulo: "Cada variable cuenta"
    texto: "Con 2 KB de SRAM, cada variable cuenta. Escriba cuántos bytes ocupa un array de 100 lecturas de 16 bits."
    libro: [8, 12]
    widget:
      tipo: figura
      figura: fig-17.1
      zonas:
        - { id: sram, rotulo: "Recuadro rojo, abajo", rect: [176, 137, 101, 64], texto: "SRAM: 2 KB para todas las variables." }
    leer:
      objetivo: ram_a
      unidad: ""
      tol: 0.01
      rotulo: "Bytes de SRAM"
      errores:
        - { expr: "n_lec", texto: "Eso sería con lecturas de 8 bits: cada una de 16 bits ocupa 2 bytes." }
    exito: "200 bytes de los 2 KB, para un solo array: una décima parte."
    escalera:
      - "Un byte son 8 bits: ¿cuántos bytes es una lectura de 16?"
    solucion: "100 · 2 bytes = 200 bytes."
    comprobar:
      - { ram_a: 200 }

  - id: empareje-memorias
    tipo: tocar
    titulo: "Lo que sobrevive al apagado"
    texto: "Un equipo guarda su calibración, que debe sobrevivir al apagado y se escribe pocas veces. Toque la memoria donde va."
    libro: [7, 8, 9]
    widget:
      tipo: figura
      figura: fig-17.1
      zonas:
        - { id: flash, rotulo: "Recuadro azul, arriba", rect: [176, 13, 101, 52] }
        - { id: sram, rotulo: "Recuadro rojo, abajo", rect: [176, 137, 101, 64] }
        - { id: eeprom, rotulo: "Recuadro naranja, abajo a la derecha", rect: [299, 137, 97, 64] }
    tocar:
      bien: [eeprom]
      porque:
        flash: "La Flash guarda el programa: se escribe al programar y se desgasta con los ciclos."
        sram: "La SRAM es volátil: al apagar se pierde todo lo que hay en ella."
    exito: "La EEPROM: 1 KB para calibraciones y configuración. Escritura lenta y con vida limitada, así que no se escribe en cada vuelta."
    escalera:
      - "Descarte la memoria volátil y la del programa."
    solucion: "La EEPROM, abajo a la derecha."

  - id: pregunta-reloj
    tipo: leer
    titulo: "Medir el tiempo"
    texto: "Un equipo debe llevar la hora con un cristal de 50 ppm. Escriba cuántos segundos puede desviarse en 24 horas."
    libro: [17, 18]
    widget:
      tipo: figura
      figura: fig-17.1
      zonas:
        - { id: reloj, rotulo: "El reloj, a la izquierda", rect: [0, 78, 42, 62], texto: "RC interno, resonador cerámico o cristal de cuarzo." }
    leer:
      objetivo: der_x
      unidad: s
      tol: 0.1
      rotulo: "Deriva en un día"
    exito: "Unos 4 segundos al día. El resonador cerámico deriva unos 7 minutos y el RC interno, minutos u horas: para un reloj, cristal."
    escalera:
      - "Un día tiene 86 400 segundos."
      - "50 ppm son 50 millonésimas de esos segundos."
    solucion: "50 · 10⁻⁶ · 86 400 s ≈ 4 s."
    comprobar:
      - { der_x: 4.32, t_dia: 86400 }

  - id: pregunta-termina
    tipo: tocar
    titulo: "El final del programa"
    texto: "El programa acaba de ejecutar la última línea de loop(). Toque la línea que se ejecuta a continuación."
    libro: [20, 21]
    widget:
      tipo: figura
      codigo:
        lenguaje: c
        texto: |
          void setup() {
            // runs once, after reset
          }

          void loop() {
            // first line of loop
            // last line of loop
          }
      zonas:
        - { id: l1, lineas: [1], rotulo: "Primera línea" }
        - { id: l2, lineas: [2], rotulo: "Segunda línea" }
        - { id: l6, lineas: [6], rotulo: "Sexta línea" }
        - { id: l8, lineas: [8], rotulo: "Última línea" }
    tocar:
      bien: [l6]
      porque:
        l1: "setup() se ejecuta una sola vez, al liberarse el reset; no se repite."
        l2: "Eso es setup(): una vez al arrancar, nunca más."
        l8: "El final de loop() no detiene nada: el microcontrolador nunca «termina»."
    exito: "Si loop() retorna, se vuelve a llamar. Un sistema empotrado no tiene estado «parado»: ejecuta, duerme o está en reset."
    escalera:
      - "setup() se llama una vez; después, loop() repetidamente."
    solucion: "La primera línea de loop(), otra vez."

  - id: pregunta-interrupcion
    tipo: porque
    titulo: "Atender sin mirar"
    texto: "Un pin dispara una interrupción y el núcleo salta a su rutina. ¿Por qué debe ser brevísima?"
    libro: [23, 24]
    widget:
      tipo: figura
      figura: fig-17.1
      zonas:
        - { id: perifericos, rotulo: "Recuadro verde, arriba a la derecha", rect: [299, 13, 97, 70] }
    opciones:
      - texto: "Bloquea a las demás y puede perder eventos"
        bien: true
        porque: "Todo lo que se hace dentro bloquea a las demás, y una rutina larga hace perder eventos."
      - texto: "Para ahorrar memoria de programa"
        porque: "No es cuestión de Flash: es de tiempo. Mientras dura, las demás esperan."
      - texto: "Porque el núcleo va más lento dentro"
        porque: "El núcleo va igual de rápido; el problema es que, mientras dura, nada más se atiende."
    escalera:
      - "¿Qué les pasa a las demás interrupciones mientras dura?"
    solucion: "Brevísima: dentro, solo lo imprescindible."

  - id: pregunta-banco
    tipo: pregunta
    titulo: "En el banco"
    texto: "Tiene un microcontrolador nuevo que parece muerto. ¿Qué mide primero?"
    libro: [26]
    widget:
      tipo: figura
      figura: fig-17.1
      zonas:
        - { id: chip, rotulo: "El chip entero", rect: [45, 0, 360, 212] }
    opciones:
      - texto: "Su consumo"
        bien: true
        porque: "Dice si ejecuta, está en reset o duerme, antes de conectar ningún depurador."
      - texto: "La tensión de un pin de salida"
        porque: "Sin saber si ejecuta, un pin no dice nada. Primero el consumo; después, el reloj."
      - texto: "La memoria libre"
        porque: "Eso es para un programa que corre; primero hay que saber si corre."
    escalera:
      - "¿Qué medida distingue ejecutando, en reset y dormido?"
    solucion: "El consumo; después, el reloj con el osciloscopio."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [3, 8, 10, 21]
    ideas:
      - { titulo: "Todo en un chip.", texto: "Núcleo, memorias y periféricos: un dispositivo de control, no de cómputo." }
      - { titulo: "La SRAM manda.", texto: "Con 2 KB, cada variable cuenta, y el agotamiento no avisa." }
      - { titulo: "Por sus periféricos.", texto: "Se elige un microcontrolador por lo que trae, no por su velocidad." }
      - { titulo: "Nunca termina.", texto: "Ejecuta, duerme o está en reset; loop() se repite siempre." }
