# Lección 1.2 de la sección 16.1 «¿Qué es un Microcontrolador?» (cap17; etiquetas sec-17.N = impresas 16.N).
# - Los cinco bloques del ATmega328P sobre la figura 16.1 (fig-17.1), con zonas en cada bloque.
# - El tiempo por instrucción a 16 MHz (62,5 ns) como estimación: t = 1/f.
# Paso práctico: «tocar» el bloque que se agota sin avisar (la SRAM).
leccion: cap17/sec-17.1

libro:
  3: "Un microcontrolador integra en un solo chip el núcleo"
  4: "el microcontrolador es un dispositivo de control, no de cómputo"
  6: "a 16 MHz, 62,5 ns por instrucción"
  7: "Se escribe al programar y se desgasta con los ciclos"
  8: "esa cifra es la que más limita en la práctica"
  9: "para calibraciones, contadores y configuración que deban sobrevivir al apagado"
  10: "La elección de un microcontrolador se hace por sus periféricos, no por su velocidad"
  12: "un array de 100 lecturas de 16 bits, 200"
  13: "Y el fallo por agotamiento no avisa"
  17: "Cristal de cuarzo"
  18: "para un reloj o una medida de tiempo, cristal"
  21: "el microcontrolador nunca «termina»"
  23: "un periférico o un pin dispara una interrupción"
  24: "las rutinas de interrupción deben ser brevísimas"
  26: "Lo primero que conviene medir en un microcontrolador nuevo es su consumo"
  27: "Los cinco bloques de un microcontrolador y para qué sirve cada uno."

modelo:
  valores:
    f_ck: { sim: "f", nombre: "frecuencia del reloj", unidad: Hz, valor: 16000000 }
  calculos:
    t_ins: { expr: "1/f_ck", sim: "t", nombre: "tiempo por instrucción", unidad: s }

tarjetas:
  - id: explore-bloques
    tipo: explorar
    titulo: "Un ordenador en un chip"
    texto: "Núcleo, Flash, SRAM, EEPROM y periféricos, en un solo chip. Toque los bloques y lea para qué sirve cada uno."
    libro: [3, 27]
    widget:
      tipo: figura
      figura: fig-17.1
      zonas:
        - { id: nucleo, rotulo: "Recuadro blanco, a la izquierda", rect: [60, 71, 90, 72], texto: "El núcleo ejecuta las instrucciones: 8 bits, RISC y Harvard, la mayoría en un solo ciclo." }
        - { id: flash, rotulo: "Recuadro azul, arriba", rect: [176, 13, 101, 52], texto: "Flash: el programa, no volátil. Se desgasta con los ciclos de escritura." }
        - { id: perifericos, rotulo: "Recuadro verde, arriba a la derecha", rect: [299, 13, 97, 70], texto: "Periféricos: E/S, temporizadores, A/D, PWM, UART, I²C, SPI, watchdog." }
        - { id: sram, rotulo: "Recuadro rojo, abajo", rect: [176, 137, 101, 64], texto: "SRAM: las variables mientras el programa corre. Volátil, y la cifra que más limita." }
        - { id: eeprom, rotulo: "Recuadro naranja, abajo a la derecha", rect: [299, 137, 97, 64], texto: "EEPROM: calibraciones y configuración que deben sobrevivir al apagado. Escritura lenta." }
    requiere: { mover: [nucleo, sram] }

  - id: pregunta-integra
    tipo: pregunta
    titulo: "Qué lo distingue"
    texto: "¿Qué tiene un microcontrolador que no tiene un microprocesador?"
    libro: [3, 4]
    widget:
      tipo: figura
      figura: fig-17.1
      zonas:
        - { id: chip, rotulo: "El chip entero", rect: [45, 0, 360, 212] }
    opciones:
      - texto: "Memoria y periféricos dentro del mismo chip"
        bien: true
        porque: "Núcleo, memorias y periféricos integrados: con muy pocos componentes externos gobierna un sistema entero."
      - texto: "Más potencia de cálculo"
        porque: "La integración no busca potencia, sino autonomía y coste: es un dispositivo de control, no de cómputo."
      - texto: "Un núcleo más rápido"
        porque: "Un microprocesador es una unidad de cálculo; lo que le falta es memoria y periféricos, no velocidad."
    escalera:
      - "Mire qué hay dentro del recuadro «un solo chip»."
    solucion: "Lo integra todo: núcleo, memoria de programa, memoria de datos y periféricos."

  - id: estime-instruccion
    tipo: pregunta
    titulo: "Una instrucción por ciclo"
    texto: "El ATmega328P ejecuta casi todas sus instrucciones en un solo ciclo de su reloj de 16 MHz. ¿Cuánto dura una?"
    libro: [6]
    estimar:
      objetivo: "t_ins"
      unidad: s
      min: 0
      max: 0.0000002
      paso: 0.0000000005
      inicio: 0.00000015
      tol: 0.05
      rotulo: "Tiempo por instrucción"
    exito: "62,5 ns: unos 16 millones de instrucciones por segundo."
    pistas:
      - { cuando: { valor: estimacion, mayor: 0.0000000657 }, texto: "Demasiado: un ciclo es la inversa de 16 millones de hercios." }
      - { texto: "Se ha quedado corto: un ciclo es la inversa de 16 millones de hercios." }
    escalera:
      - "Un ciclo dura 1/f."
    solucion: "1 / 16 MHz = 62,5 ns."
    comprobar:
      - { t_ins: 62.5e-9 }

  - id: toque-agotada
    tipo: tocar
    titulo: "Funcionaba y ha dejado de funcionar"
    texto: "Al añadir una biblioteca gráfica, el programa se cuelga y se reinicia sin ningún mensaje. Toque el bloque que se ha agotado."
    libro: [8, 13]
    widget:
      tipo: figura
      figura: fig-17.1
      zonas:
        - { id: nucleo, rotulo: "Recuadro blanco, a la izquierda", rect: [60, 71, 90, 72] }
        - { id: flash, rotulo: "Recuadro azul, arriba", rect: [176, 13, 101, 52] }
        - { id: sram, rotulo: "Recuadro rojo, abajo", rect: [176, 137, 101, 64] }
        - { id: eeprom, rotulo: "Recuadro naranja, abajo a la derecha", rect: [299, 137, 97, 64] }
    tocar:
      bien: [sram]
      porque:
        nucleo: "El núcleo no se agota: ejecuta lo que le den, aunque las variables estén pisadas."
        flash: "Si faltara Flash, el compilador lo diría al compilar; no fallaría en marcha."
        eeprom: "La EEPROM guarda calibraciones; el programa no vive de ella mientras corre."
    exito: "La SRAM: la pila y las variables dinámicas chocan, y el fallo no avisa."
    escalera:
      - "Busque la memoria volátil donde viven las variables."
    solucion: "La SRAM de 2 KB, abajo en rojo."

  - id: pregunta-array
    tipo: predecir
    titulo: "Cada variable cuenta"
    texto: "¿Cuánta SRAM ocupa un array de 100 lecturas de 16 bits?"
    libro: [8, 12]
    widget:
      tipo: figura
      figura: fig-17.1
      zonas:
        - { id: sram, rotulo: "Recuadro rojo, abajo", rect: [176, 137, 101, 64] }
    opciones:
      - texto: "200 bytes"
        bien: true
        porque: "16 bits son 2 bytes: 100 lecturas, 200 bytes de los 2 KB."
      - texto: "100 bytes"
        porque: "Eso sería con lecturas de 8 bits; cada una de 16 bits ocupa 2 bytes."
      - texto: "Los 2 KB enteros"
        porque: "Ocupa 200 bytes de los 2 KB: una décima parte, para un solo array."
    escalera:
      - "Un byte son 8 bits."
    solucion: "100 · 2 bytes = 200 bytes."

  - id: empareje-memorias
    tipo: pregunta
    titulo: "Tres memorias"
    texto: "Empareje cada memoria con lo que guarda."
    libro: [7, 8, 9]
    widget:
      tipo: figura
      figura: fig-17.1
      zonas:
        - { id: chip, rotulo: "El chip entero", rect: [45, 0, 360, 212] }
    emparejar:
      - ["Flash", "El programa; se desgasta con los ciclos"]
      - ["SRAM", "Las variables durante la ejecución"]
      - ["EEPROM", "Calibraciones que sobreviven al apagado"]
    exito: "Flash para el código, SRAM para las variables y EEPROM para lo que debe durar."
    pistas:
      - { texto: "La que se escribe al programar guarda el código; la volátil, las variables." }
    escalera:
      - "Solo una de las tres es volátil."
    solucion: "Flash, el programa; SRAM, las variables; EEPROM, la calibración."

  - id: pregunta-reloj
    tipo: pregunta
    titulo: "Medir el tiempo"
    texto: "Un equipo debe llevar la hora. ¿Qué base de tiempo pide?"
    libro: [17, 18]
    widget:
      tipo: figura
      figura: fig-17.1
      zonas:
        - { id: reloj, rotulo: "El reloj, a la izquierda", rect: [0, 78, 42, 62] }
    opciones:
      - texto: "Un cristal de cuarzo"
        bien: true
        porque: "De 30 a 50 ppm: unos 4 segundos de deriva en 24 horas."
      - texto: "Un resonador cerámico"
        porque: "Basta para una UART, pero deriva unos 7 minutos al día."
      - texto: "El oscilador RC interno"
        porque: "Del 1 al 10 %: minutos u horas al día. Sirve para parpadear un LED."
    escalera:
      - "Compare la deriva de cada fuente en un día."
    solucion: "Cristal: 4 segundos en 24 horas."

  - id: pregunta-termina
    tipo: pregunta
    titulo: "El final del programa"
    texto: "En Arduino, ¿qué pasa cuando loop() llega a su última línea?"
    libro: [21]
    widget:
      tipo: figura
      figura: fig-17.1
      zonas:
        - { id: nucleo, rotulo: "Recuadro blanco, a la izquierda", rect: [60, 71, 90, 72] }
    opciones:
      - texto: "Se vuelve a llamar"
        bien: true
        porque: "Un sistema empotrado no tiene estado «parado»: ejecuta, duerme o está en reset."
      - texto: "El microcontrolador se detiene"
        porque: "No hay a dónde volver: si loop() retorna, se llama otra vez."
      - texto: "Se reinicia y repite setup()"
        porque: "setup() se ejecuta una sola vez; lo que se repite es loop()."
    escalera:
      - "El microcontrolador nunca «termina»."
    solucion: "Se vuelve a llamar, indefinidamente."

  - id: pregunta-interrupcion
    tipo: porque
    titulo: "Atender sin mirar"
    texto: "Un pin dispara una interrupción y el núcleo salta a su rutina. ¿Por qué debe ser brevísima?"
    libro: [23, 24]
    widget:
      tipo: figura
      figura: fig-17.1
      zonas:
        - { id: perifericos, rotulo: "Recuadro verde, arriba a la derecha", rect: [299, 13, 97, 70] }
    opciones:
      - texto: "Bloquea a las demás y puede perder eventos"
        bien: true
        porque: "Todo lo que se hace dentro bloquea a las demás, y una rutina larga hace perder eventos."
      - texto: "Para ahorrar memoria de programa"
        porque: "No es cuestión de Flash: es de tiempo. Mientras dura, las demás esperan."
      - texto: "Porque el núcleo va más lento dentro"
        porque: "El núcleo va igual de rápido; el problema es que, mientras dura, nada más se atiende."
    escalera:
      - "¿Qué les pasa a las demás interrupciones mientras dura?"
    solucion: "Brevísima: dentro, solo lo imprescindible."

  - id: pregunta-banco
    tipo: pregunta
    titulo: "En el banco"
    texto: "Tiene un microcontrolador nuevo que parece muerto. ¿Qué mide primero?"
    libro: [26]
    widget:
      tipo: figura
      figura: fig-17.1
      zonas:
        - { id: chip, rotulo: "El chip entero", rect: [45, 0, 360, 212] }
    opciones:
      - texto: "Su consumo"
        bien: true
        porque: "Dice si ejecuta, está en reset o duerme, antes de conectar ningún depurador."
      - texto: "La tensión de un pin de salida"
        porque: "Sin saber si ejecuta, un pin no dice nada. Primero el consumo; después, el reloj."
      - texto: "La memoria libre"
        porque: "Eso es para un programa que corre; primero hay que saber si corre."
    escalera:
      - "¿Qué medida distingue ejecutando, en reset y dormido?"
    solucion: "El consumo; después, el reloj con el osciloscopio."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [3, 8, 10, 21]
    ideas:
      - { titulo: "Todo en un chip.", texto: "Núcleo, memorias y periféricos: un dispositivo de control, no de cómputo." }
      - { titulo: "La SRAM manda.", texto: "Con 2 KB, cada variable cuenta, y el agotamiento no avisa." }
      - { titulo: "Por sus periféricos.", texto: "Se elige un microcontrolador por lo que trae, no por su velocidad." }
      - { titulo: "Nunca termina.", texto: "Ejecuta, duerme o está en reset; loop() se repite siempre." }
