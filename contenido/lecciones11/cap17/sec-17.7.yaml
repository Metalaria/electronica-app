# Lección 1.2 de la sección 16.7 «Sensores, Actuadores y Módulos» (cap17; etiquetas sec-17.N = impresas 16.N).
# - Los módulos como circuitos con decisiones tomadas: tensión, consumo y lo que traen de más.
# - La foto de la figura 16.12 (fig-17.12, píxeles de la foto de 1600 × 588): el HC-SR04 por la cara de componentes
#   (U3 = LM324, U1 = microcontrolador, U2 = MAX3232) y el 28BYJ-48 con su placa ULN2003.
# - Sin modelo numérico.
# Paso práctico: «tocar» en la foto el chip que excita el emisor ultrasónico.
leccion: cap17/sec-17.7

libro:
  173: "un módulo es un circuito con sus propias decisiones tomadas"
  174: "Conectar un módulo de 3,3 V a una placa de 5 V puede funcionar o puede destruirlo"
  175: "Un módulo de radio puede pedir picos de 200 mA que el pin de 3,3 V de la placa no da"
  176: "Al conectar varios, esos añadidos se suman"
  182: "un pasivo alimentado con continua solo hace clic al conectarlo"
  188: "verificar con dos puntos conocidos"
  191: "su esquema —cuando está publicado— vale más que el propio módulo"
  193: "Un módulo nuevo se prueba solo, antes de integrarlo"
  194: "Si baja al transmitir o al medir, el problema es de alimentación y no del módulo"
  196: "a la derecha el MAX3232 (U2), que excita el emisor"

modelo: { valores: {}, calculos: {} }

tarjetas:
  - id: explore-modulos
    tipo: explorar
    titulo: "Un módulo es un circuito"
    texto: "Un sensor ultrasónico y un motor paso a paso con su placa de control, vistos de cerca. Toque los chips."
    libro: [173, 196]
    widget:
      tipo: figura
      figura: fig-17.12
      zonas:
        - { id: u3, rotulo: "Chip de la izquierda, en la placa azul", rect: [50, 170, 155, 125], texto: "U3, un LM324: el amplificador del eco." }
        - { id: u1, rotulo: "Chip del centro, en la placa azul", rect: [355, 140, 155, 125], texto: "U1: el microcontrolador del módulo." }
        - { id: u2, rotulo: "Chip de la derecha, en la placa azul", rect: [660, 120, 130, 180], texto: "U2, el MAX3232: excita el emisor." }
        - { id: uln, rotulo: "Placa pequeña, junto al motor", rect: [1250, 210, 190, 170], texto: "La placa de control ULN2003 del motor paso a paso 28BYJ-48." }
    requiere: { mover: [u1, u2] }

  - id: toque-emisor
    tipo: tocar
    titulo: "Quién excita el emisor"
    texto: "En el sensor ultrasónico, toque el chip que excita el emisor."
    libro: [196]
    widget:
      tipo: figura
      figura: fig-17.12
      zonas:
        - { id: u3, rotulo: "Chip de la izquierda, en la placa azul", rect: [50, 170, 155, 125] }
        - { id: u1, rotulo: "Chip del centro, en la placa azul", rect: [355, 140, 155, 125] }
        - { id: u2, rotulo: "Chip de la derecha, en la placa azul", rect: [660, 120, 130, 180] }
        - { id: pines, rotulo: "Los cuatro pines de abajo", rect: [340, 340, 180, 150] }
    tocar:
      bien: [u2]
      porque:
        u3: "Es el LM324, el amplificador del eco: escucha, no emite."
        u1: "Es el microcontrolador del módulo: decide, pero no excita el emisor."
        pines: "Son los pines de conexión con la placa principal."
    exito: "El MAX3232 (U2), a la derecha."
    escalera:
      - "Hay un chip para escuchar el eco y otro para emitir."
    solucion: "U2, el MAX3232, a la derecha."

  - id: empareje-mirar
    tipo: pregunta
    titulo: "Antes de conectarlo"
    texto: "Empareje cada cosa que trae un módulo con el problema que puede dar."
    libro: [174, 175, 176]
    widget:
      tipo: figura
      figura: fig-17.12
      zonas:
        - { id: hc, rotulo: "La placa azul", rect: [40, 40, 780, 340] }
    emparejar:
      - ["Su tensión de trabajo", "Uno de 3,3 V en una placa de 5 V puede destruirse"]
      - ["Su consumo", "Picos que el pin de 3,3 V no da"]
      - ["Lo que trae de más", "Pull-ups que se suman al conectar varios"]
    exito: "Un módulo es un circuito con sus propias decisiones tomadas."
    pistas:
      - { texto: "Los añadidos de varios módulos se suman." }
    escalera:
      - "Uno es de niveles, otro de alimentación y otro de lo que se suma."
    solucion: "Tensión, niveles; consumo, picos; añadidos, pull-ups sumados."

  - id: predecir-radio
    tipo: predecir
    titulo: "Funciona a veces"
    texto: "Alimenta un módulo de radio desde el pin de 3,3 V del Arduino. ¿Qué espera?"
    libro: [175]
    widget:
      tipo: figura
      figura: fig-17.12
      zonas:
        - { id: hc, rotulo: "La placa azul", rect: [40, 40, 780, 340] }
    opciones:
      - texto: "Que funcione a veces"
        bien: true
        porque: "Pide picos de 200 mA que ese pin no da: el fallo es intermitente."
      - texto: "Que funcione siempre"
        porque: "Los picos de 200 mA superan lo que da el pin de 3,3 V."
      - texto: "Que no encienda nunca"
        porque: "En reposo puede ir; falla en los picos, por eso «funciona a veces»."
    escalera:
      - "Compare los picos del módulo con lo que da el pin de 3,3 V."
    solucion: "Funcionará a veces: los picos de 200 mA hunden el pin de 3,3 V."

  - id: predecir-zumbador
    tipo: predecir
    titulo: "Dos zumbadores"
    texto: "El activo y el pasivo son casi iguales por fuera. Si aplica continua a un zumbador pasivo, ¿qué hace?"
    libro: [182]
    widget:
      tipo: figura
      figura: fig-17.12
      zonas:
        - { id: hc, rotulo: "La placa azul", rect: [40, 40, 780, 340] }
    opciones:
      - texto: "Solo un clic al conectarlo"
        bien: true
        porque: "El pasivo es solo el transductor: necesita una onda cuadrada, por ejemplo con tone()."
      - texto: "Pita siempre en el mismo tono"
        porque: "Eso hace el activo, que lleva su oscilador dentro."
      - texto: "Pita a la frecuencia que se elija"
        porque: "Para elegir nota hay que darle una onda cuadrada, no continua."
    escalera:
      - "¿Cuál de los dos lleva su propio oscilador?"
    solucion: "Solo hace clic: el pasivo necesita una onda cuadrada."

  - id: pregunta-mediocre
    tipo: pregunta
    titulo: "Dos módulos con el mismo nombre"
    texto: "Sus lecturas tienen offset y cambian entre unidades. ¿Cómo se defiende?"
    libro: [188]
    widget:
      tipo: figura
      figura: fig-17.12
      zonas:
        - { id: hc, rotulo: "La placa azul", rect: [40, 40, 780, 340] }
    opciones:
      - texto: "Verificándolo con dos puntos conocidos"
        bien: true
        porque: "Antes de fiarse de sus números: el módulo puede llevar otro sensor u otra calibración."
      - texto: "Fiándose del nombre del módulo"
        porque: "Dos módulos con el mismo nombre pueden llevar sensores distintos."
      - texto: "Promediando más lecturas"
        porque: "Un offset no se promedia: hay que medir contra valores conocidos."
    escalera:
      - "¿Con qué compara un instrumento del que no se fía?"
    solucion: "Con dos puntos conocidos, antes de fiarse."

  - id: pregunta-esquema
    tipo: pregunta
    titulo: "Del módulo a la placa propia"
    texto: "Pasa del prototipo con módulos a un producto. ¿Qué vale más que el propio módulo?"
    libro: [191]
    widget:
      tipo: figura
      figura: fig-17.12
      zonas:
        - { id: hc, rotulo: "La placa azul", rect: [40, 40, 780, 340] }
    opciones:
      - texto: "Su esquema publicado"
        bien: true
        porque: "Contiene las decisiones ya tomadas y probadas: se integra en la placa propia."
      - texto: "Su precio"
        porque: "Cuesta más por unidad que integrar su circuito: lo valioso es el esquema."
      - texto: "Su disponibilidad"
        porque: "No está garantizada: es uno de sus inconvenientes en un producto."
    escalera:
      - "¿Qué se lleva a la placa propia?"
    solucion: "Su esquema, cuando está publicado."

  - id: pregunta-banco
    tipo: pregunta
    titulo: "En el banco"
    texto: "Un módulo falla al transmitir, y la tensión en el propio módulo baja justo entonces. ¿Dónde está el problema?"
    libro: [193, 194]
    widget:
      tipo: figura
      figura: fig-17.12
      zonas:
        - { id: hc, rotulo: "La placa azul", rect: [40, 40, 780, 340] }
    opciones:
      - texto: "En la alimentación"
        bien: true
        porque: "Si baja al transmitir o al medir, el problema es de alimentación y no del módulo."
      - texto: "En el módulo"
        porque: "El módulo se queda sin tensión: la causa está en lo que lo alimenta."
      - texto: "En el programa"
        porque: "La caída de tensión al transmitir apunta a la alimentación."
    escalera:
      - "¿Qué medida ha cambiado justo al fallar?"
    solucion: "En la alimentación."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [173, 175, 182, 193]
    ideas:
      - { titulo: "Un circuito, no un componente.", texto: "Tensión, consumo y lo que trae de más: mírelo antes." }
      - { titulo: "Los picos.", texto: "Un módulo de radio con picos de 200 mA no vive del pin de 3,3 V." }
      - { titulo: "Zumbadores.", texto: "El activo pita con continua; el pasivo necesita una onda cuadrada." }
      - { titulo: "Solo primero.", texto: "Pruebe cada módulo solo, y mida su alimentación mientras trabaja." }
