# Lección 1.2 de la sección 16.7 «Sensores, Actuadores y Módulos» (cap17; etiquetas sec-17.N = impresas 16.N).
# - Los módulos como circuitos con decisiones tomadas: tensión, consumo y lo que traen de más.
# - La foto de la figura 16.12 (fig-17.12, píxeles de la foto de 1600 × 588): el HC-SR04 por la cara de componentes
#   (U3 = LM324, U1 = microcontrolador, U2 = MAX3232) y el 28BYJ-48 con su placa ULN2003.
# - Sin modelo numérico.
# Paso práctico: «tocar» en la foto el chip que excita el emisor ultrasónico.
# 1.2.1 (autor121-sens, «aprender haciendo», GUIA §13): en la figura 16.11 (rejilla de 3 × 2 módulos de 17.11.py,
# cada celda de 150 × 128 px) se tocan el módulo cuyos pull-ups se suman y los drivers de potencia; se escribe cuántas
# veces superan los picos de la radio lo que da el pin de 3,3 V; el zumbador pasivo se hace sonar en una gráfica; en la
# foto 16.12 se toca dónde se mide la alimentación del propio módulo. «Su esquema vale más que el módulo» pasa al
# resumen. Queda una pregunta de opciones: el módulo mediocre.
leccion: cap17/sec-17.7

libro:
  180: "Drivers de potencia"
  195: "Módulos y sensores habituales"
  173: "un módulo es un circuito con sus propias decisiones tomadas"
  174: "Conectar un módulo de 3,3 V a una placa de 5 V puede funcionar o puede destruirlo"
  175: "Un módulo de radio puede pedir picos de 200 mA que el pin de 3,3 V de la placa no da"
  176: "Al conectar varios, esos añadidos se suman"
  182: "un pasivo alimentado con continua solo hace clic al conectarlo"
  188: "verificar con dos puntos conocidos"
  191: "su esquema —cuando está publicado— vale más que el propio módulo"
  193: "Un módulo nuevo se prueba solo, antes de integrarlo"
  194: "Si baja al transmitir o al medir, el problema es de alimentación y no del módulo"
  196: "a la derecha el MAX3232 (U2), que excita el emisor"
  "cap17#47": "50 mA en el raíl de 3,3 V"

modelo:
  valores:
    I_pic: { sim: "I_{pico}", nombre: "picos del módulo de radio", unidad: A, valor: 0.2 }
    I_33: { sim: "I_{3,3}", nombre: "lo que da el pin de 3,3 V", unidad: A, valor: 0.05 }
    m_z: { sim: "s", nombre: "señal aplicada", unidad: "", valor: 0 }
  calculos:
    k_pic: { expr: "I_pic/I_33", sim: "k", nombre: "veces que el pico supera al pin", unidad: "" }
    suena: { expr: "m_z", sim: "s", nombre: "el pasivo pita", unidad: "" }

tarjetas:
  - id: explore-modulos
    tipo: explorar
    titulo: "Un módulo es un circuito"
    texto: "Un sensor ultrasónico y un motor paso a paso con su placa de control, vistos de cerca. Toque los chips."
    libro: [173, 196]
    widget:
      tipo: figura
      figura: fig-17.12
      zonas:
        - { id: u3, rotulo: "Chip de la izquierda, en la placa azul", rect: [50, 170, 155, 125], texto: "U3, un LM324: el amplificador del eco." }
        - { id: u1, rotulo: "Chip del centro, en la placa azul", rect: [355, 140, 155, 125], texto: "U1: el microcontrolador del módulo." }
        - { id: u2, rotulo: "Chip de la derecha, en la placa azul", rect: [660, 120, 130, 180], texto: "U2, el MAX3232: excita el emisor." }
        - { id: uln, rotulo: "Placa pequeña, junto al motor", rect: [1250, 210, 190, 170], texto: "La placa de control ULN2003 del motor paso a paso 28BYJ-48." }
    requiere: { mover: [u1, u2] }

  - id: toque-emisor
    tipo: tocar
    titulo: "Quién excita el emisor"
    texto: "En el sensor ultrasónico, toque el chip que excita el emisor."
    libro: [196]
    widget:
      tipo: figura
      figura: fig-17.12
      zonas:
        - { id: u3, rotulo: "Chip de la izquierda, en la placa azul", rect: [50, 170, 155, 125] }
        - { id: u1, rotulo: "Chip del centro, en la placa azul", rect: [355, 140, 155, 125] }
        - { id: u2, rotulo: "Chip de la derecha, en la placa azul", rect: [660, 120, 130, 180] }
        - { id: pines, rotulo: "Los cuatro pines de abajo", rect: [340, 340, 180, 150] }
    tocar:
      bien: [u2]
      porque:
        u3: "Es el LM324, el amplificador del eco: escucha, no emite."
        u1: "Es el microcontrolador del módulo: decide, pero no excita el emisor."
        pines: "Son los pines de conexión con la placa principal."
    exito: "El MAX3232 (U2), a la derecha."
    escalera:
      - "Hay un chip para escuchar el eco y otro para emitir."
    solucion: "U2, el MAX3232, a la derecha."

  - id: empareje-mirar
    tipo: tocar
    titulo: "Lo que trae de más"
    texto: "Conecta varios módulos iguales en el mismo bus y lo que cada uno trae de más se suma. Toque el módulo en que eso pasa."
    libro: [176, 195]
    widget:
      tipo: figura
      figura: fig-17.11
      zonas:
        - { id: hc, rotulo: "Arriba a la izquierda", rect: [0, 0, 150, 128] }
        - { id: servo, rotulo: "Arriba en el centro", rect: [150, 0, 150, 128] }
        - { id: oled, rotulo: "Arriba a la derecha", rect: [300, 0, 150, 128] }
        - { id: rele, rotulo: "Abajo a la izquierda", rect: [0, 128, 150, 128] }
        - { id: dht, rotulo: "Abajo en el centro", rect: [150, 128, 150, 128] }
        - { id: l298, rotulo: "Abajo a la derecha", rect: [300, 128, 150, 128] }
    tocar:
      bien: [oled]
      porque:
        hc: "Sus pines Trig y Echo son suyos: no se comparten con otros módulos."
        servo: "Cada servo lleva su propia señal de PWM."
        rele: "Cada relé tiene su entrada IN propia."
        dht: "Su línea de datos va a un pin propio."
        l298: "Es un driver de potencia: sus entradas son suyas."
    exito: "La OLED es I²C: muchos módulos traen sus pull-ups, y cinco en paralelo dejan la resistencia tan baja que el bus deja de funcionar."
    escalera:
      - "¿Qué módulo va por un bus de dos líneas compartidas?"
    solucion: "La pantalla OLED I²C."

  - id: toque-drivers
    tipo: tocar
    titulo: "Drivers de potencia"
    texto: "En los drivers de potencia hay que mirar la corriente real, la disipación y si traen el diodo de rueda libre. Toque los dos que lo son."
    libro: [180, 195]
    widget:
      tipo: figura
      figura: fig-17.11
      zonas:
        - { id: hc, rotulo: "Arriba a la izquierda", rect: [0, 0, 150, 128] }
        - { id: servo, rotulo: "Arriba en el centro", rect: [150, 0, 150, 128] }
        - { id: oled, rotulo: "Arriba a la derecha", rect: [300, 0, 150, 128] }
        - { id: rele, rotulo: "Abajo a la izquierda", rect: [0, 128, 150, 128] }
        - { id: dht, rotulo: "Abajo en el centro", rect: [150, 128, 150, 128] }
        - { id: l298, rotulo: "Abajo a la derecha", rect: [300, 128, 150, 128] }
    tocar:
      bien: [rele, l298]
      todas: true
      porque:
        hc: "Es un sensor de distancia: no mueve carga."
        servo: "Es un actuador con su electrónica dentro; se gobierna con PWM, no es un driver."
        oled: "Es una pantalla."
        dht: "Es un sensor de temperatura y humedad."
    exito: "El módulo de relé y el L298N, doble puente en H. Con carga inductiva, el diodo de rueda libre no es opcional."
    escalera:
      - "Busque los que conmutan una carga: un relé y un puente en H."
    solucion: "El relé y el L298N."

  - id: predecir-radio
    tipo: leer
    titulo: "Funciona a veces"
    texto: "Un módulo de radio pide picos de 200 mA, y el pin de 3,3 V del Arduino da 50 mA. Escriba cuántas veces lo supera."
    libro: ["cap17#47", 175]
    widget:
      tipo: figura
      figura: fig-17.11
      zonas:
        - { id: oled, rotulo: "Arriba a la derecha", rect: [300, 0, 150, 128], texto: "Muchos módulos son de 3,3 V." }
    leer:
      objetivo: k_pic
      unidad: ""
      tol: 0.01
      rotulo: "Veces"
    exito: "Cuatro veces: en reposo puede ir, y en cada pico se hunde. Es la causa de los módulos que «funcionan a veces»."
    escalera:
      - "Divida el pico entre lo que da el pin."
    solucion: "200 mA / 50 mA = 4."
    comprobar:
      - { k_pic: 4, I_pic: 0.2, I_33: 0.05 }

  - id: predecir-zumbador
    tipo: explorar
    titulo: "Dos zumbadores"
    texto: "El activo y el pasivo son casi iguales por fuera. Elija la señal con la que el pasivo pita."
    libro: [182]
    widget:
      tipo: grafica
      x: { id: t, min: 0, max: 0.004, unidad: s, rotulo: "t" }
      y: { min: -0.5, max: 5.5, unidad: V, rotulo: "v" }
      curvas:
        - { expr: "5*(1 - m_z) + m_z*5*(1 - floor(t*1000 - floor(t*1000) + 0.5))", color: azul, rotulo: "señal del zumbador" }
      mandos:
        - { valor: m_z, lista: [0, 1], nombres: ["Continua", "Onda cuadrada"], rotulo: "Señal" }
    objetivo:
      condiciones:
        - { valor: suena, min: 1, rotulo: "El pasivo pita" }
      logrado: "El pasivo es solo el transductor: necesita una onda cuadrada, por ejemplo con tone(). Con continua solo hace un clic al conectarlo; el activo lleva su oscilador y pita con continua, siempre en el mismo tono."
      pistas:
        - { texto: "Con continua solo hace clic al conectarlo: le falta el oscilador." }
    escalera:
      - "¿Cuál de los dos lleva su propio oscilador?"
    solucion: "La onda cuadrada."

  - id: pregunta-mediocre
    tipo: pregunta
    titulo: "Dos módulos con el mismo nombre"
    texto: "Sus lecturas tienen offset y cambian entre unidades. ¿Cómo se defiende?"
    libro: [188]
    widget:
      tipo: figura
      figura: fig-17.12
      zonas:
        - { id: hc, rotulo: "La placa azul", rect: [40, 40, 780, 340] }
    opciones:
      - texto: "Verificándolo con dos puntos conocidos"
        bien: true
        porque: "Antes de fiarse de sus números: el módulo puede llevar otro sensor u otra calibración."
      - texto: "Fiándose del nombre del módulo"
        porque: "Dos módulos con el mismo nombre pueden llevar sensores distintos."
      - texto: "Promediando más lecturas"
        porque: "Un offset no se promedia: hay que medir contra valores conocidos."
    escalera:
      - "¿Con qué compara un instrumento del que no se fía?"
    solucion: "Con dos puntos conocidos, antes de fiarse."

  - id: pregunta-banco
    tipo: tocar
    titulo: "En el banco"
    texto: "Un módulo falla al transmitir. Toque dónde pone las puntas para medir la tensión que de verdad le llega mientras trabaja."
    libro: [193, 194]
    widget:
      tipo: figura
      figura: fig-17.12
      zonas:
        - { id: u3, rotulo: "Chip de la izquierda, en la placa azul", rect: [50, 170, 155, 125] }
        - { id: u1, rotulo: "Chip del centro, en la placa azul", rect: [355, 140, 155, 125] }
        - { id: u2, rotulo: "Chip de la derecha, en la placa azul", rect: [660, 120, 130, 180] }
        - { id: pines, rotulo: "Los cuatro pines de abajo", rect: [340, 340, 180, 150] }
    tocar:
      bien: [pines]
      porque:
        u3: "Es el amplificador del eco; la alimentación entra al módulo por otro sitio."
        u1: "Es el microcontrolador del módulo: la tensión que importa es la que entra al módulo."
        u2: "Es el chip que excita el emisor; la alimentación del módulo llega por sus pines."
    exito: "VCC y GND, en el propio módulo. Si la tensión baja al transmitir o al medir, el problema es de alimentación y no del módulo."
    escalera:
      - "La tensión que importa es la que entra al módulo, no la de la placa."
    solucion: "En sus pines de alimentación, VCC y GND."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [173, 174, 175, 191, 193]
    ideas:
      - { titulo: "Un circuito, no un componente.", texto: "Tensión, consumo y lo que trae de más: mírelo antes." }
      - { titulo: "Los picos.", texto: "Un módulo de radio con picos de 200 mA no vive del pin de 3,3 V." }
      - { titulo: "Solo primero.", texto: "Pruebe cada módulo solo, y mida su alimentación mientras trabaja." }
      - { titulo: "Del módulo a la placa.", texto: "Su esquema publicado vale más que el propio módulo: contiene las decisiones tomadas." }
