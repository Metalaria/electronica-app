# Lección 1.2 de la sección 16.6 «Comunicaciones: Serial, I²C y SPI» (cap17; etiquetas sec-17.N = impresas 16.N).
# - Los tres buses del Arduino, la trampa de cada uno y el criterio de elección sobre la figura 16.10 (fig-17.10).
# - Sin modelo numérico: la sección no da valores de los pull-ups ni de los buses.
# Paso práctico: «tocar» el bus cuyos módulos se estorban al sumarse (los pull-ups de I²C).
# 1.2.1 (autor121-sens, «aprender haciendo», GUIA §13): el módulo en los pines 0 y 1 se vive en un circuito
# «logica» (el conversor USB y el módulo, dos salidas tri-estado en la línea RX: contención); en la figura 16.10 se
# tocan el bus de los pull-ups, el de las direcciones, el de los datos desplazados y el del módulo lejano; se escriben
# los pines de SPI con tres esclavos. El serie por software pasa al «logrado» de la contención. Queda una pregunta de
# opciones: la basura sistemática.
leccion: cap17/sec-17.6

libro:
  149: "aquí interesa cuándo usar cada una y qué trampas tiene en Arduino"
  152: "Monitor serie para depurar"
  153: "es la causa de que una placa deje de aceptar programas mientras hay algo conectado ahí"
  154: "hasta unos 38 400 baudios con fiabilidad"
  155: "un desajuste produce caracteres basura de forma sistemática, no aleatoria"
  158: "la resistencia resultante puede ser demasiado baja y el bus deja de funcionar"
  159: "con el escáner de bus como herramienta de diagnóstico obligatoria"
  162: "no hay direcciones, pull-ups ni arbitraje"
  164: "Un pin de selección por dispositivo, que consume pines rápidamente"
  165: "la comunicación «funciona» y devuelve valores incorrectos"
  167: "Serial con transceptor RS-485"
  169: "distingue «no está conectado» de «está en otra dirección»"
  170: "Los tres buses del Arduino con la trampa característica de cada uno y el criterio de elección."

modelo:
  valores:
    n_esc: { sim: "n", nombre: "esclavos SPI", unidad: "", valor: 3 }
  calculos:
    p_spi: { expr: "3 + n_esc", sim: "p", nombre: "pines de SPI", unidad: "" }

tarjetas:
  - id: explore-buses
    tipo: explorar
    titulo: "Tres buses, tres trampas"
    texto: "Serie, I²C y SPI: toque cada uno y lea qué pines usa y qué trampa tiene en Arduino."
    libro: [149, 170]
    widget:
      tipo: figura
      figura: fig-17.10
      zonas:
        - { id: serie, rotulo: "Recuadro naranja, a la izquierda", rect: [4, 5, 143, 83], texto: "Serie: pines 0 y 1, compartidos con la programación y el monitor serie." }
        - { id: i2c, rotulo: "Recuadro azul, en el centro", rect: [155, 5, 143, 83], texto: "I²C: dos líneas, A4 y A5, para muchos dispositivos. Cada módulo trae sus pull-ups." }
        - { id: spi, rotulo: "Recuadro verde, a la derecha", rect: [305, 5, 143, 83], texto: "SPI: cuatro líneas y una selección por esclavo. Rápido, sin direcciones ni pull-ups." }
    requiere: { mover: [serie, i2c, spi] }

  - id: predecir-pines01
    tipo: explorar
    titulo: "Un módulo en los pines 0 y 1"
    texto: "El pin 0 de la placa recibe lo que manda el conversor USB. Conecte también un módulo serie y haga que los dos manden niveles distintos."
    libro: [153, 154]
    widget:
      tipo: logica
      entradas:
        - { id: USB, valor: 1, rotulo: "Dato del conversor" }
        - { id: MOD, valor: 1, rotulo: "Dato del módulo" }
        - { id: CON, valor: 0, rotulo: "Módulo conectado" }
      piezas:
        - { id: t1, tipo: tri, entradas: [USB, 1], rotulo: "Conversor USB" }
        - { id: t2, tipo: tri, entradas: [MOD, CON], rotulo: "Módulo serie" }
        - { id: rx, tipo: bus, entradas: [t1, t2], pullup: ninguna, rotulo: "Pin 0" }
      salidas:
        - { id: RX, de: rx, rotulo: "Pin 0 (RX)" }
    objetivo:
      condiciones:
        - { led: RX, valor: X, rotulo: "Pin 0 en conflicto" }
      logrado: "Dos salidas en la misma línea: el programa nuevo no llega limpio y la placa deja de aceptarlo. La salida es un serie por software en otros pines, más lento (unos 38 400 baudios) y sin interrupciones al transmitir."
      pistas:
        - { cuando: { senal: CON, valor: 0 }, texto: "Conecte el módulo." }
        - { texto: "Con los dos mandando lo mismo no se nota: cambie el dato del módulo." }
    escalera:
      - "El conversor USB-serie ya está conectado a los pines 0 y 1."
    solucion: "Módulo conectado y dato del módulo a 0."

  - id: porque-basura
    tipo: porque
    titulo: "Caracteres basura"
    texto: "El monitor serie enseña basura, y siempre la misma basura para el mismo texto. ¿Por qué?"
    libro: [155]
    widget:
      tipo: figura
      figura: fig-17.10
      zonas:
        - { id: tabla, rotulo: "La tabla de abajo", rect: [4, 95, 440, 70] }
    opciones:
      - texto: "Las velocidades de los dos extremos no coinciden"
        bien: true
        porque: "Un desajuste de velocidad da basura sistemática, no aleatoria."
      - texto: "Hay ruido en el cable"
        porque: "El ruido daría errores al azar; esta basura se repite igual."
      - texto: "Falta la masa común"
        porque: "Sin referencia, los errores no serían tan repetibles: la firma sistemática es de la velocidad."
    escalera:
      - "¿Es aleatoria o sistemática?"
    solucion: "Velocidades distintas en los dos extremos."

  - id: toque-pullups
    tipo: tocar
    titulo: "Cinco módulos"
    texto: "Conecta cinco módulos a un mismo bus y deja de funcionar, aunque cada uno va bien solo. Toque ese bus."
    libro: [158, 170]
    widget:
      tipo: figura
      figura: fig-17.10
      zonas:
        - { id: serie, rotulo: "Recuadro naranja, a la izquierda", rect: [4, 5, 143, 83] }
        - { id: i2c, rotulo: "Recuadro azul, en el centro", rect: [155, 5, 143, 83] }
        - { id: spi, rotulo: "Recuadro verde, a la derecha", rect: [305, 5, 143, 83] }
    tocar:
      bien: [i2c]
      porque:
        serie: "La UART une dos equipos, no cinco módulos en paralelo."
        spi: "SPI no tiene pull-ups: añadir esclavos solo gasta pines de selección."
    exito: "I²C: cinco pares de pull-ups en paralelo bajan tanto la resistencia que el bus deja de funcionar."
    escalera:
      - "¿Qué bus lleva resistencias en cada módulo?"
    solucion: "I²C. Retire los pull-ups de todos los módulos menos uno."

  - id: pregunta-escaner
    tipo: tocar
    titulo: "Otra dirección"
    texto: "Un sensor no responde y sospecha que está en otra dirección. Toque el bus en el que eso puede pasar."
    libro: [159, 162, 169]
    widget:
      tipo: figura
      figura: fig-17.10
      zonas:
        - { id: serie, rotulo: "Recuadro naranja, a la izquierda", rect: [4, 5, 143, 83] }
        - { id: i2c, rotulo: "Recuadro azul, en el centro", rect: [155, 5, 143, 83] }
        - { id: spi, rotulo: "Recuadro verde, a la derecha", rect: [305, 5, 143, 83] }
    tocar:
      bien: [i2c]
      porque:
        serie: "La UART une dos equipos, sin direcciones."
        spi: "SPI no tiene direcciones: cada esclavo tiene su pin de selección."
    exito: "I²C: antes que nada, el escáner de direcciones, que distingue «no está conectado» de «está en otra dirección»."
    escalera:
      - "¿En qué bus cada dispositivo se identifica por una dirección?"
    solucion: "I²C, y su escáner de bus."

  - id: predecir-spi
    tipo: tocar
    titulo: "Datos desplazados"
    texto: "Un convertidor responde, pero con valores que parecen válidos y están desplazados. Toque el bus en el que sospecha del modo de reloj."
    libro: [162, 165]
    widget:
      tipo: figura
      figura: fig-17.10
      zonas:
        - { id: serie, rotulo: "Recuadro naranja, a la izquierda", rect: [4, 5, 143, 83] }
        - { id: i2c, rotulo: "Recuadro azul, en el centro", rect: [155, 5, 143, 83] }
        - { id: spi, rotulo: "Recuadro verde, a la derecha", rect: [305, 5, 143, 83] }
    tocar:
      bien: [spi]
      porque:
        serie: "Un fallo de la UART es de velocidad y da basura sistemática, no datos desplazados."
        i2c: "I²C no tiene modos de reloj; su trampa es otra: pull-ups y direcciones."
    exito: "SPI tiene cuatro modos de polaridad y fase del reloj: con el equivocado, la comunicación «funciona» y devuelve valores incorrectos."
    escalera:
      - "¿Qué bus tiene cuatro modos de reloj?"
    solucion: "SPI: compruebe el modo en la hoja de datos."

  - id: empareje-eleccion
    tipo: tocar
    titulo: "La elección"
    texto: "Tiene que hablar con un módulo lejano, en un entorno ruidoso. Toque el bus que usaría, con un transceptor RS-485."
    libro: [152, 164, 167]
    widget:
      tipo: figura
      figura: fig-17.10
      zonas:
        - { id: serie, rotulo: "Recuadro naranja, a la izquierda", rect: [4, 5, 143, 83] }
        - { id: i2c, rotulo: "Recuadro azul, en el centro", rect: [155, 5, 143, 83] }
        - { id: spi, rotulo: "Recuadro verde, a la derecha", rect: [305, 5, 143, 83] }
    tocar:
      bien: [serie]
      porque:
        i2c: "I²C es para muchos sensores lentos y cerca: con pocos pines."
        spi: "SPI es para pantallas, tarjetas SD y convertidores rápidos, en la misma placa."
    exito: "Serial con RS-485. Para depurar, Serial; para muchos sensores lentos, I²C; para una pantalla o una SD, SPI."
    escalera:
      - "RS-485 es un transceptor para una UART."
    solucion: "El puerto serie."

  - id: lea-pines-spi
    tipo: leer
    titulo: "Lo que cuesta SPI"
    texto: "SPI usa reloj, dos líneas de datos y una selección por esclavo. Escriba cuántos pines ocupa con tres esclavos."
    libro: [162, 164]
    widget:
      tipo: figura
      figura: fig-17.10
      zonas:
        - { id: spi, rotulo: "Recuadro verde, a la derecha", rect: [305, 5, 143, 83], texto: "Cuatro líneas y una selección por esclavo." }
    leer:
      objetivo: p_spi
      unidad: ""
      tol: 0.01
      rotulo: "Pines de SPI"
      errores:
        - { expr: "4", texto: "Cuatro son con un esclavo: cada esclavo más añade su pin de selección." }
        - { expr: "3*n_esc", texto: "El reloj y los datos se comparten: solo la selección es una por esclavo." }
    exito: "Seis, frente a los dos de I²C: SPI es rápido, pero consume pines rápidamente."
    escalera:
      - "Reloj y datos se comparten; la selección, no."
    solucion: "3 + 3 = 6 pines."
    comprobar:
      - { p_spi: 6, n_esc: 3 }

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [153, 158, 165, 167]
    ideas:
      - { titulo: "Serie.", texto: "Pines 0 y 1, compartidos con el USB; velocidades iguales en los dos extremos." }
      - { titulo: "I²C.", texto: "Pull-ups de un solo módulo, direcciones únicas y escáner de bus." }
      - { titulo: "SPI.", texto: "Rápido y sencillo, pero un pin por esclavo y el modo correcto." }
      - { titulo: "Diagnóstico.", texto: "Osciloscopio en las líneas, velocidad y, en I²C, el escáner." }
