# Lección 1.2 de la sección 16.6 «Comunicaciones: Serial, I²C y SPI» (cap17; etiquetas sec-17.N = impresas 16.N).
# - Los tres buses del Arduino, la trampa de cada uno y el criterio de elección sobre la figura 16.10 (fig-17.10).
# - Sin modelo numérico: la sección no da valores de los pull-ups ni de los buses.
# Paso práctico: «tocar» el bus cuyos módulos se estorban al sumarse (los pull-ups de I²C).
leccion: cap17/sec-17.6

libro:
  149: "aquí interesa cuándo usar cada una y qué trampas tiene en Arduino"
  152: "Monitor serie para depurar"
  153: "es la causa de que una placa deje de aceptar programas mientras hay algo conectado ahí"
  154: "hasta unos 38 400 baudios con fiabilidad"
  155: "un desajuste produce caracteres basura de forma sistemática, no aleatoria"
  158: "la resistencia resultante puede ser demasiado baja y el bus deja de funcionar"
  159: "con el escáner de bus como herramienta de diagnóstico obligatoria"
  162: "no hay direcciones, pull-ups ni arbitraje"
  164: "Un pin de selección por dispositivo, que consume pines rápidamente"
  165: "la comunicación «funciona» y devuelve valores incorrectos"
  167: "Serial con transceptor RS-485"
  169: "distingue «no está conectado» de «está en otra dirección»"
  170: "Los tres buses del Arduino con la trampa característica de cada uno y el criterio de elección."

modelo: { valores: {}, calculos: {} }

tarjetas:
  - id: explore-buses
    tipo: explorar
    titulo: "Tres buses, tres trampas"
    texto: "Serie, I²C y SPI: toque cada uno y lea qué pines usa y qué trampa tiene en Arduino."
    libro: [149, 170]
    widget:
      tipo: figura
      figura: fig-17.10
      zonas:
        - { id: serie, rotulo: "Recuadro naranja, a la izquierda", rect: [4, 5, 143, 83], texto: "Serie: pines 0 y 1, compartidos con la programación y el monitor serie." }
        - { id: i2c, rotulo: "Recuadro azul, en el centro", rect: [155, 5, 143, 83], texto: "I²C: dos líneas, A4 y A5, para muchos dispositivos. Cada módulo trae sus pull-ups." }
        - { id: spi, rotulo: "Recuadro verde, a la derecha", rect: [305, 5, 143, 83], texto: "SPI: cuatro líneas y una selección por esclavo. Rápido, sin direcciones ni pull-ups." }
    requiere: { mover: [serie, i2c, spi] }

  - id: predecir-pines01
    tipo: predecir
    titulo: "Un módulo en los pines 0 y 1"
    texto: "Conecta un módulo serie a los pines 0 y 1 y deja el cable puesto. ¿Qué pasa al subir un programa nuevo?"
    libro: [153]
    widget:
      tipo: figura
      figura: fig-17.10
      zonas:
        - { id: serie, rotulo: "Recuadro naranja, a la izquierda", rect: [4, 5, 143, 83] }
    opciones:
      - texto: "La placa deja de aceptar programas"
        bien: true
        porque: "Los pines 0 y 1 son los del conversor USB: el módulo interfiere con la programación."
      - texto: "Se programa bien, pero el módulo no responde"
        porque: "El problema es justo la programación: el módulo está en las líneas que usa el conversor USB."
      - texto: "Nada: son pines como los demás"
        porque: "No lo son: los comparte el conversor USB-serie de la placa."
    escalera:
      - "¿Quién más está conectado a los pines 0 y 1?"
    solucion: "Deja de aceptar programas mientras el módulo esté ahí."

  - id: pregunta-software
    tipo: pregunta
    titulo: "Un serie por software"
    texto: "Para no usar los pines 0 y 1, monta un puerto serie por software en otros pines. ¿Qué precio paga?"
    libro: [154]
    widget:
      tipo: figura
      figura: fig-17.10
      zonas:
        - { id: serie, rotulo: "Recuadro naranja, a la izquierda", rect: [4, 5, 143, 83] }
    opciones:
      - texto: "Más lento y deshabilita interrupciones al transmitir"
        bien: true
        porque: "Hasta unos 38 400 baudios con fiabilidad, y puede romper otras temporizaciones."
      - texto: "Ninguno: va igual que el hardware"
        porque: "Es más lento y bloquea las interrupciones mientras transmite."
      - texto: "Ocupa los pines A4 y A5"
        porque: "Usa los pines que se elijan; su precio es la velocidad y las interrupciones."
    escalera:
      - "Lo que hace el hardware lo tiene que hacer ahora el programa."
    solucion: "Más lento (unos 38 400 baudios) y sin interrupciones mientras transmite."

  - id: porque-basura
    tipo: porque
    titulo: "Caracteres basura"
    texto: "El monitor serie enseña basura, y siempre la misma basura para el mismo texto. ¿Por qué?"
    libro: [155]
    widget:
      tipo: figura
      figura: fig-17.10
      zonas:
        - { id: tabla, rotulo: "La tabla de abajo", rect: [4, 95, 440, 70] }
    opciones:
      - texto: "Las velocidades de los dos extremos no coinciden"
        bien: true
        porque: "Un desajuste de velocidad da basura sistemática, no aleatoria."
      - texto: "Hay ruido en el cable"
        porque: "El ruido daría errores al azar; esta basura se repite igual."
      - texto: "Falta la masa común"
        porque: "Sin referencia, los errores no serían tan repetibles: la firma sistemática es de la velocidad."
    escalera:
      - "¿Es aleatoria o sistemática?"
    solucion: "Velocidades distintas en los dos extremos."

  - id: toque-pullups
    tipo: tocar
    titulo: "Cinco módulos"
    texto: "Conecta cinco módulos a un mismo bus y deja de funcionar, aunque cada uno va bien solo. Toque ese bus."
    libro: [158, 170]
    widget:
      tipo: figura
      figura: fig-17.10
      zonas:
        - { id: serie, rotulo: "Recuadro naranja, a la izquierda", rect: [4, 5, 143, 83] }
        - { id: i2c, rotulo: "Recuadro azul, en el centro", rect: [155, 5, 143, 83] }
        - { id: spi, rotulo: "Recuadro verde, a la derecha", rect: [305, 5, 143, 83] }
    tocar:
      bien: [i2c]
      porque:
        serie: "La UART une dos equipos, no cinco módulos en paralelo."
        spi: "SPI no tiene pull-ups: añadir esclavos solo gasta pines de selección."
    exito: "I²C: cinco pares de pull-ups en paralelo bajan tanto la resistencia que el bus deja de funcionar."
    escalera:
      - "¿Qué bus lleva resistencias en cada módulo?"
    solucion: "I²C. Retire los pull-ups de todos los módulos menos uno."

  - id: pregunta-escaner
    tipo: pregunta
    titulo: "Lo primero en I²C"
    texto: "Un sensor I²C no responde. ¿Qué herramienta usa antes que nada?"
    libro: [159, 169]
    widget:
      tipo: figura
      figura: fig-17.10
      zonas:
        - { id: i2c, rotulo: "Recuadro azul, en el centro", rect: [155, 5, 143, 83] }
    opciones:
      - texto: "El escáner de direcciones"
        bien: true
        porque: "Distingue «no está conectado» de «está en otra dirección»."
      - texto: "Cambiar el sensor por otro"
        porque: "Antes, el escáner: quizá está bien y en otra dirección."
      - texto: "Subir la velocidad del bus"
        porque: "No resuelve nada si el sensor está en otra dirección o desconectado."
    escalera:
      - "En I²C cada dispositivo tiene una dirección."
    solucion: "El escáner de direcciones."

  - id: predecir-spi
    tipo: predecir
    titulo: "Un modo que no coincide"
    texto: "Un convertidor SPI espera otro modo de reloj que el configurado. ¿Qué se ve?"
    libro: [162, 165]
    widget:
      tipo: figura
      figura: fig-17.10
      zonas:
        - { id: spi, rotulo: "Recuadro verde, a la derecha", rect: [305, 5, 143, 83] }
    opciones:
      - texto: "Responde, pero con datos desplazados"
        bien: true
        porque: "La comunicación «funciona» y devuelve valores incorrectos: se resuelve con la hoja de datos."
      - texto: "No responde nada"
        porque: "Sí responde: por eso desconcierta. Los datos llegan desplazados."
      - texto: "Un conflicto de direcciones"
        porque: "SPI no tiene direcciones: cada esclavo tiene su pin de selección."
    escalera:
      - "Polaridad y fase del reloj deciden cuándo se lee cada bit."
    solucion: "Datos desplazados que parecen válidos."

  - id: empareje-eleccion
    tipo: pregunta
    titulo: "La elección"
    texto: "Empareje cada situación con su bus."
    libro: [152, 164, 167]
    widget:
      tipo: figura
      figura: fig-17.10
      zonas:
        - { id: tabla, rotulo: "La tabla de abajo", rect: [4, 95, 440, 70] }
    emparejar:
      - ["Depurar y hablar con el ordenador", "Serial"]
      - ["Muchos sensores lentos, pocos pines", "I²C"]
      - ["Pantalla o tarjeta SD", "SPI"]
      - ["Módulo lejano o entorno ruidoso", "Serial con RS-485"]
    exito: "Y los tres se diagnostican igual: osciloscopio en las líneas y velocidad."
    pistas:
      - { texto: "I²C ahorra pines; SPI, velocidad." }
    escalera:
      - "SPI consume un pin de selección por dispositivo, pero es el más rápido."
    solucion: "Depurar, Serial; sensores lentos, I²C; pantalla o SD, SPI; lejos, RS-485."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [153, 158, 165, 167]
    ideas:
      - { titulo: "Serie.", texto: "Pines 0 y 1, compartidos con el USB; velocidades iguales en los dos extremos." }
      - { titulo: "I²C.", texto: "Pull-ups de un solo módulo, direcciones únicas y escáner de bus." }
      - { titulo: "SPI.", texto: "Rápido y sencillo, pero un pin por esclavo y el modo correcto." }
      - { titulo: "Diagnóstico.", texto: "Osciloscopio en las líneas, velocidad y, en I²C, el escáner." }
