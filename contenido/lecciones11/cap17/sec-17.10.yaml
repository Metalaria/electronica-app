# Lección 1.2 de la sección 16.10 «Alimentar el Arduino y sus Límites de Corriente» (cap17; sec-17.N = impresas 16.N).
# - El regulador lineal de la placa en el esquema vivo «regulador-lineal»: referencia de 5 V sin divisor (salida =
#   5 V), paso ideal (corriente de entrada = de salida) y una carga de 12,5 Ω, que a 5 V pide los 400 mA del libro.
#   P = (V_entrada − 5)·I (bloque 264): 2,8 W a 12 V, 1 W a 7,5 V. El libro no da el dropout: no se modela (0 V); la
#   entrada no baja de 7 V, el mínimo del jack.
# Paso práctico: «simular» la potencia del regulador a 12 V y 400 mA (errores: la entrada entera, lo que recibe la carga).
# 1.2.1 (autor121-sens, «aprender haciendo», GUIA §13): el regulador vivo se explora hasta que disipa lo mismo que
# recibe la placa (10 V); la fórmula pasa a medir con el multímetro la caída entre entrada y salida; se toca el elemento
# de paso que deja de calentarse con 5 V al pin 5V; en el banco se mide el pin 5V con la carga (referencia fijada en
# 4,6 V, la lectura de la tarjeta de antes). Quedan dos preguntas de opciones (el síntoma térmico y el motor) y los
# límites se tocan en el cuadro de la figura 16.15 (filas de 17.15.py).
leccion: cap17/sec-17.10

libro:
  270: "La última fila sorprende"
  260: "de 7 a 12 V, que pasan por un regulador lineal a bordo"
  263: "El regulador lineal de la placa disipa la diferencia"
  264: 'P = lr(( V_("entrada") - "5" )) dot.op I'
  265: "Con 12 V de entrada y 400 mA de consumo: 2,8 W"
  266: "Con 7,5 V, la misma corriente disipa 1 W en lugar de 2,8"
  267: "alimentar con 5 V regulados directamente al pin 5V, saltándose el regulador"
  269: "~400 mA menos el consumo de la placa"
  272: "el microcontrolador manda, no alimenta"
  273: "los picos del motor hunden la alimentación del microcontrolador y lo reinician"
  277: "Si baja de 4,7 V, el sistema está al borde"
  278: "Disipación del regulador de la placa según la tensión de entrada"

modelo:
  valores:
    V_in: { sim: "V_{entrada}", nombre: "tensión del jack", unidad: V, valor: 9 }
    V_rf: { sim: "V_{ref}", nombre: "salida del regulador", unidad: V, valor: 5 }
    R_L: { sim: "R_{L}", nombre: "placa y su carga", unidad: Ω, valor: 12.5 }
  calculos:
    V_o: { expr: "V_rf", sim: "V_{5V}", nombre: "tensión del pin 5V", unidad: V }
    I_L: { expr: "V_o/R_L", sim: "I", nombre: "consumo", unidad: A }
    P_r: { expr: "(V_in - V_o)*I_L", sim: "P", nombre: "potencia en el regulador", unidad: W }
    P_e: { expr: "V_in*I_L", sim: "P_{entrada}", nombre: "potencia que entra", unidad: W }
    P_c: { expr: "V_o*I_L", sim: "P_{carga}", nombre: "potencia de la carga", unidad: W }
    d_pc: { expr: "P_r - P_c", sim: "\\Delta P", nombre: "regulador menos placa", unidad: W }
    V_pa: { expr: "V_in - V_o", sim: "V_{paso}", nombre: "caída en el regulador", unidad: V }

tarjetas:
  - id: explore-regulador
    tipo: explorar
    titulo: "El regulador de a bordo"
    texto: "El jack admite de 7 a 12 V, que pasan por un regulador lineal. Busque la entrada con la que el regulador se queda tanta potencia como la placa."
    libro: [260, 263]
    widget:
      tipo: circuito
      esquema: regulador-lineal
      piezas: { entrada: V_in, ref: V_rf, carga: R_L }
      lectura: { valor: P_r, rotulo: "Potencia en el regulador" }
      datos:
        - { valor: I_L, rotulo: "Consumo: {{I_L}}" }
        - { valor: V_o, rotulo: "Pin 5V: {{V_o}}" }
      corriente: I_L
      mide: { vout: V_o, iin: I_L, icarga: I_L, p_paso: P_r }
      mandos:
        - { valor: V_in, min: 7, max: 12, paso: 0.5, rotulo: "Entrada, V_{entrada}" }
    objetivo:
      condiciones:
        - { valor: d_pc, min: -0.01, max: 0.01, rotulo: "Regulador {{P_r}} · placa {{P_c}}" }
      logrado: "A {{V_in}}, la mitad de lo que entra se va en calor: el regulador disipa la diferencia por encima de 5 V, por la misma corriente."
      pistas:
        - { cuando: { valor: d_pc, mayor: 0 }, texto: "El regulador ya se queda más que la placa: baje la entrada." }
        - { texto: "El regulador aún se queda menos que la placa: suba la entrada." }
    escalera:
      - "La placa recibe 5 V por la corriente; el regulador, lo que sobra por encima de 5 V."
    solucion: "10 V: sobran 5 V, los mismos que recibe la placa."
    comprobar:
      - { con: { V_in: 10 }, d_pc: 0, P_r: 2 }

  - id: formula-disipa
    tipo: medir
    titulo: "Disipa la diferencia"
    texto: "Ponga el multímetro donde mide la tensión que se queda el regulador."
    libro: [263, 264]
    widget:
      tipo: circuito
      esquema: regulador-lineal
      piezas: { entrada: V_in, ref: V_rf, carga: R_L }
      corriente: I_L
      mide: { vout: V_o, p_paso: P_r }
      instrumento: { tipo: multimetro, modos: [V], puntos: [in, out, "0"] }
    medir:
      magnitud: tension
      entre: [in, out]
      valor: V_pa
      porque:
        "out/0": "Esa es la salida regulada: lo que recibe la placa, no lo que cae en el regulador."
        "in/0": "Esa es toda la entrada; el regulador solo se queda con lo que sobra por encima de la salida."
    exito: "Caen {{V_pa}}, y por el regulador pasa toda la corriente: P = (V_entrada − 5) · I = {{P_r}}."
    escalera:
      - "El regulador está entre la entrada y la salida."
    solucion: "Una punta en la entrada y la otra en la salida regulada."

  - id: simule-12v
    tipo: simular
    titulo: "Prediga a 12 V"
    texto: "Con 12 V en el jack y 400 mA de consumo, ¿cuánto disipa el regulador?"
    libro: [264, 265]
    fijar: { V_in: 12, R_L: 12.5 }
    widget:
      tipo: circuito
      esquema: regulador-lineal
      piezas: { entrada: V_in, ref: V_rf, carga: R_L }
      lectura: { valor: P_r, rotulo: "Potencia en el regulador" }
      mide: { p_paso: P_r }
      ocultar: true
      mandos: []
    simular:
      objetivo: P_r
      unidad: W
      tol: 0.03
      rotulo: "Potencia en el regulador"
      medida: p_paso
      errores:
        - { expr: "P_e", texto: "Esos 4,8 W son toda la potencia que entra: el regulador solo se queda con lo que sobra por encima de 5 V." }
        - { expr: "P_c", texto: "Esos 2,0 W son los que recibe la placa a 5 V; el regulador disipa los 7 V que sobran." }
    exito: "2,8 W en un encapsulado pequeño y sin disipador."
    escalera:
      - "Sobran 12 − 5 V."
      - "Multiplique esa diferencia por la corriente."
    solucion: "(12 − 5) V · 0,4 A = 2,8 W."
    comprobar:
      - { P_r: 2.8, P_e: 4.8, P_c: 2.0, I_L: 0.4 }

  - id: predecir-sintoma
    tipo: predecir
    titulo: "Funciona unos minutos"
    texto: "Esa placa, a 12 V y 400 mA, sin disipador. ¿Qué síntoma da?"
    libro: [265]
    fijar: { V_in: 12, R_L: 12.5 }
    widget:
      tipo: circuito
      esquema: regulador-lineal
      piezas: { entrada: V_in, ref: V_rf, carga: R_L }
      lectura: { valor: P_r, rotulo: "Potencia en el regulador" }
      corriente: I_L
      mide: { vout: V_o, p_paso: P_r }
      mandos: []
    opciones:
      - texto: "Funciona unos minutos y se reinicia"
        bien: true
        porque: "El regulador se calienta hasta cortar por protección térmica."
      - texto: "No arranca"
        porque: "Arranca bien: el problema aparece cuando el regulador se calienta."
      - texto: "Funciona siempre, solo se calienta"
        porque: "Se calienta hasta que la protección térmica lo corta: la placa se reinicia."
    escalera:
      - "¿Qué hace un regulador con protección térmica cuando se calienta demasiado?"
    solucion: "Funciona unos minutos y se reinicia."

  - id: reto-1w
    tipo: reto
    titulo: "Con menos tensión"
    texto: "Con los mismos 400 mA, elija una entrada con la que el regulador no pase de 1 W."
    libro: [266]
    fijar: { R_L: 12.5 }
    inicio: { V_in: 12 }
    widget:
      tipo: circuito
      esquema: regulador-lineal
      piezas: { entrada: V_in, ref: V_rf, carga: R_L }
      lectura: { valor: P_r, rotulo: "Potencia en el regulador" }
      corriente: I_L
      mide: { vout: V_o, p_paso: P_r }
      mandos:
        - { valor: V_in, min: 7, max: 12, paso: 0.5, rotulo: "Entrada, V_{entrada}" }
    condiciones:
      - { valor: P_r, max: 1.0, rotulo: "Regulador: {{P_r}}" }
    exito: "Con 7 u 8 V, no con 12: a 7,5 V la misma corriente disipa 1 W y el problema desaparece."
    pistas:
      - { cuando: { valor: P_r, mayor: 1.0 }, texto: "Todavía sobra tensión: baje la entrada." }
    escalera:
      - "Cada voltio de más son 0,4 W con 400 mA."
    solucion: "7,5 V o menos: (7,5 − 5) · 0,4 = 1 W."
    comprobar:
      - { con: { V_in: 7.5 }, P_r: 1.0, I_L: 0.4 }

  - id: pregunta-pin5v
    tipo: elegir
    titulo: "Consumos apreciables"
    texto: "Para consumos apreciables se alimenta con 5 V regulados directamente al pin 5V. Toque la pieza que así deja de calentarse."
    libro: [267]
    widget:
      tipo: circuito
      esquema: regulador-lineal
      piezas: { entrada: V_in, ref: V_rf, carga: R_L }
      corriente: I_L
      mide: { vout: V_o, p_paso: P_r }
    elegir:
      zonas: [entrada, paso, ao, ref, carga]
      bien: [paso]
      porque:
        entrada: "Es la fuente de entrada: con 5 V de fuera, ya no hace falta."
        ao: "El amplificador de error solo compara: no lleva la corriente de la carga."
        ref: "La referencia no lleva la corriente de la carga."
        carga: "La placa sigue recibiendo sus 5 V y su corriente."
    exito: "El elemento de paso, donde se quedaba lo que sobra. Precaución: sin regulador no hay protección, y esos 5 V deben ser buenos."
    escalera:
      - "¿Dónde se convierte en calor la tensión que sobra?"
    solucion: "El elemento de paso del regulador."

  - id: empareje-limites
    tipo: tocar
    titulo: "Los límites de corriente"
    texto: "Toque la salida de la placa que no puede alimentar casi nada."
    libro: [269, 270]
    widget:
      tipo: figura
      figura: fig-17.15
      zonas:
        - { id: pin, rotulo: "Primera fila del cuadro", rect: [267, 26, 174, 35] }
        - { id: micro, rotulo: "Segunda fila del cuadro", rect: [267, 61, 174, 35] }
        - { id: cinco, rotulo: "Tercera fila del cuadro", rect: [267, 96, 174, 35] }
        - { id: tres, rotulo: "Cuarta fila del cuadro", rect: [267, 131, 174, 36] }
    tocar:
      bien: [tres]
      porque:
        pin: "Es lo recomendado por pin de E/S: mandar, no alimentar."
        micro: "Es el total del microcontrolador, sumando sus pines."
        cinco: "La de 5 V con USB da unos 400 mA, menos lo que gasta la placa: es la que más da."
    exito: "La de 3,3 V: 50 mA, la cifra oficial. El regulador de la UNO R3 admite unos 150 mA, pero sin disipador y desde los 5 V de la placa."
    escalera:
      - "Compare las cuatro cifras."
    solucion: "La salida de 3,3 V."

  - id: porque-motor
    tipo: porque
    titulo: "Un motor que reinicia la placa"
    texto: "La placa y un motor comparten fuente, y cada vez que arranca el motor la placa se reinicia. ¿Por qué?"
    libro: [272, 273, 278]
    widget:
      tipo: figura
      figura: fig-17.15
      zonas:
        - { id: limites, rotulo: "El cuadro de la derecha", rect: [255, 10, 187, 180] }
    opciones:
      - texto: "Los picos del motor hunden la alimentación"
        bien: true
        porque: "Defensas: alimentaciones separadas, condensadores grandes o masas unidas en un solo punto."
      - texto: "El pin no da corriente suficiente"
        porque: "El motor no se alimenta del pin, sino de la fuente común: es esa la que se hunde."
      - texto: "El motor genera interferencias en el USB"
        porque: "El mecanismo es la caída de la alimentación compartida en cada pico."
    escalera:
      - "¿Qué le pasa a una fuente compartida cuando arranca una carga grande?"
    solucion: "Sus picos hunden la alimentación del microcontrolador."

  - id: pregunta-banco
    tipo: medir
    titulo: "En el banco"
    texto: "La carga está funcionando. Ponga las puntas donde comprueba si la alimentación del sistema está al borde."
    libro: [277]
    fijar: { V_rf: 4.6 }
    widget:
      tipo: circuito
      esquema: regulador-lineal
      piezas: { entrada: V_in, ref: V_rf, carga: R_L }
      corriente: I_L
      mide: { vout: V_o }
      instrumento: { tipo: multimetro, modos: [V], puntos: [in, out, "0"] }
    medir:
      magnitud: tension
      entre: [out, "0"]
      valor: V_o
      porque:
        "in/0": "Esa es la entrada del jack: la que importa es la que llega a la placa."
        "in/out": "Esa es la caída en el regulador, no la alimentación del sistema."
    exito: "{{V_o}} con la carga conectada: por debajo de 4,7 V, el sistema está al borde y cualquier pico lo cruzará."
    escalera:
      - "Se mide el pin 5V, con la carga conectada, no en vacío."
    solucion: "Entre la salida regulada y masa."
    comprobar:
      - { con: { V_rf: 4.6 }, V_o: 4.6 }

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [264, 266, 267, 269]
    ideas:
      - { titulo: "P = (V − 5)·I.", texto: "El regulador de la placa disipa lo que sobra por encima de 5 V." }
      - { titulo: "7 u 8 V, no 12.", texto: "Con 400 mA, 2,8 W a 12 V y 1 W a 7,5 V." }
      - { titulo: "Manda, no alimenta.", texto: "Cargas de verdad, con su fuente y un transistor o driver." }
      - { titulo: "4,7 V.", texto: "Mida el pin 5V con la carga: por debajo, al borde." }
