# Lección 1.2 de la sección 16.9 «millis() frente a delay(): Programar sin Bloquear» (cap17; sec-17.N = impresas 16.N).
# - La figura 16.14 (fig-17.14): delay() bloquea y pierde la pulsación; millis() atiende varias tareas a la vez.
# - El desbordamiento de millis(): 2³² ms = 49,7 días, como estimación.
# - Sin paso práctico aparte: la sección es de estructura del programa (la medida del bucle ya está en la 16.3).
# 1.2.1 (autor121-sens, «aprender haciendo», GUIA §13): en la figura 16.14 se toca la pulsación que se pierde (el
# explorar ya no la cuenta); las líneas del bloque 236 se tocan en orden (desordenadas); se escribe el desbordamiento;
# entre las dos comprobaciones se toca la frágil (bloque 241); la secuencia del bloque 244 se lleva a «informar» en un
# circuito «logica» (contador de cinco pasos y decodificador); en un programa propio se toca el único delay()
# razonable (bloque 249). Queda una pregunta de opciones: por qué la resta no falla.
leccion: cap17/sec-17.9

libro:
  247: "Es la misma idea que gobierna los circuitos secuenciales"
  250: "Fuera de eso, y en cuanto el programa tenga dos"
  232: "Durante ese segundo el microcontrolador no hace absolutamente nada más"
  233: "el pulsador se pulsó durante el delay() y nadie lo miró"
  235: "se anota cuándo ocurrió la última vez y se comprueba si ya toca"
  236: "ultimaVez = millis();"
  237: "se obtiene concurrencia cooperativa sin sistema operativo"
  239: "se desborda a los 49,7 días y vuelve a cero"
  240: "porque el desbordamiento de la resta compensa el del contador"
  241: "if (millis() >= ultimaVez + intervalo)    // FRÁGIL"
  242: "la tarea se dispara en ráfaga, en cada pasada del bucle"
  244: "una variable que guarda en qué paso se está"
  249: "Es razonable en tres casos"
  255: "Programación bloqueante con delay() frente a comprobación de tiempo con millis()"

modelo:
  valores:
    n_bit: { sim: "n", nombre: "bits del contador", unidad: "", valor: 32 }
  calculos:
    dias: { expr: "2^n_bit/1000/86400", sim: "T_{vuelta}", nombre: "tiempo hasta el desbordamiento", unidad: "días", cifras: 3 }
    ms_d: { expr: "1000*86400", sim: "ms", nombre: "milisegundos de un día", unidad: "" }

tarjetas:
  - id: explore-bloqueo
    tipo: explorar
    titulo: "Bloquear o comprobar"
    texto: "Arriba, un parpadeo con delay(1000); abajo, tres tareas con millis(). Toque las dos filas del programa."
    libro: [232, 237, 255]
    widget:
      tipo: figura
      figura: fig-17.14
      zonas:
        - { id: delay, rotulo: "Fila de arriba, programa", rect: [48, 18, 360, 36], texto: "Con delay(1000) el programa pasa casi todo el tiempo bloqueado: no lee, no atiende, no actualiza." }
        - { id: tareas, rotulo: "Filas del LED y del sensor", rect: [48, 132, 360, 55], texto: "Cada tarea, con su variable de tiempo y su intervalo: LED cada 500 ms, sensor cada 2 s. El bucle da miles de vueltas por segundo." }
    requiere: { mover: [delay, tareas] }

  - id: predecir-pulsador
    tipo: tocar
    titulo: "Un pulsador y un delay()"
    texto: "En los dos programas alguien pulsa un instante. Toque la pulsación que el programa no llega a ver."
    libro: [232, 233]
    widget:
      tipo: figura
      figura: fig-17.14
      zonas:
        - { id: perdida, rotulo: "Pulsación de arriba", rect: [170, 55, 60, 38] }
        - { id: atendida, rotulo: "Pulsación de abajo", rect: [170, 190, 60, 36] }
    tocar:
      bien: [perdida]
      porque:
        atendida: "Con millis() el bucle da miles de vueltas por segundo: la pulsación se atiende al instante."
    exito: "Llega durante el delay(1000), y durante ese segundo el micro no hace absolutamente nada más: nadie mira el pulsador."
    escalera:
      - "¿Qué programa pasa casi todo el tiempo detenido?"
    solucion: "La de arriba, la del delay()."

  - id: ordene-millis
    tipo: tocar
    titulo: "Comprobar el reloj"
    texto: "Las líneas de la tarea periódica sin bloquear están desordenadas. Tóquelas en el orden en que se escriben."
    libro: [235, 236]
    widget:
      tipo: figura
      codigo:
        lenguaje: c
        texto: |2
              ultimaVez = millis();
          }
          if (millis() - ultimaVez >= intervalo) {
              // aquí va la tarea periódica
      zonas:
        - { id: anota, lineas: [1], rotulo: "Primera línea" }
        - { id: cierra, lineas: [2], rotulo: "Segunda línea" }
        - { id: comprueba, lineas: [3], rotulo: "Tercera línea" }
        - { id: tarea, lineas: [4], rotulo: "Cuarta línea" }
    tocar:
      bien: [comprueba, anota, tarea, cierra]
      orden: true
    exito: "Se comprueba si ya toca, se anota cuándo ocurrió y se hace la tarea: el bucle no se detiene nunca."
    escalera:
      - "La comprobación va primero y abre el bloque."
      - "Dentro, primero se anota el instante y después se hace la tarea."
    solucion: "El if, ultimaVez = millis(), la tarea y la llave."

  - id: estime-desborde
    tipo: leer
    titulo: "El contador da la vuelta"
    texto: "millis() devuelve un entero de 32 bits sin signo, en milisegundos. Escriba al cabo de cuántos días vuelve a cero."
    libro: [239]
    widget:
      tipo: figura
      codigo:
        lenguaje: c
        texto: |
          unsigned long ahora = millis();   // 32 bits, in milliseconds
      resaltar: [1]
    leer:
      objetivo: dias
      unidad: ""
      tol: 0.02
      rotulo: "Días hasta el desbordamiento"
    exito: "49,7 días: casi dos meses, justo cuando nadie lo espera."
    escalera:
      - "2³² ms son algo más de cuatro mil millones de milisegundos."
      - "Un día tiene 86 400 000 ms."
    solucion: "2³² ms / 86 400 000 ms = 49,7 días."
    comprobar:
      - { dias: 49.71, ms_d: 86400000 }

  - id: predecir-fragil
    tipo: tocar
    titulo: "La forma ingenua"
    texto: "Dos formas de comprobar si toca. Toque la que, al acercarse el desbordamiento, dispara la tarea en cada pasada."
    libro: [240, 241, 242]
    widget:
      tipo: figura
      codigo:
        lenguaje: c
        texto: |
          if (millis() - ultimaVez >= intervalo) {
          if (millis() >= ultimaVez + intervalo) {
      zonas:
        - { id: resta, lineas: [1], rotulo: "Primera línea" }
        - { id: suma, lineas: [2], rotulo: "Segunda línea" }
    tocar:
      bien: [suma]
      porque:
        resta: "La diferencia sin signo sale correcta incluso a través del desbordamiento."
    exito: "La suma da la vuelta antes que el contador: la condición se cumple de inmediato y la tarea se dispara en ráfaga hasta que millis() también da la vuelta."
    escalera:
      - "¿Qué pasa con ultimaVez + intervalo cerca del final de la cuenta?"
    solucion: "La de la suma."

  - id: porque-resta
    tipo: porque
    titulo: "Por qué la resta no falla"
    texto: "Con millis() - ultimaVez >= intervalo la tarea sigue bien tras el desbordamiento. ¿Por qué?"
    libro: [240]
    widget:
      tipo: figura
      figura: fig-17.14
      zonas:
        - { id: abajo, rotulo: "Mitad de abajo", rect: [0, 110, 410, 140] }
    opciones:
      - texto: "El desbordamiento de la resta compensa el del contador"
        bien: true
        porque: "Con aritmética sin signo, la diferencia sale correcta incluso a través del desbordamiento."
      - texto: "Porque millis() nunca se desborda"
        porque: "Sí se desborda, a los 49,7 días; la resta es inmune a eso."
      - texto: "Porque la resta es más rápida"
        porque: "La velocidad no tiene nada que ver: es la aritmética sin signo."
    escalera:
      - "Los dos números dan la vuelta con la misma aritmética."
    solucion: "La resta sin signo compensa el desbordamiento del contador."

  - id: pregunta-estados
    tipo: explorar
    titulo: "Una secuencia"
    texto: "Esperar, encender, esperar, apagar e informar, sin bloquear: un contador guarda en qué paso está y cada pulso es «toca avanzar». Llévelo hasta informar."
    libro: [244, 247]
    widget:
      tipo: logica
      entradas: [{ id: CLK, reloj: true, rotulo: "Toca avanzar" }]
      piezas:
        - { id: c1, tipo: contador, bits: 3, modulo: 5, entradas: [CLK], rotulo: "Paso" }
        - { id: d1, tipo: decodificador, bits: 3, entradas: [c1.q0, c1.q1, c1.q2] }
        - { id: o1, tipo: or, entradas: [d1.y1, d1.y2], rotulo: "LED encendido" }
      salidas:
        - { id: LED, de: o1, rotulo: "LED" }
        - { id: INF, de: d1.y4, rotulo: "Informar" }
    objetivo:
      condiciones:
        - { led: INF, valor: 1, rotulo: "En el paso de informar" }
      logrado: "Cuatro avances. Una variable dice en qué paso se está y en cada pasada se comprueba si toca avanzar: no bloquea nunca. Es la idea de los circuitos secuenciales, en software."
      pistas:
        - { texto: "Dé otro pulso: cada uno avanza un paso." }
    escalera:
      - "Esperar es el primer paso; informar llega tras cuatro avances."
    solucion: "Cuatro pulsos."

  - id: pregunta-aceptable
    tipo: tocar
    titulo: "Cuándo vale delay()"
    texto: "Este programa atiende un pulsador y una pantalla. Toque el único delay() razonable."
    libro: [249, 250]
    widget:
      tipo: figura
      codigo:
        lenguaje: c
        texto: |
          void setup() {
            iniciarSensor();
            delay(100);          // let the sensor settle
          }
          void loop() {
            leerPulsador();
            delay(500);
            actualizarPantalla();
          }
      zonas:
        - { id: l3, lineas: [3], rotulo: "Tercera línea" }
        - { id: l7, lineas: [7], rotulo: "Séptima línea" }
    tocar:
      bien: [l3]
      porque:
        l7: "En loop(), con dos responsabilidades: mientras espera, ni el pulsador ni la pantalla se atienden."
    exito: "En la inicialización, cuando aún no hay nada que atender: uno de los tres casos razonables, con las esperas muy cortas de un componente y los programas de una sola tarea."
    escalera:
      - "Pregúntese si en ese momento hay algo más que atender."
    solucion: "El de setup()."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [233, 236, 240, 244]
    ideas:
      - { titulo: "delay() es un muro.", texto: "Mientras espera, no lee, no atiende y pierde pulsaciones." }
      - { titulo: "Comprobar el reloj.", texto: "Cada tarea con su ultimaVez y su intervalo: concurrencia sin sistema operativo." }
      - { titulo: "Siempre por diferencia.", texto: "millis() - ultimaVez sobrevive al desbordamiento de los 49,7 días." }
      - { titulo: "Secuencias.", texto: "Máquina de estados: una variable dice en qué paso se está." }
