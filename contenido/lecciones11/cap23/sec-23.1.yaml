# Lección 1.2 de la sección 22.1 «Conceptos Topológicos» (cap23). Formato: contenido/lecciones11/GUIA.md.
# 1.2.1 (autor121-pot, «aprender haciendo», GUIA §13): el abierto y el cortocircuito se consiguen con la carga del
# equivalente (objetivos sobre la corriente y la tensión); los lazos y las ecuaciones de lazo se escriben (leer); los
# nodos esenciales y el nodo de masa se tocan en el esquema «kirchhoff» (elegir). Quedan dos preguntas de opciones: por
# qué un nodo de dos elementos no da ecuación, y el límite de los parámetros concentrados. La tabla de la dualidad pasa
# al «logrado» del cortocircuito y al resumen.
leccion: cap23/sec-23.1

libro:
  3: "un circuito es un grafo"
  6: "Rama: cada elemento de dos terminales."
  7: "todo lo unido por conductores ideales es el mismo nodo"
  8: "Nodo esencial: uno donde concurren tres o más ramas"
  14: "Los enlaces son r − n + 1, y ese número es también el de lazos independientes."
  15: "ecuaciones de nodos + ecuaciones de lazos = número de ramas"
  16: "Con un circuito de 6 ramas y 4 nodos: 3 ecuaciones de nodo y 3 de lazo"
  20: "si salen más ecuaciones, alguna es combinación de las demás"
  24: "Circuito abierto"
  25: "resolver un circuito resuelve automáticamente su dual"
  26: "Un circuito abierto es un camino interrumpido"
  28: "la aproximación de parámetros concentrados"
  29: "el concepto de nodo pierde sentido"
  32: "el plano de masa es un solo nodo con decenas de ramas conectadas"

modelo:
  valores:
    V_t: { sim: "V", nombre: "tensión de la fuente", unidad: V, valor: 12 }
    R_ti: { sim: "R", nombre: "resistencia en serie", unidad: Ω, valor: 4 }
    R_tl: { sim: "R_{L}", nombre: "carga", unidad: Ω, valor: 4 }
    V_k1: { sim: "V₁", nombre: "fuente de la izquierda", unidad: V, valor: 10 }
    V_k2: { sim: "V₂", nombre: "fuente de la derecha", unidad: V, valor: 6 }
    R_k1: { sim: "R₁", nombre: "resistencia de la izquierda", unidad: Ω, valor: 2 }
    R_k2: { sim: "R₂", nombre: "resistencia de la derecha", unidad: Ω, valor: 3 }
    R_k3: { sim: "R₃", nombre: "resistencia a masa", unidad: Ω, valor: 4 }
    n_k: { sim: "n", nombre: "nodos", unidad: "", valor: 4 }
    r_k: { sim: "r", nombre: "ramas", unidad: "", valor: 5 }
  calculos:
    V_to: { expr: "V_t*R_tl/(R_ti + R_tl)", sim: "V", nombre: "tensión en la carga", unidad: V }
    I_t: { expr: "V_t/(R_ti + R_tl)", sim: "I", nombre: "corriente por la carga", unidad: A }
    V_ti: { expr: "I_t*R_ti", sim: "V_{R}", nombre: "caída en la resistencia en serie", unidad: V }
    V_kn: { expr: "(V_k1/R_k1 + V_k2/R_k2)/(1/R_k1 + 1/R_k2 + 1/R_k3)", sim: "V_{A}", nombre: "tensión del nodo A", unidad: V }
    I_k3: { expr: "V_kn/R_k3", sim: "I₃", nombre: "corriente por R₃", unidad: A }
    lazos: { expr: "r_k - n_k + 1", sim: "r − n + 1", nombre: "lazos independientes", unidad: "" }
    ecs_n: { expr: "n_k - 1", sim: "n − 1", nombre: "ecuaciones de nodo", unidad: "" }
    lazos6: { expr: "6 - n_k + 1", sim: "r − n + 1", nombre: "lazos con seis ramas", unidad: "" }

tarjetas:
  - id: explore-extremos
    tipo: explorar
    titulo: "El circuito abierto"
    texto: "Un circuito abierto es un camino interrumpido. Mueva la carga hasta que por ella no pase corriente."
    libro: [24, 26]
    inicio: { R_tl: 4 }
    widget:
      tipo: circuito
      esquema: thevenin
      piezas: { fuente: V_t, rth: R_ti, carga: R_tl }
      lectura: { valor: V_to, rotulo: "Tensión en la carga" }
      datos:
        - { valor: I_t, rotulo: "I = {{I_t}}" }
      corriente: I_t
      mide: { salida: V_to, corriente: I_t, interna: V_ti }
      mandos:
        - { valor: R_tl, lista: [0.001, 1, 4, 100, 1000000], rotulo: "Carga" }
    objetivo:
      condiciones:
        - { valor: I_t, max: 0.0001, rotulo: "Corriente: {{I_t}}" }
      logrado: "Con {{R_tl}} apenas pasa corriente y entre los extremos quedan {{V_to}}: corriente nula y la tensión que imponga el resto."
      pistas:
        - { texto: "Todavía pasa corriente: suba la carga hasta el extremo." }
    escalera:
      - "Un camino interrumpido es una resistencia enorme."
    solucion: "La carga de 1 MΩ: corriente casi nula y los 12 V de la fuente entre sus extremos."
    comprobar:
      - { con: { R_tl: 1000000 }, V_to: 12, tol: 0.001 }

  - id: abierto-corto
    tipo: explorar
    titulo: "Su dual"
    texto: "El dual del abierto es el cortocircuito. Consiga que la tensión en la carga sea nula y mire la corriente."
    libro: [24, 25, 26]
    inicio: { R_tl: 1000000 }
    widget:
      tipo: circuito
      esquema: thevenin
      piezas: { fuente: V_t, rth: R_ti, carga: R_tl }
      lectura: { valor: V_to, rotulo: "Tensión en la carga" }
      datos:
        - { valor: I_t, rotulo: "I = {{I_t}}" }
      corriente: I_t
      mide: { salida: V_to, corriente: I_t, interna: V_ti }
      mandos:
        - { valor: R_tl, lista: [0.001, 1, 4, 100, 1000000], rotulo: "Carga" }
    objetivo:
      condiciones:
        - { valor: V_to, max: 0.01, rotulo: "Tensión: {{V_to}}" }
      logrado: "Tensión nula y {{I_t}}, la que impone el resto. Es el dual: tensión por corriente, serie por paralelo, bobina por condensador."
      pistas:
        - { texto: "Aún queda tensión en la carga: bájela hasta el extremo." }
    escalera:
      - "En la dualidad, la tensión se cambia por la corriente y la resistencia infinita por la nula."
    solucion: "La carga casi nula: 0 V en ella y 3 A, los que permite la de 4 Ω."
    comprobar:
      - { con: { R_tl: 0.001 }, I_t: 3, tol: 0.001 }

  - id: prediga-lazos
    tipo: leer
    titulo: "Cuente los lazos"
    texto: "Este circuito tiene 4 nodos y 5 ramas, una por elemento. Escriba cuántos lazos independientes tiene."
    libro: [6, 14]
    fijar: { n_k: 4, r_k: 5 }
    widget:
      tipo: circuito
      esquema: kirchhoff
      piezas: { fuente1: V_k1, fuente2: V_k2, r1: R_k1, r2: R_k2, r3: R_k3 }
      corriente: I_k3
      mide: { nodo: V_kn }
      mandos: []
    leer:
      objetivo: lazos
      unidad: ""
      tol: 0.01
      rotulo: "Lazos independientes"
      errores:
        - { expr: "ecs_n", texto: "3 son las ecuaciones de nodo, n − 1. Los lazos son las ramas que sobran del árbol: r − n + 1." }
        - { expr: "r_k", texto: "5 son las ramas. Un árbol se queda n − 1 de ellas; los lazos los dan las que sobran." }
    exito: "r − n + 1 = 5 − 4 + 1 = 2: las dos ventanas del dibujo."
    escalera:
      - "Un árbol une todos los nodos con n − 1 ramas; las demás son enlaces."
    solucion: "r − n + 1 = 5 − 4 + 1 = 2 lazos independientes."
    comprobar:
      - { lazos: 2, ecs_n: 3 }

  - id: cuenta-total
    tipo: leer
    titulo: "Ecuaciones de lazo"
    texto: "Otro circuito, de 6 ramas y 4 nodos. Escriba cuántas ecuaciones de lazo independientes tiene."
    libro: [14, 15, 16, 20]
    fijar: { n_k: 4 }
    widget:
      tipo: grafica
      x: { id: rr, min: 3, max: 10, unidad: "", rotulo: "ramas, r" }
      y: { min: 0, max: 8, unidad: "", rotulo: "lazos" }
      curvas:
        - { expr: "rr - n_k + 1", color: azul, rotulo: "lazos con 4 nodos" }
      mandos: []
    leer:
      objetivo: lazos6
      unidad: ""
      tol: 0.01
      rotulo: "Lazos independientes"
      errores:
        - { expr: "6", texto: "6 son las ramas. Nodos más lazos deben sumar ese número." }
        - { expr: "n_k", texto: "4 son los nodos. Los lazos son r − n + 1." }
    exito: "6 − 4 + 1 = 3 de lazo y 3 de nodo: seis, tantas como ramas. Si salen más, alguna es combinación de las demás."
    escalera:
      - "Nodos más lazos deben dar el número de ramas."
    solucion: "r − n + 1 = 6 − 4 + 1 = 3."
    comprobar:
      - { lazos6: 3, ecs_n: 3 }

  - id: nodo-esencial
    tipo: elegir
    titulo: "Nodos esenciales"
    texto: "Un nodo esencial reúne tres o más ramas. Toque todos los nodos esenciales de este circuito."
    libro: [7, 8]
    widget:
      tipo: circuito
      esquema: kirchhoff
      piezas: { fuente1: V_k1, fuente2: V_k2, r1: R_k1, r2: R_k2, r3: R_k3 }
      corriente: I_k3
      mide: { nodo: V_kn }
      mandos: []
    elegir:
      zonas: { "red:n": "Nodo de arriba", "red:0": "Masa, abajo", "red:f1": "Arriba de la fuente izquierda", "red:f2": "Arriba de la fuente derecha" }
      bien: ["red:n", "red:0"]
      todas: true
      porque:
        "red:f1": "Ahí solo se unen la fuente de la izquierda y R₁: lo que entra sale."
        "red:f2": "Ahí solo se unen la fuente de la derecha y R₂: no es esencial."
    exito: "El nodo A reúne R₁, R₂ y R₃; la masa, las dos fuentes y R₃. Los otros unen solo dos elementos."
    escalera:
      - "Cuente cuántos elementos llegan a cada punto de conexión."
    solucion: "El nodo de arriba y la masa, con tres ramas cada uno."

  - id: por-que-dos
    tipo: porque
    titulo: "¿Por qué no cuentan?"
    texto: "Los puntos entre cada fuente y su resistencia son nodos, pero no esenciales. ¿Por qué no aportan ecuación?"
    libro: [8]
    widget:
      tipo: circuito
      esquema: kirchhoff
      piezas: { fuente1: V_k1, fuente2: V_k2, r1: R_k1, r2: R_k2, r3: R_k3 }
      lectura: { valor: V_kn, rotulo: "Tensión del nodo A" }
      corriente: I_k3
      mide: { nodo: V_kn }
      mandos: []
    opciones:
      - texto: "Unen solo dos elementos: la corriente que entra es la que sale"
        bien: true
        porque: "Su ley de corrientes solo dice que los dos elementos llevan la misma corriente, algo que ya se sabía."
      - texto: "Porque su tensión vale cero"
        porque: "Cero vale la referencia. Estos puntos tienen su tensión; lo que no dan es una ecuación nueva."
      - texto: "Porque están junto a una fuente"
        porque: "Lo que importa es cuántas ramas concurren, no qué elemento hay al lado."
    escalera:
      - "Escriba la ley de corrientes en un punto donde se unen solo dos elementos."
    solucion: "Con dos elementos, lo que entra sale: la ecuación no dice nada nuevo."

  - id: plano-masa
    tipo: elegir
    titulo: "El plano de masa"
    texto: "En una placa real, el plano de masa es un solo nodo con decenas de ramas. Toque en el esquema el nodo que haría de plano de masa."
    libro: [7, 32]
    widget:
      tipo: circuito
      esquema: kirchhoff
      piezas: { fuente1: V_k1, fuente2: V_k2, r1: R_k1, r2: R_k2, r3: R_k3 }
      corriente: I_k3
      mide: { nodo: V_kn }
      mandos: []
    elegir:
      zonas: { "red:n": "Nodo de arriba", "red:0": "Masa, abajo", "red:f1": "Arriba de la fuente izquierda" }
      bien: ["red:0"]
      porque:
        "red:n": "Ese es el nodo A: reúne tres ramas, pero no es la referencia que comparten todos los elementos."
        "red:f1": "Ese punto une solo dos elementos."
    exito: "La masa: todo lo unido por conductores ideales es el mismo nodo, por muchos símbolos de masa que se dibujen."
    escalera:
      - "¿Qué nodo une los extremos de abajo de todos los elementos?"
    solucion: "La masa, abajo: un único nodo aunque se dibuje en varios puntos."

  - id: limite
    tipo: pregunta
    titulo: "El límite de todo esto"
    texto: "¿Cuándo deja de tener sentido hablar de nodos?"
    libro: [28, 29]
    widget:
      tipo: circuito
      esquema: kirchhoff
      piezas: { fuente1: V_k1, fuente2: V_k2, r1: R_k1, r2: R_k2, r3: R_k3 }
      lectura: { valor: V_kn, rotulo: "Tensión del nodo A" }
      corriente: I_k3
      mide: { nodo: V_kn }
      mandos: []
    opciones:
      - texto: "Cuando el circuito deja de ser pequeño frente a la longitud de onda"
        bien: true
        porque: "Toda la maquinaria descansa en los parámetros concentrados. Fuera de ellos, la tensión depende de dónde se mida."
      - texto: "Cuando el circuito tiene más de diez nodos"
        porque: "Con muchos nodos las ecuaciones son más, no inválidas. El límite es físico, no de tamaño del sistema."
      - texto: "Cuando hay fuentes de alterna"
        porque: "Los métodos valen en alterna con impedancias. El problema llega cuando el circuito es grande frente a la longitud de onda."
    escalera:
      - "Piense en la aproximación en la que descansan los nodos."
    solucion: "Fuera de la aproximación de parámetros concentrados el nodo pierde sentido."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [3, 14, 15, 25]
    ideas:
      - { titulo: "Un grafo.", texto: "Ramas (elementos de dos terminales) que unen nodos; todo lo unido por un conductor ideal es un nodo." }
      - { titulo: "Los números.", texto: "n − 1 ecuaciones de nodo y r − n + 1 de lazo: sumadas, el número de ramas." }
      - { titulo: "La dualidad.", texto: "Tensión y corriente, serie y paralelo, abierto y cortocircuito: resolver uno resuelve su dual." }
      - { titulo: "El límite.", texto: "Solo con parámetros concentrados: circuito pequeño frente a la longitud de onda." }
