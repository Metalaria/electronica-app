# Lección 1.2 de la sección 22.2 «Las Leyes de Kirchhoff en Profundidad» (cap23). Formato: contenido/lecciones11/GUIA.md.
leccion: cap23/sec-23.2

libro:
  37: "La ley de corrientes (KCL) es la conservación de la carga"
  40: "Es la aproximación de parámetros concentrados."
  42: "KVL falla cuando hay campo magnético variable atravesando la malla"
  43: "KCL falla cuando hay corrientes de desplazamiento apreciables"
  48: "un signo negativo es información, no un error"
  49: "dos puntos marcados como masa en el esquema están conectados"
  53: "la potencia entregada por las fuentes debe igualar la disipada por las resistencias"
  54: "usa todos los resultados a la vez"
  56: "medir cada caída con el Brymen y comprobar que suman la tensión de la fuente"
  57: "su propia resistencia altera lo que mide"
  "cap23#100": "i₁ = 1,8 A, i₂ = 1,2 A"

modelo:
  valores:
    V_s: { sim: "V", nombre: "tensión de la fuente", unidad: V, valor: 12 }
    R_s1: { sim: "R₁", nombre: "primera resistencia", unidad: Ω, valor: 4 }
    R_s2: { sim: "R₂", nombre: "segunda resistencia", unidad: Ω, valor: 8 }
    R_s3: { sim: "R₃", nombre: "tercera resistencia", unidad: Ω, valor: 4 }
    V_m: { sim: "V", nombre: "tensión de la fuente", unidad: V, valor: 12 }
    R_m1: { sim: "R₁", nombre: "resistencia en serie", unidad: Ω, valor: 4 }
    R_m2: { sim: "R₂", nombre: "rama compartida", unidad: Ω, valor: 8 }
    R_m3: { sim: "R₃", nombre: "segunda rama", unidad: Ω, valor: 4 }
  calculos:
    I_s: { expr: "V_s/(R_s1 + R_s2 + R_s3)", sim: "I", nombre: "corriente del lazo", unidad: A }
    V_s1: { expr: "I_s*R_s1", sim: "V₁", nombre: "caída en R₁", unidad: V }
    V_s2: { expr: "I_s*R_s2", sim: "V₂", nombre: "caída en R₂", unidad: V }
    V_s3: { expr: "I_s*R_s3", sim: "V₃", nombre: "caída en R₃", unidad: V }
    V_suma: { expr: "V_s1 + V_s2 + V_s3", sim: "ΣV", nombre: "suma de las caídas", unidad: V }
    R_mp: { expr: "par(R_m2, R_m3)", sim: "R₂ ‖ R₃", nombre: "paralelo", unidad: Ω }
    I_m: { expr: "V_m/(R_m1 + R_mp)", sim: "I", nombre: "corriente total", unidad: A }
    V_mp: { expr: "I_m*R_mp", sim: "V_{p}", nombre: "tensión del paralelo", unidad: V }
    I_m2: { expr: "V_mp/R_m2", sim: "I₂", nombre: "corriente por R₂", unidad: A }
    I_m3: { expr: "V_mp/R_m3", sim: "I₃", nombre: "corriente por R₃", unidad: A }
    V_m1: { expr: "I_m*R_m1", sim: "V₁", nombre: "tensión en R₁", unidad: V }
    P_f: { expr: "V_m*I_m", sim: "P_{fuente}", nombre: "potencia entregada", unidad: W }
    P_r: { expr: "I_m^2*R_m1 + I_m2^2*R_m2 + I_m3^2*R_m3", sim: "P_{R}", nombre: "potencia disipada", unidad: W }

tarjetas:
  - id: explore-lazo
    tipo: explorar
    titulo: "Recorra el lazo"
    texto: "Mueva las resistencias. Las tres caídas cambian, pero su suma no."
    libro: [37]
    widget:
      tipo: circuito
      esquema: serie
      piezas: { fuente: V_s, r1: R_s1, r2: R_s2, r3: R_s3 }
      lectura: { valor: V_suma, rotulo: "Suma de las caídas" }
      barras:
        - { valor: V_s1, rotulo: "R₁: {{V_s1}}", color: azul }
        - { valor: V_s2, rotulo: "R₂: {{V_s2}}", color: naranja }
        - { valor: V_s3, rotulo: "R₃: {{V_s3}}", color: verde }
      corriente: I_s
      mide: { corriente: I_s, v1: V_s1, v2: V_s2, v3: V_s3 }
      mandos:
        - { valor: R_s1, min: 1, max: 20, paso: 1 }
        - { valor: R_s2, min: 1, max: 20, paso: 1 }
    requiere: { mover: [R_s1, R_s2] }

  - id: prediga-nodo
    tipo: predecir
    titulo: "Prediga la corriente"
    texto: "Con 12 V, R₁ = 4 Ω y el paralelo de 8 Ω y 4 Ω, por R₁ llegan 1,8 A. ¿Cuánto baja por R₃?"
    libro: ["cap23#100", 37]
    fijar: { V_m: 12, R_m1: 4, R_m2: 8, R_m3: 4 }
    widget:
      tipo: circuito
      esquema: mixto
      piezas: { fuente: V_m, r1: R_m1, r2: R_m2, r3: R_m3 }
      lectura: { valor: I_m3, rotulo: "Corriente por R₃" }
      datos:
        - { valor: I_m, rotulo: "Por R₁: {{I_m}}" }
      corriente: I_m
      mide: { corriente: I_m, i2: I_m2, i3: I_m3 }
      ocultar: true
    opciones:
      - texto: "1,2 A"
        bien: true
        porque: "Lo que entra en el nodo sale: 1,8 A se reparten en 0,6 A por los 8 Ω y 1,2 A por los 4 Ω."
      - texto: "0,6 A"
        porque: "Esa es la de la rama de 8 Ω. La de 4 Ω, con la misma tensión y la mitad de resistencia, lleva el doble."
      - texto: "1,8 A"
        porque: "Los 1,8 A son la suma de las dos ramas. Por la de 8 Ω también circula corriente."
    escalera:
      - "La ley de corrientes: lo que llega al nodo es lo que sale por las dos ramas."
      - "Las dos ramas tienen la misma tensión: la de 4 Ω lleva el doble que la de 8 Ω."
    solucion: "1,8 A = I₂ + I₃ con I₃ = 2·I₂: I₂ = 0,6 A e I₃ = 1,2 A."
    comprobar:
      - { I_m: 1.8, I_m2: 0.6, I_m3: 1.2 }

  - id: balance
    tipo: sorpresa
    titulo: "El balance que siempre cuadra"
    texto: "Mueva las resistencias. La potencia de la fuente y la suma de las disipadas no se separan nunca."
    libro: [53, 54]
    widget:
      tipo: circuito
      esquema: mixto
      piezas: { fuente: V_m, r1: R_m1, r2: R_m2, r3: R_m3 }
      lectura: { valor: P_f, rotulo: "Potencia entregada" }
      datos:
        - { valor: P_r, rotulo: "Disipada: {{P_r}}" }
      corriente: I_m
      mide: { corriente: I_m, i2: I_m2, i3: I_m3, v1: V_m1, paralelo: V_mp }
      mandos:
        - { valor: R_m2, min: 1, max: 20, paso: 1 }
        - { valor: R_m3, min: 1, max: 20, paso: 1 }

  - id: por-que-balance
    tipo: porque
    titulo: "¿Por qué es tan buena prueba?"
    texto: "Comprobar que la potencia entregada iguala la disipada detecta casi cualquier error de cálculo. ¿Por qué?"
    libro: [53, 54]
    widget:
      tipo: circuito
      esquema: mixto
      piezas: { fuente: V_m, r1: R_m1, r2: R_m2, r3: R_m3 }
      lectura: { valor: P_f, rotulo: "Potencia entregada" }
      corriente: I_m
      mide: { corriente: I_m }
    opciones:
      - texto: "Usa todos los resultados a la vez"
        bien: true
        porque: "Cada corriente y cada tensión entran en la suma: un signo o un valor mal hace que no cuadre."
      - texto: "Porque la potencia se puede superponer"
        porque: "La potencia no se superpone: depende del cuadrado. La prueba vale porque la energía se conserva."
      - texto: "Porque solo mira la fuente"
        porque: "Mira la fuente y todas las resistencias. Por eso detecta errores en cualquier rama."
    escalera:
      - "¿Cuántos de los resultados entran en la comprobación?"
    solucion: "Usa todos los resultados a la vez: un error en cualquiera rompe el balance."

  - id: falla-kvl
    tipo: pregunta
    titulo: "Cuando KVL falla"
    texto: "¿Cuándo deja de ser cero la suma de tensiones a lo largo de un lazo?"
    libro: [40, 42]
    widget:
      tipo: circuito
      esquema: serie
      piezas: { fuente: V_s, r1: R_s1, r2: R_s2, r3: R_s3 }
      lectura: { valor: V_suma, rotulo: "Suma de las caídas" }
      corriente: I_s
      mide: { corriente: I_s }
    opciones:
      - texto: "Cuando un campo magnético variable atraviesa la malla"
        bien: true
        porque: "Entonces la suma es igual a la fem inducida. Es lo que pasa en un transformador o en un bucle de placa expuesto."
      - texto: "Cuando la corriente sale negativa"
        porque: "Un signo negativo es información, no un error. La ley sigue valiendo."
      - texto: "Cuando hay más de tres resistencias"
        porque: "El número de elementos no importa. Lo que la rompe es un flujo magnético variable dentro del lazo."
    escalera:
      - "KVL dice que recorrer un camino cerrado devuelve al mismo potencial. ¿Qué lo impide?"
    solucion: "Un flujo magnético variable a través de la malla: la suma es la fem inducida."

  - id: falla-kcl
    tipo: pregunta
    titulo: "Cuando KCL falla"
    texto: "A frecuencias altas, una corriente entra en un nodo y no sale por ningún conductor. ¿Adónde va?"
    libro: [43]
    widget:
      tipo: circuito
      esquema: mixto
      piezas: { fuente: V_m, r1: R_m1, r2: R_m2, r3: R_m3 }
      lectura: { valor: I_m, rotulo: "Corriente total" }
      corriente: I_m
      mide: { corriente: I_m }
    opciones:
      - texto: "Por una capacidad parásita, hacia el plano o una pista vecina"
        bien: true
        porque: "Es la corriente de desplazamiento: la carga se acumula en las capacidades parásitas. Es la diafonía capacitiva."
      - texto: "Se pierde como calor en el nodo"
        porque: "Un nodo ideal no disipa. La corriente se va por un camino que el esquema no dibuja: una capacidad."
      - texto: "A ninguna parte: KCL vale siempre"
        porque: "KCL es una aproximación. Con corrientes de desplazamiento apreciables, la carga sí se acumula."
    escalera:
      - "Piense en caminos que no son conductores pero sí dejan pasar corriente variable."
    solucion: "Por una capacidad parásita: corriente de desplazamiento."

  - id: signo-negativo
    tipo: pregunta
    titulo: "Una corriente negativa"
    texto: "Al resolver, una corriente sale negativa. ¿Qué hay que hacer?"
    libro: [48]
    widget:
      tipo: circuito
      esquema: mixto
      piezas: { fuente: V_m, r1: R_m1, r2: R_m2, r3: R_m3 }
      lectura: { valor: I_m, rotulo: "Corriente total" }
      corriente: I_m
      mide: { corriente: I_m }
    opciones:
      - texto: "Nada: mantener el convenio y leer el signo"
        bien: true
        porque: "El signo negativo es información: el sentido real es el contrario al supuesto."
      - texto: "Cambiar el sentido supuesto y repetir el cálculo"
        porque: "Cambiar el convenio a mitad es la fuente de los signos inconsistentes, el error dominante."
      - texto: "Tomar su valor absoluto"
        porque: "Así se pierde el sentido de la corriente, y las demás ecuaciones dejan de cuadrar."
    escalera:
      - "El convenio se fija al principio."
    solucion: "Mantener el convenio: el signo dice que circula al revés de lo supuesto."

  - id: dos-masas
    tipo: pregunta
    titulo: "Dos símbolos de masa"
    texto: "En un esquema hay dos símbolos de masa sin ninguna línea entre ellos. ¿Cómo se tratan?"
    libro: [49]
    widget:
      tipo: circuito
      esquema: mixto
      piezas: { fuente: V_m, r1: R_m1, r2: R_m2, r3: R_m3 }
      lectura: { valor: I_m, rotulo: "Corriente total" }
      corriente: I_m
      mide: { corriente: I_m }
    opciones:
      - texto: "Como un solo nodo: están conectados"
        bien: true
        porque: "Olvidar que una masa es un nodo es uno de los errores de aplicación. Todos los puntos de masa son el mismo."
      - texto: "Como dos nodos distintos"
        porque: "Así saldría un nodo de más y un sistema mal planteado. El símbolo de masa ya los une."
      - texto: "Se ignoran al plantear"
        porque: "La masa es el nodo de referencia: sus ramas cuentan en la ley de corrientes."
    escalera:
      - "¿Qué representa el símbolo de masa?"
    solucion: "Un solo nodo: dos masas dibujadas están conectadas."

  - id: banco-kvl
    tipo: banco
    titulo: "Compruébelo en el banco"
    texto: "Monte un lazo con tres resistencias y una fuente. Mida cada caída con el Brymen y súmelas."
    libro: [56, 57]
    fijar: { V_s: 12 }
    banco:
      piezas: ["Una fuente de continua", "Tres resistencias en serie", "Brymen en V⎓"]
      medir: "Las tres caídas, una a una, con el mismo sentido de recorrido; escriba su suma."
      esperado: V_suma
      unidad: V
      tol: 0.03
      consejos:
        - { cuando: { valor: desviacion, mayor: 0.03 }, texto: "Suma de más: ¿ha medido alguna caída con el signo cambiado o dos veces?" }
        - { texto: "Suma de menos: revise los signos y mida la tensión real de la fuente, no la nominal." }

  - id: amperimetro
    tipo: pregunta
    titulo: "Medir corrientes"
    texto: "Para comprobar la ley de corrientes hay que medir la corriente de cada rama. ¿Qué hay que tener en cuenta?"
    libro: [57]
    widget:
      tipo: circuito
      esquema: mixto
      piezas: { fuente: V_m, r1: R_m1, r2: R_m2, r3: R_m3 }
      lectura: { valor: I_m, rotulo: "Corriente total" }
      corriente: I_m
      mide: { corriente: I_m }
    opciones:
      - texto: "Hay que abrir el circuito, y la resistencia del amperímetro altera lo que mide"
        bien: true
        porque: "Con resistencias grandes el efecto es despreciable; en un circuito de baja resistencia, no."
      - texto: "Basta poner el multímetro en paralelo con la rama"
        porque: "Un amperímetro en paralelo es casi un cortocircuito. Se intercala en serie, abriendo el circuito."
      - texto: "Nada: el amperímetro no cambia el circuito"
        porque: "Su propia resistencia se suma a la rama, y en un circuito de baja resistencia se nota."
    escalera:
      - "El amperímetro va en serie con lo que mide."
    solucion: "Intercalarlo abriendo el circuito, sabiendo que su resistencia altera la medida."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [37, 40, 48, 53]
    ideas:
      - { titulo: "Dos sumas.", texto: "Corrientes en un nodo y tensiones en un lazo suman cero: conservación de la carga y del potencial." }
      - { titulo: "Aproximaciones.", texto: "Fallan con flujo magnético variable (KVL) y con corrientes de desplazamiento (KCL)." }
      - { titulo: "Errores.", texto: "Signos inconsistentes, masas olvidadas y ecuaciones mal contadas. El signo negativo es información." }
      - { titulo: "Comprobar.", texto: "El balance de potencias usa todos los resultados a la vez." }
