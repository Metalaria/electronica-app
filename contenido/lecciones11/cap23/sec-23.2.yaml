# Lección 1.2 de la sección 22.2 «Las Leyes de Kirchhoff en Profundidad» (cap23). Formato: contenido/lecciones11/GUIA.md.
# 1.2.1 (autor121-pot, «aprender haciendo», GUIA §13): la ley de tensiones se recorre con un objetivo (R₂ con la mitad
# de la fuente); la corriente que baja por R₃ se predice y se simula, y luego se mide abriendo su rama; el balance de
# potencias se comprueba buscando 24 W; el signo negativo se lee con el amperímetro en la rama de R₂ del esquema
# «kirchhoff» (12 V y 6 V con 1 kΩ, 1 kΩ y 2 kΩ, valores de ejemplo). Quedan dos preguntas de opciones (por qué el
# balance es tan buena prueba y cuándo fallan las leyes); KCL con corrientes de desplazamiento y las dos masas pasan a
# las explicaciones y al resumen.
leccion: cap23/sec-23.2

libro:
  37: "La ley de corrientes (KCL) es la conservación de la carga"
  40: "Es la aproximación de parámetros concentrados."
  42: "KVL falla cuando hay campo magnético variable atravesando la malla"
  43: "KCL falla cuando hay corrientes de desplazamiento apreciables"
  48: "un signo negativo es información, no un error"
  49: "dos puntos marcados como masa en el esquema están conectados"
  53: "la potencia entregada por las fuentes debe igualar la disipada por las resistencias"
  54: "usa todos los resultados a la vez"
  56: "medir cada caída con el Brymen y comprobar que suman la tensión de la fuente"
  57: "su propia resistencia altera lo que mide"
  "cap23#100": "i₁ = 1,8 A, i₂ = 1,2 A"

modelo:
  valores:
    V_s: { sim: "V", nombre: "tensión de la fuente", unidad: V, valor: 12 }
    R_s1: { sim: "R₁", nombre: "primera resistencia", unidad: Ω, valor: 4 }
    R_s2: { sim: "R₂", nombre: "segunda resistencia", unidad: Ω, valor: 8 }
    R_s3: { sim: "R₃", nombre: "tercera resistencia", unidad: Ω, valor: 4 }
    V_m: { sim: "V", nombre: "tensión de la fuente", unidad: V, valor: 12 }
    R_m1: { sim: "R₁", nombre: "resistencia en serie", unidad: Ω, valor: 4 }
    R_m2: { sim: "R₂", nombre: "rama compartida", unidad: Ω, valor: 8 }
    R_m3: { sim: "R₃", nombre: "segunda rama", unidad: Ω, valor: 4 }
    V_k1: { sim: "V₁", nombre: "fuente de la izquierda", unidad: V, valor: 12 }
    V_k2: { sim: "V₂", nombre: "fuente de la derecha", unidad: V, valor: 6 }
    R_k1: { sim: "R₁", nombre: "resistencia de la izquierda", unidad: Ω, valor: 1000 }
    R_k2: { sim: "R₂", nombre: "resistencia de la derecha", unidad: Ω, valor: 1000 }
    R_k3: { sim: "R₃", nombre: "carga común", unidad: Ω, valor: 2000 }
  calculos:
    I_s: { expr: "V_s/(R_s1 + R_s2 + R_s3)", sim: "I", nombre: "corriente del lazo", unidad: A }
    V_s1: { expr: "I_s*R_s1", sim: "V₁", nombre: "caída en R₁", unidad: V }
    V_s2: { expr: "I_s*R_s2", sim: "V₂", nombre: "caída en R₂", unidad: V }
    V_s3: { expr: "I_s*R_s3", sim: "V₃", nombre: "caída en R₃", unidad: V }
    V_suma: { expr: "V_s1 + V_s2 + V_s3", sim: "ΣV", nombre: "suma de las caídas", unidad: V }
    R_mp: { expr: "par(R_m2, R_m3)", sim: "R₂ ‖ R₃", nombre: "paralelo", unidad: Ω }
    R_mt: { expr: "R_m1 + R_mp", sim: "R_{total}", nombre: "resistencia total", unidad: Ω }
    I_m: { expr: "V_m/(R_m1 + R_mp)", sim: "I", nombre: "corriente total", unidad: A }
    V_mp: { expr: "I_m*R_mp", sim: "V_{p}", nombre: "tensión del paralelo", unidad: V }
    I_m2: { expr: "V_mp/R_m2", sim: "I₂", nombre: "corriente por R₂", unidad: A }
    I_m3: { expr: "V_mp/R_m3", sim: "I₃", nombre: "corriente por R₃", unidad: A }
    V_m1: { expr: "I_m*R_m1", sim: "V₁", nombre: "tensión en R₁", unidad: V }
    P_f: { expr: "V_m*I_m", sim: "P_{fuente}", nombre: "potencia entregada", unidad: W }
    V_kn: { expr: "(V_k1/R_k1 + V_k2/R_k2)/(1/R_k1 + 1/R_k2 + 1/R_k3)", sim: "V_{n}", nombre: "tensión del nodo de arriba", unidad: V }
    I_k1: { expr: "(V_k1 - V_kn)/R_k1", sim: "I₁", nombre: "corriente de la izquierda", unidad: A }
    I_k2: { expr: "(V_k2 - V_kn)/R_k2", sim: "I₂", nombre: "corriente de la derecha", unidad: A }
    I_k3: { expr: "V_kn/R_k3", sim: "I₃", nombre: "corriente por la carga", unidad: A }
    P_r: { expr: "I_m^2*R_m1 + I_m2^2*R_m2 + I_m3^2*R_m3", sim: "P_{R}", nombre: "potencia disipada", unidad: W }

tarjetas:
  - id: explore-lazo
    tipo: explorar
    titulo: "Recorra el lazo"
    texto: "Mueva las resistencias hasta que R₂ se quede la mitad de la fuente, 6 V. Mire la suma de las tres caídas mientras tanto."
    libro: [37]
    nota: "Valores de ejemplo."
    inicio: { R_s1: 4, R_s2: 4 }
    widget:
      tipo: circuito
      esquema: serie
      piezas: { fuente: V_s, r1: R_s1, r2: R_s2, r3: R_s3 }
      lectura: { valor: V_suma, rotulo: "Suma de las caídas" }
      barras:
        - { valor: V_s1, rotulo: "R₁: {{V_s1}}", color: azul }
        - { valor: V_s2, rotulo: "R₂: {{V_s2}}", color: naranja }
        - { valor: V_s3, rotulo: "R₃: {{V_s3}}", color: verde }
      corriente: I_s
      mide: { corriente: I_s, v1: V_s1, v2: V_s2, v3: V_s3 }
      mandos:
        - { valor: R_s1, min: 1, max: 20, paso: 1 }
        - { valor: R_s2, min: 1, max: 20, paso: 1 }
    objetivo:
      condiciones:
        - { valor: V_s2, objetivo: 6, tol: 0.02, rotulo: "R₂: {{V_s2}}" }
      logrado: "R₂ se queda {{V_s2}} y las tres caídas siguen sumando {{V_suma}}: el potencial vuelve al de partida al cerrar el lazo."
      pistas:
        - { cuando: { valor: V_s2, mayor: 6.12 }, texto: "R₂ se queda demasiado: bájela o suba R₁." }
        - { texto: "R₂ se queda poco: súbala o baje R₁." }
    escalera:
      - "R₂ se queda la mitad cuando vale lo mismo que R₁ y R₃ juntas."
    solucion: "R₂ = R₁ + R₃; por ejemplo, R₁ = 4 Ω y R₂ = 8 Ω."
    comprobar:
      - { con: { R_s2: 8 }, V_s2: 6, V_suma: 12 }

  - id: prediga-nodo
    tipo: simular
    titulo: "Prediga la corriente"
    texto: "Con 12 V, R₁ = 4 Ω y el paralelo de 8 Ω y 4 Ω, por R₁ llegan 1,8 A. ¿Cuánto baja por R₃, la de 4 Ω?"
    libro: ["cap23#100", 37]
    fijar: { V_m: 12, R_m1: 4, R_m2: 8, R_m3: 4 }
    widget:
      tipo: circuito
      esquema: mixto
      piezas: { fuente: V_m, r1: R_m1, r2: R_m2, r3: R_m3 }
      lectura: { valor: I_m3, rotulo: "Corriente por R₃" }
      datos:
        - { valor: I_m, rotulo: "Por R₁: {{I_m}}" }
      corriente: I_m
      mide: { corriente: I_m, i2: I_m2, i3: I_m3 }
      ocultar: true
      mandos: []
    simular:
      objetivo: I_m3
      unidad: A
      tol: 0.02
      rotulo: "Corriente por R₃"
      medida: i3
      errores:
        - { expr: "I_m2", texto: "Esa es la de la rama de 8 Ω. La de 4 Ω, con la misma tensión y la mitad de resistencia, lleva el doble." }
        - { expr: "I_m", texto: "1,8 A es lo que llega al nodo: se reparte entre las dos ramas." }
    exito: "Lo que entra en el nodo sale: 1,8 A se reparten en 0,6 A por los 8 Ω y 1,2 A por los 4 Ω."
    escalera:
      - "La ley de corrientes: lo que llega al nodo es lo que sale por las dos ramas."
      - "Las dos ramas tienen la misma tensión: la de 4 Ω lleva el doble que la de 8 Ω."
    solucion: "1,8 A = I₂ + I₃ con I₃ = 2·I₂: I₂ = 0,6 A e I₃ = 1,2 A."
    comprobar:
      - { I_m: 1.8, I_m2: 0.6, I_m3: 1.2 }

  - id: amperimetro
    tipo: medir
    titulo: "Medir corrientes"
    texto: "Para comprobar la ley de corrientes hay que medir cada rama. Meta el amperímetro donde mediría los 0,6 A de la rama de 8 Ω."
    libro: [57, "cap23#100"]
    fijar: { V_m: 12, R_m1: 4, R_m2: 8, R_m3: 4 }
    widget:
      tipo: circuito
      esquema: mixto
      piezas: { fuente: V_m, r1: R_m1, r2: R_m2, r3: R_m3 }
      corriente: I_m
      mide: { corriente: I_m, i2: I_m2, i3: I_m3 }
      instrumento:
        tipo: multimetro
        modos: [A]
      mandos: []
    medir:
      magnitud: corriente
      rama: v2
      valor: I_m2
      porque:
        vmed: "Esa es la rama de la fuente: por ella pasan los 1,8 A que luego se reparten."
        v3: "Esa es la rama de 4 Ω: lleva el doble, 1,2 A."
    exito: "0,6 A. Para medirla ha tenido que abrir la rama: el amperímetro va en serie, y su resistencia se suma a la de la rama."
    escalera:
      - "Una corriente se mide en serie: abra la rama de la resistencia de 8 Ω."
    solucion: "El amperímetro en la rama de R₂, la del centro: 0,6 A."
    comprobar:
      - { I_m2: 0.6 }

  - id: balance
    tipo: sorpresa
    titulo: "El balance que siempre cuadra"
    texto: "Mueva las dos resistencias del paralelo hasta que la fuente entregue 24 W. Mire la suma de las disipadas."
    libro: [53, 54]
    nota: "Valores de ejemplo."
    inicio: { R_m2: 8, R_m3: 4 }
    widget:
      tipo: circuito
      esquema: mixto
      piezas: { fuente: V_m, r1: R_m1, r2: R_m2, r3: R_m3 }
      lectura: { valor: P_f, rotulo: "Potencia entregada" }
      datos:
        - { valor: P_r, rotulo: "Disipada: {{P_r}}" }
      corriente: I_m
      mide: { corriente: I_m, i2: I_m2, i3: I_m3, v1: V_m1, paralelo: V_mp }
      mandos:
        - { valor: R_m2, min: 1, max: 20, paso: 1 }
        - { valor: R_m3, min: 1, max: 20, paso: 1 }
    objetivo:
      condiciones:
        - { valor: P_f, objetivo: 24, tol: 0.02, rotulo: "Fuente: {{P_f}}" }
      logrado: "La fuente entrega {{P_f}} y las tres resistencias disipan {{P_r}}: lo mismo, con cualquier pareja."
      pistas:
        - { cuando: { valor: P_f, mayor: 24.48 }, texto: "Sobra potencia: suba alguna de las dos del paralelo." }
        - { texto: "Falta potencia: baje alguna de las dos del paralelo." }
    escalera:
      - "24 W con 12 V son 2 A: la resistencia total debe ser 6 Ω, así que el paralelo debe dar 2 Ω."
    solucion: "Un paralelo de 2 Ω: por ejemplo, 4 Ω y 4 Ω."
    comprobar:
      - { con: { R_m2: 4, R_m3: 4 }, P_f: 24, P_r: 24, I_m: 2, R_mt: 6, R_mp: 2 }

  - id: por-que-balance
    tipo: porque
    titulo: "¿Por qué es tan buena prueba?"
    texto: "Comprobar que la potencia entregada iguala la disipada detecta casi cualquier error de cálculo. ¿Por qué?"
    libro: [53, 54]
    widget:
      tipo: circuito
      esquema: mixto
      piezas: { fuente: V_m, r1: R_m1, r2: R_m2, r3: R_m3 }
      lectura: { valor: P_f, rotulo: "Potencia entregada" }
      corriente: I_m
      mide: { corriente: I_m }
      mandos: []
    opciones:
      - texto: "Usa todos los resultados a la vez"
        bien: true
        porque: "Cada corriente y cada tensión entran en la suma: un signo o un valor mal hace que no cuadre."
      - texto: "Porque la potencia se puede superponer"
        porque: "La potencia no se superpone: depende del cuadrado. La prueba vale porque la energía se conserva."
      - texto: "Porque solo mira la fuente"
        porque: "Mira la fuente y todas las resistencias. Por eso detecta errores en cualquier rama."
    escalera:
      - "¿Cuántos de los resultados entran en la comprobación?"
    solucion: "Usa todos los resultados a la vez: un error en cualquiera rompe el balance."

  - id: signo-negativo
    tipo: leer
    titulo: "Una corriente negativa"
    texto: "En este circuito se supone que la corriente de R₂ baja hacia el nodo. Mídala con el amperímetro y escriba lo que marca, con su signo."
    libro: [48]
    nota: "Valores de ejemplo."
    widget:
      tipo: circuito
      esquema: kirchhoff
      piezas: { fuente1: V_k1, fuente2: V_k2, r1: R_k1, r2: R_k2, r3: R_k3 }
      corriente: I_k3
      mide: { nodo: V_kn, i1: I_k1, i2: I_k2, i3: I_k3 }
      instrumento:
        tipo: multimetro
        modos: [A]
      mandos: []
    leer:
      objetivo: I_k2
      unidad: A
      tol: 0.02
      rotulo: "Corriente de la rama de R₂"
      medida: { rama: vm2 }
      errores:
        - { expr: "I_k1", texto: "Esa es la corriente de R₁: el amperímetro estaba en la rama de la izquierda." }
        - { expr: "I_k3", texto: "Esa es la de la carga: mida en la rama de R₂." }
    exito: "Sale negativa: circula al revés de lo supuesto, del nodo hacia la fuente de 6 V. El signo es información: se mantiene el convenio."
    escalera:
      - "Abra la rama de R₂ y copie la lectura tal cual, con el signo."
    solucion: "−1,20 mA: por R₂ la corriente sube hacia la fuente de 6 V."
    comprobar:
      - { I_k2: -0.0012, V_kn: 7.2 }

  - id: falla-kvl
    tipo: pregunta
    titulo: "Cuando KVL falla"
    texto: "¿Cuándo deja de ser cero la suma de tensiones a lo largo de un lazo?"
    libro: [40, 42, 43]
    widget:
      tipo: circuito
      esquema: serie
      piezas: { fuente: V_s, r1: R_s1, r2: R_s2, r3: R_s3 }
      lectura: { valor: V_suma, rotulo: "Suma de las caídas" }
      corriente: I_s
      mide: { corriente: I_s }
      mandos: []
    opciones:
      - texto: "Cuando un campo magnético variable atraviesa la malla"
        bien: true
        porque: "La suma es la fem inducida, como en un transformador. KCL tiene su límite parecido: las corrientes de desplazamiento por capacidades parásitas."
      - texto: "Cuando la corriente sale negativa"
        porque: "Un signo negativo es información, no un error. La ley sigue valiendo."
      - texto: "Cuando hay más de tres resistencias"
        porque: "El número de elementos no importa. Lo que la rompe es un flujo magnético variable dentro del lazo."
    escalera:
      - "KVL dice que recorrer un camino cerrado devuelve al mismo potencial. ¿Qué lo impide?"
    solucion: "Un flujo magnético variable a través de la malla: la suma es la fem inducida."

  - id: banco-kvl
    tipo: banco
    titulo: "Compruébelo en el banco"
    texto: "Monte un lazo con tres resistencias y una fuente. Mida cada caída con el Brymen y súmelas."
    libro: [56, 57]
    fijar: { V_s: 12 }
    banco:
      piezas: ["Una fuente de continua", "Tres resistencias en serie", "Brymen en V⎓"]
      medir: "Las tres caídas, una a una, con el mismo sentido de recorrido; escriba su suma."
      esperado: V_suma
      unidad: V
      tol: 0.03
      consejos:
        - { cuando: { valor: desviacion, mayor: 0.03 }, texto: "Suma de más: ¿ha medido alguna caída con el signo cambiado o dos veces?" }
        - { texto: "Suma de menos: revise los signos y mida la tensión real de la fuente, no la nominal." }

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [37, 40, 48, 49, 53]
    ideas:
      - { titulo: "Dos sumas.", texto: "Corrientes en un nodo y tensiones en un lazo suman cero: conservación de la carga y del potencial." }
      - { titulo: "Aproximaciones.", texto: "Fallan con flujo magnético variable (KVL) y con corrientes de desplazamiento (KCL)." }
      - { titulo: "Errores.", texto: "Signos inconsistentes y masas olvidadas: dos masas dibujadas son un solo nodo. El signo negativo es información." }
      - { titulo: "Comprobar.", texto: "El balance de potencias usa todos los resultados a la vez." }
