# Lección 1.2 de la sección 22.3 «Análisis por Nodos» (cap23). Formato: contenido/lecciones11/GUIA.md.
# 1.2.1 (autor121-pot, «aprender haciendo», GUIA §13): el nodo A se lleva a los 6 V de la fuente derecha (objetivo: sin
# corriente por R₂); V_A se predice y se simula; la corriente al revés se arregla subiendo la fuente y se explica
# midiendo V_A; el ejemplo mínimo del libro (2 A, 10 Ω, 5 Ω y 20 Ω) se monta como un Norton cuya carga son los 5 + 20 Ω
# en serie: se escribe el término fuera de la diagonal y se comprueba midiendo la corriente de los 10 Ω. Queda una
# pregunta de opciones (el supernodo) y el orden del procedimiento.
leccion: cap23/sec-23.3

libro:
  62: "basta numerar los nodos y aplicar una regla mecánica"
  65: "Elegir un nodo de referencia (masa)"
  66: 'V_("nodo") - V_("vecino")'
  67: "Resolver el sistema, que tiene tantas ecuaciones como incógnitas."
  68: "Un circuito con seis mallas y cuatro nodos se resuelve con tres ecuaciones en lugar de seis."
  71: "va la conductancia que une los nodos i y j, con signo negativo"
  75: "su corriente es desconocida"
  78: "se usa el supernodo"
  80: "Una fuente de corriente de 2 A inyecta en el nodo 1"
  81: 'V_("1") - V_("2")'
  83: "fuera de ella −0,2 S en ambas posiciones"
  84: "ambas suman los 2 A de la fuente"
  86: "en electrónica casi siempre hay pocos nodos y muchas mallas"
  88: "El análisis nodal da tensiones"
  89: "6,4615 V"
  90: "Una sola ecuación KCL basta para resolverlo"
  "cap23#48": "un signo negativo es información, no un error"
  "cap23#349": "Halla la tensión del nodo VA por análisis de nodos"

modelo:
  valores:
    V_k1: { sim: "V₁", nombre: "fuente de la izquierda", unidad: V, valor: 10 }
    V_k2: { sim: "V₂", nombre: "fuente de la derecha", unidad: V, valor: 6 }
    R_k1: { sim: "R₁", nombre: "resistencia de la izquierda", unidad: Ω, valor: 2 }
    R_k2: { sim: "R₂", nombre: "resistencia de la derecha", unidad: Ω, valor: 3 }
    R_k3: { sim: "R₃", nombre: "resistencia a masa", unidad: Ω, valor: 4 }
    n_nod: { sim: "n", nombre: "nodos del circuito", unidad: "", valor: 4 }
    I_e: { sim: "I", nombre: "fuente de corriente del ejemplo", unidad: A, valor: 2 }
    R_e1: { sim: "R", nombre: "resistencia del nodo 1 a masa", unidad: Ω, valor: 10 }
    R_e12: { sim: "R", nombre: "resistencia entre los nodos 1 y 2", unidad: Ω, valor: 5 }
    R_e2: { sim: "R", nombre: "resistencia del nodo 2 a masa", unidad: Ω, valor: 20 }
  calculos:
    V_kn: { expr: "(V_k1/R_k1 + V_k2/R_k2)/(1/R_k1 + 1/R_k2 + 1/R_k3)", sim: "V_{A}", nombre: "tensión del nodo A", unidad: V }
    I_k1: { expr: "(V_k1 - V_kn)/R_k1", sim: "I₁", nombre: "corriente que llega por R₁", unidad: A }
    I_k2: { expr: "(V_k2 - V_kn)/R_k2", sim: "I₂", nombre: "corriente que llega por R₂", unidad: A }
    I_k3: { expr: "V_kn/R_k3", sim: "I₃", nombre: "corriente que baja por R₃", unidad: A }
    V_sin3: { expr: "(V_k1/R_k1 + V_k2/R_k2)/(1/R_k1 + 1/R_k2)", sim: "V_{A}", nombre: "nodo sin la rama a masa", unidad: V }
    R_ec: { expr: "R_e12 + R_e2", sim: "R", nombre: "camino del nodo 1 a masa por el nodo 2", unidad: Ω }
    V_e1: { expr: "I_e*par(R_e1, R_ec)", sim: "V₁", nombre: "tensión del nodo 1", unidad: V }
    V_e2: { expr: "V_e1*R_e2/R_ec", sim: "V₂", nombre: "tensión del nodo 2", unidad: V }
    I_e10: { expr: "V_e1/R_e1", sim: "I_{10}", nombre: "corriente por los 10 Ω", unidad: A }
    I_e5: { expr: "V_e1/R_ec", sim: "I_{5}", nombre: "corriente por los 5 Ω", unidad: A }
    G_12: { expr: "-1/R_e12", sim: "G_{12}", nombre: "término (1, 2) de la matriz", unidad: S }
    G_11: { expr: "1/R_e1 + 1/R_e12", sim: "G_{11}", nombre: "diagonal del nodo 1", unidad: S }
    V_med: { expr: "(V_k1 + V_k2)/2", sim: "V", nombre: "media de las dos fuentes", unidad: V }
    n_ecs: { expr: "n_nod - 1", sim: "n − 1", nombre: "ecuaciones de nodo", unidad: "" }

tarjetas:
  - id: explore-nodo
    tipo: explorar
    titulo: "Un nodo, una incógnita"
    texto: "Con la masa de referencia, solo queda por hallar V_{A}. Mueva R₁ y R₃ hasta que por R₂ no pase corriente."
    libro: [65, 90]
    inicio: { R_k1: 2, R_k3: 4 }
    widget:
      tipo: circuito
      esquema: kirchhoff
      piezas: { fuente1: V_k1, fuente2: V_k2, r1: R_k1, r2: R_k2, r3: R_k3 }
      lectura: { valor: V_kn, rotulo: "Tensión del nodo A" }
      datos:
        - { valor: I_k2, rotulo: "I₂ = {{I_k2}}" }
      corriente: I_k3
      mide: { nodo: V_kn, i1: I_k1, i2: I_k2, i3: I_k3 }
      mandos:
        - { valor: R_k1, min: 1, max: 10, paso: 1 }
        - { valor: R_k3, min: 1, max: 10, paso: 1 }
    objetivo:
      condiciones:
        - { valor: I_k2, min: -0.005, max: 0.005, rotulo: "I₂: {{I_k2}}" }
      logrado: "V_{A} = {{V_kn}}, la tensión de la fuente derecha: sin diferencia entre los extremos de R₂ no hay corriente."
      pistas:
        - { cuando: { valor: I_k2, menor: -0.005 }, texto: "A está por encima de 6 V: suba R₁ o baje R₃." }
        - { texto: "A está por debajo de 6 V: baje R₁ o suba R₃." }
    escalera:
      - "Por R₂ no pasa corriente cuando V_{A} vale 6 V."
      - "Con R₂ sin corriente, lo que llega por R₁ baja todo por R₃: (10 − 6)/R₁ = 6/R₃."
    solucion: "Por ejemplo, R₁ = 2 Ω y R₃ = 3 Ω: V_{A} = 6 V."
    comprobar:
      - { con: { R_k1: 2, R_k3: 3 }, V_kn: 6, I_k2: 0 }

  - id: prediga-nodo
    tipo: simular
    titulo: "Prediga la tensión de A"
    texto: "10 V por 2 Ω, 4 Ω a masa y 6 V por 3 Ω. ¿Cuánto vale V_{A}?"
    libro: [89, 90]
    fijar: { V_k1: 10, V_k2: 6, R_k1: 2, R_k2: 3, R_k3: 4 }
    widget:
      tipo: circuito
      esquema: kirchhoff
      piezas: { fuente1: V_k1, fuente2: V_k2, r1: R_k1, r2: R_k2, r3: R_k3 }
      lectura: { valor: V_kn, rotulo: "Tensión del nodo A" }
      corriente: I_k3
      mide: { nodo: V_kn }
      ocultar: true
      mandos: []
    simular:
      objetivo: V_kn
      unidad: V
      tol: 0.02
      rotulo: "Tensión del nodo, V_{A}"
      medida: nodo
      errores:
        - { expr: "V_sin3", texto: "Eso daría el nodo sin la rama de 4 Ω a masa. Esa rama también se lleva corriente y baja la tensión." }
        - { expr: "V_med", texto: "Es la media de 10 y 6 V. Cada fuente pesa según su conductancia, y además está la rama a masa." }
    exito: "Una sola ecuación KCL: V_{A} · (1/2 + 1/4 + 1/3) = 10/2 + 6/3, de donde V_{A} = 84/13 = 6,4615 V."
    escalera:
      - "Escriba la suma de las corrientes que salen de A, cada una como (V_{A} − V_{vecino})/R."
      - "Agrupe: V_{A} · (1/2 + 1/4 + 1/3) = 10/2 + 6/3."
    solucion: "V_{A} = 7/(13/12) = 84/13 = 6,4615 V."
    comprobar:
      - { V_kn: 6.4615, V_sin3: 8.4, V_med: 8 }

  - id: regla-nodo
    tipo: formula
    titulo: "Cada corriente, con tensiones"
    texto: "Lo que acaba de calcular: en cada nodo, la suma de las corrientes que salen es cero, cada una con la ley de Ohm. Mueva R₃."
    libro: [66, 89]
    ec: 66
    sustitucion: "({{V_kn}} − {{V_k1}})/{{R_k1}} + {{V_kn}}/{{R_k3}} + ({{V_kn}} − {{V_k2}})/{{R_k2}} = 0"
    widget:
      tipo: circuito
      esquema: kirchhoff
      piezas: { fuente1: V_k1, fuente2: V_k2, r1: R_k1, r2: R_k2, r3: R_k3 }
      lectura: { valor: V_kn, rotulo: "Tensión del nodo A" }
      corriente: I_k3
      mide: { nodo: V_kn, i1: I_k1, i2: I_k2, i3: I_k3 }
      mandos:
        - { valor: R_k3, min: 1, max: 10, paso: 1 }

  - id: corriente-negativa
    tipo: sorpresa
    titulo: "Una corriente al revés"
    texto: "Con la fuente derecha en 6 V, I₂ sale negativa. Cambie esa fuente hasta que su corriente llegue de verdad al nodo A."
    libro: [89]
    fijar: { V_k1: 10, R_k1: 2, R_k2: 3, R_k3: 4 }
    inicio: { V_k2: 6 }
    widget:
      tipo: circuito
      esquema: kirchhoff
      piezas: { fuente1: V_k1, fuente2: V_k2, r1: R_k1, r2: R_k2, r3: R_k3 }
      lectura: { valor: I_k2, rotulo: "Corriente que llega por R₂" }
      datos:
        - { valor: V_kn, rotulo: "V_{A} = {{V_kn}}" }
      corriente: I_k3
      mide: { nodo: V_kn, i2: I_k2 }
      mandos:
        - { valor: V_k2, lista: [6, 12], rotulo: "Fuente de la derecha" }
    objetivo:
      condiciones:
        - { valor: I_k2, min: 0, rotulo: "I₂: {{I_k2}}" }
      logrado: "Con {{V_k2}} la fuente queda por encima de A ({{V_kn}}) y su corriente entra en el nodo: {{I_k2}}."
      pistas:
        - { texto: "La fuente sigue por debajo de V_{A}: súbala." }
    escalera:
      - "La corriente va del lado de más tensión al de menos."
    solucion: "La fuente derecha en 12 V."
    comprobar:
      - { I_k2: -0.1538, V_kn: 6.4615 }
      - { con: { V_k2: 12 }, V_kn: 8.3077, tol: 0.001 }

  - id: por-que-negativa
    tipo: medir
    titulo: "¿Por qué salía negativa?"
    texto: "Vuelva a 6 V en la fuente derecha. Mida la tensión del nodo A respecto a masa y compárela con esos 6 V."
    libro: [88, 89, "cap23#48"]
    fijar: { V_k1: 10, V_k2: 6, R_k1: 2, R_k2: 3, R_k3: 4 }
    widget:
      tipo: circuito
      esquema: kirchhoff
      piezas: { fuente1: V_k1, fuente2: V_k2, r1: R_k1, r2: R_k2, r3: R_k3 }
      corriente: I_k3
      mide: { nodo: V_kn, i2: I_k2 }
      instrumento:
        tipo: multimetro
        modos: [V]
      mandos: []
    medir:
      magnitud: tension
      entre: [n, "0"]
      valor: V_kn
      porque:
        f1: "Esa punta está en la fuente de 10 V: mide la fuente, no el nodo."
        f2: "Esa punta está en la fuente de 6 V: mide sus 6 V, no el nodo A."
    exito: "6,46 V, por encima de los 6 V: por R₂ la corriente va de A hacia la fuente. El signo negativo era información, no un error."
    escalera:
      - "El nodo A es el de arriba, donde se unen las tres resistencias; la referencia, la masa."
    solucion: "Roja en el nodo de arriba y negra en masa: 6,46 V."
    comprobar:
      - { I_k2: -0.1538, V_kn: 6.4615 }

  - id: simule-ejercicio
    tipo: simular
    titulo: "Prediga y simule"
    texto: "10 V por 2 Ω, 2 Ω a masa y 5 V por 1 Ω. ¿Cuánto vale V_{A}?"
    libro: ["cap23#349"]
    fijar: { V_k1: 10, R_k1: 2, R_k3: 2, V_k2: 5, R_k2: 1 }
    widget:
      tipo: circuito
      esquema: kirchhoff
      piezas: { fuente1: V_k1, fuente2: V_k2, r1: R_k1, r2: R_k2, r3: R_k3 }
      lectura: { valor: V_kn, rotulo: "Tensión del nodo A" }
      mide: { nodo: V_kn }
      ocultar: true
      mandos: []
    simular:
      objetivo: V_kn
      unidad: V
      tol: 0.03
      rotulo: "Tensión del nodo, V_{A}"
      medida: nodo
      errores:
        - { expr: "V_sin3", texto: "Ha olvidado la rama de 2 Ω a masa: también saca corriente del nodo." }
        - { expr: "V_med", texto: "Es la media simple. Cada fuente pesa según la conductancia de su rama." }
    exito: "(V_{A} − 10)/2 + V_{A}/2 + (V_{A} − 5)/1 = 0: V_{A} = 5 V."
    escalera:
      - "Escriba las tres corrientes que salen de A y súmelas."
      - "Multiplique por 2 para quitar denominadores: (V_{A} − 10) + V_{A} + 2(V_{A} − 5) = 0."
    solucion: "4·V_{A} − 20 = 0, así que V_{A} = 5 V."
    comprobar:
      - { V_kn: 5 }

  - id: fuera-diagonal
    tipo: leer
    titulo: "La matriz por inspección"
    texto: "El ejemplo del libro: 2 A en el nodo 1, 10 Ω a masa y 5 Ω hasta el nodo 2, que baja por 20 Ω. Escriba el término (1, 2) de la matriz."
    libro: [71, 80, 81, 83]
    widget:
      tipo: circuito
      esquema: norton
      piezas: { fuente: I_e, rn: R_e1, carga: R_ec }
      lectura: { valor: V_e1, rotulo: "Tensión del nodo 1" }
      corriente: I_e10
      mide: { salida: V_e1, carga: I_e5, paralelo: I_e10 }
      mandos: []
    leer:
      objetivo: G_12
      unidad: S
      tol: 0.02
      rotulo: "Término (1, 2) de la matriz"
      errores:
        - { expr: "G_11", texto: "Eso es la diagonal del nodo 1: la suma de sus conductancias, 0,1 + 0,2 S." }
    exito: "−0,2 S: fuera de la diagonal va la conductancia que une los dos nodos, con signo negativo, y también en la (2, 1)."
    escalera:
      - "La conductancia de 5 Ω es 1/5 S."
      - "Fuera de la diagonal, con signo menos."
    solucion: "−1/5 = −0,2 S en ambas posiciones."
    comprobar:
      - { G_12: -0.2, G_11: 0.3 }

  - id: comprobacion
    tipo: leer
    titulo: "La comprobación"
    texto: "Resuelto, V₁ = 14,3 V. Compruébelo como en el libro: mida la corriente que baja por los 10 Ω y escríbala."
    libro: [83, 84, 88]
    widget:
      tipo: circuito
      esquema: norton
      piezas: { fuente: I_e, rn: R_e1, carga: R_ec }
      corriente: I_e10
      mide: { salida: V_e1, carga: I_e5, paralelo: I_e10 }
      instrumento:
        tipo: multimetro
        modos: [A]
      mandos: []
    leer:
      objetivo: I_e10
      unidad: A
      tol: 0.02
      rotulo: "Corriente por los 10 Ω"
      medida: { rama: vr }
      errores:
        - { expr: "I_e5", texto: "Esos 0,57 A van por los 5 Ω hacia el nodo 2: el amperímetro estaba en la otra rama." }
        - { expr: "I_e", texto: "Eso es la fuente entera: se reparte entre las dos ramas." }
    exito: "1,43 A por los 10 Ω y 0,57 A por los 5 Ω: suman los 2 A de la fuente. Es la KCL con los resultados."
    escalera:
      - "Abra la rama de la resistencia en paralelo con la fuente."
    solucion: "14,29/10 = 1,43 A."
    comprobar:
      - { V_e1: 14.2857, V_e2: 11.4286, I_e10: 1.4286, I_e5: 0.5714, R_ec: 25 }

  - id: supernodo
    tipo: pregunta
    titulo: "Una fuente de tensión entre dos nodos"
    texto: "Una fuente de tensión ideal une dos nodos que no son la referencia. ¿Cómo se plantea?"
    libro: [75, 78]
    ec: 66
    opciones:
      - texto: "Con un supernodo que engloba los dos, más la ecuación V_{a} − V_{b} = V_{fuente}"
        bien: true
        porque: "Dentro del supernodo la corriente desconocida de la fuente se cancela, y la ecuación auxiliar completa el sistema."
      - texto: "Con su corriente escrita como (V_{a} − V_{b})/R"
        porque: "Una fuente ideal no tiene resistencia: su corriente es desconocida y no se escribe con tensiones."
      - texto: "Se quita la fuente y se resuelve sin ella"
        porque: "Quitarla cambia el circuito. Impone una diferencia de tensión que el sistema debe recoger."
    escalera:
      - "El problema es que no se conoce la corriente de la fuente."
    solucion: "Supernodo: KCL alrededor de los dos nodos y la ecuación V_{a} − V_{b} = V_{fuente}."

  - id: cuantas-ecuaciones
    tipo: leer
    titulo: "¿Cuántas ecuaciones?"
    texto: "Un circuito con seis mallas y cuatro nodos. Escriba cuántas ecuaciones pide el análisis nodal."
    libro: [68, 86]
    widget:
      tipo: grafica
      x: { id: nn, min: 2, max: 10, unidad: "", rotulo: "nodos, n" }
      y: { min: 0, max: 10, unidad: "", rotulo: "ecuaciones" }
      curvas:
        - { expr: "nn - 1", color: azul, rotulo: "ecuaciones de nodo" }
      mandos: []
    leer:
      objetivo: n_ecs
      unidad: ""
      tol: 0.01
      rotulo: "Ecuaciones de nodo"
      errores:
        - { expr: "6", texto: "Seis son las de mallas. El nodal pide una por nodo, salvo la referencia." }
        - { expr: "n_nod", texto: "Un nodo es la referencia: su tensión es cero y no es incógnita." }
    exito: "Tres, n − 1, frente a las seis de mallas. En electrónica hay pocos nodos y muchas mallas: el nodal gana casi siempre."
    escalera:
      - "Un nodo es la referencia: su tensión es cero."
    solucion: "Con 4 nodos, n − 1 = 3 ecuaciones."
    comprobar:
      - { n_ecs: 3 }

  - id: procedimiento
    tipo: pregunta
    fase: "Ordene"
    titulo: "El procedimiento"
    texto: "Ponga en orden los pasos del análisis por nodos."
    libro: [65, 67]
    ordenar:
      - "Elegir un nodo de referencia (masa)."
      - "Asignar una tensión incógnita a cada uno de los demás nodos."
      - "Escribir la ley de corrientes en cada nodo, con tensiones."
      - "Resolver el sistema."
    exito: "Es tan mecánico que no exige decisiones humanas: por eso lo usa SPICE."
    pistas:
      - { texto: "Primero la referencia y las incógnitas; las ecuaciones, después; resolver, lo último." }
    escalera:
      - "Antes de escribir ninguna ecuación hay que saber respecto a qué se miden las tensiones."
    solucion: "Referencia, incógnitas, KCL en cada nodo y resolver."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [62, 71, 78, 88]
    ideas:
      - { titulo: "Tensiones de nodo.", texto: "Masa como referencia, n − 1 incógnitas y la ley de corrientes en cada nodo, con (V_{nodo} − V_{vecino})/R." }
      - { titulo: "Por inspección.", texto: "Diagonal: la suma de conductancias del nodo. Fuera: la compartida, con signo menos." }
      - { titulo: "Fuentes de tensión.", texto: "A masa, fijan el nodo; entre dos nodos, supernodo y V_{a} − V_{b} = V_{fuente}." }
      - { titulo: "Se mide fácil.", texto: "Da tensiones: se comprueba con el multímetro respecto a masa." }
