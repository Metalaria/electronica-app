# Lección 1.2 de la sección 22.11 «Fuentes Dependientes en el Análisis» (cap23). Formato: contenido/lecciones11/GUIA.md.
# La VCCS se dibuja con el esquema «fuente-controlada» (rombo g_m·v con r_o en paralelo). Sus valores son los del
# transistor a 1 mA de la sección 6.1 (cap06#44 y #47): g_m = 38,7 mS, r_o = 100 kΩ y 4,7 kΩ de colector.
# 1.2.1 (autor121-pot, «aprender haciendo», GUIA §13): la salida se lleva a medio voltio con la tensión de control
# (objetivo); sin carga, toda la corriente controlada pasa por r_o; v_o se predice y se simula (la restricción y el
# procedimiento van en su éxito); g_m se escribe con la corriente de la fuente a 1 mV (los cuatro tipos, en su
# éxito); la resistencia negativa se consigue en la recta (el oscilador, en su «logrado»). Quedan dos preguntas de
# opciones (R_Th con dependientes y por qué la resistencia negativa no es un error).
leccion: cap23/sec-23.11

libro:
  256: "Una dependiente —o controlada— tiene un valor que es función de una tensión o una corriente del propio circuito"
  257: "El transistor en pequeña señal es una fuente de corriente controlada por tensión"
  260: "Transconductancia: el transistor"
  261: "gm = IC/VT es exactamente el coeficiente de una VCCS"
  263: "las fuentes dependientes NO se anulan"
  265: "hay que usar el método de la fuente de prueba"
  269: "Añadir una ecuación de restricción"
  272: "Un circuito con fuentes dependientes puede tener resistencia de entrada negativa."
  273: "al aumentar la tensión aplicada, la corriente disminuye"
  275: "una resistencia negativa cancela las pérdidas de un tanque y la oscilación se sostiene"
  "cap06#44": "a 1 mA con VA = 100 V vale 100 kΩ"
  "cap06#47": "cada milivoltio de entrada mueve 38,7 µA de colector"

modelo:
  valores:
    v_c: { sim: "v", nombre: "tensión de control", unidad: V, valor: 0.001 }
    g_m: { sim: "g_{m}", nombre: "transconductancia", unidad: S, valor: 0.038685 }
    r_o: { sim: "r_{o}", nombre: "resistencia de salida", unidad: Ω, valor: 100000 }
    R_C: { sim: "R_{C}", nombre: "carga", unidad: Ω, valor: 4700 }
    n_on: { tipo: interruptor, nombre: "carga conectada", valor: 1 }
    R_in: { sim: "R_{in}", nombre: "resistencia de entrada", unidad: Ω, valor: 100 }
  calculos:
    I_n: { expr: "g_m*v_c", sim: "g_{m} · v", nombre: "corriente de la fuente controlada", unidad: A }
    V_no: { si: n_on, entonces: "I_n*par(r_o, R_C)", sino: "I_n*r_o", sim: "v_{o}", nombre: "tensión de salida", unidad: V }
    I_nl: { si: n_on, entonces: "V_no/R_C", sino: "0", sim: "I_{L}", nombre: "corriente por la carga", unidad: A }
    I_nr: { expr: "V_no/r_o", sim: "I_{ro}", nombre: "corriente por r_o", unidad: A }
    I_1v: { expr: "1/R_in", sim: "I", nombre: "corriente con 1 V aplicado", unidad: A }
    V_sr: { expr: "I_n*R_C", sim: "v_{o}", nombre: "salida sin contar r_o", unidad: V }
    V_sc: { expr: "I_n*r_o", sim: "v_{o}", nombre: "salida sin la carga", unidad: V }
    g_med: { expr: "I_n/v_c", sim: "I/v", nombre: "transconductancia medida", unidad: S }
    G_v: { expr: "V_no/v_c", sim: "v_{o}/v", nombre: "ganancia de tensión", unidad: "" }
    R_par: { expr: "par(r_o, R_C)", sim: "r_{o} ‖ R_{C}", nombre: "resistencia vista por la fuente", unidad: Ω }

tarjetas:
  - id: explore-controlada
    tipo: explorar
    titulo: "Una fuente que obedece"
    texto: "Esta fuente vale g_{m} · v: la manda una tensión del circuito. Suba v hasta tener medio voltio a la salida."
    nota: "El transistor a 1 mA: g_{m} = 38,7 mS, r_{o} = 100 kΩ y 4,7 kΩ de colector."
    libro: [256, 257, 261, "cap06#44", "cap06#47"]
    inicio: { v_c: 0.001 }
    widget:
      tipo: circuito
      esquema: fuente-controlada
      piezas: { control: v_c, gm: g_m, ro: r_o, carga: R_C, interruptor: n_on }
      lectura: { valor: V_no, rotulo: "Tensión de salida" }
      datos:
        - { valor: I_n, rotulo: "g_{m} · v = {{I_n}}" }
      corriente: I_nl
      mide: { salida: V_no, carga: I_nl, controlada: I_n, ro: I_nr }
      mandos:
        - { valor: v_c, min: 0, max: 0.005, paso: 0.0005, rotulo: "Tensión de control, v" }
    objetivo:
      condiciones:
        - { valor: V_no, min: 0.5, rotulo: "Salida: {{V_no}}" }
      logrado: "Con {{v_c}} de control, {{V_no}}: la salida es {{G_v}} veces la entrada a la salida. La fuente no tiene valor propio: lo dicta v."
      pistas:
        - { texto: "Todavía no llega: más tensión de control." }
    escalera:
      - "La salida es g_{m} · v · (r_{o} ‖ R_{C}): unos 174 mV por milivoltio."
    solucion: "Con 3 mV: 0,521 V."
    comprobar:
      - { con: { v_c: 0.003 }, V_no: 0.5211, tol: 0.002 }
      - { G_v: 173.7, V_no: 0.1737, tol: 0.002 }

  - id: sin-carga
    tipo: explorar
    titulo: "Su resistencia de salida"
    texto: "La fuente controlada lleva r_{o} en paralelo: es un Norton que obedece. Desconecte la carga y mire adónde va la corriente."
    libro: [257, "cap06#44"]
    fijar: { v_c: 0.001 }
    inicio: { n_on: 1 }
    widget:
      tipo: circuito
      esquema: fuente-controlada
      piezas: { control: v_c, gm: g_m, ro: r_o, carga: R_C, interruptor: n_on }
      lectura: { valor: V_no, rotulo: "Tensión de salida" }
      datos:
        - { valor: I_nr, rotulo: "Por r_{o}: {{I_nr}}" }
      corriente: I_nl
      mide: { salida: V_no, carga: I_nl, controlada: I_n, ro: I_nr }
      mandos:
        - { valor: n_on, tipo: interruptor, rotulo: "Carga de 4,7 kΩ" }
    objetivo:
      condiciones:
        - { valor: n_on, max: 0, rotulo: "Carga desconectada" }
      logrado: "Sin carga, los 38,7 µA pasan todos por r_{o}: {{V_no}}. Con la carga, se reparten y quedan 174 mV."
      pistas:
        - { texto: "Abra el interruptor de la carga." }
    escalera:
      - "Quite la carga con el interruptor."
    solucion: "Sin carga: 38,7 µA × 100 kΩ = 3,87 V."
    comprobar:
      - { con: { n_on: 0 }, V_no: 3.8685, tol: 0.002 }
      - { V_no: 0.1737, tol: 0.002 }

  - id: simule-salida
    tipo: simular
    titulo: "Prediga y simule: la salida"
    texto: "Con v = 1 mV, la fuente da g_{m} · v = 38,7 µA sobre r_{o} = 100 kΩ en paralelo con 4,7 kΩ. ¿Cuánto vale v_{o}?"
    libro: [269, "cap06#44", "cap06#47"]
    fijar: { v_c: 0.001, g_m: 0.038685, r_o: 100000, R_C: 4700, n_on: 1 }
    widget:
      tipo: circuito
      esquema: fuente-controlada
      piezas: { control: v_c, gm: g_m, ro: r_o, carga: R_C, interruptor: n_on }
      lectura: { valor: V_no, rotulo: "Tensión de salida" }
      corriente: I_nl
      mide: { salida: V_no, controlada: I_n }
      ocultar: true
      mandos: []
    simular:
      objetivo: V_no
      unidad: V
      tol: 0.02
      rotulo: "Tensión de salida, v_{o}"
      medida: salida
      errores:
        - { expr: "V_sr", texto: "Esos 182 mV olvidan r_{o}: la corriente también se reparte por los 100 kΩ." }
        - { expr: "V_sc", texto: "Así sería sin carga: toda la corriente por r_{o}. La carga de 4,7 kΩ está en paralelo." }
    exito: "Se plantea con la fuente como si fuera independiente, se añade la restricción I = g_{m} · v y se resuelve: 38,7 µA × (100 k ‖ 4,7 k) = 174 mV."
    escalera:
      - "La corriente controlada se reparte entre r_{o} y la carga, que están en paralelo."
      - "Calcule 100 kΩ ‖ 4,7 kΩ y multiplique por 38,7 µA."
    solucion: "100 k ‖ 4,7 k = 4,49 kΩ; 38,7 µA × 4,49 kΩ = 174 mV."
    comprobar:
      - { I_n: 38.7e-6, V_no: 0.1737, V_sr: 0.1818, V_sc: 3.8685, R_par: 4489 }

  - id: gm
    tipo: leer
    titulo: "El coeficiente g_{m}"
    texto: "Con v = 1 mV, la fuente controlada da la corriente de la lectura. Escriba su coeficiente, g_{m} = I/v."
    libro: [257, 260, 261, "cap06#47"]
    fijar: { v_c: 0.001 }
    widget:
      tipo: circuito
      esquema: fuente-controlada
      piezas: { control: v_c, gm: g_m, ro: r_o, carga: R_C, interruptor: n_on }
      lectura: { valor: I_n, rotulo: "Corriente de la fuente controlada" }
      corriente: I_nl
      mide: { salida: V_no, carga: I_nl, controlada: I_n, ro: I_nr }
      mandos: []
    leer:
      objetivo: g_med
      unidad: S
      tol: 0.02
      rotulo: "g_{m}"
      errores:
        - { expr: "I_n", texto: "Esa es la corriente medida. g_{m} es esa corriente dividida por la tensión de control." }
    exito: "38,7 mS: una corriente por cada tensión, una transconductancia. Es una VCCS; las otras son VCVS (operacional), CCVS (transimpedancia) y CCCS (β)."
    escalera:
      - "Divida la corriente de la lectura por 1 mV."
    solucion: "38,7 µA / 1 mV = 38,7 mS."
    comprobar:
      - { g_med: 0.038685, I_n: 38.685e-6 }

  - id: prediga-rth
    tipo: pregunta
    titulo: "R_{Th} con dependientes"
    texto: "Una red con una fuente controlada. ¿Cómo se calcula su R_{Th}?"
    libro: [263, 265]
    widget:
      tipo: circuito
      esquema: fuente-controlada
      piezas: { control: v_c, gm: g_m, ro: r_o, carga: R_C, interruptor: n_on }
      lectura: { valor: V_no, rotulo: "Tensión de salida" }
      corriente: I_nl
      mide: { salida: V_no, carga: I_nl }
      mandos: []
    opciones:
      - texto: "Con una fuente de prueba de 1 V, sin anular la dependiente"
        bien: true
        porque: "La dependiente sigue actuando y el cociente 1 V/I_{prueba} lo recoge. Es el método de los simuladores."
      - texto: "Anulando todas las fuentes y mirando la resistencia vista"
        porque: "Las dependientes no se anulan: su valor depende de una variable que sigue existiendo."
      - texto: "Anulando solo la dependiente"
        porque: "Al revés: la dependiente se queda; se anulan las independientes."
    escalera:
      - "Una fuente dependiente no es una causa: es una consecuencia del circuito."
    solucion: "Fuente de prueba de 1 V con las independientes anuladas: R_{Th} = 1 V/I_{prueba}."

  - id: resistencia-negativa
    tipo: sorpresa
    titulo: "Una resistencia negativa"
    texto: "La recta es la corriente de entrada frente a la tensión aplicada. Consiga que, al subir la tensión, la corriente baje."
    libro: [272, 273, 275]
    inicio: { R_in: 100 }
    widget:
      tipo: grafica
      x: { id: v, min: 0, max: 1, unidad: V, rotulo: "V aplicada" }
      y: { min: -0.012, max: 0.012, unidad: A, rotulo: "I de entrada" }
      curvas:
        - { expr: "v/R_in", color: azul, rotulo: "I = V/R_{in}" }
      lectura: { valor: I_1v, rotulo: "Corriente con 1 V" }
      mandos:
        - { valor: R_in, lista: [-100, -200, -500, 500, 200, 100], rotulo: "R_{in}" }
    objetivo:
      condiciones:
        - { valor: R_in, max: -1, rotulo: "R_{in}: {{R_in}}" }
      logrado: "Con {{R_in}}, la recta baja: más tensión, menos corriente. Junto a un tanque LC, cancela sus pérdidas y la oscilación se sostiene."
      pistas:
        - { texto: "La recta todavía sube: pruebe una R_{in} negativa." }
    escalera:
      - "La pendiente de la recta es 1/R_{in}."
    solucion: "Cualquier R_{in} negativa: la recta tiene pendiente negativa."
    comprobar:
      - { con: { R_in: -100 }, I_1v: -0.01 }

  - id: por-que-negativa
    tipo: porque
    titulo: "¿Cómo es posible?"
    texto: "Con R_{in} negativa, al aumentar la tensión aplicada la corriente disminuye. ¿Es un error de cálculo?"
    libro: [273]
    widget:
      tipo: grafica
      x: { id: v, min: 0, max: 1, unidad: V, rotulo: "V aplicada" }
      y: { min: -0.012, max: 0.012, unidad: A, rotulo: "I de entrada" }
      curvas:
        - { expr: "v/R_in", color: azul, rotulo: "I = V/R_{in}" }
      mandos: []
    opciones:
      - texto: "No: en un circuito activo es posible, porque la energía sale de la alimentación"
        bien: true
        porque: "Las fuentes dependientes modelan dispositivos activos: pueden devolver energía al resto del circuito."
      - texto: "Sí: una resistencia nunca puede ser negativa"
        porque: "Un resistor pasivo no, pero la resistencia de entrada de un circuito activo sí puede serlo."
      - texto: "Sí: hay un signo mal en el convenio"
        porque: "Con el convenio bien puesto sigue saliendo negativa. Es una propiedad real del circuito."
    escalera:
      - "¿De dónde saca energía un circuito con transistores?"
    solucion: "No es un error: la energía viene de la alimentación."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [256, 263, 269, 272]
    ideas:
      - { titulo: "Controladas.", texto: "Su valor depende de una tensión o corriente del circuito: modelan transistores y operacionales." }
      - { titulo: "No se anulan.", texto: "Ni en superposición ni para R_{Th}: se usa la fuente de prueba." }
      - { titulo: "Una ecuación más.", texto: "Se plantea con un nombre y se añade la restricción de su valor." }
      - { titulo: "Resistencia negativa.", texto: "Posible en un circuito activo: base de los osciladores." }
