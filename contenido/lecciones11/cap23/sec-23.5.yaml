# Lección 1.2 de la sección 22.5 «Principio de Superposición» (cap23). Formato: contenido/lecciones11/GUIA.md.
leccion: cap23/sec-23.5

libro:
  118: "la respuesta en cualquier punto es la suma de las respuestas que produciría cada fuente actuando sola"
  119: "no se puede aplicar a un circuito con un diodo"
  122: "sustituirla por un cortocircuito"
  123: "se sustituye por lo que no altera nada"
  124: "las fuentes dependientes no se anulan nunca"
  127: "la primera fuente aporta 12 × 0,667/1,667 = 4,80 V"
  129: "dice exactamente dónde actuar"
  133: 'P_("total") = ("5"^("2"))/(R)'
  134: "Para calcular potencia hay que superponer primero las tensiones o corrientes y elevar al cuadrado después."
  142: "repetir el experimento con un diodo en el circuito y ver que ya no suma"
  "cap23#349": "falta el término cruzado 2·I1·I2"

modelo:
  valores:
    V_k1: { sim: "V₁", nombre: "fuente de la izquierda", unidad: V, valor: 12 }
    V_k2: { sim: "V₂", nombre: "fuente de la derecha", unidad: V, valor: 6 }
    R_k1: { sim: "R₁", nombre: "resistencia de la izquierda", unidad: Ω, valor: 1000 }
    R_k2: { sim: "R₂", nombre: "resistencia de la derecha", unidad: Ω, valor: 1000 }
    R_k3: { sim: "R₃", nombre: "carga común", unidad: Ω, valor: 2000 }
    k_on1: { tipo: interruptor, nombre: "fuente de la izquierda encendida", valor: 1 }
    k_on2: { tipo: interruptor, nombre: "fuente de la derecha encendida", valor: 1 }
  calculos:
    E_k1: { expr: "V_k1*k_on1", sim: "E₁", nombre: "fuente izquierda efectiva", unidad: V }
    E_k2: { expr: "V_k2*k_on2", sim: "E₂", nombre: "fuente derecha efectiva", unidad: V }
    V_kn: { expr: "(E_k1/R_k1 + E_k2/R_k2)/(1/R_k1 + 1/R_k2 + 1/R_k3)", sim: "V_{nodo}", nombre: "tensión del nodo", unidad: V }
    I_k1: { expr: "(E_k1 - V_kn)/R_k1", sim: "I₁", nombre: "corriente de la izquierda", unidad: A }
    I_k2: { expr: "(E_k2 - V_kn)/R_k2", sim: "I₂", nombre: "corriente de la derecha", unidad: A }
    I_k3: { expr: "V_kn/R_k3", sim: "I₃", nombre: "corriente por la carga", unidad: A }
    V_p1: { expr: "V_k1*par(R_k2, R_k3)/(R_k1 + par(R_k2, R_k3))", sim: "V'", nombre: "aportación de la izquierda", unidad: V }
    V_p2: { expr: "V_k2*par(R_k1, R_k3)/(R_k2 + par(R_k1, R_k3))", sim: "V''", nombre: "aportación de la derecha", unidad: V }
    V_abre: { expr: "V_k1*R_k3/(R_k1 + R_k3) + V_k2*R_k3/(R_k2 + R_k3)", sim: "V", nombre: "suma con las fuentes abiertas", unidad: V }
    V_div1: { expr: "V_k1*R_k3/(R_k1 + R_k3)", sim: "V", nombre: "divisor sin la otra rama", unidad: V }
    P_tot: { expr: "V_kn^2/R_k3", sim: "P", nombre: "potencia en la carga", unidad: W }
    P_par: { expr: "(V_p1^2 + V_p2^2)/R_k3", sim: "P' + P''", nombre: "suma de las potencias parciales", unidad: W }

tarjetas:
  - id: explore-fuentes
    tipo: explorar
    titulo: "Una fuente cada vez"
    texto: "Apague cada fuente (queda un cortocircuito en su lugar) y anote lo que aporta la otra sola al nodo."
    libro: [118, 122]
    widget:
      tipo: circuito
      esquema: kirchhoff
      piezas: { fuente1: V_k1, fuente2: V_k2, r1: R_k1, r2: R_k2, r3: R_k3, activa1: k_on1, activa2: k_on2 }
      lectura: { valor: V_kn, rotulo: "Tensión del nodo" }
      datos:
        - { valor: I_k3, rotulo: "I₃ = {{I_k3}}" }
      corriente: I_k3
      mide: { nodo: V_kn, i1: I_k1, i2: I_k2, i3: I_k3 }
      mandos:
        - { valor: k_on1, tipo: interruptor, rotulo: "Fuente de la izquierda" }
        - { valor: k_on2, tipo: interruptor, rotulo: "Fuente de la derecha" }
    requiere: { mover: [k_on1, k_on2] }

  - id: prediga-sola
    tipo: predecir
    titulo: "Prediga la primera aportación"
    texto: "12 V y 6 V, cada una con 1 kΩ, sobre 2 kΩ. Con la de 6 V anulada, ¿cuánto marca el nodo?"
    libro: [122, 127]
    fijar: { V_k1: 12, V_k2: 6, R_k1: 1000, R_k2: 1000, R_k3: 2000, k_on1: 1, k_on2: 0 }
    widget:
      tipo: circuito
      esquema: kirchhoff
      piezas: { fuente1: V_k1, fuente2: V_k2, r1: R_k1, r2: R_k2, r3: R_k3, activa1: k_on1, activa2: k_on2 }
      lectura: { valor: V_kn, rotulo: "Tensión del nodo" }
      corriente: I_k3
      mide: { nodo: V_kn }
      ocultar: true
    opciones:
      - texto: "4,80 V"
        bien: true
        porque: "La de 6 V queda en cortocircuito: abajo quedan 1 kΩ ‖ 2 kΩ = 0,667 kΩ, y 12 × 0,667/1,667 = 4,80 V."
      - texto: "8 V"
        porque: "Sería el divisor sin la rama derecha. Anulada, la fuente es un cortocircuito y sus 1 kΩ quedan en paralelo con la carga."
      - texto: "12 V"
        porque: "Toda la tensión de la fuente solo llegaría sin nada en serie. Los 1 kΩ y el paralelo de abajo forman un divisor."
    escalera:
      - "Anular una fuente de tensión es sustituirla por un cortocircuito."
      - "La resistencia de la rama anulada queda en paralelo con la carga."
    solucion: "1 kΩ ‖ 2 kΩ = 0,667 kΩ; 12 × 0,667/1,667 = 4,80 V."
    comprobar:
      - { V_kn: 4.8, V_div1: 8 }

  - id: simule-suma
    tipo: simular
    titulo: "Prediga y simule la suma"
    texto: "La de 6 V sola aporta 2,40 V. Con las dos fuentes encendidas, ¿cuánto marca el nodo?"
    libro: [127]
    fijar: { V_k1: 12, V_k2: 6, R_k1: 1000, R_k2: 1000, R_k3: 2000, k_on1: 1, k_on2: 1 }
    widget:
      tipo: circuito
      esquema: kirchhoff
      piezas: { fuente1: V_k1, fuente2: V_k2, r1: R_k1, r2: R_k2, r3: R_k3, activa1: k_on1, activa2: k_on2 }
      lectura: { valor: V_kn, rotulo: "Tensión del nodo" }
      mide: { nodo: V_kn }
      ocultar: true
      mandos: []
    simular:
      objetivo: V_kn
      unidad: V
      tol: 0.02
      rotulo: "Tensión del nodo"
      medida: nodo
      errores:
        - { expr: "V_abre", texto: "Ha anulado cada fuente abriéndola. Una fuente de tensión se anula con un cortocircuito." }
        - { expr: "V_p2", texto: "Esa es solo la aportación de la fuente de 6 V. Falta sumar la de la otra." }
    exito: "4,80 V + 2,40 V = 7,20 V: lo mismo que da el circuito completo."
    escalera:
      - "Superposición: la respuesta es la suma de las aportaciones de cada fuente sola."
    solucion: "4,80 + 2,40 = 7,20 V."
    comprobar:
      - { V_kn: 7.2, V_p1: 4.8, V_p2: 2.4 }

  - id: anular-corriente
    tipo: pregunta
    titulo: "Anular una fuente de corriente"
    texto: "Una fuente de tensión se anula con un cortocircuito. ¿Y una fuente de corriente ideal?"
    libro: [122, 123]
    widget:
      tipo: circuito
      esquema: kirchhoff
      piezas: { fuente1: V_k1, fuente2: V_k2, r1: R_k1, r2: R_k2, r3: R_k3, activa1: k_on1, activa2: k_on2 }
      lectura: { valor: V_kn, rotulo: "Tensión del nodo" }
      corriente: I_k3
      mide: { nodo: V_kn }
      mandos:
        - { valor: k_on2, tipo: interruptor, rotulo: "Fuente de la derecha" }
    opciones:
      - texto: "Con un circuito abierto"
        bien: true
        porque: "Impone corriente: anularla es hacerla cero amperios, y eso es un abierto. Se sustituye por lo que no altera nada."
      - texto: "Con un cortocircuito, como la de tensión"
        porque: "Un cortocircuito dejaría pasar corriente. Para que circulen cero amperios, el camino tiene que estar abierto."
      - texto: "Con una resistencia igual a su interna"
        porque: "Una fuente ideal no tiene resistencia interna. Anularla es poner a cero lo que impone: su corriente."
    escalera:
      - "Anular es poner a cero la magnitud que la fuente impone."
    solucion: "Cero amperios: un circuito abierto."

  - id: dependientes
    tipo: pregunta
    titulo: "¿Y las fuentes dependientes?"
    texto: "Un transistor modelado como fuente de corriente controlada. Al aplicar superposición, ¿se anula?"
    libro: [124, "cap23#349"]
    widget:
      tipo: circuito
      esquema: kirchhoff
      piezas: { fuente1: V_k1, fuente2: V_k2, r1: R_k1, r2: R_k2, r3: R_k3, activa1: k_on1, activa2: k_on2 }
      lectura: { valor: V_kn, rotulo: "Tensión del nodo" }
      corriente: I_k3
      mide: { nodo: V_kn }
    opciones:
      - texto: "No: las dependientes se dejan siempre actuando"
        bien: true
        porque: "Su valor depende de una variable del circuito, que sigue existiendo en cada caso parcial. Anularla cambiaría el circuito."
      - texto: "Sí, como cualquier fuente de corriente: con un abierto"
        porque: "Solo se anulan las independientes. La dependiente es una consecuencia del estado del circuito, no una causa."
      - texto: "Solo si su variable de control vale cero"
        porque: "No se anula en ningún caso: su valor lo dará el propio análisis de cada caso parcial."
    escalera:
      - "¿Es esa fuente una causa independiente o una consecuencia del circuito?"
    solucion: "No se anula: solo se anulan las fuentes independientes."

  - id: potencia-formula
    tipo: formula
    titulo: "La potencia no se superpone"
    texto: "Compare la potencia en la carga con la suma de las potencias de cada fuente sola."
    libro: [133, 134]
    fijar: { k_on1: 1, k_on2: 1 }
    ec: 133
    sustitucion: "{{V_kn}}² / R₃ = {{P_tot}}, pero ({{V_p1}}² + {{V_p2}}²) / R₃ = {{P_par}}"
    widget:
      tipo: circuito
      esquema: kirchhoff
      piezas: { fuente1: V_k1, fuente2: V_k2, r1: R_k1, r2: R_k2, r3: R_k3, activa1: k_on1, activa2: k_on2 }
      lectura: { valor: P_tot, rotulo: "Potencia en la carga" }
      datos:
        - { valor: P_par, rotulo: "Suma de las parciales: {{P_par}}" }
      corriente: I_k3
      mide: { nodo: V_kn, i3: I_k3 }
      mandos:
        - { valor: V_k2, min: 0, max: 12, paso: 1 }

  - id: por-que-potencia
    tipo: porque
    titulo: "¿Por qué no cuadra?"
    texto: "Una fuente da 2 V y otra 3 V sobre la misma R: la potencia es 25/R, no 13/R. ¿Por qué?"
    libro: [133, 134, "cap23#349"]
    ec: 133
    opciones:
      - texto: "La potencia va con el cuadrado, y el cuadrado de una suma no es la suma de cuadrados"
        bien: true
        porque: "Falta el término cruzado. Se superponen primero las tensiones (5 V) y se eleva al cuadrado después."
      - texto: "Porque las dos fuentes se restan"
        porque: "Las tensiones se suman: 2 + 3 = 5 V. El fallo está en elevar al cuadrado antes de sumar."
      - texto: "Porque la resistencia cambia con la potencia"
        porque: "La resistencia es la misma R. Lo que no es lineal es la potencia, no el circuito."
    escalera:
      - "Compare (2 + 3)² con 2² + 3²."
    solucion: "(2 + 3)² = 25 y 2² + 3² = 13: falta el término cruzado 2·I1·I2."

  - id: con-diodo
    tipo: pregunta
    titulo: "Con un diodo"
    texto: "Se repite la medida con un diodo en el circuito: cada fuente sola, y luego las dos. ¿Qué se ve?"
    libro: [119, 142]
    widget:
      tipo: circuito
      esquema: kirchhoff
      piezas: { fuente1: V_k1, fuente2: V_k2, r1: R_k1, r2: R_k2, r3: R_k3, activa1: k_on1, activa2: k_on2 }
      lectura: { valor: V_kn, rotulo: "Tensión del nodo" }
      corriente: I_k3
      mide: { nodo: V_kn }
    opciones:
      - texto: "Las aportaciones ya no suman el total"
        bien: true
        porque: "La superposición es la definición de linealidad. Con un diodo el circuito no es lineal y el teorema no aplica."
      - texto: "Suman igual: el diodo solo añade su caída"
        porque: "La caída del diodo depende de su corriente, que cambia con cada fuente. El circuito ya no es lineal."
      - texto: "Suman si se anulan las fuentes con un abierto"
        porque: "Anularlas de otra forma no arregla nada: el problema es el elemento no lineal."
    escalera:
      - "¿Qué propiedad del circuito exige la superposición?"
    solucion: "Ya no suma: el diodo rompe la linealidad que el teorema exige."

  - id: para-que
    tipo: pregunta
    titulo: "Para qué sirve de verdad"
    texto: "Con muchas fuentes, el nodal resuelve todo de una vez. ¿Cuándo compensa entonces superponer?"
    libro: [129]
    widget:
      tipo: circuito
      esquema: kirchhoff
      piezas: { fuente1: V_k1, fuente2: V_k2, r1: R_k1, r2: R_k2, r3: R_k3, activa1: k_on1, activa2: k_on2 }
      lectura: { valor: V_kn, rotulo: "Tensión del nodo" }
      corriente: I_k3
      mide: { nodo: V_kn }
      mandos:
        - { valor: k_on1, tipo: interruptor, rotulo: "Fuente de la izquierda" }
        - { valor: k_on2, tipo: interruptor, rotulo: "Fuente de la derecha" }
    opciones:
      - texto: "Para saber qué aporta cada fuente por separado"
        bien: true
        porque: "Si el 90 % de una tensión indeseada viene de una fuente concreta, se sabe exactamente dónde actuar."
      - texto: "Siempre: es más rápido que el nodal"
        porque: "Con n fuentes hay que resolver el circuito n veces. El nodal lo hace de una vez."
      - texto: "Para calcular potencias más deprisa"
        porque: "La potencia no se superpone: se suman las tensiones o corrientes y se eleva al cuadrado al final."
    escalera:
      - "Piense en una tensión indeseada que llega de varias fuentes."
    solucion: "Cuando se quiere saber qué aporta cada fuente, para saber dónde actuar."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [118, 122, 124, 134]
    ideas:
      - { titulo: "Suma de aportaciones.", texto: "Cada fuente sola, con las demás anuladas; luego se suma, con su signo." }
      - { titulo: "Anular.", texto: "Tensión a cortocircuito, corriente a abierto. Las dependientes, nunca." }
      - { titulo: "No la potencia.", texto: "Se superponen tensiones o corrientes y se eleva al cuadrado después." }
      - { titulo: "Solo lineal.", texto: "Con un diodo o un transistor en gran señal, no suma." }
