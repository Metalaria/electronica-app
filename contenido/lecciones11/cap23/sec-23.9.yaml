# Lección 1.2 de la sección 22.9 «Máxima Transferencia de Potencia» (cap23). Formato: contenido/lecciones11/GUIA.md.
# 1.2.1 (autor121-pot, «aprender haciendo», GUIA §13): el máximo se marca en la curva; la potencia máxima se escribe
# midiendo tensión y corriente; el ajuste se queda; la fracción con el doble de carga se escribe; el 50 % se consigue con la carga en R_Th;
# el criterio de máxima tensión se busca con una carga mucho mayor (los tres criterios del libro van en su «logrado» y
# en el resumen). Quedan dos preguntas de opciones (por qué no se adapta el altavoz y dónde sí se adapta).
leccion: cap23/sec-23.9

libro:
  201: "entrega la máxima potencia a una carga cuando Rcarga = Rs"
  202: "con la carga al doble o a la mitad de lo óptimo, todavía se entrega el 89 % de la potencia máxima"
  204: "la carga óptima es de 3 Ω y recibe 9²/(4 × 3) = 6,75 W"
  206: "El rendimiento es del 50 %, y no puede ser mejor."
  207: "Un amplificador de audio no adapta su impedancia de salida a la del altavoz"
  212: "En la entrada de un receptor, donde la señal captada es de picovatios"
  217: "Máxima tensión"
  218: "está construido para transferir tensión con la mínima pérdida"
  225: "VTh = 9 V, RTh = 3 Ω"

modelo:
  valores:
    V_t: { sim: "V_{Th}", nombre: "tensión de Thévenin", unidad: V, valor: 9 }
    R_ti: { sim: "R_{Th}", nombre: "resistencia de Thévenin", unidad: Ω, valor: 3 }
    R_tl: { sim: "R_{L}", nombre: "carga", unidad: Ω, valor: 1 }
  calculos:
    V_to: { expr: "V_t*R_tl/(R_ti + R_tl)", sim: "V_{L}", nombre: "tensión en la carga", unidad: V }
    I_t: { expr: "V_t/(R_ti + R_tl)", sim: "I", nombre: "corriente", unidad: A }
    V_ti: { expr: "I_t*R_ti", sim: "V_{Th} − V_{L}", nombre: "caída en R_Th", unidad: V }
    P_L: { expr: "I_t^2*R_tl", sim: "P_{L}", nombre: "potencia en la carga", unidad: W }
    P_i: { expr: "I_t^2*R_ti", sim: "P_{Th}", nombre: "potencia en la resistencia interna", unidad: W }
    eta: { expr: "R_tl/(R_ti + R_tl)*100", sim: "η", nombre: "rendimiento", unidad: "%", cifras: 3 }
    P_max: { expr: "V_t^2/(4*R_ti)", sim: "P_{máx}", nombre: "potencia máxima", unidad: W }
    P_todo: { expr: "V_t^2/R_ti", sim: "V²/R", nombre: "toda la tensión sobre R_Th", unidad: W }
    P_mitad: { expr: "V_t^2/(2*R_ti)", sim: "V²/2R", nombre: "la mitad de V²/R", unidad: W }
    frac: { expr: "P_L/P_max*100", sim: "P/P_{máx}", nombre: "fracción de la máxima", unidad: "%", cifras: 3 }

tarjetas:
  - id: explore-curva
    tipo: marcar
    titulo: "La curva de potencia"
    texto: "La red de 9 V y 3 Ω alimenta una carga. Arrastre la marca por la curva hasta la carga que recibe más potencia."
    libro: [201, 225]
    fijar: { V_t: 9, R_ti: 3 }
    widget:
      tipo: grafica
      x: { id: r, min: 0, max: 15, unidad: Ω, rotulo: "R_{L}" }
      y: { min: 0, max: 8, unidad: W, rotulo: "P_{L}" }
      curvas:
        - { expr: "V_t^2*r/(R_ti + r)^2", color: naranja, rotulo: "P_{L}" }
      mandos: []
    marcar:
      modo: x
      curva: 0
      x: "R_ti"
      tol: 0.03
      inicio: { x: 11, y: 0 }
      rotulo: "La carga de la máxima potencia"
    pistas:
      - { cuando: { valor: marca_x, mayor: 3 }, texto: "Más a la izquierda: con mucha carga apenas pasa corriente." }
      - { texto: "Más a la derecha: con poca carga, su tensión se hunde." }
    exito: "En R_{L} = R_{Th} = 3 Ω. Y la cima es plana: no hace falta acertar exacto."
    escalera:
      - "Busque la cima de la curva."
    solucion: "En 3 Ω, la R_{Th} de la red."

  - id: prediga-pmax
    tipo: leer
    titulo: "La potencia máxima"
    texto: "La red de 9 V y 3 Ω con la carga óptima, R_{L} = R_{Th}. Mida la tensión y la corriente de la carga y escriba la potencia que recibe."
    libro: [204]
    fijar: { V_t: 9, R_ti: 3, R_tl: 3 }
    widget:
      tipo: circuito
      esquema: thevenin
      piezas: { fuente: V_t, rth: R_ti, carga: R_tl }
      corriente: I_t
      mide: { salida: V_to, corriente: I_t, interna: V_ti }
      instrumento:
        tipo: multimetro
      mandos: []
    leer:
      objetivo: P_L
      unidad: W
      tol: 0.02
      rotulo: "Potencia en la carga"
      errores:
        - { expr: "P_todo", texto: "Es 9²/3, como si toda la tensión cayera en la carga. Con R_{L} = R_{Th} solo le llega la mitad." }
        - { expr: "P_mitad", texto: "Es la mitad de 9²/3. La carga tiene la mitad de la tensión y la potencia va con su cuadrado: la cuarta parte." }
    exito: "La carga recibe la mitad de la tensión, 4,5 V, con 1,5 A: P_{máx} = 9²/(4 × 3) = 6,75 W."
    escalera:
      - "Tensión en la carga: entre el borne de salida y masa. Corriente: la rama de la fuente."
      - "P = V · I."
    solucion: "4,5 V × 1,5 A = 6,75 W, que es 9²/(4 × 3)."
    comprobar:
      - { P_L: 6.75, V_to: 4.5, I_t: 1.5, P_todo: 27, P_mitad: 13.5 }

  - id: ajuste-maximo
    tipo: ajuste
    titulo: "Ajuste hasta el máximo"
    texto: "Mueva la carga hasta que la potencia entre en la banda del máximo. Fíjese en lo ancha que es la banda."
    libro: [201, 202]
    fijar: { V_t: 9, R_ti: 3 }
    inicio: { R_tl: 12 }
    widget:
      tipo: circuito
      esquema: thevenin
      piezas: { fuente: V_t, rth: R_ti, carga: R_tl }
      lectura: { valor: P_L, rotulo: "Potencia en la carga" }
      corriente: I_t
      mide: { salida: V_to, corriente: I_t, interna: V_ti }
      mandos:
        - { valor: R_tl, min: 0.5, max: 15, paso: 0.5, rotulo: "R_{L}" }
    ajuste:
      valor: P_L
      objetivo: 6.75
      tol: 0.02
      rotulo: "Potencia en la carga"
      escala: { min: 0, max: 7 }
      bajo: "Falta potencia: acerque la carga a R_{Th}."
      alto: "Por encima del máximo no se puede."
      dentro: "En la banda: la cima es muy plana."
    comprobar:
      - { P_max: 6.75 }

  - id: estime-doble
    tipo: leer
    titulo: "Lejos del óptimo"
    texto: "Con la carga al doble de lo óptimo, 6 Ω, la carga recibe lo que marca la lectura. Escriba qué fracción de la potencia máxima es."
    libro: [202, 204]
    fijar: { V_t: 9, R_ti: 3, R_tl: 6 }
    widget:
      tipo: circuito
      esquema: thevenin
      piezas: { fuente: V_t, rth: R_ti, carga: R_tl }
      lectura: { valor: P_L, rotulo: "Potencia en la carga" }
      corriente: I_t
      mide: { salida: V_to, corriente: I_t, interna: V_ti }
      mandos: []
    leer:
      objetivo: frac
      unidad: "%"
      tol: 0.02
      rotulo: "Fracción de la máxima"
      errores:
        - { expr: "eta", texto: "Ese es el rendimiento con 6 Ω. Lo que se pide es P_{L} entre los 6,75 W del máximo." }
    exito: "6/6,75: un 89 %. La curva es muy plana en el máximo y la adaptación no tiene que ser perfecta."
    escalera:
      - "Divida la potencia de la lectura por los 6,75 W del máximo."
    solucion: "6 W / 6,75 W = 89 %."
    comprobar:
      - { frac: 88.9, P_L: 6, eta: 66.7, tol: 0.002 }

  - id: cincuenta
    tipo: sorpresa
    titulo: "El dato incómodo"
    texto: "Lleve la carga al punto de máxima transferencia y compare lo que recibe la carga con lo que se pierde dentro de la fuente."
    libro: [206]
    fijar: { V_t: 9, R_ti: 3 }
    inicio: { R_tl: 12 }
    widget:
      tipo: circuito
      esquema: thevenin
      piezas: { fuente: V_t, rth: R_ti, carga: R_tl }
      lectura: { valor: eta, rotulo: "Rendimiento" }
      datos:
        - { valor: P_L, rotulo: "En la carga: {{P_L}}" }
        - { valor: P_i, rotulo: "Dentro: {{P_i}}" }
      corriente: I_t
      mide: { salida: V_to, corriente: I_t, interna: V_ti }
      mandos:
        - { valor: R_tl, min: 0.5, max: 15, paso: 0.5, rotulo: "R_{L}" }
    objetivo:
      condiciones:
        - { valor: P_L, min: 6.74, rotulo: "Carga: {{P_L}}" }
      logrado: "{{P_L}} en la carga y {{P_i}} dentro: el rendimiento es del {{eta}}, y no puede ser mejor."
      pistas:
        - { texto: "Todavía no es el máximo: acerque la carga a R_{Th}." }
    escalera:
      - "El máximo está en R_{L} = R_{Th}."
    solucion: "Con 3 Ω: 6,75 W en cada lado, el 50 %."
    comprobar:
      - { con: { R_tl: 3 }, eta: 50, P_L: 6.75, P_i: 6.75 }

  - id: por-que-audio
    tipo: porque
    titulo: "¿Por qué no se adapta el altavoz?"
    texto: "Un amplificador de audio no adapta su impedancia de salida a los 8 Ω del altavoz. ¿Por qué?"
    libro: [206, 207]
    fijar: { V_t: 9, R_ti: 3, R_tl: 3 }
    widget:
      tipo: circuito
      esquema: thevenin
      piezas: { fuente: V_t, rth: R_ti, carga: R_tl }
      lectura: { valor: eta, rotulo: "Rendimiento" }
      corriente: I_t
      mide: { salida: V_to, corriente: I_t }
      mandos: []
    opciones:
      - texto: "Disiparía tanto como el altavoz: el rendimiento se quedaría en el 50 %"
        bien: true
        porque: "Con salida de miliohmios frente a 8 Ω, el rendimiento se acerca al 100 %."
      - texto: "Porque el altavoz no es una resistencia"
        porque: "Aunque lo fuera, adaptar costaría la mitad de la energía. El motivo es el rendimiento."
      - texto: "Porque adaptar daría menos potencia al altavoz"
        porque: "Adaptado recibiría la máxima posible de esa fuente, pero a costa de perder otro tanto dentro."
    escalera:
      - "En el punto de máxima transferencia, ¿cuánto se disipa dentro de la fuente?"
    solucion: "Adaptar es perder la mitad: en potencia se busca rendimiento, con salida de impedancia muy baja."

  - id: criterios
    tipo: explorar
    titulo: "Máxima tensión"
    texto: "Entre etapas no se busca potencia sino tensión. Elija una carga que se lleve casi todos los 9 V."
    libro: [217, 218]
    fijar: { V_t: 9, R_ti: 3 }
    inicio: { R_tl: 3 }
    widget:
      tipo: circuito
      esquema: thevenin
      piezas: { fuente: V_t, rth: R_ti, carga: R_tl }
      lectura: { valor: V_to, rotulo: "Tensión en la carga" }
      datos:
        - { valor: P_L, rotulo: "Potencia: {{P_L}}" }
      corriente: I_t
      mide: { salida: V_to, corriente: I_t, interna: V_ti }
      mandos:
        - { valor: R_tl, lista: [0.1, 1, 3, 10, 100], rotulo: "R_{L}" }
    objetivo:
      condiciones:
        - { valor: V_to, min: 8.55, rotulo: "Carga: {{V_to}}" }
      logrado: "Con Z_{L} ≫ Z_{s}, {{V_to}}: máxima tensión, el criterio habitual entre etapas. Máxima potencia pide Z_{L} = Z_{s}*; máxima corriente, Z_{L} ≪ Z_{s}."
      pistas:
        - { texto: "Todavía se pierde mucha tensión dentro: una carga mucho mayor que los 3 Ω." }
    escalera:
      - "Para llevarse la tensión, la carga tiene que ser mucho mayor que la fuente."
    solucion: "Con 100 Ω: 8,74 V de los 9 V."
    comprobar:
      - { con: { R_tl: 100 }, V_to: 8.738, tol: 0.001 }

  - id: donde-si
    tipo: pregunta
    titulo: "Dónde sí se adapta"
    texto: "¿En cuál de estos casos sí conviene la máxima transferencia de potencia?"
    libro: [212]
    widget:
      tipo: circuito
      esquema: thevenin
      piezas: { fuente: V_t, rth: R_ti, carga: R_tl }
      lectura: { valor: P_L, rotulo: "Potencia en la carga" }
      corriente: I_t
      mide: { salida: V_to, corriente: I_t }
      mandos: []
    opciones:
      - texto: "En la entrada de un receptor, con señal de picovatios"
        bien: true
        porque: "La señal es escasa y la energía no cuesta: desperdiciar la mitad de la señal es inaceptable."
      - texto: "En una fuente de alimentación"
        porque: "Ahí cuesta la energía: se diseña con impedancia de salida lo más baja posible, no igual a la carga."
      - texto: "Entre dos etapas que se pasan tensión"
        porque: "Para transferir tensión se busca salida baja y entrada alta, no impedancias iguales."
    escalera:
      - "Adapte cuando la señal es escasa y la energía no importa."
    solucion: "En la entrada de un receptor: señal escasa, energía barata."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [201, 202, 206, 217]
    ideas:
      - { titulo: "La condición.", texto: "R_{L} = R_{Th} (en alterna, Z_{L} = Z_{s}*): P_{máx} = V_{Th}²/(4·R_{Th})." }
      - { titulo: "Una cima plana.", texto: "Al doble o a la mitad de lo óptimo, aún el 89 %." }
      - { titulo: "El 50 %.", texto: "Adaptado, la fuente disipa lo mismo que la carga: no se usa en potencia." }
      - { titulo: "Tres criterios.", texto: "Potencia, impedancias conjugadas; tensión, Z_{L} ≫ Z_{s}; corriente, Z_{L} ≪ Z_{s}." }
