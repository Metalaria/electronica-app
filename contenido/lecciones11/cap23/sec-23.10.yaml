# Lección 1.2 de la sección 22.10 «Extensión al Régimen de Alterna» (cap23). Formato: contenido/lecciones11/GUIA.md.
leccion: cap23/sec-23.10

libro:
  230: "Se sustituyen las resistencias por impedancias complejas"
  231: "el resultado tiene módulo y fase"
  233: "en paralelo se suman las admitancias"
  234: "Los divisores: la misma fórmula con impedancias."
  236: "los resultados se suman en el dominio del tiempo, no como fasores"
  237: "fasores de frecuencias distintas no se suman"
  239: "la condición pasa de RL = Rs a ZL = Zs*, el conjugado"
  240: "La suma de potencias activas se conserva; la de aparentes, no."
  247: "Sustituyendo jω por la variable compleja s"
  252: "la suma de sus valores eficaces es mayor que la tensión aplicada, mientras que su suma fasorial coincide exactamente"

modelo:
  valores:
    V_p: { sim: "V_{p}", nombre: "amplitud de la fuente", unidad: V, valor: 1 }
    f_f: { sim: "f", nombre: "frecuencia de la fuente", unidad: Hz, valor: 1000 }
    R_f: { sim: "R", nombre: "resistencia", unidad: Ω, valor: 1000 }
    C_f: { sim: "C", nombre: "capacidad", unidad: F, valor: 159.15e-9 }
    f_r: { sim: "f", nombre: "frecuencia de la fuente", unidad: Hz, valor: 2000 }
    R_r: { sim: "R", nombre: "resistencia", unidad: Ω, valor: 10 }
    L_r: { sim: "L", nombre: "inductancia", unidad: H, valor: 0.01 }
    C_r: { sim: "C", nombre: "capacidad", unidad: F, valor: 100e-9 }
  calculos:
    w_f: { expr: "2*pi*f_f", sim: "ω", nombre: "frecuencia angular", unidad: "rad/s" }
    x_c: { expr: "w_f*R_f*C_f", sim: "ωRC", nombre: "ωRC", unidad: "" }
    A_c: { expr: "V_p/sqrt(1 + x_c^2)", sim: "V_{C}", nombre: "amplitud en C", unidad: V }
    ph_c: { expr: "-atan(x_c)*180/pi", sim: "φ_{C}", nombre: "fase en C", unidad: "°" }
    A_r: { expr: "V_p*x_c/sqrt(1 + x_c^2)", sim: "V_{R}", nombre: "amplitud en R", unidad: V }
    X_l: { expr: "2*pi*f_r*L_r", sim: "X_{L}", nombre: "reactancia de la bobina", unidad: Ω }
    X_c: { expr: "1/(2*pi*f_r*C_r)", sim: "X_{C}", nombre: "reactancia del condensador", unidad: Ω }
    Z_r: { expr: "sqrt(R_r^2 + (X_l - X_c)^2)", sim: "|Z|", nombre: "módulo de la impedancia", unidad: Ω }
    I_r: { expr: "V_p/Z_r", sim: "I", nombre: "amplitud de la corriente", unidad: A }
    A_rr: { expr: "I_r*R_r", sim: "V_{R}", nombre: "amplitud en R", unidad: V }
    A_l: { expr: "I_r*X_l", sim: "V_{L}", nombre: "amplitud en L", unidad: V }
    A_cc: { expr: "I_r*X_c", sim: "V_{C}", nombre: "amplitud en C", unidad: V }
    A_suma: { expr: "A_rr + A_l + A_cc", sim: "ΣV", nombre: "suma de los módulos", unidad: V }

tarjetas:
  - id: explore-divisor
    tipo: explorar
    titulo: "El divisor, con impedancias"
    texto: "R y C forman un divisor, con la misma fórmula y una impedancia en lugar de una resistencia. Cambie la frecuencia: la salida tiene módulo y fase."
    libro: [230, 231, 234]
    widget:
      tipo: circuito
      esquema: filtro-rc
      piezas: { fuente: V_p, f: f_f, r: R_f, c: C_f }
      lectura: { valor: A_c, rotulo: "Amplitud en C" }
      datos:
        - { valor: ph_c, rotulo: "Fase: {{ph_c}}" }
      mide: { vc_amp: A_c, vc_fase: ph_c, vr_amp: A_r }
      grafica:
        x: { id: t, min: 0, max: 0.002, unidad: s, rotulo: "t" }
        y: { min: -1.2, max: 1.2, unidad: V, rotulo: "v" }
        curvas:
          - { expr: "V_p*sin(w_f*t)", color: tinta, rotulo: "entrada", mide: entrada, discontinua: true }
          - { expr: "A_c*sin(w_f*t + ph_c*pi/180)", color: naranja, rotulo: "v_{C}", mide: vc }
      mandos:
        - { valor: f_f, lista: [250, 500, 1000, 2000, 4000] }

  - id: que-cambia
    tipo: pregunta
    titulo: "¿Qué cambia en las ecuaciones?"
    texto: "Nodos, mallas, Thévenin: al pasar a alterna se cambian resistencias por impedancias. ¿Qué más cambia?"
    libro: [230, 231]
    widget:
      tipo: circuito
      esquema: filtro-rc
      piezas: { fuente: V_p, f: f_f, r: R_f, c: C_f }
      lectura: { valor: A_c, rotulo: "Amplitud en C" }
      mide: { vc_amp: A_c, vc_fase: ph_c }
    opciones:
      - texto: "Nada más: las ecuaciones tienen la misma forma, con números complejos"
        bien: true
        porque: "Se resuelven igual y los teoremas siguen valiendo; el resultado tiene módulo y fase."
      - texto: "Hay que plantear ecuaciones diferenciales en cada nodo"
        porque: "En régimen permanente, las impedancias convierten las derivadas en productos por jω: quedan ecuaciones algebraicas."
      - texto: "Los teoremas dejan de valer y hay que simular"
        porque: "Superposición, Thévenin y Norton siguen valiendo con impedancias."
    escalera:
      - "Una impedancia se comporta en las ecuaciones como una resistencia compleja."
    solucion: "Solo que los números son complejos: misma forma, mismos teoremas."

  - id: paralelo
    tipo: pregunta
    titulo: "Asociar impedancias"
    texto: "En serie se suman las impedancias. ¿Qué se suma en paralelo?"
    libro: [233]
    widget:
      tipo: circuito
      esquema: filtro-rc
      piezas: { fuente: V_p, f: f_f, r: R_f, c: C_f }
      lectura: { valor: A_c, rotulo: "Amplitud en C" }
      mide: { vc_amp: A_c }
    opciones:
      - texto: "Las admitancias, igual que con conductancias"
        bien: true
        porque: "La admitancia es la inversa de la impedancia. Igual que antes: en paralelo se suman las conductancias."
      - texto: "Los módulos de las impedancias"
        porque: "Ni siquiera en serie se suman los módulos: se suman los complejos, con su parte imaginaria."
      - texto: "Las impedancias, como en serie"
        porque: "En paralelo se suman las inversas: las admitancias."
    escalera:
      - "¿Qué se sumaba en paralelo con resistencias?"
    solucion: "Las admitancias, inversas de las impedancias."

  - id: prediga-suma
    tipo: predecir
    titulo: "Prediga la suma"
    texto: "R, L y C en serie con una fuente senoidal. La suma de las amplitudes de v_{R}, v_{L} y v_{C}, ¿cómo es frente a la de la fuente?"
    libro: [252]
    widget:
      tipo: circuito
      esquema: rlc-serie
      piezas: { fuente: V_p, f: f_r, r: R_r, l: L_r, c: C_r }
      lectura: { valor: A_suma, rotulo: "Suma de las tres amplitudes" }
      mide: { vr_amp: A_rr, vl_amp: A_l, vc_amp: A_cc }
      ocultar: true
    opciones:
      - texto: "Mayor"
        bien: true
        porque: "Las tensiones de la bobina y del condensador van en oposición: cada una puede ser grande aunque se resten entre sí."
      - texto: "Igual, por la ley de tensiones"
        porque: "La ley se cumple con fasores, sumando con su fase. Los módulos sueltos no tienen por qué sumar la fuente."
      - texto: "Menor, porque la resistencia se queda una parte"
        porque: "La resistencia es un término más de la suma. Las tensiones reactivas pueden superar a la de la fuente."
    escalera:
      - "Piense en las fases de v_{L} y de v_{C}."
    solucion: "Mayor: la suma de los valores eficaces supera la tensión aplicada; la fasorial coincide."
    comprobar:
      - { A_suma: 1.39, tol: 0.01 }

  - id: suma-modulos
    tipo: sorpresa
    titulo: "Más que la fuente"
    texto: "RLC en serie con {{V_p}} de pico. Cambie la frecuencia y compare la suma de las tres amplitudes con la de la fuente."
    libro: [252]
    widget:
      tipo: circuito
      esquema: rlc-serie
      piezas: { fuente: V_p, f: f_r, r: R_r, l: L_r, c: C_r }
      lectura: { valor: A_suma, rotulo: "Suma de las tres amplitudes" }
      datos:
        - { valor: A_l, rotulo: "V_{L} = {{A_l}}" }
        - { valor: A_cc, rotulo: "V_{C} = {{A_cc}}" }
        - { valor: A_rr, rotulo: "V_{R} = {{A_rr}}" }
      mide: { vr_amp: A_rr, vl_amp: A_l, vc_amp: A_cc, i_amp: I_r }
      mandos:
        - { valor: f_r, lista: [1000, 2000, 4000, 8000, 16000] }

  - id: por-que-fasores
    tipo: porque
    titulo: "¿Cómo puede ser?"
    texto: "Las tres amplitudes suman más que la tensión aplicada y, aun así, se cumple la ley de tensiones. ¿Por qué?"
    libro: [252]
    widget:
      tipo: circuito
      esquema: rlc-serie
      piezas: { fuente: V_p, f: f_r, r: R_r, l: L_r, c: C_r }
      lectura: { valor: A_suma, rotulo: "Suma de las tres amplitudes" }
      mide: { vr_amp: A_rr, vl_amp: A_l, vc_amp: A_cc }
    opciones:
      - texto: "Las tensiones están desfasadas: la suma que cumple la ley es la fasorial"
        bien: true
        porque: "La de la bobina y la del condensador van en oposición y se restan. La suma fasorial coincide exactamente con la aplicada."
      - texto: "Kirchhoff no vale en alterna"
        porque: "Vale, con fasores. Lo que no vale es sumar valores eficaces como si estuvieran en fase."
      - texto: "Los componentes generan energía"
        porque: "Bobina y condensador no generan nada: intercambian energía. Sus tensiones se restan en parte."
    escalera:
      - "Mire las fases: ¿están las tres tensiones en fase?"
    solucion: "Se suman como fasores: v_{L} y v_{C} se oponen, y la suma fasorial es la aplicada."

  - id: dos-frecuencias
    tipo: pregunta
    titulo: "Dos frecuencias"
    texto: "Un circuito tiene dos fuentes de frecuencias distintas. ¿Cómo se combinan los resultados?"
    libro: [236, 237]
    widget:
      tipo: circuito
      esquema: filtro-rc
      piezas: { fuente: V_p, f: f_f, r: R_f, c: C_f }
      lectura: { valor: A_c, rotulo: "Amplitud en C" }
      mide: { vc_amp: A_c }
      mandos:
        - { valor: f_f, lista: [250, 500, 1000, 2000, 4000] }
    opciones:
      - texto: "Cada frecuencia por separado, con sus impedancias; se suman en el tiempo"
        bien: true
        porque: "La superposición es obligatoria aquí. Cada fasor representa una senoide de su frecuencia."
      - texto: "Se suman los dos fasores"
        porque: "Fasores de frecuencias distintas no se suman: representan cosas diferentes, y sumarlos no significa nada."
      - texto: "Se usa la impedancia a la frecuencia media"
        porque: "Las impedancias dependen de ω: cada frecuencia tiene las suyas, y se analiza aparte."
    escalera:
      - "Las impedancias dependen de la frecuencia."
    solucion: "Una por una, con sus impedancias, y suma en el dominio del tiempo."

  - id: conjugado
    tipo: pregunta
    titulo: "Máxima potencia en alterna"
    texto: "En continua, la máxima transferencia pide R_{L} = R_{s}. ¿Qué pide en alterna?"
    libro: [239]
    widget:
      tipo: circuito
      esquema: rlc-serie
      piezas: { fuente: V_p, f: f_r, r: R_r, l: L_r, c: C_r }
      lectura: { valor: I_r, rotulo: "Amplitud de la corriente" }
      mide: { i_amp: I_r }
    opciones:
      - texto: "Z_{L} = Z_{s}*: las reactancias se cancelan y las resistencias se igualan"
        bien: true
        porque: "Con la impedancia conjugada, la parte imaginaria se anula y queda el caso resistivo."
      - texto: "Z_{L} = Z_{s}, la misma impedancia"
        porque: "Con la misma, las reactancias se sumarían en lugar de cancelarse."
      - texto: "Que la carga sea puramente resistiva"
        porque: "La reactancia de la fuente quedaría sin compensar. Hace falta la opuesta en la carga."
    escalera:
      - "¿Qué hay que hacer con la reactancia de la fuente para que no reste potencia?"
    solucion: "El conjugado: Z_{L} = Z_{s}*."

  - id: balance
    tipo: pregunta
    titulo: "El balance en alterna"
    texto: "Para comprobar un análisis en alterna se hace el balance de potencias. ¿Qué suma no se conserva?"
    libro: [240]
    widget:
      tipo: circuito
      esquema: rlc-serie
      piezas: { fuente: V_p, f: f_r, r: R_r, l: L_r, c: C_r }
      lectura: { valor: I_r, rotulo: "Amplitud de la corriente" }
      mide: { i_amp: I_r }
    opciones:
      - texto: "La de potencias aparentes"
        bien: true
        porque: "Activas y reactivas se conservan: son dos comprobaciones. Las aparentes son módulos y no se suman."
      - texto: "La de potencias activas"
        porque: "La activa entregada por las fuentes iguala la disipada en las resistencias: se conserva."
      - texto: "La de potencias reactivas"
        porque: "La reactiva entregada iguala la de bobinas y condensadores con su signo: también se conserva."
    escalera:
      - "Recuerde lo que pasó con la suma de amplitudes."
    solucion: "La aparente; activa y reactiva sí cuadran."

  - id: laplace
    tipo: pregunta
    titulo: "El paso siguiente"
    texto: "¿Qué se obtiene sustituyendo jω por la variable compleja s?"
    libro: [247]
    widget:
      tipo: circuito
      esquema: filtro-rc
      piezas: { fuente: V_p, f: f_f, r: R_f, c: C_f }
      lectura: { valor: A_c, rotulo: "Amplitud en C" }
      mide: { vc_amp: A_c }
    opciones:
      - texto: "Las mismas ecuaciones, válidas también para el transitorio"
        bien: true
        porque: "Con eso los mismos métodos dan la respuesta completa ante cualquier excitación."
      - texto: "Unas ecuaciones solo para continua"
        porque: "Al contrario: amplían el alcance al transitorio, además del régimen permanente."
      - texto: "Unas ecuaciones distintas que hay que aprender de nuevo"
        porque: "Son las mismas: los métodos se aprenden una vez y sirven en continua, alterna y Laplace."
    escalera:
      - "Los métodos se aprenden una vez."
    solucion: "Las mismas ecuaciones, válidas también para el transitorio."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [230, 236, 239, 252]
    ideas:
      - { titulo: "Impedancias.", texto: "Mismas ecuaciones y teoremas, con números complejos: módulo y fase." }
      - { titulo: "Varias frecuencias.", texto: "Cada una por separado y suma en el tiempo; nunca sumar fasores de frecuencias distintas." }
      - { titulo: "Lo que cambia.", texto: "Máxima potencia con el conjugado; balance de activa y de reactiva, no de aparente." }
      - { titulo: "Fasores.", texto: "Las amplitudes pueden sumar más que la fuente: la ley se cumple sumando fasores." }
