# Lección 1.2 de la sección 22.10 «Extensión al Régimen de Alterna» (cap23). Formato: contenido/lecciones11/GUIA.md.
# 1.2.1 (autor121-pot, «aprender haciendo», GUIA §13): el divisor RC se lleva a −45° con la frecuencia (objetivo) y la
# salida desfasada se busca con la sonda del osciloscopio; las tres amplitudes del RLC se leen y se suman; se busca la
# frecuencia en la que bobina y condensador superan, cada uno, a la fuente; el conjugado se descubre eligiendo el
# condensador que cancela la reactancia de la bobina (633 nF a 2 kHz, valores de ejemplo). Quedan dos preguntas de
# opciones (por qué la suma fasorial y dos frecuencias); admitancias, balance de potencias y Laplace pasan al resumen.
leccion: cap23/sec-23.10

libro:
  230: "Se sustituyen las resistencias por impedancias complejas"
  231: "el resultado tiene módulo y fase"
  233: "en paralelo se suman las admitancias"
  234: "Los divisores: la misma fórmula con impedancias."
  236: "los resultados se suman en el dominio del tiempo, no como fasores"
  237: "fasores de frecuencias distintas no se suman"
  239: "la condición pasa de RL = Rs a ZL = Zs*, el conjugado"
  240: "La suma de potencias activas se conserva; la de aparentes, no."
  247: "Sustituyendo jω por la variable compleja s"
  252: "la suma de sus valores eficaces es mayor que la tensión aplicada, mientras que su suma fasorial coincide exactamente"

modelo:
  valores:
    V_p: { sim: "V_{p}", nombre: "amplitud de la fuente", unidad: V, valor: 1 }
    f_f: { sim: "f", nombre: "frecuencia de la fuente", unidad: Hz, valor: 1000 }
    R_f: { sim: "R", nombre: "resistencia", unidad: Ω, valor: 1000 }
    C_f: { sim: "C", nombre: "capacidad", unidad: F, valor: 159.15e-9 }
    f_r: { sim: "f", nombre: "frecuencia de la fuente", unidad: Hz, valor: 2000 }
    R_r: { sim: "R", nombre: "resistencia", unidad: Ω, valor: 10 }
    L_r: { sim: "L", nombre: "inductancia", unidad: H, valor: 0.01 }
    C_r: { sim: "C", nombre: "capacidad", unidad: F, valor: 100e-9 }
  calculos:
    w_f: { expr: "2*pi*f_f", sim: "ω", nombre: "frecuencia angular", unidad: "rad/s" }
    x_c: { expr: "w_f*R_f*C_f", sim: "ωRC", nombre: "ωRC", unidad: "" }
    A_c: { expr: "V_p/sqrt(1 + x_c^2)", sim: "V_{C}", nombre: "amplitud en C", unidad: V }
    ph_c: { expr: "-atan(x_c)*180/pi", sim: "φ_{C}", nombre: "fase en C", unidad: "°" }
    A_r: { expr: "V_p*x_c/sqrt(1 + x_c^2)", sim: "V_{R}", nombre: "amplitud en R", unidad: V }
    X_l: { expr: "2*pi*f_r*L_r", sim: "X_{L}", nombre: "reactancia de la bobina", unidad: Ω }
    X_c: { expr: "1/(2*pi*f_r*C_r)", sim: "X_{C}", nombre: "reactancia del condensador", unidad: Ω }
    Z_r: { expr: "sqrt(R_r^2 + (X_l - X_c)^2)", sim: "|Z|", nombre: "módulo de la impedancia", unidad: Ω }
    I_r: { expr: "V_p/Z_r", sim: "I", nombre: "amplitud de la corriente", unidad: A }
    A_rr: { expr: "I_r*R_r", sim: "V_{R}", nombre: "amplitud en R", unidad: V }
    A_l: { expr: "I_r*X_l", sim: "V_{L}", nombre: "amplitud en L", unidad: V }
    A_cc: { expr: "I_r*X_c", sim: "V_{C}", nombre: "amplitud en C", unidad: V }
    A_suma: { expr: "A_rr + A_l + A_cc", sim: "ΣV", nombre: "suma de los módulos", unidad: V }

tarjetas:
  - id: explore-divisor
    tipo: explorar
    titulo: "El divisor, con impedancias"
    texto: "R y C forman un divisor: la misma fórmula, con una impedancia en lugar de una resistencia. Cambie la frecuencia hasta que la salida se retrase 45°."
    libro: [230, 231, 234]
    inicio: { f_f: 250 }
    widget:
      tipo: circuito
      esquema: filtro-rc
      piezas: { fuente: V_p, f: f_f, r: R_f, c: C_f }
      lectura: { valor: A_c, rotulo: "Amplitud en C" }
      datos:
        - { valor: ph_c, rotulo: "Fase: {{ph_c}}" }
      mide: { vc_amp: A_c, vc_fase: ph_c, vr_amp: A_r }
      grafica:
        x: { id: t, min: 0, max: 0.002, unidad: s, rotulo: "t" }
        y: { min: -1.2, max: 1.2, unidad: V, rotulo: "v" }
        curvas:
          - { expr: "V_p*sin(w_f*t)", color: tinta, rotulo: "entrada", mide: entrada, discontinua: true }
          - { expr: "A_c*sin(w_f*t + ph_c*pi/180)", color: naranja, rotulo: "v_{C}", mide: vc }
      mandos:
        - { valor: f_f, lista: [250, 500, 1000, 2000, 4000] }
    objetivo:
      condiciones:
        - { valor: ph_c, objetivo: -45, tol: 0.02, rotulo: "Fase: {{ph_c}}" }
      logrado: "A {{f_f}}, ωRC = 1: la salida tiene módulo {{A_c}} y fase {{ph_c}}. Las ecuaciones son las de siempre, con números complejos."
      pistas:
        - { cuando: { valor: ph_c, mayor: -44 }, texto: "Se retrasa poco: suba la frecuencia." }
        - { texto: "Se retrasa demasiado: baje la frecuencia." }
    escalera:
      - "El retraso es de 45° cuando la reactancia del condensador iguala a R."
    solucion: "A 1 kHz: ωRC = 1."
    comprobar:
      - { con: { f_f: 1000 }, x_c: 1, ph_c: -45, A_c: 0.7071, tol: 0.002 }

  - id: mida-fase
    tipo: medir
    titulo: "Dónde sale desfasada"
    texto: "A 1 kHz, ponga la sonda del osciloscopio en el punto donde la señal sale retrasada respecto a la de la fuente."
    libro: [231]
    fijar: { f_f: 1000 }
    widget:
      tipo: circuito
      esquema: filtro-rc
      piezas: { fuente: V_p, f: f_f, r: R_f, c: C_f }
      mide: { vc_amp: A_c, vc_fase: ph_c, vr_amp: A_r }
      grafica:
        x: { id: t, min: 0, max: 0.002, unidad: s, rotulo: "t" }
        y: { min: -1.2, max: 1.2, unidad: V, rotulo: "v" }
        curvas:
          - { expr: "V_p*sin(w_f*t)", color: tinta, rotulo: "entrada", mide: entrada, discontinua: true }
          - { expr: "A_c*sin(w_f*t + ph_c*pi/180)", color: naranja, rotulo: "v_{C}", mide: vc }
      instrumento:
        tipo: osciloscopio
        puntos: { fte: "Arriba de la fuente", c: "Entre la resistencia y el condensador" }
        curvas: { fte: 0, c: 1 }
      mandos: []
    medir:
      magnitud: senal
      punto: c
      porque:
        fte: "Esa es la señal de la fuente: la referencia de fase."
    exito: "En C: menor amplitud y desplazada a la derecha, retrasada. Un fasor recoge las dos cosas."
    escalera:
      - "La salida del divisor está entre la resistencia y el condensador."
    solucion: "La sonda entre R y C."

  - id: prediga-suma
    tipo: leer
    titulo: "Sume las amplitudes"
    texto: "R, L y C en serie con 1 V de pico a 2 kHz. Lea las tres amplitudes y escriba su suma."
    libro: [252]
    fijar: { f_r: 2000 }
    widget:
      tipo: circuito
      esquema: rlc-serie
      piezas: { fuente: V_p, f: f_r, r: R_r, l: L_r, c: C_r }
      lectura: { valor: A_rr, rotulo: "V_{R}" }
      datos:
        - { valor: A_l, rotulo: "V_{L} = {{A_l}}" }
        - { valor: A_cc, rotulo: "V_{C} = {{A_cc}}" }
      mide: { vr_amp: A_rr, vl_amp: A_l, vc_amp: A_cc }
      mandos: []
    leer:
      objetivo: A_suma
      unidad: V
      tol: 0.02
      rotulo: "Suma de las tres amplitudes"
      errores:
        - { expr: "V_p", texto: "Ha supuesto que suman la fuente. Sumadas con su fase sí; sus amplitudes sueltas, no: súmelas tal cual." }
    exito: "1,39 V: más que el voltio de la fuente. La suma de los valores eficaces supera la tensión aplicada."
    escalera:
      - "Sume las tres lecturas tal cual, sin fases."
    solucion: "0,0149 + 0,188 + 1,19 = 1,39 V."
    comprobar:
      - { A_suma: 1.39, A_rr: 0.0149, A_l: 0.1876, A_cc: 1.188, tol: 0.01 }

  - id: suma-modulos
    tipo: sorpresa
    titulo: "Más que la fuente"
    texto: "RLC en serie con 1 V de pico. Cambie la frecuencia hasta que la bobina y el condensador tengan, cada uno, más amplitud que la fuente."
    libro: [252]
    inicio: { f_r: 2000 }
    widget:
      tipo: circuito
      esquema: rlc-serie
      piezas: { fuente: V_p, f: f_r, r: R_r, l: L_r, c: C_r }
      lectura: { valor: A_suma, rotulo: "Suma de las tres amplitudes" }
      datos:
        - { valor: A_l, rotulo: "V_{L} = {{A_l}}" }
        - { valor: A_cc, rotulo: "V_{C} = {{A_cc}}" }
        - { valor: A_rr, rotulo: "V_{R} = {{A_rr}}" }
      mide: { vr_amp: A_rr, vl_amp: A_l, vc_amp: A_cc, i_amp: I_r }
      mandos:
        - { valor: f_r, lista: [1000, 2000, 4000, 8000, 16000] }
    objetivo:
      condiciones:
        - { valor: A_l, min: 1, rotulo: "V_{L}: {{A_l}}" }
        - { valor: A_cc, min: 1, rotulo: "V_{C}: {{A_cc}}" }
      logrado: "A {{f_r}}, {{A_l}} en la bobina y {{A_cc}} en el condensador con 1 V de fuente: van en oposición y se restan entre sí."
      pistas:
        - { texto: "Busque la frecuencia en la que bobina y condensador se compensan casi del todo." }
    escalera:
      - "Cerca de la frecuencia en que X_{L} ≈ X_{C}, la corriente es grande y las dos tensiones reactivas también."
    solucion: "A 4 kHz: 1,71 V y 2,70 V."
    comprobar:
      - { con: { f_r: 4000 }, A_l: 1.71, A_cc: 2.70, tol: 0.02 }
      - { V_p: 1 }

  - id: por-que-fasores
    tipo: porque
    titulo: "¿Cómo puede ser?"
    texto: "Las tres amplitudes suman más que la tensión aplicada y, aun así, se cumple la ley de tensiones. ¿Por qué?"
    libro: [252]
    widget:
      tipo: circuito
      esquema: rlc-serie
      piezas: { fuente: V_p, f: f_r, r: R_r, l: L_r, c: C_r }
      lectura: { valor: A_suma, rotulo: "Suma de las tres amplitudes" }
      mide: { vr_amp: A_rr, vl_amp: A_l, vc_amp: A_cc }
      mandos: []
    opciones:
      - texto: "Las tensiones están desfasadas: la suma que cumple la ley es la fasorial"
        bien: true
        porque: "La de la bobina y la del condensador van en oposición y se restan. La suma fasorial coincide exactamente con la aplicada."
      - texto: "Kirchhoff no vale en alterna"
        porque: "Vale, con fasores. Lo que no vale es sumar valores eficaces como si estuvieran en fase."
      - texto: "Los componentes generan energía"
        porque: "Bobina y condensador no generan nada: intercambian energía. Sus tensiones se restan en parte."
    escalera:
      - "Mire las fases: ¿están las tres tensiones en fase?"
    solucion: "Se suman como fasores: v_{L} y v_{C} se oponen, y la suma fasorial es la aplicada."

  - id: conjugado
    tipo: explorar
    titulo: "Máxima potencia en alterna"
    texto: "La bobina de 10 mH a 2 kHz tiene reactancia. Elija el condensador que la cancele: la corriente subirá hasta la que permite R sola."
    libro: [239]
    nota: "Valores de ejemplo."
    fijar: { f_r: 2000 }
    inicio: { C_r: 100e-9 }
    widget:
      tipo: circuito
      esquema: rlc-serie
      piezas: { fuente: V_p, f: f_r, r: R_r, l: L_r, c: C_r }
      lectura: { valor: I_r, rotulo: "Amplitud de la corriente" }
      datos:
        - { valor: X_l, rotulo: "X_{L} = {{X_l}}" }
        - { valor: X_c, rotulo: "X_{C} = {{X_c}}" }
      mide: { i_amp: I_r, vr_amp: A_rr }
      mandos:
        - { valor: C_r, lista: [100e-9, 330e-9, 633e-9, 1e-6], rotulo: "C" }
    objetivo:
      condiciones:
        - { valor: I_r, min: 0.099, rotulo: "Corriente: {{I_r}}" }
      logrado: "Con X_{C} = X_{L} la parte imaginaria se anula y queda el caso resistivo. Es lo que pide la máxima potencia en alterna: Z_{L} = Z_{s}*."
      pistas:
        - { cuando: { valor: X_c, mayor: 130 }, texto: "El condensador tiene más reactancia que la bobina: más capacidad." }
        - { texto: "Ahora sobra capacidad: el condensador apenas compensa. Menos capacidad." }
    escalera:
      - "Las reactancias se cancelan cuando X_{C} = X_{L}, unos 126 Ω."
    solucion: "633 nF: X_{C} ≈ X_{L} ≈ 126 Ω."
    comprobar:
      - { con: { C_r: 633e-9 }, X_l: 125.66, X_c: 125.7, tol: 0.003 }
      - { L_r: 0.01, f_r: 2000 }

  - id: dos-frecuencias
    tipo: pregunta
    titulo: "Dos frecuencias"
    texto: "Un circuito tiene dos fuentes de frecuencias distintas. ¿Cómo se combinan los resultados?"
    libro: [236, 237]
    widget:
      tipo: circuito
      esquema: filtro-rc
      piezas: { fuente: V_p, f: f_f, r: R_f, c: C_f }
      lectura: { valor: A_c, rotulo: "Amplitud en C" }
      mide: { vc_amp: A_c }
      mandos:
        - { valor: f_f, lista: [250, 500, 1000, 2000, 4000] }
    opciones:
      - texto: "Cada frecuencia por separado, con sus impedancias; se suman en el tiempo"
        bien: true
        porque: "La superposición es obligatoria aquí. Cada fasor representa una senoide de su frecuencia."
      - texto: "Se suman los dos fasores"
        porque: "Fasores de frecuencias distintas no se suman: representan cosas diferentes, y sumarlos no significa nada."
      - texto: "Se usa la impedancia a la frecuencia media"
        porque: "Las impedancias dependen de ω: cada frecuencia tiene las suyas, y se analiza aparte."
    escalera:
      - "Las impedancias dependen de la frecuencia."
    solucion: "Una por una, con sus impedancias, y suma en el dominio del tiempo."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [230, 233, 236, 239, 240, 247, 252]
    ideas:
      - { titulo: "Impedancias.", texto: "Mismas ecuaciones con números complejos (en paralelo, admitancias); con s en lugar de jω, también el transitorio." }
      - { titulo: "Varias frecuencias.", texto: "Cada una por separado y suma en el tiempo; nunca sumar fasores de frecuencias distintas." }
      - { titulo: "Lo que cambia.", texto: "Máxima potencia con el conjugado; balance de activa y de reactiva, no de aparente." }
      - { titulo: "Fasores.", texto: "Las amplitudes pueden sumar más que la fuente: la ley se cumple sumando fasores." }
