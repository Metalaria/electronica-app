# «Consolas por dentro» · Mega Drive 5: el camino del vídeo y del sonido. El VDP con su VRAM de doble puerto, el
# codificador MB3514 de la VA6.8 PAL (CXA1145 en el esquema y en la VA6 de EE. UU.), el conector A/V y el modulador;
# el PSG dentro del VDP, el YM2612 y el mezclador CXA1034P + LM358, y la avería de auriculares del manual de Sega.
# Fuentes: los datos de la consola (megadrive#n) y la guía de Retro Tech Wiki (manual PAL-G de Sega).
leccion: consola-megadrive/megadrive-video-audio

libro:
  "megadrive#3": "Procesador de vídeo con el PSG (SN76489) dentro"
  "megadrive#5": "Programa el YM2612 y el PSG"
  "megadrive#7": "OPN2: seis canales FM (el sexto puede reproducir PCM)"
  "megadrive#10": "lee líneas enteras de tiles por el puerto serie (SD0–SD7, SC)"
  "megadrive#12": "RGB analógico del VDP a vídeo compuesto PAL"
  "megadrive#13": "Suman el FM del YM2612, el PSG del VDP y el audio del cartucho y la expansión"
  "megadrive#20": "Vídeo compuesto, RGB con sincronismo y audio mono"
  "megadrive#21": "Modula el vídeo compuesto PAL y el audio en una señal de antena"
  "megadrive#69": "lee líneas de tiles por el puerto serie (SD0–SD7, reloj SC), mucho más rápido"
  "megadrive#99": "Sonido en el DIN pero no en los auriculares: IC12 (CXA1034)"

modelo:
  valores: {}
  calculos: {}

tarjetas:
  - id: explore-video
    tipo: explorar
    titulo: "El camino de la imagen"
    texto: "Toque el VDP, el codificador, el conector A/V y el modulador."
    libro: ["megadrive#12", "megadrive#20", "megadrive#21"]
    requiere: { mover: [vdp, enc, av, rf] }
    widget:
      tipo: figura
      consola: { maquina: megadrive }
      zonas:
        - { id: vdp, hotspot: vdp, rotulo: "VDP", texto: "Saca la imagen en RGB analógico." }
        - { id: enc, hotspot: enc, rotulo: "Codificador MB3514", texto: "Del RGB del VDP a vídeo compuesto PAL." }
        - { id: av, hotspot: av, rotulo: "Conector A/V", texto: "Compuesto, RGB con sincronismo y audio mono." }
        - { id: rf, hotspot: rf, rotulo: "Modulador de RF", texto: "El compuesto y el audio, en señal de antena." }

  - id: ordene-video
    tipo: pregunta
    fase: "Ordene"
    titulo: "Del chip a la antena"
    texto: "Ordene el camino de la imagen hasta la toma de antena del televisor."
    libro: ["megadrive#12", "megadrive#21", "megadrive#3"]
    ordenar:
      - "El VDP saca RGB analógico."
      - "El MB3514 lo convierte en vídeo compuesto PAL."
      - "El modulador lo lleva a una señal de antena."
    exito: "RGB, compuesto y antena: la misma imagen, convertida dos veces."
    pistas:
      - { texto: "El modulador trabaja con el vídeo compuesto, no con el RGB." }
    escalera:
      - "Empieza en el chip de vídeo."
    solucion: "VDP (RGB), MB3514 (compuesto) y modulador (antena)."

  - id: toque-codificador
    tipo: tocar
    titulo: "El codificador"
    texto: "Toque el chip que convierte el RGB del VDP en vídeo compuesto PAL."
    libro: ["megadrive#12", "megadrive#13"]
    widget:
      tipo: figura
      consola: { maquina: megadrive }
      zonas:
        - { id: enc, hotspot: enc, rotulo: "Chip pequeño, arriba a la izquierda" }
        - { id: vdp, hotspot: vdp, rotulo: "Chip cuadrado, en el centro" }
        - { id: audio, hotspot: audio, rotulo: "Chips pequeños, a la izquierda" }
    tocar:
      bien: [enc]
      porque:
        vdp: "El VDP saca el RGB; otro chip hace el compuesto."
        audio: "Son el CXA1034P y el LM358: el audio, no el vídeo."
    exito: "El Fujitsu MB3514, de montaje superficial: del RGB al compuesto PAL."
    escalera:
      - "Está entre el VDP y el conector A/V, cerca del borde de arriba."
    solucion: "El MB3514 (IC13), de montaje superficial, arriba a la izquierda."

  - id: prediga-psg
    tipo: predecir
    titulo: "¿Dónde está el PSG?"
    texto: "Además del YM2612, la consola tiene un PSG, un SN76489. ¿Dónde está?"
    libro: ["megadrive#3", "megadrive#7"]
    widget:
      tipo: figura
      consola: { maquina: megadrive }
      zonas:
        - { id: vdp, hotspot: vdp, rotulo: "VDP" }
        - { id: ym, hotspot: ym, rotulo: "YM2612" }
    opciones:
      - texto: "Dentro del VDP."
        bien: true
        porque: "El 315-5313 es procesador de vídeo y lleva el PSG dentro: el chip de la imagen también suena."
      - texto: "Dentro del YM2612."
        porque: "El YM2612 es el FM de seis canales. El PSG va en el VDP."
      - texto: "En un chip aparte, junto al Z80."
        porque: "No hay chip aparte: el PSG está integrado en el VDP."
    escalera:
      - "Lea la ficha del VDP."
    solucion: "Dentro del VDP 315-5313."

  - id: empareje-sonido
    tipo: pregunta
    fase: "Empareje"
    titulo: "Cada pieza del sonido"
    texto: "Empareje cada pieza con lo que hace en el sonido."
    libro: ["megadrive#7", "megadrive#3", "megadrive#13"]
    emparejar:
      - ["YM2612", "Seis canales FM"]
      - ["VDP", "El PSG"]
      - ["CXA1034P y LM358", "Suman y amplifican"]
    exito: "Dos generadores y un mezclador, que suma también el audio del cartucho."
    pistas:
      - { texto: "El mezclador suma el FM, el PSG y el audio del cartucho y de la expansión." }
    escalera:
      - "El PSG está dentro de un chip que no es de sonido."
    solucion: "YM2612: FM. VDP: PSG. CXA1034P y LM358: mezcla y auriculares."

  - id: toque-auriculares
    tipo: tocar
    titulo: "Sin sonido en los auriculares"
    texto: "Hay sonido en el conector A/V pero no en los auriculares. Toque lo que señala el manual de Sega."
    libro: ["megadrive#99", "megadrive#13", "megadrive#5"]
    widget:
      tipo: figura
      consola: { maquina: megadrive }
      zonas:
        - { id: audio, hotspot: audio, rotulo: "Chips pequeños, a la izquierda" }
        - { id: z80, hotspot: z80, rotulo: "Chip largo, abajo en el centro" }
        - { id: av, hotspot: av, rotulo: "Conector, arriba a la izquierda" }
    tocar:
      bien: [audio]
      porque:
        z80: "El Z80 lleva el sonido, y lo hay en el A/V: falla solo el camino a los auriculares."
        av: "El conector A/V funciona: ahí sí hay sonido."
    exito: "IC12, el CXA1034: amplifica la salida de auriculares."
    escalera:
      - "Si una salida suena y la otra no, el fallo está después del punto común."
    solucion: "El mezclador: IC12 (CXA1034) según el manual de Sega."

  - id: por-que-doble-puerto
    tipo: porque
    titulo: "Una VRAM con dos puertas"
    texto: "¿Por qué la VRAM de la Mega Drive tiene dos puertos?"
    libro: ["megadrive#10", "megadrive#69"]
    widget:
      tipo: figura
      consola: { maquina: megadrive }
      zonas:
        - { id: vram, hotspot: vram, rotulo: "VRAM" }
        - { id: vdp, hotspot: vdp, rotulo: "VDP" }
    opciones:
      - texto: "El VDP escribe por uno y lee líneas enteras de tiles por el otro, mucho más rápido."
        bien: true
        porque: "Por el puerto aleatorio escribe; por el serie (SD0–SD7) lee una línea de tiles de golpe, como pide el barrido."
      - texto: "Uno es para el 68000 y otro para el Z80."
        porque: "Los dos puertos son del VDP: uno aleatorio para escribir y otro serie para leer líneas."
      - texto: "Para tener el doble de memoria."
        porque: "Son los mismos 64 KB vistos por dos caminos."
    escalera:
      - "Para dibujar, el VDP lee muchos datos seguidos de cada línea."
    solucion: "Puerto aleatorio para escribir; puerto serie para leer líneas enteras de tiles, más rápido."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: ["megadrive#12", "megadrive#3", "megadrive#13", "megadrive#10"]
    ideas:
      - { titulo: "La imagen.", texto: "RGB del VDP, compuesto del MB3514 y antena del modulador." }
      - { titulo: "Dos generadores.", texto: "El YM2612 hace el FM; el PSG va dentro del VDP." }
      - { titulo: "El mezclador.", texto: "Suma FM, PSG y cartucho, y da los auriculares." }
      - { titulo: "Doble puerto.", texto: "La VRAM se escribe por un lado y se lee por líneas por el otro." }
