# «Consolas por dentro» · Mega Drive 2: la alimentación. El camino del manual PAL-G de Sega (adaptador de 10 V → FB1
# → SW1 → dos 1SR35-100A → IC15), la polaridad del modelo 1, la potencia que disipa un 7805 y su dropout (libro,
# sección 8.4) y qué alimenta cada 7805 según las redes VCC y VCCQ del esquema. Fuentes: los datos de la consola
# (megadrive#n), la guía de Retro Tech Wiki basada en el manual de Sega, ConsoleMods «Genesis:Buying Guide» y el libro.
# 1.2.1: el camino se toca en orden en la foto; el 7805 es un circuito vivo (esquema «regulador-lineal», como en la
# piloto de la SNES), con los 10 V del adaptador PAL-G sin contar los diodos y una carga de ejemplo de 0,5 A: se mide
# Vcc1, se escribe el calor y se sube la entrada hasta que regula; se tocan los chips de la red VCCQ que se apagan si
# falla IC17 (redes del esquema, megadrive#126/127). Queda el emparejar de las clavijas.
leccion: consola-megadrive/megadrive-alimentacion

libro:
  "megadrive#2": "Bus de 23 bits de dirección (VA1–VA23 con /UDS y /LDS) y 16 de datos"
  "megadrive#4": "Decodifica el mapa del 68000, arbitra el bus entre 68000, Z80 y VDP"
  "megadrive#22": "Dos reguladores lineales de +5 V sobre el blindaje"
  "megadrive#23": "Interruptor deslizante"
  "megadrive#92": "La clavija del adaptador del modelo 1 tiene el centro negativo"
  "megadrive#93": "da 10 V de continua y 1,2 A"
  "megadrive#94": "La entrada de continua pasa por la ferrita FB1, el interruptor SW1 y dos diodos 1SR35-100A hasta IC15"
  "megadrive#95": "Vcc1 y Vcc2 deben dar +5 V"
  "megadrive#96": "un IC17 averiado"
  "megadrive#115": "toma de 5,5 × 2,1 mm con la punta negativa"
  "megadrive#116": "Modelo 2: toma EIAJ-03 (4,75 × 1,7 mm) con la punta positiva"
  "megadrive#126": "Red VCC del esquema (alimentación)"
  "megadrive#127": "Red VCCQ del esquema (alimentación)"
  "cap08#65": "P_(\"disipada\")"
  "cap08#66": "Más de la mitad de la energía se convierte en calor"
  "cap08#67": "necesita unos 2 V de diferencia entre entrada y salida para funcionar"

modelo:
  valores:
    V_in: { sim: "V_{entrada}", nombre: "tensión en la entrada del 7805", unidad: V, valor: 5 }
    V_ad: { sim: "V_{adaptador}", nombre: "tensión del adaptador", unidad: V, valor: 10 }
    V_o: { sim: "V_{salida}", nombre: "salida del 7805", unidad: V, valor: 5 }
    I: { sim: "I", nombre: "corriente del regulador (ejemplo)", unidad: A, valor: 0.5 }
    V_dr: { sim: "V_{do}", nombre: "dropout del 78xx", unidad: V, valor: 2 }
    R_c: { sim: "R_{L}", nombre: "carga de ejemplo: la que pide 0,5 A a 5 V", unidad: Ω, valor: 10 }
    on_c: { tipo: interruptor, nombre: "consola encendida", valor: 1 }
  calculos:
    I_reg: { si: on_c, entonces: "V_reg/R_c", sino: "0", sim: "I", nombre: "corriente del 7805 al subir la entrada", unidad: A }
    V_sa: { expr: "min(V_o, V_ad - V_dr)", sim: "V_{salida}", nombre: "salida del 7805 con el adaptador", unidad: V }
    I_a: { si: on_c, entonces: "V_sa/R_c", sino: "0", sim: "I", nombre: "corriente con el adaptador", unidad: A }
    V_pa: { expr: "V_ad - V_sa", sim: "V_{entrada} − V_{salida}", nombre: "caída en el 7805", unidad: V }
    P_a: { expr: "V_pa*I_a", sim: "P_{disipada}", nombre: "calor que disipa el 7805 con el adaptador", unidad: W, cifras: 3 }
    P_mal: { expr: "V_ad*I_a", sim: "V · I", nombre: "los 10 V enteros por la corriente", unidad: W }
    V_reg: { expr: "min(V_o, max(0, V_in - 2))", sim: "V_{salida}", nombre: "tensión de salida del 7805 (modelo)", unidad: V, cifras: 3 }
    P_d: { expr: "(V_ad - V_o)*I", sim: "P_{disipada}", nombre: "potencia que disipa el 7805", unidad: W, cifras: 3 }

tarjetas:
  - id: ordene-camino
    tipo: tocar
    fase: "Ordene"
    titulo: "El camino de la corriente"
    texto: "Los 10 V del adaptador pasan por la ferrita FB1, el interruptor y dos diodos hasta los 7805. Toque, en ese orden, el interruptor y los reguladores."
    libro: ["megadrive#94", "megadrive#93", "megadrive#22", "megadrive#23"]
    widget:
      tipo: figura
      consola: { maquina: megadrive }
      zonas:
        - { id: sw1, hotspot: sw1, rotulo: "Interruptor, abajo a la izquierda" }
        - { id: reg, hotspot: reg, rotulo: "Piezas con disipador, arriba a la izquierda" }
        - { id: osc, hotspot: osc, rotulo: "Pieza metálica, en el centro" }
        - { id: ym, hotspot: ym, rotulo: "Chip largo, a la izquierda" }
    tocar:
      bien: [sw1, reg]
      orden: true
      porque:
        osc: "Es el oscilador maestro: da el reloj, no la alimentación."
        ym: "Es el YM2612: recibe los 5 V, no los genera."
    pistas:
      - { texto: "El interruptor está en la entrada; los reguladores, al final." }
    exito: "Adaptador, FB1, SW1, los dos 1SR35-100A e IC15: filtrar, encender, proteger y regular."
    escalera:
      - "Lo último son los dos 7805, sobre el blindaje."
    solucion: "SW1 y luego IC15 e IC17."

  - id: empareje-clavijas
    tipo: pregunta
    fase: "Empareje"
    titulo: "Cada modelo, su clavija"
    texto: "¿Sirve el adaptador de una Mega Drive 2 en el modelo 1? Empareje cada uno con su clavija."
    libro: ["megadrive#92", "megadrive#115", "megadrive#116"]
    emparejar:
      - ["Modelo 1", "5,5 × 2,1 mm, punta negativa"]
      - ["Modelo 2", "EIAJ-03, punta positiva"]
    exito: "Polaridad contraria: el del modelo 2 no se debe usar en el modelo 1."
    pistas:
      - { texto: "El manual de Sega avisa: los adaptadores del modelo 2 y de la 32X tienen el centro positivo." }
    escalera:
      - "El modelo 1 tiene el centro negativo."
    solucion: "Modelo 1: 5,5 × 2,1 mm, punta negativa. Modelo 2: EIAJ-03, punta positiva. No son intercambiables."

  - id: prediga-vcc
    tipo: medir
    titulo: "Vcc1"
    texto: "El manual de Sega pide comprobar la salida de cada 7805. Ponga las puntas para medir Vcc1, la salida de IC15."
    nota: "El 7805 por dentro: elemento de paso, referencia y amplificador de error."
    libro: ["megadrive#95", "megadrive#93"]
    fijar: { V_ad: 10, V_o: 5, on_c: 1 }
    widget:
      tipo: circuito
      esquema: regulador-lineal
      piezas: { entrada: V_ad, ref: V_o, dropout: V_dr, carga: R_c, interruptor: on_c }
      corriente: I_a
      mide: { vout: V_sa, iin: I_a, iout: I_a, icarga: I_a, vpaso: V_pa, p_paso: P_a }
      instrumento:
        tipo: multimetro
        modos: [V]
        puntos: { in: "Entrada del 7805", out: "Salida del 7805", "0": "Masa" }
      mandos: []
    medir:
      magnitud: tension
      entre: [out, "0"]
      valor: V_sa
      porque:
        "in/0": "Esa es la entrada: los 10 V del adaptador."
        "in/out": "Eso es lo que cae en el 7805, no lo que da."
    exito: "+5 V: Vcc1 y Vcc2 deben dar +5 V. Si no los da con la entrada bien, el regulador está mal."
    escalera:
      - "La salida respecto a masa."
    solucion: "Roja en la salida del 7805 y negra en masa."

  - id: formula-disipa
    tipo: leer
    titulo: "Lo que sobra, en calor"
    texto: "Sin contar los diodos, con 10 V a la entrada y una carga de ejemplo de 0,5 A, mida la corriente del 7805 y escriba el calor que disipa."
    libro: ["cap08#65", "cap08#66", "megadrive#93"]
    fijar: { V_ad: 10, V_o: 5, on_c: 1 }
    widget:
      tipo: circuito
      esquema: regulador-lineal
      piezas: { entrada: V_ad, ref: V_o, dropout: V_dr, carga: R_c, interruptor: on_c }
      corriente: I_a
      mide: { vout: V_sa, iin: I_a, iout: I_a, icarga: I_a, vpaso: V_pa, p_paso: P_a }
      instrumento:
        tipo: multimetro
        puntos: { in: "Entrada del 7805", out: "Salida del 7805", "0": "Masa" }
        ramas: { vmi: "Entre el adaptador y el 7805", vml: "Hacia la consola" }
      mandos: []
    leer:
      objetivo: P_a
      unidad: W
      rotulo: "Calor en el 7805"
      errores:
        - { expr: "P_mal", texto: "Ha multiplicado los 10 V enteros. El 7805 solo quema la diferencia entre entrada y salida." }
    exito: "(10 − 5) V · 0,5 A = 2,5 W: por eso van sobre el blindaje."
    escalera:
      - "El calor es la caída en el 7805 por la corriente que lo atraviesa."
    solucion: "(10 − 5) V · 0,5 A = 2,5 W."
    comprobar:
      - { P_a: 2.5, I_a: 0.5, V_pa: 5, P_mal: 5 }

  - id: ajuste-dropout
    tipo: explorar
    titulo: "¿Cuánta entrada necesita?"
    texto: "El 78xx necesita unos 2 V más en la entrada que en la salida. Suba la entrada hasta que el 7805 dé sus 5 V."
    libro: ["cap08#67", "megadrive#22"]
    fijar: { V_o: 5, on_c: 1 }
    inicio: { V_in: 5 }
    widget:
      tipo: circuito
      esquema: regulador-lineal
      piezas: { entrada: V_in, ref: V_o, dropout: V_dr, carga: R_c, interruptor: on_c }
      lectura: { valor: V_reg, rotulo: "Salida del 7805" }
      corriente: I_reg
      mide: { vout: V_reg, iin: I_reg, iout: I_reg, icarga: I_reg }
      mandos: [ { valor: V_in, min: 5, max: 10, paso: 0.5, rotulo: "Entrada, V_{entrada}" } ]
    objetivo:
      condiciones:
        - { valor: V_reg, mayor: 4.99, rotulo: "Salida: {{V_reg}}" }
      logrado: "Con {{V_in}} en la entrada ya da sus 5 V: la entrada supera la salida en unos 2 V."
      pistas:
        - { texto: "Todavía no regula: a la entrada le faltan voltios. Súbala." }
    escalera:
      - "Salida + margen: 5 + 2."
    solucion: "Con unos 7 V o más en la entrada."
    comprobar:
      - { con: { V_in: 7 }, V_reg: 5 }

  - id: por-que-ic17
    tipo: tocar
    titulo: "Media placa sin 5 V"
    texto: "Cada 7805 tiene su red: IC15 da la VCC e IC17, la VCCQ. IC17 se ha averiado: toque los chips de la foto que se quedan sin sus 5 V."
    libro: ["megadrive#126", "megadrive#127", "megadrive#96", "megadrive#2", "megadrive#4"]
    widget:
      tipo: figura
      consola: { maquina: megadrive }
      zonas:
        - { id: z80, hotspot: z80, rotulo: "Chip largo, abajo en el centro" }
        - { id: zram, hotspot: zram, rotulo: "Chip, abajo a la izquierda del Z80" }
        - { id: ym, hotspot: ym, rotulo: "Chip largo, a la izquierda" }
        - { id: io, hotspot: io, rotulo: "Chip cuadrado, a la derecha" }
        - { id: m68k, hotspot: m68k, rotulo: "Chip largo, arriba a la derecha" }
        - { id: vdp, hotspot: vdp, rotulo: "Chip cuadrado, en el centro" }
    tocar:
      bien: [z80, zram, ym, io]
      todas: true
      porque:
        m68k: "El 68000 (U1) está en la red VCC, la de IC15: sigue con sus 5 V."
        vdp: "El VDP (U8) está en la red VCC, la de IC15."
    exito: "El Z80 y su RAM, el YM2612 y el árbitro (y también la RAM del 68000 y el mezclador): la red VCCQ. Un IC17 averiado es una de las causas de que no encienda."
    escalera:
      - "La VCCQ llega a U2, U3, U4, U6, U7, U11 y U12; la VCC, a U1, U8, U9 y U10."
    solucion: "El Z80, su RAM, el YM2612 y el árbitro de E/S."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: ["megadrive#94", "megadrive#92", "cap08#67", "megadrive#127"]
    ideas:
      - { titulo: "El camino.", texto: "Adaptador, FB1, SW1, dos diodos y los 7805." }
      - { titulo: "La polaridad.", texto: "El modelo 1 quiere el centro negativo." }
      - { titulo: "El 78xx.", texto: "Unos 2 V de margen y la diferencia, en calor." }
      - { titulo: "Dos redes.", texto: "IC15 da la VCC e IC17 la VCCQ: cada uno, media placa." }
