# Lección 1.2 de la sección 27.7 «El Arranque del Oscilador y la Estabilización de Amplitud» (cap28). Formato: GUIA.md.
# El arranque se dibuja como en la figura 27.9: ruido inicial 0,02 (relativo) que crece G veces por ciclo hasta la
# amplitud fijada (1), con G = 0,98, 1,05 y 1,20 (0,37 tras 60 ciclos con 1,05, como la figura). El diseño usa el
# amplificador de un Wien (esquema ao-no-inversor, 0,1 V de prueba en continua): ganancia de lazo G/3 entre 1,05 y 1,20
# en el peor caso de las tolerancias de R₁ y R_f (bloque 190; resistencias del 1 % como en el problema 27.A). Solo se
# modelan las tolerancias, no la temperatura ni la alimentación (lo dice la nota). Con ± 5 % no cabe ningún par.
leccion: cap28/sec-28.7

libro:
  177: "el oscilador nunca arranca"
  178: "conseguida con un mecanismo automático que la reduzca a medida que la amplitud crece"
  180: "el lazo amplifica esa componente en cada vuelta"
  182: "riesgo de no arrancar con temperatura baja"
  185: "produce una onda recortada con distorsión de varios por ciento"
  186: "baja la distorsión al orden del 1 %"
  187: "lo que consigue distorsiones por debajo del 0,01 %"
  188: "el lazo de control debe ser mucho más lento que la oscilación"
  190: "entre un 5 y un 20 % mayor que 1 en el peor caso"
  191: "el remedio no es insistir sino aumentarlo"
  194: "apenas 1 µW en los de 32 768 Hz"
  196: "se ve la señal crecer desde el ruido hasta la amplitud final"
  197: "La diferencia entre esa tensión y la nominal es el margen real"
  "cap28#208": "ambas del 1 %"

modelo:
  valores:
    G_l: { sim: "|A·β|", nombre: "ganancia de lazo", unidad: "", valor: 1.05 }
    v_r: { sim: "v₀", nombre: "ruido inicial, relativo", unidad: "", valor: 0.02 }
    V_e: { sim: "v_{in}", nombre: "tensión de prueba", unidad: V, valor: 0.1 }
    R_1: { sim: "R₁", nombre: "resistencia a masa", unidad: Ω, valor: 10000 }
    R_2: { sim: "R_{f}", nombre: "resistencia de realimentación", unidad: Ω, valor: 20000 }
  calculos:
    a_60: { expr: "min(1, v_r*G_l^60)", sim: "v", nombre: "amplitud tras 60 ciclos", unidad: "", cifras: 2 }
    G_a: { expr: "1 + R_2/R_1", sim: "G", nombre: "ganancia del amplificador", unidad: "" }
    L_g: { expr: "G_a/3", sim: "|A·β|", nombre: "ganancia de lazo del Wien", unidad: "", cifras: 3 }
    r_f: { expr: "R_2/R_1", sim: "R_{f}/R₁", nombre: "cociente de resistencias", unidad: "" }
    V_o: { expr: "G_a*V_e", sim: "v_{o}", nombre: "tensión de salida", unidad: V }

tarjetas:
  - id: explore-arranque
    tipo: explorar
    titulo: "Arranca del ruido"
    texto: "El lazo amplifica el ruido en cada vuelta. Cambie el exceso de ganancia y mire cuánto tarda en llegar a la amplitud fijada."
    nota: "Amplitudes relativas, en escala logarítmica."
    libro: [180, 182]
    widget:
      tipo: grafica
      x: { id: nc, min: 0, max: 60, unidad: ciclos, rotulo: "ciclos de oscilación" }
      y: { min: 0.003, max: 3, unidad: "", rotulo: "amplitud", escala: log }
      curvas:
        - { expr: "min(1, v_r*G_l^nc)", color: azul, rotulo: "amplitud" }
      lectura: { valor: a_60, rotulo: "Amplitud tras 60 ciclos" }
      mandos:
        - { valor: G_l, lista: [1.05, 1.2], rotulo: "|A·β|" }
    requiere: { mover: [G_l] }
    comprobar:
      - { a_60: 0.37, tol: 0.02 }

  - id: prediga-frio
    tipo: predecir
    titulo: "En frío"
    texto: "Un oscilador diseñado con muy poco exceso de ganancia se enciende en frío, y su ganancia de lazo queda en 0,98. ¿Qué pasa?"
    libro: [177, 182]
    fijar: { G_l: 0.98 }
    widget:
      tipo: grafica
      x: { id: nc, min: 0, max: 5, unidad: ciclos, rotulo: "ciclos de oscilación" }
      y: { min: 0.003, max: 3, unidad: "", rotulo: "amplitud", escala: log }
      curvas:
        - { expr: "min(1, v_r*G_l^nc)", color: azul, rotulo: "amplitud" }
      lectura: { valor: a_60, rotulo: "Amplitud tras 60 ciclos" }
      ocultar: true
    opciones:
      - texto: "No arranca: la oscilación se extingue"
        bien: true
        porque: "Por debajo de 1, cada vuelta la reduce. Es el riesgo del poco exceso con temperatura baja."
      - texto: "Arranca, pero más despacio"
        porque: "Más despacio sería con ganancia algo mayor que 1. Por debajo de 1 no crece nunca."
      - texto: "Arranca igual: el ruido siempre está"
        porque: "El ruido está, pero el lazo lo atenúa en cada vuelta."
    escalera:
      - "¿Qué le pasa a una señal que vuelve multiplicada por 0,98 en cada vuelta?"
    solucion: "Se extingue: con ganancia de lazo menor que 1 nunca arranca."
    comprobar:
      - { a_60: 0.006, tol: 0.05 }

  - id: empareje-casos
    tipo: pregunta
    fase: "Empareje"
    titulo: "Tres ganancias de lazo"
    texto: "Una cada ganancia de lazo con lo que hace el oscilador."
    libro: [177, 178]
    emparejar:
      - ["Menor que 1", "Nunca arranca"]
      - ["Mayor que 1", "Crece hasta que algo la limita"]
      - ["Exactamente 1", "Perfecto, e imposible de mantener"]
    exito: "Por eso: mayor que 1 al arrancar y exactamente 1 en régimen, con un mecanismo automático."
    pistas:
      - { texto: "Ningún circuito real mantiene una ganancia exactamente igual a 1." }
    escalera:
      - "Piense en la temperatura, el envejecimiento y la dispersión."
    solucion: "Menor: no arranca. Mayor: crece hasta limitarse. Igual: ideal, pero no se sostiene."

  - id: toque-mecanismo
    tipo: tocar
    titulo: "Para un generador de señal"
    texto: "Un generador de señal necesita la senoide más limpia posible. Toque el mecanismo de estabilización que elegiría."
    libro: [185, 186, 187, 188]
    widget:
      tipo: figura
      figura: fig-28.10
      zonas:
        - { id: saturacion, rotulo: "Primera caja de la derecha", rect: [239, 24, 205, 41] }
        - { id: diodos, rotulo: "Segunda caja de la derecha", rect: [239, 70, 205, 40] }
        - { id: lampara, rotulo: "Tercera caja de la derecha", rect: [239, 116, 205, 40] }
        - { id: agc, rotulo: "Cuarta caja de la derecha", rect: [239, 161, 205, 40] }
    tocar:
      bien: [lampara]
      porque:
        saturacion: "Recorta con varios por ciento de distorsión: vale para un reloj, no para un generador de señal."
        diodos: "Suaves y baratos, pero la distorsión queda del orden del 1 %."
        agc: "La solución moderna, pero su compromiso de velocidad le impide llegar a la suavidad de la lámpara."
    exito: "La lámpara: su inercia térmica filtra y baja la distorsión por debajo del 0,01 %. Sigue siendo la referencia."
    escalera:
      - "Busque la distorsión más baja de la columna THD."
    solucion: "La lámpara de filamento: menos del 0,01 % de distorsión."

  - id: por-que-agc
    tipo: porque
    titulo: "Ni rápido ni lento"
    texto: "El lazo de un AGC debe ser mucho más lento que la oscilación, pero más rápido que lo que corrige. ¿Por qué no muy rápido?"
    libro: [188]
    widget:
      tipo: figura
      figura: fig-28.10
      zonas:
        - { id: agc, rotulo: "El AGC", rect: [239, 161, 205, 40] }
    opciones:
      - texto: "Un AGC demasiado rápido modula la señal dentro de cada ciclo: distorsión"
        bien: true
        porque: "Si corrige dentro de cada ciclo, deforma la senoide; demasiado lento, la amplitud fluctúa."
      - texto: "Porque el JFET no puede cambiar tan deprisa"
        porque: "El JFET responde de sobra; la lentitud es una decisión de diseño."
      - texto: "Porque un AGC rápido no arranca"
        porque: "El arranque depende del exceso de ganancia, no de la velocidad del control."
    escalera:
      - "¿Qué le pasa a la senoide si su ganancia cambia durante el propio ciclo?"
    solucion: "Demasiado rápido modula la señal y distorsiona; demasiado lento deja fluctuar la amplitud."

  - id: disene-margen
    tipo: diseno
    titulo: "Diseñe el margen de arranque"
    texto: "Amplificador de un Wien con R₁ y R_{f} del 1 %. Elija R_{f} para una ganancia de lazo entre 1,05 y 1,20 en el peor caso."
    nota: "Solo las tolerancias de las resistencias."
    libro: [190, "cap28#208"]
    fijar: { V_e: 0.1, R_1: 10000 }
    inicio: { R_2: 20000 }
    widget:
      tipo: circuito
      esquema: ao-no-inversor
      piezas: { entrada: V_e, r1: R_1, r2: R_2 }
      lectura: { valor: L_g, rotulo: "Ganancia de lazo, G/3" }
      mide: { vo: V_o }
      mandos:
        - { valor: R_2, serie: E24, min: 15000, max: 33000, rotulo: "R_{f} (E24)" }
    condiciones:
      - { valor: L_g, min: 1.05, max: 1.2, rotulo: "Lazo: {{L_g}}" }
    diseno:
      tolerancias: { R_1: 0.01, R_2: 0.01 }
      metodo: esquinas
      exigir: todas
      si_tolerancias: "El nominal cumple, pero en alguna esquina se sale: aléjese de los bordes de 1,05 y 1,20."
    exito: "En todas las esquinas arranca con margen y sin exceso. Con más de 20 %, crecen el sobreimpulso y la distorsión."
    pistas:
      - { cuando: { valor: L_g, menor: 1.05 }, texto: "Falta margen: hay ejemplares que no arrancarían. Suba R_{f}." }
      - { cuando: { valor: L_g, mayor: 1.2 }, texto: "Sobra ganancia: más sobreimpulso y distorsión. Baje R_{f}." }
      - { texto: "Ajuste R_{f} para quedar lejos de los dos bordes." }
    escalera:
      - "Ganancia de lazo = (1 + R_{f}/R₁)/3: busque R_{f}/R₁ entre 2,15 y 2,6."
    solucion: "R_{f} = 22 o 24 kΩ: en todas las esquinas, entre 1,05 y 1,20."
    comprobar:
      - { con: { R_2: 22000 }, L_g: 1.0667, tol: 0.001 }
      - { con: { R_2: 24000 }, L_g: 1.1333, tol: 0.001 }
      - { con: { R_2: 21500 }, L_g: 1.05, r_f: 2.15, tol: 0.001 }
      - { con: { R_2: 26000 }, L_g: 1.2, r_f: 2.6, tol: 0.001 }

  - id: arranca-tocandolo
    tipo: pregunta
    titulo: "Arranca al tocarlo"
    texto: "Un oscilador arranca en el banco, no en frío, y a veces solo al tocarlo con la sonda. ¿Qué hace?"
    libro: [191]
    fijar: { G_l: 1.05 }
    widget:
      tipo: grafica
      x: { id: nc, min: 0, max: 60, unidad: ciclos, rotulo: "ciclos de oscilación" }
      y: { min: 0.003, max: 3, unidad: "", rotulo: "amplitud", escala: log }
      curvas:
        - { expr: "min(1, v_r*G_l^nc)", color: azul, rotulo: "con poco margen" }
        - { expr: "min(1, v_r*0.98^nc)", color: naranja, rotulo: "en frío", discontinua: true }
    opciones:
      - texto: "Aumentar el margen de ganancia"
        bien: true
        porque: "Los dos síntomas dicen que el margen es insuficiente; insistir no lo arregla."
      - texto: "Insistir: encender y apagar hasta que arranque"
        porque: "Puede arrancar alguna vez, pero el siguiente ejemplar o la siguiente mañana fría no."
      - texto: "Dejar la sonda conectada"
        porque: "La sonda solo cambia ligeramente el circuito: delata el problema, no lo resuelve."
    escalera:
      - "¿Qué tienen en común el frío y la sonda?"
    solucion: "Margen de ganancia insuficiente: hay que aumentarlo."

  - id: cristal-excitacion
    tipo: pregunta
    titulo: "Un cristal de 32 768 Hz"
    texto: "Un oscilador de 32 768 Hz tiene demasiada ganancia y no lleva resistencia serie. ¿Qué arriesga?"
    libro: [194]
    widget:
      tipo: figura
      figura: fig-28.10
      zonas:
        - { id: saturacion, rotulo: "Saturación del amplificador", rect: [239, 24, 205, 41] }
    opciones:
      - texto: "Sobreexcitarlo: con apenas 1 µW de límite, se daña o se desplaza en frecuencia"
        bien: true
        porque: "La resistencia serie limita la excitación, aunque a veces se omite «porque no parece hacer nada»."
      - texto: "Que arranque más despacio"
        porque: "Más ganancia arranca antes; el riesgo está en la potencia disipada en el cristal."
      - texto: "Que oscile en un armónico par"
        porque: "Sin filtro puede oscilar en un múltiplo impar de su fundamental, no par; y el riesgo aquí es la potencia."
    escalera:
      - "¿Cuánta potencia admite un cristal de 32 768 Hz?"
    solucion: "Sobreexcitación: el límite es de apenas 1 µW. La resistencia serie lo protege."

  - id: banco-margen
    tipo: pregunta
    titulo: "Medir el margen real"
    texto: "En el banco, ¿cómo se mide el margen de arranque de un oscilador?"
    libro: [196, 197]
    fijar: { G_l: 1.2 }
    widget:
      tipo: grafica
      x: { id: nc, min: 0, max: 60, unidad: ciclos, rotulo: "ciclos de oscilación" }
      y: { min: 0.003, max: 3, unidad: "", rotulo: "amplitud", escala: log }
      curvas:
        - { expr: "min(1, v_r*G_l^nc)", color: azul, rotulo: "arranque en disparo único" }
    opciones:
      - texto: "Bajando la alimentación hasta que deje de arrancar y comparándola con la nominal"
        bien: true
        porque: "Esa diferencia es el margen real; si es pequeña, hay que rediseñar."
      - texto: "Midiendo la amplitud final con el multímetro"
        porque: "La amplitud final la fija el control; no dice cuánto sobra para arrancar."
      - texto: "Contando cuántas veces arranca de diez"
        porque: "Eso solo mide la suerte de ese día; la alimentación mínima da un número."
    escalera:
      - "¿Qué variable puede bajar poco a poco hasta llegar al límite?"
    solucion: "Bajar la alimentación hasta que no arranque: la diferencia con la nominal es el margen."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [178, 187, 188, 190]
    ideas:
      - { titulo: "Dos cosas contradictorias.", texto: "Ganancia mayor que 1 para arrancar del ruido y exactamente 1 en régimen." }
      - { titulo: "Cuatro mecanismos.", texto: "Saturación, diodos, lámpara y AGC: cuanto más suave, menos distorsión." }
      - { titulo: "El margen.", texto: "Entre un 5 y un 20 % por encima de 1 en el peor caso." }
      - { titulo: "Si no arranca en frío.", texto: "No insista: aumente el margen." }
