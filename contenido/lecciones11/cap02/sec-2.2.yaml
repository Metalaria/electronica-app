# Lección 1.1 de la sección 2.2 «Tipos de Resistencias y sus Materiales» (cap02): composición y película de carbón,
# película metálica, bobinadas y SMD, con su tolerancia, su ruido, su potencia y sus límites.
# Formato: contenido/lecciones11/GUIA.md.
leccion: cap02/sec-2.2

libro:
  22: "El material y el método de fabricación determinan sus características"
  24: "Tienen tolerancias amplias (±5 % a ±20 %)"
  26: "Mejoran a las de composición en tolerancia (±5 %) y ruido"
  28: "Ofrecen tolerancias ajustadas (±0,1 % a ±1 %)"
  30: "Su desventaja es la inductancia parásita del bobinado"
  32: "que indican sus dimensiones en centésimas de pulgada"
  33: "SMD 0805 marcada «822»"
  34: "el ruido térmico es el mismo a igual resistencia"
  "cap02#37": "Una resistencia de 10 kΩ al 1 % está entre 9 900 y 10 100 Ω"
  "cap02#155": "las de película son malas, porque toda la energía se concentra en una capa de micras"

modelo:
  valores:
    R_0: { sim: "R", nombre: "valor nominal", unidad: Ω, valor: 10000 }
    tol: { sim: "tol", nombre: "tolerancia", unidad: "%", valor: 20 }
  calculos:
    d_R: { expr: "R_0*tol/100", sim: "ΔR", nombre: "desviación máxima", unidad: Ω }
    R_min: { expr: "R_0 - d_R", sim: "R_{mín}", nombre: "valor mínimo", unidad: Ω }
    R_max: { expr: "R_0 + d_R", sim: "R_{máx}", nombre: "valor máximo", unidad: Ω }

tarjetas:
  - id: explore-margen
    tipo: explorar
    titulo: "El margen de cada tecnología"
    texto: "Composición de carbón: ±5 % a ±20 %. Película de carbón: ±5 %. Película metálica: ±0,1 % a ±1 %. Mueva la tolerancia y mire el margen de una de 10 kΩ."
    libro: [24, 26, 28, "cap02#37"]
    widget:
      tipo: grafica
      x: { id: x, min: 7000, max: 13000, unidad: Ω, rotulo: "valor" }
      y: { min: 0, max: 1.2, unidad: "", rotulo: "posible" }
      curvas:
        - { expr: "1 - min(1, floor(abs(x - R_0)/d_R))", color: azul, rotulo: "valores posibles" }
      lectura: { valor: d_R, rotulo: "Desviación máxima, ±" }
      datos:
        - { valor: R_min, rotulo: "Desde {{R_min}}" }
        - { valor: R_max, rotulo: "Hasta {{R_max}}" }
      mandos:
        - { valor: tol, lista: [0.1, 1, 5, 20], rotulo: "Tolerancia" }

  - id: prediga-metalica
    tipo: predecir
    titulo: "Prediga"
    texto: "Una de película metálica de 10 kΩ al 1 %. ¿Entre qué valores puede estar?"
    libro: [28, "cap02#37"]
    fijar: { tol: 1 }
    widget:
      tipo: grafica
      x: { id: x, min: 7000, max: 13000, unidad: Ω, rotulo: "valor" }
      y: { min: 0, max: 1.2, unidad: "", rotulo: "posible" }
      curvas:
        - { expr: "1 - min(1, floor(abs(x - R_0)/d_R))", color: azul, rotulo: "valores posibles" }
      lectura: { valor: d_R, rotulo: "Desviación máxima, ±" }
      datos:
        - { valor: R_min, rotulo: "Desde {{R_min}}" }
        - { valor: R_max, rotulo: "Hasta {{R_max}}" }
      ocultar: true
    opciones:
      - texto: "Entre 9 900 y 10 100 Ω"
        bien: true
        porque: "El 1 % de 10 kΩ son 100 Ω, hacia arriba y hacia abajo."
      - texto: "Entre 9 000 y 11 000 Ω"
        porque: "Ese margen de 1 kΩ es el del 10 %, diez veces más ancho."
      - texto: "Entre 9 990 y 10 010 Ω"
        porque: "Ese sería el de una de precisión al 0,1 %."
    comprobar:
      - { R_min: 9900, R_max: 10100 }
      - { con: { tol: 10 }, R_min: 9000, R_max: 11000 }
      - { con: { tol: 0.1 }, R_min: 9990, R_max: 10010 }

  - id: empareje-tipos
    tipo: pregunta
    fase: "Empareje"
    titulo: "Cada tipo, su carácter"
    texto: "El material y la fabricación deciden precisión, ruido y potencia. Empareje cada tipo con lo que le caracteriza."
    libro: [22, 24, 26, 28, 30, 32]
    emparejar:
      - ["Composición de carbón", "Barata y ruidosa; aguanta picos breves"]
      - ["Película de carbón", "La de uso general, ±5 %"]
      - ["Película metálica", "Precisión, estabilidad y muy poco ruido"]
      - ["Bobinada", "Mucha potencia, con inductancia parásita"]
      - ["SMD", "Sin patillas, para montaje automatizado"]
    exito: "Eso es. Conocer los tipos permite elegir la adecuada para cada aplicación."
    pistas:
      - { texto: "La de hilo enrollado es la de potencia; la de níquel-cromo, la de precisión." }

  - id: ordene-tolerancia
    tipo: pregunta
    fase: "Ordene"
    titulo: "De la más amplia a la más ajustada"
    texto: "Ordene las tres tecnologías por su tolerancia, de la más amplia a la más ajustada."
    libro: [24, 26, 28]
    ordenar:
      - "Composición de carbón: ±5 % a ±20 %"
      - "Película de carbón: ±5 %"
      - "Película metálica: ±0,1 % a ±1 %"
    exito: "Ese es el orden: la película metálica es la elección estándar en precisión."
    pistas:
      - { texto: "La más antigua y económica es la de tolerancia más amplia." }

  - id: preamplificador
    tipo: pregunta
    titulo: "La entrada de un preamplificador"
    texto: "La etapa de entrada de un preamplificador de audio de bajo ruido. ¿Qué resistencia pone?"
    libro: [28, 34]
    opciones:
      - texto: "De película metálica"
        bien: true
        porque: "Genera mucho menos ruido de exceso que las de carbón: es obligatoria en entradas de bajo ruido."
      - texto: "De composición de carbón"
        porque: "Es la más ruidosa: en esa entrada se oiría como un siseo."
      - texto: "Bobinada"
        porque: "Es para potencia; su inductancia no aporta nada en una entrada de señal."

  - id: por-que-ruido
    tipo: porque
    titulo: "¿Menos ruido térmico?"
    texto: "Se oye a menudo que la película metálica tiene menos ruido térmico que el carbón. ¿Qué dice el libro?"
    libro: [34]
    opciones:
      - texto: "El térmico es el mismo; tiene menos ruido de exceso, el 1/f"
        bien: true
        porque: "A igual resistencia el ruido térmico es el mismo. La diferencia está en el de exceso, que depende de la tecnología."
      - texto: "Es cierto: la película metálica genera menos ruido térmico"
        porque: "Es el error que el libro corrige: el térmico solo depende de la resistencia, no del material."
      - texto: "Las dos hacen el mismo ruido de todo tipo"
        porque: "El de exceso, que depende de la corriente y la tecnología, es mucho menor en la película metálica."

  - id: bobinada-frecuencia
    tipo: pregunta
    titulo: "Bobinadas en alta frecuencia"
    texto: "Las bobinadas soportan de 1 W a varios kW y son muy estables. ¿Por qué no sirven en alta frecuencia?"
    libro: [30]
    opciones:
      - texto: "Por la inductancia parásita del bobinado"
        bien: true
        porque: "El hilo está enrollado: es una bobina, y su inductancia pesa al subir la frecuencia."
      - texto: "Porque se calientan demasiado"
        porque: "Al contrario: son las de más potencia. El problema en frecuencia es la inductancia."
      - texto: "Porque su tolerancia es amplia"
        porque: "Tienen excelente estabilidad. Lo que las limita es la inductancia del bobinado."

  - id: pulsos
    tipo: pregunta
    titulo: "Un pico breve de potencia"
    texto: "Hay que absorber pulsos de alta energía. ¿Qué tipo aguanta bien los picos breves?"
    libro: [24, "cap02#155"]
    opciones:
      - texto: "Composición de carbón"
        bien: true
        porque: "Aunque esté en desuso, sigue en aplicaciones de alta energía pulsada: tolera bien los picos breves."
      - texto: "Película metálica"
        porque: "Las de película son malas con pulsos: toda la energía se concentra en una capa de micras."
      - texto: "SMD"
        porque: "Su ventaja es el tamaño y el montaje automatizado, no los pulsos de energía."

  - id: codigo-smd
    tipo: pregunta
    titulo: "Una SMD 0805"
    texto: "Una SMD 0805 lleva impreso «822». ¿Qué indica el código 0805?"
    libro: [32, 33]
    opciones:
      - texto: "Sus dimensiones, en centésimas de pulgada"
        bien: true
        porque: "0402, 0603, 0805 o 1206 son tamaños. El valor va impreso aparte: «822» es 8,2 kΩ."
      - texto: "Su valor en ohmios"
        porque: "El valor es lo impreso encima, «822»: 82 × 10² Ω = 8,2 kΩ."
      - texto: "Su tolerancia"
        porque: "El código de tamaño no dice nada de la tolerancia: son las dimensiones del encapsulado."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [24, 26, 28, 30, 34]
    ideas:
      - { titulo: "Carbón.", texto: "La de composición es barata y ruidosa; la de película, de uso general al ±5 %." }
      - { titulo: "Película metálica.", texto: "±0,1 % a ±1 %, estable y poco ruido de exceso: la de precisión." }
      - { titulo: "Bobinada.", texto: "Mucha potencia y estabilidad, pero su inductancia la deja fuera de la alta frecuencia." }
      - { titulo: "SMD.", texto: "Su código, como 0805, da las dimensiones en centésimas de pulgada." }
