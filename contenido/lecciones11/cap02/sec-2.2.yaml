# Lección 1.1 de la sección 2.2 «Tipos de Resistencias y sus Materiales» (cap02): composición y película de carbón,
# película metálica, bobinadas y SMD, con su tolerancia, su ruido, su potencia y sus límites.
# Formato: contenido/lecciones11/GUIA.md.
# 1.2.1 (autor121-fund, «aprender haciendo», GUIA §13): buscar la tolerancia de precisión, predecir el margen al 1 %,
# tocar en la foto la SMD y el núcleo de la de película, leer el «822»; se eligen el ruido de la película metálica y la
# bobinada en alta frecuencia. Se quitan el orden de tolerancias, el preamplificador y los pulsos (el emparejar los recoge).
leccion: cap02/sec-2.2

libro:
  22: "El material y el método de fabricación determinan sus características"
  24: "Tienen tolerancias amplias (±5 % a ±20 %)"
  26: "Mejoran a las de composición en tolerancia (±5 %) y ruido"
  28: "Ofrecen tolerancias ajustadas (±0,1 % a ±1 %)"
  30: "Su desventaja es la inductancia parásita del bobinado"
  32: "que indican sus dimensiones en centésimas de pulgada"
  33: "SMD 0805 marcada «822»"
  34: "el ruido térmico es el mismo a igual resistencia"
  "cap02#37": "Una resistencia de 10 kΩ al 1 % está entre 9 900 y 10 100 Ω"
  "cap02#196": "las pequeñas se vuelven inductivas y las grandes capacitivas"

modelo:
  valores:
    R_0: { sim: "R", nombre: "valor nominal", unidad: Ω, valor: 10000 }
    tol: { sim: "tol", nombre: "tolerancia", unidad: "%", valor: 20 }
    m_s: { sim: "multiplicador", nombre: "tercera cifra del código", unidad: "", valor: 2 }
  calculos:
    d_R: { expr: "R_0*tol/100", sim: "ΔR", nombre: "desviación máxima", unidad: Ω }
    R_min: { expr: "R_0 - d_R", sim: "R_{mín}", nombre: "valor mínimo", unidad: Ω }
    R_max: { expr: "R_0 + d_R", sim: "R_{máx}", nombre: "valor máximo", unidad: Ω }
    R_smd: { expr: "82*10^m_s", sim: "R", nombre: "valor del código «822»", unidad: Ω }

tarjetas:
  - id: explore-margen
    tipo: explorar
    titulo: "El margen de cada tecnología"
    texto: "Composición de carbón, ±5 % a ±20 %; película de carbón, ±5 %; película metálica, ±0,1 % a ±1 %. Busque la que deja una de 10 kΩ a menos de 10 Ω de su valor."
    libro: [24, 26, 28, "cap02#37"]
    inicio: { tol: 20 }
    widget:
      tipo: grafica
      x: { id: x, min: 7000, max: 13000, unidad: Ω, rotulo: "valor" }
      y: { min: 0, max: 1.2, unidad: "", rotulo: "posible" }
      curvas:
        - { expr: "1 - min(1, floor(abs(x - R_0)/d_R))", color: azul, rotulo: "valores posibles" }
      lectura: { valor: d_R, rotulo: "Desviación máxima, ±" }
      datos:
        - { valor: R_min, rotulo: "Desde {{R_min}}" }
        - { valor: R_max, rotulo: "Hasta {{R_max}}" }
      mandos:
        - { valor: tol, lista: [0.1, 1, 5, 20], rotulo: "Tolerancia" }
    objetivo:
      condiciones:
        - { valor: d_R, max: 10, rotulo: "Margen: ± {{d_R}}" }
      logrado: "Con el {{tol}}, entre {{R_min}} y {{R_max}}: la película metálica de precisión."
      pistas:
        - { texto: "Todavía es ancho: baje la tolerancia." }
    escalera:
      - "El margen es la tolerancia por el valor."
    solucion: "El 0,1 %: ± 10 Ω."
    comprobar:
      - { d_R: 2000 }
      - { con: { tol: 0.1 }, d_R: 10, R_min: 9990, R_max: 10010 }
  - id: prediga-metalica
    tipo: simular
    titulo: "Prediga el margen"
    texto: "Una de película metálica de 10 kΩ al 1 %. ¿Cuál es el valor más bajo que puede tener?"
    libro: [28, "cap02#37"]
    fijar: { tol: 1 }
    widget:
      tipo: grafica
      x: { id: x, min: 7000, max: 13000, unidad: Ω, rotulo: "valor" }
      y: { min: 0, max: 1.2, unidad: "", rotulo: "posible" }
      curvas:
        - { expr: "1 - min(1, floor(abs(x - R_0)/d_R))", color: azul, rotulo: "valores posibles" }
      lectura: { valor: d_R, rotulo: "Desviación máxima, ±" }
      datos:
        - { valor: R_min, rotulo: "Desde {{R_min}}" }
        - { valor: R_max, rotulo: "Hasta {{R_max}}" }
      ocultar: curvas
    simular:
      objetivo: R_min
      unidad: Ω
      tol: 0.002
      rotulo: "Valor mínimo"
      errores:
        - { razon: { min: 0.905, max: 0.915 }, texto: "Ese margen de 1 kΩ es el del 10 %, diez veces más ancho." }
        - { razon: { min: 1.0085, max: 1.0095 }, texto: "Ese sería el de una de precisión al 0,1 %." }
    exito: "El 1 % de 10 kΩ son 100 Ω, hacia arriba y hacia abajo: entre 9 900 y 10 100 Ω."
    escalera:
      - "Calcule el 1 % de 10 kΩ y réstelo."
    solucion: "10 000 − 100 = 9 900 Ω."
    comprobar:
      - { R_min: 9900, R_max: 10100 }
      - { con: { tol: 10 }, R_min: 9000, R_max: 11000 }
      - { con: { tol: 0.1 }, R_min: 9990, R_max: 10010 }
  - id: empareje-tipos
    tipo: pregunta
    fase: "Empareje"
    titulo: "Cada tipo, su carácter"
    texto: "El material y la fabricación deciden precisión, ruido y potencia. Empareje cada tipo con lo que le caracteriza."
    libro: [22, 24, 26, 28, 30, 32]
    emparejar:
      - ["Composición de carbón", "Barata y ruidosa; aguanta picos breves"]
      - ["Película de carbón", "La de uso general, ±5 %"]
      - ["Película metálica", "Precisión, estabilidad y muy poco ruido"]
      - ["Bobinada", "Mucha potencia, con inductancia parásita"]
      - ["SMD", "Sin patillas, para montaje automatizado"]
    exito: "Eso es. Conocer los tipos permite elegir la adecuada para cada aplicación."
    pistas:
      - { texto: "La de hilo enrollado es la de potencia; la de níquel-cromo, la de precisión." }
    escalera:
      - "Piense en la construcción: un hilo enrollado aguanta potencia; una película fina da precisión."
    solucion: "Composición de carbón: barata y ruidosa; aguanta picos breves. Película de carbón: la de uso general, ±5 %. Película metálica: precisión, estabilidad y muy poco ruido. Bobinada: mucha potencia, con inductancia parásita. SMD: sin patillas, para montaje automatizado."

  - id: por-que-ruido
    tipo: porque
    titulo: "¿Menos ruido térmico?"
    texto: "Se oye a menudo que la película metálica tiene menos ruido térmico que el carbón. ¿Qué dice el libro?"
    libro: [34]
    opciones:
      - texto: "El térmico es el mismo; tiene menos ruido de exceso, el 1/f"
        bien: true
        porque: "A igual resistencia el ruido térmico es el mismo. La diferencia está en el de exceso, que depende de la tecnología."
      - texto: "Es cierto: la película metálica genera menos ruido térmico"
        porque: "Es el error que el libro corrige: el térmico solo depende de la resistencia, no del material."
      - texto: "Las dos hacen el mismo ruido de todo tipo"
        porque: "El de exceso, que depende de la corriente y la tecnología, es mucho menor en la película metálica."
    widget:
      tipo: figura
      figura: fig-2.4
      zonas:
        - { id: ruido, rotulo: "Ruido térmico y ruido de exceso", rect: [0, 0, 440, 193] }
    escalera:
      - "¿De qué depende el ruido térmico de una resistencia?"
    solucion: "A igual resistencia el térmico es el mismo; la película metálica tiene menos ruido de exceso, el 1/f."

  - id: bobinada-frecuencia
    tipo: tocar
    titulo: "Bobinadas en alta frecuencia"
    texto: "Una bobinada es un hilo enrollado: una bobina. En esta gráfica de tres resistencias, toque la que se vuelve inductiva al subir la frecuencia, como ella."
    libro: [30, "cap02#196"]
    widget:
      tipo: figura
      figura: fig-2.12
      zonas:
        - { id: r1, rotulo: "La curva de abajo", rect: [50, 146, 190, 40] }
        - { id: r1k, rotulo: "La curva del medio", rect: [50, 76, 190, 40] }
        - { id: r1m, rotulo: "La curva de arriba", rect: [50, 4, 120, 40] }
    tocar:
      bien: [r1]
      porque:
        r1k: "La de 1 kΩ aguanta hasta cientos de megahercios, y entonces manda su capacidad: baja."
        r1m: "La de 1 MΩ se vuelve capacitiva: su impedancia baja desde medio megahercio."
    exito: "La de 1 Ω: su impedancia sube con la frecuencia, como la de una bobina. Por eso la bobinada no sirve en alta frecuencia."
    escalera:
      - "La impedancia de una bobina sube con la frecuencia."
    solucion: "La curva de abajo, la de 1 Ω."
  - id: toque-smd
    tipo: tocar
    titulo: "Sin patillas"
    texto: "Toque la resistencia que se monta sin patillas, para montaje automatizado."
    libro: [32, 33]
    widget:
      tipo: figura
      figura: fig-2.3
      zonas:
        - { id: a, rotulo: "Las seis de la izquierda", rect: [0, 0, 515, 360] }
        - { id: b, rotulo: "La del centro", rect: [547, 0, 540, 360] }
        - { id: c, rotulo: "La de la derecha", rect: [1118, 0, 482, 360] }
    tocar:
      bien: [b]
      porque:
        a: "Son axiales, de película de carbono, con sus patillas y su código de colores."
        c: "Es el corte de una axial de película: se ven sus terminales a los lados."
    exito: "La SMD: su código, 0805, da las dimensiones en centésimas de pulgada."
    escalera:
      - "Busque la que no tiene hilos."
    solucion: "La del centro, una SMD 0805."

  - id: codigo-smd
    tipo: simular
    titulo: "Una SMD 0805"
    texto: "La SMD 0805 lleva impreso «822»: dos cifras y un multiplicador. ¿Qué valor tiene?"
    libro: [32, 33]
    fijar: { m_s: 2 }
    widget:
      tipo: figura
      figura: fig-2.3
      zonas:
        - { id: smd, rotulo: "La foto del centro", rect: [547, 0, 540, 360] }
    simular:
      objetivo: R_smd
      unidad: Ω
      tol: 0.01
      rotulo: "Valor de la SMD"
      errores:
        - { razon: { min: 0.099, max: 0.101 }, texto: "Ha leído las tres cifras como el valor. La tercera es el multiplicador: dos ceros." }
    exito: "82 × 10² Ω = 8,2 kΩ. El 0805 no es el valor: son sus dimensiones."
    escalera:
      - "Las dos primeras cifras, 82; la tercera dice cuántos ceros añadir."
    solucion: "82 × 10² Ω = 8,2 kΩ."
    comprobar:
      - { R_smd: 8200 }

  - id: toque-nucleo
    tipo: tocar
    titulo: "Por dentro"
    texto: "La foto de la derecha es el corte de una resistencia de película. Toque el núcleo cerámico sobre el que se deposita la película."
    libro: [26, 33]
    widget:
      tipo: figura
      figura: fig-2.3
      zonas:
        - { id: casq1, rotulo: "El extremo izquierdo", rect: [1118, 0, 128, 360] }
        - { id: nucleo, rotulo: "El centro", rect: [1250, 0, 186, 360] }
        - { id: casq2, rotulo: "El extremo derecho", rect: [1440, 0, 160, 360] }
    tocar:
      bien: [nucleo]
      porque:
        casq1: "Ahí están el terminal y su casquillo, que une la película con la patilla."
        casq2: "Ahí están el casquillo y el terminal, que une la película con la patilla."
    exito: "El núcleo cerámico: la película va encima, con sus casquillos en los extremos y un recubrimiento de laca."
    escalera:
      - "El núcleo es la pieza más grande y uniforme del centro."
    solucion: "El centro: el rectángulo claro."
  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [24, 26, 28, 30, 34]
    ideas:
      - { titulo: "Carbón.", texto: "La de composición es barata y ruidosa; la de película, de uso general al ±5 %." }
      - { titulo: "Película metálica.", texto: "±0,1 % a ±1 %, estable y poco ruido de exceso: la de precisión." }
      - { titulo: "Bobinada.", texto: "Mucha potencia y estabilidad, pero su inductancia la deja fuera de la alta frecuencia." }
      - { titulo: "SMD.", texto: "Su código, como 0805, da las dimensiones en centésimas de pulgada." }
