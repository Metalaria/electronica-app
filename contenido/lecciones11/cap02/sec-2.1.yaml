# Lección 1.1 de la sección 2.1 «Naturaleza Física de la Resistencia» (cap02): la geometría R = ρ·L/A, los
# materiales, la resistencia por cuadro, el efecto Joule (el cuadrado de la corriente), la temperatura y la
# superconductividad. Formato: contenido/lecciones11/GUIA.md.
leccion: cap02/sec-2.1

libro:
  4: "chocan continuamente con la red cristalina"
  5: "toda resistencia por la que circula corriente está calentándose"
  6: "Doblar la corriente cuadruplica el calor"
  8: 'R = ρ dot.op (L)/(A)'
  9: "Un hilo el doble de largo tiene el doble de resistencia"
  10: "1 m de hilo de 0,5 mm²"
  11: "nicromo (un material 64 veces más resistivo)"
  12: "son 100 cuadros, es decir, 49 mΩ"
  14: "para el cobre vale +3 900 ppm/°C"
  15: "En un semiconductor ocurre lo contrario"
  17: "no una resistencia muy pequeña, sino exactamente cero"
  19: "El componente que se compra no es una resistencia pura"

modelo:
  valores:
    rho: { sim: "ρ", nombre: "resistividad del material", unidad: "Ω·m", valor: 1.72e-8 }
    L: { sim: "L", nombre: "longitud del hilo", unidad: m, valor: 1 }
    A: { sim: "A", nombre: "sección del hilo", unidad: "mm²", valor: 0.5 }
    k_i: { sim: "I/I₀", nombre: "corriente, en veces la inicial", unidad: "veces", valor: 1 }
    dT: { sim: "ΔT", nombre: "calentamiento", unidad: "°C", valor: 0 }
    R_sq: { sim: "R_{□}", nombre: "resistencia por cuadro del cobre de 35 µm", unidad: Ω, valor: 0.000491 }
    ancho: { sim: "ancho", nombre: "ancho de la pista", unidad: m, valor: 0.0005 }
    largo: { sim: "largo", nombre: "largo de la pista", unidad: m, valor: 0.05 }
  calculos:
    A_m: { expr: "A*1e-6", sim: "A", nombre: "sección en metros cuadrados", unidad: "m²" }
    R: { expr: "rho*L/A_m", sim: "R", nombre: "resistencia del hilo", unidad: Ω }
    p_rel: { expr: "k_i^2", sim: "P/P₀", nombre: "calor, en veces el inicial", unidad: "veces", cifras: 3 }
    sube: { expr: "0.39*dT", sim: "ΔR/R", nombre: "aumento de la resistencia del cobre", unidad: "%", cifras: 3 }
    r_rel: { expr: "1 + 0.0039*dT", sim: "R/R₀", nombre: "resistencia, en veces la de partida", unidad: "veces", cifras: 3 }
    cuadros: { expr: "largo/ancho", sim: "cuadros", nombre: "cuadros que caben en la pista", unidad: "", cifras: 3 }
    R_pista: { expr: "R_sq*cuadros", sim: "R_{pista}", nombre: "resistencia de la pista", unidad: Ω }

tarjetas:
  - id: explore-hilo
    tipo: explorar
    titulo: "Un hilo de cobre"
    texto: "Alargue el hilo y cambie su sección. Fíjese en cómo responde la resistencia a cada una."
    nota: "La resistividad ρ es del material; la longitud y la sección, de la geometría."
    libro: [9, 10]
    widget:
      tipo: grafica
      x: { id: x, min: 0, max: 2, unidad: m, rotulo: "longitud" }
      y: { min: 0, max: 0.15, unidad: Ω, rotulo: "R" }
      curvas:
        - { expr: "rho*x/A_m", color: naranja, rotulo: "R del hilo" }
      asas:
        - { mueve: L, x: "L", y: "R", rotulo: "Longitud del hilo" }
      lectura: { valor: R, rotulo: "Resistencia del hilo" }
      mandos:
        - { valor: L, min: 0.2, max: 2, paso: 0.1, rotulo: "Longitud, L" }
        - { valor: A, lista: [0.25, 0.5, 1], rotulo: "Sección, A" }
    requiere: { mover: [L, A] }

  - id: prediga-doble
    tipo: predecir
    titulo: "Prediga"
    texto: "1 m de cobre de 0,5 mm² tiene 34,4 mΩ. ¿Cuánto tendrá un hilo igual de 2 m?"
    libro: [9, 10]
    fijar: { rho: 1.72e-8, L: 2, A: 0.5 }
    widget:
      tipo: grafica
      x: { id: x, min: 0, max: 2, unidad: m, rotulo: "longitud" }
      y: { min: 0, max: 0.15, unidad: Ω, rotulo: "R" }
      curvas:
        - { expr: "rho*x/A_m", color: naranja, rotulo: "R del hilo" }
      lectura: { valor: R, rotulo: "Resistencia del hilo" }
      ocultar: true
    opciones:
      - texto: "68,8 mΩ"
        bien: true
        porque: "El doble de largo, el doble de resistencia: 2 × 34,4 mΩ."
      - texto: "17,2 mΩ"
        porque: "Eso pasaría al doblar la sección, no la longitud: más sección, menos resistencia."
      - texto: "137,6 mΩ"
        porque: "La resistencia crece en proporción a la longitud, no con su cuadrado."
    comprobar:
      - { R: 0.0688 }
      - { con: { L: 1 }, R: 0.0344 }
      - { con: { L: 1, A: 1 }, R: 0.0172 }
      - { con: { L: 4 }, R: 0.1376 }
    escalera:
      - "R = ρ·L/A: ¿qué le pasa a R si L se dobla?"
    solucion: "El doble de largo, el doble de resistencia: 2 × 34,4 mΩ = 68,8 mΩ."

  - id: regla-geometria
    tipo: formula
    titulo: "La ecuación de la geometría"
    texto: "La resistencia crece con la longitud y baja con la sección. De sección doble, la mitad."
    libro: [8, 9]
    ec: 8
    sustitucion: "{{rho}} · {{L}} / {{A_m}} = {{R}}"
    widget:
      tipo: grafica
      x: { id: x, min: 0, max: 2, unidad: m, rotulo: "longitud" }
      y: { min: 0, max: 0.15, unidad: Ω, rotulo: "R" }
      curvas:
        - { expr: "rho*x/A_m", color: naranja, rotulo: "R del hilo" }
      asas:
        - { mueve: L, x: "L", y: "R", rotulo: "Longitud del hilo" }
      lectura: { valor: R, rotulo: "Resistencia del hilo" }
      mandos:
        - { valor: L, min: 0.2, max: 2, paso: 0.1, rotulo: "Longitud, L" }
        - { valor: A, lista: [0.25, 0.5, 1], rotulo: "Sección, A" }

  - id: estime-nicromo
    tipo: pregunta
    fase: "Estime"
    titulo: "Otro material"
    texto: "1 m de cobre de 0,5 mm² tiene 34,4 mΩ, y el nicromo es 64 veces más resistivo. Estime la resistencia de 1 m de nicromo de 0,5 mm²."
    libro: [10, 11]
    fijar: { rho: 1.1e-6, L: 1, A: 0.5 }
    estimar:
      objetivo: "R"
      unidad: Ω
      min: 0
      max: 5
      paso: 0.1
      inicio: 0.5
      tol: 0.05
      rotulo: "R de 1 m de nicromo"
    exito: "2,2 Ω: 64 veces los 34,4 mΩ del cobre. Por eso el nicromo se usa en calefactores y resistencias de hilo."
    pistas:
      - { cuando: { valor: estimacion, menor: 2.09 }, texto: "Se ha quedado corto: multiplique por 64 los 34,4 mΩ del cobre." }
      - { texto: "Se ha pasado: son 64 veces 34,4 mΩ, algo más de dos ohmios." }
    comprobar:
      - { R: 2.2 }
    escalera:
      - "Mismo hilo, otro material: R va en proporción a ρ."
    solucion: "2,2 Ω: 64 veces los 34,4 mΩ del cobre. Por eso el nicromo se usa en calefactores y resistencias de hilo."

  - id: empareje-materiales
    tipo: pregunta
    fase: "Empareje"
    titulo: "Cada material, su uso"
    texto: "La resistividad explica para qué sirve cada material. Empareje cada uno con su uso."
    libro: [11, 15]
    emparejar:
      - ["Cobre", "Conducir"]
      - ["Nicromo", "Calefactores y resistencias de hilo"]
      - ["Carbono", "Resistencias de valor alto"]
      - ["Manganina o constantán", "Patrones y shunts: coeficiente casi nulo"]
    exito: "Eso es. Las aleaciones para resistencias compensan efectos y casi no cambian con la temperatura."
    pistas:
      - { texto: "El más resistivo de la tabla da los valores altos; el menos resistivo, los cables." }
    escalera:
      - "Relacione resistividad y uso: mucha para calentar, poca para conducir."
    solucion: "Cobre: conducir. Nicromo: calefactores y resistencias de hilo. Carbono: resistencias de valor alto. Manganina o constantán: patrones y shunts: coeficiente casi nulo."

  - id: estime-pista
    tipo: pregunta
    fase: "Estime"
    titulo: "Contar cuadros"
    texto: "En una lámina, un cuadrado tiene la misma resistencia sea del tamaño que sea: 0,491 mΩ en el cobre de una placa. Estime una pista de 0,5 mm × 5 cm."
    libro: [12]
    estimar:
      objetivo: "R_pista"
      unidad: Ω
      min: 0
      max: 0.1
      paso: 0.001
      inicio: 0.08
      tol: 0.05
      rotulo: "R de la pista"
    exito: "Caben 100 cuadros: 100 × 0,491 mΩ, unos 49 mΩ. Así se dimensionan las pistas."
    pistas:
      - { cuando: { valor: estimacion, mayor: 0.0516 }, texto: "Se ha pasado: cuente cuántos anchos de 0,5 mm caben en 5 cm." }
      - { texto: "Se ha quedado corto: caben 100 cuadros de 0,491 mΩ cada uno." }
    comprobar:
      - { cuadros: 100, R_pista: 0.0491 }
    escalera:
      - "Cuente los cuadros: el largo de la pista entre su ancho."
    solucion: "Caben 100 cuadros: 100 × 0,491 mΩ, unos 49 mΩ. Así se dimensionan las pistas."

  - id: prediga-joule
    tipo: predecir
    titulo: "Prediga: el calor"
    texto: "Toda resistencia con corriente se calienta: P = I²·R. Si se dobla la corriente, ¿cuánto calor da?"
    libro: [5, 6]
    fijar: { k_i: 2 }
    widget:
      tipo: grafica
      x: { id: x, min: 0, max: 3, unidad: "veces", rotulo: "I/I₀" }
      y: { min: 0, max: 9, unidad: "veces", rotulo: "P/P₀" }
      curvas:
        - { expr: "x^2", color: naranja, rotulo: "calor" }
      lectura: { valor: p_rel, rotulo: "Calor, en veces el inicial" }
      ocultar: true
    opciones:
      - texto: "El cuádruple"
        bien: true
        porque: "Doblar la corriente cuadruplica el calor: el cuadrado es lo que importa."
      - texto: "El doble"
        porque: "Sería así si P creciera con I. Crece con I², y 2² = 4."
      - texto: "Lo mismo"
        porque: "La resistencia no cambia, pero el calor depende de la corriente, y al cuadrado."
    comprobar:
      - { p_rel: 4 }
    escalera:
      - "P = I²·R: ¿qué hace el cuadrado con un factor 2?"
    solucion: "2² = 4: doblar la corriente cuadruplica el calor."

  - id: por-que-alta-tension
    tipo: porque
    titulo: "¿Por qué alta tensión?"
    texto: "La energía eléctrica se transporta a alta tensión y poca corriente. ¿Por qué?"
    libro: [6]
    widget:
      tipo: grafica
      x: { id: x, min: 0, max: 3, unidad: "veces", rotulo: "I/I₀" }
      y: { min: 0, max: 9, unidad: "veces", rotulo: "P/P₀" }
      curvas:
        - { expr: "x^2", color: naranja, rotulo: "pérdidas en el cable" }
      asas:
        - { mueve: k_i, x: "k_i", y: "p_rel", rotulo: "Corriente por el cable" }
      lectura: { valor: p_rel, rotulo: "Pérdidas, en veces las iniciales" }
      mandos:
        - { valor: k_i, min: 0.5, max: 3, paso: 0.5, rotulo: "Corriente, I/I₀" }
    opciones:
      - texto: "Las pérdidas del cable crecen con el cuadrado de la corriente"
        bien: true
        porque: "Con P = I²·R, bajar la corriente baja las pérdidas mucho más deprisa que en proporción."
      - texto: "A alta tensión el cable tiene menos resistencia"
        porque: "La resistencia del cable es su geometría y su material; no depende de la tensión."
      - texto: "La alta tensión no calienta"
        porque: "Lo que calienta un cable es la corriente que lo recorre, y al cuadrado."
    escalera:
      - "Las pérdidas del cable son I²·R."
    solucion: "Bajar la corriente baja las pérdidas con su cuadrado: por eso se sube la tensión."

  - id: prediga-cobre-caliente
    tipo: predecir
    titulo: "Prediga: el cobre caliente"
    texto: "Al calentar un metal hay más choques con la red, y el cobre tiene +3 900 ppm/°C. ¿Cuánto sube su resistencia con 100 °C más?"
    libro: [4, 14]
    fijar: { dT: 100 }
    widget:
      tipo: grafica
      x: { id: x, min: 0, max: 100, unidad: "°C", rotulo: "ΔT" }
      y: { min: 0.9, max: 1.5, unidad: "veces", rotulo: "R/R₀" }
      curvas:
        - { expr: "1 + 0.0039*x", color: naranja, rotulo: "cobre" }
      lectura: { valor: sube, rotulo: "Aumento de la resistencia" }
      ocultar: true
    opciones:
      - texto: "Un 39 %"
        bien: true
        porque: "3 900 ppm/°C es un 0,39 % por grado: con 100 °C, un 39 %."
      - texto: "Un 3,9 %"
        porque: "Un ppm es una millonésima: 3 900 ppm son un 0,39 %, y por cien grados, un 39 %."
      - texto: "Baja un 39 %"
        porque: "Eso es lo de un semiconductor, que libera portadores al calentarse. En un metal la resistencia sube."
    comprobar:
      - { sube: 39, r_rel: 1.39 }
      - { con: { dT: 10 }, sube: 3.9 }
    escalera:
      - "Un ppm es una millonésima: 3 900 ppm son un 0,39 % por grado."
    solucion: "Un 0,39 % por grado durante 100 °C: un 39 %."

  - id: por-que-superconductor
    tipo: porque
    titulo: "Resistencia cero"
    texto: "Por debajo de una temperatura crítica, algunos materiales tienen resistencia exactamente cero. ¿Qué demuestra eso?"
    libro: [17]
    widget:
      tipo: grafica
      x: { id: x, min: 0, max: 100, unidad: "°C", rotulo: "ΔT" }
      y: { min: 0.9, max: 1.5, unidad: "veces", rotulo: "R/R₀" }
      curvas:
        - { expr: "1 + 0.0039*x", color: naranja, rotulo: "cobre" }
      asas:
        - { mueve: dT, x: "dT", y: "r_rel", rotulo: "Calentamiento" }
      lectura: { valor: r_rel, rotulo: "R, en veces la de partida" }
      mandos:
        - { valor: dT, min: 0, max: 100, paso: 10, rotulo: "Calentamiento, ΔT" }
    opciones:
      - texto: "Que la resistencia sale de un mecanismo concreto que puede desaparecer"
        bien: true
        porque: "Es un fenómeno cuántico: la resistencia no es inevitable al conducir, sino fruto de la dispersión."
      - texto: "Que al enfriar un metal su resistencia tiende a cero"
        porque: "No es una extrapolación de la recta del metal: es cero exacto, por un fenómeno distinto."
      - texto: "Que los superconductores tienen una resistencia muy pequeña"
        porque: "No muy pequeña: exactamente cero, con corrientes que circulan sin fuente indefinidamente."
    escalera:
      - "¿Es «exactamente cero» lo mismo que «muy pequeña»?"
    solucion: "Que la resistencia sale de un mecanismo concreto que puede desaparecer: no es inevitable al conducir."

  - id: resistencia-real
    tipo: pregunta
    titulo: "La resistencia que se compra"
    texto: "¿Qué tiene el componente real, además de su resistencia?"
    libro: [19]
    opciones:
      - texto: "Inductancia, capacidad, coeficientes de temperatura y tensión, ruido y tolerancia"
        bien: true
        porque: "No es una resistencia pura: cada uno de esos aspectos ocupa una sección del capítulo."
      - texto: "Nada: una resistencia es solo su valor"
        porque: "Ese es el componente ideal. El real tiene parásitos, deriva, ruido y tolerancia."
      - texto: "Solo una tolerancia de fabricación"
        porque: "La tolerancia es una más. También tiene inductancia, capacidad, coeficientes y ruido propio."
    widget:
      tipo: figura
      figura: fig-2.1
      zonas:
        - { id: reales, rotulo: "Resistencias reales", rect: [0, 0, 1600, 1527] }
    escalera:
      - "Además de su valor, ¿qué hace un componente real en alta frecuencia, con el calor o con los años?"
    solucion: "Inductancia, capacidad, coeficientes de temperatura y tensión, ruido y tolerancia."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [6, 8, 12, 14, 17]
    ideas:
      - { titulo: "Geometría.", texto: "R = ρ·L/A: el doble de largo, el doble; de sección doble, la mitad." }
      - { titulo: "Calor.", texto: "P = I²·R: doblar la corriente cuadruplica el calor." }
      - { titulo: "Temperatura.", texto: "En un metal la resistencia sube al calentarse; el cobre, un 0,39 % por grado." }
      - { titulo: "Por cuadro.", texto: "En una lámina, contar cuadros da la resistencia de cualquier pista." }
