# Lección 1.1 de la sección 2.8 «Potencia Nominal, Disipación y Derating» (cap02): la curva de derating, la regla
# del 50 % (ejercicio 2.7), la tensión máxima, los pulsos, cómo se evacúa el calor y repartir la potencia.
# Formato: contenido/lecciones11/GUIA.md.
leccion: cap02/sec-2.8

libro:
  147: "el dato de catálogo suele referirse a 70 °C de ambiente"
  148: "su cuerpo puede estar a 100 °C o más. No es una avería"
  150: "Para una resistencia de 0,25 W especificada a 70 °C con máximo de 155 °C"
  151: "0,162 W"
  152: "no pasar del 50 % de la potencia nominal en las condiciones peores previstas"
  154: "lo que la destruye no es la potencia instantánea sino la energía acumulada frente a su masa térmica"
  155: "se especifica una resistencia bobinada o de óxido metálico y no una de película"
  157: "una resistencia de 10 MΩ con 250 V disipa solo 6 mW"
  158: "la solución es poner varias en serie"
  160: "casi todo el calor sale por las soldaduras hacia el cobre de la placa"
  163: "cualquier desigualdad hace que una se lleve más corriente"
  165: "por encima de 80 o 90 °C conviene revisar el cálculo"
  "cap02#342": "Por una resistencia de 220 Ω circulan 30 mA"

modelo:
  valores:
    P_n: { sim: "P_{nom}", nombre: "potencia nominal", unidad: W, valor: 0.25 }
    T_r: { sim: "T_{ref}", nombre: "temperatura de referencia", unidad: "°C", valor: 70 }
    T_m: { sim: "T_{máx}", nombre: "temperatura máxima", unidad: "°C", valor: 155 }
    T_a: { sim: "T_{amb}", nombre: "temperatura ambiente", unidad: "°C", valor: 25 }
    R_r: { sim: "R", nombre: "resistencia", unidad: Ω, valor: 220 }
    I_r: { sim: "I", nombre: "corriente", unidad: A, valor: 0.03 }
    P_nom: { sim: "P_{nom}", nombre: "potencia nominal elegida", unidad: W, valor: 0.125 }
    R_hv: { sim: "R", nombre: "resistencia de valor alto", unidad: Ω, valor: 10000000 }
    V_hv: { sim: "V", nombre: "tensión aplicada", unidad: V, valor: 250 }
    V_p: { sim: "V", nombre: "tensión sobre el paralelo", unidad: V, valor: 6.6 }
    R_pa: { sim: "R₁", nombre: "primera resistencia", unidad: Ω, valor: 220 }
    R_pb: { sim: "R₂", nombre: "segunda resistencia", unidad: Ω, valor: 220 }
  calculos:
    margen: { expr: "T_m - T_r", sim: "T_{máx} − T_{ref}", nombre: "grados de la recta de derating", unidad: "°C", cifras: 3 }
    queda: { expr: "T_m - T_a", sim: "T_{máx} − T_{amb}", nombre: "grados que faltan hasta el máximo", unidad: "°C", cifras: 3 }
    P_adm: { expr: "P_n*min(1, max(0, (T_m - T_a)/(T_m - T_r)))", sim: "P_{adm}", nombre: "potencia admisible", unidad: W, cifras: 3 }
    P_r: { expr: "I_r^2*R_r", sim: "P", nombre: "potencia disipada", unidad: W, cifras: 3 }
    uso: { expr: "P_r/P_nom*100", sim: "P/P_{nom}", nombre: "fracción de la nominal", unidad: "%", cifras: 2 }
    P_hv: { expr: "V_hv^2/R_hv", sim: "P", nombre: "potencia disipada", unidad: W, cifras: 3 }
    I_pa: { expr: "V_p/R_pa", sim: "I₁", nombre: "corriente por R₁", unidad: A }
    I_pb: { expr: "V_p/R_pb", sim: "I₂", nombre: "corriente por R₂", unidad: A }
    I_pt: { expr: "I_pa + I_pb", sim: "I", nombre: "corriente total", unidad: A }
    P_pa: { expr: "V_p^2/R_pa", sim: "P₁", nombre: "potencia en R₁", unidad: W, cifras: 3 }
    P_pb: { expr: "V_p^2/R_pb", sim: "P₂", nombre: "potencia en R₂", unidad: W, cifras: 3 }

tarjetas:
  - id: explore-derating
    tipo: explorar
    titulo: "La curva de derating"
    texto: "Una de 0,25 W especificada a 70 °C, con un máximo de 155 °C. Arrastre la temperatura ambiente y mire cuánta potencia admite."
    libro: [147, 150]
    widget:
      tipo: grafica
      x: { id: x, min: 20, max: 160, unidad: "°C", rotulo: "T_{amb}" }
      y: { min: 0, max: 0.3, unidad: W, rotulo: "P_{adm}" }
      curvas:
        - { expr: "P_n*min(1, max(0, (T_m - x)/(T_m - T_r)))", color: naranja, rotulo: "potencia admisible" }
      asas:
        - { mueve: T_a, x: "T_a", y: "P_adm", rotulo: "Temperatura ambiente" }
      lectura: { valor: P_adm, rotulo: "Potencia admisible" }
      mandos:
        - { valor: T_a, min: 20, max: 160, paso: 5, rotulo: "Temperatura ambiente" }

  - id: prediga-cien
    tipo: predecir
    titulo: "Prediga"
    texto: "Una resistencia de 0,25 W, especificada a 70 °C con máximo de 155 °C, va en una caja a 100 °C. ¿Cuánta potencia admite?"
    libro: [150, 151]
    fijar: { T_a: 100 }
    widget:
      tipo: grafica
      x: { id: x, min: 20, max: 160, unidad: "°C", rotulo: "T_{amb}" }
      y: { min: 0, max: 0.3, unidad: W, rotulo: "P_{adm}" }
      curvas:
        - { expr: "P_n*min(1, max(0, (T_m - x)/(T_m - T_r)))", color: naranja, rotulo: "potencia admisible" }
      lectura: { valor: P_adm, rotulo: "Potencia admisible" }
      ocultar: true
    opciones:
      - texto: "0,162 W"
        bien: true
        porque: "Por encima de 70 °C baja en línea recta hasta cero en 155 °C: a 100 °C quedan 55 de esos 85 grados."
      - texto: "0,25 W"
        porque: "La nominal solo vale hasta la temperatura de referencia, 70 °C. Por encima se pierde."
      - texto: "0 W"
        porque: "Llega a cero en la temperatura máxima, 155 °C. A 100 °C aún admite algo."
    comprobar:
      - { P_adm: 0.162, margen: 85, queda: 55 }
      - { con: { T_a: 155 }, P_adm: 0 }
    escalera:
      - "Por encima de 70 °C, la admisible baja en línea recta hasta cero en 155 °C."
    solucion: "A 100 °C, en ese tramo recto, admite 0,162 W."

  - id: estime-125
    tipo: pregunta
    fase: "Estime"
    titulo: "Más calor"
    texto: "Una resistencia de 0,25 W, especificada a 70 °C de ambiente, con máximo de 155 °C. Estime la potencia que admite a 125 °C."
    libro: [150, 151]
    fijar: { T_a: 125 }
    estimar:
      objetivo: "P_adm"
      unidad: W
      min: 0
      max: 0.25
      paso: 0.002
      inicio: 0.2
      tol: 0.05
      rotulo: "P a 125 °C"
    exito: "0,088 W: quedan 30 de los 85 grados. En el codo de la curva, la capacidad se pierde deprisa."
    pistas:
      - { cuando: { valor: estimacion, mayor: 0.0925 }, texto: "Se ha pasado: a 125 °C faltan solo 30 °C para el máximo de 155 °C." }
      - { texto: "Se ha quedado corto: aún quedan 30 de los 85 grados de la recta." }
    comprobar:
      - { P_adm: 0.088, margen: 85, queda: 30 }
    escalera:
      - "La admisible baja en línea recta desde 70 °C hasta cero en 155 °C."
    solucion: "0,088 W: quedan 30 de los 85 grados. En el codo de la curva, la capacidad se pierde deprisa."

  - id: reto-nominal
    tipo: reto
    titulo: "Reto: la regla del 50 %"
    texto: "Por una de 220 Ω circulan 30 mA. Elija la potencia nominal más pequeña con la que no pase del 50 %."
    libro: [152, "cap02#342"]
    inicio: { P_nom: 0.125 }
    widget:
      tipo: grafica
      x: { id: i, min: 0, max: 0.05, unidad: A, rotulo: "I" }
      y: { min: 0, max: 0.6, unidad: W, rotulo: "P" }
      curvas:
        - { expr: "R_r*i^2", color: naranja, rotulo: "P = I²·R" }
        - { expr: "0.5*P_nom", color: azul, rotulo: "50 % de la nominal", discontinua: true }
      marcas:
        - { x: "I_r", y: "P_r", rotulo: "Su resistencia" }
      lectura: { valor: P_r, rotulo: "Potencia disipada" }
      mandos:
        - { valor: P_nom, lista: [0.125, 0.25, 0.5, 1], rotulo: "Potencia nominal" }
    condiciones:
      - { valor: uso, min: 25, max: 50, rotulo: "Trabaja al {{uso}}" }
    exito: "1/2 W: disipa 0,198 W y trabaja al 40 %. Con 1/4 W estaría al 79 %."
    pistas:
      - { cuando: { valor: uso, mayor: 50 }, texto: "Pasa del 50 % de la nominal: elija una de más potencia." }
      - { cuando: { valor: uso, menor: 25 }, texto: "Cumple, pero sobra: hay una más pequeña que también queda por debajo del 50 %." }
    escalera:
      - "Calcule primero la potencia: P = I²·R."
    solucion: "P = 0,03² · 220 ≈ 0,2 W: la nominal más pequeña de la que eso sea, como mucho, la mitad es 1/2 W."
    comprobar:
      - { P_r: 0.198 }
      - { con: { P_nom: 0.5 }, uso: 39.6 }
      - { con: { P_nom: 0.25 }, uso: 79.2 }

  - id: prediga-tension
    tipo: predecir
    titulo: "El límite que se olvida"
    texto: "Una de 10 MΩ y 0,25 W soporta 250 V. ¿Qué la limita?"
    libro: [157, 158]
    widget:
      tipo: grafica
      x: { id: v, min: 0, max: 300, unidad: V, rotulo: "V" }
      y: { min: 0, max: 0.3, unidad: W, rotulo: "P" }
      curvas:
        - { expr: "v^2/R_hv", color: naranja, rotulo: "P = V²/R" }
        - { expr: "P_n", color: azul, rotulo: "nominal", discontinua: true }
      lectura: { valor: P_hv, rotulo: "Potencia disipada" }
      ocultar: true
    opciones:
      - texto: "La tensión: con solo 6 mW está en su límite"
        bien: true
        porque: "Con valores altos, el límite de tensión llega antes que el de potencia. Por encima, un arco superficial."
      - texto: "La potencia: 250 V es mucha tensión"
        porque: "Con 10 MΩ, 250 V solo disipan 6 mW, muy por debajo de la nominal."
      - texto: "Nada: le sobra potencia"
        porque: "Le sobra potencia, pero no tensión. La solución es poner varias en serie, que repartan la tensión."
    comprobar:
      - { P_hv: 0.00625 }
    escalera:
      - "Calcule la potencia, V²/R, con 250 V y 10 MΩ."
    solucion: "Disipa solo 6 mW: la limita la tensión. La solución es poner varias en serie."

  - id: sorpresa-reparto
    tipo: sorpresa
    titulo: "Repartir entre dos"
    texto: "Dos de 220 Ω en paralelo se reparten la potencia. Cambie R₂ por un valor algo distinto y mire las barras."
    libro: [163, "cap02#342"]
    inicio: { R_pb: 220 }
    widget:
      tipo: circuito
      esquema: paralelo
      piezas: { fuente: V_p, r1: R_pa, r2: R_pb }
      lectura: { valor: I_pt, rotulo: "Corriente total" }
      barras:
        - { valor: P_pa, rotulo: "R₁ disipa {{P_pa}}", color: azul }
        - { valor: P_pb, rotulo: "R₂ disipa {{P_pb}}", color: naranja }
      corriente: I_pt
      mide: { total: I_pt, i1: I_pa, i2: I_pb }
      mandos:
        - { valor: R_pb, lista: [180, 220, 270], rotulo: "R₂" }
    comprobar:
      - { P_pa: 0.198, I_pa: 0.03 }

  - id: por-que-pulsos
    tipo: porque
    titulo: "Decenas de vatios"
    texto: "Una de 0,25 W puede soportar decenas de vatios durante milisegundos. ¿Por qué?"
    libro: [154]
    opciones:
      - texto: "La destruye la energía acumulada frente a su masa térmica, no la potencia instantánea"
        bien: true
        porque: "En un tiempo breve, la energía no llega a calentarla tanto. Los fabricantes dan curvas de pulso frente a duración."
      - texto: "Porque la potencia nominal tiene un margen del 50 %"
        porque: "Ese 50 % es la regla de diseño, no un margen del catálogo. Un pulso puede ser cien veces la nominal."
      - texto: "Porque el TCR la protege"
        porque: "El TCR solo dice cuánto cambia su valor. Lo que aguanta el pulso es la masa térmica."
    widget:
      tipo: figura
      figura: fig-2.10
      zonas:
        - { id: pulso, rotulo: "Derating y potencia de pulso", rect: [0, 0, 453, 204] }
    escalera:
      - "En unos milisegundos, ¿le da tiempo a calentarse a todo el cuerpo?"
    solucion: "La destruye la energía acumulada frente a su masa térmica, no la potencia instantánea."

  - id: irrupcion
    tipo: pregunta
    titulo: "Un limitador de irrupción"
    texto: "En un limitador de irrupción o en la descarga de un condensador, la potencia media es ridícula. ¿Qué resistencia se especifica?"
    libro: [155]
    opciones:
      - texto: "Bobinada o de óxido metálico"
        bien: true
        porque: "Son excelentes con pulsos: mucha masa y sin película delgada que se evapore."
      - texto: "De película metálica"
        porque: "Las de película son malas con pulsos: toda la energía se concentra en una capa de micras."
      - texto: "Cualquiera de la potencia media"
        porque: "La potencia media no decide aquí: decide la energía del pulso frente a la masa térmica."
    widget:
      tipo: figura
      figura: fig-2.10
      zonas:
        - { id: pulso, rotulo: "Derating y potencia de pulso", rect: [0, 0, 453, 204] }
    escalera:
      - "Aquí decide la energía del pulso, no la potencia media."
    solucion: "Bobinada o de óxido metálico: mucha masa y sin película delgada que se evapore."

  - id: smd-cobre
    tipo: pregunta
    titulo: "Un chip SMD"
    texto: "¿De qué depende la potencia que admite una resistencia SMD?"
    libro: [160]
    opciones:
      - texto: "Del área de cobre a la que está soldada"
        bien: true
        porque: "Casi todo el calor sale por las soldaduras hacia el cobre. Ensanchar los pads es un recurso barato."
      - texto: "Solo de su tamaño"
        porque: "El tamaño cuenta, pero el catálogo la da para una placa de referencia: el cobre decide."
      - texto: "Del aire que la rodea"
        porque: "Eso domina en una axial, por convección. En las SMD domina la conducción por las soldaduras."
    widget:
      tipo: figura
      figura: fig-2.1
      zonas:
        - { id: reales, rotulo: "Resistencias reales, también SMD", rect: [0, 0, 1600, 1527] }
    escalera:
      - "¿Por dónde sale el calor de un chip sin patas largas?"
    solucion: "Del área de cobre a la que está soldada: casi todo el calor sale por las soldaduras hacia el cobre."

  - id: caliente
    tipo: pregunta
    titulo: "Caliente al tacto"
    texto: "Una resistencia que disipa su potencia nominal tiene el cuerpo a más de 100 °C. ¿Qué significa?"
    libro: [148, 165]
    opciones:
      - texto: "Es lo normal, pero su valor ha derivado y puede quemar lo de al lado"
        bien: true
        porque: "No es una avería. Aun así, por encima de 80 o 90 °C conviene revisar el cálculo."
      - texto: "Está averiada"
        porque: "A su potencia nominal es normal que esté así de caliente. Por eso se aplica el 50 %."
      - texto: "Que el termopar mide mal"
        porque: "El termopar apoyado en el cuerpo es la comprobación buena: dice si el dimensionado es correcto."
    widget:
      tipo: grafica
      x: { id: x, min: 20, max: 160, unidad: °C, rotulo: "T_{amb}" }
      y: { min: 0, max: 0.3, unidad: W, rotulo: "P_{adm}" }
      curvas:
        - { expr: "P_n*min(1, max(0, (T_m - x)/(T_m - T_r)))", color: naranja, rotulo: "potencia admisible" }
      asas:
        - { mueve: T_a, x: T_a, y: P_adm, rotulo: "Temperatura ambiente" }
      lectura: { valor: P_adm, rotulo: "Potencia admisible" }
      mandos:
        - { valor: T_a, min: 20, max: 160, paso: 5, rotulo: "Temperatura ambiente" }
    escalera:
      - "A su potencia nominal, ¿qué temperatura es normal en el cuerpo de una resistencia?"
    solucion: "Es lo normal y no es una avería; pero por encima de 80 o 90 °C conviene revisar el cálculo."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [150, 152, 154, 157, 163]
    ideas:
      - { titulo: "Derating.", texto: "Desde 70 °C, la potencia admisible baja en línea recta hasta cero en la temperatura máxima." }
      - { titulo: "Regla.", texto: "No pasar del 50 % de la nominal en las peores condiciones previstas." }
      - { titulo: "Tensión y pulsos.", texto: "Con valores altos manda la tensión máxima; con pulsos, la energía frente a la masa térmica." }
      - { titulo: "Repartir.", texto: "Varias iguales en paralelo o en serie, del mismo valor y a la misma temperatura." }
