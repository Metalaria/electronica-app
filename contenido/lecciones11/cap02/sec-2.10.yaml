# Lección 1.1 de la sección 2.10 «Parásitos y Comportamiento en Frecuencia» (cap02): el modelo de tres elementos
# (R con L en serie y C en paralelo, 10 nH y 0,3 pF), quién manda según el valor, las bobinadas, la película
# grabada y dónde muerde en la práctica. Formato: contenido/lecciones11/GUIA.md.
# 1.2.1 (autor121-fund, «aprender haciendo», GUIA §13): volver capacitiva una resistencia grande, marcar el codo de
# 1 MΩ, calcular la frecuencia inductiva de 100 Ω, de una bobinada y de una terminación de 50 Ω, y pasar la bobinada
# a Ayrton-Perry; solo la película grabada se elige. Quién manda, el shunt y las tres medidas quedan en los textos.
# 1.3 (contenido13b): variantes del repaso (GUIA §13.13) con valores de los mandos de la propia lección.
leccion: cap02/sec-2.10

libro:
  176: "una inductancia serie L"
  178: '"la inductancia importa a partir de" space f = (R)/("2" π dot.op L)'
  179: '"la capacidad importa a partir de" space f = ("1")/("2" π dot.op R dot.op C)'
  180: "Con los valores típicos L = 10 nH y C = 0,3 pF"
  181: "0,53 MHz"
  182: "Las resistencias pequeñas se vuelven inductivas y las grandes, capacitivas"
  184: "con 1 Ω y 20 µH, desde 8 kHz"
  185: "la mitad del hilo se arrolla en un sentido y la otra mitad en el contrario"
  186: "esa espiral es una bobina"
  188: "un pico de tensión proporcional a di/dt"
  189: "deja de terminar bien a partir de cientos de megahercios"
  193: "cada milímetro de terminal son aproximadamente 1 nH"

modelo:
  valores:
    R_p: { sim: "R", nombre: "valor de la resistencia", unidad: Ω, valor: 1000 }
    L_p: { sim: "L", nombre: "inductancia serie parásita", unidad: H, valor: 10e-9 }
    C_p: { sim: "C", nombre: "capacidad paralelo parásita", unidad: F, valor: 0.3e-12 }
    f_v: { sim: "f", nombre: "frecuencia", unidad: Hz, valor: 100000 }
    R_b: { sim: "R", nombre: "resistencia bobinada", unidad: Ω, valor: 1 }
    L_b: { sim: "L", nombre: "inductancia de la bobinada", unidad: H, valor: 20e-6 }
    R_t: { sim: "R", nombre: "resistencia de terminación", unidad: Ω, valor: 50 }
  calculos:
    w_v: { expr: "2*pi*f_v", sim: "ω", nombre: "frecuencia angular", unidad: "rad/s" }
    Z_m: { expr: "sqrt(R_p^2 + (w_v*L_p)^2)/sqrt((1 - w_v^2*L_p*C_p)^2 + (w_v*R_p*C_p)^2)", sim: "|Z|", nombre: "módulo de la impedancia", unidad: Ω }
    z_rel: { expr: "Z_m/R_p", sim: "|Z|/R", nombre: "impedancia en veces el valor nominal", unidad: "", cifras: 3 }
    f_L: { expr: "R_p/(2*pi*L_p)", sim: "f_{L}", nombre: "frecuencia desde la que importa la inductancia", unidad: Hz }
    f_C: { expr: "1/(2*pi*R_p*C_p)", sim: "f_{C}", nombre: "frecuencia desde la que importa la capacidad", unidad: Hz }
    f_Lb: { expr: "R_b/(2*pi*L_b)", sim: "f_{L}", nombre: "frecuencia desde la que la bobinada es inductiva", unidad: Hz }
    f_Lt: { expr: "R_t/(2*pi*L_p)", sim: "f_{L}", nombre: "frecuencia desde la que la terminación es inductiva", unidad: Hz }

tarjetas:
  - id: explore-parasitos
    tipo: explorar
    titulo: "Tres elementos"
    texto: "En alta frecuencia, una resistencia lleva 10 nH en serie y 0,3 pF en paralelo. Busque un valor y una frecuencia con los que su impedancia baje de la mitad de R."
    libro: [176, 180, 182]
    inicio: { R_p: 1000, f_v: 100000 }
    widget:
      tipo: grafica
      x: { id: nu, min: 10000, max: 10000000000, unidad: Hz, rotulo: "f", escala: log }
      y: { min: 0.001, max: 100, unidad: "", rotulo: "|Z|/R", escala: log }
      curvas:
        - { expr: "sqrt(R_p^2 + (2*pi*nu*L_p)^2)/sqrt((1 - (2*pi*nu)^2*L_p*C_p)^2 + (2*pi*nu*R_p*C_p)^2)/R_p", color: naranja, rotulo: "|Z|/R" }
      asas:
        - { mueve: f_v, x: "f_v", y: "z_rel", rotulo: "Frecuencia" }
      lectura: { valor: Z_m, rotulo: "Impedancia" }
      datos:
        - { valor: f_L, rotulo: "Inductancia desde {{f_L}}" }
        - { valor: f_C, rotulo: "Capacidad desde {{f_C}}" }
      mandos:
        - { valor: R_p, lista: [100, 1000, 1000000], rotulo: "Valor, R" }
        - { valor: f_v, lista: [10000, 100000, 1000000, 10000000, 100000000, 1000000000, 10000000000], rotulo: "Frecuencia, f" }
    objetivo:
      condiciones:
        - { valor: z_rel, max: 0.5, rotulo: "|Z|/R: {{z_rel}}" }
      logrado: "{{R_p}} a {{f_v}}: {{Z_m}}. Las grandes se vuelven capacitivas; las pequeñas, inductivas."
      pistas:
        - { texto: "Pruebe con la de valor más alto y suba la frecuencia: ahí manda la capacidad." }
    escalera:
      - "La capacidad importa antes cuanto mayor es R."
    solucion: "1 MΩ desde 1 MHz."
    comprobar:
      - { con: { R_p: 1000000, f_v: 1000000 }, z_rel: 0.469, tol: 0.01 }

  - id: prediga-megaohmio
    tipo: marcar
    titulo: "El codo de 1 MΩ"
    texto: "Una resistencia de 1 MΩ con 0,3 pF parásitos. Marque en la curva la frecuencia desde la que deja de comportarse como resistencia."
    libro: [181, 182]
    fijar: { R_p: 1000000 }
    widget:
      tipo: grafica
      x: { id: nu, min: 10000, max: 10000000000, unidad: Hz, rotulo: "f", escala: log }
      y: { min: 0.001, max: 100, unidad: "", rotulo: "|Z|/R", escala: log }
      curvas:
        - { expr: "sqrt(R_p^2 + (2*pi*nu*L_p)^2)/sqrt((1 - (2*pi*nu)^2*L_p*C_p)^2 + (2*pi*nu*R_p*C_p)^2)/R_p", color: naranja, rotulo: "|Z|/R" }
      mandos: []
    marcar:
      modo: x
      curva: 0
      x: "f_C"
      tol: 0.04
      inicio: { x: 1000000000, y: 1 }
      rotulo: "Desde aquí, capacitiva"
    pistas:
      - { cuando: { valor: marca_x, mayor: 530000 }, texto: "Más a la izquierda: busque dónde la curva deja de valer 1 y empieza a caer." }
      - { texto: "Más a la derecha: ahí todavía vale 1, es una resistencia." }
    exito: "0,53 MHz, sorprendentemente baja: en la entrada de un amplificador de alta impedancia, esos 0,3 pF ya forman un filtro."
    escalera:
      - "La capacidad importa desde f = 1/(2π·R·C): ¿qué hace una R grande?"
    solucion: "Hacia 0,53 MHz: medio megahercio."
    comprobar:
      - { f_C: 530000, tol: 0.01 }
  - id: regla-capacidad
    tipo: formula
    titulo: "Cuándo importa la capacidad"
    texto: "La capacidad en paralelo manda antes cuanto mayor es la resistencia."
    nota: "Y la inductancia, desde f = R/(2π·L): antes cuanto menor es R."
    libro: [178, 179]
    ec: 179
    sustitucion: "1 / (2π · {{R_p}} · {{C_p}}) = {{f_C}}"
    widget:
      tipo: grafica
      x: { id: nu, min: 10000, max: 10000000000, unidad: Hz, rotulo: "f", escala: log }
      y: { min: 0.001, max: 100, unidad: "", rotulo: "|Z|/R", escala: log }
      curvas:
        - { expr: "sqrt(R_p^2 + (2*pi*nu*L_p)^2)/sqrt((1 - (2*pi*nu)^2*L_p*C_p)^2 + (2*pi*nu*R_p*C_p)^2)/R_p", color: naranja, rotulo: "|Z|/R" }
      lectura: { valor: f_C, rotulo: "La capacidad importa desde" }
      datos:
        - { valor: f_L, rotulo: "Inductancia desde {{f_L}}" }
      mandos:
        - { valor: R_p, lista: [100, 1000, 1000000], rotulo: "Valor, R" }

  - id: estime-cien
    tipo: simular
    fase: "Estime"
    titulo: "Una pequeña"
    texto: "Con 100 Ω y 10 nH, ¿desde qué frecuencia importa la inductancia? Use f = R/(2π·L)."
    libro: [178, 181]
    fijar: { R_p: 100 }
    simular:
      objetivo: f_L
      unidad: Hz
      tol: 0.05
      rotulo: "f_{L} con 100 Ω"
      errores:
        - { razon: { min: 6.1, max: 6.4 }, texto: "Ha olvidado el 2π: R/L es la frecuencia angular, en rad/s." }
    exito: "1,6 GHz. Y la capacidad, hasta 5,3 GHz: las resistencias pequeñas se vuelven inductivas."
    pistas:
      - { cuando: { valor: estimacion, mayor: 1670000000 }, texto: "Se ha pasado: 100 / (2π · 10 nH) es algo más de mil megahercios." }
      - { texto: "Se ha quedado corto: 100 / (2π · 10 nH) supera el gigahercio." }
    escalera:
      - "Sustituya 100 Ω y 10 nH en f = R/(2π·L)."
    solucion: "100 / (2π · 10 nH) = 1,6 GHz."
    comprobar:
      - { f_L: 1.59e9, tol: 0.01 }
  - id: estime-bobinada
    tipo: simular
    fase: "Estime"
    titulo: "Una bobinada"
    texto: "Una bobinada es literalmente una bobina. Con 1 Ω y 20 µH, ¿desde qué frecuencia deja de ser resistiva?"
    libro: [184, 188]
    fijar: { L_b: 20e-6 }
    simular:
      objetivo: f_Lb
      unidad: Hz
      tol: 0.07
      rotulo: "f_{L} de la bobinada"
      errores:
        - { razon: { min: 6.1, max: 6.4 }, texto: "Ha olvidado el 2π: R/L es la frecuencia angular, en rad/s." }
    exito: "Unos 8 kHz: excelentes para potencia y continua, e inservibles para señal. Un shunt bobinado da un pico proporcional a di/dt."
    pistas:
      - { cuando: { valor: estimacion, mayor: 8500 }, texto: "Se ha pasado: 1 / (2π · 20 µH) son unos pocos kilohercios." }
      - { texto: "Se ha quedado corto: 1 / (2π · 20 µH) son varios kilohercios." }
    escalera:
      - "Una bobinada es una bobina: use f = R/(2π·L)."
    solucion: "1 / (2π · 20 µH) = 8 kHz."
    comprobar:
      - { f_Lb: 7958 }
    variantes:
      valores:
        L_b: [2e-06, 2e-07]

  - id: por-que-ayrton
    tipo: explorar
    titulo: "Bobinado no inductivo"
    texto: "En el bobinado Ayrton-Perry, la mitad del hilo va en un sentido y la otra mitad en el contrario: los campos se cancelan. Llévela a cientos de kilohercios."
    libro: [184, 185]
    inicio: { L_b: 20e-6 }
    widget:
      tipo: grafica
      x: { id: nu, min: 1000, max: 10000000, unidad: Hz, rotulo: "f", escala: log }
      y: { min: 0.5, max: 100, unidad: Ω, rotulo: "|Z|", escala: log }
      curvas:
        - { expr: "sqrt(R_b^2 + (2*pi*nu*L_b)^2)", color: naranja, rotulo: "|Z| de la bobinada" }
      lectura: { valor: f_Lb, rotulo: "Resistiva hasta" }
      mandos:
        - { valor: L_b, lista: [20e-6, 2e-6, 0.2e-6], nombres: ["bobinado normal", "un orden menos", "dos órdenes menos"], rotulo: "Inductancia" }
    objetivo:
      condiciones:
        - { valor: f_Lb, min: 100000, rotulo: "Resistiva hasta {{f_Lb}}" }
      logrado: "Con dos órdenes menos de inductancia, resistiva hasta {{f_Lb}}. A cambio, más capacidad y más precio: shunts de precisión y cargas de RF."
      pistas:
        - { texto: "Baje más la inductancia." }
    escalera:
      - "La inductancia del Ayrton-Perry es uno o dos órdenes menor."
    solucion: "Con dos órdenes menos: unos 796 kHz."
    comprobar:
      - { f_Lb: 7958 }
      - { con: { L_b: 0.2e-6 }, f_Lb: 795800, tol: 0.01 }
  - id: pelicula-grabada
    tipo: pregunta
    titulo: "La trampa de la película"
    texto: "Para ajustar el valor, el fabricante graba una espiral en la película. ¿Qué pasa en los valores altos?"
    libro: [186]
    opciones:
      - texto: "La espiral tiene más vueltas y la inductancia crece"
        bien: true
        porque: "Esa espiral es una bobina. Las de RF usan película uniforme, ajustada por el espesor."
      - texto: "Nada: la película no tiene parásitos"
        porque: "La espiral grabada es una bobina, y en valores altos tiene muchas vueltas."
      - texto: "Desaparece la capacidad"
        porque: "La capacidad sigue ahí; lo que añade la espiral es inductancia."
    widget:
      tipo: figura
      figura: fig-2.3
      zonas:
        - { id: seccion, rotulo: "Sección de una resistencia de película", rect: [1110, 0, 490, 360] }
    escalera:
      - "Una espiral conductora, ¿a qué componente se parece?"
    solucion: "Con más vueltas, la espiral es una bobina mayor: la inductancia crece."

  - id: estime-terminacion
    tipo: simular
    fase: "Estime"
    titulo: "Una terminación de 50 Ω"
    texto: "Una terminación de 50 Ω con 10 nH. ¿Desde qué frecuencia manda la inductancia y la línea empieza a reflejar?"
    libro: [180, 189, 193]
    simular:
      objetivo: f_Lt
      unidad: Hz
      tol: 0.07
      rotulo: "f_{L} con 50 Ω"
      errores:
        - { razon: { min: 1.9, max: 2.1 }, texto: "Ese es el de 100 Ω. Con 50 Ω, la mitad." }
    exito: "Hacia 0,8 GHz: deja de terminar bien a partir de cientos de megahercios. SMD pequeñas y trazado corto: cada milímetro de terminal son 1 nH."
    pistas:
      - { cuando: { valor: estimacion, mayor: 850000000 }, texto: "Se ha pasado: con 50 Ω es la mitad que con 100 Ω." }
      - { texto: "Se ha quedado corto: 50 / (2π · 10 nH) son cientos de megahercios." }
    comprobar:
      - { f_Lt: 7.96e8, tol: 0.01 }
    escalera:
      - "Sustituya 50 Ω y 10 nH en f = R/(2π·L)."
    solucion: "Hacia 0,8 GHz: deja de terminar bien a partir de cientos de megahercios. SMD pequeñas y trazado corto."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [178, 179, 182, 184, 193]
    ideas:
      - { titulo: "Tres elementos.", texto: "R con una L en serie y una C en paralelo: 10 nH y 0,3 pF típicos." }
      - { titulo: "Quién manda.", texto: "Las pequeñas se vuelven inductivas; las grandes, capacitivas: 1 MΩ desde 0,53 MHz." }
      - { titulo: "Bobinadas.", texto: "Son bobinas: inductivas desde kilohercios, salvo el bobinado Ayrton-Perry." }
      - { titulo: "Reducir.", texto: "SMD, patillas cortas y la tecnología adecuada." }
