# Lección 1.1 de la sección 2.3 «Tolerancia, Coeficiente de Temperatura y Ruido» (cap02): el TCR (y el diferencial
# en un divisor), la tolerancia y su distribución, la deriva, el ruido térmico de Johnson-Nyquist y el de exceso.
# Formato: contenido/lecciones11/GUIA.md.
leccion: cap02/sec-2.3

libro:
  37: "Una resistencia de 10 kΩ al 1 % está entre 9 900 y 10 100 Ω"
  39: "lo que queda es una distribución con un hueco en el centro"
  40: "Lo que importa a menudo no es la tolerancia absoluta sino la relativa"
  42: "Con 100 ppm/°C, una resistencia de 10 kΩ cambia 50 Ω al calentarse 50 °C"
  44: "Lámina metálica (foil)"
  46: "en un divisor lo que importa es el TCR diferencial"
  48: "El coeficiente de tensión describe que la resistencia cambia con la tensión aplicada"
  49: "La deriva a largo plazo es el cambio permanente tras miles de horas"
  51: "con independencia de que circule corriente o no"
  52: 'v_("ruido") = sqrt("4" dot.op k dot.op T dot.op R dot.op B)'
  53: "B el ancho de banda del sistema"
  54: "18,2 µV"
  56: "El ruido crece con la raíz de la resistencia"
  60: "Alto (µV por voltio aplicado)"
  61: "las de película metálica no tienen menos ruido térmico que las de carbón"
  63: "el ruido debe bajar diez veces, tal como predice la raíz"
  "cap02#342": "Una resistencia de precisión de 10 kΩ tiene un TCR de ±50 ppm/°C"

modelo:
  valores:
    R_t: { sim: "R", nombre: "valor de la resistencia", unidad: Ω, valor: 10000 }
    tcr: { sim: "TCR", nombre: "coeficiente de temperatura", unidad: "ppm/°C", valor: 100 }
    dT: { sim: "ΔT", nombre: "calentamiento", unidad: "°C", valor: 0 }
    V_d: { sim: "V", nombre: "tensión del divisor", unidad: V, valor: 10 }
    R_d1: { sim: "R₁", nombre: "resistencia de arriba, en frío", unidad: Ω, valor: 10000 }
    R_d2: { sim: "R₂", nombre: "resistencia de abajo, en frío", unidad: Ω, valor: 10000 }
    a_1: { sim: "TCR₁", nombre: "coeficiente de R₁", unidad: "ppm/°C", valor: 50 }
    a_2: { sim: "TCR₂", nombre: "coeficiente de R₂", unidad: "ppm/°C", valor: 50 }
    dT_d: { sim: "ΔT", nombre: "calentamiento del divisor", unidad: "°C", valor: 0 }
    T_k: { sim: "T", nombre: "temperatura absoluta", unidad: "K", valor: 300 }
    R_n: { sim: "R", nombre: "resistencia", unidad: Ω, valor: 1000 }
    B: { sim: "B", nombre: "ancho de banda", unidad: Hz, valor: 20000 }
  calculos:
    d_R: { expr: "R_t*tcr*dT*1e-6", sim: "ΔR", nombre: "cambio de la resistencia", unidad: Ω }
    ppm: { expr: "tcr*dT", sim: "ΔR/R", nombre: "cambio relativo en ppm", unidad: "ppm", cifras: 4 }
    pct: { expr: "tcr*dT*1e-4", sim: "ΔR/R", nombre: "cambio relativo", unidad: "%", cifras: 3 }
    R_1T: { expr: "R_d1*(1 + a_1*dT_d*1e-6)", sim: "R₁", nombre: "R₁ caliente", unidad: Ω, cifras: 5 }
    R_2T: { expr: "R_d2*(1 + a_2*dT_d*1e-6)", sim: "R₂", nombre: "R₂ caliente", unidad: Ω, cifras: 5 }
    V_o: { expr: "V_d*R_2T/(R_1T + R_2T)", sim: "V_{salida}", nombre: "salida del divisor", unidad: V, cifras: 4 }
    I_d: { expr: "V_d/(R_1T + R_2T)", sim: "I", nombre: "corriente del divisor", unidad: A }
    v_n: { expr: "sqrt(4*1.380649e-23*T_k*R_n*B)", sim: "v_{ruido}", nombre: "ruido térmico eficaz", unidad: V }
    v_sal: { expr: "1000*v_n", sim: "v_{salida}", nombre: "ruido a la salida de un amplificador de ganancia mil", unidad: V }

tarjetas:
  - id: explore-tcr
    tipo: explorar
    titulo: "Caliente una resistencia"
    texto: "El TCR se da en partes por millón por grado. Caliente una de 10 kΩ, cambie el TCR y fíjese en cuántos ohmios se mueve."
    libro: [42]
    widget:
      tipo: grafica
      x: { id: x, min: 0, max: 100, unidad: "°C", rotulo: "ΔT" }
      y: { min: 0, max: 250, unidad: Ω, rotulo: "ΔR" }
      curvas:
        - { expr: "R_t*tcr*x*1e-6", color: naranja, rotulo: "cambio de R" }
      asas:
        - { mueve: dT, x: "dT", y: "d_R", rotulo: "Calentamiento" }
      lectura: { valor: d_R, rotulo: "Cambio de la resistencia" }
      datos:
        - { valor: pct, rotulo: "ΔR/R = {{pct}}" }
      mandos:
        - { valor: dT, min: 0, max: 100, paso: 10, rotulo: "Calentamiento, ΔT" }
        - { valor: tcr, lista: [25, 50, 100, 250], rotulo: "TCR" }
    requiere: { mover: [dT, tcr] }

  - id: prediga-tcr
    tipo: predecir
    titulo: "Prediga"
    texto: "Una de 10 kΩ con 100 ppm/°C se calienta 50 °C. ¿Cuánto cambia?"
    libro: [42]
    fijar: { tcr: 100, dT: 50 }
    widget:
      tipo: grafica
      x: { id: x, min: 0, max: 100, unidad: "°C", rotulo: "ΔT" }
      y: { min: 0, max: 250, unidad: Ω, rotulo: "ΔR" }
      curvas:
        - { expr: "R_t*tcr*x*1e-6", color: naranja, rotulo: "cambio de R" }
      lectura: { valor: d_R, rotulo: "Cambio de la resistencia" }
      datos:
        - { valor: pct, rotulo: "ΔR/R = {{pct}}" }
      ocultar: true
    opciones:
      - texto: "50 Ω, un 0,5 %"
        bien: true
        porque: "100 ppm por grado y 50 grados son 5 000 ppm: un 0,5 %, la mitad de lo que permitía una tolerancia del 1 %."
      - texto: "5 Ω, un 0,05 %"
        porque: "Un ppm es una millonésima: 5 000 ppm de 10 000 Ω son 50 Ω."
      - texto: "500 Ω, un 5 %"
        porque: "Se ha pasado diez veces: 5 000 ppm son un 0,5 %, no un 5 %."
    comprobar:
      - { d_R: 50, pct: 0.5, ppm: 5000 }
    escalera:
      - "100 ppm por grado durante 50 grados son 5 000 ppm."
    solucion: "5 000 ppm de 10 000 Ω son 50 Ω, un 0,5 %."

  - id: estime-precision
    tipo: pregunta
    fase: "Estime"
    titulo: "Una de precisión"
    texto: "Una de 10 kΩ con ±50 ppm/°C pasa de 25 °C a 75 °C. Estime cuánto varía su valor."
    libro: ["cap02#342"]
    fijar: { tcr: 50, dT: 50 }
    estimar:
      objetivo: "d_R"
      unidad: Ω
      min: 0
      max: 100
      paso: 1
      inicio: 70
      tol: 0.05
      rotulo: "ΔR"
    exito: "50 °C × 50 ppm/°C = 2 500 ppm, un 0,25 %: 25 Ω. Pequeño, pero cuenta en precisión."
    pistas:
      - { cuando: { valor: estimacion, mayor: 26 }, texto: "Se ha pasado: multiplique 50 ppm/°C por los 50 °C de subida y aplíquelo a 10 kΩ." }
      - { texto: "Se ha quedado corto: son 2 500 ppm de 10 000 Ω." }
    comprobar:
      - { d_R: 25, pct: 0.25 }
    escalera:
      - "Multiplique el TCR por la subida de temperatura y aplíquelo a 10 kΩ."
    solucion: "50 °C × 50 ppm/°C = 2 500 ppm, un 0,25 %: 25 Ω. Pequeño, pero cuenta en precisión."

  - id: empareje-tecnologias
    tipo: pregunta
    fase: "Empareje"
    titulo: "El TCR de cada tecnología"
    texto: "Empareje cada tecnología con su TCR típico."
    libro: [44]
    emparejar:
      - ["Carbón aglomerado", "±1 000 ppm/°C"]
      - ["Película de carbón", "±250 ppm/°C"]
      - ["Película metálica", "±50 a ±100 ppm/°C"]
      - ["Bobinada", "±20 ppm/°C"]
      - ["Lámina metálica (foil)", "±2 ppm/°C"]
    exito: "Eso es: del carbón aglomerado a la lámina metálica, el TCR baja quinientas veces."
    pistas:
      - { texto: "El peor es el carbón aglomerado; el mejor, la lámina metálica." }
    escalera:
      - "Ordénelas primero de peor a mejor; luego asigne los números."
    solucion: "Carbón aglomerado: ±1 000 ppm/°C. Película de carbón: ±250 ppm/°C. Película metálica: ±50 a ±100 ppm/°C. Bobinada: ±20 ppm/°C. Lámina metálica (foil): ±2 ppm/°C."

  - id: sorpresa-divisor
    tipo: sorpresa
    titulo: "Caliente un divisor"
    texto: "Dos de 10 kΩ a 10 V, ambas de 50 ppm/°C: caliente el divisor y mire la salida. Luego dé a R₂ otro TCR."
    libro: [46, "cap02#342"]
    fijar: { V_d: 10, R_d1: 10000, R_d2: 10000, a_1: 50 }
    widget:
      tipo: circuito
      esquema: divisor
      piezas: { fuente: V_d, arriba: R_1T, abajo: R_2T }
      lectura: { valor: V_o, rotulo: "Salida del divisor" }
      datos:
        - { valor: R_1T, rotulo: "R₁ = {{R_1T}}" }
        - { valor: R_2T, rotulo: "R₂ = {{R_2T}}" }
      corriente: I_d
      mide: { salida: V_o, corriente: I_d }
      mandos:
        - { valor: dT_d, min: 0, max: 100, paso: 10, rotulo: "Calentamiento, ΔT" }
        - { valor: a_2, lista: [50, 100], rotulo: "TCR de R₂" }
    requiere: { mover: [dT_d, a_2] }
    comprobar:
      - { con: { dT_d: 100 }, V_o: 5 }
      - { con: { dT_d: 100, a_2: 100 }, V_o: 5.012, tol: 0.0002 }

  - id: por-que-apareadas
    tipo: porque
    titulo: "¿Por qué no se mueve?"
    texto: "Con el mismo TCR y a la misma temperatura, las dos cambian de valor y la salida no. ¿Por qué?"
    libro: [40, 46]
    fijar: { V_d: 10, R_d1: 10000, R_d2: 10000, a_1: 50, a_2: 50, dT_d: 100 }
    widget:
      tipo: circuito
      esquema: divisor
      piezas: { fuente: V_d, arriba: R_1T, abajo: R_2T }
      lectura: { valor: V_o, rotulo: "Salida del divisor" }
      corriente: I_d
      mide: { salida: V_o, corriente: I_d }
    opciones:
      - texto: "La salida depende del cociente, y el cociente no cambia"
        bien: true
        porque: "Importa el TCR diferencial. Por eso ganan las redes apareadas: 1 o 2 ppm/°C de diferencia aunque el absoluto sea de 50."
      - texto: "Porque 50 ppm/°C es un cambio despreciable"
        porque: "Cada una sube 50 Ω con 100 °C. Lo que no cambia es la proporción entre ellas."
      - texto: "Porque la corriente del divisor se mantiene"
        porque: "La corriente baja algo, porque la suma crece. La salida se mantiene porque el cociente se mantiene."
    comprobar:
      - { V_o: 5, R_1T: 10050, R_2T: 10050 }
    escalera:
      - "La salida de un divisor depende del cociente R₂/(R₁ + R₂)."
    solucion: "Si las dos suben la misma fracción, el cociente no cambia: lo que importa es el TCR diferencial."

  - id: empareje-conceptos
    tipo: pregunta
    fase: "Empareje"
    titulo: "Cuatro maneras de no valer lo nominal"
    texto: "Empareje cada especificación con lo que describe."
    libro: [37, 42, 48, 49]
    emparejar:
      - ["Tolerancia", "Desviación al fabricarla, a temperatura ambiente"]
      - ["TCR", "Cambio con la temperatura"]
      - ["Coeficiente de tensión", "Cambio con la tensión aplicada"]
      - ["Deriva a largo plazo", "Cambio permanente tras miles de horas"]
    exito: "Eso es. La tolerancia no dice nada de cómo derivará después: por eso no basta con ese número."
    pistas:
      - { texto: "La tolerancia es la única que se fija en la fábrica; la deriva, la que tarda años." }
    escalera:
      - "Piense en cuándo aparece cada desviación: al fabricar, al calentar, al aplicar tensión o con los años."
    solucion: "Tolerancia: desviación al fabricarla, a temperatura ambiente. TCR: cambio con la temperatura. Coeficiente de tensión: cambio con la tensión aplicada. Deriva a largo plazo: cambio permanente tras miles de horas."

  - id: hueco
    tipo: pregunta
    titulo: "Del 5 %, pero no centradas"
    texto: "Un fabricante aparta las mejores unidades para venderlas con tolerancia más estrecha. ¿Qué le queda a quien compra las del 5 %?"
    libro: [39]
    opciones:
      - texto: "Una distribución con un hueco en el centro"
        bien: true
        porque: "Las cercanas al nominal se han vendido aparte: quedan unidades sistemáticamente alejadas."
      - texto: "Una campana centrada en el nominal"
        porque: "Eso da un proceso centrado sin selección. Al apartar las mejores, el centro queda vacío."
      - texto: "Unidades todas en el extremo del 5 %"
        porque: "No todas en el borde: falta el centro, pero quedan valores repartidos por el resto del margen."
    widget:
      tipo: figura
      figura: fig-0.13
      zonas:
        - { id: campana, rotulo: "La campana de una fabricación", rect: [0, 0, 447, 203] }
    escalera:
      - "¿Qué unidades se ha llevado el fabricante para venderlas aparte?"
    solucion: "Una distribución con un hueco en el centro: las cercanas al nominal se vendieron como de tolerancia estrecha."

  - id: explore-ruido
    tipo: explorar
    titulo: "El ruido que no se puede evitar"
    texto: "Toda resistencia genera ruido térmico, circule corriente o no. Mueva la resistencia y el ancho de banda."
    libro: [51, 53]
    widget:
      tipo: grafica
      x: { id: r, min: 100, max: 10000000, unidad: Ω, rotulo: "R", escala: log }
      y: { min: 1e-8, max: 1e-3, unidad: V, rotulo: "v_{ruido}", escala: log }
      curvas:
        - { expr: "sqrt(4*1.380649e-23*T_k*r*B)", color: naranja, rotulo: "ruido térmico" }
      asas:
        - { mueve: R_n, x: "R_n", y: "v_n", rotulo: "Resistencia" }
      lectura: { valor: v_n, rotulo: "Ruido eficaz" }
      mandos:
        - { valor: R_n, lista: [100, 1000, 10000, 100000, 1000000, 10000000], rotulo: "Resistencia, R" }
        - { valor: B, lista: [20000, 1000000], rotulo: "Ancho de banda, B" }
    requiere: { mover: [R_n, B] }

  - id: regla-ruido
    tipo: formula
    titulo: "Johnson-Nyquist"
    texto: "k es la constante de Boltzmann, T la temperatura absoluta, R la resistencia y B el ancho de banda."
    nota: "Limitar la banda es la forma más barata de reducir ruido: todo circuito de medida lleva un paso bajo."
    libro: [52, 53, 56]
    ec: 52
    sustitucion: "√(4 · k · {{T_k}} · {{R_n}} · {{B}}) = {{v_n}}"
    widget:
      tipo: grafica
      x: { id: r, min: 100, max: 10000000, unidad: Ω, rotulo: "R", escala: log }
      y: { min: 1e-8, max: 1e-3, unidad: V, rotulo: "v_{ruido}", escala: log }
      curvas:
        - { expr: "sqrt(4*1.380649e-23*T_k*r*B)", color: naranja, rotulo: "ruido térmico" }
      asas:
        - { mueve: R_n, x: "R_n", y: "v_n", rotulo: "Resistencia" }
      lectura: { valor: v_n, rotulo: "Ruido eficaz" }
      mandos:
        - { valor: R_n, lista: [100, 1000, 10000, 100000, 1000000, 10000000], rotulo: "Resistencia, R" }
        - { valor: B, lista: [20000, 1000000], rotulo: "Ancho de banda, B" }

  - id: prediga-raiz
    tipo: predecir
    titulo: "Prediga: mil veces más"
    texto: "1 kΩ en 20 kHz de audio da 0,58 µV. Con 1 MΩ, mil veces más resistencia, ¿qué ruido hay?"
    libro: [54, 56]
    fijar: { R_n: 1000000, B: 20000 }
    widget:
      tipo: grafica
      x: { id: r, min: 100, max: 10000000, unidad: Ω, rotulo: "R", escala: log }
      y: { min: 1e-8, max: 1e-3, unidad: V, rotulo: "v_{ruido}", escala: log }
      curvas:
        - { expr: "sqrt(4*1.380649e-23*T_k*r*B)", color: naranja, rotulo: "ruido térmico" }
      lectura: { valor: v_n, rotulo: "Ruido eficaz" }
      ocultar: true
    opciones:
      - texto: "18,2 µV: unas 32 veces más"
        bien: true
        porque: "Crece con la raíz de la resistencia: √1000 ≈ 32. Multiplicar R por cien solo multiplica el ruido por diez."
      - texto: "Mil veces más"
        porque: "Sería así si el ruido creciera con R. Crece con su raíz."
      - texto: "Lo mismo: el ruido no depende de R"
        porque: "No depende de la tecnología ni del fabricante, pero sí del valor: está bajo la raíz con k, T y B."
    comprobar:
      - { v_n: 1.82e-5 }
      - { con: { R_n: 1000 }, v_n: 5.76e-7 }
      - { con: { R_n: 31623 }, v_n: 3.24e-6 }
    escalera:
      - "El ruido crece con la raíz de la resistencia: √1000 ≈ 32."
    solucion: "Unas 32 veces más que 0,58 µV: 18,2 µV."

  - id: estime-banco
    tipo: pregunta
    fase: "Estime"
    titulo: "En el banco"
    texto: "1 MΩ en la entrada de un amplificador de ganancia 1 000 da 18 mV de ruido en 20 kHz. Cámbiela por una de 10 kΩ y estime la salida."
    libro: [63]
    fijar: { R_n: 10000, B: 20000 }
    estimar:
      objetivo: "v_sal"
      unidad: V
      min: 0
      max: 0.02
      paso: 0.0002
      inicio: 0.012
      tol: 0.1
      rotulo: "Ruido a la salida"
    exito: "Unos 1,8 mV: cien veces menos resistencia, diez veces menos ruido, tal como predice la raíz."
    pistas:
      - { cuando: { valor: estimacion, mayor: 0.002 }, texto: "Se ha pasado: con cien veces menos resistencia el ruido baja diez veces." }
      - { texto: "Se ha quedado corto: el ruido baja con la raíz, solo diez veces." }
    comprobar:
      - { v_sal: 0.00182 }
      - { con: { R_n: 1000000 }, v_sal: 0.0182 }
    escalera:
      - "Cien veces menos resistencia: ¿cuánto baja su raíz?"
    solucion: "Unos 1,8 mV: cien veces menos resistencia, diez veces menos ruido, tal como predice la raíz."

  - id: por-que-un-euro
    tipo: porque
    titulo: "Un euro o un céntimo"
    texto: "Dos de 1 kΩ: una de película metálica de un euro y otra de carbón de un céntimo. ¿Cuál tiene más ruido térmico?"
    libro: [56, 60, 61]
    opciones:
      - texto: "Las dos el mismo"
        bien: true
        porque: "El térmico es física, no calidad. La de carbón tiene más ruido de exceso, el que aparece con corriente."
      - texto: "La de carbón"
        porque: "Tiene más ruido de exceso, el 1/f. El térmico depende solo de R, T y B."
      - texto: "La de película metálica"
        porque: "Ni más ni menos: a igual resistencia, el ruido térmico es el mismo."
    widget:
      tipo: grafica
      x: { id: r, min: 100, max: 10000000, unidad: Ω, rotulo: R, escala: log }
      y: { min: 1e-8, max: 0.001, unidad: V, rotulo: "v_{ruido}", escala: log }
      curvas:
        - { expr: "sqrt(4*1.380649e-23*T_k*r*B)", color: naranja, rotulo: "ruido térmico" }
      asas:
        - { mueve: R_n, x: R_n, y: v_n, rotulo: Resistencia }
      lectura: { valor: v_n, rotulo: "Ruido eficaz" }
      mandos:
        - { valor: R_n, lista: [100, 1000, 10000, 100000, 1000000, 10000000], rotulo: "Resistencia, R" }
    escalera:
      - "¿De qué depende el ruido térmico: de la tecnología, o de R, T y B?"
    solucion: "Las dos el mismo: el térmico solo depende de R, T y B. La de carbón tiene más ruido de exceso."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [37, 42, 46, 52, 56, 61]
    ideas:
      - { titulo: "Tolerancia.", texto: "Es la desviación al fabricar; no dice cómo derivará con la temperatura ni con el tiempo." }
      - { titulo: "TCR.", texto: "En ppm/°C. En un divisor importa el diferencial: las redes apareadas ganan." }
      - { titulo: "Ruido térmico.", texto: "√(4kTRB): crece con la raíz de R y del ancho de banda, y no depende de la tecnología." }
      - { titulo: "Ruido de exceso.", texto: "Aparece con corriente y sí depende de la tecnología: bajo en película metálica." }
