# Lección 1.1 de la sección 2.6 «Resistencias Especiales y Sensores Resistivos» (cap02): NTC y PTC, LDR, varistor,
# galgas y las tres formas de una resistencia variable. La NTC de la gráfica es la de la figura 2.8 del libro
# (10 kΩ a 25 °C, B = 3900 K), con la ley exponencial de la tarjeta de repaso del capítulo.
# Formato: contenido/lecciones11/GUIA.md.
leccion: cap02/sec-2.6

libro:
  109: "esa dependencia es exactamente lo que los convierte en sensores"
  111: "su resistencia baja al calentarse, de forma marcadamente no lineal"
  113: "fría presenta decenas de ohmios"
  114: "la NTC todavía está caliente y no limita nada"
  115: "su uso como fusible rearmable"
  116: "su resistencia en reposo aumenta ligeramente con cada actuación"
  118: "contiene cadmio, restringido por RoHS"
  120: "Su resistencia cae bruscamente al superar una tensión"
  121: "cada actuación lo desgasta, su tensión de disparo baja"
  123: "Su resistencia cambia con la deformación mecánica"
  126: "Potenciómetro: tres terminales, se usa como divisor."
  127: "Reóstato: dos terminales, se usa como resistencia variable."
  128: "Trimmer: pensado para ajustar una vez, con pocos ciclos de vida."
  129: "el resto del giro apenas se nota (sección 2.11)"
  131: "calentar una NTC con los dedos, tapar una LDR, presionar una galga"
  132: "si su resistencia cambia al calentarlo, es térmico"
  133: "Curvas de NTC y PTC"
  "cap02#341": 'R lr(( T )) = R_("25")'

modelo:
  valores:
    R_25: { sim: "R_{25}", nombre: "resistencia de la NTC a 25 °C", unidad: Ω, valor: 10000 }
    B_n: { sim: "B", nombre: "parámetro B de la NTC", unidad: "K", valor: 3900 }
    T_c: { sim: "T", nombre: "temperatura de la NTC", unidad: "°C", valor: 25 }
  calculos:
    R_ntc: { expr: "R_25*exp(B_n*(1/(T_c + 273.15) - 1/298.15))", sim: "R_{NTC}", nombre: "resistencia de la NTC", unidad: Ω }
    rel: { expr: "R_ntc/R_25", sim: "R/R_{25}", nombre: "resistencia relativa a la de 25 °C", unidad: "veces", cifras: 3 }

tarjetas:
  - id: explore-ntc
    tipo: explorar
    titulo: "Una NTC"
    texto: "Su resistencia baja al calentarse, y de forma marcadamente no lineal. Arrastre la temperatura y mire cuánto cae en frío y cuánto en caliente."
    nota: "Esa dependencia es lo que la convierte en sensor."
    libro: [109, 111, 133, "cap02#341"]
    widget:
      tipo: grafica
      x: { id: x, min: -10, max: 110, unidad: "°C", rotulo: "T" }
      y: { min: 100, max: 100000, unidad: Ω, rotulo: "R", escala: log }
      curvas:
        - { expr: "R_25*exp(B_n*(1/(x + 273.15) - 1/298.15))", color: naranja, rotulo: "NTC" }
      asas:
        - { mueve: T_c, x: "T_c", y: "R_ntc", rotulo: "Temperatura" }
      lectura: { valor: R_ntc, rotulo: "Resistencia de la NTC" }
      mandos:
        - { valor: T_c, min: -10, max: 110, paso: 5, rotulo: "Temperatura, T" }

  - id: prediga-ntc
    tipo: predecir
    titulo: "Prediga"
    texto: "Una NTC tiene 10 kΩ a 25 °C y B = 3900 K. ¿Cuánto tendrá a 50 °C?"
    libro: [111]
    fijar: { T_c: 50, B_n: 3900 }
    widget:
      tipo: grafica
      x: { id: x, min: -10, max: 110, unidad: "°C", rotulo: "T" }
      y: { min: 100, max: 100000, unidad: Ω, rotulo: "R", escala: log }
      curvas:
        - { expr: "R_25*exp(B_n*(1/(x + 273.15) - 1/298.15))", color: naranja, rotulo: "NTC" }
      lectura: { valor: R_ntc, rotulo: "Resistencia de la NTC" }
      ocultar: true
    opciones:
      - texto: "Menos de la mitad, unos 3,6 kΩ"
        bien: true
        porque: "Cae mucho y no en línea recta: la ley es exponencial."
      - texto: "Más de 10 kΩ"
        porque: "Eso es una PTC o un metal. En una NTC, calentar baja la resistencia."
      - texto: "Casi lo mismo"
        porque: "Una NTC es muy sensible: con 25 °C más, su resistencia cae a algo más de un tercio."
    comprobar:
      - { R_ntc: 3635, tol: 0.01 }
      - { con: { T_c: 25 }, R_ntc: 10000 }
    escalera:
      - "En una NTC, calentar baja la resistencia, y no en línea recta."
    solucion: "Menos de la mitad, unos 3,6 kΩ: la ley es exponencial."

  - id: reto-decima
    tipo: reto
    titulo: "Reto: la décima parte"
    texto: "¿Cuánto hay que calentar esta NTC, desde 25 °C, para que su resistencia baje a la décima parte?"
    libro: [111]
    inicio: { T_c: 25 }
    widget:
      tipo: grafica
      x: { id: x, min: -10, max: 110, unidad: "°C", rotulo: "T" }
      y: { min: 100, max: 100000, unidad: Ω, rotulo: "R", escala: log }
      curvas:
        - { expr: "R_25*exp(B_n*(1/(x + 273.15) - 1/298.15))", color: naranja, rotulo: "NTC" }
      asas:
        - { mueve: T_c, x: "T_c", y: "R_ntc", rotulo: "Temperatura" }
      lectura: { valor: R_ntc, rotulo: "Resistencia de la NTC" }
      mandos:
        - { valor: T_c, min: -10, max: 110, paso: 5, rotulo: "Temperatura, T" }
    condiciones:
      - { valor: rel, objetivo: 0.1, tol: 0.05, rotulo: "R/R_{25} = {{rel}}" }
    exito: "Hacia 90 °C: de 10 kΩ a menos de 1 kΩ. Con decenas de grados, la NTC cambia diez veces."
    pistas:
      - { cuando: { valor: rel, mayor: 0.105 }, texto: "Todavía es mucha resistencia: caliéntela más." }
      - { cuando: { valor: rel, menor: 0.095 }, texto: "Se ha pasado: ya ha bajado de la décima parte. Enfríela un poco." }
    escalera:
      - "La décima parte de 10 kΩ es 1 kΩ."
    solucion: "La curva baja cada vez más despacio en caliente: cruza 1 kΩ hacia 90 °C."
    comprobar:
      - { con: { T_c: 90 }, R_ntc: 962, rel: 0.0962, tol: 0.01 }
      - { con: { T_c: 25 }, R_ntc: 10000 }

  - id: por-que-irrupcion
    tipo: porque
    titulo: "Apagar y encender enseguida"
    texto: "Una NTC limita la irrupción porque fría presenta decenas de ohmios. Si el equipo se reconecta enseguida, ¿por qué no protege?"
    libro: [113, 114]
    opciones:
      - texto: "Todavía está caliente y su resistencia es baja"
        bien: true
        porque: "La propia corriente la calentó para que dejara de estorbar; caliente, ya no limita nada."
      - texto: "Se ha fundido en la primera conexión"
        porque: "No se funde: es su funcionamiento normal. El problema es que necesita enfriarse."
      - texto: "Las NTC solo actúan una vez"
        porque: "Actúan cada vez que están frías. Lo que falta al reconectar enseguida es tiempo para enfriarse."
    widget:
      tipo: grafica
      x: { id: x, min: -10, max: 110, unidad: °C, rotulo: T }
      y: { min: 100, max: 100000, unidad: Ω, rotulo: R, escala: log }
      curvas:
        - { expr: "R_25*exp(B_n*(1/(x + 273.15) - 1/298.15))", color: naranja, rotulo: NTC }
      asas:
        - { mueve: T_c, x: T_c, y: R_ntc, rotulo: Temperatura }
      lectura: { valor: R_ntc, rotulo: "Resistencia de la NTC" }
      mandos:
        - { valor: T_c, min: -10, max: 110, paso: 5, rotulo: "Temperatura, T" }
    escalera:
      - "¿Cómo está la NTC justo después de haber trabajado?"
    solucion: "Todavía está caliente, y caliente su resistencia es baja: no limita nada."

  - id: ptc-fusible
    tipo: pregunta
    titulo: "Una PTC conmutadora"
    texto: "Una PTC conmutadora tiene una transición abrupta a cierta temperatura. ¿Para qué se usa?"
    libro: [115, 116]
    opciones:
      - texto: "Como fusible rearmable"
        bien: true
        porque: "Ante una sobrecorriente se calienta, su resistencia se dispara y limita hasta que se retira la falta."
      - texto: "Para limitar la irrupción al encender"
        porque: "Eso es la NTC, que fría limita y caliente deja pasar. La PTC hace lo contrario."
      - texto: "Como patrón de resistencia"
        porque: "No vuelve exactamente a su valor tras dispararse: su resistencia en reposo sube con cada actuación."
    widget:
      tipo: figura
      figura: fig-2.8
      zonas:
        - { id: curvas, rotulo: "Curvas de NTC y PTC", rect: [0, 0, 453, 215] }
    escalera:
      - "Ante una sobrecorriente se calienta: ¿qué hace entonces su resistencia?"
    solucion: "Como fusible rearmable: al calentarse, su resistencia se dispara y limita la corriente."

  - id: empareje-sensores
    tipo: pregunta
    fase: "Empareje"
    titulo: "Qué mide cada una"
    texto: "Su valor cambia con una magnitud física. Empareje cada componente con la suya."
    libro: [111, 118, 120, 123]
    emparejar:
      - ["NTC", "Temperatura"]
      - ["LDR", "Luz"]
      - ["VDR o varistor", "Tensión"]
      - ["Galga extensométrica", "Deformación mecánica"]
    exito: "Eso es. En el banco se comprueban con el óhmetro actuando sobre esa magnitud."
    pistas:
      - { texto: "La V de VDR viene de voltaje; la L de LDR, de luz (light)." }
    escalera:
      - "Piense en el nombre de cada uno: suele decir la magnitud."
    solucion: "NTC: temperatura. LDR: luz. VDR o varistor: tensión. Galga extensométrica: deformación mecánica."

  - id: varistor
    tipo: pregunta
    titulo: "El varistor que arde"
    texto: "Un varistor absorbe sobretensiones. ¿Qué le pasa con cada una?"
    libro: [120, 121]
    opciones:
      - texto: "Se desgasta y su tensión de disparo baja"
        bien: true
        porque: "Hasta que conduce a la tensión normal de red y arde. Por eso los buenos llevan un fusible térmico en serie."
      - texto: "Nada: se recupera entero"
        porque: "Cada actuación lo desgasta. No vuelve a ser el de antes."
      - texto: "Su tensión de disparo sube"
        porque: "Baja, no sube: acaba conduciendo a la tensión normal de red."
    widget:
      tipo: figura
      figura: fig-2.8
      zonas:
        - { id: especiales, rotulo: "Las resistencias especiales", rect: [0, 0, 453, 215] }
    escalera:
      - "Cada actuación lo deja un poco peor que antes."
    solucion: "Se desgasta y su tensión de disparo baja, hasta que conduce a la tensión normal de red y arde."

  - id: ldr
    tipo: pregunta
    titulo: "La LDR desaparece"
    texto: "La LDR es barata y sensible. ¿Por qué está desapareciendo?"
    libro: [118]
    opciones:
      - texto: "Contiene cadmio, restringido por RoHS"
        bien: true
        porque: "Es su límite como componente, además de ser muy lenta y tener memoria de la luz previa."
      - texto: "No es sensible a la luz"
        porque: "Es sensible. El problema es el cadmio que contiene."
      - texto: "Es demasiado rápida"
        porque: "Al contrario: es muy lenta. Y contiene cadmio, que RoHS restringe."
    widget:
      tipo: figura
      figura: fig-2.8
      zonas:
        - { id: especiales, rotulo: "Las resistencias especiales", rect: [0, 0, 453, 215] }
    escalera:
      - "Piense en la directiva RoHS y en lo que restringe."
    solucion: "Contiene cadmio, restringido por RoHS."

  - id: empareje-variables
    tipo: pregunta
    fase: "Empareje"
    titulo: "Tres resistencias variables"
    texto: "Conviene distinguirlas. Empareje cada nombre con su uso."
    libro: [126, 127, 128, 129]
    emparejar:
      - ["Potenciómetro", "Tres terminales, como divisor"]
      - ["Reóstato", "Dos terminales, como resistencia variable"]
      - ["Trimmer", "Se ajusta una vez; pocos ciclos de vida"]
    exito: "Eso es. La sección 2.11 entra en sus leyes y en el efecto de la carga."
    pistas:
      - { texto: "El divisor necesita los tres terminales." }
    escalera:
      - "Cuente terminales: tres para dividir, dos para hacer de resistencia."
    solucion: "Potenciómetro: tres terminales, como divisor. Reóstato: dos terminales, como resistencia variable. Trimmer: se ajusta una vez; pocos ciclos de vida."

  - id: banco
    tipo: pregunta
    titulo: "Un componente desconocido"
    texto: "Con el óhmetro conectado, calienta el componente con los dedos y la lectura cambia. ¿Qué es?"
    libro: [131, 132]
    opciones:
      - texto: "Un componente térmico, como una NTC"
        bien: true
        porque: "Es la comprobación más directa: si cambia al calentarlo, es térmico; si con la luz, es óptico."
      - texto: "Una LDR"
        porque: "La LDR responde a la luz: se comprueba tapándola."
      - texto: "Una galga extensométrica"
        porque: "La galga responde a la deformación: se comprueba presionándola."
    widget:
      tipo: grafica
      x: { id: x, min: -10, max: 110, unidad: °C, rotulo: T }
      y: { min: 100, max: 100000, unidad: Ω, rotulo: R, escala: log }
      curvas:
        - { expr: "R_25*exp(B_n*(1/(x + 273.15) - 1/298.15))", color: naranja, rotulo: "componente desconocido" }
      lectura: { valor: R_ntc, rotulo: "Lo que marca el óhmetro" }
      mandos:
        - { valor: T_c, min: -10, max: 110, paso: 5, rotulo: "Temperatura, T" }
    escalera:
      - "¿A qué magnitud responde cada uno: calor, luz o deformación?"
    solucion: "Si cambia al calentarlo, es térmico, como una NTC."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [111, 114, 115, 121, 126]
    ideas:
      - { titulo: "NTC.", texto: "Baja al calentarse, muy no lineal; mide temperatura o limita la irrupción, si está fría." }
      - { titulo: "PTC.", texto: "Se dispara a su temperatura de transición: un fusible rearmable." }
      - { titulo: "Varistor.", texto: "Absorbe sobretensiones y se desgasta con cada una: lleva fusible térmico." }
      - { titulo: "Variables.", texto: "Potenciómetro con tres terminales, reóstato con dos y trimmer para ajustar una vez." }
