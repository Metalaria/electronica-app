# Lección 1.1 de la sección 2.4 «El Código de Colores» (cap02): dos dígitos y un multiplicador, por dónde empezar a
# leer, cinco bandas, dorado y plateado como multiplicador, los problemas reales y otros componentes con el mismo
# código. Los colores no pueden ser un mando con nombres todavía (petición al motor): los dígitos se mueven como
# números y el texto da la tabla. Formato: contenido/lecciones11/GUIA.md.
leccion: cap02/sec-2.4

libro:
  67: "Una resistencia axial es demasiado pequeña para imprimir cifras legibles"
  70: "El dorado y el plateado nunca son la primera banda"
  71: "un extremo dará 4,7 kΩ y el otro un número absurdo"
  73: "Cuatro bandas (tolerancia 5 % o 10 %): dos dígitos, multiplicador, tolerancia."
  74: "Cinco bandas (tolerancia 1 % o mejor): tres dígitos, multiplicador, tolerancia."
  76: "negro 0, marrón 1, rojo 2, naranja 3, amarillo 4, verde 5, azul 6, violeta 7, gris 8, blanco 9"
  78: "Amarillo Violeta Rojo Dorado"
  80: "El azul y el violeta se confunden con luz cálida"
  81: "ante cualquier duda, medir con el multímetro"
  82: "una resistencia que mide más de su nominal está deteriorada"
  84: "Lo usan también algunas bobinas"
  "cap02#342": "Rojo-Rojo-Marrón-Dorado"

modelo:
  valores:
    d_1: { sim: "1.ª cifra", nombre: "primera banda, dígito", unidad: "", valor: 1 }
    d_2: { sim: "2.ª cifra", nombre: "segunda banda, dígito", unidad: "", valor: 0 }
    m: { sim: "n", nombre: "tercera banda, potencia de diez del multiplicador", unidad: "", valor: 0 }
  calculos:
    cifras2: { expr: "10*d_1 + d_2", sim: "dígitos", nombre: "las dos cifras", unidad: "", cifras: 2, recortar: true }
    mult: { expr: "10^m", sim: "multiplicador", nombre: "multiplicador", unidad: "", cifras: 3, recortar: true }
    R: { expr: "cifras2*mult", sim: "R", nombre: "valor de la resistencia", unidad: Ω, cifras: 3, recortar: true }

tarjetas:
  - id: explore-bandas
    tipo: explorar
    titulo: "Dos cifras y un multiplicador"
    texto: "Cuatro bandas: dos dígitos, multiplicador y tolerancia. Negro 0, marrón 1, rojo 2, naranja 3, amarillo 4, verde 5, azul 6, violeta 7, gris 8, blanco 9. Mueva las tres bandas."
    libro: [73, 76]
    widget:
      tipo: grafica
      x: { id: x, min: -2, max: 6, unidad: "", rotulo: "potencia de diez del multiplicador" }
      y: { min: 0.1, max: 1000000000, unidad: Ω, rotulo: "R", escala: log }
      curvas:
        - { expr: "cifras2*10^x", color: azul, rotulo: "mismas cifras, otro multiplicador" }
      asas:
        - { mueve: m, x: "m", y: "R", rotulo: "Multiplicador" }
      lectura: { valor: R, rotulo: "Valor" }
      datos:
        - { valor: cifras2, rotulo: "Cifras: {{cifras2}}" }
        - { valor: mult, rotulo: "Multiplicador: × {{mult}}" }
      mandos:
        - { valor: d_1, min: 1, max: 9, paso: 1, rotulo: "Primera banda, dígito" }
        - { valor: d_2, min: 0, max: 9, paso: 1, rotulo: "Segunda banda, dígito" }
        - { valor: m, min: -2, max: 6, paso: 1, rotulo: "Tercera banda, potencia de diez" }
    requiere: { mover: [d_1, m] }

  - id: prediga-amarillo
    tipo: predecir
    titulo: "Prediga"
    texto: "Amarillo, violeta, rojo y dorado. ¿Qué resistencia es?"
    libro: [76, 78]
    fijar: { d_1: 4, d_2: 7, m: 2 }
    widget:
      tipo: grafica
      x: { id: x, min: -2, max: 6, unidad: "", rotulo: "potencia de diez del multiplicador" }
      y: { min: 0.1, max: 1000000000, unidad: Ω, rotulo: "R", escala: log }
      curvas:
        - { expr: "cifras2*10^x", color: azul, rotulo: "mismas cifras, otro multiplicador" }
      lectura: { valor: R, rotulo: "Valor" }
      ocultar: true
    opciones:
      - texto: "4,7 kΩ ±5 %"
        bien: true
        porque: "Amarillo 4 y violeta 7 dan 47; el rojo como multiplicador es × 100; el dorado, ±5 %."
      - texto: "470 Ω ±5 %"
        porque: "Eso sería con marrón, × 10. El rojo vale 2: multiplica por 10², cien."
      - texto: "47 kΩ ±5 %"
        porque: "Eso sería con naranja, × 1 000. El rojo multiplica por cien."
    comprobar:
      - { R: 4700 }
      - { con: { m: 3 }, R: 47000 }
      - { con: { m: 1 }, R: 470 }

  - id: reto-220
    tipo: reto
    titulo: "Reto: rojo, rojo, marrón"
    texto: "Una resistencia de bandas rojo, rojo, marrón y dorado. Ponga las tres bandas y lea su valor."
    libro: ["cap02#342", 76]
    inicio: { d_1: 1, d_2: 0, m: 0 }
    widget:
      tipo: grafica
      x: { id: x, min: -2, max: 6, unidad: "", rotulo: "potencia de diez del multiplicador" }
      y: { min: 0.1, max: 1000000000, unidad: Ω, rotulo: "R", escala: log }
      curvas:
        - { expr: "cifras2*10^x", color: azul, rotulo: "mismas cifras, otro multiplicador" }
      asas:
        - { mueve: m, x: "m", y: "R", rotulo: "Multiplicador" }
      lectura: { valor: R, rotulo: "Valor" }
      mandos:
        - { valor: d_1, min: 1, max: 9, paso: 1, rotulo: "Primera banda, dígito" }
        - { valor: d_2, min: 0, max: 9, paso: 1, rotulo: "Segunda banda, dígito" }
        - { valor: m, min: -2, max: 6, paso: 1, rotulo: "Tercera banda, potencia de diez" }
    condiciones:
      - { valor: R, objetivo: 220, tol: 0.001, rotulo: "Valor: {{R}}" }
    exito: "Rojo 2, rojo 2, marrón × 10: 22 × 10 = 220 Ω, con el dorado ±5 %."
    pistas:
      - { cuando: { valor: R, mayor: 220.2 }, texto: "Se ha pasado: rojo es 2 y marrón, como multiplicador, solo × 10." }
      - { cuando: { valor: R, menor: 219.8 }, texto: "Le falta: rojo es 2 en las dos primeras bandas, y el marrón multiplica por 10." }
    ayuda: "Marrón es 1: como tercera banda, 10¹. Las dos primeras, rojo y rojo, son 2 y 2."
    comprobar:
      - { con: { d_1: 2, d_2: 2, m: 1 }, R: 220 }

  - id: prediga-dorado
    tipo: predecir
    titulo: "Por debajo de 10 Ω"
    texto: "Marrón, negro, dorado y dorado. El dorado aparece dos veces. ¿Cuánto vale?"
    libro: [76, 78]
    fijar: { d_1: 1, d_2: 0, m: -1 }
    widget:
      tipo: grafica
      x: { id: x, min: -2, max: 6, unidad: "", rotulo: "potencia de diez del multiplicador" }
      y: { min: 0.1, max: 1000000000, unidad: Ω, rotulo: "R", escala: log }
      curvas:
        - { expr: "cifras2*10^x", color: azul, rotulo: "mismas cifras, otro multiplicador" }
      lectura: { valor: R, rotulo: "Valor" }
      ocultar: true
    opciones:
      - texto: "1 Ω ±5 %"
        bien: true
        porque: "Como multiplicador, el dorado es × 0,1: 10 × 0,1 = 1 Ω. Como última banda, ±5 %."
      - texto: "10 Ω ±5 %"
        porque: "Ha ignorado el multiplicador dorado: × 0,1 divide por diez las dos cifras."
      - texto: "0,1 Ω ±5 %"
        porque: "Eso sería el plateado, × 0,01. El dorado divide por diez."
    comprobar:
      - { R: 1 }
      - { con: { m: 0 }, R: 10 }
      - { con: { m: -2 }, R: 0.1 }

  - id: empareje-tolerancia
    tipo: pregunta
    fase: "Empareje"
    titulo: "La banda de tolerancia"
    texto: "Los colores de tolerancia son distintos. Empareje cada color con su tolerancia."
    libro: [70]
    emparejar:
      - ["Dorado", "5 %"]
      - ["Plateado", "10 %"]
      - ["Marrón", "1 %"]
      - ["Rojo", "2 %"]
    exito: "Eso es. Si ve un dorado o un plateado en un extremo, ese es el final."
    pistas:
      - { texto: "Los dos metálicos son las tolerancias más amplias; el marrón, la más estrecha." }

  - id: ordene-criterios
    tipo: pregunta
    fase: "Ordene"
    titulo: "¿Por dónde se empieza?"
    texto: "La dificultad no es la tabla: es saber por qué extremo leer. Ordene los criterios del más fiable al menos fiable."
    libro: [70, 71]
    ordenar:
      - "La banda de tolerancia está separada por un espacio mayor."
      - "El dorado y el plateado nunca son la primera banda."
      - "El cuerpo: beige en carbón, azul claro en película metálica."
    exito: "Ese es el orden. Si aún duda, lea en los dos sentidos: un extremo dará 4,7 kΩ y el otro un número absurdo."
    pistas:
      - { texto: "El criterio principal es el espacio; el color del cuerpo, el último." }

  - id: cinco-bandas
    tipo: pregunta
    titulo: "Cinco bandas"
    texto: "Marrón, negro, negro, marrón y marrón. Es de cinco bandas. ¿Cuánto vale?"
    libro: [74, 78]
    opciones:
      - texto: "1 kΩ ±1 %"
        bien: true
        porque: "Tres dígitos, 100; el cuarto marrón multiplica por 10; el último, ±1 %."
      - texto: "100 Ω ±1 %"
        porque: "Ha tomado el cuarto marrón como tolerancia. Con cinco bandas, el cuarto es el multiplicador, × 10."
      - texto: "10 Ω ±1 %"
        porque: "La ha leído como de cuatro bandas. Con cinco hay tres dígitos: 1, 0 y 0."

  - id: por-que-colores
    tipo: porque
    titulo: "¿Por qué colores?"
    texto: "Las resistencias axiales llevan un siglo marcadas con bandas, según la IEC 60062. ¿Por qué no cifras impresas?"
    libro: [67]
    opciones:
      - texto: "Son pequeñas para cifras legibles, y las bandas se leen en cualquier orientación"
        bien: true
        porque: "Las bandas de color resuelven los dos problemas a la vez."
      - texto: "Porque los colores no se borran con el calor"
        porque: "Al contrario: el cuerpo oscurece al calentarse y el naranja y el rojo se confunden."
      - texto: "Porque los colores dicen el valor real medido"
        porque: "El color solo dice el valor nominal. Una sobrecarga puede cambiar el valor y dejar las bandas intactas."

  - id: duda-de-color
    tipo: pregunta
    titulo: "¿Rojo o naranja?"
    texto: "Una resistencia que se ha calentado tiene una banda entre rojo y naranja. ¿Qué hace?"
    libro: [80, 81, 82]
    opciones:
      - texto: "Medirla con el multímetro"
        bien: true
        porque: "Es siempre la respuesta definitiva y tarda cinco segundos."
      - texto: "Mirarla con luz cálida"
        porque: "Con luz cálida se confunden aún más el azul y el violeta. Mejor luz blanca fría, y ante la duda, medir."
      - texto: "Fiarse del color: dice su valor"
        porque: "El color solo dice el nominal. Si mide más, está deteriorada; si mide menos, puede tener algo en paralelo."

  - id: empareje-otros
    tipo: pregunta
    fase: "Empareje"
    titulo: "El mismo código, otros componentes"
    texto: "El código de colores no es exclusivo de las resistencias. Empareje cada componente con lo que codifican sus bandas."
    libro: [84]
    emparejar:
      - ["Resistencia", "Su valor en ohmios"]
      - ["Algunas bobinas", "Su valor en microhenrios"]
      - ["Algunos diodos Zener", "Su tensión"]
    exito: "Eso es. La forma del cuerpo y el material aclaran qué componente es."
    pistas:
      - { texto: "En los Zener, las bandas no son una resistencia." }

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [70, 73, 74, 76, 81]
    ideas:
      - { titulo: "Estructura.", texto: "Cuatro bandas: dos dígitos, multiplicador y tolerancia. Cinco: tres dígitos." }
      - { titulo: "El orden.", texto: "Negro 0 a blanco 9, el del espectro; dorado × 0,1 y plateado × 0,01 como multiplicador." }
      - { titulo: "Por dónde.", texto: "La tolerancia está más separada; el dorado y el plateado nunca son la primera." }
      - { titulo: "Ante la duda.", texto: "Medir con el multímetro: el color solo dice el nominal." }
