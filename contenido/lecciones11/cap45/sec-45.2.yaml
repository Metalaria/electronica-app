# Lección 1.2 de la sección 46.2 «El LED: Polarización y Brillo» (cap45, sec-45.2). Formato: GUIA.md.
# - LED con resistencia (esquema «led», caída constante): I = (V − V_f)/R (bloque 33); 5 V, 2 V y 300 Ω → 10 mA (figura
#   46.2); ejercicio 46.1: con 330 Ω, unos 9 mA.
# - Tabla del bloque 35: LED blanco de 3,1 V, variación de I si V_f cambia ± 0,3 V = 0,3/(V − 3,1): ± 3,4 % con 12 V,
#   ± 16 % con 5 V, + 150 % con 3,3 V. La gráfica usa los 350 mA nominales de la figura 46.3.
# - El diseño: LED blanco de 3,1 V a 20 mA (el indicador del bloque 42) con V_f ± 0,3 V (± 9,68 %); la banda de ± 10 %
#   de la corriente es de ejemplo (la regla del libro es que R caiga al menos un 20 o 30 % de la alimentación).
# - Rendimiento con 12 V, 3,1 V y 350 mA: 3,12 W en R frente a 1,09 W en el LED, el 74 % en calor (bloques 40 a 42).
# Pasos prácticos: «diseno» del LED blanco con la tolerancia de V_f (la alimentación de 12 V es la única que cumple; con
# 5 V y 100 Ω cumple en nominal y no con ± 0,3 V: la trampa, con su «si_tolerancias») y
# «banco» opcional: la corriente de un LED rojo desde 5 V con 300 Ω.
leccion: cap45/sec-45.2

libro:
  32: "Un LED se alimenta con corriente"
  33: 'R = (V_("alim") - V_("f"))/(I)'
  35: "Variación de I si Vf cambia ±0,3 V"
  36: "Cuanto menor es la caída sobre la resistencia, más dependiente es la corriente de la tensión del LED"
  37: "la resistencia debe dejar caer al menos un 20 o 30 % de la alimentación"
  39: "Con 12 V, 3,1 V de LED y 350 mA"
  40: '"1,09 W"'
  41: '"3,12 W"'
  42: "El 74 % de la energía se convierte en calor en una resistencia"
  46: "Rendimiento superior al 90 %, y es la única opción sensata para iluminación"
  49: "Bajar la corriente cambia el punto de trabajo del LED, y con él la longitud de onda dominante y la temperatura de color"
  50: "el LED trabaja siempre a su corriente nominal o apagado, y el ojo promedia"
  51: "por encima de unos 200 Hz para que no se perciba parpadeo, y por encima de 1 kHz"
  54: "cada 10 °C por encima la divide por dos"
  58: "Iluminancia, en lux (lx = lm/m²)"
  62: "el de menor Vf se lleva más corriente, luce más, se calienta, baja aún más su Vf y agrava el desequilibrio"
  64: "medir la corriente de dos LED del mismo modelo alimentados por la misma resistencia desde 5 V"
  66: "Con 5 V de fuente, 2 V de caída y 300 Ω, circulan 10 mA"
  "cap45#391": "con 330 Ω la corriente baja a unos 9 mA"

modelo:
  valores:
    V_a: { sim: "V", nombre: "alimentación", unidad: V, valor: 5 }
    R_e: { sim: "R", nombre: "resistencia en serie", unidad: Ω, valor: 300 }
    V_f: { sim: "V_{f}", nombre: "tensión directa del LED", unidad: V, valor: 2 }
    V_b: { sim: "V", nombre: "alimentación del LED blanco", unidad: V, valor: 5 }
    R_b: { sim: "R", nombre: "resistencia del LED blanco", unidad: Ω, valor: 150 }
    V_w: { sim: "V_{f}", nombre: "tensión directa del LED blanco", unidad: V, valor: 3.1 }
    V_g: { sim: "V", nombre: "alimentación en la gráfica", unidad: V, valor: 5 }
  calculos:
    I_e: { expr: "max(0, (V_a - V_f)/R_e)", sim: "I", nombre: "corriente del LED", unidad: A }
    I_w: { expr: "max(0, (V_b - V_w)/R_b)", sim: "I", nombre: "corriente del LED blanco", unidad: A }
    R_g: { expr: "(V_g - 3.1)/0.35", sim: "R", nombre: "resistencia para 350 mA", unidad: Ω }
    d_I: { expr: "0.3/(V_g - 3.1)*100", sim: "ΔI", nombre: "variación con ± 0,3 V", unidad: "%" }
    P_R: { expr: "(12 - 3.1)*0.35", sim: "P_{R}", nombre: "potencia en la resistencia", unidad: W }
    P_L: { expr: "3.1*0.35", sim: "P_{LED}", nombre: "potencia en el LED", unidad: W }
    e_c: { expr: "100*P_R/(P_R + P_L)", sim: "calor", nombre: "fracción que se va en calor", unidad: "%" }

tarjetas:
  - id: explore-led
    tipo: explorar
    titulo: "Un LED se alimenta con corriente"
    texto: "Un LED rojo de 2 V desde 5 V: la resistencia fija la corriente. Cámbiela."
    libro: [32, 66]
    fijar: { V_f: 2, V_a: 5 }
    widget:
      tipo: circuito
      esquema: led
      piezas: { fuente: V_a, r: R_e, vf: V_f }
      lectura: { valor: I_e, rotulo: "Corriente del LED" }
      corriente: I_e
      mide: { corriente: I_e, vf: V_f }
      mandos:
        - { valor: R_e, serie: E24, min: 100, max: 1000, rotulo: "R (E24)" }
    requiere: { mover: [R_e] }

  - id: formula-r
    tipo: formula
    titulo: "La resistencia en serie"
    texto: "Lo que sobra de la alimentación cae en la resistencia, al ritmo de la corriente."
    libro: [33, 66]
    ec: 33
    sustitucion: "({{V_a}} − {{V_f}}) / {{R_e}} = {{I_e}}"
    widget:
      tipo: circuito
      esquema: led
      piezas: { fuente: V_a, r: R_e, vf: V_f }
      lectura: { valor: I_e, rotulo: "Corriente del LED" }
      corriente: I_e
      mide: { corriente: I_e, vf: V_f }
      mandos:
        - { valor: V_a, lista: [5, 12], rotulo: "Alimentación" }
        - { valor: R_e, serie: E24, min: 100, max: 1000, rotulo: "R (E24)" }

  - id: reto-330
    tipo: reto
    titulo: "Un valor normalizado"
    texto: "LED rojo de 2,0 V a 10 mA desde 5 V. Elija la resistencia E12 más próxima que no pase de 10 mA."
    libro: [33, "cap45#391"]
    fijar: { V_a: 5, V_f: 2 }
    inicio: { R_e: 150 }
    widget:
      tipo: circuito
      esquema: led
      piezas: { fuente: V_a, r: R_e, vf: V_f }
      lectura: { valor: I_e, rotulo: "Corriente del LED" }
      corriente: I_e
      mide: { corriente: I_e, vf: V_f }
      mandos:
        - { valor: R_e, serie: E12, min: 100, max: 1000, rotulo: "R (E12)" }
    condiciones:
      - { valor: I_e, max: 0.01, rotulo: "Sin pasar de 10 mA" }
      - { valor: I_e, min: 0.009, rotulo: "Unos 9 mA o más" }
    exito: "330 Ω: unos 9 mA, perfectamente válido. El cálculo daba 300 Ω, que no está en la E12."
    pistas:
      - { cuando: { valor: I_e, mayor: 0.01 }, texto: "Pasa de 10 mA: suba la resistencia." }
      - { cuando: { valor: I_e, menor: 0.009 }, texto: "Se queda corta: hay un valor E12 más próximo." }
    escalera:
      - "R = (5 − 2,0)/0,010 = 300 Ω; elija el E12 inmediatamente por encima."
    solucion: "330 Ω: unos 9 mA."
    comprobar:
      - { con: { R_e: 330 }, I_e: 0.00909 }
      - { con: { R_e: 300 }, I_e: 0.01 }

  - id: explore-caida
    tipo: explorar
    titulo: "Cuánta tensión cae en R"
    texto: "Un LED blanco de 3,1 V a 350 mA, con R calculada para cada alimentación. Su V_{f} varía: mire cuánto cambia la corriente."
    libro: [35, 36, 39]
    widget:
      tipo: grafica
      x: { id: v, min: 2.8, max: 3.4, unidad: V, rotulo: "V_{f}" }
      y: { min: 0, max: 0.9, unidad: A, rotulo: "I" }
      curvas:
        - { expr: "max(0, (V_g - v)/R_g)", color: naranja, rotulo: "corriente del LED" }
        - { expr: "0.35", color: tinta, rotulo: "nominal", discontinua: true }
      lectura: { valor: d_I, rotulo: "Variación con ± 0,3 V" }
      datos:
        - { valor: R_g, rotulo: "R = {{R_g}}" }
      mandos:
        - { valor: V_g, lista: [12, 5, 3.3], rotulo: "Alimentación" }
    requiere: { mover: [V_g] }
    comprobar:
      - { con: { V_g: 12 }, d_I: 3.37 }
      - { con: { V_g: 5 }, d_I: 15.8 }
      - { con: { V_g: 3.3 }, d_I: 150 }

  - id: predecir-33
    tipo: predecir
    titulo: "Un LED blanco desde 3,3 V"
    texto: "Se alimenta un LED blanco de 3,1 V desde 3,3 V con una resistencia. ¿Qué tal funciona?"
    libro: [35, 37]
    widget:
      tipo: figura
      figura: fig-45.3
      zonas:
        - { id: izquierda, rotulo: "Gráfica de la izquierda", rect: [0, 0, 222, 198] }
    opciones:
      - texto: "Es inviable: +150 % o apagado según el LED"
        bien: true
        porque: "En R caen 0,2 V; una variación de 0,3 V en V_{f} la dispara o la anula."
      - texto: "Bien: sobra tensión"
        porque: "Sobran solo 0,2 V: la corriente depende entera de V_{f}."
      - texto: "Regular: ± 16 %"
        porque: "Eso es con 5 V, donde en R caen 1,9 V."
    escalera:
      - "Compare 0,3 V de variación con lo que cae en R."
    solucion: "Inviable: R debe dejar caer al menos un 20 o 30 % de la alimentación."

  - id: disene-blanco
    tipo: diseno
    titulo: "Un indicador blanco que no varíe"
    texto: "LED blanco de 3,1 V a 20 mA ± 10 %, aunque V_{f} varíe ± 0,3 V entre unidades. Elija alimentación y resistencia E24."
    nota: "La banda de ± 10 % es de ejemplo."
    libro: [35, 37, 42]
    inicio: { V_b: 5, R_b: 150 }
    widget:
      tipo: circuito
      esquema: led
      piezas: { fuente: V_b, r: R_b, vf: V_w }
      lectura: { valor: I_w, rotulo: "Corriente del LED" }
      corriente: I_w
      mide: { corriente: I_w, vf: V_w }
      mandos:
        - { valor: V_b, lista: [3.3, 5, 12], rotulo: "Alimentación" }
        - { valor: R_b, serie: E24, min: 100, max: 1000, rotulo: "R (E24)" }
    condiciones:
      - { valor: I_w, objetivo: 0.02, tol: 0.1, rotulo: "Corriente: {{I_w}}" }
    diseno:
      tolerancias: { V_w: 0.0968 }
      metodo: esquinas
      exigir: todas
      si_tolerancias: "Con la V_{f} nominal cumple, pero con ± 0,3 V se sale: en R cae poco. Suba la alimentación."
    exito: "Con 12 V caen 8,9 V en R: la corriente apenas nota la V_{f}."
    pistas:
      - { cuando: { valor: I_w, mayor: 0.022 }, texto: "Demasiada corriente: suba R." }
      - { texto: "Poca corriente: baje R, o suba la alimentación." }
    escalera:
      - "Con 5 V la corriente varía ± 16 %; con 12 V, ± 3,4 %."
      - "Con 12 V, R = 8,9 V / 20 mA: el E24 más próximo."
    solucion: "12 V y 430 o 470 Ω."
    comprobar:
      - { con: { V_b: 12, R_b: 430 }, I_w: 0.0207 }
      - { con: { V_b: 12, R_b: 470 }, I_w: 0.0189 }

  - id: estime-calor
    tipo: pregunta
    titulo: "El rendimiento con resistencia"
    texto: "LED de 3,1 V a 350 mA desde 12 V con resistencia. ¿Qué parte de la energía acaba en calor en R?"
    libro: [39, 40, 41, 42, 46]
    widget:
      tipo: figura
      figura: fig-45.3
      zonas:
        - { id: izquierda, rotulo: "Gráfica de la izquierda", rect: [0, 0, 222, 198] }
    estimar:
      objetivo: "e_c"
      unidad: "%"
      min: 0
      max: 100
      paso: 1
      inicio: 20
      tol: 0.04
      rotulo: "Energía perdida en R"
    exito: "El 74 %: 3,12 W en R frente a 1,09 W en el LED. Para iluminación, un driver conmutado."
    pistas:
      - { cuando: { valor: estimacion, mayor: 77 }, texto: "Demasiado: el LED se queda 3,1 de los 12 V." }
      - { texto: "Demasiado poco: en R caen 8,9 de los 12 V." }
    escalera:
      - "Con la misma corriente, la potencia se reparte como las tensiones."
    solucion: "8,9/12 = 74 %."
    comprobar:
      - { P_R: 3.115, P_L: 1.085, e_c: 74.2 }

  - id: porque-pwm
    tipo: porque
    titulo: "Atenuar por PWM"
    texto: "¿Por qué se atenúa un LED con PWM y no bajando la corriente?"
    libro: [49, 50, 51]
    widget:
      tipo: figura
      figura: fig-45.3
      zonas:
        - { id: derecha, rotulo: "Gráfica de la derecha", rect: [222, 0, 222, 198] }
    opciones:
      - texto: "Bajar la corriente cambia el color; con PWM el LED va siempre a su corriente nominal"
        bien: true
        porque: "El ojo promedia; por encima de 200 Hz no hay parpadeo, y de 1 kHz ni en vídeo."
      - texto: "Porque el PWM gasta menos"
        porque: "La ventaja específica es el color constante, no el consumo."
      - texto: "Porque el LED no admite menos corriente"
        porque: "Sí la admite, pero cambia su longitud de onda y su temperatura de color."
    escalera:
      - "Mire la gráfica de la derecha: ¿qué cambia al bajar la corriente?"
    solucion: "El color: con PWM, constante."

  - id: pregunta-vida
    tipo: pregunta
    titulo: "La temperatura decide la vida"
    texto: "La vida L70 de un LED se da a una temperatura de unión. ¿Qué pasa si trabaja 10 °C por encima?"
    libro: [54]
    widget:
      tipo: figura
      figura: fig-45.3
      zonas:
        - { id: izquierda, rotulo: "Gráfica de la izquierda", rect: [0, 0, 222, 198] }
    opciones:
      - texto: "Su vida se divide por dos"
        bien: true
        porque: "Arrhenius: cada 10 °C por encima de la especificación la parte por la mitad."
      - texto: "Nada: la vida no depende de la temperatura"
        porque: "Depende, y mucho: el diseño térmico decide si dura veinte mil horas o dos mil."
      - texto: "Alumbra más"
        porque: "Al revés: el flujo luminoso cae al calentarse."
    escalera:
      - "La especificación L70 va ligada a una temperatura de unión concreta."
    solucion: "La mitad de vida por cada 10 °C de más."

  - id: empareje-unidades
    tipo: pregunta
    titulo: "Lumen, candela y lux"
    texto: "Empareje cada unidad con la pregunta que responde."
    libro: [58]
    widget:
      tipo: figura
      figura: fig-45.3
      zonas:
        - { id: izquierda, rotulo: "Gráfica de la izquierda", rect: [0, 0, 222, 198] }
    emparejar:
      - ["Lumen", "Cuánta luz emite en total"]
      - ["Candela", "Cuánta luz emite en una dirección"]
      - ["Lux", "Cuánta luz llega a una superficie"]
    exito: "Comparar LED por sus milicandelas sin mirar el ángulo es comparar cosas distintas."
    pistas:
      - { texto: "El luxómetro mide lo que llega a la mesa." }
    escalera:
      - "Un LED indicador se da en milicandelas; una bombilla, en lúmenes."
    solucion: "Lumen, total; candela, dirección; lux, superficie."

  - id: predecir-paralelo
    tipo: predecir
    titulo: "Dos LED con una resistencia"
    texto: "Dos LED iguales en paralelo con una sola resistencia. ¿Qué pasa con el tiempo?"
    libro: [62]
    widget:
      tipo: figura
      figura: fig-45.2
      zonas:
        - { id: todo, rotulo: "LED con su resistencia", rect: [0, 0, 349, 169] }
    opciones:
      - texto: "El de menor V_{f} se lleva más corriente, se calienta y agrava el desequilibrio"
        bien: true
        porque: "Al calentarse baja más su V_{f}: una cada rama, su resistencia."
      - texto: "Se reparten la corriente a medias"
        porque: "Sus curvas exponenciales no son idénticas: nunca a medias."
      - texto: "Lucen la mitad pero bien"
        porque: "Uno lucirá más que otro, y la diferencia crece al calentarse."
    escalera:
      - "Dos exponenciales casi iguales en paralelo."
    solucion: "Desequilibrio que se realimenta: una resistencia por rama."

  - id: banco-led
    tipo: banco
    titulo: "Dos LED, la misma resistencia"
    texto: "Monte un LED rojo desde 5 V con 300 Ω y mida la corriente. Repita con otro LED del mismo modelo."
    libro: [64, 66]
    fijar: { V_a: 5, V_f: 2, R_e: 300 }
    banco:
      piezas: ["Fuente de 5 V", "R de 300 Ω", "Dos LED rojos del mismo modelo", "Multímetro en mA"]
      medir: "La corriente de cada LED, uno detrás de otro."
      esperado: I_e
      unidad: A
      tol: 0.15
      consejos:
        - { cuando: { valor: desviacion, mayor: 0.15 }, texto: "Mide de más: su LED tendrá menos V_{f} que 2 V, o la fuente da más de 5 V." }
        - { cuando: { valor: desviacion, menor: -0.15 }, texto: "Mide de menos: su V_{f} será mayor, o la resistencia es otra." }
        - { texto: "Cerca de 10 mA. Compare los dos LED: difieren algo; desde 12 V con R recalculada coincidirían mejor." }
    comprobar:
      - { I_e: 0.01 }

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [33, 37, 42, 50, 62]
    ideas:
      - { titulo: "Corriente, no tensión.", texto: "R = (V − V_{f})/I: 300 Ω para 10 mA desde 5 V." }
      - { titulo: "Que caiga en R.", texto: "Al menos un 20 o 30 % de la alimentación; desde 3,3 V, inviable." }
      - { titulo: "Calor y color.", texto: "Con resistencia, el 74 % se pierde; se atenúa por PWM." }
      - { titulo: "En paralelo, no.", texto: "Una resistencia o un driver por rama." }
