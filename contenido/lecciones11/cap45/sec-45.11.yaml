# Lección 1.2 de la sección 46.11 «Resumen del Capítulo» (cap45, sec-45.11). Formato: GUIA.md.
# Repaso de las seis ideas (figura 46.20), los errores característicos y los enlaces con otros capítulos.
# Paso práctico: «tocar» la idea que explica el mando a distancia bajo el sol.
# 1.2.1 (autor121-senpro, «aprender haciendo», GUIA §13): en la figura 46.20 se tocan la idea que hace inviable el LED
# blanco desde 3,3 V, la del mando bajo el sol y la del final de vida; se busca la alimentación que dispara la corriente
# (+150 %, el modelo de la 46.2) y se cuentan los órdenes de magnitud entre 1 ns y 100 ms (de ejemplo). Sin preguntas
# de opciones; quedan los dos emparejar (errores y capítulos).
leccion: cap45/sec-45.11

libro:
  327: "sus ideas centrales se pueden resumir en seis"
  328: "desde 3,3 V a un LED blanco es directamente inviable"
  329: "es el que decide si el producto dura veinte mil horas o dos mil"
  330: "Ocho órdenes de magnitud separan al más rápido del más lento"
  331: "la defensa más eficaz no es el filtro sino modular la fuente y detectar solo a esa frecuencia"
  332: "su problema real no es la temporización sino la alimentación: 60 mA por unidad"
  333: "un diseño debe funcionar con su valor de final de vida"
  335: "Alimentar una tira direccionable por un solo extremo"
  337: "el LED usa la exponencial del capítulo 5, el driver usa la conmutación del 7"
  338: "las decisiones de un capítulo rara vez se pueden tomar sin las de los demás"
  "cap45#35": "Variación de I si Vf cambia ±0,3 V"
  "cap45#39": "Con 12 V, 3,1 V de LED y 350 mA"

modelo:
  valores:
    V_g: { sim: "V", nombre: "alimentación del LED blanco", unidad: V, valor: 12 }
    t_r: { sim: "t_{rápido}", nombre: "tiempo del fotodiodo", unidad: s, valor: 0.000000001 }
    t_l: { sim: "t_{lento}", nombre: "tiempo de la LDR", unidad: s, valor: 0.1 }
  calculos:
    d_I: { expr: "0.3/(V_g - 3.1)*100", sim: "ΔI", nombre: "variación con ± 0,3 V", unidad: "%" }
    o_m: { expr: "log10(t_l/t_r)", sim: "órdenes", nombre: "órdenes de magnitud", unidad: "" }
    o_x: { expr: "log10(t_l/(t_r*1000))", sim: "órdenes", nombre: "con microsegundos", unidad: "" }

tarjetas:
  - id: explore-ideas
    tipo: tocar
    titulo: "Seis ideas"
    texto: "El capítulo se resume en seis ideas. Toque la que hace inviable alimentar un LED blanco desde 3,3 V con una resistencia."
    libro: [327, 328, 329, 330, 331, 332, 333]
    widget:
      tipo: figura
      figura: fig-45.20
      zonas: &zonas-ideas
        - { id: led, rotulo: "Arriba a la izquierda", rect: [3, 2, 222, 45] }
        - { id: temperatura, rotulo: "Arriba a la derecha", rect: [231, 2, 220, 45] }
        - { id: detectores, rotulo: "En medio a la izquierda", rect: [3, 52, 222, 45] }
        - { id: ambiente, rotulo: "En medio a la derecha", rect: [231, 52, 220, 45] }
        - { id: multiplexar, rotulo: "Abajo a la izquierda", rect: [3, 102, 222, 45] }
        - { id: aislamiento, rotulo: "Abajo a la derecha", rect: [231, 102, 220, 45] }
    tocar:
      bien: [led]
      porque:
        temperatura: "La temperatura decide la vida: veinte mil horas o dos mil."
        detectores: "Es la de los detectores."
        ambiente: "Es la de la luz ambiente."
        multiplexar: "Es la de los displays."
        aislamiento: "Es la del optoacoplador."
    exito: "Un LED se alimenta con corriente: si en la resistencia cae poco, la corriente depende entera de V_{f}."
    escalera:
      - "¿Qué fija la corriente de un LED?"
    solucion: "Arriba a la izquierda."

  - id: explore-blanco
    tipo: explorar
    titulo: "Un LED blanco desde 3,3 V"
    texto: "LED blanco de 3,1 V con resistencia, y su V_{f} varía ± 0,3 V. Busque la alimentación con la que la corriente se dispara un 150 %."
    libro: [328, "cap45#35", "cap45#39"]
    inicio: { V_g: 12 }
    widget:
      tipo: grafica
      x: { id: v, min: 3.2, max: 12, unidad: V, rotulo: "V" }
      y: { min: 0, max: 160, unidad: "%", rotulo: "ΔI" }
      curvas:
        - { expr: "0.3/(v - 3.1)*100", color: naranja, rotulo: "variación de la corriente" }
      marcas:
        - { x: "V_g", y: "d_I", rotulo: "{{d_I}}" }
      lectura: { valor: d_I, rotulo: "Variación con ± 0,3 V" }
      mandos:
        - { valor: V_g, lista: [12, 5, 3.3], rotulo: "Alimentación" }
    objetivo:
      condiciones:
        - { valor: d_I, min: 140, rotulo: "± {{d_I}}" }
      logrado: "Con {{V_g}}, {{d_I}}: directamente inviable."
      pistas:
        - { texto: "Aún cae bastante en la resistencia: baje la alimentación." }
    escalera:
      - "Cuanto menos cae en R, más depende la corriente de V_{f}."
    solucion: "3,3 V: +150 %."
    comprobar:
      - { con: { V_g: 3.3 }, d_I: 150 }
      - { con: { V_g: 12 }, d_I: 3.37 }

  - id: empareje-errores
    tipo: pregunta
    titulo: "Los errores característicos"
    texto: "Empareje cada error con lo que provoca."
    libro: [335]
    widget:
      tipo: figura
      figura: fig-45.20
      zonas:
        - { id: todo, rotulo: "Las seis ideas", rect: [0, 0, 453, 187] }
    emparejar:
      - ["LED en paralelo con una resistencia", "Uno se lleva la corriente y se calienta"]
      - ["Tira alimentada por un extremo", "Los últimos, oscuros y rojizos"]
      - ["Optoacoplador con el CTR típico", "Deja de funcionar al envejecer"]
      - ["Láser sin lazo de control", "Se destruye"]
      - ["Detector sin apantallar ni modular", "Lee la luz ambiente"]
    exito: "Cada uno tiene su lección en el capítulo."
    pistas:
      - { texto: "Una tira larga cae tensión." }
    escalera:
      - "Piense en cada uno como el contrario de una de las seis ideas."
    solucion: "Paralelo, desequilibrio; un extremo, rojizos; CTR típico, envejece; sin lazo, se destruye; sin modular, luz ambiente."

  - id: toque-mando
    tipo: tocar
    titulo: "Bajo el sol"
    texto: "Toque la idea que explica por qué un mando a distancia funciona a pleno sol."
    libro: [331]
    widget:
      tipo: figura
      figura: fig-45.20
      zonas: *zonas-ideas
    tocar:
      bien: [ambiente]
      porque:
        led: "Habla de cómo alimentar un LED, no de cómo distinguirse del sol."
        temperatura: "Es la vida del LED; no explica el rechazo de la luz ambiente."
        detectores: "Elegir detector importa, pero lo que vence al sol es la modulación."
        multiplexar: "Es de displays, no de detectar luz."
        aislamiento: "Es del optoacoplador y su CTR."
    exito: "Modular la fuente y detectar solo a esa frecuencia."
    escalera:
      - "¿Qué hace el mando que el sol no hace?"
    solucion: "En medio a la derecha: la luz ambiente se vence modulando."

  - id: pregunta-ordenes
    tipo: simular
    titulo: "Del más rápido al más lento"
    texto: "Un fotodiodo responde en 1 ns y una LDR en 100 ms. ¿Cuántos órdenes de magnitud los separan?"
    nota: "Tiempos de ejemplo."
    libro: [330]
    fijar: { t_r: 0.000000001, t_l: 0.1 }
    widget:
      tipo: figura
      figura: fig-45.20
      zonas:
        - { id: detectores, rotulo: "En medio a la izquierda", rect: [3, 52, 222, 45] }
    simular:
      objetivo: o_m
      unidad: ""
      tol: 0.02
      rotulo: "Órdenes de magnitud"
      errores:
        - { expr: "o_x", texto: "Revise las unidades: nanosegundos, no microsegundos." }
    exito: "Ocho órdenes de magnitud: la velocidad es justo lo que más separa a los detectores."
    escalera:
      - "Logaritmo decimal del cociente."
    solucion: "log(100 ms / 1 ns) = 8."
    comprobar:
      - { o_m: 8, o_x: 5 }

  - id: porque-final-vida
    tipo: tocar
    titulo: "El valor de final de vida"
    texto: "Un diseño con optoacoplador se calcula con el CTR de final de vida. Toque la idea que lo explica."
    libro: [333]
    widget:
      tipo: figura
      figura: fig-45.20
      zonas: *zonas-ideas
    tocar:
      bien: [aislamiento]
      porque:
        led: "Es la de alimentar un LED con corriente."
        temperatura: "Habla de la vida del LED de iluminación, no del CTR."
        detectores: "Es la de los detectores."
        ambiente: "Es la de la luz ambiente."
        multiplexar: "Es la de los displays."
    exito: "El CTR cae con el tiempo y con la corriente: el diseño debe funcionar también al final. Los aisladores digitales no tienen ese problema."
    escalera:
      - "Busque la idea del aislamiento."
    solucion: "Abajo a la derecha."

  - id: empareje-cruce
    tipo: pregunta
    titulo: "Un cruce de capítulos"
    texto: "Empareje cada pieza del capítulo con el capítulo del que depende."
    libro: [337, 338]
    widget:
      tipo: figura
      figura: fig-45.20
      zonas:
        - { id: todo, rotulo: "Las seis ideas", rect: [0, 0, 453, 187] }
    emparejar:
      - ["El LED", "La exponencial del capítulo 5"]
      - ["El driver", "La conmutación del 7"]
      - ["El multiplexado", "La temporización del 39"]
      - ["El aislamiento", "El bucle de tierra del 32"]
      - ["La fibra", "Las líneas de transmisión del 37"]
    exito: "Las decisiones de un capítulo rara vez se toman sin las de los demás."
    pistas:
      - { texto: "La fibra es una guía de onda, como una línea." }
    escalera:
      - "El driver conmutado es un convertidor."
    solucion: "LED, 5; driver, 7; multiplexado, 39; aislamiento, 32; fibra, 37."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [328, 329, 331, 332, 333]
    ideas:
      - { titulo: "Emisores.", texto: "Corriente, PWM y diseño térmico." }
      - { titulo: "Detectores.", texto: "Tres compromisos; contra la luz ambiente, modular." }
      - { titulo: "Displays.", texto: "Multiplexar cuesta pico; los direccionables, alimentación." }
      - { titulo: "Aislar.", texto: "El CTR envejece: final de vida o aislador digital." }
