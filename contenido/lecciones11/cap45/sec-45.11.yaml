# Lección 1.2 de la sección 46.11 «Resumen del Capítulo» (cap45, sec-45.11). Formato: GUIA.md.
# Repaso de las seis ideas (figura 46.20), los errores característicos y los enlaces con otros capítulos.
# Paso práctico: «tocar» la idea que explica el mando a distancia bajo el sol.
leccion: cap45/sec-45.11

libro:
  327: "sus ideas centrales se pueden resumir en seis"
  328: "desde 3,3 V a un LED blanco es directamente inviable"
  329: "es el que decide si el producto dura veinte mil horas o dos mil"
  330: "Ocho órdenes de magnitud separan al más rápido del más lento"
  331: "la defensa más eficaz no es el filtro sino modular la fuente y detectar solo a esa frecuencia"
  332: "su problema real no es la temporización sino la alimentación: 60 mA por unidad"
  333: "un diseño debe funcionar con su valor de final de vida"
  335: "Alimentar una tira direccionable por un solo extremo"
  337: "el LED usa la exponencial del capítulo 5, el driver usa la conmutación del 7"
  338: "las decisiones de un capítulo rara vez se pueden tomar sin las de los demás"

modelo: { valores: {}, calculos: {} }

tarjetas:
  - id: explore-ideas
    tipo: explorar
    titulo: "Seis ideas"
    texto: "El capítulo se resume en seis ideas. Toque al menos cuatro."
    libro: [327, 328, 329, 330, 331, 332, 333]
    widget:
      tipo: figura
      figura: fig-45.20
      zonas:
        - { id: led, rotulo: "Arriba a la izquierda", rect: [3, 2, 222, 45], texto: "Un LED se alimenta con corriente; brillo por PWM." }
        - { id: temperatura, rotulo: "Arriba a la derecha", rect: [231, 2, 220, 45], texto: "La temperatura decide la vida: veinte mil horas o dos mil." }
        - { id: detectores, rotulo: "En medio a la izquierda", rect: [3, 52, 222, 45], texto: "Fotodiodo para medir, fototransistor para detectar, LDR para lo que no exija nada." }
        - { id: ambiente, rotulo: "En medio a la derecha", rect: [231, 52, 220, 45], texto: "La luz ambiente es el enemigo: modular la fuente." }
        - { id: multiplexar, rotulo: "Abajo a la izquierda", rect: [3, 102, 222, 45], texto: "Multiplexar cuesta corriente de pico; los direccionables, alimentación." }
        - { id: aislamiento, rotulo: "Abajo a la derecha", rect: [231, 102, 220, 45], texto: "El CTR cae con el tiempo: diseñar con el de final de vida." }
    requiere: { mover: [led, temperatura, detectores, ambiente] }

  - id: empareje-errores
    tipo: pregunta
    titulo: "Los errores característicos"
    texto: "Empareje cada error con lo que provoca."
    libro: [335]
    widget:
      tipo: figura
      figura: fig-45.20
      zonas:
        - { id: todo, rotulo: "Las seis ideas", rect: [0, 0, 453, 187] }
    emparejar:
      - ["LED en paralelo con una resistencia", "Uno se lleva la corriente y se calienta"]
      - ["Tira alimentada por un extremo", "Los últimos, oscuros y rojizos"]
      - ["Optoacoplador con el CTR típico", "Deja de funcionar al envejecer"]
      - ["Láser sin lazo de control", "Se destruye"]
      - ["Detector sin apantallar ni modular", "Lee la luz ambiente"]
    exito: "Cada uno tiene su lección en el capítulo."
    pistas:
      - { texto: "Una tira larga cae tensión." }
    escalera:
      - "Piense en cada uno como el contrario de una de las seis ideas."
    solucion: "Paralelo, desequilibrio; un extremo, rojizos; CTR típico, envejece; sin lazo, se destruye; sin modular, luz ambiente."

  - id: toque-mando
    tipo: tocar
    titulo: "Bajo el sol"
    texto: "Toque la idea que explica por qué un mando a distancia funciona a pleno sol."
    libro: [331]
    widget:
      tipo: figura
      figura: fig-45.20
      zonas:
        - { id: led, rotulo: "Arriba a la izquierda", rect: [3, 2, 222, 45] }
        - { id: temperatura, rotulo: "Arriba a la derecha", rect: [231, 2, 220, 45] }
        - { id: detectores, rotulo: "En medio a la izquierda", rect: [3, 52, 222, 45] }
        - { id: ambiente, rotulo: "En medio a la derecha", rect: [231, 52, 220, 45] }
        - { id: multiplexar, rotulo: "Abajo a la izquierda", rect: [3, 102, 222, 45] }
        - { id: aislamiento, rotulo: "Abajo a la derecha", rect: [231, 102, 220, 45] }
    tocar:
      bien: [ambiente]
      porque:
        led: "Habla de cómo alimentar un LED, no de cómo distinguirse del sol."
        temperatura: "Es la vida del LED; no explica el rechazo de la luz ambiente."
        detectores: "Elegir detector importa, pero lo que vence al sol es la modulación."
        multiplexar: "Es de displays, no de detectar luz."
        aislamiento: "Es del optoacoplador y su CTR."
    exito: "Modular la fuente y detectar solo a esa frecuencia."
    escalera:
      - "¿Qué hace el mando que el sol no hace?"
    solucion: "En medio a la derecha: la luz ambiente se vence modulando."

  - id: pregunta-ordenes
    tipo: predecir
    titulo: "Del más rápido al más lento"
    texto: "Entre el fotodiodo más rápido y la LDR más lenta, ¿cuánta diferencia de velocidad hay?"
    libro: [330]
    widget:
      tipo: figura
      figura: fig-45.20
      zonas:
        - { id: detectores, rotulo: "En medio a la izquierda", rect: [3, 52, 222, 45] }
    opciones:
      - texto: "Ocho órdenes de magnitud"
        bien: true
        porque: "De picosegundos o nanosegundos a cientos de milisegundos."
      - texto: "Unas diez veces"
        porque: "Es muchísimo más: la LDR tarda cientos de milisegundos."
      - texto: "Son igual de rápidos"
        porque: "La velocidad es justo lo que más los separa."
    escalera:
      - "Nanosegundos frente a cientos de milisegundos."
    solucion: "Ocho órdenes de magnitud."

  - id: porque-final-vida
    tipo: porque
    titulo: "El valor de final de vida"
    texto: "¿Por qué un diseño con optoacoplador se calcula con el CTR de final de vida?"
    libro: [333]
    widget:
      tipo: figura
      figura: fig-45.20
      zonas:
        - { id: aislamiento, rotulo: "Abajo a la derecha", rect: [231, 102, 220, 45] }
    opciones:
      - texto: "Porque el CTR cae con el tiempo y con la corriente: debe funcionar también al final"
        bien: true
        porque: "Los aisladores digitales no tienen ese problema, y por eso lo han desplazado."
      - texto: "Porque al principio el CTR es demasiado alto"
        porque: "Un CTR alto no estorba tanto como uno que se queda corto con los años."
      - texto: "Por costumbre"
        porque: "Es una consecuencia directa de la degradación del LED."
    escalera:
      - "¿Qué le pasa al LED del optoacoplador con los años?"
    solucion: "El CTR baja: hay que contar con el valor de final de vida."

  - id: empareje-cruce
    tipo: pregunta
    titulo: "Un cruce de capítulos"
    texto: "Empareje cada pieza del capítulo con el capítulo del que depende."
    libro: [337, 338]
    widget:
      tipo: figura
      figura: fig-45.20
      zonas:
        - { id: todo, rotulo: "Las seis ideas", rect: [0, 0, 453, 187] }
    emparejar:
      - ["El LED", "La exponencial del capítulo 5"]
      - ["El driver", "La conmutación del 7"]
      - ["El multiplexado", "La temporización del 39"]
      - ["El aislamiento", "El bucle de tierra del 32"]
      - ["La fibra", "Las líneas de transmisión del 37"]
    exito: "Las decisiones de un capítulo rara vez se toman sin las de los demás."
    pistas:
      - { texto: "La fibra es una guía de onda, como una línea." }
    escalera:
      - "El driver conmutado es un convertidor."
    solucion: "LED, 5; driver, 7; multiplexado, 39; aislamiento, 32; fibra, 37."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [328, 329, 331, 332, 333]
    ideas:
      - { titulo: "Emisores.", texto: "Corriente, PWM y diseño térmico." }
      - { titulo: "Detectores.", texto: "Tres compromisos; contra la luz ambiente, modular." }
      - { titulo: "Displays.", texto: "Multiplexar cuesta pico; los direccionables, alimentación." }
      - { titulo: "Aislar.", texto: "El CTR envejece: final de vida o aislador digital." }
