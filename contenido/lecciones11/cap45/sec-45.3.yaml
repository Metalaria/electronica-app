# Lección 1.2 de la sección 46.3 «Detectores: Fotodiodo, Fototransistor y LDR» (cap45, sec-45.3). Formato: GUIA.md.
# - Transimpedancia (esquema «transimpedancia», el modelo de la lección de catálogo): v_o = −R_f·i/(1 + 1/A₀) en continua;
#   en alterna, el pico cerca de √(GBW/(2π·R_f·C_in)) cuando falta C_f (bloque 79). Los valores (10 µA, 100 kΩ, 100 pF
#   del fotodiodo, GBW de 1 MHz y C_f de 0,1, 1 y 4,7 pF) son de ejemplo: el libro da solo «nanoamperios a microamperios».
# - LDR en un divisor (esquema «divisor»): 10 kΩ arriba y la LDR abajo, de 1 MΩ (oscuridad) a 300 Ω (luz intensa), de
#   ejemplo («de megaohmios en oscuridad a cientos de ohmios», bloque 86), con 5 V.
# Paso práctico: «tocar» la pista fotosensible de la LDR en la foto 46.6.
leccion: cap45/sec-45.3

libro:
  73: "produciendo una corriente proporcional a la luz"
  74: "muy lineal (la corriente es estrictamente proporcional a la irradiancia en varias décadas)"
  75: "del orden de nanoamperios a microamperios"
  77: "Es más lento, porque la capacidad de la unión es máxima"
  78: "Es el modo de la comunicación óptica y de cualquier cosa rápida"
  79: "un condensador pequeño en paralelo con esa resistencia, sin el cual el circuito oscila por la capacidad del propio fotodiodo"
  81: "su ganancia es la β del transistor"
  82: "cien a mil veces más sensible que un fotodiodo"
  83: "porque la capacidad base-colector se multiplica por Miller"
  84: "casos donde importa detectar y no medir"
  86: "típicamente de megaohmios en oscuridad a cientos de ohmios con luz intensa"
  88: "contiene cadmio, restringido por RoHS"
  89: "encender una farola al anochecer"
  91: "Necesita amplificación"
  92: "medir o transmitir, fotodiodo; detectar presencia, fototransistor"
  94: "modulación de la fuente y detección síncrona"
  95: "modulan a 38 kHz precisamente para distinguirse del sol y de las lámparas"
  98: "se modula el LED con una onda cuadrada y se sube la frecuencia hasta que la respuesta del detector se redondea"
  100: "la pista fotosensible en serpentina entre sus dos electrodos"

modelo:
  valores:
    I_ti: { sim: "I", nombre: "corriente del fotodiodo", unidad: A, valor: 0.00001 }
    Ia_ti: { sim: "i", nombre: "amplitud de la corriente", unidad: A, valor: 0.000001 }
    f_ti: { sim: "f", nombre: "frecuencia", unidad: Hz, valor: 1000 }
    Rf_ti: { sim: "R_{f}", nombre: "resistencia de realimentación", unidad: Ω, valor: 100000 }
    Cf_ti: { sim: "C_{f}", nombre: "condensador de realimentación", unidad: F, valor: 4.7e-12 }
    Ci_ti: { sim: "C_{in}", nombre: "capacidad del fotodiodo", unidad: F, valor: 100e-12 }
    gbw_ti: { sim: "GBW", nombre: "producto ganancia-ancho de banda", unidad: Hz, valor: 1000000 }
    A0_ti: { sim: "A₀", nombre: "ganancia en lazo abierto", unidad: "", valor: 100000 }
    V_l: { sim: "V", nombre: "alimentación", unidad: V, valor: 5 }
    R_fi: { sim: "R", nombre: "resistencia fija", unidad: Ω, valor: 10000 }
    R_ldr: { sim: "R_{LDR}", nombre: "resistencia de la LDR", unidad: Ω, valor: 1000000 }
  calculos:
    Vo_ti: { expr: "-Rf_ti*I_ti/(1 + 1/A0_ti)", sim: "v_{o}", nombre: "tensión de salida", unidad: V }
    wp_ti: { expr: "2*pi*gbw_ti/A0_ti", sim: "ω_{p}", nombre: "polo del operacional", unidad: "rad/s" }
    fp_ti: { expr: "sqrt(gbw_ti/(2*pi*Rf_ti*Ci_ti))", sim: "f_{pico}", nombre: "frecuencia del pico", unidad: Hz }
    V_ldr: { expr: "V_l*R_ldr/(R_fi + R_ldr)", sim: "V_{salida}", nombre: "tensión en la LDR", unidad: V }
    I_ldr: { expr: "V_l/(R_fi + R_ldr)", sim: "I", nombre: "corriente del divisor", unidad: A }

tarjetas:
  - id: explore-detectores
    tipo: explorar
    titulo: "Tres compromisos"
    texto: "Fotodiodo, fototransistor y LDR resuelven lo mismo de formas muy distintas. Toque la linealidad y las tres velocidades."
    libro: [74, 82, 83, 86, 88, 91]
    widget:
      tipo: figura
      figura: fig-45.5
      zonas:
        - { id: lineal, rotulo: "Gráfica de la izquierda", rect: [0, 0, 215, 198], texto: "El fotodiodo es estrictamente lineal; el fototransistor y la LDR, más sensibles, no." }
        - { id: ldr, rotulo: "Primera barra de la derecha", rect: [235, 25, 211, 35], texto: "LDR: decenas o cientos de milisegundos, y con memoria de la luz de los minutos anteriores." }
        - { id: transistor, rotulo: "Segunda barra de la derecha", rect: [235, 60, 211, 35], texto: "Fototransistor: de microsegundos a milisegundos; la capacidad base-colector se multiplica por Miller." }
        - { id: fotodiodo, rotulo: "Tercera barra de la derecha", rect: [235, 98, 211, 35], texto: "Fotodiodo: nanosegundos; el PIN, picosegundos." }
    requiere: { mover: [lineal, ldr, transistor, fotodiodo] }

  - id: empareje-eleccion
    tipo: pregunta
    titulo: "La tabla de elección"
    texto: "Empareje cada detector con el uso que le corresponde."
    libro: [91, 92, 84, 89]
    widget:
      tipo: figura
      figura: fig-45.5
      zonas:
        - { id: lineal, rotulo: "Gráfica de la izquierda", rect: [0, 0, 215, 198] }
    emparejar:
      - ["Fotodiodo", "Medir o transmitir"]
      - ["Fototransistor", "Detectar presencia, barreras, encoders"]
      - ["LDR", "Luz ambiente sin exigencias: una farola"]
    exito: "Hoy, para luz ambiente, mejor un sensor digital con I²C."
    pistas:
      - { texto: "El más rápido y lineal es el que mide." }
    escalera:
      - "La LDR es lentísima; el fototransistor, poco lineal."
    solucion: "Fotodiodo, medir; fototransistor, detectar; LDR, ambiente."

  - id: predecir-modo
    tipo: predecir
    titulo: "Un enlace óptico rápido"
    texto: "Un fotodiodo para comunicación óptica: ¿sin polarizar o en inversa?"
    libro: [77, 78]
    widget:
      tipo: figura
      figura: fig-45.5
      zonas:
        - { id: fotodiodo, rotulo: "Tercera barra de la derecha", rect: [235, 98, 211, 35] }
    opciones:
      - texto: "En inversa, fotoconductivo: menos capacidad, más velocidad"
        bien: true
        porque: "La zona de agotamiento se ensancha y la capacidad baja; a cambio, corriente oscura."
      - texto: "Sin polarizar, fotovoltaico"
        porque: "Es el de la medida de precisión: sin corriente oscura, pero lento por la capacidad máxima."
      - texto: "Da igual"
        porque: "Cambia mucho la velocidad: la capacidad de la unión depende de la polarización."
    escalera:
      - "¿Qué pasa con la capacidad de la unión en inversa?"
    solucion: "En inversa: el modo de cualquier cosa rápida."

  - id: explore-tia
    tipo: explorar
    titulo: "De corriente a tensión"
    texto: "Un amplificador de transimpedancia convierte la corriente del fotodiodo en tensión con R_{f}. Reduzca C_{f} y mire la respuesta."
    nota: "Valores de ejemplo."
    libro: [73, 75, 79]
    widget:
      tipo: circuito
      esquema: transimpedancia
      piezas: { entrada: I_ti, amplitud: Ia_ti, f: f_ti, rf: Rf_ti, cf: Cf_ti, cin: Ci_ti, gbw: gbw_ti }
      lectura: { valor: Vo_ti, rotulo: "Salida en continua" }
      mide: { vo: Vo_ti }
      grafica:
        x: { id: nu, min: 1000, max: 10000000, unidad: Hz, rotulo: "f", escala: log }
        y: { min: 0, max: 0.6, unidad: V, rotulo: "amplitud" }
        curvas:
          - { expr: "Ia_ti/sqrt((1/Rf_ti + (1/Rf_ti - (2*pi*nu)^2*(Ci_ti + Cf_ti)/wp_ti)/A0_ti)^2 + ((2*pi*nu)*Cf_ti + ((2*pi*nu)*(Ci_ti + Cf_ti) + (2*pi*nu)/(Rf_ti*wp_ti))/A0_ti)^2)", color: naranja, rotulo: "v_{o}", mide: salida_amp }
      mandos:
        - { valor: Cf_ti, lista: [4.7e-12, 1e-12, 1e-13], rotulo: "Condensador C_{f}" }
    requiere: { mover: [Cf_ti] }

  - id: porque-cf
    tipo: porque
    titulo: "El condensador imprescindible"
    texto: "¿Por qué lleva un condensador pequeño en paralelo con R_{f}?"
    libro: [79]
    widget:
      tipo: figura
      figura: fig-45.5
      zonas:
        - { id: fotodiodo, rotulo: "Tercera barra de la derecha", rect: [235, 98, 211, 35] }
    opciones:
      - texto: "Sin él, la capacidad del fotodiodo hace oscilar el circuito"
        bien: true
        porque: "Es el pico de la respuesta: el margen de fase se acaba. C_{f} lo amortigua."
      - texto: "Para filtrar la luz ambiente"
        porque: "La luz ambiente se combate con filtro óptico, modulación y pantalla."
      - texto: "Para aumentar la ganancia"
        porque: "C_{f} no aumenta la ganancia en continua: la fija R_{f}."
    escalera:
      - "Mire el pico que sale con C_{f} pequeño."
    solucion: "Para que no oscile por la capacidad del fotodiodo."

  - id: explore-ldr
    tipo: explorar
    titulo: "Una farola al anochecer"
    texto: "Una LDR abajo en un divisor de 5 V: su resistencia cae con la luz. Cambie la luz y mire la salida."
    nota: "10 kΩ y los valores de la LDR, de ejemplo."
    libro: [86, 89]
    fijar: { V_l: 5, R_fi: 10000 }
    widget:
      tipo: circuito
      esquema: divisor
      piezas: { fuente: V_l, arriba: R_fi, abajo: R_ldr }
      lectura: { valor: V_ldr, rotulo: "Tensión de salida" }
      corriente: I_ldr
      mide: { salida: V_ldr, corriente: I_ldr }
      mandos:
        - { valor: R_ldr, lista: [1000000, 10000, 300], nombres: [oscuridad, penumbra, luz intensa], rotulo: "Luz sobre la LDR" }
    requiere: { mover: [R_ldr] }

  - id: pregunta-fototransistor
    tipo: pregunta
    titulo: "El fototransistor"
    texto: "Un fototransistor es cien a mil veces más sensible que un fotodiodo. ¿Por qué no se usa para medir?"
    libro: [81, 82, 83, 84, 98]
    widget:
      tipo: figura
      figura: fig-45.5
      zonas:
        - { id: transistor, rotulo: "Segunda barra de la derecha", rect: [235, 60, 211, 35] }
    opciones:
      - texto: "Es lento, no lineal y con mucha dispersión entre unidades"
        bien: true
        porque: "β varía con la corriente y la capacidad base-colector se multiplica por Miller: detectar, no medir."
      - texto: "Porque necesita amplificación"
        porque: "Al contrario: da miliamperios que a menudo no hace falta amplificar."
      - texto: "Porque no ve el infrarrojo"
        porque: "Lo ve: está en barreras ópticas y optoacopladores de infrarrojo."
    escalera:
      - "¿Qué le pasa a β con la corriente?"
    solucion: "Lento, no lineal y disperso: sirve para detectar."

  - id: pregunta-ambiente
    tipo: pregunta
    titulo: "La luz ambiente"
    texto: "Un detector responde a toda la luz que le llega. ¿Cuál es la defensa más eficaz?"
    libro: [94, 95]
    widget:
      tipo: figura
      figura: fig-45.5
      zonas:
        - { id: lineal, rotulo: "Gráfica de la izquierda", rect: [0, 0, 215, 198] }
    opciones:
      - texto: "Modular la fuente y detectar solo a esa frecuencia"
        bien: true
        porque: "Rechaza todo lo que no está a esa frecuencia: los mandos modulan a 38 kHz."
      - texto: "Un filtro óptico"
        porque: "Ayuda, pero el sol trae también la longitud de onda que se quiere ver."
      - texto: "Más ganancia"
        porque: "Amplifica también la luz ambiente, y satura antes."
    escalera:
      - "¿Cómo funciona un mando a distancia bajo el sol?"
    solucion: "Modulación y detección síncrona."

  - id: toque-ldr
    tipo: tocar
    titulo: "Dentro de una LDR"
    texto: "Toque en la foto la pista fotosensible de la LDR."
    libro: [100, 86]
    widget:
      tipo: figura
      figura: fig-45.6
      zonas:
        - { id: dado, rotulo: "Cuadrado azul, a la izquierda", rect: [248, 160, 200, 220] }
        - { id: patas-a, rotulo: "Patillas de la izquierda", rect: [360, 400, 280, 320] }
        - { id: serpentina, rotulo: "Zigzag naranja, a la derecha", rect: [960, 160, 360, 340] }
        - { id: patas-b, rotulo: "Hilos de arriba a la derecha", rect: [1000, 0, 240, 130] }
    tocar:
      bien: [serpentina]
      porque:
        dado: "Es el dado de silicio de un fotodiodo, a la vista."
        patas-a: "Son las patillas del fotodiodo."
        patas-b: "Son los terminales de la LDR, no la pista que responde a la luz."
    exito: "La serpentina entre los dos electrodos: su resistencia cae con la luz."
    escalera:
      - "Busque el material entre dos electrodos en forma de peine."
    solucion: "El zigzag naranja de la derecha."

  - id: pregunta-ldr
    tipo: pregunta
    titulo: "Por qué desaparece la LDR"
    texto: "La LDR es muy sensible, barata y parecida al ojo. ¿Por qué está desapareciendo?"
    libro: [88]
    widget:
      tipo: figura
      figura: fig-45.6
      zonas:
        - { id: serpentina, rotulo: "Zigzag naranja, a la derecha", rect: [960, 160, 360, 340] }
    opciones:
      - texto: "Contiene cadmio, restringido por RoHS"
        bien: true
        porque: "Además es lentísima, con memoria, no lineal y muy dispersa."
      - texto: "Porque no ve la luz visible"
        porque: "Su respuesta se parece a la del ojo: es su virtud."
      - texto: "Porque es cara"
        porque: "Es barata; el problema es el cadmio."
    escalera:
      - "Piense en la normativa de materiales."
    solucion: "El cadmio y RoHS."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [74, 79, 84, 88, 95]
    ideas:
      - { titulo: "Fotodiodo.", texto: "Lineal y rápido; con transimpedancia y su C_{f}." }
      - { titulo: "Fototransistor.", texto: "Sensible, lento y disperso: para detectar." }
      - { titulo: "LDR.", texto: "Muy sensible, lentísima y con cadmio: luz ambiente." }
      - { titulo: "Luz ambiente.", texto: "Modular la fuente: 38 kHz en los mandos." }
