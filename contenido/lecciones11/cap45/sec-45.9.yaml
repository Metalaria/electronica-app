# Lección 1.2 de la sección 46.9 «El Láser y el Diodo Láser» (cap45, sec-45.9). Formato: GUIA.md.
# - Deriva de la longitud de onda: unos 0,3 nm/°C (bloque 280); con 10 °C de calentamiento (de ejemplo), 3 nm.
# Paso práctico: «tocar» en la gráfica de la figura 46.16 el tramo en que el diodo se comporta como un LED.
leccion: cap45/sec-45.9

libro:
  267: "Un LED emite por emisión espontánea"
  268: "Un láser emite por emisión estimulada: un fotón que pasa junto a un portador excitado provoca la emisión de otro fotón idéntico"
  270: "Coherencia: todos los fotones en fase"
  272: "por debajo de una corriente umbral se comporta como un LED"
  273: "un pequeño exceso de corriente produce un gran exceso de potencia óptica, que puede destruir la faceta de salida"
  274: "el umbral no es fijo: sube con la temperatura"
  276: "un fotodiodo monitor integrado en el mismo encapsulado, mirando a la faceta trasera"
  277: "Alimentar un diodo láser con una fuente de tensión, o con corriente constante sin lazo, lo destruye"
  279: "Un diodo láser se destruye con picos de nanosegundos"
  280: "también deriva con la temperatura (unos 0,3 nm/°C)"
  282: "Diodo Fabry-Perot: el más simple, con las facetas del propio cristal como espejos"
  283: "DFB (realimentación distribuida): una rejilla dentro del propio dispositivo selecciona un solo modo"
  284: "VCSEL: emite perpendicularmente a la superficie"
  286: "Unos pocos milivatios bastan para causar daño permanente"
  288: "El infrarrojo es especialmente peligroso porque no se ve"
  291: "con una fuente de corriente limitada muy por debajo de su valor nominal, subiendo lentamente y observando el fotodiodo monitor"
  292: "usar un módulo con driver integrado"
  293: "Curva de un diodo láser con su umbral y la deriva térmica"

modelo:
  valores:
    k_l: { sim: "k", nombre: "deriva de la longitud de onda", unidad: "nm/°C", valor: 0.3 }
    d_T: { sim: "ΔT", nombre: "calentamiento", unidad: "°C", valor: 10 }
  calculos:
    d_l: { expr: "k_l*d_T", sim: "Δλ", nombre: "desplazamiento de la longitud de onda", unidad: nm }

tarjetas:
  - id: explore-laser
    tipo: explorar
    titulo: "Lo que el circuito no puede omitir"
    texto: "Un diodo láser tiene umbral, y el umbral se mueve con la temperatura. Toque la gráfica y los cuatro recuadros."
    libro: [272, 274, 276, 279, 280, 286, 293]
    widget:
      tipo: figura
      figura: fig-45.16
      zonas:
        - { id: curva, rotulo: "Gráfica de la izquierda", rect: [0, 0, 250, 215], texto: "Por debajo del umbral, como un LED; por encima, la potencia sube muy deprisa. Al calentarse, el umbral sube." }
        - { id: apc, rotulo: "Primer recuadro", rect: [267, 20, 178, 44], texto: "Lazo APC con el fotodiodo monitor: sin lazo, el diodo se destruye." }
        - { id: arranque, rotulo: "Segundo recuadro", rect: [267, 67, 178, 44], texto: "Arranque suave y protección: se destruye con picos de nanosegundos y con la estática." }
        - { id: temperatura, rotulo: "Tercer recuadro", rect: [267, 116, 178, 44], texto: "La longitud de onda deriva unos 0,3 nm/°C: Peltier si debe ser estable." }
        - { id: seguridad, rotulo: "Cuarto recuadro", rect: [267, 164, 178, 44], texto: "Unos pocos milivatios dañan la retina." }
    requiere: { mover: [curva, apc, temperatura] }

  - id: empareje-propiedades
    tipo: pregunta
    titulo: "LED y láser"
    texto: "Empareje cada mecanismo o propiedad con lo que significa."
    libro: [267, 268, 270]
    widget:
      tipo: figura
      figura: fig-45.16
      zonas:
        - { id: curva, rotulo: "Gráfica de la izquierda", rect: [0, 0, 250, 215] }
    emparejar:
      - ["Emisión espontánea", "Fotones en instantes y direcciones arbitrarios: el LED"]
      - ["Emisión estimulada", "Un fotón provoca otro idéntico: el láser"]
      - ["Coherencia", "Todos los fotones en fase"]
      - ["Monocromaticidad", "Fracciones de nanómetro de anchura espectral"]
    exito: "Con una cavidad resonante, la emisión estimulada se realimenta."
    pistas:
      - { texto: "Idéntico en fase, dirección y longitud de onda: estimulada." }
    escalera:
      - "El LED da luz incoherente de decenas de nanómetros."
    solucion: "Espontánea, LED; estimulada, láser; coherencia, fase; monocromaticidad, fracciones de nm."

  - id: predecir-exceso
    tipo: predecir
    titulo: "Un poco más de corriente"
    texto: "Un diodo láser trabaja por encima de su umbral. ¿Qué pasa si la corriente sube un poco de más?"
    libro: [272, 273]
    widget:
      tipo: figura
      figura: fig-45.16
      zonas:
        - { id: curva, rotulo: "Gráfica de la izquierda", rect: [0, 0, 250, 215] }
    opciones:
      - texto: "La potencia óptica se dispara y puede destruir la faceta de salida"
        bien: true
        porque: "Por encima del umbral la pendiente es muy pronunciada."
      - texto: "La potencia sube un poco, como en un LED"
        porque: "Como un LED solo se comporta por debajo del umbral."
      - texto: "Nada: el láser se limita solo"
        porque: "No se limita: por eso lleva lazo de control."
    escalera:
      - "Mire la pendiente de las rectas por encima del umbral."
    solucion: "Un gran exceso de potencia óptica: la faceta se quema."

  - id: porque-apc
    tipo: porque
    titulo: "El control de potencia no es opcional"
    texto: "¿Por qué un diodo láser no se alimenta con corriente constante sin lazo?"
    libro: [274, 276, 277]
    widget:
      tipo: figura
      figura: fig-45.16
      zonas:
        - { id: apc, rotulo: "Primer recuadro", rect: [267, 20, 178, 44] }
    opciones:
      - texto: "El umbral se mueve con la temperatura: hace falta un lazo con el fotodiodo monitor"
        bien: true
        porque: "El lazo APC ajusta la corriente para mantener constante la potencia óptica."
      - texto: "Porque la corriente constante es cara"
        porque: "No es el precio: sin lazo el comportamiento es impredecible y destructivo."
      - texto: "Porque necesita tensión constante"
        porque: "Con una fuente de tensión se destruye todavía antes."
    escalera:
      - "¿Qué le pasa al umbral al calentarse?"
    solucion: "El umbral deriva: solo un lazo con el monitor mantiene la potencia."

  - id: toque-umbral
    tipo: tocar
    titulo: "Bajo el umbral"
    texto: "Toque en la gráfica el tramo en que el diodo láser se comporta como un LED."
    libro: [272]
    widget:
      tipo: figura
      figura: fig-45.16
      zonas:
        - { id: bajo, rotulo: "Abajo a la izquierda", rect: [30, 140, 55, 45] }
        - { id: apc, rotulo: "Puntos azules del centro", rect: [125, 115, 60, 35] }
        - { id: maxima, rotulo: "Línea discontinua", rect: [32, 65, 210, 35] }
    tocar:
      bien: [bajo]
      porque:
        apc: "Es la potencia constante que mantiene el lazo APC al calentarse: ya por encima del umbral."
        maxima: "Es la potencia máxima admisible: el límite que no se debe pasar."
    exito: "Por debajo de la corriente umbral no hay emisión estimulada: luz de LED."
    escalera:
      - "Busque las corrientes pequeñas, antes de que las rectas despeguen."
    solucion: "Abajo a la izquierda, antes del umbral."

  - id: estime-deriva
    tipo: pregunta
    titulo: "La longitud de onda se mueve"
    texto: "Un diodo láser se calienta 10 °C. ¿Cuánto se desplaza su longitud de onda?"
    libro: [280]
    fijar: { k_l: 0.3, d_T: 10 }
    widget:
      tipo: figura
      figura: fig-45.16
      zonas:
        - { id: temperatura, rotulo: "Tercer recuadro", rect: [267, 116, 178, 44] }
    estimar:
      objetivo: "d_l"
      unidad: nm
      min: 0
      max: 10
      paso: 0.1
      inicio: 8
      tol: 0.05
      rotulo: "Desplazamiento"
    exito: "Unos 3 nm: por eso el Peltier cuando debe ser estable."
    pistas:
      - { cuando: { valor: estimacion, mayor: 3.15 }, texto: "Demasiado: 0,3 nm por grado." }
      - { texto: "Demasiado poco: diez veces 0,3 nm." }
    escalera:
      - "Unos 0,3 nm/°C."
    solucion: "10 × 0,3 = 3 nm."
    comprobar:
      - { d_l: 3 }

  - id: empareje-tipos
    tipo: pregunta
    titulo: "Los tipos"
    texto: "Empareje cada diodo láser con su rasgo."
    libro: [282, 283, 284]
    widget:
      tipo: figura
      figura: fig-45.16
      zonas:
        - { id: curva, rotulo: "Gráfica de la izquierda", rect: [0, 0, 250, 215] }
    emparejar:
      - ["Fabry-Perot", "Facetas del cristal como espejos; varios modos"]
      - ["DFB", "Una rejilla selecciona un modo: comunicaciones ópticas"]
      - ["VCSEL", "Emite perpendicular a la superficie: ratones y proximidad"]
    exito: "En comunicaciones, la anchura espectral decide la dispersión y el alcance."
    pistas:
      - { texto: "Vertical: VCSEL." }
    escalera:
      - "El DFB tiene una rejilla de realimentación distribuida."
    solucion: "FP, varios modos; DFB, un modo; VCSEL, en superficie."

  - id: pregunta-seguridad
    tipo: pregunta
    titulo: "La seguridad, que es real"
    texto: "¿Por qué un láser infrarrojo es especialmente peligroso?"
    libro: [286, 288]
    widget:
      tipo: figura
      figura: fig-45.16
      zonas:
        - { id: seguridad, rotulo: "Cuarto recuadro", rect: [267, 164, 178, 44] }
    opciones:
      - texto: "No se ve: no hay reflejo de parpadeo ni conciencia de estar expuesto"
        bien: true
        porque: "Unos pocos milivatios enfocados en la retina causan daño permanente."
      - texto: "Porque es más potente que el visible"
        porque: "No por la potencia: por ser invisible."
      - texto: "Porque quema la piel"
        porque: "El peligro principal es para el ojo, y sin aviso."
    escalera:
      - "¿Qué protege al ojo de un haz visible?"
    solucion: "Es invisible: el ojo no se defiende."

  - id: pregunta-probar
    tipo: pregunta
    titulo: "Un diodo láser desconocido"
    texto: "¿Cómo se prueba un diodo láser del que no se sabe nada?"
    libro: [291, 292]
    widget:
      tipo: figura
      figura: fig-45.16
      zonas:
        - { id: curva, rotulo: "Gráfica de la izquierda", rect: [0, 0, 250, 215] }
    opciones:
      - texto: "Con corriente limitada muy baja, subiendo despacio y mirando el fotodiodo monitor"
        bien: true
        porque: "La corriente a la que se dispara la señal del monitor es el umbral."
      - texto: "Con una pila y una resistencia"
        porque: "Sin lazo ni límite fino, el primer pico lo destruye."
      - texto: "Con el diodo del multímetro"
        porque: "No dice el umbral, y puede dañarlo con la estática."
    escalera:
      - "Hay que encontrar el umbral sin pasarse."
    solucion: "Fuente de corriente limitada, subir lentamente y mirar el monitor."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [268, 273, 276, 280, 288]
    ideas:
      - { titulo: "Estimulada.", texto: "Fotones idénticos: coherencia, monocromaticidad y haz estrecho." }
      - { titulo: "El umbral.", texto: "Pendiente muy fuerte y umbral que sube con la temperatura." }
      - { titulo: "APC.", texto: "Lazo con el fotodiodo monitor, arranque suave y protección." }
      - { titulo: "Seguridad.", texto: "Milivatios bastan; el infrarrojo no se ve." }
