# Lección 1.2 de la sección 46.10 «Sensores de Imagen: CCD y CMOS» (cap45, sec-45.10). Formato: GUIA.md.
# Figuras 46.18 (obturador global y rodante) y 46.19 (la hélice fotografiada con un móvil).
# Sin paso práctico aparte: el banco del libro (fotografiar un ventilador) se pregunta como predicción con la foto.
# 1.2.1 (autor121-senpro, «aprender haciendo», GUIA §13): en la figura 46.18 se tocan la captura simultánea, la hélice del
# móvil y la que da bandas con LED por PWM; los píxeles verdes de un sensor de 12 Mpx se cuentan y se suben los
# megapíxeles del mismo sensor hasta dejar la cuarta parte de fotones por píxel (12, 24 y 48 Mpx, de ejemplo). La
# pregunta de por qué el CMOS es rodante se funde en el éxito de la primera. Sin preguntas de opciones; quedan los dos
# emparejar (CCD frente a CMOS y la caracterización).
leccion: cap45/sec-45.10

libro:
  297: "cada uno acumulando carga proporcional a la luz que recibe durante el tiempo de exposición"
  298: "Todos los píxeles pasan por el mismo amplificador"
  299: "cada píxel tiene su propio amplificador integrado"
  301: "las diferencias producen ruido de patrón fijo"
  302: "Es la razón de que todo lo portátil sea CMOS"
  303: "porque el acceso es aleatorio"
  305: "un píxel saturado puede derramar carga a sus vecinos"
  306: "el CMOS ha desplazado al CCD salvo en nichos científicos"
  308: "todos los píxeles se exponen simultáneamente"
  309: "las filas se exponen y se leen secuencialmente"
  310: "hélices dobladas, postes inclinados al mover la cámara"
  311: "el obturador rodante produce bandas horizontales de brillo distinto"
  312: "son la elección obligada en visión industrial"
  314: "con el doble de verdes que de los otros (porque el ojo es más sensible al verde)"
  315: "la resolución real de color sea menor que el número de píxeles"
  319: "más megapíxeles en el mismo sensor no significa mejor imagen"
  321: "cuya media da el nivel de negro y cuya desviación típica da el ruido de lectura"
  322: "fotografiar un ventilador en marcha"
  324: "sale con las palas curvadas y separadas del buje"

modelo:
  valores:
    N_p: { sim: "N", nombre: "píxeles del sensor", unidad: "", valor: 12000000 }
    N_m: { sim: "N", nombre: "megapíxeles del mismo sensor", unidad: "", valor: 12 }
  calculos:
    N_v: { expr: "N_p/2", sim: "N_{verde}", nombre: "píxeles verdes", unidad: "" }
    N_3: { expr: "N_p/3", sim: "N", nombre: "repartidos por igual", unidad: "" }
    N_4: { expr: "N_p/4", sim: "N", nombre: "la cuarta parte", unidad: "" }
    f_p: { expr: "12/N_m", sim: "fotones", nombre: "fotones por píxel, relativos", unidad: "" }

tarjetas:
  - id: explore-obturador
    tipo: tocar
    titulo: "Dos formas de capturar"
    texto: "Cada píxel acumula carga durante la exposición. Toque la captura en la que todas las filas se exponen a la vez."
    libro: [297, 298, 299, 308, 309, 312]
    widget:
      tipo: figura
      figura: fig-45.18
      zonas: &zonas-obt
        - { id: global, rotulo: "Imagen de la izquierda", rect: [0, 0, 180, 201] }
        - { id: rodante, rotulo: "Imagen de la derecha", rect: [228, 0, 209, 201] }
    tocar:
      bien: [global]
      porque:
        rodante: "Ahí cada fila se expone en un instante distinto: obturador rodante."
    exito: "Obturador global, obligado en visión industrial. El CCD transfiere todo a la vez; el CMOS lee fila a fila, y por eso suele ser rodante."
    escalera:
      - "Busque la hélice que sale como es."
    solucion: "La de la izquierda, obturador global."

  - id: empareje-ccd-cmos
    tipo: pregunta
    titulo: "Lo que se deriva de leer distinto"
    texto: "Empareje cada rasgo con el sensor y su razón."
    libro: [298, 299, 301, 302, 303, 305]
    widget:
      tipo: figura
      figura: fig-45.18
      zonas:
        - { id: global, rotulo: "Imagen de la izquierda", rect: [0, 0, 180, 201] }
    emparejar:
      - ["Muy uniforme", "CCD: un único amplificador para todos"]
      - ["Ruido de patrón fijo", "CMOS: un amplificador por píxel"]
      - ["Lee solo una región", "CMOS: acceso aleatorio, como una memoria"]
      - ["Raya vertical con luz fuerte", "CCD: el píxel saturado derrama carga"]
    exito: "Consumo e integración dieron la victoria al CMOS, salvo en nichos científicos."
    pistas:
      - { texto: "En el CCD la carga viaja de píxel en píxel." }
    escalera:
      - "¿Cuántos amplificadores tiene cada uno?"
    solucion: "CCD, uniforme y con blooming; CMOS, patrón fijo y acceso aleatorio."

  - id: predecir-helice
    tipo: tocar
    titulo: "Una hélice desde el avión"
    texto: "Se fotografía con el móvil la hélice de un avión en marcha. Toque la captura que se parece a lo que sale."
    libro: [309, 310, 324]
    widget:
      tipo: figura
      figura: fig-45.18
      zonas: *zonas-obt
    tocar:
      bien: [rodante]
      porque:
        global: "Así saldría con obturador global; el CMOS del móvil lee las filas una tras otra."
    exito: "Palas curvadas y separadas del buje: la hélice gira mientras se leen las filas."
    escalera:
      - "¿Todas las filas se exponen a la vez en un CMOS de móvil?"
    solucion: "La de la derecha: obturador rodante."

  - id: pregunta-bandas
    tipo: tocar
    titulo: "Bandas con luz LED"
    texto: "Se graba bajo una lámpara LED atenuada por PWM y aparecen bandas horizontales. Toque el obturador que las produce."
    libro: [311]
    widget:
      tipo: figura
      figura: fig-45.18
      zonas: *zonas-obt
    tocar:
      bien: [rodante]
      porque:
        global: "Con todas las filas a la vez, el parpadeo cambia el brillo de la foto entera, sin bandas."
    exito: "Cada fila se expone en una fase distinta del parpadeo: por eso los LED de calidad conmutan por encima de 1 kHz."
    escalera:
      - "Una luz que se enciende y apaga, y filas leídas en instantes distintos."
    solucion: "El rodante, a la derecha."

  - id: pregunta-bayer
    tipo: simular
    titulo: "El color"
    texto: "Un filtro de Bayer pone el doble de verdes que de rojos o de azules. En un sensor de 12 Mpx, ¿cuántos píxeles son verdes?"
    nota: "Sensor de ejemplo."
    libro: [314, 315]
    fijar: { N_p: 12000000 }
    simular:
      objetivo: N_v
      unidad: ""
      tol: 0.01
      rotulo: "Píxeles verdes"
      errores:
        - { expr: "N_3", texto: "Así estarían repartidos por igual; hay el doble de verdes." }
        - { expr: "N_4", texto: "Esa es la parte del rojo o del azul." }
    exito: "6 Mpx, la mitad: el ojo es más sensible al verde. Los otros colores se interpolan, y la resolución real de color es menor."
    escalera:
      - "Por cada cuatro píxeles: dos verdes, un rojo y un azul."
    solucion: "La mitad: 6 Mpx."
    comprobar:
      - { N_v: 6000000, N_3: 4000000, N_4: 3000000 }

  - id: pregunta-megapixeles
    tipo: explorar
    titulo: "Más megapíxeles"
    texto: "El mismo sensor, con más megapíxeles: los píxeles encogen. Súbalos hasta que a cada uno le llegue la cuarta parte de fotones."
    nota: "Megapíxeles de ejemplo."
    libro: [319]
    inicio: { N_m: 12 }
    widget:
      tipo: grafica
      x: { id: m, min: 6, max: 60, unidad: "", rotulo: "Mpx" }
      y: { min: 0, max: 2, unidad: "", rotulo: "fotones por píxel" }
      curvas:
        - { expr: "12/m", color: naranja, rotulo: "relativo al sensor de 12 Mpx" }
      marcas:
        - { x: "N_m", y: "f_p", rotulo: "{{f_p}}" }
      lectura: { valor: f_p, rotulo: "Fotones por píxel, relativos" }
      mandos:
        - { valor: N_m, lista: [12, 24, 48], rotulo: "Megapíxeles" }
    objetivo:
      condiciones:
        - { valor: f_p, max: 0.25, rotulo: "Fotones: {{f_p}}" }
      logrado: "Con {{N_m}} Mpx, {{f_p}} de los fotones: con poca luz, peor relación señal a ruido. Más megapíxeles no es mejor imagen."
      pistas:
        - { texto: "Aún llegan demasiados: más megapíxeles." }
    escalera:
      - "Cuatro veces más píxeles en la misma superficie."
    solucion: "48 Mpx."
    comprobar:
      - { con: { N_m: 48 }, f_p: 0.25 }
      - { con: { N_m: 12 }, f_p: 1 }

  - id: empareje-medidas
    tipo: pregunta
    titulo: "Caracterizar un sensor"
    texto: "Empareje cada medida con lo que revela."
    libro: [321, 322]
    widget:
      tipo: figura
      figura: fig-45.18
      zonas:
        - { id: global, rotulo: "Imagen de la izquierda", rect: [0, 0, 180, 201] }
    emparejar:
      - ["Media de una toma a oscuras", "El nivel de negro"]
      - ["Desviación típica a oscuras", "El ruido de lectura"]
      - ["Toma de un campo uniforme", "El ruido de patrón fijo"]
      - ["Un ventilador en marcha", "El obturador rodante"]
    exito: "Dos medidas sencillas y una foto bastan para conocer un sensor."
    pistas:
      - { texto: "A oscuras no hay fotones: solo queda lo del sensor." }
    escalera:
      - "Lo que varía entre píxeles con luz uniforme es su desigualdad."
    solucion: "Media, negro; desviación, lectura; uniforme, patrón fijo; ventilador, rodante."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [298, 299, 306, 309, 314, 319]
    ideas:
      - { titulo: "CCD y CMOS.", texto: "Un amplificador para todos o uno por píxel." }
      - { titulo: "El CMOS ganó.", texto: "Consumo, velocidad e integración; el CCD, uniformidad." }
      - { titulo: "Obturador rodante.", texto: "Hélices dobladas y bandas con LED por PWM." }
      - { titulo: "Color y píxeles.", texto: "Bayer con doble de verdes; píxel pequeño, más ruido." }
