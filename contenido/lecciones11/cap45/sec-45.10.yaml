# Lección 1.2 de la sección 46.10 «Sensores de Imagen: CCD y CMOS» (cap45, sec-45.10). Formato: GUIA.md.
# Sin modelo numérico: las figuras 46.18 (obturador global y rodante) y 46.19 (la hélice fotografiada con un móvil).
# Sin paso práctico aparte: el banco del libro (fotografiar un ventilador) se pregunta como predicción con la foto.
leccion: cap45/sec-45.10

libro:
  297: "cada uno acumulando carga proporcional a la luz que recibe durante el tiempo de exposición"
  298: "Todos los píxeles pasan por el mismo amplificador"
  299: "cada píxel tiene su propio amplificador integrado"
  301: "las diferencias producen ruido de patrón fijo"
  302: "Es la razón de que todo lo portátil sea CMOS"
  303: "porque el acceso es aleatorio"
  305: "un píxel saturado puede derramar carga a sus vecinos"
  306: "el CMOS ha desplazado al CCD salvo en nichos científicos"
  308: "todos los píxeles se exponen simultáneamente"
  309: "las filas se exponen y se leen secuencialmente"
  310: "hélices dobladas, postes inclinados al mover la cámara"
  311: "el obturador rodante produce bandas horizontales de brillo distinto"
  312: "son la elección obligada en visión industrial"
  314: "con el doble de verdes que de los otros (porque el ojo es más sensible al verde)"
  315: "la resolución real de color sea menor que el número de píxeles"
  319: "más megapíxeles en el mismo sensor no significa mejor imagen"
  321: "cuya media da el nivel de negro y cuya desviación típica da el ruido de lectura"
  322: "fotografiar un ventilador en marcha"
  324: "sale con las palas curvadas y separadas del buje"

modelo: { valores: {}, calculos: {} }

tarjetas:
  - id: explore-obturador
    tipo: explorar
    titulo: "Dos formas de capturar"
    texto: "Una hélice que gira, fotografiada de dos maneras. Toque las dos imágenes."
    libro: [297, 308, 309, 310, 312]
    widget:
      tipo: figura
      figura: fig-45.18
      zonas:
        - { id: global, rotulo: "Imagen de la izquierda", rect: [0, 0, 180, 201], texto: "Obturador global: todas las filas a la vez. La hélice sale como es." }
        - { id: rodante, rotulo: "Imagen de la derecha", rect: [228, 0, 209, 201], texto: "Obturador rodante: cada fila en un instante distinto. Las palas salen dobladas." }
    requiere: { mover: [global, rodante] }

  - id: empareje-ccd-cmos
    tipo: pregunta
    titulo: "Lo que se deriva de leer distinto"
    texto: "Empareje cada rasgo con el sensor y su razón."
    libro: [298, 299, 301, 302, 303, 305]
    widget:
      tipo: figura
      figura: fig-45.18
      zonas:
        - { id: global, rotulo: "Imagen de la izquierda", rect: [0, 0, 180, 201] }
    emparejar:
      - ["Muy uniforme", "CCD: un único amplificador para todos"]
      - ["Ruido de patrón fijo", "CMOS: un amplificador por píxel"]
      - ["Lee solo una región", "CMOS: acceso aleatorio, como una memoria"]
      - ["Raya vertical con luz fuerte", "CCD: el píxel saturado derrama carga"]
    exito: "Consumo e integración dieron la victoria al CMOS, salvo en nichos científicos."
    pistas:
      - { texto: "En el CCD la carga viaja de píxel en píxel." }
    escalera:
      - "¿Cuántos amplificadores tiene cada uno?"
    solucion: "CCD, uniforme y con blooming; CMOS, patrón fijo y acceso aleatorio."

  - id: predecir-helice
    tipo: predecir
    titulo: "Una hélice desde el avión"
    texto: "Se fotografía con el móvil la hélice de un avión en marcha. ¿Cómo sale?"
    libro: [309, 310, 324]
    widget:
      tipo: figura
      figura: fig-45.19
      zonas:
        - { id: foto, rotulo: "La hélice", rect: [0, 0, 1600, 1200] }
    opciones:
      - texto: "Con las palas curvadas y separadas del buje"
        bien: true
        porque: "El CMOS del móvil lee las filas una tras otra mientras la hélice gira."
      - texto: "Tal cual, solo algo borrosa"
        porque: "Eso haría un obturador global; el rodante deforma lo que se mueve."
      - texto: "No sale: se ve un disco uniforme"
        porque: "La exposición de cada fila es corta: la pala sale nítida, pero deformada."
    escalera:
      - "¿Todas las filas se exponen a la vez en un CMOS de móvil?"
    solucion: "Curvadas y separadas: obturador rodante."

  - id: porque-rodante
    tipo: porque
    titulo: "Por qué el CMOS es rodante"
    texto: "¿Por qué los CMOS suelen usar obturador rodante y los CCD global?"
    libro: [298, 299, 308, 309]
    widget:
      tipo: figura
      figura: fig-45.18
      zonas:
        - { id: rodante, rotulo: "Imagen de la derecha", rect: [228, 0, 209, 201] }
    opciones:
      - texto: "Por cómo se leen: el CMOS lee fila a fila; el CCD transfiere todo a la vez"
        bien: true
        porque: "Es su arquitectura de lectura; los CMOS de obturador global existen y cuestan más."
      - texto: "Porque el CMOS es más lento"
        porque: "El CMOS puede leer muy deprisa; la diferencia es secuencial frente a simultánea."
      - texto: "Porque el CCD no tiene filas"
        porque: "Tiene filas; la carga se transfiere en bloque."
    escalera:
      - "¿Quién tiene un amplificador por píxel que se direcciona como una memoria?"
    solucion: "La lectura fila a fila del CMOS."

  - id: pregunta-bandas
    tipo: pregunta
    titulo: "Bandas con luz LED"
    texto: "Se graba con un móvil bajo una lámpara LED atenuada por PWM y aparecen bandas horizontales. ¿Por qué?"
    libro: [311]
    widget:
      tipo: figura
      figura: fig-45.18
      zonas:
        - { id: rodante, rotulo: "Imagen de la derecha", rect: [228, 0, 209, 201] }
    opciones:
      - texto: "Cada fila se expone en una fase distinta del parpadeo"
        bien: true
        porque: "Por eso los LED de calidad conmutan por encima de 1 kHz."
      - texto: "La lámpara emite en bandas"
        porque: "La lámpara parpadea entera; las bandas las pone la lectura fila a fila."
      - texto: "El sensor tiene píxeles averiados"
        porque: "Unos píxeles averiados no darían bandas que siguen al parpadeo."
    escalera:
      - "Obturador rodante y una luz que se enciende y apaga."
    solucion: "Muaré temporal: filas en fases distintas del PWM."

  - id: pregunta-bayer
    tipo: pregunta
    titulo: "El color"
    texto: "En un filtro de Bayer, ¿qué color tiene más píxeles?"
    libro: [314, 315]
    widget:
      tipo: figura
      figura: fig-45.18
      zonas:
        - { id: global, rotulo: "Imagen de la izquierda", rect: [0, 0, 180, 201] }
    opciones:
      - texto: "El verde, el doble que los otros"
        bien: true
        porque: "El ojo es más sensible al verde; los otros colores se interpolan de los vecinos."
      - texto: "Los tres por igual"
        porque: "Hay el doble de verdes que de rojos o de azules."
      - texto: "El azul"
        porque: "El azul tiene la cuarta parte de los píxeles, como el rojo."
    escalera:
      - "¿A qué color es más sensible el ojo?"
    solucion: "El verde: por eso la resolución real de color es menor que el número de píxeles."

  - id: pregunta-megapixeles
    tipo: pregunta
    titulo: "Más megapíxeles"
    texto: "El mismo sensor, ahora con más megapíxeles. ¿Qué pasa con poca luz?"
    libro: [319]
    widget:
      tipo: figura
      figura: fig-45.18
      zonas:
        - { id: global, rotulo: "Imagen de la izquierda", rect: [0, 0, 180, 201] }
    opciones:
      - texto: "Suele ir peor: cada píxel capta menos fotones"
        bien: true
        porque: "Píxeles más pequeños, peor relación señal a ruido."
      - texto: "Mejor: más detalle"
        porque: "Más detalle si hay luz; con poca, manda el ruido."
      - texto: "Igual"
        porque: "El tamaño del píxel cambia la relación señal a ruido."
    escalera:
      - "Si el sensor no crece, los píxeles encogen."
    solucion: "Peor: menos fotones por píxel."

  - id: empareje-medidas
    tipo: pregunta
    titulo: "Caracterizar un sensor"
    texto: "Empareje cada medida con lo que revela."
    libro: [321, 322]
    widget:
      tipo: figura
      figura: fig-45.18
      zonas:
        - { id: global, rotulo: "Imagen de la izquierda", rect: [0, 0, 180, 201] }
    emparejar:
      - ["Media de una toma a oscuras", "El nivel de negro"]
      - ["Desviación típica a oscuras", "El ruido de lectura"]
      - ["Toma de un campo uniforme", "El ruido de patrón fijo"]
      - ["Un ventilador en marcha", "El obturador rodante"]
    exito: "Dos medidas sencillas y una foto bastan para conocer un sensor."
    pistas:
      - { texto: "A oscuras no hay fotones: solo queda lo del sensor." }
    escalera:
      - "Lo que varía entre píxeles con luz uniforme es su desigualdad."
    solucion: "Media, negro; desviación, lectura; uniforme, patrón fijo; ventilador, rodante."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [298, 299, 306, 309, 314, 319]
    ideas:
      - { titulo: "CCD y CMOS.", texto: "Un amplificador para todos o uno por píxel." }
      - { titulo: "El CMOS ganó.", texto: "Consumo, velocidad e integración; el CCD, uniformidad." }
      - { titulo: "Obturador rodante.", texto: "Hélices dobladas y bandas con LED por PWM." }
      - { titulo: "Color y píxeles.", texto: "Bayer con doble de verdes; píxel pequeño, más ruido." }
