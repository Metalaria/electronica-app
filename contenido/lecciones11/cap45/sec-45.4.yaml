# Lección 1.2 de la sección 46.4 «Optoacopladores: Aislar con Luz» (cap45, sec-45.4). Formato: GUIA.md.
# - El CTR de diseño: el mínimo de final de vida, típicamente la mitad del mínimo de la hoja (bloque 118). Con el
#   optoacoplador del problema 46.C (CTR del 50 % al 300 %) y los 11,5 mA de la figura 46.7 (valores de ejemplo de la
#   figura), la corriente de colector garantizada es 0,25 × 11,5 mA = 2,875 mA.
# Paso práctico: «simular» la corriente de colector garantizada (errores: el CTR máximo, el mínimo sin envejecer).
leccion: cap45/sec-45.4

libro:
  103: "La señal cruza como luz y la barrera es física"
  105: "Aislar por seguridad"
  106: "Aislar por ruido: romper un bucle de tierra"
  109: "Es un número grande y no es la tensión de trabajo"
  110: "Tensión de trabajo continua, que es la que de verdad se puede aplicar permanentemente"
  111: "un optoacoplador certificado en una placa mal diseñada no aísla"
  112: "la ranura fresada bajo el componente"
  114: "el CMTI, medido en kV/µs"
  115: "la capacidad parásita entre ellos inyecta corriente que puede hacer conmutar el optoacoplador sin señal"
  116: "es un fallo grave y difícil de diagnosticar porque solo aparece con potencia"
  118: "típicamente la mitad del mínimo de la hoja"
  121: "no envejecen como un LED, son mucho más rápidos"
  122: "necesitan alimentación en ambos lados"
  123: "aislador digital salvo que la simplicidad del optoacoplador sea decisiva"
  126: "Debe ser inmensurable"
  127: "Resistencias y tensiones de ejemplo"
  128: "Envejecimiento del CTR según la corriente del LED"
  "cap45#376": "cuya CTR está especificada entre el 50 % y el 300 %"

modelo:
  valores:
    I_F: { sim: "I_{F}", nombre: "corriente del LED", unidad: A, valor: 0.0115 }
    C_min: { sim: "CTR_{mín}", nombre: "CTR mínimo de la hoja", unidad: "%", valor: 50 }
    C_max: { sim: "CTR_{máx}", nombre: "CTR máximo de la hoja", unidad: "%", valor: 300 }
  calculos:
    I_C: { expr: "I_F*C_min/100/2", sim: "I_{C}", nombre: "corriente de colector garantizada", unidad: A }
    I_Cmax: { expr: "I_F*C_max/100", sim: "I_{C}", nombre: "con el CTR máximo", unidad: A }
    I_Cnuevo: { expr: "I_F*C_min/100", sim: "I_{C}", nombre: "con el mínimo sin envejecer", unidad: A }
    C_fin: { expr: "C_min/2", sim: "CTR", nombre: "CTR de final de vida", unidad: "%" }

tarjetas:
  - id: explore-opto
    tipo: explorar
    titulo: "Aislar con luz"
    texto: "Un LED y un detector en el mismo encapsulado, sin conexión eléctrica. Toque sus partes."
    libro: [103, 127]
    widget:
      tipo: figura
      figura: fig-45.7
      zonas:
        - { id: led, rotulo: "Triángulo a la izquierda de la caja", rect: [130, 95, 40, 40], texto: "El LED del lado de entrada: convierte la corriente en luz." }
        - { id: barrera, rotulo: "Línea discontinua del centro", rect: [176, 66, 28, 90], texto: "La barrera de aislamiento: la dan la distancia y el material, no un circuito." }
        - { id: transistor, rotulo: "Círculo a la derecha de la caja", rect: [202, 92, 36, 36], texto: "El fototransistor del lado de salida, con su propia masa." }
    requiere: { mover: [led, barrera, transistor] }

  - id: empareje-usos
    tipo: pregunta
    titulo: "Dos usos distintos"
    texto: "Empareje cada uso con lo que más importa en él."
    libro: [105, 106]
    widget:
      tipo: figura
      figura: fig-45.7
      zonas:
        - { id: todo, rotulo: "Optoacoplador entre dos circuitos", rect: [0, 0, 360, 220] }
    emparejar:
      - ["Aislar por seguridad", "Tensión de aislamiento y distancias"]
      - ["Aislar por ruido", "Velocidad y rechazo de modo común"]
    exito: "Separarlos evita elegir mal el componente."
    pistas:
      - { texto: "Romper un bucle de tierra es un problema de ruido." }
    escalera:
      - "Seguridad: que no pase la red al lado accesible."
    solucion: "Seguridad, aislamiento y distancias; ruido, velocidad y modo común."

  - id: pregunta-tensiones
    tipo: pregunta
    titulo: "Lo que dice la hoja de datos"
    texto: "La hoja da una tensión de aislamiento de ensayo muy alta. ¿Se puede aplicar siempre?"
    libro: [109, 110]
    widget:
      tipo: figura
      figura: fig-45.7
      zonas:
        - { id: barrera, rotulo: "Línea discontinua del centro", rect: [176, 66, 28, 90] }
    opciones:
      - texto: "No: es la de un minuto de prueba; la permanente es la de trabajo, bastante menor"
        bien: true
        porque: "Son tres cifras distintas: ensayo, trabajo continuo y distancias de fuga y de aire."
      - texto: "Sí: es la que soporta"
        porque: "La soporta durante un minuto en la prueba, no permanentemente."
      - texto: "Solo en alterna"
        porque: "No es cuestión de alterna o continua: es de duración."
    escalera:
      - "¿Cuánto dura el ensayo?"
    solucion: "No: la permanente es la tensión de trabajo continua."

  - id: predecir-placa
    tipo: predecir
    titulo: "Un optoacoplador certificado"
    texto: "Se monta un optoacoplador certificado en una placa con pistas de los dos lados muy juntas. ¿Aísla?"
    libro: [111, 112]
    widget:
      tipo: figura
      figura: fig-45.7
      zonas:
        - { id: barrera, rotulo: "Línea discontinua del centro", rect: [176, 66, 28, 90] }
    opciones:
      - texto: "No: las distancias de fuga y de aire deben cumplirse también en la placa"
        bien: true
        porque: "De ahí la ranura fresada bajo el componente: alarga la distancia superficial."
      - texto: "Sí: el certificado lo garantiza"
        porque: "Certifica el componente, no la placa en la que va."
      - texto: "Solo si la tensión es continua"
        porque: "La placa mal diseñada falla en continua y en alterna."
    escalera:
      - "¿Por dónde puede saltar la tensión si no es por el componente?"
    solucion: "No: la placa debe respetar las distancias, o con una ranura."

  - id: porque-cmti
    tipo: porque
    titulo: "Disparos espurios con potencia"
    texto: "En un puente de potencia, un driver aislado conmuta solo, sin señal. ¿Por qué?"
    libro: [114, 115, 116]
    widget:
      tipo: figura
      figura: fig-45.7
      zonas:
        - { id: barrera, rotulo: "Línea discontinua del centro", rect: [176, 66, 28, 90] }
    opciones:
      - texto: "CMTI insuficiente: la capacidad entre los lados inyecta corriente en cada salto"
        bien: true
        porque: "Los dos lados se mueven bruscamente uno respecto al otro; solo aparece con potencia."
      - texto: "El LED se ha fundido"
        porque: "Un LED fundido no conmutaría nunca; aquí conmuta de más."
      - texto: "Falta tensión de aislamiento"
        porque: "Eso es seguridad; los disparos sin señal son de modo común transitorio."
    escalera:
      - "¿Qué cruza la barrera cuando la masa de un lado salta cientos de voltios?"
    solucion: "Corriente por la capacidad parásita: hace falta más CMTI, en kV/µs."

  - id: simule-ctr
    tipo: simular
    titulo: "Diseñar con el CTR de final de vida"
    texto: "CTR del 50 % al 300 %, y 11,5 mA en el LED. ¿Qué corriente de colector se puede garantizar al final de su vida?"
    libro: [118, 127, "cap45#376"]
    fijar: { I_F: 0.0115, C_min: 50, C_max: 300 }
    simular:
      objetivo: I_C
      unidad: A
      tol: 0.03
      rotulo: "Corriente de colector garantizada"
      errores:
        - { expr: "I_Cmax", texto: "Ha usado el CTR máximo: con una unidad del montón no tiene por qué llegar." }
        - { expr: "I_Cnuevo", texto: "Es el mínimo de la hoja, nuevo; con los años cae, típicamente a la mitad." }
    exito: "Unos 2,9 mA: el CTR de final de vida es la mitad del mínimo, el 25 %."
    escalera:
      - "CTR de diseño = la mitad del mínimo de la hoja."
      - "I_{C} = CTR · I_{F}."
    solucion: "25 % de 11,5 mA ≈ 2,9 mA."
    comprobar:
      - { I_C: 0.002875, I_Cmax: 0.0345, I_Cnuevo: 0.00575, C_fin: 25 }

  - id: explore-envejecimiento
    tipo: explorar
    titulo: "El CTR envejece"
    texto: "El envejecimiento se acelera con la corriente del LED. Toque las dos gráficas."
    libro: [118, 121, 128]
    widget:
      tipo: figura
      figura: fig-45.8
      zonas:
        - { id: ctr, rotulo: "Gráfica de la izquierda", rect: [0, 0, 224, 220], texto: "Cuanta más corriente en el LED, antes cae el CTR." }
        - { id: aislador, rotulo: "Gráfica de la derecha", rect: [224, 0, 225, 220], texto: "El aislador digital no tiene esa debilidad: no envejece como un LED." }
    requiere: { mover: [ctr, aislador] }

  - id: pregunta-aislador
    tipo: pregunta
    titulo: "El aislador digital"
    texto: "Los aisladores digitales no envejecen y son más rápidos. ¿Qué inconveniente tienen?"
    libro: [121, 122, 123]
    widget:
      tipo: figura
      figura: fig-45.8
      zonas:
        - { id: aislador, rotulo: "Gráfica de la derecha", rect: [224, 0, 225, 220] }
    opciones:
      - texto: "Necesitan alimentación en los dos lados"
        bien: true
        porque: "El optoacoplador funciona con la corriente del LED; hay versiones con convertidor aislado, más caras."
      - texto: "Peor CMTI"
        porque: "Al contrario: tienen mejor CMTI."
      - texto: "Consumen más"
        porque: "Consumen menos que un optoacoplador."
    escalera:
      - "¿Qué necesita el lado de salida de un optoacoplador para funcionar?"
    solucion: "Alimentación en ambos lados."

  - id: pregunta-fuga
    tipo: pregunta
    titulo: "La fuga a través de la barrera"
    texto: "Con el óhmetro entre los dos lados de un optoacoplador se lee una resistencia medible. ¿Qué indica?"
    libro: [126]
    widget:
      tipo: figura
      figura: fig-45.7
      zonas:
        - { id: barrera, rotulo: "Línea discontinua del centro", rect: [176, 66, 28, 90] }
    opciones:
      - texto: "Componente dañado o contaminación en la placa entre ambos lados"
        bien: true
        porque: "Debe ser inmensurable: cualquier lectura es un camino que no debería existir."
      - texto: "Que funciona bien"
        porque: "Entre los dos lados no debe haber nada medible."
      - texto: "Que el LED está encendido"
        porque: "El óhmetro mide entre los dos lados, no el LED."
    escalera:
      - "¿Qué resistencia debe haber a través de una barrera de aislamiento?"
    solucion: "Algo está mal: daño o suciedad entre los lados."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [103, 111, 115, 118, 122]
    ideas:
      - { titulo: "La barrera es física.", texto: "Luz entre dos lados sin conexión; la placa también debe aislar." }
      - { titulo: "Tres cifras.", texto: "Ensayo, trabajo continuo y distancias: no son lo mismo." }
      - { titulo: "CMTI.", texto: "Sin él, disparos espurios que solo salen con potencia." }
      - { titulo: "CTR de final de vida.", texto: "La mitad del mínimo: o un aislador digital." }
