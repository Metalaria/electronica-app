# Lección 1.2 de la sección 46.4 «Optoacopladores: Aislar con Luz» (cap45, sec-45.4). Formato: GUIA.md.
# - El CTR de diseño: el mínimo de final de vida, típicamente la mitad del mínimo de la hoja (bloque 118). Con el
#   optoacoplador del problema 46.C (CTR del 50 % al 300 %) y los 11,5 mA de la figura 46.7 (valores de ejemplo de la
#   figura), la corriente de colector garantizada es 0,25 × 11,5 mA = 2,875 mA.
# Paso práctico: «simular» la corriente de colector garantizada (errores: el CTR máximo, el mínimo sin envejecer).
# 1.2.1 (autor121-senpro, «aprender haciendo», GUIA §13): en la figura 46.7 se tocan el LED y la barrera por la que no
# debe pasar nada (la placa certificada que no aísla va a su éxito); la corriente que inyecta un salto de modo común se
# calcula con valores de ejemplo (1 pF, 50 kV/µs); con el CTR de final de vida se busca la corriente de LED que iguala
# al mínimo nuevo (y el aislador digital va a su éxito). Queda una pregunta de opciones (las tensiones de la hoja) y
# los dos usos, por emparejar.
leccion: cap45/sec-45.4

libro:
  103: "La señal cruza como luz y la barrera es física"
  105: "Aislar por seguridad"
  106: "Aislar por ruido: romper un bucle de tierra"
  109: "Es un número grande y no es la tensión de trabajo"
  110: "Tensión de trabajo continua, que es la que de verdad se puede aplicar permanentemente"
  111: "un optoacoplador certificado en una placa mal diseñada no aísla"
  112: "la ranura fresada bajo el componente"
  114: "el CMTI, medido en kV/µs"
  115: "la capacidad parásita entre ellos inyecta corriente que puede hacer conmutar el optoacoplador sin señal"
  116: "es un fallo grave y difícil de diagnosticar porque solo aparece con potencia"
  118: "típicamente la mitad del mínimo de la hoja"
  121: "no envejecen como un LED, son mucho más rápidos"
  122: "necesitan alimentación en ambos lados"
  123: "aislador digital salvo que la simplicidad del optoacoplador sea decisiva"
  126: "Debe ser inmensurable"
  127: "Resistencias y tensiones de ejemplo"
  128: "Envejecimiento del CTR según la corriente del LED"
  "cap45#376": "cuya CTR está especificada entre el 50 % y el 300 %"

modelo:
  valores:
    I_F: { sim: "I_{F}", nombre: "corriente del LED", unidad: A, valor: 0.0115 }
    C_min: { sim: "CTR_{mín}", nombre: "CTR mínimo de la hoja", unidad: "%", valor: 50 }
    C_max: { sim: "CTR_{máx}", nombre: "CTR máximo de la hoja", unidad: "%", valor: 300 }
    C_p: { sim: "C_{p}", nombre: "capacidad entre los lados", unidad: F, valor: 1e-12 }
    S_v: { sim: "dV/dt", nombre: "salto de modo común", unidad: "V/s", valor: 50000000000 }
    C_u: { sim: "CTR", nombre: "CTR con el que se diseña", unidad: "%", valor: 300 }
  calculos:
    I_C: { expr: "I_F*C_min/100/2", sim: "I_{C}", nombre: "corriente de colector garantizada", unidad: A }
    I_Cmax: { expr: "I_F*C_max/100", sim: "I_{C}", nombre: "con el CTR máximo", unidad: A }
    I_Cnuevo: { expr: "I_F*C_min/100", sim: "I_{C}", nombre: "con el mínimo sin envejecer", unidad: A }
    C_fin: { expr: "C_min/2", sim: "CTR", nombre: "CTR de final de vida", unidad: "%" }
    I_p: { expr: "C_p*S_v", sim: "i", nombre: "corriente inyectada", unidad: A }
    I_px: { expr: "C_p*S_v/1000", sim: "i", nombre: "con V/µs en vez de kV/µs", unidad: A }
    I_u: { expr: "I_F*C_u/100", sim: "I_{C}", nombre: "corriente de colector", unidad: A }

tarjetas:
  - id: explore-opto
    tipo: tocar
    titulo: "Aislar con luz"
    texto: "Un LED y un detector en el mismo encapsulado, sin conexión eléctrica. Toque lo que convierte la corriente de entrada en luz."
    libro: [103, 127]
    widget:
      tipo: figura
      figura: fig-45.7
      zonas: &zonas-opto
        - { id: led, rotulo: "Triángulo a la izquierda de la caja", rect: [130, 90, 44, 44] }
        - { id: barrera, rotulo: "Línea discontinua del centro", rect: [176, 66, 28, 90] }
        - { id: transistor, rotulo: "Círculo a la derecha de la caja", rect: [204, 90, 44, 44] }
    tocar:
      bien: [led]
      porque:
        barrera: "Es la barrera de aislamiento: la dan la distancia y el material, no un circuito."
        transistor: "Es el fototransistor del lado de salida, con su propia masa."
    exito: "El LED: la señal cruza como luz y la barrera es física."
    escalera:
      - "Busque el símbolo de diodo del lado de entrada."
    solucion: "El triángulo de la izquierda, el LED."

  - id: empareje-usos
    tipo: pregunta
    titulo: "Dos usos distintos"
    texto: "Empareje cada uso con lo que más importa en él."
    libro: [105, 106]
    widget:
      tipo: figura
      figura: fig-45.7
      zonas:
        - { id: todo, rotulo: "Optoacoplador entre dos circuitos", rect: [0, 0, 360, 220] }
    emparejar:
      - ["Aislar por seguridad", "Tensión de aislamiento y distancias"]
      - ["Aislar por ruido", "Velocidad y rechazo de modo común"]
    exito: "Separarlos evita elegir mal el componente."
    pistas:
      - { texto: "Romper un bucle de tierra es un problema de ruido." }
    escalera:
      - "Seguridad: que no pase la red al lado accesible."
    solucion: "Seguridad, aislamiento y distancias; ruido, velocidad y modo común."

  - id: pregunta-tensiones
    tipo: pregunta
    titulo: "Lo que dice la hoja de datos"
    texto: "La hoja da una tensión de aislamiento de ensayo muy alta. ¿Se puede aplicar siempre?"
    libro: [109, 110]
    widget:
      tipo: figura
      figura: fig-45.7
      zonas:
        - { id: barrera, rotulo: "Línea discontinua del centro", rect: [176, 66, 28, 90] }
    opciones:
      - texto: "No: es la de un minuto de prueba; la permanente es la de trabajo, bastante menor"
        bien: true
        porque: "Son tres cifras distintas: ensayo, trabajo continuo y distancias de fuga y de aire."
      - texto: "Sí: es la que soporta"
        porque: "La soporta durante un minuto en la prueba, no permanentemente."
      - texto: "Solo en alterna"
        porque: "No es cuestión de alterna o continua: es de duración."
    escalera:
      - "¿Cuánto dura el ensayo?"
    solucion: "No: la permanente es la tensión de trabajo continua."

  - id: porque-cmti
    tipo: simular
    titulo: "Disparos espurios con potencia"
    texto: "En un puente de potencia, la masa de un lado salta 50 kV/µs respecto a la otra, con 1 pF entre los lados. ¿Qué corriente inyecta esa capacidad?"
    nota: "Valores de ejemplo."
    libro: [114, 115, 116]
    simular:
      objetivo: I_p
      unidad: A
      tol: 0.03
      rotulo: "Corriente inyectada"
      errores:
        - { expr: "I_px", texto: "Ha tomado kilovoltios por voltios: son 50 kV/µs." }
    exito: "50 mA, más que la del LED: el driver conmuta sin señal, y solo con potencia. Hace falta más CMTI."
    escalera:
      - "i = C·dV/dt."
    solucion: "1 pF × 50 kV/µs = 50 mA."
    comprobar:
      - { I_p: 0.05, I_px: 0.00005, C_p: 1e-12, S_v: 50000000000 }

  - id: simule-ctr
    tipo: simular
    titulo: "Diseñar con el CTR de final de vida"
    texto: "CTR del 50 % al 300 %, y 11,5 mA en el LED. ¿Qué corriente de colector se puede garantizar al final de su vida?"
    libro: [118, 127, "cap45#376"]
    fijar: { I_F: 0.0115, C_min: 50, C_max: 300 }
    simular:
      objetivo: I_C
      unidad: A
      tol: 0.03
      rotulo: "Corriente de colector garantizada"
      errores:
        - { expr: "I_Cmax", texto: "Ha usado el CTR máximo: con una unidad del montón no tiene por qué llegar." }
        - { expr: "I_Cnuevo", texto: "Es el mínimo de la hoja, nuevo; con los años cae, típicamente a la mitad." }
    exito: "Unos 2,9 mA: el CTR de final de vida es la mitad del mínimo, el 25 %."
    escalera:
      - "CTR de diseño = la mitad del mínimo de la hoja."
      - "I_{C} = CTR · I_{F}."
    solucion: "25 % de 11,5 mA ≈ 2,9 mA."
    comprobar:
      - { I_C: 0.002875, I_Cmax: 0.0345, I_Cnuevo: 0.00575, C_fin: 25 }

  - id: explore-envejecimiento
    tipo: explorar
    titulo: "El CTR envejece"
    texto: "Nuevo, el mínimo de la hoja da 5,75 mA con 11,5 mA en el LED. Con el CTR de final de vida, busque la corriente de LED que garantiza lo mismo."
    libro: [118, 121, 122, 123, 128]
    inicio: { C_u: 300, I_F: 0.0115 }
    widget:
      tipo: grafica
      x: { id: x, min: 0, max: 0.03, unidad: A, rotulo: "I_{F}" }
      y: { min: 0, max: 0.03, unidad: A, rotulo: "I_{C}" }
      curvas:
        - { expr: "x*C_u/100", color: naranja, rotulo: "I_{C} = CTR·I_{F}" }
        - { expr: "0.00575", color: tinta, rotulo: "mínimo nuevo con 11,5 mA", discontinua: true }
      marcas:
        - { x: "I_F", y: "I_u", rotulo: "{{I_u}}" }
      lectura: { valor: I_u, rotulo: "Corriente de colector" }
      mandos:
        - { valor: C_u, lista: [300, 50, 25], nombres: [máximo, mínimo, final de vida], rotulo: "CTR de diseño" }
        - { valor: I_F, min: 0.005, max: 0.03, paso: 0.0005, rotulo: "Corriente del LED" }
    objetivo:
      condiciones:
        - { valor: C_u, max: 25, rotulo: "CTR de final de vida" }
        - { valor: I_u, min: 0.00575, rotulo: "I_{C} = {{I_u}}" }
      logrado: "{{I_F}}, el doble; pero más corriente acelera el envejecimiento. Un aislador digital no envejece, aunque necesita alimentación en ambos lados."
      pistas:
        - { cuando: { valor: C_u, mayor: 25 }, texto: "Diseñe con el CTR de final de vida." }
        - { texto: "Aún no llega: suba la corriente del LED." }
    escalera:
      - "Con la mitad de CTR hace falta el doble de corriente."
    solucion: "CTR del 25 % y 23 mA."
    comprobar:
      - { con: { C_u: 25, I_F: 0.023 }, I_u: 0.00575 }
      - { con: { C_u: 50, I_F: 0.0115 }, I_u: 0.00575 }

  - id: pregunta-fuga
    tipo: tocar
    titulo: "La fuga a través de la barrera"
    texto: "Con el óhmetro entre los dos lados de un optoacoplador se lee una resistencia medible. Toque por dónde no debería pasar nada."
    libro: [126, 111, 112]
    widget:
      tipo: figura
      figura: fig-45.7
      zonas: *zonas-opto
    tocar:
      bien: [barrera]
      porque:
        led: "El LED está en un solo lado; la medida es entre los dos."
        transistor: "El fototransistor está en un solo lado; la medida es entre los dos."
    exito: "Debe ser inmensurable: daño o contaminación. Y una placa mal diseñada no aísla: de ahí la ranura fresada bajo el componente."
    escalera:
      - "¿Qué separa los dos lados?"
    solucion: "La barrera del centro."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [103, 111, 115, 118, 122]
    ideas:
      - { titulo: "La barrera es física.", texto: "Luz entre dos lados sin conexión; la placa también debe aislar." }
      - { titulo: "Tres cifras.", texto: "Ensayo, trabajo continuo y distancias: no son lo mismo." }
      - { titulo: "CMTI.", texto: "Sin él, disparos espurios que solo salen con potencia." }
      - { titulo: "CTR de final de vida.", texto: "La mitad del mínimo: o un aislador digital." }
