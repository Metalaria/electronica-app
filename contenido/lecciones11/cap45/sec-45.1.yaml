# Lección 1.2 de la sección 46.1 «Emitir y Detectar Luz» (cap45, sec-45.1). Formato: GUIA.md.
# - E(eV) ≈ 1240/λ(nm) (bloque 6): 2,0 eV a 620 nm y 2,76 eV a 450 nm (bloque 7).
# - Corte del silicio: λ = 1240/1,12 = 1107 nm, el «1 100 nm» del bloque 16.
# Paso práctico: «simular» el corte del silicio (error: multiplicar en vez de dividir) y «tocar» en la figura 46.1 el
# diagrama de bandas que emite.
leccion: cap45/sec-45.1

libro:
  3: "la energía de un fotón corresponde a un salto entre bandas"
  4: 'E = h dot.op f'
  6: '("1240")/(λ lr(( "nm" )))'
  7: "un LED rojo de 620 nm tenga un salto de 2,0 eV y uno azul de 450 nm, de 2,76 eV"
  9: "un electrón cae de la banda de conducción a la de valencia y emite un fotón de la energía del salto"
  10: "es un semiconductor de banda indirecta, en el que esa transición necesita además un fonón"
  11: "el color depende del compuesto, no del dopado"
  12: "hacía falta un material de banda ancha y directa que además se pudiera fabricar con calidad, y ese fue el GaN"
  14: "un fotón con energía mayor que la banda prohibida crea un par electrón-hueco"
  15: "hay una longitud de onda de corte"
  16: "Para el silicio, con 1,12 eV, ese corte está en 1 100 nm"
  18: "para medir luz visible hace falta un filtro"
  19: "La eficiencia cuántica no es del 100 %"
  22: "expuesto a luz de longitud de onda algo menor que la que emite, genera una pequeña corriente"
  23: "en un multiplexado mal diseñado los LED apagados pueden influir en las lecturas"
  28: "Esa asimetría entre lo que ve el ojo y lo que ve el silicio"

modelo:
  valores:
    l_n: { sim: "λ", nombre: "longitud de onda", unidad: m, valor: 0.00000062 }
    E_g: { sim: "E_{g}", nombre: "banda prohibida", unidad: eV, valor: 1.12 }
  calculos:
    E_f: { expr: "1240/(l_n*1000000000)", sim: "E", nombre: "energía del fotón", unidad: eV }
    l_c: { expr: "1240/E_g/1000000000", sim: "λ_{corte}", nombre: "longitud de onda de corte", unidad: m }
    l_x: { expr: "1240*E_g/1000000000", sim: "λ", nombre: "multiplicando en vez de dividir", unidad: m }

tarjetas:
  - id: explore-energia
    tipo: explorar
    titulo: "Un fotón, un salto de bandas"
    texto: "La energía del fotón es la del salto entre bandas. Cambie la longitud de onda."
    libro: [3, 6, 7, 16]
    widget:
      tipo: grafica
      x: { id: x, min: 0.00000035, max: 0.0000014, unidad: m, rotulo: "λ" }
      y: { min: 0.5, max: 3.6, unidad: eV, rotulo: "E" }
      curvas:
        - { expr: "1240/(x*1000000000)", color: azul, rotulo: "E ≈ 1240/λ" }
      marcas:
        - { x: "l_n", y: "E_f", rotulo: "{{E_f}}" }
      lectura: { valor: E_f, rotulo: "Energía del fotón" }
      mandos:
        - { valor: l_n, lista: [0.00000045, 0.00000062, 0.0000011], nombres: [azul, rojo, corte del silicio], rotulo: "Longitud de onda" }
    requiere: { mover: [l_n] }

  - id: formula-ev
    tipo: formula
    titulo: "En unidades prácticas"
    texto: "E = h·c/λ, con λ en nanómetros y E en electronvoltios, se queda en 1240/λ."
    libro: [4, 6]
    ec: 6
    sustitucion: "1240 / {{l_n}} = {{E_f}}"
    widget:
      tipo: grafica
      x: { id: x, min: 0.00000035, max: 0.0000014, unidad: m, rotulo: "λ" }
      y: { min: 0.5, max: 3.6, unidad: eV, rotulo: "E" }
      curvas:
        - { expr: "1240/(x*1000000000)", color: azul, rotulo: "E ≈ 1240/λ" }
      marcas:
        - { x: "l_n", y: "E_f", rotulo: "{{E_f}}" }
      lectura: { valor: E_f, rotulo: "Energía del fotón" }
      mandos:
        - { valor: l_n, lista: [0.00000045, 0.00000062, 0.0000011], nombres: [azul, rojo, corte del silicio], rotulo: "Longitud de onda" }

  - id: estime-azul
    tipo: pregunta
    titulo: "Un LED azul"
    texto: "Un LED azul emite a 450 nm. ¿Qué salto de bandas tiene?"
    libro: [6, 7]
    fijar: { l_n: 0.00000045 }
    widget:
      tipo: figura
      figura: fig-45.1
      zonas:
        - { id: grafica, rotulo: "Energía frente a λ", rect: [0, 0, 250, 209] }
    estimar:
      objetivo: "E_f"
      unidad: eV
      min: 0.5
      max: 4
      paso: 0.01
      inicio: 1.2
      tol: 0.03
      rotulo: "Salto de bandas"
    exito: "2,76 eV: más que el rojo, y su tensión directa sigue el mismo orden."
    pistas:
      - { cuando: { valor: estimacion, mayor: 2.84 }, texto: "Demasiado: 1240 entre 450." }
      - { texto: "Demasiado poco: λ más corta es más energía. 1240/450." }
    escalera:
      - "E ≈ 1240/λ, con λ en nm."
    solucion: "1240/450 = 2,76 eV."
    comprobar:
      - { E_f: 2.756 }

  - id: predecir-termico
    tipo: predecir
    titulo: "El infrarrojo térmico"
    texto: "Un fotodiodo de silicio apunta a un objeto caliente que solo emite infrarrojo térmico, más allá de 1 100 nm. ¿Qué detecta?"
    libro: [14, 15, 16]
    widget:
      tipo: figura
      figura: fig-45.1
      zonas:
        - { id: sombra, rotulo: "Zona gris de la gráfica", rect: [186, 20, 61, 161] }
    opciones:
      - texto: "Nada: el fotón no tiene energía para crear un par"
        bien: true
        porque: "Por encima del corte, el detector no ve nada; hacen falta InGaAs o detectores térmicos."
      - texto: "Poco, pero algo, como con luz débil"
        porque: "No es cuestión de cantidad: cada fotón, por sí solo, no llega a la banda prohibida."
      - texto: "Mucho, porque el silicio ve el infrarrojo"
        porque: "Ve el infrarrojo cercano, hasta el corte; el térmico queda más allá."
    escalera:
      - "Compare la energía del fotón con los 1,12 eV del silicio."
    solucion: "Nada: λ por encima del corte, fotón sin energía suficiente."

  - id: simule-corte
    tipo: simular
    titulo: "El corte del silicio"
    texto: "El silicio tiene 1,12 eV de banda prohibida. ¿Cuál es su longitud de onda de corte?"
    libro: [6, 16]
    fijar: { E_g: 1.12 }
    simular:
      objetivo: l_c
      unidad: m
      tol: 0.03
      rotulo: "Longitud de onda de corte"
      errores:
        - { expr: "l_x", texto: "Ha multiplicado: λ es 1240 entre la energía, no por ella." }
    exito: "Unos 1 100 nm: ve el infrarrojo cercano y no el térmico."
    escalera:
      - "Despeje λ de E ≈ 1240/λ."
    solucion: "1240/1,12 ≈ 1 100 nm."
    comprobar:
      - { l_c: 0.0000011071, l_x: 0.0000013888 }

  - id: porque-silicio
    tipo: porque
    titulo: "Por qué el silicio no emite"
    texto: "El silicio detecta luz muy bien. ¿Por qué no sirve para hacer LED?"
    libro: [9, 10, 11]
    widget:
      tipo: figura
      figura: fig-45.1
      zonas:
        - { id: indirecta, rotulo: "Diagrama de la derecha", rect: [364, 7, 80, 172] }
    opciones:
      - texto: "Es de banda indirecta: la transición necesita además un fonón"
        bien: true
        porque: "La recombinación radiativa es muy improbable y la energía se va en calor."
      - texto: "Porque su banda prohibida es demasiado ancha"
        porque: "Es estrecha, 1,12 eV; el problema es que es indirecta."
      - texto: "Porque no se puede dopar bien"
        porque: "Se dopa perfectamente; además, el color depende del compuesto, no del dopado."
    escalera:
      - "Mire dónde está el mínimo de la banda de conducción frente al máximo de la de valencia."
    solucion: "Banda indirecta: hace falta un fonón y el salto acaba en calor."

  - id: toque-directa
    tipo: tocar
    titulo: "El material que emite"
    texto: "Toque el diagrama de bandas del material que emite luz con eficiencia."
    libro: [11, 12]
    widget:
      tipo: figura
      figura: fig-45.1
      zonas:
        - { id: directa, rotulo: "Diagrama del centro", rect: [272, 7, 80, 172] }
        - { id: indirecta, rotulo: "Diagrama de la derecha", rect: [364, 7, 80, 172] }
        - { id: grafica, rotulo: "Gráfica de la izquierda", rect: [0, 0, 250, 209] }
    tocar:
      bien: [directa]
      porque:
        indirecta: "Es el silicio, de banda indirecta: hace falta un fonón y la energía acaba en calor."
        grafica: "Es la energía del fotón frente a λ, no el diagrama de bandas de un material."
    exito: "Banda directa: GaAs, GaN, InGaP. El GaN dio el LED azul."
    escalera:
      - "Busque el mínimo justo encima del máximo."
    solucion: "El del centro, banda directa."

  - id: pregunta-visible
    tipo: pregunta
    titulo: "Medir luz visible"
    texto: "Se quiere medir luz visible con un fotodiodo de silicio. ¿Qué hace falta?"
    libro: [18, 19, 28]
    widget:
      tipo: figura
      figura: fig-45.1
      zonas:
        - { id: grafica, rotulo: "Gráfica de la izquierda", rect: [0, 0, 250, 209] }
    opciones:
      - texto: "Un filtro: su máximo está en el infrarrojo cercano"
        bien: true
        porque: "El silicio responde donde el ojo no ve; sin filtro, el infrarrojo falsea la medida."
      - texto: "Nada: el silicio ve igual que el ojo"
        porque: "Ve hasta 1 100 nm, mucho más allá del rojo; el ojo no."
      - texto: "Polarizarlo más"
        porque: "La polarización cambia la velocidad, no la respuesta espectral."
    escalera:
      - "¿Dónde tiene su máximo un fotodiodo de silicio?"
    solucion: "Un filtro que quite el infrarrojo cercano."

  - id: pregunta-led-detector
    tipo: pregunta
    titulo: "Un LED que detecta"
    texto: "Un LED apagado recibe luz de longitud de onda algo menor que la que emite. ¿Qué ocurre?"
    libro: [22, 23]
    widget:
      tipo: figura
      figura: fig-45.1
      zonas:
        - { id: grafica, rotulo: "Gráfica de la izquierda", rect: [0, 0, 250, 209] }
    opciones:
      - texto: "Genera una pequeña corriente: hace de detector, aunque mal"
        bien: true
        porque: "Los dos sentidos en el mismo dispositivo; en un multiplexado puede falsear lecturas."
      - texto: "Nada: un LED solo emite"
        porque: "Toda unión con fotones de energía suficiente genera pares."
      - texto: "Se enciende"
        porque: "No: genera una corriente pequeñísima, no la que hace falta para lucir."
    escalera:
      - "Un fotón algo más energético que su salto, ¿qué crea?"
    solucion: "Una pequeña corriente: un sensor rudimentario."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [6, 10, 11, 15, 16]
    ideas:
      - { titulo: "E ≈ 1240/λ.", texto: "Rojo de 620 nm, 2,0 eV; azul de 450 nm, 2,76 eV." }
      - { titulo: "Emitir.", texto: "Banda directa (GaAs, GaN); el silicio, indirecto, da calor." }
      - { titulo: "Detectar.", texto: "Hay un corte: el silicio, en 1 100 nm." }
      - { titulo: "El silicio ve el infrarrojo.", texto: "Para luz visible, un filtro." }
