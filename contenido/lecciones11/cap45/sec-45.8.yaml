# Lección 1.2 de la sección 46.8 «Comunicación por Luz» (cap45, sec-45.8). Formato: GUIA.md.
# - Fibra en la ventana de 1550 nm: 0,2 dB/km, 20 dB en cien kilómetros (bloque 242).
# - Presupuesto de pérdidas (bloque 259): cada conector de 0,3 a 0,75 dB (se usa el peor, 0,75) y cada empalme 0,1 dB.
#   El enlace de 20 km con 2 conectores y 4 empalmes es de ejemplo: 4 + 1,5 + 0,4 = 5,9 dB.
# Paso práctico: «simular» la pérdida del enlace (errores: sin conectores, sin empalmes).
leccion: cap45/sec-45.8

libro:
  234: "Aislamiento total, sin camino de corriente"
  235: "una fibra no capta nada, ni siquiera junto a un motor o a un rayo"
  236: "la frecuencia portadora es de cientos de terahercios"
  239: "su límite es la dispersión modal: los distintos caminos tardan tiempos distintos, y el pulso se ensancha"
  240: "núcleo de unos 9 µm, por el que solo cabe un modo"
  242: "en la última baja a 0,2 dB/km, una cifra extraordinaria: la señal recorre cien kilómetros perdiendo solo 20 dB"
  243: "Es lo que limita el producto velocidad por distancia"
  246: "Su balance se calcula como el de radio"
  249: "infrarrojo modulado a 38 kHz, con el receptor sintonizado a esa frecuencia"
  251: "la niebla y la lluvia los interrumpen"
  252: "usar la iluminación LED, modulada a frecuencias imperceptibles, como canal de datos"
  256: "Es la causa número uno de fallos en instalaciones ópticas"
  257: "doblar una fibra por debajo de él hace que la luz escape del núcleo"
  259: "contando cada conector (0,3 a 0,75 dB) y cada empalme (0,1 dB)"
  261: "comparada con la calculada dice si hay un conector sucio o una curvatura excesiva"
  262: "mirar el extremo de la fibra con una cámara de móvil (que ve el infrarrojo) para confirmar que hay luz. Nunca con el ojo directamente"

modelo:
  valores:
    L_f: { sim: "L", nombre: "longitud de la fibra", unidad: m, valor: 100000 }
    a_f: { sim: "α", nombre: "atenuación de la fibra", unidad: "dB/km", valor: 0.2 }
    n_c: { sim: "n_{c}", nombre: "conectores", unidad: "", valor: 2 }
    n_e: { sim: "n_{e}", nombre: "empalmes", unidad: "", valor: 4 }
  calculos:
    P_f: { expr: "a_f*L_f/1000", sim: "pérdida", nombre: "pérdida de la fibra", unidad: dB }
    P_tot: { expr: "P_f + 0.75*n_c + 0.1*n_e", sim: "pérdida", nombre: "pérdida total del enlace", unidad: dB }
    P_c: { expr: "0.75*n_c", sim: "conectores", nombre: "pérdida de los conectores", unidad: dB }
    P_e: { expr: "0.1*n_e", sim: "empalmes", nombre: "pérdida de los empalmes", unidad: dB }
    P_sc: { expr: "P_f + 0.1*n_e", sim: "pérdida", nombre: "sin los conectores", unidad: dB }
    P_se: { expr: "P_f + 0.75*n_c", sim: "pérdida", nombre: "sin los empalmes", unidad: dB }

tarjetas:
  - id: explore-ventanas
    tipo: explorar
    titulo: "La fibra óptica"
    texto: "Un núcleo de vidrio confina la luz por reflexión total. Toque las ventanas de atenuación y los dos tipos de fibra."
    libro: [239, 240, 242]
    widget:
      tipo: figura
      figura: fig-45.15
      zonas:
        - { id: ventanas, rotulo: "Gráfica de la izquierda", rect: [0, 0, 224, 220], texto: "Mínimos en 850, 1310 y 1550 nm; en la última, 0,2 dB/km." }
        - { id: tipos, rotulo: "Gráfica de la derecha", rect: [224, 0, 224, 220], texto: "Multimodo, núcleo grueso y muchos caminos; monomodo, unos 9 µm y un solo modo." }
    requiere: { mover: [ventanas, tipos] }

  - id: empareje-ventajas
    tipo: pregunta
    titulo: "Por qué con luz"
    texto: "Empareje cada ventaja de la luz como portadora con su razón."
    libro: [234, 235, 236]
    widget:
      tipo: figura
      figura: fig-45.15
      zonas:
        - { id: ventanas, rotulo: "Gráfica de la izquierda", rect: [0, 0, 224, 220] }
    emparejar:
      - ["Aislamiento total", "No hay camino de corriente"]
      - ["Inmunidad a interferencias", "La fibra no capta ni emite nada"]
      - ["Ancho de banda enorme", "Portadora de cientos de terahercios"]
    exito: "Ninguna señal eléctrica ofrece las tres a la vez."
    pistas:
      - { texto: "Una modulación de gigahercios es minúscula frente a cientos de terahercios." }
    escalera:
      - "El vidrio no conduce."
    solucion: "Sin corriente; no capta; portadora de terahercios."

  - id: empareje-tipos
    tipo: pregunta
    titulo: "Multimodo y monomodo"
    texto: "Empareje cada fibra con sus rasgos."
    libro: [239, 240]
    widget:
      tipo: figura
      figura: fig-45.15
      zonas:
        - { id: tipos, rotulo: "Gráfica de la derecha", rect: [224, 0, 224, 220] }
    emparejar:
      - ["Multimodo", "Barata, fácil de acoplar; decenas o cientos de metros"]
      - ["Monomodo", "Láser y alineación de micras; cientos de kilómetros"]
    exito: "Sin dispersión modal, la monomodo llega mucho más lejos."
    pistas:
      - { texto: "Por un núcleo de unos 9 µm solo cabe un modo." }
    escalera:
      - "Muchos caminos ensanchan el pulso."
    solucion: "Multimodo, corta y barata; monomodo, larga y precisa."

  - id: porque-dispersion
    tipo: porque
    titulo: "El límite de la multimodo"
    texto: "¿Por qué la fibra multimodo sirve solo para decenas o cientos de metros?"
    libro: [239, 243]
    widget:
      tipo: figura
      figura: fig-45.15
      zonas:
        - { id: tipos, rotulo: "Gráfica de la derecha", rect: [224, 0, 224, 220] }
    opciones:
      - texto: "Los distintos caminos tardan distinto y el pulso se ensancha"
        bien: true
        porque: "Es la dispersión modal: limita el producto velocidad por distancia."
      - texto: "Porque atenúa mucho más"
        porque: "El límite principal es el ensanchamiento del pulso, no la atenuación."
      - texto: "Porque usa LED en vez de láser"
        porque: "El LED se acopla bien a ella; el problema son los muchos modos."
    escalera:
      - "Muchos caminos de longitudes distintas."
    solucion: "La dispersión modal ensancha el pulso."

  - id: estime-100km
    tipo: pregunta
    titulo: "Cien kilómetros de fibra"
    texto: "En la ventana de 1550 nm la fibra pierde 0,2 dB/km. ¿Cuánto pierde en cien kilómetros?"
    libro: [242]
    fijar: { L_f: 100000, a_f: 0.2 }
    widget:
      tipo: figura
      figura: fig-45.15
      zonas:
        - { id: ventanas, rotulo: "Gráfica de la izquierda", rect: [0, 0, 224, 220] }
    estimar:
      objetivo: "P_f"
      unidad: dB
      min: 0
      max: 100
      paso: 1
      inicio: 80
      tol: 0.05
      rotulo: "Pérdida de la fibra"
    exito: "Solo 20 dB: una cifra extraordinaria."
    pistas:
      - { cuando: { valor: estimacion, mayor: 21 }, texto: "Demasiado: 0,2 por cada kilómetro." }
      - { texto: "Demasiado poco: cien veces 0,2 dB." }
    escalera:
      - "dB/km por km."
    solucion: "100 × 0,2 = 20 dB."
    comprobar:
      - { P_f: 20 }

  - id: simule-presupuesto
    tipo: simular
    titulo: "El presupuesto de pérdidas"
    texto: "Un enlace de 20 km a 0,2 dB/km, con 2 conectores de 0,75 dB y 4 empalmes de 0,1 dB. ¿Cuánto pierde?"
    nota: "Longitud y número de conectores y empalmes, de ejemplo."
    libro: [246, 259, 242]
    fijar: { L_f: 20000, a_f: 0.2, n_c: 2, n_e: 4 }
    simular:
      objetivo: P_tot
      unidad: dB
      tol: 0.03
      rotulo: "Pérdida del enlace"
      errores:
        - { expr: "P_sc", texto: "Le faltan los conectores: 0,75 dB cada uno en el peor caso." }
        - { expr: "P_se", texto: "Le faltan los empalmes: 0,1 dB cada uno." }
    exito: "5,9 dB, que se comparan con la sensibilidad del receptor, como un balance de radio."
    escalera:
      - "Fibra + conectores + empalmes."
    solucion: "4 + 1,5 + 0,4 = 5,9 dB."
    comprobar:
      - { P_f: 4, P_tot: 5.9, P_sc: 4.4, P_se: 5.5, P_c: 1.5, P_e: 0.4 }

  - id: predecir-mando
    tipo: predecir
    titulo: "Un mando bajo el sol"
    texto: "Un mando a distancia funciona incluso a pleno sol. ¿Por qué?"
    libro: [249]
    widget:
      tipo: figura
      figura: fig-45.15
      zonas:
        - { id: ventanas, rotulo: "Gráfica de la izquierda", rect: [0, 0, 224, 220] }
    opciones:
      - texto: "Su infrarrojo va modulado a 38 kHz y el receptor solo escucha esa frecuencia"
        bien: true
        porque: "Es la técnica contra la luz ambiente: el sol no está modulado a 38 kHz."
      - texto: "Porque emite mucha más luz que el sol"
        porque: "Emite muy poca: lo que lo distingue es la modulación."
      - texto: "Porque el sol no tiene infrarrojo"
        porque: "Tiene mucho; sin modulación lo taparía."
    escalera:
      - "¿Qué tiene la señal del mando que el sol no tiene?"
    solucion: "La modulación a 38 kHz."

  - id: empareje-espacio
    tipo: pregunta
    titulo: "Sin fibra"
    texto: "Empareje cada uso de la luz por el aire con su rasgo."
    libro: [249, 251, 252]
    widget:
      tipo: figura
      figura: fig-45.15
      zonas:
        - { id: ventanas, rotulo: "Gráfica de la izquierda", rect: [0, 0, 224, 220] }
    emparejar:
      - ["Mando a distancia", "Infrarrojo modulado a 38 kHz"]
      - ["Enlace entre edificios", "La niebla y la lluvia lo cortan"]
      - ["LiFi", "La iluminación LED como canal de datos"]
    exito: "IrDA, la de datos por infrarrojo, está hoy en desuso."
    pistas:
      - { texto: "Un enlace de kilómetros por el aire depende del tiempo." }
    escalera:
      - "LiFi modula la luz a frecuencias imperceptibles."
    solucion: "Mando, 38 kHz; edificios, niebla; LiFi, iluminación."

  - id: pregunta-conector
    tipo: pregunta
    titulo: "La causa número uno"
    texto: "Un enlace de fibra monomodo pierde mucho más de lo calculado. ¿Qué se sospecha primero?"
    libro: [256, 257, 261]
    widget:
      tipo: figura
      figura: fig-45.15
      zonas:
        - { id: tipos, rotulo: "Gráfica de la derecha", rect: [224, 0, 224, 220] }
    opciones:
      - texto: "Un conector sucio"
        bien: true
        porque: "Una mota de polvo bloquea buena parte de la señal: la causa número uno."
      - texto: "Que la fibra es mala"
        porque: "La fibra pierde poco; lo habitual es un conector o una curvatura."
      - texto: "Que la luz es demasiado fuerte"
        porque: "Sobrar luz no aumenta las pérdidas."
    escalera:
      - "En monomodo la alineación es de micras."
    solucion: "Un conector sucio; después, una curvatura excesiva."

  - id: pregunta-camara
    tipo: pregunta
    titulo: "¿Hay luz en la fibra?"
    texto: "Sin medidor de potencia óptica, ¿cómo se comprueba que sale luz infrarroja por una fibra?"
    libro: [262]
    widget:
      tipo: figura
      figura: fig-45.15
      zonas:
        - { id: ventanas, rotulo: "Gráfica de la izquierda", rect: [0, 0, 224, 220] }
    opciones:
      - texto: "Con la cámara de un móvil, que ve el infrarrojo"
        bien: true
        porque: "Confirma que hay luz sin exponer el ojo."
      - texto: "Mirando el extremo con el ojo"
        porque: "Nunca: el infrarrojo no se ve y puede dañar el ojo sin avisar."
      - texto: "Con el multímetro"
        porque: "El multímetro no mide luz."
    escalera:
      - "¿Qué aparato de bolsillo ve el infrarrojo?"
    solucion: "La cámara del móvil; nunca el ojo."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [234, 239, 242, 249, 256]
    ideas:
      - { titulo: "Luz como portadora.", texto: "Aislamiento, inmunidad y un ancho de banda enorme." }
      - { titulo: "Fibra.", texto: "Multimodo corta por dispersión modal; monomodo, 0,2 dB/km a 1550 nm." }
      - { titulo: "Balance.", texto: "Fibra, conectores y empalmes contra la sensibilidad." }
      - { titulo: "Lo práctico.", texto: "Conectores limpios, curvas suaves y nunca mirar el haz." }
