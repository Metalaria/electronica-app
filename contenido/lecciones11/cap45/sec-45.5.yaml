# Lección 1.2 de la sección 46.5 «Tipos de Display» (cap45, sec-45.5). Formato: GUIA.md.
# - El buffer de un TFT de 320×240 a 16 bits: 320·240·16/8 = 153 600 bytes, los 150 KB del bloque 141.
# Paso práctico: «tocar» en la foto 46.10 el display legible a pleno sol.
leccion: cap45/sec-45.5

libro:
  131: "cada tecnología resuelve bien un caso y mal los demás"
  133: "es legible a distancia y con luz ambiente fuerte, incluso a pleno sol, cosa que ningún LCD consigue"
  134: "cuatro dígitos son 32 LED"
  135: "confundirlos es un error frecuente al sustituir: el display no enciende y parece averiado"
  137: "consume muy poco (el módulo sin retroiluminación, en torno a un miliamperio"
  138: "una pantalla en blanco o con todos los cuadros negros que parece rota y no lo está"
  141: "Un buffer completo de 320×240 a 16 bits son 150 KB"
  143: "consumo proporcional a lo que se muestra"
  144: "de ahí que los interfaces OLED muevan los elementos fijos"
  147: "Solo consume al cambiar la imagen"
  148: "deba durar meses con una pila"
  149: "No sirve para nada que se mueva"
  151: "Legible al sol"
  152: "dígitos vistos de lejos, siete segmentos"
  154: "muchos displays son de 3,3 V y no toleran 5 V"
  156: "Dos displays idénticos por fuera con controladores distintos son dos proyectos distintos"
  157: "suele superar al de todo el resto del circuito"
  159: "alimentación en sus pines (sección 55.6), contraste si es LCD"
  161: "LED de siete segmentos mostrando un 4 en una protoboard"

modelo:
  valores:
    n_x: { sim: "n_{x}", nombre: "píxeles en horizontal", unidad: "", valor: 320 }
    n_y: { sim: "n_{y}", nombre: "píxeles en vertical", unidad: "", valor: 240 }
    b_p: { sim: "b", nombre: "bits por píxel", unidad: "", valor: 16 }
  calculos:
    buf: { expr: "n_x*n_y*b_p/8/1024", sim: "buffer", nombre: "memoria del buffer", unidad: KB }
    n_px: { expr: "n_x*n_y", sim: "N", nombre: "píxeles", unidad: "" }
    n_by: { expr: "n_x*n_y*b_p/8", sim: "bytes", nombre: "bytes del buffer", unidad: "" }
    buf_b: { expr: "n_x*n_y*b_p/1024", sim: "buffer", nombre: "en bits por mil", unidad: KB }

tarjetas:
  - id: explore-tabla
    tipo: explorar
    titulo: "Cinco tecnologías, cinco problemas"
    texto: "Elegir un display no es elegir un tamaño. Toque cada columna de la comparación."
    libro: [131, 151]
    widget:
      tipo: figura
      figura: fig-45.9
      zonas:
        - { id: muestra, rotulo: "Columna Muestra", rect: [96, 5, 50, 140], texto: "Siete segmentos, solo dígitos; LCD de caracteres, texto; TFT, OLED y e-ink, todo." }
        - { id: consumo, rotulo: "Columna Consumo", rect: [151, 5, 73, 140], texto: "El e-ink casi nada; el OLED, según lo que muestra; TFT y LED, alto." }
        - { id: sol, rotulo: "Columna Legible al sol", rect: [227, 5, 68, 140], texto: "Siete segmentos y e-ink, excelentes; el TFT, malo." }
        - { id: refresco, rotulo: "Columna Refresco", rect: [297, 5, 56, 140], texto: "El e-ink es lento: no sirve para nada que se mueva." }
        - { id: coste, rotulo: "Columna Coste", rect: [363, 5, 60, 140], texto: "Siete segmentos y LCD de caracteres, bajo; e-ink, alto." }
    requiere: { mover: [muestra, consumo, sol, refresco] }

  - id: empareje-criterio
    tipo: pregunta
    titulo: "El criterio"
    texto: "Empareje cada necesidad con su tecnología."
    libro: [152]
    widget:
      tipo: figura
      figura: fig-45.9
      zonas:
        - { id: tabla, rotulo: "La tabla de decisión", rect: [0, 0, 453, 166] }
    emparejar:
      - ["Dígitos vistos de lejos", "Siete segmentos"]
      - ["Texto sencillo y barato", "LCD de caracteres"]
      - ["Interfaz rica", "TFT"]
      - ["Poco consumo con gráficos", "OLED"]
      - ["Información estática meses con pila", "E-ink"]
    exito: "Cada una resuelve bien un caso; la equivocada se paga en consumo, legibilidad o coste."
    pistas:
      - { texto: "El e-ink solo consume al cambiar la imagen." }
    escalera:
      - "El OLED consume según lo que muestra: con fondo negro, poquísimo."
    solucion: "Dígitos, siete segmentos; texto, LCD; interfaz, TFT; gráficos con poco consumo, OLED; estático, e-ink."

  - id: toque-sol
    tipo: tocar
    titulo: "A pleno sol"
    texto: "Toque en la foto el display que se sigue leyendo a pleno sol."
    libro: [133, 161]
    widget:
      tipo: figura
      figura: fig-45.10
      zonas:
        - { id: siete, rotulo: "Foto de la izquierda", rect: [0, 0, 360, 393] }
        - { id: lcd, rotulo: "Foto del centro", rect: [380, 0, 600, 393] }
        - { id: amoled, rotulo: "Foto de la derecha", rect: [1020, 0, 580, 393] }
    tocar:
      bien: [siete]
      porque:
        lcd: "Un LCD de caracteres es regular al sol, y depende del ángulo de visión."
        amoled: "Una matriz AMOLED tiene menos brillo máximo que un TFT bajo el sol: regular."
    exito: "El de siete segmentos: legible incluso a pleno sol, cosa que ningún LCD consigue."
    escalera:
      - "Busque el que emite su propia luz con LED grandes."
    solucion: "El de siete segmentos, a la izquierda."

  - id: pregunta-anodo
    tipo: pregunta
    titulo: "Un siete segmentos que no enciende"
    texto: "Se sustituye un display de siete segmentos por otro igual por fuera, y no enciende. ¿Qué es lo más probable?"
    libro: [134, 135]
    widget:
      tipo: figura
      figura: fig-45.10
      zonas:
        - { id: siete, rotulo: "Foto de la izquierda", rect: [0, 0, 360, 393] }
    opciones:
      - texto: "Ánodo común en lugar de cátodo común, o al revés"
        bien: true
        porque: "Confundirlos es un error frecuente: parece averiado y no lo está."
      - texto: "Que está fundido"
        porque: "Puede, pero lo habitual al sustituir es el tipo de común cambiado."
      - texto: "Que le falta un controlador"
        porque: "Funcionaba con el mismo circuito; lo que cambia es el común."
    escalera:
      - "Hay dos tipos que por fuera son iguales."
    solucion: "El común cambiado: ánodo por cátodo."

  - id: predecir-contraste
    tipo: predecir
    titulo: "Un LCD en blanco"
    texto: "Un LCD de caracteres recién montado sale en blanco, o con todos los cuadros negros. ¿Qué mira primero?"
    libro: [138, 159]
    widget:
      tipo: figura
      figura: fig-45.10
      zonas:
        - { id: lcd, rotulo: "Foto del centro", rect: [380, 0, 600, 393] }
    opciones:
      - texto: "El ajuste de contraste, el potenciómetro"
        bien: true
        porque: "Su ausencia o mal ajuste da ese síntoma clásico: parece roto y no lo está."
      - texto: "Que el display está roto"
        porque: "Es lo que parece, y casi nunca lo es."
      - texto: "La retroiluminación"
        porque: "La retroiluminación da luz de fondo; los cuadros negros son contraste."
    escalera:
      - "¿Qué ajuste necesita siempre un LCD de caracteres?"
    solucion: "El contraste."

  - id: estime-buffer
    tipo: pregunta
    titulo: "La memoria de un TFT"
    texto: "Un TFT de 320×240 píxeles a 16 bits. ¿Cuánta memoria ocupa un buffer completo?"
    libro: [141]
    fijar: { n_x: 320, n_y: 240, b_p: 16 }
    widget:
      tipo: figura
      figura: fig-45.9
      zonas:
        - { id: tabla, rotulo: "La tabla de decisión", rect: [0, 0, 453, 166] }
    estimar:
      objetivo: "buf"
      unidad: KB
      min: 0
      max: 1500
      paso: 10
      inicio: 1200
      tol: 0.05
      rotulo: "Buffer"
    exito: "150 KB, muy por encima de la RAM de un microcontrolador pequeño: se dibuja sin buffer."
    pistas:
      - { cuando: { valor: estimacion, mayor: 158 }, texto: "Demasiado: 16 bits son 2 bytes por píxel, no 16." }
      - { texto: "Demasiado poco: 76 800 píxeles de 2 bytes." }
    escalera:
      - "Píxeles × 2 bytes."
    solucion: "320 × 240 × 2 = 153 600 bytes: 150 KB."
    comprobar:
      - { buf: 150, buf_b: 1200, n_px: 76800, n_by: 153600 }

  - id: pregunta-oled
    tipo: porque
    titulo: "Una interfaz OLED"
    texto: "¿Por qué las interfaces OLED mueven los elementos fijos?"
    libro: [143, 144]
    widget:
      tipo: figura
      figura: fig-45.10
      zonas:
        - { id: amoled, rotulo: "Foto de la derecha", rect: [1020, 0, 580, 393] }
    opciones:
      - texto: "Los píxeles que más se usan pierden brillo antes y dejan una imagen fantasma"
        bien: true
        porque: "Es el envejecimiento diferencial: cada píxel emite su propia luz y se gasta por su cuenta."
      - texto: "Para ahorrar energía"
        porque: "El ahorro viene de mostrar negro; moverlos es por el envejecimiento."
      - texto: "Por el refresco lento"
        porque: "El OLED refresca rápido; el lento es el e-ink."
    escalera:
      - "¿Qué le pasa a un píxel que está siempre encendido?"
    solucion: "Para repartir el envejecimiento y evitar la imagen fantasma."

  - id: pregunta-eink
    tipo: pregunta
    titulo: "Un sensor que dure meses"
    texto: "Una etiqueta que muestra un dato que cambia cada hora y debe durar meses con una pila. ¿Qué display?"
    libro: [147, 148, 149]
    widget:
      tipo: figura
      figura: fig-45.9
      zonas:
        - { id: tabla, rotulo: "La tabla de decisión", rect: [0, 0, 453, 166] }
    opciones:
      - texto: "E-ink"
        bien: true
        porque: "Solo consume al cambiar la imagen y se mantiene sin alimentación."
      - texto: "OLED"
        porque: "Consume mientras muestra algo; meses con una pila no."
      - texto: "TFT"
        porque: "Su retroiluminación domina el consumo: lo descarta a pila."
    escalera:
      - "¿Cuál consume casi nada mientras la imagen no cambia?"
    solucion: "E-ink."

  - id: ordene-diagnostico
    tipo: pregunta
    titulo: "Un display que no funciona"
    texto: "Ordene el diagnóstico de un display que no funciona."
    libro: [159]
    widget:
      tipo: figura
      figura: fig-45.10
      zonas:
        - { id: lcd, rotulo: "Foto del centro", rect: [380, 0, 600, 393] }
    ordenar:
      - "La alimentación en sus pines."
      - "El contraste, si es LCD."
      - "Los niveles de señal con el osciloscopio."
      - "La secuencia de inicialización."
    exito: "Una inicialización rota deja el display mudo pero intacto."
    pistas:
      - { texto: "Sin alimentación no hay nada más que mirar." }
    escalera:
      - "De lo físico a lo lógico."
    solucion: "Alimentación, contraste, niveles, inicialización."

  - id: empareje-comprar
    tipo: pregunta
    titulo: "Antes de comprar"
    texto: "Empareje cada cosa que hay que mirar con su riesgo."
    libro: [137, 154, 156, 157]
    widget:
      tipo: figura
      figura: fig-45.9
      zonas:
        - { id: tabla, rotulo: "La tabla de decisión", rect: [0, 0, 453, 166] }
    emparejar:
      - ["Tensión de alimentación y de señal", "Muchos son de 3,3 V y no toleran 5 V"]
      - ["El controlador", "De él depende que haya biblioteca"]
      - ["La retroiluminación", "Suele consumir más que todo lo demás"]
    exito: "Dos displays iguales por fuera con controladores distintos son dos proyectos distintos."
    pistas:
      - { texto: "La biblioteca se escribe para un controlador concreto." }
    escalera:
      - "Lo que se quema, lo que no se programa y lo que gasta."
    solucion: "Tensión, 3,3 V; controlador, biblioteca; retroiluminación, consumo."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [133, 138, 141, 144, 148]
    ideas:
      - { titulo: "Siete segmentos.", texto: "Dígitos legibles a pleno sol; ojo al común." }
      - { titulo: "LCD y TFT.", texto: "Contraste; y un buffer de 150 KB que no cabe." }
      - { titulo: "OLED y e-ink.", texto: "Consumo según contenido o casi nulo; envejecimiento y refresco lento." }
      - { titulo: "Antes de comprar.", texto: "Tensión, interfaz, controlador y retroiluminación." }
