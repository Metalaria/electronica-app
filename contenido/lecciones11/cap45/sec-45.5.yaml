# Lección 1.2 de la sección 46.5 «Tipos de Display» (cap45, sec-45.5). Formato: GUIA.md.
# - El buffer de un TFT de 320×240 a 16 bits: 320·240·16/8 = 153 600 bytes, los 150 KB del bloque 141.
# Paso práctico: «tocar» en la foto 46.10 el display legible a pleno sol.
# 1.2.1 (autor121-senpro, «aprender haciendo», GUIA §13): en la tabla 46.9 se tocan la columna que descarta el e-ink
# para algo que se mueve y la que decide una etiqueta a pila; los 32 LED de cuatro dígitos se cuentan («simular»; el
# común cambiado va a su éxito); se sube la profundidad de color hasta el buffer de 150 KB (1 bit por píxel, de
# ejemplo); en la foto 46.10 se toca la pantalla que envejece por píxeles. El criterio por emparejar se funde en el
# éxito del e-ink, y el orden del diagnóstico en el del contraste. Queda una pregunta de opciones (el contraste).
leccion: cap45/sec-45.5

libro:
  131: "cada tecnología resuelve bien un caso y mal los demás"
  133: "es legible a distancia y con luz ambiente fuerte, incluso a pleno sol, cosa que ningún LCD consigue"
  134: "cuatro dígitos son 32 LED"
  135: "confundirlos es un error frecuente al sustituir: el display no enciende y parece averiado"
  137: "consume muy poco (el módulo sin retroiluminación, en torno a un miliamperio"
  138: "una pantalla en blanco o con todos los cuadros negros que parece rota y no lo está"
  141: "Un buffer completo de 320×240 a 16 bits son 150 KB"
  143: "consumo proporcional a lo que se muestra"
  144: "de ahí que los interfaces OLED muevan los elementos fijos"
  147: "Solo consume al cambiar la imagen"
  148: "deba durar meses con una pila"
  149: "No sirve para nada que se mueva"
  151: "Legible al sol"
  152: "dígitos vistos de lejos, siete segmentos"
  154: "muchos displays son de 3,3 V y no toleran 5 V"
  156: "Dos displays idénticos por fuera con controladores distintos son dos proyectos distintos"
  157: "suele superar al de todo el resto del circuito"
  159: "alimentación en sus pines (sección 55.6), contraste si es LCD"
  161: "LED de siete segmentos mostrando un 4 en una protoboard"

modelo:
  valores:
    n_x: { sim: "n_{x}", nombre: "píxeles en horizontal", unidad: "", valor: 320 }
    n_y: { sim: "n_{y}", nombre: "píxeles en vertical", unidad: "", valor: 240 }
    b_p: { sim: "b", nombre: "bits por píxel", unidad: "", valor: 16 }
    n_d: { sim: "dígitos", nombre: "dígitos del display", unidad: "", valor: 4 }
  calculos:
    buf: { expr: "n_x*n_y*b_p/8/1024", sim: "buffer", nombre: "memoria del buffer", unidad: KB }
    n_px: { expr: "n_x*n_y", sim: "N", nombre: "píxeles", unidad: "" }
    n_by: { expr: "n_x*n_y*b_p/8", sim: "bytes", nombre: "bytes del buffer", unidad: "" }
    buf_b: { expr: "n_x*n_y*b_p/1024", sim: "buffer", nombre: "en bits por mil", unidad: KB }
    n_led: { expr: "n_d*8", sim: "LED", nombre: "LED del display", unidad: "" }
    n_l7: { expr: "n_d*7", sim: "LED", nombre: "sin el punto", unidad: "" }

tarjetas:
  - id: explore-tabla
    tipo: tocar
    titulo: "Cinco tecnologías, cinco problemas"
    texto: "Elegir un display no es elegir un tamaño. Toque la columna que descarta el e-ink para todo lo que se mueve."
    libro: [131, 149, 151]
    widget:
      tipo: figura
      figura: fig-45.9
      zonas: &zonas-tabla
        - { id: muestra, rotulo: "Columna Muestra", rect: [96, 5, 50, 140] }
        - { id: consumo, rotulo: "Columna Consumo", rect: [151, 5, 73, 140] }
        - { id: sol, rotulo: "Columna Legible al sol", rect: [227, 5, 68, 140] }
        - { id: refresco, rotulo: "Columna Refresco", rect: [297, 5, 56, 140] }
        - { id: coste, rotulo: "Columna Coste", rect: [363, 5, 60, 140] }
    tocar:
      bien: [refresco]
      porque:
        muestra: "El e-ink muestra de todo: texto y gráficos."
        consumo: "En consumo el e-ink es el mejor: casi nada."
        sol: "Al sol el e-ink es excelente."
        coste: "Es caro, pero eso no impide que se mueva."
    exito: "Refresco lento: el e-ink no sirve para nada que se mueva. Cada tecnología resuelve bien un caso y mal los demás."
    escalera:
      - "¿Qué necesita una imagen que se mueve?"
    solucion: "La columna Refresco."

  - id: toque-sol
    tipo: tocar
    titulo: "A pleno sol"
    texto: "Toque en la foto el display que se sigue leyendo a pleno sol."
    libro: [133, 161]
    widget:
      tipo: figura
      figura: fig-45.10
      zonas:
        - { id: siete, rotulo: "Foto de la izquierda", rect: [0, 0, 360, 393] }
        - { id: lcd, rotulo: "Foto del centro", rect: [380, 0, 600, 393] }
        - { id: amoled, rotulo: "Foto de la derecha", rect: [1020, 0, 580, 393] }
    tocar:
      bien: [siete]
      porque:
        lcd: "Un LCD de caracteres es regular al sol, y depende del ángulo de visión."
        amoled: "Una matriz AMOLED tiene menos brillo máximo que un TFT bajo el sol: regular."
    exito: "El de siete segmentos: legible incluso a pleno sol, cosa que ningún LCD consigue."
    escalera:
      - "Busque el que emite su propia luz con LED grandes."
    solucion: "El de siete segmentos, a la izquierda."

  - id: pregunta-anodo
    tipo: simular
    titulo: "Un siete segmentos de cuatro dígitos"
    texto: "Cada dígito tiene siete segmentos y un punto, cada uno un LED. ¿Cuántos LED hay en cuatro dígitos?"
    libro: [134, 135]
    fijar: { n_d: 4 }
    widget:
      tipo: figura
      figura: fig-45.10
      zonas:
        - { id: siete, rotulo: "Foto de la izquierda", rect: [0, 0, 360, 393] }
    simular:
      objetivo: n_led
      unidad: ""
      tol: 0.01
      rotulo: "LED"
      errores:
        - { expr: "n_l7", texto: "Falta el punto decimal de cada dígito." }
    exito: "32 LED, con ánodo o cátodo común. Al sustituirlo, confundirlos es frecuente: no enciende y parece averiado."
    escalera:
      - "Siete segmentos y el punto por dígito."
    solucion: "Cuatro por ocho: 32."
    comprobar:
      - { n_led: 32, n_l7: 28 }

  - id: predecir-contraste
    tipo: predecir
    titulo: "Un LCD en blanco"
    texto: "Un LCD de caracteres recién montado sale en blanco, o con todos los cuadros negros. ¿Qué mira primero?"
    libro: [138, 159]
    widget:
      tipo: figura
      figura: fig-45.10
      zonas:
        - { id: lcd, rotulo: "Foto del centro", rect: [380, 0, 600, 393] }
    opciones:
      - texto: "El ajuste de contraste, el potenciómetro"
        bien: true
        porque: "Su ausencia o mal ajuste da ese síntoma clásico: parece roto y no lo está."
      - texto: "Que el display está roto"
        porque: "Es lo que parece, y casi nunca lo es."
      - texto: "La retroiluminación"
        porque: "La retroiluminación da luz de fondo; los cuadros negros son contraste."
    exito: "Si no es el contraste: alimentación en sus pines, niveles de señal con el osciloscopio y, al final, la inicialización."
    escalera:
      - "¿Qué ajuste necesita siempre un LCD de caracteres?"
    solucion: "El contraste."

  - id: estime-buffer
    tipo: explorar
    titulo: "La memoria de un TFT"
    texto: "Un TFT de 320×240 píxeles. Suba los bits por píxel hasta el buffer completo de 150 KB."
    nota: "El monocromo de 1 bit es de ejemplo."
    libro: [141]
    fijar: { n_x: 320, n_y: 240 }
    inicio: { b_p: 1 }
    widget:
      tipo: grafica
      x: { id: b, min: 0, max: 16, unidad: "", rotulo: "bits por píxel" }
      y: { min: 0, max: 160, unidad: KB, rotulo: "buffer" }
      curvas:
        - { expr: "n_x*n_y*b/8/1024", color: naranja, rotulo: "buffer" }
      marcas:
        - { x: "b_p", y: "buf", rotulo: "{{buf}}" }
      lectura: { valor: buf, rotulo: "Buffer" }
      mandos:
        - { valor: b_p, lista: [1, 16], nombres: [monocromo, color de 16 bits], rotulo: "Bits por píxel" }
    objetivo:
      condiciones:
        - { valor: buf, objetivo: 150, tol: 0.01, rotulo: "Buffer: {{buf}}" }
      logrado: "{{n_by}} bytes, {{buf}}: muy por encima de la RAM de un microcontrolador pequeño, que dibuja sin buffer."
      pistas:
        - { texto: "Aún cabe en poco: suba a color." }
    escalera:
      - "16 bits son 2 bytes por píxel."
    solucion: "16 bits: 320 × 240 × 2 = 153 600 bytes."
    comprobar:
      - { con: { b_p: 16 }, buf: 150, n_px: 76800, n_by: 153600 }
      - { con: { b_p: 1 }, buf: 9.375 }

  - id: pregunta-oled
    tipo: tocar
    titulo: "Una interfaz OLED"
    texto: "Las interfaces OLED mueven los elementos fijos. Toque la pantalla cuyos píxeles emiten su propia luz y se gastan cada uno por su cuenta."
    libro: [143, 144]
    widget:
      tipo: figura
      figura: fig-45.10
      zonas:
        - { id: siete, rotulo: "Foto de la izquierda", rect: [0, 0, 360, 393] }
        - { id: lcd, rotulo: "Foto del centro", rect: [380, 0, 600, 393] }
        - { id: amoled, rotulo: "Foto de la derecha", rect: [1020, 0, 580, 393] }
    tocar:
      bien: [amoled]
      porque:
        siete: "Son LED, pero grandes y por segmentos, no una matriz de píxeles."
        lcd: "El LCD no emite: modula la luz de la retroiluminación."
    exito: "La matriz AMOLED: los píxeles más usados pierden brillo antes y dejan una imagen fantasma. Su consumo es proporcional a lo que se muestra."
    escalera:
      - "Busque la matriz de píxeles que emiten."
    solucion: "La foto de la derecha, la matriz AMOLED."

  - id: pregunta-eink
    tipo: tocar
    titulo: "Un sensor que dure meses"
    texto: "Una etiqueta muestra un dato que cambia cada hora y debe durar meses con una pila. Toque la columna que decide el display."
    libro: [147, 148, 152]
    widget:
      tipo: figura
      figura: fig-45.9
      zonas: *zonas-tabla
    tocar:
      bien: [consumo]
      porque:
        muestra: "Solo es un dato: casi cualquiera lo muestra."
        sol: "La legibilidad no decide si dura meses."
        refresco: "Cambia cada hora: el refresco da igual."
        coste: "El coste no decide si dura meses."
    exito: "Consumo: el e-ink solo gasta al cambiar la imagen. Dígitos de lejos, siete segmentos; texto barato, LCD; interfaz rica, TFT."
    escalera:
      - "¿Qué gasta la pila?"
    solucion: "La columna Consumo: e-ink."

  - id: empareje-comprar
    tipo: pregunta
    titulo: "Antes de comprar"
    texto: "Empareje cada cosa que hay que mirar con su riesgo."
    libro: [137, 154, 156, 157]
    widget:
      tipo: figura
      figura: fig-45.9
      zonas:
        - { id: tabla, rotulo: "La tabla de decisión", rect: [0, 0, 453, 166] }
    emparejar:
      - ["Tensión de alimentación y de señal", "Muchos son de 3,3 V y no toleran 5 V"]
      - ["El controlador", "De él depende que haya biblioteca"]
      - ["La retroiluminación", "Suele consumir más que todo lo demás"]
    exito: "Dos displays iguales por fuera con controladores distintos son dos proyectos distintos."
    pistas:
      - { texto: "La biblioteca se escribe para un controlador concreto." }
    escalera:
      - "Lo que se quema, lo que no se programa y lo que gasta."
    solucion: "Tensión, 3,3 V; controlador, biblioteca; retroiluminación, consumo."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [133, 138, 141, 144, 148]
    ideas:
      - { titulo: "Siete segmentos.", texto: "Dígitos legibles a pleno sol; ojo al común." }
      - { titulo: "LCD y TFT.", texto: "Contraste; y un buffer de 150 KB que no cabe." }
      - { titulo: "OLED y e-ink.", texto: "Consumo según contenido o casi nulo; envejecimiento y refresco lento." }
      - { titulo: "Antes de comprar.", texto: "Tensión, interfaz, controlador y retroiluminación." }
