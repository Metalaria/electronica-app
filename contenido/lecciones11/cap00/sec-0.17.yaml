# Lección 1.1 de la sección 0.18 «Convolución» (cap00): la respuesta al impulso describe un sistema lineal e
# invariante, la convolución es superposición de impulsos, con un escalón da la carga del RC (como la ecuación
# diferencial), el error numérico que baja con el paso y el producto en frecuencia.
# Formato: contenido/lecciones11/GUIA.md.
leccion: cap00/sec-0.17

libro:
  254: "Un sistema lineal e invariante queda completamente descrito por su respuesta al impulso h(t)"
  255: 'y lr(( t )) = integral x lr(( τ )) dot.op h lr(( t - τ )) dot.op d τ'
  256: "es superposición aplicada a un continuo de impulsos"
  257: "con un error máximo de 0,001; al dividir el paso por diez, el error también se divide por diez"
  258: "Por eso filtrar es multiplicar en frecuencia"

modelo:
  valores:
    tau: { sim: "τ", nombre: "constante de tiempo", unidad: s, valor: 0.001 }
    t_m: { sim: "t", nombre: "instante", unidad: s, valor: 0.001 }
    N_div: { sim: "τ/paso", nombre: "pasos por constante de tiempo", unidad: "", valor: 1000 }
  calculos:
    y_t: { expr: "1 - exp(-t_m/tau)", sim: "y(t)", nombre: "salida para un escalón unidad", unidad: "", cifras: 3 }
    err_num: { expr: "0.001*1000/N_div", sim: "error", nombre: "error máximo de la convolución numérica", unidad: "" }

tarjetas:
  - id: explore-impulso
    tipo: explorar
    titulo: "La respuesta al impulso"
    texto: "Un RC queda descrito por su respuesta al impulso, h(t). Cambie τ y arrastre el instante: la convolución con un escalón da la curva azul."
    libro: [254, 257]
    widget:
      tipo: grafica
      x: { id: x, min: 0, max: 0.005, unidad: s, rotulo: "t" }
      y: { min: 0, max: 1.2, unidad: "", rotulo: "" }
      curvas:
        - { expr: "exp(-x/tau)", color: naranja, rotulo: "τ·h(t), respuesta al impulso" }
        - { expr: "1 - exp(-x/tau)", color: azul, rotulo: "salida para un escalón" }
      asas:
        - { mueve: t_m, x: "t_m", y: "y_t", rotulo: "Instante" }
      lectura: { valor: y_t, rotulo: "Salida para un escalón" }
      mandos:
        - { valor: tau, lista: [0.0005, 0.001, 0.002], rotulo: "Constante de tiempo, τ" }
        - { valor: t_m, min: 0, max: 0.005, paso: 0.00025, rotulo: "Instante, t" }
    requiere: { mover: [tau, t_m] }

  - id: prediga-escalon
    tipo: predecir
    titulo: "Prediga"
    texto: "La h de un RC de τ = 1 ms es (1/τ)·e^{−t/τ}. Convolucionada con un escalón unidad, ¿qué da?"
    libro: [257]
    opciones:
      - texto: "1 − e^{−t/τ}, lo mismo que la ecuación diferencial"
        bien: true
        porque: "Convolución y ecuación diferencial dan lo mismo, como debe ser."
      - texto: "La misma h(t)"
        porque: "h(t) es la salida para un impulso. Un escalón es otra entrada: acumula impulsos."
      - texto: "Un escalón retrasado 1 ms"
        porque: "Un RC no retrasa el escalón: lo convierte en la curva de carga, que sube hacia 1."

  - id: regla-convolucion
    tipo: formula
    titulo: "La integral de convolución"
    texto: "Cada impulso de la entrada, de área x(τ), produce x(τ)·h(t − τ). La salida es la suma de todos ellos."
    libro: [255, 254]
    ec: 255
    sustitucion: "con un escalón y τ = {{tau}}: y({{t_m}}) = 1 − e^{−t/τ} = {{y_t}}"
    widget:
      tipo: grafica
      x: { id: x, min: 0, max: 0.005, unidad: s, rotulo: "t" }
      y: { min: 0, max: 1.2, unidad: "", rotulo: "" }
      curvas:
        - { expr: "1 - exp(-x/tau)", color: azul, rotulo: "salida para un escalón" }
      asas:
        - { mueve: t_m, x: "t_m", y: "y_t", rotulo: "Instante" }
      mandos:
        - { valor: t_m, min: 0, max: 0.005, paso: 0.00025, rotulo: "Instante, t" }

  - id: ordene-deduccion
    tipo: pregunta
    fase: "Ordene"
    titulo: "De dónde sale"
    texto: "Ordene los pasos que llevan a la integral de convolución."
    libro: [254, 256]
    ordenar:
      - "Ver la entrada como una sucesión de impulsos"
      - "Por linealidad, cada impulso de área x(τ) da x(τ)·h(t − τ)"
      - "Por superposición, sumar todos: la integral"
    exito: "Eso es: la convolución no cae del cielo, es superposición aplicada a un continuo de impulsos."
    pistas:
      - { texto: "Primero se trocea la entrada; lo último es sumar." }

  - id: estime-paso
    tipo: pregunta
    fase: "Estime"
    titulo: "El paso de la integración"
    texto: "Convolucionando numéricamente con un paso de τ/1000, el error máximo es 0,001. Estime el error con un paso de τ/10 000."
    libro: [257]
    fijar: { N_div: 10000 }
    estimar:
      objetivo: "err_num"
      unidad: ""
      min: 0
      max: 0.002
      paso: 0.00005
      inicio: 0.001
      tol: 0.05
      cifras: 2
      rotulo: "Error máximo"
    exito: "0,0001: al dividir el paso por diez, el error también se divide por diez."
    pistas:
      - { cuando: { valor: estimacion, mayor: 0.000105 }, texto: "Se ha pasado: el paso es diez veces menor, y el error también." }
      - { texto: "Se ha quedado corto: el error baja en proporción al paso, diez veces, no más." }
    comprobar:
      - { err_num: 0.0001 }

  - id: producto
    tipo: pregunta
    titulo: "En frecuencia"
    texto: "La transformada de Fourier, o la de Laplace, convierte la convolución en…"
    libro: [258]
    opciones:
      - texto: "Un producto: Y(f) = X(f)·H(f)"
        bien: true
        porque: "Por eso filtrar es multiplicar en frecuencia, y por eso el análisis en frecuencia es tan cómodo."
      - texto: "Una suma: Y(f) = X(f) + H(f)"
        porque: "En frecuencia la salida es la entrada multiplicada por H(f), no sumada."
      - texto: "Otra convolución, en frecuencia"
        porque: "Justo lo contrario: la transformada cambia la convolución por un producto."

  - id: por-que-h
    tipo: porque
    titulo: "¿Por qué basta h(t)?"
    texto: "Conociendo solo la respuesta al impulso de un sistema lineal e invariante, se conoce su salida para cualquier entrada. ¿Por qué?"
    libro: [254, 256]
    opciones:
      - texto: "Cualquier entrada es una suma de impulsos, y el sistema suma sus respuestas"
        bien: true
        porque: "Linealidad e invariancia: cada impulso da una h desplazada y escalada, y la salida es su suma."
      - texto: "Porque todas las entradas reales son impulsos"
        porque: "No lo son, pero cualquiera puede verse como una sucesión de impulsos."
      - texto: "Porque h(t) es la salida en continua"
        porque: "La salida en continua es la del escalón ya asentado. h(t) es la respuesta a un impulso."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [254, 255, 257, 258]
    ideas:
      - { titulo: "h(t).", texto: "La respuesta al impulso describe por completo un sistema lineal e invariante." }
      - { titulo: "Convolución.", texto: "Superposición de impulsos: y(t) = ∫x(τ)·h(t − τ)·dτ." }
      - { titulo: "Coincide.", texto: "La h del RC con un escalón da 1 − e^{−t/τ}, como la ecuación diferencial." }
      - { titulo: "En frecuencia.", texto: "Un producto: filtrar es multiplicar." }
