# Lección 1.1 de la sección 0.18 «Convolución» (cap00): la respuesta al impulso describe un sistema lineal e
# invariante, la convolución es superposición de impulsos, con un escalón da la carga del RC (como la ecuación
# diferencial), el error numérico que baja con el paso y el producto en frecuencia.
# Formato: contenido/lecciones11/GUIA.md.
# 1.2.1 (autor121-fund, «aprender haciendo», GUIA §13): predecir la salida del escalón en t = τ, acortar τ, marcar
# la mitad del camino y calcular el error con un paso diez veces menor; se elige el producto en frecuencia. La
# deducción y por qué basta h(t) quedan en el resumen.
# 1.3 (contenido13): + leer la salida en t = 3 ms sobre la curva (la suma de los impulsos): 4/6 → 5/7.
leccion: cap00/sec-0.17

libro:
  254: "Un sistema lineal e invariante queda completamente descrito por su respuesta al impulso h(t)"
  255: 'y lr(( t )) = integral x lr(( τ )) dot.op h lr(( t - τ )) dot.op d τ'
  256: "es superposición aplicada a un continuo de impulsos"
  257: "con un error máximo de 0,001; al dividir el paso por diez, el error también se divide por diez"
  258: "Por eso filtrar es multiplicar en frecuencia"

modelo:
  valores:
    tau: { sim: "τ", nombre: "constante de tiempo", unidad: s, valor: 0.001 }
    t_m: { sim: "t", nombre: "instante", unidad: s, valor: 0.001 }
    N_div: { sim: "τ/paso", nombre: "pasos por constante de tiempo", unidad: "", valor: 1000 }
    t_3: { sim: "t", nombre: "instante de la lectura", unidad: s, valor: 0.003 }
  calculos:
    y_t: { expr: "1 - exp(-t_m/tau)", sim: "y(t)", nombre: "salida para un escalón unidad", unidad: "", cifras: 3 }
    y_3: { expr: "1 - exp(-t_3/tau)", sim: "y(3τ)", nombre: "salida a los 3 ms", unidad: "", cifras: 3 }
    err_num: { expr: "0.001*1000/N_div", sim: "error", nombre: "error máximo de la convolución numérica", unidad: "" }

tarjetas:
  - id: prediga-escalon
    tipo: simular
    titulo: "Prediga"
    texto: "La h de un RC de τ = 1 ms es (1/τ)·e^{−t/τ}. Convolucionada con un escalón unidad, ¿cuánto vale la salida en t = τ?"
    libro: [257]
    fijar: { tau: 0.001, t_m: 0.001 }
    simular:
      objetivo: y_t
      unidad: ""
      tol: 0.02
      rotulo: "y(τ)"
      errores:
        - { razon: { min: 0.56, max: 0.6 }, texto: "Eso es lo que queda de τ·h(t). La salida del escalón es lo que le falta hasta 1." }
        - { razon: { min: 1.55, max: 1.61 }, texto: "Un RC no copia el escalón: lo convierte en la curva de carga, que sube hacia 1." }
    exito: "0,632: la salida es 1 − e^{−t/τ}, lo mismo que da la ecuación diferencial, como debe ser."
    escalera:
      - "Un escalón es la acumulación de impulsos: la salida acumula la respuesta al impulso."
    solucion: "1 − e^{−1} = 0,632: la misma curva de carga que da la ecuación diferencial."
    comprobar:
      - { y_t: 0.632 }
  - id: explore-impulso
    tipo: explorar
    titulo: "La respuesta al impulso"
    texto: "Un RC queda descrito por su respuesta al impulso, h(t), y su convolución con un escalón da la curva azul. Ponga la τ más corta y mire las dos."
    libro: [254, 257]
    widget:
      tipo: grafica
      x: { id: x, min: 0, max: 0.005, unidad: s, rotulo: "t" }
      y: { min: 0, max: 1.2, unidad: "", rotulo: "" }
      curvas:
        - { expr: "exp(-x/tau)", color: naranja, rotulo: "τ·h(t), respuesta al impulso" }
        - { expr: "1 - exp(-x/tau)", color: azul, rotulo: "salida para un escalón" }
      asas:
        - { mueve: t_m, x: "t_m", y: "y_t", rotulo: "Instante" }
      lectura: { valor: y_t, rotulo: "Salida para un escalón" }
      mandos:
        - { valor: tau, lista: [0.0005, 0.001, 0.002], rotulo: "Constante de tiempo, τ" }
        - { valor: t_m, min: 0, max: 0.005, paso: 0.00025, rotulo: "Instante, t" }
    inicio: { tau: 0.001, t_m: 0.001 }
    objetivo:
      condiciones:
        - { valor: tau, max: 0.0005, rotulo: "τ = {{tau}}" }
      logrado: "Con τ = {{tau}}, h cae antes y la salida sube antes: la salida acumula la respuesta al impulso."
      pistas:
        - { texto: "Elija una constante de tiempo menor." }
    escalera:
      - "La más corta de la lista."
    solucion: "τ = 0,5 ms."
    comprobar:
      - { y_t: 0.632 }
      - { con: { tau: 0.0005 }, y_t: 0.865 }

  - id: regla-convolucion
    tipo: formula
    titulo: "La integral de convolución"
    texto: "Cada impulso de la entrada, de área x(τ), produce x(τ)·h(t − τ). La salida es la suma de todos ellos."
    libro: [255, 254]
    ec: 255
    sustitucion: "con un escalón y τ = {{tau}}: y({{t_m}}) = 1 − e^{−t/τ} = {{y_t}}"
    widget:
      tipo: grafica
      x: { id: x, min: 0, max: 0.005, unidad: s, rotulo: "t" }
      y: { min: 0, max: 1.2, unidad: "", rotulo: "" }
      curvas:
        - { expr: "1 - exp(-x/tau)", color: azul, rotulo: "salida para un escalón" }
      asas:
        - { mueve: t_m, x: "t_m", y: "y_t", rotulo: "Instante" }
      mandos:
        - { valor: t_m, min: 0, max: 0.005, paso: 0.00025, rotulo: "Instante, t" }

  - id: lea-suma
    tipo: leer
    titulo: "Lea la suma"
    texto: "Con τ = 1 ms, la salida en cada instante suma las respuestas de todos los impulsos anteriores. Lleve el instante a 3 ms y escriba la salida."
    libro: [254, 257]
    fijar: { tau: 0.001 }
    inicio: { t_m: 0.001 }
    widget:
      tipo: grafica
      x: { id: x, min: 0, max: 0.005, unidad: s, rotulo: "t" }
      y: { min: 0, max: 1.2, unidad: "", rotulo: "" }
      curvas:
        - { expr: "1 - exp(-x/tau)", color: azul, rotulo: "salida para un escalón" }
      asas:
        - { mueve: t_m, x: "t_m", y: "y_t", rotulo: "Instante" }
      lectura: { valor: y_t, rotulo: "Salida para un escalón" }
      mandos:
        - { valor: t_m, min: 0, max: 0.005, paso: 0.00025, rotulo: "Instante, t" }
    leer:
      objetivo: y_3
      unidad: ""
      tol: 0.01
      rotulo: "Salida en t = 3 ms"
      errores:
        - { expr: "y_t", texto: "Esa es la salida en t = τ. Mueva el instante hasta 3 ms." }
    exito: "{{y_3}}: tras tres constantes de tiempo, casi todo el escalón. Cada impulso nuevo suma menos, porque falta poco hasta 1."
    escalera:
      - "Arrastre el punto, o el mando, hasta t = 3 ms y lea el valor."
    solucion: "En t = 3 ms la salida vale 0,950."
    comprobar:
      - { y_3: 0.950, t_3: 0.003 }

  - id: marca-mitad
    tipo: marcar
    titulo: "La mitad del camino"
    texto: "Con τ = 1 ms, marque el instante en que la salida del escalón llega a la mitad."
    libro: [257]
    fijar: { tau: 0.001 }
    widget:
      tipo: grafica
      x: { id: x, min: 0, max: 0.005, unidad: s, rotulo: "t" }
      y: { min: 0, max: 1.2, unidad: "", rotulo: "" }
      curvas:
        - { expr: "1 - exp(-x/tau)", color: azul, rotulo: "salida para un escalón" }
      mandos: []
    marcar:
      modo: x
      curva: 0
      x: "tau*ln(2)"
      tol: 0.05
      inicio: { x: 0.003, y: 0 }
      rotulo: "Mitad del camino"
    pistas:
      - { cuando: { valor: marca_x, menor: 0.00066 }, texto: "Ahí aún no ha llegado a la mitad: más a la derecha." }
      - { cuando: { valor: marca_x, mayor: 0.00073 }, texto: "Ahí ya ha pasado de la mitad: más a la izquierda." }
      - { texto: "Antes de una constante de tiempo, que ya lleva casi dos tercios." }
    exito: "Antes de τ: la curva de carga hace la mitad del camino enseguida y después se frena."
    escalera:
      - "En t = τ la salida ya vale 0,632."
    solucion: "Un poco antes de una constante de tiempo."
    comprobar:
      - { con: { t_m: 0.001 }, y_t: 0.632 }
  - id: estime-paso
    tipo: simular
    fase: "Estime"
    titulo: "El paso de la integración"
    texto: "Convolucionando numéricamente con un paso de τ/1000, el error máximo es 0,001. ¿Qué error da un paso de τ/10 000?"
    libro: [257]
    fijar: { N_div: 10000 }
    simular:
      objetivo: err_num
      unidad: ""
      tol: 0.05
      rotulo: "Error máximo"
      errores:
        - { razon: { min: 9.5, max: 10.5 }, texto: "Ese es el error del paso de τ/1000. El paso es diez veces menor, y el error también." }
        - { razon: { min: 0.095, max: 0.105 }, texto: "El error baja en proporción al paso: diez veces, no más." }
    exito: "0,0001: al dividir el paso por diez, el error también se divide por diez."
    escalera:
      - "El error baja en proporción al paso."
    solucion: "0,0001: al dividir el paso por diez, el error también se divide por diez."
    comprobar:
      - { err_num: 0.0001 }
  - id: producto
    tipo: pregunta
    titulo: "En frecuencia"
    texto: "La transformada de Fourier, o la de Laplace, convierte la convolución en…"
    libro: [258]
    opciones:
      - texto: "Un producto: Y(f) = X(f)·H(f)"
        bien: true
        porque: "Por eso filtrar es multiplicar en frecuencia, y por eso el análisis en frecuencia es tan cómodo."
      - texto: "Una suma: Y(f) = X(f) + H(f)"
        porque: "En frecuencia la salida es la entrada multiplicada por H(f), no sumada."
      - texto: "Otra convolución, en frecuencia"
        porque: "Justo lo contrario: la transformada cambia la convolución por un producto."
    widget:
      tipo: figura
      figura: fig-30.4
      zonas:
        - { id: convolucion, rotulo: "Entrada, h(t) y salida", rect: [0, 0, 446, 153] }
    escalera:
      - "Filtrar en el tiempo es convolucionar. En frecuencia, ¿qué operación lo sustituye?"
    solucion: "Un producto: Y(f) = X(f)·H(f). Por eso filtrar es multiplicar en frecuencia."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [254, 255, 256, 257, 258]
    ideas:
      - { titulo: "h(t).", texto: "La respuesta al impulso describe por completo un sistema lineal e invariante: cualquier entrada es una suma de impulsos." }
      - { titulo: "Convolución.", texto: "Superposición de impulsos: cada uno, de área x(τ), da x(τ)·h(t − τ), y se suman todos." }
      - { titulo: "Coincide.", texto: "La h del RC con un escalón da 1 − e^{−t/τ}, como la ecuación diferencial." }
      - { titulo: "En frecuencia.", texto: "Un producto: filtrar es multiplicar." }
