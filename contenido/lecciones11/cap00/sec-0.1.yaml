# Lección 1.1 de la sección 0.1 «Números, Magnitudes y Notación» (cap00): notación científica con mantisa y
# exponente, los prefijos como potencias de mil (una escalera), cifras significativas y el alfabeto griego.
# Formato: contenido/lecciones11/GUIA.md.
leccion: cap00/sec-0.1

libro:
  3: "se usa la notación científica y los prefijos del Sistema Internacional"
  4: "una mantisa entre 1 y 10 multiplicada por una potencia de diez"
  5: "cada prefijo es una potencia de mil"
  6: "el resultado de un cálculo no puede ser más preciso que los datos"
  9: "Constante de tiempo de un circuito"
  10: "mayúscula y minúscula no significan lo mismo"
  "cap00#284": "Expresa en notación científica y con el prefijo del SI adecuado"

modelo:
  valores:
    m: { sim: "m", nombre: "mantisa", unidad: "", valor: 4.7, cifras: 2 }
    n: { sim: "n", nombre: "exponente de diez", unidad: "", valor: 3 }
  calculos:
    R: { expr: "m*10^n", sim: "R", nombre: "resistencia", unidad: Ω, cifras: 2 }
    C: { expr: "m*10^n", sim: "C", nombre: "capacidad", unidad: F, cifras: 2 }
    # exponent of the SI prefix the value takes (a power of a thousand) and where the handle sits on the axis
    pref: { expr: "3*floor(n/3)", sim: "exponente del prefijo", nombre: "exponente del prefijo", unidad: "", cifras: 2, recortar: true }
    x_valor: { expr: "n + log10(m)", nombre: "posición del valor en la escala", unidad: "", cifras: 3 }
    C_nF: { expr: "C*10^9", sim: "C en nF", nombre: "capacidad en nanofaradios", unidad: "", cifras: 3 }
    C_pF: { expr: "C*10^12", sim: "C en pF", nombre: "capacidad en picofaradios", unidad: "", cifras: 3 }

tarjetas:
  - id: explore-exponente
    tipo: explorar
    titulo: "Mantisa por potencia de diez"
    texto: "4 700 Ω = 4,7 × 10^{3} Ω. Mueva la mantisa y el exponente y fíjese en cuándo cambia el prefijo."
    nota: "La escalera azul es el prefijo: sube a saltos de tres."
    libro: [3, 4, 5]
    widget:
      tipo: grafica
      x: { id: x, min: 0, max: 9, unidad: "", rotulo: "exponente de diez" }
      y: { min: 0, max: 9, unidad: "", rotulo: "exponente del prefijo" }
      curvas:
        - { expr: "3*floor(x/3)", color: azul, rotulo: "prefijo" }
        - { expr: "x", color: tinta, rotulo: "exponente exacto", discontinua: true }
      asas:
        - { mueve: n, x: "x_valor", y: "pref", rotulo: "El valor en la escala" }
      lectura: { valor: R, rotulo: "Valor" }
      datos:
        - { valor: pref, rotulo: "Exponente del prefijo: {{pref}}" }
      mandos:
        - { valor: m, min: 1, max: 9.9, paso: 0.1, rotulo: "Mantisa, m" }
        - { valor: n, min: 0, max: 9, paso: 1, rotulo: "Exponente, n" }
    requiere: { mover: [m, n] }

  - id: prediga-kilo
    tipo: predecir
    titulo: "Prediga"
    texto: "Una resistencia marca 2,2 kΩ. ¿Cuántos ohmios son?"
    libro: [5]
    fijar: { m: 2.2, n: 3 }
    widget:
      tipo: grafica
      x: { id: x, min: 0, max: 9, unidad: "", rotulo: "exponente de diez" }
      y: { min: 0, max: 9, unidad: "", rotulo: "exponente del prefijo" }
      curvas:
        - { expr: "3*floor(x/3)", color: azul, rotulo: "prefijo" }
      lectura: { valor: R, rotulo: "Valor" }
      ocultar: true
    opciones:
      - texto: "2200 Ω"
        bien: true
        porque: "k es 10^{3}: 2,2 × 10^{3} Ω = 2200 Ω."
      - texto: "220 Ω"
        porque: "Eso sería 2,2 × 10^{2}. El prefijo k vale mil, no cien."
      - texto: "22 000 Ω"
        porque: "Eso son 22 kΩ: ha corrido la coma una posición de más."
    comprobar:
      - { R: 2200 }
      - { con: { n: 2 }, R: 220 }
      - { con: { n: 4 }, R: 22000 }
    escalera:
      - "k es el prefijo kilo: cada prefijo es una potencia de mil."
    solucion: "2,2 × 10^{3} Ω: la coma se corre tres posiciones, 2200 Ω."

  - id: reto-micro
    tipo: reto
    titulo: "Reto: 0,0000047 F"
    texto: "Escriba 0,0000047 F como mantisa por potencia de diez. Mueva los dos mandos."
    libro: ["cap00#284", 4]
    inicio: { m: 1, n: -1 }
    widget:
      tipo: grafica
      x: { id: x, min: -12, max: 0, unidad: "", rotulo: "exponente de diez" }
      y: { min: -12, max: 0, unidad: "", rotulo: "exponente del prefijo" }
      curvas:
        - { expr: "3*floor(x/3)", color: azul, rotulo: "prefijo" }
        - { expr: "x", color: tinta, rotulo: "exponente exacto", discontinua: true }
      asas:
        - { mueve: n, x: "x_valor", y: "pref", rotulo: "El valor en la escala" }
      lectura: { valor: C, rotulo: "Valor" }
      mandos:
        - { valor: m, min: 1, max: 9.9, paso: 0.1, rotulo: "Mantisa, m" }
        - { valor: n, min: -12, max: -1, paso: 1, rotulo: "Exponente, n" }
    condiciones:
      - { valor: C, objetivo: 0.0000047, tol: 0.01, rotulo: "Valor: {{C}}" }
    exito: "4,7 × 10^{−6} F = 4,7 µF: el prefijo µ es 10^{−6}."
    pistas:
      - { cuando: { valor: C, mayor: 0.00000475 }, texto: "Se ha pasado: baje el exponente o la mantisa." }
      - { cuando: { valor: C, menor: 0.00000465 }, texto: "Le falta: suba el exponente o la mantisa." }
    escalera:
      - "La mantisa son las cifras que no son ceros, con una sola entera."
      - "Cuente cuántas posiciones hay que mover la coma para dejar una sola cifra entera: ese es el exponente."
    solucion: "4,7 × 10^{−6} F: el prefijo µ, 4,7 µF."
    comprobar:
      - { con: { m: 4.7, n: -6 }, C: 0.0000047 }

  - id: sumar-exponentes
    tipo: pregunta
    titulo: "Multiplicar potencias"
    texto: "¿Cuánto vale (2 × 10^{3}) × (3 × 10^{−6})?"
    libro: [4]
    opciones:
      - texto: "6 × 10^{−3}"
        bien: true
        porque: "Las mantisas se multiplican (2 × 3 = 6) y los exponentes se suman."
      - texto: "6 × 10^{−18}"
        porque: "Ha multiplicado los exponentes. Al multiplicar potencias de diez, los exponentes se suman."
      - texto: "6 × 10^{9}"
        porque: "Ha restado los exponentes: eso se hace al dividir, no al multiplicar."
    widget:
      tipo: figura
      figura: fig-0.1
      zonas:
        - { id: prefijos, rotulo: "Los prefijos, en fila", rect: [0, 20, 453, 105] }
    escalera:
      - "Multiplique las mantisas por un lado y las potencias de diez por otro."
      - "Al multiplicar potencias de diez, los exponentes se suman: 3 + (−6)."
    solucion: "2 × 3 = 6 y 10^{3} × 10^{−6} = 10^{−3}: 6 × 10^{−3}."

  - id: ordene-prefijos
    tipo: pregunta
    fase: "Ordene"
    titulo: "Los prefijos, en fila"
    texto: "Ordene los prefijos de menor a mayor."
    libro: [5]
    ordenar:
      - "p = 10^{−12}"
      - "n = 10^{−9}"
      - "µ = 10^{−6}"
      - "m = 10^{−3}"
      - "k = 10^{3}"
      - "M = 10^{6}"
      - "G = 10^{9}"
    exito: "Eso es: cada prefijo es mil veces el anterior, una potencia de mil."
    pistas:
      - { texto: "Fíjese en el exponente: de un prefijo al siguiente sube 3." }
    escalera:
      - "Cada prefijo es una potencia de mil: empiece por el exponente más negativo."
    solucion: "p = 10^{−12} → n = 10^{−9} → µ = 10^{−6} → m = 10^{−3} → k = 10^{3} → M = 10^{6} → G = 10^{9}."

  - id: tres-nombres
    tipo: sorpresa
    titulo: "Un condensador, tres nombres"
    texto: "Lleve el valor a 0,1 µF bajando el exponente. Las fichas lo escriben en nF y en pF: es el mismo valor."
    libro: [5]
    fijar: { m: 1 }
    inicio: { n: -5 }
    widget:
      tipo: grafica
      x: { id: x, min: -12, max: 0, unidad: "", rotulo: "exponente de diez" }
      y: { min: -12, max: 0, unidad: "", rotulo: "exponente del prefijo" }
      curvas:
        - { expr: "3*floor(x/3)", color: azul, rotulo: "prefijo" }
      asas:
        - { mueve: n, x: "x_valor", y: "pref", rotulo: "El valor en la escala" }
      lectura: { valor: C, rotulo: "Valor" }
      datos:
        - { valor: C_nF, rotulo: "En nF: {{C_nF}}" }
        - { valor: C_pF, rotulo: "En pF: {{C_pF}}" }
      mandos:
        - { valor: n, min: -12, max: -1, paso: 1, rotulo: "Exponente, n" }
    requiere: { mover: [n] }
    nota: "0,1 µF = 100 nF = 100 000 pF."

  - id: griego
    tipo: pregunta
    fase: "Empareje"
    titulo: "Cada letra, su magnitud"
    texto: "Una cada letra griega con lo que representa en el libro."
    libro: [9]
    emparejar:
      - ["τ", "Constante de tiempo de un circuito"]
      - ["φ", "Desfase entre tensión y corriente"]
      - ["ρ", "Resistividad de un material"]
      - ["η", "Rendimiento de una conversión de energía"]
      - ["Φ", "Flujo magnético"]
    exito: "Eso es. Fíjese en φ y Φ: la misma letra, en minúscula un ángulo y en mayúscula un flujo."
    pistas:
      - { texto: "τ se mide en segundos; φ, en grados o radianes; ρ, en Ω·m." }
    escalera:
      - "Mayúscula y minúscula no significan lo mismo: Φ es un flujo y φ un ángulo."
    solucion: "τ: constante de tiempo de un circuito. φ: desfase entre tensión y corriente. ρ: resistividad de un material. η: rendimiento de una conversión de energía. Φ: flujo magnético."

  - id: omega
    tipo: pregunta
    titulo: "ω no es Ω"
    texto: "En una fórmula aparece ω, omega minúscula. ¿Qué representa?"
    libro: [10, 9]
    opciones:
      - texto: "Una pulsación o frecuencia angular; Ω es el ohmio"
        bien: true
        porque: "ω = 2πf, en rad/s. Mayúscula y minúscula no significan lo mismo."
      - texto: "Lo mismo que Ω: la minúscula es solo tipografía"
        porque: "No: Ω es una unidad y ω una pulsación, igual que Φ es un flujo y φ un ángulo."
      - texto: "Una resistencia pequeña"
        porque: "Las resistencias se miden en Ω, el ohmio. ω es otra magnitud: la frecuencia angular."
    widget:
      tipo: figura
      figura: fig-0.3
      zonas:
        - { id: senal, rotulo: "La senoide y sus parámetros", rect: [0, 0, 369, 199] }
    escalera:
      - "Mayúscula y minúscula no significan lo mismo: Ω es una unidad."
    solucion: "ω es la pulsación, ω = 2πf, en rad/s; Ω es el ohmio."

  - id: por-que-cifras
    tipo: porque
    titulo: "¿Por qué no 4,5837 V?"
    texto: "Midió 4,6 V, con dos cifras, y la calculadora da 4,5837 V. ¿Por qué no escribir ese resultado?"
    libro: [6]
    opciones:
      - texto: "El resultado no puede ser más preciso que los datos"
        bien: true
        porque: "Con un dato de dos cifras, las demás cifras no significan nada: se redondea a las que el dato justifica."
      - texto: "La calculadora se equivoca con los decimales"
        porque: "La división está bien hecha. El problema es que el dato de partida solo tenía dos cifras."
      - texto: "Las unidades del SI no admiten tantos decimales"
        porque: "El SI no limita los decimales. Lo que los limita es la precisión del dato medido."
    widget:
      tipo: figura
      figura: fig-0.1
      zonas:
        - { id: cifras, rotulo: "Recuadro del centro, abajo", rect: [155, 148, 145, 48] }
    escalera:
      - "¿Cuántas cifras tenía el dato medido?"
    solucion: "Con un dato de dos cifras, el resultado se redondea a dos: 4,6 V."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [4, 5, 6, 10]
    ideas:
      - { titulo: "Notación científica.", texto: "Mantisa entre 1 y 10 por una potencia de diez. Al multiplicar, los exponentes se suman." }
      - { titulo: "Prefijos.", texto: "Cada uno es una potencia de mil: 2,2 kΩ = 2200 Ω y 0,1 µF = 100 nF." }
      - { titulo: "Cifras significativas.", texto: "El resultado no puede ser más preciso que los datos." }
      - { titulo: "Letras.", texto: "Mayúscula y minúscula no significan lo mismo: Ω es el ohmio y ω una pulsación." }
