# Lección 1.1 de la sección 0.16 «Análisis Dimensional y Comprobación de Unidades» (cap00): las unidades de banco
# (kΩ × µF = ms), comprobar fórmulas por sus unidades, los atajos de prefijos, el de resonancia, la estimación previa
# y lo que el análisis dimensional no garantiza. Formato: contenido/lecciones11/GUIA.md.
leccion: cap00/sec-0.15

libro:
  230: "ambos lados de una ecuación deben tener las mismas unidades"
  231: "10 kΩ × 4,7 µF = 47 ms de un vistazo"
  235: "(V/A)·(A·s/V)"
  237: "kΩ × µF = ms, sale de 10³ × 10⁻⁶ = 10⁻³"
  238: "Con 100 µH y 100 pF, √(10⁴) = 100 y f = 1,59 MHz"
  239: "e^(−t) con t en segundos no significa nada"
  240: "una corriente de 5 V sobre 10 kΩ es del orden del medio miliamperio"
  242: "½·C·V² y C·V² tienen las mismas unidades, y solo una es la energía"

modelo:
  valores:
    R: { sim: "R", nombre: "resistencia", unidad: Ω, valor: 10000 }
    C: { sim: "C", nombre: "capacidad", unidad: F, valor: 0.0000047 }
    L: { sim: "L", nombre: "inductancia", unidad: H, valor: 0.00001 }
    C_r: { sim: "C", nombre: "capacidad del resonador", unidad: F, valor: 0.0000000001 }
    V_s: { sim: "V", nombre: "tensión", unidad: V, valor: 5 }
    R_s: { sim: "R", nombre: "resistencia de la estimación", unidad: Ω, valor: 10000 }
    V: { sim: "V", nombre: "tensión del condensador", unidad: V, valor: 5 }
    C_e: { sim: "C", nombre: "capacidad del condensador", unidad: F, valor: 0.0000001 }
  calculos:
    tau: { expr: "R*C", sim: "τ", nombre: "constante de tiempo", unidad: s }
    f_r: { expr: "1/(2*pi*sqrt(L*C_r))", sim: "f", nombre: "frecuencia de resonancia", unidad: Hz }
    I_s: { expr: "V_s/R_s", sim: "I", nombre: "corriente", unidad: A }
    E_bien: { expr: "0.5*C_e*V^2", sim: "½·C·V²", nombre: "energía del condensador", unidad: J }
    E_mal: { expr: "C_e*V^2", sim: "C·V²", nombre: "C por V al cuadrado", unidad: J }

tarjetas:
  - id: explore-banco
    tipo: explorar
    titulo: "Unidades de banco"
    texto: "τ = R·C. Mueva R y C, en kΩ y µF, y mire en qué unidad sale la constante de tiempo."
    nota: "Ohmio por faradio es (V/A)·(A·s/V) = s."
    libro: [230, 231]
    widget:
      tipo: grafica
      x: { id: x, min: 0, max: 0.00001, unidad: F, rotulo: "C" }
      y: { min: 0, max: 0.1, unidad: s, rotulo: "τ" }
      curvas:
        - { expr: "R*x", color: azul, rotulo: "τ = R·C" }
      asas:
        - { mueve: C, x: "C", y: "tau", rotulo: "Capacidad" }
      lectura: { valor: tau, rotulo: "Constante de tiempo" }
      mandos:
        - { valor: R, lista: [1000, 2200, 4700, 10000], rotulo: "Resistencia, R" }
        - { valor: C, lista: [0.000001, 0.0000022, 0.0000047, 0.00001], rotulo: "Capacidad, C" }
    requiere: { mover: [R, C] }

  - id: prediga-47
    tipo: predecir
    titulo: "Prediga"
    texto: "10 kΩ y 4,7 µF. Sin calculadora: ¿cuánto vale τ?"
    libro: [231, 237]
    fijar: { R: 10000, C: 0.0000047 }
    widget:
      tipo: grafica
      x: { id: x, min: 0, max: 0.00001, unidad: F, rotulo: "C" }
      y: { min: 0, max: 0.1, unidad: s, rotulo: "τ" }
      curvas:
        - { expr: "R*x", color: azul, rotulo: "τ = R·C" }
      lectura: { valor: tau, rotulo: "Constante de tiempo" }
      ocultar: true
    opciones:
      - texto: "47 ms"
        bien: true
        porque: "Kilohmios por microfaradios dan milisegundos: 10³ × 10⁻⁶ = 10⁻³. Y 10 × 4,7 = 47."
      - texto: "47 s"
        porque: "Ha multiplicado 10 × 4,7 sin los prefijos. kΩ × µF no da segundos, sino milisegundos."
      - texto: "47 µs"
        porque: "Eso sería con kΩ × nF. Con microfaradios, milisegundos."
    comprobar:
      - { tau: 0.047 }

  - id: unidades-formulas
    tipo: pregunta
    fase: "Empareje"
    titulo: "Cada fórmula, sus unidades"
    texto: "Una cada fórmula con la comprobación de sus unidades."
    libro: [235]
    emparejar:
      - ["τ = R·C", "(V/A)·(A·s/V) = s"]
      - ["P = V²/R", "V²/(V/A) = V·A = W"]
      - ["E = ½·C·V²", "(A·s/V)·V² = V·A·s = J"]
      - ["Z₀ = √(L/C)", "√((V·s/A)/(A·s/V)) = V/A = Ω"]
    exito: "Eso es. Si un paso saliera en amperios donde se esperan voltios, la fórmula está mal."
    pistas:
      - { texto: "Ohmio es V/A; faradio, A·s/V; henrio, V·s/A." }

  - id: atajos
    tipo: pregunta
    fase: "Empareje"
    titulo: "Los atajos de prefijos"
    texto: "Una cada operación de banco con la unidad que da."
    libro: [238]
    emparejar:
      - ["V / kΩ", "mA"]
      - ["mA × kΩ", "V"]
      - ["MΩ × pF", "µs"]
      - ["V × mA", "mW"]
    exito: "Eso es: evitan errores de tres órdenes de magnitud."
    pistas:
      - { texto: "Cuente exponentes: kilo es 10³, mili 10⁻³, mega 10⁶ y pico 10⁻¹²." }

  - id: reto-resonancia
    tipo: reto
    titulo: "Reto: 1,59 MHz"
    texto: "Con C = 100 pF, f = 159,2 MHz / √(L_{µH} · C_{pF}). Elija la bobina que resuena a 1,59 MHz."
    libro: [238]
    fijar: { C_r: 0.0000000001 }
    inicio: { L: 0.00001 }
    widget:
      tipo: grafica
      x: { id: x, min: 0.000005, max: 0.00025, unidad: H, rotulo: "L" }
      y: { min: 0, max: 8000000, unidad: Hz, rotulo: "f" }
      curvas:
        - { expr: "1/(2*pi*sqrt(x*C_r))", color: azul, rotulo: "frecuencia de resonancia" }
      asas:
        - { mueve: L, x: "L", y: "f_r", rotulo: "Inductancia" }
      mandos:
        - { valor: L, lista: [0.00001, 0.000022, 0.000047, 0.0001, 0.00022], rotulo: "Inductancia, L" }
    condiciones:
      - { valor: f_r, objetivo: 1590000, tol: 0.02, rotulo: "f = {{f_r}}" }
    exito: "100 µH: √(100 · 100) = 100, y 159,2 MHz / 100 = 1,59 MHz."
    pistas:
      - { cuando: { valor: f_r, mayor: 1621800 }, texto: "Resuena demasiado alto: más inductancia." }
      - { cuando: { valor: f_r, menor: 1558200 }, texto: "Resuena demasiado bajo: menos inductancia." }
    ayuda: "Para dividir 159,2 MHz entre 100, la raíz de L·C ha de valer 100."
    comprobar:
      - { con: { L: 0.0001 }, f_r: 1592000, tol: 0.001 }

  - id: estime-orden
    tipo: pregunta
    fase: "Estime"
    titulo: "Antes de calcular, estimar"
    texto: "5 V sobre 10 kΩ. Estime el orden de la corriente antes de tomar la calculadora."
    libro: [240]
    fijar: { V_s: 5, R_s: 10000 }
    estimar:
      objetivo: "I_s"
      unidad: A
      min: 0
      max: 0.002
      paso: 0.00005
      inicio: 0.0015
      tol: 0.05
      rotulo: "I"
    exito: "Medio miliamperio: V / kΩ = mA. Si el resultado exacto saliera en amperios, habría un prefijo mal puesto."
    pistas:
      - { cuando: { valor: estimacion, menor: 0.000475 }, texto: "Se ha quedado corto: voltios entre kilohmios dan miliamperios; 5 entre 10." }
      - { texto: "Se ha pasado: 5 V entre 10 kΩ es la mitad de un miliamperio." }
    comprobar:
      - { I_s: 0.0005 }

  - id: no-basta
    tipo: sorpresa
    titulo: "Mismas unidades, distinta energía"
    texto: "C·V² y ½·C·V² dan julios las dos. Mueva V y compare."
    nota: "Solo una es la energía del condensador: el análisis dimensional es necesario, pero no suficiente."
    libro: [242]
    fijar: { C_e: 0.0000001 }
    inicio: { V: 5 }
    widget:
      tipo: grafica
      x: { id: x, min: 0, max: 12, unidad: V, rotulo: "V" }
      y: { min: 0, max: 0.000015, unidad: J, rotulo: "E" }
      curvas:
        - { expr: "C_e*x^2", color: tinta, rotulo: "C·V²", discontinua: true }
        - { expr: "0.5*C_e*x^2", color: azul, rotulo: "½·C·V², la energía" }
      asas:
        - { mueve: V, x: "V", y: "E_bien", rotulo: "Tensión" }
      lectura: { valor: E_bien, rotulo: "½·C·V²" }
      datos:
        - { valor: E_mal, rotulo: "C·V² = {{E_mal}}" }
      mandos:
        - { valor: V, min: 0, max: 12, paso: 0.5, rotulo: "Tensión, V" }
    requiere: { mover: [V] }

  - id: por-que-adimensional
    tipo: porque
    titulo: "¿Por qué no e^{−t}?"
    texto: "Una fórmula tiene e^{−t}, con t en segundos. ¿Por qué no significa nada?"
    libro: [239]
    opciones:
      - texto: "El argumento de una exponencial debe ser adimensional: falta una constante de tiempo"
        bien: true
        porque: "e^{−t/τ} tiene sentido porque t/τ es segundos entre segundos."
      - texto: "Porque t debería ir en milisegundos"
        porque: "Cambiar el prefijo no arregla nada: el argumento seguiría teniendo unidades de tiempo."
      - texto: "Porque una exponencial solo admite números negativos"
        porque: "El signo no es el problema. Lo es que el argumento tenga unidades."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [230, 231, 238, 242]
    ideas:
      - { titulo: "Las mismas unidades.", texto: "Si no cuadran, la fórmula está mal, sin hacer números." }
      - { titulo: "Unidades de banco.", texto: "kΩ × µF = ms: 10 kΩ y 4,7 µF, 47 ms; V / kΩ = mA." }
      - { titulo: "Sin dimensión.", texto: "El argumento de una exponencial o un logaritmo es adimensional." }
      - { titulo: "Necesario, no suficiente.", texto: "½·C·V² y C·V² tienen las mismas unidades." }
