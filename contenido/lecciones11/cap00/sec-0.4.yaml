# Lección 1.1 de la sección 0.4 «Exponenciales, Logaritmos y Decibelios» (cap00): la curva de carga y sus hitos en
# múltiplos de τ, que nunca llega del todo; el decibelio de tensión, 20·log, el punto de −3 dB y las ganancias en cascada
# que se suman. Formato: contenido/lecciones11/GUIA.md.
leccion: cap00/sec-0.4

libro:
  47: "describe los procesos que crecen o decaen a un ritmo proporcional a su valor actual"
  48: 'τ = R dot.op C'
  49: "Los logaritmos convierten multiplicaciones en sumas"
  51: '"20" dot.op op("log")_("10")'
  52: "una caída a la mitad de tensión son −6 dB"
  54: "La constante τ = R·C es el tiempo característico"
  55: "Fracción completada"
  56: "La exponencial nunca llega del todo, pero a 5τ ha llegado a efectos prácticos"
  58: "doblar la potencia son 3 dB y doblar la tensión son 6 dB"
  59: "×0,707"
  60: "las ganancias en cascada se suman en lugar de multiplicarse"
  61: "Tensiones y corrientes, 20·log; potencias, 10·log"
  63: "el 20 es consecuencia del cuadrado"
  "cap00#284": "Un circuito RC con R = 10 kΩ y C = 4,7 µF se carga hacia 5 V"

modelo:
  valores:
    R: { sim: "R", nombre: "resistencia", unidad: Ω, valor: 10000 }
    C: { sim: "C", nombre: "capacidad", unidad: F, valor: 0.0000047 }
    V_fin: { sim: "V_{final}", nombre: "tensión final", unidad: V, valor: 5 }
    n_tau: { sim: "t/τ", nombre: "tiempo en constantes de tiempo", unidad: "", valor: 0.5, cifras: 2 }
    ratio: { sim: "V_{salida}/V_{entrada}", nombre: "relación de tensiones", unidad: "", valor: 2 }
    G1: { sim: "G₁", nombre: "ganancia de la primera etapa", unidad: dB, valor: 20 }
    G2: { sim: "G₂", nombre: "ganancia de la segunda etapa", unidad: dB, valor: -6 }
    G3: { sim: "G₃", nombre: "ganancia de la tercera etapa", unidad: dB, valor: 32 }
  calculos:
    tau: { expr: "R*C", sim: "τ", nombre: "constante de tiempo", unidad: s }
    t_m: { expr: "n_tau*tau", sim: "t", nombre: "instante", unidad: s }
    v_t: { expr: "V_fin*(1 - exp(-t_m/tau))", sim: "v(t)", nombre: "tensión del condensador", unidad: V }
    frac: { expr: "(1 - exp(-n_tau))*100", sim: "fracción", nombre: "fracción completada", unidad: "%" }
    G_dB: { expr: "20*log10(ratio)", sim: "G", nombre: "ganancia en decibelios", unidad: dB }
    p_ratio: { expr: "ratio^2", sim: "P_{salida}/P_{entrada}", nombre: "relación de potencias", unidad: "veces" }
    G_tot: { expr: "G1 + G2 + G3", sim: "G", nombre: "ganancia total", unidad: dB }
    fac_tot: { expr: "10^(G_tot/20)", sim: "factor", nombre: "factor de tensión total", unidad: "veces", cifras: 4 }

tarjetas:
  - id: explore-carga
    tipo: explorar
    titulo: "La curva de carga"
    texto: "Arrastre el punto por la curva de carga de un condensador. Fíjese en la fracción completada en 1τ, 2τ y 3τ."
    nota: "Cuanto más cerca está del final, más despacio va."
    libro: [47, 54, 55]
    widget:
      tipo: grafica
      x: { id: x, min: 0, max: 0.3, unidad: s, rotulo: "t" }
      y: { min: 0, max: 6, unidad: V, rotulo: "v(t)" }
      curvas:
        - { expr: "V_fin*(1 - exp(-x/tau))", color: azul, rotulo: "v(t)" }
      asas:
        - { mueve: n_tau, x: "t_m", y: "v_t", rotulo: "Instante: t en τ" }
      lectura: { valor: frac, rotulo: "Fracción completada" }
      datos:
        - { valor: n_tau, rotulo: "t = {{n_tau}} τ" }
        - { valor: tau, rotulo: "τ = {{tau}}" }
      mandos:
        - { valor: n_tau, min: 0, max: 6, paso: 0.5, rotulo: "Tiempo, en τ" }
    requiere: { mover: [n_tau] }

  - id: prediga-tau
    tipo: predecir
    titulo: "Prediga"
    texto: "¿Qué fracción del camino lleva el condensador al cabo de una constante de tiempo, t = τ?"
    libro: [55, 56]
    fijar: { n_tau: 1 }
    widget:
      tipo: grafica
      x: { id: x, min: 0, max: 0.3, unidad: s, rotulo: "t" }
      y: { min: 0, max: 6, unidad: V, rotulo: "v(t)" }
      curvas:
        - { expr: "V_fin*(1 - exp(-x/tau))", color: azul, rotulo: "v(t)" }
      lectura: { valor: frac, rotulo: "Fracción completada" }
      ocultar: true
    opciones:
      - texto: "63,2 %"
        bien: true
        porque: "1 − e^{−1} = 0,632. En 2τ va por el 86,5 % y en 3τ por el 95,0 %."
      - texto: "La mitad"
        porque: "La mitad se alcanza antes, a 0,693·τ, porque ln 2 = 0,693."
      - texto: "99,3 %"
        porque: "Eso es a 5τ: entonces se da el transitorio por terminado."
    comprobar:
      - { frac: 63.2 }

  - id: regla-carga
    tipo: formula
    titulo: "La carga de un condensador"
    texto: "v(t) = V_{final}·(1 − e^{−t/τ}), con τ = R·C. Cambie C y vea cómo se estira la curva."
    libro: [48]
    ec: 48
    fijar: { R: 10000, n_tau: 1 }
    sustitucion: "τ = {{R}} · {{C}} = {{tau}};  v(τ) = {{v_t}}"
    widget:
      tipo: grafica
      x: { id: x, min: 0, max: 0.5, unidad: s, rotulo: "t" }
      y: { min: 0, max: 6, unidad: V, rotulo: "v(t)" }
      curvas:
        - { expr: "V_fin*(1 - exp(-x/tau))", color: azul, rotulo: "v(t)" }
      mandos:
        - { valor: C, lista: [0.000001, 0.0000022, 0.0000047, 0.00001], rotulo: "Capacidad, C" }

  - id: estime-ej06
    tipo: pregunta
    fase: "Estime"
    titulo: "Tras una constante de tiempo"
    texto: "R = 10 kΩ y C = 4,7 µF se cargan hacia 5 V. Estime la tensión al cabo de una constante de tiempo."
    libro: ["cap00#284", 55]
    fijar: { R: 10000, C: 0.0000047, V_fin: 5, n_tau: 1 }
    estimar:
      objetivo: "v_t"
      unidad: V
      min: 0
      max: 5
      paso: 0.05
      inicio: 1
      tol: 0.02
      rotulo: "v(τ)"
    exito: "5 · (1 − e^{−1}) = 3,16 V, el 63 % del final. Y τ = R·C = 47 ms."
    pistas:
      - { cuando: { valor: estimacion, menor: 3.1 }, texto: "Se ha quedado corto: en una τ ya ha hecho casi dos tercios del camino." }
      - { texto: "Se ha pasado: en una τ aún le falta más de un tercio." }
    comprobar:
      - { v_t: 3.16, tau: 0.047 }

  - id: nunca-llega
    tipo: sorpresa
    titulo: "Nunca llega del todo"
    texto: "Lleve el punto más allá de 5τ. ¿Alcanza la carga los 5 V?"
    nota: "Nunca del todo. A 5τ va por el 99,3 %: por eso «cinco constantes de tiempo» dan el transitorio por terminado."
    libro: [56, 55]
    fijar: { R: 10000, C: 0.0000047, V_fin: 5 }
    inicio: { n_tau: 3 }
    widget:
      tipo: grafica
      x: { id: x, min: 0, max: 0.5, unidad: s, rotulo: "t" }
      y: { min: 0, max: 6, unidad: V, rotulo: "v(t)" }
      curvas:
        - { expr: "V_fin*(1 - exp(-x/tau))", color: azul, rotulo: "v(t)" }
        - { expr: "V_fin + 0*x", color: tinta, rotulo: "tensión final", discontinua: true }
      asas:
        - { mueve: n_tau, x: "t_m", y: "v_t", rotulo: "Instante: t en τ" }
      lectura: { valor: frac, rotulo: "Fracción completada" }
      mandos:
        - { valor: n_tau, min: 0, max: 10, paso: 0.5, rotulo: "Tiempo, en τ" }
    requiere: { mover: [n_tau] }

  - id: explore-db
    tipo: explorar
    titulo: "El decibelio"
    texto: "El decibelio compara dos tensiones con un logaritmo. Mueva la relación de tensiones: busque ×2 y ×10."
    libro: [51, 58, 59]
    widget:
      tipo: grafica
      x: { id: x, min: 0.1, max: 10, unidad: "", rotulo: "V_{salida}/V_{entrada}" }
      y: { min: -20, max: 20, unidad: dB, rotulo: "G" }
      curvas:
        - { expr: "20*log10(x)", color: naranja, rotulo: "20·log₁₀" }
      asas:
        - { mueve: ratio, x: "ratio", y: "G_dB", rotulo: "Relación de tensiones" }
      lectura: { valor: G_dB, rotulo: "Ganancia" }
      datos:
        - { valor: p_ratio, rotulo: "En potencia: {{p_ratio}}" }
      mandos:
        - { valor: ratio, lista: [0.5, 0.707, 1, 1.41, 2, 10], rotulo: "Relación de tensiones" }
    requiere: { mover: [ratio] }

  - id: prediga-doble
    tipo: predecir
    titulo: "Prediga"
    texto: "Doblar la potencia son 3 dB. ¿Cuántos decibelios es doblar la tensión?"
    libro: [58]
    fijar: { ratio: 2 }
    widget:
      tipo: grafica
      x: { id: x, min: 0.1, max: 10, unidad: "", rotulo: "V_{salida}/V_{entrada}" }
      y: { min: -20, max: 20, unidad: dB, rotulo: "G" }
      curvas:
        - { expr: "20*log10(x)", color: naranja, rotulo: "20·log₁₀" }
      lectura: { valor: G_dB, rotulo: "Ganancia" }
      ocultar: true
    opciones:
      - texto: "6 dB"
        bien: true
        porque: "La potencia va con el cuadrado de la tensión: ×2 en tensión es ×4 en potencia, 6 dB."
      - texto: "3 dB"
        porque: "3 dB es doblar la potencia. Doblar la tensión cuadruplica la potencia: el doble de decibelios."
      - texto: "20 dB"
        porque: "20 dB son ×10 en tensión, no ×2."
    comprobar:
      - { G_dB: 6.02 }

  - id: regla-db
    tipo: formula
    titulo: "Ganancia en decibelios"
    texto: "Para tensiones, 20·log₁₀ de la relación. Los logaritmos convierten productos en sumas."
    libro: [51, 49]
    ec: 51
    sustitucion: "20 · log₁₀({{ratio}}) = {{G_dB}}"
    widget:
      tipo: grafica
      x: { id: x, min: 0.1, max: 10, unidad: "", rotulo: "V_{salida}/V_{entrada}" }
      y: { min: -20, max: 20, unidad: dB, rotulo: "G" }
      curvas:
        - { expr: "20*log10(x)", color: naranja, rotulo: "20·log₁₀" }
      mandos:
        - { valor: ratio, lista: [0.5, 0.707, 1, 1.41, 2, 10], rotulo: "Relación de tensiones" }

  - id: reto-corte
    tipo: reto
    titulo: "Reto: el punto de −3 dB"
    texto: "La frecuencia de corte de un filtro es donde la salida cae a −3 dB. Ajuste la relación de tensiones hasta ese punto."
    libro: [52, 60]
    inicio: { ratio: 1 }
    widget:
      tipo: grafica
      x: { id: x, min: 0.1, max: 1.5, unidad: "", rotulo: "V_{salida}/V_{entrada}" }
      y: { min: -20, max: 5, unidad: dB, rotulo: "G" }
      curvas:
        - { expr: "20*log10(x)", color: naranja, rotulo: "20·log₁₀" }
      asas:
        - { mueve: ratio, x: "ratio", y: "G_dB", rotulo: "Relación de tensiones" }
      datos:
        - { valor: p_ratio, rotulo: "En potencia: {{p_ratio}}" }
      mandos:
        - { valor: ratio, min: 0.1, max: 1.5, paso: 0.005, rotulo: "Relación de tensiones" }
    condiciones:
      - { valor: G_dB, objetivo: -3, tol: 0.02, rotulo: "Ganancia: {{G_dB}}" }
    exito: "La tensión ha caído a 0,707 de la entrada y la potencia, a la mitad."
    pistas:
      - { cuando: { valor: G_dB, mayor: -2.94 }, texto: "Aún no ha caído bastante: baje la relación." }
      - { cuando: { valor: G_dB, menor: -3.06 }, texto: "Ha caído de más: suba la relación." }
    ayuda: "−6 dB es la mitad de la tensión; −3 dB queda a medio camino en decibelios, en ×0,707."

  - id: estime-cascada
    tipo: pregunta
    fase: "Estime"
    titulo: "Tres etapas en cascada"
    texto: "Tres etapas de 20 dB, −6 dB y 32 dB, una tras otra. Estime la ganancia total."
    libro: ["cap00#284", 60]
    fijar: { G1: 20, G2: -6, G3: 32 }
    estimar:
      objetivo: "G_tot"
      unidad: dB
      min: 0
      max: 80
      paso: 1
      inicio: 20
      tol: 0.03
      rotulo: "Ganancia total"
    exito: "Se suman: 20 − 6 + 32 = 46 dB, unas 200 veces en tensión (199,5)."
    pistas:
      - { cuando: { valor: estimacion, menor: 44.6 }, texto: "Se ha quedado corto: en decibelios las ganancias de las etapas se suman." }
      - { texto: "Se ha pasado: la etapa de −6 dB resta." }
    comprobar:
      - { G_tot: 46, fac_tot: 199.5 }

  - id: por-que-veinte
    tipo: porque
    titulo: "¿Por qué 20 y no 10?"
    texto: "En potencias, 10·log₁₀; en tensiones, 20·log₁₀. ¿De dónde sale el 20?"
    libro: [63, 61]
    opciones:
      - texto: "La potencia va con el cuadrado de la tensión, y log(x^{2}) = 2·log(x)"
        bien: true
        porque: "Con P = V^{2}/R sobre la misma resistencia, 10·log de V^{2} es 20·log de V. El 20 es consecuencia del cuadrado."
      - texto: "Son dos definiciones distintas del decibelio"
        porque: "Hay una sola, sobre potencias. El factor 20 se deduce de ella."
      - texto: "Se eligió así para que las tensiones den números mayores"
        porque: "No es un convenio arbitrario: sale de P = V^{2}/R. Usar 20·log con potencias es el error más frecuente."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [48, 55, 58, 60]
    ideas:
      - { titulo: "La carga.", texto: "v(t) = V_{final}·(1 − e^{−t/τ}), τ = R·C: 63,2 % en 1τ y 99,3 % en 5τ." }
      - { titulo: "Decibelios.", texto: "20·log₁₀ en tensión, 10·log₁₀ en potencia: ×2 en tensión son 6 dB." }
      - { titulo: "−3 dB.", texto: "La tensión cae a 0,707 y la potencia a la mitad: el punto de corte." }
      - { titulo: "En cascada.", texto: "Las ganancias en dB se suman: tres etapas de 20 dB son 60 dB." }
