# Lección 1.1 de la sección 0.11 «Análisis de Fourier» (cap00): qué es un armónico, la cuadrada como suma de la
# fundamental y sus armónicos impares, la serie de Fourier y sus coeficientes por ortogonalidad, los flancos rápidos y
# sus armónicos altos, y por qué basta el análisis senoidal. Formato: contenido/lecciones11/GUIA.md.
# 1.2.1 (autor121-fund, «aprender haciendo», GUIA §13): contar las senoides hasta el noveno, sumar hasta el más
# alto, quitarlos y ver el flanco, y marcar el salto. Los coeficientes, el vocabulario y por qué basta con senoides
# quedan en el resumen.
leccion: cap00/sec-0.11

libro:
  148: "se llaman armónicos a las componentes senoidales cuya frecuencia es un múltiplo entero de ella"
  149: "Una onda cuadrada, por ejemplo, es la fundamental más los armónicos impares con amplitudes decrecientes"
  150: "las señales con flancos rápidos tienen armónicos de frecuencia muy alta, que son los que se acoplan y radian"
  151: "Esa suma es la serie de Fourier"
  152: 'f lr(( t )) = a_("0")'
  153: "La transformada de Fourier extiende la idea a señales no periódicas"
  154: "en cada discontinuidad la serie converge al punto medio del salto"

modelo:
  valores:
    N: { sim: "n", nombre: "armónico más alto sumado", unidad: "", valor: 1 }
  calculos:
    n_arm: { expr: "(N + 1)/2", sim: "armónicos", nombre: "número de armónicos impares sumados", unidad: "", cifras: 2, recortar: true }

tarjetas:
  - id: prediga-impares
    tipo: simular
    titulo: "Prediga"
    texto: "El segundo armónico está en 2f, el tercero en 3f… Para llegar hasta el armónico 9, ¿cuántas senoides suma una cuadrada?"
    libro: [148, 149]
    fijar: { N: 9 }
    simular:
      objetivo: n_arm
      unidad: ""
      tol: 0.02
      rotulo: "Senoides sumadas"
      errores:
        - { razon: { min: 1.75, max: 1.85 }, texto: "Ha contado también los pares: en la cuadrada faltan." }
        - { razon: { min: 0.75, max: 0.85 }, texto: "Falta contar la fundamental." }
    exito: "Cinco: la fundamental y los armónicos impares hasta el noveno, con amplitudes decrecientes."
    escalera:
      - "Compare la fundamental con la cuadrada: ¿qué armónicos le añaden los flancos rectos?"
    solucion: "La fundamental más los impares hasta el noveno: cinco senoides."
    comprobar:
      - { n_arm: 5 }
  - id: explore-sintesis
    tipo: explorar
    titulo: "Una cuadrada hecha de senoides"
    texto: "Sume armónicos impares a la fundamental, con amplitudes decrecientes. Súmelos hasta el más alto."
    libro: [149, 148]
    widget:
      tipo: grafica
      x: { id: x, min: 0, max: 12.57, unidad: rad, rotulo: "ωt" }
      y: { min: -1.5, max: 1.5, unidad: "", rotulo: "amplitud" }
      curvas:
        - { expr: "4/pi*(sin(x) + min(max(N - 2, 0), 1)*sin(3*x)/3 + min(max(N - 4, 0), 1)*sin(5*x)/5 + min(max(N - 6, 0), 1)*sin(7*x)/7 + min(max(N - 8, 0), 1)*sin(9*x)/9 + min(max(N - 10, 0), 1)*sin(11*x)/11 + min(max(N - 12, 0), 1)*sin(13*x)/13)", color: azul, rotulo: "suma de armónicos" }
        - { expr: "min(max(sin(x)*1000000, -1), 1)", color: tinta, rotulo: "cuadrada ideal", discontinua: true }
      lectura: { valor: n_arm, rotulo: "Senoides sumadas" }
      datos:
        - { valor: N, rotulo: "La más alta: {{N}}·f" }
      mandos:
        - { valor: N, lista: [1, 3, 5, 7, 9, 11, 13], rotulo: "Armónico más alto, n" }
    inicio: { N: 1 }
    objetivo:
      condiciones:
        - { valor: N, min: 13, rotulo: "Hasta el {{N}}" }
      logrado: "{{n_arm}} senoides: cuantos más armónicos, más se parece la suma a la cuadrada."
      pistas:
        - { texto: "Sume otro armónico." }
    escalera:
      - "Lleve el mando hasta arriba."
    solucion: "Hasta el armónico 13."
    comprobar:
      - { n_arm: 1 }
      - { con: { N: 13 }, n_arm: 7 }

  - id: regla-serie
    tipo: formula
    titulo: "La serie de Fourier"
    texto: "Cualquier señal periódica es su valor medio, a₀, más senos y cosenos de n·ω, cada uno con su amplitud."
    libro: [152, 151]
    ec: 152
    sustitucion: "f(t) ≈ suma de {{n_arm}} senoides: la fundamental y sus armónicos impares hasta el {{N}}"
    widget:
      tipo: grafica
      x: { id: x, min: 0, max: 12.57, unidad: rad, rotulo: "ωt" }
      y: { min: -1.5, max: 1.5, unidad: "", rotulo: "amplitud" }
      curvas:
        - { expr: "4/pi*(sin(x) + min(max(N - 2, 0), 1)*sin(3*x)/3 + min(max(N - 4, 0), 1)*sin(5*x)/5 + min(max(N - 6, 0), 1)*sin(7*x)/7 + min(max(N - 8, 0), 1)*sin(9*x)/9 + min(max(N - 10, 0), 1)*sin(11*x)/11 + min(max(N - 12, 0), 1)*sin(13*x)/13)", color: azul, rotulo: "suma de armónicos" }
        - { expr: "min(max(sin(x)*1000000, -1), 1)", color: tinta, rotulo: "cuadrada ideal", discontinua: true }
      mandos:
        - { valor: N, lista: [1, 3, 5, 7, 9, 11, 13], rotulo: "Armónico más alto, n" }

  - id: flancos
    tipo: sorpresa
    titulo: "Flancos rápidos, armónicos altos"
    texto: "Quite armónicos altos hasta dejar la fundamental, y mire el flanco de subida."
    libro: [150]
    inicio: { N: 13 }
    widget:
      tipo: grafica
      x: { id: x, min: 0, max: 12.57, unidad: rad, rotulo: "ωt" }
      y: { min: -1.5, max: 1.5, unidad: "", rotulo: "amplitud" }
      curvas:
        - { expr: "4/pi*(sin(x) + min(max(N - 2, 0), 1)*sin(3*x)/3 + min(max(N - 4, 0), 1)*sin(5*x)/5 + min(max(N - 6, 0), 1)*sin(7*x)/7 + min(max(N - 8, 0), 1)*sin(9*x)/9 + min(max(N - 10, 0), 1)*sin(11*x)/11 + min(max(N - 12, 0), 1)*sin(13*x)/13)", color: azul, rotulo: "suma de armónicos" }
      lectura: { valor: n_arm, rotulo: "Senoides sumadas" }
      mandos:
        - { valor: N, lista: [1, 3, 5, 7, 9, 11, 13], rotulo: "Armónico más alto, n" }
    objetivo:
      condiciones:
        - { valor: N, max: 1, rotulo: "Hasta el {{N}}" }
      logrado: "Ya no sube deprisa: los flancos rápidos están hechos de armónicos muy altos, que se acoplan y radian. Por eso un circuito digital lento puede interferir."
      pistas:
        - { texto: "Quite otro armónico." }
    escalera:
      - "Lleve el mando hasta abajo."
    solucion: "Solo la fundamental: el flanco es el de una senoide."
    comprobar:
      - { n_arm: 7 }

  - id: el-salto
    tipo: marcar
    titulo: "En el salto"
    texto: "Marque el instante en que la cuadrada salta de arriba abajo, y mire por dónde pasa ahí la suma de senoides."
    libro: [154]
    fijar: { N: 13 }
    widget:
      tipo: grafica
      x: { id: x, min: 0, max: 12.57, unidad: rad, rotulo: "ωt" }
      y: { min: -1.5, max: 1.5, unidad: "", rotulo: amplitud }
      curvas:
        - { expr: "4/pi*(sin(x) + min(max(N - 2, 0), 1)*sin(3*x)/3 + min(max(N - 4, 0), 1)*sin(5*x)/5 + min(max(N - 6, 0), 1)*sin(7*x)/7 + min(max(N - 8, 0), 1)*sin(9*x)/9 + min(max(N - 10, 0), 1)*sin(11*x)/11 + min(max(N - 12, 0), 1)*sin(13*x)/13)", color: azul, rotulo: "suma de armónicos" }
        - { expr: "min(max(sin(x)*1000000, -1), 1)", color: tinta, rotulo: "cuadrada ideal", discontinua: true }
      mandos: []
    marcar:
      modo: x
      curva: 0
      x: "pi"
      tol: 0.03
      inicio: { x: 1.5, y: 0 }
      rotulo: "Salto de arriba abajo"
    pistas:
      - { cuando: { valor: marca_x, menor: 3.05 }, texto: "Ahí la cuadrada aún va por arriba: más a la derecha." }
      - { cuando: { valor: marca_x, mayor: 3.24 }, texto: "Ahí ya va por abajo: más a la izquierda." }
      - { texto: "Busque el primer flanco de bajada." }
    exito: "En el salto la serie converge al punto medio, a mitad de camino: no es una identidad universal."
    escalera:
      - "Mire la suma justo en el salto: ¿pasa por arriba, por abajo o por en medio?"
    solucion: "Al punto medio del salto: así lo dice el teorema, con las condiciones de Dirichlet."
  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [148, 149, 150, 153, 154]
    ideas:
      - { titulo: "Armónicos.", texto: "Senoides de frecuencia múltiplo entero de la fundamental: 2f, 3f… Cada coeficiente sale de proyectar sobre una base ortogonal." }
      - { titulo: "La cuadrada.", texto: "La fundamental más los armónicos impares, con amplitudes decrecientes. Para señales no periódicas, la transformada de Fourier." }
      - { titulo: "Flancos.", texto: "Los flancos rápidos tienen armónicos muy altos: se acoplan y radian." }
      - { titulo: "Linealidad.", texto: "Un circuito lineal trata cada frecuencia por separado: basta el análisis senoidal." }
