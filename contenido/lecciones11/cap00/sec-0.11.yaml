# Lección 1.1 de la sección 0.11 «Análisis de Fourier» (cap00): qué es un armónico, la cuadrada como suma de la
# fundamental y sus armónicos impares, la serie de Fourier y sus coeficientes por ortogonalidad, los flancos rápidos y
# sus armónicos altos, y por qué basta el análisis senoidal. Formato: contenido/lecciones11/GUIA.md.
leccion: cap00/sec-0.11

libro:
  148: "se llaman armónicos a las componentes senoidales cuya frecuencia es un múltiplo entero de ella"
  149: "Una onda cuadrada, por ejemplo, es la fundamental más los armónicos impares con amplitudes decrecientes"
  150: "las señales con flancos rápidos tienen armónicos de frecuencia muy alta, que son los que se acoplan y radian"
  151: "Esa suma es la serie de Fourier"
  152: 'f lr(( t )) = a_("0")'
  153: "La transformada de Fourier extiende la idea a señales no periódicas"
  154: "en cada discontinuidad la serie converge al punto medio del salto"

modelo:
  valores:
    N: { sim: "n", nombre: "armónico más alto sumado", unidad: "", valor: 1 }
  calculos:
    n_arm: { expr: "(N + 1)/2", sim: "armónicos", nombre: "número de armónicos impares sumados", unidad: "", cifras: 2, recortar: true }

tarjetas:
  - id: explore-sintesis
    tipo: explorar
    titulo: "Una cuadrada hecha de senoides"
    texto: "Sume armónicos impares a la fundamental, con amplitudes decrecientes. Mire cómo la suma se parece cada vez más a la cuadrada."
    libro: [149, 148]
    widget:
      tipo: grafica
      x: { id: x, min: 0, max: 12.57, unidad: rad, rotulo: "ωt" }
      y: { min: -1.5, max: 1.5, unidad: "", rotulo: "amplitud" }
      curvas:
        - { expr: "4/pi*(sin(x) + min(max(N - 2, 0), 1)*sin(3*x)/3 + min(max(N - 4, 0), 1)*sin(5*x)/5 + min(max(N - 6, 0), 1)*sin(7*x)/7 + min(max(N - 8, 0), 1)*sin(9*x)/9 + min(max(N - 10, 0), 1)*sin(11*x)/11 + min(max(N - 12, 0), 1)*sin(13*x)/13)", color: azul, rotulo: "suma de armónicos" }
        - { expr: "min(max(sin(x)*1000000, -1), 1)", color: tinta, rotulo: "cuadrada ideal", discontinua: true }
      lectura: { valor: n_arm, rotulo: "Senoides sumadas" }
      datos:
        - { valor: N, rotulo: "La más alta: {{N}}·f" }
      mandos:
        - { valor: N, lista: [1, 3, 5, 7, 9, 11, 13], rotulo: "Armónico más alto, n" }
    requiere: { mover: [N] }

  - id: prediga-impares
    tipo: predecir
    titulo: "Prediga"
    texto: "El segundo armónico está en 2f, el tercero en 3f… ¿Cuáles forman una onda cuadrada?"
    libro: [148, 149]
    opciones:
      - texto: "La fundamental y solo los armónicos impares"
        bien: true
        porque: "La cuadrada es la fundamental más el tercero, el quinto, el séptimo…, con amplitudes decrecientes."
      - texto: "Todos los armónicos, pares e impares"
        porque: "En la cuadrada faltan los pares: solo aparecen los impares."
      - texto: "Ninguno: es una sola frecuencia"
        porque: "Una sola frecuencia es una senoide. Cualquier otra forma periódica necesita armónicos."

  - id: regla-serie
    tipo: formula
    titulo: "La serie de Fourier"
    texto: "Cualquier señal periódica es su valor medio, a₀, más senos y cosenos de n·ω, cada uno con su amplitud."
    libro: [152, 151]
    ec: 152
    sustitucion: "f(t) ≈ suma de {{n_arm}} senoides: la fundamental y sus armónicos impares hasta el {{N}}"
    widget:
      tipo: grafica
      x: { id: x, min: 0, max: 12.57, unidad: rad, rotulo: "ωt" }
      y: { min: -1.5, max: 1.5, unidad: "", rotulo: "amplitud" }
      curvas:
        - { expr: "4/pi*(sin(x) + min(max(N - 2, 0), 1)*sin(3*x)/3 + min(max(N - 4, 0), 1)*sin(5*x)/5 + min(max(N - 6, 0), 1)*sin(7*x)/7 + min(max(N - 8, 0), 1)*sin(9*x)/9 + min(max(N - 10, 0), 1)*sin(11*x)/11 + min(max(N - 12, 0), 1)*sin(13*x)/13)", color: azul, rotulo: "suma de armónicos" }
        - { expr: "min(max(sin(x)*1000000, -1), 1)", color: tinta, rotulo: "cuadrada ideal", discontinua: true }
      mandos:
        - { valor: N, lista: [1, 3, 5, 7, 9, 11, 13], rotulo: "Armónico más alto, n" }

  - id: ordene-coeficientes
    tipo: pregunta
    fase: "Ordene"
    titulo: "De dónde salen los coeficientes"
    texto: "Ordene los pasos para obtener el coeficiente aₘ de la serie."
    libro: [154]
    ordenar:
      - "Multiplicar la serie por cos(mωt)"
      - "Integrar sobre un periodo"
      - "Todos los términos se anulan menos uno: son ortogonales"
      - "Despejar el coeficiente que queda"
    exito: "Eso es: una proyección sobre una base ortogonal, como descomponer un vector en sus componentes."
    pistas:
      - { texto: "La ortogonalidad actúa al integrar: la integral del producto de dos frecuencias distintas es nula." }

  - id: flancos
    tipo: sorpresa
    titulo: "Flancos rápidos, armónicos altos"
    texto: "Quite armónicos altos y mire el flanco de subida. ¿Sube igual de deprisa?"
    nota: "No: los flancos rápidos están hechos de armónicos muy altos, que se acoplan y radian. Por eso un circuito digital lento puede interferir."
    libro: [150]
    inicio: { N: 13 }
    widget:
      tipo: grafica
      x: { id: x, min: 0, max: 12.57, unidad: rad, rotulo: "ωt" }
      y: { min: -1.5, max: 1.5, unidad: "", rotulo: "amplitud" }
      curvas:
        - { expr: "4/pi*(sin(x) + min(max(N - 2, 0), 1)*sin(3*x)/3 + min(max(N - 4, 0), 1)*sin(5*x)/5 + min(max(N - 6, 0), 1)*sin(7*x)/7 + min(max(N - 8, 0), 1)*sin(9*x)/9 + min(max(N - 10, 0), 1)*sin(11*x)/11 + min(max(N - 12, 0), 1)*sin(13*x)/13)", color: azul, rotulo: "suma de armónicos" }
      lectura: { valor: n_arm, rotulo: "Senoides sumadas" }
      mandos:
        - { valor: N, lista: [1, 3, 5, 7, 9, 11, 13], rotulo: "Armónico más alto, n" }
    requiere: { mover: [N] }

  - id: el-salto
    tipo: pregunta
    titulo: "En el salto"
    texto: "En el instante del salto de la cuadrada, ¿a qué valor converge la serie de Fourier?"
    libro: [154]
    opciones:
      - texto: "Al punto medio del salto"
        bien: true
        porque: "En cada discontinuidad la serie converge al punto medio del salto. No es una identidad universal."
      - texto: "Al valor de arriba del salto"
        porque: "Las senoides valen lo mismo justo antes y después: la serie se queda a mitad de camino."
      - texto: "A ninguno: ahí la serie no da un valor"
        porque: "Sí converge, con las condiciones de Dirichlet: al punto medio del salto."

  - id: por-que-senoides
    tipo: porque
    titulo: "¿Por qué basta con senoides?"
    texto: "El libro entero se apoya en el análisis senoidal. ¿Por qué basta para cualquier señal periódica?"
    libro: [150, 154]
    opciones:
      - texto: "Un circuito lineal trata cada frecuencia por separado"
        bien: true
        porque: "Sabiendo qué hace con una senoide de cada frecuencia, se sabe qué hace con cualquier señal: es la suma de senoides."
      - texto: "Porque casi todas las señales reales son senoides"
        porque: "No lo son: cuadradas, pulsos, audio. Basta porque cualquiera es una suma de senoides."
      - texto: "Porque las senoides no tienen armónicos"
        porque: "Es cierto que una senoide es una sola frecuencia, pero la razón es la linealidad del circuito."

  - id: terminos
    tipo: pregunta
    fase: "Empareje"
    titulo: "El vocabulario de Fourier"
    texto: "Una cada término con lo que significa."
    libro: [148, 151, 153, 154]
    emparejar:
      - ["Fundamental", "La frecuencia f de la señal periódica"]
      - ["Armónico", "Senoide de frecuencia múltiplo entero de f"]
      - ["a₀", "El valor medio: la componente continua"]
      - ["Transformada de Fourier", "La idea para señales no periódicas"]
    exito: "Eso es. El «ancho de banda» de una señal o de un canal es lenguaje de Fourier."
    pistas:
      - { texto: "a₀ es el único término que no oscila." }

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [148, 149, 150, 154]
    ideas:
      - { titulo: "Armónicos.", texto: "Senoides de frecuencia múltiplo entero de la fundamental: 2f, 3f…" }
      - { titulo: "La cuadrada.", texto: "La fundamental más los armónicos impares, con amplitudes decrecientes." }
      - { titulo: "Flancos.", texto: "Los flancos rápidos tienen armónicos muy altos: se acoplan y radian." }
      - { titulo: "Linealidad.", texto: "Un circuito lineal trata cada frecuencia por separado: basta el análisis senoidal." }
