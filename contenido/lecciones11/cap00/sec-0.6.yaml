# Lección 1.1 de la sección 0.6 «Cálculo Diferencial» (cap00): la derivada como pendiente de la tangente, i = C·dv/dt
# (sin cambio no hay corriente), v = L·di/dt (cortar deprisa da miles de voltios), la pendiente de un flanco y su
# corriente parásita, por qué la tensión de un condensador no salta y la tabla de derivadas.
# Formato: contenido/lecciones11/GUIA.md.
leccion: cap00/sec-0.6

libro:
  80: "la pendiente de la recta tangente a la curva en cada punto"
  81: 'i_("C") = C dot.op (d v)/(d t)'
  82: "un condensador se opone a los cambios bruscos de tensión"
  85: "Derivadas de uso frecuente"
  87: "si la tensión es constante, la corriente es cero por mucha tensión que haya"
  88: "una bobina de 10 mH cuya corriente cambia 1 A cada milisegundo desarrolla 10 V"
  89: "Un flanco de 3,3 V que sube en 2 ns tiene una pendiente de 1,65 V/ns"
  90: "Donde una función tiene un máximo o un mínimo, su derivada es cero"
  91: "la resistencia dinámica rd = VT/I"
  92: "derivar una senoide la adelanta 90° y la multiplica por ω"
  93: "la tensión de un condensador no puede saltar"

modelo:
  valores:
    x0: { sim: "ωt", nombre: "punto de la senoide", unidad: rad, valor: 1 }
    C: { sim: "C", nombre: "capacidad", unidad: F, valor: 0.0000001 }
    dvdt: { sim: "dv/dt", nombre: "pendiente de la tensión", unidad: "V/s", valor: 1000 }
    V0: { sim: "V₀", nombre: "tensión de partida", unidad: V, valor: 5 }
    L: { sim: "L", nombre: "inductancia", unidad: H, valor: 0.01 }
    t_c: { sim: "t_{corte}", nombre: "tiempo en que se corta 1 A", unidad: s, valor: 0.001 }
    C_p: { sim: "C_{parásita}", nombre: "capacidad parásita", unidad: F, valor: 0.00000000001 }
    V_fl: { sim: "V", nombre: "altura del flanco", unidad: V, valor: 3.3 }
    pend_v: { sim: "dv/dt", nombre: "pendiente del flanco", unidad: "V/s", valor: 1650000000 }
  calculos:
    y0: { expr: "sin(x0)", sim: "sen ωt", nombre: "valor de la senoide", unidad: "" }
    pend: { expr: "cos(x0)", sim: "pendiente", nombre: "pendiente de la tangente", unidad: "" }
    i_C: { expr: "C*dvdt", sim: "i_{C}", nombre: "corriente del condensador", unidad: A }
    v_L: { expr: "L*1/t_c", sim: "v_{L}", nombre: "tensión de la bobina", unidad: V }
    t_r: { expr: "V_fl/pend_v", sim: "t_{subida}", nombre: "tiempo de subida del flanco", unidad: s }
    i_p: { expr: "C_p*pend_v", sim: "i", nombre: "corriente por la capacidad parásita", unidad: A }

tarjetas:
  - id: explore-pendiente
    tipo: explorar
    titulo: "La derivada es una pendiente"
    texto: "Arrastre el punto por la senoide. La recta naranja es la tangente; la discontinua, su pendiente en cada punto."
    libro: [80, 92]
    widget:
      tipo: grafica
      x: { id: x, min: 0, max: 6.3, unidad: rad, rotulo: "ωt" }
      y: { min: -1.5, max: 1.5, unidad: "", rotulo: "sen ωt" }
      curvas:
        - { expr: "sin(x)", color: azul, rotulo: "sen ωt" }
        - { expr: "y0 + pend*(x - x0)", color: naranja, rotulo: "tangente" }
        - { expr: "cos(x)", color: tinta, rotulo: "pendiente: cos ωt", discontinua: true }
      asas:
        - { mueve: x0, x: "x0", y: "y0", rotulo: "Punto de la senoide" }
      lectura: { valor: pend, rotulo: "Pendiente" }
      mandos:
        - { valor: x0, min: 0, max: 6.25, paso: 0.25, rotulo: "Punto, ωt" }
    requiere: { mover: [x0] }
    nota: "La pendiente de una senoide es otra senoide, adelantada 90°."

  - id: prediga-cresta
    tipo: predecir
    titulo: "Prediga"
    texto: "El punto está en la cresta de la senoide. ¿Cuánto vale ahí la pendiente?"
    libro: [90]
    fijar: { x0: 1.5707963267948966 }
    widget:
      tipo: grafica
      x: { id: x, min: 0, max: 6.3, unidad: rad, rotulo: "ωt" }
      y: { min: -1.5, max: 1.5, unidad: "", rotulo: "sen ωt" }
      curvas:
        - { expr: "sin(x)", color: azul, rotulo: "sen ωt" }
      lectura: { valor: pend, rotulo: "Pendiente" }
      ocultar: true
    opciones:
      - texto: "Cero"
        bien: true
        porque: "Donde una función tiene un máximo o un mínimo, su derivada es cero: la tangente es horizontal."
      - texto: "La máxima"
        porque: "La pendiente es máxima en los pasos por cero, donde la curva sube más deprisa."
      - texto: "Igual al valor de la cresta"
        porque: "La pendiente no es la altura, sino lo deprisa que cambia la curva. En la cresta deja de subir."

  - id: regla-condensador
    tipo: formula
    titulo: "La corriente de un condensador"
    texto: "Es proporcional a lo deprisa que cambia su tensión. Cambie la pendiente de la rampa."
    libro: [81, 82]
    ec: 81
    fijar: { C: 0.0000001 }
    sustitucion: "i_{C} = {{C}} · {{dvdt}} = {{i_C}}"
    widget:
      tipo: grafica
      x: { id: x, min: 0, max: 0.01, unidad: s, rotulo: "t" }
      y: { min: 0, max: 30, unidad: V, rotulo: "v" }
      curvas:
        - { expr: "V0 + dvdt*x", color: azul, rotulo: "tensión del condensador" }
      lectura: { valor: i_C, rotulo: "Corriente" }
      mandos:
        - { valor: dvdt, lista: [0, 500, 1000, 2000], rotulo: "Pendiente, dv/dt" }

  - id: estime-corriente
    tipo: pregunta
    fase: "Estime"
    titulo: "Un voltio cada milisegundo"
    texto: "La tensión de un condensador de 100 nF sube a 1000 V/s. Estime la corriente que toma."
    libro: [87]
    fijar: { C: 0.0000001, dvdt: 1000 }
    estimar:
      objetivo: "i_C"
      unidad: A
      min: 0
      max: 0.0005
      paso: 0.00001
      inicio: 0.0003
      tol: 0.03
      rotulo: "i_{C}"
    exito: "i = C·dv/dt = 100 nF × 1000 V/s = 100 µA."
    pistas:
      - { cuando: { valor: estimacion, menor: 0.000097 }, texto: "Se ha quedado corto: multiplique la capacidad por la pendiente." }
      - { texto: "Se ha pasado: 100 nF por 1000 V/s; cuente bien los prefijos." }
    comprobar:
      - { i_C: 0.0001 }

  - id: sin-cambio
    tipo: sorpresa
    titulo: "Mucha tensión, ninguna corriente"
    texto: "Ponga la pendiente a cero. El condensador sigue cargado. ¿Toma corriente?"
    nota: "Ninguna: sin cambio no hay corriente. Por eso un condensador bloquea la continua y deja pasar la alterna."
    libro: [87]
    fijar: { C: 0.0000001 }
    inicio: { dvdt: 1000 }
    widget:
      tipo: grafica
      x: { id: x, min: 0, max: 0.01, unidad: s, rotulo: "t" }
      y: { min: 0, max: 30, unidad: V, rotulo: "v" }
      curvas:
        - { expr: "V0 + dvdt*x", color: azul, rotulo: "tensión del condensador" }
      lectura: { valor: i_C, rotulo: "Corriente" }
      mandos:
        - { valor: dvdt, lista: [0, 500, 1000, 2000], rotulo: "Pendiente, dv/dt" }
    requiere: { mover: [dvdt] }

  - id: prediga-bobina
    tipo: predecir
    titulo: "Prediga"
    texto: "Una bobina de 10 mH desarrolla 10 V si su corriente cambia 1 A en un milisegundo. ¿Y si se corta en un microsegundo?"
    libro: [88]
    fijar: { L: 0.01, t_c: 0.000001 }
    widget:
      tipo: grafica
      x: { id: x, min: 0, max: 0.002, unidad: s, rotulo: "t" }
      y: { min: 0, max: 1.2, unidad: A, rotulo: "i" }
      curvas:
        - { expr: "max(1 - x/t_c, 0)", color: azul, rotulo: "corriente de la bobina" }
      lectura: { valor: v_L, rotulo: "Tensión de la bobina" }
      ocultar: true
    opciones:
      - texto: "10 000 V"
        bien: true
        porque: "di/dt es mil veces mayor, y la tensión también: el pico que destruye el transistor sin diodo de protección."
      - texto: "10 V"
        porque: "Eso es con el cambio en un milisegundo. En un microsegundo el cambio es mil veces más rápido."
      - texto: "0 V"
        porque: "Cero sería con corriente constante. Aquí la corriente cambia, y muy deprisa."
    comprobar:
      - { v_L: 10000 }
      - { con: { t_c: 0.001 }, v_L: 10 }

  - id: reto-flanco
    tipo: reto
    titulo: "Reto: la pendiente de un flanco"
    texto: "Un flanco de 3,3 V pasa por una capacidad parásita de 10 pF. Ajuste la pendiente del flanco para que tome 16,5 mA."
    libro: [89]
    fijar: { V_fl: 3.3, C_p: 0.00000000001 }
    inicio: { pend_v: 500000000 }
    widget:
      tipo: grafica
      x: { id: x, min: 0, max: 0.00000001, unidad: s, rotulo: "t" }
      y: { min: 0, max: 4, unidad: V, rotulo: "v" }
      curvas:
        - { expr: "V_fl*min(x/t_r, 1)", color: azul, rotulo: "flanco" }
      datos:
        - { valor: t_r, rotulo: "Sube en {{t_r}}" }
      mandos:
        - { valor: pend_v, min: 200000000, max: 3000000000, paso: 50000000, rotulo: "Pendiente, dv/dt" }
    condiciones:
      - { valor: i_p, objetivo: 0.0165, tol: 0.02, rotulo: "Corriente: {{i_p}}" }
    exito: "1,65 V/ns, un flanco de 2 ns: por 10 pF, 16,5 mA. Es la pendiente de los flancos, no la frecuencia, lo que causa el rebote de masa."
    pistas:
      - { cuando: { valor: i_p, menor: 0.01617 }, texto: "Falta corriente: haga el flanco más empinado." }
      - { cuando: { valor: i_p, mayor: 0.01683 }, texto: "Sobra corriente: suavice el flanco, con menos pendiente." }
    ayuda: "i = C·dv/dt: con 10 pF, 16,5 mA piden una pendiente de 1,65 V/ns."
    comprobar:
      - { con: { pend_v: 1650000000 }, t_r: 0.000000002, i_p: 0.0165 }

  - id: por-que-no-salta
    tipo: porque
    titulo: "¿Por qué no salta?"
    texto: "La tensión de un condensador puede cambiar deprisa, pero nunca a saltos. ¿Por qué?"
    libro: [93, 82]
    opciones:
      - texto: "Un salto daría dv/dt infinita, y por tanto una corriente infinita"
        bien: true
        porque: "De i = C·dv/dt se sigue. Igual, la corriente de una bobina no puede saltar: son las condiciones iniciales de los transitorios."
      - texto: "Porque su tensión siempre es constante"
        porque: "No: cambia, y al cambiar toma corriente. Lo que no puede es cambiar de golpe."
      - texto: "Porque su resistencia interna lo frena"
        porque: "El motivo está en el condensador ideal mismo: i = C·dv/dt no admite saltos de tensión."

  - id: derivadas
    tipo: pregunta
    fase: "Empareje"
    titulo: "La tabla de derivadas"
    texto: "Una cada función con su derivada."
    libro: [85]
    emparejar:
      - ["xⁿ", "n · xⁿ⁻¹"]
      - ["eᵃˣ", "a · eᵃˣ"]
      - ["ln(x)", "1 / x"]
      - ["sen(a·x)", "a · cos(a·x)"]
      - ["cos(a·x)", "−a · sen(a·x)"]
    exito: "Eso es. La de sen(ωt), ω·cos(ωt), es la que hace que la corriente de un condensador adelante 90°."
    pistas:
      - { texto: "Derivar el seno da un coseno y derivar el coseno da menos el seno." }

  - id: pequena-senal
    tipo: pregunta
    titulo: "Vista de cerca, una recta"
    texto: "La resistencia dinámica de un diodo, r_{d} = V_{T}/I, sale de sustituir su curva exponencial por…"
    libro: [91]
    opciones:
      - texto: "Su tangente en el punto de trabajo"
        bien: true
        porque: "Cualquier curva suave, vista de cerca, es una recta con la pendiente de la tangente: es la pequeña señal."
      - texto: "Una recta que pasa por el origen"
        porque: "La recta que importa es la tangente en el punto de trabajo, no la que une ese punto con el origen."
      - texto: "Su valor medio en un periodo"
        porque: "El valor medio es una integral. La resistencia dinámica sale de una derivada, la pendiente."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [80, 87, 88, 93]
    ideas:
      - { titulo: "Pendiente.", texto: "La derivada es la pendiente de la tangente; en un máximo o un mínimo, cero." }
      - { titulo: "Condensador.", texto: "i = C·dv/dt: 100 nF a 1000 V/s toman 100 µA; sin cambio, cero." }
      - { titulo: "Bobina.", texto: "v = L·di/dt: se opone al cambio de la corriente, no a la corriente." }
      - { titulo: "Sin saltos.", texto: "Ni la tensión de un condensador ni la corriente de una bobina pueden saltar." }
