# Lección 1.1 de la sección 0.3 «Trigonometría y la Señal Senoidal» (cap00). Lección de referencia con una
# gráfica de función de parámetros que se arrastran. Formato: contenido/lecciones11/GUIA.md.
leccion: cap00/sec-0.3

libro:
  30: "una vuelta completa = 360° = 2π radianes"
  32: 'v lr(( t )) = V_("p")'
  33: "El periodo, tiempo que tarda en repetirse, es T = 1/f"
  35: "vale Vₚ dividido por raíz de dos"
  36: 'V_("RMS") = (V_("p"))/(sqrt("2"))'
  39: "230 V eficaces y 50 Hz"
  40: "un radián son 57,3°"
  41: "una fase de 90° adelanta la señal un cuarto de periodo, que a 50 Hz son 5 ms"
  42: "cos(ωt) = sen(ωt + 90°)"

modelo:
  valores:
    V_p: { sim: "V_{p}", nombre: "amplitud (valor de pico)", unidad: V, valor: 325 }
    f: { sim: "f", nombre: "frecuencia", unidad: Hz, valor: 50 }
    phi: { sim: "φ", nombre: "fase inicial", unidad: "°", valor: 0 }
    V_ef: { sim: "V_{RMS}", nombre: "valor eficaz", unidad: V, valor: 230 }
  calculos:
    omega: { expr: "2*pi*f", sim: "ω", nombre: "frecuencia angular", unidad: "rad/s" }
    T: { expr: "1/f", sim: "T", nombre: "periodo", unidad: s }
    adelanto: { expr: "phi/360*T", sim: "adelanto", nombre: "adelanto en el tiempo", unidad: s }
    V_rms: { expr: "V_p/sqrt(2)", sim: "V_{RMS}", nombre: "valor eficaz", unidad: V }
    pico: { expr: "V_ef*sqrt(2)", sim: "V_{p}", nombre: "pico de la red", unidad: V }
    # time of the first crest and the first upward zero crossing after t = 0 (where the handles sit)
    t_cresta: { expr: "(90 - phi - 360*floor((90 - phi)/360))/(360*f)", nombre: "instante de la cresta", unidad: s }
    t_cero: { expr: "(0 - phi - 360*floor((0 - phi)/360))/(360*f)", nombre: "instante del paso por cero", unidad: s }

tarjetas:
  - id: explore-senoide
    tipo: explorar
    titulo: "Una senoide, tres mandos"
    texto: "Mueva la amplitud, la frecuencia y la fase, o arrastre los puntos de la curva. Fíjese en qué cambia cada una."
    libro: [32, 33]
    widget:
      tipo: grafica
      x: { id: t, min: 0, max: 0.04, unidad: s, rotulo: "t" }
      y: { min: -400, max: 400, unidad: V, rotulo: "v(t)" }
      curvas:
        - { expr: "V_p*sin(2*pi*f*t + phi*pi/180)", color: azul, rotulo: "v(t)" }
      asas:
        - { mueve: V_p, x: "t_cresta", y: "V_p", rotulo: "Cresta: amplitud" }
        - { mueve: phi, x: "t_cero", y: "0", rotulo: "Paso por cero: fase" }
      lectura: { valor: T, rotulo: "Periodo" }
      datos:
        - { valor: omega, rotulo: "ω = {{omega}}" }
      mandos:
        - { valor: V_p, min: 50, max: 400, paso: 5, rotulo: "Amplitud, V_{p}" }
        - { valor: f, min: 25, max: 100, paso: 5, rotulo: "Frecuencia, f" }
        - { valor: phi, min: -180, max: 180, paso: 15, rotulo: "Fase, φ" }
    requiere: { mover: [V_p, f, phi] }

  - id: prediga-periodo
    tipo: predecir
    titulo: "Prediga"
    texto: "La red española va a 50 Hz. ¿Cuánto dura un periodo?"
    libro: [33, 39]
    fijar: { V_p: 325, f: 50, phi: 0 }
    widget:
      tipo: grafica
      x: { id: t, min: 0, max: 0.04, unidad: s, rotulo: "t" }
      y: { min: -400, max: 400, unidad: V, rotulo: "v(t)" }
      curvas:
        - { expr: "V_p*sin(2*pi*f*t + phi*pi/180)", color: azul, rotulo: "v(t)" }
      lectura: { valor: T, rotulo: "Periodo" }
      ocultar: true
    opciones:
      - texto: "20 ms"
        bien: true
        porque: "T = 1/f = 1/50 s = 20 ms. Cada semiciclo dura 10 ms."
      - texto: "50 ms"
        porque: "Confunde hercios con milisegundos: 50 Hz son 50 ciclos cada segundo, no 50 ms por ciclo."
      - texto: "2 ms"
        porque: "Ese periodo sería el de una señal de 500 Hz, diez veces más rápida que la red."
    escalera:
      - "El periodo es la inversa de la frecuencia: T = 1/f."
    solucion: "T = 1/50 s = 20 ms."
    comprobar:
      - { T: 0.02 }
      - { con: { f: 500 }, T: 0.002 }

  - id: regla-senoide
    tipo: formula
    titulo: "La señal senoidal"
    texto: "Vₚ es el pico, ω = 2π·f la frecuencia angular y φ la fase inicial. El periodo es T = 1/f."
    nota: "Se usan radianes porque ω·t da directamente un ángulo en radianes, sin conversiones."
    libro: [32, 33, 40]
    ec: 32
    sustitucion: "ω = 2π · {{f}} = {{omega}};  T = 1 / {{f}} = {{T}}"
    widget:
      tipo: grafica
      x: { id: t, min: 0, max: 0.04, unidad: s, rotulo: "t" }
      y: { min: -400, max: 400, unidad: V, rotulo: "v(t)" }
      curvas:
        - { expr: "V_p*sin(2*pi*f*t + phi*pi/180)", color: azul, rotulo: "v(t)" }
      lectura: { valor: T, rotulo: "Periodo" }
      mandos:
        - { valor: f, min: 25, max: 100, paso: 5, rotulo: "Frecuencia, f" }

  - id: pico-red
    tipo: pregunta
    fase: "Estime"
    titulo: "Del eficaz al pico"
    texto: "La red da 230 V eficaces, y el eficaz vale Vₚ dividido por raíz de dos. Estime el pico, Vₚ."
    libro: [35, 36, 39]
    fijar: { V_ef: 230 }
    estimar:
      objetivo: "pico"
      unidad: V
      min: 200
      max: 400
      paso: 5
      inicio: 250
      tol: 0.02
      rotulo: "V_{p} de la red"
    exito: "230 × √2 = 325 V: a eso se carga un condensador de filtro tras un rectificador."
    pistas:
      - { cuando: { valor: estimacion, menor: 318 }, texto: "Se ha quedado corto: el pico es mayor que el eficaz, √2 veces." }
      - { texto: "Se ha pasado: el eficaz es 0,707 veces el pico, así que el pico es √2 veces el eficaz." }
    escalera:
      - "El pico es mayor que el eficaz: despeje Vₚ multiplicando por √2."
    solucion: "230 × √2 = 325 V: a eso se carga un condensador de filtro tras un rectificador."
    comprobar:
      - { pico: 325.27 }

  - id: reto-fase
    tipo: reto
    titulo: "Reto: un cuarto de periodo"
    texto: "Una fase de 90° adelanta la señal un cuarto de periodo. Mueva φ hasta que la azul se adelante 5 ms a la gris."
    libro: [41, 30]
    fijar: { V_p: 325, f: 50 }
    inicio: { phi: 0 }
    widget:
      tipo: grafica
      x: { id: t, min: 0, max: 0.04, unidad: s, rotulo: "t" }
      y: { min: -400, max: 400, unidad: V, rotulo: "v(t)" }
      curvas:
        - { expr: "V_p*sin(2*pi*f*t)", color: tinta, rotulo: "sin desfase", discontinua: true }
        - { expr: "V_p*sin(2*pi*f*t + phi*pi/180)", color: azul, rotulo: "v(t)" }
      asas:
        - { mueve: phi, x: "t_cero", y: "0", rotulo: "Paso por cero: fase" }
      mandos:
        - { valor: phi, min: -180, max: 180, paso: 15, rotulo: "Fase, φ" }
    condiciones:
      - { valor: adelanto, objetivo: 0.005, tol: 0.02, rotulo: "Adelanto: {{adelanto}}" }
    exito: "φ = 90°: un cuarto de los 20 ms del periodo, 5 ms. Así adelanta la corriente a la tensión en un condensador."
    pistas:
      - { cuando: { valor: adelanto, menor: 0.0049 }, texto: "Le falta adelanto: suba la fase." }
      - { cuando: { valor: adelanto, mayor: 0.0051 }, texto: "Se ha pasado: baje la fase." }
    escalera:
      - "Un periodo entero son 360°, una vuelta completa."
    solucion: "Un cuarto de periodo son 90°: con φ = 90° la azul se adelanta 5 ms."
    comprobar:
      - { T: 0.02 }
      - { con: { phi: 90 }, adelanto: 0.005 }

  - id: dibuje-fase
    tipo: dibujar
    titulo: "Dibuje la senoide adelantada"
    texto: "La red, 325 V de pico y 50 Hz, con φ = 90°. Dibuje dos periodos: ¿por dónde empieza la curva?"
    libro: [39, 41, 42]
    fijar: { V_p: 325, f: 50, phi: 90 }
    dibujar:
      x: { id: tt, min: 0, max: 0.04, unidad: s, rotulo: "t" }
      y: { min: -400, max: 400, unidad: V, rotulo: "v(t)" }
      curva: "V_p*sin(2*pi*f*tt + phi*pi/180)"
      puntos: 41
      tol: 0.08
      holgura: 0.03
      rotulo: "v(t) con φ = 90°"
    exito: "Empieza en la cresta, 325 V: es un coseno. Cruza el cero a los 5 ms y repite cada 20 ms."
    pistas:
      - { cuando: { valor: desfase, mayor: 0.05 }, texto: "Su curva va tarde: con 90° de adelanto la cresta llega en t = 0." }
      - { cuando: { valor: amplitud, menor: 0.8 }, texto: "Le falta amplitud: el pico de la red es 325 V." }
      - { texto: "Repase el comienzo: con φ = 90°, en t = 0 la señal ya está en su pico." }
    escalera:
      - "Una fase de 90° adelanta la señal un cuarto de periodo, 5 ms a 50 Hz."
      - "Un seno adelantado 90° es un coseno: cos(ωt) = sen(ωt + 90°)."
    solucion: "Empiece arriba, en 325 V; cruce el cero a los 5 ms, baje a −325 V a los 10 ms y vuelva a los 20 ms."

  - id: seno-coseno
    tipo: sorpresa
    titulo: "Seno y coseno, la misma curva"
    texto: "La gris es un coseno. Mueva la fase de la azul, un seno, hasta que la tape."
    libro: [42]
    fijar: { V_p: 325, f: 50 }
    inicio: { phi: -90 }
    widget:
      tipo: grafica
      x: { id: t, min: 0, max: 0.04, unidad: s, rotulo: "t" }
      y: { min: -400, max: 400, unidad: V, rotulo: "v(t)" }
      curvas:
        - { expr: "V_p*cos(2*pi*f*t)", color: tinta, rotulo: "coseno", discontinua: true }
        - { expr: "V_p*sin(2*pi*f*t + phi*pi/180)", color: azul, rotulo: "seno con fase φ" }
      asas:
        - { mueve: phi, x: "t_cero", y: "0", rotulo: "Paso por cero: fase" }
      mandos:
        - { valor: phi, min: -180, max: 180, paso: 15, rotulo: "Fase, φ" }
    requiere: { mover: [phi] }
    nota: "Con φ = 90° la tapa: cos(ωt) = sen(ωt + 90°). Son la misma curva, desplazada."

  - id: por-que-radianes
    tipo: porque
    titulo: "¿Por qué radianes?"
    texto: "En electrónica los ángulos se miden en radianes, no en grados. ¿Por qué?"
    libro: [40]
    opciones:
      - texto: "ω·t da el ángulo en radianes sin conversiones, y las derivadas salen limpias"
        bien: true
        porque: "d(sen ωt)/dt = ω·cos ωt solo en radianes: en grados habría un factor π/180 en cada derivada."
      - texto: "Un radián es un grado más preciso"
        porque: "No: un radián son 57,3°. Es otra unidad, el ángulo cuyo arco mide lo mismo que el radio."
      - texto: "Los multímetros miden los ángulos en radianes"
        porque: "La razón no es el instrumento, sino ω·t y las derivadas del seno y el coseno."
    widget:
      tipo: figura
      figura: fig-0.3
      zonas:
        - { id: senal, rotulo: "La senoide y sus parámetros", rect: [0, 0, 369, 199] }
    escalera:
      - "Derive sen(ωt): ¿en qué unidad del ángulo sale limpia la derivada?"
    solucion: "Solo en radianes d(sen ωt)/dt = ω·cos ωt; en grados habría un factor π/180."

  - id: simbolos
    tipo: pregunta
    fase: "Empareje"
    titulo: "Cada símbolo, su papel"
    texto: "Una cada símbolo de v(t) = Vₚ·sen(ωt + φ) con lo que significa."
    libro: [33, 39]
    emparejar:
      - ["Vₚ", "Amplitud, el valor de pico"]
      - ["ω", "Frecuencia angular, en radianes por segundo"]
      - ["φ", "Fase inicial"]
      - ["T", "Periodo: lo que tarda en repetirse"]
    exito: "Eso es. En la red: Vₚ = 325 V, ω = 314 rad/s y T = 20 ms."
    pistas:
      - { texto: "ω lleva dentro la frecuencia (ω = 2π·f); T es su inversa, T = 1/f." }
    escalera:
      - "Vₚ va delante del seno: es la altura de la cresta."
    solucion: "Vₚ: amplitud, el valor de pico. ω: frecuencia angular, en radianes por segundo. φ: fase inicial. T: periodo: lo que tarda en repetirse."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [32, 33, 36, 39, 41]
    ideas:
      - { titulo: "La senoide.", texto: "v(t) = Vₚ·sen(ωt + φ): pico, frecuencia angular ω = 2π·f y fase." }
      - { titulo: "El periodo.", texto: "T = 1/f: a 50 Hz, 20 ms." }
      - { titulo: "Eficaz y pico.", texto: "El eficaz es Vₚ/√2: la red, 230 V eficaces y 325 V de pico." }
      - { titulo: "La fase.", texto: "90° adelantan la señal un cuarto de periodo: 5 ms a 50 Hz." }
