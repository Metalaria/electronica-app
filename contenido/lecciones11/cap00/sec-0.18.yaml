# Lección 1.1 de la sección 0.19 «Transformada Z» (cap00): z⁻¹ como retardo de una muestra, la definición
# X(z) = Σ x[n]·z⁻ⁿ, z = e^(sT) lleva el eje imaginario a la circunferencia unidad, y la estabilidad de un filtro
# digital: polos dentro del círculo. Formato: contenido/lecciones11/GUIA.md.
leccion: cap00/sec-0.18

libro:
  261: "Llamando z = e^(sT) se obtiene"
  262: 'X lr(( z )) = "Σ" x lr([ n ]) dot.op z^(- n)'
  263: "z⁻¹ es literalmente el operador «retardo de una muestra»"
  264: "todos los polos dentro del círculo unidad"

modelo:
  valores:
    k: { sim: "k", nombre: "muestras de retardo", unidad: "", valor: 0 }
    pz: { sim: "a", nombre: "factor de la secuencia", unidad: "", valor: 0.7 }
    zp: { sim: "z", nombre: "posición del polo, z", unidad: "", valor: 0.5 }
  calculos:
    absz: { expr: "abs(zp)", sim: "|z|", nombre: "distancia del polo al origen", unidad: "", cifras: 2 }

tarjetas:
  - id: explore-retardo
    tipo: explorar
    titulo: "z⁻¹ retrasa una muestra"
    texto: "Una secuencia de muestras, x[n], y la misma multiplicada por z^{−k}. Mueva k."
    nota: "Cada z⁻¹ la desplaza una muestra: z⁻¹·X(z) corresponde a x[n − 1]."
    libro: [263]
    fijar: { pz: 0.7 }
    widget:
      tipo: grafica
      x: { id: x, min: 0, max: 10, unidad: "", rotulo: "n" }
      y: { min: 0, max: 1.2, unidad: "", rotulo: "" }
      curvas:
        - { expr: "pz^floor(x)", color: tinta, rotulo: "x[n]", discontinua: true }
        - { expr: "pz^(floor(x) - k)*min(max((floor(x) - k + 1)*1000, 0), 1)", color: azul, rotulo: "z^{−k}·X(z)" }
      asas:
        - { mueve: k, x: "k", y: "1", rotulo: "Retardo, k" }
      lectura: { valor: k, rotulo: "Muestras de retardo" }
      mandos:
        - { valor: k, min: 0, max: 4, paso: 1, rotulo: "Potencia de z⁻¹, k" }
    requiere: { mover: [k] }

  - id: prediga-circunferencia
    tipo: predecir
    titulo: "Prediga"
    texto: "Con z = e^{sT}, ¿en qué se transforma el eje imaginario del plano s?"
    libro: [264, 261]
    opciones:
      - texto: "En la circunferencia unidad del plano z"
        bien: true
        porque: "Y el semiplano izquierdo, el estable, en el interior de esa circunferencia."
      - texto: "En el eje real del plano z"
        porque: "Sobre el eje imaginario, s = jω y |e^{jωT}| = 1: los puntos quedan a distancia 1 del origen, en la circunferencia."
      - texto: "En una recta vertical en z = 1"
        porque: "e^{jωT} gira alrededor del origen con módulo 1: dibuja una circunferencia, no una recta."
    widget:
      tipo: grafica
      x: { id: x, min: 0, max: 10, unidad: "", rotulo: n }
      y: { min: -3, max: 3, unidad: "", rotulo: "zⁿ" }
      curvas:
        - { expr: "zp^floor(x)", color: azul, rotulo: "zⁿ" }
      lectura: { valor: absz, rotulo: "Distancia al origen, |z|" }
      mandos:
        - { valor: zp, min: -1.3, max: 1.3, paso: 0.1, rotulo: "Polo, z" }
    escalera:
      - "Sobre el eje imaginario, s = jω: ¿cuánto vale el módulo de e^{jωT}?"
    solucion: "|e^{jωT}| = 1: el eje imaginario va a la circunferencia unidad."

  - id: regla-z
    tipo: formula
    titulo: "La transformada Z"
    texto: "El equivalente discreto de Laplace: cada muestra x[n] va multiplicada por z^{−n}. Una ecuación en diferencias se vuelve álgebra."
    libro: [262, 261]
    ec: 262
    fijar: { pz: 0.7 }
    sustitucion: "z^{−k}·X(z) ↔ x[n − k], con k = {{k}}"
    widget:
      tipo: grafica
      x: { id: x, min: 0, max: 10, unidad: "", rotulo: "n" }
      y: { min: 0, max: 1.2, unidad: "", rotulo: "" }
      curvas:
        - { expr: "pz^(floor(x) - k)*min(max((floor(x) - k + 1)*1000, 0), 1)", color: azul, rotulo: "x[n − k]" }
      mandos:
        - { valor: k, min: 0, max: 4, paso: 1, rotulo: "Potencia de z⁻¹, k" }

  - id: explore-polo
    tipo: explorar
    titulo: "Dentro o fuera del círculo"
    texto: "Muestreada, e^{st} se convierte en zⁿ. Mueva z por el eje real: dentro del círculo unidad, fuera, y en el borde."
    libro: [261, 264]
    widget:
      tipo: grafica
      x: { id: x, min: 0, max: 10, unidad: "", rotulo: "n" }
      y: { min: -3, max: 3, unidad: "", rotulo: "zⁿ" }
      curvas:
        - { expr: "zp^floor(x)", color: azul, rotulo: "zⁿ" }
      asas:
        - { mueve: zp, x: "1", y: "zp", rotulo: "Polo, z" }
      lectura: { valor: absz, rotulo: "Distancia al origen, |z|" }
      mandos:
        - { valor: zp, min: -1.3, max: 1.3, paso: 0.1, rotulo: "Polo, z" }
    requiere: { mover: [zp] }

  - id: reto-borde
    tipo: reto
    titulo: "Reto: en el borde"
    texto: "Lleve el polo justo a la circunferencia unidad: la secuencia no crece ni decae."
    libro: [264]
    inicio: { zp: 0.5 }
    widget:
      tipo: grafica
      x: { id: x, min: 0, max: 10, unidad: "", rotulo: "n" }
      y: { min: -3, max: 3, unidad: "", rotulo: "zⁿ" }
      curvas:
        - { expr: "zp^floor(x)", color: azul, rotulo: "zⁿ" }
      asas:
        - { mueve: zp, x: "1", y: "zp", rotulo: "Polo, z" }
      mandos:
        - { valor: zp, min: -1.3, max: 1.3, paso: 0.1, rotulo: "Polo, z" }
    condiciones:
      - { valor: absz, min: 0.999, max: 1.001, rotulo: "|z| = {{absz}}" }
    exito: "|z| = 1: es la imagen del eje imaginario de s, la frontera. Dentro decae (estable); fuera, crece."
    pistas:
      - { cuando: { valor: absz, max: 0.999 }, texto: "Dentro del círculo: la secuencia decae. Aleje el polo del origen." }
      - { texto: "Fuera del círculo: la secuencia crece. Acerque el polo al origen." }
    escalera:
      - "Dentro del círculo la secuencia decae; fuera, crece."
    solucion: "La circunferencia unidad corta el eje real en z = 1 y en z = −1."

  - id: por-que-circulo
    tipo: porque
    titulo: "¿Por qué el círculo unidad?"
    texto: "Un filtro digital es estable si todos sus polos están dentro del círculo unidad. ¿Por qué ese criterio?"
    libro: [264, 261]
    opciones:
      - texto: "z = e^{sT} lleva el semiplano izquierdo, el estable, al interior del círculo"
        bien: true
        porque: "Es el mismo criterio de Laplace, trasladado: el eje imaginario va a la circunferencia unidad."
      - texto: "Porque los filtros digitales tienen ganancia unidad"
        porque: "La ganancia no interviene. El criterio sale de cómo z = e^{sT} transforma el plano s."
      - texto: "Es un convenio de los diseñadores"
        porque: "No es un convenio: es la imagen del semiplano izquierdo estable al pasar al plano z."
    widget:
      tipo: grafica
      x: { id: x, min: 0, max: 10, unidad: "", rotulo: n }
      y: { min: -3, max: 3, unidad: "", rotulo: "zⁿ" }
      curvas:
        - { expr: "zp^floor(x)", color: azul, rotulo: "zⁿ" }
      asas:
        - { mueve: zp, x: "1", y: zp, rotulo: "Polo, z" }
      lectura: { valor: absz, rotulo: "Distancia al origen, |z|" }
      mandos:
        - { valor: zp, min: -1.3, max: 1.3, paso: 0.1, rotulo: "Polo, z" }
    escalera:
      - "¿Qué región del plano s es la estable, y adónde la lleva z = e^{sT}?"
    solucion: "z = e^{sT} lleva el semiplano izquierdo, el estable, al interior del círculo unidad."

  - id: diferencias
    tipo: pregunta
    titulo: "Para qué sirve"
    texto: "Con la transformada Z, una ecuación en diferencias, como las de un filtro digital, se convierte en…"
    libro: [263]
    opciones:
      - texto: "Álgebra, como Laplace con las diferenciales"
        bien: true
        porque: "z⁻¹ es un retardo de una muestra: cada término retrasado, como x[n − 1], pasa a ser una potencia de z⁻¹."
      - texto: "Una ecuación diferencial"
        porque: "Justo al revés: se trata de quitar la dificultad, y queda álgebra."
      - texto: "Una integral de convolución"
        porque: "La convolución es lo que la transformada convierte en producto, no en lo que convierte."
    fijar: { pz: 0.7 }
    widget:
      tipo: grafica
      x: { id: x, min: 0, max: 10, unidad: "", rotulo: n }
      y: { min: 0, max: 1.2, unidad: "", rotulo: "" }
      curvas:
        - { expr: "pz^floor(x)", color: tinta, rotulo: "x[n]", discontinua: true }
        - { expr: "pz^(floor(x) - k)*min(max((floor(x) - k + 1)*1000, 0), 1)", color: azul, rotulo: "z^{−k}·X(z)" }
      lectura: { valor: k, rotulo: "Muestras de retardo" }
      mandos:
        - { valor: k, min: 0, max: 4, paso: 1, rotulo: "Potencia de z⁻¹, k" }
    escalera:
      - "z⁻¹ es literalmente un retardo de una muestra."
    solucion: "Álgebra: cada término retrasado se vuelve un z⁻¹, como Laplace con las diferenciales."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [262, 263, 264]
    ideas:
      - { titulo: "Definición.", texto: "X(z) = Σ x[n]·z^{−n}, con z = e^{sT}: Laplace para señales muestreadas." }
      - { titulo: "Retardo.", texto: "z⁻¹ retrasa una muestra: las diferencias se vuelven álgebra." }
      - { titulo: "Estabilidad.", texto: "El eje imaginario va a la circunferencia unidad: polos dentro, filtro estable." }
