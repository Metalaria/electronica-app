# Lección 1.1 de la sección 0.15 «Series, Aproximaciones y Linealización» (cap00): una curva vista de cerca es su
# tangente (e^x ≈ 1 + x, sen x ≈ x, 1/(1 − x) ≈ 1 + x), hasta dónde valen (x ≤ 0,1), √1,02 con (1 + x)ⁿ ≈ 1 + n·x,
# la distorsión al crecer la señal y la pequeña señal. Formato: contenido/lecciones11/GUIA.md.
leccion: cap00/sec-0.14

libro:
  223: "para x pequeño, e^x ≈ 1 + x, sen(x) ≈ x (con x en radianes), (1 + x)^n ≈ 1 + n·x y 1/(1 − x) ≈ 1 + x"
  224: "al crecer la señal aparecen los términos cuadráticos y cúbicos de la serie, que son exactamente la distorsión armónica"
  225: "Linealizar significa quedarse con la recta tangente a una curva en el punto de trabajo"
  226: "El error relativo de tres de ellas, calculado"
  227: "para x ≤ 0,1 el error es del orden del 0,5 % o menos y la linealización es segura"
  "cap00#284": "Usando la aproximación (1 + x)ⁿ ≈ 1 + n·x, estima √(1,02) tomando n = 1/2"

modelo:
  valores:
    x0: { sim: "x", nombre: "desplazamiento x", unidad: "", valor: 0.2 }
    func: { sim: "función", nombre: "función: 1 exponencial, 2 seno, 3 inversa", unidad: "", valor: 1 }
    n: { sim: "n", nombre: "exponente n", unidad: "", valor: 0.5 }
    xx: { sim: "x", nombre: "x de la raíz", unidad: "", valor: 0.02 }
  calculos:
    s1: { expr: "max(0, 1 - abs(func - 1))", nombre: "es la exponencial", unidad: "" }
    s2: { expr: "max(0, 1 - abs(func - 2))", nombre: "es el seno", unidad: "" }
    s3: { expr: "max(0, 1 - abs(func - 3))", nombre: "es la inversa", unidad: "" }
    exacto: { expr: "s1*exp(x0) + s2*sin(x0) + s3/(1 - min(x0, 0.9))", sim: "exacto", nombre: "valor exacto", unidad: "", cifras: 5 }
    aprox: { expr: "s1*(1 + x0) + s2*x0 + s3*(1 + x0)", sim: "aproximado", nombre: "valor aproximado", unidad: "", cifras: 5 }
    err: { expr: "abs(exacto - aprox)/abs(exacto)*100", sim: "error", nombre: "error relativo de la aproximación", unidad: "%" }
    raiz: { expr: "1 + n*xx", sim: "√(1 + x)", nombre: "raíz aproximada", unidad: "", cifras: 4 }
    raiz_ex: { expr: "(1 + xx)^n", sim: "√(1 + x)", nombre: "raíz exacta", unidad: "", cifras: 6 }

tarjetas:
  - id: explore-tangente
    tipo: explorar
    titulo: "Vista de cerca, una recta"
    texto: "La exponencial e^{x} y su tangente en 0, 1 + x. Aleje el punto de 0 y mire cómo crece el error relativo."
    libro: [223, 225]
    fijar: { func: 1 }
    widget:
      tipo: grafica
      x: { id: x, min: 0, max: 0.5, unidad: "", rotulo: "x" }
      y: { min: 0.9, max: 1.7, unidad: "", rotulo: "" }
      curvas:
        - { expr: "exp(x)", color: azul, rotulo: "e^{x}" }
        - { expr: "1 + x", color: naranja, rotulo: "1 + x" }
      asas:
        - { mueve: x0, x: "x0", y: "exacto", rotulo: "Desplazamiento x" }
      lectura: { valor: err, rotulo: "Error relativo" }
      mandos:
        - { valor: x0, min: 0.01, max: 0.5, paso: 0.01, rotulo: "Desplazamiento, x" }
    requiere: { mover: [x0] }

  - id: prediga-seno
    tipo: predecir
    titulo: "Prediga"
    texto: "sen x ≈ x, con x en radianes. Con x = 0,10, ¿qué error relativo comete?"
    libro: [226]
    fijar: { func: 2, x0: 0.1 }
    widget:
      tipo: grafica
      x: { id: x, min: 0, max: 0.5, unidad: "", rotulo: "x" }
      y: { min: 0, max: 0.6, unidad: "", rotulo: "" }
      curvas:
        - { expr: "sin(x)", color: azul, rotulo: "sen x" }
        - { expr: "x", color: naranja, rotulo: "x" }
      lectura: { valor: err, rotulo: "Error relativo" }
      ocultar: true
    opciones:
      - texto: "0,167 %"
        bien: true
        porque: "Es la más fiel de las tres: con x = 0,10, un 0,167 %."
      - texto: "1,000 %"
        porque: "Ese es el error de 1/(1 − x) ≈ 1 + x con x = 0,10: la menos fiel de las tres."
      - texto: "1,516 %"
        porque: "Ese es el error de sen x ≈ x con x = 0,30, tres veces más lejos."
    comprobar:
      - { err: 0.167 }
      - { con: { func: 3 }, err: 1.0 }
      - { con: { x0: 0.3 }, err: 1.516 }

  - id: reto-pequena
    tipo: reto
    titulo: "Reto: ¿cuánto es «pequeño»?"
    texto: "Aleje x todo lo que pueda sin que e^{x} ≈ 1 + x se equivoque más de un 0,5 %."
    libro: [227, 226]
    fijar: { func: 1 }
    inicio: { x0: 0.01 }
    widget:
      tipo: grafica
      x: { id: x, min: 0, max: 0.5, unidad: "", rotulo: "x" }
      y: { min: 0.9, max: 1.7, unidad: "", rotulo: "" }
      curvas:
        - { expr: "exp(x)", color: azul, rotulo: "e^{x}" }
        - { expr: "1 + x", color: naranja, rotulo: "1 + x" }
      asas:
        - { mueve: x0, x: "x0", y: "exacto", rotulo: "Desplazamiento x" }
      mandos:
        - { valor: x0, min: 0.01, max: 0.5, paso: 0.01, rotulo: "Desplazamiento, x" }
    condiciones:
      - { valor: err, max: 0.5, rotulo: "Error: {{err}}" }
      - { valor: x0, min: 0.1, rotulo: "x = {{x0}}" }
    exito: "x = 0,10: un 0,468 %. Para x ≤ 0,1 la linealización es segura; a partir de 0,3 deja de serlo."
    pistas:
      - { cuando: { valor: err, min: 0.5 }, texto: "Se ha alejado demasiado: el error pasa del 0,5 %." }
      - { texto: "Aún puede alejarse más sin pasar del 0,5 %." }
    ayuda: "El libro da el error de e^{x} ≈ 1 + x en x = 0,10: menos del 0,5 %."
    comprobar:
      - { con: { x0: 0.1 }, err: 0.468, tol: 0.003 }

  - id: estime-raiz
    tipo: pregunta
    fase: "Estime"
    titulo: "Una raíz sin calculadora"
    texto: "Estime √(1,02) con (1 + x)ⁿ ≈ 1 + n·x, tomando n = 1/2."
    libro: ["cap00#284", 223]
    fijar: { n: 0.5, xx: 0.02 }
    estimar:
      objetivo: "raiz"
      unidad: ""
      min: 1
      max: 1.05
      paso: 0.001
      inicio: 1.02
      tol: 0.001
      cifras: 4
      rotulo: "√(1,02)"
    exito: "1 + (1/2)·0,02 = 1,01. El valor exacto es 1,00995: la aproximación es excelente."
    pistas:
      - { cuando: { valor: estimacion, menor: 1.00899 }, texto: "Se ha quedado corto: sume a 1 la mitad de 0,02." }
      - { texto: "Se ha pasado: n = 1/2, así que solo se suma la mitad de 0,02." }
    comprobar:
      - { raiz: 1.01, raiz_ex: 1.00995, tol: 0.00001 }

  - id: distorsion
    tipo: sorpresa
    titulo: "Cuando la señal crece"
    texto: "sen x y su tangente x. Haga crecer la excursión x y mire dónde se separan."
    nota: "Mientras la excursión es pequeña, la salida es fiel. Al crecer aparecen los términos cuadráticos y cúbicos: la distorsión armónica."
    libro: [224]
    fijar: { func: 2 }
    inicio: { x0: 0.1 }
    widget:
      tipo: grafica
      x: { id: x, min: 0, max: 1.6, unidad: "", rotulo: "x" }
      y: { min: 0, max: 1.7, unidad: "", rotulo: "" }
      curvas:
        - { expr: "sin(x)", color: azul, rotulo: "sen x" }
        - { expr: "x", color: naranja, rotulo: "tangente, x" }
      asas:
        - { mueve: x0, x: "x0", y: "exacto", rotulo: "Excursión x" }
      lectura: { valor: err, rotulo: "Error relativo" }
      mandos:
        - { valor: x0, min: 0.05, max: 1.5, paso: 0.05, rotulo: "Excursión, x" }
    requiere: { mover: [x0] }

  - id: por-que-pequena
    tipo: porque
    titulo: "¿Por qué solo con señal pequeña?"
    texto: "Un diodo o un transistor se tratan como lineales alrededor de su punto de trabajo, pero solo con señales pequeñas. ¿Por qué?"
    libro: [225, 224]
    opciones:
      - texto: "Con poca excursión, su curva se confunde con su tangente"
        bien: true
        porque: "La pendiente local es su resistencia dinámica. Todo el análisis de pequeña señal consiste en esa sustitución."
      - texto: "Porque con señales grandes se calientan"
        porque: "El límite no es térmico: con excursión grande, la curva se separa de la tangente y aparece distorsión."
      - texto: "Porque son lineales por naturaleza"
        porque: "Son marcadamente no lineales. Solo de cerca, alrededor de un punto, se confunden con una recta."

  - id: aproximaciones
    tipo: pregunta
    fase: "Empareje"
    titulo: "Las aproximaciones de siempre"
    texto: "Una cada función, para x pequeño, con su aproximación lineal."
    libro: [223]
    emparejar:
      - ["e^{x}", "1 + x"]
      - ["sen x", "x, con x en radianes"]
      - ["(1 + x)ⁿ", "1 + n·x"]
    exito: "Eso es: el valor en el punto más la pendiente por el desplazamiento."
    pistas:
      - { texto: "Todas son el primer término lineal de su serie de Taylor." }

  - id: base-bipolar
    tipo: pregunta
    titulo: "Pequeña, en milivoltios"
    texto: "En un transistor bipolar, x es v_{be}/V_{T}. ¿Qué señal en la base cumple x ≤ 0,1?"
    libro: [227]
    opciones:
      - texto: "Unos 2,6 mV"
        bien: true
        porque: "x ≤ 0,1 significa unos 2,6 mV: es el contenido numérico de la palabra «pequeña»."
      - texto: "Cualquiera por debajo de un voltio"
        porque: "Mucho menos: x ≤ 0,1 se queda en unos pocos milivoltios."
      - texto: "Ninguna: el bipolar nunca es lineal"
        porque: "No lo es en grande, pero alrededor del punto de trabajo, con unos 2,6 mV, sí se puede linealizar."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [223, 225, 227, 224]
    ideas:
      - { titulo: "Taylor.", texto: "Cerca de un punto: el valor más la pendiente por el desplazamiento." }
      - { titulo: "Las de siempre.", texto: "e^{x} ≈ 1 + x, sen x ≈ x, (1 + x)ⁿ ≈ 1 + n·x, 1/(1 − x) ≈ 1 + x." }
      - { titulo: "Hasta dónde.", texto: "Para x ≤ 0,1, un 0,5 % o menos; desde 0,3, ya no." }
      - { titulo: "Pequeña señal.", texto: "Cada componente, sustituido por su pendiente; al crecer la señal, distorsión." }
