# Lección 1.1 de la sección 0.5 «Números Complejos y Fasores» (cap00): el complejo como punto del plano (binómica y
# polar), Euler, multiplicar es multiplicar módulos y sumar ángulos (por j, girar 90°), el fasor y dónde falla el
# método. Formato: contenido/lecciones11/GUIA.md.
leccion: cap00/sec-0.5

libro:
  65: "usando la unidad imaginaria j"
  67: "la forma binómica z = a + b·j y la forma polar z = r∠θ"
  68: '"e"^(j θ) = op("cos") θ + j dot.op op("sen") θ'
  69: "puede representarse por un único número complejo llamado fasor"
  71: "multiplicar por j es girar 90°"
  72: "Sumar y restar, en binómica; multiplicar y dividir, en polar"
  73: "derivar es multiplicar por jω, e integrar, dividir por jω"
  74: "la parte real del resultado es la respuesta física"
  75: "Solo en régimen senoidal permanente y en circuitos lineales"
  "cap00#284": "Pasa el número complejo z = 3 + 4j a su forma polar"

modelo:
  valores:
    a: { sim: "a", nombre: "parte real", unidad: "", valor: 3 }
    b: { sim: "b", nombre: "parte imaginaria", unidad: "", valor: 4 }
    k: { sim: "veces por j", nombre: "veces que se multiplica por j", unidad: "" , valor: 0 }
    phi_w: { sim: "ángulo de w", nombre: "ángulo del segundo factor", unidad: "°", valor: 0 }
  calculos:
    r: { expr: "sqrt(a^2 + b^2)", sim: "r", nombre: "módulo", unidad: "" }
    theta: { expr: "atan2(b, a)*180/pi", sim: "θ", nombre: "ángulo", unidad: "°" }
    suma: { expr: "a + b", nombre: "suma de las partes", unidad: "" }
    r2: { expr: "a^2 + b^2", nombre: "módulo al cuadrado", unidad: "" }
    # z multiplied k times by j (each time a quarter turn)
    ap: { expr: "r*cos((theta + 90*k)*pi/180)", sim: "parte real", nombre: "parte real del producto", unidad: "" }
    bp: { expr: "r*sin((theta + 90*k)*pi/180)", sim: "parte imaginaria", nombre: "parte imaginaria del producto", unidad: "" }
    theta_p: { expr: "atan2(bp, ap)*180/pi", sim: "θ", nombre: "ángulo del producto", unidad: "°" }
    # z times w, w of modulus √5 and angle phi_w (the book's 1 − 2j has −63,4°)
    r_w: { expr: "sqrt(5)", sim: "|w|", nombre: "módulo del segundo factor", unidad: "" }
    r_m: { expr: "r*r_w", sim: "r", nombre: "módulo del producto z·w", unidad: "" }
    th_m: { expr: "theta + phi_w", sim: "θ", nombre: "ángulo del producto z·w", unidad: "°" }
    am: { expr: "r_m*cos(th_m*pi/180)", nombre: "parte real de z·w", unidad: "" }
    bm: { expr: "r_m*sin(th_m*pi/180)", nombre: "parte imaginaria de z·w", unidad: "" }

tarjetas:
  - id: explore-plano
    tipo: explorar
    titulo: "Un complejo es un punto"
    texto: "z = a + b·j. Mueva la parte real y la imaginaria: el módulo r es la distancia al origen, y θ, el ángulo."
    libro: [65, 67]
    widget:
      tipo: grafica
      x: { id: x, min: -10.4, max: 10.4, unidad: "", rotulo: "parte real" }
      y: { min: -6, max: 6, unidad: "", rotulo: "parte imaginaria" }
      curvas:
        - { expr: "b/a*x", color: azul, rotulo: "recta del ángulo θ" }
        - { expr: "sqrt(max(r^2 - x^2, 0))", color: tinta, rotulo: "módulo r", discontinua: true }
        - { expr: "-sqrt(max(r^2 - x^2, 0))", color: tinta, rotulo: "módulo r (abajo)", discontinua: true }
      asas:
        - { mueve: b, x: "a", y: "b", rotulo: "z: parte imaginaria" }
        - { mueve: a, x: "a", y: "0", rotulo: "Parte real" }
      lectura: { valor: r, rotulo: "Módulo, r" }
      datos:
        - { valor: theta, rotulo: "θ = {{theta}}" }
      mandos:
        - { valor: a, min: 0.5, max: 6, paso: 0.5, rotulo: "Parte real, a" }
        - { valor: b, min: -6, max: 6, paso: 0.5, rotulo: "Parte imaginaria, b" }
    requiere: { mover: [a, b] }

  - id: prediga-modulo
    tipo: predecir
    titulo: "Prediga"
    texto: "z = 3 + 4j. ¿Cuánto mide su módulo?"
    libro: [72, 67]
    fijar: { a: 3, b: 4 }
    widget:
      tipo: grafica
      x: { id: x, min: -10.4, max: 10.4, unidad: "", rotulo: "parte real" }
      y: { min: -6, max: 6, unidad: "", rotulo: "parte imaginaria" }
      curvas:
        - { expr: "b/a*x", color: azul, rotulo: "recta del ángulo θ" }
        - { expr: "sqrt(max(r^2 - x^2, 0))", color: tinta, rotulo: "módulo r", discontinua: true }
      lectura: { valor: r, rotulo: "Módulo, r" }
      ocultar: true
    opciones:
      - texto: "5"
        bien: true
        porque: "r = √(3² + 4²) = √(9 + 16) = √25 = 5."
      - texto: "7"
        porque: "Ha sumado las partes. El módulo es √(a² + b²), la hipotenusa, no a + b."
      - texto: "25"
        porque: "Eso es r²: falta sacar la raíz."
    escalera:
      - "El módulo es la hipotenusa del triángulo de catetos a y b."
    solucion: "r = √(3² + 4²) = √25 = 5."
    comprobar:
      - { r: 5, suma: 7, r2: 25 }

  - id: regla-euler
    tipo: formula
    titulo: "Binómica y polar"
    texto: "La fórmula de Euler une las dos formas: z = r·e^{jθ}, con r = √(a² + b²) y θ = arctan(b/a) si a > 0."
    libro: [68, 67]
    ec: 68
    sustitucion: "r = √({{a}}² + {{b}}²) = {{r}};  θ = arctan({{b}} / {{a}}) = {{theta}}"
    widget:
      tipo: grafica
      x: { id: x, min: -10.4, max: 10.4, unidad: "", rotulo: "parte real" }
      y: { min: -6, max: 6, unidad: "", rotulo: "parte imaginaria" }
      curvas:
        - { expr: "b/a*x", color: azul, rotulo: "recta del ángulo θ" }
        - { expr: "sqrt(max(r^2 - x^2, 0))", color: tinta, rotulo: "módulo r", discontinua: true }
        - { expr: "-sqrt(max(r^2 - x^2, 0))", color: tinta, rotulo: "módulo r (abajo)", discontinua: true }
      asas:
        - { mueve: b, x: "a", y: "b", rotulo: "z: parte imaginaria" }
      mandos:
        - { valor: b, min: -6, max: 6, paso: 0.5, rotulo: "Parte imaginaria, b" }

  - id: estime-angulo
    tipo: pregunta
    fase: "Estime"
    titulo: "El ángulo de 3 + 4j"
    texto: "Pase z = 3 + 4j a forma polar. El módulo es 5; estime el ángulo θ."
    libro: ["cap00#284", 72]
    fijar: { a: 3, b: 4 }
    estimar:
      objetivo: "theta"
      unidad: "°"
      min: 0
      max: 90
      paso: 1
      inicio: 30
      tol: 0.02
      rotulo: "θ"
    exito: "arctan(4/3) = 53,13°: z = 5∠53,13°."
    pistas:
      - { cuando: { valor: estimacion, menor: 52 }, texto: "Se ha quedado corto: b es mayor que a, así que θ pasa de 45°." }
      - { texto: "Se ha pasado: b no llega al doble de a, θ queda lejos de 90°." }
    escalera:
      - "El ángulo es el arco cuya tangente es b/a."
    solucion: "arctan(4/3) = 53,13°: z = 5∠53,13°."
    comprobar:
      - { theta: 53.13 }
      - { con: { b: 3 }, theta: 45 }

  - id: explore-giro
    tipo: explorar
    titulo: "Multiplicar por j"
    texto: "Multiplique z = 3 + 4j por j una vez, dos, tres. Fíjese en el ángulo y en el módulo."
    nota: "El producto multiplica módulos y suma ángulos: j tiene módulo 1 y ángulo 90°."
    libro: [71]
    fijar: { a: 3, b: 4 }
    widget:
      tipo: grafica
      x: { id: x, min: -10.4, max: 10.4, unidad: "", rotulo: "parte real" }
      y: { min: -6, max: 6, unidad: "", rotulo: "parte imaginaria" }
      curvas:
        - { expr: "sqrt(max(r^2 - x^2, 0))", color: tinta, rotulo: "módulo r", discontinua: true }
        - { expr: "-sqrt(max(r^2 - x^2, 0))", color: tinta, rotulo: "módulo r (abajo)", discontinua: true }
      asas:
        - { mueve: k, x: "ap", y: "bp", rotulo: "z por j" }
      lectura: { valor: theta_p, rotulo: "Ángulo" }
      datos:
        - { valor: r, rotulo: "Módulo: {{r}}" }
      mandos:
        - { valor: k, min: 0, max: 4, paso: 1, rotulo: "Veces por j" }
    requiere: { mover: [k] }

  - id: prediga-j2
    tipo: predecir
    titulo: "Prediga"
    texto: "Multiplique 3 + 4j por j dos veces. ¿Dónde acaba?"
    libro: [71, 65]
    fijar: { a: 3, b: 4, k: 2 }
    widget:
      tipo: grafica
      x: { id: x, min: -10.4, max: 10.4, unidad: "", rotulo: "parte real" }
      y: { min: -6, max: 6, unidad: "", rotulo: "parte imaginaria" }
      curvas:
        - { expr: "sqrt(max(r^2 - x^2, 0))", color: tinta, rotulo: "módulo r", discontinua: true }
        - { expr: "-sqrt(max(r^2 - x^2, 0))", color: tinta, rotulo: "módulo r (abajo)", discontinua: true }
      lectura: { valor: theta_p, rotulo: "Ángulo" }
      ocultar: true
    opciones:
      - texto: "En −3 − 4j"
        bien: true
        porque: "Girar 90° dos veces es invertir el signo. Por eso j² = −1."
      - texto: "En 3 − 4j"
        porque: "Ese es el conjugado: refleja z en el eje real, no lo gira."
      - texto: "En −4 + 3j"
        porque: "Eso es multiplicar una sola vez por j: un giro de 90°."
    escalera:
      - "Cada producto por j gira el punto 90° alrededor del origen."
    solucion: "Dos giros de 90° invierten el signo: −3 − 4j. Por eso j² = −1."
    comprobar:
      - { ap: -3, bp: -4 }
      - { con: { k: 1 }, ap: -4, bp: 3 }

  - id: reto-producto
    tipo: reto
    titulo: "Reto: el producto en −10,3°"
    texto: "Multiplique z = 3 + 4j por un w de módulo √5. Elija el ángulo de w para que el producto quede en −10,3°."
    libro: [72]
    fijar: { a: 3, b: 4 }
    inicio: { phi_w: 0 }
    widget:
      tipo: grafica
      x: { id: x, min: -20.7, max: 20.7, unidad: "", rotulo: "parte real" }
      y: { min: -12, max: 12, unidad: "", rotulo: "parte imaginaria" }
      curvas:
        - { expr: "sqrt(max(r_m^2 - x^2, 0))", color: tinta, rotulo: "módulo del producto", discontinua: true }
        - { expr: "-sqrt(max(r_m^2 - x^2, 0))", color: tinta, rotulo: "módulo del producto (abajo)", discontinua: true }
        - { expr: "b/a*x", color: azul, rotulo: "recta de z" }
      asas:
        - { mueve: phi_w, x: "am", y: "bm", rotulo: "z·w: ángulo de w" }
      datos:
        - { valor: r_m, rotulo: "Módulo de z·w: {{r_m}}" }
      mandos:
        - { valor: phi_w, min: -90, max: 0, paso: 0.1, rotulo: "Ángulo de w" }
    condiciones:
      - { valor: th_m, objetivo: -10.3, tol: 0.02, rotulo: "Ángulo de z·w: {{th_m}}" }
    exito: "−63,4°: w es 1 − 2j. Los ángulos se suman (53,1° − 63,4° = −10,3°) y los módulos se multiplican: 11,2."
    pistas:
      - { cuando: { valor: th_m, mayor: -10.09 }, texto: "El producto aún gira poco: haga más negativo el ángulo de w." }
      - { cuando: { valor: th_m, menor: -10.5 }, texto: "Ha girado de más: acerque a cero el ángulo de w." }
    escalera:
      - "Al multiplicar complejos, los módulos se multiplican y los ángulos se suman."
    solucion: "53,1° + ángulo de w = −10,3°: el ángulo de w es −63,4°."
    comprobar:
      - { con: { phi_w: -63.4 }, th_m: -10.27, r_m: 11.18, tol: 0.003 }

  - id: por-que-complejos
    tipo: porque
    titulo: "¿Por qué sirven en alterna?"
    texto: "En alterna, cada magnitud tiene amplitud y fase. ¿Por qué los complejos encajan tan bien?"
    libro: [71, 69, 74]
    opciones:
      - texto: "Un desfase es un giro, y el producto de complejos suma ángulos"
        bien: true
        porque: "Un complejo es un par con suma y producto: el producto multiplica módulos y suma ángulos, justo lo que hace un desfase."
      - texto: "Porque las tensiones de alterna son imaginarias"
        porque: "No: la respuesta física es la parte real del resultado. El complejo lleva amplitud y fase a la vez."
      - texto: "Porque j no se confunde con la corriente"
        porque: "Eso explica que se escriba j en vez de i, no por qué sirven los complejos."
    widget:
      tipo: figura
      figura: fig-0.6
      zonas:
        - { id: producto, rotulo: "El producto de dos complejos", rect: [0, 0, 440, 209] }
    escalera:
      - "¿Qué le hace un desfase a un fasor en el plano?"
    solucion: "Un desfase es un giro, y el producto de complejos suma ángulos y multiplica módulos."

  - id: cada-operacion
    tipo: pregunta
    fase: "Empareje"
    titulo: "Cada operación, su forma"
    texto: "Una cada operación con cómo se hace con complejos y fasores."
    libro: [72, 73]
    emparejar:
      - ["Sumar y restar", "En binómica, componente a componente"]
      - ["Multiplicar y dividir", "En polar: módulos y ángulos"]
      - ["Derivar una senoide", "Multiplicar su fasor por jω"]
      - ["Integrar una senoide", "Dividir su fasor por jω"]
    exito: "Eso es: con fasores, las ecuaciones diferenciales del circuito se vuelven algebraicas."
    pistas:
      - { texto: "Derivar adelanta 90° y multiplica por ω: es multiplicar por jω." }
    escalera:
      - "Sumar y restar, en binómica; multiplicar y dividir, en polar."
    solucion: "Sumar y restar: en binómica, componente a componente. Multiplicar y dividir: en polar: módulos y ángulos. Derivar una senoide: multiplicar su fasor por jω. Integrar una senoide: dividir su fasor por jω."

  - id: donde-falla
    tipo: pregunta
    titulo: "Dónde falla el método"
    texto: "¿En cuál de estos casos no sirve el análisis con fasores?"
    libro: [75]
    opciones:
      - texto: "Un transitorio, o un circuito con un diodo"
        bien: true
        porque: "Solo vale en régimen senoidal permanente y en circuitos lineales. Para el transitorio está Laplace."
      - texto: "Un filtro RC con una senoide de frecuencia fija"
        porque: "Es lineal y en régimen senoidal permanente: justo donde los fasores funcionan."
      - texto: "Dos señales de la misma frecuencia con distinta fase"
        porque: "Ese es su terreno: cada una es un fasor con su módulo y su ángulo."
    widget:
      tipo: figura
      figura: fig-0.5
      zonas:
        - { id: plano, rotulo: "Un complejo en el plano", rect: [0, 0, 363, 201] }
    escalera:
      - "Un fasor solo describe una senoide de frecuencia fija que ya se ha asentado."
    solucion: "Un transitorio o un circuito con un diodo: no son régimen senoidal permanente lineal."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [67, 71, 72, 73]
    ideas:
      - { titulo: "Dos formas.", texto: "z = a + b·j = r∠θ: 3 + 4j tiene módulo 5 y ángulo 53,1°." }
      - { titulo: "El producto.", texto: "Multiplica módulos y suma ángulos. Por j, girar 90°; j² = −1." }
      - { titulo: "Regla práctica.", texto: "Sumar y restar en binómica; multiplicar y dividir en polar." }
      - { titulo: "El fasor.", texto: "Una senoide es Vₚ∠φ; derivar es multiplicar por jω." }
