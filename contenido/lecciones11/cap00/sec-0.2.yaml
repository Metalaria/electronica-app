# Lección 1.1 de la sección 0.2 «Álgebra Esencial» (cap00): la ley de Ohm despejada de tres maneras, despejar paso a
# paso, la proporcionalidad cuadrática, el sistema de dos mallas como dos rectas que se cortan, comprobar y la trampa de
# las magnitudes que dependen entre sí. Formato: contenido/lecciones11/GUIA.md.
leccion: cap00/sec-0.2

libro:
  13: "La ley de Ohm, V = I · R, puede reordenarse"
  14: 'I = (V)/(R)'
  19: "exige tres pasos"
  20: "no basta con «doblar R₂»"
  21: "Dos mallas con una fuente de 12 V"
  22: '"10" dot.op I_("1") - "6" dot.op I_("2") = "12"'
  23: '- "6" dot.op I_("1") + "9" dot.op I_("2") = "0"'
  24: "I₁ = 2 A e I₂ = 1,333 A"
  25: "Sustituir el resultado en las ecuaciones originales"
  26: "doblar la corriente no dobla la potencia, la cuadruplica"
  28: "la corriente real que la atraviesa es la diferencia de las dos corrientes de malla"
  "cap01#83": "Con 12 V, 10 kΩ y 5 kΩ, la salida es 4,00 V"

modelo:
  valores:
    V: { sim: "V", nombre: "tensión", unidad: V, valor: 6 }
    R: { sim: "R", nombre: "resistencia", unidad: Ω, valor: 3 }
    I_p: { sim: "I", nombre: "corriente por la resistencia", unidad: A, valor: 1 }
    V_f: { sim: "V", nombre: "tensión de la fuente de las mallas", unidad: V, valor: 12 }
    R_a: { sim: "R_{a}", nombre: "resistencia de la primera malla", unidad: Ω, valor: 4 }
    R_b: { sim: "R_{b}", nombre: "resistencia compartida", unidad: Ω, valor: 6 }
    R_c: { sim: "R_{c}", nombre: "resistencia de la segunda malla", unidad: Ω, valor: 3 }
    V_d: { sim: "V_{entrada}", nombre: "tensión del divisor", unidad: V, valor: 12 }
    R_1: { sim: "R₁", nombre: "resistencia de arriba del divisor", unidad: Ω, valor: 10000 }
    R_2: { sim: "R₂", nombre: "resistencia de abajo del divisor", unidad: Ω, valor: 5000 }
  calculos:
    I: { expr: "V/R", sim: "I", nombre: "corriente", unidad: A }
    R_calc: { expr: "V/I", sim: "V/I", nombre: "tensión entre corriente", unidad: Ω }
    P: { expr: "R*I_p^2", sim: "P", nombre: "potencia", unidad: W }
    veces: { expr: "R*(2*I_p)^2/(R*I_p^2)", sim: "P", nombre: "veces que crece la potencia", unidad: "veces", cifras: 2 }
    # the two mesh equations solved (Cramer); the shared resistor carries the difference
    det: { expr: "(R_a + R_b)*(R_b + R_c) - R_b^2", nombre: "determinante", unidad: "" }
    I1: { expr: "V_f*(R_b + R_c)/det", sim: "I₁", nombre: "corriente de la malla 1", unidad: A }
    I2: { expr: "I1*R_b/(R_b + R_c)", sim: "I₂", nombre: "corriente de la malla 2", unidad: A }
    I_comp: { expr: "I1 - I2", sim: "I₁ − I₂", nombre: "corriente por la resistencia compartida", unidad: A }
    P_f: { expr: "V_f*I1", sim: "P", nombre: "potencia que entrega la fuente", unidad: W }
    V_s: { expr: "V_d*R_2/(R_1 + R_2)", sim: "V_{salida}", nombre: "salida del divisor", unidad: V }

tarjetas:
  - id: explore-ohm
    tipo: explorar
    titulo: "Una ley, tres formas"
    texto: "V = I · R. Mueva la tensión y la resistencia. La corriente es V/R, y V/I devuelve siempre la misma R."
    libro: [13, 14]
    widget:
      tipo: grafica
      x: { id: v, min: 0, max: 12, unidad: V, rotulo: "V" }
      y: { min: 0, max: 12, unidad: A, rotulo: "I" }
      curvas:
        - { expr: "v/R", color: azul, rotulo: "I = V/R" }
      asas:
        - { mueve: V, x: "V", y: "I", rotulo: "Punto de trabajo: tensión" }
      lectura: { valor: I, rotulo: "Corriente" }
      datos:
        - { valor: R_calc, rotulo: "V/I = {{R_calc}}" }
      mandos:
        - { valor: V, min: 1, max: 12, paso: 0.5, rotulo: "Tensión, V" }
        - { valor: R, min: 1, max: 12, paso: 1, rotulo: "Resistencia, R" }
    requiere: { mover: [V, R] }

  - id: prediga-potencia
    tipo: predecir
    titulo: "Prediga"
    texto: "Por una resistencia fija, la corriente se dobla. ¿Qué le pasa a la potencia, P = I^{2}·R?"
    libro: [26]
    fijar: { I_p: 1, R: 3 }
    widget:
      tipo: grafica
      x: { id: i, min: 0, max: 2, unidad: A, rotulo: "I" }
      y: { min: 0, max: 12, unidad: W, rotulo: "P" }
      curvas:
        - { expr: "R*i^2", color: naranja, rotulo: "P = I²·R" }
      lectura: { valor: veces, rotulo: "La potencia crece" }
      ocultar: true
    opciones:
      - texto: "Se cuadruplica"
        bien: true
        porque: "La relación es cuadrática: (2·I)^{2} = 4·I^{2}. Doblar la corriente no dobla la potencia, la cuadruplica."
      - texto: "Se dobla"
        porque: "Eso pasaría si fuera proporcional, como V = I·R a R fija. P depende del cuadrado de I."
      - texto: "No cambia, porque R es la misma"
        porque: "R fija no deja fija la potencia: P = I^{2}·R crece con el cuadrado de la corriente."
    comprobar:
      - { veces: 4 }

  - id: regla-ohm
    tipo: formula
    titulo: "Despejar es aislar"
    texto: "Lo que se hace a un lado de la igualdad se hace al otro. Para hallar I se divide por R; para hallar R, por I."
    libro: [14, 19]
    ec: 14
    sustitucion: "I = {{V}} / {{R}} = {{I}};  R = {{V}} / {{I}} = {{R_calc}}"
    widget:
      tipo: grafica
      x: { id: v, min: 0, max: 12, unidad: V, rotulo: "V" }
      y: { min: 0, max: 12, unidad: A, rotulo: "I" }
      curvas:
        - { expr: "v/R", color: azul, rotulo: "I = V/R" }
      mandos:
        - { valor: V, min: 1, max: 12, paso: 0.5, rotulo: "Tensión, V" }

  - id: ordene-despeje
    tipo: pregunta
    fase: "Ordene"
    titulo: "Despejar C en tres pasos"
    texto: "Ordene los pasos para despejar C de f = 1/(2π√(LC))."
    libro: [19]
    ordenar:
      - "Elevar al cuadrado: f^{2} = 1/(4π^{2}LC)"
      - "Invertir: 1/f^{2} = 4π^{2}LC"
      - "Dividir: C = 1/(4π^{2}f^{2}L)"
    exito: "Eso es. Cada paso es reversible: se comprueba volviendo atrás con el resultado."
    pistas:
      - { texto: "Primero hay que librarse de la raíz; lo último es dejar C sola." }

  - id: despeje-v
    tipo: pregunta
    titulo: "De la potencia a la tensión"
    texto: "P = V^{2}/R. Busca V. ¿Qué queda?"
    libro: [19]
    opciones:
      - texto: "V = √(P·R)"
        bien: true
        porque: "Se multiplica por R los dos lados (V^{2} = P·R) y se saca la raíz."
      - texto: "V = √(P/R)"
        porque: "R divide a V^{2}: para quitarla se multiplica por R, no se divide."
      - texto: "V = P·R^{2}"
        porque: "Falta deshacer el cuadrado de V: tras multiplicar por R hay que sacar la raíz."

  - id: explore-mallas
    tipo: explorar
    titulo: "Dos mallas, dos rectas"
    texto: "10·I₁ − 6·I₂ = 12 y −6·I₁ + 9·I₂ = 0. Cada ecuación es una recta. Mueva la fuente: la solución está donde se cortan."
    libro: [21, 22, 23]
    widget:
      tipo: grafica
      x: { id: a, min: 0, max: 4, unidad: A, rotulo: "I₁" }
      y: { min: -2, max: 4, unidad: A, rotulo: "I₂" }
      curvas:
        - { expr: "((R_a + R_b)*a - V_f)/R_b", color: azul, rotulo: "malla 1" }
        - { expr: "R_b*a/(R_b + R_c)", color: naranja, rotulo: "malla 2" }
      asas:
        - { mueve: V_f, x: "I1", y: "I2", rotulo: "Solución: fuente" }
      lectura: { valor: I1, rotulo: "Corriente de malla I₁" }
      datos:
        - { valor: I2, rotulo: "I₂ = {{I2}}" }
      mandos:
        - { valor: V_f, min: 0, max: 24, paso: 0.5, rotulo: "Fuente, V" }
    requiere: { mover: [V_f] }

  - id: reto-compartida
    tipo: reto
    titulo: "Reto: 0,667 A por la compartida"
    texto: "Por la resistencia compartida circula la diferencia, I₁ − I₂. Ajuste la fuente hasta que sea 0,667 A."
    libro: [24, 28]
    inicio: { V_f: 6 }
    widget:
      tipo: grafica
      x: { id: a, min: 0, max: 4, unidad: A, rotulo: "I₁" }
      y: { min: -2, max: 4, unidad: A, rotulo: "I₂" }
      curvas:
        - { expr: "((R_a + R_b)*a - V_f)/R_b", color: azul, rotulo: "malla 1" }
        - { expr: "R_b*a/(R_b + R_c)", color: naranja, rotulo: "malla 2" }
      asas:
        - { mueve: V_f, x: "I1", y: "I2", rotulo: "Solución: fuente" }
      datos:
        - { valor: I1, rotulo: "I₁ = {{I1}}" }
        - { valor: I2, rotulo: "I₂ = {{I2}}" }
      mandos:
        - { valor: V_f, min: 0, max: 24, paso: 0.5, rotulo: "Fuente, V" }
    condiciones:
      - { valor: I_comp, objetivo: 0.667, tol: 0.02, rotulo: "I₁ − I₂: {{I_comp}}" }
    exito: "Con 12 V: I₁ = 2 A, I₂ = 1,333 A, y la diferencia, 0,667 A. Es lo que mediría el Brymen."
    pistas:
      - { cuando: { valor: I_comp, menor: 0.654 }, texto: "Falta corriente: suba la fuente." }
      - { cuando: { valor: I_comp, mayor: 0.68 }, texto: "Sobra corriente: baje la fuente." }
    ayuda: "El libro resuelve el circuito con una fuente de 12 V."
    comprobar:
      - { con: { V_f: 12 }, I1: 2, I2: 1.333, I_comp: 0.667, tol: 0.001 }

  - id: doblar-r2
    tipo: sorpresa
    titulo: "Doblar R₂ no dobla la salida"
    texto: "Divisor de 12 V con R₁ = 10 kΩ y R₂ = 5 kΩ: 4,00 V. Doble R₂ y mire la salida."
    nota: "No se dobla: R₂ está también en el denominador. Hay que despejarla."
    libro: [20, "cap01#83"]
    fijar: { V_d: 12, R_1: 10000 }
    inicio: { R_2: 5000 }
    widget:
      tipo: grafica
      x: { id: r, min: 0, max: 20000, unidad: Ω, rotulo: "R₂" }
      y: { min: 0, max: 12, unidad: V, rotulo: "V_{salida}" }
      curvas:
        - { expr: "V_d*r/(R_1 + r)", color: azul, rotulo: "salida" }
      asas:
        - { mueve: R_2, x: "R_2", y: "V_s", rotulo: "R₂" }
      lectura: { valor: V_s, rotulo: "Salida" }
      mandos:
        - { valor: R_2, lista: [5000, 10000, 20000], rotulo: "R₂" }
    requiere: { mover: [R_2] }
    comprobar:
      - { V_s: 4.0 }

  - id: por-que-diferencia
    tipo: porque
    titulo: "¿Por qué la diferencia?"
    texto: "En la ecuación de la malla 1 aparece R₂·(i₁ − i₂). ¿Por qué la resta?"
    libro: [28]
    opciones:
      - texto: "R₂ es de las dos mallas: la atraviesan las dos corrientes, en sentidos opuestos"
        bien: true
        porque: "La corriente real por R₂ es la diferencia de las dos corrientes de malla. En los elementos comunes va la diferencia."
      - texto: "Es una aproximación para simplificar"
        porque: "No se aproxima nada: es la ley de Kirchhoff de tensiones aplicada a una malla, exacta."
      - texto: "Porque R₂ es la mayor de las tres resistencias"
        porque: "El tamaño no importa: la diferencia aparece porque R₂ es compartida por las dos mallas."

  - id: estime-potencia
    tipo: pregunta
    fase: "Estime"
    titulo: "Comprobar con la energía"
    texto: "La fuente de 12 V entrega I₁ = 2 A. Estime la potencia que entrega: debe ser la que disipan las tres resistencias."
    libro: [28, 25]
    fijar: { V_f: 12 }
    estimar:
      objetivo: "P_f"
      unidad: W
      min: 0
      max: 50
      paso: 1
      inicio: 10
      tol: 0.05
      rotulo: "Potencia de la fuente"
    exito: "12 × 2 = 24 W, y las resistencias disipan 16 + 5,33 + 2,67 W, que suman 24 W ✓."
    pistas:
      - { cuando: { valor: estimacion, menor: 22.8 }, texto: "Se ha quedado corto: la potencia de la fuente es V · I₁." }
      - { texto: "Se ha pasado: multiplique los 12 V por los 2 A de I₁." }
    comprobar:
      - { P_f: 24 }

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [14, 19, 24, 26]
    ideas:
      - { titulo: "Despejar.", texto: "Lo mismo a ambos lados. V = I·R, I = V/R y R = V/I son una sola relación." }
      - { titulo: "Proporcionalidad.", texto: "Doblar la corriente cuadruplica la potencia: P = I²·R es cuadrática." }
      - { titulo: "Sistemas.", texto: "Dos mallas, dos ecuaciones: I₁ = 2 A, I₂ = 1,333 A, y por la compartida, la diferencia." }
      - { titulo: "Comprobar siempre.", texto: "Sustituir el resultado, o ver que la potencia entregada iguala la disipada." }
