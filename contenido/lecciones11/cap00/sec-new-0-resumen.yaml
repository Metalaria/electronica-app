# Lección 1.1 de la sección 0.22 «Resumen del Capítulo» (cap00): el estatus de cada expresión (definición, ley
# empírica, teorema con condiciones o deducción) y los ejercicios del capítulo que no se han usado en otras lecciones
# (0.3, 0.4 y 0.8), con las ganancias en cascada como repaso. Formato: contenido/lecciones11/GUIA.md.
leccion: cap00/sec-new-0-resumen

libro:
  281: "Cuatro son definiciones (la transformada de Laplace, el valor eficaz, la senoide y el decibelio sobre potencias)"
  283: "Las expresiones clave, para repasar de un vistazo"
  284: "Un amplificador multiplica la tensión de entrada por 100"
  "cap00#154": "en cada discontinuidad la serie converge al punto medio del salto"
  "cap00#68": '"e"^(j θ) = op("cos") θ + j dot.op op("sen") θ'

modelo:
  valores:
    G1: { sim: "G₁", nombre: "ganancia de la primera etapa", unidad: dB, valor: 20 }
    G2: { sim: "G₂", nombre: "ganancia de la segunda etapa", unidad: dB, valor: -6 }
    G3: { sim: "G₃", nombre: "ganancia de la tercera etapa", unidad: dB, valor: 32 }
    P: { sim: "P", nombre: "potencia de salida", unidad: W, valor: 0.01 }
    A: { sim: "A", nombre: "factor de tensión del amplificador", unidad: "", valor: 100 }
    C: { sim: "C", nombre: "capacidad", unidad: F, valor: 0.00001 }
    dv: { sim: "Δv", nombre: "subida de tensión", unidad: V, valor: 2 }
    dt: { sim: "Δt", nombre: "tiempo de la subida", unidad: s, valor: 0.001 }
  calculos:
    G_tot: { expr: "G1 + G2 + G3", sim: "G", nombre: "ganancia total", unidad: dB }
    fac: { expr: "10^(G_tot/20)", sim: "factor", nombre: "factor de tensión total", unidad: "veces", cifras: 4 }
    dBm: { expr: "10*log10(P/0.001)", sim: "P", nombre: "potencia en dBm", unidad: dBm }
    G_A: { expr: "20*log10(A)", sim: "G", nombre: "ganancia en decibelios", unidad: dB }
    i_C: { expr: "C*dv/dt", sim: "i", nombre: "corriente del condensador", unidad: A }

tarjetas:
  - id: explore-cascada
    tipo: explorar
    titulo: "Repaso: etapas en cascada"
    texto: "Tres etapas de 20 dB, −6 dB y 32 dB. Mueva sus ganancias: en decibelios, la total es la suma."
    libro: [284]
    widget:
      tipo: grafica
      x: { id: x, min: 0, max: 3.5, unidad: "", rotulo: "etapa" }
      y: { min: -20, max: 100, unidad: dB, rotulo: "ganancia acumulada" }
      curvas:
        - { expr: "G1*min(max((x - 0.5)*1000, 0), 1) + G2*min(max((x - 1.5)*1000, 0), 1) + G3*min(max((x - 2.5)*1000, 0), 1)", color: azul, rotulo: "ganancia acumulada" }
      lectura: { valor: G_tot, rotulo: "Ganancia total" }
      datos:
        - { valor: fac, rotulo: "En tensión: {{fac}}" }
      mandos:
        - { valor: G1, min: -10, max: 40, paso: 1, rotulo: "Etapa 1" }
        - { valor: G2, min: -10, max: 40, paso: 1, rotulo: "Etapa 2" }
        - { valor: G3, min: -10, max: 40, paso: 1, rotulo: "Etapa 3" }
    requiere: { mover: [G2] }
    nota: "Con 20, −6 y 32 dB: 46 dB, un factor de 199,5 en tensión."

  - id: prediga-euler
    tipo: predecir
    titulo: "Prediga"
    texto: "No todas las expresiones del capítulo tienen el mismo estatus. La fórmula de Euler, e^{jθ} = cos θ + j·sen θ, ¿qué es?"
    libro: [281]
    opciones:
      - texto: "Un resultado que se deduce, desde las series"
        bien: true
        porque: "Sustituyendo jθ en la serie de la exponencial salen las series del coseno y del seno."
      - texto: "Una definición"
        porque: "Las definiciones del capítulo son cuatro: Laplace, el valor eficaz, la senoide y el decibelio sobre potencias."
      - texto: "Una ley empírica"
        porque: "Las leyes empíricas son dos: la de Ohm y la de Faraday para la bobina. Euler se deduce."
    ec: "cap00#68"
    escalera:
      - "Sustituya jθ en la serie de la exponencial y agrupe los términos."
    solucion: "Un resultado que se deduce: de la serie de la exponencial salen las del coseno y el seno."

  - id: estatus
    tipo: pregunta
    fase: "Empareje"
    titulo: "Cada expresión, su estatus"
    texto: "Una cada expresión del capítulo con lo que es."
    libro: [281]
    emparejar:
      - ["El valor eficaz", "Una definición"]
      - ["La ley de Ohm", "Una ley empírica"]
      - ["La serie de Fourier", "Un teorema con condiciones"]
      - ["El factor 20 de los decibelios", "Un resultado que se deduce"]
    exito: "Eso es. También se deducen las tres impedancias complejas y las ecuaciones de los mínimos cuadrados."
    pistas:
      - { texto: "El 20 sale del decibelio sobre potencias, que sí es una definición." }
    escalera:
      - "Las definiciones son cuatro y las leyes empíricas, dos; el resto se deduce."
    solucion: "El valor eficaz: una definición. La ley de Ohm: una ley empírica. La serie de Fourier: un teorema con condiciones. El factor 20 de los decibelios: un resultado que se deduce."

  - id: reto-dbm
    tipo: reto
    titulo: "Reto: +20 dBm"
    texto: "El dBm mide la potencia respecto a 1 mW. Ajuste la potencia de salida hasta +20 dBm."
    libro: [284]
    inicio: { P: 0.01 }
    widget:
      tipo: grafica
      x: { id: x, min: 0.001, max: 0.2, unidad: W, rotulo: "P" }
      y: { min: 0, max: 25, unidad: dBm, rotulo: "dBm" }
      curvas:
        - { expr: "10*log10(x/0.001)", color: azul, rotulo: "10·log₁₀(P / 1 mW)" }
      asas:
        - { mueve: P, x: "P", y: "dBm", rotulo: "Potencia" }
      datos:
        - { valor: P, rotulo: "P = {{P}}" }
      mandos:
        - { valor: P, min: 0.001, max: 0.2, paso: 0.001, rotulo: "Potencia de salida, P" }
    condiciones:
      - { valor: dBm, objetivo: 20, tol: 0.02, rotulo: "{{dBm}}" }
    exito: "+20 dBm son 20 dB por encima de 1 mW, ×100 en potencia: 100 mW = 0,1 W."
    pistas:
      - { cuando: { valor: dBm, menor: 19.6 }, texto: "Le faltan decibelios: suba la potencia." }
      - { cuando: { valor: dBm, mayor: 20.4 }, texto: "Le sobran decibelios: baje la potencia." }
    escalera:
      - "El dBm compara la potencia con 1 mW."
    solucion: "En potencia, 10·log: 20 dB son ×100."
    comprobar:
      - { con: { P: 0.1 }, dBm: 20 }

  - id: estime-x100
    tipo: pregunta
    fase: "Estime"
    titulo: "Un amplificador ×100"
    texto: "Un amplificador multiplica la tensión de entrada por 100. Estime su ganancia en decibelios."
    libro: [284]
    fijar: { A: 100 }
    estimar:
      objetivo: "G_A"
      unidad: dB
      min: 0
      max: 80
      paso: 1
      inicio: 20
      tol: 0.03
      rotulo: "Ganancia"
    exito: "20 · log₁₀(100) = 20 · 2 = 40 dB."
    pistas:
      - { cuando: { valor: estimacion, menor: 38.8 }, texto: "Se ha quedado corto: en tensión es 20·log, y log₁₀(100) = 2." }
      - { texto: "Se ha pasado: 20 · log₁₀(100), y log₁₀(100) vale 2." }
    comprobar:
      - { G_A: 40 }
    escalera:
      - "En tensión, la ganancia en decibelios es 20·log₁₀."
    solucion: "20 · log₁₀(100) = 20 · 2 = 40 dB."

  - id: estime-condensador
    tipo: pregunta
    fase: "Estime"
    titulo: "Una rampa en un condensador"
    texto: "Por un condensador de 10 µF la tensión crece linealmente 2 V en 1 ms. Estime la corriente con i = C·dv/dt."
    libro: [284]
    fijar: { C: 0.00001, dv: 2, dt: 0.001 }
    estimar:
      objetivo: "i_C"
      unidad: A
      min: 0
      max: 0.05
      paso: 0.001
      inicio: 0.002
      tol: 0.03
      rotulo: "i"
    exito: "dv/dt = 2 V / 0,001 s = 2000 V/s; i = 10 × 10⁻⁶ × 2000 = 0,02 A = 20 mA."
    pistas:
      - { cuando: { valor: estimacion, menor: 0.0194 }, texto: "Se ha quedado corto: 2 V en 1 ms son 2000 V/s." }
      - { texto: "Se ha pasado: 10 µF por 2000 V/s; cuente bien los prefijos." }
    comprobar:
      - { i_C: 0.02 }
    escalera:
      - "Calcule primero la pendiente, dv/dt: 2 V en 1 ms."
    solucion: "dv/dt = 2 V / 0,001 s = 2000 V/s; i = 10 × 10⁻⁶ × 2000 = 0,02 A = 20 mA."

  - id: por-que-condiciones
    tipo: porque
    titulo: "¿Por qué importa el estatus?"
    texto: "La serie de Fourier es un teorema con condiciones, no una identidad universal. ¿Qué cambia eso?"
    libro: [281, "cap00#154"]
    opciones:
      - texto: "Solo vale si se cumplen sus condiciones, y en un salto da el punto medio"
        bien: true
        porque: "Las de Dirichlet: periódica, integrable en un periodo y con un número finito de discontinuidades. En cada salto, el punto medio."
      - texto: "Nada: un teorema vale siempre, como una definición"
        porque: "Una definición no puede fallar; un teorema solo vale dentro de sus condiciones."
      - texto: "Que hay que comprobarla midiendo, como una ley empírica"
        porque: "No se mide: se demuestra. Lo que hay que comprobar es que la señal cumple las condiciones."
    widget:
      tipo: figura
      figura: fig-0.12
      zonas:
        - { id: armonicos, rotulo: "Una cuadrada hecha de senoides", rect: [0, 0, 449, 208] }
    escalera:
      - "Un teorema vale dentro de sus condiciones: ¿cuáles son las de la serie de Fourier?"
    solucion: "Solo vale con las condiciones de Dirichlet, y en un salto da el punto medio."

  - id: resumen
    tipo: resumen
    titulo: "Capítulo repasado"
    libro: [281, 283, 284]
    ideas:
      - { titulo: "Definiciones.", texto: "Laplace, el valor eficaz, la senoide y el decibelio sobre potencias." }
      - { titulo: "Leyes empíricas.", texto: "La de Ohm y la de Faraday para la bobina." }
      - { titulo: "Un teorema.", texto: "Fourier, con sus condiciones. Todo lo demás se deduce." }
      - { titulo: "Decibelios.", texto: "×100 en tensión, 40 dB; +20 dBm, 100 mW; en cascada se suman." }
