# Lección 1.2 de la sección 8.4 «Reguladores de Tensión» (cap08). Formato: contenido/lecciones11/GUIA.md.
# 1.2: el regulador lineal es el esquema «regulador-lineal» (elemento de paso, referencia y lazo; «un divisor de
# tensión cuya parte superior se ajusta sola», bloque 63): un regulador fijo de 5 V con el dropout de unos 2 V de los
# 78xx (bloque 67). El LM317 sigue en gráfica: su referencia va sobre R₁ (terminal de ajuste), no a masa como en el
# esquema, así que dibujarlo con él cambiaría los papeles de R₁ y R₂.
# 1.2.1 (autor121-ana, «aprender haciendo», GUIA §13): la entrada mínima que aún regula se busca (objetivo, el
# dropout), la disipación de 12 a 5 V se predice y se simula, la diferencia que se convierte en calor se mide con el
# multímetro, las corrientes de entrada del lineal y del conmutado se predicen, el LM317 se ajusta y la carga con la
# que el lineal disipa menos de 1 W se busca (la tabla de cuándo cada uno, en su explicación). Quedan dos preguntas de
# opciones (por qué menos corriente, el LDO que oscila); las protecciones pasan al resumen.
leccion: cap08/sec-8.4

libro:
  63: "Es un divisor de tensión cuya parte superior se ajusta sola"
  65: 'P_("disipada") = lr(( V_("in") - V_("out") )) dot.op I'
  66: "Con 12 V de entrada, 5 V de salida y 1 A: 7 W disipados y un rendimiento del 41,7 %"
  67: "necesita unos 2 V de diferencia entre entrada y salida para funcionar"
  68: "sustituir un electrolítico por un cerámico de baja ESR puede hacer que el regulador oscile"
  69: "mantienen 1,25 V entre su salida y su terminal de ajuste"
  71: "usa una bobina como depósito de energía"
  72: "un conmutado del 90 % de rendimiento toma 463 mA de la entrada y disipa solo 0,56 W"
  76: "Buck (reductor) Menor"
  80: "Alimentación por batería, donde el rendimiento es autonomía Conmutado"
  81: "un conmutado hace el trabajo pesado con buen rendimiento, y un LDO detrás limpia el ruido"
  83: "existen para el accidente, no para el régimen"
  "cap08#246": "Diseña una fuente ajustable con LM317 que entregue 9 V. Si R₁ = 240 Ω, ¿qué valor debe tener R₂?"

modelo:
  valores:
    V_in: { sim: "V_{in}", nombre: "tensión de entrada", unidad: V, valor: 12 }
    V_o: { sim: "V_{out}", nombre: "tensión regulada", unidad: V, valor: 5 }
    R_L: { sim: "R_{L}", nombre: "carga", unidad: Ω, valor: 5 }
    eta: { sim: "η", nombre: "rendimiento del conmutado", unidad: "", valor: 0.9 }
    R_17: { sim: "R₂", nombre: "resistencia de ajuste", unidad: Ω, valor: 1000 }
    R_1l: { sim: "R₁", nombre: "resistencia de OUT a ADJ", unidad: Ω, valor: 240 }
    RL_l: { sim: "R_{L}", nombre: "carga del LM317", unidad: Ω, valor: 100 }
    V_do: { sim: "V_{do}", nombre: "dropout del 78xx", unidad: V, valor: 2 }
  calculos:
    V_rg: { expr: "min(V_o, V_in - V_do)", sim: "V_{out}", nombre: "tensión de salida", unidad: V }
    I_rg: { expr: "V_rg/R_L", sim: "I", nombre: "corriente de la carga", unidad: A }
    P_rg: { expr: "(V_in - V_rg)*I_rg", sim: "P_{paso}", nombre: "potencia en el elemento de paso", unidad: W }
    ren_rg: { expr: "100*V_rg/V_in", sim: "η", nombre: "rendimiento", unidad: "%", cifras: 3 }
    I_r: { expr: "V_o/R_L", sim: "I", nombre: "corriente de la carga", unidad: A }
    R_p: { expr: "(V_in - V_o)/I_r", sim: "R_{paso}", nombre: "elemento de paso", unidad: Ω }
    V_s: { expr: "V_in*R_L/(R_p + R_L)", sim: "V_{out}", nombre: "tensión de salida", unidad: V }
    V_pa: { expr: "V_in - V_s", sim: "V_{paso}", nombre: "caída en el elemento de paso", unidad: V }
    P_d: { expr: "(V_in - V_o)*I_r", sim: "P_{disipada}", nombre: "potencia disipada", unidad: W }
    ren: { expr: "100*V_o/V_in", sim: "η", nombre: "rendimiento del lineal", unidad: "%", cifras: 3 }
    I_sw: { expr: "V_o*I_r/(eta*V_in)", sim: "I_{in}", nombre: "corriente de entrada del conmutado", unidad: A }
    P_sw: { expr: "V_o*I_r*(1/eta - 1)", sim: "P", nombre: "pérdida del conmutado", unidad: W }
    P_in: { expr: "V_o*I_r/eta", sim: "P_{in}", nombre: "potencia de entrada del conmutado", unidad: W }
    I_id: { expr: "V_o*I_r/V_in", sim: "I", nombre: "corriente sin pérdidas", unidad: A }
    V_17: { expr: "min(1.25*(1 + R_17/R_1l), V_in - V_do)", sim: "V_{out}", nombre: "salida del LM317", unidad: V }
    IL_l: { expr: "V_17/RL_l", sim: "I_{L}", nombre: "corriente por la carga", unidad: A }
    P_car: { expr: "V_rg*I_rg", sim: "P_{carga}", nombre: "potencia de la carga", unidad: W }
    V_paso: { expr: "V_in - V_rg", sim: "V_{in} − V_{out}", nombre: "tensión en el elemento de paso", unidad: V }

tarjetas:
  - id: explore-lineal
    tipo: explorar
    titulo: "Un divisor que se ajusta solo"
    texto: "El elemento de paso cambia para mantener 5 V. Baje la entrada hasta la mínima con la que aún regula."
    nota: "Carga de 5 Ω: 1 A."
    libro: [63, 65, 67]
    fijar: { V_o: 5, V_do: 2, R_L: 5 }
    inicio: { V_in: 12 }
    widget:
      tipo: circuito
      esquema: regulador-lineal
      piezas: { entrada: V_in, ref: V_o, dropout: V_do, carga: R_L }
      lectura: { valor: V_rg, rotulo: "Salida" }
      datos:
        - { valor: P_rg, rotulo: "Disipa: {{P_rg}}" }
        - { valor: ren_rg, rotulo: "Rendimiento: {{ren_rg}}" }
      corriente: I_rg
      mide: { vout: V_rg, iin: I_rg, icarga: I_rg, p_paso: P_rg }
      mandos:
        - { valor: V_in, min: 5, max: 15, paso: 0.5, rotulo: "Tensión de entrada" }
    objetivo:
      condiciones:
        - { valor: V_rg, objetivo: 5, tol: 0.01, rotulo: "Salida: {{V_rg}}" }
        - { valor: V_in, max: 7, rotulo: "Entrada: {{V_in}}" }
      logrado: "Con {{V_in}}: el 78xx necesita unos 2 V de margen. Ahí disipa solo {{P_rg}}, y el rendimiento sube a {{ren_rg}}."
      pistas:
        - { cuando: { valor: V_rg, menor: 4.95 }, texto: "Ya no regula: la salida se cae. Suba la entrada." }
        - { texto: "Aún regula con margen de sobra: baje más la entrada." }
    escalera:
      - "El regulador necesita una diferencia mínima entre entrada y salida: el dropout."
    solucion: "7 V: 5 V más los 2 V del dropout."
    comprobar:
      - { con: { V_in: 7 }, V_rg: 5, P_rg: 2, ren_rg: 71.4, tol: 0.01 }
      - { con: { V_in: 6.5 }, V_rg: 4.5 }

  - id: prediga-disipacion
    tipo: simular
    titulo: "De 12 a 5 V con 1 A"
    texto: "Un regulador lineal entrega 5 V y 1 A desde 12 V. ¿Cuánto disipa?"
    libro: [66]
    fijar: { V_in: 12, V_o: 5, R_L: 5, V_do: 2 }
    widget:
      tipo: circuito
      esquema: regulador-lineal
      piezas: { entrada: V_in, ref: V_o, dropout: V_do, carga: R_L }
      lectura: { valor: P_rg, rotulo: "Disipa el elemento de paso" }
      corriente: I_rg
      mide: { vout: V_rg, iin: I_rg, p_paso: P_rg }
      ocultar: true
      mandos: []
    simular:
      objetivo: P_rg
      unidad: W
      tol: 0.03
      rotulo: "Disipa el elemento de paso"
      medida: p_paso
      errores:
        - { expr: "P_car", texto: "5 W son los que recibe la carga. El regulador disipa la diferencia de tensión por la corriente." }
    exito: "(12 − 5) · 1 = 7 W, más de lo que entrega: un rendimiento del 41,7 %."
    escalera:
      - "Toda la corriente de la carga atraviesa el elemento de paso."
    solucion: "(12 − 5) V · 1 A = 7 W; rendimiento 5/12 = 41,7 %."
    comprobar:
      - { P_d: 7, P_rg: 7, ren: 41.7, V_s: 5, P_car: 5, tol: 0.001 }

  - id: regla-disipacion
    tipo: medir
    titulo: "El defecto aritmético"
    texto: "P = (V_{in} − V_{out}) · I. Ponga las puntas donde se ve la tensión que se convierte en calor."
    libro: [65]
    fijar: { V_in: 12, V_o: 5, V_do: 2, R_L: 5 }
    widget:
      tipo: circuito
      esquema: regulador-lineal
      piezas: { entrada: V_in, ref: V_o, dropout: V_do, carga: R_L }
      corriente: I_rg
      mide: { vout: V_rg, iin: I_rg, vpaso: V_paso }
      instrumento: { tipo: multimetro, modos: [V], puntos: [in, out, "0"] }
      mandos: []
    medir:
      magnitud: tension
      entre: [in, out]
      valor: V_paso
      porque:
        "in/0": "Así mide la entrada entera, 12 V. Lo que se pierde es la diferencia entre entrada y salida."
        "out/0": "Esa es la salida regulada, la que aprovecha la carga."
    exito: "7 V en el elemento de paso, por 1 A: 7 W de calor que hay que evacuar con un radiador."
    escalera:
      - "Una punta antes del elemento de paso y otra después."
    solucion: "Roja en la entrada, negra en la salida: 7 V."
    comprobar:
      - { V_paso: 7, P_rg: 7 }

  - id: simule-entrada
    tipo: simular
    titulo: "La corriente de entrada"
    texto: "El regulador lineal de 12 a 5 V entrega 1 A. ¿Qué corriente toma de la entrada?"
    libro: [66, 72]
    fijar: { V_in: 12, V_o: 5, R_L: 5, V_do: 2 }
    widget:
      tipo: circuito
      esquema: regulador-lineal
      piezas: { entrada: V_in, ref: V_o, dropout: V_do, carga: R_L }
      lectura: { valor: I_rg, rotulo: "Corriente de entrada" }
      mide: { vout: V_rg, iin: I_rg }
      ocultar: true
      mandos: []
    simular:
      objetivo: I_rg
      unidad: A
      tol: 0.03
      rotulo: "Corriente de entrada"
      medida: iin
      errores:
        - { expr: "I_id", texto: "Eso sería conservar la potencia, como un conmutado ideal. En un lineal la corriente atraviesa el elemento de paso: entra la misma que sale." }
    exito: "1 A: la corriente de entrada es igual a la de salida, sea cual sea la diferencia de tensiones."
    escalera:
      - "El elemento de paso está en serie con la carga."
    solucion: "La misma que sale: 1 A."
    comprobar:
      - { I_r: 1, I_rg: 1, I_id: 0.4167, tol: 0.001 }

  - id: estime-conmutado
    tipo: simular
    fase: "Estime"
    titulo: "Con un conmutado"
    texto: "El mismo caso, 12 a 5 V con 1 A, con un conmutado del 90 % de rendimiento. ¿Qué corriente toma de la entrada?"
    libro: [72]
    fijar: { V_in: 12, V_o: 5, R_L: 5, eta: 0.9 }
    simular:
      objetivo: I_sw
      unidad: A
      tol: 0.05
      rotulo: "Corriente de entrada"
      errores:
        - { expr: "I_r", texto: "Eso es lo del lineal. El conmutado no deja pasar la corriente: transfiere energía. Iguale potencias." }
        - { expr: "I_id", texto: "Eso sería con un rendimiento del 100 %: la entrada aporta también lo que se pierde." }
    exito: "463 mA, menos que la de salida, y solo 0,56 W de pérdidas: trece veces menos calor."
    escalera:
      - "Potencia de entrada = 5 W / 0,9."
    solucion: "5,56 W / 12 V = 463 mA."
    comprobar:
      - { I_sw: 0.463, P_sw: 0.556, P_in: 5.556, I_id: 0.4167, tol: 0.01 }

  - id: reto-lm317
    tipo: reto
    titulo: "Un LM317 a 9 V"
    texto: "El LM317 mantiene 1,25 V sobre R₁ = 240 Ω. Elija R₂ de la serie E12 para 9 V."
    libro: [69, "cap08#246"]
    fijar: { V_in: 12, V_do: 2 }
    inicio: { R_17: 1000 }
    widget:
      tipo: circuito
      esquema: lm317
      piezas: { entrada: V_in, r1: R_1l, r2: R_17, dropout: V_do, carga: RL_l }
      lectura: { valor: V_17, rotulo: "Salida" }
      corriente: IL_l
      mide: { vout: V_17, icarga: IL_l }
      mandos:
        - { valor: R_17, serie: E12, min: 470, max: 2700, rotulo: "R₂ (E12)" }
    condiciones:
      - { valor: V_17, objetivo: 9, tol: 0.01, rotulo: "Salida: {{V_17}}" }
    exito: "1,5 kΩ da 9,06 V. El cálculo exacto pide 1488 Ω."
    pistas:
      - { cuando: { valor: V_17, menor: 8.91 }, texto: "Falta tensión: R₂ tiene que ser mayor." }
      - { texto: "Sobra tensión: R₂ tiene que ser menor." }
    escalera:
      - "9 = 1,25 · (1 + R₂/240)."
    solucion: "R₂ = 240 · (9/1,25 − 1) = 1488 Ω: el E12 más próximo, 1,5 kΩ."
    comprobar:
      - { con: { R_17: 1500 }, V_17: 9.0625 }
      - { con: { R_17: 1488 }, V_17: 9 }

  - id: por-que-menos
    tipo: porque
    titulo: "¿Menos corriente de la que entrega?"
    texto: "El conmutado entrega 1 A a 5 V y toma solo 463 mA de 12 V. ¿Cómo es posible?"
    libro: [71, 72]
    fijar: { V_in: 12, V_o: 5, R_L: 5, V_do: 2 }
    widget:
      tipo: circuito
      esquema: regulador-lineal
      piezas: { entrada: V_in, ref: V_o, dropout: V_do, carga: R_L }
      lectura: { valor: I_rg, rotulo: "Corriente del lineal" }
      corriente: I_rg
      mide: { vout: V_rg, iin: I_rg, iout: I_rg }
    opciones:
      - texto: "Transfiere energía, no corriente: la potencia de entrada es la de salida más las pérdidas"
        bien: true
        porque: "La bobina almacena la energía y la entrega a otra tensión: ningún elemento disipa la diferencia."
      - texto: "Porque su elemento de paso tiene menos resistencia"
        porque: "No tiene elemento de paso en serie: conmuta y usa una bobina como depósito de energía."
      - texto: "Es imposible: la corriente se conserva"
        porque: "Se conserva en un circuito serie como el lineal; el conmutado transforma la tensión."
    escalera:
      - "Compare potencias, no corrientes."
    solucion: "Conserva la energía: 5 W divididos por el 90 % de rendimiento, a 12 V, son 463 mA."

  - id: cuando-cada-uno
    tipo: explorar
    titulo: "Lineal o conmutado"
    texto: "Desde 12 V, elija la carga con la que el lineal disipa menos de 1 W. Ahí compensa por simplicidad."
    libro: [76, 80, 81]
    fijar: { V_in: 12, V_o: 5, V_do: 2 }
    inicio: { R_L: 5 }
    widget:
      tipo: circuito
      esquema: regulador-lineal
      piezas: { entrada: V_in, ref: V_o, dropout: V_do, carga: R_L }
      lectura: { valor: P_rg, rotulo: "Disipa el elemento de paso" }
      corriente: I_rg
      mide: { vout: V_rg, iin: I_rg, p_paso: P_rg }
      mandos:
        - { valor: R_L, lista: [5, 10, 50], rotulo: "Carga" }
    objetivo:
      condiciones:
        - { valor: P_rg, max: 1, rotulo: "Disipa: {{P_rg}}" }
      logrado: "Con {{R_L}}, {{P_rg}}: lineal por simplicidad. Con más corriente, conmutado; para un ADC de precisión, conmutado y un LDO detrás."
      pistas:
        - { texto: "Con tanta corriente, 7 V de diferencia son demasiado calor: menos corriente, más carga." }
    escalera:
      - "Disipa 7 V por la corriente: para menos de 1 W hace falta poca corriente."
    solucion: "50 Ω: 0,1 A y 0,7 W."
    comprobar:
      - { con: { R_L: 50 }, P_rg: 0.7, I_rg: 0.1 }

  - id: ldo-ceramico
    tipo: pregunta
    titulo: "Un LDO que oscila"
    texto: "Se cambia el electrolítico de salida de un LDO por un cerámico de baja ESR y el regulador empieza a oscilar. ¿Por qué?"
    libro: [67, 68]
    widget:
      tipo: grafica
      x: { id: rx, min: 0, max: 3000, unidad: Ω, rotulo: "R₂" }
      y: { min: 0, max: 18, unidad: V, rotulo: "V_{out}" }
      curvas:
        - { expr: "1.25*(1 + rx/240)", color: azul, rotulo: "1,25 · (1 + R₂/R₁)" }
    opciones:
      - texto: "El condensador de salida forma parte del lazo y su ESR debe estar en un margen"
        bien: true
        porque: "Muchos LDO necesitan esa ESR para ser estables; los modernos especifican si admiten cerámicos."
      - texto: "Porque el cerámico tiene menos capacidad"
        porque: "La clave no es la capacidad sino la ESR, que entra en la estabilidad del lazo."
      - texto: "Porque al LDO le falta tensión de entrada"
        porque: "Eso daría una salida que cae, no una oscilación."
    escalera:
      - "En un LDO, el condensador de salida no es un adorno."
    solucion: "La ESR del condensador de salida decide si el lazo del LDO es estable."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [63, 65, 72, 83]
    ideas:
      - { titulo: "Lineal.", texto: "Un divisor que se ajusta solo: disipa (V_{in} − V_{out}) · I." }
      - { titulo: "Conmutado.", texto: "Transfiere energía en paquetes: menos calor y menos corriente de entrada." }
      - { titulo: "Lo mejor de los dos.", texto: "Conmutado para el trabajo pesado y un LDO para limpiar." }
      - { titulo: "Protecciones.", texto: "Corriente, temperatura y área segura: para el accidente, no para el régimen." }
