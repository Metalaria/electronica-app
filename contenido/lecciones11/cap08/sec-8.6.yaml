# Lección 1.2 de la sección 8.6 «Cómo Leer y Elegir un Operacional Real» (cap08). Formato: contenido/lecciones11/GUIA.md.
# Gráfica del GBW: ganancia en lazo abierto de 10⁵ (sección 8.1) con un solo polo, y GBW = 1 MHz (ejercicio 8.8).
# La salida limitada por slew rate se dibuja como el triángulo de pendiente SR en que se convierte la senoide.
# 1.2: el GBW y el slew rate van sobre el esquema «ao-no-inversor» (piezas gbw y sr), simulados con ngspice: la
# respuesta en frecuencia con 1 V de entrada (la amplitud de salida es la ganancia) y un seguidor de 0,5 V/µs con 10 V
# de pico. El triángulo en régimen tiene amplitud SR/(4f) y su pico cae donde la entrada, al bajar, vale eso; el eje
# empieza a los 0,2 ms, cuando el arranque ya se ha asentado. Frecuencias de ejemplo: 4 y 16 kHz.
# 1.2.1 (autor121-ana, «aprender haciendo», GUIA §13): la ganancia que aún llega a 100 kHz se busca en la respuesta
# simulada (objetivo), la banda con ganancia 100, la f_máx del slew rate y el offset amplificado se predicen
# (simular), la mayor amplitud sin deformar a 16 kHz se busca en la curva del slew rate, la senoide se lleva a
# triángulo y el hilo del offset se toca en el seguidor (el banco). Quedan dos preguntas de opciones (por qué un
# triángulo, el de menos ruido) y la tabla de decisión emparejada; el rail-to-rail pasa a su explicación.
leccion: cap08/sec-8.6

libro:
  113: "con 3 mV y ganancia 100, la salida tiene 300 mV de error"
  115: "Con 100 nA y 1 MΩ son 100 mV, que arruina cualquier medida"
  117: "El ancho de banda del circuito es GBW dividido por la ganancia"
  118: "Slew rate: la velocidad máxima de la salida"
  119: 'f_(op("max")) = ("SR")/("2" π dot.op V_("pico"))'
  120: "Con 0,5 V/µs y 10 V de pico, 8 kHz. Por encima, la senoide se convierte en triángulo."
  124: "Fuente de alta impedancia IB Entrada FET/CMOS"
  127: "sobre una fuente de megaohmios será peor que uno mediocre de entrada FET"
  131: "identificar el parámetro crítico primero, y aceptar lo mediocre en los demás"
  134: "Con 10 mA de carga, el margen puede ser de cientos de milivoltios"
  139: "montarlo como seguidor con la entrada a masa y medir la salida"
  140: "aplicar un escalón grande y medir la pendiente máxima de la salida"
  141: "saturarlo hacia arriba y hacia abajo con una carga conocida"
  "cap08#11": "de 10⁵ a 10⁶"
  "cap08#246": "Un operacional de GBW = 1 MHz se configura con ganancia 100"

modelo:
  valores:
    G_c: { sim: "G", nombre: "ganancia del montaje", unidad: "", valor: 10 }
    GBW: { sim: "GBW", nombre: "producto ganancia por ancho de banda", unidad: Hz, valor: 1000000 }
    A_0: { sim: "A_{0}", nombre: "ganancia en lazo abierto", unidad: "", valor: 100000 }
    SR: { sim: "SR", nombre: "slew rate", unidad: "V/s", valor: 500000 }
    V_pk: { sim: "V_{pico}", nombre: "amplitud de la senoide", unidad: V, valor: 10 }
    f_s: { sim: "f", nombre: "frecuencia de la señal", unidad: Hz, valor: 2000 }
    V_os: { sim: "V_{os}", nombre: "tensión de offset", unidad: V, valor: 0.003 }
    R_1g: { sim: "R₁", nombre: "resistencia a masa", unidad: Ω, valor: 1000 }
    A_p1: { sim: "v_{in}", nombre: "amplitud de entrada", unidad: V, valor: 1 }
    cero: { sim: "0", nombre: "nivel de continua", unidad: V, valor: 0 }
  calculos:
    R_2g: { expr: "(G_c - 1)*R_1g", sim: "R₂", nombre: "resistencia de realimentación", unidad: Ω }
    f_p: { expr: "GBW/A_0", sim: "f_{p}", nombre: "polo en lazo abierto", unidad: Hz }
    f_n2: { expr: "SR/V_pk", sim: "f", nombre: "sin el 2π", unidad: Hz }
    f_x10: { expr: "SR/(20*pi*V_pk)", sim: "f", nombre: "con un factor diez de más", unidad: Hz }
    t_pk: { expr: "(pi - asin(A_t/V_pk))/(2*pi*f_s)", sim: "t_{pico}", nombre: "pico del triángulo", unidad: s }
    B_c: { expr: "GBW/G_c", sim: "B", nombre: "ancho de banda del montaje", unidad: Hz }
    f_mx: { expr: "SR/(2*pi*V_pk)", sim: "f_{máx}", nombre: "frecuencia máxima sin deformar", unidad: Hz }
    s_t: { expr: "min(1, floor(f_s/f_mx))", sim: "limitada", nombre: "limitada por slew rate", unidad: "" }
    A_t: { expr: "min(V_pk, SR/(4*f_s))", sim: "V", nombre: "amplitud del triángulo", unidad: V }
    A_s: { expr: "(1 - s_t)*V_pk + s_t*A_t", sim: "V_{salida}", nombre: "amplitud de la salida", unidad: V }
    e_os: { expr: "V_os*G_c", sim: "error", nombre: "error de salida por el offset", unidad: V }
    B_2: { expr: "GBW/G_c^2", sim: "GBW/G²", nombre: "dividiendo dos veces", unidad: Hz }

tarjetas:
  - id: explore-gbw
    tipo: explorar
    titulo: "La ganancia que queda a cada frecuencia"
    texto: "La ganancia en lazo abierto cae con la frecuencia. Elija la ganancia del montaje con la que aún llega a 100 kHz."
    libro: [117, "cap08#11"]
    nota: "Entrada de 1 V: la amplitud de salida es la ganancia."
    fijar: { GBW: 1000000, A_0: 100000 }
    inicio: { G_c: 1000 }
    widget:
      tipo: circuito
      esquema: ao-no-inversor
      piezas: { entrada: cero, amplitud: A_p1, f: f_s, r1: R_1g, r2: R_2g, a0: A_0, gbw: GBW }
      lectura: { valor: B_c, rotulo: "Ancho de banda del montaje" }
      grafica:
        x: { id: nu, min: 1, max: 10000000, unidad: Hz, rotulo: "f", escala: log }
        y: { min: 0.1, max: 1000000, unidad: V, rotulo: "v_{o}", escala: log }
        curvas:
          - { expr: "min(A_0, GBW/nu)", color: tinta, rotulo: "lazo abierto", discontinua: true }
          - { expr: "A_p1*A_0/sqrt((1 + A_0/G_c)^2 + (nu/f_p)^2)", color: naranja, rotulo: "su montaje", mide: salida_amp }
      mandos:
        - { valor: G_c, lista: [10, 100, 1000], rotulo: "Ganancia del montaje" }
    objetivo:
      condiciones:
        - { valor: B_c, min: 100000, rotulo: "Banda: {{B_c}}" }
      logrado: "Con ganancia {{G_c}}, {{B_c}}: el montaje sigue a la curva de lazo abierto hasta chocar con ella."
      pistas:
        - { texto: "Con tanta ganancia, el montaje choca antes con la curva de lazo abierto: baje la ganancia." }
    escalera:
      - "El ancho de banda del montaje es GBW dividido por su ganancia."
    solucion: "Ganancia 10: 1 MHz / 10 = 100 kHz."
    comprobar:
      - { con: { G_c: 10 }, B_c: 100000 }

  - id: estime-banda
    tipo: simular
    fase: "Estime"
    titulo: "Ganancia 100"
    texto: "Un operacional de GBW = 1 MHz se monta con ganancia 100. ¿Qué ancho de banda útil le queda?"
    libro: [117, "cap08#246"]
    fijar: { GBW: 1000000, G_c: 100 }
    simular:
      objetivo: B_c
      unidad: Hz
      tol: 0.05
      rotulo: "Ancho de banda"
      errores:
        - { expr: "B_2", texto: "Ha dividido dos veces: es GBW/ganancia, no GBW/ganancia²." }
    exito: "1 MHz / 100 = 10 kHz: la ganancia se paga en banda."
    escalera:
      - "B = GBW/G."
    solucion: "10⁶ / 100 = 10 kHz."
    comprobar:
      - { B_c: 10000, B_2: 100 }

  - id: prediga-slew
    tipo: simular
    titulo: "Señal grande y rápida"
    texto: "Un operacional de 0,5 V/µs debe dar una senoide de 10 V de pico. ¿Hasta qué frecuencia la reproduce sin deformar?"
    libro: [119, 120]
    fijar: { SR: 500000, V_pk: 10, f_s: 4000 }
    simular:
      objetivo: f_mx
      unidad: Hz
      tol: 0.05
      rotulo: "Frecuencia máxima"
      errores:
        - { expr: "f_n2", texto: "Ha olvidado el 2π: la pendiente máxima de una senoide es 2π · f · V_{pico}." }
        - { expr: "f_x10", texto: "Sobra un factor diez: 0,5 V/µs son 5 · 10⁵ V/s." }
    exito: "SR/(2π · V_{pico}) ≈ 8 kHz: la pendiente de la senoide en el cruce por cero no puede superar el SR."
    escalera:
      - "La pendiente máxima de la senoide, 2π · f · V_{pico}, no puede superar el SR."
    solucion: "f_{máx} = 0,5 · 10⁶ / (2π · 10) ≈ 7960 Hz."
    comprobar:
      - { f_mx: 7958, f_n2: 50000, f_x10: 796, tol: 0.001 }

  - id: regla-slew
    tipo: explorar
    titulo: "El límite del slew rate"
    texto: "f_{máx} = SR/(2π · V_{pico}): cuanta más amplitud, menos frecuencia. Busque la mayor amplitud que sale sin deformar a 16 kHz."
    libro: [119]
    fijar: { SR: 500000 }
    inicio: { V_pk: 10 }
    widget:
      tipo: grafica
      x: { id: vx, min: 0.5, max: 15, unidad: V, rotulo: "V_{pico}" }
      y: { min: 0, max: 160000, unidad: Hz, rotulo: "f_{máx}" }
      curvas:
        - { expr: "SR/(2*pi*vx)", color: azul, rotulo: "f_{máx}" }
      asas:
        - { mueve: V_pk, x: "V_pk", y: "f_mx", rotulo: "Su amplitud" }
      lectura: { valor: f_mx, rotulo: "Frecuencia máxima" }
      mandos:
        - { valor: V_pk, min: 0.5, max: 15, paso: 0.5, rotulo: "Amplitud" }
    objetivo:
      condiciones:
        - { valor: f_mx, min: 16000, rotulo: "f_{máx}: {{f_mx}}" }
        - { valor: V_pk, min: 4.5, rotulo: "Amplitud: {{V_pk}}" }
      logrado: "Con {{V_pk}} de pico llega a {{f_mx}}. Con 10 V, solo a 8 kHz."
      pistas:
        - { cuando: { valor: f_mx, menor: 16000 }, texto: "Con esa amplitud no llega a 16 kHz: bájela." }
        - { texto: "Llega de sobra: suba la amplitud todo lo que pueda." }
    escalera:
      - "Despeje: V_{pico} = SR/(2π · f)."
    solucion: "4,5 V: unos 17,7 kHz; con 5 V ya no llega."
    comprobar:
      - { con: { V_pk: 4.5 }, f_mx: 17684, tol: 0.01 }
      - { con: { V_pk: 5 }, f_mx: 15915, tol: 0.01 }

  - id: sorpresa-triangulo
    tipo: sorpresa
    titulo: "La senoide que se vuelve triángulo"
    texto: "10 V de pico con 0,5 V/µs. Suba la frecuencia por encima de la máxima hasta que la salida se deforme."
    libro: [120]
    fijar: { SR: 500000, V_pk: 10 }
    inicio: { f_s: 4000 }
    widget:
      tipo: circuito
      esquema: ao-no-inversor
      piezas: { entrada: cero, amplitud: V_pk, f: f_s, sr: SR }
      lectura: { valor: A_s, rotulo: "Amplitud de la salida" }
      datos:
        - { valor: f_mx, rotulo: "Máxima sin deformar: {{f_mx}}" }
      grafica:
        x: { id: t, min: 0.0002, max: 0.0007, unidad: s, rotulo: "t" }
        y: { min: -12, max: 12, unidad: V, rotulo: "v" }
        curvas:
          - { expr: "V_pk*sin(2*pi*f_s*t)", color: tinta, rotulo: "la que se pide", mide: entrada, discontinua: true }
          - { expr: "(1 - s_t)*V_pk*sin(2*pi*f_s*t) + s_t*A_t*(4*abs((t - t_pk)*f_s - floor((t - t_pk)*f_s) - 0.5) - 1)", color: naranja, rotulo: "salida", mide: salida }
      mandos:
        - { valor: f_s, lista: [4000, 16000], rotulo: "Frecuencia" }
    objetivo:
      condiciones:
        - { valor: A_s, max: 9, rotulo: "Salida: {{A_s}}" }
      logrado: "A {{f_s}}, un triángulo de solo {{A_s}} de pico: la senoide pedida es demasiado empinada."
      pistas:
        - { texto: "A 4 kHz la sigue entera: suba la frecuencia." }
    escalera:
      - "Por encima de 8 kHz, la pendiente pedida supera el SR."
    solucion: "16 kHz: un triángulo de unos 7,8 V."
    comprobar:
      - { con: { f_s: 16000 }, A_s: 7.8125, tol: 0.01 }

  - id: por-que-triangulo
    tipo: porque
    titulo: "¿Por qué un triángulo?"
    texto: "Por encima de la frecuencia máxima, la salida deja de ser senoidal y se vuelve triangular. ¿Por qué?"
    libro: [118, 120]
    fijar: { SR: 500000, V_pk: 10, f_s: 16000 }
    widget:
      tipo: circuito
      esquema: ao-no-inversor
      piezas: { entrada: cero, amplitud: V_pk, f: f_s, sr: SR }
      grafica:
        x: { id: t, min: 0.0002, max: 0.0007, unidad: s, rotulo: "t" }
        y: { min: -12, max: 12, unidad: V, rotulo: "v" }
        curvas:
          - { expr: "V_pk*sin(2*pi*f_s*t)", color: tinta, rotulo: "la que se pide", mide: entrada, discontinua: true }
          - { expr: "(1 - s_t)*V_pk*sin(2*pi*f_s*t) + s_t*A_t*(4*abs((t - t_pk)*f_s - floor((t - t_pk)*f_s) - 0.5) - 1)", color: naranja, rotulo: "salida", mide: salida }
    opciones:
      - texto: "La salida sube y baja a su velocidad máxima, el SR, y no más"
        bien: true
        porque: "Una rampa de pendiente fija arriba y abajo es un triángulo; la amplitud se queda en lo que da tiempo a recorrer."
      - texto: "Porque el GBW recorta la ganancia"
        porque: "El GBW atenúa sin deformar; la deformación en triángulo es del slew rate, un límite de señal grande."
      - texto: "Porque la salida satura en los raíles"
        porque: "Saturar recortaría la cresta en plano, no la convertiría en rampas."
    escalera:
      - "¿Qué velocidad de cambio pide la senoide en su paso por cero?"
    solucion: "La salida cambia como mucho a SR V/s: rampas, es decir, un triángulo."

  - id: estime-offset
    tipo: simular
    fase: "Estime"
    titulo: "El offset amplificado"
    texto: "Un operacional de 3 mV de offset en un montaje de ganancia 100. ¿Qué error aparece en la salida?"
    libro: [113]
    fijar: { V_os: 0.003, G_c: 100 }
    simular:
      objetivo: e_os
      unidad: V
      tol: 0.05
      rotulo: "Error en la salida"
      errores:
        - { expr: "V_os", texto: "Esos 3 mV son el offset en la entrada: en la salida aparece multiplicado por la ganancia." }
    exito: "300 mV: el offset se amplifica por la ganancia de ruido. Importa en continua y con ganancia alta."
    escalera:
      - "Error de salida = V_{os} · G."
    solucion: "3 mV · 100 = 300 mV."
    comprobar:
      - { e_os: 0.3 }

  - id: decision
    tipo: pregunta
    fase: "Empareje"
    titulo: "El parámetro que manda"
    texto: "Una cada necesidad con el parámetro que hay que mirar."
    libro: [124, 131, 134]
    emparejar:
      - ["Exactitud en continua", "V_{os} y su deriva"]
      - ["Fuente de alta impedancia", "I_{B}: entrada FET o CMOS"]
      - ["Señal rápida y pequeña", "GBW"]
      - ["Señal rápida y grande", "Slew rate"]
      - ["Consumo", "I_{Q}: micropotencia"]
    exito: "El crítico primero; lo demás, aceptable. Y la letra pequeña: rail-to-rail de salida es llegar a milivoltios con carga ligera; con 10 mA, cientos."
    pistas:
      - { texto: "Grande y rápida es un límite de velocidad de la salida; pequeña y rápida, de ganancia." }
    escalera:
      - "Con fuentes de megaohmios, la corriente de entrada se vuelve tensión de error."
    solucion: "Continua–V_{os}, alta impedancia–I_{B}, pequeña–GBW, grande–SR, consumo–I_{Q}."

  - id: bajo-ruido
    tipo: pregunta
    titulo: "El de menos ruido"
    texto: "Para un sensor de megaohmios se elige el operacional de menor ruido de tensión del catálogo. ¿Es buena idea?"
    libro: [115, 127]
    widget:
      tipo: circuito
      esquema: ao-no-inversor
      piezas: { entrada: cero }
      mide: { vo: cero }
    opciones:
      - texto: "No: suele tener más I_{B}, y sobre megaohmios es peor que uno de entrada FET"
        bien: true
        porque: "Con 100 nA y 1 MΩ son 100 mV de error: los parámetros se compran unos a costa de otros."
      - texto: "Sí: menos ruido siempre es mejor"
        porque: "Con fuentes de alta impedancia manda la corriente de entrada, no el ruido de tensión."
      - texto: "Da igual: el operacional no carga la fuente"
        porque: "Su corriente de polarización atraviesa la resistencia de la fuente y crea un error."
    escalera:
      - "¿Qué hace la corriente de polarización al atravesar un megaohmio?"
    solucion: "No: con fuentes de alta impedancia conviene la entrada FET o CMOS."

  - id: banco-op
    tipo: elegir
    fase: "En el banco"
    titulo: "Tres medidas en el banco"
    texto: "La primera, el offset: el operacional como seguidor y la entrada a masa. Toque el hilo donde lo leería."
    libro: [139, 140, 141]
    widget:
      tipo: circuito
      esquema: ao-no-inversor
      piezas: { entrada: cero }
      mide: { vo: cero }
      mandos: []
    elegir:
      zonas: { "red:out": "Hilo de la derecha", "red:in": "Hilo de la entrada +", entrada: "La fuente de la entrada" }
      bien: ["red:out"]
      porque:
        "red:in": "Ahí solo está la masa de la entrada: el offset aparece, multiplicado por 1, en la salida."
        entrada: "La entrada está a masa: es lo que se aplica, no lo que se mide."
    exito: "La salida es V_{os}. Luego, el slew rate con un escalón grande y el margen saturándolo con una carga conocida."
    escalera:
      - "Con ganancia 1, lo que hay en la entrada aparece en la salida."
    solucion: "El hilo de salida del seguidor."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [113, 117, 119, 131]
    ideas:
      - { titulo: "GBW.", texto: "El ancho de banda del montaje es GBW dividido por su ganancia." }
      - { titulo: "Slew rate.", texto: "f_{máx} = SR/(2π · V_{pico}); por encima, triángulo." }
      - { titulo: "Errores de continua.", texto: "El offset se multiplica por la ganancia; I_{B}, por la resistencia de la fuente." }
      - { titulo: "Elegir.", texto: "El parámetro crítico primero; lo demás, aceptable." }
