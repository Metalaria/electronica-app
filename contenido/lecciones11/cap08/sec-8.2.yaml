# Lección 1.2 de la sección 8.2 «Configuraciones Fundamentales del AO» (cap08). Formato: contenido/lecciones11/GUIA.md.
# Sin esquema de operacional en el kit (petición en scratchpad/peticiones-motor12.md). La realimentación del no
# inversor se dibuja con el esquema «divisor»: su fuente es la SALIDA del operacional (la mueve el lector, que «hace
# de operacional») y el punto medio es la entrada −, como lo explica el libro (bloque 42: «la red R₁–R₂ es un divisor
# desde la salida»). Valores del ejemplo del libro: R₁ = 1 kΩ, R₂ = 9,1 kΩ, 100 mV.
# 1.2: el no inversor, el inversor y el integrador reales son los esquemas «ao-no-inversor», «ao-inversor» y
# «ao-integrador» (A = 10⁵). El «haga de operacional» sigue con el divisor (el lector es la salida). Integrador con
# 1 kΩ y 100 nF del libro y una cuadrada de 1 V a 500 Hz (ejemplo) con raíles de ±15 V (sección 8.1).
leccion: cap08/sec-8.2

libro:
  33: 'A_("v") = - (R_("2"))/(R_("1"))'
  36: 'A_("v") = "1" + (R_("2"))/(R_("1"))'
  38: "aísla una fuente débil de una carga exigente"
  39: "valor comercial 9,1 kΩ, que da ganancia 10,1"
  40: "con realimentación negativa, el operacional hace lo que haga falta para que sus dos entradas estén a la misma tensión"
  41: "Con 10 kΩ y 100 kΩ, ganancia −10. La impedancia de entrada es exactamente R₁"
  42: "la red R₁–R₂ es un divisor desde la salida"
  44: "Vout = −Rf·(V₁/R₁ + V₂/R₂ + …)"
  45: "Con 1 kΩ y 100 nF, τ = 0,1 ms, y un escalón de 1 V produce una rampa de 10 V por milisegundo"
  47: "con A = 10⁵ y ganancia 10, el error es del 0,011 %, despreciable; pero con ganancia 1000 sube casi al 1 % (0,99 %)"
  "cap08#246": "Diseña un amplificador inversor con ganancia −5 usando una resistencia de entrada de 2,2 kΩ"
  "cap08#22": "El operacional clásico se alimenta con ±15 V"

modelo:
  valores:
    V_out: { sim: "V_{salida}", nombre: "salida del operacional", unidad: V, valor: 1.5 }
    V_in: { sim: "V_{in}", nombre: "tensión en la entrada +", unidad: V, valor: 0.1 }
    R_1: { sim: "R₁", nombre: "resistencia a masa", unidad: Ω, valor: 1000 }
    R_2: { sim: "R₂", nombre: "resistencia de realimentación", unidad: Ω, valor: 9100 }
    R_a: { sim: "R₁", nombre: "resistencia de entrada", unidad: Ω, valor: 10000 }
    R_b: { sim: "R₂", nombre: "resistencia de realimentación", unidad: Ω, valor: 100000 }
    R_c2: { sim: "R₂", nombre: "resistencia de realimentación", unidad: Ω, valor: 4700 }
    G_n: { sim: "|A_{v}|", nombre: "ganancia ideal", unidad: "", valor: 10 }
    A_ol: { sim: "A", nombre: "ganancia en lazo abierto", unidad: "", valor: 100000 }
    R_i: { sim: "R", nombre: "resistencia del integrador", unidad: Ω, valor: 1000 }
    C_i: { sim: "C", nombre: "condensador del integrador", unidad: F, valor: 100e-9 }
    V_e: { sim: "V_{in}", nombre: "escalón de entrada", unidad: V, valor: 1 }
    R_k: { sim: "R₁", nombre: "resistencia de entrada", unidad: Ω, valor: 2200 }
    V_1: { sim: "V_{in}", nombre: "tensión de entrada", unidad: V, valor: 1 }
    cero: { sim: "0", nombre: "nivel de continua", unidad: V, valor: 0 }
    f_q: { sim: "f", nombre: "frecuencia de la cuadrada", unidad: Hz, valor: 500 }
    forma_q: { sim: "forma", nombre: "forma cuadrada", unidad: "", valor: 1 }
    V_sat: { sim: "V_{sat}", nombre: "raíles del operacional", unidad: V, valor: 15 }
  calculos:
    V_m: { expr: "V_out*R_1/(R_1 + R_2)", sim: "V_{−}", nombre: "tensión de la entrada −", unidad: V }
    I_f: { expr: "V_out/(R_1 + R_2)", sim: "I", nombre: "corriente por la red", unidad: A }
    A_ni: { expr: "1 + R_b/R_a", sim: "A_{v}", nombre: "ganancia del no inversor", unidad: "", cifras: 3 }
    A_in: { expr: "-R_b/R_a", sim: "A_{v}", nombre: "ganancia del inversor", unidad: "", cifras: 3 }
    A_c: { expr: "-R_c2/2200", sim: "A_{v}", nombre: "ganancia del inversor", unidad: "", cifras: 3 }
    e_g: { expr: "100*(1 - 1/(1 + (1 + G_n)/A_ol))", sim: "error", nombre: "error por la ganancia finita", unidad: "%", cifras: 2 }
    tau_i: { expr: "R_i*C_i", sim: "τ", nombre: "constante del integrador", unidad: s }
    p_i: { expr: "V_e/tau_i", sim: "pendiente", nombre: "pendiente de la rampa", unidad: "V/s" }
    V_on: { expr: "V_in*(1 + R_2/R_1)", sim: "V_{salida}", nombre: "salida del no inversor", unidad: V }
    V_oa: { expr: "V_in*A_ni", sim: "V_{salida}", nombre: "salida del no inversor", unidad: V }
    V_oi: { expr: "V_in*A_in", sim: "V_{salida}", nombre: "salida del inversor", unidad: V }
    V_oc: { expr: "V_1*A_c", sim: "V_{salida}", nombre: "salida del inversor", unidad: V }
    I_1: { expr: "V_in/R_a", sim: "I₁", nombre: "corriente que entra por R₁", unidad: A }
    T_q: { expr: "1/f_q", sim: "T", nombre: "periodo de la cuadrada", unidad: s }

tarjetas:
  - id: explore-divisor
    tipo: explorar
    titulo: "Un divisor desde la salida"
    texto: "En el no inversor, R₂ y R₁ dividen la salida hacia la entrada −. Mueva la entrada y cambie R₂: mire la entrada −."
    libro: [39, 42]
    fijar: { R_1: 1000 }
    widget:
      tipo: circuito
      esquema: ao-no-inversor
      piezas: { entrada: V_in, r1: R_1, r2: R_2 }
      lectura: { valor: V_on, rotulo: "Salida" }
      datos:
        - { valor: V_in, rotulo: "Entrada −: {{V_in}}" }
      mide: { vo: V_on, vmenos: V_in }
      mandos:
        - { valor: V_in, min: -0.2, max: 0.2, paso: 0.01, rotulo: "Entrada +" }
        - { valor: R_2, lista: [9100, 47000], rotulo: "R₂" }
    requiere: { mover: [V_in] }

  - id: haga-de-operacional
    tipo: ajuste
    titulo: "Haga de operacional"
    texto: "No inversor: R₂ y R₁ forman un divisor desde la salida. Mueva la salida hasta que la entrada − iguale los 100 mV de la +."
    nota: "La fuente del dibujo es la salida del operacional."
    libro: [40, 42]
    fijar: { V_in: 0.1, R_1: 1000, R_2: 9100 }
    inicio: { V_out: 1.5 }
    widget:
      tipo: circuito
      esquema: divisor
      piezas: { fuente: V_out, arriba: R_2, abajo: R_1 }
      lectura: { valor: V_m, rotulo: "Entrada −" }
      corriente: I_f
      mide: { salida: V_m, corriente: I_f }
      mandos:
        - { valor: V_out, min: 0, max: 2, paso: 0.01, rotulo: "Salida del operacional" }
    ajuste:
      valor: V_m
      objetivo: 0.1
      tol: 0.02
      rotulo: "Entrada −"
      escala: { min: 0, max: 0.2 }
      bajo: "La entrada − se queda por debajo de la +: suba la salida."
      alto: "La entrada − supera a la +: baje la salida."
      dentro: "Con 1,01 V en la salida, las entradas se igualan: ganancia 10,1."
    comprobar:
      - { con: { V_out: 1.01 }, V_m: 0.1 }

  - id: prediga-no-inversor
    tipo: predecir
    titulo: "El mismo par, otra configuración"
    texto: "Con R₁ = 10 kΩ y R₂ = 100 kΩ, el inversor da −10. ¿Qué ganancia da el no inversor?"
    libro: [41, 42]
    fijar: { R_a: 10000, R_b: 100000, V_in: 0.1 }
    widget:
      tipo: circuito
      esquema: ao-no-inversor
      piezas: { entrada: V_in, r1: R_a, r2: R_b }
      lectura: { valor: A_ni, rotulo: "Ganancia del no inversor" }
      mide: { vo: V_oa }
      ocultar: true
    opciones:
      - texto: "11"
        bien: true
        porque: "1 + R₂/R₁ = 1 + 10 = 11, y en fase con la entrada."
      - texto: "10"
        porque: "Ese es el módulo del inversor. El no inversor suma el 1 del divisor."
      - texto: "−11"
        porque: "El no inversor no invierte: la señal entra por la entrada +."
    escalera:
      - "La salida, dividida por el divisor R₁–R₂, debe igualar a V_{in}."
    solucion: "A_{v} = 1 + 100/10 = 11."
    comprobar:
      - { A_ni: 11, A_in: -10 }

  - id: regla-no-inversor
    tipo: formula
    titulo: "No inversor"
    texto: "La ganancia es siempre mayor o igual que 1: el divisor solo puede atenuar. Cambie R₂."
    libro: [36, 42]
    ec: 36
    sustitucion: "1 + {{R_b}} / {{R_a}} = {{A_ni}}"
    fijar: { R_a: 10000 }
    widget:
      tipo: grafica
      x: { id: vx, min: -1, max: 1, unidad: V, rotulo: "V_{in}" }
      y: { min: -15, max: 15, unidad: V, rotulo: "V_{salida}" }
      curvas:
        - { expr: "max(-15, min(15, (1 + R_b/R_a)*vx))", color: azul, rotulo: "no inversor" }
      lectura: { valor: A_ni, rotulo: "Ganancia" }
      mandos:
        - { valor: R_b, lista: [0, 10000, 47000, 100000], rotulo: "R₂" }

  - id: regla-inversor
    tipo: formula
    titulo: "Inversor"
    texto: "La entrada + a masa deja la − en masa virtual: toda la corriente de R₁ sigue por R₂."
    libro: [33, 41]
    ec: 33
    sustitucion: "−{{R_b}} / {{R_a}} = {{A_in}}"
    fijar: { R_a: 10000, V_in: 0.1 }
    widget:
      tipo: circuito
      esquema: ao-inversor
      piezas: { entrada: V_in, r1: R_a, r2: R_b }
      lectura: { valor: A_in, rotulo: "Ganancia" }
      datos:
        - { valor: V_oi, rotulo: "Salida: {{V_oi}}" }
      corriente: I_1
      mide: { vo: V_oi, i1: I_1 }
      mandos:
        - { valor: R_b, lista: [10000, 47000, 100000], rotulo: "R₂" }

  - id: reto-menos-cinco
    tipo: reto
    titulo: "Ganancia −5"
    texto: "Un inversor con R₁ = 2,2 kΩ debe dar −5. Elija R₂ de la serie E24."
    libro: [33, "cap08#246"]
    inicio: { R_c2: 4700 }
    fijar: { V_1: 1 }
    widget:
      tipo: circuito
      esquema: ao-inversor
      piezas: { entrada: V_1, r1: R_k, r2: R_c2 }
      lectura: { valor: A_c, rotulo: "Ganancia" }
      datos:
        - { valor: V_oc, rotulo: "Salida con 1 V: {{V_oc}}" }
      mide: { vo: V_oc }
      mandos:
        - { valor: R_c2, serie: E24, min: 1000, max: 100000, rotulo: "R₂ (E24)" }
    condiciones:
      - { valor: A_c, objetivo: -5, tol: 0.02, rotulo: "Ganancia: {{A_c}}" }
    exito: "11 kΩ exacto. En E12 habría que elegir 10 kΩ (−4,55) o 12 kΩ (−5,45)."
    pistas:
      - { cuando: { valor: A_c, mayor: -4.9 }, texto: "Le falta ganancia: R₂ tiene que ser mayor." }
      - { texto: "Le sobra ganancia: R₂ tiene que ser menor." }
    escalera:
      - "R₂ = 5 · R₁."
    solucion: "R₂ = 5 · 2,2 kΩ = 11 kΩ, que existe en E24."
    comprobar:
      - { con: { R_c2: 11000 }, A_c: -5 }
      - { con: { R_c2: 10000 }, A_c: -4.545 }
      - { con: { R_c2: 12000 }, A_c: -5.455 }

  - id: sorpresa-ganancia-finita
    tipo: sorpresa
    titulo: "Cuando el operacional no es ideal"
    texto: "Con A = 10⁵, suba la ganancia ideal del montaje y mire el error que añade la ganancia finita."
    libro: [47]
    fijar: { A_ol: 100000 }
    inicio: { G_n: 10 }
    widget:
      tipo: grafica
      x: { id: gx, min: 1, max: 10000, unidad: "", rotulo: "ganancia del montaje", escala: log }
      y: { min: 0, max: 10, unidad: "%", rotulo: "error" }
      curvas:
        - { expr: "100*(1 - 1/(1 + (1 + gx)/A_ol))", color: azul, rotulo: "error" }
      asas:
        - { mueve: G_n, x: "G_n", y: "e_g", rotulo: "Su montaje" }
      lectura: { valor: e_g, rotulo: "Error por la ganancia finita" }
      mandos:
        - { valor: G_n, lista: [1, 10, 100, 1000, 10000], rotulo: "Ganancia del montaje" }
    requiere: { mover: [G_n] }
    comprobar:
      - { e_g: 0.011, tol: 0.01 }
      - { con: { G_n: 1000 }, e_g: 0.99, tol: 0.01 }

  - id: por-que-pasivos
    tipo: porque
    titulo: "¿De dónde sale la precisión?"
    texto: "Con ganancias moderadas, el error del operacional es despreciable. ¿Qué fija entonces la precisión del montaje?"
    libro: [47]
    fijar: { A_ol: 100000 }
    widget:
      tipo: grafica
      x: { id: gx, min: 1, max: 10000, unidad: "", rotulo: "ganancia del montaje", escala: log }
      y: { min: 0, max: 10, unidad: "%", rotulo: "error" }
      curvas:
        - { expr: "100*(1 - 1/(1 + (1 + gx)/A_ol))", color: azul, rotulo: "error" }
    opciones:
      - texto: "Las resistencias: la precisión se pone en los pasivos"
        bien: true
        porque: "Resistencias del 0,1 % fijan la ganancia; el operacional solo tiene que ser suficientemente grande."
      - texto: "La ganancia en lazo abierto del operacional"
        porque: "Solo pesa cuando la ganancia del montaje es muy alta o la frecuencia la ha hecho caer."
      - texto: "La tensión de alimentación"
        porque: "No aparece en las fórmulas de ganancia."
    escalera:
      - "¿Qué aparece en A_{v} = 1 + R₂/R₁?"
    solucion: "Las resistencias: la precisión se pone en los pasivos."

  - id: dibuje-integrador
    tipo: dibujar
    titulo: "Dibuje el integrador"
    texto: "Integrador inversor con 1 kΩ y 100 nF. Entra un escalón de 1 V en t = 0: dibuje la salida durante 1 ms."
    libro: [45]
    fijar: { R_i: 1000, C_i: 100e-9, V_e: 1 }
    dibujar:
      x: { id: tx, min: 0, max: 0.001, unidad: s, rotulo: "t" }
      y: { min: -12, max: 2, unidad: V, rotulo: "V_{salida}" }
      curva: "-V_e*tx/(R_i*C_i)"
      puntos: 21
      tol: 0.08
      holgura: 0.03
      rotulo: "Salida del integrador"
    exito: "Una rampa de 10 V por milisegundo, hacia abajo: τ = 0,1 ms."
    pistas:
      - { cuando: { valor: media, mayor: 0 }, texto: "El integrador es inversor: con 1 V positivo, la salida baja." }
      - { texto: "Es una rampa recta: corriente constante V_{in}/R cargando el condensador." }
    escalera:
      - "La corriente V_{in}/R es constante: la tensión del condensador crece en línea recta."
      - "Pendiente: V_{in}/(R · C)."
    solucion: "Rampa de 0 a −10 V en 1 ms."
    comprobar:
      - { tau_i: 0.0001, p_i: 10000 }

  - id: explore-integrador
    tipo: explorar
    titulo: "El integrador en el circuito"
    texto: "El mismo integrador con una cuadrada de 1 V: cada semiperiodo, una rampa. Cambie el condensador."
    nota: "Cuadrada de ejemplo a 500 Hz; raíles de ±15 V."
    libro: [45, "cap08#22"]
    fijar: { R_i: 1000, V_e: 1, f_q: 500, V_sat: 15 }
    inicio: { C_i: 100e-9 }
    widget:
      tipo: circuito
      esquema: ao-integrador
      piezas: { entrada: cero, amplitud: V_e, f: f_q, forma: forma_q, r: R_i, c: C_i, vsat: V_sat }
      lectura: { valor: p_i, rotulo: "Pendiente de la rampa" }
      grafica:
        x: { id: t, min: 0, max: 0.004, unidad: s, rotulo: "t" }
        y: { min: -12, max: 2, unidad: V, rotulo: "v" }
        curvas:
          - { expr: "V_e*(1 - 2*floor(2*(t/T_q - floor(t/T_q))))", color: tinta, rotulo: "v_{in}", mide: entrada, discontinua: true }
          - { expr: "-V_e/(R_i*C_i)*(T_q/2 - abs(t - T_q*floor(t/T_q) - T_q/2))", color: naranja, rotulo: "v_{o}", mide: salida }
      mandos:
        - { valor: C_i, lista: [100e-9, 220e-9], rotulo: "C" }

  - id: configuraciones
    tipo: pregunta
    fase: "Empareje"
    titulo: "Seis configuraciones, un principio"
    texto: "Una cada configuración con lo que la distingue."
    libro: [38, 41, 44, 45]
    emparejar:
      - ["Seguidor", "Ganancia 1: adapta impedancias"]
      - ["Inversor", "Impedancia de entrada igual a R₁"]
      - ["Sumador", "Cada entrada con su resistencia en la masa virtual"]
      - ["Integrador", "Un condensador en lugar de R₂"]
    exito: "Todas salen de la misma idea: con realimentación negativa, las entradas se igualan."
    pistas:
      - { texto: "El seguidor es el no inversor con la salida unida a la entrada −, sin R₂." }
    escalera:
      - "El sumador es el mezclador de audio."
    solucion: "Seguidor–adaptador, inversor–R₁, sumador–masa virtual, integrador–condensador."

  - id: impedancia-inversor
    tipo: pregunta
    titulo: "Un sensor de alta impedancia"
    texto: "¿Por qué no se conecta un inversor con R₁ = 10 kΩ a un sensor de alta impedancia?"
    libro: [41, 42]
    fijar: { R_a: 10000, R_b: 100000, V_in: 0.1 }
    widget:
      tipo: circuito
      esquema: ao-inversor
      piezas: { entrada: V_in, r1: R_a, r2: R_b }
      datos:
        - { valor: I_1, rotulo: "Corriente que pide a la fuente: {{I_1}}" }
      corriente: I_1
      mide: { vo: V_oi, i1: I_1 }
    opciones:
      - texto: "Su impedancia de entrada es solo R₁: cargaría el sensor"
        bien: true
        porque: "El otro extremo de R₁ está en masa virtual. El no inversor, en cambio, no carga la fuente."
      - texto: "Porque invierte la señal"
        porque: "Invertir no es el problema; cargar la fuente, sí."
      - texto: "Porque su ganancia depende del sensor"
        porque: "Depende de él precisamente porque lo carga: la impedancia de entrada es R₁."
    escalera:
      - "¿Qué ve el sensor desde la entrada del inversor?"
    solucion: "Solo R₁, que forma un divisor con la impedancia del sensor."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [33, 36, 40, 47]
    ideas:
      - { titulo: "Un principio.", texto: "Con realimentación negativa, el operacional iguala sus entradas." }
      - { titulo: "Inversor.", texto: "A_{v} = −R₂/R₁, con impedancia de entrada R₁." }
      - { titulo: "No inversor.", texto: "A_{v} = 1 + R₂/R₁: la salida dividida iguala a la entrada." }
      - { titulo: "Precisión.", texto: "La ponen las resistencias; el operacional solo debe ser bastante bueno." }
