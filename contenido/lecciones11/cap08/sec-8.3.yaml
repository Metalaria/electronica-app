# Lección 1.2 de la sección 8.3 «El Comparador y la Histéresis» (cap08). Formato: contenido/lecciones11/GUIA.md.
# Valores del libro: R₁ = 10 kΩ, R₂ = 100 kΩ, ±12 V, ruido de 1 V de pico a pico. La señal lenta (una rampa de −3 a
# +3 V en 10 ms con 1 V pp de ruido a 1,5 kHz) es un ejemplo para dibujar los umbrales.
# 1.2: el disparador es el esquema «comparador-schmitt» (la entrada por la −; R₁ a masa y R₂ desde la salida a la +).
# La senoide de 5 V de pico a 100 Hz que lo hace conmutar y la tolerancia de ± 5 % del diseño son ejemplos míos: el
# ruido (rampa con ruido) sigue en gráfica porque el esquema no tiene esa señal.
leccion: cap08/sec-8.3

libro:
  50: "si la señal de entrada tiene ruido, la salida conmuta erráticamente cerca del punto de comparación"
  51: "el umbral de conmutación es distinto al subir que al bajar"
  53: "no existe una tensión de entrada que produzca una salida intermedia estable"
  54: "Con R₁ = 10 kΩ, R₂ = 100 kΩ y salida de ±12 V, los umbrales están en +1,09 V y −1,09 V: una ventana de 2,18 V"
  55: "Un operacional con realimentación positiva no tiene punto de equilibrio intermedio: es biestable"
  56: "Los comparadores de verdad (LM311, LM393) tienen salida de colector abierto"
  57: "Detección de nivel (batería baja, sobretemperatura, cruce por cero de la red)"
  58: "la histéresis de ±1,09 V elimina las conmutaciones falsas"

modelo:
  valores:
    R_1: { sim: "R₁", nombre: "resistencia a la referencia", unidad: Ω, valor: 10000 }
    R_2: { sim: "R₂", nombre: "resistencia de realimentación positiva", unidad: Ω, valor: 100000 }
    V_sat: { sim: "V_{sat}", nombre: "salida saturada", unidad: V, valor: 12 }
    s_h: { tipo: interruptor, nombre: "histéresis", valor: 1 }
    T_r: { sim: "T", nombre: "duración de la rampa", unidad: s, valor: 0.01 }
    A_r: { sim: "V_{ruido}", nombre: "ruido de pico", unidad: V, valor: 0.5 }
    V_in: { sim: "v_{in}", nombre: "tensión de entrada", unidad: V, valor: 0 }
    alto: { tipo: interruptor, nombre: "salida en alto antes", valor: 1 }
    A_s: { sim: "V_{p}", nombre: "amplitud de la senoide", unidad: V, valor: 5 }
    f_s: { sim: "f", nombre: "frecuencia de la senoide", unidad: Hz, valor: 100 }
    cero: { sim: "0", nombre: "nivel de continua", unidad: V, valor: 0 }
    t_r: { sim: "tol", nombre: "tolerancia de las resistencias", unidad: "", valor: 0.05 }
    a_rp: { sim: "A", nombre: "amplitud de la rampa", unidad: V, valor: 3 }
    f_rp: { sim: "f", nombre: "frecuencia de la rampa", unidad: Hz, valor: 100 }
    fm_rp: { sim: "forma", nombre: "forma de la entrada (rampa)", unidad: "", valor: 3 }
    ru: { sim: "ruido", nombre: "amplitud del ruido", unidad: V, valor: 0.5 }
  calculos:
    V_uh: { expr: "V_sat*R_1/(R_1 + R_2)", sim: "V_{U}", nombre: "umbral del disparador", unidad: V }
    hi: { expr: "1 - ceil((V_in - V_uh)/1e9)", sim: "a", nombre: "el alto se sostiene", unidad: "" }
    lo: { expr: "ceil((V_in + V_uh)/1e9)", sim: "b", nombre: "el bajo se sostiene", unidad: "" }
    V_o: { expr: "V_sat*(2*(alto*hi + (1 - alto)*(1 - lo)) - 1)", sim: "v_{o}", nombre: "tensión de salida", unidad: V }
    V_p: { expr: "V_o*R_1/(R_1 + R_2)", sim: "v_{+}", nombre: "tensión de la entrada +", unidad: V }
    th: { expr: "asin(V_uh/A_s)", sim: "θ", nombre: "fase del umbral", unidad: "" }
    t_p: { expr: "100*t_r", sim: "tol", nombre: "tolerancia en porcentaje", unidad: "%" }
    V_u: { si: s_h, entonces: "V_sat*R_1/(R_1 + R_2)", sino: "0", sim: "V_{umbral}", nombre: "umbral superior", unidad: V }
    V_mal: { expr: "V_sat*R_1/R_2", sim: "V", nombre: "sin el divisor completo", unidad: V }
    V_w: { expr: "2*V_u", sim: "ventana", nombre: "anchura de la ventana", unidad: V }

tarjetas:
  - id: explore-ventana
    tipo: explorar
    titulo: "Una ventana contra el ruido"
    texto: "Una señal lenta con 1 V de ruido de pico a pico y los dos umbrales del disparador de Schmitt. Cambie R₂."
    nota: "Señal de ejemplo."
    libro: [51, 54]
    fijar: { R_1: 10000, V_sat: 12, s_h: 1 }
    widget:
      tipo: grafica
      x: { id: t, min: 0, max: 0.01, unidad: s, rotulo: "t" }
      y: { min: -4, max: 4, unidad: V, rotulo: "v_{entrada}" }
      curvas:
        - { expr: "-3 + 6*t/T_r + A_r*sin(2*pi*1500*t)", color: azul, rotulo: "señal con ruido" }
        - { expr: "V_u", color: naranja, rotulo: "umbral al subir", discontinua: true }
        - { expr: "-V_u", color: tinta, rotulo: "umbral al bajar", discontinua: true }
      lectura: { valor: V_w, rotulo: "Anchura de la ventana" }
      mandos:
        - { valor: R_2, lista: [47000, 100000, 220000, 470000, 1000000], rotulo: "R₂" }

  - id: prediga-umbrales
    tipo: predecir
    titulo: "Los umbrales"
    texto: "R₁ = 10 kΩ, R₂ = 100 kΩ y salida de ±12 V. ¿Dónde están los umbrales?"
    libro: [54]
    fijar: { R_1: 10000, R_2: 100000, V_sat: 12, s_h: 1, V_in: 0, alto: 1 }
    widget:
      tipo: circuito
      esquema: comparador-schmitt
      piezas: { entrada: V_in, r1: R_1, r2: R_2, vsat: V_sat, alto: alto }
      lectura: { valor: V_u, rotulo: "Umbral superior" }
      mide: { vo: V_o, vmas: V_p }
      ocultar: true
    opciones:
      - texto: "En ±1,09 V"
        bien: true
        porque: "±12 · 10/(10 + 100) = ±1,09 V: la salida, dividida por R₁–R₂, fija la entrada +."
      - texto: "En ±1,2 V"
        porque: "Sería 12 · R₁/R₂. El divisor es R₁/(R₁ + R₂)."
      - texto: "En 0 V"
        porque: "Ese es el comparador sin histéresis. La realimentación positiva separa los dos umbrales."
    escalera:
      - "V_{umbral} = ±V_{sat} · R₁/(R₁ + R₂)."
    solucion: "12 · 10/(10 + 100) = 1,09 V: ventana de 2,18 V."
    comprobar:
      - { V_u: 1.09, V_w: 2.18, V_mal: 1.2, tol: 0.01 }

  - id: explore-tiempo
    tipo: explorar
    titulo: "Dos umbrales en el tiempo"
    texto: "Una senoide entra por la −. Cambie R₂ y mire dónde conmuta la salida al subir y al bajar."
    nota: "Senoide de ejemplo de 5 V de pico."
    libro: [51, 54, 55]
    fijar: { R_1: 10000, V_sat: 12, A_s: 5 }
    inicio: { R_2: 100000 }
    widget:
      tipo: circuito
      esquema: comparador-schmitt
      piezas: { entrada: cero, amplitud: A_s, f: f_s, r1: R_1, r2: R_2, vsat: V_sat }
      lectura: { valor: V_uh, rotulo: "Umbral" }
      grafica:
        x: { id: t, min: 0, max: 0.03, unidad: s, rotulo: "t" }
        y: { min: -14, max: 14, unidad: V, rotulo: "v" }
        curvas:
          - { expr: "A_s*sin(2*pi*f_s*t)", color: tinta, rotulo: "v_{in}", mide: entrada, discontinua: true }
          - { expr: "V_sat*(2*abs(floor((2*pi*f_s*t - 2*pi*floor(f_s*t) - th)/pi)) - 1)", color: naranja, rotulo: "v_{o}", mide: salida }
          - { expr: "V_uh*(2*abs(floor((2*pi*f_s*t - 2*pi*floor(f_s*t) - th)/pi)) - 1)", color: azul, rotulo: "v_{+}", mide: umbral }
      mandos:
        - { valor: R_2, lista: [47000, 100000, 220000], rotulo: "R₂" }
    requiere: { mover: [R_2] }

  - id: reto-ventana
    tipo: diseno
    titulo: "Más que el ruido"
    texto: "R₁ = 10 kΩ, ±12 V y 1 V de ruido de pico a pico. Elija R₂ (E12) para que la ventana lo supere."
    nota: "Resistencias del 5 %: debe cumplir en todas las esquinas."
    libro: [54]
    fijar: { R_1: 10000, V_sat: 12, s_h: 1, V_in: 0, alto: 1 }
    inicio: { R_2: 1000000 }
    widget:
      tipo: circuito
      esquema: comparador-schmitt
      piezas: { entrada: V_in, r1: R_1, r2: R_2, vsat: V_sat, alto: alto }
      lectura: { valor: V_w, rotulo: "Anchura de la ventana" }
      mide: { vo: V_o, vmas: V_p }
      mandos:
        - { valor: R_2, serie: E12, min: 47000, max: 1000000, rotulo: "R₂ (E12)" }
    condiciones:
      - { valor: V_w, mayor: 1, rotulo: "Ventana: {{V_w}}" }
    diseno:
      tolerancias: { R_1: 0.05, R_2: 0.05 }
      metodo: esquinas
      exigir: todas
      si_tolerancias: "El nominal pasa, pero en la peor esquina la ventana se queda corta: baje R₂ un valor más."
    exito: "Tras cruzar un umbral, el ruido ya no alcanza el otro. Y no más de lo necesario: cada voltio de histéresis es retraso."
    pistas:
      - { texto: "La ventana es más estrecha que el ruido: baje R₂ para que la salida realimente más." }
    escalera:
      - "La ventana va de −V_{umbral} a +V_{umbral}, con V_{umbral} = 12 · R₁/(R₁ + R₂)."
      - "Con 220 kΩ el nominal da 1,04 V: casi nada de margen para las tolerancias."
    solucion: "180 kΩ: 1,26 V nominal, y más de 1 V en todas las esquinas."
    comprobar:
      - { con: { R_2: 220000 }, V_w: 1.04, tol: 0.01 }
      - { con: { R_2: 180000 }, V_w: 1.263, tol: 0.01 }
      - { t_p: 5 }

  - id: sorpresa-sin
    tipo: sorpresa
    titulo: "Sin histéresis"
    texto: "Sin realimentación positiva queda un solo umbral, en cero. Suba el ruido de la rampa y mire la salida al cruzarlo."
    libro: [50, 53, 58]
    fijar: { R_1: 10000, V_sat: 12 }
    inicio: { ru: 0 }
    widget:
      tipo: circuito
      esquema: comparador-schmitt
      piezas: { entrada: cero, amplitud: a_rp, f: f_rp, forma: fm_rp, ruido: ru, r1: R_1, ref: cero, vsat: V_sat }
      dibujo: false
      grafica:
        x: { id: t, min: 0, max: 0.01, unidad: s, rotulo: "t" }
        y: { min: -14, max: 14, unidad: V, rotulo: "v" }
        curvas:
          - { expr: "cero - a_rp + 2*a_rp*(t*f_rp - floor(t*f_rp)) + ru*(sin(2*pi*37*f_rp*t) + sin(2*pi*61*f_rp*t) + sin(2*pi*97*f_rp*t))/3", color: tinta, rotulo: "v_{in}", mide: entrada }
          - { expr: "V_sat*(1 - 2*ceil((cero - a_rp + 2*a_rp*(t*f_rp - floor(t*f_rp)) + ru*(sin(2*pi*37*f_rp*t) + sin(2*pi*61*f_rp*t) + sin(2*pi*97*f_rp*t))/3 - cero)/1e9))", color: naranja, rotulo: "v_{o}", mide: salida }
      mandos:
        - { valor: ru, lista: [0, 0.25, 0.5], rotulo: "Ruido" }
    requiere: { mover: [ru] }

  - id: por-que-positiva
    tipo: porque
    titulo: "¿Por qué positiva?"
    texto: "La histéresis se consigue con realimentación positiva. ¿Por qué estabiliza el estado?"
    libro: [55]
    fijar: { R_1: 10000, R_2: 100000, V_sat: 12, s_h: 1 }
    inicio: { V_in: 0, alto: 1 }
    widget:
      tipo: circuito
      esquema: comparador-schmitt
      piezas: { entrada: V_in, r1: R_1, r2: R_2, vsat: V_sat, alto: alto }
      lectura: { valor: V_o, rotulo: "v_{o}" }
      datos:
        - { valor: V_p, rotulo: "Entrada +: {{V_p}}" }
      mide: { vo: V_o, vmas: V_p }
      mandos:
        - { valor: V_in, min: -2, max: 2, paso: 0.25, rotulo: "Entrada" }
        - { valor: alto, tipo: interruptor, rotulo: "Salida en alto antes" }
    opciones:
      - texto: "Al saltar, la salida aleja el umbral y refuerza el estado"
        bien: true
        porque: "Es biestable: no hay equilibrio intermedio. Es también la base de los osciladores de relajación."
      - texto: "Porque la realimentación positiva iguala las entradas"
        porque: "Eso lo hace la negativa. La positiva empuja la salida a un extremo."
      - texto: "Porque reduce la ganancia"
        porque: "No la reduce: la salida refuerza la entrada que la produjo."
    escalera:
      - "Cuando la salida sube, ¿qué le pasa a la tensión de la entrada +?"
    solucion: "La salida refuerza la entrada que la produjo: el umbral se aleja."

  - id: comparador-integrado
    tipo: pregunta
    titulo: "Comparador o operacional"
    texto: "Hay que detectar un umbral con rapidez y atacar una entrada lógica. ¿Qué se usa?"
    libro: [56]
    fijar: { R_1: 10000, R_2: 100000, V_sat: 12, V_in: 0, alto: 1 }
    widget:
      tipo: circuito
      esquema: comparador-schmitt
      piezas: { entrada: V_in, r1: R_1, r2: R_2, vsat: V_sat, alto: alto }
      mide: { vo: V_o, vmas: V_p }
    opciones:
      - texto: "Un comparador como el LM393, con salida de colector abierto"
        bien: true
        porque: "Responde en centenares de nanosegundos y, con un pull-up, da cualquier nivel lógico."
      - texto: "Un operacional, que tiene más ganancia"
        porque: "Tarda microsegundos en salir de saturación y su salida no es compatible con lógica."
      - texto: "Un operacional de precisión"
        porque: "Es la elección para precisión de umbral en continua, no para rapidez."
    escalera:
      - "¿Qué pasa cuando un operacional sale de saturación?"
    solucion: "Un comparador dedicado: rápido y con salida de colector abierto."

  - id: usos
    tipo: pregunta
    fase: "Empareje"
    titulo: "Los dos usos y sus límites"
    texto: "Una cada idea con su par."
    libro: [54, 57]
    emparejar:
      - ["Detección de nivel", "Batería baja o sobretemperatura"]
      - ["Señal lenta a digital limpia", "Un sensor magnético o un fotodiodo"]
      - ["Lo que fija la histéresis", "El ruido de pico a pico esperado"]
      - ["Lo que la limita", "El retardo que se admite"]
    exito: "Primero, cuánto ruido hay; después, cuánto retardo se tolera."
    pistas:
      - { texto: "Cada voltio de histéresis es un voltio de retraso en la detección." }
    escalera:
      - "La histéresis se diseña algo mayor que el ruido."
    solucion: "Nivel–batería, digital–sensor, ruido–fija, retardo–limita."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [50, 54, 55, 56]
    ideas:
      - { titulo: "Sin histéresis.", texto: "El ruido cerca del umbral produce un tren de conmutaciones." }
      - { titulo: "Schmitt.", texto: "V_{umbral} = ±V_{sat} · R₁/(R₁ + R₂): dos umbrales y una ventana." }
      - { titulo: "Realimentación positiva.", texto: "Biestable: la salida refuerza su estado." }
      - { titulo: "Comparador dedicado.", texto: "Rápido y con salida de colector abierto para la lógica." }
