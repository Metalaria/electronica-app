# Lección 1.2 de la sección 8.9 «Comparadores Dedicados y Muestreo y Retención» (cap08). Formato: contenido/lecciones11/GUIA.md.
# La adquisición (el condensador de retención cargándose a través de R_on y la fuente) se dibuja con el esquema
# «carga-rc»; el escalón de 1 V de entrada es un ejemplo. Los valores de R, C, carga y fuga son los del libro.
# 1.2: el muestreo es el esquema «muestreo-retencion» (interruptor con R_on, C_h y seguidor), con la retención a los
# 9 µs (ejemplo: después de 8,3 τ también con 1 kΩ); el comparador, el «comparador-schmitt» sin realimentación (±12 V
# de ejemplo). La pantalla del banco (pedestal y caída) va con un eje estrecho alrededor de 1 V.
# 1.2.1 (autor121-ana, «aprender haciendo», GUIA §13): la R que adquiere antes de retener se elige (objetivo), los
# 12 bits se marcan en la curva de carga, el pedestal y la caída se predicen (simular), la fuga se sube hasta 10 mV
# por milisegundo, el condensador se agranda hasta 1 mV de pedestal y la pieza con absorción dieléctrica se toca en el
# esquema. Quedan una pregunta de opciones (el compromiso) y el emparejamiento del operacional como comparador; el
# pull-up y la oscilación por acoplamiento pasan a su explicación.
leccion: cap08/sec-8.9

libro:
  182: "Recuperarse de esa saturación lleva microsegundos"
  183: "Un comparador tiene salida de colector abierto"
  184: "Muchos operacionales llevan diodos de protección entre entradas que conducen por encima de ±0,7 V"
  185: "los clásicos LM311, LM393 y LM339 no"
  188: "sin resistencia de pull-up su salida no sube nunca"
  190: "la propia conmutación de la salida acopla ruido a la entrada"
  191: "histéresis externa suficiente (sección 8.3), desacoplo junto al chip, y separación física"
  193: "Consta de un interruptor analógico (sección 8.8), un condensador de retención y un seguidor de alta impedancia"
  196: "Para una exactitud de 12 bits hacen falta 8,3 constantes de tiempo (sección 8.8): con 100 Ω y 1 nF, unos 830 ns"
  197: "con 10 pC sobre 1 nF, 10 mV"
  198: "Con 1 nA sobre 1 nF, la tensión cae 1 mV por milisegundo"
  201: "un polipropileno o un poliestireno, de 0,001 a 0,02 %"
  203: "el salto de pedestal en el flanco de retención y la pendiente del droop"

modelo:
  valores:
    V_e: { sim: "V_{entrada}", nombre: "escalón de entrada", unidad: V, valor: 1 }
    R_a: { sim: "R", nombre: "R_on más la fuente", unidad: Ω, valor: 100 }
    C_h: { sim: "C_{h}", nombre: "condensador de retención", unidad: F, valor: 1e-9 }
    Q_p: { sim: "Q", nombre: "carga inyectada", unidad: C, valor: 10e-12 }
    I_f: { sim: "I_{fuga}", nombre: "fuga", unidad: A, valor: 1e-9 }
    tm_h: { sim: "t_{m}", nombre: "instante de retención", unidad: s, valor: 9e-6 }
    V_sc: { sim: "V_{sat}", nombre: "salida saturada", unidad: V, valor: 12 }
  calculos:
    Vt_h: { expr: "V_e - I_f*R_a", sim: "V'", nombre: "tensión a la que tiende", unidad: V }
    Vm_h: { expr: "Vt_h*(1 - exp(-tm_h/tau_a))", sim: "v_{m}", nombre: "tensión muestreada", unidad: V }
    V_oc: { expr: "max(-V_sc, min(V_sc, -100000*V_e))", sim: "v_{o}", nombre: "salida del comparador", unidad: V }
    tau_a: { expr: "R_a*C_h", sim: "τ", nombre: "constante de tiempo", unidad: s }
    t_aq: { expr: "8.3*R_a*C_h", sim: "t_{adquisición}", nombre: "tiempo de adquisición a 12 bits", unidad: s }
    v_aq: { expr: "V_e*(1 - exp(-8.3))", sim: "v", nombre: "tensión a 8,3 τ", unidad: V }
    V_pd: { expr: "Q_p/C_h", sim: "pedestal", nombre: "salto de pedestal", unidad: V }
    d_r: { expr: "I_f/C_h", sim: "caída", nombre: "ritmo de caída", unidad: "V/s" }
    m_aq: { expr: "tm_h - t_aq", sim: "t_{m} − t_{adq}", nombre: "margen antes de retener", unidad: s }

tarjetas:
  - id: explore-adquisicion
    tipo: explorar
    titulo: "Adquirir es cargar un condensador"
    texto: "El condensador de 1 nF se carga por R_{on} y la fuente. Elija una R que lo lleve a 12 bits antes de retener, a los 9 µs."
    nota: "Escalón de ejemplo."
    libro: [193, 196]
    fijar: { V_e: 1, C_h: 1e-9 }
    inicio: { R_a: 3000 }
    widget:
      tipo: circuito
      esquema: muestreo-retencion
      piezas: { entrada: V_e, ron: R_a, ch: C_h, tm: tm_h, carga: Q_p, fuga: I_f }
      lectura: { valor: t_aq, rotulo: "Adquisición a 12 bits" }
      grafica:
        x: { id: t, min: 0, max: 0.00001, unidad: s, rotulo: "t" }
        y: { min: 0, max: 1.1, unidad: V, rotulo: "v" }
        curvas:
          - { expr: "(1 - ceil((t - tm_h)/1e9))*Vt_h*(1 - exp(-t/tau_a)) + ceil((t - tm_h)/1e9)*(Vm_h + Q_p/C_h - I_f*(t - tm_h)/C_h)", color: naranja, rotulo: "v_{o}", mide: salida }
        marcas:
          - { x: "-tau_a*ln(2^(-12))", y: "Vt_h*(1 - 2^(-12))", rotulo: "12 bits" }
      mandos:
        - { valor: R_a, lista: [100, 300, 1000, 3000], rotulo: "R" }
    objetivo:
      condiciones:
        - { valor: m_aq, min: 0, rotulo: "Adquiere antes de retener" }
      logrado: "Con {{R_a}}, {{t_aq}}: llega a 12 bits antes de que el interruptor se abra."
      pistas:
        - { texto: "La carga es demasiado lenta: retiene antes de llegar a 12 bits. Baje R." }
    escalera:
      - "Doce bits piden 8,3 · R · C."
    solucion: "1 kΩ o menos: 8,3 µs con 1 kΩ."
    comprobar:
      - { con: { R_a: 1000 }, t_aq: 8.3e-6 }
      - { t_aq: 24.9e-6, tm_h: 9e-6 }

  - id: prediga-adquisicion
    tipo: marcar
    titulo: "100 Ω y 1 nF"
    texto: "Con 100 Ω y 1 nF, marque en la curva el instante en que la carga alcanza la exactitud de 12 bits."
    libro: [196]
    fijar: { R_a: 100, C_h: 1e-9, V_e: 1 }
    widget:
      tipo: circuito
      esquema: muestreo-retencion
      piezas: { entrada: V_e, ron: R_a, ch: C_h, tm: tm_h, carga: Q_p, fuga: I_f }
      grafica:
        x: { id: t, min: 0, max: 0.000003, unidad: s, rotulo: "t" }
        y: { min: 0, max: 1.1, unidad: V, rotulo: "v" }
        curvas:
          - { expr: "(1 - ceil((t - tm_h)/1e9))*Vt_h*(1 - exp(-t/tau_a)) + ceil((t - tm_h)/1e9)*(Vm_h + Q_p/C_h - I_f*(t - tm_h)/C_h)", color: naranja, rotulo: "v_{o}", mide: salida }
      mandos: []
    marcar:
      modo: x
      curva: 0
      x: "t_aq"
      tol: 0.03
      inicio: { x: 0.0000025, y: 0 }
      rotulo: "12 bits"
      pasos: 60
    pistas:
      - { cuando: { valor: marca_x, menor: 0.0000007 }, texto: "Ahí la curva aún sube: a 12 bits le falta. Con una τ no basta." }
      - { texto: "Ahí ya sobra tiempo: más a la izquierda." }
    exito: "Unos 830 ns: τ = 100 ns, y 12 bits piden 8,3 constantes de tiempo."
    escalera:
      - "Una constante de tiempo es R · C; 12 bits piden 8,3."
    solucion: "En 830 ns: 8,3 · 100 Ω · 1 nF."
    comprobar:
      - { t_aq: 830e-9, tau_a: 100e-9 }

  - id: estime-pedestal
    tipo: simular
    fase: "Estime"
    titulo: "El pedestal"
    texto: "Al abrir el interruptor, 10 pC pasan al condensador de retención de 1 nF. ¿Qué salto produce?"
    libro: [197]
    fijar: { Q_p: 10e-12, C_h: 1e-9 }
    simular:
      objetivo: V_pd
      unidad: V
      tol: 0.05
      rotulo: "Salto de pedestal"
      errores:
        - { razon: { min: 9000, max: 11000 }, texto: "Ha dividido al revés: ΔV = Q/C." }
    exito: "10 mV. Es el error dominante de un muestreo y retención."
    escalera:
      - "ΔV = Q/C."
    solucion: "10 pC / 1 nF = 10 mV."
    comprobar:
      - { V_pd: 0.01 }

  - id: explore-retencion
    tipo: explorar
    titulo: "Pedestal y caída en una pantalla"
    texto: "Al retener, la salida salta con la carga inyectada y luego cae con la fuga. Suba la fuga hasta que caiga 10 mV por milisegundo."
    nota: "Eje estrecho alrededor de 1 V, durante un milisegundo."
    libro: [197, 198, 203]
    fijar: { R_a: 100, C_h: 1e-9, Q_p: 10e-12, V_e: 1 }
    inicio: { I_f: 1e-9 }
    widget:
      tipo: circuito
      esquema: muestreo-retencion
      piezas: { entrada: V_e, ron: R_a, ch: C_h, tm: tm_h, carga: Q_p, fuga: I_f }
      lectura: { valor: d_r, rotulo: "Ritmo de caída" }
      datos:
        - { valor: V_pd, rotulo: "Pedestal: {{V_pd}}" }
      dibujo: false
      grafica:
        x: { id: t, min: 0, max: 0.001, unidad: s, rotulo: "t" }
        y: { min: 0.985, max: 1.015, unidad: V, rotulo: "v" }
        curvas:
          - { expr: "(1 - ceil((t - tm_h)/1e9))*Vt_h*(1 - exp(-t/tau_a)) + ceil((t - tm_h)/1e9)*(Vm_h + Q_p/C_h - I_f*(t - tm_h)/C_h)", color: naranja, rotulo: "v_{o}", mide: salida }
      mandos:
        - { valor: I_f, lista: [1e-9, 10e-9], rotulo: "Fuga" }
    objetivo:
      condiciones:
        - { valor: d_r, min: 10, rotulo: "Caída: {{d_r}}" }
      logrado: "Con {{I_f}} de fuga, en un milisegundo cae tanto como el pedestal: por eso el seguidor es de entrada FET."
      pistas:
        - { texto: "Con 1 nA cae 1 mV por milisegundo: más fuga." }
    escalera:
      - "dV/dt = I/C."
    solucion: "10 nA sobre 1 nF: 10 V/s."
    comprobar:
      - { con: { I_f: 10e-9 }, d_r: 10 }

  - id: sorpresa-compromiso
    tipo: sorpresa
    titulo: "El mismo condensador"
    texto: "Con 10 pC de carga inyectada y 100 Ω, cambie el condensador de retención hasta dejar el pedestal en 1 mV. Vigile la adquisición."
    libro: [196, 197]
    fijar: { R_a: 100, Q_p: 10e-12, V_e: 1 }
    inicio: { C_h: 1e-9 }
    widget:
      tipo: circuito
      esquema: muestreo-retencion
      piezas: { entrada: V_e, ron: R_a, ch: C_h, tm: tm_h, carga: Q_p, fuga: I_f }
      lectura: { valor: V_pd, rotulo: "Pedestal" }
      datos:
        - { valor: t_aq, rotulo: "Adquisición: {{t_aq}}" }
      grafica:
        x: { id: t, min: 0, max: 0.00001, unidad: s, rotulo: "t" }
        y: { min: 0, max: 1.1, unidad: V, rotulo: "v" }
        curvas:
          - { expr: "(1 - ceil((t - tm_h)/1e9))*Vt_h*(1 - exp(-t/tau_a)) + ceil((t - tm_h)/1e9)*(Vm_h + Q_p/C_h - I_f*(t - tm_h)/C_h)", color: naranja, rotulo: "v_{o}", mide: salida }
      mandos:
        - { valor: C_h, lista: [1e-9, 10e-9], rotulo: "C_{h}" }
    objetivo:
      condiciones:
        - { valor: V_pd, max: 0.001, rotulo: "Pedestal: {{V_pd}}" }
      logrado: "1 mV de pedestal, pero la adquisición sube a {{t_aq}}: diez veces más."
      pistas:
        - { texto: "La misma carga sobre más capacidad da menos salto: suba C." }
    escalera:
      - "ΔV = Q/C: para un salto diez veces menor, diez veces más C."
    solucion: "10 nF: 1 mV y 8,3 µs de adquisición."
    comprobar:
      - { con: { C_h: 10e-9 }, V_pd: 0.001, t_aq: 8.3e-6 }

  - id: por-que-compromiso
    tipo: porque
    titulo: "El compromiso central"
    texto: "¿Por qué no se pone simplemente un condensador de retención muy grande?"
    libro: [197]
    fijar: { R_a: 100, Q_p: 10e-12, V_e: 1 }
    widget:
      tipo: circuito
      esquema: muestreo-retencion
      piezas: { entrada: V_e, ron: R_a, ch: C_h, tm: tm_h, carga: Q_p, fuga: I_f }
      lectura: { valor: t_aq, rotulo: "Adquisición" }
      dibujo: false
      grafica:
        x: { id: t, min: 0, max: 0.00001, unidad: s, rotulo: "t" }
        y: { min: 0, max: 1.1, unidad: V, rotulo: "v" }
        curvas:
          - { expr: "(1 - ceil((t - tm_h)/1e9))*Vt_h*(1 - exp(-t/tau_a)) + ceil((t - tm_h)/1e9)*(Vm_h + Q_p/C_h - I_f*(t - tm_h)/C_h)", color: naranja, rotulo: "v_{o}", mide: salida }
    opciones:
      - texto: "Reduce el pedestal, pero alarga la adquisición en la misma proporción"
        bien: true
        porque: "ΔV = Q/C baja con C; el tiempo de carga, 8,3 · R · C, sube con C."
      - texto: "Porque un condensador grande tiene más fuga"
        porque: "La fuga importa en la retención; el compromiso central es pedestal frente a adquisición."
      - texto: "Porque aumenta el pedestal"
        porque: "Al revés: la misma carga sobre más capacidad da menos salto."
    escalera:
      - "¿Cómo cambian Q/C y R · C al subir C?"
    solucion: "Más C: menos pedestal y más tiempo de adquisición."

  - id: estime-caida
    tipo: simular
    fase: "Estime"
    titulo: "La caída en retención"
    texto: "Durante la retención, 1 nA de fuga descarga el condensador de 1 nF. ¿A qué ritmo cae su tensión, en V/s?"
    libro: [198]
    fijar: { I_f: 1e-9, C_h: 1e-9 }
    simular:
      objetivo: d_r
      unidad: "V/s"
      tol: 0.05
      rotulo: "Ritmo de caída"
      errores:
        - { razon: { min: 0.0009, max: 0.0011 }, texto: "Eso es por milisegundo. En voltios por segundo es mil veces más." }
    exito: "1 V/s, es decir, 1 mV por milisegundo. Por eso el seguidor es siempre de entrada FET."
    escalera:
      - "dV/dt = I/C."
    solucion: "10⁻⁹ A / 10⁻⁹ F = 1 V/s = 1 mV/ms."
    comprobar:
      - { d_r: 1 }

  - id: por-que-comparador
    tipo: pregunta
    fase: "Empareje"
    titulo: "Por qué no basta un operacional"
    texto: "Una cada defecto del operacional como comparador con su causa."
    libro: [182, 183, 184, 185, 188, 190, 191]
    emparejar:
      - ["Lento al salir de saturación", "Sus transistores internos saturan junto al raíl"]
      - ["Salida no compatible con lógica", "Da la alimentación, sin colector abierto"]
      - ["Carga la fuente", "Diodos de protección entre entradas"]
      - ["Oscila con señales lentas", "No lleva histéresis interna"]
    exito: "El LM339, de colector abierto, no sube sin pull-up. Y aun con histéresis, su conmutación se acopla a la entrada: desacoplo y pistas separadas."
    pistas:
      - { texto: "Los diodos de protección conducen por encima de ±0,7 V de diferencia." }
    escalera:
      - "La histéresis se añade por fuera en el LM311, el LM393 y el LM339."
    solucion: "Saturación–lento, sin colector abierto–lógica, diodos–carga, sin histéresis–oscila."

  - id: absorcion
    tipo: elegir
    titulo: "El condensador de retención"
    texto: "La tensión retenida deriva hacia el valor de la muestra anterior. Toque la pieza que se ha elegido mal."
    libro: [201]
    fijar: { R_a: 100, V_e: 1, C_h: 1e-9 }
    widget:
      tipo: circuito
      esquema: muestreo-retencion
      piezas: { entrada: V_e, ron: R_a, ch: C_h, tm: tm_h, carga: Q_p, fuga: I_f }
      grafica:
        x: { id: t, min: 0, max: 0.00001, unidad: s, rotulo: "t" }
        y: { min: 0, max: 1.1, unidad: V, rotulo: "v" }
        curvas:
          - { expr: "(1 - ceil((t - tm_h)/1e9))*Vt_h*(1 - exp(-t/tau_a)) + ceil((t - tm_h)/1e9)*(Vm_h + Q_p/C_h - I_f*(t - tm_h)/C_h)", color: naranja, rotulo: "v_{o}", mide: salida }
      mandos: []
    elegir:
      zonas: [ron, ch, ao, fuga]
      bien: [ch]
      porque:
        ron: "El interruptor da el pedestal al abrirse, no recuerda la muestra anterior."
        ao: "El seguidor solo lee el condensador; su corriente de entrada da la caída, no el recuerdo."
        fuga: "La fuga descarga el condensador hacia abajo, no hacia la muestra anterior."
    exito: "Un dieléctrico con absorción recuerda su carga. Polipropileno o poliestireno, de 0,001 a 0,02 %; nunca cerámico de clase 2 ni electrolítico."
    escalera:
      - "¿Qué pieza guarda la carga de una muestra a otra?"
    solucion: "El condensador de retención: su dieléctrico tiene absorción."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [183, 193, 196, 197, 198]
    ideas:
      - { titulo: "Comparador dedicado.", texto: "Rápido y con colector abierto: sin pull-up, no sube." }
      - { titulo: "Adquisición.", texto: "Cargar C_{h} a 12 bits pide 8,3 · R · C." }
      - { titulo: "Pedestal y caída.", texto: "Q/C al retener y I/C mientras se retiene." }
      - { titulo: "El compromiso.", texto: "Más capacidad, menos pedestal y más adquisición." }
