  consola-snes:
    maquina: snes
    titulo: "Super Nintendo"
    lecciones:
      - { label: snes-placa, titulo: "La placa de la Super Nintendo de un vistazo" }
      - { label: snes-alimentacion, titulo: "La alimentación de la Super Nintendo" }
      - { label: snes-relojes, titulo: "Relojes y divisores de la Super Nintendo: PAL y NTSC" }
      - { label: snes-buses, titulo: "Los buses A y B y la decodificación" }
      - { label: snes-video-audio, titulo: "El camino del vídeo y del sonido en la Super Nintendo" }
      - { label: snes-bloqueo, titulo: "El CIC y la región de la Super Nintendo" }
      - { label: snes-averias, titulo: "Averías típicas de la Super Nintendo" }
    externas:
      - titulo: "ConsoleMods, «SNES:Power Supply Fuse»"
        url: "https://consolemods.org/wiki/SNES:Power_Supply_Fuse"
        hechos:
          - "Fusible de la SNES y la Super Famicom originales: axial, rápido, de 125 V y 1,5 A; no se debe poner uno lento."
          - "Un fusible fundido es la causa más común de que una SNES o una Super Famicom no enciendan."
          - "El fusible protege la consola de una fuente de alimentación inadecuada o de un cortocircuito a masa."
          - "En los modelos originales, el fusible está justo enfrente del regulador 7805 y junto al conector del interruptor."
      - titulo: "ConsoleMods, «SNES:Disabling CIC»"
        url: "https://consolemods.org/wiki/SNES:Disabling_CIC"
        hechos:
          - "Si el CIC de la consola no se entiende con el del cartucho, mantiene el sistema en reset y el juego no arranca."
          - "En los CIC F411 y F413 basta con levantar la patilla 4 para desactivar el bloqueo."
          - "El CIC es un chip pequeño de 18 patillas, de montaje superficial, cerca del botón de reset; los números de patilla están serigrafiados a su lado."
          - "Los juegos con el chip SA-1 pueden negarse a arrancar con el CIC desactivado."
          - "Levantar la patilla 4 sin cuidado puede dañarla o romperla, y también su pad; levantada, conviene llevarla a masa, por ejemplo a la patilla 9."
      - titulo: "ConsoleMods, «SNES:Region Information»"
        url: "https://consolemods.org/wiki/SNES:Region_Information"
        hechos:
          - "Todas las consolas NTSC llevan el chip de bloqueo F411 y todas las PAL el F413."
          - "Los cartuchos japoneses y PAL no entran del todo en una consola norteamericana por unas pestañas de su ranura, que se pueden quitar cortándolas."
          - "Un juego PAL no arranca en otra consola por el chip de bloqueo distinto, y algunos juegos PAL detectan si la consola va a 60 Hz y no se dejan jugar."
      - titulo: "Chromagi, «AC Adapter» (SNS-002)"
        url: "https://chromagi.com/nintendo/sfc-snes/sns-002/"
        hechos:
          - "El adaptador SNS-002 de la Super NES toma 120 V de alterna a 60 Hz y da 10 V de continua y 850 mA."
      - titulo: "ConsoleMods, «SNES:Buying Guide»"
        url: "https://consolemods.org/wiki/SNES:Buying_Guide"
        hechos:
          - "Las revisiones de placa de la SHVC-CPU-01 a la SNS-CPU-RGB-01 tienen un problema de balance del audio."
