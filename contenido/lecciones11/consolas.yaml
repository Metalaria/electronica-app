# «Consolas por dentro» (1.2, owner 12-11 19:40): the course's parts, one per console of the «Consolas» explorer and in
# its order, and the lessons of each one (label and title, in order). The lessons are
# contenido/lecciones11/consola-<maquina>/<label>.yaml; they cite the console's data («snes#12»: the explorer, its
# architecture model and the `externas` below) and the book («cap37#120»). GUIA §12; scripts/consolas11.mjs.
#
# `externas`: facts from sources outside the app (service manuals, ConsoleMods…), each with its title and address.
# Every `hechos` entry is what the page says, in Spanish, and becomes a citeable block of the console: never write a
# fact the page does not state. A lesson that uses one shows its title and link on the card.
partes:
  consola-nes:
    maquina: nes
    titulo: "NES"
    lecciones:
      - { label: nes-placa, titulo: "La placa de la NES de un vistazo" }
      - { label: nes-alimentacion, titulo: "La alimentación de la NES" }
      - { label: nes-relojes, titulo: "Un cristal, dos relojes: la NES" }
      - { label: nes-buses, titulo: "Buses y decodificación de direcciones de la NES" }
      - { label: nes-video-audio, titulo: "El camino del vídeo y del sonido en la NES" }
      - { label: nes-bloqueo, titulo: "El CIC de la NES" }
      - { label: nes-averias, titulo: "Averías típicas de la NES" }
    externas:
      - titulo: "ConsoleMods, «NES:Disabling CIC Chip»"
        url: "https://consolemods.org/wiki/NES:Disabling_CIC_Chip"
        hechos:
          - "El chip de la NES, la «cerradura», busca su pareja en el cartucho, la «llave»."
          - "Si el chip del cartucho no está, la consola entra en un bucle de reset de 1 Hz y el juego no arranca."
          - "Llevando a masa la patilla 4 de la «cerradura» se desactiva el bloqueo: se corta la patilla en su base y se suelda un hilo a masa."
          - "En las consolas NTSC, el 10NES lleva la marca 3193A."
          - "Cortar la patilla 4 sin llevarla a masa no se recomienda del todo: puede dañar el 10NES."
          - "Algunos cartuchos de Nintendo necesitan la señal de reset del cartucho que genera el CIC."
          - "Saltarse el bloqueo no arregla las malas conexiones, y puede corromper las partidas de los juegos con SRAM mapeada directamente."
      - titulo: "Silvestron Board Maps, «Nintendo Entertainment System: NES-CPU-07»"
        url: "https://boardmaps.silvestron.com/nintendo-entertainment-system/NES-CPU-07"
        hechos:
          - "La NES-CPU-07 conserva el zócalo de cartucho de inserción sin fuerza (ZIF); su famosa avería de la luz roja que parpadea vino del desgaste de los 72 contactos."
          - "El desgaste de los 72 contactos y un diálogo del bloqueo 10NES que falla son las dos dolencias clásicas de la NES de carga frontal."
      - titulo: "ConsoleMods, «NES:NESRevival PSU»"
        url: "https://consolemods.org/wiki/NES:NESRevival-PSU"
        hechos:
          - "El módulo de alimentación original de la NES es muy ruidoso y está mal trazado: pistas de alimentación que se cruzan y una masa enrevesada."
          - "El ruido del módulo de alimentación original puede afectar a la calidad de la imagen y del sonido."

  consola-neogeo:
    maquina: neogeo
    titulo: "Neo Geo AES"
    lecciones:
      - { label: neogeo-placa, titulo: "La placa de la Neo Geo AES de un vistazo" }
      - { label: neogeo-alimentacion, titulo: "La alimentación de la Neo Geo AES: 5 V justos" }
      - { label: neogeo-relojes, titulo: "Un cristal de 24 MHz: los relojes de la Neo Geo" }
      - { label: neogeo-buses, titulo: "El mapa del 68000 y el bus P de la Neo Geo" }
      - { label: neogeo-video-audio, titulo: "Sprites, paleta y sonido en la Neo Geo" }
      - { label: neogeo-bloqueo, titulo: "La BIOS, la región y el modo de la Neo Geo" }
      - { label: neogeo-averias, titulo: "Averías y diagnóstico de la Neo Geo AES" }
    externas:
      - titulo: "NeoGeo Development Wiki, «Power requirements»"
        url: "https://wiki.neogeodev.org/index.php/Power_requirements"
        hechos:
          - "La mayoría de las AES de primera generación (placa NEO-AES) son solo de 5 V."
          - "Piden 5 V ± 0,2 V y 2 A."
          - "Por encima de 5,2 V se acaban muriendo componentes; por debajo de 4,8 V puede haber fallos de imagen o reinicios."
          - "Algunas, con la placa NEO-POWER-0, piden 9 V: llevan una bobina grande de cobre y un LM2576 de 5 patillas."
          - "La versión de «9 V» funciona desde 7,5 V y consume unos 750 mA a 9 V, que pueden subir a 1,5 A según el juego y los auriculares."
      - titulo: "NeoGeo Development Wiki, «Power supply»"
        url: "https://wiki.neogeodev.org/index.php/Power_supply"
        hechos:
          - "Polaridad de la toma de las consolas AES: el exterior es el positivo y el interior, masa."
          - "Las primeras consolas no tienen protección contra la polaridad invertida."
          - "PRO-POW (100 V), PRO-POW-UL (120 V) y PRO-POW-PAL (220–240 V): salida de 5 V de continua y 3 A."
          - "El NEO-POW3 da 10 V de continua y 1 A (otra versión, 11 V y 700 mA) y puede quemar las primeras consolas de 5 V."
      - titulo: "NeoGeo Development Wiki, «Watchdog»"
        url: "https://wiki.neogeodev.org/index.php/Watchdog"
        hechos:
          - "El watchdog es un reinicio automático que evita que los juegos se cuelguen por un fallo del programa o del hardware: un contador de cuadros que reinicia el sistema cuando pasa de un límite."
          - "El programa tiene que poner el contador a cero de vez en cuando escribiendo en REG_DIPSW; suelen hacerlo las rutinas del borrado vertical."
          - "Un sistema que se reinicia sin parar da una señal RESET constante de 3,7 Hz y un clic audible, «el clic de la muerte», que ayuda a diagnosticar los problemas de arranque."
          - "Para buscar averías, el watchdog se puede desactivar llevando a masa la patilla DOGE (patilla 94 del NEO-B1; puente J2 en algunas placas)."
      - titulo: "ConsoleMods, «Neo Geo:UNIVERSE BIOS (UniBIOS)»"
        url: "https://consolemods.org/wiki/Neo_Geo:UniBIOS"
        hechos:
          - "El motivo principal para instalar UniBIOS es cambiar al arrancar la región y el modo, recreativa o consola."
          - "Con la región de EE. UU. algunos juegos quitan la sangre, y el modo recreativa activa opciones de juego extra en algunos juegos."
          - "El chip de la BIOS suele llevar escrito «531024»."
      - titulo: "The Cutting Room Floor, «Neo Geo»"
        url: "https://tcrf.net/Neo_Geo"
        hechos:
          - "El MVS es la recreativa y el AES, la consola doméstica."
          - "Todo juego de Neo Geo lleva los datos de sus versiones AES y MVS, y los de las tres regiones están en el cartucho."
          - "Un juego puesto en una región en la que no salió puede mostrar opciones sin usar, diferencias de juego o una traducción a medias."

  consola-sms:
    maquina: sms
    titulo: "Master System II"
    lecciones:
      - { label: sms-placa, titulo: "La placa del Master System II de un vistazo" }
      - { label: sms-alimentacion, titulo: "La alimentación del Master System II" }
      - { label: sms-relojes, titulo: "Un oscilador para todo: el Master System II" }
      - { label: sms-buses, titulo: "Memoria, puertos y decodificación del Master System II" }
      - { label: sms-video-audio, titulo: "El camino del vídeo y del sonido en el Master System II" }
      - { label: sms-bloqueo, titulo: "La cabecera «TMR SEGA» y la región del Master System" }
      - { label: sms-averias, titulo: "Averías y diagnóstico del Master System II" }
    externas:
      - titulo: "SMS Power, «ROM header»"
        url: "https://www.smspower.org/Development/ROMHeader"
        hechos:
          - "Los ocho primeros bytes de la cabecera son el texto ASCII «TMR SEGA»; la cabecera está en $7FF0 (también puede ir en $1FF0 o $3FF0, pero el software conocido usa la última)."
          - "Las BIOS de los Master System de exportación y de la Game Gear piden la cabecera para dar los datos por válidos."
          - "La palabra de $7FFA es la suma de comprobación de la ROM para las BIOS de exportación, que la comparan con la que calculan; los juegos japoneses y de Game Gear no suelen tenerla correcta."
          - "Los 4 bits altos del byte 16 de la cabecera dan la región y el sistema: $3, SMS Japón; $4, SMS exportación; $5, Game Gear Japón."
          - "Solo la BIOS de los SMS de exportación comprueba el código de región."
      - titulo: "ConsoleMods, «Master System:Region Information»"
        url: "https://consolemods.org/wiki/Master_System:Region_Information"
        hechos:
          - "La BIOS del SMS no distingue entre regiones para la mayoría de los juegos, pero sí comprueba que el juego tenga una cabecera."
          - "Los cartuchos japoneses tienen 44 contactos y los occidentales 50; los japoneses son más altos, más estrechos y más gruesos."
          - "Los juegos no optimizados para 50 Hz van más lentos en una consola PAL; los PAL programados para 50 Hz van más rápido en una NTSC."
          - "La comprobación de la cabecera se salta con una modificación de la BIOS o con un adaptador que lleva una pequeña ROM de arranque con la cabecera."
      - titulo: "ConsoleMods, «Comparison of Power Supplies»"
        url: "https://consolemods.org/wiki/Replacement_Power_Supply"
        hechos:
          - "Sega Master System: 9 V de continua, 1 A, punta negativa, clavija de 5,5 × 2,1 mm."

  consola-megadrive:
    maquina: megadrive
    titulo: "Mega Drive"
    lecciones:
      - { label: megadrive-placa, titulo: "La placa de la Mega Drive de un vistazo" }
      - { label: megadrive-alimentacion, titulo: "La alimentación de la Mega Drive" }
      - { label: megadrive-relojes, titulo: "Un oscilador, tres relojes: la Mega Drive en PAL y NTSC" }
      - { label: megadrive-buses, titulo: "El mapa del 68000 y la ventana del Z80" }
      - { label: megadrive-video-audio, titulo: "El camino del vídeo y del sonido en la Mega Drive" }
      - { label: megadrive-bloqueo, titulo: "El TMSS y la región de la Mega Drive" }
      - { label: megadrive-averias, titulo: "Averías típicas de la Mega Drive" }
    externas:
      - titulo: "Retro Tech Wiki, «Sega Mega Drive / Genesis (Model 1) Troubleshooting Guide»"
        url: "https://retrotechwiki.com/Sega_Mega_Drive_/_Genesis_(Model_1)_Troubleshooting_Guide"
        hechos:
          - "La guía sigue el procedimiento de reparación del manual de mantenimiento PAL-G de Sega, de agosto de 1992, que cubre las placas PAL-G VA4 y VA6.5."
          - "La clavija del adaptador del modelo 1 tiene el centro negativo; los adaptadores del modelo 2 y de la 32X tienen el centro positivo y no se deben usar."
          - "El adaptador PAL-G de Sega (400-5122A o 400-5122B) toma 220 V de alterna y da 10 V de continua y 1,2 A."
          - "La entrada de continua pasa por la ferrita FB1, el interruptor SW1 y dos diodos 1SR35-100A hasta IC15."
          - "Se comprueban IC15 (Vcc1) e IC17 (Vcc2), los dos 7805: Vcc1 y Vcc2 deben dar +5 V."
          - "Causas de que no encienda, en el orden de Sega: una grieta en la placa o una mala soldadura en el conector DIN, una pista rota bajo los disipadores o en el interruptor, y un IC17 averiado."
          - "En las placas PAL, OSC1 es un oscilador de 53,203424 MHz ±20 ppm (pieza de Sega 230-5058); con la imagen en blanco y negro, se cambia el cristal."
          - "Si un filtro EMI de los mandos mide de 24 a 65 Ω a masa, el filtro está averiado."
          - "Sonido en el DIN pero no en los auriculares: IC12 (CXA1034)."
          - "El programa tiene que escribir «SEGA» en la dirección $A14000 poco después del reset, o el 68000 se bloquea; algunos juegos muy antiguos no lo hacen y se paran tras la pantalla de licencia, sin que sea una avería."
          - "Antes de abrir la consola: cambiar el cable A/V, el adaptador y la entrada del televisor, y limpiar el cartucho y la ranura."
      - titulo: "ConsoleMods, «Genesis:Region Information»"
        url: "https://consolemods.org/wiki/Genesis:Region_Information"
        hechos:
          - "La región la fijan dos patillas del VDP o del ASIC principal: una para el idioma y otra para la frecuencia de vídeo."
          - "Tres regiones: Japón y Corea (idioma japonés, 60 Hz), Norteamérica y Brasil (inglés, 60 Hz) y Europa PAL (inglés, 50 Hz)."
          - "La mayoría de los juegos anteriores a 1993 no miran la región; muchos de los posteriores la comprueban y, si no coincide, no arrancan y suelen mostrar un aviso."
          - "Los juegos japoneses con bloqueo solo comprueban el idioma, no la frecuencia de vídeo."
          - "Un juego sin comprobación de región puede ir más lento de lo previsto en una Mega Drive PAL."
          - "El conector y el patillaje del cartucho son los mismos en todas las regiones."
          - "Los cartuchos japoneses no entran en una Mega Drive PAL; los norteamericanos y PAL, algo más pequeños, sí entran en una japonesa."
          - "El bloqueo de región no se puede saltar sin una modificación de región en la consola."
      - titulo: "Nicole Express, «Trademarks and region locks» (2020)"
        url: "https://nicole.express/2020/trademarks-and-region-locks.html"
        hechos:
          - "En enero de 1991 Sega sacó la placa VA6 del modelo 1, con el TMSS."
          - "Una ROM de arranque nueva lee la ROM del juego en la dirección $100 y busca la cadena «SEGA» o « SEGA»; si la encuentra, muestra un mensaje de marca registrada."
          - "El VDP solo se habilita si el juego escribe los bytes de «SEGA» en una dirección especial; con el VDP apagado, el juego no tiene gráficos, y tampoco sonido."
          - "En la Mega Drive no es la consola la que comprueba el juego: es el juego el que comprueba la consola, leyendo un byte que dice su región."
          - "Un conmutador de región solo cambia los bytes que lee el juego."
      - titulo: "ConsoleMods, «Genesis:Buying Guide»"
        url: "https://consolemods.org/wiki/Genesis:Buying_Guide"
        hechos:
          - "Modelo 1: toma de 5,5 × 2,1 mm con la punta negativa; espera 9 V de continua y 1,2 A."
          - "Modelo 2: toma EIAJ-03 (4,75 × 1,7 mm) con la punta positiva."
          - "La VA6 lleva un chip de E/S con TMSS; desde esa revisión, algunos juegos de Accolade y EA no se pueden jugar."
          - "Ishido: The Way of the Stones y Onslaught no funcionan en las consolas con TMSS."
          - "Las VA0 a VA3 tienen un vídeo compuesto flojo, con bandas de colores en toda la pantalla, que viene del circuito de vídeo y no de condensadores en mal estado."
          - "La VA6.8 solo se vendió en regiones PAL y tiene buena calidad de audio."
          - "La VA7 no se recomienda tal cual por su mala calidad de audio."

  consola-gb:
    maquina: gb
    titulo: "Game Boy"
    lecciones:
      - { label: gb-placa, titulo: "La placa de la Game Boy de un vistazo" }
      - { label: gb-alimentacion, titulo: "Pilas, interruptor y convertidor: la alimentación de la Game Boy" }
      - { label: gb-relojes, titulo: "Un cristal de 2²² Hz: los relojes de la Game Boy" }
      - { label: gb-buses, titulo: "Dos buses y la decodificación de la Game Boy" }
      - { label: gb-video-audio, titulo: "El camino de la imagen y del sonido en la Game Boy" }
      - { label: gb-bloqueo, titulo: "El logotipo de Nintendo: el arranque de la Game Boy" }
      - { label: gb-averias, titulo: "Averías típicas de la Game Boy" }
    externas:
      - titulo: "Pan Docs (wiki de gbdev), «Video Display»"
        url: "https://gbdev.gg8.se/wiki/articles/Video_Display"
        hechos:
          - "El controlador de la pantalla trabaja con un reloj de punto de 2²² Hz (4,194 MHz)."
          - "Un cuadro son 154 líneas, 70 224 puntos o 16,74 ms."
          - "En las líneas 0 a 143 el controlador pasa por los modos 2, 3 y 0 cada 456 puntos; las líneas 144 a 153 son el modo 1, el borrado vertical."
          - "La interrupción del borrado vertical llega unas 59,7 veces por segundo en una Game Boy portátil (DMG o CGB)."
      - titulo: "Pan Docs (wiki de gbdev), «The Cartridge Header»"
        url: "https://gbdev.gg8.se/wiki/articles/The_Cartridge_Header"
        hechos:
          - "Los bytes $0104–$0133 del cartucho son el mapa de bits del logotipo de Nintendo que se ve al encender; si no son correctos, la Game Boy se bloquea."
          - "La suma de comprobación de la cabecera, en $014D, se calcula con los bytes $0134–$014C; si no es correcta, el juego no funciona."
      - titulo: "Wiki de gbdev, «Power Up Sequence»"
        url: "https://gbdev.gg8.se/wiki/articles/Power_Up_Sequence"
        hechos:
          - "Al encender, la Game Boy pone el logotipo de Nintendo arriba en la pantalla y lo desplaza hasta el centro; después toca dos notas por el altavoz."
          - "Los bytes del logotipo se comparan con una tabla de la ROM interna: si uno no coincide, la Game Boy deja de comparar y se para."
          - "La ejecución del programa del cartucho empieza en la dirección $100."
      - titulo: "Wiki de gbdev, «Gameboy Bootstrap ROM»"
        url: "https://gbdev.gg8.se/wiki/articles/Gameboy_Bootstrap_ROM"
        hechos:
          - "La ROM de arranque de la Game Boy son 256 bytes de código que comprueban la cabecera del cartucho, desplazan el logotipo de Nintendo y tocan el sonido «po-ling»."
          - "Compara $30 bytes del logotipo del cartucho con la copia que guarda; si no coinciden, se queda en una instrucción que salta sobre sí misma."
          - "Al terminar, escribe en un registro especial que desconecta la ROM interna."
      - titulo: "Wikipedia (en), «Game Boy Game Pak»"
        url: "https://en.wikipedia.org/wiki/Game_Boy_Game_Pak"
        hechos:
          - "Una pequeña ROM de arranque busca el logotipo «Nintendo» en el cartucho y no arranca si no es una copia exacta, píxel a píxel, de la que guarda."
          - "Con el logotipo, Nintendo podía demandar por uso no autorizado de su marca a quien publicara un juego sin licencia: le importaba más lo legal que lo técnico."
          - "Algunos desarrolladores encontraron cómo pasar la comprobación sin mostrar el logotipo, y salieron unos pocos cartuchos sin licencia."
          - "La Game Boy no tenía bloqueo regional, a diferencia de las consolas de sobremesa de Nintendo."
      - titulo: "nitro2k01 (blog.gg8.se), «Testing Gameboy input voltage ranges» (2009)"
        url: "https://blog.gg8.se/wordpress/2009/07/22/testing-gameboy-input-voltage-ranges/"
        hechos:
          - "La prueba se hizo con una placa DMG-CPU-07 y su convertidor DC CONV DMG."
          - "3 V es la tensión mínima con la que la placa reguladora funciona estable."
          - "A 4,0 V la Game Boy funciona con normalidad."
          - "La salida de +5 V solo varía 100 mV, así que la CPU no lo nota."
          - "El regulador es conmutado: se pierde poca energía en la conversión, y no se calentó en ninguna prueba."
          - "Cuatro pilas AA no pueden dar razonablemente más de 7 V; con más tensión, la de la pantalla también puede subir y dañarla."
      - titulo: "nitro2k01 (blog.gg8.se), «Why dead horizontal lines are harder to fix» (2011)"
        url: "https://blog.gg8.se/wordpress/2011/07/21/why-dead-horizontal-lines-are-harder-to-fix/"
        hechos:
          - "Las líneas verticales muertas vienen de la conexión del lado derecho de la pantalla."
          - "Se reparan pasando un soldador caliente por la unión entre el conector de plástico marrón, con su gota de epoxi, y el cristal, para volver a fundir lo que los une."
          - "El último tramo de esa conexión es un plástico blanco endeble que el calor del soldador daña con facilidad."
          - "La cinta de las líneas horizontales se une por debajo del cristal, en una posición más incómoda: el autor aconseja no intentar repararlas."
      - titulo: "iFixit, «Nintendo Game Boy Troubleshooting»"
        url: "https://www.ifixit.com/Wiki/Nintendo_Game_Boy_Troubleshooting"
        hechos:
          - "Los restos de corrosión en los contactos de las pilas impiden que llegue la corriente: hay que rascarlos."
          - "Si el juego no arranca, hay que comprobar que el cartucho no tiene suciedad y que entra del todo."
      - titulo: "ConsoleMods, «Game Boy:Game Battery Replacement»"
        url: "https://consolemods.org/wiki/Game_Boy:Game_Battery_Replacement"
        hechos:
          - "Los cartuchos guardan las partidas en una RAM mantenida por una pila; si la pila se agota o se desconecta, se pierden."
          - "Al cambiar la pila, la lengüeta positiva va en el pad positivo."

  consola-gbc:
    maquina: gbc
    titulo: "Game Boy Color"
    lecciones:
      - { label: gbc-placa, titulo: "La placa de la Game Boy Color: qué cambia" }
      - { label: gbc-alimentacion, titulo: "Dos pilas y un convertidor: la alimentación de la Game Boy Color" }
      - { label: gbc-relojes, titulo: "El doble de reloj: la doble velocidad de la Game Boy Color" }
      - { label: gbc-buses, titulo: "Bancos de VRAM y WRAM, e infrarrojos, en la Game Boy Color" }
      - { label: gbc-video-audio, titulo: "Paletas de 15 bits: la imagen y el sonido de la Game Boy Color" }
      - { label: gbc-bloqueo, titulo: "El arranque de la Game Boy Color: logotipo, modo y paletas" }
      - { label: gbc-averias, titulo: "Averías y diagnóstico de la Game Boy Color" }
    externas:
      - titulo: "Pan Docs (wiki de gbdev), «CGB Registers»"
        url: "https://gbdev.gg8.se/wiki/articles/CGB_Registers"
        hechos:
          - "Con el bit 0 de KEY1 ($FF4D) a 1, una instrucción STOP cambia de velocidad; el bit se borra solo."
          - "En doble velocidad van al doble la CPU (2,10 MHz, un ciclo de unos 0,5 µs), el temporizador y el divisor, el puerto serie y la DMA a la OAM."
          - "No cambian con la doble velocidad: el controlador de la pantalla, la HDMA a la VRAM y todos los tiempos y frecuencias del sonido."
          - "La pantalla parpadea en blanco un momento al cambiar de velocidad."
          - "La doble velocidad aumenta el consumo: se recomienda la velocidad normal siempre que se pueda."
          - "RP ($FF56): el bit 0 enciende (1) o apaga (0) el LED de infrarrojos; el bit 1 lee la señal (0, recibiendo; 1, normal); los bits 6 y 7 habilitan la lectura (3) o no (0)."
          - "Tras enviar o recibir por infrarrojos hay que poner RP a $00 para volver a reducir el consumo de las pilas."
          - "El receptor de infrarrojos se adapta al nivel normal del ambiente: una señal larga con el LED encendido puede tomarse como apagado."
          - "En modo CGB hay 32 KB de RAM interna en 8 bancos de 4 KB: el banco 0 siempre en $C000–$CFFF y los bancos 1–7 en $D000–$DFFF; escribir $00 en SVBK elige también el banco 1."
      - titulo: "Pan Docs (wiki de gbdev), «Video Display»"
        url: "https://gbdev.gg8.se/wiki/articles/Video_Display"
        hechos:
          - "La interrupción del borrado vertical llega unas 59,7 veces por segundo en una Game Boy portátil (DMG o CGB)."
          - "Hay 8 paletas de fondo (BGP0–7) y 8 de sprites (OBP0–7), de 4 colores cada una; cada color ocupa 2 bytes, y la paleta 0 son los 8 primeros."
          - "Cada color: bits 0–4 el rojo, 5–9 el verde y 10–14 el azul, de 00 a 1F."
          - "El índice de las paletas va de 00 a 3F."
          - "La DMA a la OAM tarda 152 µs a velocidad normal y 76 µs en doble velocidad."
          - "VBK ($FF4F) cambia el banco de VRAM: solo cuenta el bit 0."
      - titulo: "Pan Docs (wiki de gbdev), «The Cartridge Header»"
        url: "https://gbdev.gg8.se/wiki/articles/The_Cartridge_Header"
        hechos:
          - "La CGB solo comprueba los primeros $18 bytes del logotipo de Nintendo."
          - "Indicador CGB en $0143: $80, el juego usa las funciones de la CGB pero también funciona en las Game Boy anteriores; $C0, solo funciona en la CGB."
      - titulo: "The Cutting Room Floor, «Game Boy Color Bootstrap ROM»"
        url: "https://tcrf.net/GBC_BIOS"
        hechos:
          - "La ROM de arranque de la CGB comprueba el cartucho con la suma de comprobación complementaria y buscando el logotipo de Nintendo."
          - "Da paletas a los juegos de Game Boy calculando un resumen del título de la cabecera de cada juego con licencia de Nintendo."
          - "La paleta también se puede elegir a mano con los botones."
          - "La versión de la Game Boy Advance sigue comparando solo la primera mitad del logotipo."
      - titulo: "Wiki de gbdev, «Gameboy Bootstrap ROM»"
        url: "https://gbdev.gg8.se/wiki/articles/Gameboy_Bootstrap_ROM"
        hechos:
          - "En el chip de la CGB hay tres ROM: una de 256 bytes, otra de 512 y otra de 1792."
      - titulo: "Wikipedia (en), «Game Boy Game Pak»"
        url: "https://en.wikipedia.org/wiki/Game_Boy_Game_Pak"
        hechos:
          - "Los cartuchos solo para Game Boy Color no tienen la muesca de la esquina superior derecha: en una Game Boy monocroma impiden mover el interruptor de encendido."
          - "La Game Boy no tenía bloqueo regional, a diferencia de las consolas de sobremesa de Nintendo."
      - titulo: "iFixit, «Game Boy Color Troubleshooting»"
        url: "https://ts.ifixit.com/Wiki/Game_Boy_Color_Troubleshooting"
        hechos:
          - "Si no enciende: comprobar que el interruptor está en «on» y poner pilas AA nuevas, sobre todo si lleva tiempo sin usarse."
          - "Si se enciende el LED junto a la pantalla pero no hay imagen, puede que haya que cambiar la pantalla."
          - "Sin sonido: probar con auriculares; si se oyen, lo que falla es el altavoz."
          - "Colores corridos o manchas que se ven incluso con la pantalla apagada: la pantalla está rota."
          - "Si el juego se cuelga: volver a meter el cartucho hasta el clic y quitarle el polvo."

  consola-snes:
    maquina: snes
    titulo: "Super Nintendo"
    lecciones:
      - { label: snes-placa, titulo: "La placa de la Super Nintendo de un vistazo" }
      - { label: snes-alimentacion, titulo: "La alimentación de la Super Nintendo" }
      - { label: snes-relojes, titulo: "Relojes y divisores de la Super Nintendo: PAL y NTSC" }
      - { label: snes-buses, titulo: "Los buses A y B y la decodificación" }
      - { label: snes-video-audio, titulo: "El camino del vídeo y del sonido en la Super Nintendo" }
      - { label: snes-bloqueo, titulo: "El CIC y la región de la Super Nintendo" }
      - { label: snes-averias, titulo: "Averías típicas de la Super Nintendo" }
    externas:
      - titulo: "ConsoleMods, «SNES:Power Supply Fuse»"
        url: "https://consolemods.org/wiki/SNES:Power_Supply_Fuse"
        hechos:
          - "Fusible de la SNES y la Super Famicom originales: axial, rápido, de 125 V y 1,5 A; no se debe poner uno lento."
          - "Un fusible fundido es la causa más común de que una SNES o una Super Famicom no enciendan."
          - "El fusible protege la consola de una fuente de alimentación inadecuada o de un cortocircuito a masa."
          - "En los modelos originales, el fusible está justo enfrente del regulador 7805 y junto al conector del interruptor."
      - titulo: "ConsoleMods, «SNES:Disabling CIC»"
        url: "https://consolemods.org/wiki/SNES:Disabling_CIC"
        hechos:
          - "Si el CIC de la consola no se entiende con el del cartucho, mantiene el sistema en reset y el juego no arranca."
          - "En los CIC F411 y F413 basta con levantar la patilla 4 para desactivar el bloqueo."
          - "El CIC es un chip pequeño de 18 patillas, de montaje superficial, cerca del botón de reset; los números de patilla están serigrafiados a su lado."
          - "Los juegos con el chip SA-1 pueden negarse a arrancar con el CIC desactivado."
          - "Levantar la patilla 4 sin cuidado puede dañarla o romperla, y también su pad; levantada, conviene llevarla a masa, por ejemplo a la patilla 9."
      - titulo: "ConsoleMods, «SNES:Region Information»"
        url: "https://consolemods.org/wiki/SNES:Region_Information"
        hechos:
          - "Todas las consolas NTSC llevan el chip de bloqueo F411 y todas las PAL el F413."
          - "Los cartuchos japoneses y PAL no entran del todo en una consola norteamericana por unas pestañas de su ranura, que se pueden quitar cortándolas."
          - "Un juego PAL no arranca en otra consola por el chip de bloqueo distinto, y algunos juegos PAL detectan si la consola va a 60 Hz y no se dejan jugar."
      - titulo: "Chromagi, «AC Adapter» (SNS-002)"
        url: "https://chromagi.com/nintendo/sfc-snes/sns-002/"
        hechos:
          - "El adaptador SNS-002 de la Super NES toma 120 V de alterna a 60 Hz y da 10 V de continua y 850 mA."
      - titulo: "ConsoleMods, «SNES:Buying Guide»"
        url: "https://consolemods.org/wiki/SNES:Buying_Guide"
        hechos:
          - "Las revisiones de placa de la SHVC-CPU-01 a la SNS-CPU-RGB-01 tienen un problema de balance del audio."
