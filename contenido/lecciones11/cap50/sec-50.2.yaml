# Lección 1.2 de la sección 51.2 «Seguridad: Trabajar con la Red» (cap50; etiquetas sec-50.N = impresas 51.N).
# - Las dos zonas y la barrera de la figura 51.2 (fig-50.2), con zonas en el primario, la barrera, el transformador,
#   el optoacoplador y el secundario.
# - Sin modelo de circuito: la sección es de reglas.
# Pasos prácticos: «tocar» lo único que puede cruzar la barrera; «banco» del bloque 64: la resistencia entre la carcasa
# y el pin de tierra del enchufe de un equipo de clase I, con el equipo desenchufado y las puntas anuladas en modo
# relativo; debe ser inferior a 0,1 Ω (esperado 0,055 Ω ± 80 %, es decir, hasta 0,099 Ω).
leccion: cap50/sec-50.2

libro:
  36: "En los capítulos anteriores, un error producía un componente quemado; aquí puede producir un incendio o una electrocución."
  40: "el condensador sigue siéndolo minutos después de desenchufar"
  42: "un transformador con aislamiento certificado, y opto­acopladores para cualquier señal que deba cruzarla"
  43: "Ni una pista, ni un plano de masa, ni un tornillo."
  46: "y antes de cualquier otra cosa, para que proteja incluso al filtro"
  47: "Varistor o TVS para transitorios de red"
  48: "que son componentes de seguridad certificada y no se sustituyen por otros del mismo valor"
  49: "Limitación de irrupción: NTC o resistencia con relé"
  50: "las normas de seguridad la exigen en cuanto la capacidad X pasa de unos 0,1 µF"
  52: "nunca en serie con otra"
  53: "el de tierra debe ser el último en ceder"
  55: "provoca un cortocircuito a través del instrumento"
  56: "limita la corriente ante cualquier error de montaje y avisa luciendo"
  57: "hay que medir con el multímetro que el condensador está por debajo de unos pocos voltios"
  61: "es una decisión de ingeniería sensata, no una renuncia"
  64: "debe ser inferior a 0,1 Ω"
  65: "Las dos zonas de un equipo conectado a la red y la barrera de aislamiento que las separa."

modelo:
  valores:
    R_t: { sim: "R_{tierra}", nombre: "resistencia de tierra esperada", unidad: Ω, valor: 0.055 }
  calculos: {}

tarjetas:
  - id: explore-zonas
    tipo: explorar
    titulo: "Dos zonas y una barrera"
    texto: "Es el primer proyecto conectado a la red: un error ya no quema un componente, puede electrocutar. Toque las zonas."
    libro: [36, 40, 42, 65]
    widget:
      tipo: figura
      figura: fig-50.2
      zonas:
        - { id: primario, rotulo: "Recuadro rojo de la izquierda", rect: [5, 8, 185, 135], texto: "Primario: tensión de red. Todo es peligroso, y el condensador lo sigue siendo minutos después de desenchufar." }
        - { id: barrera, rotulo: "Franja rayada del centro", rect: [189, 5, 80, 140], texto: "La barrera de aislamiento: una separación física con distancias mínimas." }
        - { id: secundario, rotulo: "Recuadro verde de la derecha", rect: [268, 8, 177, 135], texto: "Secundario: baja tensión, separado por el transformador." }
    requiere: { mover: [primario, barrera] }

  - id: toque-cruza
    tipo: tocar
    titulo: "Lo que cruza la barrera"
    texto: "Toque lo único que puede cruzar la barrera de aislamiento, además del transformador."
    libro: [42, 43]
    widget:
      tipo: figura
      figura: fig-50.2
      zonas:
        - { id: primario, rotulo: "Recuadro rojo de la izquierda", rect: [5, 8, 185, 135] }
        - { id: transformador, rotulo: "Recuadro de arriba de la franja", rect: [193, 41, 72, 50] }
        - { id: opto, rotulo: "Recuadro de abajo de la franja", rect: [193, 100, 72, 45] }
        - { id: secundario, rotulo: "Recuadro verde de la derecha", rect: [268, 8, 177, 135] }
    tocar:
      bien: [opto]
      porque:
        primario: "Es una de las zonas, no lo que la cruza."
        transformador: "El transformador ya está dicho: falta lo que lleva señales."
        secundario: "Es la otra zona."
    exito: "El optoacoplador: lleva una señal con luz. Nada más cruza: ni una pista, ni un plano de masa, ni un tornillo."
    escalera:
      - "Una señal que deba cruzar, ¿cómo lo hace sin cobre?"
    solucion: "El optoacoplador."

  - id: ordene-primario
    tipo: pregunta
    titulo: "Lo que lleva el primario"
    texto: "Ordene lo que lleva el primario, desde la entrada de red."
    libro: [46, 47, 48, 49, 50]
    widget:
      tipo: figura
      figura: fig-50.2
      zonas:
        - { id: primario, rotulo: "Recuadro rojo de la izquierda", rect: [5, 8, 185, 135] }
    ordenar:
      - "Fusible"
      - "Varistor o TVS"
      - "Filtro de red con condensadores X e Y"
      - "Limitación de irrupción"
      - "Resistencias de descarga"
    exito: "El fusible va antes de cualquier otra cosa, para que proteja incluso al filtro."
    pistas:
      - { texto: "Lo primero es lo que protege a todo lo demás." }
    escalera:
      - "Empiece por lo que corta y termine por lo que descarga."
    solucion: "Fusible, varistor, filtro, irrupción y descarga."

  - id: condensador-x
    tipo: pregunta
    titulo: "Un condensador X"
    texto: "El filtro de red lleva más de unos 0,1 µF de capacidad X. ¿Qué exige?"
    libro: [48, 50]
    widget:
      tipo: figura
      figura: fig-50.2
      zonas:
        - { id: primario, rotulo: "Recuadro rojo de la izquierda", rect: [5, 8, 185, 135] }
    opciones:
      - texto: "Una resistencia de descarga en paralelo"
        bien: true
        porque: "Para que las patillas del enchufe no conserven tensión peligrosa un segundo después de desenchufar."
      - texto: "Cambiarlo por uno normal del mismo valor"
        porque: "Los X e Y son de seguridad certificada: no se sustituyen por otros del mismo valor."
      - texto: "Nada: al desenchufar se descarga solo"
        porque: "Sin resistencia de descarga el enchufe puede conservar tensión peligrosa."
    escalera:
      - "¿Qué queda en las patillas del enchufe al desenchufar?"
    solucion: "Una resistencia de descarga en paralelo, que la norma exige."

  - id: tierra
    tipo: pregunta
    titulo: "La tierra de protección"
    texto: "La carcasa metálica de la fuente va a tierra. ¿Cómo debe ser esa conexión?"
    libro: [52, 53]
    widget:
      tipo: figura
      figura: fig-50.2
      zonas:
        - { id: secundario, rotulo: "Recuadro verde de la derecha", rect: [268, 8, 177, 135] }
    opciones:
      - texto: "Directa al borne, con tornillo y arandela dentada, la última en ceder"
        bien: true
        porque: "Cada punto va directo al borne de tierra; si un tirón arranca cables, el de tierra cede el último."
      - texto: "En serie de una pieza a otra hasta el borne"
        porque: "Nunca en serie con otra: cada punto va directo al borne."
      - texto: "Con un cable fino, que no estorbe"
        porque: "Debe ser de baja resistencia y la más difícil de soltar del equipo."
    escalera:
      - "Si un tirón arranca cables, ¿cuál debe soltarse el último?"
    solucion: "Directa, de baja resistencia, con tornillo y arandela dentada, y la más difícil de soltar."

  - id: prediga-pinza
    tipo: predecir
    titulo: "La pinza del osciloscopio"
    texto: "Sin transformador de aislamiento, se conecta la pinza de masa de un osciloscopio a un punto del primario. ¿Qué pasa?"
    libro: [55]
    widget:
      tipo: figura
      figura: fig-50.2
      zonas:
        - { id: primario, rotulo: "Recuadro rojo de la izquierda", rect: [5, 8, 185, 135] }
    opciones:
      - texto: "Un cortocircuito a través del instrumento"
        bien: true
        porque: "Desde un fusible fundido hasta un incendio: por eso se mide en el primario con transformador de aislamiento."
      - texto: "Nada: el osciloscopio mide en alta impedancia"
        porque: "La punta sí; la pinza de masa no es de alta impedancia."
      - texto: "Una lectura con ruido"
        porque: "No es una cuestión de ruido: es un cortocircuito."
    escalera:
      - "¿A qué está unida la pinza de masa de un osciloscopio de red?"
    solucion: "Un cortocircuito a través del osciloscopio."

  - id: lampara
    tipo: pregunta
    titulo: "Los encendidos"
    texto: "Durante el desarrollo, ¿qué conviene en cada encendido?"
    libro: [56, 57]
    widget:
      tipo: figura
      figura: fig-50.2
      zonas:
        - { id: primario, rotulo: "Recuadro rojo de la izquierda", rect: [5, 8, 185, 135] }
    opciones:
      - texto: "Una lámpara serie, que limita la corriente y avisa luciendo"
        bien: true
        porque: "Ante un error de montaje, la lámpara limita y se enciende."
      - texto: "Un fusible más grande"
        porque: "Un fusible mayor protege menos; la lámpara limita y avisa."
      - texto: "Desenchufar y esperar antes de tocar, sin medir"
        porque: "No basta esperar: hay que medir que el condensador está por debajo de unos pocos voltios."
    escalera:
      - "¿Qué limita la corriente y además lo dice luciendo?"
    solucion: "Una lámpara serie en cada encendido."

  - id: banco-tierra
    tipo: banco
    titulo: "La tierra, medida"
    texto: "Con un equipo de clase I desenchufado, mida la resistencia entre su carcasa y el pin de tierra del enchufe."
    libro: [64]
    banco:
      piezas: ["Un equipo de clase I con carcasa metálica, desenchufado", "Brymen en Ω, con las puntas anuladas en modo relativo"]
      medir: "La resistencia entre la carcasa y el pin de tierra del enchufe."
      esperado: R_t
      unidad: Ω
      tol: 0.8
      consejos:
        - { cuando: { valor: desviacion, mayor: 0.8 }, texto: "Más de 0,1 Ω: una conexión defectuosa que anula la protección de clase I." }
        - { cuando: { valor: desviacion, menor: -0.8 }, texto: "Casi nada: bien, si ha anulado antes las puntas en modo relativo." }
        - { texto: "Por debajo de 0,1 Ω: la tierra protege." }

  - id: alternativa
    tipo: pregunta
    titulo: "La alternativa razonable"
    texto: "Para una fuente de banco, se usa un módulo de fuente ya fabricado en lugar de diseñar el primario. ¿Qué es?"
    libro: [61]
    widget:
      tipo: figura
      figura: fig-50.2
      zonas:
        - { id: barrera, rotulo: "Franja rayada del centro", rect: [189, 5, 80, 140] }
    opciones:
      - texto: "Una decisión de ingeniería sensata"
        bien: true
        porque: "Trae la barrera, el filtro y las certificaciones resueltas; el proyecto se centra en regular, limitar y medir."
      - texto: "Una renuncia: el proyecto pierde el sentido"
        porque: "No: lo que aporta valor es la regulación, el límite de corriente y la medida."
      - texto: "Algo peligroso"
        porque: "Al contrario: lo peligroso es diseñar el primario como primer proyecto de red."
    escalera:
      - "¿Dónde está el valor del proyecto: en el primario o en lo que viene después?"
    solucion: "Una decisión de ingeniería sensata, no una renuncia."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [36, 43, 55, 64]
    ideas:
      - { titulo: "La barrera.", texto: "Nada la cruza salvo el transformador y los optoacopladores." }
      - { titulo: "El primario.", texto: "Fusible primero; varistor, filtro, irrupción y descarga." }
      - { titulo: "En el banco.", texto: "Transformador de aislamiento, lámpara serie, medir antes de tocar." }
      - { titulo: "La tierra.", texto: "Menos de 0,1 Ω entre la carcasa y el pin de tierra." }
