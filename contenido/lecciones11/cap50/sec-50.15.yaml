# Lección 1.2 de la sección 51.15 «Documentación del Proyecto: Esquema, Placa y Materiales» (cap50; sec-50.N = 51.N).
# - El esquema del núcleo de regulación de la figura 51.23 (fig-50.22) y la distribución de la placa de la figura
#   51.24 (fig-50.23), con zonas en sus piezas y zonas.
# - La excitación de la base del bloque 497 (3 V sobre 470 Ω: unos 4 o 5 mA; con una ganancia de unas decenas, de
#   0,1 a 0,3 A) y su solución (Darlington con BD139 y fuente de corriente de unos 7 mA desde V_raw).
# - Sin modelo numérico: todas las cifras se citan.
# Pasos prácticos: «tocar» lo que hace la transición CV/CC en el esquema y la estrella de masas en la placa.
leccion: cap50/sec-50.15

libro:
  493: "Esquema del núcleo de regulación: lazos CV y CC con transición automática por diodo OR."
  494: "Distribución de la placa: separación de zonas, ranura de aislamiento y masa en estrella."
  497: "gobierna el que pide menos corriente de base"
  498: "su caída y su deriva térmica no afectan a la exactitud: la ganancia del lazo las corrige"
  501: "cuya masa se une a la analógica en un solo punto, la estrella"
  502: "las pistas de medida tocan el cuerpo del componente por dentro de las de potencia"
  505: "22 000 µF / 63 V"
  509: "REF5025 (2,5 V, 3 ppm/°C)"
  "cap50#455": '"110 kΩ"'
  "cap50#514": "El puente de 25 A no es exagerado sino consecuencia de la corriente de pico"

modelo: { valores: {}, calculos: {} }

tarjetas:
  - id: explore-esquema
    tipo: explorar
    titulo: "El núcleo de regulación"
    texto: "Dos lazos y un paso serie en un esquema. Toque sus piezas en el orden en que conviene leerlo."
    libro: [493, 497]
    widget:
      tipo: figura
      figura: fig-50.22
      zonas:
        - { id: q1, rotulo: "Transistor de arriba", rect: [100, 35, 80, 45], texto: "Q1, el camino de potencia: absorbe la diferencia, y toda la corriente pasa por él y por el shunt." }
        - { id: divisor, rotulo: "Resistencias verticales de la derecha", rect: [240, 100, 55, 65], texto: "R1 y R2: la muestra de la tensión medida en la carga, por S+ y S−, para el lazo de tensión." }
        - { id: shunt, rotulo: "Resistencia de abajo", rect: [175, 280, 50, 40], texto: "El shunt, tomado en conexión Kelvin, para el lazo de corriente." }
        - { id: diodos, rotulo: "Diodos de la izquierda", rect: [55, 130, 40, 105], texto: "D1 y D2: el OR que da el control al que pide menos corriente de base." }
    requiere: { mover: [q1, diodos] }

  - id: toque-transicion
    tipo: tocar
    titulo: "Sin lógica ni conmutación"
    texto: "Toque las piezas donde está toda la transición automática entre tensión y corriente constante."
    libro: [497]
    widget:
      tipo: figura
      figura: fig-50.22
      zonas:
        - { id: q1, rotulo: "Transistor de arriba", rect: [100, 35, 80, 45] }
        - { id: divisor, rotulo: "Resistencias verticales de la derecha", rect: [240, 100, 55, 65] }
        - { id: shunt, rotulo: "Resistencia de abajo", rect: [175, 280, 50, 40] }
        - { id: diodos, rotulo: "Diodos de la izquierda", rect: [55, 130, 40, 105] }
    tocar:
      bien: [diodos]
      porque:
        q1: "Es el paso: obedece a quien gobierne, no decide el modo."
        divisor: "Da la muestra de tensión al lazo CV, nada más."
        shunt: "Da la muestra de corriente al lazo CC."
    exito: "Los diodos del OR: gobierna el amplificador que pide menos corriente de base."
    escalera:
      - "Busque dónde se unen las salidas de los dos amplificadores."
    solucion: "D1 y D2, el OR de diodos."

  - id: por-que-diodos
    tipo: porque
    titulo: "Diodos dentro del lazo"
    texto: "Los diodos del OR caen y derivan con la temperatura. ¿Por qué no estropean la exactitud?"
    libro: [498]
    widget:
      tipo: figura
      figura: fig-50.22
      zonas:
        - { id: diodos, rotulo: "Diodos de la izquierda", rect: [55, 130, 40, 105] }
    opciones:
      - texto: "Están dentro del lazo: la ganancia del lazo los corrige"
        bien: true
        porque: "Lo que sí exigen es margen de excursión: el amplificador que manda baja una caída de diodo bajo la base."
      - texto: "Porque su caída es muy pequeña"
        porque: "No es pequeña; da igual porque el lazo la corrige."
      - texto: "Porque se calibran al montar"
        porque: "No hace falta: la ganancia del lazo los corrige."
    escalera:
      - "Lo que está dentro del lazo, ¿lo ve la salida o lo corrige la realimentación?"
    solucion: "Quedan dentro del lazo y su ganancia los corrige."

  - id: excitacion
    tipo: pregunta
    titulo: "470 Ω no alcanzan"
    texto: "Con 3 V de margen, R_{drv} de 470 Ω da unos 4 o 5 mA de base, y el TIP35C entrega con eso de 0,1 a 0,3 A. ¿Cómo se resuelve en el montaje?"
    libro: [497]
    widget:
      tipo: figura
      figura: fig-50.22
      zonas:
        - { id: q1, rotulo: "Transistor de arriba", rect: [100, 35, 80, 45] }
    opciones:
      - texto: "Darlington con un BD139 y una fuente de corriente de unos 7 mA desde V_{raw}"
        bien: true
        porque: "No depende del margen del prerregulador y no se convierte en corrientes que los operacionales no podrían absorber."
      - texto: "Bajando R_{drv} hasta dar la corriente necesaria"
        porque: "Si el prerregulador pierde el seguimiento, la corriente crecería hasta lo que los operacionales no absorben."
      - texto: "Subiendo la ganancia del lazo"
        porque: "El lazo no da corriente de base: hace falta más excitación."
    escalera:
      - "Falta corriente de base, y no conviene que dependa del margen."
    solucion: "Q1 en Darlington con un BD139 y una fuente de corriente de unos 7 mA."

  - id: diferencial
    tipo: pregunta
    titulo: "El divisor del esquema"
    texto: "El esquema dibuja R1 y R2 como un divisor. ¿Qué se monta en realidad, y por qué?"
    libro: [497, "cap50#455"]
    widget:
      tipo: figura
      figura: fig-50.22
      zonas:
        - { id: divisor, rotulo: "Resistencias verticales de la derecha", rect: [240, 100, 55, 65] }
    opciones:
      - texto: "Un amplificador diferencial de 120 kΩ y 10 kΩ, porque S− no está a masa"
        bien: true
        porque: "Mide S+ − S− en la carga, como pide el sensado remoto."
      - texto: "El mismo divisor de 110 kΩ y 10 kΩ"
        porque: "Con S− en la carga, el divisor a masa metería la caída del retorno multiplicada."
      - texto: "Nada: el sensado no necesita divisor"
        porque: "Hace falta escalar la salida; con sensado remoto, con un diferencial."
    escalera:
      - "¿Está S− en la masa de la placa?"
    solucion: "Un diferencial de 120 kΩ / 10 kΩ."

  - id: toque-estrella
    tipo: tocar
    titulo: "Un solo punto"
    texto: "En la distribución de la placa, toque el punto donde la masa digital se une a la analógica."
    libro: [494, 501]
    widget:
      tipo: figura
      figura: fig-50.23
      zonas:
        - { id: red, rotulo: "Franja roja de la izquierda", rect: [32, 60, 72, 175] }
        - { id: control, rotulo: "Recuadro azul de abajo", rect: [108, 157, 84, 80] }
        - { id: estrella, rotulo: "Estrella entre los recuadros de abajo", rect: [195, 178, 40, 37] }
        - { id: digital, rotulo: "Recuadro violeta de abajo", rect: [234, 157, 92, 80] }
    tocar:
      bien: [estrella]
      porque:
        red: "Es la zona de red, aislada por la ranura: ninguna pista la cruza."
        control: "Tiene su propia masa; se une a la digital en un solo punto."
        digital: "Su masa se une a la analógica en un solo punto, fuera de ella."
    exito: "La estrella: las masas se unen en un solo punto."
    escalera:
      - "Busque el símbolo donde convergen las líneas."
    solucion: "La estrella, entre el control analógico y el digital."

  - id: kelvin
    tipo: pregunta
    titulo: "El shunt en Kelvin"
    texto: "¿De dónde deben salir las pistas de medida del shunt?"
    libro: [502]
    widget:
      tipo: figura
      figura: fig-50.22
      zonas:
        - { id: shunt, rotulo: "Resistencia de abajo", rect: [175, 280, 50, 40] }
    opciones:
      - texto: "Del cuerpo del componente, por dentro de las de potencia"
        bien: true
        porque: "Así no miden la caída de las pistas de potencia: es la conexión Kelvin."
      - texto: "De cualquier punto de las pistas de potencia"
        porque: "Medirían también la caída de las pistas, que es del orden del shunt."
      - texto: "De la masa en estrella"
        porque: "Se toman en las islas del propio shunt."
    escalera:
      - "Con 0,01 Ω, ¿cuánto pesa un trozo de pista?"
    solucion: "Del interior de las islas del shunt."

  - id: empareje-bom
    tipo: pregunta
    titulo: "La lista, con razones"
    texto: "Empareje cada pieza de la lista de materiales con su razón."
    libro: [505, 509, "cap50#514"]
    widget:
      tipo: figura
      figura: fig-50.23
      zonas:
        - { id: placa, rotulo: "La placa", rect: [5, 50, 345, 200] }
    emparejar:
      - ["REF5025", "Fija la exactitud del conjunto"]
      - ["Condensador de 22 000 µF", "Sale del rizado admisible"]
      - ["Puente de 25 A", "La corriente de pico, no la media"]
    exito: "Cada valor de la tabla procede de un número calculado."
    pistas:
      - { texto: "El puente no se dimensiona por la corriente media." }
    escalera:
      - "Una pieza da la exactitud; otra, el rizado; otra aguanta picos."
    solucion: "Referencia, exactitud; condensador, rizado; puente, picos."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [497, 498, 501, 502]
    ideas:
      - { titulo: "Leer el esquema.", texto: "Potencia, lazo CV, lazo CC, OR de diodos y excitación de la base." }
      - { titulo: "El OR.", texto: "Gobierna el que pide menos; sus diodos quedan dentro del lazo." }
      - { titulo: "La placa.", texto: "Zonas separadas, ranura de red y masas unidas en la estrella." }
      - { titulo: "Dos reglas.", texto: "Shunt en Kelvin y par de sensado trenzado." }
