# Lección 1.2 de la sección 51.15 «Documentación del Proyecto: Esquema, Placa y Materiales» (cap50; sec-50.N = 51.N).
# - El esquema del núcleo de regulación de la figura 51.23 (fig-50.22) y la distribución de la placa de la figura
#   51.24 (fig-50.23), con zonas en sus piezas y zonas.
# - La excitación de la base del bloque 497 (3 V sobre 470 Ω: unos 4 o 5 mA; con una ganancia de unas decenas, de
#   0,1 a 0,3 A) y su solución (Darlington con BD139 y fuente de corriente de unos 7 mA desde V_raw).
# - Sin modelo numérico: todas las cifras se citan.
# Pasos prácticos: «tocar» lo que hace la transición CV/CC en el esquema y la estrella de masas en la placa.
# 1.2.1 (autor121-pot, «aprender haciendo», GUIA §13): la excitación de la base del bloque 497 pasa a modelo con
# valores de ejemplo (V_BE de 0,7 V; ganancias de 30 para el TIP35C, «unas decenas», y de 40 para el BD139): se calcula
# la corriente de base con 470 Ω (unos 4,9 mA) y se consigue llegar a 5 A con el Darlington y la fuente de 7 mA
# (objetivo). Se calcula la R₁ del diferencial (120 kΩ). Quedan dos preguntas (los diodos dentro del lazo y Kelvin);
# la lista de materiales, al resumen.
leccion: cap50/sec-50.15

libro:
  493: "Esquema del núcleo de regulación: lazos CV y CC con transición automática por diodo OR."
  494: "Distribución de la placa: separación de zonas, ranura de aislamiento y masa en estrella."
  497: "gobierna el que pide menos corriente de base"
  498: "su caída y su deriva térmica no afectan a la exactitud: la ganancia del lazo las corrige"
  501: "cuya masa se une a la analógica en un solo punto, la estrella"
  502: "las pistas de medida tocan el cuerpo del componente por dentro de las de potencia"
  505: "22 000 µF / 63 V"
  509: "REF5025 (2,5 V, 3 ppm/°C)"
  "cap50#455": '"110 kΩ"'
  "cap50#457": '"120 kΩ"'
  "cap50#514": "El puente de 25 A no es exagerado sino consecuencia de la corriente de pico"

modelo:
  valores:
    V_m: { sim: "V_{margen}", nombre: "margen del prerregulador", unidad: V, valor: 3 }
    V_be: { sim: "V_{BE}", nombre: "tensión base-emisor", unidad: V, valor: 0.7 }
    R_drv: { sim: "R_{drv}", nombre: "resistencia de excitación", unidad: Ω, valor: 470 }
    b_1: { sim: "β₁", nombre: "ganancia del TIP35C a 5 A", unidad: "", valor: 30 }
    b_2: { sim: "β₂", nombre: "ganancia del BD139", unidad: "", valor: 40 }
    I_f: { sim: "I_{drv}", nombre: "fuente de corriente de base", unidad: A, valor: 0.007 }
    dar: { tipo: interruptor, nombre: "Darlington con fuente de corriente", valor: 0 }
    V_max: { sim: "V_{máx}", nombre: "fondo de escala", unidad: V, valor: 30 }
    V_ref: { sim: "V_{ref}", nombre: "referencia", unidad: V, valor: 2.5 }
    R_2: { sim: "R₂", nombre: "resistencia de abajo", unidad: Ω, valor: 10000 }
  calculos:
    I_b1: { expr: "(V_m - V_be)/R_drv", sim: "I_{B}", nombre: "corriente de base con 470 Ω", unidad: A }
    I_b6: { expr: "V_m/R_drv", sim: "I_{B}", nombre: "sin la V_BE (error)", unidad: A }
    I_bact: { si: dar, entonces: "I_f", sino: "I_b1", sim: "I_{B}", nombre: "corriente de excitación", unidad: A }
    I_max: { si: dar, entonces: "I_f*b_1*b_2", sino: "I_b1*b_1", sim: "I_{máx}", nombre: "corriente máxima de salida", unidad: A }
    R_1d: { expr: "R_2*V_max/V_ref", sim: "R₁", nombre: "R₁ del diferencial", unidad: Ω }
    R_1v: { expr: "R_2*(V_max/V_ref - 1)", sim: "R₁", nombre: "R₁ del divisor a masa", unidad: Ω }

tarjetas:
  - id: simule-base
    tipo: simular
    titulo: "La corriente de base"
    texto: "En el esquema, R_{drv} de 470 Ω lleva a la base de Q1 lo que queda del margen de 3 V. Con 0,7 V de V_{BE} (valor de ejemplo), ¿cuánta corriente?"
    libro: [493, 497]
    fijar: { dar: 0 }
    widget:
      tipo: grafica
      x: { id: rx, min: 100, max: 1000, unidad: Ω, rotulo: "R_{drv}" }
      y: { min: 0, max: 0.03, unidad: A, rotulo: "I_{B}" }
      curvas:
        - { expr: "(V_m - V_be)/rx", color: naranja, rotulo: "corriente de base" }
      lectura: { valor: I_b1, rotulo: "Corriente de base" }
      ocultar: true
    simular:
      objetivo: I_b1
      unidad: A
      tol: 0.04
      rotulo: "Corriente de base"
      errores:
        - { expr: "I_b6", texto: "Le falta restar la V_{BE}: a R_{drv} no le llegan los 3 V enteros." }
    exito: "Unos 4,9 mA: los «4 o 5 mA» del libro."
    escalera:
      - "(3 − 0,7) V / 470 Ω."
    solucion: "(3 − 0,7) V / 470 Ω ≈ 4,9 mA."
    comprobar:
      - { I_b1: 0.00489, I_b6: 0.00638, V_be: 0.7, tol: 0.01 }

  - id: explore-esquema
    tipo: explorar
    titulo: "470 Ω no alcanzan"
    texto: "Valores de ejemplo: el TIP35C tiene una ganancia de 30 a 5 A, y el BD139, de 40. Consiga que la fuente pueda dar sus 5 A."
    libro: [497, 509]
    inicio: { dar: 0 }
    widget:
      tipo: grafica
      x: { id: ib, min: 0, max: 0.01, unidad: A, rotulo: "corriente de excitación" }
      y: { min: 0, max: 10, unidad: A, rotulo: "I_{máx}" }
      curvas:
        - { expr: "b_1*ib", color: tinta, rotulo: "TIP35C solo", discontinua: true }
        - { expr: "b_1*b_2*ib", color: naranja, rotulo: "Darlington con BD139" }
      marcas:
        - { x: "I_bact", y: "I_max", rotulo: "{{I_max}}" }
      lectura: { valor: I_max, rotulo: "Corriente máxima" }
      mandos:
        - { valor: dar, tipo: interruptor, rotulo: "Darlington con fuente de 7 mA" }
    objetivo:
      condiciones:
        - { valor: I_max, min: 5, rotulo: "Hasta: {{I_max}}" }
      logrado: "Con el BD139 en Darlington y una fuente de corriente de unos 7 mA desde V_{raw}, la base admite {{I_max}}. Y no depende del margen del prerregulador."
      pistas:
        - { texto: "Con 470 Ω, el TIP35C entrega de 0,1 a 0,3 A: falta ganancia y excitación." }
    escalera:
      - "Con dos transistores en Darlington las ganancias se multiplican."
    solucion: "Darlington con BD139 y fuente de 7 mA: 7 mA × 40 × 30 ≈ 8,4 A."
    comprobar:
      - { con: { dar: 1 }, I_max: 8.4, I_f: 0.007, tol: 0.01 }
      - { con: { dar: 0 }, I_max: 0.147, tol: 0.01 }

  - id: toque-transicion
    tipo: tocar
    titulo: "Sin lógica ni conmutación"
    texto: "Toque las piezas donde está toda la transición automática entre tensión y corriente constante."
    libro: [497]
    widget:
      tipo: figura
      figura: fig-50.22
      zonas:
        - { id: q1, rotulo: "Transistor de arriba", rect: [100, 35, 80, 45] }
        - { id: divisor, rotulo: "Resistencias verticales de la derecha", rect: [240, 100, 55, 65] }
        - { id: shunt, rotulo: "Resistencia de abajo", rect: [175, 280, 50, 40] }
        - { id: diodos, rotulo: "Diodos de la izquierda", rect: [55, 130, 40, 105] }
    tocar:
      bien: [diodos]
      porque:
        q1: "Es el paso: obedece a quien gobierne, no decide el modo."
        divisor: "Da la muestra de tensión al lazo CV, nada más."
        shunt: "Da la muestra de corriente al lazo CC."
    exito: "Los diodos del OR: gobierna el amplificador que pide menos corriente de base."
    escalera:
      - "Busque dónde se unen las salidas de los dos amplificadores."
    solucion: "D1 y D2, el OR de diodos."

  - id: por-que-diodos
    tipo: porque
    titulo: "Diodos dentro del lazo"
    texto: "Los diodos del OR caen y derivan con la temperatura. ¿Por qué no estropean la exactitud?"
    libro: [498]
    widget:
      tipo: figura
      figura: fig-50.22
      zonas:
        - { id: diodos, rotulo: "Diodos de la izquierda", rect: [55, 130, 40, 105] }
    opciones:
      - texto: "Están dentro del lazo: la ganancia del lazo los corrige"
        bien: true
        porque: "Lo que sí exigen es margen de excursión: el amplificador que manda baja una caída de diodo bajo la base."
      - texto: "Porque su caída es muy pequeña"
        porque: "No es pequeña; da igual porque el lazo la corrige."
      - texto: "Porque se calibran al montar"
        porque: "No hace falta: la ganancia del lazo los corrige."
    escalera:
      - "Lo que está dentro del lazo, ¿lo ve la salida o lo corrige la realimentación?"
    solucion: "Quedan dentro del lazo y su ganancia los corrige."

  - id: diferencial
    tipo: simular
    titulo: "El divisor del esquema"
    texto: "El esquema dibuja R1-R2 como un divisor, pero se monta un diferencial porque S− no está a masa. Con R2 de 10 kΩ y 2,5 V para 30 V, ¿qué R1?"
    libro: [497, "cap50#455", "cap50#457"]
    widget:
      tipo: grafica
      x: { id: vx, min: 5, max: 30, unidad: V, rotulo: "V_{máx}" }
      y: { min: 0, max: 150000, unidad: Ω, rotulo: "R₁" }
      curvas:
        - { expr: "R_2*vx/V_ref", color: naranja, rotulo: "diferencial" }
        - { expr: "R_2*(vx/V_ref - 1)", color: tinta, rotulo: "divisor a masa", discontinua: true }
      lectura: { valor: R_1d, rotulo: "R₁" }
      ocultar: true
    simular:
      objetivo: R_1d
      unidad: Ω
      tol: 0.03
      rotulo: "R₁ del diferencial"
      errores:
        - { expr: "R_1v", texto: "Esos 110 kΩ son los del divisor a masa; el diferencial de ganancia R₂/R₁ pide R₂·V_{máx}/V_{ref}." }
    exito: "120 kΩ, con R3 = R1 y R4 = R2: mide S+ − S− en la carga, como pide el sensado remoto."
    escalera:
      - "R₁ = R₂ · V_{máx}/V_{ref}."
    solucion: "10 kΩ × 30/2,5 = 120 kΩ."
    comprobar:
      - { R_1d: 120000, R_1v: 110000 }

  - id: toque-estrella
    tipo: tocar
    titulo: "Un solo punto"
    texto: "En la distribución de la placa, toque el punto donde la masa digital se une a la analógica."
    libro: [494, 501]
    widget:
      tipo: figura
      figura: fig-50.23
      zonas:
        - { id: red, rotulo: "Franja roja de la izquierda", rect: [32, 60, 72, 175] }
        - { id: control, rotulo: "Recuadro azul de abajo", rect: [108, 157, 84, 80] }
        - { id: estrella, rotulo: "Estrella entre los recuadros de abajo", rect: [195, 178, 40, 37] }
        - { id: digital, rotulo: "Recuadro violeta de abajo", rect: [234, 157, 92, 80] }
    tocar:
      bien: [estrella]
      porque:
        red: "Es la zona de red, aislada por la ranura: ninguna pista la cruza."
        control: "Tiene su propia masa; se une a la digital en un solo punto."
        digital: "Su masa se une a la analógica en un solo punto, fuera de ella."
    exito: "La estrella: las masas se unen en un solo punto."
    escalera:
      - "Busque el símbolo donde convergen las líneas."
    solucion: "La estrella, entre el control analógico y el digital."

  - id: kelvin
    tipo: pregunta
    titulo: "El shunt en Kelvin"
    texto: "¿De dónde deben salir las pistas de medida del shunt?"
    libro: [502]
    widget:
      tipo: figura
      figura: fig-50.22
      zonas:
        - { id: shunt, rotulo: "Resistencia de abajo", rect: [175, 280, 50, 40] }
    opciones:
      - texto: "Del cuerpo del componente, por dentro de las de potencia"
        bien: true
        porque: "Así no miden la caída de las pistas de potencia: es la conexión Kelvin."
      - texto: "De cualquier punto de las pistas de potencia"
        porque: "Medirían también la caída de las pistas, que es del orden del shunt."
      - texto: "De la masa en estrella"
        porque: "Se toman en las islas del propio shunt."
    escalera:
      - "Con 0,01 Ω, ¿cuánto pesa un trozo de pista?"
    solucion: "Del interior de las islas del shunt."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [497, 498, 501, 502, 505, 509, "cap50#514"]
    ideas:
      - { titulo: "Leer el esquema.", texto: "Potencia, lazo CV, lazo CC, OR de diodos y excitación de la base." }
      - { titulo: "El OR.", texto: "Gobierna el que pide menos; sus diodos quedan dentro del lazo." }
      - { titulo: "La placa.", texto: "Zonas separadas, ranura de red y masas unidas en la estrella." }
      - { titulo: "Dos reglas.", texto: "Shunt en Kelvin y par de sensado trenzado. Y cada pieza de la lista sale de un cálculo: REF5025, 22 000 µF, puente de 25 A por los picos." }
