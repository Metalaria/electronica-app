# Lección 1.2 de la sección 51.3 «Arquitectura» (cap50; etiquetas sec-50.N = impresas 51.N).
# - El ejemplo de los bloques 78–81 (30 V de entrada, 3 V y 3 A de salida: 81 W en el lineal solo; con un
#   prerregulador que deja 3 V, 9 W) en el esquema «regulador-lineal» vivo: la entrada del lineal es 30 V o, con el
#   prerregulador, la salida más 3 V. Salida sin divisor (la referencia hace de consigna) y carga de 1 Ω (3 A).
# - Los bloques y los dos lazos unidos por diodos de la figura 51.4 (fig-48.3), con zonas.
# Paso práctico: «tocar» el bloque que sigue a la salida.
# 1.2.1 (autor121-pot, «aprender haciendo», GUIA §13): se baja el calor del lineal de 10 W (objetivo, activando el
# prerregulador), se calculan los 81 W del lineal solo y los 87 W con 1 V y 3 A cuando el prerregulador no baja
# (bloque 89; la carga pasa a pedir siempre 3 A, R_L = V_out/3), y se tocan el seguimiento y la unión por diodos.
# Quedan dos preguntas (el ruido y los lazos anidados); el banco y la descarga de salida, al resumen.
leccion: cap50/sec-50.3

libro:
  71: "Prerregulador conmutado, que sigue a la salida manteniendo una diferencia pequeña sobre ella."
  73: "con el que esté más limitado tomando el control"
  78: "Un lineal solo, con 30 V de entrada dando 3 V a 3 A, disipa:"
  79: '"81 W"'
  81: '"9 W"'
  82: "todo el ruido del conmutado queda filtrado por el lineal, que tiene un PSRR excelente"
  85: "unos 3,5 V con el TIP142 de este diseño"
  87: "Suficiente margen para que el lineal nunca entre en dropout"
  88: "Lazo más lento que el del lineal, o ambos interactúan y oscilan."
  89: "por eso su comportamiento con la salida baja es el que hay que verificar"
  92: "el que pida menos tensión de control gobierna"
  94: "Una fuente en modo corriente con la tensión hundida parece averiada"
  97: "Una fuente sin descarga activa baja de 20 a 5 V en varios segundos"
  100: "que es su impedancia de salida"
  101: "donde debe verse si el lineal está filtrando bien el conmutado"
  102: "La respuesta a un escalón de carga, que revela el margen de fase del lazo"
  105: "Fuente de banco con prerregulador conmutado, regulador lineal y dos lazos de control"

modelo:
  valores:
    V_raw: { sim: "V_{in}", nombre: "entrada sin prerregulador", unidad: V, valor: 30 }
    V_s: { sim: "V_{out}", nombre: "salida ajustada", unidad: V, valor: 3 }
    V_hr: { sim: "ΔV", nombre: "caída que deja el prerregulador", unidad: V, valor: 3 }
    I_s: { sim: "I", nombre: "corriente que pide la carga", unidad: A, valor: 3 }
    P_obj: { sim: "P", nombre: "calor que se quiere no superar", unidad: W, valor: 10 }
    pre: { tipo: interruptor, nombre: "prerregulador", valor: 0 }
  calculos:
    V_in: { si: pre, entonces: "V_s + V_hr", sino: "V_raw", sim: "V_{in}", nombre: "entrada del lineal", unidad: V }
    R_L: { expr: "V_s/I_s", sim: "R_{L}", nombre: "carga que pide 3 A", unidad: Ω }
    I_o: { expr: "V_s/R_L", sim: "I", nombre: "corriente de salida", unidad: A }
    V_q: { expr: "V_in - V_s", sim: "ΔV", nombre: "tensión que sobra en el lineal", unidad: V }
    P_in: { expr: "V_in*I_o", sim: "P", nombre: "toda la potencia de entrada (error)", unidad: W }
    P_hr: { expr: "V_hr*I_o", sim: "P", nombre: "con el prerregulador siguiendo (error)", unidad: W }
    P_q: { expr: "(V_in - V_s)*I_o", sim: "P", nombre: "potencia en el lineal", unidad: W }
    r_p: { expr: "(V_raw - V_s)/V_hr", sim: "×", nombre: "veces menos con prerregulador", unidad: "", cifras: 2 }

tarjetas:
  - id: explore-pre
    tipo: explorar
    titulo: "Lineal solo o con prerregulador"
    texto: "30 V de entrada, 3 V y 3 A de salida. Consiga que el lineal se caliente con menos de 10 W."
    libro: [71, 78, 81]
    inicio: { pre: 0 }
    fijar: { V_s: 3 }
    widget:
      tipo: circuito
      esquema: regulador-lineal
      piezas: { entrada: V_in, ref: V_s, carga: R_L }
      lectura: { valor: V_in, rotulo: "Entrada del lineal" }
      corriente: I_o
      mide: { vout: V_s, iin: I_o, p_paso: P_q }
      mandos:
        - { valor: pre, tipo: interruptor, rotulo: "Prerregulador" }
    objetivo:
      condiciones:
        - { valor: P_q, max: 10, rotulo: "Menos de 10 W en el lineal" }
      logrado: "Con el prerregulador, la entrada del lineal es {{V_in}}: solo sobran 3 V y disipa {{P_q}}, nueve veces menos."
      pistas:
        - { texto: "Al lineal le sobran 27 V: algo tiene que bajarle la entrada." }
    escalera:
      - "El lineal disipa lo que le sobra por la corriente."
    solucion: "Activar el prerregulador: 3 V × 3 A = 9 W."
    comprobar:
      - { con: { pre: 0 }, P_q: 81, I_o: 3, V_in: 30, V_q: 27, P_obj: 10 }
      - { con: { pre: 1 }, P_q: 9, V_in: 6, r_p: 9 }

  - id: formula-lineal
    tipo: simular
    titulo: "El lineal solo"
    texto: "Sin prerregulador, el lineal tiene 30 V a la entrada y da 3 V a 3 A. ¿Cuánto disipa?"
    libro: [78, 79]
    fijar: { pre: 0, V_s: 3 }
    widget:
      tipo: grafica
      x: { id: vx, min: 0, max: 30, unidad: V, rotulo: "V_{out}" }
      y: { min: 0, max: 100, unidad: W, rotulo: "P" }
      curvas:
        - { expr: "(V_raw - vx)*I_s", color: naranja, rotulo: "lineal solo" }
        - { expr: "V_hr*I_s + 0*vx", color: verde, rotulo: "con prerregulador" }
      lectura: { valor: P_q, rotulo: "Calor en el lineal" }
      ocultar: true
    simular:
      objetivo: P_q
      unidad: W
      tol: 0.03
      rotulo: "Calor en el lineal"
      errores:
        - { expr: "P_in", texto: "Esa es toda la potencia que entra; a la carga llegan 9 W, que no se quedan en el lineal." }
    exito: "81 W: un disipador enorme y un ventilador."
    escalera:
      - "Lo que sobra, (30 − 3) V, por los 3 A."
    solucion: "(30 − 3) × 3 = 81 W."
    comprobar:
      - { P_q: 81, P_in: 90 }

  - id: por-que-ruido
    tipo: porque
    titulo: "¿Y el ruido del conmutado?"
    texto: "El prerregulador conmuta y hace ruido. ¿Por qué no llega a la salida?"
    libro: [82]
    widget:
      tipo: figura
      figura: fig-48.3
      zonas:
        - { id: lineal, rotulo: "Tercer bloque de arriba", rect: [188, 26, 84, 48] }
    opciones:
      - texto: "El lineal lo filtra: tiene un PSRR excelente"
        bien: true
        porque: "Es lo mejor de ambos: rendimiento del conmutado y ruido bajo del lineal."
      - texto: "Porque el prerregulador no hace ruido"
        porque: "Sí lo hace; el lineal que va detrás lo rechaza."
      - texto: "Porque el transformador lo bloquea"
        porque: "El transformador está antes; quien lo filtra es el lineal."
    escalera:
      - "¿Qué bloque va entre el conmutado y la salida?"
    solucion: "El lineal lo rechaza con su PSRR."

  - id: toque-sigue
    tipo: tocar
    titulo: "El que sigue a la salida"
    texto: "Toque el bloque que ajusta su salida para dejar unos 3 V sobre el elemento lineal."
    libro: [71, 105]
    widget:
      tipo: figura
      figura: fig-48.3
      zonas:
        - { id: entrada, rotulo: "Primer bloque de arriba", rect: [5, 26, 74, 48] }
        - { id: pre, rotulo: "Segundo bloque de arriba", rect: [95, 26, 76, 48] }
        - { id: lineal, rotulo: "Tercer bloque de arriba", rect: [188, 26, 84, 48] }
        - { id: tension, rotulo: "Bloque azul de abajo", rect: [222, 179, 96, 37] }
    tocar:
      bien: [pre]
      porque:
        entrada: "Transforma, rectifica y filtra: no sigue a la salida."
        lineal: "Es el que recibe esos 3 V encima; quien los fija es el anterior."
        tension: "Es el lazo de tensión del lineal, no el seguimiento."
    exito: "El prerregulador: su lazo mide la caída sobre el lineal y la mantiene en unos 3 a 4 V."
    escalera:
      - "Busque la flecha discontinua que vuelve atrás."
    solucion: "El prerregulador conmutado."

  - id: dos-lazos
    tipo: pregunta
    titulo: "Dos lazos anidados"
    texto: "El prerregulador tiene su lazo y el lineal el suyo. ¿Cómo deben ser sus velocidades?"
    libro: [87, 88]
    widget:
      tipo: figura
      figura: fig-48.3
      zonas:
        - { id: pre, rotulo: "Segundo bloque de arriba", rect: [95, 26, 76, 48] }
    opciones:
      - texto: "El del prerregulador, más lento que el del lineal"
        bien: true
        porque: "Si no, interactúan y oscilan: el lazo interno debe ser mucho más rápido."
      - texto: "Iguales, para que vayan sincronizados"
        porque: "Con velocidades parecidas interactúan y oscilan."
      - texto: "El del prerregulador, más rápido"
        porque: "Al revés: el rápido debe ser el del lineal."
    escalera:
      - "¿Cuál de los dos es el lazo interno, el que da la salida final?"
    solucion: "El del prerregulador, más lento."

  - id: salida-baja
    tipo: simular
    titulo: "Con la salida baja"
    texto: "Con 1 V y 3 A, un prerregulador que no baja lo suficiente deja sobre el lineal casi toda la entrada de 30 V. ¿Cuánto disipa?"
    libro: [78, 89]
    fijar: { pre: 0, V_s: 1 }
    widget:
      tipo: grafica
      x: { id: vx, min: 0, max: 30, unidad: V, rotulo: "V_{out}" }
      y: { min: 0, max: 100, unidad: W, rotulo: "P" }
      curvas:
        - { expr: "(V_raw - vx)*I_s", color: naranja, rotulo: "lineal solo" }
        - { expr: "V_hr*I_s + 0*vx", color: verde, rotulo: "con prerregulador" }
      lectura: { valor: P_q, rotulo: "Calor en el lineal" }
      ocultar: true
    simular:
      objetivo: P_q
      unidad: W
      tol: 0.03
      rotulo: "Calor en el lineal"
      errores:
        - { expr: "P_hr", texto: "Eso sería si el prerregulador siguiera a la salida; aquí no baja." }
    exito: "Unos 87 W, más que con 3 V: vuelve a ser la del lineal solo. Por eso hay que verificar el extremo bajo."
    escalera:
      - "Sobran (30 − 1) V, por los 3 A."
    solucion: "(30 − 1) × 3 = 87 W."
    comprobar:
      - { P_q: 87, P_hr: 9, I_o: 3 }

  - id: transicion
    tipo: tocar
    titulo: "Tensión o corriente"
    texto: "La fuente pasa sola de regular tensión a regular corriente. Toque dónde se decide qué lazo manda."
    libro: [73, 92, 105]
    widget:
      tipo: figura
      figura: fig-48.3
      zonas:
        - { id: shunt, rotulo: "La resistencia de arriba a la derecha", rect: [318, 32, 40, 36] }
        - { id: corriente, rotulo: "Bloque verde de arriba", rect: [224, 90, 94, 37] }
        - { id: diodos, rotulo: "Los dos diodos, a la izquierda", rect: [188, 95, 36, 115] }
        - { id: tension, rotulo: "Bloque azul de abajo", rect: [224, 180, 94, 37] }
    tocar:
      bien: [diodos]
      porque:
        shunt: "Mide la corriente; no decide nada."
        corriente: "Compara el shunt con el límite: pide, pero no decide solo."
        tension: "Compara la salida con la consigna: pide, pero no decide solo."
    exito: "Un OR analógico: el amplificador que pide menos tensión de control gobierna. Y un indicador del modo activo, porque en corriente parece averiada."
    escalera:
      - "Los dos amplificadores tiran del mismo nodo: ¿qué los une?"
    solucion: "La unión por diodos."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [78, 81, 88, 92, 97, 100, 101, 102, 85, 94]
    ideas:
      - { titulo: "Prerregulador más lineal.", texto: "De 81 W a 9 W, con el ruido filtrado por el lineal." }
      - { titulo: "Seguimiento.", texto: "Unos 3 a 4 V sobre el lineal, también con la salida baja." }
      - { titulo: "Lazos.", texto: "El del prerregulador, más lento que el del lineal; entre tensión y corriente manda, por diodos, el que pide menos." }
      - { titulo: "En el banco.", texto: "Regulación de carga, la impedancia de salida; rizado, el filtrado; escalón, el margen de fase. Y descarga activa: sin ella, de 20 a 5 V tarda segundos." }
