# Lección 1.2 de la sección 51.13 «Ampliaciones y Cierre» (cap50; etiquetas sec-50.N = impresas 51.N).
# - Las cinco ampliaciones y lo que ha enseñado el proyecto en la figura 51.19 (fig-50.18), con zonas.
# - Sin modelo numérico.
# Paso práctico: «tocar» la ampliación cuya exigencia es la monotonía del DAC.
leccion: cap50/sec-50.13

libro:
  407: "hay cinco ampliaciones que la convierten en un instrumento serio"
  410: "porque la exactitud de la medida es la de esa referencia"
  411: "Un panel que muestre la consigna en lugar de la medida no sirve para nada."
  414: "memorias de ajustes, límites programables, rampas suaves, y control remoto"
  415: "el DAC debe ser monótono"
  418: "Es la ampliación más rentable en términos de calor, y la que más trabajo da"
  421: "las masas dejan de ser comunes"
  423: "Protege el circuito bajo prueba de un fallo de la fuente."
  424: "Protección térmica con reducción progresiva."
  425: "Registro de eventos, que dice qué pasó cuando algo se protegió."
  428: "Rectificación y filtrado con márgenes reales"
  429: "exactitud, estabilidad, y comportamiento ante lo imprevisto"
  432: "En regulación y rizado, una fuente casera bien hecha compite."
  433: "Las cinco ampliaciones de la fuente y lo que el proyecto ha enseñado."

modelo: { valores: {}, calculos: {} }

tarjetas:
  - id: explore-ampliaciones
    tipo: explorar
    titulo: "Cinco ampliaciones"
    texto: "La fuente básica funciona; estas cinco la convierten en un instrumento serio. Toque las ampliaciones."
    libro: [407, 433]
    widget:
      tipo: figura
      figura: fig-50.18
      zonas:
        - { id: medida, rotulo: "Recuadro verde", rect: [5, 4, 140, 63], texto: "Medida digital: tensión y corriente reales con un microcontrolador." }
        - { id: control, rotulo: "Recuadro azul", rect: [157, 4, 139, 63], texto: "Control digital: DAC y codificadores en lugar de potenciómetros." }
        - { id: pre, rotulo: "Recuadro naranja de arriba", rect: [308, 4, 139, 63], texto: "Prerregulador conmutado: unos voltios de caída sobre el lineal." }
        - { id: doble, rotulo: "Recuadro violeta", rect: [5, 74, 140, 63], texto: "Salida doble: independiente, en serie o en paralelo." }
        - { id: protecciones, rotulo: "Recuadro rojo", rect: [157, 74, 139, 63], texto: "Protecciones: OVP, térmica progresiva y registro de eventos." }
    requiere: { mover: [medida, protecciones] }

  - id: toque-monotono
    tipo: tocar
    titulo: "Que no baje al subir"
    texto: "Toque la ampliación en la que, si un componente no es monótono, al girar el mando la tensión puede bajar."
    libro: [414, 415]
    widget:
      tipo: figura
      figura: fig-50.18
      zonas:
        - { id: medida, rotulo: "Recuadro verde", rect: [5, 4, 140, 63] }
        - { id: control, rotulo: "Recuadro azul", rect: [157, 4, 139, 63] }
        - { id: pre, rotulo: "Recuadro naranja de arriba", rect: [308, 4, 139, 63] }
        - { id: doble, rotulo: "Recuadro violeta", rect: [5, 74, 140, 63] }
    tocar:
      bien: [control]
      porque:
        medida: "La medida lee; no fija la consigna con un DAC."
        pre: "Su exigencia es otra: un lazo más lento que el del lineal."
        doble: "Su dificultad son las masas en serie."
    exito: "El control digital: el DAC debe ser monótono."
    escalera:
      - "¿Qué convertidor sustituye al potenciómetro de consigna?"
    solucion: "El control digital: un DAC no monótono baja la tensión al subir el mando."

  - id: medida-real
    tipo: pregunta
    titulo: "Lo que muestra el panel"
    texto: "Un panel digital muestra la tensión de la fuente. ¿Qué debe mostrar?"
    libro: [410, 411]
    widget:
      tipo: figura
      figura: fig-50.18
      zonas:
        - { id: medida, rotulo: "Recuadro verde", rect: [5, 4, 140, 63] }
    opciones:
      - texto: "La salida real, medida"
        bien: true
        porque: "Un panel que muestre la consigna en lugar de la medida no sirve para nada."
      - texto: "El valor ajustado, que es más estable"
        porque: "Es justo el error que se olvida: hay que medir la salida real."
      - texto: "Lo que pida el usuario, redondeado"
        porque: "Debe medir lo que hay, con la exactitud de su referencia."
    escalera:
      - "¿Para qué sirve un panel que repite lo que se ajustó?"
    solucion: "La salida real; su exactitud es la de la referencia."

  - id: modo-serie
    tipo: pregunta
    titulo: "Dos canales en serie"
    texto: "Una salida doble se pone en serie para más tensión. ¿Dónde está la dificultad?"
    libro: [421]
    widget:
      tipo: figura
      figura: fig-50.18
      zonas:
        - { id: doble, rotulo: "Recuadro violeta", rect: [5, 74, 140, 63] }
    opciones:
      - texto: "Las masas dejan de ser comunes: sensado y medida deben tenerlo en cuenta"
        bien: true
        porque: "Un canal queda encima del otro."
      - texto: "En la corriente, que se suma"
        porque: "En serie se suma la tensión; la dificultad son las masas."
      - texto: "En el transformador, que debe ser doble"
        porque: "El problema que señala el libro está en las masas del modo serie."
    escalera:
      - "En serie, ¿dónde queda la masa del canal de arriba?"
    solucion: "Las masas dejan de ser comunes."

  - id: empareje-protecciones
    tipo: pregunta
    titulo: "Protecciones adicionales"
    texto: "Empareje cada protección con lo que hace."
    libro: [423, 424, 425]
    widget:
      tipo: figura
      figura: fig-50.18
      zonas:
        - { id: protecciones, rotulo: "Recuadro rojo", rect: [157, 74, 139, 63] }
    emparejar:
      - ["OVP", "Corta si la salida supera un límite programado"]
      - ["Térmica", "Reduce progresivamente"]
      - ["Registro de eventos", "Dice qué pasó cuando algo se protegió"]
    exito: "La OVP protege el circuito bajo prueba de un fallo de la propia fuente."
    pistas:
      - { texto: "La que mira la tensión de salida es la de sobretensión." }
    escalera:
      - "Una vigila la tensión, otra el calor, otra la historia."
    solucion: "OVP, corta; térmica, reduce; registro, cuenta lo que pasó."

  - id: rentable
    tipo: pregunta
    titulo: "La más rentable en calor"
    texto: "¿Qué ampliación es la más rentable en calor, y la que más trabajo da?"
    libro: [418]
    widget:
      tipo: figura
      figura: fig-50.18
      zonas:
        - { id: pre, rotulo: "Recuadro naranja de arriba", rect: [308, 4, 139, 63] }
    opciones:
      - texto: "El prerregulador conmutado"
        bien: true
        porque: "Baja la caída sobre el lineal; su lazo debe ser más lento que el del lineal o ambos oscilan."
      - texto: "La medida digital"
        porque: "Mejora la información, no el calor."
      - texto: "La protección térmica"
        porque: "Protege del calor, pero no lo reduce en funcionamiento normal."
    escalera:
      - "¿Cuál reduce la tensión que sobra sobre el paso?"
    solucion: "El prerregulador conmutado."

  - id: comparar
    tipo: porque
    titulo: "Frente a una comercial"
    texto: "Se mide la fuente construida y se compara con una comercial. ¿Dónde suele perder la casera?"
    libro: [429, 432]
    widget:
      tipo: figura
      figura: fig-50.18
      zonas:
        - { id: cierre, rotulo: "El texto de abajo", rect: [60, 145, 340, 60] }
    opciones:
      - texto: "En protecciones, ergonomía y cortocircuito repetido"
        bien: true
        porque: "En regulación y rizado compite; entender por qué pierde en lo demás es lo que enseña el proyecto."
      - texto: "En regulación y rizado"
        porque: "Ahí una casera bien hecha compite."
      - texto: "En todo"
        porque: "No: en regulación y rizado compite."
    escalera:
      - "Una fuente es un instrumento: exactitud, estabilidad y lo imprevisto."
    solucion: "En protecciones, ergonomía y cortocircuito repetido."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [407, 411, 415, 428, 429]
    ideas:
      - { titulo: "Cinco ampliaciones.", texto: "Medida y control digital, prerregulador, salida doble y protecciones." }
      - { titulo: "Medir lo real.", texto: "La salida, no la consigna; con un DAC monótono." }
      - { titulo: "Lo aprendido.", texto: "Rectificación, lazo, térmica y SOA, doble lazo, seguridad y medida." }
      - { titulo: "Un instrumento.", texto: "Exactitud, estabilidad y comportamiento ante lo imprevisto." }
