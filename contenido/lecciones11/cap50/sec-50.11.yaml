# Lección 1.2 de la sección 51.11 «Montaje, Puesta a Punto y Medidas» (cap50; etiquetas sec-50.N = impresas 51.N).
# - El montaje por bloques, los ajustes y las pruebas de esfuerzo de la figura 51.17 (fig-50.16), con zonas.
# - El paso 3 del montaje (bloque 349: «cerrar el lazo de tensión y comprobar la regulación») como avería en el
#   esquema «regulador-lineal» vivo: 39,5 V de entrada (bloque 279), referencia de 2,5 V y divisor de 110 kΩ y
#   10 kΩ (bloque 455: 30 V) y una carga de 10 Ω.
# Paso práctico: «averia» del lazo recién cerrado: R₁ del divisor abierta (el lazo no ve la salida y la lleva al
# máximo, la entrada entera), R₂ abierta (la salida se queda en la referencia, 2,5 V) o la referencia muerta (0 V).
# Las tensiones de cada avería las da el modelo y las comprueba ngspice; no las da el libro. La avería sale al azar
# (`eleccion: azar`, motor12e): la sonda «Salida» ya separa las tres.
leccion: cap50/sec-50.11

libro:
  345: "La puesta a punto de la fuente tiene un orden que evita destruir el elemento de paso"
  347: "La etapa de red, con la lámpara serie"
  348: "El elemento de paso con el lazo abierto"
  349: "Cerrar el lazo de tensión y comprobar la regulación"
  350: "El lazo de corriente, con la salida cortocircuitada a través de un amperímetro."
  351: "La medida y la indicación."
  352: "La caja y el montaje final, con las precauciones de aislamiento."
  354: "Cero de la medida de corriente, sin carga."
  355: "Escala de tensión, con una referencia conocida."
  356: "Escala de corriente, con una carga conocida."
  357: "Límite máximo de tensión y de corriente"
  358: "Calibrar con el mismo multímetro que se va a usar después no aporta exactitud, solo coherencia."
  361: "Cortocircuito prolongado con la tensión al máximo y la corriente al máximo"
  362: "comprobando que no hay oscilación en la transición entre modos"
  363: "Carga capacitiva, que es lo que más veces hace oscilar una fuente"
  364: "Arranque y parada repetidos, comprobando que no hay sobreimpulso en la salida."
  365: "una fuente que sobrepasa al encender puede destruir el circuito que alimenta"
  367: "valores de calibración con su fecha"
  370: "es mejor descubrirlo con unos LED que con un microcontrolador"
  371: "El montaje por bloques de la fuente y las pruebas de esfuerzo."
  "cap50#279": "39,5 V"
  "cap50#455": '"110 kΩ"'

modelo:
  valores:
    V_in: { sim: "V_{in}", nombre: "continua tras el filtro", unidad: V, valor: 39.5 }
    V_ref: { sim: "V_{ref}", nombre: "referencia", unidad: V, valor: 2.5 }
    R_1: { sim: "R₁", nombre: "divisor, arriba", unidad: Ω, valor: 110000 }
    R_2: { sim: "R₂", nombre: "divisor, abajo", unidad: Ω, valor: 10000 }
    R_L: { sim: "R_{L}", nombre: "carga", unidad: Ω, valor: 10 }
  calculos:
    V_set: { expr: "V_ref*(1 + R_1/R_2)", sim: "V_{nom}", nombre: "salida nominal", unidad: V }
    V_o: { expr: "min(V_set, V_in)", sim: "V_{out}", nombre: "tensión de salida", unidad: V }
    I_L: { expr: "V_o/R_L", sim: "I_{L}", nombre: "corriente de carga", unidad: A }
    I_o: { expr: "I_L + V_o/(R_1 + R_2)", sim: "I", nombre: "corriente de salida", unidad: A }

tarjetas:
  - id: explore-montaje
    tipo: explorar
    titulo: "Un orden que salva el paso"
    texto: "La puesta a punto tiene un orden que evita destruir el elemento de paso. Toque el montaje, los ajustes y las pruebas."
    libro: [345, 371]
    widget:
      tipo: figura
      figura: fig-50.16
      zonas:
        - { id: montaje, rotulo: "La lista numerada", rect: [3, 25, 210, 150], texto: "Seis bloques, de la red con lámpara serie a la caja final." }
        - { id: ajustes, rotulo: "Recuadro naranja", rect: [5, 193, 207, 62], texto: "Los ajustes, en orden, contra un instrumento mejor." }
        - { id: pruebas, rotulo: "Los cuatro recuadros de la derecha", rect: [228, 25, 222, 195], texto: "Las pruebas de esfuerzo: las que separan un montaje que funciona de uno fiable." }
    requiere: { mover: [montaje, pruebas] }

  - id: ordene-montaje
    tipo: pregunta
    titulo: "El montaje por bloques"
    texto: "Ordene el montaje de la fuente."
    libro: [347, 348, 349, 350, 351, 352]
    widget:
      tipo: figura
      figura: fig-50.16
      zonas:
        - { id: pruebas, rotulo: "Los cuatro recuadros de la derecha", rect: [228, 25, 222, 195] }
    ordenar:
      - "La etapa de red, con lámpara serie y sin carga"
      - "El paso con el lazo abierto y un mando fijo"
      - "Cerrar el lazo de tensión"
      - "El lazo de corriente, con la salida en corto"
      - "La medida y la indicación"
      - "La caja y el montaje final"
    exito: "Cada bloque se prueba antes de añadir el siguiente."
    pistas:
      - { texto: "El lazo de corriente se prueba cuando el de tensión ya regula." }
    escalera:
      - "Se empieza por la red y se termina por la caja."
    solucion: "Red, paso en lazo abierto, lazo de tensión, lazo de corriente, medida, caja."

  - id: averia-lazo
    tipo: averia
    titulo: "El lazo recién cerrado"
    texto: "Se cierra el lazo de tensión para dar 30 V sobre 10 Ω, y la salida no es la esperada. Mida y encuentre la pieza."
    libro: [349, "cap50#279", "cap50#455"]
    widget:
      tipo: circuito
      esquema: regulador-lineal
      piezas: { entrada: V_in, ref: V_ref, r1: R_1, r2: R_2, carga: R_L }
      mide: { vout: V_o, iout: I_o }
      mandos: []
    averia:
      pasos: 2
      eleccion: azar
      preguntar_tipo: false
      sospechosos:
        - { id: r1, rotulo: "R₁, arriba del divisor" }
        - { id: r2, rotulo: "R₂, abajo del divisor" }
        - { id: ref, rotulo: "La referencia" }
      sondas:
        - { id: salida, rotulo: "Salida", valor: V_o }
        - { id: corriente, rotulo: "Corriente de salida", valor: I_o }
      fallos:
        - { id: r1-abierta, pieza: r1, tipo: abierta, con: { R_1: 1e9 }, texto: "R₁ abierta: la toma no ve la salida y el lazo la lleva al máximo, toda la entrada. Un peligro para lo que se alimente." }
        - { id: r2-abierta, pieza: r2, tipo: abierta, con: { R_2: 1e9 }, texto: "R₂ abierta: la toma ve la salida entera y el lazo la deja en la referencia." }
        - { id: ref-muerta, pieza: ref, tipo: valor, con: { V_ref: 0 }, texto: "La referencia no da tensión: sin patrón, el lazo lleva la salida a cero." }
    exito: "Por eso se cierra el lazo con una carga fija y midiendo: un divisor abierto pone toda la entrada en la salida."
    escalera:
      - "Sana daría 30 V. ¿Hacia dónde va la salida con cada pieza rota?"
    solucion: "Salida en la entrada entera: R₁ abierta; en 2,5 V: R₂ abierta; en 0 V: la referencia."
    comprobar:
      - { V_o: 30, V_set: 30 }
      - { con: { R_1: 1e9 }, V_o: 39.5 }
      - { con: { R_2: 1e9 }, V_o: 2.5, tol: 0.001 }

  - id: ordene-ajustes
    tipo: pregunta
    titulo: "Los ajustes, en orden"
    texto: "Ordene los ajustes de la fuente."
    libro: [354, 355, 356, 357]
    widget:
      tipo: figura
      figura: fig-50.16
      zonas:
        - { id: ajustes, rotulo: "Recuadro naranja", rect: [5, 193, 207, 62] }
    ordenar:
      - "Cero de la medida de corriente, sin carga"
      - "Escala de tensión, con una referencia conocida"
      - "Escala de corriente, con una carga conocida"
      - "Límites máximos de tensión y de corriente"
    exito: "Los límites protegen contra un giro accidental del mando."
    pistas:
      - { texto: "El cero va antes que cualquier escala." }
    escalera:
      - "Primero el cero, luego las escalas, al final los límites."
    solucion: "Cero de corriente, escala de tensión, escala de corriente, límites."

  - id: por-que-mejor
    tipo: porque
    titulo: "Contra un instrumento mejor"
    texto: "¿Por qué no se calibra la fuente con el mismo multímetro que se usará después con ella?"
    libro: [358]
    widget:
      tipo: figura
      figura: fig-50.16
      zonas:
        - { id: ajustes, rotulo: "Recuadro naranja", rect: [5, 193, 207, 62] }
    opciones:
      - texto: "Solo daría coherencia, no exactitud"
        bien: true
        porque: "La fuente heredaría el error del multímetro: hace falta uno mejor que el que se calibra."
      - texto: "Porque se descalibraría el multímetro"
        porque: "El multímetro no cambia; el problema es que no aporta exactitud."
      - texto: "Por comodidad"
        porque: "Es una cuestión de exactitud: el patrón debe ser mejor."
    escalera:
      - "Si los dos fallan igual, ¿lo notaría al compararlos?"
    solucion: "Solo da coherencia; la exactitud pide un instrumento mejor."

  - id: empareje-esfuerzo
    tipo: pregunta
    titulo: "Las pruebas de esfuerzo"
    texto: "Empareje cada prueba de esfuerzo con lo que vigila."
    libro: [361, 362, 363, 364]
    widget:
      tipo: figura
      figura: fig-50.16
      zonas:
        - { id: pruebas, rotulo: "Los cuatro recuadros de la derecha", rect: [228, 25, 222, 195] }
    emparejar:
      - ["Cortocircuito prolongado", "Las temperaturas, con todo al máximo"]
      - ["Escalón de carga repetido", "La oscilación en la transición de modos"]
      - ["Carga capacitiva", "Lo que más veces hace oscilar una fuente"]
      - ["Arranque y parada repetidos", "El sobreimpulso en la salida"]
    exito: "La última importa más de lo que parece: un sobreimpulso al encender puede destruir lo que se alimenta."
    pistas:
      - { texto: "La de encender y apagar mira lo que pasa en la salida en ese momento." }
    escalera:
      - "Una mide calor, otra el cruce de modos, otra la estabilidad, otra el encendido."
    solucion: "Corto, temperaturas; escalón, cruce de modos; capacitiva, oscilación; arranque, sobreimpulso."

  - id: prueba-led
    tipo: pregunta
    titulo: "La prueba final"
    texto: "Antes de usar la fuente con algo valioso, se le hace de todo a un circuito de unos LED. ¿Por qué con LED?"
    libro: [370]
    widget:
      tipo: figura
      figura: fig-50.16
      zonas:
        - { id: pruebas, rotulo: "Los cuatro recuadros de la derecha", rect: [228, 25, 222, 195] }
    opciones:
      - texto: "Si algo falla, es mejor descubrirlo con algo barato"
        bien: true
        porque: "Mejor con unos LED que con un microcontrolador."
      - texto: "Porque los LED miden la tensión"
        porque: "No miden: son un circuito barato que se puede perder."
      - texto: "Porque es lo que alimentará siempre"
        porque: "Es una prueba: lo valioso vendrá después."
    escalera:
      - "¿Qué se prefiere perder si la fuente falla?"
    solucion: "Para descubrir los fallos con un circuito barato."

  - id: documentar
    tipo: pregunta
    titulo: "La documentación"
    texto: "Al terminar se documenta la fuente. ¿Qué no puede faltar junto a los valores de calibración?"
    libro: [367]
    widget:
      tipo: figura
      figura: fig-50.16
      zonas:
        - { id: ajustes, rotulo: "Recuadro naranja", rect: [5, 193, 207, 62] }
    opciones:
      - texto: "Su fecha"
        bien: true
        porque: "Con el esquema modificado, las medidas de validación y las peculiaridades encontradas."
      - texto: "El precio de los componentes"
        porque: "Lo que se documenta es el esquema, la calibración con su fecha y las medidas."
      - texto: "Nada: el esquema basta"
        porque: "El esquema con sus cambios, sí, y además la calibración, las medidas y las peculiaridades."
    escalera:
      - "Una calibración sin cuándo, ¿cuánto vale dentro de un año?"
    solucion: "La fecha de los valores de calibración."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [345, 358, 365, 370]
    ideas:
      - { titulo: "Por bloques.", texto: "Red, paso en lazo abierto, lazos, medida y caja, probando cada uno." }
      - { titulo: "Calibrar.", texto: "Cero, escalas y límites, contra un instrumento mejor." }
      - { titulo: "Esfuerzo.", texto: "Corto prolongado, escalones, carga capacitiva y arranques." }
      - { titulo: "Prueba final.", texto: "Unos LED antes que algo valioso." }
