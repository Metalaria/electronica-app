# Lección 1.2 de la sección 51.16 «Fabricación de la Placa: Plano, Gerber y Taladros» (cap50; sec-50.N = 51.N).
# - La placa del proyecto KiCad de la figura 51.26 (fig-new-50-placa), con zonas en Q1, el condensador, el shunt y
#   los bornes; las tablas de especificación (bloque 523), taladros (526) y ficheros (531).
# - El ejercicio 51.2 (C = I·Δt/ΔV = 1 A × 10 ms / 1 V = 10 000 µF) como «estimar», y el 51.1 (la barrera).
# Paso práctico: «tocar» la pieza que va en el borde para que su disipador quede fuera de la placa.
leccion: cap50/sec-50.16

libro:
  518: "Es una decisión de seguridad y de fabricación, no de comodidad"
  519: "Una placa sin tensiones peligrosas puede fabricarse, manipularse y depurar sin las precauciones de una placa de red."
  520: "ya rectificada y prerregulada"
  523: "35 µm (1 oz) en ambas caras"
  524: "1,82 mm bastarían para 5 A con 20 °C de calentamiento; los 3 mm dan margen"
  526: "Fijación M3, conectados al plano de masa"
  529: "Q1 en el borde superior, para que su disipador quede fuera de la placa"
  531: "Taladros, formato Excellon métrico"
  533: "Q1 y su excitador junto al borde superior, para el disipador exterior"
  534: "la placa no se ha fabricado ni probado en el banco"
  536: "C = I · Δt / ΔV = 1 A × 0,01 s / 1 V = 0,01 F = 10000 µF"

modelo:
  valores:
    I_c: { sim: "I", nombre: "corriente", unidad: A, valor: 1 }
    dt: { sim: "Δt", nombre: "tiempo entre picos", unidad: s, valor: 0.01 }
    dV: { sim: "ΔV", nombre: "rizado", unidad: V, valor: 1 }
  calculos:
    C_f: { expr: "I_c*dt/dV", sim: "C", nombre: "condensador de filtro", unidad: F }

tarjetas:
  - id: explore-placa
    tipo: explorar
    titulo: "La placa del núcleo"
    texto: "Cien por ochenta milímetros a dos caras. Toque sus piezas principales."
    libro: [520, 533]
    widget:
      tipo: figura
      figura: fig-new-50-placa
      zonas:
        - { id: q1, rotulo: "Arriba, junto al borde", rect: [112, 4, 40, 28], texto: "Q1 y su excitador, en el borde superior, para el disipador exterior." }
        - { id: c1, rotulo: "Círculo grande de arriba", rect: [158, 32, 50, 50], texto: "El condensador de salida, en el camino de potencia." }
        - { id: j2, rotulo: "Conector de la derecha", rect: [262, 75, 35, 75], texto: "J2: la salida y el par de sensado, contiguos para trenzarlos." }
        - { id: j3, rotulo: "Conector de abajo", rect: [75, 190, 70, 30], texto: "J3: los conectores de mando, en la mitad del control." }
    requiere: { mover: [q1, j2] }

  - id: solo-nucleo
    tipo: porque
    titulo: "Sin la red"
    texto: "La red, el transformador y el filtro no van en esta placa. ¿Por qué?"
    libro: [518, 519]
    widget:
      tipo: figura
      figura: fig-new-50-placa
      zonas:
        - { id: placa, rotulo: "La placa", rect: [0, 0, 317, 235] }
    opciones:
      - texto: "Por seguridad y fabricación: sin tensiones peligrosas se fabrica y depura sin precauciones de red"
        bien: true
        porque: "Además, las distancias de aislamiento malgastarían superficie, y lo voluminoso va mejor en el chasis."
      - texto: "Por comodidad al soldar"
        porque: "No es comodidad: es una decisión de seguridad y de fabricación."
      - texto: "Porque no caben en dos capas"
        porque: "El motivo es separar la tensión peligrosa, no el número de capas."
    escalera:
      - "¿Qué precauciones exige una placa con tensión de red?"
    solucion: "Por seguridad y fabricación, no por comodidad."

  - id: empareje-spec
    tipo: pregunta
    titulo: "Lo que se dice al fabricante"
    texto: "Empareje cada parámetro de fabricación con su valor."
    libro: [523]
    widget:
      tipo: figura
      figura: fig-new-50-placa
      zonas:
        - { id: placa, rotulo: "La placa", rect: [0, 0, 317, 235] }
    emparejar:
      - ["Dimensiones", "100 × 80 mm"]
      - ["Capas", "2, cobre en ambas caras"]
      - ["Cobre", "35 µm (1 oz)"]
      - ["Taladro mínimo", "0,8 mm"]
    exito: "Los mínimos de 0,25 mm y 0,8 mm son los que cualquier fabricante acepta sin recargo."
    pistas:
      - { texto: "El cobre se da en micras y en onzas." }
    escalera:
      - "Uno es un tamaño, otro un número, otro un espesor, otro un diámetro."
    solucion: "100 × 80 mm; 2 capas; 35 µm; 0,8 mm."

  - id: pista-3mm
    tipo: pregunta
    titulo: "La pista de potencia"
    texto: "Según el cálculo IPC, 1,82 mm bastarían para 5 A con 20 °C de calentamiento. ¿Por qué se trazan 3 mm?"
    libro: [524]
    widget:
      tipo: figura
      figura: fig-new-50-placa
      zonas:
        - { id: placa, rotulo: "La placa", rect: [0, 0, 317, 235] }
    opciones:
      - texto: "Para dar margen"
        bien: true
        porque: "Con 35 µm de cobre, los 3 mm dan margen sobre el cálculo."
      - texto: "Porque la mínima del fabricante es 3 mm"
        porque: "La mínima es 0,25 mm: los 3 mm son margen de corriente."
      - texto: "Para que se vea mejor en la serigrafía"
        porque: "Es una cuestión de corriente y calentamiento."
    escalera:
      - "¿Qué pasa con el calentamiento si se ensancha la pista?"
    solucion: "Para dar margen sobre los 1,82 mm calculados."

  - id: empareje-taladros
    tipo: pregunta
    titulo: "La tabla de taladros"
    texto: "Empareje cada diámetro con su uso."
    libro: [526]
    widget:
      tipo: figura
      figura: fig-new-50-placa
      zonas:
        - { id: placa, rotulo: "La placa", rect: [0, 0, 317, 235] }
    emparejar:
      - ["0,8 mm", "Señal: DIP, diodos, resistencias y J3"]
      - ["1,2 mm", "Bornes J1 y J2"]
      - ["1,4 mm", "Q1 y el shunt"]
      - ["3,2 mm", "Fijación M3, al plano de masa"]
    exito: "Los cuatro de fijación van a masa: aterrizan el chasis en cuatro puntos."
    pistas:
      - { texto: "El mayor es para tornillos." }
    escalera:
      - "Cuanto más gruesa la patilla o el tornillo, mayor el taladro."
    solucion: "0,8 señal; 1,2 bornes; 1,4 Q1 y shunt; 3,2 fijación."

  - id: toque-q1
    tipo: tocar
    titulo: "El calor, fuera"
    texto: "Toque la pieza que va en el borde superior para que su disipador quede fuera de la placa."
    libro: [529, 533]
    widget:
      tipo: figura
      figura: fig-new-50-placa
      zonas:
        - { id: q1, rotulo: "Arriba, junto al borde", rect: [112, 4, 40, 28] }
        - { id: c1, rotulo: "Círculo grande de arriba", rect: [158, 32, 50, 50] }
        - { id: j2, rotulo: "Conector de la derecha", rect: [262, 75, 35, 75] }
        - { id: j3, rotulo: "Conector de abajo", rect: [75, 190, 70, 30] }
    tocar:
      bien: [q1]
      porque:
        c1: "Es el condensador de salida: no lleva disipador."
        j2: "Son los bornes de salida y sensado."
        j3: "Son los conectores de mando."
    exito: "Q1: así el calor no calienta el resto de la placa."
    escalera:
      - "¿Qué pieza disipa y lleva disipador?"
    solucion: "Q1, el transistor de paso."

  - id: empareje-ficheros
    tipo: pregunta
    titulo: "El paquete de fabricación"
    texto: "Empareje cada fichero con lo que contiene."
    libro: [531]
    widget:
      tipo: figura
      figura: fig-new-50-placa
      zonas:
        - { id: placa, rotulo: "La placa", rect: [0, 0, 317, 235] }
    emparejar:
      - ["…Edge_Cuts.gm1", "Contorno de la placa"]
      - ["…F_Cu.gtl", "Cobre de la cara superior"]
      - ["…B_Cu.gbl", "Cobre inferior, el plano de masa"]
      - ["….drl", "Taladros, formato Excellon"]
    exito: "Con la máscara, la serigrafía, el trabajo, la lista de conexiones y la de materiales."
    pistas:
      - { texto: "F es la cara de delante; B, la de detrás." }
    escalera:
      - "Edge es el borde; Cu, cobre; drl, drill."
    solucion: "Edge_Cuts, contorno; F_Cu, cobre de arriba; B_Cu, cobre de abajo; drl, taladros."

  - id: antes-encargar
    tipo: pregunta
    titulo: "Antes de encargarla"
    texto: "La placa la ha enrutado un enrutador automático y no se ha fabricado ni probado. ¿Qué conviene antes de encargarla?"
    libro: [534]
    widget:
      tipo: figura
      figura: fig-new-50-placa
      zonas:
        - { id: placa, rotulo: "La placa", rect: [0, 0, 317, 235] }
    opciones:
      - texto: "Revisar a ojo la potencia y el sensado, y montar primero una unidad"
        bien: true
        porque: "Y comprobar con la placa en la mano el encaje del disipador y de la caja."
      - texto: "Encargar muchas para abaratar"
        porque: "Sin probarla, conviene montar primero una unidad."
      - texto: "Nada: pasa la verificación de reglas"
        porque: "Pasar las reglas no es haberla probado en el banco."
    escalera:
      - "¿Se ha probado en el banco?"
    solucion: "Revisar el camino de potencia y el par de sensado, y montar primero una."

  - id: estime-c
    tipo: pregunta
    titulo: "Un condensador de filtro"
    texto: "Rizado de 1 V con 1 A, onda completa a 50 Hz: unos 10 ms entre picos. ¿Qué condensador de filtro?"
    libro: [536]
    widget:
      tipo: grafica
      x: { id: dx, min: 0.5, max: 3, unidad: V, rotulo: "ΔV" }
      y: { min: 0, max: 0.025, unidad: F, rotulo: "C" }
      curvas:
        - { expr: "I_c*dt/dx", color: naranja, rotulo: "C = I·Δt/ΔV" }
    estimar:
      objetivo: "C_f"
      unidad: F
      min: 0
      max: 0.025
      paso: 0.0005
      inicio: 0.02
      tol: 0.05
      rotulo: "Condensador"
    exito: "10 000 µF, o algo mayor para tener margen."
    pistas:
      - { cuando: { valor: estimacion, mayor: 0.0105 }, texto: "Se ha pasado: 1 A × 0,01 s / 1 V." }
      - { texto: "Se ha quedado corto: 1 A × 0,01 s / 1 V." }
    escalera:
      - "C = I · Δt / ΔV."
    solucion: "1 A × 0,01 s / 1 V = 0,01 F = 10 000 µF."
    comprobar:
      - { C_f: 0.01 }

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [518, 523, 529, 534]
    ideas:
      - { titulo: "Solo el núcleo.", texto: "Sin tensiones de red: más segura de fabricar y depurar." }
      - { titulo: "Especificación.", texto: "100 × 80 mm, dos capas, 35 µm y mínimos sin recargo." }
      - { titulo: "Distribución.", texto: "Q1 al borde, plano de masa, shunt Kelvin y sensado contiguo." }
      - { titulo: "Antes de encargar.", texto: "Revisar y montar primero una unidad." }
