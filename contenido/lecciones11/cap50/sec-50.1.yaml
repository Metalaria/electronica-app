# Lección 1.2 de la sección 51.1 «Objetivo y Especificaciones» (cap50; etiquetas sec-50.N = impresas 51.N).
# - El peor caso de disipación de la figura 51.1 (fig-50.1) en el esquema «regulador-lineal» vivo: entrada de 39,5 V
#   (la continua nominal a plena carga de la sección 51.9, bloque 279), salida ajustable sin divisor (la referencia
#   hace de consigna) y una carga que pide siempre 3 A (R_L = V_out/3). A 5 V son 103,5 W: «más de 100 W con la
#   salida baja y la corriente máxima» (bloque 13). Las salidas de 15 y 30 V del mando son de ejemplo.
# - Las cuatro cifras de la especificación y lo que implican (figura 51.1, zonas en cada recuadro).
# Sin paso práctico: la disipación se simula en 51.7 y 51.9.
leccion: cap50/sec-50.1

libro:
  5: "0 a 30 V y 0 a 3 A"
  9: "Rizado y ruido: menos de 5 mV eficaces."
  13: "más de 100 W con la salida baja y la corriente máxima"
  14: "Y esa cifra es la que decide la arquitectura"
  15: "descarta una fuente puramente conmutada y lleva al lineal o al híbrido"
  16: "exige sensado remoto o bornes de calidad"
  17: "obliga a comprobar el SOA del elemento de paso"
  20: "Lineal con transformador de tomas: buena calidad, complejidad moderada, aparato pesado."
  21: "Prerregulador conmutado más lineal: la mejor combinación de rendimiento y ruido, y la más compleja."
  22: "Conmutada con postfiltrado: la más pequeña, y difícil de bajar de 5 mV."
  23: "la lineal con tomas es la que más enseña y la más abordable"
  29: "Más la prueba de cortocircuito mantenido durante media hora"
  32: "Saberlo antes de comprar el transformador ahorra el proyecto entero."
  33: "Disipación en el peor caso de la fuente"
  "cap50#279": "39,5 V"

modelo:
  valores:
    V_in: { sim: "V_{in}", nombre: "continua tras el filtro", unidad: V, valor: 39.5 }
    V_s: { sim: "V_{out}", nombre: "salida ajustada", unidad: V, valor: 30 }
    I_s: { sim: "I", nombre: "corriente de la carga", unidad: A, valor: 3 }
  calculos:
    R_L: { expr: "V_s/I_s", sim: "R_{L}", nombre: "carga que pide 3 A", unidad: Ω }
    I_o: { expr: "V_s/R_L", sim: "I", nombre: "corriente de salida", unidad: A }
    P_q: { expr: "(V_in - V_s)*I_o", sim: "P", nombre: "potencia en el elemento de paso", unidad: W }
    P_o: { expr: "V_s*I_o", sim: "P_{out}", nombre: "potencia entregada", unidad: W }
    V_q: { expr: "V_in - V_s", sim: "V_{paso}", nombre: "tensión que sobra", unidad: V }

tarjetas:
  - id: explore-peor
    tipo: explorar
    titulo: "Lo que calienta"
    texto: "Una fuente lineal con 39,5 V tras el filtro entrega 3 A. Baje la salida ajustada y mire el elemento de paso."
    libro: [5, 33, "cap50#279"]
    inicio: { V_s: 30 }
    widget:
      tipo: circuito
      esquema: regulador-lineal
      piezas: { entrada: V_in, ref: V_s, carga: R_L }
      lectura: { valor: P_q, rotulo: "Calor en el elemento de paso" }
      datos:
        - { valor: P_o, rotulo: "Entrega: {{P_o}}" }
      corriente: I_o
      mide: { vout: V_s, iin: I_o, p_paso: P_q }
      mandos:
        - { valor: V_s, lista: [5, 15, 30], rotulo: "Salida ajustada" }
    requiere: { mover: [V_s] }
    comprobar:
      - { con: { V_s: 5 }, P_q: 103.5, P_o: 15 }
      - { con: { V_s: 30 }, P_q: 28.5, P_o: 90 }

  - id: prediga-peor
    tipo: predecir
    titulo: "El peor caso"
    texto: "Con 3 A, ¿a qué salida disipa más el elemento de paso: 5 V o 30 V?"
    libro: [13]
    fijar: { V_s: 5 }
    widget:
      tipo: circuito
      esquema: regulador-lineal
      piezas: { entrada: V_in, ref: V_s, carga: R_L }
      lectura: { valor: P_q, rotulo: "Calor en el elemento de paso" }
      corriente: I_o
      mide: { vout: V_s, p_paso: P_q }
      ocultar: true
      mandos: []
    opciones:
      - texto: "A 5 V: más de 100 W"
        bien: true
        porque: "El paso se queda la tensión que sobra, (39,5 − 5) V, por los 3 A: {{P_q}}."
      - texto: "A 30 V, porque entrega más potencia"
        porque: "Entrega más, pero le sobran solo 9,5 V: unos 28,5 W en el paso."
      - texto: "Igual: la corriente es la misma"
        porque: "La corriente sí, pero la tensión que sobra cambia mucho."
    escalera:
      - "El paso disipa la tensión que sobra por la corriente."
    solucion: "A 5 V: (39,5 − 5) × 3 = 103,5 W."
    comprobar:
      - { P_q: 103.5 }
      - { con: { V_s: 30 }, P_q: 28.5, V_q: 9.5 }

  - id: empareje-cifras
    tipo: pregunta
    titulo: "Lo que cada cifra implica"
    texto: "Empareje cada cifra de la especificación con lo que obliga a hacer."
    libro: [9, 13, 15, 16, 17]
    widget:
      tipo: figura
      figura: fig-50.1
      zonas:
        - { id: cifras, rotulo: "Los recuadros de la derecha", rect: [271, 20, 180, 158] }
    emparejar:
      - ["0–30 V y 0–3 A", "Fijan el transformador y el peor caso térmico"]
      - ["Rizado < 5 mV", "Descarta una conmutada pura"]
      - ["Regulación del 0,1 % en la carga", "Sensado remoto o bornes de calidad"]
      - ["Cortocircuito indefinido", "Comprobar el SOA y quizá limitación replegada"]
    exito: "Cada cifra elige algo del diseño: por eso la especificación se escribe antes de nada."
    pistas:
      - { texto: "El rizado tan bajo es lo que deja fuera a una fuente conmutada sola." }
    escalera:
      - "Una cifra fija el tamaño; otra, el ruido; otra, dónde se mide; otra, cuánto se aguanta."
    solucion: "Tensión y corriente, transformador y calor; rizado, sin conmutada pura; regulación, sensado; corto, SOA."

  - id: toque-arquitectura
    tipo: tocar
    titulo: "La cifra que decide"
    texto: "Toque la cifra de la especificación que más decide la arquitectura, porque con disipación pasiva el aparato sería enorme."
    libro: [13, 14]
    widget:
      tipo: figura
      figura: fig-50.1
      zonas:
        - { id: tension, rotulo: "Primer recuadro de la derecha", rect: [271, 20, 180, 36] }
        - { id: rizado, rotulo: "Segundo recuadro de la derecha", rect: [271, 61, 180, 35] }
        - { id: regulacion, rotulo: "Tercer recuadro de la derecha", rect: [271, 101, 180, 35] }
        - { id: corto, rotulo: "Cuarto recuadro de la derecha", rect: [271, 142, 180, 36] }
    tocar:
      bien: [tension]
      porque:
        rizado: "El rizado elige entre lineal y conmutada, pero el tamaño lo decide el calor."
        regulacion: "Pide sensado remoto, no cambia la arquitectura."
        corto: "Pide comprobar el SOA; el calor del peor caso viene de los 30 V y 3 A."
    exito: "Los 30 V y 3 A dan más de 100 W en el peor caso: tomas conmutadas, prerregulador o ventilación forzada."
    escalera:
      - "¿Qué cifra produce los más de 100 W?"
    solucion: "La de 0–30 V y 0–3 A: fija el peor caso térmico."

  - id: empareje-opciones
    tipo: pregunta
    titulo: "Tres arquitecturas"
    texto: "Empareje cada arquitectura con lo que la caracteriza."
    libro: [20, 21, 22]
    widget:
      tipo: figura
      figura: fig-50.1
      zonas:
        - { id: grafica, rotulo: "Gráfica de la izquierda", rect: [0, 0, 260, 208] }
    emparejar:
      - ["Lineal con transformador de tomas", "Buena calidad, complejidad moderada, aparato pesado"]
      - ["Prerregulador conmutado más lineal", "La mejor combinación, y la más compleja"]
      - ["Conmutada con postfiltrado", "La más pequeña, y difícil de bajar de 5 mV"]
    exito: "Para aprender, la lineal con tomas: la que más enseña y la más abordable."
    pistas:
      - { texto: "La que cuesta bajar de 5 mV es la que conmuta hasta la salida." }
    escalera:
      - "Una pesa, otra es compleja, otra es pequeña pero ruidosa."
    solucion: "Tomas, pesada; prerregulador, la mejor y más compleja; conmutada, pequeña y ruidosa."

  - id: aceptacion
    tipo: pregunta
    titulo: "El criterio de aceptación"
    texto: "Además de las medidas de regulación y rizado, ¿qué prueba debe superar la fuente para darla por buena?"
    libro: [29]
    widget:
      tipo: figura
      figura: fig-50.1
      zonas:
        - { id: corto, rotulo: "Cuarto recuadro de la derecha", rect: [271, 142, 180, 36] }
    opciones:
      - texto: "Media hora en cortocircuito sin que nada pase de su temperatura límite"
        bien: true
        porque: "Es la prueba del cortocircuito mantenido, que separa una fuente fiable de una que solo funciona."
      - texto: "Encender y apagar una vez sin humo"
        porque: "Hace falta mucho más: el cortocircuito mantenido durante media hora."
      - texto: "Dar 30 V en vacío"
        porque: "Eso es lo más fácil; la prueba dura es el corto mantenido."
    escalera:
      - "La especificación pide aguantar un cortocircuito indefinido."
    solucion: "El cortocircuito mantenido media hora, vigilando las temperaturas."

  - id: antes-comprar
    tipo: pregunta
    titulo: "Antes de comprar"
    texto: "¿Qué conviene comprobar antes de comprar el transformador?"
    libro: [32]
    widget:
      tipo: figura
      figura: fig-50.1
      zonas:
        - { id: grafica, rotulo: "Gráfica de la izquierda", rect: [0, 0, 260, 208] }
    opciones:
      - texto: "Si el disipador aguanta el peor caso, con la salida a 5 V y 3 A"
        bien: true
        porque: "Si la unión calculada pasa del límite, hay que cambiar la especificación o la arquitectura."
      - texto: "Si da 30 V a plena carga"
        porque: "Importa, pero lo que puede hundir el proyecto es el calor del peor caso."
      - texto: "El precio de la caja"
        porque: "Lo decisivo es si el calor del peor caso se puede evacuar."
    escalera:
      - "¿Dónde está el peor caso térmico?"
    solucion: "La disipación del peor caso frente al disipador disponible."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [5, 13, 15, 23]
    ideas:
      - { titulo: "Especificar primero.", texto: "0–30 V, 0–3 A, rizado < 5 mV, 0,1 % en la carga, corto indefinido." }
      - { titulo: "El peor caso.", texto: "Salida baja y corriente máxima: más de 100 W en el paso." }
      - { titulo: "Decide la arquitectura.", texto: "Tomas, prerregulador o ventilación forzada." }
      - { titulo: "Para aprender.", texto: "La lineal con tomas, la que más enseña." }
