# Lección 1.2 de la sección 51.10 «Lista de Materiales (BOM)» (cap50; etiquetas sec-50.N = impresas 51.N).
# - La tabla y el recuadro de seguridad de la figura 51.16 (fig-50.15), con dos zonas (las filas de la tabla son
#   demasiado finas para tocarlas en un teléfono).
# - Sin modelo numérico: cada cifra sale de la sección 51.9 y se cita.
# Sin paso práctico: la sección es una lista razonada.
leccion: cap50/sec-50.10

libro:
  310: "Cada elección responde a un cálculo de la sección 51.9"
  312: "30 V eficaces y al menos 160 VA, toroidal"
  313: "Es el componente más caro y el que fija el tamaño de la caja."
  314: "para 3 A medios, uno de al menos 8 A, por la corriente de pico repetitiva"
  315: "que es lo que decide su vida y no aparece en el precio"
  316: "Con el prerregulador basta uno en un disipador modesto"
  318: "es la que fija la exactitud de toda la fuente"
  319: "porque su valor entra directamente en la medida de corriente"
  325: "Los bornes de salida, de calidad, porque su resistencia entra en la regulación"
  330: "Por especificación: transformador, condensador de filtro, transistores de paso, referencia y shunts."
  331: "Por precio: pasivos de señal, conectores comunes, caja."
  332: "gastar en la referencia y en el condensador es lo que se nota"
  335: "Componentes de red certificados: interruptor, portafusibles, cable, prensaestopas."
  338: "Ahorrar aquí es donde no se debe ahorrar nunca."
  341: "lo que se compra no es la fuente, es entender cómo funciona"
  342: "Los componentes que deciden en la fuente y la seguridad como criterio."

modelo: { valores: {}, calculos: {} }

tarjetas:
  - id: explore-bom
    tipo: explorar
    titulo: "Una lista razonada"
    texto: "Cada elección responde a un cálculo de la sección 51.9. Toque la tabla y la seguridad."
    libro: [310, 342]
    widget:
      tipo: figura
      figura: fig-50.15
      zonas:
        - { id: tabla, rotulo: "La tabla de arriba", rect: [0, 15, 453, 115], texto: "Los componentes que deciden: qué comprar y por qué, con cifras de la sección 51.9." }
        - { id: seguridad, rotulo: "El recuadro rojo de abajo", rect: [3, 150, 448, 82], texto: "La seguridad como criterio: componentes de red certificados, aislamiento y toma de tierra al chasis." }
    requiere: { mover: [tabla, seguridad] }

  - id: empareje-por-que
    tipo: pregunta
    titulo: "Por qué cada uno"
    texto: "Empareje cada componente con la razón de su elección."
    libro: [312, 313, 314, 315, 319]
    widget:
      tipo: figura
      figura: fig-50.15
      zonas:
        - { id: tabla, rotulo: "La tabla de arriba", rect: [0, 15, 453, 115] }
    emparejar:
      - ["Transformador", "El más caro: fija el tamaño de la caja"]
      - ["Puente rectificador", "La corriente de pico repetitiva"]
      - ["Condensador de filtro", "La corriente de rizado eficaz decide su vida"]
      - ["Shunts de sensado", "Su valor entra directo en la medida"]
    exito: "Cada fila de la lista viene de un número calculado antes."
    pistas:
      - { texto: "Lo que decide la vida del condensador no aparece en el precio." }
    escalera:
      - "Uno es grande y caro; otro sufre picos; otro, rizado; otro mide."
    solucion: "Transformador, tamaño; puente, pico; condensador, rizado; shunt, medida."

  - id: puente-8a
    tipo: pregunta
    titulo: "8 A para 3 A"
    texto: "La fuente da 3 A medios. ¿Por qué el puente rectificador es de al menos 8 A?"
    libro: [314]
    widget:
      tipo: figura
      figura: fig-50.15
      zonas:
        - { id: tabla, rotulo: "La tabla de arriba", rect: [0, 15, 453, 115] }
    opciones:
      - texto: "Por la corriente de pico repetitiva de los pulsos de carga"
        bien: true
        porque: "Los diodos entregan la corriente en pulsos cortos mucho mayores que la media."
      - texto: "Por si se quiere ampliar la fuente"
        porque: "La razón es la de ahora: los pulsos de carga del condensador."
      - texto: "Porque los de 3 A no existen"
        porque: "Existen; no aguantarían los pulsos de pico."
    escalera:
      - "¿La corriente por los diodos es continua o a pulsos?"
    solucion: "Por la corriente de pico repetitiva."

  - id: transistores
    tipo: pregunta
    titulo: "Cuántos transistores de paso"
    texto: "La lista pide dos transistores de paso de al menos 200 W. ¿Y con el prerregulador?"
    libro: [316]
    widget:
      tipo: figura
      figura: fig-50.15
      zonas:
        - { id: tabla, rotulo: "La tabla de arriba", rect: [0, 15, 453, 115] }
    opciones:
      - texto: "Basta uno en un disipador modesto"
        bien: true
        porque: "Con prerregulador la caída sobre el paso es pequeña, y su calor también."
      - texto: "Hacen falta seis"
        porque: "Seis serían con un secundario único y sin prerregulador."
      - texto: "Los mismos dos"
        porque: "El prerregulador reduce tanto el calor que basta uno."
    escalera:
      - "¿Cuánto calor queda en el paso con prerregulador?"
    solucion: "Uno en un disipador modesto."

  - id: bornes
    tipo: pregunta
    titulo: "Lo que se olvida"
    texto: "En la lista de lo que se olvida aparecen unos bornes de salida de calidad. ¿Por qué importan?"
    libro: [325]
    widget:
      tipo: figura
      figura: fig-50.15
      zonas:
        - { id: tabla, rotulo: "La tabla de arriba", rect: [0, 15, 453, 115] }
    opciones:
      - texto: "Su resistencia entra en la regulación"
        bien: true
        porque: "Lo que cae en los bornes lo pierde la carga: empeora la regulación medida."
      - texto: "Por estética del panel"
        porque: "Es una cuestión eléctrica: su resistencia."
      - texto: "Porque los baratos no aguantan la tensión"
        porque: "El problema es la resistencia de contacto, que entra en la regulación."
    escalera:
      - "¿Por dónde pasa toda la corriente de salida antes de llegar a la carga?"
    solucion: "Su resistencia entra en la regulación de carga."

  - id: gastar
    tipo: pregunta
    titulo: "Dónde gastar"
    texto: "El presupuesto es limitado. ¿Dónde se nota gastar más?"
    libro: [318, 330, 331, 332]
    widget:
      tipo: figura
      figura: fig-50.15
      zonas:
        - { id: tabla, rotulo: "La tabla de arriba", rect: [0, 15, 453, 115] }
    opciones:
      - texto: "En la referencia y en el condensador de filtro"
        bien: true
        porque: "Se compran por especificación: la referencia fija la exactitud de toda la fuente."
      - texto: "En las resistencias de señal"
        porque: "Los pasivos de señal se compran por precio: gastar en ellos no se nota."
      - texto: "En la caja y los conectores comunes"
        porque: "Se compran por precio; lo que se nota es la referencia y el condensador."
    escalera:
      - "¿Qué se compra por especificación y qué por precio?"
    solucion: "En la referencia y el condensador; los pasivos de señal, por precio."

  - id: seguridad
    tipo: pregunta
    titulo: "Donde no se ahorra"
    texto: "¿En qué no se debe ahorrar nunca al comprar la fuente?"
    libro: [335, 338]
    widget:
      tipo: figura
      figura: fig-50.15
      zonas:
        - { id: seguridad, rotulo: "El recuadro rojo de abajo", rect: [3, 150, 448, 82] }
    opciones:
      - texto: "En los componentes de red certificados"
        bien: true
        porque: "Interruptor, portafusibles, cable y prensaestopas: la seguridad no es negociable."
      - texto: "En la pantalla"
        porque: "Es comodidad; lo innegociable es la seguridad de red."
      - texto: "En los condensadores de desacoplo"
        porque: "Hacen falta, pero lo que no se negocia es lo de red."
    escalera:
      - "¿Qué está conectado a la red?"
    solucion: "En los componentes de red certificados, el aislamiento y la tierra."

  - id: mas-cara
    tipo: porque
    titulo: "Más cara que la comercial"
    texto: "Sumado el coste, la fuente casera sale más cara que una comercial equivalente. ¿Por qué hacerla?"
    libro: [341]
    widget:
      tipo: figura
      figura: fig-50.15
      zonas:
        - { id: tabla, rotulo: "La tabla de arriba", rect: [0, 15, 453, 115] }
    opciones:
      - texto: "Lo que se compra es entender cómo funciona"
        bien: true
        porque: "Saberlo de antemano evita la decepción y hace la decisión consciente."
      - texto: "Porque al final sale más barata"
        porque: "A menudo sale más cara; el valor está en lo que se aprende."
      - texto: "Porque es mejor en todo"
        porque: "En protecciones y ergonomía suele perder frente a una comercial."
    escalera:
      - "¿Qué no viene en la caja de una fuente comercial?"
    solucion: "Por entender cómo funciona: eso es lo que se compra."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [310, 330, 332, 338]
    ideas:
      - { titulo: "Cada compra, un cálculo.", texto: "Transformador, puente, condensador, paso, disipador, referencia y shunts." }
      - { titulo: "Lo que se olvida.", texto: "Fusible, NTC, interruptor, cable, bornes, desacoplos y ventilación." }
      - { titulo: "Especificación o precio.", texto: "Gastar en la referencia y el condensador se nota." }
      - { titulo: "Seguridad.", texto: "Lo de red, certificado: ahí no se ahorra nunca." }
