# Lección 1.2 de la sección 51.9 «Cálculos de Diseño» (cap50; etiquetas sec-50.N = impresas 51.N).
# - El secundario de 30 V eficaces con puente del bloque 275 en el esquema «puente» vivo: pico 30 × 1,414 V por el
#   factor de red, diodos de 0,7 V, 10 000 µF (bloque 284) y una carga de 13,2 Ω (unos 3 A). La continua del modelo
#   es la del bloque 277: pico − 1,4 V − medio rizado (3 V de rizado con 3 A, bloque 283): 39,5 V nominal y 35,3 V
#   con la red al −10 %, como la tabla del bloque 279.
# - La disipación (bloques 288–292), el disipador (296–298), el shunt (300) y la coherencia (303).
# Pasos prácticos: «reto» del disipador con 12 W y 60 °C sobre ambiente (R_sa ≤ 3,5 °C/W); «simular» la potencia del
# transformador (unos 160 VA; error típico: los 90 W entregados, sin el 1,8 de los pulsos).
leccion: cap50/sec-50.9

libro:
  275: "Con un secundario de 30 V eficaces y un puente"
  276: '"42,4 V"'
  277: '"39,5 V"'
  279: "35,3 V"
  280: "los 45,3 V del pico con la red alta, más el 5 % que sube en vacío un transformador de este tamaño"
  281: "37,9/(0,9 × 1,414) ≈ 30 V eficaces"
  283: '"10 000 µF"'
  284: "10 000 µF / 63 V"
  285: "del orden de 1,5 veces la corriente de salida, es decir, unos 4,5 A"
  287: "con 3 A de carga la entrada se queda en unos 44 V"
  288: '"144 W"'
  289: '"129 W"'
  290: "65 W cada uno"
  292: '"12 W"'
  296: 'R_("total") = ("60")/("12")'
  297: "que es un disipador modesto"
  298: "Harían falta seis transistores en paralelo"
  300: "150 mV a fondo de escala, y una disipación de 0,45 W, que exige una resistencia de al menos 1 W"
  303: "debe dar unos 30 V × 3 A × 1,8 ≈ 160 VA"
  307: "Márgenes de tensión continua y disipación según la arquitectura elegida."

modelo:
  valores:
    V_sec: { sim: "V_{sec}", nombre: "secundario, eficaz", unidad: V, valor: 30 }
    red: { sim: "red", nombre: "tensión de red relativa", unidad: "", valor: 1 }
    f_r: { sim: "f", nombre: "frecuencia de la red", unidad: Hz, valor: 50 }
    V_d: { sim: "V_{D}", nombre: "caída de cada diodo", unidad: V, valor: 0.7 }
    C_f: { sim: "C", nombre: "condensador de filtro", unidad: F, valor: 0.01 }
    R_L: { sim: "R_{L}", nombre: "carga", unidad: Ω, valor: 13.2 }
    I_max: { sim: "I", nombre: "corriente máxima", unidad: A, valor: 3 }
    V_out: { sim: "V_{out}", nombre: "salida", unidad: V, valor: 5 }
    V_max: { sim: "V_{máx}", nombre: "salida máxima", unidad: V, valor: 30 }
    V_alta: { sim: "V_{in}", nombre: "entrada en el peor caso", unidad: V, valor: 48 }
    V_hr: { sim: "ΔV", nombre: "caída con prerregulador", unidad: V, valor: 4 }
    dT: { sim: "ΔT", nombre: "unión sobre ambiente admitida", unidad: "°C", valor: 60 }
    R_jc: { sim: "R_{jc}", nombre: "unión-cápsula", unidad: "°C/W", valor: 1 }
    R_cs: { sim: "R_{cs}", nombre: "cápsula-disipador", unidad: "°C/W", valor: 0.5 }
    R_sa: { sim: "R_{sa}", nombre: "disipador", unidad: "°C/W", valor: 8 }
    R_sh: { sim: "R_{shunt}", nombre: "shunt", unidad: Ω, valor: 0.05 }
    k_ef: { sim: "k", nombre: "eficaz del secundario sobre la continua", unidad: "", valor: 1.8 }
  calculos:
    V_p: { expr: "V_sec*1.414*red", sim: "V_{pico}", nombre: "pico del secundario", unidad: V }
    V_pk: { expr: "V_p - 2*V_d", sim: "V", nombre: "pico en el condensador", unidad: V }
    T_r: { expr: "1/f_r", sim: "T", nombre: "periodo de la red", unidad: s }
    tau: { expr: "R_L*C_f", sim: "τ", nombre: "constante de descarga", unidad: s }
    dV: { expr: "I_max/(2*f_r*C_f)", sim: "ΔV", nombre: "rizado", unidad: V }
    V_cc: { expr: "V_pk - dV/2", sim: "V_{cc}", nombre: "continua a plena carga", unidad: V }
    V_vac: { expr: "V_pk*1.05", sim: "V", nombre: "en vacío, con la subida del transformador", unidad: V }
    V_sreq: { expr: "(V_max + 3.5 + 3 + 2*V_d)/(0.9*1.414)", sim: "V_{sec}", nombre: "secundario necesario", unidad: V }
    P_5: { expr: "(V_alta - V_out)*I_max", sim: "P", nombre: "disipación con la salida a 5 V", unidad: W }
    P_0: { expr: "V_alta*I_max", sim: "P", nombre: "disipación en cortocircuito", unidad: W }
    P_o5: { expr: "V_out*I_max", sim: "P", nombre: "entregada a 5 V", unidad: W }
    P_pre: { expr: "V_hr*I_max", sim: "P", nombre: "disipación con prerregulador", unidad: W }
    R_tot: { expr: "dT/P_pre", sim: "R_{total}", nombre: "resistencia térmica admitida", unidad: "°C/W" }
    R_sa_max: { expr: "R_tot - R_jc - R_cs", sim: "R_{sa}", nombre: "disipador máximo", unidad: "°C/W" }
    dT_j: { expr: "P_pre*(R_jc + R_cs + R_sa)", sim: "ΔT", nombre: "unión sobre ambiente", unidad: "°C" }
    V_sh: { expr: "I_max*R_sh", sim: "V", nombre: "caída en el shunt", unidad: V }
    P_sh: { expr: "I_max^2*R_sh", sim: "P", nombre: "potencia en el shunt", unidad: W }
    P_ent: { expr: "V_max*I_max", sim: "P", nombre: "potencia entregada máxima", unidad: W }
    S_tr: { expr: "V_max*I_max*k_ef", sim: "S", nombre: "potencia del transformador", unidad: VA }

tarjetas:
  - id: explore-continua
    tipo: explorar
    titulo: "La continua, con la red real"
    texto: "Secundario de 30 V eficaces, puente, 10 000 µF y 3 A. Mueva la red y mire la continua."
    libro: [275, 279, 284]
    widget:
      tipo: circuito
      esquema: puente
      piezas: { fuente: V_p, f: f_r, vd: V_d, c: C_f, carga: R_L }
      lectura: { valor: V_cc, rotulo: "Continua a plena carga" }
      grafica:
        x: { id: t, min: 0, max: 0.04, unidad: s, rotulo: "t" }
        y: { min: 0, max: 50, unidad: V, rotulo: "v" }
        curvas:
          - { expr: "max(V_p*abs(sin(2*pi*f_r*t)) - 2*V_d, V_pk*exp(-(t - T_r/4 - T_r/2*floor((t - T_r/4)/(T_r/2)))/tau))", color: naranja, rotulo: "salida", mide: salida }
      mandos:
        - { valor: red, lista: [0.9, 1], nombres: ["red al −10 %", "red nominal"], rotulo: "Red" }
    requiere: { mover: [red] }
    comprobar:
      - { con: { red: 1 }, V_cc: 39.5, V_p: 42.4, tol: 0.01 }
      - { con: { red: 0.9 }, V_cc: 35.3, tol: 0.01 }

  - id: formula-continua
    tipo: formula
    titulo: "Los 39,5 V"
    texto: "El pico menos dos diodos menos medio rizado, con la red nominal y plena carga."
    libro: [276, 277]
    fijar: { red: 1 }
    ec: 277
    sustitucion: "{{V_p}} − 2 × {{V_d}} − {{dV}}/2 = {{V_cc}}"
    widget:
      tipo: circuito
      esquema: puente
      piezas: { fuente: V_p, f: f_r, vd: V_d, c: C_f, carga: R_L }
      lectura: { valor: V_cc, rotulo: "Continua a plena carga" }
      grafica:
        x: { id: t, min: 0, max: 0.04, unidad: s, rotulo: "t" }
        y: { min: 0, max: 50, unidad: V, rotulo: "v" }
        curvas:
          - { expr: "max(V_p*abs(sin(2*pi*f_r*t)) - 2*V_d, V_pk*exp(-(t - T_r/4 - T_r/2*floor((t - T_r/4)/(T_r/2)))/tau))", color: naranja, rotulo: "salida", mide: salida }
      mandos: []
    comprobar:
      - { V_cc: 39.5, dV: 3, tol: 0.01 }

  - id: prediga-48
    tipo: predecir
    titulo: "Lo que hay que soportar"
    texto: "Red un 10 % alta y sin carga. ¿Qué tensión deben soportar el regulador y el condensador?"
    libro: [280]
    fijar: { red: 1.1 }
    widget:
      tipo: grafica
      x: { id: rx, min: 0.85, max: 1.15, unidad: "", rotulo: "red relativa" }
      y: { min: 30, max: 50, unidad: V, rotulo: "V" }
      curvas:
        - { expr: "(V_sec*1.414*rx - 2*V_d)*1.05", color: naranja, rotulo: "en vacío" }
      lectura: { valor: V_vac, rotulo: "En vacío, red alta" }
      ocultar: true
    opciones:
      - texto: "Unos 48 V"
        bien: true
        porque: "45,3 V de pico con la red alta, más el 5 % que sube en vacío un transformador de este tamaño."
      - texto: "39,5 V, la nominal"
        porque: "Esa es con la red nominal y plena carga; el peor caso alto es en vacío y con la red alta."
      - texto: "45,3 V justos"
        porque: "Falta lo que sube en vacío el transformador: un 5 % más."
    escalera:
      - "Red alta, sin rizado que restar, y el transformador sube en vacío."
    solucion: "Unos 48 V: por eso el condensador es de 63 V."
    comprobar:
      - { V_vac: 47.6, V_pk: 45.3, tol: 0.01 }

  - id: estime-secundario
    tipo: pregunta
    titulo: "Hacia atrás"
    texto: "30 V de salida, 3,5 V de caída mínima, 3 V de rizado y dos diodos, con la red al −10 %. ¿Qué secundario eficaz hace falta?"
    libro: [281]
    widget:
      tipo: grafica
      x: { id: vx, min: 20, max: 40, unidad: V, rotulo: "V_{sec}" }
      y: { min: 20, max: 55, unidad: V, rotulo: "pico con red baja" }
      curvas:
        - { expr: "0.9*1.414*vx", color: naranja, rotulo: "pico con la red al −10 %" }
        - { expr: "37.9", color: tinta, rotulo: "37,9 V necesarios", discontinua: true }
    estimar:
      objetivo: "V_sreq"
      unidad: V
      min: 20
      max: 40
      paso: 0.5
      inicio: 24
      tol: 0.03
      rotulo: "Secundario eficaz"
    exito: "Unos 30 V eficaces. Con 24 V la fuente no pasaría de unos 26 V a 3 A."
    pistas:
      - { cuando: { valor: estimacion, mayor: 30.8 }, texto: "Se ha pasado: el pico necesario es 37,9 V con la red al −10 %." }
      - { texto: "Se ha quedado corto: 24 V parecen bastar para 30 V, pero no dejan caída en el valle con la red baja." }
    escalera:
      - "Pico necesario: 30 + 3,5 + 3 + 1,4 = 37,9 V. Divídalo entre 0,9 × 1,414."
    solucion: "37,9 / (0,9 × 1,414) ≈ 30 V eficaces."
    comprobar:
      - { V_sreq: 29.8, tol: 0.01 }

  - id: pregunta-disipacion
    tipo: pregunta
    titulo: "El peor caso, sin prerregulador"
    texto: "Con 48 V de entrada y la salida a 5 V con 3 A, ¿cuánto disipa el paso?"
    libro: [287, 288, 289, 290, 307]
    fijar: { V_out: 5 }
    widget:
      tipo: grafica
      x: { id: vx, min: 0, max: 30, unidad: V, rotulo: "V_{out}" }
      y: { min: 0, max: 160, unidad: W, rotulo: "P" }
      curvas:
        - { expr: "(V_alta - vx)*I_max", color: naranja, rotulo: "sin prerregulador" }
        - { expr: "V_hr*I_max", color: azul, rotulo: "con prerregulador" }
    opciones:
      - texto: "129 W: con dos transistores, 65 W cada uno"
        bien: true
        porque: "(48 − 5) × 3. Una cota algo pesimista: con carga la entrada baja a unos 44 V."
      - texto: "144 W"
        porque: "Esa es con la salida cortocircuitada, a 0 V."
      - texto: "15 W"
        porque: "Eso es lo que se entrega a 5 V; el paso disipa lo que sobra."
    escalera:
      - "Lo que sobra, 48 − 5, por los 3 A."
    solucion: "(48 − 5) × 3 = 129 W; con prerregulador de 4 V, 12 W."
    comprobar:
      - { P_5: 129, P_0: 144, P_o5: 15, P_pre: 12 }

  - id: reto-disipador
    tipo: reto
    titulo: "El disipador, con prerregulador"
    texto: "12 W en el paso, admitiendo 60 °C de unión sobre ambiente, con R_{jc} de 1 y R_{cs} de 0,5. Elija el disipador."
    libro: [292, 296, 297, 298]
    inicio: { R_sa: 8 }
    widget:
      tipo: grafica
      x: { id: rx, min: 0, max: 10, unidad: "°C/W", rotulo: "R_{sa}" }
      y: { min: 0, max: 120, unidad: "°C", rotulo: "ΔT" }
      curvas:
        - { expr: "P_pre*(R_jc + R_cs + rx)", color: naranja, rotulo: "unión sobre ambiente" }
        - { expr: "dT", color: tinta, rotulo: "60 °C", discontinua: true }
      marcas:
        - { x: "R_sa", y: "dT_j", rotulo: "{{dT_j}}" }
      lectura: { valor: dT_j, rotulo: "Unión sobre ambiente" }
      mandos:
        - { valor: R_sa, lista: [1, 2, 3.5, 5, 8], rotulo: "Disipador, R_{sa}" }
    condiciones:
      - { valor: dT_j, max: 60, rotulo: "Sobre ambiente: {{dT_j}}" }
    exito: "Con R_{sa} de 3,5 °C/W o menos: un disipador modesto. Sin prerregulador harían falta seis transistores."
    pistas:
      - { cuando: { valor: dT_j, mayor: 60 }, texto: "Pasa de 60 °C: hace falta un disipador de menos °C/W." }
    escalera:
      - "R_{total} = 60/12 = 5 °C/W. Reste R_{jc} y R_{cs}."
    solucion: "5 − 1 − 0,5 = 3,5 °C/W como mucho."
    comprobar:
      - { R_tot: 5, R_sa_max: 3.5 }
      - { con: { R_sa: 3.5 }, dT_j: 60 }

  - id: shunt
    tipo: pregunta
    titulo: "El shunt de 0,05 Ω"
    texto: "Por el shunt de 0,05 Ω pasan 3 A. ¿Qué potencia necesita?"
    libro: [300]
    widget:
      tipo: grafica
      x: { id: ix, min: 0, max: 4, unidad: A, rotulo: "I" }
      y: { min: 0, max: 1, unidad: W, rotulo: "P" }
      curvas:
        - { expr: "ix^2*R_sh", color: naranja, rotulo: "I²·R" }
    opciones:
      - texto: "Al menos 1 W: disipa 0,45 W"
        bien: true
        porque: "3² × 0,05 = 0,45 W, y da 150 mV a fondo de escala."
      - texto: "0,15 W"
        porque: "Esos 150 mV son la caída a fondo de escala; la potencia es I²·R."
      - texto: "Basta una de señal"
        porque: "Con 0,45 W una de señal se quema: al menos 1 W."
    escalera:
      - "P = I²·R."
    solucion: "0,45 W: una resistencia de al menos 1 W."
    comprobar:
      - { V_sh: 0.15, P_sh: 0.45 }

  - id: rizado-c
    tipo: pregunta
    titulo: "Lo que decide su vida"
    texto: "El condensador de 10 000 µF / 63 V, con 3 A de salida. ¿Qué dato hay que comprobar en su hoja?"
    libro: [283, 284, 285]
    widget:
      tipo: figura
      figura: fig-50.14
      zonas:
        - { id: grafica, rotulo: "La figura", rect: [0, 0, 435, 202] }
    opciones:
      - texto: "Su corriente de rizado eficaz: unos 4,5 A"
        bien: true
        porque: "Con pulsos de carga, del orden de 1,5 veces la corriente de salida: es lo que decide su vida."
      - texto: "Su tolerancia de capacidad"
        porque: "Importa menos: lo que lo calienta y lo seca es la corriente de rizado."
      - texto: "Nada más: la tensión ya tiene margen"
        porque: "La tensión sí; la corriente de rizado hay que comprobarla."
    escalera:
      - "¿Qué lo calienta por dentro?"
    solucion: "La corriente de rizado eficaz, unos 4,5 A."

  - id: simule-va
    tipo: simular
    titulo: "La comprobación de coherencia"
    texto: "La fuente entrega como mucho 30 V y 3 A. ¿De cuántos VA debe ser el transformador?"
    libro: [303]
    widget:
      tipo: grafica
      x: { id: kx, min: 1, max: 2.5, unidad: "", rotulo: "eficaz / continua" }
      y: { min: 0, max: 250, unidad: VA, rotulo: "S" }
      curvas:
        - { expr: "V_max*I_max*kx", color: naranja, rotulo: "potencia del transformador" }
      lectura: { valor: S_tr, rotulo: "Transformador" }
      ocultar: true
    simular:
      objetivo: S_tr
      unidad: VA
      tol: 0.05
      rotulo: "Potencia del transformador"
      errores:
        - { expr: "P_ent", texto: "Esos 90 son los vatios entregados. Por los pulsos de carga, la eficaz del secundario es unas 1,8 veces la continua." }
    exito: "Unos 160 VA. Si un número no encaja, se revisa antes de comprar nada."
    escalera:
      - "La corriente eficaz del secundario es unas 1,8 veces la continua."
    solucion: "30 V × 3 A × 1,8 ≈ 160 VA."
    comprobar:
      - { S_tr: 162, P_ent: 90 }

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [277, 281, 292, 303]
    ideas:
      - { titulo: "La continua.", texto: "39,5 V nominal, 35,3 V con la red baja y 48 V en el peor caso alto." }
      - { titulo: "Hacia atrás.", texto: "El secundario sale del peor caso: unos 30 V eficaces." }
      - { titulo: "El calor.", texto: "129 W sin prerregulador; 12 W con él y un disipador de 3,5 °C/W." }
      - { titulo: "Coherencia.", texto: "90 W entregados, unos 160 VA de transformador." }
