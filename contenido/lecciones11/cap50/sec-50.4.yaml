# Lección 1.2 de la sección 51.4 «El Esquema Completo» (cap50; etiquetas sec-50.N = impresas 51.N).
# - Los cinco bloques de la figura 51.7 (fig-50.6) y el esquema de la figura 51.6 (fig-50.5), con zonas en sus
#   componentes críticos y protecciones.
# - Sin modelo numérico: la sección es de lectura del esquema.
# Pasos prácticos: «tocar» la referencia y el diodo de protección de la salida en el esquema.
# 1.2.1 (autor121-pot, «aprender haciendo», GUIA §13): con los valores del propio esquema 51.6 (TL431 de 2,5 V,
# R1 de 22 kΩ, R2 de 2 kΩ, R_S de 0,05 Ω, salida de 0–30 V y 0–3 A) se elige R1 para que el divisor devuelva la
# referencia con la salida en 30 V (objetivo, esquema «divisor» vivo) y se calcula la tensión del shunt a 3 A. Los
# bloques y los componentes se tocan. Quedan dos preguntas (la separación y el aislamiento); los críticos y los tres
# casos de entrada, al resumen.
leccion: cap50/sec-50.4

libro:
  109: "reúne cinco bloques, y su lectura ordenada explica el aparato entero"
  111: "Entrada de red y transformador"
  112: "puente, condensador principal y su descarga"
  114: "con su OR de diodos y la referencia común"
  117: "Es una cuestión de seguridad y no de estética."
  118: "en los tres casos: entrada mínima, nominal y máxima"
  123: "de la que depende toda la exactitud"
  124: "El shunt de corriente, con su tolerancia y su coeficiente térmico."
  125: "El divisor de realimentación, cuyas tolerancias se trasladan a la salida."
  126: "marcados como críticos para la estabilidad"
  127: "una anotación de «no sustituir por otro valor» ahorra problemas futuros"
  131: "contra tensiones inversas aplicadas desde fuera"
  135: "Debe ser inmensurable"
  136: "Esquema de la fuente: lazo de tensión con operacional y lazo de límite de corriente."
  137: "Los cinco bloques del esquema de la fuente y sus componentes críticos."

modelo:
  valores:
    V_max: { sim: "V_{out}", nombre: "salida máxima", unidad: V, valor: 30 }
    V_ref: { sim: "V_{ref}", nombre: "referencia TL431", unidad: V, valor: 2.5 }
    R_1: { sim: "R_{1}", nombre: "resistencia de arriba del divisor", unidad: Ω, valor: 10000 }
    R_2: { sim: "R_{2}", nombre: "resistencia de abajo del divisor", unidad: Ω, valor: 2000 }
    R_s: { sim: "R_{S}", nombre: "shunt de corriente", unidad: Ω, valor: 0.05 }
    I_max: { sim: "I", nombre: "corriente máxima", unidad: A, valor: 3 }
  calculos:
    V_fb: { expr: "V_max*R_2/(R_1 + R_2)", sim: "V_{fb}", nombre: "lo que devuelve el divisor", unidad: V }
    I_div: { expr: "V_max/(R_1 + R_2)", sim: "I", nombre: "corriente del divisor", unidad: A }
    V_sh: { expr: "I_max*R_s", sim: "V_{S}", nombre: "tensión en el shunt a 3 A", unidad: V }
    V_err: { expr: "I_max/R_s", sim: "V", nombre: "corriente entre resistencia (error)", unidad: V }

tarjetas:
  - id: explore-divisor
    tipo: explorar
    titulo: "El divisor de realimentación"
    texto: "El lazo ajusta la salida hasta que el divisor devuelve los 2,5 V del TL431. Elija R1 para que eso ocurra con la salida en 30 V."
    libro: [123, 125, 136]
    inicio: { R_1: 10000 }
    widget:
      tipo: circuito
      esquema: divisor
      piezas: { fuente: V_max, arriba: R_1, abajo: R_2 }
      lectura: { valor: V_fb, rotulo: "Lo que devuelve el divisor" }
      corriente: I_div
      mide: { salida: V_fb, corriente: I_div }
      mandos:
        - { valor: R_1, lista: [10000, 15000, 22000, 33000], rotulo: "R1" }
    objetivo:
      condiciones:
        - { valor: V_fb, objetivo: 2.5, tol: 0.02, rotulo: "Realimentación: {{V_fb}}" }
      logrado: "Con R1 de {{R_1}} y R2 de {{R_2}}, 30 V dan {{V_fb}}: la salida máxima la fijan la referencia y el divisor. Sus tolerancias pasan a la salida."
      pistas:
        - { cuando: { valor: V_fb, mayor: 2.55 }, texto: "Devuelve demasiado: el lazo se pararía antes de 30 V. R1 mayor." }
        - { texto: "Devuelve poco: la salida subiría por encima de 30 V. R1 menor." }
    escalera:
      - "30 V × R2/(R1 + R2) debe ser 2,5 V."
    solucion: "22 kΩ: 30 V × 2/(22 + 2) = 2,5 V."
    comprobar:
      - { con: { R_1: 22000 }, V_fb: 2.5, V_max: 30, V_ref: 2.5 }

  - id: toque-bloques
    tipo: tocar
    titulo: "Cinco bloques"
    texto: "Leído en orden, el esquema explica el aparato entero. Toque el bloque de los dos lazos con su OR de diodos y la referencia común."
    libro: [109, 111, 112, 114, 137]
    widget:
      tipo: figura
      figura: fig-50.6
      zonas:
        - { id: red, rotulo: "Primer recuadro, arriba a la izquierda", rect: [2, 25, 136, 100] }
        - { id: filtro, rotulo: "Segundo recuadro de arriba", rect: [151, 40, 109, 85] }
        - { id: paso, rotulo: "Tercer recuadro de arriba", rect: [270, 40, 90, 85] }
        - { id: lazos, rotulo: "Recuadro verde de abajo", rect: [152, 148, 180, 78] }
        - { id: medida, rotulo: "Recuadro azul de abajo", rect: [345, 148, 107, 78] }
    tocar:
      bien: [lazos]
      porque:
        red: "Entrada de red y transformador: fusible, interruptor, protección y la frontera de seguridad."
        filtro: "Rectificación y filtrado: puente, condensador principal y su descarga."
        paso: "El elemento de paso y su disipación."
        medida: "Medida e indicación: sensado y los indicadores de modo."
    exito: "Tensión y corriente, unidos por diodos, con la referencia común."
    escalera:
      - "Busque el que habla de tensión y corriente a la vez."
    solucion: "El recuadro verde de abajo."

  - id: toque-referencia
    tipo: tocar
    titulo: "Toda la exactitud"
    texto: "En el esquema, toque la referencia de tensión, de la que depende toda la exactitud de la fuente."
    libro: [123, 136]
    widget:
      tipo: figura
      figura: fig-50.5
      zonas:
        - { id: fusible, rotulo: "Pieza de arriba a la izquierda", rect: [10, 28, 36, 36] }
        - { id: condensador, rotulo: "Condensador grande, a la izquierda", rect: [118, 85, 40, 40] }
        - { id: referencia, rotulo: "Pieza bajo R_{Z}", rect: [180, 55, 50, 45] }
        - { id: shunt, rotulo: "Resistencia de arriba a la derecha", rect: [310, 2, 40, 36] }
    tocar:
      bien: [referencia]
      porque:
        fusible: "Es el fusible de red: protección, no exactitud."
        condensador: "Es el condensador de filtro: fija el rizado, no la exactitud."
        shunt: "El shunt mide la corriente; su tolerancia importa, pero la exactitud de la tensión la da la referencia."
    exito: "El TL431 de 2,5 V: la exactitud de la fuente no puede ser mejor que la suya."
    comprobar:
      - { V_ref: 2.5 }
    escalera:
      - "Busque la pieza que da una tensión fija para comparar."
    solucion: "El TL431, la referencia."

  - id: simule-shunt
    tipo: simular
    titulo: "El shunt"
    texto: "El lazo de corriente mide la caída en R_{S} de 0,05 Ω. ¿Qué tensión le da a 3 A?"
    libro: [124, 136]
    widget:
      tipo: grafica
      x: { id: ix, min: 0, max: 3, unidad: A, rotulo: "I" }
      y: { min: 0, max: 0.2, unidad: V, rotulo: "V_{S}" }
      curvas:
        - { expr: "ix*R_s", color: azul, rotulo: "tensión en el shunt" }
      lectura: { valor: V_sh, rotulo: "Tensión en el shunt" }
      ocultar: true
    simular:
      objetivo: V_sh
      unidad: V
      tol: 0.03
      rotulo: "Tensión en el shunt a 3 A"
      errores:
        - { expr: "V_err", texto: "Ha dividido: la caída es corriente por resistencia." }
    exito: "150 mV: tan poco que su tolerancia y su coeficiente térmico mandan en la exactitud del límite."
    escalera:
      - "V = I·R."
    solucion: "3 A × 0,05 Ω = 0,15 V."
    comprobar:
      - { V_sh: 0.15, V_err: 60, I_max: 3, R_s: 0.05 }

  - id: separacion
    tipo: porque
    titulo: "Primario y secundario"
    texto: "¿Por qué el esquema debe dibujar explícitamente la separación entre primario y secundario?"
    libro: [117]
    widget:
      tipo: figura
      figura: fig-50.5
      zonas:
        - { id: frontera, rotulo: "Línea discontinua roja", rect: [140, 5, 36, 165] }
    opciones:
      - texto: "Es una cuestión de seguridad"
        bien: true
        porque: "Marca qué parte está a tensión de red; no es estética."
      - texto: "Para que quede más ordenado"
        porque: "No es estética: dice dónde está la tensión peligrosa."
      - texto: "Para el fabricante de la placa"
        porque: "Sirve a quien monta, repara o mide: es seguridad."
    escalera:
      - "¿Qué lado está a tensión de red?"
    solucion: "Es una cuestión de seguridad, no de estética."

  - id: toque-d3
    tipo: tocar
    titulo: "Una tensión desde fuera"
    texto: "Un circuito con condensadores cargados devuelve tensión inversa a la salida. Toque el diodo que protege de eso."
    libro: [131, 136]
    widget:
      tipo: figura
      figura: fig-50.5
      zonas:
        - { id: or, rotulo: "Diodos del centro, junto a Q1", rect: [282, 55, 40, 36] }
        - { id: compensacion, rotulo: "Condensador junto a A_{V}", rect: [242, 95, 40, 36] }
        - { id: d3, rotulo: "Diodo a la derecha, en la salida", rect: [414, 75, 36, 40] }
        - { id: divisor, rotulo: "Resistencias verticales de la derecha", rect: [377, 35, 36, 135] }
    tocar:
      bien: [d3]
      porque:
        or: "Son los diodos del OR que unen los dos lazos."
        compensacion: "Es el condensador de compensación del lazo de tensión."
        divisor: "Es el divisor de realimentación, R1 y R2."
    exito: "D3, en la salida: un accidente frecuente al alimentar circuitos con condensadores cargados."
    escalera:
      - "Tiene que estar en los bornes de salida."
    solucion: "D3, a la derecha, entre los bornes de salida."

  - id: banco-aislamiento
    tipo: pregunta
    titulo: "Antes de conectar nada"
    texto: "Con el aparato desconectado se mide la resistencia entre primario y secundario. ¿Qué debe dar?"
    libro: [135]
    widget:
      tipo: figura
      figura: fig-50.6
      zonas:
        - { id: red, rotulo: "Primer recuadro, arriba a la izquierda", rect: [2, 25, 136, 100] }
    opciones:
      - texto: "Inmensurable"
        bien: true
        porque: "Si se puede medir, hay un problema de aislamiento que resolver antes de conectar."
      - texto: "La resistencia del transformador"
        porque: "El transformador no une primario y secundario con cobre."
      - texto: "Cero"
        porque: "Cero sería un contacto franco entre la red y la baja tensión."
    escalera:
      - "Entre primario y secundario no hay cobre."
    solucion: "Inmensurable."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [117, 118, 123, 124, 125, 126, 127, 131]
    ideas:
      - { titulo: "En orden.", texto: "Red, rectificación, paso, lazos y medida: el aparato entero." }
      - { titulo: "Lo que debe decir.", texto: "La separación, las tensiones con la entrada mínima, nominal y máxima, las disipaciones y los ajustes." }
      - { titulo: "Lo crítico.", texto: "Referencia, exactitud; shunt, tolerancia y deriva; divisor, tolerancias a la salida; compensación, estabilidad. «No sustituir por otro valor»." }
      - { titulo: "Protecciones.", texto: "Fusible, descarga del condensador, diodo en la salida y protección térmica." }
