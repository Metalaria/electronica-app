# Lección 1.2 de la sección 51.4 «El Esquema Completo» (cap50; etiquetas sec-50.N = impresas 51.N).
# - Los cinco bloques de la figura 51.7 (fig-50.6) y el esquema de la figura 51.6 (fig-50.5), con zonas en sus
#   componentes críticos y protecciones.
# - Sin modelo numérico: la sección es de lectura del esquema.
# Pasos prácticos: «tocar» la referencia y el diodo de protección de la salida en el esquema.
leccion: cap50/sec-50.4

libro:
  111: "Entrada de red y transformador"
  112: "puente, condensador principal y su descarga"
  114: "con su OR de diodos y la referencia común"
  117: "Es una cuestión de seguridad y no de estética."
  118: "en los tres casos: entrada mínima, nominal y máxima"
  123: "de la que depende toda la exactitud"
  124: "El shunt de corriente, con su tolerancia y su coeficiente térmico."
  125: "El divisor de realimentación, cuyas tolerancias se trasladan a la salida."
  126: "marcados como críticos para la estabilidad"
  127: "una anotación de «no sustituir por otro valor» ahorra problemas futuros"
  131: "contra tensiones inversas aplicadas desde fuera"
  135: "Debe ser inmensurable"
  136: "Esquema de la fuente: lazo de tensión con operacional y lazo de límite de corriente."
  137: "Los cinco bloques del esquema de la fuente y sus componentes críticos."

modelo: { valores: {}, calculos: {} }

tarjetas:
  - id: explore-bloques
    tipo: explorar
    titulo: "Cinco bloques"
    texto: "Leído en orden, el esquema explica el aparato entero. Toque los cinco bloques."
    libro: [111, 112, 114, 137]
    widget:
      tipo: figura
      figura: fig-50.6
      zonas:
        - { id: red, rotulo: "Primer recuadro, arriba a la izquierda", rect: [2, 25, 136, 100], texto: "Entrada de red y transformador: fusible, interruptor, protección y la frontera de seguridad." }
        - { id: filtro, rotulo: "Segundo recuadro de arriba", rect: [151, 40, 109, 85], texto: "Rectificación y filtrado: puente, condensador principal y su descarga." }
        - { id: paso, rotulo: "Tercer recuadro de arriba", rect: [270, 40, 90, 85], texto: "El elemento de paso, con su disipador y su protección térmica." }
        - { id: lazos, rotulo: "Recuadro verde de abajo", rect: [152, 148, 180, 78], texto: "Los dos lazos de control, tensión y corriente, con su OR de diodos y la referencia común." }
        - { id: medida, rotulo: "Recuadro azul de abajo", rect: [345, 148, 107, 78], texto: "Medida e indicación: sensado de tensión y de corriente, e indicadores de modo." }
    requiere: { mover: [red, lazos] }

  - id: toque-referencia
    tipo: tocar
    titulo: "Toda la exactitud"
    texto: "En el esquema, toque la referencia de tensión, de la que depende toda la exactitud de la fuente."
    libro: [123, 136]
    widget:
      tipo: figura
      figura: fig-50.5
      zonas:
        - { id: fusible, rotulo: "Pieza de arriba a la izquierda", rect: [10, 28, 36, 36] }
        - { id: condensador, rotulo: "Condensador grande, a la izquierda", rect: [118, 85, 40, 40] }
        - { id: referencia, rotulo: "Pieza bajo R_{Z}", rect: [180, 55, 50, 45] }
        - { id: shunt, rotulo: "Resistencia de arriba a la derecha", rect: [310, 2, 40, 36] }
    tocar:
      bien: [referencia]
      porque:
        fusible: "Es el fusible de red: protección, no exactitud."
        condensador: "Es el condensador de filtro: fija el rizado, no la exactitud."
        shunt: "El shunt mide la corriente; su tolerancia importa, pero la exactitud de la tensión la da la referencia."
    exito: "El TL431: la exactitud de la fuente no puede ser mejor que la suya."
    escalera:
      - "Busque la pieza que da una tensión fija para comparar."
    solucion: "El TL431, la referencia."

  - id: empareje-criticos
    tipo: pregunta
    titulo: "Los componentes críticos"
    texto: "Empareje cada componente crítico con por qué se señala en el esquema."
    libro: [123, 124, 125, 126]
    widget:
      tipo: figura
      figura: fig-50.6
      zonas:
        - { id: criticos, rotulo: "Recuadro naranja de abajo", rect: [2, 148, 138, 78] }
    emparejar:
      - ["La referencia", "De ella depende toda la exactitud"]
      - ["El shunt de corriente", "Su tolerancia y su coeficiente térmico"]
      - ["El divisor de realimentación", "Sus tolerancias pasan a la salida"]
      - ["Los condensadores de compensación", "Críticos para la estabilidad"]
    exito: "En los cuatro, una anotación de «no sustituir por otro valor» ahorra problemas."
    pistas:
      - { texto: "La estabilidad la deciden los que compensan el lazo." }
    escalera:
      - "Uno fija la exactitud, otro mide corriente, otro escala la salida, otro estabiliza."
    solucion: "Referencia, exactitud; shunt, tolerancia y deriva; divisor, tolerancias; compensación, estabilidad."

  - id: separacion
    tipo: porque
    titulo: "Primario y secundario"
    texto: "¿Por qué el esquema debe dibujar explícitamente la separación entre primario y secundario?"
    libro: [117]
    widget:
      tipo: figura
      figura: fig-50.5
      zonas:
        - { id: frontera, rotulo: "Línea discontinua roja", rect: [140, 5, 36, 165] }
    opciones:
      - texto: "Es una cuestión de seguridad"
        bien: true
        porque: "Marca qué parte está a tensión de red; no es estética."
      - texto: "Para que quede más ordenado"
        porque: "No es estética: dice dónde está la tensión peligrosa."
      - texto: "Para el fabricante de la placa"
        porque: "Sirve a quien monta, repara o mide: es seguridad."
    escalera:
      - "¿Qué lado está a tensión de red?"
    solucion: "Es una cuestión de seguridad, no de estética."

  - id: tres-casos
    tipo: pregunta
    titulo: "Las tensiones anotadas"
    texto: "El esquema anota las tensiones en cada punto. ¿En qué casos?"
    libro: [118]
    widget:
      tipo: figura
      figura: fig-50.6
      zonas:
        - { id: filtro, rotulo: "Segundo recuadro de arriba", rect: [151, 40, 109, 85] }
    opciones:
      - texto: "Con la entrada mínima, la nominal y la máxima"
        bien: true
        porque: "Así se comprueba la placa montada en los tres casos."
      - texto: "Solo con la entrada nominal"
        porque: "El regulador debe funcionar con la red baja y soportar la alta."
      - texto: "Solo en vacío"
        porque: "Importan los tres casos de entrada, con su carga."
    escalera:
      - "La red no siempre vale lo mismo."
    solucion: "Con la entrada mínima, nominal y máxima."

  - id: toque-d3
    tipo: tocar
    titulo: "Una tensión desde fuera"
    texto: "Un circuito con condensadores cargados devuelve tensión inversa a la salida. Toque el diodo que protege de eso."
    libro: [131, 136]
    widget:
      tipo: figura
      figura: fig-50.5
      zonas:
        - { id: or, rotulo: "Diodos del centro, junto a Q1", rect: [282, 55, 40, 36] }
        - { id: compensacion, rotulo: "Condensador junto a A_{V}", rect: [242, 95, 40, 36] }
        - { id: d3, rotulo: "Diodo a la derecha, en la salida", rect: [414, 75, 36, 40] }
        - { id: divisor, rotulo: "Resistencias verticales de la derecha", rect: [377, 35, 36, 135] }
    tocar:
      bien: [d3]
      porque:
        or: "Son los diodos del OR que unen los dos lazos."
        compensacion: "Es el condensador de compensación del lazo de tensión."
        divisor: "Es el divisor de realimentación, R1 y R2."
    exito: "D3, en la salida: un accidente frecuente al alimentar circuitos con condensadores cargados."
    escalera:
      - "Tiene que estar en los bornes de salida."
    solucion: "D3, a la derecha, entre los bornes de salida."

  - id: banco-aislamiento
    tipo: pregunta
    titulo: "Antes de conectar nada"
    texto: "Con el aparato desconectado se mide la resistencia entre primario y secundario. ¿Qué debe dar?"
    libro: [135]
    widget:
      tipo: figura
      figura: fig-50.6
      zonas:
        - { id: red, rotulo: "Primer recuadro, arriba a la izquierda", rect: [2, 25, 136, 100] }
    opciones:
      - texto: "Inmensurable"
        bien: true
        porque: "Si se puede medir, hay un problema de aislamiento que resolver antes de conectar."
      - texto: "La resistencia del transformador"
        porque: "El transformador no une primario y secundario con cobre."
      - texto: "Cero"
        porque: "Cero sería un contacto franco entre la red y la baja tensión."
    escalera:
      - "Entre primario y secundario no hay cobre."
    solucion: "Inmensurable."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [117, 123, 127, 131]
    ideas:
      - { titulo: "En orden.", texto: "Red, rectificación, paso, lazos y medida: el aparato entero." }
      - { titulo: "Lo que debe decir.", texto: "La separación, las tensiones en tres casos, las disipaciones y los ajustes." }
      - { titulo: "Lo crítico.", texto: "Referencia, shunt, divisor y compensación: «no sustituir por otro valor»." }
      - { titulo: "Protecciones.", texto: "Fusible, descarga del condensador, diodo en la salida y protección térmica." }
