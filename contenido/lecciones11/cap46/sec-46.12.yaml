# Lección 1.2 de la sección 47.12 «Cuatro Fallos que Explican Cuatro Capítulos» (cap46; etiquetas sec-46.N = impresas 47.N).
# - La cadena del Ariane 501 (figura 47.18, fig-46.18) y el Therac-25 (figura 47.20, fig-46.20) con zonas en sus
#   recuadros (no en las referencias de sección dibujadas).
# - La deriva del reloj del Patriot crece linealmente con las horas encendido (bloque 405); la pendiente es la de la
#   figura 47.19: 0,343 s a las 100 h (0,00343 s/h, fijada en la tarjeta).
# Paso práctico: «dibujar» la desviación del reloj frente a las horas encendido; «tocar» en la figura 47.20 la protección
# física que se retiró.
leccion: cap46/sec-46.12

libro:
  394: "se desvió de su trayectoria unos 37 segundos después del despegue"
  395: "una conversión de un número en coma flotante de 64 bits a un entero con signo de 16 bits produjo un desbordamiento"
  397: "El código venía del Ariane 4, donde esa magnitud nunca alcanzaba valores tan grandes."
  400: "la unidad de respaldo —ejecutando el mismo programa con los mismos datos— había fallado idénticamente un ciclo antes"
  401: "la redundancia idéntica no protege frente a un error de diseño, solo frente a fallos aleatorios"
  404: "una décima no tiene representación exacta en binario"
  405: "se acumula linealmente con el tiempo encendido"
  406: "la instrucción provisional era reiniciar el sistema periódicamente"
  407: "un sistema cuya corrección es «reiniciar de vez en cuando» tiene un fallo latente esperando"
  411: "enclavamientos electromecánicos impedían físicamente esa combinación"
  412: "exigía una velocidad de tecleo que solo alcanzan los operadores expertos tras meses de práctica"
  413: "una comprobación de seguridad no debe depender solo del software"
  418: "Un watchdog refrescado desde el sitio equivocado es peor que no tenerlo"
  422: "Ninguno fue un fallo de componente."
  424: "que el valor no crecería tanto, que el sistema se reiniciaría, que nadie teclearía tan deprisa, que la pila bastaba"
  425: "la fiabilidad no la decide la calidad de los componentes (sección 47.1), sino si alguien comprobó los supuestos"
  430: "El desbordamiento del Ariane 501 y las tres circunstancias que lo hicieron posible."
  431: "Acumulación del error de reloj del Patriot"
  432: "Therac-25: la protección física sustituida por software."

modelo:
  valores:
    k_p: { sim: "k", nombre: "deriva del reloj por hora encendido", unidad: "s/h", valor: 0.00343 }
    h_e: { sim: "t", nombre: "horas encendido", unidad: h, valor: 100 }
  calculos:
    d_p: { expr: "k_p*h_e", sim: "Δt", nombre: "desviación del reloj", unidad: s, cifras: 3 }

tarjetas:
  - id: explore-ariane
    tipo: explorar
    titulo: "Ariane 5, vuelo 501"
    texto: "Unos 37 segundos tras el despegue, el lanzador se desvió y se destruyó. Toque cada eslabón de la cadena."
    libro: [394, 395, 400, 430]
    widget:
      tipo: figura
      figura: fig-46.18
      zonas:
        - { id: desborde, rotulo: "Primer recuadro de arriba", rect: [2, 19, 140, 64], texto: "Una conversión de coma flotante de 64 bits a entero con signo de 16 bits desbordó." }
        - { id: apagada, rotulo: "Segundo recuadro de arriba", rect: [156, 19, 141, 64], texto: "La unidad inercial se apagó, como estaba diseñada; la de respaldo había fallado igual un ciclo antes." }
        - { id: correccion, rotulo: "Tercer recuadro de arriba", rect: [311, 19, 141, 64], texto: "El ordenador tomó el patrón de diagnóstico por datos de vuelo y ordenó una corrección extrema." }
    requiere: { mover: [desborde, apagada, correccion] }

  - id: prediga-respaldo
    tipo: predecir
    titulo: "La unidad de respaldo"
    texto: "El Ariane 5 tenía una unidad inercial de respaldo. ¿Por qué no salvó el vuelo?"
    libro: [400, 401]
    widget:
      tipo: figura
      figura: fig-46.18
      zonas:
        - { id: apagada, rotulo: "Segundo recuadro de arriba", rect: [156, 19, 141, 64] }
    opciones:
      - texto: "Ejecutaba el mismo programa con los mismos datos y ya había fallado"
        bien: true
        porque: "La redundancia idéntica protege de fallos aleatorios, no de un error de diseño."
      - texto: "Porque tardó en conmutar"
        porque: "No llegó a conmutar: había fallado idénticamente un ciclo antes."
      - texto: "Porque estaba apagada para ahorrar energía"
        porque: "Funcionaba; el problema es que hacía exactamente lo mismo que la principal."
    escalera:
      - "¿Qué tenían en común las dos unidades?"
    solucion: "Mismo programa, mismos datos: falló igual, un ciclo antes."

  - id: ordene-cadena
    tipo: pregunta
    titulo: "La cadena del fallo"
    texto: "Ordene lo que ocurrió en el vuelo 501."
    libro: [395, 400]
    widget:
      tipo: figura
      figura: fig-46.18
      zonas:
        - { id: cadena, rotulo: "Fila de recuadros de arriba", rect: [2, 19, 450, 64] }
    ordenar:
      - "Una conversión a entero de 16 bits desborda"
      - "La unidad inercial se apaga, como estaba diseñada"
      - "El ordenador toma el diagnóstico por datos de vuelo"
      - "Ordena una corrección extrema y el lanzador se rompe"
    exito: "Un desbordamiento en un código que ni siquiera servía para nada en vuelo."
    pistas:
      - { texto: "Todo empieza en la conversión que nadie protegió." }
    escalera:
      - "El diagnóstico llega al ordenador después de que la unidad se apague."
    solucion: "Desbordamiento, unidad apagada, diagnóstico tomado por datos y corrección extrema."

  - id: dibuje-patriot
    tipo: dibujar
    titulo: "El reloj del Patriot"
    texto: "Una décima no es exacta en binario y cada cuenta arrastra un error diminuto. Dibuje la desviación del reloj frente a las horas encendido."
    libro: [404, 405, 431]
    fijar: { k_p: 0.00343 }
    dibujar:
      x: { id: hh, min: 0, max: 120, unidad: h, rotulo: "horas encendido" }
      y: { min: 0, max: 0.45, unidad: s, rotulo: "desviación" }
      curva: "k_p*hh"
      puntos: 13
      tol: 0.08
      holgura: 0.03
      rotulo: "Desviación del reloj"
    exito: "Crece linealmente: a las 100 horas, 0,343 s, y el radar buscó el misil en una ventana equivocada."
    pistas:
      - { cuando: { valor: amplitud, menor: 0.7 }, texto: "Se queda corto: el error no se estabiliza, sigue creciendo con cada hora." }
      - { texto: "Es una recta desde cero: el mismo error en cada cuenta, acumulado sin límite." }
    escalera:
      - "Recién arrancado, el error es despreciable."
      - "Cada hora suma lo mismo: una recta."
    solucion: "Una recta desde 0 que llega a 0,343 s a las 100 horas."
    comprobar:
      - { con: { h_e: 100 }, d_p: 0.343 }

  - id: porque-reiniciar
    tipo: porque
    titulo: "Reiniciar de vez en cuando"
    texto: "El problema se conocía y la instrucción era reiniciar el sistema periódicamente. ¿Por qué no bastó?"
    libro: [406, 407]
    widget:
      tipo: figura
      figura: fig-46.19
      zonas:
        - { id: recta, rotulo: "La recta de la gráfica", rect: [30, 20, 185, 155] }
    opciones:
      - texto: "Esa corrección deja un fallo latente: la unidad llevaba demasiado tiempo sin reiniciarse"
        bien: true
        porque: "Un error integrado sin límite deja de ser pequeño; depender de reiniciar es esperar a que alguien se olvide."
      - texto: "Porque reiniciar no borra la deriva"
        porque: "Sí la borra: el error crece desde el arranque. El problema es que no se reinició."
      - texto: "Porque el error era aleatorio"
        porque: "Era sistemático: crecía linealmente con el tiempo encendido."
    escalera:
      - "¿Qué pasa si nadie reinicia el sistema a tiempo?"
    solucion: "Reiniciar de vez en cuando es un fallo latente esperando."

  - id: toque-therac
    tipo: tocar
    titulo: "Therac-25"
    texto: "En los modelos anteriores, algo impedía disparar el haz de alta corriente sin el blanco. Toque lo que se retiró."
    libro: [411, 413, 432]
    widget:
      tipo: figura
      figura: fig-46.20
      zonas:
        - { id: operador, rotulo: "Primer bloque de la izquierda", rect: [40, 28, 146, 35] }
        - { id: software, rotulo: "Segundo bloque de la izquierda", rect: [40, 64, 146, 35] }
        - { id: enclavamiento, rotulo: "Tercer bloque de la izquierda", rect: [40, 100, 146, 35] }
    tocar:
      bien: [enclavamiento]
      porque:
        operador: "El operador sigue en el modelo nuevo; lo que falta es la protección física."
        software: "El software sigue; en el modelo nuevo es lo único que comprueba."
    exito: "El enclavamiento electromecánico: sin él, la seguridad quedó solo en el software."
    escalera:
      - "Busque lo que en el dibujo de la derecha aparece tachado."
    solucion: "El enclavamiento electromecánico."

  - id: pregunta-carrera
    tipo: pregunta
    titulo: "Por qué no salió en las pruebas"
    texto: "El software del Therac-25 tenía una condición de carrera. ¿Por qué no apareció en las pruebas?"
    libro: [412, 413]
    widget:
      tipo: figura
      figura: fig-46.20
      zonas:
        - { id: pruebas, rotulo: "Recuadro naranja de abajo", rect: [4, 185, 443, 47] }
    opciones:
      - texto: "Exigía teclear con la rapidez de un operador experto"
        bien: true
        porque: "Las condiciones de carrera aparecen con la carga y el uso real, no en el banco."
      - texto: "Porque el fallo era del hardware"
        porque: "El hardware funcionaba; el error estaba en la temporización del software."
      - texto: "Porque nunca se probó el software"
        porque: "Se probó, pero sin la secuencia y la velocidad que lo disparaban."
    escalera:
      - "¿Quién tecleaba en las pruebas y quién tras meses de uso?"
    solucion: "Exigía la velocidad de tecleo de un operador experto."

  - id: pregunta-watchdog
    tipo: pregunta
    titulo: "La pila que se desbordó"
    texto: "Un watchdog se refresca desde una tarea que sigue viva aunque la tarea crítica haya muerto. ¿Qué protección da?"
    libro: [418]
    widget:
      tipo: figura
      figura: fig-46.19
      zonas:
        - { id: formas, rotulo: "Recuadros de la derecha", rect: [258, 18, 188, 167] }
    opciones:
      - texto: "Peor que ninguna: da una falsa sensación de seguridad"
        bien: true
        porque: "Sigue refrescándose aunque la tarea que importa esté muerta."
      - texto: "Total: mientras se refresque, el sistema está bien"
        porque: "Que se refresque solo dice que esa tarea vive, no la crítica."
      - texto: "La mitad: detecta los fallos de la otra tarea"
        porque: "No detecta el fallo de la tarea crítica, que es el que importa."
    escalera:
      - "¿Qué demuestra que el watchdog se refresque?"
    solucion: "Peor que no tenerlo: falsa sensación de protección."

  - id: empareje-supuestos
    tipo: pregunta
    titulo: "Lo que tienen en común"
    texto: "Ninguno fue un fallo de componente: en todos hubo un supuesto no comprobado. Empareje cada caso con el suyo."
    libro: [397, 422, 424, 425]
    emparejar:
      - ["Ariane 5", "Que el valor no crecería tanto"]
      - ["Patriot", "Que el sistema se reiniciaría"]
      - ["Therac-25", "Que nadie teclearía tan deprisa"]
      - ["El caso de automoción", "Que la pila bastaba"]
    exito: "La fiabilidad la decide si alguien comprobó los supuestos, no la calidad de los componentes."
    pistas:
      - { texto: "El reloj del Patriot dependía de reiniciarlo; el Therac, de la velocidad del operador." }
    escalera:
      - "El Ariane heredó un código pensado para valores menores."
    solucion: "Ariane, el valor; Patriot, el reinicio; Therac, el tecleo; automoción, la pila."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [401, 405, 413, 425]
    ideas:
      - { titulo: "Ariane 5.", texto: "Un desbordamiento heredado; la redundancia idéntica falló igual." }
      - { titulo: "Patriot.", texto: "Un error pequeño integrado sin límite deja de ser pequeño." }
      - { titulo: "Therac-25.", texto: "La seguridad no debe depender solo del software." }
      - { titulo: "Los supuestos.", texto: "Ningún componente falló: falló un supuesto sin comprobar." }
