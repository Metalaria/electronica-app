# Lección 1.2 de la sección 47.2 «Mecanismos de Fallo» (cap46; etiquetas sec-46.N = impresas 47.N).
# - Las cuatro familias y los tres modos de la figura 47.3 (fig-46.3) con zonas en sus recuadros.
# - La foto de los bigotes de estaño (figura 47.4, fig-46.4) con zonas en sus dos mitades.
# - Sin modelo numérico: la sección es descriptiva (3 y 15 ppm/°C, bloque 45, solo en el texto).
# Paso práctico: «tocar» el modo intermitente en la figura 47.3 y el transistor cortocircuitado en la foto 47.4.
leccion: cap46/sec-46.2

libro:
  39: "hay mecanismos físicos concretos, y conocerlos permite anticiparlos y prevenirlos"
  41: "Depende exponencialmente de la temperatura y de la densidad de corriente."
  43: "esa deformación repetida agrieta las soldaduras"
  44: "un equipo que se enciende y apaga muchas veces falla antes que uno que funciona continuamente, aunque acumule menos horas"
  45: "el silicio se dilata unas 3 ppm/°C y la placa de FR4, unas 15 en su plano"
  48: "el metal migra entre conductores próximos y acaba formando un puente"
  49: "Bigotes de estaño"
  50: "que es el fallo más común de todos"
  56: "el dispositivo sigue funcionando y falla semanas después"
  58: "una estructura parásita se dispara y cortocircuita la alimentación hasta que se corta"
  61: "Fallo súbito: funciona y deja de funcionar. Suele ser eléctrico o mecánico."
  62: "Fallo por deriva: los parámetros se salen de tolerancia gradualmente. Típico de envejecimiento."
  63: "Es el más difícil y su causa suele ser mecánica: una soldadura agrietada o un contacto degradado."
  66: "Electroquímicos → conformal coating y control de humedad."
  67: "la temperatura aparece en casi todos, y por eso es la palanca de fiabilidad más eficaz"
  70: "el mismo tras un año significa que trabaja demasiado caliente, y sustituirlo sin más solo aplaza el problema"
  71: "Las cuatro familias de mecanismos de fallo y los tres modos de aparición."
  72: "donde han crecido hasta cortocircuitarlo"

modelo: { valores: {}, calculos: {} }

tarjetas:
  - id: explore-familias
    tipo: explorar
    titulo: "Cuatro familias"
    texto: "Un componente no falla «porque sí»: hay mecanismos físicos concretos. Toque cada familia."
    libro: [39, 71, 41, 48, 56, 58]
    widget:
      tipo: figura
      figura: fig-46.3
      zonas:
        - { id: termicos, rotulo: "Recuadro rojo", rect: [6, 5, 105, 111], texto: "Térmicos: electromigración, envejecimiento del dieléctrico y fatiga térmica de las soldaduras." }
        - { id: electroquimicos, rotulo: "Recuadro naranja", rect: [117, 5, 105, 111], texto: "Electroquímicos: corrosión, migración entre conductores próximos, bigotes de estaño y secado del electrolito." }
        - { id: mecanicos, rotulo: "Recuadro azul", rect: [228, 5, 106, 111], texto: "Mecánicos: vibración, choque y desgaste de contactos de relés, conectores y potenciómetros." }
        - { id: electricos, rotulo: "Recuadro morado", rect: [340, 5, 105, 111], texto: "Eléctricos: descarga electrostática, sobretensión y latch-up en CMOS." }
    requiere: { mover: [termicos, electroquimicos, mecanicos, electricos] }

  - id: prediga-ciclos
    tipo: predecir
    titulo: "Encender y apagar"
    texto: "Dos equipos iguales: uno funciona sin parar; el otro se enciende y apaga muchas veces y acumula menos horas. ¿Cuál falla antes?"
    libro: [43, 44]
    widget:
      tipo: figura
      figura: fig-46.3
      zonas:
        - { id: termicos, rotulo: "Recuadro rojo", rect: [6, 5, 105, 111] }
    opciones:
      - texto: "El que se enciende y apaga"
        bien: true
        porque: "Cada ciclo dilata y contrae materiales distintos: la fatiga térmica agrieta las soldaduras."
      - texto: "El que funciona sin parar, porque acumula más horas"
        porque: "Las horas cuentan menos que los ciclos: la fatiga térmica es el mecanismo dominante en campo."
      - texto: "Fallan a la vez: el equipo es el mismo"
        porque: "El uso no es el mismo: los ciclos de calor y frío fatigan las soldaduras."
    escalera:
      - "¿Qué le pasa a una soldadura entre dos materiales que se dilatan distinto?"
    solucion: "El que se enciende y apaga: la fatiga térmica agrieta sus soldaduras."

  - id: porque-underfill
    tipo: porque
    titulo: "El relleno bajo un BGA"
    texto: "El silicio se dilata unas 3 ppm/°C y el FR4 unas 15. ¿Por qué el relleno inferior multiplica la vida en ciclado térmico?"
    libro: [45]
    widget:
      tipo: figura
      figura: fig-46.3
      zonas:
        - { id: termicos, rotulo: "Recuadro rojo", rect: [6, 5, 105, 111] }
    opciones:
      - texto: "Pega chip y placa: se deforman juntos y el esfuerzo se reparte"
        bien: true
        porque: "Sin él, toda la diferencia la absorben como cizalladura unas bolas diminutas."
      - texto: "Porque enfría el chip"
        porque: "Es una resina epoxi: no es un disipador, es un pegamento mecánico."
      - texto: "Porque iguala los coeficientes de dilatación"
        porque: "Silicio y FR4 siguen dilatándose distinto; lo que cambia es dónde se concentra el esfuerzo."
    escalera:
      - "¿Dónde se concentra el esfuerzo sin relleno?"
    solucion: "Chip y placa pegados se deforman juntos: el esfuerzo se reparte por toda el área."

  - id: toque-bigotes
    tipo: tocar
    titulo: "Bigotes de estaño"
    texto: "Los bigotes de estaño crecen del estaño puro. Toque la imagen donde han cortocircuitado un transistor."
    libro: [49, 72]
    widget:
      tipo: figura
      figura: fig-46.4
      zonas:
        - { id: microscopio, rotulo: "Imagen de la izquierda", rect: [0, 0, 820, 550] }
        - { id: capsula, rotulo: "Imagen de la derecha", rect: [860, 0, 740, 550] }
    tocar:
      bien: [capsula]
      porque:
        microscopio: "Es el microscopio electrónico: filamentos creciendo desde un recubrimiento, sin componente que cortocircuitar."
    exito: "Dentro de la cápsula de un OC171 los bigotes han crecido hasta cortocircuitarlo."
    escalera:
      - "Busque la cápsula redonda de un transistor."
    solucion: "La de la derecha: el interior de la cápsula del transistor."

  - id: toque-intermitente
    tipo: tocar
    titulo: "El modo más difícil"
    texto: "Un equipo falla cuando se calienta o vibra y vuelve a funcionar después. Toque la gráfica de ese modo."
    libro: [61, 62, 63]
    widget:
      tipo: figura
      figura: fig-46.3
      zonas:
        - { id: subito, rotulo: "Gráfica de abajo a la izquierda", rect: [6, 138, 143, 94] }
        - { id: deriva, rotulo: "Gráfica de abajo en el centro", rect: [154, 138, 143, 94] }
        - { id: intermitente, rotulo: "Gráfica de abajo a la derecha", rect: [302, 138, 144, 94] }
    tocar:
      bien: [intermitente]
      porque:
        subito: "El súbito deja de funcionar y no vuelve: suele ser eléctrico o mecánico."
        deriva: "En la deriva el parámetro se sale poco a poco y no vuelve: es envejecimiento."
    exito: "El intermitente: aparece y desaparece. Su causa suele ser mecánica, una soldadura agrietada o un contacto degradado."
    escalera:
      - "Busque la gráfica que cruza la tolerancia y vuelve."
    solucion: "La de la derecha: el fallo intermitente."

  - id: empareje-defensas
    tipo: pregunta
    titulo: "Cada mecanismo, su defensa"
    texto: "Cada mecanismo sugiere su defensa. Empareje."
    libro: [66]
    widget:
      tipo: figura
      figura: fig-46.3
      zonas:
        - { id: familias, rotulo: "Los cuatro recuadros", rect: [6, 5, 439, 111] }
    emparejar:
      - ["Térmicos", "Bajar la temperatura"]
      - ["Fatiga térmica", "Reducir los ciclos y aliviar tensiones mecánicas"]
      - ["Electroquímicos", "Conformal coating y control de humedad"]
      - ["Mecánicos", "Sujetar los componentes pesados"]
      - ["Eléctricos", "Protección y derating"]
    exito: "Bajar la temperatura ataca casi todos los térmicos a la vez."
    pistas:
      - { texto: "La humedad y los contaminantes son cosa de los electroquímicos." }
    escalera:
      - "La sujeción es contra la vibración; la protección, contra la sobretensión."
    solucion: "Térmicos, temperatura; fatiga, ciclos; electroquímicos, coating; mecánicos, sujeción; eléctricos, protección y derating."

  - id: pregunta-esd
    tipo: pregunta
    titulo: "Un daño que espera"
    texto: "Un integrado recibe una descarga electrostática, sigue funcionando y falla semanas después. ¿Qué ha pasado?"
    libro: [56]
    widget:
      tipo: figura
      figura: fig-46.3
      zonas:
        - { id: electricos, rotulo: "Recuadro morado", rect: [340, 5, 105, 111] }
    opciones:
      - texto: "Un daño parcial por la descarga"
        bien: true
        porque: "La descarga electrostática a veces daña sin destruir; el fallo llega después."
      - texto: "Latch-up: una estructura parásita se disparó"
        porque: "El latch-up cortocircuita la alimentación en el momento, hasta que se corta; no espera semanas."
      - texto: "Nada: si siguió funcionando, la descarga no le afectó"
        porque: "Justo lo engañoso de la descarga: el daño puede ser parcial y manifestarse más tarde."
    escalera:
      - "¿Qué mecanismo eléctrico puede dejar un daño a medias?"
    solucion: "Un daño parcial por descarga electrostática."

  - id: porque-temperatura
    tipo: porque
    titulo: "La palanca común"
    texto: "¿Por qué bajar la temperatura es la palanca de fiabilidad más eficaz?"
    libro: [41, 50, 67]
    widget:
      tipo: figura
      figura: fig-46.3
      zonas:
        - { id: familias, rotulo: "Los cuatro recuadros", rect: [6, 5, 439, 111] }
    opciones:
      - texto: "La temperatura aparece en casi todos los mecanismos"
        bien: true
        porque: "Electromigración, dieléctrico, corrosión, secado del electrolito: todos se aceleran con el calor."
      - texto: "Porque solo existen fallos térmicos"
        porque: "Hay cuatro familias; pero la temperatura pesa en casi todas, no solo en la térmica."
      - texto: "Porque el frío repara los componentes"
        porque: "No repara nada: frena los mecanismos que los degradan."
    escalera:
      - "Cuente en cuántas familias aparece la marca de °C."
    solucion: "La temperatura aparece en casi todos los mecanismos."

  - id: pregunta-electrolitico
    tipo: pregunta
    titulo: "Un electrolítico seco"
    texto: "Un electrolítico se ha secado al año de uso. ¿Qué conviene hacer?"
    libro: [50, 70]
    widget:
      tipo: figura
      figura: fig-46.3
      zonas:
        - { id: electroquimicos, rotulo: "Recuadro naranja", rect: [117, 5, 105, 111] }
    opciones:
      - texto: "Sustituirlo y averiguar por qué trabaja tan caliente"
        bien: true
        porque: "Al año no es vida agotada: trabaja demasiado caliente y el nuevo fallará igual."
      - texto: "Sustituirlo por uno igual, sin más"
        porque: "Solo aplaza el problema: la causa, el calor, sigue ahí."
      - texto: "Nada: es su vida útil agotada"
        porque: "Eso sería a los diez años; tras uno es que trabaja demasiado caliente."
    escalera:
      - "¿Qué diferencia hay entre secarse a los diez años y al año?"
    solucion: "Sustituirlo y corregir la causa: trabaja demasiado caliente."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [44, 63, 66, 67]
    ideas:
      - { titulo: "Cuatro familias.", texto: "Térmicos, electroquímicos, mecánicos y eléctricos." }
      - { titulo: "Fatiga térmica.", texto: "Domina en campo: encender y apagar agrieta las soldaduras." }
      - { titulo: "Tres modos.", texto: "Súbito, por deriva e intermitente, el más difícil." }
      - { titulo: "La temperatura.", texto: "Aparece en casi todos: bajarla es la palanca más eficaz." }
