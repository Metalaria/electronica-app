# Lección 1.2 de la sección 47.11 «Redundancia y Tolerancia a Fallos» (cap46; etiquetas sec-46.N = impresas 47.N).
# - Las tres arquitecturas y la votación de la figura 47.17 (fig-46.17) con zonas en los dibujos.
# - El votador 2 de 3 (bloque 367: «toma la salida que coincida en dos de los tres») vivo como circuito lógico: tres
#   AND de dos entradas y una OR de tres, la realización habitual de la mayoría (la figura lo dibuja como un bloque).
# - Sin modelo numérico.
# Paso práctico: «tabla» del votador y «tocar» en la figura 47.17 el elemento que queda en serie con todo.
leccion: cap46/sec-46.11

libro:
  359: "cómo se reparte el trabajo, quién detecta el fallo y quién decide"
  361: "Redundancia activa (paralelo): ambos elementos funcionan a la vez y comparten la carga."
  363: "Requiere detectar el fallo y conmutar, con el tiempo que eso lleve."
  364: "un elemento en reserva puede haberse averiado sin que nadie lo sepa"
  365: "n elementos hacen el trabajo y hay uno de más"
  367: "un votador toma la salida que coincida en dos de los tres"
  368: "tolera un fallo sin necesidad de detectarlo explícitamente"
  369: "ese votador está en serie con todo"
  372: "Dos elementos idénticos con el mismo defecto de diseño fallan igual y a la vez."
  374: "La misma alimentación: si cae, caen los dos."
  375: "La defensa es la redundancia diversa"
  378: "Un semáforo que se apaga o pone intermitente, un freno que se aplica al faltar presión"
  379: "Un avión en vuelo, un marcapasos."
  380: "Elegir la primera cuando sea posible es mucho más barato y mucho más fiable"
  384: "un fallo que no se detecta es peor que uno que se detecta, aunque sea menos probable"
  386: "La redundancia se valida provocando el fallo"
  387: "Un fallo parcial —un elemento que entrega datos incorrectos en lugar de callarse— es mucho más difícil de manejar que uno franco"
  "cap29#37": "las variables solo valen 0 o 1"
  388: "Las tres arquitecturas de redundancia (activa, pasiva y N+1), la votación 2 de 3 y el fallo de causa común que las anula."

modelo: { valores: {}, calculos: {} }

tarjetas:
  - id: explore-arquitecturas
    tipo: explorar
    titulo: "Duplicar no basta"
    texto: "Tres decisiones: cómo se reparte el trabajo, quién detecta el fallo y quién decide. Toque cada arquitectura."
    libro: [359, 388, 361, 363, 365, 367]
    widget:
      tipo: figura
      figura: fig-46.17
      zonas:
        - { id: activa, rotulo: "Primer recuadro", rect: [2, 25, 107, 122], texto: "Activa: los dos funcionan y comparten la carga. Sin conmutación, y cada uno debe poder con todo." }
        - { id: pasiva, rotulo: "Segundo recuadro", rect: [116, 25, 107, 122], texto: "Pasiva: uno trabaja y otro espera. Hay que detectar el fallo y conmutar; la reserva no se desgasta." }
        - { id: nmas1, rotulo: "Tercer recuadro", rect: [230, 25, 108, 122], texto: "N+1: n elementos hacen el trabajo y hay uno de más. Ventiladores, fuentes y discos." }
        - { id: tmr, rotulo: "Cuarto recuadro", rect: [345, 25, 107, 122], texto: "Votación: tres iguales y un votador que toma la salida que coincide en dos de los tres." }
    requiere: { mover: [activa, pasiva, tmr] }

  - id: prediga-reserva
    tipo: predecir
    titulo: "La reserva"
    texto: "En redundancia pasiva, la reserva lleva años esperando. ¿Qué riesgo tiene?"
    libro: [363, 364]
    widget:
      tipo: figura
      figura: fig-46.17
      zonas:
        - { id: pasiva, rotulo: "Segundo recuadro", rect: [116, 25, 107, 122] }
    opciones:
      - texto: "Puede estar averiada sin que nadie lo sepa"
        bien: true
        porque: "Se descubre justo cuando hace falta: por eso los sistemas serios prueban la reserva periódicamente."
      - texto: "Se desgasta tanto como la principal"
        porque: "Al contrario: el elemento de reserva no se desgasta; ese es su punto a favor."
      - texto: "Ninguno: entrará al fallar la principal"
        porque: "Solo si la reserva funciona y el conmutador detecta el fallo."
    escalera:
      - "¿Quién comprueba la reserva mientras no se usa?"
    solucion: "Puede haberse averiado sin que nadie lo sepa."

  - id: explore-votador
    tipo: explorar
    titulo: "Dos de tres"
    texto: "Tres módulos hacen lo mismo y el votador toma la salida que coincide en dos. Cambie las salidas de los módulos."
    libro: [367, 368]
    widget:
      tipo: logica
      entradas: [A, B, C]
      piezas:
        - { id: y1, tipo: and, entradas: [A, B] }
        - { id: y2, tipo: and, entradas: [A, C] }
        - { id: y3, tipo: and, entradas: [B, C] }
        - { id: o1, tipo: or, entradas: [y1, y2, y3] }
      salidas:
        - { id: Y, de: o1 }
    requiere: { mover: [A, B, C] }

  - id: prediga-fallo
    tipo: predecir
    titulo: "Un módulo averiado"
    texto: "Los módulos A y C dan 0, el resultado bueno; el B, averiado, da 1. ¿Qué entrega el votador?"
    libro: [368, "cap29#37"]
    widget:
      tipo: logica
      entradas: [{ id: A, valor: 0 }, { id: B, valor: 1 }, { id: C, valor: 0 }]
      piezas:
        - { id: y1, tipo: and, entradas: [A, B] }
        - { id: y2, tipo: and, entradas: [A, C] }
        - { id: y3, tipo: and, entradas: [B, C] }
        - { id: o1, tipo: or, entradas: [y1, y2, y3] }
      salidas:
        - { id: Y, de: o1 }
      ocultar: true
    opciones:
      - texto: "0, el de la mayoría"
        bien: true
        porque: "El averiado queda en minoría y su salida se descarta, sin diagnóstico ni conmutación."
      - texto: "1: el votador sigue al que cambia"
        porque: "No sigue a ninguno en concreto: toma la salida en la que coinciden dos de los tres."
      - texto: "Nada: el sistema se detiene"
        porque: "No hace falta detenerse: la votación tolera un fallo sin detectarlo."
    escalera:
      - "¿Cuántos módulos dicen 0?"
    solucion: "0: dos de los tres dicen 0."

  - id: tabla-votador
    tipo: tabla
    titulo: "La tabla del votador"
    texto: "Rellene la salida del votador 2 de 3 para cada combinación de los tres módulos."
    libro: [367, "cap29#37"]
    widget:
      tipo: logica
      entradas: [A, B, C]
      piezas:
        - { id: y1, tipo: and, entradas: [A, B] }
        - { id: y2, tipo: and, entradas: [A, C] }
        - { id: y3, tipo: and, entradas: [B, C] }
        - { id: o1, tipo: or, entradas: [y1, y2, y3] }
      salidas:
        - { id: Y, de: o1 }
      ocultar: true
    tabla:
      salidas: [Y]
    exito: "Vale 1 cuando al menos dos de los tres dicen 1: la mayoría."
    escalera:
      - "Cuente los unos de cada fila."
      - "Con dos o tres unos, la salida es 1."
    solucion: "Y = 1 en las cuatro filas con dos o tres unos; 0 en las demás."

  - id: toque-votador
    tipo: tocar
    titulo: "Lo que queda en serie"
    texto: "La votación triplica el hardware, pero hay un elemento que queda en serie con todo. Tóquelo."
    libro: [369]
    widget:
      tipo: figura
      figura: fig-46.17
      zonas:
        - { id: modulos, rotulo: "Tres bloques apilados, a la derecha", rect: [355, 52, 36, 46] }
        - { id: votador, rotulo: "Bloque rojo, a la derecha", rect: [393, 55, 40, 40] }
        - { id: conmutador, rotulo: "Bloque naranja del segundo dibujo", rect: [168, 57, 36, 36] }
        - { id: reserva, rotulo: "Bloque punteado del segundo dibujo", rect: [128, 70, 36, 35] }
    tocar:
      bien: [votador]
      porque:
        modulos: "Están triplicados: si uno falla, los otros dos lo tapan."
        conmutador: "Es el de la redundancia pasiva, no el de la votación."
        reserva: "Es la reserva de la redundancia pasiva."
    exito: "El votador: está en serie con todo, así que debe ser muy simple y muy fiable."
    escalera:
      - "¿Por qué elemento pasan las tres salidas?"
    solucion: "El votador, el bloque «2 de 3»."

  - id: prediga-causa-comun
    tipo: predecir
    titulo: "Dos copias idénticas"
    texto: "Dos unidades redundantes ejecutan el mismo programa, que tiene un error. ¿Qué protección da la redundancia?"
    libro: [372, 374]
    widget:
      tipo: figura
      figura: fig-46.17
      zonas:
        - { id: comun, rotulo: "Recuadro rojo de abajo", rect: [2, 152, 450, 84] }
    opciones:
      - texto: "Ninguna: fallan igual y a la vez"
        bien: true
        porque: "Fallo de causa común: la misma alimentación, el mismo lote o el mismo error las tumban juntas."
      - texto: "Total: si una falla, la otra sigue"
        porque: "Solo frente a fallos independientes; con el mismo error, la otra falla igual."
      - texto: "La mitad: falla una de cada dos veces"
        porque: "No es cuestión de azar: el mismo error con los mismos datos da el mismo fallo."
    escalera:
      - "¿Qué tienen en común las dos copias?"
    solucion: "Ninguna: un fallo de causa común."

  - id: pregunta-diversa
    tipo: pregunta
    titulo: "La defensa"
    texto: "¿Qué protege de verdad frente al fallo de causa común en un sistema crítico?"
    libro: [375]
    widget:
      tipo: figura
      figura: fig-46.17
      zonas:
        - { id: comun, rotulo: "Recuadro rojo de abajo", rect: [2, 152, 450, 84] }
    opciones:
      - texto: "Redundancia diversa: implementaciones, fabricantes y alimentaciones distintos"
        bien: true
        porque: "Cuesta más, y es lo único que protege de verdad en sistemas críticos."
      - texto: "Añadir una tercera copia idéntica"
        porque: "Tres copias con el mismo defecto fallan igual que dos."
      - texto: "Componentes de mejor calidad"
        porque: "Un error de diseño o de software no se arregla con mejores componentes."
    escalera:
      - "Si el problema es lo que comparten, ¿qué hay que cambiar?"
    solucion: "La redundancia diversa."

  - id: empareje-filosofias
    tipo: pregunta
    titulo: "Fallo seguro o fallo operativo"
    texto: "Empareje cada sistema con lo que debe hacer cuando algo falla."
    libro: [378, 379, 380]
    widget:
      tipo: figura
      figura: fig-46.17
      zonas:
        - { id: comun, rotulo: "Recuadro rojo de abajo", rect: [2, 152, 450, 84] }
    emparejar:
      - ["Un semáforo", "Pasar a intermitente: fallo seguro"]
      - ["Un avión en vuelo", "Seguir funcionando: fallo operativo"]
      - ["Un freno sin presión", "Aplicarse: fallo seguro"]
    exito: "Elegir el fallo seguro cuando sea posible es mucho más barato y más fiable."
    pistas:
      - { texto: "Un avión en vuelo no tiene un estado seguro al que pararse." }
    escalera:
      - "¿Cuál no puede simplemente detenerse?"
    solucion: "Semáforo y freno, fallo seguro; el avión, fallo operativo."

  - id: porque-silencioso
    tipo: porque
    titulo: "El hallazgo del FMEA"
    texto: "¿Por qué un fallo que no se detecta es peor que uno que se detecta, aunque sea menos probable?"
    libro: [384]
    widget:
      tipo: figura
      figura: fig-46.17
      zonas:
        - { id: tmr, rotulo: "Cuarto recuadro", rect: [345, 25, 107, 122] }
    opciones:
      - texto: "El sistema parece funcionar mientras entrega resultados incorrectos"
        bien: true
        porque: "Nadie reacciona porque nadie se entera: la detección debe atacar esos fallos."
      - texto: "Porque los no detectados son más frecuentes"
        porque: "La frase dice «aunque sea menos probable»: el problema no es la frecuencia."
      - texto: "Porque se reparan más deprisa"
        porque: "Al contrario: ni siquiera se sabe que hay que repararlos."
    escalera:
      - "¿Qué hace el sistema mientras nadie sabe que ha fallado?"
    solucion: "Sigue funcionando aparentemente bien y entrega resultados incorrectos."

  - id: pregunta-banco
    tipo: pregunta
    titulo: "En el banco"
    texto: "Se valida la redundancia desconectando un elemento, y el sistema continúa. ¿Qué falta por probar?"
    libro: [386, 387]
    widget:
      tipo: figura
      figura: fig-46.17
      zonas:
        - { id: activa, rotulo: "Primer recuadro", rect: [2, 25, 107, 122] }
    opciones:
      - texto: "Un fallo parcial: un elemento que entrega datos incorrectos"
        bien: true
        porque: "Es mucho más difícil de manejar que uno franco, y suele ser revelador."
      - texto: "Nada: la desconexión ya lo demuestra"
        porque: "Solo demuestra la desconexión limpia; hay que probar cada modo de fallo previsto."
      - texto: "Desconectar los dos a la vez"
        porque: "Sin ninguno no hay redundancia que validar; falta el fallo que no se calla."
    escalera:
      - "¿Es lo mismo un elemento que se calla que uno que miente?"
    solucion: "El fallo parcial, el elemento que entrega datos incorrectos."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [364, 368, 372, 380]
    ideas:
      - { titulo: "Tres arquitecturas.", texto: "Activa, pasiva y N+1; la reserva puede fallar sin que se sepa." }
      - { titulo: "Votar.", texto: "Dos de tres tolera un fallo sin detectarlo; el votador queda en serie." }
      - { titulo: "Causa común.", texto: "Copias idénticas fallan juntas: redundancia diversa." }
      - { titulo: "Fallo seguro.", texto: "Si basta, es más barato y más fiable que duplicar." }
