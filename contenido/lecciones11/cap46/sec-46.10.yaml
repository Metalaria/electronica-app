# Lección 1.2 de la sección 47.10 «Errores en el Propio Silicio: la Errata» (cap46; etiquetas sec-46.N = impresas 47.N).
# - Los cinco modos de fallo de un componente y el contenido de una errata (figura 47.16, fig-46.16), con zonas en los
#   recuadros (no en las referencias de sección dibujadas, que pueden cambiar).
# - Sin modelo numérico.
# Paso práctico: «tocar» en la figura 47.16 el modo de fallo de un caso (el lote mal formulado).
leccion: cap46/sec-46.10

libro:
  325: "el componente funciona exactamente como fue diseñado, y el diseño está mal"
  326: "cualquier integrado complejo se entrega con una lista de errores conocidos"
  329: "La descripción: qué ocurre y en qué condiciones exactas."
  330: "El impacto: qué revisiones del chip están afectadas, identificadas por un código en el propio encapsulado."
  331: "La solución alternativa: cómo evitarlo desde el firmware o desde el circuito, si es que se puede."
  332: "Antes de pasar días persiguiéndolo, veinte minutos de errata."
  334: "corregir un error de silicio significa máscaras nuevas y un ciclo completo de fabricación"
  337: "El error de división de un procesador de 1994."
  338: "en un componente que ejecuta operaciones sin parar, «poco probable» ocurre"
  341: "un error de silicio no se puede parchear, solo rodear"
  345: "las erratas son específicas de revisión y un lote nuevo puede comportarse distinto"
  346: "Si algo funciona pero la hoja no lo garantiza, puede dejar de funcionar en la siguiente revisión."
  347: "las soluciones que la biblioteca aplicaba en silencio hay que aplicarlas uno mismo"
  350: "por defecto de fabricación de un lote"
  351: "El quinto solo se combate leyendo, y por eso es el único que no cuesta dinero evitar."
  355: "ese comentario evitará que alguien —probablemente uno mismo— borre una línea que parece innecesaria"
  356: "Los cinco modos de fallo de un componente y el contenido de una errata."

modelo: { valores: {}, calculos: {} }

tarjetas:
  - id: explore-modos
    tipo: explorar
    titulo: "Cinco formas de fallar"
    texto: "Un componente puede fallar de cinco maneras. Toque cada una y lea cómo se combate."
    libro: [350, 351, 356, 325]
    widget:
      tipo: figura
      figura: fig-46.16
      zonas:
        - { id: desgaste, rotulo: "Primer recuadro de arriba", rect: [2, 2, 85, 101], texto: "Desgaste: electromigración, fatiga, secado del electrolito. Se combate con la temperatura." }
        - { id: abuso, rotulo: "Segundo recuadro de arriba", rect: [93, 2, 86, 101], texto: "Abuso: fuera de los límites de la hoja. Se combate con derating." }
        - { id: lote, rotulo: "Tercer recuadro de arriba", rect: [184, 2, 86, 101], texto: "Defecto de lote: una serie con un proceso incorrecto. Se combate con trazabilidad." }
        - { id: falso, rotulo: "Cuarto recuadro de arriba", rect: [276, 2, 86, 101], texto: "Falsificación: no es lo que dice ser. Se combate con el canal de compra." }
        - { id: diseno, rotulo: "Recuadro verde de arriba", rect: [367, 2, 86, 101], texto: "Diseño: funciona como se diseñó y el diseño está mal. Solo se combate leyendo la errata." }
    requiere: { mover: [desgaste, diseno] }

  - id: toque-lote
    tipo: tocar
    titulo: "¿Qué modo es?"
    texto: "Miles de condensadores de una serie fallan porque su electrolito se formuló mal. Toque el modo de fallo."
    libro: [350, 356]
    widget:
      tipo: figura
      figura: fig-46.16
      zonas:
        - { id: desgaste, rotulo: "Primer recuadro de arriba", rect: [2, 2, 85, 101] }
        - { id: abuso, rotulo: "Segundo recuadro de arriba", rect: [93, 2, 86, 101] }
        - { id: lote, rotulo: "Tercer recuadro de arriba", rect: [184, 2, 86, 101] }
        - { id: falso, rotulo: "Cuarto recuadro de arriba", rect: [276, 2, 86, 101] }
        - { id: diseno, rotulo: "Quinto recuadro de arriba", rect: [367, 2, 86, 101] }
    tocar:
      bien: [lote]
      porque:
        desgaste: "Secarse acaba haciéndolo cualquier electrolítico; aquí la causa es un proceso incorrecto en una serie."
        abuso: "No trabajaban fuera de sus límites: fallaban dentro de ellos."
        falso: "Eran lo que decían ser; el problema era el proceso de esa serie."
        diseno: "No es un error de diseño del componente, sino de fabricación de un lote."
    exito: "Un defecto de lote: se combate con trazabilidad, para acotar qué unidades lo llevan."
    escalera:
      - "¿Afecta a todos los condensadores de ese tipo o a una serie concreta?"
    solucion: "El tercero: defecto de fabricación de un lote."

  - id: empareje-errata
    tipo: pregunta
    titulo: "Qué trae una errata"
    texto: "Para cada fallo conocido, la errata da tres cosas. Empareje."
    libro: [329, 330, 331]
    widget:
      tipo: figura
      figura: fig-46.16
      zonas:
        - { id: errata, rotulo: "Recuadro naranja de abajo", rect: [2, 124, 451, 98] }
    emparejar:
      - ["Descripción", "Qué ocurre y en qué condiciones exactas"]
      - ["Impacto", "Qué revisiones del chip están afectadas"]
      - ["Solución alternativa", "Cómo evitarlo desde el firmware o el circuito"]
    exito: "Las revisiones se identifican por un código en el propio encapsulado."
    pistas:
      - { texto: "El impacto dice a qué chips afecta; la solución, cómo rodearlo." }
    escalera:
      - "¿Cuál de las tres le dice si su chip está afectado?"
    solucion: "Descripción, qué y cuándo; impacto, revisiones; solución, cómo rodearlo."

  - id: prediga-periferico
    tipo: predecir
    titulo: "Un periférico que no responde"
    texto: "Un periférico del microcontrolador no responde en una secuencia concreta y el programa parece correcto. ¿Qué hacer primero?"
    libro: [326, 332]
    widget:
      tipo: figura
      figura: fig-46.16
      zonas:
        - { id: diseno, rotulo: "Recuadro verde de arriba", rect: [367, 2, 86, 101] }
    opciones:
      - texto: "Leer la errata del chip"
        bien: true
        porque: "Muchos comportamientos inexplicables están documentados: veinte minutos antes de días persiguiéndolo."
      - texto: "Cambiar el microcontrolador por otro igual"
        porque: "Uno de la misma revisión tiene el mismo error de silicio."
      - texto: "Reescribir el programa desde cero"
        porque: "Si es un error del silicio, el programa nuevo tropezará igual; hay que conocer la solución alternativa."
    escalera:
      - "¿Qué documento publica los fallos conocidos del silicio?"
    solucion: "Leer la errata: veinte minutos antes que días."

  - id: porque-no-corrige
    tipo: porque
    titulo: "Por qué no se corrigen todos"
    texto: "¿Por qué el fabricante no corrige todos los errores de silicio conocidos?"
    libro: [334]
    widget:
      tipo: figura
      figura: fig-46.16
      zonas:
        - { id: errata, rotulo: "Recuadro naranja de abajo", rect: [2, 124, 451, 98] }
    opciones:
      - texto: "Exige máscaras nuevas y un ciclo completo de fabricación"
        bien: true
        porque: "Es caro y tarda meses: solo se hace si es grave o toca revisión por otros motivos."
      - texto: "Porque no se pueden corregir nunca"
        porque: "Se pueden, con una revisión del chip; lo que no se puede es parchear el que ya tiene."
      - texto: "Porque no son errores, sino funciones"
        porque: "Son fallos reconocidos: por eso los publica, con su solución alternativa."
    escalera:
      - "¿Qué hace falta para cambiar el silicio?"
    solucion: "Máscaras nuevas y un ciclo completo de fabricación: caro y lento."

  - id: pregunta-division
    tipo: pregunta
    titulo: "Poco probable"
    texto: "En el error de división de 1994 se argumentó que encontrarlo era muy improbable. ¿Por qué el razonamiento fue ruinoso?"
    libro: [337, 338]
    widget:
      tipo: figura
      figura: fig-46.16
      zonas:
        - { id: diseno, rotulo: "Recuadro verde de arriba", rect: [367, 2, 86, 101] }
    opciones:
      - texto: "Un chip que opera sin parar acaba encontrando lo «poco probable»"
        bien: true
        porque: "Estadísticamente defendible y comercialmente ruinoso: acabó sustituyendo las unidades afectadas."
      - texto: "Porque el error era frecuente"
        porque: "Afectaba a operaciones poco frecuentes; el problema es cuántas operaciones hace un procesador."
      - texto: "Porque se podía parchear y no se hizo"
        porque: "Un error de silicio no se parchea, solo se rodea."
    escalera:
      - "¿Cuántas operaciones ejecuta un procesador en un día?"
    solucion: "Con operaciones sin parar, «poco probable» ocurre."

  - id: pregunta-registros
    tipo: pregunta
    titulo: "Trabajar con registros"
    texto: "Se sustituye la biblioteca del fabricante por código propio que escribe directamente en los registros. ¿Qué hay que vigilar?"
    libro: [345, 346, 347]
    widget:
      tipo: figura
      figura: fig-46.16
      zonas:
        - { id: hacer, rotulo: "Mitad derecha del recuadro de abajo", rect: [227, 124, 226, 98] }
    opciones:
      - texto: "Aplicar uno mismo las soluciones que la biblioteca aplicaba en silencio"
        bien: true
        porque: "A veces el fabricante incorpora la solución alternativa a su biblioteca y el usuario ni se entera."
      - texto: "Nada: los registros no tienen errata"
        porque: "La errata es del silicio, se acceda por la biblioteca o por los registros."
      - texto: "Confiar en lo que funcione, aunque la hoja no lo garantice"
        porque: "Justo lo contrario: lo no documentado puede dejar de funcionar en la siguiente revisión."
    escalera:
      - "¿Qué hacía la biblioteca sin decírselo?"
    solucion: "Aplicar uno mismo las soluciones alternativas."

  - id: pregunta-comentario
    tipo: pregunta
    titulo: "En el banco"
    texto: "Junto a la solución alternativa en el código, ¿por qué anotar la referencia del elemento de la errata?"
    libro: [341, 355]
    widget:
      tipo: figura
      figura: fig-46.16
      zonas:
        - { id: hacer, rotulo: "Mitad derecha del recuadro de abajo", rect: [227, 124, 226, 98] }
    opciones:
      - texto: "Para que nadie borre una línea que parece innecesaria"
        bien: true
        porque: "Dentro de dos años, probablemente uno mismo no recordará por qué estaba ahí."
      - texto: "Porque lo exige el compilador"
        porque: "El compilador no lo pide; lo pide quien mantenga el código después."
      - texto: "Para que el chip aplique la corrección"
        porque: "El comentario no cambia el silicio: el error no se parchea, solo se rodea."
    escalera:
      - "¿Quién leerá ese código dentro de dos años?"
    solucion: "Evita que alguien borre una línea que parece innecesaria."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [325, 332, 341, 351]
    ideas:
      - { titulo: "Errores de diseño.", texto: "El chip hace lo que se diseñó, y el diseño está mal." }
      - { titulo: "La errata.", texto: "Descripción, revisiones afectadas y solución alternativa." }
      - { titulo: "Solo rodear.", texto: "Un error de silicio no se puede parchear." }
      - { titulo: "Gratis.", texto: "Es el único modo de fallo que se evita leyendo." }
