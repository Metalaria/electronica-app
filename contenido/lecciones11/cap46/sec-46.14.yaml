# Lección 1.2 de la sección 47.14 «El FMEA en Detalle: Procedimiento y Prioridad» (cap46; etiquetas sec-46.N = impresas 47.N).
# - La tabla del ejemplo de la fuente del capítulo 51 (figura 47.23, fig-46.23; bloque 499) con zonas en sus filas.
# - RPN = G × O × D (bloque 493) vivo: 9 × 3 × 7 = 189; con la protección independiente, D de 7 a 2 y 54 (bloque 501);
#   el ventilador, G de 7 a 3 (bloque 502): 72. G = 10, O = 1, D = 1 y G = 1, O = 10, D = 1 dan los dos 10 (bloque 496).
# Paso práctico: «tocar» en la tabla de la figura 47.23 el modo que se aborda primero.
leccion: cap46/sec-46.14

libro:
  481: "1. Delimitar el alcance."
  482: "2. Descomponer en elementos"
  483: "No «falla», sino cómo falla"
  484: "anotar su efecto local y su efecto en el sistema"
  485: "5. Puntuar tres cosas de 1 a 10."
  486: "6. Calcular el índice de riesgo y ordenar."
  487: "7. Definir acciones para los mayores, y volver a puntuar con la acción aplicada."
  490: "1 es imperceptible, 10 es daño a personas o incumplimiento normativo"
  492: "10 significa que no se detecta, no que se detecta siempre"
  493: '"RPN" = G times O times D'
  494: "su uso correcto es ordenar, no comparar contra un umbral"
  496: "G=10, O=1, D=1 da 10; G=1, O=10, D=1 también da 10"
  497: "Un fallo de gravedad 9 o 10 se aborda aunque su RPN sea bajo."
  499: "Transistor de paso Cortocircuito C-E"
  500: "un transistor de paso en cortocircuito pone 38 V en una salida ajustada a 3,3 V"
  501: "baja D de 7 a 2 y el RPN a 54"
  502: "un sensor de temperatura que reduzca la potencia, que baja G de 7 a 3"
  506: "Efectos en cascada: un fallo que provoca otro."
  509: "Un FMEA hecho tras congelar el diseño solo sirve para documentar riesgos que ya no se pueden evitar."
  510: "En equipo, con alguien que no haya diseñado el circuito"
  514: "«¿Qué pasa si este se abre?» y «¿qué pasa si se cortocircuita?»."
  516: "Ejemplo de FMEA de la fuente del capítulo 51 con sus puntuaciones."

modelo:
  valores:
    G: { sim: "G", nombre: "gravedad", unidad: "", valor: 9 }
    O: { sim: "O", nombre: "ocurrencia", unidad: "", valor: 3 }
    D: { sim: "D", nombre: "detección (10 = no se detecta)", unidad: "", valor: 7 }
  calculos:
    RPN: { expr: "G*O*D", sim: "RPN", nombre: "índice de riesgo", unidad: "", cifras: 4 }

tarjetas:
  - id: explore-tabla
    tipo: explorar
    titulo: "El FMEA de una fuente"
    texto: "Para cada elemento: cómo falla, qué efecto tiene y tres puntuaciones. Toque cada fila."
    libro: [499, 516, 500]
    widget:
      tipo: figura
      figura: fig-46.23
      zonas:
        - { id: transistor, rotulo: "Primera fila", rect: [5, 27, 440, 35], texto: "Transistor de paso en cortocircuito: 38 V en una salida de 3,3 V. Destruye lo conectado." }
        - { id: ventilador, rotulo: "Segunda fila", rect: [5, 63, 440, 35], texto: "Ventilador bloqueado: sobrecalentamiento." }
        - { id: sensor, rotulo: "Tercera fila", rect: [5, 99, 440, 35], texto: "Sensor de corriente con deriva: límite incorrecto." }
        - { id: condensador, rotulo: "Cuarta fila", rect: [5, 135, 440, 35], texto: "Condensador de filtro con ESR alta: rizado excesivo." }
    requiere: { mover: [transistor, ventilador] }

  - id: formula-rpn
    tipo: formula
    titulo: "El índice de riesgo"
    texto: "Gravedad por ocurrencia por detección, cada una de 1 a 10. Mueva las tres."
    libro: [485, 493, 490]
    ec: 493
    sustitucion: "{{G}} × {{O}} × {{D}} = {{RPN}}"
    widget:
      tipo: grafica
      x: { id: dd, min: 1, max: 10, unidad: "", rotulo: "D" }
      y: { min: 0, max: 1000, unidad: "", rotulo: "RPN" }
      curvas:
        - { expr: "G*O*dd", color: azul, rotulo: "RPN frente a D" }
      marcas:
        - { x: "D", y: "RPN", rotulo: "{{RPN}}" }
      lectura: { valor: RPN, rotulo: "RPN" }
      mandos:
        - { valor: G, min: 1, max: 10, paso: 1, rotulo: "Gravedad, G" }
        - { valor: O, min: 1, max: 10, paso: 1, rotulo: "Ocurrencia, O" }
        - { valor: D, min: 1, max: 10, paso: 1, rotulo: "Detección, D" }

  - id: prediga-d
    tipo: predecir
    titulo: "La puntuación invertida"
    texto: "Un modo de fallo tiene D = 10. ¿Qué significa?"
    libro: [492]
    widget:
      tipo: figura
      figura: fig-46.23
      zonas:
        - { id: pie, rotulo: "Recuadro rojo de abajo", rect: [5, 175, 440, 45] }
    opciones:
      - texto: "Que no se detecta antes de llegar al usuario"
        bien: true
        porque: "D mide la probabilidad de NO detectarlo: 10 es lo peor."
      - texto: "Que se detecta siempre"
        porque: "Es la inversión que se equivoca a menudo: 10 significa que no se detecta."
      - texto: "Que es muy grave"
        porque: "La gravedad es G; D es la detección."
    escalera:
      - "¿Qué mide D: detectarlo o no detectarlo?"
    solucion: "No se detecta: 10 es el peor caso de detección."

  - id: estime-accion
    tipo: pregunta
    titulo: "La acción correctora"
    texto: "Transistor de paso: G = 9, O = 3, D = 7. Una protección de sobretensión independiente baja D de 7 a 2: ¿qué RPN queda?"
    libro: [499, 501]
    fijar: { G: 9, O: 3, D: 2 }
    widget:
      tipo: figura
      figura: fig-46.23
      zonas:
        - { id: transistor, rotulo: "Primera fila", rect: [5, 27, 440, 35] }
    estimar:
      objetivo: "RPN"
      unidad: ""
      min: 0
      max: 300
      paso: 1
      inicio: 189
      tol: 0.03
      rotulo: "RPN con la protección"
    exito: "54: el séptimo paso convierte el FMEA en trabajo."
    pistas:
      - { cuando: { valor: estimacion, mayor: 56 }, texto: "Demasiado: con D = 2 el producto es 9 × 3 × 2." }
      - { texto: "Demasiado poco: 9 × 3 × 2." }
    escalera:
      - "Solo cambia D; G y O siguen igual."
    solucion: "9 × 3 × 2 = 54."
    comprobar:
      - { RPN: 189, con: { D: 7 } }
      - { RPN: 54 }

  - id: toque-primero
    tipo: tocar
    titulo: "Lo que se aborda primero"
    texto: "La práctica moderna prioriza por gravedad. Toque la fila que se aborda primero."
    libro: [497, 499]
    widget:
      tipo: figura
      figura: fig-46.23
      zonas:
        - { id: transistor, rotulo: "Primera fila", rect: [5, 27, 440, 35] }
        - { id: ventilador, rotulo: "Segunda fila", rect: [5, 63, 440, 35] }
        - { id: sensor, rotulo: "Tercera fila", rect: [5, 99, 440, 35] }
        - { id: condensador, rotulo: "Cuarta fila", rect: [5, 135, 440, 35] }
    tocar:
      bien: [transistor]
      porque:
        ventilador: "Gravedad 7: va después del transistor, con gravedad 9."
        sensor: "Su detección es la peor de la tabla, pero su gravedad es 5."
        condensador: "Gravedad 4 y el menor RPN de la tabla."
    exito: "El transistor de paso, por su gravedad 9: pone toda la entrada en la salida y destruye lo conectado."
    escalera:
      - "Mire la columna G, no la del RPN."
    solucion: "La primera fila: gravedad 9."

  - id: prediga-trampa
    tipo: predecir
    titulo: "La trampa del número"
    texto: "Un fallo catastrófico raro y detectable (G = 10, O = 1, D = 1) y una molestia frecuente (G = 1, O = 10, D = 1). ¿Cómo se comparan?"
    libro: [494, 496, 497]
    fijar: { G: 10, O: 1, D: 1 }
    widget:
      tipo: figura
      figura: fig-46.23
      zonas:
        - { id: pie, rotulo: "Recuadro rojo de abajo", rect: [5, 175, 440, 45] }
    opciones:
      - texto: "Mismo RPN, 10, pero no son equivalentes"
        bien: true
        porque: "Por eso se prioriza primero por gravedad: el catastrófico se aborda aunque su RPN sea bajo."
      - texto: "El frecuente es peor: ocurre más"
        porque: "Una molestia frecuente no es un daño a personas; la gravedad manda."
      - texto: "Son equivalentes: tienen el mismo RPN"
        porque: "Esa es justo la crítica al RPN: trata como iguales situaciones que no lo son."
    escalera:
      - "Calcule los dos productos y compare las gravedades."
    solucion: "Los dos dan 10; el catastrófico va primero por su gravedad."
    comprobar:
      - { RPN: 10 }
      - { con: { G: 1, O: 10 }, RPN: 10 }

  - id: empareje-acciones
    tipo: pregunta
    titulo: "Volver a puntuar"
    texto: "Cada acción correctora baja una puntuación distinta. Empareje."
    libro: [501, 502]
    widget:
      tipo: figura
      figura: fig-46.23
      zonas:
        - { id: filas, rotulo: "Las dos primeras filas", rect: [5, 27, 440, 71] }
    emparejar:
      - ["Protección de sobretensión independiente del lazo", "Baja D de 7 a 2"]
      - ["Sensor de temperatura que reduce la potencia", "Baja G de 7 a 3"]
    exito: "Detectar antes baja D; limitar las consecuencias baja G."
    pistas:
      - { texto: "La protección hace que el fallo no pase desapercibido; el sensor, que sea menos grave." }
    escalera:
      - "¿Cuál cambia lo que ocurre, y cuál si se nota?"
    solucion: "La protección baja D; el sensor de temperatura baja G."

  - id: ordene-procedimiento
    tipo: pregunta
    titulo: "El procedimiento"
    texto: "Ordene los siete pasos de un FMEA."
    libro: [481, 482, 483, 484, 485, 486, 487]
    ordenar:
      - "Delimitar el alcance"
      - "Descomponer en elementos"
      - "Enumerar los modos de fallo de cada uno"
      - "Anotar el efecto local y en el sistema"
      - "Puntuar G, O y D de 1 a 10"
      - "Calcular el RPN y ordenar"
      - "Definir acciones y volver a puntuar"
    exito: "Sin el séptimo, el FMEA describe el problema y no lo resuelve."
    pistas:
      - { texto: "Antes de puntuar hay que saber cómo falla cada elemento y qué efecto tiene." }
    escalera:
      - "Empieza por el alcance y acaba por las acciones."
    solucion: "Alcance, elementos, modos, efectos, puntuar, RPN y acciones."

  - id: porque-pronto
    tipo: porque
    titulo: "Cuándo hacerlo"
    texto: "¿Por qué el FMEA se hace pronto y con alguien que no haya diseñado el circuito?"
    libro: [509, 510]
    widget:
      tipo: figura
      figura: fig-46.23
      zonas:
        - { id: tabla, rotulo: "La tabla", rect: [5, 5, 440, 165] }
    opciones:
      - texto: "Pronto, para poder cambiar la arquitectura; con otro, contra la ceguera del autor"
        bien: true
        porque: "Tras congelar el diseño solo documenta riesgos que ya no se pueden evitar."
      - texto: "Porque al final ya no hay tiempo de escribirlo"
        porque: "El problema no es escribirlo: es que tarde ya no se puede cambiar nada."
      - texto: "Porque el autor del circuito no sabe puntuar"
        porque: "Sabe puntuar; lo que le cuesta es preguntar lo obvio sobre su propio diseño."
    escalera:
      - "¿Qué se puede cambiar todavía al principio y ya no al final?"
    solucion: "Pronto, cuando aún se puede cambiar la arquitectura, y con alguien ajeno al diseño."

  - id: pregunta-banco
    tipo: pregunta
    titulo: "En el banco"
    texto: "La versión abreviada del FMEA recorre el esquema componente a componente con solo dos preguntas. ¿Cuáles?"
    libro: [506, 514]
    widget:
      tipo: figura
      figura: fig-46.23
      zonas:
        - { id: transistor, rotulo: "Primera fila", rect: [5, 27, 440, 35] }
    opciones:
      - texto: "¿Qué pasa si se abre? ¿Y si se cortocircuita?"
        bien: true
        porque: "Sin tablas: las respuestas incómodas son las que hay que corregir."
      - texto: "¿Cuánto cuesta? ¿Hay segunda fuente?"
        porque: "Eso es obsolescencia y coste; el FMEA pregunta qué pasa si falla."
      - texto: "¿Cuál es su MTBF? ¿Y su temperatura?"
        porque: "El FMEA no parte de cifras de MTBF, sino de cómo falla cada pieza."
    escalera:
      - "Un componente suele fallar de dos maneras francas."
    solucion: "«¿Qué pasa si este se abre?» y «¿qué pasa si se cortocircuita?»."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [487, 493, 494, 497, 514]
    ideas:
      - { titulo: "RPN = G × O × D.", texto: "Para ordenar, no para comparar con un umbral." }
      - { titulo: "D invertida.", texto: "10 significa que no se detecta." }
      - { titulo: "Primero la gravedad.", texto: "Un fallo de gravedad 9 o 10 se aborda aunque su RPN sea bajo." }
      - { titulo: "Actuar.", texto: "Definir acciones y volver a puntuar: el transistor baja a 54." }
