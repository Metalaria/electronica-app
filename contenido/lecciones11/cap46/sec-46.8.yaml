# Lección 1.2 de la sección 47.8 «Normas, Trazabilidad y Obsolescencia» (cap46; etiquetas sec-46.N = impresas 47.N).
# - Los tres recuadros y las defensas de la figura 47.13 (fig-46.13) con zonas.
# - Sin modelo numérico: la sección es de criterios.
# Sin paso práctico: la sección da criterios; el banco (repasar la lista de materiales) va como pregunta.
# 1.2.1 (autor121-pc, «aprender haciendo», GUIA §13): sección de normas y procesos; cada caso se resuelve tocando en
# la figura 47.13 la familia de normas, por qué no se dejan para el final, la trazabilidad, la defensa contra la
# obsolescencia que corresponde (segunda fuente, aislar en un módulo, compra de última oportunidad) y los avisos PCN.
# Queda una pregunta de opciones (el banco).
leccion: cap46/sec-46.8

libro:
  256: "tiene que poder fabricarse repetidamente durante años"
  258: "las que garantizan que el equipo no dañe a nadie"
  259: "De compatibilidad electromagnética"
  260: "RoHS restringe sustancias (sección 13.6), REACH regula productos químicos"
  261: "Sectoriales: médico, automoción, ferroviario, aeronáutico"
  262: "cumplir una norma no es algo que se añade al final"
  264: "Poder saber, de una unidad concreta, qué lleva dentro y quién la hizo"
  267: "Lote de los componentes críticos, para poder acotar un problema si aparece."
  269: "sin ella, afecta a todas y hay que revisarlas todas"
  271: "Y es el problema que más rediseños fuerza."
  273: "Elegir componentes con compromiso de disponibilidad"
  274: "un componente con segunda fuente compatible es mucho más seguro que uno único, aunque este sea mejor"
  275: "Documentar alternativas ya validadas en la lista de materiales"
  276: "Aislar lo específico"
  277: "Compra de última oportunidad cuando llega el aviso de fin de vida"
  279: "Los fabricantes publican PCN —notificación de cambio de producto— y PDN —de descatalogación—"
  280: "descubrirlo por el aviso es mucho mejor que descubrirlo porque un lote se comporta distinto"
  282: "repasar la lista de materiales buscando componentes de fuente única"
  283: "buscar alternativa, aislarlo en un módulo, o aceptar el riesgo conscientemente"
  284: "Normas, trazabilidad y obsolescencia, con las defensas en orden de eficacia."

modelo: { valores: {}, calculos: {} }

tarjetas:
  - id: explore-mantenible
    tipo: explorar
    titulo: "Fabricarlo durante años"
    texto: "Un diseño no termina cuando funciona. Tres cosas se deciden pronto y se pagan tarde: toque cada una."
    libro: [256, 284, 262, 269, 271]
    widget:
      tipo: figura
      figura: fig-46.13
      zonas:
        - { id: normas, rotulo: "Recuadro rojo", rect: [2, 2, 144, 89], texto: "Normas: seguridad, compatibilidad electromagnética, materiales y sectoriales. Condicionan la placa desde el principio." }
        - { id: trazabilidad, rotulo: "Recuadro naranja", rect: [155, 2, 144, 89], texto: "Trazabilidad: número de serie, revisiones, lotes críticos y resultados de prueba de cada unidad." }
        - { id: obsolescencia, rotulo: "Recuadro azul", rect: [308, 2, 144, 89], texto: "Obsolescencia: descatalogación, cambio de proceso o escasez. Es el problema que más rediseños fuerza." }
    requiere: { mover: [normas, trazabilidad, obsolescencia] }

  - id: empareje-normas
    tipo: tocar
    titulo: "Las normas"
    texto: "Un equipo no puede llevar plomo en sus soldaduras. Toque la familia de normas que lo restringe."
    libro: [258, 259, 260, 261, 284]
    widget:
      tipo: figura
      figura: fig-46.13
      zonas:
        - { id: n1, rotulo: "Normas, primera línea", rect: [10, 28, 135, 10] }
        - { id: n2, rotulo: "Normas, segunda línea", rect: [10, 38, 135, 10] }
        - { id: n3, rotulo: "Normas, tercera línea", rect: [10, 48, 135, 10] }
        - { id: n4, rotulo: "Normas, el pie", rect: [10, 63, 135, 20] }
    tocar:
      bien: [n2]
      porque:
        n1: "Seguridad y EMC: que no dañe a nadie y que no interfiera."
        n3: "Las sectoriales son las de médico, automoción, ferroviario o aeronáutico."
        n4: "Es la razón para pensar en las normas pronto, no una familia."
    exito: "Las de materiales: RoHS restringe sustancias y REACH regula productos químicos."
    escalera:
      - "El plomo es una sustancia."
    solucion: "La segunda línea: materiales, RoHS y REACH."

  - id: porque-al-final
    tipo: tocar
    titulo: "No al final"
    texto: "Un prototipo ya funciona y ahora se piensa en la norma de seguridad. Toque en el recuadro por qué es tarde."
    libro: [258, 262, 284]
    widget:
      tipo: figura
      figura: fig-46.13
      zonas:
        - { id: n1, rotulo: "Normas, primera línea", rect: [10, 28, 135, 10] }
        - { id: n2, rotulo: "Normas, segunda línea", rect: [10, 38, 135, 10] }
        - { id: n3, rotulo: "Normas, tercera línea", rect: [10, 48, 135, 10] }
        - { id: n4, rotulo: "Normas, el pie", rect: [10, 63, 135, 20] }
    tocar:
      bien: [n4]
      porque:
        n1: "Es la familia de seguridad; la razón de que sea tarde está en otra línea."
        n2: "Son las de materiales."
        n3: "Son las sectoriales."
    exito: "Condicionan la placa desde el principio: distancias de aislamiento, el sitio del fusible, la separación entre primario y secundario."
    escalera:
      - "Busque lo que dice cuándo pesan las normas."
    solucion: "El pie del recuadro: condicionan la placa desde el principio."

  - id: prediga-lote
    tipo: tocar
    titulo: "Un lote defectuoso"
    texto: "Aparece un lote defectuoso de condensadores. Toque lo que permite revisar solo las unidades que lo llevan, y no todas."
    libro: [264, 267, 269, 284]
    widget:
      tipo: figura
      figura: fig-46.13
      zonas:
        - { id: normas, rotulo: "Recuadro de la izquierda", rect: [2, 2, 145, 90] }
        - { id: traza, rotulo: "Recuadro del centro", rect: [155, 2, 145, 90] }
        - { id: obso, rotulo: "Recuadro de la derecha", rect: [308, 2, 145, 90] }
    tocar:
      bien: [traza]
      porque:
        normas: "Las normas no dicen qué lote lleva cada unidad."
        obso: "La obsolescencia trata de piezas que desaparecen, no de lotes defectuosos."
    exito: "La trazabilidad: número de serie, revisiones, lote de los componentes críticos y resultados de prueba. Sin ella, el lote afecta a todas y hay que revisarlas todas."
    escalera:
      - "¿Qué permite saber qué lleva dentro cada unidad?"
    solucion: "El recuadro del centro: la trazabilidad."

  - id: pregunta-segunda
    tipo: tocar
    titulo: "Segunda fuente"
    texto: "Un componente único, algo mejor, frente a otro con segunda fuente compatible, para un producto que debe durar años. Toque la defensa que decide."
    libro: [271, 274, 284]
    widget:
      tipo: figura
      figura: fig-46.13
      zonas:
        - { id: d1, rotulo: "Primera defensa", rect: [10, 124, 210, 12] }
        - { id: d2, rotulo: "Segunda defensa", rect: [10, 140, 210, 22] }
        - { id: d3, rotulo: "Tercera defensa", rect: [10, 168, 210, 22] }
        - { id: d4, rotulo: "Cuarta defensa", rect: [230, 124, 215, 12] }
        - { id: d5, rotulo: "Quinta defensa", rect: [230, 140, 215, 22] }
        - { id: aviso, rotulo: "Nota de abajo a la derecha", rect: [230, 170, 215, 22] }
    tocar:
      bien: [d2]
      porque:
        d1: "Longevidad garantizada: se elige al principio; aquí el problema es otro."
        d3: "Las alternativas validadas ahorran buscarlas con prisa; no es este caso."
        d4: "Aislar en un módulo limita lo que hay que rediseñar; no es este caso."
        d5: "La compra de última oportunidad es para el aviso de fin de vida; no es este caso."
        aviso: "Los avisos PCN y PDN avisan a tiempo; no es este caso."
    exito: "Preferir los que tienen segunda fuente compatible, aunque sean algo peores: uno único es mucho menos seguro."
    escalera:
      - "Uno único depende de un solo fabricante."
    solucion: "La segunda defensa: segunda fuente."

  - id: toque-aislar
    tipo: tocar
    titulo: "Un rediseño enorme"
    texto: "Un componente se descatalogó y el rediseño fue enorme porque su función estaba repartida por toda la placa. Toque la defensa que lo habría limitado."
    libro: [276, 284]
    widget:
      tipo: figura
      figura: fig-46.13
      zonas:
        - { id: d1, rotulo: "Primera defensa", rect: [10, 124, 210, 12] }
        - { id: d2, rotulo: "Segunda defensa", rect: [10, 140, 210, 22] }
        - { id: d3, rotulo: "Tercera defensa", rect: [10, 168, 210, 22] }
        - { id: d4, rotulo: "Cuarta defensa", rect: [230, 124, 215, 12] }
        - { id: d5, rotulo: "Quinta defensa", rect: [230, 140, 215, 22] }
        - { id: aviso, rotulo: "Nota de abajo a la derecha", rect: [230, 170, 215, 22] }
    tocar:
      bien: [d4]
      porque:
        d1: "Longevidad garantizada: se elige al principio; aquí el problema es otro."
        d2: "La segunda fuente evita depender de uno; no es este caso."
        d3: "Las alternativas validadas ahorran buscarlas con prisa; no es este caso."
        d5: "La compra de última oportunidad es para el aviso de fin de vida; no es este caso."
        aviso: "Los avisos PCN y PDN avisan a tiempo; no es este caso."
    exito: "Aislar lo específico en un módulo pequeño: sustituirlo afecta a ese módulo y no a la placa entera."
    escalera:
      - "Busque la que habla de un módulo."
    solucion: "La cuarta defensa: aislar lo específico."

  - id: toque-ultima
    tipo: tocar
    titulo: "El aviso de fin de vida"
    texto: "Llega el aviso de fin de vida de un componente y no hay alternativa validada. Toque la defensa que queda."
    libro: [273, 275, 277, 284]
    widget:
      tipo: figura
      figura: fig-46.13
      zonas:
        - { id: d1, rotulo: "Primera defensa", rect: [10, 124, 210, 12] }
        - { id: d2, rotulo: "Segunda defensa", rect: [10, 140, 210, 22] }
        - { id: d3, rotulo: "Tercera defensa", rect: [10, 168, 210, 22] }
        - { id: d4, rotulo: "Cuarta defensa", rect: [230, 124, 215, 12] }
        - { id: d5, rotulo: "Quinta defensa", rect: [230, 140, 215, 22] }
        - { id: aviso, rotulo: "Nota de abajo a la derecha", rect: [230, 170, 215, 22] }
    tocar:
      bien: [d5]
      porque:
        d1: "Longevidad garantizada: se elige al principio; aquí el problema es otro."
        d2: "La segunda fuente evita depender de uno; no es este caso."
        d3: "Las alternativas validadas ahorran buscarlas con prisa; no es este caso."
        d4: "Aislar en un módulo limita lo que hay que rediseñar; no es este caso."
        aviso: "Los avisos PCN y PDN avisan a tiempo; no es este caso."
    exito: "La compra de última oportunidad, calculando el consumo previsto. Las demás se deciden mucho antes."
    escalera:
      - "Es la que se hace al llegar el aviso."
    solucion: "La quinta defensa: compra de última oportunidad."

  - id: empareje-avisos
    tipo: tocar
    titulo: "Los avisos"
    texto: "Un lote nuevo se comporta distinto y nadie sabe por qué: el fabricante había cambiado un parámetro. Toque lo que lo habría avisado."
    libro: [279, 280, 284]
    widget:
      tipo: figura
      figura: fig-46.13
      zonas:
        - { id: d1, rotulo: "Primera defensa", rect: [10, 124, 210, 12] }
        - { id: d2, rotulo: "Segunda defensa", rect: [10, 140, 210, 22] }
        - { id: d3, rotulo: "Tercera defensa", rect: [10, 168, 210, 22] }
        - { id: d4, rotulo: "Cuarta defensa", rect: [230, 124, 215, 12] }
        - { id: d5, rotulo: "Quinta defensa", rect: [230, 140, 215, 22] }
        - { id: aviso, rotulo: "Nota de abajo a la derecha", rect: [230, 170, 215, 22] }
    tocar:
      bien: [aviso]
      porque:
        d1: "Longevidad garantizada: se elige al principio; aquí el problema es otro."
        d2: "La segunda fuente evita depender de uno; no es este caso."
        d3: "Las alternativas validadas ahorran buscarlas con prisa; no es este caso."
        d4: "Aislar en un módulo limita lo que hay que rediseñar; no es este caso."
        d5: "La compra de última oportunidad es para el aviso de fin de vida; no es este caso."
    exito: "Suscribirse a los avisos PCN (cambio de producto) y PDN (descatalogación) de los críticos: descubrirlo por el aviso es mucho mejor que por un lote distinto."
    escalera:
      - "Los fabricantes publican avisos de cambio."
    solucion: "La nota de abajo a la derecha: los avisos PCN y PDN."

  - id: pregunta-banco
    tipo: pregunta
    titulo: "En el banco"
    texto: "Al repasar la lista de materiales aparece un componente de fuente única. ¿Qué hay que hacer?"
    libro: [282, 283]
    widget:
      tipo: figura
      figura: fig-46.13
      zonas:
        - { id: obsolescencia, rotulo: "Recuadro azul", rect: [308, 2, 144, 89] }
    opciones:
      - texto: "Decidir: buscar alternativa, aislarlo o aceptar el riesgo a conciencia"
        bien: true
        porque: "Media hora de trabajo que evita rediseños completos años después."
      - texto: "Nada mientras se pueda comprar"
        porque: "Cuando deje de poderse, el rediseño llegará con prisa."
      - texto: "Comprar existencias para toda la vida del producto"
        porque: "Eso es la compra de última oportunidad, para cuando llega el aviso de fin de vida."
    escalera:
      - "Hay tres decisiones posibles para cada componente de fuente única."
    solucion: "Buscar alternativa, aislarlo en un módulo o aceptar el riesgo conscientemente."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [262, 269, 274, 279]
    ideas:
      - { titulo: "Normas desde el principio.", texto: "Distancias y aislamientos condicionan la placa." }
      - { titulo: "Trazabilidad.", texto: "Acota un lote defectuoso a las unidades que lo llevan." }
      - { titulo: "Obsolescencia.", texto: "Segunda fuente y alternativas validadas antes que componentes únicos." }
      - { titulo: "Avisos.", texto: "Suscribirse a PCN y PDN de los componentes críticos." }
