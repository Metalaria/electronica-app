# Lección 1.2 de la sección 47.8 «Normas, Trazabilidad y Obsolescencia» (cap46; etiquetas sec-46.N = impresas 47.N).
# - Los tres recuadros y las defensas de la figura 47.13 (fig-46.13) con zonas.
# - Sin modelo numérico: la sección es de criterios.
# Sin paso práctico: la sección da criterios; el banco (repasar la lista de materiales) va como pregunta.
leccion: cap46/sec-46.8

libro:
  256: "tiene que poder fabricarse repetidamente durante años"
  258: "las que garantizan que el equipo no dañe a nadie"
  259: "De compatibilidad electromagnética"
  260: "RoHS restringe sustancias (sección 13.6), REACH regula productos químicos"
  262: "cumplir una norma no es algo que se añade al final"
  264: "Poder saber, de una unidad concreta, qué lleva dentro y quién la hizo"
  267: "Lote de los componentes críticos, para poder acotar un problema si aparece."
  269: "sin ella, afecta a todas y hay que revisarlas todas"
  271: "Y es el problema que más rediseños fuerza."
  273: "Elegir componentes con compromiso de disponibilidad"
  274: "un componente con segunda fuente compatible es mucho más seguro que uno único, aunque este sea mejor"
  275: "Documentar alternativas ya validadas en la lista de materiales"
  276: "Aislar lo específico"
  277: "Compra de última oportunidad cuando llega el aviso de fin de vida"
  279: "Los fabricantes publican PCN —notificación de cambio de producto— y PDN —de descatalogación—"
  280: "descubrirlo por el aviso es mucho mejor que descubrirlo porque un lote se comporta distinto"
  282: "repasar la lista de materiales buscando componentes de fuente única"
  283: "buscar alternativa, aislarlo en un módulo, o aceptar el riesgo conscientemente"
  284: "Normas, trazabilidad y obsolescencia, con las defensas en orden de eficacia."

modelo: { valores: {}, calculos: {} }

tarjetas:
  - id: explore-mantenible
    tipo: explorar
    titulo: "Fabricarlo durante años"
    texto: "Un diseño no termina cuando funciona. Tres cosas se deciden pronto y se pagan tarde: toque cada una."
    libro: [256, 284, 262, 269, 271]
    widget:
      tipo: figura
      figura: fig-46.13
      zonas:
        - { id: normas, rotulo: "Recuadro rojo", rect: [2, 2, 144, 89], texto: "Normas: seguridad, compatibilidad electromagnética, materiales y sectoriales. Condicionan la placa desde el principio." }
        - { id: trazabilidad, rotulo: "Recuadro naranja", rect: [155, 2, 144, 89], texto: "Trazabilidad: número de serie, revisiones, lotes críticos y resultados de prueba de cada unidad." }
        - { id: obsolescencia, rotulo: "Recuadro azul", rect: [308, 2, 144, 89], texto: "Obsolescencia: descatalogación, cambio de proceso o escasez. Es el problema que más rediseños fuerza." }
    requiere: { mover: [normas, trazabilidad, obsolescencia] }

  - id: porque-al-final
    tipo: porque
    titulo: "Las normas, ¿al final?"
    texto: "¿Por qué no conviene dejar las normas de seguridad para cuando el prototipo ya funcione?"
    libro: [258, 262]
    widget:
      tipo: figura
      figura: fig-46.13
      zonas:
        - { id: normas, rotulo: "Recuadro rojo", rect: [2, 2, 144, 89] }
    opciones:
      - texto: "Distancias, aislamientos y fusibles condicionan la placa desde el principio"
        bien: true
        porque: "Cumplir una norma no se añade al final: la separación entre primario y secundario cambia la placa."
      - texto: "Ninguno: la norma solo pide papeles"
        porque: "Las de seguridad son obligatorias y determinan distancias, aislamientos y protecciones."
      - texto: "Que las normas cambian cada año"
        porque: "El problema no es el cambio de la norma, sino rehacer la placa para cumplirla."
    escalera:
      - "¿Qué pasa si falta sitio para un fusible o para la separación de aislamiento?"
    solucion: "Las distancias y protecciones condicionan la placa desde el principio."

  - id: empareje-normas
    tipo: pregunta
    titulo: "Las normas"
    texto: "Empareje cada norma o familia con lo que regula."
    libro: [258, 259, 260]
    widget:
      tipo: figura
      figura: fig-46.13
      zonas:
        - { id: normas, rotulo: "Recuadro rojo", rect: [2, 2, 144, 89] }
    emparejar:
      - ["Seguridad", "Que el equipo no dañe a nadie"]
      - ["EMC", "Compatibilidad electromagnética"]
      - ["RoHS", "Restringe sustancias"]
      - ["REACH", "Regula productos químicos"]
    exito: "Seguridad y EMC condicionan la placa; RoHS y REACH, los materiales."
    pistas:
      - { texto: "RoHS y REACH son de materiales: una restringe sustancias, la otra regula productos químicos." }
    escalera:
      - "EMC son las siglas inglesas de compatibilidad electromagnética."
    solucion: "Seguridad, no dañar; EMC, compatibilidad; RoHS, sustancias; REACH, productos químicos."

  - id: prediga-lote
    tipo: predecir
    titulo: "Un lote defectuoso"
    texto: "Aparece un lote defectuoso de condensadores. ¿Qué unidades hay que revisar si no hay trazabilidad de lote?"
    libro: [264, 267, 269]
    widget:
      tipo: figura
      figura: fig-46.13
      zonas:
        - { id: trazabilidad, rotulo: "Recuadro naranja", rect: [155, 2, 144, 89] }
    opciones:
      - texto: "Todas"
        bien: true
        porque: "Sin saber qué lote lleva cada unidad, no se puede acotar: afecta a todas."
      - texto: "Solo las que lleven ese lote"
        porque: "Eso es con trazabilidad; sin ella no se sabe cuáles son."
      - texto: "Ninguna hasta que fallen"
        porque: "Esperar al fallo en campo es lo más caro; la trazabilidad sirve para evitarlo."
    escalera:
      - "¿Se puede saber qué lote lleva cada unidad?"
    solucion: "Todas: sin trazabilidad no se puede acotar el problema."

  - id: ordene-defensas
    tipo: pregunta
    titulo: "Defensas contra la obsolescencia"
    texto: "Ordene las defensas contra la obsolescencia, de más a menos eficaz."
    libro: [273, 274, 275, 276, 277]
    widget:
      tipo: figura
      figura: fig-46.13
      zonas:
        - { id: obsolescencia, rotulo: "Recuadro azul", rect: [308, 2, 144, 89] }
    ordenar:
      - "Componentes con disponibilidad garantizada"
      - "Preferir los que tienen segunda fuente"
      - "Documentar alternativas ya validadas"
      - "Aislar lo específico en un módulo"
      - "Compra de última oportunidad"
    exito: "La compra de última oportunidad es el último recurso, cuando llega el aviso de fin de vida."
    pistas:
      - { texto: "Lo más eficaz es elegir bien desde el principio; lo último, comprar al final." }
    escalera:
      - "Empiece por lo que se decide al elegir el componente."
    solucion: "Disponibilidad garantizada, segunda fuente, alternativas, aislar y última compra."

  - id: pregunta-segunda
    tipo: pregunta
    titulo: "Mejor o con alternativa"
    texto: "Hay un componente único, algo mejor, y otro con segunda fuente compatible. ¿Cuál es más seguro para un producto que debe durar?"
    libro: [274]
    widget:
      tipo: figura
      figura: fig-46.13
      zonas:
        - { id: defensas, rotulo: "Recuadro verde de abajo", rect: [2, 100, 450, 99] }
    opciones:
      - texto: "El que tiene segunda fuente"
        bien: true
        porque: "Si uno desaparece, el otro lo sustituye: mucho más seguro, aunque sea algo peor."
      - texto: "El único, porque es mejor"
        porque: "Ser mejor no sirve si se descataloga y obliga a rediseñar."
      - texto: "Da igual: los dos se descatalogarán"
        porque: "Puede, pero con segunda fuente queda una alternativa compatible."
    escalera:
      - "¿Qué pasa con cada uno si su fabricante lo descataloga?"
    solucion: "El que tiene segunda fuente compatible."

  - id: empareje-avisos
    tipo: pregunta
    titulo: "Los avisos"
    texto: "Los fabricantes publican dos avisos. Empareje cada uno."
    libro: [279, 280]
    widget:
      tipo: figura
      figura: fig-46.13
      zonas:
        - { id: defensas, rotulo: "Recuadro verde de abajo", rect: [2, 100, 450, 99] }
    emparejar:
      - ["PCN", "Notificación de cambio de producto"]
      - ["PDN", "Notificación de descatalogación"]
    exito: "Descubrir un cambio por el aviso es mucho mejor que por un lote que se comporta distinto."
    pistas:
      - { texto: "La C es de cambio; la D, de descatalogación." }
    escalera:
      - "Busque la letra de cada aviso en su descripción."
    solucion: "PCN, cambio de producto; PDN, descatalogación."

  - id: pregunta-banco
    tipo: pregunta
    titulo: "En el banco"
    texto: "Al repasar la lista de materiales aparece un componente de fuente única. ¿Qué hay que hacer?"
    libro: [282, 283]
    widget:
      tipo: figura
      figura: fig-46.13
      zonas:
        - { id: obsolescencia, rotulo: "Recuadro azul", rect: [308, 2, 144, 89] }
    opciones:
      - texto: "Decidir: buscar alternativa, aislarlo o aceptar el riesgo a conciencia"
        bien: true
        porque: "Media hora de trabajo que evita rediseños completos años después."
      - texto: "Nada mientras se pueda comprar"
        porque: "Cuando deje de poderse, el rediseño llegará con prisa."
      - texto: "Comprar existencias para toda la vida del producto"
        porque: "Eso es la compra de última oportunidad, para cuando llega el aviso de fin de vida."
    escalera:
      - "Hay tres decisiones posibles para cada componente de fuente única."
    solucion: "Buscar alternativa, aislarlo en un módulo o aceptar el riesgo conscientemente."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [262, 269, 274, 279]
    ideas:
      - { titulo: "Normas desde el principio.", texto: "Distancias y aislamientos condicionan la placa." }
      - { titulo: "Trazabilidad.", texto: "Acota un lote defectuoso a las unidades que lo llevan." }
      - { titulo: "Obsolescencia.", texto: "Segunda fuente y alternativas validadas antes que componentes únicos." }
      - { titulo: "Avisos.", texto: "Suscribirse a PCN y PDN de los componentes críticos." }
