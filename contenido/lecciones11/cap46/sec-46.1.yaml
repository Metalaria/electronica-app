# Lección 1.2 de la sección 47.1 «Qué Significa ‘Fiable’» (cap46; etiquetas sec-46.N = impresas 47.N).
# - La curva de bañera de la figura 47.1 (fig-46.1) con zonas en sus tres tramos y en la flecha del burn-in.
# - MTBF de 100 000 h (bloque 10): λ = 1/MTBF por hora; en un año de uso continuo (8 760 h) falla un 8,76 % de una
#   población grande (el «≈ 8 %» de la figura 47.2).
# Paso práctico: «tocar» en la figura 47.1 el tramo que elimina el burn-in.
# 1.2.1 (autor121-pc, «aprender haciendo», GUIA §13): la vida se duplica bajando la temperatura con una meta (la regla
# de Arrhenius de la sección 47.4: el doble cada 10 °C, en una gráfica 2^(ΔT/10)); la fracción que falla en un año y la
# tasa en FIT se escriben; el burn-in, el tramo de un equipo con un mes y la palanca que se mide en el banco se tocan en
# las figuras 47.1 y 47.2. Quedan una pregunta de opciones (qué significa el MTBF) y el emparejamiento de la
# definición.
leccion: cap46/sec-46.1

libro:
  3: "Fiabilidad es la probabilidad de que un sistema funcione correctamente durante un tiempo dado y en unas condiciones dadas"
  4: "es estadística, no una garantía individual"
  5: "sin plazo, la afirmación no significa nada"
  6: "la misma pieza es más o menos fiable según la temperatura, la vibración y la humedad"
  10: "Un MTBF de 100 000 horas no significa que el equipo dure once años"
  12: "Es la inversa del MTBF y es más cómoda porque las tasas se suman"
  13: "el tiempo hasta que empieza el desgaste"
  17: "Mortalidad infantil: alta al principio, por defectos de fabricación. Decreciente."
  18: "Vida útil: tasa aproximadamente constante, con fallos aleatorios."
  19: "Desgaste: creciente, cuando los mecanismos de envejecimiento se manifiestan"
  20: "elimina la mortalidad infantil y entrega el producto ya en la zona plana"
  21: "un equipo que lleva un mes funcionando es más fiable que uno recién sacado de la caja"
  24: "La temperatura, con diferencia."
  25: "El derating: usar los componentes por debajo de sus límites"
  26: "El número de componentes: menos piezas, menos cosas que fallen."
  27: "Las conexiones: conectores y soldaduras son responsables de una gran parte de los fallos de campo"
  28: "El diseño térmico y mecánico, más que la calidad de los componentes individuales."
  29: "Bajar diez grados la temperatura suele hacer más."
  31: "La fiabilidad no se mide en un banco: se mide con poblaciones y tiempo."
  32: "que es el predictor más directo"
  33: "Comprobar el derating de los más solicitados"
  34: "revela soldaduras marginales y conexiones débiles mucho antes que el tiempo"
  35: "La curva de la bañera"
  36: "La curva de bañera y las palancas reales de fiabilidad."

modelo:
  valores:
    MTBF: { sim: "MTBF", nombre: "tiempo medio entre fallos", unidad: h, valor: 100000 }
    h_a: { sim: "t", nombre: "horas de un año de uso continuo", unidad: h, valor: 8760 }
    T_c: { sim: "T", nombre: "temperatura del componente (ejemplo)", unidad: "°C", valor: 70 }
    T_0: { sim: "T₀", nombre: "temperatura de partida (ejemplo)", unidad: "°C", valor: 70 }
  calculos:
    lam: { expr: "1/MTBF", sim: "λ", nombre: "tasa de fallos por hora", unidad: "1/h", cifras: 3 }
    f_a: { expr: "h_a/MTBF*100", sim: "F", nombre: "fracción que falla en un año", unidad: "%", cifras: 3 }
    f_1: { expr: "h_a/MTBF", sim: "F", nombre: "fracción en tanto por uno", unidad: "", cifras: 3 }
    FIT: { expr: "1e9/MTBF", sim: "λ", nombre: "tasa de fallos en FIT", unidad: "" }
    FIT_mal: { expr: "1e6/MTBF", sim: "λ", nombre: "por millón de horas", unidad: "" }
    vida: { expr: "2^((T_0 - T_c)/10)", sim: "vida", nombre: "vida relativa", unidad: "", cifras: 3 }

tarjetas:
  - id: explore-vida
    tipo: explorar
    fase: "Consiga"
    titulo: "La palanca de verdad"
    texto: "Un componente trabaja a 70 °C. En lugar de comprar uno de gama superior, baje su temperatura hasta duplicar su vida."
    libro: [24, 28, 29, 36]
    fijar: { T_0: 70 }
    inicio: { T_c: 70 }
    widget:
      tipo: grafica
      x: { id: tt, min: 30, max: 80, unidad: "°C", rotulo: "T" }
      y: { min: 0, max: 18, unidad: "", rotulo: "vida relativa" }
      curvas:
        - { expr: "2^((T_0 - tt)/10)", color: naranja, rotulo: "el doble cada 10 °C" }
      marcas:
        - { x: "T_c", y: "vida", rotulo: "× {{vida}}" }
      lectura: { valor: vida, rotulo: "Vida relativa" }
      mandos:
        - { valor: T_c, min: 30, max: 80, paso: 5, rotulo: "Temperatura, T" }
    objetivo:
      condiciones:
        - { valor: vida, min: 2, rotulo: "Vida: × {{vida}}" }
      logrado: "A {{T_c}}: × {{vida}}. Bajar diez grados suele hacer más que comprar mejores componentes: la temperatura es la primera palanca."
      pistas:
        - { texto: "Todavía no llega al doble: baje más la temperatura." }
    escalera:
      - "Por Arrhenius, cada 10 °C menos puede duplicar la vida."
    solucion: "60 °C: diez grados menos, el doble de vida."
    comprobar:
      - { con: { T_c: 60 }, vida: 2 }

  - id: toque-burnin
    tipo: tocar
    titulo: "Lo que elimina el rodaje"
    texto: "El burn-in hace funcionar el equipo unas horas antes de entregarlo. Toque el tramo de fallos que elimina."
    libro: [20, 35]
    widget:
      tipo: figura
      figura: fig-46.1
      zonas:
        - { id: infantil, rotulo: "Tramo de la izquierda", rect: [0, 0, 67, 160] }
        - { id: util, rotulo: "Tramo del centro", rect: [67, 0, 193, 160] }
        - { id: desgaste, rotulo: "Tramo de la derecha", rect: [260, 0, 84, 160] }
    tocar:
      bien: [infantil]
      porque:
        util: "Ahí es donde el burn-in entrega el producto: la zona plana, con fallos aleatorios que no se pueden cribar."
        desgaste: "El desgaste llega al final de la vida; unas horas de rodaje no lo adelantan ni lo evitan."
    exito: "La mortalidad infantil: los defectos de fabricación fallan en fábrica y el producto sale ya en la zona plana."
    escalera:
      - "¿Qué tramo se debe a defectos de fabricación?"
    solucion: "El de la izquierda, la mortalidad infantil."

  - id: empareje-definicion
    tipo: pregunta
    titulo: "Los tres elementos"
    texto: "Fiabilidad es la probabilidad de funcionar bien durante un tiempo dado y en unas condiciones dadas. Empareje cada elemento con lo que significa."
    libro: [3, 4, 5, 6]
    emparejar:
      - ["Probabilidad", "Es estadística, no una garantía individual"]
      - ["Tiempo dado", "Sin plazo, la afirmación no significa nada"]
      - ["Condiciones dadas", "Temperatura, vibración y humedad"]
    exito: "«Este equipo es fiable» no es técnico hasta que lleva un tiempo y unas condiciones."
    pistas:
      - { texto: "La misma pieza es más o menos fiable según el ambiente: eso son las condiciones." }
    escalera:
      - "¿Cuál de los tres habla de una población y no de una unidad?"
    solucion: "Probabilidad: estadística. Tiempo: un plazo. Condiciones: temperatura, vibración y humedad."

  - id: prediga-mtbf
    tipo: predecir
    titulo: "Un MTBF de 100 000 horas"
    texto: "Un equipo tiene un MTBF de 100 000 horas, unos once años. ¿Qué significa?"
    libro: [10]
    widget:
      tipo: figura
      figura: fig-46.2
      zonas:
        - { id: meseta, rotulo: "Zona plana de la curva", rect: [53, 17, 117, 148] }
    opciones:
      - texto: "Una tasa: en una población grande, falla uno de cada 100 000 por hora"
        bien: true
        porque: "Describe la zona plana de una población; el equipo concreto puede fallar mañana."
      - texto: "Que el equipo durará unos once años"
        porque: "Es el malentendido más extendido: el MTBF no es una vida, es una tasa."
      - texto: "Que no fallará antes de 100 000 horas"
        porque: "Es estadística, no una garantía individual: cualquier unidad puede fallar mañana."
    escalera:
      - "¿Habla el MTBF de un equipo o de una población?"
    solucion: "Una tasa de fallos de la población, no la vida de un equipo."

  - id: estime-ano
    tipo: leer
    titulo: "Un año de uso"
    texto: "Con un MTBF de 100 000 horas, escriba qué parte de una población grande falla en un año de uso continuo, 8 760 horas."
    libro: [10, 12, 36]
    fijar: { MTBF: 100000, h_a: 8760 }
    widget:
      tipo: grafica
      x: { id: hh, min: 0, max: 20000, unidad: h, rotulo: "horas de uso" }
      y: { min: 0, max: 25, unidad: "%", rotulo: "fallan" }
      curvas:
        - { expr: "hh/MTBF*100", color: naranja, rotulo: "t/MTBF" }
      mandos: []
    leer:
      objetivo: f_a
      unidad: "%"
      tol: 0.03
      rotulo: "Fallan en un año"
      errores:
        - { expr: "f_1", texto: "Eso es en tanto por uno: multiplique por 100." }
    exito: "Un 8,76 %: casi uno de cada diez en un año, aunque el MTBF sean «once años». El equipo concreto puede fallar mañana."
    escalera:
      - "La tasa por hora es la inversa del MTBF: divida las horas del año entre él."
    solucion: "8 760 / 100 000: el 8,76 %."
    comprobar:
      - { f_a: 8.76, f_1: 0.0876 }

  - id: pregunta-fit
    tipo: leer
    titulo: "La tasa de fallos"
    texto: "La tasa de fallos es la inversa del MTBF y se mide en FIT, fallos por mil millones de horas. Escriba la de un equipo con un MTBF de 100 000 horas."
    libro: [12, 13]
    fijar: { MTBF: 100000 }
    widget:
      tipo: grafica
      x: { id: mm, min: 10000, max: 1000000, unidad: h, rotulo: "MTBF", escala: log }
      y: { min: 100, max: 1000000, unidad: "", rotulo: "FIT", escala: log }
      curvas:
        - { expr: "1e9/mm", color: naranja, rotulo: "FIT = 10⁹/MTBF" }
      mandos: []
    leer:
      objetivo: FIT
      unidad: ""
      tol: 0.02
      rotulo: "Tasa de fallos (FIT)"
      errores:
        - { expr: "FIT_mal", texto: "Eso son fallos por millón de horas: un FIT es por mil millones." }
    exito: "10 000 FIT. Es más cómoda que el MTBF porque las tasas se suman: la de un sistema es la suma de las de sus componentes."
    escalera:
      - "Mil millones de horas entre el MTBF."
    solucion: "10⁹ / 100 000 = 10 000 FIT."
    comprobar:
      - { FIT: 10000, FIT_mal: 10 }

  - id: porque-mes
    tipo: tocar
    titulo: "Un mes funcionando"
    texto: "Un equipo lleva un mes funcionando y es más fiable que uno recién sacado de la caja. Toque el tramo en el que está."
    libro: [17, 18, 19, 20, 21]
    widget:
      tipo: figura
      figura: fig-46.1
      zonas:
        - { id: infantil, rotulo: "Tramo de la izquierda", rect: [0, 0, 67, 160] }
        - { id: util, rotulo: "Tramo del centro", rect: [67, 0, 193, 160] }
        - { id: desgaste, rotulo: "Tramo de la derecha", rect: [260, 0, 84, 160] }
    tocar:
      bien: [util]
      porque:
        infantil: "Ese es el recién sacado de la caja: aún puede fallar por un defecto de fabricación."
        desgaste: "Un mes no basta para que el envejecimiento se manifieste."
    exito: "En la vida útil: ya pasó la mortalidad infantil y está en la zona plana, con fallos aleatorios."
    escalera:
      - "¿Qué tramo ha dejado atrás?"
    solucion: "El del centro, la vida útil."

  - id: pregunta-banco
    tipo: tocar
    fase: "En el banco"
    titulo: "En el banco"
    texto: "La fiabilidad se mide con poblaciones y tiempo, no en un banco. Toque la palanca cuyo predictor sí se mide en él, componente a componente."
    libro: [24, 25, 26, 27, 31, 32, 33, 34, 36]
    widget:
      tipo: figura
      figura: fig-46.2
      recorte: [234, 60, 154, 70]
      ampliar: 2.45
      zonas:
        - { id: p1, rotulo: "Primera palanca", rect: [242, 79, 205, 10] }
        - { id: p2, rotulo: "Segunda palanca", rect: [242, 89, 205, 9] }
        - { id: p3, rotulo: "Tercera palanca", rect: [242, 98, 205, 9] }
        - { id: p4, rotulo: "Cuarta palanca", rect: [242, 107, 205, 9] }
        - { id: p5, rotulo: "Quinta palanca", rect: [242, 116, 205, 9] }
    tocar:
      bien: [p1]
      porque:
        p2: "El derating también se comprueba en el banco, pero el predictor más directo es otro."
        p3: "El número de piezas se cuenta en el esquema."
        p4: "Las conexiones se ponen a prueba con un ciclado térmico, no con una medida directa."
        p5: "El diseño térmico se juzga por lo que se mide: otra palanca."
    exito: "La temperatura de cada componente en funcionamiento continuo: el predictor más directo. Y un ciclado térmico revela soldaduras marginales."
    escalera:
      - "La primera palanca, con diferencia."
    solucion: "La primera: la temperatura."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [3, 10, 20, 24]
    ideas:
      - { titulo: "Fiable.", texto: "Una probabilidad, durante un tiempo dado y en unas condiciones dadas." }
      - { titulo: "El MTBF es una tasa.", texto: "No una vida: el equipo concreto puede fallar mañana." }
      - { titulo: "La bañera.", texto: "Mortalidad infantil, vida útil y desgaste; el burn-in quita la primera." }
      - { titulo: "La palanca.", texto: "La temperatura, con diferencia; luego el derating." }
