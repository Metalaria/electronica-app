# Lección 1.2 de la sección 47.1 «Qué Significa ‘Fiable’» (cap46; etiquetas sec-46.N = impresas 47.N).
# - La curva de bañera de la figura 47.1 (fig-46.1) con zonas en sus tres tramos y en la flecha del burn-in.
# - MTBF de 100 000 h (bloque 10): λ = 1/MTBF por hora; en un año de uso continuo (8 760 h) falla un 8,76 % de una
#   población grande (el «≈ 8 %» de la figura 47.2).
# Paso práctico: «tocar» en la figura 47.1 el tramo que elimina el burn-in.
leccion: cap46/sec-46.1

libro:
  3: "Fiabilidad es la probabilidad de que un sistema funcione correctamente durante un tiempo dado y en unas condiciones dadas"
  4: "es estadística, no una garantía individual"
  5: "sin plazo, la afirmación no significa nada"
  6: "la misma pieza es más o menos fiable según la temperatura, la vibración y la humedad"
  10: "Un MTBF de 100 000 horas no significa que el equipo dure once años"
  12: "Es la inversa del MTBF y es más cómoda porque las tasas se suman"
  13: "el tiempo hasta que empieza el desgaste"
  17: "Mortalidad infantil: alta al principio, por defectos de fabricación. Decreciente."
  18: "Vida útil: tasa aproximadamente constante, con fallos aleatorios."
  19: "Desgaste: creciente, cuando los mecanismos de envejecimiento se manifiestan"
  20: "elimina la mortalidad infantil y entrega el producto ya en la zona plana"
  21: "un equipo que lleva un mes funcionando es más fiable que uno recién sacado de la caja"
  24: "La temperatura, con diferencia."
  25: "El derating: usar los componentes por debajo de sus límites"
  26: "El número de componentes: menos piezas, menos cosas que fallen."
  27: "Las conexiones: conectores y soldaduras son responsables de una gran parte de los fallos de campo"
  28: "El diseño térmico y mecánico, más que la calidad de los componentes individuales."
  29: "Bajar diez grados la temperatura suele hacer más."
  31: "La fiabilidad no se mide en un banco: se mide con poblaciones y tiempo."
  32: "que es el predictor más directo"
  34: "revela soldaduras marginales y conexiones débiles mucho antes que el tiempo"
  35: "La curva de la bañera"
  36: "La curva de bañera y las palancas reales de fiabilidad."

modelo:
  valores:
    MTBF: { sim: "MTBF", nombre: "tiempo medio entre fallos", unidad: h, valor: 100000 }
    h_a: { sim: "t", nombre: "horas de un año de uso continuo", unidad: h, valor: 8760 }
  calculos:
    lam: { expr: "1/MTBF", sim: "λ", nombre: "tasa de fallos por hora", unidad: "1/h", cifras: 3 }
    f_a: { expr: "h_a/MTBF*100", sim: "F", nombre: "fracción que falla en un año", unidad: "%", cifras: 3 }

tarjetas:
  - id: explore-banera
    tipo: explorar
    titulo: "La curva de bañera"
    texto: "La tasa de fallos frente al tiempo tiene tres tramos. Toque cada uno."
    libro: [35, 17, 18, 19, 20]
    widget:
      tipo: figura
      figura: fig-46.1
      zonas:
        - { id: infantil, rotulo: "Tramo rojo de la izquierda", rect: [0, 0, 67, 132], texto: "Mortalidad infantil: tasa alta al principio, por defectos de fabricación, y decreciente." }
        - { id: util, rotulo: "Tramo verde del centro", rect: [67, 0, 193, 160], texto: "Vida útil: tasa casi constante, con fallos aleatorios. Es la zona plana." }
        - { id: desgaste, rotulo: "Tramo naranja de la derecha", rect: [260, 0, 84, 160], texto: "Desgaste: tasa creciente, cuando el envejecimiento se manifiesta." }
        - { id: burnin, rotulo: "Flecha de abajo a la izquierda", rect: [0, 132, 67, 28], texto: "Burn-in: hacer funcionar el equipo unas horas antes de entregarlo." }
    requiere: { mover: [infantil, util, desgaste] }

  - id: toque-burnin
    tipo: tocar
    titulo: "Lo que elimina el rodaje"
    texto: "El burn-in hace funcionar el equipo unas horas antes de entregarlo. Toque el tramo de fallos que elimina."
    libro: [20, 35]
    widget:
      tipo: figura
      figura: fig-46.1
      zonas:
        - { id: infantil, rotulo: "Tramo de la izquierda", rect: [0, 0, 67, 160] }
        - { id: util, rotulo: "Tramo del centro", rect: [67, 0, 193, 160] }
        - { id: desgaste, rotulo: "Tramo de la derecha", rect: [260, 0, 84, 160] }
    tocar:
      bien: [infantil]
      porque:
        util: "Ahí es donde el burn-in entrega el producto: la zona plana, con fallos aleatorios que no se pueden cribar."
        desgaste: "El desgaste llega al final de la vida; unas horas de rodaje no lo adelantan ni lo evitan."
    exito: "La mortalidad infantil: los defectos de fabricación fallan en fábrica y el producto sale ya en la zona plana."
    escalera:
      - "¿Qué tramo se debe a defectos de fabricación?"
    solucion: "El de la izquierda, la mortalidad infantil."

  - id: empareje-definicion
    tipo: pregunta
    titulo: "Los tres elementos"
    texto: "Fiabilidad es la probabilidad de funcionar bien durante un tiempo dado y en unas condiciones dadas. Empareje cada elemento con lo que significa."
    libro: [3, 4, 5, 6]
    emparejar:
      - ["Probabilidad", "Es estadística, no una garantía individual"]
      - ["Tiempo dado", "Sin plazo, la afirmación no significa nada"]
      - ["Condiciones dadas", "Temperatura, vibración y humedad"]
    exito: "«Este equipo es fiable» no es técnico hasta que lleva un tiempo y unas condiciones."
    pistas:
      - { texto: "La misma pieza es más o menos fiable según el ambiente: eso son las condiciones." }
    escalera:
      - "¿Cuál de los tres habla de una población y no de una unidad?"
    solucion: "Probabilidad: estadística. Tiempo: un plazo. Condiciones: temperatura, vibración y humedad."

  - id: prediga-mtbf
    tipo: predecir
    titulo: "Un MTBF de 100 000 horas"
    texto: "Un equipo tiene un MTBF de 100 000 horas, unos once años. ¿Qué significa?"
    libro: [10]
    widget:
      tipo: figura
      figura: fig-46.2
      zonas:
        - { id: meseta, rotulo: "Zona plana de la curva", rect: [53, 17, 117, 148] }
    opciones:
      - texto: "Una tasa: en una población grande, falla uno de cada 100 000 por hora"
        bien: true
        porque: "Describe la zona plana de una población; el equipo concreto puede fallar mañana."
      - texto: "Que el equipo durará unos once años"
        porque: "Es el malentendido más extendido: el MTBF no es una vida, es una tasa."
      - texto: "Que no fallará antes de 100 000 horas"
        porque: "Es estadística, no una garantía individual: cualquier unidad puede fallar mañana."
    escalera:
      - "¿Habla el MTBF de un equipo o de una población?"
    solucion: "Una tasa de fallos de la población, no la vida de un equipo."

  - id: estime-ano
    tipo: pregunta
    titulo: "Un año de uso"
    texto: "Con un MTBF de 100 000 horas, ¿qué fracción de una población grande falla en un año de uso continuo, 8 760 horas?"
    libro: [10, 12, 36]
    fijar: { MTBF: 100000, h_a: 8760 }
    widget:
      tipo: figura
      figura: fig-46.2
      zonas:
        - { id: meseta, rotulo: "Zona plana de la curva", rect: [53, 17, 117, 148] }
    estimar:
      objetivo: "f_a"
      unidad: "%"
      min: 0
      max: 30
      paso: 0.1
      inicio: 20
      tol: 0.1
      rotulo: "Fallan en un año"
    exito: "Un 8,76 %: casi uno de cada diez, aunque el MTBF sea de once años."
    pistas:
      - { cuando: { valor: estimacion, mayor: 9.6 }, texto: "Demasiado: 8 760 entre 100 000 es menos de una décima." }
      - { texto: "Demasiado poco: divida las 8 760 horas del año entre el MTBF de 100 000." }
    escalera:
      - "La tasa por hora es la inversa del MTBF."
      - "Divida las 8 760 horas del año entre 100 000."
    solucion: "8 760/100 000 = 8,76 % de la población en un año."
    comprobar:
      - { f_a: 8.76 }

  - id: pregunta-fit
    tipo: pregunta
    titulo: "La tasa de fallos"
    texto: "La tasa de fallos se mide en FIT, fallos por mil millones de horas. ¿Por qué es más cómoda que el MTBF?"
    libro: [12, 13]
    widget:
      tipo: figura
      figura: fig-46.2
      zonas:
        - { id: meseta, rotulo: "Zona plana de la curva", rect: [53, 17, 117, 148] }
    opciones:
      - texto: "Las tasas se suman: la del sistema es la suma de las de sus componentes"
        bien: true
        porque: "Es la inversa del MTBF, y sumar tasas es inmediato; los MTBF no se suman."
      - texto: "Porque mide la vida útil del equipo"
        porque: "La vida útil es otro concepto: el tiempo hasta que empieza el desgaste."
      - texto: "Porque vale también en el tramo de desgaste"
        porque: "Igual que el MTBF, describe la zona plana; en el desgaste la tasa crece."
    escalera:
      - "¿Qué operación hace falta para combinar los componentes de un sistema?"
    solucion: "Las tasas se suman; la del sistema es la suma de las de sus componentes."

  - id: ordene-palancas
    tipo: pregunta
    titulo: "Las palancas reales"
    texto: "Ordene lo que de verdad determina la fiabilidad, de más a menos eficaz."
    libro: [24, 25, 26, 27, 28]
    ordenar:
      - "La temperatura"
      - "El derating de los componentes"
      - "El número de componentes"
      - "Las conexiones: conectores y soldaduras"
      - "El diseño térmico y mecánico"
    exito: "La temperatura, con diferencia: por Arrhenius, cada 10 °C menos puede duplicar la vida."
    pistas:
      - { texto: "La primera es la temperatura; la segunda, usar los componentes por debajo de sus límites." }
    escalera:
      - "Empiece por la temperatura y siga por el derating."
      - "Menos piezas antes que las conexiones."
    solucion: "Temperatura, derating, número de componentes, conexiones y diseño térmico y mecánico."

  - id: porque-mes
    tipo: porque
    titulo: "Un mes funcionando"
    texto: "¿Por qué un equipo que lleva un mes funcionando es más fiable que uno recién sacado de la caja?"
    libro: [17, 20, 21]
    widget:
      tipo: figura
      figura: fig-46.1
      zonas:
        - { id: infantil, rotulo: "Tramo de la izquierda", rect: [0, 0, 67, 160] }
    opciones:
      - texto: "Ya ha pasado la mortalidad infantil y está en la zona plana"
        bien: true
        porque: "Los defectos de fabricación fallan pronto; el que sobrevive al principio ya está en la vida útil."
      - texto: "Porque sus componentes se han asentado y son mejores"
        porque: "Los componentes no mejoran con el uso: lo que ha desaparecido son las unidades defectuosas."
      - texto: "No lo es: el desgaste empieza desde el primer día"
        porque: "El desgaste llega al final; al principio la tasa es alta y decreciente."
    escalera:
      - "Mire cómo cambia la tasa de fallos al principio de la curva."
    solucion: "Ha superado la mortalidad infantil: está ya en la zona plana."

  - id: pregunta-calidad
    tipo: pregunta
    titulo: "Mejores componentes o menos calor"
    texto: "Se quiere que un equipo dure más. ¿Qué suele hacer más por su fiabilidad?"
    libro: [28, 29]
    widget:
      tipo: figura
      figura: fig-46.2
      zonas:
        - { id: curva, rotulo: "La curva de bañera", rect: [20, 17, 200, 148] }
    opciones:
      - texto: "Bajar diez grados la temperatura"
        bien: true
        porque: "La temperatura es la primera palanca; el diseño térmico pesa más que la calidad de cada pieza."
      - texto: "Comprar componentes de gama superior"
        porque: "Rara vez es la palanca más eficaz: un buen componente caliente envejece igual de deprisa."
      - texto: "Añadir más componentes de protección"
        porque: "Más piezas son más cosas que fallen: el número de componentes es una palanca en contra."
    escalera:
      - "¿Cuál es la primera de las palancas reales?"
    solucion: "Bajar diez grados la temperatura suele hacer más."

  - id: pregunta-banco
    tipo: pregunta
    titulo: "En el banco"
    texto: "La fiabilidad se mide con poblaciones y tiempo, no en un banco. ¿Qué es lo más útil que sí se puede medir en él?"
    libro: [31, 32, 34]
    widget:
      tipo: figura
      figura: fig-46.1
      zonas:
        - { id: util, rotulo: "Tramo del centro", rect: [67, 0, 193, 160] }
    opciones:
      - texto: "La temperatura de todos los componentes en funcionamiento continuo"
        bien: true
        porque: "Es el predictor más directo; el derating y el ciclado térmico completan la comprobación."
      - texto: "El MTBF del equipo, dejándolo encendido una semana"
        porque: "Una unidad y una semana no son una población ni un tiempo: el MTBF no sale de ahí."
      - texto: "Nada: la fiabilidad solo se calcula"
        porque: "Sí se mide algo útil: temperaturas, derating y un ciclado térmico improvisado."
    escalera:
      - "¿Qué gobierna casi todos los mecanismos de fallo?"
    solucion: "Las temperaturas de todos los componentes en funcionamiento continuo."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [3, 10, 20, 24]
    ideas:
      - { titulo: "Fiable.", texto: "Una probabilidad, durante un tiempo dado y en unas condiciones dadas." }
      - { titulo: "El MTBF es una tasa.", texto: "No una vida: el equipo concreto puede fallar mañana." }
      - { titulo: "La bañera.", texto: "Mortalidad infantil, vida útil y desgaste; el burn-in quita la primera." }
      - { titulo: "La palanca.", texto: "La temperatura, con diferencia; luego el derating." }
