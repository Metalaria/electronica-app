# Lección 1.2 de la sección 47.5 «Diseño para Fabricación (DFM)» (cap46; etiquetas sec-46.N = impresas 47.N).
# - Las tres columnas de la figura 47.9 (fig-46.9) con zonas: reducir variedad, facilitar el montaje, tolerancias.
# - Sin modelo numérico: la sección es de criterios.
# Sin paso práctico: la sección da criterios, no medidas (el banco del bloque 169, imprimir 1:1, va como pregunta).
# 1.2.1 (autor121-pc, «aprender haciendo», GUIA §13): sección de criterios; cada caso se resuelve tocando la decisión en
# la figura 47.9 (normalizar valores, un solo lado, analizar la sensibilidad, evitar contactos ocultos), el documento
# ambiguo en la lista de documentos del bloque 163 (como listado) y la comprobación de la impresión 1:1 en la figura
# 41.1. Quedan dos preguntas de opciones (por qué probar y el coste real) y el orden del reparto de tolerancias.
# 1.4 (contenido14, mezcla ≥ 70 %): la exploración de la figura pide las tres familias en el orden del bloque 171.
leccion: cap46/sec-46.5

libro:
  137: "casi todas son gratis si se toman a tiempo y muy caras después"
  139: "un carrete en la máquina, una posición en el almacén, un pedido, un riesgo de obsolescencia"
  141: "Usar 10 kΩ en veinte sitios en lugar de 9,1, 10 y 11 kΩ. La diferencia funcional suele ser nula y el ahorro logístico, real."
  142: "todos los condensadores cerámicos en 0805"
  145: "una fila de marcas alineadas delata al instante la pieza girada"
  146: "montar por las dos caras exige dos pasadas de reflujo y a veces adhesivo"
  151: "Cada apretón de tolerancia sube el precio del componente y baja el rendimiento de producción."
  152: "analizar la sensibilidad, descubrir que dos o tres componentes determinan el resultado, apretar solo esos y relajar deliberadamente el resto"
  153: "pistas y separaciones más anchas de lo mínimo"
  160: "una placa que no se puede probar no se puede fabricar en serie"
  164: "Una ambigüedad en esos documentos se resuelve en la fábrica con una suposición"
  166: "el más caro de todos— el fallo en campo"
  169: "imprimir la placa a escala 1:1 y colocar encima los componentes reales"
  171: "Reducir variedad, facilitar el montaje y la disciplina con las tolerancias."
  149: "Evitar componentes con contactos ocultos (BGA, QFN) si el volumen no justifica la inspección por rayos X"
  163: "Lista de materiales"
  143: "Un componente de un solo fabricante es un riesgo de obsolescencia"
  148: "marcas de polaridad claras en la serigrafía"
  167: "un componente algo más caro pero estándar, disponible y bien documentado suele ser más barato"
  "cap40#31": "Imprimir la placa a escala 1:1 y colocar encima los componentes reales"

modelo: { valores: {}, calculos: {} }

tarjetas:
  - id: explore-dfm
    tipo: explorar
    titulo: "Gratis a tiempo"
    texto: "El DFM son decisiones de diseño que abaratan la producción. Toque sus tres familias en el orden del libro: variedad, montaje y tolerancias."
    libro: [137, 171]
    widget:
      tipo: figura
      figura: fig-46.9
      zonas:
        - { id: variedad, rotulo: "Columna verde", rect: [4, 5, 142, 191], texto: "Reducir la variedad: normalizar valores, un encapsulado por familia y componentes estándar." }
        - { id: montaje, rotulo: "Columna azul", rect: [153, 5, 143, 191], texto: "Facilitar el montaje: orientación uniforme, un solo lado y nada de contactos ocultos sin necesidad." }
        - { id: tolerancias, rotulo: "Columna naranja", rect: [303, 5, 143, 191], texto: "Tolerancias holgadas: apretar solo lo que decide el resultado, y lo mismo con la placa." }
    objetivo:
      orden: true
      condiciones:
        - { zona: variedad, rotulo: "Reducir la variedad" }
        - { zona: montaje, rotulo: "Facilitar el montaje" }
        - { zona: tolerancias, rotulo: "Disciplina con las tolerancias" }
      logrado: "Reducir variedad, facilitar el montaje y la disciplina con las tolerancias: casi todo gratis si se decide a tiempo."
      pistas:
        - { texto: "Lea lo que dice cada columna al tocarla." }

  - id: prediga-normalizar
    tipo: tocar
    titulo: "Normalizar valores"
    texto: "Un diseño usa 9,1, 10 y 11 kΩ en distintos sitios, y se cambian todos por 10 kΩ. Toque la decisión."
    libro: [139, 141, 171]
    widget:
      tipo: figura
      figura: fig-46.9
      zonas:
        - { id: norm, rotulo: "Columna izquierda, arriba", rect: [4, 29, 142, 50] }
        - { id: encap, rotulo: "Columna izquierda, en medio", rect: [4, 86, 142, 50] }
        - { id: estandar, rotulo: "Columna izquierda, abajo", rect: [4, 144, 142, 50] }
        - { id: orient, rotulo: "Columna central, arriba", rect: [153, 29, 142, 50] }
        - { id: lado, rotulo: "Columna central, en medio", rect: [153, 86, 142, 50] }
        - { id: ocultos, rotulo: "Columna central, abajo", rect: [153, 144, 142, 50] }
        - { id: sens, rotulo: "Columna derecha, arriba", rect: [302, 29, 142, 50] }
        - { id: apretar, rotulo: "Columna derecha, en medio", rect: [302, 86, 142, 50] }
        - { id: placa, rotulo: "Columna derecha, abajo", rect: [302, 144, 142, 50] }
    tocar:
      bien: [norm]
      porque:
        encap: "Un encapsulado por familia también reduce variedad, pero aquí cambian los valores, no los encapsulados."
        estandar: "Preferir estándar evita la obsolescencia; no es este caso."
        orient: "La orientación uniforme delata piezas giradas; no es este caso."
        lado: "Un solo lado ahorra una pasada de reflujo; no es este caso."
        ocultos: "Evitar contactos ocultos ahorra rayos X; no es este caso."
        sens: "Analizar la sensibilidad es de las tolerancias; no es este caso."
        apretar: "Apretar solo los que deciden es de las tolerancias; no es este caso."
        placa: "Lo mismo con la placa: reglas holgadas; no es este caso."
    exito: "Normalizar valores: cada referencia distinta cuesta un carrete, un hueco en el almacén y un pedido. La diferencia funcional suele ser nula."
    escalera:
      - "Es de reducir la variedad."
    solucion: "Columna izquierda, arriba: normalizar valores."

  - id: pregunta-dos-caras
    tipo: tocar
    titulo: "Una sola cara"
    texto: "Los componentes caben en una sola cara, pero se reparten por las dos. Toque la regla que se incumple."
    libro: [146, 171]
    widget:
      tipo: figura
      figura: fig-46.9
      zonas:
        - { id: norm, rotulo: "Columna izquierda, arriba", rect: [4, 29, 142, 50] }
        - { id: encap, rotulo: "Columna izquierda, en medio", rect: [4, 86, 142, 50] }
        - { id: estandar, rotulo: "Columna izquierda, abajo", rect: [4, 144, 142, 50] }
        - { id: orient, rotulo: "Columna central, arriba", rect: [153, 29, 142, 50] }
        - { id: lado, rotulo: "Columna central, en medio", rect: [153, 86, 142, 50] }
        - { id: ocultos, rotulo: "Columna central, abajo", rect: [153, 144, 142, 50] }
        - { id: sens, rotulo: "Columna derecha, arriba", rect: [302, 29, 142, 50] }
        - { id: apretar, rotulo: "Columna derecha, en medio", rect: [302, 86, 142, 50] }
        - { id: placa, rotulo: "Columna derecha, abajo", rect: [302, 144, 142, 50] }
    tocar:
      bien: [lado]
      porque:
        norm: "Normalizar valores reduce referencias, no resuelve este caso."
        encap: "Un encapsulado por familia reduce variedad; aquí se pide otra cosa."
        estandar: "Preferir estándar evita la obsolescencia; no es este caso."
        orient: "La orientación uniforme delata piezas giradas; no es este caso."
        ocultos: "Evitar contactos ocultos ahorra rayos X; no es este caso."
        sens: "Analizar la sensibilidad es de las tolerancias; no es este caso."
        apretar: "Apretar solo los que deciden es de las tolerancias; no es este caso."
        placa: "Lo mismo con la placa: reglas holgadas; no es este caso."
    exito: "Un solo lado: montar por las dos caras exige dos pasadas de reflujo y a veces adhesivo."
    escalera:
      - "Es de facilitar el montaje."
    solucion: "Columna central, en medio: un solo lado."

  - id: prediga-apretar
    tipo: tocar
    titulo: "El 1 % en todas"
    texto: "Por seguridad, un diseñador pide el 1 % en todas las resistencias, y el precio sube. Toque lo que debería haber hecho primero."
    libro: [151, 152, 153, 171]
    widget:
      tipo: figura
      figura: fig-46.9
      zonas:
        - { id: norm, rotulo: "Columna izquierda, arriba", rect: [4, 29, 142, 50] }
        - { id: encap, rotulo: "Columna izquierda, en medio", rect: [4, 86, 142, 50] }
        - { id: estandar, rotulo: "Columna izquierda, abajo", rect: [4, 144, 142, 50] }
        - { id: orient, rotulo: "Columna central, arriba", rect: [153, 29, 142, 50] }
        - { id: lado, rotulo: "Columna central, en medio", rect: [153, 86, 142, 50] }
        - { id: ocultos, rotulo: "Columna central, abajo", rect: [153, 144, 142, 50] }
        - { id: sens, rotulo: "Columna derecha, arriba", rect: [302, 29, 142, 50] }
        - { id: apretar, rotulo: "Columna derecha, en medio", rect: [302, 86, 142, 50] }
        - { id: placa, rotulo: "Columna derecha, abajo", rect: [302, 144, 142, 50] }
    tocar:
      bien: [sens]
      porque:
        norm: "Normalizar valores reduce referencias, no resuelve este caso."
        encap: "Un encapsulado por familia reduce variedad; aquí se pide otra cosa."
        estandar: "Preferir estándar evita la obsolescencia; no es este caso."
        orient: "La orientación uniforme delata piezas giradas; no es este caso."
        lado: "Un solo lado ahorra una pasada de reflujo; no es este caso."
        ocultos: "Evitar contactos ocultos ahorra rayos X; no es este caso."
        apretar: "Apretar solo los que deciden viene después: primero hay que saber cuáles son."
        placa: "Lo mismo con la placa: reglas holgadas; no es este caso."
    exito: "Analizar la sensibilidad: dos o tres componentes deciden el resultado. Se aprietan solo esos y se relaja el resto; cada apretón sube el precio y baja el rendimiento."
    escalera:
      - "Es de las tolerancias, y va antes de apretar nada."
    solucion: "Columna derecha, arriba: analizar la sensibilidad."

  - id: ordene-sensibilidad
    tipo: pregunta
    titulo: "La disciplina correcta"
    texto: "Ordene cómo se reparten las tolerancias de un diseño."
    libro: [152]
    ordenar:
      - "Analizar la sensibilidad"
      - "Descubrir los dos o tres componentes que deciden el resultado"
      - "Apretar solo esos"
      - "Relajar deliberadamente el resto"
    exito: "Así se gasta en precisión solo donde decide."
    pistas:
      - { texto: "Primero se mide la sensibilidad; relajar es lo último." }
    escalera:
      - "Antes de apretar nada, hay que saber qué mueve el resultado."
    solucion: "Sensibilidad, componentes que deciden, apretar esos y relajar el resto."

