  - id: pregunta-documentos
    tipo: tocar
    titulo: "Documentar bien"
    texto: "La lista de materiales dice «10 µF» sin más, y la fábrica monta lo que supone. Toque el documento que falló."
    libro: [163, 164]
    widget:
      tipo: figura
      codigo:
        lenguaje: "documentos"
        texto: "Gerbers y taladro, con sus capas.\nLista de materiales, con referencia comprable.\nFichero de posiciones para la máquina.\nNotas: acabado, espesor, clase, no montados."
      zonas:
        - { id: gerber, lineas: [1], rotulo: "Primera línea" }
        - { id: bom, lineas: [2], rotulo: "Segunda línea" }
        - { id: pos, lineas: [3], rotulo: "Tercera línea" }
