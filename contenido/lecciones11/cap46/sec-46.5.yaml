    exito: "Imprimir la placa a escala 1:1 y colocar encima los componentes reales. Y probar a montar y desmontar un componente con las herramientas que hay."
    escalera:
      - "Hace falta comparar con las piezas reales."
    solucion: "Abajo a la izquierda: la impresión 1:1."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [137, 141, 152, 166]
    ideas:
      - { titulo: "Gratis a tiempo.", texto: "Las decisiones de DFM son gratis en el diseño y caras después." }
      - { titulo: "Menos variedad.", texto: "Normalizar valores y encapsulados ahorra logística." }
      - { titulo: "Tolerancias.", texto: "Apretar solo los dos o tres que deciden; relajar el resto." }
