# Lección 1.2 de la sección 47.5 «Diseño para Fabricación (DFM)» (cap46; etiquetas sec-46.N = impresas 47.N).
# - Las tres columnas de la figura 47.9 (fig-46.9) con zonas: reducir variedad, facilitar el montaje, tolerancias.
# - Sin modelo numérico: la sección es de criterios.
# Sin paso práctico: la sección da criterios, no medidas (el banco del bloque 169, imprimir 1:1, va como pregunta).
leccion: cap46/sec-46.5

libro:
  137: "casi todas son gratis si se toman a tiempo y muy caras después"
  139: "un carrete en la máquina, una posición en el almacén, un pedido, un riesgo de obsolescencia"
  141: "Usar 10 kΩ en veinte sitios en lugar de 9,1, 10 y 11 kΩ. La diferencia funcional suele ser nula y el ahorro logístico, real."
  142: "todos los condensadores cerámicos en 0805"
  145: "una fila de marcas alineadas delata al instante la pieza girada"
  146: "montar por las dos caras exige dos pasadas de reflujo y a veces adhesivo"
  151: "Cada apretón de tolerancia sube el precio del componente y baja el rendimiento de producción."
  152: "analizar la sensibilidad, descubrir que dos o tres componentes determinan el resultado, apretar solo esos y relajar deliberadamente el resto"
  153: "pistas y separaciones más anchas de lo mínimo"
  160: "una placa que no se puede probar no se puede fabricar en serie"
  164: "Una ambigüedad en esos documentos se resuelve en la fábrica con una suposición"
  166: "el más caro de todos— el fallo en campo"
  169: "imprimir la placa a escala 1:1 y colocar encima los componentes reales"
  171: "Reducir variedad, facilitar el montaje y la disciplina con las tolerancias."

modelo: { valores: {}, calculos: {} }

tarjetas:
  - id: explore-dfm
    tipo: explorar
    titulo: "Gratis a tiempo"
    texto: "El DFM son decisiones de diseño que abaratan la producción. Toque cada grupo."
    libro: [137, 171]
    widget:
      tipo: figura
      figura: fig-46.9
      zonas:
        - { id: variedad, rotulo: "Columna verde", rect: [4, 5, 142, 191], texto: "Reducir la variedad: normalizar valores, un encapsulado por familia y componentes estándar." }
        - { id: montaje, rotulo: "Columna azul", rect: [153, 5, 143, 191], texto: "Facilitar el montaje: orientación uniforme, un solo lado y nada de contactos ocultos sin necesidad." }
        - { id: tolerancias, rotulo: "Columna naranja", rect: [303, 5, 143, 191], texto: "Tolerancias holgadas: apretar solo lo que decide el resultado, y lo mismo con la placa." }
    requiere: { mover: [variedad, montaje, tolerancias] }

  - id: prediga-normalizar
    tipo: predecir
    titulo: "Veinte veces 10 kΩ"
    texto: "Un diseño usa 9,1, 10 y 11 kΩ en distintos sitios, y se cambian todos por 10 kΩ. ¿Qué se gana?"
    libro: [139, 141]
    widget:
      tipo: figura
      figura: fig-46.9
      zonas:
        - { id: variedad, rotulo: "Columna verde", rect: [4, 5, 142, 191] }
    opciones:
      - texto: "Un ahorro logístico real, con diferencia funcional casi siempre nula"
        bien: true
        porque: "Cada referencia es un carrete, un hueco en el almacén, un pedido y un riesgo de obsolescencia."
      - texto: "Nada: cada resistencia cuesta lo mismo"
        porque: "El coste de una referencia no está en su precio, sino en la logística que arrastra."
      - texto: "Precisión: 10 kΩ es más exacta"
        porque: "No es cuestión de precisión: el valor cambia poco y casi nunca importa."
    escalera:
      - "¿Qué cuesta cada referencia distinta, además de su precio?"
    solucion: "Un ahorro logístico real sin pérdida funcional."

  - id: empareje-grupos
    tipo: pregunta
    titulo: "Cada decisión en su grupo"
    texto: "Empareje cada decisión con su grupo del DFM."
    libro: [142, 145, 153, 171]
    widget:
      tipo: figura
      figura: fig-46.9
      zonas:
        - { id: cabeceras, rotulo: "Las tres cabeceras", rect: [4, 5, 442, 36] }
    emparejar:
      - ["Todos los cerámicos en 0805", "Reducir la variedad"]
      - ["Todos los diodos en la misma dirección", "Facilitar el montaje"]
      - ["Pistas más anchas de lo mínimo", "Tolerancias holgadas"]
    exito: "Una fila de marcas alineadas delata al instante la pieza girada."
    pistas:
      - { texto: "La orientación de los polarizados es cosa del montaje." }
    escalera:
      - "Un solo encapsulado por familia reduce referencias."
    solucion: "0805, variedad; diodos alineados, montaje; pistas anchas, tolerancias."

  - id: pregunta-dos-caras
    tipo: pregunta
    titulo: "Una cara o dos"
    texto: "Si los componentes caben en una sola cara, ¿por qué no repartirlos por las dos?"
    libro: [146]
    widget:
      tipo: figura
      figura: fig-46.9
      zonas:
        - { id: montaje, rotulo: "Columna azul", rect: [153, 5, 143, 191] }
    opciones:
      - texto: "Dos caras exigen dos pasadas de reflujo y a veces adhesivo"
        bien: true
        porque: "Cada pasada es tiempo y riesgo; si cabe en una, el montaje es más sencillo."
      - texto: "Porque por debajo no se pueden soldar componentes"
        porque: "Sí se puede; lo que cuesta es la segunda pasada de reflujo."
      - texto: "Da igual: la máquina monta igual las dos caras"
        porque: "No da igual: la segunda cara es otra pasada y, a veces, adhesivo."
    escalera:
      - "¿Cuántas pasadas de reflujo pide cada cara?"
    solucion: "Dos pasadas de reflujo y, a veces, adhesivo."

  - id: prediga-apretar
    tipo: predecir
    titulo: "Apretar por seguridad"
    texto: "Por seguridad, un diseñador pide el 1 % en todas las resistencias. ¿Qué consigue?"
    libro: [151, 152]
    widget:
      tipo: figura
      figura: fig-46.9
      zonas:
        - { id: tolerancias, rotulo: "Columna naranja", rect: [303, 5, 143, 191] }
    opciones:
      - texto: "Más precio y menos rendimiento de producción, casi siempre sin necesidad"
        bien: true
        porque: "Cada apretón encarece; lo que decide el resultado suelen ser dos o tres componentes."
      - texto: "Un diseño más barato, porque fallan menos"
        porque: "Cada apretón sube el precio del componente y baja el rendimiento de producción."
      - texto: "Lo correcto: más tolerancia siempre es más fiabilidad"
        porque: "Es el impulso natural y un error caro: solo hay que apretar donde importa."
    escalera:
      - "¿Cuántos componentes suelen decidir el resultado?"
    solucion: "Más coste y menos rendimiento: un error caro."

  - id: ordene-sensibilidad
    tipo: pregunta
    titulo: "La disciplina correcta"
    texto: "Ordene cómo se reparten las tolerancias de un diseño."
    libro: [152]
    ordenar:
      - "Analizar la sensibilidad"
      - "Descubrir los dos o tres componentes que deciden el resultado"
      - "Apretar solo esos"
      - "Relajar deliberadamente el resto"
    exito: "Así se gasta en precisión solo donde decide."
    pistas:
      - { texto: "Primero se mide la sensibilidad; relajar es lo último." }
    escalera:
      - "Antes de apretar nada, hay que saber qué mueve el resultado."
    solucion: "Sensibilidad, componentes que deciden, apretar esos y relajar el resto."

  - id: porque-probar
    tipo: porque
    titulo: "Diseñar para el test"
    texto: "¿Por qué una placa que no se puede probar no se puede fabricar en serie?"
    libro: [160]
    widget:
      tipo: figura
      figura: fig-46.9
      zonas:
        - { id: montaje, rotulo: "Columna azul", rect: [153, 5, 143, 191] }
    opciones:
      - texto: "No hay forma de distinguir las buenas de las malas"
        bien: true
        porque: "Sin prueba, las defectuosas salen con las buenas: por eso los puntos de prueba van en el diseño."
      - texto: "Porque la fábrica se niega a montarla"
        porque: "Montarse, se monta; lo que no se puede es saber cuáles funcionan."
      - texto: "Porque sin prueba no se puede soldar"
        porque: "La soldadura no depende de la prueba: la clasificación de unidades, sí."
    escalera:
      - "¿Qué hay que hacer con cada unidad que sale de la línea?"
    solucion: "No hay forma de distinguir las buenas de las malas."

  - id: pregunta-coste
    tipo: pregunta
    titulo: "El coste real"
    texto: "Al precio de compra de un componente se suman montaje, aprovisionamiento, inspección y obsolescencia. ¿Cuál es el más caro de todos?"
    libro: [166]
    widget:
      tipo: figura
      figura: fig-46.9
      zonas:
        - { id: variedad, rotulo: "Columna verde", rect: [4, 5, 142, 191] }
    opciones:
      - texto: "El fallo en campo"
        bien: true
        porque: "Por eso un componente estándar y bien documentado suele salir más barato que el que ahorra céntimos."
      - texto: "El precio de compra"
        porque: "Es una parte pequeña del coste total."
      - texto: "La inspección"
        porque: "Cuesta, pero mucho menos que un fallo con el producto ya en manos del cliente."
    escalera:
      - "¿Qué pasa si el componente barato falla con el equipo ya instalado?"
    solucion: "El fallo en campo."

  - id: pregunta-documentos
    tipo: pregunta
    titulo: "Documentar bien"
    texto: "La lista de materiales dice «10 µF» sin más. ¿Qué pasa en la fábrica?"
    libro: [164]
    widget:
      tipo: figura
      figura: fig-46.9
      zonas:
        - { id: variedad, rotulo: "Columna verde", rect: [4, 5, 142, 191] }
    opciones:
      - texto: "La ambigüedad se resuelve con una suposición, quizá no la pretendida"
        bien: true
        porque: "Por eso la lista lleva la referencia comprable, no solo el valor."
      - texto: "Llaman siempre para preguntar"
        porque: "No siempre: lo habitual es suponer, y la suposición puede no ser la buena."
      - texto: "Nada: un valor basta para montar"
        porque: "Un valor no dice tensión, dieléctrico ni encapsulado: falta la referencia comprable."
    escalera:
      - "¿Qué falta para comprar exactamente esa pieza?"
    solucion: "Se resuelve con una suposición, que puede no ser la pretendida."

  - id: pregunta-banco
    tipo: pregunta
    titulo: "En el banco"
    texto: "La comprobación de fabricabilidad que cualquiera puede hacer: imprimir la placa a escala 1:1 y colocar encima los componentes reales. ¿Qué detecta?"
    libro: [169]
    widget:
      tipo: figura
      figura: fig-46.9
      zonas:
        - { id: montaje, rotulo: "Columna azul", rect: [153, 5, 143, 191] }
    opciones:
      - texto: "Espacios insuficientes, orientaciones imposibles y conectores que no encajan"
        bien: true
        porque: "Lo físico se ve al instante sobre el papel, sin fabricar nada."
      - texto: "Errores del esquema eléctrico"
        porque: "El papel no conduce: detecta problemas de espacio y encaje, no de conexión."
      - texto: "Pistas demasiado estrechas para la corriente"
        porque: "Eso se calcula; la impresión revela espacios, orientaciones y encajes."
    escalera:
      - "¿Qué se ve al poner las piezas reales sobre el papel?"
    solucion: "Espacios, orientaciones y conectores que no encajan."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [137, 141, 152, 166]
    ideas:
      - { titulo: "Gratis a tiempo.", texto: "Las decisiones de DFM son gratis en el diseño y caras después." }
      - { titulo: "Menos variedad.", texto: "Normalizar valores y encapsulados ahorra logística." }
      - { titulo: "Tolerancias.", texto: "Apretar solo los dos o tres que deciden; relajar el resto." }
      - { titulo: "El coste real.", texto: "El más caro es el fallo en campo." }
