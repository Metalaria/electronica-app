        encap: "Un encapsulado por familia reduce variedad; aquí se pide otra cosa."
        estandar: "Preferir estándar evita la obsolescencia; no es este caso."
        lado: "Un solo lado ahorra una pasada de reflujo; no es este caso."
        sens: "Analizar la sensibilidad es de las tolerancias; no es este caso."
        apretar: "Apretar solo los que deciden es de las tolerancias; no es este caso."
