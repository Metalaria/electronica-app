# Lección 1.2 de la sección 47.3 «Estrés y Derating» (cap46; etiquetas sec-46.N = impresas 47.N).
# - Las distribuciones de estrés y resistencia de la figura 47.5 (fig-46.5) con zonas; la tabla de derating de la
#   figura 47.6 (fig-46.6).
# - Unión a 110 °C en lugar de 150 °C (bloque 81): con la regla de los 10 °C, 2^4 = 16; con Arrhenius y 0,7 eV,
#   unas siete veces (7,4 en el modelo).
# - El ejercicio 47.2 (condensadores de 25 V en un raíl de 24 V) como pregunta.
# Paso práctico: «tocar» el solape de las dos distribuciones en la figura 47.5.
leccion: cap46/sec-46.3

libro:
  75: "Un componente no falla porque trabaje mucho, sino porque trabaja cerca de su límite."
  76: "la tasa de fallos cae mucho más deprisa que proporcionalmente"
  78: "Temperatura de unión"
  80: "El electrolítico no tiene un mínimo de tensión."
  81: "40 °C por debajo del límite multiplican la vida por unas siete veces con Ea = 0,7 eV, y por dieciséis con la regla práctica de duplicar cada 10 °C"
  90: "un componente al 90 % de su tensión, a 100 °C y con ciclos diarios de 60 °C tiene una vida órdenes de magnitud menor"
  92: "un condensador de 50 V en lugar de 25 es más grande y más caro"
  93: "fuerte en los componentes cuyo fallo es caro o peligroso, moderado en el resto"
  97: "la tensión real sobre cada condensador (incluyendo picos, no solo el valor medio)"
  98: "al 90 % del máximo absoluto las dos distribuciones se solapan y falla una fracción apreciable"
  99: "Valores de derating recomendados por tipo de componente y parámetro."
  "cap46#646": "Un diseño usa condensadores de 25 V en un raíl de 24 V y falla pronto en campo."

modelo:
  valores:
    T_max: { sim: "T_{máx}", nombre: "límite de la unión", unidad: "°C", valor: 150 }
    T_d: { sim: "T_{j}", nombre: "unión con derating", unidad: "°C", valor: 110 }
    E_a: { sim: "E_{a}", nombre: "energía de activación", unidad: eV, valor: 0.7 }
  calculos:
    F_10: { expr: "2^((T_max - T_d)/10)", sim: "F", nombre: "vida multiplicada, regla de los 10 °C", unidad: "", cifras: 3 }
    F_ar: { expr: "exp(E_a*q_e/k_B*(1/(T_d + 273.15) - 1/(T_max + 273.15)))", sim: "F", nombre: "vida multiplicada, Arrhenius", unidad: "", cifras: 2 }

tarjetas:
  - id: explore-solape
    tipo: explorar
    titulo: "Estrés frente a resistencia"
    texto: "El estrés aplicado y la resistencia del componente tienen dispersión. Toque las curvas de cada panel."
    libro: [75, 76, 98]
    widget:
      tipo: figura
      figura: fig-46.5
      zonas:
        - { id: estres90, rotulo: "Curva izquierda, panel izquierdo", rect: [80, 80, 36, 45], texto: "Estrés aplicado al 90 % del máximo absoluto: su cola llega a la resistencia." }
        - { id: resistencia, rotulo: "Curva derecha, panel izquierdo", rect: [130, 76, 36, 44], texto: "La resistencia real del componente: también tiene dispersión." }
        - { id: estres50, rotulo: "Curva alta, panel derecho", rect: [268, 35, 36, 70], texto: "Al 50 %: el estrés se aleja del límite y el solape desaparece." }
    requiere: { mover: [estres90, estres50] }

  - id: toque-solape
    tipo: tocar
    titulo: "Dónde fallan"
    texto: "Toque la zona de la figura que corresponde a las unidades que fallan."
    libro: [76, 98]
    widget:
      tipo: figura
      figura: fig-46.5
      zonas:
        - { id: estres90, rotulo: "Pico de la curva izquierda", rect: [80, 80, 36, 45] }
        - { id: solape, rotulo: "Mancha bajo las dos curvas", rect: [116, 120, 36, 35] }
        - { id: resistencia, rotulo: "Pico de la curva derecha", rect: [130, 76, 36, 44] }
        - { id: estres50, rotulo: "Curva alta del otro panel", rect: [268, 35, 36, 70] }
    tocar:
      bien: [solape]
      porque:
        estres90: "Es el estrés más frecuente, por debajo de la resistencia típica: esas unidades aguantan."
        resistencia: "Es la resistencia típica, lejos del estrés: aquí no falla nadie."
        estres50: "Al 50 % no hay solape: la tasa de fallos cae muchísimo."
    exito: "El solape: estrés alto contra componente débil. Alejar el punto de trabajo lo hace desaparecer."
    escalera:
      - "Una unidad falla cuando su estrés supera su resistencia."
    solucion: "La mancha donde se cruzan las dos curvas."

  - id: prediga-cae
    tipo: predecir
    titulo: "Del 90 al 50 %"
    texto: "Un componente pasa de trabajar al 90 % de su máximo al 50 %. ¿Cómo cambia su tasa de fallos?"
    libro: [76, 98]
    widget:
      tipo: figura
      figura: fig-46.5
      zonas:
        - { id: solape, rotulo: "Mancha bajo las dos curvas", rect: [116, 120, 36, 35] }
    opciones:
      - texto: "Cae mucho más deprisa que proporcionalmente"
        bien: true
        porque: "Las distribuciones dejan de solaparse: la fracción que falla casi desaparece."
      - texto: "Se reduce más o menos a la mitad"
        porque: "Eso sería proporcional; la caída depende del solape, y el solape desaparece."
      - texto: "Igual: el componente es el mismo"
        porque: "No falla por trabajar, sino por trabajar cerca de su límite."
    escalera:
      - "¿Qué le pasa al solape de las dos curvas al alejar el estrés del límite?"
    solucion: "Cae mucho más deprisa que proporcionalmente: el solape desaparece."

  - id: pregunta-rail
    tipo: pregunta
    titulo: "25 V en un raíl de 24 V"
    texto: "Un diseño usa condensadores de 25 V en un raíl de 24 V y falla pronto en campo. ¿Qué corrige el problema?"
    libro: ["cap46#646", 92, 99]
    widget:
      tipo: figura
      figura: fig-46.6
      zonas:
        - { id: tabla, rotulo: "Barras de la tabla", rect: [97, 15, 290, 185] }
    opciones:
      - texto: "Condensadores de 50 V"
        bien: true
        porque: "Así trabajan holgadamente por debajo de su máximo: eso es el derating."
      - texto: "Condensadores de 25 V de mejor marca"
        porque: "El problema no es la calidad: es trabajar casi en el límite."
      - texto: "Dos condensadores de 25 V en paralelo"
        porque: "En paralelo cada uno sigue soportando los 24 V: el estrés no baja."
    escalera:
      - "¿Qué fracción de su tensión nominal soportan?"
    solucion: "Condensadores de 50 V: trabajar por debajo del máximo frena la degradación."

  - id: empareje-tabla
    tipo: pregunta
    titulo: "Las cifras habituales"
    texto: "Empareje cada componente con su uso recomendado."
    libro: [78, 99]
    widget:
      tipo: figura
      figura: fig-46.6
      zonas:
        - { id: tabla, rotulo: "Barras de la tabla", rect: [97, 15, 290, 185] }
    emparejar:
      - ["Resistencia: potencia", "50 % del nominal"]
      - ["Electrolítico: tensión", "≤ 80 %, sin mínimo"]
      - ["Semiconductor: tensión", "70 – 80 %"]
      - ["Semiconductor: temperatura de unión", "≤ 110 °C, no 150"]
    exito: "La unión no va en porcentaje: se fija en 110 °C en lugar de 150 °C."
    pistas:
      - { texto: "La temperatura de unión no es un porcentaje." }
    escalera:
      - "La resistencia, a la mitad de su potencia."
    solucion: "Resistencia 50 %; electrolítico ≤ 80 %; semiconductor 70 – 80 %; unión ≤ 110 °C."

  - id: pregunta-minimo
    tipo: pregunta
    titulo: "¿Un mínimo de tensión?"
    texto: "Circula la idea de que un electrolítico por debajo de la mitad de su tensión se degrada. ¿Qué dicen los datos?"
    libro: [80]
    widget:
      tipo: figura
      figura: fig-46.6
      zonas:
        - { id: electrolitico, rotulo: "Cuarta barra", rect: [0, 79, 320, 32] }
    opciones:
      - texto: "No hay mínimo: la fuga cae y la vida aumenta"
        bien: true
        porque: "Lo que degrada el óxido es pasar años sin ninguna tensión, no trabajar con poca."
      - texto: "Es cierto: la capa de óxido se adelgaza"
        porque: "Los datos de los fabricantes dicen lo contrario: la fuga cae al bajar la tensión."
      - texto: "Hay que usarlo siempre por encima del 80 %"
        porque: "Al revés: el 80 % es el máximo recomendado, no un mínimo."
    escalera:
      - "¿Qué le pasa a la fuga al bajar la tensión aplicada?"
    solucion: "No tiene mínimo: con menos tensión, menos fuga y más vida."

  - id: estime-union
    tipo: pregunta
    titulo: "110 °C en lugar de 150"
    texto: "Con la regla de duplicar la vida cada 10 °C, ¿por cuánto se multiplica al llevar la unión de 150 a 110 °C?"
    libro: [81]
    fijar: { T_max: 150, T_d: 110 }
    widget:
      tipo: figura
      figura: fig-46.6
      zonas:
        - { id: union, rotulo: "Última fila", rect: [0, 180, 290, 32] }
    estimar:
      objetivo: "F_10"
      unidad: ""
      min: 1
      max: 40
      paso: 1
      inicio: 30
      tol: 0.05
      rotulo: "Vida multiplicada por"
    exito: "Por 16 con la regla; Arrhenius con 0,7 eV da unas siete veces. Las dos, mucho."
    pistas:
      - { cuando: { valor: estimacion, mayor: 17 }, texto: "Demasiado: son 40 °C, cuatro saltos de 10 °C; cada uno duplica." }
      - { texto: "Demasiado poco: cuatro saltos de 10 °C, y cada uno duplica: no suman, multiplican." }
    escalera:
      - "¿Cuántos saltos de 10 °C hay entre 150 y 110 °C?"
      - "Cada salto multiplica por dos: 2 × 2 × 2 × 2."
    solucion: "Cuatro saltos: 2⁴ = 16."
    comprobar:
      - { F_10: 16, F_ar: 7.4 }

  - id: prediga-juntos
    tipo: predecir
    titulo: "Tres estreses juntos"
    texto: "Mismo componente: al 90 % de su tensión, a 100 °C y con ciclos diarios de 60 °C; o al 50 %, a 60 °C y estable. ¿Cuánto cambia su vida?"
    libro: [90]
    widget:
      tipo: figura
      figura: fig-46.5
      zonas:
        - { id: solape, rotulo: "Mancha bajo las dos curvas", rect: [116, 120, 36, 35] }
    opciones:
      - texto: "Órdenes de magnitud: los efectos se multiplican"
        bien: true
        porque: "Temperatura, tensión y ciclado actúan a la vez y su efecto es multiplicativo."
      - texto: "Lo que diga el peor de los tres"
        porque: "No manda uno solo: rara vez falla por un único factor."
      - texto: "La suma de los tres efectos por separado"
        porque: "No se suman: se multiplican, y la diferencia es de órdenes de magnitud."
    escalera:
      - "¿Se suman o se multiplican los efectos?"
    solucion: "Órdenes de magnitud: el efecto de los tres estreses es multiplicativo."

  - id: porque-criterio
    tipo: porque
    titulo: "Con criterio"
    texto: "¿Por qué no se aplica un derating fuerte a todos los componentes por igual?"
    libro: [92, 93]
    widget:
      tipo: figura
      figura: fig-46.6
      zonas:
        - { id: tabla, rotulo: "Barras de la tabla", rect: [97, 15, 290, 185] }
    opciones:
      - texto: "Cuesta: piezas mayores, más caras o con más R_{DS(on)}"
        bien: true
        porque: "Por eso es fuerte donde el fallo es caro o peligroso y moderado en el resto."
      - texto: "Porque el derating fuerte reduce la fiabilidad"
        porque: "No la reduce; el problema es su coste en tamaño, precio y prestaciones."
      - texto: "Porque las normas lo prohíben"
        porque: "Las normas publican tablas de derating; no lo prohíben."
    escalera:
      - "¿Qué tiene un condensador de 50 V frente a uno de 25 V?"
    solucion: "No es gratis; un análisis de modos de fallo dice dónde merece la pena."

  - id: pregunta-picos
    tipo: pregunta
    titulo: "Verificar midiendo"
    texto: "Se verifica el derating de un condensador en el banco. ¿Qué tensión hay que comparar con su nominal?"
    libro: [97]
    widget:
      tipo: figura
      figura: fig-46.6
      zonas:
        - { id: ceramico, rotulo: "Tercera barra", rect: [0, 57, 240, 32] }
    opciones:
      - texto: "La real, incluyendo los picos"
        bien: true
        porque: "Un pico también estresa el dieléctrico; comparar solo la media da un estrés falso."
      - texto: "El valor medio"
        porque: "El libro pide los picos, no solo el valor medio."
      - texto: "La del esquema"
        porque: "La real suele sorprender: el más estresado rara vez es el esperado."
    escalera:
      - "¿Qué ve el dieléctrico en un transitorio?"
    solucion: "La tensión real, con sus picos."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [75, 76, 81, 93]
    ideas:
      - { titulo: "Lejos del límite.", texto: "Se falla por trabajar cerca del límite, no por trabajar mucho." }
      - { titulo: "Más que proporcional.", texto: "Al separar estrés y resistencia, la tasa de fallos se desploma." }
      - { titulo: "Las cifras.", texto: "Resistencias al 50 % de potencia; unión a 110 °C, no 150." }
      - { titulo: "Con criterio.", texto: "Fuerte donde el fallo es caro o peligroso." }
