# Lección 1.2 de la sección 47.3 «Estrés y Derating» (cap46; etiquetas sec-46.N = impresas 47.N).
# - Las distribuciones de estrés y resistencia de la figura 47.5 (fig-46.5) con zonas; la tabla de derating de la
#   figura 47.6 (fig-46.6).
# - Unión a 110 °C en lugar de 150 °C (bloque 81): con la regla de los 10 °C, 2^4 = 16; con Arrhenius y 0,7 eV,
#   unas siete veces (7,4 en el modelo).
# - El ejercicio 47.2 (condensadores de 25 V en un raíl de 24 V) como pregunta.
# Paso práctico: «tocar» el solape de las dos distribuciones en la figura 47.5.
# 1.2.1 (autor121-pc, «aprender haciendo», GUIA §13): la unión se baja con una meta hasta que Arrhenius (0,7 eV)
# multiplique la vida por siete (110 °C) y se escribe lo que da la regla de los 10 °C (16); el solape y el panel del
# 50 % se tocan en la figura 47.5 y los componentes de «la mitad» en la 47.6; la tensión nominal mínima para el raíl de
# 24 V (≤ 80 %: 30 V) y el uso de un condensador por su pico (25 V, picos de 24 V: valores de ejemplo) se escriben.
# Quedan dos preguntas de opciones (el mínimo del electrolítico y los tres estreses juntos).
leccion: cap46/sec-46.3

libro:
  75: "Un componente no falla porque trabaje mucho, sino porque trabaja cerca de su límite."
  76: "la tasa de fallos cae mucho más deprisa que proporcionalmente"
  78: "Temperatura de unión"
  80: "El electrolítico no tiene un mínimo de tensión."
  81: "40 °C por debajo del límite multiplican la vida por unas siete veces con Ea = 0,7 eV, y por dieciséis con la regla práctica de duplicar cada 10 °C"
  90: "un componente al 90 % de su tensión, a 100 °C y con ciclos diarios de 60 °C tiene una vida órdenes de magnitud menor"
  92: "un condensador de 50 V en lugar de 25 es más grande y más caro"
  93: "fuerte en los componentes cuyo fallo es caro o peligroso, moderado en el resto"
  97: "la tensión real sobre cada condensador (incluyendo picos, no solo el valor medio)"
  98: "al 90 % del máximo absoluto las dos distribuciones se solapan y falla una fracción apreciable"
  99: "Valores de derating recomendados por tipo de componente y parámetro."
  "cap46#646": "Un diseño usa condensadores de 25 V en un raíl de 24 V y falla pronto en campo."

modelo:
  valores:
    T_max: { sim: "T_{máx}", nombre: "límite de la unión", unidad: "°C", valor: 150 }
    T_d: { sim: "T_{j}", nombre: "unión con derating", unidad: "°C", valor: 110 }
    E_a: { sim: "E_{a}", nombre: "energía de activación", unidad: eV, valor: 0.7 }
    V_rail: { sim: "V", nombre: "tensión del raíl", unidad: V, valor: 24 }
    k_el: { sim: "uso", nombre: "uso máximo del electrolítico", unidad: "", valor: 0.8 }
    V_c25: { sim: "V_{nom}", nombre: "tensión nominal del condensador (ejemplo)", unidad: V, valor: 25 }
    V_med: { sim: "V_{media}", nombre: "tensión media sobre él (ejemplo)", unidad: V, valor: 20 }
    V_pic: { sim: "V_{pico}", nombre: "picos sobre él (ejemplo)", unidad: V, valor: 24 }
  calculos:
    F_10: { expr: "2^((T_max - T_d)/10)", sim: "F", nombre: "vida multiplicada, regla de los 10 °C", unidad: "", cifras: 3 }
    V_nmin: { expr: "V_rail/k_el", sim: "V_{nom}", nombre: "tensión nominal mínima", unidad: V }
    V_mal: { expr: "V_rail*k_el", sim: "V", nombre: "el 80 % del raíl", unidad: V }
    u_pic: { expr: "V_pic/V_c25*100", sim: "uso", nombre: "uso por los picos", unidad: "%" }
    u_med: { expr: "V_med/V_c25*100", sim: "uso", nombre: "uso por la media", unidad: "%" }
    F_ar: { expr: "exp(E_a*q_e/k_B*(1/(T_d + 273.15) - 1/(T_max + 273.15)))", sim: "F", nombre: "vida multiplicada, Arrhenius", unidad: "", cifras: 2 }

tarjetas:
  - id: explore-union
    tipo: explorar
    fase: "Consiga"
    titulo: "La unión a 110 °C, no a 150"
    texto: "Un semiconductor admite 150 °C de unión. Baje la temperatura hasta que, con Arrhenius y 0,7 eV, la vida se multiplique por siete."
    libro: [78, 81, 99]
    fijar: { T_max: 150, E_a: 0.7 }
    inicio: { T_d: 150 }
    widget:
      tipo: grafica
      x: { id: tt, min: 80, max: 150, unidad: "°C", rotulo: "T_{j}" }
      y: { min: 0, max: 130, unidad: "", rotulo: "vida multiplicada" }
      curvas:
        - { expr: "exp(E_a*q_e/k_B*(1/(tt + 273.15) - 1/(T_max + 273.15)))", color: naranja, rotulo: "Arrhenius, 0,7 eV" }
        - { expr: "2^((T_max - tt)/10)", color: azul, rotulo: "el doble cada 10 °C", discontinua: true }
      marcas:
        - { x: "T_d", y: "F_ar", rotulo: "× {{F_ar}}" }
      lectura: { valor: F_ar, rotulo: "Vida multiplicada (Arrhenius)" }
      mandos:
        - { valor: T_d, min: 80, max: 150, paso: 5, rotulo: "Temperatura de unión, T_{j}" }
    objetivo:
      condiciones:
        - { valor: F_ar, min: 7, rotulo: "Vida: × {{F_ar}}" }
      logrado: "A {{T_d}}: × {{F_ar}}. Es el derating de la tabla: unión a 110 °C o menos, no a 150."
      pistas:
        - { texto: "Todavía no llega: baje más la unión." }
    escalera:
      - "Pruebe 40 °C por debajo del límite."
    solucion: "110 °C: unas siete veces más vida."
    comprobar:
      - { con: { T_d: 110 }, F_ar: 7.4, tol: 0.02 }

  - id: toque-solape
    tipo: tocar
    titulo: "Dónde fallan"
    texto: "Toque la zona de la figura que corresponde a las unidades que fallan."
    libro: [76, 98]
    widget:
      tipo: figura
      figura: fig-46.5
      zonas:
        - { id: estres90, rotulo: "Pico de la curva izquierda", rect: [80, 80, 36, 45] }
        - { id: solape, rotulo: "Mancha bajo las dos curvas", rect: [116, 120, 36, 35] }
        - { id: resistencia, rotulo: "Pico de la curva derecha", rect: [130, 76, 36, 44] }
        - { id: estres50, rotulo: "Curva alta del otro panel", rect: [268, 35, 36, 70] }
    tocar:
      bien: [solape]
      porque:
        estres90: "Es el estrés más frecuente, por debajo de la resistencia típica: esas unidades aguantan."
        resistencia: "Es la resistencia típica, lejos del estrés: aquí no falla nadie."
        estres50: "Al 50 % no hay solape: la tasa de fallos cae muchísimo."
    exito: "El solape: estrés alto contra componente débil. Alejar el punto de trabajo lo hace desaparecer."
    escalera:
      - "Una unidad falla cuando su estrés supera su resistencia."
    solucion: "La mancha donde se cruzan las dos curvas."

  - id: prediga-cae
    tipo: tocar
    titulo: "Lejos del límite"
    texto: "El mismo componente, al 90 % y al 50 % de su máximo. Toque el panel en el que casi no falla ninguno."
    libro: [75, 76, 98]
    widget:
      tipo: figura
      figura: fig-46.5
      zonas:
        - { id: p90, rotulo: "Panel de la izquierda", rect: [20, 20, 190, 140] }
        - { id: p50, rotulo: "Panel de la derecha", rect: [230, 20, 200, 140] }
    tocar:
      bien: [p50]
      porque:
        p90: "Al 90 % la cola del estrés llega a la de la resistencia: falla una fracción apreciable."
    exito: "Al 50 %: las distribuciones se separan y la tasa de fallos cae mucho más deprisa que proporcionalmente."
    escalera:
      - "Busque el panel sin solape entre las dos curvas."
    solucion: "El de la derecha, al 50 %."

  - id: pregunta-rail
    tipo: leer
    titulo: "Un raíl de 24 V"
    texto: "Un diseño usa electrolíticos de 25 V en un raíl de 24 V y falla pronto. La tabla pide como mucho el 80 %: escriba la tensión nominal mínima."
    libro: [78, 92, 93, "cap46#646"]
    fijar: { V_rail: 24, k_el: 0.8 }
    widget:
      tipo: figura
      figura: fig-46.6
      ampliar: 3.55
      zonas:
        - { id: rp, rotulo: "Primera fila", rect: [0, 21, 320, 16] }
        - { id: rt, rotulo: "Segunda fila", rect: [0, 42, 320, 16] }
        - { id: cer, rotulo: "Tercera fila", rect: [0, 63, 320, 16] }
        - { id: ele, rotulo: "Cuarta fila", rect: [0, 84, 320, 16] }
        - { id: st, rotulo: "Quinta fila", rect: [0, 105, 320, 16] }
        - { id: rel, rotulo: "Séptima fila", rect: [0, 146, 320, 16] }
        - { id: con, rotulo: "Octava fila", rect: [0, 167, 320, 16] }
    leer:
      objetivo: V_nmin
      unidad: V
      tol: 0.02
      rotulo: "Tensión nominal mínima"
      errores:
        - { expr: "V_mal", texto: "Ha multiplicado: el raíl debe ser como mucho el 80 % de la nominal, así que la nominal es el raíl entre 0,8." }
    exito: "30 V: 24 es el 80 % de 30. El derating no es gratis (más tamaño y precio): fuerte donde el fallo es caro, moderado en el resto."
    escalera:
      - "24 V tienen que ser como mucho el 80 % de la nominal."
    solucion: "24 / 0,8 = 30 V."
    comprobar:
      - { V_nmin: 30, V_mal: 19.2 }

  - id: empareje-tabla
    tipo: tocar
    titulo: "Las cifras habituales"
    texto: "En la tabla de derating, toque todas las filas en las que se recomienda usar la mitad del nominal."
    libro: [78, 99]
    widget:
      tipo: figura
      figura: fig-46.6
      ampliar: 3.55
      zonas:
        - { id: rp, rotulo: "Primera fila", rect: [0, 21, 320, 16] }
        - { id: rt, rotulo: "Segunda fila", rect: [0, 42, 320, 16] }
        - { id: cer, rotulo: "Tercera fila", rect: [0, 63, 320, 16] }
        - { id: ele, rotulo: "Cuarta fila", rect: [0, 84, 320, 16] }
        - { id: st, rotulo: "Quinta fila", rect: [0, 105, 320, 16] }
        - { id: rel, rotulo: "Séptima fila", rect: [0, 146, 320, 16] }
        - { id: con, rotulo: "Octava fila", rect: [0, 167, 320, 16] }
    tocar:
      bien: [rp, cer, rel, con]
      todas: true
      porque:
        rt: "La tensión de una resistencia, al 80 %."
        ele: "El electrolítico, como mucho al 80 %, y sin mínimo."
        st: "La tensión de un semiconductor, del 70 al 80 %."
    exito: "La potencia de una resistencia, la tensión de un cerámico, la corriente de un relé y la de cada pin de un conector: el 50 %."
    escalera:
      - "Busque las barras que llegan a la mitad del eje."
    solucion: "Resistencia (potencia), cerámico, relé y conector."

  - id: pregunta-minimo
    tipo: pregunta
    titulo: "¿Un mínimo de tensión?"
    texto: "Circula la idea de que un electrolítico por debajo de la mitad de su tensión se degrada. ¿Qué dicen los datos?"
    libro: [80]
    widget:
      tipo: figura
      figura: fig-46.6
      zonas:
        - { id: electrolitico, rotulo: "Cuarta barra", rect: [0, 79, 320, 32] }
    opciones:
      - texto: "No hay mínimo: la fuga cae y la vida aumenta"
        bien: true
        porque: "Lo que degrada el óxido es pasar años sin ninguna tensión, no trabajar con poca."
      - texto: "Es cierto: la capa de óxido se adelgaza"
        porque: "Los datos de los fabricantes dicen lo contrario: la fuga cae al bajar la tensión."
      - texto: "Hay que usarlo siempre por encima del 80 %"
        porque: "Al revés: el 80 % es el máximo recomendado, no un mínimo."
    escalera:
      - "¿Qué le pasa a la fuga al bajar la tensión aplicada?"
    solucion: "No tiene mínimo: con menos tensión, menos fuga y más vida."

  - id: estime-union
    tipo: leer
    titulo: "La regla de los 10 °C"
    texto: "Con la regla práctica de duplicar la vida cada 10 °C, escriba por cuánto se multiplica al llevar la unión de 150 a 110 °C."
    libro: [81]
    fijar: { T_max: 150, T_d: 110, E_a: 0.7 }
    widget:
      tipo: grafica
      x: { id: tt, min: 80, max: 150, unidad: "°C", rotulo: "T_{j}" }
      y: { min: 0, max: 130, unidad: "", rotulo: "vida multiplicada" }
      curvas:
        - { expr: "exp(E_a*q_e/k_B*(1/(tt + 273.15) - 1/(T_max + 273.15)))", color: naranja, rotulo: "Arrhenius, 0,7 eV" }
        - { expr: "2^((T_max - tt)/10)", color: azul, rotulo: "el doble cada 10 °C", discontinua: true }
      mandos: []
    leer:
      objetivo: F_10
      unidad: ""
      tol: 0.02
      rotulo: "Vida multiplicada (regla de los 10 °C)"
      errores:
        - { expr: "F_ar", texto: "Eso es con Arrhenius y 0,7 eV; la regla práctica duplica cada 10 °C." }
        - { expr: "4", texto: "Ha contado los escalones de 10 °C; cada uno duplica: dos multiplicado cuatro veces." }
    exito: "Dieciséis con la regla práctica; unas siete con Arrhenius y 0,7 eV. Las dos dicen lo mismo: bajar la unión multiplica la vida."
    escalera:
      - "40 °C son cuatro escalones de 10 °C, y cada uno duplica."
    solucion: "2⁴ = 16."
    comprobar:
      - { F_10: 16 }

  - id: prediga-juntos
    tipo: predecir
    titulo: "Tres estreses juntos"
    texto: "Mismo componente: al 90 % de su tensión, a 100 °C y con ciclos diarios de 60 °C; o al 50 %, a 60 °C y estable. ¿Cuánto cambia su vida?"
    libro: [90]
    widget:
      tipo: figura
      figura: fig-46.5
      zonas:
        - { id: solape, rotulo: "Mancha bajo las dos curvas", rect: [116, 120, 36, 35] }
    opciones:
      - texto: "Órdenes de magnitud: los efectos se multiplican"
        bien: true
        porque: "Temperatura, tensión y ciclado actúan a la vez y su efecto es multiplicativo."
      - texto: "Lo que diga el peor de los tres"
        porque: "No manda uno solo: rara vez falla por un único factor."
      - texto: "La suma de los tres efectos por separado"
        porque: "No se suman: se multiplican, y la diferencia es de órdenes de magnitud."
    escalera:
      - "¿Se suman o se multiplican los efectos?"
    solucion: "Órdenes de magnitud: el efecto de los tres estreses es multiplicativo."

  - id: pregunta-picos
    tipo: leer
    fase: "En el banco"
    titulo: "En el banco"
    texto: "Un condensador de 25 V ve 20 V de media y picos de 24 V (valores de ejemplo). El derating se mide con los picos: escriba su porcentaje de uso."
    libro: [97]
    fijar: { V_c25: 25, V_med: 20, V_pic: 24 }
    widget:
      tipo: figura
      figura: fig-46.6
      ampliar: 3.55
      zonas:
        - { id: rp, rotulo: "Primera fila", rect: [0, 21, 320, 16] }
        - { id: rt, rotulo: "Segunda fila", rect: [0, 42, 320, 16] }
        - { id: cer, rotulo: "Tercera fila", rect: [0, 63, 320, 16] }
        - { id: ele, rotulo: "Cuarta fila", rect: [0, 84, 320, 16] }
        - { id: st, rotulo: "Quinta fila", rect: [0, 105, 320, 16] }
        - { id: rel, rotulo: "Séptima fila", rect: [0, 146, 320, 16] }
        - { id: con, rotulo: "Octava fila", rect: [0, 167, 320, 16] }
    leer:
      objetivo: u_pic
      unidad: "%"
      tol: 0.02
      rotulo: "Uso del condensador"
      errores:
        - { expr: "u_med", texto: "Esa es la media; el derating se comprueba con los picos, no solo con el valor medio." }
    exito: "Un 96 %: muy por encima del 80 %. Con la media habría parecido que cumplía."
    escalera:
      - "Pico entre nominal."
    solucion: "24 / 25 = 96 %."
    comprobar:
      - { u_pic: 96, u_med: 80 }

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [75, 76, 81, 93]
    ideas:
      - { titulo: "Lejos del límite.", texto: "Se falla por trabajar cerca del límite, no por trabajar mucho." }
      - { titulo: "Más que proporcional.", texto: "Al separar estrés y resistencia, la tasa de fallos se desploma." }
      - { titulo: "Las cifras.", texto: "Resistencias al 50 % de potencia; unión a 110 °C, no 150." }
      - { titulo: "Con criterio.", texto: "Fuerte donde el fallo es caro o peligroso." }
