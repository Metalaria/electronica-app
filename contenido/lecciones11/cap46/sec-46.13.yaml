# Lección 1.2 de la sección 47.13 «La Plaga de Condensadores: un Caso de Estudio Completo» (cap46; etiquetas
# sec-46.N = impresas 47.N).
# - La ESR frente a los meses de servicio y la secuencia del fallo (figura 47.21, fig-46.21), con zonas en las curvas.
# - La foto de la placa base (figura 47.22, fig-46.22): píxeles de la foto, 1 600 × 1 200.
# - Con la regla de Arrhenius (bloque 448), 20 °C más frío falla cuatro veces más tarde: los 10 meses de la figura
#   (fijados en la tarjeta) pasan a 40.
# Paso práctico: «tocar» en la foto el condensador reventado.
leccion: cap46/sec-46.13

libro:
  435: "condensadores electrolíticos que se hinchaban, reventaban y perdían capacidad mucho antes de su vida prevista"
  439: "faltaba el inhibidor adecuado"
  441: "La presión interna sube."
  442: "La válvula de alivio cede y sale electrolito"
  443: "La ESR se dispara al perderse electrolito"
  446: "las piezas defectuosas funcionaban al salir de fábrica"
  448: "cada 10 °C duplica la velocidad de degradación"
  450: "junto al regulador de la alimentación del procesador, y en la salida de las fuentes conmutadas"
  451: "Es realimentación positiva, y explica por qué fallaban esos y no los de señal."
  455: "Reinicios aleatorios bajo carga, cuando el consumo sube."
  458: "tapa abombada, hendiduras abiertas, costra marrón en la base o en la placa"
  463: "Tener dos proveedores no protege si ambos comparten la misma causa raíz."
  467: "Condensadores de polímero sólido en las posiciones críticas"
  473: "Las tapas ligeramente abombadas se ven bien con esa luz y no de frente."
  475: "Degradación de la ESR según la temperatura y la secuencia física del fallo."
  476: "uno reventado, que ha expulsado fuera de la cápsula su bobinado de lámina de aluminio y papel"

modelo:
  valores:
    t_c: { sim: "t", nombre: "meses hasta fallar en la caja caliente", unidad: "meses", valor: 10 }
    dT_f: { sim: "ΔT", nombre: "cuánto más frío", unidad: "°C", valor: 20 }
  calculos:
    t_f: { expr: "t_c*2^(dT_f/10)", sim: "t", nombre: "meses hasta fallar más frío", unidad: "meses", cifras: 2 }

tarjetas:
  - id: explore-esr
    tipo: explorar
    titulo: "La ESR que se dispara"
    texto: "Millones de electrolíticos fallaron mucho antes de su vida prevista. Toque cada curva."
    libro: [435, 443, 475]
    fijar: { dT_f: 20 }
    widget:
      tipo: figura
      figura: fig-46.21
      zonas:
        - { id: caliente, rotulo: "Curva roja oscura", rect: [32, 15, 40, 135], texto: "Lote defectuoso en una caja mal ventilada: la ESR cruza el umbral de fallo en unos meses." }
        - { id: frio, rotulo: "Curva naranja", rect: [120, 15, 90, 120], texto: "El mismo lote, 20 °C más frío: aguanta cuatro veces más." }
        - { id: correcto, rotulo: "Curva verde de abajo", rect: [140, 128, 90, 35], texto: "Un electrolítico correcto: su ESR apenas sube." }
        - { id: secuencia, rotulo: "Lista de la derecha", rect: [245, 20, 200, 105], texto: "La secuencia: falta el inhibidor, se genera hidrógeno, sube la presión, cede la válvula y la ESR se dispara." }
    requiere: { mover: [caliente, correcto, secuencia] }

  - id: ordene-secuencia
    tipo: pregunta
    titulo: "Qué ocurría físicamente"
    texto: "Ordene la secuencia del fallo de un electrolítico de la plaga."
    libro: [439, 441, 442, 443]
    widget:
      tipo: figura
      figura: fig-46.21
      zonas:
        - { id: curvas, rotulo: "La gráfica", rect: [20, 10, 210, 170] }
    ordenar:
      - "Falta el inhibidor en el electrolito"
      - "La reacción genera hidrógeno"
      - "Sube la presión y la tapa se abomba"
      - "Cede la válvula y sale electrolito"
      - "La ESR se dispara y el circuito falla"
    exito: "Esa secuencia explica todos los síntomas, de la tapa abombada a la costra."
    pistas:
      - { texto: "Primero la química del electrolito; al final, la ESR." }
    escalera:
      - "Sin inhibidor, la reacción se descontrola y genera gas."
    solucion: "Inhibidor que falta, hidrógeno, presión, válvula y ESR."

  - id: toque-reventado
    tipo: tocar
    titulo: "Una placa base con la plaga"
    texto: "Toque el condensador que ha reventado y ha expulsado su bobinado."
    libro: [458, 476]
    widget:
      tipo: figura
      figura: fig-46.22
      zonas:
        - { id: reventado, rotulo: "Rollo gris del centro", rect: [690, 540, 220, 260] }
        - { id: abombado, rotulo: "Condensador negro a su derecha", rect: [880, 470, 230, 190] }
        - { id: transistor, rotulo: "Encapsulado negro de abajo", rect: [900, 800, 210, 160] }
        - { id: bobina, rotulo: "Hilo de cobre de abajo", rect: [700, 950, 230, 170] }
    tocar:
      bien: [reventado]
      porque:
        abombado: "Tiene la tapa abombada y las hendiduras abiertas: está fallando, pero sigue entero."
        transistor: "Es un encapsulado de transistor de la fuente, no un electrolítico."
        bobina: "Es una bobina de la fuente conmutada, no un condensador."
    exito: "Ha expulsado fuera de la cápsula su bobinado de lámina de aluminio y papel."
    escalera:
      - "Busque un rollo de lámina fuera de su cápsula."
    solucion: "El rollo gris del centro."

  - id: porque-anos
    tipo: porque
    titulo: "Por qué tardó años"
    texto: "Las piezas defectuosas pasaban cualquier prueba de producción. ¿Por qué?"
    libro: [446]
    widget:
      tipo: figura
      figura: fig-46.21
      zonas:
        - { id: caliente, rotulo: "Curva roja oscura", rect: [32, 15, 40, 135] }
    opciones:
      - texto: "Funcionaban al salir: la degradación necesitaba tiempo y temperatura"
        bien: true
        porque: "Un desgaste acelerado, ni mortalidad infantil ni vida útil: la bañera nominal no lo contemplaba."
      - texto: "Porque las pruebas de producción estaban mal hechas"
        porque: "Ninguna prueba de producción podía verlo: en fábrica la pieza era buena."
      - texto: "Porque el burn-in las curaba"
        porque: "El burn-in elimina la mortalidad infantil; esto era un desgaste que llegaba después."
    escalera:
      - "¿Cuánto tiempo y calor necesita una reacción química lenta?"
    solucion: "Funcionaban en fábrica: fallaban con tiempo y temperatura."

  - id: estime-frio
    tipo: pregunta
    titulo: "Veinte grados más frío"
    texto: "Una placa de la plaga falla a los 10 meses en una caja mal ventilada. Con la regla de Arrhenius, ¿cuándo falla la misma 20 °C más fría?"
    libro: [448, 475]
    fijar: { t_c: 10, dT_f: 20 }
    widget:
      tipo: figura
      figura: fig-46.21
      zonas:
        - { id: frio, rotulo: "Curva naranja", rect: [120, 15, 90, 120] }
    estimar:
      objetivo: "t_f"
      unidad: "meses"
      min: 0
      max: 80
      paso: 1
      inicio: 20
      tol: 0.05
      rotulo: "Falla a los"
    exito: "A los 40 meses: la misma placa, en meses o en años según la ventilación."
    pistas:
      - { cuando: { valor: estimacion, mayor: 42 }, texto: "Demasiado: son dos saltos de 10 °C; cada uno duplica." }
      - { texto: "Demasiado poco: 20 °C son dos saltos de 10, y cada uno duplica; no sume, multiplique." }
    escalera:
      - "Cada 10 °C menos, la degradación va la mitad de rápido."
    solucion: "Dos saltos de 10 °C, cada uno el doble: de 10 a 40 meses."
    comprobar:
      - { t_f: 40 }

  - id: pregunta-donde
    tipo: pregunta
    titulo: "Dónde fallaban"
    texto: "Los afectados reventaban junto al regulador del procesador y en la salida de las fuentes conmutadas, no en las señales. ¿Por qué?"
    libro: [450, 451]
    widget:
      tipo: figura
      figura: fig-46.21
      zonas:
        - { id: porque, rotulo: "Recuadro naranja de la derecha", rect: [250, 138, 195, 70] }
    opciones:
      - texto: "Mucho rizado: más ESR, más calor, más degradación"
        bien: true
        porque: "Es realimentación positiva: el que empieza a degradarse se calienta más y se degrada más deprisa."
      - texto: "Porque allí la tensión es más alta"
        porque: "No es la tensión: es la corriente de rizado, que calienta por la ESR."
      - texto: "Porque eran de otro fabricante"
        porque: "Los de señal podían ser del mismo lote: la diferencia es el rizado que soportaban."
    escalera:
      - "¿Qué calienta un condensador desde dentro?"
    solucion: "La corriente de rizado por la ESR, con realimentación positiva."

  - id: pregunta-sintoma
    tipo: pregunta
    titulo: "Los síntomas"
    texto: "Un ordenador antiguo se reinicia al azar cuando sube el consumo. ¿Qué mirar primero?"
    libro: [455, 458]
    widget:
      tipo: figura
      figura: fig-46.22
      zonas:
        - { id: placa, rotulo: "La placa entera", rect: [0, 0, 1600, 1200] }
    opciones:
      - texto: "Los electrolíticos de la alimentación: tapa abombada o costra"
        bien: true
        porque: "Reinicios bajo carga son un síntoma de la plaga; el diagnóstico visual es inmediato."
      - texto: "El programa: es un fallo de software"
        porque: "Que dependa de la carga apunta a la alimentación, no al programa."
      - texto: "Los condensadores de señal"
        porque: "Fallaban los de la alimentación, con mucho rizado, no los de señal."
    escalera:
      - "¿Qué cambia en la placa cuando sube el consumo?"
    solucion: "Los electrolíticos junto al regulador y en la salida de la fuente."

  - id: prediga-segunda
    tipo: predecir
    titulo: "La segunda fuente"
    texto: "Un fabricante de placas compraba condensadores a dos proveedores. ¿Le protegió de la plaga?"
    libro: [463]
    widget:
      tipo: figura
      figura: fig-46.21
      zonas:
        - { id: secuencia, rotulo: "Lista de la derecha", rect: [245, 20, 200, 105] }
    opciones:
      - texto: "No si ambos compartían el origen de la formulación"
        bien: true
        porque: "La segunda fuente protege de la descatalogación, no de un defecto común."
      - texto: "Sí: la mitad de sus placas quedaron a salvo"
        porque: "Varios fabricantes compartían el origen de la formulación: el defecto era común."
      - texto: "Sí, del todo: dos proveedores nunca fallan a la vez"
        porque: "Fallan a la vez si comparten la causa raíz."
    escalera:
      - "¿Qué tenían en común los dos proveedores?"
    solucion: "No: compartían la misma causa raíz."

  - id: pregunta-hoy
    tipo: pregunta
    titulo: "Qué se hace hoy distinto"
    texto: "¿Qué se pone hoy en las posiciones críticas de una placa base?"
    libro: [467]
    widget:
      tipo: figura
      figura: fig-46.22
      zonas:
        - { id: reventado, rotulo: "Rollo gris del centro", rect: [690, 540, 220, 260] }
    opciones:
      - texto: "Condensadores de polímero sólido"
        bien: true
        porque: "Sin electrolito líquido que se seque o se descomponga, y con ESR muy baja y estable."
      - texto: "Electrolíticos de más capacidad"
        porque: "Más capacidad no quita el electrolito líquido, que es lo que fallaba."
      - texto: "Electrolíticos de tensión mucho mayor"
        porque: "El problema era la formulación, no la tensión."
    escalera:
      - "¿Qué parte del condensador fallaba?"
    solucion: "Polímero sólido: sin electrolito líquido."

  - id: pregunta-banco
    tipo: pregunta
    titulo: "En el banco"
    texto: "Se revisan los electrolíticos de un equipo antiguo. ¿Cómo se ven mejor las tapas ligeramente abombadas?"
    libro: [473]
    widget:
      tipo: figura
      figura: fig-46.22
      zonas:
        - { id: abombado, rotulo: "Condensador negro a la derecha", rect: [880, 470, 230, 190] }
    opciones:
      - texto: "Con luz rasante, no de frente"
        bien: true
        porque: "La luz rasante marca el relieve; luego, la ESR en circuito dice cuáles están fuera."
      - texto: "De frente, con mucha luz"
        porque: "De frente se pierde el relieve de una tapa apenas abombada."
      - texto: "Midiendo la capacidad fuera del circuito"
        porque: "La inspección es visual con luz rasante y, después, la ESR en circuito."
    escalera:
      - "¿Qué luz hace visible un relieve pequeño?"
    solucion: "Con luz rasante."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [439, 446, 451, 463]
    ideas:
      - { titulo: "La causa.", texto: "Faltaba el inhibidor: hidrógeno, presión, válvula y ESR disparada." }
      - { titulo: "Tardó años.", texto: "Funcionaban en fábrica; el calor aceleraba el desgaste." }
      - { titulo: "Dónde.", texto: "Con mucho rizado: más ESR, más calor, más degradación." }
      - { titulo: "La cadena de suministro.", texto: "Dos proveedores con la misma causa raíz no protegen." }
