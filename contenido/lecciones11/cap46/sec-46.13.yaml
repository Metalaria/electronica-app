# Lección 1.2 de la sección 47.13 «La Plaga de Condensadores: un Caso de Estudio Completo» (cap46; etiquetas
# sec-46.N = impresas 47.N).
# - La ESR frente a los meses de servicio y la secuencia del fallo (figura 47.21, fig-46.21), con zonas en las curvas.
# - La foto de la placa base (figura 47.22, fig-46.22): píxeles de la foto, 1 600 × 1 200.
# - Con la regla de Arrhenius (bloque 448), 20 °C más frío falla cuatro veces más tarde: los 10 meses de la figura
#   (fijados en la tarjeta) pasan a 40.
# Paso práctico: «tocar» en la foto el condensador reventado.
# 1.2.1 (autor121-pc, «aprender haciendo», GUIA §13): la placa se enfría con una meta hasta aguantar 40 meses
# (Arrhenius ×2 cada 10 °C desde 10 meses) y se escribe lo que pasaría 10 °C más caliente; la secuencia del fallo se
# toca en orden en la figura 47.21 y la razón de dónde reventaban, en su recuadro; en la foto 47.22 se tocan el
# reventado y el abombado. Quedan dos preguntas de opciones (por qué pasaban la prueba y la segunda fuente).
leccion: cap46/sec-46.13

libro:
  435: "condensadores electrolíticos que se hinchaban, reventaban y perdían capacidad mucho antes de su vida prevista"
  439: "faltaba el inhibidor adecuado"
  438: "repara la capa de óxido que actúa de dieléctrico"
  441: "La presión interna sube."
  442: "La válvula de alivio cede y sale electrolito"
  443: "La ESR se dispara al perderse electrolito"
  446: "las piezas defectuosas funcionaban al salir de fábrica"
  448: "cada 10 °C duplica la velocidad de degradación"
  450: "junto al regulador de la alimentación del procesador, y en la salida de las fuentes conmutadas"
  451: "Es realimentación positiva, y explica por qué fallaban esos y no los de señal."
  454: "El equipo no arranca, o arranca a veces."
  455: "Reinicios aleatorios bajo carga, cuando el consumo sube."
  458: "tapa abombada, hendiduras abiertas, costra marrón en la base o en la placa"
  463: "Tener dos proveedores no protege si ambos comparten la misma causa raíz."
  467: "Condensadores de polímero sólido en las posiciones críticas"
  472: "mirar sus electrolíticos con luz rasante"
  473: "Las tapas ligeramente abombadas se ven bien con esa luz y no de frente."
  475: "Degradación de la ESR según la temperatura y la secuencia física del fallo."
  476: "uno reventado, que ha expulsado fuera de la cápsula su bobinado de lámina de aluminio y papel"

modelo:
  valores:
    t_c: { sim: "t", nombre: "meses hasta fallar en la caja caliente", unidad: "meses", valor: 10 }
    dT_f: { sim: "ΔT", nombre: "cuánto más frío", unidad: "°C", valor: 0 }
  calculos:
    t_f: { expr: "t_c*2^(dT_f/10)", sim: "t", nombre: "meses hasta fallar más frío", unidad: "meses", cifras: 2 }
    t_h: { expr: "t_c/2", sim: "t", nombre: "meses hasta fallar 10 °C más caliente", unidad: "meses", cifras: 2 }

tarjetas:
  - id: estime-frio
    tipo: explorar
    fase: "Consiga"
    titulo: "Más frío, más vida"
    texto: "Una placa de la plaga falla a los 10 meses en una caja mal ventilada. Enfríe la caja hasta que aguante 40 meses."
    libro: [435, 446, 448, 475]
    fijar: { t_c: 10 }
    inicio: { dT_f: 0 }
    widget:
      tipo: grafica
      x: { id: dd, min: 0, max: 30, unidad: "°C", rotulo: "cuánto más frío" }
      y: { min: 0, max: 90, unidad: "meses", rotulo: "hasta fallar" }
      curvas:
        - { expr: "t_c*2^(dd/10)", color: naranja, rotulo: "el doble cada 10 °C" }
      marcas:
        - { x: "dT_f", y: "t_f", rotulo: "{{t_f}}" }
      lectura: { valor: t_f, rotulo: "Meses hasta fallar" }
      mandos:
        - { valor: dT_f, min: 0, max: 30, paso: 5, rotulo: "Cuánto más fría, ΔT" }
    objetivo:
      condiciones:
        - { valor: t_f, min: 40, rotulo: "Aguanta: {{t_f}}" }
      logrado: "{{dT_f}} más fría: {{t_f}}. Por eso golpeó primero a las unidades que trabajaban más calientes o más horas."
      pistas:
        - { texto: "Todavía falla pronto: enfríela más." }
    escalera:
      - "Cada 10 °C duplica la velocidad de degradación: 40 meses son cuatro veces 10."
    solucion: "20 °C más fría: 40 meses."
    comprobar:
      - { con: { dT_f: 20 }, t_f: 40 }

  - id: lea-caliente
    tipo: leer
    titulo: "Diez grados más"
    texto: "Con la misma regla, escriba cuántos meses aguantaría esa placa en una caja 10 °C más caliente que la mal ventilada."
    libro: [448]
    fijar: { t_c: 10 }
    widget:
      tipo: grafica
      x: { id: dd, min: -10, max: 30, unidad: "°C", rotulo: "cuánto más frío" }
      y: { min: 0, max: 90, unidad: "meses", rotulo: "hasta fallar" }
      curvas:
        - { expr: "t_c*2^(dd/10)", color: naranja, rotulo: "el doble cada 10 °C" }
      mandos: []
    leer:
      objetivo: t_h
      unidad: "meses"
      tol: 0.03
      rotulo: "Meses hasta fallar"
      errores:
        - { expr: "t_c*2", texto: "Eso sería 10 °C más fría: más calor, menos vida." }
    exito: "Cinco meses: cada 10 °C más, la degradación va el doble de rápido."
    escalera:
      - "Más calor, la mitad de vida por cada 10 °C."
    solucion: "La mitad de 10 meses: 5 meses."
    comprobar:
      - { t_h: 5 }

  - id: ordene-secuencia
    tipo: tocar
    fase: "Ordene"
    titulo: "La secuencia del fallo"
    texto: "En la lista de la derecha, toque los pasos del fallo de un electrolítico de la plaga en el orden en que ocurren."
    libro: [438, 439, 441, 442, 443, 475]
    widget:
      tipo: figura
      figura: fig-46.21
      zonas:
        - { id: s5, rotulo: "Quinta línea de la lista", rect: [248, 105, 196, 18] }
        - { id: s2, rotulo: "Segunda línea de la lista", rect: [248, 41, 196, 18] }
        - { id: s4, rotulo: "Cuarta línea de la lista", rect: [248, 83, 196, 18] }
        - { id: s1, rotulo: "Primera línea de la lista", rect: [248, 20, 196, 18] }
        - { id: s3, rotulo: "Tercera línea de la lista", rect: [248, 62, 196, 18] }
    tocar:
      bien: [s1, s2, s3, s4, s5]
      orden: true
    pistas:
      - { texto: "Todo empieza en la formulación; lo último es que el circuito falla." }
    exito: "Falta el inhibidor, se genera hidrógeno, la tapa se abomba, cede la válvula y la ESR se dispara: el circuito falla."
    escalera:
      - "Del electrolito mal formulado a la ESR disparada."
    solucion: "Inhibidor, hidrógeno, presión, válvula y ESR."

  - id: toque-reventado
    tipo: tocar
    titulo: "Una placa base con la plaga"
    texto: "Toque el condensador que ha reventado y ha expulsado su bobinado."
    libro: [458, 476, 467]
    widget:
      tipo: figura
      figura: fig-46.22
      zonas:
        - { id: reventado, rotulo: "Rollo gris del centro", rect: [690, 540, 220, 260] }
        - { id: abombado, rotulo: "Condensador negro a su derecha", rect: [880, 470, 230, 190] }
        - { id: transistor, rotulo: "Encapsulado negro de abajo", rect: [900, 800, 210, 160] }
        - { id: bobina, rotulo: "Hilo de cobre de abajo", rect: [700, 950, 230, 170] }
    tocar:
      bien: [reventado]
      porque:
        abombado: "Tiene la tapa abombada y las hendiduras abiertas: está fallando, pero sigue entero."
        transistor: "Es un encapsulado de transistor de la fuente, no un electrolítico."
        bobina: "Es una bobina de la fuente conmutada, no un condensador."
    exito: "Ha expulsado fuera de la cápsula su bobinado de lámina de aluminio y papel. Hoy, en esas posiciones, polímero sólido: sin electrolito líquido."
    escalera:
      - "Busque un rollo de lámina fuera de su cápsula."
    solucion: "El rollo gris del centro."

  - id: porque-anos
    tipo: porque
    titulo: "Por qué tardó años"
    texto: "Las piezas defectuosas pasaban cualquier prueba de producción. ¿Por qué?"
    libro: [446]
    widget:
      tipo: figura
      figura: fig-46.21
      zonas:
        - { id: caliente, rotulo: "Curva roja oscura", rect: [32, 15, 40, 135] }
    opciones:
      - texto: "Funcionaban al salir: la degradación necesitaba tiempo y temperatura"
        bien: true
        porque: "Un desgaste acelerado, ni mortalidad infantil ni vida útil: la bañera nominal no lo contemplaba."
      - texto: "Porque las pruebas de producción estaban mal hechas"
        porque: "Ninguna prueba de producción podía verlo: en fábrica la pieza era buena."
      - texto: "Porque el burn-in las curaba"
        porque: "El burn-in elimina la mortalidad infantil; esto era un desgaste que llegaba después."
    escalera:
      - "¿Cuánto tiempo y calor necesita una reacción química lenta?"
    solucion: "Funcionaban en fábrica: fallaban con tiempo y temperatura."

  - id: pregunta-donde
    tipo: tocar
    titulo: "Dónde fallaban"
    texto: "Los de la plaga reventaban junto al regulador del procesador y en la salida de las fuentes conmutadas, no en las señales. Toque lo que lo explica."
    libro: [450, 451, 475]
    widget:
      tipo: figura
      figura: fig-46.21
      zonas:
        - { id: grafica, rotulo: "La gráfica", rect: [20, 10, 210, 170] }
        - { id: lista, rotulo: "La lista de la derecha", rect: [245, 15, 199, 110] }
        - { id: caja, rotulo: "El recuadro de abajo a la derecha", rect: [250, 138, 194, 72] }
    tocar:
      bien: [caja]
      porque:
        grafica: "La gráfica enseña el efecto de la temperatura, no por qué esos puntos se calientan más."
        lista: "La secuencia es igual en cualquier posición: no dice dónde."
    exito: "Ahí circula mucho rizado: más ESR, más calor, más degradación. Realimentación positiva, y por eso esos y no los de señal."
    escalera:
      - "¿Qué calienta a un condensador desde dentro?"
    solucion: "El recuadro de abajo: mucho rizado, realimentación positiva."

  - id: pregunta-sintoma
    tipo: tocar
    fase: "En el banco"
    titulo: "Reinicios bajo carga"
    texto: "Un ordenador antiguo se reinicia al azar cuando sube el consumo. Antes de medir nada, toque el condensador que lo explica."
    libro: [454, 455, 458, 472, 473, 476]
    widget:
      tipo: figura
      figura: fig-46.22
      zonas:
        - { id: reventado, rotulo: "Rollo gris del centro", rect: [690, 540, 220, 260] }
        - { id: abombado, rotulo: "Condensador negro a su derecha", rect: [880, 470, 230, 190] }
        - { id: transistor, rotulo: "Encapsulado negro de abajo", rect: [900, 800, 210, 160] }
        - { id: bobina, rotulo: "Hilo de cobre de abajo", rect: [700, 950, 230, 170] }
    tocar:
      bien: [abombado]
      porque:
        reventado: "Ese ya ha reventado: está claro, pero el que da reinicios mientras aún funciona es otro."
        transistor: "Es un encapsulado de transistor de la fuente, no un electrolítico."
        bobina: "Es una bobina de la fuente conmutada, no un condensador."
    exito: "La tapa abombada, con las hendiduras abiertas. Con luz rasante se ven mejor que de frente, y su ESR medida en circuito confirma cuáles están fuera."
    escalera:
      - "Busque una tapa que no esté plana."
    solucion: "El condensador negro con la tapa abombada."

  - id: prediga-segunda
    tipo: predecir
    titulo: "La segunda fuente"
    texto: "Un fabricante de placas compraba condensadores a dos proveedores. ¿Le protegió de la plaga?"
    libro: [463]
    widget:
      tipo: figura
      figura: fig-46.21
      zonas:
        - { id: secuencia, rotulo: "Lista de la derecha", rect: [245, 20, 200, 105] }
    opciones:
      - texto: "No si ambos compartían el origen de la formulación"
        bien: true
        porque: "La segunda fuente protege de la descatalogación, no de un defecto común."
      - texto: "Sí: la mitad de sus placas quedaron a salvo"
        porque: "Varios fabricantes compartían el origen de la formulación: el defecto era común."
      - texto: "Sí, del todo: dos proveedores nunca fallan a la vez"
        porque: "Fallan a la vez si comparten la causa raíz."
    escalera:
      - "¿Qué tenían en común los dos proveedores?"
    solucion: "No: compartían la misma causa raíz."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [439, 446, 451, 463]
    ideas:
      - { titulo: "La causa.", texto: "Faltaba el inhibidor: hidrógeno, presión, válvula y ESR disparada." }
      - { titulo: "Tardó años.", texto: "Funcionaban en fábrica; el calor aceleraba el desgaste." }
      - { titulo: "Dónde.", texto: "Con mucho rizado: más ESR, más calor, más degradación." }
      - { titulo: "La cadena de suministro.", texto: "Dos proveedores con la misma causa raíz no protegen." }
