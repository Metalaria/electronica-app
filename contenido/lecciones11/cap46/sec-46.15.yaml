# Lección 1.2 de la sección 47.15 «Ensayos Acelerados: HALT y HASS» (cap46; etiquetas sec-46.N = impresas 47.N).
# - Los límites operativo y destructivo de un HALT y el ciclado del HASS (figura 47.24, fig-46.24), con zonas en las
#   marcas del dibujo (círculos y aspas) y en los paneles.
# - Sin modelo numérico (las cifras de la figura no van en el texto; los 70 y 75 °C son del bloque 530).
# Paso práctico: «tocar» en la figura 47.24 el límite operativo de calor.
leccion: cap46/sec-46.15

libro:
  519: "Los ensayos acelerados provocan los fallos antes, y tienen dos usos que conviene no confundir."
  521: "pretende romper el producto para descubrir dónde está su punto débil"
  526: "Combinación de temperatura y vibración, que es donde aparecen los fallos que ninguno por separado provoca."
  528: "El límite operativo: la condición en que el producto deja de funcionar y se recupera al volver a la normalidad."
  529: "El límite destructivo: donde el daño es permanente."
  530: "Un producto especificado hasta 70 °C que falla a 75 °C no tiene margen, aunque cumpla."
  534: "Se corrige lo barato y se acepta lo caro, conscientemente."
  535: "Se repite tras las correcciones"
  537: "con estreses por debajo del límite operativo hallado en el HALT"
  538: "forzar que las unidades con defectos latentes fallen en la fábrica en lugar de en el cliente"
  539: "Demasiado suave no criba nada; demasiado fuerte envejece las unidades buenas."
  542: "un congelador doméstico da −20 °C y un horno a temperatura baja da +60 u 80 °C"
  548: "por eso criba en minutos lo que el burn-in tardaría días en revelar"
  549: "el burn-in es más barato de montar, el HASS más eficaz por unidad de tiempo"
  552: "Lo que falle será casi siempre una soldadura, un conector o un componente cerca de su límite"
  553: "Límites operativo y destructivo en un HALT, y la diferencia con el HASS."

modelo: { valores: {}, calculos: {} }

tarjetas:
  - id: explore-halt
    tipo: explorar
    titulo: "Romper para aprender"
    texto: "Dos ensayos acelerados con usos que no hay que confundir. Toque cada panel y el margen."
    libro: [519, 553, 521, 537]
    widget:
      tipo: figura
      figura: fig-46.24
      zonas:
        - { id: halt, rotulo: "Escalones del panel de la izquierda", rect: [34, 86, 255, 114], texto: "HALT: escalones de frío y de calor en un prototipo, hasta el fallo." }
        - { id: margen, rotulo: "Flecha doble del centro", rect: [152, 48, 36, 35], texto: "El margen real: de la especificación al límite operativo." }
        - { id: hass, rotulo: "Panel de la derecha", rect: [305, 15, 137, 185], texto: "HASS: ciclos rápidos en cada unidad, por debajo del límite operativo hallado en el HALT." }
    requiere: { mover: [halt, hass] }

  - id: pregunta-proposito
    tipo: pregunta
    titulo: "Qué busca un HALT"
    texto: "Un HALT aplica estreses crecientes, más allá de la especificación. ¿Para qué?"
    libro: [521, 526]
    widget:
      tipo: figura
      figura: fig-46.24
      zonas:
        - { id: halt, rotulo: "Panel grande de la izquierda", rect: [34, 15, 255, 120] }
    opciones:
      - texto: "Para romper el producto y descubrir su punto débil"
        bien: true
        porque: "No simula el uso real; la combinación de temperatura y vibración revela lo que ninguna sola provoca."
      - texto: "Para simular años de uso real"
        porque: "No pretende simular el uso: pretende romper y encontrar el punto débil."
      - texto: "Para cribar cada unidad fabricada"
        porque: "Eso es el HASS; el HALT se hace con prototipos, hasta el fallo."
    escalera:
      - "¿Se hace con prototipos o con cada unidad?"
    solucion: "Romper el producto para descubrir dónde está su punto débil."

  - id: empareje-limites
    tipo: pregunta
    titulo: "Los dos límites"
    texto: "Empareje cada resultado del HALT con su significado."
    libro: [528, 529, 530]
    widget:
      tipo: figura
      figura: fig-46.24
      zonas:
        - { id: halt, rotulo: "Panel grande de la izquierda", rect: [34, 15, 255, 120] }
    emparejar:
      - ["Límite operativo", "Deja de funcionar y se recupera"]
      - ["Límite destructivo", "El daño es permanente"]
      - ["Margen real", "De la especificación al límite operativo"]
    exito: "El margen real es lo que de verdad protege al producto en campo."
    pistas:
      - { texto: "Los círculos se recuperan; las aspas, no." }
    escalera:
      - "¿Cuál de los dos límites deja el producto inservible?"
    solucion: "Operativo, se recupera; destructivo, daño permanente; margen, de la especificación al operativo."

  - id: toque-operativo
    tipo: tocar
    titulo: "El límite operativo de calor"
    texto: "Subiendo la temperatura, el prototipo deja de funcionar y se recupera al volver a la normalidad. Toque ese punto."
    libro: [528, 553]
    widget:
      tipo: figura
      figura: fig-46.24
      zonas:
        - { id: circulo-calor, rotulo: "Marca redonda de arriba", rect: [237, 35, 35, 35] }
        - { id: aspa-calor, rotulo: "Aspa de arriba", rect: [265, 15, 35, 35] }
        - { id: circulo-frio, rotulo: "Marca redonda de abajo", rect: [100, 152, 35, 35] }
        - { id: aspa-frio, rotulo: "Aspa de abajo", rect: [126, 166, 35, 35] }
    tocar:
      bien: [circulo-calor]
      porque:
        aspa-calor: "Es el límite destructivo de calor: ahí el daño ya es permanente."
        circulo-frio: "Es el límite operativo, pero de frío, en los escalones de bajada."
        aspa-frio: "Es el límite destructivo de frío."
    exito: "El círculo de arriba: desde la especificación hasta ahí va el margen real del diseño."
    escalera:
      - "Los círculos se recuperan; las aspas, no. Busque el de calor."
    solucion: "La marca redonda de arriba, en los escalones de calor."

  - id: prediga-margen
    tipo: predecir
    titulo: "Cumplir no es tener margen"
    texto: "Un producto especificado hasta 70 °C falla a 75 °C. ¿Es un buen resultado?"
    libro: [530]
    widget:
      tipo: figura
      figura: fig-46.24
      zonas:
        - { id: margen, rotulo: "Flecha doble del centro", rect: [152, 48, 36, 35] }
    opciones:
      - texto: "No: cumple, pero no tiene margen"
        bien: true
        porque: "La distancia entre la especificación y el límite operativo es el margen real, y aquí es mínima."
      - texto: "Sí: cumple su especificación"
        porque: "Cumplir no basta: cualquier dispersión o envejecimiento lo deja fuera."
      - texto: "Solo si el fallo es destructivo"
        porque: "Aunque se recupere, un límite operativo tan cerca dice que el margen es insuficiente."
    escalera:
      - "¿Cuánto margen hay entre 70 y 75 °C?"
    solucion: "No tiene margen, aunque cumpla."

  - id: pregunta-hallazgos
    tipo: pregunta
    titulo: "Qué se hace con los hallazgos"
    texto: "El HALT ha encontrado varios límites. ¿Hay que mejorarlos todos?"
    libro: [534, 535]
    widget:
      tipo: figura
      figura: fig-46.24
      zonas:
        - { id: halt, rotulo: "Panel grande de la izquierda", rect: [34, 15, 255, 120] }
    opciones:
      - texto: "No: se corrige lo barato, se acepta lo caro a conciencia y se repite"
        bien: true
        porque: "Repetir confirma que el margen ha subido y que el problema no se ha ido a otro sitio."
      - texto: "Sí, todos, hasta que ninguno falle"
        porque: "No todos lo merecen: un límite destructivo a 110 °C en un producto de interior es aceptable."
      - texto: "Ninguno: el HALT va más allá de la especificación"
        porque: "Lo que falta de margen sí se corrige si es barato."
    escalera:
      - "¿Merece la pena corregir algo que nunca ocurrirá en uso?"
    solucion: "Corregir lo barato, aceptar lo caro conscientemente y repetir."

  - id: porque-hass
    tipo: porque
    titulo: "El compromiso del HASS"
    texto: "El HASS se aplica a cada unidad. ¿Por qué no puede ser ni muy suave ni muy fuerte?"
    libro: [537, 538, 539]
    widget:
      tipo: figura
      figura: fig-46.24
      zonas:
        - { id: hass, rotulo: "Panel de la derecha", rect: [305, 15, 137, 185] }
    opciones:
      - texto: "Suave no criba nada; fuerte envejece las unidades buenas"
        bien: true
        porque: "El estrés consume vida útil: se diseña con los datos del HALT, por debajo del límite operativo."
      - texto: "Porque fuerte es más caro de aplicar"
        porque: "El problema no es el precio: un estrés excesivo consume la vida de las buenas."
      - texto: "Porque suave tarda más"
        porque: "Suave no tarda más: simplemente no hace fallar a las defectuosas."
    escalera:
      - "¿Qué le pasa a una unidad buena sometida a demasiado estrés?"
    solucion: "Demasiado suave no criba; demasiado fuerte envejece las buenas."

  - id: pregunta-burnin
    tipo: pregunta
    titulo: "HASS o burn-in"
    texto: "Los dos atacan la mortalidad infantil. ¿En qué se diferencian?"
    libro: [548, 549]
    widget:
      tipo: figura
      figura: fig-46.24
      zonas:
        - { id: hass, rotulo: "Panel de la derecha", rect: [305, 15, 137, 185] }
    opciones:
      - texto: "El HASS aplica estrés y criba en minutos lo que el burn-in tarda días"
        bien: true
        porque: "El burn-in es más barato de montar; el HASS, más eficaz por unidad de tiempo."
      - texto: "El burn-in rompe el producto; el HASS no"
        porque: "Ninguno pretende romper unidades buenas: eso es el HALT, con prototipos."
      - texto: "En nada: son el mismo ensayo"
        porque: "El burn-in es solo funcionamiento, como mucho algo caliente; el HASS aplica estrés."
    escalera:
      - "¿Cuál de los dos aplica estrés más allá del funcionamiento?"
    solucion: "El HASS aplica estrés y criba mucho más deprisa."

  - id: pregunta-banco
    tipo: pregunta
    titulo: "Sin cámara climática"
    texto: "Veinte ciclos entre un congelador doméstico y un horno a temperatura baja, con el equipo alimentado. ¿Qué suele aparecer?"
    libro: [542, 552]
    widget:
      tipo: figura
      figura: fig-46.24
      zonas:
        - { id: hass, rotulo: "Panel de la derecha", rect: [305, 15, 137, 185] }
    opciones:
      - texto: "Una soldadura, un conector o un componente cerca de su límite"
        bien: true
        porque: "Encontrarlo así es incomparablemente más barato que encontrarlo instalado."
      - texto: "Nada: sin cámara no es un ensayo válido"
        porque: "Un congelador y un horno bastan para revelar soldaduras marginales."
      - texto: "Errores del programa"
        porque: "El ciclado térmico revela problemas mecánicos y de margen, no de software."
    escalera:
      - "¿Qué fatiga el ciclado térmico?"
    solucion: "Casi siempre una soldadura, un conector o un componente cerca de su límite."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [521, 528, 530, 537]
    ideas:
      - { titulo: "HALT.", texto: "Romper un prototipo para encontrar su punto débil." }
      - { titulo: "Dos límites.", texto: "Operativo, se recupera; destructivo, daño permanente." }
      - { titulo: "Margen real.", texto: "De la especificación al límite operativo: cumplir no basta." }
      - { titulo: "HASS.", texto: "Cribar cada unidad por debajo del límite operativo." }
