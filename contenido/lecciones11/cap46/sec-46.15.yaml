# Lección 1.2 de la sección 47.15 «Ensayos Acelerados: HALT y HASS» (cap46; etiquetas sec-46.N = impresas 47.N).
# - Los límites operativo y destructivo de un HALT y el ciclado del HASS (figura 47.24, fig-46.24), con zonas en las
#   marcas del dibujo (círculos y aspas) y en los paneles.
# 1.2.1: modelo pequeño con las cifras del texto: especificado hasta 70 °C y límite operativo a 75 °C (bloque 530),
#   margen = T_op − T_esp; el banco entre el congelador (−20 °C) y el horno (+80 °C) del bloque 542.
#   Se tocan en la figura los límites (círculos y aspas) y la línea que el HASS no cruza; se leen el margen y el salto
#   del ciclado; el explorar pide subir el margen al repetir el HALT tras corregir (bloque 535).
leccion: cap46/sec-46.15

libro:
  519: "Los ensayos acelerados provocan los fallos antes, y tienen dos usos que conviene no confundir."
  521: "pretende romper el producto para descubrir dónde está su punto débil"
  526: "Combinación de temperatura y vibración, que es donde aparecen los fallos que ninguno por separado provoca."
  528: "El límite operativo: la condición en que el producto deja de funcionar y se recupera al volver a la normalidad."
  529: "El límite destructivo: donde el daño es permanente."
  530: "Un producto especificado hasta 70 °C que falla a 75 °C no tiene margen, aunque cumpla."
  534: "Se corrige lo barato y se acepta lo caro, conscientemente."
  535: "Se repite tras las correcciones"
  537: "con estreses por debajo del límite operativo hallado en el HALT"
  538: "forzar que las unidades con defectos latentes fallen en la fábrica en lugar de en el cliente"
  539: "Demasiado suave no criba nada; demasiado fuerte envejece las unidades buenas."
  542: "un congelador doméstico da −20 °C y un horno a temperatura baja da +60 u 80 °C"
  548: "por eso criba en minutos lo que el burn-in tardaría días en revelar"
  549: "el burn-in es más barato de montar, el HASS más eficaz por unidad de tiempo"
  551: "veinte ciclos entre el congelador y una habitación caliente, con el equipo alimentado y registrando datos"
  552: "Lo que falle será casi siempre una soldadura, un conector o un componente cerca de su límite"
  553: "Límites operativo y destructivo en un HALT, y la diferencia con el HASS."

modelo:
  valores:
    T_esp: { sim: "T_{esp}", nombre: "temperatura especificada", unidad: "°C", valor: 70 }
    T_op: { sim: "T_{op}", nombre: "límite operativo hallado", unidad: "°C", valor: 75 }
    T_cong: { sim: "T_{cong}", nombre: "congelador doméstico", unidad: "°C", valor: -20 }
    T_horno: { sim: "T_{horno}", nombre: "horno a temperatura baja", unidad: "°C", valor: 80 }
  calculos:
    margen: { expr: "T_op - T_esp", sim: "margen", nombre: "margen real del diseño", unidad: "°C" }
    salto: { expr: "T_horno - T_cong", sim: "ΔT", nombre: "salto de cada ciclo", unidad: "°C" }

tarjetas:
  - id: toque-operativo
    tipo: tocar
    titulo: "El límite operativo de calor"
    texto: "Un HALT sube la temperatura en escalones hasta que el prototipo deja de funcionar y se recupera al volver a la normalidad. Toque ese punto en los escalones de calor."
    libro: [519, 521, 528, 553]
    widget:
      tipo: figura
      figura: fig-46.24
      zonas:
        - { id: circulo-calor, rotulo: "Marca redonda de arriba", rect: [237, 35, 35, 35] }
        - { id: aspa-calor, rotulo: "Aspa de arriba", rect: [265, 15, 35, 35] }
        - { id: circulo-frio, rotulo: "Marca redonda de abajo", rect: [100, 152, 35, 35] }
        - { id: aspa-frio, rotulo: "Aspa de abajo", rect: [126, 166, 35, 35] }
    tocar:
      bien: [circulo-calor]
      porque:
        aspa-calor: "Es el límite destructivo de calor: ahí el daño ya es permanente."
        circulo-frio: "Es el límite operativo, pero de frío, en los escalones de bajada."
        aspa-frio: "Es el límite destructivo de frío."
    exito: "El círculo de arriba: desde la especificación hasta ahí va el margen real del diseño."
    escalera:
      - "Los círculos se recuperan; las aspas, no. Busque el de calor."
    solucion: "La marca redonda de arriba, en los escalones de calor."

  - id: empareje-limites
    tipo: tocar
    titulo: "Daño permanente"
    texto: "El límite destructivo es donde el daño ya es permanente. Toque las dos marcas de ese límite."
    libro: [529, 526]
    widget:
      tipo: figura
      figura: fig-46.24
      zonas:
        - { id: circulo-calor, rotulo: "Marca redonda de arriba", rect: [237, 35, 35, 35] }
        - { id: aspa-calor, rotulo: "Aspa de arriba", rect: [265, 15, 35, 35] }
        - { id: circulo-frio, rotulo: "Marca redonda de abajo", rect: [100, 152, 35, 35] }
        - { id: aspa-frio, rotulo: "Aspa de abajo", rect: [126, 166, 35, 35] }
    tocar:
      bien: [aspa-calor, aspa-frio]
      todas: true
      porque:
        circulo-calor: "Ahí deja de funcionar, pero se recupera al volver a la normalidad: es el operativo."
        circulo-frio: "Es el límite operativo de frío: se recupera."
    exito: "Las dos aspas, una en calor y otra en frío. Combinando temperatura y vibración aparecen fallos que ninguno de los dos provoca por separado."
    escalera:
      - "Los círculos se recuperan; las aspas, no."
    solucion: "Las dos aspas."

  - id: prediga-margen
    tipo: leer
    titulo: "Cumplir no es tener margen"
    texto: "Un producto especificado hasta 70 °C deja de funcionar a 75 °C. Escriba su margen real."
    libro: [530]
    widget:
      tipo: grafica
      x: { id: tt, min: 70, max: 110, unidad: "°C", rotulo: "límite operativo hallado" }
      y: { min: 0, max: 40, unidad: "°C", rotulo: "margen real" }
      curvas:
        - { expr: "tt - T_esp", color: azul, rotulo: "margen sobre la especificación" }
      marcas:
        - { x: "T_op", y: "margen", rotulo: "{{margen}}" }
      mandos: []
    leer:
      objetivo: margen
      unidad: "°C"
      tol: 0.01
      rotulo: "Margen real"
      errores:
        - { expr: "T_op", texto: "Ese es el límite operativo: el margen se mide desde la especificación." }
    exito: "{{margen}}: no tiene margen, aunque cumpla. Cualquier dispersión o envejecimiento lo deja fuera."
    escalera:
      - "De la especificación al límite operativo."
    solucion: "75 − 70 = {{margen}}."
    comprobar:
      - { margen: 5 }

  - id: explore-halt
    tipo: explorar
    titulo: "Repetir tras corregir"
    texto: "Se corrige lo barato y se repite el HALT. Suba el límite operativo que encuentra la repetición hasta que el margen haya subido."
    libro: [534, 535, 553]
    inicio: { T_op: 75 }
    widget:
      tipo: grafica
      x: { id: tt, min: 70, max: 110, unidad: "°C", rotulo: "límite operativo hallado" }
      y: { min: 0, max: 40, unidad: "°C", rotulo: "margen real" }
      curvas:
        - { expr: "tt - T_esp", color: azul, rotulo: "margen sobre la especificación" }
      marcas:
        - { x: "T_op", y: "margen", rotulo: "{{margen}}" }
      lectura: { valor: margen, rotulo: "Margen real" }
      mandos:
        - { valor: T_op, min: 75, max: 110, paso: 5, rotulo: "Límite operativo hallado, T_op" }
    objetivo:
      condiciones:
        - { valor: margen, min: 10, rotulo: "Margen: {{margen}}" }
      logrado: "Margen de {{margen}}. Repetir confirma que el margen ha subido y que el problema no se ha desplazado a otro sitio."
      pistas:
        - { texto: "Sigue en el límite de antes: la corrección todavía no se nota." }
    escalera:
      - "El margen es la distancia de la especificación al límite operativo."
    solucion: "Un escalón más: el límite operativo a 80 °C o por encima."

  - id: pregunta-hallazgos
    tipo: pregunta
    titulo: "Qué se hace con los hallazgos"
    texto: "El HALT ha encontrado varios límites. ¿Hay que mejorarlos todos?"
    libro: [534, 535]
    widget:
      tipo: figura
      figura: fig-46.24
      zonas:
        - { id: halt, rotulo: "Panel grande de la izquierda", rect: [34, 15, 255, 120] }
    opciones:
      - texto: "No: se corrige lo barato, se acepta lo caro a conciencia y se repite"
        bien: true
        porque: "Repetir confirma que el margen ha subido y que el problema no se ha ido a otro sitio."
      - texto: "Sí, todos, hasta que ninguno falle"
        porque: "No todos lo merecen: un límite destructivo a 110 °C en un producto de interior es aceptable."
      - texto: "Ninguno: el HALT va más allá de la especificación"
        porque: "Lo que falta de margen sí se corrige si es barato."
    escalera:
      - "¿Merece la pena corregir algo que nunca ocurrirá en uso?"
    solucion: "Corregir lo barato, aceptar lo caro conscientemente y repetir."

  - id: porque-hass
    tipo: tocar
    titulo: "El tope del HASS"
    texto: "El HASS se aplica a cada unidad fabricada. Toque la línea que sus ciclos no deben cruzar."
    libro: [537, 538, 539]
    widget:
      tipo: figura
      figura: fig-46.24
      recorte: [300, 0, 143.96, 125]
      ampliar: 1.9
      zonas:
        - { id: destructivo, rotulo: "Línea roja", rect: [306, 26, 134, 12] }
        - { id: operativo, rotulo: "Línea naranja", rect: [306, 47, 134, 11] }
        - { id: especificacion, rotulo: "Línea verde", rect: [306, 66, 134, 11] }
    tocar:
      bien: [operativo]
      porque:
        destructivo: "Muy arriba: ya por encima del operativo, el estrés consume la vida de las unidades buenas."
        especificacion: "Los ciclos la sobrepasan: el tope es el límite operativo hallado en el HALT."
    exito: "Por debajo del límite operativo hallado en el HALT. Demasiado suave no criba nada; demasiado fuerte envejece las unidades buenas."
    escalera:
      - "El HASS se diseña con los datos del HALT."
    solucion: "La línea naranja: el límite operativo."

  - id: pregunta-burnin
    tipo: pregunta
    titulo: "HASS o burn-in"
    texto: "Los dos atacan la mortalidad infantil. ¿En qué se diferencian?"
    libro: [548, 549]
    widget:
      tipo: figura
      figura: fig-46.24
      zonas:
        - { id: hass, rotulo: "Panel de la derecha", rect: [305, 15, 137, 185] }
    opciones:
      - texto: "El HASS aplica estrés y criba en minutos lo que el burn-in tarda días"
        bien: true
        porque: "El burn-in es más barato de montar; el HASS, más eficaz por unidad de tiempo."
      - texto: "El burn-in rompe el producto; el HASS no"
        porque: "Ninguno pretende romper unidades buenas: eso es el HALT, con prototipos."
      - texto: "En nada: son el mismo ensayo"
        porque: "El burn-in es solo funcionamiento, como mucho algo caliente; el HASS aplica estrés."
    escalera:
      - "¿Cuál de los dos aplica estrés más allá del funcionamiento?"
    solucion: "El HASS aplica estrés y criba mucho más deprisa."

  - id: pregunta-banco
    tipo: leer
    titulo: "Sin cámara climática"
    texto: "Un congelador doméstico da −20 °C y un horno a temperatura baja, +80 °C. Escriba el salto de cada ciclo."
    libro: [542, 551, 552]
    widget:
      tipo: figura
      figura: fig-46.24
      zonas:
        - { id: hass, rotulo: "Panel de la derecha", rect: [305, 15, 137, 185] }
    leer:
      objetivo: salto
      unidad: "°C"
      tol: 0.01
      rotulo: "Salto de cada ciclo"
      errores:
        - { expr: "T_horno + T_cong", texto: "Ha restado el frío al revés: de −20 °C a +80 °C hay más de 80 °C." }
    exito: "{{salto}} en cada ciclo, con el equipo alimentado y registrando. Lo que falle será casi siempre una soldadura, un conector o un componente cerca de su límite."
    escalera:
      - "80 − (−20)."
    solucion: "80 + 20 = {{salto}}."
    comprobar:
      - { salto: 100 }

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [521, 528, 530, 537]
    ideas:
      - { titulo: "HALT.", texto: "Romper un prototipo para encontrar su punto débil." }
      - { titulo: "Dos límites.", texto: "Operativo, se recupera; destructivo, daño permanente." }
      - { titulo: "Margen real.", texto: "De la especificación al límite operativo: cumplir no basta." }
      - { titulo: "HASS.", texto: "Cribar cada unidad por debajo del límite operativo." }
