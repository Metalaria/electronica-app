# Lección 1.2 de la sección 47.9 «Componentes Falsificados: Cómo se Detectan» (cap46; etiquetas sec-46.N = impresas 47.N).
# - Las cuatro formas y los siete métodos de la figura 47.14 (fig-46.14) con zonas en sus recuadros.
# - La foto del LM3914N-1 sospechoso (figura 47.15, fig-46.15), con zonas en su marcado, la muesca y los terminales
#   (píxeles de la foto, 1 132 × 755).
# - Sin modelo numérico.
# Paso práctico: «tocar» en la foto lo primero que se examina; ordenar los métodos de banco por esfuerzo.
leccion: cap46/sec-46.9

libro:
  287: "es un modo de fallo que no está en ninguna hoja de datos y que se detecta con lo que ya hay en el banco"
  290: "Un transistor de 5 A vendido como de 20 A"
  291: "Sus terminales suelen mostrar el estaño irregular de un desoldado."
  292: "Piezas sin silicio dentro, o con un chip distinto."
  293: "Funciona en el caso nominal y se aparta en los márgenes"
  294: "pasa cualquier prueba funcional y solo falla cuando el circuito se acerca a los límites"
  296: "En orden de esfuerzo creciente"
  297: "Comparar con una unidad de origen seguro."
  298: "Inspección visual con lupa"
  299: "El peso."
  300: "La prueba de disolvente: frotar la serigrafía con acetona."
  301: "El trazador de curvas"
  302: "Medir el parámetro que define la gama."
  303: "Rayos X o decapado"
  306: "Se calienta más de lo previsto"
  307: "Falla bajo carga, no en vacío."
  312: "Comprar en distribuidores autorizados, aunque cueste más. Es la única barrera que funciona de forma consistente."
  313: "Un componente escaso ofrecido muy por debajo del mercado, y con existencias abundantes, es la señal más fiable de todas."
  321: "Las cuatro formas de falsificación y cómo se detectan en el banco."
  322: "el marcado es lo primero que se examina: tipografía, logotipo, código de fecha y si está impreso con tinta o grabado con láser"

modelo: { valores: {}, calculos: {} }

tarjetas:
  - id: explore-formas
    tipo: explorar
    titulo: "Cuatro formas de falsificar"
    texto: "Es un modo de fallo que no está en ninguna hoja de datos. Toque cada forma."
    libro: [287, 321, 290, 291, 292, 293]
    widget:
      tipo: figura
      figura: fig-46.14
      zonas:
        - { id: remarcado, rotulo: "Recuadro azul de arriba", rect: [4, 3, 106, 122], texto: "Remarcado: una pieza de gama inferior con la serigrafía de una superior. La más común y la más difícil de ver." }
        - { id: recuperacion, rotulo: "Recuadro naranja de arriba", rect: [116, 3, 106, 122], texto: "Recuperación: desoldada de placas desechadas y reetiquetada. Ya ha consumido vida en un ciclo térmico." }
        - { id: vacio, rotulo: "Recuadro morado de arriba", rect: [227, 3, 107, 122], texto: "Encapsulado vacío o incompleto: sin silicio, o con otro chip. Sobre todo en integrados caros." }
        - { id: clon, rotulo: "Recuadro rojo de arriba", rect: [339, 3, 107, 122], texto: "Clonación funcional: otro silicio que hace casi lo mismo, con menos SOA y más fuga." }
    requiere: { mover: [remarcado, recuperacion, vacio, clon] }

  - id: prediga-traicionera
    tipo: predecir
    titulo: "La más traicionera"
    texto: "¿Qué falsificación pasa cualquier prueba funcional y solo falla cerca de los límites?"
    libro: [293, 294]
    widget:
      tipo: figura
      figura: fig-46.14
      zonas:
        - { id: formas, rotulo: "Los cuatro recuadros de arriba", rect: [4, 3, 442, 122] }
    opciones:
      - texto: "La clonación funcional"
        bien: true
        porque: "Funciona en el caso nominal y se aparta en los márgenes: justo cuando importa."
      - texto: "El encapsulado vacío"
        porque: "Sin silicio no funciona ni en el caso nominal: la prueba funcional lo descubre."
      - texto: "La recuperación"
        porque: "Funciona a veces, con vida consumida; pero suele delatarse por el estaño de sus terminales."
    escalera:
      - "¿Cuál funciona bien en el caso nominal?"
    solucion: "La clonación funcional."

  - id: empareje-delata
    tipo: pregunta
    titulo: "Cómo se delata cada una"
    texto: "Empareje cada forma de falsificación con lo que la delata en el banco."
    libro: [291, 299, 300, 301, 302]
    widget:
      tipo: figura
      figura: fig-46.14
      zonas:
        - { id: formas, rotulo: "Los cuatro recuadros de arriba", rect: [4, 3, 442, 122] }
    emparejar:
      - ["Remarcado", "Acetona y el parámetro que define la gama"]
      - ["Recuperación", "Estaño irregular en los terminales"]
      - ["Encapsulado vacío", "El peso"]
      - ["Clonación funcional", "La curva superpuesta en el trazador"]
    exito: "Cada forma deja su huella: en la serigrafía, en los terminales, en el peso o en la curva."
    pistas:
      - { texto: "Un encapsulado con menos silicio pesa distinto." }
    escalera:
      - "Lo desoldado se nota en los terminales."
    solucion: "Remarcado, acetona y gama; recuperado, estaño; vacío, peso; clon, trazador."

  - id: toque-marcado
    tipo: tocar
    titulo: "Lo primero que se examina"
    texto: "Este LM3914N-1 es un probable falsificado según quien lo fotografió. Toque lo primero que se examina."
    libro: [298, 322]
    widget:
      tipo: figura
      figura: fig-46.15
      zonas:
        - { id: marcado, rotulo: "Centro del encapsulado", rect: [400, 320, 420, 130] }
        - { id: muesca, rotulo: "Extremo izquierdo del encapsulado", rect: [140, 330, 90, 90] }
        - { id: terminales, rotulo: "Patillas de abajo", rect: [160, 495, 860, 90] }
    tocar:
      bien: [marcado]
      porque:
        muesca: "La muesca indica la patilla 1; el libro manda mirar primero el marcado."
        terminales: "Los terminales delatan una recuperación, pero lo primero es el marcado."
    exito: "El marcado: tipografía, logotipo, código de fecha y si está impreso con tinta o grabado con láser."
    escalera:
      - "¿Dónde están el logotipo y el código de fecha?"
    solucion: "El marcado del centro del encapsulado."

  - id: ordene-banco
    tipo: pregunta
    titulo: "Detección en el banco"
    texto: "Ordene los métodos de detección de menos a más esfuerzo."
    libro: [296, 297, 298, 299, 300, 301, 302, 303]
    widget:
      tipo: figura
      figura: fig-46.14
      zonas:
        - { id: metodos, rotulo: "Fila de recuadros de abajo", rect: [4, 148, 442, 70] }
    ordenar:
      - "Comparar con una unidad de origen seguro"
      - "Inspección visual con lupa"
      - "El peso"
      - "Acetona sobre la serigrafía"
      - "Curvas superpuestas en el trazador"
      - "Medir el parámetro que define la gama"
      - "Rayos X o decapado"
    exito: "Comparar con una unidad buena es lo más productivo y siempre se puede hacer."
    pistas:
      - { texto: "Lo primero es comparar con una buena; lo último, lo que solo hace la industria." }
    escalera:
      - "Mirar con lupa va antes que pesar."
      - "El trazador va antes que medir el parámetro de la gama."
    solucion: "Comparar, lupa, peso, acetona, trazador, parámetro de la gama y rayos X."

  - id: pregunta-gama
    tipo: pregunta
    titulo: "Un transistor de 20 A"
    texto: "Sospecha que un transistor vendido como de 20 A es uno de 5 A remarcado. ¿Qué medida es concluyente?"
    libro: [290, 302]
    widget:
      tipo: figura
      figura: fig-46.14
      zonas:
        - { id: remarcado, rotulo: "Recuadro azul de arriba", rect: [4, 3, 106, 122] }
    opciones:
      - texto: "El parámetro que define la gama, comparado con la hoja"
        bien: true
        porque: "Si el remarcado sube la categoría, ese parámetro lo delata: la R_{DS(on)}, la ruptura, la fuga."
      - texto: "Que conmute en un circuito de prueba"
        porque: "Uno de 5 A también conmuta: la diferencia está en el parámetro que define la gama."
      - texto: "Su serigrafía con lupa"
        porque: "Ayuda, pero el remarcado es el más difícil de ver: lo concluyente es medir."
    escalera:
      - "¿Qué diferencia de verdad un transistor de 5 A de uno de 20 A?"
    solucion: "Medir el parámetro que define la gama y compararlo con la hoja."

  - id: pregunta-sintomas
    tipo: pregunta
    titulo: "Ya está montado"
    texto: "Un componente sustituido funciona en vacío, falla bajo carga y se calienta más que la unidad anterior. ¿Qué sospechar?"
    libro: [306, 307]
    widget:
      tipo: figura
      figura: fig-46.14
      zonas:
        - { id: clon, rotulo: "Recuadro rojo de arriba", rect: [339, 3, 107, 122] }
    opciones:
      - texto: "Un falsificado en el límite de su especificación"
        bien: true
        porque: "Son los síntomas característicos: calentarse más y fallar bajo carga, no en vacío."
      - texto: "Un fallo de diseño del circuito"
        porque: "La unidad anterior funcionaba en la misma posición: lo que ha cambiado es el componente."
      - texto: "Nada: es normal que se caliente al principio"
        porque: "Calentarse más que otra unidad en la misma posición es un síntoma, no un rodaje."
    escalera:
      - "¿Qué cambió entre la unidad que funcionaba y la que falla?"
    solucion: "Un probable falsificado: falla bajo carga y se calienta más."

  - id: porque-canal
    tipo: porque
    titulo: "Cómo se evita"
    texto: "¿Por qué comprar en distribuidores autorizados, aunque cueste más?"
    libro: [312, 313]
    widget:
      tipo: figura
      figura: fig-46.14
      zonas:
        - { id: aviso, rotulo: "Frase roja de abajo", rect: [4, 228, 442, 35] }
    opciones:
      - texto: "Es la única barrera que funciona de forma consistente"
        bien: true
        porque: "La otra señal fiable: un componente escaso, muy barato y con existencias abundantes."
      - texto: "Porque sus piezas están mejor fabricadas"
        porque: "Son las mismas piezas del fabricante; lo que garantiza el canal es que sean auténticas."
      - texto: "Porque así no hace falta inspeccionar nada"
        porque: "La primera entrega de un proveedor nuevo se cualifica igualmente."
    escalera:
      - "¿Qué garantiza el canal de compra, más que la calidad?"
    solucion: "Es la única barrera que funciona de forma consistente."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [290, 294, 297, 312]
    ideas:
      - { titulo: "Cuatro formas.", texto: "Remarcado, recuperación, encapsulado vacío y clonación funcional." }
      - { titulo: "La traicionera.", texto: "La clonación pasa la prueba funcional y falla cerca de los límites." }
      - { titulo: "En el banco.", texto: "Comparar con una unidad segura; medir el parámetro de la gama es concluyente." }
      - { titulo: "Evitarlo.", texto: "Distribuidores autorizados y desconfiar del precio." }
