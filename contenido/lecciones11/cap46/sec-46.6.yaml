# Lección 1.2 de la sección 47.6 «Diseño para Test (DFT)» (cap46; etiquetas sec-46.N = impresas 47.N).
# - La cama de agujas y el boundary scan de la figura 47.11 (fig-46.11) con zonas en el dibujo (no en sus rótulos).
# - El coste relativo por etapa de la figura 47.10 (fig-46.10), con la tabla del bloque 194.
# - Sin modelo numérico: las cifras (1 mm, 2,5 mm, 95 %, 90 %, ×10 por etapa) salen del texto.
# Paso práctico: «tocar» en la figura 47.11 lo que el diseño aporta a la cama de agujas.
leccion: cap46/sec-46.6

libro:
  174: "Si la prueba no es posible, o es muy lenta, o no cubre lo que falla, el resultado es que las unidades defectuosas llegan al cliente."
  177: "Es rápida y no ve nada eléctrico."
  178: "Rayos X, para los encapsulados con contactos ocultos (BGA, QFN)."
  179: "exige puntos de prueba accesibles, que es donde el diseño interviene"
  180: "Es la que de verdad valida, y la más lenta."
  181: "comprobando las conexiones entre chips sin acceso físico"
  183: "típicamente 1 mm de diámetro y 2,5 mm de separación entre centros"
  191: "es preferible una prueba sencilla con cobertura conocida que una complicada con cobertura desconocida"
  193: "una progresión aproximada de un factor diez por etapa"
  194: "En el cliente 10 000"
  203: "detecta el 95 % de los defectos de montaje"
  206: "un componente pasivo entre dos integrados con boundary scan se detecta, pero uno colgado de un pin sin soporte, no"
  209: "ICT para los pasivos, las alimentaciones y lo analógico."
  211: "Por debajo del 90 % se están dejando pasar unidades defectuosas al cliente"
  214: "para que la cadena tenga un estado definido si el conector no está"
  219: "Es lo que detecta un error de la lista de materiales o una huella con el patillaje invertido antes de montar quinientas."
  199: "Coste relativo de corregir un fallo según la etapa en que se detecta."
  220: "Cama de agujas y boundary scan, y cómo se combinan con la prueba funcional."

modelo: { valores: {}, calculos: {} }

tarjetas:
  - id: explore-metodos
    tipo: explorar
    titulo: "Dos métodos que se complementan"
    texto: "En serie, una placa montada se prueba con cama de agujas y con boundary scan. Toque cada parte."
    libro: [220, 203, 181, 180]
    widget:
      tipo: figura
      figura: fig-46.11
      zonas:
        - { id: ict, rotulo: "Recuadro amarillo de arriba", rect: [3, 3, 222, 158], texto: "Cama de agujas: sondas con muelle contra los puntos de prueba. Detecta el 95 % de los defectos de montaje en segundos." }
        - { id: jtag, rotulo: "Recuadro azul de arriba", rect: [229, 3, 222, 158], texto: "Boundary scan: con cuatro líneas fuerza y lee los pines sin sondas, también bajo un BGA." }
        - { id: funcional, rotulo: "Recuadro morado de abajo", rect: [312, 193, 124, 43], texto: "La prueba funcional, al final: la que de verdad valida, y la más lenta." }
    requiere: { mover: [ict, jtag] }

  - id: toque-puntos
    tipo: tocar
    titulo: "Lo que pone el diseño"
    texto: "La cama de agujas existe en la fábrica, pero necesita algo en la placa. Toque lo que el diseño debe aportar."
    libro: [179, 183]
    widget:
      tipo: figura
      figura: fig-46.11
      zonas:
        - { id: piezas, rotulo: "Arriba del dibujo de la izquierda", rect: [22, 10, 150, 36] }
        - { id: puntos, rotulo: "Bajo la placa, a la izquierda", rect: [22, 46, 150, 36] }
        - { id: util, rotulo: "Abajo del dibujo de la izquierda", rect: [15, 82, 160, 36] }
    tocar:
      bien: [puntos]
      porque:
        piezas: "Los componentes ya están; lo que falta es dónde apoyar cada aguja."
        util: "El útil lo fabrica la fábrica para cada placa; el diseño pone los puntos donde se apoya."
    exito: "Puntos de prueba accesibles: de al menos 1 mm, en una sola cara, uno por nodo."
    escalera:
      - "¿Dónde toca cada aguja?"
    solucion: "Los puntos de prueba bajo la placa."

  - id: empareje-niveles
    tipo: pregunta
    titulo: "Los niveles de prueba"
    texto: "Empareje cada nivel de prueba con lo que lo caracteriza."
    libro: [177, 178, 180, 181]
    widget:
      tipo: figura
      figura: fig-46.11
      zonas:
        - { id: combinan, rotulo: "Recuadro verde de abajo", rect: [3, 166, 448, 118] }
    emparejar:
      - ["Inspección óptica (AOI)", "Rápida, no ve nada eléctrico"]
      - ["Rayos X", "Contactos ocultos de BGA y QFN"]
      - ["Prueba funcional", "La que de verdad valida, y la más lenta"]
      - ["Boundary scan", "Conexiones entre chips sin acceso físico"]
    exito: "Cada nivel ve una parte: por eso se combinan."
    pistas:
      - { texto: "La cámara compara la placa con la de referencia: no mide nada eléctrico." }
    escalera:
      - "¿Cuál se alimenta y comprueba que la placa hace lo que debe?"
    solucion: "AOI, óptica; rayos X, contactos ocultos; funcional, valida; boundary scan, entre chips."

  - id: pregunta-tamano
    tipo: pregunta
    titulo: "Puntos de prueba"
    texto: "¿Qué tamaño y separación típicos pide la cama de agujas a los puntos de prueba?"
    libro: [183]
    widget:
      tipo: figura
      figura: fig-46.11
      zonas:
        - { id: puntos, rotulo: "Bajo la placa, a la izquierda", rect: [22, 46, 150, 36] }
    opciones:
      - texto: "1 mm de diámetro y 2,5 mm entre centros"
        bien: true
        porque: "Es lo típico, y en una sola cara si es posible."
      - texto: "2,5 mm de diámetro y 1 mm entre centros"
        porque: "Al revés: con 1 mm de separación, puntos de 2,5 mm se solaparían."
      - texto: "Lo que quepa: la aguja se adapta"
        porque: "La aguja no se adapta: hacen falta tamaño y separación compatibles con la cama."
    escalera:
      - "La separación tiene que ser mayor que el diámetro."
    solucion: "1 mm de diámetro y 2,5 mm de separación entre centros."

  - id: prediga-pasivo
    tipo: predecir
    titulo: "Un pasivo colgado"
    texto: "Una resistencia cuelga de un pin sin boundary scan. ¿Qué método la verifica?"
    libro: [206, 209]
    widget:
      tipo: figura
      figura: fig-46.11
      zonas:
        - { id: jtag, rotulo: "Recuadro azul de arriba", rect: [229, 3, 222, 158] }
    opciones:
      - texto: "La cama de agujas"
        bien: true
        porque: "El ICT cubre pasivos, alimentaciones y lo analógico; el boundary scan solo lo que está en la cadena."
      - texto: "El boundary scan"
        porque: "Solo cubre lo que está en la cadena: un pasivo de un pin sin soporte se le escapa."
      - texto: "Ninguno: los pasivos no se prueban"
        porque: "Sí: comprobar valores componente a componente es justo lo que hace la cama de agujas."
    escalera:
      - "¿Está esa resistencia en la cadena del boundary scan?"
    solucion: "La cama de agujas: el boundary scan no llega a ese pin."

  - id: ordene-etapas
    tipo: pregunta
    titulo: "Encontrarlo tarde"
    texto: "Corregir un fallo cuesta unas diez veces más en cada etapa. Ordene, de más barata a más cara."
    libro: [193, 194, 199]
    widget:
      tipo: figura
      figura: fig-46.10
      zonas:
        - { id: barras, rotulo: "Las barras", rect: [40, 25, 320, 140] }
    ordenar:
      - "En el diseño"
      - "En la placa desnuda"
      - "En la placa montada"
      - "En el montaje del equipo"
      - "En el cliente"
    exito: "Del diseño al cliente, de 1 a 10 000: el último salto incluye la reputación."
    pistas:
      - { texto: "Antes de montar nada está la placa desnuda." }
    escalera:
      - "Siga el camino de la placa desde el esquema hasta el cliente."
    solucion: "Diseño, placa desnuda, placa montada, montaje del equipo y cliente."

  - id: pregunta-cobertura
    tipo: pregunta
    titulo: "La cobertura"
    texto: "Dos pruebas: una sencilla con cobertura conocida y otra complicada con cobertura desconocida. ¿Cuál es preferible?"
    libro: [174, 191, 211]
    widget:
      tipo: figura
      figura: fig-46.11
      zonas:
        - { id: combinan, rotulo: "Recuadro verde de abajo", rect: [3, 166, 448, 118] }
    opciones:
      - texto: "La sencilla con cobertura conocida"
        bien: true
        porque: "Se sabe qué fracción de los fallos detecta y dónde están los huecos."
      - texto: "La complicada: probará más cosas"
        porque: "Sin conocer su cobertura no se sabe qué deja pasar."
      - texto: "Da igual, mientras la placa pase"
        porque: "Pasar no basta: por debajo del 90 % de cobertura llegan defectuosas al cliente."
    escalera:
      - "¿Qué pregunta hay que hacerse: si se puede probar o qué fracción detecta?"
    solucion: "La sencilla con cobertura conocida."

  - id: porque-pullup
    tipo: porque
    titulo: "Resistencias en el JTAG"
    texto: "El diseño pone pull-up en TMS y TDI y pull-down en TCK. ¿Para qué?"
    libro: [214]
    widget:
      tipo: figura
      figura: fig-46.11
      zonas:
        - { id: jtag, rotulo: "Recuadro azul de arriba", rect: [229, 3, 222, 158] }
    opciones:
      - texto: "Para que la cadena tenga un estado definido sin el conector"
        bien: true
        porque: "Sin ellas, las líneas quedan al aire cuando no hay nada conectado."
      - texto: "Para acelerar la prueba"
        porque: "No cambian la velocidad: fijan el estado de reposo de las líneas."
      - texto: "Para poder usar esos pines para otra cosa"
        porque: "Al contrario: los pines de JTAG no deben usarse para otra cosa."
    escalera:
      - "¿Qué leen esas entradas si nadie conecta el adaptador?"
    solucion: "Un estado definido de la cadena si el conector no está."

  - id: pregunta-primer
    tipo: pregunta
    titulo: "El primer artículo"
    texto: "Antes de lanzar la serie, la primera unidad se comprueba contra la documentación, componente a componente. ¿Qué evita?"
    libro: [219]
    widget:
      tipo: figura
      figura: fig-46.10
      zonas:
        - { id: barras, rotulo: "Las barras", rect: [40, 25, 320, 140] }
    opciones:
      - texto: "Montar quinientas con un error de la lista o una huella invertida"
        bien: true
        porque: "Se detecta en una unidad, no en toda la serie."
      - texto: "Tener que hacer la prueba funcional"
        porque: "No la sustituye: es una comprobación más, antes de la serie."
      - texto: "El desgaste de las placas"
        porque: "No es un ensayo de vida: comprueba que se montó lo que dice la documentación."
    escalera:
      - "¿Qué pasa si una huella tiene el patillaje invertido y nadie lo mira?"
    solucion: "Un error de lista de materiales o de huella antes de montar quinientas."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [179, 191, 193, 209]
    ideas:
      - { titulo: "Puntos de prueba.", texto: "1 mm, 2,5 mm entre centros, en una cara: los pone el diseño." }
      - { titulo: "Se combinan.", texto: "Boundary scan para lo digital, ICT para pasivos y alimentaciones, funcional al final." }
      - { titulo: "Cobertura.", texto: "Mejor sencilla y conocida que complicada y desconocida." }
      - { titulo: "Diez por etapa.", texto: "Un fallo cuesta unas diez veces más en cada etapa." }
