# Lección 1.2 de la sección 36.11 «Sensores Inteligentes: del Analógico al Bus Digital» (cap35, sec-35.11).
# Formato: GUIA.md.
# - Qué se gana y qué se pierde con un sensor con bus, y su primer diagnóstico (figura 36.17, fig-35.17).
# Sección descriptiva, sin números ni fórmulas (aviso de secuencia «sin tarjeta de fórmula»); sin modelo.
# Sin paso práctico: el diagnóstico del banco (leer el registro de identificación) va como predicción.
leccion: cap35/sec-35.11

libro:
  312: "entrega números por un bus, y dentro lleva su convertidor, su calibración y su procesado"
  316: "El elemento sensor propiamente dicho."
  317: "una FIFO que acumula muestras mientras el procesador duerme"
  319: "Calibración de fábrica, individual para cada unidad. Es lo más valioso"
  322: "la señal analógica no sale del encapsulado"
  326: "la ganancia, el filtro y la velocidad son los que el fabricante decidió"
  327: "no hay forma de saber si es el elemento o el procesado interno"
  328: "la disponibilidad a largo plazo se convierte en un riesgo"
  331: "Con más, hace falta un multiplexor de I²C"
  332: "leer antes de que el dato esté listo devuelve el anterior"
  334: "un bus que falla puede devolver todo ceros o todo unos"
  336: "Cuando hace falta velocidad por encima de lo que el bus permite"
  337: "Cuando el sensor debe estar lejos"
  338: "Cuando hace falta control fino del acondicionamiento"
  339: "Cuando la disponibilidad a largo plazo manda"
  342: "Si no responde, el problema es de bus —direcciones, pull-ups, alimentación— y no del sensor"
  343: "Esa comprobación de diez segundos separa dos mundos de diagnóstico distintos"
  344: "Qué se gana y qué se pierde con un sensor con bus, y su primer diagnóstico"

modelo: { valores: {}, calculos: {} }

tarjetas:
  - id: explore-bus
    tipo: explorar
    titulo: "Números por un bus"
    texto: "Un sensor moderno rara vez entrega una tensión: entrega números por un bus. Toque lo que se gana y lo que se pierde."
    libro: [312, 317, 322, 328, 344]
    widget:
      tipo: figura
      figura: fig-35.17
      zonas:
        - { id: gana, rotulo: "Recuadro verde", rect: [6, 4, 216, 92], texto: "Calibración individual, compensación de temperatura, menos componentes, señal dentro del encapsulado, FIFO." }
        - { id: pierde, rotulo: "Recuadro rojo", rect: [229, 4, 217, 92], texto: "Control, visibilidad, dependencia de un componente, disponibilidad y la latencia del bus." }
        - { id: diagnostico, rotulo: "Recuadro de abajo", rect: [6, 103, 440, 104], texto: "Todo ceros o todo unos parecen medidas: compruebe el identificador y el rango." }
    requiere: { mover: [gana, pierde] }

  - id: ordene-dentro
    tipo: pregunta
    titulo: "Lo que trae dentro"
    texto: "Ordene el camino de la medida dentro de un sensor integrado, del elemento al bus."
    libro: [316]
    widget:
      tipo: figura
      figura: fig-35.17
      zonas:
        - { id: gana, rotulo: "Recuadro verde", rect: [6, 4, 216, 92] }
    ordenar:
      - "El elemento sensor"
      - "El acondicionamiento ajustado a él"
      - "El convertidor"
      - "La calibración de fábrica y la compensación de temperatura"
      - "La interfaz I²C o SPI"
    exito: "Todo dentro del encapsulado: por la placa solo viajan datos."
    pistas:
      - { texto: "La calibración trabaja sobre el número ya convertido." }
    escalera:
      - "Primero lo analógico, luego la conversión, al final el bus."
    solucion: "Elemento, acondicionamiento, convertidor, calibración y compensación, interfaz."

  - id: pregunta-valioso
    tipo: pregunta
    titulo: "Lo más valioso"
    texto: "De todo lo que trae un sensor con bus, ¿qué es lo más valioso?"
    libro: [319]
    widget:
      tipo: figura
      figura: fig-35.17
      zonas:
        - { id: gana, rotulo: "Recuadro verde", rect: [6, 4, 216, 92] }
    opciones:
      - texto: "La calibración de fábrica, individual para cada unidad"
        bien: true
        porque: "Conseguirla con un sensor analógico exigiría calibrar cada aparato."
      - texto: "El bus de dos hilos"
        porque: "Útil, pero lo que costaría mucho replicar es la calibración individual."
      - texto: "La FIFO"
        porque: "Ayuda a dormir más; lo más valioso es la calibración."
    escalera:
      - "¿Qué costaría más hacer usted con un sensor analógico?"
    solucion: "La calibración individual de fábrica."

  - id: pregunta-visibilidad
    tipo: pregunta
    titulo: "Un número raro"
    texto: "Un sensor con bus devuelve un número raro. ¿Qué no se puede hacer, a diferencia de uno analógico?"
    libro: [326, 327]
    widget:
      tipo: figura
      figura: fig-35.17
      zonas:
        - { id: pierde, rotulo: "Recuadro rojo", rect: [229, 4, 217, 92] }
    opciones:
      - texto: "Ver la señal analógica para saber si falla el elemento o el procesado"
        bien: true
        porque: "Se pierde visibilidad: la señal no sale del encapsulado."
      - texto: "Leerlo otra vez"
        porque: "Se puede releer; lo que no se puede es mirar dentro."
      - texto: "Cambiar de sensor"
        porque: "Se puede, aunque obliga a cambiar el software; lo que se pierde aquí es la visibilidad."
    escalera:
      - "¿Dónde está la señal analógica?"
    solucion: "No se ve la señal: se pierde visibilidad."

  - id: pregunta-direcciones
    tipo: pregunta
    titulo: "Varios sensores iguales"
    texto: "Hacen falta más sensores iguales de los que permiten sus direcciones I²C seleccionables. ¿Qué se necesita?"
    libro: [331]
    widget:
      tipo: figura
      figura: fig-35.17
      zonas:
        - { id: diagnostico, rotulo: "Recuadro de abajo", rect: [6, 103, 440, 104] }
    opciones:
      - texto: "Un multiplexor de I²C"
        bien: true
        porque: "Muchos sensores tienen solo una o dos direcciones: el multiplexor separa los grupos."
      - texto: "Bajar la velocidad del bus"
        porque: "La velocidad no resuelve una dirección repetida."
      - texto: "Más resistencias de pull-up"
        porque: "Las pull-ups no cambian las direcciones."
    escalera:
      - "Dos dispositivos con la misma dirección no pueden estar en el mismo bus."
    solucion: "Un multiplexor de I²C."

  - id: predecir-antes
    tipo: predecir
    titulo: "Leer demasiado pronto"
    texto: "El programa lee el sensor antes de que termine la conversión. ¿Qué obtiene?"
    libro: [332]
    widget:
      tipo: figura
      figura: fig-35.17
      zonas:
        - { id: pierde, rotulo: "Recuadro rojo", rect: [229, 4, 217, 92] }
    opciones:
      - texto: "El dato anterior"
        bien: true
        porque: "Lo correcto es consultar el bit de estado antes de leer."
      - texto: "Un error del bus"
        porque: "El bus funciona: devuelve lo que hay en el registro, que es el dato anterior."
      - texto: "Ceros"
        porque: "El registro conserva la conversión anterior."
    escalera:
      - "¿Qué hay en el registro mientras la conversión nueva no termina?"
    solucion: "El dato anterior: consulte el bit de estado."

  - id: porque-plausibilidad
    tipo: porque
    titulo: "Ceros que parecen medidas"
    texto: "¿Por qué hay que comprobar el identificador y el rango de los datos de un sensor con bus?"
    libro: [334]
    widget:
      tipo: figura
      figura: fig-35.17
      zonas:
        - { id: diagnostico, rotulo: "Recuadro de abajo", rect: [6, 103, 440, 104] }
    opciones:
      - texto: "Un bus que falla puede devolver todo ceros o todo unos, que parecen medidas"
        bien: true
        porque: "Comprobarlo es lo que distingue un fallo de una medida."
      - texto: "Porque el sensor cambia de identificador"
        porque: "El identificador es fijo: por eso sirve para saber que el bus está vivo."
      - texto: "Por seguridad"
        porque: "Es de diagnóstico: separar un fallo de una medida válida."
    escalera:
      - "¿Cómo se distingue una temperatura de cero grados de un bus muerto que lee ceros?"
    solucion: "Para distinguir un fallo de una medida."

  - id: empareje-analogico
    tipo: pregunta
    titulo: "Cuándo sigue siendo mejor el analógico"
    texto: "Empareje cada situación con lo que la hace preferir un sensor analógico."
    libro: [336, 337, 338, 339]
    widget:
      tipo: figura
      figura: fig-35.17
      zonas:
        - { id: pierde, rotulo: "Recuadro rojo", rect: [229, 4, 217, 92] }
    emparejar:
      - ["Muestras muy rápidas", "Más velocidad de la que permite el bus"]
      - ["Sensor lejos, entorno ruidoso", "No se quiere un bus corriendo por ahí"]
      - ["Medida exigente", "Control fino del acondicionamiento"]
      - ["Producto de vida larga", "Un elemento sensor genérico"]
    exito: "En el resto, el sensor con bus suele ganar."
    pistas:
      - { texto: "La disponibilidad a largo plazo es un riesgo de depender de un componente concreto." }
    escalera:
      - "Cada caso es lo contrario de una de las pérdidas del sensor con bus."
    solucion: "Rápido, velocidad; lejos, sin bus; exigente, control; vida larga, genérico."

  - id: predecir-identificacion
    tipo: predecir
    titulo: "El primer paso"
    texto: "Se lee el registro de identificación del sensor y no responde. ¿Dónde está el problema?"
    libro: [342, 343]
    widget:
      tipo: figura
      figura: fig-35.17
      zonas:
        - { id: diagnostico, rotulo: "Recuadro de abajo", rect: [6, 103, 440, 104] }
    opciones:
      - texto: "En el bus: direcciones, pull-ups o alimentación"
        bien: true
        porque: "Si respondiera, bus y dispositivo estarían vivos y el problema sería de configuración o de medida."
      - texto: "En la calibración del sensor"
        porque: "Eso se mira cuando sí responde."
      - texto: "En el elemento sensor"
        porque: "Si el chip no contesta, el problema es de bus antes que de medida."
    escalera:
      - "Una comprobación de diez segundos separa dos mundos de diagnóstico."
    solucion: "Es de bus, no del sensor."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [319, 327, 334, 342]
    ideas:
      - { titulo: "Se gana.", texto: "Calibración individual de fábrica, compensación y menos componentes." }
      - { titulo: "Se pierde.", texto: "Control, visibilidad y la independencia de un componente." }
      - { titulo: "Plausibilidad.", texto: "Todo ceros o todo unos no son medidas: identificador y rango." }
      - { titulo: "Primer paso.", texto: "Leer el identificador: si no responde, es el bus." }
