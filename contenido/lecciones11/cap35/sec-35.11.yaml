# Lección 1.2 de la sección 36.11 «Sensores Inteligentes: del Analógico al Bus Digital» (cap35, sec-35.11).
# Formato: GUIA.md.
# - Qué se gana y qué se pierde con un sensor con bus, y su primer diagnóstico (figura 36.17, fig-35.17).
# Sección descriptiva, sin números ni fórmulas (aviso de secuencia «sin tarjeta de fórmula»); sin modelo.
# Sin paso práctico: el diagnóstico del banco (leer el registro de identificación) va como predicción.
# 1.2.1 (autor121-sens, «aprender haciendo», GUIA §13): en la figura 36.17 se tocan lo más valioso que se gana y lo
# que se pierde al ver un número raro; el «todo unos» de un sensor callado (bloque 334) se ve en un bus con pull-up en
# el simulador lógico, y la lectura demasiado pronta (bloque 332), en un multiplexor que da el dato anterior hasta que
# acaba la conversión. El orden interno, el analógico y la identificación pasan a los éxitos y al resumen.
leccion: cap35/sec-35.11

libro:
  312: "entrega números por un bus, y dentro lleva su convertidor, su calibración y su procesado"
  316: "El elemento sensor propiamente dicho."
  317: "una FIFO que acumula muestras mientras el procesador duerme"
  319: "Calibración de fábrica, individual para cada unidad. Es lo más valioso"
  322: "la señal analógica no sale del encapsulado"
  326: "la ganancia, el filtro y la velocidad son los que el fabricante decidió"
  327: "no hay forma de saber si es el elemento o el procesado interno"
  328: "la disponibilidad a largo plazo se convierte en un riesgo"
  331: "Con más, hace falta un multiplexor de I²C"
  332: "leer antes de que el dato esté listo devuelve el anterior"
  334: "un bus que falla puede devolver todo ceros o todo unos"
  336: "Cuando hace falta velocidad por encima de lo que el bus permite"
  337: "Cuando el sensor debe estar lejos"
  338: "Cuando hace falta control fino del acondicionamiento"
  339: "Cuando la disponibilidad a largo plazo manda"
  342: "Si no responde, el problema es de bus —direcciones, pull-ups, alimentación— y no del sensor"
  343: "Esa comprobación de diez segundos separa dos mundos de diagnóstico distintos"
  344: "Qué se gana y qué se pierde con un sensor con bus, y su primer diagnóstico"

modelo: { valores: {}, calculos: {} }

tarjetas:
  - id: explore-bus
    tipo: tocar
    titulo: "Números por un bus"
    texto: "Un sensor con bus devuelve un número raro, y con uno analógico se miraría la señal. Toque el recuadro que explica por qué aquí no se puede."
    libro: [312, 317, 322, 326, 327, 328, 344]
    widget:
      tipo: figura
      figura: fig-35.17
      zonas:
        - { id: gana, rotulo: "Recuadro verde", rect: [6, 4, 216, 92] }
        - { id: pierde, rotulo: "Recuadro rojo", rect: [229, 4, 217, 92] }
        - { id: diagnostico, rotulo: "Recuadro de abajo", rect: [6, 103, 440, 104] }
    tocar:
      bien: [pierde]
      porque:
        gana: "Eso es lo que se gana: calibración, compensación, menos componentes."
        diagnostico: "Eso es cómo diagnosticar; la causa está en lo que se pierde."
    exito: "Se pierde visibilidad: la señal no sale del encapsulado, y no se sabe si falla el elemento o el procesado. También el control, y se depende de un componente."
    escalera:
      - "¿Dónde está la señal analógica?"
    solucion: "El recuadro rojo."

  - id: ordene-dentro
    tipo: tocar
    titulo: "Lo más valioso"
    texto: "Dentro van el elemento, su acondicionamiento, el convertidor, la calibración y la interfaz. Toque el recuadro donde está lo que más costaría replicar."
    libro: [316, 319]
    widget:
      tipo: figura
      figura: fig-35.17
      zonas:
        - { id: gana, rotulo: "Recuadro verde", rect: [6, 4, 216, 92] }
        - { id: pierde, rotulo: "Recuadro rojo", rect: [229, 4, 217, 92] }
        - { id: diagnostico, rotulo: "Recuadro de abajo", rect: [6, 103, 440, 104] }
    tocar:
      bien: [gana]
      porque:
        pierde: "Eso es lo que se pierde a cambio."
        diagnostico: "Eso es el diagnóstico, no lo que trae el sensor."
    exito: "La calibración de fábrica, individual para cada unidad: con un sensor analógico habría que calibrar cada aparato. Por la placa solo viajan datos."
    escalera:
      - "¿Qué costaría más hacer usted con un sensor analógico?"
    solucion: "El recuadro verde: la calibración individual."

  - id: pregunta-direcciones
    tipo: pregunta
    titulo: "Varios sensores iguales"
    texto: "Hacen falta más sensores iguales de los que permiten sus direcciones I²C seleccionables. ¿Qué se necesita?"
    libro: [331]
    widget:
      tipo: figura
      figura: fig-35.17
      zonas:
        - { id: diagnostico, rotulo: "Recuadro de abajo", rect: [6, 103, 440, 104] }
    opciones:
      - texto: "Un multiplexor de I²C"
        bien: true
        porque: "Muchos sensores tienen solo una o dos direcciones: el multiplexor separa los grupos."
      - texto: "Bajar la velocidad del bus"
        porque: "La velocidad no resuelve una dirección repetida."
      - texto: "Más resistencias de pull-up"
        porque: "Las pull-ups no cambian las direcciones."
    escalera:
      - "Dos dispositivos con la misma dirección no pueden estar en el mismo bus."
    solucion: "Un multiplexor de I²C."

  - id: predecir-antes
    tipo: explorar
    titulo: "Leer demasiado pronto"
    texto: "Un bit del registro de datos del sensor: hasta que la conversión termina, el registro conserva el dato anterior. Consiga leer el dato nuevo."
    libro: [332]
    widget:
      tipo: logica
      entradas: [{ id: FIN, valor: 0, rotulo: "Conversión terminada" }]
      piezas:
        - { id: n0, tipo: not, entradas: [1], rotulo: "Dato anterior" }
        - { id: m1, tipo: mux, entradas: [FIN, n0, 1], rotulo: "Registro de datos" }
      salidas:
        - { id: EST, de: FIN, rotulo: "Bit de estado" }
        - { id: DAT, de: m1, rotulo: "Bit leído" }
    objetivo:
      condiciones:
        - { led: EST, valor: 1, rotulo: "Conversión terminada" }
        - { led: DAT, valor: 1, rotulo: "Dato nuevo leído" }
      logrado: "Leído antes de tiempo, el bus devuelve sin error el dato anterior. Lo correcto es consultar el bit de estado antes de leer."
      pistas:
        - { texto: "El dato nuevo no está hasta que la conversión termina." }
    escalera:
      - "Espere a que el bit de estado diga que ha terminado."
    solucion: "Conversión terminada: entonces se lee el dato nuevo."

  - id: porque-plausibilidad
    tipo: explorar
    titulo: "Unos que parecen medidas"
    texto: "La línea de datos del bus tiene pull-up, y el sensor la baja para mandar ceros. Deje el sensor sin responder y mire qué lee el maestro."
    libro: [334, 342, 343]
    widget:
      tipo: logica
      entradas:
        - { id: RES, valor: 1, rotulo: "Sensor responde" }
        - { id: BIT, valor: 0, rotulo: "Bit que manda" }
      piezas:
        - { id: t1, tipo: tri, entradas: [BIT, RES], rotulo: "Salida del sensor" }
        - { id: sda, tipo: bus, entradas: [t1], pullup: 1, rotulo: "Línea de datos" }
      salidas:
        - { id: VIVO, de: RES, rotulo: "Sensor responde" }
        - { id: LEE, de: sda, rotulo: "Lo que lee el maestro" }
    objetivo:
      condiciones:
        - { led: VIVO, valor: 0, rotulo: "Sensor callado" }
        - { led: LEE, valor: 1, rotulo: "El maestro lee alto" }
      logrado: "Con el sensor callado, el pull-up deja la línea alta: todo unos, que parece una medida. Por eso se comprueban el identificador y el rango; si ni el identificador responde, el problema es de bus."
      pistas:
        - { texto: "Quite la respuesta del sensor." }
    escalera:
      - "Sin nadie que la baje, la línea queda en lo que fija el pull-up."
    solucion: "Sensor sin responder: el maestro lee alto, un uno."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [319, 327, 334, 336, 337, 338, 339, 342]
    ideas:
      - { titulo: "Se gana.", texto: "Calibración individual de fábrica, compensación y menos componentes." }
      - { titulo: "Se pierde.", texto: "Control, visibilidad y la independencia de un componente." }
      - { titulo: "Plausibilidad.", texto: "Todo ceros o todo unos no son medidas: identificador y rango." }
      - { titulo: "Primer paso.", texto: "Leer el identificador: si no responde, es el bus (direcciones, pull-ups o alimentación). Y el analógico sigue ganando si hace falta velocidad, distancia, control fino o vida larga." }
