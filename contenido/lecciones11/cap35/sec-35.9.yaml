# Lección 1.2 de la sección 36.9 «Sensores en los Proyectos del Libro» (cap35, sec-35.9). Formato: GUIA.md.
# - La tabla de la figura 36.15 (fig-35.15): proyecto, magnitud, tipo, solución y lo que ilustra; zonas por filas.
# Sección descriptiva, sin números ni fórmulas (aviso de secuencia «sin tarjeta de fórmula»); sin modelo.
# Paso práctico: «tocar» en la tabla la fila del único caso que exige construir la cadena analógica entera (sonido).
leccion: cap35/sec-35.9

libro:
  256: "cada elección ilustra un compromiso distinto del capítulo"
  258: "lo que elimina el acondicionamiento y la calibración"
  259: "se renuncia al control sobre la cadena de medida a cambio de simplicidad"
  260: "el autocalentamiento por la electrónica vecina"
  263: "es el único caso donde hay que construir la cadena entera"
  265: "aceptable porque la corriente es moderada"
  268: "es un elemento del circuito de polarización que cumple función de sensor"
  269: "la medida no siempre necesita un componente dedicado"
  271: "un sensor de una magnitud eléctrica y no física, y aun así sigue las mismas reglas"
  274: "Digital cuando la simplicidad manda y la exactitud del fabricante basta"
  275: "Analógico cuando hace falta control sobre la cadena, o cuando no existe versión digital"
  276: "Elementos del propio circuito cuando la magnitud ya está disponible"
  277: "el montaje y el acoplamiento con lo medido importan más que el sensor"
  280: "tiene un problema de montaje, y ese es el hallazgo más frecuente de todo el capítulo"
  281: "Los sensores de los proyectos del libro y el compromiso que ilustra cada elección"

modelo: { valores: {}, calculos: {} }

tarjetas:
  - id: explore-proyectos
    tipo: explorar
    titulo: "Un puñado de sensores"
    texto: "Cada sensor de los proyectos ilustra un compromiso distinto. Toque un digital, el analógico más instructivo y uno del propio circuito."
    libro: [256, 281]
    widget:
      tipo: figura
      figura: fig-35.15
      zonas:
        - { id: clima, rotulo: "Primera fila", rect: [0, 20, 450, 36], texto: "Estación: temperatura y humedad con un sensor digital integrado. Simplicidad a cambio del control." }
        - { id: sonido, rotulo: "Cuarta fila", rect: [0, 94, 450, 36], texto: "Estación: sonido con un electret y su cadena analógica completa." }
        - { id: bias, rotulo: "Séptima fila", rect: [0, 169, 450, 36], texto: "Amplificador: un transistor del circuito de polarización hace de sensor de temperatura." }
        - { id: regla, rotulo: "Recuadro de abajo", rect: [5, 230, 440, 40], texto: "En todos los casos, el montaje importa más que el sensor." }
    requiere: { mover: [clima, sonido, bias] }

  - id: empareje-soluciones
    tipo: pregunta
    titulo: "Cada magnitud, su solución"
    texto: "Empareje cada magnitud de un proyecto con su solución."
    libro: [258, 263, 265, 268]
    widget:
      tipo: figura
      figura: fig-35.15
      zonas:
        - { id: tabla, rotulo: "La tabla", rect: [0, 0, 450, 226] }
    emparejar:
      - ["Temperatura y humedad de la estación", "Sensor digital integrado"]
      - ["Sonido de la estación", "Electret y cadena analógica"]
      - ["Corriente de la fuente", "Shunt y amplificador de sensado"]
      - ["Temperatura del disipador del amplificador", "Transistor del bias"]
    exito: "Digital, analógico y del propio circuito: las tres opciones del capítulo."
    pistas:
      - { texto: "El único que obliga a construir la cadena entera es el sonido." }
    escalera:
      - "En el amplificador, la medida la hace un componente que ya estaba."
    solucion: "Clima, digital; sonido, electret; corriente, shunt; disipador, transistor del bias."

  - id: toque-sonido
    tipo: tocar
    titulo: "El caso más instructivo"
    texto: "Toque la fila del único sensor que obliga a construir la cadena de medida entera."
    libro: [263]
    widget:
      tipo: figura
      figura: fig-35.15
      zonas:
        - { id: clima, rotulo: "Primera fila", rect: [0, 20, 450, 36] }
        - { id: sonido, rotulo: "Cuarta fila", rect: [0, 94, 450, 36] }
        - { id: corriente, rotulo: "Quinta fila", rect: [0, 122, 450, 36] }
        - { id: receptor, rotulo: "Última fila", rect: [0, 194, 450, 36] }
    tocar:
      bien: [sonido]
      porque:
        clima: "Es digital: entrega valores calibrados por bus, sin acondicionamiento."
        corriente: "Es analógico, pero con un amplificador de sensado hecho para eso."
        receptor: "Mide una magnitud eléctrica que el propio receptor ya tiene."
    exito: "El sonido: electret, amplificación, referencia y filtro. Por eso es el más instructivo."
    escalera:
      - "Busque el analógico sin ayuda de un integrado específico."
    solucion: "La cuarta fila: el sonido con un electret."

  - id: pregunta-compromiso
    tipo: pregunta
    titulo: "Lo que cuesta el digital"
    texto: "La estación mide temperatura y humedad con un sensor digital integrado. ¿Qué se sacrifica?"
    libro: [258, 259]
    widget:
      tipo: figura
      figura: fig-35.15
      zonas:
        - { id: clima, rotulo: "Primera fila", rect: [0, 20, 450, 36] }
    opciones:
      - texto: "El control sobre la cadena de medida"
        bien: true
        porque: "No se puede mejorar lo que el fabricante decidió, y hay que fiarse de su calibración."
      - texto: "La exactitud"
        porque: "Viene calibrado: la exactitud es la del fabricante, que suele bastar."
      - texto: "Nada: solo hay ventajas"
        porque: "Se gana simplicidad a cambio del control: es un compromiso."
    escalera:
      - "¿Quién decide la ganancia, el filtro y la calibración?"
    solucion: "El control sobre la cadena."

  - id: pregunta-shunt
    tipo: pregunta
    titulo: "El shunt de la fuente"
    texto: "La fuente de laboratorio mide su corriente con un shunt, que disipa y no aísla. ¿Por qué es aceptable?"
    libro: [265]
    widget:
      tipo: figura
      figura: fig-35.15
      zonas:
        - { id: corriente, rotulo: "Quinta fila", rect: [0, 122, 450, 36] }
    opciones:
      - texto: "Porque la corriente es moderada y se gana exactitud"
        bien: true
        porque: "Es el criterio de la sección 36.5: shunt cuando importa la exactitud y la corriente no es grande."
      - texto: "Porque el shunt aísla"
        porque: "No aísla; en la fuente no hace falta aislamiento."
      - texto: "Porque no disipa"
        porque: "Disipa I²·R, aceptable con corriente moderada."
    escalera:
      - "Recuerde el criterio entre shunt y Hall."
    solucion: "Corriente moderada y exactitud alta."

  - id: porque-transistor
    tipo: porque
    titulo: "Un sensor que no lo es"
    texto: "En el amplificador, la temperatura del disipador la mide un transistor del bias. ¿Qué enseña eso?"
    libro: [268, 269]
    widget:
      tipo: figura
      figura: fig-35.15
      zonas:
        - { id: bias, rotulo: "Séptima fila", rect: [0, 169, 450, 36] }
    opciones:
      - texto: "Que la medida no siempre necesita un componente dedicado"
        bien: true
        porque: "Un elemento del circuito de polarización cumple función de sensor."
      - texto: "Que los transistores son mejores sensores"
        porque: "No es que sea mejor: aprovecha que la magnitud ya está disponible en el circuito."
      - texto: "Que sobra medir la temperatura"
        porque: "Se mide, y mucho: solo que sin un sensor aparte."
    escalera:
      - "¿Qué componente se añadió para medir?"
    solucion: "La medida puede hacerla un elemento del propio circuito."

  - id: pregunta-receptor
    tipo: pregunta
    titulo: "La intensidad de señal"
    texto: "El receptor mide la intensidad de la señal que recibe. ¿Sigue las reglas de un sensor?"
    libro: [271]
    widget:
      tipo: figura
      figura: fig-35.15
      zonas:
        - { id: receptor, rotulo: "Última fila", rect: [0, 194, 450, 36] }
    opciones:
      - texto: "Sí: acondicionamiento, escala y la duda de si mide lo que se cree"
        bien: true
        porque: "Es una magnitud eléctrica y no física, y aun así sigue las mismas reglas."
      - texto: "No: es una magnitud eléctrica"
        porque: "Que sea eléctrica no la libra de escalas, acondicionamiento ni dudas."
      - texto: "Solo si lleva un sensor dedicado"
        porque: "Lo mide el propio receptor, y las reglas valen igual."
    escalera:
      - "¿Hace falta escalar y acondicionar esa medida?"
    solucion: "Sí, las mismas reglas."

  - id: empareje-reglas
    tipo: pregunta
    titulo: "La conclusión del capítulo"
    texto: "Empareje cada tipo de solución con cuándo conviene."
    libro: [274, 275, 276]
    widget:
      tipo: figura
      figura: fig-35.15
      zonas:
        - { id: regla, rotulo: "Recuadro de abajo", rect: [5, 230, 440, 40] }
    emparejar:
      - ["Digital", "La simplicidad manda y la exactitud del fabricante basta"]
      - ["Analógico", "Hace falta control, o no hay versión digital"]
      - ["Del propio circuito", "La magnitud ya está disponible"]
    exito: "Y en los tres casos manda el montaje y el acoplamiento con lo medido."
    pistas:
      - { texto: "El transistor del bias ya estaba en el circuito." }
    escalera:
      - "El sonido no tiene versión digital en la estación."
    solucion: "Digital, simplicidad; analógico, control; del circuito, magnitud disponible."

  - id: predecir-caja
    tipo: predecir
    titulo: "Bien en el banco, mal en la caja"
    texto: "Un sensor de temperatura acierta en el banco y falla montado en su caja. ¿Qué problema tiene?"
    libro: [260, 277, 280]
    widget:
      tipo: figura
      figura: fig-35.15
      zonas:
        - { id: regla, rotulo: "Recuadro de abajo", rect: [5, 230, 440, 40] }
    opciones:
      - texto: "De montaje"
        bien: true
        porque: "Es el hallazgo más frecuente del capítulo: por ejemplo, el calor de la electrónica vecina."
      - texto: "De sensor: está mal calibrado"
        porque: "En el banco acierta: el sensor está bien; falla lo que lo rodea."
      - texto: "Del convertidor"
        porque: "El convertidor es el mismo en el banco y en la caja."
    escalera:
      - "¿Qué cambia entre el banco y la caja?"
    solucion: "De montaje: compare con una referencia en las condiciones reales."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [259, 263, 269, 277]
    ideas:
      - { titulo: "Digital.", texto: "Simplicidad a cambio del control sobre la cadena." }
      - { titulo: "Analógico.", texto: "El sonido: el único caso con la cadena entera." }
      - { titulo: "Del circuito.", texto: "Un transistor del bias puede ser el sensor." }
      - { titulo: "Siempre.", texto: "El montaje importa más que el sensor." }
