# Lección 1.2 de la sección 36.9 «Sensores en los Proyectos del Libro» (cap35, sec-35.9). Formato: GUIA.md.
# - La tabla de la figura 36.15 (fig-35.15): proyecto, magnitud, tipo, solución y lo que ilustra; zonas por filas.
# Sección descriptiva, sin números ni fórmulas (aviso de secuencia «sin tarjeta de fórmula»); sin modelo.
# Paso práctico: «tocar» en la tabla la fila del único caso que exige construir la cadena analógica entera (sonido).
# 1.2.1 (autor121-sens, «aprender haciendo», GUIA §13): las zonas de la tabla se recalculan fila a fila desde la fuente
# de la figura (filas de 25 px: avisan de tamaño en un teléfono, con la lista de zonas). Cada compromiso se busca
# tocando su fila: el digital, el sonido, el shunt y los dos «del circuito». Sección descriptiva, sin números ni
# fórmulas: queda en 4 de 7; quedan una de opciones (la caja) y una de emparejar (la conclusión).
# 1.3 (contenido13): la exploración de la tabla lleva objetivo de zonas («explorar sin modelo», GUIA §13.3): 4/7 → 5/7.
leccion: cap35/sec-35.9

libro:
  256: "cada elección ilustra un compromiso distinto del capítulo"
  258: "lo que elimina el acondicionamiento y la calibración"
  259: "se renuncia al control sobre la cadena de medida a cambio de simplicidad"
  260: "el autocalentamiento por la electrónica vecina"
  263: "es el único caso donde hay que construir la cadena entera"
  265: "aceptable porque la corriente es moderada"
  268: "es un elemento del circuito de polarización que cumple función de sensor"
  269: "la medida no siempre necesita un componente dedicado"
  271: "un sensor de una magnitud eléctrica y no física, y aun así sigue las mismas reglas"
  274: "Digital cuando la simplicidad manda y la exactitud del fabricante basta"
  275: "Analógico cuando hace falta control sobre la cadena, o cuando no existe versión digital"
  276: "Elementos del propio circuito cuando la magnitud ya está disponible"
  277: "el montaje y el acoplamiento con lo medido importan más que el sensor"
  280: "tiene un problema de montaje, y ese es el hallazgo más frecuente de todo el capítulo"
  281: "Los sensores de los proyectos del libro y el compromiso que ilustra cada elección"

modelo: { valores: {}, calculos: {} }

tarjetas:
  - id: explore-proyectos
    tipo: explorar
    titulo: "Un puñado de sensores"
    texto: "Cada sensor de los proyectos ilustra un compromiso distinto. Toque un digital, el analógico más instructivo y uno del propio circuito."
    libro: [256, 281]
    widget:
      tipo: figura
      figura: fig-35.15
      zonas:
        - { id: clima, rotulo: "Primera fila", rect: [4, 23, 443, 25], texto: "Estación: temperatura y humedad con un sensor digital integrado. Simplicidad a cambio del control." }
        - { id: sonido, rotulo: "Cuarta fila", rect: [4, 99, 443, 26], texto: "Estación: sonido con un electret y su cadena analógica completa." }
        - { id: bias, rotulo: "Séptima fila", rect: [4, 176, 443, 26], texto: "Amplificador: un transistor del circuito de polarización hace de sensor de temperatura." }
        - { id: regla, rotulo: "Recuadro de abajo", rect: [5, 230, 440, 40], texto: "En todos los casos, el montaje importa más que el sensor." }
    objetivo:
      condiciones:
        - { zona: clima, rotulo: "Un digital" }
        - { zona: sonido, rotulo: "El analógico más instructivo" }
        - { zona: bias, rotulo: "Uno del propio circuito" }
      logrado: "Un digital por simplicidad, el analógico que obliga a construir la cadena entera y un transistor del circuito que hace de sensor: cada elección, un compromiso distinto."
      pistas:
        - { texto: "Toque las filas que faltan; cada una dice su compromiso." }
    escalera:
      - "La primera fila, la cuarta y la séptima."
    solucion: "Toque la primera, la cuarta y la séptima fila."

  - id: empareje-soluciones
    tipo: tocar
    titulo: "Lo que cuesta el digital"
    texto: "La estación mide temperatura y humedad con un sensor digital integrado. Toque los casos que ganan simplicidad renunciando al control sobre la cadena."
    libro: [258, 259]
    widget:
      tipo: figura
      figura: fig-35.15
      zonas:
        - { id: clima, rotulo: "Primera fila", rect: [4, 23, 443, 25] }
        - { id: presion, rotulo: "Segunda fila", rect: [4, 48, 443, 26] }
        - { id: luz, rotulo: "Tercera fila", rect: [4, 74, 443, 25] }
        - { id: sonido, rotulo: "Cuarta fila", rect: [4, 99, 443, 26] }
    tocar:
      bien: [clima, presion]
      todas: true
      porque:
        luz: "La luz pide resolver un margen dinámico enorme, con ganancia conmutable."
        sonido: "El sonido es el contrario: hay que construir la cadena entera."
    exito: "La temperatura, la humedad y la presión: no se puede mejorar lo que el fabricante decidió, y hay que fiarse de su calibración."
    escalera:
      - "¿Quién decide la ganancia, el filtro y la calibración?"
    solucion: "Las dos primeras filas."

  - id: toque-sonido
    tipo: tocar
    titulo: "El caso más instructivo"
    texto: "Toque la fila del único sensor que obliga a construir la cadena de medida entera."
    libro: [263]
    widget:
      tipo: figura
      figura: fig-35.15
      zonas:
        - { id: clima, rotulo: "Primera fila", rect: [4, 23, 443, 25] }
        - { id: sonido, rotulo: "Cuarta fila", rect: [4, 99, 443, 26] }
        - { id: corriente, rotulo: "Quinta fila", rect: [4, 125, 443, 25] }
        - { id: receptor, rotulo: "Última fila", rect: [4, 202, 443, 25] }
    tocar:
      bien: [sonido]
      porque:
        clima: "Es digital: entrega valores calibrados por bus, sin acondicionamiento."
        corriente: "Es analógico, pero con un amplificador de sensado hecho para eso."
        receptor: "Mide una magnitud eléctrica que el propio receptor ya tiene."
    exito: "El sonido: electret, amplificación, referencia y filtro. Por eso es el más instructivo."
    escalera:
      - "Busque el analógico sin ayuda de un integrado específico."
    solucion: "La cuarta fila: el sonido con un electret."

  - id: pregunta-compromiso
    tipo: tocar
    titulo: "El shunt de la fuente"
    texto: "Un shunt disipa y no aísla. Toque el caso del libro que lo acepta, y fíjese en qué gana."
    libro: [265]
    widget:
      tipo: figura
      figura: fig-35.15
      zonas:
        - { id: sonido, rotulo: "Cuarta fila", rect: [4, 99, 443, 26] }
        - { id: corriente, rotulo: "Quinta fila", rect: [4, 125, 443, 25] }
        - { id: disipador, rotulo: "Sexta fila", rect: [4, 151, 443, 25] }
        - { id: bias, rotulo: "Séptima fila", rect: [4, 176, 443, 26] }
    tocar:
      bien: [corriente]
      porque:
        sonido: "El sonido lo capta un electret, no un shunt."
        disipador: "La temperatura del disipador de la fuente la mide una NTC o un integrado."
        bias: "Esa es la temperatura del amplificador, medida con un transistor."
    exito: "La corriente de la fuente: moderada, y se gana exactitud. Es el criterio de la sección 36.5 entre shunt y Hall."
    escalera:
      - "Busque la corriente."
    solucion: "La quinta fila."

  - id: porque-transistor
    tipo: tocar
    titulo: "Un sensor que no lo es"
    texto: "Toque los casos en los que la medida no necesita un componente dedicado."
    libro: [268, 269, 271]
    widget:
      tipo: figura
      figura: fig-35.15
      zonas:
        - { id: corriente, rotulo: "Quinta fila", rect: [4, 125, 443, 25] }
        - { id: disipador, rotulo: "Sexta fila", rect: [4, 151, 443, 25] }
        - { id: bias, rotulo: "Séptima fila", rect: [4, 176, 443, 26] }
        - { id: receptor, rotulo: "Última fila", rect: [4, 202, 443, 25] }
    tocar:
      bien: [bias, receptor]
      todas: true
      porque:
        corriente: "El shunt y su amplificador se añaden para medir."
        disipador: "La NTC o el integrado son componentes puestos para medir."
    exito: "El transistor del bias y el nivel del propio receptor: la magnitud ya estaba en el circuito. Y aunque la del receptor sea eléctrica, sigue las mismas reglas: escala, acondicionamiento y la duda de si mide lo que se cree."
    escalera:
      - "Busque los dos «del circuito»."
    solucion: "La séptima y la última fila."

  - id: empareje-reglas
    tipo: pregunta
    titulo: "La conclusión del capítulo"
    texto: "Empareje cada tipo de solución con cuándo conviene."
    libro: [274, 275, 276]
    widget:
      tipo: figura
      figura: fig-35.15
      zonas:
        - { id: regla, rotulo: "Recuadro de abajo", rect: [5, 230, 440, 40] }
    emparejar:
      - ["Digital", "La simplicidad manda y la exactitud del fabricante basta"]
      - ["Analógico", "Hace falta control, o no hay versión digital"]
      - ["Del propio circuito", "La magnitud ya está disponible"]
    exito: "Y en los tres casos manda el montaje y el acoplamiento con lo medido."
    pistas:
      - { texto: "El transistor del bias ya estaba en el circuito." }
    escalera:
      - "El sonido no tiene versión digital en la estación."
    solucion: "Digital, simplicidad; analógico, control; del circuito, magnitud disponible."

  - id: predecir-caja
    tipo: predecir
    titulo: "Bien en el banco, mal en la caja"
    texto: "Un sensor de temperatura acierta en el banco y falla montado en su caja. ¿Qué problema tiene?"
    libro: [260, 277, 280]
    widget:
      tipo: figura
      figura: fig-35.15
      zonas:
        - { id: regla, rotulo: "Recuadro de abajo", rect: [5, 230, 440, 40] }
    opciones:
      - texto: "De montaje"
        bien: true
        porque: "Es el hallazgo más frecuente del capítulo: por ejemplo, el calor de la electrónica vecina."
      - texto: "De sensor: está mal calibrado"
        porque: "En el banco acierta: el sensor está bien; falla lo que lo rodea."
      - texto: "Del convertidor"
        porque: "El convertidor es el mismo en el banco y en la caja."
    escalera:
      - "¿Qué cambia entre el banco y la caja?"
    solucion: "De montaje: compare con una referencia en las condiciones reales."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [259, 263, 269, 277]
    ideas:
      - { titulo: "Digital.", texto: "Simplicidad a cambio del control sobre la cadena." }
      - { titulo: "Analógico.", texto: "El sonido: el único caso con la cadena entera." }
      - { titulo: "Del circuito.", texto: "Un transistor del bias puede ser el sensor." }
      - { titulo: "Siempre.", texto: "El montaje importa más que el sensor." }
