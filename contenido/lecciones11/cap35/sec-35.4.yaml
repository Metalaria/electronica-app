# Lección 1.2 de la sección 36.4 «Movimiento: Acelerómetros, Giróscopos e IMU» (cap35, sec-35.4). Formato: GUIA.md.
# - Las familias de posición y la fusión de acelerómetro y giróscopo (figura 36.7, fig-35.7, con zonas por filas).
# - Ejercicio 36.9 (bloque 345): absolutos (potenciómetro, código Gray, LVDT) frente al incremental de cuadratura.
# Sin fórmulas en la sección (aviso de secuencia «sin tarjeta de fórmula»).
# Paso práctico: «banco» opcional, el acelerómetro quieto contra el patrón de 1 g de la gravedad (bloque 127); la
# tolerancia del ± 5 % es de ejemplo.
# 1.2.1 (autor121-sens, «aprender haciendo», GUIA §13): en la tabla de la figura 36.7 se tocan las columnas de las
# cuatro preguntas; el código Gray y la verificación por cuenta (bloques 110 y 126) se hacen en el simulador lógico
# (un disco de 2 bits y un encoder de ejemplo de 4 impulsos por vuelta, rotulados). El potenciómetro, el inclinómetro
# y el montaje pasan a éxitos y resumen.
# 1.3 (contenido13): el disco Gray recupera su cronograma (con objetivo ya no quita el botón de pulso, GUIA §13.3); se
# marca en él el paso de dos bits; la cadena del LVDT se toca en orden en la foto del equipo didáctico (fig-35.8); el
# emparejamiento de las familias pasa al resumen: 4/7 → 6/8.
leccion: cap35/sec-35.4

libro:
  102: "absoluto o incremental, contacto o sin contacto, lineal o angular"
  104: "Al encender, el sistema ya sabe dónde está"
  105: "hace falta un procedimiento de referenciado"
  106: "si pierde cuentas por ruido no lo sabe"
  108: "su resolución la limita el ruido del contacto, no la pista"
  110: "Gray, para que solo cambie un bit entre posiciones adyacentes y no haya estados espurios"
  112: "absoluto, extremadamente robusto y preciso"
  129: "la cadena de acondicionamiento: excitación, rectificación, filtrado y amplificador diferencial"
  116: "en movimiento, no distingue la aceleración propia de la gravedad"
  117: "esa integración acumula deriva"
  118: "el acelerómetro da referencia absoluta a largo plazo pero es ruidoso en movimiento"
  119: "dos sensores con defectos complementarios dan mejor resultado que cualquiera de los dos mejorado"
  122: "Un encoder mide el eje donde está montado, no la carga"
  126: "dar exactamente una vuelta y comprobar que la cuenta coincide con su resolución nominal"
  127: "la gravedad es un patrón de 1 g disponible siempre"
  128: "Familias de sensores de posición y la fusión de acelerómetro con giróscopo"
  "cap35#345": "Son absolutos el potenciómetro, el encoder con código Gray y el LVDT"

modelo:
  valores:
    g_1: { sim: "g", nombre: "aceleración de la gravedad", unidad: g, valor: 1 }
    N_e: { sim: "N", nombre: "impulsos por vuelta del encoder de ejemplo", unidad: "", valor: 4 }
  calculos: {}

tarjetas:
  - id: explore-familias
    tipo: tocar
    titulo: "Cuatro preguntas"
    texto: "La elección depende de cuatro preguntas: absoluto o incremental, contacto o sin contacto, lineal o angular, y qué resolución. Toque sus columnas en la tabla."
    libro: [102, 128]
    widget:
      tipo: figura
      figura: fig-35.7
      zonas:
        - { id: sensor, rotulo: "Primera columna", rect: [0, 1, 83, 181] }
        - { id: tipo, rotulo: "Segunda columna", rect: [83, 1, 54, 181] }
        - { id: contacto, rotulo: "Tercera columna", rect: [137, 1, 47, 181] }
        - { id: movimiento, rotulo: "Cuarta columna", rect: [184, 1, 61, 181] }
        - { id: resolucion, rotulo: "Quinta columna", rect: [245, 1, 75, 181] }
        - { id: rasgo, rotulo: "Última columna", rect: [320, 1, 133, 181] }
    tocar:
      bien: [tipo, contacto, movimiento, resolucion]
      todas: true
      porque:
        sensor: "Es el nombre de cada familia, no una de las preguntas."
        rasgo: "Es lo que distingue a cada uno: la consecuencia de las respuestas."
    exito: "Tipo, contacto, movimiento y resolución. El potenciómetro, por ejemplo: absoluto y barato, pero con contacto; se desgasta, y su resolución la limita el ruido del contacto."
    escalera:
      - "Son las cuatro columnas del medio."
    solucion: "De la segunda a la quinta."

  - id: predecir-ruido
    tipo: predecir
    titulo: "Cuentas perdidas"
    texto: "Una máquina con encoders incrementales pierde unos pulsos por ruido. ¿Qué pasa?"
    libro: [106]
    widget:
      tipo: figura
      figura: fig-35.7
      zonas:
        - { id: incremental, rotulo: "Segunda fila", rect: [0, 40, 453, 36] }
    opciones:
      - texto: "Sigue trabajando con la posición equivocada, sin saberlo"
        bien: true
        porque: "Un incremental solo cuenta cambios: si pierde cuentas, no lo sabe. Uno absoluto, sí."
      - texto: "Se para y avisa"
        porque: "No tiene forma de saberlo: la cuenta perdida no deja rastro."
      - texto: "Nada: se corrige sola en la siguiente vuelta"
        porque: "Solo se corrige al volver a referenciar en un final de carrera o una marca de índice."
    escalera:
      - "¿Qué sabe un incremental al encender?"
    solucion: "Trabaja desplazada sin saberlo, hasta que se referencie."

  - id: pregunta-gray
    tipo: explorar
    titulo: "El código del disco"
    texto: "Un disco absoluto de 2 bits, leído en binario y en Gray. Gírelo desde la posición 0 hasta la 2 y compare cuántos bits cambian en cada paso."
    libro: [110]
    widget:
      tipo: logica
      entradas: [{ id: CLK, reloj: true, rotulo: "Un paso de giro" }]
      piezas:
        - { id: c1, tipo: contador, bits: 2, entradas: [CLK], rotulo: "Posición" }
        - { id: x1, tipo: xor, entradas: [c1.q1, c1.q0] }
      salidas:
        - { id: B1, de: c1.q1, rotulo: "Binario, bit 1" }
        - { id: B0, de: c1.q0, rotulo: "Binario, bit 0" }
        - { id: G1, de: c1.q1, rotulo: "Gray, bit 1" }
        - { id: G0, de: x1, rotulo: "Gray, bit 0" }
      cronograma: { ciclos: 3, senales: [CLK, B1, B0, G1, G0] }
    objetivo:
      condiciones:
        - { led: G1, valor: 1, rotulo: "Gray, bit 1 a 1" }
        - { led: G0, valor: 1, rotulo: "Gray, bit 0 a 1" }
      logrado: "De la 1 a la 2, en binario cambian los dos bits y, si no lo hacen a la vez, se lee una posición falsa. En Gray cambia uno solo: no hay estados espurios."
      pistas:
        - { texto: "Dé otro paso." }
    escalera:
      - "Entre posiciones vecinas, en Gray cambia un solo bit."
    solucion: "Dos pasos; en el segundo, en Gray, solo cambia el bit 1."

  - id: marque-dos-bits
    tipo: marcar
    titulo: "El paso peligroso"
    texto: "El mismo disco girando tres pasos. Lleve el cursor al paso en que el binario cambia sus dos bits a la vez y el Gray, uno solo."
    libro: [110]
    widget:
      tipo: logica
      entradas: [{ id: CLK, reloj: true, rotulo: "Un paso de giro" }]
      piezas:
        - { id: c1, tipo: contador, bits: 2, entradas: [CLK], rotulo: "Posición" }
        - { id: x1, tipo: xor, entradas: [c1.q1, c1.q0] }
      salidas:
        - { id: B1, de: c1.q1, rotulo: "Binario, bit 1" }
        - { id: B0, de: c1.q0, rotulo: "Binario, bit 0" }
        - { id: G1, de: c1.q1, rotulo: "Gray, bit 1" }
        - { id: G0, de: x1, rotulo: "Gray, bit 0" }
      cronograma: { ciclos: 3, senales: [CLK, B1, B0, G1, G0] }
    marcar:
      cronograma: true
      ciclo: 2
      rotulo: "Dos bits a la vez en binario"
      porque:
        1: "De la 0 a la 1: en binario solo cambia el bit 0."
        3: "De la 2 a la 3: en binario solo cambia el bit 0."
    exito: "De la 1 a la 2: en binario cambian los dos bits, y si no lo hacen a la vez se lee un instante una posición falsa. En Gray solo cambia el bit 1."
    escalera:
      - "Mire en qué flanco cambian a la vez las dos filas del binario."
    solucion: "El segundo paso, de la posición 1 a la 2."

  - id: toque-lvdt
    tipo: tocar
    titulo: "La cadena de un LVDT"
    texto: "Un LVDT necesita excitación alterna y demodulación. En este equipo didáctico, toque los bloques en el orden que recorre la señal."
    libro: [112, 129]
    widget:
      tipo: figura
      figura: fig-35.8
      zonas:
        - { id: excitacion, rotulo: "Bloque de la izquierda", rect: [310, 255, 170, 230] }
        - { id: lvdt, rotulo: "Bloque alto del centro", rect: [640, 205, 190, 345] }
        - { id: acondicionador, rotulo: "Bloque con cuatro recuadros", rect: [835, 255, 195, 225] }
        - { id: diferencial, rotulo: "Bloque con el triángulo grande", rect: [1090, 330, 225, 220] }
        - { id: pantalla, rotulo: "Pantalla de arriba a la derecha", rect: [1090, 180, 225, 140] }
        - { id: micrometro, rotulo: "Tornillo de abajo a la derecha", rect: [1060, 640, 520, 170] }
    tocar:
      bien: [excitacion, lvdt, acondicionador, diferencial]
      orden: true
      porque:
        pantalla: "La pantalla muestra el resultado al final; no es un paso de la señal."
        micrometro: "Es el micrómetro que mueve el núcleo para calibrar, fuera de la cadena."
    exito: "Excitación, el transformador con su núcleo móvil, rectificación y filtrado, y el amplificador diferencial. Absoluto, robusto y con resolución prácticamente infinita."
    escalera:
      - "Empiece por el generador que alimenta el primario."
    solucion: "Generador de excitación, LVDT, acondicionador (rectificador y filtro) y amplificador diferencial."

  - id: porque-fusion
    tipo: porque
    titulo: "Acelerómetro y giróscopo"
    texto: "¿Por qué se combinan acelerómetro y giróscopo en lugar de mejorar uno de los dos?"
    libro: [116, 117, 118, 119]
    widget:
      tipo: figura
      figura: fig-35.7
      zonas:
        - { id: fusion, rotulo: "Gráfica de abajo", rect: [35, 195, 280, 105] }
    opciones:
      - texto: "Sus defectos son complementarios: uno da la referencia, el otro la limpieza"
        bien: true
        porque: "El acelerómetro da la referencia a largo plazo, pero en movimiento no distingue su aceleración de la gravedad; el giróscopo, la señal limpia a corto."
      - texto: "Porque el giróscopo mide la gravedad"
        porque: "Mide velocidad angular; integrándola da el ángulo, con deriva."
      - texto: "Para tener un sensor de repuesto"
        porque: "No es redundancia: un filtro complementario o de Kalman toma lo mejor de cada uno."
    escalera:
      - "Mire la gráfica: ¿cuál es ruidoso y cuál se va alejando?"
    solucion: "Defectos complementarios: la fusión toma lo mejor de los dos."

  - id: pregunta-encoder
    tipo: explorar
    titulo: "Verificar un encoder"
    texto: "Un encoder se verifica contando. Dé exactamente una vuelta a uno de 4 impulsos por vuelta y compruebe que la cuenta coincide."
    nota: "Encoder de ejemplo."
    libro: [126]
    widget:
      tipo: logica
      entradas: [{ id: CLK, reloj: true, rotulo: "Un impulso del encoder" }]
      piezas:
        - { id: c1, tipo: contador, bits: 3, entradas: [CLK], rotulo: "Cuenta" }
      salidas:
        - { id: Q2, de: c1.q2, rotulo: "Cuenta, bit 2" }
        - { id: Q1, de: c1.q1, rotulo: "Cuenta, bit 1" }
        - { id: Q0, de: c1.q0, rotulo: "Cuenta, bit 0" }
    objetivo:
      condiciones:
        - { led: Q2, valor: 1, rotulo: "Bit 2 a 1" }
        - { led: Q1, valor: 0, rotulo: "Bit 1 a 0" }
        - { led: Q0, valor: 0, rotulo: "Bit 0 a 0" }
      logrado: "Cuatro impulsos, cuenta 100: una vuelta, su resolución nominal. Si sale por debajo, se pierden pulsos, por ruido o por velocidad excesiva, y un incremental no lo sabe."
      pistas:
        - { texto: "Cuente los impulsos hasta 4: en binario, 100." }
    escalera:
      - "Una vuelta exacta debe dar exactamente su número de pulsos."
    solucion: "Cuatro impulsos."

  - id: banco-gravedad
    tipo: banco
    titulo: "Un patrón de 1 g gratis"
    texto: "Deje un acelerómetro quieto sobre la mesa, con su eje Z hacia arriba, y lea ese eje."
    nota: "La tolerancia del ± 5 % es de ejemplo."
    libro: [127]
    banco:
      piezas: ["Un acelerómetro (un módulo o el del móvil)", "Una superficie horizontal y quieta"]
      medir: "La lectura del eje Z, con el acelerómetro quieto y cara arriba."
      esperado: g_1
      unidad: g
      tol: 0.05
      consejos:
        - { cuando: { valor: desviacion, mayor: 0.05 }, texto: "Lee de más: dele la vuelta y lea cara abajo; la diferencia entre las dos da la ganancia y la suma, el offset." }
        - { cuando: { valor: desviacion, menor: -0.05 }, texto: "Lee de menos: ¿está horizontal? Si lo está, compare cara arriba y cara abajo para separar offset y ganancia." }
        - { texto: "Dentro. Con las seis orientaciones tendría el offset y la ganancia de los tres ejes." }
    comprobar:
      - { g_1: 1 }

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [104, 105, 106, 108, 119, 122, 127, "cap35#345"]
    ideas:
      - { titulo: "Absoluto o incremental.", texto: "Potenciómetro, Gray y LVDT saben dónde están al encender; el incremental se referencia y no sabe si pierde cuentas." }
      - { titulo: "Gray.", texto: "Un solo bit cambia entre posiciones: sin estados espurios." }
      - { titulo: "Fusión.", texto: "Acelerómetro y giróscopo, con defectos complementarios, mejor juntos." }
      - { titulo: "Montaje.", texto: "El encoder mide su eje; el acelerómetro, su soporte." }
