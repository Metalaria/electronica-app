# Lección 1.2 de la sección 36.10 «Excitación del Sensor y la Medida Ratiométrica» (cap35, sec-35.10). Formato: GUIA.md.
# - código = V_señal / V_referencia · 2ⁿ (bloque 292). Ejercicio 36.7 (bloque 345): un puente cuya salida amplificada es
#   la mitad de la excitación, ADC de 16 bits: con referencia fija de 5 V y la excitación en 4,75 V, 31 130 en lugar de
#   32 768; con la referencia igual a la excitación, 32 768 siempre. La gráfica reproduce la figura 36.16.
# - Autocalentamiento (bloque 287 y ejercicio 36.7): RTD de 100 Ω, 100 °C/W bien acoplado (1 000 °C/W en aire quieto):
#   1 mA → 0,01 °C; 5 mA → 0,25 °C; 10 mA → 1 °C; 1 mA en aire quieto → 0,1 °C.
# Paso práctico: «simular» el error de autocalentamiento con 5 mA (error típico: escalarlo con la corriente y no con su
# cuadrado, 0,05 °C).
leccion: cap35/sec-35.10

libro:
  284: "esa excitación introduce sus propios errores, que a menudo superan a los del sensor"
  286: "Si el puente se alimenta con 5 V y esos 5 V se desvían un 1 %, la salida se desvía un 1 %"
  287: "Con 10 mA serían 10 mW y 1 °C: inaceptable"
  288: "su efecto debe calcularse, no suponerse"
  291: "el resultado del convertidor no cambia"
  292: '"código" = (V_("señal"))/(V_("referencia")) times "2"^(n)'
  293: "la excitación se cancela por completo"
  294: "la exactitud y la estabilidad de la fuente de excitación dejan de importar"
  297: "un termopar o un fotodiodo no se excitan, así que no hay nada que cancelar"
  300: "En tensión es lo natural en un puente"
  301: "En corriente es lo correcto para un RTD o un sensor resistivo a tres o cuatro hilos"
  302: "se cancelan los offsets, las tensiones termoeléctricas y la deriva de baja frecuencia"
  308: "variar deliberadamente la tensión de alimentación un 5 % y comprobar que la lectura no cambia"
  309: "Cancelación del error de excitación en una medida ratiométrica"
  "cap35#345": "un puente cuya salida amplificada es la mitad de la excitación se lee con un ADC de 16 bits"

modelo:
  valores:
    V_x: { sim: "V_{exc}", nombre: "tensión de excitación", unidad: V, valor: 5 }
    r_m: { tipo: interruptor, nombre: "referencia igual a la excitación", valor: 0 }
    I_e: { sim: "I", nombre: "corriente de excitación del RTD", unidad: A, valor: 0.005 }
    R_t: { sim: "R_{θ}", nombre: "resistencia térmica", unidad: "°C/W", valor: 100 }
  calculos:
    V_s: { expr: "0.5*V_x", sim: "V_{señal}", nombre: "señal", unidad: V }
    V_f: { si: r_m, entonces: "V_x", sino: "5", sim: "V_{ref}", nombre: "referencia del convertidor", unidad: V }
    c_d: { expr: "V_s/V_f*2^16", sim: "código", nombre: "código del convertidor", unidad: "", cifras: 5 }
    l_p: { expr: "100*c_d/32768", sim: "lectura", nombre: "lectura respecto a la correcta", unidad: "%" }
    P_e: { expr: "I_e^2*100", sim: "P", nombre: "potencia en el RTD", unidad: W }
    d_T: { expr: "P_e*R_t", sim: "ΔT", nombre: "error de autocalentamiento", unidad: "°C" }
    d_L: { expr: "I_e/0.001*0.01", sim: "ΔT'", nombre: "escalado con la corriente", unidad: "°C" }

tarjetas:
  - id: explore-excitacion
    tipo: explorar
    titulo: "La excitación entra en la medida"
    texto: "Un puente da la mitad de su excitación a un convertidor de 16 bits con referencia fija de 5 V. Mueva la excitación."
    libro: [286, "cap35#345"]
    fijar: { r_m: 0 }
    widget:
      tipo: grafica
      x: { id: vx, min: 4.5, max: 5.5, unidad: V, rotulo: "excitación" }
      y: { min: 85, max: 115, unidad: "%", rotulo: "lectura" }
      curvas:
        - { expr: "100*vx/5", color: naranja, rotulo: "referencia fija" }
        - { expr: "100", color: tinta, rotulo: "valor correcto", discontinua: true }
      marcas:
        - { x: "V_x", y: "l_p", rotulo: "{{l_p}}" }
      lectura: { valor: c_d, rotulo: "Código" }
      mandos:
        - { valor: V_x, min: 4.5, max: 5.5, paso: 0.05, rotulo: "Excitación" }
    requiere: { mover: [V_x] }

  - id: formula-codigo
    tipo: formula
    titulo: "El código del convertidor"
    texto: "El convertidor divide la señal entre su referencia."
    libro: [292]
    ec: 292
    sustitucion: "{{V_s}} / {{V_f}} × 2^{16} = {{c_d}}"
    fijar: { r_m: 0 }
    widget:
      tipo: grafica
      x: { id: vx, min: 4.5, max: 5.5, unidad: V, rotulo: "excitación" }
      y: { min: 85, max: 115, unidad: "%", rotulo: "lectura" }
      curvas:
        - { expr: "100*vx/5", color: naranja, rotulo: "referencia fija" }
      marcas:
        - { x: "V_x", y: "l_p", rotulo: "{{l_p}}" }
      lectura: { valor: c_d, rotulo: "Código" }
      mandos:
        - { valor: V_x, min: 4.5, max: 5.5, paso: 0.05, rotulo: "Excitación" }

  - id: predecir-475
    tipo: predecir
    titulo: "La excitación cae a 4,75 V"
    texto: "Con la referencia fija de 5 V, la excitación cae a 4,75 V. ¿Qué código da el convertidor de 16 bits?"
    libro: ["cap35#345"]
    fijar: { V_x: 4.75, r_m: 0 }
    widget:
      tipo: grafica
      x: { id: vx, min: 4.5, max: 5.5, unidad: V, rotulo: "excitación" }
      y: { min: 85, max: 115, unidad: "%", rotulo: "lectura" }
      curvas:
        - { expr: "100", color: tinta, rotulo: "valor correcto", discontinua: true }
      lectura: { valor: c_d, rotulo: "Código" }
      ocultar: true
      mandos: []
    opciones:
      - texto: "Unos 31 130"
        bien: true
        porque: "La señal baja a 2,375 V y la referencia sigue en 5 V: un 5 % por debajo."
      - texto: "32 768"
        porque: "Ese sería con la referencia igual a la excitación: aquí es fija."
      - texto: "Unos 34 406"
        porque: "Al revés: la señal ha bajado, así que el código también baja."
    escalera:
      - "La señal es la mitad de 4,75 V; la referencia, 5 V."
    solucion: "2,375 / 5 · 65 536 ≈ 31 130."
    comprobar:
      - { c_d: 31130, V_s: 2.375, tol: 0.001 }
      - { con: { V_x: 5 }, c_d: 32768 }
      - { con: { V_x: 5.25 }, c_d: 34406, tol: 0.001 }

  - id: sorpresa-ratiometrica
    tipo: sorpresa
    titulo: "La misma tensión de referencia"
    texto: "Ahora la referencia del convertidor es la misma tensión que excita el puente. Actívelo y mueva la excitación."
    libro: [291, 309]
    inicio: { r_m: 0 }
    widget:
      tipo: grafica
      x: { id: vx, min: 4.5, max: 5.5, unidad: V, rotulo: "excitación" }
      y: { min: 85, max: 115, unidad: "%", rotulo: "lectura" }
      curvas:
        - { expr: "100*vx/5", color: naranja, rotulo: "referencia fija", discontinua: true }
      marcas:
        - { x: "V_x", y: "l_p", rotulo: "{{l_p}}" }
      lectura: { valor: c_d, rotulo: "Código" }
      mandos:
        - { valor: r_m, tipo: interruptor, rotulo: "Referencia = excitación" }
        - { valor: V_x, min: 4.5, max: 5.5, paso: 0.05, rotulo: "Excitación" }
    requiere: { mover: [r_m, V_x] }

  - id: porque-cancela
    tipo: porque
    titulo: "Por qué se cancela"
    texto: "Con la medida ratiométrica, ¿por qué deja de importar la exactitud de la excitación?"
    libro: [293, 294]
    widget:
      tipo: figura
      figura: fig-35.16
      zonas:
        - { id: grafica, rotulo: "Gráfica de la izquierda", rect: [30, 15, 205, 175] }
    opciones:
      - texto: "La señal es proporcional a la excitación y la referencia es la excitación"
        bien: true
        porque: "En el cociente del convertidor, la excitación aparece arriba y abajo: se cancela."
      - texto: "Porque el convertidor corrige la deriva"
        porque: "No corrige nada: la variación afecta por igual a señal y referencia."
      - texto: "Porque la excitación es muy estable"
        porque: "Al contrario: puede ser la alimentación del sistema, sin referencia de precisión."
    escalera:
      - "Escriba el código con V_{señal} = k·V_{exc} y V_{ref} = V_{exc}."
    solucion: "La excitación queda arriba y abajo del cociente."

  - id: simule-autocalentamiento
    tipo: simular
    titulo: "Más corriente en el RTD"
    texto: "Un RTD de 100 Ω bien acoplado (100 °C/W) da 0,01 °C de error con 1 mA. ¿Cuánto error da con 5 mA?"
    libro: [287, 288, "cap35#345"]
    fijar: { I_e: 0.005, R_t: 100 }
    simular:
      objetivo: d_T
      unidad: "°C"
      tol: 0.03
      rotulo: "Error de autocalentamiento"
      errores:
        - { expr: "d_L", texto: "Lo ha escalado con la corriente: la potencia, I²·R, va con su cuadrado." }
    exito: "0,25 °C, veinticinco veces el de 1 mA: va con el cuadrado de la corriente."
    escalera:
      - "Calcule P = I²·R y multiplíquela por la resistencia térmica."
    solucion: "(5 mA)² · 100 Ω = 2,5 mW; · 100 °C/W = 0,25 °C."
    comprobar:
      - { d_T: 0.25, d_L: 0.05, P_e: 0.0025 }

  - id: pregunta-aire
    tipo: pregunta
    titulo: "En aire quieto"
    texto: "El mismo RTD con 1 mA, pero en aire quieto: su resistencia térmica es diez veces mayor. ¿Qué error da?"
    libro: [287, "cap35#345"]
    fijar: { I_e: 0.001, R_t: 1000 }
    widget:
      tipo: figura
      figura: fig-35.16
      zonas:
        - { id: auto, rotulo: "Segundo recuadro", rect: [255, 70, 180, 45] }
    opciones:
      - texto: "0,1 °C"
        bien: true
        porque: "0,1 mW por 1 000 °C/W: diez veces el error de un RTD bien acoplado."
      - texto: "0,01 °C"
        porque: "Ese es bien acoplado, con 100 °C/W: en aire quieto la resistencia térmica es diez veces mayor."
      - texto: "1 °C"
        porque: "Ese es con 10 mA y bien acoplado."
    escalera:
      - "La potencia es la misma; la resistencia térmica, diez veces mayor."
    solucion: "0,1 mW · 1 000 °C/W = 0,1 °C."
    comprobar:
      - { d_T: 0.1, P_e: 0.0001 }
      - { con: { R_t: 100 }, d_T: 0.01 }
      - { con: { I_e: 0.01, R_t: 100 }, d_T: 1 }

  - id: pregunta-termopar
    tipo: pregunta
    titulo: "Cuándo no sirve"
    texto: "¿En cuál de estos sensores no se puede aplicar la medida ratiométrica?"
    libro: [297]
    widget:
      tipo: figura
      figura: fig-35.16
      zonas:
        - { id: grafica, rotulo: "Gráfica de la izquierda", rect: [30, 15, 205, 175] }
    opciones:
      - texto: "En un termopar"
        bien: true
        porque: "No se excita: no hay nada que cancelar, y la referencia debe ser buena."
      - texto: "En un puente de galgas"
        porque: "Es de tipo divisor: el caso típico de medida ratiométrica."
      - texto: "En un potenciómetro"
        porque: "También es un divisor: se aplica siempre."
    escalera:
      - "¿Cuál genera su señal sin excitación?"
    solucion: "En el termopar: es un sensor generador."

  - id: empareje-excitacion
    tipo: pregunta
    titulo: "En tensión o en corriente"
    texto: "Empareje cada forma de excitar con su caso."
    libro: [300, 301, 302]
    widget:
      tipo: figura
      figura: fig-35.16
      zonas:
        - { id: conmutada, rotulo: "Recuadro verde", rect: [255, 170, 180, 45] }
    emparejar:
      - ["En tensión", "Un puente, que ya es un divisor"]
      - ["En corriente", "Un RTD a tres o cuatro hilos"]
      - ["Conmutada", "Cancela offsets y tensiones termoeléctricas"]
    exito: "La conmutada cuesta el doble de tiempo de medida."
    pistas:
      - { texto: "Con corriente, la tensión medida es proporcional a la resistencia, sin la de los cables." }
    escalera:
      - "La conmutada invierte el sentido de la corriente y resta las dos medidas."
    solucion: "Tensión, puente; corriente, RTD a hilos; conmutada, offsets."

  - id: pregunta-banco
    tipo: pregunta
    titulo: "¿De verdad ratiométrica?"
    texto: "Se varía la alimentación un 5 % y la lectura cambia. ¿Qué significa?"
    libro: [308]
    widget:
      tipo: figura
      figura: fig-35.16
      zonas:
        - { id: grafica, rotulo: "Gráfica de la izquierda", rect: [30, 15, 205, 175] }
    opciones:
      - texto: "La configuración no es ratiométrica"
        bien: true
        porque: "Aunque se creyera que sí: la referencia no sigue a la excitación."
      - texto: "Es normal: un 5 % siempre se nota"
        porque: "En una ratiométrica la lectura no cambia."
      - texto: "El sensor está mal"
        porque: "El sensor no tiene la culpa: es la referencia la que no sigue a la excitación."
    escalera:
      - "Recuerde la curva plana de la referencia igual a la excitación."
    solucion: "No es ratiométrica."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [284, 288, 294, 297]
    ideas:
      - { titulo: "La excitación cuenta.", texto: "Su error entra entero si la referencia es fija." }
      - { titulo: "Ratiométrica.", texto: "Referencia igual a excitación: se cancela." }
      - { titulo: "Autocalentamiento.", texto: "Va con el cuadrado de la corriente: calcúlelo." }
      - { titulo: "No siempre.", texto: "Un termopar o un fotodiodo no se excitan." }
