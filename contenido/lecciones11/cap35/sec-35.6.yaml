# Lección 1.2 de la sección 36.6 «Luz, Gas y Humedad» (cap35, sec-35.6). Formato: GUIA.md.
# - Los tres paneles de la figura 36.11 (fig-35.11, curvas y valores de ejemplo del libro) y la garita de la foto 36.12.
# - Ejercicio 36.9 (bloque 345): para el CO₂, el NDIR.
# Sin fórmulas en la sección (aviso de secuencia «sin tarjeta de fórmula»).
# Paso práctico: «banco» opcional, el sensor de humedad sobre sal común saturada (75 %, bloque 188); la tolerancia de
# ± 3 puntos (± 4 % relativo) es de ejemplo.
leccion: cap35/sec-35.6

libro:
  162: "casi siempre hay que provocar un cambio medible"
  165: "No son lo mismo, y confundirlas produce medidas sin sentido"
  166: "Para medir lux hace falta un filtro que reproduzca la curva fotópica"
  167: "de la luz de la luna al sol directo hay seis órdenes de magnitud"
  169: "una superficie calentada cuya resistencia cambia con los gases adsorbidos"
  170: "No es selectivo"
  171: "tiene vida limitada porque el reactivo se consume, esté o no midiendo"
  172: "su virtud es que no se agota y no deriva apreciablemente"
  173: "con el riesgo de envenenamiento del catalizador"
  174: "dan un índice, no una concentración"
  178: "la humedad relativa depende de la temperatura"
  179: "mide una humedad relativa menor que la real"
  182: "dentro de una caja cerrada miden el interior de la caja"
  188: "el cloruro de sodio saturado da un 75 %"
  190: "Sensores de luz, gas y humedad con sus trampas propias"
  191: "los platos la protegen del sol y de la lluvia y dejan circular el aire"
  "cap35#345": "Para el CO₂, el NDIR"

modelo:
  valores:
    H_s: { sim: "HR", nombre: "humedad relativa de la sal saturada", unidad: "%", valor: 75 }
  calculos: {}

tarjetas:
  - id: explore-tres
    tipo: explorar
    titulo: "Se miden indirectamente"
    texto: "Gas y humedad no producen electricidad: hay que provocar un cambio medible. Toque los tres paneles."
    libro: [162, 190]
    widget:
      tipo: figura
      figura: fig-35.11
      zonas:
        - { id: luz, rotulo: "Panel de la izquierda", rect: [2, 0, 145, 225], texto: "El silicio ve el infrarrojo, que el ojo no ve: para lux, filtro fotópico." }
        - { id: gas, rotulo: "Panel del centro", rect: [153, 0, 148, 225], texto: "Cuatro familias de gas: casi todas responden a más de un gas." }
        - { id: humedad, rotulo: "Panel de la derecha", rect: [306, 0, 147, 225], texto: "Un sensor más caliente que el aire lee menos humedad relativa." }
    requiere: { mover: [luz, gas, humedad] }

  - id: pregunta-lux
    tipo: pregunta
    titulo: "Medir lux con un fotodiodo"
    texto: "Se quieren medir lux con un fotodiodo de silicio desnudo. ¿Qué falla?"
    libro: [165, 166]
    widget:
      tipo: figura
      figura: fig-35.11
      zonas:
        - { id: luz, rotulo: "Panel de la izquierda", rect: [2, 0, 145, 225] }
    opciones:
      - texto: "Responde también al infrarrojo: hace falta un filtro fotópico"
        bien: true
        porque: "El lux pondera por la respuesta del ojo; sin filtro, mide irradiancia mezclada con infrarrojo."
      - texto: "Nada: el fotodiodo mide lux directamente"
        porque: "Mide potencia de luz según su propia curva, no la del ojo."
      - texto: "No ve la luz visible"
        porque: "La ve, pero además ve el infrarrojo, donde el ojo no ve nada."
    escalera:
      - "Compare en la figura la curva del ojo con la del silicio."
    solucion: "Necesita un filtro que reproduzca la curva fotópica."

  - id: pregunta-margen
    tipo: pregunta
    titulo: "De la luna al sol"
    texto: "Un sensor de luz ambiente debe medir de la luz de la luna al sol directo. ¿Cómo lo resuelven estos sensores?"
    libro: [167]
    widget:
      tipo: figura
      figura: fig-35.11
      zonas:
        - { id: luz, rotulo: "Panel de la izquierda", rect: [2, 0, 145, 225] }
    opciones:
      - texto: "Con ganancia conmutable o salida logarítmica"
        bien: true
        porque: "Son seis órdenes de magnitud: ninguna ganancia fija los cubre."
      - texto: "Con un convertidor de más bits"
        porque: "Seis órdenes de magnitud piden cambiar la ganancia, no solo resolución."
      - texto: "Con un filtro fotópico"
        porque: "El filtro ajusta el color que ve, no el margen dinámico."
    escalera:
      - "¿Cuántas veces más luz hay a pleno sol que con luna?"
    solucion: "Ganancia conmutable o salida logarítmica."

  - id: empareje-gas
    tipo: pregunta
    titulo: "Cuatro sensores de gas"
    texto: "Empareje cada sensor de gas con su limitación."
    libro: [169, 170, 171, 172, 173]
    widget:
      tipo: figura
      figura: fig-35.11
      zonas:
        - { id: gas, rotulo: "Panel del centro", rect: [153, 0, 148, 225] }
    emparejar:
      - ["Óxido metálico (MOS)", "Consume, no es selectivo y deriva"]
      - ["Electroquímico", "Se agota, mida o no"]
      - ["NDIR", "Ni se agota ni deriva apreciablemente"]
      - ["Catalítico", "El catalizador se envenena"]
    exito: "El NDIR es el que menos sufre: mide un fenómeno óptico."
    pistas:
      - { texto: "El que lleva un reactivo es el que se agota." }
    escalera:
      - "Uno calienta, otro reacciona, otro absorbe luz, otro cataliza."
    solucion: "MOS, consume; electroquímico, se agota; NDIR, estable; catalítico, envenenamiento."

  - id: pregunta-co2
    tipo: pregunta
    titulo: "El CO₂ de una sala"
    texto: "¿Qué sensor conviene para medir el CO₂ de una sala durante años?"
    libro: [172, "cap35#345"]
    widget:
      tipo: figura
      figura: fig-35.11
      zonas:
        - { id: gas, rotulo: "Panel del centro", rect: [153, 0, 148, 225] }
    opciones:
      - texto: "Un NDIR"
        bien: true
        porque: "Mide la absorción a una longitud de onda característica: ni se agota ni deriva apreciablemente."
      - texto: "Un óxido metálico"
        porque: "Es barato, pero no es selectivo, deriva y necesita calibración periódica."
      - texto: "Un electroquímico"
        porque: "Es selectivo, pero se agota esté o no midiendo."
    escalera:
      - "Busque el que mide un fenómeno óptico."
    solucion: "El NDIR."

  - id: pregunta-indice
    tipo: pregunta
    titulo: "«Calidad del aire»"
    texto: "Un sensor se vende como de «calidad del aire». ¿Qué da?"
    libro: [174]
    widget:
      tipo: figura
      figura: fig-35.11
      zonas:
        - { id: gas, rotulo: "Panel del centro", rect: [153, 0, 148, 225] }
    opciones:
      - texto: "Un índice, no una concentración"
        bien: true
        porque: "Responde a más de un gas: una lectura sin contexto puede engañar."
      - texto: "La concentración de cada gas"
        porque: "No es selectivo: da una mezcla difícil de interpretar."
      - texto: "La concentración de CO₂"
        porque: "Para eso hace falta un NDIR; estos dan un índice."
    escalera:
      - "¿Distingue un sensor no selectivo un gas de otro?"
    solucion: "Un índice."

  - id: predecir-humedad
    tipo: predecir
    titulo: "Un sensor más caliente que el aire"
    texto: "La electrónica vecina calienta el sensor de humedad unos grados por encima del aire. ¿Qué lee?"
    libro: [178, 179]
    widget:
      tipo: figura
      figura: fig-35.11
      zonas:
        - { id: humedad, rotulo: "Panel de la derecha", rect: [306, 0, 147, 225] }
    opciones:
      - texto: "Una humedad relativa menor que la real"
        bien: true
        porque: "El mismo aire, más caliente, tiene menos humedad relativa sin haber perdido agua."
      - texto: "Mayor que la real"
        porque: "Calentar el aire baja su humedad relativa, no la sube."
      - texto: "La misma: el agua no ha cambiado"
        porque: "El agua es la misma, pero la humedad relativa depende de la temperatura."
    escalera:
      - "La humedad relativa depende de la temperatura."
    solucion: "Menor que la real: un error de montaje muy común."

  - id: porque-temperatura
    tipo: porque
    titulo: "Siempre con un termómetro"
    texto: "¿Por qué todos los sensores de humedad incorporan medida de temperatura?"
    libro: [178, 179]
    widget:
      tipo: figura
      figura: fig-35.11
      zonas:
        - { id: humedad, rotulo: "Panel de la derecha", rect: [306, 0, 147, 225] }
    opciones:
      - texto: "Porque la humedad relativa depende de la temperatura"
        bien: true
        porque: "Sin saber a qué temperatura está el sensor, la humedad relativa no se interpreta."
      - texto: "Para ahorrar un sensor aparte"
        porque: "Es una necesidad de la medida, no un ahorro."
      - texto: "Para proteger el sensor del frío"
        porque: "La temperatura se mide porque cambia la humedad relativa del mismo aire."
    escalera:
      - "¿Qué le pasa a la humedad relativa del mismo aire al calentarlo?"
    solucion: "La humedad relativa depende de la temperatura."

  - id: toque-garita
    tipo: tocar
    titulo: "La garita de platos"
    texto: "Toque lo que protege la sonda del sol y de la lluvia sin encerrarla."
    libro: [182, 191]
    widget:
      tipo: figura
      figura: fig-35.12
      zonas:
        - { id: platos, rotulo: "Lo blanco del centro", rect: [240, 240, 760, 760] }
        - { id: sonda, rotulo: "El cilindro negro de abajo", rect: [480, 1080, 240, 420] }
        - { id: soporte, rotulo: "La barra de abajo a la izquierda", rect: [0, 1360, 600, 240] }
    tocar:
      bien: [platos]
      porque:
        sonda: "Es el cuerpo de la sonda con su cable: lo que hay que proteger."
        soporte: "Es el soporte: sujeta la garita, no la protege."
    exito: "Los platos dejan circular el aire: la sonda ve el medio, no el interior de una caja."
    escalera:
      - "Busque lo que deja pasar el aire entre capas."
    solucion: "Los platos blancos."

  - id: banco-sal
    tipo: banco
    titulo: "Sal común saturada"
    texto: "Cierre su sensor de humedad en un tarro con sal común saturada de agua y espere a que la lectura se estabilice."
    nota: "La tolerancia de ± 3 puntos es de ejemplo."
    libro: [188]
    banco:
      piezas: ["Sensor de humedad", "Tarro hermético", "Sal común humedecida, como una pasta"]
      medir: "La humedad relativa dentro del tarro, ya estable."
      esperado: H_s
      unidad: "%"
      tol: 0.04
      consejos:
        - { cuando: { valor: desviacion, mayor: 0.04 }, texto: "Lee de más: espere más tiempo, y que no haya agua líquida tocando el sensor." }
        - { cuando: { valor: desviacion, menor: -0.04 }, texto: "Lee de menos: ¿está el sensor más caliente que el tarro? Apártelo de la electrónica." }
        - { texto: "Dentro: es la forma clásica de calibrar la humedad." }
    comprobar:
      - { H_s: 75 }

  - id: pregunta-caja
    tipo: pregunta
    titulo: "Dentro de la caja"
    texto: "Un sensor de humedad funciona bien en la mesa y, cerrado en su caja, lee algo distinto del aire de la sala. ¿Por qué?"
    libro: [182]
    widget:
      tipo: figura
      figura: fig-35.12
      zonas:
        - { id: platos, rotulo: "Lo blanco del centro", rect: [240, 240, 760, 760] }
    opciones:
      - texto: "Mide el interior de la caja, no el aire de la sala"
        bien: true
        porque: "Estos sensores necesitan ver el medio."
      - texto: "Porque la caja lo ha estropeado"
        porque: "Funciona; lo que mide es otro aire."
      - texto: "Porque necesita calibración"
        porque: "Aunque estuviera calibrado, mediría el aire de dentro."
    escalera:
      - "Un sensor mide donde está."
    solucion: "Necesitan ver el medio: dentro de la caja miden la caja."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [166, 172, 179, 182]
    ideas:
      - { titulo: "Luz.", texto: "Lux pide filtro fotópico; el margen dinámico, ganancia conmutable." }
      - { titulo: "Gas.", texto: "Casi todos responden a más de un gas; el NDIR ni se agota ni deriva." }
      - { titulo: "Humedad.", texto: "Depende de la temperatura: un sensor caliente lee menos." }
      - { titulo: "Los tres.", texto: "Lentos, derivan y necesitan ver el medio." }
