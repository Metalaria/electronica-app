# Lección 1.2 de la sección 36.6 «Luz, Gas y Humedad» (cap35, sec-35.6). Formato: GUIA.md.
# - Los tres paneles de la figura 36.11 (fig-35.11, curvas y valores de ejemplo del libro) y la garita de la foto 36.12.
# - Ejercicio 36.9 (bloque 345): para el CO₂, el NDIR.
# Sin fórmulas en la sección (aviso de secuencia «sin tarjeta de fórmula»).
# Paso práctico: «banco» opcional, el sensor de humedad sobre sal común saturada (75 %, bloque 188); la tolerancia de
# ± 3 puntos (± 4 % relativo) es de ejemplo.
# 1.2.1 (autor121-sens, «aprender haciendo», GUIA §13): en la figura 36.11 se toca la banda que el silicio ve y el
# ojo no, y la fila del sensor para el CO₂; el panel de la humedad se rehace en vivo con el modelo de la propia figura
# (aire a 25 °C y 50 %, fórmula de Magnus): se explora el calentamiento y se escribe lo que lee con 3 °C de más (42 %).
# La caja y el termómetro incorporado pasan a los éxitos. Quedan dos de opciones.
leccion: cap35/sec-35.6

libro:
  162: "casi siempre hay que provocar un cambio medible"
  165: "No son lo mismo, y confundirlas produce medidas sin sentido"
  166: "Para medir lux hace falta un filtro que reproduzca la curva fotópica"
  167: "de la luz de la luna al sol directo hay seis órdenes de magnitud"
  169: "una superficie calentada cuya resistencia cambia con los gases adsorbidos"
  170: "No es selectivo"
  171: "tiene vida limitada porque el reactivo se consume, esté o no midiendo"
  172: "su virtud es que no se agota y no deriva apreciablemente"
  173: "con el riesgo de envenenamiento del catalizador"
  174: "dan un índice, no una concentración"
  178: "la humedad relativa depende de la temperatura"
  179: "mide una humedad relativa menor que la real"
  182: "dentro de una caja cerrada miden el interior de la caja"
  188: "el cloruro de sodio saturado da un 75 %"
  190: "Sensores de luz, gas y humedad con sus trampas propias"
  191: "los platos la protegen del sol y de la lluvia y dejan circular el aire"
  "cap35#345": "Para el CO₂, el NDIR"

modelo:
  valores:
    H_s: { sim: "HR", nombre: "humedad relativa de la sal saturada", unidad: "%", valor: 75 }
    T_a: { sim: "T", nombre: "temperatura del aire (figura 36.11)", unidad: "°C", valor: 25 }
    H_a: { sim: "HR", nombre: "humedad relativa real (figura 36.11)", unidad: "%", valor: 50 }
    d_T: { sim: "ΔT", nombre: "calentamiento del sensor", unidad: "°C", valor: 0 }
  calculos:
    h_r: { expr: "H_a*exp(17.62*T_a/(243.12 + T_a))/exp(17.62*(T_a + d_T)/(243.12 + T_a + d_T))", sim: "HR_{medida}", nombre: "humedad que lee el sensor", unidad: "%", cifras: 2 }

tarjetas:
  - id: explore-tres
    tipo: explorar
    titulo: "Un sensor más caliente que el aire"
    texto: "Aire a 25 °C y 50 % de humedad, y la electrónica vecina calienta el sensor. Caliéntelo hasta que lea por debajo del 40 %."
    libro: [162, 178, 179, 190]
    widget:
      tipo: grafica
      x: { id: u, min: 0, max: 10, unidad: "°C", rotulo: "calentamiento del sensor" }
      y: { min: 20, max: 56, unidad: "%", rotulo: "HR medida" }
      curvas:
        - { expr: "H_a*exp(17.62*T_a/(243.12 + T_a))/exp(17.62*(T_a + u)/(243.12 + T_a + u))", color: azul, rotulo: "lo que lee" }
        - { expr: "H_a", color: verde, rotulo: "real", discontinua: true }
      marcas:
        - { x: "d_T", y: "h_r", rotulo: "{{h_r}}" }
      lectura: { valor: h_r, rotulo: "Humedad que lee" }
      mandos:
        - { valor: d_T, min: 0, max: 10, paso: 0.5, rotulo: "Calentamiento del sensor" }
    objetivo:
      condiciones:
        - { valor: h_r, max: 40, rotulo: "Lee {{h_r}}" }
      logrado: "Con {{d_T}} de más lee {{h_r}}, con la misma agua en el aire: un sensor más caliente que el aire lee menos humedad relativa."
      pistas:
        - { texto: "Siga calentando: unos grados bastan." }
    escalera:
      - "Pruebe con 4 °C."
    solucion: "Con unos 4 °C de más."
    comprobar:
      - { con: { d_T: 4 }, h_r: 39.5, tol: 0.01 }

  - id: pregunta-lux
    tipo: tocar
    titulo: "Medir lux con un fotodiodo"
    texto: "Se quieren medir lux con un fotodiodo de silicio desnudo. Toque la parte del espectro que lo estropea."
    libro: [165, 166]
    widget:
      tipo: figura
      figura: fig-35.11
      zonas:
        - { id: visible, rotulo: "Lo visible, a la izquierda", rect: [27, 34, 47, 99] }
        - { id: infrarrojo, rotulo: "La banda sombreada", rect: [74, 34, 65, 99] }
    tocar:
      bien: [infrarrojo]
      porque:
        visible: "Ahí el silicio y el ojo ven los dos; el problema está donde el ojo ya no ve."
    exito: "El infrarrojo: el silicio lo ve y el ojo no. Irradiancia no es iluminancia; para lux hace falta un filtro fotópico."
    escalera:
      - "Compare la curva del ojo con la del silicio."
    solucion: "La banda sombreada, el infrarrojo."

  - id: pregunta-margen
    tipo: pregunta
    titulo: "De la luna al sol"
    texto: "Un sensor de luz ambiente debe medir de la luz de la luna al sol directo. ¿Cómo lo resuelven estos sensores?"
    libro: [167]
    widget:
      tipo: figura
      figura: fig-35.11
      zonas:
        - { id: luz, rotulo: "Panel de la izquierda", rect: [2, 0, 145, 225] }
    opciones:
      - texto: "Con ganancia conmutable o salida logarítmica"
        bien: true
        porque: "Son seis órdenes de magnitud: ninguna ganancia fija los cubre."
      - texto: "Con un convertidor de más bits"
        porque: "Seis órdenes de magnitud piden cambiar la ganancia, no solo resolución."
      - texto: "Con un filtro fotópico"
        porque: "El filtro ajusta el color que ve, no el margen dinámico."
    escalera:
      - "¿Cuántas veces más luz hay a pleno sol que con luna?"
    solucion: "Ganancia conmutable o salida logarítmica."

  - id: pregunta-co2
    tipo: tocar
    titulo: "El CO₂ de una sala"
    texto: "Hay que medir el CO₂ de una sala durante años. Toque el sensor de gas que conviene."
    libro: [169, 170, 171, 172, 173, "cap35#345"]
    widget:
      tipo: figura
      figura: fig-35.11
      zonas:
        - { id: mos, rotulo: "Primera fila", rect: [157, 24, 139, 35] }
        - { id: electroquimico, rotulo: "Segunda fila", rect: [157, 59, 139, 35] }
        - { id: ndir, rotulo: "Tercera fila", rect: [157, 94, 139, 35] }
        - { id: catalitico, rotulo: "Cuarta fila", rect: [157, 129, 139, 35] }
    tocar:
      bien: [ndir]
      porque:
        mos: "El óxido metálico es barato, pero consume, no es selectivo y deriva."
        electroquimico: "El electroquímico es selectivo, pero se agota, mida o no."
        catalitico: "El catalizador se envenena."
    exito: "El NDIR mide la absorción a una longitud de onda característica: ni se agota ni deriva apreciablemente."
    escalera:
      - "Busque el que mide un fenómeno óptico."
    solucion: "La tercera fila, el NDIR."

  - id: pregunta-indice
    tipo: pregunta
    titulo: "«Calidad del aire»"
    texto: "Un sensor se vende como de «calidad del aire». ¿Qué da?"
    libro: [174]
    widget:
      tipo: figura
      figura: fig-35.11
      zonas:
        - { id: gas, rotulo: "Panel del centro", rect: [153, 0, 148, 225] }
    opciones:
      - texto: "Un índice, no una concentración"
        bien: true
        porque: "Responde a más de un gas: una lectura sin contexto puede engañar."
      - texto: "La concentración de cada gas"
        porque: "No es selectivo: da una mezcla difícil de interpretar."
      - texto: "La concentración de CO₂"
        porque: "Para eso hace falta un NDIR; estos dan un índice."
    escalera:
      - "¿Distingue un sensor no selectivo un gas de otro?"
    solucion: "Un índice."

  - id: predecir-humedad
    tipo: leer
    titulo: "Tres grados de más"
    texto: "El mismo aire, a 25 °C y 50 %, y el sensor 3 °C más caliente. Escriba la humedad relativa que lee."
    libro: [178, 179]
    fijar: { d_T: 3 }
    widget:
      tipo: grafica
      x: { id: u, min: 0, max: 10, unidad: "°C", rotulo: "calentamiento del sensor" }
      y: { min: 20, max: 56, unidad: "%", rotulo: "HR medida" }
      curvas:
        - { expr: "H_a*exp(17.62*T_a/(243.12 + T_a))/exp(17.62*(T_a + u)/(243.12 + T_a + u))", color: azul, rotulo: "lo que lee" }
        - { expr: "H_a", color: verde, rotulo: "real", discontinua: true }
    leer:
      objetivo: h_r
      unidad: "%"
      tol: 0.03
      rotulo: "Humedad que lee"
      errores:
        - { expr: "H_a", texto: "El agua es la misma, pero la humedad relativa depende de la temperatura." }
        - { expr: "2*H_a - h_r", texto: "Calentar el aire baja su humedad relativa, no la sube." }
    exito: "Un 42 %, ocho puntos menos: por eso todos los sensores de humedad miden también la temperatura. Es un error de montaje muy común."
    escalera:
      - "Busque en la curva el calentamiento de 3 °C."
    solucion: "Unos 42 %."
    comprobar:
      - { h_r: 42, tol: 0.01 }

  - id: toque-garita
    tipo: tocar
    titulo: "La garita de platos"
    texto: "Toque lo que protege la sonda del sol y de la lluvia sin encerrarla."
    libro: [182, 191]
    widget:
      tipo: figura
      figura: fig-35.12
      zonas:
        - { id: platos, rotulo: "Lo blanco del centro", rect: [240, 240, 760, 760] }
        - { id: sonda, rotulo: "El cilindro negro de abajo", rect: [480, 1080, 240, 420] }
        - { id: soporte, rotulo: "La barra de abajo a la izquierda", rect: [0, 1360, 600, 240] }
    tocar:
      bien: [platos]
      porque:
        sonda: "Es el cuerpo de la sonda con su cable: lo que hay que proteger."
        soporte: "Es el soporte: sujeta la garita, no la protege."
    exito: "Los platos dejan circular el aire: la sonda ve el medio. Cerrada en una caja, mediría el aire de la caja."
    escalera:
      - "Busque lo que deja pasar el aire entre capas."
    solucion: "Los platos blancos."

  - id: banco-sal
    tipo: banco
    titulo: "Sal común saturada"
    texto: "Cierre su sensor de humedad en un tarro con sal común saturada de agua y espere a que la lectura se estabilice."
    nota: "La tolerancia de ± 3 puntos es de ejemplo."
    libro: [188]
    banco:
      piezas: ["Sensor de humedad", "Tarro hermético", "Sal común humedecida, como una pasta"]
      medir: "La humedad relativa dentro del tarro, ya estable."
      esperado: H_s
      unidad: "%"
      tol: 0.04
      consejos:
        - { cuando: { valor: desviacion, mayor: 0.04 }, texto: "Lee de más: espere más tiempo, y que no haya agua líquida tocando el sensor." }
        - { cuando: { valor: desviacion, menor: -0.04 }, texto: "Lee de menos: ¿está el sensor más caliente que el tarro? Apártelo de la electrónica." }
        - { texto: "Dentro: es la forma clásica de calibrar la humedad." }
    comprobar:
      - { H_s: 75 }

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [166, 172, 179, 182]
    ideas:
      - { titulo: "Luz.", texto: "Lux pide filtro fotópico; el margen dinámico, ganancia conmutable." }
      - { titulo: "Gas.", texto: "Casi todos responden a más de un gas; el NDIR ni se agota ni deriva." }
      - { titulo: "Humedad.", texto: "Depende de la temperatura: un sensor caliente lee menos." }
      - { titulo: "Los tres.", texto: "Lentos, derivan y necesitan ver el medio." }
