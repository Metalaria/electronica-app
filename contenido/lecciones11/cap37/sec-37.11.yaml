# Lección 1.2 de la sección 38.11 «Caso de Estudio: Recrear una Consola de 8 Bits en Lógica» (cap37; etiqueta
# interna sec-37.11). Formato: contenido/lecciones11/GUIA.md (§11). La placa de la NES (foto de la figura 38.16,
# 1600 × 1166 px; zonas ampliadas alrededor de las cajas X1, U6, U5 y P1 del explorador «Consolas», para que se puedan
# tocar en un teléfono). Un solo dominio con habilitaciones (bloque
# 336) se ve con el reloj de la PPU y un contador de módulo 3 que habilita la CPU un ciclo de cada tres. El espejado
# (bloques 358–359) se ve con la selección de la RAM: en $0000–$1FFF las líneas A15, A14 y A13 valen 0, y A12 y A11
# no se decodifican. Figuras 38.13 (450,72 × 263,52) y 38.15 (453,6 × 205,2).
# 1.2.1 («aprender haciendo», GUIA §13): el reloj de la CPU y los ciclos de CPU por cuadro se escriben; la habilitación
# de la CPU se consigue con pulsos y los espejos encendiendo A12 y A11 (objetivos sobre los LED); el cartucho y el
# impacto del objeto cero se tocan en las figuras. Quedan dos preguntas de opciones: la relación PPU/CPU y el ciclo de
# desfase. Los dos relojes derivados, los errores característicos y la latencia van en los textos.
leccion: cap37/sec-37.11

libro:
  327: "una recreación que no sea precisa al ciclo falla de formas visibles"
  330: "Todo el sistema cuelga de un único cristal de 21,477272 MHz"
  331: '"CPU" = ("21,477272 MHz")/("12") = "1,789773 MHz"'
  332: "PPU = 21,477272 MHz / 4 = 5,369318 MHz"
  334: '("PPU")/("CPU") = "3" space "exactamente"'
  335: "Tres ciclos de PPU por cada ciclo de CPU."
  336: "señales de habilitación que activan cada bloque en su ciclo"
  338: "Un cuadro de vídeo tiene 341 puntos por línea y 262 líneas"
  342: '("89 342")/("3") = "29 780,67"'
  343: "Cualquier implementación que redondee acumula deriva."
  357: "El espacio de direcciones de la CPU es de 16 bits"
  358: "Espejo de la anterior, tres veces"
  359: "la decodificación de direcciones es incompleta, se ignoran las líneas altas"
  360: "49 120 de las 65 536 direcciones"
  383: "El mapa de la CPU solo deja 32 kB para el programa"
  384: "un circuito que conmuta bancos de memoria bajo el control del programa"
  375: "su verdadero uso es otro: saber en qué punto exacto del barrido está la pantalla"
  376: "Es un temporizador construido con el propio haz."
  377: "la línea de corte se desplaza y el marcador tiembla"
  419: "La pantalla tiembla en la línea de corte"
  420: "Columnas de gráficos desplazadas ocho píxeles"
  423: "El sonido suena metálico"
  429: "Arquitectura del sistema, con el reloj maestro y la relación entera entre dominios."
  431: "El impacto del objeto cero usado como temporizador para partir la pantalla."
  432: "Placa base de la NES original"

modelo:
  valores:
    f_x: { sim: "f_{cristal}", nombre: "cristal maestro", unidad: Hz, valor: 21477272 }
    p_l: { nombre: "puntos por línea", valor: 341 }
    l_c: { nombre: "líneas por cuadro", valor: 262 }
  calculos:
    f_cpu: { expr: "f_x/12", sim: "f_{CPU}", nombre: "reloj de la CPU", unidad: Hz, cifras: 7 }
    f_ppu: { expr: "f_x/4", sim: "f_{PPU}", nombre: "reloj de la PPU", unidad: Hz, cifras: 7 }
    relacion: { expr: "f_ppu/f_cpu", nombre: "ciclos de PPU por ciclo de CPU", cifras: 3 }
    c_ppu: { expr: "p_l*l_c", nombre: "ciclos de PPU por cuadro", cifras: 5 }
    c_cpu: { expr: "c_ppu/relacion", nombre: "ciclos de CPU por cuadro", cifras: 7 }

tarjetas:
  - id: toque-cristal
    tipo: tocar
    titulo: "Un único cristal"
    texto: "En la placa de la NES, todo el sistema cuelga de un único cristal. Tóquelo."
    libro: [330, 432]
    widget:
      tipo: figura
      figura: fig-37.16
      zonas:
        - { id: cristal, rect: [400, 100, 140, 130], rotulo: "Pieza pequeña, arriba" }
        - { id: cpu, rect: [100, 420, 390, 150], rotulo: "Chip largo, a la izquierda" }
        - { id: ppu, rect: [640, 340, 390, 140], rotulo: "Chip largo, en el centro" }
        - { id: cartucho, rect: [85, 775, 1010, 175], rotulo: "Conector ancho, abajo" }
    tocar:
      bien: [cristal]
      porque:
        cpu: "Es la CPU RP2A03G: recibe un reloj, no lo genera."
        ppu: "Es la PPU RP2C02G-0: su reloj sale del mismo cristal."
        cartucho: "Es el conector de cartuchos de 72 contactos."
    exito: "El cristal maestro de 21,477272 MHz: de él salen la CPU y la PPU por división entera."
    escalera: ["Busque un componente metálico pequeño cerca de la CPU."]
    solucion: "Arriba: el cristal maestro X1, de 21,477272 MHz."

  - id: prediga-relacion
    tipo: predecir
    titulo: "PPU y CPU"
    texto: "La CPU recibe el cristal dividido entre 12 y la PPU, entre 4. ¿Qué relación hay entre sus ciclos?"
    libro: [331, 332, 335]
    widget:
      tipo: figura
      figura: fig-37.16
      zonas:
        - { id: cristal, rect: [400, 100, 140, 130], rotulo: "Pieza pequeña, arriba", texto: "Cristal maestro de 21,477272 MHz." }
    opciones:
      - { texto: "Tres ciclos de PPU por ciclo de CPU, exactamente", bien: true, porque: "Es una división del mismo reloj: fase fija, sin deriva, y el software lo aprovecha." }
      - { texto: "Una relación no entera que deriva", porque: "Derivaría con dos cristales. Aquí los dos salen del mismo por división entera." }
      - { texto: "Cuatro por cada uno", porque: "El 4 es el divisor de la PPU; la relación es 12 / 4." }
    escalera: ["Divida un divisor entre el otro."]
    solucion: "12 / 4 = 3 exactamente: tres ciclos de PPU por cada ciclo de CPU."

  - id: formula-relacion
    tipo: leer
    titulo: "El reloj de la CPU"
    texto: "La CPU recibe el cristal maestro dividido entre 12. Calcule su reloj y escríbalo."
    libro: [330, 331, 332, 429]
    widget:
      tipo: figura
      figura: fig-37.16
      zonas:
        - { id: cristal, rect: [400, 100, 140, 130], rotulo: "Pieza pequeña, arriba" }
    leer:
      objetivo: f_cpu
      unidad: Hz
      tol: 0.001
      rotulo: "Reloj de la CPU"
      errores:
        - { expr: "f_ppu", texto: "Ese es el de la PPU: el cristal entre 4." }
    exito: "{{f_cpu}}; la PPU, {{f_ppu}}. Su cociente es {{relacion}} exactamente."
    escalera: ["21,477272 MHz / 12."]
    solucion: "21,477272 MHz / 12 = {{f_cpu}}."
    comprobar:
      - { f_cpu: 1789773, f_ppu: 5369318, relacion: 3 }

  - id: explore-un-dominio
    tipo: explorar
    titulo: "Un solo dominio"
    texto: "En la FPGA, un solo reloj, el de la PPU, y un contador que habilita la CPU un ciclo de cada tres. Dé pulsos hasta habilitar la CPU."
    libro: [335, 336]
    widget:
      tipo: logica
      entradas: [{ id: CLK, reloj: true, rotulo: "Reloj de PPU" }]
      piezas:
        - { id: cnt, tipo: contador, bits: 2, modulo: 3, entradas: [CLK], rotulo: "Cuenta de PPU" }
      salidas:
        - { id: ENCPU, de: cnt.q1, rotulo: "Habilita CPU" }
    objetivo:
      condiciones:
        - { led: ENCPU, valor: 1, rotulo: "CPU habilitada" }
      logrado: "Un ciclo de cada tres, en el mismo dominio. Dos relojes derivados crearían cruces de dominio que el original no tiene."
      pistas:
        - { texto: "Siga: la habilitación llega una vez por vuelta del contador." }
    escalera: ["El contador cuenta tres estados y habilita en uno."]
    solucion: "Dos pulsos del reloj de PPU."

  - id: prediga-redondeo
    tipo: leer
    titulo: "Ciclos de CPU por cuadro"
    texto: "Un cuadro tiene 341 puntos por línea y 262 líneas, y hay tres ciclos de PPU por cada uno de CPU. Calcule los ciclos de CPU por cuadro."
    libro: [327, 338, 342, 343]
    widget:
      tipo: figura
      figura: fig-37.13
      zonas:
        - { id: cuenta, rotulo: "Recuadro verde de abajo", rect: [4, 167, 443, 92] }
    leer:
      objetivo: c_cpu
      unidad: ""
      tol: 0.000005
      rotulo: "Ciclos de CPU por cuadro"
      errores:
        - { expr: "c_ppu", texto: "Esos son ciclos de PPU: divida entre tres." }
        - { expr: "round(c_cpu)", texto: "No se redondea: la CPU no ejecuta un número entero de ciclos por cuadro." }
    exito: "{{c_cpu}}: fraccionario, y el software contaba con ello. Cualquier implementación que redondee acumula deriva."
    escalera: ["341 × 262 ciclos de PPU, entre tres."]
    solucion: "341 × 262 / 3 = {{c_cpu}}."
    comprobar:
      - { c_ppu: 89342, c_cpu: 29780.67 }

  - id: explore-espejos
    tipo: explorar
    titulo: "Los espejos"
    texto: "La RAM se elige con A15, A14 y A13 apagadas. Consiga elegirla con A12 y A11 encendidas."
    libro: [358, 359]
    widget:
      tipo: logica
      entradas: [A15, A14, A13, A12, A11]
      piezas:
        - { id: sel, tipo: nor, entradas: [A15, A14, A13], rotulo: "Decodificador" }
      salidas:
        - { id: RAM, de: sel }
    objetivo:
      condiciones:
        - { senal: A12, valor: 1, rotulo: "A12 encendida" }
        - { senal: A11, valor: 1, rotulo: "A11 encendida" }
        - { led: RAM, valor: 1, rotulo: "RAM elegida" }
      logrado: "El decodificador no mira A12 ni A11: la misma RAM responde en varias direcciones. Son los espejos, y el software los usa."
      pistas:
        - { texto: "A15, A14 y A13 tienen que seguir apagadas." }
    escalera: ["Decodificación incompleta: se ignoran líneas."]
    solucion: "A12 y A11 encendidas; A15, A14 y A13 apagadas."

  - id: pregunta-mapeador
    tipo: tocar
    titulo: "Lógica en el cartucho"
    texto: "El mapa de la CPU solo deja 32 kB para el programa, y los juegos llegaron a ser mucho mayores. Toque dónde se puso la lógica que lo resuelve."
    libro: [357, 360, 383, 384, 429]
    widget:
      tipo: figura
      figura: fig-37.13
      zonas:
        - { id: cristal, rotulo: "Recuadro naranja de la izquierda", rect: [4, 66, 76, 44] }
        - { id: cpu, rotulo: "Recuadro de arriba en el centro", rect: [143, 7, 107, 60] }
        - { id: ppu, rotulo: "Recuadro de abajo en el centro", rect: [143, 93, 107, 61] }
        - { id: ram, rotulo: "Recuadro gris de arriba", rect: [270, 5, 68, 36] }
        - { id: cartucho, rotulo: "Recuadro rojo de la derecha", rect: [360, 7, 87, 147] }
    tocar:
      bien: [cartucho]
      porque:
        cristal: "El cristal da los relojes, no amplía la memoria."
        cpu: "La CPU sigue siendo la de la consola, con su mapa de 16 bits."
        ppu: "La PPU dibuja; sus patrones también vienen del cartucho."
        ram: "Son los 2 kB internos, con sus espejos."
    exito: "Un mapeador conmuta bancos bajo el control del programa: cada cartucho añade hardware, y un core completo incluye una colección de ellos."
    escalera: ["¿Qué parte ocupa casi tres cuartas partes del espacio de la CPU?"]
    solucion: "El cartucho, con su mapeador."

  - id: ordene-objeto-cero
    tipo: tocar
    titulo: "Un temporizador con el haz"
    texto: "El programa espera a que se active el bit de impacto del objeto cero para cambiar el desplazamiento. Toque dónde se ve ese impacto."
    libro: [375, 376, 431]
    widget:
      tipo: figura
      figura: fig-37.15
      zonas:
        - { id: marcador, rotulo: "Franja de arriba", rect: [19, 10, 186, 36] }
        - { id: fondo, rotulo: "Centro de la pantalla", rect: [19, 60, 95, 70] }
        - { id: ampliado, rotulo: "Recuadro de abajo a la derecha", rect: [118, 128, 82, 56] }
        - { id: pasos, rotulo: "Pasos de la derecha", rect: [215, 5, 235, 105] }
    tocar:
      bien: [ampliado]
      porque:
        marcador: "Es el marcador fijo: el impacto marca su borde, pero se ve en el detalle."
        fondo: "Es el fondo que se desplaza tras el corte."
        pasos: "Son los pasos del programa; el impacto es un píxel concreto."
    exito: "El primer píxel opaco común al objeto cero y al fondo: un temporizador construido con el propio haz, no una detección de colisiones."
    escalera: ["Busque el detalle ampliado de los píxeles."]
    solucion: "El recuadro ampliado."

  - id: pregunta-tiembla
    tipo: pregunta
    titulo: "Un ciclo de desfase"
    texto: "En una recreación, el bit del objeto cero se activa un ciclo tarde. ¿Qué se ve?"
    libro: [377, 419, 420, 423, 431]
    widget:
      tipo: figura
      figura: fig-37.15
      zonas:
        - { id: marcador, rotulo: "Franja de arriba", rect: [19, 8, 186, 36], texto: "El marcador fijo, sobre la línea de corte." }
    opciones:
      - { texto: "La línea de corte se desplaza y el marcador tiembla", bien: true, porque: "Es el fallo que delata una implementación imprecisa, como las columnas desplazadas o el sonido metálico." }
      - { texto: "Nada: un ciclo no se nota", porque: "Es una consola exigente al ciclo: un ciclo mueve la línea de corte." }
      - { texto: "El juego no arranca", porque: "Eso es un mapeador que falta; aquí arranca y tiembla." }
    escalera: ["¿Qué marca el bit de impacto en la pantalla?"]
    solucion: "La línea de corte se desplaza y el marcador tiembla."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [334, 336, 343, 359]
    ideas:
      - { titulo: "Un cristal.", texto: "CPU y PPU salen por división entera: tres ciclos de PPU por cada uno de CPU." }
      - { titulo: "Un dominio.", texto: "En la FPGA, un reloj y habilitaciones, no relojes derivados." }
      - { titulo: "Precisión al ciclo.", texto: "Redondear deriva; un ciclo de desfase hace temblar la pantalla." }
      - { titulo: "Espejos y mapeadores.", texto: "Decodificación incompleta y lógica dentro del cartucho." }
