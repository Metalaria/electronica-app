# Lección 1.2 de la sección 38.1 «Hardware Configurable: Otra Forma de Pensar» (cap37; etiqueta interna sec-37.1).
# Formato: contenido/lecciones11/GUIA.md (§11). Figura 38.2 (svg_vista 453,6 × 246,96) para el cambio de paradigma,
# figura 38.1 (450,72 × 241,86) para el interior y la foto de la MAX1000 (figura 38.3, 1200 × 512 px). El experimento
# del banco (bloque 35, dos divisores independientes) se ve como dos divisores del mismo reloj en zonas distintas:
# un biestable D con Q̄ en su D y un contador de dos bits.
# 1.2.1 («aprender haciendo», GUIA §13): el lado donde añadir una tarea no retrasa a las demás, la idea del bucle, la del
# HDL «como un programa» y el chip que programa la placa se tocan; los dos divisores se llevan con pulsos hasta tener las
# dos salidas encendidas (objetivo sobre los LED). Quedan dos preguntas de opciones: el segundo divisor y para qué no
# sirve; la solución mixta y la placa sin configurar van en sus textos, y el coste en el resumen. Sección de criterio.
leccion: cap37/sec-37.1

libro:
  4: "una FPGA no ejecuta nada: se convierte en el circuito que se ha descrito"
  5: "dos tareas ocupan zonas distintas del silicio y funcionan a la vez, sin interferirse"
  9: "Bloques lógicos: cada uno con una tabla de consulta (LUT)"
  10: "Interconexión programable, que es la que ocupa la mayor parte del área"
  12: "Una FPGA sin configurar no hace nada"
  15: "Escribir HDL «como si fuera un programa» es el error de partida de casi todo el mundo"
  16: "Un bucle no itera en el tiempo: se despliega en el espacio"
  17: "Diez multiplicaciones simultáneas necesitan diez multiplicadores, y se hacen en un ciclo"
  20: "Paralelismo masivo"
  21: "Temporización estricta, de nanosegundos"
  22: "Interfaces raros o muy rápidos"
  25: "una FPGA es mala ejecutando algoritmos secuenciales"
  26: "la solución habitual sea mixta"
  29: "Consumo apreciable, incluso sin hacer nada"
  31: "minutos u horas donde un compilador de C tarda segundos"
  32: "hay que instrumentar el diseño para ver lo que ocurre dentro"
  35: "instanciar dos divisores independientes con frecuencias distintas"
  36: "Ejecución secuencial frente a lógica concurrente"
  37: "Placa de desarrollo con FPGA (MAX1000)"

modelo:
  valores: {}
  calculos: {}

tarjetas:
  - id: explore-ejecutar-o-ser
    tipo: tocar
    titulo: "Ejecutar o ser el circuito"
    texto: "En uno de los dos lados, añadir una tarea no retrasa a las demás. Tóquelo."
    libro: [4, 5, 36]
    widget:
      tipo: figura
      figura: fig-37.2
      zonas:
        - { id: cpu, rotulo: "Arriba a la izquierda", rect: [4, 2, 220, 124] }
        - { id: fpga, rotulo: "Arriba a la derecha", rect: [229, 2, 220, 124] }
    tocar:
      bien: [fpga]
      porque:
        cpu: "El procesador ejecuta por turnos: las tareas compiten por el tiempo y una más retrasa a las demás."
    exito: "La FPGA no ejecuta nada: se convierte en el circuito. Cada tarea ocupa su zona del silicio, todas a la vez."
    escalera: ["¿Dónde no hay turnos?"]
    solucion: "Arriba a la derecha: la FPGA."

  - id: explore-dos-divisores
    tipo: explorar
    titulo: "Dos divisores a la vez"
    texto: "Dos divisores del mismo reloj, cada uno en su zona, cambian a su ritmo. Dé pulsos hasta encender Q1 y Q2 a la vez."
    libro: [5, 35]
    widget:
      tipo: logica
      entradas: [{ id: CLK, reloj: true }]
      piezas:
        - { id: f1, tipo: d, entradas: [f1.nq, CLK] }
        - { id: c1, tipo: contador, bits: 2, entradas: [CLK] }
      salidas:
        - { id: Q1, de: f1.q }
        - { id: Q2, de: c1.q1 }
    objetivo:
      condiciones:
        - { led: Q1, valor: 1, rotulo: "Q1 encendida" }
        - { led: Q2, valor: 1, rotulo: "Q2 encendida" }
      logrado: "Q1 cambia en cada flanco y Q2 cada dos, sin esperarse: añadir un divisor no afecta al otro."
      pistas:
        - { texto: "Siga dando pulsos: cada uno va a su ritmo." }
    escalera: ["Q1 cambia en cada pulso; Q2, cada dos."]
    solucion: "Tres pulsos de reloj."

  - id: prediga-segunda-tarea
    tipo: predecir
    titulo: "Añadir un segundo divisor"
    texto: "A un divisor que ya funciona en una FPGA se le añade otro, independiente y de otra frecuencia. ¿Qué le pasa al primero?"
    libro: [5, 9, 10, 35]
    widget:
      tipo: figura
      figura: fig-37.1
      zonas:
        - { id: celdas, rotulo: "Recuadro de arriba a la izquierda", rect: [5, 10, 218, 160], texto: "Celdas LUT + FF: cada divisor ocupa las suyas." }
    opciones:
      - { texto: "Funciona exactamente igual que si estuviera solo", bien: true, porque: "El segundo ocupa otras celdas del silicio: no comparten nada que se tengan que repartir." }
      - { texto: "Va más lento, porque comparten el tiempo", porque: "Eso pasa en un microcontrolador, donde las tareas se turnan. En la FPGA no hay turnos." }
      - { texto: "Se para mientras el segundo trabaja", porque: "No hay un procesador que alterne entre ellos: los dos circuitos existen a la vez." }
    escalera: ["¿Comparten algo los dos divisores, si cada uno es un circuito distinto?"]
    solucion: "Funciona igual: en el microcontrolador la segunda tarea afecta a la primera; en la FPGA, no."

  - id: pregunta-bucle
    tipo: tocar
    titulo: "Un bucle que no cabe"
    texto: "Un bucle de mil iteraciones escrito en HDL puede no caber en la FPGA. Toque la idea que lo explica."
    libro: [16, 17, 36]
    widget:
      tipo: figura
      figura: fig-37.2
      zonas:
        - { id: todo, rotulo: "Abajo a la izquierda", rect: [3, 140, 145, 103] }
        - { id: bucle, rotulo: "Abajo en el centro", rect: [152, 140, 145, 103] }
        - { id: multiplicar, rotulo: "Abajo a la derecha", rect: [301, 140, 150, 103] }
    tocar:
      bien: [bucle]
      porque:
        todo: "Es cierto que todo ocurre a la vez, pero no explica que ocupe tanto."
        multiplicar: "Habla de multiplicadores; el bucle es la otra idea."
    exito: "No itera en el tiempo: se despliega en el espacio, una copia por vuelta. Igual que diez productos a la vez son diez multiplicadores."
    escalera: ["¿Qué genera cada vuelta del bucle?"]
    solucion: "Abajo en el centro: un bucle se despliega."

  - id: empareje-cambio-mental
    tipo: tocar
    titulo: "Como si fuera un programa"
    texto: "Alguien escribe HDL «como si fuera un programa», sentencia tras sentencia. Toque la idea que olvida."
    libro: [15, 36]
    widget:
      tipo: figura
      figura: fig-37.2
      zonas:
        - { id: todo, rotulo: "Abajo a la izquierda", rect: [3, 140, 145, 103] }
        - { id: bucle, rotulo: "Abajo en el centro", rect: [152, 140, 145, 103] }
        - { id: multiplicar, rotulo: "Abajo a la derecha", rect: [301, 140, 150, 103] }
    tocar:
      bien: [todo]
      porque:
        bucle: "Los bucles son un caso particular; lo que olvida es más general."
        multiplicar: "El coste en área viene después; lo primero es que nada va por pasos."
    exito: "Las sentencias de un HDL describen circuitos concurrentes, no pasos sucesivos: es el error de partida de casi todo el mundo."
    escalera: ["¿En qué orden se ejecutan las sentencias de un circuito?"]
    solucion: "Abajo a la izquierda: todo ocurre a la vez."

  - id: explore-placa
    tipo: tocar
    titulo: "Una placa con FPGA"
    texto: "Toque el chip por el que el ordenador carga la configuración de la FPGA."
    libro: [12, 37]
    widget:
      tipo: figura
      figura: fig-37.3
      zonas:
        - { id: fpga, rotulo: "Chip grande, en el centro", rect: [597, 173, 209, 213] }
        - { id: sdram, rotulo: "Chip a la derecha", rect: [840, 171, 163, 163] }
        - { id: usb, rotulo: "Chip a la izquierda", rect: [187, 160, 157, 160] }
    tocar:
      bien: [usb]
      porque:
        fpga: "Es la FPGA Intel MAX 10: recibe la configuración, no la trae."
        sdram: "Es la memoria SDRAM, no el camino desde el ordenador."
    exito: "El puente USB la alimenta y la programa. Sin configurar, la FPGA no hace nada: la configuración se carga al arrancar."
    escalera: ["Busque el que habla con el ordenador."]
    solucion: "A la izquierda: el puente USB."

  - id: pregunta-para-que-no
    tipo: pregunta
    titulo: "Para qué no"
    texto: "¿Cuál de estos trabajos encaja peor en una FPGA?"
    libro: [20, 21, 22, 25, 26]
    widget:
      tipo: figura
      figura: fig-37.2
      zonas:
        - { id: fpga, rotulo: "Arriba a la derecha", rect: [229, 2, 220, 124], texto: "Todo a la vez: ahí está su fuerza." }
    opciones:
      - { texto: "Un algoritmo secuencial", bien: true, porque: "Es lo que un procesador hace bien. De ahí la solución mixta: un procesador para el control y la lógica dedicada para el paralelismo." }
      - { texto: "Procesar muchos canales a la vez", porque: "Es paralelismo masivo: el primer caso donde una FPGA es la respuesta correcta." }
      - { texto: "Una temporización de nanosegundos", porque: "En una FPGA está garantizada por construcción: es uno de sus casos." }
      - { texto: "Un protocolo serie propio muy rápido", porque: "Interfaces raros o muy rápidos: otro de sus cuatro casos." }
    escalera: ["¿Qué hace bien un procesador que a la FPGA no le sale?"]
    solucion: "El algoritmo secuencial: es lo que un procesador hace bien."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [4, 16, 17, 26, 29, 31, 32]
    ideas:
      - { titulo: "Ser, no ejecutar.", texto: "La FPGA se convierte en el circuito descrito: las tareas ocupan silicio, no turnos." }
      - { titulo: "Cambio mental.", texto: "Todo a la vez; el bucle se despliega; multiplicar cuesta área, no tiempo." }
      - { titulo: "Para qué.", texto: "Paralelismo, temporización estricta e interfaces raros; para lo secuencial, un procesador." }
      - { titulo: "Coste.", texto: "Consumo en reposo, compilaciones de horas y sin puntos de ruptura." }
