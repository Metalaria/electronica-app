# Lección 1.2 de la sección 38.14 «ASIC frente a FPGA: un Caso Real con Treinta Años de Distancia» (cap37; etiqueta
# interna sec-37.14). Formato: contenido/lecciones11/GUIA.md (§11). Foto de la Neo Geo AES (figura 38.22,
# 1600 × 1168 px; zonas ampliadas alrededor de las cajas lspc, 68k, z80 y cart del explorador «Consolas»). La cuenta
# de la frecuencia de cuadro (bloques 546–549) va en el modelo. Figura 38.21 (450,72 × 223,92).
leccion: cap37/sec-37.14

libro:
  538: "la consola original de 1990, construida con circuitos integrados a medida"
  542: "Motorola 68000 a 12 MHz"
  546: '"píxel" = ("24")/("4") = "6 MHz"'
  548: "384 × 264 = 101 376 ciclos por cuadro"
  549: '("6 000 000")/("101 376") = "59,19 Hz"'
  551: "Lo que no existía en el mercado era el sistema de vídeo, y por eso SNK lo integró en chips propios."
  553: "380 objetos simultáneos, con hasta 96 por línea."
  557: "exige un cauce de datos que solo cabía integrándolo"
  562: "La FPGA no era una alternativa"
  567: "Con un NRE de seis cifras, el coste por unidad sería absurdo."
  569: "lo que se amortiza no es un core, sino el hardware que puede ser cualquier core"
  571: "hay que servirlos desde memoria externa sin perder un solo ciclo del barrido"
  575: "El RTL estaba probado, se había comparado con el hardware original durante años, y el riesgo de respin bajaba en consecuencia."
  580: "todo lo que mejora el sonido o la imagen se aparta del hardware de referencia"
  584: "si el ASIC lo tiene, queda grabado en el silicio para siempre"
  587: "Alto: sin precedente"
  588: "no hay una tecnología mejor, hay una decisión adecuada a cada conjunto de restricciones"
  590: "una FPGA sustituyendo a un ASIC descatalogado"
  593: "la FPGA gasta entre diez y cuarenta veces más silicio para hacer lo mismo"
  594: "Las tres implementaciones del mismo sistema y el camino FPGA → ASIC."
  595: "Placa base de una Neo Geo AES"

modelo:
  valores:
    f_x: { sim: "f_{cristal}", nombre: "cristal", unidad: Hz, valor: 24000000 }
    pts: { nombre: "puntos por línea", valor: 384 }
    lin: { nombre: "líneas", valor: 264 }
  calculos:
    f_pix: { expr: "f_x/4", sim: "f_{píxel}", nombre: "reloj de píxel", unidad: Hz }
    f_cuadro: { expr: "f_pix/(pts*lin)", sim: "f_{cuadro}", nombre: "frecuencia de cuadro", unidad: Hz, cifras: 4 }

tarjetas:
  - id: explore-tres
    tipo: explorar
    titulo: "Tres implementaciones"
    texto: "La misma máquina: ASIC en 1990, core de FPGA décadas después y ASIC otra vez en 2026. Toque las tres."
    libro: [538, 594]
    widget:
      tipo: figura
      figura: fig-37.21
      zonas:
        - { id: asic90, rotulo: "Recuadro de la izquierda", rect: [65, 18, 113, 72], texto: "1990: chips a medida de SNK; ninguna FPGA de la época lo habría contenido." }
        - { id: core, rotulo: "Recuadro del centro", rect: [200, 18, 112, 72], texto: "Core de FPGA: trazado del silicio original, afinado durante años." }
        - { id: asic26, rotulo: "Recuadro de la derecha", rect: [334, 18, 113, 72], texto: "2026: el core llevado a silicio, con el RTL ya probado." }
    requiere: { mover: [asic90, core, asic26] }

  - id: toque-a-medida
    tipo: tocar
    titulo: "Lo que no se podía comprar"
    texto: "La CPU, el Z80 de sonido y el chip de audio eran de catálogo. Toque el chip que SNK tuvo que hacer a medida."
    libro: [542, 551, 595]
    widget:
      tipo: figura
      figura: fig-37.22
      zonas:
        - { id: video, rect: [228, 520, 157, 180], rotulo: "Chip cuadrado, a la izquierda" }
        - { id: cpu, rect: [700, 198, 330, 139], rotulo: "Chip largo, arriba en el centro" }
        - { id: z80, rect: [790, 548, 285, 130], rotulo: "Chip largo, en el centro" }
        - { id: cartucho, rect: [462, 338, 738, 207], rotulo: "Ranura ancha, en el centro" }
    tocar:
      bien: [video]
      porque:
        cpu: "Es la CPU 68000: un componente de catálogo, se compraba."
        z80: "Es el Z80 de sonido, también de catálogo."
        cartucho: "Es el conector de cartucho, no un integrado."
    exito: "El vídeo: lo que no existía en el mercado, y SNK lo integró en chips propios."
    escalera: ["Busque a la izquierda y abajo: ahí están los integrados a medida de SNK."]
    solucion: "El chip cuadrado de la izquierda: vídeo a medida de SNK."

  - id: prediga-por-que-asic
    tipo: predecir
    titulo: "380 objetos"
    texto: "380 objetos, hasta 96 por línea, cada uno escalado durante el barrido, en 1990. ¿Por qué un ASIC?"
    libro: [553, 557, 562]
    widget:
      tipo: figura
      figura: fig-37.21
      zonas:
        - { id: asic90, rotulo: "Recuadro de la izquierda", rect: [65, 18, 113, 72], texto: "Chips a medida de SNK." }
    opciones:
      - { texto: "Ese cauce de datos solo cabía integrándolo, y ninguna FPGA de la época lo habría contenido", bien: true, porque: "Con lógica de catálogo habría sido una placa entera, decenas de vatios y más caro." }
      - { texto: "Porque era más fácil de diseñar", porque: "Un ASIC es lo más caro y lento de diseñar: se eligió porque no había otra forma." }
      - { texto: "Porque las FPGA eran demasiado rápidas", porque: "Al contrario: eran pequeñas, lentas y caras." }
    escalera: ["¿Qué alternativas había en 1990?"]
    solucion: "Solo cabía integrándolo: la FPGA no era una alternativa, y el volumen lo justificaba."

  - id: estime-cuadro
    tipo: pregunta
    fase: "Estime"
    titulo: "La cuenta de la Neo Geo"
    texto: "Reloj de píxel de 24 MHz / 4 = 6 MHz, con 384 puntos por línea y 264 líneas. ¿Cuántos cuadros por segundo?"
    libro: [546, 548, 549]
    estimar:
      objetivo: "f_cuadro"
      unidad: Hz
      min: 50
      max: 70
      paso: 0.01
      inicio: 64
      tol: 0.002
      rotulo: "Frecuencia de cuadro"
    exito: "59,19 Hz: 101 376 ciclos por cuadro a 6 MHz."
    pistas:
      - { cuando: { valor: estimacion, mayor: 59.31 }, texto: "Demasiados: divida 6 000 000 entre 384 × 264." }
      - { texto: "Pocos: 384 × 264 = 101 376 ciclos por cuadro, a 6 MHz." }
    escalera: ["Ciclos por cuadro = puntos × líneas; cuadros por segundo = reloj de píxel / ciclos por cuadro."]
    solucion: "6 000 000 / 101 376 = 59,19 Hz."
    comprobar:
      - { f_pix: 6000000, f_cuadro: 59.19 }

  - id: pregunta-core
    tipo: pregunta
    titulo: "Décadas después, en FPGA"
    texto: "Para la recreación, ¿cuál es el argumento decisivo a favor de la FPGA?"
    libro: [567, 569]
    widget:
      tipo: figura
      figura: fig-37.21
      zonas:
        - { id: core, rotulo: "Recuadro del centro", rect: [200, 18, 112, 72], texto: "Se corrige y afina durante años; la misma placa sirve para muchos sistemas." }
    opciones:
      - { texto: "Una sola placa sirve para muchos sistemas", bien: true, porque: "Lo que se amortiza no es un core, sino el hardware que puede ser cualquier core." }
      - { texto: "Que es más rápida que el original", porque: "El rendimiento sobra, pero no es lo que decide." }
      - { texto: "Que su NRE es de seis cifras", porque: "Ese NRE es el de un ASIC; con miles de usuarios haría el coste por unidad absurdo." }
    escalera: ["¿Qué se amortiza al comprar la placa?"]
    solucion: "La misma placa puede ser cualquier core: eso se amortiza."

  - id: pregunta-memoria
    tipo: pregunta
    titulo: "Lo que sí cuesta"
    texto: "Los cartuchos llegaron a casi 90 MB de gráficos y sonido. ¿Qué exige eso al core?"
    libro: [571]
    widget:
      tipo: figura
      figura: fig-37.22
      zonas:
        - { id: cartucho, rect: [462, 338, 738, 207], rotulo: "Ranura ancha, en el centro", texto: "La ranura del cartucho." }
    opciones:
      - { texto: "Servirlos desde memoria externa sin perder un ciclo del barrido", bien: true, porque: "No caben en la memoria interna, y el barrido no espera: con 96 objetos por línea." }
      - { texto: "Una FPGA más rápida", porque: "El rendimiento sobra; el problema es la memoria y su temporización." }
      - { texto: "Comprimirlos", porque: "Hay que servirlos al ritmo del barrido, no hacerlos más pequeños." }
    escalera: ["¿Caben 90 MB en los bloques de RAM de una FPGA?"]
    solucion: "Memoria externa, servida sin perder un solo ciclo del barrido."

  - id: porque-riesgo
    tipo: porque
    titulo: "Un ASIC con poco riesgo"
    texto: "La consola de 2026 lleva el core de FPGA a ASIC. ¿Por qué su riesgo es bajo, frente al «alto: sin precedente» de 1990?"
    libro: [575, 587]
    widget:
      tipo: figura
      figura: fig-37.21
      zonas:
        - { id: asic26, rotulo: "Recuadro de la derecha", rect: [334, 18, 113, 72], texto: "El core llevado a silicio: RTL probado durante años." }
    opciones:
      - { texto: "El RTL ya estaba probado frente al original durante años", bien: true, porque: "Validado en FPGA, el riesgo de respin baja: es el camino FPGA → ASIC." }
      - { texto: "Porque los ASIC actuales no fallan", porque: "Fallan igual; lo que baja el riesgo es la verificación previa." }
      - { texto: "Porque se puede actualizar", porque: "Un ASIC no se actualiza: por eso importa tanto haberlo probado antes." }
    escalera: ["¿Qué se había hecho con ese diseño antes de llevarlo a silicio?"]
    solucion: "Años de rodaje del core en FPGA: el RTL estaba probado y el riesgo de respin bajaba."

  - id: empareje-cuadro
    tipo: pregunta
    fase: "Empareje"
    titulo: "El cuadro comparativo"
    texto: "Una cada fila del cuadro con su valor."
    libro: [587, 594]
    emparejar:
      - ["Core FPGA, cambiar algo", "Minutos"]
      - ["ASIC de 1990, riesgo", "Alto: sin precedente"]
      - ["ASIC de 2026, NRE", "Alto, con RTL ya probado"]
      - ["Core FPGA, reutilización", "Cualquier sistema"]
    exito: "Las tres decisiones son correctas: no hay una tecnología mejor, sino una adecuada a cada caso."
    pistas:
      - { texto: "Un ASIC solo sirve para su sistema; cambiarlo son máscaras nuevas." }
    escalera: ["El core se recompila: cambiar algo lleva minutos."]
    solucion: "FPGA: minutos y cualquier sistema. ASIC de 1990: riesgo alto. ASIC de 2026: NRE alto con RTL probado."

  - id: pregunta-polemica
    tipo: pregunta
    titulo: "La polémica"
    texto: "Se descubre un fallo en la lógica de vídeo. ¿Qué pasa en el core de FPGA y qué en el ASIC?"
    libro: [584, 588]
    widget:
      tipo: figura
      figura: fig-37.21
      zonas:
        - { id: lineas, rotulo: "Líneas de abajo", rect: [50, 184, 350, 36], texto: "Un core con un fallo se recompila; un ASIC, no." }
    opciones:
      - { texto: "El core se recompila y se distribuye; en el ASIC queda grabado para siempre", bien: true, porque: "Se cambia flexibilidad por coste unitario, consumo y latencia." }
      - { texto: "Los dos se actualizan igual", porque: "Un ASIC no se puede actualizar: no hay configuración que cargar." }
      - { texto: "El ASIC se corrige con firmware", porque: "Solo lo que se previó configurable; un fallo de la lógica queda en el silicio." }
    escalera: ["¿Qué hay que fabricar de nuevo en cada caso?"]
    solucion: "El core se recompila; el ASIC conserva el fallo en el silicio para siempre."

  - id: pregunta-fidelidad
    tipo: pregunta
    titulo: "Reproducir, no mejorar"
    texto: "En un core de fidelidad se añade un interpolador que suaviza el audio. ¿Cómo cuenta?"
    libro: [580]
    widget:
      tipo: figura
      figura: fig-37.21
      zonas:
        - { id: asic26, rotulo: "Recuadro de la derecha", rect: [334, 18, 113, 72], texto: "Reproduce el original, sin mejoras añadidas." }
    opciones:
      - { texto: "Como un defecto: se aparta del hardware de referencia", bien: true, porque: "El criterio es reproducir el original, no mejorarlo." }
      - { texto: "Como una mejora bienvenida", porque: "En un proyecto de fidelidad, todo lo que mejora el sonido se aparta de la referencia." }
      - { texto: "Da igual: nadie lo nota", porque: "Se nota frente al original, y eso es lo que se compara." }
    escalera: ["¿Con qué se compara un core de fidelidad?"]
    solucion: "Como un defecto: se aparta del hardware de referencia."

  - id: pregunta-banco
    tipo: pregunta
    titulo: "En el banco"
    texto: "Con el informe de utilización de un core se estima que la FPGA gasta de diez a cuarenta veces más silicio. ¿Por qué fue aun así la elección correcta?"
    libro: [590, 593]
    widget:
      tipo: figura
      figura: fig-37.21
      zonas:
        - { id: core, rotulo: "Recuadro del centro", rect: [200, 18, 112, 72], texto: "La misma placa sirve para muchos sistemas." }
    opciones:
      - { texto: "Ese silicio ya estaba fabricado y servía para otra cosa al día siguiente", bien: true, porque: "No hay NRE: se reutiliza el mismo chip para cualquier core." }
      - { texto: "Porque en realidad gasta menos", porque: "Gasta más, de diez a cuarenta veces: compensa por otras razones." }
      - { texto: "Porque el área no importa nunca", porque: "Importa en volumen; con miles de unidades, manda el NRE." }
    escalera: ["¿Qué coste se ahorra quien usa un silicio ya fabricado?"]
    solucion: "El silicio ya estaba fabricado y servía para otra cosa: sin NRE."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [551, 569, 575, 588]
    ideas:
      - { titulo: "1990.", texto: "El vídeo no existía en el mercado: ASIC, con volumen y sin FPGA posible." }
      - { titulo: "El core.", texto: "Una placa para muchos sistemas: lo que se amortiza es el hardware." }
      - { titulo: "2026.", texto: "Del core probado al ASIC: el camino habitual, con poco riesgo." }
      - { titulo: "Ninguna mejor.", texto: "Una decisión adecuada a cada conjunto de restricciones." }
