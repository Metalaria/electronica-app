# Lección 1.2 de la sección 38.3 «Dentro de una FPGA» (cap37; etiqueta interna sec-37.3).
# Formato: contenido/lecciones11/GUIA.md (§11). La LUT (bloque 70: la tabla de verdad guardada, las entradas como
# dirección) se ve como un multiplexor de dos bits de selección: S0 = B, S1 = A y los datos D0…D3 son los cuatro bits
# de la memoria, en el orden de las filas de la tabla (00, 01, 10, 11). La celda (bloque 74) es esa LUT seguida de un
# biestable D: salida combinacional y registrada, con su cronograma. Figuras 38.5 (450,72 × 252,72) y 38.1.
leccion: cap37/sec-37.3

libro:
  70: "cualquier función booleana de n entradas cabe en una memoria de 2ⁿ bits"
  71: "Con LUT de 6 entradas (lo habitual hoy), cada una son 64 bits de memoria"
  72: "simplificar una expresión booleana no ahorra nada si sigue cabiendo en una LUT"
  74: "La salida puede tomarse directamente de la LUT (combinacional) o a través del flip-flop (registrada)."
  75: "casi toda la lógica termina en un registro"
  76: "las celdas contiguas tienen un camino rápido de acarreo"
  78: "la interconexión ocupa la mayor parte del área del chip y produce la mayor parte del retardo"
  80: "Un diseño que usa el 90 % de las LUT puede ser imposible de rutar"
  83: "Un diseño que necesite memoria y use LUT en su lugar consume un orden de magnitud más de recursos."
  84: "Un multiplicador de 18×18 bits construido con LUT ocupa cientos de ellas"
  85: "Gestores de reloj (PLL/MMCM)"
  86: "Bloques de entrada y salida"
  88: "La mayoría de las FPGA guardan su configuración en SRAM, que es volátil"
  89: "Las hay con configuración Flash interna (arranque instantáneo, menos componentes)"
  91: "Descripción en VHDL o Verilog → síntesis"
  93: "El tercero es el más importante"
  94: "Estructura interna de una FPGA: malla de LUT y flip-flops"
  "cap37#0": "Estructura interna de una FPGA y su flujo de diseño"

modelo:
  valores:
    n: { nombre: "entradas de la LUT", valor: 6 }
  calculos:
    bits: { expr: "2^n", nombre: "bits de memoria de la LUT", cifras: 2 }

tarjetas:
  - id: explore-lut
    tipo: explorar
    titulo: "Una LUT de dos entradas"
    texto: "Cuatro bits de memoria y A, B como dirección: la salida es el bit de esa dirección. Cambie los bits guardados y verá otra función."
    libro: [70]
    widget:
      tipo: logica
      entradas:
        - A
        - B
        - { id: M0, rotulo: "Bit de la fila 00" }
        - { id: M1, rotulo: "Bit de la fila 01" }
        - { id: M2, rotulo: "Bit de la fila 10" }
        - { id: M3, rotulo: "Bit de la fila 11" }
      piezas:
        - { id: lut, tipo: mux, bits: 2, entradas: [B, A, M0, M1, M2, M3], rotulo: "LUT" }
      salidas:
        - { id: Y, de: lut }
    requiere: { mover: [A, M3] }

  - id: tabla-lut
    tipo: tabla
    titulo: "Lo que guarda la LUT"
    texto: "Esta LUT guarda un uno en las dos filas del centro y un cero en las otras dos. Rellene su tabla de verdad."
    libro: [70]
    widget:
      tipo: logica
      entradas: [A, B]
      piezas:
        - { id: lut, tipo: mux, bits: 2, entradas: [B, A, "0", "1", "1", "0"], rotulo: "LUT" }
      salidas:
        - { id: Y, de: lut }
      ocultar: true
    tabla:
      salidas: [Y]
    exito: "La columna Y es lo que hay guardado: esta LUT es una XOR, y con otros bits sería otra función."
    escalera: ["Las entradas solo eligen la fila: la salida es el bit guardado en ella."]
    solucion: "Y vale uno solo cuando A y B son distintas: la tabla de verdad es el contenido de la memoria."

  - id: estime-lut6
    tipo: pregunta
    fase: "Estime"
    titulo: "Una LUT de seis entradas"
    texto: "Lo habitual hoy son LUT de 6 entradas. ¿Cuántos bits de memoria tiene cada una?"
    libro: [70, 71]
    estimar:
      objetivo: "bits"
      min: 0
      max: 128
      paso: 1
      inicio: 100
      tol: 0.02
      rotulo: "Bits de la LUT"
    exito: "64 bits: la tabla de verdad completa de seis entradas, una fila por combinación."
    pistas:
      - { cuando: { valor: estimacion, mayor: 66 }, texto: "Demasiados: una fila por cada combinación de las seis entradas, y un bit por fila." }
      - { texto: "Pocos: cada entrada más duplica las filas de la tabla." }
    escalera: ["n entradas dan 2ⁿ combinaciones, y cada combinación es un bit."]
    solucion: "2⁶ = 64 bits de memoria."
    comprobar:
      - { bits: 64 }

  - id: prediga-simplificar
    tipo: predecir
    titulo: "¿Simplificar ahorra?"
    texto: "Una función de seis variables se escribe con tres términos o con veinte. ¿Cuántas LUT de seis entradas ocupa cada versión?"
    libro: [72]
    widget:
      tipo: figura
      figura: fig-37.5
      zonas:
        - { id: celda, rotulo: "Recuadro de la derecha", rect: [283, 22, 163, 170], texto: "Una celda: la LUT de 6 entradas y 64 bits." }
    opciones:
      - { texto: "Una LUT las dos", bien: true, porque: "La LUT guarda la tabla de verdad entera: la expresión no importa si cabe." }
      - { texto: "Menos LUT la de tres términos", porque: "Eso valía en lógica discreta. En una LUT cabe cualquier función de seis entradas." }
      - { texto: "Veinte LUT la larga, una por término", porque: "Los términos no se implementan uno a uno: la LUT guarda la tabla completa." }
    escalera: ["¿Qué guarda la LUT: la expresión o la tabla de verdad?"]
    solucion: "Una LUT las dos. Lo que sí ahorra es reducir niveles, porque cada nivel añade retardo."

  - id: explore-celda
    tipo: explorar
    titulo: "Combinacional o registrada"
    texto: "La LUT de antes seguida de un flip-flop D. Mueva el cursor: Comb cambia con las entradas; Reg, solo en el flanco del reloj."
    libro: [74, 75]
    widget:
      tipo: logica
      entradas: [A, B, { id: CLK, reloj: true }]
      piezas:
        - { id: lut, tipo: mux, bits: 2, entradas: [B, A, "0", "1", "1", "0"], rotulo: "LUT" }
        - { id: ff, tipo: d, entradas: [lut, CLK], rotulo: "FF" }
      salidas:
        - { id: Comb, de: lut }
        - { id: Reg, de: ff.q }
      cronograma: { ciclos: 4, estimulo: { A: "0110", B: "0011" }, senales: [CLK, A, B, Comb, Reg] }

  - id: pregunta-interconexion
    tipo: pregunta
    titulo: "Lo que de verdad cuesta"
    texto: "¿Qué ocupa la mayor parte del área de una FPGA y produce la mayor parte del retardo?"
    libro: [78, "cap37#0"]
    widget:
      tipo: figura
      figura: fig-37.1
      zonas:
        - { id: malla, rotulo: "Recuadro de arriba a la izquierda", rect: [5, 10, 218, 160], texto: "Celdas LUT + FF, interconexión configurable (dorado) y E/S." }
    opciones:
      - { texto: "La interconexión programable", bien: true, porque: "Los segmentos de pista y los conmutadores: es lo que sorprende viniendo del software." }
      - { texto: "Las LUT", porque: "Son el bloque lógico, pero la malla que las une ocupa y retrasa más." }
      - { texto: "Los flip-flops", porque: "Hay uno por LUT; el área y el retardo se van en la interconexión." }
      - { texto: "Los bloques de RAM", porque: "Son pocos bloques dedicados; la interconexión está por todas partes." }
    escalera: ["Piense en lo que hay entre los bloques."]
    solucion: "La interconexión: la mayor parte del área y del retardo."

  - id: pregunta-rutar
    tipo: pregunta
    titulo: "Al 90 % no cabe"
    texto: "Un diseño usa el 90 % de las LUT y la herramienta no consigue rutarlo. ¿Qué ha faltado?"
    libro: [78, 80]
    widget:
      tipo: figura
      figura: fig-37.5
      zonas:
        - { id: interconexion, rotulo: "Recuadro de abajo a la derecha", rect: [283, 196, 163, 51], texto: "La interconexión: la mayor parte del área y del retardo." }
    opciones:
      - { texto: "Caminos en la interconexión", bien: true, porque: "El límite real suele ser la interconexión, no la lógica." }
      - { texto: "Las LUT que quedan", porque: "Quedan LUT libres: lo que no hay son caminos para unirlas." }
      - { texto: "Memoria de configuración", porque: "La configuración carga lo que haya; el problema es que no hay caminos suficientes." }
    escalera: ["Si quedan LUT libres, ¿qué falta para usarlas?"]
    solucion: "Caminos: el límite real suele ser la interconexión, no la lógica."

  - id: porque-dos-compilaciones
    tipo: porque
    titulo: "Dos compilaciones, dos frecuencias"
    texto: "El mismo código, compilado dos veces, da frecuencias máximas distintas. ¿Por qué?"
    libro: [80]
    widget:
      tipo: figura
      figura: fig-37.5
      zonas:
        - { id: interconexion, rotulo: "Recuadro de abajo a la derecha", rect: [283, 196, 163, 51], texto: "La interconexión: la mayor parte del retardo." }
    opciones:
      - { texto: "El retardo depende de dónde coloque la herramienta cada bloque", bien: true, porque: "Otra colocación, otros caminos por la interconexión: de ahí la importancia de las restricciones de tiempo." }
      - { texto: "La herramienta tiene un error", porque: "No es un fallo: colocar y rutar no tiene una única solución, y cada una da otros retardos." }
      - { texto: "Las LUT se calientan", porque: "No es la temperatura: la diferencia está en los caminos que se eligen." }
    escalera: ["¿Qué parte del retardo cambia si los bloques se colocan en otro sitio?"]
    solucion: "El retardo de un camino depende de la colocación; por eso se declaran restricciones de tiempo."

  - id: toque-dsp
    tipo: tocar
    titulo: "Un multiplicador de 18×18"
    texto: "Hecho con LUT ocupa cientos de ellas. Toque el bloque que lo hace en un recurso único y mucho más rápido."
    libro: [83, 84, 85, 94]
    widget:
      tipo: figura
      figura: fig-37.5
      zonas:
        - { id: ram, rotulo: "Columna clara del centro", rect: [96, 36, 42, 84] }
        - { id: dsp, rotulo: "Columna oscura del centro", rect: [166, 36, 42, 84] }
        - { id: celda, rotulo: "Recuadro de la derecha", rect: [283, 22, 163, 170] }
    tocar:
      bien: [dsp]
      porque:
        ram: "Es un bloque de RAM: memoria, FIFO o tabla, no un multiplicador."
        celda: "Es una celda LUT + FF: justo lo que se gasta por cientos si el producto se hace con LUT."
    exito: "Los bloques DSP son multiplicadores-acumuladores cableados: los que hacen competitiva a la FPGA en procesado de señal."
    escalera: ["Busque un bloque dedicado de procesado de señal."]
    solucion: "La columna DSP: un multiplicador-acumulador cableado."

  - id: empareje-bloques
    tipo: pregunta
    fase: "Empareje"
    titulo: "Los bloques especializados"
    texto: "Una cada bloque dedicado con lo que hace."
    libro: [76, 83, 84, 85, 86]
    emparejar:
      - ["RAM", "Memoria, FIFO o tabla, con dos puertos"]
      - ["DSP", "Multiplicadores-acumuladores cableados"]
      - ["PLL/MMCM", "Generan, multiplican y desfasan relojes"]
      - ["E/S", "Niveles configurables y terminación integrada"]
      - ["Cadena de acarreo", "Un camino rápido entre celdas contiguas para sumar"]
    exito: "Construirlo todo con LUT sería ineficiente: una memoria con LUT gasta un orden de magnitud más."
    pistas:
      - { texto: "El reloj se genera y se distribuye con un bloque propio." }
    escalera: ["DSP es procesado de señal: multiplicar y acumular."]
    solucion: "RAM: memoria. DSP: multiplicar-acumular. PLL: relojes. E/S: niveles y terminación. Acarreo: sumas rápidas."

  - id: pregunta-configuracion
    tipo: pregunta
    titulo: "Responder al encender"
    texto: "Un equipo tiene que responder nada más encenderse, sin esperar milisegundos. ¿Qué FPGA conviene?"
    libro: [88, 89]
    widget:
      tipo: figura
      figura: fig-37.5
      zonas:
        - { id: celda, rotulo: "Recuadro de la derecha", rect: [283, 22, 163, 170], texto: "Lo que hace cada celda lo dice la configuración cargada." }
    opciones:
      - { texto: "Una con configuración Flash interna", bien: true, porque: "Arranque instantáneo y menos componentes." }
      - { texto: "Una con configuración en SRAM", porque: "Es volátil: al encender la recarga desde Flash externa, y en ese tiempo no hace nada." }
      - { texto: "Da igual: todas arrancan igual", porque: "La diferencia condiciona el diseño del sistema más de lo que parece." }
    escalera: ["¿Cuál no tiene que cargar nada desde fuera al encender?"]
    solucion: "Flash interna: arranque instantáneo. La de SRAM tarda de milisegundos a segundos."

  - id: ordene-flujo
    tipo: pregunta
    fase: "Ordene"
    titulo: "El flujo, en una línea"
    texto: "Ponga en orden los pasos desde el código hasta la FPGA configurada."
    libro: [91, "cap37#0"]
    ordenar:
      - "Descripción en VHDL o Verilog."
      - "Síntesis: traducir a LUT y flip-flops."
      - "Implementación: colocar y rutar."
      - "Análisis de tiempos."
      - "Generación del fichero de configuración."
    exito: "La herramienta hace casi todo: el trabajo está en describir bien y en las restricciones."
    pistas:
      - { texto: "Colocar y rutar necesita saber antes qué LUT y flip-flops hay." }
    escalera: ["Los tiempos solo se pueden analizar cuando ya se sabe por dónde va cada cable."]
    solucion: "Descripción, síntesis, implementación, análisis de tiempos y fichero de configuración."

  - id: pregunta-banco
    tipo: pregunta
    titulo: "En el banco"
    texto: "Una FPGA se depura con un analizador lógico interno, sacando señales a pines o leyendo los informes de tiempos. ¿Cuál es el más importante?"
    libro: [93]
    widget:
      tipo: figura
      figura: fig-37.1
      zonas:
        - { id: analisis, rotulo: "Cuarto recuadro de la derecha", rect: [248, 136, 134, 38], texto: "El análisis de tiempos: camino crítico y slack." }
    opciones:
      - { texto: "Los informes de tiempos", bien: true, porque: "Dicen si el diseño cumple antes de probar nada: un diseño que no cierra tiempos no se depura, se corrige." }
      - { texto: "El analizador lógico interno", porque: "Captura señales internas, pero solo sirve si el diseño ya cumple tiempos." }
      - { texto: "El osciloscopio en los pines", porque: "Ve lo que sale, pero no dice si el diseño cumple antes de probar." }
    escalera: ["¿Cuál dice algo antes de probar nada?"]
    solucion: "Los informes de tiempos: un diseño que no cierra tiempos no se depura, se corrige."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [70, 72, 78, 84]
    ideas:
      - { titulo: "LUT.", texto: "Una memoria de 2ⁿ bits con la tabla de verdad: las entradas son la dirección." }
      - { titulo: "Celda.", texto: "LUT + flip-flop, con salida combinacional o registrada." }
      - { titulo: "Interconexión.", texto: "La mayor parte del área y del retardo: el límite real." }
      - { titulo: "Bloques dedicados.", texto: "RAM, DSP, relojes y E/S, mucho más eficientes que las LUT." }
