# Lección 1.2 de la sección 38.6 «Escribir HDL de Verdad: un Módulo y su Banco de Pruebas» (cap37; etiqueta interna
# sec-37.6). Formato: contenido/lecciones11/GUIA.md (§11). El pwm_gen de los listados (bloques 162 y 168) con
# WIDTH = 2, puerta a puerta: contador de dos bits (count), registro sombra de dos biestables D que cargan duty solo
# cuando count = 0 (un multiplexor por bit: con count ≠ 0 se devuelven a sí mismos) y el comparador count < duty_r
# (a1: count1 = 0 y duty_r1 = 1; a2: count1 = duty_r1, count0 = 0 y duty_r0 = 1). El registro sombra empieza con
# duty_r = 2 (inicial de r1). En el dibujo, duty pasa de 2 a 3 a mitad de periodo (bloque 184). Figura 38.8
# (svg_vista 450,72 × 234,72) para las cinco partes del banco de pruebas.
leccion: cap37/sec-37.6

libro:
  160: "un generador de PWM con ciclo de trabajo configurable"
  162: "pwm_out <= '1' when count < duty_r else '0';"
  164: "Un solo proceso secuencial con rising_edge(clk), y la salida como asignación concurrente."
  165: "El reset es síncrono y activo a nivel bajo."
  166: "el ciclo de trabajo solo se actualiza cuando el contador vale cero"
  168: "assign pwm_out = (count < duty_r);"
  170: "<= en bloques secuenciales, = en combinacionales"
  173: "measure(128);      -- half"
  176: "uno con assert falla ruidosamente cuando algo se rompe"
  177: "Cubre los casos límite: cero, uno, el máximo, el máximo más uno."
  178: "mide el comportamiento observable —el tiempo en alto— y no los valores internos del contador"
  179: "Un banco que no acaba no puede automatizarse."
  184: "Cambio de duty a mitad de periodo: que el pulso en curso no se deforma."
  187: "escribir el testbench antes que el módulo, a partir de la especificación"
  188: "eso es lo que permite tocar un diseño de miles de líneas sin miedo"
  189: "Las cinco partes de un banco de pruebas y qué lo hace bueno."

modelo:
  valores: {}
  calculos: {}

tarjetas:
  - id: prediga-pwm
    tipo: predecir
    titulo: "Antes de verlo"
    texto: "El pwm_gen del libro, con dos bits y duty_r = 2. De las cuatro cuentas de cada periodo, ¿en cuántas está PWM alto?"
    libro: [160, 162]
    widget:
      tipo: logica
      entradas: [{ id: CLK, reloj: true }, { id: D1, valor: 1, rotulo: "duty1" }, { id: D0, rotulo: "duty0" }]
      piezas:
        - { id: cnt, tipo: contador, bits: 2, entradas: [CLK], rotulo: "count" }
        - { id: z, tipo: nor, entradas: [cnt.q0, cnt.q1], rotulo: "count = 0" }
        - { id: m1, tipo: mux, bits: 1, entradas: [z, r1.q, D1] }
        - { id: m0, tipo: mux, bits: 1, entradas: [z, r0.q, D0] }
        - { id: r1, tipo: d, entradas: [m1, CLK], inicial: 1, rotulo: "duty_r1" }
        - { id: r0, tipo: d, entradas: [m0, CLK], rotulo: "duty_r0" }
        - { id: n1, tipo: not, entradas: [cnt.q1] }
        - { id: a1, tipo: and, entradas: [n1, r1.q] }
        - { id: x1, tipo: xnor, entradas: [cnt.q1, r1.q] }
        - { id: n0, tipo: not, entradas: [cnt.q0] }
        - { id: a2, tipo: and, entradas: [x1, n0, r0.q] }
        - { id: lt, tipo: or, entradas: [a1, a2], rotulo: "count < duty_r" }
      salidas:
        - { id: Q1, de: cnt.q1, rotulo: "count1" }
        - { id: Q0, de: cnt.q0, rotulo: "count0" }
        - { id: PWM, de: lt }
      cronograma: { ciclos: 8, senales: [CLK, Q1, Q0, PWM] }
      ocultar: true
    opciones:
      - { texto: "En dos: con count = 0 y count = 1", bien: true, porque: "PWM vale uno mientras count < duty_r: las cuentas cero y uno." }
      - { texto: "En tres: de cero a duty_r", porque: "Es un menor estricto: con count = 2 ya no se cumple count < duty_r." }
      - { texto: "En una: solo con count = duty_r", porque: "No compara igualdad: está alto todo el tiempo en que count es menor." }
    escalera: ["La salida es count < duty_r: cuente las cuentas menores que duty_r."]
    solucion: "En dos de cuatro: count = 0 y count = 1. El ciclo de trabajo es duty_r entre cuatro."

  - id: explore-pwm
    tipo: explorar
    titulo: "El pwm_gen, en pequeño"
    texto: "El módulo del libro con dos bits: contador, registro sombra y la salida count < duty_r. Mueva el cursor y compare PWM con la cuenta."
    libro: [160, 162, 164]
    widget:
      tipo: logica
      entradas: [{ id: CLK, reloj: true }, { id: D1, valor: 1, rotulo: "duty1" }, { id: D0, rotulo: "duty0" }]
      piezas:
        - { id: cnt, tipo: contador, bits: 2, entradas: [CLK], rotulo: "count" }
        - { id: z, tipo: nor, entradas: [cnt.q0, cnt.q1], rotulo: "count = 0" }
        - { id: m1, tipo: mux, bits: 1, entradas: [z, r1.q, D1] }
        - { id: m0, tipo: mux, bits: 1, entradas: [z, r0.q, D0] }
        - { id: r1, tipo: d, entradas: [m1, CLK], inicial: 1, rotulo: "duty_r1" }
        - { id: r0, tipo: d, entradas: [m0, CLK], rotulo: "duty_r0" }
        - { id: n1, tipo: not, entradas: [cnt.q1] }
        - { id: a1, tipo: and, entradas: [n1, r1.q] }
        - { id: x1, tipo: xnor, entradas: [cnt.q1, r1.q] }
        - { id: n0, tipo: not, entradas: [cnt.q0] }
        - { id: a2, tipo: and, entradas: [x1, n0, r0.q] }
        - { id: lt, tipo: or, entradas: [a1, a2], rotulo: "count < duty_r" }
      salidas:
        - { id: Q1, de: cnt.q1, rotulo: "count1" }
        - { id: Q0, de: cnt.q0, rotulo: "count0" }
        - { id: PWM, de: lt }
      cronograma: { ciclos: 8, senales: [CLK, Q1, Q0, PWM] }

  - id: dibuje-sombra
    tipo: dibujar
    titulo: "duty cambia a mitad de periodo"
    texto: "duty pasa de 2 a 3 con el pulso en marcha, y el registro sombra solo lo carga con count = 0. Dibuje PWM."
    libro: [162, 166, 184]
    widget:
      tipo: logica
      entradas: [{ id: CLK, reloj: true }, { id: D1, valor: 1, rotulo: "duty1" }, { id: D0, rotulo: "duty0" }]
      piezas:
        - { id: cnt, tipo: contador, bits: 2, entradas: [CLK], rotulo: "count" }
        - { id: z, tipo: nor, entradas: [cnt.q0, cnt.q1], rotulo: "count = 0" }
        - { id: m1, tipo: mux, bits: 1, entradas: [z, r1.q, D1] }
        - { id: m0, tipo: mux, bits: 1, entradas: [z, r0.q, D0] }
        - { id: r1, tipo: d, entradas: [m1, CLK], inicial: 1, rotulo: "duty_r1" }
        - { id: r0, tipo: d, entradas: [m0, CLK], rotulo: "duty_r0" }
        - { id: n1, tipo: not, entradas: [cnt.q1] }
        - { id: a1, tipo: and, entradas: [n1, r1.q] }
        - { id: x1, tipo: xnor, entradas: [cnt.q1, r1.q] }
        - { id: n0, tipo: not, entradas: [cnt.q0] }
        - { id: a2, tipo: and, entradas: [x1, n0, r0.q] }
        - { id: lt, tipo: or, entradas: [a1, a2], rotulo: "count < duty_r" }
      salidas:
        - { id: Q1, de: cnt.q1, rotulo: "count1" }
        - { id: Q0, de: cnt.q0, rotulo: "count0" }
        - { id: PWM, de: lt }
      cronograma: { ciclos: 12, estimulo: { D0: "000001111111" }, senales: [CLK, Q1, Q0, D0] }
      dibujo: false
    dibujar:
      senal: PWM
    exito: "El pulso en curso sigue con el duty viejo; el nuevo entra cuando count vuelve a cero. Sin sombra, ese pulso saldría deforme."
    escalera:
      - "PWM vale uno mientras count < duty_r, y duty_r solo cambia en el flanco en que count vale cero."
      - "Hasta que count vuelve a cero, compare con 2; desde ahí, con 3."
    solucion: "Pulsos de dos cuentas hasta que count vuelve a cero tras el cambio; desde ahí, de tres."

  - id: porque-sombra
    tipo: porque
    titulo: "El registro sombra"
    texto: "¿Para qué copia el módulo duty en duty_r solo cuando el contador vale cero?"
    libro: [166, 184]
    widget:
      tipo: figura
      figura: fig-37.8
      zonas:
        - { id: estimulos, rotulo: "Recuadro naranja de la izquierda", rect: [16, 120, 76, 65], texto: "Los estímulos cambian duty: 0, 1, 128 y 255." }
    opciones:
      - { texto: "Para que un cambio de duty a mitad de periodo no deforme el pulso en curso", bien: true, porque: "El nuevo ciclo de trabajo empieza con el periodo siguiente." }
      - { texto: "Para evitar un latch", porque: "El latch lo evita separar el proceso de la salida concurrente; la sombra es otra cosa." }
      - { texto: "Para ahorrar flip-flops", porque: "Al contrario: gasta un registro más, a cambio de pulsos sin deformar." }
    escalera: ["¿Qué pasaría si duty cambia cuando el pulso ya está alto?"]
    solucion: "Sin él, cambiar duty a mitad de periodo produce un pulso deforme."

  - id: pregunta-reset
    tipo: pregunta
    titulo: "El reset del módulo"
    texto: "El proceso del pwm_gen: la comprobación de rst_n va dentro de if rising_edge(clk). ¿Qué reset es?"
    libro: [162, 165]
    widget:
      tipo: figura
      codigo:
        lenguaje: vhdl
        texto: |
          process (clk)
          begin
              if rising_edge(clk) then
                  if rst_n = '0' then
                      count  <= (others => '0');
                      duty_r <= (others => '0');
                  else
                      count <= count + 1;
      resaltar: [3, 4]
    opciones:
      - { texto: "Síncrono y activo a nivel bajo", bien: true, porque: "Solo actúa en el flanco del reloj, y con rst_n a cero." }
      - { texto: "Asíncrono y activo a nivel alto", porque: "Está dentro del rising_edge: espera al flanco. Y actúa con rst_n a cero." }
      - { texto: "Síncrono y activo a nivel alto", porque: "La _n del nombre y el '0' del if dicen que es activo a nivel bajo." }
    escalera: ["¿Se mira rst_n en cualquier momento o solo en el flanco?"]
    solucion: "Síncrono y activo a nivel bajo. Uno asíncrono exigiría liberarlo de forma sincronizada."

  - id: pregunta-asignaciones
    tipo: pregunta
    titulo: "<= o ="
    texto: "En Verilog, ¿qué asignación va en los bloques secuenciales y cuál en los combinacionales?"
    libro: [168, 170]
    widget:
      tipo: figura
      figura: fig-37.8
      zonas:
        - { id: dut, rotulo: "Recuadro marrón del centro", rect: [116, 74, 59, 79], texto: "El módulo: un always @(posedge clk) y una salida assign." }
    opciones:
      - { texto: "<= en secuenciales; = en combinacionales", bien: true, porque: "Es la regla que evita el error más común en Verilog." }
      - { texto: "= en secuenciales; <= en combinacionales", porque: "Al revés: el módulo usa count <= count + 1'b1 en el always @(posedge clk)." }
      - { texto: "Da igual, se pueden mezclar", porque: "Mezclarlos produce circuitos que simulan de una forma y sintetizan de otra." }
    escalera: ["Mire la línea del contador dentro de always @(posedge clk)."]
    solucion: "<= (no bloqueante) en los bloques secuenciales, = en los combinacionales."

  - id: empareje-partes
    tipo: pregunta
    fase: "Empareje"
    titulo: "Las cinco partes del banco"
    texto: "Una cada parte del banco de pruebas con lo que hace."
    libro: [173, 189]
    emparejar:
      - ["DUT", "El módulo bajo prueba"]
      - ["Reloj", "Un periodo de 10 ns"]
      - ["Estímulos", "Reset y luego cada duty"]
      - ["Comprobación", "Mide el tiempo en alto y lo compara con assert"]
      - ["Fin", "Informe y parada del reloj"]
    exito: "Genera estímulos, comprueba sola y termina diciendo si pasó."
    pistas:
      - { texto: "El assert está en la parte que compara lo medido con lo esperado." }
    escalera: ["La parte que se prueba es el DUT: device under test."]
    solucion: "DUT: el módulo. Reloj: 10 ns. Estímulos: reset y duty. Comprobación: tiempo en alto y assert. Fin: informe y parada."

  - id: toque-se-comprueba
    tipo: tocar
    titulo: "Se comprueba solo"
    texto: "Toque la parte que hace que el banco falle ruidosamente, sin mirar formas de onda, cuando algo se rompe."
    libro: [176, 189]
    widget:
      tipo: figura
      figura: fig-37.8
      zonas:
        - { id: reloj, rotulo: "Recuadro azul de la izquierda", rect: [16, 41, 76, 43] }
        - { id: dut, rotulo: "Recuadro marrón del centro", rect: [116, 74, 59, 79] }
        - { id: estimulos, rotulo: "Recuadro naranja de la izquierda", rect: [16, 120, 76, 65] }
        - { id: comprobacion, rotulo: "Recuadro verde del centro", rect: [200, 74, 84, 62] }
        - { id: fin, rotulo: "Recuadro morado de abajo", rect: [200, 171, 84, 47] }
    tocar:
      bien: [comprobacion]
      porque:
        reloj: "Solo genera el reloj del módulo."
        dut: "Es el módulo que se prueba, no el que comprueba."
        estimulos: "Pone los valores de entrada; no compara nada."
        fin: "Informa y para el reloj, pero el fallo lo detecta la comprobación."
    exito: "La comprobación con assert: es lo que permite reejecutar el banco tras cada cambio."
    escalera: ["¿Dónde se compara lo medido con lo esperado?"]
    solucion: "La comprobación: mide el tiempo en alto y hace assert."

  - id: pregunta-casos-limite
    tipo: pregunta
    titulo: "measure(0), measure(1)…"
    texto: "El banco prueba duty = 0, 1, 128 y 255. ¿Por qué esos valores y no unos cualquiera?"
    libro: [173, 177]
    widget:
      tipo: figura
      figura: fig-37.8
      zonas:
        - { id: estimulos, rotulo: "Recuadro naranja de la izquierda", rect: [16, 120, 76, 65], texto: "duty = 0, 1, 128 y 255." }
    opciones:
      - { texto: "Son casos límite y la mitad: ahí viven casi todos los errores", bien: true, porque: "Cero, uno, el máximo: no el caso típico." }
      - { texto: "Son los más frecuentes en uso", porque: "No se eligen por frecuentes: se eligen porque ahí se rompe el diseño." }
      - { texto: "Para que la simulación sea corta", porque: "La razón es otra: los bordes son donde aparecen los errores." }
    escalera: ["¿Dónde suele fallar un contador comparado con un valor?"]
    solucion: "Casos límite (cero, uno, el máximo) y la mitad: casi todos los errores viven en los bordes."

  - id: porque-observable
    tipo: porque
    titulo: "Lo observable"
    texto: "El banco mide el tiempo en alto de la salida, no el valor interno del contador. ¿Por qué?"
    libro: [178]
    widget:
      tipo: figura
      figura: fig-37.8
      zonas:
        - { id: comprobacion, rotulo: "Recuadro verde del centro", rect: [200, 74, 84, 62], texto: "Mide el tiempo en alto y hace assert = duty." }
    opciones:
      - { texto: "Para que siga valiendo si se rediseña el módulo", bien: true, porque: "No depende de la implementación: comprueba lo que el módulo promete." }
      - { texto: "Porque el contador no se puede leer en simulación", porque: "Se puede; precisamente no se hace, para no atarse a la implementación." }
      - { texto: "Porque es más rápido de simular", porque: "No es por velocidad: es para que el banco sobreviva a un rediseño." }
    escalera: ["¿Qué cambia si mañana el módulo cuenta hacia abajo?"]
    solucion: "Mide el comportamiento observable: así el banco sigue valiendo si se rediseña el módulo."

  - id: pregunta-banco
    tipo: pregunta
    titulo: "En el banco"
    texto: "El hábito que propone el libro es escribir el testbench antes que el módulo. ¿Qué gana con ello?"
    libro: [179, 187, 188]
    widget:
      tipo: figura
      figura: fig-37.8
      zonas:
        - { id: bueno, rotulo: "Recuadro verde de la derecha", rect: [300, 4, 147, 182], texto: "Se comprueba solo, cubre los límites, mide lo observable, termina y es determinista." }
    opciones:
      - { texto: "Definir qué se espera y poder repetir la prueba tras cada cambio", bien: true, porque: "Cuando el módulo pasa, está terminado; y se puede tocar un diseño grande sin miedo." }
      - { texto: "Un módulo más pequeño", porque: "El banco no se sintetiza: no cambia el tamaño del módulo." }
      - { texto: "Ahorrarse la simulación", porque: "Al contrario: el banco es la simulación." }
    escalera: ["¿Qué obliga a decidir escribir primero la prueba?"]
    solucion: "Obliga a definir qué se espera exactamente, y reejecutarlo tras cada cambio permite tocar el diseño sin miedo."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [164, 166, 170, 176]
    ideas:
      - { titulo: "El módulo.", texto: "Un proceso con rising_edge y la salida concurrente: sin latches." }
      - { titulo: "Sombra.", texto: "duty_r se carga con count a cero: el pulso en curso no se deforma." }
      - { titulo: "Verilog.", texto: "<= en secuenciales, = en combinacionales." }
      - { titulo: "Banco.", texto: "Se comprueba solo, cubre los límites, mide lo observable y termina." }
