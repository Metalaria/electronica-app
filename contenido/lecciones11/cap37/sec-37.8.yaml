# Lección 1.2 de la sección 38.8 «FPGA o Microcontrolador» (cap37; etiqueta interna sec-37.8).
# Formato: contenido/lecciones11/GUIA.md (§11). Figura 38.10 (svg_vista 450,72 × 184,32): las dos naturalezas y el
# criterio práctico. La tabla de decisión (bloque 235) se empareja con los ejemplos del propio libro.
leccion: cap37/sec-37.8

libro:
  222: "Una FPGA se convierte en el circuito"
  223: "Esa diferencia no es de velocidad sino de naturaleza"
  225: "Ocho canales de PWM independientes con resolución de nanosegundos"
  226: "Cuando el requisito es «responder en menos de 100 ns, sin excepciones», la FPGA es la respuesta."
  227: "Un sensor con un protocolo raro, un bus antiguo"
  228: "Procesar un flujo continuo de megamuestras por segundo con filtros digitales"
  231: "Una máquina de estados con cien casos, una pila de red, un sistema de ficheros"
  232: "una FPGA basada en SRAM consume permanentemente por sus fugas y por mantener la configuración"
  235: "Temporización garantizada en nanosegundos"
  238: "La FPGA se ocupa de lo paralelo y lo temporalmente estricto"
  239: "un microcontrolador implementado con sus propias LUT"
  241: "Un problema que en C se resuelve en dos días puede llevar dos semanas en HDL"
  242: "usar microcontrolador siempre que sea posible, y FPGA cuando el microcontrolador no pueda"
  244: "medir cuánto tarda poniendo una salida en alto al empezar y en bajo al terminar"
  245: "evita descubrir a mitad de proyecto que la elección era equivocada"
  246: "FPGA frente a microcontrolador con el criterio práctico de elección."

modelo:
  valores: {}
  calculos: {}

tarjetas:
  - id: explore-dos-naturalezas
    tipo: explorar
    titulo: "Dos naturalezas"
    texto: "Toque los dos recuadros de arriba: lo que cada uno hace bien y lo que cuesta. La diferencia no es de velocidad sino de naturaleza."
    libro: [222, 223, 246]
    widget:
      tipo: figura
      figura: fig-37.10
      zonas:
        - { id: fpga, rotulo: "Recuadro de arriba a la izquierda", rect: [4, 4, 216, 100], texto: "FPGA: paralelismo, determinismo, interfaces no estándar y caudal. A cambio, más cara, compleja y consume siempre." }
        - { id: micro, rotulo: "Recuadro de arriba a la derecha", rect: [231, 4, 216, 100], texto: "Microcontrolador: decisiones complejas, comunicaciones, bajo consumo y coste. A cambio, una cosa después de otra." }
    requiere: { mover: [fpga, micro] }

  - id: prediga-100ns
    tipo: predecir
    titulo: "Sin excepciones"
    texto: "Un sistema debe responder en menos de 100 ns, siempre, sin excepciones. ¿Qué elige?"
    libro: [226]
    widget:
      tipo: figura
      figura: fig-37.10
      zonas:
        - { id: criterio, rotulo: "Recuadro de abajo", rect: [5, 111, 442, 68], texto: "Microcontrolador siempre que sea posible; FPGA cuando no pueda." }
    opciones:
      - { texto: "Una FPGA", bien: true, porque: "Una operación tarda exactamente los ciclos que tarda, siempre: determinismo temporal." }
      - { texto: "Un microcontrolador rápido", porque: "Una interrupción puede retrasar cualquier cosa: «sin excepciones» no lo garantiza." }
      - { texto: "Un ordenador con sistema operativo", porque: "Con sistema operativo el retraso posible es todavía mayor." }
    escalera: ["¿Qué puede retrasar una respuesta en un microcontrolador?"]
    solucion: "Una FPGA: determinismo temporal, sin interrupciones que retrasen nada."

  - id: empareje-tabla
    tipo: pregunta
    fase: "Empareje"
    titulo: "La tabla de decisión"
    texto: "Una cada caso con su elección y el motivo."
    libro: [225, 227, 228, 231, 235]
    emparejar:
      - ["Ocho canales de PWM independientes", "FPGA: paralelismo real"]
      - ["Un sensor con un protocolo raro", "FPGA: interfaz no estándar"]
      - ["Filtrar megamuestras por segundo", "FPGA: procesado de flujo"]
      - ["Una pila de red", "Micro: comunicaciones"]
      - ["Una máquina de estados con cien casos", "Micro: lógica de decisión compleja"]
    exito: "Lo paralelo, lo estricto y lo raro, a la FPGA; lo secuencial y complejo, al micro."
    pistas:
      - { texto: "Lo que en C se escribe en una tarde es del microcontrolador." }
    escalera: ["Pregúntese en cada caso: ¿hace falta que muchas cosas ocurran a la vez?"]
    solucion: "PWM: paralelismo. Protocolo raro: interfaz. Megamuestras: caudal. Red y máquina de cien casos: micro."

  - id: porque-consumo
    tipo: porque
    titulo: "El consumo"
    texto: "Un microcontrolador duerme a microamperios. ¿Por qué una FPGA basada en SRAM no puede?"
    libro: [232]
    widget:
      tipo: figura
      figura: fig-37.10
      zonas:
        - { id: fpga, rotulo: "Recuadro de arriba a la izquierda", rect: [4, 4, 216, 100], texto: "A cambio: más cara, compleja, consume siempre." }
    opciones:
      - { texto: "Consume siempre por sus fugas y por mantener la configuración", bien: true, porque: "La SRAM de configuración tiene que seguir alimentada para que la FPGA siga siendo el circuito." }
      - { texto: "Porque funciona a más frecuencia", porque: "Aunque el reloj se pare, las fugas y la configuración siguen consumiendo." }
      - { texto: "Sí puede, igual que el micro", porque: "Si pierde la alimentación pierde la configuración: no hay un modo de dormir equivalente." }
    escalera: ["¿Qué pasa con la configuración en SRAM si se corta la alimentación?"]
    solucion: "Consume permanentemente por sus fugas y por mantener la configuración."

  - id: pregunta-criterio
    tipo: pregunta
    titulo: "El criterio práctico"
    texto: "Por el coste de desarrollo, ¿qué recomienda el libro entre FPGA y microcontrolador?"
    libro: [241, 242]
    widget:
      tipo: figura
      figura: fig-37.10
      zonas:
        - { id: criterio, rotulo: "Recuadro de abajo", rect: [5, 111, 442, 68], texto: "Los cuatro «no puede»: paralelismo, determinismo, interfaz y caudal." }
    opciones:
      - { texto: "Microcontrolador siempre que sea posible, FPGA cuando no pueda", bien: true, porque: "Dos días en C pueden ser dos semanas en HDL: eso supera el coste del componente." }
      - { texto: "FPGA siempre, por su paralelismo", porque: "El paralelismo solo compensa cuando hace falta: el desarrollo es mucho más lento." }
      - { texto: "FPGA si el volumen es alto", porque: "En un proyecto pequeño domina el tiempo de desarrollo, no el componente." }
    escalera: ["¿Qué domina el coste en un proyecto pequeño?"]
    solucion: "Microcontrolador siempre que sea posible; FPGA para paralelismo, determinismo, interfaz o caudal."

  - id: pregunta-reparto
    tipo: pregunta
    titulo: "Las dos a la vez"
    texto: "Un sistema usa FPGA y procesador. ¿Qué parte se lleva el procesador?"
    libro: [238, 239]
    widget:
      tipo: figura
      figura: fig-37.10
      zonas:
        - { id: micro, rotulo: "Recuadro de arriba a la derecha", rect: [231, 4, 216, 100], texto: "Decisiones, comunicaciones, ficheros." }
    opciones:
      - { texto: "Decisiones, configuración, comunicación e interfaz de usuario", bien: true, porque: "Lo secuencial y lo complejo; la FPGA, lo paralelo y lo estricto." }
      - { texto: "La adquisición y el filtrado", porque: "Eso es paralelo y temporalmente estricto: va a la FPGA." }
      - { texto: "La generación de señales", porque: "También es de la FPGA: tiempos estrictos." }
    escalera: ["Al procesador le toca lo que se hace una cosa después de otra."]
    solucion: "El procesador, lo secuencial y complejo; la FPGA, adquisición, señales, filtrado e interfaces rápidas."

  - id: pregunta-procesador-blando
    tipo: pregunta
    titulo: "Sin un chip aparte"
    texto: "¿Cómo se llama un microcontrolador implementado con las propias LUT de la FPGA?"
    libro: [239]
    widget:
      tipo: figura
      figura: fig-37.10
      zonas:
        - { id: criterio, rotulo: "Recuadro de abajo", rect: [5, 111, 442, 68], texto: "Y a menudo los dos." }
    opciones:
      - { texto: "Un procesador blando", bien: true, porque: "Se encarga de la parte secuencial sin necesidad de un chip aparte." }
      - { texto: "Un SoC FPGA", porque: "En un SoC FPGA el procesador ARM es de silicio, junto a la lógica programable." }
      - { texto: "Un CPLD", porque: "Un CPLD es otro dispositivo de lógica programable, no un procesador." }
    escalera: ["¿Está hecho de silicio propio o de la lógica configurable?"]
    solucion: "Un procesador blando: un microcontrolador hecho con las LUT de la FPGA."

  - id: pregunta-banco
    tipo: pregunta
    titulo: "En el banco"
    texto: "Escribe el fragmento crítico para el microcontrolador, mide su duración con un pin y sale justo. ¿Qué concluye?"
    libro: [244, 245]
    widget:
      tipo: figura
      figura: fig-37.10
      zonas:
        - { id: micro, rotulo: "Recuadro de arriba a la derecha", rect: [231, 4, 216, 100], texto: "Secuencial: una cosa después de otra." }
    opciones:
      - { texto: "No bastará en cuanto el programa crezca", bien: true, porque: "Con margen sobrado, el micro basta; justo, no. Mejor saberlo antes de comprometerse." }
      - { texto: "Basta: si cumple hoy, cumplirá siempre", porque: "Al crecer el programa aparecen más tareas e interrupciones: lo justo deja de cumplir." }
      - { texto: "La medida no sirve sin osciloscopio de alta gama", porque: "Basta un pin en alto al empezar y en bajo al terminar." }
    escalera: ["¿Qué le pasa al tiempo disponible cuando se añaden tareas?"]
    solucion: "Si está justo, no bastará en cuanto el programa crezca: mejor elegir FPGA, o los dos, desde el principio."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [223, 235, 238, 242]
    ideas:
      - { titulo: "Naturaleza.", texto: "La FPGA es el circuito; el micro ejecuta en secuencia." }
      - { titulo: "Los cuatro «no puede».", texto: "Paralelismo, determinismo, interfaz y caudal: FPGA." }
      - { titulo: "Criterio.", texto: "Micro siempre que se pueda: el desarrollo en HDL cuesta mucho más." }
      - { titulo: "Las dos.", texto: "FPGA para lo paralelo y estricto; procesador para lo secuencial." }
