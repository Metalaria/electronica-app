# Lección 1.2 de la sección 38.8 «FPGA o Microcontrolador» (cap37; etiqueta interna sec-37.8).
# Formato: contenido/lecciones11/GUIA.md (§11). Figura 38.10 (svg_vista 450,72 × 184,32): las dos naturalezas y el
# criterio práctico. La tabla de decisión (bloque 235) se empareja con los ejemplos del propio libro.
# 1.2.1 («aprender haciendo», GUIA §13): el paralelismo se explora con tres canales del mismo reloj llevados con pulsos
# (objetivo sobre el contador y el LED); los casos del libro (100 ns sin excepciones, el protocolo raro, la máquina de
# cien casos, dormir a microamperios) se tocan en el lado de la figura 38.10 que los resuelve. Quedan dos preguntas de
# opciones: el criterio práctico y la medida del banco. El reparto y el procesador blando van en el resumen.
leccion: cap37/sec-37.8

libro:
  222: "Una FPGA se convierte en el circuito"
  223: "Esa diferencia no es de velocidad sino de naturaleza"
  225: "Ocho canales de PWM independientes con resolución de nanosegundos"
  226: "Cuando el requisito es «responder en menos de 100 ns, sin excepciones», la FPGA es la respuesta."
  227: "Un sensor con un protocolo raro, un bus antiguo"
  228: "Procesar un flujo continuo de megamuestras por segundo con filtros digitales"
  231: "Una máquina de estados con cien casos, una pila de red, un sistema de ficheros"
  232: "una FPGA basada en SRAM consume permanentemente por sus fugas y por mantener la configuración"
  235: "Temporización garantizada en nanosegundos"
  238: "La FPGA se ocupa de lo paralelo y lo temporalmente estricto"
  239: "un microcontrolador implementado con sus propias LUT"
  241: "Un problema que en C se resuelve en dos días puede llevar dos semanas en HDL"
  242: "usar microcontrolador siempre que sea posible, y FPGA cuando el microcontrolador no pueda"
  244: "medir cuánto tarda poniendo una salida en alto al empezar y en bajo al terminar"
  245: "evita descubrir a mitad de proyecto que la elección era equivocada"
  246: "FPGA frente a microcontrolador con el criterio práctico de elección."

modelo:
  valores: {}
  calculos: {}

tarjetas:
  - id: explore-dos-naturalezas
    tipo: explorar
    titulo: "Todo a la vez"
    texto: "Dos canales del mismo reloj en una FPGA: un contador y un biestable que conmuta. Dé pulsos hasta tener el contador en su cuenta máxima y S encendida."
    libro: [222, 223, 225]
    widget:
      tipo: logica
      entradas: [{ id: CLK, reloj: true }]
      piezas:
        - { id: c1, tipo: contador, bits: 2, entradas: [CLK], rotulo: "Canal A" }
        - { id: t1, tipo: t, entradas: ["1", CLK], rotulo: "Canal B" }
      salidas:
        - { id: Q1, de: c1.q1 }
        - { id: Q0, de: c1.q0 }
        - { id: S, de: t1.q }
    objetivo:
      condiciones:
        - { contador: c1, valor: 3, rotulo: "Contador al máximo" }
        - { led: S, valor: 1, rotulo: "S encendida" }
      logrado: "Los dos canales avanzan en el mismo flanco, sin turnos. Un microcontrolador los atendería uno tras otro."
      pistas:
        - { texto: "Cada pulso mueve los dos canales a la vez." }
    escalera: ["El contador sube uno por pulso; S cambia en cada pulso."]
    solucion: "Tres pulsos de reloj."

  - id: prediga-100ns
    tipo: tocar
    titulo: "Sin excepciones"
    texto: "Un sistema debe responder en menos de 100 ns, siempre, sin excepciones. Toque el lado que lo garantiza."
    libro: [226]
    widget:
      tipo: figura
      figura: fig-37.10
      zonas:
        - { id: fpga, rotulo: "Recuadro de arriba a la izquierda", rect: [4, 4, 216, 100] }
        - { id: micro, rotulo: "Recuadro de arriba a la derecha", rect: [231, 4, 216, 100] }
    tocar:
      bien: [fpga]
      porque:
        micro: "Una interrupción puede retrasar cualquier cosa: «sin excepciones» no se garantiza."
    exito: "En una FPGA una operación tarda exactamente los ciclos que tarda, siempre: determinismo temporal."
    escalera: ["¿Qué puede retrasar una respuesta en un microcontrolador?"]
    solucion: "Arriba a la izquierda: la FPGA."

  - id: empareje-tabla
    tipo: tocar
    titulo: "Un protocolo raro"
    texto: "Un sensor habla un protocolo raro que ningún periférico conoce. Toque el lado que lo resuelve."
    libro: [227, 228, 235, 246]
    widget:
      tipo: figura
      figura: fig-37.10
      zonas:
        - { id: fpga, rotulo: "Recuadro de arriba a la izquierda", rect: [4, 4, 216, 100] }
        - { id: micro, rotulo: "Recuadro de arriba a la derecha", rect: [231, 4, 216, 100] }
    tocar:
      bien: [fpga]
      porque:
        micro: "Está limitado a los periféricos que trae."
    exito: "La FPGA implementa el hardware que haga falta: interfaz no estándar, uno de sus cuatro casos."
    escalera: ["¿Quién puede fabricarse el periférico que falta?"]
    solucion: "Arriba a la izquierda: la FPGA."

  - id: toque-cien-casos
    tipo: tocar
    titulo: "Cien casos"
    texto: "Una máquina de estados con cien casos, una pila de red y un sistema de ficheros. Toque el lado que los escribe en una tarde."
    libro: [231, 235]
    widget:
      tipo: figura
      figura: fig-37.10
      zonas:
        - { id: fpga, rotulo: "Recuadro de arriba a la izquierda", rect: [4, 4, 216, 100] }
        - { id: micro, rotulo: "Recuadro de arriba a la derecha", rect: [231, 4, 216, 100] }
    tocar:
      bien: [micro]
      porque:
        fpga: "En HDL eso es una pesadilla: lo secuencial y complejo no es lo suyo."
    exito: "En C se escribe en una tarde: lógica de decisión compleja y comunicaciones, territorio del microcontrolador."
    escalera: ["¿Qué se escribe mejor como una cosa después de otra?"]
    solucion: "Arriba a la derecha: el microcontrolador."

  - id: porque-consumo
    tipo: tocar
    titulo: "El consumo"
    texto: "El equipo pasa casi todo el tiempo dormido y debe gastar microamperios. Toque el lado que lo consigue."
    libro: [232]
    widget:
      tipo: figura
      figura: fig-37.10
      zonas:
        - { id: fpga, rotulo: "Recuadro de arriba a la izquierda", rect: [4, 4, 216, 100] }
        - { id: micro, rotulo: "Recuadro de arriba a la derecha", rect: [231, 4, 216, 100] }
    tocar:
      bien: [micro]
      porque:
        fpga: "Basada en SRAM, consume siempre por sus fugas y por mantener la configuración."
    exito: "El microcontrolador duerme a microamperios; la FPGA no puede, porque su configuración tiene que seguir alimentada."
    escalera: ["¿Cuál pierde su configuración si se corta la alimentación?"]
    solucion: "Arriba a la derecha: el microcontrolador."

  - id: pregunta-criterio
    tipo: pregunta
    titulo: "El criterio práctico"
    texto: "Por el coste de desarrollo, ¿qué recomienda el libro entre FPGA y microcontrolador?"
    libro: [241, 242]
    widget:
      tipo: figura
      figura: fig-37.10
      zonas:
        - { id: criterio, rotulo: "Recuadro de abajo", rect: [5, 111, 442, 68], texto: "Los cuatro «no puede»: paralelismo, determinismo, interfaz y caudal." }
    opciones:
      - { texto: "Microcontrolador siempre que sea posible, FPGA cuando no pueda", bien: true, porque: "Dos días en C pueden ser dos semanas en HDL: eso supera el coste del componente." }
      - { texto: "FPGA siempre, por su paralelismo", porque: "El paralelismo solo compensa cuando hace falta: el desarrollo es mucho más lento." }
      - { texto: "FPGA si el volumen es alto", porque: "En un proyecto pequeño domina el tiempo de desarrollo, no el componente." }
    escalera: ["¿Qué domina el coste en un proyecto pequeño?"]
    solucion: "Microcontrolador siempre que sea posible; FPGA para paralelismo, determinismo, interfaz o caudal."

  - id: pregunta-banco
    tipo: pregunta
    titulo: "En el banco"
    texto: "Escribe el fragmento crítico para el microcontrolador, mide su duración con un pin y sale justo. ¿Qué concluye?"
    libro: [244, 245]
    widget:
      tipo: figura
      figura: fig-37.10
      zonas:
        - { id: micro, rotulo: "Recuadro de arriba a la derecha", rect: [231, 4, 216, 100], texto: "Secuencial: una cosa después de otra." }
    opciones:
      - { texto: "No bastará en cuanto el programa crezca", bien: true, porque: "Con margen sobrado, el micro basta; justo, no. Mejor saberlo antes de comprometerse." }
      - { texto: "Basta: si cumple hoy, cumplirá siempre", porque: "Al crecer el programa aparecen más tareas e interrupciones: lo justo deja de cumplir." }
      - { texto: "La medida no sirve sin osciloscopio de alta gama", porque: "Basta un pin en alto al empezar y en bajo al terminar." }
    escalera: ["¿Qué le pasa al tiempo disponible cuando se añaden tareas?"]
    solucion: "Si está justo, no bastará en cuanto el programa crezca: mejor elegir FPGA, o los dos, desde el principio."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [223, 235, 238, 239, 242]
    ideas:
      - { titulo: "Naturaleza.", texto: "La FPGA es el circuito; el micro ejecuta en secuencia." }
      - { titulo: "Los cuatro «no puede».", texto: "Paralelismo, determinismo, interfaz y caudal: FPGA." }
      - { titulo: "Criterio.", texto: "Micro siempre que se pueda: el desarrollo en HDL cuesta mucho más." }
      - { titulo: "Las dos.", texto: "FPGA para lo paralelo y estricto; procesador, en SoC o blando, para lo secuencial." }
