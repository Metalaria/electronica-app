# Lección 1.2 de la sección 38.13 «Circuitos Integrados a Medida (ASIC): Cuándo Fabricar el Silicio» (cap37;
# etiqueta interna sec-37.13). Formato: contenido/lecciones11/GUIA.md (§11). El punto de equilibrio del bloque 507
# (NRE de 500 000 €, 2 € por unidad, FPGA de 30 €) va en el modelo y se mueve en la gráfica de la figura 38.19
# (svg_vista 435,53 × 227,52). Figura 38.20 (447,12 × 205,92) para el flujo.
leccion: cap37/sec-37.13

libro:
  484: "un ASIC —circuito integrado para una aplicación específica— se fabrica ya siendo el circuito"
  488: "Full-custom: cada transistor se dibuja a mano."
  489: "Standard cell: el diseño se sintetiza sobre una biblioteca de celdas predefinidas"
  490: "Gate array: obleas prefabricadas con transistores sin conectar"
  491: "Structured ASIC: un punto intermedio moderno"
  494: "Coste unitario en volumen"
  495: "esa misma función son cuatro transistores y una pista"
  498: "Se paga una vez, y no depende de cuántas unidades se fabriquen."
  501: "7 nm y por debajo"
  502: "Un controlador de electrodoméstico o un chip de audio se hacen en 180 o 130 nm"
  505: '"coste"_("FPGA") = N times "precio"_("FPGA")'
  506: '"coste"_("ASIC") = "NRE" + N times "coste"_("unitario")'
  507: "Con un NRE de 500 000 €, un coste unitario de 2 € y una FPGA equivalente de 30 €:"
  508: 'N = "17 900" space "unidades"'
  509: "hay que hacerlo con el volumen realista de toda la vida del producto"
  511: "Un ASIC tarda de seis a dieciocho meses desde el diseño terminado hasta tener piezas."
  512: "Un respin cuesta buena parte del NRE otra vez"
  513: "Un ASIC en el campo no se actualiza."
  514: "un ASIC propio no se descataloga"
  519: "en un ASIC hay que diseñarla"
  521: "Sin eso, un chip no se puede probar en producción"
  523: "A partir de ese momento no hay marcha atrás."
  527: "un 100 % de cobertura dice que todo lo previsto se ha ejercitado, no que todo esté bien"
  529: "para ejecutarlo miles de veces más rápido que en simulación"
  530: "no ser el producto, sino el prototipo del producto"
  533: "sintetizarlo contra una biblioteca de celdas estándar libre"
  534: "Punto de equilibrio entre ASIC y FPGA"
  535: "El flujo de diseño de un ASIC y en qué se aparta del de una FPGA."

modelo:
  valores:
    NRE: { sim: "NRE", nombre: "coste no recurrente", unidad: "€", valor: 500000 }
    c_u: { sim: "coste_{unitario}", nombre: "coste unitario del ASIC", unidad: "€", valor: 2 }
    p_f: { sim: "precio_{FPGA}", nombre: "precio de la FPGA", unidad: "€", valor: 30 }
    N: { sim: "N", nombre: "unidades", valor: 40000 }
  calculos:
    coste_f: { expr: "N*p_f", sim: "coste_{FPGA}", nombre: "coste con FPGA", unidad: "€" }
    coste_a: { expr: "NRE + N*c_u", sim: "coste_{ASIC}", nombre: "coste con ASIC", unidad: "€" }
    N_eq: { expr: "NRE/(p_f - c_u)", nombre: "unidades del punto de equilibrio", cifras: 3 }
    ahorro: { expr: "p_f - c_u", nombre: "ahorro por unidad con el ASIC", unidad: "€" }

tarjetas:
  - id: empareje-grados
    tipo: pregunta
    fase: "Empareje"
    titulo: "Cuatro grados de personalización"
    texto: "Un ASIC se fabrica ya siendo el circuito, pero no todos igual. Una cada grado con lo que es."
    libro: [484, 488, 489, 490, 491]
    emparejar:
      - ["Full-custom", "Cada transistor dibujado a mano"]
      - ["Standard cell", "Síntesis sobre una biblioteca de celdas predefinidas"]
      - ["Gate array", "Transistores prefabricados; solo se personaliza el metal"]
      - ["Structured ASIC", "Bloques predefinidos y pocas capas personalizadas"]
    exito: "Standard cell es lo habitual hoy: su flujo se parece al de una FPGA hasta colocar."
    pistas:
      - { texto: "El gate array ya tiene los transistores en la oblea: falta conectarlos." }
    escalera: ["Full-custom es el máximo esfuerzo: nada predefinido."]
    solucion: "Full-custom: a mano. Standard cell: biblioteca. Gate array: solo metal. Structured: bloques y pocas capas."

  - id: prediga-mejora
    tipo: predecir
    titulo: "De dónde sale la mejora"
    texto: "Frente a la FPGA, un ASIC va de 3 a 5 veces más rápido y consume de 5 a 20 veces menos. ¿Por qué?"
    libro: [494, 495]
    widget:
      tipo: figura
      figura: fig-37.5
      zonas:
        - { id: celda, rotulo: "Recuadro de la derecha", rect: [283, 22, 163, 170], texto: "Una celda de FPGA: LUT, multiplexores y flip-flop, con su interconexión programable." }
    opciones:
      - { texto: "La función son cuatro transistores y una pista, sin LUT ni conmutadores", bien: true, porque: "En la FPGA la señal atraviesa conmutadores con su resistencia y su capacidad." }
      - { texto: "Porque el ASIC usa un reloj más rápido", porque: "Llega a más frecuencia porque sus caminos son más cortos, no al revés." }
      - { texto: "Porque el ASIC se fabrica en un nodo mejor", porque: "La comparación es con la misma función; la diferencia es la configurabilidad." }
    escalera: ["¿Qué tiene una FPGA que un ASIC no necesita?"]
    solucion: "En el ASIC, la función son cuatro transistores y una pista; en la FPGA, una LUT con su interconexión programable."

  - id: explore-equilibrio
    tipo: explorar
    titulo: "La intersección que decide"
    texto: "Toque la gráfica y el recuadro del plazo: el coste decide mucho, pero no todo."
    libro: [511, 534]
    widget:
      tipo: figura
      figura: fig-37.19
      zonas:
        - { id: grafica, rotulo: "Gráfica de la izquierda", rect: [0, 5, 237, 213], texto: "La recta de la FPGA sale del origen; la del ASIC, del NRE. Se cruzan en el punto de equilibrio." }
        - { id: plazo, rotulo: "Primer recuadro de la derecha", rect: [249, 20, 183, 45], texto: "El plazo: de seis a dieciocho meses hasta tener piezas; una FPGA, esa misma tarde." }
    requiere: { mover: [grafica, plazo] }

  - id: formula-equilibrio
    tipo: formula
    titulo: "Dos rectas"
    texto: "La FPGA cuesta lo mismo cada unidad; el ASIC paga el NRE una vez. Mueva las unidades y compare."
    libro: [498, 505, 506, 509, 534]
    ec: 506
    sustitucion: "{{NRE}} + {{N}} × {{c_u}} = {{coste_a}}, frente a {{N}} × {{p_f}} = {{coste_f}}"
    widget:
      tipo: grafica
      x: { id: nn, min: 0, max: 60000, rotulo: "unidades" }
      y: { min: 0, max: 1800000, unidad: "€", rotulo: "coste total" }
      curvas:
        - { expr: "nn*p_f", color: azul, rotulo: "FPGA" }
        - { expr: "NRE + nn*c_u", color: naranja, rotulo: "ASIC" }
      asas:
        - { mueve: N, x: "N", y: "coste_a", rotulo: "Su volumen (ASIC)" }
      lectura: { valor: coste_a, rotulo: "Coste con ASIC" }
      datos:
        - { valor: coste_f, rotulo: "Con FPGA: {{coste_f}}" }
      mandos:
        - { valor: N, min: 0, max: 60000, paso: 500, rotulo: "Unidades, N" }

  - id: estime-equilibrio
    tipo: pregunta
    fase: "Estime"
    titulo: "El punto de equilibrio"
    texto: "NRE de 500 000 €, 2 € por unidad y una FPGA equivalente de 30 €. ¿A partir de cuántas unidades sale más barato el ASIC?"
    libro: [507, 508]
    estimar:
      objetivo: "N_eq"
      min: 0
      max: 60000
      paso: 100
      inicio: 40000
      tol: 0.02
      rotulo: "Unidades"
    exito: "Unas 17 900 unidades: por debajo gana la FPGA; por encima, el ASIC."
    pistas:
      - { cuando: { valor: estimacion, mayor: 18300 }, texto: "Se ha pasado: cada unidad ahorra 28 € con el ASIC; ¿cuántas hacen falta para pagar el NRE?" }
      - { texto: "Se ha quedado corto: con tan pocas unidades el NRE no se ha amortizado." }
    escalera: ["Iguale N × 30 = 500 000 + N × 2 y despeje N."]
    solucion: "N = 500 000 / (30 − 2) ≈ 17 900 unidades."
    comprobar:
      - { N_eq: 17857, tol: 0.001, ahorro: 28 }
      - { con: { N: 1 }, coste_f: 30, coste_a: 500002 }

  - id: pregunta-nodo
    tipo: pregunta
    titulo: "El nodo"
    texto: "Un chip de audio o un controlador de electrodoméstico se hace en ASIC. ¿En qué nodo?"
    libro: [501, 502]
    widget:
      tipo: figura
      figura: fig-37.19
      zonas:
        - { id: grafica, rotulo: "Gráfica de la izquierda", rect: [0, 5, 237, 213], texto: "El NRE es la ordenada en el origen de la recta del ASIC." }
    opciones:
      - { texto: "En 180 o 130 nm", bien: true, porque: "Las máscaras son asequibles y el silicio es maduro y barato." }
      - { texto: "En el nodo más avanzado posible", porque: "En 7 nm y por debajo, el juego de máscaras ya cuesta decenas de millones." }
      - { texto: "Da igual: el nodo no cambia el coste", porque: "El NRE depende mucho del nodo: es lo que decide." }
    escalera: ["¿Qué pasa con el precio de las máscaras al avanzar de nodo?"]
    solucion: "En 180 o 130 nm: la mayoría de los ASIC no se fabrican en el nodo más avanzado."

  - id: toque-respin
    tipo: tocar
    titulo: "Un error en el silicio"
    texto: "El chip sale de fábrica con un error funcional. Toque lo que cuesta corregirlo."
    libro: [511, 512, 513, 514, 534]
    widget:
      tipo: figura
      figura: fig-37.19
      zonas:
        - { id: plazo, rotulo: "Primer recuadro de la derecha", rect: [249, 20, 183, 45] }
        - { id: respin, rotulo: "Segundo recuadro de la derecha", rect: [249, 71, 183, 44] }
        - { id: cambiar, rotulo: "Tercer recuadro de la derecha", rect: [249, 121, 183, 44] }
        - { id: obsolescencia, rotulo: "Cuarto recuadro de la derecha", rect: [249, 170, 183, 45] }
    tocar:
      bien: [respin]
      porque:
        plazo: "El plazo es el de cualquier fabricación; el coste del error es repetirla."
        cambiar: "Lo que se previó configurable se arregla en el campo; un error funcional del silicio, no."
        obsolescencia: "Es una ventaja del ASIC: no se descataloga."
    exito: "Un respin: máscaras nuevas y otro ciclo completo, buena parte del NRE otra vez."
    escalera: ["¿Qué hay que volver a fabricar?"]
    solucion: "El riesgo de respin: nuevas máscaras y otro ciclo completo."

  - id: ordene-flujo
    tipo: pregunta
    fase: "Ordene"
    titulo: "Después de la síntesis"
    texto: "Hasta la síntesis, el flujo es como el de una FPGA. Ordene lo que viene después."
    libro: [519, 521, 523, 535]
    ordenar:
      - "Floorplan: dónde va cada bloque."
      - "Colocar y encaminar: las pistas se crean."
      - "Síntesis del árbol de reloj."
      - "Parásitos y tiempos en varias esquinas."
      - "Lógica de prueba: cadenas de exploración."
      - "Verificación física."
      - "Tape-out: los ficheros al fabricante."
    exito: "Tras el tape-out no hay marcha atrás."
    pistas:
      - { texto: "El tape-out es lo último: entregar los ficheros." }
    escalera: ["Antes de encaminar hay que decidir dónde va cada bloque."]
    solucion: "Floorplan, colocar y encaminar, árbol de reloj, parásitos y tiempos, prueba, verificación física y tape-out."

  - id: pregunta-arbol-reloj
    tipo: pregunta
    titulo: "El reloj, a medida"
    texto: "En una FPGA el reloj viaja por una red dedicada ya construida. ¿Y en un ASIC?"
    libro: [519, 535]
    widget:
      tipo: figura
      figura: fig-37.20
      zonas:
        - { id: como-fpga, rotulo: "Fila de arriba", rect: [0, 5, 305, 45], texto: "Del HDL a la síntesis, como en una FPGA." }
    opciones:
      - { texto: "Hay que diseñar el árbol, con amplificadores intercalados", bien: true, porque: "Para que el desfase entre biestables sea admisible." }
      - { texto: "Lo pone el fabricante igual para todos", porque: "Cada chip tiene sus biestables en otro sitio: el árbol se diseña para él." }
      - { texto: "No hace falta: el reloj llega a la vez", porque: "Llegar a la vez es justo lo que hay que conseguir, diseñándolo." }
    escalera: ["Si no hay nada construido de antemano, ¿quién lo construye?"]
    solucion: "Se sintetiza el árbol de reloj, con sus amplificadores, para limitar el desfase."

  - id: porque-cobertura
    tipo: porque
    titulo: "El 100 % de cobertura"
    texto: "Los bancos de pruebas alcanzan el 100 % de cobertura. ¿Por qué no garantiza que el chip esté bien?"
    libro: [527]
    widget:
      tipo: figura
      figura: fig-37.20
      zonas:
        - { id: tapeout, rotulo: "Recuadro rojo de abajo", rect: [226, 156, 106, 45], texto: "Tape-out: no hay marcha atrás." }
    opciones:
      - { texto: "Dice que se ha ejercitado todo lo previsto; lo que nadie previó no aparece", bien: true, porque: "Una situación que no está en la lista nunca aparece como hueco." }
      - { texto: "Porque la cobertura se mide mal", porque: "Se mide bien; su límite es que solo mide lo que se pensó medir." }
      - { texto: "Sí lo garantiza", porque: "No: todo lo previsto se ha ejercitado, no que todo esté bien." }
    escalera: ["¿Quién escribe la lista de situaciones que mide la cobertura funcional?"]
    solucion: "Un 100 % dice que todo lo previsto se ha ejercitado, no que todo esté bien."

  - id: pregunta-emulacion
    tipo: pregunta
    titulo: "La FPGA como prototipo"
    texto: "Antes del tape-out, el diseño del ASIC se implementa en una o varias FPGA grandes. ¿Para qué?"
    libro: [529, 530]
    widget:
      tipo: figura
      figura: fig-37.20
      zonas:
        - { id: emulacion, rotulo: "Recuadro verde de abajo a la derecha", rect: [339, 156, 104, 45], texto: "El diseño en una FPGA grande, con software real, antes de fabricar." }
    opciones:
      - { texto: "Para ejecutarlo miles de veces más rápido que en simulación, con software real", bien: true, porque: "Una de las funciones más importantes de las FPGA: ser el prototipo del producto." }
      - { texto: "Para venderlo mientras llega el ASIC", porque: "No es el producto: es el prototipo, para verificar." }
      - { texto: "Para medir el consumo del ASIC", porque: "La FPGA consume otra cosa; lo que da es velocidad de verificación." }
    escalera: ["¿Qué es lento en la verificación de un chip grande?"]
    solucion: "Emular: miles de veces más rápido que simular, y con software real antes de fabricar."

  - id: pregunta-banco
    tipo: pregunta
    titulo: "En el banco"
    texto: "Sintetiza el generador de PWM contra una biblioteca de celdas estándar libre. ¿Qué compara con la versión en FPGA?"
    libro: [533]
    widget:
      tipo: figura
      figura: fig-37.20
      zonas:
        - { id: como-fpga, rotulo: "Fila de arriba", rect: [0, 5, 305, 45], texto: "Hasta la síntesis, a celdas estándar." }
    opciones:
      - { texto: "Celdas, área y frecuencia", bien: true, porque: "Es la forma más directa de ver de dónde salen los factores de la tabla." }
      - { texto: "El número de LUT", porque: "En celdas estándar no hay LUT: hay celdas con su área." }
      - { texto: "El tiempo de tape-out", porque: "No se fabrica nada: se mira el informe de síntesis." }
    escalera: ["¿Qué dice el informe de una síntesis a celdas?"]
    solucion: "Cuántas celdas, cuánta área y qué frecuencia, frente a la misma función en FPGA."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [495, 506, 512, 527]
    ideas:
      - { titulo: "ASIC.", texto: "Se fabrica siendo el circuito: más rápido, menos consumo y menos área." }
      - { titulo: "Equilibrio.", texto: "NRE + N × coste unitario frente a N × precio de la FPGA." }
      - { titulo: "Lo que no sale en la cuenta.", texto: "Plazo, respin y que no se puede cambiar." }
      - { titulo: "Verificación.", texto: "Es el verdadero proyecto; la FPGA hace de prototipo." }
