# Lección 1.2 de la sección 38.7 «El Flujo de Diseño» (cap37; etiqueta interna sec-37.7).
# Formato: contenido/lecciones11/GUIA.md (§11). Figura 38.9 (svg_vista 450,72 × 216,72): las siete etapas, las
# restricciones y los informes.
# 1.2.1 («aprender haciendo», GUIA §13): en la figura 38.9 se tocan la síntesis, las dos etapas lentas, el recuadro que
# explica el fallo sin reloj declarado, la etapa que empeora con el analizador integrado y el informe del latch. Quedan
# dos preguntas de opciones: el análisis estático y el hábito del banco. El orden de las etapas está numerado en la
# figura y no se pregunta; las restricciones van en los textos. La exploración es el latch que avisa la síntesis
# (pieza «latch»): guardar un uno con EN apagada.
leccion: cap37/sec-37.7

libro:
  194: "Descripción en HDL, más las restricciones: reloj, asignación de pines, requisitos temporales."
  195: "las etapas 4 y 5 son las lentas, de minutos a horas en diseños grandes, porque encaminar es un problema de optimización difícil"
  197: "sin restricciones, la herramienta no sabe qué se pretende"
  198: "Sin ella, la herramienta no comprueba tiempos y el diseño puede fallar en el dispositivo aunque «compile bien»."
  199: "Asignación de pines, con su estándar de tensión y su intensidad."
  200: "Restricciones de temporización entre dominios y en las entradas y salidas."
  201: "Falsos caminos y caminos multiciclo, que le dicen a la herramienta qué no debe optimizar"
  204: "Funcional: solo la lógica, rápida, para depurar el comportamiento."
  205: "revela problemas que la funcional no ve"
  206: "comprueba todos los caminos a la vez en lugar de solo los que la simulación ejercita"
  208: "un analizador lógico integrado"
  209: "instrumentar un diseño que va justo puede hacer que deje de cerrar"
  212: "los de latches inferidos (sección 28.4) y señales sin inicializar"
  213: "encaminar un dispositivo lleno es mucho más difícil"
  214: "El informe de tiempos, con el margen de los caminos críticos."
  215: "Ignorar los avisos es la fuente número uno de diseños que funcionan por casualidad."
  217: "compilar y cargar pronto, con una parte pequeña del diseño"
  218: "descubrir un problema de pines o de restricciones al principio"
  219: "El flujo de diseño en FPGA, el papel de las restricciones y los informes que hay que leer."

modelo:
  valores: {}
  calculos: {}

tarjetas:
  - id: explore-etapas
    tipo: tocar
    titulo: "Siete etapas"
    texto: "Toque la etapa que traduce el HDL a una red de puertas y biestables."
    libro: [194, 219]
    widget:
      tipo: figura
      figura: fig-37.9
      zonas:
        - { id: hdl, rotulo: "Primera caja", rect: [12, 37, 54, 54] }
        - { id: simulacion, rotulo: "Segunda caja", rect: [75, 37, 54, 54] }
        - { id: sintesis, rotulo: "Tercera caja", rect: [137, 37, 53, 54] }
        - { id: implementacion, rotulo: "Cuarta caja", rect: [199, 37, 53, 54] }
        - { id: analisis, rotulo: "Quinta caja", rect: [260, 37, 54, 54] }
        - { id: fichero, rotulo: "Sexta caja", rect: [322, 37, 54, 54] }
        - { id: carga, rotulo: "Séptima caja", rect: [384, 37, 54, 54] }
    tocar:
      bien: [sintesis]
      porque:
        hdl: "Es la descripción, con sus restricciones: reloj, pines y requisitos temporales."
        simulacion: "Comprueba la lógica sin tiempos reales; no traduce nada."
        implementacion: "Coloca y encamina lo que la síntesis ya ha traducido."
        analisis: "Comprueba los tiempos con los retardos reales."
        fichero: "Genera la configuración, al final."
        carga: "Carga y verifica en el dispositivo."
    exito: "La síntesis traduce; luego la implementación coloca en el dispositivo concreto y encamina las conexiones."
    escalera: ["Va justo después de comprobar la lógica."]
    solucion: "La tercera caja: síntesis."

  - id: porque-lentas
    tipo: tocar
    titulo: "Las etapas lentas"
    texto: "Dos etapas tardan de minutos a horas en diseños grandes. Tóquelas."
    libro: [195]
    widget:
      tipo: figura
      figura: fig-37.9
      zonas:
        - { id: hdl, rotulo: "Primera caja", rect: [12, 37, 54, 54] }
        - { id: simulacion, rotulo: "Segunda caja", rect: [75, 37, 54, 54] }
        - { id: sintesis, rotulo: "Tercera caja", rect: [137, 37, 53, 54] }
        - { id: implementacion, rotulo: "Cuarta caja", rect: [199, 37, 53, 54] }
        - { id: analisis, rotulo: "Quinta caja", rect: [260, 37, 54, 54] }
        - { id: fichero, rotulo: "Sexta caja", rect: [322, 37, 54, 54] }
        - { id: carga, rotulo: "Séptima caja", rect: [384, 37, 54, 54] }
    tocar:
      bien: [implementacion, analisis]
      todas: true
      porque:
        hdl: "Escribir es trabajo del diseñador, no de la herramienta."
        simulacion: "La funcional es rápida: solo la lógica."
        sintesis: "Traducir es rápido comparado con encaminar."
        fichero: "Generar el fichero es rápido."
        carga: "Cargar es cuestión de segundos."
    exito: "Colocar, encaminar y analizar: encaminar es un problema de optimización difícil."
    escalera: ["Lo difícil es encontrar caminos para todas las conexiones."]
    solucion: "La cuarta y la quinta: implementación y análisis temporal."

  - id: pregunta-sin-restricciones
    tipo: tocar
    titulo: "«Compila bien»"
    texto: "Un diseño se compila sin declarar la frecuencia de su reloj y falla en el dispositivo. Toque el recuadro que lo explica."
    libro: [197, 198, 199, 200, 201]
    widget:
      tipo: figura
      figura: fig-37.9
      zonas:
        - { id: restricciones, rotulo: "Recuadro de abajo a la izquierda", rect: [6, 128, 209, 82] }
        - { id: informes, rotulo: "Recuadro de abajo a la derecha", rect: [222, 128, 223, 82] }
    tocar:
      bien: [restricciones]
      porque:
        informes: "El informe de tiempos no avisa si no sabe qué frecuencia se pretende."
    exito: "Sin reloj declarado no se comprueban tiempos. Pines, dominios y falsos caminos también se declaran: sin restricciones, la herramienta no sabe qué se pretende."
    escalera: ["¿Qué le dice a la herramienta la frecuencia?"]
    solucion: "Abajo a la izquierda: las restricciones."

  - id: porque-analisis-estatico
    tipo: porque
    titulo: "Análisis en lugar de simulación"
    texto: "La simulación con retardos revela problemas que la funcional no ve. ¿Por qué la mayoría de los flujos la sustituye por el análisis estático?"
    libro: [204, 205, 206]
    widget:
      tipo: figura
      figura: fig-37.9
      zonas:
        - { id: analisis, rotulo: "Quinta caja", rect: [260, 37, 54, 54], texto: "Análisis temporal: todos los caminos." }
    opciones:
      - { texto: "Comprueba todos los caminos a la vez, no solo los que la simulación ejercita", bien: true, porque: "Una simulación solo mira los caminos que sus estímulos recorren." }
      - { texto: "Porque es más preciso con los retardos", porque: "Usa los mismos retardos; su ventaja es que no se deja caminos." }
      - { texto: "Porque la simulación con retardos no existe", porque: "Existe, pero es mucho más lenta y solo ve lo que se ejercita." }
    escalera: ["¿Qué caminos comprueba una simulación?"]
    solucion: "Comprueba todos los caminos a la vez, no solo los que la simulación ejercita."

  - id: prediga-analizador
    tipo: tocar
    titulo: "Medir modifica lo medido"
    texto: "A un diseño que cumple tiempos con poco margen se le añade un analizador lógico integrado. Toque la etapa cuyo resultado puede empeorar."
    libro: [208, 209]
    widget:
      tipo: figura
      figura: fig-37.9
      zonas:
        - { id: hdl, rotulo: "Primera caja", rect: [12, 37, 54, 54] }
        - { id: simulacion, rotulo: "Segunda caja", rect: [75, 37, 54, 54] }
        - { id: sintesis, rotulo: "Tercera caja", rect: [137, 37, 53, 54] }
        - { id: implementacion, rotulo: "Cuarta caja", rect: [199, 37, 53, 54] }
        - { id: analisis, rotulo: "Quinta caja", rect: [260, 37, 54, 54] }
        - { id: fichero, rotulo: "Sexta caja", rect: [322, 37, 54, 54] }
        - { id: carga, rotulo: "Séptima caja", rect: [384, 37, 54, 54] }
    tocar:
      bien: [analisis]
      porque:
        hdl: "El diseño sigue diciendo lo mismo: lo que cambia es lo que ocupa."
        simulacion: "La funcional no ve tiempos: no nota el analizador."
        sintesis: "Sintetiza igual, con un bloque más."
        implementacion: "Coloca y encamina, pero el veredicto lo da la etapa siguiente."
        fichero: "Se genera igual."
        carga: "Carga igual; el problema ya estaba antes."
    exito: "El analizador consume recursos y altera los tiempos: puede dejar de cerrar. Es la versión FPGA de que medir modifica lo medido."
    escalera: ["¿Qué etapa dice si el diseño cierra tiempos?"]
    solucion: "La quinta: el análisis temporal."

  - id: explore-latch
    tipo: explorar
    titulo: "El aviso que no se ignora"
    texto: "Esto es lo que deja la síntesis cuando avisa de un latch inferido. Consiga que guarde un uno con EN apagada."
    libro: [212, 215]
    widget:
      tipo: logica
      entradas: [D, EN]
      piezas:
        - { id: l1, tipo: latch, entradas: [D, EN], rotulo: "Latch inferido" }
      salidas:
        - { id: Q, de: l1.q }
    objetivo:
      condiciones:
        - { led: Q, valor: 1, rotulo: "Q encendida" }
        - { senal: EN, valor: 0, rotulo: "EN apagada" }
      logrado: "Q recuerda aunque D cambie: memoria que nadie pidió, con comportamiento que depende de retardos."
      pistas:
        - { cuando: { senal: EN, valor: 0 }, texto: "Con EN apagada, el latch no copia nada: enciéndala con D a uno." }
        - { texto: "Ahora apague EN." }
    escalera: ["Con EN encendida, Q copia D; con EN apagada, se queda."]
    solucion: "D a uno, EN encendida y luego apagada."

  - id: empareje-informes
    tipo: tocar
    titulo: "Un latch inferido"
    texto: "Toque el informe donde aparece el aviso de un latch inferido."
    libro: [212, 213, 214, 215]
    widget:
      tipo: figura
      figura: fig-37.9
      zonas:
        - { id: a, rotulo: "Primer informe", rect: [140, 98, 48, 36] }
        - { id: b, rotulo: "Segundo informe", rect: [202, 98, 48, 36] }
        - { id: c, rotulo: "Tercer informe", rect: [264, 98, 48, 36] }
    tocar:
      bien: [a]
      porque:
        b: "Sale de la implementación: utilización de recursos."
        c: "Sale del análisis: el margen de los caminos críticos."
    exito: "Los avisos de síntesis: latches y señales sin inicializar. Ignorarlos es la fuente número uno de diseños que funcionan por casualidad."
    escalera: ["El latch lo infiere la síntesis."]
    solucion: "El informe A, el de la síntesis."

  - id: pregunta-banco
    tipo: pregunta
    titulo: "En el banco"
    texto: "Cada compilación tarda decenas de minutos. ¿Qué hábito ahorra más tiempo?"
    libro: [217, 218]
    widget:
      tipo: figura
      figura: fig-37.9
      zonas:
        - { id: carga, rotulo: "Séptima caja", rect: [384, 37, 54, 54], texto: "Carga y verificación en el dispositivo." }
    opciones:
      - { texto: "Compilar y cargar pronto una parte pequeña del diseño", bien: true, porque: "Un problema de pines o de restricciones se descubre al principio, no con todo escrito." }
      - { texto: "Escribirlo entero y compilar una sola vez al final", porque: "Así un problema de pines aparece con todo el diseño, y no se sabe de dónde viene." }
      - { texto: "Saltarse la simulación funcional", porque: "Es la etapa rápida: saltarla solo traslada los fallos a la placa." }
    escalera: ["¿Cuándo es más barato descubrir un pin mal asignado?"]
    solucion: "Compilar y cargar pronto, con una parte pequeña del diseño."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [194, 198, 206, 215]
    ideas:
      - { titulo: "Siete etapas.", texto: "Colocar y encaminar es lo lento: minutos u horas." }
      - { titulo: "Restricciones.", texto: "Sin reloj declarado, no se comprueban tiempos: «compila bien» y falla." }
      - { titulo: "Análisis estático.", texto: "Comprueba todos los caminos a la vez." }
      - { titulo: "Informes.", texto: "Avisos, recursos y tiempos, siempre." }
