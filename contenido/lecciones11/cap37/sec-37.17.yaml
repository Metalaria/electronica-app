# Lección 1.2 de la sección 38.17 «El Cruce de Dominios de Reloj» (cap37; etiqueta interna sec-37.17).
# Formato: contenido/lecciones11/GUIA.md (§11). El sincronizador de dos flip-flops (bloque 681) se ve en el dominio de
# destino: la señal que llega del otro dominio es una entrada que cambia entre flancos, y el reloj es el de B (la
# metaestabilidad no se simula: el circuito lógico de la app es ideal). El contador en Gray (bloque 689) se ve junto al
# binario: G1 = Q1 y G0 = Q1 XOR Q0, la conversión usual de dos bits (la fórmula no está en el libro; solo se afirma
# lo que dice el libro, que en Gray cambia un bit en cada incremento). Figura 38.25 (svg_vista 450,72 × 285,12).
# 1.2.1 («aprender haciendo», GUIA §13): el flip-flop que puede quedar metaestable y el valor que nunca existió se
# tocan en la figura; el sincronizador se lleva con pulsos hasta la salida (objetivo sobre el LED); la salida
# sincronizada y G0 se dibujan. Quedan dos preguntas de opciones: el tipo de fallo y el origen combinacional. El MTBF,
# las tres soluciones, el falso camino y el banco van en los textos.
leccion: cap37/sec-37.17

libro:
  678: "el flip-flop entra en metaestabilidad"
  679: "El resultado es un fallo raro, irreproducible y que aparece cada muchas horas"
  681: "dos flip-flops en cascada en el dominio de destino"
  682: "No elimina la probabilidad de fallo: la reduce a valores despreciables"
  684: "sincronizar cada bit de un bus por separado no funciona"
  685: "el receptor leería una combinación que nunca existió en el origen"
  686: "una lectura a medias puede dar cualquier valor entre 0 y 255"
  688: "Es la solución general para flujos de datos."
  689: "en ese código solo cambia un bit en cada incremento"
  690: "Es la solución más sencilla para transferencias esporádicas."
  693: "declararlo como falso camino no arregla nada por sí solo"
  695: "hay que sincronizar la salida de un registro"
  697: "Olvidar el reset: su liberación también cruza dominios"
  699: "contar los eventos en ambos dominios con contadores separados y comparar"
  700: "con los datos cambiando lo más deprisa posible"
  701: "Sincronizador de dos flip-flops y por qué no basta para un bus."

modelo:
  valores: {}
  calculos: {}

tarjetas:
  - id: explore-dominios
    tipo: tocar
    titulo: "Dos dominios"
    texto: "Entre relojes distintos, nada garantiza que la señal llegue a tiempo. Toque el flip-flop que puede quedar metaestable."
    libro: [678, 681, 701]
    widget:
      tipo: figura
      figura: fig-37.25
      zonas:
        - { id: reg, rotulo: "Flip-flop del dominio A", rect: [58, 55, 36, 40] }
        - { id: ff1, rotulo: "Primer flip-flop del dominio B", rect: [176, 55, 36, 40] }
        - { id: ff2, rotulo: "Segundo flip-flop del dominio B", rect: [255, 55, 36, 40] }
    tocar:
      bien: [ff1]
      porque:
        reg: "Va con su propio reloj, el de A: su dato llega a tiempo dentro de su dominio."
        ff2: "Recibe la salida de FF1 un ciclo después, cuando ya se ha resuelto."
    exito: "FF1 captura una señal que puede cambiar justo en su flanco. Dispone de un ciclo completo para resolverse antes de que FF2 la lea."
    escalera: ["¿Cuál captura directamente la señal del otro dominio?"]
    solucion: "El primer flip-flop del dominio B."

  - id: prediga-metaestable
    tipo: predecir
    titulo: "Justo en el flanco"
    texto: "Una señal del dominio A cambia exactamente cuando el dominio B la captura, sin sincronizador. ¿Qué tipo de fallo produce?"
    libro: [678, 679, 699, 700]
    widget:
      tipo: figura
      figura: fig-37.25
      zonas:
        - { id: a, rotulo: "Recuadro azul de arriba", rect: [5, 5, 119, 129], texto: "Dominio A, con su propio reloj." }
    opciones:
      - { texto: "Uno raro, irreproducible, cada muchas horas", bien: true, porque: "Metaestabilidad: la peor clase de fallo. Se busca contando eventos en los dos dominios durante horas de estrés." }
      - { texto: "Uno inmediato y fácil de ver", porque: "La coincidencia exacta es rara: por eso el fallo aparece de tarde en tarde." }
      - { texto: "Ninguno: el análisis de tiempos lo cubre", porque: "Solo dentro de un dominio; entre relojes sin relación no hay garantía." }
    escalera: ["¿Cada cuánto coincide un cambio con el flanco de otro reloj?"]
    solucion: "Metaestabilidad: un fallo raro e irreproducible, que aparece cada muchas horas."

  - id: explore-sincronizador
    tipo: explorar
    titulo: "El sincronizador"
    texto: "S llega del dominio A; FF1 y FF2 van con el reloj de B. Encienda S y dé pulsos del reloj de B hasta que la salida sincronizada se encienda."
    libro: [681, 682]
    widget:
      tipo: logica
      entradas: [{ id: S, rotulo: "Señal de A" }, { id: CLK, reloj: true, rotulo: "clk B" }]
      piezas:
        - { id: ff1, tipo: d, entradas: [S, CLK], rotulo: "FF1" }
        - { id: ff2, tipo: d, entradas: [ff1.q, CLK], rotulo: "FF2" }
      salidas:
        - { id: SINC, de: ff2.q, rotulo: "Sincronizada" }
    objetivo:
      condiciones:
        - { led: SINC, valor: 1, rotulo: "Sincronizada encendida" }
      logrado: "Dos flancos después. No elimina el fallo: lo reduce a valores despreciables, con un MTBF de años o siglos."
      pistas:
        - { cuando: { senal: S, valor: 0 }, texto: "Primero encienda S." }
        - { texto: "Un pulso más: FF2 copia a FF1 en el flanco siguiente." }
    escalera: ["FF1 copia S en un flanco; FF2 copia FF1 en el siguiente."]
    solucion: "S encendida y dos pulsos del reloj de B."

  - id: dibuje-sincronizada
    tipo: dibujar
    titulo: "Dibuje la salida sincronizada"
    texto: "Ahora la señal de A cambia varias veces. Dibuje la salida de FF2."
    libro: [681, 695, 697]
    widget:
      tipo: logica
      entradas: [{ id: S, rotulo: "Señal de A" }, { id: CLK, reloj: true, rotulo: "clk B" }]
      piezas:
        - { id: ff1, tipo: d, entradas: [S, CLK], rotulo: "FF1" }
        - { id: ff2, tipo: d, entradas: [ff1.q, CLK], rotulo: "FF2" }
      salidas:
        - { id: SINC, de: ff2.q, rotulo: "Sincronizada" }
      cronograma: { ciclos: 8, estimulo: { S: "01100110" }, senales: [CLK, S] }
      dibujo: false
    dibujar:
      senal: SINC
    exito: "La señal de A, retrasada por los dos flip-flops y en los flancos de B. Lo que se sincroniza debe salir de un registro, no de lógica; y el reset también."
    escalera:
      - "FF1 copia S en cada flanco de subida; FF2 copia FF1 en el siguiente."
      - "Cada cambio de S aparece en la salida dos flancos después."
    solucion: "La misma forma que S, desplazada a los flancos del reloj de B y dos flancos después."

  - id: pregunta-bus
    tipo: tocar
    titulo: "Un bus, bit a bit"
    texto: "Los ocho bits de un bus pasan de 0111 1111 a 1000 0000 justo antes de un flanco, cada uno con su sincronizador. Toque lo que lee el dominio B que nunca existió en A."
    libro: [684, 685, 686, 701]
    widget:
      tipo: figura
      figura: fig-37.25
      zonas:
        - { id: viejo, rotulo: "Primer valor de abajo", rect: [80, 225, 110, 36] }
        - { id: mezcla, rotulo: "Segundo valor de abajo", rect: [192, 225, 54, 36] }
        - { id: nuevo, rotulo: "Tercer valor de abajo", rect: [248, 225, 66, 36] }
    tocar:
      bien: [mezcla]
      porque:
        viejo: "Es el valor anterior: existió en A."
        nuevo: "Es el valor nuevo: también existió."
    exito: "Cada bit se resuelve en un ciclo distinto: unos nuevos y otros viejos. Para varios bits: FIFO asíncrona, código Gray o una señal de validez sincronizada."
    escalera: ["Busque el valor entre los dos que sí existieron."]
    solucion: "El valor del medio: una mezcla de bits viejos y nuevos."

  - id: explore-gray
    tipo: dibujar
    titulo: "Un contador en Gray"
    texto: "El mismo contador en binario (Q1 Q0) y en Gray (G1 G0); en Gray solo cambia un bit en cada incremento. Dibuje G0."
    libro: [688, 689, 690]
    widget:
      tipo: logica
      entradas: [{ id: CLK, reloj: true }]
      piezas:
        - { id: cnt, tipo: contador, bits: 2, entradas: [CLK] }
        - { id: x0, tipo: xor, entradas: [cnt.q1, cnt.q0] }
      salidas:
        - { id: Q1, de: cnt.q1 }
        - { id: Q0, de: cnt.q0 }
        - { id: G1, de: cnt.q1 }
        - { id: G0, de: x0 }
      cronograma: { ciclos: 8, senales: [CLK, Q1, Q0, G1] }
      dibujo: false
    dibujar:
      senal: G0
    exito: "G0 cambia justo cuando G1 no: un solo bit por incremento. Una lectura a medias da el valor anterior o el nuevo, por eso los punteros de la FIFO van en Gray."
    escalera:
      - "Entre dos cuentas seguidas, en Gray solo cambia un bit."
      - "Cuando G1 cambia, G0 se queda; cuando G1 se queda, G0 cambia."
    solucion: "G0 se enciende en la segunda cuenta, se apaga en la cuarta y repite: siempre en los flancos en que G1 no cambia."

  - id: pregunta-errores
    tipo: pregunta
    titulo: "Los errores característicos"
    texto: "Se sincroniza una señal que sale directamente de una puerta AND del dominio A. ¿Qué está mal?"
    libro: [693, 695, 697]
    widget:
      tipo: logica
      entradas: [{ id: S, rotulo: "Señal de A" }, { id: CLK, reloj: true, rotulo: "clk B" }]
      piezas:
        - { id: ff1, tipo: d, entradas: [S, CLK], rotulo: "FF1" }
        - { id: ff2, tipo: d, entradas: [ff1.q, CLK], rotulo: "FF2" }
      salidas:
        - { id: SINC, de: ff2.q, rotulo: "Sincronizada" }
    opciones:
      - { texto: "La lógica combinacional puede tener glitches: hay que sincronizar la salida de un registro", bien: true, porque: "Un glitch capturado por el otro reloj es un pulso que nunca debió existir." }
      - { texto: "Nada: el sincronizador lo resuelve todo", porque: "Resuelve la metaestabilidad, no los glitches de la lógica de origen." }
      - { texto: "Que falta sincronizar el reset", porque: "También es un error característico, pero aquí el problema es el origen combinacional." }
    escalera: ["¿Qué hace una puerta mientras sus entradas cambian?"]
    solucion: "Sincronizar la salida de un registro, nunca la de lógica combinacional."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [679, 681, 685, 693]
    ideas:
      - { titulo: "Metaestabilidad.", texto: "Entre relojes sin relación: fallos raros e irreproducibles." }
      - { titulo: "Dos flip-flops.", texto: "Un ciclo para resolverse: MTBF de años o siglos." }
      - { titulo: "Un bus no.", texto: "FIFO asíncrona, Gray o señal de validez." }
      - { titulo: "Declarar.", texto: "Falso camino, sí, pero con el sincronizador puesto." }
