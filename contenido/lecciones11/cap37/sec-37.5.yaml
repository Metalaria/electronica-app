# Lección 1.2 de la sección 38.5 «Un Ejemplo: Divisor de Frecuencia» (cap37; etiqueta interna sec-37.5).
# Formato: contenido/lecciones11/GUIA.md (§11). El divisor del bloque 133 (un contador que, al llegar a su valor,
# conmuta la salida y vuelve a empezar) se ve en pequeño: un contador de dos bits, una AND que da la habilitación de un
# ciclo (EN, bloque 143) y un biestable T del mismo reloj que conmuta cuando EN = 1. Con N = 4 la salida tiene un
# periodo de 2N ciclos, como dice la ecuación del bloque 136. En el dibujo, el contador de módulo 3. Figura 38.7
# (svg_vista 450,72 × 220,32).
leccion: cap37/sec-37.5

libro:
  133: "Un contador que incrementa en cada flanco del reloj, y cuando alcanza un valor, conmuta una salida y se reinicia."
  134: "Con un reloj de 50 MHz y una cuenta hasta 25 000 000, la salida conmuta cada medio segundo: un LED que parpadea a 1 Hz."
  136: 'f_("salida") = (f_("reloj"))/("2" times N)'
  140: "25 millones necesita 25 bits"
  142: "Usar la salida del contador como reloj de otra cosa."
  143: "generar una señal de habilitación que dure un ciclo"
  144: "habilitar en lugar de generar relojes"
  145: "produce un periodo de un ciclo más"
  148: "hace falta contar con los dos flancos del reloj y combinar los resultados"
  151: "el valor de comparación viene de un registro que se puede escribir"
  152: "lo que hace un temporizador de microcontrolador"
  155: "Debe coincidir exactamente, sin ninguna deriva, porque la división es un número entero de ciclos."
  156: "El error del reloj derivado frente a la señal de habilitación"

modelo:
  valores:
    f_clk: { sim: "f_{reloj}", nombre: "frecuencia del reloj", unidad: Hz, valor: 50000000 }
    N: { sim: "N", nombre: "cuenta del divisor", valor: 25000000 }
  calculos:
    f_out: { expr: "f_clk/(2*N)", sim: "f_{salida}", nombre: "frecuencia de salida", unidad: Hz }
    bits_N: { expr: "floor(ln(N)/ln(2)) + 1", nombre: "bits del contador", cifras: 2 }

tarjetas:
  - id: explore-divisor
    tipo: explorar
    titulo: "Un divisor en pequeño"
    texto: "El contador avanza con cada flanco; al llegar a su valor, EN vale uno un ciclo y la salida S conmuta. Mueva el cursor."
    libro: [133, 143]
    widget:
      tipo: logica
      entradas: [{ id: CLK, reloj: true }]
      piezas:
        - { id: cnt, tipo: contador, bits: 2, entradas: [CLK], rotulo: "Contador" }
        - { id: tc, tipo: and, entradas: [cnt.q0, cnt.q1] }
        - { id: ff, tipo: t, entradas: [tc, CLK], rotulo: "Salida" }
      salidas:
        - { id: EN, de: tc }
        - { id: S, de: ff.q }
      cronograma: { ciclos: 16, senales: [CLK, EN, S] }

  - id: formula-divisor
    tipo: formula
    titulo: "La relación general"
    texto: "La salida conmuta cada N ciclos: un periodo completo son 2N. Elija N y mire la frecuencia de salida."
    libro: [134, 136]
    ec: 136
    sustitucion: "{{f_clk}} / (2 × {{N}}) = {{f_out}}"
    widget:
      tipo: grafica
      x: { id: nn, min: 1000, max: 100000000, rotulo: "N", escala: log }
      y: { min: 0.1, max: 100000, unidad: Hz, rotulo: "f_{salida}", escala: log }
      curvas:
        - { expr: "f_clk/(2*nn)", color: azul, rotulo: "f_{salida}" }
      asas:
        - { mueve: N, x: "N", y: "f_out", rotulo: "Su N" }
      lectura: { valor: f_out, rotulo: "Frecuencia de salida" }
      mandos:
        - { valor: N, lista: [2500, 25000, 250000, 2500000, 25000000], rotulo: "N" }
    comprobar:
      - { f_out: 1 }

  - id: reto-1hz
    tipo: reto
    titulo: "Un LED a 1 Hz"
    texto: "Con el reloj de 50 MHz, elija la cuenta N que hace parpadear el LED a 1 Hz."
    libro: [134, 136]
    inicio: { N: 2500000 }
    widget:
      tipo: grafica
      x: { id: nn, min: 1000000, max: 100000000, rotulo: "N", escala: log }
      y: { min: 0.1, max: 100, unidad: Hz, rotulo: "f_{salida}", escala: log }
      curvas:
        - { expr: "f_clk/(2*nn)", color: azul, rotulo: "f_{salida}" }
      lectura: { valor: f_out, rotulo: "Frecuencia de salida" }
      mandos:
        - { valor: N, lista: [2500000, 12500000, 25000000, 50000000], rotulo: "N" }
    condiciones:
      - { valor: f_out, objetivo: 1, tol: 0.02, rotulo: "Salida: {{f_out}}" }
    exito: "N = 25 000 000: la salida conmuta cada medio segundo, un periodo por segundo."
    pistas:
      - { cuando: { valor: f_out, mayor: 1.02 }, texto: "Parpadea demasiado deprisa: la cuenta tiene que ser mayor." }
      - { cuando: { valor: f_out, menor: 0.98 }, texto: "Va a la mitad: la salida conmuta dos veces por periodo, así que se divide entre 2N, no entre N." }
    escalera: ["Despeje N de la ecuación: N = f_{reloj} / (2 · f_{salida})."]
    solucion: "N = 50 MHz / (2 × 1 Hz) = 25 000 000."

  - id: estime-bits
    tipo: pregunta
    fase: "Estime"
    titulo: "El tamaño del contador"
    texto: "¿Cuántos bits necesita el contador que cuenta hasta 25 000 000?"
    libro: [140]
    fijar: { N: 25000000 }
    estimar:
      objetivo: "bits_N"
      min: 0
      max: 40
      paso: 1
      inicio: 32
      tol: 0.02
      rotulo: "Bits del contador"
    exito: "25 bits. Con menos, el contador se desborda en silencio y la frecuencia sale equivocada."
    pistas:
      - { cuando: { valor: estimacion, mayor: 25.4 }, texto: "Sobran: con un bit menos ya se cuenta más allá de 25 millones." }
      - { texto: "Faltan: con tan pocos bits no se llega a 25 millones y se desborda en silencio." }
    escalera: ["Cada bit duplica la cuenta máxima: busque la primera potencia de dos que pasa de 25 millones."]
    solucion: "25 bits: 2²⁵ pasa de 25 millones y 2²⁴ no llega."
    comprobar:
      - { bits_N: 25 }

  - id: dibuje-salida
    tipo: dibujar
    titulo: "Dibuje la salida"
    texto: "Este contador da la vuelta antes; ve su habilitación EN. Dibuje la salida S, que conmuta en el flanco cuando EN vale uno."
    libro: [133, 143]
    widget:
      tipo: logica
      entradas: [{ id: CLK, reloj: true }]
      piezas:
        - { id: cnt, tipo: contador, bits: 2, modulo: 3, entradas: [CLK], rotulo: "Contador" }
        - { id: ff, tipo: t, entradas: [cnt.q1, CLK], rotulo: "Salida" }
      salidas:
        - { id: EN, de: cnt.q1 }
        - { id: S, de: ff.q }
      cronograma: { ciclos: 12, senales: [CLK, EN] }
      dibujo: false
    dibujar:
      senal: S
    exito: "S cambia solo en los flancos con EN a uno: un periodo de S son 2N ciclos del reloj."
    escalera:
      - "S solo puede cambiar en un flanco de subida del reloj."
      - "Busque los ciclos con EN a uno: en su flanco, S se invierte; en los demás, se queda."
    solucion: "S se invierte en cada flanco con EN a uno y se mantiene en los demás."

  - id: toque-reloj-derivado
    tipo: tocar
    titulo: "El error del principiante"
    texto: "Toque el diseño que usa la salida del contador como reloj de otro registro."
    libro: [142, 156]
    widget:
      tipo: figura
      figura: fig-37.7
      zonas:
        - { id: derivado, rotulo: "Recuadro de arriba a la izquierda", rect: [4, 3, 218, 125] }
        - { id: habilitacion, rotulo: "Recuadro de arriba a la derecha", rect: [229, 3, 218, 125] }
        - { id: numeros, rotulo: "Recuadro de abajo", rect: [4, 136, 443, 80] }
    tocar:
      bien: [derivado]
      porque:
        habilitacion: "Aquí el contador da una habilitación de un ciclo y el registro sigue con el reloj de 50 MHz."
        numeros: "Son las cuentas del ejemplo, no un diseño."
    exito: "Un reloj derivado no está en el árbol de reloj: retardos sin controlar y tiempos que no se cierran."
    escalera: ["Busque el registro cuya entrada de reloj no viene del reloj de 50 MHz."]
    solucion: "Arriba a la izquierda: la salida del contador entra en el reloj del registro."

  - id: pregunta-habilitar
    tipo: pregunta
    titulo: "Gobernar un bloque más lento"
    texto: "Un registro debe actuar una vez por cada vuelta del divisor. ¿Cuál es la forma correcta?"
    libro: [143, 144]
    widget:
      tipo: figura
      figura: fig-37.7
      zonas:
        - { id: habilitacion, rotulo: "Recuadro de arriba a la derecha", rect: [229, 3, 218, 125], texto: "Un solo reloj; el registro actúa cuando en = 1." }
    opciones:
      - { texto: "Una habilitación de un ciclo, con un solo reloj en todo el diseño", bien: true, porque: "Habilitar en lugar de generar relojes: una de las reglas más importantes del diseño síncrono." }
      - { texto: "Usar la salida del contador como su reloj", porque: "Es el reloj derivado: fuera del árbol de reloj, retardos sin controlar." }
      - { texto: "Generar el reloj con una puerta", porque: "Una puerta en el reloj da glitches que actúan como flancos falsos." }
    escalera: ["¿Cuántos relojes debe haber en un diseño síncrono?"]
    solucion: "Una señal de habilitación de un ciclo; el registro sigue con el reloj de todo el diseño."

  - id: prediga-error-de-uno
    tipo: predecir
    titulo: "Un error de uno"
    texto: "El contador se compara con el valor máximo en lugar de con el máximo menos uno. ¿Qué pasa?"
    libro: [145]
    widget:
      tipo: logica
      entradas: [{ id: CLK, reloj: true }]
      piezas:
        - { id: cnt, tipo: contador, bits: 2, entradas: [CLK], rotulo: "Contador" }
        - { id: tc, tipo: and, entradas: [cnt.q0, cnt.q1] }
        - { id: ff, tipo: t, entradas: [tc, CLK], rotulo: "Salida" }
      salidas:
        - { id: EN, de: tc }
        - { id: S, de: ff.q }
      cronograma: { ciclos: 16, senales: [CLK, EN, S] }
    opciones:
      - { texto: "Cada periodo dura un ciclo más", bien: true, porque: "En un divisor grande no se nota; en uno pequeño, sí." }
      - { texto: "Nada: da la misma frecuencia", porque: "Cuenta un estado de más en cada vuelta: el periodo crece un ciclo." }
      - { texto: "El contador se desborda", porque: "Eso es declararlo con pocos bits; aquí solo cuenta uno de más." }
    escalera: ["Si se cuenta de cero hasta el máximo incluido, ¿cuántos estados hay?"]
    solucion: "Un periodo de un ciclo más: un error de uno que se nota en divisores pequeños."

  - id: porque-impar
    tipo: porque
    titulo: "Dividir por un impar"
    texto: "¿Por qué un divisor por un número impar con ciclo de trabajo del 50 % no sale con un solo contador?"
    libro: [148]
    widget:
      tipo: logica
      entradas: [{ id: CLK, reloj: true }]
      piezas:
        - { id: cnt, tipo: contador, bits: 2, modulo: 3, entradas: [CLK], rotulo: "Contador" }
        - { id: ff, tipo: t, entradas: [cnt.q1, CLK], rotulo: "Salida" }
      salidas:
        - { id: S, de: ff.q }
      cronograma: { ciclos: 12, senales: [CLK, S] }
    opciones:
      - { texto: "Mitad de un número impar de ciclos no es un número entero de flancos de subida", bien: true, porque: "Hace falta contar también con el flanco de bajada y combinar los resultados." }
      - { texto: "Porque el contador no puede contar impares", porque: "Cuenta lo que sea; el problema es partir el periodo en dos mitades iguales." }
      - { texto: "Sí sale, con un contador más grande", porque: "El tamaño no arregla nada: con un solo flanco no hay medio ciclo." }
    escalera: ["Con solo flancos de subida, ¿dónde cae la mitad de un periodo impar?"]
    solucion: "Hay que contar con los dos flancos del reloj y combinar los resultados."

  - id: pregunta-paso-siguiente
    tipo: pregunta
    titulo: "El paso siguiente"
    texto: "El valor de comparación deja de ser una constante y viene de un registro que se puede escribir. ¿Qué se ha construido?"
    libro: [151, 152]
    widget:
      tipo: figura
      figura: fig-37.7
      zonas:
        - { id: habilitacion, rotulo: "Recuadro de arriba a la derecha", rect: [229, 3, 218, 125], texto: "Contador y habilitación: la base del periférico." }
    opciones:
      - { texto: "Un temporizador como el de un microcontrolador", bien: true, porque: "Un periférico configurable: una forma directa de ver qué hay dentro de uno." }
      - { texto: "Un procesador", porque: "No ejecuta instrucciones: solo cuenta hasta un valor que se escribe." }
      - { texto: "Un reloj derivado", porque: "Sigue habiendo un solo reloj; cambia el valor con el que se compara." }
    escalera: ["¿Qué periférico de un microcontrolador cuenta hasta un valor programable?"]
    solucion: "Un generador de frecuencia variable: lo que hace un temporizador de microcontrolador."

  - id: porque-exacto
    tipo: porque
    titulo: "Sin ninguna deriva"
    texto: "En el banco, la frecuencia de salida coincide exactamente con la del cristal dividida. ¿Por qué?"
    libro: [155]
    widget:
      tipo: figura
      figura: fig-37.7
      zonas:
        - { id: numeros, rotulo: "Recuadro de abajo", rect: [4, 136, 443, 80], texto: "La salida coincide exactamente con el cristal dividido." }
    opciones:
      - { texto: "Porque la división es un número entero de ciclos", bien: true, porque: "Una precisión que ningún circuito analógico da." }
      - { texto: "Porque la FPGA corrige la deriva", porque: "No corrige nada: cuenta ciclos del cristal, y su deriva es la del cristal." }
      - { texto: "Porque el contador es muy grande", porque: "El tamaño no importa: con cualquier N, la división es exacta en ciclos." }
    escalera: ["¿Qué hace el divisor con los ciclos del reloj, además de contarlos?"]
    solucion: "La división es un número entero de ciclos: sin ninguna deriva respecto al cristal."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [133, 136, 140, 144]
    ideas:
      - { titulo: "El divisor.", texto: "Un contador que, al llegar a N, conmuta la salida: f_{salida} = f_{reloj}/(2N)." }
      - { titulo: "Bits.", texto: "25 millones necesita 25 bits; con menos se desborda en silencio." }
      - { titulo: "Habilitar.", texto: "Una habilitación de un ciclo, nunca un reloj derivado." }
      - { titulo: "Exacto.", texto: "Un número entero de ciclos: sin deriva respecto al cristal." }
