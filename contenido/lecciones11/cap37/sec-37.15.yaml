# Lección 1.2 de la sección 38.15 «Un Procesador Dentro de la FPGA: RISC-V y las Instrucciones Propias» (cap37;
# etiqueta interna sec-37.15). Formato: contenido/lecciones11/GUIA.md (§11). Figura 38.23 (svg_vista
# 450,72 × 220,32): la base, las extensiones, tres decisiones de la arquitectura y el hueco para instrucciones propias.
# 1.2.1 («aprender haciendo», GUIA §13): el registro cero (bloque 602) se ve como la lectura del banco de registros, un
# multiplexor cuya entrada 0 es una constante (objetivo: leer x0 con los demás a uno); la extensión M, la decisión sin
# banderas, la de longitud fija y el hueco propio se tocan en la figura 38.23. Quedan dos preguntas de opciones: lo que
# la distingue y qué núcleo elegir. El rendimiento, el acceso sin bus y el banco van en los textos.
leccion: cap37/sec-37.15

libro:
  599: "el conjunto de instrucciones es abierto"
  601: "solo las instrucciones de carga y de almacenamiento tocan la memoria"
  602: "el registro cero está cableado a cero"
  603: "Instrucciones de longitud fija de 32 bits en el conjunto base"
  604: "no hay dependencias ocultas entre instrucciones"
  607: "Instrucciones comprimidas de 16 bits"
  608: "unas cuarenta instrucciones"
  609: "caben en unos pocos cientos de LUT"
  612: "Para sustituir una máquina de estados compleja por algo programable."
  615: "el más pequeño que cumpla"
  620: "accede a los registros de la lógica sin bus externo, sin retardo de interfaz y sin pines"
  623: "se puede implementar como una instrucción nueva en el propio núcleo, ejecutable en un ciclo"
  625: "Es la frontera entre hardware y software puesta donde uno quiera"
  629: "un núcleo pequeño en una FPGA modesta funciona a decenas de megahercios, no a cientos"
  634: "el conjunto de instrucciones del procesador ha pasado a ser parte del diseño"
  635: "La base y las extensiones de RISC-V"

modelo:
  valores: {}
  calculos: {}

tarjetas:
  - id: explore-riscv
    tipo: explorar
    titulo: "Un registro cableado a cero"
    texto: "Así se lee el banco de registros: la selección elige x0, x1, x2 o x3, y x0 está cableado a cero. Lea x0 con los otros tres encendidos."
    libro: [602, 635]
    widget:
      tipo: logica
      entradas:
        - { id: S0, valor: 1, rotulo: "Selección, bit bajo" }
        - { id: S1, rotulo: "Selección, bit alto" }
        - { id: X1, valor: 1, rotulo: "x1" }
        - { id: X2, valor: 1, rotulo: "x2" }
        - { id: X3, valor: 1, rotulo: "x3" }
      piezas:
        - { id: rf, tipo: mux, bits: 2, entradas: [S0, S1, "0", X1, X2, X3], rotulo: "Banco de registros" }
      salidas:
        - { id: R, de: rf, rotulo: "Registro leído" }
    objetivo:
      condiciones:
        - { senal: S0, valor: 0, rotulo: "Selección baja apagada" }
        - { senal: S1, valor: 0, rotulo: "Selección alta apagada" }
        - { senal: X1, valor: 1, rotulo: "x1 encendido" }
        - { senal: X2, valor: 1, rotulo: "x2 encendido" }
        - { senal: X3, valor: 1, rotulo: "x3 encendido" }
      logrado: "x0 da siempre cero: sumar x0 a un registro es moverlo, y compararlo con x0 es compararlo con cero. Sobran esas instrucciones."
      pistas:
        - { texto: "La selección con los dos bits apagados lee x0." }
    escalera: ["x0 es la entrada que no viene de ningún interruptor."]
    solucion: "Los dos bits de selección apagados."

  - id: pregunta-abierta
    tipo: pregunta
    titulo: "Lo que la distingue"
    texto: "¿Qué distingue a RISC-V, y de dónde salen todas sus consecuencias?"
    libro: [599]
    widget:
      tipo: figura
      figura: fig-37.23
      zonas:
        - { id: frontera, rotulo: "Recuadro naranja de abajo", rect: [4, 161, 443, 55], texto: "Sin pedir licencia." }
    opciones:
      - { texto: "Su conjunto de instrucciones es abierto: se implementa y extiende sin licencia", bien: true, porque: "Lo que la distingue no es técnico sino jurídico." }
      - { texto: "Que es la arquitectura más rápida", porque: "Un núcleo pequeño en FPGA va a decenas de megahercios: no es por velocidad." }
      - { texto: "Que solo funciona en FPGA", porque: "Se implementa, extiende o fabrica donde se quiera." }
    escalera: ["¿Hace falta pedir permiso a alguien para implementarla?"]
    solucion: "El conjunto es abierto: cualquiera puede implementarlo, extenderlo o fabricarlo sin licencia."

  - id: empareje-extensiones
    tipo: tocar
    titulo: "Las letras"
    texto: "Un programa en el núcleo mínimo necesita multiplicar y dividir enteros. Toque la extensión que hay que añadir a la base."
    libro: [607, 608]
    widget:
      tipo: figura
      figura: fig-37.23
      zonas:
        - { id: m, rotulo: "Primer recuadro de arriba", rect: [4, 14, 84, 45] }
        - { id: a, rotulo: "Segundo recuadro de arriba", rect: [94, 14, 84, 45] }
        - { id: fd, rotulo: "Tercer recuadro de arriba", rect: [184, 14, 84, 45] }
        - { id: c, rotulo: "Cuarto recuadro de arriba", rect: [274, 14, 84, 45] }
        - { id: propia, rotulo: "Recuadro discontinuo de arriba", rect: [364, 14, 83, 45] }
    tocar:
      bien: [m]
      porque:
        a: "A son las operaciones atómicas."
        fd: "F / D es coma flotante; aquí son enteros."
        c: "C son las instrucciones comprimidas de 16 bits."
        propia: "No hace falta inventarla: ya existe una extensión estándar."
    exito: "M: multiplicación y división. Una implementación mínima solo necesita la base, unas cuarenta instrucciones; el resto se añade según haga falta."
    escalera: ["M de multiplicar."]
    solucion: "La M."

  - id: prediga-banderas
    tipo: tocar
    titulo: "Sin banderas de estado"
    texto: "Lo que más complica un cauce segmentado son las dependencias ocultas entre instrucciones. Toque la decisión que las evita."
    libro: [601, 604, 635]
    widget:
      tipo: figura
      figura: fig-37.23
      zonas:
        - { id: cero, rotulo: "Recuadro de la izquierda, en medio", rect: [4, 111, 144, 42] }
        - { id: banderas, rotulo: "Recuadro del centro, en medio", rect: [154, 111, 144, 42] }
        - { id: fija, rotulo: "Recuadro de la derecha, en medio", rect: [304, 111, 143, 42] }
    tocar:
      bien: [banderas]
      porque:
        cero: "El registro cero ahorra instrucciones de movimiento y de comparación."
        fija: "La longitud fija simplifica la decodificación, no las dependencias."
    exito: "Las comparaciones dejan su resultado en un registro o saltan: sin un registro de banderas compartido, no hay dependencias ocultas."
    escalera: ["¿Qué registro escribirían casi todas las instrucciones?"]
    solucion: "Sin banderas de estado."

  - id: toque-longitud
    tipo: tocar
    titulo: "Decodificar sin esfuerzo"
    texto: "Frente a las arquitecturas de longitud variable, la decodificación de RISC-V es trivial. Toque la decisión que lo consigue."
    libro: [603, 635]
    widget:
      tipo: figura
      figura: fig-37.23
      zonas:
        - { id: cero, rotulo: "Recuadro de la izquierda, en medio", rect: [4, 111, 144, 42] }
        - { id: banderas, rotulo: "Recuadro del centro, en medio", rect: [154, 111, 144, 42] }
        - { id: fija, rotulo: "Recuadro de la derecha, en medio", rect: [304, 111, 143, 42] }
    tocar:
      bien: [fija]
      porque:
        cero: "El registro cero ahorra instrucciones, no complica ni simplifica la decodificación."
        banderas: "Sin banderas se evitan dependencias; la decodificación es otra cosa."
    exito: "Instrucciones de 32 bits fijos en el conjunto base: cada una empieza donde se sabe. Y solo carga y almacenamiento tocan la memoria."
    escalera: ["¿Dónde empieza cada instrucción si todas miden lo mismo?"]
    solucion: "La longitud fija de 32 bits."

  - id: pregunta-nucleo
    tipo: pregunta
    titulo: "Qué núcleo elegir"
    texto: "Se quiere sustituir una máquina de estados compleja por algo programable. ¿Qué núcleo?"
    libro: [609, 612, 615, 620]
    widget:
      tipo: figura
      figura: fig-37.23
      zonas:
        - { id: base, rotulo: "Franja verde", rect: [4, 67, 443, 36], texto: "Una implementación mínima solo necesita la base." }
    opciones:
      - { texto: "Uno mínimo, de unos cientos de LUT", bien: true, porque: "El más pequeño que cumpla: cada LUT del procesador falta a la lógica. Y accede a sus registros sin bus externo ni pines." }
      - { texto: "Uno con gestión de memoria, para un sistema operativo", porque: "Son decenas de miles de LUT: muchísimo más de lo que hace falta." }
      - { texto: "El más grande que quepa, por si acaso", porque: "Cada LUT gastada en el procesador no está disponible para la lógica que justifica la FPGA." }
    escalera: ["¿Qué criterio dio la sección de FPGA o microcontrolador?"]
    solucion: "Un núcleo mínimo: el más pequeño que cumpla."

  - id: toque-instruccion
    tipo: tocar
    titulo: "Una instrucción propia"
    texto: "Un algoritmo repite sin parar un paso de CORDIC. Toque dónde puede ir como instrucción de un ciclo."
    libro: [623, 625, 629, 634, 635]
    widget:
      tipo: figura
      figura: fig-37.23
      zonas:
        - { id: m, rotulo: "Primer recuadro de arriba", rect: [4, 14, 84, 45] }
        - { id: fd, rotulo: "Tercer recuadro de arriba", rect: [184, 14, 84, 45] }
        - { id: propia, rotulo: "Recuadro discontinuo de arriba", rect: [364, 14, 83, 45] }
        - { id: base, rotulo: "Franja verde", rect: [4, 67, 443, 36] }
    tocar:
      bien: [propia]
      porque:
        m: "M es la extensión estándar de multiplicar y dividir: no incluye su operación."
        fd: "F / D es la coma flotante estándar; un paso de CORDIC no está ahí."
        base: "La base es fija: lo nuevo va en el espacio reservado."
    exito: "En el hueco reservado: la frontera entre hardware y software, donde uno quiera. Eso sí, el núcleo irá a decenas de megahercios, no a cientos."
    escalera: ["Busque el espacio que el conjunto reserva para lo que uno añada."]
    solucion: "La extensión propia, en el espacio de codificación reservado."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [599, 604, 615, 623]
    ideas:
      - { titulo: "Abierta.", texto: "Se implementa y extiende sin licencia." }
      - { titulo: "Sencilla de implementar.", texto: "Carga y almacenamiento, registro cero, longitud fija, sin banderas." }
      - { titulo: "El más pequeño que cumpla.", texto: "Cada LUT del procesador falta a la lógica." }
      - { titulo: "Instrucciones propias.", texto: "La frontera hardware-software donde uno quiera." }
