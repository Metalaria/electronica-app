# Lección 1.2 de la sección 38.15 «Un Procesador Dentro de la FPGA: RISC-V y las Instrucciones Propias» (cap37;
# etiqueta interna sec-37.15). Formato: contenido/lecciones11/GUIA.md (§11). Figura 38.23 (svg_vista
# 450,72 × 220,32): la base, las extensiones, tres decisiones de la arquitectura y el hueco para instrucciones propias.
leccion: cap37/sec-37.15

libro:
  599: "el conjunto de instrucciones es abierto"
  601: "solo las instrucciones de carga y de almacenamiento tocan la memoria"
  602: "el registro cero está cableado a cero"
  603: "Instrucciones de longitud fija de 32 bits en el conjunto base"
  604: "no hay dependencias ocultas entre instrucciones"
  607: "Instrucciones comprimidas de 16 bits"
  608: "unas cuarenta instrucciones"
  609: "caben en unos pocos cientos de LUT"
  612: "Para sustituir una máquina de estados compleja por algo programable."
  615: "el más pequeño que cumpla"
  620: "accede a los registros de la lógica sin bus externo, sin retardo de interfaz y sin pines"
  623: "se puede implementar como una instrucción nueva en el propio núcleo, ejecutable en un ciclo"
  625: "Es la frontera entre hardware y software puesta donde uno quiera"
  628: "hay que incluir desde el principio"
  629: "un núcleo pequeño en una FPGA modesta funciona a decenas de megahercios, no a cientos"
  630: "La memoria interna es el recurso limitante"
  633: "Instanciar un núcleo mínimo con memoria interna y un puerto de salida."
  634: "el conjunto de instrucciones del procesador ha pasado a ser parte del diseño"
  635: "La base y las extensiones de RISC-V"

modelo:
  valores: {}
  calculos: {}

tarjetas:
  - id: explore-riscv
    tipo: explorar
    titulo: "Base y extensiones"
    texto: "Una base mínima y extensiones que se añaden según haga falta. Toque la base y el hueco de la derecha."
    libro: [608, 635]
    widget:
      tipo: figura
      figura: fig-37.23
      zonas:
        - { id: base, rotulo: "Franja verde", rect: [4, 67, 443, 36], texto: "I, la base: enteros, saltos, carga y almacenamiento; unas cuarenta instrucciones." }
        - { id: m, rotulo: "Primer recuadro de arriba", rect: [4, 14, 84, 45], texto: "M: multiplicación y división." }
        - { id: propia, rotulo: "Recuadro discontinuo de arriba", rect: [364, 14, 83, 45], texto: "La extensión propia: la que uno añada, en un hueco reservado." }
    requiere: { mover: [base, propia] }

  - id: pregunta-abierta
    tipo: pregunta
    titulo: "Lo que la distingue"
    texto: "¿Qué distingue a RISC-V, y de dónde salen todas sus consecuencias?"
    libro: [599]
    widget:
      tipo: figura
      figura: fig-37.23
      zonas:
        - { id: frontera, rotulo: "Recuadro naranja de abajo", rect: [4, 161, 443, 55], texto: "Sin pedir licencia." }
    opciones:
      - { texto: "Su conjunto de instrucciones es abierto: se implementa y extiende sin licencia", bien: true, porque: "Lo que la distingue no es técnico sino jurídico." }
      - { texto: "Que es la arquitectura más rápida", porque: "Un núcleo pequeño en FPGA va a decenas de megahercios: no es por velocidad." }
      - { texto: "Que solo funciona en FPGA", porque: "Se implementa, extiende o fabrica donde se quiera." }
    escalera: ["¿Hace falta pedir permiso a alguien para implementarla?"]
    solucion: "El conjunto es abierto: cualquiera puede implementarlo, extenderlo o fabricarlo sin licencia."

  - id: empareje-extensiones
    tipo: pregunta
    fase: "Empareje"
    titulo: "Las letras"
    texto: "Una cada letra con lo que añade."
    libro: [607]
    emparejar:
      - ["I", "La base: enteros, saltos, carga y almacenamiento"]
      - ["M", "Multiplicación y división"]
      - ["A", "Operaciones atómicas"]
      - ["F / D", "Coma flotante de simple y doble precisión"]
      - ["C", "Instrucciones comprimidas de 16 bits"]
    exito: "Una implementación mínima solo necesita la base."
    pistas:
      - { texto: "C de comprimidas; A de atómicas." }
    escalera: ["La I es la única obligatoria."]
    solucion: "I: base. M: multiplicar y dividir. A: atómicas. F/D: coma flotante. C: comprimidas."

  - id: porque-registro-cero
    tipo: porque
    titulo: "Un registro cableado a cero"
    texto: "De los 32 registros, el cero está cableado a cero. ¿Por qué no es un desperdicio?"
    libro: [602]
    widget:
      tipo: figura
      figura: fig-37.23
      zonas:
        - { id: cero, rotulo: "Recuadro de la izquierda, en medio", rect: [4, 111, 144, 42], texto: "El registro cero, cableado a cero." }
    opciones:
      - { texto: "Mover y comparar con cero salen como casos de otras instrucciones", bien: true, porque: "Sumar con el registro cero es mover; comparar con él es comparar con cero." }
      - { texto: "Porque así hay menos registros que guardar", porque: "Sigue habiendo 32; la ganancia está en las instrucciones que sobran." }
      - { texto: "Sí lo es, pero lo exige la norma", porque: "No es un capricho: elimina instrucciones de movimiento y de comparación con cero." }
    escalera: ["¿Qué da una suma en la que uno de los sumandos es siempre cero?"]
    solucion: "Elimina las instrucciones de movimiento y de comparación con cero: se obtienen de otras."

  - id: prediga-banderas
    tipo: predecir
    titulo: "Sin banderas de estado"
    texto: "Las comparaciones dejan su resultado en un registro o saltan directamente: no hay banderas. ¿Qué gana un cauce segmentado?"
    libro: [601, 603, 604]
    widget:
      tipo: figura
      figura: fig-37.23
      zonas:
        - { id: fija, rotulo: "Recuadro de la derecha, en medio", rect: [304, 111, 143, 42], texto: "Longitud fija de 32 bits: decodificación trivial." }
    opciones:
      - { texto: "No hay dependencias ocultas entre instrucciones", bien: true, porque: "Un registro de banderas compartido es de lo que más complica un cauce segmentado." }
      - { texto: "Menos registros", porque: "Los resultados ocupan registros normales: la ganancia es otra." }
      - { texto: "Instrucciones más cortas", porque: "La longitud fija de 32 bits es otra decisión, que simplifica la decodificación." }
    escalera: ["¿Qué comparten dos instrucciones seguidas si las dos escriben banderas?"]
    solucion: "Sin un registro de banderas compartido no hay dependencias ocultas: el cauce se simplifica."

  - id: pregunta-nucleo
    tipo: pregunta
    titulo: "Qué núcleo elegir"
    texto: "Se quiere sustituir una máquina de estados compleja por algo programable. ¿Qué núcleo?"
    libro: [609, 612, 615]
    widget:
      tipo: figura
      figura: fig-37.23
      zonas:
        - { id: base, rotulo: "Franja verde", rect: [4, 67, 443, 36], texto: "Una implementación mínima solo necesita la base." }
    opciones:
      - { texto: "Uno mínimo, de unos cientos de LUT", bien: true, porque: "El más pequeño que cumpla: cada LUT del procesador falta a la lógica." }
      - { texto: "Uno con gestión de memoria, para un sistema operativo", porque: "Son decenas de miles de LUT: muchísimo más de lo que hace falta." }
      - { texto: "El más grande que quepa, por si acaso", porque: "Cada LUT gastada en el procesador no está disponible para la lógica que justifica la FPGA." }
    escalera: ["¿Qué criterio dio la sección de FPGA o microcontrolador?"]
    solucion: "Un núcleo mínimo: el más pequeño que cumpla."

  - id: pregunta-dentro
    tipo: pregunta
    titulo: "Dentro del mismo silicio"
    texto: "¿Qué ventaja decisiva tiene el procesador dentro de la FPGA frente a un microcontrolador aparte?"
    libro: [620]
    widget:
      tipo: figura
      figura: fig-37.23
      zonas:
        - { id: frontera, rotulo: "Recuadro naranja de abajo", rect: [4, 161, 443, 55], texto: "Hardware y software, en el mismo silicio." }
    opciones:
      - { texto: "Accede a los registros de la lógica sin bus externo, sin retardo y sin pines", bien: true, porque: "Está en el mismo silicio que la lógica que gobierna." }
      - { texto: "Es más rápido que un microcontrolador comercial", porque: "Al contrario: decenas de megahercios, no cientos." }
      - { texto: "No necesita memoria", porque: "La necesita, y es el recurso limitante: bloques de memoria de la FPGA." }
    escalera: ["¿Qué hay entre un microcontrolador aparte y la FPGA?"]
    solucion: "Acceso directo a los registros de la lógica: sin bus externo, sin retardo de interfaz y sin pines."

  - id: toque-instruccion
    tipo: tocar
    titulo: "Una instrucción propia"
    texto: "Un algoritmo repite sin parar un paso de CORDIC. Toque dónde puede ir como instrucción de un ciclo."
    libro: [623, 625, 635]
    widget:
      tipo: figura
      figura: fig-37.23
      zonas:
        - { id: m, rotulo: "Primer recuadro de arriba", rect: [4, 14, 84, 45] }
        - { id: fd, rotulo: "Tercer recuadro de arriba", rect: [184, 14, 84, 45] }
        - { id: propia, rotulo: "Recuadro discontinuo de arriba", rect: [364, 14, 83, 45] }
        - { id: base, rotulo: "Franja verde", rect: [4, 67, 443, 36] }
    tocar:
      bien: [propia]
      porque:
        m: "M es la extensión estándar de multiplicar y dividir: no incluye su operación."
        fd: "F / D es la coma flotante estándar; un paso de CORDIC no está ahí."
        base: "La base es fija: lo nuevo va en el espacio reservado."
    exito: "En el hueco reservado: la frontera entre hardware y software, puesta donde uno quiera."
    escalera: ["Busque el espacio que el conjunto reserva para lo que uno añada."]
    solucion: "La extensión propia, en el espacio de codificación reservado."

  - id: pregunta-rendimiento
    tipo: pregunta
    titulo: "Lo que hay que tener en cuenta"
    texto: "Lo que hace falta es velocidad de proceso secuencial. ¿Un núcleo RISC-V en una FPGA modesta?"
    libro: [629, 630]
    widget:
      tipo: figura
      figura: fig-37.23
      zonas:
        - { id: base, rotulo: "Franja verde", rect: [4, 67, 443, 36], texto: "La base: unas cuarenta instrucciones." }
    opciones:
      - { texto: "No: va a decenas de megahercios; mejor un microcontrolador", bien: true, porque: "No es el rendimiento de un microcontrolador comercial." }
      - { texto: "Sí: la FPGA lo acelera todo", porque: "La FPGA acelera lo paralelo; lo secuencial va más lento que en un micro." }
      - { texto: "Sí, si se le da más memoria", porque: "La memoria es otro límite, pero la velocidad sigue siendo de decenas de megahercios." }
    escalera: ["¿A qué frecuencia funciona un núcleo pequeño en una FPGA modesta?"]
    solucion: "Decenas de megahercios: para proceso secuencial rápido, un microcontrolador."

  - id: ordene-banco
    tipo: pregunta
    fase: "Ordene"
    titulo: "En el banco, en una tarde"
    texto: "Ordene el ejercicio completo."
    libro: [628, 633, 634]
    ordenar:
      - "Instanciar un núcleo mínimo con memoria interna y un puerto de salida."
      - "Compilar un parpadeo, cargarlo y comprobarlo."
      - "Añadir el generador de PWM como periférico y gobernarlo."
      - "Añadir una instrucción nueva y usarla desde el programa."
    exito: "El conjunto de instrucciones ha pasado a ser parte del diseño."
    pistas:
      - { texto: "La instrucción nueva es el último paso, el que enseña de verdad." }
    escalera: ["Primero que el núcleo funcione con un programa sencillo."]
    solucion: "Núcleo mínimo, parpadeo, periférico PWM e instrucción propia."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [599, 604, 615, 623]
    ideas:
      - { titulo: "Abierta.", texto: "Se implementa y extiende sin licencia." }
      - { titulo: "Sencilla de implementar.", texto: "Carga y almacenamiento, registro cero, longitud fija, sin banderas." }
      - { titulo: "El más pequeño que cumpla.", texto: "Cada LUT del procesador falta a la lógica." }
      - { titulo: "Instrucciones propias.", texto: "La frontera hardware-software donde uno quiera." }
