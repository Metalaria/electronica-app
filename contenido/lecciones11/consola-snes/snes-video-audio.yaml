# «Consolas por dentro» · Super Nintendo 5: el camino del vídeo (PPU1 → PPU2 → codificador → Multi Out y RF) y del
# sonido (S-SMP → S-DSP con la ARAM → DAC → mezclador), en la foto NTSC y en la cara de soldadura PAL. Fuentes: snes#n
# (explorador, arquitectura, SNESdev «Version differences», Fabien Sanglard) y el libro.
leccion: consola-snes/snes-video-audio

libro:
  "snes#3": "Lee los mosaicos de fondos y sprites de la VRAM"
  "snes#4": "convierte el resultado a RGB analógico con la paleta (CGRAM)"
  "snes#8": "salida estéreo de 16 bits a 32 kHz en serie (BCK, LRCK, DATA) hacia el DAC"
  "snes#11": "le suma el audio del cartucho (SOUND-L/R) y de la expansión"
  "snes#19": "En las PAL la patilla 3 no lleva el sincronismo, sino 12 V (D1, R72)"
  "snes#20": "Vídeo compuesto y audio mono modulados para la entrada de antena del televisor"
  "snes#36": "Del RGB de la PPU2 saca el S-vídeo y el compuesto"
  "snes#34": "llevan el NEC µPD6376 (SNESdev)"
  "snes#35": "Fabien Sanglard llama al S-MIX «Sound mixer» (U10)"
  "snes#41": "En una NTSC la patilla 3 lleva el sincronismo compuesto"
  "snes#49": "Dos transistores por color"
  "snes#50": "Seguidores de emisor para la luminancia, la crominancia y el compuesto"
  "snes#51": "dan la salida estéreo de baja impedancia y la mezcla mono del modulador"
  "snes#93": "La CPU principal solo le habla por cuatro puertos"

modelo:
  valores:
    f_m: { sim: "f_{muestras}", nombre: "muestras por segundo", unidad: Hz, valor: 32000 }
    b: { sim: "b", nombre: "bits por muestra", unidad: "", valor: 16 }
    canales: { sim: "c", nombre: "canales", unidad: "", valor: 2 }
  calculos:
    tasa: { expr: "canales*b*f_m", sim: "R", nombre: "bits por segundo hacia el DAC", unidad: "bit/s", cifras: 4 }

tarjetas:
  - id: explore-video
    tipo: explorar
    titulo: "El camino del vídeo"
    texto: "Siga la imagen por la placa NTSC: toque la PPU2, el codificador y las dos salidas."
    libro: ["snes#4", "snes#36", "snes#20"]
    requiere: { mover: [n-ppu2, n-rgb, n-av] }
    widget:
      tipo: figura
      consola: { maquina: snes, foto: ntsc }
      zonas:
        - { id: n-ppu2, hotspot: n-ppu2, rotulo: "PPU2", texto: "Saca el RGB analógico con la paleta." }
        - { id: n-rgb, hotspot: n-rgb, rotulo: "Codificador S-RGB", texto: "Del RGB saca el S-vídeo y el compuesto." }
        - { id: n-av, hotspot: n-av, rotulo: "Multi Out", texto: "RGB, S-vídeo, compuesto y audio estéreo." }
        - { id: n-rf, hotspot: n-rf, rotulo: "Modulador de RF", texto: "Compuesto y audio mono, para la antena del televisor." }

  - id: ordene-video
    tipo: pregunta
    fase: "Ordene"
    titulo: "Del mosaico al televisor"
    texto: "Ordene el camino de la imagen."
    libro: ["snes#3", "snes#4", "snes#36", "snes#20"]
    ordenar:
      - "La PPU1 lee fondos y sprites de la VRAM."
      - "La PPU2 mezcla las capas y saca RGB."
      - "El codificador saca S-vídeo y compuesto."
      - "El modulador de RF lo lleva a la antena."
    exito: "Leer, mezclar, codificar y modular: cada chip, un paso."
    pistas:
      - { texto: "El RGB sale de la PPU2; el compuesto, del codificador." }
    escalera:
      - "Lo primero es leer la memoria de vídeo."
    solucion: "PPU1, PPU2, codificador y modulador."

  - id: toque-codificador
    tipo: tocar
    titulo: "Del RGB al compuesto"
    texto: "Toque el chip que convierte el RGB de la PPU2 en S-vídeo y compuesto."
    libro: ["snes#36", "snes#4"]
    widget:
      tipo: figura
      consola: { maquina: snes, foto: ntsc }
      zonas:
        - { id: rgb, hotspot: n-rgb, rotulo: "Chip alargado, arriba a la derecha" }
        - { id: ppu2, hotspot: n-ppu2, rotulo: "Chip cuadrado, en el centro" }
        - { id: av, hotspot: n-av, rotulo: "Conector gris, a la izquierda" }
    tocar:
      bien: [rgb]
      porque:
        ppu2: "Es la PPU2: saca el RGB, pero no lo codifica en compuesto."
        av: "Es el Multi Out: la salida, no el codificador."
    exito: "El S-RGB (BA6595F): del RGB de la PPU2 saca el S-vídeo y el compuesto."
    escalera:
      - "Lea las marcas: el nombre del chip lo dice."
    solucion: "Arriba a la derecha: S-RGB, BA6595F."

  - id: explore-sonido
    tipo: explorar
    titulo: "El camino del sonido"
    texto: "Toque el S-SMP, el S-DSP, el DAC y el mezclador."
    libro: ["snes#8", "snes#34", "snes#35", "snes#93"]
    requiere: { mover: [n-smp, n-dsp, n-dac, n-mix] }
    widget:
      tipo: figura
      consola: { maquina: snes, foto: ntsc }
      zonas:
        - { id: n-smp, hotspot: n-smp, rotulo: "S-SMP", texto: "La CPU del sonido: la principal solo le habla por cuatro puertos." }
        - { id: n-dsp, hotspot: n-dsp, rotulo: "S-DSP", texto: "Estéreo de 16 bits a 32 kHz, en serie hacia el DAC." }
        - { id: n-dac, hotspot: n-dac, rotulo: "DAC", texto: "En estas placas, el NEC µPD6376." }
        - { id: n-mix, hotspot: n-mix, rotulo: "Mezclador S-MIX", texto: "Mezcla el sonido antes de las salidas." }

  - id: ordene-sonido
    tipo: pregunta
    fase: "Ordene"
    titulo: "De la muestra al altavoz"
    texto: "Ordene el camino del sonido en la placa PAL del esquema."
    libro: ["snes#8", "snes#11", "snes#93"]
    ordenar:
      - "El S-SMP ejecuta el programa de sonido."
      - "El S-DSP lee las muestras de la ARAM."
      - "El DAC las convierte en tensiones."
      - "El mezclador suma el audio del cartucho."
      - "Sale por el Multi Out y el modulador."
    exito: "Programa, voces, conversión, mezcla y salida."
    pistas:
      - { texto: "El DAC va antes que el mezclador: se mezclan tensiones, no muestras." }
    escalera:
      - "Lo primero es el programa del SPC700."
    solucion: "S-SMP, S-DSP, DAC, mezclador y salidas."

  - id: prediga-bits
    tipo: predecir
    titulo: "Los bits hacia el DAC"
    texto: "El S-DSP saca dos canales de 16 bits a 32 kHz, en serie. ¿Cuántos bits por segundo?"
    libro: ["snes#8"]
    fijar: { canales: 2, b: 16, f_m: 32000 }
    widget:
      tipo: figura
      consola: { maquina: snes, foto: ntsc }
      zonas:
        - { id: n-dsp, hotspot: n-dsp, rotulo: "S-DSP" }
        - { id: n-dac, hotspot: n-dac, rotulo: "DAC" }
    opciones:
      - texto: "1,024 Mbit/s"
        bien: true
        porque: "2 canales · 16 bits · 32 000 muestras por segundo = 1,024 Mbit/s."
      - texto: "512 kbit/s"
        porque: "Eso es un solo canal. El S-DSP saca izquierda y derecha por la misma línea DATA."
      - texto: "32 kbit/s"
        porque: "32 kHz son muestras, no bits: cada muestra de cada canal lleva 16 bits."
    escalera:
      - "Multiplique canales por bits por muestras por segundo."
    solucion: "2 · 16 · 32 000 = 1,024 Mbit/s."
    comprobar:
      - { tasa: 1024000 }
      - { con: { canales: 1 }, tasa: 512000 }
      - { con: { canales: 1, b: 1 }, tasa: 32000 }

  - id: patilla-3
    tipo: pregunta
    titulo: "La patilla 3 del Multi Out"
    texto: "Un cable RGB toma el sincronismo de la patilla 3, como en una NTSC. ¿Qué encuentra en una PAL?"
    libro: ["snes#19", "snes#41"]
    widget:
      tipo: figura
      consola: { maquina: snes, foto: ntsc }
      zonas:
        - { id: n-av, hotspot: n-av, rotulo: "Multi Out" }
    opciones:
      - texto: "12 V, que piden al televisor el modo 4:3."
        bien: true
        porque: "En las PAL la patilla 3 no lleva el sincronismo, sino 12 V (D1, R72) para el euroconector."
      - texto: "El mismo sincronismo compuesto."
        porque: "Eso es en una NTSC. En las PAL, esa patilla lleva 12 V."
      - texto: "Nada: la patilla está al aire."
        porque: "No está al aire: D1 y R72 le ponen 12 V en las PAL."
    escalera:
      - "Hay una diferencia de esa patilla entre normas."
    solucion: "12 V: en las PAL, la patilla 3 pide 4:3 al televisor."

  - id: toque-rgb
    tipo: tocar
    titulo: "Los amplificadores de color"
    texto: "En la cara de soldadura PAL, toque los transistores que dan corriente a cada color."
    libro: ["snes#49", "snes#50", "snes#51"]
    widget:
      tipo: figura
      consola: { maquina: snes, foto: cara-b }
      zonas:
        - { id: rgb, hotspot: b-rgb, rotulo: "En el centro, a la izquierda" }
        - { id: yc, hotspot: b-yc, rotulo: "Arriba, en el centro" }
        - { id: audio, hotspot: b-audio, rotulo: "Abajo, en el centro a la derecha" }
    tocar:
      bien: [rgb]
      porque:
        yc: "Son los seguidores de la luminancia, la crominancia y el compuesto."
        audio: "Es la etapa de salida del audio."
    exito: "Q3–Q8: dos transistores por color, hacia el Multi Out."
    escalera:
      - "Son seis transistores: dos por cada color."
    solucion: "Q3–Q8, en el centro a la izquierda."

  - id: por-que-cartucho
    tipo: porque
    titulo: "Sonido desde el cartucho"
    texto: "La ranura tiene una entrada de audio estéreo. ¿Para qué?"
    libro: ["snes#11"]
    widget:
      tipo: figura
      consola: { maquina: snes, foto: ntsc }
      zonas:
        - { id: n-cart, hotspot: n-cart, rotulo: "Ranura de cartucho" }
    opciones:
      - texto: "El mezclador suma el audio del cartucho al de la consola."
        bien: true
        porque: "SOUND-L/R del cartucho entran al mezclador, que los suma al sonido del DAC antes de las salidas."
      - texto: "Para grabar en el cartucho el sonido del juego."
        porque: "Es una entrada hacia la consola: el mezclador la suma, no se graba nada."
      - texto: "Es la alimentación del chip de sonido."
        porque: "SOUND-L/R son señales de audio que llegan al mezclador, no alimentación."
    escalera:
      - "Mire qué suma el mezclador."
    solucion: "El mezclador suma SOUND-L/R del cartucho al sonido de la consola."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: ["snes#3", "snes#36", "snes#8", "snes#19"]
    ideas:
      - { titulo: "Vídeo.", texto: "PPU1, PPU2, codificador y salidas: RGB, S-vídeo, compuesto y RF." }
      - { titulo: "Sonido.", texto: "S-SMP, S-DSP con la ARAM, DAC y mezclador." }
      - { titulo: "En serie.", texto: "1,024 Mbit/s del S-DSP al DAC." }
      - { titulo: "La patilla 3.", texto: "12 V en las PAL; el sincronismo en las NTSC." }
