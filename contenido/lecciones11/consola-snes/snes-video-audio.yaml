# «Consolas por dentro» · Super Nintendo 5: el camino del vídeo (PPU1 → PPU2 → codificador → Multi Out y RF) y del
# sonido (S-SMP → S-DSP con la ARAM → DAC → mezclador), en la foto NTSC y en la cara de soldadura PAL. Fuentes: snes#n
# (explorador, arquitectura, SNESdev «Version differences», Fabien Sanglard) y el libro.
# 1.2.1: los dos caminos (vídeo y sonido) se tocan en orden en la foto NTSC; el explorar pide los 1,024 Mbit/s hacia
# el DAC con los canales y los bits; se toca el chip que suma el audio del cartucho. Queda una pregunta: la patilla 3.
# 1.3 (contenido13b): las fotos de la placa (NTSC y caras de la PAL) se recortan a las zonas de cada tarjeta, con
# ampliar en el teléfono donde hace falta, para que cada zona mida 44 px o más a 360 px (scratchpad c13b/snesplan.mjs).
leccion: consola-snes/snes-video-audio

libro:
  "snes#3": "Lee los mosaicos de fondos y sprites de la VRAM"
  "snes#4": "convierte el resultado a RGB analógico con la paleta (CGRAM)"
  "snes#8": "salida estéreo de 16 bits a 32 kHz en serie (BCK, LRCK, DATA) hacia el DAC"
  "snes#11": "le suma el audio del cartucho (SOUND-L/R) y de la expansión"
  "snes#19": "En las PAL la patilla 3 no lleva el sincronismo, sino 12 V (D1, R72)"
  "snes#20": "Vídeo compuesto y audio mono modulados para la entrada de antena del televisor"
  "snes#36": "Del RGB de la PPU2 saca el S-vídeo y el compuesto"
  "snes#34": "llevan el NEC µPD6376 (SNESdev)"
  "snes#35": "Fabien Sanglard llama al S-MIX «Sound mixer» (U10)"
  "snes#41": "En una NTSC la patilla 3 lleva el sincronismo compuesto"
  "snes#49": "Dos transistores por color"
  "snes#50": "Seguidores de emisor para la luminancia, la crominancia y el compuesto"
  "snes#51": "dan la salida estéreo de baja impedancia y la mezcla mono del modulador"
  "snes#93": "La CPU principal solo le habla por cuatro puertos"

modelo:
  valores:
    f_m: { sim: "f_{muestras}", nombre: "muestras por segundo", unidad: Hz, valor: 32000 }
    b: { sim: "b", nombre: "bits por muestra", unidad: "", valor: 16 }
    canales: { sim: "c", nombre: "canales", unidad: "", valor: 2 }
  calculos:
    tasa: { expr: "canales*b*f_m", sim: "R", nombre: "bits por segundo hacia el DAC", unidad: "bit/s", cifras: 4 }

tarjetas:
  - id: ordene-video
    tipo: tocar
    fase: "Ordene"
    titulo: "Del mosaico al televisor"
    texto: "Toque, en orden, el camino de la imagen: quien lee la memoria de vídeo, quien mezcla y saca RGB, quien lo codifica y la salida a la antena."
    libro: ["snes#3", "snes#4", "snes#36", "snes#20"]
    widget:
      tipo: figura
      consola: { maquina: snes, foto: ntsc }
      recorte: [80, 92, 1045, 806]
      ampliar: 3.1
      zonas:
        - { id: ppu1, hotspot: n-ppu1, rotulo: "Chip cuadrado, en el centro a la derecha" }
        - { id: ppu2, hotspot: n-ppu2, rotulo: "Chip cuadrado, en el centro" }
        - { id: rgb, hotspot: n-rgb, rotulo: "Chip alargado, arriba a la derecha" }
        - { id: rf, hotspot: n-rf, rotulo: "Caja metálica, abajo a la izquierda" }
    tocar:
      bien: [ppu1, ppu2, rgb, rf]
      orden: true
    pistas:
      - { texto: "El RGB sale de la PPU2; el compuesto, del codificador; la antena, al final." }
    exito: "La PPU1 lee fondos y sprites de la VRAM, la PPU2 mezcla y saca el RGB con la paleta, el S-RGB saca el S-vídeo y el compuesto, y el modulador lo lleva a la antena."
    escalera:
      - "Lo primero es leer la memoria de vídeo."
    solucion: "PPU1, PPU2, S-RGB y modulador de RF."

  - id: toque-codificador
    tipo: tocar
    titulo: "Del RGB al compuesto"
    texto: "Toque el chip que convierte el RGB de la PPU2 en S-vídeo y compuesto."
    libro: ["snes#36", "snes#4"]
    widget:
      tipo: figura
      consola: { maquina: snes, foto: ntsc }
      recorte: [15, 92, 918, 628]
      ampliar: 2.7
      zonas:
        - { id: rgb, hotspot: n-rgb, rotulo: "Chip alargado, arriba a la derecha" }
        - { id: ppu2, hotspot: n-ppu2, rotulo: "Chip cuadrado, en el centro" }
        - { id: av, hotspot: n-av, rotulo: "Conector gris, a la izquierda" }
    tocar:
      bien: [rgb]
      porque:
        ppu2: "Es la PPU2: saca el RGB, pero no lo codifica en compuesto."
        av: "Es el Multi Out: la salida, no el codificador."
    exito: "El S-RGB (BA6595F): del RGB de la PPU2 saca el S-vídeo y el compuesto."
    escalera:
      - "Lea las marcas: el nombre del chip lo dice."
    solucion: "Arriba a la derecha: S-RGB, BA6595F."

  - id: ordene-sonido
    tipo: tocar
    fase: "Ordene"
    titulo: "De la muestra al altavoz"
    texto: "Toque, en orden, el camino del sonido: la CPU de sonido, el generador, el DAC, el mezclador y la salida."
    libro: ["snes#8", "snes#11", "snes#93", "snes#34", "snes#35"]
    widget:
      tipo: figura
      consola: { maquina: snes, foto: ntsc }
      recorte: [15, 121, 552, 599]
      ampliar: 1.4
      zonas:
        - { id: smp, hotspot: n-smp, rotulo: "Chip cuadrado, arriba en el centro" }
        - { id: dsp, hotspot: n-dsp, rotulo: "Chip cuadrado, en el centro" }
        - { id: dac, hotspot: n-dac, rotulo: "Chip pequeño, a la izquierda" }
        - { id: mix, hotspot: n-mix, rotulo: "Chip pequeño, en el centro" }
        - { id: av, hotspot: n-av, rotulo: "Conector gris, a la izquierda" }
    tocar:
      bien: [smp, dsp, dac, mix, av]
      orden: true
    pistas:
      - { texto: "El DAC va antes que el mezclador: se mezclan tensiones, no muestras." }
    exito: "El S-SMP ejecuta el programa, el S-DSP lee las muestras de la ARAM, el DAC (un NEC µPD6376) las convierte, el S-MIX suma el audio del cartucho y sale por el Multi Out."
    escalera:
      - "Lo primero es el programa del SPC700."
    solucion: "S-SMP, S-DSP, DAC, mezclador y Multi Out."

  - id: prediga-bits
    tipo: explorar
    titulo: "Los bits hacia el DAC"
    texto: "El S-DSP saca las muestras a 32 kHz, en serie, por una sola línea DATA. Elija los canales y los bits por muestra que dan 1,024 Mbit/s."
    libro: ["snes#8"]
    fijar: { f_m: 32000 }
    inicio: { canales: 1, b: 8 }
    widget:
      tipo: grafica
      x: { id: ff, min: 0, max: 48000, unidad: Hz, rotulo: "muestras por segundo" }
      y: { min: 0, max: 1600000, unidad: "bit/s", rotulo: "bits por segundo" }
      curvas:
        - { expr: "canales*b*ff", color: azul, rotulo: "canales · bits · muestras" }
      marcas:
        - { x: "f_m", y: "tasa", rotulo: "{{tasa}}" }
      lectura: { valor: tasa, rotulo: "Hacia el DAC" }
      mandos:
        - { valor: canales, lista: [1, 2], rotulo: "Canales" }
        - { valor: b, lista: [8, 16], rotulo: "Bits por muestra" }
    objetivo:
      condiciones:
        - { valor: tasa, objetivo: 1024000, tol: 0.001, rotulo: "Hacia el DAC: {{tasa}}" }
      logrado: "Estéreo de 16 bits a 32 kHz: {{tasa}} por la misma línea, izquierda y derecha alternadas."
      pistas:
        - { texto: "Faltan bits: el S-DSP saca estéreo de 16 bits." }
    escalera:
      - "Canales por bits por muestras por segundo."
    solucion: "Dos canales de 16 bits: 2 · 16 · 32 000 = 1,024 Mbit/s."
    comprobar:
      - { con: { canales: 2, b: 16 }, tasa: 1024000 }
      - { con: { canales: 1, b: 16 }, tasa: 512000 }

  - id: patilla-3
    tipo: pregunta
    titulo: "La patilla 3 del Multi Out"
    texto: "Un cable RGB toma el sincronismo de la patilla 3, como en una NTSC. ¿Qué encuentra en una PAL?"
    libro: ["snes#19", "snes#41"]
    widget:
      tipo: figura
      consola: { maquina: snes, foto: ntsc }
      zonas:
        - { id: n-av, hotspot: n-av, rotulo: "Multi Out" }
    opciones:
      - texto: "12 V, que piden al televisor el modo 4:3."
        bien: true
        porque: "En las PAL la patilla 3 no lleva el sincronismo, sino 12 V (D1, R72) para el euroconector."
      - texto: "El mismo sincronismo compuesto."
        porque: "Eso es en una NTSC. En las PAL, esa patilla lleva 12 V."
      - texto: "Nada: la patilla está al aire."
        porque: "No está al aire: D1 y R72 le ponen 12 V en las PAL."
    escalera:
      - "Hay una diferencia de esa patilla entre normas."
    solucion: "12 V: en las PAL, la patilla 3 pide 4:3 al televisor."

  - id: toque-rgb
    tipo: tocar
    titulo: "Los amplificadores de color"
    texto: "En la cara de soldadura PAL, toque los transistores que dan corriente a cada color."
    libro: ["snes#49", "snes#50", "snes#51"]
    widget:
      tipo: figura
      consola: { maquina: snes, foto: cara-b }
      recorte: [563, 344, 604, 674]
      ampliar: 2.7
      zonas:
        - { id: rgb, hotspot: b-rgb, rotulo: "Recuadro alto, a la derecha" }
        - { id: yc, hotspot: b-yc, rotulo: "Abajo, a la derecha" }
        - { id: audio, hotspot: b-audio, rotulo: "Arriba, a la izquierda" }
    tocar:
      bien: [rgb]
      porque:
        yc: "Son los seguidores de la luminancia, la crominancia y el compuesto."
        audio: "Es la etapa de salida del audio."
    exito: "Q3–Q8: dos transistores por color, hacia el Multi Out."
    escalera:
      - "Son seis transistores: dos por cada color."
    solucion: "Q3–Q8, en el centro a la izquierda."

  - id: por-que-cartucho
    tipo: tocar
    titulo: "Sonido desde el cartucho"
    texto: "La ranura tiene una entrada de audio estéreo, SOUND-L/R. Toque el chip que la suma al sonido de la consola."
    libro: ["snes#11", "snes#35"]
    widget:
      tipo: figura
      consola: { maquina: snes, foto: ntsc }
      recorte: [221, 272, 406, 380]
      zonas:
        - { id: mix, hotspot: n-mix, rotulo: "Chip pequeño, en el centro" }
        - { id: dac, hotspot: n-dac, rotulo: "Chip pequeño, a la izquierda" }
        - { id: dsp, hotspot: n-dsp, rotulo: "Chip cuadrado, en el centro" }
    tocar:
      bien: [mix]
      porque:
        dac: "El DAC convierte las muestras del S-DSP; el audio del cartucho llega ya como tensión."
        dsp: "El S-DSP genera las voces; la suma con el cartucho se hace después."
    exito: "El mezclador (U10, el S-MIX): suma SOUND-L/R del cartucho y el audio de la expansión al sonido del DAC."
    escalera:
      - "Mire qué chip va justo después del DAC."
    solucion: "El mezclador S-MIX."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: ["snes#3", "snes#36", "snes#8", "snes#19"]
    ideas:
      - { titulo: "Vídeo.", texto: "PPU1, PPU2, codificador y salidas: RGB, S-vídeo, compuesto y RF." }
      - { titulo: "Sonido.", texto: "S-SMP, S-DSP con la ARAM, DAC y mezclador." }
      - { titulo: "En serie.", texto: "1,024 Mbit/s del S-DSP al DAC." }
      - { titulo: "La patilla 3.", texto: "12 V en las PAL; el sincronismo en las NTSC." }
