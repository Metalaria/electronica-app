# «Consolas por dentro» · Super Nintendo 1: la placa de un vistazo, sobre la foto NTSC del explorador (SNS-CPU-RGB-01,
# Yaca2671, CC BY-SA 3.0). Fuentes: los datos de la consola (snes#n, scripts/consolas11.mjs) y el libro.
leccion: consola-snes/snes-placa

libro:
  "snes#25": "Una placa NTSC con todos sus chips"
  "snes#26": "un 65C816 que gobierna el bus A y el bus B"
  "snes#27": "Lee los fondos y los sprites de la VRAM"
  "snes#28": "Mezcla las capas, aplica la paleta y saca el RGB analógico"
  "snes#29": "la PPU1 lee 16 bits en cada acceso"
  "snes#30": "La DRAM de 128 KB de la consola"
  "snes#31": "Habla con la CPU por cuatro puertos"
  "snes#32": "Ocho voces de muestras leídas de la ARAM"
  "snes#33": "La memoria del sonido, que el S-DSP reparte con el S-SMP"
  "snes#16": "24,576 MHz ÷ 24 = 1,024 MHz para el SPC700"
  "snes#36": "Del RGB de la PPU2 saca el S-vídeo y el compuesto"
  "snes#37": "todas las NTSC llevan el F411 y las PAL el F413"
  "snes#38": "En una NTSC el reloj maestro sale de este cristal de 21,477 MHz"
  "snes#43": "Da los 5 V de toda la lógica"
  "snes#1": "en esta cara no hay ninguna pieza montada"

modelo:
  valores: {}
  calculos: {}

tarjetas:
  - id: explore-chips
    tipo: explorar
    titulo: "Los chips grandes"
    texto: "Toque la CPU, las dos PPU y la memoria de trabajo. Lea qué hace cada una."
    libro: ["snes#25", "snes#26", "snes#27", "snes#28", "snes#30"]
    requiere: { mover: [n-cpu, n-ppu1, n-ppu2] }
    widget:
      tipo: figura
      consola: { maquina: snes, foto: ntsc }
      zonas:
        - { id: n-cpu, hotspot: n-cpu, rotulo: "CPU (S-CPU B)", texto: "La CPU: un 65C816 que gobierna el bus A y el bus B." }
        - { id: n-ppu1, hotspot: n-ppu1, rotulo: "PPU1 (S-PPU1)", texto: "Lee los fondos y los sprites de la memoria de vídeo." }
        - { id: n-ppu2, hotspot: n-ppu2, rotulo: "PPU2 (S-PPU2)", texto: "Mezcla las capas, aplica la paleta y saca el RGB analógico." }
        - { id: n-wram, hotspot: n-wram, rotulo: "WRAM (S-WRAM)", texto: "La memoria de trabajo: una DRAM de 128 KB." }

  - id: toque-cpu
    tipo: tocar
    titulo: "¿Cuál es la CPU?"
    texto: "Toque el chip que gobierna los dos buses de la consola."
    libro: ["snes#26", "snes#27", "snes#28", "snes#30"]
    widget:
      tipo: figura
      consola: { maquina: snes, foto: ntsc }
      zonas:
        - { id: cpu, hotspot: n-cpu, rotulo: "Chip cuadrado, abajo a la derecha" }
        - { id: ppu1, hotspot: n-ppu1, rotulo: "Chip cuadrado, en el centro a la derecha" }
        - { id: ppu2, hotspot: n-ppu2, rotulo: "Chip cuadrado, en el centro" }
        - { id: wram, hotspot: n-wram, rotulo: "Chip alargado, abajo en el centro" }
    tocar:
      bien: [cpu]
      porque:
        ppu1: "Es la PPU1: lee la memoria de vídeo, no gobierna los buses."
        ppu2: "Es la PPU2: mezcla las capas y saca el vídeo."
        wram: "Es la WRAM, la memoria de trabajo: contesta a la CPU, no la gobierna."
    exito: "La S-CPU B, un 65C816: gobierna el bus A y el bus B."
    escalera:
      - "Lea las marcas: busque «S-CPU»."
      - "Es el chip cuadrado de abajo a la derecha, junto a la WRAM."
    solucion: "Abajo a la derecha: Nintendo S-CPU B, 5A22-02."

  - id: dos-ppu
    tipo: porque
    titulo: "Dos chips para el vídeo"
    texto: "¿Por qué la imagen pasa por dos PPU?"
    libro: ["snes#27", "snes#28"]
    widget:
      tipo: figura
      consola: { maquina: snes, foto: ntsc }
      zonas:
        - { id: n-ppu1, hotspot: n-ppu1, rotulo: "PPU1 (S-PPU1)" }
        - { id: n-ppu2, hotspot: n-ppu2, rotulo: "PPU2 (S-PPU2)" }
    opciones:
      - texto: "La PPU1 lee la memoria de vídeo y la PPU2 mezcla las capas y saca el RGB."
        bien: true
        porque: "Se reparten el trabajo: la primera busca fondos y sprites, la segunda compone el píxel y lo convierte en señal."
      - texto: "Una sirve para PAL y la otra para NTSC."
        porque: "Las dos están en todas las placas. Lo que cambia entre PAL y NTSC es una patilla de cada una, no el chip."
      - texto: "Una dibuja la mitad izquierda de la pantalla y la otra la derecha."
        porque: "No se reparten la pantalla, sino el camino: lectura de la memoria en la PPU1, mezcla y salida en la PPU2."
    escalera:
      - "Toque las dos y lea qué hace cada una."
    solucion: "La PPU1 lee fondos y sprites de la VRAM; la PPU2 mezcla las capas, aplica la paleta y saca el RGB analógico."

  - id: toque-vram
    tipo: tocar
    titulo: "La memoria de vídeo"
    texto: "La PPU1 lee 16 bits en cada acceso. Toque las dos memorias que se lo dan."
    libro: ["snes#29", "snes#30", "snes#33"]
    widget:
      tipo: figura
      consola: { maquina: snes, foto: ntsc }
      zonas:
        - { id: vram, hotspot: n-vram, rotulo: "Dos chips iguales, arriba a la derecha" }
        - { id: wram, hotspot: n-wram, rotulo: "Chip alargado, abajo en el centro" }
        - { id: aram, hotspot: n-aram, rotulo: "Dos chips, a la izquierda de la ranura" }
    tocar:
      bien: [vram]
      porque:
        wram: "Es la WRAM, la memoria de trabajo de la CPU, no la de vídeo."
        aram: "Son la ARAM, la memoria del sonido."
    exito: "Dos SRAM de 32K × 8 en paralelo: 8 bits cada una, 16 bits juntas."
    escalera:
      - "Son dos chips iguales, uno junto al otro, cerca de las PPU."
    solucion: "Arriba a la derecha: las dos GoldStar, una al lado de la otra."

  - id: explore-sonido
    tipo: explorar
    titulo: "El sonido, aparte"
    texto: "A la izquierda de la ranura está el sonido: su propia CPU, su generador y su memoria. Tóquelos."
    libro: ["snes#31", "snes#32", "snes#33"]
    requiere: { mover: [n-smp, n-dsp] }
    widget:
      tipo: figura
      consola: { maquina: snes, foto: ntsc }
      zonas:
        - { id: n-smp, hotspot: n-smp, rotulo: "CPU de sonido (S-SMP)", texto: "La CPU del sonido. Habla con la CPU principal por cuatro puertos." }
        - { id: n-dsp, hotspot: n-dsp, rotulo: "Generador de sonido (S-DSP)", texto: "Ocho voces de muestras leídas de la ARAM, con eco." }
        - { id: n-aram, hotspot: n-aram, rotulo: "ARAM", texto: "La memoria del sonido: programa, muestras y eco." }

  - id: reloj-sonido
    tipo: predecir
    titulo: "El reloj del sonido"
    texto: "El sonido tiene su resonador de 24,576 MHz. ¿A qué frecuencia va el SPC700 del S-SMP?"
    libro: ["snes#16", "snes#38"]
    widget:
      tipo: figura
      consola: { maquina: snes, foto: ntsc }
      zonas:
        - { id: n-smp, hotspot: n-smp, rotulo: "CPU de sonido (S-SMP)" }
    opciones:
      - texto: "1,024 MHz"
        bien: true
        porque: "El resonador se divide entre 24: 24,576 MHz ÷ 24 = 1,024 MHz."
      - texto: "21,477 MHz"
        porque: "Ese es el cristal del vídeo y de la CPU en una NTSC. El sonido no depende de él."
      - texto: "24,576 MHz"
        porque: "Es la frecuencia del resonador, antes de dividirla: el SPC700 va 24 veces más despacio."
    escalera:
      - "El SPC700 no va al ritmo del resonador: lo divide."
      - "Divida 24,576 MHz entre 24."
    solucion: "24,576 MHz ÷ 24 = 1,024 MHz."

  - id: empareje-chips
    tipo: pregunta
    titulo: "Cada chip, su papel"
    texto: "Empareje la marca que se lee en la foto con lo que hace."
    libro: ["snes#26", "snes#29", "snes#36", "snes#37"]
    widget:
      tipo: figura
      consola: { maquina: snes, foto: ntsc }
      zonas:
        - { id: n-cpu, hotspot: n-cpu, rotulo: "S-CPU B" }
        - { id: n-vram, hotspot: n-vram, rotulo: "GoldStar GM76C256" }
        - { id: n-rgb, hotspot: n-rgb, rotulo: "S-RGB" }
        - { id: n-cic, hotspot: n-cic, rotulo: "F411A" }
    emparejar:
      - ["S-CPU B", "El 65C816 que gobierna los dos buses"]
      - ["GoldStar GM76C256", "La memoria de vídeo"]
      - ["S-RGB", "Del RGB saca el S-vídeo y el compuesto"]
      - ["F411A", "El chip de bloqueo de las NTSC"]
    exito: "Cada marca legible dice qué chip es y, con él, qué papel tiene en la placa."
    pistas:
      - { texto: "Toque cada zona de la foto y compare su marca con la ficha del explorador." }
    escalera:
      - "Toque cada zona de la foto y lea su ficha."
    solucion: "S-CPU B: la CPU. GoldStar: la VRAM. S-RGB: el codificador de vídeo. F411A: el CIC."

  - id: toque-ntsc
    tipo: tocar
    titulo: "¿PAL o NTSC?"
    texto: "Esta placa es NTSC. Toque la pieza que lo delata por su frecuencia."
    libro: ["snes#38", "snes#37", "snes#43"]
    widget:
      tipo: figura
      consola: { maquina: snes, foto: ntsc }
      zonas:
        - { id: cristal, hotspot: n-x1, rotulo: "Pieza metálica ovalada, abajo a la derecha" }
        - { id: reg, hotspot: n-reg, rotulo: "Pieza con disipador, abajo a la izquierda" }
        - { id: wram, hotspot: n-wram, rotulo: "Chip alargado, abajo en el centro" }
    tocar:
      bien: [cristal]
      porque:
        reg: "Es el regulador de 5 V: el mismo en una PAL que en una NTSC."
        wram: "La WRAM es la misma en las dos normas."
    exito: "El cristal de 21,477 MHz: en una NTSC el reloj maestro sale de él, sin S-CLK."
    escalera:
      - "Busque la pieza que marca el ritmo de toda la placa."
    solucion: "El cristal X1 (D21G4), abajo a la derecha: 21,477 MHz, el reloj maestro NTSC."

  - id: placa-desnuda
    tipo: pregunta
    titulo: "La otra foto"
    texto: "El explorador tiene también la placa PAL del esquema. ¿Qué se ve en su cara de componentes?"
    libro: ["snes#1"]
    widget:
      tipo: figura
      consola: { maquina: snes, foto: cara-a }
      zonas:
        - { id: cpu, hotspot: cpu, rotulo: "Sitio de la CPU (U1)" }
    opciones:
      - texto: "Los pads y la serigrafía: la placa está desnuda."
        bien: true
        porque: "Es un escaneo de la placa sin ninguna pieza: cada recuadro marca dónde va una pieza, no la pieza."
      - texto: "Los mismos chips que en la foto NTSC."
        porque: "En esa cara no hay ninguna pieza montada: se ven los sitios de los chips, no los chips."
      - texto: "Solo las resistencias y los condensadores pequeños."
        porque: "Esos están en la otra cara, la de soldadura. La de componentes, en esa foto, no tiene ninguna pieza."
    escalera:
      - "Mire la foto: ¿hay algún chip negro?"
    solucion: "Ninguna pieza: se ven los pads y la serigrafía (U1, U2…)."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: ["snes#26", "snes#28", "snes#31", "snes#38"]
    ideas:
      - { titulo: "La CPU.", texto: "Un 65C816 que gobierna el bus A y el bus B." }
      - { titulo: "Dos PPU.", texto: "La PPU1 lee la memoria de vídeo; la PPU2 mezcla y saca el RGB." }
      - { titulo: "El sonido, aparte.", texto: "Su propia CPU, su generador y su memoria, con su reloj." }
      - { titulo: "La norma.", texto: "El cristal de 21,477 MHz delata una NTSC." }
