# «Consolas por dentro» · Super Nintendo 2: la alimentación. El camino de la placa PAL del esquema (J1 → T1 → DB1 → F1 →
# C67 → 7805), el dropout del 78xx y la potencia que disipa (libro, sección 8.4), los +9 V del audio, y lo que se ve en
# la foto NTSC. Fuentes: los datos de la consola (snes#n), el adaptador SNS-002 (Chromagi) y el libro.
# 1.2.1 (piloto121, «aprender haciendo», GUIA §13): las piezas se tocan en la foto (las tres de la alimentación, y el
# camino de la corriente en su orden); el 7805 es un circuito vivo (esquema «regulador-lineal»: elemento de paso,
# referencia de 5 V y amplificador de error, sin divisor, con 2 V de dropout) sobre el que se mide con el multímetro la
# caída y la corriente, se escribe el calor que disipa, se toca la pieza que lo disipa y se sube la entrada hasta que
# regula. La carga de ejemplo pide los 850 mA del adaptador.
leccion: consola-snes/snes-alimentacion

libro:
  "snes#22": "Toma de corriente, filtro (T1), puente rectificador (DB1: acepta continua o alterna)"
  "snes#23": "El interruptor de encendido corta la entrada entre el fusible y el regulador"
  "snes#43": "Un 7805, que según Fabien Sanglard está en todas las versiones de la SNES"
  "snes#44": "El electrolítico grande de la alimentación, junto al regulador"
  "snes#45": "Rápido, de 1,5 A en las SNES originales"
  "snes#54": "saca de la entrada sin regular unos +9 V limpios"
  "snes#122": "da 10 V de continua y 850 mA"
  "cap08#65": "P_(\"disipada\")"
  "cap08#66": "Más de la mitad de la energía se convierte en calor"
  "cap08#67": "necesita unos 2 V de diferencia entre entrada y salida para funcionar"
  "cap08#83": "protección térmica (que los apaga por encima de unos 150 °C de unión)"
  "snes#110": "axial, rápido, de 125 V y 1,5 A; no se debe poner uno lento"
  "cap10#83": "Uno lento (temporizado) de la misma corriente aguanta diez veces su valor"

modelo:
  valores:
    V_in: { sim: "V_{entrada}", nombre: "tensión en la entrada del 7805", unidad: V, valor: 5 }
    V_ad: { sim: "V_{adaptador}", nombre: "tensión del adaptador", unidad: V, valor: 10 }
    V_o: { sim: "V_{salida}", nombre: "salida del 7805", unidad: V, valor: 5 }
    I: { sim: "I", nombre: "corriente de la consola", unidad: A, valor: 0.5 }
    V_dr: { sim: "V_{do}", nombre: "dropout del 78xx", unidad: V, valor: 2 }
    R_c: { sim: "R_{L}", nombre: "carga de ejemplo (la consola): la que pide los 850 mA", unidad: Ω, valor: 5.882352941176471 }
    on_c: { tipo: interruptor, nombre: "consola encendida", valor: 1 }
  calculos:
    V_reg: { expr: "min(V_o, max(0, V_in - V_dr))", sim: "V_{salida}", nombre: "tensión de salida del 7805 (modelo)", unidad: V, cifras: 3 }
    I_reg: { si: on_c, entonces: "V_reg/R_c", sino: "0", sim: "I", nombre: "corriente del 7805 al subir la entrada", unidad: A }
    P_d: { expr: "(V_ad - V_o)*I", sim: "P_{disipada}", nombre: "potencia que disipa el 7805", unidad: W, cifras: 3 }
    V_sa: { expr: "min(V_o, V_ad - V_dr)", sim: "V_{salida}", nombre: "salida del 7805 con el adaptador", unidad: V }
    I_a: { si: on_c, entonces: "V_sa/R_c", sino: "0", sim: "I", nombre: "corriente con el adaptador", unidad: A }
    V_pa: { expr: "V_ad - V_sa", sim: "V_{entrada} − V_{salida}", nombre: "caída en el 7805", unidad: V }
    P_a: { expr: "V_pa*I_a", sim: "P_{disipada}", nombre: "calor que disipa el 7805 con el adaptador", unidad: W, cifras: 3 }
    P_mal: { expr: "V_ad*I_a", sim: "V · I", nombre: "los 10 V enteros por la corriente", unidad: W }

tarjetas:
  - id: explore-alim
    tipo: tocar
    titulo: "La alimentación en la foto"
    texto: "En la placa NTSC, toque las tres piezas de la alimentación: el fusible, el condensador de filtrado y el regulador."
    libro: ["snes#43", "snes#44", "snes#45"]
    widget:
      tipo: figura
      consola: { maquina: snes, foto: ntsc }
      zonas:
        - { id: n-fusible, hotspot: n-fusible, rotulo: "Pieza alargada, abajo del todo" }
        - { id: n-filtro, hotspot: n-filtro, rotulo: "Cilindro, abajo a la izquierda" }
        - { id: n-reg, hotspot: n-reg, rotulo: "Pieza con disipador, abajo" }
        - { id: n-rf, hotspot: n-rf, rotulo: "Caja metálica, a la izquierda" }
        - { id: n-x1, hotspot: n-x1, rotulo: "Pieza pequeña, abajo a la derecha" }
        - { id: n-cic, hotspot: n-cic, rotulo: "Chip pequeño, arriba a la derecha" }
    tocar:
      bien: [n-fusible, n-filtro, n-reg]
      todas: true
      porque:
        n-rf: "Es el modulador de RF: lleva el vídeo a la entrada de antena del televisor."
        n-x1: "Es el cristal: da el reloj, no la alimentación."
        n-cic: "Es el CIC, el chip del bloqueo regional."
    exito: "El fusible F1, rápido; el electrolítico C58, junto al regulador; y el 7805, con su disipador, que da los 5 V de toda la lógica."
    escalera:
      - "Las tres están juntas, abajo a la izquierda del centro."
    solucion: "La pieza alargada de abajo del todo, el cilindro y la pieza con disipador."

  - id: ordene-camino
    tipo: tocar
    fase: "Ordene"
    titulo: "El camino de la corriente"
    texto: "En la placa PAL del esquema, toque las piezas en el orden en que las recorre la corriente, de la toma al regulador."
    libro: ["snes#22", "snes#23"]
    widget:
      tipo: figura
      consola: { maquina: snes, foto: cara-a }
      zonas:
        - { id: j1, rect: [12, 1212, 106, 68], rotulo: "Toma de corriente (J1)" }
        - { id: t1, rect: [138, 1170, 54, 62], rotulo: "Filtro (T1)" }
        - { id: db1, rect: [334, 1101, 86, 86], rotulo: "Puente rectificador (DB1)" }
        - { id: f1, rect: [345, 1298, 86, 52], rotulo: "Fusible (F1)" }
        - { id: c67, rect: [400, 998, 134, 100], rotulo: "Condensador de filtrado (C67)" }
        - { id: u12, rect: [394, 1236, 112, 46], rotulo: "Regulador 7805 (U12)" }
    tocar:
      bien: [j1, t1, db1, f1, c67, u12]
      orden: true
    pistas:
      - { texto: "Lo primero es la toma; lo último, el regulador de 5 V. El puente va antes que el fusible." }
    exito: "Toma, filtro, puente, fusible, condensador y regulador: el interruptor corta entre el fusible y el regulador."
    escalera:
      - "Lo primero es la toma; lo último, el regulador de 5 V."
      - "Después de la toma viene el filtro T1 y después el puente DB1."
    solucion: "J1, T1, DB1, F1, C67 y U12."

  - id: mida-caida
    tipo: medir
    titulo: "Lo que sobra"
    texto: "El 7805 recibe los 10 V del adaptador y da 5 V. Ponga las puntas del multímetro para medir lo que cae en él."
    nota: "El 7805 por dentro: elemento de paso, referencia y amplificador de error."
    libro: ["snes#122", "snes#43", "cap08#67"]
    fijar: { V_ad: 10, V_o: 5, on_c: 1 }
    widget:
      tipo: circuito
      esquema: regulador-lineal
      piezas: { entrada: V_ad, ref: V_o, dropout: V_dr, carga: R_c, interruptor: on_c }
      corriente: I_a
      mide: { vout: V_sa, iin: I_a, iout: I_a, icarga: I_a, vpaso: V_pa, p_paso: P_a }
      instrumento:
        tipo: multimetro
        modos: [V]
        puntos: { in: "Entrada del 7805", out: "Salida del 7805", "0": "Masa" }
      mandos: []
    medir:
      magnitud: tension
      entre: [in, out]
      valor: V_pa
      porque:
        "in/0": "Así mide la entrada respecto a masa: los 10 V del adaptador."
        "out/0": "Así mide la salida respecto a masa: los 5 V regulados."
    exito: "5 V: lo que sobra entre los 10 V del adaptador y los 5 V de la lógica."
    escalera:
      - "Lo que cae en el 7805 se mide entre sus dos patas: la entrada y la salida."
    solucion: "Roja en la entrada y negra en la salida del 7805."

  - id: por-que-disipador
    tipo: leer
    titulo: "El disipador del 7805"
    texto: "La consola pide los 850 mA del adaptador. Mida la corriente que pasa por el 7805 y escriba el calor que disipa."
    libro: ["cap08#65", "snes#122", "cap08#83"]
    fijar: { V_ad: 10, V_o: 5, on_c: 1 }
    widget:
      tipo: circuito
      esquema: regulador-lineal
      piezas: { entrada: V_ad, ref: V_o, dropout: V_dr, carga: R_c, interruptor: on_c }
      corriente: I_a
      mide: { vout: V_sa, iin: I_a, iout: I_a, icarga: I_a, vpaso: V_pa, p_paso: P_a }
      instrumento:
        tipo: multimetro
        puntos: { in: "Entrada del 7805", out: "Salida del 7805", "0": "Masa" }
        ramas: { vmi: "Entre el adaptador y el 7805", vml: "Hacia la consola" }
      mandos: []
    leer:
      objetivo: P_a
      unidad: W
      rotulo: "Calor en el 7805"
      errores:
        - { expr: "P_mal", texto: "Ha multiplicado los 10 V enteros. El 7805 solo quema la diferencia entre entrada y salida." }
    exito: "(10 − 5) V · 0,85 A = 4,25 W: por eso lleva disipador. Sin él, se calienta hasta su protección térmica."
    escalera:
      - "El calor es la caída en el 7805 por la corriente que lo atraviesa."
      - "La caída la midió en la tarjeta anterior: 10 − 5 = 5 V."
    solucion: "(10 − 5) V · 0,85 A = 4,25 W."
    comprobar:
      - { P_a: 4.25, I_a: 0.85, V_pa: 5, P_mal: 8.5 }

  - id: elija-paso
    tipo: elegir
    titulo: "¿Quién se calienta?"
    texto: "Ese calor sale de una sola pieza: la que va en serie con la consola y se queda la diferencia. Tóquela en el esquema."
    libro: ["cap08#65", "cap08#66"]
    fijar: { V_ad: 10, V_o: 5, on_c: 1 }
    widget:
      tipo: circuito
      esquema: regulador-lineal
      piezas: { entrada: V_ad, ref: V_o, dropout: V_dr, carga: R_c, interruptor: on_c }
      corriente: I_a
      mide: { vout: V_sa, iin: I_a, iout: I_a, icarga: I_a, vpaso: V_pa, p_paso: P_a }
      mandos: []
    elegir:
      zonas: { paso: "Transistor de arriba", ao: "Triángulo del centro", entrada: "Fuente de la izquierda", carga: "Resistencia de la derecha" }
      bien: [paso]
      porque:
        ao: "Es el amplificador de error: compara la salida con la referencia y gobierna el paso, pero apenas lleva corriente."
        entrada: "Es el adaptador: entrega la energía, no la quema."
        carga: "Es la consola: la que usa los 5 V."
    exito: "El elemento de paso: en serie con la carga, lleva toda la corriente con la diferencia de tensión encima."
    escalera:
      - "Busque la pieza que está entre la entrada y la salida, por la que pasa toda la corriente."
    solucion: "El transistor de arriba, el elemento de paso."

  - id: formula-disipa
    tipo: formula
    titulo: "Lo que sobra, en calor"
    texto: "Con el adaptador de 10 V, el 7805 quema la diferencia por la corriente. Mueva la corriente."
    libro: ["cap08#65", "cap08#66", "snes#122"]
    ec: "cap08#65"
    sustitucion: "({{V_ad}} − {{V_o}}) · {{I}} = {{P_d}}"
    widget:
      tipo: grafica
      x: { id: i, min: 0, max: 0.85, unidad: A, rotulo: "I" }
      y: { min: 0, max: 5, unidad: W, rotulo: "P_{disipada}" }
      curvas:
        - { expr: "(V_ad - V_o)*i", color: naranja, rotulo: "P_{disipada}" }
      marcas:
        - { x: "I", y: "P_d", rotulo: "{{P_d}}" }
      mandos: [ { valor: I, min: 0.05, max: 0.85, paso: 0.05, rotulo: "Corriente, I" } ]

  - id: ajuste-dropout
    tipo: explorar
    titulo: "¿Cuánta entrada necesita?"
    texto: "El 78xx necesita unos 2 V más en la entrada que en la salida. Suba la entrada hasta que el 7805 dé sus 5 V."
    libro: ["cap08#67", "snes#43"]
    fijar: { V_o: 5, on_c: 1 }
    inicio: { V_in: 5 }
    widget:
      tipo: circuito
      esquema: regulador-lineal
      piezas: { entrada: V_in, ref: V_o, dropout: V_dr, carga: R_c, interruptor: on_c }
      lectura: { valor: V_reg, rotulo: "Salida del 7805" }
      corriente: I_reg
      mide: { vout: V_reg, iin: I_reg, iout: I_reg, icarga: I_reg }
      mandos: [ { valor: V_in, min: 5, max: 10, paso: 0.5, rotulo: "Entrada, V_{entrada}" } ]
    objetivo:
      condiciones:
        - { valor: V_reg, mayor: 4.99, rotulo: "Salida: {{V_reg}}" }
      logrado: "Con {{V_in}} en la entrada ya da sus 5 V: la entrada supera la salida en unos 2 V."
      pistas:
        - { texto: "Todavía no regula: a la entrada le faltan voltios. Súbala." }
    escalera:
      - "Salida + margen: 5 + 2."
    solucion: "Con 7 V o más en la entrada."
    comprobar:
      - { con: { V_in: 7 }, V_reg: 5 }

  - id: toque-9v
    tipo: tocar
    titulo: "El segundo raíl"
    texto: "El audio va con +9 V sacados de la entrada sin regular. Toque el transistor que los da, en la cara de soldadura."
    libro: ["snes#54"]
    widget:
      tipo: figura
      consola: { maquina: snes, foto: cara-b }
      zonas:
        - { id: nueve, hotspot: b-9v, rotulo: "Abajo, en el centro a la derecha" }
        - { id: rgb, hotspot: b-rgb, rotulo: "En el centro, a la izquierda" }
        - { id: mandos, hotspot: b-mandos, rotulo: "Abajo a la izquierda" }
    tocar:
      bien: [nueve]
      porque:
        rgb: "Son los amplificadores RGB del vídeo."
        mandos: "Son los diodos que protegen los puertos de mando."
    exito: "Q18: con la base filtrada, saca de la entrada sin regular unos +9 V limpios para el audio."
    escalera:
      - "Busque un transistor solo, cerca de la etapa de audio."
    solucion: "Q18 (2SC5658), con R76, C64 y DA11."

  - id: por-que-puente
    tipo: porque
    titulo: "Un puente con continua"
    texto: "¿Para qué lleva un puente rectificador una consola cuyo adaptador ya da continua?"
    libro: ["snes#22", "snes#122"]
    widget:
      tipo: figura
      consola: { maquina: snes, foto: cara-a }
      zonas:
        - { id: alim, hotspot: alim, rotulo: "Alimentación (J1, T1, DB1, F1, C67, U12)" }
    opciones:
      - texto: "Para aceptar continua o alterna, sin importar cómo llegue."
        bien: true
        porque: "El puente DB1 deja pasar la entrada sea cual sea su forma: la consola acepta continua o alterna."
      - texto: "Para subir la tensión del adaptador."
        porque: "Un puente rectificador no sube la tensión: la rectifica. Lo que llega al regulador nunca es mayor que lo que entra."
      - texto: "Para filtrar el ruido de la red."
        porque: "De filtrar se encargan el filtro T1 y el condensador C67; el puente no filtra."
    escalera:
      - "Piense en qué pasa si llega alterna en vez de continua."
    solucion: "DB1 acepta continua o alterna: la placa funciona con cualquiera de las dos."

  - id: fusible-rapido
    tipo: pregunta
    titulo: "El fusible"
    texto: "El fusible F1 de las SNES originales es rápido, de 1,5 A. ¿Qué pasa si se pone uno lento?"
    libro: ["snes#45", "snes#110", "cap10#83"]
    widget:
      tipo: figura
      consola: { maquina: snes, foto: ntsc }
      zonas:
        - { id: n-fusible, hotspot: n-fusible, rotulo: "Fusible F1" }
    opciones:
      - texto: "Un cortocircuito tarda más en abrirlo y la placa sufre más."
        bien: true
        porque: "Uno lento aguanta muchas veces su corriente durante más tiempo: deja pasar el corto mientras se calienta lo que no debe."
      - texto: "Nada: la corriente nominal es la misma."
        porque: "La corriente nominal es la misma, pero el tiempo en fundir ante un corto no: el lento tarda mucho más."
      - texto: "Se funde antes y la consola se apaga sin motivo."
        porque: "Es al revés: el lento tarda más en fundir. Por eso no protege igual."
    escalera:
      - "Compare cuánto tarda cada tipo en fundir con diez veces su corriente."
    solucion: "No se debe poner uno lento: tarda más en abrir un corto y no protege la placa."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: ["snes#22", "cap08#67", "cap08#65", "snes#54"]
    ideas:
      - { titulo: "El camino.", texto: "Toma, filtro, puente, fusible, condensador y regulador 7805." }
      - { titulo: "El margen.", texto: "El 78xx necesita unos 2 V más en la entrada que en la salida." }
      - { titulo: "El calor.", texto: "Disipa (entrada − salida) · corriente: por eso lleva disipador." }
      - { titulo: "Dos raíles.", texto: "5 V regulados para la lógica y +9 V para el audio." }
