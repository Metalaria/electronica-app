# Lección 1.1 de la sección 3.4 «Tipos de Condensadores» (cap03): MLCC de clase I y II (estabilidad, polarización
# DC, zumbido piezoeléctrico), electrolíticos de aluminio (polaridad, regla de los 10 °C, 50–80 % de la tensión),
# película, tántalo y supercondensadores, y cómo se reconocen. Sección cualitativa, sin fórmula: la parte viva es la
# vida frente a la temperatura del ejercicio 3.6. Formato: contenido/lecciones11/GUIA.md.
# 1.2.1 (autor121-fund, «aprender haciendo», GUIA §13): enfriar un electrolítico hasta cuadruplicar su vida,
# predecir 95 °C y 70 °C, calcular lo que queda de un X7R y de un Y5V, tocar en la foto los que no tienen polaridad y
# elegir la tensión nominal de trabajo; se eligen las familias, el porqué del electrolítico y el zumbido.
leccion: cap03/sec-3.4

libro:
  45: "La elección del tipo de condensador es tan importante como la del valor"
  48: "variación de hasta −82 %"
  49: "un MLCC de 10 µF puede comportarse como 3 µF a su tensión de trabajo"
  51: "Su dieléctrico es una finísima capa de óxido formada electrolíticamente"
  52: "conviene trabajar entre el 50 y el 80 % de la tensión máxima especificada"
  53: "por cada 10 °C de aumento de temperatura, la vida útil se reduce a la mitad"
  55: "El polipropileno, en particular, es la elección para audio de alta fidelidad"
  57: "pueden incendiarse si se invierte la polaridad o se supera la tensión"
  60: "los electrolíticos marcan el negativo; los de tántalo, el positivo"
  "cap03#8": 'C = ε_("0") dot.op ε_("r") dot.op (A)/(d)'
  "cap03#99": "Si su vida es de 2000 horas a 105 °C, estima su vida a 70 °C"
  "cap03#11": "con una capa de óxido crecida electroquímicamente"

modelo:
  valores:
    L_0: { sim: "L₀", nombre: "vida nominal", unidad: h, valor: 2000 }
    T_n: { sim: "T_{nom}", nombre: "temperatura de la vida nominal", unidad: "°C", valor: 105 }
    T_a: { sim: "T", nombre: "temperatura de trabajo", unidad: "°C", valor: 105 }
    C_y: { sim: "C", nombre: "capacidad nominal", unidad: F, valor: 10e-6 }
    perd: { sim: "pérdida", nombre: "capacidad perdida", unidad: "%", valor: 82 }
    V_w: { sim: "V_{trabajo}", nombre: "tensión del circuito", unidad: V, valor: 12 }
    V_nom: { sim: "V_{nom}", nombre: "tensión nominal elegida", unidad: V, valor: 35 }
  calculos:
    vida: { expr: "L_0*2^((T_n - T_a)/10)", sim: "L", nombre: "vida estimada", unidad: h, cifras: 3 }
    factor: { expr: "2^((T_n - T_a)/10)", sim: "factor", nombre: "factor de vida", unidad: "veces", cifras: 3 }
    C_ef: { expr: "C_y*(1 - perd/100)", sim: "C_{ef}", nombre: "capacidad que queda", unidad: F }
    queda: { expr: "100 - perd", sim: "queda", nombre: "fracción que queda", unidad: "%", cifras: 2 }
    uso_v: { expr: "V_w/V_nom*100", sim: "uso", nombre: "fracción de la tensión nominal", unidad: "%", cifras: 2 }

tarjetas:
  - id: explore-vida
    tipo: explorar
    titulo: "El calor gasta un electrolítico"
    texto: "Un electrolítico dura 2000 horas a 105 °C. Enfríelo hasta que viva cuatro veces más."
    nota: "Su electrolito se evapora poco a poco, y el calor lo acelera."
    libro: [53, "cap03#99"]
    inicio: { T_a: 105 }
    widget:
      tipo: grafica
      x: { id: tt, min: 65, max: 105, unidad: "°C", rotulo: "T" }
      y: { min: 0, max: 35000, unidad: h, rotulo: "vida" }
      curvas:
        - { expr: "L_0*2^((T_n - tt)/10)", color: naranja, rotulo: "vida" }
      asas:
        - { mueve: T_a, x: "T_a", y: "vida", rotulo: "Temperatura de trabajo" }
      lectura: { valor: vida, rotulo: "Vida estimada" }
      datos:
        - { valor: factor, rotulo: "{{factor}} la nominal" }
      mandos:
        - { valor: T_a, min: 65, max: 105, paso: 5, rotulo: "Temperatura, T" }
    objetivo:
      condiciones:
        - { valor: factor, objetivo: 4, tol: 0.02, rotulo: "{{factor}} la nominal" }
      logrado: "A {{T_a}}, {{vida}}: por cada 10 °C menos, la vida se duplica."
      pistas:
        - { cuando: { valor: factor, mayor: 4.1 }, texto: "Se ha pasado: suba un poco la temperatura." }
        - { texto: "Todavía falta: enfríelo más." }
    escalera:
      - "Cuatro veces son dos duplicaciones: dos pasos de 10 °C."
    solucion: "A 85 °C: 8000 horas."
    comprobar:
      - { vida: 2000 }
      - { con: { T_a: 85 }, vida: 8000, factor: 4 }

  - id: prediga-diez-grados
    tipo: simular
    titulo: "Prediga a 95 °C"
    texto: "Un electrolítico de 2000 horas a 105 °C trabaja a 95 °C, 10 °C por debajo. ¿Cuánto vivirá?"
    libro: [53, "cap03#99"]
    fijar: { T_a: 95 }
    widget:
      tipo: grafica
      x: { id: tt, min: 65, max: 105, unidad: "°C", rotulo: "T" }
      y: { min: 0, max: 35000, unidad: h, rotulo: "vida" }
      curvas:
        - { expr: "L_0*2^((T_n - tt)/10)", color: naranja, rotulo: "vida" }
      marcas:
        - { x: "T_a", y: "vida", rotulo: "95 °C" }
      lectura: { valor: vida, rotulo: "Vida estimada" }
      ocultar: curvas
    simular:
      objetivo: vida
      unidad: h
      tol: 0.02
      rotulo: "Vida a 95 °C"
      errores:
        - { razon: { min: 0.24, max: 0.26 }, texto: "Es al revés: el calor acorta la vida. Al enfriarse 10 °C, se duplica." }
        - { razon: { min: 0.49, max: 0.51 }, texto: "La vida depende mucho de la temperatura: cada 10 °C la cambian por dos." }
    exito: "4000 horas: cada 10 °C menos, la vida se duplica."
    escalera:
      - "Cada 10 °C menos de temperatura, la vida se duplica."
    solucion: "El doble de 2000 horas: 4000 horas."
    comprobar:
      - { vida: 4000 }
      - { con: { T_a: 105 }, vida: 2000 }
  - id: estime-setenta
    tipo: simular
    fase: "Estime"
    titulo: "A 70 °C"
    texto: "Un electrolítico de 2000 horas a 105 °C funciona a 70 °C. ¿Cuánto vive, con la regla de los 10 °C?"
    libro: ["cap03#99"]
    fijar: { T_a: 70 }
    simular:
      objetivo: vida
      unidad: h
      tol: 0.05
      rotulo: "Vida a 70 °C"
      errores:
        - { razon: { min: 0.3, max: 0.32 }, texto: "Ha multiplicado por 3,5 en lugar de duplicar 3,5 veces: 2^{3,5}." }
        - { razon: { min: 1.4, max: 1.43 }, texto: "Se ha pasado: 2^{3,5} es algo más de 11, no 16." }
    exito: "35 °C menos son 3,5 pasos: 2^{3,5} ≈ 11,3, unas 22 600 horas. Más frío, mucha más vida."
    pistas:
      - { cuando: { valor: estimacion, menor: 21500 }, texto: "Se ha quedado corto: 35 °C son tres pasos y medio de 10 °C, y cada uno duplica." }
      - { texto: "Se ha pasado: 2^{3,5} es algo más de 11, no 16." }
    escalera:
      - "Cuente cuántos pasos de 10 °C hay de 105 °C a 70 °C."
    solucion: "2000 × 2^{3,5} ≈ 22 600 horas."
    comprobar:
      - { vida: 22627, factor: 11.3 }
  - id: familias
    tipo: pregunta
    fase: "Empareje"
    titulo: "Cada familia, su sitio"
    texto: "La elección del tipo es tan importante como la del valor. Una cada condensador con su uso típico."
    libro: [45, 48, 51, 55, 57]
    emparejar:
      - ["Cerámico C0G", "Osciladores y temporización"]
      - ["Cerámico X7R", "Desacoplo y filtrado general"]
      - ["Electrolítico de aluminio", "Filtrado de fuentes"]
      - ["Película de polipropileno", "Audio y circuitos resonantes"]
      - ["Supercondensador", "Respaldo de memoria"]
    exito: "Eso es. El C0G es estable pero de poco valor; el X7R, mayor pero varía ±15 % con la temperatura."
    pistas:
      - { texto: "Donde el valor tiene que ser estable va la clase I; donde hacen falta miles de µF, el electrolítico." }
    escalera:
      - "Piense en lo que pide cada uso: estabilidad, mucha capacidad o pocas pérdidas."
    solucion: "Cerámico C0G: osciladores y temporización. Cerámico X7R: desacoplo y filtrado general. Electrolítico de aluminio: filtrado de fuentes. Película de polipropileno: audio y circuitos resonantes. Supercondensador: respaldo de memoria."

  - id: polarizacion-dc
    tipo: simular
    titulo: "La capacidad que falta"
    texto: "Un MLCC X7R marcado 10 µF pierde un 70 % de su capacidad a su tensión de trabajo. ¿Qué capacidad tiene de verdad?"
    libro: [49]
    fijar: { C_y: 10e-6, perd: 70 }
    widget:
      tipo: figura
      figura: fig-3.10
      zonas:
        - { id: polarizacion, rotulo: "Capacidad frente a la tensión continua", rect: [0, 0, 439, 203] }
    simular:
      objetivo: C_ef
      unidad: F
      tol: 0.03
      rotulo: "Capacidad a la tensión de trabajo"
      errores:
        - { razon: { min: 3.2, max: 3.4 }, texto: "La tolerancia se mide sin tensión. Con la de trabajo, un clase II pierde buena parte de su valor." }
        - { razon: { min: 2.3, max: 2.4 }, texto: "Ese es el 70 % que pierde. Queda el resto." }
    exito: "Unos 3 µF: es la polarización DC, que sorprende a muchos diseñadores. Los clase II, además, zumban: son piezoeléctricos."
    escalera:
      - "Le queda el 30 % de 10 µF."
    solucion: "El 30 % de 10 µF: 3 µF."
    comprobar:
      - { C_ef: 3e-6, queda: 30 }
  - id: estime-y5v
    tipo: simular
    fase: "Estime"
    titulo: "Un Y5V"
    texto: "Los Y5V dan la máxima capacidad por volumen, pero varían hasta un −82 %. ¿Cuánto puede quedar de 10 µF?"
    libro: [48]
    fijar: { C_y: 10e-6, perd: 82 }
    simular:
      objetivo: C_ef
      unidad: F
      tol: 0.06
      rotulo: "Capacidad que queda"
      errores:
        - { razon: { min: 4.4, max: 4.7 }, texto: "Ese es el 82 % que pierde. Queda el 18 %." }
    exito: "1,8 µF: menos de la quinta parte. Por eso solo sirven para aplicaciones no críticas."
    pistas:
      - { cuando: { valor: estimacion, mayor: 1.9e-6 }, texto: "Se ha pasado: si pierde el 82 %, solo queda el 18 %." }
      - { texto: "Se ha quedado corto: queda el 18 % de 10 µF." }
    escalera:
      - "Reste la pérdida al 100 % y aplique lo que queda a 10 µF."
    solucion: "El 18 % de 10 µF: 1,8 µF."
    comprobar:
      - { C_ef: 1.8e-6, queda: 18 }
  - id: por-que-electrolitico
    tipo: porque
    titulo: "¿Por qué tanta capacidad?"
    texto: "Un electrolítico da miles de µF en poco volumen. Con C = ε₀·εr·A/d, ¿de dónde la saca?"
    libro: [51, "cap03#11"]
    opciones:
      - texto: "De una d minúscula: una capa de óxido finísima"
        bien: true
        porque: "El óxido crecido electroquímicamente separa las placas unos nanómetros: d diminuta, capacidad enorme."
      - texto: "De una εr altísima, como la de los cerámicos"
        porque: "Esa es la vía de los cerámicos de clase II. El electrolítico juega con la separación."
      - texto: "Del electrolito, que conduce la carga"
        porque: "El electrolito hace de placa; el dieléctrico es el óxido, y es su delgadez lo que da la capacidad."
    ec: "cap03#8"
    escalera:
      - "De las tres, εr, A y d, ¿cuál puede hacerse diminuta?"
    solucion: "De una d minúscula: una capa de óxido finísima, crecida electroquímicamente."

  - id: polaridad
    tipo: tocar
    titulo: "Sin polaridad"
    texto: "Un electrolítico al revés puede explotar, y un tántalo, incendiarse. Toque los dos tipos que se pueden montar en cualquier sentido."
    libro: [52, 57, 60]
    widget:
      tipo: figura
      figura: fig-3.2
      zonas:
        - { id: a, rotulo: "Arriba a la izquierda", rect: [0, 0, 615, 305] }
        - { id: b, rotulo: "Arriba en el centro", rect: [648, 0, 460, 305] }
        - { id: c, rotulo: "Arriba a la derecha", rect: [1140, 0, 460, 305] }
        - { id: d, rotulo: "Abajo a la izquierda", rect: [117, 380, 762, 762] }
        - { id: e, rotulo: "Abajo a la derecha", rect: [911, 380, 573, 762] }
    tocar:
      bien: [b, d]
      todas: true
      porque:
        a: "Electrolíticos de aluminio: polarizados. La franja clara marca el negativo."
        c: "Junto a los MLCC hay tántalos, polarizados: su franja marca el positivo, al revés que el aluminio."
        e: "Un electrolítico de potencia: polarizado."
    exito: "El cerámico de disco y el de película no tienen polaridad. Los electrolíticos marcan el negativo; los de tántalo, el positivo."
    escalera:
      - "Los electrolíticos y los tántalos tienen polaridad; los cerámicos y los de película, no."
    solucion: "El cerámico de disco y el de película."
  - id: zumbido
    tipo: pregunta
    titulo: "Una fuente que zumba"
    texto: "Una fuente conmutada emite un zumbido audible. ¿Qué componente puede ser?"
    libro: [49]
    opciones:
      - texto: "Un MLCC de clase II, que es piezoeléctrico"
        bien: true
        porque: "Vibra con la tensión alterna del rizado: son los «singing capacitors»."
      - texto: "Un cerámico C0G"
        porque: "El zumbido es de los clase II (X7R, Y5V): son piezoeléctricos. Los clase I son los estables."
      - texto: "Un condensador de película"
        porque: "Son estables y de pérdidas muy bajas. Los que vibran son los MLCC de clase II."
    widget:
      tipo: figura
      figura: fig-3.6
      zonas:
        - { id: tipos, rotulo: "Tipos de condensadores", rect: [0, 0, 1600, 1219] }
    escalera:
      - "¿Qué cerámicos son piezoeléctricos: los de clase I o los de clase II?"
    solucion: "Un MLCC de clase II: vibra con la tensión alterna del rizado. Son los «singing capacitors»."

  - id: tension-trabajo
    tipo: explorar
    titulo: "Margen de tensión"
    texto: "Un electrolítico para un circuito de 12 V. Elija su tensión nominal para que trabaje entre el 50 y el 80 % de ella."
    libro: [52, "cap03#99"]
    fijar: { V_w: 12 }
    inicio: { V_nom: 35 }
    widget:
      tipo: grafica
      x: { id: vv, min: 0, max: 40, unidad: V, rotulo: "V_{nom}" }
      y: { min: 0, max: 130, unidad: "%", rotulo: "uso" }
      curvas:
        - { expr: "V_w/max(vv, 1)*100", color: naranja, rotulo: "12 V en % de la nominal" }
        - { expr: "80", color: tinta, rotulo: "80 %", discontinua: true }
        - { expr: "50", color: tinta, rotulo: "50 %", discontinua: true }
      lectura: { valor: uso_v, rotulo: "Trabaja al" }
      mandos:
        - { valor: V_nom, lista: [10, 16, 25, 35], rotulo: "Tensión nominal" }
    objetivo:
      condiciones:
        - { valor: uso_v, min: 50, max: 80, rotulo: "Trabaja al {{uso_v}}" }
      logrado: "De {{V_nom}}, al {{uso_v}}: dentro, aunque ajustado. Nunca debe superarse, y trabajar más abajo alarga su vida."
      pistas:
        - { cuando: { valor: uso_v, mayor: 80 }, texto: "Demasiado cerca de su máximo: elija una nominal mayor." }
        - { texto: "Demasiado holgado para la regla: elija una nominal menor." }
    escalera:
      - "Calcule qué fracción de cada nominal son 12 V."
    solucion: "16 V: un 75 %."
    comprobar:
      - { uso_v: 34.29 }
      - { con: { V_nom: 16 }, uso_v: 75 }
  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [48, 49, 52, 53, 60]
    ideas:
      - { titulo: "Cerámicos.", texto: "C0G, estables y de poco valor; X7R e Y5V, más capacidad, pero varían y pierden con la tensión." }
      - { titulo: "Electrolíticos.", texto: "Mucha capacidad, polarizados; la vida se reduce a la mitad por cada 10 °C más." }
      - { titulo: "Margen.", texto: "Trabajar entre el 50 y el 80 % de la tensión nominal." }
      - { titulo: "Polaridad.", texto: "Aluminio, franja en el negativo; tántalo, en el positivo." }
