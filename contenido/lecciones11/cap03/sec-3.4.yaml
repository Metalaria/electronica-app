# Lección 1.1 de la sección 3.4 «Tipos de Condensadores» (cap03): MLCC de clase I y II (estabilidad, polarización
# DC, zumbido piezoeléctrico), electrolíticos de aluminio (polaridad, regla de los 10 °C, 50–80 % de la tensión),
# película, tántalo y supercondensadores, y cómo se reconocen. Sección cualitativa, sin fórmula: la parte viva es la
# vida frente a la temperatura del ejercicio 3.6. Formato: contenido/lecciones11/GUIA.md.
leccion: cap03/sec-3.4

libro:
  45: "La elección del tipo de condensador es tan importante como la del valor"
  48: "variación de hasta −82 %"
  49: "un MLCC de 10 µF puede comportarse como 3 µF a su tensión de trabajo"
  51: "Su dieléctrico es una finísima capa de óxido formada electrolíticamente"
  52: "conviene trabajar entre el 50 y el 80 % de la tensión máxima especificada"
  53: "por cada 10 °C de aumento de temperatura, la vida útil se reduce a la mitad"
  55: "El polipropileno, en particular, es la elección para audio de alta fidelidad"
  57: "pueden incendiarse si se invierte la polaridad o se supera la tensión"
  60: "los electrolíticos marcan el negativo; los de tántalo, el positivo"
  "cap03#99": "Si su vida es de 2000 horas a 105 °C, estima su vida a 70 °C"
  "cap03#11": "con una capa de óxido crecida electroquímicamente"

modelo:
  valores:
    L_0: { sim: "L₀", nombre: "vida nominal", unidad: h, valor: 2000 }
    T_n: { sim: "T_{nom}", nombre: "temperatura de la vida nominal", unidad: "°C", valor: 105 }
    T_a: { sim: "T", nombre: "temperatura de trabajo", unidad: "°C", valor: 105 }
    C_y: { sim: "C", nombre: "capacidad nominal", unidad: F, valor: 10e-6 }
    perd: { sim: "pérdida", nombre: "capacidad perdida", unidad: "%", valor: 82 }
  calculos:
    vida: { expr: "L_0*2^((T_n - T_a)/10)", sim: "L", nombre: "vida estimada", unidad: h, cifras: 3 }
    factor: { expr: "2^((T_n - T_a)/10)", sim: "factor", nombre: "factor de vida", unidad: "veces", cifras: 3 }
    C_ef: { expr: "C_y*(1 - perd/100)", sim: "C_{ef}", nombre: "capacidad que queda", unidad: F }
    queda: { expr: "100 - perd", sim: "queda", nombre: "fracción que queda", unidad: "%", cifras: 2 }

tarjetas:
  - id: explore-vida
    tipo: explorar
    titulo: "El calor gasta un electrolítico"
    texto: "Un electrolítico dura 2000 horas a 105 °C. Arrastre la temperatura de trabajo y mire su vida."
    nota: "Su electrolito se evapora poco a poco, y el calor lo acelera."
    libro: [53, "cap03#99"]
    inicio: { T_a: 105 }
    widget:
      tipo: grafica
      x: { id: tt, min: 65, max: 105, unidad: "°C", rotulo: "T" }
      y: { min: 0, max: 35000, unidad: h, rotulo: "vida" }
      curvas:
        - { expr: "L_0*2^((T_n - tt)/10)", color: naranja, rotulo: "vida" }
      asas:
        - { mueve: T_a, x: "T_a", y: "vida", rotulo: "Temperatura de trabajo" }
      lectura: { valor: vida, rotulo: "Vida estimada" }
      datos:
        - { valor: factor, rotulo: "{{factor}} la nominal" }
      mandos:
        - { valor: T_a, min: 65, max: 105, paso: 5, rotulo: "Temperatura, T" }
    requiere: { mover: [T_a] }

  - id: prediga-diez-grados
    tipo: predecir
    titulo: "Prediga"
    texto: "Un electrolítico de 2000 horas a 105 °C trabaja a 95 °C, 10 °C por debajo. ¿Cuánto vivirá?"
    libro: [53, "cap03#99"]
    fijar: { T_a: 95 }
    widget:
      tipo: grafica
      x: { id: tt, min: 65, max: 105, unidad: "°C", rotulo: "T" }
      y: { min: 0, max: 35000, unidad: h, rotulo: "vida" }
      curvas:
        - { expr: "L_0*2^((T_n - tt)/10)", color: naranja, rotulo: "vida" }
      marcas:
        - { x: "T_a", y: "vida", rotulo: "95 °C" }
      lectura: { valor: vida, rotulo: "Vida estimada" }
      ocultar: true
    opciones:
      - texto: "4000 horas"
        bien: true
        porque: "Cada 10 °C menos, la vida se duplica: el doble de 2000 horas."
      - texto: "1000 horas"
        porque: "Es al revés: el calor acorta la vida. Al enfriarse 10 °C, se duplica."
      - texto: "2000 horas, la misma"
        porque: "La vida depende mucho de la temperatura: cada 10 °C la cambian por dos."
    comprobar:
      - { vida: 4000 }
      - { con: { T_a: 105 }, vida: 2000 }
      - { con: { T_a: 115 }, vida: 1000 }

  - id: estime-setenta
    tipo: pregunta
    fase: "Estime"
    titulo: "A 70 °C"
    texto: "Un electrolítico de 2000 horas a 105 °C funciona a 70 °C. Estime su vida con la regla de los 10 °C."
    libro: ["cap03#99"]
    fijar: { T_a: 70 }
    estimar:
      objetivo: "vida"
      unidad: h
      min: 0
      max: 40000
      paso: 100
      inicio: 7000
      tol: 0.05
      rotulo: "Vida a 70 °C"
    exito: "35 °C menos son 3,5 pasos: 2^{3,5} ≈ 11,3, unas 22 600 horas. Más frío, mucha más vida."
    pistas:
      - { cuando: { valor: estimacion, menor: 21500 }, texto: "Se ha quedado corto: 35 °C son tres pasos y medio de 10 °C, y cada uno duplica." }
      - { texto: "Se ha pasado: 2^{3,5} es algo más de 11, no 16." }
    comprobar:
      - { vida: 22627, factor: 11.3 }

  - id: familias
    tipo: pregunta
    fase: "Empareje"
    titulo: "Cada familia, su sitio"
    texto: "La elección del tipo es tan importante como la del valor. Una cada condensador con su uso típico."
    libro: [45, 48, 51, 55, 57]
    emparejar:
      - ["Cerámico C0G", "Osciladores y temporización"]
      - ["Cerámico X7R", "Desacoplo y filtrado general"]
      - ["Electrolítico de aluminio", "Filtrado de fuentes"]
      - ["Película de polipropileno", "Audio y circuitos resonantes"]
      - ["Supercondensador", "Respaldo de memoria"]
    exito: "Eso es. El C0G es estable pero de poco valor; el X7R, mayor pero varía ±15 % con la temperatura."
    pistas:
      - { texto: "Donde el valor tiene que ser estable va la clase I; donde hacen falta miles de µF, el electrolítico." }

  - id: polarizacion-dc
    tipo: pregunta
    titulo: "La capacidad que falta"
    texto: "Un MLCC X7R marcado 10 µF trabaja a su tensión de trabajo. ¿Qué capacidad puede tener de verdad?"
    libro: [49]
    opciones:
      - texto: "Unos 3 µF"
        bien: true
        porque: "Es el efecto de polarización DC: la capacidad de los clase II baja mucho con la tensión aplicada."
      - texto: "10 µF, dentro de su tolerancia"
        porque: "La tolerancia se mide sin tensión. Con la de trabajo, un clase II pierde buena parte de su valor."
      - texto: "Más de 10 µF"
        porque: "La tensión no le suma capacidad: se la quita. Es lo que sorprende a muchos diseñadores."

  - id: estime-y5v
    tipo: pregunta
    fase: "Estime"
    titulo: "Un Y5V"
    texto: "Los Y5V dan la máxima capacidad por volumen, pero varían hasta un −82 %. Estime cuánto puede quedar de 10 µF."
    libro: [48]
    fijar: { C_y: 10e-6, perd: 82 }
    estimar:
      objetivo: "C_ef*1e6"
      unidad: "µF"
      min: 0
      max: 10
      paso: 0.1
      inicio: 6
      tol: 0.06
      rotulo: "Capacidad que queda"
    exito: "1,8 µF: menos de la quinta parte. Por eso solo sirven para aplicaciones no críticas."
    pistas:
      - { cuando: { valor: estimacion, mayor: 1.9 }, texto: "Se ha pasado: si pierde el 82 %, solo queda el 18 %." }
      - { texto: "Se ha quedado corto: queda el 18 % de 10 µF." }
    comprobar:
      - { C_ef: 1.8e-6, queda: 18 }

  - id: por-que-electrolitico
    tipo: porque
    titulo: "¿Por qué tanta capacidad?"
    texto: "Un electrolítico da miles de µF en poco volumen. Con C = ε₀·εr·A/d, ¿de dónde la saca?"
    libro: [51, "cap03#11"]
    opciones:
      - texto: "De una d minúscula: una capa de óxido finísima"
        bien: true
        porque: "El óxido crecido electroquímicamente separa las placas unos nanómetros: d diminuta, capacidad enorme."
      - texto: "De una εr altísima, como la de los cerámicos"
        porque: "Esa es la vía de los cerámicos de clase II. El electrolítico juega con la separación."
      - texto: "Del electrolito, que conduce la carga"
        porque: "El electrolito hace de placa; el dieléctrico es el óxido, y es su delgadez lo que da la capacidad."

  - id: polaridad
    tipo: pregunta
    titulo: "Al revés"
    texto: "¿Qué ocurre si un electrolítico de aluminio se conecta con la polaridad invertida?"
    libro: [52, 57]
    opciones:
      - texto: "La capa de óxido se destruye, se calienta, genera gas y puede explotar"
        bien: true
        porque: "Puede expulsar electrolito caliente. Los de tántalo, además, pueden incendiarse."
      - texto: "No conduce, como un diodo en inversa"
        porque: "No es un bloqueo inocuo: la capa de óxido se destruye y el componente se calienta."
      - texto: "Funciona igual, con algo menos de capacidad"
        porque: "Es peligroso: puede explotar. Por eso el negativo viene marcado con una banda."

  - id: marcas
    tipo: pregunta
    fase: "Empareje"
    titulo: "Dónde está la marca"
    texto: "Montarlos bien empieza por reconocer la polaridad. Una cada tipo con su marca."
    libro: [60]
    emparejar:
      - ["Electrolítico de aluminio", "Franja en el negativo"]
      - ["Tántalo", "Franja en el positivo"]
      - ["Cerámico o de película", "Sin polaridad"]
    exito: "Eso es: los electrolíticos marcan el negativo; los de tántalo, el positivo. Es fácil confundirlos."
    pistas:
      - { texto: "El de aluminio y el de tántalo marcan terminales opuestos." }

  - id: zumbido
    tipo: pregunta
    titulo: "Una fuente que zumba"
    texto: "Una fuente conmutada emite un zumbido audible. ¿Qué componente puede ser?"
    libro: [49]
    opciones:
      - texto: "Un MLCC de clase II, que es piezoeléctrico"
        bien: true
        porque: "Vibra con la tensión alterna del rizado: son los «singing capacitors»."
      - texto: "Un cerámico C0G"
        porque: "El zumbido es de los clase II (X7R, Y5V): son piezoeléctricos. Los clase I son los estables."
      - texto: "Un condensador de película"
        porque: "Son estables y de pérdidas muy bajas. Los que vibran son los MLCC de clase II."

  - id: tension-trabajo
    tipo: pregunta
    titulo: "Margen de tensión"
    texto: "Un electrolítico de 16 V trabaja en un circuito de 12 V: el 75 % de su nominal. ¿Qué dice la regla de diseño?"
    libro: [52, "cap03#99"]
    opciones:
      - texto: "Está dentro: conviene trabajar entre el 50 y el 80 %"
        bien: true
        porque: "Cumple, aunque ajustado: el ejercicio del libro preferiría 25 V para que viva más."
      - texto: "Está mal: hay que trabajar por debajo del 50 %"
        porque: "La regla pide entre el 50 y el 80 % de la tensión máxima."
      - texto: "Da igual mientras no pase de 16 V"
        porque: "Nunca debe superarse, pero trabajar más abajo alarga su vida."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [48, 49, 52, 53, 60]
    ideas:
      - { titulo: "Cerámicos.", texto: "C0G, estables y de poco valor; X7R e Y5V, más capacidad, pero varían y pierden con la tensión." }
      - { titulo: "Electrolíticos.", texto: "Mucha capacidad, polarizados; la vida se reduce a la mitad por cada 10 °C más." }
      - { titulo: "Margen.", texto: "Trabajar entre el 50 y el 80 % de la tensión nominal." }
      - { titulo: "Polaridad.", texto: "Aluminio, franja en el negativo; tántalo, en el positivo." }
