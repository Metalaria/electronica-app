# Lección 1.1 de la sección 3.6 «Aplicaciones de Diseño» (cap03): filtros RC (f_c = 1/(2π·R·C), −3 dB, paso bajo
# en C y paso alto en R, 20 dB/década, el desfase de 45°, el ejercicio 3.4 con E12) y el desacoplo de alimentación
# (100 nF por pin a menos de 5 mm, el cerámico con el electrolítico). Formato: contenido/lecciones11/GUIA.md.
leccion: cap03/sec-3.6

libro:
  91: "donde la señal se atenúa a 0,707 (−3 dB) de su valor"
  92: 'f_("c") = ("1")/("2" π dot.op R dot.op C)'
  93: "Fuera de la banda de paso la pendiente es de ±20 dB por década"
  95: "Es habitual combinar un cerámico de 100 nF (rápido, para alta frecuencia) con un electrolítico de 10-100 µF"
  96: "situado a menos de 5 mm del pin"
  97: "Para atenuar 60 dB con un filtro de primer orden hay que irse tres décadas más allá"
  99: "El valor E12 más cercano es 1,5 kΩ (da fc = 1061 Hz)"
  "cap03#68": "el grande para las variaciones lentas, el pequeño para las rápidas"

modelo:
  valores:
    V_p: { sim: "V_{p}", nombre: "amplitud de la entrada", unidad: V, valor: 1 }
    f_f: { sim: "f", nombre: "frecuencia de la entrada", unidad: Hz, valor: 159.15 }
    R_f: { sim: "R", nombre: "resistencia", unidad: Ω, valor: 10000 }
    C_f: { sim: "C", nombre: "capacidad", unidad: F, valor: 100e-9 }
  calculos:
    f_c: { expr: "1/(2*pi*R_f*C_f)", sim: "f_{c}", nombre: "frecuencia de corte", unidad: Hz }
    w_f: { expr: "2*pi*f_f", sim: "ω", nombre: "frecuencia angular", unidad: "rad/s" }
    x_c: { expr: "w_f*R_f*C_f", sim: "ωRC", nombre: "ωRC", unidad: "", cifras: 3 }
    A_c: { expr: "V_p/sqrt(1 + x_c^2)", sim: "V_{C}", nombre: "amplitud en C", unidad: V }
    A_r: { expr: "V_p*x_c/sqrt(1 + x_c^2)", sim: "V_{R}", nombre: "amplitud en R", unidad: V }
    ph_c: { expr: "-atan(x_c)*180/pi", sim: "φ_{C}", nombre: "desfase en C", unidad: "°", cifras: 3 }
    db_c: { expr: "20*log10(A_c/V_p)", sim: "|H|", nombre: "atenuación del paso bajo", unidad: dB, cifras: 3 }
    f_60: { expr: "f_c*sqrt(1000000 - 1)", sim: "f_{−60 dB}", nombre: "frecuencia de −60 dB", unidad: Hz }
    perd: { expr: "100*(1 - A_c/V_p)", sim: "pérdida", nombre: "atenuación en amplitud", unidad: "%", cifras: 2 }

tarjetas:
  - id: explore-filtro
    tipo: explorar
    titulo: "Una R y una C"
    texto: "Cambie R. La salida en C deja pasar lo lento; la salida en R, lo rápido. Fíjese en dónde se cruzan."
    libro: [91, 93]
    fijar: { C_f: 100e-9 }
    widget:
      tipo: circuito
      esquema: filtro-rc
      piezas: { fuente: V_p, f: f_f, r: R_f, c: C_f }
      lectura: { valor: f_c, rotulo: "Frecuencia de corte" }
      mide: { vc_amp: A_c }
      grafica:
        x: { id: nu, min: 10, max: 1000000, unidad: Hz, rotulo: "f", escala: log }
        y: { min: -60, max: 5, unidad: dB, rotulo: "|H|" }
        curvas:
          - { expr: "-10*log10(1 + (2*pi*nu*R_f*C_f)^2)", color: naranja, rotulo: "v_{C}, paso bajo", mide: vc_db }
          - { expr: "20*log10(2*pi*nu*R_f*C_f) - 10*log10(1 + (2*pi*nu*R_f*C_f)^2)", color: azul, rotulo: "v_{R}, paso alto", mide: vr_db }
        marcas:
          - { x: "f_c", y: "-3.01", rotulo: "f_{c}" }
      mandos:
        - { valor: R_f, serie: E12, min: 1000, max: 10000, rotulo: "R (E12)" }
    requiere: { mover: [R_f] }

  - id: prediga-corte
    tipo: predecir
    titulo: "Prediga"
    texto: "Con 10 kΩ y 100 nF el corte está en 159,15 Hz. Entra 1 V a esa frecuencia: ¿qué amplitud sale en C?"
    libro: [91, 97]
    fijar: { R_f: 10000, C_f: 100e-9, f_f: 159.15 }
    widget:
      tipo: circuito
      esquema: filtro-rc
      piezas: { fuente: V_p, f: f_f, r: R_f, c: C_f }
      lectura: { valor: A_c, rotulo: "Amplitud en C" }
      mide: { vc_amp: A_c }
      ocultar: true
    opciones:
      - texto: "0,707 V"
        bien: true
        porque: "En f_{c} la señal cae a 0,707, −3 dB: ya ha perdido un 29 % de amplitud."
      - texto: "La mitad de 1 V"
        porque: "La mitad es la potencia, no la amplitud: |H| = 1/√2 = 0,707."
      - texto: "1 V: el corte es donde empieza a atenuar"
        porque: "f_{c} no es una frontera entre «pasa» y «no pasa»: ahí ya está atenuada."
    comprobar:
      - { A_c: 0.707, f_c: 159.15 }

  - id: regla-corte
    tipo: formula
    titulo: "La frecuencia de corte"
    texto: "Sale del divisor entre R y X_{C}: el corte está donde ωRC = 1."
    libro: [92, 97]
    ec: 92
    fijar: { C_f: 100e-9 }
    sustitucion: "1 / (2π · {{R_f}} · {{C_f}}) = {{f_c}}"
    widget:
      tipo: circuito
      esquema: filtro-rc
      piezas: { fuente: V_p, f: f_f, r: R_f, c: C_f }
      lectura: { valor: f_c, rotulo: "Frecuencia de corte" }
      mide: { vc_amp: A_c }
      dibujo: false
      grafica:
        x: { id: nu, min: 10, max: 1000000, unidad: Hz, rotulo: "f", escala: log }
        y: { min: -60, max: 5, unidad: dB, rotulo: "|H|" }
        curvas:
          - { expr: "-10*log10(1 + (2*pi*nu*R_f*C_f)^2)", color: naranja, rotulo: "v_{C}, paso bajo", mide: vc_db }
        marcas:
          - { x: "f_c", y: "-3.01", rotulo: "f_{c}" }
      mandos:
        - { valor: R_f, serie: E12, min: 1000, max: 10000, rotulo: "R (E12)" }

  - id: reto-un-kilohercio
    tipo: reto
    titulo: "Reto: corte en 1 kHz"
    texto: "Diseñe un paso bajo de 1 kHz con un condensador de 100 nF. Elija la R de la serie E12 más cercana."
    libro: [99]
    fijar: { C_f: 100e-9 }
    inicio: { R_f: 10000 }
    widget:
      tipo: circuito
      esquema: filtro-rc
      piezas: { fuente: V_p, f: f_f, r: R_f, c: C_f }
      lectura: { valor: f_c, rotulo: "Frecuencia de corte" }
      mide: { vc_amp: A_c }
      grafica:
        x: { id: nu, min: 10, max: 1000000, unidad: Hz, rotulo: "f", escala: log }
        y: { min: -60, max: 5, unidad: dB, rotulo: "|H|" }
        curvas:
          - { expr: "-10*log10(1 + (2*pi*nu*R_f*C_f)^2)", color: naranja, rotulo: "v_{C}, paso bajo", mide: vc_db }
        marcas:
          - { x: "f_c", y: "-3.01", rotulo: "f_{c}" }
      mandos:
        - { valor: R_f, serie: E12, min: 1000, max: 10000, rotulo: "R (E12)" }
    condiciones:
      - { valor: f_c, objetivo: 1000, tol: 0.07, rotulo: "Corte: {{f_c}}" }
    exito: "1,5 kΩ: el corte queda en 1061 Hz, muy próximo. Con 1,8 kΩ quedaría en 884 Hz."
    pistas:
      - { cuando: { valor: f_c, menor: 930 }, texto: "Corte demasiado bajo: baje R." }
      - { cuando: { valor: f_c, mayor: 1070 }, texto: "Corte demasiado alto: suba R." }
    ayuda: "Despeje R = 1/(2π · 1000 · 100 nF) = 1592 Ω y busque el E12 más cercano."
    comprobar:
      - { con: { R_f: 1500 }, f_c: 1061 }
      - { con: { R_f: 1800 }, f_c: 884 }
      - { con: { R_f: 1592 }, f_c: 1000 }

  - id: sorpresa-desfase
    tipo: sorpresa
    titulo: "En el corte, ya cambiada"
    texto: "Mire la entrada y la salida en C con 10 kΩ y 100 nF. Cambie la frecuencia y fíjese en la amplitud y el retraso."
    libro: [97]
    fijar: { R_f: 10000, C_f: 100e-9 }
    inicio: { f_f: 50 }
    widget:
      tipo: circuito
      esquema: filtro-rc
      piezas: { fuente: V_p, f: f_f, r: R_f, c: C_f }
      lectura: { valor: ph_c, rotulo: "Desfase en C" }
      datos:
        - { valor: A_c, rotulo: "Amplitud en C: {{A_c}}" }
      mide: { vc_amp: A_c, vc_fase: ph_c }
      dibujo: false
      grafica:
        x: { id: t, min: 0, max: 0.02, unidad: s, rotulo: "t" }
        y: { min: -1.2, max: 1.2, unidad: V, rotulo: "v" }
        curvas:
          - { expr: "V_p*sin(w_f*t)", color: tinta, rotulo: "entrada", mide: entrada, discontinua: true }
          - { expr: "A_c*sin(w_f*t + ph_c*pi/180)", color: naranja, rotulo: "v_{C}", mide: vc }
      mandos:
        - { valor: f_f, lista: [50, 159.15, 500], rotulo: "Frecuencia, f" }
    requiere: { mover: [f_f] }
    nota: "En f_{c}, atenuada un 29 % y desfasada 45°."
    comprobar:
      - { con: { f_f: 159.15 }, ph_c: -45 }

  - id: estime-sesenta
    tipo: pregunta
    fase: "Estime"
    titulo: "Para atenuar de verdad"
    texto: "La caída es de 20 dB por década. Con el corte en 159 Hz, estime a qué frecuencia la salida baja 60 dB."
    libro: [93, 97]
    fijar: { R_f: 10000, C_f: 100e-9 }
    estimar:
      objetivo: "f_60"
      unidad: Hz
      min: 0
      max: 500000
      paso: 1000
      inicio: 20000
      tol: 0.05
      rotulo: "Frecuencia de −60 dB"
    exito: "Unos 159 kHz: tres décadas más allá del corte. Por eso hacen falta filtros de orden superior."
    pistas:
      - { cuando: { valor: estimacion, menor: 151000 }, texto: "Se ha quedado corto: 60 dB a 20 dB por década son tres décadas, ×1000." }
      - { texto: "Se ha pasado: tres décadas son mil veces 159 Hz." }
    comprobar:
      - { f_60: 159155 }

  - id: por-que-orden
    tipo: porque
    titulo: "¿Por qué no basta?"
    texto: "Un filtro RC de primer orden no separa bien una señal de un ruido cercano. ¿Por qué?"
    libro: [97]
    opciones:
      - texto: "Su caída es de solo 20 dB por década"
        bien: true
        porque: "Ni f_{c} es una frontera ni la pendiente es abrupta: para 60 dB hay que irse tres décadas."
      - texto: "Porque el corte es una frontera exacta"
        porque: "Es al revés: en f_{c} la señal ya está atenuada y más allá baja poco a poco."
      - texto: "Porque el condensador disipa la señal"
        porque: "Un condensador ideal no disipa: el límite es la pendiente de 20 dB por década."

  - id: paso-alto
    tipo: pregunta
    titulo: "El paso alto"
    texto: "Una R y una C hacen también un paso alto, que atenúa lo lento. ¿De dónde se toma su salida?"
    libro: [93]
    widget:
      tipo: circuito
      esquema: filtro-rc
      piezas: { fuente: V_p, f: f_f, r: R_f, c: C_f }
      lectura: { valor: f_c, rotulo: "Frecuencia de corte" }
      mide: { vr_amp: A_r }
      grafica:
        x: { id: nu, min: 10, max: 1000000, unidad: Hz, rotulo: "f", escala: log }
        y: { min: -60, max: 5, unidad: dB, rotulo: "|H|" }
        curvas:
          - { expr: "20*log10(2*pi*nu*R_f*C_f) - 10*log10(1 + (2*pi*nu*R_f*C_f)^2)", color: azul, rotulo: "paso alto", mide: vr_db }
      ocultar: true
    opciones:
      - texto: "De la resistencia"
        bien: true
        porque: "A baja frecuencia el condensador bloquea y R no recibe tensión; a alta, el condensador deja pasar."
      - texto: "Del condensador"
        porque: "Esa es la salida del paso bajo: X_{C} es grande con lo lento y se queda la tensión."
      - texto: "De la fuente"
        porque: "La fuente es la entrada, sin filtrar."

  - id: regla-de-oro
    tipo: pregunta
    titulo: "Regla de oro del desacoplo"
    texto: "Cada integrado necesita su condensador de desacoplo. ¿Cuál es la regla del libro?"
    libro: [95, 96]
    opciones:
      - texto: "100 nF cerámico por cada pin de alimentación, a menos de 5 mm"
        bien: true
        porque: "Suministra los picos de corriente al conmutar. Sin él, o lejos, hay ruido y reinicios espurios."
      - texto: "Un electrolítico de 100 µF por placa, junto al conector"
        porque: "El electrolítico es la reserva lenta; los picos rápidos los da el cerámico pegado al pin."
      - texto: "Un 100 nF en cualquier lugar de la placa"
        porque: "La distancia cuenta: más lejos de 5 mm, la inductancia del camino lo inutiliza."

  - id: por-que-dos
    tipo: porque
    titulo: "¿Por qué dos condensadores?"
    texto: "Es habitual un cerámico de 100 nF junto a un electrolítico de 10–100 µF. ¿Por qué no basta el grande?"
    libro: [95, "cap03#68"]
    opciones:
      - texto: "El grande es lento; el cerámico atiende la alta frecuencia"
        bien: true
        porque: "Por encima de su autorresonancia el electrolítico es una bobina: el grande, para lo lento; el pequeño, para lo rápido."
      - texto: "Para sumar capacidad"
        porque: "100 nF apenas suman a 100 µF. Cada uno cubre una zona de frecuencias."
      - texto: "El cerámico protege al electrolítico de la polaridad"
        porque: "No: el reparto es por frecuencia, rápido y lento."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [91, 92, 93, 96, 97]
    ideas:
      - { titulo: "f_{c} = 1/(2π·R·C).", texto: "Donde la señal cae a 0,707 (−3 dB) y se desfasa 45°." }
      - { titulo: "Dos salidas.", texto: "En C, paso bajo; en R, paso alto. Fuera de la banda, 20 dB por década." }
      - { titulo: "No es una frontera.", texto: "Para 60 dB, tres décadas: de ahí los filtros de orden superior." }
      - { titulo: "Desacoplo.", texto: "100 nF por pin, a menos de 5 mm, con un electrolítico de reserva." }
