# Lección 1.1 de la sección 3.1 «Capacitancia: Almacenar Carga en un Campo Eléctrico» (cap03): la capacidad
# C = ε₀·εr·A/d y la tabla de dieléctricos, qué hace el dieléctrico, la energía ½·C·V², la mitad que se pierde al
# cargar a través de una resistencia y las dos leyes q = C·V, i = C·dv/dt. Formato: contenido/lecciones11/GUIA.md.
leccion: cap03/sec-3.1

libro:
  5: "no en las placas ni en la carga, sino en el campo del dieléctrico"
  6: "La carga total del componente es cero"
  8: 'C = ε_("0") dot.op ε_("r") dot.op (A)/(d)'
  9: "Con 1 cm² y 10 µm de separación"
  10: "Cerámica X7R"
  11: "para conseguir capacidades grandes hay que subir εr, aumentar el área o reducir d"
  13: "Ese factor de reducción es exactamente εr"
  15: "es la rigidez dieléctrica multiplicada por el espesor"
  17: 'E = "½" dot.op C dot.op V^("2")'
  18: "Con 470 µF cargados a 400 V"
  19: "exactamente la mitad de la energía se disipa en la resistencia, sea cual sea su valor"
  21: 'i = C dot.op (d V)/(d t)'
  22: "Con tensión constante, corriente nula: bloquea la continua"
  23: "la tensión de un condensador no puede cambiar instantáneamente"
  "cap03#35": "Un condensador de 100 µF se carga a través de una resistencia de 10 kΩ desde una fuente de 9 V"

modelo:
  valores:
    e_0: { sim: "ε₀", nombre: "permitividad del vacío", unidad: "F/m", valor: 8.854e-12 }
    e_r: { sim: "ε_{r}", nombre: "permitividad relativa del dieléctrico", unidad: "", valor: 1 }
    A_p: { sim: "A", nombre: "área de las placas", unidad: "mm²", valor: 100 }
    d_p: { sim: "d", nombre: "separación entre placas", unidad: m, valor: 1e-5 }
    C_e: { sim: "C", nombre: "capacidad", unidad: F, valor: 470e-6 }
    V_e: { sim: "V", nombre: "tensión del condensador", unidad: V, valor: 400 }
    V_q: { sim: "V_{CC}", nombre: "tensión de la fuente", unidad: V, valor: 9 }
    C_q: { sim: "C", nombre: "capacidad que se carga", unidad: F, valor: 100e-6 }
    R_q: { sim: "R", nombre: "resistencia de carga", unidad: Ω, valor: 10000 }
  calculos:
    C_p: { expr: "e_0*e_r*A_p*1e-6/d_p", sim: "C", nombre: "capacidad de las placas", unidad: F }
    E_e: { expr: "0.5*C_e*V_e^2", sim: "E", nombre: "energía almacenada", unidad: J }
    tau_q: { expr: "R_q*C_q", sim: "τ", nombre: "constante de tiempo", unidad: s }
    E_q: { expr: "0.5*C_q*V_q^2", sim: "E_{C}", nombre: "energía final en el condensador", unidad: J }
    E_fq: { expr: "C_q*V_q^2", sim: "E_{fuente}", nombre: "energía que entrega la fuente", unidad: J }

tarjetas:
  - id: explore-placas
    tipo: explorar
    titulo: "Dos placas y un aislante"
    texto: "Cambie el dieléctrico y arrastre la separación d. Fíjese en cuánto cambia la capacidad con cada uno."
    nota: "Placas de 1 cm². La escala sube de diez en diez."
    libro: [9, 10, 11]
    widget:
      tipo: grafica
      x: { id: d_x, min: 1e-6, max: 1e-4, unidad: m, rotulo: "d", escala: log }
      y: { min: 1e-12, max: 1e-6, unidad: F, rotulo: "C", escala: log }
      curvas:
        - { expr: "e_0*e_r*A_p*1e-6/d_x", color: naranja, rotulo: "C frente a d" }
      asas:
        - { mueve: d_p, x: "d_p", y: "C_p", rotulo: "Separación de las placas" }
      lectura: { valor: C_p, rotulo: "Capacidad" }
      mandos:
        - { valor: e_r, lista: [1, 3.5, 1000, 4000], rotulo: "Dieléctrico, ε_{r}" }
        - { valor: d_p, min: 5e-6, max: 1e-4, paso: 5e-6, rotulo: "Separación, d" }
    requiere: { mover: [e_r, d_p] }

  - id: prediga-poliester
    tipo: predecir
    titulo: "Prediga"
    texto: "Con 1 cm² y 10 µm de separación, el aire da 88,5 pF. Si se pone poliéster, εr = 3,5, ¿qué capacidad queda?"
    libro: [9, 10]
    fijar: { e_r: 3.5, A_p: 100, d_p: 1e-5 }
    widget:
      tipo: grafica
      x: { id: d_x, min: 1e-6, max: 1e-4, unidad: m, rotulo: "d", escala: log }
      y: { min: 1e-12, max: 1e-6, unidad: F, rotulo: "C", escala: log }
      curvas:
        - { expr: "e_0*e_r*A_p*1e-6/d_x", color: naranja, rotulo: "C frente a d" }
      marcas:
        - { x: "d_p", y: "C_p", rotulo: "10 µm" }
      lectura: { valor: C_p, rotulo: "Capacidad" }
      ocultar: true
    opciones:
      - texto: "310 pF"
        bien: true
        porque: "La capacidad es proporcional a εr: 3,5 veces los 88,5 pF del aire."
      - texto: "88,5 pF, como el aire"
        porque: "La geometría es la misma, pero el material cuenta: εr multiplica la capacidad."
      - texto: "88,5 nF"
        porque: "Esa es la de la cerámica X7R, con εr = 1 000. El poliéster solo multiplica por 3,5."
    comprobar:
      - { C_p: 310e-12 }
      - { con: { e_r: 1 }, C_p: 88.5e-12 }
      - { con: { e_r: 1000 }, C_p: 88.5e-9 }

  - id: regla-capacidad
    tipo: formula
    titulo: "De qué depende la capacidad"
    texto: "El área y la separación son geometría; la permitividad relativa εr es el material."
    nota: "Más capacidad: subir εr, aumentar el área o reducir d."
    libro: [8, 11]
    ec: 8
    sustitucion: "{{e_0}} · {{e_r}} · {{A_p}} / {{d_p}} = {{C_p}}"
    widget:
      tipo: grafica
      x: { id: d_x, min: 1e-6, max: 1e-4, unidad: m, rotulo: "d", escala: log }
      y: { min: 1e-12, max: 1e-6, unidad: F, rotulo: "C", escala: log }
      curvas:
        - { expr: "e_0*e_r*A_p*1e-6/d_x", color: naranja, rotulo: "C frente a d" }
      asas:
        - { mueve: d_p, x: "d_p", y: "C_p", rotulo: "Separación de las placas" }
      lectura: { valor: C_p, rotulo: "Capacidad" }
      mandos:
        - { valor: e_r, lista: [1, 3.5, 1000, 4000], rotulo: "Dieléctrico, ε_{r}" }
        - { valor: d_p, min: 5e-6, max: 1e-4, paso: 5e-6, rotulo: "Separación, d" }

  - id: reto-x7r
    tipo: reto
    titulo: "Reto: 88,5 nF en 1 cm²"
    texto: "Con placas de 1 cm², elija dieléctrico y separación para conseguir 88,5 nF (± 2 %)."
    libro: [9, 10]
    fijar: { A_p: 100 }
    inicio: { e_r: 1, d_p: 1e-5 }
    widget:
      tipo: grafica
      x: { id: d_x, min: 1e-6, max: 1e-4, unidad: m, rotulo: "d", escala: log }
      y: { min: 1e-12, max: 1e-6, unidad: F, rotulo: "C", escala: log }
      curvas:
        - { expr: "e_0*e_r*A_p*1e-6/d_x", color: naranja, rotulo: "C frente a d" }
      asas:
        - { mueve: d_p, x: "d_p", y: "C_p", rotulo: "Separación de las placas" }
      lectura: { valor: C_p, rotulo: "Capacidad" }
      mandos:
        - { valor: e_r, lista: [1, 3.5, 1000, 4000], rotulo: "Dieléctrico, ε_{r}" }
        - { valor: d_p, min: 5e-6, max: 1e-4, paso: 5e-6, rotulo: "Separación, d" }
    condiciones:
      - { valor: C_p, objetivo: 88.5e-9, tol: 0.02, rotulo: "Capacidad: {{C_p}}" }
    exito: "{{C_p}}. La tabla lo logra con cerámica X7R a 10 µm; con Y5V hace falta cuatro veces más separación."
    pistas:
      - { cuando: { valor: C_p, menor: 86.7e-9 }, texto: "Falta capacidad: suba εr o acerque las placas." }
      - { cuando: { valor: C_p, mayor: 90.3e-9 }, texto: "Sobra capacidad: separe las placas o elija un εr menor." }
    ayuda: "Hacen falta mil veces los 88,5 pF del aire a 10 µm: εr = 1 000, la cerámica X7R."
    comprobar:
      - { con: { e_r: 1000, d_p: 1e-5 }, C_p: 88.5e-9 }
      - { con: { e_r: 4000, d_p: 4e-5 }, C_p: 88.5e-9 }

  - id: por-que-dielectrico
    tipo: porque
    titulo: "¿Qué hace el dieléctrico?"
    texto: "A igual geometría, la cerámica X7R da mil veces más capacidad que el aire. ¿Por qué?"
    libro: [10, 13]
    opciones:
      - texto: "Sus moléculas se polarizan y crean un campo opuesto que reduce el campo neto"
        bien: true
        porque: "Con menos campo neto cabe más carga a la misma tensión. Ese factor de reducción es exactamente εr."
      - texto: "Conduce un poco y deja pasar más carga entre las placas"
        porque: "Un dieléctrico es un aislante: la carga no lo atraviesa. Lo que hace es polarizarse."
      - texto: "Solo separa las placas; la capacidad viene del área"
        porque: "No es solo un separador: con la misma área y la misma d, el material multiplica la capacidad."

  - id: tension-nominal
    tipo: pregunta
    titulo: "La tensión nominal"
    texto: "El dieléctrico soporta un campo máximo antes de perforarse. ¿De dónde sale entonces la tensión nominal?"
    libro: [15]
    opciones:
      - texto: "De la rigidez dieléctrica multiplicada por el espesor"
        bien: true
        porque: "No es una convención: el campo máximo por la distancia da la tensión que perfora el dieléctrico."
      - texto: "De una convención del fabricante"
        porque: "El libro lo niega: tiene un origen físico, el campo máximo que aguanta el material."
      - texto: "Del área de las placas"
        porque: "El área da capacidad, no aguante: el campo depende de la tensión y del espesor."

  - id: explore-energia
    tipo: explorar
    titulo: "La energía crece con V²"
    texto: "El condensador de primario de una fuente conmutada: 470 µF. Arrastre la tensión y mire la energía."
    libro: [17, 18]
    fijar: { C_e: 470e-6 }
    inicio: { V_e: 400 }
    widget:
      tipo: grafica
      x: { id: v_x, min: 0, max: 400, unidad: V, rotulo: "V" }
      y: { min: 0, max: 40, unidad: J, rotulo: "E" }
      curvas:
        - { expr: "0.5*C_e*v_x^2", color: naranja, rotulo: "E = ½·C·V²" }
      asas:
        - { mueve: V_e, x: "V_e", y: "E_e", rotulo: "Tensión del condensador" }
      lectura: { valor: E_e, rotulo: "Energía almacenada" }
      mandos:
        - { valor: V_e, min: 0, max: 400, paso: 10, rotulo: "Tensión, V" }
    requiere: { mover: [V_e] }

  - id: prediga-mitad-tension
    tipo: predecir
    titulo: "Prediga"
    texto: "Un condensador de 470 µF guarda 38 J a 400 V. Si se carga solo a 200 V, ¿qué energía guarda?"
    libro: [17, 18]
    fijar: { C_e: 470e-6, V_e: 200 }
    widget:
      tipo: grafica
      x: { id: v_x, min: 0, max: 400, unidad: V, rotulo: "V" }
      y: { min: 0, max: 40, unidad: J, rotulo: "E" }
      curvas:
        - { expr: "0.5*C_e*v_x^2", color: naranja, rotulo: "E = ½·C·V²" }
      marcas:
        - { x: "V_e", y: "E_e", rotulo: "200 V" }
      lectura: { valor: E_e, rotulo: "Energía almacenada" }
      ocultar: true
    opciones:
      - texto: "La cuarta parte de 38 J"
        bien: true
        porque: "La energía va con el cuadrado de la tensión: la mitad de V da un cuarto de energía, 9,4 J."
      - texto: "La mitad de 38 J"
        porque: "Eso sería si fuera proporcional a V. Va con V²: la mitad de tensión, un cuarto de energía."
      - texto: "Lo mismo, 38 J"
        porque: "La capacidad es la misma, pero la energía depende de la tensión, y al cuadrado."
    comprobar:
      - { E_e: 9.4 }
      - { con: { V_e: 400 }, E_e: 37.6 }

  - id: estime-supercap
    tipo: pregunta
    fase: "Estime"
    titulo: "Un supercondensador"
    texto: "Un supercondensador de 1 F a 2,7 V. Estime cuánta energía guarda."
    libro: [17, 18]
    fijar: { C_e: 1, V_e: 2.7 }
    estimar:
      objetivo: "E_e"
      unidad: J
      min: 0
      max: 40
      paso: 0.1
      inicio: 20
      tol: 0.05
      rotulo: "Energía con 1 F a 2,7 V"
    exito: "3,6 J: menos de la décima parte de los 38 J del de 470 µF. Mucha capacidad, poca tensión."
    pistas:
      - { cuando: { valor: estimacion, mayor: 3.8 }, texto: "Se ha pasado: ½ · 1 · 2,7². La tensión es muy baja y va al cuadrado." }
      - { texto: "Se ha quedado corto: ½ · 1 · 2,7², algo más de 3 J." }
    comprobar:
      - { E_e: 3.645, tol: 0.002 }

  - id: sorpresa-mitad
    tipo: sorpresa
    titulo: "La mitad se pierde"
    texto: "100 µF se cargan a 9 V a través de R. Cambie R y compare lo que guarda el condensador con lo que disipa R."
    libro: [19, "cap03#35"]
    fijar: { V_q: 9, C_q: 100e-6 }
    widget:
      tipo: grafica
      x: { id: t, min: 0, max: 5, unidad: s, rotulo: "t" }
      y: { min: 0, max: 0.009, unidad: J, rotulo: "E" }
      curvas:
        - { expr: "C_q*V_q^2*(1 - exp(-t/tau_q))", color: tinta, rotulo: "entrega la fuente", discontinua: true }
        - { expr: "0.5*C_q*V_q^2*(1 - exp(-t/tau_q))^2", color: naranja, rotulo: "en el condensador" }
        - { expr: "0.5*C_q*V_q^2*(1 - exp(-2*t/tau_q))", color: azul, rotulo: "disipada en R" }
      lectura: { valor: E_q, rotulo: "Al final, en cada uno" }
      datos:
        - { valor: tau_q, rotulo: "τ = {{tau_q}}" }
        - { valor: E_fq, rotulo: "La fuente entrega {{E_fq}}" }
      mandos:
        - { valor: R_q, lista: [1000, 2200, 4700, 10000], rotulo: "Resistencia, R" }
    requiere: { mover: [R_q] }
    nota: "Con R pequeña, deprisa; con R grande, despacio. Pero la mitad."

  - id: por-que-mitad
    tipo: porque
    titulo: "¿Cómo se evita?"
    texto: "Cargar desde una fuente de tensión a través de una resistencia pierde siempre la mitad. ¿Qué lo evita?"
    libro: [19]
    opciones:
      - texto: "Cargar con una fuente de corriente o a través de una bobina"
        bien: true
        porque: "Es lo que hacen los convertidores conmutados, y la razón de su rendimiento."
      - texto: "Una resistencia muy pequeña"
        porque: "Carga más deprisa, pero la resistencia sigue quedándose la mitad, sea cual sea su valor."
      - texto: "Una resistencia muy grande, para cargar despacio"
        porque: "Se disipa más despacio, pero se disipa lo mismo: la mitad."

  - id: dos-leyes
    tipo: pregunta
    fase: "Empareje"
    titulo: "q = C·V e i = C·dv/dt"
    texto: "La corriente es proporcional a la velocidad con que cambia la tensión. Una cada situación con lo que hace el condensador."
    libro: [21, 22, 23]
    emparejar:
      - ["Tensión constante", "Corriente nula: bloquea la continua"]
      - ["Tensión que cambia rápido", "Corriente grande: deja pasar la alterna"]
      - ["Instante de conmutación", "Fuente del valor que tenía"]
      - ["Mucho tiempo después", "Circuito abierto"]
    exito: "Eso es. Su tensión no puede cambiar de golpe: haría falta una corriente infinita."
    pistas:
      - { texto: "Si la tensión no cambia, dv/dt = 0 y la corriente es nula." }

  - id: donde-energia
    tipo: porque
    titulo: "¿Dónde está la energía?"
    texto: "La carga total del componente es cero: tanta positiva en una placa como negativa en la otra. ¿Dónde está la energía?"
    libro: [5, 6]
    opciones:
      - texto: "En el campo eléctrico del dieléctrico"
        bien: true
        porque: "Por eso depende del cuadrado de la tensión y el material importa tanto."
      - texto: "En la carga acumulada en las placas"
        porque: "La carga total es cero. Lo que se guarda es la separación de las cargas y el trabajo que costó."
      - texto: "En las láminas metálicas"
        porque: "Las placas solo sostienen las cargas. La energía está entre ellas, en el campo."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [8, 13, 17, 19, 21]
    ideas:
      - { titulo: "Capacidad.", texto: "C = ε₀·εr·A/d: el área y la separación son geometría; εr, el material." }
      - { titulo: "El dieléctrico.", texto: "Se polariza y reduce el campo neto; su rigidez por el espesor da la tensión nominal." }
      - { titulo: "Energía.", texto: "E = ½·C·V², en el campo. Cargar a través de una resistencia pierde siempre la mitad." }
      - { titulo: "i = C·dv/dt.", texto: "Tensión constante, corriente nula; y la tensión no puede cambiar de golpe." }
