# Lección 1.1 de la sección 3.10 «Supercondensadores y Condensadores Especiales» (cap03): la doble capa (faradios,
# 2,5–3 V por celda), entre el condensador y la batería, el cálculo de cuánto sostiene (1 F con 100 mA, de 2,7 a
# 1,8 V en 9 s), lo que hay que respetar, los condensadores X e Y, la película autorregenerable, el tantalio, los
# trimmers y el banco. La descarga a corriente constante es lineal: Δt = C·ΔV/I. Sección sin fórmula.
# Formato: contenido/lecciones11/GUIA.md.
# 1.2.1 (autor121-fund, «aprender haciendo», GUIA §13): conseguir 36 s de respaldo, predecir los 9 s del libro, el
# reto de 200 mA y calcular cuántas veces más energía guarda una pila; se elige la tensión por celda y se emparejan los
# especiales. Aplicaciones, lo que hay que respetar y el banco, en el resumen.
# 1.3 (contenido13): el emparejado de los tiempos de carga pasa a tocar en la fig-3.13 el de más energía por kilo, y el
# «por qué» de la clase Y a tocar la clase en la foto del X2 (fig-3.14): 4/8 → 6/8.
leccion: cap03/sec-3.10

libro:
  168: "la capacidad alcanza faradios en un componente de tamaño moderado"
  169: "solo 2,5 a 3 V por celda, limitada por la tensión a la que el electrolito se descompone"
  171: "Tiempo de carga"
  172: "unas tres mil veces menos que una pila AA alcalina (del orden de 10 kJ)"
  173: "respaldo de memoria y reloj cuando se corta la alimentación"
  174: "un supercondensador de 1 F entregando 100 mA baja de 2,7 a 1,8 V en 9 segundos"
  176: "Un limitador o un regulador es obligatorio"
  177: "la propia fuga puede vaciarlo antes que el consumo del circuito"
  178: "limita la corriente de pico que realmente puede entregar"
  179: "al principio es un cortocircuito"
  181: "deben fallar en abierto con máxima fiabilidad"
  182: "el arco vaporiza la finísima capa metálica alrededor del punto y aísla el defecto"
  183: "Se usan con derating fuerte (la mitad de su tensión nominal)"
  184: "para sintonía y calibración en radiofrecuencia"
  187: "energía frente a potencia específica"
  188: "Al sustituirlos se respetan la clase y la tensión, no solo la capacidad"
  186: "del salto inicial de tensión al conectar la carga se obtiene la ESR"

modelo:
  valores:
    V_0: { sim: "V₀", nombre: "tensión de partida", unidad: V, valor: 2.7 }
    V_m: { sim: "V_{mín}", nombre: "tensión mínima útil", unidad: V, valor: 1.8 }
    I_d: { sim: "I", nombre: "corriente que entrega", unidad: A, valor: 0.1 }
    C_d: { sim: "C", nombre: "capacidad del supercondensador", unidad: F, valor: 1 }
    E_aa: { sim: "E_{AA}", nombre: "energía de una pila AA alcalina", unidad: J, valor: 10000 }
  calculos:
    t_m: { expr: "C_d*(V_0 - V_m)/I_d", sim: "Δt", nombre: "tiempo hasta la tensión mínima", unidad: s }
    dV_d: { expr: "V_0 - V_m", sim: "ΔV", nombre: "bajada de tensión útil", unidad: V }
    E_d: { expr: "0.5*C_d*V_0^2", sim: "E", nombre: "energía almacenada", unidad: J }
    veces: { expr: "E_aa/E_d", sim: "E_{AA}/E", nombre: "veces más energía en la pila", unidad: "veces", cifras: 2 }

tarjetas:
  - id: explore-sostiene
    tipo: explorar
    titulo: "¿Cuánto aguanta?"
    texto: "Un supercondensador cargado a 2,7 V alimenta un circuito que funciona hasta 1,8 V. Consiga que aguante 36 s."
    nota: "A corriente constante la tensión baja en línea recta."
    libro: [174]
    inicio: { I_d: 0.1, C_d: 1 }
    widget:
      tipo: grafica
      x: { id: t, min: 0, max: 40, unidad: s, rotulo: "t" }
      y: { min: 0, max: 3, unidad: V, rotulo: "v" }
      curvas:
        - { expr: "max(0, V_0 - I_d*t/C_d)", color: naranja, rotulo: "tensión" }
        - { expr: "V_m + 0*t", color: tinta, rotulo: "mínima útil", discontinua: true }
      marcas:
        - { x: "t_m", y: "V_m", rotulo: "{{t_m}}" }
      lectura: { valor: t_m, rotulo: "Hasta 1,8 V" }
      mandos:
        - { valor: I_d, lista: [0.05, 0.1, 0.2], rotulo: "Corriente, I" }
        - { valor: C_d, lista: [0.5, 1, 2], rotulo: "Capacidad, C" }
    objetivo:
      condiciones:
        - { valor: t_m, objetivo: 36, tol: 0.02, rotulo: "Aguanta: {{t_m}}" }
      logrado: "{{C_d}} con {{I_d}}: {{t_m}}. Más capacidad o menos corriente, más tiempo."
      pistas:
        - { cuando: { valor: t_m, mayor: 36.7 }, texto: "Aguanta de más: menos capacidad o más corriente." }
        - { texto: "Se vacía antes: más capacidad o menos corriente." }
    escalera:
      - "Δt = C·ΔV/I: la bajada útil es de 2,7 a 1,8 V."
    solucion: "2 F con 50 mA: 36 s."
    comprobar:
      - { t_m: 9 }
      - { con: { C_d: 2, I_d: 0.05 }, t_m: 36 }

  - id: prediga-nueve
    tipo: simular
    titulo: "Prediga el respaldo"
    texto: "Un supercondensador de 1 F entrega 100 mA. ¿Cuánto tarda en bajar de 2,7 a 1,8 V?"
    libro: [174]
    fijar: { I_d: 0.1, C_d: 1 }
    widget:
      tipo: grafica
      x: { id: t, min: 0, max: 40, unidad: s, rotulo: "t" }
      y: { min: 0, max: 3, unidad: V, rotulo: "v" }
      curvas:
        - { expr: "max(0, V_0 - I_d*t/C_d)", color: naranja, rotulo: "tensión" }
        - { expr: "V_m + 0*t", color: tinta, rotulo: "mínima útil", discontinua: true }
      lectura: { valor: t_m, rotulo: "Hasta 1,8 V" }
      ocultar: curvas
    simular:
      objetivo: t_m
      unidad: s
      tol: 0.02
      rotulo: "Hasta 1,8 V"
      errores:
        - { razon: { min: 2.9, max: 3.1 }, texto: "Eso sería bajando hasta cero, 2,7 V enteros. El circuito deja de funcionar a 1,8 V." }
    exito: "9 s: Δt = C·ΔV/I = 1 · 0,9 / 0,1. Un faradio parece mucho, pero a 100 mA se gasta en segundos."
    escalera:
      - "Δt = C·ΔV/I, con ΔV = 2,7 − 1,8 V."
    solucion: "1 · 0,9 / 0,1 = 9 s."
    comprobar:
      - { t_m: 9, dV_d: 0.9 }
      - { con: { V_m: 0 }, t_m: 27 }
  - id: reto-doble
    tipo: reto
    titulo: "Reto: el doble de corriente"
    texto: "Un supercondensador a 2,7 V alimenta un circuito de 200 mA que funciona hasta 1,8 V. Elija la capacidad para que aguante 9 s."
    libro: [174]
    fijar: { I_d: 0.2 }
    inicio: { C_d: 0.5 }
    widget:
      tipo: grafica
      x: { id: t, min: 0, max: 40, unidad: s, rotulo: "t" }
      y: { min: 0, max: 3, unidad: V, rotulo: "v" }
      curvas:
        - { expr: "max(0, V_0 - I_d*t/C_d)", color: naranja, rotulo: "tensión" }
        - { expr: "V_m + 0*t", color: tinta, rotulo: "mínima útil", discontinua: true }
      marcas:
        - { x: "t_m", y: "V_m", rotulo: "{{t_m}}" }
      lectura: { valor: t_m, rotulo: "Hasta 1,8 V" }
      mandos:
        - { valor: C_d, lista: [0.5, 1, 2, 5, 10], rotulo: "Capacidad, C" }
    condiciones:
      - { valor: t_m, objetivo: 9, tol: 0.02, rotulo: "Aguanta: {{t_m}}" }
    exito: "2 F: el doble de corriente pide el doble de capacidad para el mismo tiempo."
    pistas:
      - { cuando: { valor: t_m, menor: 8.82 }, texto: "Se vacía antes: hace falta más capacidad." }
      - { cuando: { valor: t_m, mayor: 9.18 }, texto: "Aguanta de sobra: basta con menos capacidad." }
    escalera:
      - "Δt = C·ΔV/I."
    solucion: "Con el doble de I, el doble de C: 2 F."
    comprobar:
      - { con: { C_d: 2 }, t_m: 9 }

  - id: estime-pila
    tipo: simular
    fase: "Estime"
    titulo: "Frente a una pila AA"
    texto: "1 F a 2,7 V guarda unos 3,6 J; una pila AA alcalina, del orden de 10 kJ. ¿Cuántas veces más guarda la pila?"
    libro: [172, 173]
    fijar: { C_d: 1, V_0: 2.7, E_aa: 10000 }
    simular:
      objetivo: veces
      unidad: ""
      tol: 0.12
      rotulo: "Veces más energía"
      errores:
        - { razon: { min: 0.00035, max: 0.00038 }, texto: "Lo ha dividido al revés: la pila guarda mucho más." }
    exito: "Unas tres mil veces: no sustituye a una batería en energía, pero la supera en potencia y ciclos. Respaldo de memoria y reloj."
    pistas:
      - { cuando: { valor: estimacion, menor: 2400 }, texto: "Se ha quedado corto: 10 kJ entre 3,6 J." }
      - { texto: "Se ha pasado: 10 000 entre 3,6 es algo menos de tres mil." }
    escalera:
      - "Ponga las dos energías en julios y divida."
    solucion: "10 000 / 3,6 ≈ 2 700: unas tres mil veces."
    comprobar:
      - { E_d: 3.645, veces: 2743, tol: 0.002 }
  - id: por-que-tension
    tipo: porque
    titulo: "¿Por qué tan poca tensión?"
    texto: "Un supercondensador alcanza faradios, pero cada celda solo admite de 2,5 a 3 V. ¿Por qué?"
    libro: [168, 169]
    opciones:
      - texto: "Por encima, su electrolito se descompone"
        bien: true
        porque: "Es el precio de una separación de un nanómetro: mucha capacidad, poca tensión. Para más, celdas en serie con equilibrado."
      - texto: "Porque su área es enorme"
        porque: "El área da la capacidad. Lo que limita la tensión es el electrolito, que se descompone."
      - texto: "Por norma del fabricante, para que dure más"
        porque: "No es una convención: es la tensión a la que el electrolito se descompone."
    widget:
      tipo: figura
      figura: fig-3.13
      zonas:
        - { id: ragone, rotulo: "Entre el condensador y la batería", rect: [0, 0, 434, 216] }
    escalera:
      - "¿Qué le pasa al electrolito si se supera esa tensión?"
    solucion: "Por encima, su electrolito se descompone: es el precio de una separación de un nanómetro."

  - id: toque-energia
    tipo: tocar
    titulo: "Entre el condensador y la batería"
    texto: "En horizontal, la energía por kilo; en vertical, la potencia. Toque el que guarda más energía por kilo."
    libro: [171, 187]
    widget:
      tipo: figura
      figura: fig-3.13
      zonas:
        - { id: electrolitico, rect: [60, 28, 180, 58], rotulo: "Arriba a la izquierda" }
        - { id: super, rect: [212, 80, 148, 50], rotulo: "En el centro" }
        - { id: bateria, rect: [298, 120, 94, 54], rotulo: "Abajo a la derecha" }
    tocar:
      bien: [bateria]
      porque:
        electrolitico: "Está arriba: mucha potencia. Pero muy a la izquierda: muy poca energía por kilo."
        super: "En medio: más energía que el electrolítico, menos que la batería."
    exito: "La batería de litio: mucha energía, pero se carga en horas. El supercondensador, en segundos y con cientos de miles de ciclos."
    escalera:
      - "Busque el que está más a la derecha."
    solucion: "Abajo a la derecha: la batería de litio."

  - id: toque-clase
    tipo: tocar
    titulo: "Lo que hay que respetar"
    texto: "Un X o un Y se sustituye por otro de su clase, nunca por uno normal del mismo valor. En el de la izquierda, toque dónde se lee su clase."
    libro: [181, 188]
    widget:
      tipo: figura
      figura: fig-3.14
      zonas:
        - { id: arriba-izq, rect: [70, 90, 330, 170], rotulo: "Arriba a la izquierda" }
        - { id: arriba-der, rect: [400, 90, 320, 170], rotulo: "Arriba a la derecha" }
        - { id: abajo-izq, rect: [70, 260, 330, 220], rotulo: "Abajo a la izquierda" }
        - { id: abajo-der, rect: [400, 260, 320, 220], rotulo: "Abajo a la derecha" }
    tocar:
      bien: [arriba-der]
      porque:
        arriba-izq: "Ahí está la capacidad, 0,1 µF. La misma capacidad no basta."
        abajo-izq: "Ahí están la tensión, 275 V de alterna, y las marcas de homologación. Se respetan, pero la clase está arriba."
        abajo-der: "Ahí hay un código de cifras y otra marca de homologación, no la clase."
    exito: "X2: de supresión, entre fase y neutro. Un Y, entre red y chasis, debe fallar en abierto: un cortocircuito pondría el chasis a tensión de red."
    escalera:
      - "Busque una letra seguida de una cifra, junto al tipo de película."
    solucion: "Arriba a la derecha: «MKP X2»."

  - id: especiales
    tipo: pregunta
    fase: "Empareje"
    titulo: "Otros especiales"
    texto: "Una cada condensador especial con su rasgo."
    libro: [181, 182, 183, 184]
    emparejar:
      - ["Clase X", "Entre fase y neutro"]
      - ["Película autorregenerable", "Aísla su propia perforación"]
      - ["Tantalio", "A la mitad de su tensión"]
      - ["Trimmer", "Sintonía en radiofrecuencia"]
    exito: "Eso es. El tantalio falla en cortocircuito, a menudo incendiario: de ahí su derating fuerte."
    pistas:
      - { texto: "El de película se autorregenera: el arco vaporiza el metal alrededor del defecto." }
    escalera:
      - "Piense en cómo falla cada uno."
    solucion: "Clase X: entre fase y neutro. Película autorregenerable: aísla su propia perforación. Tantalio: A la mitad de su tensión. Trimmer: sintonía en radiofrecuencia."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [169, 172, 173, 174, 176, 177, 178, 179, 181, 186]
    ideas:
      - { titulo: "Doble capa.", texto: "Faradios con 2,5 a 3 V por celda; más tensión, celdas en serie con equilibrado." }
      - { titulo: "Potencia, no energía.", texto: "1 F a 2,7 V guarda 3,6 J, unas tres mil veces menos que una pila AA." }
      - { titulo: "Cuánto sostiene.", texto: "1 F con 100 mA, de 2,7 a 1,8 V en 9 s. Pide limitador, cuidado con su fuga y su ESR, y la ESR se mide con el salto inicial." }
      - { titulo: "X e Y.", texto: "Se sustituyen por otro de su clase, nunca por uno normal." }
