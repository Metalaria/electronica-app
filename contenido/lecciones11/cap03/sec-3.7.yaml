# Lección 1.1 de la sección 3.7 «El Efecto del DC Bias y los Coeficientes» (cap03): la capacidad de un cerámico de
# clase 2 cae con la tensión continua (X7R de 10 µF, 16 V, 0805: 50–70 % menos a 5 V, más del 80 % a 10 V; la versión
# de 50 V pierde mucho menos), los códigos de temperatura, el Y5V, el C0G, el envejecimiento logarítmico (2,5 % por
# década de horas, reiniciado al soldar), la microfonía, la tabla de decisión y la medida en el banco.
# La curva de capacidad frente a la tensión es la de la figura 3.10, ajustada como 100/(1 + (V/V₀)^1,7) con
# V₀ = 3,94 V (16 V: 40 % a 5 V y 17 % a 10 V, los rótulos de la figura) y V₀ = 12 V (50 V). Sección sin fórmula.
# Formato: contenido/lecciones11/GUIA.md.
# 1.2.1 (autor121-fund, «aprender haciendo», GUIA §13): subir la tensión hasta perder la mitad, predecir 5 V y 10 V,
# pasar a 50 V, dejar envejecer hasta un 5 %, predecir mil horas y polarizar a 5 V en el banco; se eligen los códigos,
# la sustitución por Y5V y la tabla de decisión. El porqué del dieléctrico grueso, la soldadura y la microfonía quedan
# en los textos.
leccion: cap03/sec-3.7

libro:
  102: "marcado como 10 µF no tiene 10 µF en el circuito"
  105: "esos dominios se alinean y dejan de estar disponibles"
  106: "alimentado a 5 V, puede haber perdido entre el 50 y el 70 % de su capacidad. A 10 V, más del 80 %"
  108: "Un filtro diseñado con 10 µF puede estar funcionando con 3"
  111: "+22 % / −82 %"
  112: "sustituir un X7R por un Y5V «porque es del mismo valor» es un error de sustitución serio"
  113: "Donde el valor importa —filtros, osciladores, temporizadores— la respuesta es C0G"
  115: "Tras mil horas (tres décadas) ha perdido casi un 8 %"
  116: "Los C0G no lo tienen"
  118: "X7R o X5R, con tensión nominal 2–3×"
  120: "que aplica poca tensión y dará cerca de 10 µF"
  121: "Pérdida de capacidad de un cerámico de clase 2 con la tensión continua aplicada"

modelo:
  valores:
    V_b: { sim: "V_{DC}", nombre: "tensión continua aplicada", unidad: V, valor: 0 }
    V_n: { sim: "V_{nom}", nombre: "tensión nominal", unidad: V, valor: 16 }
    C_n: { sim: "C_{nom}", nombre: "capacidad marcada", unidad: F, valor: 10e-6 }
    h_a: { sim: "t", nombre: "horas desde el último calentamiento", unidad: h, valor: 1 }
  calculos:
    V_0: { expr: "3.94 + (V_n - 16)*(12 - 3.94)/34", sim: "V₀", nombre: "tensión a la que queda la mitad", unidad: V }
    frac: { expr: "100/(1 + (V_b/V_0)^1.7)", sim: "C/C_{nom}", nombre: "capacidad que queda", unidad: "%", cifras: 2 }
    C_ef: { expr: "C_n*frac/100", sim: "C_{ef}", nombre: "capacidad efectiva", unidad: F, cifras: 2 }
    perd_t: { expr: "2.5*log10(h_a)", sim: "ΔC/C", nombre: "capacidad perdida por envejecimiento", unidad: "%", cifras: 2 }

tarjetas:
  - id: explore-dc-bias
    tipo: explorar
    titulo: "La tensión se come la capacidad"
    texto: "Un X7R marcado 10 µF, de 16 V y en 0805. Suba la tensión continua hasta que le quede la mitad de su capacidad."
    libro: [102, 106, 121]
    fijar: { V_n: 16, C_n: 10e-6 }
    inicio: { V_b: 0 }
    widget:
      tipo: grafica
      x: { id: v, min: 0, max: 16, unidad: V, rotulo: "V_{DC}" }
      y: { min: 0, max: 110, unidad: "%", rotulo: "C restante" }
      curvas:
        - { expr: "100 + 0*v", color: tinta, rotulo: "C0G", discontinua: true }
        - { expr: "100/(1 + (v/V_0)^1.7)", color: naranja, rotulo: "X7R de 16 V" }
      asas:
        - { mueve: V_b, x: "V_b", y: "frac", rotulo: "Tensión continua" }
      lectura: { valor: C_ef, rotulo: "Capacidad real" }
      datos:
        - { valor: frac, rotulo: "Queda el {{frac}}" }
      mandos:
        - { valor: V_b, min: 0, max: 16, paso: 1, rotulo: "Tensión continua, V_{DC}" }
    nota: "El C0G no cambia."
    objetivo:
      condiciones:
        - { valor: frac, min: 45, max: 50, rotulo: "Queda el {{frac}}" }
      logrado: "Con solo {{V_b}}, {{C_ef}}: marcado como 10 µF, no tiene 10 µF en el circuito."
      pistas:
        - { cuando: { valor: frac, mayor: 50 }, texto: "Todavía conserva más de la mitad: suba la tensión." }
        - { texto: "Se ha pasado: baje un poco la tensión." }
    escalera:
      - "Pocos voltios bastan: la curva cae deprisa al principio."
    solucion: "Hacia 4 V: queda la mitad."
    comprobar:
      - { frac: 100 }
      - { con: { V_b: 4 }, frac: 49.4, tol: 0.01 }

  - id: prediga-cinco-voltios
    tipo: simular
    titulo: "Prediga a 5 V"
    texto: "Un X7R marcado 10 µF, de 16 V y en 0805, desacopla una línea de 5 V. ¿Qué capacidad tiene de verdad, según la curva del libro?"
    libro: [106, 108, 121]
    fijar: { V_n: 16, C_n: 10e-6, V_b: 5 }
    widget:
      tipo: grafica
      x: { id: v, min: 0, max: 16, unidad: V, rotulo: "V_{DC}" }
      y: { min: 0, max: 110, unidad: "%", rotulo: "C restante" }
      curvas:
        - { expr: "100/(1 + (v/V_0)^1.7)", color: naranja, rotulo: "X7R de 16 V" }
      marcas:
        - { x: "V_b", y: "frac", rotulo: "5 V" }
      lectura: { valor: C_ef, rotulo: "Capacidad real" }
      ocultar: curvas
    simular:
      objetivo: C_ef
      unidad: F
      tol: 0.25
      rotulo: "Capacidad a 5 V"
      errores:
        - { razon: { min: 2.4, max: 2.6 }, texto: "No está defectuoso, pero tampoco tiene 10 µF: a 5 V pierde más de la mitad." }
    exito: "Unos 4 µF: a 5 V puede haber perdido entre el 50 y el 70 %. Un filtro diseñado con 10 µF puede estar funcionando con 3."
    escalera:
      - "A 5 V pierde entre el 50 y el 70 %."
    solucion: "La curva del libro marca un 40 %: unos 4 µF."
    comprobar:
      - { C_ef: 4.0e-6, frac: 40, tol: 0.01 }
      - { con: { V_b: 10 }, frac: 17, tol: 0.01 }
  - id: sorpresa-cincuenta
    tipo: sorpresa
    titulo: "El mismo, de 50 V"
    texto: "Misma capacidad, 5 V aplicados. Cámbielo por uno de 50 V de tensión nominal."
    libro: [108, 121]
    fijar: { C_n: 10e-6, V_b: 5 }
    inicio: { V_n: 16 }
    widget:
      tipo: grafica
      x: { id: v, min: 0, max: 16, unidad: V, rotulo: "V_{DC}" }
      y: { min: 0, max: 110, unidad: "%", rotulo: "C restante" }
      curvas:
        - { expr: "100/(1 + (v/V_0)^1.7)", color: naranja, rotulo: "X7R" }
      marcas:
        - { x: "V_b", y: "frac", rotulo: "{{frac}}" }
      lectura: { valor: C_ef, rotulo: "Capacidad real a 5 V" }
      mandos:
        - { valor: V_n, lista: [16, 50], rotulo: "Tensión nominal" }
    objetivo:
      condiciones:
        - { valor: V_n, min: 50, rotulo: "Tensión nominal: {{V_n}}" }
      logrado: "Queda el {{frac}}, {{C_ef}}: su dieléctrico es más grueso y a 5 V el campo es menor. La regla: nominal del doble o el triple."
      pistas:
        - { texto: "Elija la tensión nominal de 50 V." }
    escalera:
      - "Elija 50 V en el mando."
    solucion: "Con 50 V conserva mucho más."
    comprobar:
      - { frac: 40, tol: 0.01 }
      - { con: { V_n: 50 }, frac: 81.6, tol: 0.01 }

  - id: estime-diez-voltios
    tipo: simular
    fase: "Estime"
    titulo: "A 10 V"
    texto: "A 10 V, la curva del libro deja a un X7R de 10 µF, 16 V y 0805 con el 17 %. ¿Cuántos µF le quedan?"
    libro: [106, 121]
    fijar: { V_n: 16, C_n: 10e-6, V_b: 10 }
    simular:
      objetivo: C_ef
      unidad: F
      tol: 0.05
      rotulo: "Capacidad a 10 V"
      errores:
        - { razon: { min: 4.8, max: 4.9 }, texto: "Esa es la capacidad que pierde. Queda el 17 %." }
    exito: "1,7 µF: pierde más del 80 %. Un filtro diseñado con 10 µF trabajaría con 1,7."
    pistas:
      - { cuando: { valor: estimacion, mayor: 1.9e-6 }, texto: "Se ha pasado: si pierde más del 80 %, quedan menos de 2 µF." }
      - { texto: "Se ha quedado corto: la figura marca el 17 % a 10 V." }
    escalera:
      - "Aplique a 10 µF el 17 % que queda."
    solucion: "El 17 % de 10 µF: 1,7 µF."
    comprobar:
      - { C_ef: 1.7e-6, frac: 17, tol: 0.01 }
  - id: codigos
    tipo: pregunta
    fase: "Empareje"
    titulo: "El código, descifrado"
    texto: "Tres caracteres dicen el margen de temperatura y la variación admitida. Una cada código con lo suyo."
    libro: [111]
    emparejar:
      - ["X7R", "−55 a +125 °C, ±15 %"]
      - ["X5R", "−55 a +85 °C, ±15 %"]
      - ["Y5V", "−30 a +85 °C, −82 %"]
      - ["Z5U", "+10 a +85 °C, −56 %"]
    exito: "Eso es. El Y5V puede perder el 82 % solo con la temperatura, antes de aplicarle tensión."
    pistas:
      - { texto: "Los dos ±15 % son los X; los que pierden mucho, Y5V y Z5U." }
    escalera:
      - "Fíjese en cuáles admiten pérdidas grandes y cuáles no."
    solucion: "X7R: −55 a +125 °C, ±15 %. X5R: −55 a +85 °C, ±15 %. Y5V: −30 a +85 °C, −82 %. Z5U: +10 a +85 °C, −56 %."

  - id: sustituir-y5v
    tipo: pregunta
    titulo: "Del mismo valor"
    texto: "Un X7R de 1 µF se sustituye por un Y5V de 1 µF. ¿Es correcto?"
    libro: [112]
    opciones:
      - texto: "No: un Y5V a 60 °C y con 5 V puede tener 100 nF"
        bien: true
        porque: "Es un error de sustitución serio. El Y5V solo sirve donde la capacidad no importa."
      - texto: "Sí: es del mismo valor"
        porque: "El valor marcado engaña: la temperatura y la tensión pueden dejarle la décima parte."
      - texto: "Sí, si la tensión nominal es igual o mayor"
        porque: "La tensión no lo arregla: el Y5V pierde hasta el 82 % solo con la temperatura."
    widget:
      tipo: figura
      figura: fig-3.10
      zonas:
        - { id: perdida, rotulo: "Pérdida de capacidad con la tensión", rect: [0, 0, 439, 203] }
    escalera:
      - "El Y5V pierde mucho con la temperatura, y además con la tensión."
    solucion: "No: un Y5V a 60 °C y con 5 V puede quedarse en 100 nF."

  - id: explore-envejece
    tipo: explorar
    titulo: "Envejece con el tiempo"
    texto: "Un X7R pierde en torno a un 2,5 % por década de horas desde su último calentamiento. Arrastre el tiempo hasta que haya perdido un 5 %."
    libro: [115]
    inicio: { h_a: 1 }
    widget:
      tipo: grafica
      x: { id: hh, min: 1, max: 100000, unidad: h, rotulo: "t", escala: log }
      y: { min: 0, max: 15, unidad: "%", rotulo: "pérdida" }
      curvas:
        - { expr: "2.5*log10(hh)", color: naranja, rotulo: "X7R" }
        - { expr: "0*hh", color: tinta, rotulo: "C0G", discontinua: true }
      asas:
        - { mueve: h_a, x: "h_a", y: "perd_t", rotulo: "Horas" }
      lectura: { valor: perd_t, rotulo: "Capacidad perdida" }
      mandos:
        - { valor: h_a, lista: [1, 10, 100, 1000, 10000, 100000], rotulo: "Tiempo, t" }
    objetivo:
      condiciones:
        - { valor: perd_t, objetivo: 5, tol: 0.02, rotulo: "Perdida: {{perd_t}}" }
      logrado: "A las {{h_a}}, dos décadas: un {{perd_t}}. Soldarlo lo calienta y reinicia el envejecimiento. Los C0G no lo tienen."
      pistas:
        - { cuando: { valor: perd_t, mayor: 5.1 }, texto: "Se ha pasado: retroceda." }
        - { texto: "Todavía no: avance en el tiempo." }
    escalera:
      - "Un 5 % son dos décadas de 2,5 %."
    solucion: "100 horas: dos décadas."
    comprobar:
      - { perd_t: 0 }
      - { con: { h_a: 100 }, perd_t: 5 }

  - id: prediga-mil-horas
    tipo: simular
    titulo: "Prediga mil horas"
    texto: "Un X7R pierde en torno a un 2,5 % por década de horas. ¿Cuánto ha perdido tras mil horas, respecto a su primera hora?"
    libro: [115]
    fijar: { h_a: 1000 }
    widget:
      tipo: grafica
      x: { id: hh, min: 1, max: 100000, unidad: h, rotulo: "t", escala: log }
      y: { min: 0, max: 15, unidad: "%", rotulo: "pérdida" }
      curvas:
        - { expr: "2.5*log10(hh)", color: naranja, rotulo: "X7R" }
      lectura: { valor: perd_t, rotulo: "Capacidad perdida" }
      ocultar: curvas
    simular:
      objetivo: perd_t
      unidad: "%"
      tol: 0.05
      rotulo: "Capacidad perdida"
      errores:
        - { razon: { min: 0.32, max: 0.35 }, texto: "Eso es por década. Mil horas son tres décadas." }
    exito: "Casi un 8 %: mil horas son tres décadas, tres veces el 2,5 %."
    escalera:
      - "Mil horas son tres décadas de horas."
    solucion: "3 × 2,5 % = 7,5 %."
    comprobar:
      - { perd_t: 7.5 }
  - id: decision
    tipo: pregunta
    fase: "Empareje"
    titulo: "Tabla de decisión"
    texto: "Una cada aplicación con el dieléctrico que recomienda el libro."
    libro: [113, 118]
    emparejar:
      - ["Oscilador o temporizador", "C0G / NP0"]
      - ["Desacoplo", "X7R o X5R, tensión 2–3×"]
      - ["Acoplo de audio", "Película"]
      - ["Filtro de fuente", "Electrolítico o polímero"]
      - ["Valor sin importancia", "Y5V, con reservas"]
    exito: "Eso es. Donde el valor importa, C0G, aunque haya que aceptar un valor menor."
    pistas:
      - { texto: "El C0G es estable pero pequeño; el electrolítico, grande; el Y5V, solo si no importa." }
    escalera:
      - "Donde el valor importa, el dieléctrico más estable."
    solucion: "Oscilador o temporizador: C0G / NP0. Desacoplo: X7R o X5R, tensión 2–3×. Acoplo de audio: película. Filtro de fuente: electrolítico o polímero. Valor sin importancia: Y5V, con reservas."

  - id: banco-capacimetro
    tipo: explorar
    titulo: "En el banco"
    texto: "En el banco, el capacímetro aplica poca tensión y da cerca de 10 µF. Póngale los 5 V continuos del circuito."
    libro: [120]
    fijar: { V_n: 16, C_n: 10e-6 }
    inicio: { V_b: 0 }
    widget:
      tipo: grafica
      x: { id: v, min: 0, max: 16, unidad: V, rotulo: "V_{DC}" }
      y: { min: 0, max: 110, unidad: "%", rotulo: "C restante" }
      curvas:
        - { expr: "100/(1 + (v/V_0)^1.7)", color: naranja, rotulo: "X7R de 16 V" }
      asas:
        - { mueve: V_b, x: V_b, y: frac, rotulo: "Tensión continua" }
      lectura: { valor: C_ef, rotulo: "Capacidad real" }
      mandos:
        - { valor: V_b, min: 0, max: 16, paso: 1, rotulo: "Tensión continua, V_{DC}" }
    escalera:
      - "Lleve la tensión continua a 5 V."
    solucion: "Con 5 V, unos 4 µF."
    objetivo:
      condiciones:
        - { valor: V_b, objetivo: 5, tol: 0.01, rotulo: "V_{DC}: {{V_b}}" }
      logrado: "Con 5 V, {{C_ef}}: la reactancia medida en el circuito revela la pérdida que el capacímetro no ve."
      pistas:
        - { texto: "Ponga 5 V." }
    comprobar:
      - { C_ef: 10e-6 }
      - { con: { V_b: 5 }, C_ef: 4.0e-6, tol: 0.01 }

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [105, 106, 108, 111, 113, 115, 116]
    ideas:
      - { titulo: "DC bias.", texto: "Un X7R de 10 µF y 16 V pierde a 5 V entre el 50 y el 70 %; a 10 V, más del 80 %." }
      - { titulo: "Más tensión nominal.", texto: "El doble o el triple de la de trabajo, y encapsulado mayor: pierde menos." }
      - { titulo: "Temperatura y edad.", texto: "Y5V, hasta −82 %; X7R, un 2,5 % por década de horas." }
      - { titulo: "Donde el valor importa.", texto: "C0G: sin coeficiente de tensión, envejecimiento ni microfonía." }
