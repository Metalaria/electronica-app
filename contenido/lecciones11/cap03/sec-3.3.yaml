# Lección 1.1 de la sección 3.3 «Reactancia Capacitiva» (cap03): X_C = 1/(2π·f·C), inversa a la frecuencia
# (bloquea la continua, deja pasar la alta frecuencia), el ejercicio 3.3 (100 nF a 50 Hz, 1 kHz y 1 MHz), la corriente
# que adelanta 90° y por qué una reactancia no disipa potencia. Formato: contenido/lecciones11/GUIA.md.
leccion: cap03/sec-3.3

libro:
  39: 'X_("C") = ("1")/("2" π dot.op f dot.op C)'
  40: "«bloquear lo lento y dejar pasar lo rápido»"
  41: "la reactancia capacitiva XC disminuye con la frecuencia para distintos valores de C"
  42: "la corriente adelanta 90° a la tensión"
  43: "Aplicarle P = V²/XC es un error conceptual"
  "cap03#99": "A 1 kHz: 1/(2π × 1000 × 100×10⁻⁹) = 1592 Ω ≈ 1,59 kΩ"

modelo:
  valores:
    f_x: { sim: "f", nombre: "frecuencia", unidad: Hz, valor: 1000 }
    C_x: { sim: "C", nombre: "capacidad", unidad: F, valor: 100e-9 }
    th: { sim: "ωt", nombre: "instante del ciclo", unidad: "°", valor: 0 }
  calculos:
    X_c: { expr: "1/(2*pi*f_x*C_x)", sim: "X_{C}", nombre: "reactancia capacitiva", unidad: Ω }
    w_x: { expr: "2*pi*f_x", sim: "ω", nombre: "frecuencia angular", unidad: "rad/s" }
    v_n: { expr: "sin(th*pi/180)", sim: "v/V_{p}", nombre: "tensión, en veces su pico", unidad: "", cifras: 2 }
    i_n: { expr: "cos(th*pi/180)", sim: "i/I_{p}", nombre: "corriente, en veces su pico", unidad: "", cifras: 2 }

tarjetas:
  - id: explore-reactancia
    tipo: explorar
    titulo: "Lento y rápido"
    texto: "Arrastre la frecuencia sobre la curva de 100 nF. Fíjese en cuánto cae la reactancia por cada década."
    nota: "Las otras dos curvas: 1 nF y 10 µF."
    libro: [40, 41]
    fijar: { C_x: 100e-9 }
    widget:
      tipo: grafica
      x: { id: nu, min: 10, max: 100000000, unidad: Hz, rotulo: "f", escala: log }
      y: { min: 0.0001, max: 100000000, unidad: Ω, rotulo: "X_{C}", escala: log }
      curvas:
        - { expr: "1/(2*pi*nu*1e-9)", color: azul, rotulo: "1 nF", discontinua: true }
        - { expr: "1/(2*pi*nu*C_x)", color: naranja, rotulo: "100 nF" }
        - { expr: "1/(2*pi*nu*10e-6)", color: verde, rotulo: "10 µF", discontinua: true }
      asas:
        - { mueve: f_x, x: "f_x", y: "X_c", rotulo: "Frecuencia" }
      lectura: { valor: X_c, rotulo: "Reactancia de 100 nF" }
      mandos:
        - { valor: f_x, lista: [10, 20, 50, 100, 200, 500, 1000, 2000, 5000, 10000, 20000, 50000, 100000, 200000, 500000, 1000000, 2000000, 5000000, 10000000, 20000000, 50000000, 100000000], rotulo: "Frecuencia, f" }
    requiere: { mover: [f_x] }

  - id: prediga-un-kilohercio
    tipo: predecir
    titulo: "Prediga"
    texto: "Un condensador de 100 nF presenta 31,8 kΩ a 50 Hz. ¿Cuánto presentará a 1 kHz, veinte veces más frecuencia?"
    libro: ["cap03#99", 40]
    fijar: { C_x: 100e-9, f_x: 1000 }
    widget:
      tipo: grafica
      x: { id: nu, min: 10, max: 100000000, unidad: Hz, rotulo: "f", escala: log }
      y: { min: 0.0001, max: 100000000, unidad: Ω, rotulo: "X_{C}", escala: log }
      curvas:
        - { expr: "1/(2*pi*nu*C_x)", color: naranja, rotulo: "100 nF" }
      marcas:
        - { x: "f_x", y: "X_c", rotulo: "1 kHz" }
      lectura: { valor: X_c, rotulo: "Reactancia" }
      ocultar: true
    opciones:
      - texto: "1,59 kΩ"
        bien: true
        porque: "La reactancia es inversa a la frecuencia: veinte veces más frecuencia, la vigésima parte de 31,8 kΩ."
      - texto: "Veinte veces más"
        porque: "Eso sería si creciera con la frecuencia, como la de una bobina. La del condensador cae."
      - texto: "31,8 kΩ, igual"
        porque: "Solo una resistencia es igual a toda frecuencia. La reactancia depende de f."
    comprobar:
      - { X_c: 1592 }
      - { con: { f_x: 50 }, X_c: 31831 }
    escalera:
      - "La reactancia del condensador es inversa a la frecuencia."
    solucion: "Veinte veces más frecuencia, veinte veces menos reactancia: 1,59 kΩ."

  - id: regla-reactancia
    tipo: formula
    titulo: "La reactancia capacitiva"
    texto: "Es inversamente proporcional a la frecuencia y a la capacidad. Se mide en ohmios."
    libro: [39, 41]
    ec: 39
    fijar: { C_x: 100e-9 }
    sustitucion: "1 / (2π · {{f_x}} · {{C_x}}) = {{X_c}}"
    widget:
      tipo: grafica
      x: { id: nu, min: 10, max: 100000000, unidad: Hz, rotulo: "f", escala: log }
      y: { min: 0.0001, max: 100000000, unidad: Ω, rotulo: "X_{C}", escala: log }
      curvas:
        - { expr: "1/(2*pi*nu*C_x)", color: naranja, rotulo: "100 nF" }
      asas:
        - { mueve: f_x, x: "f_x", y: "X_c", rotulo: "Frecuencia" }
      lectura: { valor: X_c, rotulo: "Reactancia" }
      mandos:
        - { valor: f_x, lista: [10, 20, 50, 100, 200, 500, 1000, 2000, 5000, 10000, 20000, 50000, 100000, 200000, 500000, 1000000, 2000000, 5000000, 10000000, 20000000, 50000000, 100000000], rotulo: "Frecuencia, f" }

  - id: reto-un-megahercio
    tipo: reto
    titulo: "Reto: 1,59 Ω"
    texto: "Lleve la frecuencia hasta que el condensador de 100 nF presente solo 1,59 Ω (± 2 %)."
    libro: ["cap03#99"]
    fijar: { C_x: 100e-9 }
    inicio: { f_x: 50 }
    widget:
      tipo: grafica
      x: { id: nu, min: 10, max: 100000000, unidad: Hz, rotulo: "f", escala: log }
      y: { min: 0.0001, max: 100000000, unidad: Ω, rotulo: "X_{C}", escala: log }
      curvas:
        - { expr: "1/(2*pi*nu*C_x)", color: naranja, rotulo: "100 nF" }
      asas:
        - { mueve: f_x, x: "f_x", y: "X_c", rotulo: "Frecuencia" }
      lectura: { valor: X_c, rotulo: "Reactancia" }
      mandos:
        - { valor: f_x, lista: [10, 20, 50, 100, 200, 500, 1000, 2000, 5000, 10000, 20000, 50000, 100000, 200000, 500000, 1000000, 2000000, 5000000, 10000000, 20000000, 50000000, 100000000], rotulo: "Frecuencia, f" }
    condiciones:
      - { valor: X_c, objetivo: 1.59, tol: 0.02, rotulo: "X_{C}: {{X_c}}" }
    exito: "A {{f_x}}: mil veces menos que a 1 kHz. Para la alta frecuencia, casi un cortocircuito."
    pistas:
      - { cuando: { valor: X_c, mayor: 1.62 }, texto: "Aún se opone demasiado: suba la frecuencia." }
      - { cuando: { valor: X_c, menor: 1.56 }, texto: "Se ha pasado de frecuencia: bájela." }
    escalera:
      - "Mil veces menos reactancia pide mil veces más frecuencia."
    solucion: "A 1 kHz son 1,59 kΩ; para 1,59 Ω hace falta 1 MHz."
    comprobar:
      - { con: { f_x: 1000000 }, X_c: 1.59 }

  - id: limites
    tipo: pregunta
    fase: "Empareje"
    titulo: "Los dos extremos"
    texto: "Dos frases resumen todo el uso del condensador. Una cada caso con cómo se comporta."
    libro: [40, 43]
    emparejar:
      - ["Continua, f = 0", "Reactancia infinita: circuito abierto"]
      - ["Frecuencia muy alta", "Reactancia casi nula: cortocircuito"]
      - ["Más capacidad", "Menos reactancia"]
    exito: "Eso es: salen de la fórmula, no de la memoria. Es la base del filtrado y del acoplamiento."
    pistas:
      - { texto: "f y C están en el denominador: si crecen, X_{C} baja." }
    escalera:
      - "Mire la fórmula: X_{C} = 1/(2π·f·C)."
    solucion: "Continua, f = 0: reactancia infinita: circuito abierto. Frecuencia muy alta: reactancia casi nula: cortocircuito. Más capacidad: menos reactancia."

  - id: sorpresa-adelanto
    tipo: sorpresa
    titulo: "La corriente se adelanta"
    texto: "Recorra un ciclo. Pare en la cresta de la tensión y mire la corriente; luego en un cruce por cero."
    libro: [42]
    inicio: { th: 0 }
    widget:
      tipo: grafica
      x: { id: wt, min: 0, max: 360, unidad: "°", rotulo: "ωt" }
      y: { min: -1.2, max: 1.2, unidad: "", rotulo: "en veces el pico" }
      curvas:
        - { expr: "sin(wt*pi/180)", color: azul, rotulo: "tensión" }
        - { expr: "cos(wt*pi/180)", color: naranja, rotulo: "corriente" }
      marcas:
        - { x: "th", y: "v_n", rotulo: "v" }
        - { x: "th", y: "i_n", rotulo: "i" }
      datos:
        - { valor: v_n, rotulo: "v/V_{p} = {{v_n}}" }
        - { valor: i_n, rotulo: "i/I_{p} = {{i_n}}" }
      mandos:
        - { valor: th, min: 0, max: 360, paso: 15, rotulo: "Instante del ciclo, ωt" }
    requiere: { mover: [th] }
    nota: "La corriente adelanta 90° a la tensión: va un cuarto de ciclo por delante."

  - id: corriente-maxima
    tipo: pregunta
    titulo: "¿Cuándo es máxima?"
    texto: "Con i = C·dv/dt, ¿en qué momento del ciclo es máxima la corriente del condensador?"
    libro: [42]
    opciones:
      - texto: "En los cruces por cero de la tensión"
        bien: true
        porque: "Es cuando la tensión cambia más rápido. En la cresta deja de cambiar y la corriente es nula."
      - texto: "En la cresta de la tensión"
        porque: "En la cresta la tensión deja de cambiar un instante: dv/dt = 0 y la corriente es nula."
      - texto: "Siempre a la vez que la tensión"
        porque: "Eso pasa en una resistencia. En el condensador la corriente adelanta 90°."
    widget:
      tipo: grafica
      x: { id: wt, min: 0, max: 360, unidad: °, rotulo: "ωt" }
      y: { min: -1.2, max: 1.2, unidad: "", rotulo: "en veces el pico" }
      curvas:
        - { expr: "sin(wt*pi/180)", color: azul, rotulo: tensión }
      marcas:
        - { x: th, y: v_n, rotulo: v }
      datos:
        - { valor: v_n, rotulo: "v/V_{p} = {{v_n}}" }
      mandos:
        - { valor: th, min: 0, max: 360, paso: 15, rotulo: "Instante del ciclo, ωt" }
    escalera:
      - "i = C·dv/dt: ¿en qué momento cambia más deprisa la tensión?"
    solucion: "En los cruces por cero de la tensión, donde cambia más rápido; en la cresta, dv/dt = 0."

  - id: por-que-no-disipa
    tipo: porque
    titulo: "¿Por qué no se calienta?"
    texto: "Un condensador ideal con 1,59 kΩ de reactancia y tensión alterna no disipa potencia. ¿Por qué?"
    libro: [40, 43, "cap03#99"]
    opciones:
      - texto: "Almacena la energía y la devuelve en cada ciclo"
        bien: true
        porque: "La potencia media en una reactancia pura es cero. Aplicarle P = V²/X_{C} es un error conceptual."
      - texto: "Porque por él no pasa corriente"
        porque: "En alterna sí pasa: la corriente es la tensión entre X_{C}. Lo que no hay es potencia media."
      - texto: "Porque la reactancia es pequeña"
        porque: "No depende del valor: ni 31,8 kΩ ni 1,59 Ω de reactancia disipan nada en un condensador ideal."
    widget:
      tipo: figura
      figura: fig-3.5
      zonas:
        - { id: reactancia, rotulo: "Reactancia y desfase", rect: [0, 0, 438, 205] }
    escalera:
      - "¿Qué hace el condensador con la energía en cada medio ciclo?"
    solucion: "La almacena y la devuelve en cada ciclo: la potencia media en una reactancia pura es cero."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [39, 40, 42, 43, "cap03#99"]
    ideas:
      - { titulo: "X_{C} = 1/(2π·f·C).", texto: "Inversa a la frecuencia y a la capacidad: 100 nF dan 31,8 kΩ a 50 Hz y 1,59 Ω a 1 MHz." }
      - { titulo: "Lo lento y lo rápido.", texto: "Bloquea la continua y deja pasar la alta frecuencia: filtrado y acoplamiento." }
      - { titulo: "90° de adelanto.", texto: "La corriente es máxima en los cruces por cero de la tensión." }
      - { titulo: "No disipa.", texto: "Almacena y devuelve la energía en cada ciclo: P = V²/X_{C} es un error." }
