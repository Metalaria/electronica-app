# Lección 1.2 de la sección 42.10 «Herramientas Adicionales y Resumen» (cap41, sec-41.10). Formato: GUIA.md.
# - La figura 42.14 (fig-41.14) con zonas: el flanco rápido con timbre frente al lento y limpio, los síntomas y el
#   instrumental mínimo.
# - El ancho de banda del osciloscopio, al menos tres veces 0,35/t_r (bloque 302): con flancos de 1 ns (los del bloque
#   6, cap41#6), 1,05 GHz.
# Paso práctico: «simular» ese ancho de banda (1,05 GHz; error: sin el factor tres).
leccion: cap41/sec-41.10

libro:
  284: "Calculadoras de impedancia para microstrip y stripline"
  285: "resuelven las reflexiones y la diafonía a partir de la geometría"
  286: "describen el comportamiento eléctrico de las entradas y salidas de un integrado sin revelar su interior"
  287: "en un osciloscopio rápido con generador de flanco es una función accesible"
  288: "es el instrumento más importante del capítulo y el más barato"
  290: "Lo decide el flanco, no la frecuencia"
  291: "Hay que pensar en bucles, no en pistas"
  293: "a menudo basta una resistencia serie de 33 Ω"
  297: "reducir la velocidad de flanco"
  298: "resuelve problemas de integridad y de emisión (sección 32.12) sin añadir un solo componente"
  300: "Fallos que aparecen al subir la velocidad."
  302: "un osciloscopio con ancho de banda al menos tres veces el equivalente del flanco, 0,35/tr"
  303: "las conclusiones que se saquen de ellas serán sobre la sonda y no sobre el circuito"
  304: "El efecto de reducir la velocidad de flanco y los síntomas de integridad de señal"
  "cap41#6": "flancos de 1 ns"

modelo:
  valores:
    t_rb: { sim: "t_{r}", nombre: "tiempo de subida", unidad: s, valor: 1e-9 }
  calculos:
    B_eq: { expr: "0.35/t_rb", sim: "B_{flanco}", nombre: "ancho de banda equivalente del flanco", unidad: Hz }
    B_osc: { expr: "3*B_eq", sim: "B", nombre: "ancho de banda mínimo del osciloscopio", unidad: Hz }

tarjetas:
  - id: explore-cierre
    tipo: explorar
    titulo: "Reducir la velocidad de flanco"
    texto: "El mismo circuito con un flanco rápido y con uno lento. Toque la gráfica, los síntomas y el instrumental."
    libro: [297, 300, 302, 304]
    widget:
      tipo: figura
      figura: fig-41.14
      zonas:
        - { id: grafica, rotulo: "La gráfica", rect: [40, 18, 182, 155], texto: "Con el flanco rápido, timbre; con el lento, limpio. No añade ningún componente." }
        - { id: sintomas, rotulo: "Lista naranja", rect: [232, 22, 205, 74], texto: "Timbre, errores según el patrón de datos, fallos al subir la velocidad o al tocar la placa." }
        - { id: despista, rotulo: "Recuadro rojo", rect: [232, 98, 205, 36], texto: "El que despista: funciona con el osciloscopio conectado." }
        - { id: instrumental, rotulo: "Recuadro azul", rect: [232, 146, 205, 50], texto: "Osciloscopio con ancho de banda suficiente y sonda con muelle de masa." }
    requiere: { mover: [grafica, sintomas, instrumental] }

  - id: empareje-herramientas
    tipo: pregunta
    titulo: "Las herramientas"
    texto: "Empareje cada herramienta con lo que hace."
    libro: [284, 285, 286, 287, 288]
    emparejar:
      - ["Calculadora de impedancia", "Microstrip y stripline"]
      - ["Simulador de integridad", "Reflexiones y diafonía desde la geometría"]
      - ["Modelo IBIS", "Las entradas y salidas sin revelar el interior"]
      - ["Reflectómetro", "Osciloscopio rápido con generador de flanco"]
      - ["Sonda de banda ancha con masa corta", "La más importante y la más barata"]
    exito: "La más barata es la que más importa."
    pistas:
      - { texto: "IBIS es el formato estándar para simular integridad." }
    escalera:
      - "El reflectómetro envía un flanco y mira lo que vuelve."
    solucion: "Calculadora, líneas; simulador, geometría; IBIS, E/S; reflectómetro, flanco; sonda, la clave."

  - id: simule-ancho
    tipo: simular
    titulo: "El instrumental mínimo"
    texto: "Con flancos de 1 ns, el osciloscopio necesita al menos tres veces el ancho de banda del flanco, 0,35/t_{r}. ¿Cuánto?"
    libro: [302, "cap41#6"]
    fijar: { t_rb: 1e-9 }
    widget:
      tipo: grafica
      x: { id: tt, min: 2e-10, max: 5e-9, unidad: s, rotulo: "t_{r}" }
      y: { min: 0, max: 5e9, unidad: Hz, rotulo: "B" }
      curvas:
        - { expr: "3*0.35/tt", color: naranja, rotulo: "3 × 0,35/t_{r}" }
      lectura: { valor: B_osc, rotulo: "Ancho de banda mínimo" }
      ocultar: true
    simular:
      objetivo: B_osc
      unidad: Hz
      tol: 0.03
      rotulo: "Ancho de banda del osciloscopio"
      errores:
        - { expr: "B_eq", texto: "Ese es el ancho de banda del flanco; el osciloscopio necesita al menos tres veces más." }
    exito: "Algo más de 1 GHz: tres veces los 350 MHz del flanco."
    escalera:
      - "0,35 / 1 ns, y por tres."
    solucion: "0,35 / 1 ns = 350 MHz; por tres, 1,05 GHz."
    comprobar:
      - { B_osc: 1.05e9, B_eq: 3.5e8 }

  - id: toque-lento
    tipo: tocar
    titulo: "La alternativa que se olvida"
    texto: "Toque la traza que llega limpia sin añadir ningún componente."
    libro: [297, 298, 304]
    widget:
      tipo: figura
      figura: fig-41.14
      zonas:
        - { id: rapido, rotulo: "Pico alto de la izquierda", rect: [60, 28, 36, 45] }
        - { id: lento, rotulo: "Rampa de abajo", rect: [70, 105, 40, 36] }
    tocar:
      bien: [lento]
      porque:
        rapido: "Es el flanco rápido: sobreoscilación y timbre."
    exito: "El flanco lento: integridad y emisión resueltas sin un solo componente."
    escalera:
      - "Busque la subida más suave."
    solucion: "La rampa verde, el flanco lento."

  - id: predecir-33
    tipo: predecir
    titulo: "Las reflexiones se resuelven terminando"
    texto: "Una salida digital rápida punto a punto da timbre. ¿Qué basta a menudo?"
    libro: [293]
    widget:
      tipo: figura
      figura: fig-41.14
      zonas:
        - { id: grafica, rotulo: "La gráfica", rect: [40, 18, 182, 155] }
    opciones:
      - texto: "Una resistencia serie de unos 33 Ω"
        bien: true
        porque: "Terminación serie: un componente y sin consumo en continua."
      - texto: "Una resistencia a masa de 33 Ω en el extremo"
        porque: "Eso consume siempre; en punto a punto basta la serie."
      - texto: "Un condensador de desacoplo más"
        porque: "El timbre es de la línea, no de la alimentación."
    escalera:
      - "La terminación más usada en digital."
    solucion: "Una resistencia serie de 33 Ω."

  - id: porque-flanco
    tipo: porque
    titulo: "La más barata"
    texto: "¿Por qué reducir la velocidad de flanco es la alternativa más barata?"
    libro: [297, 298, 290]
    widget:
      tipo: figura
      figura: fig-41.14
      zonas:
        - { id: grafica, rotulo: "La gráfica", rect: [40, 18, 182, 155] }
    opciones:
      - texto: "Se configura en el microcontrolador y resuelve integridad y emisión sin componentes"
        bien: true
        porque: "Muchos microcontroladores y FPGA la permiten configurar."
      - texto: "Porque baja la frecuencia de reloj"
        porque: "No toca el reloj: lo decide el flanco, no la frecuencia."
      - texto: "Porque elimina la necesidad de plano de masa"
        porque: "El plano sigue haciendo falta; el flanco lento da margen."
    escalera:
      - "¿Qué hay que comprar para cambiar un registro?"
    solucion: "No añade ningún componente."

  - id: pregunta-sonda
    tipo: pregunta
    titulo: "Sin muelle de masa"
    texto: "Se mide un flanco rápido con el latiguillo de masa largo de la sonda. ¿Qué vale la medida?"
    libro: [302, 303]
    widget:
      tipo: figura
      figura: fig-41.14
      zonas:
        - { id: instrumental, rotulo: "Recuadro azul", rect: [232, 146, 205, 50] }
    opciones:
      - texto: "Habla de la sonda, no del circuito"
        bien: true
        porque: "Sin muelle de masa, las medidas están dominadas por el propio montaje."
      - texto: "Lo mismo que con muelle"
        porque: "El latiguillo largo añade su bucle y su timbre."
      - texto: "Más que con muelle: capta más señal"
        porque: "Capta más, sí: lo que añade el propio montaje."
    escalera:
      - "El latiguillo largo es un bucle más."
    solucion: "Mide la sonda, no el circuito."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [290, 291, 293, 297]
    ideas:
      - { titulo: "El flanco.", texto: "Lo decide el flanco, no la frecuencia." }
      - { titulo: "Bucles.", texto: "Cada señal tiene ida y vuelta; cortar un plano es lo más dañino." }
      - { titulo: "Terminar.", texto: "A menudo basta una resistencia serie de 33 Ω." }
      - { titulo: "Más lento.", texto: "Reducir el flanco: la alternativa que se olvida." }
