# Lección 1.2 de la sección 42.2 «Impedancia Controlada» (cap41, sec-41.2). Formato: contenido/lecciones11/GUIA.md.
# - Las figuras 42.2 (fig-41.2, microstrip y stripline) y 42.3 (fig-41.3, Z₀ frente a anchura y altura) con zonas.
# - Las velocidades del bloque 43 (microstrip, unos 16,5 cm/ns) y 44 (stripline, unos 14 cm/ns).
# Paso práctico: «simular» el desfase entre dos líneas de 10 cm (valor de ejemplo, rotulado), una por microstrip y otra
# por stripline: 10/14 − 10/16,5 ns = 108 ps (errores: el tiempo de una sola de las dos líneas).
leccion: cap41/sec-41.2

libro:
  35: "determina la impedancia característica"
  36: "Eso convierte una decisión de trazado en una especificación eléctrica"
  39: "Acercarla al plano."
  40: "Con el plano a 0,1 mm, la misma impedancia exige la mitad de anchura"
  41: "la impedancia la fija la relación entre anchura y distancia al plano, no la anchura sola"
  43: "la señal viaja más rápido: unos 16,5 cm/ns"
  44: "la señal es más lenta —unos 14 cm/ns con εr ≈ 4,5— y la línea está apantallada de forma natural"
  45: "una señal por microstrip y otra por stripline no llegan a la vez, aunque las pistas midan lo mismo"
  48: "90 Ω en USB, 100 Ω en Ethernet"
  49: "la separación entre las dos pistas debe mantenerse constante en todo el recorrido"
  52: "Un corte en el plano debajo de ella, que es lo peor de todo"
  53: "Un cambio de capa sin vía de retorno próxima"
  54: "Los conectores y las almohadillas, que son discontinuidades locales"
  55: "En placas rápidas eso obliga a rebajar el resto de la vía"
  58: "Sí: buses rápidos, USB, Ethernet, radiofrecuencia"
  60: "basta con calcular las anchuras y no pagar por el control ni por la medida"
  63: "Un escalón que vuelve con amplitud positiva indica impedancia mayor de la esperada; negativa, menor"
  64: "La geometría fija la impedancia característica"
  65: "Impedancia según anchura y distancia al plano"

modelo:
  valores:
    L_b: { sim: "L", nombre: "longitud de las dos líneas (ejemplo)", unidad: cm, valor: 10 }
    v_ms: { sim: "v_{microstrip}", nombre: "velocidad en microstrip", unidad: "cm/ns", valor: 16.5 }
    v_sl: { sim: "v_{stripline}", nombre: "velocidad en stripline", unidad: "cm/ns", valor: 14 }
  calculos:
    t_ms: { expr: "L_b/v_ms*1e-9", sim: "t_{microstrip}", nombre: "retardo por microstrip", unidad: s }
    t_sl: { expr: "L_b/v_sl*1e-9", sim: "t_{stripline}", nombre: "retardo por stripline", unidad: s }
    dt_b: { expr: "t_sl - t_ms", sim: "Δt", nombre: "desfase entre las dos", unidad: s }

tarjetas:
  - id: explore-lineas
    tipo: explorar
    titulo: "Microstrip y stripline"
    texto: "En un circuito rápido la anchura de la pista es una especificación eléctrica. Toque las dos líneas."
    libro: [35, 36, 43, 44, 64]
    widget:
      tipo: figura
      figura: fig-41.2
      zonas:
        - { id: microstrip, rotulo: "Panel de la izquierda", rect: [20, 30, 190, 125], texto: "Microstrip: pista exterior sobre un plano; el campo, en FR4 y aire: unos 16,5 cm/ns." }
        - { id: stripline, rotulo: "Panel de la derecha", rect: [247, 25, 190, 130], texto: "Stripline: enterrada entre dos planos; todo el campo en FR4: unos 14 cm/ns, y apantallada." }
    requiere: { mover: [microstrip, stripline] }

  - id: pregunta-depende
    tipo: pregunta
    titulo: "De qué depende"
    texto: "Una microstrip tiene más impedancia de la pedida. ¿Qué la baja?"
    libro: [39, 41]
    widget:
      tipo: figura
      figura: fig-41.2
      zonas:
        - { id: microstrip, rotulo: "Panel de la izquierda", rect: [20, 30, 190, 125] }
    opciones:
      - texto: "Ensanchar la pista o acercarla al plano"
        bien: true
        porque: "La impedancia la fija la relación entre anchura y distancia al plano."
      - texto: "Alejarla del plano"
        porque: "Más lejos del plano, más impedancia, no menos."
      - texto: "Estrecharla"
        porque: "Estrecharla la sube."
    escalera:
      - "Mire las dos cotas del dibujo: w y h."
    solucion: "Ensancharla o acercarla al plano."

  - id: predecir-mitad
    tipo: predecir
    titulo: "Con el plano a 0,1 mm"
    texto: "Con 0,2 mm de dieléctrico, 50 Ω piden 0,35 mm de pista. Con el plano a 0,1 mm, ¿qué anchura?"
    libro: [40, 41, 65]
    widget:
      tipo: figura
      figura: fig-41.3
      zonas:
        - { id: anchura, rotulo: "Gráfica de la izquierda", rect: [25, 10, 190, 165] }
    opciones:
      - texto: "La mitad, más o menos"
        bien: true
        porque: "Lo que cuenta es la relación anchura/altura: con la mitad de altura, la mitad de anchura."
      - texto: "La misma, 0,35 mm"
        porque: "Con el plano más cerca, 0,35 mm darían menos de 50 Ω."
      - texto: "El doble"
        porque: "Acercar el plano baja la impedancia: para volver a 50 Ω hay que estrechar, no ensanchar."
    escalera:
      - "Mire dónde cruza los 50 Ω la curva verde."
    solucion: "La mitad, como marca la curva verde de la figura."

  - id: empareje-lineas
    tipo: pregunta
    titulo: "Dos geometrías"
    texto: "Empareje cada rasgo con su línea."
    libro: [43, 44]
    emparejar:
      - ["Capa exterior, campo en FR4 y aire", "Microstrip, unos 16,5 cm/ns"]
      - ["Enterrada entre dos planos", "Stripline, unos 14 cm/ns"]
      - ["Apantallada de forma natural", "Stripline, menos emisión"]
    exito: "La stripline es más lenta y emite y acopla menos."
    pistas:
      - { texto: "Con aire encima, la constante efectiva baja y la señal corre más." }
    escalera:
      - "Todo el campo en FR4 frena la señal."
    solucion: "Exterior, microstrip rápida; enterrada, stripline lenta y apantallada."

  - id: simule-desfase
    tipo: simular
    titulo: "Igual de largas, no igual de rápidas"
    texto: "Dos líneas de un bus miden 10 cm (valor de ejemplo): una por microstrip y otra por stripline. ¿Cuánto llega antes la primera?"
    libro: [43, 44, 45]
    fijar: { L_b: 10, v_ms: 16.5, v_sl: 14 }
    widget:
      tipo: grafica
      x: { id: ll, min: 0, max: 20, unidad: cm, rotulo: "longitud" }
      y: { min: 0, max: 1.5e-9, unidad: s, rotulo: "retardo" }
      curvas:
        - { expr: "ll/v_ms*1e-9", color: naranja, rotulo: "microstrip" }
        - { expr: "ll/v_sl*1e-9", color: azul, rotulo: "stripline", discontinua: true }
      lectura: { valor: dt_b, rotulo: "Desfase entre las dos" }
      ocultar: true
    simular:
      objetivo: dt_b
      unidad: s
      tol: 0.05
      rotulo: "Desfase, Δt"
      errores:
        - { expr: "t_ms", texto: "Ese es el retardo de la microstrip sola; se pide la diferencia entre las dos." }
        - { expr: "t_sl", texto: "Ese es el retardo de la stripline sola; se pide la diferencia entre las dos." }
    exito: "Unos 108 ps de desfase: en un bus con requisitos de desfase, todas por el mismo tipo de capa."
    escalera:
      - "Retardo = longitud / velocidad, para cada una."
      - "10/14 ns menos 10/16,5 ns."
    solucion: "714 ps − 606 ps = 108 ps."
    comprobar:
      - { dt_b: 1.082e-10, t_ms: 6.06e-10, t_sl: 7.14e-10, tol: 0.01 }

  - id: pregunta-par
    tipo: pregunta
    titulo: "Las líneas diferenciales"
    texto: "Un par diferencial de 100 Ω se separa para rodear un obstáculo. ¿Qué pasa?"
    libro: [48, 49]
    widget:
      tipo: figura
      figura: fig-41.2
      zonas:
        - { id: stripline, rotulo: "Panel de la derecha", rect: [247, 25, 190, 130] }
    opciones:
      - texto: "Cambia la impedancia allí y se produce una reflexión"
        bien: true
        porque: "La separación entre las dos pistas debe ser constante en todo el recorrido."
      - texto: "Nada, si las dos miden lo mismo"
        porque: "Igualar longitudes no corrige el cambio de impedancia por la separación."
      - texto: "Mejora: se acoplan menos"
        porque: "La impedancia diferencial depende de la separación: cambiarla rompe la adaptación."
    escalera:
      - "¿De qué depende la impedancia diferencial además de la anchura?"
    solucion: "Un cambio local de impedancia: una reflexión."

  - id: empareje-rompe
    tipo: pregunta
    titulo: "Lo que rompe la impedancia"
    texto: "Aunque la pista esté bien calculada. Empareje cada causa con su efecto."
    libro: [52, 53, 54, 55]
    emparejar:
      - ["Un corte en el plano debajo", "Lo peor de todo"]
      - ["Cambio de capa sin vía de retorno", "El retorno rodea"]
      - ["Conectores y almohadillas", "Discontinuidades locales"]
      - ["El resto de una vía pasante", "Un ramal que hay que rebajar"]
    exito: "La impedancia es de la línea y de su retorno: lo que rompe uno rompe la otra."
    pistas:
      - { texto: "Un ramal es un stub." }
    escalera:
      - "El corte es lo peor porque rompe el retorno a lo largo."
    solucion: "Corte, lo peor; cambio sin vía, rodeo; conectores, locales; vía, ramal."

  - id: pregunta-cuando
    tipo: pregunta
    titulo: "Cuándo pedirla de verdad"
    texto: "Flancos rápidos, pero líneas cortas y sin especificación de impedancia. ¿Se encarga impedancia controlada?"
    libro: [58, 60]
    widget:
      tipo: figura
      figura: fig-41.3
      zonas:
        - { id: anchura, rotulo: "Gráfica de la izquierda", rect: [25, 10, 190, 165] }
    opciones:
      - texto: "No: basta con calcular las anchuras"
        bien: true
        porque: "Ni el control ni la medida se pagan: se reservan para USB, Ethernet, radiofrecuencia."
      - texto: "Sí, siempre que haya flancos rápidos"
        porque: "Con líneas cortas no compensa pagar el control."
      - texto: "No: la anchura da igual"
        porque: "Sigue importando; se calcula, aunque no se encargue la medida."
    escalera:
      - "Es el caso intermedio."
    solucion: "Calcular las anchuras, sin pagar el control."

  - id: predecir-tdr
    tipo: predecir
    titulo: "En el banco: reflectometría"
    texto: "Se envía un escalón rápido y vuelve un escalón positivo a cierto tiempo. ¿Qué dice?"
    libro: [63]
    widget:
      tipo: figura
      figura: fig-41.2
      zonas:
        - { id: microstrip, rotulo: "Panel de la izquierda", rect: [20, 30, 190, 125] }
    opciones:
      - texto: "Impedancia mayor de la esperada, a la distancia que marca ese tiempo"
        bien: true
        porque: "Positivo, mayor; negativo, menor. El instante dice dónde está."
      - texto: "Impedancia menor de la esperada"
        porque: "Eso sería un escalón negativo."
      - texto: "Que la línea está bien adaptada"
        porque: "Adaptada no devuelve nada."
    escalera:
      - "Recuerde el signo de Γ con una carga mayor que Z₀."
    solucion: "Impedancia mayor, y el tiempo dice a qué distancia."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [41, 45, 49, 52]
    ideas:
      - { titulo: "Relación.", texto: "La fija la anchura frente a la distancia al plano, no la anchura sola." }
      - { titulo: "Dos líneas.", texto: "Microstrip más rápida; stripline más lenta y apantallada." }
      - { titulo: "Diferencial.", texto: "Separación constante en todo el recorrido." }
      - { titulo: "Lo que la rompe.", texto: "Un corte en el plano, lo peor de todo." }
