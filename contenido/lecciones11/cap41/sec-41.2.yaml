# Lección 1.2 de la sección 42.2 «Impedancia Controlada» (cap41, sec-41.2). Formato: contenido/lecciones11/GUIA.md.
# - Las figuras 42.2 (fig-41.2, microstrip y stripline) y 42.3 (fig-41.3, Z₀ frente a anchura y altura) con zonas.
# - Las velocidades del bloque 43 (microstrip, unos 16,5 cm/ns) y 44 (stripline, unos 14 cm/ns).
# Paso práctico: «simular» el desfase entre dos líneas de 10 cm (valor de ejemplo, rotulado), una por microstrip y otra
# por stripline: 10/14 − 10/16,5 ns = 108 ps (errores: el tiempo de una sola de las dos líneas).
# 1.2.1 (autor121-pc, «aprender haciendo», GUIA §13): la impedancia se consigue con una meta sobre la tabla de Z₀ del
# problema 41.A (bloque cap40#364, como modelo: un polinomio de Lagrange por sus cuatro puntos, exacto en ellos) y se
# marca la anchura de 50 Ω (0,34 mm, cap40#365); la stripline, la regla del par diferencial (figura 42.13) y el corte
# que rompe la impedancia (figura 42.1) se tocan. Quedan una pregunta de opciones (la reflectometría) y el
# emparejamiento de las dos geometrías.
leccion: cap41/sec-41.2

libro:
  35: "determina la impedancia característica"
  36: "Eso convierte una decisión de trazado en una especificación eléctrica"
  39: "Acercarla al plano."
  40: "Con el plano a 0,1 mm, la misma impedancia exige la mitad de anchura"
  41: "la impedancia la fija la relación entre anchura y distancia al plano, no la anchura sola"
  43: "la señal viaja más rápido: unos 16,5 cm/ns"
  44: "la señal es más lenta —unos 14 cm/ns con εr ≈ 4,5— y la línea está apantallada de forma natural"
  45: "una señal por microstrip y otra por stripline no llegan a la vez, aunque las pistas midan lo mismo"
  48: "90 Ω en USB, 100 Ω en Ethernet"
  49: "la separación entre las dos pistas debe mantenerse constante en todo el recorrido"
  52: "Un corte en el plano debajo de ella, que es lo peor de todo"
  53: "Un cambio de capa sin vía de retorno próxima"
  54: "Los conectores y las almohadillas, que son discontinuidades locales"
  55: "En placas rápidas eso obliga a rebajar el resto de la vía"
  58: "Sí: buses rápidos, USB, Ethernet, radiofrecuencia"
  60: "basta con calcular las anchuras y no pagar por el control ni por la medida"
  63: "Un escalón que vuelve con amplitud positiva indica impedancia mayor de la esperada; negativa, menor"
  64: "La geometría fija la impedancia característica"
  65: "Impedancia según anchura y distancia al plano"
  "cap40#364": "0,35 mm"
  "cap40#365": "Para 50 Ω con h = 0,2 mm hace falta 0,35 mm de pista (0,34 mm exactos)"
  "cap41#279": "Cancelación del ruido de modo común en un par diferencial"
  "cap41#32": "El área del bucle de retorno con plano continuo y con plano cortado"

modelo:
  valores:
    L_b: { sim: "L", nombre: "longitud de las dos líneas (ejemplo)", unidad: cm, valor: 10 }
    v_ms: { sim: "v_{microstrip}", nombre: "velocidad en microstrip", unidad: "cm/ns", valor: 16.5 }
    v_sl: { sim: "v_{stripline}", nombre: "velocidad en stripline", unidad: "cm/ns", valor: 14 }
    w_m: { sim: "w", nombre: "anchura de la pista", unidad: mm, valor: 0.5 }
    h_m: { sim: "h", nombre: "dieléctrico hasta el plano", unidad: mm, valor: 0.36 }
    w_34: { sim: "w", nombre: "anchura exacta de 50 Ω con h = 0,2 mm", unidad: mm, valor: 0.34 }
  calculos:
    t_ms: { expr: "L_b/v_ms*1e-9", sim: "t_{microstrip}", nombre: "retardo por microstrip", unidad: s }
    t_sl: { expr: "L_b/v_sl*1e-9", sim: "t_{stripline}", nombre: "retardo por stripline", unidad: s }
    dt_b: { expr: "t_sl - t_ms", sim: "Δt", nombre: "desfase entre las dos", unidad: s }
    Z_1: { expr: "58.4*(w_m-0.35)*(w_m-0.5)*(w_m-0.7)/(-0.01125) + 49.2*(w_m-0.25)*(w_m-0.5)*(w_m-0.7)/0.00525 + 40*(w_m-0.25)*(w_m-0.35)*(w_m-0.7)/(-0.0075) + 32.1*(w_m-0.25)*(w_m-0.35)*(w_m-0.5)/0.0315", sim: "Z₀", nombre: "impedancia con h = 0,2 mm (tabla)", unidad: Ω, cifras: 3 }
    Z_2: { expr: "77.7*(w_m-0.35)*(w_m-0.5)*(w_m-0.7)/(-0.01125) + 67.6*(w_m-0.25)*(w_m-0.5)*(w_m-0.7)/0.00525 + 57*(w_m-0.25)*(w_m-0.35)*(w_m-0.7)/(-0.0075) + 47.4*(w_m-0.25)*(w_m-0.35)*(w_m-0.5)/0.0315", sim: "Z₀", nombre: "impedancia con h = 0,36 mm (tabla)", unidad: Ω, cifras: 3 }
    Z_t: { expr: "Z_1 + (h_m - 0.2)/0.16*(Z_2 - Z_1)", sim: "Z₀", nombre: "impedancia de la pista", unidad: Ω, cifras: 3 }

tarjetas:
  - id: explore-lineas
    tipo: tocar
    titulo: "Microstrip y stripline"
    texto: "En un circuito rápido la anchura de la pista es una especificación eléctrica. Toque la línea apantallada de forma natural, la que menos emite."
    libro: [35, 36, 43, 44, 64]
    widget:
      tipo: figura
      figura: fig-41.2
      zonas:
        - { id: microstrip, rotulo: "Panel de la izquierda", rect: [20, 30, 190, 125] }
        - { id: stripline, rotulo: "Panel de la derecha", rect: [247, 25, 190, 130] }
    tocar:
      bien: [stripline]
      porque:
        microstrip: "Es la microstrip, en una capa exterior: tiene aire encima y su campo no queda encerrado."
    exito: "La stripline, enterrada entre dos planos: todo el campo en FR4, unos 14 cm/ns, menos emisión y menos diafonía."
    escalera:
      - "Busque la pista con un plano a cada lado."
    solucion: "La de la derecha, la stripline."

  - id: pregunta-depende
    tipo: explorar
    fase: "Consiga"
    titulo: "De qué depende"
    texto: "Una microstrip exterior en FR4 tiene más impedancia de la pedida. Cambie anchura y dieléctrico hasta unos 50 Ω."
    libro: [39, 41, 58, 60, 65, "cap40#364"]
    inicio: { w_m: 0.25, h_m: 0.36 }
    widget:
      tipo: grafica
      x: { id: q, min: 0.25, max: 0.7, unidad: mm, rotulo: "anchura de la pista" }
      y: { min: 25, max: 85, unidad: Ω, rotulo: "Z₀" }
      curvas:
        - { expr: "58.4*(q-0.35)*(q-0.5)*(q-0.7)/(-0.01125) + 49.2*(q-0.25)*(q-0.5)*(q-0.7)/0.00525 + 40*(q-0.25)*(q-0.35)*(q-0.7)/(-0.0075) + 32.1*(q-0.25)*(q-0.35)*(q-0.5)/0.0315", color: azul, rotulo: "h = 0,2 mm" }
        - { expr: "77.7*(q-0.35)*(q-0.5)*(q-0.7)/(-0.01125) + 67.6*(q-0.25)*(q-0.5)*(q-0.7)/0.00525 + 57*(q-0.25)*(q-0.35)*(q-0.7)/(-0.0075) + 47.4*(q-0.25)*(q-0.35)*(q-0.5)/0.0315", color: naranja, rotulo: "h = 0,36 mm" }
        - { expr: "50 + 0*q", color: tinta, rotulo: "50 Ω", discontinua: true }
      marcas:
        - { x: "w_m", y: "Z_t", rotulo: "{{Z_t}}" }
      lectura: { valor: Z_t, rotulo: "Impedancia de la pista" }
      mandos:
        - { valor: w_m, lista: [0.25, 0.35, 0.5, 0.7], rotulo: "Anchura de la pista" }
        - { valor: h_m, lista: [0.2, 0.36], rotulo: "Dieléctrico, h" }
    objetivo:
      condiciones:
        - { valor: Z_t, objetivo: 50, tol: 0.02, rotulo: "Z₀: {{Z_t}}" }
      logrado: "{{w_m}} sobre {{h_m}}: {{Z_t}}. Si no hay especificación y las líneas son cortas, basta con calcular la anchura, sin pagar el control."
      pistas:
        - { cuando: { valor: Z_t, mayor: 51 }, texto: "Todavía sobra: ensanche la pista o acérquela al plano." }
        - { texto: "Se ha pasado: estreche la pista o aléjela del plano." }
    escalera:
      - "La impedancia baja al ensanchar la pista o al acercarla al plano."
    solucion: "0,35 mm sobre 0,2 mm: 49,2 Ω."
    comprobar:
      - { con: { w_m: 0.35, h_m: 0.2 }, Z_t: 49.2, tol: 0.001 }

  - id: predecir-mitad
    tipo: marcar
    titulo: "La anchura exacta"
    texto: "Con 0,2 mm de dieléctrico, 0,35 mm dan 49,2 Ω. Marque en esa curva la anchura exacta de 50 Ω."
    libro: [40, 41, "cap40#364", "cap40#365"]
    widget:
      tipo: grafica
      x: { id: q, min: 0.25, max: 0.7, unidad: mm, rotulo: "anchura de la pista" }
      y: { min: 25, max: 85, unidad: Ω, rotulo: "Z₀" }
      curvas:
        - { expr: "58.4*(q-0.35)*(q-0.5)*(q-0.7)/(-0.01125) + 49.2*(q-0.25)*(q-0.5)*(q-0.7)/0.00525 + 40*(q-0.25)*(q-0.35)*(q-0.7)/(-0.0075) + 32.1*(q-0.25)*(q-0.35)*(q-0.5)/0.0315", color: azul, rotulo: "h = 0,2 mm" }
        - { expr: "77.7*(q-0.35)*(q-0.5)*(q-0.7)/(-0.01125) + 67.6*(q-0.25)*(q-0.5)*(q-0.7)/0.00525 + 57*(q-0.25)*(q-0.35)*(q-0.7)/(-0.0075) + 47.4*(q-0.25)*(q-0.35)*(q-0.5)/0.0315", color: naranja, rotulo: "h = 0,36 mm" }
        - { expr: "50 + 0*q", color: tinta, rotulo: "50 Ω", discontinua: true }
      mandos: []
    marcar:
      modo: x
      curva: 0
      x: "w_34"
      tol: 0.03
      inicio: { x: 0.6, y: 35 }
      rotulo: "La anchura de 50 Ω con h = 0,2 mm"
      pasos: 90
    pistas:
      - { cuando: { valor: marca_x, mayor: 0.35 }, texto: "Ahí la impedancia ya baja de 50 Ω: algo más estrecha." }
      - { texto: "Ahí todavía sobra impedancia: algo más ancha." }
    exito: "0,34 mm. Con el plano a 0,1 mm haría falta la mitad: la fija la relación entre anchura y distancia, no la anchura sola."
    escalera:
      - "Busque dónde la curva azul cruza los 50 Ω, justo antes de 0,35 mm."
    solucion: "0,34 mm."

  - id: empareje-lineas
    tipo: pregunta
    titulo: "Dos geometrías"
    texto: "Empareje cada rasgo con su línea."
    libro: [43, 44]
    emparejar:
      - ["Capa exterior, campo en FR4 y aire", "Microstrip, unos 16,5 cm/ns"]
      - ["Enterrada entre dos planos", "Stripline, unos 14 cm/ns"]
      - ["Apantallada de forma natural", "Stripline, menos emisión"]
    exito: "La stripline es más lenta y emite y acopla menos."
    pistas:
      - { texto: "Con aire encima, la constante efectiva baja y la señal corre más." }
    escalera:
      - "Todo el campo en FR4 frena la señal."
    solucion: "Exterior, microstrip rápida; enterrada, stripline lenta y apantallada."

  - id: simule-desfase
    tipo: simular
    titulo: "Igual de largas, no igual de rápidas"
    texto: "Dos líneas de un bus miden 10 cm (valor de ejemplo): una por microstrip y otra por stripline. ¿Cuánto llega antes la primera?"
    libro: [43, 44, 45]
    fijar: { L_b: 10, v_ms: 16.5, v_sl: 14 }
    widget:
      tipo: grafica
      x: { id: ll, min: 0, max: 20, unidad: cm, rotulo: "longitud" }
      y: { min: 0, max: 1.5e-9, unidad: s, rotulo: "retardo" }
      curvas:
        - { expr: "ll/v_ms*1e-9", color: naranja, rotulo: "microstrip" }
        - { expr: "ll/v_sl*1e-9", color: azul, rotulo: "stripline", discontinua: true }
      lectura: { valor: dt_b, rotulo: "Desfase entre las dos" }
      ocultar: true
    simular:
      objetivo: dt_b
      unidad: s
      tol: 0.05
      rotulo: "Desfase, Δt"
      errores:
        - { expr: "t_ms", texto: "Ese es el retardo de la microstrip sola; se pide la diferencia entre las dos." }
        - { expr: "t_sl", texto: "Ese es el retardo de la stripline sola; se pide la diferencia entre las dos." }
    exito: "Unos 108 ps de desfase: en un bus con requisitos de desfase, todas por el mismo tipo de capa."
    escalera:
      - "Retardo = longitud / velocidad, para cada una."
      - "10/14 ns menos 10/16,5 ns."
    solucion: "714 ps − 606 ps = 108 ps."
    comprobar:
      - { dt_b: 1.082e-10, t_ms: 6.06e-10, t_sl: 7.14e-10, tol: 0.01 }

  - id: pregunta-par
    tipo: tocar
    titulo: "Las líneas diferenciales"
    texto: "Un par diferencial de 100 Ω se separa para rodear un obstáculo y se vuelve a juntar. Toque la regla que incumple."
    libro: [48, 49, "cap41#279"]
    widget:
      tipo: figura
      figura: fig-41.13
      zonas:
        - { id: r1, rotulo: "Primera regla", rect: [300, 28, 128, 34] }
        - { id: r2, rotulo: "Segunda regla", rect: [300, 70, 128, 34] }
        - { id: r3, rotulo: "Tercera regla", rect: [300, 112, 128, 34] }
        - { id: r4, rotulo: "Cuarta regla", rect: [300, 155, 128, 34] }
        - { id: r5, rotulo: "Quinta regla", rect: [300, 195, 128, 34] }
    tocar:
      bien: [r1]
      porque:
        r2: "Las dos pistas pueden seguir midiendo lo mismo: lo que cambia es la separación."
        r3: "Compensar cerca del origen es para el desfase de longitudes."
        r4: "El plano debajo sigue entero: aquí cambia la distancia entre las dos pistas."
        r5: "No hay cambio de capa en este caso."
    exito: "Separación constante: su impedancia diferencial depende de ella, y cualquier variación la cambia localmente y produce una reflexión."
    escalera:
      - "¿De qué depende la impedancia diferencial, además de la anchura y el plano?"
    solucion: "La primera: separación constante."

  - id: empareje-rompe
    tipo: tocar
    titulo: "Lo que rompe la impedancia"
    texto: "Una pista de 50 Ω bien calculada pasa sobre esto y su impedancia se rompe: es lo peor de todo. Tóquelo."
    libro: [52, 53, 54, 55, "cap41#32"]
    widget:
      tipo: figura
      figura: fig-41.1
      recorte: [225, 0, 225.72, 191.52]
      ampliar: 3.6
      zonas:
        - { id: ida, rotulo: "Línea azul", rect: [268, 57, 82, 9] }
        - { id: retorno, rotulo: "Línea discontinua, a la izquierda", rect: [268, 67, 75, 9] }
        - { id: corte, rotulo: "Rectángulo vertical", rect: [352, 26, 22, 112] }
    tocar:
      bien: [corte]
      porque:
        ida: "Es la propia pista, bien calculada."
        retorno: "Ahí el retorno aún va bajo la pista."
    exito: "Un corte en el plano debajo. También la rompen un cambio de capa sin vía de retorno, conectores y almohadillas, y el ramal de una vía pasante."
    escalera:
      - "La impedancia es de la pista y de su retorno."
    solucion: "El corte en el plano."

  - id: predecir-tdr
    tipo: predecir
    titulo: "En el banco: reflectometría"
    texto: "Se envía un escalón rápido y vuelve un escalón positivo a cierto tiempo. ¿Qué dice?"
    libro: [63]
    widget:
      tipo: figura
      figura: fig-41.2
      zonas:
        - { id: microstrip, rotulo: "Panel de la izquierda", rect: [20, 30, 190, 125] }
    opciones:
      - texto: "Impedancia mayor de la esperada, a la distancia que marca ese tiempo"
        bien: true
        porque: "Positivo, mayor; negativo, menor. El instante dice dónde está."
      - texto: "Impedancia menor de la esperada"
        porque: "Eso sería un escalón negativo."
      - texto: "Que la línea está bien adaptada"
        porque: "Adaptada no devuelve nada."
    escalera:
      - "Recuerde el signo de Γ con una carga mayor que Z₀."
    solucion: "Impedancia mayor, y el tiempo dice a qué distancia."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [41, 45, 49, 52]
    ideas:
      - { titulo: "Relación.", texto: "La fija la anchura frente a la distancia al plano, no la anchura sola." }
      - { titulo: "Dos líneas.", texto: "Microstrip más rápida; stripline más lenta y apantallada." }
      - { titulo: "Diferencial.", texto: "Separación constante en todo el recorrido." }
      - { titulo: "Lo que la rompe.", texto: "Un corte en el plano, lo peor de todo." }
