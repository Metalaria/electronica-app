# Lección 1.2 de la sección 42.5 «Jitter y Diagrama de Ojo» (cap41, sec-41.5). Formato: contenido/lecciones11/GUIA.md.
# - Las figuras 42.7 (fig-41.7, ojo abierto con máscara y ojo cerrado) y 42.8 (fig-41.8, las dos aperturas) con zonas.
# - Sin fórmula (la sección no tiene ecuaciones). Paso práctico: «tocar» la apertura que mide el margen de tiempo.
# 1.2.1 (autor121-pc, «aprender haciendo», GUIA §13): el instante de decisión, la apertura de tiempo, la máscara
# invadida y la apertura que más encoge con la ISI se tocan en las figuras 42.7 y 42.8. La ISI se ve en un canal paso
# bajo de primer orden (la respuesta 1 − e^(−t/τ) a un bit): se mejora el canal o se baja la velocidad hasta que el bit
# se establezca antes del siguiente (el 95 % del nivel es un umbral de ejemplo); lo segundo es el experimento del
# banco. Quedan dos preguntas de opciones (el ojo justo y el preénfasis).
leccion: cap41/sec-41.5

libro:
  128: "superponiendo todos los bits sobre el mismo intervalo"
  129: "su apertura mide directamente cuánto margen tiene el enlace"
  131: "Apertura vertical: el margen de tensión"
  132: "Apertura horizontal: el margen de tiempo"
  133: "Grosor de los cruces: jitter, directamente visible."
  134: "Grosor de los niveles: ruido y diafonía."
  135: "lo que suele indicar terminación o driver asimétricos"
  136: "un ojo justo significa que funcionará hoy y fallará con temperatura, con otro cable o con otra unidad"
  138: "un polígono que debe quedar dentro del ojo sin que ninguna traza lo toque"
  141: "Atenuación del canal, que crece con la frecuencia"
  143: "el canal, al ser paso bajo, hace que un bit no termine de establecerse antes de que llegue el siguiente"
  145: "la corrección consiste en compensar esa respuesta"
  146: "se transmite con más amplitud en las transiciones y menos en los bits sostenidos"
  147: "usa los bits ya decididos para restar su contribución al siguiente"
  148: "un canal cuyo ojo, medido sin ecualizar, está completamente cerrado"
  151: "cierre vertical uniforme es atenuación; trazas múltiples es ISI; cruces gruesos es jitter"
  153: "disparando con el reloj y activando persistencia"
  154: "bajar la velocidad y ver cómo se abre el ojo"
  155: "Un ojo abierto deja margen de tensión y tiempo; jitter y ruido lo cierran y provocan errores"
  156: "con las dos aperturas que miden el margen del enlace"

modelo:
  valores:
    UI: { sim: "UI", nombre: "duración de un bit", unidad: s, valor: 1e-9 }
    tau: { sim: "τ", nombre: "constante de tiempo del canal (ejemplo)", unidad: s, valor: 1e-9 }
    n_95: { sim: "v", nombre: "nivel que se toma como establecido (ejemplo)", unidad: "%", valor: 95 }
  calculos:
    v_ui: { expr: "100*(1 - exp(-UI/tau))", sim: "v(UI)", nombre: "nivel al llegar el bit siguiente", unidad: "%", cifras: 3 }

tarjetas:
  - id: explore-ojo
    tipo: tocar
    titulo: "Mil bits en una pantalla"
    texto: "Se superponen miles de bits sobre el mismo intervalo, disparando con el reloj. Toque el instante en que decide el receptor."
    libro: [128, 129, 136, 155]
    widget:
      tipo: figura
      figura: fig-41.7
      ampliar: 2.45
      zonas:
        - { id: izq, rotulo: "Cruce de la izquierda", rect: [62, 90, 28, 28] }
        - { id: centro, rotulo: "Centro del ojo", rect: [112, 70, 26, 70] }
        - { id: der, rotulo: "Cruce de la derecha", rect: [158, 90, 28, 28] }
    tocar:
      bien: [centro]
      porque:
        izq: "Es un cruce: ahí los bits cambian y la señal no está decidida."
        der: "Es un cruce: ahí los bits cambian y la señal no está decidida."
    exito: "En el centro del ojo: necesita apertura suficiente en las dos direcciones. La apertura mide el margen del enlace."
    escalera:
      - "El receptor decide lejos de los cambios de bit."
    solucion: "El centro del ojo."

  - id: toque-tiempo
    tipo: tocar
    titulo: "El margen de tiempo"
    texto: "Toque la apertura que mide el margen de tiempo del enlace."
    libro: [131, 132, 133, 134, 135, 156]
    widget:
      tipo: figura
      figura: fig-41.8
      zonas:
        - { id: vertical, rotulo: "Flecha vertical", rect: [113, 62, 36, 85] }
        - { id: horizontal, rotulo: "Flecha horizontal", rect: [70, 92, 42, 36] }
        - { id: umbral, rotulo: "Línea de puntos de la izquierda", rect: [25, 90, 36, 36] }
    tocar:
      bien: [horizontal]
      porque:
        vertical: "Es la apertura vertical: el margen de tensión."
        umbral: "Es el umbral de decisión, no una apertura."
    exito: "La horizontal: se la come el jitter, que engorda los cruces. El grosor de los niveles es ruido y diafonía; cruces desplazados de la mitad, asimetría."
    escalera:
      - "El tiempo va en el eje horizontal."
    solucion: "La flecha horizontal."

  - id: predecir-justo
    tipo: predecir
    titulo: "Un ojo justo"
    texto: "El ojo está abierto pero muy justo, y hoy el enlace funciona. ¿Qué cabe esperar?"
    libro: [136]
    widget:
      tipo: figura
      figura: fig-41.8
      zonas:
        - { id: cerrado, rotulo: "Panel de la derecha", rect: [245, 15, 195, 160] }
    opciones:
      - texto: "Que falle con temperatura, con otro cable o con otra unidad"
        bien: true
        porque: "Un ojo justo es un enlace sin margen."
      - texto: "Que siga funcionando: está abierto"
        porque: "Abierto hoy; cualquier cambio se come el poco margen que queda."
      - texto: "Que mejore con el uso"
        porque: "Nada en el canal mejora solo."
    escalera:
      - "¿Qué margen queda para lo que cambie?"
    solucion: "Fallará con temperatura, otro cable u otra unidad."

  - id: pregunta-mascara
    tipo: tocar
    titulo: "La máscara"
    texto: "Las normas convierten «tiene buena pinta» en un criterio objetivo. En el ojo de la derecha, toque lo que las trazas no pueden tocar."
    libro: [138, 155]
    widget:
      tipo: figura
      figura: fig-41.7
      recorte: [220, 0, 222.95, 206.46]
      ampliar: 1.6
      zonas:
        - { id: mascara, rotulo: "Hexágono de la derecha", rect: [318, 87, 40, 30] }
        - { id: nivel, rotulo: "Nivel de arriba, a la derecha", rect: [250, 52, 180, 20] }
        - { id: cruce, rotulo: "Cruce de la derecha", rect: [380, 90, 30, 30] }
    tocar:
      bien: [mascara]
      porque:
        nivel: "Es el nivel alto, engrosado por el ruido: ahí sí deben estar las trazas."
        cruce: "Es un cruce: ahí pasan los flancos."
    exito: "La máscara: ninguna traza puede tocarla. Aquí la invaden: errores, y el enlace no pasaría la certificación."
    escalera:
      - "Busque el polígono del centro del ojo."
    solucion: "El hexágono naranja."

  - id: toque-isi
    tipo: tocar
    titulo: "Atenuación e ISI"
    texto: "La atenuación y la interferencia entre símbolos casi cierran el ojo de la derecha. Compárelo con el abierto y toque la apertura que más ha encogido."
    libro: [131, 132, 141, 151, 156]
    widget:
      tipo: figura
      figura: fig-41.8
      ampliar: 3.2
      zonas:
        - { id: vertical, rotulo: "Flecha vertical de la derecha", rect: [330, 84, 20, 44] }
        - { id: horizontal, rotulo: "Flecha horizontal de la derecha", rect: [300, 96, 80, 21] }
    tocar:
      bien: [vertical]
      porque:
        horizontal: "También encoge, pero mucho menos: compárela con la del ojo abierto."
    exito: "La vertical: se la comen la atenuación, las reflexiones, la diafonía y el ruido. Cierre vertical uniforme es atenuación; trazas múltiples, ISI; cruces gruesos, jitter."
    escalera:
      - "Compare la longitud de cada flecha con la del ojo de la izquierda."
    solucion: "La flecha vertical, el margen de tensión."
  - id: porque-isi
    tipo: explorar
    fase: "Consiga"
    titulo: "La interferencia entre símbolos"
    texto: "El canal es paso bajo: un bit no termina de establecerse antes del siguiente. Mejore el canal hasta que el bit llegue al nivel de establecido."
    nota: "Valores de ejemplo."
    libro: [143, 145]
    fijar: { UI: 1e-9, n_95: 95 }
    inicio: { tau: 1e-9 }
    widget:
      tipo: grafica
      x: { id: t, min: 0, max: 5e-9, unidad: s, rotulo: "t" }
      y: { min: 0, max: 110, unidad: "%", rotulo: "nivel" }
      curvas:
        - { expr: "100*(1 - exp(-t/tau))", color: naranja, rotulo: "el bit tras el canal" }
        - { expr: "n_95 + 0*t", color: tinta, rotulo: "establecido", discontinua: true }
      marcas:
        - { x: "UI", y: "v_ui", rotulo: "siguiente bit: {{v_ui}}" }
      lectura: { valor: v_ui, rotulo: "Nivel al llegar el bit siguiente" }
      mandos:
        - { valor: tau, lista: [1e-9, 0.7e-9, 0.5e-9, 0.3e-9, 0.2e-9], rotulo: "Constante de tiempo del canal, τ" }
    objetivo:
      condiciones:
        - { valor: v_ui, min: 95, rotulo: "Nivel: {{v_ui}}" }
      logrado: "Con τ = {{tau}}, el bit llega a {{v_ui}} antes del siguiente. Con un canal lento, cada bit arrastra los anteriores: eso es la ISI."
      pistas:
        - { texto: "El bit aún no se ha establecido cuando llega el siguiente: un canal más rápido, τ menor." }
    escalera:
      - "Con τ mucho menor que la duración del bit, la curva sube antes."
    solucion: "τ de 0,3 ns o menos."
    comprobar:
      - { con: { tau: 0.3e-9 }, v_ui: 96.4, tol: 0.01 }

  - id: pregunta-ecualizacion
    tipo: pregunta
    titulo: "La ecualización"
    texto: "¿Qué hace el preénfasis en el emisor?"
    libro: [146, 147, 148]
    widget:
      tipo: figura
      figura: fig-41.8
      zonas:
        - { id: cerrado, rotulo: "Panel de la derecha", rect: [245, 15, 195, 160] }
    opciones:
      - texto: "Transmite más amplitud en las transiciones y menos en los bits sostenidos"
        bien: true
        porque: "Compensa que el canal atenúe más las altas: a la llegada, plano."
      - texto: "Resta la contribución de los bits ya decididos"
        porque: "Eso es el ecualizador de decisión realimentada, en el receptor."
      - texto: "Sube la amplitud de todos los bits por igual"
        porque: "No compensaría la diferencia entre frecuencias altas y bajas."
    escalera:
      - "Las transiciones son las que llevan las frecuencias altas."
    solucion: "Realza las transiciones frente a los bits sostenidos."

  - id: pregunta-banco
    tipo: explorar
    fase: "En el banco"
    titulo: "En el banco"
    texto: "Con el osciloscopio en persistencia, el ojo está cerrado. Sin tocar el canal, baje la velocidad del enlace hasta que cada bit se establezca."
    nota: "Valores de ejemplo."
    libro: [153, 154]
    fijar: { tau: 1e-9, n_95: 95 }
    inicio: { UI: 1e-9 }
    widget:
      tipo: grafica
      x: { id: t, min: 0, max: 5e-9, unidad: s, rotulo: "t" }
      y: { min: 0, max: 110, unidad: "%", rotulo: "nivel" }
      curvas:
        - { expr: "100*(1 - exp(-t/tau))", color: naranja, rotulo: "el bit tras el canal" }
        - { expr: "n_95 + 0*t", color: tinta, rotulo: "establecido", discontinua: true }
      marcas:
        - { x: "UI", y: "v_ui", rotulo: "siguiente bit: {{v_ui}}" }
      lectura: { valor: v_ui, rotulo: "Nivel al llegar el bit siguiente" }
      mandos:
        - { valor: UI, lista: [1e-9, 1.5e-9, 2e-9, 3e-9, 4e-9], rotulo: "Duración de un bit, UI" }
    objetivo:
      condiciones:
        - { valor: v_ui, min: 95, rotulo: "Nivel: {{v_ui}}" }
      logrado: "Con bits de {{UI}}, el ojo se abre. Bajar la velocidad y verlo abrirse demuestra que el problema es el canal, no el protocolo."
      pistas:
        - { texto: "Todavía no: bits más largos, velocidad más baja." }
    escalera:
      - "Bits de unas tres constantes de tiempo."
    solucion: "Bits de 3 ns o más."
    comprobar:
      - { con: { UI: 3e-9 }, v_ui: 95.0, tol: 0.01 }

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [129, 136, 151, 148]
    ideas:
      - { titulo: "El ojo.", texto: "Miles de bits superpuestos: su apertura es el margen." }
      - { titulo: "Dos aperturas.", texto: "Vertical, tensión; horizontal, tiempo." }
      - { titulo: "Firmas.", texto: "Uniforme, atenuación; trazas múltiples, ISI; cruces gruesos, jitter." }
      - { titulo: "Ecualizar.", texto: "Preénfasis y DFE abren ojos que sin ellos están cerrados." }
