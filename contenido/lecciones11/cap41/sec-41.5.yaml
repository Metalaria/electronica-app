# Lección 1.2 de la sección 42.5 «Jitter y Diagrama de Ojo» (cap41, sec-41.5). Formato: contenido/lecciones11/GUIA.md.
# - Las figuras 42.7 (fig-41.7, ojo abierto con máscara y ojo cerrado) y 42.8 (fig-41.8, las dos aperturas) con zonas.
# - Sin fórmula (la sección no tiene ecuaciones). Paso práctico: «tocar» la apertura que mide el margen de tiempo.
leccion: cap41/sec-41.5

libro:
  128: "superponiendo todos los bits sobre el mismo intervalo"
  129: "su apertura mide directamente cuánto margen tiene el enlace"
  131: "Apertura vertical: el margen de tensión"
  132: "Apertura horizontal: el margen de tiempo"
  133: "Grosor de los cruces: jitter, directamente visible."
  134: "Grosor de los niveles: ruido y diafonía."
  135: "lo que suele indicar terminación o driver asimétricos"
  136: "un ojo justo significa que funcionará hoy y fallará con temperatura, con otro cable o con otra unidad"
  138: "un polígono que debe quedar dentro del ojo sin que ninguna traza lo toque"
  143: "el canal, al ser paso bajo, hace que un bit no termine de establecerse antes de que llegue el siguiente"
  146: "se transmite con más amplitud en las transiciones y menos en los bits sostenidos"
  147: "usa los bits ya decididos para restar su contribución al siguiente"
  148: "un canal cuyo ojo, medido sin ecualizar, está completamente cerrado"
  151: "cierre vertical uniforme es atenuación; trazas múltiples es ISI; cruces gruesos es jitter"
  154: "bajar la velocidad y ver cómo se abre el ojo"
  155: "Un ojo abierto deja margen de tensión y tiempo; jitter y ruido lo cierran y provocan errores"
  156: "con las dos aperturas que miden el margen del enlace"

modelo: { valores: {}, calculos: {} }

tarjetas:
  - id: explore-ojo
    tipo: explorar
    titulo: "Mil bits en una pantalla"
    texto: "Se superponen todos los bits sobre el mismo intervalo. Toque los márgenes, la máscara y el ojo cerrado."
    libro: [128, 129, 155]
    widget:
      tipo: figura
      figura: fig-41.7
      zonas:
        - { id: tension, rotulo: "Flecha vertical", rect: [112, 50, 50, 36], texto: "El margen de tensión: lo que sobra entre el nivel y el umbral." }
        - { id: mascara, rotulo: "Hexágono naranja", rect: [100, 87, 52, 36], texto: "La máscara: ninguna traza puede tocarla." }
        - { id: tiempo, rotulo: "Texto margen de tiempo", rect: [118, 123, 52, 36], texto: "El margen de tiempo: lo que sobra alrededor del instante de muestreo." }
        - { id: cerrado, rotulo: "Panel de la derecha", rect: [245, 15, 195, 160], texto: "Ojo cerrado por jitter y ruido: trazas que invaden la máscara, errores." }
    requiere: { mover: [tension, tiempo, cerrado] }

  - id: toque-tiempo
    tipo: tocar
    titulo: "El margen de tiempo"
    texto: "Toque la apertura que mide el margen de tiempo del enlace."
    libro: [131, 132, 156]
    widget:
      tipo: figura
      figura: fig-41.8
      zonas:
        - { id: vertical, rotulo: "Flecha vertical", rect: [113, 62, 36, 85] }
        - { id: horizontal, rotulo: "Flecha horizontal", rect: [70, 92, 42, 36] }
        - { id: umbral, rotulo: "Línea de puntos de la izquierda", rect: [25, 90, 36, 36] }
    tocar:
      bien: [horizontal]
      porque:
        vertical: "Es la apertura vertical: el margen de tensión."
        umbral: "Es el umbral de decisión, no una apertura."
    exito: "La apertura horizontal: lo que sobra alrededor del instante de muestreo. Se la come el jitter."
    escalera:
      - "El tiempo va en el eje horizontal."
    solucion: "La flecha horizontal."

  - id: empareje-lectura
    tipo: pregunta
    titulo: "Qué se lee en él"
    texto: "Empareje cada rasgo del ojo con lo que dice."
    libro: [131, 132, 133, 134, 135]
    emparejar:
      - ["Apertura vertical", "Margen de tensión"]
      - ["Apertura horizontal", "Margen de tiempo"]
      - ["Grosor de los cruces", "Jitter"]
      - ["Grosor de los niveles", "Ruido y diafonía"]
      - ["Cruces fuera de la mitad", "Terminación o driver asimétricos"]
    exito: "El receptor decide en el centro: necesita apertura en las dos direcciones."
    pistas:
      - { texto: "El jitter mueve los flancos en el tiempo." }
    escalera:
      - "Lo vertical es tensión; lo horizontal, tiempo."
    solucion: "Vertical, tensión; horizontal, tiempo; cruces, jitter; niveles, ruido; cruces desplazados, asimetría."

  - id: predecir-justo
    tipo: predecir
    titulo: "Un ojo justo"
    texto: "El ojo está abierto pero muy justo, y hoy el enlace funciona. ¿Qué cabe esperar?"
    libro: [136]
    widget:
      tipo: figura
      figura: fig-41.8
      zonas:
        - { id: cerrado, rotulo: "Panel de la derecha", rect: [245, 15, 195, 160] }
    opciones:
      - texto: "Que falle con temperatura, con otro cable o con otra unidad"
        bien: true
        porque: "Un ojo justo es un enlace sin margen."
      - texto: "Que siga funcionando: está abierto"
        porque: "Abierto hoy; cualquier cambio se come el poco margen que queda."
      - texto: "Que mejore con el uso"
        porque: "Nada en el canal mejora solo."
    escalera:
      - "¿Qué margen queda para lo que cambie?"
    solucion: "Fallará con temperatura, otro cable u otra unidad."

  - id: pregunta-mascara
    tipo: pregunta
    titulo: "La máscara"
    texto: "¿Para qué definen las normas una máscara dentro del ojo?"
    libro: [138]
    widget:
      tipo: figura
      figura: fig-41.7
      zonas:
        - { id: mascara, rotulo: "Hexágono naranja", rect: [100, 87, 52, 36] }
    opciones:
      - texto: "Para convertir «tiene buena pinta» en un criterio de aceptación objetivo"
        bien: true
        porque: "Ninguna traza puede tocarla: es lo que se comprueba en certificación."
      - texto: "Para tapar el ruido de la pantalla"
        porque: "No tapa nada: marca la zona que debe quedar libre."
      - texto: "Para medir el jitter"
        porque: "El jitter se ve en el grosor de los cruces; la máscara es el criterio de aceptación."
    escalera:
      - "Es una zona prohibida para las trazas."
    solucion: "Un criterio de aceptación objetivo."

  - id: empareje-firmas
    tipo: pregunta
    titulo: "Las causas, por su firma"
    texto: "El ojo está cerrado. Empareje cada firma con su causa."
    libro: [151]
    emparejar:
      - ["Cierre vertical uniforme", "Atenuación"]
      - ["Trazas múltiples", "Interferencia entre símbolos"]
      - ["Cruces gruesos", "Jitter"]
    exito: "Así se separan las causas sin diagnosticar cada efecto por separado."
    pistas:
      - { texto: "La ISI da varias trazas según el patrón previo." }
    escalera:
      - "El jitter mueve los cruces en el tiempo."
    solucion: "Uniforme, atenuación; múltiples, ISI; cruces gruesos, jitter."

  - id: porque-isi
    tipo: porque
    titulo: "La interferencia entre símbolos"
    texto: "¿Por qué el valor de un bit depende de los anteriores en un enlace rápido?"
    libro: [143]
    widget:
      tipo: figura
      figura: fig-41.8
      zonas:
        - { id: cerrado, rotulo: "Panel de la derecha", rect: [245, 15, 195, 160] }
    opciones:
      - texto: "El canal es paso bajo: un bit no termina de establecerse antes del siguiente"
        bien: true
        porque: "Es la causa dominante de cierre horizontal en enlaces rápidos."
      - texto: "Por el jitter del reloj"
        porque: "El jitter engorda los cruces; la dependencia del patrón es ISI."
      - texto: "Porque el receptor se equivoca"
        porque: "El receptor decide bien sobre lo que le llega; lo que llega ya está mezclado."
    escalera:
      - "Un paso bajo tarda en llegar a su valor final."
    solucion: "El canal paso bajo mezcla cada bit con los anteriores."

  - id: pregunta-ecualizacion
    tipo: pregunta
    titulo: "La ecualización"
    texto: "¿Qué hace el preénfasis en el emisor?"
    libro: [146, 147, 148]
    widget:
      tipo: figura
      figura: fig-41.8
      zonas:
        - { id: cerrado, rotulo: "Panel de la derecha", rect: [245, 15, 195, 160] }
    opciones:
      - texto: "Transmite más amplitud en las transiciones y menos en los bits sostenidos"
        bien: true
        porque: "Compensa que el canal atenúe más las altas: a la llegada, plano."
      - texto: "Resta la contribución de los bits ya decididos"
        porque: "Eso es el ecualizador de decisión realimentada, en el receptor."
      - texto: "Sube la amplitud de todos los bits por igual"
        porque: "No compensaría la diferencia entre frecuencias altas y bajas."
    escalera:
      - "Las transiciones son las que llevan las frecuencias altas."
    solucion: "Realza las transiciones frente a los bits sostenidos."

  - id: pregunta-banco
    tipo: predecir
    titulo: "En el banco"
    texto: "Con el osciloscopio en persistencia se baja la velocidad del enlace y el ojo se abre. ¿Qué demuestra?"
    libro: [154]
    widget:
      tipo: figura
      figura: fig-41.7
      zonas:
        - { id: cerrado, rotulo: "Panel de la derecha", rect: [245, 15, 195, 160] }
    opciones:
      - texto: "Que el problema es el canal, no el protocolo"
        bien: true
        porque: "Es la demostración más directa."
      - texto: "Que el protocolo estaba mal"
        porque: "El protocolo es el mismo a las dos velocidades."
      - texto: "Que el osciloscopio no tenía ancho de banda"
        porque: "El ojo se abre por el enlace, no por el instrumento."
    escalera:
      - "¿Qué cambia al bajar la velocidad, y qué no?"
    solucion: "Que el problema es el canal."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [129, 136, 151, 148]
    ideas:
      - { titulo: "El ojo.", texto: "Miles de bits superpuestos: su apertura es el margen." }
      - { titulo: "Dos aperturas.", texto: "Vertical, tensión; horizontal, tiempo." }
      - { titulo: "Firmas.", texto: "Uniforme, atenuación; trazas múltiples, ISI; cruces gruesos, jitter." }
      - { titulo: "Ecualizar.", texto: "Preénfasis y DFE abren ojos que sin ellos están cerrados." }
