# Lección 1.2 de la sección 42.8 «Pérdidas a Alta Velocidad y Ecualización» (cap41, sec-41.8). Formato: GUIA.md.
# - Las dos pérdidas de la figura 42.12 (fig-41.12) vivas: conductor ∝ √f y dieléctrico ∝ f·tan δ (bloques 226–227),
#   que en FR4 (tan δ = 0,02) se cruzan hacia 1,1 GHz con 0,032 dB/cm cada una (valores de la figura; el texto dice «en
#   torno al gigahercio», bloque 228). Con otro tan δ de la tabla del bloque 231, el cruce pasa a f₀·(0,02/tan δ)².
# - Sin fórmula del libro (la sección no tiene ecuaciones) ni paso práctico numérico: se toca la gráfica.
# 1.2.1 (autor121-pc, «aprender haciendo», GUIA §13): el material se elige con una meta (un orden de magnitud menos
# de tan δ que el FR4: Rogers o PTFE), el cruce se marca en la curva, se escriben lo que pierden 10 cm en el cruce y el
# cruce con FR4 de bajas pérdidas (de las dos leyes, √f y f: f₀·(0,02/tan δ)²), y la recta del dieléctrico se toca en
# la figura 42.12 para la medida de S21. Quedan dos preguntas de opciones (el tejido de vidrio y el límite de la
# ecualización) y el emparejamiento de las otras pérdidas: 62 % (5 de 8), sección de mecanismos y materiales.
leccion: cap41/sec-41.8

libro:
  224: "esa atenuación crece con la frecuencia"
  226: "la resistencia crece con la raíz de la frecuencia"
  227: "Crecen linealmente con la frecuencia"
  228: "a baja frecuencia domine el conductor y a alta el dieléctrico, con un cruce que en FR4 está en torno al gigahercio"
  231: "0,002 – 0,004"
  232: "La diferencia entre FR4 y un material de RF es de un orden de magnitud, y se paga en precio"
  233: "Se mitiga encaminando en ángulo respecto a la trama"
  235: "cada componente frecuencial se atenúa de forma distinta, y eso deforma el pulso"
  242: "la ecualización compensa la atenuación y no crea información que se haya perdido bajo el suelo de ruido"
  244: "en placas rápidas se especifica cobre de baja rugosidad"
  246: "cada vía, cada conector, cada cambio de anchura produce una reflexión"
  249: "enviar un flanco rápido por dos metros de cable y compararlo con el original"
  248: "proporcional a √f es el conductor; proporcional a f, el dieléctrico"
  250: "Los dos mecanismos de pérdida en una línea y cuál domina según la frecuencia"

modelo:
  valores:
    tand: { sim: "tan δ", nombre: "tangente de pérdidas", unidad: "", valor: 0.02 }
    f_0: { sim: "f₀", nombre: "cruce en FR4 (figura 42.12)", unidad: Hz, valor: 1.1e9 }
    a_0: { sim: "α₀", nombre: "atenuación de cada una en el cruce (figura 42.12)", unidad: "dB/cm", valor: 0.032 }
    L_l: { sim: "L", nombre: "longitud de la línea (ejemplo)", unidad: cm, valor: 10 }
  calculos:
    f_x: { expr: "f_0*(0.02/tand)^2", sim: "f_{cruce}", nombre: "frecuencia de cruce", unidad: Hz }
    f_x1: { expr: "f_0*(0.02/tand)", sim: "f", nombre: "con el cociente sin elevar al cuadrado", unidad: Hz }
    A_l: { expr: "2*a_0*L_l", sim: "A", nombre: "pérdida de la línea en el cruce", unidad: dB }
    A_1: { expr: "a_0*L_l", sim: "A", nombre: "solo una de las dos pérdidas", unidad: dB }

tarjetas:
  - id: explore-perdidas
    tipo: explorar
    fase: "Consiga"
    titulo: "Dos mecanismos de pérdida"
    texto: "El conductor pierde con √f por el efecto pelicular; el dieléctrico, con f por su polarización. Elija un material con un orden de magnitud menos de tan δ que el FR4."
    libro: [224, 226, 227, 231, 232, 250]
    inicio: { tand: 0.02 }
    widget:
      tipo: grafica
      x: { id: nu, min: 10000000, max: 30000000000, unidad: Hz, rotulo: "f", escala: log }
      y: { min: 0.001, max: 1, unidad: "dB/cm", rotulo: "atenuación", escala: log }
      curvas:
        - { expr: "a_0*sqrt(nu/f_0)", color: azul, rotulo: "conductor ∝ √f", discontinua: true }
        - { expr: "a_0*nu/f_0*tand/0.02", color: naranja, rotulo: "dieléctrico ∝ f", discontinua: true }
        - { expr: "a_0*sqrt(nu/f_0) + a_0*nu/f_0*tand/0.02", color: tinta, rotulo: "total" }
      lectura: { valor: f_x, rotulo: "Cruce de los dos" }
      mandos:
        - { valor: tand, lista: [0.02, 0.01, 0.002, 0.001], nombres: ["FR4", "FR4 bajas pérdidas", "Rogers", "PTFE"], rotulo: "Material" }
    objetivo:
      condiciones:
        - { valor: tand, max: 0.002, rotulo: "tan δ: {{tand}}" }
      logrado: "Con tan δ = {{tand}}, el dieléctrico deja de mandar hasta {{f_x}}. Un material de RF se paga en precio: es de las decisiones que más condicionan un diseño rápido."
      pistas:
        - { texto: "Todavía es FR4: baje un orden de magnitud la tangente de pérdidas." }
    escalera:
      - "0,02 entre diez."
    solucion: "Rogers (0,002) o PTFE (0,001)."
    comprobar:
      - { con: { tand: 0.002 }, f_x: 110e9, tol: 0.01 }

  - id: predecir-cruce
    tipo: marcar
    titulo: "Dónde se cruzan"
    texto: "En FR4, a baja frecuencia domina el conductor y a alta el dieléctrico. Marque en la recta del conductor dónde se cruzan."
    libro: [228, 250]
    fijar: { tand: 0.02 }
    widget:
      tipo: grafica
      x: { id: nu, min: 10000000, max: 30000000000, unidad: Hz, rotulo: "f", escala: log }
      y: { min: 0.001, max: 1, unidad: "dB/cm", rotulo: "atenuación", escala: log }
      curvas:
        - { expr: "a_0*sqrt(nu/f_0)", color: azul, rotulo: "conductor ∝ √f", discontinua: true }
        - { expr: "a_0*nu/f_0*tand/0.02", color: naranja, rotulo: "dieléctrico ∝ f", discontinua: true }
        - { expr: "a_0*sqrt(nu/f_0) + a_0*nu/f_0*tand/0.02", color: tinta, rotulo: "total" }
      mandos: []
    marcar:
      modo: x
      curva: 0
      x: "f_0"
      tol: 0.03
      inicio: { x: 30000000, y: 0.01 }
      rotulo: "El cruce de las dos pérdidas"
      pasos: 140
    pistas:
      - { cuando: { valor: marca_x, menor: 1100000000 }, texto: "Ahí aún manda el conductor: más a la derecha." }
      - { texto: "Ahí ya manda el dieléctrico: más a la izquierda." }
    exito: "En torno al gigahercio. Y como cada frecuencia se atenúa distinto, el flanco llega redondeado: aparece la interferencia entre símbolos."
    escalera:
      - "Busque dónde las dos rectas discontinuas se tocan."
    solucion: "Hacia 1,1 GHz."

  - id: lea-10cm
    tipo: leer
    titulo: "Lo que pierde una línea"
    texto: "En el cruce, cada pérdida vale {{a_0}}. Escriba lo que pierden 10 cm de microstrip a esa frecuencia (longitud de ejemplo)."
    libro: [224, 250]
    fijar: { tand: 0.02, L_l: 10 }
    widget:
      tipo: grafica
      x: { id: nu, min: 10000000, max: 30000000000, unidad: Hz, rotulo: "f", escala: log }
      y: { min: 0.001, max: 1, unidad: "dB/cm", rotulo: "atenuación", escala: log }
      curvas:
        - { expr: "a_0*sqrt(nu/f_0)", color: azul, rotulo: "conductor ∝ √f", discontinua: true }
        - { expr: "a_0*nu/f_0*tand/0.02", color: naranja, rotulo: "dieléctrico ∝ f", discontinua: true }
        - { expr: "a_0*sqrt(nu/f_0) + a_0*nu/f_0*tand/0.02", color: tinta, rotulo: "total" }
      mandos: []
    leer:
      objetivo: A_l
      unidad: dB
      tol: 0.03
      rotulo: "Pérdida de los 10 cm"
      errores:
        - { expr: "A_1", texto: "Esa es una sola de las dos pérdidas: en el cruce valen lo mismo y se suman." }
    exito: "0,64 dB: las dos pérdidas se suman y crecen con la longitud."
    escalera:
      - "Dos pérdidas iguales por centímetro, por diez centímetros."
    solucion: "Las dos, {{a_0}} cada una, por 10 cm: 0,64 dB."
    comprobar:
      - { A_l: 0.64, A_1: 0.32, a_0: 0.032 }

  - id: lea-cruce
    tipo: leer
    titulo: "FR4 de bajas pérdidas"
    texto: "Con FR4 de bajas pérdidas, tan δ = 0,01, el dieléctrico pierde la mitad. Mire dónde se cruzan ahora y escriba la frecuencia."
    libro: [226, 227, 231]
    fijar: { tand: 0.01 }
    widget:
      tipo: grafica
      x: { id: nu, min: 10000000, max: 30000000000, unidad: Hz, rotulo: "f", escala: log }
      y: { min: 0.001, max: 1, unidad: "dB/cm", rotulo: "atenuación", escala: log }
      curvas:
        - { expr: "a_0*sqrt(nu/f_0)", color: azul, rotulo: "conductor ∝ √f", discontinua: true }
        - { expr: "a_0*nu/f_0*tand/0.02", color: naranja, rotulo: "dieléctrico ∝ f", discontinua: true }
        - { expr: "a_0*sqrt(nu/f_0) + a_0*nu/f_0*tand/0.02", color: tinta, rotulo: "total" }
      mandos: []
    leer:
      objetivo: f_x
      unidad: Hz
      tol: 0.05
      rotulo: "Nuevo cruce"
      errores:
        - { expr: "f_x1", texto: "Ha doblado la frecuencia: como el conductor crece con √f, el cruce se aleja el cuadrado, cuatro veces." }
    exito: "Unos 4,4 GHz, cuatro veces más arriba: un orden de magnitud en tan δ lo lleva cien veces más lejos."
    escalera:
      - "Con la mitad de pendiente en el dieléctrico, el cruce se mueve al cuadrado del factor."
    solucion: "{{f_0}} × 4 = 4,4 GHz."
    comprobar:
      - { f_x: 4.4e9, f_x1: 2.2e9, f_0: 1.1e9 }

  - id: porque-tejido
    tipo: porque
    titulo: "El FR4 no es homogéneo"
    texto: "Las dos pistas de un par diferencial llegan con distinto retardo aunque midan lo mismo. ¿Por qué, en FR4?"
    libro: [233]
    widget:
      tipo: figura
      figura: fig-41.12
      zonas:
        - { id: grafica, rotulo: "La gráfica", rect: [35, 0, 400, 195] }
    opciones:
      - texto: "Es un tejido de vidrio en resina: la constante dieléctrica cambia bajo cada pista"
        bien: true
        porque: "Efecto de tejido de vidrio; se mitiga encaminando en ángulo respecto a la trama."
      - texto: "Por el efecto pelicular"
        porque: "El pelicular atenúa; el retardo distinto viene del dieléctrico bajo cada pista."
      - texto: "Porque una pista siempre es más ancha"
        porque: "Pueden ser idénticas: la diferencia está debajo, en el sustrato."
    escalera:
      - "¿Qué hay bajo cada pista: fibra o resina?"
    solucion: "El tejido de vidrio: fibra bajo una, resina bajo otra."

  - id: porque-limite
    tipo: porque
    titulo: "El límite de la ecualización"
    texto: "Si el canal es conocido, ¿por qué la ecualización no recupera cualquier enlace?"
    libro: [242]
    widget:
      tipo: figura
      figura: fig-41.12
      zonas:
        - { id: grafica, rotulo: "La gráfica", rect: [35, 0, 400, 195] }
    opciones:
      - texto: "Al realzar las altas realza también el ruido"
        bien: true
        porque: "Compensa la atenuación, pero no crea la información perdida bajo el suelo de ruido."
      - texto: "Porque el canal no es lineal"
        porque: "Es LTI: su efecto es una convolución conocida, y se puede deshacer."
      - texto: "Porque no se puede ecualizar en el receptor"
        porque: "Se puede, en el emisor y en el receptor."
    escalera:
      - "¿Qué más hay en las frecuencias altas además de la señal?"
    solucion: "Porque realza también el ruido."

  - id: empareje-otras
    tipo: pregunta
    titulo: "Las otras pérdidas"
    texto: "Empareje cada pérdida con lo que la causa o la remedia."
    libro: [244, 246]
    emparejar:
      - ["Rugosidad del cobre", "Cobre de baja rugosidad"]
      - ["Discontinuidades", "Cada vía, conector o cambio de anchura refleja"]
    exito: "Las dos se suman a las del conductor y del dieléctrico."
    pistas:
      - { texto: "A alta frecuencia la corriente recorre las irregularidades de la superficie." }
    escalera:
      - "Una reflexión resta de lo que se transmite."
    solucion: "Rugosidad, cobre liso; discontinuidades, reflexiones."

  - id: pregunta-banco
    tipo: tocar
    fase: "En el banco"
    titulo: "En el banco"
    texto: "Se mide S21 en un tramo de línea y la atenuación crece en proporción a la frecuencia. Toque la recta que tiene esa pendiente."
    libro: [248, 249, 250]
    widget:
      tipo: figura
      figura: fig-41.12
      zonas:
        - { id: dielectrico, rotulo: "Recta discontinua de abajo", rect: [122, 168, 18, 14] }
        - { id: conductor, rotulo: "Curvas de arriba", rect: [122, 128, 18, 16] }
    tocar:
      bien: [dielectrico]
      porque:
        conductor: "Esas crecen con √f, la mitad de pendiente en esta escala: es el conductor."
    exito: "La del dieléctrico: proporcional a f. Proporcional a √f sería el conductor. Sin analizador, un flanco por dos metros de cable ya se ve redondeado."
    escalera:
      - "En escala logarítmica, la más inclinada es la proporcional a f."
    solucion: "La recta discontinua del dieléctrico."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [228, 232, 235, 242]
    ideas:
      - { titulo: "Dos leyes.", texto: "Conductor ∝ √f; dieléctrico ∝ f; se cruzan hacia el gigahercio en FR4." }
      - { titulo: "Material.", texto: "Un orden de magnitud de FR4 a RF, y se paga." }
      - { titulo: "Forma.", texto: "La atenuación redondea los flancos y produce ISI." }
      - { titulo: "Ecualizar.", texto: "Compensa, pero no recupera lo perdido bajo el ruido." }
