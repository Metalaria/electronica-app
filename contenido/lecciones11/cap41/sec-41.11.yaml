# Lección 1.2 de la sección 42.11 «Problemas de Diseño» (cap41, sec-41.11). Formato: contenido/lecciones11/GUIA.md.
# - 42.A: R_s = Z₀ − R_salida = 30 Ω (bloque 312); paralelo a masa, 3,3²/50 = 218 mW por línea en alto (bloque 315):
#   0,87 W con 8 líneas al 50 % y 3,48 W con 32 (bloque 317); Thévenin 109 mW por línea constantes (bloque 318); el nivel
#   alto real, 3,3·50/70 ≈ 2,4 V (bloque 316).
# - 42.B: |Z| de un 100 nF (1,2 nH) en paralelo con un 1 nF (0,8 nH) con la ESR de 15 mΩ (dentro de los 10–20 mΩ del
#   bloque 335): la antirresonancia f = 1/(2π√(2 nH × 0,99 nF)) ≈ 113 MHz (bloque 334).
# - 42.C: acoplamiento relativo 1/(1 + (s/h)²) (bloque 348): 10 % con s = 3h; con h = 0,5 mm hacen falta 1,5 mm
#   (bloque 351).
# Pasos prácticos: «simular» la antirresonancia (113 MHz; errores: la resonancia propia de cada uno) y «ajuste» de la
# separación hasta el 10 % con h = 0,5 mm.
leccion: cap41/sec-41.11

libro:
  306: "Terminación serie o paralelo"
  308: "Un bus de 32 líneas a 3,3 V debe terminarse. La impedancia de la pista es 50 Ω y la salida del driver tiene 20 Ω."
  312: 'R_("s") = Z_("0") - R_("salida") = "50" - "20" = "30 Ω"'
  315: '"218 mW" space "por línea en nivel alto"'
  316: "el nivel alto real caería a 3,3 · 50/70 ≈ 2,4 V"
  317: "32 líneas en alto el 50 % del tiempo"
  318: "3,3²/100 = 109 mW por línea, constantes, lo que da 3,48 W con 32 líneas sea cual sea el patrón de datos"
  319: "Ahorra unos 3,5 W frente a la paralelo o la Thévenin"
  320: "Con varios receptores repartidos a lo largo de la línea, los intermedios ven media tensión"
  322: "prueba también 22 y 33 Ω, los valores E12 habituales"
  324: "Por qué el desacoplo lleva varios valores"
  330: "Cerámico 100 nF"
  333: "juntos forman un circuito tanque: una antirresonancia paralelo"
  334: 'f_("ar") = (1)/(2 π sqrt("2 nH" times "0,99 nF")) approx "113 MHz"'
  335: "Con ESR de 10 a 20 mΩ en los cerámicos"
  336: "Con cuatro, la red presenta 0,15 Ω a 100 MHz, casi cuatro veces menos que con el 1 nF"
  343: "Cuánto separar dos pistas"
  345: "Una pista de reloj corre paralela a una pista analógica sensible durante 5 cm"
  348: "como 1/(1 + (s/h)²), con s la separación entre centros y h la altura al plano"
  350: "Para quedar en el 10 % basta s = 3h"
  351: "Con un dieléctrico fino de 0,1 mm, 0,3 mm de separación bastan; con uno de 0,5 mm harían falta 1,5 mm"
  353: "Enrutar en capas distintas con un plano entre medias, que es la solución definitiva"

modelo:
  valores:
    Z_a: { sim: "Z₀", nombre: "impedancia de la pista", unidad: Ω, valor: 50 }
    Ro_a: { sim: "R_{salida}", nombre: "salida del driver", unidad: Ω, valor: 20 }
    V_a: { sim: "V", nombre: "tensión del bus", unidad: V, valor: 3.3 }
    N_l: { sim: "N", nombre: "líneas del bus", unidad: "", valor: 8 }
    duty: { sim: "δ", nombre: "fracción del tiempo en alto", unidad: "", valor: 0.5 }
    C_1: { sim: "C₁", nombre: "condensador grande", unidad: F, valor: 100e-9 }
    L_1: { sim: "L₁", nombre: "su inductancia parásita", unidad: H, valor: 1.2e-9 }
    C_2: { sim: "C₂", nombre: "condensador pequeño", unidad: F, valor: 1e-9 }
    L_2: { sim: "L₂", nombre: "su inductancia parásita", unidad: H, valor: 0.8e-9 }
    R_e: { sim: "ESR", nombre: "resistencia serie de un cerámico", unidad: Ω, valor: 0.015 }
    h_c: { sim: "h", nombre: "altura al plano", unidad: mm, valor: 0.5 }
    s_c: { sim: "s", nombre: "separación entre centros", unidad: mm, valor: 0.5 }
  calculos:
    R_sa: { expr: "Z_a - Ro_a", sim: "R_{s}", nombre: "terminación serie", unidad: Ω }
    P_l: { expr: "V_a^2/Z_a", sim: "P", nombre: "por línea en alto", unidad: W }
    P_par: { expr: "N_l*P_l*duty", sim: "P", nombre: "consumo con terminación a masa", unidad: W }
    P_th: { expr: "N_l*V_a^2/(2*Z_a)", sim: "P", nombre: "consumo con Thévenin", unidad: W }
    V_alto: { expr: "V_a*Z_a/(Z_a + Ro_a)", sim: "V_{alto}", nombre: "nivel alto real", unidad: V }
    f_ar: { expr: "1/(2*pi*sqrt((L_1 + L_2)*C_1*C_2/(C_1 + C_2)))", sim: "f_{ar}", nombre: "antirresonancia", unidad: Hz }
    f_r1: { expr: "1/(2*pi*sqrt(L_1*C_1))", sim: "f_{1}", nombre: "resonancia del 100 nF", unidad: Hz }
    f_r2: { expr: "1/(2*pi*sqrt(L_2*C_2))", sim: "f_{2}", nombre: "resonancia del 1 nF", unidad: Hz }
    acop: { expr: "100/(1 + (s_c/h_c)^2)", sim: "acoplamiento", nombre: "acoplamiento relativo", unidad: "%" }

tarjetas:
  - id: explore-consumo
    tipo: explorar
    titulo: "Problema 42.A: el consumo de terminar"
    texto: "Un bus a 3,3 V con pistas de 50 Ω. Cambie el número de líneas y compare la terminación a masa con la Thévenin."
    libro: [306, 308, 315, 317, 318]
    widget:
      tipo: grafica
      x: { id: nn, min: 1, max: 32, unidad: "", rotulo: "líneas" }
      y: { min: 0, max: 4, unidad: W, rotulo: "P" }
      curvas:
        - { expr: "nn*P_l*duty", color: naranja, rotulo: "A masa, 50 % en alto" }
        - { expr: "nn*V_a^2/(2*Z_a)", color: azul, rotulo: "Thévenin", discontinua: true }
      marcas:
        - { x: "N_l", y: "P_par", rotulo: "{{P_par}}" }
      lectura: { valor: P_par, rotulo: "Terminación a masa" }
      datos:
        - { valor: P_th, rotulo: "Thévenin: {{P_th}}" }
      mandos:
        - { valor: N_l, lista: [8, 16, 32], rotulo: "Líneas, N" }
    requiere: { mover: [N_l] }

  - id: formula-serie
    tipo: formula
    titulo: "La terminación serie"
    texto: "Junto al driver, la resistencia completa lo que le falta a su salida para llegar a Z₀. No consume en continua."
    libro: [312]
    ec: 312
    sustitucion: "{{Z_a}} − {{Ro_a}} = {{R_sa}}"
    widget:
      tipo: grafica
      x: { id: rr, min: 0, max: 50, unidad: Ω, rotulo: "R_{salida}" }
      y: { min: 0, max: 50, unidad: Ω, rotulo: "R_{s}" }
      curvas:
        - { expr: "Z_a - rr", color: naranja, rotulo: "R_{s} = Z₀ − R_{salida}" }
      marcas:
        - { x: "Ro_a", y: "R_sa", rotulo: "{{R_sa}}" }
      lectura: { valor: R_sa, rotulo: "Terminación serie" }
      mandos:
        - { valor: Ro_a, min: 5, max: 45, paso: 5, rotulo: "Salida del driver, R_{salida}" }
    comprobar:
      - { con: { Ro_a: 20 }, R_sa: 30 }

  - id: estime-consumo
    tipo: pregunta
    titulo: "Con 32 líneas"
    texto: "Terminación paralelo de 50 Ω a masa, 218 mW por línea en alto, 32 líneas en alto el 50 % del tiempo. ¿Consumo total?"
    libro: [315, 317]
    fijar: { N_l: 32, duty: 0.5, V_a: 3.3, Z_a: 50 }
    widget:
      tipo: grafica
      x: { id: nn, min: 1, max: 32, unidad: "", rotulo: "líneas" }
      y: { min: 0, max: 4, unidad: W, rotulo: "P" }
      curvas:
        - { expr: "nn*P_l*duty", color: naranja, rotulo: "A masa, 50 % en alto" }
    estimar:
      objetivo: "P_par"
      unidad: W
      min: 0
      max: 8
      paso: 0.02
      inicio: 6
      tol: 0.05
      rotulo: "Consumo total"
    exito: "3,48 W: lo que ahorra la terminación serie, que no consume en continua."
    pistas:
      - { cuando: { valor: estimacion, mayor: 3.6 }, texto: "Demasiado: cada línea está en alto solo la mitad del tiempo." }
      - { texto: "Demasiado poco: 32 líneas por 218 mW, la mitad del tiempo." }
    escalera:
      - "32 × 218 mW × 0,5."
    solucion: "32 × 0,218 W × 0,5 = 3,48 W."
    comprobar:
      - { P_par: 3.48, P_l: 0.218, tol: 0.01 }

  - id: predecir-nivel
    tipo: predecir
    titulo: "El nivel alto real"
    texto: "Con el driver de 20 Ω cargado con 50 Ω a masa, ¿a cuánto cae el nivel alto de 3,3 V?"
    libro: [316]
    fijar: { V_a: 3.3, Z_a: 50, Ro_a: 20 }
    widget:
      tipo: grafica
      x: { id: rr, min: 0, max: 50, unidad: Ω, rotulo: "R_{salida}" }
      y: { min: 0, max: 3.5, unidad: V, rotulo: "V_{alto}" }
      curvas:
        - { expr: "V_a*Z_a/(Z_a + rr)", color: naranja, rotulo: "V·Z₀/(Z₀ + R_{salida})" }
      lectura: { valor: V_alto, rotulo: "Nivel alto real" }
      ocultar: true
      mandos: []
    opciones:
      - texto: "A unos 2,4 V"
        bien: true
        porque: "Un divisor de 20 y 50 Ω: otro inconveniente de cargar la línea con 50 Ω a masa."
      - texto: "Se queda en 3,3 V"
        porque: "Eso supone un driver ideal; con 20 Ω de salida cae."
      - texto: "A la mitad, 1,65 V"
        porque: "La mitad sería con 50 Ω de salida."
    escalera:
      - "La salida y la terminación forman un divisor."
    solucion: "3,3 · 50/70 ≈ 2,4 V."
    comprobar:
      - { V_alto: 2.36, tol: 0.01 }

  - id: pregunta-decision
    tipo: pregunta
    titulo: "Cuándo no sirve la serie"
    texto: "La serie ahorra unos 3,5 W en este bus. ¿Cuándo hay que ir a la paralelo?"
    libro: [319, 320, 322]
    widget:
      tipo: grafica
      x: { id: rr, min: 0, max: 50, unidad: Ω, rotulo: "R_{salida}" }
      y: { min: 0, max: 50, unidad: Ω, rotulo: "R_{s}" }
      curvas:
        - { expr: "Z_a - rr", color: naranja, rotulo: "R_{s} = Z₀ − R_{salida}" }
    opciones:
      - texto: "Con varios receptores repartidos a lo largo de la línea"
        bien: true
        porque: "Los intermedios ven media tensión durante el tiempo de ida y vuelta y pueden conmutar en falso."
      - texto: "Cuando el driver tiene 20 Ω"
        porque: "Con 20 Ω la serie es de 30 Ω; vale."
      - texto: "Nunca: la serie siempre vale"
        porque: "Solo vale con un receptor al final."
    escalera:
      - "¿Dónde llega la amplitud completa con la serie?"
    solucion: "Con receptores repartidos a lo largo de la línea."

  - id: explore-anti
    tipo: explorar
    titulo: "Problema 42.B: el 1 nF que sobra"
    texto: "Un 100 nF y un 1 nF en la misma alimentación. Mire el pico entre sus resonancias y cambie la ESR."
    libro: [324, 330, 333, 335]
    widget:
      tipo: grafica
      x: { id: nu, min: 1000000, max: 1000000000, unidad: Hz, rotulo: "f", escala: log }
      y: { min: 0.001, max: 100, unidad: Ω, rotulo: "|Z|", escala: log }
      curvas:
        - { expr: "sqrt(((R_e^2 - (2*pi*nu*L_1 - 1/(2*pi*nu*C_1))*(2*pi*nu*L_2 - 1/(2*pi*nu*C_2)))^2 + (R_e*(2*pi*nu*L_1 - 1/(2*pi*nu*C_1)) + R_e*(2*pi*nu*L_2 - 1/(2*pi*nu*C_2)))^2)/((2*R_e)^2 + (2*pi*nu*L_1 - 1/(2*pi*nu*C_1) + 2*pi*nu*L_2 - 1/(2*pi*nu*C_2))^2))", color: naranja, rotulo: "100 nF ∥ 1 nF" }
        - { expr: "sqrt(R_e^2 + (2*pi*nu*L_1 - 1/(2*pi*nu*C_1))^2)", color: azul, rotulo: "100 nF solo", discontinua: true }
      marcas:
        - { x: "f_ar", y: "1", rotulo: "{{f_ar}}" }
      lectura: { valor: f_ar, rotulo: "Antirresonancia" }
      datos:
        - { valor: f_r1, rotulo: "Resonancia del 100 nF: {{f_r1}}" }
        - { valor: f_r2, rotulo: "Resonancia del 1 nF: {{f_r2}}" }
      mandos:
        - { valor: R_e, lista: [0.01, 0.015, 0.02], rotulo: "ESR de los cerámicos" }

  - id: simule-anti
    tipo: simular
    titulo: "Prediga la antirresonancia"
    texto: "Por encima de 14,5 MHz el 100 nF es una bobina: con el 1 nF forma un tanque de 2 nH y 0,99 nF. ¿A qué frecuencia?"
    libro: [330, 333, 334]
    fijar: { C_1: 100e-9, L_1: 1.2e-9, C_2: 1e-9, L_2: 0.8e-9 }
    widget:
      tipo: grafica
      x: { id: nu, min: 1000000, max: 1000000000, unidad: Hz, rotulo: "f", escala: log }
      y: { min: 0.001, max: 100, unidad: Ω, rotulo: "|Z|", escala: log }
      curvas:
        - { expr: "sqrt(((R_e^2 - (2*pi*nu*L_1 - 1/(2*pi*nu*C_1))*(2*pi*nu*L_2 - 1/(2*pi*nu*C_2)))^2 + (R_e*(2*pi*nu*L_1 - 1/(2*pi*nu*C_1)) + R_e*(2*pi*nu*L_2 - 1/(2*pi*nu*C_2)))^2)/((2*R_e)^2 + (2*pi*nu*L_1 - 1/(2*pi*nu*C_1) + 2*pi*nu*L_2 - 1/(2*pi*nu*C_2))^2))", color: naranja, rotulo: "100 nF ∥ 1 nF" }
      lectura: { valor: f_ar, rotulo: "Antirresonancia" }
      ocultar: true
    simular:
      objetivo: f_ar
      unidad: Hz
      tol: 0.05
      rotulo: "Antirresonancia, f_{ar}"
      errores:
        - { expr: "f_r1", texto: "Esa es la resonancia serie del 100 nF; el pico está más arriba, donde ya es una bobina." }
        - { expr: "f_r2", texto: "Esa es la resonancia serie del 1 nF; el tanque suma las dos inductancias, 2 nH." }
    exito: "Unos 113 MHz: con la misma conexión, el 1 nF empeora la impedancia a 100 MHz."
    escalera:
      - "Inductancia del bucle: 1,2 + 0,8 nH; capacidad, prácticamente el 1 nF."
    solucion: "1/(2π√(2 nH × 0,99 nF)) ≈ 113 MHz."
    comprobar:
      - { f_ar: 113e6, f_r1: 14.5e6, f_r2: 178e6, tol: 0.01 }

  - id: pregunta-iguales
    tipo: pregunta
    titulo: "Lo que sí baja la impedancia"
    texto: "¿Qué baja de verdad la impedancia por encima de 15 MHz?"
    libro: [336]
    widget:
      tipo: figura
      figura: fig-41.10
      zonas:
        - { id: defensas, rotulo: "Recuadro verde", rect: [315, 160, 125, 75] }
    opciones:
      - texto: "Varios 100 nF iguales, cada uno con sus propias vías"
        bien: true
        porque: "Resuenan a la vez, no forman tanque y dividen la inductancia: con cuatro, 0,15 Ω a 100 MHz."
      - texto: "Un condensador aún más pequeño"
        porque: "Otro valor distinto crea otra antirresonancia."
      - texto: "Un electrolítico mayor"
        porque: "El electrolítico cubre la banda baja; a 100 MHz es una bobina."
    escalera:
      - "N iguales en paralelo dividen la inductancia por N."
    solucion: "Varios 100 nF iguales con vías propias."

  - id: ajuste-separacion
    tipo: ajuste
    titulo: "Problema 42.C: cuánto separar"
    texto: "Un reloj corre paralelo a una pista analógica 5 cm, a 0,5 mm del plano. Separe las pistas hasta un acoplamiento del 10 %."
    libro: [343, 345, 348, 350, 351]
    fijar: { h_c: 0.5 }
    inicio: { s_c: 0.5 }
    widget:
      tipo: grafica
      x: { id: ss, min: 0, max: 3, unidad: mm, rotulo: "s" }
      y: { min: 0, max: 100, unidad: "%", rotulo: "acoplamiento" }
      curvas:
        - { expr: "100/(1 + (ss/h_c)^2)", color: naranja, rotulo: "1/(1 + (s/h)²)" }
      marcas:
        - { x: "s_c", y: "acop", rotulo: "{{acop}}" }
      lectura: { valor: acop, rotulo: "Acoplamiento relativo" }
      mandos:
        - { valor: s_c, min: 0.1, max: 3, paso: 0.05, rotulo: "Separación entre centros, s" }
    ajuste:
      valor: acop
      max: 10
      rotulo: "Acoplamiento"
      escala: { min: 0, max: 60 }
      alto: "Todavía acoplan demasiado: separe más."
      dentro: "En el 10 % o menos: s = 3h."
    exito: "Con 0,5 mm de dieléctrico hacen falta 1,5 mm; con 0,1 mm bastarían 0,3 mm."
    comprobar:
      - { con: { s_c: 1.5 }, acop: 10 }

  - id: pregunta-alternativa
    tipo: pregunta
    titulo: "Sin sitio para separar"
    texto: "No hay sitio para separar más. ¿Cuál es la solución definitiva?"
    libro: [351, 353]
    widget:
      tipo: grafica
      x: { id: ss, min: 0, max: 3, unidad: mm, rotulo: "s" }
      y: { min: 0, max: 100, unidad: "%", rotulo: "acoplamiento" }
      curvas:
        - { expr: "100/(1 + (ss/h_c)^2)", color: naranja, rotulo: "1/(1 + (s/h)²)" }
    opciones:
      - texto: "Encaminarlas en capas distintas con un plano entre medias"
        bien: true
        porque: "Acercar el plano o cruzarlas en ángulo recto también ayudan; el plano entre ellas lo resuelve."
      - texto: "Una pista de masa entre ellas, sin vías"
        porque: "Sin vías a masa cada pocos milímetros no sirve, e incluso empeora como antena."
      - texto: "Alargar el tramo paralelo"
        porque: "Al revés: acortarlo es tan eficaz como separar."
    escalera:
      - "Lo que separa del todo dos pistas es un plano."
    solucion: "Capas distintas con un plano entre medias."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [312, 317, 334, 350]
    ideas:
      - { titulo: "42.A.", texto: "Serie de 30 Ω: ahorra 3,48 W en 32 líneas; solo con un receptor al final." }
      - { titulo: "42.B.", texto: "El 1 nF forma un tanque a unos 113 MHz: mejor varios 100 nF iguales." }
      - { titulo: "42.C.", texto: "El 10 % pide s = 3h: acercar el plano es más eficaz que separar." }
