# Lección 1.2 de la sección 42.4 «Diafonía (Crosstalk)» (cap41, sec-41.4). Formato: contenido/lecciones11/GUIA.md.
# - La figura 42.6 (fig-41.6) con zonas: el pulso NEXT, el pulso FEXT y la caída con la separación.
# - La saturación de la NEXT (bloque 116): crece con el tramo acoplado hasta la mitad de lo que avanza la señal durante
#   el flanco, unos 7,5 cm con flancos de 1 ns (a 15 cm/ns, cap41#6). Gráfica: NEXT relativa = min(L/L_sat, 1).
# Paso práctico: «simular» esa longitud de saturación (7,5 cm; errores: sin dividir por dos, la longitud crítica).
# 1.2.1 (autor121-pc, «aprender haciendo», GUIA §13): el acoplamiento relativo 1/(1 + (s/h)²) del problema 42.C
# (cap41#348-351) se vuelve la gráfica viva: se lleva al 10 % con 0,3 mm de separación acercando el plano (meta), se
# marca la separación del 10 % (3 alturas), y se escriben el acoplamiento con la regla 3W (unas 5 alturas: 3,8 %) y la
# separación con 0,5 mm de dieléctrico (1,5 mm). NEXT y FEXT se tocan en la figura 42.6. Quedan una pregunta de
# opciones (el banco), el emparejamiento de los dos mecanismos y el orden de las medidas.
leccion: cap41/sec-41.4

libro:
  104: "capacitivo (la tensión de una inyecta corriente en la otra) e inductivo (la corriente de una induce tensión en la otra)"
  107: "En la línea víctima aparecen dos perturbaciones que viajan en sentidos opuestos"
  108: "de duración igual al doble del tiempo de vuelo por la zona acoplada"
  109: "En un medio homogéneo (una stripline, con dieléctrico por ambos lados) se cancelan casi exactamente"
  110: "un problema de diafonía puede aparecer solo en unas capas"
  112: "El acoplamiento cae muy deprisa con la distancia"
  113: "la separación al plano importa tanto como la separación entre pistas"
  116: "unos 7,5 cm con flancos de 1 ns"
  118: "Los relojes se encaminan aislados, con guarda si hace falta"
  119: "si conmutan a la vez, la perturbación se suma"
  120: "una masa cada dos o tres señales"
  121: "capas adyacentes de señal se encaminen en direcciones perpendiculares"
  123: "uno estrecho, de la duración del flanco y que llega con él al extremo lejano, FEXT"
  124: "si el problema desaparece al ralentizar el flanco del agresor con una resistencia serie, la causa está en sus flancos"
  125: "Diafonía cercana y lejana con su forma característica"
  "cap41#5": '"longitud crítica" approx (t_("subida") times "velocidad")/("6")'
  "cap41#6": "Con 15 cm por nanosegundo en FR4"
  "cap41#348": "como 1/(1 + (s/h)²), con s la separación entre centros y h la altura al plano"
  "cap41#349": "Acoplamiento relativo"
  "cap41#350": "Para quedar en el 10 % basta s = 3h"
  "cap41#351": "Con un dieléctrico fino de 0,1 mm, 0,3 mm de separación bastan; con uno de 0,5 mm harían falta 1,5 mm"

modelo:
  valores:
    t_x: { sim: "t_{subida}", nombre: "flanco del agresor", unidad: ns, valor: 1 }
    v_x: { sim: "v", nombre: "velocidad en FR4", unidad: "cm/ns", valor: 15 }
    L_x: { sim: "L", nombre: "tramo acoplado", unidad: cm, valor: 3 }
    s_x: { sim: "s", nombre: "separación entre centros", unidad: mm, valor: 0.3 }
    h_x: { sim: "h", nombre: "altura al plano", unidad: mm, valor: 0.5 }
    r_10: { sim: "s/h", nombre: "separación del 10 %, en alturas", unidad: "", valor: 3 }
    r_3w: { sim: "s/h", nombre: "la regla 3W, en alturas", unidad: "", valor: 5 }
    h_g: { sim: "h", nombre: "dieléctrico grueso", unidad: mm, valor: 0.5 }
  calculos:
    L_sat: { expr: "t_x*v_x/2", sim: "L_{sat}", nombre: "longitud de saturación de la NEXT", unidad: cm }
    L_sat1: { expr: "t_x*v_x", sim: "L", nombre: "sin dividir por dos", unidad: cm }
    L_crx: { expr: "t_x*v_x/6", sim: "L", nombre: "longitud crítica", unidad: cm }
    k_x: { expr: "100/(1 + (s_x/h_x)^2)", sim: "k", nombre: "acoplamiento relativo", unidad: "%", cifras: 3 }
    k_3w: { expr: "100/(1 + r_3w^2)", sim: "k", nombre: "acoplamiento con 5 alturas", unidad: "%", cifras: 2 }
    k_10: { expr: "100/(1 + r_10^2)", sim: "k", nombre: "acoplamiento con 3 alturas", unidad: "%" }
    s_g: { expr: "r_10*h_g", sim: "s", nombre: "separación del 10 % con dieléctrico grueso", unidad: mm }
    nx: { expr: "min(L_x/L_sat, 1)*100", sim: "NEXT", nombre: "NEXT frente a su máximo", unidad: "%" }

tarjetas:
  - id: explore-diafonia
    tipo: explorar
    fase: "Consiga"
    titulo: "Separar o acercar el plano"
    texto: "Dos pistas a 0,3 mm entre centros y no hay sitio para separarlas más. Baje el acoplamiento al 10 % de su máximo sin pasar de esa separación."
    libro: [112, 113, "cap41#348", "cap41#351"]
    inicio: { s_x: 0.3, h_x: 0.5 }
    widget:
      tipo: grafica
      x: { id: rr, min: 0, max: 6, unidad: "", rotulo: "s / h" }
      y: { min: 0, max: 100, unidad: "%", rotulo: "acoplamiento" }
      curvas:
        - { expr: "100/(1 + rr^2)", color: naranja, rotulo: "1/(1 + (s/h)²)" }
      marcas:
        - { x: "s_x/h_x", y: "k_x", rotulo: "{{k_x}}" }
      lectura: { valor: k_x, rotulo: "Acoplamiento relativo" }
      mandos:
        - { valor: s_x, lista: [0.1, 0.2, 0.3, 0.5, 1.0, 1.5], rotulo: "Separación, s" }
        - { valor: h_x, lista: [0.1, 0.2, 0.5], rotulo: "Altura al plano, h" }
    objetivo:
      condiciones:
        - { valor: k_x, max: 10.1, rotulo: "Acoplamiento: {{k_x}}" }
        - { valor: s_x, max: 0.3, rotulo: "Separación: {{s_x}}" }
      logrado: "Con el plano a {{h_x}}, {{s_x}} bastan: cuenta la separación relativa a la altura. Acercar el plano es más eficaz y ocupa menos."
      pistas:
        - { cuando: { valor: s_x, mayor: 0.3 }, texto: "No hay sitio para separarlas tanto: vuelva a 0,3 mm como mucho." }
        - { texto: "Todavía acoplan mucho: acerque el plano." }
    escalera:
      - "El acoplamiento depende de s/h, no de s sola."
    solucion: "Plano a 0,1 mm con 0,3 mm de separación: el 10 %."
    comprobar:
      - { con: { s_x: 0.3, h_x: 0.1 }, k_x: 10, tol: 0.001 }

  - id: empareje-mecanismos
    tipo: pregunta
    titulo: "Dos mecanismos a la vez"
    texto: "Empareje cada acoplamiento con su causa."
    libro: [104]
    emparejar:
      - ["Capacitivo", "La tensión de una inyecta corriente en la otra"]
      - ["Inductivo", "La corriente de una induce tensión en la otra"]
    exito: "Actúan a la vez, con signos distintos según el sentido."
    pistas:
      - { texto: "Un condensador responde a la tensión; una inductancia mutua, a la corriente." }
    escalera:
      - "Capacidad entre pistas e inductancia mutua entre bucles."
    solucion: "Capacitivo, tensión → corriente; inductivo, corriente → tensión."

  - id: toque-next
    tipo: tocar
    titulo: "La firma de cada una"
    texto: "En la víctima viajan dos perturbaciones en sentidos opuestos. Toque la que dura el doble del tiempo de vuelo por el tramo acoplado."
    libro: [107, 108, 123, 125]
    widget:
      tipo: figura
      figura: fig-41.6
      zonas:
        - { id: next, rotulo: "Pulso ancho hacia arriba", rect: [55, 100, 85, 42] }
        - { id: fext, rotulo: "Pulso estrecho hacia abajo", rect: [82, 145, 36, 48] }
    tocar:
      bien: [next]
      porque:
        fext: "Es la FEXT: estrecha, de la duración del flanco, llega con él al extremo lejano."
    exito: "La NEXT, hacia el extremo cercano: las contribuciones capacitiva e inductiva se suman en un pulso ancho."
    escalera:
      - "Busque el pulso ancho, no el estrecho."
    solucion: "El pulso ancho hacia arriba, la NEXT."

  - id: porque-stripline
    tipo: tocar
    titulo: "Solo en unas capas"
    texto: "En una stripline, con dieléctrico por ambos lados, una de las dos perturbaciones casi desaparece. Tóquela."
    libro: [109, 110]
    widget:
      tipo: figura
      figura: fig-41.6
      zonas:
        - { id: next, rotulo: "Pulso ancho hacia arriba", rect: [55, 100, 85, 42] }
        - { id: fext, rotulo: "Pulso estrecho hacia abajo", rect: [82, 145, 36, 48] }
    tocar:
      bien: [fext]
      porque:
        next: "En la NEXT las dos contribuciones se suman: no se cancelan en ningún medio."
    exito: "La FEXT: hacia el extremo lejano las contribuciones tienen signos opuestos y, en un medio homogéneo, se cancelan casi exactamente. Por eso las capas internas para las señales críticas."
    escalera:
      - "¿En cuál de las dos se restan las contribuciones?"
    solucion: "El pulso estrecho, la FEXT."

  - id: predecir-plano
    tipo: marcar
    titulo: "Cuánto separar"
    texto: "Una pista de reloj corre junto a una analógica. Marque en la curva la separación, en alturas al plano, que deja el acoplamiento en el 10 %."
    libro: [113, "cap41#348", "cap41#349", "cap41#350"]
    widget:
      tipo: grafica
      x: { id: rr, min: 0, max: 6, unidad: "", rotulo: "s / h" }
      y: { min: 0, max: 100, unidad: "%", rotulo: "acoplamiento" }
      curvas:
        - { expr: "100/(1 + rr^2)", color: naranja, rotulo: "1/(1 + (s/h)²)" }
      mandos: []
    marcar:
      modo: x
      curva: 0
      x: "r_10"
      tol: 0.02
      inicio: { x: 1, y: 50 }
      rotulo: "La separación del 10 %"
      pasos: 120
    pistas:
      - { cuando: { valor: marca_x, menor: 3 }, texto: "Ahí aún acoplan más del 10 %: sepárelas más." }
      - { texto: "Ahí ya sobra separación: algo menos." }
    exito: "Tres alturas: s = 3h deja el 10 %."
    escalera:
      - "Lea en la curva dónde cruza el 10 %."
    solucion: "s/h = 3."
    comprobar:
      - { k_10: 10 }

  - id: lea-3w
    tipo: leer
    titulo: "La regla 3W"
    texto: "Una pista de 50 Ω en FR4 mide unas 1,75 alturas: tres anchuras entre centros son unas 5 alturas. Lea la curva y escriba el acoplamiento."
    libro: [113, "cap41#349", "cap41#350"]
    widget:
      tipo: grafica
      x: { id: rr, min: 0, max: 6, unidad: "", rotulo: "s / h" }
      y: { min: 0, max: 100, unidad: "%", rotulo: "acoplamiento" }
      curvas:
        - { expr: "100/(1 + rr^2)", color: naranja, rotulo: "1/(1 + (s/h)²)" }
      mandos: []
    leer:
      objetivo: k_3w
      unidad: "%"
      tol: 0.05
      rotulo: "Acoplamiento con la regla 3W"
      errores:
        - { expr: "k_10", texto: "Eso es con 3 alturas; 3W son unas 5." }
    exito: "En torno al 4 %: la regla 3W es algo más exigente que s = 3h, y deja margen."
    escalera:
      - "Lea la curva en s/h = 5."
    solucion: "1/(1 + 5²) = 3,8 %."
    comprobar:
      - { k_3w: 3.8, tol: 0.02 }

  - id: lea-grueso
    tipo: leer
    titulo: "Con el dieléctrico grueso"
    texto: "Si el plano queda a 0,5 mm, escriba la separación entre centros que hace falta para quedar en el 10 %."
    libro: ["cap41#350", "cap41#351"]
    fijar: { h_g: 0.5, r_10: 3 }
    widget:
      tipo: grafica
      x: { id: rr, min: 0, max: 6, unidad: "", rotulo: "s / h" }
      y: { min: 0, max: 100, unidad: "%", rotulo: "acoplamiento" }
      curvas:
        - { expr: "100/(1 + rr^2)", color: naranja, rotulo: "1/(1 + (s/h)²)" }
      mandos: []
    leer:
      objetivo: s_g
      unidad: mm
      tol: 0.03
      rotulo: "Separación necesaria"
      errores:
        - { expr: "h_g", texto: "Esa es la altura al plano; la separación son tres alturas." }
    exito: "1,5 mm, cinco veces más que con el plano a 0,1 mm: no depende de la separación absoluta, sino de la altura."
    escalera:
      - "s = 3h."
    solucion: "3 × 0,5 mm = 1,5 mm."
    comprobar:
      - { s_g: 1.5 }

  - id: simule-saturacion
    tipo: simular
    titulo: "Prediga dónde se satura"
    texto: "La NEXT crece con el tramo acoplado hasta la mitad de lo que avanza la señal durante el flanco. Con flancos de 1 ns a 15 cm/ns, ¿qué longitud?"
    libro: [116, "cap41#5", "cap41#6"]
    fijar: { t_x: 1, v_x: 15 }
    widget:
      tipo: grafica
      x: { id: ll, min: 0, max: 20, unidad: cm, rotulo: "tramo acoplado" }
      y: { min: 0, max: 110, unidad: "%", rotulo: "NEXT" }
      curvas:
        - { expr: "min(ll/L_sat, 1)*100", color: naranja, rotulo: "NEXT frente a su máximo" }
      lectura: { valor: L_sat, rotulo: "Longitud de saturación" }
      ocultar: true
    simular:
      objetivo: L_sat
      unidad: cm
      tol: 0.05
      rotulo: "Longitud de saturación"
      errores:
        - { expr: "L_sat1", texto: "Eso es todo lo que avanza durante el flanco; la NEXT se satura en la mitad." }
        - { expr: "L_crx", texto: "Esa es la longitud crítica, que divide por 6; aquí es la mitad." }
    exito: "Unos 7,5 cm: más allá, alargar el tramo ya no aumenta la NEXT; la FEXT sigue creciendo."
    escalera:
      - "Lo que avanza en 1 ns, entre dos."
    solucion: "1 ns × 15 cm/ns / 2 = 7,5 cm."
    comprobar:
      - { L_sat: 7.5, L_sat1: 15, L_crx: 2.5 }

  - id: ordene-medidas
    tipo: pregunta
    titulo: "Las medidas que funcionan"
    texto: "Ordene las medidas contra la diafonía, de la más eficaz a la menos."
    libro: [116, 118, 119, 120, 121]
    ordenar:
      - "Acercar el plano de retorno."
      - "Separar las pistas críticas, 3W como mínimo."
      - "Acortar el tramo paralelo."
      - "Cruzar en ángulo recto."
      - "Pistas de guarda con vías a masa."
      - "Ralentizar el flanco del agresor."
    exito: "La guarda sin vías empeora: es una antena. Y los casos típicos: relojes aislados, masas intercaladas en los conectores y capas adyacentes en direcciones perpendiculares."
    pistas:
      - { texto: "La primera no gasta espacio horizontal." }
    escalera:
      - "Primero el plano, luego separar y acortar."
    solucion: "Plano, separar, acortar, cruzar, guarda con vías, flanco más lento."

  - id: pregunta-banco
    tipo: predecir
    titulo: "En el banco"
    texto: "Al ralentizar el flanco del agresor con una resistencia serie, el fallo de la víctima desaparece. ¿Qué indica?"
    libro: [124]
    widget:
      tipo: figura
      figura: fig-41.6
      zonas:
        - { id: next, rotulo: "Pulso ancho hacia arriba", rect: [55, 100, 85, 42] }
    opciones:
      - texto: "Que la causa está en los flancos del agresor"
        bien: true
        porque: "Diafonía, o rebote de masa si el agresor es parte de un bus."
      - texto: "Que la víctima está mal terminada"
        porque: "Eso no cambiaría al tocar el agresor."
      - texto: "Que es ruido de la fuente"
        porque: "La fuente no depende del flanco de una pista concreta."
    escalera:
      - "Solo se ha cambiado el flanco del agresor."
    solucion: "La causa está en sus flancos: diafonía o rebote de masa."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [104, 109, 113, 116]
    ideas:
      - { titulo: "Dos mecanismos.", texto: "Capacitivo e inductivo, a la vez." }
      - { titulo: "NEXT y FEXT.", texto: "Ancha hacia el origen; estrecha hacia el final, casi nula en stripline." }
      - { titulo: "El plano.", texto: "Acercarlo importa tanto como separar las pistas." }
      - { titulo: "La longitud.", texto: "La NEXT se satura hacia 7,5 cm con flancos de 1 ns." }
