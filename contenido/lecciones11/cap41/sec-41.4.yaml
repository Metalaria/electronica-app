# Lección 1.2 de la sección 42.4 «Diafonía (Crosstalk)» (cap41, sec-41.4). Formato: contenido/lecciones11/GUIA.md.
# - La figura 42.6 (fig-41.6) con zonas: el pulso NEXT, el pulso FEXT y la caída con la separación.
# - La saturación de la NEXT (bloque 116): crece con el tramo acoplado hasta la mitad de lo que avanza la señal durante
#   el flanco, unos 7,5 cm con flancos de 1 ns (a 15 cm/ns, cap41#6). Gráfica: NEXT relativa = min(L/L_sat, 1).
# Paso práctico: «simular» esa longitud de saturación (7,5 cm; errores: sin dividir por dos, la longitud crítica).
leccion: cap41/sec-41.4

libro:
  104: "capacitivo (la tensión de una inyecta corriente en la otra) e inductivo (la corriente de una induce tensión en la otra)"
  108: "de duración igual al doble del tiempo de vuelo por la zona acoplada"
  109: "En un medio homogéneo (una stripline, con dieléctrico por ambos lados) se cancelan casi exactamente"
  110: "un problema de diafonía puede aparecer solo en unas capas"
  112: "El acoplamiento cae muy deprisa con la distancia"
  113: "la separación al plano importa tanto como la separación entre pistas"
  116: "unos 7,5 cm con flancos de 1 ns"
  118: "Los relojes se encaminan aislados, con guarda si hace falta"
  119: "si conmutan a la vez, la perturbación se suma"
  120: "una masa cada dos o tres señales"
  121: "capas adyacentes de señal se encaminen en direcciones perpendiculares"
  123: "uno estrecho, de la duración del flanco y que llega con él al extremo lejano, FEXT"
  124: "si el problema desaparece al ralentizar el flanco del agresor con una resistencia serie, la causa está en sus flancos"
  125: "Diafonía cercana y lejana con su forma característica"
  "cap41#5": '"longitud crítica" approx (t_("subida") times "velocidad")/("6")'
  "cap41#6": "Con 15 cm por nanosegundo en FR4"

modelo:
  valores:
    t_x: { sim: "t_{subida}", nombre: "flanco del agresor", unidad: ns, valor: 1 }
    v_x: { sim: "v", nombre: "velocidad en FR4", unidad: "cm/ns", valor: 15 }
    L_x: { sim: "L", nombre: "tramo acoplado", unidad: cm, valor: 3 }
  calculos:
    L_sat: { expr: "t_x*v_x/2", sim: "L_{sat}", nombre: "longitud de saturación de la NEXT", unidad: cm }
    L_sat1: { expr: "t_x*v_x", sim: "L", nombre: "sin dividir por dos", unidad: cm }
    L_crx: { expr: "t_x*v_x/6", sim: "L", nombre: "longitud crítica", unidad: cm }
    nx: { expr: "min(L_x/L_sat, 1)*100", sim: "NEXT", nombre: "NEXT frente a su máximo", unidad: "%" }

tarjetas:
  - id: explore-diafonia
    tipo: explorar
    titulo: "Diafonía cercana y lejana"
    texto: "Dos perturbaciones viajan en sentidos opuestos por la víctima. Toque las dos y la gráfica de la separación."
    libro: [108, 123, 125]
    widget:
      tipo: figura
      figura: fig-41.6
      zonas:
        - { id: next, rotulo: "Pulso ancho hacia arriba", rect: [55, 100, 85, 42], texto: "NEXT, hacia el extremo cercano: un pulso ancho que dura el doble del tiempo de vuelo del tramo acoplado." }
        - { id: fext, rotulo: "Pulso estrecho hacia abajo", rect: [82, 145, 36, 48], texto: "FEXT, hacia el extremo lejano: estrecho, de la duración del flanco; en stripline casi nula." }
        - { id: separacion, rotulo: "Gráfica de la derecha", rect: [255, 10, 185, 200], texto: "El acoplamiento cae muy deprisa al separar las pistas, y más aún con el plano más cerca." }
    requiere: { mover: [next, fext, separacion] }

  - id: empareje-mecanismos
    tipo: pregunta
    titulo: "Dos mecanismos a la vez"
    texto: "Empareje cada acoplamiento con su causa."
    libro: [104]
    emparejar:
      - ["Capacitivo", "La tensión de una inyecta corriente en la otra"]
      - ["Inductivo", "La corriente de una induce tensión en la otra"]
    exito: "Actúan a la vez, con signos distintos según el sentido."
    pistas:
      - { texto: "Un condensador responde a la tensión; una inductancia mutua, a la corriente." }
    escalera:
      - "Capacidad entre pistas e inductancia mutua entre bucles."
    solucion: "Capacitivo, tensión → corriente; inductivo, corriente → tensión."

  - id: toque-next
    tipo: tocar
    titulo: "La firma de cada una"
    texto: "Toque la perturbación que dura el doble del tiempo de vuelo por el tramo acoplado."
    libro: [108, 123]
    widget:
      tipo: figura
      figura: fig-41.6
      zonas:
        - { id: next, rotulo: "Pulso ancho hacia arriba", rect: [55, 100, 85, 42] }
        - { id: fext, rotulo: "Pulso estrecho hacia abajo", rect: [82, 145, 36, 48] }
    tocar:
      bien: [next]
      porque:
        fext: "Es la FEXT: estrecha, de la duración del flanco, llega con él al extremo lejano."
    exito: "La NEXT: las dos contribuciones se suman en un pulso ancho."
    escalera:
      - "Busque el pulso ancho, no el estrecho."
    solucion: "El pulso ancho hacia arriba, la NEXT."

  - id: porque-stripline
    tipo: porque
    titulo: "Solo en unas capas"
    texto: "¿Por qué la diafonía lejana casi desaparece en stripline y no en microstrip?"
    libro: [109, 110]
    widget:
      tipo: figura
      figura: fig-41.6
      zonas:
        - { id: fext, rotulo: "Pulso estrecho hacia abajo", rect: [82, 145, 36, 48] }
    opciones:
      - texto: "En un medio homogéneo las dos contribuciones se cancelan casi exactamente"
        bien: true
        porque: "En microstrip una cara ve aire y la otra FR4: la cancelación es parcial."
      - texto: "Porque la stripline está más lejos del plano"
        porque: "Está entre dos planos; la clave es que todo el campo está en el mismo dieléctrico."
      - texto: "Porque en stripline no hay acoplamiento inductivo"
        porque: "Lo hay; se cancela con el capacitivo."
    escalera:
      - "Hacia el extremo lejano, las dos contribuciones tienen signos opuestos."
    solucion: "Dieléctrico por ambos lados: se cancelan casi exactamente."

  - id: empareje-factores
    tipo: pregunta
    titulo: "De qué depende"
    texto: "Empareje cada factor con su efecto sobre la diafonía."
    libro: [112]
    emparejar:
      - ["Separación entre pistas", "Cae muy deprisa con la distancia"]
      - ["Altura sobre el plano", "Más cerca, menos acoplamiento"]
      - ["Longitud del tramo paralelo", "Proporcional, hasta saturar"]
      - ["Tiempo de subida", "Flancos más rápidos, más diafonía"]
      - ["Impedancia de la víctima", "Alta, más vulnerable"]
    exito: "Separar, acercar el plano, acortar el tramo y ralentizar: las cuatro palancas."
    pistas:
      - { texto: "El plano cercano da a cada pista su retorno propio." }
    escalera:
      - "La víctima de alta impedancia se deja influir más."
    solucion: "Separación, cae deprisa; plano, cerca mejor; longitud, hasta saturar; flanco, rápido peor; víctima, alta peor."

  - id: predecir-plano
    tipo: predecir
    titulo: "Sin gastar espacio horizontal"
    texto: "No hay sitio para separar más dos pistas. ¿Qué reduce la diafonía sin ocupar más ancho?"
    libro: [113]
    widget:
      tipo: figura
      figura: fig-41.6
      zonas:
        - { id: separacion, rotulo: "Gráfica de la derecha", rect: [255, 10, 185, 200] }
    opciones:
      - texto: "Acercarlas al plano, con un dieléctrico más fino"
        bien: true
        porque: "La separación al plano importa tanto como la separación entre pistas."
      - texto: "Ensancharlas"
        porque: "Ocupa más ancho y no mejora el acoplamiento."
      - texto: "Nada: solo separar funciona"
        porque: "Por eso los apilados modernos tienen dieléctricos delgados."
    escalera:
      - "Compare las dos curvas de la gráfica."
    solucion: "Acercar el plano de retorno."

  - id: simule-saturacion
    tipo: simular
    titulo: "Prediga dónde se satura"
    texto: "La NEXT crece con el tramo acoplado hasta la mitad de lo que avanza la señal durante el flanco. Con flancos de 1 ns a 15 cm/ns, ¿qué longitud?"
    libro: [116, "cap41#5", "cap41#6"]
    fijar: { t_x: 1, v_x: 15 }
    widget:
      tipo: grafica
      x: { id: ll, min: 0, max: 20, unidad: cm, rotulo: "tramo acoplado" }
      y: { min: 0, max: 110, unidad: "%", rotulo: "NEXT" }
      curvas:
        - { expr: "min(ll/L_sat, 1)*100", color: naranja, rotulo: "NEXT frente a su máximo" }
      lectura: { valor: L_sat, rotulo: "Longitud de saturación" }
      ocultar: true
    simular:
      objetivo: L_sat
      unidad: cm
      tol: 0.05
      rotulo: "Longitud de saturación"
      errores:
        - { expr: "L_sat1", texto: "Eso es todo lo que avanza durante el flanco; la NEXT se satura en la mitad." }
        - { expr: "L_crx", texto: "Esa es la longitud crítica, que divide por 6; aquí es la mitad." }
    exito: "Unos 7,5 cm: más allá, alargar el tramo ya no aumenta la NEXT; la FEXT sigue creciendo."
    escalera:
      - "Lo que avanza en 1 ns, entre dos."
    solucion: "1 ns × 15 cm/ns / 2 = 7,5 cm."
    comprobar:
      - { L_sat: 7.5, L_sat1: 15, L_crx: 2.5 }

  - id: ordene-medidas
    tipo: pregunta
    titulo: "Las medidas que funcionan"
    texto: "Ordene las medidas contra la diafonía, de la más eficaz a la menos."
    libro: [116]
    ordenar:
      - "Acercar el plano de retorno."
      - "Separar las pistas críticas, 3W como mínimo."
      - "Acortar el tramo paralelo."
      - "Cruzar en ángulo recto."
      - "Pistas de guarda con vías a masa."
      - "Ralentizar el flanco del agresor."
    exito: "La guarda sin vías empeora: se convierte en una antena resonante."
    pistas:
      - { texto: "La primera no gasta espacio horizontal." }
    escalera:
      - "Primero el plano, luego separar y acortar."
    solucion: "Plano, separar, acortar, cruzar, guarda con vías, flanco más lento."

  - id: pregunta-capas
    tipo: pregunta
    titulo: "Entre capas"
    texto: "Dos capas de señal adyacentes llevan pistas superpuestas. ¿Cómo se encaminan?"
    libro: [118, 119, 120, 121]
    widget:
      tipo: figura
      figura: fig-41.6
      zonas:
        - { id: separacion, rotulo: "Gráfica de la derecha", rect: [255, 10, 185, 200] }
    opciones:
      - texto: "En direcciones perpendiculares"
        bien: true
        porque: "Superpuestas se acoplan enormemente; en un cruce perpendicular el acoplamiento es mínimo."
      - texto: "En paralelo, para igualar longitudes"
        porque: "Superpuestas en paralelo se acoplan enormemente."
      - texto: "Da igual: hay dieléctrico entre ellas"
        porque: "El dieléctrico no las separa del acoplamiento: están muy cerca."
    escalera:
      - "¿En qué ángulo se acoplan menos dos pistas?"
    solucion: "Perpendiculares."

  - id: pregunta-banco
    tipo: predecir
    titulo: "En el banco"
    texto: "Al ralentizar el flanco del agresor con una resistencia serie, el fallo de la víctima desaparece. ¿Qué indica?"
    libro: [124]
    widget:
      tipo: figura
      figura: fig-41.6
      zonas:
        - { id: next, rotulo: "Pulso ancho hacia arriba", rect: [55, 100, 85, 42] }
    opciones:
      - texto: "Que la causa está en los flancos del agresor"
        bien: true
        porque: "Diafonía, o rebote de masa si el agresor es parte de un bus."
      - texto: "Que la víctima está mal terminada"
        porque: "Eso no cambiaría al tocar el agresor."
      - texto: "Que es ruido de la fuente"
        porque: "La fuente no depende del flanco de una pista concreta."
    escalera:
      - "Solo se ha cambiado el flanco del agresor."
    solucion: "La causa está en sus flancos: diafonía o rebote de masa."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [104, 109, 113, 116]
    ideas:
      - { titulo: "Dos mecanismos.", texto: "Capacitivo e inductivo, a la vez." }
      - { titulo: "NEXT y FEXT.", texto: "Ancha hacia el origen; estrecha hacia el final, casi nula en stripline." }
      - { titulo: "El plano.", texto: "Acercarlo importa tanto como separar las pistas." }
      - { titulo: "La longitud.", texto: "La NEXT se satura hacia 7,5 cm con flancos de 1 ns." }
