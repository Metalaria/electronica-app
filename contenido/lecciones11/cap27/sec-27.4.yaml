# Lección 1.2 de la sección 26.4 «Operaciones con Señales» (cap27; etiqueta interna sec-27.4).
# Formato: contenido/lecciones11/GUIA.md. Operacional de la app (A₀ = 10⁵) con ±12 V de salida máxima (ejemplo).
# Sumador en «ao-sumador» con tres entradas de 10 kΩ y R_f = 10 kΩ (ejemplo). Integrador en «ao-integrador»: el
# escalón de 1 V con 100 kΩ y 100 nF del ejercicio 26.5 (100 V/s, 0,1 s hasta −10 V); la deriva, con 1 mV de offset
# (de µV a mV, sección 26.1) en 10 kΩ y 100 nF, sin y con R_f = 1 MΩ (sin ella, R_f = 1 TΩ hace de «abierta»); la
# curva de la deriva incluye A₀ finito (v₋ = −v_o/A₀), como el simulador. La
# cuadrada de 1 V a 500 Hz para la triangular es un ejemplo de la comprobación de banco del bloque 164.
leccion: cap27/sec-27.4

libro:
  142: 'V_("out") = - R_("f") dot.op lr(( (V_("1"))/(R_("1"))'
  143: "las entradas no interactúan"
  144: "una suma ponderada"
  149: 'V_("out") = - ("1")/(R C) dot.op integral V_("in") d t'
  150: "Una entrada constante da una rampa de salida"
  151: "la salida deriva hasta saturar, aunque la entrada esté a cero"
  152: "una resistencia grande en paralelo con el condensador"
  156: "amplifica el ruido"
  157: "evitar derivar siempre que se pueda"
  159: "multiplicar y dividir señales"
  162: "Para comparar hay un componente específico"
  164: "la salida debe ser triangular"
  "cap27#434": "Un integrador tiene R = 100 kΩ y C = 100 nF. Se le aplica un escalón de 1 V"

modelo:
  valores:
    V_1: { sim: "v₁", nombre: "entrada 1", unidad: V, valor: 0.5 }
    V_2: { sim: "v₂", nombre: "entrada 2", unidad: V, valor: 0 }
    V_3: { sim: "v₃", nombre: "entrada 3", unidad: V, valor: 0 }
    R_s: { sim: "R", nombre: "resistencia de cada entrada", unidad: Ω, valor: 10000 }
    R_fs: { sim: "R_{f}", nombre: "realimentación del sumador", unidad: Ω, valor: 10000 }
    A_0: { sim: "A_{0}", nombre: "ganancia en lazo abierto", unidad: "", valor: 100000 }
    V_s: { sim: "V_{sat}", nombre: "salida máxima", unidad: V, valor: 12 }
    V_ig: { sim: "v_{in}", nombre: "escalón de entrada", unidad: V, valor: 1 }
    R_ig: { sim: "R", nombre: "resistencia del integrador", unidad: Ω, valor: 100000 }
    C_ig: { sim: "C", nombre: "condensador del integrador", unidad: F, valor: 100e-9 }
    V_os: { sim: "V_{os}", nombre: "offset de entrada", unidad: V, valor: 0.001 }
    R_d: { sim: "R", nombre: "resistencia del integrador con deriva", unidad: Ω, valor: 10000 }
    s_rf: { tipo: interruptor, nombre: "resistencia en paralelo con C", valor: 0 }
    A_q: { sim: "V_{p}", nombre: "amplitud de la cuadrada", unidad: V, valor: 1 }
    f_q: { sim: "f", nombre: "frecuencia de la cuadrada", unidad: Hz, valor: 500 }
    forma: { sim: "forma", nombre: "forma de onda (1, cuadrada)", unidad: "", valor: 1 }
    cero: { sim: "0", nombre: "nivel de continua", unidad: V, valor: 0 }
    C_q: { sim: "C", nombre: "condensador", unidad: F, valor: 100e-9 }
  calculos:
    S_i: { expr: "V_1/R_s + V_2/R_s + V_3/R_s", sim: "Σ v/R", nombre: "suma de corrientes", unidad: A }
    V_os_s: { expr: "-R_fs*S_i*A_0/(A_0 + 1 + R_fs/par(R_s, R_s, R_s))", sim: "v_{o}", nombre: "salida del sumador", unidad: V, cifras: 3 }
    V_ms: { expr: "-V_os_s/A_0", sim: "v_{−}", nombre: "entrada −", unidad: V }
    I_s1: { expr: "(V_1 - V_ms)/R_s", sim: "I₁", nombre: "corriente de la entrada 1", unidad: A }
    I_s2: { expr: "(V_2 - V_ms)/R_s", sim: "I₂", nombre: "corriente de la entrada 2", unidad: A }
    I_s3: { expr: "(V_3 - V_ms)/R_s", sim: "I₃", nombre: "corriente de la entrada 3", unidad: A }
    t_rc: { expr: "R_ig*C_ig", sim: "RC", nombre: "constante del integrador", unidad: s }
    p_i: { expr: "V_ig/t_rc", sim: "|dV/dt|", nombre: "pendiente de la rampa", unidad: "V/s" }
    t_10: { expr: "10/p_i", sim: "t", nombre: "tiempo hasta −10 V", unidad: s }
    R_fd: { si: s_rf, entonces: "1000000", sino: "1000000000000", sim: "R_{f}", nombre: "resistencia en paralelo con C", unidad: Ω }
    t_d: { expr: "R_d*C_q", sim: "RC", nombre: "constante de la deriva", unidad: s }
    k_d: { expr: "1/(A_0*R_d) + (1 + 1/A_0)/R_fd", sim: "k", nombre: "conductancia equivalente", unidad: S }
    x_inf: { expr: "-(V_os/R_d)/k_d", sim: "v_{o,∞}", nombre: "salida final sin raíles", unidad: V }
    tau_d: { expr: "C_q*(1 + 1/A_0)/k_d", sim: "τ", nombre: "constante de tiempo", unidad: s }
    V_lim: { expr: "min(V_s, -x_inf)", sim: "|v_{o}|", nombre: "salida final por el offset", unidad: V }
    T_q: { expr: "1/f_q", sim: "T", nombre: "periodo", unidad: s }
    V_pp: { expr: "A_q/(R_d*C_q)*T_q/2", sim: "Δv_{o}", nombre: "excursión de la triangular", unidad: V }

tarjetas:
  - id: explore-sumador
    tipo: explorar
    titulo: "El sumador"
    texto: "Tres entradas por 10 kΩ al nodo inversor y 10 kΩ de realimentación. Mueva las entradas y mire la salida."
    libro: [142, 143]
    widget:
      tipo: circuito
      esquema: ao-sumador
      piezas: { entrada: V_1, r1: R_s, entrada2: V_2, r2: R_s, entrada3: V_3, r3: R_s, rf: R_fs, a0: A_0, vsat: V_s }
      lectura: { valor: V_os_s, rotulo: "v_{o}" }
      datos:
        - { valor: I_s1, rotulo: "I₁ = {{I_s1}}" }
      corriente: I_s1
      mide: { vo: V_os_s, vmenos: V_ms, i1: I_s1, i2: I_s2, i3: I_s3 }
      mandos:
        - { valor: V_1, min: -1, max: 1, paso: 0.25, rotulo: "Entrada 1" }
        - { valor: V_2, lista: [-1, 0, 1], rotulo: "Entrada 2" }
        - { valor: V_3, lista: [-1, 0, 1], rotulo: "Entrada 3" }
    requiere: { mover: [V_1, V_2] }
    comprobar:
      - { R_s: 10000, R_fs: 10000 }

  - id: formula-sumador
    tipo: formula
    titulo: "Suma de corrientes"
    texto: "Las corrientes se suman en la masa virtual y cruzan R_{f}. Mueva las entradas."
    libro: [142, 144]
    ec: 142
    sustitucion: "−{{R_fs}} · ({{V_1}} + {{V_2}} + {{V_3}}) / {{R_s}} = {{V_os_s}}"
    widget:
      tipo: circuito
      esquema: ao-sumador
      piezas: { entrada: V_1, r1: R_s, entrada2: V_2, r2: R_s, entrada3: V_3, r3: R_s, rf: R_fs, a0: A_0, vsat: V_s }
      lectura: { valor: V_os_s, rotulo: "v_{o}" }
      corriente: I_s1
      mide: { vo: V_os_s, vmenos: V_ms, i1: I_s1, i2: I_s2, i3: I_s3 }
      mandos:
        - { valor: V_1, min: -1, max: 1, paso: 0.25, rotulo: "Entrada 1" }
        - { valor: V_3, lista: [-1, 0, 1], rotulo: "Entrada 3" }

  - id: sorpresa-independientes
    tipo: sorpresa
    titulo: "Las entradas no se oyen entre sí"
    texto: "Fije la entrada 1 y mueva la 2. Mire la corriente de la entrada 1."
    libro: [143]
    fijar: { V_1: 0.5 }
    inicio: { V_2: 0 }
    widget:
      tipo: circuito
      esquema: ao-sumador
      piezas: { entrada: V_1, r1: R_s, entrada2: V_2, r2: R_s, entrada3: V_3, r3: R_s, rf: R_fs, a0: A_0, vsat: V_s }
      lectura: { valor: I_s1, rotulo: "Corriente de la entrada 1" }
      datos:
        - { valor: V_os_s, rotulo: "Salida: {{V_os_s}}" }
      corriente: I_s1
      mide: { vo: V_os_s, vmenos: V_ms, i1: I_s1, i2: I_s2, i3: I_s3 }
      mandos:
        - { valor: V_2, lista: [-1, 0, 1], rotulo: "Entrada 2" }
    requiere: { mover: [V_2] }

  - id: por-que-independientes
    tipo: porque
    titulo: "¿Por qué no interactúan?"
    texto: "La salida cambia y la corriente de la entrada 1 no. ¿Por qué?"
    libro: [143]
    fijar: { V_1: 0.5, V_2: 1 }
    widget:
      tipo: circuito
      esquema: ao-sumador
      piezas: { entrada: V_1, r1: R_s, entrada2: V_2, r2: R_s, entrada3: V_3, r3: R_s, rf: R_fs, a0: A_0, vsat: V_s }
      lectura: { valor: I_s1, rotulo: "Corriente de la entrada 1" }
      corriente: I_s1
      mide: { vo: V_os_s, vmenos: V_ms, i1: I_s1, i2: I_s2, i3: I_s3 }
    opciones:
      - texto: "Todas llegan a una masa virtual: cada una ve solo su resistencia"
        bien: true
        porque: "El nodo no se mueve, así que cada corriente es v/R y se suman: un mezclador sin que un canal afecte a otro."
      - texto: "Porque las resistencias son iguales"
        porque: "Con valores distintos sigue igual: es una suma ponderada."
      - texto: "Porque la entrada 2 no llega al operacional"
        porque: "Sí llega: cambia la salida. Lo que no cambia es la tensión del nodo."
    escalera:
      - "¿A qué tensión está el nodo inversor?"
    solucion: "La masa virtual: cada entrada ve solo su resistencia."

  - id: prediga-rampa
    tipo: predecir
    titulo: "Un escalón en el integrador"
    texto: "R = 100 kΩ, C = 100 nF y un escalón de 1 V. ¿Cuánto tarda la salida en llegar a −10 V?"
    libro: [149, 150, "cap27#434"]
    widget:
      tipo: circuito
      esquema: ao-integrador
      piezas: { entrada: V_ig, r: R_ig, c: C_ig, a0: A_0, vsat: V_s }
      lectura: { valor: t_10, rotulo: "Tiempo hasta −10 V" }
      ocultar: true
      grafica:
        x: { id: t, min: 0, max: 0.2, unidad: s, rotulo: "t" }
        y: { min: -13, max: 2, unidad: V, rotulo: "v_{o}" }
        curvas:
          - { expr: "max(-V_s, -V_ig*t/t_rc)", color: naranja, rotulo: "v_{o}", mide: salida }
    opciones:
      - texto: "0,1 s"
        bien: true
        porque: "La pendiente es 1 V / (100 kΩ · 100 nF) = 100 V/s: 10 V en 0,1 s."
      - texto: "0,01 s"
        porque: "Eso es RC. En RC la rampa solo baja 1 V, lo que vale la entrada."
      - texto: "Nunca: un condensador cargado se para"
        porque: "La corriente es constante, 1 V/R, porque la entrada − es masa virtual: la carga crece sin parar."
    escalera:
      - "Pendiente = v_{in}/(RC)."
    solucion: "100 V/s: 10 V en 0,1 s (bajando, porque es inversor)."
    comprobar:
      - { t_10: 0.1, p_i: 100, t_rc: 0.01 }

  - id: formula-integrador
    tipo: formula
    titulo: "La rampa del integrador"
    texto: "Una entrada constante carga C con corriente constante. Cambie C y mire la pendiente."
    libro: [149, 150]
    ec: 149
    sustitucion: "{{V_ig}} / ({{R_ig}} · {{C_ig}}) = {{p_i}}"
    widget:
      tipo: circuito
      esquema: ao-integrador
      piezas: { entrada: V_ig, r: R_ig, c: C_ig, a0: A_0, vsat: V_s }
      lectura: { valor: p_i, rotulo: "Pendiente" }
      grafica:
        x: { id: t, min: 0, max: 0.2, unidad: s, rotulo: "t" }
        y: { min: -13, max: 2, unidad: V, rotulo: "v_{o}" }
        curvas:
          - { expr: "max(-V_s, -V_ig*t/t_rc)", color: naranja, rotulo: "v_{o}", mide: salida }
      mandos:
        - { valor: C_ig, lista: [100e-9, 220e-9, 470e-9], rotulo: "C" }

  - id: sorpresa-deriva
    tipo: sorpresa
    titulo: "La entrada a cero, y la salida se va"
    texto: "Integrador de 10 kΩ y 100 nF con la entrada a masa, pero con 1 mV de offset. Mire la salida; luego ponga R_{f} = 1 MΩ."
    libro: [151, 152]
    inicio: { s_rf: 0 }
    widget:
      tipo: circuito
      esquema: ao-integrador
      piezas: { entrada: V_os, r: R_d, c: C_q, rf: R_fd, a0: A_0, vsat: V_s }
      lectura: { valor: V_lim, rotulo: "Hacia dónde va la salida, en módulo" }
      grafica:
        x: { id: t, min: 0, max: 20, unidad: s, rotulo: "t" }
        y: { min: -13, max: 2, unidad: V, rotulo: "v_{o}" }
        curvas:
          - { expr: "max(-V_s, x_inf*(1 - exp(-t/tau_d)))", color: naranja, rotulo: "v_{o}", mide: salida }
      mandos:
        - { valor: s_rf, tipo: interruptor, rotulo: "R_{f} de 1 MΩ en paralelo con C" }
    requiere: { mover: [s_rf] }
    comprobar:
      - { V_os: 0.001, R_d: 10000 }
      - { con: { s_rf: 1 }, R_fd: 1000000 }

  - id: por-que-deriva
    tipo: porque
    titulo: "¿Por qué deriva?"
    texto: "Sin R_{f}, la salida se va al raíl aunque la entrada esté a cero. ¿Por qué?"
    libro: [151, 152]
    fijar: { s_rf: 0 }
    widget:
      tipo: circuito
      esquema: ao-integrador
      piezas: { entrada: V_os, r: R_d, c: C_q, rf: R_fd, a0: A_0, vsat: V_s }
      grafica:
        x: { id: t, min: 0, max: 20, unidad: s, rotulo: "t" }
        y: { min: -13, max: 2, unidad: V, rotulo: "v_{o}" }
        curvas:
          - { expr: "max(-V_s, x_inf*(1 - exp(-t/tau_d)))", color: naranja, rotulo: "v_{o}", mide: salida }
    opciones:
      - texto: "Integra el offset y la corriente de polarización, que son entradas continuas pequeñas"
        bien: true
        porque: "Integrar una constante da una rampa sin fin. R_{f} limita la ganancia en continua: integra arriba y no abajo."
      - texto: "Porque el condensador tiene fugas"
        porque: "Las fugas, si acaso, frenarían la deriva. La causa es lo que el integrador integra."
      - texto: "Porque la ganancia en continua es cero"
        porque: "Es al revés: sin R_{f} la ganancia en continua es enorme, la del operacional."
    escalera:
      - "¿Qué hace un integrador con una tensión constante, por pequeña que sea?"
    solucion: "Integra el offset: una rampa hasta el raíl. Con R_{f} en paralelo se detiene."

  - id: explore-cuadrada
    tipo: explorar
    titulo: "Cuadrada que entra, triangular que sale"
    texto: "Una cuadrada de 1 V a 500 Hz en un integrador de 10 kΩ. Cambie C y mire la triangular."
    libro: [164]
    widget:
      tipo: circuito
      esquema: ao-integrador
      piezas: { entrada: cero, amplitud: A_q, f: f_q, forma: forma, r: R_d, c: C_q, a0: A_0, vsat: V_s }
      lectura: { valor: V_pp, rotulo: "Excursión de la triangular" }
      grafica:
        x: { id: t, min: 0, max: 0.004, unidad: s, rotulo: "t" }
        y: { min: -2.5, max: 1.5, unidad: V, rotulo: "v" }
        curvas:
          - { expr: "A_q*(1 - 2*floor(2*(t/T_q - floor(t/T_q))))", color: tinta, rotulo: "v_{in}", mide: entrada, discontinua: true }
          - { expr: "-A_q/(R_d*C_q)*(T_q/2 - abs(t - T_q*floor(t/T_q) - T_q/2))", color: naranja, rotulo: "v_{o}", mide: salida }
      mandos:
        - { valor: C_q, lista: [47e-9, 100e-9, 220e-9], rotulo: "C" }
    requiere: { mover: [C_q] }
    comprobar:
      - { A_q: 1, f_q: 500, R_d: 10000 }

  - id: dibuje-triangular
    tipo: dibujar
    titulo: "Dibuje la salida"
    texto: "Cuadrada de ±1 V a 500 Hz en un integrador de 10 kΩ y 100 nF. Dibuje la salida durante dos periodos."
    libro: [149, 164]
    fijar: { C_q: 100e-9 }
    dibujar:
      x: { id: t, min: 0, max: 0.004, unidad: s, rotulo: "t" }
      y: { min: -1.5, max: 0.5, unidad: V, rotulo: "v_{o}" }
      curva: "-A_q/(R_d*C_q)*(T_q/2 - abs(t - T_q*floor(t/T_q) - T_q/2))"
      puntos: 33
      tol: 0.08
      holgura: 0.03
      rotulo: "Salida del integrador"
    exito: "Una triangular: baja a 1000 V/s mientras la entrada está en +1 V y sube igual en −1 V; 1 V de excursión."
    pistas:
      - { cuando: { valor: media, mayor: 0 }, texto: "Ha dibujado hacia arriba: con la entrada positiva, el inversor baja." }
      - { texto: "Rampas rectas, no curvas: la corriente por C es constante en cada mitad." }
    escalera:
      - "Pendiente = 1 V/(10 kΩ · 100 nF) = 1000 V/s, durante medio periodo de 1 ms."
    solucion: "Una triangular entre 0 y −1 V, con el pico a cada milisegundo impar."
    comprobar:
      - { V_pp: 1, T_q: 0.002, f_q: 500 }

  - id: por-que-derivador
    tipo: pregunta
    titulo: "El derivador"
    texto: "¿Por qué conviene evitar el derivador siempre que se pueda?"
    libro: [156, 157]
    widget:
      tipo: grafica
      x: { id: nu, min: 10, max: 100000, unidad: Hz, rotulo: "f", escala: log }
      y: { min: 0.001, max: 1000, unidad: "", rotulo: "|ganancia|", escala: log }
      curvas:
        - { expr: "1/(2*pi*nu*R_d*C_q)", color: azul, rotulo: "integrador" }
        - { expr: "2*pi*nu*R_d*C_q", color: naranja, rotulo: "derivador" }
    opciones:
      - texto: "Su ganancia crece con la frecuencia: amplifica el ruido y tiende a oscilar"
        bien: true
        porque: "El ruido está sobre todo arriba, y el condensador de entrada añade fase al lazo. Casi todo se puede reformular integrando."
      - texto: "Porque no funciona con señales lentas"
        porque: "Funciona, con poca ganancia. El problema está arriba, en el ruido."
      - texto: "Porque deriva hasta saturar"
        porque: "Eso es el integrador, que integra el offset. El derivador falla por el otro extremo."
    escalera:
      - "Mire las dos curvas a frecuencia alta."
    solucion: "Amplifica el ruido de alta frecuencia y es propenso a la inestabilidad."

  - id: empareje-operaciones
    tipo: pregunta
    fase: "Empareje"
    titulo: "Aritmética con operacionales"
    texto: "Una cada bloque con su uso."
    libro: [144, 150, 159, 162]
    emparejar:
      - ["Sumador ponderado", "DAC de resistencias ponderadas"]
      - ["Integrador", "Generador triangular y parte integral de un PID"]
      - ["Logarítmico", "Multiplicar señales sumando logaritmos"]
      - ["Sin realimentación", "Compara: mejor un componente específico"]
    exito: "Los computadores analógicos resolvían ecuaciones diferenciales con estos bloques."
    pistas:
      - { texto: "Sumar logaritmos es multiplicar." }
    escalera:
      - "Un DAC suma bits con pesos distintos."
    solucion: "Sumador–DAC, integrador–triangular y PID, logarítmico–multiplicar, sin realimentación–comparador."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [142, 149, 151, 156]
    ideas:
      - { titulo: "Sumador.", texto: "Las corrientes se suman en la masa virtual: las entradas no interactúan." }
      - { titulo: "Integrador.", texto: "Entrada constante, rampa: v_{in}/(RC). Deriva sin R_{f} en paralelo." }
      - { titulo: "Derivador.", texto: "Amplifica el ruido: mejor integrar." }
