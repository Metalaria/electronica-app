# Lección 1.2 de la sección 26.3 «Las Configuraciones Básicas» (cap27; etiqueta interna sec-27.3).
# Formato: contenido/lecciones11/GUIA.md. Operacional de la app con A₀ = 10⁵ y ±12 V de salida máxima (ejemplo).
# Inversor en «ao-inversor» (1 kΩ y 10 kΩ de ejemplo); no inversor del ejercicio 26.1 (1 kΩ y 47 kΩ, ganancia 48) en
# «ao-no-inversor»; el reto de atenuar a la mitad con R_in = 22 kΩ es un ejemplo de la fila «atenuar» de la tabla de
# elección. La avería: un no inversor de 1 kΩ y 10 kΩ con 0,5 V, medido como dice el bloque 133 (la salida y la
# entrada −, que debe seguir a la +); R₂ abierta deja el lazo abierto y R₁ abierta lo convierte en seguidor.
leccion: cap27/sec-27.3

libro:
  104: "las dos reglas de oro"
  107: 'A_("v") = - (R_("f"))/(R_("in"))'
  108: "el nodo inversor es una masa virtual"
  109: "La impedancia de entrada es R"
  112: 'A_("v") = "1" + (R_("f"))/(R_("g"))'
  113: "La ganancia mínima es 1"
  115: "transforma impedancias"
  121: 'V_("out") = - I_("in") dot.op R_("f")'
  124: "Atenuar, o ganancia menor que 1"
  127: "Una entrada flotante hace que la salida derive al raíl"
  133: "el operacional está saturado o el lazo está abierto"
  "cap27#434": "Un amplificador no inversor usa R₁ = 1 kΩ a masa y R₂ = 47 kΩ de realimentación"

modelo:
  valores:
    V_i: { sim: "v_{in}", nombre: "tensión de entrada", unidad: V, valor: 0.5 }
    R_1: { sim: "R_{in}", nombre: "resistencia de entrada", unidad: Ω, valor: 1000 }
    R_2: { sim: "R_{f}", nombre: "resistencia de realimentación", unidad: Ω, valor: 10000 }
    A_0: { sim: "A_{0}", nombre: "ganancia en lazo abierto", unidad: "", valor: 100000 }
    V_s: { sim: "V_{sat}", nombre: "salida máxima", unidad: V, valor: 12 }
    R_g: { sim: "R_{g}", nombre: "resistencia a masa del no inversor", unidad: Ω, valor: 1000 }
    R_f: { sim: "R_{f}", nombre: "realimentación del no inversor", unidad: Ω, valor: 47000 }
    V_p: { sim: "v_{in}", nombre: "entrada del no inversor", unidad: V, valor: 0.1 }
    I_pd: { sim: "I_{in}", nombre: "corriente del fotodiodo", unidad: A, valor: 0.0000002 }
    R_t: { sim: "R_{f}", nombre: "resistencia de transimpedancia", unidad: Ω, valor: 1000000 }
  calculos:
    G_n: { expr: "R_2/R_1", sim: "|A_{v}|", nombre: "ganancia ideal del inversor", unidad: "", cifras: 3 }
    V_o: { expr: "max(-V_s, min(V_s, -G_n*V_i*A_0/(A_0 + 1 + G_n)))", sim: "v_{o}", nombre: "salida del inversor", unidad: V }
    V_m: { expr: "(V_i*R_2 + V_o*R_1)/(R_1 + R_2)", sim: "v_{−}", nombre: "entrada −", unidad: V }
    I_1: { expr: "(V_i - V_m)/R_1", sim: "I₁", nombre: "corriente por R_in", unidad: A }
    A_v: { expr: "V_o/V_i", sim: "A_{v}", nombre: "ganancia del inversor", unidad: "", cifras: 3 }
    G_p: { expr: "1 + R_f/R_g", sim: "A_{v}", nombre: "ganancia ideal del no inversor", unidad: "", cifras: 3 }
    b_p: { expr: "R_g/(R_g + R_f)", sim: "β", nombre: "fracción realimentada", unidad: "" }
    V_op: { expr: "max(-V_s, min(V_s, V_p*A_0/(1 + A_0*b_p)))", sim: "v_{o}", nombre: "salida del no inversor", unidad: V, cifras: 3 }
    V_mp: { expr: "V_op*b_p", sim: "v_{−}", nombre: "entrada − del no inversor", unidad: V }
    I_p: { expr: "V_mp/R_g", sim: "I", nombre: "corriente por R_g", unidad: A }
    G_m: { expr: "R_f/R_g", sim: "R_{f}/R_{g}", nombre: "sin el uno", unidad: "" }
    b_a: { expr: "R_1/(R_1 + R_2)", sim: "β", nombre: "fracción realimentada de la avería", unidad: "" }
    V_oa: { expr: "max(-V_s, min(V_s, V_i*A_0/(1 + A_0*b_a)))", sim: "v_{o}", nombre: "salida", unidad: V }
    V_ma: { expr: "V_oa*b_a", sim: "v_{−}", nombre: "entrada −", unidad: V }
    G_a: { expr: "1/b_a", sim: "1/β", nombre: "ganancia ideal del no inversor averiado", unidad: "" }
    V_t: { expr: "I_pd*R_t", sim: "|V_{out}|", nombre: "salida del transimpedancia", unidad: V }

tarjetas:
  - id: explore-inversor
    tipo: explorar
    titulo: "El inversor"
    texto: "La entrada entra por R_{in} al nodo inversor. Cambie R_{f} y la entrada, y mire la ganancia y la entrada −."
    libro: [104, 107, 108, 109]
    widget:
      tipo: circuito
      esquema: ao-inversor
      piezas: { entrada: V_i, r1: R_1, r2: R_2, a0: A_0, vsat: V_s }
      lectura: { valor: A_v, rotulo: "Ganancia" }
      datos:
        - { valor: V_o, rotulo: "Salida: {{V_o}}" }
        - { valor: V_m, rotulo: "Entrada −: {{V_m}}" }
      corriente: I_1
      mide: { vo: V_o, vmenos: V_m, i1: I_1 }
      mandos:
        - { valor: R_2, lista: [4700, 10000, 22000], rotulo: "R_{f}" }
        - { valor: V_i, min: -1, max: 1, paso: 0.25, rotulo: "Entrada" }
    requiere: { mover: [R_2, V_i] }

  - id: formula-inversor
    tipo: formula
    titulo: "La ganancia del inversor"
    texto: "La corriente de R_{in} no tiene otro camino que R_{f}. Cambie R_{f}."
    libro: [107, 108]
    ec: 107
    sustitucion: "−{{R_2}} / {{R_1}} = −{{G_n}}"
    widget:
      tipo: circuito
      esquema: ao-inversor
      piezas: { entrada: V_i, r1: R_1, r2: R_2, a0: A_0, vsat: V_s }
      lectura: { valor: A_v, rotulo: "Ganancia" }
      corriente: I_1
      mide: { vo: V_o, vmenos: V_m, i1: I_1 }
      mandos:
        - { valor: R_2, lista: [4700, 10000, 22000], rotulo: "R_{f}" }

  - id: prediga-no-inversor
    tipo: predecir
    titulo: "Un no inversor"
    texto: "R_{g} = 1 kΩ a masa y R_{f} = 47 kΩ de realimentación. ¿Cuál es su ganancia?"
    libro: [112, "cap27#434"]
    widget:
      tipo: circuito
      esquema: ao-no-inversor
      piezas: { entrada: V_p, r1: R_g, r2: R_f, a0: A_0, vsat: V_s }
      lectura: { valor: G_p, rotulo: "Ganancia" }
      corriente: I_p
      mide: { vo: V_op, vmenos: V_mp, i1: I_p }
      ocultar: true
    opciones:
      - texto: "48"
        bien: true
        porque: "1 + 47/1 = 48: el divisor devuelve 1/48 de la salida y la entrada − debe igualar a la +."
      - texto: "47"
        porque: "Esa es la del inversor con las mismas resistencias. El no inversor suma uno."
      - texto: "−47"
        porque: "El no inversor no invierte: la señal entra por la +."
    escalera:
      - "A_{v} = 1 + R_{f}/R_{g}."
    solucion: "1 + 47 000/1000 = 48."
    comprobar:
      - { G_p: 48, G_m: 47 }

  - id: reto-atenuar
    tipo: reto
    titulo: "Atenuar a la mitad"
    texto: "Hay que dividir una señal por dos (invertida). Con R_{in} = 22 kΩ, elija R_{f} (E24)."
    libro: [107, 124]
    fijar: { R_1: 22000, V_i: 1 }
    inicio: { R_2: 22000 }
    widget:
      tipo: circuito
      esquema: ao-inversor
      piezas: { entrada: V_i, r1: R_1, r2: R_2, a0: A_0, vsat: V_s }
      lectura: { valor: A_v, rotulo: "Ganancia" }
      corriente: I_1
      mide: { vo: V_o, vmenos: V_m, i1: I_1 }
      mandos:
        - { valor: R_2, serie: E24, min: 1000, max: 47000, rotulo: "R_{f} (E24)" }
    condiciones:
      - { valor: G_n, objetivo: 0.5, tol: 0.02, rotulo: "|A_{v}|: {{G_n}}" }
    exito: "Ganancia −0,5: el inversor atenúa sin más que R_{f} < R_{in}. El no inversor no puede."
    pistas:
      - { cuando: { valor: G_n, mayor: 0.51 }, texto: "Atenúa poco: R_{f} debe ser la mitad de R_{in}. Bájela." }
      - { cuando: { valor: G_n, menor: 0.49 }, texto: "Atenúa demasiado: suba R_{f}." }
    escalera:
      - "|A_{v}| = R_{f}/R_{in}: busque la mitad de 22 kΩ."
    solucion: "R_{f} = 11 kΩ, que está en la serie E24."
    comprobar:
      - { con: { R_2: 11000 }, G_n: 0.5 }

  - id: sorpresa-minimo
    tipo: sorpresa
    titulo: "El no inversor no baja de 1"
    texto: "Intente atenuar con el no inversor: baje R_{f} hasta cero."
    libro: [113, 115]
    inicio: { R_f: 47000 }
    widget:
      tipo: circuito
      esquema: ao-no-inversor
      piezas: { entrada: V_p, r1: R_g, r2: R_f, a0: A_0, vsat: V_s }
      lectura: { valor: G_p, rotulo: "Ganancia ideal" }
      datos:
        - { valor: V_op, rotulo: "Salida: {{V_op}}" }
      corriente: I_p
      mide: { vo: V_op, vmenos: V_mp, i1: I_p }
      mandos:
        - { valor: R_f, lista: [0, 1000, 10000, 47000], rotulo: "R_{f}" }
    requiere: { mover: [R_f] }

  - id: por-que-minimo
    tipo: porque
    titulo: "¿Por qué no atenúa?"
    texto: "Con R_{f} = 0 el no inversor da ganancia 1, y ya no baja más. ¿Por qué?"
    libro: [113, 115]
    fijar: { R_f: 0 }
    widget:
      tipo: circuito
      esquema: ao-no-inversor
      piezas: { entrada: V_p, r1: R_g, r2: R_f, a0: A_0, vsat: V_s }
      lectura: { valor: G_p, rotulo: "Ganancia ideal" }
      corriente: I_p
      mide: { vo: V_op, vmenos: V_mp, i1: I_p }
    opciones:
      - texto: "La salida debe ser al menos la entrada para que la −, que toma una parte de ella, iguale a la +"
        bien: true
        porque: "Ganancia mínima 1, el seguidor: no amplifica, pero transforma impedancias."
      - texto: "Porque la entrada + no admite señales pequeñas"
        porque: "Admite cualquiera; el límite está en la red, que solo puede tomar una fracción de la salida."
      - texto: "Porque con R_{f} = 0 el operacional satura"
        porque: "No satura: es el seguidor, perfectamente estable en el modelo de la app."
    escalera:
      - "La entrada − ve una fracción de la salida, nunca más que toda."
    solucion: "1 + R_{f}/R_{g} nunca es menor que 1: para atenuar, el inversor."

  - id: averia-no-inversor
    tipo: averia
    titulo: "Un no inversor que no responde"
    texto: "Este no inversor de ganancia 11 tiene una resistencia averiada. Mida la salida y la entrada −, y encuentre cuál."
    libro: [112, 133]
    fijar: { V_i: 0.5, R_1: 1000, R_2: 10000 }
    widget:
      tipo: circuito
      esquema: ao-no-inversor
      piezas: { entrada: V_i, r1: R_1, r2: R_2, a0: A_0, vsat: V_s }
      mide: { vo: V_oa, vmenos: V_ma }
      mandos: []
    averia:
      pasos: 2
      eleccion: fija
      preguntar_tipo: false
      sospechosos:
        - { id: r1, rotulo: "R₁, a masa" }
        - { id: r2, rotulo: "R₂, de realimentación" }
      sondas:
        - { id: vo, rotulo: "Salida", valor: V_oa }
        - { id: vmenos, rotulo: "Entrada −", valor: V_ma }
      fallos:
        - { id: r2-abierta, pieza: r2, tipo: abierta, con: { R_2: 1e9 }, texto: "R₂ abierta: el lazo queda abierto, la salida se va al raíl y la entrada − ya no sigue a la +." }
        - { id: r1-abierta, pieza: r1, tipo: abierta, con: { R_1: 1e9 }, texto: "R₁ abierta: toda la salida vuelve a la entrada −; queda un seguidor de ganancia 1." }
    exito: "Medir la entrada − frente a la + dice antes que nada si el lazo funciona."
    escalera:
      - "Sano daría 5,5 V a la salida y 0,5 V en la entrada −."
      - "¿Sigue la entrada − a la +? Si no, el lazo está abierto o saturado."
    solucion: "Lazo abierto (salida al raíl, entrada − en 0 V): R₂. Ganancia 1 (las dos en 0,5 V): R₁."
    comprobar:
      - { V_oa: 5.5, V_ma: 0.5, tol: 0.01 }
      - { con: { R_2: 1e9 }, V_oa: 12 }
      - { G_n: 10, G_a: 11 }

  - id: empareje-eleccion
    tipo: pregunta
    fase: "Empareje"
    titulo: "La tabla de elección"
    texto: "Una cada necesidad con su configuración."
    libro: [124]
    emparejar:
      - ["Amplificar con impedancia alta", "No inversor"]
      - ["Atenuar, o ganancia menor que 1", "Inversor"]
      - ["Adaptar impedancias", "Seguidor"]
      - ["Sumar señales", "Inversor sumador"]
      - ["Convertir corriente", "Transimpedancia"]
    exito: "Casi cualquier función analógica es una combinación de estas."
    pistas:
      - { texto: "El seguidor no amplifica: transforma impedancias." }
    escalera:
      - "Las entradas que no interactúan son las del inversor: de ahí el sumador."
    solucion: "Impedancia alta–no inversor, atenuar–inversor, adaptar–seguidor, sumar–sumador, corriente–transimpedancia."

  - id: estime-transimpedancia
    tipo: pregunta
    fase: "Estime"
    titulo: "Un fotodiodo"
    texto: "Un amplificador de transimpedancia con R_{f} = 1 MΩ y un fotodiodo que entrega 200 nA. ¿Qué tensión de salida da, en módulo?"
    libro: [121, "cap27#434"]
    estimar:
      objetivo: "V_t"
      unidad: V
      min: 0
      max: 2
      paso: 0.05
      inicio: 1.5
      tol: 0.05
      rotulo: "|V_{out}|"
    exito: "0,2 V: toda la corriente pasa por R_{f}, y el fotodiodo trabaja con tensión nula."
    pistas:
      - { cuando: { valor: estimacion, mayor: 0.21 }, texto: "Se ha pasado: 200 nA son 2 · 10⁻⁷ A." }
      - { texto: "Se ha quedado corto: multiplique la corriente por R_{f}." }
    escalera:
      - "V_{out} = −I_{in} · R_{f}."
    solucion: "200 nA · 1 MΩ = 0,2 V."
    comprobar:
      - { V_t: 0.2 }

  - id: entrada-flotante
    tipo: pregunta
    titulo: "Lo que se olvida"
    texto: "Una entrada del operacional se queda sin camino de continua a masa. ¿Qué hace la salida?"
    libro: [127]
    fijar: { V_i: 0.5 }
    widget:
      tipo: circuito
      esquema: ao-inversor
      piezas: { entrada: V_i, r1: R_1, r2: R_2, a0: A_0, vsat: V_s }
      lectura: { valor: V_o, rotulo: "v_{o}" }
      corriente: I_1
      mide: { vo: V_o, vmenos: V_m, i1: I_1 }
    opciones:
      - texto: "Deriva hasta un raíl"
        bien: true
        porque: "Las corrientes de polarización necesitan un camino de continua; sin él, la entrada se carga y la salida se va."
      - texto: "Se queda en cero"
        porque: "Nada fija esa entrada: no hay razón para que se quede en cero."
      - texto: "Funciona igual, porque no entra corriente"
        porque: "La regla de oro es una idealización: entra una corriente de polarización pequeña que necesita su camino."
    escalera:
      - "Por las entradas reales sí entra algo de corriente."
    solucion: "Deriva al raíl: cada entrada necesita un camino de continua."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [107, 112, 113, 133]
    ideas:
      - { titulo: "Inversor.", texto: "−R_{f}/R_{in}, masa virtual, entrada de R_{in}; atenúa si hace falta." }
      - { titulo: "No inversor.", texto: "1 + R_{f}/R_{g}, impedancia altísima, ganancia mínima 1." }
      - { titulo: "Seguidor.", texto: "Ganancia 1: transforma impedancias." }
      - { titulo: "Comprobar.", texto: "Entre las entradas, cero; si no, lazo abierto o saturado." }
