# Lección 1.2 de la sección 26.8 «Estabilidad del Operacional: Compensación y Carga Capacitiva» (cap27; sec-27.8).
# Formato: contenido/lecciones11/GUIA.md. El Bode es el del operacional de la tabla del bloque 240: A = 10⁵ con polos
# en 10 Hz y 1 MHz. El cruce de |A|/G = 1 se resuelve exacto (una ecuación de segundo grado en f²) y el margen es
# 180° menos la fase de los dos polos allí: da los 89,5°, 84,8° y 52° de la tabla. La respuesta al escalón es la de un
# segundo orden normalizado (tiempo en 1/ω₀), con ζ de 0,9, 0,7 (unos 65°), 0,42 (45°, 23 %) y 0,2 (bloque 237).
# 1.2.1 (autor121-ana, «aprender haciendo», GUIA §13): primero se predice qué montaje tiene menos margen y luego se
# busca en el Bode (objetivo); el seguidor en vivo se lleva a ganancia 2 hasta quitarle el timbre, el polo dominante se
# baja hasta dar 45° al seguidor (la compensación y su precio en GBW), el margen de 23 % de sobreimpulso se busca, las
# causas de desfase se tocan en la fig. 26.14 y el polo de la entrada se predice. Quedan dos preguntas de opciones
# (cuál oscila antes, por qué el seguidor); el margen recomendado y la prueba de 1 nF pasan a explicaciones y resumen.
leccion: cap27/sec-27.8

libro:
  230: "el amplificador introduce retardo"
  231: "el circuito oscila"
  234: "en la frecuencia donde la ganancia de lazo vale 1"
  236: "Compromiso recomendado"
  237: "con 45° el amortiguamiento baja a unos 0,42 y el sobreimpulso ronda el 23 %"
  240: "Seguidor (ganancia 1)"
  242: "Cuanta menos ganancia, peor el margen"
  243: "el seguidor de tensión es la configuración más difícil de estabilizar"
  245: "la ganancia haya caído por debajo de 1 antes de que el segundo polo aporte fase"
  246: "ese condensador es exactamente el que limita el GBW y el slew rate"
  248: "Con unos cientos de picofaradios, un operacional estable puede empezar a timbrar"
  249: "una resistencia de aislamiento de decenas de ohmios"
  250: "con 1 MΩ y 10 pF, el polo está en 16 kHz"
  251: "añade fase sin reducir ganancia"
  254: "La sobreoscilación dice el margen de fase"
  "cap27#305": 'f_("p") = ("1")/("2" π dot.op R_("o") dot.op C_("L"))'
  266: "añadir 1 nF a la salida y repetir el escalón"
  262: "Es la causa más frecuente de operacionales que oscilan"
  264: "aportan fase sin límite y sin reducir ganancia"
  267: "Respuesta al escalón para cuatro márgenes de fase, y de dónde sale el desfase"

modelo:
  valores:
    A_0: { sim: "A", nombre: "ganancia en lazo abierto", unidad: "", valor: 100000 }
    f_1: { sim: "f₁", nombre: "primer polo", unidad: Hz, valor: 10 }
    f_2: { sim: "f₂", nombre: "segundo polo", unidad: Hz, valor: 1000000 }
    G: { sim: "G", nombre: "ganancia del montaje", unidad: "", valor: 100 }
    z: { sim: "ζ", nombre: "amortiguamiento", unidad: "", valor: 0.7 }
    R_x: { sim: "R", nombre: "resistencia de realimentación", unidad: Ω, valor: 1000000 }
    C_x: { sim: "C", nombre: "capacidad del nodo de entrada", unidad: F, valor: 10e-12 }
    e_8: { sim: "V_{in}", nombre: "nivel medio de la entrada", unidad: V, valor: 0 }
    a_8: { sim: "A", nombre: "amplitud del escalón", unidad: V, valor: 0.5 }
    f_8: { sim: "f", nombre: "frecuencia de la cuadrada", unidad: Hz, valor: 10000 }
    sq_8: { sim: "forma", nombre: "forma de la entrada (cuadrada)", unidad: "", valor: 1 }
    G_8: { sim: "G", nombre: "ganancia del montaje en vivo", unidad: "", valor: 1 }
    R1_8: { sim: "R₁", nombre: "resistencia a masa", unidad: Ω, valor: 1000 }
  calculos:
    a_q: { expr: "1/(f_1^2*f_2^2)", sim: "a", nombre: "coeficiente", unidad: "" }
    b_q: { expr: "1/f_1^2 + 1/f_2^2", sim: "b", nombre: "coeficiente", unidad: "" }
    c_q: { expr: "1 - (A_0/G)^2", sim: "c", nombre: "coeficiente", unidad: "" }
    f_c: { expr: "sqrt((-b_q + sqrt(b_q^2 - 4*a_q*c_q))/(2*a_q))", sim: "f_{c}", nombre: "frecuencia de cruce", unidad: Hz }
    P_m: { expr: "180 - (atan(f_c/f_1) + atan(f_c/f_2))*180/pi", sim: "MF", nombre: "margen de fase", unidad: "°", cifras: 3 }
    G_db: { expr: "20*log10(G)", sim: "1/β", nombre: "ganancia del montaje en dB", unidad: dB }
    O_s: { expr: "100*exp(-pi*z/sqrt(1 - z^2))", sim: "sobreimpulso", nombre: "sobreimpulso", unidad: "%", cifras: 2 }
    gbw_8: { expr: "A_0*f_1", sim: "GBW", nombre: "producto ganancia-ancho de banda", unidad: Hz }
    R2_8: { expr: "(G_8 - 1)*R1_8", sim: "R₂", nombre: "resistencia de realimentación", unidad: Ω }
    w1_8: { expr: "2*pi*gbw_8/A_0", sim: "ω₁", nombre: "primer polo", unidad: "rad/s" }
    w2_8: { expr: "2*pi*f_2", sim: "ω₂", nombre: "segundo polo", unidad: "rad/s" }
    be_8: { expr: "R1_8/(R1_8 + R2_8)", sim: "β", nombre: "fracción realimentada", unidad: "" }
    wn_8: { expr: "sqrt(w1_8*w2_8*(1 + A_0*be_8))", sim: "ω_{n}", nombre: "pulsación propia", unidad: "rad/s" }
    z_8: { expr: "(w1_8 + w2_8)/(2*wn_8)", sim: "ζ", nombre: "amortiguamiento", unidad: "" }
    G0_8: { expr: "A_0/(1 + A_0*be_8)", sim: "G₀", nombre: "ganancia en continua", unidad: "" }
    wd_8: { expr: "wn_8*sqrt(1 - z_8^2)", sim: "ω_{d}", nombre: "pulsación amortiguada", unidad: "rad/s" }
    so_8: { expr: "100*exp(-pi*z_8/sqrt(1 - z_8^2))", sim: "sobreoscilación", nombre: "sobreoscilación", unidad: "%", cifras: 2 }
    t0_8: { expr: "1/(2*f_8)", sim: "t₀", nombre: "instante del escalón", unidad: s }
    f_x: { expr: "1/(2*pi*R_x*C_x)", sim: "f_{p}", nombre: "polo de la entrada", unidad: Hz }
    gbw_d: { expr: "A_0*f_1", sim: "GBW", nombre: "producto ganancia-ancho de banda del operacional de la tabla", unidad: Hz }

tarjetas:
  - id: prediga-seguidor
    tipo: predecir
    titulo: "¿Cuál oscila antes?"
    texto: "Con el mismo operacional, ¿qué montaje tiene menos margen de fase?"
    libro: [240, 243]
    fijar: { G: 1 }
    widget:
      tipo: grafica
      x: { id: nu, min: 1, max: 100000000, unidad: Hz, rotulo: "f", escala: log }
      y: { min: -40, max: 110, unidad: dB, rotulo: "ganancia" }
      curvas:
        - { expr: "20*log10(A_0/(sqrt(1 + (nu/f_1)^2)*sqrt(1 + (nu/f_2)^2)))", color: azul, rotulo: "lazo abierto" }
      lectura: { valor: P_m, rotulo: "Margen del seguidor" }
      ocultar: true
    opciones:
      - texto: "El seguidor, de ganancia 1: unos 52°"
        bien: true
        porque: "Es el más difícil de estabilizar, no el más fácil: con ganancia 100 el margen es de 89,5°. Compruébelo en el Bode."
      - texto: "El de ganancia 100"
        porque: "Más ganancia del montaje es menos ganancia de lazo: cruce a frecuencia más baja, menos fase."
      - texto: "Todos igual: el operacional es el mismo"
        porque: "El operacional sí, pero la realimentación no: cambia dónde se cruzan las curvas."
    escalera:
      - "¿Dónde cruza la recta de 1/β la curva del operacional cuando la ganancia baja?"
    solucion: "El seguidor: el cruce sube hasta 786 kHz y el margen baja a unos 52°."
    comprobar:
      - { P_m: 52, f_c: 786000, tol: 0.01 }
      - { con: { G: 100 }, P_m: 89.5, tol: 0.01 }

  - id: explore-margen
    tipo: explorar
    titulo: "Dónde se cruzan"
    texto: "La ganancia en lazo abierto, con polos en 10 Hz y 1 MHz, y la del montaje. Busque el montaje que deja el margen por debajo de 60°."
    libro: [234, 236, 240, 242]
    inicio: { G: 100 }
    widget:
      tipo: grafica
      x: { id: nu, min: 1, max: 100000000, unidad: Hz, rotulo: "f", escala: log }
      y: { min: -40, max: 110, unidad: dB, rotulo: "ganancia" }
      curvas:
        - { expr: "20*log10(A_0/(sqrt(1 + (nu/f_1)^2)*sqrt(1 + (nu/f_2)^2)))", color: azul, rotulo: "lazo abierto" }
        - { expr: "G_db", color: naranja, rotulo: "montaje, 1/β", discontinua: true }
      marcas:
        - { x: "f_c", y: "G_db", rotulo: "cruce: {{f_c}}" }
      lectura: { valor: P_m, rotulo: "Margen de fase" }
      mandos:
        - { valor: G, lista: [1, 11, 100], nombres: [seguidor, "ganancia 11", "ganancia 100"], rotulo: "Montaje" }
    objetivo:
      condiciones:
        - { valor: P_m, max: 60, rotulo: "Margen: {{P_m}}" }
      logrado: "Con el seguidor, el cruce sube a {{f_c}} y el margen baja a {{P_m}}: menos ganancia, peor margen."
      pistas:
        - { texto: "Aún hay margen de sobra: baje más la ganancia del montaje." }
    escalera:
      - "La recta del montaje baja; el cruce con la curva del operacional sube en frecuencia."
    solucion: "El seguidor: 786 kHz y unos 52°."
    comprobar:
      - { P_m: 89.5, tol: 0.01 }
      - { con: { G: 11 }, P_m: 84.8, tol: 0.01 }
      - { con: { G: 1 }, P_m: 52, f_c: 786000, tol: 0.01 }

  - id: explore-seguidor-vivo
    tipo: explorar
    titulo: "El seguidor, en vivo"
    texto: "El operacional de la tabla como seguidor, con un escalón. Quítele casi todo el timbre cambiando solo la ganancia del montaje."
    libro: [240, 242, 243]
    inicio: { G_8: 1 }
    widget:
      tipo: circuito
      esquema: ao-estabilidad
      piezas: { entrada: e_8, amplitud: a_8, f: f_8, forma: sq_8, r1: R1_8, r2: R2_8, a0: A_0, gbw: gbw_8, polo2: f_2 }
      lectura: { valor: so_8, rotulo: "Sobreoscilación" }
      grafica:
        x: { id: t, min: 0.0000495, max: 0.000052, unidad: s, rotulo: "t" }
        y: { min: -1.4, max: 1.4, unidad: V, rotulo: "v_{o}" }
        curvas:
          - { expr: "G0_8*(e_8 + a_8) - 2*a_8*G0_8*ceil((t - t0_8)/1e9)*(1 - exp(-z_8*wn_8*max(0, t - t0_8))*(cos(wd_8*max(0, t - t0_8)) + z_8*wn_8/wd_8*sin(wd_8*max(0, t - t0_8))))", color: naranja, rotulo: "v_{o}", mide: salida }
      mandos:
        - { valor: G_8, lista: [1, 2], rotulo: "Ganancia del montaje" }
    objetivo:
      condiciones:
        - { valor: so_8, max: 5, rotulo: "Sobreoscilación: {{so_8}}" }
      logrado: "Con ganancia {{G_8}}, {{so_8}} de sobreoscilación: un poco menos de realimentación y el timbre desaparece."
      pistas:
        - { texto: "El seguidor timbra: pruebe con ganancia 2." }
    escalera:
      - "Más ganancia del montaje, cruce más bajo, más margen."
    solucion: "Ganancia 2: unos 4 % en lugar de 16 %."
    comprobar:
      - { so_8: 16.3, tol: 0.01 }
      - { con: { G_8: 2 }, so_8: 4.32, tol: 0.01 }

  - id: por-que-seguidor
    tipo: porque
    titulo: "¿Por qué el seguidor?"
    texto: "Cuanta menos ganancia, peor margen. ¿Por qué?"
    libro: [230, 242, 243]
    fijar: { G: 1 }
    widget:
      tipo: grafica
      x: { id: nu, min: 1, max: 100000000, unidad: Hz, rotulo: "f", escala: log }
      y: { min: -40, max: 110, unidad: dB, rotulo: "ganancia" }
      curvas:
        - { expr: "20*log10(A_0/(sqrt(1 + (nu/f_1)^2)*sqrt(1 + (nu/f_2)^2)))", color: azul, rotulo: "lazo abierto" }
        - { expr: "G_db", color: naranja, rotulo: "montaje, 1/β", discontinua: true }
    opciones:
      - texto: "La realimentación es más fuerte: el cruce cae más arriba, donde hay más fase acumulada"
        bien: true
        porque: "En el seguidor el segundo polo ya resta fase en el cruce. Por eso hay operacionales «estables para ganancias ≥ 5»."
      - texto: "Porque el seguidor no tiene resistencias que amortigüen"
        porque: "Las resistencias de la red no amortiguan: fijan β. Lo que importa es la fase en el cruce."
      - texto: "Porque con ganancia 1 el operacional satura"
        porque: "No satura: es un problema de fase a frecuencia alta, no de amplitud."
    escalera:
      - "Cada polo aporta hasta 90°, empezando una década antes de su frecuencia."
    solucion: "Menos ganancia, cruce más alto, más fase: el seguidor es el caso difícil."

  - id: compensacion-interna
    tipo: explorar
    titulo: "El condensador de compensación"
    texto: "Seguidor con el operacional de la tabla. Su condensador interno fija el polo dominante: sitúelo donde el seguidor tenga al menos 45° de margen."
    libro: [237, 245, 246]
    fijar: { G: 1 }
    inicio: { f_1: 1000 }
    widget:
      tipo: grafica
      x: { id: nu, min: 1, max: 100000000, unidad: Hz, rotulo: "f", escala: log }
      y: { min: -40, max: 110, unidad: dB, rotulo: "ganancia" }
      curvas:
        - { expr: "20*log10(A_0/(sqrt(1 + (nu/f_1)^2)*sqrt(1 + (nu/f_2)^2)))", color: azul, rotulo: "lazo abierto" }
        - { expr: "G_db", color: naranja, rotulo: "seguidor, 1/β", discontinua: true }
      lectura: { valor: P_m, rotulo: "Margen de fase" }
      datos:
        - { valor: gbw_d, rotulo: "GBW: {{gbw_d}}" }
      mandos:
        - { valor: f_1, lista: [10, 100, 1000], rotulo: "Polo dominante" }
    objetivo:
      condiciones:
        - { valor: P_m, min: 45, rotulo: "Margen: {{P_m}}" }
      logrado: "Con el polo en {{f_1}}, la ganancia cae por debajo de 1 antes de que el segundo polo aporte fase. El precio: GBW de solo {{gbw_d}}."
      pistas:
        - { texto: "Aún oscila casi: baje más el polo dominante." }
    escalera:
      - "Un polo más bajo hace caer antes la ganancia: el cruce baja y llega con menos fase."
    solucion: "10 Hz: 52° de margen y GBW de 1 MHz."
    comprobar:
      - { con: { f_1: 1000 }, P_m: 5.73, gbw_d: 100000000, tol: 0.01 }
      - { con: { f_1: 10 }, P_m: 51.8, gbw_d: 1000000, tol: 0.01 }

  - id: explore-escalon
    tipo: explorar
    titulo: "El margen se ve en el escalón"
    texto: "Respuesta a un escalón según el margen de fase. Busque el margen que da un sobreimpulso de alrededor del 23 %."
    nota: "Tiempo en unidades de 1/ω₀."
    libro: [236, 237, 254]
    inicio: { z: 0.9 }
    widget:
      tipo: grafica
      x: { id: wt, min: 0, max: 15, unidad: "", rotulo: "ω₀t" }
      y: { min: 0, max: 1.8, unidad: "", rotulo: "salida" }
      curvas:
        - { expr: "1 - exp(-z*wt)*(cos(sqrt(1 - z^2)*wt) + z/sqrt(1 - z^2)*sin(sqrt(1 - z^2)*wt))", color: naranja, rotulo: "salida" }
        - { expr: "1", color: tinta, rotulo: "valor final", discontinua: true }
      lectura: { valor: O_s, rotulo: "Sobreimpulso" }
      mandos:
        - { valor: z, lista: [0.9, 0.7, 0.42, 0.2], nombres: ["más de 70°", "unos 65°", "45°", "menos de 30°"], rotulo: "Margen de fase" }
    objetivo:
      condiciones:
        - { valor: O_s, min: 20, max: 26, rotulo: "Sobreimpulso: {{O_s}}" }
      logrado: "Un {{O_s}} de sobreimpulso: unos 45°, el borde del compromiso recomendado, de 45 a 60°. Por encima de 70°, estable pero lento."
      pistas:
        - { cuando: { valor: O_s, min: 26 }, texto: "Demasiado timbre: más margen." }
        - { texto: "Respuesta demasiado tranquila: menos margen." }
    escalera:
      - "Con 45° el amortiguamiento baja a unos 0,42."
    solucion: "45°: un 23 % de sobreimpulso."
    comprobar:
      - { con: { z: 0.42 }, O_s: 23, tol: 0.02 }

  - id: empareje-enemigos
    tipo: tocar
    fase: "Elija"
    titulo: "Los enemigos del margen"
    texto: "Toque, por este orden, el polo que se pone a propósito, la causa más frecuente de oscilación y la peor combinación de todas."
    libro: [248, 249, 250, 251, 262, 264, 267]
    widget:
      tipo: figura
      figura: fig-27.14
      zonas:
        - { id: dominante, rect: [268, 21, 175, 42], rotulo: "Primer recuadro" }
        - { id: carga, rect: [268, 67, 175, 40], rotulo: "Segundo recuadro" }
        - { id: filtros, rect: [268, 114, 175, 39], rotulo: "Tercer recuadro" }
        - { id: retardos, rect: [268, 159, 175, 42], rotulo: "Cuarto recuadro" }
    tocar:
      bien: [dominante, carga, retardos]
      orden: true
      porque:
        filtros: "Los filtros del lazo también restan fase, pero ni se ponen a propósito para estabilizar ni son lo más frecuente."
    exito: "Remedios: contra la carga, una resistencia de aislamiento de decenas de ohmios; contra la capacidad de entrada, un condensador pequeño en paralelo con la realimentación."
    pistas:
      - { texto: "El retardo puro añade fase sin reducir ganancia." }
    escalera:
      - "Un cable largo, un piezo o un convertidor en la salida: carga capacitiva."
    solucion: "Polo dominante, carga capacitiva y retardos puros."

  - id: estime-polo
    tipo: simular
    fase: "Estime"
    titulo: "El polo de la entrada"
    texto: "1 MΩ de realimentación y 10 pF en el nodo inversor. ¿Dónde cae el polo que forman?"
    libro: [250, "cap27#305"]
    simular:
      objetivo: f_x
      unidad: Hz
      tol: 0.03
      rotulo: "Frecuencia del polo"
      errores:
        - { expr: "1/(R_x*C_x)", texto: "Falta el 2π: f = 1/(2π · R · C)." }
    exito: "Unos 16 kHz: con resistencias altas, el polo cae donde importa. El remedio, un condensador en paralelo con R_{f}."
    escalera:
      - "f = 1/(2π · R · C)."
    solucion: "1/(2π · 1 MΩ · 10 pF) ≈ 16 kHz."
    comprobar:
      - { f_x: 15915 }

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [231, 236, 243, 246, 254, 266]
    ideas:
      - { titulo: "Retardo es fase.", texto: "Con −180° y ganancia de lazo mayor que 1, oscila." }
      - { titulo: "Margen.", texto: "De 45 a 60°; se lee en el sobreimpulso del escalón." }
      - { titulo: "El seguidor.", texto: "Menos ganancia, peor margen: es el caso difícil." }
      - { titulo: "Enemigos.", texto: "Carga capacitiva, capacidad de entrada y retardos. Con 1 nF a la salida, si el escalón pasa a oscilar, el margen era escaso." }
