# Lección 1.2 de la sección 26.6 «Realimentación Positiva: Comparadores e Histéresis» (cap27; sec-27.6).
# Formato: contenido/lecciones11/GUIA.md. El disparador del ejercicio 26.6 en el esquema «comparador-schmitt»: salida de
# 0 a 5 V (vsat 5, vsatneg 0), señal por la entrada −, 10 kΩ de la + a la referencia de 2,5 V y 100 kΩ de la + a la
# salida (en el ejercicio, R₂ y R₁): umbrales 2,27 y 2,73 V, ventana de 0,45 V. La triangular lenta (de 2 a 3 V a
# 100 Hz) es la del banco del bloque 190, con valores de ejemplo; «sin R₂» es R₂ = 1 GΩ.
# La ganancia con realimentación positiva, A/(1 − A·β), se dibuja normalizada a A frente a A·β (bloque 182).
leccion: cap27/sec-27.6

libro:
  182: "el denominador se convierte en (1 − A·β)"
  183: "Lo peligroso es la realimentación positiva involuntaria"
  186: "convierte una transición ruidosa en un flanco limpio"
  187: "ganancia de lazo igual a uno y desfase de 360°"
  188: "sino en si se pretendía"
  190: "La traza dibuja un rectángulo cuya anchura es la separación entre los dos umbrales"
  "cap27#230": "la resta se convierte en suma"
  "cap27#434": "Con una referencia de 2,5 V, los umbrales quedan en 2,27 V y 2,73 V"

modelo:
  valores:
    T_l: { sim: "A · β", nombre: "ganancia de lazo", unidad: "", valor: 0.5 }
    V_i: { sim: "v_{in}", nombre: "tensión de entrada", unidad: V, valor: 2 }
    R_1: { sim: "R₁", nombre: "de la entrada + a la referencia", unidad: Ω, valor: 10000 }
    R_2: { sim: "R₂", nombre: "de la entrada + a la salida", unidad: Ω, valor: 100000 }
    V_r: { sim: "V_{ref}", nombre: "referencia", unidad: V, valor: 2.5 }
    V_s: { sim: "V_{alta}", nombre: "salida alta", unidad: V, valor: 5 }
    V_b: { sim: "V_{baja}", nombre: "salida baja", unidad: V, valor: 0 }
    alto: { tipo: interruptor, nombre: "salida en alto antes", valor: 1 }
    A_t: { sim: "A", nombre: "amplitud de la triangular", unidad: V, valor: 0.5 }
    f_t: { sim: "f", nombre: "frecuencia de la triangular", unidad: Hz, valor: 100 }
    forma: { sim: "forma", nombre: "forma de onda (2, triangular)", unidad: "", valor: 2 }
  calculos:
    G_p: { expr: "1/(1 - T_l)", sim: "A_{f}/A", nombre: "ganancia frente a la del amplificador", unidad: "", cifras: 3 }
    V_hi: { expr: "(V_r*R_2 + V_s*R_1)/(R_1 + R_2)", sim: "V_{TH}", nombre: "umbral al subir", unidad: V, cifras: 3 }
    V_lo: { expr: "(V_r*R_2 + V_b*R_1)/(R_1 + R_2)", sim: "V_{TL}", nombre: "umbral al bajar", unidad: V, cifras: 3 }
    V_w: { expr: "V_hi - V_lo", sim: "ΔV", nombre: "anchura de la ventana", unidad: V }
    hi: { expr: "1 - ceil((V_i - V_hi)/1e9)", sim: "a", nombre: "el alto se sostiene", unidad: "" }
    lo: { expr: "ceil((V_i - V_lo)/1e9)", sim: "b", nombre: "el bajo se sostiene", unidad: "" }
    V_o: { expr: "V_b + (V_s - V_b)*(alto*hi + (1 - alto)*(1 - lo))", sim: "v_{o}", nombre: "tensión de salida", unidad: V }
    V_p: { expr: "(V_r*R_2 + V_o*R_1)/(R_1 + R_2)", sim: "v_{+}", nombre: "tensión de la entrada +", unidad: V, cifras: 3 }
    T_t: { expr: "1/f_t", sim: "T", nombre: "periodo", unidad: s }
    t_1: { expr: "(V_hi - (V_r - A_t))*T_t/(4*A_t)", sim: "t₁", nombre: "cruce al subir", unidad: s }
    t_2: { expr: "T_t/2 + (V_r + A_t - V_lo)*T_t/(4*A_t)", sim: "t₂", nombre: "cruce al bajar", unidad: s }
    V_mal: { expr: "V_s*R_1/R_2", sim: "ΔV", nombre: "con R₁/R₂", unidad: V }

tarjetas:
  - id: explore-signo
    tipo: explorar
    titulo: "El otro signo"
    texto: "Si lo devuelto suma, la ganancia es A/(1 − A · β). Acerque la ganancia de lazo a uno."
    libro: [182]
    widget:
      tipo: grafica
      x: { id: ab, min: 0, max: 0.98, unidad: "", rotulo: "A · β" }
      y: { min: 1, max: 100, unidad: "", rotulo: "A_{f}/A", escala: log }
      curvas:
        - { expr: "1/(1 - ab)", color: naranja, rotulo: "A_{f}/A" }
      marcas:
        - { x: "T_l", y: "G_p", rotulo: "×{{G_p}}" }
      lectura: { valor: G_p, rotulo: "La ganancia crece por" }
      mandos:
        - { valor: T_l, min: 0, max: 0.98, paso: 0.02, rotulo: "Ganancia de lazo, A · β" }
    requiere: { mover: [T_l] }

  - id: explore-schmitt
    tipo: explorar
    titulo: "Dos umbrales"
    texto: "Salida de 0 a 5 V, referencia de 2,5 V. Suba la entrada y bájela: conmuta en sitios distintos."
    libro: [186]
    inicio: { V_i: 2, alto: 1 }
    widget:
      tipo: circuito
      esquema: comparador-schmitt
      piezas: { entrada: V_i, r1: R_1, r2: R_2, ref: V_r, vsat: V_s, vsatneg: V_b, alto: alto }
      lectura: { valor: V_o, rotulo: "v_{o}" }
      datos:
        - { valor: V_p, rotulo: "Entrada +: {{V_p}}" }
      mide: { vo: V_o, vmas: V_p }
      mandos:
        - { valor: V_i, min: 2, max: 3, paso: 0.1, rotulo: "Entrada" }
        - { valor: alto, tipo: interruptor, rotulo: "Salida en alto antes" }
    requiere: { mover: [V_i, alto] }

  - id: prediga-ventana
    tipo: predecir
    titulo: "La anchura de la histéresis"
    texto: "Salida de 0 a 5 V, 100 kΩ de la salida a la entrada + y 10 kΩ de ahí a la referencia. ¿Qué anchura tiene la ventana?"
    libro: ["cap27#434"]
    fijar: { V_i: 2.5, alto: 1 }
    widget:
      tipo: circuito
      esquema: comparador-schmitt
      piezas: { entrada: V_i, r1: R_1, r2: R_2, ref: V_r, vsat: V_s, vsatneg: V_b, alto: alto }
      lectura: { valor: V_w, rotulo: "Anchura de la ventana" }
      mide: { vo: V_o, vmas: V_p }
      ocultar: true
    opciones:
      - texto: "Unos 0,45 V: de 2,27 a 2,73 V"
        bien: true
        porque: "Al conmutar, la entrada + se mueve 5 V · 10/110: esa es la separación entre los umbrales."
      - texto: "0,5 V"
        porque: "Sería 5 · 10/100. El divisor es 10/(10 + 100)."
      - texto: "Ninguna: la referencia es fija"
        porque: "La referencia lo es, pero la entrada + recibe también parte de la salida."
    escalera:
      - "ΔV = ΔV_{salida} · R/(R + R_{realimentación})."
    solucion: "5 · 10/110 ≈ 0,45 V: umbrales en 2,27 y 2,73 V."
    comprobar:
      - { V_w: 0.4545, V_hi: 2.727, V_lo: 2.273, V_mal: 0.5, tol: 0.005 }

  - id: explore-triangular
    tipo: explorar
    titulo: "Una triangular lenta"
    texto: "Una triangular entra por la −. Mire dónde conmuta la salida al subir y al bajar, y cómo salta la entrada +."
    nota: "Triangular de ejemplo, de 2 a 3 V."
    libro: [186, 190]
    widget:
      tipo: circuito
      esquema: comparador-schmitt
      piezas: { entrada: V_r, amplitud: A_t, f: f_t, forma: forma, r1: R_1, r2: R_2, ref: V_r, vsat: V_s, vsatneg: V_b, alto: alto }
      lectura: { valor: V_w, rotulo: "Anchura de la ventana" }
      grafica:
        x: { id: t, min: 0, max: 0.02, unidad: s, rotulo: "t" }
        y: { min: -0.5, max: 5.5, unidad: V, rotulo: "v" }
        curvas:
          - { expr: "V_r - A_t + 4*A_t/T_t*(T_t/2 - abs(t - T_t*floor(t/T_t) - T_t/2))", color: tinta, rotulo: "v_{in}", mide: entrada, discontinua: true }
          - { expr: "V_s*(1 - ceil((t - T_t*floor(t/T_t) - t_1)/1e9)*(1 - ceil((t - T_t*floor(t/T_t) - t_2)/1e9)))", color: naranja, rotulo: "v_{o}", mide: salida }
          - { expr: "(V_r*R_2 + R_1*V_s*(1 - ceil((t - T_t*floor(t/T_t) - t_1)/1e9)*(1 - ceil((t - T_t*floor(t/T_t) - t_2)/1e9))))/(R_1 + R_2)", color: azul, rotulo: "v_{+}", mide: umbral }
      mandos:
        - { valor: A_t, lista: [0.4, 0.5], rotulo: "Amplitud de la triangular" }
    requiere: { mover: [A_t] }
    comprobar:
      - { V_r: 2.5, A_t: 0.5 }

  - id: sorpresa-sin-r2
    tipo: sorpresa
    titulo: "Sin la realimentación positiva"
    texto: "Quite R₂: los dos umbrales se juntan en la referencia."
    libro: [186, 190]
    inicio: { R_2: 100000 }
    widget:
      tipo: circuito
      esquema: comparador-schmitt
      piezas: { entrada: V_r, amplitud: A_t, f: f_t, forma: forma, r1: R_1, r2: R_2, ref: V_r, vsat: V_s, vsatneg: V_b, alto: alto }
      lectura: { valor: V_w, rotulo: "Anchura de la ventana" }
      grafica:
        x: { id: t, min: 0, max: 0.02, unidad: s, rotulo: "t" }
        y: { min: -0.5, max: 5.5, unidad: V, rotulo: "v" }
        curvas:
          - { expr: "V_r - A_t + 4*A_t/T_t*(T_t/2 - abs(t - T_t*floor(t/T_t) - T_t/2))", color: tinta, rotulo: "v_{in}", mide: entrada, discontinua: true }
          - { expr: "V_s*(1 - ceil((t - T_t*floor(t/T_t) - t_1)/1e9)*(1 - ceil((t - T_t*floor(t/T_t) - t_2)/1e9)))", color: naranja, rotulo: "v_{o}", mide: salida }
          - { expr: "(V_r*R_2 + R_1*V_s*(1 - ceil((t - T_t*floor(t/T_t) - t_1)/1e9)*(1 - ceil((t - T_t*floor(t/T_t) - t_2)/1e9))))/(R_1 + R_2)", color: azul, rotulo: "v_{+}", mide: umbral }
      mandos:
        - { valor: R_2, lista: [100000, 1000000000], nombres: ["con R₂", "sin R₂"], rotulo: "Realimentación positiva" }
    requiere: { mover: [R_2] }

  - id: por-que-histeresis
    tipo: porque
    titulo: "¿Para qué dos umbrales?"
    texto: "Sin R₂ la ventana se cierra en una línea. ¿Qué se pierde?"
    libro: [186, 190]
    fijar: { R_2: 1000000000 }
    widget:
      tipo: circuito
      esquema: comparador-schmitt
      piezas: { entrada: V_i, r1: R_1, r2: R_2, ref: V_r, vsat: V_s, vsatneg: V_b, alto: alto }
      lectura: { valor: V_w, rotulo: "Anchura de la ventana" }
      mide: { vo: V_o, vmas: V_p }
    opciones:
      - texto: "En un cruce lento con ruido, la salida da ráfagas de conmutaciones"
        bien: true
        porque: "Con un solo umbral el ruido lo cruza una y otra vez. Con histéresis, tras conmutar hace falta un cambio real para volver."
      - texto: "Nada: un umbral es más exacto"
        porque: "Es más exacto solo si la señal no tiene ruido, y toda señal real lo tiene."
      - texto: "La salida deja de llegar a 5 V"
        porque: "Sigue llegando: la realimentación positiva no cambia los niveles de salida, sino los umbrales."
    escalera:
      - "¿Qué hace el ruido cuando la señal pasa despacio por un único umbral?"
    solucion: "Las ráfagas de conmutaciones en los cruces lentos: la histéresis las evita."

  - id: barkhausen
    tipo: pregunta
    titulo: "Para oscilar"
    texto: "Un oscilador es realimentación positiva buscada. ¿Qué condición debe cumplir el lazo?"
    libro: [187, "cap27#230"]
    widget:
      tipo: grafica
      x: { id: ab, min: 0, max: 0.98, unidad: "", rotulo: "A · β" }
      y: { min: 1, max: 100, unidad: "", rotulo: "A_{f}/A", escala: log }
      curvas:
        - { expr: "1/(1 - ab)", color: naranja, rotulo: "A_{f}/A" }
    opciones:
      - texto: "Ganancia de lazo igual a uno y desfase de 360°"
        bien: true
        porque: "Es la condición de Barkhausen: la señal vuelve igual y en fase, y se mantiene sola."
      - texto: "Ganancia de lazo muy pequeña"
        porque: "Con poca ganancia de lazo la señal se apaga en cada vuelta."
      - texto: "Desfase de 180°"
        porque: "Un desfase de 180° convierte la suma en resta: realimentación negativa."
    escalera:
      - "Cuando A · β llega a uno, el denominador se anula."
    solucion: "A · β = 1 con 360° de desfase: Barkhausen."

  - id: oscilador-o-inestable
    tipo: pregunta
    titulo: "Oscilador o amplificador inestable"
    texto: "Dos circuitos oscilan igual: uno es un oscilador y otro un amplificador inestable. ¿Qué los distingue?"
    libro: [183, 188]
    widget:
      tipo: grafica
      x: { id: ab, min: 0, max: 0.98, unidad: "", rotulo: "A · β" }
      y: { min: 1, max: 100, unidad: "", rotulo: "A_{f}/A", escala: log }
      curvas:
        - { expr: "1/(1 - ab)", color: naranja, rotulo: "A_{f}/A" }
    opciones:
      - texto: "Si se pretendía"
        bien: true
        porque: "El circuito puede ser el mismo. Lo peligroso es la realimentación positiva involuntaria, la de los retardos."
      - texto: "El número de componentes"
        porque: "Uno inestable puede ser idéntico a un oscilador: la diferencia no está en el circuito."
      - texto: "Que el oscilador usa realimentación negativa"
        porque: "Los dos oscilan porque la realimentación, a esa frecuencia, suma."
    escalera:
      - "¿La diferencia está en el circuito o en la intención?"
    solucion: "Si se pretendía: en el circuito pueden ser iguales."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [182, 186, 187, 188]
    ideas:
      - { titulo: "1 − A · β.", texto: "Si lo devuelto suma, todo se invierte; con A · β = 1 no hay equilibrio." }
      - { titulo: "Histéresis.", texto: "Dos umbrales: una transición ruidosa se vuelve un flanco limpio." }
      - { titulo: "Oscilación.", texto: "Barkhausen: ganancia de lazo uno y 360°; la diferencia con un inestable es la intención." }
