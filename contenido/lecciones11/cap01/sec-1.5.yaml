# Lección 1.1 de la sección 1.5 «Teoremas de Análisis de Circuitos» (cap01). Formato: contenido/lecciones11/GUIA.md.
# La sección no tiene bloques «ec»: no hay tarjeta de fórmula.
leccion: cap01/sec-1.5

libro:
  109: "son atajos deducidos de Kirchhoff"
  110: "Todos ellos exigen que el circuito sea lineal"
  112: "el efecto total es la suma de los efectos de cada fuente actuando sola"
  113: "la primera sola aporta 4,80 V a la carga y la segunda 2,40 V, luego la tensión total es 7,20 V"
  114: "no vale para potencias, porque la potencia va con el cuadrado de la corriente"
  116: "Cualquier red lineal de dos terminales equivale"
  117: "RTh es la resistencia vista desde los terminales con las fuentes anuladas."
  118: "Con una fuente de 12 V, 4 Ω en serie y 6 Ω a la salida"
  121: "que es la corriente que circularía si se cortocircuitaran los terminales (3 A en el ejemplo)"
  122: "desde fuera son indistinguibles"
  124: "la carga óptima es 2,4 Ω y la potencia máxima 5,4 W"
  125: "en ese punto el rendimiento es del 50 %"

modelo:
  valores:
    V_k1: { sim: "V₁", nombre: "fuente de la izquierda", unidad: V, valor: 12 }
    V_k2: { sim: "V₂", nombre: "fuente de la derecha", unidad: V, valor: 6 }
    R_k1: { sim: "R₁", nombre: "resistencia de la izquierda", unidad: Ω, valor: 1000 }
    R_k2: { sim: "R₂", nombre: "resistencia de la derecha", unidad: Ω, valor: 1000 }
    R_k3: { sim: "R₃", nombre: "carga común", unidad: Ω, valor: 2000 }
    k_on1: { tipo: interruptor, nombre: "fuente de la izquierda encendida", valor: 1 }
    k_on2: { tipo: interruptor, nombre: "fuente de la derecha encendida", valor: 1 }
    V_d: { sim: "V", nombre: "tensión de la fuente de la red", unidad: V, valor: 12 }
    R_d1: { sim: "R₁", nombre: "resistencia en serie de la red", unidad: Ω, valor: 4 }
    R_d2: { sim: "R₂", nombre: "resistencia a la salida de la red", unidad: Ω, valor: 6 }
    R_L: { sim: "R_{L}", nombre: "carga", unidad: Ω, valor: 6 }
    t_on: { tipo: interruptor, nombre: "carga conectada", valor: 0 }
    I_n: { sim: "I_{N}", nombre: "corriente de Norton", unidad: A, valor: 1 }
    n_on: { tipo: interruptor, nombre: "carga conectada al Norton", valor: 0 }
  calculos:
    E_k1: { expr: "V_k1*k_on1", sim: "E₁", nombre: "fuente izquierda efectiva", unidad: V }
    E_k2: { expr: "V_k2*k_on2", sim: "E₂", nombre: "fuente derecha efectiva", unidad: V }
    V_kn: { expr: "(E_k1/R_k1 + E_k2/R_k2)/(1/R_k1 + 1/R_k2 + 1/R_k3)", sim: "V_{carga}", nombre: "tensión de la carga", unidad: V }
    I_k1: { expr: "(E_k1 - V_kn)/R_k1", sim: "I₁", nombre: "corriente de la izquierda", unidad: A }
    I_k2: { expr: "(E_k2 - V_kn)/R_k2", sim: "I₂", nombre: "corriente de la derecha", unidad: A }
    I_k3: { expr: "V_kn/R_k3", sim: "I₃", nombre: "corriente por la carga", unidad: A }
    P_k: { expr: "V_kn^2/R_k3", sim: "P", nombre: "potencia en la carga", unidad: W }
    V_d0: { expr: "V_d*R_d2/(R_d1 + R_d2)", sim: "V_{Th}", nombre: "tensión de Thévenin", unidad: V }
    I_d: { expr: "V_d/(R_d1 + R_d2)", sim: "I", nombre: "corriente de la red en vacío", unidad: A }
    V_d1: { expr: "V_d - V_d0", sim: "V₁", nombre: "caída en la resistencia en serie", unidad: V }
    R_th: { expr: "par(R_d1, R_d2)", sim: "R_{Th}", nombre: "resistencia de Thévenin", unidad: Ω }
    V_to: { si: t_on, entonces: "V_d0*R_L/(R_th + R_L)", sino: "V_d0", sim: "V_{bornes}", nombre: "tensión en bornes del equivalente", unidad: V }
    I_t: { si: t_on, entonces: "V_d0/(R_th + R_L)", sino: "0", sim: "I", nombre: "corriente por la carga", unidad: A }
    V_ti: { expr: "I_t*R_th", sim: "V_{Th} − V", nombre: "caída en R_Th", unidad: V }
    V_red: { si: t_on, entonces: "V_d*par(R_d2, R_L)/(R_d1 + par(R_d2, R_L))", sino: "V_d0", sim: "V_{red}", nombre: "tensión en bornes de la red original", unidad: V }
    V_no: { si: n_on, entonces: "I_n*par(R_th, R_L)", sino: "I_n*R_th", sim: "V", nombre: "tensión en bornes del Norton", unidad: V }
    I_nl: { si: n_on, entonces: "V_no/R_L", sino: "0", sim: "I_{L}", nombre: "corriente por la carga", unidad: A }
    I_nr: { expr: "V_no/R_th", sim: "I_{R}", nombre: "corriente por R_Th", unidad: A }
    P_L: { expr: "V_d0^2*R_L/(R_th + R_L)^2", sim: "P_{L}", nombre: "potencia en la carga", unidad: W }
    eta: { expr: "R_L/(R_th + R_L)*100", sim: "η", nombre: "rendimiento", unidad: "%" }
    I_cc: { expr: "V_d0/R_th", sim: "I_{N}", nombre: "corriente de cortocircuito", unidad: A }

tarjetas:
  - id: explore-superposicion
    tipo: explorar
    titulo: "Una fuente cada vez"
    texto: "Dos fuentes alimentan una carga común. Apague una y luego la otra: anote lo que aporta cada una a la carga."
    libro: [112]
    fijar: { R_k3: 2000 }
    widget:
      tipo: circuito
      esquema: kirchhoff
      piezas: { fuente1: V_k1, fuente2: V_k2, r1: R_k1, r2: R_k2, r3: R_k3, activa1: k_on1, activa2: k_on2 }
      lectura: { valor: V_kn, rotulo: "Tensión de la carga" }
      corriente: I_k3
      mide: { nodo: V_kn, i1: I_k1, i2: I_k2, i3: I_k3 }
      mandos:
        - { valor: k_on1, tipo: interruptor, rotulo: "Fuente de 12 V" }
        - { valor: k_on2, tipo: interruptor, rotulo: "Fuente de 6 V" }
    requiere: { mover: [k_on1, k_on2] }

  - id: prediga-suma
    tipo: predecir
    titulo: "Prediga"
    texto: "Sola, la de 12 V da 4,80 V a la carga; sola, la de 6 V, 2,40 V. ¿Y las dos a la vez?"
    libro: [113]
    fijar: { k_on1: 1, k_on2: 1, R_k3: 2000 }
    widget:
      tipo: circuito
      esquema: kirchhoff
      piezas: { fuente1: V_k1, fuente2: V_k2, r1: R_k1, r2: R_k2, r3: R_k3, activa1: k_on1, activa2: k_on2 }
      lectura: { valor: V_kn, rotulo: "Tensión de la carga" }
      corriente: I_k3
      mide: { nodo: V_kn, i1: I_k1, i2: I_k2, i3: I_k3 }
      ocultar: true
    opciones:
      - texto: "7,20 V"
        bien: true
        porque: "En un circuito lineal los efectos se suman: 4,80 + 2,40 = 7,20 V."
      - texto: "4,80 V"
        porque: "Esa es la aportación de la de 12 V sola. La de 6 V suma la suya."
      - texto: "2,40 V"
        porque: "Es lo que aporta la de 6 V sola. Con las dos, se suman los efectos."
    comprobar:
      - { V_kn: 7.2 }
      - { con: { k_on2: 0 }, V_kn: 4.8 }
      - { con: { k_on1: 0 }, V_kn: 2.4 }
    escalera:
      - "En un circuito lineal, los efectos de cada fuente se suman."
    solucion: "4,80 + 2,40 = 7,20 V."

  - id: potencias-no
    tipo: sorpresa
    titulo: "Las potencias no se suman"
    texto: "Sola, la de 12 V hace disipar 11,5 mW a la carga; sola, la de 6 V, 2,88 mW. Encienda las dos y mire la potencia."
    libro: [114]
    fijar: { R_k3: 2000 }
    inicio: { k_on1: 1, k_on2: 0 }
    widget:
      tipo: circuito
      esquema: kirchhoff
      piezas: { fuente1: V_k1, fuente2: V_k2, r1: R_k1, r2: R_k2, r3: R_k3, activa1: k_on1, activa2: k_on2 }
      lectura: { valor: P_k, rotulo: "Potencia en la carga" }
      datos:
        - { valor: V_kn, rotulo: "Tensión: {{V_kn}}" }
      corriente: I_k3
      mide: { nodo: V_kn, i1: I_k1, i2: I_k2, i3: I_k3 }
      mandos:
        - { valor: k_on1, tipo: interruptor, rotulo: "Fuente de 12 V" }
        - { valor: k_on2, tipo: interruptor, rotulo: "Fuente de 6 V" }
    requiere: { mover: [k_on2] }
    comprobar:
      - { con: { k_on2: 0 }, P_k: 0.01152 }
      - { con: { k_on1: 0, k_on2: 1 }, P_k: 0.00288 }

  - id: por-que-potencias
    tipo: porque
    titulo: "¿Por qué no?"
    texto: "Las dos juntas dan 25,9 mW, no 11,5 + 2,88. ¿Por qué falla la superposición con las potencias?"
    libro: [114]
    fijar: { k_on1: 1, k_on2: 1, R_k3: 2000 }
    opciones:
      - texto: "La potencia va con el cuadrado de la corriente"
        bien: true
        porque: "El cuadrado de una suma no es la suma de los cuadrados. Se suman las corrientes y luego se calcula la potencia."
      - texto: "Porque las fuentes son de tensiones distintas"
        porque: "Con fuentes iguales pasaría lo mismo. Lo que falla es que la potencia no es lineal."
      - texto: "Porque una fuente apagada sigue consumiendo"
        porque: "Anulada es un cortocircuito y no consume. El problema es el cuadrado."
    comprobar:
      - { P_k: 0.02592 }
      - { con: { k_on2: 0 }, P_k: 0.01152 }
      - { con: { k_on1: 0 }, P_k: 0.00288 }
    widget:
      tipo: circuito
      esquema: kirchhoff
      piezas: { fuente1: V_k1, fuente2: V_k2, r1: R_k1, r2: R_k2, r3: R_k3, activa1: k_on1, activa2: k_on2 }
      lectura: { valor: P_k, rotulo: "Potencia en la carga" }
      datos:
        - { valor: V_kn, rotulo: "Tensión: {{V_kn}}" }
      corriente: I_k3
      mide: { nodo: V_kn, i1: I_k1, i2: I_k2, i3: I_k3 }
      mandos: []
    escalera:
      - "Escriba la potencia con la suma de las corrientes: (I₁ + I₂)²·R."
    solucion: "La potencia va con el cuadrado de la corriente, y el cuadrado de una suma no es la suma de los cuadrados."

  - id: prediga-vth
    tipo: predecir
    titulo: "Prediga"
    texto: "Una fuente de 12 V, 4 Ω en serie y 6 Ω a la salida. ¿Cuánto vale V_{Th}, la tensión en vacío entre los terminales?"
    libro: [117, 118]
    fijar: { V_d: 12, R_d1: 4, R_d2: 6 }
    widget:
      tipo: circuito
      esquema: divisor
      piezas: { fuente: V_d, arriba: R_d1, abajo: R_d2 }
      lectura: { valor: V_d0, rotulo: "Tensión en vacío" }
      corriente: I_d
      mide: { salida: V_d0, corriente: I_d }
      ocultar: true
    opciones:
      - texto: "7,2 V"
        bien: true
        porque: "En vacío es un divisor: 12 × 6/10 = 7,2 V."
      - texto: "12 V"
        porque: "Habría 12 V sin la de 4 Ω. Por las dos pasa corriente y la de 4 Ω se queda su parte."
      - texto: "4,8 V"
        porque: "Esos 4,8 V caen en la de 4 Ω. Los terminales están sobre la de 6 Ω."
    comprobar:
      - { V_d0: 7.2, V_d1: 4.8 }
    escalera:
      - "En vacío no sale corriente por los terminales: es un divisor de tensión."
    solucion: "12 × 6/10 = 7,2 V."

  - id: estime-rth
    tipo: pregunta
    fase: "Estime"
    titulo: "La resistencia vista"
    texto: "Una fuente de 12 V con 4 Ω en serie y 6 Ω a la salida. Estime R_{Th}, la resistencia vista desde los terminales con la fuente en cortocircuito."
    libro: [117, 118]
    fijar: { R_d1: 4, R_d2: 6 }
    estimar:
      objetivo: "R_th"
      unidad: Ω
      min: 0
      max: 10
      paso: 0.1
      inicio: 8
      tol: 0.03
      rotulo: "R_{Th}"
    exito: "Con la fuente en cortocircuito, 4 Ω y 6 Ω quedan en paralelo: 4 ‖ 6 = 2,4 Ω."
    pistas:
      - { cuando: { valor: estimacion, mayor: 2.47 }, texto: "Se ha pasado: vistas desde los terminales, las dos quedan en paralelo, menos que la menor." }
      - { texto: "Se ha quedado corto: el paralelo de 4 Ω y 6 Ω no baja tanto." }
    comprobar:
      - { R_th: 2.4 }
    escalera:
      - "Con la fuente en cortocircuito, ¿cómo quedan las de 4 Ω y 6 Ω vistas desde los terminales?"
    solucion: "Con la fuente en cortocircuito, 4 Ω y 6 Ω quedan en paralelo: 4 ‖ 6 = 2,4 Ω."

  - id: explore-equivalente
    tipo: explorar
    titulo: "Desde fuera, iguales"
    texto: "Este es el equivalente: 7,2 V con 2,4 Ω. Conecte cargas y compare sus bornes con los de la red original."
    libro: [116, 122]
    fijar: { V_d: 12, R_d1: 4, R_d2: 6 }
    inicio: { t_on: 0 }
    widget:
      tipo: circuito
      esquema: thevenin
      piezas: { fuente: V_d0, rth: R_th, carga: R_L, interruptor: t_on }
      lectura: { valor: V_to, rotulo: "Bornes del equivalente" }
      datos:
        - { valor: V_red, rotulo: "Red original: {{V_red}}" }
      corriente: I_t
      mide: { salida: V_to, corriente: I_t, interna: V_ti }
      mandos:
        - { valor: t_on, tipo: conectar, boton: "Conectar la carga" }
        - { valor: R_L, lista: [1.2, 2.4, 6, 12, 24], rotulo: "Carga, R_{L}" }
    requiere: { conectar: [t_on] }
    comprobar:
      - { V_d0: 7.2, R_th: 2.4 }

  - id: reto-norton
    tipo: reto
    titulo: "Reto: el equivalente de Norton"
    texto: "Norton usa una fuente de corriente con la misma R_{Th} en paralelo. Ajuste I_{N} para que en vacío dé los mismos 7,2 V."
    libro: [121, 122]
    fijar: { V_d: 12, R_d1: 4, R_d2: 6, n_on: 0 }
    inicio: { I_n: 1 }
    widget:
      tipo: circuito
      esquema: norton
      piezas: { fuente: I_n, rn: R_th, carga: R_L, interruptor: n_on }
      lectura: { valor: V_no, rotulo: "Tensión en vacío" }
      corriente: I_nr
      mide: { salida: V_no, carga: I_nl, paralelo: I_nr }
      mandos:
        - { valor: I_n, min: 0.5, max: 5, paso: 0.25, rotulo: "I_{N}" }
    condiciones:
      - { valor: V_no, objetivo: 7.2, tol: 0.02, rotulo: "En vacío: {{V_no}}" }
    exito: "I_{N} = V_{Th}/R_{Th} = 3 A: la corriente que circularía con los terminales en cortocircuito."
    pistas:
      - { cuando: { valor: V_no, mayor: 7.344 }, texto: "Sobra tensión: baje la corriente de la fuente." }
      - { cuando: { valor: V_no, menor: 7.056 }, texto: "Falta tensión: suba la corriente de la fuente." }
    escalera:
      - "En vacío, toda la corriente de la fuente pasa por R_{Th}."
    solucion: "V = I_{N} · 2,4 Ω: para 7,2 V hacen falta 3 A."
    comprobar:
      - { con: { I_n: 3 }, V_no: 7.2, I_cc: 3 }

  - id: explore-maxima
    tipo: explorar
    titulo: "Potencia en la carga"
    texto: "El equivalente, 7,2 V y 2,4 Ω, alimenta una carga. Arrastre el punto: con poca carga y con mucha, la potencia cae."
    libro: [124]
    fijar: { V_d: 12, R_d1: 4, R_d2: 6 }
    widget:
      tipo: grafica
      x: { id: rl, min: 0, max: 12, unidad: Ω, rotulo: "R_{L}" }
      y: { min: 0, max: 6, unidad: W, rotulo: "P" }
      curvas:
        - { expr: "V_d0^2*rl/(R_th + rl)^2", color: naranja, rotulo: "potencia en la carga" }
      asas:
        - { mueve: R_L, x: "R_L", y: "P_L", rotulo: "Carga" }
      lectura: { valor: P_L, rotulo: "Potencia en la carga" }
      mandos:
        - { valor: R_L, min: 0.4, max: 12, paso: 0.4, rotulo: "Carga, R_{L}" }

  - id: prediga-maxima
    tipo: predecir
    titulo: "Prediga"
    texto: "Una fuente de 12 V con 4 Ω en serie y 6 Ω a la salida alimenta una carga R_{L}. ¿Con qué carga recibe la máxima potencia?"
    libro: [118, 124]
    fijar: { V_d: 12, R_d1: 4, R_d2: 6, R_L: 2.4 }
    widget:
      tipo: grafica
      x: { id: rl, min: 0, max: 12, unidad: Ω, rotulo: "R_{L}" }
      y: { min: 0, max: 6, unidad: W, rotulo: "P" }
      curvas:
        - { expr: "V_d0^2*rl/(R_th + rl)^2", color: naranja, rotulo: "potencia en la carga" }
      lectura: { valor: P_L, rotulo: "Potencia máxima" }
      ocultar: true
    opciones:
      - texto: "Con R_{L} = R_{Th}, 2,4 Ω"
        bien: true
        porque: "La potencia es máxima cuando la carga iguala a R_{Th}: 5,4 W con este equivalente."
      - texto: "En cortocircuito, R_{L} = 0"
        porque: "Ahí la corriente es máxima, pero la tensión en la carga es cero, y la potencia también."
      - texto: "Con la carga más grande posible"
        porque: "Con mucha resistencia apenas pasa corriente: la potencia vuelve a caer."
    comprobar:
      - { P_L: 5.4 }
    escalera:
      - "Con R_{L} = 0 la tensión en la carga es cero; con R_{L} enorme, la corriente."
    solucion: "Con R_{L} = R_{Th}, 2,4 Ω: 5,4 W."

  - id: por-que-rendimiento
    tipo: porque
    titulo: "Su malentendido"
    texto: "Con la carga adaptada, la potencia es máxima. ¿Qué rendimiento tiene la transferencia en el equivalente de Thévenin?"
    libro: [125]
    fijar: { V_d: 12, R_d1: 4, R_d2: 6, R_L: 2.4 }
    widget:
      tipo: grafica
      x: { id: rl, min: 0, max: 12, unidad: Ω, rotulo: "R_{L}" }
      y: { min: 0, max: 100, unidad: "%", rotulo: "η" }
      curvas:
        - { expr: "rl/(R_th + rl)*100", color: azul, rotulo: "rendimiento" }
      lectura: { valor: eta, rotulo: "Rendimiento" }
      ocultar: true
    opciones:
      - texto: "El 50 %: la fuente disipa tanto como entrega"
        bien: true
        porque: "En el equivalente de Thévenin, R_{Th} y la carga son iguales y llevan la misma corriente. Se adapta para información, no para energía."
      - texto: "Todo: por eso se llama máxima"
        porque: "Máxima es la potencia en la carga, no el rendimiento. La mitad se queda en R_{Th}."
      - texto: "Depende de la tensión de la fuente"
        porque: "La tensión cambia la potencia, pero no el reparto: con R_{L} = R_{Th}, mitad y mitad."
    comprobar:
      - { eta: 50 }
    escalera:
      - "Con R_{L} = R_{Th}, ¿cómo se reparte la potencia entre las dos?"
    solucion: "El 50 %: R_{Th} y la carga son iguales y llevan la misma corriente."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [109, 110, 112, 114, 116, 121, 125]
    ideas:
      - { titulo: "Superposición.", texto: "En un circuito lineal, una fuente cada vez y se suman los efectos; nunca las potencias." }
      - { titulo: "Thévenin.", texto: "Cualquier red lineal es V_{Th}, la tensión en vacío, con R_{Th}, la vista con las fuentes anuladas." }
      - { titulo: "Norton.", texto: "La misma red con I_{N} = V_{Th}/R_{Th} y la misma R_{Th} en paralelo." }
      - { titulo: "Máxima transferencia.", texto: "Con R_{L} = R_{Th}, y con un rendimiento del 50 %: para información, no para energía." }
