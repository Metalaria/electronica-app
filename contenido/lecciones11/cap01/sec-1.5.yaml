# Lección de la sección 1.5 «Teoremas de Análisis de Circuitos» (cap01). Formato: contenido/lecciones11/GUIA.md.
# 1.2.1 (piloto121, «aprender haciendo», GUIA §13): casi todo se responde haciendo sobre el circuito vivo — apagar
# fuentes hasta un objetivo, medir con el multímetro (tensión entre dos nodos, corriente abriendo una rama), escribir
# la predicción y ver el simulador, ajustar la R_Th del equivalente hasta que coincida con la red, marcar el máximo de
# potencia en la curva — y solo el «por qué» de las potencias se elige entre opciones. La sección no tiene bloques
# «ec»: no hay tarjeta de fórmula.
leccion: cap01/sec-1.5

libro:
  109: "son atajos deducidos de Kirchhoff"
  110: "Todos ellos exigen que el circuito sea lineal"
  112: "el efecto total es la suma de los efectos de cada fuente actuando sola"
  113: "la primera sola aporta 4,80 V a la carga y la segunda 2,40 V, luego la tensión total es 7,20 V"
  114: "no vale para potencias, porque la potencia va con el cuadrado de la corriente"
  116: "Cualquier red lineal de dos terminales equivale"
  117: "RTh es la resistencia vista desde los terminales con las fuentes anuladas."
  118: "Con una fuente de 12 V, 4 Ω en serie y 6 Ω a la salida"
  121: "que es la corriente que circularía si se cortocircuitaran los terminales (3 A en el ejemplo)"
  122: "desde fuera son indistinguibles"
  124: "la carga óptima es 2,4 Ω y la potencia máxima 5,4 W"
  125: "en ese punto el rendimiento es del 50 %"

modelo:
  valores:
    V_k1: { sim: "V₁", nombre: "fuente de la izquierda", unidad: V, valor: 12 }
    V_k2: { sim: "V₂", nombre: "fuente de la derecha", unidad: V, valor: 6 }
    R_k1: { sim: "R₁", nombre: "resistencia de la izquierda", unidad: Ω, valor: 1000 }
    R_k2: { sim: "R₂", nombre: "resistencia de la derecha", unidad: Ω, valor: 1000 }
    R_k3: { sim: "R₃", nombre: "carga común", unidad: Ω, valor: 2000 }
    k_on1: { tipo: interruptor, nombre: "fuente de la izquierda encendida", valor: 1 }
    k_on2: { tipo: interruptor, nombre: "fuente de la derecha encendida", valor: 1 }
    V_d: { sim: "V", nombre: "tensión de la fuente de la red", unidad: V, valor: 12 }
    R_d1: { sim: "R₁", nombre: "resistencia en serie de la red", unidad: Ω, valor: 4 }
    R_d2: { sim: "R₂", nombre: "resistencia a la salida de la red", unidad: Ω, valor: 6 }
    R_L: { sim: "R_{L}", nombre: "carga", unidad: Ω, valor: 6 }
    t_on: { tipo: interruptor, nombre: "carga conectada", valor: 0 }
    R_tv: { sim: "R_{Th}", nombre: "resistencia del equivalente", unidad: Ω, valor: 4 }
    I_n: { sim: "I_{N}", nombre: "corriente de Norton", unidad: A, valor: 1 }
    n_on: { tipo: interruptor, nombre: "carga conectada al Norton", valor: 0 }
  calculos:
    E_k1: { expr: "V_k1*k_on1", sim: "E₁", nombre: "fuente izquierda efectiva", unidad: V }
    E_k2: { expr: "V_k2*k_on2", sim: "E₂", nombre: "fuente derecha efectiva", unidad: V }
    V_kn: { expr: "(E_k1/R_k1 + E_k2/R_k2)/(1/R_k1 + 1/R_k2 + 1/R_k3)", sim: "V_{carga}", nombre: "tensión de la carga", unidad: V }
    I_k1: { expr: "(E_k1 - V_kn)/R_k1", sim: "I₁", nombre: "corriente de la izquierda", unidad: A }
    I_k2: { expr: "(E_k2 - V_kn)/R_k2", sim: "I₂", nombre: "corriente de la derecha", unidad: A }
    I_k3: { expr: "V_kn/R_k3", sim: "I₃", nombre: "corriente por la carga", unidad: A }
    P_k: { expr: "V_kn^2/R_k3", sim: "P", nombre: "potencia en la carga", unidad: W }
    V_a1: { expr: "V_k1*par(R_k2, R_k3)/(R_k1 + par(R_k2, R_k3))", sim: "V_{carga, 1}", nombre: "lo que aporta la fuente de la izquierda sola", unidad: V }
    V_a2: { expr: "V_k2*par(R_k1, R_k3)/(R_k2 + par(R_k1, R_k3))", sim: "V_{carga, 2}", nombre: "lo que aporta la fuente de la derecha sola", unidad: V }
    V_fs: { expr: "V_k1 + V_k2", sim: "V₁ + V₂", nombre: "suma de las dos fuentes", unidad: V }
    V_d0: { expr: "V_d*R_d2/(R_d1 + R_d2)", sim: "V_{Th}", nombre: "tensión de Thévenin", unidad: V }
    I_d: { expr: "V_d/(R_d1 + R_d2)", sim: "I", nombre: "corriente de la red en vacío", unidad: A }
    V_d1: { expr: "V_d - V_d0", sim: "V₁", nombre: "caída en la resistencia en serie", unidad: V }
    R_th: { expr: "par(R_d1, R_d2)", sim: "R_{Th}", nombre: "resistencia de Thévenin", unidad: Ω }
    V_to: { si: t_on, entonces: "V_d0*R_L/(R_th + R_L)", sino: "V_d0", sim: "V_{bornes}", nombre: "tensión en bornes del equivalente", unidad: V }
    I_t: { si: t_on, entonces: "V_d0/(R_th + R_L)", sino: "0", sim: "I", nombre: "corriente por la carga", unidad: A }
    V_ti: { expr: "I_t*R_th", sim: "V_{Th} − V", nombre: "caída en R_Th", unidad: V }
    V_red: { si: t_on, entonces: "V_d*par(R_d2, R_L)/(R_d1 + par(R_d2, R_L))", sino: "V_d0", sim: "V_{red}", nombre: "tensión en bornes de la red original", unidad: V }
    V_tvo: { si: t_on, entonces: "V_d0*R_L/(R_tv + R_L)", sino: "V_d0", sim: "V_{bornes}", nombre: "tensión en bornes del equivalente que ajusta", unidad: V }
    I_tv: { si: t_on, entonces: "V_d0/(R_tv + R_L)", sino: "0", sim: "I", nombre: "corriente del equivalente que ajusta", unidad: A }
    V_tvi: { expr: "I_tv*R_tv", sim: "V_{R}", nombre: "caída en la resistencia del equivalente", unidad: V }
    d_tv: { expr: "V_tvo - V_red", sim: "ΔV", nombre: "diferencia entre el equivalente y la red", unidad: V }
    V_no: { si: n_on, entonces: "I_n*par(R_th, R_L)", sino: "I_n*R_th", sim: "V", nombre: "tensión en bornes del Norton", unidad: V }
    I_nl: { si: n_on, entonces: "V_no/R_L", sino: "0", sim: "I_{L}", nombre: "corriente por la carga", unidad: A }
    I_nr: { expr: "V_no/R_th", sim: "I_{R}", nombre: "corriente por R_Th", unidad: A }
    P_L: { expr: "V_d0^2*R_L/(R_th + R_L)^2", sim: "P_{L}", nombre: "potencia en la carga", unidad: W }
    eta: { expr: "R_L/(R_th + R_L)*100", sim: "η", nombre: "rendimiento", unidad: "%" }
    I_cc: { expr: "V_d0/R_th", sim: "I_{N}", nombre: "corriente de cortocircuito", unidad: A }

tarjetas:
  - id: explore-superposicion
    tipo: explorar
    titulo: "Una fuente cada vez"
    texto: "Apagar una fuente es cambiarla por un cortocircuito. Consiga que la carga reciba solo lo que aporta la fuente de 6 V."
    libro: [112]
    fijar: { R_k3: 2000 }
    inicio: { k_on1: 1, k_on2: 1 }
    widget:
      tipo: circuito
      esquema: kirchhoff
      piezas: { fuente1: V_k1, fuente2: V_k2, r1: R_k1, r2: R_k2, r3: R_k3, activa1: k_on1, activa2: k_on2 }
      lectura: { valor: V_kn, rotulo: "Tensión de la carga" }
      corriente: I_k3
      mide: { nodo: V_kn, i1: I_k1, i2: I_k2, i3: I_k3 }
      mandos:
        - { valor: k_on1, tipo: interruptor, rotulo: "Fuente de 12 V" }
        - { valor: k_on2, tipo: interruptor, rotulo: "Fuente de 6 V" }
    objetivo:
      condiciones:
        - { valor: V_kn, objetivo: 2.4, tol: 0.02, rotulo: "Carga: {{V_kn}}" }
      logrado: "Sola, la de 6 V aporta {{V_kn}} a la carga. La de 12 V, en cortocircuito, ya no aporta nada."
      pistas:
        - { cuando: { valor: V_kn, mayor: 2.45 }, texto: "Todavía llega lo de la fuente de 12 V: apáguela." }
        - { texto: "Así no aporta ninguna: encienda la de 6 V." }
    escalera:
      - "Para quedarse con lo de una fuente, la otra tiene que estar apagada."
    solucion: "Apague la de 12 V y deje encendida la de 6 V: 2,40 V."
    comprobar:
      - { con: { k_on1: 0, k_on2: 1 }, V_kn: 2.4 }

  - id: mida-aporte
    tipo: medir
    titulo: "Mida lo que aporta la otra"
    texto: "Ahora, solo la de 12 V. Ponga las puntas del multímetro donde mediría la tensión de la carga."
    libro: [113]
    fijar: { k_on1: 1, k_on2: 0, R_k3: 2000 }
    widget:
      tipo: circuito
      esquema: kirchhoff
      piezas: { fuente1: V_k1, fuente2: V_k2, r1: R_k1, r2: R_k2, r3: R_k3, activa1: k_on1, activa2: k_on2 }
      corriente: I_k3
      mide: { nodo: V_kn, i1: I_k1, i2: I_k2, i3: I_k3 }
      instrumento:
        tipo: multimetro
        modos: [V]
        puntos: { f1: "Arriba de la fuente de 12 V", n: "Nodo de arriba", f2: "Arriba de la fuente de 6 V", "0": "Masa, abajo" }
      mandos: []
    medir:
      magnitud: tension
      entre: [n, "0"]
      valor: V_kn
      porque:
        f1: "Esa punta está en la fuente de 12 V: mide la fuente, no la carga."
        f2: "Esa punta está en la fuente apagada: un cortocircuito a masa, 0 V."
        "f1/n": "Así mide la caída en R₁. La carga va del nodo de arriba a masa."
    exito: "4,80 V: lo que aporta la de 12 V sola."
    escalera:
      - "Una tensión se mide en paralelo: entre los dos extremos de la carga."
    solucion: "Roja en el nodo de arriba y negra en masa."
    comprobar:
      - { V_kn: 4.8 }

  - id: prediga-suma
    tipo: simular
    titulo: "Prediga y simule"
    texto: "Sola, la de 12 V da 4,80 V a la carga; sola, la de 6 V, 2,40 V. ¿Cuánto tendrá con las dos encendidas?"
    libro: [112, 113]
    fijar: { k_on1: 1, k_on2: 1, R_k3: 2000 }
    widget:
      tipo: circuito
      esquema: kirchhoff
      piezas: { fuente1: V_k1, fuente2: V_k2, r1: R_k1, r2: R_k2, r3: R_k3, activa1: k_on1, activa2: k_on2 }
      lectura: { valor: V_kn, rotulo: "Tensión de la carga" }
      corriente: I_k3
      mide: { nodo: V_kn, i1: I_k1, i2: I_k2, i3: I_k3 }
      ocultar: true
      mandos: []
    simular:
      objetivo: V_kn
      unidad: V
      tol: 0.02
      rotulo: "Tensión de la carga con las dos"
      medida: nodo
      errores:
        - { expr: "V_a1", texto: "Esos 4,80 V son los de la fuente de 12 V sola: la de 6 V suma su aportación." }
        - { expr: "V_a2", texto: "Esos 2,40 V son los de la fuente de 6 V sola: la de 12 V suma la suya." }
        - { expr: "V_fs", texto: "Ha sumado las fuentes. Lo que se suma es lo que cada una aporta a la carga." }
    exito: "4,80 + 2,40 = 7,20 V: en un circuito lineal, los efectos de cada fuente se suman."
    escalera:
      - "En un circuito lineal, los efectos de cada fuente se suman."
    solucion: "4,80 + 2,40 = 7,20 V."
    comprobar:
      - { V_kn: 7.2, V_a1: 4.8, V_a2: 2.4, V_fs: 18 }

  - id: mida-corriente
    tipo: medir
    titulo: "También las corrientes"
    texto: "Con las dos encendidas, la corriente de la carga también es la suma de las dos aportaciones. Abra su rama y mídala."
    libro: [112]
    fijar: { k_on1: 1, k_on2: 1, R_k3: 2000 }
    widget:
      tipo: circuito
      esquema: kirchhoff
      piezas: { fuente1: V_k1, fuente2: V_k2, r1: R_k1, r2: R_k2, r3: R_k3, activa1: k_on1, activa2: k_on2 }
      corriente: I_k3
      mide: { nodo: V_kn, i1: I_k1, i2: I_k2, i3: I_k3 }
      instrumento:
        tipo: multimetro
        puntos: { n: "Nodo de arriba", "0": "Masa, abajo" }
        ramas: { vm1: "Rama de R₁", vm2: "Rama de R₂", vm3: "Rama de la carga" }
      mandos: []
    medir:
      magnitud: corriente
      rama: vm3
      valor: I_k3
      porque:
        vm1: "Esa es la corriente de R₁, la que llega desde la fuente de 12 V."
        vm2: "Esa es la de R₂: con las dos encendidas, sale del nodo hacia la fuente de 6 V."
    exito: "{{I_k3}} = 2,40 + 1,20 mA: cada fuente aporta su corriente a la carga."
    escalera:
      - "Una corriente se mide en serie: pase a amperios y abra la rama de la carga."
    solucion: "El amperímetro en la rama de la carga: 3,60 mA."
    comprobar:
      - { I_k3: 0.0036 }
      - { con: { k_on2: 0 }, I_k3: 0.0024 }
      - { con: { k_on1: 0 }, I_k3: 0.0012 }

  - id: potencias-no
    tipo: sorpresa
    titulo: "Las potencias no se suman"
    texto: "Sola, la de 12 V hace disipar 11,5 mW a la carga; sola, la de 6 V, 2,88 mW. Encienda las dos y mire la potencia."
    libro: [114]
    fijar: { R_k3: 2000 }
    inicio: { k_on1: 1, k_on2: 0 }
    widget:
      tipo: circuito
      esquema: kirchhoff
      piezas: { fuente1: V_k1, fuente2: V_k2, r1: R_k1, r2: R_k2, r3: R_k3, activa1: k_on1, activa2: k_on2 }
      lectura: { valor: P_k, rotulo: "Potencia en la carga" }
      datos:
        - { valor: V_kn, rotulo: "Tensión: {{V_kn}}" }
      corriente: I_k3
      mide: { nodo: V_kn, i1: I_k1, i2: I_k2, i3: I_k3 }
      mandos:
        - { valor: k_on1, tipo: interruptor, rotulo: "Fuente de 12 V" }
        - { valor: k_on2, tipo: interruptor, rotulo: "Fuente de 6 V" }
    objetivo:
      condiciones:
        - { valor: k_on1, min: 1, rotulo: "Fuente de 12 V encendida" }
        - { valor: k_on2, min: 1, rotulo: "Fuente de 6 V encendida" }
      logrado: "{{P_k}}, no 11,5 + 2,88 mW: con las dos, la potencia es mucho más que la suma."
      pistas:
        - { texto: "Deje las dos fuentes encendidas." }
    escalera:
      - "Encienda la fuente que falta."
    solucion: "Las dos encendidas: 25,9 mW."
    comprobar:
      - { con: { k_on2: 1 }, P_k: 0.02592 }
      - { P_k: 0.01152 }
      - { con: { k_on1: 0, k_on2: 1 }, P_k: 0.00288 }

  - id: por-que-potencias
    tipo: porque
    titulo: "¿Por qué no?"
    texto: "Las dos juntas dan 25,9 mW, no 11,5 + 2,88. ¿Por qué falla la superposición con las potencias?"
    libro: [114]
    fijar: { k_on1: 1, k_on2: 1, R_k3: 2000 }
    opciones:
      - texto: "La potencia va con el cuadrado de la corriente"
        bien: true
        porque: "El cuadrado de una suma no es la suma de los cuadrados. Se suman las corrientes y luego se calcula la potencia."
      - texto: "Porque las fuentes son de tensiones distintas"
        porque: "Con fuentes iguales pasaría lo mismo. Lo que falla es que la potencia no es lineal."
      - texto: "Porque una fuente apagada sigue consumiendo"
        porque: "Anulada es un cortocircuito y no consume. El problema es el cuadrado."
    comprobar:
      - { P_k: 0.02592 }
      - { con: { k_on2: 0 }, P_k: 0.01152 }
      - { con: { k_on1: 0 }, P_k: 0.00288 }
    widget:
      tipo: circuito
      esquema: kirchhoff
      piezas: { fuente1: V_k1, fuente2: V_k2, r1: R_k1, r2: R_k2, r3: R_k3, activa1: k_on1, activa2: k_on2 }
      lectura: { valor: P_k, rotulo: "Potencia en la carga" }
      datos:
        - { valor: V_kn, rotulo: "Tensión: {{V_kn}}" }
      corriente: I_k3
      mide: { nodo: V_kn, i1: I_k1, i2: I_k2, i3: I_k3 }
      mandos: []
    escalera:
      - "Escriba la potencia con la suma de las corrientes: (I₁ + I₂)²·R."
    solucion: "La potencia va con el cuadrado de la corriente, y el cuadrado de una suma no es la suma de los cuadrados."

  - id: prediga-vth
    tipo: medir
    titulo: "Mida V_{Th}"
    texto: "Una fuente de 12 V, 4 Ω en serie y 6 Ω a la salida. V_{Th} es la tensión en vacío entre los terminales: mídala."
    libro: [117, 118]
    fijar: { V_d: 12, R_d1: 4, R_d2: 6 }
    widget:
      tipo: circuito
      esquema: divisor
      piezas: { fuente: V_d, arriba: R_d1, abajo: R_d2 }
      corriente: I_d
      mide: { salida: V_d0, corriente: I_d }
      instrumento:
        tipo: multimetro
        modos: [V]
        puntos: { fte: "Positivo de la fuente", salida: "Terminal de salida", "0": "Masa, abajo" }
      mandos: []
    medir:
      magnitud: tension
      entre: [salida, "0"]
      valor: V_d0
      porque:
        fte: "Esa punta está en la fuente: mide sus 12 V enteros."
        "fte/salida": "Así mide la caída en la de 4 Ω, no la tensión entre los terminales."
    exito: "7,2 V: en vacío es un divisor, 12 × 6/10."
    escalera:
      - "Los terminales de salida son los extremos de la de 6 Ω."
    solucion: "Roja en el terminal de salida, negra en masa: 7,2 V."
    comprobar:
      - { V_d0: 7.2, V_d1: 4.8 }

  - id: estime-rth
    tipo: reto
    fase: "Ajuste"
    titulo: "La resistencia del equivalente"
    texto: "El equivalente lleva V_{Th} = 7,2 V. Ajuste su R_{Th} hasta que, con 6 Ω de carga, dé en bornes lo mismo que la red original."
    libro: [116, 117, 118]
    fijar: { V_d: 12, R_d1: 4, R_d2: 6, R_L: 6, t_on: 1 }
    inicio: { R_tv: 4 }
    widget:
      tipo: circuito
      esquema: thevenin
      piezas: { fuente: V_d0, rth: R_tv, carga: R_L, interruptor: t_on }
      lectura: { valor: V_tvo, rotulo: "Bornes del equivalente" }
      datos:
        - { valor: V_red, rotulo: "Red original: {{V_red}}" }
      corriente: I_tv
      mide: { salida: V_tvo, corriente: I_tv, interna: V_tvi }
      mandos:
        - { valor: R_tv, min: 0.4, max: 6, paso: 0.4, rotulo: "R_{Th} del equivalente" }
    condiciones:
      - { valor: d_tv, min: -0.05, max: 0.05, rotulo: "Diferencia: {{d_tv}}" }
    exito: "R_{Th} = 2,4 Ω: 4 ‖ 6, la resistencia vista con la fuente en cortocircuito."
    pistas:
      - { cuando: { valor: d_tv, mayor: 0.05 }, texto: "El equivalente da más que la red: suba su R_{Th}." }
      - { cuando: { valor: d_tv, menor: -0.05 }, texto: "El equivalente da menos que la red: baje su R_{Th}." }
    escalera:
      - "Con la fuente en cortocircuito, ¿cómo quedan las de 4 Ω y 6 Ω vistas desde los terminales?"
    solucion: "En paralelo: 4 ‖ 6 = 2,4 Ω."
    comprobar:
      - { con: { R_tv: 2.4 }, d_tv: 0, R_th: 2.4 }

  - id: explore-equivalente
    tipo: explorar
    titulo: "Desde fuera, iguales"
    texto: "Este es el equivalente: 7,2 V con 2,4 Ω. Conecte una carga y busque la que deja los bornes a la mitad, en 3,6 V."
    libro: [116, 122]
    fijar: { V_d: 12, R_d1: 4, R_d2: 6 }
    inicio: { t_on: 0, R_L: 12 }
    widget:
      tipo: circuito
      esquema: thevenin
      piezas: { fuente: V_d0, rth: R_th, carga: R_L, interruptor: t_on }
      lectura: { valor: V_to, rotulo: "Bornes del equivalente" }
      datos:
        - { valor: V_red, rotulo: "Red original: {{V_red}}" }
      corriente: I_t
      mide: { salida: V_to, corriente: I_t, interna: V_ti }
      mandos:
        - { valor: t_on, tipo: conectar, boton: "Conectar la carga" }
        - { valor: R_L, lista: [1.2, 2.4, 6, 12, 24], rotulo: "Carga, R_{L}" }
    objetivo:
      condiciones:
        - { valor: V_to, objetivo: 3.6, tol: 0.02, rotulo: "Bornes: {{V_to}}" }
      logrado: "Con {{R_L}}, la red original da también {{V_red}}: desde fuera son indistinguibles."
      pistas:
        - { cuando: { valor: t_on, max: 0 }, texto: "Primero conecte la carga." }
        - { cuando: { valor: V_to, mayor: 3.67 }, texto: "Todavía sobra tensión: pruebe con una carga menor." }
        - { texto: "Ha bajado de más: pruebe con una carga mayor." }
    escalera:
      - "La mitad cae en la carga cuando la carga es igual a R_{Th}."
    solucion: "Con R_{L} = 2,4 Ω: 3,6 V en el equivalente y en la red."
    comprobar:
      - { V_d0: 7.2, R_th: 2.4 }
      - { con: { t_on: 1, R_L: 2.4 }, V_to: 3.6, V_red: 3.6 }

  - id: reto-norton
    tipo: reto
    titulo: "Reto: el equivalente de Norton"
    texto: "Norton usa una fuente de corriente con la misma R_{Th} en paralelo. Ajuste I_{N} para que en vacío dé los mismos 7,2 V."
    libro: [121, 122]
    fijar: { V_d: 12, R_d1: 4, R_d2: 6, n_on: 0 }
    inicio: { I_n: 1 }
    widget:
      tipo: circuito
      esquema: norton
      piezas: { fuente: I_n, rn: R_th, carga: R_L, interruptor: n_on }
      lectura: { valor: V_no, rotulo: "Tensión en vacío" }
      corriente: I_nr
      mide: { salida: V_no, carga: I_nl, paralelo: I_nr }
      mandos:
        - { valor: I_n, min: 0.5, max: 5, paso: 0.25, rotulo: "I_{N}" }
    condiciones:
      - { valor: V_no, objetivo: 7.2, tol: 0.02, rotulo: "En vacío: {{V_no}}" }
    exito: "I_{N} = V_{Th}/R_{Th} = 3 A: la corriente que circularía con los terminales en cortocircuito."
    pistas:
      - { cuando: { valor: V_no, mayor: 7.344 }, texto: "Sobra tensión: baje la corriente de la fuente." }
      - { cuando: { valor: V_no, menor: 7.056 }, texto: "Falta tensión: suba la corriente de la fuente." }
    escalera:
      - "En vacío, toda la corriente de la fuente pasa por R_{Th}."
    solucion: "V = I_{N} · 2,4 Ω: para 7,2 V hacen falta 3 A."
    comprobar:
      - { con: { I_n: 3 }, V_no: 7.2, I_cc: 3 }

  - id: explore-maxima
    tipo: marcar
    titulo: "Potencia en la carga"
    texto: "El equivalente, 7,2 V y 2,4 Ω, alimenta una carga. Arrastre la marca por la curva hasta la carga que recibe la máxima potencia."
    libro: [124]
    fijar: { V_d: 12, R_d1: 4, R_d2: 6 }
    widget:
      tipo: grafica
      x: { id: rl, min: 0, max: 12, unidad: Ω, rotulo: "R_{L}" }
      y: { min: 0, max: 6, unidad: W, rotulo: "P" }
      curvas:
        - { expr: "V_d0^2*rl/(R_th + rl)^2", color: naranja, rotulo: "potencia en la carga" }
      mandos: []
    marcar:
      modo: x
      curva: 0
      x: "R_th"
      tol: 0.03
      inicio: { x: 9, y: 0 }
      rotulo: "La carga de la máxima potencia"
    pistas:
      - { cuando: { valor: marca_x, mayor: 2.4 }, texto: "Más a la izquierda: con mucha resistencia de carga apenas pasa corriente." }
      - { texto: "Más a la derecha: con poca resistencia de carga, la tensión en ella cae." }
    exito: "Máxima con R_{L} = R_{Th}: 2,4 Ω y 5,4 W."
    escalera:
      - "Busque la cima de la curva."
    solucion: "En R_{L} = R_{Th} = 2,4 Ω."

  - id: por-que-rendimiento
    tipo: explorar
    titulo: "Su malentendido"
    texto: "Con la carga adaptada, R_{L} = R_{Th}, el rendimiento es solo del 50 %. Suba el rendimiento al 80 % y mire qué recibe la carga."
    libro: [124, 125]
    fijar: { V_d: 12, R_d1: 4, R_d2: 6 }
    inicio: { R_L: 2.4 }
    widget:
      tipo: grafica
      x: { id: rl, min: 0, max: 12, unidad: Ω, rotulo: "R_{L}" }
      y: { min: 0, max: 100, unidad: "%", rotulo: "η" }
      curvas:
        - { expr: "rl/(R_th + rl)*100", color: azul, rotulo: "rendimiento" }
      asas:
        - { mueve: R_L, x: "R_L", y: "eta", rotulo: "Carga" }
      lectura: { valor: eta, rotulo: "Rendimiento" }
      datos:
        - { valor: P_L, rotulo: "Potencia en la carga: {{P_L}}" }
      mandos:
        - { valor: R_L, min: 0.4, max: 12, paso: 0.4, rotulo: "Carga, R_{L}" }
    objetivo:
      condiciones:
        - { valor: eta, mayor: 79.9, rotulo: "Rendimiento: {{eta}}" }
      logrado: "Con {{eta}} la carga recibe solo {{P_L}}, no los 5,4 W: adaptar es para información, no para energía."
      pistas:
        - { texto: "Suba la resistencia de carga: que R_{Th} se quede menos." }
    escalera:
      - "El rendimiento es la parte de la carga en R_{Th} + R_{L}."
    solucion: "Con R_{L} = 9,6 Ω: el 80 %, y la carga recibe 3,46 W."
    comprobar:
      - { con: { R_L: 2.4 }, eta: 50, P_L: 5.4 }
      - { con: { R_L: 9.6 }, eta: 80, P_L: 3.456 }

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [109, 110, 112, 114, 116, 121, 125]
    ideas:
      - { titulo: "Superposición.", texto: "En un circuito lineal, una fuente cada vez y se suman los efectos; nunca las potencias." }
      - { titulo: "Thévenin.", texto: "Cualquier red lineal es V_{Th}, la tensión en vacío, con R_{Th}, la vista con las fuentes anuladas." }
      - { titulo: "Norton.", texto: "La misma red con I_{N} = V_{Th}/R_{Th} y la misma R_{Th} en paralelo." }
      - { titulo: "Máxima transferencia.", texto: "Con R_{L} = R_{Th}, y con un rendimiento del 50 %: para información, no para energía." }
