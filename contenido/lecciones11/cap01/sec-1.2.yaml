# Lección 1.1 de la sección 1.2 «La Ley de Ohm en Profundidad» (cap01). Formato: contenido/lecciones11/GUIA.md.
leccion: cap01/sec-1.2

libro:
  38: "la corriente que circula por él es directamente proporcional a la tensión aplicada"
  39: "V = I dot.op R"
  41: "I = (V)/(R) quad R = (V)/(I)"
  42: "un conductor tiene una resistencia de un ohmio si una tensión de un voltio establece en él una corriente de un amperio"
  45: "R = (ρ dot.op L)/(A)"
  46: "a mayor sección, menor resistencia"
  47: "100 metros de cable de cobre de 1,5 mm² de sección"
  49: "la Ley de Ohm no es una ley universal de la naturaleza"
  50: "su resistencia varía con la tensión, la corriente o la dirección"
  51: "ese cociente no es una constante: cambia según el punto de trabajo"
  53: "los átomos de la red cristalina vibran con más intensidad"
  54: 'R lr(( T )) = R_("0")'
  55: "su resistencia aumenta casi un 0,4 % por cada grado"
  56: "tapando la magnitud que se desea calcular"
  57: "El modelo se contradice a sí mismo en un 1,9 % en 80 °C"

modelo:
  valores:
    V_a: { sim: "V", nombre: "tensión de la fuente", unidad: V, valor: 6 }
    R_a: { sim: "R", nombre: "resistencia", unidad: Ω, valor: 220 }
    L_g: { sim: "L", nombre: "longitud del cable", unidad: m, valor: 50 }
    A_g: { sim: "A", nombre: "sección del cable", unidad: "mm²", valor: 2.5 }
    alu: { tipo: interruptor, nombre: "cable de aluminio", valor: 0 }
    V_e: { sim: "V", nombre: "tensión de la fuente", unidad: V, valor: 5 }
    R_e: { sim: "R", nombre: "resistencia del LED", unidad: Ω, valor: 150 }
    V_fe: { sim: "V_{f}", nombre: "tensión del LED", unidad: V, valor: 2 }
    T_c: { sim: "T", nombre: "temperatura del cobre", unidad: "°C", valor: 20 }
    T_m: { sim: "T_{m}", nombre: "temperatura intermedia", unidad: "°C", valor: 30 }
  calculos:
    I_a: { expr: "V_a/R_a", sim: "I", nombre: "corriente", unidad: A }
    rho: { si: alu, entonces: "2.82e-8", sino: "1.72e-8", sim: "ρ", nombre: "resistividad", unidad: "Ω·m" }
    R_g: { expr: "rho*L_g/(A_g*1e-6)", sim: "R", nombre: "resistencia del cable", unidad: Ω }
    I_e: { expr: "(V_e - V_fe)/R_e", sim: "I", nombre: "corriente del LED", unidad: A }
    R_led: { expr: "V_fe/I_e", sim: "V/I", nombre: "cociente V/I del LED", unidad: Ω }
    k_T: { expr: "1 + 0.00393*(T_c - 20)", sim: "R/R₀", nombre: "factor de la resistencia", unidad: "", cifras: 4 }
    sube: { expr: "(k_T - 1)*100", sim: "subida", nombre: "subida de la resistencia", unidad: "%" }
    k_1: { expr: "1 + 0.00393*80", sim: "un tramo", nombre: "factor de 20 a 100 °C de una vez", unidad: "", cifras: 6 }
    k_2: { expr: "(1 + 0.00393*(T_m - 20))*(1 + 0.00393*(100 - T_m))", sim: "dos tramos", nombre: "factor en dos tramos", unidad: "", cifras: 6 }
    disc: { expr: "(k_2 - k_1)/k_1*100", sim: "discrepancia", nombre: "discrepancia entre uno y dos tramos", unidad: "%", cifras: 2 }

tarjetas:
  - id: explore-ohm
    tipo: explorar
    titulo: "Tensión, corriente y resistencia"
    texto: "Mueva la tensión y la resistencia. Fíjese en cómo responde la corriente a cada una."
    libro: [38, 42]
    widget:
      tipo: circuito
      esquema: resistencia
      piezas: { fuente: V_a, r: R_a }
      lectura: { valor: I_a, rotulo: "Corriente" }
      corriente: I_a
      mide: { corriente: I_a, tension: V_a }
      mandos:
        - { valor: V_a, min: 1, max: 12, paso: 1, rotulo: "Tensión, V" }
        - { valor: R_a, serie: E12, min: 100, max: 1000, rotulo: "R (E12)" }
    requiere: { mover: [V_a, R_a] }

  - id: prediga-doble
    tipo: predecir
    titulo: "Prediga"
    texto: "Con la misma resistencia, se dobla la tensión de la fuente. ¿Qué hace la corriente?"
    libro: [38]
    fijar: { V_a: 12, R_a: 220 }
    widget:
      tipo: circuito
      esquema: resistencia
      piezas: { fuente: V_a, r: R_a }
      lectura: { valor: I_a, rotulo: "Corriente" }
      corriente: I_a
      mide: { corriente: I_a, tension: V_a }
      ocultar: true
    opciones:
      - texto: "Se dobla"
        bien: true
        porque: "En un conductor óhmico la corriente es proporcional a la tensión: doble tensión, doble corriente."
      - texto: "Se reduce a la mitad"
        porque: "Eso pasaría al doblar la resistencia, no la tensión. Más tensión empuja más corriente."
      - texto: "No cambia: la fija la resistencia"
        porque: "La resistencia fija la proporción entre las dos, no la corriente. La corriente sigue a la tensión."

  - id: regla-ohm
    tipo: formula
    titulo: "La ley de Ohm"
    texto: "La corriente es proporcional a la tensión y la constante es la resistencia. Arrastre el punto; con más R, la recta se tumba."
    libro: [39, 42]
    ec: 39
    sustitucion: "{{I_a}} · {{R_a}} = {{V_a}}"
    widget:
      tipo: grafica
      x: { id: u, min: 0, max: 12, unidad: V, rotulo: "V" }
      y: { min: 0, max: 0.12, unidad: A, rotulo: "I" }
      curvas:
        - { expr: "u/R_a", color: azul, rotulo: "I = V/R" }
      asas:
        - { mueve: V_a, x: "V_a", y: "I_a", rotulo: "Punto de trabajo" }
      lectura: { valor: I_a, rotulo: "Corriente" }
      mandos:
        - { valor: V_a, min: 1, max: 12, paso: 1, rotulo: "Tensión, V" }
        - { valor: R_a, serie: E12, min: 100, max: 1000, rotulo: "R (E12)" }

  - id: empareje-triangulo
    tipo: pregunta
    fase: "Empareje"
    titulo: "Las tres formas"
    texto: "De V = I·R salen las otras dos. Tape la que busca, como en el triángulo de la ley de Ohm, y empareje."
    libro: [41, 42, 56]
    emparejar:
      - ["V", "I · R"]
      - ["I", "V / R"]
      - ["R", "V / I"]
      - ["Un ohmio", "Un voltio que hace circular un amperio"]
    exito: "Eso es. Mucha resistencia: mucha tensión para poca corriente; poca resistencia: mucha corriente con poca tensión."
    pistas:
      - { texto: "Lo que busca queda solo a un lado; las otras dos, multiplicándose o dividiéndose al otro." }

  - id: explore-cable
    tipo: explorar
    titulo: "La resistencia de un cable"
    texto: "Mueva la longitud y la sección, y cambie de cobre a aluminio. Más largo, más resistencia; más grueso, menos."
    libro: [45, 46]
    widget:
      tipo: grafica
      x: { id: ll, min: 0, max: 200, unidad: m, rotulo: "L" }
      y: { min: 0, max: 6, unidad: Ω, rotulo: "R" }
      curvas:
        - { expr: "rho*ll/(A_g*1e-6)", color: naranja, rotulo: "R = ρL/A" }
      asas:
        - { mueve: L_g, x: "L_g", y: "R_g", rotulo: "Longitud del cable" }
      lectura: { valor: R_g, rotulo: "Resistencia del cable" }
      mandos:
        - { valor: L_g, min: 10, max: 200, paso: 10, rotulo: "Longitud, L" }
        - { valor: A_g, lista: [1, 1.5, 2.5, 4, 6], rotulo: "Sección, A" }
        - { valor: alu, tipo: interruptor, rotulo: "Aluminio" }
    requiere: { mover: [L_g, A_g] }

  - id: estime-cable
    tipo: pregunta
    fase: "Estime"
    titulo: "Cien metros de cobre"
    texto: "El cobre tiene 1,72 × 10⁻⁸ Ω·m. Estime la resistencia de 100 metros de cable de cobre de 1,5 mm²."
    libro: [46, 47]
    fijar: { L_g: 100, A_g: 1.5, alu: 0 }
    estimar:
      objetivo: "R_g"
      unidad: Ω
      min: 0
      max: 5
      paso: 0.05
      inicio: 3
      tol: 0.05
      rotulo: "R de 100 m"
    exito: "1,72 × 10⁻⁶ / 1,5 × 10⁻⁶ = 1,15 Ω. Poca, pero en tiradas largas da caídas de tensión apreciables."
    pistas:
      - { cuando: { valor: estimacion, mayor: 1.2 }, texto: "Se ha pasado: pase la sección a m², 1,5 × 10⁻⁶, y divida." }
      - { texto: "Se ha quedado corto: ρ·L = 1,72 × 10⁻⁶; divídalo entre 1,5 × 10⁻⁶ m²." }
    comprobar:
      - { R_g: 1.1467, tol: 0.001 }

  - id: led-no-ohmico
    tipo: pregunta
    titulo: "¿La resistencia de un LED?"
    texto: "Mueva la fuente y mire el cociente V/I del LED. ¿Tiene sentido llamarlo su resistencia?"
    libro: [49, 50, 51]
    widget:
      tipo: circuito
      esquema: led
      piezas: { fuente: V_e, r: R_e, vf: V_fe }
      lectura: { valor: R_led, rotulo: "V/I del LED" }
      datos:
        - { valor: I_e, rotulo: "Corriente: {{I_e}}" }
      corriente: I_e
      mide: { corriente: I_e, vf: V_fe }
      mandos:
        - { valor: V_e, min: 3, max: 9, paso: 0.5, rotulo: "Fuente, V" }
    opciones:
      - texto: "No como constante: cambia con el punto de trabajo"
        bien: true
        porque: "El LED no es óhmico: su cociente V/I cambia según la corriente. La ley de Ohm no se le aplica."
      - texto: "Sí, y es la resistencia que hay que ponerle en serie"
        porque: "La de serie limita la corriente; el cociente del LED no es una constante y no sirve para calcularla."
      - texto: "Sí, siempre que no cambie la temperatura"
        porque: "Esa condición vale para un metal. El LED no es óhmico ni a temperatura constante."

  - id: prediga-calor
    tipo: predecir
    titulo: "Prediga"
    texto: "El cobre sube casi un 0,4 % por grado. Si un cable pasa de 20 °C a 100 °C, ¿cuánto sube su resistencia?"
    libro: [55, 57]
    fijar: { T_c: 100 }
    widget:
      tipo: grafica
      x: { id: tt, min: 0, max: 150, unidad: "°C", rotulo: "T" }
      y: { min: 0.8, max: 1.6, unidad: "", rotulo: "R/R₀" }
      curvas:
        - { expr: "1 + 0.00393*(tt - 20)", color: naranja, rotulo: "cobre" }
      lectura: { valor: sube, rotulo: "Subida de R" }
      ocultar: true
    opciones:
      - texto: "Un 31 %"
        bien: true
        porque: "Son 0,00393 por grado durante 80 grados: el factor es 1,31440, un 31 % más."
      - texto: "Un 0,4 %"
        porque: "Ese 0,4 % es por cada grado. Son 80 grados de subida."
      - texto: "Baja un 31 %"
        porque: "Baja en los semiconductores, cuyo coeficiente es negativo. En el cobre, α es positivo."
    comprobar:
      - { k_T: 1.3144, sube: 31.44 }

  - id: regla-temperatura
    tipo: formula
    titulo: "La resistencia con la temperatura"
    texto: "R₀ es la resistencia a T₀, habitualmente 20 °C, y α el coeficiente del material: en el cobre, +0,00393 por grado. Arrastre el punto."
    libro: [54, 55]
    ec: 54
    sustitucion: "R/R₀ = 1 + 0,00393 · ({{T_c}} − 20 °C) = {{k_T}}"
    widget:
      tipo: grafica
      x: { id: tt, min: 0, max: 150, unidad: "°C", rotulo: "T" }
      y: { min: 0.8, max: 1.6, unidad: "", rotulo: "R/R₀" }
      curvas:
        - { expr: "1 + 0.00393*(tt - 20)", color: naranja, rotulo: "cobre" }
      asas:
        - { mueve: T_c, x: "T_c", y: "k_T", rotulo: "Temperatura" }
      lectura: { valor: k_T, rotulo: "R/R₀" }
      mandos:
        - { valor: T_c, min: 0, max: 150, paso: 10, rotulo: "Temperatura, T" }

  - id: dos-tramos
    tipo: sorpresa
    titulo: "El modelo se contradice"
    texto: "Si fuese exacto, ir de 20 a 100 °C en dos tramos daría igual que en uno. Mueva el intermedio."
    nota: "Con el punto intermedio en 60 °C, 1,9 %: es una linealización, vale para decenas de grados."
    libro: [57]
    inicio: { T_m: 30 }
    widget:
      tipo: grafica
      x: { id: tm, min: 20, max: 100, unidad: "°C", rotulo: "T_{m}" }
      y: { min: 0, max: 2.5, unidad: "%", rotulo: "discrepancia" }
      curvas:
        - { expr: "((1 + 0.00393*(tm - 20))*(1 + 0.00393*(100 - tm)) - k_1)/k_1*100", color: naranja, rotulo: "discrepancia" }
      asas:
        - { mueve: T_m, x: "T_m", y: "disc", rotulo: "Punto intermedio" }
      lectura: { valor: disc, rotulo: "Discrepancia" }
      datos:
        - { valor: k_1, rotulo: "Un tramo: {{k_1}}" }
        - { valor: k_2, rotulo: "Dos tramos: {{k_2}}" }
      mandos:
        - { valor: T_m, min: 20, max: 100, paso: 5, rotulo: "Punto intermedio, T_{m}" }
    comprobar:
      - { con: { T_m: 60 }, k_1: 1.3144, k_2: 1.33911, disc: 1.88 }

  - id: por-que-calor
    tipo: porque
    titulo: "¿Por qué sube?"
    texto: "Al calentar un metal, su resistencia aumenta. ¿Qué lo explica?"
    libro: [53, 55]
    opciones:
      - texto: "Los átomos vibran más y estorban a los electrones"
        bien: true
        porque: "La red cristalina vibra con más intensidad y obstaculiza más el paso de los electrones."
      - texto: "El calor deja menos electrones libres"
        porque: "Al revés: en los semiconductores el calor libera más portadores, y por eso su resistencia baja."
      - texto: "El cable se alarga al dilatarse"
        porque: "La dilatación es mínima. Lo que cuenta es la vibración de los átomos de la red."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [39, 45, 49, 54, 57]
    ideas:
      - { titulo: "Ley de Ohm.", texto: "V = I·R: en un material óhmico la corriente es proporcional a la tensión." }
      - { titulo: "Geometría.", texto: "R = ρ·L/A: crece con la longitud y baja con la sección." }
      - { titulo: "No óhmicos.", texto: "Diodos, LED, lámparas o termistores: V/I cambia con el punto de trabajo." }
      - { titulo: "Temperatura.", texto: "En el cobre, casi un 0,4 % por grado; una linealización para unas decenas de grados." }
