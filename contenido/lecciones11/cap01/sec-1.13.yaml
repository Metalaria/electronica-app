# Lección 1.1 de la sección 1.13 «Resumen del Capítulo» (cap01): repaso con las ideas, los errores y los números del
# resumen, y los ejercicios del capítulo que no han salido en otras lecciones. Formato: contenido/lecciones11/GUIA.md.
leccion: cap01/sec-1.13

libro:
  313: "La ley de Ohm describe una relación, no una propiedad universal"
  314: "Kirchhoff es conservación"
  315: "en serie circula la misma corriente, en paralelo hay la misma tensión"
  316: "Todo divisor tiene impedancia de salida"
  317: "Toda fuente real tiene resistencia interna"
  318: "El instrumento forma parte del circuito"
  320: "Aplicar la ley de Ohm a un componente no lineal."
  322: "Resistencia interna de una pila alcalina"
  327: "montar un divisor con dos resistencias, calcular su Thévenin, medirlo en vacío y con carga"
  "cap01#103": "4,00 V en vacío y 3,00 V con 10 kΩ conectados"
  "cap01#345": "Dos resistencias de 330 Ω y 220 Ω se conectan en paralelo"

modelo:
  valores:
    V_in: { sim: "V", nombre: "tensión de la fuente", unidad: V, valor: 12 }
    R_1: { sim: "R₁", nombre: "resistencia de arriba", unidad: Ω, valor: 10000 }
    R_2: { sim: "R₂", nombre: "resistencia de abajo", unidad: Ω, valor: 5000 }
    R_L: { sim: "R_{L}", nombre: "carga", unidad: Ω, valor: 10000 }
    carga: { tipo: interruptor, nombre: "carga conectada", valor: 0 }
    V_p: { sim: "V", nombre: "fuente del paralelo", unidad: V, valor: 5 }
    R_a: { sim: "R₁", nombre: "primera rama", unidad: Ω, valor: 330 }
    R_b: { sim: "R₂", nombre: "segunda rama", unidad: Ω, valor: 1000 }
    L_c: { sim: "L", nombre: "longitud del cable", unidad: m, valor: 50 }
    A_c: { sim: "A", nombre: "sección del cable", unidad: "mm²", valor: 2.5 }
    I_c: { sim: "I", nombre: "corriente del cable", unidad: A, valor: 10 }
  calculos:
    R_ab: { si: carga, entonces: "par(R_2, R_L)", sino: "R_2", sim: "R_{abajo}", nombre: "rama de abajo", unidad: Ω }
    V_out: { expr: "V_in*R_ab/(R_1 + R_ab)", sim: "V", nombre: "tensión medida", unidad: V }
    I_d: { expr: "V_in/(R_1 + R_ab)", sim: "I", nombre: "corriente del divisor", unidad: A }
    I_L: { si: carga, entonces: "V_out/R_L", sino: "0", sim: "I_{L}", nombre: "corriente por la carga", unidad: A }
    V_th: { expr: "V_in*R_2/(R_1 + R_2)", sim: "V_{Th}", nombre: "tensión de Thévenin", unidad: V }
    R_th: { expr: "par(R_1, R_2)", sim: "R_{Th}", nombre: "resistencia de Thévenin", unidad: Ω }
    V_calc: { si: carga, entonces: "V_th*R_L/(R_th + R_L)", sino: "V_th", sim: "V_{Thévenin}", nombre: "tensión calculada con el Thévenin", unidad: V }
    I_a: { expr: "V_p/R_a", sim: "I₁", nombre: "corriente por R₁", unidad: A }
    I_b: { expr: "V_p/R_b", sim: "I₂", nombre: "corriente por R₂", unidad: A }
    I_t: { expr: "I_a + I_b", sim: "I", nombre: "corriente de la fuente", unidad: A }
    R_p: { expr: "par(R_a, R_b)", sim: "R_{eq}", nombre: "resistencia equivalente", unidad: Ω }
    R_cab: { expr: "1.72e-8*L_c/(A_c*1e-6)", sim: "R", nombre: "resistencia del cable", unidad: Ω }
    V_cab: { expr: "I_c*R_cab", sim: "V", nombre: "caída en el cable", unidad: V }
    P_cab: { expr: "I_c^2*R_cab", sim: "P", nombre: "potencia perdida en el cable", unidad: W }

tarjetas:
  - id: explore-banco
    tipo: explorar
    titulo: "El ejercicio que lo consolida"
    texto: "Un divisor de 12 V, 10 kΩ y 5 kΩ. Mídalo en vacío y con la carga, y compare con lo que da su Thévenin."
    libro: [327]
    widget:
      tipo: circuito
      esquema: divisor
      piezas: { fuente: V_in, arriba: R_1, abajo: R_2, carga: R_L, interruptor: carga }
      lectura: { valor: V_out, rotulo: "Medida" }
      datos:
        - { valor: V_calc, rotulo: "Con el Thévenin: {{V_calc}}" }
        - { valor: R_th, rotulo: "R_{Th} = {{R_th}}" }
      corriente: I_d
      mide: { salida: V_out, corriente: I_d, carga: I_L }
      mandos:
        - { valor: carga, tipo: conectar, boton: "Conectar la carga (10 kΩ)" }
    requiere: { conectar: [carga] }

  - id: prediga-thevenin
    tipo: predecir
    titulo: "Prediga"
    texto: "Su Thévenin es 4 V con 3,33 kΩ. Con la carga de 10 kΩ, ¿qué marcará la salida?"
    libro: [316, "cap01#103"]
    fijar: { carga: 1, R_L: 10000 }
    widget:
      tipo: circuito
      esquema: divisor
      piezas: { fuente: V_in, arriba: R_1, abajo: R_2, carga: R_L, interruptor: carga }
      lectura: { valor: V_out, rotulo: "Medida" }
      corriente: I_d
      mide: { salida: V_out, corriente: I_d, carga: I_L }
      ocultar: true
    opciones:
      - texto: "3,00 V"
        bien: true
        porque: "4 × 10/(10 + 3,33) = 3,00 V: la misma cifra que da el circuito completo."
      - texto: "4,00 V"
        porque: "Eso es en vacío. Todo divisor tiene impedancia de salida, y la carga la nota."
      - texto: "2,00 V"
        porque: "Sería con una carga igual a R_{Th}. Con 10 kΩ se pierde menos."
    comprobar:
      - { V_out: 3.0, V_th: 4.0, R_th: 3333 }
      - { con: { R_L: 3333.3 }, V_out: 2.0 }
    escalera:
      - "La carga y R_{Th} forman otro divisor con V_{Th}."
    solucion: "4 × 10/(10 + 3,33) = 3,00 V."

  - id: empareje-ideas
    tipo: pregunta
    fase: "Empareje"
    titulo: "Seis ideas"
    texto: "El capítulo se reduce a seis ideas. Empareje cada tema con la suya."
    libro: [313, 314, 315, 316, 317, 318]
    emparejar:
      - ["Ley de Ohm", "Una relación, no una propiedad universal"]
      - ["Kirchhoff", "Conservación de la carga y de la energía"]
      - ["Serie y paralelo", "Categorías de la corriente y la tensión, no del dibujo"]
      - ["Divisor", "Tiene impedancia de salida"]
      - ["Fuente real", "Tiene resistencia interna"]
      - ["Instrumento", "Forma parte del circuito"]
    exito: "Por eso un divisor no puede alimentar nada, y la tensión de una fuente real cae con la carga."
    pistas:
      - { texto: "El divisor y la fuente real se parecen: los dos tienen una resistencia que se ve desde la salida, pero solo uno es «interna»." }
    escalera:
      - "Ohm es una relación; Kirchhoff, conservación. Empiece por esas dos."
    solucion: "Ohm: una relación. Kirchhoff: conservación de carga y energía. Serie y paralelo: de la corriente y la tensión. Divisor: tiene impedancia de salida. Fuente real: resistencia interna. Instrumento: parte del circuito."

  - id: error-tipico
    tipo: pregunta
    titulo: "Un error característico"
    texto: "Alguien mide un LED, divide su tensión entre su corriente y usa esa «resistencia» con la ley de Ohm. ¿Qué error comete?"
    libro: [313, 320]
    opciones:
      - texto: "Aplicar la ley de Ohm a un componente no lineal"
        bien: true
        porque: "En un LED V/I cambia con el punto de trabajo: no es una resistencia."
      - texto: "Olvidar la resistencia interna de la fuente"
        porque: "Ese es otro error del capítulo; aquí el problema es el LED, que no es óhmico."
      - texto: "Calcular con valores nominales"
        porque: "Las tolerancias importan, pero el fallo de fondo es tratar el LED como una resistencia."
    widget:
      tipo: figura
      figura: fig-1.15
      zonas:
        - { id: ideas, rotulo: "Las seis ideas del capítulo", rect: [0, 0, 452, 206] }
    escalera:
      - "¿Es V/I constante en un LED?"
    solucion: "Aplicar la ley de Ohm a un componente no lineal: su V/I cambia con el punto de trabajo."

  - id: reto-paralelo
    tipo: reto
    titulo: "Reto: 37,9 mA desde 5 V"
    texto: "Una rama de 330 Ω en una fuente de 5 V. Elija la otra rama (E12) para que la fuente entregue 37,9 mA (± 2 %)."
    libro: ["cap01#345"]
    fijar: { V_p: 5, R_a: 330 }
    inicio: { R_b: 1000 }
    widget:
      tipo: circuito
      esquema: paralelo
      piezas: { fuente: V_p, r1: R_a, r2: R_b }
      lectura: { valor: I_t, rotulo: "Corriente total" }
      barras:
        - { valor: I_a, rotulo: "Por R₁: {{I_a}}", color: azul }
        - { valor: I_b, rotulo: "Por R₂: {{I_b}}", color: naranja }
      corriente: I_t
      mide: { total: I_t, i1: I_a, i2: I_b }
      mandos:
        - { valor: R_b, serie: E12, min: 100, max: 1000, rotulo: "R₂ (E12)" }
    condiciones:
      - { valor: I_t, objetivo: 0.0379, tol: 0.02, rotulo: "Total: {{I_t}}" }
    exito: "220 Ω: el paralelo vale 132 Ω, y 15,2 mA van por la de 330 Ω y 22,7 mA por la de 220 Ω. Por la menor, más."
    pistas:
      - { cuando: { valor: I_t, mayor: 0.03866 }, texto: "Demasiada corriente: la segunda rama es demasiado pequeña." }
      - { cuando: { valor: I_t, menor: 0.03714 }, texto: "Falta corriente: la segunda rama debe ser menor." }
    escalera:
      - "Por la de 330 Ω pasan 15,2 mA: ¿cuánto falta hasta 37,9 mA?"
    solucion: "La otra debe llevar 22,7 mA: 5 V / 22,7 mA = 220 Ω."
    comprobar:
      - { con: { R_b: 220 }, I_t: 0.0379, I_a: 0.0152, I_b: 0.0227, R_p: 132 }

  - id: estime-cable
    tipo: pregunta
    fase: "Estime"
    titulo: "Ohm, geometría y potencia"
    texto: "Un cable de cobre de 50 m y 2,5 mm² lleva 10 A. Estime la potencia que se pierde en él como calor."
    libro: ["cap01#345"]
    estimar:
      objetivo: "P_cab"
      unidad: W
      min: 0
      max: 100
      paso: 0.5
      inicio: 90
      tol: 0.04
      rotulo: "Potencia en el cable"
    exito: "R = 1,72 × 10⁻⁸ × 50 / 2,5 × 10⁻⁶ = 0,344 Ω; caen 3,44 V y se pierden 100 × 0,344 = 34,4 W."
    pistas:
      - { cuando: { valor: estimacion, mayor: 35.8 }, texto: "Se ha pasado: halle R = ρ·L/A y luego I²·R." }
      - { texto: "Se ha quedado corto: con 10 A, I² = 100; multiplique por R." }
    comprobar:
      - { R_cab: 0.344, V_cab: 3.44, P_cab: 34.4 }
    escalera:
      - "Primero R = ρ·L/A; después, P = I²·R."
    solucion: "R = 1,72 × 10⁻⁸ × 50 / 2,5 × 10⁻⁶ = 0,344 Ω; caen 3,44 V y se pierden 100 × 0,344 = 34,4 W."

  - id: empareje-numeros
    tipo: pregunta
    fase: "Empareje"
    titulo: "Los números que conviene retener"
    texto: "Empareje cada magnitud con su valor de referencia."
    libro: [322]
    emparejar:
      - ["Contacto de un conector", "Decenas de mΩ"]
      - ["Pista de 1 oz y 1 mm", "Unos 5 mΩ/cm"]
      - ["Entrada de un multímetro", "10 MΩ"]
      - ["Sonda ×10", "10 MΩ y unos 20 pF"]
      - ["Interna de una alcalina", "De 0,1 a 1 Ω"]
    exito: "Con ellos se sabe de un vistazo qué resistencia cuenta y cuál no."
    pistas:
      - { texto: "Los dos instrumentos tienen 10 MΩ; la sonda añade su capacidad." }
    escalera:
      - "Piense en qué resistencia es grande y cuál pequeña en cada caso."
    solucion: "Contacto de un conector: decenas de mΩ. Pista de 1 oz y 1 mm: unos 5 mΩ/cm. Entrada de un multímetro: 10 MΩ. Sonda ×10: 10 MΩ y unos 20 pF. Interna de una alcalina: de 0,1 a 1 Ω."

  - id: por-que-kirchhoff
    tipo: porque
    titulo: "¿Hasta dónde vale Kirchhoff?"
    texto: "Kirchhoff es conservación. ¿Cuándo deja de cumplirse en la práctica?"
    libro: [314]
    opciones:
      - texto: "Cuando el circuito no es pequeño frente a la longitud de onda"
        bien: true
        porque: "Es una aproximación válida mientras el circuito sea pequeño frente a la longitud de onda; en electrónica rápida falla."
      - texto: "Cuando hay componentes no lineales"
        porque: "Kirchhoff vale con diodos y transistores; lo que no vale con ellos es la ley de Ohm."
      - texto: "Cuando una corriente sale negativa"
        porque: "Eso solo indica que circula al revés de lo supuesto; la ley se cumple."
    widget:
      tipo: figura
      figura: fig-1.15
      zonas:
        - { id: ideas, rotulo: "Las seis ideas del capítulo", rect: [0, 0, 452, 206] }
    escalera:
      - "Kirchhoff supone la misma corriente en todo un cable: ¿cuándo deja de ser así?"
    solucion: "Cuando el circuito no es pequeño frente a la longitud de onda."

  - id: banco-thevenin
    tipo: banco
    titulo: "Compruébelo en el banco"
    texto: "Monte el divisor de la lección, conecte la carga de 10 kΩ y mida la salida: debe coincidir con su Thévenin."
    libro: [327, "cap01#103"]
    fijar: { carga: 1, R_L: 10000 }
    widget:
      tipo: circuito
      esquema: divisor
      piezas: { fuente: V_in, arriba: R_1, abajo: R_2, carga: R_L, interruptor: carga }
      lectura: { valor: V_out, rotulo: Medida }
      datos:
        - { valor: V_calc, rotulo: "Con el Thévenin: {{V_calc}}" }
      corriente: I_d
      mide: { salida: V_out, corriente: I_d, carga: I_L }
      mandos: []
    banco:
      piezas: ["Fuente de 12 V", "R₁ = 10 kΩ, R₂ = 5 kΩ y R_{L} = 10 kΩ", "Multímetro en V⎓", "Protoboard"]
      medir: "La salida con la carga conectada, entre la salida y masa."
      esperado: V_out
      unidad: V
      tol: 0.05
      consejos:
        - { cuando: { valor: desviacion, mayor: 0.05 }, texto: "Mide de más: ¿está conectada la carga? En vacío serían 4,00 V." }
        - { texto: "Mide de menos: mida las resistencias y la fuente de verdad y recalcule el Thévenin con ellas." }
      ficha: { n: 1, titulo: "El voltímetro forma parte del circuito" }

  - id: resumen
    tipo: resumen
    titulo: "Capítulo completado"
    libro: [313, 314, 316, 317, 318]
    ideas:
      - { titulo: "Ohm y Kirchhoff.", texto: "Una relación para lo óhmico; conservación de carga y energía para todo." }
      - { titulo: "Serie y paralelo.", texto: "Son de la corriente y la tensión, no del dibujo." }
      - { titulo: "Impedancias.", texto: "Todo divisor tiene impedancia de salida y toda fuente, resistencia interna." }
      - { titulo: "Medir.", texto: "El instrumento forma parte del circuito desde el primer momento." }
