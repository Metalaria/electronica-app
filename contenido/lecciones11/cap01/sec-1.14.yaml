# Lección 1.1 de la sección 1.14 «Ampliación: El Efecto Pelicular» (cap01). Formato: contenido/lecciones11/GUIA.md.
# Rac/Rdc se dibuja con max(1, a/(2δ)): la aproximación del libro solo vale para a ≫ δ, y por debajo la resistencia es
# la de continua (la tabla del libro da 1,00 a 50 Hz).
leccion: cap01/sec-1.14

libro:
  331: "La expresión R = ρ·L/A de la sección 1.2.2 supone que la corriente se reparte por toda la sección"
  333: "la densidad de corriente decae exponencialmente hacia el interior"
  334: "δ = sqrt((ρ)/(π dot.op f dot.op µ))"
  335: "Comprobación numérica para el cobre"
  336: "66,0 µm"
  337: "A 50 Hz la penetración es de casi un centímetro"
  339: "la corriente circula por una corona de espesor δ"
  340: '(R_("ac"))/(R_("dc"))'
  341: "Rac/Rdc"
  342: "la resistencia efectiva solo baja a la mitad, no a la cuarta parte"

modelo:
  valores:
    f_p: { sim: "f", nombre: "frecuencia", unidad: Hz, valor: 50 }
    d_h: { sim: "Ø", nombre: "diámetro del hilo", unidad: m, valor: 0.001 }
  calculos:
    delta: { expr: "sqrt(1.72e-8/(pi*f_p*4*pi*1e-7))", sim: "δ", nombre: "profundidad de penetración", unidad: m }
    a_h: { expr: "d_h/2", sim: "a", nombre: "radio del hilo", unidad: m }
    k_ac: { expr: "max(1, a_h/(2*delta))", sim: "R_{ac}/R_{dc}", nombre: "aumento de la resistencia", unidad: "", cifras: 3 }
    R_dc: { expr: "1.72e-8/(pi*a_h^2)", sim: "R_{dc}", nombre: "resistencia en continua por metro", unidad: "Ω/m" }
    razon: { expr: "1000/50", sim: "f/f₀", nombre: "razón de frecuencias", unidad: "" }
    raiz20: { expr: "sqrt(20)", sim: "√20", nombre: "raíz de veinte", unidad: "" }
    R_ac: { expr: "R_dc*k_ac", sim: "R_{ac}", nombre: "resistencia efectiva por metro", unidad: "Ω/m" }

tarjetas:
  - id: explore-penetracion
    tipo: explorar
    titulo: "La corriente se va a la piel"
    texto: "En alterna, la densidad de corriente decae hacia el interior del cobre. Mueva la frecuencia y mire hasta qué profundidad conduce."
    libro: [331, 333]
    widget:
      tipo: grafica
      x: { id: nu, min: 10, max: 1000000000, unidad: Hz, rotulo: "f", escala: log }
      y: { min: 0.000001, max: 0.1, unidad: m, rotulo: "δ", escala: log }
      curvas:
        - { expr: "sqrt(1.72e-8/(pi*nu*4*pi*1e-7))", color: naranja, rotulo: "δ en cobre" }
      asas:
        - { mueve: f_p, x: "f_p", y: "delta", rotulo: "Frecuencia" }
      lectura: { valor: delta, rotulo: "Profundidad de penetración" }
      mandos:
        - { valor: f_p, lista: [50, 1000, 1000000, 100000000], rotulo: "Frecuencia, f" }
    requiere: { mover: [f_p] }

  - id: prediga-megahercio
    tipo: predecir
    titulo: "Prediga"
    texto: "A 50 Hz el cobre conduce hasta casi un centímetro de profundidad. ¿Y a 1 MHz?"
    libro: [336, 337]
    fijar: { f_p: 1000000 }
    widget:
      tipo: grafica
      x: { id: nu, min: 10, max: 1000000000, unidad: Hz, rotulo: "f", escala: log }
      y: { min: 0.000001, max: 0.1, unidad: m, rotulo: "δ", escala: log }
      curvas:
        - { expr: "sqrt(1.72e-8/(pi*nu*4*pi*1e-7))", color: naranja, rotulo: "δ en cobre" }
      lectura: { valor: delta, rotulo: "Profundidad de penetración" }
      ocultar: true
    opciones:
      - texto: "Unas 66 micras"
        bien: true
        porque: "A 1 MHz solo conducen las 66,0 µm exteriores: la frecuencia se ha multiplicado por veinte mil y δ va con su raíz."
      - texto: "Casi un centímetro, igual"
        porque: "δ depende de la frecuencia: baja con su raíz cuadrada."
      - texto: "Todo el hilo, como en continua"
        porque: "Eso es en continua. En alterna la corriente se concentra en la superficie."
    comprobar:
      - { delta: 66.0e-6 }
      - { con: { f_p: 50 }, delta: 9.33e-3 }

  - id: regla-delta
    tipo: formula
    titulo: "Profundidad de penetración"
    texto: "δ crece con la resistividad y baja con la raíz de la frecuencia y de la permeabilidad."
    nota: "Para el cobre, µ = µ₀: a 100 MHz, 6,6 µm."
    libro: [334, 335, 336]
    ec: 334
    sustitucion: "√(1,72 × 10⁻⁸ Ω·m / (π · {{f_p}} · µ₀)) = {{delta}}"
    widget:
      tipo: grafica
      x: { id: nu, min: 10, max: 1000000000, unidad: Hz, rotulo: "f", escala: log }
      y: { min: 0.000001, max: 0.1, unidad: m, rotulo: "δ", escala: log }
      curvas:
        - { expr: "sqrt(1.72e-8/(pi*nu*4*pi*1e-7))", color: naranja, rotulo: "δ en cobre" }
      asas:
        - { mueve: f_p, x: "f_p", y: "delta", rotulo: "Frecuencia" }
      lectura: { valor: delta, rotulo: "Profundidad de penetración" }
      mandos:
        - { valor: f_p, lista: [50, 1000, 1000000, 100000000], rotulo: "Frecuencia, f" }
    comprobar:
      - { con: { f_p: 1000 }, delta: 2.09e-3 }
      - { con: { f_p: 100000000 }, delta: 6.6e-6 }

  - id: estime-kilohercio
    tipo: pregunta
    fase: "Estime"
    titulo: "A 1 kHz"
    texto: "A 50 Hz, δ = 9,33 mm. La frecuencia se multiplica por veinte y δ va con 1/√f. Estime δ a 1 kHz."
    libro: [334, 336]
    fijar: { f_p: 1000 }
    estimar:
      objetivo: "delta"
      unidad: m
      min: 0
      max: 0.01
      paso: 0.0001
      inicio: 0.008
      tol: 0.05
      rotulo: "δ a 1 kHz"
    exito: "9,33 mm / √20 ≈ 2,09 mm. La raíz suaviza: veinte veces más frecuencia, algo más de cuatro veces menos profundidad."
    pistas:
      - { cuando: { valor: estimacion, mayor: 0.0022 }, texto: "Se ha pasado: divida 9,33 mm entre √20, que es algo más de 4." }
      - { texto: "Se ha quedado corto: no es 9,33/20; es 9,33/√20." }
    comprobar:
      - { delta: 2.09e-3 }
      - { con: { f_p: 50 }, delta: 9.33e-3 }
      - { raiz20: 4.47, razon: 20 }

  - id: regla-rac
    tipo: formula
    titulo: "Consecuencia sobre la resistencia"
    texto: "Con el radio mucho mayor que δ, la corriente va por una corona de espesor δ. Mueva la frecuencia y el diámetro."
    libro: [339, 340, 341]
    inicio: { f_p: 1000000 }
    ec: 340
    sustitucion: "{{a_h}} / (2 · {{delta}}) = {{k_ac}}"
    widget:
      tipo: grafica
      x: { id: nu, min: 10000, max: 1000000000, unidad: Hz, rotulo: "f", escala: log }
      y: { min: 1, max: 1000, unidad: "", rotulo: "R_{ac}/R_{dc}", escala: log }
      curvas:
        - { expr: "max(1, d_h/2/(2*sqrt(1.72e-8/(pi*nu*4*pi*1e-7))))", color: azul, rotulo: "R_{ac}/R_{dc}" }
      asas:
        - { mueve: f_p, x: "f_p", y: "k_ac", rotulo: "Frecuencia" }
      lectura: { valor: k_ac, rotulo: "R_{ac}/R_{dc}" }
      mandos:
        - { valor: f_p, lista: [100000, 1000000, 10000000, 100000000], rotulo: "Frecuencia, f" }
        - { valor: d_h, lista: [0.001, 0.002], rotulo: "Diámetro, Ø" }
    comprobar:
      - { con: { f_p: 1000000, d_h: 0.001 }, k_ac: 3.79 }
      - { con: { f_p: 1000000, d_h: 0.002 }, k_ac: 7.58 }

  - id: hilo-gordo
    tipo: sorpresa
    titulo: "Engordar el hilo deja de servir"
    texto: "A 1 MHz, duplique el diámetro. En continua la resistencia baja a la cuarta parte; mire la efectiva."
    nota: "Crece la periferia, no la sección útil: de ahí el hilo de Litz."
    libro: [342]
    fijar: { f_p: 1000000 }
    inicio: { d_h: 0.001 }
    widget:
      tipo: grafica
      x: { id: dd, min: 0.0005, max: 0.0025, unidad: m, rotulo: "Ø" }
      y: { min: 0, max: 0.1, unidad: "Ω/m", rotulo: "R por metro" }
      curvas:
        - { expr: "1.72e-8/(pi*(dd/2)^2)", color: tinta, rotulo: "R_{dc}", discontinua: true }
        - { expr: "1.72e-8/(pi*(dd/2)^2)*max(1, dd/2/(2*delta))", color: naranja, rotulo: "R_{ac}" }
      asas:
        - { mueve: d_h, x: "d_h", y: "R_ac", rotulo: "Diámetro" }
      lectura: { valor: R_ac, rotulo: "R efectiva" }
      datos:
        - { valor: R_dc, rotulo: "En continua: {{R_dc}}" }
      mandos:
        - { valor: d_h, lista: [0.001, 0.002], rotulo: "Diámetro, Ø" }
    requiere: { mover: [d_h] }

  - id: por-que-piel
    tipo: porque
    titulo: "¿Por qué en la superficie?"
    texto: "¿Qué empuja la corriente alterna hacia la superficie del conductor?"
    libro: [333]
    opciones:
      - texto: "Las corrientes parásitas que induce su propio campo"
        bien: true
        porque: "El campo variable induce corrientes que se oponen a la principal en el centro y la refuerzan en la superficie."
      - texto: "La superficie tiene menos resistividad"
        porque: "El cobre es el mismo en todo el hilo. Lo que cambia es dónde circula la corriente."
      - texto: "La tensión es mayor en la superficie"
        porque: "La causa es magnética: corrientes inducidas por la ley de Faraday."

  - id: q-bobinas
    tipo: pregunta
    titulo: "La Q de las bobinas"
    texto: "Q = ωL/R. Con el efecto pelicular, R crece con √f mientras ωL crece con f. ¿Qué hace la Q al subir la frecuencia?"
    libro: [342]
    opciones:
      - texto: "Mejora, pero mucho más despacio"
        bien: true
        porque: "El numerador crece más deprisa que R, pero no tanto como con R constante; y acaba cayendo con otras pérdidas."
      - texto: "Crece en proporción a la frecuencia"
        porque: "Eso sería con R constante. Con R creciendo como √f, la mejora es mucho menor."
      - texto: "No cambia"
        porque: "Numerador y denominador no crecen al mismo ritmo: f frente a √f."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [331, 334, 340, 342]
    ideas:
      - { titulo: "Penetración.", texto: "δ = √(ρ/(π·f·µ)): casi un centímetro a 50 Hz, 66 µm a 1 MHz." }
      - { titulo: "Resistencia.", texto: "Con a ≫ δ, R_{ac}/R_{dc} ≈ a/(2δ): R = ρ·L/A es de continua o baja frecuencia." }
      - { titulo: "Consecuencias.", texto: "Engordar el hilo apenas ayuda (hilo de Litz) y la Q de las bobinas mejora despacio." }
