# Lección 1.1 de la sección 1.1 «Carga Eléctrica, Corriente, Tensión y Potencia» (cap01). Formato:
# contenido/lecciones11/GUIA.md.
leccion: cap01/sec-1.1

libro:
  6: 'e = "1,602"'
  7: "un solo culombio de carga representa la cantidad asombrosa de unos 6,242 × 10¹⁸ electrones"
  11: "la corriente es la cantidad de carga que atraviesa una sección transversal"
  14: "I = (Q)/(t)"
  15: "equivale a un culombio por segundo"
  17: "son los electrones (de carga negativa) los que realmente se mueven"
  18: "los resultados de los cálculos son siempre correctos"
  20: "es la energía potencial eléctrica por unidad de carga entre dos puntos"
  23: "la tensión es siempre una magnitud relativa"
  24: "La punta negra (COM) se conecta a la referencia"
  26: "la potencia entregada o disipada es el producto de ambas magnitudes"
  27: "P = V dot.op I"
  29: 'P = I^("2") dot.op R'
  31: "W = P dot.op t"
  32: "equivale a 3,6 millones de julios"
  33: "Una resistencia de 220 Ω se conecta a una fuente de 12 V"
  34: "I = Q/t solo vale en continua"
  "cap01#345": "Por una resistencia de 470 Ω circula una corriente de 25 mA"

modelo:
  valores:
    I_a: { sim: "I", nombre: "corriente constante", unidad: A, valor: 1 }
    Q_b: { sim: "Q", nombre: "carga transferida", unidad: C, valor: 30 }
    t_b: { sim: "t", nombre: "tiempo empleado", unidad: s, valor: 20 }
    I_p: { sim: "I_{p}", nombre: "pico de la corriente alterna", unidad: A, valor: 1 }
    f_s: { sim: "f", nombre: "frecuencia de la corriente alterna", unidad: Hz, valor: 50 }
    t_e: { sim: "t", nombre: "final del intervalo", unidad: s, valor: 0.005 }
    V_o: { sim: "V", nombre: "tensión de la fuente", unidad: V, valor: 12 }
    R_o: { sim: "R", nombre: "resistencia", unidad: Ω, valor: 220 }
    t_o: { sim: "t", nombre: "tiempo encendida", unidad: s, valor: 1800 }
  calculos:
    n_e: { expr: "I_a/1.602e-19", sim: "n", nombre: "electrones por segundo", unidad: "", cifras: 3 }
    Q_a: { expr: "I_a*10", sim: "Q", nombre: "carga en diez segundos", unidad: C }
    I_b: { expr: "Q_b/t_b", sim: "I", nombre: "corriente", unidad: A }
    w_s: { expr: "2*pi*f_s", sim: "ω", nombre: "frecuencia angular", unidad: "rad/s" }
    I_med: { expr: "I_p*(1 - cos(w_s*t_e))/(w_s*t_e)", sim: "Q/t", nombre: "carga entre tiempo", unidad: A }
    I_o: { expr: "V_o/R_o", sim: "I", nombre: "corriente", unidad: A }
    P_o: { expr: "V_o*I_o", sim: "P", nombre: "potencia disipada", unidad: W }
    W_o: { expr: "P_o*t_o", sim: "W", nombre: "energía en media hora", unidad: J }

tarjetas:
  - id: explore-carga
    tipo: explorar
    titulo: "La corriente: carga que pasa"
    texto: "Mueva la corriente. La recta es la carga que ha atravesado el cable; cuanto más empinada, más carga por segundo."
    libro: [11, 15]
    widget:
      tipo: grafica
      x: { id: t, min: 0, max: 10, unidad: s, rotulo: "t" }
      y: { min: 0, max: 20, unidad: C, rotulo: "Q" }
      curvas:
        - { expr: "I_a*t", color: azul, rotulo: "carga, Q" }
      marcas:
        - { x: "10", y: "Q_a", rotulo: "{{Q_a}}" }
      lectura: { valor: n_e, rotulo: "Electrones por segundo" }
      mandos:
        - { valor: I_a, min: 0.2, max: 2, paso: 0.1, rotulo: "Corriente, I" }

  - id: prediga-electrones
    tipo: predecir
    titulo: "Prediga"
    texto: "Un electrón lleva 1,602 × 10⁻¹⁹ C. ¿Cuántos electrones por segundo son un amperio?"
    libro: [6, 7, 15]
    fijar: { I_a: 1 }
    widget:
      tipo: grafica
      x: { id: t, min: 0, max: 10, unidad: s, rotulo: "t" }
      y: { min: 0, max: 20, unidad: C, rotulo: "Q" }
      curvas:
        - { expr: "I_a*t", color: azul, rotulo: "carga, Q" }
      lectura: { valor: n_e, rotulo: "Electrones por segundo" }
      ocultar: true
    opciones:
      - texto: "Unos 6,242 × 10¹⁸"
        bien: true
        porque: "Un amperio es un culombio por segundo, y un culombio son unos 6,242 × 10¹⁸ electrones: más de seis trillones."
      - texto: "1,602 × 10⁻¹⁹"
        porque: "Esa es la carga de un solo electrón, en culombios. Hacen falta muchísimos para sumar uno."
      - texto: "Uno"
        porque: "Un amperio es un culombio por segundo, no un electrón. Por eso la corriente se trata como algo continuo."
    comprobar:
      - { n_e: 6.242e18, tol: 0.001 }
    escalera:
      - "Un amperio es un culombio por segundo: divida un culombio entre la carga de un electrón."
    solucion: "1/(1,602 × 10⁻¹⁹): unos 6,242 × 10¹⁸ electrones cada segundo."

  - id: regla-corriente
    tipo: formula
    titulo: "Corriente constante"
    texto: "Si la corriente no cambia, basta dividir la carga transferida entre el tiempo empleado. Arrastre el punto."
    nota: "Un amperio equivale a un culombio por segundo."
    libro: [14, 15]
    ec: 14
    sustitucion: "{{Q_b}} / {{t_b}} = {{I_b}}"
    widget:
      tipo: grafica
      x: { id: t, min: 0, max: 60, unidad: s, rotulo: "t" }
      y: { min: 0, max: 60, unidad: C, rotulo: "Q" }
      curvas:
        - { expr: "I_b*t", color: azul, rotulo: "carga, Q" }
      asas:
        - { mueve: Q_b, x: "t_b", y: "Q_b", rotulo: "Carga transferida" }
      lectura: { valor: I_b, rotulo: "Corriente" }
      mandos:
        - { valor: Q_b, min: 5, max: 60, paso: 5, rotulo: "Carga, Q" }
        - { valor: t_b, min: 5, max: 60, paso: 5, rotulo: "Tiempo, t" }

  - id: senoide-cero
    tipo: sorpresa
    titulo: "¿Ninguna corriente?"
    texto: "Una corriente alterna circula de verdad. Lleve el final del intervalo hasta un periodo completo y mire Q/t."
    nota: "I = Q/t solo vale en continua: con corriente variable da el valor medio."
    libro: [34]
    inicio: { t_e: 0.005 }
    widget:
      tipo: grafica
      x: { id: t, min: 0, max: 0.02, unidad: s, rotulo: "t" }
      y: { min: -1.2, max: 1.2, unidad: A, rotulo: "i" }
      curvas:
        - { expr: "I_p*sin(w_s*t)", color: azul, rotulo: "i(t)" }
        - { expr: "I_med", color: naranja, rotulo: "Q/t", discontinua: true }
      asas:
        - { mueve: t_e, x: "t_e", y: "I_med", rotulo: "Final del intervalo" }
      lectura: { valor: I_med, rotulo: "Q/t" }
      mandos:
        - { valor: t_e, min: 0.001, max: 0.02, paso: 0.001, rotulo: "Final del intervalo" }
    requiere: { mover: [t_e] }

  - id: sentido-electrones
    tipo: pregunta
    titulo: "Convención frente a realidad"
    texto: "Los puntos que circulan van del + al −: es la corriente convencional. ¿Hacia dónde se mueven los electrones del cable?"
    libro: [17, 18]
    widget:
      tipo: circuito
      esquema: resistencia
      piezas: { fuente: V_o, r: R_o }
      lectura: { valor: I_o, rotulo: "Corriente" }
      corriente: I_o
      mide: { corriente: I_o, tension: V_o }
    opciones:
      - texto: "Del − al +, al revés que los puntos"
        bien: true
        porque: "En un metal se mueven los electrones, de carga negativa, del terminal negativo al positivo. Los cálculos salen igual."
      - texto: "Del + al −, como los puntos"
        porque: "Ese sentido lo fijó Franklin por convenio, antes de descubrirse el electrón. Los electrones van al revés."
      - texto: "No se mueven: solo viaja la energía"
        porque: "Sí se mueven: los electrones libres del metal son precisamente los protagonistas de la corriente."
    escalera:
      - "Los electrones tienen carga negativa."
    solucion: "Del − al +: al revés que la corriente convencional, que se fijó antes de descubrirse el electrón."

  - id: tension-relativa
    tipo: pregunta
    titulo: "La tensión, entre dos puntos"
    texto: "La tensión es energía por unidad de carga entre dos puntos; sola, en un punto, no significa nada. ¿Dónde va la punta negra (COM) del multímetro?"
    libro: [20, 23, 24]
    opciones:
      - texto: "A la referencia, la masa; la roja, al punto que se mide"
        bien: true
        porque: "La masa es el 0 V de referencia. Conectarla mal da medidas erróneas y, en potencia, cortocircuitos."
      - texto: "Al punto de mayor tensión, para leer en positivo"
        porque: "La negra marca la referencia, no el punto alto. Lo que se mide es la roja respecto a la negra."
      - texto: "Da igual: la tensión es de cada punto"
        porque: "La tensión es relativa: siempre se mide entre dos puntos. Por eso hay dos puntas."
    widget:
      tipo: circuito
      esquema: resistencia
      piezas: { fuente: V_o, r: R_o }
      lectura: { valor: V_o, rotulo: "Tensión entre los extremos" }
      corriente: I_o
      mide: { corriente: I_o, tension: V_o }
      mandos: []
    escalera:
      - "La tensión siempre se mide entre dos puntos, y uno de ellos es la referencia."
    solucion: "La negra (COM), a la masa, el 0 V de referencia; la roja, al punto que se mide."

  - id: explore-potencia
    tipo: explorar
    titulo: "Potencia: tensión por corriente"
    texto: "Mueva la tensión y la resistencia. Fíjese en cómo cambian la corriente y la potencia que la resistencia convierte en calor."
    libro: [26, 27]
    widget:
      tipo: circuito
      esquema: resistencia
      piezas: { fuente: V_o, r: R_o }
      lectura: { valor: P_o, rotulo: "Potencia disipada" }
      datos:
        - { valor: I_o, rotulo: "Corriente: {{I_o}}" }
      corriente: I_o
      mide: { corriente: I_o, tension: V_o }
      mandos:
        - { valor: V_o, min: 1, max: 24, paso: 1, rotulo: "Tensión, V" }
        - { valor: R_o, serie: E12, min: 100, max: 1000, rotulo: "R (E12)" }
    requiere: { mover: [V_o, R_o] }

  - id: prediga-potencia
    tipo: predecir
    titulo: "Prediga"
    texto: "Una resistencia de 220 Ω en una fuente de 12 V deja pasar 54,5 mA. ¿Qué potencia disipa?"
    libro: [33]
    fijar: { V_o: 12, R_o: 220 }
    widget:
      tipo: circuito
      esquema: resistencia
      piezas: { fuente: V_o, r: R_o }
      lectura: { valor: P_o, rotulo: "Potencia disipada" }
      corriente: I_o
      mide: { corriente: I_o, tension: V_o }
      ocultar: true
    opciones:
      - texto: "0,655 W"
        bien: true
        porque: "P = V·I = 12 × 0,0545 = 0,655 W. Con V²/R sale lo mismo: 144/220."
      - texto: "0,0545 W"
        porque: "Ese número es la corriente en amperios. Falta multiplicarla por los 12 V."
      - texto: "1 W"
        porque: "1 W es la potencia nominal que el libro recomienda, con holgura. Lo que disipa es menos."
    comprobar:
      - { I_o: 0.0545, P_o: 0.655 }
    escalera:
      - "P = V·I: multiplique los 12 V por la corriente en amperios."
    solucion: "12 × 0,0545 = 0,655 W."

  - id: regla-potencia
    tipo: formula
    titulo: "Dos formas más"
    texto: "Con la ley de Ohm, P = V·I se escribe con la corriente o con la tensión. En serie manda la corriente; en paralelo, la tensión."
    libro: [27, 29]
    ec: 29
    sustitucion: "{{I_o}}² · {{R_o}} = {{V_o}}² / {{R_o}} = {{P_o}}"
    widget:
      tipo: circuito
      esquema: resistencia
      piezas: { fuente: V_o, r: R_o }
      lectura: { valor: P_o, rotulo: "Potencia disipada" }
      corriente: I_o
      mide: { corriente: I_o, tension: V_o }
      mandos:
        - { valor: V_o, min: 1, max: 24, paso: 1, rotulo: "Tensión, V" }
        - { valor: R_o, serie: E12, min: 100, max: 1000, rotulo: "R (E12)" }

  - id: reto-470
    tipo: reto
    titulo: "Reto: 25 mA por 470 Ω"
    texto: "Ajuste la fuente para que circulen 25 mA por la resistencia de 470 Ω (± 2 %). Luego mire la potencia."
    libro: ["cap01#345"]
    fijar: { R_o: 470 }
    inicio: { V_o: 5 }
    widget:
      tipo: circuito
      esquema: resistencia
      piezas: { fuente: V_o, r: R_o }
      lectura: { valor: I_o, rotulo: "Corriente" }
      datos:
        - { valor: P_o, rotulo: "Potencia: {{P_o}}" }
      corriente: I_o
      mide: { corriente: I_o, tension: V_o }
      mandos:
        - { valor: V_o, min: 0, max: 20, paso: 0.25, rotulo: "Tensión, V" }
    condiciones:
      - { valor: I_o, objetivo: 0.025, tol: 0.02, rotulo: "Corriente: {{I_o}}" }
    exito: "Hacen falta 11,75 V, y disipa 0,294 W: una resistencia de 1/4 W no basta. El libro pide una de 1/2 W."
    pistas:
      - { cuando: { valor: I_o, mayor: 0.0255 }, texto: "Pasa demasiada corriente: baje la tensión." }
      - { cuando: { valor: I_o, menor: 0.0245 }, texto: "Falta corriente: suba la tensión." }
    escalera:
      - "Por la ley de Ohm, la tensión es la corriente por la resistencia."
    solucion: "V = I·R = 0,025 × 470 = 11,75 V."
    comprobar:
      - { con: { V_o: 11.75 }, I_o: 0.025, P_o: 0.294 }

  - id: por-que-led
    tipo: porque
    titulo: "¿Por qué no en un LED?"
    texto: "P = V·I vale para un diodo, un motor o una batería. ¿Por qué aplicar V²/R a un LED es un error grave?"
    libro: [34]
    opciones:
      - texto: "Porque no es óhmico: V/I no es constante"
        bien: true
        porque: "P = I²R y P = V²/R heredan la restricción de la ley de Ohm. En un LED no hay una R que poner."
      - texto: "Porque un LED da luz y no calor"
        porque: "Lo que importa es el cociente V/I, que en un LED cambia con la corriente. P = V·I sí vale."
      - texto: "Porque V²/R solo vale en alterna"
        porque: "Vale en continua y en alterna, pero solo para elementos óhmicos, y el LED no lo es."
    widget:
      tipo: figura
      figura: fig-1.1
      zonas:
        - { id: magnitudes, rotulo: "Las cuatro magnitudes", rect: [0, 0, 453, 226] }
    escalera:
      - "P = V²/R sale de la ley de Ohm: ¿es V/I constante en un LED?"
    solucion: "El LED no es óhmico: V/I cambia con la corriente y V²/R no vale. P = V·I, sí."

  - id: energia-media-hora
    tipo: pregunta
    fase: "Estime"
    titulo: "Energía: potencia por tiempo"
    texto: "La resistencia de 220 Ω disipa 0,655 W. Estime la energía que consume en media hora, 1800 segundos."
    libro: [31, 32, 33]
    fijar: { V_o: 12, R_o: 220, t_o: 1800 }
    estimar:
      objetivo: "W_o"
      unidad: J
      min: 0
      max: 3000
      paso: 10
      inicio: 2500
      tol: 0.05
      rotulo: "Energía en media hora"
    exito: "W = P·t = 0,655 × 1800 = 1178 J, o 0,327 Wh. En casa se factura en kWh: 3,6 millones de julios cada uno."
    pistas:
      - { cuando: { valor: estimacion, mayor: 1237 }, texto: "Se ha pasado: multiplique 0,655 W por 1800 s." }
      - { texto: "Se ha quedado corto: un vatio son un julio cada segundo, y hay 1800 segundos." }
    comprobar:
      - { W_o: 1178, tol: 0.002 }
    escalera:
      - "W = P·t, con el tiempo en segundos."
    solucion: "W = P·t = 0,655 × 1800 = 1178 J, o 0,327 Wh. En casa se factura en kWh: 3,6 millones de julios cada uno."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [14, 17, 23, 27, 29, 34]
    ideas:
      - { titulo: "Corriente.", texto: "Carga por unidad de tiempo: un amperio es un culombio por segundo. I = Q/t solo en continua." }
      - { titulo: "Tensión.", texto: "Energía por unidad de carga, siempre entre dos puntos: la masa es la referencia de 0 V." }
      - { titulo: "Potencia.", texto: "P = V·I vale siempre; P = I²R y P = V²/R, solo en elementos óhmicos." }
      - { titulo: "Energía.", texto: "W = P·t: la potencia por el tiempo que dura." }
