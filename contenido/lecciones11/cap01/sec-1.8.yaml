# Lección 1.1 de la sección 1.8 «Energía, Rendimiento y Autonomía» (cap01). Formato: contenido/lecciones11/GUIA.md.
leccion: cap01/sec-1.8

libro:
  157: "la energía es la cantidad total, y se obtiene multiplicando la potencia por el tiempo"
  158: "un aparato de mucha potencia usado un minuto gasta menos energía que uno de poca usado todo el día"
  160: "Una pila no almacena vatios, almacena carga"
  161: 'E = "2 Ah" times "1,5 V"'
  162: "la autonomía teórica es capacidad dividida por consumo"
  163: "Autonomía teórica"
  165: "Una alcalina que da 2 000 mAh a 50 mA puede dar solo 1 200 a 500 mA"
  167: "Una alcalina pierde un 2 o 3 % al año"
  169: "Un nodo que toma 8 mA durante 5 ms cada segundo y 3 µA el resto del tiempo consume 43 µA de media"
  170: "no reducir el consumo activo, sino el tiempo activo"
  172: "El rendimiento es la potencia útil dividida por la absorbida"
  173: "0,9 × 0,85 × 0,95 = 72,7 %"
  174: "generar cada tensión directamente desde la principal en lugar de en cascada"
  "cap01#345": "Un regulador lineal baja de 9 V a 3,3 V entregando 0,5 A"

modelo:
  valores:
    Q_ah: { sim: "capacidad", nombre: "capacidad de la pila", unidad: Ah, valor: 2 }
    I_c: { sim: "I", nombre: "consumo", unidad: A, valor: 0.05 }
    V_b: { sim: "V", nombre: "tensión de la pila", unidad: V, valor: 1.5 }
    alta: { tipo: interruptor, nombre: "consumo alto", valor: 0 }
    I_act: { sim: "I_{activo}", nombre: "corriente despierto", unidad: A, valor: 0.008 }
    t_on: { sim: "t_{activo}", nombre: "tiempo despierto cada segundo", unidad: s, valor: 0.005 }
    I_dor: { sim: "I_{reposo}", nombre: "corriente dormido", unidad: A, valor: 3e-6 }
    e_1: { sim: "η₁", nombre: "rendimiento de la fuente", unidad: "%", valor: 100 }
    e_2: { sim: "η₂", nombre: "rendimiento del convertidor", unidad: "%", valor: 100 }
    e_3: { sim: "η₃", nombre: "rendimiento del regulador", unidad: "%", valor: 100 }
    V_in: { sim: "V_{entrada}", nombre: "entrada del regulador", unidad: V, valor: 9 }
    V_out: { sim: "V_{salida}", nombre: "salida del regulador", unidad: V, valor: 3.3 }
    I_o: { sim: "I", nombre: "corriente de salida", unidad: A, valor: 0.5 }
  calculos:
    aut: { expr: "Q_ah/I_c", sim: "autonomía", nombre: "autonomía teórica", unidad: h }
    E_wh: { expr: "Q_ah*V_b", sim: "E", nombre: "energía de la pila", unidad: Wh }
    E_j: { expr: "E_wh*3600", sim: "E", nombre: "energía en julios", unidad: J }
    I_pk: { si: alta, entonces: "0.5", sino: "0.05", sim: "I", nombre: "consumo", unidad: A }
    Q_real: { si: alta, entonces: "1.2", sino: "2", sim: "capacidad real", nombre: "capacidad real de la alcalina", unidad: Ah }
    aut_r: { expr: "Q_real/I_pk", sim: "autonomía real", nombre: "autonomía real", unidad: h }
    aut_t: { expr: "2/I_pk", sim: "autonomía teórica", nombre: "autonomía teórica", unidad: h }
    I_med: { expr: "I_act*t_on + I_dor*(1 - t_on)", sim: "I_{media}", nombre: "consumo medio", unidad: A }
    anos: { expr: "2/I_med/8760", sim: "autonomía", nombre: "autonomía teórica en años", unidad: "años" }
    eta_t: { expr: "e_1*e_2*e_3/10000", sim: "η", nombre: "rendimiento total", unidad: "%" }
    caida: { expr: "V_in - V_out", sim: "caída", nombre: "caída en el regulador", unidad: V }
    P_dis: { expr: "(V_in - V_out)*I_o", sim: "P_{disipada}", nombre: "potencia disipada en el regulador", unidad: W }
    eta_r: { expr: "V_out/V_in*100", sim: "η", nombre: "rendimiento del regulador", unidad: "%", cifras: 2 }

tarjetas:
  - id: explore-autonomia
    tipo: explorar
    titulo: "¿Cuánto dura una pila?"
    texto: "Mueva el consumo y la capacidad. La autonomía teórica es la capacidad dividida por el consumo: mucha corriente, poco tiempo."
    libro: [158, 162, 163]
    widget:
      tipo: grafica
      x: { id: ii, min: 0.005, max: 1, unidad: A, rotulo: "consumo", escala: log }
      y: { min: 1, max: 1000, unidad: h, rotulo: "autonomía", escala: log }
      curvas:
        - { expr: "Q_ah/ii", color: azul, rotulo: "autonomía teórica" }
      asas:
        - { mueve: I_c, x: "I_c", y: "aut", rotulo: "Consumo" }
      lectura: { valor: aut, rotulo: "Autonomía teórica" }
      mandos:
        - { valor: I_c, lista: [0.005, 0.01, 0.02, 0.05, 0.1, 0.2, 0.5, 1], rotulo: "Consumo, I" }
        - { valor: Q_ah, lista: [1, 2, 3], rotulo: "Capacidad" }
    requiere: { mover: [I_c, Q_ah] }

  - id: prediga-energia
    tipo: predecir
    titulo: "Prediga"
    texto: "Una AA alcalina tiene 2 000 mAh a 1,5 V. ¿Cuánta energía contiene?"
    libro: [160, 161]
    fijar: { Q_ah: 2, V_b: 1.5 }
    widget:
      tipo: grafica
      x: { id: qq, min: 0, max: 3, unidad: Ah, rotulo: "capacidad" }
      y: { min: 0, max: 5, unidad: Wh, rotulo: "E" }
      curvas:
        - { expr: "qq*V_b", color: naranja, rotulo: "energía a 1,5 V" }
      lectura: { valor: E_wh, rotulo: "Energía" }
      ocultar: true
    opciones:
      - texto: "3,0 Wh"
        bien: true
        porque: "2 Ah × 1,5 V = 3,0 Wh, que son 10 800 J."
      - texto: "3 000 Wh"
        porque: "Son miliamperios-hora: 2 000 mAh son 2 Ah. El resultado es mil veces menor."
      - texto: "2 000 mAh: eso ya es la energía"
        porque: "Los mAh son carga, no energía: falta multiplicar por la tensión."
    comprobar:
      - { E_wh: 3.0, E_j: 10800 }

  - id: regla-energia
    tipo: formula
    titulo: "Carga por tensión"
    texto: "Una pila no almacena vatios: almacena carga, en mAh. La energía es esa carga por la tensión."
    nota: "Potencia por tiempo: un vatio durante una hora es un vatio-hora."
    libro: [157, 160, 161]
    ec: 161
    sustitucion: "{{Q_ah}} × {{V_b}} = {{E_wh}} = {{E_j}}"
    widget:
      tipo: grafica
      x: { id: qq, min: 0, max: 3, unidad: Ah, rotulo: "capacidad" }
      y: { min: 0, max: 12, unidad: Wh, rotulo: "E" }
      curvas:
        - { expr: "qq*V_b", color: naranja, rotulo: "energía" }
      asas:
        - { mueve: Q_ah, x: "Q_ah", y: "E_wh", rotulo: "Capacidad" }
      lectura: { valor: E_wh, rotulo: "Energía" }
      mandos:
        - { valor: Q_ah, lista: [1, 2, 3], rotulo: "Capacidad" }
        - { valor: V_b, lista: [1.2, 1.5, 3.7], rotulo: "Tensión, V" }

  - id: estime-autonomia
    tipo: pregunta
    fase: "Estime"
    titulo: "Una batería de 3,7 V"
    texto: "Una batería de 3,7 V y 2500 mAh alimenta un equipo que consume 50 mA de media. Estime su autonomía."
    libro: ["cap01#345"]
    fijar: { Q_ah: 2.5, V_b: 3.7, I_c: 0.05 }
    estimar:
      objetivo: "aut"
      unidad: h
      min: 0
      max: 200
      paso: 1
      inicio: 150
      tol: 0.05
      rotulo: "Autonomía"
    exito: "2500 mAh / 50 mA = 50 h, y guarda 2,5 Ah × 3,7 V = 9,25 Wh. Algo menos en la práctica."
    pistas:
      - { cuando: { valor: estimacion, mayor: 52 }, texto: "Se ha pasado: divida los 2500 mAh entre los 50 mA." }
      - { texto: "Se ha quedado corto: la tensión no entra en la autonomía; solo capacidad entre consumo." }
    comprobar:
      - { aut: 50, E_wh: 9.25 }

  - id: peukert
    tipo: sorpresa
    titulo: "Teórica, y esa palabra importa"
    texto: "Una alcalina de 2 000 mAh. Suba el consumo a 500 mA y compare la autonomía real con la teórica."
    nota: "Efecto Peukert: a más corriente, menos capacidad."
    libro: [163, 165]
    inicio: { alta: 0 }
    widget:
      tipo: grafica
      x: { id: ii, min: 0.01, max: 1, unidad: A, rotulo: "consumo", escala: log }
      y: { min: 1, max: 1000, unidad: h, rotulo: "autonomía", escala: log }
      curvas:
        - { expr: "2/ii", color: tinta, rotulo: "teórica", discontinua: true }
      marcas:
        - { x: "I_pk", y: "aut_r", rotulo: "real: {{aut_r}}" }
      lectura: { valor: aut_r, rotulo: "Autonomía real" }
      datos:
        - { valor: aut_t, rotulo: "Teórica: {{aut_t}}" }
        - { valor: Q_real, rotulo: "Capacidad: {{Q_real}}" }
      mandos:
        - { valor: alta, tipo: interruptor, rotulo: "Consumo de 500 mA" }
    requiere: { mover: [alta] }
    comprobar:
      - { con: { alta: 1 }, aut_t: 4, aut_r: 2.4 }
      - { aut_t: 40 }

  - id: autodescarga
    tipo: pregunta
    fase: "Empareje"
    titulo: "La autodescarga"
    texto: "En un aparato que duerme casi siempre, la autodescarga puede superar al consumo. Empareje cada química con la suya."
    libro: [167]
    emparejar:
      - ["Alcalina", "Un 2 o 3 % al año"]
      - ["NiMH normal", "Hasta un 20 % al mes"]
      - ["NiMH de baja autodescarga", "Un 15 % al año"]
      - ["Litio", "Menos del 1 % anual"]
    exito: "Entonces cambiar de química importa más que optimizar el firmware."
    pistas:
      - { texto: "La NiMH normal es con diferencia la peor: se mide por meses, no por años." }

  - id: consumo-medio
    tipo: explorar
    titulo: "Despierto y dormido"
    texto: "Un nodo despierta cada segundo y vuelve a dormir. Mueva el tiempo despierto y la corriente despierto: decide la media."
    nota: "Es más eficaz reducir el tiempo activo que el consumo activo."
    libro: [169, 170]
    inicio: { I_act: 0.008, t_on: 0.05 }
    widget:
      tipo: grafica
      x: { id: t, min: 0, max: 2, unidad: s, rotulo: "t" }
      y: { min: 0, max: 0.01, unidad: A, rotulo: "i" }
      curvas:
        - { expr: "I_dor + (I_act - I_dor)*floor(1 + t_on - (t - floor(t)))", color: azul, rotulo: "consumo" }
        - { expr: "I_med", color: naranja, rotulo: "media", discontinua: true }
      lectura: { valor: I_med, rotulo: "Consumo medio" }
      datos:
        - { valor: anos, rotulo: "Con 2000 mAh: {{anos}}" }
      mandos:
        - { valor: t_on, lista: [0.005, 0.01, 0.02, 0.05, 0.1], rotulo: "Despierto, t_{activo}" }
        - { valor: I_act, lista: [0.004, 0.008], rotulo: "Corriente despierto" }
    requiere: { mover: [t_on] }
    comprobar:
      - { con: { t_on: 0.005, I_act: 0.008 }, I_med: 43e-6 }

  - id: explore-cascada
    tipo: explorar
    titulo: "Etapas en cadena"
    texto: "Tres etapas convierten la energía una tras otra. Baje el rendimiento de cada una y mire cuánto llega al final."
    libro: [172]
    inicio: { e_1: 100, e_2: 100, e_3: 100 }
    widget:
      tipo: grafica
      x: { id: k, min: 0, max: 3.99, unidad: "", rotulo: "etapa" }
      y: { min: 0, max: 100, unidad: "%", rotulo: "potencia que queda" }
      curvas:
        - { expr: "100*(e_1/100)^min(1, floor(k))*(e_2/100)^min(1, max(0, floor(k) - 1))*(e_3/100)^max(0, floor(k) - 2)", color: azul, rotulo: "potencia" }
      lectura: { valor: eta_t, rotulo: "Rendimiento total" }
      mandos:
        - { valor: e_1, min: 50, max: 100, paso: 5, rotulo: "Fuente, η₁" }
        - { valor: e_2, min: 50, max: 100, paso: 5, rotulo: "Convertidor, η₂" }
        - { valor: e_3, min: 50, max: 100, paso: 5, rotulo: "Regulador, η₃" }
    requiere: { mover: [e_1, e_2] }

  - id: prediga-cascada
    tipo: predecir
    titulo: "Prediga"
    texto: "Una fuente del 90 %, un convertidor del 85 % y un regulador del 95 %. ¿Qué rendimiento total dan?"
    libro: [173]
    fijar: { e_1: 90, e_2: 85, e_3: 95 }
    widget:
      tipo: grafica
      x: { id: k, min: 0, max: 3.99, unidad: "", rotulo: "etapa" }
      y: { min: 0, max: 100, unidad: "%", rotulo: "potencia que queda" }
      curvas:
        - { expr: "100*(e_1/100)^min(1, floor(k))*(e_2/100)^min(1, max(0, floor(k) - 1))*(e_3/100)^max(0, floor(k) - 2)", color: azul, rotulo: "potencia" }
      lectura: { valor: eta_t, rotulo: "Rendimiento total" }
      ocultar: true
    opciones:
      - texto: "72,7 %"
        bien: true
        porque: "Se multiplican: 0,9 × 0,85 × 0,95. Más de una cuarta parte se pierde, sin que ninguna etapa parezca mala."
      - texto: "85 %, el de la peor"
        porque: "La peor no pone el límite sola: cada etapa se lleva su parte de lo que le llega."
      - texto: "90 %, la media"
        porque: "Los rendimientos no se promedian: se multiplican, y el total es menor que cualquiera."
    comprobar:
      - { eta_t: 72.7 }

  - id: estime-regulador
    tipo: pregunta
    fase: "Estime"
    titulo: "Un regulador lineal"
    texto: "Un regulador lineal baja de 9 V a 3,3 V entregando 0,5 A. Estime la potencia que disipa."
    libro: ["cap01#345"]
    fijar: { V_in: 9, V_out: 3.3, I_o: 0.5 }
    estimar:
      objetivo: "P_dis"
      unidad: W
      min: 0
      max: 5
      paso: 0.05
      inicio: 4.5
      tol: 0.03
      rotulo: "Potencia disipada"
    exito: "(9 − 3,3) × 0,5 = 2,85 W. Su rendimiento es 3,3/9, un 37 %: el resto se va en calor."
    pistas:
      - { cuando: { valor: estimacion, mayor: 2.94 }, texto: "Se ha pasado: lo que disipa es la caída, 9 − 3,3 V, por la corriente." }
      - { texto: "Se ha quedado corto: la caída es 5,7 V, con medio amperio." }
    comprobar:
      - { P_dis: 2.85, eta_r: 36.7 }
      - { con: { V_in: 3.3 }, P_dis: 0 }
      - { caida: 5.7 }

  - id: por-que-directa
    tipo: porque
    titulo: "¿Cascada o directa?"
    texto: "El libro recomienda generar cada tensión directamente desde la principal. ¿Por qué no en cascada?"
    libro: [173, 174]
    opciones:
      - texto: "Los rendimientos de la cadena se multiplican"
        bien: true
        porque: "Cada etapa añadida multiplica por un número menor que uno: cuantas menos en el camino, menos se pierde."
      - texto: "En cascada la tensión final sale peor regulada"
        porque: "El argumento del libro es la energía: la multiplicación de rendimientos."
      - texto: "Cada etapa en cascada consume la misma potencia"
        porque: "Cada una pierde una fracción de lo que le llega, y esas fracciones se multiplican."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [157, 160, 165, 169, 173]
    ideas:
      - { titulo: "Energía.", texto: "Potencia por tiempo. Una pila guarda carga: energía = capacidad × tensión." }
      - { titulo: "Autonomía.", texto: "Capacidad entre consumo, teórica: Peukert, la tensión de corte y la autodescarga la recortan." }
      - { titulo: "Consumo medio.", texto: "La media ponderada en el tiempo: reduzca el tiempo despierto." }
      - { titulo: "Rendimiento.", texto: "Útil entre absorbida; en cascada, se multiplica." }
