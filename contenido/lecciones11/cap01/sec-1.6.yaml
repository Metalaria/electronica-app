# Lección 1.1 de la sección 1.6 «Corriente Alterna y Valores Característicos» (cap01). Formato:
# contenido/lecciones11/GUIA.md.
# 1.2.1 (autor121-fund, «aprender haciendo», GUIA §13): construir la senoide del ejercicio, marcar la componente
# continua de una rectificada, conseguir una potencia media, predecir el pico de la red y la potencia de 17 V,
# marcar el eficaz de una cuadrada y cambiar de forma de onda ante el promediador; solo el True RMS se elige.
leccion: cap01/sec-1.6

libro:
  130: "también es continua, aunque no constante"
  131: 'v lr(( t )) = V_("p")'
  132: "ω = 2πf es la frecuencia angular en radianes por segundo"
  134: "es el valor de tensión continua que produciría exactamente la misma disipación de calor en una resistencia"
  135: 'V_("RMS") = (V_("p"))/(sqrt("2"))'
  136: "el valor de pico real alcanza 230 × √2 ≈ 325 V"
  137: "rectifican la señal, toman su valor medio y lo multiplican por 1,11"
  139: "Vp fija la altura, ω = 2πf el ritmo, y φ el desplazamiento temporal"
  140: "con una cuadrada simétrica lee 1,11·Vp, un 11 % de más"
  "cap01#345": "Una señal sinusoidal tiene un valor de pico de 17 V"

modelo:
  valores:
    V_p: { sim: "V_{p}", nombre: "valor de pico", unidad: V, valor: 17 }
    f: { sim: "f", nombre: "frecuencia", unidad: Hz, valor: 50 }
    phi: { sim: "φ", nombre: "fase inicial", unidad: "°", valor: 0 }
    R_c: { sim: "R", nombre: "resistencia de carga", unidad: Ω, valor: 100 }
    V_ef: { sim: "V_{RMS}", nombre: "eficaz de la red", unidad: V, valor: 230 }
    cuad: { tipo: interruptor, nombre: "onda cuadrada", valor: 0 }
  calculos:
    w: { expr: "2*pi*f", sim: "ω", nombre: "frecuencia angular", unidad: "rad/s" }
    T: { expr: "1/f", sim: "T", nombre: "periodo", unidad: s }
    V_rms: { expr: "V_p/sqrt(2)", sim: "V_{RMS}", nombre: "valor eficaz", unidad: V, cifras: 4 }
    V_med: { expr: "2*V_p/pi", sim: "V_{medio}", nombre: "valor medio de la senoide rectificada", unidad: V }
    P_m: { expr: "V_rms^2/R_c", sim: "P", nombre: "potencia media", unidad: W }
    P_pico: { expr: "V_p^2/R_c", sim: "P_{pico}", nombre: "potencia calculada con el pico", unidad: W }
    V_pr: { expr: "V_ef*sqrt(2)", sim: "V_{p}", nombre: "pico de la red", unidad: V }
    V_mal: { expr: "V_ef/sqrt(2)", sim: "V_{ef}·0,707", nombre: "eficaz por 0,707", unidad: V }
    V_true: { si: cuad, entonces: "V_p", sino: "V_p/sqrt(2)", sim: "V_{RMS}", nombre: "eficaz verdadero", unidad: V }
    V_mr: { si: cuad, entonces: "V_p", sino: "2*V_p/pi", sim: "medio", nombre: "valor medio rectificado", unidad: V }
    V_mult: { expr: "1.11*V_mr", sim: "lectura", nombre: "lectura del multímetro promediador", unidad: V }
    err_m: { expr: "(V_mult - V_true)/V_true*100", sim: "error", nombre: "error del multímetro", unidad: "%", cifras: 2 }
    t_cresta: { expr: "(90 - phi - 360*floor((90 - phi)/360))/(360*f)", nombre: "instante de la cresta", unidad: s }

tarjetas:
  - id: explore-senoide
    tipo: explorar
    titulo: "La señal senoidal"
    texto: "Cada mando cambia una sola cosa de la curva. Construya la senoide del ejercicio: 17 V de pico, 50 Hz y que en t = 0 esté en su cresta."
    libro: [131, 132, 139, "cap01#345"]
    inicio: { V_p: 10, f: 25, phi: 0 }
    widget:
      tipo: grafica
      x: { id: t, min: 0, max: 0.04, unidad: s, rotulo: "t" }
      y: { min: -20, max: 20, unidad: V, rotulo: "v(t)" }
      curvas:
        - { expr: "V_p*sin(w*t + phi*pi/180)", color: azul, rotulo: "v(t)" }
      asas:
        - { mueve: V_p, x: "t_cresta", y: "V_p", rotulo: "Cresta: el pico" }
      lectura: { valor: T, rotulo: "Periodo" }
      datos:
        - { valor: w, rotulo: "ω = {{w}}" }
      mandos:
        - { valor: V_p, min: 1, max: 20, paso: 1, rotulo: "Pico, V_{p}" }
        - { valor: f, min: 25, max: 100, paso: 5, rotulo: "Frecuencia, f" }
        - { valor: phi, min: -180, max: 180, paso: 15, rotulo: "Fase, φ" }
    objetivo:
      condiciones:
        - { valor: V_p, objetivo: 17, tol: 0.01, rotulo: "Pico: {{V_p}}" }
        - { valor: f, objetivo: 50, tol: 0.01, rotulo: "Frecuencia: {{f}}" }
        - { valor: phi, objetivo: 90, tol: 0.01, rotulo: "Fase: {{phi}}" }
      logrado: "V_{p} fija la altura, ω = 2πf el ritmo, {{w}}, y φ el desplazamiento: con 90° empieza en la cresta."
      pistas:
        - { cuando: { valor: V_p, max: 16 }, texto: "La altura todavía no es la del ejercicio: suba el pico." }
        - { cuando: { valor: V_p, min: 18 }, texto: "Demasiada altura: baje el pico." }
        - { cuando: { valor: f, max: 45 }, texto: "Faltan ciclos: suba la frecuencia." }
        - { cuando: { valor: f, min: 55 }, texto: "Sobran ciclos: baje la frecuencia." }
        - { texto: "La altura y el ritmo están: desplace la curva con la fase hasta que empiece en la cresta." }
    escalera:
      - "La fase desplaza la curva: un seno empieza en la cresta si se adelanta un cuarto de ciclo."
    solucion: "Pico 17 V, 50 Hz y fase 90°."
    comprobar:
      - { con: { V_p: 17, f: 50, phi: 90 }, T: 0.02, w: 314.16 }
  - id: continua-no-constante
    tipo: marcar
    titulo: "Continua, aunque no constante"
    texto: "Un rectificador sin filtrar da esta tensión: pulsa, pero nunca cambia de sentido, así que es continua. Marque su componente continua, el valor medio."
    libro: [130]
    fijar: { V_p: 17, f: 50 }
    widget:
      tipo: grafica
      x: { id: t, min: 0, max: 0.04, unidad: s, rotulo: "t" }
      y: { min: 0, max: 20, unidad: V, rotulo: "v(t)" }
      curvas:
        - { expr: "V_p*abs(sin(w*t))", color: azul, rotulo: "rectificada" }
      mandos: []
    marcar:
      modo: y
      y: "V_med"
      tol: 0.03
      inicio: { x: 0.01, y: 17 }
      rotulo: "La componente continua"
    pistas:
      - { cuando: { valor: marca_y, mayor: 11.4 }, texto: "Más abajo: la media deja tanta área de curva por encima como de hueco por debajo." }
      - { texto: "Más arriba: la curva pasa poco tiempo cerca de cero." }
    exito: "{{V_med}}: el valor medio, 2·V_{p}/π. Es su parte continua; el filtro de una fuente la acerca a constante."
    escalera:
      - "Para la senoide rectificada, el valor medio es 2·V_{p}/π."
    solucion: "2 × 17/π = 10,8 V."
    comprobar:
      - { V_med: 10.82 }
  - id: explore-eficaz
    tipo: explorar
    titulo: "El mismo calor"
    texto: "La senoide calienta una resistencia de 100 Ω a ráfagas; la línea es la potencia media. Consiga una potencia media de 2 W."
    libro: [134]
    fijar: { R_c: 100, f: 50, phi: 0 }
    inicio: { V_p: 10 }
    widget:
      tipo: grafica
      x: { id: t, min: 0, max: 0.04, unidad: s, rotulo: "t" }
      y: { min: 0, max: 4.5, unidad: W, rotulo: "p(t)" }
      curvas:
        - { expr: "(V_p*sin(w*t))^2/R_c", color: azul, rotulo: "potencia instantánea" }
        - { expr: "P_m", color: naranja, rotulo: "potencia media", discontinua: true }
      lectura: { valor: P_m, rotulo: "Potencia media" }
      datos:
        - { valor: V_rms, rotulo: "Continua equivalente: {{V_rms}}" }
      mandos:
        - { valor: V_p, min: 1, max: 20, paso: 1, rotulo: "Pico, V_{p}" }
    objetivo:
      condiciones:
        - { valor: P_m, objetivo: 2, tol: 0.02, rotulo: "Potencia media: {{P_m}}" }
      logrado: "Con {{V_p}} de pico, {{P_m}}: lo mismo que daría una continua de {{V_rms}}. Ese es su valor eficaz."
      pistas:
        - { cuando: { valor: P_m, mayor: 2.04 }, texto: "Se ha pasado: baje el pico." }
        - { texto: "Falta calor: suba el pico." }
    escalera:
      - "La potencia media es la mitad de la de pico, V_{p}²/R."
    solucion: "20 V de pico dan 2 W, como 14,1 V de continua."
    comprobar:
      - { P_m: 0.5 }
      - { con: { V_p: 20 }, P_m: 2, V_rms: 14.14 }
  - id: prediga-red
    tipo: simular
    titulo: "Prediga el pico de la red"
    texto: "La red europea es de 230 V, y ese número es el valor eficaz. ¿A cuánto llega el pico?"
    libro: [136]
    fijar: { V_ef: 230 }
    widget:
      tipo: grafica
      x: { id: t, min: 0, max: 0.04, unidad: s, rotulo: "t" }
      y: { min: -400, max: 400, unidad: V, rotulo: "v(t)" }
      curvas:
        - { expr: "V_pr*sin(2*pi*50*t)", color: azul, rotulo: "red" }
      lectura: { valor: V_pr, rotulo: "Pico de la red" }
      ocultar: curvas
    simular:
      objetivo: V_pr
      unidad: V
      tol: 0.02
      rotulo: "Pico de la red"
      errores:
        - { expr: "V_ef", texto: "Los 230 V son el eficaz. El pico de una senoide es √2 veces mayor." }
        - { expr: "V_mal", texto: "Eso es multiplicar por 0,707. Se divide el pico entre √2 para el eficaz, no al revés." }
    exito: "230 × √2 ≈ 325 V. Una distinción vital para la seguridad y el diseño."
    escalera:
      - "El pico de una senoide es √2 veces su valor eficaz."
    solucion: "230 × √2 ≈ 325 V."
    comprobar:
      - { V_pr: 325.27 }
      - { V_mal: 162.6 }
  - id: regla-eficaz
    tipo: formula
    titulo: "El valor eficaz"
    texto: "Para una senoide pura, el eficaz es el pico dividido por la raíz de dos."
    nota: "0,707 es un redondeo de 1/√2, no el valor."
    libro: [135, 139]
    ec: 135
    sustitucion: "{{V_p}} / √2 = {{V_rms}}"
    widget:
      tipo: grafica
      x: { id: t, min: 0, max: 0.04, unidad: s, rotulo: "t" }
      y: { min: -20, max: 20, unidad: V, rotulo: "v(t)" }
      curvas:
        - { expr: "V_p*sin(w*t + phi*pi/180)", color: azul, rotulo: "v(t)" }
        - { expr: "V_rms", color: naranja, rotulo: "V_{RMS}", discontinua: true }
      asas:
        - { mueve: V_p, x: "t_cresta", y: "V_p", rotulo: "Cresta: el pico" }
      lectura: { valor: V_rms, rotulo: "Valor eficaz" }
      mandos:
        - { valor: V_p, min: 1, max: 20, paso: 1, rotulo: "Pico, V_{p}" }

  - id: estime-potencia
    tipo: simular
    fase: "Estime"
    titulo: "17 V de pico en 100 Ω"
    texto: "Una senoide de 17 V de pico se aplica a 100 Ω. ¿Qué potencia media disipa?"
    libro: ["cap01#345"]
    fijar: { V_p: 17, R_c: 100 }
    simular:
      objetivo: P_m
      unidad: W
      tol: 0.04
      rotulo: "Potencia media"
      errores:
        - { expr: "P_pico", texto: "Ha usado el pico: 2,89 W es un resultado exagerado. La potencia media sale del eficaz." }
    exito: "El eficaz es 17/1,414 = 12,02 V, y P = 12,02²/100 = 1,45 W."
    pistas:
      - { cuando: { valor: estimacion, mayor: 1.51 }, texto: "Se ha pasado: use el eficaz, 17/√2, no el pico." }
      - { texto: "Se ha quedado corto: halle el eficaz, 17/√2, y luego V²/R." }
    escalera:
      - "Primero el eficaz, Vₚ/√2; después, V²/R."
    solucion: "12,02²/100 = 1,45 W."
    comprobar:
      - { V_rms: 12.02, P_m: 1.445, P_pico: 2.89 }
  - id: empareje-formas
    tipo: marcar
    titulo: "Solo para la senoide"
    texto: "El factor 1/√2 solo vale para la senoide pura. Esta cuadrada de 10 V: marque el nivel de la continua que la calentaría igual."
    libro: [139, 140]
    fijar: { f: 50, phi: 0, V_p: 10, cuad: 1 }
    widget:
      tipo: grafica
      x: { id: t, min: 0, max: 0.04, unidad: s, rotulo: "t" }
      y: { min: -12, max: 12, unidad: V, rotulo: "v(t)" }
      curvas:
        - { expr: "V_p*(1 - 2*(floor(2*f*t) - 2*floor(f*t)))", color: azul, rotulo: "cuadrada" }
      mandos: []
    marcar:
      modo: y
      y: "V_true"
      tol: 0.03
      inicio: { x: 0.01, y: 0 }
      rotulo: "El eficaz verdadero"
    pistas:
      - { cuando: { valor: marca_y, menor: 7.5 }, texto: "Ese sería el 0,707 de la senoide. La cuadrada está siempre en su pico: su cuadrado no baja nunca." }
      - { cuando: { valor: marca_y, mayor: 10.5 }, texto: "Más abajo: nunca pasa de su pico." }
      - { texto: "Más arriba: piense en su cuadrado, que es siempre el mismo." }
    exito: "El propio pico, {{V_true}}: con 0,707 se cometería un error del −29 %. En una triangular, el factor es 1/√3 = 0,5774."
    escalera:
      - "El eficaz es la raíz de la media del cuadrado: ¿cuánto vale el cuadrado de esta onda en cada instante?"
    solucion: "10 V: el eficaz de la cuadrada simétrica es su pico."
    comprobar:
      - { V_true: 10 }
  - id: multimetro
    tipo: sorpresa
    titulo: "El multímetro promediador"
    texto: "Un multímetro económico rectifica, promedia y multiplica por 1,11. Póngale una onda cuadrada y compare su lectura con el eficaz verdadero."
    libro: [137, 140]
    fijar: { f: 50, phi: 0, V_p: 10 }
    inicio: { cuad: 0 }
    widget:
      tipo: grafica
      x: { id: t, min: 0, max: 0.04, unidad: s, rotulo: "t" }
      y: { min: -12, max: 12, unidad: V, rotulo: "v(t)" }
      curvas:
        - { expr: "V_p*(cuad*(1 - 2*(floor(2*f*t) - 2*floor(f*t))) + (1 - cuad)*sin(w*t))", color: azul, rotulo: "v(t)" }
        - { expr: "V_true", color: naranja, rotulo: "eficaz verdadero" }
        - { expr: "V_mult", color: tinta, rotulo: "lectura", discontinua: true }
      lectura: { valor: err_m, rotulo: "Error de la lectura" }
      datos:
        - { valor: V_true, rotulo: "Eficaz: {{V_true}}" }
        - { valor: V_mult, rotulo: "Lee: {{V_mult}}" }
      mandos:
        - { valor: cuad, tipo: interruptor, rotulo: "Onda cuadrada" }
    objetivo:
      condiciones:
        - { valor: cuad, min: 1, rotulo: "Onda cuadrada" }
      logrado: "Lee {{V_mult}} y el eficaz es {{V_true}}: un {{err_m}} de más. Su 1,11 supone una senoide."
      pistas:
        - { texto: "Cambie a la onda cuadrada." }
    escalera:
      - "Active el interruptor de la onda cuadrada."
    solucion: "Con la cuadrada lee 11,1 V: un 11 % de más."
    comprobar:
      - { con: { cuad: 1 }, err_m: 11, V_mult: 11.1 }
  - id: por-que-true-rms
    tipo: porque
    titulo: "¿Por qué acierta el True RMS?"
    texto: "Un multímetro de verdadero valor eficaz no se equivoca con la cuadrada ni con la triangular. ¿Por qué?"
    libro: [137, 140]
    opciones:
      - texto: "Calcula la raíz de la media del cuadrado"
        bien: true
        porque: "Es la definición del eficaz, así que no depende de la forma de onda."
      - texto: "Mide el pico y lo multiplica por 0,707"
        porque: "Ese factor solo vale para la senoide: con una cuadrada erraría un 29 %."
      - texto: "Promedia la señal rectificada con más cuidado"
        porque: "Promediar y multiplicar por 1,11 presupone una senoide, por cuidadoso que sea."
    fijar: { f: 50, phi: 0, V_p: 10 }
    widget:
      tipo: grafica
      x: { id: t, min: 0, max: 0.04, unidad: s, rotulo: t }
      y: { min: -12, max: 12, unidad: V, rotulo: "v(t)" }
      curvas:
        - { expr: "V_p*(cuad*(1 - 2*(floor(2*f*t) - 2*floor(f*t))) + (1 - cuad)*sin(w*t))", color: azul, rotulo: "v(t)" }
        - { expr: "V_true", color: naranja, rotulo: "eficaz verdadero" }
        - { expr: "V_mult", color: tinta, rotulo: "lectura del promediador", discontinua: true }
      lectura: { valor: err_m, rotulo: "Error del promediador" }
      mandos:
        - { valor: cuad, tipo: interruptor, rotulo: "Onda cuadrada" }
    escalera:
      - "El promediador multiplica por 1,11: ¿qué forma de onda supone ese factor?"
    solucion: "Calcula la raíz de la media del cuadrado, la definición del eficaz: vale con cualquier forma de onda."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [130, 131, 134, 135, 137]
    ideas:
      - { titulo: "La senoide.", texto: "Vₚ la altura, ω = 2πf el ritmo y φ el desplazamiento." }
      - { titulo: "Eficaz.", texto: "La continua que daría el mismo calor: Vₚ/√2 en una senoide; la red de 230 V llega a 325 V de pico." }
      - { titulo: "Solo senoide.", texto: "1/√2 y el 1,11 del multímetro promediador solo valen para la senoide pura." }
      - { titulo: "Continua.", texto: "La que no cambia de sentido, aunque no sea constante." }
