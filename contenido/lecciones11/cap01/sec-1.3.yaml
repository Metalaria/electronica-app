# Lección 1.1 de la sección 1.3 «Las Leyes de Kirchhoff» (cap01). Formato: contenido/lecciones11/GUIA.md.
# La sección no tiene bloques «ec»: no hay tarjeta de fórmula.
leccion: cap01/sec-1.3

libro:
  60: "Las leyes de Kirchhoff describen cómo se relacionan entre sí cuando se conectan"
  62: "la suma de las corrientes que entran es igual a la suma de las que salen"
  63: "Un nodo es un punto de unión sin capacidad de almacenar carga"
  64: "entran 2 A por una y salen 1,2 A por otra, por la tercera salen necesariamente 0,8 A"
  68: "la suma algebraica de las tensiones es cero"
  69: "se podría extraer energía de la nada dando vueltas al circuito"
  70: "En un lazo con una fuente de 12 V y tres resistencias de 4, 6 y 2 Ω en serie"
  71: "el potencial baja al atravesar cada componente pasivo"
  72: "Si el resultado sale negativo, la corriente circula al revés de lo supuesto y su valor es correcto"
  74: "un circuito con cinco mallas y tres nodos se resuelve por nodos"
  "cap01#345": "Se conectan en serie tres resistencias de 1 kΩ, 2,2 kΩ y 4,7 kΩ a una fuente de 9 V"

modelo:
  valores:
    V_k1: { sim: "V₁", nombre: "fuente de la izquierda", unidad: V, valor: 12 }
    V_k2: { sim: "V₂", nombre: "fuente de la derecha", unidad: V, valor: 6 }
    R_k1: { sim: "R₁", nombre: "resistencia de la izquierda", unidad: Ω, valor: 1000 }
    R_k2: { sim: "R₂", nombre: "resistencia de la derecha", unidad: Ω, valor: 1000 }
    R_k3: { sim: "R₃", nombre: "carga común", unidad: Ω, valor: 2000 }
    k_on1: { tipo: interruptor, nombre: "fuente de la izquierda encendida", valor: 1 }
    k_on2: { tipo: interruptor, nombre: "fuente de la derecha encendida", valor: 1 }
    I_n1: { sim: "I_{entra}", nombre: "corriente que entra", unidad: A, valor: 2 }
    I_n2: { sim: "I_{sale}", nombre: "corriente que sale por la segunda rama", unidad: A, valor: 1.2 }
    V_s: { sim: "V", nombre: "tensión de la fuente", unidad: V, valor: 12 }
    R_s1: { sim: "R₁", nombre: "primera resistencia", unidad: Ω, valor: 4 }
    R_s2: { sim: "R₂", nombre: "segunda resistencia", unidad: Ω, valor: 6 }
    R_s3: { sim: "R₃", nombre: "tercera resistencia", unidad: Ω, valor: 2 }
  calculos:
    E_k1: { expr: "V_k1*k_on1", sim: "E₁", nombre: "fuente izquierda efectiva", unidad: V }
    E_k2: { expr: "V_k2*k_on2", sim: "E₂", nombre: "fuente derecha efectiva", unidad: V }
    V_kn: { expr: "(E_k1/R_k1 + E_k2/R_k2)/(1/R_k1 + 1/R_k2 + 1/R_k3)", sim: "V_{nodo}", nombre: "tensión del nodo", unidad: V }
    I_k1: { expr: "(E_k1 - V_kn)/R_k1", sim: "I₁", nombre: "corriente de la izquierda", unidad: A }
    I_k2: { expr: "(E_k2 - V_kn)/R_k2", sim: "I₂", nombre: "corriente de la derecha", unidad: A }
    I_k3: { expr: "V_kn/R_k3", sim: "I₃", nombre: "corriente por la carga", unidad: A }
    I_ksum: { expr: "I_k1 + I_k2", sim: "I₁ + I₂", nombre: "suma de las dos ramas", unidad: A }
    I_n3: { expr: "I_n1 - I_n2", sim: "I_{tercera}", nombre: "corriente por la tercera rama", unidad: A }
    I_s: { expr: "V_s/(R_s1 + R_s2 + R_s3)", sim: "I", nombre: "corriente", unidad: A }
    V_s1: { expr: "I_s*R_s1", sim: "V₁", nombre: "caída en R₁", unidad: V }
    V_s2: { expr: "I_s*R_s2", sim: "V₂", nombre: "caída en R₂", unidad: V }
    V_s3: { expr: "I_s*R_s3", sim: "V₃", nombre: "caída en R₃", unidad: V }
    R_12: { expr: "R_s1 + R_s2", sim: "R₁ + R₂", nombre: "las dos primeras", unidad: Ω }
    V_sum: { expr: "V_s1 + V_s2 + V_s3", sim: "suma", nombre: "suma de las caídas", unidad: V }

tarjetas:
  - id: explore-nodo
    tipo: explorar
    titulo: "Lo que entra en un nodo"
    texto: "Dos fuentes llevan corriente al mismo nodo. Mueva la carga y apague una fuente; compare I₁ + I₂ con I₃."
    libro: [60, 62]
    widget:
      tipo: circuito
      esquema: kirchhoff
      piezas: { fuente1: V_k1, fuente2: V_k2, r1: R_k1, r2: R_k2, r3: R_k3, activa1: k_on1, activa2: k_on2 }
      lectura: { valor: I_k3, rotulo: "Por la carga, I₃" }
      datos:
        - { valor: I_k1, rotulo: "I₁ = {{I_k1}}" }
        - { valor: I_k2, rotulo: "I₂ = {{I_k2}}" }
        - { valor: I_ksum, rotulo: "I₁ + I₂ = {{I_ksum}}" }
      corriente: I_k3
      mide: { nodo: V_kn, i1: I_k1, i2: I_k2, i3: I_k3 }
      mandos:
        - { valor: R_k3, min: 500, max: 5000, paso: 500, rotulo: "Carga, R₃" }
        - { valor: k_on1, tipo: interruptor, rotulo: "Fuente de la izquierda" }
        - { valor: k_on2, tipo: interruptor, rotulo: "Fuente de la derecha" }

  - id: prediga-nodo
    tipo: predecir
    titulo: "Prediga"
    texto: "I₁ e I₂ llegan al nodo por las dos ramas, e I₃ baja por la carga. ¿Cuánto vale I₃?"
    libro: [62]
    fijar: { k_on1: 1, k_on2: 1, R_k3: 500 }
    widget:
      tipo: circuito
      esquema: kirchhoff
      piezas: { fuente1: V_k1, fuente2: V_k2, r1: R_k1, r2: R_k2, r3: R_k3, activa1: k_on1, activa2: k_on2 }
      lectura: { valor: I_k3, rotulo: "Por la carga, I₃" }
      datos:
        - { valor: I_k1, rotulo: "I₁ = {{I_k1}}" }
        - { valor: I_k2, rotulo: "I₂ = {{I_k2}}" }
      corriente: I_k3
      mide: { nodo: V_kn, i1: I_k1, i2: I_k2, i3: I_k3 }
      ocultar: true
    opciones:
      - texto: "I₁ + I₂"
        bien: true
        porque: "Todo lo que entra en el nodo sale de él: la carga que llega por las dos ramas baja por la tercera."
      - texto: "La mayor de las dos"
        porque: "Entonces la otra corriente desaparecería en el nodo. Las dos llegan y las dos tienen que salir."
      - texto: "I₁ − I₂"
        porque: "Las dos entran en el nodo, así que se suman. Se restaría una corriente que saliera."
    escalera:
      - "Todo lo que entra en el nodo tiene que salir de él."
    solucion: "I₃ = I₁ + I₂: las dos corrientes que llegan salen juntas por la carga."

  - id: estime-tercera
    tipo: pregunta
    fase: "Estime"
    titulo: "La tercera rama"
    texto: "En un nodo de tres ramas entran 2 A por una y salen 1,2 A por otra. Estime lo que sale por la tercera."
    libro: [64]
    fijar: { I_n1: 2, I_n2: 1.2 }
    estimar:
      objetivo: "I_n3"
      unidad: A
      min: 0
      max: 2
      paso: 0.05
      inicio: 1.6
      tol: 0.03
      rotulo: "Por la tercera rama"
    exito: "0,8 A: con signos, +2 − 1,2 − 0,8 = 0. La suma algebraica en un nodo es cero."
    pistas:
      - { cuando: { valor: estimacion, mayor: 0.82 }, texto: "Se ha pasado: entre las dos que salen deben sumar justo los 2 A que entran." }
      - { texto: "Se ha quedado corto: lo que sale tiene que sumar los 2 A que entran." }
    comprobar:
      - { I_n3: 0.8 }
    escalera:
      - "Con signos, la suma de las corrientes de un nodo es cero."
    solucion: "0,8 A: con signos, +2 − 1,2 − 0,8 = 0. La suma algebraica en un nodo es cero."

  - id: por-que-nodo
    tipo: porque
    titulo: "¿Por qué todo lo que entra sale?"
    texto: "La ley de corrientes no es una regla práctica. ¿De qué principio sale?"
    libro: [60, 63]
    opciones:
      - texto: "Se conserva la carga, y un nodo no la almacena"
        bien: true
        porque: "Si entraran más electrones de los que salen, el nodo se cargaría sin límite, y eso no ocurre."
      - texto: "Los cables no tienen resistencia"
        porque: "Vale igual con resistencias en las ramas. La razón es la conservación de la carga."
      - texto: "Se conserva la energía"
        porque: "Ese principio es el de la ley de tensiones. La de corrientes sale de la conservación de la carga."
    widget:
      tipo: circuito
      esquema: kirchhoff
      piezas: { fuente1: V_k1, fuente2: V_k2, r1: R_k1, r2: R_k2, r3: R_k3, activa1: k_on1, activa2: k_on2 }
      lectura: { valor: I_k3, rotulo: "Por la carga, I₃" }
      datos:
        - { valor: I_ksum, rotulo: "I₁ + I₂ = {{I_ksum}}" }
      corriente: I_k3
      mide: { nodo: V_kn, i1: I_k1, i2: I_k2, i3: I_k3 }
      mandos:
        - { valor: R_k3, min: 500, max: 5000, paso: 500, rotulo: "Carga, R₃" }
    escalera:
      - "¿Puede un nodo, un simple punto de unión, guardar carga?"
    solucion: "Se conserva la carga, y un nodo no la almacena: lo que entra, sale."

  - id: explore-lazo
    tipo: explorar
    titulo: "Recorra el lazo"
    texto: "La fuente sube 12 V y cada resistencia baja I·R. Mueva las resistencias y mire la suma de las caídas."
    libro: [68, 70, 71]
    widget:
      tipo: circuito
      esquema: serie
      piezas: { fuente: V_s, r1: R_s1, r2: R_s2, r3: R_s3 }
      lectura: { valor: V_sum, rotulo: "Suma de las caídas" }
      barras:
        - { valor: V_s1, rotulo: "R₁: {{V_s1}}", color: azul }
        - { valor: V_s2, rotulo: "R₂: {{V_s2}}", color: naranja }
        - { valor: V_s3, rotulo: "R₃: {{V_s3}}", color: verde }
      datos:
        - { valor: I_s, rotulo: "Corriente: {{I_s}}" }
      corriente: I_s
      mide: { corriente: I_s, v1: V_s1, v2: V_s2, v3: V_s3 }
      mandos:
        - { valor: R_s1, min: 1, max: 10, paso: 1, rotulo: "R₁" }
        - { valor: R_s2, min: 1, max: 10, paso: 1, rotulo: "R₂" }
        - { valor: R_s3, min: 1, max: 10, paso: 1, rotulo: "R₃" }
    requiere: { mover: [R_s1, R_s2] }

  - id: prediga-caida
    tipo: predecir
    titulo: "Prediga"
    texto: "Una fuente de 12 V con 4, 6 y 2 Ω en serie. ¿Cuánto cae en la resistencia de 6 Ω?"
    libro: [70]
    fijar: { V_s: 12, R_s1: 4, R_s2: 6, R_s3: 2 }
    widget:
      tipo: circuito
      esquema: serie
      piezas: { fuente: V_s, r1: R_s1, r2: R_s2, r3: R_s3 }
      lectura: { valor: V_s2, rotulo: "Caída en R₂" }
      barras:
        - { valor: V_s1, rotulo: "R₁: {{V_s1}}", color: azul }
        - { valor: V_s2, rotulo: "R₂: {{V_s2}}", color: naranja }
        - { valor: V_s3, rotulo: "R₃: {{V_s3}}", color: verde }
      corriente: I_s
      mide: { corriente: I_s, v2: V_s2 }
      ocultar: true
    opciones:
      - texto: "6 V"
        bien: true
        porque: "La corriente es 12/12 = 1 A; en 6 Ω caen 6 V. Con 4 y 2 V de las otras, suman los 12 V."
      - texto: "12 V"
        porque: "Los 12 V se reparten entre las tres; ninguna se queda con toda la tensión de la fuente."
      - texto: "4 V"
        porque: "Sería un reparto a partes iguales. Cae más en la mayor: la caída es I·R."
    comprobar:
      - { I_s: 1, V_s1: 4, V_s2: 6, V_s3: 2, V_sum: 12 }
    escalera:
      - "Calcule primero la corriente: los 12 V entre la suma de las tres."
    solucion: "12/12 = 1 A, y en 6 Ω caen 6 V."

  - id: reto-nueve
    tipo: reto
    titulo: "Reto: 5,35 V en la tercera"
    texto: "Con 9 V, 1 kΩ y 2,2 kΩ en serie, elija R₃ de la serie E12 para que en ella caigan 5,35 V (± 2 %)."
    libro: ["cap01#345"]
    fijar: { V_s: 9, R_s1: 1000, R_s2: 2200 }
    inicio: { R_s3: 1000 }
    widget:
      tipo: circuito
      esquema: serie
      piezas: { fuente: V_s, r1: R_s1, r2: R_s2, r3: R_s3 }
      lectura: { valor: V_s3, rotulo: "Caída en R₃" }
      barras:
        - { valor: V_s1, rotulo: "R₁: {{V_s1}}", color: azul }
        - { valor: V_s2, rotulo: "R₂: {{V_s2}}", color: naranja }
        - { valor: V_s3, rotulo: "R₃: {{V_s3}}", color: verde }
      corriente: I_s
      mide: { corriente: I_s, v1: V_s1, v2: V_s2, v3: V_s3 }
      mandos:
        - { valor: R_s3, serie: E12, min: 1000, max: 10000, rotulo: "R₃ (E12)" }
    condiciones:
      - { valor: V_s3, objetivo: 5.35, tol: 0.02, rotulo: "En R₃: {{V_s3}}" }
    exito: "R₃ = 4,7 kΩ: 1,139 mA y 1,14 + 2,51 + 5,35 = 9,00 V. La ley de tensiones se cumple."
    pistas:
      - { cuando: { valor: V_s3, mayor: 5.457 }, texto: "Cae demasiado en R₃: elija una menor." }
      - { cuando: { valor: V_s3, menor: 5.243 }, texto: "Cae poco en R₃: elija una mayor, que se quede con más parte." }
    escalera:
      - "Las otras dos se quedan 9 − 5,35 V."
    solucion: "Por las otras dos, 3,2 kΩ, pasa 1,139 mA; en R₃, 5,35 V / 1,139 mA."
    comprobar:
      - { con: { R_s3: 4700 }, I_s: 0.001139, V_s1: 1.14, V_s2: 2.51, V_s3: 5.35, V_sum: 9.0 }
      - { R_12: 3200 }

  - id: corriente-negativa
    tipo: sorpresa
    titulo: "Una corriente negativa"
    texto: "Se supuso que las dos ramas llevan corriente al nodo. Aumente la carga y mire I₂."
    nota: "Si sale negativa, circula al revés de lo supuesto y su valor es correcto."
    libro: [72]
    fijar: { k_on1: 1, k_on2: 1 }
    inicio: { R_k3: 500 }
    widget:
      tipo: circuito
      esquema: kirchhoff
      piezas: { fuente1: V_k1, fuente2: V_k2, r1: R_k1, r2: R_k2, r3: R_k3, activa1: k_on1, activa2: k_on2 }
      lectura: { valor: I_k2, rotulo: "I₂, hacia el nodo" }
      datos:
        - { valor: V_kn, rotulo: "Nodo: {{V_kn}}" }
        - { valor: I_k1, rotulo: "I₁ = {{I_k1}}" }
      corriente: I_k3
      mide: { nodo: V_kn, i1: I_k1, i2: I_k2, i3: I_k3 }
      mandos:
        - { valor: R_k3, min: 500, max: 5000, paso: 500, rotulo: "Carga, R₃" }
    requiere: { mover: [R_k3] }

  - id: por-que-negativa
    tipo: porque
    titulo: "¿Qué significa el signo?"
    texto: "Al resolver por Kirchhoff, I₂ sale negativa. ¿Qué hay que hacer?"
    libro: [72]
    opciones:
      - texto: "Nada: circula al revés de lo supuesto, y el valor vale"
        bien: true
        porque: "El sentido supuesto es arbitrario. El signo solo dice que la corriente va en el otro."
      - texto: "Rehacer las ecuaciones con el sentido bueno"
        porque: "No hace falta: perseguir el sentido «bien» es la principal fuente de errores."
      - texto: "Concluir que esa rama no conduce"
        porque: "Conduce, y con ese valor: lo único que cambia es el sentido."
    widget:
      tipo: circuito
      esquema: kirchhoff
      piezas: { fuente1: V_k1, fuente2: V_k2, r1: R_k1, r2: R_k2, r3: R_k3, activa1: k_on1, activa2: k_on2 }
      lectura: { valor: I_k2, rotulo: "I₂, hacia el nodo" }
      corriente: I_k3
      mide: { nodo: V_kn, i1: I_k1, i2: I_k2, i3: I_k3 }
      mandos:
        - { valor: R_k3, min: 500, max: 5000, paso: 500, rotulo: "Carga, R₃" }
    escalera:
      - "El sentido de cada corriente se eligió al plantear las ecuaciones."
    solucion: "Nada: circula al revés de lo supuesto, y el valor vale tal cual."

  - id: ordene-signos
    tipo: pregunta
    fase: "Ordene"
    titulo: "El procedimiento seguro"
    texto: "Los signos son donde se pierde todo el mundo. Ordene los pasos del procedimiento seguro."
    libro: [72]
    ordenar:
      - "Elegir un sentido de recorrido, cualquiera."
      - "Asignar un sentido supuesto a cada corriente."
      - "Anotar cada elemento con su signo según se atraviese."
      - "Resolver e interpretar: una corriente negativa va al revés."
    exito: "Ese es el orden. Ningún sentido hay que acertarlo de antemano."
    pistas:
      - { texto: "Primero se eligen los sentidos; los signos se anotan después, y se interpreta al final." }
    escalera:
      - "Ningún sentido hay que acertarlo: se eligen al principio, sin más."
    solucion: "Elegir un sentido de recorrido, cualquiera → Asignar un sentido supuesto a cada corriente → Anotar cada elemento con su signo según se atraviese → Resolver e interpretar: una corriente negativa va al revés."

  - id: mallas-nodos
    tipo: pregunta
    titulo: "Mallas o nodos"
    texto: "Un circuito tiene cinco mallas y tres nodos. ¿Por qué método conviene resolverlo?"
    libro: [74]
    opciones:
      - texto: "Por nodos: da menos ecuaciones"
        bien: true
        porque: "Los dos dan el mismo resultado; se elige el de menos ecuaciones. Es además el método de los simuladores."
      - texto: "Por mallas: hay una ecuación por lazo"
        porque: "Con cinco mallas serían cinco ecuaciones; por nodos, con uno de masa, bastan dos."
      - texto: "Da igual: los dos dan lo mismo"
        porque: "Dan el mismo resultado, pero no el mismo trabajo: conviene el de menos ecuaciones."
    widget:
      tipo: figura
      figura: fig-0.2
      zonas:
        - { id: mallas, rotulo: "Dos mallas resueltas", rect: [0, 0, 453, 175] }
    escalera:
      - "Cuente las ecuaciones: una por malla, o una por nodo menos el de masa."
    solucion: "Por nodos: con tres nodos, uno de masa, salen dos ecuaciones frente a cinco."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [62, 63, 68, 69, 72, 74]
    ideas:
      - { titulo: "Corrientes.", texto: "En un nodo, lo que entra sale: la carga se conserva." }
      - { titulo: "Tensiones.", texto: "En un lazo, las caídas suman lo que suben las fuentes: la energía se conserva." }
      - { titulo: "Signos.", texto: "Sentidos supuestos cualesquiera; una corriente negativa va al revés, con su valor correcto." }
      - { titulo: "Métodos.", texto: "Mallas o nodos: el que dé menos ecuaciones." }
