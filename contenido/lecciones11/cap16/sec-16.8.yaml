# Lección 1.2 de la sección 15.8 «Anatomía del FM7303: el Esquema y la Placa por Bloques» (cap16; etiquetas sec-16.N =
# impresas 15.N).
# - El esquema por bloques (figura 15.9, fig-16.9) y el plano de la placa con los mismos ocho bloques (figura 15.10,
#   fig-16.10), con zonas.
# - Los ocho bloques (15.8.1 a 15.8.8): front-end, FI y detección, AFC, decodificador y de-énfasis, audio, alimentación,
#   display y medidor.
# - Modelo: la trampa L4–C43 del de-énfasis, f = 1/(2π·√(L·C)) con 40 mH y 1000 pF: 25,2 kHz («unos 25 kHz»).
# Paso práctico: «tocar» el bloque de FI en el plano de la placa.
leccion: cap16/sec-16.8

libro:
  134: "El mismo número y color identifican el mismo bloque en ambas figuras"
  135: "Esquema simplificado del FM7303 V3.0r7 dividido en sus ocho bloques funcionales"
  136: "Plano simplificado de la placa del FM7303 V3.0r7 con los mismos ocho bloques"
  138: "maneja la señal más débil de todo el aparato: unos pocos microvoltios captados por la antena"
  139: "el ruido que se añade aquí marca el límite de las emisoras más flojas que podrás oír"
  142: "En la placa ocupa la franja superior derecha"
  143: "ese recorte elimina el ruido de amplitud (chasquidos, interferencias) sin tocar el sonido"
  144: "en reposo está a unos 4,6 V de continua"
  147: "deja pasar la continua y quita el audio, que de otro modo modularía el oscilador"
  151: "por eso tiene que ser de película, estable con la temperatura"
  152: "la bobina L4 con C43 (1000 pF) forma una trampa en unos 25 kHz"
  150: "las bobinas L4 y L5 (40 mH)"
  155: "El amplificador trabaja directamente con los 12 V de alimentación, sin regular"
  162: "si fallara, la radio seguiría funcionando"
  160: "Bloque 7 — Display Digital de Frecuencia"
  165: "en todos esos ajustes se busca, precisamente, el máximo del medidor"

modelo:
  valores:
    L_4: { sim: "L₄", nombre: "bobina del de-énfasis", unidad: H, valor: 0.04 }
    C_43: { sim: "C₄₃", nombre: "condensador de la trampa", unidad: F, valor: 1e-9 }
  calculos:
    f_t: { expr: "1/(2*pi*sqrt(L_4*C_43))", sim: "f_{trampa}", nombre: "frecuencia de la trampa", unidad: Hz }
    f_x: { expr: "1/sqrt(L_4*C_43)", sim: "ω", nombre: "frecuencia angular de la trampa", unidad: Hz }
    s_lc: { expr: "sqrt(L_4*C_43)", sim: "√(LC)", nombre: "raíz de L por C", unidad: s }

tarjetas:
  - id: explore-bloques
    tipo: explorar
    titulo: "Ocho bloques"
    texto: "El esquema se divide en ocho bloques; el mismo número y color los identifica en la placa. Toque los de la señal."
    libro: [134, 135, 160]
    widget:
      tipo: figura
      figura: fig-16.9
      zonas:
        - { id: b1, rotulo: "Arriba, el primero", rect: [18, 38, 108, 77], texto: "Bloque 1: front-end de RF, oscilador y sintonía." }
        - { id: b2, rotulo: "Arriba, el segundo", rect: [147, 38, 110, 77], texto: "Bloque 2: amplificación de FI y detección." }
        - { id: b4, rotulo: "Arriba, el tercero", rect: [277, 38, 110, 77], texto: "Bloque 4: decodificador estéreo y de-énfasis." }
        - { id: b5, rotulo: "Arriba, el cuarto", rect: [394, 38, 58, 77], texto: "Bloque 5: amplificador de audio TEA2025." }
        - { id: b7, rotulo: "En medio a la izquierda", rect: [4, 153, 65, 55], texto: "Bloque 7: el display, que cuenta el oscilador local." }
        - { id: b3, rotulo: "En medio, el segundo", rect: [79, 153, 95, 55], texto: "Bloque 3: el AFC." }
        - { id: b8, rotulo: "En medio, el tercero", rect: [198, 153, 93, 55], texto: "Bloque 8: el medidor de señal." }
        - { id: b6, rotulo: "Abajo", rect: [4, 230, 448, 50], texto: "Bloque 6: alimentación y reguladores." }
    requiere: { mover: [b1, b2, b4, b5] }

  - id: toque-fi
    tipo: tocar
    titulo: "En la placa"
    texto: "En el plano de la placa, toque la zona del bloque de FI y detección."
    libro: [136, 142]
    widget:
      tipo: figura
      figura: fig-16.10
      zonas:
        - { id: fi, rotulo: "Arriba a la derecha", rect: [287, 22, 163, 85] }
        - { id: frontend, rotulo: "Abajo a la derecha", rect: [345, 110, 105, 115] }
        - { id: decodificador, rotulo: "La franja vertical de la izquierda", rect: [124, 36, 70, 168] }
        - { id: audio, rotulo: "Abajo a la izquierda", rect: [50, 123, 73, 103] }
        - { id: medidor, rotulo: "El círculo grande", rect: [195, 33, 92, 110] }
    tocar:
      bien: [fi]
      porque:
        frontend: "Es el front-end, alrededor del variable y de las bobinas de aire."
        decodificador: "Es la zona central del decodificador estéreo."
        audio: "Es la zona del TEA2025, junto a los conectores de altavoz."
        medidor: "Es el medidor de señal, el gran círculo central."
    exito: "La franja superior derecha: B1, CF1, CF2, los dos integrados de FI y B2."
    escalera:
      - "Busque los filtros cerámicos CF1 y CF2."
    solucion: "Arriba a la derecha."

  - id: porque-frontend
    tipo: porque
    titulo: "La etapa más delicada"
    texto: "¿Por qué el front-end es, técnicamente, la etapa más delicada del receptor?"
    libro: [138, 139, 160]
    widget:
      tipo: figura
      figura: fig-16.9
      zonas:
        - { id: b1, rotulo: "Arriba, el primero", rect: [18, 38, 108, 77] }
    opciones:
      - texto: "Porque maneja la señal más débil: unos pocos microvoltios"
        bien: true
        porque: "El ruido que se añade ahí marca el límite de las emisoras más flojas que se podrán oír."
      - texto: "Porque es la que más potencia maneja"
        porque: "La que más potencia maneja es la de audio; el front-end maneja la más débil."
      - texto: "Porque lleva el display"
        porque: "El display es el bloque 7 y no está en la cadena de la señal."
    escalera:
      - "¿Dónde es más pequeña la señal?"
    solucion: "Maneja microvoltios: su ruido fija el límite de sensibilidad."

  - id: pregunta-limpia
    tipo: pregunta
    titulo: "Por qué la FM suena limpia"
    texto: "La cadena de FI limita la señal, recortando sus variaciones de amplitud. ¿Qué consigue?"
    libro: [143]
    widget:
      tipo: figura
      figura: fig-16.9
      zonas:
        - { id: b2, rotulo: "Arriba, el segundo", rect: [147, 38, 110, 77] }
    opciones:
      - texto: "Quita el ruido de amplitud sin tocar el sonido"
        bien: true
        porque: "En FM la información va en la frecuencia: los chasquidos e interferencias de amplitud se recortan sin perder nada."
      - texto: "Distorsiona el audio"
        porque: "Recortar la amplitud no toca el audio, que va en la frecuencia."
      - texto: "Sube el volumen"
        porque: "El volumen lo fija W4; el limitador fija la amplitud de la FI."
    escalera:
      - "¿Dónde viaja la información en FM?"
    solucion: "Elimina el ruido de amplitud: la información va en la frecuencia."

  - id: pregunta-filtro-afc
    tipo: pregunta
    titulo: "El filtro del AFC"
    texto: "La tensión del detector llega al varicap por el filtro R5-C15-R4-C14, de unas décimas de segundo. ¿Qué quita?"
    libro: [147]
    widget:
      tipo: figura
      figura: fig-16.9
      zonas:
        - { id: b3, rotulo: "En medio, el segundo", rect: [79, 153, 95, 55] }
    opciones:
      - texto: "El audio, que si no modularía el oscilador"
        bien: true
        porque: "Deja pasar la continua, que dice si la sintonía está centrada, y quita el audio."
      - texto: "La continua"
        porque: "La continua es justo la corrección: la tensión de error que llega al varicap."
      - texto: "El ruido de la alimentación"
        porque: "Eso lo hacen los desacoplos; este filtro separa la corrección del audio."
    escalera:
      - "El detector entrega audio y una continua que indica el error de sintonía."
    solucion: "El audio: al varicap solo debe llegar la continua."

  - id: porque-c38
    tipo: porque
    titulo: "C38, de película"
    texto: "C38 fija, con R17 y W3, la frecuencia libre del VCO. ¿Por qué tiene que ser de película?"
    libro: [151]
    widget:
      tipo: figura
      figura: fig-16.9
      zonas:
        - { id: b4, rotulo: "Arriba, el tercero", rect: [277, 38, 110, 77] }
    opciones:
      - texto: "Porque tiene que ser estable con la temperatura"
        bien: true
        porque: "Si su capacidad derivara, la frecuencia libre del VCO se alejaría de los 38 kHz."
      - texto: "Porque soporta más tensión"
        porque: "No es cuestión de tensión: es de estabilidad de la capacidad."
      - texto: "Porque es el filtro del lazo"
        porque: "El filtro del lazo es otro: la red R16-C36-C37 de la patilla 2."
    escalera:
      - "¿Qué pasa con la frecuencia del VCO si C38 cambia?"
    solucion: "Por estabilidad con la temperatura."

  - id: estime-trampa
    tipo: pregunta
    titulo: "La trampa del de-énfasis"
    texto: "La bobina L4 (40 mH) con C43 (1000 pF) forma una trampa. ¿En qué frecuencia?"
    libro: [150, 152]
    widget:
      tipo: figura
      figura: fig-16.9
      zonas:
        - { id: b4, rotulo: "Arriba, el tercero", rect: [277, 38, 110, 77] }
    estimar:
      objetivo: "f_t"
      unidad: Hz
      min: 5000
      max: 60000
      paso: 500
      inicio: 50000
      tol: 0.05
      rotulo: "Frecuencia de la trampa"
    exito: "Unos 25 kHz: entre el piloto de 19 kHz y la subportadora de 38 kHz, para atenuar sus restos."
    pistas:
      - { cuando: { valor: estimacion, mayor: 26500 }, texto: "Demasiado alta: con 40 mH y 1000 pF, √(L·C) vale 6,32 µs." }
      - { texto: "Demasiado baja: revise las potencias de diez de los mili y los pico." }
    escalera:
      - "f = 1/(2π·√(L·C))."
    solucion: "1/(2π·√(40 mH · 1000 pF)) = 25,2 kHz."
    comprobar:
      - { f_t: 25165, s_lc: 6.325e-6, tol: 0.002 }

  - id: pregunta-deenfasis
    tipo: pregunta
    titulo: "Sin de-énfasis"
    texto: "La emisora realza los agudos antes de transmitir. Si el receptor no los atenuara, ¿cómo sonaría?"
    libro: [152]
    widget:
      tipo: figura
      figura: fig-16.9
      zonas:
        - { id: b4, rotulo: "Arriba, el tercero", rect: [277, 38, 110, 77] }
    opciones:
      - texto: "Estridente y siseante"
        bien: true
        porque: "El de-énfasis, de 50 µs en Europa, devuelve el equilibrio y de paso reduce el siseo."
      - texto: "Sin graves"
        porque: "El realce es de agudos: lo que sobra son agudos, no faltan graves."
      - texto: "Igual: solo afecta al estéreo"
        porque: "El pre-énfasis afecta a todo el audio, mono o estéreo."
    escalera:
      - "El pre-énfasis realza los agudos."
    solucion: "Estridente y siseante."

  - id: porque-sin-regular
    tipo: porque
    titulo: "El audio, sin regular"
    texto: "El TEA2025 trabaja con los 12 V sin regular. ¿Por qué no se le da una tensión regulada?"
    libro: [155]
    widget:
      tipo: figura
      figura: fig-16.9
      zonas:
        - { id: b5, rotulo: "Arriba, el cuarto", rect: [394, 38, 58, 77] }
    opciones:
      - texto: "Porque necesita margen para la potencia, y el oído tolera algo de rizado"
        bien: true
        porque: "Cuanta más tensión, más margen para entregar potencia: aquí importa la potencia, no la pureza extrema."
      - texto: "Porque el TEA2025 no admite reguladores"
        porque: "No es una limitación del chip: es una elección por el margen de tensión."
      - texto: "Porque el audio no lleva ruido"
        porque: "Sí lo lleva: el oído tolera un poco de rizado en esta etapa."
    escalera:
      - "¿Qué interesa más en la etapa de potencia?"
    solucion: "Margen de tensión para la potencia; el oído tolera un poco de rizado."

  - id: predecir-display
    tipo: predecir
    titulo: "Si falla el display"
    texto: "El display SC3610D deja de funcionar. ¿Qué le pasa a la radio?"
    libro: [162]
    widget:
      tipo: figura
      figura: fig-16.9
      zonas:
        - { id: b7, rotulo: "En medio a la izquierda", rect: [4, 153, 65, 55] }
    opciones:
      - texto: "Sigue sonando; hay que guiarse por el dial y el medidor"
        bien: true
        porque: "El display es un instrumento de ayuda, no parte de la cadena de sonido."
      - texto: "Se queda muda"
        porque: "El display solo cuenta el oscilador: no está en el camino del audio."
      - texto: "Se desintoniza"
        porque: "Gracias al buffer 9018, el display lee el oscilador sin cargarlo."
    escalera:
      - "¿Está el display en el camino de la señal?"
    solucion: "Sigue sonando."

  - id: pregunta-medidor
    tipo: pregunta
    titulo: "El ojo de la alineación"
    texto: "Al ajustar la presintonía C4A', la bobina L1 o el transformador B1, ¿qué se busca en el medidor de señal?"
    libro: [144, 165]
    widget:
      tipo: figura
      figura: fig-16.9
      zonas:
        - { id: b8, rotulo: "En medio, el tercero", rect: [198, 153, 93, 55] }
    opciones:
      - texto: "Su máximo"
        bien: true
        porque: "En todos esos ajustes se busca el máximo del medidor; también al orientar la antena."
      - texto: "Que marque 4,6 V"
        porque: "Los 4,6 V son de TP3 y TP1; el medidor se lleva al máximo."
      - texto: "Que marque cero"
        porque: "Cero indicaría que no llega señal."
    escalera:
      - "Más señal, más se desvía la aguja."
    solucion: "El máximo del medidor."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [134, 139, 143, 162]
    ideas:
      - { titulo: "Dos mapas.", texto: "Esquema y placa con los mismos ocho bloques y colores." }
      - { titulo: "Señal.", texto: "Front-end delicado, FI que limita, decodificador con C38 de película, audio sin regular." }
      - { titulo: "Ayudas.", texto: "AFC, display y medidor: el display no está en la cadena de sonido." }
      - { titulo: "Alinear.", texto: "Se busca el máximo del medidor; TP3 a 4,6 V con B2." }
