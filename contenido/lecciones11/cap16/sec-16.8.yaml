# Lección 1.2 de la sección 15.8 «Anatomía del FM7303: el Esquema y la Placa por Bloques» (cap16; etiquetas sec-16.N =
# impresas 15.N).
# - El esquema por bloques (figura 15.9, fig-16.9) y el plano de la placa con los mismos ocho bloques (figura 15.10,
#   fig-16.10), con zonas.
# - Los ocho bloques (15.8.1 a 15.8.8): front-end, FI y detección, AFC, decodificador y de-énfasis, audio, alimentación,
#   display y medidor.
# - Modelo: la trampa L4–C43 del de-énfasis, f = 1/(2π·√(L·C)) con 40 mH y 1000 pF: 25,2 kHz («unos 25 kHz»).
# Paso práctico: «tocar» el bloque de FI en el plano de la placa.
# 1.2.1 (autor121-senpro, «aprender haciendo», GUIA §13): en la figura 15.9 se tocan los bloques de la señal en orden y,
# uno a uno, el de la señal más débil, el que recorta la amplitud, el del VCO con C38, el que va sin regular y el que
# puede fallar sin silenciar la radio; se elige el condensador que pone la trampa de L4 en unos 25 kHz. El de-énfasis
# se funde en su éxito. Quedan dos preguntas de opciones (el filtro del AFC y el medidor).
leccion: cap16/sec-16.8

libro:
  134: "El mismo número y color identifican el mismo bloque en ambas figuras"
  135: "Esquema simplificado del FM7303 V3.0r7 dividido en sus ocho bloques funcionales"
  136: "Plano simplificado de la placa del FM7303 V3.0r7 con los mismos ocho bloques"
  138: "maneja la señal más débil de todo el aparato: unos pocos microvoltios captados por la antena"
  139: "el ruido que se añade aquí marca el límite de las emisoras más flojas que podrás oír"
  142: "En la placa ocupa la franja superior derecha"
  143: "ese recorte elimina el ruido de amplitud (chasquidos, interferencias) sin tocar el sonido"
  144: "en reposo está a unos 4,6 V de continua"
  147: "deja pasar la continua y quita el audio, que de otro modo modularía el oscilador"
  151: "por eso tiene que ser de película, estable con la temperatura"
  152: "la bobina L4 con C43 (1000 pF) forma una trampa en unos 25 kHz"
  150: "las bobinas L4 y L5 (40 mH)"
  155: "El amplificador trabaja directamente con los 12 V de alimentación, sin regular"
  162: "si fallara, la radio seguiría funcionando"
  160: "Bloque 7 — Display Digital de Frecuencia"
  165: "en todos esos ajustes se busca, precisamente, el máximo del medidor"

modelo:
  valores:
    L_4: { sim: "L₄", nombre: "bobina del de-énfasis", unidad: H, valor: 0.04 }
    C_43: { sim: "C₄₃", nombre: "condensador de la trampa", unidad: F, valor: 1e-9 }
  calculos:
    f_t: { expr: "1/(2*pi*sqrt(L_4*C_43))", sim: "f_{trampa}", nombre: "frecuencia de la trampa", unidad: Hz }
    f_x: { expr: "1/sqrt(L_4*C_43)", sim: "ω", nombre: "frecuencia angular de la trampa", unidad: Hz }
    s_lc: { expr: "sqrt(L_4*C_43)", sim: "√(LC)", nombre: "raíz de L por C", unidad: s }

tarjetas:
  - id: explore-bloques
    tipo: tocar
    titulo: "Ocho bloques"
    texto: "El esquema se divide en ocho bloques; el mismo número y color los identifica en la placa. Toque en orden los cuatro que lleva la señal."
    libro: [134, 135, 160]
    widget:
      tipo: figura
      figura: fig-16.9
      zonas: &zonas-b
        - { id: b1, rotulo: "Bloque 1", rect: [18, 38, 108, 77] }
        - { id: b2, rotulo: "Bloque 2", rect: [147, 38, 110, 77] }
        - { id: b4, rotulo: "Bloque 4", rect: [277, 38, 110, 77] }
        - { id: b5, rotulo: "Bloque 5", rect: [394, 38, 58, 77] }
        - { id: b7, rotulo: "Bloque 7", rect: [4, 153, 65, 55] }
        - { id: b3, rotulo: "Bloque 3", rect: [79, 153, 95, 55] }
        - { id: b8, rotulo: "Bloque 8", rect: [198, 153, 93, 55] }
        - { id: b6, rotulo: "Bloque 6", rect: [4, 230, 448, 50] }
    tocar:
      bien: [b1, b2, b4, b5]
      orden: true
      porque:
        b7: "El display no lleva la señal: cuenta el oscilador."
        b3: "El AFC corrige el oscilador, fuera del camino del sonido."
        b8: "El medidor de señal solo informa."
        b6: "La alimentación no lleva señal."
    exito: "Front-end, FI y detección, decodificador estéreo y audio."
    escalera:
      - "La señal entra por la izquierda de la fila de arriba."
    solucion: "Bloques 1, 2, 4 y 5."

  - id: toque-fi
    tipo: tocar
    titulo: "En la placa"
    texto: "En el plano de la placa, toque la zona del bloque de FI y detección."
    libro: [136, 142]
    widget:
      tipo: figura
      figura: fig-16.10
      zonas:
        - { id: fi, rotulo: "Arriba a la derecha", rect: [287, 22, 163, 85] }
        - { id: frontend, rotulo: "Abajo a la derecha", rect: [345, 110, 105, 115] }
        - { id: decodificador, rotulo: "La franja vertical de la izquierda", rect: [124, 36, 70, 168] }
        - { id: audio, rotulo: "Abajo a la izquierda", rect: [50, 123, 73, 103] }
        - { id: medidor, rotulo: "El círculo grande", rect: [195, 33, 92, 110] }
    tocar:
      bien: [fi]
      porque:
        frontend: "Es el front-end, alrededor del variable y de las bobinas de aire."
        decodificador: "Es la zona central del decodificador estéreo."
        audio: "Es la zona del TEA2025, junto a los conectores de altavoz."
        medidor: "Es el medidor de señal, el gran círculo central."
    exito: "La franja superior derecha: B1, CF1, CF2, los dos integrados de FI y B2."
    escalera:
      - "Busque los filtros cerámicos CF1 y CF2."
    solucion: "Arriba a la derecha."

  - id: porque-frontend
    tipo: tocar
    titulo: "La etapa más delicada"
    texto: "Una etapa maneja la señal más débil de todo el aparato, unos pocos microvoltios. Tóquela."
    libro: [138, 139, 160]
    widget:
      tipo: figura
      figura: fig-16.9
      zonas: *zonas-b
    tocar:
      bien: [b1]
      porque:
        b2: "Es la FI y la detección."
        b4: "Es el decodificador estéreo."
        b5: "Es el audio."
        b7: "Es el display."
        b3: "Es el AFC."
        b8: "Es el medidor."
        b6: "Es la alimentación."
    exito: "El front-end: el ruido que añade marca el límite de las emisoras más flojas."
    escalera:
      - "¿Por dónde entra la antena?"
    solucion: "Bloque 1."

  - id: pregunta-limpia
    tipo: tocar
    titulo: "Por qué la FM suena limpia"
    texto: "Un bloque recorta las variaciones de amplitud de la señal y con ellas los chasquidos. Tóquelo."
    libro: [143, 144]
    widget:
      tipo: figura
      figura: fig-16.9
      zonas: *zonas-b
    tocar:
      bien: [b2]
      porque:
        b1: "Es el front-end."
        b4: "Es el decodificador estéreo."
        b5: "Es el audio."
        b7: "Es el display."
        b3: "Es el AFC."
        b8: "Es el medidor."
        b6: "Es la alimentación."
    exito: "La FI limita: en FM la información va en la frecuencia y el ruido de amplitud se quita sin perder nada."
    escalera:
      - "¿Dónde está el limitador?"
    solucion: "Bloque 2."

  - id: pregunta-filtro-afc
    tipo: pregunta
    titulo: "El filtro del AFC"
    texto: "La tensión del detector llega al varicap por el filtro R5-C15-R4-C14, de unas décimas de segundo. ¿Qué quita?"
    libro: [147]
    widget:
      tipo: figura
      figura: fig-16.9
      zonas:
        - { id: b3, rotulo: "En medio, el segundo", rect: [79, 153, 95, 55] }
    opciones:
      - texto: "El audio, que si no modularía el oscilador"
        bien: true
        porque: "Deja pasar la continua, que dice si la sintonía está centrada, y quita el audio."
      - texto: "La continua"
        porque: "La continua es justo la corrección: la tensión de error que llega al varicap."
      - texto: "El ruido de la alimentación"
        porque: "Eso lo hacen los desacoplos; este filtro separa la corrección del audio."
    escalera:
      - "El detector entrega audio y una continua que indica el error de sintonía."
    solucion: "El audio: al varicap solo debe llegar la continua."

  - id: porque-c38
    tipo: tocar
    titulo: "C38, de película"
    texto: "C38 fija, con R17 y W3, la frecuencia libre del VCO de 38 kHz. Toque su bloque."
    libro: [151]
    widget:
      tipo: figura
      figura: fig-16.9
      zonas: *zonas-b
    tocar:
      bien: [b4]
      porque:
        b1: "Es el front-end."
        b2: "Es la FI y la detección."
        b5: "Es el audio."
        b7: "Es el display."
        b3: "Es el AFC."
        b8: "Es el medidor."
        b6: "Es la alimentación."
    exito: "El decodificador estéreo. C38 es de película para que la frecuencia libre no derive con la temperatura."
    escalera:
      - "¿Qué bloque regenera los 38 kHz?"
    solucion: "Bloque 4."

  - id: estime-trampa
    tipo: explorar
    titulo: "La trampa del de-énfasis"
    texto: "La bobina L4, de 40 mH, forma con C43 una trampa entre el piloto de 19 kHz y la subportadora de 38 kHz. Elija C43 para dejarla en unos 25 kHz."
    libro: [150, 152]
    inicio: { C_43: 4.7e-10 }
    widget:
      tipo: grafica
      x: { id: c, min: 1e-10, max: 1e-8, unidad: F, rotulo: "C43", escala: log }
      y: { min: 5000, max: 60000, unidad: Hz, rotulo: "f" }
      curvas:
        - { expr: "1/(2*pi*sqrt(L_4*c))", color: naranja, rotulo: "trampa" }
      marcas:
        - { x: "C_43", y: "f_t", rotulo: "{{f_t}}" }
      lectura: { valor: f_t, rotulo: "Frecuencia de la trampa" }
      mandos:
        - { valor: C_43, lista: [4.7e-10, 1e-9, 2.2e-9], rotulo: "C43" }
    objetivo:
      condiciones:
        - { valor: f_t, objetivo: 25165, tol: 0.03, rotulo: "Trampa: {{f_t}}" }
      logrado: "{{C_43}}: {{f_t}}, para atenuar los restos del piloto y la subportadora. Sin de-énfasis, sonaría estridente y siseante."
      pistas:
        - { cuando: { valor: f_t, mayor: 26000 }, texto: "Trampa demasiado alta: más capacidad." }
        - { texto: "Trampa demasiado baja: menos capacidad." }
    escalera:
      - "f = 1/(2π·√(L·C))."
    solucion: "1000 pF: 25,2 kHz."
    comprobar:
      - { con: { C_43: 1e-9 }, f_t: 25165, s_lc: 6.325e-06, tol: 0.002 }
      - { con: { C_43: 4.7e-10 }, f_t: 36706, tol: 0.003 }

  - id: porque-sin-regular
    tipo: tocar
    titulo: "El audio, sin regular"
    texto: "Un bloque trabaja directamente con los 12 V sin regular. Tóquelo."
    libro: [155]
    widget:
      tipo: figura
      figura: fig-16.9
      zonas: *zonas-b
    tocar:
      bien: [b5]
      porque:
        b1: "Es el front-end."
        b2: "Es la FI y la detección."
        b4: "Es el decodificador estéreo."
        b7: "Es el display."
        b3: "Es el AFC."
        b8: "Es el medidor."
        b6: "Es la alimentación."
    exito: "El audio: necesita margen de tensión para la potencia, y el oído tolera algo de rizado."
    escalera:
      - "¿Qué bloque necesita potencia?"
    solucion: "Bloque 5."

  - id: predecir-display
    tipo: tocar
    titulo: "Si falla el display"
    texto: "Si un bloque deja de funcionar, la radio sigue sonando y hay que guiarse por el dial y el medidor. Tóquelo."
    libro: [162]
    widget:
      tipo: figura
      figura: fig-16.9
      zonas: *zonas-b
    tocar:
      bien: [b7]
      porque:
        b1: "Es el front-end."
        b2: "Es la FI y la detección."
        b4: "Es el decodificador estéreo."
        b5: "Es el audio."
        b3: "Es el AFC."
        b8: "Es el medidor."
        b6: "Es la alimentación."
    exito: "El display: un instrumento de ayuda, no parte de la cadena de sonido."
    escalera:
      - "¿Qué bloque no está en el camino del sonido ni lo corrige?"
    solucion: "Bloque 7."

  - id: pregunta-medidor
    tipo: pregunta
    titulo: "El ojo de la alineación"
    texto: "Al ajustar la presintonía C4A', la bobina L1 o el transformador B1, ¿qué se busca en el medidor de señal?"
    libro: [144, 165]
    widget:
      tipo: figura
      figura: fig-16.9
      zonas:
        - { id: b8, rotulo: "En medio, el tercero", rect: [198, 153, 93, 55] }
    opciones:
      - texto: "Su máximo"
        bien: true
        porque: "En todos esos ajustes se busca el máximo del medidor; también al orientar la antena."
      - texto: "Que marque 4,6 V"
        porque: "Los 4,6 V son de TP3 y TP1; el medidor se lleva al máximo."
      - texto: "Que marque cero"
        porque: "Cero indicaría que no llega señal."
    escalera:
      - "Más señal, más se desvía la aguja."
    solucion: "El máximo del medidor."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [134, 139, 143, 162]
    ideas:
      - { titulo: "Dos mapas.", texto: "Esquema y placa con los mismos ocho bloques y colores." }
      - { titulo: "Señal.", texto: "Front-end delicado, FI que limita, decodificador con C38 de película, audio sin regular." }
      - { titulo: "Ayudas.", texto: "AFC, display y medidor: el display no está en la cadena de sonido." }
      - { titulo: "Alinear.", texto: "Se busca el máximo del medidor; TP3 a 4,6 V con B2." }
