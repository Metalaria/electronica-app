# Lección 1.2 de la sección 15.10 «Montaje Paso a Paso (Práctica de Soldadura)» (cap16; etiquetas sec-16.N = impresas
# 15.N).
# - La secuencia visual de montaje (figura 15.14, fig-16.14, ocho paneles con zonas) y los ocho pasos (15.10.1 a
#   15.10.8): del componente más bajo y resistente al calor al más alto y delicado.
# - El SIP y su marca de patilla 1 (foto de la figura 15.15, fig-16.15, zonas en píxeles), la polaridad de los
#   electrolíticos y de los filtros cerámicos, las bobinas de aire y la precaución antes de alimentar.
# Pasos prácticos: «ordenar» el montaje, «tocar» la patilla 1 del SIP y «banco» opcional: medir una resistencia
# marcada «2k2» antes de soldarla (2,2 kΩ; el ±5 % del banco es de ejemplo), con la ficha 10 del cuaderno.
leccion: cap16/sec-16.10

libro:
  195: "El orden va de los componentes más bajos y resistentes al calor a los más altos y delicados"
  196: "Secuencia visual de montaje del FM7303, paso a paso"
  197: "se sueldan DIRECTAMENTE a la placa; el kit no trae zócalo para ellos"
  199: "Recuerda el marcado abreviado de la placa: «2k2» es 2,2 kΩ, «5Ω1» es 5,1 Ω"
  201: "(«103» = 0,01 µF, «104» = 0,1 µF, etc.)"
  203: "atendiendo a la marca del pin 1"
  205: "Es el paso donde más errores se cometen; revísalo dos veces"
  207: "raspa 3-4 mm de esmalte de las puntas del hilo, estáñalas, y no apliques el soldador más de 3 segundos por patilla"
  208: "su carcasa lleva un punto que marca la patilla 1, que es la ENTRADA de señal"
  209: "Paso 6 — Condensador Variable, Potenciómetros e Interruptores"
  211: "Paso 7 — Display, Conectores, Medidor y Jack de Audio"
  213: "Paso 8 — El TEA2025, Revisión Final y Altavoces"
  214: "suelda primero el zócalo vacío y deja el chip para el final"
  215: "Un integrado soldado o insertado al revés se destruye en cuanto alimentas la placa"
  216: "el punto en relieve marca la patilla 1"

modelo:
  valores:
    R_k: { sim: "R", nombre: "resistencia marcada «2k2»", unidad: Ω, valor: 2200 }
  calculos: {}

tarjetas:
  - id: explore-pasos
    tipo: explorar
    titulo: "Ocho pasos"
    texto: "El montaje va de lo más bajo y resistente al calor a lo más alto y delicado. Toque los pasos."
    libro: [195, 196, 209, 211, 213]
    widget:
      tipo: figura
      figura: fig-16.14
      zonas:
        - { id: p1, rotulo: "Arriba, el primero", rect: [0, 3, 110, 105], texto: "Paso 1: las resistencias, midiendo cada una antes." }
        - { id: p2, rotulo: "Arriba, el segundo", rect: [113, 3, 110, 105], texto: "Paso 2: diodos y cerámicos, y el AMS1117 en la cara inferior." }
        - { id: p3, rotulo: "Arriba, el tercero", rect: [226, 3, 110, 105], texto: "Paso 3: los cuatro chips de radio SIP, soldados directos." }
        - { id: p4, rotulo: "Arriba, el cuarto", rect: [340, 3, 110, 105], texto: "Paso 4: los electrolíticos y C38, cuidando la polaridad." }
        - { id: p5, rotulo: "Abajo, el primero", rect: [0, 117, 110, 105], texto: "Paso 5: los componentes de RF." }
        - { id: p6, rotulo: "Abajo, el segundo", rect: [113, 117, 110, 105], texto: "Paso 6: el variable, los potenciómetros y los interruptores." }
        - { id: p7, rotulo: "Abajo, el tercero", rect: [226, 117, 110, 105], texto: "Paso 7: display, conectores, medidor y jack." }
        - { id: p8, rotulo: "Abajo, el cuarto", rect: [340, 117, 110, 105], texto: "Paso 8: el TEA2025, la revisión final y los altavoces." }
    requiere: { mover: [p1, p4, p8] }

  - id: ordene-montaje
    tipo: pregunta
    titulo: "El orden de montaje"
    texto: "Ordene los pasos del montaje del FM7303."
    libro: [195, 196]
    widget:
      tipo: figura
      figura: fig-16.14
      zonas:
        - { id: pasos, rotulo: "Los ocho paneles", rect: [0, 3, 450, 220] }
    ordenar:
      - "Resistencias"
      - "Diodos y condensadores cerámicos"
      - "Los cuatro chips de radio SIP"
      - "Condensadores electrolíticos"
      - "Componentes de radiofrecuencia"
      - "Variable, potenciómetros e interruptores"
      - "Display y conectores; el TEA2025, lo último"
    exito: "De lo bajo y resistente al calor a lo alto y delicado; el TEA2025 y la revisión final, al cierre."
    pistas:
      - { texto: "Lo más bajo y resistente va primero: las resistencias." }
    escalera:
      - "El variable de plástico y el display son altos y delicados."
    solucion: "Resistencias, diodos y cerámicos, SIP, electrolíticos, RF, variable y mandos, display y TEA2025."

  - id: empareje-marcado
    tipo: pregunta
    titulo: "El marcado abreviado"
    texto: "Empareje cada marcado de la placa con su valor."
    libro: [199, 201]
    widget:
      tipo: figura
      figura: fig-16.14
      zonas:
        - { id: p1, rotulo: "Arriba, el primero", rect: [0, 3, 110, 105] }
    emparejar:
      - ["«2k2»", "2,2 kΩ"]
      - ["«5Ω1»", "5,1 Ω"]
      - ["«103»", "0,01 µF"]
      - ["«104»", "0,1 µF"]
    exito: "La letra hace de coma y da el multiplicador; en los condensadores, la tercera cifra son los ceros en pF."
    pistas:
      - { texto: "En «2k2» la k marca la coma de los kilohmios." }
    escalera:
      - "«104» tiene un cero más que «103»."
    solucion: "2k2, 2,2 kΩ; 5Ω1, 5,1 Ω; 103, 0,01 µF; 104, 0,1 µF."

  - id: banco-resistencia
    tipo: banco
    titulo: "Mídala antes de soldar"
    texto: "El manual recomienda medir cada resistencia con el óhmetro antes de soldarla. Mida una marcada «2k2»."
    libro: [199]
    nota: "El ±5 % del banco es de ejemplo."
    banco:
      piezas: ["Una resistencia del kit marcada «2k2»", "Óhmetro del FNIRSI o del Brymen", "Puntas sin tocar con los dedos"]
      medir: "La resistencia, fuera de la placa."
      esperado: R_k
      unidad: Ω
      tol: 0.05
      consejos:
        - { cuando: { valor: desviacion, mayor: 0.05 }, texto: "Mide de más: ¿es otra de valor parecido? Compruebe sus bandas y su cinta." }
        - { cuando: { valor: desviacion, menor: -0.05 }, texto: "Mide de menos: ¿toca las puntas con los dedos? Su cuerpo queda en paralelo." }
        - { texto: "Correcta: anótela junto a su designador y suéldela." }
      ficha: { n: 10, titulo: "Inventario del kit y lectura de marcados" }
    comprobar:
      - { R_k: 2200 }

  - id: toque-pin1
    tipo: tocar
    titulo: "La patilla 1 de un SIP"
    texto: "Los chips de radio son SIP, de una sola fila, y van directos a la placa. En la foto, toque la marca de la patilla 1."
    libro: [197, 203, 216]
    widget:
      tipo: figura
      figura: fig-16.15
      zonas:
        - { id: punto, rotulo: "El extremo izquierdo del chip", rect: [30, 165, 150, 150] }
        - { id: texto, rotulo: "El rótulo del chip", rect: [250, 150, 470, 135] }
        - { id: patillas, rotulo: "La fila de patillas", rect: [190, 290, 520, 130] }
        - { id: poliestireno, rotulo: "La foto de la derecha", rect: [1100, 60, 160, 290] }
    tocar:
      bien: [punto]
      porque:
        texto: "El rótulo da la referencia, no la orientación."
        patillas: "Las patillas son todas iguales: la orientación la marca el punto."
        poliestireno: "Son condensadores de poliestireno, axiales: no tienen patilla 1."
    exito: "El punto en relieve marca la patilla 1: se inserta según el «1» de la serigrafía."
    escalera:
      - "Busque un punto en relieve en el cuerpo."
    solucion: "El punto del extremo izquierdo."

  - id: pregunta-filtros
    tipo: pregunta
    titulo: "Los filtros cerámicos"
    texto: "CF1 y CF2 parecen simétricos, de tres patillas. ¿Importa cómo se sueldan?"
    libro: [208]
    widget:
      tipo: figura
      figura: fig-16.14
      zonas:
        - { id: p5, rotulo: "Abajo, el primero", rect: [0, 117, 110, 105] }
    opciones:
      - texto: "Sí: el punto marca la patilla 1, la entrada"
        bien: true
        porque: "Montarlos al revés degrada la recepción: un error fácil de cometer y difícil de detectar luego."
      - texto: "No, son simétricos"
        porque: "No lo son: tienen polaridad de conexión."
      - texto: "Solo importa en CF2"
        porque: "Los dos tienen entrada marcada."
    escalera:
      - "Mire la carcasa: lleva un punto."
    solucion: "Sí: el punto es la patilla 1, la entrada."

  - id: predecir-errores
    tipo: predecir
    titulo: "Donde más se falla"
    texto: "¿En qué paso del montaje se cometen más errores?"
    libro: [205]
    widget:
      tipo: figura
      figura: fig-16.14
      zonas:
        - { id: p4, rotulo: "Arriba, el cuarto", rect: [340, 3, 110, 105] }
    opciones:
      - texto: "En los electrolíticos, por la polaridad"
        bien: true
        porque: "La patilla de la banda es el negativo y va con la zona sombreada. Revíselo dos veces."
      - texto: "En las resistencias"
        porque: "Se miden antes de soldar: el error típico está en la polaridad de los electrolíticos."
      - texto: "En los altavoces"
        porque: "Van al final y solo se conectan."
    escalera:
      - "¿Qué componente frecuente tiene polaridad?"
    solucion: "En los electrolíticos."

  - id: porque-bobinas
    tipo: porque
    titulo: "Las bobinas de aire"
    texto: "¿Por qué L1 y L2 no deben recibir el soldador más de 3 segundos por patilla?"
    libro: [207]
    widget:
      tipo: figura
      figura: fig-16.14
      zonas:
        - { id: p5, rotulo: "Abajo, el primero", rect: [0, 117, 110, 105] }
    opciones:
      - texto: "Para no deformar la bobina ni alterar su inductancia"
        bien: true
        porque: "Su geometría fija su valor y la sintonía; antes, raspar 3-4 mm de esmalte y estañar las puntas."
      - texto: "Porque el esmalte conduce"
        porque: "El esmalte aísla: por eso se raspa antes."
      - texto: "Para no fundir el plástico"
        porque: "Esa es la precaución del variable; L1 y L2 son de aire."
    escalera:
      - "¿Qué fija la inductancia de una bobina de aire?"
    solucion: "El calor deforma la bobina y cambia su inductancia."

  - id: predecir-reves
    tipo: predecir
    titulo: "Antes de alimentar"
    texto: "Un integrado quedó soldado al revés y se alimenta la placa. ¿Qué ocurre?"
    libro: [214, 215]
    widget:
      tipo: figura
      figura: fig-16.14
      zonas:
        - { id: p8, rotulo: "Abajo, el cuarto", rect: [340, 117, 110, 105] }
    opciones:
      - texto: "Se destruye y puede arrastrar a otros componentes"
        bien: true
        porque: "Una comprobación de un minuto de las marcas de patilla 1 puede salvar el kit entero."
      - texto: "No funciona, pero al girarlo vuelve a ir"
        porque: "Al revés se destruye en cuanto se alimenta."
      - texto: "Nada: los integrados están protegidos"
        porque: "No contra una inversión: se destruye."
    escalera:
      - "Lea la precaución del final del montaje."
    solucion: "Se destruye en cuanto se alimenta."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [195, 199, 205, 215]
    ideas:
      - { titulo: "El orden.", texto: "De lo bajo y resistente al calor a lo alto y delicado." }
      - { titulo: "Medir antes.", texto: "Cada resistencia con el óhmetro, por los colores poco nítidos." }
      - { titulo: "Orientación.", texto: "Patilla 1 de los SIP, banda de los electrolíticos, punto de los filtros cerámicos." }
      - { titulo: "Antes de alimentar.", texto: "Un minuto revisando los integrados salva el kit." }
