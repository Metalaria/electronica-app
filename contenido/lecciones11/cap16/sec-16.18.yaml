# Lección 1.2 de la sección 15.18 «El Front-End: Preajustes de RF y Oscilador, Bobinas y Condensador Variable» (cap16;
# etiquetas sec-16.N = impresas 15.N).
# - El seguimiento y el orden de ajuste (figura 15.23, fig-16.23, con zonas).
# - Modelo: el tanque del oscilador local, f = 1/(2π·√(L₂·(C_v + C₄B'))), con el variable entre 5 y 24 pF (de ejemplo)
#   y el display, que resta la FI de 10,7 MHz. Con L₂ ≈ 42 nH (el dato de la figura 15.28, 0,042 µH) y C₄B' ≈ 37,6 pF
#   el dial cubre de 88 a 108 MHz. La bobina mueve los dos extremos en la misma proporción; el trimmer pesa sobre todo
#   arriba, donde el variable tiene su capacidad mínima (bloque 385). El margen del 1 % del reto es de ejemplo.
# Pasos prácticos: «reto» de la cobertura con L2 y C4B' (los dos ajustes se influyen y hay que iterar), «ordenar» el
# ajuste y «banco» opcional del tope alto en el display (cerca de 108 MHz; ±1 %, de ejemplo) con la ficha 13.
leccion: cap16/sec-16.18

libro:
  373: "lo que se pierde o se estropea en el front-end, no"
  377: "su única misión es rechazar la imagen"
  378: "debe estar exactamente 10,7 MHz por encima de la emisora en toda la banda"
  382: "la frecuencia va con 1/√C"
  384: "Roscado en el interior"
  385: "en el extremo alto el variable está casi abierto, con su capacidad mínima, comparable a la del trimmer, que es el que manda"
  388: "Repetir 2 y 3 varias veces, porque cada uno afecta ligeramente al otro"
  389: "El paso 4 es el que más se salta"
  392: "Espiras espaciadas: reduce la capacidad parásita entre ellas y sube la autorresonancia"
  395: "el ajuste óptimo con el destornillador dentro no es el óptimo al retirarlo"
  397: "una sonda ×1 sobre un circuito sintonizado lo desintoniza y puede detener el oscilador"
  399: "en los dos topes del dial debe marcar cerca de 88 y de 108 MHz"
  401: "El seguimiento entre oscilador local y sintonía, y el orden de ajuste del front-end"

modelo:
  valores:
    L_2: { sim: "L₂", nombre: "bobina del oscilador", unidad: H, valor: 4.8e-8 }
    C_t: { sim: "C₄B'", nombre: "presintonía del oscilador", unidad: F, valor: 4.4e-11 }
    C_mn: { sim: "C_{v,mín}", nombre: "variable al tope alto (de ejemplo)", unidad: F, valor: 5e-12 }
    C_mx: { sim: "C_{v,máx}", nombre: "variable al tope bajo (de ejemplo)", unidad: F, valor: 2.4e-11 }
    f_I: { sim: "f_{FI}", nombre: "frecuencia intermedia", unidad: Hz, valor: 10700000 }
  calculos:
    f_lo: { expr: "1/(2*pi*sqrt(L_2*(C_mx + C_t))) - f_I", sim: "f_{abajo}", nombre: "display con el variable al tope bajo", unidad: Hz, cifras: 4 }
    f_hi: { expr: "1/(2*pi*sqrt(L_2*(C_mn + C_t))) - f_I", sim: "f_{arriba}", nombre: "display con el variable al tope alto", unidad: Hz, cifras: 4 }

tarjetas:
  - id: explore-seguimiento
    tipo: explorar
    titulo: "La parte delicada"
    texto: "Lo que se pierde en el front-end ya no se recupera. Toque la curva del seguimiento y los pasos del ajuste."
    libro: [373, 401]
    widget:
      tipo: figura
      figura: fig-16.23
      zonas:
        - { id: grafica, rotulo: "La gráfica", rect: [40, 20, 190, 180], texto: "Con solo el núcleo ajustado a 88 MHz, la diferencia se aleja de 10,7 MHz en el extremo alto." }
        - { id: paso1, rotulo: "A la derecha, el primero", rect: [250, 20, 190, 36], texto: "Primero la FI a 10,7 MHz: sin ella, todo se ajusta mal." }
        - { id: paso2, rotulo: "A la derecha, el segundo", rect: [250, 56, 190, 36], texto: "Extremo bajo: el núcleo." }
        - { id: paso3, rotulo: "A la derecha, el tercero", rect: [250, 92, 190, 36], texto: "Extremo alto: el trimmer." }
        - { id: paso4, rotulo: "A la derecha, el cuarto", rect: [250, 128, 190, 36], texto: "Repetir: se influyen." }
        - { id: paso5, rotulo: "A la derecha, el quinto", rect: [250, 164, 190, 36], texto: "Lo mismo en el preselector, buscando la máxima señal." }
    requiere: { mover: [grafica, paso2, paso3] }

  - id: empareje-circuitos
    tipo: pregunta
    titulo: "Los circuitos sintonizados"
    texto: "Al girar el dial se mueven varios circuitos resonantes. Empareje cada uno con su misión."
    libro: [377, 378]
    widget:
      tipo: figura
      figura: fig-16.23
      zonas:
        - { id: grafica, rotulo: "La gráfica", rect: [40, 20, 190, 180] }
    emparejar:
      - ["Preselector de antena", "Rechazar la imagen"]
      - ["Oscilador local", "Estar 10,7 MHz por encima de la emisora"]
    exito: "«En toda la banda»: ahí está el problema, y tiene nombre propio, el seguimiento."
    pistas:
      - { texto: "El preselector no separa emisoras: de eso se encarga la FI." }
    escalera:
      - "Uno filtra la entrada; el otro fija la FI."
    solucion: "Preselector, la imagen; oscilador, 10,7 MHz por encima."

  - id: empareje-ajustes
    tipo: pregunta
    titulo: "Dos tipos de ajuste"
    texto: "La frecuencia va con 1/√C, y los circuitos necesitan leyes distintas. Empareje cada ajuste con dónde actúa."
    libro: [382, 384]
    widget:
      tipo: figura
      figura: fig-16.23
      zonas:
        - { id: paso2, rotulo: "A la derecha, el segundo", rect: [250, 55, 190, 40] }
    emparejar:
      - ["Núcleo de la bobina", "Extremo bajo de la banda"]
      - ["Trimmer en paralelo con el variable", "Extremo alto de la banda"]
    exito: "En el FM7303, el «núcleo» de L1 y L2 es la separación de sus espiras."
    pistas:
      - { texto: "El trimmer solo pesa cuando el variable tiene poca capacidad." }
    escalera:
      - "¿En qué extremo está el variable casi abierto?"
    solucion: "Núcleo, abajo; trimmer, arriba."

  - id: reto-cobertura
    tipo: reto
    titulo: "Cubra la banda"
    texto: "Ajuste L2 y C4B' hasta que el display marque cerca de 88 MHz en el tope bajo y de 108 MHz en el alto."
    nota: "El variable y el margen del 1 % son de ejemplo."
    libro: [385, 388, 399]
    inicio: { L_2: 4.8e-8, C_t: 4.4e-11 }
    widget:
      tipo: grafica
      x: { id: u, min: 0, max: 1, unidad: "", rotulo: "posición del dial" }
      y: { min: 70000000, max: 120000000, unidad: Hz, rotulo: "display" }
      curvas:
        - { expr: "1/(2*pi*sqrt(L_2*(C_mx - u*(C_mx - C_mn) + C_t))) - f_I", color: azul, rotulo: "display" }
        - { expr: "88000000", color: tinta, rotulo: "88 MHz", discontinua: true }
        - { expr: "108000000", color: tinta, rotulo: "108 MHz", discontinua: true }
      marcas:
        - { x: "0", y: "f_lo", rotulo: "{{f_lo}}" }
        - { x: "1", y: "f_hi", rotulo: "{{f_hi}}" }
      lectura: { valor: f_hi, rotulo: "Tope alto" }
      datos:
        - { valor: f_lo, rotulo: "Tope bajo: {{f_lo}}" }
      mandos:
        - { valor: L_2, min: 3.6e-8, max: 4.8e-8, paso: 5e-10, rotulo: "Espiras de L2" }
        - { valor: C_t, min: 3e-11, max: 4.5e-11, paso: 5e-13, rotulo: "Presintonía C4B'" }
    condiciones:
      - { valor: f_lo, objetivo: 88000000, tol: 0.01, rotulo: "Abajo: {{f_lo}}" }
      - { valor: f_hi, objetivo: 108000000, tol: 0.01, rotulo: "Arriba: {{f_hi}}" }
    exito: "Cubre la banda. Cada ajuste movía también el otro extremo: por eso el manual pide repetir varias veces."
    pistas:
      - { cuando: { valor: f_lo, menor: 87120000 }, texto: "Abajo no llega a 88 MHz: baje L2. La bobina mueve toda la banda." }
      - { cuando: { valor: f_lo, mayor: 88880000 }, texto: "Abajo se pasa de 88 MHz: suba L2." }
      - { cuando: { valor: f_hi, menor: 106920000 }, texto: "Arriba no llega a 108 MHz: baje la presintonía C4B', que manda en el tope alto." }
      - { texto: "Arriba se pasa de 108 MHz: suba la presintonía C4B'." }
    escalera:
      - "Ajuste primero L2 para el tope bajo; luego C4B' para el alto; y vuelva a L2."
    solucion: "Unos 42 nH en L2 y unos 37,5 pF en C4B'."
    comprobar:
      - { con: { L_2: 4.2e-8, C_t: 3.75e-11 }, f_lo: 88330000, f_hi: 108420000, tol: 0.003 }

  - id: porque-trimmer
    tipo: porque
    titulo: "Por qué el trimmer manda arriba"
    texto: "¿Por qué el trimmer apenas cuenta en el extremo bajo y manda en el alto?"
    libro: [385]
    widget:
      tipo: figura
      figura: fig-16.23
      zonas:
        - { id: paso3, rotulo: "A la derecha, el tercero", rect: [250, 88, 190, 40] }
    opciones:
      - texto: "Porque arriba el variable está casi abierto y su capacidad es comparable a la del trimmer"
        bien: true
        porque: "Abajo el variable está al máximo y el trimmer apenas suma; la bobina cambia la frecuencia en la misma proporción en toda la banda."
      - texto: "Porque el trimmer es una bobina"
        porque: "Es un condensador en paralelo con el variable."
      - texto: "Porque en el extremo alto hay más señal"
        porque: "Es una cuestión de proporciones de capacidad, no de señal."
    escalera:
      - "¿Cuánta capacidad tiene el variable en cada extremo?"
    solucion: "Arriba, el variable casi abierto: el trimmer es comparable y manda."

  - id: ordene-ajuste
    tipo: pregunta
    titulo: "El orden, que no es negociable"
    texto: "Ordene el ajuste del front-end."
    libro: [388, 389]
    widget:
      tipo: figura
      figura: fig-16.23
      zonas:
        - { id: pasos, rotulo: "Los cinco pasos", rect: [250, 25, 150, 167] }
    ordenar:
      - "Ajustar la FI a 10,7 MHz"
      - "Extremo bajo: el núcleo del oscilador"
      - "Extremo alto: el trimmer del oscilador"
      - "Repetir los dos anteriores varias veces"
      - "Lo mismo en el preselector, por la máxima señal"
    exito: "El paso de repetir es el que más se salta: separa la radio que sintoniza en toda la banda de la que solo va en el centro."
    pistas:
      - { texto: "Sin la FI bien ajustada, todo lo demás se ajusta contra una referencia equivocada." }
    escalera:
      - "La FI, el oscilador abajo y arriba, repetir, y el preselector."
    solucion: "FI, bajo, alto, repetir, preselector."

  - id: empareje-bobinas
    tipo: pregunta
    titulo: "Bobinas de radiofrecuencia"
    texto: "Las bobinas de RF tienen pocas espiras, hilo grueso y aire. Empareje cada rasgo con su razón."
    libro: [392]
    widget:
      tipo: figura
      figura: fig-16.23
      zonas:
        - { id: grafica, rotulo: "La gráfica", rect: [40, 20, 190, 180] }
    emparejar:
      - ["Pocas espiras y aire", "Hacen falta nanohenrios; un núcleo daría pérdidas"]
      - ["Hilo grueso", "Menos resistencia por el efecto pelicular: más Q"]
      - ["Espiras espaciadas", "Menos capacidad parásita, más autorresonancia"]
      - ["Rigidez", "Si se deforma, cambia de valor"]
    exito: "Deformar una bobina al manipular la placa desajusta la radio: una avería autoinfligida frecuente."
    pistas:
      - { texto: "El Q determina la selectividad." }
    escalera:
      - "Cada rasgo protege el valor o el Q de la bobina."
    solucion: "Aire, nanohenrios; hilo grueso, Q; espaciadas, autorresonancia; rigidez, valor."

  - id: predecir-metal
    tipo: predecir
    titulo: "Con destornillador metálico"
    texto: "Ajusta la presintonía con un destornillador metálico hasta el máximo y lo retira. ¿Qué pasa?"
    libro: [395]
    widget:
      tipo: figura
      figura: fig-16.23
      zonas:
        - { id: aviso, rotulo: "El aviso de abajo", rect: [250, 180, 200, 36] }
    opciones:
      - texto: "Deja de estar en el máximo"
        bien: true
        porque: "El óptimo con el destornillador dentro no es el óptimo al retirarlo: plástico o cerámico."
      - texto: "Queda perfecto"
        porque: "El metal cambia el circuito mientras está cerca."
      - texto: "Se funde el trimmer"
        porque: "El problema no es el calor: el metal desintoniza."
    escalera:
      - "El metal forma parte del circuito mientras está cerca."
    solucion: "Se desajusta al retirarlo."

  - id: pregunta-sonda
    tipo: pregunta
    titulo: "Medir el oscilador"
    texto: "Pone una sonda ×1 sobre el circuito sintonizado del oscilador. ¿Qué puede pasar?"
    libro: [397]
    widget:
      tipo: figura
      figura: fig-16.23
      zonas:
        - { id: grafica, rotulo: "La gráfica", rect: [40, 20, 190, 180] }
    opciones:
      - texto: "Que lo desintonice e incluso detenga el oscilador"
        bien: true
        porque: "Se usa ×10, con cuidado, o se mide en un punto de menor impedancia."
      - texto: "Nada: una sonda no carga"
        porque: "Toda sonda carga; la ×1, mucho más."
      - texto: "Que mida el doble"
        porque: "El problema no es la escala: es la carga sobre el circuito."
    escalera:
      - "¿Qué añade la sonda al circuito?"
    solucion: "Lo desintoniza y puede detenerlo."

  - id: banco-topes
    tipo: banco
    titulo: "La cobertura, en el display"
    texto: "Con el receptor alineado, gire el variable a su tope alto y lea la frecuencia en el display."
    nota: "El ±1 % es de ejemplo."
    libro: [399]
    fijar: { L_2: 4.2e-8, C_t: 3.75e-11 }
    banco:
      piezas: ["Receptor con la cobertura ajustada", "El display del kit"]
      medir: "La frecuencia que marca el display con el variable al tope alto."
      esperado: "108000000"
      unidad: Hz
      tol: 0.01
      consejos:
        - { cuando: { valor: desviacion, mayor: 0.01 }, texto: "Se pasa de 108 MHz: retoque C4B' y vuelva a comprobar el tope bajo." }
        - { cuando: { valor: desviacion, menor: -0.01 }, texto: "No llega: retoque C4B' y repita la iteración con L2." }
        - { texto: "Cubre el tope alto. Compruebe también el bajo, cerca de 88 MHz." }
      ficha: { n: 13, titulo: "Cobertura de banda y seguimiento" }

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [377, 385, 388, 395]
    ideas:
      - { titulo: "Seguimiento.", texto: "El oscilador, 10,7 MHz por encima en toda la banda; la frecuencia va con 1/√C." }
      - { titulo: "Dos ajustes.", texto: "Abajo, la bobina; arriba, el trimmer. Se influyen: repetir." }
      - { titulo: "El orden.", texto: "FI, oscilador abajo y arriba, repetir, y el preselector." }
      - { titulo: "Sin metal.", texto: "Destornillador de plástico y sonda ×10." }
