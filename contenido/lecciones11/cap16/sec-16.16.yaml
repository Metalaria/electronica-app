# Lección 1.2 de la sección 15.16 «La Estirpe Toshiba TA y las Equivalencias de los Integrados» (cap16; etiquetas
# sec-16.N = impresas 15.N).
# - Qué debe coincidir y qué puede diferir en un equivalente (figura 15.21, fig-16.21, con zonas).
# - La familia TA7xxx de los radiocasetes de los ochenta, las segundas fuentes y la tabla 15.1 (bloque 334); ejercicios
#   15.1 y 15.10.
# Sección sin cálculos: sin modelo (aviso de secuencia «sin tarjeta de fórmula»).
# Paso práctico: «tocar» en la figura 15.21 el recuadro donde un equivalente puede diferir.
leccion: cap16/sec-16.16

libro:
  332: "conviene probarlos antes de soldarlos definitivamente, insertados de forma provisional en una tira de pines hembra"
  333: "verificar el patillaje en su hoja de datos, porque alguna variante difiere en algún terminal"
  334: "Ninguno en la placa ni en el manual"
  335: "Cinco bloques, cada uno con una misión"
  336: "Qué debe coincidir y qué puede diferir en un equivalente"
  "cap16#530": "Tu kit trae un TA7303P con las patillas oxidadas y el color apagado"

modelo: { valores: {}, calculos: {} }

tarjetas:
  - id: explore-equivalente
    tipo: explorar
    titulo: "Segundas fuentes"
    texto: "Los TA7xxx de Toshiba fueron tan populares que otros fabricantes los copiaron. Toque qué debe coincidir y qué puede diferir."
    libro: [333, 336]
    widget:
      tipo: figura
      figura: fig-16.21
      zonas:
        - { id: coincidir, rotulo: "Arriba a la izquierda", rect: [2, 2, 220, 92], texto: "Debe coincidir: patillaje, función, alimentación, corriente y temperatura." }
        - { id: diferir, rotulo: "Arriba a la derecha", rect: [230, 2, 222, 92], texto: "Puede diferir con criterio: el fabricante, con su prefijo AN, KA, KIA, LA o BA." }
        - { id: trampas, rotulo: "Abajo", rect: [2, 102, 450, 98], texto: "La comprobación segura: cotejar las dos hojas de datos, no la tabla." }
    requiere: { mover: [coincidir, diferir, trampas] }

  - id: empareje-equivalentes
    tipo: pregunta
    titulo: "La tabla de equivalencias"
    texto: "La propia placa imprime equivalentes junto a cada integrado. Empareje cada uno con un equivalente válido."
    libro: [334, "cap16#530"]
    widget:
      tipo: figura
      figura: fig-16.21
      zonas:
        - { id: diferir, rotulo: "Arriba a la derecha", rect: [230, 2, 222, 92] }
    emparejar:
      - ["TA7358", "AN7205 o LA1185"]
      - ["TA7303P", "BA404 o KA2244"]
      - ["TA7343AP", "AN7420N o KA2263"]
      - ["TEA2025", "CD2025"]
    exito: "En su mayoría son compatibles patilla a patilla: un margen de aprovisionamiento muy cómodo."
    pistas:
      - { texto: "El TA7343AP es el decodificador estéreo; su equivalente de Panasonic empieza por AN74." }
    escalera:
      - "Los números del equivalente suelen parecerse a los del original."
    solucion: "TA7358, AN7205; TA7303P, BA404; TA7343AP, AN7420N; TEA2025, CD2025."

  - id: predecir-ta7061
    tipo: predecir
    titulo: "El que no tiene"
    texto: "El TA7061BP, el amplificador de FI de 7 patillas, se estropea. ¿Qué equivalente da la placa?"
    libro: [334]
    widget:
      tipo: figura
      figura: fig-16.21
      zonas:
        - { id: diferir, rotulo: "Arriba a la derecha", rect: [230, 2, 222, 92] }
    opciones:
      - texto: "Ninguno, ni la placa ni el manual"
        bien: true
        porque: "Es el único de radio sin segunda fuente en la tabla de equivalencias."
      - texto: "El BA404"
        porque: "El BA404 es equivalente del TA7303P, no del TA7061BP."
      - texto: "El KA2206"
        porque: "El KA2206 aparece como similar al amplificador de audio, y no es compatible patilla a patilla."
    escalera:
      - "Mire la fila del TA7061BP en la tabla."
    solucion: "Ninguno."

  - id: pregunta-similares
    tipo: pregunta
    titulo: "Similares, no compatibles"
    texto: "Para el TEA2025 la tabla nombra KA2206, AN7147 y LA4192. ¿Puede montar uno directamente?"
    libro: [334]
    widget:
      tipo: figura
      figura: fig-16.21
      zonas:
        - { id: trampas, rotulo: "Abajo", rect: [2, 102, 450, 98] }
    opciones:
      - texto: "No: son similares, no compatibles patilla a patilla"
        bien: true
        porque: "Misma función no es mismo patillaje: hay que cotejar las hojas de datos."
      - texto: "Sí: aparecen en la tabla"
        porque: "La tabla los da como similares, no como compatibles patilla a patilla."
      - texto: "Sí, si son del mismo fabricante"
        porque: "Son de fabricantes distintos y difieren en las patillas."
    escalera:
      - "Lea la última fila de la tabla de equivalencias."
    solucion: "No: no son compatibles patilla a patilla."

  - id: porque-oxidados
    tipo: porque
    titulo: "Patillas oxidadas"
    texto: "Su TA7303P llega con las patillas oxidadas y el color apagado. ¿Por qué es habitual en este kit?"
    libro: [332, "cap16#530"]
    widget:
      tipo: figura
      figura: fig-16.21
      zonas:
        - { id: coincidir, rotulo: "Arriba a la izquierda", rect: [2, 2, 220, 92] }
    opciones:
      - texto: "Porque llevan décadas fuera de producción y son de recuperación"
        bien: true
        porque: "Circulan de recuperación o de existencias antiguas: no es un defecto del kit, es la realidad de componentes históricos."
      - texto: "Porque el kit es una falsificación"
        porque: "Es lo esperable en integrados descatalogados de los ochenta."
      - texto: "Porque se oxidan al soldarlos"
        porque: "Llegan así: son existencias antiguas."
    escalera:
      - "¿Cuándo se diseñaron estos integrados?"
    solucion: "Son descatalogados: de recuperación o de existencias antiguas."

  - id: pregunta-probar
    tipo: pregunta
    titulo: "Antes de soldar"
    texto: "Los SIP de radio se sueldan directos a la placa. ¿Qué precaución tomar con un integrado de recuperación?"
    libro: [332]
    widget:
      tipo: figura
      figura: fig-16.21
      zonas:
        - { id: coincidir, rotulo: "Arriba a la izquierda", rect: [2, 2, 220, 92] }
    opciones:
      - texto: "Probarlo insertado provisionalmente en una tira de pines hembra"
        bien: true
        porque: "Si falla, se sustituye sin desoldar nada."
      - texto: "Soldarlo y probarlo después"
        porque: "Desoldar un SIP tiene riesgo: mejor probarlo antes."
      - texto: "Lijarle las patillas a fondo"
        porque: "La precaución es probarlo antes de soldarlo definitivamente."
    escalera:
      - "¿Cómo se prueba algo sin soldarlo?"
    solucion: "Probarlo en una tira de pines hembra."

  - id: toque-diferir
    tipo: tocar
    titulo: "Lo que puede cambiar"
    texto: "Toque el recuadro de lo que puede diferir en un equivalente."
    libro: [333, 336]
    widget:
      tipo: figura
      figura: fig-16.21
      zonas:
        - { id: coincidir, rotulo: "Arriba a la izquierda", rect: [2, 2, 220, 92] }
        - { id: diferir, rotulo: "Arriba a la derecha", rect: [230, 2, 222, 92] }
        - { id: trampas, rotulo: "Abajo", rect: [2, 102, 450, 98] }
    tocar:
      bien: [diferir]
      porque:
        coincidir: "Ahí está lo que no puede cambiar: el patillaje, la función, la alimentación."
        trampas: "Son las trampas de las tablas de equivalencias."
    exito: "El fabricante, con su prefijo, puede cambiar; el patillaje, no: verifíquelo en la hoja de datos."
    escalera:
      - "El prefijo AN, KA, KIA, LA o BA cambia de un fabricante a otro."
    solucion: "Arriba a la derecha."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [332, 333, 334, 335]
    ideas:
      - { titulo: "Clásicos.", texto: "TA7xxx de los ochenta, fuera de producción: probarlos antes de soldar." }
      - { titulo: "Segundas fuentes.", texto: "AN, KA, KIA, LA o BA: casi siempre hay un sustituto." }
      - { titulo: "Con cuidado.", texto: "Verificar el patillaje en la hoja de datos; similares no es compatibles." }
      - { titulo: "Sin equivalente.", texto: "El TA7061BP no tiene ninguno en la placa ni en el manual." }
