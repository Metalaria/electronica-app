# Lección 1.2 de la sección 15.13 «Montaje de la Carcasa» (cap16; etiquetas sec-16.N = impresas 15.N).
# - La vista explosionada de la carcasa (figura 15.19, fig-16.19, con zonas en los rótulos de la derecha y en las
#   piezas).
# - La preparación, el orden de montaje recomendado y la placa de batería opcional (15.13.1 a 15.13.3); la nota del
#   bloque 278: el herraje concreto varía según el kit.
# Sección sin cálculos: sin modelo (aviso de secuencia «sin tarjeta de fórmula»).
# Pasos prácticos: «ordenar» el montaje de la carcasa y «tocar» la pieza que separa las soldaduras del panel base.
leccion: cap16/sec-16.13

libro:
  277: "El producto acabado mide unos 200 × 132 × 65 mm"
  278: "dependen del juego de piezas que venga con tu kit"
  279: "Vista explosionada esquemática del montaje de la carcasa"
  281: "Si no la quitas, queda un acabado mate y feo"
  283: "de modo que las soldaduras de la cara inferior no toquen el panel"
  285: "recién cargadas llegan a 12,6 V, algo por encima del máximo que indica el manual"
  286: "Aprieta solo lo justo para que quede firme"

modelo: { valores: {}, calculos: {} }

tarjetas:
  - id: explore-carcasa
    tipo: explorar
    titulo: "El aparato terminado"
    texto: "Con la placa alineada, falta alojarla en su carcasa de metacrilato. Toque las piezas de la vista explosionada."
    libro: [277, 279]
    widget:
      tipo: figura
      figura: fig-16.19
      zonas:
        - { id: frontal, rotulo: "Arriba: el panel con mandos", rect: [10, 20, 290, 48], texto: "El panel frontal: ventana del display, medidor, mandos y LED." }
        - { id: altavoces, rotulo: "Los dos cilindros", rect: [55, 75, 200, 42], texto: "Los dos altavoces, en sus alojamientos." }
        - { id: placa, rotulo: "La placa verde", rect: [10, 130, 290, 45], texto: "La placa montada, sobre separadores." }
        - { id: base, rotulo: "Abajo: el panel base", rect: [10, 190, 290, 40], texto: "El panel base sujeta la placa." }
        - { id: antena, rotulo: "La varilla de la derecha", rect: [300, 105, 120, 40], texto: "La antena telescópica, conectada al punto de antena de la placa." }
    requiere: { mover: [frontal, placa, base] }

  - id: ordene-carcasa
    tipo: pregunta
    titulo: "El orden recomendado"
    texto: "Ordene el montaje de la carcasa."
    libro: [278, 283]
    widget:
      tipo: figura
      figura: fig-16.19
      zonas:
        - { id: vista, rotulo: "La vista explosionada", rect: [10, 20, 290, 210] }
    ordenar:
      - "Fijar los altavoces en sus alojamientos"
      - "Montar la placa sobre la base con separadores"
      - "Acoplar el panel frontal"
      - "Colocar los botones de sintonía y volumen"
      - "Montar y conectar la antena"
      - "Cerrar con los paneles restantes"
    exito: "Es una guía general: adáptela al herraje concreto de su kit."
    pistas:
      - { texto: "Los botones van sobre sus ejes cuando el panel frontal ya está puesto." }
    escalera:
      - "Primero lo que va dentro; el cierre, lo último."
    solucion: "Altavoces, placa, frontal, mandos, antena, cierre."

  - id: toque-separadores
    tipo: tocar
    titulo: "Lejos del panel"
    texto: "Toque las piezas que evitan que las soldaduras de la cara inferior toquen el panel base."
    libro: [283]
    widget:
      tipo: figura
      figura: fig-16.19
      zonas:
        - { id: separadores, rotulo: "Las columnas entre placa y base", rect: [20, 162, 275, 36] }
        - { id: frontal, rotulo: "Arriba: el panel con mandos", rect: [10, 20, 290, 48] }
        - { id: altavoces, rotulo: "Los dos cilindros", rect: [55, 75, 200, 42] }
        - { id: base, rotulo: "Abajo: el panel base", rect: [10, 199, 290, 36] }
    tocar:
      bien: [separadores]
      porque:
        frontal: "El panel frontal va encima, con los mandos y las ventanas."
        altavoces: "Los altavoces van en sus alojamientos, no bajo la placa."
        base: "Es el panel que hay que proteger de las soldaduras."
    exito: "Los separadores, en los orificios de las esquinas: las soldaduras quedan en el aire."
    escalera:
      - "Busque lo que hay entre la placa y la base."
    solucion: "Los separadores."

  - id: predecir-pelicula
    tipo: predecir
    titulo: "La película protectora"
    texto: "Los paneles de metacrilato vienen con película protectora. ¿Qué pasa si no se quita?"
    libro: [281]
    widget:
      tipo: figura
      figura: fig-16.19
      zonas:
        - { id: frontal, rotulo: "Arriba: el panel con mandos", rect: [10, 20, 290, 48] }
    opciones:
      - texto: "Queda un acabado mate y feo"
        bien: true
        porque: "Se quita por ambas caras justo antes de montar, para no rayar el acrílico."
      - texto: "Nada: protege mejor el panel"
        porque: "Protege antes de montar; montado, deja un acabado mate."
      - texto: "Se funde con el calor de la placa"
        porque: "El problema es estético: queda mate y feo."
    escalera:
      - "¿Para qué es transparente el metacrilato?"
    solucion: "Un acabado mate y feo."

  - id: pregunta-apretar
    tipo: pregunta
    titulo: "El metacrilato"
    texto: "Un panel ofrece resistencia al montarlo. ¿Qué hace?"
    libro: [286]
    widget:
      tipo: figura
      figura: fig-16.19
      zonas:
        - { id: frontal, rotulo: "Arriba: el panel con mandos", rect: [10, 20, 290, 48] }
    opciones:
      - texto: "No insiste: revisa la alineación de orificios y ejes"
        bien: true
        porque: "El metacrilato es frágil y se agrieta si se fuerza o se aprieta de más."
      - texto: "Aprieta más los tornillos"
        porque: "Apretar de más agrieta el acrílico: solo lo justo para que quede firme."
      - texto: "Lima el orificio"
        porque: "Lo primero es revisar la alineación, sin forzar."
    escalera:
      - "¿Qué le pasa al acrílico si se fuerza?"
    solucion: "Revisar la alineación, sin forzar."

  - id: predecir-bateria
    tipo: predecir
    titulo: "Tres celdas de litio"
    texto: "Alimenta con tres celdas de litio de 11,1 V nominales, recién cargadas. ¿Qué conviene saber?"
    libro: [285]
    widget:
      tipo: figura
      figura: fig-16.19
      zonas:
        - { id: base, rotulo: "Abajo: el panel base", rect: [10, 190, 290, 40] }
    opciones:
      - texto: "Llegan a 12,6 V, algo por encima del máximo del manual"
        bien: true
        porque: "Tres celdas son ideales en nominal, pero recién cargadas superan los 12 V."
      - texto: "Dan menos de 9 V y la sensibilidad cae"
        porque: "Al revés: recién cargadas dan más de su nominal."
      - texto: "Introducen ruido de red"
        porque: "La batería es la alternativa más limpia: no hay red."
    escalera:
      - "Una celda de litio cargada pasa de su tensión nominal."
    solucion: "12,6 V recién cargadas."

  - id: porque-bateria
    tipo: porque
    titulo: "La placa de batería"
    texto: "Según el manual, la placa de batería opcional mejora la recepción de las emisoras débiles. ¿Por qué?"
    libro: [285]
    widget:
      tipo: figura
      figura: fig-16.19
      zonas:
        - { id: placa, rotulo: "La placa verde", rect: [10, 130, 290, 45] }
    opciones:
      - texto: "Porque elimina cualquier ruido que entrara por la red"
        bien: true
        porque: "Bloquea por completo las interferencias que podrían entrar por una fuente externa."
      - texto: "Porque da más tensión"
        porque: "Debe estar igual entre 9 y 12 V: la mejora es de limpieza."
      - texto: "Porque sustituye a la antena"
        porque: "La antena sigue siendo la telescópica."
    escalera:
      - "¿Qué trae una fuente externa además de tensión?"
    solucion: "Quita el ruido de la red."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [278, 281, 283, 286]
    ideas:
      - { titulo: "Preparar.", texto: "Película fuera justo antes de montar; inventario del herraje." }
      - { titulo: "En orden.", texto: "Altavoces, placa sobre separadores, frontal, mandos, antena y cierre." }
      - { titulo: "Sin forzar.", texto: "El metacrilato se agrieta: apretar solo lo justo." }
      - { titulo: "Batería.", texto: "La alimentación más limpia; recién cargada, por encima de 12 V." }
