# Lección 1.2 de la sección 15.13 «Montaje de la Carcasa» (cap16; etiquetas sec-16.N = impresas 15.N).
# - La vista explosionada de la carcasa (figura 15.19, fig-16.19, con zonas en los rótulos de la derecha y en las
#   piezas).
# - La preparación, el orden de montaje recomendado y la placa de batería opcional (15.13.1 a 15.13.3); la nota del
#   bloque 278: el herraje concreto varía según el kit.
# Sección sin cálculos: sin modelo (aviso de secuencia «sin tarjeta de fórmula»).
# Pasos prácticos: «ordenar» el montaje de la carcasa y «tocar» la pieza que separa las soldaduras del panel base.
# 1.2.1 (autor121-senpro, «aprender haciendo», GUIA §13): en la vista 15.19 se tocan las piezas en el orden de montaje
# (sustituye al ordenar) y los separadores; se cargan las tres celdas de litio hasta pasar de 12 V. No forzar el
# metacrilato se funde en la pregunta de la película, la única de opciones; la placa de batería, en el éxito de las
# celdas.
leccion: cap16/sec-16.13

libro:
  277: "El producto acabado mide unos 200 × 132 × 65 mm"
  278: "dependen del juego de piezas que venga con tu kit"
  279: "Vista explosionada esquemática del montaje de la carcasa"
  281: "Si no la quitas, queda un acabado mate y feo"
  283: "de modo que las soldaduras de la cara inferior no toquen el panel"
  285: "recién cargadas llegan a 12,6 V, algo por encima del máximo que indica el manual"
  286: "Aprieta solo lo justo para que quede firme"

modelo:
  valores:
    V_c: { sim: "V_{celda}", nombre: "tensión de cada celda", unidad: V, valor: 3.7 }
  calculos:
    V_b: { expr: "3*V_c", sim: "V", nombre: "tres celdas en serie", unidad: V }

tarjetas:
  - id: explore-carcasa
    tipo: tocar
    titulo: "El aparato terminado"
    texto: "Con la placa alineada, falta alojarla en su carcasa de metacrilato. Toque las piezas en el orden de montaje recomendado."
    libro: [277, 278, 279]
    widget:
      tipo: figura
      figura: fig-16.19
      zonas:
        - { id: frontal, rotulo: "Panel de arriba", rect: [10, 20, 290, 48] }
        - { id: altavoces, rotulo: "Altavoces", rect: [55, 75, 200, 42] }
        - { id: placa, rotulo: "La placa", rect: [10, 130, 290, 45] }
        - { id: base, rotulo: "Panel de abajo", rect: [10, 190, 290, 40] }
        - { id: antena, rotulo: "La antena", rect: [300, 105, 120, 40] }
    tocar:
      bien: [altavoces, placa, frontal, antena]
      orden: true
      porque:
        base: "La base recibe la placa: se toca la placa, que se monta sobre ella."
    exito: "Altavoces, placa sobre la base, panel frontal con los mandos, antena y, al final, el cierre. Adáptelo al herraje de su kit."
    escalera:
      - "Primero lo que va dentro, después lo que lo tapa."
    solucion: "Altavoces, placa, panel frontal y antena."

  - id: toque-separadores
    tipo: tocar
    titulo: "Lejos del panel"
    texto: "Toque las piezas que evitan que las soldaduras de la cara inferior toquen el panel base."
    libro: [283]
    widget:
      tipo: figura
      figura: fig-16.19
      zonas:
        - { id: separadores, rotulo: "Las columnas entre placa y base", rect: [20, 162, 275, 36] }
        - { id: frontal, rotulo: "Arriba: el panel con mandos", rect: [10, 20, 290, 48] }
        - { id: altavoces, rotulo: "Los dos cilindros", rect: [55, 75, 200, 42] }
        - { id: base, rotulo: "Abajo: el panel base", rect: [10, 199, 290, 36] }
    tocar:
      bien: [separadores]
      porque:
        frontal: "El panel frontal va encima, con los mandos y las ventanas."
        altavoces: "Los altavoces van en sus alojamientos, no bajo la placa."
        base: "Es el panel que hay que proteger de las soldaduras."
    exito: "Los separadores, en los orificios de las esquinas: las soldaduras quedan en el aire."
    escalera:
      - "Busque lo que hay entre la placa y la base."
    solucion: "Los separadores."

  - id: predecir-pelicula
    tipo: predecir
    titulo: "La película protectora"
    texto: "Los paneles de metacrilato vienen con película protectora. ¿Qué pasa si no se quita?"
    libro: [281, 286]
    widget:
      tipo: figura
      figura: fig-16.19
      zonas:
        - { id: frontal, rotulo: "Arriba: el panel con mandos", rect: [10, 20, 290, 48] }
    opciones:
      - texto: "Queda un acabado mate y feo"
        bien: true
        porque: "Se quita por ambas caras justo antes de montar. Y si un panel se resiste, no se fuerza: el metacrilato se agrieta."
      - texto: "Nada: protege mejor el panel"
        porque: "Protege antes de montar; montado, deja un acabado mate."
      - texto: "Se funde con el calor de la placa"
        porque: "El problema es estético: queda mate y feo."
    escalera:
      - "¿Para qué es transparente el metacrilato?"
    solucion: "Un acabado mate y feo."

  - id: predecir-bateria
    tipo: explorar
    titulo: "Tres celdas de litio"
    texto: "Tres celdas de litio dan 11,1 V nominales, ideales para el FM7303. Cárguelas y vea si siguen dentro del máximo de 12 V."
    libro: [285]
    inicio: { V_c: 3.7 }
    widget:
      tipo: grafica
      x: { id: v, min: 3, max: 4.5, unidad: V, rotulo: "V_{celda}" }
      y: { min: 8, max: 14, unidad: V, rotulo: "V" }
      curvas:
        - { expr: "3*v", color: naranja, rotulo: "tres celdas" }
        - { expr: "12", color: tinta, rotulo: "máximo del manual", discontinua: true }
      marcas:
        - { x: "V_c", y: "V_b", rotulo: "{{V_b}}" }
      lectura: { valor: V_b, rotulo: "Tensión de la batería" }
      mandos:
        - { valor: V_c, lista: [3.7, 4.2], nombres: [nominal, recién cargada], rotulo: "Estado de las celdas" }
    objetivo:
      condiciones:
        - { valor: V_b, min: 12.5, rotulo: "{{V_b}}" }
      logrado: "Recién cargadas, {{V_b}}: algo por encima del máximo. A cambio, la placa de batería quita el ruido que entraría por la red."
      pistas:
        - { texto: "Aún en nominal: cárguelas." }
    escalera:
      - "Cada celda sube al cargarse."
    solucion: "Recién cargadas: 12,6 V."
    comprobar:
      - { con: { V_c: 4.2 }, V_b: 12.6 }
      - { con: { V_c: 3.7 }, V_b: 11.1 }

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [278, 281, 283, 286]
    ideas:
      - { titulo: "Preparar.", texto: "Película fuera justo antes de montar; inventario del herraje." }
      - { titulo: "En orden.", texto: "Altavoces, placa sobre separadores, frontal, mandos, antena y cierre." }
      - { titulo: "Sin forzar.", texto: "El metacrilato se agrieta: apretar solo lo justo." }
      - { titulo: "Batería.", texto: "La alimentación más limpia; recién cargada, por encima de 12 V." }
