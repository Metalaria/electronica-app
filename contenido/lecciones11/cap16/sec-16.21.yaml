# Lección 1.2 de la sección 15.21 «El Mapa de Tensiones y los Datos de las Bobinas» (cap16; etiquetas sec-16.N =
# impresas 15.N).
# - Los puntos del mapa con sus valores y los datos de las bobinas (figura 15.28, fig-16.28, con zonas por filas).
# - Modelo: la desviación de una medida frente al mapa, (medida − esperado)/esperado; las tolerancias del libro:
#   alimentaciones ±5 %, polarizaciones ±10 %, y «una del 50 % señala la zona» (bloques 475 a 478). Y la resonancia del
#   primario de B1, 3 µH con C13 de 75 pF «cerca de 10,7 MHz» (los datos de la tarjeta del bloque 501): 10,6 MHz.
# Pasos prácticos: «simular» la desviación de la patilla 9 del TA7358AP con 3,0 V medidos frente a 5,9 V (−49 %; error
# típico: dividir por la medida, 97 %) y «banco» opcional de la salida del 78L06 (6 V ±5 %) con la ficha 17. Los 3,0 V
# medidos son de ejemplo.
leccion: cap16/sec-16.21

libro:
  452: "es lo que convierte el diagnóstico en comparar en lugar de deducir"
  455: "La entrada de alimentación, antes y después del regulador"
  459: "debe estar a media alimentación o a cero según la topología"
  463: "hay que medirlo cuando está bien, no cuando falla"
  471: "si una bobina se daña o se pierde, con esos datos se rehace"
  472: "anotar la posición del núcleo tras el ajuste"
  475: "Alimentaciones: ±5 %."
  476: "Tensiones de polarización: ±10 % suele bastar"
  477: "Intensidad de señal: muy variable"
  478: "una desviación pequeña no significa nada; una del 50 % señala la zona"
  480: "medir y anotar todo el mapa con el receptor recién montado y funcionando"
  483: "Los puntos del mapa de tensiones con sus valores en el FM7303 y los datos de las bobinas del kit"
  "cap16#223": "6 V a la salida del 78L06 (5,9 V en la patilla 9 del TA7358AP, tras L3)"
  "cap16#501": "11 espiras (3 µH; resuena con C13, de 75 pF, cerca de 10,7 MHz)"

modelo:
  valores:
    V_e: { sim: "V_{mapa}", nombre: "valor del mapa", unidad: V, valor: 5.9 }
    V_m: { sim: "V_{medida}", nombre: "valor medido (de ejemplo)", unidad: V, valor: 3.0 }
    L_b: { sim: "L_{B1}", nombre: "primario de B1", unidad: H, valor: 3e-6 }
    C_13: { sim: "C₁₃", nombre: "condensador del primario", unidad: F, valor: 75e-12 }
    V_r: { sim: "V_{78L06}", nombre: "salida del 78L06", unidad: V, valor: 6 }
  calculos:
    d_v: { expr: "(V_m - V_e)/V_e*100", sim: "desviación", nombre: "desviación respecto al mapa", unidad: "%", cifras: 2 }
    d_x: { expr: "(V_e - V_m)/V_m*100", sim: "desviación mal", nombre: "dividiendo por la medida", unidad: "%", cifras: 2 }
    f_b: { expr: "1/(2*pi*sqrt(L_b*C_13))", sim: "f_{B1}", nombre: "resonancia del primario de B1", unidad: Hz, cifras: 3 }

tarjetas:
  - id: explore-mapa
    tipo: explorar
    titulo: "Lo que hace diagnosticable el receptor"
    texto: "Un mapa de tensiones convierte el diagnóstico en comparar en lugar de deducir. Toque sus filas y los datos de las bobinas."
    libro: [452, 459, 483]
    widget:
      tipo: figura
      figura: fig-16.28
      zonas:
        - { id: entrada, rotulo: "Las dos primeras filas", rect: [5, 10, 440, 60], texto: "La entrada, antes y después de cada regulador, y la alimentación de cada integrado en sus pines." }
        - { id: sintonia, rotulo: "Las filas tercera y cuarta", rect: [5, 70, 440, 46], texto: "La tensión del varicap (TP1) y la intensidad de señal, con y sin antena." }
        - { id: audio, rotulo: "Las filas quinta y sexta", rect: [5, 116, 440, 46], texto: "La salida de audio en reposo, a media alimentación, y los puntos de prueba del kit." }
        - { id: bobinas, rotulo: "La tabla de abajo", rect: [5, 212, 440, 95], texto: "Los datos de las bobinas: espiras, hilo, núcleo y bobinado." }
    requiere: { mover: [entrada, sintonia, bobinas] }

  - id: empareje-tolerancias
    tipo: pregunta
    titulo: "La tolerancia del mapa"
    texto: "Un mapa de tensiones no da valores exactos. Empareje cada tipo de punto con su margen."
    libro: [475, 476, 477]
    widget:
      tipo: figura
      figura: fig-16.28
      zonas:
        - { id: tolerancia, rotulo: "El texto del centro", rect: [60, 165, 330, 40] }
    emparejar:
      - ["Alimentaciones", "±5 %"]
      - ["Tensiones de polarización", "±10 %"]
      - ["Intensidad de señal", "Muy variable, según emisora y antena"]
    exito: "Una desviación pequeña no significa nada; una del 50 % señala la zona."
    pistas:
      - { texto: "Las alimentaciones salen de reguladores: son las más estrictas." }
    escalera:
      - "Cuanto más depende del exterior, más margen."
    solucion: "Alimentaciones ±5 %, polarizaciones ±10 %, señal muy variable."

  - id: predecir-tp3
    tipo: predecir
    titulo: "Una pequeña diferencia"
    texto: "Su mapa dice 4,6 V en TP3 y hoy mide 4,4 V. ¿Qué significa?"
    libro: [476, 478]
    fijar: { V_e: 4.6, V_m: 4.4 }
    widget:
      tipo: figura
      figura: fig-16.28
      zonas:
        - { id: puntos, rotulo: "Las filas quinta y sexta", rect: [5, 116, 440, 46] }
    opciones:
      - texto: "Nada: está dentro del ±10 % de una polarización"
        bien: true
        porque: "Es un −4,35 %: una desviación pequeña no significa nada."
      - texto: "Que el detector está averiado"
        porque: "Un 4 % de diferencia entra en la tolerancia: no señala nada."
      - texto: "Que hay que reajustar B2 enseguida"
        porque: "Ajustar sin motivo estropea el ajuste: la medida está en tolerancia."
    escalera:
      - "Calcule la desviación y compárela con el ±10 %."
    solucion: "−4,35 %: dentro de tolerancia."
    comprobar:
      - { d_v: -4.35, tol: 0.01 }

  - id: simule-desviacion
    tipo: simular
    titulo: "Una desviación grande"
    texto: "El mapa dice 5,9 V en la patilla 9 del TA7358AP y hoy mide 3,0 V. ¿Qué desviación es, en tanto por ciento?"
    nota: "Los 3,0 V son de ejemplo."
    libro: [478, "cap16#223"]
    fijar: { V_e: 5.9, V_m: 3.0 }
    simular:
      objetivo: d_v
      unidad: "%"
      tol: 0.05
      rotulo: "Desviación"
      errores:
        - { expr: "d_x", texto: "Ha dividido por la medida: la desviación se calcula sobre el valor del mapa, el de referencia." }
        - { razon: { min: -1.05, max: -0.95 }, texto: "Es una caída: la desviación es negativa." }
    exito: "Un −49 %: en torno al 50 %, señala la zona. Ahí hay que investigar."
    escalera:
      - "(medida − mapa)/mapa, en tanto por ciento."
    solucion: "(3,0 − 5,9)/5,9 = −49 %."
    comprobar:
      - { d_v: -49.15, d_x: 96.67, tol: 0.01 }

  - id: porque-sano
    tipo: porque
    titulo: "Con el aparato sano"
    texto: "¿Por qué el mapa se mide cuando el receptor funciona bien, y no cuando falla?"
    libro: [463, 480]
    widget:
      tipo: figura
      figura: fig-16.28
      zonas:
        - { id: titulo, rotulo: "El texto del centro", rect: [60, 165, 330, 40] }
    opciones:
      - texto: "Porque es la referencia con la que se comparará la avería"
        bien: true
        porque: "Sin ella, una lectura no dice nada. Anote también las condiciones: alimentación, volumen, antena."
      - texto: "Porque averiado no se puede medir"
        porque: "Se puede medir, pero sin referencia no se sabe qué está mal."
      - texto: "Porque el manual lo da ya medido"
        porque: "Si el kit trae datos, conviene comprobarlos en la unidad concreta."
    escalera:
      - "¿Con qué se compara una medida durante el diagnóstico?"
    solucion: "Es la referencia para comparar."

  - id: estime-b1
    tipo: pregunta
    titulo: "Los datos de B1"
    texto: "El primario de B1 tiene 3 µH y resuena con C13, de 75 pF. ¿A qué frecuencia?"
    libro: ["cap16#501"]
    widget:
      tipo: figura
      figura: fig-16.28
      zonas:
        - { id: bobinas, rotulo: "La tabla de abajo", rect: [5, 212, 440, 95] }
    estimar:
      objetivo: "f_b"
      unidad: Hz
      min: 1000000
      max: 30000000
      paso: 100000
      inicio: 25000000
      tol: 0.03
      rotulo: "Resonancia de B1"
    exito: "Unos 10,6 MHz: cerca de los 10,7 MHz de la FI; el núcleo la lleva a su sitio."
    pistas:
      - { cuando: { valor: estimacion, mayor: 10930000 }, texto: "Demasiado alta: f = 1/(2π·√(L·C))." }
      - { texto: "Demasiado baja: revise los prefijos de µH y pF." }
    escalera:
      - "f = 1/(2π·√(3 µH · 75 pF))."
    solucion: "1/(2π·√(3 µH · 75 pF)) = 10,6 MHz."
    comprobar:
      - { f_b: 10610000, tol: 0.002 }

  - id: pregunta-datos
    tipo: pregunta
    titulo: "Para qué los datos de las bobinas"
    texto: "Anota espiras, hilo, diámetro, longitud y núcleo de cada bobina. ¿Para qué sirve?"
    libro: [471, 472]
    widget:
      tipo: figura
      figura: fig-16.28
      zonas:
        - { id: bobinas, rotulo: "La tabla de abajo", rect: [5, 212, 440, 95] }
    opciones:
      - texto: "Para rehacerla si se daña o se pierde"
        bien: true
        porque: "No son componentes comerciales: sin esos datos el kit queda inservible. Y la posición del núcleo permite volver al ajuste."
      - texto: "Para calcular el consumo"
        porque: "Las bobinas no deciden el consumo; los datos sirven para reproducirlas."
      - texto: "Para el inventario de la lista de materiales"
        porque: "Sirven para rehacerlas: a menudo no se pueden comprar."
    escalera:
      - "¿Se puede comprar una bobina de aire como L1?"
    solucion: "Para rehacerla."

  - id: banco-78l06
    tipo: banco
    titulo: "El mapa, medido"
    texto: "Con el receptor recién montado y funcionando, mida la salida del 78L06 y anótela en su mapa."
    libro: [455, 475, 480, "cap16#223"]
    banco:
      piezas: ["Receptor alineado y funcionando", "Brymen en V⎓", "La ficha del mapa, para guardarla con el proyecto"]
      medir: "La tensión a la salida del 78L06, con la punta negra en masa."
      esperado: V_r
      unidad: V
      tol: 0.05
      consejos:
        - { cuando: { valor: desviacion, mayor: 0.05 }, texto: "Alta para una alimentación: compruebe que mide la salida y no la entrada del regulador." }
        - { cuando: { valor: desviacion, menor: -0.05 }, texto: "Baja: algo carga demasiado el raíl de 6 V, o la entrada no llega." }
        - { texto: "Dentro del ±5 %. Anote también la tensión de alimentación, el volumen y si hay antena." }
      ficha: { n: 17, titulo: "Mapa de tensiones del receptor terminado" }
    comprobar:
      - { V_r: 6 }

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [452, 463, 471, 478]
    ideas:
      - { titulo: "Comparar.", texto: "El mapa, medido con el aparato sano, convierte el diagnóstico en comparar." }
      - { titulo: "Con margen.", texto: "Alimentaciones ±5 %, polarizaciones ±10 %: un 50 % señala la zona." }
      - { titulo: "Las bobinas.", texto: "Espiras, hilo, bobinado y núcleo: con esos datos se rehacen." }
      - { titulo: "Guardarlo.", texto: "Con las condiciones de la medida, junto al proyecto." }
