# Lección 1.2 de la sección 15.9 «Los Puntos de Prueba TP1 a TP4» (cap16; etiquetas sec-16.N = impresas 15.N).
# - Los cuatro puntos en el recorrido de la señal (figura 15.13, fig-16.13) y cómo medir cada uno con el FNIRSI
#   (figura 15.12, fig-16.12), con zonas.
# - La tabla de lo que se espera en cada punto (bloque 181), cómo medir, el punto de masa y la práctica del banco.
# Paso práctico: «banco» opcional, TP3 en continua con el Brymen (4,6 V; ±10 %, la tolerancia de las tensiones de
# polarización de la sección 15.21, cap16#476), con la ficha 15 del cuaderno.
leccion: cap16/sec-16.9

libro:
  170: "Un punto de prueba es una almohadilla o un terminal previsto exclusivamente para medir"
  173: "tres de los puntos siguen el recorrido de la señal (TP2, TP3 y TP4) y el cuarto (TP1) vigila el lazo del AFC"
  176: "TP3 — salida del detector (Det Out, pin 8 del TA7303P)"
  178: "si hay señal en TP2 y no en TP3, el fallo está entre ambos"
  180: "Un punto sin valor de referencia no sirve para nada"
  181: "4,6 V de continua con la señal MPX (audio y piloto de 19 kHz) superpuesta"
  182: "Sin esa referencia, medir en TP2 no dice nada"
  184: "la medida más útil no es la amplitud absoluta sino si hay actividad al sintonizar una emisora"
  185: "en TP3 la comprobación más sencilla es escucharlo"
  187: "la pinza del osciloscopio va a un tornillo lejano, con el latiguillo largo que arruina las medidas rápidas"
  190: "recorrerlos en orden con el aparato funcionando, anotando lo que hay en cada uno"
  191: "provocar un fallo —desconectar la antena, por ejemplo— y volver a recorrerlos"
  192: "Los cuatro puntos de prueba del FM7303 y la forma de medir cada uno"
  193: "Los cuatro puntos de prueba en el recorrido de la señal y qué esperar en cada uno"
  "cap16#397": "una sonda ×1 sobre un circuito sintonizado lo desintoniza"
  "cap16#476": "Tensiones de polarización: ±10 % suele bastar"

modelo:
  valores:
    V_3: { sim: "V_{TP3}", nombre: "tensión continua en TP3", unidad: V, valor: 4.6 }
  calculos: {}

tarjetas:
  - id: explore-puntos
    tipo: explorar
    titulo: "Cuatro preguntas"
    texto: "Un punto de prueba solo sirve para medir. Cada uno de los cuatro responde a una pregunta: tóquelos."
    libro: [170, 173, 193]
    widget:
      tipo: figura
      figura: fig-16.13
      zonas:
        - { id: tp1, rotulo: "Abajo a la izquierda", rect: [76, 160, 36, 36], texto: "TP1, polarización del varicap: ¿está bien ajustado el AFC?" }
        - { id: tp2, rotulo: "Arriba, el primero", rect: [158, 20, 36, 36], texto: "TP2, entrada de FI del TA7303P: ¿hacen su trabajo el front-end, los filtros y el primer amplificador?" }
        - { id: tp3, rotulo: "Arriba, el segundo", rect: [253, 20, 36, 36], texto: "TP3, salida del detector: ¿funciona la detección?" }
        - { id: tp4, rotulo: "Arriba, el tercero", rect: [313, 20, 36, 36], texto: "TP4, el VCO del decodificador: ¿está a 38 kHz?" }
    requiere: { mover: [tp1, tp2, tp3, tp4] }

  - id: empareje-esperado
    tipo: pregunta
    titulo: "Qué esperar"
    texto: "Un punto sin valor de referencia no sirve para nada. Empareje cada punto con lo que debe haber."
    libro: [180, 181, 192]
    widget:
      tipo: figura
      figura: fig-16.12
      zonas:
        - { id: tabla, rotulo: "La tabla", rect: [2, 25, 450, 173] }
    emparejar:
      - ["TP1", "4,6 V de continua, con K1 pulsado y W1 ajustado"]
      - ["TP2", "10,7 MHz al sintonizar una emisora"]
      - ["TP3", "4,6 V de continua con la MPX superpuesta"]
      - ["TP4", "La onda de 38 kHz del VCO"]
    exito: "TP1 y TP3 deben coincidir: los dos, 4,6 V."
    pistas:
      - { texto: "TP2 está en la FI; TP4, en el decodificador estéreo." }
    escalera:
      - "Dos son continuas; dos, señales de una frecuencia concreta."
    solucion: "TP1, 4,6 V; TP2, 10,7 MHz; TP3, 4,6 V con MPX; TP4, 38 kHz."

  - id: predecir-biseccion
    tipo: predecir
    titulo: "Señal en TP2, no en TP3"
    texto: "Con una emisora sintonizada, hay señal en TP2 y no en TP3. ¿Dónde está el fallo?"
    libro: [178, 193]
    widget:
      tipo: figura
      figura: fig-16.13
      zonas:
        - { id: detector, rotulo: "En el centro de la fila", rect: [191, 68, 72, 50] }
    opciones:
      - texto: "Entre los dos: en el TA7303P y su detector"
        bien: true
        porque: "Es la bisección: el problema queda reducido a una etapa sin abrir nada."
      - texto: "En el front-end"
        porque: "Si hay señal en TP2, el front-end y la primera FI funcionan."
      - texto: "En el amplificador de audio"
        porque: "El audio va después de TP3: aquí la señal ya falta antes."
    escalera:
      - "¿Qué etapa hay entre TP2 y TP3?"
    solucion: "Entre TP2 y TP3: el TA7303P."

  - id: toque-afc
    tipo: tocar
    titulo: "El que no sigue la señal"
    texto: "Tres puntos siguen el recorrido de la señal. Toque el que vigila el lazo del AFC."
    libro: [173, 193]
    widget:
      tipo: figura
      figura: fig-16.13
      zonas:
        - { id: tp1, rotulo: "Abajo a la izquierda", rect: [76, 160, 36, 36] }
        - { id: tp2, rotulo: "Arriba, el primero", rect: [158, 20, 36, 36] }
        - { id: tp3, rotulo: "Arriba, el segundo", rect: [253, 20, 36, 36] }
        - { id: tp4, rotulo: "Arriba, el tercero", rect: [313, 20, 36, 36] }
    tocar:
      bien: [tp1]
      porque:
        tp2: "Es la entrada de la FI del TA7303P: está en el camino de la señal."
        tp3: "Es la salida del detector: está en el camino de la señal, aunque de él sale también el AFC."
        tp4: "Es el VCO del decodificador estéreo."
    exito: "TP1: la polarización del varicap. Con K1 pulsado debe valer lo mismo que TP3."
    escalera:
      - "Busque el que cuelga del bloque AFC."
    solucion: "TP1, abajo a la izquierda."

  - id: pregunta-tp2
    tipo: pregunta
    titulo: "Medir en TP2"
    texto: "TP2 es de 10,7 MHz y alta impedancia. ¿Cómo se mide?"
    libro: [184, "cap16#397"]
    widget:
      tipo: figura
      figura: fig-16.12
      zonas:
        - { id: tp2, rotulo: "La segunda fila", rect: [2, 70, 450, 40] }
    opciones:
      - texto: "Con sonda ×10, buscando actividad al sintonizar"
        bien: true
        porque: "Aun con ×10 la sonda carga el circuito: importa si hay actividad, no la amplitud absoluta."
      - texto: "Con el multímetro en continua"
        porque: "El multímetro basta en TP1, que es continua; en TP2 hay 10,7 MHz."
      - texto: "Con sonda ×1, para ver más señal"
        porque: "La ×1 carga más el punto y puede desintonizarlo."
    escalera:
      - "Alta frecuencia y alta impedancia: la sonda que menos carga."
    solucion: "Sonda ×10; lo útil es ver si hay actividad."

  - id: pregunta-tp3
    tipo: pregunta
    titulo: "La comprobación más sencilla"
    texto: "TP3 lleva la señal MPX, de baja frecuencia. ¿Cuál es la comprobación más sencilla?"
    libro: [185]
    widget:
      tipo: figura
      figura: fig-16.12
      zonas:
        - { id: tp3, rotulo: "La tercera fila", rect: [2, 115, 450, 40] }
    opciones:
      - texto: "Escucharlo, con un amplificador de prueba o auriculares con su resistencia"
        bien: true
        porque: "Es de baja frecuencia: cualquier sonda vale, y el oído reconoce el audio al momento."
      - texto: "Medirlo con sonda ×10 y la FFT obligatoriamente"
        porque: "La FFT enseña el piloto, pero lo más sencillo es oírlo."
      - texto: "Contar su frecuencia con el frecuencímetro"
        porque: "Eso es para TP4 y sus 38 kHz; TP3 lleva audio."
    escalera:
      - "Es audio."
    solucion: "Escucharlo."

  - id: porque-masa
    tipo: porque
    titulo: "El punto que falta"
    texto: "¿Por qué el punto de prueba más útil es uno de masa junto a cada punto de señal?"
    libro: [187]
    widget:
      tipo: figura
      figura: fig-16.13
      zonas:
        - { id: nota, rotulo: "El recuadro de abajo", rect: [215, 155, 235, 42] }
    opciones:
      - texto: "Porque sin él la pinza va lejos, con un latiguillo largo"
        bien: true
        porque: "El latiguillo largo arruina las medidas rápidas; en un diseño propio, ese punto cuesta cero."
      - texto: "Para descargar la electricidad estática"
        porque: "Su papel es el retorno corto de la sonda, no la estática."
      - texto: "Porque el multímetro lo necesita"
        porque: "El multímetro mide continua y tolera cables largos: quien sufre es el osciloscopio."
    escalera:
      - "¿Dónde se engancha la pinza de masa del osciloscopio?"
    solucion: "Para que la masa de la sonda vaya corta."

  - id: banco-tp3
    tipo: banco
    titulo: "TP3 en continua"
    texto: "Con el receptor funcionando, mida TP3 con el multímetro, punta negra en masa, y anótelo como referencia."
    libro: [176, 181, 190, "cap16#476"]
    banco:
      piezas: ["Receptor montado y funcionando", "Brymen en V⎓", "Punta negra en masa"]
      medir: "La tensión continua en TP3, la patilla 8 del TA7303P."
      esperado: V_3
      unidad: V
      tol: 0.1
      consejos:
        - { cuando: { valor: desviacion, mayor: 0.1 }, texto: "Alta: el detector no está centrado. Es el ajuste del núcleo de B2." }
        - { cuando: { valor: desviacion, menor: -0.1 }, texto: "Baja: compruebe la alimentación del TA7303P antes de tocar B2." }
        - { texto: "Dentro del ±10 % de una polarización. Anótelo: es su referencia." }
      ficha: { n: 15, titulo: "Verificaciones con el FNIRSI: FI, MPX, audio y rizado" }
    comprobar:
      - { V_3: 4.6 }

  - id: ordene-practica
    tipo: pregunta
    titulo: "La práctica"
    texto: "Ordene la práctica que enseña a usar los puntos de prueba."
    libro: [182, 190, 191]
    widget:
      tipo: figura
      figura: fig-16.13
      zonas:
        - { id: cadena, rotulo: "La fila de bloques", rect: [8, 68, 440, 50] }
    ordenar:
      - "Recorrer los puntos con el aparato funcionando"
      - "Anotar lo que hay en cada uno"
      - "Provocar un fallo, como desconectar la antena"
      - "Volver a recorrerlos y ver dónde desaparece la señal"
    exito: "Con esa referencia anotada, un fallo real se localiza en tres medidas."
    pistas:
      - { texto: "Primero la referencia, con el aparato sano." }
    escalera:
      - "Sin la referencia, el segundo recorrido no dice nada."
    solucion: "Recorrer, anotar, provocar el fallo, volver a recorrer."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [173, 178, 180, 187]
    ideas:
      - { titulo: "Cuatro puntos.", texto: "TP2, TP3 y TP4 en la señal; TP1 en el lazo del AFC." }
      - { titulo: "Con referencia.", texto: "Saber qué debe haber: 4,6 V, 10,7 MHz, MPX y 38 kHz." }
      - { titulo: "Bisección.", texto: "Señal en un punto y no en el siguiente: el fallo está entre ambos." }
      - { titulo: "Bien medidos.", texto: "Sonda ×10 en TP2 y un punto de masa cerca." }
