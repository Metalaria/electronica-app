# Lección 1.2 de la sección 15.17 «Cómo Leer la Placa: Convenciones de Serigrafía y Notas de Montaje» (cap16;
# etiquetas sec-16.N = impresas 15.N).
# - Lo que la serigrafía indica y lo que no garantiza (figura 15.22, fig-16.22, con zonas).
# - La placa real del FM7303 (foto de la figura 15.11, fig-16.11, de la sección 15.8; zonas en píxeles de la foto):
#   TP1 y TP3 con «4V6» y TP4 con «38kHz» (bloque 364).
# - Marcas de polaridad, códigos que no son serigrafía, lo que hay que deducir, convenciones, la serigrafía del FM7303
#   y la fotografía como documentación (bloques 338 a 369).
# Sección sin cálculos: sin modelo (aviso de secuencia «sin tarjeta de fórmula»).
# Pasos prácticos: «tocar» el fiducial en la figura 15.22 y el punto de prueba con su frecuencia impresa en la foto de
# la placa.
leccion: cap16/sec-16.17

libro:
  339: "en reparación sin esquema es a veces la única documentación disponible"
  345: "Conviene fijarse en cuál es la convención de esa placa, porque hay dos y son opuestas"
  352: "No tienen función eléctrica y no hay que confundirlos con puntos de prueba"
  354: "esa marca se rompe al desoldarlo"
  356: "Su valor solo se obtiene del esquema, midiendo tras desoldar, o por comparación con una placa igual"
  361: "Los designadores se numeran por zonas"
  364: "Los puntos de prueba llevan su valor impreso: TP1 y TP3 con «4V6», TP4 con «38kHz»"
  366: "fotografiar ambas caras con buena luz y a resolución alta"
  367: "la fotografía es la única referencia fiable si la serigrafía queda tapada por el propio componente"
  370: "Lo que la serigrafía indica y lo que no garantiza"
  "cap16#166": "La placa real del FM7303 V3.0r7, sin montar"

modelo: { valores: {}, calculos: {} }

tarjetas:
  - id: explore-serigrafia
    tipo: explorar
    titulo: "Documentación impresa"
    texto: "La serigrafía es documentación impresa en la placa: sin esquema, a veces la única. Toque lo que indica."
    libro: [339, 370]
    widget:
      tipo: figura
      figura: fig-16.22
      zonas:
        - { id: designador, rotulo: "Arriba a la izquierda", rect: [18, 36, 100, 50], texto: "Designador y contorno: R12, C5. Permiten cotejar con el esquema y tomar notas sin ambigüedad." }
        - { id: patilla, rotulo: "Arriba en el centro", rect: [130, 34, 65, 70], texto: "Punto y chaflán: la patilla 1 del integrado." }
        - { id: tp, rotulo: "Arriba a la derecha", rect: [214, 34, 40, 55], texto: "Un punto de prueba marcado TP1." }
        - { id: diodo, rotulo: "En medio a la izquierda", rect: [18, 108, 68, 52], texto: "La banda gruesa: el cátodo del diodo." }
        - { id: electrolitico, rotulo: "En medio, el segundo", rect: [90, 100, 60, 70], texto: "El «+» o el semicírculo relleno del negativo." }
        - { id: info, rotulo: "Abajo a la izquierda", rect: [18, 172, 100, 45], texto: "Proyecto, revisión y fecha: dos revisiones pueden diferir en componentes." }
    requiere: { mover: [designador, patilla, diodo, electrolitico] }

  - id: empareje-polaridad
    tipo: pregunta
    titulo: "Las marcas de polaridad"
    texto: "Las marcas de polaridad son las más útiles. Empareje cada componente con su marca."
    libro: [345]
    widget:
      tipo: figura
      figura: fig-16.22
      zonas:
        - { id: placa, rotulo: "La placa dibujada", rect: [8, 28, 260, 190] }
    emparejar:
      - ["Patilla 1 de un integrado", "Punto, muesca, chaflán o marca en «L»"]
      - ["Cátodo de un diodo", "Banda gruesa en un extremo"]
      - ["Electrolítico", "«+», o el semicírculo relleno del negativo"]
      - ["Transistor", "El contorno reproduce su forma"]
    exito: "En los electrolíticos, fíjese en la convención de esa placa: hay dos y son opuestas."
    pistas:
      - { texto: "El chaflán está en el contorno del integrado." }
    escalera:
      - "Cada componente polar tiene su propia marca."
    solucion: "Integrado, punto o chaflán; diodo, banda; electrolítico, «+» o semicírculo; transistor, contorno."

  - id: toque-fiducial
    tipo: tocar
    titulo: "No es un punto de prueba"
    texto: "Uno de estos círculos de cobre parece un punto de prueba y no lo es. Tóquelo."
    libro: [352, 370]
    widget:
      tipo: figura
      figura: fig-16.22
      zonas:
        - { id: tp, rotulo: "Arriba a la derecha", rect: [214, 34, 40, 55] }
        - { id: fiducial, rotulo: "En medio a la derecha", rect: [218, 118, 40, 50] }
        - { id: transistor, rotulo: "En medio, el tercero", rect: [160, 108, 52, 60] }
    tocar:
      bien: [fiducial]
      porque:
        tp: "Es TP1, un punto de prueba de verdad: almohadilla prevista para medir."
        transistor: "Es la huella de un transistor, con sus tres islas."
    exito: "Un fiducial: la máquina de montaje lo usa como referencia óptica. No tiene función eléctrica."
    escalera:
      - "Busque el círculo de cobre desnudo sin rótulo de TP."
    solucion: "El fiducial, en medio a la derecha."

  - id: pregunta-pintura
    tipo: pregunta
    titulo: "Un punto de pintura"
    texto: "Un componente tiene un punto de pintura sobre su soldadura. ¿Qué indica?"
    libro: [354]
    widget:
      tipo: figura
      figura: fig-16.22
      zonas:
        - { id: placa, rotulo: "La placa dibujada", rect: [8, 28, 260, 190] }
    opciones:
      - texto: "Que fue ajustado o revisado en fábrica"
        bien: true
        porque: "Es un sello de inspección: se rompe al desoldarlo, a veces con implicaciones de garantía."
      - texto: "Que es un punto de prueba"
        porque: "Los puntos de prueba llevan TP; la pintura es un sello."
      - texto: "Que está averiado"
        porque: "Marca lo verificado, no lo averiado."
    escalera:
      - "¿Quién pinta un punto sobre una soldadura?"
    solucion: "Un sello de inspección de fábrica."

  - id: pregunta-smd
    tipo: pregunta
    titulo: "Un cerámico SMD sin marcar"
    texto: "Un condensador cerámico SMD no lleva ninguna marca. ¿Cómo se sabe su valor?"
    libro: [356]
    widget:
      tipo: figura
      figura: fig-16.22
      zonas:
        - { id: lista, rotulo: "La lista de la derecha", rect: [280, 30, 168, 150] }
    opciones:
      - texto: "Por el esquema, midiendo tras desoldar o comparando con otra placa"
        bien: true
        porque: "La serigrafía no lo dice: hay que deducirlo."
      - texto: "Por su color"
        porque: "Los cerámicos SMD no llevan código: el color no da el valor."
      - texto: "Midiéndolo en la placa"
        porque: "En la placa, lo que hay en paralelo falsea la medida: se mide tras desoldar."
    escalera:
      - "Las resistencias SMD llevan código; los cerámicos, no."
    solucion: "Esquema, medida tras desoldar o comparación."

  - id: toque-38khz
    tipo: tocar
    titulo: "Los valores impresos"
    texto: "En la placa del FM7303, los puntos de prueba llevan su valor impreso. Toque el que lleva una frecuencia."
    libro: [364, "cap16#166"]
    widget:
      tipo: figura
      figura: fig-16.11
      zonas:
        - { id: tp4, rotulo: "A la izquierda, sobre el chip largo", rect: [235, 245, 150, 120] }
        - { id: tp3, rotulo: "A la derecha, arriba", rect: [895, 240, 120, 120] }
        - { id: tp1, rotulo: "A la derecha, en el centro", rect: [880, 395, 125, 120] }
        - { id: w3, rotulo: "Arriba en el centro izquierda", rect: [375, 105, 120, 120] }
    tocar:
      bien: [tp4]
      porque:
        tp3: "Es TP3, con «4V6»: una tensión."
        tp1: "Es TP1, con «4V6»: la misma tensión que TP3."
        w3: "Es W3, el potenciómetro que ajusta el VCO."
    exito: "TP4, con «38kHz»: el VCO del decodificador. TP2 no está serigrafiado."
    escalera:
      - "Busque «kHz» junto a un TP."
    solucion: "TP4, a la izquierda."

  - id: predecir-electrolitico
    tipo: predecir
    titulo: "Dos convenciones"
    texto: "En una placa desconocida, un electrolítico tiene medio contorno sombreado. ¿Qué hace antes de soldar?"
    libro: [345]
    widget:
      tipo: figura
      figura: fig-16.22
      zonas:
        - { id: electrolitico, rotulo: "En medio, el segundo", rect: [90, 100, 60, 70] }
    opciones:
      - texto: "Comprobar qué convención usa esa placa"
        bien: true
        porque: "Hay dos convenciones opuestas: el lado sombreado puede marcar el negativo o el positivo."
      - texto: "Poner el negativo en lo sombreado, siempre"
        porque: "No siempre: hay dos convenciones y son opuestas."
      - texto: "Da igual cómo se monte"
        porque: "Un electrolítico al revés produce una avería."
    escalera:
      - "¿Cuántas convenciones de electrolíticos hay?"
    solucion: "Comprobar la convención de esa placa."

  - id: porque-foto
    tipo: porque
    titulo: "Fotografiar antes de desoldar"
    texto: "¿Por qué fotografiar ambas caras de la placa antes de desoldar nada?"
    libro: [366, 367]
    widget:
      tipo: figura
      figura: fig-16.22
      zonas:
        - { id: foto, rotulo: "El recuadro amarillo", rect: [280, 185, 168, 35] }
    opciones:
      - texto: "Porque es la única referencia si el componente tapa su serigrafía"
        bien: true
        porque: "La foto registra posición y orientación: un electrolítico o un diodo mal remontado es una avería nueva."
      - texto: "Para la garantía"
        porque: "Lo importante es poder remontar cada pieza como estaba."
      - texto: "Porque la serigrafía se borra al desoldar"
        porque: "No se borra: queda tapada por el propio componente."
    escalera:
      - "¿Qué se ve de la serigrafía con el componente montado encima?"
    solucion: "Es la referencia fiable de posición y orientación."

  - id: pregunta-zonas
    tipo: pregunta
    titulo: "Orientarse en la placa"
    texto: "Busca R7 en una placa bien diseñada que no conoce. ¿Qué le ayuda?"
    libro: [361]
    widget:
      tipo: figura
      figura: fig-16.22
      zonas:
        - { id: designador, rotulo: "Arriba a la izquierda", rect: [18, 36, 100, 50] }
    opciones:
      - texto: "Los designadores se numeran por zonas: R1 a R20 suelen estar juntos"
        bien: true
        porque: "Y los componentes de un bloque se agrupan: la proximidad indica relación."
      - texto: "Está siempre junto al conector"
        porque: "Junto al conector suele estar la alimentación, no una resistencia concreta."
      - texto: "No hay forma: hay que seguir las pistas"
        porque: "Las convenciones de numeración ayudan a localizarlo."
    escalera:
      - "¿Cómo se reparten los números de los designadores?"
    solucion: "La numeración por zonas."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [339, 345, 352, 366]
    ideas:
      - { titulo: "Leer la serigrafía.", texto: "Designadores, contornos, polaridades, puntos de prueba y revisión." }
      - { titulo: "Lo que no es.", texto: "Fiduciales y sellos de pintura no son puntos de prueba." }
      - { titulo: "Lo que no dice.", texto: "Cerámicos SMD sin marca y la convención de cada placa." }
      - { titulo: "Fotografiar.", texto: "Ambas caras, antes de desoldar." }
