# Lección 1.2 de la sección 15.1 «El Proyecto de un Vistazo» (cap16; etiquetas sec-16.N = impresas 15.N).
# - Los cuatro bloques del proyecto y las tres razones del receptor (figura 15.1, fig-16.1, con zonas).
# - La alimentación del manual (caja del bloque 1), lo que hace falta, la estructura del capítulo, la advertencia y el
#   zócalo del TEA2025.
# Sección sin fórmulas ni cálculos: sin modelo (aviso de secuencia «sin tarjeta de fórmula»).
# Paso práctico: «tocar» en la figura 15.1 la razón que hace del receptor un banco de prácticas de diagnóstico.
leccion: cap16/sec-16.1

libro:
  "cap16#1": "NUNCA uses una fuente conmutada. La tensión debe estar entre 9 y 12 V"
  4: "El FM7303 es un receptor de radio en kit"
  5: "Su papel en el libro es ser el puente entre los componentes y los sistemas"
  8: "Radiofrecuencia: front-end, sintonía, superheterodino"
  9: "cada bloque es un capítulo del libro en miniatura"
  12: "Es autocontenido: entra una señal de radio y sale sonido"
  13: "Es diagnosticable por etapas"
  14: "lo que lo convierte en un banco de prácticas de diagnóstico"
  17: "Los componentes y los bloques de la placa"
  20: "Sin osciloscopio se puede montar y no se puede diagnosticar más allá de lo básico"
  24: "entender cada bloque antes de soldarlo, y medir cada etapa según se completa"
  25: "es la que convierte un kit en una escuela"
  27: "comprobar el inventario contra la lista de materiales"
  28: "solo el TEA2025 (DIP-16) admite uno normal"
  29: "Los cuatro bloques del proyecto y por qué un receptor es el vehículo adecuado"

modelo: { valores: {}, calculos: {} }

tarjetas:
  - id: explore-bloques
    tipo: explorar
    titulo: "Un aparato completo"
    texto: "El FM7303 es un receptor de radio en kit: el puente entre los componentes y los sistemas. Toque sus cuatro bloques."
    libro: [4, 5, 8, 29]
    widget:
      tipo: figura
      figura: fig-16.1
      zonas:
        - { id: rf, rotulo: "Arriba, el primero", rect: [4, 4, 100, 66], texto: "Radiofrecuencia: el front-end, la sintonía y el superheterodino." }
        - { id: analogico, rotulo: "Arriba, el segundo", rect: [118, 4, 103, 66], texto: "Analógico: la FI y el detector, el decodificador estéreo y el audio." }
        - { id: digital, rotulo: "Arriba, el tercero", rect: [230, 4, 105, 66], texto: "Digital: el display SC3610D, un frecuencímetro que cuenta el oscilador local." }
        - { id: alimentacion, rotulo: "Arriba, el cuarto", rect: [343, 4, 104, 66], texto: "Alimentación: regulación y desacoplo." }
    requiere: { mover: [rf, analogico, digital, alimentacion] }

  - id: empareje-bloques
    tipo: pregunta
    titulo: "Lo que reúne"
    texto: "Un solo montaje toca casi todo el libro. Empareje cada campo con lo que aporta en el receptor."
    libro: [8, 9]
    widget:
      tipo: figura
      figura: fig-16.1
      zonas:
        - { id: bloques, rotulo: "Los cuatro bloques", rect: [4, 4, 443, 66] }
    emparejar:
      - ["Radiofrecuencia", "Front-end, sintonía y superheterodino"]
      - ["Analógico", "Amplificación de audio, filtrado y volumen"]
      - ["Digital", "El display que cuenta el oscilador local"]
      - ["Realización física", "Soldadura, montaje y ajuste"]
      - ["Diagnóstico", "Puntos de prueba y averías por etapas"]
    exito: "Cada bloque es un capítulo del libro en miniatura; sus interacciones no las enseña ningún ejercicio aislado."
    pistas:
      - { texto: "El display es la única parte digital: cuenta el oscilador local y muestra la emisora." }
    escalera:
      - "Piense en qué parte de la placa trabaja cada campo."
    solucion: "RF, front-end; analógico, audio; digital, display; realización, soldadura; diagnóstico, puntos de prueba."

  - id: toque-razon
    tipo: tocar
    titulo: "Un banco de prácticas"
    texto: "Toque la razón que convierte el receptor en un banco de prácticas de diagnóstico."
    libro: [12, 13, 14, 29]
    widget:
      tipo: figura
      figura: fig-16.1
      zonas:
        - { id: autocontenido, rotulo: "Abajo a la izquierda", rect: [5, 108, 145, 42] }
        - { id: etapas, rotulo: "Abajo en el centro", rect: [152, 108, 146, 42] }
        - { id: falla, rotulo: "Abajo a la derecha", rect: [301, 108, 147, 42] }
    tocar:
      bien: [falla]
      porque:
        autocontenido: "Que entre radio y salga sonido permite comprobarlo sin otro equipo, pero no da averías distintas."
        etapas: "Saber qué debe haber en cada punto ayuda a diagnosticar; el banco de prácticas sale de que falle de formas distintas."
    exito: "Sin sonido, con ruido, con poca sensibilidad, sin sintonía: cada síntoma apunta a una etapa distinta."
    escalera:
      - "Busque la razón que habla de síntomas."
    solucion: "Abajo a la derecha: falla de formas instructivas."

  - id: pregunta-osciloscopio
    tipo: pregunta
    titulo: "Lo que hace falta"
    texto: "Tiene multímetro, pero no osciloscopio. ¿Qué puede hacer con el FM7303?"
    libro: [20]
    widget:
      tipo: figura
      figura: fig-16.1
      zonas:
        - { id: bloques, rotulo: "Los cuatro bloques", rect: [4, 4, 443, 66] }
    opciones:
      - texto: "Montarlo, pero diagnosticar solo lo básico"
        bien: true
        porque: "El multímetro sirve para todo el montaje; el osciloscopio, para el ajuste y el diagnóstico."
      - texto: "Nada: sin osciloscopio no se puede montar"
        porque: "El montaje solo pide multímetro; lo que se pierde es el diagnóstico."
      - texto: "Todo, el multímetro basta"
        porque: "Sin osciloscopio no se puede diagnosticar más allá de lo básico."
    escalera:
      - "Separe montar de diagnosticar."
    solucion: "Se monta con el multímetro; para ajustar y diagnosticar hace falta el osciloscopio."

  - id: ordene-capitulo
    tipo: pregunta
    titulo: "El recorrido"
    texto: "Ordene las cuatro partes en que el capítulo recorre el proyecto."
    libro: [17]
    widget:
      tipo: figura
      figura: fig-16.1
      zonas:
        - { id: bloques, rotulo: "Los cuatro bloques", rect: [4, 4, 443, 66] }
    ordenar:
      - "Los componentes y los bloques de la placa"
      - "Los puntos de prueba, el montaje y el ajuste"
      - "El diagnóstico, la carcasa y la documentación"
      - "La teoría de fondo, con el circuito real delante"
    exito: "Primero qué hace cada integrado; después montar y ajustar; luego diagnosticar; y la teoría, con la placa delante."
    pistas:
      - { texto: "Antes de soldar hay que saber qué hace cada pieza." }
    escalera:
      - "Del componente a la placa, de la placa al diagnóstico, y la teoría al final."
    solucion: "Componentes, montaje y ajuste, diagnóstico, teoría."

  - id: porque-etapa
    tipo: porque
    titulo: "La advertencia"
    texto: "Un kit se puede montar siguiendo instrucciones. ¿Por qué medir cada etapa según se completa?"
    libro: [24, 25]
    widget:
      tipo: figura
      figura: fig-16.1
      zonas:
        - { id: bloques, rotulo: "Los cuatro bloques", rect: [4, 4, 443, 66] }
    opciones:
      - texto: "Porque entender y medir cada bloque convierte el kit en una escuela"
        bien: true
        porque: "Montar todo y esperar que funcione enseña poco; es más lento, y es lo que hace del kit una escuela."
      - texto: "Porque así se monta más deprisa"
        porque: "El libro dice lo contrario: esa forma de proceder es más lenta."
      - texto: "Porque el manual lo exige"
        porque: "Es la propuesta del capítulo, no del manual: entender cada bloque antes de soldarlo."
    escalera:
      - "¿Qué se aprende montando sin entender?"
    solucion: "Entender cada bloque y medirlo al completarlo es lo que convierte el kit en una escuela."

  - id: pregunta-zocalo
    tipo: pregunta
    titulo: "El zócalo"
    texto: "Un integrado en zócalo se sustituye en segundos. ¿Cuál del FM7303 admite un zócalo normal?"
    libro: [28]
    widget:
      tipo: figura
      figura: fig-16.1
      zonas:
        - { id: analogico, rotulo: "Arriba, el segundo", rect: [118, 4, 103, 66] }
    opciones:
      - texto: "Solo el TEA2025, en DIP-16"
        bien: true
        porque: "Los cuatro de radio son SIP y se sueldan directamente; aun así, en zócalo el TEA2025 pierde parte del calor."
      - texto: "Los cuatro integrados de radio"
        porque: "Son SIP y se sueldan directamente: conviene comprobarlos antes de soldarlos."
      - texto: "Ninguno"
        porque: "El TEA2025, en DIP-16, admite uno normal."
    escalera:
      - "Solo uno tiene dos filas de patillas."
    solucion: "El TEA2025 (DIP-16)."

  - id: predecir-fuente
    tipo: predecir
    titulo: "La fuente"
    texto: "Tiene a mano un cargador conmutado de 12 V. ¿Puede alimentar con él el FM7303?"
    libro: ["cap16#1"]
    widget:
      tipo: figura
      figura: fig-16.1
      zonas:
        - { id: alimentacion, rotulo: "Arriba, el cuarto", rect: [343, 4, 104, 66] }
    opciones:
      - texto: "No: nunca una conmutada; regulada con transformador o pilas"
        bien: true
        porque: "El manual lo prohíbe: fuente regulada con transformador o 3 pilas de litio (11,1 V), entre 9 y 12 V."
      - texto: "Sí, si da 12 V"
        porque: "La tensión no basta: el manual prohíbe expresamente las fuentes conmutadas."
      - texto: "Sí, y con más tensión gana sensibilidad"
        porque: "Nunca por encima de 12 V; la sensibilidad cae por debajo de 9 V, no sube por encima."
    escalera:
      - "Lea el aviso de seguridad del principio del capítulo."
    solucion: "No: lineal con transformador o pilas, entre 9 y 12 V."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [9, 14, 24, 27]
    ideas:
      - { titulo: "Un aparato entero.", texto: "Radiofrecuencia, analógico, digital y alimentación: cada bloque, un capítulo en miniatura." }
      - { titulo: "Por qué un receptor.", texto: "Autocontenido, diagnosticable por etapas y con fallos instructivos." }
      - { titulo: "Cómo montarlo.", texto: "Entender cada bloque y medir cada etapa al completarla." }
      - { titulo: "Antes de empezar.", texto: "Inventario contra la lista y leer el capítulo entero." }
