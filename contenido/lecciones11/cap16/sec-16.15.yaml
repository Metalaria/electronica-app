# Lección 1.2 de la sección 15.15 «El Manual Original del Kit, Traducido al Castellano» (cap16; etiquetas sec-16.N =
# impresas 15.N).
# - El plano de la cara de componentes (figura 15.27, fig-16.27, de la sección 15.21; el manual lo llama «Figura 2»),
#   con zonas en los ajustes y puntos de prueba.
# - Características, puntos clave del montaje, método de calibración, precauciones y notas del plano (15.15.1 a
#   15.15.5); ejercicio 15.9.
# Sección sin cálculos: sin modelo (aviso de secuencia «sin tarjeta de fórmula»).
# Pasos prácticos: «ordenar» la calibración del manual y «tocar» en el plano el ajuste de la calidad de sonido.
leccion: cap16/sec-16.15

libro:
  318: "esta es la traducción fiel al castellano del manual de instrucciones original del kit"
  320: "Función de salida directa de la señal demodulada"
  322: "Si la serigrafía de la placa difiere del manual, prevalece el manual"
  325: "Si hay conflicto, prioriza la calidad de sonido"
  327: "CD2025 = TEA2025"
  329: "«4µ7» = 4,7 µF, «0µ01» = 0,01 µF, «4700» = 4700 pF"
  "cap16#482": "Plano de la cara de componentes de la placa del FM7303 V3.0r7"
  "cap16#530": "La serigrafía de la placa rotula tres componentes como «4μ7», «4700» y «2k2»"

modelo: { valores: {}, calculos: {} }

tarjetas:
  - id: explore-plano
    tipo: explorar
    titulo: "El manual, con el plano delante"
    texto: "Es la traducción fiel del manual del kit, que viene en chino. Toque en el plano los ajustes de la calibración."
    libro: [318, 325, "cap16#482"]
    widget:
      tipo: figura
      figura: fig-16.27
      zonas:
        - { id: b1, rotulo: "Cuadrado morado de la derecha", rect: [360, 92, 42, 35], texto: "B1: su núcleo, hasta el máximo del medidor." }
        - { id: b2, rotulo: "Cuadrado morado, el de arriba", rect: [288, 71, 50, 35], texto: "B2: su núcleo, hasta que TP3 valga 4,6 V." }
        - { id: w1, rotulo: "Cuadrado amarillo con TP1", rect: [288, 140, 56, 35], texto: "W1: con K1 pulsado, TP1 a 4,6 V." }
        - { id: w2, rotulo: "Cuadrado amarillo de arriba", rect: [288, 28, 50, 35], texto: "W2: la sensibilidad del Mute." }
        - { id: w3, rotulo: "Cuadrado amarillo de la izquierda", rect: [126, 38, 42, 35], texto: "W3: el VCO, hasta 38 kHz en TP4." }
        - { id: l2, rotulo: "Cuadrado morado de abajo", rect: [326, 181, 42, 35], texto: "L2: en el extremo bajo, hacia 88 MHz." }
        - { id: l1, rotulo: "Cuadrado morado de abajo a la derecha", rect: [398, 166, 44, 35], texto: "L1: el seguimiento en el extremo bajo." }
    requiere: { mover: [b1, b2, w1] }

  - id: empareje-marcado
    tipo: pregunta
    titulo: "Las notas del plano"
    texto: "El plano usa un marcado abreviado. Empareje cada marcado con su valor."
    libro: [329, "cap16#530"]
    widget:
      tipo: figura
      figura: fig-16.27
      zonas:
        - { id: plano, rotulo: "El plano", rect: [0, 0, 450, 250] }
    emparejar:
      - ["«4µ7»", "4,7 µF"]
      - ["«0µ01»", "0,01 µF"]
      - ["«4700»", "4700 pF"]
      - ["«3T5»", "3,5 vueltas"]
      - ["«4V6»", "4,6 V"]
    exito: "Con «µ», en µF; sin magnitud, en pF. La letra hace de coma."
    pistas:
      - { texto: "Un condensador sin magnitud está en picofaradios." }
    escalera:
      - "La µ, la T y la V hacen de coma y dan la unidad."
    solucion: "4µ7, 4,7 µF; 0µ01, 0,01 µF; 4700, 4700 pF; 3T5, 3,5 vueltas; 4V6, 4,6 V."

  - id: ordene-calibracion
    tipo: pregunta
    titulo: "El método de calibración"
    texto: "Ordene los pasos de calibración del manual."
    libro: [325]
    widget:
      tipo: figura
      figura: fig-16.27
      zonas:
        - { id: plano, rotulo: "El plano", rect: [0, 0, 450, 250] }
    ordenar:
      - "Presintonía de RF C4A' al máximo del medidor"
      - "Núcleo de B1 al máximo del medidor"
      - "Núcleo de B2 hasta 4,6 V en TP3"
      - "Cobertura: C4B' arriba y L2 abajo"
      - "Seguimiento: L1 abajo y C4A' arriba"
      - "AFC: W1 hasta 4,6 V en TP1"
      - "Estéreo con W3 y, al final, el Mute con W2"
    exito: "Es el procedimiento del manual, con instrumentos de aficionado: el display y el medidor de aguja."
    pistas:
      - { texto: "Se empieza buscando señal con una emisora fuerte de referencia." }
    escalera:
      - "Señal, detector, banda, seguimiento y automatismos."
    solucion: "C4A', B1, B2, cobertura, seguimiento, AFC, estéreo y Mute."

  - id: toque-calidad
    tipo: tocar
    titulo: "La calidad de sonido"
    texto: "Según el manual, un componente determina la calidad de sonido. Tóquelo en el plano."
    libro: [325, "cap16#482"]
    widget:
      tipo: figura
      figura: fig-16.27
      zonas:
        - { id: b1, rotulo: "Cuadrado morado de la derecha", rect: [360, 92, 42, 35] }
        - { id: b2, rotulo: "Cuadrado morado, el de arriba", rect: [288, 71, 50, 35] }
        - { id: w2, rotulo: "Cuadrado amarillo de arriba", rect: [288, 28, 50, 35] }
        - { id: w3, rotulo: "Cuadrado amarillo de la izquierda", rect: [126, 38, 42, 35] }
    tocar:
      bien: [b2]
      porque:
        b1: "B1 es el transformador de FI: se ajusta al máximo del medidor."
        w2: "W2 ajusta la sensibilidad del Mute."
        w3: "W3 ajusta el VCO del estéreo."
    exito: "La bobina de discriminador B2: con TP3 en 4,6 V la calidad es casi la mejor y el volumen, el máximo."
    escalera:
      - "Es una bobina con núcleo ajustable, junto a TP3."
    solucion: "B2."

  - id: pregunta-conflicto
    tipo: pregunta
    titulo: "Calidad o volumen"
    texto: "Al ajustar B2, el punto de mejor sonido y el de máximo volumen no coinciden del todo. ¿Qué prioriza?"
    libro: [325]
    widget:
      tipo: figura
      figura: fig-16.27
      zonas:
        - { id: b2, rotulo: "Cuadrado morado, el de arriba", rect: [288, 71, 50, 35] }
    opciones:
      - texto: "La calidad de sonido"
        bien: true
        porque: "El manual lo dice así: si hay conflicto, prioriza la calidad."
      - texto: "El volumen"
        porque: "El volumen se recupera con W4; la calidad la decide B2."
      - texto: "Un punto intermedio"
        porque: "El manual no pide compromiso: manda la calidad."
    escalera:
      - "¿Qué es lo que B2 determina?"
    solucion: "La calidad."

  - id: pregunta-sin-instrumentos
    tipo: pregunta
    titulo: "W3 sin instrumentos"
    texto: "No tiene frecuencímetro ni osciloscopio. ¿Cómo ajusta W3 según el manual?"
    libro: [325]
    widget:
      tipo: figura
      figura: fig-16.27
      zonas:
        - { id: w3, rotulo: "Cuadrado amarillo de la izquierda", rect: [126, 38, 42, 35] }
    opciones:
      - texto: "Con una emisora estéreo, buscando el margen en que se enciende el indicador y dejándolo en el centro"
        bien: true
        porque: "Es el método de aficionado; con un frecuencímetro en TP4 se pone exacto a 38 kHz."
      - texto: "Al máximo del medidor de aguja"
        porque: "El medidor indica la señal de FI, no el VCO del estéreo."
      - texto: "Hasta que TP3 marque 4,6 V"
        porque: "TP3 es el ajuste de B2."
    escalera:
      - "¿Qué indicador dice si el decodificador se engancha?"
    solucion: "Centrar W3 en el margen en que se enciende el indicador estéreo."

  - id: predecir-debiles
    tipo: predecir
    titulo: "Emisoras débiles"
    texto: "Con una emisora débil, el Mute y el estéreo se encienden y apagan y meten ruido. ¿Qué aconseja el manual?"
    libro: [327]
    widget:
      tipo: figura
      figura: fig-16.27
      zonas:
        - { id: plano, rotulo: "El plano", rect: [0, 0, 450, 250] }
    opciones:
      - texto: "Apagar las dos funciones"
        bien: true
        porque: "Quedan en el umbral de encender y apagar y generan ruido extra."
      - texto: "Subir W2"
        porque: "Con más sensibilidad del Mute callaría también la emisora débil."
      - texto: "Reajustar W3"
        porque: "W3 ya está ajustado: la señal es la que no alcanza."
    escalera:
      - "Ambas funciones dependen de que la señal supere un umbral."
    solucion: "Apagar el Mute y el estéreo."

  - id: pregunta-cd2025
    tipo: pregunta
    titulo: "Un integrado equivalente"
    texto: "Su kit trae un CD2025 donde la lista dice TEA2025. ¿Qué hace?"
    libro: [327]
    widget:
      tipo: figura
      figura: fig-16.27
      zonas:
        - { id: plano, rotulo: "El plano", rect: [0, 0, 450, 250] }
    opciones:
      - texto: "Montarlo: es un compatible"
        bien: true
        porque: "Según el manual, CD2025 = TEA2025: si llega un equivalente, se sustituye directamente."
      - texto: "Devolver el kit"
        porque: "El manual lista los compatibles precisamente para esto."
      - texto: "Buscar un TEA2025 antes de montar"
        porque: "No hace falta: su rendimiento es básicamente igual."
    escalera:
      - "Mire las precauciones del manual."
    solucion: "Montarlo: CD2025 = TEA2025."

  - id: porque-manual
    tipo: porque
    titulo: "Manual o serigrafía"
    texto: "La serigrafía de la placa y el manual no coinciden en un componente. ¿Cuál vale y por qué?"
    libro: [322]
    widget:
      tipo: figura
      figura: fig-16.27
      zonas:
        - { id: plano, rotulo: "El plano", rect: [0, 0, 450, 250] }
    opciones:
      - texto: "El manual: lo dice el propio manual"
        bien: true
        porque: "Si la serigrafía difiere del manual, prevalece el manual."
      - texto: "La serigrafía, porque está en la placa"
        porque: "El manual establece lo contrario: prevalece él."
      - texto: "El que tenga el valor mayor"
        porque: "No es cuestión de valores: el manual manda."
    escalera:
      - "Lea los puntos clave del montaje."
    solucion: "Prevalece el manual."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [320, 322, 325, 329]
    ideas:
      - { titulo: "El manual.", texto: "Traducción fiel: características, montaje, calibración, precauciones y notas." }
      - { titulo: "Calibración.", texto: "Señal, B2 a 4,6 V, cobertura, seguimiento, AFC, estéreo y Mute." }
      - { titulo: "Marcado.", texto: "4µ7 es 4,7 µF; 4700, pF; 3T5, espiras; 4V6, voltios." }
      - { titulo: "Si difieren.", texto: "Prevalece el manual sobre la serigrafía." }
