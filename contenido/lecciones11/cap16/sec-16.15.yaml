# Lección 1.2 de la sección 15.15 «El Manual Original del Kit, Traducido al Castellano» (cap16; etiquetas sec-16.N =
# impresas 15.N).
# - El plano de la cara de componentes (figura 15.27, fig-16.27, de la sección 15.21; el manual lo llama «Figura 2»),
#   con zonas en los ajustes y puntos de prueba.
# - Características, puntos clave del montaje, método de calibración, precauciones y notas del plano (15.15.1 a
#   15.15.5); ejercicio 15.9.
# Sección sin cálculos: sin modelo (aviso de secuencia «sin tarjeta de fórmula»).
# Pasos prácticos: «ordenar» la calibración del manual y «tocar» en el plano el ajuste de la calidad de sonido.
# 1.2.1 (autor121-senpro, «aprender haciendo», GUIA §13): en el plano se tocan los ajustes en el orden de la calibración
# (sustituye al ordenar), el que fija la calidad de sonido y el que se centra sin instrumentos; se compone el «4700» con
# dos cifras y un multiplicador. Calidad frente a volumen, las emisoras débiles y el CD2025 se funden en éxitos y en la
# pregunta del manual frente a la serigrafía, la única de opciones.
leccion: cap16/sec-16.15

libro:
  318: "esta es la traducción fiel al castellano del manual de instrucciones original del kit"
  320: "Función de salida directa de la señal demodulada"
  322: "Si la serigrafía de la placa difiere del manual, prevalece el manual"
  325: "Si hay conflicto, prioriza la calidad de sonido"
  327: "CD2025 = TEA2025"
  329: "«4µ7» = 4,7 µF, «0µ01» = 0,01 µF, «4700» = 4700 pF"
  "cap16#482": "Plano de la cara de componentes de la placa del FM7303 V3.0r7"
  "cap16#530": "La serigrafía de la placa rotula tres componentes como «4μ7», «4700» y «2k2»"

modelo:
  valores:
    c_d: { sim: "cifras", nombre: "dos primeras cifras", unidad: "", valor: 10 }
    c_n: { sim: "n", nombre: "multiplicador, ceros", unidad: "", valor: 3 }
  calculos:
    C_p: { expr: "c_d*10^c_n*1e-12", sim: "C", nombre: "capacidad marcada", unidad: F }

tarjetas:
  - id: explore-plano
    tipo: tocar
    titulo: "El manual, con el plano delante"
    texto: "Tras la presintonía de RF, la calibración del manual sigue un orden. Toque en el plano los ajustes en ese orden."
    libro: [318, 325, "cap16#482"]
    widget:
      tipo: figura
      figura: fig-16.27
      zonas: &zonas-plano
        - { id: b1, rotulo: "B1", rect: [360, 92, 42, 35] }
        - { id: b2, rotulo: "B2", rect: [288, 71, 50, 35] }
        - { id: w1, rotulo: "W1", rect: [288, 140, 56, 35] }
        - { id: w2, rotulo: "W2", rect: [288, 28, 50, 35] }
        - { id: w3, rotulo: "W3", rect: [126, 38, 42, 35] }
        - { id: l2, rotulo: "L2", rect: [326, 181, 42, 35] }
        - { id: l1, rotulo: "L1", rect: [398, 166, 44, 35] }
    tocar:
      bien: [b1, b2, l2, l1, w1, w3, w2]
      orden: true
    exito: "B1 y B2 en la FI, L2 para la cobertura, L1 para el seguimiento, W1 el AFC, W3 el estéreo y W2, al final, el Mute."
    escalera:
      - "Primero la FI; después la banda; al final los automatismos."
    solucion: "B1, B2, L2, L1, W1, W3 y W2."

  - id: empareje-marcado
    tipo: explorar
    titulo: "Las notas del plano"
    texto: "El plano usa un marcado abreviado: con «µ», en µF, y sin magnitud, en pF. Componga el «4700» con dos cifras y sus ceros."
    libro: [329, "cap16#530"]
    inicio: { c_d: 10, c_n: 3 }
    widget:
      tipo: grafica
      x: { id: n, min: 0, max: 5, unidad: "", rotulo: "multiplicador" }
      y: { min: 1e-12, max: 1e-5, unidad: F, rotulo: "C", escala: log }
      curvas:
        - { expr: "c_d*10^n*1e-12", color: naranja, rotulo: "C" }
      marcas:
        - { x: "c_n", y: "C_p", rotulo: "{{C_p}}" }
      lectura: { valor: C_p, rotulo: "Capacidad" }
      mandos:
        - { valor: c_d, lista: [10, 22, 47], rotulo: "Dos cifras" }
        - { valor: c_n, min: 0, max: 5, paso: 1, rotulo: "Ceros" }
    objetivo:
      condiciones:
        - { valor: C_p, objetivo: 0.0000000047, tol: 0.01, rotulo: "C = {{C_p}}" }
      logrado: "47 y dos ceros: 4700 pF. Con «µ» la letra hace de coma: «4µ7» son 4,7 µF; y «3T5», 3,5 vueltas."
      pistas:
        - { cuando: { valor: C_p, mayor: 0.0000000047 }, texto: "Demasiado: menos ceros o cifras menores." }
        - { texto: "Poco: más ceros o cifras mayores." }
    escalera:
      - "Cifras 47 y dos ceros."
    solucion: "47 y 2: 4700 pF."
    comprobar:
      - { con: { c_d: 47, c_n: 2 }, C_p: 0.0000000047 }

  - id: toque-calidad
    tipo: tocar
    titulo: "La calidad de sonido"
    texto: "Según el manual, un componente determina la calidad de sonido. Tóquelo en el plano."
    libro: [325, "cap16#482"]
    widget:
      tipo: figura
      figura: fig-16.27
      zonas:
        - { id: b1, rotulo: "Cuadrado morado de la derecha", rect: [360, 92, 42, 35] }
        - { id: b2, rotulo: "Cuadrado morado, el de arriba", rect: [288, 71, 50, 35] }
        - { id: w2, rotulo: "Cuadrado amarillo de arriba", rect: [288, 28, 50, 35] }
        - { id: w3, rotulo: "Cuadrado amarillo de la izquierda", rect: [126, 38, 42, 35] }
    tocar:
      bien: [b2]
      porque:
        b1: "B1 es el transformador de FI: se ajusta al máximo del medidor."
        w2: "W2 ajusta la sensibilidad del Mute."
        w3: "W3 ajusta el VCO del estéreo."
    exito: "B2: con TP3 en 4,6 V, calidad casi óptima y volumen máximo. Si no coinciden del todo, se prioriza la calidad."
    escalera:
      - "Es una bobina con núcleo ajustable, junto a TP3."
    solucion: "B2."

  - id: pregunta-sin-instrumentos
    tipo: tocar
    titulo: "W3 sin instrumentos"
    texto: "Sin frecuencímetro, con una emisora estéreo, se busca el margen en que se enciende el indicador y se deja en el centro. Toque ese ajuste."
    libro: [325, 327]
    widget:
      tipo: figura
      figura: fig-16.27
      zonas: *zonas-plano
    tocar:
      bien: [w3]
      porque:
        b1: "B1 se ajusta al máximo del medidor."
        b2: "B2 se ajusta con TP3 en 4,6 V."
        w1: "W1 es el AFC, con TP1 en 4,6 V."
        w2: "W2 es el Mute."
        l2: "L2 es la cobertura en el extremo bajo."
        l1: "L1 es el seguimiento."
    exito: "W3, el VCO del estéreo; con frecuencímetro en TP4, 38 kHz exactos. Con emisoras débiles, mejor apagar el Mute y el estéreo."
    escalera:
      - "¿Qué ajuste toca el estéreo?"
    solucion: "W3."

  - id: porque-manual
    tipo: porque
    titulo: "Manual o serigrafía"
    texto: "La serigrafía de la placa y el manual no coinciden en un componente. ¿Cuál vale y por qué?"
    libro: [322, 327]
    widget:
      tipo: figura
      figura: fig-16.27
      zonas:
        - { id: plano, rotulo: "El plano", rect: [0, 0, 450, 250] }
    opciones:
      - texto: "El manual: lo dice el propio manual"
        bien: true
        porque: "Si la serigrafía difiere del manual, prevalece el manual. Y si llega un CD2025 donde dice TEA2025, se monta: es compatible."
      - texto: "La serigrafía, porque está en la placa"
        porque: "El manual establece lo contrario: prevalece él."
      - texto: "El que tenga el valor mayor"
        porque: "No es cuestión de valores: el manual manda."
    escalera:
      - "Lea los puntos clave del montaje."
    solucion: "Prevalece el manual."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [320, 322, 325, 329]
    ideas:
      - { titulo: "El manual.", texto: "Traducción fiel: características, montaje, calibración, precauciones y notas." }
      - { titulo: "Calibración.", texto: "Señal, B2 a 4,6 V, cobertura, seguimiento, AFC, estéreo y Mute." }
      - { titulo: "Marcado.", texto: "4µ7 es 4,7 µF; 4700, pF; 3T5, espiras; 4V6, voltios." }
      - { titulo: "Si difieren.", texto: "Prevalece el manual sobre la serigrafía." }
