# Lección 1.2 de la sección 15.7 «Inventario y Función de Cada Componente» (cap16; etiquetas sec-16.N = impresas 15.N).
# - Las familias de componentes del kit y su función (figura 15.7, fig-16.7, nueve paneles con zonas).
# - Los marcados de los condensadores (bloque 122), la polaridad de los electrolíticos, B1 y B2, el variable, los
#   potenciómetros e interruptores (bloques 121 a 131), y la foto del polyvaricon (figura 15.8, fig-16.8, con zonas en
#   píxeles de la foto).
# Sección sin cálculos: sin modelo (aviso de secuencia «sin tarjeta de fórmula»).
# Pasos prácticos: «tocar» la familia con polaridad en la figura 15.7 y los trimmers en la foto del polyvaricon.
leccion: cap16/sec-16.7

libro:
  119: "vacía el kit sobre una bandeja clara e identifica cada pieza"
  120: "Inventario de los componentes del FM7303 y la función de cada familia"
  121: "porque los colores del kit no siempre son nítidos; vienen rotuladas a mano en la cinta"
  122: "331 = 330 pF, 102 = 1000 pF, 154 = 0,15 µF, 224 = 0,22 µF, 4n7 = 4700 pF"
  123: "Son POLARES: la patilla del lado de la banda es el negativo"
  124: "B1 (primario 11 espiras, 3 µH) se afina para máxima señal; B2 (18 espiras, 7,6 µH) determina la calidad de sonido"
  126: "suelda rápido para no fundir su estructura interna de plástico"
  128: "W1 (20k, AFC), W2 (10k, sensibilidad del Mute), W3 (5k, VCO/38 kHz) y W4 (doble, volumen)"
  129: "K4 (encendido, en el potenciómetro de volumen)"
  132: "en la cara superior, los tornillos de sus trimmers"

modelo: { valores: {}, calculos: {} }

tarjetas:
  - id: explore-familias
    tipo: explorar
    titulo: "Sobre una bandeja clara"
    texto: "Antes de soldar, identifique cada pieza: es una de las prácticas más valiosas del proyecto. Toque las familias."
    libro: [119, 120]
    widget:
      tipo: figura
      figura: fig-16.7
      zonas:
        - { id: resistencias, rotulo: "Arriba a la izquierda", rect: [4, 4, 144, 100], texto: "Resistencias: polarización y niveles de señal. Mídalas con el óhmetro." }
        - { id: ceramicos, rotulo: "Arriba en el centro", rect: [153, 4, 144, 100], texto: "Cerámicos y de película: desacoplo y acoplo, sin polaridad." }
        - { id: electroliticos, rotulo: "Arriba a la derecha", rect: [302, 4, 144, 100], texto: "Electrolíticos: filtran la alimentación y acoplan audio. Polares." }
        - { id: integrados, rotulo: "En medio a la izquierda", rect: [4, 110, 144, 102], texto: "Cuatro integrados de radio y el amplificador de audio TEA2025." }
        - { id: bobinas, rotulo: "En medio, en el centro", rect: [153, 110, 144, 102], texto: "B1 y B2: bobinas con núcleo ajustable." }
        - { id: filtros, rotulo: "En medio a la derecha", rect: [302, 110, 144, 102], texto: "CF1 y CF2: dan la selectividad de la FI." }
        - { id: sintonia, rotulo: "Abajo a la izquierda", rect: [4, 217, 144, 103], texto: "El variable de doble sección y las bobinas de aire L1 y L2." }
        - { id: mandos, rotulo: "Abajo en el centro", rect: [153, 217, 144, 103], texto: "Potenciómetros e interruptores." }
        - { id: altavoces, rotulo: "Abajo a la derecha", rect: [302, 217, 144, 103], texto: "Dos altavoces, uno por canal." }
    requiere: { mover: [resistencias, electroliticos, bobinas] }

  - id: empareje-marcados
    tipo: pregunta
    titulo: "Los marcados"
    texto: "Los condensadores del kit vienen marcados con códigos. Empareje cada marcado con su valor."
    libro: [122]
    widget:
      tipo: figura
      figura: fig-16.7
      zonas:
        - { id: ceramicos, rotulo: "Arriba en el centro", rect: [153, 4, 144, 100] }
    emparejar:
      - ["«103»", "0,01 µF"]
      - ["«331»", "330 pF"]
      - ["«102»", "1000 pF"]
      - ["«224»", "0,22 µF"]
      - ["«4n7»", "4700 pF"]
    exito: "Dos cifras y un multiplicador, en picofaradios; la «n» hace de coma en nanofaradios."
    pistas:
      - { texto: "«103» es 10 × 10³ pF." }
    escalera:
      - "La tercera cifra es cuántos ceros se añaden, en pF."
    solucion: "103, 0,01 µF; 331, 330 pF; 102, 1000 pF; 224, 0,22 µF; 4n7, 4700 pF."

  - id: predecir-colores
    tipo: predecir
    titulo: "El código de colores"
    texto: "Sabe leer el código de colores. ¿Por qué recomienda el manual medir igualmente cada resistencia?"
    libro: [121]
    widget:
      tipo: figura
      figura: fig-16.7
      zonas:
        - { id: resistencias, rotulo: "Arriba a la izquierda", rect: [4, 4, 144, 100] }
    opciones:
      - texto: "Porque los colores del kit no siempre son nítidos"
        bien: true
        porque: "Vienen rotuladas a mano en la cinta: el óhmetro no se equivoca de color."
      - texto: "Porque el kit trae valores fuera de la serie"
        porque: "El problema no es el valor: es leer bien unos colores poco nítidos."
      - texto: "Para comprobar su potencia"
        porque: "El óhmetro mide la resistencia, no la potencia."
    escalera:
      - "¿Qué falla al leer unas bandas?"
    solucion: "Los colores del kit no siempre son nítidos."

  - id: toque-polaridad
    tipo: tocar
    titulo: "Revíselo dos veces"
    texto: "Toque la familia que es polar y cuya banda marca el negativo."
    libro: [122, 123]
    widget:
      tipo: figura
      figura: fig-16.7
      zonas:
        - { id: resistencias, rotulo: "Arriba a la izquierda", rect: [4, 4, 144, 100] }
        - { id: ceramicos, rotulo: "Arriba en el centro", rect: [153, 4, 144, 100] }
        - { id: electroliticos, rotulo: "Arriba a la derecha", rect: [302, 4, 144, 100] }
        - { id: altavoces, rotulo: "Abajo a la derecha", rect: [302, 217, 144, 103] }
    tocar:
      bien: [electroliticos]
      porque:
        resistencias: "Las resistencias no tienen polaridad: se miden, nada más."
        ceramicos: "Los cerámicos no tienen polaridad."
        altavoces: "Son los transductores, uno por canal: no llevan una banda que marque el negativo."
    exito: "La patilla del lado de la banda es el negativo, y va con la parte sombreada del símbolo de la placa."
    escalera:
      - "Busque el panel con un «−» en el cuerpo."
    solucion: "Los electrolíticos, arriba a la derecha."

  - id: empareje-potenciometros
    tipo: pregunta
    titulo: "Los potenciómetros"
    texto: "Empareje cada potenciómetro con lo que ajusta."
    libro: [128]
    widget:
      tipo: figura
      figura: fig-16.7
      zonas:
        - { id: mandos, rotulo: "Abajo en el centro", rect: [153, 217, 144, 103] }
    emparejar:
      - ["W1, 20k", "La polarización del AFC"]
      - ["W2, 10k", "La sensibilidad del Mute"]
      - ["W3, 5k", "El VCO de 38 kHz"]
      - ["W4, doble", "El volumen"]
    exito: "W4 es doble: una sección por canal. Y lleva dentro K4, el interruptor de encendido."
    pistas:
      - { texto: "El doble es el que mueve los dos canales a la vez." }
    escalera:
      - "Los tres pequeños son de ajuste; el doble, de uso."
    solucion: "W1, AFC; W2, Mute; W3, 38 kHz; W4, volumen."

  - id: pregunta-b1
    tipo: pregunta
    titulo: "B1 y B2"
    texto: "Las dos bobinas con núcleo ajustable. ¿Cuál se afina para la máxima señal?"
    libro: [124]
    widget:
      tipo: figura
      figura: fig-16.7
      zonas:
        - { id: bobinas, rotulo: "En medio, en el centro", rect: [153, 110, 144, 102] }
    opciones:
      - texto: "B1, el transformador de FI"
        bien: true
        porque: "B1 (11 espiras, 3 µH) se afina para máxima señal; B2 (18 espiras, 7,6 µH) decide la calidad del sonido."
      - texto: "B2, la del discriminador"
        porque: "B2 determina la calidad de sonido; la máxima señal la da B1."
      - texto: "Ninguna: vienen ajustadas"
        porque: "Las dos se ajustan, con cuidado: núcleos frágiles, con un recorrido de unos 360°."
    escalera:
      - "Una es de la FI y la otra del detector."
    solucion: "B1."

  - id: toque-trimmers
    tipo: tocar
    titulo: "Las presintonías"
    texto: "En la foto de un polyvaricon, toque dónde están los trimmers de presintonía."
    libro: [126, 132]
    widget:
      tipo: figura
      figura: fig-16.8
      zonas:
        - { id: trimmers, rotulo: "La cara superior del cuadrado", rect: [520, 300, 700, 700] }
        - { id: izquierda, rotulo: "La bobina larga de la izquierda", rect: [40, 220, 420, 800] }
        - { id: derecha, rotulo: "Las bobinas de la derecha", rect: [1250, 320, 210, 600] }
    tocar:
      bien: [trimmers]
      porque:
        izquierda: "Es una bobina de sintonía, a un lado del variable."
        derecha: "Son bobinas de sintonía: se ajustan separando espiras, no con un tornillo."
    exito: "Los tornillos de la cara superior son los trimmers: en el FM7303, C4A' y C4B'."
    escalera:
      - "Busque los tornillos pequeños sobre el cuerpo de plástico."
    solucion: "La cara superior del variable."

  - id: porque-variable
    tipo: porque
    titulo: "Soldar el variable"
    texto: "¿Por qué el variable se suelda rápido, tras raspar bien sus patillas?"
    libro: [126]
    widget:
      tipo: figura
      figura: fig-16.8
      zonas:
        - { id: trimmers, rotulo: "La cara superior del cuadrado", rect: [520, 300, 700, 700] }
    opciones:
      - texto: "Porque su estructura interna es de plástico y se funde"
        bien: true
        porque: "Raspar las patillas deja que el estaño moje al momento: menos tiempo de calor."
      - texto: "Porque es polar"
        porque: "No tiene polaridad: el riesgo es el calor."
      - texto: "Para no desajustar los trimmers"
        porque: "Los trimmers se ajustan después; lo que se estropea con el calor es el plástico."
    escalera:
      - "¿De qué está hecho por dentro un polyvaricon?"
    solucion: "Su estructura interna de plástico se funde con el calor."

  - id: pregunta-k4
    tipo: pregunta
    titulo: "El encendido"
    texto: "Busca en el kit el interruptor de encendido K4. ¿Dónde está?"
    libro: [129]
    widget:
      tipo: figura
      figura: fig-16.7
      zonas:
        - { id: mandos, rotulo: "Abajo en el centro", rect: [153, 217, 144, 103] }
    opciones:
      - texto: "En el potenciómetro de volumen"
        bien: true
        porque: "Por eso la radio se enciende girando el volumen."
      - texto: "Es uno de los pulsadores, junto a K1"
        porque: "K1, K2 y K3 son AFC, Mute y estéreo/mono."
      - texto: "En el conector de alimentación"
        porque: "El conector no lleva interruptor: K4 va en el volumen."
    escalera:
      - "¿Qué mando se gira para encender?"
    solucion: "Dentro del potenciómetro de volumen W4."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [119, 121, 123, 124]
    ideas:
      - { titulo: "Identificar.", texto: "Vaciar el kit e identificar cada pieza antes de soldar." }
      - { titulo: "Medir.", texto: "Resistencias con el óhmetro; condensadores por su marcado." }
      - { titulo: "Polaridad.", texto: "Electrolíticos: la banda es el negativo." }
      - { titulo: "Ajustables.", texto: "B1 para la señal, B2 para el sonido, W1 a W3 y los trimmers del variable." }
