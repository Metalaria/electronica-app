# Lección 1.2 de la sección 15.14 «Lista Completa de Componentes (BOM)» (cap16; etiquetas sec-16.N = impresas 15.N).
# - Los dos usos de la lista y las sustituciones aceptables (figura 15.20, fig-16.20, con zonas).
# - La comprobación del inventario, lo que hay que anotar de lo que falte (tabla del bloque 300), las sustituciones,
#   los repuestos y el hábito de tachar la lista (bloques 288 a 315).
# Sección sin cálculos: sin modelo (aviso de secuencia «sin tarjeta de fórmula»).
# Paso práctico: «ordenar» la comprobación del inventario.
leccion: cap16/sec-16.14

libro:
  289: "comprobar el inventario antes de empezar y sustituir lo que falte o se dañe"
  292: "Contar cada tipo antes de abrir las bolsas pequeñas"
  293: "dos resistencias de valores parecidos con bandas de colores confusos son la causa más frecuente de un kit que no funciona"
  294: "Separar los condensadores por tipo"
  295: "Verificar los semiconductores con la prueba de diodos"
  296: "Apartar los polarizados"
  297: "Al montar se busca «R7», no «10 kΩ»"
  300: "Frecuencia y capacidad de carga"
  303: "una del 1 % sustituye a una del 5 %, nunca al revés en posiciones críticas"
  304: "En un tanque de radio, un cerámico de clase 2 no vale"
  306: "no se sustituyen a la ligera, porque su Q y su geometría importan"
  311: "Un integrado de repuesto de los más caros, si el kit no trae zócalos"
  315: "Lo que quede sin tachar es lo que falta por montar o lo que sobra"
  316: "Los dos usos de la lista de componentes y las sustituciones aceptables"

modelo: { valores: {}, calculos: {} }

tarjetas:
  - id: explore-lista
    tipo: explorar
    titulo: "Dos usos"
    texto: "La lista sirve para comprobar el inventario y para sustituir lo que falte. Cada uso exige información distinta: toque los dos."
    libro: [289, 316]
    widget:
      tipo: figura
      figura: fig-16.20
      zonas:
        - { id: inventario, rotulo: "Arriba a la izquierda", rect: [2, 2, 220, 92], texto: "Comprobar el inventario, con método, antes de abrir las bolsas." }
        - { id: sustituir, rotulo: "Arriba a la derecha", rect: [230, 2, 222, 92], texto: "Para sustituir hace falta más que el valor." }
        - { id: aceptables, rotulo: "Abajo", rect: [2, 116, 450, 112], texto: "Las sustituciones aceptables, según el componente." }
    requiere: { mover: [inventario, sustituir] }

  - id: ordene-inventario
    tipo: pregunta
    titulo: "La comprobación del inventario"
    texto: "Ordene la comprobación del inventario de un kit."
    libro: [292, 293, 294, 295, 296]
    widget:
      tipo: figura
      figura: fig-16.20
      zonas:
        - { id: inventario, rotulo: "Arriba a la izquierda", rect: [2, 2, 220, 92] }
    ordenar:
      - "Contar cada tipo antes de abrir las bolsas"
      - "Identificar las resistencias, midiendo si hay duda"
      - "Separar los condensadores por tipo"
      - "Verificar los semiconductores con la prueba de diodos"
      - "Apartar los polarizados con su orientación visible"
    exito: "Con método: contar, identificar, separar, verificar y apartar lo que tiene orientación."
    pistas:
      - { texto: "Antes de abrir las bolsas pequeñas, se cuenta." }
    escalera:
      - "Lo pasivo primero; los semiconductores y los polarizados, al final."
    solucion: "Contar, resistencias, condensadores, semiconductores, polarizados."

  - id: empareje-falta
    tipo: pregunta
    titulo: "Lo que hay que anotar"
    texto: "Si algo falta, para sustituirlo hace falta más que el valor. Empareje cada componente con lo que hay que saber."
    libro: [300]
    widget:
      tipo: figura
      figura: fig-16.20
      zonas:
        - { id: sustituir, rotulo: "Arriba a la derecha", rect: [230, 2, 222, 92] }
    emparejar:
      - ["Resistencia", "Valor, tolerancia y potencia"]
      - ["Condensador", "Valor, tensión y dieléctrico"]
      - ["Bobina", "Valor, corriente y, en radio, su Q"]
      - ["Integrado", "Referencia con sufijo"]
      - ["Cristal", "Frecuencia y capacidad de carga"]
    exito: "Y para las bobinas de radiofrecuencia, sus datos de construcción: a menudo no son comerciales."
    pistas:
      - { texto: "El dieléctrico importa en el condensador; el sufijo, en el integrado." }
    escalera:
      - "Piense en qué puede ir mal si solo se copia el valor."
    solucion: "Resistencia, tolerancia y potencia; condensador, tensión y dieléctrico; bobina, corriente y Q; integrado, sufijo; cristal, carga."

  - id: predecir-tolerancia
    tipo: predecir
    titulo: "Una resistencia que falta"
    texto: "Falta una resistencia del 1 % en una posición crítica y tiene una del mismo valor al 5 %. ¿Sirve?"
    libro: [303]
    widget:
      tipo: figura
      figura: fig-16.20
      zonas:
        - { id: aceptables, rotulo: "Abajo", rect: [2, 116, 450, 112] }
    opciones:
      - texto: "No: la del 1 % sustituye a la del 5 %, nunca al revés"
        bien: true
        porque: "En una posición crítica, una tolerancia más amplia puede sacar el circuito de su margen."
      - texto: "Sí: el valor es el mismo"
        porque: "El valor no basta: la tolerancia también cuenta."
      - texto: "Sí, si es de más potencia"
        porque: "La potencia no compensa la tolerancia."
    escalera:
      - "¿Hacia qué lado se puede sustituir una tolerancia?"
    solucion: "No: solo una más precisa sustituye a una menos precisa."

  - id: pregunta-tanque
    tipo: pregunta
    titulo: "Un condensador de un tanque"
    texto: "Hay que sustituir un condensador de un tanque de radio. ¿Qué no vale?"
    libro: [304, 306]
    widget:
      tipo: figura
      figura: fig-16.20
      zonas:
        - { id: aceptables, rotulo: "Abajo", rect: [2, 116, 450, 112] }
    opciones:
      - texto: "Un cerámico de clase 2"
        bien: true
        porque: "En un tanque de radio no vale: el dieléctrico distinto depende de la posición, y ahí la estabilidad manda."
      - texto: "Uno de más tensión"
        porque: "Uno de más tensión sirve."
      - texto: "Uno del mismo valor y dieléctrico"
        porque: "Ese es el sustituto correcto."
    escalera:
      - "En un tanque importa que la capacidad no cambie."
    solucion: "Un cerámico de clase 2."

  - id: porque-designador
    tipo: porque
    titulo: "Etiquetar los recipientes"
    texto: "¿Por qué etiquetar los recipientes con el designador del esquema y no con el valor?"
    libro: [297]
    widget:
      tipo: figura
      figura: fig-16.20
      zonas:
        - { id: inventario, rotulo: "Arriba a la izquierda", rect: [2, 2, 220, 92] }
    opciones:
      - texto: "Porque al montar se busca «R7», no «10 kΩ»"
        bien: true
        porque: "El designador es único; el valor se repite en varias posiciones."
      - texto: "Porque el valor se borra"
        porque: "La razón es práctica: el montaje se sigue por designadores."
      - texto: "Porque los valores del kit son secretos"
        porque: "Los valores están en la lista: se busca por designador porque es único."
    escalera:
      - "¿Qué pide la serigrafía de la placa?"
    solucion: "El montaje se hace por designadores."

  - id: pregunta-causa
    tipo: pregunta
    titulo: "La causa más frecuente"
    texto: "¿Cuál es la causa más frecuente de un kit que no funciona, según la lista de componentes?"
    libro: [293]
    widget:
      tipo: figura
      figura: fig-16.20
      zonas:
        - { id: figura, rotulo: "La figura", rect: [2, 2, 450, 226] }
    opciones:
      - texto: "Dos resistencias de valor parecido con bandas confusas"
        bien: true
        porque: "Por eso se identifican por sus bandas y se miden si hay duda."
      - texto: "Un integrado defectuoso"
        porque: "Lo frecuente es el error de montaje, no el componente defectuoso."
      - texto: "Un condensador de más tensión"
        porque: "Un condensador de más tensión sirve: no es una causa de fallo."
    escalera:
      - "Piense en el código de colores."
    solucion: "Dos resistencias parecidas con bandas confusas."

  - id: pregunta-repuesto
    tipo: pregunta
    titulo: "De repuesto"
    texto: "El kit no trae zócalos para sus integrados. ¿Qué conviene tener de repuesto?"
    libro: [311]
    widget:
      tipo: figura
      figura: fig-16.20
      zonas:
        - { id: aceptables, rotulo: "Abajo", rect: [2, 116, 450, 112] }
    opciones:
      - texto: "Un integrado de los más caros"
        bien: true
        porque: "Soldado sin zócalo, sustituirlo exige desoldar con riesgo: un repuesto ahorra el problema."
      - texto: "Otro juego de altavoces"
        porque: "La recomendación es para lo que se daña al montar: resistencias, cerámicos e integrados."
      - texto: "Nada: el kit viene completo"
        porque: "Conviene tener resistencias, cerámicos de desacoplo y un integrado de los caros."
    escalera:
      - "¿Qué cuesta más reemplazar si se estropea al soldar?"
    solucion: "Un integrado de los más caros."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [289, 297, 303, 315]
    ideas:
      - { titulo: "Inventario.", texto: "Contar, identificar, separar, verificar y apartar los polarizados." }
      - { titulo: "Sustituir.", texto: "Más que el valor: tolerancia, tensión, dieléctrico, sufijo." }
      - { titulo: "Con criterio.", texto: "El 1 % sustituye al 5 %; en un tanque, nada de cerámicos de clase 2." }
      - { titulo: "Tachar.", texto: "Lo que quede sin tachar falta por montar o sobra." }
