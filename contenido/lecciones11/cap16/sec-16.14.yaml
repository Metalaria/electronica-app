# Lección 1.2 de la sección 15.14 «Lista Completa de Componentes (BOM)» (cap16; etiquetas sec-16.N = impresas 15.N).
# - Los dos usos de la lista y las sustituciones aceptables (figura 15.20, fig-16.20, con zonas).
# - La comprobación del inventario, lo que hay que anotar de lo que falte (tabla del bloque 300), las sustituciones,
#   los repuestos y el hábito de tachar la lista (bloques 288 a 315).
# Sección sin cálculos: sin modelo (aviso de secuencia «sin tarjeta de fórmula»).
# Paso práctico: «ordenar» la comprobación del inventario.
# 1.2.1 (autor121-senpro, «aprender haciendo», GUIA §13): en la figura 15.20 se tocan el uso que pide tolerancia, tensión
# y dieléctrico (el emparejar va a su éxito) y el del inventario (el orden, la causa más frecuente y los designadores van
# a su éxito); se elige la tolerancia que cabe en una posición crítica del 1 % (resistencia de 10 kΩ, de ejemplo). El
# repuesto se funde en la pregunta del tanque, la única de opciones.
leccion: cap16/sec-16.14

libro:
  289: "comprobar el inventario antes de empezar y sustituir lo que falte o se dañe"
  292: "Contar cada tipo antes de abrir las bolsas pequeñas"
  293: "dos resistencias de valores parecidos con bandas de colores confusos son la causa más frecuente de un kit que no funciona"
  294: "Separar los condensadores por tipo"
  295: "Verificar los semiconductores con la prueba de diodos"
  296: "Apartar los polarizados"
  297: "Al montar se busca «R7», no «10 kΩ»"
  300: "Frecuencia y capacidad de carga"
  303: "una del 1 % sustituye a una del 5 %, nunca al revés en posiciones críticas"
  304: "En un tanque de radio, un cerámico de clase 2 no vale"
  306: "no se sustituyen a la ligera, porque su Q y su geometría importan"
  311: "Un integrado de repuesto de los más caros, si el kit no trae zócalos"
  315: "Lo que quede sin tachar es lo que falta por montar o lo que sobra"
  316: "Los dos usos de la lista de componentes y las sustituciones aceptables"

modelo:
  valores:
    R_n: { sim: "R", nombre: "valor nominal", unidad: Ω, valor: 10000 }
    t_r: { sim: "tol", nombre: "tolerancia de la sustituta", unidad: "", valor: 0.05 }
  calculos:
    R_M: { expr: "R_n*(1 + t_r)", sim: "R_{máx}", nombre: "valor más alto posible", unidad: Ω }

tarjetas:
  - id: explore-lista
    tipo: tocar
    titulo: "Dos usos"
    texto: "La lista sirve para comprobar el inventario y para sustituir lo que falte. Toque el uso que exige tolerancia, potencia, tensión o dieléctrico."
    libro: [289, 300, 316]
    widget:
      tipo: figura
      figura: fig-16.20
      zonas: &zonas-lista
        - { id: inventario, rotulo: "Recuadro de arriba a la izquierda", rect: [2, 2, 220, 92] }
        - { id: sustituir, rotulo: "Recuadro de arriba a la derecha", rect: [230, 2, 222, 92] }
        - { id: aceptables, rotulo: "Recuadro de abajo", rect: [2, 116, 450, 112] }
    tocar:
      bien: [sustituir]
      porque:
        inventario: "Para el inventario basta el valor y el designador."
        aceptables: "Son las sustituciones aceptables, no lo que hay que anotar."
    exito: "Sustituir: resistencia, tolerancia y potencia; condensador, tensión y dieléctrico; bobina, corriente y Q; integrado, el sufijo; cristal, la carga."
    escalera:
      - "¿Para qué hace falta más que el valor?"
    solucion: "Arriba a la derecha."

  - id: ordene-inventario
    tipo: tocar
    titulo: "La comprobación del inventario"
    texto: "Contar cada tipo antes de abrir las bolsas, identificar, separar, verificar y apartar los polarizados. Toque el uso al que pertenece."
    libro: [292, 293, 294, 295, 296, 297]
    widget:
      tipo: figura
      figura: fig-16.20
      zonas: *zonas-lista
    tocar:
      bien: [inventario]
      porque:
        sustituir: "Sustituir es para lo que falta, después del inventario."
        aceptables: "Son las sustituciones aceptables."
    exito: "El inventario. La causa más frecuente: dos resistencias parecidas con bandas confusas. Y los recipientes, con «R7», no con «10 kΩ»."
    escalera:
      - "¿Qué se hace antes de empezar?"
    solucion: "Arriba a la izquierda."

  - id: predecir-tolerancia
    tipo: explorar
    titulo: "Una resistencia que falta"
    texto: "Falta una resistencia del 1 % en una posición crítica. Elija la tolerancia de la sustituta que no se sale de ese margen."
    nota: "Valor de ejemplo."
    libro: [303]
    inicio: { t_r: 0.05 }
    widget:
      tipo: grafica
      x: { id: t, min: 0, max: 0.06, unidad: "", rotulo: "tolerancia" }
      y: { min: 9500, max: 10600, unidad: Ω, rotulo: "R_{máx}" }
      curvas:
        - { expr: "R_n*(1 + t)", color: naranja, rotulo: "valor más alto posible" }
        - { expr: "R_n*1.01", color: tinta, rotulo: "margen del 1 %", discontinua: true }
      marcas:
        - { x: "t_r", y: "R_M", rotulo: "{{R_M}}" }
      lectura: { valor: R_M, rotulo: "Valor más alto posible" }
      mandos:
        - { valor: t_r, lista: [0.05, 0.01], nombres: [5 %, 1 %], rotulo: "Tolerancia" }
    objetivo:
      condiciones:
        - { valor: R_M, max: 10100, rotulo: "Hasta {{R_M}}" }
      logrado: "La del 1 % sustituye a la del 5 %, nunca al revés en posiciones críticas."
      pistas:
        - { texto: "Con esa tolerancia puede salirse del margen." }
    escalera:
      - "La sustituta debe ser igual o más precisa."
    solucion: "La del 1 %."
    comprobar:
      - { con: { t_r: 0.01 }, R_M: 10100 }
      - { con: { t_r: 0.05 }, R_M: 10500 }

  - id: pregunta-tanque
    tipo: pregunta
    titulo: "Un condensador de un tanque"
    texto: "Hay que sustituir un condensador de un tanque de radio. ¿Qué no vale?"
    libro: [304, 306, 311]
    widget:
      tipo: figura
      figura: fig-16.20
      zonas:
        - { id: aceptables, rotulo: "Abajo", rect: [2, 116, 450, 112] }
    opciones:
      - texto: "Un cerámico de clase 2"
        bien: true
        porque: "En un tanque manda la estabilidad. Y sin zócalos, conviene tener de repuesto un integrado de los más caros."
      - texto: "Uno de más tensión"
        porque: "Uno de más tensión sirve."
      - texto: "Uno del mismo valor y dieléctrico"
        porque: "Ese es el sustituto correcto."
    escalera:
      - "En un tanque importa que la capacidad no cambie."
    solucion: "Un cerámico de clase 2."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [289, 297, 303, 315]
    ideas:
      - { titulo: "Inventario.", texto: "Contar, identificar, separar, verificar y apartar los polarizados." }
      - { titulo: "Sustituir.", texto: "Más que el valor: tolerancia, tensión, dieléctrico, sufijo." }
      - { titulo: "Con criterio.", texto: "El 1 % sustituye al 5 %; en un tanque, nada de cerámicos de clase 2." }
      - { titulo: "Tachar.", texto: "Lo que quede sin tachar falta por montar o sobra." }
