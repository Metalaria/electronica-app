# Lección 1.2 de la sección 15.20 «Recorrido por el Esquema: de la Antena al Altavoz» (cap16; etiquetas sec-16.N =
# impresas 15.N).
# - El esquema redibujado del FM7303 (figura 15.25, fig-16.25, con zonas) y el original del fabricante (foto de la
#   figura 15.26, fig-16.26).
# - De la antena a la FI, la cadena de FI y la demodulación, el AFC y el silenciador, la decodificación estéreo y la
#   salida de audio (bloques 438 a 447).
# Sección sin cálculos: sin modelo (aviso de secuencia «sin tarjeta de fórmula»).
# Pasos prácticos: «ordenar» el camino de la señal y «tocar» en el esquema el punto del detector y el varactor del AFC.
leccion: cap16/sec-16.20

libro:
  438: "podemos seguir la señal en su viaje íntegro, desde la antena hasta el altavoz"
  439: "Esquema del FM7303 V3.0r7, redibujado y simplificado a partir del original del kit"
  441: "El diodo D1 (FV1043) es el varactor sobre el que actúa el control automático de frecuencia"
  443: "el S-meter de aguja, en cambio, toma su tensión de otra patilla de IC3"
  445: "para afinar a mano emisoras muy próximas"
  447: "La misma señal decodificada sale también por el jack de 3,5 mm (CZ3) para un amplificador externo"
  448: "el interruptor de encendido K4 junto a CZ1"

modelo: { valores: {}, calculos: {} }

tarjetas:
  - id: explore-esquema
    tipo: explorar
    titulo: "De la antena al altavoz"
    texto: "Con el esquema delante, siga la señal nombrando los componentes reales. Toque los integrados y los puntos de prueba."
    libro: [438, 439]
    widget:
      tipo: figura
      figura: fig-16.25
      zonas:
        - { id: bpf, rotulo: "Arriba a la izquierda", rect: [8, 40, 42, 36], texto: "El filtro BPF 87108: solo la banda de FM." }
        - { id: ic1, rotulo: "Arriba, el primer integrado", rect: [52, 36, 70, 42], texto: "IC1, TA7358: RF, mezclador y oscilador local." }
        - { id: ic2, rotulo: "Arriba, el segundo integrado", rect: [180, 36, 56, 42], texto: "IC2, TA7061BP: amplifica la FI." }
        - { id: tp2, rotulo: "Arriba, el primer punto rojo", rect: [254, 22, 36, 36], texto: "TP2, la entrada de IC3, tras CF2." }
        - { id: ic3, rotulo: "Arriba, el tercer integrado", rect: [292, 36, 56, 42], texto: "IC3, TA7303P: termina de amplificar y demodula con B2." }
        - { id: tp3, rotulo: "Arriba, el segundo punto rojo", rect: [342, 22, 36, 36], texto: "TP3, Det Out: la señal MPX y la muestra del AFC." }
        - { id: ic4, rotulo: "Abajo, el integrado morado", rect: [60, 228, 98, 44], texto: "IC4, TA7343AP: el decodificador estéreo." }
        - { id: ic5, rotulo: "Abajo, el último integrado", rect: [285, 228, 58, 44], texto: "IC5, TEA2025: el par de vatios por canal de los altavoces." }
    requiere: { mover: [ic1, ic3, tp3, ic4] }

  - id: ordene-senal
    tipo: pregunta
    titulo: "El viaje de la señal"
    texto: "Ordene el recorrido de la señal por el esquema."
    libro: [438, 441, 443, 447]
    widget:
      tipo: figura
      figura: fig-16.25
      zonas:
        - { id: esquema, rotulo: "El esquema", rect: [0, 20, 450, 300] }
    ordenar:
      - "Filtro de entrada BPF 87108"
      - "IC1, TA7358: RF, mezclador y oscilador"
      - "Filtro cerámico CF1"
      - "IC2, TA7061BP"
      - "IC3, TA7303P, con su discriminador"
      - "IC4, TA7343AP, el decodificador"
      - "IC5, TEA2025, hacia los altavoces"
    exito: "Entre el decodificador y el TEA2025 quedan el desénfasis y el volumen doble W4."
    pistas:
      - { texto: "La FI sale de IC1 hacia los filtros cerámicos." }
    escalera:
      - "Antena, front-end, FI, detector, estéreo y audio."
    solucion: "BPF, TA7358, CF1, TA7061BP, TA7303P, TA7343AP, TEA2025."

  - id: toque-tp3
    tipo: tocar
    titulo: "Del detector salen dos cosas"
    texto: "Toque el punto de prueba del que salen la señal multiplexada y la muestra continua del AFC."
    libro: [443, 445]
    widget:
      tipo: figura
      figura: fig-16.25
      zonas:
        - { id: tp2, rotulo: "Arriba, el primer punto rojo", rect: [254, 22, 36, 36] }
        - { id: tp3, rotulo: "Arriba, el segundo punto rojo", rect: [342, 22, 36, 36] }
        - { id: tp1, rotulo: "En el centro, el punto rojo", rect: [212, 160, 50, 36] }
        - { id: tp4, rotulo: "Abajo, el punto rojo", rect: [92, 296, 50, 36] }
    tocar:
      bien: [tp3]
      porque:
        tp2: "TP2 es la entrada de IC3: todavía FI, sin demodular."
        tp1: "TP1 es la tensión fija de W1, la que recibe el varactor con el AFC apagado."
        tp4: "TP4 es el VCO de 38 kHz del decodificador."
    exito: "TP3, Det Out: la señal MPX, y en torno a 4,6 V de continua para el AFC."
    escalera:
      - "Busque la salida del detector, a la derecha de IC3."
    solucion: "TP3."

  - id: pregunta-smeter
    tipo: porque
    titulo: "El S-meter"
    texto: "El AFC toma su muestra de TP3, pero el S-meter de aguja no. ¿De dónde la toma, y por qué?"
    libro: [443]
    widget:
      tipo: figura
      figura: fig-16.25
      zonas:
        - { id: ic3, rotulo: "Arriba, el tercer integrado", rect: [292, 36, 56, 42] }
    opciones:
      - texto: "De otra patilla de IC3: TP3 lleva audio, no el nivel"
        bien: true
        porque: "TP3 lleva el audio; el nivel de señal sale por otra patilla del TA7303P."
      - texto: "De TP3"
        porque: "TP3 alimenta el AFC; el S-meter usa otra salida."
      - texto: "Del TEA2025"
        porque: "El S-meter mide la señal de FI, no el audio amplificado."
    escalera:
      - "El medidor indica intensidad de señal, no audio."
    solucion: "De otra patilla de IC3."

  - id: toque-varactor
    tipo: tocar
    titulo: "Donde actúa el AFC"
    texto: "Toque el diodo sobre el que actúa el control automático de frecuencia."
    libro: [441]
    widget:
      tipo: figura
      figura: fig-16.25
      zonas:
        - { id: l1, rotulo: "Bajo IC1, el primero", rect: [40, 90, 38, 52] }
        - { id: l2, rotulo: "Bajo IC1, el segundo", rect: [78, 90, 38, 52] }
        - { id: d1, rotulo: "Bajo IC1, el tercero", rect: [118, 90, 40, 52] }
        - { id: ic1, rotulo: "Arriba, el primer integrado", rect: [52, 36, 70, 42] }
    tocar:
      bien: [d1]
      porque:
        l1: "Es L1 con la rama de RF del variable."
        l2: "Es L2 con la rama del oscilador: el AFC la corrige a través del varactor."
        ic1: "El TA7358 contiene el oscilador, pero la corrección entra por el varactor."
    exito: "D1, el FV1043: su capacidad cambia con la tensión y afina el oscilador."
    escalera:
      - "Busque un diodo junto al oscilador."
    solucion: "D1, FV1043."

  - id: predecir-k1
    tipo: predecir
    titulo: "Con el AFC apagado"
    texto: "Apaga el AFC con K1. ¿Qué recibe entonces el varactor?"
    libro: [445]
    widget:
      tipo: figura
      figura: fig-16.25
      zonas:
        - { id: afc, rotulo: "En el centro", rect: [165, 140, 145, 66] }
    opciones:
      - texto: "La tensión fija de W1, la de TP1"
        bien: true
        porque: "Así se pueden afinar a mano emisoras muy próximas."
      - texto: "Nada: queda al aire"
        porque: "K1 conmuta: el varactor siempre recibe una tensión."
      - texto: "La señal de audio"
        porque: "R4, R5, C14 y C15 quitan el audio; con K1 apagado llega la tensión de W1."
    escalera:
      - "K1 es un conmutador de dos posiciones."
    solucion: "La tensión fija de W1."

  - id: pregunta-cz3
    tipo: pregunta
    titulo: "Como sintonizador"
    texto: "Quiere usar el FM7303 con un amplificador externo. ¿De dónde saca la señal?"
    libro: [447]
    widget:
      tipo: figura
      figura: fig-16.25
      zonas:
        - { id: cz3, rotulo: "Abajo, el recuadro del jack", rect: [208, 282, 50, 38] }
    opciones:
      - texto: "Del jack de 3,5 mm, CZ3"
        bien: true
        porque: "La misma señal decodificada sale por CZ3 para un amplificador externo."
      - texto: "De los altavoces, CZ2"
        porque: "CZ2 lleva la salida de potencia del TEA2025."
      - texto: "De TP3"
        porque: "TP3 lleva la MPX sin decodificar."
    escalera:
      - "Busque la salida de audio antes del amplificador de potencia."
    solucion: "Del jack CZ3."

  - id: pregunta-k4
    tipo: pregunta
    titulo: "El esquema original"
    texto: "El esquema original del fabricante trae todos los valores. ¿Dónde aparece el interruptor de encendido K4?"
    libro: [448]
    widget:
      tipo: figura
      figura: fig-16.26
      zonas:
        - { id: original, rotulo: "El esquema original", rect: [0, 0, 1288, 660] }
    opciones:
      - texto: "Junto a CZ1, la entrada de alimentación"
        bien: true
        porque: "En la placa no está serigrafiado: va dentro del potenciómetro de volumen."
      - texto: "Junto al TEA2025"
        porque: "Está en la entrada de alimentación, junto a CZ1."
      - texto: "No aparece"
        porque: "Aparece en el esquema original, junto a CZ1."
    escalera:
      - "El encendido corta la alimentación de todo."
    solucion: "Junto a CZ1."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [438, 441, 443, 447]
    ideas:
      - { titulo: "A la FI.", texto: "BPF, TA7358 con L1, L2 y el variable; D1 es el varactor del AFC." }
      - { titulo: "Detectar.", texto: "CF1, TA7061BP, CF2 (TP2) y TA7303P con B2: la MPX en TP3." }
      - { titulo: "Vigilar.", texto: "El AFC desde TP3; el S-meter, desde otra patilla de IC3." }
      - { titulo: "Al altavoz.", texto: "TA7343AP, desénfasis, W4 y TEA2025; y CZ3 para un amplificador externo." }
