# Lección 1.2 de la sección 15.20 «Recorrido por el Esquema: de la Antena al Altavoz» (cap16; etiquetas sec-16.N =
# impresas 15.N).
# - El esquema redibujado del FM7303 (figura 15.25, fig-16.25, con zonas) y el original del fabricante (foto de la
#   figura 15.26, fig-16.26).
# - De la antena a la FI, la cadena de FI y la demodulación, el AFC y el silenciador, la decodificación estéreo y la
#   salida de audio (bloques 438 a 447).
# Sección sin cálculos: sin modelo (aviso de secuencia «sin tarjeta de fórmula»).
# Pasos prácticos: «ordenar» el camino de la señal y «tocar» en el esquema el punto del detector y el varactor del AFC.
# 1.2.1 (autor121-senpro, «aprender haciendo», GUIA §13): en el esquema 15.25 se tocan los integrados en el orden de la
# señal (sustituye al ordenar), TP3, el integrado del S-meter y el varactor; con K1 apagado se gira W1 hasta los 4,6 V
# que recibe el varactor (el divisor de W1 de la 15.11). K4 se funde en la pregunta del jack CZ3, la única de opciones.
leccion: cap16/sec-16.20

libro:
  438: "podemos seguir la señal en su viaje íntegro, desde la antena hasta el altavoz"
  439: "Esquema del FM7303 V3.0r7, redibujado y simplificado a partir del original del kit"
  441: "El diodo D1 (FV1043) es el varactor sobre el que actúa el control automático de frecuencia"
  443: "el S-meter de aguja, en cambio, toma su tensión de otra patilla de IC3"
  445: "para afinar a mano emisoras muy próximas"
  447: "La misma señal decodificada sale también por el jack de 3,5 mm (CZ3) para un amplificador externo"
  448: "el interruptor de encendido K4 junto a CZ1"
  "cap16#147": "la del cursor del potenciómetro W1 (conectado entre los 6 V y masa)"
  "cap16#231": "gira el potenciómetro W1 hasta que marque 4,6 V"

modelo:
  valores:
    V_6: { sim: "V", nombre: "alimentación de W1", unidad: V, valor: 6 }
    x_w: { sim: "x", nombre: "posición del cursor de W1", unidad: "", valor: 0.5 }
  calculos:
    V_w: { expr: "V_6*x_w", sim: "V_{TP1}", nombre: "tensión fija al varactor", unidad: V }

tarjetas:
  - id: explore-esquema
    tipo: tocar
    titulo: "De la antena al altavoz"
    texto: "Con el esquema delante, siga la señal nombrando los componentes reales. Toque el filtro y los integrados en el orden de la señal."
    libro: [438, 439]
    widget:
      tipo: figura
      figura: fig-16.25
      zonas: &zonas-esq
        - { id: bpf, rotulo: "BPF", rect: [8, 40, 42, 36] }
        - { id: ic1, rotulo: "IC1", rect: [52, 36, 70, 42] }
        - { id: ic2, rotulo: "IC2", rect: [180, 36, 56, 42] }
        - { id: tp2, rotulo: "TP2", rect: [254, 22, 36, 36] }
        - { id: ic3, rotulo: "IC3", rect: [292, 36, 56, 42] }
        - { id: tp3, rotulo: "TP3", rect: [342, 22, 36, 36] }
        - { id: ic4, rotulo: "IC4", rect: [60, 228, 98, 44] }
        - { id: ic5, rotulo: "IC5", rect: [285, 228, 58, 44] }
    tocar:
      bien: [bpf, ic1, ic2, ic3, ic4, ic5]
      orden: true
      porque:
        tp2: "TP2 es un punto de prueba, no un bloque."
        tp3: "TP3 es un punto de prueba, no un bloque."
    exito: "BPF, TA7358, CF1, TA7061BP, TA7303P, TA7343AP y TEA2025; entre los dos últimos, el desénfasis y el volumen W4."
    escalera:
      - "De la antena, arriba a la izquierda, a los altavoces."
    solucion: "BPF, IC1, IC2, IC3, IC4 e IC5."

  - id: toque-tp3
    tipo: tocar
    titulo: "Del detector salen dos cosas"
    texto: "Toque el punto de prueba del que salen la señal multiplexada y la muestra continua del AFC."
    libro: [443, 445]
    widget:
      tipo: figura
      figura: fig-16.25
      zonas:
        - { id: tp2, rotulo: "Arriba, el primer punto rojo", rect: [254, 22, 36, 36] }
        - { id: tp3, rotulo: "Arriba, el segundo punto rojo", rect: [342, 22, 36, 36] }
        - { id: tp1, rotulo: "En el centro, el punto rojo", rect: [212, 160, 50, 36] }
        - { id: tp4, rotulo: "Abajo, el punto rojo", rect: [92, 296, 50, 36] }
    tocar:
      bien: [tp3]
      porque:
        tp2: "TP2 es la entrada de IC3: todavía FI, sin demodular."
        tp1: "TP1 es la tensión fija de W1, la que recibe el varactor con el AFC apagado."
        tp4: "TP4 es el VCO de 38 kHz del decodificador."
    exito: "TP3, Det Out: la señal MPX, y en torno a 4,6 V de continua para el AFC."
    escalera:
      - "Busque la salida del detector, a la derecha de IC3."
    solucion: "TP3."

  - id: pregunta-smeter
    tipo: tocar
    titulo: "El S-meter"
    texto: "El AFC toma su muestra de TP3, pero el S-meter de aguja no: TP3 lleva el audio, no el nivel. Toque el integrado del que sale el nivel."
    libro: [443]
    widget:
      tipo: figura
      figura: fig-16.25
      zonas: *zonas-esq
    tocar:
      bien: [ic3]
      porque:
        bpf: "El filtro de entrada no mide nivel."
        ic1: "El front-end entrega la FI."
        ic2: "El primer amplificador de FI no tiene esa salida."
        tp2: "TP2 es la entrada de IC3."
        tp3: "TP3 lleva el audio, no el nivel."
        ic4: "El decodificador estéreo no da el nivel."
        ic5: "El amplificador de audio no da el nivel."
    exito: "IC3, el TA7303P: el nivel sale por otra de sus patillas."
    escalera:
      - "El que limita la FI sabe cuánta señal llega."
    solucion: "IC3."

  - id: toque-varactor
    tipo: tocar
    titulo: "Donde actúa el AFC"
    texto: "Toque el diodo sobre el que actúa el control automático de frecuencia."
    libro: [441]
    widget:
      tipo: figura
      figura: fig-16.25
      zonas:
        - { id: l1, rotulo: "Bajo IC1, el primero", rect: [40, 90, 38, 52] }
        - { id: l2, rotulo: "Bajo IC1, el segundo", rect: [78, 90, 38, 52] }
        - { id: d1, rotulo: "Bajo IC1, el tercero", rect: [118, 90, 40, 52] }
        - { id: ic1, rotulo: "Arriba, el primer integrado", rect: [52, 36, 70, 42] }
    tocar:
      bien: [d1]
      porque:
        l1: "Es L1 con la rama de RF del variable."
        l2: "Es L2 con la rama del oscilador: el AFC la corrige a través del varactor."
        ic1: "El TA7358 contiene el oscilador, pero la corrección entra por el varactor."
    exito: "D1, el FV1043: su capacidad cambia con la tensión y afina el oscilador."
    escalera:
      - "Busque un diodo junto al oscilador."
    solucion: "D1, FV1043."

  - id: predecir-k1
    tipo: explorar
    titulo: "Con el AFC apagado"
    texto: "Con K1 apagado, el varactor recibe la tensión fija del cursor de W1, que va entre los 6 V y masa. Gírelo hasta los 4,6 V de TP1."
    libro: [445, "cap16#147", "cap16#231"]
    fijar: { V_6: 6 }
    inicio: { x_w: 0.5 }
    widget:
      tipo: grafica
      x: { id: x, min: 0, max: 1, unidad: "", rotulo: "cursor de W1" }
      y: { min: 0, max: 6, unidad: V, rotulo: "TP1" }
      curvas:
        - { expr: "V_6*x", color: naranja, rotulo: "tensión al varactor" }
        - { expr: "4.6", color: tinta, rotulo: "4,6 V", discontinua: true }
      marcas:
        - { x: "x_w", y: "V_w", rotulo: "{{V_w}}" }
      lectura: { valor: V_w, rotulo: "TP1" }
      mandos:
        - { valor: x_w, min: 0.05, max: 0.95, paso: 0.01, rotulo: "Cursor de W1" }
    objetivo:
      condiciones:
        - { valor: V_w, objetivo: 4.6, tol: 0.02, rotulo: "TP1: {{V_w}}" }
      logrado: "{{V_w}}: la misma que da el detector con la emisora centrada. Sin AFC, se afinan a mano emisoras muy próximas."
      pistas:
        - { cuando: { valor: V_w, mayor: 4.7 }, texto: "Sobra tensión: lleve el cursor hacia masa." }
        - { texto: "Falta tensión: lleve el cursor hacia los 6 V." }
    escalera:
      - "4,6 de 6 V: algo más de tres cuartos del recorrido."
    solucion: "Cursor en 0,77: 4,6 V."
    comprobar:
      - { con: { x_w: 0.77 }, V_w: 4.62 }

  - id: pregunta-cz3
    tipo: pregunta
    titulo: "Como sintonizador"
    texto: "Quiere usar el FM7303 con un amplificador externo. ¿De dónde saca la señal?"
    libro: [447, 448]
    widget:
      tipo: figura
      figura: fig-16.25
      zonas:
        - { id: cz3, rotulo: "Abajo, el recuadro del jack", rect: [208, 282, 50, 38] }
    opciones:
      - texto: "Del jack de 3,5 mm, CZ3"
        bien: true
        porque: "La misma señal decodificada sale por CZ3. En el esquema original, K4, el encendido, aparece junto a CZ1."
      - texto: "De los altavoces, CZ2"
        porque: "CZ2 lleva la salida de potencia del TEA2025."
      - texto: "De TP3"
        porque: "TP3 lleva la MPX sin decodificar."
    escalera:
      - "Busque la salida de audio antes del amplificador de potencia."
    solucion: "Del jack CZ3."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [438, 441, 443, 447]
    ideas:
      - { titulo: "A la FI.", texto: "BPF, TA7358 con L1, L2 y el variable; D1 es el varactor del AFC." }
      - { titulo: "Detectar.", texto: "CF1, TA7061BP, CF2 (TP2) y TA7303P con B2: la MPX en TP3." }
      - { titulo: "Vigilar.", texto: "El AFC desde TP3; el S-meter, desde otra patilla de IC3." }
      - { titulo: "Al altavoz.", texto: "TA7343AP, desénfasis, W4 y TEA2025; y CZ3 para un amplificador externo." }
