# Lección 1.2 de la sección 15.2 «El Juego de Chips: el Cerebro del Receptor» (cap16; etiquetas sec-16.N = impresas 15.N).
# - Los cinco integrados en el recorrido de la señal y el ruido entre emisoras (figura 15.2, fig-16.2, con zonas).
# - La sintonía analógica, por qué los resonantes quedan fuera de los chips, lo que hay que mirar de cada chip, la
#   limitación y las comprobaciones del banco (bloques 31 a 48); ejercicio 15.1.
# Sección sin cálculos: sin modelo (aviso de secuencia «sin tarjeta de fórmula»).
# Paso práctico: «tocar» en la figura 15.2 el integrado del que sale el medidor de señal.
# 1.2.1 (autor121-senpro, «aprender haciendo», GUIA §13): en la figura 15.2 se tocan los cinco integrados en el orden de
# la señal, el decodificador estéreo, el medidor y la zona de la gráfica con el ruido al máximo; se lleva el oscilador
# local de L2 y el variable a 10,7 MHz por encima de una emisora de 100 MHz (de ejemplo; la FI es la del bloque 33). El
# emparejar de lo que hay que mirar va al éxito del medidor y el silencio absoluto al de la gráfica. Queda una pregunta
# de opciones (los ajustes).
leccion: cap16/sec-16.2

libro:
  32: "El receptor se organiza alrededor de cinco circuitos integrados"
  33: "IC1, TA7358AP: el front-end"
  34: "el módulo SC3610D, que no es un integrado de radio sino un frecuencímetro"
  36: "La frecuencia del oscilador local del TA7358AP la fijan la bobina L2 y el condensador variable de doble sección"
  37: "sintoniza con un PLL de síntesis gobernado por un microcontrolador"
  39: "Dentro de cada chip los componentes están apareados y a la misma temperatura"
  40: "Lo que no se pudo integrar son los elementos resonantes"
  42: "una alimentación sucia se convierte en ruido de fondo audible"
  44: "La cadena de FI de un receptor de FM amplifica y limita"
  45: "uno que está en silencio absoluto con el Mute desactivado probablemente tiene la cadena rota"
  47: "su alimentación en sus propios pines"
  48: "Su desviación con y sin antena"
  49: "Los cinco integrados del FM7303 en el recorrido de la señal"
  "cap16#530": "Indica la función de cada uno de los cinco integrados del FM7303"
  "cap16#55": 'f_("oscilador") - f_("emisora") = "10,7 MHz"'

modelo:
  valores:
    f_o: { sim: "f_{OL}", nombre: "oscilador local", unidad: Hz, valor: 105000000 }
    f_e: { sim: "f_{emisora}", nombre: "emisora de ejemplo", unidad: Hz, valor: 100000000 }
  calculos:
    f_i: { expr: "f_o - f_e", sim: "f_{FI}", nombre: "frecuencia intermedia", unidad: Hz }

tarjetas:
  - id: explore-chips
    tipo: tocar
    titulo: "Cinco integrados"
    texto: "El receptor se organiza alrededor de cinco integrados, cada uno con una función clara. Tóquelos en el orden de la señal."
    libro: [32, 33, 49]
    widget:
      tipo: figura
      figura: fig-16.2
      zonas: &zonas-ic
        - { id: ic1, rotulo: "Primer integrado", rect: [4, 4, 77, 56] }
        - { id: ic2, rotulo: "Segundo integrado", rect: [95, 4, 77, 56] }
        - { id: ic3, rotulo: "Tercer integrado", rect: [187, 4, 77, 56] }
        - { id: ic4, rotulo: "Cuarto integrado", rect: [278, 4, 77, 56] }
        - { id: ic5, rotulo: "Quinto integrado", rect: [370, 4, 77, 56] }
    tocar:
      bien: [ic1, ic2, ic3, ic4, ic5]
      orden: true
    exito: "Front-end, primera FI, limitador y detector, decodificador estéreo y audio."
    escalera:
      - "La señal entra por la antena, a la izquierda."
    solucion: "De izquierda a derecha."

  - id: empareje-chips
    tipo: tocar
    titulo: "Cada chip, su función"
    texto: "Toque el integrado que decodifica el estéreo con un PLL."
    libro: [33, "cap16#530"]
    widget:
      tipo: figura
      figura: fig-16.2
      zonas: *zonas-ic
    tocar:
      bien: [ic4]
      porque:
        ic1: "TA7358AP, el front-end: RF, oscilador local y mezclador."
        ic2: "TA7061BP, el primer amplificador de FI."
        ic3: "TA7303P, el limitador de FI y el detector de FM."
        ic5: "TEA2025, el amplificador de audio."
    exito: "El TA7343AP. Conocerlos es lo que permite diagnosticar por bloques."
    escalera:
      - "El estéreo se decodifica después del detector."
    solucion: "El cuarto, TA7343AP."

  - id: pregunta-sintonia
    tipo: explorar
    titulo: "Una radio analógica"
    texto: "Sin microcontrolador ni sintetizador: L2 y el condensador variable fijan el oscilador local. Para una emisora de 100 MHz, llévelo a donde salga la FI de 10,7 MHz."
    nota: "Emisora de ejemplo."
    libro: [33, 34, 36, 37, "cap16#55"]
    fijar: { f_e: 100000000 }
    inicio: { f_o: 105000000 }
    widget:
      tipo: grafica
      x: { id: f, min: 100000000, max: 115000000, unidad: Hz, rotulo: "f_{OL}" }
      y: { min: 0, max: 15000000, unidad: Hz, rotulo: "f_{OL} − f_{emisora}" }
      curvas:
        - { expr: "f - f_e", color: naranja, rotulo: "diferencia" }
        - { expr: "10700000", color: verde, rotulo: "FI de 10,7 MHz", discontinua: true }
      marcas:
        - { x: "f_o", y: "f_i", rotulo: "{{f_i}}" }
      lectura: { valor: f_i, rotulo: "Diferencia" }
      mandos:
        - { valor: f_o, min: 100000000, max: 115000000, paso: 100000, rotulo: "Oscilador local (L2 y variable)" }
    objetivo:
      condiciones:
        - { valor: f_i, objetivo: 10700000, tol: 0.005, rotulo: "FI: {{f_i}}" }
      logrado: "{{f_o}}: la FI cae en los filtros. El AFC corrige después la deriva con el varicap."
      pistas:
        - { cuando: { valor: f_i, mayor: 10700000 }, texto: "Demasiada diferencia: baje el oscilador." }
        - { texto: "Falta diferencia: suba el oscilador." }
    escalera:
      - "El oscilador va 10,7 MHz por encima de la emisora."
    solucion: "110,7 MHz."
    comprobar:
      - { con: { f_o: 110700000 }, f_i: 10700000 }

  - id: porque-ajustes
    tipo: porque
    titulo: "Dónde están los ajustes"
    texto: "Todos los ajustes del kit están en el front-end y en la FI. ¿Por qué ahí?"
    libro: [39, 40]
    widget:
      tipo: figura
      figura: fig-16.2
      zonas:
        - { id: cadena, rotulo: "Los cinco integrados", rect: [4, 4, 443, 56] }
    opciones:
      - texto: "Porque los elementos resonantes no se pudieron integrar"
        bien: true
        porque: "L1, L2, el variable, B1, CF1, CF2 y B2 quedan fuera de los chips: son lo que hay que ajustar."
      - texto: "Porque los chips de radio derivan con la temperatura"
        porque: "Dentro de cada chip los componentes están apareados y a la misma temperatura: sus derivas se compensan."
      - texto: "Porque el audio no necesita ninguna calidad"
        porque: "El audio importa; lo que no lleva ajustes es lo integrado."
    escalera:
      - "¿Qué piezas no caben dentro de un integrado?"
    solucion: "Bobinas, variable, transformador de FI y filtros cerámicos quedan fuera: ahí están los ajustes."

  - id: predecir-ruido
    tipo: tocar
    titulo: "Entre emisoras"
    texto: "Entre emisoras se oye más ruido que con una emisora sintonizada. Toque la zona de la gráfica en la que el limitador saca el ruido a plena amplitud."
    libro: [44, 45, 49]
    widget:
      tipo: figura
      figura: fig-16.2
      zonas:
        - { id: debil, rotulo: "Izquierda de la gráfica", rect: [40, 98, 90, 108] }
        - { id: fuerte, rotulo: "Derecha de la gráfica", rect: [173, 98, 90, 108] }
    tocar:
      bien: [debil]
      porque:
        fuerte: "Con una emisora fuerte, el limitador fija la amplitud y el fondo queda en silencio."
    exito: "Sin portadora, ruido al máximo: la FI funciona. Con el Mute desactivado, el silencio absoluto indica que la cadena está rota."
    escalera:
      - "Busque donde hay poca señal en la antena."
    solucion: "La izquierda: poca señal, siseo al máximo."

  - id: toque-medidor
    tipo: tocar
    titulo: "El medidor de señal"
    texto: "La comprobación que más informa es el medidor de señal. Toque el integrado del que sale."
    libro: [33, 42, 47, 48]
    widget:
      tipo: figura
      figura: fig-16.2
      zonas:
        - { id: ic1, rotulo: "Arriba, el primero", rect: [4, 4, 77, 56] }
        - { id: ic2, rotulo: "Arriba, el segundo", rect: [95, 4, 77, 56] }
        - { id: ic3, rotulo: "Arriba, el tercero", rect: [187, 4, 77, 56] }
        - { id: ic4, rotulo: "Arriba, el cuarto", rect: [278, 4, 77, 56] }
        - { id: ic5, rotulo: "Arriba, el quinto", rect: [370, 4, 77, 56] }
    tocar:
      bien: [ic3]
      porque:
        ic1: "El front-end entrega la FI; el nivel de señal lo da la cadena de FI."
        ic2: "Es el primer amplificador de FI: no tiene salida para el medidor."
        ic4: "El decodificador estéreo enciende el LED de estéreo, no el medidor."
        ic5: "El amplificador de audio mueve los altavoces."
    exito: "El TA7303P: su desviación con y sin antena dice si front-end y FI viven. Y en cada chip: alimentación en sus pines, condensadores de filtrado y salidas de estado."
    escalera:
      - "El medidor mide el nivel de la FI: busque el que la limita y la detecta."
    solucion: "El tercero, TA7303P."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [33, 40, 44, 48]
    ideas:
      - { titulo: "Cinco chips.", texto: "Front-end, dos de FI, decodificador estéreo y audio, en el orden de la señal." }
      - { titulo: "Ajustes fuera.", texto: "Los resonantes no se integran: ahí están todos los ajustes." }
      - { titulo: "Limita.", texto: "Ruido entre emisoras: la cadena vive. Silencio absoluto sin Mute: está rota." }
      - { titulo: "El medidor.", texto: "Con y sin antena, dice si el front-end y la FI están vivos." }
