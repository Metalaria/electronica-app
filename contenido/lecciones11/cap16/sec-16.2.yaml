# Lección 1.2 de la sección 15.2 «El Juego de Chips: el Cerebro del Receptor» (cap16; etiquetas sec-16.N = impresas 15.N).
# - Los cinco integrados en el recorrido de la señal y el ruido entre emisoras (figura 15.2, fig-16.2, con zonas).
# - La sintonía analógica, por qué los resonantes quedan fuera de los chips, lo que hay que mirar de cada chip, la
#   limitación y las comprobaciones del banco (bloques 31 a 48); ejercicio 15.1.
# Sección sin cálculos: sin modelo (aviso de secuencia «sin tarjeta de fórmula»).
# Paso práctico: «tocar» en la figura 15.2 el integrado del que sale el medidor de señal.
leccion: cap16/sec-16.2

libro:
  32: "El receptor se organiza alrededor de cinco circuitos integrados"
  33: "IC1, TA7358AP: el front-end"
  34: "el módulo SC3610D, que no es un integrado de radio sino un frecuencímetro"
  36: "La frecuencia del oscilador local del TA7358AP la fijan la bobina L2 y el condensador variable de doble sección"
  37: "sintoniza con un PLL de síntesis gobernado por un microcontrolador"
  39: "Dentro de cada chip los componentes están apareados y a la misma temperatura"
  40: "Lo que no se pudo integrar son los elementos resonantes"
  42: "una alimentación sucia se convierte en ruido de fondo audible"
  44: "La cadena de FI de un receptor de FM amplifica y limita"
  45: "uno que está en silencio absoluto con el Mute desactivado probablemente tiene la cadena rota"
  47: "su alimentación en sus propios pines"
  48: "Su desviación con y sin antena"
  49: "Los cinco integrados del FM7303 en el recorrido de la señal"
  "cap16#530": "Indica la función de cada uno de los cinco integrados del FM7303"

modelo: { valores: {}, calculos: {} }

tarjetas:
  - id: explore-chips
    tipo: explorar
    titulo: "Cinco integrados"
    texto: "El receptor se organiza alrededor de cinco integrados, cada uno con una función clara. Tóquelos en el orden de la señal."
    libro: [32, 33, 49]
    widget:
      tipo: figura
      figura: fig-16.2
      zonas:
        - { id: ic1, rotulo: "Arriba, el primero", rect: [4, 4, 77, 56], texto: "IC1, TA7358AP: amplificador de RF, oscilador local y mezclador en un SIP; entrega la FI de 10,7 MHz." }
        - { id: ic2, rotulo: "Arriba, el segundo", rect: [95, 4, 77, 56], texto: "IC2, TA7061BP: el primer amplificador de FI." }
        - { id: ic3, rotulo: "Arriba, el tercero", rect: [187, 4, 77, 56], texto: "IC3, TA7303P: segundo amplificador y limitador de FI, detector de FM y salida del medidor de señal." }
        - { id: ic4, rotulo: "Arriba, el cuarto", rect: [278, 4, 77, 56], texto: "IC4, TA7343AP: decodificador estéreo por PLL; regenera la subportadora de 38 kHz." }
        - { id: ic5, rotulo: "Arriba, el quinto", rect: [370, 4, 77, 56], texto: "IC5, TEA2025: el amplificador de audio estéreo que ataca los altavoces." }
    requiere: { mover: [ic1, ic2, ic3, ic4, ic5] }

  - id: empareje-chips
    tipo: pregunta
    titulo: "Cada chip, su función"
    texto: "Empareje cada integrado con su función en el receptor."
    libro: [33, "cap16#530"]
    widget:
      tipo: figura
      figura: fig-16.2
      zonas:
        - { id: cadena, rotulo: "Los cinco integrados", rect: [4, 4, 443, 56] }
    emparejar:
      - ["TA7358AP", "Front-end: RF, oscilador local y mezclador"]
      - ["TA7061BP", "Primer amplificador de FI"]
      - ["TA7303P", "Limitador de FI y detector de FM"]
      - ["TA7343AP", "Decodificador estéreo por PLL"]
      - ["TEA2025", "Amplificador de audio estéreo"]
    exito: "Conocerlos es lo que permite diagnosticar por bloques."
    pistas:
      - { texto: "Siga la señal: entra por el front-end y sale por el amplificador de audio." }
    escalera:
      - "Los dos del medio son la cadena de FI: el segundo, además, detecta."
    solucion: "TA7358AP front-end, TA7061BP FI, TA7303P FI y detector, TA7343AP estéreo, TEA2025 audio."

  - id: pregunta-sintonia
    tipo: pregunta
    titulo: "Una radio analógica"
    texto: "El FM7303 no tiene microcontrolador ni sintetizador. ¿Qué fija la frecuencia de su oscilador local?"
    libro: [34, 36, 37]
    widget:
      tipo: figura
      figura: fig-16.2
      zonas:
        - { id: ic1, rotulo: "Arriba, el primero", rect: [4, 4, 77, 56] }
    opciones:
      - texto: "La bobina L2 y el condensador variable"
        bien: true
        porque: "La sintonía es analógica: L2 y el variable de doble sección; el AFC corrige la deriva con el varicap FV1043."
      - texto: "Un PLL de síntesis con microcontrolador"
        porque: "Así sintoniza una radio actual; el FM7303 es la arquitectura de los radiocasetes de los ochenta."
      - texto: "El display SC3610D"
        porque: "El display es un frecuencímetro: cuenta el oscilador, no lo fija."
    escalera:
      - "Busque los elementos que giran o se estiran en la sintonía."
    solucion: "L2 y el condensador variable de doble sección."

  - id: porque-ajustes
    tipo: porque
    titulo: "Dónde están los ajustes"
    texto: "Todos los ajustes del kit están en el front-end y en la FI. ¿Por qué ahí?"
    libro: [39, 40]
    widget:
      tipo: figura
      figura: fig-16.2
      zonas:
        - { id: cadena, rotulo: "Los cinco integrados", rect: [4, 4, 443, 56] }
    opciones:
      - texto: "Porque los elementos resonantes no se pudieron integrar"
        bien: true
        porque: "L1, L2, el variable, B1, CF1, CF2 y B2 quedan fuera de los chips: son lo que hay que ajustar."
      - texto: "Porque los chips de radio derivan con la temperatura"
        porque: "Dentro de cada chip los componentes están apareados y a la misma temperatura: sus derivas se compensan."
      - texto: "Porque el audio no necesita ninguna calidad"
        porque: "El audio importa; lo que no lleva ajustes es lo integrado."
    escalera:
      - "¿Qué piezas no caben dentro de un integrado?"
    solucion: "Bobinas, variable, transformador de FI y filtros cerámicos quedan fuera: ahí están los ajustes."

  - id: predecir-ruido
    tipo: predecir
    titulo: "Entre emisoras"
    texto: "Entre emisoras se oye más ruido que con una emisora sintonizada. ¿Qué indica?"
    libro: [44, 45, 49]
    widget:
      tipo: figura
      figura: fig-16.2
      zonas:
        - { id: grafica, rotulo: "La gráfica", rect: [30, 85, 235, 130] }
    opciones:
      - texto: "Que la cadena de FI funciona: amplifica y limita"
        bien: true
        porque: "Con portadora, el limitador fija la amplitud y sale solo el audio; sin ella, lo que llega a plena amplitud es ruido."
      - texto: "Una avería en el front-end"
        porque: "Ese ruido es el comportamiento normal: un receptor ruidoso entre emisoras está vivo."
      - texto: "Que falta un control de ganancia"
        porque: "La FI no controla la ganancia: limita. Por eso el ruido sale al máximo sin portadora."
    escalera:
      - "¿Qué llena la salida de un limitador cuando no hay portadora?"
    solucion: "Es normal: sin portadora, el limitador saca el ruido a plena amplitud."

  - id: pregunta-silencio
    tipo: pregunta
    titulo: "Silencio absoluto"
    texto: "Con el Mute desactivado, el receptor está en silencio absoluto entre emisoras. ¿Qué es lo más probable?"
    libro: [45]
    widget:
      tipo: figura
      figura: fig-16.2
      zonas:
        - { id: banco, rotulo: "El recuadro de la derecha", rect: [290, 87, 157, 115] }
    opciones:
      - texto: "La cadena está rota"
        bien: true
        porque: "Una cadena viva saca ruido entre emisoras; el silencio absoluto sin Mute indica que algo la corta."
      - texto: "Funciona perfectamente"
        porque: "El funcionamiento normal es ruido entre emisoras, no silencio."
      - texto: "El Mute está mal ajustado con W2"
        porque: "El Mute está desactivado: W2 no puede callar nada."
    escalera:
      - "Sin Mute, ¿qué debería oírse entre emisoras?"
    solucion: "Cadena rota: sin Mute debería oírse el siseo."

  - id: toque-medidor
    tipo: tocar
    titulo: "El medidor de señal"
    texto: "La comprobación que más informa es el medidor de señal. Toque el integrado del que sale."
    libro: [33, 48]
    widget:
      tipo: figura
      figura: fig-16.2
      zonas:
        - { id: ic1, rotulo: "Arriba, el primero", rect: [4, 4, 77, 56] }
        - { id: ic2, rotulo: "Arriba, el segundo", rect: [95, 4, 77, 56] }
        - { id: ic3, rotulo: "Arriba, el tercero", rect: [187, 4, 77, 56] }
        - { id: ic4, rotulo: "Arriba, el cuarto", rect: [278, 4, 77, 56] }
        - { id: ic5, rotulo: "Arriba, el quinto", rect: [370, 4, 77, 56] }
    tocar:
      bien: [ic3]
      porque:
        ic1: "El front-end entrega la FI; el nivel de señal lo da la cadena de FI."
        ic2: "Es el primer amplificador de FI: no tiene salida para el medidor."
        ic4: "El decodificador estéreo enciende el LED de estéreo, no el medidor."
        ic5: "El amplificador de audio mueve los altavoces."
    exito: "El TA7303P: su desviación con y sin antena dice si el front-end y la FI están vivos."
    escalera:
      - "El medidor mide el nivel de la FI: busque el que la limita y la detecta."
    solucion: "El tercero, TA7303P."

  - id: empareje-mirar
    tipo: pregunta
    titulo: "Lo que hay que mirar"
    texto: "Empareje lo que hay que mirar de cada chip con por qué importa."
    libro: [42, 47]
    widget:
      tipo: figura
      figura: fig-16.2
      zonas:
        - { id: cadena, rotulo: "Los cinco integrados", rect: [4, 4, 443, 56] }
    emparejar:
      - ["Alimentación en sus pines", "Si está sucia, se oye como ruido de fondo"]
      - ["Condensadores de filtrado", "Fijan el AFC, el VCO estéreo y el de-énfasis"]
      - ["Salidas de estado", "Medidor, LED de estéreo y Mute: ayudan a diagnosticar"]
    exito: "Y la alimentación se comprueba en los propios pines de cada chip, no en el conector."
    pistas:
      - { texto: "C38, el único de poliéster, fija la frecuencia del VCO del decodificador." }
    escalera:
      - "Una cosa se oye, otra fija constantes y otra informa."
    solucion: "Alimentación, ruido; filtrado, constantes; estado, diagnóstico."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [33, 40, 44, 48]
    ideas:
      - { titulo: "Cinco chips.", texto: "Front-end, dos de FI, decodificador estéreo y audio, en el orden de la señal." }
      - { titulo: "Ajustes fuera.", texto: "Los resonantes no se integran: ahí están todos los ajustes." }
      - { titulo: "Limita.", texto: "Ruido entre emisoras: la cadena vive. Silencio absoluto sin Mute: está rota." }
      - { titulo: "El medidor.", texto: "Con y sin antena, dice si el front-end y la FI están vivos." }
