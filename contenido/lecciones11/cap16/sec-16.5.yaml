# Lección 1.2 de la sección 15.5 «Amplificación de Audio (TEA2025)» (cap16; etiquetas sec-16.N = impresas 15.N).
# - Modelo: el condensador de acoplo de salida y el altavoz forman un paso alto (esquema «filtro-rc»: la tensión en la
#   resistencia es la del altavoz). Corte f_c = 1/(2π·R·C): 470 µF y 8 Ω dan 42 Hz; los 1000 µF del kit (C53 y C58),
#   20 Hz con 8 Ω y 40 Hz con 4 Ω (bloque 83). La amplitud de 1 V y el tono de 1 kHz de la fuente son de ejemplo.
# - Los bloques del amplificador integrado (figura 15.5, fig-16.5), los números, el disipador y la tabla de síntomas.
# Pasos prácticos: «diseno» del condensador de acoplo para altavoces de 4 Ω (corte ≤ 40 Hz) con electrolíticos del
# ±20 % (cap02#262) y valores E6 (cap02, tabla de series): 1000 µF cumple en nominal y falla con tolerancias; 1500 µF
# cumple en todas las esquinas. Antes, «simular» el peor caso de los 1000 µF del kit con 4 Ω (49,7 Hz; error típico:
# el nominal, 39,8 Hz). El mando del diseño es de serie E6 (motor12e) y lleva los 1000 µF: cumplen en nominal y no con
# el 20 % menos, la trampa del diseño (el recorrido resuelve con una posición que aprueba con las tolerancias). «banco» opcional del corte inferior con la
# ficha 16 del cuaderno (20 Hz con 1000 µF y 8 Ω, ±20 %).
leccion: cap16/sec-16.5

libro:
  72: "El amplificador de audio de un receptor es el bloque que más potencia maneja"
  77: "la carga y descarga de los condensadores de acoplo produce un golpe audible"
  81: "con 9 V y 8 Ω, la potencia máxima antes de recorte ronda 1 W por canal"
  83: "con 470 µF y 8 Ω, el corte está en 42 Hz. En el FM7303 son de 1000 µF (C53 y C58): 20 Hz con altavoces de 8 Ω y 40 Hz con los de 4 Ω"
  84: "El condensador de bootstrap"
  85: "si la alimentación se hunde, esa variación llega al receptor"
  87: "en torno al 64 % de la excursión"
  88: "Recortar ese cobre para «hacer sitio» es un error que lleva a la protección térmica"
  90: "Sonido «respirado»"
  91: "un amplificador que se calienta en silencio está oscilando"
  95: "barriendo frecuencia y comprobando dónde caen 3 dB"
  97: "Los bloques de un amplificador de audio integrado y sus componentes externos críticos"
  "cap02#262": "con tolerancias del 20 % (electrolíticos, por ejemplo)"
  "cap02#38": "con el ±20 % basta la serie E6"

modelo:
  valores:
    V_p: { sim: "V_{p}", nombre: "amplitud a la salida del integrado (de ejemplo)", unidad: V, valor: 1 }
    f_f: { sim: "f", nombre: "frecuencia del tono (de ejemplo)", unidad: Hz, valor: 1000 }
    R_f: { sim: "R_{altavoz}", nombre: "impedancia del altavoz", unidad: Ω, valor: 8 }
    C_f: { sim: "C₅₃", nombre: "condensador de acoplo de salida", unidad: F, valor: 0.001 }
  calculos:
    f_c: { expr: "1/(2*pi*R_f*C_f)", sim: "f_{c}", nombre: "corte inferior", unidad: Hz, cifras: 3 }
    x_c: { expr: "2*pi*f_f*R_f*C_f", sim: "ωRC", nombre: "ωRC", unidad: "" }
    A_r: { expr: "V_p*x_c/sqrt(1 + x_c^2)", sim: "V_{altavoz}", nombre: "amplitud en el altavoz", unidad: V }
    f_w: { expr: "1/(2*pi*R_f*C_f*(1 - 0.2))", sim: "f_{c, peor}", nombre: "corte con el condensador un 20 % bajo", unidad: Hz, cifras: 3 }

tarjetas:
  - id: explore-acoplo
    tipo: explorar
    titulo: "El condensador que fija los graves"
    texto: "El condensador de salida y el altavoz forman un paso alto. Cambie el condensador y el altavoz, y mire el corte inferior."
    libro: [72, 83]
    nota: "La amplitud de 1 V es de ejemplo."
    widget:
      tipo: circuito
      esquema: filtro-rc
      piezas: { fuente: V_p, f: f_f, r: R_f, c: C_f }
      lectura: { valor: f_c, rotulo: "Corte inferior" }
      mide: { vr_amp: A_r }
      grafica:
        x: { id: nu, min: 5, max: 20000, unidad: Hz, rotulo: "f", escala: log }
        y: { min: 0, max: 1.1, unidad: V, rotulo: "altavoz" }
        curvas:
          - { expr: "V_p*(2*pi*nu*R_f*C_f)/sqrt(1 + (2*pi*nu*R_f*C_f)^2)", color: azul, rotulo: "v_{altavoz}", mide: vr_amp }
        marcas:
          - { x: "f_c", y: "V_p*0.7071", rotulo: "f_{c}" }
      mandos:
        - { valor: C_f, lista: [0.00047, 0.001], rotulo: "Condensador de salida" }
        - { valor: R_f, lista: [4, 8], rotulo: "Altavoz" }

  - id: predecir-cuatro
    tipo: predecir
    titulo: "Altavoces de 4 Ω"
    texto: "Con 1000 µF y altavoces de 8 Ω, el corte está en 20 Hz. Si monta altavoces de 4 Ω, ¿dónde queda?"
    libro: [83]
    fijar: { C_f: 0.001, R_f: 4 }
    widget:
      tipo: circuito
      esquema: filtro-rc
      piezas: { fuente: V_p, f: f_f, r: R_f, c: C_f }
      lectura: { valor: f_c, rotulo: "Corte inferior" }
      mide: { vr_amp: A_r }
      ocultar: true
      mandos: []
    opciones:
      - texto: "En 40 Hz: el doble"
        bien: true
        porque: "El corte va con 1/(R·C): con la mitad de resistencia, el doble de frecuencia."
      - texto: "En 20 Hz: no cambia"
        porque: "El corte depende del condensador y del altavoz juntos."
      - texto: "En 10 Hz: la mitad"
        porque: "Al revés: menos resistencia sube el corte, no lo baja."
    escalera:
      - "f_{c} = 1/(2π·R·C). ¿Qué pasa si R se reduce a la mitad?"
    solucion: "40 Hz: 1/(2π · 4 · 1000 µF)."
    comprobar:
      - { f_c: 39.79 }
      - { con: { R_f: 8 }, f_c: 19.89 }

  - id: simule-peor
    tipo: simular
    titulo: "El peor caso"
    texto: "Altavoces de 4 Ω y C53 de 1000 µF, un electrolítico del ±20 %. En el peor caso, ¿dónde queda el corte inferior?"
    libro: [83, "cap02#262"]
    fijar: { C_f: 0.001, R_f: 4 }
    simular:
      objetivo: f_w
      unidad: Hz
      tol: 0.03
      rotulo: "Corte en el peor caso"
      errores:
        - { expr: "f_c", texto: "Esos 40 Hz son los del valor nominal. El peor caso es el condensador un 20 % bajo: 800 µF." }
    exito: "Con 800 µF el corte sube a 49,7 Hz: los 40 Hz del nominal no están garantizados."
    escalera:
      - "El peor caso para los graves es la capacidad más baja."
    solucion: "1/(2π · 4 Ω · 800 µF) = 49,7 Hz."
    comprobar:
      - { f_w: 49.74, f_c: 39.79 }
      - { con: { C_f: 0.0008 }, f_c: 49.74 }

  - id: disene-acoplo
    tipo: diseno
    titulo: "Diseñe el acoplo de salida"
    texto: "Con altavoces de 4 Ω, elija el condensador de salida (E6, ±20 %) para un corte de 40 Hz o menos en todas las esquinas."
    libro: [83, "cap02#262", "cap02#38"]
    fijar: { R_f: 4 }
    inicio: { C_f: 0.00047 }
    widget:
      tipo: circuito
      esquema: filtro-rc
      piezas: { fuente: V_p, f: f_f, r: R_f, c: C_f }
      lectura: { valor: f_c, rotulo: "Corte inferior" }
      mide: { vr_amp: A_r }
      grafica:
        x: { id: nu, min: 5, max: 20000, unidad: Hz, rotulo: "f", escala: log }
        y: { min: 0, max: 1.1, unidad: V, rotulo: "altavoz" }
        curvas:
          - { expr: "V_p*(2*pi*nu*R_f*C_f)/sqrt(1 + (2*pi*nu*R_f*C_f)^2)", color: azul, rotulo: "v_{altavoz}", mide: vr_amp }
        marcas:
          - { x: "f_c", y: "V_p*0.7071", rotulo: "f_{c}" }
      mandos:
        - { valor: C_f, serie: E6, min: 0.00047, max: 0.0033, rotulo: "C₅₃ (E6)" }
    condiciones:
      - { valor: f_c, max: 40, rotulo: "Corte: {{f_c}}" }
    diseno:
      tolerancias: { C_f: 0.2 }
      metodo: esquinas
      exigir: todas
      si_tolerancias: "En nominal cumple, pero con el condensador un 20 % bajo el corte pasa de 40 Hz: elija el valor siguiente."
    exito: "Cumple incluso con el condensador un 20 % bajo. Uno demasiado pequeño pierde graves: un error habitual."
    pistas:
      - { cuando: { valor: f_c, mayor: 40 }, texto: "El corte pasa de 40 Hz: hace falta más capacidad." }
      - { texto: "Elija un condensador mayor." }
    escalera:
      - "Con ±20 %, el condensador real puede tener un 20 % menos de capacidad, y el corte sube."
      - "1000 µF ya no bastaba en el peor caso: hace falta el valor siguiente de la serie."
    solucion: "1500 µF: 26,5 Hz nominal y 33,2 Hz con un 20 % menos."
    comprobar:
      - { con: { C_f: 0.0015 }, f_c: 26.53 }
      - { con: { C_f: 0.0012 }, f_c: 33.16 }

  - id: toque-corte
    tipo: tocar
    titulo: "El componente que fija los graves"
    texto: "En los bloques del amplificador integrado, toque el componente externo que fija el corte inferior."
    libro: [77, 83, 84, 85, 97]
    widget:
      tipo: figura
      figura: fig-16.5
      zonas:
        - { id: desacoplo, rotulo: "Arriba a la izquierda", rect: [25, 25, 70, 60] }
        - { id: bootstrap, rotulo: "Arriba a la derecha", rect: [280, 15, 60, 35] }
        - { id: entrada, rotulo: "A la izquierda, en la entrada", rect: [45, 100, 45, 40] }
        - { id: salida, rotulo: "A la derecha, antes del altavoz", rect: [325, 100, 60, 50] }
    tocar:
      bien: [salida]
      porque:
        desacoplo: "El desacoplo evita que la alimentación se hunda al ritmo de la música."
        bootstrap: "El bootstrap acerca la salida al raíl positivo: da potencia, no graves."
        entrada: "El acoplo de entrada bloquea la continua de la señal; el corte que pierde graves es el de salida con el altavoz."
    exito: "El acoplo de salida, con la impedancia del altavoz: 470 µF y 8 Ω, corte en 42 Hz."
    escalera:
      - "Busque el condensador en serie con el altavoz."
    solucion: "El acoplo de salida, a la derecha."

  - id: empareje-sintomas
    tipo: pregunta
    titulo: "Los síntomas"
    texto: "Empareje cada síntoma de la etapa de audio con su causa probable."
    libro: [90]
    widget:
      tipo: figura
      figura: fig-16.5
      zonas:
        - { id: amplificador, rotulo: "El amplificador", rect: [95, 60, 220, 140] }
    emparejar:
      - ["Sin sonido, con alimentación correcta", "Silenciamiento activo o acoplo abierto"]
      - ["Distorsión a volumen alto", "Recorte normal o alimentación insuficiente"]
      - ["Se calienta sin señal", "Oscilación de alta frecuencia"]
      - ["Sonido «respirado»", "Desacoplo insuficiente"]
      - ["Un canal sí y otro no", "Componente externo de ese canal"]
    exito: "Cada síntoma apunta a una parte de la etapa: es el primer paso del diagnóstico."
    pistas:
      - { texto: "Lo «respirado» es la alimentación que se hunde al ritmo de la música." }
    escalera:
      - "Si un canal funciona, el integrado está bien: mire lo de fuera."
    solucion: "Sin sonido, mute o acoplo; distorsión, recorte; calor, oscilación; respirado, desacoplo; un canal, su componente."

  - id: porque-caliente
    tipo: porque
    titulo: "Caliente en silencio"
    texto: "El TEA2025 se calienta aunque no suene nada. ¿Por qué merece atención?"
    libro: [91]
    widget:
      tipo: figura
      figura: fig-16.5
      zonas:
        - { id: salida, rotulo: "La etapa de salida", rect: [210, 90, 93, 46] }
    opciones:
      - texto: "Porque está oscilando aunque no se oiga"
        bien: true
        porque: "Es un fallo frecuente: la oscilación de alta frecuencia no se oye y se confirma con el osciloscopio."
      - texto: "Porque es normal en clase AB"
        porque: "Sin señal, la clase AB solo gasta su corriente de reposo: calentarse en silencio no es normal."
      - texto: "Porque el volumen está al mínimo"
        porque: "Con el volumen al mínimo debería disipar menos, no más."
    escalera:
      - "¿Qué consume potencia sin que se oiga?"
    solucion: "Oscila a alta frecuencia: se confirma con el osciloscopio."

  - id: pregunta-cobre
    tipo: pregunta
    titulo: "El disipador"
    texto: "El TEA2025 no lleva aleta. ¿Cómo evacua el calor?"
    libro: [88]
    widget:
      tipo: figura
      figura: fig-16.5
      zonas:
        - { id: salida, rotulo: "La etapa de salida", rect: [210, 90, 93, 46] }
    opciones:
      - texto: "Por cuatro patillas centrales de masa unidas al cobre"
        bien: true
        porque: "Están unidas al soporte del chip: el cobre de la placa hace de disipador. Recortarlo lleva a la protección térmica."
      - texto: "No lo necesita: disipa muy poco"
        porque: "A 12 V con 8 Ω cada canal puede disipar hasta 0,9 W, más la corriente de reposo."
      - texto: "Por el condensador de salida"
        porque: "El condensador acopla la señal; el calor sale por las patillas de masa."
    escalera:
      - "Su encapsulado es PowerDIP 12+2+2."
    solucion: "Por las cuatro patillas centrales de masa, al cobre de la placa."

  - id: predecir-recorte
    tipo: predecir
    titulo: "Con 9 V y 8 Ω"
    texto: "Con 9 V y un altavoz de 8 Ω, ¿cuánta potencia da antes de recortar, aproximadamente?"
    libro: [81]
    widget:
      tipo: figura
      figura: fig-16.5
      zonas:
        - { id: salida, rotulo: "La etapa de salida", rect: [210, 90, 93, 46] }
    opciones:
      - texto: "Ronda 1 W por canal"
        bien: true
        porque: "La excursión útil no llega a la alimentación completa: queda en torno a 1 W."
      - texto: "Unos 10 W por canal"
        porque: "Con 9 V la excursión no da para tanto: son unos pocos vatios como mucho."
      - texto: "Lo mismo que con 12 V"
        porque: "Con menos alimentación hay menos excursión y menos potencia."
    escalera:
      - "La excursión útil no llega a la alimentación completa."
    solucion: "Ronda 1 W por canal."

  - id: banco-corte
    tipo: banco
    titulo: "El corte inferior, medido"
    texto: "Con una carga de 8 Ω en lugar del altavoz, barra la frecuencia hacia abajo y busque dónde cae la salida 3 dB."
    libro: [83, 95, "cap02#262"]
    fijar: { C_f: 0.001, R_f: 8 }
    banco:
      piezas: ["Receptor terminado", "Resistencia de 8 Ω en lugar de un altavoz", "Generador del FNIRSI con condensador de acoplo", "Osciloscopio sobre la carga"]
      medir: "La frecuencia a la que la salida cae 3 dB respecto a la de 1 kHz."
      esperado: f_c
      unidad: Hz
      tol: 0.2
      consejos:
        - { cuando: { valor: desviacion, mayor: 0.2 }, texto: "Mide alto: el condensador tiene menos capacidad de la que marca, o la carga es menor de 8 Ω." }
        - { cuando: { valor: desviacion, menor: -0.2 }, texto: "Mide bajo: compruebe que toma la caída de 3 dB y que la carga es de 8 Ω." }
        - { texto: "Dentro del 20 % de los electrolíticos: C53 y C58 hacen su trabajo." }
      ficha: { n: 16, titulo: "La etapa de audio TEA2025" }
    comprobar:
      - { f_c: 19.89 }

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [83, 87, 88, 91]
    ideas:
      - { titulo: "El corte.", texto: "Condensador de salida y altavoz: 1000 µF dan 20 Hz con 8 Ω y 40 Hz con 4 Ω." }
      - { titulo: "Con tolerancia.", texto: "Con electrolíticos del ±20 %, deje margen: el valor justo en nominal no basta." }
      - { titulo: "El calor.", texto: "Por las patillas de masa al cobre: no lo recorte." }
      - { titulo: "Caliente en silencio.", texto: "Está oscilando: se confirma con el osciloscopio." }
