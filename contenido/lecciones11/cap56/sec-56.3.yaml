# Lección 1.2 de la sección 34.3 «La Máquina de Corriente Continua» (cap56; etiqueta sec-56.3). Formato: GUIA.md.
# - El motor del libro (24 V, R = 0,5 Ω, k = 0,05 V·s/rad: 4 584 rpm en vacío, 2,4 N·m y 48 A bloqueado; 4 393 y
#   4 106 rpm con 2 y 5 A) en una gráfica del modelo: la recta par-velocidad ω = V/k − R/k²·T (ecuación del bloque
#   41), con la tensión del inducido como mando, como la figura 34.3b.
# - No hay esquema de motor en la app (una fuerza electromotriz que depende de la velocidad): va con gráficas.
# Pasos prácticos: «dibujar» la recta de 24 V y «ajuste» de la tensión (el PWM del puente) para 2 000 rpm con
# 0,25 N·m: 13,0 V, el 54,0 % (bloque 51).
leccion: cap56/sec-56.3

libro:
  36: "El colector es un conmutador mecánico"
  39: 'V = E + I dot.op R + L dot.op (d I)/(d t)'
  41: 'ω = V/k - (R)/(k^("2")) dot.op T'
  42: "Con el motor de 24 V, R = 0,5 Ω y k = 0,05 V·s/rad, ω0 = 480 rad/s (4 584 rpm) y Tb = 2,4 N·m, con 48 A. Cada newton-metro de carga le quita 1 910 rpm"
  43: "4 393 rpm"
  44: "La potencia mecánica es máxima a media velocidad y medio par, V²/(4·R) = 288 W, pero con un rendimiento del 50 %"
  47: "Con una rampa de 0 a 24 V en 0,2 s el rotor sigue a la tensión con una aceleración de 480/0,2 = 2 400 rad/s², que pide J·α = 0,24 N·m: 4,8 A durante toda la rampa"
  48: "47,0 A de pico"
  51: "para 2 000 rpm con 0,25 N·m hacen falta 13,0 V, un ciclo de trabajo del 54,0 %"
  52: "un par de arranque enorme y una velocidad que se dispara en vacío"
  53: "bajar el puente a 12 V da al instante −24 A y −1,2 N·m de par de frenado"
  54: "uno interno de corriente, rápido, que limita el par y protege el puente"

modelo:
  valores:
    V_a: { sim: "V", nombre: "tensión del inducido", unidad: V, valor: 24 }
    R_a: { sim: "R", nombre: "resistencia del inducido", unidad: Ω, valor: 0.5 }
    k_m: { sim: "k", nombre: "constante del motor", unidad: "V·s/rad", valor: 0.05 }
    T_l: { sim: "T", nombre: "par de la carga", unidad: "N·m", valor: 0.1 }
    J_r: { sim: "J", nombre: "momento de inercia", unidad: "kg·m²", valor: 0.0001 }
    a_r: { sim: "α", nombre: "aceleración de la rampa", unidad: "rad/s²", valor: 2400 }
    w_0: { sim: "ω", nombre: "velocidad antes de frenar", unidad: "rad/s", valor: 480 }
    V_f: { sim: "V", nombre: "tensión del puente al frenar", unidad: V, valor: 12 }
  calculos:
    w_m: { expr: "V_a/k_m - R_a/k_m^2*T_l", sim: "ω", nombre: "velocidad", unidad: "rad/s" }
    n_m: { expr: "w_m*60/(2*pi)", sim: "n", nombre: "velocidad", unidad: rpm, cifras: 4 }
    I_m: { expr: "T_l/k_m", sim: "I", nombre: "corriente", unidad: A }
    eta_m: { expr: "100*(V_a - I_m*R_a)/V_a", sim: "η", nombre: "rendimiento", unidad: "%", cifras: 3 }
    I_b: { expr: "V_a/R_a", sim: "I_{b}", nombre: "corriente de arranque en directo", unidad: A }
    T_b: { expr: "k_m*V_a/R_a", sim: "T_{b}", nombre: "par de bloqueo", unidad: "N·m" }
    ciclo: { expr: "100*V_a/24", sim: "D", nombre: "ciclo de trabajo desde 24 V", unidad: "%", cifras: 3 }
    I_r: { expr: "J_r*a_r/k_m", sim: "I", nombre: "corriente durante la rampa", unidad: A }
    I_fr: { expr: "(V_f - k_m*w_0)/R_a", sim: "I", nombre: "corriente al frenar", unidad: A }
    T_fr: { expr: "k_m*I_fr", sim: "T", nombre: "par al frenar", unidad: "N·m" }

tarjetas:
  - id: explore-recta
    tipo: explorar
    titulo: "La recta par-velocidad"
    texto: "Cargue el eje y baje la tensión. La velocidad cae en recta con el par; bajar la tensión desplaza la recta sin cambiar su pendiente."
    libro: [42, 43]
    widget:
      tipo: grafica
      x: { id: tx, min: 0, max: 2.5, unidad: "N·m", rotulo: "T" }
      y: { min: 0, max: 5000, unidad: rpm, rotulo: "n" }
      curvas:
        - { expr: "max(0, (V_a/k_m - R_a/k_m^2*tx)*60/(2*pi))", color: naranja, rotulo: "recta" }
      marcas:
        - { x: "T_l", y: "n_m", rotulo: "{{n_m}}" }
      lectura: { valor: n_m, rotulo: "Velocidad" }
      datos:
        - { valor: I_m, rotulo: "Corriente: {{I_m}}" }
        - { valor: eta_m, rotulo: "Rendimiento: {{eta_m}}" }
      mandos:
        - { valor: T_l, min: 0, max: 1.2, paso: 0.05, rotulo: "Par de la carga" }
        - { valor: V_a, lista: [6, 12, 18, 24], rotulo: "Tensión del inducido" }
    requiere: { mover: [T_l, V_a] }

  - id: formula-recta
    tipo: formula
    titulo: "La ecuación de la recta"
    texto: "En régimen, el par que pide la carga fija la corriente, y la caída en R quita velocidad."
    libro: [41, 42]
    fijar: { V_a: 24, T_l: 0.1 }
    ec: 41
    sustitucion: "{{V_a}} / {{k_m}} − {{R_a}} / {{k_m}}² · {{T_l}} = {{w_m}}"
    widget:
      tipo: grafica
      x: { id: tx, min: 0, max: 2.5, unidad: "N·m", rotulo: "T" }
      y: { min: 0, max: 5000, unidad: rpm, rotulo: "n" }
      curvas:
        - { expr: "max(0, (V_a/k_m - R_a/k_m^2*tx)*60/(2*pi))", color: naranja, rotulo: "recta" }
      marcas:
        - { x: "T_l", y: "n_m", rotulo: "{{n_m}}" }
      lectura: { valor: n_m, rotulo: "Velocidad" }
    comprobar:
      - { n_m: 4393, I_m: 2, eta_m: 95.8 }
      - { con: { T_l: 0.25 }, n_m: 4106 }
      - { con: { T_l: 0 }, n_m: 4584 }

  - id: prediga-arranque
    tipo: predecir
    titulo: "Conectado a pelo"
    texto: "El motor de 24 V, parado, se conecta directamente a la fuente. ¿Qué corriente pide?"
    libro: [39, 42, 48]
    fijar: { V_a: 24 }
    widget:
      tipo: figura
      figura: fig-56.4
      zonas:
        - { id: arranques, rotulo: "Las dos gráficas", rect: [0, 0, 325, 130] }
    opciones:
      - texto: "Unos 48 A: parado, E = 0 y solo la limita R"
        bien: true
        porque: "24 V entre 0,5 Ω: veinticuatro veces la de 2 A. La simulación da 47,0 A de pico."
      - texto: "La de trabajo, unos 2 A"
        porque: "Esa es con el rotor girando, cuando E casi iguala a V."
      - texto: "Nada hasta que gire"
        porque: "Al revés: parado no hay fuerza electromotriz que se oponga."
    escalera:
      - "Con el rotor parado, ¿cuánto vale E = k·ω?"
    solucion: "24/0,5 = 48 A."
    comprobar:
      - { I_b: 48, T_b: 2.4 }

  - id: dibuje-recta
    tipo: dibujar
    titulo: "Dibuje la recta de 24 V"
    texto: "Dibuje la velocidad frente al par, desde el vacío hasta el bloqueo."
    libro: [42]
    fijar: { V_a: 24 }
    dibujar:
      x: { id: tx, min: 0, max: 2.5, unidad: "N·m", rotulo: "T" }
      y: { min: 0, max: 5000, unidad: rpm, rotulo: "n" }
      curva: "max(0, (V_a/k_m - R_a/k_m^2*tx)*60/(2*pi))"
      puntos: 21
      tol: 0.08
      holgura: 0.03
      rotulo: "Velocidad frente al par"
    exito: "Una recta de 4 584 rpm en vacío a cero con 2,4 N·m: cada newton-metro le quita 1 910 rpm."
    pistas:
      - { cuando: { valor: media, mayor: 0.1 }, texto: "La ha dibujado alta: con 2,4 N·m el motor se para." }
      - { texto: "Es una recta: 4 584 rpm en vacío y cero en el par de bloqueo." }
    escalera:
      - "Los dos extremos: ω₀ = V/k en vacío, T_{b} = k·V/R parado."
    solucion: "Recta de 4 584 rpm a 0 N·m hasta 0 rpm a 2,4 N·m."

  - id: por-que-288
    tipo: porque
    titulo: "La potencia máxima"
    texto: "La potencia mecánica es máxima a media velocidad y medio par: 288 W. ¿Por qué no se trabaja ahí?"
    libro: [44]
    widget:
      tipo: grafica
      x: { id: tx, min: 0, max: 2.5, unidad: "N·m", rotulo: "T" }
      y: { min: 0, max: 300, unidad: W, rotulo: "P" }
      curvas:
        - { expr: "max(0, tx*(V_a/k_m - R_a/k_m^2*tx))", color: naranja, rotulo: "potencia en el eje" }
    opciones:
      - texto: "El rendimiento es del 50 % y la corriente doce veces la de 2 A: el cobre se calienta"
        bien: true
        porque: "Solo se aguanta unos instantes; el trabajo continuo está cerca del vacío, limitado por la corriente nominal."
      - texto: "Porque el motor gira demasiado deprisa"
        porque: "Gira a media velocidad; el problema es el calor del cobre."
      - texto: "Porque ahí el par es negativo"
        porque: "El par es la mitad del de bloqueo, positivo."
    escalera:
      - "¿Qué corriente pide medio par de bloqueo?"
    solucion: "Por el calor: 50 % de rendimiento y doce veces la corriente de la fila de 2 A."

  - id: ajuste-2000
    tipo: ajuste
    titulo: "2 000 rpm con 0,25 N·m"
    texto: "La carga pide 0,25 N·m. Baje la tensión del inducido con el PWM del puente hasta que gire a 2 000 rpm."
    libro: [51]
    fijar: { T_l: 0.25 }
    inicio: { V_a: 24 }
    widget:
      tipo: grafica
      x: { id: tx, min: 0, max: 2.5, unidad: "N·m", rotulo: "T" }
      y: { min: 0, max: 5000, unidad: rpm, rotulo: "n" }
      curvas:
        - { expr: "max(0, (V_a/k_m - R_a/k_m^2*tx)*60/(2*pi))", color: naranja, rotulo: "recta" }
      marcas:
        - { x: "T_l", y: "n_m", rotulo: "{{n_m}}" }
      lectura: { valor: n_m, rotulo: "Velocidad" }
      datos:
        - { valor: ciclo, rotulo: "Ciclo de trabajo: {{ciclo}}" }
      mandos:
        - { valor: V_a, min: 6, max: 24, paso: 0.5, rotulo: "Tensión del inducido" }
    ajuste:
      valor: n_m
      objetivo: 2000
      tol: 0.01
      rotulo: "Velocidad"
      bajo: "Va despacio: suba la tensión."
      alto: "Va deprisa: baje la tensión."
      dentro: "Unos 13,0 V, el 54,0 % de ciclo: el par sigue disponible, porque lo da la corriente."
    comprobar:
      - { con: { V_a: 13 }, n_m: 2005, ciclo: 54.2, tol: 0.005 }

  - id: estime-rampa
    tipo: pregunta
    titulo: "Arrancar con una rampa"
    texto: "Rampa de 0 a 24 V en 0,2 s: el rotor acelera a 2 400 rad/s². Con J = 10⁻⁴ kg·m², ¿qué corriente pide?"
    libro: [47]
    widget:
      tipo: figura
      figura: fig-56.4
      zonas:
        - { id: arranques, rotulo: "Las dos gráficas", rect: [0, 0, 325, 130] }
    estimar:
      objetivo: "I_r"
      unidad: A
      min: 0
      max: 48
      paso: 0.2
      inicio: 30
      tol: 0.04
      rotulo: "Corriente en la rampa"
    exito: "4,8 A durante toda la rampa, frente a 47 A conectando a pelo."
    pistas:
      - { cuando: { valor: estimacion, mayor: 5 }, texto: "Se ha pasado: el par es J·α = 0,24 N·m, y I = T/k." }
      - { texto: "Se ha quedado corto: 0,24 N·m entre 0,05 V·s/rad." }
    escalera:
      - "Par para acelerar: J·α; corriente: T/k."
    solucion: "J·α = 0,24 N·m; 0,24/0,05 = 4,8 A."
    comprobar:
      - { I_r: 4.8 }

  - id: frenado
    tipo: pregunta
    titulo: "Bajar la tensión de golpe"
    texto: "El motor gira en vacío a 480 rad/s (E = 24 V) y el puente baja de golpe a 12 V. ¿Qué pasa en ese instante?"
    libro: [53]
    widget:
      tipo: grafica
      x: { id: tx, min: 0, max: 2.5, unidad: "N·m", rotulo: "T" }
      y: { min: 0, max: 5000, unidad: rpm, rotulo: "n" }
      curvas:
        - { expr: "max(0, (V_a/k_m - R_a/k_m^2*tx)*60/(2*pi))", color: naranja, rotulo: "recta" }
    opciones:
      - texto: "La corriente se invierte, −24 A, y frena con −1,2 N·m devolviendo energía"
        bien: true
        porque: "Con V < E funciona como generador: por eso los accionamientos llevan resistencia de frenado."
      - texto: "La corriente cae a cero y el motor sigue girando libre"
        porque: "E = 24 V frente a 12 V: la diferencia hace circular corriente al revés."
      - texto: "La velocidad baja a la mitad al instante"
        porque: "La inercia no lo permite: la velocidad baja con el par de frenado."
    escalera:
      - "I = (V − E)/R."
    solucion: "(12 − 24)/0,5 = −24 A: frena con −1,2 N·m."
    comprobar:
      - { I_fr: -24, T_fr: -1.2 }

  - id: tipos
    tipo: pregunta
    titulo: "Excitación y control"
    texto: "Empareje cada variante con su comportamiento."
    libro: [36, 52, 54]
    widget:
      tipo: figura
      figura: fig-56.3
      zonas:
        - { id: rectas, rotulo: "Las rectas", rect: [160, 0, 165, 147] }
    emparejar:
      - ["Excitación en serie", "Par de arranque enorme; se dispara en vacío"]
      - ["Imanes o derivación", "La velocidad varía poco con la carga"]
      - ["Lazo interno de corriente", "Limita el par y protege el puente"]
    exito: "El motor serie alimentado en alterna es el universal de taladros y aspiradoras."
    pistas:
      - { texto: "En serie, el par crece con el cuadrado de la corriente." }
    escalera:
      - "¿Cuál se dispara sin carga?"
    solucion: "Serie: arranque enorme. Imanes: velocidad casi fija. Lazo de corriente: limita el par."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [41, 42, 47, 51]
    ideas:
      - { titulo: "La recta.", texto: "ω = V/k − R/k²·T: vacío en V/k, bloqueo en k·V/R." }
      - { titulo: "Par y corriente.", texto: "T = k·I: limitar la corriente es limitar el par." }
      - { titulo: "Arranque.", texto: "Parado solo frena R: rampa de tensión o lazo de corriente." }
      - { titulo: "Control.", texto: "Bajar V desplaza la recta: 13,0 V para 2 000 rpm con 0,25 N·m." }
