# Lección 1.2 de la sección 34.3 «La Máquina de Corriente Continua» (cap56; etiqueta sec-56.3). Formato: GUIA.md.
# - El motor del libro (24 V, R = 0,5 Ω, k = 0,05 V·s/rad: 4 584 rpm en vacío, 2,4 N·m y 48 A bloqueado; 4 393 y
#   4 106 rpm con 2 y 5 A) en una gráfica del modelo: la recta par-velocidad ω = V/k − R/k²·T (ecuación del bloque
#   41), con la tensión del inducido como mando, como la figura 34.3b.
# - 1.2 (esquemas12d): el esquema `motor-cc` vivo (L = 50 µH y J = 10⁻⁴ kg·m² del bloque 47) en explore-recta,
#   la nueva explore-arranque (46,96 A de pico, bloque 49), ajuste-2000 y frenado (ya gira a 480 rad/s y el puente
#   baja a 12 V: la velocidad cae despacio hacia 240 rad/s).
# Pasos prácticos: «dibujar» la recta de 24 V y «ajuste» de la tensión (el PWM del puente) para 2 000 rpm con
# 0,25 N·m: 13,0 V, el 54,0 % (bloque 51).
# 1.2.1 (autor121-pot, «aprender haciendo», GUIA §13): se carga el eje hasta 5 A (objetivo), se lee la velocidad con
# 0,1 N·m, se calculan la corriente de bloqueo, la de la rampa y la del frenado, se baja la tensión de arranque hasta
# un pico de 20 A como mucho (objetivo; el pico es proporcional a V), se dibuja la recta y se ajustan las 2 000 rpm.
# Queda una pregunta (la potencia máxima); la excitación en serie y el lazo de corriente pasan al resumen.
leccion: cap56/sec-56.3

libro:
  36: "El colector es un conmutador mecánico"
  39: 'V = E + I dot.op R + L dot.op (d I)/(d t)'
  41: 'ω = V/k - (R)/(k^("2")) dot.op T'
  42: "Con el motor de 24 V, R = 0,5 Ω y k = 0,05 V·s/rad, ω0 = 480 rad/s (4 584 rpm) y Tb = 2,4 N·m, con 48 A. Cada newton-metro de carga le quita 1 910 rpm"
  43: "4 393 rpm"
  44: "La potencia mecánica es máxima a media velocidad y medio par, V²/(4·R) = 288 W, pero con un rendimiento del 50 %"
  47: "Con una rampa de 0 a 24 V en 0,2 s el rotor sigue a la tensión con una aceleración de 480/0,2 = 2 400 rad/s², que pide J·α = 0,24 N·m: 4,8 A durante toda la rampa"
  48: "47,0 A de pico"
  49: "en directo, 46,96 A de pico, el 63 % de la velocidad final a los 20,0 ms"
  51: "para 2 000 rpm con 0,25 N·m hacen falta 13,0 V, un ciclo de trabajo del 54,0 %"
  52: "un par de arranque enorme y una velocidad que se dispara en vacío"
  53: "bajar el puente a 12 V da al instante −24 A y −1,2 N·m de par de frenado"
  54: "uno interno de corriente, rápido, que limita el par y protege el puente"

modelo:
  valores:
    V_a: { sim: "V", nombre: "tensión del inducido", unidad: V, valor: 24 }
    R_a: { sim: "R", nombre: "resistencia del inducido", unidad: Ω, valor: 0.5 }
    k_m: { sim: "k", nombre: "constante del motor", unidad: "V·s/rad", valor: 0.05 }
    T_l: { sim: "T", nombre: "par de la carga", unidad: "N·m", valor: 0.1 }
    J_r: { sim: "J", nombre: "momento de inercia", unidad: "kg·m²", valor: 0.0001 }
    a_r: { sim: "α", nombre: "aceleración de la rampa", unidad: "rad/s²", valor: 2400 }
    w_0: { sim: "ω", nombre: "velocidad antes de frenar", unidad: "rad/s", valor: 480 }
    V_f: { sim: "V", nombre: "tensión del puente al frenar", unidad: V, valor: 12 }
    L_r: { sim: "L", nombre: "inductancia del inducido", unidad: H, valor: 50e-6 }
  calculos:
    E_m: { expr: "k_m*w_m", sim: "E", nombre: "fuerza electromotriz", unidad: V }
    a_m: { expr: "R_a/L_r", sim: "a", nombre: "R/L", unidad: "1/s" }
    b_m: { expr: "k_m^2/(L_r*J_r)", sim: "b", nombre: "k²/(L·J)", unidad: "1/s²" }
    s1_m: { expr: "-a_m/2 + sqrt(a_m^2/4 - b_m)", sim: "s₁", nombre: "polo mecánico", unidad: "1/s" }
    s2_m: { expr: "-a_m/2 - sqrt(a_m^2/4 - b_m)", sim: "s₂", nombre: "polo eléctrico", unidad: "1/s" }
    w0_m: { expr: "V_a/k_m", sim: "ω_{0}", nombre: "velocidad en vacío", unidad: "rad/s" }
    Ip_m: { expr: "V_a/L_r/(s1_m - s2_m)*(exp(s1_m*ln(s2_m/s1_m)/(s1_m - s2_m)) - exp(s2_m*ln(s2_m/s1_m)/(s1_m - s2_m)))", sim: "I_{pico}", nombre: "pico de corriente en directo", unidad: A }
    dw_f: { expr: "(V_f - k_m*w_0)/k_m", sim: "Δω", nombre: "cambio de velocidad al frenar", unidad: "rad/s" }
    wf_f: { expr: "V_f/k_m", sim: "ω", nombre: "velocidad final tras frenar", unidad: "rad/s" }
    w_m: { expr: "V_a/k_m - R_a/k_m^2*T_l", sim: "ω", nombre: "velocidad", unidad: "rad/s" }
    n_m: { expr: "w_m*60/(2*pi)", sim: "n", nombre: "velocidad", unidad: rpm, cifras: 4 }
    I_m: { expr: "T_l/k_m", sim: "I", nombre: "corriente", unidad: A }
    eta_m: { expr: "100*(V_a - I_m*R_a)/V_a", sim: "η", nombre: "rendimiento", unidad: "%", cifras: 3 }
    I_b: { expr: "V_a/R_a", sim: "I_{b}", nombre: "corriente de arranque en directo", unidad: A }
    T_b: { expr: "k_m*V_a/R_a", sim: "T_{b}", nombre: "par de bloqueo", unidad: "N·m" }
    ciclo: { expr: "100*V_a/24", sim: "D", nombre: "ciclo de trabajo desde 24 V", unidad: "%", cifras: 3 }
    I_r: { expr: "J_r*a_r/k_m", sim: "I", nombre: "corriente durante la rampa", unidad: A }
    I_fr: { expr: "(V_f - k_m*w_0)/R_a", sim: "I", nombre: "corriente al frenar", unidad: A }
    T_fr: { expr: "k_m*I_fr", sim: "T", nombre: "par al frenar", unidad: "N·m" }

tarjetas:
  - id: explore-recta
    tipo: explorar
    titulo: "La recta par-velocidad"
    texto: "Con 24 V, la velocidad cae en recta con el par que pide la carga. Cargue el eje hasta que el motor tome 5 A."
    libro: [39, 42, 43]
    inicio: { T_l: 0.1, V_a: 24 }
    widget:
      tipo: circuito
      esquema: motor-cc
      piezas: { fuente: V_a, r: R_a, l: L_r, k: k_m, j: J_r, carga: T_l }
      corriente: I_m
      mide: { ia: I_m, omega: w_m, par: T_l, fem: E_m }
      lectura: { valor: n_m, rotulo: "Velocidad" }
      datos:
        - { valor: I_m, rotulo: "Corriente: {{I_m}}" }
        - { valor: eta_m, rotulo: "Rendimiento: {{eta_m}}" }
      mandos:
        - { valor: T_l, min: 0, max: 1.2, paso: 0.05, rotulo: "Par de la carga" }
        - { valor: V_a, lista: [6, 12, 18, 24], rotulo: "Tensión del inducido" }
    objetivo:
      condiciones:
        - { valor: V_a, min: 24, rotulo: "Tensión: {{V_a}}" }
        - { valor: I_m, objetivo: 5, tol: 0.01, rotulo: "Corriente: {{I_m}}" }
      logrado: "Con {{T_l}}, {{I_m}} y {{n_m}}: T = k·I, y cada newton-metro quita 1 910 rpm. Bajar la tensión desplaza la recta."
      pistas:
        - { cuando: { valor: V_a, menor: 24 }, texto: "Deje la tensión en 24 V." }
        - { cuando: { valor: I_m, mayor: 5 }, texto: "Demasiado par: aligere el eje." }
        - { texto: "Falta par: cargue más el eje." }
    escalera:
      - "I = T/k: 5 A con k = 0,05."
    solucion: "0,25 N·m: 4 106 rpm."
    comprobar:
      - { con: { T_l: 0.25, V_a: 24 }, I_m: 5, n_m: 4106, eta_m: 89.6, tol: 0.003 }

  - id: formula-recta
    tipo: leer
    titulo: "La ecuación de la recta"
    texto: "ω = V/k − R/k²·T: el par fija la corriente y la caída en R quita velocidad. Con 0,1 N·m, lea la velocidad en la gráfica."
    libro: [41, 42, 43]
    fijar: { V_a: 24, T_l: 0.1 }
    widget:
      tipo: grafica
      x: { id: tx, min: 0, max: 2.5, unidad: "N·m", rotulo: "T" }
      y: { min: 0, max: 5000, unidad: rpm, rotulo: "n" }
      curvas:
        - { expr: "max(0, (V_a/k_m - R_a/k_m^2*tx)*60/(2*pi))", color: naranja, rotulo: "recta" }
      marcas:
        - { x: "T_l", y: "n_m", rotulo: "0,1 N·m" }
      mandos: []
    leer:
      objetivo: n_m
      unidad: rpm
      tol: 0.02
      rotulo: "Velocidad"
      errores:
        - { expr: "w_m", texto: "Eso parece la velocidad en rad/s. La gráfica está en revoluciones por minuto." }
    exito: "4 393 rpm, con 2 A y un 95,8 % de rendimiento: el rendimiento es E/V."
    escalera:
      - "Mire la marca."
    solucion: "Unos 4 393 rpm."
    comprobar:
      - { n_m: 4393, I_m: 2, eta_m: 95.8 }
      - { con: { T_l: 0 }, n_m: 4584 }

  - id: prediga-arranque
    tipo: simular
    titulo: "Conectado a pelo"
    texto: "El motor de 24 V, parado, se conecta directamente a la fuente. ¿Qué corriente pide?"
    libro: [39, 42, 47, 48]
    fijar: { V_a: 24 }
    widget:
      tipo: figura
      figura: fig-56.4
      zonas:
        - { id: arranques, rotulo: "Las dos gráficas", rect: [0, 0, 325, 130] }
    simular:
      objetivo: I_b
      unidad: A
      tol: 0.03
      rotulo: "Corriente de arranque"
      errores:
        - { expr: "2", texto: "Esa es la de trabajo, con el rotor girando y E casi igual a V. Parado, E = 0." }
    exito: "48 A: parado, E = 0 y solo la limita R. Veinticuatro veces la de 2 A, con 2,4 N·m de par de bloqueo."
    escalera:
      - "Con el rotor parado, ¿cuánto vale E = k·ω?"
    solucion: "24/0,5 = 48 A."
    comprobar:
      - { I_b: 48, T_b: 2.4 }

  - id: explore-arranque
    tipo: explorar
    titulo: "El arranque en directo"
    texto: "En directo, la corriente sube casi a la de bloqueo antes de que el rotor se mueva. Baje la tensión de arranque hasta que el pico no pase de 20 A."
    libro: [47, 48, 49]
    inicio: { V_a: 24 }
    widget:
      tipo: circuito
      esquema: motor-cc
      piezas: { fuente: V_a, r: R_a, l: L_r, k: k_m, j: J_r }
      lectura: { valor: Ip_m, rotulo: "Pico de corriente" }
      corriente: Ip_m
      grafica:
        x: { id: t, min: 0, max: 0.1, unidad: s, rotulo: "t" }
        y: { min: -5, max: 50, unidad: A, rotulo: "i" }
        curvas:
          - { expr: "V_a/L_r/(s1_m - s2_m)*(exp(s1_m*t) - exp(s2_m*t))", color: naranja, rotulo: "i", mide: corriente }
          - { expr: "(w0_m + w0_m*(s2_m*exp(s1_m*t) - s1_m*exp(s2_m*t))/(s1_m - s2_m))/12", color: azul, rotulo: "ω/12", discontinua: true }
      mandos:
        - { valor: V_a, min: 6, max: 24, paso: 1, rotulo: "Tensión del inducido" }
    objetivo:
      condiciones:
        - { valor: Ip_m, max: 20, rotulo: "Pico: {{Ip_m}}" }
      logrado: "Con {{V_a}}, el pico baja a {{Ip_m}}: es proporcional a la tensión. Por eso se arranca con una rampa de tensión o con un lazo de corriente."
      pistas:
        - { texto: "El pico sigue alto: baje la tensión." }
    escalera:
      - "El pico es proporcional a V: 46,96 A con 24 V."
    solucion: "10 V o menos: unos 19,6 A."
    comprobar:
      - { Ip_m: 46.96, tol: 0.002 }
      - { con: { V_a: 10 }, Ip_m: 19.57, tol: 0.005 }

  - id: dibuje-recta
    tipo: dibujar
    titulo: "Dibuje la recta de 24 V"
    texto: "Dibuje la velocidad frente al par, desde el vacío hasta el bloqueo."
    libro: [42]
    fijar: { V_a: 24 }
    dibujar:
      x: { id: tx, min: 0, max: 2.5, unidad: "N·m", rotulo: "T" }
      y: { min: 0, max: 5000, unidad: rpm, rotulo: "n" }
      curva: "max(0, (V_a/k_m - R_a/k_m^2*tx)*60/(2*pi))"
      puntos: 21
      tol: 0.08
      holgura: 0.03
      rotulo: "Velocidad frente al par"
    exito: "Una recta de 4 584 rpm en vacío a cero con 2,4 N·m: cada newton-metro le quita 1 910 rpm."
    pistas:
      - { cuando: { valor: media, mayor: 0.1 }, texto: "La ha dibujado alta: con 2,4 N·m el motor se para." }
      - { texto: "Es una recta: 4 584 rpm en vacío y cero en el par de bloqueo." }
    escalera:
      - "Los dos extremos: ω₀ = V/k en vacío, T_{b} = k·V/R parado."
    solucion: "Recta de 4 584 rpm a 0 N·m hasta 0 rpm a 2,4 N·m."

  - id: por-que-288
    tipo: porque
    titulo: "La potencia máxima"
    texto: "La potencia mecánica es máxima a media velocidad y medio par: 288 W. ¿Por qué no se trabaja ahí?"
    libro: [44]
    widget:
      tipo: grafica
      x: { id: tx, min: 0, max: 2.5, unidad: "N·m", rotulo: "T" }
      y: { min: 0, max: 300, unidad: W, rotulo: "P" }
      curvas:
        - { expr: "max(0, tx*(V_a/k_m - R_a/k_m^2*tx))", color: naranja, rotulo: "potencia en el eje" }
    opciones:
      - texto: "El rendimiento es del 50 % y la corriente doce veces la de 2 A: el cobre se calienta"
        bien: true
        porque: "Solo se aguanta unos instantes; el trabajo continuo está cerca del vacío, limitado por la corriente nominal."
      - texto: "Porque el motor gira demasiado deprisa"
        porque: "Gira a media velocidad; el problema es el calor del cobre."
      - texto: "Porque ahí el par es negativo"
        porque: "El par es la mitad del de bloqueo, positivo."
    escalera:
      - "¿Qué corriente pide medio par de bloqueo?"
    solucion: "Por el calor: 50 % de rendimiento y doce veces la corriente de la fila de 2 A."

  - id: ajuste-2000
    tipo: ajuste
    titulo: "2 000 rpm con 0,25 N·m"
    texto: "La carga pide 0,25 N·m. Baje la tensión del inducido con el PWM del puente hasta que gire a 2 000 rpm."
    libro: [51]
    fijar: { T_l: 0.25 }
    inicio: { V_a: 24 }
    widget:
      tipo: circuito
      esquema: motor-cc
      piezas: { fuente: V_a, r: R_a, l: L_r, k: k_m, j: J_r, carga: T_l }
      corriente: I_m
      mide: { ia: I_m, omega: w_m, par: T_l, fem: E_m }
      lectura: { valor: n_m, rotulo: "Velocidad" }
      datos:
        - { valor: ciclo, rotulo: "Ciclo de trabajo: {{ciclo}}" }
      mandos:
        - { valor: V_a, min: 6, max: 24, paso: 0.5, rotulo: "Tensión del inducido" }
    ajuste:
      valor: n_m
      objetivo: 2000
      tol: 0.01
      rotulo: "Velocidad"
      bajo: "Va despacio: suba la tensión."
      alto: "Va deprisa: baje la tensión."
      dentro: "Unos 13,0 V, el 54,0 % de ciclo: el par sigue disponible, porque lo da la corriente."
    comprobar:
      - { con: { V_a: 13 }, n_m: 2005, ciclo: 54.2, tol: 0.005 }

  - id: estime-rampa
    tipo: simular
    titulo: "Arrancar con una rampa"
    texto: "Rampa de 0 a 24 V en 0,2 s: el rotor acelera a 2 400 rad/s². Con J = 10⁻⁴ kg·m², ¿qué corriente pide?"
    libro: [47]
    widget:
      tipo: figura
      figura: fig-56.4
      zonas:
        - { id: arranques, rotulo: "Las dos gráficas", rect: [0, 0, 325, 130] }
    simular:
      objetivo: I_r
      unidad: A
      tol: 0.03
      rotulo: "Corriente en la rampa"
      errores:
        - { expr: "J_r*a_r", texto: "Ese es el par, J·α = 0,24 N·m. La corriente es T/k." }
    exito: "4,8 A durante toda la rampa, frente a 47 A conectando a pelo."
    escalera:
      - "Par para acelerar: J·α; corriente: T/k."
    solucion: "J·α = 0,24 N·m; 0,24/0,05 = 4,8 A."
    comprobar:
      - { I_r: 4.8 }

  - id: frenado
    tipo: simular
    titulo: "Bajar la tensión de golpe"
    texto: "El motor gira en vacío a 480 rad/s, con E = 24 V, y el puente baja de golpe a 12 V. ¿Qué corriente circula en ese instante?"
    libro: [53]
    fijar: { V_f: 12, w_0: 480 }
    widget:
      tipo: grafica
      x: { id: t, min: 0, max: 0.1, unidad: s, rotulo: "t" }
      y: { min: 0, max: 500, unidad: "rad/s", rotulo: "ω" }
      curvas:
        - { expr: "w_0 + dw_f*(1 + (s2_m*exp(s1_m*t) - s1_m*exp(s2_m*t))/(s1_m - s2_m))", color: azul, rotulo: "ω" }
      lectura: { valor: I_fr, rotulo: "Corriente" }
      ocultar: true
    simular:
      objetivo: I_fr
      unidad: A
      tol: 0.03
      rotulo: "Corriente al bajar a 12 V"
      errores:
        - { expr: "V_f/R_a", texto: "Le falta la fuerza electromotriz: I = (V − E)/R, y E = 24 V supera a los 12 V." }
    exito: "−24 A: la corriente se invierte y frena con −1,2 N·m devolviendo energía. La velocidad baja despacio hacia 240 rad/s."
    escalera:
      - "I = (V − E)/R."
    solucion: "(12 − 24)/0,5 = −24 A."
    comprobar:
      - { I_fr: -24, T_fr: -1.2, wf_f: 240 }

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [41, 42, 47, 51, 52, 54, 36]
    ideas:
      - { titulo: "La recta.", texto: "ω = V/k − R/k²·T: vacío en V/k, bloqueo en k·V/R." }
      - { titulo: "Par y corriente.", texto: "T = k·I: limitar la corriente es limitar el par." }
      - { titulo: "Arranque.", texto: "Parado solo frena R: rampa de tensión o lazo de corriente." }
      - { titulo: "Control.", texto: "Bajar V desplaza la recta; lazo interno de corriente y externo de velocidad. En serie: arranque enorme, se dispara en vacío." }
