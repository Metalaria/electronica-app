# Lección 1.2 de la sección 34.1 «El Circuito Magnético: de la Corriente al Par» (cap56; etiqueta sec-56.1).
# Formato: contenido/lecciones11/GUIA.md.
# - El ejemplo del bloque 6 (30 cm de chapa de µr = 4 000, 10 cm², entrehierro de 1 mm, 1 T, 200 espiras:
#   59,7 y 795,8 kA/Wb, 855 amperios-vuelta, 4,28 A, el 93 % en el aire, 46,8 mH) y la fuerza del bloque 11 (398 N)
#   en una gráfica del modelo frente al entrehierro; la figura 34.1 (fig-56.1) con zonas en su circuito equivalente.
# - No se dibuja con un esquema eléctrico: la analogía cambiaría las unidades (V y Ω por A·v y A/Wb).
# Paso práctico: «simular» (sin circuito) el ejercicio 56.1; el error típico es olvidar el entrehierro (0,127 A).
leccion: cap56/sec-56.1

libro:
  4: "las espiras por la corriente, N·I, la fuerza magnetomotriz, hacen circular un flujo Φ por un camino de reluctancia ℛ"
  5: "su circuito equivalente, dos reluctancias en serie"
  6: "Para un flujo de 1 mWb hacen falta 855 amperios-vuelta, 4,28 A con 200 espiras, y el 93 % de ellos se gastan en cruzar el milímetro de aire"
  7: "Por eso los entrehierros de las máquinas son tan pequeños como permite la mecánica"
  9: "En el ejemplo, 0,398 J en el entrehierro y 0,030 J en el hierro: la energía está en el aire."
  10: 'F = (B^("2") dot.op A)/("2" dot.op µ_("0"))'
  11: "Con 1 T sobre 10 cm² son 398 N, el peso de 40,6 kg, en cada cara"
  13: "sufre una fuerza B·l·I"
  14: "la potencia eléctrica que absorbe la fuerza electromotriz es exactamente la potencia mecánica del eje"
  15: "k = 2 × 100 × 0,5 × 0,04 × 0,0125 = 0,05 V·s/rad: con 5 A da 0,25 N·m, y girando a 480 rad/s genera 24 V"
  "cap56#149": "Sin entrehierro bastarían 0,127 A, siete veces menos."

modelo:
  valores:
    l_fe: { sim: "l", nombre: "longitud media del hierro", unidad: m, valor: 0.3 }
    mu_r: { sim: "µ_{r}", nombre: "permeabilidad relativa de la chapa", unidad: "", valor: 4000 }
    A_n: { sim: "A", nombre: "sección del núcleo", unidad: "m²", valor: 0.001 }
    g_n: { sim: "g", nombre: "entrehierro", unidad: m, valor: 0.001 }
    N_e: { sim: "N", nombre: "espiras", unidad: espiras, valor: 200 }
    B_g: { sim: "B", nombre: "inducción en el entrehierro", unidad: T, valor: 1 }
    N_k: { sim: "N", nombre: "espiras del rotor", unidad: espiras, valor: 100 }
    B_k: { sim: "B", nombre: "campo bajo los polos", unidad: T, valor: 0.5 }
    l_k: { sim: "l", nombre: "longitud de cada lado", unidad: m, valor: 0.04 }
    r_k: { sim: "r", nombre: "radio", unidad: m, valor: 0.0125 }
    I_k: { sim: "I", nombre: "corriente", unidad: A, valor: 5 }
  calculos:
    R_fe: { expr: "l_fe/(4*pi*1e-7*mu_r*A_n)", sim: "ℛ_{fe}", nombre: "reluctancia del hierro", unidad: "A/Wb" }
    R_g: { expr: "g_n/(4*pi*1e-7*A_n)", sim: "ℛ_{g}", nombre: "reluctancia del entrehierro", unidad: "A/Wb" }
    Phi: { expr: "B_g*A_n", sim: "Φ", nombre: "flujo", unidad: Wb }
    NI: { expr: "Phi*(R_fe + R_g)", sim: "N·I", nombre: "fuerza magnetomotriz", unidad: "A·v" }
    I_e: { expr: "NI/N_e", sim: "I", nombre: "corriente de la bobina", unidad: A }
    I_sin: { expr: "Phi*R_fe/N_e", sim: "I", nombre: "corriente sin entrehierro", unidad: A }
    frac: { expr: "100*R_g/(R_fe + R_g)", sim: "aire", nombre: "parte de los amperios-vuelta en el aire", unidad: "%", cifras: 2 }
    L_b: { expr: "N_e^2/(R_fe + R_g)", sim: "L", nombre: "inductancia de la bobina", unidad: H }
    F_c: { expr: "B_g^2*A_n/(2*4*pi*1e-7)", sim: "F", nombre: "fuerza entre las caras", unidad: N }
    E_g: { expr: "Phi^2*R_g/2", sim: "W_{g}", nombre: "energía en el entrehierro", unidad: J }
    E_fe: { expr: "Phi^2*R_fe/2", sim: "W_{fe}", nombre: "energía en el hierro", unidad: J }
    k_m: { expr: "2*N_k*B_k*l_k*r_k", sim: "k", nombre: "constante de la máquina", unidad: "V·s/rad" }
    T_k: { expr: "k_m*I_k", sim: "T", nombre: "par", unidad: "N·m" }

tarjetas:
  - id: explore-entrehierro
    tipo: explorar
    titulo: "Un milímetro de aire"
    texto: "Mueva el entrehierro y la chapa. Mire cuánta corriente pide 1 T en el aire y qué parte se gasta en cruzarlo."
    libro: [4, 6]
    widget:
      tipo: grafica
      x: { id: gx, min: 0, max: 0.002, unidad: m, rotulo: "entrehierro" }
      y: { min: 0, max: 2000, unidad: "A·v", rotulo: "N·I" }
      curvas:
        - { expr: "Phi*(R_fe + gx/(4*pi*1e-7*A_n))", color: naranja, rotulo: "N·I para 1 T" }
        - { expr: "Phi*R_fe", color: tinta, rotulo: "lo del hierro", discontinua: true }
      marcas:
        - { x: "g_n", y: "NI", rotulo: "{{NI}}" }
      lectura: { valor: I_e, rotulo: "Corriente con 200 espiras" }
      datos:
        - { valor: frac, rotulo: "En el aire: {{frac}}" }
      mandos:
        - { valor: g_n, lista: [0.0002, 0.0005, 0.001, 0.002], rotulo: "Entrehierro" }
        - { valor: mu_r, lista: [1000, 4000], rotulo: "µ_{r} de la chapa" }
    requiere: { mover: [g_n] }

  - id: prediga-aire
    tipo: predecir
    titulo: "Dónde se gastan"
    texto: "30 cm de chapa de µr = 4 000 y un entrehierro de 1 mm. ¿Qué parte de los amperios-vuelta se gasta en el aire?"
    libro: [6]
    fijar: { g_n: 0.001, mu_r: 4000 }
    widget:
      tipo: figura
      figura: fig-56.1
      zonas:
        - { id: nucleo, rotulo: "El núcleo", rect: [0, 15, 160, 120] }
    opciones:
      - texto: "Casi todos: el 93 %"
        bien: true
        porque: "La reluctancia del entrehierro es 13,3 veces la del hierro con una longitud trescientas veces menor."
      - texto: "Muy pocos: el aire es trescientas veces más corto"
        porque: "Es más corto, pero su permeabilidad es 4 000 veces menor: pesa mucho más."
      - texto: "La mitad, porque están en serie"
        porque: "En serie el flujo es el mismo; la caída se reparte según las reluctancias."
    escalera:
      - "Compare ℛ = l/(µ₀·µ_{r}·A) del hierro y del aire."
    solucion: "El 93 %: 795,8 frente a 59,7 kA/Wb."
    comprobar:
      - { frac: 93.0, R_fe: 59700, R_g: 795800, NI: 855, I_e: 4.28, tol: 0.003 }

  - id: toque-reluctancia
    tipo: tocar
    titulo: "La reluctancia mayor"
    texto: "En el circuito equivalente, toque la reluctancia que se lleva casi toda la fuerza magnetomotriz."
    libro: [5, 6]
    widget:
      tipo: figura
      figura: fig-56.1
      zonas:
        - { id: fuente, rotulo: "La fuente", rect: [168, 52, 40, 40] }
        - { id: hierro, rotulo: "Resistencia de arriba", rect: [215, 15, 42, 32] }
        - { id: aire, rotulo: "Resistencia de la derecha", rect: [266, 52, 42, 40] }
    tocar:
      bien: [aire]
      porque:
        fuente: "Es la fuerza magnetomotriz N·I, la que se reparte entre las reluctancias."
        hierro: "La del hierro es solo 59,7 kA/Wb: 30 cm de chapa de µr = 4 000."
    exito: "La del entrehierro, 795,8 kA/Wb: la corriente que magnetiza una máquina depende sobre todo del aire."
    escalera:
      - "Una de las dos es de aire."
    solucion: "La de la derecha, la del entrehierro."

  - id: formula-fuerza
    tipo: formula
    titulo: "La fuerza sale de la energía"
    texto: "La energía está en el aire; al cerrarse el entrehierro, baja, y esa diferencia es la fuerza entre las caras."
    libro: [9, 10, 11]
    fijar: { B_g: 1, A_n: 0.001 }
    ec: 10
    sustitucion: "{{B_g}}² · {{A_n}} / (2 · µ₀) = {{F_c}}"
    widget:
      tipo: grafica
      x: { id: bx, min: 0, max: 1.5, unidad: T, rotulo: "B" }
      y: { min: 0, max: 1000, unidad: N, rotulo: "F" }
      curvas:
        - { expr: "bx^2*A_n/(2*4*pi*1e-7)", color: naranja, rotulo: "F" }
      marcas:
        - { x: "B_g", y: "F_c", rotulo: "{{F_c}}" }
      lectura: { valor: F_c, rotulo: "Fuerza en cada cara" }
    comprobar:
      - { F_c: 398, E_g: 0.398, E_fe: 0.030, tol: 0.01 }

  - id: simule-ej
    tipo: simular
    titulo: "Prediga la corriente"
    texto: "Chapa de 20 cm, 4 cm² y µr = 3 000; entrehierro de 0,4 mm; 500 espiras. ¿Qué corriente da 1,2 T en el entrehierro?"
    libro: ["cap56#149"]
    fijar: { l_fe: 0.2, A_n: 0.0004, mu_r: 3000, g_n: 0.0004, N_e: 500, B_g: 1.2 }
    widget:
      tipo: grafica
      x: { id: gx, min: 0, max: 0.0001, unidad: m, rotulo: "entrehierro" }
      y: { min: 0, max: 600, unidad: "A·v", rotulo: "N·I" }
      curvas:
        - { expr: "Phi*(R_fe + gx/(4*pi*1e-7*A_n))", color: naranja, rotulo: "N·I" }
      lectura: { valor: I_e, rotulo: "Corriente" }
      ocultar: true
    simular:
      objetivo: I_e
      unidad: A
      tol: 0.03
      rotulo: "Corriente de la bobina"
      errores:
        - { expr: "I_sin", texto: "Esos 0,127 A bastarían sin entrehierro: ha olvidado su reluctancia, la mayor del circuito." }
    exito: "0,891 A, el 85,7 % de los amperios-vuelta en el aire: siete veces más que sin entrehierro."
    escalera:
      - "Φ = B·A; después, N·I = Φ·(ℛ_{fe} + ℛ_{g})."
    solucion: "Φ = 0,48 mWb y N·I = 445,6 A·v: I = 0,891 A."
    comprobar:
      - { I_e: 0.891, I_sin: 0.127, frac: 85.7, NI: 445.6, Phi: 0.00048, tol: 0.005 }

  - id: por-que-pequeno
    tipo: porque
    titulo: "Entrehierros mínimos"
    texto: "Los entrehierros de las máquinas van de décimas de milímetro a pocos milímetros. ¿Por qué tan pequeños?"
    libro: [7]
    widget:
      tipo: figura
      figura: fig-56.1
      zonas:
        - { id: nucleo, rotulo: "El núcleo", rect: [0, 15, 160, 120] }
    opciones:
      - texto: "La corriente que magnetiza la máquina depende sobre todo de ellos"
        bien: true
        porque: "Cada décima de aire pide muchos más amperios-vuelta que la chapa entera."
      - texto: "Para que el rotor no roce"
        porque: "Eso pide lo contrario, holgura: por eso son tan pequeños como permite la mecánica, no cero."
      - texto: "Para evitar la saturación"
        porque: "La saturación es del hierro, por encima de 1,5 T; el aire no se satura."
    escalera:
      - "¿Qué reluctancia domina la fuerza magnetomotriz?"
    solucion: "Porque la corriente magnetizante depende sobre todo del entrehierro."

  - id: estime-par
    tipo: pregunta
    titulo: "Par y fuerza electromotriz"
    texto: "Rotor de 100 espiras, lados de 4 cm a 12,5 mm del eje, 0,5 T: k = 0,05 V·s/rad. ¿Qué par da con 5 A?"
    libro: [13, 15]
    widget:
      tipo: grafica
      x: { id: ix, min: 0, max: 10, unidad: A, rotulo: "I" }
      y: { min: 0, max: 0.6, unidad: "N·m", rotulo: "T" }
      curvas:
        - { expr: "k_m*ix", color: naranja, rotulo: "T = k·I" }
    estimar:
      objetivo: "T_k"
      unidad: "N·m"
      min: 0
      max: 0.6
      paso: 0.01
      inicio: 0.5
      tol: 0.04
      rotulo: "Par"
    exito: "0,25 N·m. Y la misma k da la tensión: girando a 480 rad/s genera 24 V."
    pistas:
      - { cuando: { valor: estimacion, mayor: 0.26 }, texto: "Se ha pasado: T = k·I = 0,05 × 5." }
      - { texto: "Se ha quedado corto: T = k·I = 0,05 × 5." }
    escalera:
      - "T = k·I."
    solucion: "0,05 × 5 = 0,25 N·m."
    comprobar:
      - { T_k: 0.25, k_m: 0.05 }

  - id: misma-k
    tipo: pregunta
    titulo: "La misma constante"
    texto: "¿Por qué la k del par, T = k·I, es la misma que la de la tensión, E = k·ω?"
    libro: [14]
    widget:
      tipo: grafica
      x: { id: ix, min: 0, max: 10, unidad: A, rotulo: "I" }
      y: { min: 0, max: 0.6, unidad: "N·m", rotulo: "T" }
      curvas:
        - { expr: "k_m*ix", color: naranja, rotulo: "T = k·I" }
    opciones:
      - texto: "Por la conservación de la energía: E·I es la potencia mecánica T·ω"
        bien: true
        porque: "Vale para cualquier máquina en unidades SI, no solo para esta geometría."
      - texto: "Es una coincidencia de esta geometría"
        porque: "El libro insiste en que no lo es: sale de la conservación de la energía."
      - texto: "Porque las dos se miden en voltios"
        porque: "V·s/rad y N·m/A son la misma unidad, pero la razón es la energía."
    escalera:
      - "Multiplique E = k·ω por la corriente."
    solucion: "Por la conservación de la energía: E·I = k·ω·I = T·ω."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [4, 6, 9, 14]
    ideas:
      - { titulo: "Ohm magnética.", texto: "Φ = N·I/ℛ, con las reluctancias en serie." }
      - { titulo: "El aire manda.", texto: "Un milímetro de entrehierro se lleva el 93 % de los amperios-vuelta." }
      - { titulo: "Fuerza.", texto: "Sale de la energía del aire: F = B²·A/(2·µ₀)." }
      - { titulo: "Par y tensión.", texto: "T = k·I y E = k·ω, con la misma k." }
