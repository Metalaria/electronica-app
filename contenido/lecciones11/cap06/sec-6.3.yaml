# Lección 1.1 de la sección 6.3 «Ganancia de Corriente: los Parámetros β y α» (cap06): β = α/(1 − α) sobre la tabla
# del libro (α de 0,980 a 0,9967, β de 49 a 302), I_E = I_C + I_B (ejercicio 6.1), la sorpresa de la polarización
# con resistencia de emisor (β ×6, I_C +15 %: la tabla de la 6.5), las dependencias de β, h_FE frente a h_fe, las
# tres estrategias y la medida en el banco. Formato: contenido/lecciones11/GUIA.md.
leccion: cap06/sec-6.3

libro:
  88: "reparte la corriente de emisor en dos partes"
  89: 'I_("E") = I_("C") + I_("B")'
  90: "β como la relación entre lo que llega y lo que se pierde"
  91: 'β = (α)/("1" - α)'
  94: "α vale siempre entre 0,98 y 0,997"
  95: "0,9967"
  96: "α cambia menos de un 2 % y β cambia seis veces"
  97: "nunca diseñar de modo que el resultado dependa de β"
  99: "todo dato de hFE va acompañado de la corriente a la que se midió"
  100: "β sube aproximadamente un 0,5 % por grado"
  102: "puede ser de 2:1 o 3:1 dentro del mismo lote"
  105: "es decir, la pendiente de la curva"
  106: "usar una por la otra introduce errores del 20 o 30 %"
  109: "β varía un 500 % y la corriente de colector un 15 %"
  110: "entre tres y diez veces la corriente que el β mínimo necesitaría"
  111: "La ganancia del circuito se hace depender de una relación de resistencias"
  112: "poner la precisión donde la hay"
  114: "el β mínimo de la hoja de datos para comprobar que el circuito funciona en el peor caso"
  116: "fija la corriente de base en 8,35 µA"
  "cap06#176": "1,186 mA"
  "cap06#488": "Un transistor tiene β = 150. Si la corriente de base es 30 µA"

modelo:
  valores:
    alpha: { sim: "α", nombre: "fracción de la corriente de emisor que llega al colector", unidad: "", valor: 0.99 }
    beta_e: { sim: "β", nombre: "ganancia del transistor del ejercicio", unidad: "", valor: 150 }
    I_be: { sim: "I_{B}", nombre: "corriente de base del ejercicio", unidad: A, valor: 0.00003 }
    V_cc: { sim: "V_{CC}", nombre: "alimentación", unidad: V, valor: 12 }
    R_p1: { sim: "R₁", nombre: "divisor, arriba", unidad: Ω, valor: 47000 }
    R_p2: { sim: "R₂", nombre: "divisor, abajo", unidad: Ω, valor: 10000 }
    R_pc: { sim: "R_{C}", nombre: "resistencia de colector", unidad: Ω, valor: 3300 }
    R_pe: { sim: "R_{E}", nombre: "resistencia de emisor", unidad: Ω, valor: 1000 }
    beta: { sim: "β", nombre: "ganancia de corriente", unidad: "", valor: 50 }
    V_BE: { sim: "V_{BE}", nombre: "tensión base-emisor", unidad: V, valor: 0.7 }
  calculos:
    beta_a: { expr: "alpha/(1 - alpha)", sim: "β", nombre: "ganancia de corriente", unidad: "", cifras: 3 }
    q_a: { expr: "1 - alpha", sim: "1 − α", nombre: "fracción que se pierde en la base", unidad: "", cifras: 2 }
    pct_b: { expr: "(1 - alpha)*100", sim: "I_{B}/I_{E}", nombre: "corriente de base, en % de la de emisor", unidad: "%", cifras: 2 }
    I_ce: { expr: "beta_e*I_be", sim: "I_{C}", nombre: "corriente de colector del ejercicio", unidad: A }
    I_ee: { expr: "(beta_e + 1)*I_be", sim: "I_{E}", nombre: "corriente de emisor del ejercicio", unidad: A }
    V_pth: { expr: "V_cc*R_p2/(R_p1 + R_p2)", sim: "V_{Th}", nombre: "tensión Thévenin del divisor", unidad: V, cifras: 4 }
    R_pth: { expr: "par(R_p1, R_p2)", sim: "R_{Th}", nombre: "resistencia Thévenin del divisor", unidad: Ω }
    I_pb: { expr: "(V_pth - V_BE)/(R_pth + (beta + 1)*R_pe)", sim: "I_{B}", nombre: "corriente de base", unidad: A }
    I_pc: { expr: "beta*I_pb", sim: "I_{C}", nombre: "corriente de colector", unidad: A, cifras: 4 }
    V_pe: { expr: "(beta + 1)*I_pb*R_pe", sim: "V_{E}", nombre: "tensión de emisor", unidad: V }
    V_pb: { expr: "V_pe + V_BE", sim: "V_{B}", nombre: "tensión de base", unidad: V }
    V_pc: { expr: "V_cc - I_pc*R_pc", sim: "V_{C}", nombre: "tensión de colector", unidad: V }
    V_pce: { expr: "V_pc - V_pe", sim: "V_{CE}", nombre: "tensión colector-emisor", unidad: V }

tarjetas:
  - id: explore-alfa
    tipo: explorar
    titulo: "Una fracción casi igual a uno"
    texto: "α es la fracción de la corriente de emisor que llega al colector: siempre entre 0,98 y 0,997. Muévala y mire β."
    libro: [88, 90, 94]
    widget:
      tipo: grafica
      x: { id: a, min: 0.98, max: 0.997, unidad: "", rotulo: "α" }
      y: { min: 0, max: 350, unidad: "", rotulo: "β" }
      curvas:
        - { expr: "a/(1 - a)", color: azul, rotulo: "β" }
      asas:
        - { mueve: alpha, x: "alpha", y: "beta_a", rotulo: "α" }
      lectura: { valor: beta_a, rotulo: "Ganancia β" }
      datos:
        - { valor: pct_b, rotulo: "Base: {{pct_b}} de I_{E}" }
      mandos:
        - { valor: alpha, min: 0.98, max: 0.997, paso: 0.0001, rotulo: "α" }
    requiere: { mover: [alpha] }

  - id: prediga-seis
    tipo: predecir
    titulo: "Menos de un 2 %"
    texto: "Dos transistores: uno con α = 0,980 y otro con α = 0,9967, menos de un 2 % más. El primero tiene β = 49. ¿Y el segundo?"
    libro: [95, 96]
    fijar: { alpha: 0.9967 }
    widget:
      tipo: grafica
      x: { id: a, min: 0.98, max: 0.997, unidad: "", rotulo: "α" }
      y: { min: 0, max: 350, unidad: "", rotulo: "β" }
      curvas:
        - { expr: "a/(1 - a)", color: azul, rotulo: "β" }
      lectura: { valor: beta_a, rotulo: "Ganancia β" }
      ocultar: true
    opciones:
      - texto: "Unos 302: seis veces más"
        bien: true
        porque: "1 − α pasa de 0,020 a 0,0033, seis veces menos. Como β = α/(1 − α), β crece seis veces."
      - texto: "Unos 50: un 2 % más"
        porque: "Eso valdría para α. β depende de lo que se pierde, 1 − α, y eso sí cambia mucho en proporción."
      - texto: "Se duplica"
        porque: "Se queda corto: 1 − α baja de 0,020 a 0,0033, a la sexta parte, no a la mitad."
    comprobar:
      - { con: { alpha: 0.98 }, beta_a: 49, pct_b: 2, q_a: 0.02 }
      - { beta_a: 302, pct_b: 0.33, q_a: 0.0033 }

  - id: formula-beta
    tipo: formula
    titulo: "Dos formas de contar"
    texto: "α = I_{C}/I_{E} y β = I_{C}/I_{B} cuentan el mismo hecho: la fracción de portadores que sobrevive al cruce de la base."
    nota: "El denominador 1 − α convierte un margen estrechísimo de α en un factor seis de β."
    libro: [90, 91, 94]
    ec: 91
    sustitucion: "{{alpha}} / (1 − {{alpha}}) = {{beta_a}}"
    widget:
      tipo: grafica
      x: { id: a, min: 0.98, max: 0.997, unidad: "", rotulo: "α" }
      y: { min: 0, max: 350, unidad: "", rotulo: "β" }
      curvas:
        - { expr: "a/(1 - a)", color: azul, rotulo: "β" }
      asas:
        - { mueve: alpha, x: "alpha", y: "beta_a", rotulo: "α" }
      lectura: { valor: beta_a, rotulo: "Ganancia β" }
      mandos:
        - { valor: alpha, min: 0.98, max: 0.997, paso: 0.0001, rotulo: "α" }

  - id: estime-emisor
    tipo: pregunta
    fase: "Estime"
    titulo: "La corriente de emisor"
    texto: "Un transistor tiene β = 150 y le entran 30 µA de base. I_{E} = I_{C} + I_{B}. Estime la corriente de emisor."
    libro: [89, "cap06#488"]
    estimar:
      objetivo: "I_ee"
      unidad: A
      min: 0
      max: 0.01
      paso: 0.00001
      inicio: 0.008
      tol: 0.004
      rotulo: "I_{E}"
    exito: "I_{C} = 150 · 30 µA = 4,5 mA, y la base suma sus 30 µA: I_{E} = 4,53 mA, es decir, (β + 1)·I_{B}."
    pistas:
      - { cuando: { valor: estimacion, mayor: 0.00455 }, texto: "Se ha pasado. Calcule I_{C} = β·I_{B} y súmele la corriente de base." }
      - { cuando: { valor: estimacion, menor: 0.00451 }, texto: "Se ha quedado corto. ¿Ha sumado los 30 µA de la base a I_{C} = 4,5 mA?" }
    comprobar:
      - { I_ce: 0.0045, I_ee: 0.00453 }

  - id: sorpresa-re
    tipo: sorpresa
    titulo: "β seis veces mayor"
    texto: "Etapa con divisor de 47 kΩ y 10 kΩ, 1 kΩ de emisor y 12 V. Cambie β de 50 a 300, seis veces más, y mire I_{C}."
    libro: [109, "cap06#176"]
    inicio: { beta: 50 }
    widget:
      tipo: circuito
      esquema: bjt-polarizacion
      piezas: { vcc: V_cc, r1: R_p1, r2: R_p2, rc: R_pc, re: R_pe, beta: beta, vbe: V_BE }
      lectura: { valor: I_pc, rotulo: "I_{C}" }
      datos:
        - { valor: I_pb, rotulo: "I_{B} = {{I_pb}}" }
      corriente: I_pc
      mide: { ib: I_pb, ic: I_pc, vb: V_pb, ve: V_pe, vc: V_pc, vce: V_pce }
      mandos:
        - { valor: beta, lista: [50, 100, 150, 300] }
    requiere: { mover: [beta] }
    comprobar:
      - { con: { beta: 50 }, I_pc: 0.001186 }
      - { con: { beta: 300 }, I_pc: 0.001363 }

  - id: por-que-re
    tipo: porque
    titulo: "¿Por qué apenas cambia?"
    texto: "β varía un 500 % y la corriente de colector solo un 15 %. ¿Qué la sujeta?"
    libro: [109]
    fijar: { beta: 300 }
    widget:
      tipo: circuito
      esquema: bjt-polarizacion
      piezas: { vcc: V_cc, r1: R_p1, r2: R_p2, rc: R_pc, re: R_pe, beta: beta, vbe: V_BE }
      lectura: { valor: I_pc, rotulo: "I_{C}" }
      datos:
        - { valor: V_pe, rotulo: "V_{E} = {{V_pe}}" }
      corriente: I_pc
      mide: { ib: I_pb, ic: I_pc, ve: V_pe }
    opciones:
      - texto: "La resistencia de emisor convierte una tensión de base fija en una corriente fija"
        bien: true
        porque: "Es realimentación local: con la base sujeta por el divisor, la corriente la decide R_{E}, casi sin depender de β."
      - texto: "El divisor fija la corriente de base"
        porque: "Al revés: I_{B} cambia mucho, de unos 24 a 4,5 µA. Lo que se mantiene es I_{C}, por la resistencia de emisor."
      - texto: "Un β mayor consume menos base y se compensa"
        porque: "Sí consume menos base, pero eso no basta: sin R_{E}, I_{C} = β·I_{B} crecería en la misma proporción que β."
    comprobar:
      - { con: { beta: 50 }, I_pb: 0.0000237 }
      - { I_pb: 0.000004544 }

  - id: empareje-estrategias
    tipo: pregunta
    fase: "Empareje"
    titulo: "Tres estrategias, una idea"
    texto: "Nunca diseñar de modo que el resultado dependa de β. Empareje cada uso con su estrategia."
    libro: [97, 109, 110, 111, 112]
    emparejar:
      - ["Polarización", "Realimentación local: la resistencia de emisor"]
      - ["Conmutación", "Sobreexcitación: de tres a diez veces la base que pide el β mínimo"]
      - ["Amplificación", "Realimentación global: la ganancia la fija una relación de resistencias"]
    exito: "Eso es: poner la precisión donde la hay. Las resistencias se fabrican al 1 % o al 0,1 %; los transistores, no."
    pistas:
      - { texto: "En conmutación basta con saturar siempre; en un amplificador la precisión pasa a los componentes pasivos." }

  - id: dependencias
    tipo: pregunta
    titulo: "Más calor, más β"
    texto: "β sube aproximadamente un 0,5 % por grado. ¿Por qué es una mala noticia?"
    libro: [100]
    opciones:
      - texto: "Se suma a la deriva de V_{BE}: las dos suben I_{C} al calentarse"
        bien: true
        porque: "Las dos empujan la corriente de colector hacia arriba con la temperatura, y juntas producen el embalamiento térmico (sección 6.10)."
      - texto: "Al calentarse, el transistor satura"
        porque: "Un poco más de β no lleva por sí solo a saturación. El peligro es que más corriente calienta más."
      - texto: "No lo es: más ganancia siempre ayuda"
        porque: "Un β que cambia con la temperatura mueve el punto de trabajo, y aquí en el sentido que calienta aún más."

  - id: hfe-corriente
    tipo: pregunta
    titulo: "Un dato con su corriente"
    texto: "¿Por qué todo dato de h_{FE} va acompañado de la corriente de colector a la que se midió?"
    libro: [99]
    opciones:
      - texto: "β cae a corrientes muy bajas y muy altas; el dato vale en la meseta intermedia"
        bien: true
        porque: "Abajo, por la recombinación en la superficie y la zona de agotamiento; arriba, por la alta inyección. Usarlo a otra corriente es un error."
      - texto: "Porque β es proporcional a la corriente"
        porque: "No es proporcional: tiene una meseta. Fuera de ella cae por los dos lados."
      - texto: "Para poder calcular la potencia disipada"
        porque: "La potencia sale de I_{C} y V_{CE}. La corriente acompaña al dato porque β cambia con ella."

  - id: empareje-beta
    tipo: pregunta
    fase: "Empareje"
    titulo: "¿Qué β uso?"
    texto: "Hay dos ganancias y dos valores extremos. Empareje cada uno con su uso."
    libro: [105, 106, 114]
    emparejar:
      - ["h_{FE}, I_{C}/I_{B} con valores totales", "Polarización y conmutación"]
      - ["h_{fe}, la pendiente ΔI_{C}/ΔI_{B}", "Pequeña señal"]
      - ["β mínimo de la hoja de datos", "Comprobar que satura y que la base basta"]
      - ["β máximo de la hoja de datos", "Comprobar que la corriente de reposo no se dispara"]
    exito: "Eso es. Confundir h_{FE} con h_{fe} introduce errores del 20 o 30 %; si cumple con los dos extremos, cumple con cualquier ejemplar."
    pistas:
      - { texto: "Mayúsculas, valores totales; minúsculas, variaciones. El peor caso de cada comprobación decide qué extremo usar." }

  - id: banco-beta
    tipo: pregunta
    titulo: "Medir β en el banco"
    texto: "Montaje del banco: 1 MΩ de base y 1 kΩ de colector desde 9 V, que fija la base en 8,35 µA. ¿Cómo se obtiene β?"
    libro: [116]
    opciones:
      - texto: "La caída en la resistencia de colector, entre 1 kΩ, y luego entre 8,35 µA"
        bien: true
        porque: "La caída entre 1 kΩ es I_{C}, y dividida por la corriente de base fija da β directamente."
      - texto: "La caída en la resistencia de base, entre 1 MΩ"
        porque: "Eso da la corriente de base, que el montaje ya fija en 8,35 µA. Falta la de colector."
      - texto: "Midiendo V_{BE} con el multímetro"
        porque: "V_{BE} apenas cambia de un ejemplar a otro: no dice nada de β. Lo que lo dice es la corriente de colector."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [91, 96, 102, 109, 112]
    comprobar:
      - { con: { alpha: 0.9967 }, beta_a: 302 }
    ideas:
      - { titulo: "β = α/(1 − α).", texto: "Dos formas de contar la fracción que cruza la base; I_{E} = I_{C} + I_{B}." }
      - { titulo: "β dispersa.", texto: "α cambia menos de un 2 % y β seis veces: de 49 a 302." }
      - { titulo: "No depender de β.", texto: "Con resistencia de emisor, β varía un 500 % e I_{C} un 15 %." }
      - { titulo: "Precisión donde la hay.", texto: "Realimentación local, sobreexcitación o realimentación global: la exactitud la ponen las resistencias." }
