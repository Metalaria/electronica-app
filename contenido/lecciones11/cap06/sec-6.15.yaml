# Lección 1.1 de la sección 6.15 «Problemas de Diseño» (cap06): 6.A, la etapa que no depende del transistor (12 V,
# 47 kΩ, 10 kΩ, 1 kΩ, 3,3 kΩ: I_C de 1,186 a 1,363 mA, +14,9 %; +4,3 % en 30 °C; el criterio R_Th y V_E), con el
# ejercicio 6.2 (9 V: 1,88 mA aproximado, 1,72 mA con β = 100); 6.B, el espejo y sus dos errores (3,85 % con β = 50;
# 1 mV, 3,9 %; 5 mV, 21,3 %), con el esquema «espejo» (referencia de 1 mA desde 12 V: R_ref = 11,3 kΩ y la carga
# de 4,7 kΩ son mías); 6.C, el interruptor de 500 mA (50 mA de base frente a 20 mA del pin; 100 mW de conducción
# frente a 120 mW de conmutación a 20 kHz). Formato: contenido/lecciones11/GUIA.md.
leccion: cap06/sec-6.15

libro:
  435: "cuyo punto de trabajo no dependa apreciablemente de β"
  438: "Esa es la razón real de que esta topología sea la buena, no el divisor en sí."
  440: 'I_("B") = (V_("Th") - V_("BE"))'
  443: '"47 kΩ"'
  444: '"2,105 V"'
  446: "1,186 mA"
  447: "La corriente varía solo un 14,9 % mientras β varía un 500 %."
  448: "En 30 °C son 60 mV sobre los 1,405 V de VTh − VBE"
  449: "RTh no mayor que una quinta parte de (βmin+1)·RE, y mejor una décima"
  460: '"error" approx ("2")/(β + "2")'
  462: '(I_("2"))/(I_("1"))'
  464: "3,85 %"
  465: "21,3 %"
  466: "un solo milivoltio de diferencia entre las dos uniones produce casi un 4 % de error, tanto como toda la corriente de base con β = 50"
  467: "el error de 5 mV se reduce a un 4 %"
  473: "Un microcontrolador debe encender una carga de 24 Ω alimentada a 12 V mediante un transistor bipolar. El pin del microcontrolador entrega como mucho 20 mA."
  476: "Se diseña con una β forzada de 10"
  477: '"50 mA"'
  478: "Hay tres salidas"
  481: '"100 mW"'
  483: "120 mW"
  484: "A 20 kHz las pérdidas de conmutación ya superan a las de conducción"
  488: "En un circuito de polarización por divisor, VCC = 9 V, R₁ = 22 kΩ, R₂ = 4,7 kΩ, RE = 470 Ω, RC = 2,2 kΩ."

modelo:
  valores:
    V_cc: { sim: "V_{CC}", nombre: "alimentación", unidad: V, valor: 12 }
    R_p1: { sim: "R₁", nombre: "divisor, arriba", unidad: Ω, valor: 47000 }
    R_p2: { sim: "R₂", nombre: "divisor, abajo", unidad: Ω, valor: 10000 }
    R_pc: { sim: "R_{C}", nombre: "resistencia de colector", unidad: Ω, valor: 3300 }
    R_pe: { sim: "R_{E}", nombre: "resistencia de emisor", unidad: Ω, valor: 1000 }
    beta: { sim: "β", nombre: "ganancia de corriente", unidad: "", valor: 50 }
    V_BE: { sim: "V_{BE}", nombre: "tensión base-emisor", unidad: V, valor: 0.7 }
    dVb: { sim: "ΔV_{BE}", nombre: "deriva de V_BE en 30 °C", unidad: V, valor: 0.06 }
    V_c9: { sim: "V_{CC}", nombre: "alimentación del ejercicio", unidad: V, valor: 9 }
    R_q1: { sim: "R₁", nombre: "divisor del ejercicio, arriba", unidad: Ω, valor: 22000 }
    R_q2: { sim: "R₂", nombre: "divisor del ejercicio, abajo", unidad: Ω, valor: 4700 }
    R_qc: { sim: "R_{C}", nombre: "colector del ejercicio", unidad: Ω, valor: 2200 }
    R_qe: { sim: "R_{E}", nombre: "emisor del ejercicio", unidad: Ω, valor: 470 }
    beta_q: { sim: "β", nombre: "β del ejercicio", unidad: "", valor: 100 }
    V_ec: { sim: "V_{CC}", nombre: "alimentación del espejo", unidad: V, valor: 12 }
    R_er: { sim: "R_{ref}", nombre: "resistencia de referencia", unidad: Ω, valor: 11300 }
    R_el: { sim: "R_{L}", nombre: "carga del espejo", unidad: Ω, valor: 4700 }
    beta_m: { sim: "β", nombre: "β de los transistores del espejo", unidad: "", valor: 300 }
    dV_e: { sim: "ΔV_{BE}", nombre: "desapareamiento", unidad: V, valor: 0 }
    V_Te: { sim: "V_{T}", nombre: "tensión térmica", unidad: V, valor: 0.02585 }
    V_L: { sim: "V", nombre: "alimentación de la carga", unidad: V, valor: 12 }
    R_L: { sim: "R_{carga}", nombre: "carga", unidad: Ω, valor: 24 }
    b_f: { sim: "β_{forzada}", nombre: "β forzada", unidad: "", valor: 10 }
    I_pin: { sim: "I_{pin}", nombre: "corriente máxima del pin", unidad: A, valor: 0.02 }
    V_sat: { sim: "V_{CE(sat)}", nombre: "tensión de saturación", unidad: V, valor: 0.2 }
    t_sw: { sim: "t_{conm}", nombre: "tiempo de conmutación", unidad: s, valor: 0.000001 }
    f_s: { sim: "f", nombre: "frecuencia de conmutación", unidad: Hz, valor: 20000 }
  calculos:
    V_pth: { expr: "V_cc*R_p2/(R_p1 + R_p2)", sim: "V_{Th}", nombre: "tensión Thévenin del divisor", unidad: V, cifras: 4 }
    R_pth: { expr: "par(R_p1, R_p2)", sim: "R_{Th}", nombre: "resistencia Thévenin del divisor", unidad: Ω, cifras: 4 }
    I_pb: { expr: "(V_pth - V_BE)/(R_pth + (beta + 1)*R_pe)", sim: "I_{B}", nombre: "corriente de base", unidad: A }
    I_pc: { expr: "beta*I_pb", sim: "I_{C}", nombre: "corriente de colector", unidad: A, cifras: 4 }
    V_pe: { expr: "(beta + 1)*I_pb*R_pe", sim: "V_{E}", nombre: "tensión de emisor", unidad: V }
    V_pb: { expr: "V_pe + V_BE", sim: "V_{B}", nombre: "tensión de base", unidad: V }
    V_pc: { expr: "V_cc - I_pc*R_pc", sim: "V_{C}", nombre: "tensión de colector", unidad: V }
    V_pce: { expr: "V_pc - V_pe", sim: "V_{CE}", nombre: "tensión colector-emisor", unidad: V }
    R_beq: { expr: "(beta + 1)*R_pe", sim: "(β_{mín} + 1)·R_{E}", nombre: "resistencia de emisor vista desde la base", unidad: Ω }
    der: { expr: "dVb/(V_pth - V_BE)*100", sim: "ΔI_{C}", nombre: "aumento de I_C por la deriva", unidad: "%", cifras: 2 }
    V_qth: { expr: "V_c9*R_q2/(R_q1 + R_q2)", sim: "V_{B}", nombre: "tensión de base en vacío", unidad: V, cifras: 4 }
    R_qth: { expr: "par(R_q1, R_q2)", sim: "R_{Th}", nombre: "resistencia Thévenin del ejercicio", unidad: Ω }
    I_apx: { expr: "(V_qth - V_BE)/R_qe", sim: "I_{C}", nombre: "corriente de colector aproximada", unidad: A }
    I_qb: { expr: "(V_qth - V_BE)/(R_qth + (beta_q + 1)*R_qe)", sim: "I_{B}", nombre: "corriente de base del ejercicio", unidad: A }
    I_qc: { expr: "beta_q*I_qb", sim: "I_{C}", nombre: "corriente de colector del ejercicio", unidad: A }
    V_qe: { expr: "(beta_q + 1)*I_qb*R_qe", sim: "V_{E}", nombre: "tensión de emisor del ejercicio", unidad: V }
    V_qb: { expr: "V_qe + V_BE", sim: "V_{B}", nombre: "tensión de base del ejercicio", unidad: V }
    V_qc: { expr: "V_c9 - I_qc*R_qc", sim: "V_{C}", nombre: "tensión de colector del ejercicio", unidad: V }
    V_qce: { expr: "V_qc - V_qe", sim: "V_{CE}", nombre: "tensión colector-emisor del ejercicio", unidad: V }
    I_er: { expr: "(V_ec - V_BE)/R_er", sim: "I_{ref}", nombre: "corriente de referencia", unidad: A, cifras: 4 }
    I_ec1: { expr: "I_er/(1 + (1 + exp(dV_e/V_Te))/beta_m)", sim: "I_{C1}", nombre: "corriente de colector de Q₁", unidad: A, cifras: 4 }
    I_eo: { expr: "I_ec1*exp(dV_e/V_Te)", sim: "I_{salida}", nombre: "corriente copiada", unidad: A, cifras: 4 }
    V_eo: { expr: "V_ec - I_eo*R_el", sim: "V_{C2}", nombre: "tensión de colector de Q₂", unidad: V }
    e_d: { expr: "(exp(dV_e/V_Te) - 1)*100", sim: "error", nombre: "error por desapareamiento", unidad: "%", cifras: 3 }
    e_b: { expr: "2/(beta_m + 2)*100", sim: "error", nombre: "error por corriente de base", unidad: "%", cifras: 3 }
    I_LC: { expr: "V_L/R_L", sim: "I_{C}", nombre: "corriente de la carga", unidad: A }
    I_bC: { expr: "I_LC/b_f", sim: "I_{B}", nombre: "corriente de base necesaria", unidad: A }
    P_c: { expr: "V_sat*I_LC", sim: "P_{conducción}", nombre: "disipación en conducción", unidad: W }
    P_sw: { expr: "V_L*I_LC*t_sw*f_s", sim: "P_{conm}", nombre: "pérdidas de conmutación", unidad: W }

tarjetas:
  - id: explore-6a
    tipo: explorar
    titulo: "6.A: una etapa que no dependa del transistor"
    texto: "Etapa del problema: 12 V, divisor de 47 kΩ y 10 kΩ, 3,3 kΩ de colector y 1 kΩ de emisor. Cambie el transistor, cuyo β va de 50 a 300."
    libro: [435, 438, 443]
    widget:
      tipo: circuito
      esquema: bjt-polarizacion
      piezas: { vcc: V_cc, r1: R_p1, r2: R_p2, rc: R_pc, re: R_pe, beta: beta, vbe: V_BE }
      lectura: { valor: I_pc, rotulo: "I_{C}" }
      datos:
        - { valor: V_pce, rotulo: "V_{CE} = {{V_pce}}" }
        - { valor: V_pe, rotulo: "V_{E} = {{V_pe}}" }
      corriente: I_pc
      mide: { ib: I_pb, ic: I_pc, vb: V_pb, ve: V_pe, vc: V_pc, vce: V_pce }
      mandos:
        - { valor: beta, lista: [50, 150, 300], rotulo: "β del ejemplar" }
    requiere: { mover: [beta] }

  - id: prediga-6a
    tipo: predecir
    titulo: "6.A: ¿cuánto varía?"
    texto: "Etapa a 12 V con divisor de 47 kΩ y 10 kΩ, 3,3 kΩ de colector y 1 kΩ de emisor: con β = 50, I_{C} = 1,186 mA. ¿Cuánto sube con β = 300?"
    libro: [446, 447]
    fijar: { beta: 300 }
    widget:
      tipo: circuito
      esquema: bjt-polarizacion
      piezas: { vcc: V_cc, r1: R_p1, r2: R_p2, rc: R_pc, re: R_pe, beta: beta, vbe: V_BE }
      lectura: { valor: I_pc, rotulo: "I_{C}" }
      corriente: I_pc
      mide: { ib: I_pb, ic: I_pc, vb: V_pb, ve: V_pe, vc: V_pc, vce: V_pce }
      ocultar: true
    opciones:
      - texto: "Un 14,9 %, hasta 1,363 mA"
        bien: true
        porque: "La realimentación de R_{E} absorbe la dispersión del transistor: β varía un 500 % y la corriente un 14,9 %."
      - texto: "Un 500 %, como β"
        porque: "Eso pasaría sin R_{E}: I_{C} sería proporcional a β."
      - texto: "Nada"
        porque: "Casi, pero la corriente de base aún pesa algo: R_{Th} no es despreciable del todo frente a (β + 1)·R_{E}."
    comprobar:
      - { con: { beta: 50 }, I_pc: 0.001186 }
      - { I_pc: 0.001363 }
    escalera:
      - "La realimentación de R_{E} absorbe casi toda la dispersión de β."
    solucion: "Un 14,9 %, hasta 1,363 mA, mientras β varía un 500 %."

  - id: formula-6a
    tipo: formula
    titulo: "6.A: la malla de entrada"
    texto: "La corriente de base, con el Thévenin del divisor: V_{Th} = 2,105 V y R_{Th} = 8,246 kΩ."
    nota: "Válida si R_{Th} ≪ (β + 1)·R_{E}."
    libro: [440, 444]
    ec: 440
    sustitucion: "({{V_pth}} − {{V_BE}}) / ({{R_pth}} + ({{beta}} + 1) · {{R_pe}}) = {{I_pb}}"
    widget:
      tipo: circuito
      esquema: bjt-polarizacion
      piezas: { vcc: V_cc, r1: R_p1, r2: R_p2, rc: R_pc, re: R_pe, beta: beta, vbe: V_BE }
      lectura: { valor: I_pc, rotulo: "I_{C}" }
      datos:
        - { valor: I_pb, rotulo: "I_{B} = {{I_pb}}" }
      corriente: I_pc
      mide: { ib: I_pb, ic: I_pc, vb: V_pb, ve: V_pe, vc: V_pc, vce: V_pce }
      mandos:
        - { valor: beta, lista: [50, 150, 300], rotulo: "β del ejemplar" }
    comprobar:
      - { V_pth: 2.105, R_pth: 8246 }

  - id: estime-deriva
    tipo: pregunta
    fase: "Estime"
    titulo: "6.A: la deriva térmica"
    texto: "En la etapa del problema 6.A quedan 1,405 V entre V_{Th} y V_{BE}, y en 30 °C V_{BE} deriva 60 mV que se restan de ahí. Estime cuánto sube I_{C}."
    libro: [448]
    estimar:
      objetivo: "der"
      unidad: "%"
      min: 0
      max: 20
      paso: 0.1
      inicio: 10
      tol: 0.06
      rotulo: "Aumento de I_{C}"
    exito: "60 mV sobre 1,405 V: un 4,3 %. Comparable a la dispersión de β y en la misma dirección: los dos empujan la corriente hacia arriba."
    pistas:
      - { cuando: { valor: estimacion, mayor: 4.6 }, texto: "Se ha pasado. Divida 60 mV entre 1,405 V." }
      - { texto: "Se ha quedado corto. 60 mV es algo más del 4 % de 1,405 V." }
    comprobar:
      - { der: 4.27, V_pth: 2.105 }
    escalera:
      - "Divida 60 mV entre 1,405 V."
    solucion: "60 mV sobre 1,405 V: un 4,3 %."

  - id: criterio-6a
    tipo: pregunta
    titulo: "6.A: el criterio de diseño"
    texto: "Criterio: R_{Th} hasta una quinta parte de (β_{mín} + 1)·R_{E}, mejor una décima, y V_{E} de al menos 1 V. ¿Lo cumple la etapa de 47 kΩ, 10 kΩ y 1 kΩ con β_{mín} = 50?"
    libro: [449]
    fijar: { beta: 50 }
    widget:
      tipo: circuito
      esquema: bjt-polarizacion
      piezas: { vcc: V_cc, r1: R_p1, r2: R_p2, rc: R_pc, re: R_pe, beta: beta, vbe: V_BE }
      lectura: { valor: R_beq, rotulo: "(β_{mín} + 1)·R_{E}" }
      datos:
        - { valor: R_pth, rotulo: "R_{Th} = {{R_pth}}" }
        - { valor: V_pe, rotulo: "V_{E} = {{V_pe}}" }
      corriente: I_pc
      mide: { ib: I_pb, ic: I_pc, ve: V_pe }
    opciones:
      - texto: "Sí: 8,2 kΩ frente a 51 kΩ, una sexta parte, y V_{E} de unos 1,2 V"
        bien: true
        porque: "Cumple la quinta parte, aunque no la décima, y la deriva de 60 mV es una fracción pequeña de V_{E}."
      - texto: "No: R_{Th} tendría que ser una décima parte"
        porque: "La décima es lo mejor; el criterio pide al menos la quinta, y una sexta la cumple."
      - texto: "No: V_{E} es menor de 1 V"
        porque: "V_{E} pasa de 1 V con cualquier β entre 50 y 300."
    comprobar:
      - { R_beq: 51000, R_pth: 8246, V_pe: 1.21 }
    escalera:
      - "Compare R_{Th} = 8,2 kΩ con (50 + 1) × 1 kΩ, y mire V_{E}."
    solucion: "Sí: 8,2 kΩ frente a 51 kΩ, una sexta parte, y V_{E} de unos 1,2 V."

  - id: estime-ej62
    tipo: pregunta
    fase: "Estime"
    titulo: "Un divisor a 9 V: la cuenta rápida"
    texto: "Divisor de 22 kΩ y 4,7 kΩ desde 9 V, con 470 Ω de emisor: despreciando la base, V_{B} = 1,584 V y V_{E} = V_{B} − 0,7. Estime I_{C} ≈ V_{E}/R_{E}."
    libro: [488]
    estimar:
      objetivo: "I_apx"
      unidad: A
      min: 0
      max: 0.005
      paso: 0.00001
      inicio: 0.0034
      tol: 0.02
      rotulo: "I_{C} aproximada"
    exito: "0,884 V entre 470 Ω: 1,88 mA. Con β = 100, R_{Th} = 3,9 kΩ ya pesa frente a 47 kΩ: I_{C} baja a 1,72 mA. Buena al 10 %."
    pistas:
      - { cuando: { valor: estimacion, mayor: 0.00192 }, texto: "Se ha pasado. ¿Ha restado los 0,7 V? V_{E} = 0,884 V." }
      - { texto: "Se ha quedado corto. Divida 0,884 V entre 470 Ω." }
    comprobar:
      - { V_qth: 1.584, I_apx: 0.00188, I_qc: 0.00172, R_qth: 3873 }
    escalera:
      - "V_{E} = 1,584 − 0,7 = 0,884 V; divídala entre 470 Ω."
    solucion: "0,884 V / 470 Ω = 1,88 mA."

  - id: sorpresa-6b
    tipo: sorpresa
    titulo: "6.B: un milivoltio"
    texto: "Espejo de corriente de 1 mA con transistores de β = 300: el error de base es pequeño. Ahora haga que Q₂ reciba 1 mV o 5 mV más de V_{BE}."
    libro: [462, 465, 466]
    inicio: { dV_e: 0 }
    widget:
      tipo: circuito
      esquema: espejo
      piezas: { vcc: V_ec, rref: R_er, carga: R_el, beta: beta_m, vbe: V_BE, dvbe: dV_e }
      lectura: { valor: e_d, rotulo: "Q₂ frente a Q₁" }
      datos:
        - { valor: I_eo, rotulo: "Copiada: {{I_eo}}" }
        - { valor: e_b, rotulo: "Error de base: {{e_b}}" }
      corriente: I_er
      mide: { iref: I_er, iout: I_eo, vout: V_eo, vbe: V_BE }
      mandos:
        - { valor: dV_e, lista: [0, 0.001, 0.005], rotulo: "Desapareamiento, ΔV_{BE}" }
    requiere: { mover: [dV_e] }
    comprobar:
      - { con: { dV_e: 0.001 }, e_d: 3.944 }
      - { con: { dV_e: 0.005 }, e_d: 21.34 }
      - { e_b: 0.66 }

  - id: por-que-6b
    tipo: porque
    titulo: "6.B: ¿qué se concluye?"
    texto: "En un espejo, 1 mV de desapareamiento da casi un 4 % de error, tanto como toda la corriente de base con β = 50. ¿Qué se concluye?"
    libro: [460, 464, 466, 467]
    opciones:
      - texto: "Que no se hace con transistores sueltos: pareja apareada en el mismo encapsulado, que comparte proceso y temperatura"
        bien: true
        porque: "Y si hace falta más, degeneración: con 100 mV en las resistencias de emisor, los 5 mV dejan un 4 %."
      - texto: "Que hay que usar transistores de β alto"
        porque: "Eso arregla el error de base, 3,85 % con β = 50. El de desapareamiento no depende de β."
      - texto: "Que hay que subir la corriente de referencia"
        porque: "El error de desapareamiento es e^{ΔV/V_{T}} − 1: no depende de la corriente."
    inicio: { dV_e: 0.001 }
    widget:
      tipo: circuito
      esquema: espejo
      piezas: { vcc: V_ec, rref: R_er, carga: R_el, beta: beta_m, vbe: V_BE, dvbe: dV_e }
      lectura: { valor: e_d, rotulo: "Q₂ frente a Q₁" }
      corriente: I_er
      mide: { iref: I_er, iout: I_eo, vout: V_eo, vbe: V_BE }
      mandos:
        - { valor: dV_e, lista: [0, 0.001, 0.005], rotulo: "Desapareamiento, ΔV_{BE}" }
    escalera:
      - "El error no depende de β ni de la corriente, sino de la diferencia entre las dos uniones."
    solucion: "Pareja apareada en el mismo encapsulado, que comparte proceso y temperatura, y si hace falta, degeneración."

  - id: estime-6c
    tipo: pregunta
    fase: "Estime"
    titulo: "6.C: la base del interruptor"
    texto: "Un microcontrolador enciende con un bipolar una carga de 24 Ω a 12 V, diseñado con β forzada de 10. Estime la corriente de base necesaria."
    libro: [473, 476, 477]
    estimar:
      objetivo: "I_bC"
      unidad: A
      min: 0
      max: 0.1
      paso: 0.001
      inicio: 0.005
      tol: 0.04
      rotulo: "I_{B} necesaria"
    exito: "12 V entre 24 Ω: 500 mA; entre 10, 50 mA. Y el pin da como mucho 20 mA: ese es el resultado del análisis, no un detalle."
    pistas:
      - { cuando: { valor: estimacion, mayor: 0.052 }, texto: "Se ha pasado. I_{C} = 12 V / 24 Ω, y la base es la décima parte." }
      - { texto: "Se ha quedado corto. Con β forzada de 10, la base lleva la décima parte de los 500 mA." }
    comprobar:
      - { I_LC: 0.5, I_bC: 0.05, I_pin: 0.02 }
    escalera:
      - "I_{C} = 12 V / 24 Ω, y la base lleva la décima parte."
    solucion: "500 mA / 10 = 50 mA, y el pin da como mucho 20 mA."

  - id: salidas-6c
    tipo: pregunta
    titulo: "6.C: el pin no da"
    texto: "Un interruptor bipolar para 500 mA pide 50 mA de base y el pin del microcontrolador da 20 mA. ¿Cuál de estas no es una de las tres salidas del libro?"
    libro: [478]
    opciones:
      - texto: "Bajar la β forzada a 2 para que baste el pin"
        bien: true
        porque: "No es una de ellas: con tan poca sobreexcitación no se garantiza la saturación, y en activa disipa diez veces más."
      - texto: "Un MOSFET, gobernado por tensión"
        porque: "Sí es una: no consume corriente de puerta. Es la solución del libro."
      - texto: "Un Darlington, con 0,8 a 1 V de caída"
        porque: "Sí es una: multiplica la ganancia, a costa de más caída en saturación que los 0,2 V."
    widget:
      tipo: figura
      figura: fig-6.16
      zonas:
        - { id: interruptor, rotulo: "Un interruptor bipolar completo", rect: [0, 0, 440, 259] }
    escalera:
      - "Con poca sobreexcitación, ¿se garantiza la saturación con el β mínimo?"
    solucion: "Bajar la β forzada a 2 no es una de las salidas: no garantiza que sature."

  - id: frecuencia-6c
    tipo: pregunta
    titulo: "6.C: hasta qué frecuencia"
    texto: "El interruptor de 500 mA a 12 V disipa 100 mW en conducción y, con flancos de 1 µs, 120 mW de conmutación a 20 kHz. ¿Qué significa?"
    libro: [481, 483, 484]
    opciones:
      - texto: "Que es el límite práctico: por encima, mandan las pérdidas de conmutación"
        bien: true
        porque: "A 20 kHz ya superan a las de conducción. Un bipolar saturado es lento al apagar: para más velocidad, MOSFET."
      - texto: "Que hay que subir la corriente de base"
        porque: "Más base satura mejor pero apaga peor: más carga almacenada, flancos más lentos."
      - texto: "Que el transistor no está saturado"
        porque: "Los 100 mW son los de saturación, 0,2 V por 0,5 A. Lo que crece con la frecuencia son los flancos."
    comprobar:
      - { P_c: 0.1, P_sw: 0.12 }
    widget:
      tipo: figura
      figura: fig-6.15
      zonas:
        - { id: transiciones, rotulo: "La disipación se concentra en las transiciones", rect: [0, 0, 441, 236] }
    escalera:
      - "Las de conmutación crecen con la frecuencia; las de conducción, no. ¿Cuáles mandan a 20 kHz?"
    solucion: "Ya mandan las de conmutación: es el límite práctico del bipolar saturado."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [447, 466, 477, 484]
    ideas:
      - { titulo: "6.A.", texto: "Con divisor y R_{E}, β varía un 500 % e I_{C} un 14,9 %; 30 °C suman un 4,3 %." }
      - { titulo: "6.B.", texto: "Un espejo yerra 2/(β + 2) por la base y casi un 4 % por cada milivoltio de desapareamiento." }
      - { titulo: "6.C.", texto: "500 mA con β forzada de 10 piden 50 mA de base: el pin no da. MOSFET." }
      - { titulo: "Límite.", texto: "A 20 kHz la conmutación ya supera a la conducción: decenas de kilohercios." }
