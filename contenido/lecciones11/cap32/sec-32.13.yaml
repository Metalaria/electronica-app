# Lección 1.2 de la sección 32.13 «Precompliance de EMC: Medir Emisiones en el Banco» (cap32). Formato: GUIA.md.
# El espectro de la estimación es un dibujo de ejemplo: picos a múltiplos de un reloj de 8 MHz que bajan con el orden
# del armónico; no se escribe ningún número suyo en las tarjetas. Zonas de la figura 32.16 (fig-32.15, 450,72 × 256,32).
# 1.2.1 (autor121-ana, «aprender haciendo», GUIA §13): la sonda se gira hasta el máximo (qué bucle), el equipo se pasa
# a pilas hasta que desaparece el pico conducido, la fundamental del reloj se marca en el peine y el cargador se cambia
# por una fuente lineal (objetivos; espectros, ángulo y picos de ejemplo). Las dos ordenaciones y los límites pasan al
# resumen. Quedan el emparejamiento de firmas y una pregunta de opciones (la comparación repetible): 67 %, porque la
# sección es de procedimiento e interpretación.
# 1.3 (contenido13): + leer en dos capturas los 10 dB que quitan unos flancos más lentos (bloque 428; espectros de
# ejemplo): 4/6 → 5/7.
leccion: cap32/sec-32.13

libro:
  402: "localizar la fuente y comparar antes y después de un cambio"
  404: "Detecta campo magnético, que es lo que producen los bucles de corriente"
  405: "Detecta nodos de tensión con flancos rápidos"
  411: "Capturar el espectro de fondo con el equipo apagado"
  412: "no solo dónde, sino qué bucle"
  414: "La separación identifica cuál"
  415: "Picos que se mueven con la carga"
  416: "Un peine denso de rayas separadas kilohercios"
  417: "Un pico ancho e inestable: oscilación parásita"
  418: "quitar el cable de alimentación —pasar a pilas— y ver qué desaparece"
  425: "la diferencia en decibelios entre dos capturas es un número fiable aunque el nivel absoluto no lo sea"
  428: "bajar de 10 a 2 V/ns puede quitar 10 dB en los armónicos altos"
  432: "La sonda de campo cercano no predice el campo lejano"
  434: "No cubre la inmunidad"
  438: "comparando con una fuente lineal en el mismo montaje, el espectro aparece limpio"

modelo:
  valores:
    f_k: { sim: "f_{reloj}", nombre: "reloj de ejemplo", unidad: Hz, valor: 8000000 }
    t_s: { sim: "θ", nombre: "giro de la sonda respecto al bucle", unidad: "°", valor: 90 }
    s_p: { tipo: interruptor, nombre: "equipo a pilas", valor: 0 }
    f_q: { sim: "f", nombre: "pico conducido de ejemplo", unidad: Hz, valor: 3000000 }
    s_l: { tipo: interruptor, nombre: "fuente lineal en lugar del cargador", valor: 0 }
    d_f: { sim: "Δ", nombre: "lo que bajan los armónicos altos con flancos más lentos", unidad: dB, valor: 10 }
  calculos:
    a_s: { expr: "abs(cos(t_s*pi/180))", sim: "|cos θ|", nombre: "señal captada, relativa", unidad: "" }

tarjetas:
  - id: explore-procedimiento
    tipo: explorar
    titulo: "Qué bucle"
    texto: "Sobre el pico de la placa, la sonda de lazo capta según cómo la atraviese el campo del bucle. Gírela hasta captar el máximo."
    nota: "Respuesta de ejemplo de una sonda de lazo."
    libro: [404, 405, 411, 412]
    inicio: { t_s: 90 }
    widget:
      tipo: grafica
      x: { id: tt, min: 0, max: 180, unidad: "°", rotulo: "giro de la sonda" }
      y: { min: 0, max: 1.1, unidad: "", rotulo: "señal captada, relativa" }
      curvas:
        - { expr: "abs(cos(tt*pi/180))", color: azul, rotulo: "señal" }
      marcas:
        - { x: "t_s", y: "a_s", rotulo: "{{a_s}}" }
      lectura: { valor: a_s, rotulo: "Señal captada" }
      mandos:
        - { valor: t_s, min: 0, max: 180, paso: 15, rotulo: "Giro de la sonda" }
    objetivo:
      condiciones:
        - { valor: a_s, min: 0.99, rotulo: "Señal: {{a_s}}" }
      logrado: "El máximo indica la dirección del bucle: no solo dónde, sino qué bucle. Es lo que la sonda de lazo aporta y ninguna otra medida."
      pistas:
        - { texto: "Siga girando: el máximo está con el plano de la sonda alineado con el bucle." }
    escalera:
      - "La sonda capta el campo magnético que atraviesa su lazo."
    solucion: "0° o 180°: alineada con el bucle."
    comprobar:
      - { con: { t_s: 0 }, a_s: 1 }
      - { con: { t_s: 180 }, a_s: 1 }

  - id: estime-reloj
    tipo: marcar
    titulo: "Picos regularmente espaciados"
    texto: "El espectro de su equipo muestra picos a múltiplos de una frecuencia. Marque la fundamental del reloj."
    nota: "Espectro de ejemplo."
    libro: [414]
    widget:
      tipo: grafica
      x: { id: nu, min: 0, max: 70000000, unidad: Hz, rotulo: "f" }
      y: { min: -100, max: -30, unidad: dB, rotulo: "nivel relativo" }
      curvas:
        - { expr: "-90 + 50*exp(-((nu - f_k)/300000)^2) + 44*exp(-((nu - 2*f_k)/300000)^2) + 40*exp(-((nu - 3*f_k)/300000)^2) + 36*exp(-((nu - 4*f_k)/300000)^2) + 32*exp(-((nu - 5*f_k)/300000)^2) + 28*exp(-((nu - 6*f_k)/300000)^2) + 24*exp(-((nu - 7*f_k)/300000)^2) + 20*exp(-((nu - 8*f_k)/300000)^2)", color: azul, rotulo: "espectro" }
      mandos: []
    marcar:
      modo: x
      curva: 0
      x: "f_k"
      tol: 0.01
      inicio: { x: 40000000, y: -60 }
      rotulo: "La fundamental"
      pasos: 140
    pistas:
      - { cuando: { valor: marca_x, mayor: 12000000 }, texto: "Ese es un armónico: la fundamental es el primer pico." }
      - { texto: "Más a la derecha: el primer pico." }
    exito: "8 MHz: la separación entre picos vecinos identifica el reloj, y los demás son sus armónicos."
    escalera:
      - "La separación entre picos vecinos es la fundamental."
    solucion: "El primer pico, a 8 MHz."
    comprobar:
      - { f_k: 8000000 }

  - id: empareje-firmas
    tipo: pregunta
    fase: "Empareje"
    titulo: "Interpretar lo que se ve"
    texto: "Una cada firma del espectro con su origen."
    libro: [414, 415, 416, 417]
    emparejar:
      - ["Picos a múltiplos de una frecuencia", "Un reloj y sus armónicos"]
      - ["Picos que se mueven con la carga", "Fuente conmutada de frecuencia variable"]
      - ["Peine denso de rayas separadas kilohercios", "Refresco del display o tráfico de un bus"]
      - ["Pico ancho e inestable", "Oscilación parásita"]
    exito: "Una oscilación parásita es un fallo, no una emisión de diseño."
    pistas:
      - { texto: "Lo que cambia con la carga es la conmutación." }
    escalera:
      - "¿Cuál no es una emisión de diseño?"
    solucion: "Múltiplos–reloj; se mueven–conmutada; peine–refresco o bus; ancho–parásita."

  - id: pilas
    tipo: explorar
    titulo: "¿Conducida o radiada?"
    texto: "Quite el cable de alimentación y pase el equipo a pilas. Mire qué pico desaparece."
    nota: "Espectro de ejemplo."
    libro: [418]
    inicio: { s_p: 0 }
    widget:
      tipo: grafica
      x: { id: nu, min: 0, max: 70000000, unidad: Hz, rotulo: "f" }
      y: { min: -100, max: -30, unidad: dB, rotulo: "nivel relativo" }
      curvas:
        - { expr: "-90 + 50*exp(-((nu - f_k)/300000)^2) + 40*exp(-((nu - 3*f_k)/300000)^2) + 32*exp(-((nu - 5*f_k)/300000)^2) + (1 - s_p)*45*exp(-((nu - f_q)/300000)^2)", color: azul, rotulo: "espectro" }
      mandos:
        - { valor: s_p, tipo: interruptor, rotulo: "A pilas" }
    objetivo:
      condiciones:
        - { valor: s_p, min: 1, rotulo: "A pilas" }
      logrado: "El pico de 3 MHz se ha ido: era conducido y salía por el cable como modo común. Los del reloj siguen: los radia la placa."
      pistas:
        - { texto: "Pase el equipo a pilas." }
    escalera:
      - "Lo que se va al quitar el cable salía por él."
    solucion: "A pilas: desaparece el pico conducido."
    comprobar:
      - { f_q: 3000000 }

  - id: lea-flancos
    tipo: leer
    titulo: "Flancos más lentos"
    texto: "Ha bajado los flancos del reloj de 10 a 2 V/ns. Compare las dos capturas: ¿cuántos decibelios ha bajado el último pico?"
    nota: "Espectros de ejemplo."
    libro: [425, 428]
    widget:
      tipo: grafica
      x: { id: nu, min: 0, max: 70000000, unidad: Hz, rotulo: "f" }
      y: { min: -100, max: -30, unidad: dB, rotulo: "nivel relativo" }
      curvas:
        - { expr: "-90 + 50*exp(-((nu - 1*f_k)/300000)^2) + 44*exp(-((nu - 2*f_k)/300000)^2) + 40*exp(-((nu - 3*f_k)/300000)^2) + 36*exp(-((nu - 4*f_k)/300000)^2) + 32*exp(-((nu - 5*f_k)/300000)^2) + 28*exp(-((nu - 6*f_k)/300000)^2) + 24*exp(-((nu - 7*f_k)/300000)^2) + 20*exp(-((nu - 8*f_k)/300000)^2)", color: tinta, discontinua: true, rotulo: "antes, 10 V/ns" }
        - { expr: "-90 + 50*exp(-((nu - 1*f_k)/300000)^2) + 44*exp(-((nu - 2*f_k)/300000)^2) + 40*exp(-((nu - 3*f_k)/300000)^2) + 36*exp(-((nu - 4*f_k)/300000)^2) + 32 - d_f*exp(-((nu - 5*f_k)/300000)^2) + 28 - d_f*exp(-((nu - 6*f_k)/300000)^2) + 24 - d_f*exp(-((nu - 7*f_k)/300000)^2) + 20 - d_f*exp(-((nu - 8*f_k)/300000)^2)", color: azul, rotulo: "después, 2 V/ns" }
      mandos: []
    leer:
      objetivo: d_f
      unidad: dB
      tol: 0.1
      rotulo: "Lo que ha bajado el último pico"
    exito: "10 dB, sin coste: por eso reducir la velocidad de flanco es la tercera corrección, tras el trazado y el desacoplo. La diferencia entre capturas es fiable aunque el nivel absoluto no lo sea."
    escalera:
      - "Lea la altura del último pico en las dos curvas y réstelas."
    solucion: "La distancia entre las dos curvas en el último pico: 10 dB."
    comprobar:
      - { d_f: 10 }

  - id: comparativa
    tipo: pregunta
    titulo: "La medida que decide"
    texto: "Quiere saber si una ferrita mejora la emisión. ¿Qué hace falta para que la comparación valga?"
    libro: [425]
    widget:
      tipo: figura
      figura: fig-32.15
      zonas:
        - { id: sonda, rotulo: "La sonda de lazo", rect: [165, 25, 80, 170] }
    opciones:
      - texto: "Misma posición y orientación de la sonda, mismos ajustes del receptor y mismo estado del equipo"
        bien: true
        porque: "Así la diferencia en decibelios es fiable aunque el nivel absoluto no lo sea."
      - texto: "Un receptor calibrado"
        porque: "No hace falta: el nivel absoluto no importa, importa repetir igual."
      - texto: "Medir lo más rápido posible después del cambio"
        porque: "La rapidez no basta: hay que repetir exactamente la misma medida."
    escalera:
      - "¿Qué cosas podrían cambiar el nivel sin que cambie el equipo?"
    solucion: "Repetir todo igual: posición, orientación, ajustes y estado."

  - id: banco-cargador
    tipo: explorar
    titulo: "En el banco"
    texto: "La sonda junto a un cargador de móvil, con la SDR barriendo. Cámbielo por una fuente lineal en el mismo montaje."
    nota: "Espectros de ejemplo."
    libro: [438]
    inicio: { s_l: 0 }
    widget:
      tipo: grafica
      x: { id: nu, min: 0, max: 70000000, unidad: Hz, rotulo: "f" }
      y: { min: -100, max: -30, unidad: dB, rotulo: "nivel relativo" }
      curvas:
        - { expr: "-90 + (1 - s_l)*(50*exp(-((nu - f_k)/300000)^2) + 44*exp(-((nu - 2*f_k)/300000)^2) + 40*exp(-((nu - 3*f_k)/300000)^2) + 36*exp(-((nu - 4*f_k)/300000)^2) + 32*exp(-((nu - 5*f_k)/300000)^2) + 28*exp(-((nu - 6*f_k)/300000)^2))", color: azul, rotulo: "espectro" }
      mandos:
        - { valor: s_l, tipo: interruptor, rotulo: "Fuente lineal" }
    objetivo:
      condiciones:
        - { valor: s_l, min: 1, rotulo: "Fuente lineal" }
      logrado: "La lineal no conmuta: espectro limpio. El cargador mostraba su conmutación y sus armónicos, y la sonda localiza su transformador y su bucle de entrada."
      pistas:
        - { texto: "Cambie a la fuente lineal." }
    escalera:
      - "¿Cuál de las dos conmuta?"
    solucion: "Con la lineal, el peine desaparece."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [402, 411, 414, 425, 428, 432, 434]
    ideas:
      - { titulo: "Precompliance.", texto: "Localizar la fuente y comparar antes y después, no el número absoluto." }
      - { titulo: "El procedimiento.", texto: "Fondo apagado, encender, identificar, recorrer y girar la sonda. Corregir en orden: trazado, desacoplo, flancos, filtros, pantalla." }
      - { titulo: "Repetir igual.", texto: "Misma posición, orientación, ajustes y estado: la diferencia en dB es fiable." }
      - { titulo: "Sus límites.", texto: "No es calibrada, no predice el campo lejano y no cubre la inmunidad." }
