# Lección 1.2 de la sección 32.13 «Precompliance de EMC: Medir Emisiones en el Banco» (cap32). Formato: GUIA.md.
# El espectro de la estimación es un dibujo de ejemplo: picos a múltiplos de un reloj de 8 MHz que bajan con el orden
# del armónico; no se escribe ningún número suyo en las tarjetas. Zonas de la figura 32.16 (fig-32.15, 450,72 × 256,32).
leccion: cap32/sec-32.13

libro:
  402: "localizar la fuente y comparar antes y después de un cambio"
  404: "Detecta campo magnético, que es lo que producen los bucles de corriente"
  405: "Detecta nodos de tensión con flancos rápidos"
  411: "Capturar el espectro de fondo con el equipo apagado"
  412: "no solo dónde, sino qué bucle"
  414: "La separación identifica cuál"
  415: "Picos que se mueven con la carga"
  416: "Un peine denso de rayas separadas kilohercios"
  417: "Un pico ancho e inestable: oscilación parásita"
  418: "quitar el cable de alimentación —pasar a pilas— y ver qué desaparece"
  425: "la diferencia en decibelios entre dos capturas es un número fiable aunque el nivel absoluto no lo sea"
  428: "bajar de 10 a 2 V/ns puede quitar 10 dB en los armónicos altos"
  432: "La sonda de campo cercano no predice el campo lejano"
  434: "No cubre la inmunidad"
  438: "comparando con una fuente lineal en el mismo montaje, el espectro aparece limpio"

modelo:
  valores:
    f_k: { sim: "f_{reloj}", nombre: "reloj de ejemplo", unidad: Hz, valor: 8000000 }

tarjetas:
  - id: explore-procedimiento
    tipo: explorar
    titulo: "Localizar con la sonda"
    texto: "Sin cámara, el valor está en localizar la fuente y comparar antes y después. Toque los pasos del procedimiento."
    libro: [402, 404, 405, 411]
    widget:
      tipo: figura
      figura: fig-32.15
      zonas:
        - { id: p1, rotulo: "Primer paso", rect: [2, 30, 150, 36], texto: "Fondo con el equipo apagado: lo que salga es del entorno." }
        - { id: p2, rotulo: "Segundo paso", rect: [2, 72, 150, 36], texto: "Encender y capturar: la diferencia es del equipo." }
        - { id: p4, rotulo: "Cuarto paso", rect: [2, 162, 150, 36], texto: "Recorrer la placa a un milímetro con la sonda de lazo: donde sube el pico, está la fuente." }
        - { id: p5, rotulo: "Quinto paso", rect: [2, 208, 150, 36], texto: "Girar la sonda: el máximo indica la dirección del bucle. No solo dónde, sino qué bucle." }
        - { id: sonda, rotulo: "La sonda de lazo", rect: [165, 25, 80, 170], texto: "Lazo de coaxial con la malla abierta: detecta campo magnético, el de los bucles de corriente." }
    requiere: { mover: [p1, p5] }

  - id: ordene-pasos
    tipo: pregunta
    fase: "Ordene"
    titulo: "El procedimiento de localización"
    texto: "Ordene los cinco pasos."
    libro: [411, 412]
    ordenar:
      - "Capturar el fondo con el equipo apagado"
      - "Encender y capturar de nuevo"
      - "Identificar los picos con las frecuencias del sistema"
      - "Recorrer la placa con la sonda de lazo"
      - "Girar la sonda para ver qué bucle"
    exito: "El quinto paso es lo que solo da la sonda de lazo: qué bucle."
    pistas:
      - { texto: "Sin el fondo no sabe qué es del entorno." }
    escalera:
      - "Primero lo que no es suyo; al final, la dirección."
    solucion: "Fondo, encender, identificar, recorrer y girar."

  - id: estime-reloj
    tipo: pregunta
    fase: "Estime"
    titulo: "Picos regularmente espaciados"
    texto: "El espectro de su equipo muestra picos a múltiplos de una frecuencia. ¿De qué reloj son?"
    nota: "Espectro de ejemplo."
    libro: [414]
    widget:
      tipo: grafica
      x: { id: nu, min: 0, max: 70000000, unidad: Hz, rotulo: "f" }
      y: { min: -100, max: -30, unidad: dB, rotulo: "nivel relativo" }
      curvas:
        - { expr: "-90 + 50*exp(-((nu - f_k)/300000)^2) + 44*exp(-((nu - 2*f_k)/300000)^2) + 40*exp(-((nu - 3*f_k)/300000)^2) + 36*exp(-((nu - 4*f_k)/300000)^2) + 32*exp(-((nu - 5*f_k)/300000)^2) + 28*exp(-((nu - 6*f_k)/300000)^2) + 24*exp(-((nu - 7*f_k)/300000)^2) + 20*exp(-((nu - 8*f_k)/300000)^2)", color: azul, rotulo: "espectro" }
    estimar:
      objetivo: "f_k"
      unidad: Hz
      min: 0
      max: 20000000
      paso: 100000
      inicio: 16000000
      tol: 0.06
      rotulo: "Frecuencia del reloj"
    exito: "La separación entre picos es el reloj: el primero es la fundamental, los demás sus armónicos."
    pistas:
      - { cuando: { valor: estimacion, mayor: 8480000 }, texto: "Se ha pasado: mida la distancia entre dos picos vecinos." }
      - { texto: "Se ha quedado corto: el primer pico es la fundamental." }
    escalera:
      - "La separación entre picos vecinos identifica el reloj."
    solucion: "La distancia entre picos vecinos, igual al primer pico: la fundamental del reloj."

  - id: empareje-firmas
    tipo: pregunta
    fase: "Empareje"
    titulo: "Interpretar lo que se ve"
    texto: "Una cada firma del espectro con su origen."
    libro: [414, 415, 416, 417]
    emparejar:
      - ["Picos a múltiplos de una frecuencia", "Un reloj y sus armónicos"]
      - ["Picos que se mueven con la carga", "Fuente conmutada de frecuencia variable"]
      - ["Peine denso de rayas separadas kilohercios", "Refresco del display o tráfico de un bus"]
      - ["Pico ancho e inestable", "Oscilación parásita"]
    exito: "Una oscilación parásita es un fallo, no una emisión de diseño."
    pistas:
      - { texto: "Lo que cambia con la carga es la conmutación." }
    escalera:
      - "¿Cuál no es una emisión de diseño?"
    solucion: "Múltiplos–reloj; se mueven–conmutada; peine–refresco o bus; ancho–parásita."

  - id: pilas
    tipo: pregunta
    titulo: "¿Conducida o radiada?"
    texto: "Pasa el equipo a pilas, sin cable de alimentación, y un pico desaparece. ¿Qué era?"
    libro: [418]
    widget:
      tipo: grafica
      x: { id: nu, min: 0, max: 70000000, unidad: Hz, rotulo: "f" }
      y: { min: -100, max: -30, unidad: dB, rotulo: "nivel relativo" }
      curvas:
        - { expr: "-90 + 50*exp(-((nu - f_k)/300000)^2) + 44*exp(-((nu - 2*f_k)/300000)^2) + 40*exp(-((nu - 3*f_k)/300000)^2) + 36*exp(-((nu - 4*f_k)/300000)^2) + 32*exp(-((nu - 5*f_k)/300000)^2) + 28*exp(-((nu - 6*f_k)/300000)^2) + 24*exp(-((nu - 7*f_k)/300000)^2) + 20*exp(-((nu - 8*f_k)/300000)^2)", color: azul, rotulo: "espectro" }
    opciones:
      - texto: "Emisión conducida que salía por el cable como modo común"
        bien: true
        porque: "Lo que se va al quitar el cable salía por él."
      - texto: "Ruido de la propia sonda"
        porque: "La sonda no cambia al quitar el cable del equipo."
      - texto: "Emisión radiada por la placa"
        porque: "Lo radiado por la placa seguiría ahí con pilas."
    escalera:
      - "¿Qué ha quitado al pasar a pilas?"
    solucion: "Conducida: salía por el cable como modo común."

  - id: comparativa
    tipo: pregunta
    titulo: "La medida que decide"
    texto: "Quiere saber si una ferrita mejora la emisión. ¿Qué hace falta para que la comparación valga?"
    libro: [425]
    widget:
      tipo: figura
      figura: fig-32.15
      zonas:
        - { id: sonda, rotulo: "La sonda de lazo", rect: [165, 25, 80, 170] }
    opciones:
      - texto: "Misma posición y orientación de la sonda, mismos ajustes del receptor y mismo estado del equipo"
        bien: true
        porque: "Así la diferencia en decibelios es fiable aunque el nivel absoluto no lo sea."
      - texto: "Un receptor calibrado"
        porque: "No hace falta: el nivel absoluto no importa, importa repetir igual."
      - texto: "Medir lo más rápido posible después del cambio"
        porque: "La rapidez no basta: hay que repetir exactamente la misma medida."
    escalera:
      - "¿Qué cosas podrían cambiar el nivel sin que cambie el equipo?"
    solucion: "Repetir todo igual: posición, orientación, ajustes y estado."

  - id: ordene-correcciones
    tipo: pregunta
    fase: "Ordene"
    titulo: "El orden de las correcciones"
    texto: "Con la medida delante, ordene las correcciones."
    libro: [428]
    widget:
      tipo: figura
      figura: fig-32.15
      zonas:
        - { id: sonda, rotulo: "La sonda de lazo", rect: [165, 25, 80, 170] }
    ordenar:
      - "Trazado y masas"
      - "Desacoplo junto al integrado que emite"
      - "Flancos más lentos"
      - "Filtrado y ferritas en los cables"
      - "Apantallamiento"
    exito: "Bajar de 10 a 2 V/ns puede quitar 10 dB en los armónicos altos, y no cuesta nada."
    pistas:
      - { texto: "Lo gratis y más eficaz va primero; la pantalla, la última." }
    escalera:
      - "Midiendo tras cada paso se ve cuál sirve."
    solucion: "Trazado, desacoplo, flancos, filtrado y pantalla."

  - id: limites
    tipo: pregunta
    titulo: "Los límites honestos"
    texto: "La sonda marca muy poco junto a un cable largo y mucho sobre un bucle pequeño. ¿Qué radia más a tres metros?"
    libro: [432, 434]
    widget:
      tipo: figura
      figura: fig-32.15
      zonas:
        - { id: sonda, rotulo: "La sonda de lazo", rect: [165, 25, 80, 170] }
    opciones:
      - texto: "No se sabe con la sonda: el cable largo con algo de modo común puede radiar mucho"
        bien: true
        porque: "La sonda de campo cercano no predice el campo lejano."
      - texto: "El bucle pequeño, porque la sonda marca más"
        porque: "Un bucle pequeño y ruidoso puede radiar poco a tres metros."
      - texto: "Ninguno: la sonda dice que todo está bien"
        porque: "No es una medida calibrada ni de campo lejano."
    escalera:
      - "¿Qué ve una sonda a un milímetro de altura?"
    solucion: "La sonda no predice el campo lejano: el cable puede ser el que más radia."

  - id: banco-cargador
    tipo: pregunta
    titulo: "En el banco"
    texto: "Acerca la sonda a un cargador de móvil con la SDR barriendo, y luego a una fuente lineal en el mismo montaje. ¿Qué ve?"
    libro: [438]
    widget:
      tipo: grafica
      x: { id: nu, min: 0, max: 70000000, unidad: Hz, rotulo: "f" }
      y: { min: -100, max: -30, unidad: dB, rotulo: "nivel relativo" }
      curvas:
        - { expr: "-90 + 50*exp(-((nu - f_k)/300000)^2) + 44*exp(-((nu - 2*f_k)/300000)^2) + 40*exp(-((nu - 3*f_k)/300000)^2) + 36*exp(-((nu - 4*f_k)/300000)^2) + 32*exp(-((nu - 5*f_k)/300000)^2) + 28*exp(-((nu - 6*f_k)/300000)^2) + 24*exp(-((nu - 7*f_k)/300000)^2) + 20*exp(-((nu - 8*f_k)/300000)^2)", color: azul, rotulo: "conmutada" }
        - { expr: "-90 + 0*nu", color: verde, rotulo: "lineal", discontinua: true }
    opciones:
      - texto: "El cargador muestra su conmutación y armónicos; la lineal, un espectro limpio"
        bien: true
        porque: "Esa comparación explica el capítulo mejor que cualquier explicación."
      - texto: "Los dos iguales: ambos van a la red"
        porque: "La lineal no conmuta: no tiene esos picos."
      - texto: "La lineal emite más, porque disipa más"
        porque: "Disipar calor no es emitir: lo que emite son los flancos de la conmutación."
    escalera:
      - "¿Cuál de las dos conmuta?"
    solucion: "Conmutada con su peine de armónicos; lineal, limpia."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [402, 411, 414, 425, 432]
    ideas:
      - { titulo: "Precompliance.", texto: "Localizar la fuente y comparar antes y después, no el número absoluto." }
      - { titulo: "El procedimiento.", texto: "Fondo, encender, identificar, recorrer y girar la sonda." }
      - { titulo: "Repetir igual.", texto: "Misma posición, orientación, ajustes y estado: la diferencia en dB es fiable." }
      - { titulo: "Sus límites.", texto: "No es calibrada, no predice el campo lejano y no cubre la inmunidad." }
