# Lección 1.2 de la sección 32.9 «Modo Común y Modo Diferencial» (cap32). Formato: contenido/lecciones11/GUIA.md.
# Las corrientes de los dos conductores se dibujan como senoides relativas: opuestas (diferencial) o iguales (común);
# su suma es lo que queda de campo lejos del cable (bloque 272). Las zonas son las de la figura 32.10 (svg_vista).
# 1.2.1 (autor121-ana, «aprender haciendo», GUIA §13): el cable se pasa a modo común hasta que la neta radia (las
# razones van en su explicación), el camino de salida por C_{par} y el filtro de cada modo se tocan en la fig. 32.10, el
# modo común se aísla de dos canales con la suma y en el banco se instala el filtro que reduce lo que ve la pinza
# (amplitudes y atenuación de ejemplo, relativas). La ordenación pasa al resumen. Quedan dos preguntas de opciones (por
# qué no más Y, clase X e Y).
leccion: cap32/sec-32.9

libro:
  267: "va por un conductor y vuelve por el otro, igual que la señal útil"
  268: "va por ambos conductores en el mismo sentido y vuelve por otro camino"
  269: "poner el equivocado no sirve de nada"
  272: "dos corrientes en el mismo sentido los suman, y el cable se convierte en antena"
  273: "Un campo externo induce lo mismo en ambos conductores"
  274: "Un osciloscopio referido a masa mide entre un conductor y la referencia"
  275: "las corrientes parásitas a través de capacidades a chasis"
  277: "un condensador entre los conductores"
  278: "condensadores de cada conductor a chasis"
  279: "por eso el choke es imprescindible"
  280: "los Y, para fallar en circuito abierto"
  283: "La resta"
  284: "La suma dividida por dos da el modo común"
  286: "la pinza solo mide el modo común, directamente"
  289: "Reducir el ruido en origen"
  290: "Un filtro colocado lejos del conector deja el tramo intermedio como antena"
  292: "se mide el modo común en el cable, se instala el choke, y se vuelve a medir"
  293: "que no cambia nada, porque filtra el otro modo"
  294: "Modo diferencial y modo común, con el componente que filtra cada uno"

modelo:
  valores:
    m_c: { tipo: interruptor, nombre: "modo común", valor: 0 }
    d_m: { sim: "i_{d}", nombre: "modo diferencial de ejemplo, relativo", unidad: "", valor: 0.3 }
    c_z: { sim: "i_{c}", nombre: "modo común de ejemplo, relativo", unidad: "", valor: 1 }
    o_p: { sim: "op", nombre: "operación entre canales (1 resta, 2 suma entre dos)", unidad: "", valor: 1 }
    f_x: { sim: "filtro", nombre: "filtro instalado (0 ninguno, 1 X, 2 choke)", unidad: "", valor: 0 }
  calculos:
    c_n: { expr: "2*m_c", sim: "i₁ + i₂", nombre: "corriente neta, relativa", unidad: "" }
    r_o: { expr: "max(0, 1 - abs(o_p - 1))*2*d_m + max(0, 1 - abs(o_p - 2))*c_z", sim: "v", nombre: "resultado de la operación", unidad: "" }
    c_f: { expr: "c_z*(1 - 0.9*max(0, 1 - abs(f_x - 2)))", sim: "i_{c}", nombre: "modo común tras el filtro", unidad: "" }

tarjetas:
  - id: explore-modos
    tipo: explorar
    titulo: "Dos modos"
    texto: "En diferencial, la corriente de ruido va por un conductor y vuelve por el otro. Pase a modo común y mire la corriente neta del cable."
    libro: [267, 268, 272, 273, 274]
    widget:
      tipo: grafica
      x: { id: xt, min: 0, max: 2, unidad: "", rotulo: "t, en periodos" }
      y: { min: -2.2, max: 2.2, unidad: "", rotulo: "corriente, relativa" }
      curvas:
        - { expr: "sin(2*pi*xt)", color: azul, rotulo: "conductor 1" }
        - { expr: "(2*m_c - 1)*sin(2*pi*xt)", color: naranja, rotulo: "conductor 2", discontinua: true }
        - { expr: "2*m_c*sin(2*pi*xt)", color: verde, rotulo: "neta: lo que radia" }
      lectura: { valor: c_n, rotulo: "Amplitud neta" }
      mandos:
        - { valor: m_c, tipo: interruptor, rotulo: "Modo común" }
    objetivo:
      condiciones:
        - { valor: c_n, min: 2, rotulo: "Neta: {{c_n}}" }
      logrado: "En modo común, las dos corrientes suman sus campos y el cable radia. Además es el que se capta y el que menos se ve con un osciloscopio referido a masa."
      pistas:
        - { texto: "Pase a modo común." }
    escalera:
      - "En diferencial, iguales y opuestas: la neta es cero."
    solucion: "Modo común: neta 2."
    comprobar:
      - { con: { m_c: 1 }, c_n: 2 }

  - id: origen
    tipo: tocar
    titulo: "De dónde sale"
    texto: "Una fuente conmutada lleva su transistor sobre un disipador unido al chasis. Toque por dónde sale su conmutación hacia el chasis."
    libro: [275, 294]
    widget:
      tipo: figura
      figura: fig-32.10
      zonas:
        - { id: equipo, rotulo: "Caja del equipo", rect: [240, 27, 37, 68] }
        - { id: cpar, rotulo: "Condensador bajo el equipo", rect: [230, 97, 50, 36] }
        - { id: cable, rotulo: "Los dos conductores", rect: [282, 35, 120, 57] }
    tocar:
      bien: [cpar]
      porque:
        equipo: "La conmutación está dentro del equipo; lo que la saca al chasis es una capacidad parásita."
        cable: "Por los cables sale después, en modo común, pero llega al chasis por la capacidad."
    exito: "La capacidad parásita a chasis: el transistor y el disipador forman un condensador. La corriente vuelve por tierra y sale por los cables."
    escalera:
      - "¿Qué forman el transistor y el disipador, separados por un aislante?"
    solucion: "La capacidad parásita a chasis."

  - id: toque-filtro
    tipo: tocar
    titulo: "El filtro para cada modo"
    texto: "La corriente de ruido va por los dos conductores en el mismo sentido y vuelve por el chasis. Toque el filtro que la frena."
    libro: [269, 277, 278]
    widget:
      tipo: figura
      figura: fig-32.10
      zonas:
        - { id: filtro-x, rotulo: "Caja de abajo a la izquierda", rect: [14, 142, 194, 40] }
        - { id: filtro-comun, rotulo: "Caja de abajo a la derecha", rect: [244, 142, 195, 40] }
    tocar:
      bien: [filtro-comun]
      porque:
        filtro-x: "El condensador X entre conductores y la bobina en serie filtran el modo diferencial: este ruido no va entre los conductores."
    exito: "Choke de modo común y condensadores Y a chasis: el diferencial no ve el choke y el común encuentra impedancia alta. El otro filtro no le hace nada."
    escalera:
      - "Es modo común: ¿qué componente ve una corriente que va igual por los dos?"
    solucion: "Abajo a la derecha: choke de modo común y condensadores Y."

  - id: por-que-choke
    tipo: porque
    titulo: "¿Por qué no más condensador Y?"
    texto: "Para filtrar más modo común, ¿por qué no basta con poner condensadores Y más grandes?"
    libro: [279]
    widget:
      tipo: figura
      figura: fig-32.10
      zonas:
        - { id: filtro-comun, rotulo: "Filtro de modo común", rect: [244, 142, 195, 40] }
    opciones:
      - texto: "Su corriente de fuga va a tierra y la norma de seguridad la limita: el choke es imprescindible"
        bien: true
        porque: "No se puede filtrar el modo común solo con capacidad."
      - texto: "Porque se saturan con la corriente de red"
        porque: "Lo que se satura es un núcleo magnético. El límite de los Y es la fuga a tierra."
      - texto: "Porque los Y filtran el modo diferencial"
        porque: "Van de cada conductor a chasis: filtran el común. Su problema es la fuga."
    escalera:
      - "¿Por dónde circula la corriente de un condensador conectado a chasis?"
    solucion: "La fuga a tierra está acotada por seguridad: hace falta el choke."

  - id: x-y
    tipo: pregunta
    titulo: "Clase X y clase Y"
    texto: "En un filtro de red alguien pone cerámicos normales en lugar de condensadores X e Y certificados. ¿Qué arriesga?"
    libro: [280]
    widget:
      tipo: figura
      figura: fig-32.10
      zonas:
        - { id: filtros, rotulo: "Los dos filtros", rect: [14, 142, 425, 40] }
    opciones:
      - texto: "Que fallen en cortocircuito: en la red, un incendio o una descarga"
        bien: true
        porque: "Un X certificado que falla solo hace saltar el fusible; un Y falla en abierto, para no poner la red en el chasis."
      - texto: "Solo filtrar algo peor"
        porque: "El problema no es el filtrado, es cómo fallan."
      - texto: "Nada, si tienen la tensión adecuada"
        porque: "La tensión no basta: los X soportan las sobretensiones y los Y están hechos para fallar en abierto."
    escalera:
      - "¿Qué pasa en la red si un condensador a chasis queda en corto?"
    solucion: "Un fallo en cortocircuito: incendio o red en el chasis."

  - id: empareje-medir
    tipo: explorar
    titulo: "Distinguirlos midiendo"
    texto: "Dos canales de osciloscopio, uno en cada conductor respecto a la referencia. Elija la operación que aísla el modo común."
    nota: "Amplitudes de ejemplo, relativas."
    libro: [283, 284, 286]
    inicio: { o_p: 1 }
    widget:
      tipo: grafica
      x: { id: xt, min: 0, max: 2, unidad: "", rotulo: "t, en periodos" }
      y: { min: -1.6, max: 1.6, unidad: "", rotulo: "tensión, relativa" }
      curvas:
        - { expr: "d_m*sin(2*pi*xt) + c_z*sin(6*pi*xt)", color: azul, rotulo: "canal 1", discontinua: true }
        - { expr: "-d_m*sin(2*pi*xt) + c_z*sin(6*pi*xt)", color: naranja, rotulo: "canal 2", discontinua: true }
        - { expr: "max(0, 1 - abs(o_p - 1))*2*d_m*sin(2*pi*xt) + max(0, 1 - abs(o_p - 2))*c_z*sin(6*pi*xt)", color: verde, rotulo: "resultado" }
      lectura: { valor: r_o, rotulo: "Amplitud del resultado" }
      mandos:
        - { valor: o_p, lista: [1, 2], nombres: ["resta", "suma entre dos"], rotulo: "Operación" }
    objetivo:
      condiciones:
        - { valor: o_p, min: 2, rotulo: "Operación: suma entre dos" }
      logrado: "La suma entre dos deja lo que es igual en los dos conductores: el modo común. La resta da el diferencial; una pinza alrededor de los dos mide el común directamente."
      pistas:
        - { texto: "La resta cancela lo que es igual en los dos." }
    escalera:
      - "Lo que es igual en los dos conductores sobrevive a la suma."
    solucion: "Suma entre dos."
    comprobar:
      - { con: { o_p: 2 }, r_o: 1 }
      - { con: { o_p: 1 }, r_o: 0.6 }

  - id: banco-pinza
    tipo: explorar
    titulo: "En el banco"
    texto: "Una pinza de corriente alrededor de los dos conductores mide el modo común del cable. Instale el filtro que lo reduce."
    nota: "Atenuación de ejemplo, relativa."
    libro: [292, 293]
    inicio: { f_x: 0 }
    widget:
      tipo: grafica
      x: { id: xt, min: 0, max: 2, unidad: "", rotulo: "t, en periodos" }
      y: { min: -1.2, max: 1.2, unidad: "", rotulo: "corriente en la pinza, relativa" }
      curvas:
        - { expr: "c_f*sin(6*pi*xt)", color: verde, rotulo: "pinza" }
      lectura: { valor: c_f, rotulo: "Modo común en la pinza" }
      mandos:
        - { valor: f_x, lista: [0, 1, 2], nombres: ["sin filtro", "condensador X", "choke"], rotulo: "Filtro" }
    objetivo:
      condiciones:
        - { valor: c_f, max: 0.2, rotulo: "Pinza: {{c_f}}" }
      logrado: "Con el choke la reducción se ve a la primera; con el X no cambia nada, porque filtra el otro modo. Por eso distinguirlos no es un tecnicismo."
      pistas:
        - { cuando: { valor: f_x, min: 1, max: 1 }, texto: "El X va entre conductores: el modo común no lo ve." }
        - { texto: "Instale un filtro." }
    escalera:
      - "¿Qué componente ve una corriente que va igual por los dos conductores?"
    solucion: "El choke de modo común."
    comprobar:
      - { con: { f_x: 1 }, c_f: 1 }
      - { con: { f_x: 2 }, c_f: 0.1 }

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [267, 268, 272, 278, 279, 289, 290]
    ideas:
      - { titulo: "Dos modos.", texto: "Diferencial entre conductores; común en los dos a la vez, con vuelta por tierra o chasis." }
      - { titulo: "El común es el problema.", texto: "Radia, se capta y apenas se ve." }
      - { titulo: "Cada uno, su filtro.", texto: "X y bobina en serie para el diferencial; choke y Y para el común." }
      - { titulo: "Medir antes.", texto: "Resta y suma de dos canales, o una pinza. Y el orden: origen, filtro en el conector, pantalla." }
