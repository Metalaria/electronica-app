# Lección 1.2 de la sección 32.9 «Modo Común y Modo Diferencial» (cap32). Formato: contenido/lecciones11/GUIA.md.
# Las corrientes de los dos conductores se dibujan como senoides relativas: opuestas (diferencial) o iguales (común);
# su suma es lo que queda de campo lejos del cable (bloque 272). Las zonas son las de la figura 32.10 (svg_vista).
leccion: cap32/sec-32.9

libro:
  267: "va por un conductor y vuelve por el otro, igual que la señal útil"
  268: "va por ambos conductores en el mismo sentido y vuelve por otro camino"
  269: "poner el equivocado no sirve de nada"
  272: "dos corrientes en el mismo sentido los suman, y el cable se convierte en antena"
  273: "Un campo externo induce lo mismo en ambos conductores"
  274: "Un osciloscopio referido a masa mide entre un conductor y la referencia"
  275: "las corrientes parásitas a través de capacidades a chasis"
  277: "un condensador entre los conductores"
  278: "condensadores de cada conductor a chasis"
  279: "por eso el choke es imprescindible"
  280: "los Y, para fallar en circuito abierto"
  283: "La resta"
  284: "La suma dividida por dos da el modo común"
  286: "la pinza solo mide el modo común, directamente"
  289: "Reducir el ruido en origen"
  290: "Un filtro colocado lejos del conector deja el tramo intermedio como antena"
  292: "se mide el modo común en el cable, se instala el choke, y se vuelve a medir"
  293: "que no cambia nada, porque filtra el otro modo"

modelo:
  valores:
    m_c: { tipo: interruptor, nombre: "modo común", valor: 0 }
  calculos:
    c_n: { expr: "2*m_c", sim: "i₁ + i₂", nombre: "corriente neta, relativa", unidad: "" }

tarjetas:
  - id: explore-modos
    tipo: explorar
    titulo: "Dos modos"
    texto: "En diferencial, la corriente de ruido va por un conductor y vuelve por el otro. Cambie a modo común y mire la corriente neta del cable."
    libro: [267, 268, 272]
    widget:
      tipo: grafica
      x: { id: xt, min: 0, max: 2, unidad: "", rotulo: "t, en periodos" }
      y: { min: -2.2, max: 2.2, unidad: "", rotulo: "corriente, relativa" }
      curvas:
        - { expr: "sin(2*pi*xt)", color: azul, rotulo: "conductor 1" }
        - { expr: "(2*m_c - 1)*sin(2*pi*xt)", color: naranja, rotulo: "conductor 2", discontinua: true }
        - { expr: "2*m_c*sin(2*pi*xt)", color: verde, rotulo: "neta: lo que radia" }
      lectura: { valor: c_n, rotulo: "Amplitud neta" }
      mandos:
        - { valor: m_c, tipo: interruptor, rotulo: "Modo común" }
    requiere: { mover: [m_c] }

  - id: por-que-radia
    tipo: porque
    titulo: "El que radia"
    texto: "En un ensayo de emisiones radiadas, casi todo lo que se mide es modo común. ¿Por qué?"
    libro: [272]
    fijar: { m_c: 1 }
    widget:
      tipo: grafica
      x: { id: xt, min: 0, max: 2, unidad: "", rotulo: "t, en periodos" }
      y: { min: -2.2, max: 2.2, unidad: "", rotulo: "corriente, relativa" }
      curvas:
        - { expr: "2*m_c*sin(2*pi*xt)", color: verde, rotulo: "neta" }
    opciones:
      - texto: "Dos corrientes en el mismo sentido suman sus campos: el cable se vuelve antena"
        bien: true
        porque: "En diferencial, iguales y opuestas, sus campos se cancelan."
      - texto: "Porque el modo común es siempre mayor"
        porque: "No hace falta que sea mayor: aunque sea pequeño, sus campos se suman en lugar de cancelarse."
      - texto: "Porque el modo diferencial no existe en los cables"
        porque: "Existe, y es el de la propia señal útil; simplemente radia poco."
    escalera:
      - "Sume los campos de dos corrientes iguales y opuestas; luego, de dos iguales."
    solucion: "Corrientes en el mismo sentido: campos que se suman y un cable que radia."

  - id: empareje-razones
    tipo: pregunta
    fase: "Empareje"
    titulo: "Por qué el modo común es el problema"
    texto: "Una cada razón con su explicación."
    libro: [272, 273, 274]
    emparejar:
      - ["Es el que radia", "Sus campos se suman"]
      - ["Es el que se capta", "Un campo externo induce lo mismo en los dos conductores"]
      - ["Es el que menos se ve", "El osciloscopio referido a masa ve una mezcla"]
    exito: "Las tres lo hacen dominante en la práctica."
    pistas:
      - { texto: "El osciloscopio mide entre un conductor y la referencia." }
    escalera:
      - "¿Qué induce un campo externo en dos conductores muy juntos?"
    solucion: "Radia–suma; se capta–igual en ambos; no se ve–mezcla en el osciloscopio."

  - id: origen
    tipo: pregunta
    titulo: "De dónde sale"
    texto: "Una fuente conmutada lleva su transistor sobre un disipador unido al chasis. ¿Por dónde sale el modo común?"
    libro: [275]
    widget:
      tipo: figura
      figura: fig-32.10
      zonas:
        - { id: comun, rotulo: "Diagrama de la derecha", rect: [240, 27, 203, 98] }
    opciones:
      - texto: "Por la capacidad parásita a chasis, y de ahí por los cables"
        bien: true
        porque: "La conmutación se acopla al chasis por esa capacidad y la corriente sale por los cables."
      - texto: "Por el conductor de vuelta, como la señal"
        porque: "Eso sería modo diferencial: va y vuelve por los conductores."
      - texto: "No sale: el disipador lo absorbe"
        porque: "El disipador solo evacua calor; eléctricamente forma un condensador con el transistor."
    escalera:
      - "¿Qué forman el transistor y el disipador, separados por un aislante?"
    solucion: "Por la capacidad parásita a chasis: la corriente vuelve por tierra y sale por los cables."

  - id: toque-filtro
    tipo: tocar
    titulo: "El filtro para cada modo"
    texto: "La corriente de ruido va por los dos conductores en el mismo sentido y vuelve por el chasis. Toque el filtro que la frena."
    libro: [269, 277, 278]
    widget:
      tipo: figura
      figura: fig-32.10
      zonas:
        - { id: filtro-x, rotulo: "Caja de abajo a la izquierda", rect: [14, 142, 194, 40] }
        - { id: filtro-comun, rotulo: "Caja de abajo a la derecha", rect: [244, 142, 195, 40] }
    tocar:
      bien: [filtro-comun]
      porque:
        filtro-x: "El condensador X entre conductores y la bobina en serie filtran el modo diferencial: este ruido no va entre los conductores."
    exito: "Choke de modo común y condensadores Y a chasis. El otro filtro no le hace nada."
    escalera:
      - "Es modo común: ¿qué componente ve una corriente que va igual por los dos?"
    solucion: "Abajo a la derecha: choke de modo común y condensadores Y."

  - id: por-que-choke
    tipo: porque
    titulo: "¿Por qué no más condensador Y?"
    texto: "Para filtrar más modo común, ¿por qué no basta con poner condensadores Y más grandes?"
    libro: [279]
    widget:
      tipo: figura
      figura: fig-32.10
      zonas:
        - { id: filtro-comun, rotulo: "Filtro de modo común", rect: [244, 142, 195, 40] }
    opciones:
      - texto: "Su corriente de fuga va a tierra y la norma de seguridad la limita: el choke es imprescindible"
        bien: true
        porque: "No se puede filtrar el modo común solo con capacidad."
      - texto: "Porque se saturan con la corriente de red"
        porque: "Lo que se satura es un núcleo magnético. El límite de los Y es la fuga a tierra."
      - texto: "Porque los Y filtran el modo diferencial"
        porque: "Van de cada conductor a chasis: filtran el común. Su problema es la fuga."
    escalera:
      - "¿Por dónde circula la corriente de un condensador conectado a chasis?"
    solucion: "La fuga a tierra está acotada por seguridad: hace falta el choke."

  - id: x-y
    tipo: pregunta
    titulo: "Clase X y clase Y"
    texto: "En un filtro de red alguien pone cerámicos normales en lugar de condensadores X e Y certificados. ¿Qué arriesga?"
    libro: [280]
    widget:
      tipo: figura
      figura: fig-32.10
      zonas:
        - { id: filtros, rotulo: "Los dos filtros", rect: [14, 142, 425, 40] }
    opciones:
      - texto: "Que fallen en cortocircuito: en la red, un incendio o una descarga"
        bien: true
        porque: "Un X certificado que falla solo hace saltar el fusible; un Y falla en abierto, para no poner la red en el chasis."
      - texto: "Solo filtrar algo peor"
        porque: "El problema no es el filtrado, es cómo fallan."
      - texto: "Nada, si tienen la tensión adecuada"
        porque: "La tensión no basta: los X soportan las sobretensiones y los Y están hechos para fallar en abierto."
    escalera:
      - "¿Qué pasa en la red si un condensador a chasis queda en corto?"
    solucion: "Un fallo en cortocircuito: incendio o red en el chasis."

  - id: empareje-medir
    tipo: pregunta
    fase: "Empareje"
    titulo: "Distinguirlos midiendo"
    texto: "Una cada medida con el modo que da."
    libro: [283, 284, 286]
    emparejar:
      - ["Resta de los dos canales", "Modo diferencial"]
      - ["Suma de los dos canales dividida por dos", "Modo común"]
      - ["Pinza de corriente alrededor de los dos conductores", "Modo común, directamente"]
    exito: "Saber cuál domina antes de elegir el filtro ahorra probar componentes a ciegas."
    pistas:
      - { texto: "En la pinza, las corrientes diferenciales se cancelan." }
    escalera:
      - "Lo que es igual en los dos conductores sobrevive a la suma."
    solucion: "Resta: diferencial. Suma entre dos: común. Pinza a los dos: común."

  - id: ordene-actuacion
    tipo: pregunta
    fase: "Ordene"
    titulo: "El orden de actuación"
    texto: "Ordene cómo se ataca la interferencia conducida."
    libro: [289, 290]
    ordenar:
      - "Reducir el ruido en origen: flancos más lentos, bucles menores"
      - "Filtrar en el punto de entrada o salida del recinto"
      - "Apantallar, como última capa"
    exito: "Un filtro lejos del conector deja el tramo intermedio como antena: por eso va en el propio conector."
    pistas:
      - { texto: "La pantalla es siempre la última capa." }
    escalera:
      - "¿Qué es lo más barato: no generar el ruido o frenarlo después?"
    solucion: "Origen, filtro en la entrada del recinto, pantalla."

  - id: banco-pinza
    tipo: pregunta
    titulo: "En el banco"
    texto: "Mide el modo común de un cable con una pinza de corriente, pone un condensador X y vuelve a medir. ¿Qué ve?"
    libro: [292, 293]
    widget:
      tipo: figura
      figura: fig-32.10
      zonas:
        - { id: filtro-x, rotulo: "Filtro diferencial", rect: [14, 142, 194, 40] }
    opciones:
      - texto: "Nada cambia: el X filtra el otro modo"
        bien: true
        porque: "Con el choke la reducción es visible; con el X, no. Por eso distinguir los modos no es un tecnicismo."
      - texto: "Baja mucho: un condensador siempre filtra"
        porque: "Filtra entre conductores, donde no está el modo común."
      - texto: "Sube, porque el condensador añade capacidad a chasis"
        porque: "El X va entre conductores, no a chasis."
    escalera:
      - "¿Entre qué puntos va el condensador X?"
    solucion: "Nada: el X no ve el modo común."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [267, 268, 272, 278, 279]
    ideas:
      - { titulo: "Dos modos.", texto: "Diferencial entre conductores; común en los dos a la vez, con vuelta por tierra o chasis." }
      - { titulo: "El común es el problema.", texto: "Radia, se capta y apenas se ve." }
      - { titulo: "Cada uno, su filtro.", texto: "X y bobina en serie para el diferencial; choke y Y para el común." }
      - { titulo: "Medir antes.", texto: "Resta y suma de dos canales, o una pinza alrededor de los dos." }
