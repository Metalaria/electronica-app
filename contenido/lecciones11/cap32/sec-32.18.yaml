# Lección 1.2 de la sección 32.18 «Ampliación: Ensayos Normativos de EMC» (cap32). Formato: GUIA.md.
# El contenido espectral de un flanco llega hasta 1/(π·t_subida) (bloque 572); se compara con las bandas de los
# ensayos del bloque 569 (conducida 150 kHz–30 MHz, radiada desde 30 MHz).
# 1.2.1 (autor121-ana, «aprender haciendo», GUIA §13): el contenido de un flanco de 1 ns se predice, los flancos se
# frenan hasta salir de la banda radiada (objetivo) y se marca el primer armónico de una conmutada de 100 kHz (de
# ejemplo) que entra en la conducida. «En el diseño, no en el ensayo» pasa al resumen. Quedan el emparejamiento de
# ensayos y una pregunta de opciones (la LISN).
# 1.3 (contenido13): + marcar el tiempo de subida que llega justo a 30 MHz y + subir una conmutada de ejemplo hasta que
# su fundamental cae en la conducida: 3/5 → 5/7.
leccion: cap32/sec-32.18

libro:
  567: "demostrar el cumplimiento es lo que convierte un prototipo en producto"
  569: "Resistencia a descargas y picos"
  570: "presentar una impedancia definida y reproducible"
  571: "es justo la banda donde trabajan los convertidores conmutados"
  572: "porque el contenido espectral se extiende hasta 1/(π·tsubida)"
  573: "Es el mismo método diferencial del capítulo 55 aplicado a EMC"

modelo:
  valores:
    t_r: { sim: "t_{subida}", nombre: "tiempo de subida", unidad: s, valor: 100e-9 }
    f_s: { sim: "f_{conmutación}", nombre: "conmutación de ejemplo", unidad: Hz, valor: 100000 }
    f_ci: { sim: "f", nombre: "inicio de la conducida", unidad: Hz, valor: 150000 }
    f_ri: { sim: "f", nombre: "inicio de la radiada", unidad: Hz, valor: 30000000 }
  calculos:
    f_x: { expr: "1/(pi*t_r)", sim: "f", nombre: "contenido espectral hasta", unidad: Hz }
    f_1: { expr: "1/t_r", sim: "1/t", nombre: "sin el π", unidad: Hz }
    f_2: { expr: "2*f_s", sim: "2f", nombre: "segundo armónico", unidad: Hz }
    t_l: { expr: "1/(pi*f_ri)", sim: "t_{subida}", nombre: "subida que llega justo a 30 MHz", unidad: s }
    e_f: { expr: "ceil((f_s - f_ci)/1e12)", sim: "dentro", nombre: "fundamental dentro de la conducida", unidad: "" }

tarjetas:
  - id: prediga-flanco
    tipo: simular
    titulo: "Un flanco de 1 ns"
    texto: "Un microcontrolador conmuta sus salidas con flancos de 1 ns. ¿Hasta qué frecuencia llega su contenido espectral?"
    libro: [569, 572]
    fijar: { t_r: 1e-9 }
    simular:
      objetivo: f_x
      unidad: Hz
      tol: 0.02
      rotulo: "Contenido hasta"
      errores:
        - { expr: "f_1", texto: "Falta el π: 1/(π · t_{subida})." }
    exito: "Unos 318 MHz: de lleno en la emisión radiada, de 30 MHz a 1 GHz."
    escalera:
      - "Calcule 1/(π · t_{subida})."
    solucion: "1/(π · 1 ns) ≈ 318 MHz."
    comprobar:
      - { f_x: 318000000, tol: 0.002 }

  - id: explore-flancos
    tipo: explorar
    titulo: "Flancos y espectro"
    texto: "El contenido espectral de un flanco llega hasta 1/(π · t_{subida}). Frene el flanco hasta sacar ese contenido de la banda de emisión radiada."
    libro: [572]
    inicio: { t_r: 1e-9 }
    widget:
      tipo: grafica
      x: { id: tt, min: 1e-9, max: 1e-6, unidad: s, rotulo: "tiempo de subida", escala: log }
      y: { min: 100000, max: 1000000000, unidad: Hz, rotulo: "contenido espectral hasta", escala: log }
      curvas:
        - { expr: "1/(pi*tt)", color: azul, rotulo: "1/(π · t_{subida})" }
        - { expr: "30000000", color: tinta, rotulo: "inicio de la emisión radiada", discontinua: true }
        - { expr: "150000", color: verde, rotulo: "inicio de la conducida", discontinua: true }
      marcas:
        - { x: "t_r", y: "f_x", rotulo: "{{f_x}}" }
      lectura: { valor: f_x, rotulo: "Contenido hasta" }
      mandos:
        - { valor: t_r, lista: [1e-9, 10e-9, 100e-9, 1e-6], rotulo: "Tiempo de subida" }
    objetivo:
      condiciones:
        - { valor: f_x, max: 30000000, rotulo: "Contenido hasta: {{f_x}}" }
      logrado: "Con {{t_r}} de subida, el contenido llega a {{f_x}}: fuera de la radiada. Flancos no más rápidos de lo necesario."
      pistas:
        - { texto: "Aún llega a la radiada: frene más el flanco." }
    escalera:
      - "Diez veces más lento, diez veces menos frecuencia."
    solucion: "100 ns: unos 3,2 MHz."
    comprobar:
      - { con: { t_r: 10e-9 }, f_x: 31.8e6, tol: 0.002 }
      - { con: { t_r: 100e-9 }, f_x: 3.18e6, tol: 0.002 }

  - id: marque-limite
    tipo: marcar
    titulo: "El flanco que entra en la radiada"
    texto: "La radiada empieza en 30 MHz. Marque en la curva el tiempo de subida con el que el contenido llega justo a 30 MHz."
    libro: [569, 572]
    widget:
      tipo: grafica
      x: { id: tt, min: 1e-9, max: 1e-6, unidad: s, rotulo: "tiempo de subida", escala: log }
      y: { min: 100000, max: 1000000000, unidad: Hz, rotulo: "contenido espectral hasta", escala: log }
      curvas:
        - { expr: "1/(pi*tt)", color: azul, rotulo: "1/(π · t_{subida})" }
        - { expr: "30000000", color: tinta, rotulo: "inicio de la emisión radiada", discontinua: true }
      mandos: []
    marcar:
      modo: x
      curva: 0
      x: "t_l"
      tol: 0.04
      inicio: { x: 3e-7, y: 1000000 }
      rotulo: "Justo en 30 MHz"
    pistas:
      - { cuando: { valor: marca_x, mayor: 1.2e-8 }, texto: "Con ese flanco el contenido se queda por debajo de 30 MHz: más a la izquierda." }
      - { texto: "Ahí el contenido ya pasa de 30 MHz: más a la derecha." }
    exito: "Unos {{t_l}}: más rápido, el flanco ya emite en la radiada. Por eso, tiempos de conmutación no más rápidos de lo necesario."
    escalera:
      - "Busque dónde la curva azul cruza la línea de 30 MHz."
    solucion: "1/(π · 30 MHz) ≈ 10,6 ns."
    comprobar:
      - { t_l: 1.061e-8, f_ri: 30000000 }

  - id: empareje-ensayos
    tipo: pregunta
    fase: "Empareje"
    titulo: "Cada ensayo, su vía"
    texto: "Una cada ensayo con la vía de acoplamiento que examina."
    libro: [569]
    emparejar:
      - ["Emisión conducida", "Conducción: lo que devuelve a la red"]
      - ["Emisión radiada", "Radiación: el campo que emite"]
      - ["Inmunidad radiada", "Radiación: resistir un campo externo"]
      - ["ESD, ráfagas y sobretensión", "Conducción y acoplo: descargas y picos"]
    exito: "Las cuatro familias se corresponden con las cuatro vías ya estudiadas."
    pistas:
      - { texto: "Los transitorios entran por los cables y por acoplo." }
    escalera:
      - "¿Cuáles se miden y cuáles se inyectan?"
    solucion: "Conducida–conducción; radiada–radiación; inmunidad radiada–radiación; transitorios–conducción y acoplo."

  - id: lisn
    tipo: pregunta
    titulo: "La LISN"
    texto: "En el ensayo de emisión conducida, se interpone una red de estabilización entre la red y el equipo. ¿Para qué?"
    libro: [570]
    widget:
      tipo: figura
      figura: fig-32.14
      zonas:
        - { id: emision, rotulo: "Emisión", rect: [5, 2, 217, 104] }
    opciones:
      - texto: "Para presentar una impedancia definida y reproducible, como los 50 Ω de radiofrecuencia"
        bien: true
        porque: "Sin una impedancia conocida, la medida dependería de la instalación y no sería comparable."
      - texto: "Para filtrar el ruido del equipo"
        porque: "La LISN no está para quitar el ruido del equipo, sino para medirlo de forma reproducible."
      - texto: "Para proteger al equipo de las sobretensiones"
        porque: "Eso es cosa de los ensayos de inmunidad; la LISN fija la impedancia de medida."
    escalera:
      - "¿De qué dependería la medida sin ella?"
    solucion: "Impedancia definida y reproducible: la medida no depende de la instalación."

  - id: por-que-150k
    tipo: marcar
    titulo: "Por qué desde 150 kHz"
    texto: "La conducida se mide desde 150 kHz, justo donde trabajan los convertidores. Marque el primer armónico de una conmutada de 100 kHz que cae dentro."
    nota: "Conmutación de ejemplo."
    libro: [569, 571]
    widget:
      tipo: grafica
      x: { id: nu, min: 0, max: 1000000, unidad: Hz, rotulo: "f" }
      y: { min: 0, max: 1.1, unidad: "", rotulo: "nivel relativo" }
      curvas:
        - { expr: "exp(-((nu - f_s)/8000)^2) + 0.5*exp(-((nu - 2*f_s)/8000)^2) + 0.33*exp(-((nu - 3*f_s)/8000)^2) + 0.25*exp(-((nu - 4*f_s)/8000)^2) + 0.2*exp(-((nu - 5*f_s)/8000)^2) + 0.17*exp(-((nu - 6*f_s)/8000)^2) + 0.14*exp(-((nu - 7*f_s)/8000)^2) + 0.12*exp(-((nu - 8*f_s)/8000)^2) + 0.11*exp(-((nu - 9*f_s)/8000)^2)", color: azul, rotulo: "armónicos" }
        - { expr: "ceil((nu - f_ci)/1e12)", color: verde, rotulo: "dentro de la conducida", discontinua: true }
      mandos: []
    marcar:
      modo: x
      curva: 0
      x: "f_2"
      tol: 0.02
      inicio: { x: 700000, y: 0.2 }
      rotulo: "Primer armónico dentro"
    pistas:
      - { cuando: { valor: marca_x, max: 150000 }, texto: "Ese queda por debajo de 150 kHz: fuera del ensayo." }
      - { texto: "Hay uno anterior que ya cae dentro." }
    exito: "El segundo, a 200 kHz, y todos los siguientes caen de lleno en la banda medida: el filtro de entrada de una conmutada no es opcional."
    escalera:
      - "La conducida empieza en 150 kHz."
    solucion: "El de 200 kHz."
    comprobar:
      - { f_2: 200000, f_ci: 150000, f_s: 100000 }

  - id: explore-conmutacion
    tipo: explorar
    titulo: "Hasta la fundamental"
    texto: "Una conmutada de 100 kHz deja su fundamental fuera de la conducida, pero no sus armónicos. Suba la conmutación hasta que la fundamental también caiga dentro."
    nota: "Conmutaciones de ejemplo."
    libro: [569, 571]
    inicio: { f_s: 100000 }
    widget:
      tipo: grafica
      x: { id: nu, min: 0, max: 1000000, unidad: Hz, rotulo: "f" }
      y: { min: 0, max: 1.1, unidad: "", rotulo: "nivel relativo" }
      curvas:
        - { expr: "exp(-((nu - f_s)/8000)^2) + 0.5*exp(-((nu - 2*f_s)/8000)^2) + 0.33*exp(-((nu - 3*f_s)/8000)^2) + 0.25*exp(-((nu - 4*f_s)/8000)^2)", color: azul, rotulo: "armónicos" }
        - { expr: "ceil((nu - f_ci)/1e12)", color: verde, rotulo: "dentro de la conducida", discontinua: true }
      mandos:
        - { valor: f_s, lista: [50000, 100000, 200000], rotulo: "Conmutación" }
    objetivo:
      condiciones:
        - { valor: e_f, min: 1, rotulo: "Fundamental dentro" }
      logrado: "A {{f_s}}, hasta la fundamental cae en la banda medida. Con cualquier conmutada, algo cae dentro: el filtro de entrada no es opcional."
      pistas:
        - { texto: "La conducida empieza en 150 kHz: suba la conmutación." }
    escalera:
      - "La fundamental debe pasar de 150 kHz."
    solucion: "A 200 kHz."
    comprobar:
      - { con: { f_s: 200000 }, e_f: 1 }
      - { e_f: 0 }

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [567, 569, 570, 571, 572, 573]
    ideas:
      - { titulo: "Cuatro familias.", texto: "Emisión conducida y radiada, inmunidad radiada y transitorios: las cuatro vías." }
      - { titulo: "La LISN.", texto: "Una impedancia definida y reproducible para medir la conducida." }
      - { titulo: "150 kHz.", texto: "Justo donde conmutan los convertidores: el filtro de entrada no es opcional." }
      - { titulo: "En el diseño.", texto: "El espectro llega a 1/(π · t_{subida}). Corregir en el laboratorio cuesta un orden de magnitud más que preverlo." }
