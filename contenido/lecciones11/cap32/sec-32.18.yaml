# Lección 1.2 de la sección 32.18 «Ampliación: Ensayos Normativos de EMC» (cap32). Formato: GUIA.md.
# El contenido espectral de un flanco llega hasta 1/(π·t_subida) (bloque 572); se compara con las bandas de los
# ensayos del bloque 569 (conducida 150 kHz–30 MHz, radiada desde 30 MHz).
leccion: cap32/sec-32.18

libro:
  567: "demostrar el cumplimiento es lo que convierte un prototipo en producto"
  569: "Resistencia a descargas y picos"
  570: "presentar una impedancia definida y reproducible"
  571: "es justo la banda donde trabajan los convertidores conmutados"
  572: "porque el contenido espectral se extiende hasta 1/(π·tsubida)"
  573: "Es el mismo método diferencial del capítulo 55 aplicado a EMC"

modelo:
  valores:
    t_r: { sim: "t_{subida}", nombre: "tiempo de subida", unidad: s, valor: 100e-9 }
  calculos:
    f_x: { expr: "1/(pi*t_r)", sim: "f", nombre: "contenido espectral hasta", unidad: Hz }

tarjetas:
  - id: explore-flancos
    tipo: explorar
    titulo: "Flancos y espectro"
    texto: "El contenido espectral de un flanco se extiende hasta 1/(π · t_{subida}). Cambie el tiempo de subida y mire hasta dónde llega."
    libro: [572]
    widget:
      tipo: grafica
      x: { id: tt, min: 1e-9, max: 1e-6, unidad: s, rotulo: "tiempo de subida", escala: log }
      y: { min: 100000, max: 1000000000, unidad: Hz, rotulo: "contenido espectral hasta", escala: log }
      curvas:
        - { expr: "1/(pi*tt)", color: azul, rotulo: "1/(π · t_{subida})" }
        - { expr: "30000000", color: tinta, rotulo: "inicio de la emisión radiada", discontinua: true }
        - { expr: "150000", color: verde, rotulo: "inicio de la conducida", discontinua: true }
      marcas:
        - { x: "t_r", y: "f_x", rotulo: "{{f_x}}" }
      lectura: { valor: f_x, rotulo: "Contenido hasta" }
      mandos:
        - { valor: t_r, lista: [1e-9, 10e-9, 100e-9, 1e-6], rotulo: "Tiempo de subida" }
    requiere: { mover: [t_r] }

  - id: prediga-flanco
    tipo: predecir
    titulo: "Un flanco de 1 ns"
    texto: "Un microcontrolador conmuta sus salidas con flancos de 1 ns. ¿Hasta qué ensayo llega su contenido espectral?"
    libro: [569, 572]
    fijar: { t_r: 1e-9 }
    widget:
      tipo: grafica
      x: { id: tt, min: 100e-9, max: 1e-6, unidad: s, rotulo: "tiempo de subida", escala: log }
      y: { min: 100000, max: 1000000000, unidad: Hz, rotulo: "contenido espectral hasta", escala: log }
      curvas:
        - { expr: "1/(pi*tt)", color: azul, rotulo: "1/(π · t_{subida})" }
      lectura: { valor: f_x, rotulo: "Contenido hasta" }
      ocultar: true
    opciones:
      - texto: "Hasta la emisión radiada: cientos de megahercios"
        bien: true
        porque: "1/(π · 1 ns) son unos 318 MHz, de lleno en la banda de 30 MHz a 1 GHz."
      - texto: "Solo a la conducida, por debajo de 30 MHz"
        porque: "Eso sería con flancos de unos 10 ns o más lentos."
      - texto: "A ninguno: es una señal digital"
        porque: "Las señales digitales son justo las que tienen flancos rápidos y espectro ancho."
    escalera:
      - "Calcule 1/(π · t_{subida})."
    solucion: "Unos 318 MHz: emisión radiada."
    comprobar:
      - { f_x: 318000000, tol: 0.002 }
      - { con: { t_r: 10e-9 }, f_x: 31.8e6, tol: 0.002 }

  - id: empareje-ensayos
    tipo: pregunta
    fase: "Empareje"
    titulo: "Cada ensayo, su vía"
    texto: "Una cada ensayo con la vía de acoplamiento que examina."
    libro: [569]
    emparejar:
      - ["Emisión conducida", "Conducción: lo que devuelve a la red"]
      - ["Emisión radiada", "Radiación: el campo que emite"]
      - ["Inmunidad radiada", "Radiación: resistir un campo externo"]
      - ["ESD, ráfagas y sobretensión", "Conducción y acoplo: descargas y picos"]
    exito: "Las cuatro familias se corresponden con las cuatro vías ya estudiadas."
    pistas:
      - { texto: "Los transitorios entran por los cables y por acoplo." }
    escalera:
      - "¿Cuáles se miden y cuáles se inyectan?"
    solucion: "Conducida–conducción; radiada–radiación; inmunidad radiada–radiación; transitorios–conducción y acoplo."

  - id: lisn
    tipo: pregunta
    titulo: "La LISN"
    texto: "En el ensayo de emisión conducida, se interpone una red de estabilización entre la red y el equipo. ¿Para qué?"
    libro: [570]
    widget:
      tipo: figura
      figura: fig-32.14
      zonas:
        - { id: emision, rotulo: "Emisión", rect: [5, 2, 217, 104] }
    opciones:
      - texto: "Para presentar una impedancia definida y reproducible, como los 50 Ω de radiofrecuencia"
        bien: true
        porque: "Sin una impedancia conocida, la medida dependería de la instalación y no sería comparable."
      - texto: "Para filtrar el ruido del equipo"
        porque: "La LISN no está para quitar el ruido del equipo, sino para medirlo de forma reproducible."
      - texto: "Para proteger al equipo de las sobretensiones"
        porque: "Eso es cosa de los ensayos de inmunidad; la LISN fija la impedancia de medida."
    escalera:
      - "¿De qué dependería la medida sin ella?"
    solucion: "Impedancia definida y reproducible: la medida no depende de la instalación."

  - id: por-que-150k
    tipo: porque
    titulo: "Por qué desde 150 kHz"
    texto: "La emisión conducida se mide a partir de 150 kHz. ¿Por qué el filtro de entrada de una fuente conmutada no es opcional?"
    libro: [571]
    fijar: { t_r: 100e-9 }
    widget:
      tipo: grafica
      x: { id: tt, min: 1e-9, max: 1e-6, unidad: s, rotulo: "tiempo de subida", escala: log }
      y: { min: 100000, max: 1000000000, unidad: Hz, rotulo: "contenido espectral hasta", escala: log }
      curvas:
        - { expr: "1/(pi*tt)", color: azul, rotulo: "1/(π · t_{subida})" }
        - { expr: "150000", color: verde, rotulo: "inicio de la conducida", discontinua: true }
    opciones:
      - texto: "Es la banda donde trabajan los convertidores conmutados: sus armónicos caen de lleno en lo que se mide"
        bien: true
        porque: "Por eso el filtro de entrada forma parte del diseño de toda fuente conmutada."
      - texto: "Porque por debajo de 150 kHz no hay ruido"
        porque: "Lo hay; el límite inferior del ensayo deja dentro justo la conmutación."
      - texto: "Porque la red de 50 Hz molesta por debajo"
        porque: "La red está muy por debajo; la razón es la frecuencia de los convertidores."
    escalera:
      - "¿A qué frecuencias conmutan los convertidores?"
    solucion: "Los convertidores conmutan ahí y sus armónicos llenan la banda medida."

  - id: diseno-o-ensayo
    tipo: pregunta
    titulo: "En el diseño, no en el ensayo"
    texto: "Según la regla práctica del sector, ¿cuánto más cuesta corregir un problema de EMC en el laboratorio que preverlo en el diseño?"
    libro: [567, 572, 573]
    widget:
      tipo: grafica
      x: { id: tt, min: 1e-9, max: 1e-6, unidad: s, rotulo: "tiempo de subida", escala: log }
      y: { min: 100000, max: 1000000000, unidad: Hz, rotulo: "contenido espectral hasta", escala: log }
      curvas:
        - { expr: "1/(pi*tt)", color: azul, rotulo: "1/(π · t_{subida})" }
    opciones:
      - texto: "Un orden de magnitud más"
        bien: true
        porque: "Por eso se reducen bucles, se filtra en la entrada, se eligen flancos no más rápidos de lo necesario y se separan zonas."
      - texto: "Lo mismo, solo que más tarde"
        porque: "Más tarde es más caro: rediseño, repetición del ensayo y retraso."
      - texto: "Menos: el laboratorio dice exactamente qué falla"
        porque: "Dice que falla, no por qué; y cada visita cuesta. En casa, la preconformidad localiza el foco."
    escalera:
      - "¿Qué hay que repetir si se suspende?"
    solucion: "Un orden de magnitud más: se previene en el diseño."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [569, 570, 571, 572]
    ideas:
      - { titulo: "Cuatro familias.", texto: "Emisión conducida y radiada, inmunidad radiada y transitorios: las cuatro vías." }
      - { titulo: "La LISN.", texto: "Una impedancia definida y reproducible para medir la conducida." }
      - { titulo: "150 kHz.", texto: "Justo donde conmutan los convertidores: el filtro de entrada no es opcional." }
      - { titulo: "Flancos.", texto: "El espectro llega a 1/(π · t_{subida}): no más rápidos de lo necesario." }
