# Lección 1.2 de la sección 32.15 «El FM7303 a la Luz de la EMC» (cap32). Formato: contenido/lecciones11/GUIA.md.
# Zonas de la figura 32.17 (fig-32.16, svg_vista 453,6 × 225,36), medidas sobre el dibujo.
leccion: cap32/sec-32.15

modelo: { valores: {}, calculos: {} }

libro:
  458: "es a la vez víctima y fuente"
  461: "los armónicos de su reloj caen dentro de la banda o en la FI y producen los puntos ciegos"
  463: "cuyos picos de consumo modulan la alimentación y con ella la ganancia del receptor"
  465: "si el ruido desaparece al desconectar la antena, viene del aire; si no, viene de dentro"
  468: "El oscilador local emite a través de la antena"
  470: "Los cables, actuando como antena para el modo común"
  473: "las etapas de ganancia alta quedan separadas entre sí"
  474: "Regulación lineal para la parte de radio, y un regulador propio para el display"
  475: "Separación física del display y de la antena"
  478: "Filtrar la alimentación del display con una ferrita y un condensador, que es el cambio más rentable"
  480: "Separar retornos de audio y de radio, uniéndolos en un solo punto"
  481: "con resistencias en serie en sus líneas de segmentos y de dígitos"
  484: "primero el trazado y las masas, después el filtrado, y el apantallamiento como última capa"
  485: "es lo más caro y lo menos eficaz"
  488: "Cada cambio que reduce el ruido identifica una fuente, y la comparación es la medida"

tarjetas:
  - id: explore-receptor
    tipo: explorar
    titulo: "Víctima y fuente"
    texto: "El receptor recibe microvoltios y lleva dentro un frecuencímetro con su reloj y un amplificador de audio. Toque sus dos papeles."
    libro: [458]
    widget:
      tipo: figura
      figura: fig-32.16
      zonas:
        - { id: victima, rotulo: "Recuadro de la izquierda", rect: [2, 2, 172, 122], texto: "Como víctima: el display, la alimentación, el audio y el entorno degradan su recepción." }
        - { id: fuente, rotulo: "Recuadro de la derecha", rect: [293, 2, 159, 122], texto: "Como fuente: el oscilador local, el frecuencímetro y los cables emiten." }
        - { id: receptor, rotulo: "Caja del centro", rect: [203, 37, 62, 51], texto: "El FM7303: recibe microvoltios y pide picos de corriente." }
    requiere: { mover: [victima, fuente] }

  - id: puntos-ciegos
    tipo: pregunta
    titulo: "Puntos ciegos en el dial"
    texto: "En algunas frecuencias del dial el receptor se queda sordo. ¿Cuál es el sospechoso principal?"
    libro: [461, 463]
    widget:
      tipo: figura
      figura: fig-32.16
      zonas:
        - { id: victima, rotulo: "Como víctima", rect: [2, 2, 172, 122] }
    opciones:
      - texto: "El display: los armónicos de su reloj caen en la banda o en la FI"
        bien: true
        porque: "Es el primero en orden de importancia; su refresco, además, da chasquidos o un zumbido leve."
      - texto: "El amplificador de audio"
        porque: "Sus picos de consumo modulan la ganancia, pero no crean puntos ciegos en frecuencias concretas."
      - texto: "La antena, por ser corta"
        porque: "Una antena corta baja la señal en toda la banda, no en frecuencias sueltas."
    escalera:
      - "¿Qué bloque tiene un reloj con armónicos?"
    solucion: "El display: los armónicos de su reloj."

  - id: antena
    tipo: pregunta
    titulo: "¿Del aire o de dentro?"
    texto: "Desconecta la antena y el ruido sigue igual. ¿De dónde viene?"
    libro: [465]
    widget:
      tipo: figura
      figura: fig-32.16
      zonas:
        - { id: victima, rotulo: "Como víctima", rect: [2, 2, 172, 122] }
    opciones:
      - texto: "De dentro del propio equipo"
        bien: true
        porque: "Si desapareciera al quitar la antena, vendría del aire."
      - texto: "Del aire, de una fuente conmutada cercana"
        porque: "Lo que viene del aire entra por la antena: sin ella se iría."
      - texto: "No se puede saber así"
        porque: "Es justo la observación que ordena el diagnóstico."
    escalera:
      - "¿Por dónde entra lo que viene del aire?"
    solucion: "De dentro: sin antena, lo del aire no entraría."

  - id: como-fuente
    tipo: pregunta
    titulo: "Un receptor que emite"
    texto: "Un receptor parece pasivo. ¿Por qué la normativa también limita sus emisiones?"
    libro: [468, 470]
    widget:
      tipo: figura
      figura: fig-32.16
      zonas:
        - { id: fuente, rotulo: "Como fuente", rect: [293, 2, 159, 122] }
    opciones:
      - texto: "Su oscilador local emite a través de la antena"
        bien: true
        porque: "Además emiten el frecuencímetro y los cables, como antena del modo común."
      - texto: "Porque amplifica las emisoras que recibe"
        porque: "Amplificar dentro no es emitir; lo que sale es su propio oscilador."
      - texto: "No la limita: solo se ensaya su inmunidad"
        porque: "Sí la limita, precisamente por el oscilador local."
    escalera:
      - "¿Qué oscilador lleva dentro un superheterodino?"
    solucion: "El oscilador local sale por la antena."

  - id: empareje-bien
    tipo: pregunta
    fase: "Empareje"
    titulo: "Lo que el diseño hace bien"
    texto: "Una cada decisión deliberada del FM7303 con lo que consigue."
    libro: [473, 474, 475]
    emparejar:
      - ["Cada bloque en su propio integrado", "Separa las etapas de ganancia alta"]
      - ["Regulador lineal para la radio y otro para el display", "Alimentaciones que no se ensucian entre sí"]
      - ["Display lejos de la antena", "Separación física de la fuente y la víctima"]
    exito: "Son decisiones de EMC, aunque no lo parezcan."
    pistas:
      - { texto: "La distancia es el remedio más simple." }
    escalera:
      - "¿Qué se ensucia si display y radio comparten regulador?"
    solucion: "Integrados–ganancias separadas; reguladores–alimentaciones limpias; distancia–menos acoplo."

  - id: toque-rentable
    tipo: tocar
    titulo: "El cambio más rentable"
    texto: "De las mejoras posibles, toque la que el libro señala como el cambio más rentable."
    libro: [478, 480]
    widget:
      tipo: figura
      figura: fig-32.16
      zonas:
        - { id: trazado, rotulo: "Caja de abajo a la izquierda", rect: [2, 153, 135, 41] }
        - { id: filtrado, rotulo: "Caja de abajo en el centro", rect: [159, 153, 135, 41] }
        - { id: pantalla, rotulo: "Caja de abajo a la derecha", rect: [316, 153, 135, 41] }
    tocar:
      bien: [filtrado]
      porque:
        trazado: "Unir los retornos en un punto va primero en el orden, pero el más rentable es el filtro del display."
        pantalla: "La caja de hojalata es la última capa: lo más caro y lo menos eficaz si se empieza por ahí."
    exito: "Una ferrita y un condensador en la alimentación del display: poco coste, mucho efecto."
    escalera:
      - "¿Qué cuesta dos componentes y ataca al sospechoso principal?"
    solucion: "El filtrado: ferrita y condensador en el display."

  - id: flancos-display
    tipo: pregunta
    titulo: "Los flancos del display"
    texto: "Las líneas de segmentos y dígitos del display son accesibles. ¿Qué se les puede hacer?"
    libro: [481]
    widget:
      tipo: figura
      figura: fig-32.16
      zonas:
        - { id: fuente, rotulo: "Como fuente", rect: [293, 2, 159, 122] }
    opciones:
      - texto: "Resistencias en serie que reduzcan la velocidad de flanco"
        bien: true
        porque: "Flancos más lentos, armónicos altos más bajos."
      - texto: "Condensadores X entre ellas"
        porque: "Los X son de filtros de red, entre línea y neutro."
      - texto: "Alargarlas para separar el display"
        porque: "Más longitud es más antena."
    escalera:
      - "¿Qué determina la amplitud de los armónicos altos?"
    solucion: "Resistencias en serie: flancos más lentos."

  - id: ordene-mejora
    tipo: pregunta
    fase: "Ordene"
    titulo: "El orden correcto"
    texto: "Ordene las mejoras del receptor."
    libro: [484, 485]
    ordenar:
      - "Trazado y masas"
      - "Filtrado"
      - "Apantallamiento"
    exito: "Empezar por apantallar es lo que hace la mayoría: lo más caro y lo menos eficaz."
    pistas:
      - { texto: "La pantalla, la última capa." }
    escalera:
      - "Lo gratis primero."
    solucion: "Trazado y masas, filtrado, apantallamiento."

  - id: banco-escuchar
    tipo: pregunta
    titulo: "En el banco, con el oído"
    texto: "Sintoniza una frecuencia sin emisora, escucha el ruido de fondo y apaga el display: el ruido baja. ¿Qué ha medido?"
    libro: [488]
    widget:
      tipo: figura
      figura: fig-32.16
      zonas:
        - { id: victima, rotulo: "Como víctima", rect: [2, 2, 172, 122] }
    opciones:
      - texto: "Que el display es una fuente de ruido para el receptor"
        bien: true
        porque: "Cada cambio que reduce el ruido identifica una fuente: la comparación es la medida."
      - texto: "Nada: sin instrumentos no hay medida"
        porque: "El cambio de ruido al apagar el display ya es una medida comparativa."
      - texto: "Que la emisora estaba mal sintonizada"
        porque: "No había emisora: se escucha el ruido de fondo a propósito."
    escalera:
      - "¿Qué ha cambiado entre las dos escuchas?"
    solucion: "El display mete ruido: lo ha identificado comparando."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [458, 461, 465, 478, 484]
    ideas:
      - { titulo: "Víctima y fuente.", texto: "Recibe microvoltios y emite por su oscilador local, su display y sus cables." }
      - { titulo: "El sospechoso.", texto: "El display: armónicos de su reloj en la banda o en la FI." }
      - { titulo: "Diagnóstico.", texto: "Sin antena: si el ruido sigue, viene de dentro." }
      - { titulo: "Mejorar.", texto: "Trazado, filtrado del display y, al final, pantalla." }
