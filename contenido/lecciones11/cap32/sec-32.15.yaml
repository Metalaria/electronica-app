# Lección 1.2 de la sección 32.15 «El FM7303 a la Luz de la EMC» (cap32). Formato: contenido/lecciones11/GUIA.md.
# Zonas de la figura 32.17 (fig-32.16, svg_vista 453,6 × 225,36), medidas sobre el dibujo.
# 1.2.1 (autor121-ana, «aprender haciendo», GUIA §13): el papel de fuente se toca en la fig. 32.17 (el oscilador local
# va en su explicación), la antena se desconecta y el display se apaga escuchando el ruido de fondo (objetivos; ruido
# relativo de ejemplo) y el cambio más rentable se toca (los flancos del display van en su explicación). La ordenación
# pasa al resumen. Quedan el emparejamiento de lo que hace bien y una pregunta de opciones (los puntos ciegos): 67 %,
# porque es un caso de estudio.
# 1.3 (contenido13): + predecir la frecuencia que emite el oscilador local con el dial en 88 MHz (FI de 10,7 MHz,
# bloque cap16#435): 4/6 → 5/7.
leccion: cap32/sec-32.15

modelo:
  valores:
    a_n: { tipo: interruptor, nombre: "antena conectada", valor: 1 }
    d_p: { tipo: interruptor, nombre: "display encendido", valor: 1 }
    f_em: { sim: "f_{emisora}", nombre: "emisora sintonizada", unidad: Hz, valor: 88000000 }
    f_fi: { sim: "FI", nombre: "frecuencia intermedia", unidad: Hz, valor: 10700000 }
  calculos:
    f_ol: { expr: "f_em + f_fi", sim: "f_{oscilador}", nombre: "frecuencia del oscilador local", unidad: Hz }
    f_ma: { expr: "f_em - f_fi", sim: "f_{emisora} − FI", nombre: "la intermedia restada", unidad: Hz }
    r_f: { expr: "0.3 + 0.7*d_p", sim: "ruido", nombre: "ruido de fondo, relativo y de ejemplo", unidad: "" }

libro:
  458: "es a la vez víctima y fuente"
  461: "los armónicos de su reloj caen dentro de la banda o en la FI y producen los puntos ciegos"
  463: "cuyos picos de consumo modulan la alimentación y con ella la ganancia del receptor"
  465: "si el ruido desaparece al desconectar la antena, viene del aire; si no, viene de dentro"
  468: "El oscilador local emite a través de la antena"
  470: "Los cables, actuando como antena para el modo común"
  473: "las etapas de ganancia alta quedan separadas entre sí"
  474: "Regulación lineal para la parte de radio, y un regulador propio para el display"
  475: "Separación física del display y de la antena"
  478: "Filtrar la alimentación del display con una ferrita y un condensador, que es el cambio más rentable"
  480: "Separar retornos de audio y de radio, uniéndolos en un solo punto"
  481: "con resistencias en serie en sus líneas de segmentos y de dígitos"
  484: "primero el trazado y las masas, después el filtrado, y el apantallamiento como última capa"
  485: "es lo más caro y lo menos eficaz"
  488: "Cada cambio que reduce el ruido identifica una fuente, y la comparación es la medida"
  490: "El receptor como víctima y como fuente de interferencia"
  487: "sintonizar una frecuencia sin emisora y escuchar el ruido de fondo"
  482: "Ferritas en los cables que salen de la caja"
  "cap16#435": "El oscilador local, entre 98,7 y 118,7 MHz"

tarjetas:
  - id: explore-receptor
    tipo: tocar
    titulo: "Víctima y fuente"
    texto: "El receptor recibe microvoltios y lleva dentro un frecuencímetro con su reloj. Toque el papel por el que la normativa también limita sus emisiones."
    libro: [458, 468, 470, 490]
    widget:
      tipo: figura
      figura: fig-32.16
      zonas:
        - { id: victima, rotulo: "Recuadro de la izquierda", rect: [2, 2, 172, 122] }
        - { id: receptor, rotulo: "Caja del centro", rect: [203, 37, 62, 51] }
        - { id: fuente, rotulo: "Recuadro de la derecha", rect: [293, 2, 159, 122] }
    tocar:
      bien: [fuente]
      porque:
        victima: "Como víctima, el display, la alimentación y el entorno degradan su recepción: eso lo mide la inmunidad."
        receptor: "Es el propio FM7303; la pregunta es por cuál de sus dos papeles."
    exito: "Como fuente: su oscilador local emite a través de la antena; además emiten el frecuencímetro y los cables, como antena del modo común."
    escalera:
      - "¿Qué oscilador lleva dentro un superheterodino?"
    solucion: "Como fuente."

  - id: prediga-oscilador
    tipo: simular
    titulo: "Lo que emite por la antena"
    texto: "El oscilador local va siempre 10,7 MHz por encima de la emisora, la FI, y emite por la antena. Con el dial en 88 MHz, ¿a qué frecuencia emite?"
    libro: [468, "cap16#435"]
    fijar: { f_em: 88000000 }
    simular:
      objetivo: f_ol
      unidad: Hz
      tol: 0.002
      rotulo: "Frecuencia del oscilador local"
      errores:
        - { expr: "f_em", texto: "Esa es la emisora. El oscilador va una FI por encima." }
        - { expr: "f_ma", texto: "Ha restado la FI. En el FM7303 el oscilador va por encima de la emisora." }
    exito: "98,7 MHz: dentro de la banda de FM. Recorriendo el dial, el oscilador va de 98,7 a 118,7 MHz; por eso los receptores tienen límites de emisión."
    escalera:
      - "Sume la FI, 10,7 MHz, a la emisora."
    solucion: "88 + 10,7 = 98,7 MHz."
    comprobar:
      - { f_ol: 98700000, f_ma: 77300000, f_fi: 10700000 }

  - id: puntos-ciegos
    tipo: pregunta
    titulo: "Puntos ciegos en el dial"
    texto: "En algunas frecuencias del dial el receptor se queda sordo. ¿Cuál es el sospechoso principal?"
    libro: [461, 463]
    widget:
      tipo: figura
      figura: fig-32.16
      zonas:
        - { id: victima, rotulo: "Como víctima", rect: [2, 2, 172, 122] }
    opciones:
      - texto: "El display: los armónicos de su reloj caen en la banda o en la FI"
        bien: true
        porque: "Es el primero en orden de importancia; su refresco, además, da chasquidos o un zumbido leve."
      - texto: "El amplificador de audio"
        porque: "Sus picos de consumo modulan la ganancia, pero no crean puntos ciegos en frecuencias concretas."
      - texto: "La antena, por ser corta"
        porque: "Una antena corta baja la señal en toda la banda, no en frecuencias sueltas."
    escalera:
      - "¿Qué bloque tiene un reloj con armónicos?"
    solucion: "El display: los armónicos de su reloj."

  - id: antena
    tipo: explorar
    titulo: "¿Del aire o de dentro?"
    texto: "Sintonice una frecuencia sin emisora y escuche el ruido de fondo. Desconecte la antena y compare."
    nota: "Ruido relativo, de ejemplo."
    libro: [465, 487]
    fijar: { d_p: 1 }
    inicio: { a_n: 1 }
    widget:
      tipo: grafica
      x: { id: xx, min: 0, max: 1, unidad: "", rotulo: "" }
      y: { min: 0, max: 1.2, unidad: "", rotulo: "ruido de fondo, relativo" }
      curvas:
        - { expr: "r_f", color: azul, rotulo: "ruido" }
      lectura: { valor: r_f, rotulo: "Ruido de fondo" }
      mandos:
        - { valor: a_n, tipo: interruptor, rotulo: "Antena conectada" }
    objetivo:
      condiciones:
        - { valor: a_n, max: 0, rotulo: "Antena desconectada" }
      logrado: "Sin antena, el ruido sigue en {{r_f}}: viene de dentro del propio equipo. Si desapareciera, vendría del aire."
      pistas:
        - { texto: "Desconecte la antena." }
    escalera:
      - "Lo que viene del aire entra por la antena."
    solucion: "Sigue igual: de dentro."
    comprobar:
      - { con: { a_n: 0 }, r_f: 1 }

  - id: empareje-bien
    tipo: pregunta
    fase: "Empareje"
    titulo: "Lo que el diseño hace bien"
    texto: "Una cada decisión deliberada del FM7303 con lo que consigue."
    libro: [473, 474, 475]
    emparejar:
      - ["Cada bloque en su propio integrado", "Separa las etapas de ganancia alta"]
      - ["Regulador lineal para la radio y otro para el display", "Alimentaciones que no se ensucian entre sí"]
      - ["Display lejos de la antena", "Separación física de la fuente y la víctima"]
    exito: "Son decisiones de EMC, aunque no lo parezcan."
    pistas:
      - { texto: "La distancia es el remedio más simple." }
    escalera:
      - "¿Qué se ensucia si display y radio comparten regulador?"
    solucion: "Integrados–ganancias separadas; reguladores–alimentaciones limpias; distancia–menos acoplo."

  - id: toque-rentable
    tipo: tocar
    titulo: "El cambio más rentable"
    texto: "De las mejoras posibles, toque la que el libro señala como el cambio más rentable."
    libro: [478, 480, 481, 482]
    widget:
      tipo: figura
      figura: fig-32.16
      zonas:
        - { id: trazado, rotulo: "Caja de abajo a la izquierda", rect: [2, 153, 135, 41] }
        - { id: filtrado, rotulo: "Caja de abajo en el centro", rect: [159, 153, 135, 41] }
        - { id: pantalla, rotulo: "Caja de abajo a la derecha", rect: [316, 153, 135, 41] }
    tocar:
      bien: [filtrado]
      porque:
        trazado: "Unir los retornos en un punto va primero en el orden, pero el más rentable es el filtro del display."
        pantalla: "La caja de hojalata es la última capa: lo más caro y lo menos eficaz si se empieza por ahí."
    exito: "Una ferrita y un condensador en la alimentación del display: poco coste, mucho efecto. Si sus líneas son accesibles, resistencias en serie que frenen los flancos; y ferritas en los cables."
    escalera:
      - "¿Qué cuesta dos componentes y ataca al sospechoso principal?"
    solucion: "El filtrado: ferrita y condensador en el display."

  - id: banco-escuchar
    tipo: explorar
    titulo: "En el banco, con el oído"
    texto: "Con la antena puesta y una frecuencia sin emisora, apague el display y escuche el ruido de fondo."
    nota: "Ruido relativo, de ejemplo."
    libro: [487, 488]
    fijar: { a_n: 1 }
    inicio: { d_p: 1 }
    widget:
      tipo: grafica
      x: { id: xx, min: 0, max: 1, unidad: "", rotulo: "" }
      y: { min: 0, max: 1.2, unidad: "", rotulo: "ruido de fondo, relativo" }
      curvas:
        - { expr: "r_f", color: azul, rotulo: "ruido" }
      lectura: { valor: r_f, rotulo: "Ruido de fondo" }
      mandos:
        - { valor: d_p, tipo: interruptor, rotulo: "Display encendido" }
    objetivo:
      condiciones:
        - { valor: d_p, max: 0, rotulo: "Display apagado" }
      logrado: "El ruido baja a {{r_f}}: el display es una fuente. Cada cambio que reduce el ruido identifica una, y la comparación es la medida."
      pistas:
        - { texto: "Apague el display." }
    escalera:
      - "Compare el ruido antes y después."
    solucion: "Al apagar el display, el ruido baja."
    comprobar:
      - { con: { d_p: 0 }, r_f: 0.3 }

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [458, 461, 465, 478, 484, 485]
    ideas:
      - { titulo: "Víctima y fuente.", texto: "Recibe microvoltios y emite por su oscilador local, su display y sus cables." }
      - { titulo: "El sospechoso.", texto: "El display: armónicos de su reloj en la banda o en la FI." }
      - { titulo: "Diagnóstico.", texto: "Sin antena: si el ruido sigue, viene de dentro." }
      - { titulo: "Mejorar.", texto: "Trazado, filtrado del display y, al final, pantalla: empezar por apantallar es lo más caro y lo menos eficaz." }
