# Lección 1.2 de la sección 32.19 «Problemas de Diseño» (cap32). Formato: contenido/lecciones11/GUIA.md.
# 32.A: Friis con preamplificador (NF 3 dB, 20 dB), filtro (6 dB de pérdida: F = 3,981, G = 0,2512), amplificador
# (NF 10 dB, 30 dB) y convertidor (NF 20 dB). 32.B: I = 2π·f·C_Y·V con 230 V y 50 Hz. 32.C: V = ω·B·A con 1 µT a 50 Hz.
# Ejercicios 32.1 y 32.4 del bloque 618.
leccion: cap32/sec-32.19

libro:
  578: "preamplificador (NF 3 dB, ganancia 20 dB), filtro (pérdida 6 dB)"
  582: "NF total = 3,78 dB"
  583: "71,7 %"
  584: "Comprar un ADC mejor no serviría de nada"
  585: "mejorar el preamplificador de 3 a 1 dB baja el total a unos 2,2 dB"
  591: "Un equipo alimentado a 230 V / 50 Hz"
  595: 'I_("fuga") = "2" π dot.op f dot.op C_("Y") dot.op V'
  596: "72,3 µA"
  597: "Equipo médico tipo B"
  598: "el total no puede pasar de 1,4 nF"
  600: "El choke de modo común no aporta corriente de fuga"
  611: "Par trenzado apretado"
  612: "Trenzar bien mejora por un factor 200"
  614: "el acoplamiento capacitivo, que no depende del área del bucle sino de la proximidad"
  "cap32#618": "Calcula la tensión eficaz de ruido térmico de una resistencia de 10 kΩ a 290 K"

modelo:
  valores:
    N_p: { sim: "NF_{pre}", nombre: "figura de ruido del preamplificador", unidad: dB, valor: 3 }
    N_a: { sim: "NF_{amp}", nombre: "figura de ruido del amplificador", unidad: dB, valor: 10 }
    C_y: { sim: "C_{Y}", nombre: "capacidad Y total", unidad: F, valor: 2.2e-9 }
    A_c: { sim: "A", nombre: "área del bucle", unidad: "cm²", valor: 200 }
  calculos:
    F_p: { expr: "10^(N_p/10)", sim: "F_{pre}", nombre: "factor del preamplificador", unidad: "" }
    c_f: { expr: "(3.981 - 1)/100", sim: "", nombre: "aporte del filtro", unidad: "" }
    c_a: { expr: "(10^(N_a/10) - 1)/(100*0.2512)", sim: "", nombre: "aporte del amplificador", unidad: "" }
    c_c: { expr: "(100 - 1)/(100*0.2512*1000)", sim: "", nombre: "aporte del convertidor", unidad: "" }
    F_t: { expr: "F_p + c_f + c_a + c_c", sim: "F", nombre: "factor de ruido total", unidad: "" }
    N_t: { expr: "10*log10(F_t)", sim: "NF", nombre: "figura de ruido total", unidad: dB, cifras: 3 }
    p_p: { expr: "100*(F_p - 1)/(F_t - 1)", sim: "%", nombre: "aporte del preamplificador", unidad: "%", cifras: 3 }
    p_c: { expr: "100*c_c/(F_t - 1)", sim: "%", nombre: "aporte del convertidor", unidad: "%", cifras: 2 }
    p_a: { expr: "100*c_a/(F_t - 1)", sim: "%", nombre: "aporte del amplificador", unidad: "%", cifras: 3 }
    I_f: { expr: "2*pi*50*C_y*230", sim: "I_{fuga}", nombre: "corriente de fuga", unidad: A }
    C_m: { expr: "0.0001/(2*pi*50*230)", sim: "C_{Y,máx}", nombre: "capacidad máxima para 100 µA", unidad: F }
    V_b: { expr: "2*pi*50*1e-6*A_c*1e-4", sim: "V", nombre: "tensión inducida", unidad: V }
    v_e: { expr: "sqrt(4*1.38e-23*290*10000*10000)", sim: "V_{n}", nombre: "ruido de 10 kΩ en 10 kHz", unidad: V }

tarjetas:
  - id: explore-cadena
    tipo: explorar
    titulo: "Dónde está el ruido de una cadena"
    texto: "Preamplificador, filtro, amplificador y convertidor. Mejore el preamplificador o el amplificador y mire la figura de ruido total."
    libro: [578, 582]
    widget:
      tipo: grafica
      x: { id: xx, min: 0, max: 6, unidad: dB, rotulo: "NF del preamplificador" }
      y: { min: 0, max: 8, unidad: dB, rotulo: "NF total" }
      curvas:
        - { expr: "10*log10(10^(xx/10) + (3.981 - 1)/100 + (10^(N_a/10) - 1)/(100*0.2512) + (100 - 1)/(100*0.2512*1000))", color: azul, rotulo: "NF total" }
      marcas:
        - { x: "N_p", y: "N_t", rotulo: "{{N_t}}" }
      lectura: { valor: N_t, rotulo: "NF total" }
      datos:
        - { valor: p_p, rotulo: "Preamplificador: {{p_p}}" }
        - { valor: p_a, rotulo: "Amplificador: {{p_a}}" }
      mandos:
        - { valor: N_p, lista: [1, 3], rotulo: "NF del preamplificador" }
        - { valor: N_a, lista: [6, 10], rotulo: "NF del amplificador" }
    requiere: { mover: [N_p] }
    comprobar:
      - { con: { N_p: 3, N_a: 10 }, N_t: 3.78, p_p: 71.7, p_a: 25.8, tol: 0.003 }
      - { con: { N_p: 1, N_a: 10 }, N_t: 2.2, tol: 0.02 }
      - { con: { N_p: 3, N_a: 6 }, N_t: 3.3, tol: 0.02 }

  - id: prediga-dominante
    tipo: predecir
    titulo: "El término dominante"
    texto: "El preamplificador es el mejor de la cadena, con 3 dB; el convertidor, el peor, con 20 dB. ¿Quién aporta más al exceso de ruido?"
    libro: [578, 583, 584]
    fijar: { N_p: 3, N_a: 10 }
    widget:
      tipo: grafica
      x: { id: xx, min: 5, max: 6, unidad: dB, rotulo: "NF del preamplificador" }
      y: { min: 0, max: 8, unidad: dB, rotulo: "NF total" }
      curvas:
        - { expr: "10*log10(10^(xx/10) + (3.981 - 1)/100 + (10^(N_a/10) - 1)/(100*0.2512) + (100 - 1)/(100*0.2512*1000))", color: azul, rotulo: "NF total" }
      lectura: { valor: p_p, rotulo: "Aporte del preamplificador" }
      ocultar: true
    opciones:
      - texto: "El preamplificador: casi tres cuartas partes"
        bien: true
        porque: "Es la primera etapa y su ruido no lo divide nada: el 71,7 %."
      - texto: "El convertidor, por su NF de 20 dB"
        porque: "Aporta el 0,3 %: queda dividido por toda la ganancia previa."
      - texto: "El filtro, porque atenúa"
        porque: "Aporta el 2,1 %: su pérdida queda dividida por los 20 dB del preamplificador."
    escalera:
      - "Por Friis, ¿qué divide el ruido de cada etapa?"
    solucion: "El preamplificador, 71,7 %; el convertidor, solo 0,3 %."
    comprobar:
      - { p_p: 71.7, tol: 0.01 }

  - id: invertir
    tipo: pregunta
    titulo: "Dónde invertir"
    texto: "Puede mejorar el preamplificador de 3 a 1 dB, el amplificador de 10 a 6 dB o comprar un convertidor mejor. ¿Qué elige?"
    libro: [584, 585]
    widget:
      tipo: grafica
      x: { id: xx, min: 0, max: 6, unidad: dB, rotulo: "NF del preamplificador" }
      y: { min: 0, max: 8, unidad: dB, rotulo: "NF total" }
      curvas:
        - { expr: "10*log10(10^(xx/10) + (3.981 - 1)/100 + (10^(N_a/10) - 1)/(100*0.2512) + (100 - 1)/(100*0.2512*1000))", color: azul, rotulo: "NF total" }
    opciones:
      - texto: "El preamplificador: el total baja a unos 2,2 dB"
        bien: true
        porque: "El amplificador lo dejaría en 3,3 dB; el convertidor, en nada apreciable."
      - texto: "El convertidor, que es el peor"
        porque: "Comprar un ADC mejor no serviría de nada: aporta el 0,3 %."
      - texto: "El amplificador, que es el más ruidoso"
        porque: "Ayuda algo, a 3,3 dB, pero menos que el preamplificador."
    escalera:
      - "Ataque el término dominante."
    solucion: "El preamplificador: de 3,78 a unos 2,2 dB."

  - id: formula-fuga
    tipo: formula
    titulo: "El límite de un filtro de red"
    texto: "Por los condensadores Y circula siempre una corriente de fuga a frecuencia de red. Con 230 V y 50 Hz:"
    libro: [591, 595, 596]
    ec: 595
    sustitucion: "2π · 50 Hz · {{C_y}} · 230 V = {{I_f}}"
    widget:
      tipo: grafica
      x: { id: cc, min: 0, max: 5e-9, unidad: F, rotulo: "C_{Y} total" }
      y: { min: 0, max: 0.0004, unidad: A, rotulo: "corriente de fuga" }
      curvas:
        - { expr: "2*pi*50*cc*230", color: azul, rotulo: "fuga" }
      marcas:
        - { x: "C_y", y: "I_f", rotulo: "{{I_f}}" }
      lectura: { valor: I_f, rotulo: "Corriente de fuga" }
      mandos:
        - { valor: C_y, lista: [1e-9, 2.2e-9, 4.7e-9], rotulo: "C_{Y}" }
    comprobar:
      - { con: { C_y: 1e-9 }, I_f: 72.3e-6, tol: 0.002 }

  - id: reto-medico
    tipo: reto
    titulo: "Un equipo médico"
    texto: "En un equipo médico tipo B la fuga no puede pasar de 100 µA. Elija la mayor capacidad Y total de la serie E12 que lo cumple."
    libro: [591, 597, 598]
    inicio: { C_y: 2.2e-9 }
    widget:
      tipo: grafica
      x: { id: cc, min: 0, max: 5e-9, unidad: F, rotulo: "C_{Y} total" }
      y: { min: 0, max: 0.0004, unidad: A, rotulo: "corriente de fuga" }
      curvas:
        - { expr: "2*pi*50*cc*230", color: azul, rotulo: "fuga" }
        - { expr: "0.0001", color: tinta, rotulo: "límite médico", discontinua: true }
      marcas:
        - { x: "C_y", y: "I_f", rotulo: "{{I_f}}" }
      lectura: { valor: I_f, rotulo: "Corriente de fuga" }
      mandos:
        - { valor: C_y, serie: E12, min: 0.47e-9, max: 4.7e-9, rotulo: "C_{Y} (E12)" }
    condiciones:
      - { valor: I_f, max: 0.0001, rotulo: "Fuga: {{I_f}}" }
      - { valor: C_y, min: 1.2e-9, rotulo: "C_{Y}: {{C_y}}" }
    exito: "1,2 nF: el máximo es 1,4 nF. Con tan poca capacidad el filtro apenas atenúa en baja frecuencia: el choke tiene que hacer el resto."
    pistas:
      - { cuando: { valor: I_f, mayor: 0.0001 }, texto: "Fuga excesiva: baje la capacidad." }
      - { texto: "Cumple, pero puede subir: busque la mayor que quede bajo 100 µA." }
    escalera:
      - "C_{Y,máx} = 100 µA / (2π · 50 Hz · 230 V)."
    solucion: "C_{Y} ≤ 1,4 nF: el valor E12 inmediatamente inferior es 1,2 nF."
    comprobar:
      - { C_m: 1.4e-9, tol: 0.02 }
      - { con: { C_y: 1.2e-9 }, I_f: 86.7e-6, tol: 0.003 }

  - id: medico-salidas
    tipo: porque
    titulo: "Filtrar sin fuga"
    texto: "Con tan poca capacidad Y permitida, ¿cómo se filtra el modo común en un equipo médico?"
    libro: [600]
    widget:
      tipo: grafica
      x: { id: cc, min: 0, max: 5e-9, unidad: F, rotulo: "C_{Y} total" }
      y: { min: 0, max: 0.0004, unidad: A, rotulo: "corriente de fuga" }
      curvas:
        - { expr: "2*pi*50*cc*230", color: azul, rotulo: "fuga" }
    opciones:
      - texto: "Con el choke de modo común, que no aporta corriente de fuga"
        bien: true
        porque: "Se apoya en la inductancia en lugar de en la capacidad; ayudan también un transformador de aislamiento de baja capacidad y su pantalla."
      - texto: "Con condensadores Y normales, más baratos"
        porque: "Un Y debe ser homologado: su fallo en cortocircuito pondría la red en el chasis."
      - texto: "Con más condensadores X"
        porque: "Los X filtran el modo diferencial; el problema es el común."
    escalera:
      - "¿Qué componente filtra el modo común sin conectar nada a tierra?"
    solucion: "El choke de modo común: inductancia en lugar de capacidad."

  - id: trenzar
    tipo: pregunta
    titulo: "Cuánto mejora trenzar"
    texto: "Un cable suelto de 200 cm² junto a un transformador capta 6,283 µV; trenzado apretado, con 1 cm², 0,031 µV. ¿Qué no resuelve trenzar?"
    libro: [611, 612, 614]
    widget:
      tipo: grafica
      x: { id: aa, min: 1, max: 200, unidad: "cm²", rotulo: "área del bucle" }
      y: { min: 0, max: 0.000007, unidad: V, rotulo: "tensión inducida" }
      curvas:
        - { expr: "2*pi*50*1e-6*aa*1e-4", color: azul, rotulo: "inducida" }
    opciones:
      - texto: "El acoplamiento capacitivo, que depende de la proximidad y no del área"
        bien: true
        porque: "Contra el capacitivo hace falta apantallar. Distinguir los mecanismos evita el remedio equivocado."
      - texto: "El acoplamiento magnético a 50 Hz"
        porque: "Es justo lo que resuelve: un factor 200, y aún más por la cancelación de cada media vuelta."
      - texto: "Nada: trenzar lo resuelve todo"
        porque: "Solo actúa sobre el área del bucle; el capacitivo sigue ahí."
    escalera:
      - "¿De qué depende cada acoplamiento?"
    solucion: "El capacitivo: para él, pantalla."
    comprobar:
      - { con: { A_c: 200 }, V_b: 6.283e-6, tol: 0.001 }
      - { con: { A_c: 1 }, V_b: 0.031e-6, tol: 0.02 }

  - id: estime-termico
    tipo: pregunta
    fase: "Estime"
    titulo: "Ejercicio: ruido de 10 kΩ"
    texto: "¿Qué tensión eficaz de ruido térmico da una resistencia de 10 kΩ a 290 K en 10 kHz de banda?"
    libro: ["cap32#618"]
    estimar:
      objetivo: "v_e"
      unidad: V
      min: 0
      max: 5e-6
      paso: 0.01e-6
      inicio: 4e-6
      tol: 0.04
      rotulo: "Ruido eficaz"
    exito: "Unos 1,27 µV eficaces."
    pistas:
      - { cuando: { valor: estimacion, mayor: 1.32e-6 }, texto: "Se ha pasado: √(4kTRB), con todo en unidades SI." }
      - { texto: "Se ha quedado corto: no olvide el 4 dentro de la raíz." }
    escalera:
      - "V_{n} = √(4 · k · T · R · B)."
    solucion: "√(4 · 1,38·10⁻²³ · 290 · 10 000 · 10 000) ≈ 1,27 µV."
    comprobar:
      - { v_e: 1.27e-6, tol: 0.005 }

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [583, 584, 598, 612]
    ideas:
      - { titulo: "La cadena.", texto: "La primera etapa aporta casi tres cuartas partes: solo ahí tiene sentido invertir." }
      - { titulo: "El filtro de red.", texto: "La fuga de los Y limita el filtro: 1,4 nF en un equipo médico; el choke hace el resto." }
      - { titulo: "Trenzar.", texto: "Trenzar mejora por 200 el magnético; el capacitivo pide pantalla." }
