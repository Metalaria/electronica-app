# Lección 1.2 de la sección 32.12 «Normativa y Ensayos» (cap32). Formato: contenido/lecciones11/GUIA.md.
# Zonas de la figura 32.15 (fig-32.14, svg_vista 450,72 × 220,48), medidas sobre el dibujo.
# 1.2.1 (autor121-ana, «aprender haciendo», GUIA §13): la frecuencia de una emisión se lleva al rango del ensayo
# radiado (objetivo; sustituye al emparejamiento de emisión y a «dónde se arregla»), y la familia que protege al equipo,
# el criterio de quien se reinicia solo y el de quien se queda colgado se tocan en la fig. 32.15 (el watchdog va en su
# explicación). Preconformidad y banco pasan al resumen. Quedan dos emparejamientos (inmunidad, sin laboratorio): 67 %,
# porque la sección es de normativa, con categorías y casi ninguna magnitud que manipular.
leccion: cap32/sec-32.12

modelo:
  valores:
    f_e: { sim: "f", nombre: "frecuencia de la emisión", unidad: Hz, valor: 1000000 }
    f_c1: { sim: "f", nombre: "comienzo de la conducida", unidad: Hz, valor: 150000 }
    f_c2: { sim: "f", nombre: "frontera entre conducida y radiada", unidad: Hz, valor: 30000000 }
    f_r2: { sim: "f", nombre: "final de la radiada", unidad: Hz, valor: 1000000000 }
  calculos:
    e_c: { expr: "ceil((f_e - f_c1)/1e12)*(1 - ceil((f_e - f_c2)/1e12))", sim: "conducida", nombre: "dentro del ensayo conducido", unidad: "" }
    e_r: { expr: "ceil((f_e - f_c2)/1e12)*(1 - ceil((f_e - f_r2)/1e12))", sim: "radiada", nombre: "dentro del ensayo radiado", unidad: "" }

libro:
  365: "cuánto ruido genera el equipo. Se mide"
  366: "cuánta perturbación soporta sin fallar. Se le inyecta"
  367: "la emisión protege a los demás; la inmunidad protege al propio equipo"
  369: "típicamente de 150 kHz a 30 MHz"
  370: "Es donde falla la mayoría de las fuentes conmutadas, y su origen es el modo común"
  371: "Radiada, de 30 MHz a 1 GHz o más"
  372: "la mayoría de los problemas de emisión se resuelven en los cables y en el filtro de entrada, no en la placa"
  374: "pulsos de hasta 8 kV al contacto y 15 kV al aire"
  375: "simulan la conmutación de cargas inductivas"
  376: "simulan rayos lejanos y maniobras de red"
  377: "se ilumina el equipo con 3 o 10 V/m"
  378: "caídas y microcortes de la alimentación"
  382: "se degrada y se recupera solo"
  384: "Un equipo que se reinicia ante una descarga puede aprobar si la norma admite criterio B para ESD"
  385: "convierte un fallo de criterio C en uno de criterio B"
  387: "Un ensayo de certificación cuesta miles de euros"
  388: "para llegar al laboratorio con margen en lugar de con sorpresas"
  391: "para localizar de dónde sale la emisión"
  392: "No es cuantitativa y encuentra muchos problemas"
  393: "acercando un transmisor conocido"
  396: "la mayoría de los suspensos están ahí"
  397: "el encendedor piezoeléctrico contra los conectores y las juntas"
  398: "Ensayos de emisión e inmunidad, y los criterios de aceptación"
  383: "Criterio C: requiere intervención del usuario"

tarjetas:
  - id: explore-ensayos
    tipo: explorar
    titulo: "Conducida o radiada"
    texto: "Un equipo emite un armónico a cierta frecuencia. Muévala hasta que la cubra el ensayo de emisión radiada."
    libro: [369, 370, 371, 372]
    inicio: { f_e: 1000000 }
    widget:
      tipo: grafica
      x: { id: nu, min: 100000, max: 3000000000, unidad: Hz, rotulo: "f", escala: log }
      y: { min: 0, max: 1.2, unidad: "", rotulo: "" }
      curvas:
        - { expr: "ceil((nu - f_c1)/1e12)*(1 - ceil((nu - f_c2)/1e12))", color: naranja, rotulo: "conducida, por el cable de red" }
        - { expr: "ceil((nu - f_c2)/1e12)*(1 - ceil((nu - f_r2)/1e12))", color: azul, rotulo: "radiada, por el aire" }
      marcas:
        - { x: "f_e", y: "0.5", rotulo: "su emisión" }
      mandos:
        - { valor: f_e, lista: [1000000, 10000000, 100000000, 2000000000], rotulo: "Frecuencia" }
    objetivo:
      condiciones:
        - { valor: e_r, min: 1, rotulo: "Ensayo radiado" }
      logrado: "Radiada, de 30 MHz a 1 GHz o más: los cables hacen de antena. Por debajo, conducida, con una LISN. En las dos manda el modo común: se arreglan en cables y filtro de entrada."
      pistas:
        - { cuando: { valor: e_c, min: 1 }, texto: "Esa la cubre la conducida, de 150 kHz a 30 MHz: suba." }
        - { texto: "Suba la frecuencia." }
    escalera:
      - "Conducida, de 150 kHz a 30 MHz; radiada, de 30 MHz a 1 GHz o más."
    solucion: "100 MHz: ensayo radiado."
    comprobar:
      - { f_c1: 150000, f_c2: 30000000, f_r2: 1000000000 }
      - { con: { f_e: 100000000 }, e_r: 1, e_c: 0 }

  - id: donde-se-arregla
    tipo: tocar
    titulo: "Emisión e inmunidad"
    texto: "Dos familias de ensayos con lógicas opuestas. Toque la que protege al propio equipo y más veces se descuida."
    libro: [365, 366, 367, 398]
    widget:
      tipo: figura
      figura: fig-32.14
      zonas:
        - { id: emision, rotulo: "Recuadro de arriba a la izquierda", rect: [5, 2, 217, 104] }
        - { id: inmunidad, rotulo: "Recuadro de arriba a la derecha", rect: [229, 3, 217, 103] }
    tocar:
      bien: [inmunidad]
      porque:
        emision: "La emisión, que se mide, protege a los demás."
    exito: "La inmunidad: cuánta perturbación soporta sin fallar. Se le inyecta."
    escalera:
      - "Una familia se mide; la otra se le inyecta al equipo."
    solucion: "La inmunidad."

  - id: empareje-inmunidad
    tipo: pregunta
    fase: "Empareje"
    titulo: "Los ensayos de inmunidad"
    texto: "Una cada ensayo de inmunidad con lo que hace."
    libro: [374, 375, 376, 377, 378]
    widget:
      tipo: figura
      figura: fig-32.14
      zonas:
        - { id: inmunidad, rotulo: "Inmunidad", rect: [229, 3, 217, 103] }
    emparejar:
      - ["ESD", "Hasta 8 kV al contacto y 15 kV al aire"]
      - ["Ráfagas rápidas", "Simulan la conmutación de cargas inductivas"]
      - ["Sobretensión", "Simula rayos lejanos y maniobras de red"]
      - ["Campo radiado", "Se ilumina el equipo con 3 o 10 V/m"]
      - ["Huecos de tensión", "Caídas y microcortes de la alimentación"]
    exito: "La ESD es el más severo y el que más equipos suspende."
    pistas:
      - { texto: "El de más kilovoltios es el de las descargas electrostáticas." }
    escalera:
      - "¿Cuál simula un rayo lejano?"
    solucion: "ESD–kilovoltios; ráfagas–cargas inductivas; sobretensión–rayos; campo–V/m; huecos–microcortes."

  - id: toque-criterio
    tipo: tocar
    titulo: "Los criterios de aceptación"
    texto: "Ante una descarga electrostática, un equipo se reinicia y vuelve a funcionar solo. Toque el criterio que cumple."
    libro: [382, 384]
    widget:
      tipo: figura
      figura: fig-32.14
      zonas:
        - { id: a, rotulo: "Caja de abajo a la izquierda", rect: [5, 133, 137, 47] }
        - { id: b, rotulo: "Caja de abajo en el centro", rect: [158, 133, 137, 47] }
        - { id: c, rotulo: "Caja de abajo a la derecha", rect: [310, 133, 136, 47] }
    tocar:
      bien: [b]
      porque:
        a: "Criterio A es funcionar normalmente durante la perturbación: reiniciarse no lo es."
        c: "Criterio C es necesitar al usuario; este equipo se recupera solo."
    exito: "Criterio B: aprueba si la norma de producto lo admite para ESD. Uno que se queda colgado, no."
    escalera:
      - "¿Necesita al usuario? ¿Funciona sin interrupción?"
    solucion: "B: se degrada y se recupera solo."

  - id: por-que-watchdog
    tipo: tocar
    titulo: "El watchdog"
    texto: "Ante una descarga, un equipo sin watchdog se queda colgado hasta que alguien lo apaga y lo enciende. Toque el criterio que cumple."
    libro: [383, 384, 385]
    widget:
      tipo: figura
      figura: fig-32.14
      zonas:
        - { id: a, rotulo: "Caja de abajo a la izquierda", rect: [5, 133, 137, 47] }
        - { id: b, rotulo: "Caja de abajo en el centro", rect: [158, 133, 137, 47] }
        - { id: c, rotulo: "Caja de abajo a la derecha", rect: [310, 133, 136, 47] }
    tocar:
      bien: [c]
      porque:
        a: "No funciona durante la perturbación: se ha colgado."
        b: "No se recupera solo: necesita al usuario."
    exito: "Criterio C: suspende. Un watchdog lo reiniciaría solo, criterio B: por eso, además de buena práctica, es una herramienta de certificación."
    escalera:
      - "¿Necesita al usuario?"
    solucion: "C: requiere intervención del usuario."

  - id: empareje-sin-laboratorio
    tipo: pregunta
    fase: "Empareje"
    titulo: "Sin laboratorio"
    texto: "Una cada recurso modesto con lo que encuentra."
    libro: [391, 392, 393]
    emparejar:
      - ["Sonda de campo cercano y un receptor", "De dónde sale la emisión"]
      - ["Un encendedor piezoeléctrico", "Fallos frente a descargas de varios kilovoltios"]
      - ["Una emisora portátil cerca", "Si sigue funcionando con campo radiado"]
    exito: "Ninguna sustituye al ensayo formal, pero encuentran los fallos más groseros antes de pagar."
    pistas:
      - { texto: "El encendedor genera descargas de varios kilovoltios." }
    escalera:
      - "¿Cuál es de emisión y cuáles de inmunidad?"
    solucion: "Sonda–emisión; encendedor–ESD; emisora–inmunidad radiada."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [367, 372, 374, 385, 387, 388, 396, 397]
    ideas:
      - { titulo: "Emisión e inmunidad.", texto: "La emisión protege a los demás y se mide; la inmunidad protege al equipo y se le inyecta." }
      - { titulo: "Modo común.", texto: "Domina la emisión conducida y la radiada: cables y filtro de entrada." }
      - { titulo: "Criterios.", texto: "A funciona; B se recupera solo; C necesita al usuario. El watchdog convierte C en B." }
      - { titulo: "Preconformidad.", texto: "Un ensayo cuesta miles de euros: medir pronto, sobre todo la conducida con LISN casera, para llegar con margen." }
