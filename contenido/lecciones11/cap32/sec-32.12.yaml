# Lección 1.2 de la sección 32.12 «Normativa y Ensayos» (cap32). Formato: contenido/lecciones11/GUIA.md.
# Zonas de la figura 32.15 (fig-32.14, svg_vista 450,72 × 220,48), medidas sobre el dibujo.
leccion: cap32/sec-32.12

modelo: { valores: {}, calculos: {} }

libro:
  365: "cuánto ruido genera el equipo. Se mide"
  366: "cuánta perturbación soporta sin fallar. Se le inyecta"
  367: "la emisión protege a los demás; la inmunidad protege al propio equipo"
  369: "típicamente de 150 kHz a 30 MHz"
  370: "Es donde falla la mayoría de las fuentes conmutadas, y su origen es el modo común"
  371: "Radiada, de 30 MHz a 1 GHz o más"
  372: "la mayoría de los problemas de emisión se resuelven en los cables y en el filtro de entrada, no en la placa"
  374: "pulsos de hasta 8 kV al contacto y 15 kV al aire"
  375: "simulan la conmutación de cargas inductivas"
  376: "simulan rayos lejanos y maniobras de red"
  377: "se ilumina el equipo con 3 o 10 V/m"
  378: "caídas y microcortes de la alimentación"
  382: "se degrada y se recupera solo"
  384: "Un equipo que se reinicia ante una descarga puede aprobar si la norma admite criterio B para ESD"
  385: "convierte un fallo de criterio C en uno de criterio B"
  387: "Un ensayo de certificación cuesta miles de euros"
  388: "para llegar al laboratorio con margen en lugar de con sorpresas"
  391: "para localizar de dónde sale la emisión"
  392: "No es cuantitativa y encuentra muchos problemas"
  393: "acercando un transmisor conocido"
  396: "la mayoría de los suspensos están ahí"
  397: "el encendedor piezoeléctrico contra los conectores y las juntas"

tarjetas:
  - id: explore-ensayos
    tipo: explorar
    titulo: "Dos familias de ensayos"
    texto: "Para vender un aparato hay que cumplir la normativa de EMC. Toque las dos familias de ensayos."
    libro: [365, 366, 367]
    widget:
      tipo: figura
      figura: fig-32.14
      zonas:
        - { id: emision, rotulo: "Recuadro de arriba a la izquierda", rect: [5, 2, 217, 104], texto: "Emisión: cuánto ruido genera el equipo. Se mide, y protege a los demás." }
        - { id: inmunidad, rotulo: "Recuadro de arriba a la derecha", rect: [229, 3, 217, 103], texto: "Inmunidad: cuánta perturbación soporta sin fallar. Se le inyecta, protege al propio equipo y es la que más se descuida." }
    requiere: { mover: [emision, inmunidad] }

  - id: empareje-emision
    tipo: pregunta
    fase: "Empareje"
    titulo: "Los ensayos de emisión"
    texto: "Una cada ensayo de emisión con su rasgo."
    libro: [369, 370, 371]
    widget:
      tipo: figura
      figura: fig-32.14
      zonas:
        - { id: emision, rotulo: "Emisión", rect: [5, 2, 217, 104] }
    emparejar:
      - ["Conducida, de 150 kHz a 30 MHz", "Por el cable de red, con una LISN"]
      - ["Radiada, de 30 MHz a 1 GHz o más", "En cámara anecoica, con los cables de antena"]
    exito: "En las dos manda el modo común: por eso se arreglan en los cables y en el filtro de entrada."
    pistas:
      - { texto: "La LISN aísla la instalación del cable de red." }
    escalera:
      - "¿Cuál se mide por el cable y cuál por el aire?"
    solucion: "Conducida–cable de red y LISN; radiada–cámara y cables como antena."

  - id: donde-se-arregla
    tipo: pregunta
    titulo: "Dónde se arregla"
    texto: "Una fuente conmutada suspende el ensayo de emisión conducida. ¿Dónde está casi siempre la solución?"
    libro: [370, 372]
    widget:
      tipo: figura
      figura: fig-32.14
      zonas:
        - { id: emision, rotulo: "Emisión", rect: [5, 2, 217, 104] }
    opciones:
      - texto: "En los cables y en el filtro de entrada, contra el modo común"
        bien: true
        porque: "La mayoría de los problemas de emisión se resuelven ahí, no en la placa."
      - texto: "En rediseñar toda la placa"
        porque: "A veces hace falta, pero lo habitual es que baste con el filtro y los cables."
      - texto: "En una pantalla alrededor de la placa"
        porque: "La emisión conducida va por el cable de red: una pantalla no la frena."
    escalera:
      - "¿Qué modo domina en las fuentes conmutadas que suspenden?"
    solucion: "Filtro de entrada y cables: el modo común."

  - id: empareje-inmunidad
    tipo: pregunta
    fase: "Empareje"
    titulo: "Los ensayos de inmunidad"
    texto: "Una cada ensayo de inmunidad con lo que hace."
    libro: [374, 375, 376, 377, 378]
    widget:
      tipo: figura
      figura: fig-32.14
      zonas:
        - { id: inmunidad, rotulo: "Inmunidad", rect: [229, 3, 217, 103] }
    emparejar:
      - ["ESD", "Hasta 8 kV al contacto y 15 kV al aire"]
      - ["Ráfagas rápidas", "Simulan la conmutación de cargas inductivas"]
      - ["Sobretensión", "Simula rayos lejanos y maniobras de red"]
      - ["Campo radiado", "Se ilumina el equipo con 3 o 10 V/m"]
      - ["Huecos de tensión", "Caídas y microcortes de la alimentación"]
    exito: "La ESD es el más severo y el que más equipos suspende."
    pistas:
      - { texto: "El de más kilovoltios es el de las descargas electrostáticas." }
    escalera:
      - "¿Cuál simula un rayo lejano?"
    solucion: "ESD–kilovoltios; ráfagas–cargas inductivas; sobretensión–rayos; campo–V/m; huecos–microcortes."

  - id: toque-criterio
    tipo: tocar
    titulo: "Los criterios de aceptación"
    texto: "Ante una descarga electrostática, un equipo se reinicia y vuelve a funcionar solo. Toque el criterio que cumple."
    libro: [382, 384]
    widget:
      tipo: figura
      figura: fig-32.14
      zonas:
        - { id: a, rotulo: "Caja de abajo a la izquierda", rect: [5, 133, 137, 47] }
        - { id: b, rotulo: "Caja de abajo en el centro", rect: [158, 133, 137, 47] }
        - { id: c, rotulo: "Caja de abajo a la derecha", rect: [310, 133, 136, 47] }
    tocar:
      bien: [b]
      porque:
        a: "Criterio A es funcionar normalmente durante la perturbación: reiniciarse no lo es."
        c: "Criterio C es necesitar al usuario; este equipo se recupera solo."
    exito: "Criterio B: aprueba si la norma de producto lo admite para ESD. Uno que se queda colgado, no."
    escalera:
      - "¿Necesita al usuario? ¿Funciona sin interrupción?"
    solucion: "B: se degrada y se recupera solo."

  - id: por-que-watchdog
    tipo: porque
    titulo: "El watchdog"
    texto: "Además de buena práctica, el watchdog es una herramienta de certificación. ¿Por qué?"
    libro: [385]
    widget:
      tipo: figura
      figura: fig-32.14
      zonas:
        - { id: flecha, rotulo: "Flecha de abajo", rect: [220, 175, 160, 45] }
    opciones:
      - texto: "Convierte un equipo colgado, criterio C, en uno que se reinicia solo, criterio B"
        bien: true
        porque: "Un equipo que se queda colgado suspende; uno que se recupera solo puede aprobar."
      - texto: "Porque evita que el equipo emita ruido"
        porque: "El watchdog no toca la emisión: actúa sobre cómo se recupera de una perturbación."
      - texto: "Porque convierte un fallo en criterio A"
        porque: "Reiniciarse no es funcionar normalmente durante la perturbación."
    escalera:
      - "¿Qué hace un watchdog cuando el programa se cuelga?"
    solucion: "Lo reinicia: de colgado, criterio C, a recuperarse solo, criterio B."

  - id: preconformidad
    tipo: pregunta
    titulo: "El coste de fallar tarde"
    texto: "Un ensayo de certificación cuesta miles de euros, y suspender obliga a rediseñar y repetir. ¿Qué se hace durante el desarrollo?"
    libro: [387, 388]
    widget:
      tipo: figura
      figura: fig-32.14
      zonas:
        - { id: todo, rotulo: "Los ensayos", rect: [5, 2, 441, 104] }
    opciones:
      - texto: "Preconformidad: medir de forma aproximada con equipo modesto"
        bien: true
        porque: "Para llegar al laboratorio con margen en lugar de con sorpresas."
      - texto: "Nada: el laboratorio ya dirá"
        porque: "Así se descubren los fallos en el momento más caro."
      - texto: "Comprar un receptor calibrado y una cámara"
        porque: "Es lo que tiene el laboratorio; para desarrollar basta con equipo modesto."
    escalera:
      - "¿Cuándo es más barato encontrar un fallo?"
    solucion: "Preconformidad durante el desarrollo."

  - id: empareje-sin-laboratorio
    tipo: pregunta
    fase: "Empareje"
    titulo: "Sin laboratorio"
    texto: "Una cada recurso modesto con lo que encuentra."
    libro: [391, 392, 393]
    emparejar:
      - ["Sonda de campo cercano y un receptor", "De dónde sale la emisión"]
      - ["Un encendedor piezoeléctrico", "Fallos frente a descargas de varios kilovoltios"]
      - ["Una emisora portátil cerca", "Si sigue funcionando con campo radiado"]
    exito: "Ninguna sustituye al ensayo formal, pero encuentran los fallos más groseros antes de pagar."
    pistas:
      - { texto: "El encendedor genera descargas de varios kilovoltios." }
    escalera:
      - "¿Cuál es de emisión y cuáles de inmunidad?"
    solucion: "Sonda–emisión; encendedor–ESD; emisora–inmunidad radiada."

  - id: banco-rentable
    tipo: pregunta
    titulo: "La medida más rentable"
    texto: "Con poco presupuesto, ¿qué medida de preconformidad de emisión es la más rentable?"
    libro: [396, 397]
    widget:
      tipo: figura
      figura: fig-32.14
      zonas:
        - { id: emision, rotulo: "Emisión", rect: [5, 2, 217, 104] }
    opciones:
      - texto: "Emisión conducida con una LISN casera y un analizador económico"
        bien: true
        porque: "La mayoría de los suspensos están ahí, y el margen respecto al límite se ve directamente."
      - texto: "Emisión radiada a 3 m en el garaje"
        porque: "Sin cámara, el entorno lo contamina todo; la conducida es más fiable y es donde se suspende."
      - texto: "Ninguna: sin laboratorio no sirve"
        porque: "Comparativa y aproximada, sirve para llegar con margen."
    escalera:
      - "¿En qué ensayo suspende la mayoría?"
    solucion: "La conducida, con LISN casera: ahí están la mayoría de los suspensos."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [367, 372, 374, 385, 388]
    ideas:
      - { titulo: "Emisión e inmunidad.", texto: "La emisión protege a los demás y se mide; la inmunidad protege al equipo y se le inyecta." }
      - { titulo: "Modo común.", texto: "Domina la emisión conducida y la radiada: cables y filtro de entrada." }
      - { titulo: "Criterios.", texto: "A funciona; B se recupera solo; C necesita al usuario. El watchdog convierte C en B." }
      - { titulo: "Preconformidad.", texto: "Medir pronto con equipo modesto para llegar con margen." }
