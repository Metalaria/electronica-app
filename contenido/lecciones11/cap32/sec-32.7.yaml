# Lección 1.2 de la sección 32.7 «Apantallamiento: Mecanismos, Límites y Conexión de la Pantalla» (cap32).
# Formato: GUIA.md. La eficacia limitada por una ranura de longitud L es la de la figura 32.8: SE = 20·log₁₀(λ/2L),
# 20 dB justo cuando L = λ/20 (bloque 211), con λ = c/f y c = 3·10⁸ m/s.
leccion: cap32/sec-32.7

libro:
  204: "Es el mecanismo dominante para campos eléctricos y para alta frecuencia"
  207: "para campos magnéticos de baja frecuencia, hace falta material ferromagnético y espesor"
  208: "el campo magnético de 50 Hz atraviesa el aluminio como si no estuviera"
  210: "Una pantalla es tan buena como sus aberturas y sus juntas"
  211: "cuando su dimensión mayor supera λ/20"
  212: "A 1 GHz, λ es 30 cm, así que una ranura de 1,5 cm ya deja pasar"
  213: "si no hay continuidad eléctrica a lo largo de todo el borde, hay una ranura"
  216: "esa corriente reintroduce el ruido que la pantalla debía evitar"
  217: "El cruce entre los dos criterios está en torno a las decenas de kilohercios"
  218: "continuidad en alta frecuencia y aislamiento en continua"
  219: "Ese cable fino —el pigtail— tiene inductancia"
  221: "una pantalla no filtra"
  224: "primero el trazado, después el filtrado, y la pantalla como última capa"
  227: "la señal aumenta claramente en las ranuras y en las juntas mal cerradas"

modelo:
  valores:
    L_r: { sim: "L", nombre: "longitud de la ranura", unidad: m, valor: 0.015 }
    f_r: { sim: "f", nombre: "frecuencia", unidad: Hz, valor: 1000000000 }
  calculos:
    lam: { expr: "300000000/f_r", sim: "λ", nombre: "longitud de onda", unidad: m }
    S_E: { expr: "max(0, 20*log10(lam/(2*L_r)))", sim: "SE", nombre: "eficacia de apantallamiento", unidad: dB, cifras: 3 }
    m_15: { expr: "lam/2", sim: "λ/2", nombre: "media longitud de onda", unidad: m }
    L_20: { expr: "lam/20", sim: "λ/20", nombre: "abertura máxima", unidad: m }

tarjetas:
  - id: explore-ranura
    tipo: explorar
    titulo: "Limitada por la abertura"
    texto: "Una ranura en la caja radia como una antena. Cambie su longitud y mire la eficacia de la pantalla a 1 GHz."
    libro: [210, 211]
    fijar: { f_r: 1000000000 }
    widget:
      tipo: grafica
      x: { id: nu, min: 1000000, max: 10000000000, unidad: Hz, rotulo: "f", escala: log }
      y: { min: 0, max: 100, unidad: dB, rotulo: "eficacia de apantallamiento" }
      curvas:
        - { expr: "max(0, 20*log10(300000000/(nu*2*L_r)))", color: azul, rotulo: "con la ranura" }
        - { expr: "20", color: tinta, rotulo: "L = λ/20", discontinua: true }
      marcas:
        - { x: "f_r", y: "S_E", rotulo: "{{S_E}}" }
      lectura: { valor: S_E, rotulo: "Eficacia a 1 GHz" }
      mandos:
        - { valor: L_r, lista: [0.005, 0.015, 0.05], rotulo: "Longitud de la ranura" }
    requiere: { mover: [L_r] }

  - id: prediga-ranura
    tipo: predecir
    titulo: "A 1 GHz"
    texto: "Una abertura empieza a comprometer el apantallamiento cuando supera λ/20. ¿Qué ranura ya deja pasar 1 GHz?"
    libro: [211, 212]
    fijar: { f_r: 1000000000 }
    widget:
      tipo: grafica
      x: { id: nu, min: 1000000, max: 10000000, unidad: Hz, rotulo: "f", escala: log }
      y: { min: 0, max: 100, unidad: dB, rotulo: "eficacia de apantallamiento" }
      curvas:
        - { expr: "20", color: tinta, rotulo: "L = λ/20", discontinua: true }
      lectura: { valor: L_20, rotulo: "λ/20 a 1 GHz" }
      ocultar: true
    opciones:
      - texto: "Una de 1,5 cm"
        bien: true
        porque: "λ es 30 cm a 1 GHz: λ/20 son 1,5 cm."
      - texto: "Solo una de 15 cm o más"
        porque: "Esa es media longitud de onda, donde la ranura radia con toda su eficacia; empieza a estorbar mucho antes."
      - texto: "Ninguna: el metal la apantalla igual"
        porque: "Una pantalla es tan buena como sus aberturas y juntas."
    escalera:
      - "λ = c/f; luego, divida por 20."
    solucion: "λ = 30 cm; λ/20 = 1,5 cm."
    comprobar:
      - { L_20: 0.015, lam: 0.3, m_15: 0.15 }

  - id: ajuste-rejilla
    tipo: ajuste
    titulo: "La rejilla de ventilación"
    texto: "Elija el tamaño de los agujeros de una rejilla para que a 1 GHz la pantalla no baje de 20 dB."
    libro: [211, 212]
    fijar: { f_r: 1000000000 }
    inicio: { L_r: 0.05 }
    widget:
      tipo: grafica
      x: { id: nu, min: 1000000, max: 10000000000, unidad: Hz, rotulo: "f", escala: log }
      y: { min: 0, max: 100, unidad: dB, rotulo: "eficacia de apantallamiento" }
      curvas:
        - { expr: "max(0, 20*log10(300000000/(nu*2*L_r)))", color: azul, rotulo: "con el agujero" }
      marcas:
        - { x: "f_r", y: "S_E", rotulo: "{{S_E}}" }
      lectura: { valor: S_E, rotulo: "Eficacia a 1 GHz" }
      mandos:
        - { valor: L_r, lista: [0.05, 0.03, 0.02, 0.015, 0.01, 0.005], rotulo: "Agujero" }
    ajuste:
      valor: S_E
      min: 20
      max: 100
      rotulo: "Eficacia a 1 GHz"
      escala: { min: 0, max: 40 }
      bajo: "El agujero es demasiado grande: deja pasar. Hágalo más pequeño."
      alto: "Más de lo necesario."
      dentro: "Agujeros de λ/20 o menos. Por eso las rejillas son muchos agujeros pequeños y no una abertura."

  - id: por-que-pequenas
    tipo: porque
    titulo: "Muchas pequeñas"
    texto: "Con la misma área total, muchas ranuras pequeñas apantallan mucho mejor que una grande. ¿Por qué?"
    libro: [211, 212]
    widget:
      tipo: figura
      figura: fig-32.8
      zonas:
        - { id: grafica, rotulo: "Eficacia según la ranura", rect: [32, 22, 212, 163] }
    opciones:
      - texto: "Lo que manda es la dimensión mayor de cada abertura, no el área total"
        bien: true
        porque: "Cada ranura radia según su longitud frente a λ: pequeñas, radian poco."
      - texto: "Porque dejan pasar menos aire"
        porque: "Con la misma área total pasa el mismo aire; la diferencia es eléctrica."
      - texto: "Porque el metal entre ellas absorbe el campo"
        porque: "No es absorción: cada abertura es una antena, y su longitud decide cuánto radia."
    escalera:
      - "¿De qué depende que una ranura radie bien?"
    solucion: "La dimensión mayor de cada abertura frente a λ: pequeñas, poco eficaces como antena."

  - id: transformador
    tipo: pregunta
    titulo: "El zumbido del transformador"
    texto: "Un cable de señal capta el zumbido de 50 Hz de un transformador cercano. ¿Qué hace?"
    libro: [204, 207, 208]
    widget:
      tipo: figura
      figura: fig-32.8
      zonas:
        - { id: grafica, rotulo: "Eficacia según la ranura", rect: [32, 22, 212, 163] }
    opciones:
      - texto: "Alejarlo, girarlo 90° o trenzarlo"
        bien: true
        porque: "El magnético de baja frecuencia solo se frena con material ferromagnético o con geometría: menos área captadora."
      - texto: "Envolverlo en malla conectada a masa"
        porque: "La malla es una jaula de Faraday para el campo eléctrico; el magnético de 50 Hz la atraviesa."
      - texto: "Una lámina de aluminio alrededor"
        porque: "El campo magnético de 50 Hz atraviesa el aluminio como si no estuviera."
    escalera:
      - "¿Es un campo eléctrico o magnético, y de qué frecuencia?"
    solucion: "Magnético de baja frecuencia: alejar, girar o trenzar."

  - id: empareje-conexion
    tipo: pregunta
    fase: "Empareje"
    titulo: "Dónde se conecta la pantalla"
    texto: "Una cada conexión de la malla con su uso. El cruce está en torno a las decenas de kilohercios."
    libro: [216, 217, 218]
    emparejar:
      - ["Un solo extremo", "Baja frecuencia: sin bucle de tierra"]
      - ["Los dos extremos", "Alta frecuencia: la malla es el retorno"]
      - ["Los dos, con un condensador en uno", "Continuidad en alta y aislamiento en continua"]
    exito: "Por un solo extremo en alta frecuencia, el otro queda como antena."
    pistas:
      - { texto: "Por los dos extremos, malla y masa forman una espira." }
    escalera:
      - "¿Qué problema aparece en baja frecuencia si se cierra la espira?"
    solucion: "Un extremo–baja; los dos–alta; con condensador–el compromiso."

  - id: pigtail
    tipo: pregunta
    titulo: "Un cable fino al chasis"
    texto: "La malla de un cable se une al chasis con un cable fino, y a frecuencias altas la pantalla no hace nada. ¿Por qué?"
    libro: [219]
    widget:
      tipo: figura
      figura: fig-32.8
      zonas:
        - { id: errores, rotulo: "Los dos errores de montaje", rect: [280, 32, 164, 152] }
    opciones:
      - texto: "Ese cable fino tiene inductancia: hace falta una conexión de 360° alrededor del cable"
        bien: true
        porque: "Es el pigtail, un error de montaje extremadamente común."
      - texto: "Porque la malla debía ir por un solo extremo"
        porque: "En alta frecuencia va por los dos; el problema es cómo se une, no dónde."
      - texto: "Porque el cable fino tiene mucha resistencia"
        porque: "No es la resistencia: es su inductancia la que a frecuencias altas lo anula."
    escalera:
      - "¿Qué impedancia crece con la frecuencia en un cable fino?"
    solucion: "La inductancia del pigtail: conexión de 360°."

  - id: ordene-actuacion
    tipo: pregunta
    fase: "Ordene"
    titulo: "El orden correcto"
    texto: "La pantalla no filtra ni arregla un trazado deficiente. Ordene las actuaciones contra la interferencia."
    libro: [221, 224]
    ordenar:
      - "El trazado"
      - "El filtrado"
      - "La pantalla, como última capa"
    exito: "Empezar por la pantalla es caro y a menudo insuficiente."
    pistas:
      - { texto: "Lo último es lo más caro y lo que menos arregla." }
    escalera:
      - "Una pantalla no quita el ruido que ya va por los conductores."
    solucion: "Trazado, filtrado y pantalla."

  - id: banco-espira
    tipo: pregunta
    titulo: "En el banco"
    texto: "Recorre la caja con una espira de cable coaxial conectada al osciloscopio. ¿Dónde aumenta la señal?"
    libro: [213, 227]
    widget:
      tipo: grafica
      x: { id: nu, min: 1000000, max: 10000000000, unidad: Hz, rotulo: "f", escala: log }
      y: { min: 0, max: 100, unidad: dB, rotulo: "eficacia de apantallamiento" }
      curvas:
        - { expr: "max(0, 20*log10(300000000/(nu*2*L_r)))", color: azul, rotulo: "con la ranura" }
    opciones:
      - texto: "En las ranuras y en las juntas mal cerradas"
        bien: true
        porque: "La pantalla no falla en su superficie, sino en sus discontinuidades."
      - texto: "En el centro de las chapas"
        porque: "La superficie conductora refleja bien; lo que deja pasar son las discontinuidades."
      - texto: "Igual en toda la caja"
        porque: "Si fuera así, la pantalla no tendría puntos débiles: los tiene en juntas y aberturas."
    escalera:
      - "Una junta sin continuidad eléctrica es una ranura."
    solucion: "En ranuras y juntas: ahí están las discontinuidades."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [207, 211, 216, 219, 224]
    ideas:
      - { titulo: "Mecanismos.", texto: "Reflexión y absorción: fácil con el eléctrico; el magnético de baja frecuencia pide hierro o geometría." }
      - { titulo: "Aberturas.", texto: "Por encima de λ/20 dejan pasar: muchos agujeros pequeños, no uno grande." }
      - { titulo: "La conexión.", texto: "Un extremo en baja frecuencia, los dos en alta, y siempre a 360°, sin pigtail." }
      - { titulo: "El orden.", texto: "Trazado, filtrado y, al final, la pantalla." }
