# Lección 1.2 de la sección 50.4 «El Cerebro: el ESP32 y su Mapa de Pines» (cap49; etiquetas sec-49.N = impresas 50.N).
# - Consumo por modos y restricciones de pines (figura 50.9, fig-49.6); el ESP32 real (foto 50.10, fig-49.7).
# - Ejercicio 50.1 (bloque 265): el micrófono va al ADC1 (GPIO32-39), porque el ADC2 lo usa el wifi.
# Sin fórmulas ni modelo (aviso de secuencia «sin tarjeta de fórmula»).
# Paso práctico: «tocar» en la placa de desarrollo de la foto la zona de la antena, sin cobre debajo.
leccion: cap49/sec-49.4

libro:
  124: "wifi integrado, potencia suficiente, convertidores, buses y modos de bajo consumo"
  125: "se elige por periféricos y conectividad, no por velocidad"
  129: "su linealidad es mediocre y conviene calibrar"
  134: "Si un circuito externo los fuerza, la placa no arranca o entra en modo de programación"
  135: "funciona al programar y no al encender"
  136: "Están ahí y son inservibles"
  137: "algunos no tienen etapa de salida"
  138: "queda inutilizado cuando el wifi está activo"
  142: "una placa de desarrollo, con su regulador, su LED y su conversor USB-serie, no baja de varios miliamperios"
  144: "Un regulador dimensionado para la media se hunde al transmitir y provoca reinicios"
  145: "Un condensador de reserva generoso junto al módulo"
  147: "la antena integrada necesita espacio libre de cobre debajo y alrededor"
  148: "reduce el alcance drásticamente"
  152: "Si arranca desnudo y no conectado, el problema está en un pin de arranque forzado por el circuito externo"
  153: "Consumo del ESP32 por modos y sus restricciones de pines"
  154: "bajo ella no debe haber cobre ni componentes"
  "cap49#265": "El ADC1 (GPIO32-39) es independiente del WiFi"

modelo: { valores: {}, calculos: {} }

tarjetas:
  - id: explore-esp32
    tipo: explorar
    titulo: "Por periféricos, no por velocidad"
    texto: "El ESP32 reúne wifi, convertidores, buses y sueño profundo. Toque sus modos de consumo y dos restricciones de pines."
    libro: [124, 153]
    widget:
      tipo: figura
      figura: fig-49.6
      zonas:
        - { id: consumo, rotulo: "Gráfica de la izquierda", rect: [60, 20, 160, 130], texto: "De 10 µA dormido a 150 mA de media con el wifi, con picos de cientos de miliamperios." }
        - { id: arranque, rotulo: "Recuadro de arriba a la derecha", rect: [240, 18, 203, 45], texto: "Pines de arranque: si el circuito los fuerza, no arranca al encender." }
        - { id: flash, rotulo: "Segundo recuadro", rect: [240, 66, 203, 36], texto: "Pines de la Flash interna: no se pueden usar." }
        - { id: adc2, rotulo: "Último recuadro", rect: [240, 142, 203, 45], texto: "El segundo bloque de ADC queda inutilizado con el wifi activo." }
    requiere: { mover: [consumo, arranque, adc2] }

  - id: pregunta-eleccion
    tipo: pregunta
    titulo: "Por qué el ESP32"
    texto: "¿Cuál es el criterio que lleva al ESP32 en esta estación?"
    libro: [124, 125, 129]
    widget:
      tipo: figura
      figura: fig-49.7
      zonas:
        - { id: modulo, rotulo: "Foto de la izquierda", rect: [0, 0, 760, 683] }
    opciones:
      - texto: "Periféricos y conectividad: wifi integrado, convertidores, buses y sueño"
        bien: true
        porque: "El wifi integrado es la razón principal."
      - texto: "Su velocidad"
        porque: "Leer unos sensores cada cinco minutos no exige velocidad."
      - texto: "Sus convertidores de 12 bits muy lineales"
        porque: "Su linealidad es mediocre: conviene calibrarlos."
    escalera:
      - "¿Qué necesita la estación que un microcontrolador sin radio no tiene?"
    solucion: "Periféricos y conectividad."

  - id: predecir-arranque
    tipo: predecir
    titulo: "Funciona al programar"
    texto: "La placa funciona al programarla desde el ordenador, pero no arranca al encenderla en su sitio. ¿Qué apostaría?"
    libro: [134, 135]
    widget:
      tipo: figura
      figura: fig-49.6
      zonas:
        - { id: arranque, rotulo: "Recuadro de arriba a la derecha", rect: [240, 18, 203, 45] }
    opciones:
      - texto: "Un pin de arranque forzado por el circuito externo"
        bien: true
        porque: "Es un fallo desconcertante y su causa es siempre la misma."
      - texto: "El firmware está mal"
        porque: "El mismo firmware funciona al programar: lo que cambia es el estado de los pines al encender."
      - texto: "Falta de memoria"
        porque: "La memoria es la misma en los dos casos."
    escalera:
      - "Unos pocos pines se leen al encender para decidir el modo de arranque."
    solucion: "Un pin de arranque (strapping) forzado."

  - id: pregunta-adc
    tipo: pregunta
    titulo: "El micrófono, ¿a qué pin?"
    texto: "El micrófono analógico se conecta a un pin del convertidor. ¿Por qué al ADC1 y no al ADC2?"
    libro: [138, "cap49#265"]
    widget:
      tipo: figura
      figura: fig-49.6
      zonas:
        - { id: adc2, rotulo: "Último recuadro", rect: [240, 142, 203, 45] }
    opciones:
      - texto: "El ADC2 lo usa el wifi: con la radio activa, sus lecturas fallan"
        bien: true
        porque: "El ADC1 (GPIO32-39) es independiente del wifi: el único válido en un proyecto conectado."
      - texto: "El ADC1 tiene más bits"
        porque: "Los dos son de 12 bits; el problema del ADC2 es que comparte recursos con el wifi."
      - texto: "Da igual"
        porque: "Con el wifi activo, el ADC2 queda inutilizado."
    escalera:
      - "¿Qué comparte el segundo bloque de convertidores?"
    solucion: "Al ADC1: el ADC2 queda inutilizado con el wifi."

  - id: empareje-pines
    tipo: pregunta
    titulo: "Las restricciones de pines"
    texto: "Empareje cada tipo de pin con su restricción."
    libro: [134, 136, 137, 138]
    widget:
      tipo: figura
      figura: fig-49.6
      zonas:
        - { id: restricciones, rotulo: "Columna de la derecha", rect: [240, 18, 203, 170] }
    emparejar:
      - ["De arranque", "Si se fuerzan, no arranca"]
      - ["De la Flash interna", "Inservibles"]
      - ["De solo entrada", "Sin etapa de salida"]
      - ["Del ADC2", "Inutilizados con el wifi activo"]
    exito: "Esa última es la que aparece en la errata o en el foro, no en la primera página."
    pistas:
      - { texto: "Un pin de solo entrada no puede encender un LED." }
    escalera:
      - "Dos de ellos sirven para entrada analógica; uno no sirve para nada."
    solucion: "Arranque, no arranca; Flash, inservibles; solo entrada, sin salida; ADC2, sin wifi."

  - id: porque-pico
    tipo: porque
    titulo: "El pico, no la media"
    texto: "¿Por qué un regulador dimensionado para la corriente media provoca reinicios?"
    libro: [144, 145]
    widget:
      tipo: figura
      figura: fig-49.6
      zonas:
        - { id: consumo, rotulo: "Gráfica de la izquierda", rect: [60, 20, 160, 130] }
    opciones:
      - texto: "Se hunde con los picos de la transmisión"
        bien: true
        porque: "La fuente debe soportar el pico; un condensador de reserva junto al módulo lo cubre."
      - texto: "Se calienta con la media"
        porque: "Con la media no tiene problema: son los picos los que lo hunden."
      - texto: "Porque la media es muy alta"
        porque: "La media es baja; el pico al transmitir es de cientos de miliamperios."
    escalera:
      - "¿Qué pasa con la tensión si la corriente pedida supera lo que da el regulador?"
    solucion: "Los picos lo hunden: dimensionar para el pico y un condensador de reserva."

  - id: pregunta-devkit
    tipo: pregunta
    titulo: "Diez microamperios… ¿en qué placa?"
    texto: "El sueño profundo del ESP32 son unos 10 µA. ¿Y en una placa de desarrollo?"
    libro: [142]
    widget:
      tipo: figura
      figura: fig-49.7
      zonas:
        - { id: devkit, rotulo: "Foto de la derecha", rect: [790, 0, 810, 683] }
    opciones:
      - texto: "No baja de varios miliamperios"
        bien: true
        porque: "Su regulador, su LED y su conversor USB-serie siguen gastando."
      - texto: "Los mismos 10 µA"
        porque: "Esa es la cifra del módulo desnudo."
      - texto: "Menos, porque el regulador ayuda"
        porque: "El regulador de la placa añade consumo, no lo quita."
    escalera:
      - "¿Qué más hay en la placa además del módulo?"
    solucion: "Varios miliamperios."

  - id: toque-antena
    tipo: tocar
    titulo: "La antena"
    texto: "Toque en la placa de desarrollo la zona bajo la que no debe haber cobre ni componentes."
    libro: [147, 148, 154]
    widget:
      tipo: figura
      figura: fig-49.7
      zonas:
        - { id: antena, rotulo: "Extremo del módulo, arriba a la derecha", rect: [1260, 30, 200, 125] }
        - { id: blindaje, rotulo: "Caja metálica del módulo", rect: [1105, 160, 280, 190] }
        - { id: usb, rotulo: "Conector de abajo a la izquierda", rect: [900, 390, 130, 125] }
    tocar:
      bien: [antena]
      porque:
        blindaje: "Es el blindaje del módulo: debajo puede haber placa."
        usb: "Es el conector USB: nada que ver con la radio."
    exito: "Un plano de masa o una caja metálica ahí reduce el alcance drásticamente."
    escalera:
      - "La antena está trazada en cobre en el extremo libre del módulo."
    solucion: "El extremo libre del módulo, sobre el borde de la placa."

  - id: pregunta-banco
    tipo: pregunta
    titulo: "Antes de construir"
    texto: "La placa arranca desnuda, pero no con los periféricos conectados. ¿Dónde está el problema?"
    libro: [152]
    widget:
      tipo: figura
      figura: fig-49.6
      zonas:
        - { id: arranque, rotulo: "Recuadro de arriba a la derecha", rect: [240, 18, 203, 45] }
    opciones:
      - texto: "En un pin de arranque que el circuito externo fuerza"
        bien: true
        porque: "Desnuda arranca: lo que cambia al conectar es el nivel de algún pin de arranque."
      - texto: "En el ESP32"
        porque: "Desnudo funciona: el ESP32 está bien."
      - texto: "En la antena"
        porque: "La antena afecta al alcance, no al arranque."
    escalera:
      - "¿Qué cambia entre la placa desnuda y conectada?"
    solucion: "Un pin de arranque forzado."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [125, 138, 144, 147]
    ideas:
      - { titulo: "Elegido por periféricos.", texto: "Wifi integrado, convertidores, buses y sueño." }
      - { titulo: "Pines.", texto: "Arranque, Flash, solo entrada, y el ADC2 inútil con wifi." }
      - { titulo: "Picos.", texto: "La fuente da el pico, con un condensador de reserva." }
      - { titulo: "La antena.", texto: "Sin cobre debajo ni alrededor." }
