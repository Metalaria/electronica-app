# Lección 1.2 de la sección 50.11 «Los Datos a la Nube: MQTT y Panel» (cap49; etiquetas sec-49.N = impresas 50.N).
# - La cadena MQTT y quién pone la marca de tiempo (figura 50.22, fig-49.19; las horas de la figura son de ejemplo);
#   el flujo de la figura 50.21 (fig-49.18).
# - Ejercicio 50.5 (bloque 265): ESP32, broker y panel.
# Sin números ni fórmulas: sin modelo (aviso de secuencia «sin tarjeta de fórmula»).
# Paso práctico: «tocar» en la figura 50.22 la fila en la que los datos del corte conservan su hora.
# 1.2.1 (autor121-sens, «aprender haciendo», GUIA §13): en la figura 50.22 se tocan el eslabón que desacopla, el que
# retiene y la fila con la hora bien puesta; el mensaje de última voluntad (bloques 362 y 363) se ve en el simulador
# lógico. Rasgos de MQTT, papeles, temas, la prueba de la hora y el servidor abierto pasan a los éxitos y al resumen.
# Queda una de opciones, el duplicado de QoS 1.
leccion: cap49/sec-49.11

libro:
  345: "las decisiones de esta parte tienen más consecuencias de las que parecen"
  348: "cabeceras de pocos bytes, frente a los cientos de una petición HTTP"
  349: "encaja con un sistema que despierta, envía y vuelve a dormir"
  350: "quien publica no sabe quién consume"
  352: "QoS 0 pierde mensajes si la red falla, y QoS 1 puede duplicarlos"
  355: "estacion/exterior/temperatura"
  358: "para poder suscribirse con comodines a una rama entera"
  359: "permite consumir solo lo que interesa"
  360: "Sin espacios ni caracteres raros, y en minúsculas."
  362: "un mensaje que el servidor publicará si la conexión se pierde sin despedida"
  363: "un panel puede mostrar «sin conexión» automáticamente"
  367: "Un dato guardado durante un corte de red llegaría con la hora de llegada, no la de medida"
  369: "la marca tiene que venir del dispositivo"
  371: "Base de datos de series temporales"
  372: "guardar todos los datos recientes y agregados de los antiguos"
  379: "aparece en los buscadores de dispositivos expuestos en cuestión de horas"
  382: "Si los datos aparecen todos con la hora de reconexión, la marca la está poniendo el servidor"
  383: "Flujo de datos a la nube por MQTT, del ESP32 al panel"
  384: "La cadena MQTT y la decisión sobre quién pone la marca de tiempo"
  "cap49#265": "El broker (por ejemplo Mosquitto) recibe todas las publicaciones y las distribuye a quien esté suscrito"

modelo: { valores: {}, calculos: {} }

tarjetas:
  - id: explore-mqtt
    tipo: tocar
    titulo: "Del sensor al panel"
    texto: "Publicar, guardar, consultar. Se añade un nuevo consumidor de los datos sin tocar la estación: toque el eslabón que lo permite."
    libro: [345, 348, 349, 350, 383, 384, "cap49#265"]
    widget:
      tipo: figura
      figura: fig-49.19
      zonas:
        - { id: dispositivo, rotulo: "Primer recuadro", rect: [4, 5, 88, 58] }
        - { id: servidor, rotulo: "Segundo recuadro", rect: [123, 5, 88, 58] }
        - { id: base, rotulo: "Tercer recuadro", rect: [242, 5, 88, 58] }
        - { id: panel, rotulo: "Cuarto recuadro", rect: [360, 5, 88, 58] }
    tocar:
      bien: [servidor]
      porque:
        dispositivo: "El dispositivo mide y publica; precisamente, no debe enterarse del cambio."
        base: "La base guarda las series; el desacoplo está antes."
        panel: "El panel es un consumidor más."
    exito: "El servidor MQTT, el broker: recibe y distribuye a los suscritos, y quien publica no sabe quién consume. Ligero, de pocos bytes: la estación despierta, publica y vuelve a dormir."
    escalera:
      - "¿Quién reparte los mensajes?"
    solucion: "El segundo recuadro, el servidor MQTT."

  - id: predecir-qos
    tipo: predecir
    titulo: "QoS 0 o QoS 1"
    texto: "La red falla en mitad de un envío con QoS 1. ¿Qué puede pasar?"
    libro: [352]
    widget:
      tipo: figura
      figura: fig-49.19
      zonas:
        - { id: servidor, rotulo: "Segundo recuadro", rect: [123, 5, 88, 58] }
    opciones:
      - texto: "Que el mensaje llegue duplicado"
        bien: true
        porque: "QoS 1 confirma y reenvía; QoS 0 lo perdería. Para medidas periódicas, tolerable; para un contador acumulado, no."
      - texto: "Que se pierda"
        porque: "Ese es el riesgo de QoS 0, que no confirma."
      - texto: "Nada: QoS 1 es exactamente una vez"
        porque: "Exactamente una vez es otro nivel; QoS 1 puede duplicar."
    escalera:
      - "Con confirmación, si la confirmación se pierde, se reenvía."
    solucion: "Un duplicado."

  - id: porque-voluntad
    tipo: explorar
    titulo: "El mensaje de última voluntad"
    texto: "Al conectarse, la estación declara un mensaje de última voluntad. Haga que el servidor lo publique."
    libro: [362, 363]
    widget:
      tipo: logica
      entradas:
        - { id: CON, valor: 1, rotulo: "Conexión viva" }
        - { id: DES, valor: 0, rotulo: "Se despidió" }
      piezas:
        - { id: n1, tipo: not, entradas: [CON], rotulo: "Conexión perdida" }
        - { id: n2, tipo: not, entradas: [DES], rotulo: "Sin despedida" }
        - { id: a1, tipo: and, entradas: [n1, n2], rotulo: "Servidor" }
      salidas:
        - { id: LWT, de: a1, rotulo: "Publica «sin conexión»" }
    objetivo:
      condiciones:
        - { led: LWT, valor: 1, rotulo: "Última voluntad publicada" }
      logrado: "La conexión se ha perdido sin despedida, y el servidor publica el mensaje: el panel muestra «sin conexión» solo, sin lógica de vigilancia."
      pistas:
        - { texto: "Corte la conexión sin despedirse." }
    escalera:
      - "Se publica cuando no hubo despedida."
    solucion: "Conexión perdida y sin despedida."

  - id: toque-marca
    tipo: tocar
    titulo: "Quién pone la hora"
    texto: "Un corte de red de unos minutos. Toque la fila en la que cada dato del corte conserva la hora en que se midió."
    libro: [367, 369, 382, 384]
    widget:
      tipo: figura
      figura: fig-49.19
      zonas:
        - { id: servidor, rotulo: "Fila de arriba", rect: [0, 158, 450, 40] }
        - { id: dispositivo, rotulo: "Fila de abajo", rect: [0, 200, 450, 40] }
    tocar:
      bien: [dispositivo]
      porque:
        servidor: "Si la pone el servidor al recibir, los cuatro datos del corte llegan con la hora de reconexión."
    exito: "La marca tiene que venir del dispositivo. Si en la prueba del banco todos los datos del corte llegan con la hora de reconexión, la pone el servidor."
    escalera:
      - "Busque la fila en la que los círculos del corte están repartidos en el tiempo."
    solucion: "La de abajo: la pone el dispositivo al medir."

  - id: pregunta-retencion
    tipo: tocar
    titulo: "Que la base no crezca sin fin"
    texto: "La estación mide cada cinco minutos, año tras año. Toque el eslabón que evita que el almacén crezca indefinidamente."
    libro: [371, 372]
    widget:
      tipo: figura
      figura: fig-49.19
      zonas:
        - { id: dispositivo, rotulo: "Primer recuadro", rect: [4, 5, 88, 58] }
        - { id: servidor, rotulo: "Segundo recuadro", rect: [123, 5, 88, 58] }
        - { id: base, rotulo: "Tercer recuadro", rect: [242, 5, 88, 58] }
        - { id: panel, rotulo: "Cuarto recuadro", rect: [360, 5, 88, 58] }
    tocar:
      bien: [base]
      porque:
        dispositivo: "El dispositivo solo guarda lo de los cortes."
        servidor: "El servidor reparte; no guarda el histórico."
        panel: "El panel consulta; no decide qué se guarda."
    exito: "La base de series temporales, con retención escalonada: todo lo reciente y agregados de lo antiguo, con consultas por intervalo."
    escalera:
      - "¿Dónde vive el histórico?"
    solucion: "El tercer recuadro."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [349, 355, 358, 359, 360, 369, 379]
    ideas:
      - { titulo: "MQTT.", texto: "Ligero y desacoplado: encaja con un sistema que duerme." }
      - { titulo: "Temas.", texto: "Jerárquicos, un valor por tema, en minúsculas: cambiarlos después rompe a quien consume." }
      - { titulo: "La hora.", texto: "La pone el dispositivo al medir, no el servidor al recibir." }
      - { titulo: "Seguridad.", texto: "Un servidor abierto se encuentra en horas: cifrado, autenticación y credenciales fuera del código." }
