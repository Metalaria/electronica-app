# Lección 1.2 de la sección 50.13 «Seguridad del Dispositivo IoT» (cap49; etiquetas sec-49.N = impresas 50.N).
# - Los cuatro niveles, los cinco errores elementales y el equilibrio razonable (figura 50.25, fig-49.21).
# Sin números ni fórmulas: sin modelo (aviso de secuencia «sin tarjeta de fórmula»).
# Paso práctico: «tocar» en la figura el nivel que protege las credenciales guardadas en el aparato.
leccion: cap49/sec-49.13

libro:
  425: "un aparato comprometido puede servir para atacar la red donde está"
  426: "no hace falta el nivel de un dispositivo bancario, y sí evitar los fallos elementales"
  428: "Si están en claro, cualquiera con acceso físico las lee"
  429: "TLS cifra y autentica"
  430: "que solo se ejecute firmware legítimo"
  431: "que solo se acepte firmware firmado, y con retorno seguro si falla"
  434: "Es el fallo que ha causado las mayores redes de dispositivos comprometidos"
  435: "enviando datos y credenciales en claro"
  436: "un servidor web de depuración que se quedó activo"
  437: "cifra, y no comprueba con quién habla, lo que permite interponerse"
  438: "permite instalar firmware ajeno"
  439: "Los cinco se evitan con decisiones de diseño, no con criptografía sofisticada"
  444: "un puerto JTAG activo da acceso completo"
  447: "el aparato crea una red propia la primera vez"
  450: "el modo de configuración debe cerrarse después, o queda una puerta abierta permanentemente"
  453: "TLS con verificación de certificado."
  454: "Con eso se evita la práctica totalidad de los ataques oportunistas"
  457: "Casi siempre aparece alguno que no se sabía que estaba ahí"
  458: "Los cuatro niveles de seguridad y los cinco errores elementales"

modelo: { valores: {}, calculos: {} }

tarjetas:
  - id: explore-niveles
    tipo: explorar
    titulo: "Una superficie de ataque"
    texto: "Un aparato con wifi comprometido puede atacar la red donde está. Toque los cuatro niveles."
    libro: [425, 428, 429, 430, 431, 458]
    widget:
      tipo: figura
      figura: fig-49.21
      zonas:
        - { id: reposo, rotulo: "Primer recuadro de arriba", rect: [5, 20, 107, 52], texto: "En reposo: credenciales y claves guardadas en la memoria." }
        - { id: transito, rotulo: "Segundo recuadro de arriba", rect: [118, 20, 107, 52], texto: "En tránsito: TLS cifra y autentica." }
        - { id: arranque, rotulo: "Tercer recuadro de arriba", rect: [230, 20, 107, 52], texto: "En el arranque: solo firmware legítimo." }
        - { id: actualizacion, rotulo: "Cuarto recuadro de arriba", rect: [343, 20, 107, 52], texto: "En la actualización: solo firmware firmado, con retorno seguro." }
    requiere: { mover: [reposo, transito, arranque, actualizacion] }

  - id: toque-reposo
    tipo: tocar
    titulo: "Las credenciales guardadas"
    texto: "Si las credenciales del wifi están en claro en la memoria, cualquiera con acceso físico las lee. Toque el nivel que lo cubre."
    libro: [428]
    widget:
      tipo: figura
      figura: fig-49.21
      zonas:
        - { id: reposo, rotulo: "Primer recuadro de arriba", rect: [5, 20, 107, 52] }
        - { id: transito, rotulo: "Segundo recuadro de arriba", rect: [118, 20, 107, 52] }
        - { id: arranque, rotulo: "Tercer recuadro de arriba", rect: [230, 20, 107, 52] }
        - { id: actualizacion, rotulo: "Cuarto recuadro de arriba", rect: [343, 20, 107, 52] }
    tocar:
      bien: [reposo]
      porque:
        transito: "En tránsito es por la red; esto es lo guardado en el aparato."
        arranque: "El arranque decide qué firmware se ejecuta, no protege lo guardado."
        actualizacion: "La actualización controla el firmware nuevo, no las claves guardadas."
    exito: "En reposo: el cifrado de la Flash y el almacenamiento seguro de claves lo cubren."
    escalera:
      - "Las credenciales están guardadas, quietas, en la memoria."
    solucion: "En reposo."

  - id: empareje-errores
    tipo: pregunta
    titulo: "Los cinco errores elementales"
    texto: "Empareje cada error con su consecuencia."
    libro: [434, 435, 436, 437, 438]
    widget:
      tipo: figura
      figura: fig-49.21
      zonas:
        - { id: errores, rotulo: "Recuadro rojo", rect: [5, 80, 443, 93] }
    emparejar:
      - ["Credenciales por defecto iguales", "Las mayores redes de dispositivos comprometidos"]
      - ["Sin cifrado en tránsito", "Datos y credenciales en claro"]
      - ["Sin verificar el certificado", "Se puede interponer alguien"]
      - ["Actualización sin firmar", "Se instala firmware ajeno"]
    exito: "Y el quinto: un puerto de depuración que se quedó abierto."
    pistas:
      - { texto: "Cifrar sin comprobar con quién se habla deja hueco a un intermediario." }
    escalera:
      - "Cada error deja abierta una puerta distinta."
    solucion: "Por defecto, redes enormes; sin cifrar, en claro; sin certificado, intermediario; sin firma, firmware ajeno."

  - id: porque-diseno
    tipo: porque
    titulo: "Sin criptografía sofisticada"
    texto: "¿Por qué los cinco errores elementales no exigen criptografía sofisticada para evitarse?"
    libro: [439, 426]
    widget:
      tipo: figura
      figura: fig-49.21
      zonas:
        - { id: errores, rotulo: "Recuadro rojo", rect: [5, 80, 443, 93] }
    opciones:
      - texto: "Se evitan con decisiones de diseño"
        bien: true
        porque: "Credenciales únicas, TLS verificado, puertos cerrados, firma: decisiones, no algoritmos nuevos."
      - texto: "Porque no son peligrosos"
        porque: "Son los que de verdad comprometen dispositivos reales."
      - texto: "Porque la criptografía no sirve"
        porque: "Sirve; lo que falla en estos casos es el diseño."
    escalera:
      - "¿Hace falta inventar algo para no dejar la contraseña por defecto?"
    solucion: "Son decisiones de diseño."

  - id: pregunta-jtag
    tipo: pregunta
    titulo: "Lo más olvidado"
    texto: "De lo que aporta el hardware, ¿qué es de lo más eficaz y lo más olvidado?"
    libro: [444]
    widget:
      tipo: figura
      figura: fig-49.21
      zonas:
        - { id: arranque, rotulo: "Tercer recuadro de arriba", rect: [230, 20, 107, 52] }
    opciones:
      - texto: "Deshabilitar la depuración en producción"
        bien: true
        porque: "Un puerto JTAG activo da acceso completo."
      - texto: "Un reloj más rápido"
        porque: "La velocidad no tiene que ver con la seguridad."
      - texto: "Más memoria"
        porque: "No protege nada; lo que abre la puerta es la depuración activa."
    escalera:
      - "¿Qué puerto da acceso completo al chip?"
    solucion: "Cerrar la depuración."

  - id: pregunta-provision
    tipo: pregunta
    titulo: "La contraseña del wifi"
    texto: "La estación crea una red propia la primera vez para que el usuario configure el wifi. ¿Qué no puede olvidarse?"
    libro: [447, 450]
    widget:
      tipo: figura
      figura: fig-49.21
      zonas:
        - { id: equilibrio, rotulo: "Recuadro verde", rect: [5, 182, 443, 72] }
    opciones:
      - texto: "Cerrar el modo de configuración después"
        bien: true
        porque: "Si no, queda una puerta abierta permanentemente."
      - texto: "Dejarlo abierto por si hay que cambiar la red"
        porque: "Es justo la puerta abierta que hay que evitar."
      - texto: "Ponerle una contraseña igual para todas"
        porque: "Las credenciales iguales en todas las unidades son el primer error elemental."
    escalera:
      - "¿Qué queda si ese punto de acceso sigue activo?"
    solucion: "Cerrar el modo de configuración."

  - id: pregunta-equilibrio
    tipo: pregunta
    titulo: "Proporcionado"
    texto: "Para un proyecto propio o de pequeña escala, ¿qué nivel de seguridad es el razonable?"
    libro: [426, 453, 454]
    widget:
      tipo: figura
      figura: fig-49.21
      zonas:
        - { id: equilibrio, rotulo: "Recuadro verde", rect: [5, 182, 443, 72] }
    opciones:
      - texto: "TLS verificado, credenciales únicas, sin puertos ni depuración abiertos y actualización firmada"
        bien: true
        porque: "Evita la práctica totalidad de los ataques oportunistas."
      - texto: "El de un dispositivo bancario"
        porque: "No hace falta: el tratamiento debe ser proporcionado."
      - texto: "Ninguno: es solo una estación"
        porque: "Un aparato comprometido puede atacar la red donde está."
    escalera:
      - "Ni el nivel bancario ni nada: lo que evita los fallos elementales."
    solucion: "El equilibrio de la figura."

  - id: predecir-puertos
    tipo: predecir
    titulo: "Escanear el aparato"
    texto: "Se escanea la estación desde la red para ver qué puertos tiene abiertos. ¿Qué es lo habitual?"
    libro: [457]
    widget:
      tipo: figura
      figura: fig-49.21
      zonas:
        - { id: errores, rotulo: "Recuadro rojo", rect: [5, 80, 443, 93] }
    opciones:
      - texto: "Aparece alguno que no se sabía que estaba"
        bien: true
        porque: "Depuración, configuración o un puerto de la biblioteca de red: cerrarlo cuesta una línea."
      - texto: "Ninguno"
        porque: "Casi siempre aparece alguno inesperado."
      - texto: "Solo el de MQTT"
        porque: "Ojalá: casi siempre hay alguno más que nadie recordaba."
    escalera:
      - "Recuerde el servidor web de depuración que se quedó activo."
    solucion: "Alguno inesperado: ciérrelo."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [425, 439, 450, 454]
    ideas:
      - { titulo: "Cuatro niveles.", texto: "En reposo, en tránsito, en el arranque y en la actualización." }
      - { titulo: "Cinco errores.", texto: "Se evitan con decisiones de diseño." }
      - { titulo: "Cerrar puertas.", texto: "Depuración, configuración y puertos que sobran." }
      - { titulo: "Proporcionado.", texto: "Lo razonable evita casi todos los ataques oportunistas." }
