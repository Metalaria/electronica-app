# Lección 1.2 de la sección 50.1 «Objetivo y Especificaciones» (cap49; etiquetas sec-49.N = impresas 50.N).
# - El mapa de la estación (figura 50.1, fig-48.1) y cada línea de la especificación con lo que determina (figura
#   50.2, fig-49.1, con zonas por filas).
# - La cadena de decisiones de la variante autónoma (bloques 24 y 25) y la comprobación de coherencia (bloque 40).
# Sección sin fórmulas ni cálculos: sin modelo (aviso de secuencia «sin tarjeta de fórmula»).
# Paso práctico: «tocar» en la figura 50.2 la línea de la especificación que descarta el ordenador de placa.
# 1.2.1 (autor121-sens, «aprender haciendo», GUIA §13): en el mapa (figura 50.1) se tocan la memoria y lo que cubre
# el pico de la radio; se explora cuántas medidas caben en 24 horas a una cada cinco minutos (288, bloques 9 y 12) y se
# escribe cuántas veces más despierta midiendo cada segundo (bloque 40); las zonas de la figura 50.2 se recalculan
# desde su fuente (filas de 22 px). El orden de la cadena y el criterio de aceptación pasan al resumen.
# 1.3 (contenido13): zonas de la fig-48.1 agrandadas (≥ 43 px a 360 px) y «sin ordenador de placa» se toca en ese mapa,
# no en las filas de 17 px de la fig-49.1.
leccion: cap49/sec-49.1

libro:
  34: "Comparación con instrumentos de referencia en varios puntos"
  36: "Consumo medido compatible con el año de autonomía de la"
  4: "unas pocas líneas determinan todo el diseño"
  8: "Temperatura: ±0,5 °C entre −10 y +50 °C."
  9: "Periodo de medida: una vez cada cinco minutos."
  10: "Variante autónoma: un año con pilas"
  12: "Almacenamiento local: al menos 24 horas de datos"
  13: "hasta el 95 % de humedad"
  16: "descarta las NTC baratas y lleva a un sensor digital calibrado"
  17: "con medida continua no habría forma"
  18: "descarta el ordenador de placa y fija el microcontrolador, su modo de sueño y la radio"
  19: "exige memoria no volátil y marcas de tiempo propias"
  21: "obliga a prever condensación"
  24: "Medir cada cinco minutos en lugar de cada segundo, y enviarlas por lotes"
  25: "el wifi consume mucho al transmitir, lo que obliga a acumular varias medidas y enviarlas juntas"
  31: "añadir cualquiera de ellas después cambia decisiones tomadas"
  35: "Un mes de funcionamiento sin intervención."
  37: "Recuperación automática tras cortes de red y de alimentación."
  40: "una exactitud de ±0,1 °C con un año de pilas y medida cada segundo no es alcanzable"
  41: "Mapa de la estación de medida IoT en su variante autónoma, del sensor a la nube"
  42: "Cada línea de la especificación de la estación y lo que determina"

modelo:
  valores:
    T_p: { sim: "T", nombre: "periodo de medida", unidad: s, valor: 300 }
    t_1: { sim: "T_{1}", nombre: "medida cada segundo", unidad: s, valor: 1 }
    h_d: { sim: "t", nombre: "horas guardadas", unidad: h, valor: 6 }
  calculos:
    N_m: { expr: "h_d*3600/T_p", sim: "N", nombre: "medidas guardadas", unidad: "" }
    r_s: { expr: "T_p/t_1", sim: "razón", nombre: "veces más despertares", unidad: "" }

tarjetas:
  - id: explore-mapa
    tipo: tocar
    titulo: "Del sensor a la nube"
    texto: "La estación mide y lo envía a la nube, y debe guardar al menos 24 horas de datos para cubrir cortes de red. Toque dónde se guardan."
    libro: [12, 19, 41]
    widget:
      tipo: figura
      figura: fig-48.1
      zonas:
        - { id: sensores, rotulo: "Arriba a la izquierda", rect: [4, 4, 98, 66] }
        - { id: esp32, rotulo: "Arriba, el segundo", rect: [124, 4, 102, 66] }
        - { id: nube, rotulo: "Arriba, el tercero", rect: [274, 4, 94, 66] }
        - { id: alimentacion, rotulo: "Abajo a la izquierda", rect: [4, 95.5, 150, 64] }
        - { id: memoria, rotulo: "Abajo, en el centro", rect: [168, 95.5, 94, 64] }
    tocar:
      bien: [memoria]
      porque:
        sensores: "Los sensores miden temperatura, humedad y presión, por I²C; no guardan el histórico."
        esp32: "El ESP32 mide, duerme y envía; las 24 horas necesitan memoria no volátil."
        nube: "El servidor guarda lo que llega; el problema es cuando no llega."
        alimentacion: "Pilas, regulador y condensador: la energía, no los datos."
    exito: "La memoria local: no volátil, y con marcas de tiempo propias, porque sin red no hay hora del servidor."
    escalera:
      - "Busque lo que guarda los datos si no hay red."
    solucion: "Abajo, en el centro: la memoria local."

  - id: explore-memoria
    tipo: explorar
    titulo: "Cuántas medidas en 24 horas"
    texto: "Una medida cada cinco minutos. Lleve la memoria hasta las 24 horas que pide la especificación y mire cuántas medidas guarda."
    libro: [9, 12, 19]
    widget:
      tipo: grafica
      x: { id: h, min: 0, max: 48, unidad: h, rotulo: "horas guardadas" }
      y: { min: 0, max: 600, unidad: "", rotulo: "medidas" }
      curvas:
        - { expr: "h*3600/T_p", color: azul, rotulo: "medidas guardadas" }
      marcas:
        - { x: "h_d", y: "N_m", rotulo: "{{N_m}}" }
      lectura: { valor: N_m, rotulo: "Medidas guardadas" }
      mandos:
        - { valor: h_d, min: 0, max: 48, paso: 1, rotulo: "Horas guardadas" }
    objetivo:
      condiciones:
        - { valor: h_d, min: 24, rotulo: "{{h_d}} guardadas" }
      logrado: "24 horas son {{N_m}} medidas de cada magnitud, cada una con su marca de tiempo: eso dimensiona la memoria no volátil."
      pistas:
        - { texto: "Suba hasta las 24 horas." }
    escalera:
      - "Cuente cuántos tramos de cinco minutos caben en 24 horas."
    solucion: "24 horas: 288 medidas."
    comprobar:
      - { con: { h_d: 24 }, N_m: 288 }

  - id: empareje-lineas
    tipo: pregunta
    titulo: "Lo que cada línea determina"
    texto: "Empareje cada línea de la especificación con lo que determina."
    libro: [8, 9, 10, 12, 13, 16, 17, 19, 21, 42]
    widget:
      tipo: figura
      figura: fig-49.1
      zonas:
        - { id: lista, rotulo: "Las dos columnas", rect: [5, 22, 440, 150] }
    emparejar:
      - ["Temperatura ±0,5 °C", "Un sensor digital calibrado, no una NTC barata"]
      - ["Una medida cada cinco minutos", "El año de autonomía con pilas"]
      - ["24 horas de datos guardados", "Memoria no volátil y marcas de tiempo"]
      - ["Hasta el 95 % de humedad", "Prever la condensación"]
    exito: "Unas pocas líneas determinan todo el diseño."
    pistas:
      - { texto: "Con medida continua, el año con pilas no sería posible." }
    escalera:
      - "Cada línea arrastra una decisión de componente o de firmware."
    solucion: "Exactitud, sensor digital; periodo, autonomía; 24 horas, memoria; humedad, condensación."

  - id: toque-placa
    tipo: tocar
    titulo: "Sin ordenador de placa"
    texto: "Un año con pilas descarta el ordenador de placa y fija el modo de sueño. Toque el bloque que se encarga de dormir y despertar."
    libro: [18, 42]
    widget:
      tipo: figura
      figura: fig-48.1
      zonas:
        - { id: sensores, rotulo: "Arriba a la izquierda", rect: [4, 4, 98, 66] }
        - { id: esp32, rotulo: "Arriba, el segundo", rect: [124, 4, 102, 66] }
        - { id: nube, rotulo: "Arriba, el tercero", rect: [274, 4, 94, 66] }
        - { id: alimentacion, rotulo: "Abajo a la izquierda", rect: [4, 95.5, 150, 64] }
        - { id: memoria, rotulo: "Abajo, en el centro", rect: [168, 95.5, 94, 64] }
    tocar:
      bien: [esp32]
      porque:
        sensores: "Los sensores miden; no deciden cuándo duerme la estación."
        nube: "El servidor está fuera de la estación, con enchufe: no le afecta la pila."
        alimentacion: "Las pilas son lo que obliga; el que duerme y despierta es otro bloque."
        memoria: "La memoria guarda los datos si no hay red; no gobierna el sueño."
    exito: "El microcontrolador con wifi, que duerme y despierta por temporizador: un año con pilas fija el micro, su sueño y la radio, también en la versión USB."
    escalera:
      - "Un ordenador de placa consume demasiado para durar un año con pilas: ¿qué lo sustituye?"
    solucion: "El ESP32: micro con wifi que duerme y despierta por temporizador."

  - id: pregunta-radio
    tipo: tocar
    titulo: "Una quinta decisión"
    texto: "El wifi consume mucho al transmitir: se acumulan varias medidas y se envían juntas. Toque lo que cubre el pico de cada envío."
    libro: [24, 25]
    widget:
      tipo: figura
      figura: fig-48.1
      zonas:
        - { id: sensores, rotulo: "Arriba a la izquierda", rect: [4, 4, 98, 66] }
        - { id: esp32, rotulo: "Arriba, el segundo", rect: [124, 4, 102, 66] }
        - { id: nube, rotulo: "Arriba, el tercero", rect: [274, 4, 94, 66] }
        - { id: alimentacion, rotulo: "Abajo a la izquierda", rect: [4, 95.5, 150, 64] }
        - { id: memoria, rotulo: "Abajo, en el centro", rect: [168, 95.5, 94, 64] }
    tocar:
      bien: [alimentacion]
      porque:
        sensores: "Los sensores consumen poco y no transmiten."
        esp32: "El ESP32 es quien provoca el pico al transmitir; hace falta algo que lo cubra."
        nube: "El servidor recibe; el pico está en la estación."
        memoria: "La memoria acumula las medidas del lote, pero no cubre el pico."
    exito: "El condensador junto al regulador de bajo consumo: cubre el pico de la radio. Medir cada cinco minutos y enviar por lotes deja el consumo medio en décimas de miliamperio: un año con pilas, sin panel solar."
    escalera:
      - "¿Qué pieza guarda energía para un instante?"
    solucion: "Abajo a la izquierda: el condensador de la alimentación."

  - id: pregunta-fuera
    tipo: porque
    titulo: "Lo que queda fuera"
    texto: "La especificación también dice qué no se hace: viento, lluvia, fuente de red propia. ¿Por qué escribirlo?"
    libro: [31]
    widget:
      tipo: figura
      figura: fig-49.1
      zonas:
        - { id: fuera, rotulo: "Recuadro de abajo", rect: [5, 170, 440, 64] }
    opciones:
      - texto: "Cada exclusión simplifica; añadirla después cambia decisiones tomadas"
        bien: true
        porque: "Lo que no se hace también condiciona el diseño."
      - texto: "Por formalidad"
        porque: "Tiene consecuencias: añadir viento o lluvia después obliga a rehacer decisiones."
      - texto: "Para ahorrar papel"
        porque: "Al revés: se escribe más, para evitar rehacer el diseño."
    escalera:
      - "¿Qué pasaría si a mitad de proyecto se añadiera un anemómetro?"
    solucion: "Simplifica, y cambiarlo después rompe decisiones."

  - id: predecir-coherencia
    tipo: leer
    titulo: "Una especificación imposible"
    texto: "Alguien pide ±0,1 °C, un año con pilas y una medida por segundo en lugar de cada cinco minutos. Escriba cuántas veces más despierta la estación."
    libro: [40, 17]
    widget:
      tipo: figura
      figura: fig-49.1
      zonas:
        - { id: fuera, rotulo: "Recuadro de abajo", rect: [5, 170, 440, 64], texto: "Lo que queda fuera y la comprobación de coherencia." }
    leer:
      objetivo: r_s
      unidad: ""
      tol: 0.01
      rotulo: "Veces"
      errores:
        - { expr: "5", texto: "Son cinco minutos, no cinco segundos: páselos a segundos." }
    exito: "300 veces más: con medida casi continua no hay año de pilas posible. Descubrirlo escribiendo cuesta media hora en lugar de medio proyecto."
    escalera:
      - "Cinco minutos son 300 segundos."
    solucion: "300 s / 1 s = 300."
    comprobar:
      - { r_s: 300 }

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [4, 18, 24, 34, 35, 36, 37, 40]
    ideas:
      - { titulo: "Primero, los números.", texto: "Unas pocas líneas determinan todo el diseño; y al final, un criterio: referencias, un mes sin intervención, consumo medido y recuperación tras cortes." }
      - { titulo: "En cadena.", texto: "Cada cinco minutos y por lotes: un año con pilas, sin panel, caja pequeña." }
      - { titulo: "Lo que no se hace.", texto: "También se escribe: añadirlo después cambia decisiones." }
      - { titulo: "Coherencia.", texto: "Comprobarla escribiendo cuesta media hora, no medio proyecto." }
