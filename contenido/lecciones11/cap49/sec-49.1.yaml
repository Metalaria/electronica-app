# Lección 1.2 de la sección 50.1 «Objetivo y Especificaciones» (cap49; etiquetas sec-49.N = impresas 50.N).
# - El mapa de la estación (figura 50.1, fig-48.1) y cada línea de la especificación con lo que determina (figura
#   50.2, fig-49.1, con zonas por filas).
# - La cadena de decisiones de la variante autónoma (bloques 24 y 25) y la comprobación de coherencia (bloque 40).
# Sección sin fórmulas ni cálculos: sin modelo (aviso de secuencia «sin tarjeta de fórmula»).
# Paso práctico: «tocar» en la figura 50.2 la línea de la especificación que descarta el ordenador de placa.
leccion: cap49/sec-49.1

libro:
  4: "unas pocas líneas determinan todo el diseño"
  8: "Temperatura: ±0,5 °C entre −10 y +50 °C."
  9: "Periodo de medida: una vez cada cinco minutos."
  10: "Variante autónoma: un año con pilas"
  12: "Almacenamiento local: al menos 24 horas de datos"
  13: "hasta el 95 % de humedad"
  16: "descarta las NTC baratas y lleva a un sensor digital calibrado"
  17: "con medida continua no habría forma"
  18: "descarta el ordenador de placa y fija el microcontrolador, su modo de sueño y la radio"
  19: "exige memoria no volátil y marcas de tiempo propias"
  21: "obliga a prever condensación"
  24: "Medir cada cinco minutos en lugar de cada segundo, y enviarlas por lotes"
  25: "el wifi consume mucho al transmitir, lo que obliga a acumular varias medidas y enviarlas juntas"
  31: "añadir cualquiera de ellas después cambia decisiones tomadas"
  35: "Un mes de funcionamiento sin intervención."
  37: "Recuperación automática tras cortes de red y de alimentación."
  40: "una exactitud de ±0,1 °C con un año de pilas y medida cada segundo no es alcanzable"
  41: "Mapa de la estación de medida IoT en su variante autónoma, del sensor a la nube"
  42: "Cada línea de la especificación de la estación y lo que determina"

modelo: { valores: {}, calculos: {} }

tarjetas:
  - id: explore-mapa
    tipo: explorar
    titulo: "Del sensor a la nube"
    texto: "La estación mide clima, luz, sonido y movimiento, y lo envía a la nube. Toque el cerebro y la alimentación."
    libro: [41]
    widget:
      tipo: figura
      figura: fig-48.1
      zonas:
        - { id: sensores, rotulo: "Arriba a la izquierda", rect: [6, 8, 80, 56], texto: "Los sensores: temperatura, humedad y presión, por I²C." }
        - { id: esp32, rotulo: "Arriba, el segundo", rect: [128, 8, 94, 56], texto: "El ESP32: microcontrolador con wifi, que duerme y despierta por temporizador." }
        - { id: nube, rotulo: "Arriba, el tercero", rect: [277, 8, 88, 56], texto: "El servidor almacena las medidas, que llegan por wifi con MQTT." }
        - { id: alimentacion, rotulo: "Abajo a la izquierda", rect: [6, 102, 145, 48], texto: "Pilas de litio, regulador de bajo consumo y condensador para los picos." }
        - { id: memoria, rotulo: "Abajo, en el centro", rect: [171, 102, 88, 48], texto: "La memoria local guarda los datos si no hay red." }
    requiere: { mover: [esp32, alimentacion] }

  - id: empareje-lineas
    tipo: pregunta
    titulo: "Lo que cada línea determina"
    texto: "Empareje cada línea de la especificación con lo que determina."
    libro: [8, 9, 10, 12, 13, 16, 17, 19, 21, 42]
    widget:
      tipo: figura
      figura: fig-49.1
      zonas:
        - { id: lista, rotulo: "Las dos columnas", rect: [5, 22, 440, 150] }
    emparejar:
      - ["Temperatura ±0,5 °C", "Un sensor digital calibrado, no una NTC barata"]
      - ["Una medida cada cinco minutos", "El año de autonomía con pilas"]
      - ["24 horas de datos guardados", "Memoria no volátil y marcas de tiempo"]
      - ["Hasta el 95 % de humedad", "Prever la condensación"]
    exito: "Unas pocas líneas determinan todo el diseño."
    pistas:
      - { texto: "Con medida continua, el año con pilas no sería posible." }
    escalera:
      - "Cada línea arrastra una decisión de componente o de firmware."
    solucion: "Exactitud, sensor digital; periodo, autonomía; 24 horas, memoria; humedad, condensación."

  - id: toque-placa
    tipo: tocar
    titulo: "Sin ordenador de placa"
    texto: "Toque la línea de la especificación que descarta el ordenador de placa y fija el modo de sueño."
    libro: [18, 42]
    widget:
      tipo: figura
      figura: fig-49.1
      zonas:
        - { id: temperatura, rotulo: "Primera línea", rect: [5, 16, 445, 36] }
        - { id: periodo, rotulo: "Segunda línea", rect: [5, 41, 445, 36] }
        - { id: pilas, rotulo: "Tercera línea", rect: [5, 66, 445, 36] }
        - { id: datos, rotulo: "Cuarta línea", rect: [5, 91, 445, 36] }
    tocar:
      bien: [pilas]
      porque:
        temperatura: "La exactitud decide el sensor, no el procesador."
        periodo: "El periodo hace posible el año con pilas, pero quien descarta la placa es el año con pilas."
        datos: "Las 24 horas piden memoria no volátil, no otro procesador."
    exito: "Un año con pilas fija el microcontrolador, su sueño y la radio: bajo consumo también en la versión USB."
    escalera:
      - "Un ordenador de placa consume demasiado para durar un año con pilas."
    solucion: "La tercera: un año con pilas."

  - id: ordene-cadena
    tipo: pregunta
    titulo: "Decisiones encadenadas"
    texto: "En la variante autónoma, la primera decisión arrastra a las demás. Ordénelas."
    libro: [24]
    widget:
      tipo: figura
      figura: fig-49.1
      zonas:
        - { id: periodo, rotulo: "Segunda línea", rect: [5, 41, 445, 36] }
    ordenar:
      - "Medir cada cinco minutos y enviar por lotes"
      - "Las pilas duran un año"
      - "No hace falta panel solar"
      - "La caja es pequeña y sin orientación"
      - "Hay que separar el sensor de temperatura de la electrónica"
    exito: "Cuatro decisiones donde la primera determina las otras tres."
    pistas:
      - { texto: "Sin panel solar, la caja puede ser pequeña." }
    escalera:
      - "Empiece por el consumo y termine por el montaje del sensor."
    solucion: "Periodo, un año con pilas, sin panel, caja pequeña, separar el sensor."

  - id: pregunta-radio
    tipo: pregunta
    titulo: "Una quinta decisión"
    texto: "La radio añade una decisión más a la cadena. ¿Cuál?"
    libro: [25]
    widget:
      tipo: figura
      figura: fig-48.1
      zonas:
        - { id: esp32, rotulo: "Arriba, el segundo", rect: [128, 8, 94, 56] }
    opciones:
      - texto: "Acumular medidas, enviarlas juntas y prever un condensador para el pico"
        bien: true
        porque: "El wifi consume mucho al transmitir: se transmite poco y se cubre el pico."
      - texto: "Transmitir cada medida en cuanto se toma"
        porque: "Es justo lo que se evita: cada envío cuesta mucho más que medir."
      - texto: "Cambiar el wifi por cable"
        porque: "La especificación pide comunicación inalámbrica."
    escalera:
      - "¿Qué consume más, medir o transmitir?"
    solucion: "Envíos por lotes y un condensador para el pico."

  - id: pregunta-fuera
    tipo: porque
    titulo: "Lo que queda fuera"
    texto: "La especificación también dice qué no se hace: viento, lluvia, fuente de red propia. ¿Por qué escribirlo?"
    libro: [31]
    widget:
      tipo: figura
      figura: fig-49.1
      zonas:
        - { id: fuera, rotulo: "Recuadro de abajo", rect: [5, 178, 440, 50] }
    opciones:
      - texto: "Cada exclusión simplifica; añadirla después cambia decisiones tomadas"
        bien: true
        porque: "Lo que no se hace también condiciona el diseño."
      - texto: "Por formalidad"
        porque: "Tiene consecuencias: añadir viento o lluvia después obliga a rehacer decisiones."
      - texto: "Para ahorrar papel"
        porque: "Al revés: se escribe más, para evitar rehacer el diseño."
    escalera:
      - "¿Qué pasaría si a mitad de proyecto se añadiera un anemómetro?"
    solucion: "Simplifica, y cambiarlo después rompe decisiones."

  - id: pregunta-aceptacion
    tipo: pregunta
    titulo: "El criterio de aceptación"
    texto: "¿Cuál de estas pruebas forma parte del criterio para dar el proyecto por terminado?"
    libro: [35, 37]
    widget:
      tipo: figura
      figura: fig-48.1
      zonas:
        - { id: nube, rotulo: "Arriba, el tercero", rect: [277, 8, 88, 56] }
    opciones:
      - texto: "Un mes funcionando sin intervención"
        bien: true
        porque: "Junto con la comparación con referencias, el consumo medido y la recuperación tras cortes."
      - texto: "Que funcione una tarde en la mesa"
        porque: "La mesa no descubre lo que depende del tiempo y del ambiente."
      - texto: "Que el firmware compile sin avisos"
        porque: "Necesario, pero no dice si la estación cumple su especificación."
    escalera:
      - "El criterio se mide contra la especificación, en el tiempo."
    solucion: "Un mes sin intervención, entre otras."

  - id: predecir-coherencia
    tipo: predecir
    titulo: "Una especificación imposible"
    texto: "Alguien pide ±0,1 °C, un año con pilas y una medida por segundo. ¿Qué pasa?"
    libro: [40, 17]
    widget:
      tipo: figura
      figura: fig-49.1
      zonas:
        - { id: fuera, rotulo: "Recuadro de abajo", rect: [5, 178, 440, 50] }
    opciones:
      - texto: "No es alcanzable, y descubrirlo escribiendo cuesta media hora"
        bien: true
        porque: "Con medida continua no hay año de pilas posible. Mejor saberlo antes que a medio proyecto."
      - texto: "Se consigue con un sensor mejor"
        porque: "El problema es el consumo de medir cada segundo, no el sensor."
      - texto: "Se consigue con pilas más grandes"
        porque: "Las líneas son incoherentes entre sí: hay que cambiar alguna."
    escalera:
      - "¿Qué hacía posible el año con pilas?"
    solucion: "Incoherente: hay que comprobarlo al escribir la especificación."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [4, 18, 24, 40]
    ideas:
      - { titulo: "Primero, los números.", texto: "Unas pocas líneas determinan todo el diseño." }
      - { titulo: "En cadena.", texto: "Cada cinco minutos y por lotes: un año con pilas, sin panel, caja pequeña." }
      - { titulo: "Lo que no se hace.", texto: "También se escribe: añadirlo después cambia decisiones." }
      - { titulo: "Coherencia.", texto: "Comprobarla escribiendo cuesta media hora, no medio proyecto." }
