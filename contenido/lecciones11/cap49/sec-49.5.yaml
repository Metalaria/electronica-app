# Lección 1.2 de la sección 50.5 «El Esquema Eléctrico Completo» (cap49; etiquetas sec-49.N = impresas 50.N).
# - El esquema de la estación (figura 50.11, fig-49.8): pull-ups de 4,7 kΩ, ESP32 DevKit, BME280 (0x76), BH1750
#   (0x23), OLED (0x3C), MAX9814 al GPIO34 (ADC1) y PIR a 5 V; y las anotaciones imprescindibles (figura 50.12).
# - Ejercicio 50.2 (bloque 265): cada dispositivo I²C tiene su dirección.
# Sin fórmulas (aviso de secuencia «sin tarjeta de fórmula»).
# Paso práctico: «banco» opcional, recorrer el esquema midiendo el raíl de 3,3 V en un sensor (bloque 187); la
# tolerancia de ± 3 % es de ejemplo.
leccion: cap49/sec-49.5

libro:
  157: "dentro de un año será la única explicación disponible"
  159: "con las tensiones anotadas en cada nodo"
  160: "con su reloj, su reset y su conector de programación"
  161: "sus resistencias de pull-up si el bus las necesita"
  163: "Conectores de todo lo que salga de la placa, con su función indicada"
  166: "convierten el diagnóstico en comparar"
  168: "«R7 fija la corriente del LED a 5 mA»"
  169: "Las direcciones de los dispositivos del bus, que evitan duplicados"
  170: "permite diagnosticar un consumo anómalo"
  178: "ERC en cero, con los avisos revisados uno a uno."
  179: "Patillajes cotejados con las hojas de datos de los componentes exactos"
  180: "Revisión por otra persona, o al menos con un día de por medio."
  181: "La lista de materiales generada"
  183: "un símbolo con el patillaje equivocado produce un esquema coherente y una placa inservible"
  184: "sobre todo en los que se hayan tomado de bibliotecas ajenas"
  187: "recorrerlo midiendo las tensiones anotadas"
  188: "Esquema eléctrico completo de la estación IoT"
  189: "Las anotaciones imprescindibles de un esquema y el error que ningún ERC detecta"
  "cap49#265": "BME280 en 0x76, BH1750 en 0x23, OLED en 0x3C"
  "cap49#263": "a través del regulador de 3,3 V de la placa DevKit"
  "cap49#198": "4,7 kΩ son adecuados a 100 kHz"

modelo:
  valores:
    V_3: { sim: "3V3", nombre: "raíl de 3,3 V", unidad: V, valor: 3.3 }
  calculos: {}

tarjetas:
  - id: explore-esquema
    tipo: explorar
    titulo: "El esquema como documento"
    texto: "Dentro de un año, el esquema será la única explicación disponible. Toque el ESP32, un sensor del bus y el micrófono."
    libro: [157, 188, "cap49#198"]
    widget:
      tipo: figura
      figura: fig-49.8
      zonas:
        - { id: pullups, rotulo: "Resistencias de arriba a la izquierda", rect: [25, 18, 80, 42], texto: "R1 y R2, de 4,7 kΩ: las pull-ups de SDA y SCL." }
        - { id: esp32, rotulo: "Bloque azul", rect: [95, 120, 115, 190], texto: "El ESP32 DevKit: SDA en GPIO21, SCL en GPIO22, el audio en GPIO34." }
        - { id: bme, rotulo: "Primer bloque verde", rect: [228, 90, 62, 58], texto: "BME280 en 0x76, en el bus I²C." }
        - { id: mic, rotulo: "Bloque naranja", rect: [272, 177, 95, 56], texto: "El MAX9814: analógico, al GPIO34 del ADC1, que funciona con el wifi activo." }
        - { id: pir, rotulo: "Bloque rojo", rect: [272, 264, 95, 56], texto: "El PIR de movimiento, alimentado a 5 V." }
    requiere: { mover: [esp32, bme, mic] }

  - id: empareje-bloques
    tipo: pregunta
    titulo: "Los bloques del esquema"
    texto: "Empareje cada bloque del esquema con lo que no puede faltar en él."
    libro: [159, 160, 161, 163]
    widget:
      tipo: figura
      figura: fig-49.8
      zonas:
        - { id: todo, rotulo: "El esquema", rect: [0, 0, 450, 340] }
    emparejar:
      - ["Alimentación", "Las tensiones anotadas en cada nodo"]
      - ["Microcontrolador", "Reloj, reset y conector de programación"]
      - ["Sensores", "Pull-ups si el bus las necesita"]
      - ["Conectores", "Su función indicada"]
    exito: "Cada elección anotada: así el esquema sirve también dentro de un año."
    pistas:
      - { texto: "Las pull-ups van con los sensores del bus." }
    escalera:
      - "Piense en qué buscaría usted al diagnosticar cada bloque."
    solucion: "Alimentación, tensiones; micro, reloj y reset; sensores, pull-ups; conectores, función."

  - id: toque-analogico
    tipo: tocar
    titulo: "El único analógico"
    texto: "Toque en el esquema el único dispositivo que no va por el bus I²C y entra por el convertidor."
    libro: [188, "cap49#265"]
    widget:
      tipo: figura
      figura: fig-49.8
      zonas:
        - { id: bme, rotulo: "Primer bloque verde", rect: [228, 90, 62, 58] }
        - { id: oled, rotulo: "Tercer bloque verde", rect: [375, 90, 62, 58] }
        - { id: mic, rotulo: "Bloque naranja", rect: [272, 177, 95, 56] }
        - { id: pir, rotulo: "Bloque rojo", rect: [272, 264, 95, 56] }
    tocar:
      bien: [mic]
      porque:
        bme: "El BME280 va por el bus, en la dirección 0x76."
        oled: "La pantalla OLED va por el bus, en la dirección 0x3C."
        pir: "El PIR da una salida digital de movimiento a un GPIO, no al convertidor."
    exito: "El micrófono, al GPIO34 del ADC1: el que funciona con el wifi activo."
    escalera:
      - "Busque la señal etiquetada como audio."
    solucion: "El MAX9814, el micrófono."

  - id: pregunta-tensiones
    tipo: pregunta
    titulo: "Las tensiones anotadas"
    texto: "¿Para qué anotar en el esquema las tensiones esperadas en los nodos clave?"
    libro: [166, 168, 170, 189]
    widget:
      tipo: figura
      figura: fig-49.9
      zonas:
        - { id: anotaciones, rotulo: "Mitad izquierda", rect: [0, 0, 225, 178] }
    opciones:
      - texto: "Convierten el diagnóstico en comparar"
        bien: true
        porque: "Con el consumo previsto de cada bloque, permiten localizar un consumo anómalo."
      - texto: "Para que el ERC salga limpio"
        porque: "El ERC no las usa: son para quien diagnostica."
      - texto: "Por estética"
        porque: "Son de trabajo: separan un esquema utilizable de uno que solo sirvió una vez."
    escalera:
      - "Con la placa montada, ¿qué hace usted con el multímetro?"
    solucion: "Diagnosticar comparando."

  - id: pregunta-direcciones
    tipo: pregunta
    titulo: "Tres dispositivos, dos hilos"
    texto: "BME280, BH1750 y la OLED comparten dos hilos. ¿Cómo sabe el ESP32 a cuál habla?"
    libro: [169, "cap49#265"]
    widget:
      tipo: figura
      figura: fig-49.8
      zonas:
        - { id: sensores, rotulo: "Los tres bloques verdes", rect: [228, 90, 210, 58] }
    opciones:
      - texto: "Por la dirección de cada uno: 0x76, 0x23 y 0x3C"
        bien: true
        porque: "El maestro envía primero la dirección y solo responde ese; anotarlas evita duplicados."
      - texto: "Por un hilo de selección para cada uno"
        porque: "Eso es SPI; I²C lleva el direccionamiento integrado."
      - texto: "Habla con todos a la vez"
        porque: "Solo contesta el que tiene la dirección enviada."
    escalera:
      - "Mire los números escritos en cada bloque verde."
    solucion: "Por su dirección I²C."

  - id: ordene-revision
    tipo: pregunta
    titulo: "Antes de darlo por bueno"
    texto: "Ordene las comprobaciones del esquema antes de darlo por bueno."
    libro: [178, 179, 180, 181]
    widget:
      tipo: figura
      figura: fig-49.9
      zonas:
        - { id: error, rotulo: "Mitad derecha", rect: [225, 0, 225, 178] }
    ordenar:
      - "ERC en cero, con los avisos revisados"
      - "Patillajes cotejados con las hojas de datos"
      - "Revisión por otra persona, o con un día de por medio"
      - "Lista de materiales generada y suficiente para comprar"
    exito: "Con ella sola se podría comprar todo."
    pistas:
      - { texto: "La herramienta automática va primero; la lista de materiales, al final." }
    escalera:
      - "Del chequeo automático al humano, y por último la compra."
    solucion: "ERC, patillajes, otra persona, lista de materiales."

  - id: porque-patillaje
    tipo: porque
    titulo: "Lo que el ERC no ve"
    texto: "¿Por qué un símbolo con el patillaje equivocado pasa el ERC?"
    libro: [183, 184]
    widget:
      tipo: figura
      figura: fig-49.9
      zonas:
        - { id: error, rotulo: "Mitad derecha", rect: [225, 0, 225, 178] }
    opciones:
      - texto: "El esquema es coherente consigo mismo; solo la placa es inservible"
        bien: true
        porque: "La defensa: cotejar el patillaje componente a componente, sobre todo los de bibliotecas ajenas."
      - texto: "Porque el ERC está mal configurado"
        porque: "El ERC comprueba las conexiones del dibujo, no si coinciden con la pieza real."
      - texto: "Porque los patillajes no importan"
        porque: "Importan: la placa sale inservible."
    escalera:
      - "¿Con qué compara el ERC: con el dibujo o con la pieza física?"
    solucion: "El ERC no conoce la pieza real: hay que cotejar el patillaje."

  - id: banco-raiz
    tipo: banco
    titulo: "Recorrer el esquema midiendo"
    texto: "Con la placa montada y alimentada, mida el raíl de 3,3 V en la patilla VCC del BME280."
    nota: "La tolerancia del ± 3 % es de ejemplo."
    libro: [187, "cap49#263"]
    banco:
      piezas: ["La estación montada y alimentada por USB", "Multímetro en V⎓"]
      medir: "La tensión entre VCC y GND del módulo BME280."
      esperado: V_3
      unidad: V
      tol: 0.03
      consejos:
        - { cuando: { valor: desviacion, mayor: 0.03 }, texto: "Mide de más: compruebe que mide el 3V3 y no el 5 V del PIR." }
        - { cuando: { valor: desviacion, menor: -0.03 }, texto: "Mide de menos: o hay una avería, o la anotación estaba mal. Mida en la salida del regulador." }
        - { texto: "Coincide: el esquema es fiable y servirá para diagnosticar." }
    comprobar:
      - { V_3: 3.3 }

  - id: predecir-discrepancia
    tipo: predecir
    titulo: "Una tensión que no coincide"
    texto: "Al recorrer el esquema midiendo, una tensión no coincide con la anotada. ¿Qué indica?"
    libro: [187]
    widget:
      tipo: figura
      figura: fig-49.9
      zonas:
        - { id: anotaciones, rotulo: "Mitad izquierda", rect: [0, 0, 225, 178] }
    opciones:
      - texto: "O hay una avería o la anotación estaba mal: conviene saber cuál"
        bien: true
        porque: "Las dos cosas conviene saberlas: una para reparar, otra para corregir el esquema."
      - texto: "Que el multímetro está mal"
        porque: "Es lo menos probable: el esquema o la placa discrepan."
      - texto: "Nada: las anotaciones son orientativas"
        porque: "Son la herramienta de diagnóstico: si no coinciden, algo hay que saber."
    escalera:
      - "Hay dos fuentes posibles de la diferencia: la placa y el papel."
    solucion: "Una avería, o una anotación equivocada."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [157, 166, 169, 183]
    ideas:
      - { titulo: "Documento de trabajo.", texto: "Cada elección anotada, porque dentro de un año será lo único." }
      - { titulo: "Anotaciones.", texto: "Tensiones, puntos de prueba, porqués, direcciones y consumos." }
      - { titulo: "Antes de darlo por bueno.", texto: "ERC, patillajes, otra persona y la lista de materiales." }
      - { titulo: "El patillaje.", texto: "Lo que ningún ERC detecta: cotejarlo pieza a pieza." }
