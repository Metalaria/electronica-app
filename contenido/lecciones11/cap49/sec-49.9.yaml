# Lección 1.2 de la sección 50.9 «Lista de Materiales (BOM)» (cap49; etiquetas sec-49.N = impresas 50.N).
# - Cada elección responde a una línea de la especificación (bloques 271 a 276) y lo que se compra por especificación.
# - El presupuesto de energía (tabla del bloque 297, figura 50.18): un regulador de 50 µA en vacío frente a uno de
#   1 µA. La gráfica toma el ciclo de la sección 50.2 con envío cada hora (50 500 µA·s cada 300 s, unos 168 µA, que
#   ya incluyen 1 µA de regulador) y le suma lo que el regulador gasta de más: con 50 µA, unos 217 µA y poco más de
#   año y medio con 3 000 mA·h, frente a unos dos años (bloque 298).
# Sin bloque «ec» (aviso de secuencia «sin tarjeta de fórmula»).
leccion: cap49/sec-49.9

libro:
  269: "cada elección responde a una línea de la especificación"
  271: "El criterio decisivo es el consumo durmiendo"
  272: "Digital porque evita todo el acondicionamiento analógico y su deriva"
  274: "FRAM si las escrituras son frecuentes"
  276: "estanca pero ventilada para los sensores"
  279: "El regulador, por su consumo en vacío."
  280: "Los sensores, por su exactitud."
  281: "La memoria, por sus ciclos de escritura."
  282: "Las pilas, por su comportamiento en frío"
  288: "Condensador de reserva para los picos de transmisión"
  289: "contra las sobretensiones inducidas en los cables"
  294: "el consumo de cada elemento activo"
  297: "Regulador"
  298: "un regulador con 50 µA de consumo en vacío consumiría durmiendo más que todo el resto junto"
  300: "sumar el consumo durmiendo de todos los elementos y comprobar contra el objetivo"
  301: "hay un componente mal elegido"
  302: "Presupuesto de energía por elemento y autonomía resultante"
  "cap49#63": "transmitir cada hora en lugar de en cada medida divide por doce el término dominante, el ciclo baja a 50 500 µA·s"

modelo:
  valores:
    I_q: { sim: "I_{q}", nombre: "consumo en vacío del regulador", unidad: A, valor: 1e-6 }
  calculos:
    I_b: { expr: "50500e-6/300", sim: "I_{ciclo}", nombre: "media del ciclo con envío cada hora", unidad: A }
    I_v: { expr: "I_b + I_q - 1e-6", sim: "I_{media}", nombre: "corriente media", unidad: A }
    a_n: { expr: "3/(I_v*8760)", sim: "autonomía", nombre: "autonomía con 3 000 mA·h", unidad: "años" }

tarjetas:
  - id: explore-bom
    tipo: explorar
    titulo: "Activo y durmiendo"
    texto: "La lista debe permitir sumar el presupuesto de energía. Toque los dos lados de la figura."
    libro: [294, 302]
    widget:
      tipo: figura
      figura: fig-49.15
      zonas:
        - { id: elementos, rotulo: "Gráfica de la izquierda", rect: [40, 10, 160, 165], texto: "Activo y durmiendo, por elemento: durmiendo, el regulador pesa tanto como los sensores." }
        - { id: autonomia, rotulo: "Gráfica de la derecha", rect: [245, 10, 190, 165], texto: "La autonomía con 3 000 mA·h frente al consumo medio." }
    requiere: { mover: [elementos, autonomia] }

  - id: empareje-criterios
    tipo: pregunta
    titulo: "Cada elección, su razón"
    texto: "Empareje cada bloque de la lista con su criterio decisivo."
    libro: [269, 271, 272, 274, 276]
    widget:
      tipo: figura
      figura: fig-49.15
      zonas:
        - { id: elementos, rotulo: "Gráfica de la izquierda", rect: [40, 10, 160, 165] }
    emparejar:
      - ["Microcontrolador", "El consumo durmiendo"]
      - ["Sensor de temperatura y humedad", "Digital y calibrado de fábrica"]
      - ["Memoria no volátil", "FRAM si las escrituras son frecuentes"]
      - ["Caja", "Estanca pero ventilada"]
    exito: "Cada elección responde a una línea de la especificación."
    pistas:
      - { texto: "La FRAM aguanta escrituras casi ilimitadas." }
    escalera:
      - "El microcontrolador pasa casi todo el tiempo durmiendo."
    solucion: "Micro, sueño; sensor, digital calibrado; memoria, FRAM; caja, estanca y ventilada."

  - id: explore-regulador
    tipo: explorar
    titulo: "El regulador en vacío"
    texto: "Con el ciclo de envío cada hora, cambie el consumo en vacío del regulador y mire la autonomía."
    libro: [297, 298, "cap49#63"]
    widget:
      tipo: grafica
      x: { id: qq, min: 1e-6, max: 100e-6, unidad: A, rotulo: "regulador en vacío", escala: log }
      y: { min: 0, max: 2.5, unidad: "años", rotulo: "autonomía" }
      curvas:
        - { expr: "3/((I_b + qq - 1e-6)*8760)", color: naranja, rotulo: "autonomía" }
        - { expr: "1", color: tinta, rotulo: "un año", discontinua: true }
      marcas:
        - { x: "I_q", y: "a_n", rotulo: "{{a_n}}" }
      lectura: { valor: a_n, rotulo: "Autonomía" }
      datos:
        - { valor: I_v, rotulo: "Media: {{I_v}}" }
      mandos:
        - { valor: I_q, lista: [1e-6, 5e-6, 20e-6, 50e-6], rotulo: "Regulador en vacío" }
    requiere: { mover: [I_q] }

  - id: predecir-50
    tipo: predecir
    titulo: "Un regulador de 50 µA"
    texto: "Con envío cada hora y pilas de 3 000 mA·h, se monta un regulador de 50 µA en vacío en lugar de uno de 1 µA. ¿Qué autonomía queda?"
    libro: [298]
    fijar: { I_q: 50e-6 }
    widget:
      tipo: figura
      figura: fig-49.15
      zonas:
        - { id: autonomia, rotulo: "Gráfica de la derecha", rect: [245, 10, 190, 165] }
    opciones:
      - texto: "Poco más de año y medio, en lugar de unos dos años"
        bien: true
        porque: "Durmiendo gasta más que todo el resto junto: el suelo de reposo se multiplica por más de cinco."
      - texto: "Casi los mismos dos años"
        porque: "50 µA es más que todo el reposo del resto: se nota mucho."
      - texto: "Menos de un año"
        porque: "Baja mucho, pero la radio sigue dominando: queda poco más de año y medio."
    escalera:
      - "Compare los 50 µA con los 10 µA del reposo de todo lo demás."
    solucion: "Poco más de año y medio."
    comprobar:
      - { a_n: 1.58, tol: 0.01 }
      - { con: { I_q: 1e-6 }, a_n: 2.03, tol: 0.01 }

  - id: empareje-especificacion
    tipo: pregunta
    titulo: "Por especificación, no por precio"
    texto: "Empareje cada componente con la especificación por la que se compra."
    libro: [279, 280, 281, 282]
    widget:
      tipo: figura
      figura: fig-49.15
      zonas:
        - { id: elementos, rotulo: "Gráfica de la izquierda", rect: [40, 10, 160, 165] }
    emparejar:
      - ["Regulador", "Consumo en vacío"]
      - ["Sensores", "Exactitud"]
      - ["Memoria", "Ciclos de escritura"]
      - ["Pilas", "Comportamiento en frío"]
    exito: "En el resto, pasivos, conectores y caja, basta el criterio corriente."
    pistas:
      - { texto: "Las pilas pierden capacidad con el frío del invierno." }
    escalera:
      - "Cada uno se compra por la línea de la especificación que más le afecta."
    solucion: "Regulador, vacío; sensores, exactitud; memoria, ciclos; pilas, frío."

  - id: pregunta-olvidados
    tipo: pregunta
    titulo: "Lo que se olvida"
    texto: "¿Cuál de estos componentes se olvida en la lista y hace falta igualmente?"
    libro: [288, 289]
    widget:
      tipo: figura
      figura: fig-49.15
      zonas:
        - { id: elementos, rotulo: "Gráfica de la izquierda", rect: [40, 10, 160, 165] }
    opciones:
      - texto: "El condensador de reserva para los picos de transmisión"
        bien: true
        porque: "Con el desacoplo, las pull-ups, la protección, los puntos de prueba y las ferritas."
      - texto: "Un segundo microcontrolador"
        porque: "Con la radio integrada basta uno."
      - texto: "Un disipador para el ESP32"
        porque: "Duerme casi siempre: no hace falta disipador."
    escalera:
      - "¿Qué cubre los picos de cientos de miliamperios de la radio?"
    solucion: "El condensador de reserva."

  - id: pregunta-banco
    tipo: porque
    titulo: "Antes de comprar"
    texto: "¿Por qué se suma el consumo durmiendo de toda la lista antes de comprar nada?"
    libro: [300, 301]
    widget:
      tipo: figura
      figura: fig-49.15
      zonas:
        - { id: elementos, rotulo: "Gráfica de la izquierda", rect: [40, 10, 160, 165] }
    opciones:
      - texto: "Si se aleja de unos 10 µA, hay un componente mal elegido, y se ve en minutos"
        bien: true
        porque: "Localizarlo en la hoja de cálculo cuesta minutos; midiendo la autonomía real, semanas."
      - texto: "Para saber el precio total"
        porque: "Es una comprobación de consumo: la que valida la lista contra la autonomía."
      - texto: "Porque lo pide el ERC"
        porque: "El ERC revisa conexiones, no consumos."
    escalera:
      - "¿Qué elemento durmiendo podría pasar de unos microamperios sin que nadie lo note?"
    solucion: "Para detectar un componente mal elegido antes de comprar."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [269, 279, 298, 300]
    ideas:
      - { titulo: "Cada cosa, por algo.", texto: "Cada elección responde a una línea de la especificación." }
      - { titulo: "Por especificación.", texto: "Regulador, sensores, memoria y pilas." }
      - { titulo: "El regulador.", texto: "50 µA en vacío bajan dos años a poco más de año y medio." }
      - { titulo: "Antes de comprar.", texto: "Sumar el consumo durmiendo de toda la lista." }
