# Lección 1.2 de la sección 50.3 «Los Sensores y su Interfaz» (cap49; etiquetas sec-49.N = impresas 50.N).
# - Los cuatro errores de montaje y la alimentación de los sensores desde un pin (figura 50.8, fig-49.5).
# - El BME280 de la foto 50.7 (fig-49.4): ±3 % de HR y ±1 hPa, pero ±0,5 °C solo cerca de 25 °C (bloque 92).
# - El cable del sensor exterior con I²C: uno o dos metros a 100 kHz, decímetros a 400 kHz (bloque 112).
# Sin fórmulas ni modelo (aviso de secuencia «sin tarjeta de fórmula»).
# Paso práctico: «tocar» en la foto del BME280 el orificio por el que entra el aire.
leccion: cap49/sec-49.3

libro:
  89: "Lo que decide el resultado no es tanto cuál se elige como cómo se monta"
  92: "en temperatura ±0,5 °C solo cerca de 25 °C y ±1 °C en el margen de 0 a 65 °C"
  105: "mide el calor de la placa, no el del aire"
  106: "mide una humedad relativa menor que la real"
  107: "tras un plástico que filtra sin que se sepa cuánto"
  108: "midiendo el aire estancado de la caja"
  109: "un sensor mide donde está, no donde se pretende"
  111: "el sensor fuera, en un abrigo meteorológico ventilado, unido por cable"
  112: "la capacidad del cable limita la longitud a uno o dos metros a 100 kHz, y a decímetros a 400 kHz"
  113: "1-Wire o RS-485"
  116: "se pueden reiniciar si dejan de responder, que resuelve buena parte de los bloqueos de I²C"
  117: "el consumo del sensor debe caber en los 20 mA de un pin"
  120: "Las discrepancias aparecen sobre todo con sol directo"
  121: "Los cuatro errores de montaje de sensores y la alimentación desde un pin"
  "cap49#86": "con el orificio por el que entra el aire"
  "cap49#8": "Temperatura: ±0,5 °C entre −10 y +50 °C."

modelo: { valores: {}, calculos: {} }

tarjetas:
  - id: explore-montaje
    tipo: explorar
    titulo: "Cómo se monta"
    texto: "Lo que decide el resultado no es tanto cuál se elige como cómo se monta. Toque los cuatro errores."
    libro: [89, 121]
    widget:
      tipo: figura
      figura: fig-49.5
      zonas:
        - { id: temperatura, rotulo: "Arriba, en el centro", rect: [175, 3, 135, 72], texto: "Temperatura junto a la placa: mide el calor de la placa. Separado, ventilado y a la sombra." }
        - { id: humedad, rotulo: "Arriba a la derecha", rect: [314, 3, 133, 72], texto: "Humedad más caliente que el aire: lee menos. Lo mismo: separado y ventilado." }
        - { id: luz, rotulo: "En medio, en el centro", rect: [175, 80, 135, 72], texto: "Luz tras un plástico que filtra sin saber cuánto." }
        - { id: gas, rotulo: "En medio, a la derecha", rect: [314, 80, 133, 72], texto: "Gas sin ventilación: mide el aire estancado de la caja." }
        - { id: pin, rotulo: "Recuadro verde de abajo", rect: [4, 157, 442, 150], texto: "Alimentar los sensores desde un pin: sin consumo en reposo, pero hasta 20 mA." }
    requiere: { mover: [temperatura, humedad, luz, gas] }

  - id: pregunta-bme280
    tipo: pregunta
    titulo: "Leer bien la hoja de datos"
    texto: "La especificación pide ±0,5 °C entre −10 y +50 °C. ¿Lo cumple el BME280 tal cual?"
    libro: [92, "cap49#8"]
    widget:
      tipo: figura
      figura: fig-49.4
      zonas:
        - { id: bme, rotulo: "Foto de la izquierda", rect: [0, 0, 500, 660] }
    opciones:
      - texto: "No: ±0,5 °C solo cerca de 25 °C; hay que calibrarlo o usar otro sensor"
        bien: true
        porque: "En el margen de 0 a 65 °C da ±1 °C: se calibra en varios puntos o se confía la temperatura a un sensor más exacto."
      - texto: "Sí: es un sensor digital calibrado"
        porque: "Calibrado de fábrica, pero su cifra de ±0,5 °C solo vale cerca de 25 °C."
      - texto: "Sí, porque cumple la humedad y la presión"
        porque: "Humedad y presión cumplen; la temperatura en todo el margen, no."
    escalera:
      - "Mire en qué temperaturas vale cada cifra de exactitud."
    solucion: "No en todo el margen: calibrar en varios puntos o un sensor dedicado."

  - id: empareje-errores
    tipo: pregunta
    titulo: "Los errores de montaje"
    texto: "Empareje cada error de montaje con lo que provoca."
    libro: [105, 106, 107, 108]
    widget:
      tipo: figura
      figura: fig-49.5
      zonas:
        - { id: caja, rotulo: "Caja de la izquierda", rect: [8, 18, 160, 110] }
    emparejar:
      - ["Temperatura junto a la placa", "Mide el calor de la placa"]
      - ["Humedad más caliente que el aire", "Lee una humedad relativa menor"]
      - ["Luz tras un plástico", "Filtra sin que se sepa cuánto"]
      - ["Gas sin ventilación", "Mide el aire estancado de la caja"]
    exito: "Arruinan medidas correctas: el sensor está bien, el montaje no."
    pistas:
      - { texto: "El de humedad y el de temperatura tienen la misma solución: separado y ventilado." }
    escalera:
      - "Cada sensor mide lo que tiene alrededor."
    solucion: "Placa, calor; humedad caliente, lee menos; plástico, filtra; sin ventilación, aire estancado."

  - id: toque-orificio
    tipo: tocar
    titulo: "Por dónde entra el aire"
    texto: "El BME280 mide aire. Toque en la foto por dónde le entra."
    libro: ["cap49#86"]
    widget:
      tipo: figura
      figura: fig-49.4
      zonas:
        - { id: orificio, rotulo: "Círculo oscuro, a la izquierda", rect: [65, 240, 135, 135] }
        - { id: marcado, rotulo: "Letras del centro", rect: [205, 180, 150, 150] }
        - { id: patillas, rotulo: "Borde de abajo", rect: [40, 500, 440, 130] }
    tocar:
      bien: [orificio]
      porque:
        marcado: "Es el marcado del encapsulado: identifica la pieza."
        patillas: "Son los contactos que se sueldan a la placa."
    exito: "Por ese orificio entra el aire: si se tapa o queda dentro de una caja cerrada, mide la caja."
    escalera:
      - "Busque una abertura en la tapa metálica."
    solucion: "El orificio redondo de la izquierda."

  - id: porque-donde
    tipo: porque
    titulo: "Mide donde está"
    texto: "¿Qué regla une los cuatro errores de montaje?"
    libro: [109]
    widget:
      tipo: figura
      figura: fig-49.5
      zonas:
        - { id: caja, rotulo: "Caja de la izquierda", rect: [8, 18, 160, 110] }
    opciones:
      - texto: "Un sensor mide donde está, no donde se pretende"
        bien: true
        porque: "Si está dentro de una caja, mide el interior de la caja."
      - texto: "Los sensores baratos fallan"
        porque: "Un sensor caro mal montado falla igual: el problema es dónde está."
      - texto: "Hay que calibrar más"
        porque: "La calibración no corrige que mida otro aire."
    escalera:
      - "¿Qué aire ve un sensor metido en la caja?"
    solucion: "Mide donde está."

  - id: predecir-cable
    tipo: predecir
    titulo: "El sensor fuera, con cable"
    texto: "El sensor va fuera, en un abrigo ventilado, y su I²C se alarga dos metros a 400 kHz. ¿Qué pasa?"
    libro: [111, 112]
    widget:
      tipo: figura
      figura: fig-49.5
      zonas:
        - { id: pin, rotulo: "Recuadro verde de abajo", rect: [4, 157, 442, 150] }
    opciones:
      - texto: "Falla: a 400 kHz la capacidad del cable solo admite decímetros"
        bien: true
        porque: "A 100 kHz caben uno o dos metros; a 400 kHz, decímetros."
      - texto: "Funciona: I²C llega a cualquier distancia"
        porque: "La capacidad del cable limita la longitud, y más cuanto más rápido."
      - texto: "Funciona mejor que a 100 kHz"
        porque: "Al revés: a más velocidad, menos longitud."
    escalera:
      - "La capacidad del cable frena los flancos."
    solucion: "Falla: baje a 100 kHz o use otro bus."

  - id: pregunta-distancia
    tipo: pregunta
    titulo: "Para llegar más lejos"
    texto: "¿Cómo se lleva un sensor más lejos de lo que permite I²C?"
    libro: [113]
    widget:
      tipo: figura
      figura: fig-49.5
      zonas:
        - { id: pin, rotulo: "Recuadro verde de abajo", rect: [4, 157, 442, 150] }
    opciones:
      - texto: "Con un bus más robusto, 1-Wire o RS-485, o un micro junto al sensor"
        bien: true
        porque: "El micro pequeño habla un protocolo apto para distancia."
      - texto: "Con pull-ups más grandes"
        porque: "Pull-ups más grandes hacen los flancos más lentos: peor."
      - texto: "Subiendo la velocidad"
        porque: "Más velocidad, menos longitud admitida."
    escalera:
      - "Hace falta otro bus, o acercar la electrónica al sensor."
    solucion: "1-Wire, RS-485 o un microcontrolador junto al sensor."

  - id: pregunta-pin
    tipo: pregunta
    titulo: "Sensores alimentados desde un pin"
    texto: "Se alimentan los sensores desde un pin del microcontrolador. ¿Qué se gana, además de consumo?"
    libro: [116, 117]
    widget:
      tipo: figura
      figura: fig-49.5
      zonas:
        - { id: pin, rotulo: "Recuadro verde de abajo", rect: [4, 157, 442, 150] }
    opciones:
      - texto: "Reiniciarlos si dejan de responder, contra los bloqueos de I²C"
        bien: true
        porque: "El límite: que su consumo quepa en los 20 mA del pin, y esperar su arranque antes de leer."
      - texto: "Más exactitud"
        porque: "La exactitud es la del sensor; se gana poder apagarlos y reiniciarlos."
      - texto: "Leerlos sin esperar"
        porque: "Al contrario: hay que esperar su tiempo de arranque."
    escalera:
      - "¿Qué se puede hacer con un sensor bloqueado si se le quita la alimentación?"
    solucion: "Reiniciarlos: resuelve buena parte de los bloqueos de I²C."

  - id: pregunta-banco
    tipo: pregunta
    titulo: "La comprobación del montaje"
    texto: "Se compara el sensor con un termómetro conocido, a la intemperie y a distintas horas. ¿Cuándo aparecen las discrepancias?"
    libro: [120]
    widget:
      tipo: figura
      figura: fig-49.5
      zonas:
        - { id: temperatura, rotulo: "Arriba, en el centro", rect: [175, 3, 135, 72] }
    opciones:
      - texto: "Sobre todo con sol directo"
        bien: true
        porque: "Esa comparación dice si el abrigo y la ventilación cumplen su función."
      - texto: "De madrugada"
        porque: "Las mayores aparecen con sol directo, que calienta el sensor y su abrigo."
      - texto: "Nunca, si el sensor está calibrado"
        porque: "La calibración no corrige el sol: es cosa del montaje."
    escalera:
      - "¿Qué calienta el sensor más que el aire?"
    solucion: "Con sol directo."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [89, 92, 109, 112]
    ideas:
      - { titulo: "Montar bien.", texto: "Decide más que el sensor: mide donde está." }
      - { titulo: "Leer la hoja.", texto: "El BME280 da ±0,5 °C solo cerca de 25 °C." }
      - { titulo: "Con cable.", texto: "I²C: uno o dos metros a 100 kHz, decímetros a 400 kHz." }
      - { titulo: "Desde un pin.", texto: "Apagados entre medidas y reiniciables, sin pasar de 20 mA." }
