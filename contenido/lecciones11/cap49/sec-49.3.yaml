# Lección 1.2 de la sección 50.3 «Los Sensores y su Interfaz» (cap49; etiquetas sec-49.N = impresas 50.N).
# - Los cuatro errores de montaje y la alimentación de los sensores desde un pin (figura 50.8, fig-49.5).
# - El BME280 de la foto 50.7 (fig-49.4): ±3 % de HR y ±1 hPa, pero ±0,5 °C solo cerca de 25 °C (bloque 92).
# - El cable del sensor exterior con I²C: uno o dos metros a 100 kHz, decímetros a 400 kHz (bloque 112).
# Sin fórmulas ni modelo (aviso de secuencia «sin tarjeta de fórmula»).
# Paso práctico: «tocar» en la foto del BME280 el orificio por el que entra el aire.
# 1.2.1 (autor121-sens, «aprender haciendo», GUIA §13): en la figura 50.8 se tocan los cuatro errores de montaje y el
# que delata la comparación al sol; el reinicio de un sensor que bloquea el I²C (bloques 116 y 117) se hace en el
# simulador lógico, cortando su alimentación desde el pin. La hoja del BME280, la regla «mide donde está» y la
# distancia pasan a los éxitos. Queda una de opciones, el cable a 400 kHz.
leccion: cap49/sec-49.3

libro:
  89: "Lo que decide el resultado no es tanto cuál se elige como cómo se monta"
  92: "en temperatura ±0,5 °C solo cerca de 25 °C y ±1 °C en el margen de 0 a 65 °C"
  105: "mide el calor de la placa, no el del aire"
  106: "mide una humedad relativa menor que la real"
  107: "tras un plástico que filtra sin que se sepa cuánto"
  108: "midiendo el aire estancado de la caja"
  109: "un sensor mide donde está, no donde se pretende"
  111: "el sensor fuera, en un abrigo meteorológico ventilado, unido por cable"
  112: "la capacidad del cable limita la longitud a uno o dos metros a 100 kHz, y a decímetros a 400 kHz"
  113: "1-Wire o RS-485"
  116: "se pueden reiniciar si dejan de responder, que resuelve buena parte de los bloqueos de I²C"
  117: "el consumo del sensor debe caber en los 20 mA de un pin"
  120: "Las discrepancias aparecen sobre todo con sol directo"
  121: "Los cuatro errores de montaje de sensores y la alimentación desde un pin"
  "cap49#86": "con el orificio por el que entra el aire"
  "cap49#8": "Temperatura: ±0,5 °C entre −10 y +50 °C."

modelo: { valores: {}, calculos: {} }

tarjetas:
  - id: explore-montaje
    tipo: tocar
    titulo: "Cómo se monta"
    texto: "Lo que decide el resultado no es tanto cuál se elige como cómo se monta. Toque los montajes que arruinan una medida correcta."
    libro: [89, 105, 106, 107, 108, 109, 121]
    widget:
      tipo: figura
      figura: fig-49.5
      zonas:
        - { id: temperatura, rotulo: "Arriba, en el centro", rect: [175, 3, 135, 72] }
        - { id: humedad, rotulo: "Arriba a la derecha", rect: [314, 3, 133, 72] }
        - { id: luz, rotulo: "En medio, en el centro", rect: [175, 80, 135, 72] }
        - { id: gas, rotulo: "En medio, a la derecha", rect: [314, 80, 133, 72] }
        - { id: pin, rotulo: "Recuadro verde de abajo", rect: [4, 157, 442, 150] }
    tocar:
      bien: [temperatura, humedad, luz, gas]
      todas: true
      porque:
        pin: "Alimentar los sensores desde un pin es una buena práctica: sin consumo en reposo."
    exito: "Junto a la placa, mide su calor; la humedad, más caliente que el aire, lee menos; tras un plástico, filtra sin saber cuánto; sin ventilación, aire estancado. Un sensor mide donde está."
    escalera:
      - "Son los cuatro recuadros de arriba."
    solucion: "Los cuatro recuadros de arriba."

  - id: toque-orificio
    tipo: tocar
    titulo: "Por dónde entra el aire"
    texto: "El BME280 mide aire. Toque en la foto por dónde le entra."
    libro: ["cap49#86", 92, "cap49#8"]
    widget:
      tipo: figura
      figura: fig-49.4
      zonas:
        - { id: orificio, rotulo: "Círculo oscuro, a la izquierda", rect: [65, 240, 135, 135] }
        - { id: marcado, rotulo: "Letras del centro", rect: [205, 180, 150, 150] }
        - { id: patillas, rotulo: "Borde de abajo", rect: [40, 500, 440, 130] }
    tocar:
      bien: [orificio]
      porque:
        marcado: "Es el marcado del encapsulado: identifica la pieza."
        patillas: "Son los contactos que se sueldan a la placa."
    exito: "Por ahí entra el aire: tapado o en una caja cerrada, mide la caja. Su hoja da ±3 % de HR y ±1 hPa, pero ±0,5 °C solo cerca de 25 °C: hay que calibrarlo o usar otro sensor."
    escalera:
      - "Busque una abertura en la tapa metálica."
    solucion: "El orificio redondo de la izquierda."

  - id: predecir-cable
    tipo: predecir
    titulo: "El sensor fuera, con cable"
    texto: "El sensor va fuera, en un abrigo ventilado, y su I²C se alarga dos metros a 400 kHz. ¿Qué pasa?"
    libro: [111, 112, 113]
    widget:
      tipo: figura
      figura: fig-49.5
      zonas:
        - { id: pin, rotulo: "Recuadro verde de abajo", rect: [4, 157, 442, 150] }
    opciones:
      - texto: "Falla: a 400 kHz la capacidad del cable solo admite decímetros"
        bien: true
        porque: "A 100 kHz caben uno o dos metros; a 400 kHz, decímetros. Más lejos: 1-Wire, RS-485 o un micro junto al sensor."
      - texto: "Funciona: I²C llega a cualquier distancia"
        porque: "La capacidad del cable limita la longitud, y más cuanto más rápido."
      - texto: "Funciona mejor que a 100 kHz"
        porque: "Al revés: a más velocidad, menos longitud."
    escalera:
      - "La capacidad del cable frena los flancos."
    solucion: "Falla: baje a 100 kHz o use otro bus."

  - id: pregunta-pin
    tipo: explorar
    titulo: "Sensores alimentados desde un pin"
    texto: "Un sensor bloqueado mantiene baja la línea de datos del I²C, y nadie más puede hablar. Está alimentado desde un pin: libere el bus."
    libro: [116, 117]
    widget:
      tipo: logica
      entradas: [{ id: PIN, valor: 1, rotulo: "Pin que alimenta el sensor" }]
      piezas:
        - { id: a1, tipo: nand, entradas: [1, PIN], rotulo: "Sensor bloqueado y alimentado" }
        - { id: d1, tipo: od, entradas: [a1], rotulo: "Salida del sensor" }
        - { id: sda, tipo: bus, entradas: [d1], pullup: 1, rotulo: "Línea de datos" }
      salidas:
        - { id: SDA, de: sda, rotulo: "Línea de datos" }
    objetivo:
      condiciones:
        - { led: SDA, valor: 1, rotulo: "Bus libre" }
      logrado: "Sin alimentación, el sensor suelta la línea: reiniciarlo así resuelve buena parte de los bloqueos de I²C, y entre medidas no consume. Límites: los 20 mA del pin y esperar su arranque antes de leer."
      pistas:
        - { texto: "Quítele la alimentación al sensor." }
    escalera:
      - "Ponga a 0 el pin que lo alimenta."
    solucion: "Pin a 0: el sensor se apaga y el bus queda libre."

  - id: pregunta-banco
    tipo: tocar
    titulo: "La comprobación del montaje"
    texto: "Se compara el sensor con un termómetro conocido, a la intemperie y a distintas horas, y con sol directo discrepa. Toque el montaje que lo explica."
    libro: [120]
    widget:
      tipo: figura
      figura: fig-49.5
      zonas:
        - { id: temperatura, rotulo: "Arriba, en el centro", rect: [175, 3, 135, 72] }
        - { id: humedad, rotulo: "Arriba a la derecha", rect: [314, 3, 133, 72] }
        - { id: luz, rotulo: "En medio, en el centro", rect: [175, 80, 135, 72] }
        - { id: gas, rotulo: "En medio, a la derecha", rect: [314, 80, 133, 72] }
        - { id: pin, rotulo: "Recuadro verde de abajo", rect: [4, 157, 442, 150] }
    tocar:
      bien: [temperatura]
      porque:
        humedad: "La humedad también sufre, pero la comparación es con un termómetro."
        luz: "El plástico de la luz no cambia la temperatura leída."
        gas: "El gas estancado no explica una discrepancia de temperatura al sol."
        pin: "La alimentación desde un pin no depende del sol."
    exito: "El de temperatura: el sol calienta el sensor y su abrigo. Esa comparación dice si el abrigo y la ventilación cumplen su función."
    escalera:
      - "¿Qué calienta el sensor más que el aire?"
    solucion: "Arriba, en el centro: el de temperatura."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [89, 92, 109, 112]
    ideas:
      - { titulo: "Montar bien.", texto: "Decide más que el sensor: mide donde está." }
      - { titulo: "Leer la hoja.", texto: "El BME280 da ±0,5 °C solo cerca de 25 °C." }
      - { titulo: "Con cable.", texto: "I²C: uno o dos metros a 100 kHz, decímetros a 400 kHz." }
      - { titulo: "Desde un pin.", texto: "Apagados entre medidas y reiniciables, sin pasar de 20 mA." }
