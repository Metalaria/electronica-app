# Lección 1.2 de la sección 50.14 «Ampliaciones y Cierre» (cap49; etiquetas sec-49.N = impresas 50.N).
# - Las cinco ampliaciones y lo que decide que un sistema siga funcionando (figura 50.26, fig-49.22).
# Sin números ni fórmulas: sin modelo (aviso de secuencia «sin tarjeta de fórmula»).
# Paso práctico: «tocar» la ampliación más exigente y más valiosa en un aparato instalado en un tejado.
# 1.2.1 (autor121-sens, «aprender haciendo», GUIA §13): el retorno seguro de la actualización remota (bloques 465 a 468)
# se ve en el simulador lógico; en la figura 50.26 se tocan la ampliación para cortes largos y la que se lee sin red ni
# consumo. Lo que domina el consumo, lo que decide que siga funcionando y la lectura de un mes de datos pasan al
# resumen. Queda una de opciones, el peor mes del panel solar.
leccion: cap49/sec-49.14

libro:
  461: "hay cinco direcciones de ampliación, cada una con su enseñanza propia"
  463: "Cada uno con su acondicionamiento"
  464: "dimensionar el panel y la batería para el peor mes"
  465: "para sobrevivir a cortes largos"
  466: "se lee sin red y conserva la imagen sin consumir mientras el aparato duerme"
  467: "con su procedimiento de retorno seguro"
  468: "poder corregir un error sin bajarlo"
  471: "lo domina lo que menos parece: la radio y la frecuencia de medida, no el procesador"
  473: "es un prototipo que sigue funcionando meses después, sin nadie delante"
  474: "el consumo real medido, la robustez ante lo inesperado, el montaje físico y la posibilidad de mantenerlo"
  475: "la prueba que valida el proyecto sea la de semanas"
  477: "revisar los datos de un mes y buscar anomalías"
  478: "los datos cuentan lo que le pasó al aparato"
  479: "Las ampliaciones de la estación y lo que decide que un sistema siga funcionando"

modelo: { valores: {}, calculos: {} }

tarjetas:
  - id: explore-ampliaciones
    tipo: explorar
    titulo: "Con retorno seguro"
    texto: "Se instala por la red un firmware nuevo en la estación del tejado, y no arranca bien. Haga que la estación siga funcionando."
    libro: [461, 465, 467, 468]
    widget:
      tipo: logica
      entradas:
        - { id: ACT, valor: 0, rotulo: "Firmware nuevo instalado" }
        - { id: OK, valor: 0, rotulo: "El nuevo arranca bien" }
        - { id: RET, valor: 0, rotulo: "Retorno seguro previsto" }
      piezas:
        - { id: a1, tipo: and, entradas: [ACT, OK], rotulo: "Corre el nuevo" }
        - { id: n1, tipo: not, entradas: [OK], rotulo: "El nuevo falla" }
        - { id: a2, tipo: and, entradas: [ACT, n1], rotulo: "Actualización fallida" }
        - { id: a3, tipo: and, entradas: [a2, RET], rotulo: "Vuelve al anterior" }
        - { id: n2, tipo: not, entradas: [ACT], rotulo: "Sin actualizar" }
        - { id: o1, tipo: or, entradas: [a1, a3], rotulo: "Funciona" }
        - { id: o2, tipo: or, entradas: [o1, n2], rotulo: "Estación funcionando" }
      salidas:
        - { id: INS, de: ACT, rotulo: "Firmware nuevo instalado" }
        - { id: FAL, de: n1, rotulo: "El nuevo falla" }
        - { id: FUN, de: o2, rotulo: "Estación funcionando" }
    objetivo:
      condiciones:
        - { led: INS, valor: 1, rotulo: "Nuevo instalado" }
        - { led: FAL, valor: 1, rotulo: "El nuevo falla" }
        - { led: FUN, valor: 1, rotulo: "Y sigue funcionando" }
      logrado: "Con retorno seguro, si el nuevo no arranca vuelve solo al anterior. Sin él, una actualización fallida obliga a subir al tejado."
      pistas:
        - { texto: "Instale el nuevo y déjelo fallar: ¿qué falta para que siga funcionando?" }
    escalera:
      - "Prevea el retorno seguro."
    solucion: "Nuevo instalado, que falla, y retorno seguro previsto."

  - id: toque-tejado
    tipo: tocar
    titulo: "En un tejado"
    texto: "Toque la ampliación más exigente y más valiosa en un aparato instalado en un tejado."
    libro: [467, 468]
    widget:
      tipo: figura
      figura: fig-49.22
      zonas:
        - { id: sensores, rotulo: "Primer recuadro", rect: [5, 20, 84, 66] }
        - { id: solar, rotulo: "Segundo recuadro", rect: [95, 20, 84, 66] }
        - { id: memoria, rotulo: "Tercer recuadro", rect: [185, 20, 84, 66] }
        - { id: tinta, rotulo: "Cuarto recuadro", rect: [275, 20, 84, 66] }
        - { id: remota, rotulo: "Quinto recuadro", rect: [365, 20, 84, 66] }
    tocar:
      bien: [remota]
      porque:
        sensores: "Añade medidas, pero no cambia lo que cuesta mantener el aparato."
        solar: "Lo hace autónomo, pero no permite corregir un error a distancia."
        memoria: "Cubre cortes largos; no arregla un fallo del firmware."
        tinta: "Ahorra al dormir; no ayuda a corregir errores."
    exito: "La actualización remota: corregir un error sin bajar el aparato del tejado."
    escalera:
      - "¿Cuál evita subir al tejado cuando aparece un error?"
    solucion: "La actualización remota."

  - id: pregunta-solar
    tipo: pregunta
    titulo: "Alimentación solar"
    texto: "Se añade un panel solar con MPPT. ¿Para qué condiciones se dimensionan panel y batería?"
    libro: [464]
    widget:
      tipo: figura
      figura: fig-49.22
      zonas:
        - { id: solar, rotulo: "Segundo recuadro", rect: [95, 20, 84, 66] }
    opciones:
      - texto: "Para el peor mes"
        bien: true
        porque: "Si llega en el mes de menos sol, llega todo el año."
      - texto: "Para la media del año"
        porque: "En los meses de poco sol no llegaría."
      - texto: "Para el mejor mes"
        porque: "Sobraría en verano y faltaría en invierno."
    escalera:
      - "¿Cuándo hay menos energía solar?"
    solucion: "El peor mes."

  - id: pregunta-tinta
    tipo: tocar
    titulo: "Pantalla de tinta"
    texto: "Se quiere consultar la estación en el sitio, sin red y sin que gaste mientras duerme casi todo el tiempo. Toque la ampliación."
    libro: [466]
    widget:
      tipo: figura
      figura: fig-49.22
      zonas:
        - { id: sensores, rotulo: "Primer recuadro", rect: [5, 20, 84, 66] }
        - { id: solar, rotulo: "Segundo recuadro", rect: [95, 20, 84, 66] }
        - { id: memoria, rotulo: "Tercer recuadro", rect: [185, 20, 84, 66] }
        - { id: tinta, rotulo: "Cuarto recuadro", rect: [275, 20, 84, 66] }
        - { id: remota, rotulo: "Quinto recuadro", rect: [365, 20, 84, 66] }
    tocar:
      bien: [tinta]
      porque:
        sensores: "Más sensores miden más; no muestran nada."
        solar: "El panel da energía, no imagen."
        memoria: "La memoria guarda; no se ve."
        remota: "La actualización remota cambia el firmware; no muestra datos."
    exito: "La pantalla de tinta electrónica: conserva la imagen sin consumir mientras el aparato duerme, al revés que la OLED."
    escalera:
      - "Busque la pantalla."
    solucion: "El cuarto recuadro."

  - id: pregunta-leccion
    tipo: tocar
    titulo: "Cortes largos"
    texto: "La red de la vivienda cae a veces durante días. Toque la ampliación que permite no perder datos."
    libro: [463, 465]
    widget:
      tipo: figura
      figura: fig-49.22
      zonas:
        - { id: sensores, rotulo: "Primer recuadro", rect: [5, 20, 84, 66] }
        - { id: solar, rotulo: "Segundo recuadro", rect: [95, 20, 84, 66] }
        - { id: memoria, rotulo: "Tercer recuadro", rect: [185, 20, 84, 66] }
        - { id: tinta, rotulo: "Cuarto recuadro", rect: [275, 20, 84, 66] }
        - { id: remota, rotulo: "Quinto recuadro", rect: [365, 20, 84, 66] }
    tocar:
      bien: [memoria]
      porque:
        sensores: "Más sensores, más datos que perder."
        solar: "El panel mantiene la estación viva, pero la red sigue caída."
        tinta: "La pantalla muestra; no guarda el histórico."
        remota: "La actualización remota necesita, precisamente, red."
    exito: "Más memoria local: la estación sigue midiendo y envía lo acumulado al volver la red."
    escalera:
      - "Hay que guardar lo que no se puede enviar."
    solucion: "El tercer recuadro."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [468, 471, 473, 474, 475, 477, 478, 479]
    ideas:
      - { titulo: "Cinco ampliaciones.", texto: "La actualización remota, la más valiosa en un tejado." }
      - { titulo: "El consumo.", texto: "Lo dominan la radio y la frecuencia de medida, no el procesador." }
      - { titulo: "Instalado.", texto: "Consumo real medido, robustez, montaje físico y mantenimiento: cuatro cosas modestas, validadas con semanas de prueba." }
      - { titulo: "Los datos.", texto: "Saltos, huecos y derivas cuentan lo que le pasó: reinicios, cortes, un sensor sucio, autocalentamiento." }
