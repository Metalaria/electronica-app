# Lección 1.2 de la sección 50.14 «Ampliaciones y Cierre» (cap49; etiquetas sec-49.N = impresas 50.N).
# - Las cinco ampliaciones y lo que decide que un sistema siga funcionando (figura 50.26, fig-49.22).
# Sin números ni fórmulas: sin modelo (aviso de secuencia «sin tarjeta de fórmula»).
# Paso práctico: «tocar» la ampliación más exigente y más valiosa en un aparato instalado en un tejado.
leccion: cap49/sec-49.14

libro:
  461: "hay cinco direcciones de ampliación, cada una con su enseñanza propia"
  463: "Cada uno con su acondicionamiento"
  464: "dimensionar el panel y la batería para el peor mes"
  465: "para sobrevivir a cortes largos"
  466: "se lee sin red y conserva la imagen sin consumir mientras el aparato duerme"
  467: "con su procedimiento de retorno seguro"
  468: "poder corregir un error sin bajarlo"
  471: "lo domina lo que menos parece: la radio y la frecuencia de medida, no el procesador"
  473: "es un prototipo que sigue funcionando meses después, sin nadie delante"
  474: "el consumo real medido, la robustez ante lo inesperado, el montaje físico y la posibilidad de mantenerlo"
  475: "la prueba que valida el proyecto sea la de semanas"
  477: "revisar los datos de un mes y buscar anomalías"
  478: "los datos cuentan lo que le pasó al aparato"
  479: "Las ampliaciones de la estación y lo que decide que un sistema siga funcionando"

modelo: { valores: {}, calculos: {} }

tarjetas:
  - id: explore-ampliaciones
    tipo: explorar
    titulo: "Cinco direcciones"
    texto: "La estación básica mide y transmite; cada ampliación tiene su enseñanza. Toque las cinco."
    libro: [461, 463, 465, 479]
    widget:
      tipo: figura
      figura: fig-49.22
      zonas:
        - { id: sensores, rotulo: "Primer recuadro", rect: [5, 20, 84, 66], texto: "Más sensores, cada uno con su acondicionamiento y su montaje." }
        - { id: solar, rotulo: "Segundo recuadro", rect: [95, 20, 84, 66], texto: "Alimentación solar con MPPT: panel y batería para el peor mes." }
        - { id: memoria, rotulo: "Tercer recuadro", rect: [185, 20, 84, 66], texto: "Más memoria local, para sobrevivir a cortes largos." }
        - { id: tinta, rotulo: "Cuarto recuadro", rect: [275, 20, 84, 66], texto: "Pantalla de tinta: se lee sin red y no gasta al dormir." }
        - { id: remota, rotulo: "Quinto recuadro", rect: [365, 20, 84, 66], texto: "Actualización remota, con retorno seguro." }
    requiere: { mover: [sensores, solar, memoria, tinta, remota] }

  - id: toque-tejado
    tipo: tocar
    titulo: "En un tejado"
    texto: "Toque la ampliación más exigente y más valiosa en un aparato instalado en un tejado."
    libro: [467, 468]
    widget:
      tipo: figura
      figura: fig-49.22
      zonas:
        - { id: sensores, rotulo: "Primer recuadro", rect: [5, 20, 84, 66] }
        - { id: solar, rotulo: "Segundo recuadro", rect: [95, 20, 84, 66] }
        - { id: memoria, rotulo: "Tercer recuadro", rect: [185, 20, 84, 66] }
        - { id: tinta, rotulo: "Cuarto recuadro", rect: [275, 20, 84, 66] }
        - { id: remota, rotulo: "Quinto recuadro", rect: [365, 20, 84, 66] }
    tocar:
      bien: [remota]
      porque:
        sensores: "Añade medidas, pero no cambia lo que cuesta mantener el aparato."
        solar: "Lo hace autónomo, pero no permite corregir un error a distancia."
        memoria: "Cubre cortes largos; no arregla un fallo del firmware."
        tinta: "Ahorra al dormir; no ayuda a corregir errores."
    exito: "La actualización remota: corregir un error sin bajar el aparato del tejado."
    escalera:
      - "¿Cuál evita subir al tejado cuando aparece un error?"
    solucion: "La actualización remota."

  - id: pregunta-solar
    tipo: pregunta
    titulo: "Alimentación solar"
    texto: "Se añade un panel solar con MPPT. ¿Para qué condiciones se dimensionan panel y batería?"
    libro: [464]
    widget:
      tipo: figura
      figura: fig-49.22
      zonas:
        - { id: solar, rotulo: "Segundo recuadro", rect: [95, 20, 84, 66] }
    opciones:
      - texto: "Para el peor mes"
        bien: true
        porque: "Si llega en el mes de menos sol, llega todo el año."
      - texto: "Para la media del año"
        porque: "En los meses de poco sol no llegaría."
      - texto: "Para el mejor mes"
        porque: "Sobraría en verano y faltaría en invierno."
    escalera:
      - "¿Cuándo hay menos energía solar?"
    solucion: "El peor mes."

  - id: pregunta-tinta
    tipo: pregunta
    titulo: "Pantalla de tinta"
    texto: "¿Qué gana una pantalla de tinta electrónica frente a la OLED en esta estación?"
    libro: [466]
    widget:
      tipo: figura
      figura: fig-49.22
      zonas:
        - { id: tinta, rotulo: "Cuarto recuadro", rect: [275, 20, 84, 66] }
    opciones:
      - texto: "Conserva la imagen sin consumir mientras el aparato duerme"
        bien: true
        porque: "Y se lee sin red: encaja con un aparato que pasa casi todo el tiempo dormido."
      - texto: "Más brillo"
        porque: "Su ventaja es el consumo, no el brillo."
      - texto: "Más velocidad"
        porque: "Es lenta; gana en que no gasta para mantener la imagen."
    escalera:
      - "¿Qué hace el aparato casi todo el tiempo?"
    solucion: "No gasta para mantener la imagen."

  - id: pregunta-leccion
    tipo: pregunta
    titulo: "Lo que domina el consumo"
    texto: "De todo lo que el proyecto ha enseñado sobre bajo consumo, ¿qué lo domina?"
    libro: [471]
    widget:
      tipo: figura
      figura: fig-49.22
      zonas:
        - { id: cierre, rotulo: "Recuadro verde", rect: [5, 95, 443, 85] }
    opciones:
      - texto: "La radio y la frecuencia de medida"
        bien: true
        porque: "Lo que menos parece: no el procesador."
      - texto: "El procesador"
        porque: "Duerme casi siempre: pesa poco en la media."
      - texto: "Los sensores"
        porque: "Miden en una fracción de segundo: pesan poco."
    escalera:
      - "Recuerde el presupuesto por fases de la sección 50.2."
    solucion: "La radio y la frecuencia de medida."

  - id: porque-instalado
    tipo: porque
    titulo: "Un sistema instalado"
    texto: "¿Qué decide que un prototipo siga funcionando meses después, sin nadie delante?"
    libro: [473, 474, 475]
    widget:
      tipo: figura
      figura: fig-49.22
      zonas:
        - { id: cierre, rotulo: "Recuadro verde", rect: [5, 95, 443, 85] }
    opciones:
      - texto: "Consumo real medido, robustez, montaje físico y que se pueda mantener"
        bien: true
        porque: "Cuatro cosas modestas; por eso la prueba que lo valida es la de semanas."
      - texto: "La sofisticación del circuito"
        porque: "No es eso: son cuatro cosas modestas."
      - texto: "El procesador más rápido"
        porque: "La velocidad no hace que siga funcionando meses."
    escalera:
      - "Mire los cuatro recuadros pequeños de la figura."
    solucion: "Las cuatro cosas modestas."

  - id: predecir-datos
    tipo: predecir
    titulo: "Un mes de datos"
    texto: "Al cerrar el proyecto se revisan los datos de un mes y aparecen saltos, huecos y derivas lentas. ¿Qué son?"
    libro: [477, 478]
    widget:
      tipo: figura
      figura: fig-49.22
      zonas:
        - { id: datos, rotulo: "Texto de abajo", rect: [60, 190, 330, 65] }
    opciones:
      - texto: "Lo que le pasó al aparato: reinicios, cortes, un sensor sucio, autocalentamiento"
        bien: true
        porque: "Cada anomalía tiene una explicación, y encontrarla es la última lección."
      - texto: "Ruido sin importancia"
        porque: "Cada una cuenta algo: un reinicio, un corte de red, un sensor que se ensució."
      - texto: "Errores del panel"
        porque: "El panel muestra lo que recibió: los datos cuentan lo que le pasó al aparato."
    escalera:
      - "Los datos cuentan una historia."
    solucion: "Los datos cuentan lo que le pasó al aparato."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [468, 471, 474, 478]
    ideas:
      - { titulo: "Cinco ampliaciones.", texto: "La actualización remota, la más valiosa en un tejado." }
      - { titulo: "El consumo.", texto: "Lo domina la radio y la frecuencia de medida." }
      - { titulo: "Instalado.", texto: "Consumo medido, robustez, montaje y mantenimiento." }
      - { titulo: "Los datos.", texto: "Cuentan lo que le pasó al aparato." }
