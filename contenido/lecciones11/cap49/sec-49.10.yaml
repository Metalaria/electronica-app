# Lección 1.2 de la sección 50.10 «Estructura del Firmware» (cap49; etiquetas sec-49.N = impresas 50.N).
# - Las capas del firmware, la máquina de estados principal y lo que hay que registrar (figura 50.20, fig-49.17);
#   el diagrama de flujo (figura 50.19, fig-49.16).
# Sección sin números ni fórmulas: sin modelo (aviso de secuencia «sin tarjeta de fórmula»).
# Paso práctico: «tocar» en la máquina de estados el estado que separa un prototipo de un producto (error).
leccion: cap49/sec-49.10

libro:
  305: "tiene que hacer varias cosas con ritmos muy distintos"
  307: "Rápido: leer sensores digitales, atender interrupciones. Milisegundos."
  308: "Medio: procesar, filtrar, decidir. Segundos."
  309: "Lento: transmitir, sincronizar hora, comprobar actualizaciones. Minutos."
  310: "cada ritmo en su sitio, sin que el lento bloquee al rápido"
  312: "cada capa solo conoce la de abajo"
  313: "Capa de acceso al hardware"
  314: "Capa de dispositivo"
  315: "Capa de aplicación"
  316: "Capa de comunicación"
  317: "cambiar de sensor afecta a una capa, y cambiar de microcontrolador afecta solo a la de abajo"
  325: "ese último estado es el que separa un prototipo de un producto"
  330: "Para datos ambientales, descartar las antiguas suele ser preferible"
  331: "en RAM se pierde al reiniciar; en Flash sobrevive y consume ciclos de escritura"
  334: "La causa del último reinicio"
  337: "Sin esos tres, un sistema que se reinicia cada semana parece funcionar perfectamente"
  340: "Un firmware bien estructurado entra en su estado de error, lo registra, y vuelve solo"
  341: "Diagrama de flujo del firmware del ESP32"
  342: "Las capas del firmware y la máquina de estados principal"

modelo: { valores: {}, calculos: {} }

tarjetas:
  - id: explore-firmware
    tipo: explorar
    titulo: "Capas y estados"
    texto: "El firmware hace cosas con ritmos muy distintos. Toque las capas, la máquina de estados y lo que hay que registrar."
    libro: [305, 342]
    widget:
      tipo: figura
      figura: fig-49.17
      zonas:
        - { id: capas, rotulo: "Columna de la izquierda", rect: [10, 25, 188, 125], texto: "Cuatro capas: cada una solo conoce la de abajo." }
        - { id: estados, rotulo: "Diagrama de la derecha", rect: [213, 30, 235, 155], texto: "Arranque, medida, transmisión, sueño y error, con sus transiciones." }
        - { id: registro, rotulo: "Recuadro de abajo", rect: [10, 243, 433, 58], texto: "La causa del último reinicio, los contadores de errores y el tiempo en marcha." }
    requiere: { mover: [capas, estados, registro] }

  - id: empareje-ritmos
    tipo: pregunta
    titulo: "Tres ritmos"
    texto: "Empareje cada ritmo del firmware con lo que hace."
    libro: [307, 308, 309, 310, 341]
    widget:
      tipo: figura
      figura: fig-49.16
      zonas:
        - { id: flujo, rotulo: "El diagrama", rect: [0, 0, 453, 331] }
    emparejar:
      - ["Rápido, milisegundos", "Leer sensores y atender interrupciones"]
      - ["Medio, segundos", "Procesar, filtrar y decidir"]
      - ["Lento, minutos", "Transmitir y sincronizar la hora"]
    exito: "Cada ritmo en su sitio, sin que el lento bloquee al rápido."
    pistas:
      - { texto: "Transmitir es lo más lento." }
    escalera:
      - "¿Qué tarda más: leer un registro o conectarse a la red?"
    solucion: "Rápido, sensores; medio, procesar; lento, transmitir."

  - id: ordene-capas
    tipo: pregunta
    titulo: "Las capas, de abajo arriba"
    texto: "Ordene las capas del firmware de abajo arriba."
    libro: [312, 313, 314, 315, 316]
    widget:
      tipo: figura
      figura: fig-49.17
      zonas:
        - { id: capas, rotulo: "Columna de la izquierda", rect: [10, 25, 188, 125] }
    ordenar:
      - "Acceso al hardware: leer un sensor, escribir un pin"
      - "Dispositivo: «lee la temperatura»"
      - "Aplicación: la lógica del proyecto"
      - "Comunicación: red y protocolo"
    exito: "Cada capa solo conoce la de abajo."
    pistas:
      - { texto: "La que depende del microcontrolador concreto está abajo del todo." }
    escalera:
      - "De lo más cercano al silicio a lo más cercano a la red."
    solucion: "Hardware, dispositivo, aplicación, comunicación."

  - id: pregunta-capas
    tipo: pregunta
    titulo: "Cambiar de sensor"
    texto: "Con el firmware por capas, se cambia el sensor de temperatura por otro modelo. ¿Qué hay que tocar?"
    libro: [317]
    widget:
      tipo: figura
      figura: fig-49.17
      zonas:
        - { id: capas, rotulo: "Columna de la izquierda", rect: [10, 25, 188, 125] }
    opciones:
      - texto: "Una sola capa"
        bien: true
        porque: "Y cambiar de microcontrolador afecta solo a la de abajo. Sin capas, un cambio de sensor toca todo el programa."
      - texto: "Todo el programa"
        porque: "Eso pasa sin la separación en capas."
      - texto: "Ninguna"
        porque: "Algo hay que cambiar: la capa que habla con ese sensor."
    escalera:
      - "La capa de dispositivo dice «lee la temperatura» sin saber qué sensor es."
    solucion: "Una capa."

  - id: toque-error
    tipo: tocar
    titulo: "Prototipo o producto"
    texto: "Toque el estado de la máquina que separa un prototipo de un producto."
    libro: [325]
    widget:
      tipo: figura
      figura: fig-49.17
      zonas:
        - { id: arranque, rotulo: "Arriba a la izquierda", rect: [213, 32, 76, 36] }
        - { id: medida, rotulo: "Arriba a la derecha", rect: [299, 32, 78, 36] }
        - { id: error, rotulo: "Abajo a la izquierda", rect: [213, 146, 76, 38] }
        - { id: sueno, rotulo: "Abajo a la derecha", rect: [299, 148, 78, 36] }
    tocar:
      bien: [error]
      porque:
        arranque: "El arranque inicializa y conecta: lo tiene cualquier prototipo."
        medida: "Medir lo hace también el prototipo."
        sueno: "Dormir ahorra energía, pero no decide qué pasa cuando algo falla."
    exito: "El estado de error, con su modo degradado y sus reintentos: si no se prevé, el comportamiento será el que salga."
    escalera:
      - "¿Qué hace el sistema cuando algo falla?"
    solucion: "El estado de error."

  - id: predecir-lleno
    tipo: predecir
    titulo: "El búfer se llena"
    texto: "La red cae varios días y el búfer de medidas se llena. Para datos ambientales, ¿qué conviene descartar?"
    libro: [330]
    widget:
      tipo: figura
      figura: fig-49.16
      zonas:
        - { id: flujo, rotulo: "El diagrama", rect: [0, 0, 453, 331] }
    opciones:
      - texto: "Las más antiguas"
        bien: true
        porque: "Para datos ambientales suele ser preferible conservar lo reciente."
      - texto: "Las más nuevas"
        porque: "Se perdería justo lo que ocurre ahora; suele preferirse descartar lo antiguo."
      - texto: "Todas"
        porque: "El búfer existe para cubrir cortes: se descarta lo justo."
    escalera:
      - "¿Qué interesa más al volver la red: lo de hace días o lo de ahora?"
    solucion: "Las más antiguas."

  - id: pregunta-ram
    tipo: pregunta
    titulo: "Dónde vive el búfer"
    texto: "El búfer de medidas está en RAM y la estación se reinicia. ¿Qué pasa?"
    libro: [331]
    widget:
      tipo: figura
      figura: fig-49.16
      zonas:
        - { id: flujo, rotulo: "El diagrama", rect: [0, 0, 453, 331] }
    opciones:
      - texto: "Se pierden las medidas acumuladas"
        bien: true
        porque: "En Flash sobreviven, a cambio de consumir ciclos de escritura."
      - texto: "Nada: la RAM guarda los datos"
        porque: "La RAM se pierde al reiniciar."
      - texto: "Se duplican"
        porque: "No se duplican: desaparecen."
    escalera:
      - "¿Qué memoria conserva los datos sin alimentación?"
    solucion: "Se pierden: en Flash sobrevivirían."

  - id: porque-registro
    tipo: porque
    titulo: "Lo que hay que registrar"
    texto: "¿Por qué registrar la causa del último reinicio, los contadores de errores y el tiempo en marcha?"
    libro: [334, 337]
    widget:
      tipo: figura
      figura: fig-49.17
      zonas:
        - { id: registro, rotulo: "Recuadro de abajo", rect: [10, 243, 433, 58] }
    opciones:
      - texto: "Sin ellos, un sistema que se reinicia cada semana parece funcionar perfectamente"
        bien: true
        porque: "La causa del reinicio dice si actuó el watchdog; el tiempo en marcha revela los reinicios."
      - texto: "Para ocupar la memoria"
        porque: "Ocupan poco y revelan fallos que, si no, pasan desapercibidos."
      - texto: "Porque lo exige MQTT"
        porque: "Es una decisión de diagnóstico, no del protocolo."
    escalera:
      - "¿Cómo sabría que la estación se reinició anoche si no lo registra?"
    solucion: "Para ver los fallos silenciosos."

  - id: pregunta-banco
    tipo: pregunta
    titulo: "Desconectar cosas"
    texto: "Con la estación funcionando, se desconecta un sensor. ¿Qué debe hacer un firmware bien estructurado?"
    libro: [340]
    widget:
      tipo: figura
      figura: fig-49.17
      zonas:
        - { id: estados, rotulo: "Diagrama de la derecha", rect: [213, 30, 235, 155] }
    opciones:
      - texto: "Entrar en su estado de error, registrarlo y volver solo cuando se reconecte"
        bien: true
        porque: "Es la prueba que valida la arquitectura: desconectar cosas mientras funciona."
      - texto: "Reiniciarse sin más"
        porque: "Reiniciarse no resuelve nada si el sensor sigue suelto, y oculta el fallo."
      - texto: "Seguir enviando el último valor"
        porque: "Eso propaga un dato falso: debe marcar el fallo."
    escalera:
      - "Mire la máquina de estados: ¿adónde lleva un fallo?"
    solucion: "Al estado de error, registrado, y vuelta sola."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [310, 317, 325, 337]
    ideas:
      - { titulo: "Ritmos.", texto: "Rápido, medio y lento, sin que el lento bloquee al rápido." }
      - { titulo: "Capas.", texto: "Cambiar de sensor toca una sola capa." }
      - { titulo: "Estado de error.", texto: "El que separa un prototipo de un producto." }
      - { titulo: "Registrar.", texto: "Causa del reinicio, errores y tiempo en marcha." }
