# Lección 1.2 de la sección 49.4 «De los Mapas a los Diseños Completos» (cap48; etiquetas sec-48.5…48.9 = impresas
# 49.1…49.5).
# - Lo que un mapa no da (bloques 113 a 118) y el camino de un mapa a un aparato (120; figura 49.4, fig-48.13).
# - Qué prototipar aparte (123 a 126), por dónde empezar (129 a 132) y el ejercicio del banco (134, 135).
# - El ejercicio 49.5 (cap48#145): los capítulos que repasar para la fuente de banco.
# Sección sin cálculos: sin modelo (aviso de secuencia «sin tarjeta de fórmula»).
# Pasos prácticos: «ordenar» el camino de un mapa a un aparato y «tocar» en la figura el proyecto cuya dificultad
# dominante es el calor y la estabilidad del lazo.
leccion: cap48/sec-48.8

libro:
  110: "Un diagrama de bloques —un mapa del proyecto— dice qué hace cada parte y qué integra del libro"
  113: "Los valores concretos de los componentes."
  115: "El trazado de la placa."
  117: "La lista de materiales comprable."
  118: "Un mapa dice qué bloques hacen falta y qué decisiones hay que tomar"
  120: "cinco o seis elecciones que condicionan todo lo demás"
  123: "Cualquier bloque analógico delicado: un amplificador de bajo ruido, un lazo de control, un front-end de radio."
  124: "Cualquier interfaz que no se haya usado antes"
  125: "El firmware, sobre una placa de desarrollo, en paralelo al diseño del hardware."
  126: "lo que queda es integración"
  129: "La fuente de banco (capítulo 51) es la más útil, porque se usa en todos los demás proyectos."
  130: "La estación IoT (capítulo 50) es la más asequible y la que menos puede salir mal: trabaja a baja tensión, sin peligro de red."
  131: "El amplificador (capítulo 52) es el que más enseña sobre analógica."
  132: "La SDR (capítulo 53) es la que más conocimiento previo exige."
  134: "escribir la especificación de los cuatro, en cinco líneas cada uno"
  135: "a menudo cambia la elección inicial, que suele hacerse por atractivo y no por adecuación"
  136: "El camino de un mapa a un aparato y la dificultad dominante de cada proyecto."
  "cap48#145": "Elige uno de los cuatro proyectos y nombra al menos tres capítulos del libro"
  "cap48#8": "buses (45)"
  "cap48#20": "radiofrecuencia y antenas (capítulo 37)"

modelo: { valores: {}, calculos: {} }

tarjetas:
  - id: explore-camino
    tipo: explorar
    titulo: "Del mapa al aparato"
    texto: "Un mapa dice qué hace cada parte; convertirlo en un aparato es otro trabajo. Toque el primer paso y el que conviene hacer aparte."
    libro: [110, 136]
    widget:
      tipo: figura
      figura: fig-48.13
      zonas:
        - { id: p1, rotulo: "Arriba, el primero", rect: [10, 17, 79, 70], texto: "Cerrar la especificación con números: donde más se gana y donde más se salta." }
        - { id: p2, rotulo: "Arriba, el segundo", rect: [99, 17, 79, 70], texto: "Elegir los componentes principales: cinco o seis elecciones que lo condicionan todo." }
        - { id: p3, rotulo: "Arriba, el tercero", rect: [188, 17, 79, 70], texto: "El esquema por bloques, cada uno contra su hoja de datos." }
        - { id: p4, rotulo: "Arriba, el cuarto", rect: [277, 17, 79, 70], texto: "Prototipar lo incierto, aparte y antes de comprometer una placa." }
        - { id: p5, rotulo: "Arriba, el quinto", rect: [366, 17, 79, 70], texto: "Placa, montaje y validación: queda sobre todo integración." }
    requiere: { mover: [p1, p4] }

  - id: pregunta-mapa
    tipo: pregunta
    titulo: "Lo que un mapa no da"
    texto: "Tiene el diagrama de bloques de un proyecto. ¿Qué le dice ese mapa?"
    libro: [113, 115, 117, 118]
    widget:
      tipo: figura
      figura: fig-48.13
      zonas:
        - { id: camino, rotulo: "Los cinco pasos", rect: [10, 17, 435, 70] }
    opciones:
      - texto: "Qué bloques hacen falta y qué decisiones hay que tomar"
        bien: true
        porque: "El diseño concreto es el trabajo que sigue: valores, esquema, placa, firmware y lista."
      - texto: "Los valores concretos de los componentes"
        porque: "Eso no lo da el mapa: lo añaden los cálculos del diseño."
      - texto: "La lista de materiales comprable"
        porque: "La lista sale del esquema completo, que el mapa tampoco da."
    escalera:
      - "¿Hay un solo valor de resistencia en un diagrama de bloques?"
    solucion: "Los bloques y las decisiones; lo concreto es el trabajo que sigue."

  - id: ordene-camino
    tipo: pregunta
    titulo: "El camino, en orden"
    texto: "Ordene los pasos de un mapa a un aparato."
    libro: [120]
    widget:
      tipo: figura
      figura: fig-48.13
      zonas:
        - { id: dificultad, rotulo: "Las dificultades, abajo", rect: [4, 153, 446, 72] }
    ordenar:
      - "Cerrar la especificación con números"
      - "Elegir los componentes principales"
      - "Dibujar el esquema por bloques"
      - "Prototipar lo incierto"
      - "Placa, montaje y validación"
    exito: "Es el método de la sección 49.2, y los cuatro capítulos de proyecto lo recorren en ese orden."
    pistas:
      - { texto: "Lo incierto se prototipa antes de comprometer una placa." }
    escalera:
      - "Primero los números, después las piezas que lo condicionan todo, y la placa al final."
    solucion: "Especificación, componentes, esquema, prototipo, placa y validación."

  - id: empareje-aparte
    tipo: pregunta
    titulo: "Qué prototipar aparte"
    texto: "Es el consejo más rentable de la sección. Empareje cada caso con un ejemplo."
    libro: [123, 124, 125]
    widget:
      tipo: figura
      figura: fig-48.13
      zonas:
        - { id: aparte, rotulo: "El recuadro del centro", rect: [14, 92, 426, 36] }
    emparejar:
      - ["Un bloque analógico delicado", "Un amplificador de bajo ruido o un lazo de control"]
      - ["Una interfaz no usada antes", "Un sensor nuevo o un módulo desconocido"]
      - ["El firmware", "En una placa de desarrollo, en paralelo"]
    exito: "Así, cuando llega la placa, la mayor parte de las incertidumbres ya están resueltas."
    pistas:
      - { texto: "El firmware no espera a la placa: avanza a la vez sobre otra." }
    escalera:
      - "Lo que se prototipa aparte es lo que nunca se ha hecho o lo que es delicado."
    solucion: "Analógico delicado: bajo ruido o un lazo. Interfaz nueva: un sensor nuevo. Firmware: en una placa de desarrollo."

  - id: prediga-placa
    tipo: predecir
    titulo: "Cuando llega la placa"
    texto: "Se prototiparon aparte lo delicado, lo nuevo y el firmware. ¿Qué queda cuando llega la placa?"
    libro: [126]
    widget:
      tipo: figura
      figura: fig-48.13
      zonas:
        - { id: p5, rotulo: "Arriba, el quinto", rect: [366, 17, 79, 70] }
    opciones:
      - texto: "Sobre todo integración"
        bien: true
        porque: "Las incertidumbres ya se resolvieron; queda que los bloques funcionen juntos."
      - texto: "Rediseñar los bloques analógicos"
        porque: "Ya se probaron aparte: eso es lo que evita prototiparlos antes."
      - texto: "Escribir el firmware desde cero"
        porque: "Se escribió en paralelo sobre una placa de desarrollo."
    escalera:
      - "Si cada pieza dudosa ya se probó, ¿qué falta por probar?"
    solucion: "Integración."

  - id: toque-fuente
    tipo: tocar
    titulo: "Calor y estabilidad del lazo"
    texto: "Toque el proyecto cuya dificultad dominante es el calor y la estabilidad del lazo."
    libro: [136]
    widget:
      tipo: figura
      figura: fig-48.13
      zonas:
        - { id: iot, rotulo: "Abajo, la primera", rect: [4, 153, 108, 72] }
        - { id: fuente, rotulo: "Abajo, la segunda", rect: [117, 153, 108, 72] }
        - { id: ampli, rotulo: "Abajo, la tercera", rect: [230, 153, 108, 72] }
        - { id: sdr, rotulo: "Abajo, la cuarta", rect: [342, 153, 108, 72] }
    tocar:
      bien: [fuente]
      porque:
        iot: "La estación lucha con el consumo y la fiabilidad en campo."
        ampli: "El amplificador tiene calor y estabilidad, pero su primera dificultad son las masas."
        sdr: "La SDR lucha con el ruido, el equilibrio I/Q y el apantallamiento."
    exito: "La fuente de banco: disipar con la salida baja y estabilizar un lazo con dos modos."
    escalera:
      - "¿Qué proyecto tiene un lineal que disipa y un lazo de tensión y de corriente?"
    solucion: "Abajo, la segunda: la fuente de banco."

  - id: empareje-empezar
    tipo: pregunta
    titulo: "Por dónde empezar"
    texto: "Si va a hacer uno solo: empareje cada proyecto con su razón."
    libro: [129, 130, 131, 132]
    widget:
      tipo: figura
      figura: fig-48.13
      zonas:
        - { id: dificultad, rotulo: "Las dificultades, abajo", rect: [4, 153, 446, 72] }
    emparejar:
      - ["La fuente de banco", "La más útil: se usa en todos los demás"]
      - ["La estación IoT", "La más asequible: baja tensión, sin peligro de red"]
      - ["El amplificador", "El que más enseña sobre analógica"]
      - ["La SDR", "La que más conocimiento previo exige"]
    exito: "Cada uno tiene su razón; la elección depende de lo que se tiene y de lo que se quiere aprender."
    pistas:
      - { texto: "La que menos puede salir mal trabaja a baja tensión." }
    escalera:
      - "¿Cuál sirve después para alimentar a los otros tres?"
    solucion: "Fuente: la más útil. IoT: la más asequible. Amplificador: analógica. SDR: la más exigente."

  - id: pregunta-repasar
    tipo: pregunta
    titulo: "Antes de la fuente de banco"
    texto: "Va a abordar la fuente de banco. ¿Qué capítulos conviene repasar?"
    libro: ["cap48#145", 129, "cap48#8", "cap48#20"]
    widget:
      tipo: figura
      figura: fig-48.13
      zonas:
        - { id: fuente, rotulo: "Abajo, la segunda", rect: [117, 153, 108, 72] }
    opciones:
      - texto: "Reguladores (8), conversión de potencia (33) y operacional con realimentación (26)"
        bien: true
        porque: "Y además los sistemas de control (30), la protección (10) y los condensadores del filtrado (3)."
      - texto: "Radiofrecuencia (37) y muestreo (29)"
        porque: "Esos son los de la SDR: la fuente no tiene radio ni muestreo."
      - texto: "Sensores (36) y buses (45)"
        porque: "Esos son los de la estación IoT."
    escalera:
      - "La fuente regula, convierte potencia y cierra un lazo."
    solucion: "Reguladores, conversión de potencia, el operacional con realimentación y los lazos de control."

  - id: porque-especificar
    tipo: porque
    titulo: "Media hora antes de elegir"
    texto: "Antes de elegir proyecto, conviene escribir la especificación de los cuatro, en cinco líneas cada uno. ¿Por qué?"
    libro: [134, 135]
    widget:
      tipo: figura
      figura: fig-48.13
      zonas:
        - { id: p1, rotulo: "Arriba, el primero", rect: [10, 17, 79, 70] }
    opciones:
      - texto: "Deja ver cuál encaja con el instrumental, el tiempo y lo que se quiere aprender"
        bien: true
        porque: "Y a menudo cambia la elección inicial, que suele hacerse por atractivo y no por adecuación."
      - texto: "Para empezar los cuatro a la vez"
        porque: "Es para elegir uno solo, el que encaja."
      - texto: "Porque la especificación ya es el diseño"
        porque: "Es el primer paso, no el diseño; pero es donde más se gana."
    escalera:
      - "¿Qué decide hoy la elección, si no se escribe nada?"
    solucion: "Para elegir por adecuación y no por atractivo."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [118, 120, 126, 135]
    ideas:
      - { titulo: "El mapa.", texto: "Qué bloques y qué decisiones; los valores, la placa y el firmware vienen después." }
      - { titulo: "El camino.", texto: "Especificación, componentes, esquema, prototipo y placa." }
      - { titulo: "Aparte.", texto: "Lo analógico delicado, la interfaz nueva y el firmware: a la placa solo llega integración." }
      - { titulo: "Elegir.", texto: "Por adecuación, con la especificación de los cuatro escrita." }
