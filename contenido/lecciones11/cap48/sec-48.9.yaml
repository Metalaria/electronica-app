# Lección 1.2 de la sección 49.5 «Herramientas Adicionales y Resumen» (cap48; etiquetas sec-48.5…48.9 = impresas
# 49.1…49.5).
# - Convertir una idea en especificación: la tabla de la fuente de banco ampliada (bloque 140) y la línea que falta, la
#   exactitud (141: la deriva del divisor, 0,05 % en 20 °C, 15 mV sobre 30 V, cinco veces la regulación).
# - Los tres presupuestos (144) y los ejercicios 49.2 a 49.4 del capítulo (145).
# - Modelo: el escalón de la consigna es el fondo de escala entre 2^n (0,46 mV y 76 µA con 16 bits sobre 30 V y 5 A,
#   bloque 140); el presupuesto de error suma en cuadratura (144). Los 5 mV de la segunda contribución son de ejemplo
#   (rotulado); los 15 mV son la deriva del bloque 141.
# Pasos prácticos: «simular» la resolución de 16 bits (0,46 mV; errores: 12 bits, 7,32 mV, o dividir entre 16) y
# «simular» un presupuesto de error en cuadratura (15,8 mV; error: la suma, 20 mV).
leccion: cap48/sec-48.9

libro:
  139: "escribir la especificación en números"
  140: "16 bits (0,46 mV / 76 µA)"
  141: "la deriva del divisor de realimentación ya supone un 0,05 % (15 mV sobre 30 V) en 20 °C, cinco veces la regulación especificada"
  144: "contribuciones en cuadratura, con la regla de que lo que está tres veces por debajo del término dominante apenas cuenta"
  145: "¿qué papel cumple exactamente el amplificador de error"

modelo:
  valores:
    V_f: { sim: "V_{máx}", nombre: "fondo de escala de tensión", unidad: V, valor: 30 }
    I_f: { sim: "I_{máx}", nombre: "fondo de escala de corriente", unidad: A, valor: 5 }
    n_b: { sim: "n", nombre: "bits de la consigna", unidad: bits, valor: 10 }
    e_1: { sim: "e₁", nombre: "contribución dominante", unidad: V, valor: 0.015 }
    e_2: { sim: "e₂", nombre: "contribución secundaria", unidad: V, valor: 0.005 }
    d_r: { sim: "δ", nombre: "deriva relativa del divisor", unidad: "%", valor: 0.05 }
    b_12: { sim: "n_{12}", nombre: "bits de un convertidor de 12", unidad: bits, valor: 12 }
  calculos:
    dV: { expr: "V_f/2^n_b", sim: "ΔV", nombre: "escalón de tensión", unidad: V }
    dI: { expr: "I_f/2^n_b", sim: "ΔI", nombre: "escalón de corriente", unidad: A }
    dV12: { expr: "V_f/N12", sim: "ΔV_{12}", nombre: "escalón con 12 bits", unidad: V }
    N12: { expr: "2^b_12", sim: "2^{12}", nombre: "escalones con 12 bits", unidad: "" }
    N16: { expr: "2^n_b", sim: "2^{n}", nombre: "escalones de la consigna", unidad: "" }
    f_r: { expr: "d_r/100", sim: "δ", nombre: "deriva en tanto por uno", unidad: "" }
    dVn: { expr: "V_f/n_b", sim: "V/n", nombre: "fondo entre el número de bits", unidad: V }
    e_t: { expr: "sqrt(e_1^2 + e_2^2)", sim: "e", nombre: "error total en cuadratura", unidad: V }
    e_s: { expr: "e_1 + e_2", sim: "e₁ + e₂", nombre: "suma directa", unidad: V }
    V_d: { expr: "V_f*d_r/100", sim: "ΔV_{deriva}", nombre: "deriva sobre el fondo de escala", unidad: V }
    P_f: { expr: "V_f*I_f", sim: "P", nombre: "potencia máxima de salida", unidad: W }

tarjetas:
  - id: explore-bits
    tipo: explorar
    titulo: "La especificación, en números"
    texto: "Una línea de la especificación es la resolución de la consigna. Cambie los bits y mire el escalón sobre 30 V."
    libro: [139, 140]
    inicio: { n_b: 8 }
    widget:
      tipo: grafica
      x: { id: bx, min: 8, max: 16, unidad: bits, rotulo: "n" }
      y: { min: 0, max: 0.12, unidad: V, rotulo: "ΔV" }
      curvas:
        - { expr: "V_f/2^bx", color: azul, rotulo: "escalón de tensión" }
      marcas:
        - { x: "n_b", y: "dV", rotulo: "{{dV}}" }
      lectura: { valor: dV, rotulo: "Escalón de tensión" }
      datos:
        - { valor: dI, rotulo: "Escalón de corriente, sobre 5 A: {{dI}}" }
      mandos:
        - { valor: n_b, lista: [8, 10, 12], rotulo: "Bits de la consigna" }

  - id: simule-16
    tipo: simular
    titulo: "Dieciséis bits"
    texto: "La fuente de banco ampliada pide 16 bits de consigna, de 0 a 30 V. ¿Qué escalón de tensión da?"
    libro: [140]
    fijar: { n_b: 16 }
    widget:
      tipo: grafica
      x: { id: bx, min: 8, max: 16, unidad: bits, rotulo: "n" }
      y: { min: 0, max: 0.12, unidad: V, rotulo: "ΔV" }
      curvas:
        - { expr: "V_f/2^bx", color: azul, rotulo: "escalón de tensión" }
      lectura: { valor: dV, rotulo: "Escalón de tensión" }
      ocultar: curvas
    simular:
      objetivo: dV
      unidad: V
      tol: 0.03
      rotulo: "Escalón de la consigna"
      errores:
        - { expr: "dV12", texto: "Eso son 12 bits: 30 V entre 4 096. Con 16 bits son 65 536 escalones." }
        - { expr: "dVn", texto: "Ha dividido entre 16; hay que dividir entre 2 elevado a 16." }
    exito: "0,46 mV, y sobre 5 A, 76 µA: la tabla del libro."
    escalera:
      - "Escalón = fondo de escala / 2ⁿ."
    solucion: "30 V / 65 536 = 0,46 mV."
    comprobar:
      - { dV: 0.000458, dI: 0.0000763, dV12: 0.00732, dVn: 1.875, tol: 0.003 }
      - { N16: 65536, N12: 4096, b_12: 12 }

  - id: empareje-tabla
    tipo: pregunta
    titulo: "La especificación de la fuente ampliada"
    texto: "Empareje cada concepto con su cifra en la fuente de banco ampliada."
    libro: [140]
    emparejar:
      - ["Rango de salida", "0–30 V, 0–5 A (150 W)"]
      - ["Regulación de carga y línea", "< 0,01 % (3 mV sobre 30 V)"]
      - ["Rizado y ruido", "< 1 mV eficaz"]
      - ["Condiciones ambientales", "Hasta 40 °C"]
    exito: "Cada línea fija algo medible: sin ella no se sabe cuándo está terminada."
    pistas:
      - { texto: "La regulación se da en tanto por ciento; el rizado, en milivoltios eficaces." }
    escalera:
      - "150 W son 30 V por 5 A."
    solucion: "Rango 0–30 V y 0–5 A; regulación < 0,01 %; rizado < 1 mV; hasta 40 °C."
    comprobar:
      - { P_f: 150 }

  - id: estime-deriva
    tipo: pregunta
    titulo: "La línea que falta"
    texto: "La deriva del divisor de realimentación es del 0,05 % en 20 °C. ¿Cuántos milivoltios son sobre 30 V?"
    libro: [141]
    widget:
      tipo: grafica
      x: { id: dx, min: 0, max: 0.1, unidad: "%", rotulo: "deriva" }
      y: { min: 0, max: 0.03, unidad: V, rotulo: "ΔV" }
      curvas:
        - { expr: "V_f*dx/100", color: naranja, rotulo: "deriva sobre 30 V" }
        - { expr: "0.003 + 0*dx", color: tinta, rotulo: "regulación especificada", discontinua: true }
    estimar:
      objetivo: "V_d"
      unidad: V
      min: 0
      max: 0.03
      paso: 0.0005
      inicio: 0.003
      tol: 0.05
      rotulo: "Deriva sobre 30 V"
    exito: "15 mV: cinco veces la regulación especificada, 3 mV."
    pistas:
      - { cuando: { valor: estimacion, mayor: 0.016 }, texto: "Se ha pasado: 0,05 % es cinco diezmilésimas." }
      - { texto: "Se ha quedado corto: eso sería la regulación, 0,01 %; la deriva es cinco veces más." }
    escalera:
      - "0,05 % de 30 V = 30 × 0,0005."
    solucion: "30 × 0,0005 = 15 mV."
    comprobar:
      - { V_d: 0.015, f_r: 0.0005 }

  - id: porque-exactitud
    tipo: porque
    titulo: "Exactitud no es regulación"
    texto: "La tabla da la regulación, pero no la exactitud. ¿Por qué conviene escribir también esa cifra?"
    libro: [141]
    widget:
      tipo: grafica
      x: { id: dx, min: 0, max: 0.1, unidad: "%", rotulo: "deriva" }
      y: { min: 0, max: 0.03, unidad: V, rotulo: "ΔV" }
      curvas:
        - { expr: "V_f*dx/100", color: naranja, rotulo: "deriva sobre 30 V" }
        - { expr: "0.003 + 0*dx", color: tinta, rotulo: "regulación especificada", discontinua: true }
    opciones:
      - texto: "Sin una cifra, nadie decide cuánta deriva es aceptable"
        bien: true
        porque: "La deriva ya es cinco veces la regulación, y nada en la especificación dice si eso vale."
      - texto: "Porque la regulación ya la incluye"
        porque: "No: la regulación mide cómo cambia la salida con la carga y la red, no cuánto se aparta del valor."
      - texto: "No hace falta: con 16 bits la salida es exacta"
        porque: "La resolución no es exactitud: el escalón es fino, pero el divisor deriva con la temperatura."
    escalera:
      - "¿Qué línea de la tabla dice cuánto puede apartarse la salida del valor pedido?"
    solucion: "Porque sin una cifra de exactitud nadie decide cuánta deriva se acepta."

  - id: empareje-presupuestos
    tipo: pregunta
    titulo: "Tres presupuestos"
    texto: "Antes de dibujar nada se hacen tres presupuestos. Empareje cada uno con lo que suma."
    libro: [144]
    emparejar:
      - ["De potencia (39 y 40)", "Corriente media, autonomía, disipación"]
      - ["De error (0 y 48)", "Contribuciones en cuadratura"]
      - ["De tiempo (9 y 38)", "Camino crítico, latencias, márgenes de setup"]
    exito: "Los tres aparecen a lo largo del libro y se hacen antes del esquema."
    pistas:
      - { texto: "La autonomía es cosa de energía; el camino crítico, de tiempo." }
    escalera:
      - "Cada presupuesto reparte un recurso: energía, error o tiempo."
    solucion: "Potencia: corriente, autonomía, disipación. Error: cuadratura. Tiempo: camino crítico y setup."

  - id: explore-cuadratura
    tipo: explorar
    titulo: "Los errores en cuadratura"
    texto: "Con la deriva de 15 mV como término dominante, suba la segunda contribución y compare la suma en cuadratura con la suma directa."
    libro: [144, 141]
    fijar: { e_1: 0.015 }
    inicio: { e_2: 0.002 }
    widget:
      tipo: grafica
      x: { id: ex, min: 0, max: 0.015, unidad: V, rotulo: "e₂" }
      y: { min: 0, max: 0.03, unidad: V, rotulo: "e" }
      curvas:
        - { expr: "sqrt(e_1^2 + ex^2)", color: azul, rotulo: "en cuadratura" }
        - { expr: "e_1 + ex", color: naranja, rotulo: "suma directa", discontinua: true }
      marcas:
        - { x: "e_2", y: "e_t", rotulo: "{{e_t}}" }
      lectura: { valor: e_t, rotulo: "Error total" }
      mandos:
        - { valor: e_2, min: 0, max: 0.015, paso: 0.0005, rotulo: "Segunda contribución, e₂" }

  - id: simule-cuadratura
    tipo: simular
    titulo: "Un presupuesto de error"
    texto: "Dos contribuciones independientes: 15 mV de deriva y 5 mV de otra fuente. ¿Error total?"
    nota: "Los 5 mV son de ejemplo."
    libro: [144, 141]
    fijar: { e_1: 0.015, e_2: 0.005 }
    widget:
      tipo: grafica
      x: { id: ex, min: 0, max: 0.015, unidad: V, rotulo: "e₂" }
      y: { min: 0, max: 0.03, unidad: V, rotulo: "e" }
      curvas:
        - { expr: "sqrt(e_1^2 + ex^2)", color: azul, rotulo: "en cuadratura" }
      lectura: { valor: e_t, rotulo: "Error total" }
      ocultar: curvas
    simular:
      objetivo: e_t
      unidad: V
      tol: 0.02
      rotulo: "Error total"
      errores:
        - { expr: "e_s", texto: "20 mV es la suma directa: contribuciones independientes se suman en cuadratura." }
        - { expr: "e_1", texto: "Casi: 15 mV olvida del todo la segunda; en cuadratura añade algo, poco." }
    exito: "15,8 mV: los 5 mV, tres veces por debajo del dominante, apenas cuentan."
    escalera:
      - "e = √(e₁² + e₂²)."
    solucion: "√(15² + 5²) = 15,8 mV."
    comprobar:
      - { e_t: 0.0158, e_s: 0.02, tol: 0.003 }

  - id: prediga-error
    tipo: predecir
    titulo: "El amplificador de error"
    texto: "En la fuente de banco, ¿qué hace exactamente el amplificador de error?"
    libro: [145]
    widget:
      tipo: figura
      figura: fig-48.10
      zonas:
        - { id: fuente, rotulo: "La segunda columna", rect: [115, 2, 108, 168] }
    opciones:
      - texto: "Compara la salida con la consigna y ajusta el transistor de paso"
        bien: true
        porque: "Es la realimentación negativa del capítulo 26 y el lazo cerrado del 30: medir, comparar y corregir sin cesar."
      - texto: "Amplifica la tensión de salida"
        porque: "No amplifica la salida: amplifica la diferencia entre lo que hay y lo que debería haber."
      - texto: "Limita el rizado de la red"
        porque: "El rizado baja como consecuencia del lazo, pero su papel es comparar y corregir."
    escalera:
      - "Su nombre lo dice: ¿qué error amplifica?"
    solucion: "Compara la salida real con la referencia y corrige el paso: realimentación negativa en lazo cerrado."

  - id: pregunta-disipa
    tipo: pregunta
    titulo: "Dónde va el disipador"
    texto: "En el amplificador de audio, ¿por qué la etapa de potencia necesita disipador y la de preamplificación apenas?"
    libro: [145]
    widget:
      tipo: figura
      figura: fig-48.10
      zonas:
        - { id: hifi, rotulo: "La tercera columna", rect: [228, 2, 110, 168] }
    opciones:
      - texto: "La de potencia conduce corrientes grandes con caída de tensión: P = V·I"
        bien: true
        porque: "La de preamplificación trabaja con señales y corrientes mínimas: apenas disipa."
      - texto: "Porque la de potencia tiene más ganancia"
        porque: "La ganancia no calienta: lo hace la corriente por la caída de tensión del transistor."
      - texto: "Porque la de preamplificación va a menos tensión"
        porque: "Lo que manda es la corriente: mover el altavoz exige corrientes grandes."
    escalera:
      - "¿Qué etapa mueve el altavoz?"
    solucion: "Por la corriente: la etapa de potencia maneja corrientes grandes con caída, y P = V·I."

  - id: prediga-sdr
    tipo: predecir
    titulo: "La SDR y el FM7303"
    texto: "Una SDR y el receptor FM7303 hacen la misma función. ¿En qué se diferencian?"
    libro: [145]
    widget:
      tipo: figura
      figura: fig-48.10
      zonas:
        - { id: sdr, rotulo: "La cuarta columna", rect: [341, 2, 111, 168] }
    opciones:
      - texto: "La SDR muestrea cuanto antes y filtra y demodula por software"
        bien: true
        porque: "Cambia hardware por cálculo: el FM7303 lo hace con mezclador, filtros cerámicos y discriminador."
      - texto: "La SDR no traslada la señal en frecuencia"
        porque: "También capta, traslada y demodula: cambia cómo lo hace."
      - texto: "El FM7303 es digital y la SDR analógica"
        porque: "Al revés: el FM7303 usa circuitos analógicos dedicados."
    escalera:
      - "¿Dónde está el filtro de FI en cada uno?"
    solucion: "La SDR muestrea pronto y hace el filtrado y la demodulación por software."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [139, 140, 141, 144]
    ideas:
      - { titulo: "En números.", texto: "Rango, modos, regulación, rizado, resolución, ambiente y protecciones." }
      - { titulo: "La exactitud.", texto: "No es la regulación: 15 mV de deriva frente a 3 mV." }
      - { titulo: "Resolución.", texto: "El fondo de escala entre el número de escalones: 0,46 mV con 16 bits sobre 30 V." }
      - { titulo: "Presupuestos.", texto: "Potencia, error en cuadratura y tiempo, antes de dibujar." }
