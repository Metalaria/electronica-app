# Lección 1.2 de la sección 49.3 «Documentar y Compartir un Proyecto» (cap48; etiquetas sec-48.5…48.9 = impresas
# 49.1…49.5).
# - Qué documentar (figura 49.3, fig-48.12): lo mínimo (bloques 77 a 82) y lo que marca la diferencia (85 a 88).
# - El control de versiones de todo el proyecto (91 a 93), compartir y las licencias de hardware abierto (95 a 99).
# - La prueba de la documentación (101 a 103) y el cuaderno de proyecto (105, 106).
# Sección sin cálculos: sin modelo (aviso de secuencia «sin tarjeta de fórmula»).
# Paso práctico: «tocar» en la figura el recuadro al que pertenece «R7 vale 4k7 porque con 10k el arranque falla en frío».
leccion: cap48/sec-48.7

libro:
  75: "Un proyecto sin documentación es irreparable y no se puede repetir, incluso por su propio autor"
  77: "El esquema, con anotaciones y revisión"
  78: "La lista de materiales completa, con referencias comprables"
  79: "Los ficheros de fabricación, con la revisión que corresponde"
  80: "El firmware, con su versión y su código fuente."
  81: "Las medidas de validación"
  82: "Las fotos del montaje"
  85: "«R7 vale 4k7 porque con 10k el arranque falla en frío»"
  86: "Los problemas encontrados y cómo se resolvieron, que es lo más valioso y lo que sistemáticamente se omite."
  87: "Lo que se probó y no funcionó"
  88: "Las limitaciones conocidas"
  91: "Así una versión del producto corresponde a un estado completo y coherente."
  92: "Etiquetas en los puntos de fabricación"
  93: "Mensajes de cambio que expliquen el porqué, no el qué. El qué ya está en el diff."
  96: "Una licencia explícita, sin la cual nadie sabe qué puede hacer con él"
  97: "escritas para alguien que no lo diseñó"
  98: "o el proyecto solo es útil para quien tenga el mismo programa"
  99: "la S obliga a publicar con la misma licencia cualquier diseño que incorpore el original; la W, solo las modificaciones del propio diseño; y la P no exige más que conservar el aviso de autoría"
  101: "dársela a alguien que no participó y pedirle que reproduzca el proyecto"
  102: "Cada vez que tenga que preguntar algo, falta documentación."
  103: "dejar el proyecto seis meses y volver a él"
  106: "hay que escribirlo cuando ocurre"
  107: "Qué documentar y la prueba que valida la documentación."

modelo: { valores: {}, calculos: {} }

tarjetas:
  - id: explore-documentar
    tipo: explorar
    titulo: "Documentar para que sirva"
    texto: "Sin documentación, un proyecto es irreparable y no se puede repetir, ni siquiera por su autor. Toque los tres recuadros."
    libro: [75, 107]
    widget:
      tipo: figura
      figura: fig-48.12
      zonas:
        - { id: minimo, rotulo: "Arriba a la izquierda", rect: [3, 3, 211, 104], texto: "Lo mínimo: esquema, lista de materiales, ficheros de fabricación, firmware, medidas y fotos." }
        - { id: diferencia, rotulo: "Arriba a la derecha", rect: [224, 3, 224, 104], texto: "Lo que marca la diferencia: las decisiones y su porqué, los problemas, lo que no funcionó y las limitaciones." }
        - { id: prueba, rotulo: "Abajo", rect: [4, 118, 444, 84], texto: "La prueba: que alguien que no participó lo reproduzca. Cada pregunta, documentación que falta." }
    requiere: { mover: [minimo, diferencia, prueba] }

  - id: empareje-minimo
    tipo: pregunta
    titulo: "Lo mínimo imprescindible"
    texto: "Empareje cada documento con lo que debe llevar."
    libro: [77, 78, 79, 80, 81, 82]
    widget:
      tipo: figura
      figura: fig-48.12
      zonas:
        - { id: minimo, rotulo: "Arriba a la izquierda", rect: [3, 3, 211, 104] }
    emparejar:
      - ["El esquema", "Anotaciones y revisión"]
      - ["La lista de materiales", "Referencias que se puedan comprar"]
      - ["Los ficheros de fabricación", "La revisión que corresponde"]
      - ["El firmware", "Su versión y su código fuente"]
    exito: "Y además las medidas de validación y las fotos del montaje, que resuelven dudas que ningún dibujo aclara."
    pistas:
      - { texto: "Una lista de materiales sin referencias comprables no permite repetir el aparato." }
    escalera:
      - "Cada documento debe poder usarse solo: ¿qué le falta a cada uno para eso?"
    solucion: "Esquema con anotaciones; lista con referencias; fabricación con su revisión; firmware con versión y fuente."

  - id: toque-r7
    tipo: tocar
    titulo: "R7 vale 4k7"
    texto: "«R7 vale 4k7 porque con 10k el arranque falla en frío.» Toque el recuadro al que pertenece esta frase."
    libro: [85, 107]
    widget:
      tipo: figura
      figura: fig-48.12
      zonas:
        - { id: minimo, rotulo: "Arriba a la izquierda", rect: [3, 3, 211, 104] }
        - { id: diferencia, rotulo: "Arriba a la derecha", rect: [224, 3, 224, 104] }
        - { id: prueba, rotulo: "Abajo", rect: [4, 118, 444, 84] }
    tocar:
      bien: [diferencia]
      porque:
        minimo: "El esquema ya dice que R7 es de 4k7; no dice por qué."
        prueba: "La prueba descubre que falta la frase, pero la frase es documentación del diseño."
    exito: "Es una decisión con su porqué: ahorra medio día a alguien, probablemente a usted, dentro de dos años."
    escalera:
      - "¿Qué añade la frase a lo que ya dice el esquema?"
    solucion: "Arriba a la derecha: las decisiones y su porqué."

  - id: pregunta-valioso
    tipo: pregunta
    titulo: "Lo que se omite"
    texto: "De todo lo que se documenta, ¿qué es lo más valioso y lo que sistemáticamente se omite?"
    libro: [86, 87, 88]
    widget:
      tipo: figura
      figura: fig-48.12
      zonas:
        - { id: diferencia, rotulo: "Arriba a la derecha", rect: [224, 3, 224, 104] }
    opciones:
      - texto: "Los problemas encontrados y cómo se resolvieron"
        bien: true
        porque: "Es lo que más tiempo ahorra después, y lo primero que se olvida al terminar."
      - texto: "La lista de materiales"
        porque: "Es imprescindible, pero casi nunca se olvida: sin ella no se puede comprar."
      - texto: "Las fotos del montaje"
        porque: "Ayudan mucho, pero el libro señala otra cosa como lo más valioso."
    escalera:
      - "¿Qué se pierde si no se anota en el momento en que ocurre?"
    solucion: "Los problemas encontrados y cómo se resolvieron."

  - id: empareje-versiones
    tipo: pregunta
    titulo: "Control de versiones de todo"
    texto: "Empareje cada práctica de control de versiones con lo que consigue."
    libro: [91, 92, 93]
    widget:
      tipo: figura
      figura: fig-48.12
      zonas:
        - { id: minimo, rotulo: "Arriba a la izquierda", rect: [3, 3, 211, 104] }
    emparejar:
      - ["Esquema, placa, firmware y documentación en un repositorio", "Una versión es un estado completo y coherente"]
      - ["Etiquetas en los puntos de fabricación", "Volver exactamente a lo que se envió"]
      - ["Mensajes que explican el porqué", "Lo que el diff no dice"]
    exito: "El qué ya está en el diff; el mensaje de cambio cuenta el porqué."
    pistas:
      - { texto: "Una etiqueta marca un momento concreto de la historia." }
    escalera:
      - "Piense en qué haría falta para fabricar otra vez la placa que se envió hace un año."
    solucion: "Todo junto: estado coherente. Etiquetas: volver a lo enviado. Mensajes: el porqué."

  - id: empareje-licencias
    tipo: pregunta
    titulo: "La CERN OHL versión 2"
    texto: "Empareje cada variante de la licencia con lo que exige."
    libro: [96, 99]
    widget:
      tipo: figura
      figura: fig-48.12
      zonas:
        - { id: prueba, rotulo: "Abajo", rect: [4, 118, 444, 84] }
    emparejar:
      - ["S", "Publicar con la misma licencia cualquier diseño que incorpore el original"]
      - ["W", "Publicar solo las modificaciones del propio diseño"]
      - ["P", "Conservar el aviso de autoría"]
    exito: "Sin una licencia explícita, nadie sabe qué puede hacer con un proyecto publicado."
    pistas:
      - { texto: "La P es la más permisiva; la S, la más exigente." }
    escalera:
      - "Ordénelas de más a menos exigente y empareje en ese orden."
    solucion: "S: todo diseño que lo incorpore; W: solo las modificaciones; P: el aviso de autoría."

  - id: prediga-protege
    tipo: predecir
    titulo: "Qué protege una licencia de hardware"
    texto: "Las licencias de hardware se parecen a las de software, con un matiz. ¿Qué protegen?"
    libro: [99]
    widget:
      tipo: figura
      figura: fig-48.12
      zonas:
        - { id: prueba, rotulo: "Abajo", rect: [4, 118, 444, 84] }
    opciones:
      - texto: "La documentación del diseño, no el objeto físico"
        bien: true
        porque: "El objeto físico es terreno de las patentes."
      - texto: "El aparato fabricado"
        porque: "Eso lo cubren las patentes; la licencia cubre esquemas, placa, lista y firmware."
      - texto: "Nada: el hardware abierto renuncia a la autoría"
        porque: "Publicar abierto no es renunciar a la autoría; la P exige al menos conservar el aviso."
    escalera:
      - "¿Qué es lo que se publica: el aparato o sus ficheros?"
    solucion: "La documentación del diseño; el objeto físico es terreno de las patentes."

  - id: pregunta-formatos
    tipo: pregunta
    titulo: "Publicar en formato de pago"
    texto: "Alguien publica su proyecto con una licencia abierta, pero solo en el formato de un programa de pago. ¿Qué consigue?"
    libro: [97, 98]
    widget:
      tipo: figura
      figura: fig-48.12
      zonas:
        - { id: prueba, rotulo: "Abajo", rect: [4, 118, 444, 84] }
    opciones:
      - texto: "Que solo le sirva a quien tenga el mismo programa"
        bien: true
        porque: "Formatos abiertos o legibles sin herramientas de pago, además de la licencia y de instrucciones escritas para quien no lo diseñó."
      - texto: "Lo mismo que publicarlo en formato abierto"
        porque: "La licencia permite usarlo, pero sin el programa no se puede abrir."
      - texto: "Que nadie pueda copiarlo"
        porque: "No es una protección: solo reduce a quién le sirve."
    escalera:
      - "¿Qué necesita quien descarga los ficheros para poder abrirlos?"
    solucion: "Que el proyecto solo es útil para quien tenga el mismo programa."

  - id: prediga-prueba
    tipo: predecir
    titulo: "La prueba doméstica"
    texto: "La prueba de la documentación es dársela a alguien que no participó para que lo reproduzca. ¿Cuál es su versión doméstica?"
    libro: [101, 102, 103]
    widget:
      tipo: figura
      figura: fig-48.12
      zonas:
        - { id: prueba, rotulo: "Abajo", rect: [4, 118, 444, 84] }
    opciones:
      - texto: "Dejar el proyecto seis meses y volver a él"
        bien: true
        porque: "La memoria propia se comporta como una persona ajena con notable fidelidad."
      - texto: "Releerla nada más terminar"
        porque: "Recién terminado, uno rellena los huecos de memoria sin notarlo."
      - texto: "Contar las páginas"
        porque: "La cantidad no prueba nada: cada pregunta que surge es documentación que falta."
    escalera:
      - "¿Quién se parece a una persona ajena al proyecto?"
    solucion: "Volver al proyecto tras seis meses: cada pregunta, documentación que falta."

  - id: porque-cuaderno
    tipo: porque
    titulo: "El cuaderno de proyecto"
    texto: "El hábito que lo hace viable: un cuaderno con fechas, decisiones, medidas y problemas. ¿Por qué escribirlo en el momento?"
    libro: [106]
    widget:
      tipo: figura
      figura: fig-48.12
      zonas:
        - { id: prueba, rotulo: "Abajo", rect: [4, 118, 444, 84] }
    opciones:
      - texto: "Porque después no se hace, y lo no anotado se pierde"
        bien: true
        porque: "Se pierde aunque el aparato siga funcionando; no hace falta ordenarlo ni redactarlo bien."
      - texto: "Porque tiene que estar bien redactado"
        porque: "Al revés: no hay que ordenarlo ni redactarlo, solo escribirlo cuando ocurre."
      - texto: "Porque sustituye al esquema"
        porque: "No lo sustituye: guarda lo que el esquema no dice, las decisiones y los problemas."
    escalera:
      - "¿Cuándo se recuerda mejor por qué se cambió una resistencia?"
    solucion: "Porque lo que no se anota cuando ocurre se pierde."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [75, 85, 93, 101]
    ideas:
      - { titulo: "Lo mínimo.", texto: "Esquema, lista de materiales, fabricación, firmware, medidas y fotos." }
      - { titulo: "La diferencia.", texto: "Las decisiones y su porqué, y los problemas y cómo se resolvieron." }
      - { titulo: "Versiones.", texto: "Todo en un repositorio, etiquetas al fabricar y mensajes con el porqué." }
      - { titulo: "La prueba.", texto: "Que otro lo reproduzca, o usted dentro de seis meses." }
