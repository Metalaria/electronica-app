# Lección 1.2 de la sección 49.1 «Lo que Cada Proyecto Integra» (cap48; etiquetas sec-48.5…48.9 = impresas 49.1…49.5).
# - El mapa de los cuatro proyectos (figura 49.1, fig-48.10): lo que integra cada uno y su dificultad real (bloques 7 a 21).
# - Lo que comparten (bloques 24 a 28), la tabla de cobertura (30, 31) y el consejo del banco (33, 34).
# - La dificultad de la fuente: el lineal disipa (V_entrada − V_salida)·I (capítulo 51, cap50#217); con 30 V de entrada
#   dando 3 V a 3 A, 81 W (cap50#78, cap50#79). La gráfica es esa recta frente a la tensión de salida.
# Paso práctico: «simular» la disipación del lineal (81 W; errores: la potencia entregada, 9 W, o la entrada entera,
# 90 W).
leccion: cap48/sec-48.5

libro:
  5: "cada uno atraviesa el libro por un camino distinto"
  7: "cada decisión depende de las anteriores"
  8: "sensores y su acondicionamiento (capítulo 36)"
  9: "Su dificultad característica: el consumo, y con él la fiabilidad en campo"
  11: "con 3 A y la salida baja un lineal tiene que disipar más de 100 W"
  12: "reguladores (capítulo 8)"
  13: "el lazo de control con dos modos"
  15: "casi todo lo que puede salir mal es medible y audible"
  16: "discretos (capítulo 44)"
  17: "las masas y el zumbido, la estabilidad con carga reactiva y la gestión térmica de la etapa de salida"
  19: "Un receptor de onda corta con mezclador en cuadratura y la tarjeta de sonido como convertidor"
  20: "radiofrecuencia y antenas (capítulo 37)"
  21: "eso convierte al oscilador en el componente crítico"
  24: "Todos empiezan por la especificación"
  25: "la alimentación es un subsistema, no un detalle"
  26: "Todos exigen medir para creer"
  27: "en la fuente no es regular sino disipar"
  28: "el trabajo se va donde no se esperaba"
  30: "Realización (41, 42, 48)"
  31: "la realización física importa en los cuatro"
  33: "construirlos por bloques, midiendo cada uno antes de unirlo al siguiente"
  34: "Un proyecto completo montado de una vez es indiagnosticable"
  35: "Los cuatro proyectos con lo que cada uno integra y su dificultad real."
  "cap50#78": "Un lineal solo, con 30 V de entrada dando 3 V a 3 A, disipa"
  "cap50#79": '"81 W"'
  "cap50#217": 'P = lr(( V_("entrada") - V_("salida") )) times I'
  "cap48#145": "conviene leer los sensores digitales por un bus I²C"

modelo:
  valores:
    V_e: { sim: "V_{entrada}", nombre: "tensión de entrada del lineal", unidad: V, valor: 30 }
    V_s: { sim: "V_{salida}", nombre: "tensión de salida", unidad: V, valor: 3 }
    I_s: { sim: "I", nombre: "corriente de salida", unidad: A, valor: 3 }
  calculos:
    P_d: { expr: "(V_e - V_s)*I_s", sim: "P", nombre: "potencia que disipa el lineal", unidad: W }
    P_u: { expr: "V_s*I_s", sim: "P_{salida}", nombre: "potencia que entrega", unidad: W }
    P_e: { expr: "V_e*I_s", sim: "P_{entrada}", nombre: "potencia que toma de la entrada", unidad: W }

tarjetas:
  - id: explore-mapa
    tipo: explorar
    titulo: "Cuatro recorridos por el libro"
    texto: "Cada proyecto atraviesa el libro por un camino distinto. Toque la dificultad real de cada uno."
    libro: [5, 7, 35]
    widget:
      tipo: figura
      figura: fig-48.10
      zonas:
        - { id: iot, rotulo: "Abajo, la primera columna", rect: [5, 110, 101, 56], texto: "Estación IoT: no es el sensor, es el consumo. Cada decisión depende de las anteriores." }
        - { id: fuente, rotulo: "Abajo, la segunda columna", rect: [119, 110, 101, 56], texto: "Fuente de laboratorio: no es regular, es disipar." }
        - { id: hifi, rotulo: "Abajo, la tercera columna", rect: [232, 110, 101, 56], texto: "Amplificador Hi-Fi: no es amplificar, es estabilizar y no zumbar." }
        - { id: sdr, rotulo: "Abajo, la cuarta columna", rect: [346, 110, 101, 56], texto: "SDR: no es procesar, es lo que llega al convertidor, del equilibrio I/Q al reloj." }
    requiere: { mover: [iot, fuente, hifi, sdr] }

  - id: empareje-capitulos
    tipo: pregunta
    titulo: "Lo que integra cada uno"
    texto: "Empareje cada proyecto con tres de los capítulos que atraviesa."
    libro: [8, 12, 16, 20, 35]
    widget:
      tipo: figura
      figura: fig-48.10
      zonas:
        - { id: integra, rotulo: "Las cuatro columnas", rect: [5, 30, 445, 75] }
    emparejar:
      - ["Estación IoT", "Sensores (36), buses (45), bajo consumo (39)"]
      - ["Fuente de laboratorio", "Reguladores (8), conmutación (33), protecciones (10)"]
      - ["Amplificador Hi-Fi", "Discretos (44), ruido (32), térmica (48)"]
      - ["SDR", "Radiofrecuencia (37), muestreo (29 y 35), FPGA (38)"]
    exito: "Juntos cubren casi todo lo tratado en el libro."
    pistas:
      - { texto: "La radiofrecuencia solo la necesita la radio; la térmica de una etapa de salida, el amplificador." }
    escalera:
      - "Piense en la pieza central de cada aparato: un sensor, un regulador, unos transistores de salida, un mezclador."
    solucion: "IoT: sensores, buses, bajo consumo. Fuente: reguladores, conmutación, protecciones. Hi-Fi: discretos, ruido, térmica. SDR: RF, muestreo, FPGA."

  - id: prediga-fuente
    tipo: predecir
    titulo: "La fuente de 30 V y 3 A"
    texto: "El rizado bajo pide un regulador lineal. ¿Dónde está el problema difícil de esta fuente?"
    libro: [11, 13, 27]
    widget:
      tipo: figura
      figura: fig-48.10
      zonas:
        - { id: fuente, rotulo: "La segunda columna", rect: [115, 2, 108, 168] }
    opciones:
      - texto: "En disipar: con 3 A y la salida baja, más de 100 W"
        bien: true
        porque: "La entrada debe superar 30 V incluso con la red al −10 %, y el lineal se come la diferencia."
      - texto: "En regular la tensión con precisión"
        porque: "Regular lo hace un lineal sin esfuerzo; lo difícil es el calor que produce mientras lo hace."
      - texto: "En el rizado de la salida"
        porque: "El rizado bajo es justo lo que el lineal resuelve bien; el precio es la disipación."
    escalera:
      - "Un lineal deja caer sobre sí la diferencia entre entrada y salida. ¿Cuándo es mayor esa diferencia?"
    solucion: "Disipar: con la salida baja y 3 A, el lineal tiene que disipar más de 100 W."

  - id: simule-lineal
    tipo: simular
    titulo: "Lo que se come el lineal"
    texto: "Un lineal solo, con 30 V de entrada, da 3 V a 3 A. ¿Cuánto disipa?"
    libro: ["cap50#78", "cap50#79", "cap50#217"]
    fijar: { V_e: 30, V_s: 3, I_s: 3 }
    widget:
      tipo: grafica
      x: { id: vx, min: 0, max: 30, unidad: V, rotulo: "V_{salida}" }
      y: { min: 0, max: 100, unidad: W, rotulo: "P" }
      curvas:
        - { expr: "(V_e - vx)*I_s", color: naranja, rotulo: "disipación del lineal" }
      marcas:
        - { x: "V_s", y: "P_d", rotulo: "{{P_d}}" }
      lectura: { valor: P_d, rotulo: "Disipación" }
      ocultar: curvas
    simular:
      objetivo: P_d
      unidad: W
      tol: 0.03
      rotulo: "Potencia que disipa el lineal"
      errores:
        - { expr: "P_u", texto: "Esos 9 W son los que entrega a la carga: el lineal disipa la diferencia entre entrada y salida por la corriente." }
        - { expr: "P_e", texto: "Esos 90 W son lo que toma de la entrada: a la carga le llegan 9, y el resto es calor." }
    exito: "81 W de calor para entregar 9: disipador enorme y ventilador. Por eso la dificultad de la fuente es disipar."
    escalera:
      - "P = (V_{entrada} − V_{salida})·I."
    solucion: "(30 − 3) × 3 = 81 W."
    comprobar:
      - { P_d: 81, P_u: 9, P_e: 90 }

  - id: empareje-dificultad
    tipo: pregunta
    titulo: "El problema que no parecía"
    texto: "En todos, el problema difícil no es el que parecía. Empareje cada proyecto con el suyo."
    libro: [27, 9, 15, 17, 21]
    widget:
      tipo: figura
      figura: fig-48.10
      zonas:
        - { id: dificultad, rotulo: "Las cuatro dificultades", rect: [5, 110, 445, 56] }
    emparejar:
      - ["Estación IoT", "No el sensor, sino el consumo"]
      - ["Fuente", "No regular, sino disipar"]
      - ["Amplificador", "No amplificar, sino estabilizar y no zumbar"]
      - ["SDR", "No procesar, sino lo que llega al convertidor"]
    exito: "Ninguno es difícil por su esquema: las dificultades son físicas, calor, ruido, masas y consumo."
    pistas:
      - { texto: "El que funciona con pilas un año tiene un problema de energía." }
    escalera:
      - "Busque en cada uno la magnitud física que manda: energía, calor, masas, reloj."
    solucion: "IoT, consumo; fuente, disipar; amplificador, estabilizar y no zumbar; SDR, lo que llega al convertidor."

  - id: prediga-reloj
    tipo: predecir
    titulo: "Muestrear cerca de la radiofrecuencia"
    texto: "Si la SDR muestrea directamente la radiofrecuencia, ¿qué componente pasa a ser el crítico?"
    libro: [19, 21]
    widget:
      tipo: figura
      figura: fig-48.10
      zonas:
        - { id: sdr, rotulo: "La cuarta columna", rect: [341, 2, 111, 168] }
    opciones:
      - texto: "El oscilador del reloj"
        bien: true
        porque: "El jitter admisible corresponde a la frecuencia de la señal, no a la de muestreo."
      - texto: "El procesador que hace la FFT"
        porque: "Procesar no es el problema de la SDR: lo es lo que llega al convertidor."
      - texto: "La tarjeta de sonido"
        porque: "Esa es la versión del capítulo 53; con muestreo directo, el reloj manda."
    escalera:
      - "¿De qué depende el error de muestrear una señal rápida en un instante algo equivocado?"
    solucion: "El reloj: el jitter admisible lo fija la frecuencia de la señal."

  - id: pregunta-cobertura
    tipo: pregunta
    titulo: "La fila que marcan los cuatro"
    texto: "En la tabla de cobertura, ¿qué fila tiene marca en los cuatro proyectos?"
    libro: [30, 31]
    widget:
      tipo: figura
      figura: fig-48.10
      zonas:
        - { id: comparten, rotulo: "Lo que comparten", rect: [3, 176, 448, 58] }
    opciones:
      - texto: "Realización (41, 42, 48)"
        bien: true
        porque: "La realización física importa en los cuatro, sea cual sea la especialidad."
      - texto: "Analógico (8, 26, 44)"
        porque: "La estación IoT apenas lo toca: su peso está en digital y firmware."
      - texto: "RF (37)"
        porque: "Solo la SDR lo tiene como fuerte; la fuente y el amplificador no lo tocan."
    escalera:
      - "¿Qué necesita cualquier aparato, sea de la especialidad que sea, para existir?"
    solucion: "Realización: placa, montaje y térmica, en los cuatro."

  - id: pregunta-i2c
    tipo: pregunta
    titulo: "Los sensores de la estación"
    texto: "¿Por qué leer los sensores digitales por un bus I²C y no con una entrada analógica cada uno?"
    libro: ["cap48#145", 8]
    widget:
      tipo: figura
      figura: fig-48.10
      zonas:
        - { id: iot, rotulo: "La primera columna", rect: [2, 2, 108, 168] }
    opciones:
      - texto: "Dos líneas compartidas, cada sensor con su dirección y la medida ya calibrada"
        bien: true
        porque: "Ahorra pines y canales, y una señal digital no recoge el ruido de los cables."
      - texto: "Porque el I²C es más rápido que cualquier convertidor"
        porque: "La velocidad no es la razón: lo son los pines, el ruido y la calibración."
      - texto: "Porque los sensores analógicos consumen más"
        porque: "El ejercicio no habla de consumo: habla de pines, ruido en los cables y escalabilidad."
    escalera:
      - "Cuente pines: ¿cuántos hacen falta con diez sensores en cada caso?"
    solucion: "Por el bus: dos líneas para todos, sin ruido analógico en los cables y con la medida calibrada."

  - id: porque-bloques
    tipo: porque
    titulo: "Por bloques"
    texto: "El consejo que vale para los cuatro: construir por bloques, midiendo cada uno antes de unirlo. ¿Por qué?"
    libro: [33, 34, 26]
    widget:
      tipo: figura
      figura: fig-48.10
      zonas:
        - { id: comparten, rotulo: "Lo que comparten", rect: [3, 176, 448, 58] }
    opciones:
      - texto: "Montado de una vez es indiagnosticable; por etapas verificadas, es un problema resuelto"
        bien: true
        porque: "Cada bloque medido acota dónde está un fallo: al unir el siguiente, solo puede estar en lo nuevo."
      - texto: "Porque así se gastan menos componentes"
        porque: "Los componentes son los mismos; lo que cambia es poder localizar los fallos."
      - texto: "Porque los bloques no funcionan juntos"
        porque: "Funcionan juntos: el objetivo es saber cuál falla cuando algo no va."
    escalera:
      - "Si algo falla con todo montado, ¿cuántos sospechosos hay?"
    solucion: "Para poder diagnosticar: cada etapa verificada deja un solo sospechoso, lo último añadido."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [24, 25, 27, 28, 34]
    ideas:
      - { titulo: "Cuatro caminos.", texto: "Cada proyecto atraviesa el libro por un camino distinto; juntos cubren casi todo." }
      - { titulo: "La dificultad real.", texto: "Consumo, disipar, estabilizar y no zumbar, y lo que llega al convertidor." }
      - { titulo: "Física.", texto: "Ninguno es difícil por su esquema: el trabajo se va donde no se esperaba." }
      - { titulo: "En el banco.", texto: "Por bloques, midiendo cada uno antes de unirlo al siguiente." }
