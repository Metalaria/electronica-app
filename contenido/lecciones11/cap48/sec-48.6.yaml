# Lección 1.2 de la sección 49.2 «Cómo Abordar un Proyecto Propio: del Concepto al Prototipo» (cap48; etiquetas
# sec-48.5…48.9 = impresas 49.1…49.5).
# - Las seis etapas (figura 49.2, fig-48.11, bloques 39 a 60) y los seis errores (bloques 62 a 67).
# - El presupuesto de tiempo: diseño (etapas 1 a 4) una cuarta parte, montaje otra, depuración y validación la mitad
#   (bloque 69). Modelo: el total es el diseño por cuatro; las tres semanas de diseño son de ejemplo (rotulado).
# - La lista de comprobación de la validación (bloque 71).
# Pasos prácticos: «ordenar» las seis etapas y «tocar» en la figura la etapa en la que está el error de prototipar una
# fuente conmutada en protoboard.
leccion: cap48/sec-48.6

libro:
  38: "Es el camino más largo"
  39: "de lo abstracto a lo concreto, y cada etapa cierra decisiones que la siguiente ya no revisa"
  41: "margen de −10 a 50 °C, exactitud ±0,5 °C, una lectura por minuto, alimentado por pila durante seis meses"
  42: "La exactitud de ±0,5 °C descarta el termopar (sección 36.2); los seis meses de pila descartan el TFT"
  43: "distinguir en la lista lo que es requisito de lo que es deseo"
  46: "Aquí se toman las decisiones estructurales, que son las caras de cambiar"
  47: "Un presupuesto de consumo hecho aquí evita descubrir en el prototipo que la autonomía es de tres semanas y no de seis meses"
  50: "preferir componentes con ecosistema"
  52: "el esquema es en buena parte transcripción"
  53: "anotar las tensiones esperadas en los nodos importantes"
  55: "Antes de la placa, verificar lo incierto"
  56: "Prototipar una fuente conmutada en protoboard no valida nada"
  57: "Medir el prototipo contra la especificación es el objetivo de esta etapa"
  59: "en las condiciones peores previstas"
  60: "prever una revisión"
  62: "Empezar por el componente en lugar de por el problema"
  63: "No escribir la especificación, con lo que el proyecto no termina nunca"
  64: "Dejar la alimentación para el final"
  65: "Ignorar el consumo hasta el prototipo"
  67: "un fallo cuesta diez veces más"
  69: "el diseño (etapas 1 a 4) suele llevar una cuarta parte del tiempo, el montaje otra cuarta, y la depuración y validación la mitad"
  71: "cada línea, una medida, con su valor esperado y su resultado"
  72: "Las seis etapas de un proyecto propio y los seis errores que más veces lo arruinan."

modelo:
  valores:
    T_d: { sim: "T_{diseño}", nombre: "tiempo de diseño (etapas 1 a 4)", unidad: semanas, valor: 3 }
  calculos:
    T_t: { expr: "4*T_d", sim: "T", nombre: "tiempo total del proyecto", unidad: semanas }
    T_m: { expr: "T_d", sim: "T_{montaje}", nombre: "tiempo de montaje", unidad: semanas }
    T_v: { expr: "2*T_d", sim: "T_{depuración}", nombre: "depuración y validación", unidad: semanas }

tarjetas:
  - id: explore-etapas
    tipo: explorar
    titulo: "Al revés del instinto"
    texto: "Un proyecto va de lo abstracto a lo concreto: cada etapa cierra decisiones que la siguiente ya no revisa. Toque la primera y la última."
    libro: [38, 39, 72]
    widget:
      tipo: figura
      figura: fig-48.11
      zonas:
        - { id: e1, rotulo: "Arriba a la izquierda", rect: [3, 2, 133, 54], texto: "Especificación: qué debe hacer, con números. Cada cifra elimina opciones." }
        - { id: e2, rotulo: "Arriba en el centro", rect: [158, 2, 133, 54], texto: "Diagrama de bloques: decisiones estructurales y presupuesto de recursos." }
        - { id: e3, rotulo: "Arriba a la derecha", rect: [313, 2, 133, 54], texto: "Componentes clave: hojas de datos, disponibilidad real y ecosistema." }
        - { id: e4, rotulo: "Abajo a la izquierda", rect: [3, 73, 133, 54], texto: "Esquema: casi transcripción, con tensiones anotadas, puntos de prueba y ERC." }
        - { id: e5, rotulo: "Abajo en el centro", rect: [158, 73, 133, 54], texto: "Prototipo: solo lo incierto, en el soporte adecuado." }
        - { id: e6, rotulo: "Abajo a la derecha", rect: [313, 73, 133, 54], texto: "Placa y validación: contra la lista del punto 1, en las peores condiciones." }
    requiere: { mover: [e1, e6] }

  - id: ordene-etapas
    tipo: pregunta
    titulo: "Las seis etapas"
    texto: "Ordene las etapas de un proyecto propio."
    libro: [39, 46, 52, 55, 59]
    widget:
      tipo: figura
      figura: fig-48.11
      zonas:
        - { id: errores, rotulo: "Los errores, abajo", rect: [3, 140, 444, 65] }
    ordenar:
      - "Especificación con números"
      - "Diagrama de bloques"
      - "Elección de componentes clave"
      - "Esquema"
      - "Prototipo de lo incierto"
      - "Placa, montaje y validación"
    exito: "Empezar por el esquema es el camino más largo: la primera dificultad obliga a rehacer decisiones tomadas sin criterio."
    pistas:
      - { texto: "El esquema no va primero: es casi transcripción cuando la arquitectura y los componentes ya están fijados." }
    escalera:
      - "De lo abstracto a lo concreto: qué hace, con qué bloques, con qué piezas, cómo se conectan."
    solucion: "Especificación, bloques, componentes, esquema, prototipo, placa y validación."

  - id: prediga-cifras
    tipo: predecir
    titulo: "Cada cifra elimina opciones"
    texto: "La especificación pide ±0,5 °C de exactitud y seis meses con pila. ¿Qué descartan esas dos cifras?"
    libro: [41, 42]
    widget:
      tipo: figura
      figura: fig-48.11
      zonas:
        - { id: e1, rotulo: "Arriba a la izquierda", rect: [3, 2, 133, 54] }
    opciones:
      - texto: "El termopar y la pantalla TFT"
        bien: true
        porque: "La exactitud deja fuera el termopar; seis meses de pila, una pantalla TFT."
      - texto: "Nada todavía: se decide al hacer el esquema"
        porque: "Es justo al revés: cada cifra de la especificación elimina opciones antes de dibujar nada."
      - texto: "El microcontrolador, que debe ser el más rápido"
        porque: "Ninguna de las dos cifras pide velocidad; piden un sensor exacto y poco consumo."
    escalera:
      - "Una cifra es de exactitud de la medida y la otra de energía."
    solucion: "La exactitud descarta el termopar; los seis meses de pila, el TFT."

  - id: porque-requisito
    tipo: porque
    titulo: "Requisito o deseo"
    texto: "¿Por qué conviene marcar en la lista qué es requisito y qué es deseo?"
    libro: [43]
    widget:
      tipo: figura
      figura: fig-48.11
      zonas:
        - { id: e1, rotulo: "Arriba a la izquierda", rect: [3, 2, 133, 54] }
    opciones:
      - texto: "Porque siempre hay que sacrificar algo, y así no se sacrifica lo importante"
        bien: true
        porque: "Cuando dos cifras chocan, la distinción dice cuál se cumple y cuál se relaja."
      - texto: "Porque los deseos no se pueden medir"
        porque: "También se escriben con números; la diferencia es cuál cede cuando chocan."
      - texto: "Para que la lista sea más corta"
        porque: "La lista no se acorta: se ordena por lo que no puede fallar."
    escalera:
      - "¿Qué pasa cuando dos líneas de la especificación no caben a la vez?"
    solucion: "Para saber qué sacrificar cuando haya que hacerlo, que siempre lo hay."

  - id: empareje-etapa
    tipo: pregunta
    titulo: "Qué se decide en cada etapa"
    texto: "Empareje cada decisión con la etapa en la que se toma."
    libro: [46, 47, 50, 53, 60]
    widget:
      tipo: figura
      figura: fig-48.11
      zonas:
        - { id: etapas, rotulo: "Las seis etapas", rect: [3, 2, 444, 125] }
    emparejar:
      - ["¿Un microcontrolador o dos?", "Diagrama de bloques"]
      - ["El presupuesto de consumo", "Diagrama de bloques"]
      - ["Un sensor con ejemplos y comunidad", "Componentes clave"]
      - ["Las tensiones esperadas en los nodos", "Esquema"]
      - ["Un pad sin poblar para la segunda vuelta", "Placa y validación"]
    exito: "Las decisiones caras de cambiar se toman en el diagrama de bloques, cuando cambiar de opinión aún es barato."
    pistas:
      - { texto: "El consumo condiciona la arquitectura: se presupuesta con los bloques, no con el prototipo." }
    escalera:
      - "Las decisiones estructurales y los presupuestos van con los bloques; las anotaciones, con el esquema."
    solucion: "Uno o dos micros y el consumo: bloques. Ecosistema: componentes. Tensiones: esquema. Pad sin poblar: placa."

  - id: toque-protoboard
    tipo: tocar
    titulo: "Una conmutada en protoboard"
    texto: "Alguien prueba su fuente conmutada en una protoboard y da el diseño por bueno. Toque la etapa en la que está el error."
    libro: [55, 56, 57]
    widget:
      tipo: figura
      figura: fig-48.11
      zonas:
        - { id: e1, rotulo: "Arriba a la izquierda", rect: [3, 2, 133, 54] }
        - { id: e2, rotulo: "Arriba en el centro", rect: [158, 2, 133, 54] }
        - { id: e3, rotulo: "Arriba a la derecha", rect: [313, 2, 133, 54] }
        - { id: e4, rotulo: "Abajo a la izquierda", rect: [3, 73, 133, 54] }
        - { id: e5, rotulo: "Abajo en el centro", rect: [158, 73, 133, 54] }
        - { id: e6, rotulo: "Abajo a la derecha", rect: [313, 73, 133, 54] }
    tocar:
      bien: [e5]
      porque:
        e1: "La especificación puede estar bien escrita; el fallo es cómo se verificó."
        e2: "La arquitectura no es el problema: lo es el soporte en que se probó."
        e3: "Los componentes pueden ser los buenos; la protoboard no deja validarlos."
        e4: "El esquema puede ser correcto: lo que falla es la prueba."
        e6: "Aún no se ha llegado a la placa: el error es anterior."
    exito: "En el prototipo: lo rápido o analógico va en placa perforada. Prototipar una conmutada en protoboard no valida nada."
    escalera:
      - "¿En qué etapa se elige el soporte de las pruebas?"
    solucion: "Abajo en el centro, el prototipo: el soporte equivocado."

  - id: estime-tiempo
    tipo: pregunta
    titulo: "El presupuesto de tiempo"
    texto: "Las etapas 1 a 4 de un proyecto propio le han llevado 3 semanas. ¿Cuánto durará el proyecto entero, siendo realista?"
    nota: "Las 3 semanas son de ejemplo."
    libro: [69]
    fijar: { T_d: 3 }
    widget:
      tipo: figura
      figura: fig-48.11
      zonas:
        - { id: presupuesto, rotulo: "La línea de abajo", rect: [90, 188, 280, 35] }
    estimar:
      objetivo: "T_t"
      unidad: semanas
      min: 0
      max: 20
      paso: 1
      inicio: 5
      tol: 0.05
      rotulo: "Duración total"
    exito: "12 semanas: el diseño es una cuarta parte, el montaje otra y la depuración y validación, la mitad."
    pistas:
      - { cuando: { valor: estimacion, mayor: 12.5 }, texto: "Se ha pasado: el diseño es la cuarta parte del total, no menos." }
      - { texto: "Se ha quedado corto: quien planifica solo el diseño calcula por defecto un factor cuatro." }
    escalera:
      - "Diseño ¼, montaje ¼, depuración y validación ½."
    solucion: "3 semanas son la cuarta parte: 12 semanas en total."
    comprobar:
      - { T_t: 12, T_m: 3, T_v: 6 }

  - id: porque-alimentacion
    tipo: porque
    titulo: "La alimentación, al final"
    texto: "Uno de los errores más repetidos es dejar la alimentación para el final. ¿Por qué arruina el proyecto?"
    libro: [64, 65]
    widget:
      tipo: figura
      figura: fig-48.11
      zonas:
        - { id: errores, rotulo: "Los errores, abajo", rect: [3, 140, 444, 65] }
    opciones:
      - texto: "Es el bloque que más condiciona: consumo, ruido, espacio y seguridad"
        bien: true
        porque: "Debe diseñarse en la etapa 2: al final ya no cabe la que el resto necesita."
      - texto: "Porque los reguladores tardan en llegar"
        porque: "La disponibilidad cuenta al elegir piezas, pero el error es de arquitectura."
      - texto: "No lo arruina: se elige al final una fuente comercial"
        porque: "Ese improvisar es el error: el consumo y el ruido ya han condicionado todo lo demás."
    escalera:
      - "¿Qué bloque decide la autonomía, el ruido y el tamaño a la vez?"
    solucion: "Porque es el bloque que más condiciona; va en el diagrama de bloques, no al terminar."

  - id: empareje-errores
    tipo: pregunta
    titulo: "Los errores y lo que cuestan"
    texto: "Empareje cada error con lo que provoca."
    libro: [62, 63, 65, 67]
    widget:
      tipo: figura
      figura: fig-48.11
      zonas:
        - { id: errores, rotulo: "Los errores, abajo", rect: [3, 140, 444, 65] }
    emparejar:
      - ["Empezar por el componente", "Un proyecto que no resuelve nada"]
      - ["No escribir la especificación", "El proyecto no termina nunca"]
      - ["Ignorar el consumo hasta el prototipo", "La autonomía prometida no cabe en la arquitectura"]
      - ["No prever la depuración", "Un fallo cuesta diez veces más"]
    exito: "Los seis errores tienen algo en común: son decisiones aplazadas o tomadas sin el problema delante."
    pistas:
      - { texto: "«Voy a hacer algo con este chip» es empezar por el componente." }
    escalera:
      - "Sin puntos de prueba, ¿qué cuesta más?"
    solucion: "Componente: no resuelve nada. Sin especificación: no termina. Consumo tarde: no hay autonomía. Sin depuración: diez veces más."

  - id: pregunta-lista
    tipo: pregunta
    titulo: "La lista de validación"
    texto: "La validación final usa una lista derivada de la especificación: cada línea, una medida con su valor esperado y su resultado. ¿Para qué sirve después?"
    libro: [71]
    widget:
      tipo: figura
      figura: fig-48.11
      zonas:
        - { id: e6, rotulo: "Abajo a la derecha", rect: [313, 73, 133, 54] }
    opciones:
      - texto: "Para comparar con cómo era cuando funcionaba si falla dentro de un año"
        bien: true
        porque: "Además demuestra que el proyecto está terminado."
      - texto: "Para nada: una vez validado, se puede tirar"
        porque: "Es justo la referencia que hace falta cuando el aparato falle."
      - texto: "Solo para calcular el coste"
        porque: "La lista recoge medidas, no precios."
    escalera:
      - "Si el aparato deja de ir bien, ¿con qué se comparan las medidas nuevas?"
    solucion: "Demuestra que está terminado y es la referencia para diagnosticarlo más tarde."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [39, 42, 64, 69]
    ideas:
      - { titulo: "De lo abstracto a lo concreto.", texto: "Especificación, bloques, componentes, esquema, prototipo y placa." }
      - { titulo: "Con números.", texto: "Cada cifra de la especificación elimina opciones." }
      - { titulo: "La alimentación, pronto.", texto: "Se diseña en el diagrama de bloques, no al terminar." }
      - { titulo: "El tiempo.", texto: "Diseño ¼, montaje ¼, depuración y validación ½." }
