# «Consolas por dentro» · PlayStation 4: buses y decodificación. La CPU decodifica ella misma y saca una selección por
# chip (~CS2 BIOS, ~CS4 SPU, ~CS5 CD, ~CS7 GPU: redes del esquema de pu-18); la RAM va por su propio bus y se repite
# en los primeros 8 MB; la BIOS, de 8 bits. Fuentes: los datos de la consola (ps1#n: explorador, decodificador de la
# arquitectura con el mapa de psx-spx, Copetti).
leccion: consola-ps1/ps1-buses

libro:
  "ps1#2": "una selección por chip: ~CS2 para la BIOS, ~CS4 para la SPU, ~CS5 para el CD y ~CS7 para la GPU"
  "ps1#3": "2 MB de DRAM EDO en cuatro chips de 8 bits: juntos dan el bus de 32 bits de la CPU"
  "ps1#94": "Decodificador, lectura en $BFC00000: BIOS (512 KB)"
  "ps1#96": "$00345678 es $00145678"
  "ps1#97": "Decodificador, escritura en $1F801810: GPU: GP0."
  "ps1#98": "Decodificador, escritura en $1F801C00: SPU."
  "ps1#99": "Decodificador, lectura en $1F801800: Controlador del CD."
  "ps1#115": "La BIOS tiene 512 KB en un bus de 8 bits"

modelo:
  valores:
    n_c: { sim: "n", nombre: "chips de RAM", unidad: "", valor: 4 }
    b_c: { sim: "b", nombre: "bits de datos de cada chip", unidad: "", valor: 8 }
  calculos:
    b_bus: { expr: "n_c*b_c", sim: "b_{bus}", nombre: "bits del bus de la RAM", unidad: "", cifras: 2 }

tarjetas:
  - id: explore-selecciones
    tipo: explorar
    titulo: "Una selección por chip"
    texto: "La CPU baja ~CS2, ~CS4, ~CS5 o ~CS7 según la dirección. Toque los cuatro chips que eligen."
    libro: ["ps1#2"]
    widget:
      tipo: figura
      consola: { maquina: ps1 }
      recorte: [280, 300, 1160, 560]
      ampliar: 1.3
      zonas:
        - { id: bios, hotspot: bios, rotulo: "BIOS", texto: "~CS2." }
        - { id: spu, hotspot: spu, rotulo: "SPU", texto: "~CS4." }
        - { id: cdc, hotspot: cdc, rotulo: "CD", texto: "~CS5." }
        - { id: gpu, hotspot: gpu, rotulo: "GPU", texto: "~CS7." }
    objetivo:
      condiciones:
        - { zona: bios, rotulo: "BIOS" }
        - { zona: spu, rotulo: "SPU" }
        - { zona: cdc, rotulo: "CD" }
        - { zona: gpu, rotulo: "GPU" }
      logrado: "Cada uno con su selección: no hay decodificador fuera de la CPU."

  - id: toque-quien
    tipo: tocar
    titulo: "¿Quién decodifica?"
    texto: "Toque el chip que decide, para cada dirección, qué selección baja."
    libro: ["ps1#2"]
    widget:
      tipo: figura
      consola: { maquina: ps1 }
      recorte: [280, 300, 900, 700]
      ampliar: 1.3
      zonas:
        - { id: cpu, hotspot: cpu, rotulo: "Chip cuadrado grande, abajo" }
        - { id: gpu, hotspot: gpu, rotulo: "Chip cuadrado grande, arriba" }
        - { id: bios, hotspot: bios, rotulo: "Chip alargado, en el centro" }
    tocar:
      bien: [cpu]
      porque:
        gpu: "La GPU recibe ~CS7; no decide."
        bios: "La BIOS recibe ~CS2."
    exito: "La CPU: decodifica dentro y saca una selección por chip."
    escalera:
      - "No hay ningún chip de lógica suelto: lo hace un chip grande."
    solucion: "La CPU, IC103."

  - id: toque-gp0
    tipo: tocar
    titulo: "$1F801810"
    texto: "La CPU escribe en $1F801810. Toque el chip que la recibe."
    libro: ["ps1#97"]
    widget:
      tipo: figura
      consola: { maquina: ps1 }
      recorte: [280, 300, 1160, 560]
      ampliar: 1.3
      zonas:
        - { id: gpu, hotspot: gpu, rotulo: "Chip cuadrado grande, a la izquierda" }
        - { id: spu, hotspot: spu, rotulo: "Chip cuadrado, a la derecha" }
        - { id: cdc, hotspot: cdc, rotulo: "Chip cuadrado, a la derecha del todo" }
    tocar:
      bien: [gpu]
      porque:
        spu: "La SPU está en $1F801C00."
        cdc: "El CD está en $1F801800."
    exito: "La GPU, por GP0: ~CS7 baja su /CS."
    escalera:
      - "Pruebe la dirección en el decodificador de «Arquitectura»."
    solucion: "La GPU."

  - id: ordene-mapa
    tipo: tocar
    fase: "Ordene"
    titulo: "Tres direcciones"
    texto: "Toque, por orden, quién contesta en $BFC00000, $1F801800 y $1F801C00."
    libro: ["ps1#94", "ps1#99", "ps1#98"]
    widget:
      tipo: figura
      consola: { maquina: ps1 }
      recorte: [600, 300, 860, 560]
      ampliar: 1.3
      zonas:
        - { id: bios, hotspot: bios, rotulo: "Chip alargado, a la izquierda" }
        - { id: cdc, hotspot: cdc, rotulo: "Chip cuadrado, a la derecha" }
        - { id: spu, hotspot: spu, rotulo: "Chip cuadrado, en el centro" }
        - { id: vram, hotspot: vram, rotulo: "Chip cuadrado, arriba a la izquierda" }
    tocar:
      bien: [bios, cdc, spu]
      orden: true
      porque:
        vram: "La VRAM no está en el mapa de la CPU: solo la ve la GPU."
    pistas:
      - { texto: "BIOS, controlador del CD y SPU." }
    exito: "BIOS (~CS2), controlador del CD (~CS5) y SPU (~CS4)."
    escalera:
      - "Use el decodificador de «Arquitectura»."
    solucion: "BIOS, CD y SPU."

  - id: leer-bus
    tipo: leer
    titulo: "Cuatro chips, un bus"
    texto: "La RAM son cuatro chips de 8 bits. Escriba cuántos bits tiene el bus de la RAM."
    libro: ["ps1#3"]
    widget:
      tipo: figura
      consola: { maquina: ps1 }
      recorte: [0, 560, 340, 440]
      ampliar: 1.2
      zonas:
        - { id: ram, hotspot: ram, rotulo: "RAM principal" }
    leer:
      objetivo: b_bus
      unidad: ""
      tol: 0.001
      rotulo: "Bits del bus"
      errores:
        - { expr: "b_c", texto: "Esos son los de un chip: los cuatro trabajan a la vez." }
    exito: "32 bits: cada chip da un byte de la palabra, con su propia /CAS."
    escalera:
      - "4 × 8."
    solucion: "4 × 8 = 32 bits."
    comprobar:
      - { con: { n_c: 4, b_c: 8 }, b_bus: 32 }

  - id: por-que-espejo
    tipo: porque
    titulo: "La misma RAM en otro sitio"
    texto: "Leer en $00345678 da lo mismo que leer en $00145678. ¿Por qué?"
    libro: ["ps1#96", "ps1#3"]
    widget:
      tipo: figura
      consola: { maquina: ps1 }
      recorte: [0, 560, 340, 440]
      ampliar: 1.2
      zonas:
        - { id: ram, hotspot: ram, rotulo: "RAM principal" }
    opciones:
      - texto: "Los 2 MB se repiten en los primeros 8 MB del mapa."
        bien: true
        porque: "La CPU no mira los bits de más: la RAM aparece varias veces."
      - texto: "Hay otra RAM en esa dirección."
        porque: "Solo hay 2 MB: es la misma RAM, repetida."
      - texto: "La BIOS copia los datos allí."
        porque: "No hay copia: es la misma posición de la misma RAM."
    escalera:
      - "Reste las dos direcciones."
    solucion: "Es un espejo de la misma RAM."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: ["ps1#2", "ps1#3", "ps1#96", "ps1#115"]
    ideas:
      - { titulo: "La CPU decodifica.", texto: "Una selección por chip: ~CS2, ~CS4, ~CS5, ~CS7." }
      - { titulo: "La RAM aparte.", texto: "Su propio bus de 32 bits." }
      - { titulo: "Espejos.", texto: "La RAM se repite en los primeros 8 MB." }
      - { titulo: "La BIOS.", texto: "512 KB en un bus de 8 bits." }
