# «Consolas por dentro» · PlayStation 1: la placa PU-18 de un vistazo, sobre el escaneo de la placa de una SCPH-5502
# (Antoinebercovici, Wikimedia Commons, CC BY-SA 4.0; recuadros llevados desde la PCB de pu-18). La CPU con sus cuatro
# RAM, la GPU con su VRAM, la SPU, el CD repartido en varios chips y la otra cara. Fuentes: los datos de la consola
# (ps1#n) y psdevwiki (hechos externos del manifiesto).
leccion: consola-ps1/ps1-placa

libro:
  "ps1#2": "Un núcleo compatible con el MIPS R3000A a 33,8688 MHz"
  "ps1#3": "2 MB de DRAM EDO en cuatro chips de 8 bits"
  "ps1#5": "Dibuja triángulos, rectángulos y líneas en la VRAM"
  "ps1#6": "El cuadro que se ve, el que se dibuja y las texturas, en 1 MB"
  "ps1#9": "24 voces ADPCM de 16 bits a 44,1 kHz"
  "ps1#12": "Recibe los datos del disco del DSP"
  "ps1#14": "Demodula la señal del disco"
  "ps1#27": "Gobierna el lector: lee el subcódigo del disco, la tapa (S301)"
  "ps1#1": "PU-18 (1-664-537-62) de una SCPH-5502 PAL"
  "ps1#109": "La PU-20 junta el DSP, el controlador del CD y su RAM en un CXD1817R"
  "ps1#106": "La PU-18 es la placa de las SCPH-550X, la SCPH-5552 y las primeras SCPH-700X y SCPH-750X."

modelo:
  valores: {}
  calculos: {}

tarjetas:
  - id: explore-chips
    tipo: explorar
    titulo: "Los chips grandes"
    texto: "Toque la CPU, la GPU, la SPU y el controlador del CD para leer qué hace cada uno."
    libro: ["ps1#2", "ps1#5", "ps1#9", "ps1#12"]
    widget:
      tipo: figura
      consola: { maquina: ps1 }
      recorte: [280, 300, 1160, 700]
      ampliar: 1.3
      zonas:
        - { id: cpu, hotspot: cpu, rotulo: "CPU", texto: "R3000A a 33,8688 MHz." }
        - { id: gpu, hotspot: gpu, rotulo: "GPU", texto: "Triángulos, rectángulos y líneas en la VRAM." }
        - { id: spu, hotspot: spu, rotulo: "SPU", texto: "24 voces a 44,1 kHz." }
        - { id: cdc, hotspot: cdc, rotulo: "Controlador del CD", texto: "Los datos del disco, por sectores." }
    objetivo:
      condiciones:
        - { zona: cpu, rotulo: "CPU" }
        - { zona: gpu, rotulo: "GPU" }
        - { zona: spu, rotulo: "SPU" }
        - { zona: cdc, rotulo: "CD" }
      logrado: "Los ha tocado todos: lea sus fichas."

  - id: toque-vram
    tipo: tocar
    titulo: "La memoria de la GPU"
    texto: "La GPU dibuja en su propia memoria. Toque esa memoria."
    libro: ["ps1#6", "ps1#5", "ps1#3"]
    widget:
      tipo: figura
      consola: { maquina: ps1 }
      recorte: [0, 241, 986, 806]
      ampliar: 1.1
      zonas:
        - { id: vram, hotspot: vram, rotulo: "Chip cuadrado, a la derecha de la GPU" }
        - { id: ram, hotspot: ram, rotulo: "Cuatro chips alargados, a la izquierda" }
        - { id: bios, hotspot: bios, rotulo: "Chip alargado, abajo en el centro" }
        - { id: gpu, hotspot: gpu, rotulo: "Chip cuadrado grande, arriba" }
    tocar:
      bien: [vram]
      porque:
        ram: "Es la RAM principal de la CPU: 2 MB en cuatro chips."
        bios: "Es la BIOS, una ROM."
        gpu: "Es la GPU: dibuja, pero no guarda el cuadro dentro."
    exito: "La VRAM: el cuadro que se ve, el que se dibuja y las texturas, en 1 MB."
    escalera:
      - "Está pegada a la GPU."
    solucion: "IC201, a la derecha de la GPU."

  - id: toque-ram
    tipo: tocar
    titulo: "Cuatro iguales"
    texto: "Toque la memoria principal de la CPU."
    libro: ["ps1#3", "ps1#2"]
    widget:
      tipo: figura
      consola: { maquina: ps1 }
      recorte: [0, 300, 800, 700]
      ampliar: 1.3
      zonas:
        - { id: ram, hotspot: ram, rotulo: "Cuatro chips alargados, a la izquierda" }
        - { id: cpu, hotspot: cpu, rotulo: "Chip cuadrado grande, abajo" }
        - { id: vram, hotspot: vram, rotulo: "Chip cuadrado, a la derecha" }
    tocar:
      bien: [ram]
      porque:
        cpu: "Es la CPU: usa la RAM, no la contiene."
        vram: "Es la VRAM, de la GPU."
    exito: "2 MB de DRAM EDO en cuatro chips de 8 bits: juntos, la palabra de 32 bits de la CPU."
    escalera:
      - "Son cuatro chips iguales."
    solucion: "IC106 a IC109."

  - id: ordene-cd
    tipo: tocar
    fase: "Ordene"
    titulo: "Del disco a la CPU"
    texto: "Toque, por orden: el chip que demodula la señal del disco, el controlador que guarda los sectores y la CPU."
    libro: ["ps1#14", "ps1#12", "ps1#2"]
    widget:
      tipo: figura
      consola: { maquina: ps1 }
      recorte: [300, 440, 1200, 640]
      ampliar: 1.3
      zonas:
        - { id: dsp, hotspot: dsp, rotulo: "Chip cuadrado, abajo a la derecha" }
        - { id: cdc, hotspot: cdc, rotulo: "Chip cuadrado, a la derecha" }
        - { id: cpu, hotspot: cpu, rotulo: "Chip cuadrado grande, a la izquierda" }
        - { id: spu, hotspot: spu, rotulo: "Chip cuadrado, en el centro" }
    tocar:
      bien: [dsp, cdc, cpu]
      orden: true
      porque:
        spu: "La SPU recibe el audio del CD, pero los datos van a la CPU."
    pistas:
      - { texto: "CXD2545Q, CXD1815Q y la CPU." }
    exito: "DSP, controlador con su SRAM y CPU, por el bus de sistema."
    escalera:
      - "Empiece por el chip junto a los conectores del lector."
    solucion: "IC701, IC305 y IC103."

  - id: toque-otra-cara
    tipo: tocar
    titulo: "La otra cara"
    texto: "Dé la vuelta a la placa. Toque el microcontrolador que gobierna el lector."
    libro: ["ps1#27"]
    widget:
      tipo: figura
      consola: { maquina: ps1, foto: cara-b }
      recorte: [0, 178, 1600, 1028]
      ampliar: 2.5
      zonas:
        - { id: mech, hotspot: b-mech, rotulo: "Chip cuadrado, a la izquierda" }
        - { id: motor, hotspot: b-motor, rotulo: "Chip alargado, abajo" }
        - { id: enc, hotspot: b-enc, rotulo: "Chip alargado, arriba a la derecha" }
    tocar:
      bien: [mech]
      porque:
        motor: "Es el BA6392FP, el driver de los motores."
        enc: "Es el CXA1645, el codificador de vídeo."
    exito: "El 68HC05: lee el subcódigo del disco, la tapa y el final de carrera, y enciende el láser."
    escalera:
      - "Es el único chip cuadrado de esta cara."
    solucion: "IC304, el MC68HC05G6."

  - id: prediga-modelos
    tipo: predecir
    titulo: "¿Qué consolas?"
    texto: "Esta placa PU-18 salió de una SCPH-5502 europea. ¿En qué modelos se usa la PU-18?"
    libro: ["ps1#106", "ps1#1", "ps1#109"]
    widget:
      tipo: figura
      consola: { maquina: ps1 }
      recorte: [600, 820, 600, 200]
      zonas:
        - { id: dsp, hotspot: dsp, rotulo: "Junto a «PU-18»" }
    opciones:
      - texto: "Las SCPH-550X, la SCPH-5552 y las primeras SCPH-700X y SCPH-750X."
        bien: true
        porque: "Según psdevwiki, esas son las de la PU-18."
      - texto: "Solo en la SCPH-5502."
        porque: "Es la misma placa para la serie SCPH-550X y otras."
      - texto: "En todas las PlayStation."
        porque: "Hubo muchas placas: PU-16, PU-18, PU-20, PU-22…"
    escalera:
      - "Busque «PU-18» en la serigrafía: es la misma para varios modelos."
    solucion: "SCPH-550X, SCPH-5552 y las primeras SCPH-700X y SCPH-750X."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: ["ps1#2", "ps1#5", "ps1#9", "ps1#12"]
    ideas:
      - { titulo: "La CPU y su RAM.", texto: "R3000A con 2 MB en cuatro chips." }
      - { titulo: "La GPU y su VRAM.", texto: "1 MB solo para ella." }
      - { titulo: "La SPU.", texto: "24 voces y el audio del CD." }
      - { titulo: "El CD.", texto: "DSP, controlador y, por debajo, un 68HC05." }
