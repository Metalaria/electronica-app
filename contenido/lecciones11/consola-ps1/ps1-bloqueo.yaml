# «Consolas por dentro» · PlayStation 6: el lector y la protección. No hay chip de bloqueo en un cartucho: el disco
# lleva en su índice un surco ondulado con la región (SCEA, SCEE o SCEI) que las grabadoras no reproducen, y el 68HC05
# del lector lo comprueba al arrancar. El lector: DSP con los servos, RF, el único potenciómetro y la tapa. Fuentes:
# Copetti y psdevwiki (hechos externos del manifiesto) y los datos de la consola (ps1#n).
leccion: consola-ps1/ps1-bloqueo

libro:
  "ps1#14": "Demodula la señal del disco y lleva los servos de foco, seguimiento, carro y giro"
  "ps1#15": "RV703 es el único potenciómetro de la placa"
  "ps1#22": "Avisa al microcontrolador del CD (el 68HC05, en la otra cara) de que la tapa está abierta."
  "ps1#27": "Hace también la comprobación de protección del disco."
  "ps1#107": "ajusta el foco sola, deja un solo potenciómetro (RV703)"
  "ps1#111": "un surco ondulado con una de tres cadenas de región, SCEA (América), SCEE (Europa) o SCEI (Japón), que las grabadoras normales no pueden reproducir"
  "ps1#112": "La comprobación del disco se hace una vez, al arrancar; los modchips imitaban la señal del surco."
  "ps1#113": "El subprocesador del CD es un Motorola 68HC05 con 512 B de RAM y 16 KB de ROM, y se encarga de la protección contra copias."
  "cap29#37": "las variables solo valen 0 o 1"

modelo:
  valores: {}
  calculos: {}

tarjetas:
  - id: explore-arranca
    tipo: explorar
    titulo: "Cuándo arranca un disco"
    texto: "El juego arranca si el disco lleva el surco con la región y esa región es la de la consola. Consiga que arranque."
    libro: ["ps1#111", "ps1#112"]
    widget:
      tipo: logica
      entradas: [{ id: SURCO, rotulo: "El disco lleva el surco" }, { id: REGION, rotulo: "La región coincide" }]
      piezas:
        - { id: y1, tipo: and, entradas: [SURCO, REGION] }
      salidas:
        - { id: ARRANCA, de: y1 }
      tabla: true
    objetivo:
      condiciones:
        - { led: ARRANCA, valor: 1, rotulo: "El juego arranca" }
      logrado: "Las dos: una copia grabada no tiene el surco, y un disco de otra región lleva otra cadena."
      pistas:
        - { cuando: { led: ARRANCA, valor: 0 }, texto: "Hace falta un disco original de la misma región." }
    escalera:
      - "Surco y región, a la vez."
    solucion: "Disco con surco y de la misma región."

  - id: tabla-disco
    tipo: tabla
    titulo: "La tabla del disco"
    texto: "Rellene cuándo arranca el juego (1) y cuándo no (0)."
    libro: ["ps1#111", "cap29#37"]
    widget:
      tipo: logica
      entradas: [{ id: SURCO, rotulo: "El disco lleva el surco" }, { id: REGION, rotulo: "La región coincide" }]
      piezas:
        - { id: y1, tipo: and, entradas: [SURCO, REGION] }
      salidas:
        - { id: ARRANCA, de: y1 }
      ocultar: true
    tabla:
      salidas: [ARRANCA]
    exito: "Una fila de cuatro. La comprobación se hace una vez, al arrancar."
    escalera:
      - "Si falta cualquiera de las dos, no arranca."
    solucion: "ARRANCA vale 1 solo con surco y región."

  - id: toque-mech
    tipo: tocar
    titulo: "Quién comprueba"
    texto: "Dé la vuelta a la placa. Toque el chip que hace la comprobación del disco."
    libro: ["ps1#27", "ps1#113"]
    widget:
      tipo: figura
      consola: { maquina: ps1, foto: cara-b }
      recorte: [0, 178, 1600, 1028]
      ampliar: 2.5
      zonas:
        - { id: mech, hotspot: b-mech, rotulo: "Chip cuadrado, a la izquierda" }
        - { id: enc, hotspot: b-enc, rotulo: "Chip alargado, arriba a la derecha" }
        - { id: motor, hotspot: b-motor, rotulo: "Chip alargado, abajo" }
    tocar:
      bien: [mech]
      porque:
        enc: "Es el codificador de vídeo."
        motor: "Es el driver de los motores: mueve, no comprueba."
    exito: "El 68HC05: un microcontrolador con su propia ROM que se encarga de la protección."
    escalera:
      - "Es un microcontrolador, el único chip cuadrado de esta cara."
    solucion: "IC304, el MC68HC05G6."

  - id: ordene-lector
    tipo: tocar
    fase: "Ordene"
    titulo: "Del láser a los datos"
    texto: "Toque, por orden: el conector de la cabeza óptica, el amplificador de su señal y el DSP que la demodula."
    libro: ["ps1#14", "ps1#15"]
    widget:
      tipo: figura
      consola: { maquina: ps1 }
      recorte: [993, 833, 575, 408]
      ampliar: 1.6
      zonas:
        - { id: cd, hotspot: cd, rotulo: "Conectores, abajo" }
        - { id: rf, hotspot: rf, rotulo: "Chips pequeños, a la derecha" }
        - { id: dsp, hotspot: dsp, rotulo: "Chip cuadrado" }
    tocar:
      bien: [cd, rf, dsp]
      orden: true
    pistas:
      - { texto: "CN702, el CXA1791N y el CXD2545Q." }
    exito: "Cabeza (CN702), amplificador de RF y DSP, que además lleva los servos."
    escalera:
      - "Empiece por el conector ancho de 16 contactos."
    solucion: "CN702, IC703 e IC701."

  - id: toque-tapa
    tipo: tocar
    titulo: "La tapa"
    texto: "Toque la pieza que avisa de que la tapa del CD está abierta."
    libro: ["ps1#22"]
    widget:
      tipo: figura
      consola: { maquina: ps1 }
      recorte: [760, 240, 400, 300]
      ampliar: 1.4
      zonas:
        - { id: tapa, hotspot: tapa, rotulo: "Conector blanco" }
        - { id: spuram, hotspot: spuram, rotulo: "Chip alargado" }
    tocar:
      bien: [tapa]
      porque:
        spuram: "Es la RAM de la SPU."
    exito: "S301, junto a la serigrafía «DOOR»: lo lee el 68HC05."
    escalera:
      - "Busque «DOOR» en la serigrafía."
    solucion: "S301."

  - id: por-que-pot
    tipo: porque
    titulo: "Un solo potenciómetro"
    texto: "La PU-18 deja un solo potenciómetro, RV703. ¿Por qué no hacen falta más?"
    libro: ["ps1#107", "ps1#15"]
    widget:
      tipo: figura
      consola: { maquina: ps1 }
      recorte: [1300, 860, 260, 220]
      zonas:
        - { id: rf, hotspot: rf, rotulo: "RV703 y el amplificador de RF" }
    opciones:
      - texto: "Porque la PU-18 ajusta el foco sola."
        bien: true
        porque: "Frente a la PU-16, la PU-18 ajusta el foco sola y deja un solo potenciómetro, RV703."
      - texto: "Porque el láser no se puede ajustar."
        porque: "RV703 es precisamente un ajuste del servo."
      - texto: "Porque el 68HC05 sustituye al DSP."
        porque: "El DSP sigue ahí: el CXD2545Q, con los servos dentro."
    escalera:
      - "Compare con la PU-16."
    solucion: "Ajusta el foco sola."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: ["ps1#111", "ps1#112", "ps1#113", "ps1#14"]
    ideas:
      - { titulo: "El surco.", texto: "La región va en el disco: SCEA, SCEE o SCEI." }
      - { titulo: "Al arrancar.", texto: "La comprobación se hace una vez." }
      - { titulo: "El 68HC05.", texto: "Gobierna el lector y la protección." }
      - { titulo: "El lector.", texto: "Cabeza, RF, DSP con servos y un solo potenciómetro." }
