# Lección 1.2 de la sección 19.7 «El Puente hacia los Sistemas Reales» (cap20; sec-20.N = impresas 19.(N − 1)).
# - El orden de diseño de un sistema y los tres errores más caros de la figura 19.12 (fig-20.13), con zonas.
# - Sin modelo de circuito: la sección es de método.
# Paso práctico: «tocar» en la figura 19.12 los pasos que distinguen un sistema de una colección de circuitos.
# 1.2.1 (autor121-sens, «aprender haciendo», GUIA §13): en los seis pasos de la figura 19.13 se tocan el que va al
# final, el que define las interfaces, el que no debe dejarse para el final, el que evita diagnosticar a ciegas y los
# tres que distinguen un sistema (zonas ampliadas a 35 px de alto). Los tres errores y la cadena de efectos pasan a los
# «exito» y al resumen. Queda una pregunta de opciones: la actitud.
leccion: cap20/sec-20.8

libro:
  174: "este es el punto en que se convierten en aparatos"
  176: "La mayoría de los fallos de un sistema están en las fronteras entre sus partes, no dentro de ellas"
  177: "en lugar de «los 5 V»"
  179: "qué hace el sistema cuando algo se rompe"
  182: "la alimentación condiciona el consumo, el ruido, el tamaño, el calor y la seguridad"
  183: "cuesta diez veces más de diagnosticar"
  184: "son donde falla lo que se ha construido bien"
  187: "Y solo entonces, el circuito de cada bloque."
  188: "Los pasos 3, 4 y 5 son los que distinguen un sistema de una colección de circuitos"
  191: "una decisión de alimentación afecta al ruido, el ruido afecta a la resolución, la resolución afecta a la elección del sensor"
  194: "un número medido vale más que uno calculado"
  195: "entender el mecanismo sirve para el que no lo estaba"
  199: "El orden de diseño de un sistema"

modelo: { valores: {}, calculos: {} }

tarjetas:
  - id: explore-orden
    tipo: explorar
    titulo: "Del circuito al aparato"
    texto: "Al construir un sistema aparecen interfaces, alimentación de verdad y fallos. Toque los pasos del diseño y los tres errores."
    libro: [174, 179, 199]
    widget:
      tipo: figura
      figura: fig-20.13
      zonas:
        - { id: p1, rotulo: "Primer paso", rect: [20, 1, 160, 35], texto: "Qué tiene que hacer, con números." }
        - { id: p3, rotulo: "Tercer paso", rect: [20, 71, 160, 35], texto: "Cómo se alimenta cada bloque: la alimentación como subsistema, en lugar de «los 5 V»." }
        - { id: p4, rotulo: "Cuarto paso", rect: [20, 106, 160, 35], texto: "Qué pasa si falla cada uno: qué hace el sistema cuando algo se rompe." }
        - { id: p6, rotulo: "Sexto paso", rect: [20, 177, 160, 35], texto: "Y solo entonces, el circuito de cada bloque." }
        - { id: errores, rotulo: "Recuadro rojo de la derecha", rect: [273, 5, 178, 203], texto: "Los tres errores que más veces se pagan." }
    requiere: { mover: [p1, p6, errores] }

  - id: ordene-pasos
    tipo: tocar
    titulo: "El orden que funciona"
    texto: "En el orden que funciona hay un paso que va al final, cuando todo lo demás está decidido. Tóquelo."
    libro: [187, 199]
    widget:
      tipo: figura
      figura: fig-20.13
      zonas:
        - { id: p1, rotulo: "Primer paso", rect: [20, 1, 160, 35] }
        - { id: p2, rotulo: "Segundo paso", rect: [20, 36, 160, 35] }
        - { id: p3, rotulo: "Tercer paso", rect: [20, 71, 160, 35] }
        - { id: p4, rotulo: "Cuarto paso", rect: [20, 106, 160, 35] }
        - { id: p5, rotulo: "Quinto paso", rect: [20, 142, 160, 35] }
        - { id: p6, rotulo: "Sexto paso", rect: [20, 177, 160, 35] }
    tocar:
      bien: [p6]
      porque:
        p1: "Qué tiene que hacer, con números: es lo primero."
        p2: "Repartir en bloques va al principio: define las interfaces."
        p3: "La alimentación se decide pronto: dejarla para el final es el error más caro."
        p4: "Qué pasa si falla cada bloque se decide antes de dibujar circuitos."
        p5: "Cómo se prueba se prevé antes de construir."
    exito: "Y solo entonces, el circuito de cada bloque: números, bloques, alimentación, fallos, prueba y circuitos."
    escalera:
      - "¿Qué se suele empezar a hacer, y debería ir lo último?"
    solucion: "El sexto, el circuito de cada bloque."

  - id: toque-sistema
    tipo: tocar
    titulo: "Lo que hace un sistema"
    texto: "Toque los pasos que distinguen un sistema de una colección de circuitos, y que más se saltan."
    libro: [188]
    widget:
      tipo: figura
      figura: fig-20.13
      zonas:
        - { id: p1, rotulo: "Primer paso", rect: [20, 1, 160, 35] }
        - { id: p2, rotulo: "Segundo paso", rect: [20, 36, 160, 35] }
        - { id: p3, rotulo: "Tercer paso", rect: [20, 71, 160, 35] }
        - { id: p4, rotulo: "Cuarto paso", rect: [20, 106, 160, 35] }
        - { id: p5, rotulo: "Quinto paso", rect: [20, 142, 160, 35] }
        - { id: p6, rotulo: "Sexto paso", rect: [20, 177, 160, 35] }
    tocar:
      bien: [p3, p4, p5]
      todas: true
      porque:
        p1: "Saber qué tiene que hacer es imprescindible, pero también lo hace quien diseña un circuito suelto."
        p2: "Repartir en bloques es necesario; lo que más se salta viene después."
        p6: "El circuito de cada bloque es lo que siempre se hace; lo que distingue un sistema va antes."
    exito: "Alimentación, fallos y prueba: los pasos 3, 4 y 5."
    escalera:
      - "Son tres pasos seguidos, los que van recuadrados en naranja."
    solucion: "Los pasos 3, 4 y 5."

  - id: fronteras
    tipo: tocar
    titulo: "Dónde fallan los sistemas"
    texto: "Bloques que funcionan bien por separado fallan al montarlos: la mayoría de los fallos están en las fronteras. Toque el paso que las define."
    libro: [176, 184, 187]
    widget:
      tipo: figura
      figura: fig-20.13
      zonas:
        - { id: p1, rotulo: "Primer paso", rect: [20, 1, 160, 35] }
        - { id: p2, rotulo: "Segundo paso", rect: [20, 36, 160, 35] }
        - { id: p3, rotulo: "Tercer paso", rect: [20, 71, 160, 35] }
        - { id: p4, rotulo: "Cuarto paso", rect: [20, 106, 160, 35] }
        - { id: p5, rotulo: "Quinto paso", rect: [20, 142, 160, 35] }
        - { id: p6, rotulo: "Sexto paso", rect: [20, 177, 160, 35] }
    tocar:
      bien: [p2]
      porque:
        p1: "Los números dicen qué tiene que hacer, no cómo se unen las partes."
        p3: "La alimentación es una interfaz más, pero el paso que las define todas es otro."
        p4: "Prevé los fallos de cada bloque; las fronteras ya están trazadas."
        p5: "La prueba comprueba las interfaces; no las define."
        p6: "El circuito de cada bloque es lo de dentro, no la frontera."
    exito: "El reparto en bloques y sus interfaces: conectores, cables y protocolos son donde falla lo que se ha construido bien."
    escalera:
      - "¿Qué paso dice qué hay entre los bloques?"
    solucion: "El segundo."

  - id: porque-alimentacion
    tipo: tocar
    titulo: "La alimentación, al principio"
    texto: "Dejar para el final uno de estos pasos es el error más caro: obliga a rehacer. Tóquelo."
    libro: [177, 182]
    widget:
      tipo: figura
      figura: fig-20.13
      zonas:
        - { id: p1, rotulo: "Primer paso", rect: [20, 1, 160, 35] }
        - { id: p2, rotulo: "Segundo paso", rect: [20, 36, 160, 35] }
        - { id: p3, rotulo: "Tercer paso", rect: [20, 71, 160, 35] }
        - { id: p4, rotulo: "Cuarto paso", rect: [20, 106, 160, 35] }
        - { id: p5, rotulo: "Quinto paso", rect: [20, 142, 160, 35] }
        - { id: p6, rotulo: "Sexto paso", rect: [20, 177, 160, 35] }
    tocar:
      bien: [p3]
      porque:
        p1: "Sin números no se empieza, pero no es lo que más se deja para el final."
        p2: "El reparto en bloques suele hacerse; lo que se deja es otra cosa."
        p4: "Los fallos se olvidan, pero el error más caro es otro."
        p5: "No prever la prueba cuesta diez veces más de diagnosticar, pero no es el más caro."
        p6: "El circuito de cada bloque sí va al final."
    exito: "La alimentación: condiciona el consumo, el ruido, el tamaño, el calor y la seguridad. Es un subsistema con raíles y secuencias, no «los 5 V»."
    escalera:
      - "¿Qué paso condiciona el consumo, el ruido y el calor de todo?"
    solucion: "El tercero, la alimentación."

  - id: ordene-cadena
    tipo: tocar
    titulo: "Diagnosticar a ciegas"
    texto: "Un sistema sin puntos de prueba, sin indicadores de estado y sin forma de ver el firmware cuesta diez veces más de diagnosticar. Toque el paso que lo evita."
    libro: [183, 187]
    widget:
      tipo: figura
      figura: fig-20.13
      zonas:
        - { id: p1, rotulo: "Primer paso", rect: [20, 1, 160, 35] }
        - { id: p2, rotulo: "Segundo paso", rect: [20, 36, 160, 35] }
        - { id: p3, rotulo: "Tercer paso", rect: [20, 71, 160, 35] }
        - { id: p4, rotulo: "Cuarto paso", rect: [20, 106, 160, 35] }
        - { id: p5, rotulo: "Quinto paso", rect: [20, 142, 160, 35] }
        - { id: p6, rotulo: "Sexto paso", rect: [20, 177, 160, 35] }
    tocar:
      bien: [p5]
      porque:
        p1: "Los números no prevén cómo se mirará dentro."
        p2: "Los bloques no traen puntos de prueba si nadie los pide."
        p3: "La alimentación no da indicadores de estado."
        p4: "Prever los fallos ayuda, pero ver qué pasa es otro paso."
        p6: "Al dibujar cada circuito ya es tarde para pensar en cómo probarlo."
    exito: "Cómo se prueba y cómo se diagnostica, antes del circuito. Y ninguna parte se trata por separado: la alimentación afecta al ruido, el ruido a la resolución, la resolución al sensor."
    escalera:
      - "¿Qué paso habla de prueba y diagnóstico?"
    solucion: "El quinto."

  - id: actitud
    tipo: pregunta
    titulo: "La actitud que conviene"
    texto: "Un valor calculado y uno medido no coinciden. Según el libro, ¿cuál vale más?"
    libro: [194, 195]
    widget:
      tipo: figura
      figura: fig-20.13
      zonas:
        - { id: pasos, rotulo: "Columna de los pasos", rect: [20, 5, 160, 203] }
    opciones:
      - texto: "El medido; y la discrepancia siempre enseña algo"
        bien: true
        porque: "Medir antes que suponer: por eso casi todas las secciones terminan en el banco."
      - texto: "El calculado, que no tiene errores de instrumento"
        porque: "Un número medido vale más que uno calculado."
      - texto: "Ninguno: hay que repetir hasta que coincidan"
        porque: "La discrepancia no se esconde: es donde está lo que hay que entender."
    escalera:
      - "¿Medir o suponer?"
    solucion: "El medido; la discrepancia entre ambos siempre enseña algo."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [176, 182, 183, 184, 187, 188, 191]
    ideas:
      - { titulo: "Las fronteras.", texto: "La mayoría de los fallos están entre las partes." }
      - { titulo: "El orden.", texto: "Números, bloques, alimentación, fallos, prueba y, al final, circuitos." }
      - { titulo: "Lo que se salta.", texto: "Alimentación, fallos y prueba: lo que hace un sistema." }
      - { titulo: "Los errores.", texto: "Alimentación al final, sin depuración, interfaces subestimadas: el primero es el más caro." }
