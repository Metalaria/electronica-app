# Lección 1.2 de la sección 19.7 «El Puente hacia los Sistemas Reales» (cap20; sec-20.N = impresas 19.(N − 1)).
# - El orden de diseño de un sistema y los tres errores más caros de la figura 19.12 (fig-20.13), con zonas.
# - Sin modelo de circuito: la sección es de método.
# Paso práctico: «tocar» en la figura 19.12 los pasos que distinguen un sistema de una colección de circuitos.
leccion: cap20/sec-20.8

libro:
  174: "este es el punto en que se convierten en aparatos"
  176: "La mayoría de los fallos de un sistema están en las fronteras entre sus partes, no dentro de ellas"
  177: "en lugar de «los 5 V»"
  179: "qué hace el sistema cuando algo se rompe"
  182: "la alimentación condiciona el consumo, el ruido, el tamaño, el calor y la seguridad"
  183: "cuesta diez veces más de diagnosticar"
  184: "son donde falla lo que se ha construido bien"
  187: "Y solo entonces, el circuito de cada bloque."
  188: "Los pasos 3, 4 y 5 son los que distinguen un sistema de una colección de circuitos"
  191: "una decisión de alimentación afecta al ruido, el ruido afecta a la resolución, la resolución afecta a la elección del sensor"
  194: "un número medido vale más que uno calculado"
  195: "entender el mecanismo sirve para el que no lo estaba"
  199: "El orden de diseño de un sistema"

modelo: { valores: {}, calculos: {} }

tarjetas:
  - id: explore-orden
    tipo: explorar
    titulo: "Del circuito al aparato"
    texto: "Al construir un sistema aparecen interfaces, alimentación de verdad y fallos. Toque los pasos del diseño y los tres errores."
    libro: [174, 179, 199]
    widget:
      tipo: figura
      figura: fig-20.13
      zonas:
        - { id: p1, rotulo: "Primer paso", rect: [20, 5, 160, 26], texto: "Qué tiene que hacer, con números." }
        - { id: p3, rotulo: "Tercer paso", rect: [20, 75, 160, 26], texto: "Cómo se alimenta cada bloque: la alimentación como subsistema, en lugar de «los 5 V»." }
        - { id: p4, rotulo: "Cuarto paso", rect: [20, 110, 160, 26], texto: "Qué pasa si falla cada uno: qué hace el sistema cuando algo se rompe." }
        - { id: p6, rotulo: "Sexto paso", rect: [20, 181, 160, 26], texto: "Y solo entonces, el circuito de cada bloque." }
        - { id: errores, rotulo: "Recuadro rojo de la derecha", rect: [273, 5, 178, 203], texto: "Los tres errores que más veces se pagan." }
    requiere: { mover: [p1, p6, errores] }

  - id: ordene-pasos
    tipo: pregunta
    titulo: "El orden que funciona"
    texto: "Ordene los pasos del diseño de un sistema."
    libro: [187]
    widget:
      tipo: figura
      figura: fig-20.13
      zonas:
        - { id: errores, rotulo: "Recuadro rojo de la derecha", rect: [273, 5, 178, 203] }
    ordenar:
      - "Qué tiene que hacer, con números"
      - "Cómo se reparte en bloques, y sus interfaces"
      - "Cómo se alimenta cada bloque"
      - "Qué pasa si falla cada uno"
      - "Cómo se prueba y cómo se diagnostica"
      - "El circuito de cada bloque"
    exito: "El circuito, al final: solo entonces."
    pistas:
      - { texto: "El circuito de cada bloque es lo último." }
    escalera:
      - "Empiece por los números y termine por los circuitos."
    solucion: "Números, bloques, alimentación, fallos, prueba y, al final, circuitos."

  - id: toque-sistema
    tipo: tocar
    titulo: "Lo que hace un sistema"
    texto: "Toque los pasos que distinguen un sistema de una colección de circuitos, y que más se saltan."
    libro: [188]
    widget:
      tipo: figura
      figura: fig-20.13
      zonas:
        - { id: p1, rotulo: "Primer paso", rect: [20, 5, 160, 26] }
        - { id: p2, rotulo: "Segundo paso", rect: [20, 40, 160, 26] }
        - { id: p3, rotulo: "Tercer paso", rect: [20, 75, 160, 26] }
        - { id: p4, rotulo: "Cuarto paso", rect: [20, 110, 160, 26] }
        - { id: p5, rotulo: "Quinto paso", rect: [20, 146, 160, 26] }
        - { id: p6, rotulo: "Sexto paso", rect: [20, 181, 160, 26] }
    tocar:
      bien: [p3, p4, p5]
      todas: true
      porque:
        p1: "Saber qué tiene que hacer es imprescindible, pero también lo hace quien diseña un circuito suelto."
        p2: "Repartir en bloques es necesario; lo que más se salta viene después."
        p6: "El circuito de cada bloque es lo que siempre se hace; lo que distingue un sistema va antes."
    exito: "Alimentación, fallos y prueba: los pasos 3, 4 y 5."
    escalera:
      - "Son tres pasos seguidos, los que van recuadrados en naranja."
    solucion: "Los pasos 3, 4 y 5."

  - id: fronteras
    tipo: predecir
    titulo: "Dónde fallan los sistemas"
    texto: "Un sistema hecho de bloques que funcionan bien por separado falla al montarlo. ¿Dónde es más probable que esté el fallo?"
    libro: [176]
    widget:
      tipo: figura
      figura: fig-20.13
      zonas:
        - { id: pasos, rotulo: "Columna de los pasos", rect: [20, 5, 160, 203] }
    opciones:
      - texto: "En las fronteras entre sus partes"
        bien: true
        porque: "Soldaduras y conectores están entre los primeros sospechosos de la lista universal de averías."
      - texto: "Dentro de los bloques más complejos"
        porque: "La mayoría no está dentro de las partes, sino entre ellas."
      - texto: "En el firmware, siempre"
        porque: "El firmware falla, pero la mayoría de los fallos están en las interfaces."
    escalera:
      - "¿Qué aparece al construir un sistema que en un circuito aislado no existe?"
    solucion: "En las fronteras entre sus partes."

  - id: empareje-errores
    tipo: pregunta
    titulo: "Los tres errores más caros"
    texto: "Empareje cada error con lo que cuesta."
    libro: [182, 183, 184]
    widget:
      tipo: figura
      figura: fig-20.13
      zonas:
        - { id: errores, rotulo: "Recuadro rojo de la derecha", rect: [273, 5, 178, 203] }
    emparejar:
      - ["Dejar la alimentación para el final", "Obliga a rehacer"]
      - ["No prever la depuración", "Diagnosticar cuesta diez veces más"]
      - ["Subestimar las interfaces", "Falla lo que se construyó bien"]
    exito: "El primero es el más caro."
    pistas:
      - { texto: "Sin puntos de prueba ni indicadores, ¿cuánto cuesta saber qué pasa?" }
    escalera:
      - "Empiece por la depuración: es la que habla de diagnosticar."
    solucion: "Alimentación, rehacer; depuración, diez veces más; interfaces, falla lo bien hecho."

  - id: porque-alimentacion
    tipo: porque
    titulo: "La alimentación, al principio"
    texto: "¿Por qué dejar la alimentación para el final es el error más caro?"
    libro: [177, 182]
    widget:
      tipo: figura
      figura: fig-20.13
      zonas:
        - { id: pasos, rotulo: "Columna de los pasos", rect: [20, 5, 160, 203] }
    opciones:
      - texto: "Condiciona consumo, ruido, tamaño, calor y seguridad"
        bien: true
        porque: "Decidirla al terminar cambia todo eso a la vez, y obliga a rehacer."
      - texto: "Porque las fuentes son caras"
        porque: "No es el precio: es todo lo que la alimentación condiciona."
      - texto: "No lo es: basta con «los 5 V»"
        porque: "Es justo el error: la alimentación es un subsistema, con raíles, secuencias y disipación."
    escalera:
      - "¿Cuántas cosas del sistema dependen de la alimentación?"
    solucion: "Condiciona el consumo, el ruido, el tamaño, el calor y la seguridad."

  - id: ordene-cadena
    tipo: pregunta
    titulo: "Nada se trata por separado"
    texto: "Ordene la cadena de efectos de una decisión de alimentación en un proyecto completo."
    libro: [191]
    widget:
      tipo: figura
      figura: fig-20.13
      zonas:
        - { id: pasos, rotulo: "Columna de los pasos", rect: [20, 5, 160, 203] }
    ordenar:
      - "La alimentación"
      - "El ruido"
      - "La resolución"
      - "La elección del sensor"
    exito: "Y esa elección vuelve a afectar a la alimentación: ninguna parte se trata por separado."
    pistas:
      - { texto: "El ruido es lo primero que cambia con la alimentación." }
    escalera:
      - "¿Qué limita la resolución de una medida?"
    solucion: "Alimentación, ruido, resolución y sensor."

  - id: actitud
    tipo: pregunta
    titulo: "La actitud que conviene"
    texto: "Un valor calculado y uno medido no coinciden. Según el libro, ¿cuál vale más?"
    libro: [194, 195]
    widget:
      tipo: figura
      figura: fig-20.13
      zonas:
        - { id: pasos, rotulo: "Columna de los pasos", rect: [20, 5, 160, 203] }
    opciones:
      - texto: "El medido; y la discrepancia siempre enseña algo"
        bien: true
        porque: "Medir antes que suponer: por eso casi todas las secciones terminan en el banco."
      - texto: "El calculado, que no tiene errores de instrumento"
        porque: "Un número medido vale más que uno calculado."
      - texto: "Ninguno: hay que repetir hasta que coincidan"
        porque: "La discrepancia no se esconde: es donde está lo que hay que entender."
    escalera:
      - "¿Medir o suponer?"
    solucion: "El medido; la discrepancia entre ambos siempre enseña algo."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [176, 182, 187, 188]
    ideas:
      - { titulo: "Las fronteras.", texto: "La mayoría de los fallos están entre las partes." }
      - { titulo: "El orden.", texto: "Números, bloques, alimentación, fallos, prueba y, al final, circuitos." }
      - { titulo: "Lo que se salta.", texto: "Alimentación, fallos y prueba: lo que hace un sistema." }
      - { titulo: "Los errores.", texto: "Alimentación al final, sin depuración, interfaces subestimadas." }
