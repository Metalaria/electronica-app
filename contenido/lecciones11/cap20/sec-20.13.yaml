# Lección 1.2 de la sección 19.12 «Criterios Cuantitativos» (cap20; sec-20.N = impresas 19.(N − 1)).
# - Los criterios reunidos en la figura 19.19 (fig-20.20), con zonas por familia y la tabla de buses.
# - Los números: contacto de 2 a 3 veces la corriente de la carga (bloque 317), con una carga de 5 A de ejemplo: de 10
#   a 15 A; vida eléctrica 10⁵ frente a mecánica 10⁷; márgenes (bloques 341 a 344) con un máximo previsto de 24 V de
#   ejemplo: 36 V.
# Sin paso práctico aparte de los números (es una sección de consulta); las estimaciones son de ejemplo.
# 1.2.1 (autor121-sens, «aprender haciendo», GUIA §13): se escriben la corriente de contacto mínima, cuántas veces
# menos dura un relé con carga, la tensión y la corriente de diseño con sus márgenes y cuántas veces más lejos llega
# RS-485 que CAN (tabla 339); en la figura 20.20 se toca la familia cuyo tiempo de respuesta domina. Los números del
# optoacoplador pasan al resumen. Quedan una pregunta de opciones (lo que no está marcado) y ninguna de emparejar.
leccion: cap20/sec-20.13

libro:
  315: "reunidos para consulta"
  317: "2 a 3 veces la nominal de la carga"
  318: "la vida eléctrica es dos órdenes de magnitud menor que la mecánica"
  320: "CTR de diseño: la mitad del mínimo de la hoja"
  321: "Corriente de LED: 5 a 10 mA; más acelera la degradación."
  322: "Velocidad: 10 a 100 kbit/s con fototransistor."
  323: "CMTI: el parámetro decisivo si hay conmutación de potencia al otro lado."
  330: "Tiempo de respuesta, que suele dominar toda la cadena"
  331: "Exactitud, que es el techo del sistema."
  339: "Terminación en ambos extremos"
  341: "Tensión: 50 % sobre el máximo previsto."
  342: "Corriente: el doble."
  343: "Temperatura: 30 °C bajo el límite del componente."
  344: "Vida: la mitad de la especificada."
  347: "ninguno se lee en el encapsulado"
  348: "Criterios cuantitativos de relés, optoacopladores, cristales, sensores y buses."

modelo:
  valores:
    I_ld: { sim: "I_{carga}", nombre: "corriente de la carga, de ejemplo", unidad: A, valor: 5 }
    V_x: { sim: "V_{máx}", nombre: "máximo previsto, de ejemplo", unidad: V, valor: 24 }
    n_e: { sim: "vida eléctrica", nombre: "operaciones de vida eléctrica", unidad: "", valor: 100000 }
    n_m: { sim: "vida mecánica", nombre: "operaciones de vida mecánica", unidad: "", valor: 10000000 }
    I_x: { sim: "I_{máx}", nombre: "corriente máxima prevista, de ejemplo", unidad: A, valor: 3 }
    L_485: { sim: "L", nombre: "alcance de RS-485 a 100 kbit/s", unidad: m, valor: 1200 }
    L_can: { sim: "L", nombre: "alcance de CAN a 1 Mbit/s", unidad: m, valor: 40 }
  calculos:
    I_2: { expr: "2*I_ld", sim: "I", nombre: "el doble de la carga", unidad: A }
    I_3: { expr: "3*I_ld", sim: "I", nombre: "el triple de la carga", unidad: A }
    V_d: { expr: "1.5*V_x", sim: "V", nombre: "tensión de diseño", unidad: V }
    V_e: { expr: "0.5*V_x", sim: "V", nombre: "la mitad del máximo", unidad: V }
    V_2: { expr: "2*V_x", sim: "V", nombre: "el doble del máximo", unidad: V }
    r_v: { expr: "n_m/n_e", sim: "razón", nombre: "vida mecánica entre eléctrica", unidad: "" }
    I_dx: { expr: "2*I_x", sim: "I", nombre: "corriente de diseño", unidad: A }
    r_l: { expr: "L_485/L_can", sim: "razón", nombre: "veces más lejos", unidad: "" }

tarjetas:
  - id: explore-criterios
    tipo: explorar
    titulo: "Los números, reunidos"
    texto: "Los criterios cuantitativos de los componentes del capítulo, para consulta. Toque los relés y la tabla de los buses."
    libro: [315, 348]
    widget:
      tipo: figura
      figura: fig-20.20
      zonas:
        - { id: reles, rotulo: "Primer recuadro", rect: [4, 3, 105, 92], texto: "Relés: el contacto, de 2 a 3 veces la corriente de la carga." }
        - { id: optos, rotulo: "Segundo recuadro", rect: [117, 3, 105, 92], texto: "Optoacopladores: CTR de diseño, la mitad del mínimo de la hoja." }
        - { id: cristales, rotulo: "Tercer recuadro", rect: [231, 3, 105, 92], texto: "Cristales: exactitud de 10 a 50 ppm típica." }
        - { id: sensores, rotulo: "Cuarto recuadro", rect: [345, 3, 105, 92], texto: "Sensores: tiempo de respuesta, exactitud, autocalentamiento e impedancia de salida." }
        - { id: buses, rotulo: "Tabla de abajo", rect: [4, 115, 446, 106], texto: "Los buses, con sus límites reales." }
    requiere: { mover: [reles, buses] }

  - id: contacto
    tipo: leer
    titulo: "El contacto de un relé"
    texto: "Una carga consume 5 A. Con el criterio del libro, escriba la corriente de contacto mínima que conviene para el relé."
    nota: "Carga de ejemplo."
    libro: [317]
    widget:
      tipo: figura
      figura: fig-20.20
      zonas:
        - { id: reles, rotulo: "Primer recuadro", rect: [4, 3, 105, 92], texto: "Relés y contactos." }
    leer:
      objetivo: I_2
      unidad: A
      tol: 0.01
      rotulo: "Corriente de contacto mínima"
      errores:
        - { expr: "I_ld", texto: "Sin margen: el criterio pide de 2 a 3 veces la de la carga." }
        - { expr: "I_3", texto: "Ese es el extremo alto; el mínimo es el doble." }
    exito: "10 A como mínimo, hasta 15: de 2 a 3 veces la nominal de la carga."
    escalera:
      - "Multiplique la corriente de la carga por 2."
    solucion: "2 · 5 A = 10 A."
    comprobar:
      - { I_2: 10, I_3: 15, I_ld: 5 }

  - id: prediga-vida
    tipo: leer
    titulo: "Vida eléctrica y mecánica"
    texto: "Un relé tiene una vida mecánica de 10⁷ operaciones y una eléctrica de 10⁵. Escriba cuántas veces menos dura conmutando su carga."
    libro: [317, 318]
    widget:
      tipo: figura
      figura: fig-20.20
      zonas:
        - { id: reles, rotulo: "Primer recuadro", rect: [4, 3, 105, 92], texto: "Relés y contactos." }
    leer:
      objetivo: r_v
      unidad: ""
      tol: 0.01
      rotulo: "Veces"
    exito: "Cien veces, dos órdenes de magnitud: conmutar bajo carga desgasta mucho más. Y con carga inductiva o en continua, otro orden más."
    escalera:
      - "Divida 10⁷ entre 10⁵."
    solucion: "10⁷ / 10⁵ = 100."
    comprobar:
      - { r_v: 100 }

  - id: sensores
    tipo: tocar
    titulo: "Lo que domina la cadena"
    texto: "En una cadena de medida de temperatura, hay un tiempo que suele dominar lo que tarda en responder todo el sistema. Toque de qué familia es."
    libro: [330, 331]
    widget:
      tipo: figura
      figura: fig-20.20
      zonas:
        - { id: reles, rotulo: "Primer recuadro", rect: [4, 3, 105, 92] }
        - { id: optos, rotulo: "Segundo recuadro", rect: [117, 3, 105, 92] }
        - { id: cristales, rotulo: "Tercer recuadro", rect: [231, 3, 105, 92] }
        - { id: sensores, rotulo: "Cuarto recuadro", rect: [345, 3, 105, 92] }
    tocar:
      bien: [sensores]
      porque:
        reles: "Un relé tarda milisegundos, y en una medida no suele estar."
        optos: "El optoacoplador conmuta en microsegundos."
        cristales: "El reloj marca el ritmo, pero no frena la respuesta."
    exito: "El del sensor, que puede tardar segundos o minutos en seguir la temperatura. Y su exactitud es el techo del sistema."
    escalera:
      - "¿Qué parte puede tardar segundos?"
    solucion: "El cuarto recuadro, los sensores."

  - id: empareje-buses
    tipo: leer
    titulo: "Cada bus, su límite"
    texto: "En la tabla, RS-485 llega a 1 200 m a 100 kbit/s y CAN, a 40 m a 1 Mbit/s. Escriba cuántas veces más lejos llega RS-485."
    libro: [339]
    widget:
      tipo: figura
      figura: fig-20.20
      zonas:
        - { id: buses, rotulo: "Tabla de abajo", rect: [4, 115, 446, 106], texto: "Distancia, velocidad y límite de cada bus." }
    leer:
      objetivo: r_l
      unidad: ""
      tol: 0.01
      rotulo: "Veces"
    exito: "Treinta veces, a una décima parte de la velocidad: CAN cambia longitud por velocidad. I²C se queda en 400 pF; SPI, en una selección por dispositivo; 1-Wire, en sus tiempos; RS-485 pide terminación en ambos extremos."
    escalera:
      - "Divida 1 200 m entre 40 m."
    solucion: "1 200 / 40 = 30."
    comprobar:
      - { r_l: 30 }

  - id: estime-margen
    tipo: leer
    titulo: "El margen de tensión"
    texto: "Un componente verá como mucho 24 V. Con el margen que recomienda el libro, escriba para qué tensión se elige."
    nota: "Máximo de ejemplo."
    libro: [341]
    widget:
      tipo: figura
      figura: fig-20.20
      zonas:
        - { id: todo, rotulo: "Los criterios", rect: [4, 3, 446, 218], texto: "Los criterios, reunidos." }
    leer:
      objetivo: V_d
      unidad: V
      tol: 0.02
      rotulo: "Tensión de diseño"
      errores:
        - { expr: "V_2", texto: "El margen es un 50 % sobre el máximo, no el doble." }
    exito: "36 V: un 50 % sobre el máximo previsto."
    escalera:
      - "El 50 % de 24 V son 12 V."
    solucion: "24 + 12 = 36 V."
    comprobar:
      - { V_d: 36, V_e: 12, V_2: 48, V_x: 24 }

  - id: empareje-margenes
    tipo: leer
    titulo: "El margen de corriente"
    texto: "El mismo componente llevará como mucho 3 A. Escriba la corriente para la que se elige."
    nota: "Máximo de ejemplo."
    libro: [342, 343, 344]
    widget:
      tipo: figura
      figura: fig-20.20
      zonas:
        - { id: todo, rotulo: "Los criterios", rect: [4, 3, 446, 218], texto: "Los criterios, reunidos." }
    leer:
      objetivo: I_dx
      unidad: A
      tol: 0.02
      rotulo: "Corriente de diseño"
      errores:
        - { expr: "1.5*I_x", texto: "El 50 % es el margen de la tensión; el de la corriente es el doble." }
    exito: "6 A, el doble. Y los otros dos márgenes: temperatura, 30 °C bajo el límite del componente; vida, la mitad de la especificada."
    escalera:
      - "Para la corriente, el doble."
    solucion: "2 · 3 A = 6 A."
    comprobar:
      - { I_dx: 6, I_x: 3 }

  - id: porque-no-marcado
    tipo: porque
    titulo: "El parámetro que no está marcado"
    texto: "El CTR real, el rebote de un relé, la capacidad de un bus I²C. ¿Por qué el libro insiste en medirlos?"
    libro: [347]
    widget:
      tipo: figura
      figura: fig-20.20
      zonas:
        - { id: todo, rotulo: "Los criterios", rect: [4, 3, 446, 218] }
    opciones:
      - texto: "Deciden si el componente sirve, y ninguno se lee en el encapsulado"
        bien: true
        porque: "Es la medida que resume el capítulo: comprobar el parámetro que no está marcado."
      - texto: "Porque las hojas de datos mienten"
        porque: "No mienten: dan márgenes amplios; la pieza concreta hay que medirla."
      - texto: "Porque es más rápido que leer la hoja"
        porque: "No es cuestión de rapidez: son datos que la pieza no lleva escritos."
    escalera:
      - "¿Dónde está escrito el CTR de su optoacoplador concreto?"
    solucion: "Son los datos que deciden si el componente sirve, y ninguno se lee en el encapsulado."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [317, 318, 320, 321, 322, 323, 341]
    ideas:
      - { titulo: "Relés.", texto: "Contacto de 2 a 3 veces la carga; vida eléctrica 10⁵ frente a 10⁷." }
      - { titulo: "Optoacopladores.", texto: "La mitad del CTR mínimo, 5 a 10 mA en el LED, 10 a 100 kbit/s, y el CMTI si hay potencia al otro lado." }
      - { titulo: "Márgenes.", texto: "+50 % de tensión, el doble de corriente, 30 °C bajo el límite, la mitad de vida." }
      - { titulo: "Medir.", texto: "Lo que decide si sirve no está en el encapsulado." }
