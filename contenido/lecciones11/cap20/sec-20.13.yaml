# Lección 1.2 de la sección 19.12 «Criterios Cuantitativos» (cap20; sec-20.N = impresas 19.(N − 1)).
# - Los criterios reunidos en la figura 19.19 (fig-20.20), con zonas por familia y la tabla de buses.
# - Los números: contacto de 2 a 3 veces la corriente de la carga (bloque 317), con una carga de 5 A de ejemplo: de 10
#   a 15 A; vida eléctrica 10⁵ frente a mecánica 10⁷; márgenes (bloques 341 a 344) con un máximo previsto de 24 V de
#   ejemplo: 36 V.
# Sin paso práctico aparte de los números (es una sección de consulta); las estimaciones son de ejemplo.
leccion: cap20/sec-20.13

libro:
  315: "reunidos para consulta"
  317: "2 a 3 veces la nominal de la carga"
  318: "la vida eléctrica es dos órdenes de magnitud menor que la mecánica"
  320: "CTR de diseño: la mitad del mínimo de la hoja"
  321: "Corriente de LED: 5 a 10 mA; más acelera la degradación."
  322: "Velocidad: 10 a 100 kbit/s con fototransistor."
  323: "CMTI: el parámetro decisivo si hay conmutación de potencia al otro lado."
  330: "Tiempo de respuesta, que suele dominar toda la cadena"
  331: "Exactitud, que es el techo del sistema."
  339: "Terminación en ambos extremos"
  341: "Tensión: 50 % sobre el máximo previsto."
  342: "Corriente: el doble."
  343: "Temperatura: 30 °C bajo el límite del componente."
  344: "Vida: la mitad de la especificada."
  347: "ninguno se lee en el encapsulado"
  348: "Criterios cuantitativos de relés, optoacopladores, cristales, sensores y buses."

modelo:
  valores:
    I_ld: { sim: "I_{carga}", nombre: "corriente de la carga, de ejemplo", unidad: A, valor: 5 }
    V_x: { sim: "V_{máx}", nombre: "máximo previsto, de ejemplo", unidad: V, valor: 24 }
    n_e: { sim: "vida eléctrica", nombre: "operaciones de vida eléctrica", unidad: "", valor: 100000 }
    n_m: { sim: "vida mecánica", nombre: "operaciones de vida mecánica", unidad: "", valor: 10000000 }
  calculos:
    I_2: { expr: "2*I_ld", sim: "I", nombre: "el doble de la carga", unidad: A }
    I_3: { expr: "3*I_ld", sim: "I", nombre: "el triple de la carga", unidad: A }
    V_d: { expr: "1.5*V_x", sim: "V", nombre: "tensión de diseño", unidad: V }
    V_e: { expr: "0.5*V_x", sim: "V", nombre: "la mitad del máximo", unidad: V }
    V_2: { expr: "2*V_x", sim: "V", nombre: "el doble del máximo", unidad: V }
    r_v: { expr: "n_m/n_e", sim: "razón", nombre: "vida mecánica entre eléctrica", unidad: "" }

tarjetas:
  - id: explore-criterios
    tipo: explorar
    titulo: "Los números, reunidos"
    texto: "Los criterios cuantitativos de los componentes del capítulo, para consulta. Toque cada familia."
    libro: [315, 348]
    widget:
      tipo: figura
      figura: fig-20.20
      zonas:
        - { id: reles, rotulo: "Primer recuadro", rect: [4, 3, 105, 92], texto: "Relés: el contacto, de 2 a 3 veces la corriente de la carga." }
        - { id: optos, rotulo: "Segundo recuadro", rect: [117, 3, 105, 92], texto: "Optoacopladores: CTR de diseño, la mitad del mínimo de la hoja." }
        - { id: cristales, rotulo: "Tercer recuadro", rect: [231, 3, 105, 92], texto: "Cristales: exactitud de 10 a 50 ppm típica." }
        - { id: sensores, rotulo: "Cuarto recuadro", rect: [345, 3, 105, 92], texto: "Sensores: el tiempo de respuesta suele dominar la cadena; la exactitud es el techo." }
        - { id: buses, rotulo: "Tabla de abajo", rect: [4, 115, 446, 106], texto: "Los buses, con sus límites reales." }
    requiere: { mover: [reles, buses] }

  - id: contacto
    tipo: pregunta
    titulo: "El contacto de un relé"
    texto: "Una carga consume 5 A. ¿Qué corriente de contacto conviene para el relé?"
    nota: "Carga de ejemplo."
    libro: [317]
    widget:
      tipo: figura
      figura: fig-20.20
      zonas:
        - { id: reles, rotulo: "Primer recuadro", rect: [4, 3, 105, 92] }
    opciones:
      - texto: "De 10 a 15 A"
        bien: true
        porque: "De 2 a 3 veces la nominal de la carga."
      - texto: "5 A justos"
        porque: "Sin margen: el criterio pide de 2 a 3 veces la carga."
      - texto: "50 A"
        porque: "Diez veces es desperdiciar; el criterio es de 2 a 3 veces."
    escalera:
      - "Multiplique la corriente de la carga por 2 y por 3."
    solucion: "De 10 a 15 A: 2 a 3 veces los 5 A."
    comprobar:
      - { I_2: 10, I_3: 15, I_ld: 5 }

  - id: prediga-vida
    tipo: predecir
    titulo: "Vida eléctrica y mecánica"
    texto: "Un relé tiene una vida mecánica de 10⁷ operaciones. ¿Cuánto dura conmutando su carga?"
    libro: [317, 318]
    widget:
      tipo: figura
      figura: fig-20.20
      zonas:
        - { id: reles, rotulo: "Primer recuadro", rect: [4, 3, 105, 92] }
    opciones:
      - texto: "Unas 10⁵: dos órdenes de magnitud menos"
        bien: true
        porque: "Y con carga inductiva o en continua puede caer otro orden más."
      - texto: "Las mismas 10⁷"
        porque: "Esa es sin carga; conmutar bajo carga desgasta mucho más."
      - texto: "La mitad, 5 · 10⁶"
        porque: "Cae mucho más: dos órdenes de magnitud."
    escalera:
      - "¿Qué desgasta los contactos que la mecánica sola no?"
    solucion: "Unas 10⁵ operaciones: la vida eléctrica es dos órdenes menor."
    comprobar:
      - { r_v: 100 }

  - id: empareje-optos
    tipo: pregunta
    titulo: "Los números del optoacoplador"
    texto: "Empareje cada criterio del optoacoplador con su valor."
    libro: [320, 321, 322, 323]
    widget:
      tipo: figura
      figura: fig-20.20
      zonas:
        - { id: optos, rotulo: "Segundo recuadro", rect: [117, 3, 105, 92] }
    emparejar:
      - ["CTR de diseño", "La mitad del mínimo de la hoja"]
      - ["Corriente del LED", "De 5 a 10 mA"]
      - ["Velocidad con fototransistor", "De 10 a 100 kbit/s"]
      - ["CMTI", "Decisivo con conmutación de potencia al otro lado"]
    exito: "Más corriente en el LED acelera la degradación."
    pistas:
      - { texto: "La mitad del mínimo es por envejecimiento." }
    escalera:
      - "Empiece por el CTR: ¿con qué valor se diseña?"
    solucion: "CTR, mitad del mínimo; LED, 5 a 10 mA; velocidad, 10 a 100 kbit/s; CMTI, potencia al otro lado."

  - id: sensores
    tipo: pregunta
    titulo: "Lo que domina la cadena"
    texto: "En una cadena de medida con un sensor de temperatura, ¿qué suele dominar el tiempo que tarda en responder todo el sistema?"
    libro: [330, 331]
    widget:
      tipo: figura
      figura: fig-20.20
      zonas:
        - { id: sensores, rotulo: "Cuarto recuadro", rect: [345, 3, 105, 92] }
    opciones:
      - texto: "El tiempo de respuesta del sensor"
        bien: true
        porque: "Suele dominar toda la cadena; la exactitud del sensor, a su vez, es el techo del sistema."
      - texto: "El convertidor"
        porque: "El convertidor es rápido frente a un sensor que tarda segundos en seguir la temperatura."
      - texto: "El microcontrolador"
        porque: "Calcula en microsegundos: no es el cuello de botella."
    escalera:
      - "¿Qué parte puede tardar segundos o minutos?"
    solucion: "El tiempo de respuesta del sensor."

  - id: empareje-buses
    tipo: pregunta
    titulo: "Cada bus, su límite"
    texto: "Empareje cada bus con su límite característico."
    libro: [339]
    widget:
      tipo: figura
      figura: fig-20.20
      zonas:
        - { id: buses, rotulo: "Tabla de abajo", rect: [4, 115, 446, 106] }
    emparejar:
      - ["I²C", "400 pF de capacidad total"]
      - ["SPI", "Una selección por dispositivo"]
      - ["1-Wire", "Temporización estricta"]
      - ["RS-485", "Terminación en ambos extremos"]
      - ["CAN", "Compromiso longitud-velocidad"]
    exito: "RS-485 llega a 1 200 m a 100 kbit/s; CAN, 40 m a 1 Mbit/s."
    pistas:
      - { texto: "El de un solo hilo depende de los tiempos." }
    escalera:
      - "Empiece por I²C: su límite es una capacidad."
    solucion: "I²C, 400 pF; SPI, una selección; 1-Wire, tiempos; RS-485, terminación; CAN, longitud y velocidad."

  - id: estime-margen
    tipo: pregunta
    titulo: "El margen de tensión"
    texto: "Un componente verá como mucho 24 V. Con el margen que recomienda el libro, ¿para qué tensión se elige?"
    nota: "Máximo de ejemplo."
    libro: [341]
    widget:
      tipo: figura
      figura: fig-20.20
      zonas:
        - { id: todo, rotulo: "Los criterios", rect: [4, 3, 446, 218] }
    estimar:
      objetivo: "V_d"
      unidad: V
      min: 0
      max: 60
      paso: 1
      inicio: 50
      tol: 0.03
      rotulo: "Tensión de diseño"
    exito: "36 V: un 50 % sobre el máximo previsto."
    pistas:
      - { cuando: { valor: estimacion, mayor: 37 }, texto: "Demasiado: el margen es un 50 % sobre el máximo, no el doble." }
      - { texto: "Corto: súmele la mitad de 24 V." }
    escalera:
      - "El 50 % de 24 V son 12 V."
    solucion: "24 + 12 = 36 V."
    comprobar:
      - { V_d: 36, V_e: 12, V_2: 48, V_x: 24 }

  - id: empareje-margenes
    tipo: pregunta
    titulo: "Los márgenes que conviene aplicar"
    texto: "Empareje cada magnitud con su margen."
    libro: [341, 342, 343, 344]
    widget:
      tipo: figura
      figura: fig-20.20
      zonas:
        - { id: todo, rotulo: "Los criterios", rect: [4, 3, 446, 218] }
    emparejar:
      - ["Tensión", "50 % sobre el máximo previsto"]
      - ["Corriente", "El doble"]
      - ["Temperatura", "30 °C bajo el límite"]
      - ["Vida", "La mitad de la especificada"]
    exito: "Cuatro márgenes que valen para casi cualquier componente."
    pistas:
      - { texto: "La corriente es la del doble." }
    escalera:
      - "Empiece por la temperatura: es la que va en grados."
    solucion: "Tensión, +50 %; corriente, el doble; temperatura, 30 °C bajo el límite; vida, la mitad."

  - id: porque-no-marcado
    tipo: porque
    titulo: "El parámetro que no está marcado"
    texto: "El CTR real, el rebote de un relé, la capacidad de un bus I²C. ¿Por qué el libro insiste en medirlos?"
    libro: [347]
    widget:
      tipo: figura
      figura: fig-20.20
      zonas:
        - { id: todo, rotulo: "Los criterios", rect: [4, 3, 446, 218] }
    opciones:
      - texto: "Deciden si el componente sirve, y ninguno se lee en el encapsulado"
        bien: true
        porque: "Es la medida que resume el capítulo: comprobar el parámetro que no está marcado."
      - texto: "Porque las hojas de datos mienten"
        porque: "No mienten: dan márgenes amplios; la pieza concreta hay que medirla."
      - texto: "Porque es más rápido que leer la hoja"
        porque: "No es cuestión de rapidez: son datos que la pieza no lleva escritos."
    escalera:
      - "¿Dónde está escrito el CTR de su optoacoplador concreto?"
    solucion: "Son los datos que deciden si el componente sirve, y ninguno se lee en el encapsulado."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [317, 318, 320, 341]
    ideas:
      - { titulo: "Relés.", texto: "Contacto de 2 a 3 veces la carga; vida eléctrica 10⁵ frente a 10⁷." }
      - { titulo: "Optoacopladores.", texto: "La mitad del CTR mínimo, 5 a 10 mA en el LED." }
      - { titulo: "Márgenes.", texto: "+50 % de tensión, el doble de corriente, 30 °C bajo el límite, la mitad de vida." }
      - { titulo: "Medir.", texto: "Lo que decide si sirve no está en el encapsulado." }
