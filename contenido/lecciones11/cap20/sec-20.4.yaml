# Lección 1.2 de la sección 19.3 «Cristales y Resonadores» (cap20; sec-20.N = impresas 19.(N − 1)).
# - Las cuatro formas de generar un reloj y los dos parámetros de la figura 19.6 (fig-20.7), con zonas; la foto de
#   la figura 19.7 (fig-20.8) con el cristal de 16 MHz, el disco de cuarzo y el diapasón de 32 768 Hz.
# - La curva térmica del cristal de 32 768 Hz (bloque 78): Δf/f = −0,034·(T − 25)² ppm, −21 ppm a 0 y a 50 °C; en
#   un día (86 400 s) son 1,8 s, «casi dos segundos al día».
# - El arranque (bloque 79): 16 MHz/32 768 Hz ≈ 488, «casi quinientas veces».
# Paso práctico: «dibujar» la parábola térmica del cristal de reloj entre 0 y 50 °C (atrasa en frío y en calor).
leccion: cap20/sec-20.4

libro:
  63: "Aquí interesa el punto de vista del componente"
  65: "Necesita el circuito oscilador del microcontrolador y dos condensadores externos"
  66: "lo mismo con menos exactitud (0,5 %)"
  67: "un encapsulado con alimentación, masa y salida de reloj ya generada"
  68: "para cuando hacen falta partes por millón o mejor"
  71: "Tolerancia inicial, en ppm a 25 °C."
  72: "sumarlos, junto con el envejecimiento (unas pocas ppm por año), da el error total"
  73: "sin la cual el circuito oscila a la frecuencia equivocada"
  74: "explica cristales que funcionan en una placa y no en otra"
  75: "por encima de la cual se degrada o se rompe"
  76: "que no son intercambiables"
  78: "son ya −0,034 × 25² ≈ −21 ppm, casi dos segundos al día"
  79: "cada ciclo dura casi quinientas veces más que a 16 MHz"
  84: "pueden impedir el arranque"
  86: "la capacidad de la sonda (unos 10 pF frente a cerca de 100) se suma a la de carga y puede detener el oscilador"
  87: "sustituirlo por un oscilador completo alimentado aparte"
  88: "Las cuatro formas de generar un reloj"
  89: "resonador de 32 768 Hz sin su cápsula, tallado en forma de diapasón"

modelo:
  valores:
    T_c: { sim: "T", nombre: "temperatura", unidad: "°C", valor: 25 }
    k_t: { sim: "k", nombre: "coeficiente de la parábola", unidad: "ppm", valor: -0.034 }
    d_s: { sim: "día", nombre: "segundos de un día", unidad: s, valor: 86400 }
    f_a: { sim: "f", nombre: "cristal de alta frecuencia", unidad: Hz, valor: 16000000 }
    f_r: { sim: "f_{reloj}", nombre: "cristal de reloj", unidad: Hz, valor: 32768 }
  calculos:
    d_f: { expr: "k_t*(T_c - 25)^2", sim: "Δf/f", nombre: "desviación de frecuencia", unidad: "ppm", cifras: 3 }
    s_d: { expr: "-d_f/1000000*d_s", sim: "atraso", nombre: "atraso en un día", unidad: s, cifras: 2 }
    r_c: { expr: "f_a/f_r", sim: "razón", nombre: "veces que dura más un ciclo", unidad: "", cifras: 3 }
    p_2: { expr: "2^15", sim: "2¹⁵", nombre: "dos elevado a quince", unidad: "" }

tarjetas:
  - id: explore-relojes
    tipo: explorar
    titulo: "Cuatro formas de tener un reloj"
    texto: "Casi todo circuito digital necesita un reloj. Toque cada forma de generarlo y lo que pide."
    libro: [63, 65, 66, 67, 68, 88]
    widget:
      tipo: figura
      figura: fig-20.7
      zonas:
        - { id: cristal, rotulo: "Primer recuadro, verde", rect: [4, 3, 105, 103], texto: "Cristal: dos terminales, pasivo. Oscilador del microcontrolador y dos condensadores externos." }
        - { id: resonador, rotulo: "Segundo recuadro, naranja", rect: [118, 3, 105, 103], texto: "Resonador cerámico: 0,5 %, con los condensadores integrados. Tres terminales y ningún cálculo." }
        - { id: xo, rotulo: "Tercer recuadro, azul", rect: [232, 3, 105, 103], texto: "Oscilador completo: alimentación, masa y salida de reloj. Resuelve los problemas de arranque." }
        - { id: tcxo, rotulo: "Cuarto recuadro, morado", rect: [346, 3, 105, 103], texto: "TCXO y OCXO: compensados y con horno, para partes por millón o mejor." }
    requiere: { mover: [cristal, resonador, xo] }

  - id: empareje-hoja
    tipo: pregunta
    titulo: "La hoja de datos"
    texto: "Empareje cada parámetro de la hoja de datos de un cristal con lo que pasa si se ignora."
    libro: [71, 72, 73, 74, 75, 76]
    widget:
      tipo: figura
      figura: fig-20.7
      zonas:
        - { id: cristal, rotulo: "Primer recuadro, verde", rect: [4, 3, 105, 103] }
    emparejar:
      - ["Capacidad de carga", "Oscila a la frecuencia equivocada"]
      - ["Resistencia serie (ESR)", "Funciona en una placa y no en otra"]
      - ["Nivel de excitación máximo", "Se degrada o se rompe"]
      - ["Modo fundamental o armónico", "No son intercambiables"]
    exito: "Y la tolerancia inicial, la estabilidad térmica y el envejecimiento se suman en el error total."
    pistas:
      - { texto: "La ESR decide si el oscilador del chip puede excitarlo." }
    escalera:
      - "Empiece por la capacidad de carga: fija los condensadores externos."
    solucion: "Carga, frecuencia equivocada; ESR, una placa sí y otra no; excitación, se rompe; modo, no intercambiable."

  - id: toque-no-arranca
    tipo: tocar
    titulo: "Un cristal que no arranca"
    texto: "Un mismo cristal arranca en una placa y no en otra. Toque el parámetro que suele explicarlo."
    libro: [74]
    widget:
      tipo: figura
      figura: fig-20.7
      zonas:
        - { id: esr, rotulo: "Abajo a la izquierda", rect: [10, 138, 210, 50] }
        - { id: carga, rotulo: "Abajo a la derecha", rect: [237, 138, 210, 50] }
        - { id: cristal, rotulo: "Primer recuadro, verde", rect: [4, 3, 105, 103] }
        - { id: xo, rotulo: "Tercer recuadro, azul", rect: [232, 3, 105, 103] }
    tocar:
      bien: [esr]
      porque:
        carga: "La capacidad de carga mal calculada desplaza la frecuencia; lo de una placa sí y otra no es la ESR."
        cristal: "Es el componente; se pregunta qué parámetro suyo lo explica."
        xo: "Un oscilador completo no tiene problemas de arranque."
    exito: "La ESR: si es mayor de lo que el oscilador del chip puede excitar, no arranca."
    escalera:
      - "¿Qué parámetro compara el cristal con el oscilador que lo excita?"
    solucion: "La resistencia serie equivalente (ESR)."

  - id: dos-quince
    tipo: pregunta
    titulo: "Por qué 32 768 Hz"
    texto: "El cristal de reloj oscila a 32 768 Hz. ¿Por qué esa frecuencia?"
    libro: [78, 89]
    widget:
      tipo: figura
      figura: fig-20.8
      zonas:
        - { id: diapason, rotulo: "Foto de la derecha", rect: [1240, 0, 360, 535] }
    opciones:
      - texto: "Es 2¹⁵: quince divisiones por dos dan un segundo"
        bien: true
        porque: "Un contador binario la lleva a 1 Hz exacto."
      - texto: "Es la frecuencia más estable del cuarzo"
        porque: "La elección es aritmética: 2¹⁵, para dividir hasta un segundo."
      - texto: "Es la mínima que da un cristal"
        porque: "No es una cuestión de mínimo: es que dividida por dos quince veces da un segundo."
    escalera:
      - "Divida 32 768 entre 2 una y otra vez."
    solucion: "32 768 = 2¹⁵: quince divisiones por dos dan exactamente un segundo."
    comprobar:
      - { p_2: 32768 }

  - id: prediga-frio-calor
    tipo: predecir
    titulo: "Frío y calor"
    texto: "Dos relojes con cristal de 32 768 Hz, ajustados a 25 °C: uno pasa el día a 0 °C y otro a 50 °C. ¿Qué hacen?"
    libro: [78]
    widget:
      tipo: figura
      figura: fig-20.8
      zonas:
        - { id: diapason, rotulo: "Foto de la derecha", rect: [1240, 0, 360, 535] }
    opciones:
      - texto: "Los dos atrasan"
        bien: true
        porque: "Su curva térmica es una parábola con el vértice en unos 25 °C: tanto en frío como en calor, la frecuencia baja."
      - texto: "El frío adelanta y el caliente atrasa"
        porque: "Eso sería una recta; la curva del diapasón es una parábola: baja hacia los dos lados."
      - texto: "Ninguno cambia: el cuarzo es estable"
        porque: "Es estable, pero no inmune: a 25 °C del vértice ya son unas −21 ppm."
    escalera:
      - "¿Dónde tiene el vértice su curva, y hacia dónde se abre?"
    solucion: "Los dos atrasan: la parábola tiene el vértice en 25 °C y se abre hacia abajo."

  - id: explore-parabola
    tipo: explorar
    titulo: "Una parábola con el vértice en 25 °C"
    texto: "La frecuencia del diapasón de 32 768 Hz frente a la temperatura. Enfríelo y caliéntelo."
    libro: [78]
    widget:
      tipo: grafica
      x: { id: t, min: 0, max: 50, unidad: "°C", rotulo: "T" }
      y: { min: -25, max: 2, unidad: "ppm", rotulo: "Δf/f" }
      curvas:
        - { expr: "k_t*(t - 25)^2", color: naranja, rotulo: "−0,034·(T − 25)²" }
      marcas:
        - { x: "T_c", y: "d_f", rotulo: "{{d_f}}" }
      lectura: { valor: d_f, rotulo: "Desviación de frecuencia" }
      datos:
        - { valor: s_d, rotulo: "Atraso en un día: {{s_d}}" }
      mandos:
        - { valor: T_c, min: 0, max: 50, paso: 5, rotulo: "Temperatura, T" }
    requiere: { mover: [T_c] }
    comprobar:
      - { con: { T_c: 0 }, d_f: -21.25, s_d: 1.84, tol: 0.01 }

  - id: dibuje-parabola
    tipo: dibujar
    titulo: "Dibuje la curva térmica"
    texto: "Dibuje la desviación de frecuencia del cristal de 32 768 Hz entre 0 y 50 °C."
    libro: [78]
    dibujar:
      x: { id: t, min: 0, max: 50, unidad: "°C", rotulo: "T" }
      y: { min: -25, max: 2, unidad: "ppm", rotulo: "Δf/f" }
      curva: "k_t*(t - 25)^2"
      puntos: 11
      tol: 0.08
      holgura: 0.03
      rotulo: "Δf/f frente a la temperatura"
    exito: "Una parábola hacia abajo con el vértice en 25 °C: tanto en frío como en calor atrasa."
    pistas:
      - { cuando: { valor: media, mayor: 0.05 }, texto: "Demasiado alta: fuera de 25 °C la frecuencia baja, nunca sube." }
      - { texto: "Mire el vértice en 25 °C, y unas −21 ppm en los dos extremos." }
    escalera:
      - "En 25 °C, cero. ¿Sube o baja la frecuencia al alejarse?"
      - "Es simétrica: a 0 °C y a 50 °C, unas −21 ppm."
    solucion: "−0,034 · (T − 25)²: cero en 25 °C y −21 ppm a 0 y a 50 °C."

  - id: estime-dia
    tipo: pregunta
    titulo: "En un reloj"
    texto: "A 0 °C el cristal de reloj va −21 ppm. ¿Cuántos segundos atrasa al día?"
    libro: [78]
    fijar: { T_c: 0 }
    widget:
      tipo: grafica
      x: { id: t, min: 0, max: 50, unidad: "°C", rotulo: "T" }
      y: { min: -25, max: 2, unidad: "ppm", rotulo: "Δf/f" }
      curvas:
        - { expr: "k_t*(t - 25)^2", color: naranja, rotulo: "−0,034·(T − 25)²" }
    estimar:
      objetivo: "s_d"
      unidad: s
      min: 0
      max: 10
      paso: 0.1
      inicio: 6
      tol: 0.08
      rotulo: "Atraso al día"
    exito: "Casi dos segundos al día: −21 ppm de 86 400 s."
    pistas:
      - { cuando: { valor: estimacion, mayor: 2 }, texto: "Demasiado: 21 millonésimas de los 86 400 segundos de un día." }
      - { texto: "Corto: 21 · 10⁻⁶ · 86 400." }
    escalera:
      - "Un día tiene 86 400 segundos."
    solucion: "21 · 10⁻⁶ · 86 400 ≈ 1,8 s al día."
    comprobar:
      - { s_d: 1.84, d_s: 86400, tol: 0.01 }

  - id: porque-arranque
    tipo: porque
    titulo: "Un arranque lento"
    texto: "El oscilador de 32 768 Hz tarda uno o dos segundos en arrancar. ¿Por qué?"
    libro: [79]
    widget:
      tipo: figura
      figura: fig-20.8
      zonas:
        - { id: diapason, rotulo: "Foto de la derecha", rect: [1240, 0, 360, 535] }
    opciones:
      - texto: "Por su frecuencia baja: cada ciclo dura casi quinientas veces más que a 16 MHz"
        bien: true
        porque: "Necesita sus ciclos para crecer, y cada uno es mucho más largo."
      - texto: "Porque su Q es mucho mayor que el de un cristal de megahercios"
        porque: "El libro lo descarta: la causa no es un Q mayor, sino la frecuencia baja."
      - texto: "Porque consume muy poco"
        porque: "Consume microamperios, pero no es eso lo que lo retrasa."
    escalera:
      - "Compare la duración de un ciclo a 32 768 Hz y a 16 MHz."
    solucion: "La frecuencia baja: cada ciclo dura casi quinientas veces más."
    comprobar:
      - { r_c: 488 }

  - id: sonda
    tipo: pregunta
    titulo: "Medir un cristal"
    texto: "Para ver si un cristal oscila, se mide en uno de sus terminales. ¿Con qué sonda?"
    libro: [86]
    widget:
      tipo: figura
      figura: fig-20.8
      zonas:
        - { id: hc49, rotulo: "Cápsula metálica de la foto izquierda", rect: [230, 160, 200, 170] }
    opciones:
      - texto: "×10, nunca ×1"
        bien: true
        porque: "La ×1 añade cerca de 100 pF a la capacidad de carga y puede detener el oscilador."
      - texto: "×1, que tiene más sensibilidad"
        porque: "Su capacidad se suma a la de carga: el circuito falla justo cuando se mide."
      - texto: "Cualquiera: la medida dice la exactitud"
        porque: "Ni siquiera la ×10 dice la exactitud: la desplaza unas decenas de ppm. Solo dice si oscila."
    escalera:
      - "¿Qué capacidad añade cada sonda al circuito?"
    solucion: "Sonda ×10: unos 10 pF frente a cerca de 100 de la ×1."

  - id: no-arranca
    tipo: pregunta
    titulo: "La comprobación rápida"
    texto: "El sistema parece muerto y sospecha del cristal. ¿Cuál es la comprobación rápida?"
    libro: [84, 87]
    widget:
      tipo: figura
      figura: fig-20.7
      zonas:
        - { id: xo, rotulo: "Tercer recuadro, azul", rect: [232, 3, 105, 103] }
    opciones:
      - texto: "Sustituirlo por un oscilador completo alimentado aparte"
        bien: true
        porque: "Si así funciona, el problema está en el circuito oscilador o en los condensadores."
      - texto: "Cambiar el cristal por otro igual"
        porque: "Si el problema es la ESR, los condensadores o la suciedad, otro igual puede fallar igual."
      - texto: "Medirlo con sonda ×1"
        porque: "La ×1 puede detener un oscilador sano: confundiría más."
    escalera:
      - "¿Qué fuente de reloj no necesita nada para arrancar?"
    solucion: "Sustituirlo por un oscilador completo alimentado aparte."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [65, 74, 78, 86]
    ideas:
      - { titulo: "Cuatro opciones.", texto: "Cristal, resonador, oscilador completo, TCXO u OCXO." }
      - { titulo: "La hoja.", texto: "Capacidad de carga y ESR explican los cristales que no arrancan." }
      - { titulo: "El de 32 768 Hz.", texto: "2¹⁵; parábola con vértice en 25 °C: atrasa en frío y en calor." }
      - { titulo: "Medirlo.", texto: "Con sonda ×10: dice si oscila, no con qué exactitud." }
