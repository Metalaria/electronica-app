# Lección 1.2 de la sección 19.5 «Sensores: Medir el Mundo Físico» (cap20; sec-20.N = impresas 19.(N − 1)).
# - Las cuatro familias y el montaje de la figura 19.10 (fig-20.11), con zonas.
# - Sin modelo de circuito: la sección clasifica (los sensores resistivos tienen su capítulo, el 36).
# Paso práctico: «tocar» en la figura 19.10 la familia de un termopar.
leccion: cap20/sec-20.6

libro:
  120: "Un sensor traduce algo del mundo"
  122: "Necesitan excitación (una corriente o una tensión) para producir señal"
  123: "producen tensión o corriente por sí mismos, sin excitación"
  124: "Requieren un circuito de medida de impedancia, casi siempre con excitación alterna."
  125: "llevan el acondicionamiento y el convertidor dentro"
  127: "la excitación, la amplificación, la linealización, la calibración y la conversión"
  128: "empezar buscando el sensor digital equivalente"
  131: "un sensor puede dar tres decimales y equivocarse en el primero"
  132: "un offset constante se calibra y una dispersión no"
  135: "si el valor medido depende de por dónde se llegó a él"
  136: "un sensor de humedad que responda también a la temperatura"
  139: "Un sensor de temperatura mide su propia temperatura, no la del objeto."
  140: "dentro de una caja cerrada mide el aire de la caja"
  141: "incluidas las vibraciones de todo lo que esté unido a él"
  142: "responde al campo de cualquier conductor cercano"
  144: "hielo fundente y agua hirviendo para temperatura"
  145: "ninguna calibración lo arregla"
  146: "Las cuatro familias de sensores según su salida"

modelo: { valores: {}, calculos: {} }

tarjetas:
  - id: explore-familias
    tipo: explorar
    titulo: "Cuatro familias por su salida"
    texto: "Un sensor traduce algo del mundo en una magnitud eléctrica, y la forma de esa traducción decide el circuito. Toque cada familia."
    libro: [120, 122, 123, 124, 125, 146]
    widget:
      tipo: figura
      figura: fig-20.11
      zonas:
        - { id: resistivos, rotulo: "Primer recuadro", rect: [4, 7, 106, 94], texto: "Resistivos: NTC, LDR, galgas. Necesitan excitación, con autocalentamiento e incertidumbre propia." }
        - { id: generadores, rotulo: "Segundo recuadro", rect: [117, 7, 106, 94], texto: "Generadores: termopares, fotodiodos, piezoeléctricos. Señal muy pequeña: amplificación cuidadosa." }
        - { id: capacitivos, rotulo: "Tercer recuadro", rect: [231, 7, 106, 94], texto: "Capacitivos o inductivos: proximidad, humedad, nivel, MEMS. Miden impedancia con excitación alterna." }
        - { id: digitales, rotulo: "Cuarto recuadro", rect: [345, 7, 106, 94], texto: "Digitales: acondicionamiento y convertidor dentro; entregan el valor por I²C o SPI." }
    requiere: { mover: [resistivos, generadores, capacitivos, digitales] }

  - id: toque-termopar
    tipo: tocar
    titulo: "Un termopar"
    texto: "Un termopar da una tensión pequeña sin que nadie lo excite. Toque su familia."
    libro: [122, 123]
    widget:
      tipo: figura
      figura: fig-20.11
      zonas:
        - { id: resistivos, rotulo: "Primer recuadro", rect: [4, 7, 106, 94] }
        - { id: generadores, rotulo: "Segundo recuadro", rect: [117, 7, 106, 94] }
        - { id: capacitivos, rotulo: "Tercer recuadro", rect: [231, 7, 106, 94] }
        - { id: digitales, rotulo: "Cuarto recuadro", rect: [345, 7, 106, 94] }
    tocar:
      bien: [generadores]
      porque:
        resistivos: "Los resistivos necesitan excitación para dar señal; el termopar no."
        capacitivos: "Estos cambian su capacidad o inductancia y se miden con excitación alterna."
        digitales: "Un termopar no lleva convertidor dentro: da una tensión analógica."
    exito: "Generadores: producen tensión por sí mismos; su señal es pequeña y pide amplificación cuidadosa."
    escalera:
      - "¿Qué familia no necesita excitación?"
    solucion: "El segundo recuadro, los generadores."

  - id: digital
    tipo: pregunta
    titulo: "Por qué el digital"
    texto: "Para casi cualquier proyecto, el libro recomienda empezar buscando el sensor digital equivalente. ¿Por qué?"
    libro: [127, 128]
    widget:
      tipo: figura
      figura: fig-20.11
      zonas:
        - { id: digitales, rotulo: "Cuarto recuadro", rect: [345, 7, 106, 94] }
    opciones:
      - texto: "Resuelve de fábrica excitación, amplificación, linealización, calibración y conversión"
        bien: true
        porque: "Todo lo que en un analógico hay que diseñar, y calibrado con una exactitud costosa de reproducir."
      - texto: "Porque siempre es más rápido"
        porque: "No siempre: más velocidad es justamente una razón para ir a la cadena analógica."
      - texto: "Porque el analógico ya no se usa"
        porque: "Se usa cuando no hay digital, cuando hace falta más velocidad o exactitud, o para aprender."
    escalera:
      - "¿Qué hay que diseñar en un sensor analógico que el digital ya trae?"
    solucion: "Trae resuelto lo que en un analógico hay que diseñar, y calibrado de fábrica."

  - id: empareje-parametros
    tipo: pregunta
    titulo: "Los parámetros que hay que comparar"
    texto: "Empareje cada parámetro de un sensor con lo que significa."
    libro: [131, 132, 135, 136]
    widget:
      tipo: figura
      figura: fig-20.11
      zonas:
        - { id: todo, rotulo: "Las cuatro familias", rect: [4, 7, 446, 94] }
    emparejar:
      - ["Exactitud frente a resolución", "Tres decimales y error en el primero"]
      - ["Repetibilidad", "Medir lo mismo dos veces igual"]
      - ["Histéresis", "Depende de por dónde se llegó"]
      - ["Sensibilidad cruzada", "Humedad que responde a la temperatura"]
    exito: "Y además, deriva y tiempo de respuesta."
    pistas:
      - { texto: "La histéresis recuerda el camino." }
    escalera:
      - "Empiece por la que habla de decimales."
    solucion: "Exactitud y resolución, decimales; repetibilidad, igual dos veces; histéresis, el camino; cruzada, otra magnitud."

  - id: porque-repetibilidad
    tipo: porque
    titulo: "Repetibilidad antes que exactitud"
    texto: "A menudo importa más que un sensor sea repetible que exacto. ¿Por qué?"
    libro: [132]
    widget:
      tipo: figura
      figura: fig-20.11
      zonas:
        - { id: todo, rotulo: "Las cuatro familias", rect: [4, 7, 446, 94] }
    opciones:
      - texto: "Un offset constante se calibra; una dispersión no"
        bien: true
        porque: "Si siempre se equivoca lo mismo, se corrige; si cada vez es distinto, no hay corrección."
      - texto: "Porque la exactitud no importa"
        porque: "Importa, pero un error constante se puede quitar calibrando."
      - texto: "Porque los sensores repetibles son más baratos"
        porque: "No es el precio: es que el error repetible se calibra."
    escalera:
      - "¿Qué error se puede restar siempre igual?"
    solucion: "Un offset constante se calibra y una dispersión no."

  - id: empareje-montaje
    tipo: pregunta
    titulo: "El montaje importa"
    texto: "Lo que más veces arruina una medida es el montaje. Empareje cada sensor con lo que mide de verdad."
    libro: [139, 140, 141, 142]
    widget:
      tipo: figura
      figura: fig-20.11
      zonas:
        - { id: montaje, rotulo: "Recuadro rojo de abajo", rect: [4, 127, 446, 78] }
    emparejar:
      - ["Temperatura", "Su propia temperatura, no la del objeto"]
      - ["Humedad, en una caja cerrada", "El aire de la caja"]
      - ["Acelerómetro", "Su soporte, con todas sus vibraciones"]
      - ["Corriente por efecto Hall", "El campo de cualquier conductor cercano"]
    exito: "El montaje importa tanto como el sensor."
    pistas:
      - { texto: "Un sensor de humedad necesita ver el aire que interesa." }
    escalera:
      - "Empiece por la temperatura: ¿de qué está midiendo la temperatura?"
    solucion: "Temperatura, la suya; humedad, la caja; acelerómetro, el soporte; Hall, cualquier conductor."

  - id: prediga-placa
    tipo: predecir
    titulo: "Pegado a la placa"
    texto: "Un sensor de temperatura va pegado a una placa que se calienta, para medir el aire de la sala. ¿Qué marca?"
    libro: [139]
    widget:
      tipo: figura
      figura: fig-20.11
      zonas:
        - { id: montaje, rotulo: "Recuadro rojo de abajo", rect: [4, 127, 446, 78] }
    opciones:
      - texto: "La temperatura de la placa"
        bien: true
        porque: "Mide su propia temperatura, y la placa lo calienta."
      - texto: "La del aire de la sala"
        porque: "Solo si está en buen contacto con el aire y lejos de lo que se calienta."
      - texto: "La media entre placa y aire, que es la buena"
        porque: "No hay nada de bueno en esa mezcla: el montaje ha estropeado la medida."
    escalera:
      - "¿De quién es la temperatura que mide un sensor?"
    solucion: "La de la placa: un sensor de temperatura mide su propia temperatura."

  - id: dos-puntos
    tipo: pregunta
    titulo: "Verificar con dos puntos"
    texto: "Todo sensor se verifica con dos puntos conocidos. ¿Cuáles para uno de temperatura?"
    libro: [144]
    widget:
      tipo: figura
      figura: fig-20.11
      zonas:
        - { id: resistivos, rotulo: "Primer recuadro", rect: [4, 7, 106, 94] }
    opciones:
      - texto: "Hielo fundente y agua hirviendo"
        bien: true
        porque: "Dos puntos que cualquiera puede reproducir en casa."
      - texto: "La temperatura de la sala, dos veces"
        porque: "Un solo punto, y desconocido: no verifica nada."
      - texto: "El dedo y la mesa"
        porque: "Ninguno de los dos es un punto conocido."
    escalera:
      - "¿Qué dos temperaturas conoce sin termómetro?"
    solucion: "Hielo fundente y agua hirviendo."

  - id: prediga-tapar
    tipo: predecir
    titulo: "Responde a lo que no debe"
    texto: "Se acerca una fuente de calor a un sensor de humedad y su lectura cambia mucho. ¿Qué indica?"
    libro: [136, 145]
    widget:
      tipo: figura
      figura: fig-20.11
      zonas:
        - { id: montaje, rotulo: "Recuadro rojo de abajo", rect: [4, 127, 446, 78] }
    opciones:
      - texto: "Sensibilidad cruzada o mal montaje: ninguna calibración lo arregla"
        bien: true
        porque: "Responde a una magnitud que no debería medir; eso no se corrige con un ajuste."
      - texto: "Que hay que calibrarlo otra vez"
        porque: "Una calibración corrige un error constante, no una respuesta a otra magnitud."
      - texto: "Que funciona bien"
        porque: "Un sensor de humedad no debería seguir al calor."
    escalera:
      - "¿Debería un sensor de humedad responder a la temperatura?"
    solucion: "Sensibilidad cruzada o mal montaje, y ninguna calibración lo arregla."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [122, 128, 132, 139]
    ideas:
      - { titulo: "Cuatro familias.", texto: "Resistivos, generadores, capacitivos o inductivos, y digitales." }
      - { titulo: "Empiece por el digital.", texto: "Trae resuelto y calibrado lo que en un analógico hay que diseñar." }
      - { titulo: "Repetibilidad.", texto: "Un offset se calibra; una dispersión no." }
      - { titulo: "El montaje.", texto: "Un sensor mide su propio entorno: verifíquelo cambiándolo a propósito." }
