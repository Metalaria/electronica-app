# Lección 1.2 de la sección 19.8 «Conectores y Cables: la Interfaz que se Olvida» (cap20; sec-20.N = impresas
# 19.(N − 1)).
# - Los conectores de la foto de la figura 19.14 (fig-20.15) y los cuatro errores de la figura 19.13 (fig-20.14), con
#   zonas.
# - La tabla del bloque 211 en el esquema «serie»: una alimentación de 3,3 V (bloque 212), los cuatro contactos de
#   20 mΩ juntos como R₁ = 80 mΩ y una carga de ejemplo R₂ elegida para que circulen 100 mA, 1 A o 5 A
#   (R₂ = 3,3/I − 0,08: 32,92, 3,22 y 0,58 Ω). Con 5 A caen 400 mV, el 12 % de 3,3 V.
# Paso práctico: «simular» la caída en los cuatro contactos con 5 A (400 mV; error típico: un solo contacto, 100 mV).
leccion: cap20/sec-20.9

libro:
  202: "los conectores y los cables ocupan el cuarto puesto"
  203: "son el único punto del circuito con partes móviles y contacto mecánico"
  205: "Un contacto necesita una presión mínima para romper la película de óxido superficial"
  206: "un contacto de oro contra uno de estaño produce corrosión galvánica acelerada"
  208: "la vibración produce desplazamientos minúsculos que van puliendo el recubrimiento"
  210: "Un contacto nuevo tiene entre 5 y 20 mΩ."
  211: "Caída en un contacto de 20 mΩ"
  212: "En una alimentación de 3,3 V, esos 400 mV son el 12 %."
  213: "una resistencia de contacto variable es peor que una alta"
  219: "un conector que se puede insertar al revés se insertará al revés"
  221: "Si un tirón se transmite a las soldaduras, estas se agrietan"
  222: "reducen la diafonía"
  223: "Se intercambiarán tarde o temprano"
  224: "doblar demasiado cambia la impedancia o rompe conductores"
  230: "si el fallo responde, el conector es el culpable, aunque parezca intacto"
  231: "Caída de tensión en los contactos y los cuatro errores de diseño con conectores."
  232: "la pared con ranuras y la pestaña solo dejan entrar el conector en un sentido"

modelo:
  valores:
    V_s: { sim: "V", nombre: "alimentación", unidad: V, valor: 3.3 }
    R_c: { sim: "R_{cont}", nombre: "cuatro contactos de 20 mΩ", unidad: Ω, valor: 0.08 }
    R_L: { sim: "R_{L}", nombre: "carga de ejemplo", unidad: Ω, valor: 32.92 }
  calculos:
    I_s: { expr: "V_s/(R_c + R_L)", sim: "I", nombre: "corriente", unidad: A }
    V_c: { expr: "I_s*R_c", sim: "V_{cont}", nombre: "caída en los cuatro contactos", unidad: V }
    V_L: { expr: "I_s*R_L", sim: "V_{L}", nombre: "tensión en la carga", unidad: V }
    V_1: { expr: "I_s*R_c/4", sim: "V_{1}", nombre: "caída en un solo contacto", unidad: V }
    p_c: { expr: "V_c/V_s*100", sim: "caída", nombre: "caída frente a la alimentación", unidad: "%", cifras: 2 }

tarjetas:
  - id: explore-foto
    tipo: explorar
    titulo: "La interfaz que se olvida"
    texto: "Los conectores son el único punto del circuito con partes móviles y contacto mecánico. Toque cada uno."
    libro: [202, 203, 232]
    widget:
      tipo: figura
      figura: fig-20.15
      zonas:
        - { id: bnc, rotulo: "Foto de arriba a la izquierda", rect: [0, 0, 780, 585], texto: "BNC macho en cable coaxial." }
        - { id: sma, rotulo: "Foto de arriba a la derecha", rect: [818, 0, 782, 585], texto: "SMA macho." }
        - { id: smaplaca, rotulo: "Foto de abajo a la izquierda", rect: [0, 661, 543, 361], texto: "SMA hembra soldado en la placa." }
        - { id: jst, rotulo: "Foto de abajo en el centro", rect: [578, 661, 445, 361], texto: "JST RCY de dos vías, para cable." }
        - { id: cabecera, rotulo: "Foto de abajo a la derecha", rect: [1058, 661, 542, 361], texto: "Cabecera JST de placa." }
    requiere: { mover: [bnc, cabecera] }

  - id: empareje-contacto
    tipo: pregunta
    titulo: "Qué hace fiable un contacto"
    texto: "Empareje cada factor con lo que hace en el contacto."
    libro: [205, 206, 208]
    widget:
      tipo: figura
      figura: fig-20.15
      zonas:
        - { id: smaplaca, rotulo: "Foto de abajo a la izquierda", rect: [0, 661, 543, 361] }
    emparejar:
      - ["Fuerza de contacto", "Rompe la película de óxido"]
      - ["Oro", "No se oxida: miliohmios indefinidamente"]
      - ["Estaño", "Su óxido es blando y la inserción lo rompe"]
      - ["Fretting", "La vibración pule el recubrimiento"]
    exito: "Por eso los conectores de equipos que vibran llevan retención mecánica."
    pistas:
      - { texto: "El fretting es desgaste por micromovimiento." }
    escalera:
      - "Empiece por el oro: es el que no se oxida."
    solucion: "Fuerza, rompe el óxido; oro, no se oxida; estaño, óxido blando; fretting, vibración."

  - id: prediga-mezcla
    tipo: predecir
    titulo: "Un conector «equivalente»"
    texto: "Se sustituye un conector por otro «equivalente»: ahora un contacto de oro toca uno de estaño. ¿Qué pasa con el tiempo?"
    libro: [206]
    widget:
      tipo: figura
      figura: fig-20.15
      zonas:
        - { id: jst, rotulo: "Foto de abajo en el centro", rect: [578, 661, 445, 361] }
    opciones:
      - texto: "Corrosión galvánica acelerada"
        bien: true
        porque: "Oro y estaño nunca deben mezclarse."
      - texto: "Nada: el oro protege al estaño"
        porque: "Al contrario: el par oro-estaño se corroe más deprisa."
      - texto: "Mejora: el oro baja la resistencia"
        porque: "Solo si los dos fueran de oro; mezclados, se corroen."
    escalera:
      - "¿Qué pasa cuando dos metales distintos están en contacto?"
    solucion: "Corrosión galvánica acelerada: nunca se mezclan."

  - id: explore-caida
    tipo: explorar
    titulo: "Miliohmios que no siempre se desprecian"
    texto: "Un contacto nuevo tiene entre 5 y 20 mΩ; en el camino hay cuatro. Cambie la carga y mire la caída en ellos."
    nota: "Carga de ejemplo."
    libro: [210, 211, 231]
    widget:
      tipo: circuito
      esquema: serie
      piezas: { fuente: V_s, r1: R_c, r2: R_L }
      lectura: { valor: V_c, rotulo: "Caída en los cuatro contactos" }
      datos:
        - { valor: I_s, rotulo: "Corriente: {{I_s}}" }
      corriente: I_s
      mide: { corriente: I_s, v1: V_c, v2: V_L }
      mandos:
        - { valor: R_L, lista: [32.92, 3.22, 0.58], rotulo: "Carga" }
    requiere: { mover: [R_L] }
    comprobar:
      - { I_s: 0.1, V_c: 0.008 }
      - { con: { R_L: 3.22 }, I_s: 1, V_c: 0.08 }

  - id: simule-5a
    tipo: simular
    titulo: "Con 5 A"
    texto: "Por el conector de alimentación pasan 5 A, y en el camino hay cuatro contactos de 20 mΩ. ¿Cuánto cae en ellos?"
    libro: [211, 212]
    fijar: { V_s: 3.3, R_c: 0.08, R_L: 0.58 }
    widget:
      tipo: circuito
      esquema: serie
      piezas: { fuente: V_s, r1: R_c, r2: R_L }
      lectura: { valor: V_c, rotulo: "Caída en los cuatro contactos" }
      corriente: I_s
      mide: { corriente: I_s, v1: V_c, v2: V_L }
      ocultar: true
      mandos: []
    simular:
      objetivo: V_c
      unidad: V
      tol: 0.03
      rotulo: "Caída en los contactos"
      medida: v1
      errores:
        - { expr: "V_1", texto: "Eso es un solo contacto: en el camino hay cuatro." }
    exito: "400 mV: en una alimentación de 3,3 V, el 12 %."
    escalera:
      - "Cada contacto: corriente por resistencia. Y son cuatro."
    solucion: "5 A · 4 · 20 mΩ = 400 mV."
    comprobar:
      - { V_c: 0.4, V_1: 0.1, I_s: 5, p_c: 12.1, tol: 0.01 }

  - id: doblar-pines
    tipo: porque
    titulo: "Doblar los pines"
    texto: "En los conectores de alimentación se doblan o triplican los pines de cada raíl. ¿Por qué?"
    libro: [212]
    fijar: { V_s: 3.3, R_c: 0.08, R_L: 0.58 }
    widget:
      tipo: circuito
      esquema: serie
      piezas: { fuente: V_s, r1: R_c, r2: R_L }
      lectura: { valor: V_c, rotulo: "Caída en los cuatro contactos" }
      corriente: I_s
      mide: { corriente: I_s, v1: V_c, v2: V_L }
      mandos: []
    opciones:
      - texto: "Para reducir la caída y la resistencia efectiva"
        bien: true
        porque: "Pines en paralelo dividen la resistencia de contacto: no es por la corriente máxima."
      - texto: "Porque un pin no aguanta la corriente"
        porque: "El libro dice que no es por la corriente máxima, sino por la caída."
      - texto: "Por simetría mecánica"
        porque: "La razón es eléctrica: 400 mV son el 12 % de 3,3 V."
    escalera:
      - "¿Qué le pasa a la resistencia de dos contactos en paralelo?"
    solucion: "Para reducir la caída y la resistencia efectiva, no por corriente máxima."

  - id: prediga-senal
    tipo: predecir
    titulo: "En señal pequeña"
    texto: "En la entrada de un sensor de señal pequeña, un contacto cuya resistencia varía. ¿Qué se verá?"
    libro: [213]
    widget:
      tipo: figura
      figura: fig-20.14
      zonas:
        - { id: grafica, rotulo: "Gráfica de la izquierda", rect: [38, 8, 182, 160] }
    opciones:
      - texto: "Ruido y deriva que parecen un fallo del sensor"
        bien: true
        porque: "Una resistencia de contacto variable es peor que una alta: no se distingue del sensor."
      - texto: "Nada, mientras la resistencia sea pequeña"
        porque: "Lo que daña aquí es que varíe, no su valor."
      - texto: "Una caída constante que se calibra"
        porque: "Si fuera constante, sí; pero varía, y eso es ruido y deriva."
    escalera:
      - "¿Es peor un error constante o uno que cambia?"
    solucion: "Ruido y deriva que no se distinguen de un fallo del sensor."

  - id: toque-polarizado
    tipo: tocar
    titulo: "Al revés"
    texto: "Un conector que se puede insertar al revés se insertará al revés. Toque el que solo deja entrar en un sentido."
    libro: [219, 232]
    widget:
      tipo: figura
      figura: fig-20.15
      zonas:
        - { id: bnc, rotulo: "Foto de arriba a la izquierda", rect: [0, 0, 780, 585] }
        - { id: sma, rotulo: "Foto de arriba a la derecha", rect: [818, 0, 782, 585] }
        - { id: smaplaca, rotulo: "Foto de abajo a la izquierda", rect: [0, 661, 543, 361] }
        - { id: jst, rotulo: "Foto de abajo en el centro", rect: [578, 661, 445, 361] }
        - { id: cabecera, rotulo: "Foto de abajo a la derecha", rect: [1058, 661, 542, 361] }
    tocar:
      bien: [cabecera]
      porque:
        bnc: "Un BNC es redondo y coaxial: no hay un «al revés» que evitar."
        sma: "El SMA es coaxial y se rosca: no tiene sentido de inserción."
        smaplaca: "Es la hembra del SMA, coaxial también."
        jst: "Ese es el de cable; la polarización se ve en la cabecera de placa."
    exito: "La cabecera JST: la pared con ranuras y la pestaña solo lo dejan entrar en un sentido."
    escalera:
      - "Busque una carcasa asimétrica, con muesca o pestaña."
    solucion: "La cabecera JST de placa."

  - id: empareje-errores
    tipo: pregunta
    titulo: "Errores de diseño"
    texto: "Empareje cada error de diseño con conectores con su consecuencia."
    libro: [221, 222, 223, 224]
    widget:
      tipo: figura
      figura: fig-20.14
      zonas:
        - { id: errores, rotulo: "Recuadros de la derecha", rect: [298, 3, 153, 192] }
    emparejar:
      - ["El cable soporta el esfuerzo", "Las soldaduras se agrietan"]
      - ["Pocos pines de masa", "Más diafonía"]
      - ["Conectores idénticos con funciones distintas", "Se intercambiarán"]
      - ["Radio de curvatura ignorado", "Cambia la impedancia o rompe conductores"]
    exito: "Si intercambiarlos destruye algo, es un fallo de diseño y no del usuario."
    pistas:
      - { texto: "El alivio de tensión es para que el tirón no llegue a las soldaduras." }
    escalera:
      - "Empiece por el cable que soporta el esfuerzo."
    solucion: "Esfuerzo, soldaduras; masas, diafonía; idénticos, intercambio; curvatura, impedancia."

  - id: intermitente
    tipo: pregunta
    titulo: "Un fallo intermitente"
    texto: "Un equipo falla a ratos y el conector parece intacto. ¿Qué prueba lo delata más veces?"
    libro: [230]
    widget:
      tipo: figura
      figura: fig-20.15
      zonas:
        - { id: jst, rotulo: "Foto de abajo en el centro", rect: [578, 661, 445, 361] }
    opciones:
      - texto: "Mover y presionar el conector mientras se observa la señal"
        bien: true
        porque: "Si el fallo responde, el conector es el culpable, aunque parezca intacto."
      - texto: "Medir su resistencia con el multímetro normal"
        porque: "Los miliohmios no se ven así: hace falta el método de cuatro hilos."
      - texto: "Mirarlo con lupa"
        porque: "Puede parecer intacto y fallar: lo delata su respuesta al moverlo."
    escalera:
      - "¿Qué hace un fallo de contacto cuando se mueve el contacto?"
    solucion: "Moverlo y presionarlo mientras se observa la señal."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [203, 206, 212, 219]
    ideas:
      - { titulo: "El contacto.", texto: "Fuerza para romper el óxido; nunca oro con estaño." }
      - { titulo: "La caída.", texto: "Cuatro contactos de 20 mΩ con 5 A: 400 mV, el 12 % de 3,3 V." }
      - { titulo: "Polarizar.", texto: "Lo que se puede insertar al revés se insertará al revés." }
      - { titulo: "Intermitentes.", texto: "Mover el conector mientras se mira la señal." }
