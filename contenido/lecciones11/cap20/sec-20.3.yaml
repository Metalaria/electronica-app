# Lección 1.2 de la sección 19.2 «Relés: Conmutar lo Grande con lo Pequeño» (cap20; sec-20.N = impresas 19.(N − 1)).
# - El relé de la figura 19.3 (fig-20.4) y la foto de la figura 19.5 (fig-20.6) con zonas; el pico de la bobina con y
#   sin diodo de la figura 19.4 (fig-20.5).
# - Sin modelo de circuito: no hay esquema de relé ni de bobina con diodo de rueda libre al cortar desde un transistor
#   (la sección 4.5 tiene su propia lección); la figura 19.4 enseña el pico.
# Paso práctico: «tocar» en la figura 19.3 lo que protege el transistor y en la 19.4 la traza que lo destruye.
leccion: cap20/sec-20.3

libro:
  34: "separación galvánica total, con kilovoltios de aislamiento"
  35: "conmuta cualquier cosa"
  37: "de 20 a 100 mA en los pequeños"
  38: "un relé de 10 A a 250 V alterna puede estar limitado a 30 V en continua"
  41: "Para señales de microamperios existen los contactos de baja señal, con recubrimiento de oro."
  43: "Sin él, cada desconexión produce un pico que destruye el transistor. No es opcional."
  44: "Un Zener en serie acelera la extinción y alarga la vida de los contactos"
  46: "Diodo en paralelo con la carga, en continua, que es la solución completa."
  47: "puede durar unas pocas miles de operaciones en lugar de cientos de miles"
  49: "aumenta la resistencia y aparecen calentamiento y fallos intermitentes"
  50: "Es el fallo peligroso: el relé no abre"
  51: "Bobina abierta, que se detecta midiendo su resistencia."
  52: "acumula óxido y falla"
  56: "esa diferencia es su histéresis"
  57: "mirar el pico de la bobina al desconectar con y sin diodo"
  58: "El relé electromecánico, con sus contactos y el diodo de rueda libre de protección."
  59: "El pico de la bobina con y sin diodo de rueda libre"
  60: "la armadura empuja la lámina del contacto móvil contra el contacto fijo"

modelo: { valores: {}, calculos: {} }

tarjetas:
  - id: explore-rele
    tipo: explorar
    titulo: "Un electroimán que mueve contactos"
    texto: "Un pin del microcontrolador gobierna un transistor, el transistor la bobina y la bobina los contactos. Toque cada parte."
    libro: [34, 37, 58]
    widget:
      tipo: figura
      figura: fig-20.4
      zonas:
        - { id: bobina, rotulo: "Bobina del centro", rect: [110, 85, 35, 40], texto: "La bobina: de 20 a 100 mA en los relés pequeños, lo que fija el transistor que la gobierna." }
        - { id: diodo, rotulo: "Diodo de la izquierda", rect: [55, 70, 55, 70], texto: "El diodo de rueda libre, en paralelo con la bobina." }
        - { id: transistor, rotulo: "Transistor de abajo", rect: [100, 155, 45, 45], texto: "El transistor que conmuta la bobina desde el pin del microcontrolador." }
        - { id: contactos, rotulo: "Contactos de la derecha", rect: [205, 70, 105, 90], texto: "Los contactos: separación galvánica total, kilovoltios de aislamiento y miliohmios de resistencia." }
    requiere: { mover: [bobina, contactos] }

  - id: explore-foto
    tipo: explorar
    titulo: "Por dentro"
    texto: "Un relé sin su carcasa. Toque la bobina, la armadura y los dos contactos."
    libro: [60]
    widget:
      tipo: figura
      figura: fig-20.6
      zonas:
        - { id: bobina, rotulo: "Cilindro de cobre de la izquierda", rect: [150, 225, 290, 630], texto: "La bobina: al excitarla, atrae la armadura." }
        - { id: armadura, rotulo: "Pieza metálica del centro", rect: [500, 170, 90, 430], texto: "La armadura: empuja la lámina del contacto móvil." }
        - { id: movil, rotulo: "Lámina de la izquierda, a la derecha", rect: [825, 290, 55, 560], texto: "El contacto móvil." }
        - { id: fijo, rotulo: "Lámina de la derecha", rect: [895, 290, 55, 560], texto: "El contacto fijo, contra el que se cierra el móvil." }
    requiere: { mover: [bobina, armadura] }

  - id: virtud
    tipo: pregunta
    titulo: "Lo que ningún estado sólido iguala"
    texto: "¿Qué virtud del relé no iguala ninguna solución de estado sólido?"
    libro: [34, 35]
    widget:
      tipo: figura
      figura: fig-20.4
      zonas:
        - { id: contactos, rotulo: "Contactos de la derecha", rect: [205, 70, 105, 90] }
    opciones:
      - texto: "Separación galvánica total y miliohmios de contacto"
        bien: true
        porque: "Kilovoltios de aislamiento y una resistencia de contacto que no depende de la corriente."
      - texto: "Su velocidad"
        porque: "Al contrario: conmuta en milisegundos, mucho más despacio que el estado sólido."
      - texto: "Su vida ilimitada"
        porque: "Tiene vida en ciclos limitada, y menor aún con carga."
    escalera:
      - "Piense en lo que hay entre la bobina y los contactos."
    solucion: "Separación galvánica total, con miliohmios de contacto."

  - id: porque-continua
    tipo: porque
    titulo: "Alterna frente a continua"
    texto: "Un relé de 10 A a 250 V en alterna puede estar limitado a 30 V en continua. ¿Por qué?"
    libro: [38]
    widget:
      tipo: figura
      figura: fig-20.4
      zonas:
        - { id: contactos, rotulo: "Contactos de la derecha", rect: [205, 70, 105, 90] }
    opciones:
      - texto: "En continua, el arco no se apaga solo"
        bien: true
        porque: "En alterna se apaga en cada paso por cero; en continua sigue y quema los contactos."
      - texto: "La continua tiene más tensión de pico"
        porque: "No es la tensión de pico: es que el arco no encuentra un paso por cero."
      - texto: "La bobina se calienta más en continua"
        porque: "La bobina no cambia; lo que cambia es el arco en los contactos."
    escalera:
      - "¿Qué pasa en alterna cada medio ciclo que en continua no pasa?"
    solucion: "En alterna el arco se apaga solo en cada paso por cero; en continua no."

  - id: toque-diodo
    tipo: tocar
    titulo: "Lo que no es opcional"
    texto: "La bobina es una carga inductiva pura. Toque lo que impide que cada desconexión destruya el transistor."
    libro: [43]
    widget:
      tipo: figura
      figura: fig-20.4
      zonas:
        - { id: bobina, rotulo: "Bobina del centro", rect: [110, 85, 35, 40] }
        - { id: diodo, rotulo: "Diodo de la izquierda", rect: [55, 70, 55, 70] }
        - { id: transistor, rotulo: "Transistor de abajo", rect: [100, 155, 45, 45] }
        - { id: resistencia, rotulo: "Resistencia de base", rect: [50, 160, 35, 25] }
        - { id: contactos, rotulo: "Contactos de la derecha", rect: [205, 70, 105, 90] }
    tocar:
      bien: [diodo]
      porque:
        bobina: "La bobina es la que produce el pico al cortar su corriente."
        transistor: "El transistor es lo que hay que proteger."
        resistencia: "La resistencia de base limita la corriente del pin, no el pico de la bobina."
        contactos: "Los contactos van en el lado de la carga; el pico está en el lado de la bobina."
    exito: "El diodo de rueda libre: da salida a la corriente de la bobina al cortar."
    escalera:
      - "Busque lo que está en paralelo con la bobina."
    solucion: "El diodo de rueda libre, a la izquierda."

  - id: toque-pico
    tipo: tocar
    titulo: "El pico, medido"
    texto: "La tensión en el colector al cortar, con y sin diodo. Toque la traza que destruye el transistor."
    libro: [57, 59]
    widget:
      tipo: figura
      figura: fig-20.5
      zonas:
        - { id: sin, rotulo: "Gráfica de arriba a la izquierda", rect: [38, 20, 212, 82] }
        - { id: con, rotulo: "Gráfica de abajo a la izquierda", rect: [38, 128, 212, 82] }
        - { id: tabla, rotulo: "Tabla de la derecha", rect: [265, 35, 185, 165] }
    tocar:
      bien: [sin]
      porque:
        con: "Con el diodo, el colector apenas pasa de la alimentación mientras la corriente decae."
        tabla: "La tabla compara relé y estado sólido; el pico está en las gráficas."
    exito: "Sin diodo, un pico de cientos de voltios en el instante del corte."
    escalera:
      - "Mire la escala vertical de cada gráfica."
    solucion: "La gráfica de arriba, sin diodo."

  - id: zener
    tipo: pregunta
    titulo: "Un Zener en serie con el diodo"
    texto: "Con un diodo simple la corriente de la bobina decae despacio. ¿Qué aporta un Zener en serie con él?"
    libro: [44]
    widget:
      tipo: figura
      figura: fig-20.5
      zonas:
        - { id: con, rotulo: "Gráfica de abajo a la izquierda", rect: [38, 128, 212, 82] }
    opciones:
      - texto: "Abre antes y alarga la vida de los contactos, con un pico mayor"
        bien: true
        porque: "Acelera la extinción; el precio es un pico mayor que el transistor debe soportar."
      - texto: "Elimina el pico por completo"
        porque: "Al contrario: el pico es mayor que con el diodo solo."
      - texto: "Nada: el diodo ya lo hace todo"
        porque: "El diodo simple retarda la apertura y aumenta el arco; el Zener lo acelera."
    escalera:
      - "¿Qué pasa con el arco si el relé tarda en abrir?"
    solucion: "Acelera la extinción y alarga la vida de los contactos, a costa de un pico mayor."

  - id: empareje-contactos
    tipo: pregunta
    titulo: "Proteger los contactos"
    texto: "Si la carga es inductiva, al abrirla se forma un arco. Empareje cada caso con su protección."
    libro: [46, 47]
    widget:
      tipo: figura
      figura: fig-20.4
      zonas:
        - { id: contactos, rotulo: "Contactos de la derecha", rect: [205, 70, 105, 90] }
    emparejar:
      - ["En continua", "Diodo en paralelo con la carga"]
      - ["En alterna", "Red RC (snubber)"]
      - ["Energías mayores", "Varistor"]
    exito: "Sin protección, un relé que conmuta un motor dura miles de operaciones en lugar de cientos de miles."
    pistas:
      - { texto: "En alterna el diodo no sirve: conduciría en cada semiciclo." }
    escalera:
      - "Empiece por la continua: es la solución completa."
    solucion: "Continua, diodo; alterna, red RC; energías mayores, varistor."

  - id: empareje-fallos
    tipo: pregunta
    titulo: "Los modos de fallo"
    texto: "Empareje cada modo de fallo de un relé con lo que produce."
    libro: [49, 50, 51, 52]
    widget:
      tipo: figura
      figura: fig-20.6
      zonas:
        - { id: contactos, rotulo: "Las dos láminas de la derecha", rect: [825, 290, 125, 560] }
    emparejar:
      - ["Contactos erosionados", "Calentamiento y fallos intermitentes"]
      - ["Contactos pegados", "El relé no abre: el fallo peligroso"]
      - ["Bobina abierta", "Se detecta midiendo su resistencia"]
      - ["Corriente mínima insuficiente", "Óxido que acaba haciendo fallar el contacto"]
    exito: "Los circuitos de seguridad usan contactos guiados y verificación de apertura."
    pistas:
      - { texto: "Un arco intenso puede soldar los contactos." }
    escalera:
      - "¿Cuál de los fallos deja de cumplir una función de seguridad?"
    solucion: "Erosionados, calor; pegados, no abre; bobina abierta, se mide; poca corriente, óxido."

  - id: microamperios
    tipo: pregunta
    titulo: "Señales de microamperios"
    texto: "Hay que conmutar una señal de microamperios con un relé. ¿Qué contactos conviene?"
    libro: [41, 52]
    widget:
      tipo: figura
      figura: fig-20.6
      zonas:
        - { id: contactos, rotulo: "Las dos láminas de la derecha", rect: [825, 290, 125, 560] }
    opciones:
      - texto: "De baja señal, con recubrimiento de oro"
        bien: true
        porque: "Los contactos de potencia necesitan unos miliamperios para romper su película de óxido."
      - texto: "Los de un relé de potencia, que aguantan más"
        porque: "Con microamperios no rompen el óxido: acumulan óxido y fallan."
      - texto: "Da igual: un relé no distingue"
        porque: "Conmuta cualquier cosa, pero con una corriente mínima en sus contactos."
    escalera:
      - "¿Qué necesita un contacto para romper la película de óxido?"
    solucion: "Contactos de baja señal, dorados."

  - id: histeresis
    tipo: predecir
    titulo: "En el banco"
    texto: "Se sube la tensión de la bobina despacio hasta que conmuta y luego se baja hasta que suelta. ¿Qué se observa?"
    libro: [56]
    widget:
      tipo: figura
      figura: fig-20.4
      zonas:
        - { id: bobina, rotulo: "Bobina del centro", rect: [110, 85, 35, 40] }
    opciones:
      - texto: "Activa bastante por debajo de la nominal y suelta aún más abajo"
        bien: true
        porque: "Esa diferencia entre activación y liberación es su histéresis."
      - texto: "Activa y suelta justo a la tensión nominal"
        porque: "La de activación suele ser bastante menor que la nominal."
      - texto: "Suelta a una tensión mayor que la de activación"
        porque: "Es al revés: la de liberación es todavía menor."
    escalera:
      - "Una vez atraída la armadura, ¿cuesta más o menos retenerla?"
    solucion: "Activa por debajo de la nominal y suelta aún más abajo: histéresis."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [34, 38, 43, 50]
    ideas:
      - { titulo: "El relé.", texto: "Aislamiento total, miliohmios y conmuta cualquier cosa." }
      - { titulo: "Al elegirlo.", texto: "Contactos por separado para alterna y continua: en continua el arco no se apaga solo." }
      - { titulo: "Protecciones.", texto: "Diodo de rueda libre en la bobina; diodo, RC o varistor en los contactos." }
      - { titulo: "El fallo peligroso.", texto: "Contactos pegados: el relé no abre." }
