# Lección 1.2 de la sección 19.9 «Interruptores, Pulsadores y Encoders» (cap20; sec-20.N = impresas 19.(N − 1)).
# - Los rebotes y las señales en cuadratura de la figura 19.15 (fig-20.16), con zonas.
# - El antirrebote por hardware (bloque 237): 10 kΩ y 1 µF, 10 ms de constante, en el esquema «carga-rc». La tensión
#   de 5 V es de ejemplo (el libro no la da aquí); la forma de la carga es lo que importa.
# - La secuencia de cuadratura 00, 01, 11, 10 (bloque 242).
# Paso práctico: «dibujar» la carga del condensador del antirrebote RC durante 50 ms.
leccion: cap20/sec-20.10

libro:
  235: "rebota durante 1 a 20 ms produciendo decenas de transiciones"
  237: "un filtro de 10 kΩ y 1 µF (10 ms de constante) seguido de un disparador de Schmitt"
  238: "el primer contacto que toque fija el biestable y los rebotes posteriores no lo cambian"
  239: "se hace con una marca de tiempo, no con una espera"
  241: "la secuencia de las dos señales indica el sentido de giro"
  242: "Las cuatro combinaciones (00, 01, 11, 10)"
  243: "una transición ilegal solo puede ser ruido"
  244: "es un desajuste entre el modelo y el código, no una avería"
  248: "sondear cada milisegundo basta y sobra"
  249: "Los ópticos y magnéticos no tienen contactos y no rebotan"
  254: "Medir su duración en el pulsador concreto que se va a usar"
  256: "Rebotes de un contacto mecánico y señales en cuadratura de un encoder incremental."

modelo:
  valores:
    V_c: { sim: "V", nombre: "tensión de ejemplo", unidad: V, valor: 5 }
    R_c: { sim: "R", nombre: "resistencia del filtro", unidad: Ω, valor: 10000 }
    C_c: { sim: "C", nombre: "condensador del filtro", unidad: F, valor: 1e-6 }
  calculos:
    tau_c: { expr: "R_c*C_c", sim: "τ", nombre: "constante de tiempo", unidad: s }
    t_5: { expr: "5*tau_c", sim: "5τ", nombre: "cinco constantes de tiempo", unidad: s }
    p_t: { expr: "(1 - exp(-1))*100", sim: "v(τ)/V", nombre: "fracción cargada en una constante", unidad: "%", cifras: 3 }
    v_tau: { expr: "0.632*V_c", sim: "v(τ)", nombre: "tensión en una constante de tiempo", unidad: V }

tarjetas:
  - id: explore-rebotes
    tipo: explorar
    titulo: "Un contacto no cierra de golpe"
    texto: "Las superficies chocan, se separan y vuelven a chocar antes de asentarse. Toque los rebotes y las dos señales del encoder."
    libro: [235, 256]
    widget:
      tipo: figura
      figura: fig-20.16
      zonas:
        - { id: rebotes, rotulo: "Tren de pulsos de arriba", rect: [118, 24, 112, 52], texto: "Los rebotes: decenas de transiciones en unos milisegundos." }
        - { id: asentado, rotulo: "Línea de arriba, a la derecha", rect: [232, 55, 200, 25], texto: "El contacto asentado." }
        - { id: a, rotulo: "Señal azul de abajo", rect: [33, 140, 405, 30], texto: "Señal A del encoder." }
        - { id: b, rotulo: "Señal verde de abajo", rect: [33, 172, 405, 32], texto: "Señal B: desfasada un cuarto de ciclo respecto a A." }
    requiere: { mover: [rebotes, b] }

  - id: prediga-contador
    tipo: predecir
    titulo: "Un pulsador en un contador"
    texto: "Un pulsador va directo a la entrada de un contador y se pulsa una sola vez. ¿Qué cuenta?"
    libro: [235]
    widget:
      tipo: figura
      figura: fig-20.16
      zonas:
        - { id: rebotes, rotulo: "Tren de pulsos de arriba", rect: [118, 24, 112, 52] }
    opciones:
      - texto: "Muchas pulsaciones: decenas de transiciones"
        bien: true
        porque: "El contacto rebota durante 1 a 20 ms, y el contador ve cada rebote."
      - texto: "Una"
        porque: "Así sería sin rebotes; un contacto mecánico rebota antes de asentarse."
      - texto: "Ninguna"
        porque: "Las transiciones llegan, y de sobra: cada rebote es una."
    escalera:
      - "¿Qué ve el contador mientras el contacto rebota?"
    solucion: "Decenas de transiciones: cuenta de más."

  - id: empareje-antirrebote
    tipo: pregunta
    titulo: "Tres formas de tratarlo"
    texto: "Empareje cada antirrebote con su uso."
    libro: [237, 238, 239]
    widget:
      tipo: figura
      figura: fig-20.16
      zonas:
        - { id: rebotes, rotulo: "Tren de pulsos de arriba", rect: [118, 24, 112, 52] }
    emparejar:
      - ["RC y disparador de Schmitt", "El contacto alimenta lógica o un contador"]
      - ["Latch SR", "Pulsador de dos posiciones"]
      - ["Por software", "Con microcontrolador, ignorando la entrada un rato"]
    exito: "El latch es el más elegante: el primer contacto fija el biestable."
    pistas:
      - { texto: "El latch necesita dos contactos." }
    escalera:
      - "¿Cuál no necesita ningún componente?"
    solucion: "RC y Schmitt para lógica; latch con conmutador doble; software con microcontrolador."

  - id: explore-rc
    tipo: explorar
    titulo: "El filtro RC"
    texto: "10 kΩ y 1 µF dan 10 ms de constante: el condensador sube despacio y el Schmitt convierte la rampa en un flanco limpio."
    nota: "Tensión de ejemplo."
    libro: [237]
    widget:
      tipo: circuito
      esquema: carga-rc
      piezas: { fuente: V_c, r: R_c, c: C_c }
      lectura: { valor: tau_c, rotulo: "Constante de tiempo" }
      grafica:
        x: { id: t, min: 0, max: 0.05, unidad: s, rotulo: "t" }
        y: { min: 0, max: 5.5, unidad: V, rotulo: "v" }
        curvas:
          - { expr: "V_c*(1 - exp(-t/tau_c))", color: naranja, rotulo: "v_{C}", mide: vc }
        marcas:
          - { x: "tau_c", y: "v_tau", rotulo: "τ" }
      mandos:
        - { valor: R_c, lista: [4700, 10000, 22000] }
    requiere: { mover: [R_c] }
    comprobar:
      - { con: { R_c: 10000 }, tau_c: 0.01 }

  - id: dibuje-rc
    tipo: dibujar
    titulo: "Dibuje la rampa"
    texto: "Con 10 kΩ y 1 µF, dibuje la tensión del condensador durante los primeros 50 ms tras cerrar el contacto."
    nota: "5 V de ejemplo."
    libro: [237]
    fijar: { V_c: 5, R_c: 10000, C_c: 1e-6 }
    dibujar:
      x: { id: t, min: 0, max: 0.05, unidad: s, rotulo: "t" }
      y: { min: 0, max: 5.5, unidad: V, rotulo: "v_{C}" }
      curva: "V_c*(1 - exp(-t/tau_c))"
      puntos: 11
      tol: 0.08
      holgura: 0.03
      rotulo: "Carga del condensador del antirrebote"
    exito: "Una exponencial: el 63 % en 10 ms y casi entera en 50. Los rebotes, de unos milisegundos, no llegan a moverla."
    pistas:
      - { cuando: { valor: desfase, mayor: 0.05 }, texto: "Sube demasiado tarde: en 10 ms ya va por el 63 %." }
      - { texto: "Empieza en cero, sube deprisa al principio y se acerca a 5 V sin pasarlo." }
    escalera:
      - "¿Cuánto vale en una constante de tiempo, 10 ms?"
      - "En cinco constantes, 50 ms, está casi entera."
    solucion: "v_{C} = 5 · (1 − e^{−t/10 ms}): 3,16 V en 10 ms y casi 5 V en 50 ms."
    comprobar:
      - { tau_c: 0.01, v_tau: 3.16, t_5: 0.05, p_t: 63.2 }

  - id: sin-bloquear
    tipo: pregunta
    titulo: "Por software, sin bloquear"
    texto: "Por software, al detectar un cambio se ignora la entrada 20 ms. ¿Cómo se hace sin bloquear el programa?"
    libro: [239]
    widget:
      tipo: figura
      figura: fig-20.16
      zonas:
        - { id: graf, rotulo: "Gráfica de los rebotes", rect: [33, 20, 405, 60] }
    opciones:
      - texto: "Con una marca de tiempo"
        bien: true
        porque: "Se apunta cuándo cambió y se ignora la entrada hasta que pasen 20 ms, sin detener nada."
      - texto: "Con una espera de 20 ms"
        porque: "Una espera bloquea el programa: es justo lo que hay que evitar."
      - texto: "Leyendo la entrada sin parar"
        porque: "Leería todos los rebotes."
    escalera:
      - "¿Qué permite saber que han pasado 20 ms sin quedarse esperando?"
    solucion: "Con una marca de tiempo, no con una espera."

  - id: ordene-cuadratura
    tipo: pregunta
    titulo: "La secuencia en cuadratura"
    texto: "Al girar el encoder en un sentido, las dos señales recorren las cuatro combinaciones AB. Ordénelas desde 00."
    libro: [241, 242]
    widget:
      tipo: figura
      figura: fig-20.16
      zonas:
        - { id: graf, rotulo: "Gráfica del encoder", rect: [33, 125, 405, 85] }
    ordenar:
      - "00"
      - "01"
      - "11"
      - "10"
    exito: "Solo cambia un bit cada vez; en el sentido contrario, la secuencia se recorre al revés."
    pistas:
      - { texto: "Entre dos combinaciones seguidas cambia una sola señal." }
    escalera:
      - "Desde 00, ¿cuál de las dos señales sube primero en la figura?"
    solucion: "00, 01, 11, 10."

  - id: porque-ilegal
    tipo: porque
    titulo: "Rechazar los rebotes"
    texto: "La cuadratura permite rechazar los rebotes de un encoder, cosa que un contacto simple no puede. ¿Por qué?"
    libro: [243]
    widget:
      tipo: figura
      figura: fig-20.16
      zonas:
        - { id: graf, rotulo: "Gráfica del encoder", rect: [33, 125, 405, 85] }
    opciones:
      - texto: "Un rebote produce una transición ilegal, que solo puede ser ruido"
        bien: true
        porque: "El propio protocolo dice qué transiciones son válidas; las demás se descartan."
      - texto: "Porque los encoders no rebotan"
        porque: "Los mecánicos rebotan mucho; los que no rebotan son los ópticos y magnéticos."
      - texto: "Porque tiene dos señales y se promedian"
        porque: "No se promedian: se comprueba que cada transición sea una de las legales."
    escalera:
      - "Desde 00, ¿a qué combinaciones se puede pasar legalmente?"
    solucion: "Una transición ilegal solo puede ser ruido, y se descarta."

  - id: prediga-detente
    tipo: predecir
    titulo: "Un mando demasiado sensible"
    texto: "Cada detente del encoder es un ciclo completo de cuadratura y el firmware cuenta cuatro pasos por ciclo. ¿Qué nota el usuario?"
    libro: [244]
    widget:
      tipo: figura
      figura: fig-20.16
      zonas:
        - { id: graf, rotulo: "Gráfica del encoder", rect: [33, 125, 405, 85] }
    opciones:
      - texto: "Que el mando es «demasiado sensible»: no es una avería"
        bien: true
        porque: "Es un desajuste entre el modelo del encoder y el código."
      - texto: "Que el encoder está roto"
        porque: "Funciona bien: cuenta cuatro pasos donde el usuario espera uno."
      - texto: "Nada"
        porque: "Cada clic avanza cuatro: se nota enseguida."
    escalera:
      - "¿Cuántos pasos espera el usuario por cada clic?"
    solucion: "Un mando «demasiado sensible», por un desajuste entre modelo y código."

  - id: leer-encoder
    tipo: pregunta
    titulo: "Leer un encoder manual"
    texto: "Un encoder de mando, girado a mano, en un programa con un bucle rápido. ¿Cómo se lee?"
    libro: [248, 249]
    widget:
      tipo: figura
      figura: fig-20.17
      zonas:
        - { id: foto, rotulo: "La foto del encoder", rect: [0, 0, 1600, 1200] }
    opciones:
      - texto: "Por sondeo: cada milisegundo basta y sobra"
        bien: true
        porque: "Evita la complejidad de las interrupciones."
      - texto: "Por interrupción, siempre"
        porque: "Las interrupciones son para encoders rápidos o programas ocupados."
      - texto: "Una vez por segundo"
        porque: "Demasiado lento: perdería pasos al girarlo deprisa."
    escalera:
      - "¿Gira deprisa un mando movido a mano?"
    solucion: "Por sondeo, cada milisegundo."

  - id: banco-rebote
    tipo: pregunta
    titulo: "En el banco"
    texto: "Va a dimensionar el antirrebote de un pulsador concreto. ¿Qué hace primero?"
    libro: [254]
    widget:
      tipo: figura
      figura: fig-20.16
      zonas:
        - { id: rebotes, rotulo: "Tren de pulsos de arriba", rect: [118, 24, 112, 52] }
    opciones:
      - texto: "Medir sus rebotes con el osciloscopio en disparo único"
        bien: true
        porque: "Medir la duración en el pulsador que se va a usar, en lugar de copiar un valor genérico."
      - texto: "Copiar los 20 ms del libro"
        porque: "Son un valor genérico; lo que vale es lo que rebota su pulsador."
      - texto: "Mirarlo con el multímetro"
        porque: "Los rebotes duran milisegundos: el multímetro no los ve."
    escalera:
      - "¿Con qué instrumento se captura un suceso que ocurre una vez y dura milisegundos?"
    solucion: "Osciloscopio en disparo único sobre el contacto."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [235, 237, 242, 243]
    ideas:
      - { titulo: "Los rebotes.", texto: "De 1 a 20 ms y decenas de transiciones." }
      - { titulo: "El antirrebote.", texto: "RC y Schmitt, latch SR, o software con marca de tiempo." }
      - { titulo: "La cuadratura.", texto: "00, 01, 11, 10: el orden da el sentido y una transición ilegal es ruido." }
      - { titulo: "Medir.", texto: "La duración real de los rebotes del pulsador concreto." }
