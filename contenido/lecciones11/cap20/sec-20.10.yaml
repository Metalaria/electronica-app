# Lección 1.2 de la sección 19.9 «Interruptores, Pulsadores y Encoders» (cap20; sec-20.N = impresas 19.(N − 1)).
# - Los rebotes y las señales en cuadratura de la figura 19.15 (fig-20.16), con zonas.
# - El antirrebote por hardware (bloque 237): 10 kΩ y 1 µF, 10 ms de constante, en el esquema «carga-rc». La tensión
#   de 5 V es de ejemplo (el libro no la da aquí); la forma de la carga es lo que importa.
# - La secuencia de cuadratura 00, 01, 11, 10 (bloque 242).
# Paso práctico: «dibujar» la carga del condensador del antirrebote RC durante 50 ms.
# 1.2.1 (autor121-sens, «aprender haciendo», GUIA §13): el latch SR del antirrebote (dos NAND cruzadas) se vive en un
# circuito «logica»; el RC se explora hasta 10 ms; en un fragmento propio (ilustra el bloque 239) se toca la línea que
# ignora la entrada sin bloquear; la cuadratura sale de un contador de dos bits (A = q1, B = q1 XOR q0) y se lleva a
# 10; se escriben los pasos por ciclo. El contador que cuenta rebotes pasa al explorar; el sondeo y el banco, al
# resumen. Queda una pregunta de opciones: la transición ilegal.
# 1.3 (contenido13): la cuadratura recupera su cronograma (A y B desfasadas un paso; con objetivo ya no quita el
# botón de pulso, GUIA §13.3).
leccion: cap20/sec-20.10

libro:
  235: "rebota durante 1 a 20 ms produciendo decenas de transiciones"
  237: "un filtro de 10 kΩ y 1 µF (10 ms de constante) seguido de un disparador de Schmitt"
  238: "el primer contacto que toque fija el biestable y los rebotes posteriores no lo cambian"
  239: "se hace con una marca de tiempo, no con una espera"
  241: "la secuencia de las dos señales indica el sentido de giro"
  242: "Las cuatro combinaciones (00, 01, 11, 10)"
  243: "una transición ilegal solo puede ser ruido"
  244: "es un desajuste entre el modelo y el código, no una avería"
  248: "sondear cada milisegundo basta y sobra"
  249: "Los ópticos y magnéticos no tienen contactos y no rebotan"
  254: "Medir su duración en el pulsador concreto que se va a usar"
  256: "Rebotes de un contacto mecánico y señales en cuadratura de un encoder incremental."

modelo:
  valores:
    V_c: { sim: "V", nombre: "tensión de ejemplo", unidad: V, valor: 5 }
    R_c: { sim: "R", nombre: "resistencia del filtro", unidad: Ω, valor: 10000 }
    C_c: { sim: "C", nombre: "condensador del filtro", unidad: F, valor: 1e-6 }
  calculos:
    tau_c: { expr: "R_c*C_c", sim: "τ", nombre: "constante de tiempo", unidad: s }
    t_5: { expr: "5*tau_c", sim: "5τ", nombre: "cinco constantes de tiempo", unidad: s }
    p_t: { expr: "(1 - exp(-1))*100", sim: "v(τ)/V", nombre: "fracción cargada en una constante", unidad: "%", cifras: 3 }
    v_tau: { expr: "0.632*V_c", sim: "v(τ)", nombre: "tensión en una constante de tiempo", unidad: V }
    n_q: { expr: "4", sim: "n", nombre: "combinaciones por ciclo", unidad: "" }

tarjetas:
  - id: explore-rebotes
    tipo: explorar
    titulo: "Un contacto no cierra de golpe"
    texto: "Las superficies chocan, se separan y vuelven a chocar antes de asentarse. Toque los rebotes y las dos señales del encoder."
    libro: [235, 256]
    widget:
      tipo: figura
      figura: fig-20.16
      zonas:
        - { id: rebotes, rotulo: "Tren de pulsos de arriba", rect: [118, 24, 112, 52], texto: "Los rebotes: decenas de transiciones en unos milisegundos. Un contador conectado directamente las cuenta todas." }
        - { id: asentado, rotulo: "Línea de arriba, a la derecha", rect: [232, 46, 200, 38], texto: "El contacto asentado." }
        - { id: a, rotulo: "Señal azul de abajo", rect: [33, 134, 405, 37], texto: "Señal A del encoder." }
        - { id: b, rotulo: "Señal verde de abajo", rect: [33, 172, 405, 38], texto: "Señal B: desfasada un cuarto de ciclo respecto a A." }
    requiere: { mover: [rebotes, b] }

  - id: empareje-antirrebote
    tipo: explorar
    titulo: "El latch SR"
    texto: "Un conmutador de dos contactos ataca un latch SR de dos NAND. Lleve el conmutador al otro contacto, con rebotes incluidos, y deje la salida a 1."
    libro: [238]
    widget:
      tipo: logica
      entradas:
        - { id: S, valor: 1, rotulo: "Contacto S (0 = tocando)" }
        - { id: R, valor: 0, rotulo: "Contacto R (0 = tocando)" }
      piezas:
        - { id: n1, tipo: nand, entradas: [S, n2] }
        - { id: n2, tipo: nand, entradas: [R, n1] }
      salidas:
        - { id: Q, de: n1, rotulo: "Salida" }
    objetivo:
      condiciones:
        - { led: Q, valor: 1, rotulo: "Salida a 1" }
      logrado: "El primer toque de S fija el biestable, y los rebotes, que solo sueltan y vuelven a tocar S, ya no lo cambian. Es el antirrebote más elegante, si el conmutador tiene dos contactos."
      pistas:
        - { texto: "Suelte R y toque S: pruebe a soltar y volver a tocar S, como un rebote." }
    escalera:
      - "Un NAND con una entrada a 0 da 1."
    solucion: "R suelto (1) y S tocando (0)."

  - id: explore-rc
    tipo: explorar
    titulo: "El filtro RC"
    texto: "Con 1 µF, el condensador sube despacio y el Schmitt convierte la rampa en un flanco limpio. Elija R para 10 ms de constante."
    nota: "Tensión de ejemplo."
    libro: [237]
    inicio: { R_c: 4700 }
    widget:
      tipo: circuito
      esquema: carga-rc
      piezas: { fuente: V_c, r: R_c, c: C_c }
      lectura: { valor: tau_c, rotulo: "Constante de tiempo" }
      grafica:
        x: { id: t, min: 0, max: 0.05, unidad: s, rotulo: "t" }
        y: { min: 0, max: 5.5, unidad: V, rotulo: "v" }
        curvas:
          - { expr: "V_c*(1 - exp(-t/tau_c))", color: naranja, rotulo: "v_{C}", mide: vc }
        marcas:
          - { x: "tau_c", y: "v_tau", rotulo: "τ" }
      mandos:
        - { valor: R_c, lista: [4700, 10000, 22000] }
    objetivo:
      condiciones:
        - { valor: tau_c, objetivo: 0.01, tol: 0.01, rotulo: "τ = {{tau_c}}" }
      logrado: "10 kΩ y 1 µF: τ = R·C = 10 ms. Los rebotes duran milisegundos y apenas mueven la rampa."
      pistas:
        - { texto: "τ = R·C: con 1 µF, ¿qué R da 10 ms?" }
    escalera:
      - "τ = R · C."
    solucion: "10 kΩ."
    comprobar:
      - { con: { R_c: 10000 }, tau_c: 0.01 }

  - id: dibuje-rc
    tipo: dibujar
    titulo: "Dibuje la rampa"
    texto: "Con 10 kΩ y 1 µF, dibuje la tensión del condensador durante los primeros 50 ms tras cerrar el contacto."
    nota: "5 V de ejemplo."
    libro: [237]
    fijar: { V_c: 5, R_c: 10000, C_c: 1e-6 }
    dibujar:
      x: { id: t, min: 0, max: 0.05, unidad: s, rotulo: "t" }
      y: { min: 0, max: 5.5, unidad: V, rotulo: "v_{C}" }
      curva: "V_c*(1 - exp(-t/tau_c))"
      puntos: 11
      tol: 0.08
      holgura: 0.03
      rotulo: "Carga del condensador del antirrebote"
    exito: "Una exponencial: el 63 % en 10 ms y casi entera en 50. Los rebotes, de unos milisegundos, no llegan a moverla."
    pistas:
      - { cuando: { valor: desfase, mayor: 0.05 }, texto: "Sube demasiado tarde: en 10 ms ya va por el 63 %." }
      - { texto: "Empieza en cero, sube deprisa al principio y se acerca a 5 V sin pasarlo." }
    escalera:
      - "¿Cuánto vale en una constante de tiempo, 10 ms?"
      - "En cinco constantes, 50 ms, está casi entera."
    solucion: "v_{C} = 5 · (1 − e^{−t/10 ms}): 3,16 V en 10 ms y casi 5 V en 50 ms."
    comprobar:
      - { tau_c: 0.01, v_tau: 3.16, t_5: 0.05, p_t: 63.2 }

  - id: sin-bloquear
    tipo: tocar
    titulo: "Por software, sin bloquear"
    texto: "Por software, al detectar un cambio se ignora la entrada 20 ms. Toque la línea que lo hace sin detener el programa."
    libro: [239]
    widget:
      tipo: figura
      codigo:
        lenguaje: c
        texto: |
          if (digitalRead(PIN) != ultimo) {
            delay(20);
            ultimo = digitalRead(PIN);
          }
          if (digitalRead(PIN) != ultimo && millis() - tCambio >= 20) {
            tCambio = millis();
            ultimo = !ultimo;
          }
      zonas:
        - { id: l1, lineas: [1], rotulo: "Primera línea" }
        - { id: l2, lineas: [2], rotulo: "Segunda línea" }
        - { id: l5, lineas: [5], rotulo: "Quinta línea" }
        - { id: l7, lineas: [7], rotulo: "Séptima línea" }
    tocar:
      bien: [l5]
      porque:
        l1: "Detecta el cambio, pero no ignora nada."
        l2: "Ignora la entrada 20 ms, pero bloqueando: mientras espera, el programa no hace nada más."
        l7: "Cambia el estado guardado; lo que ignora los rebotes está antes."
    exito: "Con una marca de tiempo, no con una espera: se apunta cuándo cambió y se ignora la entrada hasta que pasen 20 ms."
    escalera:
      - "Busque la línea que compara con millis()."
    solucion: "La quinta."

  - id: ordene-cuadratura
    tipo: explorar
    titulo: "La secuencia en cuadratura"
    texto: "Al girar el encoder, cada pulso es un paso. Dé pulsos desde 00 hasta que A valga 1 y B 0, y fíjese en el orden de las combinaciones."
    libro: [241, 242]
    widget:
      tipo: logica
      entradas: [{ id: CLK, reloj: true, rotulo: "Un paso de giro" }]
      piezas:
        - { id: c1, tipo: contador, bits: 2, entradas: [CLK], rotulo: "Posición" }
        - { id: x1, tipo: xor, entradas: [c1.q1, c1.q0] }
      salidas:
        - { id: A, de: c1.q1, rotulo: "A" }
        - { id: B, de: x1, rotulo: "B" }
      cronograma: { ciclos: 4, senales: [CLK, A, B] }
    objetivo:
      condiciones:
        - { led: A, valor: 1, rotulo: "A = 1" }
        - { led: B, valor: 0, rotulo: "B = 0" }
      logrado: "00, 01, 11, 10: solo cambia una señal en cada paso. Girando al revés, la secuencia se recorre al revés: el orden da el sentido."
      pistas:
        - { texto: "Dé otro paso." }
    escalera:
      - "Entre dos combinaciones seguidas cambia una sola señal."
    solucion: "Tres pasos: 01, 11 y 10."

  - id: porque-ilegal
    tipo: porque
    titulo: "Rechazar los rebotes"
    texto: "La cuadratura permite rechazar los rebotes de un encoder, cosa que un contacto simple no puede. ¿Por qué?"
    libro: [243]
    widget:
      tipo: figura
      figura: fig-20.16
      zonas:
        - { id: graf, rotulo: "Gráfica del encoder", rect: [33, 125, 405, 85] }
    opciones:
      - texto: "Un rebote produce una transición ilegal, que solo puede ser ruido"
        bien: true
        porque: "El propio protocolo dice qué transiciones son válidas; las demás se descartan."
      - texto: "Porque los encoders no rebotan"
        porque: "Los mecánicos rebotan mucho; los que no rebotan son los ópticos y magnéticos."
      - texto: "Porque tiene dos señales y se promedian"
        porque: "No se promedian: se comprueba que cada transición sea una de las legales."
    escalera:
      - "Desde 00, ¿a qué combinaciones se puede pasar legalmente?"
    solucion: "Una transición ilegal solo puede ser ruido, y se descarta."

  - id: prediga-detente
    tipo: leer
    titulo: "Un mando demasiado sensible"
    texto: "Cada clic del mando es un ciclo completo de cuadratura, y el firmware cuenta un paso por cada combinación nueva. Escriba cuántos pasos cuenta por clic."
    libro: [242, 244]
    widget:
      tipo: figura
      figura: fig-20.16
      zonas:
        - { id: graf, rotulo: "Gráfica del encoder", rect: [33, 125, 405, 85], texto: "A y B, desfasadas un cuarto de ciclo." }
    leer:
      objetivo: n_q
      unidad: ""
      tol: 0.01
      rotulo: "Pasos por clic"
    exito: "Cuatro donde el usuario espera uno: el mando parece «demasiado sensible». No es una avería: es un desajuste entre el modelo del encoder y el código."
    escalera:
      - "¿Cuántas combinaciones tiene un ciclo?"
    solucion: "Cuatro: 00, 01, 11 y 10."
    comprobar:
      - { n_q: 4 }

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [235, 237, 242, 243, 248, 249, 254]
    ideas:
      - { titulo: "Los rebotes.", texto: "De 1 a 20 ms y decenas de transiciones." }
      - { titulo: "El antirrebote.", texto: "RC y Schmitt, latch SR, o software con marca de tiempo." }
      - { titulo: "La cuadratura.", texto: "00, 01, 11, 10: el orden da el sentido y una transición ilegal es ruido." }
      - { titulo: "Leer y medir.", texto: "Un mando, por sondeo cada milisegundo; los rebotes, con osciloscopio en disparo único sobre el pulsador concreto." }
