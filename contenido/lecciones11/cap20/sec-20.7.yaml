# Lección 1.2 de la sección 19.6 «Buses de Comunicación» (cap20; sec-20.N = impresas 19.(N − 1)).
# - Los tres buses de la figura 19.11 (fig-20.12), con zonas en cada bus, las selecciones de SPI y los dispositivos
#   de I²C. El ejercicio 19.2 (ocho sensores, pocos pines) sale del bloque de ejercicios (cap20#394).
# - Sin modelo de circuito: el dimensionado del pull-up es de la sección 45.4, que tiene su lección.
# Paso práctico: «tocar» en la figura 19.11 lo que cada esclavo SPI necesita para él solo.
# 1.2.1 (autor121-sens, «aprender haciendo», GUIA §13): en la figura 19.12 se toca el bus para un interlocutor lejano
# y las selecciones de SPI; se escriben los pines de SPI para ocho sensores; el bloqueo de I²C se vive en un circuito
# «logica» (tres salidas de drenador abierto en SDA, con pull-up); el flanco lento, en una carga RC viva con los 400 pF
# del límite de I²C (los pull-ups de 1 a 10 kΩ y el bit de 400 kHz son del autor). La elección por pines, el más lento y
# el bus robusto pasan al resumen. Queda una pregunta de opciones: la misma dirección.
leccion: cap20/sec-20.7

libro:
  156: "Con serie"
  149: "lo que un aficionado necesita decidir al montar un circuito con varios dispositivos"
  151: "¿Cuántos pines tengo y cuántos dispositivos hay?"
  152: "Pocos dispositivos y pines de sobra: SPI"
  154: "un pin de selección por dispositivo"
  155: "Y si hay dispositivos de 3,3 y de 5 V, un traductor bidireccional."
  158: "dos sensores del mismo modelo tienen la misma dirección de I²C y no pueden convivir"
  159: "Multiplexor I²C, que da varios buses aislados."
  162: "en I²C está limitada a 400 pF"
  163: "un dispositivo que solo admita 100 kHz obliga a todos"
  164: "un dispositivo que bloquee la línea tumba el bus entero"
  165: "un argumento a favor de SPI en sistemas donde la fiabilidad importe"
  167: "no se resuelve subiendo el pull-up"
  169: "flancos lentos (pull-up alto), niveles insuficientes (mezcla de tensiones) y ausencia de actividad (configuración o cableado)"
  170: "el escáner de direcciones antes de nada"
  171: "Los buses de comunicación más comunes: UART, SPI e I²C."
  "cap20#394": "Tienes que leer ocho sensores de temperatura distintos"

modelo:
  valores:
    n_s: { sim: "n", nombre: "sensores", unidad: "", valor: 8 }
    V_b: { sim: "V", nombre: "alimentación del bus", unidad: V, valor: 3.3 }
    R_pu: { sim: "R_{pull-up}", nombre: "pull-up", unidad: Ω, valor: 10000 }
    C_bu: { sim: "C", nombre: "capacidad del bus", unidad: F, valor: 400e-12 }
    f_400: { sim: "f", nombre: "reloj rápido de I²C", unidad: Hz, valor: 400000 }
  calculos:
    p_spi: { expr: "3 + n_s", sim: "p", nombre: "pines de SPI", unidad: "" }
    t_bit: { expr: "1/f_400", sim: "t_{bit}", nombre: "un bit a 400 kHz", unidad: s }
    tau_b: { expr: "R_pu*C_bu", sim: "τ", nombre: "constante del flanco", unidad: s }
    v_bit: { expr: "V_b*(1 - exp(-t_bit/tau_b))", sim: "v", nombre: "tensión al final del bit", unidad: V }
    fr_b: { expr: "100*(1 - exp(-t_bit/tau_b))", sim: "%", nombre: "fracción alcanzada en un bit", unidad: "%" }

tarjetas:
  - id: explore-buses
    tipo: explorar
    titulo: "Tres buses"
    texto: "Al montar un circuito con varios dispositivos hay que elegir cómo hablan. Toque cada bus."
    libro: [149, 171]
    widget:
      tipo: figura
      figura: fig-20.12
      zonas:
        - { id: uart, rotulo: "Parte izquierda", rect: [2, 5, 110, 135], texto: "UART: punto a punto, dos hilos y masa, sin reloj común." }
        - { id: spi, rotulo: "Parte central", rect: [120, 5, 160, 135], texto: "SPI: reloj y datos compartidos, y una selección por esclavo." }
        - { id: i2c, rotulo: "Parte derecha", rect: [282, 5, 168, 135], texto: "I²C: dos hilos para todos, con pull-ups; cada chip con su dirección." }
    requiere: { mover: [uart, spi, i2c] }

  - id: empareje-eleccion
    tipo: tocar
    titulo: "Un solo interlocutor"
    texto: "Hay que hablar con un único equipo, a cierta distancia. Toque el bus."
    libro: [151, 152, 156]
    widget:
      tipo: figura
      figura: fig-20.12
      zonas:
        - { id: uart, rotulo: "Parte izquierda", rect: [2, 5, 110, 135] }
        - { id: spi, rotulo: "Parte central", rect: [120, 5, 160, 135] }
        - { id: i2c, rotulo: "Parte derecha", rect: [282, 5, 168, 135] }
    tocar:
      bien: [uart]
      porque:
        spi: "SPI es para pocos dispositivos cerca, con pines de sobra."
        i2c: "I²C es para muchos dispositivos cerca, con pocos pines."
    exito: "Serie: punto a punto. Con velocidades coincidentes y, si hay distancia, un transceptor diferencial."
    escalera:
      - "¿Qué bus une solo a dos?"
    solucion: "La UART, a la izquierda."

  - id: ocho-sensores
    tipo: leer
    titulo: "Ocho sensores, pocos pines"
    texto: "Hay que leer ocho sensores de temperatura distintos. Escriba cuántos pines pediría SPI: reloj, dos de datos y una selección por sensor."
    libro: ["cap20#394", 152, 154]
    widget:
      tipo: figura
      figura: fig-20.12
      zonas:
        - { id: uart, rotulo: "Parte izquierda", rect: [2, 5, 110, 135] }
        - { id: spi, rotulo: "Parte central", rect: [120, 5, 160, 135] }
        - { id: i2c, rotulo: "Parte derecha", rect: [282, 5, 168, 135] }
    leer:
      objetivo: p_spi
      unidad: ""
      tol: 0.01
      rotulo: "Pines de SPI"
      errores:
        - { expr: "3*n_s", texto: "Reloj y datos se comparten: solo la selección es una por sensor." }
    exito: "Once, frente a las dos líneas de I²C, con un sensor por dirección. Con pocos pines libres, I²C."
    escalera:
      - "Tres compartidas más una por sensor."
    solucion: "Tres compartidas y ocho selecciones: 11 pines."
    comprobar:
      - { p_spi: 11, n_s: 8 }

  - id: toque-cs
    tipo: tocar
    titulo: "Lo que cada esclavo necesita"
    texto: "En SPI, reloj y datos son compartidos. Toque lo que cada esclavo necesita para él solo."
    libro: [154]
    widget:
      tipo: figura
      figura: fig-20.12
      zonas:
        - { id: cs1, rotulo: "Línea roja de arriba", rect: [156, 10, 78, 40] }
        - { id: bus, rotulo: "Haz azul del centro", rect: [190, 50, 45, 55] }
        - { id: cs2, rotulo: "Línea roja de abajo", rect: [156, 104, 78, 40] }
        - { id: maestro, rotulo: "Recuadro del maestro", rect: [122, 32, 38, 85] }
    tocar:
      bien: [cs1, cs2]
      todas: true
      porque:
        bus: "SCK, MOSI y MISO son compartidos por todos los esclavos."
        maestro: "El maestro es uno para todos; lo propio de cada esclavo es su selección."
    exito: "Una selección por dispositivo; y todos en el mismo modo de reloj."
    escalera:
      - "Busque las líneas que no se comparten: hay una por esclavo."
    solucion: "Las dos líneas rojas, CS1 y CS2."

  - id: misma-direccion
    tipo: pregunta
    titulo: "La misma dirección"
    texto: "Dos sensores del mismo modelo tienen la misma dirección de I²C, fija. ¿Qué es una salida válida?"
    libro: [158, 159]
    widget:
      tipo: figura
      figura: fig-20.12
      zonas:
        - { id: i2c, rotulo: "Parte derecha", rect: [282, 5, 168, 135] }
    opciones:
      - texto: "Un multiplexor I²C, que da varios buses aislados"
        bien: true
        porque: "Es una de las cuatro salidas, con pines de selección, dos buses o alimentar uno cada vez."
      - texto: "Subir los pull-ups"
        porque: "Los pull-ups no tienen nada que ver con las direcciones."
      - texto: "Conectarlos igual: el bus lo resuelve"
        porque: "No pueden convivir: los dos responderían a la vez."
    escalera:
      - "Si no pueden estar en el mismo bus, ¿cómo se les da un bus a cada uno?"
    solucion: "Un multiplexor I²C (o pines de selección, dos buses, o alimentar uno cada vez)."

  - id: porque-spi
    tipo: explorar
    titulo: "Cuando falla uno"
    texto: "En I²C todos sueltan o tiran de la misma línea SDA, con su pull-up. Haga que un sensor se quede bloqueado tirando de ella con el maestro soltándola."
    libro: [164, 165]
    widget:
      tipo: logica
      entradas:
        - { id: M, valor: 1, rotulo: "Maestro suelta" }
        - { id: S1, valor: 1, rotulo: "Sensor 1 suelta" }
        - { id: S2, valor: 1, rotulo: "Sensor 2 suelta" }
      piezas:
        - { id: dm, tipo: od, entradas: [M], rotulo: "Maestro" }
        - { id: d1, tipo: od, entradas: [S1], rotulo: "Sensor 1" }
        - { id: d2, tipo: od, entradas: [S2], rotulo: "Sensor 2" }
        - { id: sda, tipo: bus, entradas: [dm, d1, d2], pullup: 1, rotulo: "SDA" }
      salidas:
        - { id: LM, de: M, rotulo: "El maestro suelta" }
        - { id: SDA, de: sda, rotulo: "SDA" }
    objetivo:
      condiciones:
        - { led: LM, valor: 1, rotulo: "El maestro suelta" }
        - { led: SDA, valor: 0, rotulo: "SDA en bajo" }
      logrado: "Basta uno: la línea es compartida y nadie puede subirla. En I²C, un dispositivo que bloquee la línea tumba el bus entero; en SPI, uno averiado solo se afecta a sí mismo."
      pistas:
        - { texto: "Deje al maestro soltando y bloquee un sensor." }
    escalera:
      - "Con drenador abierto, cualquiera puede bajar la línea; nadie puede subirla."
    solucion: "Un sensor tirando, el maestro soltando."

  - id: empareje-patologias
    tipo: explorar
    titulo: "Flancos lentos"
    texto: "El pull-up carga la capacidad del bus, hasta 400 pF en I²C. Elija el pull-up con el que la línea llega casi a la alimentación dentro de un bit a 400 kHz."
    libro: [162, 169, 170]
    widget:
      tipo: circuito
      esquema: carga-rc
      piezas: { fuente: V_b, r: R_pu, c: C_bu }
      lectura: { valor: v_bit, rotulo: "Al final del bit" }
      grafica:
        x: { id: t, min: 0, max: 0.00001, unidad: s, rotulo: "t" }
        y: { min: 0, max: 3.6, unidad: V, rotulo: "v" }
        curvas:
          - { expr: "V_b*(1 - exp(-t/tau_b))", color: naranja, rotulo: "SDA", mide: vc }
        marcas:
          - { x: "t_bit", y: "v_bit", rotulo: "fin del bit" }
      mandos:
        - { valor: R_pu, lista: [1000, 2200, 4700, 10000], rotulo: "Pull-up" }
    objetivo:
      condiciones:
        - { valor: fr_b, min: 90, rotulo: "En un bit: {{fr_b}} de la alimentación" }
      logrado: "Con {{R_pu}}, el flanco cabe en el bit. Un pull-up alto da flancos lentos: es la primera patología que enseña el osciloscopio; las otras, niveles insuficientes y ausencia de actividad."
      pistas:
        - { texto: "El flanco es demasiado lento: baje el pull-up." }
    escalera:
      - "τ = R · C: menos R, flanco más rápido."
    solucion: "1 kΩ o 2,2 kΩ."
    comprobar:
      - { con: { R_pu: 2200 }, fr_b: 94.2, tol: 0.01 }

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [151, 154, 155, 163, 167]
    ideas:
      - { titulo: "La pregunta.", texto: "Pines frente a dispositivos: SPI si sobran pines, I²C si faltan, serie para uno lejos." }
      - { titulo: "SPI.", texto: "Una selección por dispositivo; uno averiado solo se afecta a sí mismo." }
      - { titulo: "I²C.", texto: "Direcciones únicas, 400 pF como mucho y el más lento manda." }
      - { titulo: "Lejos o con ruido.", texto: "RS-485 o CAN, no un pull-up más alto." }
