# Lección 1.2 de la sección 48.12 «Clases de Protección y el Doble Aislamiento» (cap47; etiqueta interna sec-47.10).
# Formato: contenido/lecciones11/GUIA.md. La figura 48.22 (clases y distancias) con zonas, y la foto 48.23 de dos
# fuentes conmutadas (1600 × 1600 px): las zonas marcan, en la de la derecha, el transformador, las bornas de salida,
# el electrolítico grande y la entrada de red.
leccion: cap47/sec-47.10

libro:
  403: "Prohibida en la mayoría de las normativas"
  404: "Si el aislamiento falla, la corriente va a tierra y el diferencial dispara"
  405: "En una instalación sin ella, un aparato de clase I es peligroso"
  406: "su símbolo es el doble cuadrado"
  407: "preferible en aparatos portátiles y en herramientas"
  408: "por debajo de 50 V en alterna"
  411: "Funcional: solo para que el circuito trabaje. No protege."
  412: "Básico: una capa de protección."
  413: "Suplementario: una segunda capa, independiente."
  414: "Doble: básico más suplementario."
  415: "Reforzado: una sola capa equivalente a doble"
  416: "Hay que buscar uno certificado como reforzado"
  419: "distancia por la superficie del aislante"
  420: "la distancia más corta por el aire"
  421: "aumentan la línea de fuga sin aumentar el tamaño"
  422: "1,14 a 3 000 m"
  425: "CAT I: circuitos electrónicos protegidos"
  426: "CAT II: tomas de corriente y aparatos conectados a ellas."
  427: "CAT III: instalación fija, cuadros de distribución."
  428: "CAT IV: acometida, exterior."
  429: "Un multímetro CAT II usado en un cuadro es un riesgo real"
  431: "la primera para los sólidos y la segunda para el agua"
  432: "Inmersión temporal (1 m, 30 min)"
  433: "IP65, la de una caja estanca al polvo que aguanta una manguera"
  435: "que debe ser de pocas décimas de ohmio"
  436: "al menos 1 MΩ en clase I y 2 MΩ en clase II"
  437: "Las clases de protección y la distinción entre línea de fuga y distancia en aire"
  438: "Solo el transformador, el optoacoplador y el condensador Y (azul) cruzan la barrera de aislamiento"

modelo:
  valores: {}
  calculos: {}

tarjetas:
  - id: explore-clases
    tipo: explorar
    titulo: "Cuatro estrategias"
    texto: "Toque cada clase de protección y lea cómo evita que un fallo llegue al usuario."
    libro: [403, 404, 406, 408, 437]
    widget:
      tipo: figura
      figura: fig-47.17
      zonas:
        - { id: c1, rotulo: "Arriba a la izquierda", rect: [10, 3, 137, 100], texto: "Clase I: aislamiento básico y tierra; si falla, la corriente va a tierra y el diferencial dispara." }
        - { id: c2, rotulo: "Arriba en el centro", rect: [157, 3, 135, 100], texto: "Clase II: doble aislamiento o reforzado, sin tierra. Su símbolo, el doble cuadrado." }
        - { id: c3, rotulo: "Arriba a la derecha", rect: [302, 3, 140, 100], texto: "Clase III: muy baja tensión de seguridad, por debajo de 50 V en alterna." }
        - { id: c0, rotulo: "La línea del centro", rect: [60, 102, 330, 36], texto: "Clase 0: solo aislamiento básico, sin tierra. Prohibida en la mayoría de las normativas." }
    requiere: { mover: [c1, c2, c3] }

  - id: prediga-sin-tierra
    tipo: predecir
    titulo: "Clase I sin tierra"
    texto: "Un aparato de clase I se enchufa en una instalación sin toma de tierra. ¿Qué pasa si su aislamiento falla?"
    libro: [404, 405]
    widget:
      tipo: figura
      figura: fig-47.17
      zonas:
        - { id: c1, rotulo: "Clase I", rect: [10, 3, 137, 100] }
    opciones:
      - texto: "La carcasa queda a tensión y nada dispara: es peligroso"
        bien: true
        porque: "Su protección depende de la tierra de la instalación: sin ella, la corriente de defecto no tiene camino."
      - texto: "El diferencial dispara igual"
        porque: "Disparará cuando alguien toque la carcasa y la corriente vaya por esa persona."
      - texto: "Nada: el aislamiento básico basta"
        porque: "La clase I confía el segundo nivel de protección a la tierra."
    escalera:
      - "¿Por dónde se iría la corriente de defecto sin conductor de tierra?"
    solucion: "Es peligroso: la clase I necesita que la instalación tenga tierra."

  - id: tipos-aislamiento
    tipo: pregunta
    titulo: "Los tipos de aislamiento"
    texto: "Empareje cada tipo de aislamiento con lo que es."
    libro: [411, 412, 413, 414, 415]
    widget:
      tipo: figura
      figura: fig-47.17
      zonas:
        - { id: c2, rotulo: "Clase II", rect: [157, 3, 135, 100] }
    emparejar:
      - ["Funcional", "Solo para que el circuito trabaje: no protege"]
      - ["Básico", "Una capa de protección"]
      - ["Doble", "Básico más suplementario"]
      - ["Reforzado", "Una sola capa equivalente a doble"]
    exito: "El suplementario es la segunda capa, independiente, que con el básico hace el doble."
    pistas:
      - { texto: "Solo uno no protege nada." }
    escalera:
      - "El doble son dos capas; el reforzado, una que vale por dos."
    solucion: "Funcional, no protege; básico, una capa; doble, dos; reforzado, una equivalente a dos."

  - id: optoacoplador
    tipo: pregunta
    titulo: "Un optoacoplador para la red"
    texto: "Un optoacoplador de aislamiento funcional con una tensión de aislamiento alta. ¿Sirve para separar la red del usuario?"
    libro: [416]
    widget:
      tipo: figura
      figura: fig-47.18
      zonas:
        - { id: fuentes, rotulo: "Las dos fuentes", rect: [0, 0, 1600, 1600] }
    opciones:
      - texto: "No: hace falta uno certificado como reforzado"
        bien: true
        porque: "El funcional solo sirve para que el circuito trabaje, aunque su cifra de aislamiento parezca alta."
      - texto: "Sí, si su tensión de aislamiento supera la de red"
        porque: "La cifra no basta: hay que mirar la categoría del aislamiento, reforzado."
      - texto: "Sí, con un fusible delante"
        porque: "El fusible no cambia la categoría del aislamiento."
    escalera:
      - "¿Qué tipo de aislamiento protege con una sola capa?"
    solucion: "No: para separar la red del usuario, uno certificado como reforzado."

  - id: toque-barrera
    tipo: tocar
    titulo: "Lo que cruza la barrera"
    texto: "En la fuente de la derecha, toque la pieza que cruza la barrera de aislamiento."
    libro: [438]
    widget:
      tipo: figura
      figura: fig-47.18
      zonas:
        - { id: transformador, rotulo: "Pieza amarilla grande, en el centro", rect: [976, 620, 310, 310] }
        - { id: bornas, rotulo: "Arriba, con tornillos", rect: [960, 140, 330, 230] }
        - { id: electrolitico, rotulo: "Cilindro verde, abajo a la derecha", rect: [1320, 990, 220, 270] }
        - { id: entrada, rotulo: "Abajo a la izquierda", rect: [800, 1180, 330, 240] }
    tocar:
      bien: [transformador]
      porque:
        bornas: "Las bornas de salida están del lado de baja tensión: no cruzan."
        electrolitico: "Es un electrolítico de un solo lado de la barrera."
        entrada: "La entrada de red, con el fusible y el X2, está del lado de la red."
    exito: "El transformador; con él solo cruzan el optoacoplador y el condensador Y."
    escalera:
      - "¿Qué pieza lleva la energía de la red a la salida sin conexión galvánica?"
    solucion: "El transformador, la pieza amarilla grande."

  - id: explore-distancias
    tipo: explorar
    titulo: "Fuga y aire"
    texto: "Toque la placa vista desde arriba: el cobre de red, el de baja tensión y la ranura entre ellos."
    libro: [419, 420, 421]
    widget:
      tipo: figura
      figura: fig-47.17
      zonas:
        - { id: red, rotulo: "Cobre de la izquierda", rect: [25, 175, 75, 50], texto: "El cobre de red." }
        - { id: ranura, rotulo: "La ranura del centro", rect: [100, 155, 42, 95], texto: "La ranura fresada alarga la línea de fuga sin agrandar la placa: el recorrido superficial la rodea." }
        - { id: selv, rotulo: "Cobre de la derecha", rect: [143, 175, 75, 50], texto: "El cobre de baja tensión. La distancia en aire es la más corta por el aire, y no cambia con la ranura." }
    requiere: { mover: [red, ranura, selv] }

  - id: altitud
    tipo: porque
    titulo: "La altitud"
    texto: "Un equipo se instalará a 3 000 m. ¿Qué pasa con su distancia en aire?"
    libro: [420, 422]
    widget:
      tipo: figura
      figura: fig-47.17
      zonas:
        - { id: aire, rotulo: "La caja de abajo a la derecha", rect: [248, 205, 192, 60] }
    opciones:
      - texto: "Hay que multiplicarla por un factor de corrección, 1,14"
        bien: true
        porque: "Las tablas valen hasta 2 000 m; arriba el aire enrarecido aísla peor."
      - texto: "Puede reducirse: el aire es más fino"
        porque: "Más fino aísla peor, no mejor: hay que aumentarla."
      - texto: "No cambia: depende solo de la tensión"
        porque: "La distancia en aire depende de la tensión y de la altitud."
    escalera:
      - "¿Aísla mejor o peor el aire enrarecido?"
    solucion: "Aumentarla: por 1,14 a 3 000 m."

  - id: ordene-cat
    tipo: pregunta
    titulo: "Las categorías de sobretensión"
    texto: "Ordene las categorías de medida, de menores a mayores transitorios."
    libro: [425, 426, 427, 428]
    widget:
      tipo: figura
      figura: fig-47.17
      zonas:
        - { id: clases, rotulo: "Las clases", rect: [10, 3, 432, 100] }
    ordenar:
      - "CAT I: circuitos electrónicos protegidos"
      - "CAT II: tomas de corriente y aparatos"
      - "CAT III: instalación fija y cuadros"
      - "CAT IV: acometida y exterior"
    exito: "Cuanto mayor la categoría, más robusta debe ser la entrada del instrumento."
    pistas:
      - { texto: "Cuanto más cerca de la acometida, mayores transitorios." }
    escalera:
      - "Empiece por lo que no está conectado a la red."
    solucion: "CAT I, II, III y IV: de los circuitos protegidos a la acometida."

  - id: cat-ii-cuadro
    tipo: pregunta
    titulo: "Un multímetro en el cuadro"
    texto: "Un multímetro CAT II de tensión nominal suficiente se usa en un cuadro de distribución. ¿Qué pasa?"
    libro: [427, 429]
    widget:
      tipo: figura
      figura: fig-47.17
      zonas:
        - { id: clases, rotulo: "Las clases", rect: [10, 3, 432, 100] }
    opciones:
      - texto: "Es un riesgo real: el cuadro es CAT III"
        bien: true
        porque: "Sus transitorios pueden superar lo que aguanta una entrada CAT II, aunque la tensión nominal sobre."
      - texto: "Nada: la tensión nominal basta"
        porque: "La categoría mide los transitorios, no la tensión de trabajo."
      - texto: "Solo mide peor"
        porque: "No es exactitud: es seguridad ante transitorios."
    escalera:
      - "¿Qué categoría tiene un cuadro de distribución?"
    solucion: "Un riesgo real: en un cuadro hace falta CAT III."

  - id: codigo-ip
    tipo: pregunta
    titulo: "El código IP"
    texto: "Empareje cada grado de protección con el equipo que lo pide."
    libro: [431, 432, 433]
    emparejar:
      - ["IP2X", "Interior: no se toca con el dedo nada peligroso"]
      - ["IP54", "Equipo exterior resguardado"]
      - ["IP65", "Caja estanca al polvo que aguanta una manguera"]
      - ["IP67", "Aparato que sobrevive a una caída al agua"]
    exito: "Chorro e inmersión son ensayos distintos: por eso hay productos marcados IP65/IP67."
    pistas:
      - { texto: "La primera cifra, sólidos; la segunda, agua." }
    escalera:
      - "Un 7 en la segunda cifra es inmersión temporal."
    solucion: "IP2X, el dedo; IP54, exterior resguardado; IP65, manguera; IP67, caída al agua."

  - id: verificar-clase
    tipo: pregunta
    titulo: "Verificar un aparato de clase I"
    texto: "Con el aparato desconectado, ¿qué se mide entre el pin de tierra y cada parte metálica accesible?"
    libro: [435, 436]
    widget:
      tipo: figura
      figura: fig-47.17
      zonas:
        - { id: c1, rotulo: "Clase I", rect: [10, 3, 137, 100] }
    opciones:
      - texto: "Continuidad: pocas décimas de ohmio"
        bien: true
        porque: "La tierra debe llegar a todo lo metálico. La prueba formal se completa con medidor de aislamiento y de fuga."
      - texto: "Aislamiento: al menos 2 MΩ"
        porque: "Ese es el de la clase II, entre la red y lo accesible, con 500 V."
      - texto: "Ninguna conexión: circuito abierto"
        porque: "Eso es lo que se busca en un clase II. En clase I la tierra sí debe llegar."
    escalera:
      - "En clase I, ¿qué debe unir la tierra?"
    solucion: "Continuidad de pocas décimas de ohmio."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [405, 407, 421, 429]
    ideas:
      - { titulo: "Clases.", texto: "I, con tierra; II, doble aislamiento; III, muy baja tensión." }
      - { titulo: "Aislamientos.", texto: "Funcional no protege; para la red, reforzado certificado." }
      - { titulo: "Distancias.", texto: "La ranura alarga la fuga; la altitud obliga a más distancia en aire." }
      - { titulo: "Categorías e IP.", texto: "La CAT según el punto de la red; el IP, polvo y agua." }
