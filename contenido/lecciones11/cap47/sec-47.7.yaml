# Lección 1.2 de la sección 48.8 «Seguridad Eléctrica» (cap47; etiqueta interna sec-47.7).
# Formato: contenido/lecciones11/GUIA.md. La corriente por el cuerpo con la ley de Ohm en valores eficaces (tabla del
# bloque 258) en el esquema «resistencia» (la fuente de 230 V del dibujo representa la tensión eficaz de la red): 300 Ω
# dan 767 mA, 1–2 kΩ de 115 a 230 mA y 5 kΩ, 46 mA. El paso de simulación es el aviso del bloque 259: 50 V con las manos
# mojadas (300 Ω) superan los 100 mA. La foto 48.14 (placa de un televisor, 1600 × 1205) con zonas.
leccion: cap47/sec-47.7

libro:
  254: "Lo que daña al cuerpo humano es la corriente que lo atraviesa"
  255: "Fibrilación ventricular (mortal)"
  256: "trabajar con una sola mano cuando hay tensión presente"
  258: "Piel húmeda o herida"
  259: "50 V con las manos mojadas ya pueden superar los 100 mA"
  261: "Las decenas de miliamperios que bastan para matar a una persona no los ven siquiera"
  262: "compara la corriente que entra por la fase con la que vuelve por el neutro"
  264: "Es la única protección pensada para personas"
  265: "un diferencial no protege del contacto entre fase y neutro"
  267: "Requiere que la toma de tierra exista y funcione"
  268: "Se identifica por el símbolo del doble cuadrado"
  269: "por debajo de 50 V alterna o 120 continua"
  270: "un solo fallo no debe poder producir una situación peligrosa"
  273: "Línea de fuga (creepage)"
  274: "la contaminación y la humedad depositadas en la superficie la degradan con el tiempo"
  275: "una ranura fresada entre las zonas de alta y baja tensión"
  278: "Si hay un cortocircuito, la lámpara luce a plena potencia y limita la corriente"
  279: "tocar un solo punto no cierra circuito a tierra"
  280: "hay que tratarlo como si estuviera vivo"
  282: "Descargar los condensadores antes de tocar nada"
  284: "corriente resultante a 230 V según la resistencia de la piel"
  285: "el doble cuadrado, resaltado en amarillo"

modelo:
  valores:
    V_c: { sim: "V", nombre: "tensión de contacto", unidad: V, valor: 230 }
    R_b: { sim: "R_{cuerpo}", nombre: "resistencia del cuerpo", unidad: Ω, valor: 1000 }
  calculos:
    I_b: { expr: "V_c/R_b", sim: "I", nombre: "corriente por el cuerpo", unidad: A }
    I_seca: { expr: "V_c/5000", sim: "I", nombre: "corriente con la piel seca", unidad: A }

tarjetas:
  - id: explore-cuerpo
    tipo: explorar
    titulo: "La corriente, no la tensión"
    texto: "Con 230 V, cambie la resistencia del cuerpo: de la piel húmeda a la seca. Mire la corriente."
    libro: [254, 258]
    fijar: { V_c: 230 }
    widget:
      tipo: circuito
      esquema: resistencia
      piezas: { fuente: V_c, r: R_b }
      lectura: { valor: I_b, rotulo: "Corriente por el cuerpo" }
      corriente: I_b
      mide: { corriente: I_b, tension: V_c }
      mandos:
        - { valor: R_b, lista: [300, 1000, 2000, 5000], nombres: [piel húmeda, piel normal, normal y seca, piel seca], rotulo: "Resistencia del cuerpo" }
    requiere: { mover: [R_b] }

  - id: ordene-efectos
    tipo: pregunta
    titulo: "Los umbrales"
    texto: "Ordene los efectos de la corriente por el cuerpo, de la menor a la mayor."
    libro: [255, 284]
    widget:
      tipo: figura
      figura: fig-47.12
      zonas:
        - { id: grafica, rotulo: "La gráfica de la derecha", rect: [240, 20, 200, 170] }
    ordenar:
      - "Umbral de percepción"
      - "Dolor, contracción muscular"
      - "Tetanización: no se puede soltar"
      - "Parada respiratoria"
      - "Fibrilación ventricular"
    exito: "De 0,5–2 mA a más de 50 mA: el umbral es mucho más bajo de lo que sugiere la intuición."
    pistas:
      - { texto: "Lo mortal es lo último; sentirla, lo primero." }
    escalera:
      - "Antes de no poder soltar, duele."
    solucion: "Percepción, dolor, tetanización, parada respiratoria y fibrilación."

  - id: simule-50v
    tipo: simular
    titulo: "La baja tensión no es inocua"
    texto: "50 V con las manos mojadas, unos 300 Ω. ¿Qué corriente atraviesa el cuerpo?"
    libro: [258, 259]
    fijar: { V_c: 50, R_b: 300 }
    widget:
      tipo: circuito
      esquema: resistencia
      piezas: { fuente: V_c, r: R_b }
      lectura: { valor: I_b, rotulo: "Corriente por el cuerpo" }
      mide: { corriente: I_b }
      ocultar: true
      mandos: []
    simular:
      objetivo: I_b
      unidad: A
      tol: 0.03
      rotulo: "Corriente por el cuerpo"
      medida: corriente
      errores:
        - { expr: "V_c/5000", texto: "Esa es con la piel seca, 5 kΩ. Mojada, la resistencia cae a unos 300 Ω." }
    exito: "Más de 100 mA: por encima de los 50 mA de la fibrilación."
    escalera:
      - "Ley de Ohm: I = V/R."
    solucion: "50 V/300 Ω ≈ 167 mA."
    comprobar:
      - { I_b: 0.1667, tol: 0.003 }

  - id: una-mano
    tipo: porque
    titulo: "No poder soltar"
    texto: "El umbral de «no soltar» es el más peligroso. ¿Por qué se trabaja con una sola mano cuando hay tensión?"
    libro: [256]
    widget:
      tipo: figura
      figura: fig-47.12
      zonas:
        - { id: tetanizacion, rotulo: "La tercera caja", rect: [3, 82, 182, 36] }
    opciones:
      - texto: "Para que la corriente no atraviese el tórax"
        bien: true
        porque: "De mano a mano pasa por el pecho. La contracción impide apartarse y prolonga la exposición."
      - texto: "Para tener la otra mano libre para el diferencial"
        porque: "La regla es por el camino de la corriente, no por alcanzar nada."
      - texto: "Porque una mano tiene más resistencia"
        porque: "La resistencia no cambia: cambia por dónde pasa la corriente."
    escalera:
      - "¿Qué órgano queda entre las dos manos?"
    solucion: "Para que la corriente no cruce el tórax: la contracción impide soltar."

  - id: diferencial
    tipo: pregunta
    titulo: "Lo que protege a las personas"
    texto: "Fusible, magnetotérmico y diferencial. ¿Cuál está pensado para las personas?"
    libro: [261, 262, 264]
    widget:
      tipo: figura
      figura: fig-47.12
      zonas:
        - { id: nota, rotulo: "El texto de abajo", rect: [3, 177, 230, 35] }
    opciones:
      - texto: "El diferencial, que compara fase y neutro"
        bien: true
        porque: "La diferencia es corriente que se va por otro camino, que puede ser una persona; con 30 mA, corta."
      - texto: "El fusible"
        porque: "Corta ante decenas de amperios: los miliamperios que matan no los ve."
      - texto: "El magnetotérmico"
        porque: "Protege la instalación ante cortocircuitos y sobrecargas, no a las personas."
    escalera:
      - "¿Cuál detecta una corriente que se va por otro camino?"
    solucion: "El diferencial: la única protección pensada para personas. Y hay que probarlo con su botón."

  - id: fase-neutro
    tipo: predecir
    titulo: "El límite del diferencial"
    texto: "Alguien toca a la vez la fase y el neutro. ¿Dispara el diferencial?"
    libro: [265]
    widget:
      tipo: figura
      figura: fig-47.12
      zonas:
        - { id: nota, rotulo: "El texto de abajo", rect: [3, 177, 230, 35] }
    opciones:
      - texto: "No: la corriente entra y sale por donde debe"
        bien: true
        porque: "Fase y neutro siguen igualadas. Protege del contacto a tierra, el caso mucho más frecuente."
      - texto: "Sí, siempre que pase de 30 mA"
        porque: "Compara fase con neutro: si toda la corriente vuelve por el neutro, no ve diferencia."
      - texto: "Solo si la persona está descalza"
        porque: "Descalza habría camino a tierra; entre fase y neutro, no hay diferencia que ver."
    escalera:
      - "¿Hay diferencia entre lo que entra por la fase y lo que vuelve por el neutro?"
    solucion: "No dispara: no hay corriente de fuga a tierra."

  - id: clases
    tipo: pregunta
    titulo: "Las clases de aislamiento"
    texto: "Empareje cada clase con su estrategia."
    libro: [267, 268, 269, 270]
    widget:
      tipo: figura
      figura: fig-47.13
      zonas:
        - { id: placa, rotulo: "La placa de características", rect: [0, 0, 1600, 1205] }
    emparejar:
      - ["Clase I", "Aislamiento básico más tierra en las partes metálicas"]
      - ["Clase II", "Doble aislamiento, sin tierra"]
      - ["Clase III", "Muy baja tensión de seguridad, SELV"]
    exito: "El principio de las tres: un solo fallo no debe producir una situación peligrosa."
    pistas:
      - { texto: "Solo una depende de la toma de tierra de la instalación." }
    escalera:
      - "La que nunca deja llegar una tensión peligrosa es la de la baja tensión."
    solucion: "I, tierra; II, doble aislamiento; III, SELV, por debajo de 50 V alterna o 120 continua."

  - id: toque-clase-ii
    tipo: tocar
    titulo: "Clase II en la placa"
    texto: "Toque el símbolo que dice que el aparato es de clase II."
    libro: [268, 285]
    widget:
      tipo: figura
      figura: fig-47.13
      zonas:
        - { id: doble, rotulo: "Recuadro amarillo, a la derecha", rect: [1330, 320, 180, 190] }
        - { id: ce, rotulo: "Letras, en el centro a la derecha", rect: [1100, 330, 180, 150] }
        - { id: hg, rotulo: "Recuadro con letras, en el centro", rect: [850, 330, 180, 150] }
        - { id: triangulo, rotulo: "Triángulo, abajo a la izquierda", rect: [80, 850, 190, 160] }
    tocar:
      bien: [doble]
      porque:
        ce: "No es el de la clase de protección: la clase II se identifica por el doble cuadrado."
        hg: "Tampoco: el de la clase II son dos cuadrados, uno dentro de otro."
        triangulo: "Es un aviso de riesgo eléctrico, no la clase: la clase II es el doble cuadrado."
    exito: "El doble cuadrado: dos capas de aislamiento, sin tierra."
    escalera:
      - "Busque dos cuadrados, uno dentro de otro."
    solucion: "El recuadro amarillo: el doble cuadrado de la clase II."

  - id: distancias
    tipo: pregunta
    titulo: "Fuga y aislamiento"
    texto: "Empareje cada distancia con cómo se mide."
    libro: [273, 274]
    widget:
      tipo: figura
      figura: fig-47.13
      zonas:
        - { id: placa, rotulo: "La placa de características", rect: [0, 0, 1600, 1205] }
    emparejar:
      - ["Distancia de aislamiento (clearance)", "La mínima por el aire entre dos conductores"]
      - ["Línea de fuga (creepage)", "La mínima siguiendo la superficie del aislante"]
    exito: "La de fuga suele ser mayor: la suciedad y la humedad de la superficie la degradan."
    pistas:
      - { texto: "Una va por el aire; la otra se arrastra por la superficie." }
    escalera:
      - "«Fuga» suena a algo que se escurre por una superficie."
    solucion: "Clearance, por el aire; creepage, por la superficie."

  - id: ranura
    tipo: pregunta
    titulo: "La ranura de las fuentes conmutadas"
    texto: "En una placa hay una ranura fresada entre las zonas de alta y baja tensión. ¿Para qué sirve?"
    libro: [275]
    widget:
      tipo: figura
      figura: fig-47.18
      zonas:
        - { id: placas, rotulo: "Las dos fuentes", rect: [0, 0, 1600, 1600] }
    opciones:
      - texto: "Alarga la línea de fuga"
        bien: true
        porque: "La corriente superficial tiene que recorrer un camino mucho más largo. No es un defecto."
      - texto: "Ventila el transformador"
        porque: "Su función es eléctrica: alargar el camino por la superficie."
      - texto: "Es un defecto de fabricación"
        porque: "Se ve en cualquier fuente conmutada y es deliberada: alarga la línea de fuga."
    escalera:
      - "¿Qué camino obliga a rodear la ranura?"
    solucion: "Alarga la línea de fuga entre la zona de red y la de baja tensión."

  - id: transformador
    tipo: pregunta
    titulo: "El transformador de aislamiento"
    texto: "¿Qué permite el transformador de aislamiento en el banco?"
    libro: [279, 280]
    widget:
      tipo: figura
      figura: fig-47.13
      zonas:
        - { id: placa, rotulo: "La placa de características", rect: [0, 0, 1600, 1205] }
    opciones:
      - texto: "Que tocar un solo punto no cierre circuito a tierra"
        bien: true
        porque: "Separa galvánicamente el equipo de la red: así se puede poner la pinza de masa sin cortocircuito."
      - texto: "Que no haga falta descargar los condensadores"
        porque: "Los condensadores guardan su carga igual: hay que descargarlos y comprobarlo."
      - texto: "Que el equipo sea de clase II"
        porque: "La clase es del aparato; el transformador aísla la red del banco."
    escalera:
      - "Sin unión con tierra, ¿por dónde volvería la corriente al tocar un punto?"
    solucion: "Tocar un solo punto no cierra circuito a tierra. Y el FNIRSI flotante se trata como si estuviera vivo."

  - id: lampara
    tipo: pregunta
    titulo: "La lámpara serie"
    texto: "Primer encendido de un equipo reparado con una bombilla en serie, que luce a plena potencia. ¿Qué indica?"
    libro: [278, 282]
    widget:
      tipo: figura
      figura: fig-47.12
      zonas:
        - { id: grafica, rotulo: "La gráfica de la derecha", rect: [240, 20, 200, 170] }
    opciones:
      - texto: "Un cortocircuito, con la corriente limitada por la lámpara"
        bien: true
        porque: "Si el equipo está bien, apenas luce. Es la protección más barata del primer encendido."
      - texto: "Que el equipo funciona bien"
        porque: "Al revés: con el equipo bien, la lámpara apenas luce."
      - texto: "Que la lámpara es demasiado pequeña"
        porque: "Luce a plena potencia porque el equipo pide toda la corriente: hay un cortocircuito."
    escalera:
      - "Si el equipo apenas consume, ¿cuánta tensión le queda a la lámpara?"
    solucion: "Un cortocircuito: la lámpara limita la corriente y lo avisa."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [254, 259, 264, 270]
    ideas:
      - { titulo: "La corriente.", texto: "Con 230 V casi cualquier contacto serio es mortal; con 50 V y manos mojadas, más de 100 mA." }
      - { titulo: "El diferencial.", texto: "La única protección para personas; no ve el contacto entre fase y neutro." }
      - { titulo: "Las clases.", texto: "Tierra, doble aislamiento o SELV: un solo fallo nunca peligroso." }
      - { titulo: "En el banco.", texto: "Una mano, condensadores descargados, nunca solo, lámpara serie y diferencial probado." }
