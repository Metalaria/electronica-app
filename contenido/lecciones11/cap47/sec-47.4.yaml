# Lección 1.2 de la sección 48.5 «Gestión Térmica: el Modelo de Resistencias» (cap47; etiqueta interna sec-47.4).
# Formato: contenido/lecciones11/GUIA.md. La cadena unión → cápsula → disipador → ambiente del ejemplo del libro
# (10 W, 1 + 0,5 + 2 °C/W, 40 °C: 75 °C) se dibuja como la temperatura frente a la resistencia térmica acumulada desde
# la unión: una recta que baja P °C por cada °C/W, el «divisor» del bloque 150. El paso de banco mide la Rsa del
# disipador de unos 10 °C/W del regulador de la fuente simétrica (cap15#41, ficha 5 del cuaderno).
leccion: cap47/sec-47.4

libro:
  148: "una ecuación idéntica a la ley de Ohm"
  149: "Resistencia térmica (°C/W)"
  150: "calcular la temperatura de una unión es resolver un divisor"
  153: 'T_("unión") = T_("ambiente")'
  154: "La da el fabricante y no se puede cambiar."
  155: "Depende del material de interfaz y del apriete."
  156: "Es la que se elige"
  157: "Con un transistor que disipa 10 W, Rjc de 1 °C/W, Rcs de 0,5 y un disipador de 2 °C/W, a 40 °C ambiente"
  158: '"75 °C"'
  159: "Muy por debajo de los 150 °C típicos de límite"
  162: "Más pasta es peor, no mejor"
  166: "un montaje sin material de interfaz puede tener el doble de Rcs que uno bien hecho"
  169: "Una almohadilla aislante puede añadir 1 a 2 °C/W, que con 10 W son 10 a 20 grados"
  172: "un componente puede disipar mucho más de su límite continuo durante un instante"
  173: "un disipador grande no ayuda en picos cortos"
  176: 'R_("sa") = (T_("disipador") - T_("ambiente"))/(P)'
  177: "Casi siempre es peor"
  178: "la potencia hace de corriente"
  179: "La cadena de resistencias térmicas con un cálculo completo"
  "cap15#41": "hace falta un disipador de unos 10 °C/W"

modelo:
  valores:
    P: { sim: "P", nombre: "potencia disipada", unidad: W, valor: 10 }
    R_jc: { sim: "R_{jc}", nombre: "resistencia unión-cápsula", unidad: "°C/W", valor: 1 }
    R_cs: { sim: "R_{cs}", nombre: "resistencia cápsula-disipador", unidad: "°C/W", valor: 0.5 }
    R_sa: { sim: "R_{sa}", nombre: "resistencia disipador-ambiente", unidad: "°C/W", valor: 2 }
    R_ais: { sim: "R_{aislante}", nombre: "almohadilla aislante", unidad: "°C/W", valor: 0 }
    T_a: { sim: "T_{a}", nombre: "temperatura ambiente", unidad: "°C", valor: 40 }
    R_nom: { sim: "R_{sa}", nombre: "resistencia nominal del disipador", unidad: "°C/W", valor: 10 }
  calculos:
    R_tot: { expr: "R_jc + R_cs + R_ais + R_sa", sim: "R_{total}", nombre: "resistencia térmica total", unidad: "°C/W", cifras: 2 }
    T_j: { expr: "T_a + P*R_tot", sim: "T_{j}", nombre: "temperatura de la unión", unidad: "°C" }
    T_c: { expr: "T_j - P*R_jc", sim: "T_{c}", nombre: "temperatura de la cápsula", unidad: "°C" }
    T_s: { expr: "T_a + P*R_sa", sim: "T_{s}", nombre: "temperatura del disipador", unidad: "°C" }
    R_cs1: { expr: "R_jc", sim: "x", nombre: "posición de la cápsula", unidad: "°C/W" }
    R_cs2: { expr: "R_jc + R_cs + R_ais", sim: "x", nombre: "posición del disipador", unidad: "°C/W" }
    d_cs: { expr: "P*R_cs/2", sim: "ΔT", nombre: "lo que añade doblar R_{cs}", unidad: "°C" }
    dT_ais: { expr: "P*R_ais", sim: "ΔT", nombre: "lo que sube la unión por el aislante", unidad: "°C" }

tarjetas:
  - id: analogia
    tipo: pregunta
    titulo: "El calor como un circuito"
    texto: "La conducción del calor sigue una ecuación idéntica a la ley de Ohm. Empareje cada magnitud térmica con la eléctrica."
    libro: [148, 149, 178]
    widget:
      tipo: figura
      figura: fig-47.6
      zonas:
        - { id: circuito, rotulo: "El circuito", rect: [10, 40, 300, 140] }
    emparejar:
      - ["Temperatura (°C)", "Tensión (V)"]
      - ["Potencia (W)", "Corriente (A)"]
      - ["Resistencia térmica (°C/W)", "Resistencia (Ω)"]
      - ["Capacidad térmica (J/°C)", "Condensador (F)"]
    exito: "Con eso, calcular la temperatura de una unión es resolver un divisor."
    pistas:
      - { texto: "Lo que «fluye» por la cadena es la potencia." }
    escalera:
      - "La diferencia de temperatura empuja el calor como la de tensión empuja la corriente."
    solucion: "Temperatura, tensión; potencia, corriente; °C/W, ohmios; J/°C, faradios."

  - id: explore-cadena
    tipo: explorar
    titulo: "La cadena, de la unión al aire"
    texto: "La temperatura baja P grados por cada °C/W. Cambie la potencia y el disipador y mire la unión."
    libro: [153, 154, 155, 156]
    widget:
      tipo: grafica
      x: { id: r, min: 0, max: 6, unidad: "°C/W", rotulo: "resistencia desde la unión" }
      y: { min: 0, max: 140, unidad: "°C", rotulo: "temperatura" }
      curvas:
        - { expr: "max(T_a, T_j - P*r)", color: naranja, rotulo: "temperatura a lo largo de la cadena" }
      marcas:
        - { x: "0", y: "T_j", rotulo: "unión {{T_j}}" }
        - { x: "R_cs1", y: "T_c", rotulo: "cápsula", guias: false }
        - { x: "R_cs2", y: "T_s", rotulo: "disipador", guias: false }
        - { x: "R_tot", y: "T_a", rotulo: "ambiente", guias: false }
      lectura: { valor: T_j, rotulo: "Temperatura de la unión" }
      mandos:
        - { valor: P, lista: [5, 10, 15], rotulo: "Potencia" }
        - { valor: R_sa, lista: [1, 2, 4], rotulo: "Disipador, R_{sa}" }
    requiere: { mover: [P, R_sa] }

  - id: formula-cadena
    tipo: formula
    titulo: "La temperatura de la unión"
    texto: "La ambiente más la potencia por la suma de las tres resistencias. Pruebe con 10 W y 2 °C/W."
    libro: [153, 157, 158, 159]
    ec: 153
    sustitucion: "{{T_a}} + {{P}} × ({{R_jc}} + {{R_cs}} + {{R_sa}}) = {{T_j}}"
    widget:
      tipo: grafica
      x: { id: r, min: 0, max: 6, unidad: "°C/W", rotulo: "resistencia desde la unión" }
      y: { min: 0, max: 140, unidad: "°C", rotulo: "temperatura" }
      curvas:
        - { expr: "max(T_a, T_j - P*r)", color: naranja, rotulo: "temperatura a lo largo de la cadena" }
      marcas:
        - { x: "0", y: "T_j", rotulo: "{{T_j}}" }
      lectura: { valor: T_j, rotulo: "Unión" }
      mandos:
        - { valor: P, lista: [5, 10, 15], rotulo: "Potencia" }
        - { valor: R_sa, lista: [1, 2, 4], rotulo: "Disipador, R_{sa}" }
        - { valor: T_a, lista: [25, 40], rotulo: "Ambiente" }
    comprobar:
      - { con: { P: 10, R_sa: 2, T_a: 40 }, T_j: 75, R_tot: 3.5 }

  - id: prediga-sin-pasta
    tipo: predecir
    titulo: "Sin material de interfaz"
    texto: "Con 10 W, 1 + 0,5 + 2 °C/W y 40 °C, la unión está a 75 °C; sin material de interfaz, R_{cs} se dobla. ¿Y ahora?"
    libro: [157, 166, 179]
    fijar: { P: 10, R_jc: 1, R_cs: 1, R_sa: 2, T_a: 40, R_ais: 0 }
    widget:
      tipo: figura
      figura: fig-47.7
      zonas:
        - { id: interfaz, rotulo: "El material de interfaz", rect: [222, 108, 228, 92] }
    opciones:
      - texto: "80 °C: cinco grados más"
        bien: true
        porque: "R_{cs} pasa de 0,5 a 1 °C/W; con 10 W, 5 °C más. La parte más barata de la cadena."
      - texto: "Igual, 75 °C"
        porque: "Sin interfaz queda aire microscópico, un aislante excelente: R_{cs} sube."
      - texto: "150 °C, el doble"
        porque: "Solo se dobla un eslabón de 0,5 °C/W, no toda la cadena."
    escalera:
      - "¿Cuánto añaden 0,5 °C/W más con 10 W?"
    solucion: "40 + 10 × 4 = 80 °C."
    comprobar:
      - { T_j: 80, R_tot: 4, d_cs: 5 }

  - id: mas-pasta
    tipo: porque
    titulo: "Más pasta es peor"
    texto: "La pasta térmica mejora el contacto, pero más pasta es peor. ¿Por qué?"
    libro: [162]
    widget:
      tipo: figura
      figura: fig-47.7
      zonas:
        - { id: interfaz, rotulo: "El material de interfaz", rect: [222, 108, 228, 92] }
    opciones:
      - texto: "Solo debe rellenar las irregularidades: una capa gruesa conduce peor que el metal"
        bien: true
        porque: "Su papel es desplazar el aire; más espesor es más recorrido por un material peor que el metal."
      - texto: "Porque se evapora con el calor"
        porque: "No es eso: el problema es el espesor, no que desaparezca."
      - texto: "Porque conduce la electricidad"
        porque: "El problema térmico es el espesor; la conducción eléctrica es otro asunto."
    escalera:
      - "¿Qué conduce mejor, la pasta o el metal?"
    solucion: "Debe rellenar las irregularidades y nada más: aplicada fina."

  - id: estime-aislante
    tipo: pregunta
    titulo: "El precio del aislamiento"
    texto: "La lengüeta está a un potencial peligroso y se aísla con una almohadilla de 2 °C/W. Con 10 W, ¿cuánto sube la unión?"
    libro: [169]
    fijar: { P: 10, R_ais: 2 }
    widget:
      tipo: grafica
      x: { id: r, min: 0, max: 6, unidad: "°C/W", rotulo: "resistencia desde la unión" }
      y: { min: 0, max: 140, unidad: "°C", rotulo: "temperatura" }
      curvas:
        - { expr: "T_a + 0*r", color: tinta, rotulo: "ambiente", discontinua: true }
    estimar:
      objetivo: "dT_ais"
      unidad: "°C"
      min: 0
      max: 40
      paso: 1
      inicio: 2
      tol: 0.05
      rotulo: "Subida de la unión"
    exito: "20 grados: hay que contarlo, no darlo por despreciable."
    pistas:
      - { cuando: { valor: estimacion, mayor: 21 }, texto: "Se ha pasado: la subida es la potencia por la resistencia añadida." }
      - { texto: "Se ha quedado corto: cada °C/W con 10 W son 10 grados." }
    escalera:
      - "ΔT = P · R, como la caída en una resistencia."
    solucion: "10 W × 2 °C/W = 20 °C más."
    comprobar:
      - { dT_ais: 20 }

  - id: picos
    tipo: pregunta
    titulo: "La capacidad térmica"
    texto: "Un componente disipa durante un instante mucho más que su límite continuo. ¿Qué lo permite, y qué no ayuda?"
    libro: [172, 173]
    widget:
      tipo: figura
      figura: fig-47.6
      zonas:
        - { id: union, rotulo: "La unión, a la izquierda", rect: [10, 60, 90, 120] }
    opciones:
      - texto: "Su propia masa absorbe la energía; un disipador grande no ayuda"
        bien: true
        porque: "En un pico corto el calor no llega al disipador a tiempo: importa la masa cercana a la unión."
      - texto: "El disipador grande lo absorbe todo"
        porque: "El calor tarda en llegar al disipador: en un pico corto no participa."
      - texto: "La resistencia térmica baja durante el pico"
        porque: "La resistencia no cambia; lo que actúa es la capacidad térmica, el condensador de la analogía."
    escalera:
      - "En la analogía, ¿qué hace un condensador ante un pulso corto de corriente?"
    solucion: "La masa del propio componente absorbe la energía; el disipador no llega a tiempo."

  - id: banco-rsa
    tipo: banco
    titulo: "Mida la R_{sa} real"
    texto: "Con el regulador de la fuente simétrica cargado, espere al régimen, mida el disipador y el ambiente, y calcule R_{sa}."
    libro: [176, 177, "cap15#41"]
    banco:
      piezas: ["Fuente simétrica de ±12 V, con 0,5 A de carga", "Disipador de unos 10 °C/W", "Multímetro con termopar"]
      medir: "(T_{disipador} − T_{ambiente})/P, con P la potencia del regulador."
      esperado: R_nom
      unidad: "°C/W"
      tol: 0.25
      consejos:
        - { cuando: { valor: desviacion, mayor: 0.25 }, texto: "Peor que el nominal: es lo habitual, que se da en condiciones ideales y sin caja. Mire las aletas, verticales, y el espacio libre." }
        - { texto: "Mejor que el nominal: ¿ha esperado al régimen? ¿Ha medido la potencia con la entrada real del regulador?" }
      ficha: { n: 5, titulo: "Fuente de alimentación simétrica ±12 V" }

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [150, 153, 166, 173]
    ideas:
      - { titulo: "Un divisor.", texto: "Temperatura, tensión; potencia, corriente; °C/W, ohmios." }
      - { titulo: "La cadena.", texto: "T_{j} = T_{a} + P · (R_{jc} + R_{cs} + R_{sa}): 75 °C en el ejemplo." }
      - { titulo: "La interfaz.", texto: "Sin ella, R_{cs} puede doblarse; el aislante añade de 1 a 2 °C/W." }
      - { titulo: "Picos.", texto: "La masa cercana a la unión los absorbe; el disipador no llega a tiempo." }
