# Lección 1.2 de la sección 48.13 «Cierre: del Componente al Sistema» (cap47; etiqueta interna sec-47.11).
# Formato: contenido/lecciones11/GUIA.md. Sección de síntesis, sin números ni circuitos: la figura 48.24 (la escalera
# de niveles y las ideas que atraviesan el libro) con zonas, ordenar los niveles y emparejar las ideas.
leccion: cap47/sec-47.11

libro:
  443: "Todo componente es no ideal"
  444: "Medir modifica lo medido"
  445: "El calor lo decide casi todo en fiabilidad"
  446: "Los sistemas fallan en las interfaces"
  447: "Lo que se pierde en una etapa no se recupera después"
  448: "El peor caso, no el nominal"
  451: "Componentes → qué son y cómo se apartan del ideal."
  452: "Circuitos → cómo se combinan y qué predice la teoría."
  453: "Instrumentos → cómo se comprueba lo que hacen."
  454: "Sistemas → cómo se organizan y se reparten funciones."
  455: "Realización → cómo se convierten en algo físico."
  456: "Fiabilidad y seguridad → cómo duran y cómo no hacen daño."
  457: "un circuito correcto puede no funcionar en una placa"
  460: "Márgenes para tolerancias, temperatura y envejecimiento."
  461: "Protecciones contra lo que no debería ocurrir."
  462: "Documentación que permita mantenerlo"
  463: "Verificación contra una especificación escrita"
  465: "Un circuito que funciona en la mesa está, quizá, en la mitad del camino."
  468: "diagnosticar exige entender de verdad"
  471: "Los componentes y su selección, el circuito, la placa y su trazado"
  473: "La progresión de niveles del libro"

modelo:
  valores: {}
  calculos: {}

tarjetas:
  - id: explore-niveles
    tipo: explorar
    titulo: "Del componente al sistema"
    texto: "Toque la escalera de niveles y la caja de las ideas que atraviesan el libro."
    libro: [457, 473]
    widget:
      tipo: figura
      figura: fig-47.19
      zonas:
        - { id: escalera, rotulo: "La escalera de la izquierda", rect: [0, 48, 225, 197], texto: "Cada nivel usa el anterior y añade problemas que en el anterior no existían." }
        - { id: ideas, rotulo: "La caja de la derecha", rect: [228, 5, 222, 235], texto: "Seis ideas que reaparecen capítulo tras capítulo." }
    requiere: { mover: [escalera, ideas] }

  - id: ordene-niveles
    tipo: pregunta
    titulo: "La progresión del libro"
    texto: "Ordene los niveles, del primero al último."
    libro: [451, 452, 453, 454, 455, 456]
    widget:
      tipo: figura
      figura: fig-47.19
      zonas:
        - { id: ideas, rotulo: "La caja de la derecha", rect: [228, 5, 222, 235] }
    ordenar:
      - "Componentes: qué son y cómo se apartan del ideal"
      - "Circuitos: cómo se combinan"
      - "Instrumentos: cómo se comprueba lo que hacen"
      - "Sistemas: cómo se organizan"
      - "Realización: cómo se convierten en algo físico"
      - "Fiabilidad y seguridad: cómo duran y no hacen daño"
    exito: "Un circuito correcto puede no funcionar en una placa; un aparato que funciona puede no ser seguro."
    pistas:
      - { texto: "Antes de comprobar algo con instrumentos, hay que combinarlo en un circuito." }
    escalera:
      - "Lo último es cómo dura y cómo no hace daño."
    solucion: "Componentes, circuitos, instrumentos, sistemas, realización, fiabilidad y seguridad."

  - id: ideas
    tipo: pregunta
    titulo: "Las ideas que atraviesan el libro"
    texto: "Empareje cada idea con un ejemplo."
    libro: [443, 444, 446, 448, 460]
    widget:
      tipo: figura
      figura: fig-47.19
      zonas:
        - { id: ideas, rotulo: "La caja de la derecha", rect: [228, 5, 222, 235] }
    emparejar:
      - ["Todo componente es no ideal", "La ESR de un condensador"]
      - ["Medir modifica lo medido", "El multímetro sobre un divisor"]
      - ["Los sistemas fallan en las interfaces", "Conectores, masas, fronteras entre dominios"]
      - ["El peor caso, no el nominal", "Márgenes para tolerancias y envejecimiento"]
    exito: "Rara vez falla el centro de un bloque bien diseñado."
    pistas:
      - { texto: "La sonda sobre un oscilador es del mismo tipo que el multímetro sobre un divisor." }
    escalera:
      - "Empiece por la que habla de medir."
    solucion: "No ideal, la ESR; medir, el divisor; interfaces, conectores y masas; peor caso, los márgenes."

  - id: donde-fallan
    tipo: predecir
    titulo: "Dónde fallan los sistemas"
    texto: "Un aparato falla. Sin más datos, ¿dónde es más probable la causa?"
    libro: [446]
    widget:
      tipo: figura
      figura: fig-47.19
      zonas:
        - { id: escalera, rotulo: "La escalera", rect: [0, 48, 225, 197] }
    opciones:
      - texto: "En una interfaz: un conector, una masa, una frontera entre dominios"
        bien: true
        porque: "Los sistemas fallan en las interfaces, rara vez en el centro de un bloque bien diseñado."
      - texto: "En el centro de su bloque más complejo"
        porque: "Un bloque bien diseñado rara vez falla por dentro: las fronteras son lo frágil."
      - texto: "En el componente más caro"
        porque: "El precio no dice dónde se falla: las interfaces sí."
    escalera:
      - "¿Qué une los bloques entre sí?"
    solucion: "En las interfaces: conectores, masas, fronteras entre dominios."

  - id: producto
    tipo: pregunta
    titulo: "De circuito a producto"
    texto: "¿Qué separa un circuito que funciona en la mesa de un producto?"
    libro: [460, 461, 462, 463, 465]
    widget:
      tipo: figura
      figura: fig-47.19
      zonas:
        - { id: escalera, rotulo: "La escalera", rect: [0, 48, 225, 197] }
    opciones:
      - texto: "Márgenes, protecciones, documentación y verificación contra una especificación"
        bien: true
        porque: "Un circuito que funciona en la mesa está, quizá, en la mitad del camino."
      - texto: "Que funcione una vez"
        porque: "Funcionar en la mesa es la mitad del camino: falta que dure y no haga daño."
      - texto: "Una caja bonita"
        porque: "La caja es parte de la realización, pero lo que separa es lo que asegura que dure y se mantenga."
    escalera:
      - "¿Qué pasa con las tolerancias, la temperatura y el envejecimiento?"
    solucion: "Márgenes, protecciones, documentación, verificación y trazabilidad."

  - id: diagnosticar
    tipo: porque
    titulo: "Reparar lo ajeno"
    texto: "El libro termina reparando y analizando equipos ajenos. ¿Por qué?"
    libro: [468]
    widget:
      tipo: figura
      figura: fig-47.19
      zonas:
        - { id: escalera, rotulo: "La escalera", rect: [0, 48, 225, 197] }
    opciones:
      - texto: "Diagnosticar exige entender de verdad, sin haber tomado uno mismo las decisiones"
        bien: true
        porque: "Es la otra cara del diseño: entender lo que otro construyó."
      - texto: "Porque reparar es más fácil que diseñar"
        porque: "Al revés: no se cuenta con haber tomado las decisiones, hay que deducirlas."
      - texto: "Porque los proyectos ya están hechos"
        porque: "La razón es lo que exige diagnosticar: entender de verdad."
    escalera:
      - "¿Qué le falta a quien repara un equipo que no diseñó?"
    solucion: "Porque diagnosticar exige entender de verdad, sin la ayuda de haber decidido uno mismo."

  - id: abrir-aparato
    tipo: pregunta
    titulo: "Abrir un aparato cualquiera"
    texto: "El ejercicio que resume el cierre: abrir un aparato e identificar cada capa del libro. ¿Cuál no es una de ellas?"
    libro: [471]
    widget:
      tipo: figura
      figura: fig-47.19
      zonas:
        - { id: escalera, rotulo: "La escalera", rect: [0, 48, 225, 197] }
    opciones:
      - texto: "El precio de venta"
        bien: true
        porque: "Las capas son técnicas: componentes, circuito, placa, firmware, protecciones, calor, seguridad y certificación."
      - texto: "Las marcas de certificación"
        porque: "Son una de las capas: la seguridad documentada."
      - texto: "La gestión térmica"
        porque: "Es una de las capas que se buscan al abrirlo."
    escalera:
      - "Las capas son las de los capítulos del libro."
    solucion: "El precio: lo demás son capas del libro que se ven en el aparato."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [443, 445, 446, 447, 457, 465]
    ideas:
      - { titulo: "Niveles.", texto: "Componentes, circuitos, instrumentos, sistemas, realización, fiabilidad y seguridad." }
      - { titulo: "Ideas.", texto: "No ideal, medir modifica, el calor, las interfaces, lo perdido no vuelve, el peor caso." }
      - { titulo: "Producto.", texto: "Funcionar en la mesa es, quizá, la mitad del camino." }
