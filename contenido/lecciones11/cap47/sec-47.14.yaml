# Lección 1.2 de la sección 48.16 «Ampliación: Trazabilidad y Calibración» (cap47; etiqueta interna sec-47.14).
# Formato: contenido/lecciones11/GUIA.md. La cadena de la figura 48.26 con zonas; la regla de «al menos cuatro veces
# mejor» (bloque 531) con la suma en cuadratura: un patrón cuatro veces mejor empeora la combinada √(1 + 1/16) − 1, un
# 3 % (lo que dice la figura).
leccion: cap47/sec-47.14

libro:
  522: "Un instrumento sin calibración da lecturas, no medidas"
  524: "Calibración: comparar el instrumento con un patrón y documentar la desviación. No implica ajustar."
  525: "Ajuste: corregir el instrumento para que su lectura coincida"
  526: "Verificación: comprobar que sigue dentro de tolerancia"
  527: "un certificado de calibración dice cuánto se desvía, no que se haya corregido"
  529: "hasta llegar a los patrones nacionales y a las definiciones del Sistema Internacional"
  530: "sin ella, un número es una opinión del instrumento"
  531: "la regla clásica es al menos cuatro veces mejor"
  534: "Tensión continua: con una referencia de precisión"
  535: "Resistencia: con resistencias patrón del 0,01 %."
  536: "Tiempo y frecuencia: con un oscilador disciplinado por GPS"
  537: "hielo fundente a 0 °C"
  541: "el criterio para acortarlo o alargarlo: el historial"
  548: "La incertidumbre de la calibración misma."
  549: "Ese último punto es el que muchos certificados caseros omiten"
  551: "qué medidas hechas con él desde la anterior pueden estar afectadas"
  552: "revisar lotes enteros"
  555: "No da trazabilidad, y detecta el que se ha ido"
  556: "esa comparación se convierte en una calibración modesta pero real"
  557: "La cadena de trazabilidad y la diferencia entre calibrar, ajustar y verificar"

modelo:
  valores:
    TUR: { sim: "TUR", nombre: "veces que el patrón es mejor", unidad: "", valor: 4 }
  calculos:
    empeora: { expr: "100*(sqrt(1 + 1/TUR^2) - 1)", sim: "Δu", nombre: "lo que empeora la combinada", unidad: "%", cifras: 2 }

tarjetas:
  - id: explore-cadena
    tipo: explorar
    titulo: "Saber que lo medido es cierto"
    texto: "Toque los eslabones de la cadena, de las definiciones del SI a la medida."
    libro: [529, 530, 557]
    widget:
      tipo: figura
      figura: fig-47.21
      zonas:
        - { id: si, rotulo: "Primera caja de arriba", rect: [3, 3, 68, 62], texto: "Las definiciones del Sistema Internacional." }
        - { id: nacional, rotulo: "Segunda caja de arriba", rect: [78, 3, 68, 62], texto: "Los patrones nacionales, en el instituto de metrología." }
        - { id: laboratorio, rotulo: "Tercera caja de arriba", rect: [153, 3, 68, 62], texto: "El laboratorio acreditado y su patrón de referencia." }
        - { id: banco, rotulo: "Cuarta caja de arriba", rect: [228, 3, 68, 62], texto: "El patrón del banco: una referencia de precisión." }
        - { id: medida, rotulo: "Última caja de arriba", rect: [378, 3, 68, 62], texto: "La medida, con su incertidumbre: sin la cadena, una opinión del instrumento." }
    requiere: { mover: [si, nacional, laboratorio, banco, medida] }

  - id: ordene-cadena
    tipo: pregunta
    titulo: "La cadena de trazabilidad"
    texto: "Ordene la cadena, de las definiciones a la medida del banco."
    libro: [529, 557]
    widget:
      tipo: figura
      figura: fig-47.21
      zonas:
        - { id: calibrar, rotulo: "Las tres cajas de abajo", rect: [3, 105, 443, 92] }
    ordenar:
      - "Definiciones del SI"
      - "Patrones nacionales"
      - "Laboratorio acreditado"
      - "Patrón del banco"
      - "Instrumento"
      - "Medida, con su incertidumbre"
    exito: "Cada patrón calibra al siguiente; la incertidumbre se acumula eslabón a eslabón."
    pistas:
      - { texto: "El instituto de metrología guarda los patrones nacionales." }
    escalera:
      - "Empiece por las unidades, que se fijan por definición."
    solucion: "SI, patrones nacionales, laboratorio acreditado, patrón del banco, instrumento y medida."

  - id: tres-conceptos
    tipo: pregunta
    titulo: "Los conceptos, con precisión"
    texto: "Empareje cada operación con lo que hace."
    libro: [524, 525, 526, 527]
    widget:
      tipo: figura
      figura: fig-47.21
      zonas:
        - { id: cadena, rotulo: "La fila de arriba", rect: [3, 3, 443, 62] }
    emparejar:
      - ["Calibración", "Comparar con un patrón y documentar la desviación"]
      - ["Ajuste", "Corregir el instrumento para que su lectura coincida"]
      - ["Verificación", "Comprobar que sigue dentro de tolerancia"]
    exito: "Un certificado de calibración dice cuánto se desvía, no que se haya corregido."
    pistas:
      - { texto: "Solo una modifica el instrumento." }
    escalera:
      - "La que documenta no toca nada."
    solucion: "Calibrar documenta; ajustar corrige; verificar comprueba la tolerancia."

  - id: lecturas-medidas
    tipo: porque
    titulo: "Lecturas, no medidas"
    texto: "Un instrumento sin calibración da lecturas, no medidas. ¿Por qué?"
    libro: [522, 530]
    widget:
      tipo: figura
      figura: fig-47.21
      zonas:
        - { id: cadena, rotulo: "La fila de arriba", rect: [3, 3, 443, 62] }
    opciones:
      - texto: "Sin la cadena hasta el SI, un número es una opinión del instrumento"
        bien: true
        porque: "La cadena da valor a la medida, y importa en cuanto haya que defenderla ante alguien."
      - texto: "Porque no tiene suficientes dígitos"
        porque: "Los dígitos son resolución; la trazabilidad dice si significan algo."
      - texto: "Porque necesita un ajuste"
        porque: "Calibrar no es ajustar: es saber cuánto se desvía, con su incertidumbre."
    escalera:
      - "¿Con qué se ha comparado esa lectura?"
    solucion: "Porque sin cadena hasta el SI un número es una opinión del instrumento."

  - id: estime-cuatro
    tipo: pregunta
    titulo: "Cuatro veces mejor"
    texto: "Un patrón cuatro veces mejor que lo que calibra. En cuadratura, ¿cuánto empeora la incertidumbre combinada?"
    libro: [531, 557]
    fijar: { TUR: 4 }
    widget:
      tipo: grafica
      x: { id: r, min: 1, max: 10, unidad: "", rotulo: "veces que el patrón es mejor" }
      y: { min: 0, max: 45, unidad: "%", rotulo: "empeora la combinada" }
      curvas:
        - { expr: "100*(sqrt(1 + 1/r^2) - 1)", color: naranja, rotulo: "en cuadratura" }
    estimar:
      objetivo: "empeora"
      unidad: "%"
      min: 0
      max: 30
      paso: 0.5
      inicio: 25
      tol: 0.15
      rotulo: "Cuánto empeora"
    exito: "Un 3 %: por eso basta con que el patrón sea cuatro veces mejor."
    pistas:
      - { cuando: { valor: estimacion, mayor: 3.6 }, texto: "Se ha pasado: en cuadratura, un cuarto pesa un dieciseisavo." }
      - { texto: "Se ha quedado corto: algo empeora, aunque poco." }
    escalera:
      - "Sume en cuadratura una contribución y otra cuatro veces menor."
    solucion: "Un cuarto, al cuadrado, es un dieciseisavo: la combinada crece un 3 %."
    comprobar:
      - { empeora: 3.1, tol: 0.01 }

  - id: patrones
    tipo: pregunta
    titulo: "Patrones asequibles"
    texto: "Empareje cada magnitud con el patrón asequible para un banco modesto."
    libro: [534, 535, 536, 537]
    widget:
      tipo: figura
      figura: fig-47.21
      zonas:
        - { id: banco, rotulo: "La cuarta caja de arriba", rect: [228, 3, 70, 62] }
    emparejar:
      - ["Tensión continua", "Una referencia de precisión"]
      - ["Resistencia", "Resistencias patrón del 0,01 %"]
      - ["Tiempo y frecuencia", "Un oscilador disciplinado por GPS"]
      - ["Temperatura", "Hielo fundente a 0 °C"]
    exito: "Con esos cuatro se cubre casi todo lo que un banco necesita."
    pistas:
      - { texto: "El GPS da una referencia de tiempo excelente." }
    escalera:
      - "Un punto fijo de la naturaleza sirve para la temperatura."
    solucion: "Referencia de tensión, resistencias del 0,01 %, oscilador con GPS y hielo fundente."

  - id: intervalo
    tipo: pregunta
    titulo: "Acortar o alargar el intervalo"
    texto: "La calibración anual es lo habitual. ¿Qué decide acortarla o alargarla?"
    libro: [541]
    widget:
      tipo: figura
      figura: fig-47.21
      zonas:
        - { id: verificar, rotulo: "La caja de abajo a la derecha", rect: [303, 105, 143, 92] }
    opciones:
      - texto: "El historial de calibraciones"
        bien: true
        porque: "Si apenas ha derivado, se alarga; si deriva, se acorta o se retira."
      - texto: "El precio del laboratorio"
        porque: "El criterio técnico es lo que el instrumento ha derivado."
      - texto: "La edad del instrumento"
        porque: "Lo que cuenta es su deriva medida, no los años."
    escalera:
      - "¿Qué dicen varias calibraciones seguidas?"
    solucion: "El historial: cuánto ha derivado entre calibraciones."

  - id: documentacion
    tipo: pregunta
    titulo: "Lo que muchos certificados omiten"
    texto: "Un certificado casero dice qué se calibró, cuándo y qué desviación hubo. ¿Qué suele faltarle?"
    libro: [548, 549]
    widget:
      tipo: figura
      figura: fig-47.21
      zonas:
        - { id: calibrar, rotulo: "La caja de abajo a la izquierda", rect: [3, 105, 145, 92] }
    opciones:
      - texto: "La incertidumbre de la calibración misma"
        bien: true
        porque: "Sin ella, el resto no significa nada."
      - texto: "La firma"
        porque: "Lo que hace utilizable una calibración es su incertidumbre."
      - texto: "La marca del instrumento"
        porque: "Lo que falta es la incertidumbre con la que se calibró."
    escalera:
      - "¿Cuánto se puede fiar de la desviación encontrada?"
    solucion: "La incertidumbre de la calibración misma."

  - id: prediga-fuera
    tipo: predecir
    titulo: "Fuera de tolerancia"
    texto: "En la calibración, un instrumento aparece fuera de tolerancia. ¿Qué hay que preguntarse?"
    libro: [551, 552]
    widget:
      tipo: figura
      figura: fig-47.21
      zonas:
        - { id: ajustar, rotulo: "La caja de abajo en el centro", rect: [153, 105, 145, 92] }
    opciones:
      - texto: "Qué medidas hechas con él desde la calibración anterior pueden estar afectadas"
        bien: true
        porque: "En producción puede obligar a revisar lotes enteros: por eso se respetan los intervalos."
      - texto: "Nada: se ajusta y listo"
        porque: "Ajustar arregla lo de ahora; lo medido antes sigue en duda."
      - texto: "Solo si está fuera por mucho"
        porque: "Fuera es fuera: las medidas desde la anterior calibración quedan en duda."
    escalera:
      - "¿Desde cuándo podía estar mal?"
    solucion: "Qué medidas desde la anterior calibración pueden estar afectadas."

  - id: comparar
    tipo: pregunta
    titulo: "Comparar los multímetros"
    texto: "Mide la misma tensión con todos los multímetros del banco y anota las diferencias. ¿Qué consigue?"
    libro: [555, 556]
    widget:
      tipo: figura
      figura: fig-47.21
      zonas:
        - { id: instrumento, rotulo: "La quinta caja de arriba", rect: [303, 3, 70, 62] }
    opciones:
      - texto: "Detectar el que se ha ido, sin trazabilidad"
        bien: true
        porque: "Con una referencia de precisión, la comparación se vuelve una calibración modesta pero real."
      - texto: "Calibrarlos todos"
        porque: "Sin patrón no hay calibración: solo se ve cuál discrepa."
      - texto: "Saber cuál acierta"
        porque: "Comparar dice si coinciden, no cuál acierta, salvo con una referencia."
    escalera:
      - "¿Hay algún patrón en la comparación?"
    solucion: "Detecta el que se ha ido; con una referencia, es una calibración modesta."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [527, 530, 531, 549]
    ideas:
      - { titulo: "Cadena.", texto: "Del SI a la medida; sin ella, un número es una opinión del instrumento." }
      - { titulo: "Calibrar no es ajustar.", texto: "El certificado dice cuánto se desvía, con su incertidumbre." }
      - { titulo: "Cuatro veces mejor.", texto: "Así el patrón apenas añade incertidumbre." }
      - { titulo: "En el banco.", texto: "Comparar instrumentos detecta el que se ha ido." }
