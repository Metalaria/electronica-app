# Lección 1.2 de la sección 48.16 «Ampliación: Trazabilidad y Calibración» (cap47; etiqueta interna sec-47.14).
# Formato: contenido/lecciones11/GUIA.md. La cadena de la figura 48.26 con zonas; la regla de «al menos cuatro veces
# mejor» (bloque 531) con la suma en cuadratura: un patrón cuatro veces mejor empeora la combinada √(1 + 1/16) − 1, un
# 3 % (lo que dice la figura). 1.2.1 (aprender haciendo): ordenar la cadena, tocar lo que modifica el instrumento,
# leer cuánto empeora un patrón cuatro veces mejor, tocar el patrón de frecuencia, lo que decide el intervalo, lo que
# lleva un certificado y lo que da comparar multímetros. Dos preguntas: lecturas y medidas, y fuera de tolerancia.
# 1.2.1, segunda pasada: sin listas de respuestas disfrazadas; quedan las tarjetas que se hacen y dos preguntas.
# 1.3 (contenido13b): la cadena se recorre con objetivo de zonas en orden y +explorar con objetivo un patrón igual
# de bueno (41 %, la suma en cuadratura del bloque 531): 3/6 → 5/7.
leccion: cap47/sec-47.14

libro:
  523: "Los conceptos, con precisión"
  528: "La cadena de trazabilidad"
  532: "Qué se calibra en un banco modesto"
  533: "Y con qué patrones asequibles"
  538: "Con esos cuatro se cubre casi todo lo que un banco necesita"
  539: "El intervalo de calibración"
  540: "Anual es lo habitual en instrumentos de trabajo"
  542: "La documentación"
  543: "Lo que hace utilizable una calibración"
  544: "Qué se calibró y con qué patrón, con su propio certificado"
  545: "Cuándo, y en qué condiciones ambientales"
  546: "Qué desviación se encontró, punto por punto"
  547: "Si se ajustó, y los valores antes y después"
  553: "En el banco"
  554: "La práctica que más aporta sin coste"
  522: "Un instrumento sin calibración da lecturas, no medidas"
  524: "Calibración: comparar el instrumento con un patrón y documentar la desviación. No implica ajustar."
  525: "Ajuste: corregir el instrumento para que su lectura coincida"
  526: "Verificación: comprobar que sigue dentro de tolerancia"
  527: "un certificado de calibración dice cuánto se desvía, no que se haya corregido"
  529: "hasta llegar a los patrones nacionales y a las definiciones del Sistema Internacional"
  530: "sin ella, un número es una opinión del instrumento"
  531: "la regla clásica es al menos cuatro veces mejor"
  534: "Tensión continua: con una referencia de precisión"
  535: "Resistencia: con resistencias patrón del 0,01 %."
  536: "Tiempo y frecuencia: con un oscilador disciplinado por GPS"
  537: "hielo fundente a 0 °C"
  541: "el criterio para acortarlo o alargarlo: el historial"
  548: "La incertidumbre de la calibración misma."
  549: "Ese último punto es el que muchos certificados caseros omiten"
  551: "qué medidas hechas con él desde la anterior pueden estar afectadas"
  552: "revisar lotes enteros"
  555: "No da trazabilidad, y detecta el que se ha ido"
  556: "esa comparación se convierte en una calibración modesta pero real"
  557: "La cadena de trazabilidad y la diferencia entre calibrar, ajustar y verificar"

modelo:
  valores:
    TUR: { sim: "TUR", nombre: "veces que el patrón es mejor", unidad: "", valor: 4 }
  calculos:
    empeora: { expr: "100*(sqrt(1 + 1/TUR^2) - 1)", sim: "Δu", nombre: "lo que empeora la combinada", unidad: "%", cifras: 2 }

tarjetas:
  - id: explore-cadena
    tipo: explorar
    titulo: "Saber que lo medido es cierto"
    texto: "Toque los eslabones de la cadena, de las definiciones del SI a la medida."
    libro: [529, 530, 557]
    widget:
      tipo: figura
      figura: fig-47.21
      zonas:
        - { id: si, rotulo: "Primera caja de arriba", rect: [3, 3, 68, 62], texto: "Las definiciones del Sistema Internacional." }
        - { id: nacional, rotulo: "Segunda caja de arriba", rect: [78, 3, 68, 62], texto: "Los patrones nacionales, en el instituto de metrología." }
        - { id: laboratorio, rotulo: "Tercera caja de arriba", rect: [153, 3, 68, 62], texto: "El laboratorio acreditado y su patrón de referencia." }
        - { id: banco, rotulo: "Cuarta caja de arriba", rect: [228, 3, 68, 62], texto: "El patrón del banco: una referencia de precisión." }
        - { id: medida, rotulo: "Última caja de arriba", rect: [378, 3, 68, 62], texto: "La medida, con su incertidumbre: sin la cadena, una opinión del instrumento." }
    objetivo:
      orden: true
      condiciones:
        - { zona: si, rotulo: "El origen" }
        - { zona: nacional, rotulo: "Segundo eslabón" }
        - { zona: laboratorio, rotulo: "Tercero" }
        - { zona: banco, rotulo: "Cuarto" }
        - { zona: medida, rotulo: "El final" }
      logrado: "Del SI a la medida sin un eslabón roto: así una lectura deja de ser una opinión del instrumento."
      pistas:
        - { texto: "Recorra la cadena de izquierda a derecha." }
    escalera:
      - "La cadena empieza en las definiciones del SI, a la izquierda."
    solucion: "De izquierda a derecha: SI, nacional, laboratorio, banco y medida."

  - id: de-quien
    tipo: tocar
    titulo: "La trazabilidad del banco"
    texto: "Su patrón de banco tiene que ser trazable. Toque de quién recibe su calibración."
    libro: [557]
    widget:
      tipo: figura
      figura: fig-47.21
      zonas:
        - { id: si, rotulo: "Primera caja de arriba", rect: [3, 3, 68, 62] }
        - { id: nacional, rotulo: "Segunda caja de arriba", rect: [78, 3, 68, 62] }
        - { id: laboratorio, rotulo: "Tercera caja de arriba", rect: [153, 3, 68, 62] }
        - { id: medida, rotulo: "Última caja de arriba", rect: [378, 3, 68, 62] }
    tocar:
      bien: [laboratorio]
      porque:
        si: "Son las definiciones del Sistema Internacional."
        nacional: "Son los patrones nacionales del instituto de metrología."
        medida: "Es la medida final."
    exito: "El laboratorio acreditado, con su patrón de referencia, enlaza el banco con los patrones nacionales."
    escalera:
      - "Es el eslabón justo anterior."
    solucion: "El laboratorio acreditado."

  - id: sin-cadena
    tipo: tocar
    titulo: "Sin la cadena"
    texto: "Toque la caja que dice qué es una medida sin la cadena detrás."
    libro: [557]
    widget:
      tipo: figura
      figura: fig-47.21
      zonas:
        - { id: nacional, rotulo: "Segunda caja de arriba", rect: [78, 3, 68, 62] }
        - { id: laboratorio, rotulo: "Tercera caja de arriba", rect: [153, 3, 68, 62] }
        - { id: banco, rotulo: "Cuarta caja de arriba", rect: [228, 3, 68, 62] }
        - { id: medida, rotulo: "Última caja de arriba", rect: [378, 3, 68, 62] }
    tocar:
      bien: [medida]
      porque:
        nacional: "Son los patrones nacionales del instituto de metrología."
        laboratorio: "Es el laboratorio acreditado."
        banco: "Es el propio patrón del banco."
    exito: "Sin la cadena, la medida es una opinión del instrumento."
    escalera:
      - "Es la última caja."
    solucion: "La medida, con su incertidumbre."

  - id: lecturas-medidas
    tipo: porque
    titulo: "Lecturas, no medidas"
    texto: "Un instrumento sin calibración da lecturas, no medidas. ¿Por qué?"
    libro: [522, 530]
    widget:
      tipo: figura
      figura: fig-47.21
      zonas:
        - { id: cadena, rotulo: "La fila de arriba", rect: [3, 3, 443, 62] }
    opciones:
      - texto: "Sin la cadena hasta el SI, un número es una opinión del instrumento"
        bien: true
        porque: "La cadena da valor a la medida, y importa en cuanto haya que defenderla ante alguien."
      - texto: "Porque no tiene suficientes dígitos"
        porque: "Los dígitos son resolución; la trazabilidad dice si significan algo."
      - texto: "Porque necesita un ajuste"
        porque: "Calibrar no es ajustar: es saber cuánto se desvía, con su incertidumbre."
    escalera:
      - "¿Con qué se ha comparado esa lectura?"
    solucion: "Porque sin cadena hasta el SI un número es una opinión del instrumento."

  - id: explore-igual
    tipo: explorar
    titulo: "Un patrón igual de bueno"
    texto: "La incertidumbre del patrón se suma en cuadratura a la del instrumento. Baje el patrón hasta que sea tan bueno como lo que calibra, y nada más."
    libro: [531, 557]
    inicio: { TUR: 10 }
    widget:
      tipo: grafica
      x: { id: r, min: 1, max: 10, unidad: "", rotulo: "veces que el patrón es mejor" }
      y: { min: 0, max: 45, unidad: "%", rotulo: "empeora la combinada" }
      curvas:
        - { expr: "100*(sqrt(1 + 1/r^2) - 1)", color: naranja, rotulo: "en cuadratura" }
      marcas:
        - { x: "TUR", y: "empeora", rotulo: "Su patrón" }
      lectura: { valor: empeora, rotulo: "Empeora la combinada" }
      mandos:
        - { valor: TUR, min: 1, max: 10, paso: 1, rotulo: "Veces que el patrón es mejor" }
    objetivo:
      condiciones:
        - { valor: TUR, max: 1, rotulo: "Patrón: {{TUR}} veces mejor" }
      logrado: "Igual de bueno, la combinada empeora un {{empeora}}: el patrón pesa tanto como el instrumento. Por eso debe ser bastante mejor."
      pistas:
        - { texto: "Baje la relación hasta 1." }
    escalera:
      - "Igual de bueno es una relación de uno."
    solucion: "Relación 1: la combinada empeora un 41 %."
    comprobar:
      - { con: { TUR: 1 }, empeora: 41.42, tol: 0.01 }

  - id: estime-cuatro
    tipo: leer
    titulo: "Cuatro veces mejor"
    texto: "Un patrón cuatro veces mejor que lo que calibra. En cuadratura, lea en la curva cuánto empeora la combinada."
    libro: [531, 557]
    fijar: { TUR: 4 }
    widget:
      tipo: grafica
      x: { id: r, min: 1, max: 10, unidad: "", rotulo: "veces que el patrón es mejor" }
      y: { min: 0, max: 45, unidad: "%", rotulo: "empeora la combinada" }
      curvas:
        - { expr: "100*(sqrt(1 + 1/r^2) - 1)", color: naranja, rotulo: "en cuadratura" }
      mandos: []
    leer:
      objetivo: empeora
      unidad: "%"
      tol: 0.1
      rotulo: "Cuánto empeora"
      errores:
        - { expr: "100/TUR", texto: "Eso sería sumarlo tal cual; en cuadratura pesa mucho menos." }
        - { expr: "100/TUR^2", texto: "Ese es el peso en la varianza; en la incertidumbre es más o menos la mitad." }
    exito: "Un 3 %: por eso basta con un patrón cuatro veces mejor."
    escalera:
      - "Sume en cuadratura una contribución y otra cuatro veces menor."
    solucion: "Un cuarto, al cuadrado, es un dieciseisavo: la combinada crece un 3 %."
    comprobar:
      - { empeora: 3.1, tol: 0.01 }

  - id: prediga-fuera
    tipo: predecir
    titulo: "Fuera de tolerancia"
    texto: "En la calibración, un instrumento aparece fuera de tolerancia. ¿Qué hay que preguntarse?"
    libro: [551, 552]
    widget:
      tipo: figura
      figura: fig-47.21
      zonas:
        - { id: ajustar, rotulo: "La caja de abajo en el centro", rect: [153, 105, 145, 92] }
    opciones:
      - texto: "Qué medidas hechas con él desde la calibración anterior pueden estar afectadas"
        bien: true
        porque: "En producción puede obligar a revisar lotes enteros: por eso se respetan los intervalos."
      - texto: "Nada: se ajusta y listo"
        porque: "Ajustar arregla lo de ahora; lo medido antes sigue en duda."
      - texto: "Solo si está fuera por mucho"
        porque: "Fuera es fuera: las medidas desde la anterior calibración quedan en duda."
    escalera:
      - "¿Desde cuándo podía estar mal?"
    solucion: "Qué medidas desde la anterior calibración pueden estar afectadas."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [527, 530, 531, 549, 523, 524, 525, 526, 528, 532, 533, 534, 535, 536, 537, 538, 539, 540, 541, 542, 543, 544, 545, 546, 547, 548, 553, 554, 555, 556]
    ideas:
      - { titulo: "Cadena.", texto: "Del SI a la medida; sin ella, un número es una opinión del instrumento." }
      - { titulo: "Calibrar no es ajustar.", texto: "El certificado dice cuánto se desvía, con su incertidumbre." }
      - { titulo: "Cuatro veces mejor.", texto: "Así el patrón apenas añade incertidumbre." }
      - { titulo: "En el banco.", texto: "Comparar instrumentos detecta el que se ha ido." }
