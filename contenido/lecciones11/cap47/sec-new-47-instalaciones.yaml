# Lección 1.2 de la sección 48.9 «Instalaciones y Protecciones de Baja Tensión» (cap47; etiqueta interna
# sec-new-47-instalaciones). Formato: contenido/lecciones11/GUIA.md. El defecto franco en TT (bloque 297) es el lazo
# de la fuente de 230 V con RA = 20 Ω y RB = 2 Ω en el esquema «serie» (valores eficaces): 10,5 A y la masa a 209 V. La
# pica de 500 Ω·m del ejercicio 48.8 (cap47#600) se ajusta para un diferencial de 300 mA con 50 V. La caída de tensión
# del banco de 25 m (bloque 331) y la fuga de los condensadores Y (bloque 326, ejercicio 48.11).
leccion: cap47/sec-new-47-instalaciones

libro:
  287: "no sustituye al reglamento ni al instalador"
  291: "añadir un circuito al cuadro es una modificación; enchufar una regleta, no"
  294: "La primera dice cómo está la alimentación"
  295: "En TT vuelve por el terreno"
  296: "Un defecto franco entre fase y masa vuelve por el terreno"
  297: "230/(20 + 2)"
  298: "quien corta es el diferencial"
  299: 'R_"A" dot.op I_"Δn"'
  300: "Con 30 mA basta RA ≤ 1 667 Ω; con 300 mA, 167 Ω"
  301: "El punto débil es el PEN"
  302: "Es el esquema de los quirófanos"
  303: "basta un primer defecto para que la isla deje de serlo"
  305: "3 a 5·In en la B, 5 a 10·In en la C y 10 a 20·In en la D"
  307: "la D es para transformadores y motores"
  313: "Δ V = 2 dot.op L dot.op I dot.op R'_θ"
  314: "tiene 9,55 Ω/km a 70 °C"
  320: "Con dos de uso general abrirían los dos"
  322: "Los de 10 y 30 mA protegen a las personas"
  323: "continua lisa y alterna hasta 1 kHz"
  324: "esa continua magnetiza el toroidal"
  326: "Se reparten circuitos; nunca se sube la sensibilidad"
  330: "Un banco a 25 m del cuadro"
  331: "2 × 25 × 9,57 × 0,00955 = 4,57 V, el 1,99 %"
  334: "El botón de prueba del diferencial comprueba el mecanismo, no la protección"
  "cap47#600": "La toma de tierra de un taller con esquema TT se hace con una pica vertical en un terreno de 500 Ω·m"

modelo:
  valores:
    V_0: { sim: "V₀", nombre: "tensión de la fase respecto a tierra", unidad: V, valor: 230 }
    R_A: { sim: "R_{A}", nombre: "toma de tierra de las masas", unidad: Ω, valor: 20 }
    R_B: { sim: "R_{B}", nombre: "toma de tierra del neutro", unidad: Ω, valor: 2 }
    I_dn: { sim: "I_{Δn}", nombre: "sensibilidad del diferencial", unidad: A, valor: 0.03 }
    V_lim: { sim: "V_{lím}", nombre: "tensión de contacto límite", unidad: V, valor: 50 }
    rho: { sim: "ρ", nombre: "resistividad del terreno", unidad: "Ω·m", valor: 500 }
    L_p: { sim: "L", nombre: "longitud de la pica", unidad: m, valor: 2 }
    L_c: { sim: "L", nombre: "longitud de la línea", unidad: m, valor: 25 }
    I_B: { sim: "I_{B}", nombre: "corriente de empleo", unidad: A, valor: 9.57 }
    R_km: { sim: "R'_{70}", nombre: "resistencia del cable a 70 °C", unidad: "Ω/km", valor: 9.55 }
    C_Y: { sim: "C_{Y}", nombre: "condensador Y de cada equipo", unidad: F, valor: 0.0000000047 }
  calculos:
    I_d: { expr: "V_0/(R_A + R_B)", sim: "I_{d}", nombre: "corriente de defecto", unidad: A }
    V_cA: { expr: "I_d*R_A", sim: "V_{c}", nombre: "tensión de la masa", unidad: V }
    V_cB: { expr: "I_d*R_B", sim: "V_{B}", nombre: "caída en la toma del neutro", unidad: V }
    I_sinB: { expr: "V_0/R_A", sim: "I", nombre: "olvidando R_{B}", unidad: A }
    R_Amax: { expr: "V_lim/I_dn", sim: "R_{A,máx}", nombre: "resistencia de tierra máxima", unidad: Ω, cifras: 4 }
    R_pica: { expr: "rho/L_p", sim: "R", nombre: "resistencia de la pica", unidad: Ω }
    dV: { expr: "2*L_c*I_B*R_km/1000", sim: "ΔV", nombre: "caída de tensión", unidad: V }
    dV_pct: { expr: "100*dV/V_0", sim: "ΔV", nombre: "caída de tensión en porcentaje", unidad: "%", cifras: 3 }
    dV_1: { expr: "100*L_c*I_B*R_km/1000/V_0", sim: "ΔV'", nombre: "con un solo conductor", unidad: "%", cifras: 3 }
    I_fuga: { expr: "V_0*2*pi*50*C_Y", sim: "I", nombre: "fuga de cada equipo", unidad: A }
    n_eq: { expr: "0.3*0.03/I_fuga", sim: "n", nombre: "equipos por diferencial", unidad: "" }

tarjetas:
  - id: explore-esquemas
    tipo: explorar
    titulo: "Tres esquemas, tres caminos"
    texto: "Toque cada esquema y siga la corriente de un defecto franco entre la fase y la masa."
    libro: [294, 295, 301, 302]
    widget:
      tipo: figura
      figura: fig-new-47-esquemas
      zonas:
        - { id: tt, rotulo: "A la izquierda", rect: [0, 0, 146, 210], texto: "TT, el de la red pública: el defecto vuelve por el terreno, por R_{A} y R_{B}. Corta el diferencial." }
        - { id: tn, rotulo: "En el centro", rect: [150, 0, 146, 210], texto: "TN-S, con transformador propio: vuelve por el conductor de protección. Es un cortocircuito y corta el magnetotérmico." }
        - { id: it, rotulo: "A la derecha", rect: [300, 0, 142, 210], texto: "IT: solo vuelve por las capacidades de la red. El primer defecto no corta; el controlador de aislamiento avisa." }
    requiere: { mover: [tt, tn, it] }

  - id: simule-tt
    tipo: simular
    titulo: "Un defecto en TT"
    texto: "Defecto franco entre fase y masa, con R_{A} = 20 Ω y R_{B} = 2 Ω. ¿Qué corriente de defecto circula?"
    libro: [296, 297]
    fijar: { V_0: 230, R_A: 20, R_B: 2 }
    widget:
      tipo: circuito
      esquema: serie
      piezas: { fuente: V_0, r1: R_A, r2: R_B }
      lectura: { valor: I_d, rotulo: "Corriente de defecto" }
      mide: { corriente: I_d, v1: V_cA, v2: V_cB }
      ocultar: true
      mandos: []
    simular:
      objetivo: I_d
      unidad: A
      tol: 0.03
      rotulo: "Corriente de defecto"
      medida: corriente
      errores:
        - { expr: "I_sinB", texto: "Ha olvidado R_{B}: la corriente vuelve por el terreno a través de las dos tomas." }
        - { expr: "V_0/R_B", texto: "Ha olvidado R_{A}, la toma de las masas: la corriente la atraviesa antes de llegar al terreno." }
    exito: "10,5 A: menos de los 16 A del magnetotérmico, que no ve nada anormal."
    escalera:
      - "El lazo es la fase, la masa, R_{A}, el terreno y R_{B}."
    solucion: "230/(20 + 2) = 10,5 A."
    comprobar:
      - { I_d: 10.45, I_sinB: 11.5, tol: 0.003 }

  - id: masa-209
    tipo: pregunta
    titulo: "La masa queda viva"
    texto: "Con 10,5 A por R_{A} = 20 Ω, ¿a qué tensión queda la masa del aparato?"
    libro: [297, 298]
    fijar: { V_0: 230, R_A: 20, R_B: 2 }
    widget:
      tipo: circuito
      esquema: serie
      piezas: { fuente: V_0, r1: R_A, r2: R_B }
      corriente: I_d
      mide: { corriente: I_d, v1: V_cA }
      mandos: []
    estimar:
      objetivo: "V_cA"
      unidad: V
      min: 0
      max: 230
      paso: 1
      inicio: 20
      tol: 0.02
      rotulo: "Tensión de la masa"
    exito: "209 V: quien la toque con 1 kΩ recibe 209 mA. En TT corta el diferencial."
    pistas:
      - { cuando: { valor: estimacion, mayor: 213 }, texto: "Se ha pasado: una parte pequeña cae en R_{B}." }
      - { texto: "Se ha quedado corto: R_{A} se queda casi toda la tensión, 20 de cada 22 Ω." }
    escalera:
      - "V_{c} = I_{d} · R_{A}."
    solucion: "10,45 × 20 ≈ 209 V."
    comprobar:
      - { V_cA: 209, I_d: 10.45, tol: 0.003 }

  - id: formula-tierra
    tipo: formula
    titulo: "La condición sobre la tierra"
    texto: "La toma de tierra por la sensibilidad del diferencial no debe pasar de la tensión límite. Cambie los dos."
    libro: [299, 300]
    ec: 299
    sustitucion: "R_{A} ≤ {{V_lim}} / {{I_dn}} = {{R_Amax}}"
    widget:
      tipo: grafica
      x: { id: i, min: 0.01, max: 0.5, unidad: A, rotulo: "sensibilidad del diferencial", escala: log }
      y: { min: 10, max: 10000, unidad: Ω, rotulo: "R_{A} máxima", escala: log }
      curvas:
        - { expr: "V_lim/i", color: naranja, rotulo: "R_{A} máxima" }
      marcas:
        - { x: "I_dn", y: "R_Amax", rotulo: "{{R_Amax}}" }
      lectura: { valor: R_Amax, rotulo: "Toma de tierra máxima" }
      mandos:
        - { valor: I_dn, lista: [0.03, 0.3], rotulo: "Diferencial" }
        - { valor: V_lim, lista: [50, 24], rotulo: "Tensión límite" }
    comprobar:
      - { con: { I_dn: 0.03, V_lim: 50 }, R_Amax: 1667, tol: 0.001 }

  - id: ajuste-pica
    tipo: ajuste
    titulo: "Una pica para 300 mA"
    texto: "Terreno de 500 Ω·m y diferencial de 300 mA con 50 V. Alargue la pica hasta que R = ρ/L baje de 167 Ω."
    libro: [300, "cap47#600"]
    fijar: { rho: 500 }
    inicio: { L_p: 2 }
    widget:
      tipo: grafica
      x: { id: l, min: 1, max: 8, unidad: m, rotulo: "longitud de la pica" }
      y: { min: 0, max: 500, unidad: Ω, rotulo: "resistencia de la pica" }
      curvas:
        - { expr: "rho/l", color: naranja, rotulo: "R = ρ/L" }
        - { expr: "167", color: tinta, rotulo: "límite con 300 mA", discontinua: true }
      marcas:
        - { x: "L_p", y: "R_pica", rotulo: "{{R_pica}}" }
      lectura: { valor: R_pica, rotulo: "Resistencia de la pica" }
      mandos:
        - { valor: L_p, min: 1, max: 8, paso: 0.5, rotulo: "Longitud de la pica" }
    ajuste:
      valor: R_pica
      min: 50
      max: 167
      rotulo: "Resistencia de la pica"
      escala: { min: 0, max: 500 }
      bajo: "Sobra pica."
      alto: "Aún por encima de 167 Ω: alárguela."
      dentro: "Unos 3,0 m. En la práctica se ponen varias picas en paralelo."
    comprobar:
      - { con: { L_p: 2 }, R_pica: 250 }
      - { con: { L_p: 3 }, R_pica: 166.7, tol: 0.001 }

  - id: curvas-bcd
    tipo: pregunta
    titulo: "Curvas B, C y D"
    texto: "Empareje cada curva con el margen de su disparo magnético."
    libro: [305, 307]
    widget:
      tipo: figura
      figura: fig-new-47-curvas
      zonas:
        - { id: curvas, rotulo: "Las zonas de disparo", rect: [0, 0, 312, 214] }
    emparejar:
      - ["Curva B", "De 3 a 5 veces I_{n}: protege líneas largas"]
      - ["Curva C", "De 5 a 10 veces I_{n}: la de uso general"]
      - ["Curva D", "De 10 a 20 veces I_{n}: transformadores y motores"]
    exito: "Entre los dos múltiplos de su curva, puede disparar o no."
    pistas:
      - { texto: "La que más irrupción tolera es la de los motores." }
    escalera:
      - "B, C y D van de menos a más tolerancia."
    solucion: "B, 3 a 5; C, 5 a 10; D, 10 a 20 veces I_{n}."

  - id: transformador-70a
    tipo: predecir
    titulo: "Conectar un transformador"
    texto: "Su conexión llega a 70 A eficaces en el primer semiperiodo, con un magnetotérmico de 10 A. ¿Cuál queda en duda?"
    libro: [305, "cap47#600"]
    widget:
      tipo: figura
      figura: fig-new-47-curvas
      zonas:
        - { id: curvas, rotulo: "Las zonas de disparo", rect: [0, 0, 312, 214] }
    opciones:
      - texto: "El C10: 70 A cae entre 50 y 100 A"
        bien: true
        porque: "Entre sus dos múltiplos puede disparar o no. El B10 dispara seguro; el D10, no."
      - texto: "El B10"
        porque: "70 A supera su múltiplo superior, 50 A: dispara con seguridad."
      - texto: "El D10"
        porque: "No llega a su múltiplo inferior, 100 A: no dispara magnéticamente."
    escalera:
      - "Multiplique 10 A por los márgenes de cada curva."
    solucion: "El C10, entre 50 y 100 A. Lo seguro: curva D o un limitador de irrupción."

  - id: estime-caida
    tipo: pregunta
    titulo: "La caída de tensión del banco"
    texto: "Banco a 25 m, 9,57 A, cable de 2,5 mm² con 9,55 Ω/km a 70 °C. ¿Qué caída, en porcentaje de 230 V?"
    libro: [313, 314, 330, 331]
    widget:
      tipo: figura
      figura: fig-new-47-banco
      zonas:
        - { id: linea, rotulo: "La línea", rect: [0, 0, 458, 129] }
    estimar:
      objetivo: "dV_pct"
      unidad: "%"
      min: 0
      max: 5
      paso: 0.01
      inicio: 1
      tol: 0.03
      rotulo: "Caída de tensión"
    exito: "4,57 V, el 1,99 %: por debajo del 5 % de los demás usos."
    pistas:
      - { cuando: { valor: estimacion, mayor: 2.05 }, texto: "Se ha pasado: 2 × 25 m son 50 m de cable." }
      - { texto: "Se ha quedado corto: la corriente va y vuelve, 2 × 25 m de conductor." }
    escalera:
      - "ΔV = 2 · L · I · R′, con R′ en Ω/m."
    solucion: "2 × 25 × 9,57 × 0,00955 = 4,57 V, el 1,99 %."
    comprobar:
      - { dV_pct: 1.99, dV: 4.57, dV_1: 0.994, tol: 0.003 }

  - id: isla-it
    tipo: porque
    titulo: "La isla que deja de serlo"
    texto: "Tras el transformador de aislamiento, la pinza de masa de un osciloscopio de sobremesa toca un lado. ¿Por qué tocar el otro es grave?"
    libro: [303]
    widget:
      tipo: figura
      figura: fig-new-47-esquemas
      zonas:
        - { id: it, rotulo: "A la derecha", rect: [300, 0, 142, 210] }
    opciones:
      - texto: "Ese lado queda a 230 V de tierra, y el diferencial no ve el secundario"
        bien: true
        porque: "La pinza va al PE por el cable de red: primer defecto. Con 1 kΩ, 230 mA sin diferencial."
      - texto: "No es grave: el transformador aísla"
        porque: "Aísla mientras sea una isla; el primer defecto la pone a tierra."
      - texto: "Porque el osciloscopio se quema"
        porque: "El problema es la persona: tocar el otro lado es tocar 230 V respecto a tierra."
    escalera:
      - "¿A qué está unida la pinza de masa de un osciloscopio de red?"
    solucion: "La pinza pone un lado a tierra: el otro queda a 230 V y el diferencial del cuadro no lo ve."

  - id: tipos-diferencial
    tipo: pregunta
    titulo: "Los tipos de diferencial"
    texto: "Empareje cada tipo con dónde hace falta."
    libro: [322, 323, 324]
    widget:
      tipo: figura
      figura: fig-new-47-residual
      zonas:
        - { id: corrientes, rotulo: "Las tres corrientes", rect: [0, 0, 463, 171] }
    emparejar:
      - ["AC", "Cargas lineales"]
      - ["A", "Rectificadores monofásicos: fuentes conmutadas, cargadores"]
      - ["F", "Variadores monofásicos: lavadoras, bombas"]
      - ["B", "Variadores e inversores trifásicos, cargadores de vehículo"]
    exito: "La continua casi lisa de un puente trifásico solo la ve el tipo B, y ciega a un AC o un A."
    pistas:
      - { texto: "El toroidal solo transmite variaciones de flujo." }
    escalera:
      - "Cuanto más lisa es la continua de la fuga, más «completo» debe ser el tipo."
    solucion: "AC, lineales; A, monofásicos; F, variadores monofásicos; B, trifásicos y cargadores."

  - id: estime-fuga
    tipo: pregunta
    titulo: "La fuga sin defecto"
    texto: "Cada equipo fuga 0,34 mA por su condensador Y de 4,7 nF. ¿Cuántos caben en el 30 % de un diferencial de 30 mA?"
    libro: [326, "cap47#600"]
    widget:
      tipo: figura
      figura: fig-new-47-residual
      zonas:
        - { id: fuga, rotulo: "La primera gráfica", rect: [0, 0, 155, 171] }
    estimar:
      objetivo: "n_eq"
      unidad: ""
      min: 0
      max: 60
      paso: 1
      inicio: 5
      tol: 0.04
      rotulo: "Equipos"
    exito: "Unos 26: 9 mA entre 0,34 mA. Se reparten circuitos; nunca se sube la sensibilidad."
    pistas:
      - { cuando: { valor: estimacion, mayor: 27.5 }, texto: "Se ha pasado: el presupuesto es el 30 % de 30 mA, 9 mA." }
      - { texto: "Se ha quedado corto: 9 mA entre 0,34 mA por equipo." }
    escalera:
      - "Calcule primero el 30 % de 30 mA."
    solucion: "9/0,340 = 26,5: caben 26 equipos."
    comprobar:
      - { n_eq: 26.5, I_fuga: 0.00034, tol: 0.01 }

  - id: selectividad
    tipo: pregunta
    titulo: "Que abra solo el de abajo"
    texto: "30 mA de uso general en el banco y, aguas arriba, otro de uso general. ¿Qué pasa con un defecto grande?"
    libro: [320]
    widget:
      tipo: figura
      figura: fig-new-47-banco
      zonas:
        - { id: cuadro, rotulo: "El cuadro", rect: [0, 0, 230, 129] }
    opciones:
      - texto: "Pueden abrir los dos: hace falta uno de tipo S arriba"
        bien: true
        porque: "El tipo S tiene retardo normalizado: espera a que abra el de abajo."
      - texto: "Abre solo el de abajo, siempre"
        porque: "Con dos de uso general abrirían los dos: ninguno espera."
      - texto: "Abre solo el de arriba"
        porque: "El de abajo, más sensible, también ve el defecto y abre."
    escalera:
      - "¿Cuál de los dos espera antes de abrir?"
    solucion: "Abrirían los dos; con 300 mA de tipo S arriba, solo el del banco."

  - id: boton-test
    tipo: pregunta
    titulo: "El botón de prueba"
    texto: "¿Qué comprueba el botón de prueba del diferencial?"
    libro: [334, 291]
    widget:
      tipo: figura
      figura: fig-new-47-banco
      zonas:
        - { id: cuadro, rotulo: "El cuadro", rect: [0, 0, 230, 129] }
    opciones:
      - texto: "El mecanismo, no la protección"
        bien: true
        porque: "No pasa por la toma de tierra ni mide el tiempo: eso es trabajo del instalador."
      - texto: "Que la toma de tierra está bien"
        porque: "La corriente de prueba no pasa por la toma de tierra."
      - texto: "Que abre en menos de 40 ms"
        porque: "No mide el tiempo de disparo."
    escalera:
      - "¿Por dónde circula la corriente del botón?"
    solucion: "Solo el mecanismo. Medir disparo, tierra y bucle es del instalador."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [287, 298, 300, 307, 326]
    ideas:
      - { titulo: "TT.", texto: "El defecto vuelve por el terreno: 10,5 A, la masa a 209 V; corta el diferencial." }
      - { titulo: "La tierra.", texto: "R_{A} · I_{Δn} ≤ 50 V: 1 667 Ω con 30 mA, 167 Ω con 300 mA." }
      - { titulo: "Curvas y cables.", texto: "B, C y D por la irrupción; caída por debajo del 5 %." }
      - { titulo: "Diferenciales.", texto: "El tipo según la electrónica; la fuga se reparte en circuitos." }
