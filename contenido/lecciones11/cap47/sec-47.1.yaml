# Lección 1.2 de la sección 48.1 «Los Instrumentos del Banco» (cap47; etiqueta interna sec-47.1).
# Formato: contenido/lecciones11/GUIA.md. La figura 48.1 (los cuatro instrumentos, con zonas) y la foto 48.2 (fuente
# de laboratorio, con zonas en píxeles de la foto de 1200 × 1600). El ancho de banda del osciloscopio, «al menos cinco
# veces la frecuencia máxima de interés» (bloque 11), con una señal de 10 MHz fijada en la tarjeta.
leccion: cap47/sec-47.1

libro:
  3: "Un banco de electrónica se puede montar con cuatro instrumentos"
  5: "El primero y el que más se usa"
  7: "Verdadero valor eficaz para alterna no senoidal"
  8: "detectar rizado y ruido, que es donde empiezan tantos diagnósticos"
  11: "al menos cinco veces la frecuencia máxima de interés"
  12: "Dos canales como mínimo"
  15: "las sondas importan tanto como el instrumento"
  18: "Límite de corriente ajustable, que es lo que convierte un cortocircuito en un aviso en lugar de en humo"
  19: "para no crear bucles de tierra"
  20: "el consumo dice mucho sobre lo que el circuito está haciendo"
  22: "es lo que permite levantar un Bode"
  25: "Por orden de rentabilidad"
  26: "Medidor de ESR, que detecta lo que el capacímetro no ve"
  27: "Carga electrónica"
  28: "Analizador lógico"
  29: "con un segundo de puerta, la cuenta es directamente la frecuencia en hercios, con resolución de 1 Hz"
  30: "Cámara térmica"
  31: "Estación de aire caliente"
  34: "un cuaderno, que es donde el diagnóstico se convierte en método"
  36: "su multímetro no sustituye a uno de precisión"
  38: "medir algo conocido"
  39: "inicia el control de deriva"
  40: "Los cuatro instrumentos básicos del banco"
  41: "indicadores de modo CV y CC"

modelo:
  valores:
    f_s: { sim: "f", nombre: "frecuencia máxima de la señal", unidad: Hz, valor: 10000000 }
  calculos:
    BW_min: { expr: "5*f_s", sim: "BW", nombre: "ancho de banda mínimo", unidad: Hz }

tarjetas:
  - id: explore-banco
    tipo: explorar
    titulo: "Cuatro instrumentos"
    texto: "Un banco se monta con cuatro instrumentos. Toque cada uno y lea qué aporta."
    libro: [3, 5, 40]
    widget:
      tipo: figura
      figura: fig-47.1
      zonas:
        - { id: multimetro, rotulo: "Arriba a la izquierda", rect: [3, 5, 220, 100], texto: "El multímetro, el primero y el que más se usa: dice cuánto vale." }
        - { id: osciloscopio, rotulo: "Arriba a la derecha", rect: [228, 5, 220, 100], texto: "El osciloscopio dice qué está pasando: la forma, el rizado, el ruido." }
        - { id: fuente, rotulo: "Abajo a la izquierda", rect: [3, 110, 220, 98], texto: "La fuente alimenta sin humo, con su límite de corriente." }
        - { id: generador, rotulo: "Abajo a la derecha", rect: [228, 110, 220, 98], texto: "El generador de funciones excita el circuito para probarlo." }
    requiere: { mover: [multimetro, osciloscopio, fuente, generador] }

  - id: lo-que-no-hace
    tipo: pregunta
    titulo: "Lo que el multímetro no hace"
    texto: "¿Qué no puede hacer un multímetro, por bueno que sea?"
    libro: [7, 8]
    widget:
      tipo: figura
      figura: fig-47.1
      zonas:
        - { id: multimetro, rotulo: "El multímetro", rect: [3, 5, 220, 100] }
    opciones:
      - texto: "Ver formas de onda, transitorios, rizado y ruido"
        bien: true
        porque: "Promedia y da un número. El rizado y el ruido, donde empiezan tantos diagnósticos, los ve el osciloscopio."
      - texto: "Medir alterna no senoidal"
        porque: "Uno de verdadero valor eficaz la mide bien; es una de las cosas que distinguen a uno bueno."
      - texto: "Medir capacidad y temperatura"
        porque: "La capacimetría y el termopar amplían mucho su utilidad: muchos los traen."
    escalera:
      - "¿Qué instrumento responde a «qué está pasando» en lugar de «cuánto vale»?"
    solucion: "Formas de onda, transitorios, rizado y ruido: eso es del osciloscopio."

  - id: estime-ancho
    tipo: pregunta
    titulo: "El ancho de banda"
    texto: "La señal más rápida que va a medir es de {{f_s}}. ¿Qué ancho de banda mínimo pide el osciloscopio?"
    libro: [11, 12, 15]
    fijar: { f_s: 10000000 }
    widget:
      tipo: figura
      figura: fig-47.1
      zonas:
        - { id: osciloscopio, rotulo: "El osciloscopio", rect: [228, 5, 220, 100] }
    estimar:
      objetivo: "BW_min"
      unidad: Hz
      min: 0
      max: 200000000
      paso: 1000000
      inicio: 10000000
      tol: 0.05
      rotulo: "Ancho de banda mínimo"
    exito: "Cinco veces la frecuencia máxima: 50 MHz. Para trabajo general, 50 o 100 MHz sobran."
    pistas:
      - { cuando: { valor: estimacion, mayor: 52500000 }, texto: "Se ha pasado: la regla pide cinco veces, no más." }
      - { texto: "Se ha quedado corto: con el mismo ancho de banda que la señal, la verá recortada. Cinco veces." }
    escalera:
      - "La regla es un múltiplo de la frecuencia máxima de interés."
    solucion: "5 × 10 MHz = 50 MHz."
    comprobar:
      - { BW_min: 50000000 }

  - id: toque-limite
    tipo: tocar
    titulo: "Alimentar sin humo"
    texto: "Toque lo que convierte un cortocircuito en un aviso en lugar de en humo."
    libro: [18, 41]
    widget:
      tipo: figura
      figura: fig-47.2
      zonas:
        - { id: corriente, rotulo: "Los dos mandos de la izquierda", rect: [173, 893, 387, 227] }
        - { id: tension, rotulo: "Los dos mandos de la derecha", rect: [640, 900, 387, 220] }
        - { id: pantalla, rotulo: "Las dos lecturas", rect: [267, 500, 800, 260] }
        - { id: bornes, rotulo: "Los bornes de abajo", rect: [533, 1187, 373, 107] }
    tocar:
      bien: [corriente]
      porque:
        tension: "Fijan la tensión. Con un cortocircuito, sin límite de corriente, la fuente daría todo lo que puede."
        pantalla: "Las lecturas diagnostican, pero no limitan nada."
        bornes: "Por ahí sale la corriente; no la limitan."
    exito: "El límite de corriente: por eso todo primer encendido se hace con él."
    escalera:
      - "Busque los mandos rotulados «CURRENT»."
    solucion: "Los mandos de corriente, grueso y fino: el límite ajustable."

  - id: doble-salida
    tipo: pregunta
    titulo: "Doble y aislada"
    texto: "¿Para qué conviene una fuente de doble salida y, si es posible, aislada?"
    libro: [19, 20]
    widget:
      tipo: figura
      figura: fig-47.1
      zonas:
        - { id: fuente, rotulo: "La fuente", rect: [3, 110, 220, 98] }
    opciones:
      - texto: "Para alimentar circuitos simétricos sin crear bucles de tierra"
        bien: true
        porque: "Dos salidas dan el ± de un circuito simétrico; aisladas, no cierran bucles por la tierra."
      - texto: "Para tener el doble de corriente"
        porque: "Pueden ponerse en paralelo, pero no es su razón de ser: es la simetría y el aislamiento."
      - texto: "Para medir el consumo de dos circuitos"
        porque: "La lectura de corriente diagnostica, pero esa es otra característica, no la doble salida."
    escalera:
      - "¿Qué necesita un circuito con alimentación positiva y negativa?"
    solucion: "Circuitos simétricos y, aislada, sin bucles de tierra."

  - id: generador
    tipo: pregunta
    titulo: "Más que señales de prueba"
    texto: "¿Qué permite el generador de funciones, más allá de lo evidente?"
    libro: [22]
    widget:
      tipo: figura
      figura: fig-47.1
      zonas:
        - { id: generador, rotulo: "El generador", rect: [228, 110, 220, 98] }
    opciones:
      - texto: "Levantar un Bode, inyectar señal y trazar características"
        bien: true
        porque: "Con amplitud y offset ajustables se adapta al circuito bajo prueba."
      - texto: "Medir el ancho de banda de una señal"
        porque: "El generador produce señales; medirlas es cosa del osciloscopio."
      - texto: "Alimentar el circuito"
        porque: "Da señal, no potencia: la alimentación es de la fuente."
    escalera:
      - "Piense en lo que se puede hacer al barrer la frecuencia de entrada."
    solucion: "Un Bode, la inyección de señal en diagnóstico y la característica de un componente."

  - id: despues
    tipo: pregunta
    titulo: "Los que vienen después"
    texto: "Ordene las compras que siguen a los cuatro básicos, de más a menos rentable."
    libro: [25, 26, 27, 28, 30, 31, 40]
    widget:
      tipo: figura
      figura: fig-47.1
      zonas:
        - { id: fila, rotulo: "La fila de abajo", rect: [3, 226, 445, 38] }
    ordenar:
      - "Medidor de ESR"
      - "Carga electrónica"
      - "Analizador lógico"
      - "Cámara térmica"
      - "Estación de aire caliente"
    exito: "El medidor de ESR es la compra adicional más recomendable para quien repare."
    pistas:
      - { texto: "El primero detecta lo que el capacímetro no ve." }
    escalera:
      - "Para reparar, lo primero es lo que encuentra condensadores secos."
    solucion: "ESR, carga electrónica, analizador lógico, cámara térmica y aire caliente."

  - id: frecuencimetro
    tipo: predecir
    titulo: "El frecuencímetro"
    texto: "Cuenta ciclos durante un tiempo de puerta conocido. Con un segundo de puerta, ¿qué da?"
    libro: [29]
    widget:
      tipo: figura
      figura: fig-47.1
      zonas:
        - { id: oscilo, rotulo: "El osciloscopio", rect: [228, 5, 220, 100] }
    opciones:
      - texto: "La frecuencia en hercios, con resolución de 1 Hz"
        bien: true
        porque: "Los ciclos de un segundo son los hercios. Su exactitud es la de su base de tiempos."
      - texto: "El periodo, con resolución de 1 s"
        porque: "Medir el periodo es la otra forma, para señales lentas: da más resolución en el mismo tiempo."
      - texto: "La frecuencia con la exactitud del osciloscopio"
        porque: "Se usa cuando hace falta más exactitud de la que da el osciloscopio."
    escalera:
      - "¿Cuántos ciclos caben en un segundo de una señal de f hercios?"
    solucion: "La cuenta es la frecuencia en hercios, con resolución de 1 Hz."

  - id: dos-limites
    tipo: pregunta
    titulo: "El instrumento de este libro"
    texto: "El FNIRSI 2C53T reúne osciloscopio, multímetro y generador. ¿Cuáles son sus dos límites?"
    libro: [36]
    widget:
      tipo: figura
      imagen: img/foto_fnirsi_kit.jpg
      zonas:
        - { id: kit, rotulo: "El 2C53T", rect: [0, 0, 1490, 1490] }
    opciones:
      - texto: "Su multímetro no es de precisión y su masa flotante exige precauciones"
        bien: true
        porque: "Para precisión, otro multímetro; la masa flotante es una libertad que hay que tratar como viva."
      - texto: "No tiene generador ni batería"
        porque: "Tiene las dos cosas: generador DDS y batería, que es lo que hace flotante su masa."
      - texto: "Solo tiene un canal"
        porque: "Tiene dos, el mínimo que pide el libro para un osciloscopio."
    escalera:
      - "Uno es de exactitud; el otro, de seguridad."
    solucion: "Un multímetro que no sustituye a uno de precisión y una masa flotante con sus precauciones."

  - id: algo-conocido
    tipo: porque
    titulo: "Antes de fiarse"
    texto: "Con un instrumento nuevo, lo primero es medir algo conocido: una pila nueva, una resistencia de precisión. ¿Por qué?"
    libro: [38, 39, 34]
    widget:
      tipo: figura
      figura: fig-47.1
      zonas:
        - { id: cuaderno, rotulo: "La última línea", rect: [3, 280, 445, 36] }
    opciones:
      - texto: "Mejor descubrir un error entonces que en mitad de un diagnóstico"
        bien: true
        porque: "Y anotada con su fecha, esa medida inicia el control de deriva: el cuaderno convierte el diagnóstico en método."
      - texto: "Para ajustarlo antes de usarlo"
        porque: "Medir algo conocido comprueba, no ajusta. Si no cuadra, lo sabrá antes de fiarse."
      - texto: "Para gastar la pila de prueba"
        porque: "La pila es la referencia, no el objetivo: se mide para saber si el instrumento acierta."
    escalera:
      - "¿Cuándo prefiere descubrir que un instrumento se equivoca?"
    solucion: "Para descubrir un error antes de un diagnóstico; anotada, inicia el control de deriva."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [3, 11, 18, 38]
    ideas:
      - { titulo: "Cuatro básicos.", texto: "Multímetro, osciloscopio, fuente y generador, cada uno con lo que aporta." }
      - { titulo: "Lo decisivo.", texto: "Osciloscopio de al menos cinco veces la señal; fuente con límite de corriente." }
      - { titulo: "Después.", texto: "Medidor de ESR primero; y el más barato de todos, un cuaderno." }
      - { titulo: "Antes de fiarse.", texto: "Medir algo conocido y anotarlo con su fecha." }
