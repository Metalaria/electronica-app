# Lección 1.2 de la sección 48.11 «Refrigeración Activa: Ventiladores y Peltier» (cap47; etiqueta interna sec-47.9).
# Formato: contenido/lecciones11/GUIA.md. Las curvas del punto de trabajo reproducen la figura 48.20: ventilador
# p = 60·(1 − q²) Pa y sistema p = k·q² (k = 60 Pa con filtro, 18 Pa despejada), con q el caudal en fracción del
# máximo: cortan en el 71 % y el 88 %, como la figura. El balance del Peltier (bloque 388): 20 W bombeados con 40 W
# eléctricos, 60 W en la cara caliente; la gráfica dibuja Q_caliente = Q_frío·(1 + 1/COP) a partir de COP 0,6, sin
# llegar al caso del libro (COP 0,5), para no dar la respuesta antes de tiempo. 1.2.1 (aprender haciendo): poner el
# filtro, tocar la configuración para ambientes sucios, el balance del Peltier, sus usos, la solución para decenas de W, la
# media velocidad, el fallo del ventilador y el aire frío a la salida. Dos preguntas: elegir por caudal y el problema
# global del Peltier.
# 1.2.1, segunda pasada: sin listas de respuestas disfrazadas; quedan las tarjetas que se hacen y dos preguntas.
# 1.3 (contenido13): vuelven, haciendo, la tabla de decisión (subir la potencia hasta que pide ventilador), la cara que
# necesita el disipador (tocar en la fig-47.15; era una pregunta), el ruido a media velocidad y los semiconductores de la
# célula (tocar en la foto 48.16): 2/4 → 6/7.
leccion: cap47/sec-47.9

libro:
  369: "Cuándo la convección natural no basta"
  372: "El ventilador y sus dos parámetros"
  376: "Empujar o extraer"
  377: "Dos filosofías con consecuencias distintas"
  381: "Lo que hay que prever"
  382: "El polvo, que se acumula en el disipador y lo aísla"
  386: "El Peltier y su malentendido"
  392: "La tabla de decisión"
  394: "En el banco"
  398: "Módulos termoeléctricos"
  370: "por encima de unos 10 W en un espacio cerrado empieza a no bastar"
  371: "por un factor de tres a cinco"
  373: "a caudal máximo la presión es cero, y a presión máxima el caudal es cero"
  374: "elegir por caudal solo"
  375: "El caudal real sale de cruzar la curva del ventilador con la curva del sistema"
  378: "el polvo solo entra por donde está el filtro"
  379: "entra aire por todas las rendijas, sin filtrar"
  380: "el camino del aire importa más que el caudal"
  383: "típicamente 30 000 a 70 000 horas"
  384: "a media velocidad el ventilador da la mitad de caudal y unos 15 dB menos de ruido"
  387: "permite enfriar por debajo del ambiente, cosa que ningún disipador puede"
  388: "bombear 20 W puede exigir 40 W eléctricos, y la cara caliente debe evacuar 60 W"
  389: "un Peltier empeora el problema térmico global y solo lo resuelve localmente"
  390: "estabilizar un láser o un cristal"
  391: "la cara fría condensa humedad"
  393: "Disipador con ventilador"
  395: "suele estar entre tres y cinco"
  396: "Si sale casi frío, el aire no está pasando por donde debe"
  397: "Punto de trabajo de un ventilador"

modelo:
  valores:
    k_s: { sim: "k", nombre: "resistencia de la caja", unidad: "", valor: 18 }
    Q_f: { sim: "Q_{frío}", nombre: "calor bombeado", unidad: W, valor: 20 }
    P_e: { sim: "P_{eléctrica}", nombre: "potencia eléctrica", unidad: W, valor: 40 }
    P_d: { sim: "P", nombre: "potencia a disipar", unidad: W, valor: 0.5 }
    v_f: { sim: "n", nombre: "velocidad del ventilador, del máximo", unidad: "%", valor: 100 }
  calculos:
    q_op: { expr: "100*sqrt(60/(60 + k_s))", sim: "caudal", nombre: "caudal real", unidad: "%", cifras: 2 }
    p_op: { expr: "k_s*(q_op/100)^2", sim: "p", nombre: "presión de trabajo", unidad: "", cifras: 2 }
    Q_c: { expr: "Q_f + P_e", sim: "Q_{caliente}", nombre: "calor de la cara caliente", unidad: W }
    COP: { expr: "Q_f/P_e", sim: "COP", nombre: "coeficiente de rendimiento", unidad: "", cifras: 2 }
    s_v: { expr: "ceil((P_d - 10)/1e9)*(1 - ceil((P_d - 100)/1e9))", sim: "ventilador", nombre: "pide disipador con ventilador", unidad: "" }
    q_v: { expr: "v_f", sim: "caudal", nombre: "caudal, del máximo", unidad: "%" }
    r_v: { expr: "-15*(1 - (v_f - 50)/50)", sim: "ruido", nombre: "ruido frente a la velocidad máxima", unidad: dB }

tarjetas:
  - id: explore-punto
    tipo: explorar
    titulo: "El punto de trabajo"
    texto: "El caudal real sale de cruzar la curva del ventilador con la de la caja. Ponga el filtro y mire cuánto cae el caudal."
    libro: [369, 370, 371, 372, 373, 375, 397]
    widget:
      tipo: grafica
      x: { id: q, min: 0, max: 100, unidad: "%", rotulo: "caudal, del máximo" }
      y: { min: 0, max: 65, unidad: "", rotulo: "presión estática (Pa)" }
      curvas:
        - { expr: "60*(1 - (q/100)^2)", color: azul, rotulo: "ventilador" }
        - { expr: "k_s*(q/100)^2", color: naranja, rotulo: "caja" }
      marcas:
        - { x: "q_op", y: "p_op", rotulo: "{{q_op}}" }
      lectura: { valor: q_op, rotulo: "Caudal real" }
      mandos:
        - { valor: k_s, lista: [18, 60], nombres: [despejada, con filtro], rotulo: "Caja" }
    objetivo:
      condiciones:
        - { valor: q_op, max: 75, rotulo: "Caudal real: {{q_op}}" }
      logrado: "Con filtro, el caudal real cae del 88 % al 71 %: lo decide el cruce de las dos curvas, no el caudal nominal."
      pistas:
        - { texto: "Ponga el filtro." }
    escalera:
      - "La caja con filtro pide más presión para el mismo caudal."
    solucion: "La caja con filtro."
    comprobar:
      - { con: { k_s: 18 }, q_op: 88 }
      - { con: { k_s: 60 }, q_op: 71 }

  - id: prediga-caudal
    tipo: predecir
    titulo: "Elegir por caudal"
    texto: "Un ventilador de gran caudal y poca presión estática, en una caja con rejillas estrechas y filtros. ¿Qué entrega?"
    libro: [374, 375]
    widget:
      tipo: grafica
      x: { id: q, min: 0, max: 100, unidad: "%", rotulo: "caudal, del máximo" }
      y: { min: 0, max: 65, unidad: "", rotulo: "presión estática (Pa)" }
      curvas:
        - { expr: "60*(1 - (q/100)^2)", color: azul, rotulo: "ventilador" }
    opciones:
      - texto: "Una fracción de lo que promete"
        bien: true
        porque: "Su presión no vence la resistencia de la caja: el punto de trabajo cae lejos del caudal máximo."
      - texto: "Su caudal nominal"
        porque: "El nominal es con presión cero: una caja con filtros pide presión."
      - texto: "Más de lo que promete"
        porque: "La caja solo puede restar caudal: el ventilador nunca da más que su máximo."
    escalera:
      - "¿Cuánta presión hay a caudal máximo?"
    solucion: "Una fracción: hay que cruzar la curva del ventilador con la de la caja."

  - id: explore-decision
    tipo: explorar
    titulo: "Cuándo hace falta ventilador"
    texto: "La tabla de decisión va por la potencia a disipar. Suba la potencia hasta la primera que ya pide disipador con ventilador."
    libro: [370, 393]
    inicio: { P_d: 0.5 }
    widget:
      tipo: grafica
      x: { id: pw, min: 0.1, max: 300, unidad: W, rotulo: "potencia a disipar", escala: log }
      y: { min: 0, max: 1.3, unidad: "", rotulo: "" }
      curvas:
        - { expr: "1 - ceil((pw - 1)/1e9)", color: verde, rotulo: "encapsulado y placa" }
        - { expr: "0.8*ceil((pw - 1)/1e9)*(1 - ceil((pw - 10)/1e9))", color: azul, rotulo: "disipador, convección natural" }
        - { expr: "0.6*ceil((pw - 10)/1e9)*(1 - ceil((pw - 100)/1e9))", color: naranja, rotulo: "disipador con ventilador" }
        - { expr: "0.4*ceil((pw - 100)/1e9)", color: tinta, rotulo: "ventilación forzada o líquido" }
      marcas:
        - { x: "P_d", y: "1.15", rotulo: "{{P_d}}" }
      lectura: { valor: P_d, rotulo: "Potencia" }
      mandos:
        - { valor: P_d, lista: [0.5, 2, 5, 10.5, 30, 150], rotulo: "Potencia a disipar" }
    objetivo:
      condiciones:
        - { valor: s_v, min: 1, rotulo: "Pide ventilador" }
      logrado: "Por encima de unos 10 W en un espacio cerrado, la convección natural deja de bastar; el ventilador baja la resistencia del disipador al ambiente de tres a cinco veces."
      pistas:
        - { texto: "Aún basta sin ventilador: suba la potencia." }
    escalera:
      - "La convección natural llega hasta unos 10 W."
    solucion: "Algo más de 10 W."
    comprobar:
      - { con: { P_d: 10.5 }, s_v: 1 }
      - { con: { P_d: 5 }, s_v: 0 }
      - { con: { P_d: 150 }, s_v: 0 }

  - id: simule-peltier
    tipo: simular
    titulo: "El balance de un Peltier"
    texto: "Una célula bombea 20 W desde la cara fría consumiendo 40 W eléctricos. ¿Cuánto debe evacuar la cara caliente?"
    libro: [387, 388]
    widget:
      tipo: grafica
      x: { id: c, min: 0.6, max: 3, unidad: "", rotulo: "COP" }
      y: { min: 0, max: 70, unidad: W, rotulo: "calor de la cara caliente" }
      curvas:
        - { expr: "Q_f*(1 + 1/c)", color: naranja, rotulo: "con 20 W bombeados" }
      lectura: { valor: Q_c, rotulo: "Cara caliente" }
      ocultar: true
    simular:
      objetivo: Q_c
      unidad: W
      tol: 0.03
      rotulo: "Calor de la cara caliente"
      errores:
        - { expr: "Q_f", texto: "Eso es solo lo bombeado. La cara caliente evacua además toda la potencia eléctrica." }
        - { expr: "P_e", texto: "Eso es solo la potencia eléctrica. Se suma al calor bombeado." }
        - { expr: "P_e - Q_f", texto: "No se restan: los dos calores acaban en la cara caliente." }
    exito: "60 W: el calor bombeado más toda la potencia eléctrica."
    escalera:
      - "Por conservación de la energía: ¿qué entra en la célula?"
    solucion: "20 + 40 = 60 W en la cara caliente."
    comprobar:
      - { Q_c: 60, COP: 0.5 }

  - id: empeora
    tipo: tocar
    titulo: "Empeora el problema global"
    texto: "Si el disipador de una de sus caras no basta, el salto térmico se reduce y el conjunto acaba peor que sin la célula. Toque esa cara."
    libro: [389, 397]
    widget:
      tipo: figura
      figura: fig-47.15
      zonas:
        - { id: fria, rotulo: "Arriba, con la flecha azul", rect: [268, 6, 100, 62] }
        - { id: celula, rotulo: "En medio, con la flecha naranja", rect: [268, 68, 135, 42] }
        - { id: caliente, rotulo: "Abajo, con la flecha roja", rect: [268, 110, 135, 50] }
    tocar:
      bien: [caliente]
      porque:
        fria: "La fría es la que enfría: de ella sale el calor bombeado."
        celula: "En la célula entra la potencia eléctrica, que también acaba en la cara caliente."
    exito: "La cara caliente: evacua lo bombeado más lo eléctrico, 60 W. Si su disipador no basta, se calienta y arrastra a la fría."
    escalera:
      - "¿A qué cara van a parar los 60 W?"
    solucion: "La cara caliente, abajo."

  - id: explore-pwm
    tipo: explorar
    titulo: "El ruido"
    texto: "El caudal es proporcional a las revoluciones, pero el ruido baja mucho más deprisa. Casi nunca hace falta el caudal máximo: dé la mitad."
    libro: [384]
    inicio: { v_f: 100 }
    widget:
      tipo: grafica
      x: { id: vv, min: 0, max: 100, unidad: "%", rotulo: "velocidad" }
      y: { min: 0, max: 110, unidad: "%", rotulo: "caudal, del máximo" }
      curvas:
        - { expr: "vv", color: azul, rotulo: "caudal" }
      marcas:
        - { x: "v_f", y: "q_v", rotulo: "{{q_v}}" }
      lectura: { valor: q_v, rotulo: "Caudal" }
      datos:
        - { valor: r_v, rotulo: "Ruido frente al máximo: {{r_v}}" }
      mandos:
        - { valor: v_f, lista: [50, 100], rotulo: "Velocidad" }
    objetivo:
      condiciones:
        - { valor: q_v, max: 50, rotulo: "Caudal: {{q_v}}" }
      logrado: "Mitad de caudal y unos 15 dB menos de ruido. Por eso el control PWM de la velocidad según la temperatura es hoy la norma."
      pistas:
        - { texto: "Baje la velocidad a la mitad." }
    escalera:
      - "Caudal proporcional a las revoluciones."
    solucion: "A media velocidad: la mitad de caudal."
    comprobar:
      - { r_v: 0, q_v: 100 }
      - { con: { v_f: 50 }, r_v: -15, q_v: 50 }

  - id: toque-celula
    tipo: tocar
    titulo: "Por dentro de una célula"
    texto: "Una célula Peltier bombea calor de una cara a otra al aplicarle corriente. Toque dónde están los semiconductores que lo hacen."
    libro: [387, 398]
    widget:
      tipo: figura
      figura: fig-47.16
      zonas:
        - { id: placa, rotulo: "Placa grande de la izquierda", rect: [100, 30, 600, 160] }
        - { id: filas, rotulo: "Borde de la célula de la izquierda", poligono: [[0, 225], [418, 362], [770, 195], [805, 240], [418, 425], [0, 285]] }
        - { id: cables, rotulo: "Cable de abajo", rect: [440, 428, 300, 130] }
        - { id: seebeck, rotulo: "Módulo de la derecha", rect: [1080, 70, 420, 360] }
    tocar:
      bien: [filas]
      porque:
        placa: "Es una de las dos placas cerámicas: una cara de la célula."
        cables: "Son los cables de alimentación: por ellos entra la corriente."
        seebeck: "Es otro módulo, para generar electricidad por efecto Seebeck, con su cara caliente marcada."
    exito: "Las filas que asoman entre las dos placas cerámicas: con corriente, bombean calor de una cara a la otra, y permiten bajar del ambiente."
    escalera:
      - "Busque entre las dos placas, en el borde."
    solucion: "El borde de la célula, entre las dos placas."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [371, 375, 388, 389, 376, 377, 378, 379, 380, 381, 382, 383, 384, 386, 390, 391, 392, 393, 394, 395, 396, 398]
    ideas:
      - { titulo: "Ventilar.", texto: "Baja R_{sa} de tres a cinco veces; el caudal real, cruzando las dos curvas." }
      - { titulo: "El camino.", texto: "Importa más que el caudal; y el ventilador, vigilado." }
      - { titulo: "El Peltier.", texto: "La cara caliente evacua lo bombeado más lo eléctrico: 20 + 40 = 60 W." }
      - { titulo: "Cuándo.", texto: "Solo para bajar del ambiente: un láser, un cristal, un sensor." }
