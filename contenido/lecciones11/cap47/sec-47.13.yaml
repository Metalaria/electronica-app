# Lección 1.2 de la sección 48.15 «Ampliación: Convección y Radiación» (cap47; etiqueta interna sec-47.13).
# Formato: contenido/lecciones11/GUIA.md. La no linealidad de la convección natural (bloque 497, ∝ ΔT^1,25) se dibuja
# como el calor evacuado relativo al de 50 °C, (ΔT/50)^1,25, frente a la recta que daría una resistencia constante;
# la resistencia efectiva relativa es (ΔT/50)^−0,25 (modelo de la tarjeta, sin números del fabricante). El paso de
# banco compara la misma medida con las aletas verticales y horizontales (bloques 517–518: del 20 al 30 % en
# resistencia térmica): el lector escribe la razón R_horizontal/R_vertical, esperada 1,25 ± 5 %.
leccion: cap47/sec-47.13

libro:
  492: "Ambos tienen leyes distintas y no lineales"
  495: "un disipador con las aletas verticales disipa bastante más que el mismo tumbado"
  496: "Puede multiplicar por tres o más la capacidad del mismo disipador"
  497: "la convección natural depende de la diferencia de temperatura elevada a 1,25 aproximadamente"
  499: "proporcional a T⁴ en kelvin y a la emisividad del acabado"
  501: "La mejora puede ser del 10 al 20 % en convección natural."
  502: "en un disipador de aletas negro ronda el 15–20 % entre 50 y 150 °C sobre el ambiente"
  503: "la radiación necesita ver un entorno frío"
  506: "Convección: 70 a 85 %."
  507: "Radiación: 15 a 30 %, según acabado y temperatura."
  508: "Conducción por los soportes: pequeña"
  509: "la radiación se vuelve despreciable"
  511: "Aletas verticales en convección natural, sin excepción."
  512: "Acabado negro si no hay ventilador; irrelevante si lo hay."
  513: "un disipador pegado a una pared pierde buena parte de su capacidad"
  514: "Entrada de aire abajo y salida arriba"
  517: "en vertical y en horizontal"
  518: "La diferencia suele ser del 20 al 30 % en resistencia térmica, y es gratis."
  519: "Convección y radiación frente a la temperatura"

modelo:
  valores:
    dT: { sim: "ΔT", nombre: "diferencia sobre el ambiente", unidad: "°C", valor: 50 }
    razon: { sim: "R_{horizontal}/R_{vertical}", nombre: "razón de resistencias", unidad: "", valor: 1.25 }
  calculos:
    q_rel: { expr: "(dT/50)^1.25", sim: "q", nombre: "calor evacuado relativo al de 50 °C", unidad: "", cifras: 3 }
    R_rel: { expr: "(dT/50)^(-0.25)", sim: "R", nombre: "resistencia efectiva relativa a la de 50 °C", unidad: "", cifras: 3 }

tarjetas:
  - id: explore-no-lineal
    tipo: explorar
    titulo: "La convección no es lineal"
    texto: "El calor por convección natural crece como ΔT elevada a 1,25. Caliente el disipador y mire su resistencia efectiva."
    libro: [492, 497]
    widget:
      tipo: grafica
      x: { id: d, min: 0, max: 150, unidad: "°C", rotulo: "ΔT sobre el ambiente" }
      y: { min: 0, max: 4, unidad: "", rotulo: "calor, relativo al de 50 °C" }
      curvas:
        - { expr: "(d/50)^1.25", color: naranja, rotulo: "convección natural" }
        - { expr: "d/50", color: tinta, rotulo: "si fuera lineal", discontinua: true }
      marcas:
        - { x: "dT", y: "q_rel", rotulo: "{{q_rel}}" }
      lectura: { valor: R_rel, rotulo: "Resistencia, relativa a la de 50 °C" }
      mandos:
        - { valor: dT, lista: [25, 50, 100, 150], rotulo: "ΔT" }
    requiere: { mover: [dT] }
    comprobar:
      - { con: { dT: 100 }, R_rel: 0.841 }

  - id: prediga-caliente
    tipo: predecir
    titulo: "Más caliente"
    texto: "Si un disipador trabaja más caliente sobre el ambiente, ¿qué le pasa a su resistencia térmica?"
    libro: [497]
    widget:
      tipo: grafica
      x: { id: d, min: 0, max: 150, unidad: "°C", rotulo: "ΔT sobre el ambiente" }
      y: { min: 0, max: 4, unidad: "", rotulo: "calor, relativo al de 50 °C" }
      curvas:
        - { expr: "d/50", color: tinta, rotulo: "si fuera lineal", discontinua: true }
    opciones:
      - texto: "Mejora: baja"
        bien: true
        porque: "El calor crece más deprisa que ΔT; las curvas del fabricante lo reflejan."
      - texto: "Es constante"
        porque: "Lo sería si la convección fuera lineal; crece como ΔT elevada a 1,25."
      - texto: "Empeora: sube"
        porque: "Al revés: más caliente, más convección por grado."
    escalera:
      - "Si el calor crece más deprisa que ΔT, ¿cuántos grados hacen falta por vatio?"
    solucion: "Mejora: la resistencia de un disipador no es constante."

  - id: reparto
    tipo: pregunta
    titulo: "Las tres juntas"
    texto: "Empareje cada mecanismo con su parte en un disipador real, en convección natural."
    libro: [506, 507, 508, 519]
    widget:
      tipo: figura
      figura: fig-47.20
      zonas:
        - { id: grafica, rotulo: "La gráfica", rect: [35, 20, 215, 165] }
    emparejar:
      - ["Convección", "70 a 85 %"]
      - ["Radiación", "15 a 30 %, según acabado y temperatura"]
      - ["Conducción por los soportes", "Pequeña, salvo atornillado al chasis"]
    exito: "Con ventilación forzada, la convección domina por completo."
    pistas:
      - { texto: "El aire que se mueve se lleva casi todo." }
    escalera:
      - "Empiece por la mayor."
    solucion: "Convección, 70–85 %; radiación, 15–30 %; soportes, pequeña."

  - id: negro
    tipo: pregunta
    titulo: "El color negro"
    texto: "¿Por qué los disipadores son de negro anodizado?"
    libro: [499, 501, 509]
    widget:
      tipo: figura
      figura: fig-47.11
      zonas:
        - { id: disipadores, rotulo: "Los disipadores", rect: [0, 0, 1600, 728] }
    opciones:
      - texto: "Radia mucho más que el aluminio pulido: hasta un 10–20 % mejor en convección natural"
        bien: true
        porque: "La radiación depende de la emisividad del acabado: esa es la razón real, no la estética."
      - texto: "Por estética"
        porque: "La razón real es la radiación, que depende de la emisividad."
      - texto: "Porque conduce mejor el calor"
        porque: "El anodizado no cambia la conducción: cambia lo que radia la superficie."
    escalera:
      - "¿De qué depende la radiación de una superficie, además de su temperatura?"
    solucion: "Radia más: del 10 al 20 % de mejora sin ventilador; con él, da igual."

  - id: caja-cerrada
    tipo: porque
    titulo: "Dentro de una caja cerrada"
    texto: "El mismo disipador negro, dentro de una caja cerrada. ¿Por qué su radiación deja de ayudar?"
    libro: [503]
    widget:
      tipo: figura
      figura: fig-47.20
      zonas:
        - { id: entorno, rotulo: "La caja de abajo a la derecha", rect: [266, 168, 176, 44] }
    opciones:
      - texto: "Radia hacia paredes que se calientan: necesita ver un entorno frío"
        bien: true
        porque: "Con el entorno caliente, lo que radia y lo que recibe se igualan: su contribución se anula."
      - texto: "Porque en una caja el negro se vuelve brillante"
        porque: "El acabado no cambia: cambia lo que ve alrededor."
      - texto: "Porque la caja no deja salir la luz"
        porque: "No es luz visible: es radiación térmica, y la reciben las paredes, que se calientan."
    escalera:
      - "¿Qué temperatura tienen al rato las paredes de una caja cerrada?"
    solucion: "La radiación necesita ver un entorno frío; las paredes se calientan y la anulan."

  - id: toque-ventilador
    tipo: tocar
    titulo: "Con ventilador, da igual"
    texto: "Toque la regla de diseño que deja de importar si hay ventilador."
    libro: [495, 496, 511, 512, 513, 514]
    widget:
      tipo: figura
      figura: fig-47.20
      zonas:
        - { id: aletas, rotulo: "Primera caja", rect: [266, 26, 176, 42] }
        - { id: acabado, rotulo: "Segunda caja", rect: [266, 74, 176, 42] }
        - { id: espacio, rotulo: "Tercera caja", rect: [266, 122, 176, 42] }
        - { id: entorno, rotulo: "Cuarta caja", rect: [266, 170, 176, 42] }
    tocar:
      bien: [acabado]
      porque:
        aletas: "Las aletas verticales son para la convección natural, pero el aire sigue teniendo que pasar entre ellas."
        espacio: "El espacio libre y la entrada abajo y salida arriba siguen contando: el aire tiene que circular."
        entorno: "Es la condición de la radiación dentro de una caja; la regla que cambia con ventilador es la del acabado."
    exito: "Acabado negro si no hay ventilador; irrelevante si lo hay."
    escalera:
      - "Con ventilación forzada, ¿qué mecanismo se vuelve despreciable?"
    solucion: "El acabado negro: con ventilador la radiación es despreciable."

  - id: banco-orientacion
    tipo: banco
    titulo: "Vertical u horizontal"
    texto: "Con una potencia conocida, mida la R_{sa} del disipador con las aletas verticales y tumbado. Escriba la razón entre las dos."
    libro: [517, 518]
    banco:
      piezas: ["Un disipador de aletas", "Un regulador o una resistencia de potencia conocida", "Multímetro con termopar"]
      medir: "R_{sa} = (T_{disipador} − T_{ambiente})/P en las dos posiciones; escriba R_{horizontal}/R_{vertical}."
      esperado: razon
      unidad: ""
      tol: 0.05
      consejos:
        - { cuando: { valor: desviacion, mayor: 0.05 }, texto: "Más del 30 %: ¿algo estorba el aire en horizontal, como la mesa debajo?" }
        - { texto: "Menos del 20 %: ¿ha esperado al régimen en las dos posiciones? ¿Están las aletas de verdad verticales?" }
      ficha: { n: 5, titulo: "Fuente de alimentación simétrica ±12 V" }

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [497, 502, 503, 511]
    ideas:
      - { titulo: "No lineal.", texto: "La convección natural crece como ΔT^{1,25}: la resistencia mejora en caliente." }
      - { titulo: "Radiación.", texto: "De un 15 a un 30 %; el negro radia más, si ve un entorno frío." }
      - { titulo: "Diseño.", texto: "Aletas verticales, espacio libre, aire de abajo arriba; negro solo sin ventilador." }
