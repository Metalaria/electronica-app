# Lección 1.2 de la sección 48.3 «Incertidumbre y Calibración» (cap47; etiqueta interna sec-47.3).
# Formato: contenido/lecciones11/GUIA.md. La especificación de dos términos «0,02 % + 5 dígitos» en el rango de 6 V con
# resolución de 0,1 mV (bloques 83–84): error relativo = (0,0002·lectura + 0,5 mV)/lectura, la curva de la figura 48.5.
# La combinación en cuadratura de 0,005, 0,001 y 0,002 % (bloque 89) y el TUR del multímetro de 0,02 % del problema
# 48.A (cap47#567: patrón de 0,005 %).
leccion: cap47/sec-47.3

libro:
  78: "se equivoca unas siete veces lo que vale su último dígito"
  79: "La resolución dice cuántos números puede mostrar el instrumento"
  82: "± (a % de la lectura + b dígitos)"
  83: "Con «0,02 % + 5 dígitos» en un rango de 6 V con resolución de 0,1 mV"
  84: "0,52 %"
  85: "se elige siempre el rango más bajo que no desborde"
  88: "u = sqrt("
  89: "la combinada es 0,0055 %: prácticamente la del patrón sola"
  90: "k = 2 da aproximadamente el 95 %"
  93: '"TUR" = ('
  94: "El criterio clásico es 4:1"
  95: "aparece una zona de duda"
  97: "Cada eslabón añade su incertidumbre"
  98: "está ajustado contra algo desconocido"
  101: "Puede no incluir ajuste."
  102: "debe documentar los valores antes y después"
  104: "su especificación ya no es aplicable"
  105: "el sustituto razonable es el control de deriva"
  107: "mantener una referencia de deriva"
  109: "la distinción entre verificar, ajustar y calibrar"
  "cap47#567": "para verificar un multímetro de 0,02 % hace falta un patrón de 0,005 %"

modelo:
  valores:
    lect: { sim: "lectura", nombre: "lectura", unidad: V, valor: 5 }
    p_a: { sim: "a", nombre: "término proporcional", unidad: "", valor: 0.0002 }
    fijo: { sim: "b", nombre: "término fijo, cinco dígitos de 0,1 mV", unidad: V, valor: 0.0005 }
    u_1: { sim: "u_{patrón}", nombre: "incertidumbre del patrón", unidad: "%", valor: 0.005 }
    u_2: { sim: "u_{resolución}", nombre: "incertidumbre por resolución", unidad: "%", valor: 0.001 }
    u_3: { sim: "u_{repetibilidad}", nombre: "incertidumbre por repetibilidad", unidad: "%", valor: 0.002 }
    tol_i: { sim: "tolerancia", nombre: "tolerancia del instrumento", unidad: "%", valor: 0.02 }
    u_p: { sim: "u_{patrón}", nombre: "incertidumbre del patrón", unidad: "%", valor: 0.02 }
    ppm_e: { sim: "exactitud", nombre: "exactitud básica", unidad: "", valor: 35 }
    cuentas: { sim: "cuentas", nombre: "resolución, una parte en", unidad: "", valor: 200000 }
  calculos:
    e_abs: { expr: "p_a*lect + fijo", sim: "error", nombre: "error máximo", unidad: V }
    e_rel: { expr: "100*e_abs/lect", sim: "error relativo", nombre: "error relativo", unidad: "%", cifras: 2 }
    e_prop: { expr: "100*p_a", sim: "a", nombre: "solo el término proporcional", unidad: "%", cifras: 2 }
    u_c: { expr: "sqrt(u_1^2 + u_2^2 + u_3^2)", sim: "u", nombre: "incertidumbre combinada", unidad: "%", cifras: 2 }
    u_lin: { expr: "u_1 + u_2 + u_3", sim: "Σ", nombre: "suma lineal", unidad: "%", cifras: 2 }
    U_exp: { expr: "2*u_c", sim: "U", nombre: "incertidumbre expandida, k = 2", unidad: "%", cifras: 2 }
    TUR: { expr: "tol_i/u_p", sim: "TUR", nombre: "relación de incertidumbres", unidad: "", cifras: 2 }
    veces: { expr: "ppm_e/(1000000/cuentas)", sim: "veces", nombre: "veces el último dígito", unidad: "" }

tarjetas:
  - id: explore-especificacion
    tipo: explorar
    titulo: "Dos términos"
    texto: "Especificación de «0,02 % + 5 dígitos» en el rango de 6 V. Baje la lectura y mire el error relativo."
    libro: [82, 83, 84]
    widget:
      tipo: grafica
      x: { id: x, min: 0.01, max: 10, unidad: V, rotulo: "lectura", escala: log }
      y: { min: 0.01, max: 10, unidad: "%", rotulo: "error relativo", escala: log }
      curvas:
        - { expr: "100*(p_a*x + fijo)/x", color: azul, rotulo: "error relativo" }
        - { expr: "100*p_a", color: tinta, rotulo: "término proporcional", discontinua: true }
      marcas:
        - { x: "lect", y: "e_rel", rotulo: "{{e_rel}}" }
      lectura: { valor: e_rel, rotulo: "Error relativo" }
      datos:
        - { valor: e_abs, rotulo: "Error máximo: {{e_abs}}" }
      mandos:
        - { valor: lect, lista: [0.1, 1, 5], rotulo: "Lectura" }
    requiere: { mover: [lect] }

  - id: estime-pequena
    tipo: pregunta
    titulo: "Una lectura de 0,1 V"
    texto: "Misma especificación: 0,02 % de la lectura más 0,5 mV fijos. ¿Qué error relativo tiene una lectura de 0,1 V?"
    libro: [83, 84]
    fijar: { lect: 0.1 }
    widget:
      tipo: grafica
      x: { id: x, min: 0.01, max: 10, unidad: V, rotulo: "lectura", escala: log }
      y: { min: 0.01, max: 10, unidad: "%", rotulo: "error relativo", escala: log }
      curvas:
        - { expr: "100*p_a", color: tinta, rotulo: "término proporcional", discontinua: true }
    estimar:
      objetivo: "e_rel"
      unidad: "%"
      min: 0
      max: 1
      paso: 0.01
      inicio: 0.02
      tol: 0.05
      rotulo: "Error relativo"
    exito: "0,52 %: con lecturas pequeñas domina el término fijo."
    pistas:
      - { cuando: { valor: estimacion, mayor: 0.546 }, texto: "Se ha pasado: 0,5 mV sobre 0,1 V es medio punto, más un poco." }
      - { texto: "Se ha quedado corto: el término fijo, 0,5 mV, pesa mucho sobre 0,1 V." }
    escalera:
      - "Sume 0,02 mV del proporcional y 0,5 mV del fijo, y divida por 0,1 V."
    solucion: "0,52 mV sobre 0,1 V: 0,52 %."
    comprobar:
      - { e_rel: 0.52, e_prop: 0.02 }

  - id: rango
    tipo: pregunta
    titulo: "El rango más bajo"
    texto: "Se elige siempre el rango más bajo que no desborde. ¿Por qué?"
    libro: [85]
    widget:
      tipo: figura
      figura: fig-47.5
      zonas:
        - { id: grafica, rotulo: "La gráfica", rect: [30, 15, 215, 175] }
    opciones:
      - texto: "Cambiar de rango reduce el término fijo en la misma proporción"
        bien: true
        porque: "Los dígitos fijos valen menos en un rango más bajo: el error relativo deja de dispararse."
      - texto: "El rango alto daña el instrumento"
        porque: "No lo daña: solo deja que el término fijo pese más sobre una lectura pequeña."
      - texto: "Da igual el rango"
        porque: "No da igual: con lecturas pequeñas el término fijo domina y el error se dispara."
    escalera:
      - "¿Qué término de la especificación depende del rango?"
    solucion: "Un rango más bajo reduce el término fijo en la misma proporción."

  - id: resolucion
    tipo: pregunta
    titulo: "Exactitud no es resolución"
    texto: "Cinco dígitos y medio: una parte en 200 000; exactitud de 35 partes por millón. ¿Cuántas veces su último dígito se equivoca?"
    libro: [78, 79]
    widget:
      tipo: figura
      figura: fig-47.5
      zonas:
        - { id: grafica, rotulo: "La gráfica", rect: [30, 15, 215, 175] }
    estimar:
      objetivo: "veces"
      unidad: ""
      min: 0
      max: 20
      paso: 0.5
      inicio: 1
      tol: 0.08
      rotulo: "Veces el último dígito"
    exito: "Unas siete: la resolución dice cuántos números muestra; la exactitud, cuántos significan algo."
    pistas:
      - { cuando: { valor: estimacion, mayor: 7.5 }, texto: "Se ha pasado: una parte en 200 000 son 5 ppm." }
      - { texto: "Se ha quedado corto: 35 ppm frente a las 5 ppm de un dígito." }
    escalera:
      - "Pase la resolución a partes por millón."
    solucion: "1/200 000 = 5 ppm; 35/5 = 7 veces."
    comprobar:
      - { veces: 7 }

  - id: formula-combinada
    tipo: formula
    titulo: "Se combinan en cuadratura"
    texto: "Patrón, resolución y repetibilidad, como incertidumbres típicas. Mejore las pequeñas y mire la combinada."
    libro: [88, 89]
    ec: 88
    sustitucion: "√({{u_1}}² + {{u_2}}² + {{u_3}}²) = {{u_c}}"
    widget:
      tipo: grafica
      x: { id: q, min: 0, max: 0.01, unidad: "%", rotulo: "incertidumbre del patrón" }
      y: { min: 0, max: 0.012, unidad: "%", rotulo: "combinada" }
      curvas:
        - { expr: "sqrt(q^2 + u_2^2 + u_3^2)", color: naranja, rotulo: "combinada" }
        - { expr: "q", color: tinta, rotulo: "el patrón solo", discontinua: true }
      marcas:
        - { x: "u_1", y: "u_c", rotulo: "{{u_c}}" }
      lectura: { valor: u_c, rotulo: "Combinada" }
      mandos:
        - { valor: u_2, lista: [0, 0.001, 0.002], rotulo: "Resolución" }
        - { valor: u_3, lista: [0, 0.002, 0.004], rotulo: "Repetibilidad" }
    comprobar:
      - { u_c: 0.0055, u_lin: 0.008 }

  - id: dominante
    tipo: predecir
    titulo: "Qué mejorar"
    texto: "Con 0,005 %, 0,001 % y 0,002 %, la combinada es 0,0055 %. ¿Qué la mejora?"
    libro: [89]
    widget:
      tipo: grafica
      x: { id: q, min: 0, max: 0.01, unidad: "%", rotulo: "incertidumbre del patrón" }
      y: { min: 0, max: 0.012, unidad: "%", rotulo: "combinada" }
      curvas:
        - { expr: "sqrt(q^2 + u_2^2 + u_3^2)", color: naranja, rotulo: "combinada" }
    opciones:
      - texto: "Un patrón mejor"
        bien: true
        porque: "La fuente dominante manda: mejorar las demás no sirve de nada hasta atacarla."
      - texto: "Más resolución"
        porque: "Pasar la resolución a cero apenas mueve la combinada: es la menor de las tres."
      - texto: "Repetir más lecturas"
        porque: "Baja la repetibilidad, pero la combinada sigue siendo prácticamente la del patrón."
    escalera:
      - "¿Cuál de las tres es casi toda la combinada?"
    solucion: "El patrón: 0,0055 % es prácticamente la del patrón sola."

  - id: cobertura
    tipo: pregunta
    titulo: "El factor de cobertura"
    texto: "Una incertidumbre expandida de ±0,011 % con k = 2. ¿Qué significa?"
    libro: [90]
    widget:
      tipo: grafica
      x: { id: z, min: -4, max: 4, unidad: "", rotulo: "desviaciones típicas" }
      y: { min: 0, max: 0.45, unidad: "", rotulo: "densidad" }
      curvas:
        - { expr: "exp(-z^2/2)/sqrt(2*pi)", color: azul, rotulo: "normal" }
      marcas:
        - { x: "-2", y: "0", rotulo: "−2u" }
        - { x: "2", y: "0", rotulo: "+2u" }
    opciones:
      - texto: "El valor real está en ese intervalo con un 95 % de probabilidad"
        bien: true
        porque: "k = 2 da aproximadamente el 95 %: dos desviaciones típicas a cada lado."
      - texto: "El valor real está seguro dentro del intervalo"
        porque: "Ningún intervalo es seguro: el factor de cobertura fija un nivel de confianza."
      - texto: "El error es exactamente 0,011 %"
        porque: "Es una incertidumbre, no un error conocido: si se conociera, se corregiría."
    escalera:
      - "¿Cuánta probabilidad hay entre −2 y +2 desviaciones típicas?"
    solucion: "Que el valor real está en ±0,011 % con un 95 % de probabilidad."
    comprobar:
      - { U_exp: 0.011 }

  - id: ajuste-tur
    tipo: ajuste
    titulo: "Un patrón cuatro veces mejor"
    texto: "Va a verificar un multímetro de 0,02 %. Mejore el patrón hasta un TUR de 4:1."
    libro: [93, 94, 95, "cap47#567"]
    inicio: { u_p: 0.02 }
    widget:
      tipo: grafica
      x: { id: q, min: 0.002, max: 0.02, unidad: "%", rotulo: "incertidumbre del patrón" }
      y: { min: 0, max: 11, unidad: "", rotulo: "TUR" }
      curvas:
        - { expr: "tol_i/q", color: naranja, rotulo: "TUR" }
        - { expr: "4", color: tinta, rotulo: "4:1", discontinua: true }
      marcas:
        - { x: "u_p", y: "TUR", rotulo: "{{TUR}}" }
      lectura: { valor: TUR, rotulo: "TUR" }
      mandos:
        - { valor: u_p, lista: [0.02, 0.01, 0.005, 0.002], rotulo: "Incertidumbre del patrón" }
    ajuste:
      valor: TUR
      min: 4
      max: 10
      rotulo: "TUR"
      escala: { min: 0, max: 12 }
      bajo: "Patrón demasiado cercano: aparece una zona de duda. Mejórelo."
      alto: "Sobra."
      dentro: "0,005 %: con 4:1 el patrón contribuye poco y la verificación es concluyente."

  - id: tres-cosas
    tipo: pregunta
    titulo: "Tres cosas que se confunden"
    texto: "Empareje cada operación con lo que hace."
    libro: [101, 102, 109]
    widget:
      tipo: figura
      figura: fig-47.5
      zonas:
        - { id: cajas, rotulo: "Las tres cajas", rect: [266, 30, 170, 160] }
    emparejar:
      - ["Verificar", "Comprobar si está dentro de su especificación, sin modificarlo"]
      - ["Ajustar", "Modificarlo para acercarlo al valor correcto"]
      - ["Calibrar", "Determinar y documentar la relación con el valor real"]
    exito: "Calibrar puede no incluir ajuste."
    pistas:
      - { texto: "Solo una de las tres toca el instrumento." }
    escalera:
      - "La que documenta incluye la incertidumbre."
    solucion: "Verificar comprueba; ajustar corrige; calibrar determina y documenta con su incertidumbre."

  - id: trazable
    tipo: porque
    titulo: "Calibrado sin certificado"
    texto: "Un instrumento «calibrado» sin certificado trazable. ¿Qué es en realidad?"
    libro: [97, 98]
    widget:
      tipo: figura
      figura: fig-47.5
      zonas:
        - { id: calibrar, rotulo: "La caja de abajo", rect: [266, 125, 170, 64] }
    opciones:
      - texto: "Un instrumento ajustado contra algo desconocido"
        bien: true
        porque: "Una calibración vale lo que valga su cadena, hasta un patrón nacional."
      - texto: "Un instrumento calibrado, aunque sin papeles"
        porque: "Sin la cadena no se sabe con qué se comparó ni con qué incertidumbre."
      - texto: "Un instrumento verificado"
        porque: "Verificar también exige un patrón conocido y mejor."
    escalera:
      - "¿Con qué se comparó, y cómo se sabe?"
    solucion: "Está ajustado contra algo desconocido: no está calibrado."

  - id: deriva
    tipo: pregunta
    titulo: "Tres años sin calibrar"
    texto: "Un instrumento lleva tres años sin calibrar. ¿Qué se puede decir?"
    libro: [104, 105, 107]
    widget:
      tipo: figura
      figura: fig-47.5
      zonas:
        - { id: verificar, rotulo: "La caja de arriba", rect: [266, 30, 170, 50] }
    opciones:
      - texto: "Que su especificación ya no es aplicable, aunque no esté mal"
        bien: true
        porque: "La especificación de un año incluye la deriva de ese plazo. Sin calibración, el control de deriva lo vigila."
      - texto: "Que está mal y hay que tirarlo"
        porque: "No está necesariamente mal: lo que ya no vale es su especificación."
      - texto: "Que sigue valiendo su especificación"
        porque: "La especificación incluye la deriva de un año: pasado ese plazo, ya no se aplica."
    escalera:
      - "¿Por qué las especificaciones se dan «para un año»?"
    solucion: "Su especificación ya no es aplicable; medir una referencia y anotarla detecta si se ha ido."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [78, 85, 89, 94]
    ideas:
      - { titulo: "Exactitud y resolución.", texto: "La resolución dice cuántos números muestra; la exactitud, cuántos significan algo." }
      - { titulo: "Dos términos.", texto: "Con lecturas pequeñas manda el fijo: el rango más bajo que no desborde." }
      - { titulo: "Cuadratura.", texto: "La fuente dominante manda; k = 2 da aproximadamente el 95 %." }
      - { titulo: "4:1.", texto: "El patrón, al menos cuatro veces mejor; y su cadena, hasta un patrón nacional." }
