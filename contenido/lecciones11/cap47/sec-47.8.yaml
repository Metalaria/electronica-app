# Lección 1.2 de la sección 48.10 «Seguridad en el Laboratorio» (cap47; etiqueta interna sec-47.8).
# Formato: contenido/lecciones11/GUIA.md. Las reglas con red de la figura 48.19 con zonas; los 230 mA de 230 V con
# 1 kΩ (bloque 341) en el esquema «resistencia» (valores eficaces).
leccion: cap47/sec-47.8

libro:
  337: "y son tres: eléctrico, térmico y químico"
  340: "Fibrilación ventricular"
  341: "Con 230 V y 1 kΩ, un valor corriente, circulan 230 mA"
  342: "50 V en alterna y 120 V en continua"
  345: "Una mano en el bolsillo"
  346: "Nunca solo"
  347: "Diferencial en la instalación"
  348: "Transformador de aislamiento para medir en el primario"
  349: "Un condensador de bus de una fuente conmutada guarda energía peligrosa durante minutos"
  350: "Ese último punto es el que más accidentes causa en reparación"
  352: "El soldador está a 350 °C y no lo parece"
  353: "Gafas de protección, que es la medida más ignorada y la que protege lo irreemplazable"
  354: "Los componentes de potencia queman aunque el circuito lleve minutos apagado"
  355: "Los electrolíticos explotan si se polarizan al revés"
  357: "El humo de soldar es del flux, no del plomo"
  358: "El plomo entra por ingestión"
  359: "son inflamables y sus vapores también"
  360: "sofocarlo no sirve"
  362: "extintor apropiado para fuego eléctrico"
  363: "poder alcanzarlo sin acercarse al banco"
  365: "medir antes de tocar"
  367: "las reglas innegociables con red"

modelo:
  valores:
    V_c: { sim: "V", nombre: "tensión de la red", unidad: V, valor: 230 }
    R_b: { sim: "R_{cuerpo}", nombre: "resistencia del cuerpo", unidad: Ω, valor: 1000 }
  calculos:
    I_b: { expr: "V_c/R_b", sim: "I", nombre: "corriente por el cuerpo", unidad: A }

tarjetas:
  - id: explore-reglas
    tipo: explorar
    titulo: "Las reglas innegociables"
    texto: "Toque cada regla del trabajo con red y lea por qué."
    libro: [345, 346, 347, 348, 349, 367]
    widget:
      tipo: figura
      figura: fig-47.14
      zonas:
        - { id: mano, rotulo: "Primera regla", rect: [220, 6, 230, 36], texto: "Una mano en el bolsillo, para que la corriente no atraviese el pecho." }
        - { id: solo, rotulo: "Segunda regla", rect: [220, 36, 230, 36], texto: "Nunca solo, si se trabaja con tensiones peligrosas." }
        - { id: diferencial, rotulo: "Tercera regla", rect: [220, 66, 230, 36], texto: "Diferencial en la instalación, que corta ante una fuga de 30 mA." }
        - { id: transformador, rotulo: "Cuarta regla", rect: [220, 96, 230, 36], texto: "Transformador de aislamiento para medir en el primario." }
        - { id: condensadores, rotulo: "Quinta regla", rect: [220, 126, 230, 36], texto: "Descargar los condensadores y comprobarlo con el multímetro: guardan energía durante minutos." }
    requiere: { mover: [mano, solo, diferencial, transformador, condensadores] }

  - id: estime-230
    tipo: pregunta
    titulo: "Un valor corriente"
    texto: "230 V a través de un cuerpo de 1 kΩ, un valor corriente. ¿Qué corriente circula?"
    libro: [340, 341]
    fijar: { V_c: 230, R_b: 1000 }
    widget:
      tipo: circuito
      esquema: resistencia
      piezas: { fuente: V_c, r: R_b }
      corriente: I_b
      mide: { corriente: I_b, tension: V_c }
      mandos: []
    estimar:
      objetivo: "I_b"
      unidad: A
      min: 0
      max: 0.5
      paso: 0.005
      inicio: 0.03
      tol: 0.03
      rotulo: "Corriente por el cuerpo"
    exito: "230 mA: mucho más que los 50 mA de la fibrilación."
    pistas:
      - { cuando: { valor: estimacion, mayor: 0.237 }, texto: "Se ha pasado: 230 V entre 1000 Ω." }
      - { texto: "Se ha quedado corto: un kilohmio con 230 V deja pasar más de 50 mA." }
    escalera:
      - "Ley de Ohm, en valores eficaces."
    solucion: "230/1000 = 230 mA."
    comprobar:
      - { I_b: 0.23 }

  - id: umbral-seguro
    tipo: pregunta
    titulo: "La tensión que se considera segura"
    texto: "¿Por debajo de qué tensiones el riesgo de electrocución es despreciable en condiciones normales?"
    libro: [342]
    widget:
      tipo: figura
      figura: fig-47.14
      zonas:
        - { id: barras, rotulo: "Las barras", rect: [0, 15, 210, 165] }
    opciones:
      - texto: "50 V en alterna y 120 V en continua"
        bien: true
        porque: "Es el umbral de seguridad del libro, en condiciones normales: con las manos mojadas, cuidado."
      - texto: "230 V en las dos"
        porque: "230 V con 1 kΩ dan 230 mA: mortal."
      - texto: "120 V en alterna y 50 V en continua"
        porque: "Al revés: la continua es la que admite más, 120 V; la alterna, 50 V."
    escalera:
      - "La continua admite más tensión que la alterna."
    solucion: "50 V en alterna y 120 V en continua."

  - id: toque-accidentes
    tipo: tocar
    titulo: "La que más accidentes causa"
    texto: "En reparación, ¿qué regla es la que más accidentes evita? Tóquela."
    libro: [349, 350]
    widget:
      tipo: figura
      figura: fig-47.14
      zonas:
        - { id: mano, rotulo: "Primera regla", rect: [220, 6, 230, 36] }
        - { id: solo, rotulo: "Segunda regla", rect: [220, 36, 230, 36] }
        - { id: diferencial, rotulo: "Tercera regla", rect: [220, 66, 230, 36] }
        - { id: transformador, rotulo: "Cuarta regla", rect: [220, 96, 230, 36] }
        - { id: condensadores, rotulo: "Quinta regla", rect: [220, 126, 230, 36] }
    tocar:
      bien: [condensadores]
      porque:
        mano: "Importante con tensión presente; pero el accidente típico es con el aparato desenchufado."
        solo: "Importante; pero el accidente típico de reparación llega cuando parece seguro."
        diferencial: "Corta las fugas a tierra; no descarga un condensador."
        transformador: "Permite medir en el primario; no descarga nada."
    exito: "El aparato está desenchufado y parece seguro, pero el condensador de bus guarda energía durante minutos."
    escalera:
      - "¿Qué sigue peligroso con el aparato desenchufado?"
    solucion: "Descargar los condensadores y comprobarlo con el multímetro."

  - id: tres-riesgos
    tipo: pregunta
    titulo: "Los tres riesgos"
    texto: "Empareje cada riesgo del laboratorio con un ejemplo."
    libro: [337, 352, 355, 357, 359]
    widget:
      tipo: figura
      figura: fig-47.14
      zonas:
        - { id: barras, rotulo: "Las barras", rect: [0, 15, 210, 165] }
    emparejar:
      - ["Eléctrico", "Un condensador de bus cargado"]
      - ["Térmico", "El soldador, a 350 °C"]
      - ["Químico", "El humo del flux"]
    exito: "No es peligroso si se conocen sus riesgos, y son esos tres."
    pistas:
      - { texto: "El humo irrita: es químico." }
    escalera:
      - "Empiece por el que quema."
    solucion: "Eléctrico, el condensador; térmico, el soldador; químico, el humo del flux."

  - id: gafas
    tipo: pregunta
    titulo: "Lo irreemplazable"
    texto: "El estaño fundido salpica al desoldar con muelle. ¿Cuál es la medida más ignorada?"
    libro: [352, 353, 354]
    widget:
      tipo: figura
      figura: fig-47.14
      zonas:
        - { id: caja, rotulo: "La caja de abajo", rect: [220, 168, 230, 47] }
    opciones:
      - texto: "Las gafas de protección"
        bien: true
        porque: "Protegen lo irreemplazable. Y el soporte del soldador no es opcional."
      - texto: "Los guantes"
        porque: "El libro señala las gafas como la medida más ignorada: protegen los ojos."
      - texto: "Esperar a que se enfríe el estaño"
        porque: "La salpicadura ocurre al trabajar; lo que protege son las gafas."
    escalera:
      - "¿Qué parte del cuerpo no se puede reponer?"
    solucion: "Las gafas: la medida más ignorada y la que protege lo irreemplazable."

  - id: plomo
    tipo: pregunta
    titulo: "El plomo y el humo"
    texto: "Al soldar con estaño con plomo, ¿por dónde entra el plomo en el cuerpo?"
    libro: [357, 358]
    widget:
      tipo: figura
      figura: fig-47.14
      zonas:
        - { id: barras, rotulo: "Las barras", rect: [0, 15, 210, 165] }
    opciones:
      - texto: "Por ingestión: lavarse las manos y no comer en el banco"
        bien: true
        porque: "El humo es del flux, un irritante respiratorio: aspiración siempre, pero el plomo va por la boca."
      - texto: "Por el humo"
        porque: "El humo de soldar es del flux, no del plomo."
      - texto: "Por la piel, al tocar el estaño"
        porque: "Entra al comer o tocarse la boca con las manos sucias: por ingestión."
    escalera:
      - "¿De qué es el humo que se ve al soldar?"
    solucion: "Por ingestión; el humo es del flux."

  - id: prediga-litio
    tipo: predecir
    titulo: "Una celda de litio en fuga térmica"
    texto: "Una celda de litio dañada entra en fuga térmica. ¿Qué funciona?"
    libro: [360]
    widget:
      tipo: figura
      figura: fig-47.14
      zonas:
        - { id: caja, rotulo: "La caja de abajo", rect: [220, 168, 230, 47] }
    opciones:
      - texto: "Enfriar con mucha agua, o aislarla en un recipiente ignífugo"
        bien: true
        porque: "Es un incendio que genera su propio oxígeno: hay que enfriar o dejar que se consuma aislada."
      - texto: "Sofocarlo con una manta"
        porque: "Genera su propio oxígeno: sofocarlo no sirve."
      - texto: "Desconectarla y esperar"
        porque: "La fuga térmica sigue sola: hay que enfriar o aislarla."
    escalera:
      - "¿Necesita ese fuego el oxígeno del aire?"
    solucion: "Mucha agua o un recipiente ignífugo: sofocarlo no sirve."

  - id: interruptor-general
    tipo: pregunta
    titulo: "Lo que se aprecia una sola vez"
    texto: "Además de gafas, aspiración, extintor y botiquín, ¿qué conviene saber?"
    libro: [362, 363]
    widget:
      tipo: figura
      figura: fig-47.14
      zonas:
        - { id: reglas, rotulo: "Las reglas", rect: [220, 10, 230, 152] }
    opciones:
      - texto: "Dónde está el interruptor general, y alcanzarlo sin acercarse al banco"
        bien: true
        porque: "Si alguien no puede soltar, cortar sin tocarlo es lo que salva."
      - texto: "El teléfono del instalador"
        porque: "Útil, pero lo urgente es poder cortar la corriente sin acercarse."
      - texto: "Dónde está el manual de cada equipo"
        porque: "En un accidente eléctrico lo que cuenta es cortar la red al instante."
    escalera:
      - "Si alguien queda agarrado a un cable, ¿qué hay que poder hacer sin tocarlo?"
    solucion: "Saber dónde está el interruptor general y alcanzarlo sin acercarse al banco."

  - id: medir-antes
    tipo: porque
    titulo: "Cinco segundos"
    texto: "La costumbre que más accidentes evita es medir antes de tocar. ¿Qué se mide?"
    libro: [365, 349]
    widget:
      tipo: figura
      figura: fig-47.14
      zonas:
        - { id: caja, rotulo: "La caja de abajo", rect: [220, 168, 230, 47] }
    opciones:
      - texto: "Que el condensador está descargado y el punto sin tensión, con el multímetro"
        bien: true
        porque: "Con la práctica se vuelve automático: la misma disciplina de la inspección visual."
      - texto: "La temperatura de la placa"
        porque: "Los componentes de potencia queman, sí, pero la regla de medir antes es eléctrica."
      - texto: "La resistencia de la piel"
        porque: "Se mide el circuito, no a uno mismo: que no haya tensión."
    escalera:
      - "¿Qué puede seguir peligroso con el aparato desenchufado?"
    solucion: "Con el multímetro: condensador descargado y punto sin tensión."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [337, 341, 350, 365]
    ideas:
      - { titulo: "Tres riesgos.", texto: "Eléctrico, térmico y químico." }
      - { titulo: "La corriente mata.", texto: "230 V con 1 kΩ: 230 mA; seguro, por debajo de 50 V alterna o 120 continua." }
      - { titulo: "Condensadores.", texto: "Desenchufado parece seguro: es el punto que más accidentes causa." }
      - { titulo: "Medir antes de tocar.", texto: "Cinco segundos con el multímetro." }
