# Lección 1.2 de la sección 53.1 «Objetivo y Especificaciones» (cap52, sec-52.1). Formato: GUIA.md.
# - La especificación y lo que determina cada línea, sobre la figura 53.1.
# - El círculo I/Q en modo XY del criterio de aceptación (bloque 43, figura 53.3): I = cos θ y Q = g·sen(θ + φ), con g
#   la ganancia relativa de Q y φ el error de fase respecto a 90°. Sin curvas paramétricas, la figura se dibuja como dos
#   ramas: Q = g·(x·sen φ ± cos φ·√(1 − x²)). g = 1 y φ = 0, círculo; g ≠ 1, elipse; g = 0, recta horizontal (un canal
#   muerto); φ = 90°, recta inclinada (los dos en fase). Los valores de g y φ son de ejemplo (el de 40° es el de la
#   figura).
# Sin paso práctico nuevo: la figura 53.1 ya escribe la respuesta de cada línea; el lector explora el círculo XY.
leccion: cap52/sec-52.1

libro:
  3: "conviene fijarla con números antes de elegir nada"
  5: "Banda: 3,5 a 7,5 MHz"
  6: "Ancho de banda instantáneo: 48 kHz"
  8: "Sensibilidad: mejor de 1 µV"
  9: "Rechazo de imagen: mejor de 40 dB"
  13: "evita las emisoras de onda media, que son las más fuertes y las que más saturan"
  14: "usar la tarjeta de sonido como convertidor"
  15: "El rechazo de 40 dB exige componentes apareados en ambos canales y trazado simétrico"
  16: "si hace falta un amplificador de bajo ruido"
  17: "el ruido del ordenador es el enemigo principal"
  19: "ninguna se resuelve en el software"
  22: "Es el camino razonable para aprender a usar una SDR"
  23: "Es mucho más trabajo y enseña mucho más"
  24: "Este capítulo toma el camino intermedio"
  32: "todo lo que está antes de ella decide cifras que después no se corrigen"
  38: "un receptor de conversión directa de una sola banda"
  39: "No tiene I/Q ni distingue las bandas laterales"
  43: "Una elipse indica desequilibrio"
  47: "ninguna sensibilidad servirá"
  48: "La especificación del receptor y lo que determina cada línea"
  50: "La comprobación del equilibrio I/Q en modo XY"

modelo:
  valores:
    g_q: { sim: "g", nombre: "ganancia relativa del canal Q", unidad: "", valor: 1 }
    e_f: { sim: "φ", nombre: "error de fase respecto a 90°", unidad: "°", valor: 0 }
  calculos:
    d_q: { expr: "90 - e_f", sim: "desfase", nombre: "desfase entre I y Q", unidad: "°" }

tarjetas:
  - id: explore-especificacion
    tipo: explorar
    titulo: "Fijarla con números"
    texto: "La especificación del receptor decide el front-end, el convertidor y buena parte del software. Toque la banda y el ancho de banda."
    libro: [3, 5, 6, 48]
    widget:
      tipo: figura
      figura: fig-52.1
      zonas:
        - { id: banda, rotulo: "Primera fila", rect: [6, 17, 438, 35], texto: "De 3,5 a 7,5 MHz: fija el filtro de entrada y deja fuera la onda media, la que más satura." }
        - { id: ancho, rotulo: "Segunda fila", rect: [6, 52, 438, 35], texto: "48 kHz: lo que da una tarjeta de sonido corriente, que hace de convertidor." }
        - { id: modos, rotulo: "Tercera fila", rect: [6, 87, 438, 35], texto: "AM, SSB y CW, todos por software: cambiar de modo es cambiar de fórmula." }
        - { id: rechazo, rotulo: "Quinta fila", rect: [6, 156, 438, 35], texto: "Más de 40 dB de rechazo de imagen: componentes apareados y trazado simétrico." }
    requiere: { mover: [banda, ancho] }

  - id: pregunta-lna
    tipo: predecir
    titulo: "¿Hace falta un LNA?"
    texto: "¿Qué línea de la especificación decide la figura de ruido del front-end y, con ella, si hace falta un amplificador de bajo ruido?"
    libro: [8, 9, 16]
    widget:
      tipo: figura
      figura: fig-52.1
      zonas:
        - { id: todo, rotulo: "La especificación y lo que determina", rect: [0, 0, 450, 320] }
    opciones:
      - texto: "La sensibilidad: 1 µV para 10 dB de S/R en SSB"
        bien: true
        porque: "Es la señal más débil que hay que oír: de ella sale el ruido que se admite al receptor."
      - texto: "El rechazo de imagen de 40 dB"
        porque: "Ese depende del equilibrio entre I y Q, no del ruido que añade la entrada."
      - texto: "El margen dinámico"
        porque: "El margen pide no saturar; un amplificador de más, de hecho, se lo comería."
    escalera:
      - "¿Qué línea habla de la señal más débil que hay que oír?"
    solucion: "La sensibilidad."

  - id: empareje-cifras
    tipo: pregunta
    titulo: "Lo que cada cifra implica"
    texto: "Empareje cada línea de la especificación con lo que obliga a hacer."
    libro: [13, 14, 15, 17]
    widget:
      tipo: figura
      figura: fig-52.1
      zonas:
        - { id: todo, rotulo: "La especificación y lo que determina", rect: [0, 0, 450, 320] }
    emparejar:
      - ["Banda de 3,5 a 7,5 MHz", "Dejar fuera la onda media"]
      - ["48 kHz instantáneos", "La tarjeta de sonido como convertidor"]
      - ["Rechazo de imagen de 40 dB", "Componentes apareados y trazado simétrico"]
      - ["Alimentación separada", "Esquivar el ruido del ordenador"]
    exito: "Y el apantallamiento, que no es una cifra: señales de microvoltios junto a un ordenador."
    pistas:
      - { texto: "La onda media es la que más satura; los 48 kHz son lo que da una tarjeta de sonido." }
    escalera:
      - "Empiece por la que habla de un componente que ya está en cualquier ordenador."
    solucion: "Banda, sin onda media; 48 kHz, tarjeta de sonido; rechazo, apareados y simétrico; alimentación, contra el ruido del ordenador."

  - id: porque-dificultades
    tipo: porque
    titulo: "Las dificultades reales"
    texto: "Equilibrio I/Q, ruido del ordenador, alimentación limpia y apantallamiento. ¿Por qué son estas las dificultades del proyecto?"
    libro: [19, 32]
    widget:
      tipo: figura
      figura: fig-52.1
      zonas:
        - { id: todo, rotulo: "La especificación y lo que determina", rect: [0, 0, 450, 320] }
    opciones:
      - texto: "Están antes de la tarjeta de sonido, y el software no las resuelve"
        bien: true
        porque: "Lo que hay antes del convertidor decide cifras que después no se corrigen."
      - texto: "Porque son las más caras"
        porque: "No es el coste: son problemas analógicos que ningún programa arregla."
      - texto: "Porque el software aún no está escrito"
        porque: "Aunque lo estuviera: ninguna de las cuatro se resuelve en el software."
    escalera:
      - "¿Dónde está la frontera entre hardware y software en este receptor?"
    solucion: "Son analógicas, antes del convertidor: el software no las arregla."

  - id: pregunta-camino
    tipo: pregunta
    titulo: "El camino del capítulo"
    texto: "Receptor comercial, front-end construido entero o un camino intermedio. ¿Cuál toma el capítulo?"
    libro: [22, 23, 24, 50]
    widget:
      tipo: figura
      figura: fig-48.9
      zonas:
        - { id: todo, rotulo: "Modo XY y los dos caminos", rect: [0, 0, 436, 220] }
    opciones:
      - texto: "Front-end propio con mezclador en cuadratura y la tarjeta de sonido como convertidor"
        bien: true
        porque: "Cubre todo lo especificado con componentes asequibles y enseña la cadena analógica."
      - texto: "Una llave USB comercial y el trabajo en la antena y el software"
        porque: "Es el camino razonable para aprender a usar una SDR, pero menos formativo."
      - texto: "Muestreo directo de la antena"
        porque: "Sería más caro: exige convertidores muy rápidos y de mucho margen dinámico."
    escalera:
      - "El capítulo quiere enseñar la cadena analógica sin pagar convertidores caros."
    solucion: "El intermedio: front-end propio y tarjeta de sonido."

  - id: explore-xy
    tipo: explorar
    titulo: "El círculo I/Q"
    texto: "I y Q en las dos entradas del osciloscopio, en modo XY, con una señal cercana al oscilador local. Desequilibre la ganancia de Q y luego la fase."
    nota: "Ganancias y fases de ejemplo."
    libro: [43, 50]
    widget:
      tipo: grafica
      aspecto: igual
      x: { id: x, min: -1.6, max: 1.6, unidad: "", rotulo: "I, canal X" }
      y: { min: -1.6, max: 1.6, unidad: "", rotulo: "Q, canal Y" }
      curvas:
        # (motor12e) one parametric curve: I = cos θ, Q = g·sen(θ + φ)
        - { param: { id: th, min: 0, max: "2*pi" }, x: "cos(th)", y: "g_q*sin(th + e_f*pi/180)", color: naranja, rotulo: "figura XY" }
      lectura: { valor: d_q, rotulo: "Desfase entre I y Q" }
      datos:
        - { valor: g_q, rotulo: "Ganancia relativa de Q: {{g_q}}" }
      mandos:
        - { valor: g_q, lista: [1, 0.6, 1.4], rotulo: "Ganancia de Q" }
        - { valor: e_f, lista: [0, 40, 90], rotulo: "Error de fase, φ" }
    requiere: { mover: [g_q, e_f] }

  - id: empareje-xy
    tipo: pregunta
    titulo: "Leer la figura XY"
    texto: "Empareje cada figura en modo XY con lo que dice del mezclador en cuadratura."
    libro: [43]
    widget:
      tipo: figura
      figura: fig-48.9
      zonas:
        - { id: todo, rotulo: "Modo XY y los dos caminos", rect: [0, 0, 436, 220] }
    emparejar:
      - ["Un círculo", "Misma ganancia y 90° exactos"]
      - ["Una elipse", "Desequilibrio"]
      - ["Una recta horizontal o vertical", "Un canal no funciona"]
      - ["Una recta inclinada", "Los dos canales están en fase"]
    exito: "Treinta segundos que validan el bloque más delicado antes de escribir una línea de software."
    pistas:
      - { texto: "Si Q es cero todo el rato, el punto solo se mueve en horizontal." }
    escalera:
      - "Si I y Q son la misma señal, Q = I: ¿qué dibuja eso?"
    solucion: "Círculo, equilibrio; elipse, desequilibrio; recta horizontal o vertical, canal muerto; inclinada, en fase."

  - id: pregunta-recta
    tipo: pregunta
    titulo: "Una recta inclinada"
    texto: "Monta el mezclador y en modo XY aparece esto. ¿Qué le pasa?"
    libro: [43]
    fijar: { g_q: 1, e_f: 90 }
    widget:
      tipo: grafica
      aspecto: igual
      x: { id: x, min: -1.6, max: 1.6, unidad: "", rotulo: "I, canal X" }
      y: { min: -1.6, max: 1.6, unidad: "", rotulo: "Q, canal Y" }
      curvas:
        # (motor12e) one parametric curve: I = cos θ, Q = g·sen(θ + φ)
        - { param: { id: th, min: 0, max: "2*pi" }, x: "cos(th)", y: "g_q*sin(th + e_f*pi/180)", color: naranja, rotulo: "figura XY" }
    opciones:
      - texto: "I y Q salen en fase: falta el desfase de 90°"
        bien: true
        porque: "Si Q sigue a I, el punto va y viene por una diagonal: una recta inclinada."
      - texto: "Un canal no funciona"
        porque: "Un canal muerto da una recta horizontal o vertical, no inclinada."
      - texto: "Las ganancias de I y Q son distintas"
        porque: "Eso achata el círculo en una elipse, pero no lo cierra en una recta."
    escalera:
      - "¿Cuándo vale Q lo mismo que I en cada instante?"
    solucion: "Los dos canales están en fase."

  - id: pregunta-minima
    tipo: pregunta
    titulo: "La variante mínima"
    texto: "Un receptor de conversión directa de una sola banda: un mezclador, un amplificador de audio y un filtro. ¿Qué no puede hacer?"
    libro: [38, 39]
    widget:
      tipo: figura
      figura: fig-48.9
      zonas:
        - { id: todo, rotulo: "Modo XY y los dos caminos", rect: [0, 0, 436, 220] }
    opciones:
      - texto: "Distinguir las bandas laterales: no tiene I/Q"
        bien: true
        porque: "Con un solo canal, lo que está por encima y por debajo del oscilador cae en el mismo sitio."
      - texto: "Recibir nada: sin I/Q no hay radio"
        porque: "Recibe, con un cristal y cuatro componentes: para empezar es lo que hace falta."
      - texto: "Recibir AM"
        porque: "Puede recibir; lo que pierde es la separación de las bandas laterales."
    escalera:
      - "¿Qué aporta el segundo canal, Q?"
    solucion: "Distinguir las bandas laterales."

  - id: porque-entorno
    tipo: porque
    titulo: "La comprobación previa"
    texto: "Antes de montar nada, se escucha la banda con cualquier receptor en el sitio donde irá el equipo. ¿Por qué?"
    libro: [47]
    widget:
      tipo: figura
      figura: fig-52.1
      zonas:
        - { id: todo, rotulo: "La especificación y lo que determina", rect: [0, 0, 450, 320] }
    opciones:
      - texto: "Si el ruido de fondo es enorme, ninguna sensibilidad servirá"
        bien: true
        porque: "Fuentes conmutadas, LED y cargadores: el trabajo va al filtrado, la antena y su ubicación."
      - texto: "Para calibrar el oscilador local"
        porque: "Eso se hace con un frecuencímetro; la escucha previa mide el ruido del sitio."
      - texto: "Para elegir la tarjeta de sonido"
        porque: "La tarjeta no arregla un entorno ruidoso: el ruido llega por la antena."
    escalera:
      - "¿De qué sirve oír 1 µV si el ruido del sitio es mucho mayor?"
    solucion: "Decide si el entorno permite el proyecto."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [3, 19, 24, 43]
    ideas:
      - { titulo: "Especificar primero.", texto: "Banda, 48 kHz, modos, sensibilidad y rechazo de imagen deciden el diseño." }
      - { titulo: "Lo analógico manda.", texto: "Equilibrio I/Q, ruido, alimentación y blindaje: ninguno se arregla en software." }
      - { titulo: "El camino intermedio.", texto: "Front-end propio y la tarjeta de sonido como convertidor." }
      - { titulo: "El círculo XY.", texto: "Valida el equilibrio de I y Q antes de programar." }
