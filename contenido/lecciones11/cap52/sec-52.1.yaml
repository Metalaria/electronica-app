# Lección 1.2 de la sección 53.1 «Objetivo y Especificaciones» (cap52, sec-52.1). Formato: GUIA.md.
# - La especificación y lo que determina cada línea, sobre la figura 53.1.
# - El círculo I/Q en modo XY del criterio de aceptación (bloque 43, figura 53.3): I = cos θ y Q = g·sen(θ + φ), con g
#   la ganancia relativa de Q y φ el error de fase respecto a 90°. Sin curvas paramétricas, la figura se dibuja como dos
#   ramas: Q = g·(x·sen φ ± cos φ·√(1 − x²)). g = 1 y φ = 0, círculo; g ≠ 1, elipse; g = 0, recta horizontal (un canal
#   muerto); φ = 90°, recta inclinada (los dos en fase). Los valores de g y φ son de ejemplo (el de 40° es el de la
#   figura).
# Sin paso práctico nuevo: la figura 53.1 ya escribe la respuesta de cada línea; el lector explora el círculo XY.
# 1.2.1 (autor121-senpro, «aprender haciendo», GUIA §13): en la figura 53.1 se tocan la línea que decide el LNA, la que
# pide componentes apareados y la única que resuelve el software; se busca en modo XY la recta de los canales en fase;
# los 40 dB de rechazo en amplitud y la banda de un solo canal a 48 kHz se calculan («simular»). El emparejar de cifras
# se reparte en las explicaciones, el camino del capítulo y la recta inclinada se funden en éxitos. Queda una pregunta
# de opciones (la escucha previa) y el emparejar de la figura XY.
leccion: cap52/sec-52.1

libro:
  3: "conviene fijarla con números antes de elegir nada"
  5: "Banda: 3,5 a 7,5 MHz"
  6: "Ancho de banda instantáneo: 48 kHz"
  8: "Sensibilidad: mejor de 1 µV"
  9: "Rechazo de imagen: mejor de 40 dB"
  13: "evita las emisoras de onda media, que son las más fuertes y las que más saturan"
  14: "usar la tarjeta de sonido como convertidor"
  15: "El rechazo de 40 dB exige componentes apareados en ambos canales y trazado simétrico"
  16: "si hace falta un amplificador de bajo ruido"
  17: "el ruido del ordenador es el enemigo principal"
  19: "ninguna se resuelve en el software"
  22: "Es el camino razonable para aprender a usar una SDR"
  23: "Es mucho más trabajo y enseña mucho más"
  24: "Este capítulo toma el camino intermedio"
  32: "todo lo que está antes de ella decide cifras que después no se corrigen"
  38: "un receptor de conversión directa de una sola banda"
  39: "No tiene I/Q ni distingue las bandas laterales"
  43: "Una elipse indica desequilibrio"
  47: "ninguna sensibilidad servirá"
  48: "La especificación del receptor y lo que determina cada línea"
  50: "La comprobación del equilibrio I/Q en modo XY"

modelo:
  valores:
    g_q: { sim: "g", nombre: "ganancia relativa del canal Q", unidad: "", valor: 1 }
    e_f: { sim: "φ", nombre: "error de fase respecto a 90°", unidad: "°", valor: 0 }
    r_db: { sim: "IRR", nombre: "rechazo de imagen", unidad: dB, valor: 40 }
    f_s: { sim: "f_{s}", nombre: "muestreo de la tarjeta", unidad: Hz, valor: 48000 }
  calculos:
    d_q: { expr: "90 - e_f", sim: "desfase", nombre: "desfase entre I y Q", unidad: "°" }
    a_r: { expr: "10^(r_db/20)", sim: "A", nombre: "rechazo en amplitud", unidad: "" }
    p_r: { expr: "10^(r_db/10)", sim: "P", nombre: "rechazo en potencia", unidad: "" }
    b_1: { expr: "f_s/2", sim: "BW", nombre: "banda de un solo canal", unidad: Hz }

tarjetas:
  - id: explore-especificacion
    tipo: tocar
    titulo: "Fijarla con números"
    texto: "La especificación decide el front-end, el convertidor y buena parte del software. Toque la línea que dice si hace falta un amplificador de bajo ruido."
    libro: [3, 5, 6, 8, 13, 16, 48]
    widget:
      tipo: figura
      figura: fig-52.1
      zonas: &zonas-espec
        - { id: banda, rotulo: "Primera fila", rect: [6, 17, 438, 35] }
        - { id: ancho, rotulo: "Segunda fila", rect: [6, 52, 438, 35] }
        - { id: modos, rotulo: "Tercera fila", rect: [6, 87, 438, 35] }
        - { id: sensibilidad, rotulo: "Cuarta fila", rect: [6, 121, 438, 35] }
        - { id: rechazo, rotulo: "Quinta fila", rect: [6, 156, 438, 35] }
    tocar:
      bien: [sensibilidad]
      porque:
        banda: "La banda, de 3,5 a 7,5 MHz, fija el filtro de entrada y deja fuera la onda media, la que más satura."
        ancho: "Los 48 kHz deciden el convertidor, no el ruido."
        modos: "Los modos se resuelven por software."
        rechazo: "El rechazo depende del equilibrio entre I y Q, no del ruido de la entrada."
    exito: "La sensibilidad, mejor de 1 µV: la señal más débil que hay que oír fija el ruido que se admite."
    escalera:
      - "¿Qué línea habla de la señal más débil?"
    solucion: "La cuarta fila, la sensibilidad."

  - id: pregunta-lna
    tipo: tocar
    titulo: "Componentes apareados"
    texto: "Una línea de la especificación obliga a aparear componentes en los dos canales y a trazar simétrico. Tóquela."
    libro: [9, 15]
    widget:
      tipo: figura
      figura: fig-52.1
      zonas: *zonas-espec
    tocar:
      bien: [rechazo]
      porque:
        banda: "La banda pide un filtro de entrada."
        ancho: "El ancho de banda pide la tarjeta de sonido."
        modos: "Los modos son software."
        sensibilidad: "La sensibilidad pide poco ruido, no simetría."
    exito: "Más de 40 dB de rechazo de imagen: los dos canales deben ser casi idénticos."
    escalera:
      - "¿Qué cifra depende de que I y Q sean iguales?"
    solucion: "La quinta fila, el rechazo de imagen."

  - id: porque-dificultades
    tipo: tocar
    titulo: "Las dificultades reales"
    texto: "Casi todo lo difícil del proyecto está antes de la tarjeta de sonido y no se resuelve en el software. Toque la única línea que sí se resuelve en él."
    libro: [17, 19, 32]
    widget:
      tipo: figura
      figura: fig-52.1
      zonas: *zonas-espec
    tocar:
      bien: [modos]
      porque:
        banda: "El filtro de entrada es analógico."
        ancho: "Lo fija el convertidor."
        sensibilidad: "El ruido de la entrada no se corrige después."
        rechazo: "El equilibrio I/Q es analógico."
    exito: "AM, SSB y CW: cambiar de modo es cambiar de fórmula. Equilibrio I/Q, ruido del ordenador, alimentación y blindaje no tienen arreglo en software."
    escalera:
      - "¿Qué línea es solo matemática?"
    solucion: "La tercera fila, los modos."

  - id: explore-xy
    tipo: explorar
    titulo: "El círculo I/Q"
    texto: "I y Q en las dos entradas del osciloscopio, en modo XY, con una señal cercana al oscilador local. Busque la figura de dos canales en fase."
    nota: "Ganancias y fases de ejemplo."
    libro: [43, 50]
    widget:
      tipo: grafica
      aspecto: igual
      x: { id: x, min: -1.6, max: 1.6, unidad: "", rotulo: "I, canal X" }
      y: { min: -1.6, max: 1.6, unidad: "", rotulo: "Q, canal Y" }
      curvas:
        # (motor12e) one parametric curve: I = cos θ, Q = g·sen(θ + φ)
        - { param: { id: th, min: 0, max: "2*pi" }, x: "cos(th)", y: "g_q*sin(th + e_f*pi/180)", color: naranja, rotulo: "figura XY" }
      lectura: { valor: d_q, rotulo: "Desfase entre I y Q" }
      datos:
        - { valor: g_q, rotulo: "Ganancia relativa de Q: {{g_q}}" }
      mandos:
        - { valor: g_q, lista: [1, 0.6, 1.4], rotulo: "Ganancia de Q" }
        - { valor: e_f, lista: [0, 40, 90], rotulo: "Error de fase, φ" }
    inicio: { g_q: 1, e_f: 0 }
    objetivo:
      condiciones:
        - { valor: d_q, max: 1, rotulo: "Desfase: {{d_q}}" }
      logrado: "Una recta inclinada: Q sigue a I y falta el desfase de 90°. Con 90° exactos y la misma ganancia, un círculo."
      pistas:
        - { texto: "Aún hay desfase entre I y Q: aumente el error de fase." }
    escalera:
      - "Los canales en fase no tienen desfase entre sí."
    solucion: "Error de fase de 90°: recta inclinada."
    comprobar:
      - { con: { e_f: 90 }, d_q: 0 }

  - id: empareje-xy
    tipo: pregunta
    titulo: "Leer la figura XY"
    texto: "Empareje cada figura en modo XY con lo que dice del mezclador en cuadratura."
    libro: [43]
    widget:
      tipo: figura
      figura: fig-48.9
      zonas:
        - { id: todo, rotulo: "Modo XY y los dos caminos", rect: [0, 0, 436, 220] }
    emparejar:
      - ["Un círculo", "Misma ganancia y 90° exactos"]
      - ["Una elipse", "Desequilibrio"]
      - ["Una recta horizontal o vertical", "Un canal no funciona"]
      - ["Una recta inclinada", "Los dos canales están en fase"]
    exito: "Treinta segundos que validan el bloque más delicado antes de escribir una línea de software."
    pistas:
      - { texto: "Si Q es cero todo el rato, el punto solo se mueve en horizontal." }
    escalera:
      - "Si I y Q son la misma señal, Q = I: ¿qué dibuja eso?"
    solucion: "Círculo, equilibrio; elipse, desequilibrio; recta horizontal o vertical, canal muerto; inclinada, en fase."

  - id: pregunta-recta
    tipo: simular
    titulo: "40 dB de rechazo"
    texto: "La especificación pide más de 40 dB de rechazo de imagen. ¿Cuántas veces más débil queda la imagen, en amplitud?"
    libro: [9]
    fijar: { r_db: 40 }
    simular:
      objetivo: a_r
      unidad: ""
      tol: 0.02
      rotulo: "Veces, en amplitud"
      errores:
        - { expr: "p_r", texto: "Eso es en potencia; la amplitud va con su raíz." }
    exito: "Cien veces: por eso un desequilibrio pequeño entre I y Q ya se come el rechazo."
    escalera:
      - "En amplitud, cada veinte decibelios son un factor diez."
    solucion: "10² = 100."
    comprobar:
      - { a_r: 100, p_r: 10000 }

  - id: pregunta-minima
    tipo: simular
    titulo: "La variante mínima"
    texto: "Un receptor de conversión directa de una sola banda no tiene I/Q. Con un solo canal, una tarjeta que muestrea a 48 kHz, ¿qué banda ve?"
    libro: [6, 14, 38, 39]
    fijar: { f_s: 48000 }
    simular:
      objetivo: b_1
      unidad: Hz
      tol: 0.02
      rotulo: "Banda con un canal"
      errores:
        - { expr: "f_s", texto: "Eso es con I y Q, que distinguen los dos lados del oscilador." }
    exito: "24 kHz, y sin distinguir las bandas laterales. Con I y Q, los 48 kHz instantáneos de la especificación."
    escalera:
      - "Con un solo canal, hasta la mitad del muestreo."
    solucion: "La mitad de 48 kHz: 24 kHz."
    comprobar:
      - { b_1: 24000 }

  - id: porque-entorno
    tipo: porque
    titulo: "La comprobación previa"
    texto: "Antes de montar nada, se escucha la banda con cualquier receptor en el sitio donde irá el equipo. ¿Por qué?"
    libro: [47]
    widget:
      tipo: figura
      figura: fig-52.1
      zonas:
        - { id: todo, rotulo: "La especificación y lo que determina", rect: [0, 0, 450, 320] }
    opciones:
      - texto: "Si el ruido de fondo es enorme, ninguna sensibilidad servirá"
        bien: true
        porque: "Fuentes conmutadas, LED y cargadores: el trabajo va al filtrado, la antena y su ubicación."
      - texto: "Para calibrar el oscilador local"
        porque: "Eso se hace con un frecuencímetro; la escucha previa mide el ruido del sitio."
      - texto: "Para elegir la tarjeta de sonido"
        porque: "La tarjeta no arregla un entorno ruidoso: el ruido llega por la antena."
    escalera:
      - "¿De qué sirve oír 1 µV si el ruido del sitio es mucho mayor?"
    solucion: "Decide si el entorno permite el proyecto."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [3, 19, 22, 23, 24, 43]
    ideas:
      - { titulo: "Especificar primero.", texto: "Banda, 48 kHz, modos, sensibilidad y rechazo de imagen deciden el diseño." }
      - { titulo: "Lo analógico manda.", texto: "Equilibrio I/Q, ruido, alimentación y blindaje: ninguno se arregla en software." }
      - { titulo: "El camino intermedio.", texto: "Front-end propio y la tarjeta de sonido como convertidor." }
      - { titulo: "El círculo XY.", texto: "Valida el equilibrio de I y Q antes de programar." }
