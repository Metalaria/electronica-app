# Lección 1.2 de la sección 53.8 «Del FM7303 a la SDR: el Círculo se Cierra» (cap52, sec-52.7). Formato: GUIA.md.
# Sección de criterios: la tabla del bloque 250 (figura 53.16), lo que sigue siendo analógico y la lección de fondo.
# Sin paso práctico nuevo: es una comparación; el banco del libro (escuchar la misma emisora con los dos) va como
# predicción.
# 1.2.1 (autor121-senpro, «aprender haciendo», GUIA §13): en la tabla 53.16 se tocan la columna en la que la selectividad
# es un filtro cerámico y la que cambia de modo con un ajuste (los emparejar de cada receptor y la lectura de la tabla
# van a sus éxitos); Friis con el LNA de 15 dB y 2 dB del bloque 414 de la 37 se calcula, se busca la ganancia que deja
# la cadena a menos de un decibelio del LNA y se calcula lo que gana el receptor dedicado. La lección de fondo se funde
# en la de lo que cambió el software. Queda esa pregunta de opciones y lo analógico, por emparejar.
leccion: cap52/sec-52.7

libro:
  248: "comparar ambos es la mejor forma de entender qué ha cambiado y qué no"
  250: "Filtro cerámico de FI"
  251: "la estructura es idéntica"
  254: "La antena (sección"
  255: "evita que señales fuertes fuera de banda saturen"
  256: "cuya figura de ruido fija la del sistema"
  257: "con su jitter y su margen dinámico"
  258: "todo lo que determina la sensibilidad y el margen dinámico sigue siendo analógico"
  259: "la primera etapa fija el ruido de todo lo que viene detrás"
  261: "mucho más abrupta y ajustable"
  262: "un mismo hardware sirve para AM, FM, SSB y modos digitales"
  263: "es software, no hardware"
  264: "la pantalla de espectro es un instrumento que un receptor analógico no tiene"
  267: "Lo digital no sustituye a lo analógico: lo complementa"
  268: "quien solo sabe procesar señales no puede diseñar una radio"
  271: "La SDR muestra el espectro, permite cambiar de modo y necesita un ordenador"
  272: "un receptor dedicado con buen front-end puede ser más sensible que una SDR económica"
  273: "la misma radio, de los chips al software"
  274: "Comparación bloque a bloque entre el receptor de kit y la SDR"
  "cap36#413": 'F_("total") = F_("1") + (F_("2") - "1")/(G_("1"))'
  "cap36#414": "Con un LNA de 15 dB de ganancia y 2 dB de figura, una segunda etapa de 10 dB de figura solo sube el total de 2 a 2,7 dB"

modelo:
  valores:
    G_1: { sim: "G₁", nombre: "ganancia del LNA", unidad: dB, valor: 15 }
    N_1: { sim: "NF₁", nombre: "figura de ruido del LNA", unidad: dB, valor: 2 }
    N_2: { sim: "NF₂", nombre: "figura de ruido de la segunda etapa", unidad: dB, valor: 10 }
  calculos:
    F_t: { expr: "10*log10(10^(N_1/10) + (10^(N_2/10) - 1)/10^(G_1/10))", sim: "NF", nombre: "figura de ruido de la cadena", unidad: dB }
    F_x: { expr: "10*log10(10^(N_1/10) + 10^(N_2/10) - 1)", sim: "NF", nombre: "sin dividir por G₁", unidad: dB }
    d_s: { expr: "N_2 - F_t", sim: "Δ", nombre: "lo que gana el receptor con LNA", unidad: dB }
    d_x: { expr: "N_2 - N_1", sim: "Δ", nombre: "contando solo el LNA", unidad: dB }

tarjetas:
  - id: explore-comparacion
    tipo: tocar
    titulo: "La misma radio"
    texto: "El receptor de kit y la SDR, bloque a bloque: la estructura es idéntica. Toque la columna en la que cambiar de modo es solo un ajuste."
    libro: [248, 250, 251, 274]
    widget:
      tipo: figura
      figura: fig-52.13
      zonas: &zonas-tabla
        - { id: funcion, rotulo: "Columna de la izquierda", rect: [0, 15, 108, 88] }
        - { id: kit, rotulo: "Columna del centro", rect: [110, 15, 158, 88] }
        - { id: sdr, rotulo: "Columna de la derecha", rect: [270, 15, 180, 88] }
    tocar:
      bien: [sdr]
      porque:
        funcion: "Son las funciones, iguales en los dos."
        kit: "En el FM7303 cambiar de modo es imposible."
    exito: "La SDR: filtro de entrada ancho, FIR digital, aritmética y un ajuste. Cambia dónde se ejecuta cada función, no la estructura."
    escalera:
      - "¿Cuál de los dos es software?"
    solucion: "La columna de la derecha, la SDR."

  - id: empareje-kit
    tipo: tocar
    titulo: "En el FM7303"
    texto: "Toque la columna en la que la selectividad la da un filtro cerámico de FI."
    libro: [250, 273]
    widget:
      tipo: figura
      figura: fig-52.13
      zonas: *zonas-tabla
    tocar:
      bien: [kit]
      porque:
        funcion: "Son las funciones, iguales en los dos."
        sdr: "En la SDR la selectividad es un FIR digital."
    exito: "El FM7303: tanque LC, mezclador y oscilador analógico, filtro cerámico de FI y discriminador."
    escalera:
      - "¿Cuál de los dos es el receptor de kit?"
    solucion: "La columna del centro, el FM7303."

  - id: pregunta-estructura
    tipo: simular
    titulo: "La primera etapa manda"
    texto: "Un LNA de 15 dB de ganancia y 2 dB de figura delante de una etapa de 10 dB de figura. ¿Qué figura de ruido tiene la cadena?"
    libro: [259, "cap36#413", "cap36#414"]
    fijar: { G_1: 15, N_1: 2, N_2: 10 }
    simular:
      objetivo: F_t
      unidad: dB
      tol: 0.02
      rotulo: "Figura de ruido de la cadena"
      errores:
        - { expr: "F_x", texto: "Falta dividir el ruido de la segunda etapa por la ganancia del LNA." }
        - { expr: "N_1", texto: "Esa es la del LNA solo; la segunda etapa sube algo el total." }
    exito: "2,7 dB: con G₁ alta, lo que viene después casi no importa. Por eso procesar más no arregla un front-end mediocre."
    escalera:
      - "F = F₁ + (F₂ − 1)/G₁, en veces, no en dB."
    solucion: "Los 2 dB del LNA más la segunda etapa dividida por G₁: 2,7 dB."
    comprobar:
      - { F_t: 2.72, F_x: 10.25 }

  - id: predecir-front-end
    tipo: explorar
    titulo: "Procesar más no basta"
    texto: "Una SDR con una etapa de 10 dB de figura, y delante un LNA de 2 dB. Suba su ganancia hasta que la cadena quede a menos de un decibelio del LNA."
    libro: [258, 259, "cap36#413", "cap36#414"]
    fijar: { N_1: 2, N_2: 10 }
    inicio: { G_1: 0 }
    widget:
      tipo: grafica
      x: { id: g, min: 0, max: 20, unidad: dB, rotulo: "G₁" }
      y: { min: 0, max: 12, unidad: dB, rotulo: "NF" }
      curvas:
        - { expr: "10*log10(10^(N_1/10) + (10^(N_2/10) - 1)/10^(g/10))", color: naranja, rotulo: "figura de la cadena" }
        - { expr: "N_1", color: tinta, rotulo: "la del LNA", discontinua: true }
      marcas:
        - { x: "G_1", y: "F_t", rotulo: "{{F_t}}" }
      lectura: { valor: F_t, rotulo: "Figura de ruido de la cadena" }
      mandos:
        - { valor: G_1, min: 0, max: 20, paso: 1, rotulo: "Ganancia del LNA" }
    objetivo:
      condiciones:
        - { valor: F_t, max: 3, rotulo: "NF = {{F_t}}" }
      logrado: "Con {{G_1}}, {{F_t}}: la primera etapa fija el ruido de todo lo que viene detrás."
      pistas:
        - { texto: "Aún pesa la segunda etapa: más ganancia en el LNA." }
    escalera:
      - "La segunda etapa se divide por G₁."
    solucion: "Unos 14 dB o más."
    comprobar:
      - { con: { G_1: 14 }, F_t: 2.885 }
      - { con: { G_1: 0 }, F_t: 10.25 }

  - id: empareje-analogico
    tipo: pregunta
    titulo: "Lo que sigue siendo analógico"
    texto: "Empareje cada bloque que seguirá siendo analógico con lo que decide."
    libro: [254, 255, 256, 257]
    widget:
      tipo: figura
      figura: fig-52.13
      zonas:
        - { id: todo, rotulo: "Comparación bloque a bloque", rect: [0, 0, 453, 201] }
    emparejar:
      - ["Filtro de entrada", "Que las fuertes fuera de banda no saturen"]
      - ["Amplificador de bajo ruido", "La figura de ruido del sistema"]
      - ["Convertidor", "El jitter y el margen dinámico"]
    exito: "Todo lo que determina la sensibilidad y el margen dinámico, más la antena."
    pistas:
      - { texto: "La figura de ruido la fija la primera etapa activa." }
    escalera:
      - "¿Cuál de ellos está antes de todo lo demás?"
    solucion: "Filtro, la saturación; LNA, el ruido; convertidor, jitter y margen."

  - id: pregunta-software
    tipo: pregunta
    titulo: "Lo que el software sí ha cambiado"
    texto: "¿Cuál de estas cosas ha cambiado de verdad gracias al software?"
    libro: [261, 262, 263, 264, 267, 268]
    widget:
      tipo: figura
      figura: fig-52.12
      zonas:
        - { id: todo, rotulo: "Del FM7303 a la SDR", rect: [0, 0, 453, 273] }
    opciones:
      - texto: "La flexibilidad: un hardware para AM, FM, SSB y modos digitales"
        bien: true
        porque: "Y la selectividad, los decodificadores y la pantalla de espectro. Pero quien solo sabe procesar señales no puede diseñar una radio."
      - texto: "La sensibilidad"
        porque: "Esa sigue siendo del front-end analógico."
      - texto: "La necesidad de antena"
        porque: "La antena sigue siendo analógica, y es lo que más cambia el resultado."
    escalera:
      - "Descarte lo que está antes del convertidor."
    solucion: "La flexibilidad, entre otras: no la sensibilidad."

  - id: predecir-banco
    tipo: simular
    titulo: "La misma emisora con los dos"
    texto: "Una SDR económica sin LNA, con 10 dB de figura, frente a un receptor dedicado con el LNA de 15 dB y 2 dB delante. ¿Cuántos dB más sensible es el dedicado?"
    libro: [271, 272, "cap36#414"]
    fijar: { G_1: 15, N_1: 2, N_2: 10 }
    simular:
      objetivo: d_s
      unidad: dB
      tol: 0.03
      rotulo: "Ventaja del dedicado"
      errores:
        - { expr: "d_x", texto: "La cadena del dedicado no se queda en 2 dB: su segunda etapa suma algo." }
    exito: "Unos 7,3 dB: un receptor con buen front-end puede ser más sensible que una SDR económica."
    escalera:
      - "10 dB menos la figura de la cadena con LNA."
    solucion: "10 − 2,7 = 7,3 dB."
    comprobar:
      - { d_s: 7.28, d_x: 8 }

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [251, 258, 262, 267]
    ideas:
      - { titulo: "La misma estructura.", texto: "Front-end, traslación, selectividad y demodulación, en los dos." }
      - { titulo: "Lo analógico.", texto: "Antena, filtro, LNA y convertidor: sensibilidad y margen dinámico." }
      - { titulo: "Lo que cambió.", texto: "Selectividad, flexibilidad, decodificadores y la pantalla." }
      - { titulo: "La lección.", texto: "Lo digital complementa a lo analógico." }
