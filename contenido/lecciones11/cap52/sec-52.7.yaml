# Lección 1.2 de la sección 53.8 «Del FM7303 a la SDR: el Círculo se Cierra» (cap52, sec-52.7). Formato: GUIA.md.
# Sección de criterios: la tabla del bloque 250 (figura 53.16), lo que sigue siendo analógico y la lección de fondo.
# Sin paso práctico nuevo: es una comparación; el banco del libro (escuchar la misma emisora con los dos) va como
# predicción.
leccion: cap52/sec-52.7

libro:
  248: "comparar ambos es la mejor forma de entender qué ha cambiado y qué no"
  250: "Filtro cerámico de FI"
  251: "la estructura es idéntica"
  254: "La antena (sección"
  255: "evita que señales fuertes fuera de banda saturen"
  256: "cuya figura de ruido fija la del sistema"
  257: "con su jitter y su margen dinámico"
  258: "todo lo que determina la sensibilidad y el margen dinámico sigue siendo analógico"
  259: "la primera etapa fija el ruido de todo lo que viene detrás"
  261: "mucho más abrupta y ajustable"
  262: "un mismo hardware sirve para AM, FM, SSB y modos digitales"
  263: "es software, no hardware"
  264: "la pantalla de espectro es un instrumento que un receptor analógico no tiene"
  267: "Lo digital no sustituye a lo analógico: lo complementa"
  268: "quien solo sabe procesar señales no puede diseñar una radio"
  271: "La SDR muestra el espectro, permite cambiar de modo y necesita un ordenador"
  272: "un receptor dedicado con buen front-end puede ser más sensible que una SDR económica"
  273: "la misma radio, de los chips al software"
  274: "Comparación bloque a bloque entre el receptor de kit y la SDR"

modelo:
  valores: {}
  calculos: {}

tarjetas:
  - id: explore-comparacion
    tipo: explorar
    titulo: "La misma radio"
    texto: "El receptor de kit y la SDR, bloque a bloque. Toque la tabla y el recuadro de abajo."
    libro: [248, 274]
    widget:
      tipo: figura
      figura: fig-52.13
      zonas:
        - { id: tabla, rotulo: "La tabla de arriba", rect: [0, 8, 453, 92], texto: "Las mismas funciones en los dos: lo que cambia es dónde se ejecuta cada una." }
        - { id: analogico, rotulo: "El recuadro de abajo", rect: [4, 125, 446, 74], texto: "Antena, filtro de entrada, LNA y convertidor: lo que sigue siendo analógico, y siempre lo será." }
    requiere: { mover: [tabla, analogico] }

  - id: empareje-kit
    tipo: pregunta
    titulo: "En el FM7303"
    texto: "Empareje cada función del receptor con el bloque que la hace en el FM7303."
    libro: [250, 273]
    widget:
      tipo: figura
      figura: fig-52.12
      zonas:
        - { id: todo, rotulo: "Del FM7303 a la SDR", rect: [0, 0, 453, 273] }
    emparejar:
      - ["Selección de banda", "Tanque LC sintonizado"]
      - ["Traslación", "Mezclador y oscilador local analógico"]
      - ["Selectividad", "Filtro cerámico de FI"]
      - ["Demodulación", "Discriminador"]
    exito: "Y cambiar de modo, en el FM7303, es imposible."
    pistas:
      - { texto: "La FI se filtra con un filtro cerámico; la FM se demodula con un discriminador." }
    escalera:
      - "Empiece por la demodulación de FM."
    solucion: "Banda, tanque LC; traslación, mezclador y OL; selectividad, cerámico de FI; demodulación, discriminador."

  - id: empareje-sdr
    tipo: pregunta
    titulo: "En la SDR"
    texto: "Empareje cada función con lo que la hace en la SDR."
    libro: [250]
    widget:
      tipo: figura
      figura: fig-52.12
      zonas:
        - { id: todo, rotulo: "Del FM7303 a la SDR", rect: [0, 0, 453, 273] }
    emparejar:
      - ["Selección de banda", "Filtro de entrada, ancho"]
      - ["Selectividad", "Filtro FIR digital"]
      - ["Demodulación", "Aritmética"]
      - ["Cambio de modo", "Un ajuste"]
    exito: "Selectividad, demodulación y modo pasan a ser cálculo."
    pistas:
      - { texto: "El filtro de entrada es ancho porque la selectividad se hace después, en digital." }
    escalera:
      - "¿Qué cuesta cambiar de modo en un programa?"
    solucion: "Banda, filtro ancho; selectividad, FIR; demodulación, aritmética; modo, un ajuste."

  - id: pregunta-estructura
    tipo: pregunta
    titulo: "La lectura de la tabla"
    texto: "Front-end, traslación, selectividad, demodulación. ¿Qué cambia de verdad entre el FM7303 y la SDR?"
    libro: [251]
    widget:
      tipo: figura
      figura: fig-52.13
      zonas:
        - { id: todo, rotulo: "Comparación bloque a bloque", rect: [0, 0, 453, 201] }
    opciones:
      - texto: "Dónde se ejecuta cada función: la estructura es idéntica"
        bien: true
        porque: "Las mismas funciones, en el mismo orden; en la SDR varias son cálculo."
      - texto: "La estructura: la SDR no tiene traslación"
        porque: "La tiene: un mezclador o un cálculo, pero traslada igual."
      - texto: "Nada: son el mismo receptor"
        porque: "Cambia dónde se hace cada cosa, y con ello la flexibilidad."
    escalera:
      - "Compare las filas, no los componentes."
    solucion: "Dónde se ejecuta cada función."

  - id: predecir-front-end
    tipo: predecir
    titulo: "Procesar más"
    texto: "Una SDR con un front-end mediocre. ¿Mejora su sensibilidad con un procesado digital mucho más elaborado?"
    libro: [258, 259]
    widget:
      tipo: figura
      figura: fig-52.13
      zonas:
        - { id: todo, rotulo: "Comparación bloque a bloque", rect: [0, 0, 453, 201] }
    opciones:
      - texto: "No: la primera etapa fija el ruido de todo lo que viene detrás"
        bien: true
        porque: "Es Friis aplicado a la radio: el software no recupera lo que el front-end perdió."
      - texto: "Sí: el procesado digital no tiene límite"
        porque: "No puede oír por debajo del suelo de ruido que dejó el front-end."
      - texto: "Sí, si el convertidor tiene más bits"
        porque: "Los bits suben el margen dinámico del convertidor; el ruido de la primera etapa sigue ahí."
    escalera:
      - "¿Qué etapa fija la figura de ruido del sistema?"
    solucion: "No: manda la primera etapa."

  - id: empareje-analogico
    tipo: pregunta
    titulo: "Lo que sigue siendo analógico"
    texto: "Empareje cada bloque que seguirá siendo analógico con lo que decide."
    libro: [254, 255, 256, 257]
    widget:
      tipo: figura
      figura: fig-52.13
      zonas:
        - { id: todo, rotulo: "Comparación bloque a bloque", rect: [0, 0, 453, 201] }
    emparejar:
      - ["Filtro de entrada", "Que las fuertes fuera de banda no saturen"]
      - ["Amplificador de bajo ruido", "La figura de ruido del sistema"]
      - ["Convertidor", "El jitter y el margen dinámico"]
    exito: "Todo lo que determina la sensibilidad y el margen dinámico, más la antena."
    pistas:
      - { texto: "La figura de ruido la fija la primera etapa activa." }
    escalera:
      - "¿Cuál de ellos está antes de todo lo demás?"
    solucion: "Filtro, la saturación; LNA, el ruido; convertidor, jitter y margen."

  - id: pregunta-software
    tipo: pregunta
    titulo: "Lo que el software sí ha cambiado"
    texto: "¿Cuál de estas cosas ha cambiado de verdad gracias al software?"
    libro: [261, 262, 263, 264]
    widget:
      tipo: figura
      figura: fig-52.12
      zonas:
        - { id: todo, rotulo: "Del FM7303 a la SDR", rect: [0, 0, 453, 273] }
    opciones:
      - texto: "La flexibilidad: un hardware para AM, FM, SSB y modos digitales"
        bien: true
        porque: "Y la selectividad, el coste de los decodificadores y la pantalla de espectro como instrumento."
      - texto: "La sensibilidad"
        porque: "Esa sigue siendo del front-end analógico."
      - texto: "La necesidad de antena"
        porque: "La antena sigue siendo analógica, y es lo que más cambia el resultado."
    escalera:
      - "Descarte lo que está antes del convertidor."
    solucion: "La flexibilidad, entre otras: no la sensibilidad."

  - id: predecir-banco
    tipo: predecir
    titulo: "La misma emisora con los dos"
    texto: "Mide la sensibilidad del FM7303 y la de una SDR económica en la misma banda. ¿Qué suele salir?"
    libro: [271, 272]
    widget:
      tipo: figura
      figura: fig-52.12
      zonas:
        - { id: todo, rotulo: "Del FM7303 a la SDR", rect: [0, 0, 453, 273] }
    opciones:
      - texto: "El receptor dedicado puede ser más sensible"
        bien: true
        porque: "Su cadena analógica está optimizada para esa banda; la SDR económica, no."
      - texto: "La SDR siempre es más sensible"
        porque: "La sensibilidad la fija el front-end, y el de una SDR económica es modesto."
      - texto: "Las dos iguales: la sensibilidad no depende del receptor"
        porque: "Depende de la primera etapa de cada uno."
    escalera:
      - "¿Para qué banda está optimizada cada cadena analógica?"
    solucion: "El dedicado puede ganar."

  - id: porque-fondo
    tipo: porque
    titulo: "La lección de fondo"
    texto: "¿Por qué quien solo sabe procesar señales no puede diseñar una radio?"
    libro: [267, 268]
    widget:
      tipo: figura
      figura: fig-52.12
      zonas:
        - { id: todo, rotulo: "Del FM7303 a la SDR", rect: [0, 0, 453, 273] }
    opciones:
      - texto: "Los límites los ponen la antena, el ruido, la linealidad y el convertidor: problemas analógicos"
        bien: true
        porque: "Lo digital complementa a lo analógico; la frontera se mueve sin desaparecer."
      - texto: "Porque el software de radio es propietario"
        porque: "No es cuestión de licencias: es dónde están los límites físicos."
      - texto: "Porque las radios siguen siendo analógicas enteras"
        porque: "No: cada vez se convierte antes, pero el front-end sigue ahí."
    escalera:
      - "¿Qué no puede recuperar el software?"
    solucion: "Porque los límites son analógicos."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [251, 258, 262, 267]
    ideas:
      - { titulo: "La misma estructura.", texto: "Front-end, traslación, selectividad y demodulación, en los dos." }
      - { titulo: "Lo analógico.", texto: "Antena, filtro, LNA y convertidor: sensibilidad y margen dinámico." }
      - { titulo: "Lo que cambió.", texto: "Selectividad, flexibilidad, decodificadores y la pantalla." }
      - { titulo: "La lección.", texto: "Lo digital complementa a lo analógico." }
