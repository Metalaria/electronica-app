# Lección 1.2 de la sección 53.9 «Cómo Montarla de Verdad» (cap52, sec-52.8). Formato: GUIA.md.
# - El atenuador de entrada de la figura 53.17, con las rectas de la figura referidas a la antena: la señal deseada en
#   −60 dBm, la intermodulación en −45 − 2·A dBm (baja 2 dB por dB atenuado) y el ruido propio en −95 + A dBm (sube 1 dB
#   por dB). El margen útil es la señal menos lo peor de los dos: −60 − max(−45 − 2A, −95 + A); máximo en
#   A = 50/3 ≈ 17 dB, el óptimo de la figura. Las rectas son las de la figura (el texto no da los números).
# Paso práctico: «ajuste» del atenuador hasta el óptimo (atenuar mejora, bloque 296).
leccion: cap52/sec-52.8

libro:
  277: "exige elegir bien y montar con cuidado los pocos elementos que deciden el resultado"
  279: "Una llave USB de televisión digital con chip compatible es el punto de entrada más barato"
  280: "con mejor convertidor, más margen dinámico y filtros de entrada conmutados"
  281: "sin mezclador analógico"
  282: "el margen dinámico importa más que la sensibilidad en entornos urbanos"
  284: "la antena determina más el resultado que el receptor"
  287: "El tipo, según la banda y la polarización"
  288: "lo más alta y despejada posible, y lejos de fuentes de ruido"
  289: "El cable, con su atenuación"
  291: "la saturación es el problema dominante"
  295: "parece contraproducente y a menudo mejora la recepción"
  296: "atenuar mejora, y verlo una vez enseña la diferencia entre sensibilidad y margen dinámico"
  298: "esa emisión entra por la antena"
  299: "cable de antena apantallado y con ferritas"
  300: "apagar el ordenador y escuchar con otro receptor"
  304: "Corrección de I/Q"
  309: "un receptor cuatro veces más caro"
  310: "Efecto de la atenuación de entrada sobre la saturación"

modelo:
  valores:
    A_t: { sim: "A", nombre: "atenuación de entrada", unidad: dB, valor: 0 }
    S_d: { sim: "S", nombre: "señal deseada", unidad: dBm, valor: -60 }
  calculos:
    I_m: { expr: "-45 - 2*A_t", sim: "IM", nombre: "intermodulación referida a la antena", unidad: dBm }
    N_p: { expr: "-95 + A_t", sim: "N", nombre: "ruido propio referido a la antena", unidad: dBm }
    m_u: { expr: "S_d - max(-45 - 2*A_t, -95 + A_t)", sim: "margen", nombre: "margen útil sobre lo peor", unidad: dB, cifras: 3 }
    A_o: { expr: "50/3", sim: "A_{óptima}", nombre: "atenuación óptima", unidad: dB }

tarjetas:
  - id: explore-resultado
    tipo: explorar
    titulo: "Lo que más cambia el resultado"
    texto: "Montar una SDR utilizable no exige diseñar el receptor: exige cuidar unos pocos elementos. Toque los dos primeros."
    libro: [277, 284, 310]
    widget:
      tipo: figura
      figura: fig-52.14
      zonas:
        - { id: antena, rotulo: "Recuadro verde, a la derecha", rect: [280, 24, 164, 52], texto: "La antena: tipo, ubicación y cable. Determina más el resultado que el receptor." }
        - { id: filtrado, rotulo: "Recuadro naranja, a la derecha", rect: [280, 91, 164, 43], texto: "El filtrado de entrada: paso banda, notch y atenuador contra la saturación." }
        - { id: ordenador, rotulo: "Recuadro rojo, a la derecha", rect: [280, 149, 164, 44], texto: "El ruido del ordenador: fuentes y cables emiten y entran por la antena." }
    requiere: { mover: [antena, filtrado] }

  - id: empareje-receptores
    tipo: pregunta
    titulo: "El receptor"
    texto: "Por el camino del receptor comercial, empareje cada tipo con lo que ofrece."
    libro: [277, 279, 280, 281]
    widget:
      tipo: figura
      figura: fig-52.14
      zonas:
        - { id: todo, rotulo: "Atenuación de entrada y lo que más cambia", rect: [0, 0, 450, 237] }
    emparejar:
      - ["Llave USB de televisión", "Lo más barato: aprender y diagnosticar"]
      - ["Receptor de gama media", "Mejor convertidor, más margen y filtros conmutados"]
      - ["Muestreo directo", "Sin mezclador analógico"]
    exito: "Y lo de la antena, el filtrado y el ruido del ordenador vale igual para el front-end propio."
    pistas:
      - { texto: "El muestreo directo digitaliza la señal de radio tal cual." }
    escalera:
      - "Empiece por el más barato."
    solucion: "Llave USB, lo barato; gama media, más margen; muestreo directo, sin mezclador."

  - id: predecir-urbano
    tipo: predecir
    titulo: "En la ciudad"
    texto: "Elige receptor para un entorno urbano lleno de emisiones fuertes. ¿Qué cifra importa más?"
    libro: [282, 291]
    widget:
      tipo: figura
      figura: fig-52.14
      zonas:
        - { id: todo, rotulo: "Atenuación de entrada y lo que más cambia", rect: [0, 0, 450, 237] }
    opciones:
      - texto: "El margen dinámico"
        bien: true
        porque: "El problema no es oír poco sino saturarse con lo que hay al lado."
      - texto: "La sensibilidad"
        porque: "En la ciudad sobra señal: lo que falla es no saturar."
      - texto: "El ancho de banda instantáneo"
        porque: "Más banda deja entrar más emisoras fuertes: no protege de la saturación."
    escalera:
      - "¿Cuál es el problema dominante con emisiones fuertes cerca?"
    solucion: "El margen dinámico."

  - id: predecir-atenuar
    tipo: predecir
    titulo: "Atenuar la entrada"
    texto: "Con una emisora de FM cercana, el receptor satura. ¿Qué pasa si intercala un atenuador en la antena?"
    libro: [295, 296]
    widget:
      tipo: figura
      figura: fig-52.14
      zonas:
        - { id: todo, rotulo: "Atenuación de entrada y lo que más cambia", rect: [0, 0, 450, 237] }
    opciones:
      - texto: "A menudo mejora: saca al receptor de la saturación"
        bien: true
        porque: "Parece contraproducente, y es el hallazgo típico: enseña la diferencia entre sensibilidad y margen dinámico."
      - texto: "Empeora siempre: llega menos señal"
        porque: "Llega menos señal, pero los productos de la saturación bajan mucho más deprisa."
      - texto: "Nada: el atenuador no afecta a la saturación"
        porque: "Es justo lo que más le afecta: es la primera defensa contra ella."
    escalera:
      - "¿Qué baja más deprisa al atenuar: la señal o lo que genera la saturación?"
    solucion: "Suele mejorar."

  - id: ajuste-atenuador
    tipo: ajuste
    titulo: "El atenuador óptimo"
    texto: "Al atenuar, la intermodulación baja el doble de deprisa de lo que sube el ruido propio, referidos a la antena. Busque el máximo margen sobre lo peor."
    nota: "Las rectas de la figura del libro."
    libro: [296, 310]
    inicio: { A_t: 0 }
    widget:
      tipo: grafica
      x: { id: a, min: 0, max: 30, unidad: dB, rotulo: "atenuación" }
      y: { min: -110, max: -35, unidad: dBm, rotulo: "nivel en la antena" }
      curvas:
        - { expr: "S_d", color: verde, rotulo: "señal deseada" }
        - { expr: "-45 - 2*a", color: naranja, rotulo: "intermodulación" }
        - { expr: "-95 + a", color: azul, rotulo: "ruido propio", discontinua: true }
      marcas:
        - { x: "A_t", y: "max(-45 - 2*A_t, -95 + A_t)", rotulo: "{{m_u}}" }
      lectura: { valor: m_u, rotulo: "Margen sobre lo peor" }
      datos:
        - { valor: A_t, rotulo: "Atenuación: {{A_t}}" }
      mandos:
        - { valor: A_t, min: 0, max: 30, paso: 1, rotulo: "Atenuación de entrada" }
    ajuste:
      valor: m_u
      min: 17
      max: 20
      rotulo: "Margen sobre lo peor"
      escala: { min: -20, max: 20 }
      bajo: "Aún no es el mejor punto: mire qué domina, la intermodulación o el ruido, y mueva el atenuador hacia el cruce."
      alto: "Más no se puede."
      dentro: "En el cruce, unos 17 dB: menos atenuación, satura; más, manda el ruido."
    comprobar:
      - { A_o: 16.7, tol: 0.005 }
      - { con: { A_t: 0 }, m_u: -15 }
      - { con: { A_t: 17 }, m_u: 18 }

  - id: pregunta-antena
    tipo: pregunta
    titulo: "Lo que más cambia"
    texto: "Tiene el montaje mínimo: receptor, la antena que venía y el software. ¿Qué mejora más el resultado?"
    libro: [284, 309]
    widget:
      tipo: figura
      figura: fig-52.14
      zonas:
        - { id: todo, rotulo: "Atenuación de entrada y lo que más cambia", rect: [0, 0, 450, 237] }
    opciones:
      - texto: "Una antena adecuada a la banda y bien situada"
        bien: true
        porque: "La diferencia suele ser mayor que la de un receptor cuatro veces más caro."
      - texto: "Un receptor cuatro veces más caro"
        porque: "La antena determina más el resultado que el receptor."
      - texto: "Un programa con más opciones"
        porque: "El programa no oye lo que la antena no capta."
    escalera:
      - "¿Qué determina más el resultado, según el libro?"
    solucion: "La antena."

  - id: empareje-antena
    tipo: pregunta
    titulo: "Las tres decisiones de la antena"
    texto: "Empareje cada decisión con su criterio."
    libro: [287, 288, 289]
    widget:
      tipo: figura
      figura: fig-52.14
      zonas:
        - { id: todo, rotulo: "Atenuación de entrada y lo que más cambia", rect: [0, 0, 450, 237] }
    emparejar:
      - ["El tipo", "Según la banda y la polarización"]
      - ["La ubicación", "Alta, despejada y lejos de fuentes de ruido"]
      - ["El cable", "Su atenuación, apreciable a frecuencias altas"]
    exito: "Fuentes conmutadas, cargadores e iluminación LED barata: lejos."
    pistas:
      - { texto: "Las fuentes de ruido deciden dónde poner la antena." }
    escalera:
      - "¿Cuál de las tres pierde señal por el camino?"
    solucion: "Tipo, banda y polarización; ubicación, alta y lejos de ruido; cable, su atenuación."

  - id: pregunta-ordenador
    tipo: pregunta
    titulo: "El ruido del ordenador"
    texto: "Sospecha que parte del ruido de fondo lo pone el propio ordenador. ¿Cómo lo comprueba?"
    libro: [298, 299, 300]
    widget:
      tipo: figura
      figura: fig-52.14
      zonas:
        - { id: todo, rotulo: "Atenuación de entrada y lo que más cambia", rect: [0, 0, 450, 237] }
    opciones:
      - texto: "Apagando el ordenador y escuchando con otro receptor"
        bien: true
        porque: "El ruido de fondo que desaparece era del ordenador. Defensas: cable apantallado con ferritas, distancia y alimentación limpia."
      - texto: "Subiendo la ganancia hasta que destaque"
        porque: "Subir la ganancia no distingue de dónde viene el ruido; y puede saturar."
      - texto: "Cambiando de programa"
        porque: "El ruido entra por la antena: el programa no lo crea ni lo quita."
    escalera:
      - "¿Cómo se quita una fuente de ruido sin quitar el receptor?"
    solucion: "Apagar el ordenador y escuchar con otro receptor."

  - id: porque-iq
    tipo: porque
    titulo: "Elegir el programa"
    texto: "Entre lo que conviene mirar en un programa de SDR está la corrección de I/Q. ¿Por qué importa?"
    libro: [304]
    widget:
      tipo: figura
      figura: fig-52.14
      zonas:
        - { id: todo, rotulo: "Atenuación de entrada y lo que más cambia", rect: [0, 0, 450, 237] }
    opciones:
      - texto: "Compensa el desequilibrio de ganancia y fase que crea las imágenes"
        bien: true
        porque: "El hardware barato nunca iguala del todo I y Q; el programa estima el error y lo corrige."
      - texto: "Aumenta la sensibilidad del receptor"
        porque: "No toca el ruido: quita las réplicas espejadas."
      - texto: "Evita la saturación"
        porque: "La saturación se combate antes del convertidor, con filtro y atenuador."
    escalera:
      - "¿Qué defecto de la sección 53.4 se corrige en digital?"
    solucion: "Corrige el desequilibrio I/Q y con él las imágenes."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [282, 284, 296, 300]
    ideas:
      - { titulo: "Margen antes que sensibilidad.", texto: "En la ciudad, el problema es saturarse." }
      - { titulo: "La antena.", texto: "Mejora más que un receptor mucho más caro." }
      - { titulo: "Atenuar mejora.", texto: "Hasta el cruce de intermodulación y ruido." }
      - { titulo: "El ordenador.", texto: "Emite y entra por la antena: apáguelo para comprobarlo." }
