# Lección 1.2 de la sección 53.7 «La Pantalla: Espectro y Waterfall» (cap52, sec-52.6). Formato: GUIA.md.
# - La foto de la figura 53.13 (espectro y cascada en la FM comercial): zonas en píxeles de la foto (1 600 × 765).
# - El margen de color (bloques 223 y 224) sobre un espectro de ejemplo con el suelo de ruido en −60 dB y tres emisiones
#   (como las de la foto): el mínimo del margen debe quedar justo por encima del suelo; se da por bueno de 0 a 5 dB
#   por encima (banda mía para «justo por encima»). El suelo lleva ruido de 2 dB eficaces (motor12e: `ruido(nu, 5)`,
#   con semilla fija), no una senoide rápida.
# Pasos prácticos: «tocar» en la foto la emisión que ocupa menos banda, y «ajuste» del mínimo del margen de color.
leccion: cap52/sec-52.6

libro:
  207: "muestra dos representaciones simultáneas del mismo dato"
  209: "calculado por FFT sobre la última captura"
  210: "cada pico es una emisión, y su anchura dice su ocupación de banda"
  212: "más resolución exige capturar más tiempo, y por tanto responde más despacio"
  213: "suaviza el ruido y oculta las señales breves"
  215: "con el tiempo en el eje vertical y la amplitud codificada en color"
  216: "Una emisión que dura un segundo pasa desapercibida en el espectro instantáneo"
  218: "un sensor inalámbrico que despierta cada minuto"
  223: "Mal ajustado, o todo es ruido o todo es señal"
  224: "el mínimo justo por encima del suelo de ruido, y el máximo en la señal más fuerte de interés"
  225: "con el mismo compromiso de siempre"
  226: "decide cuánto historial cabe en pantalla"
  229: "El pico central del offset de continua"
  230: "Las imágenes, simétricas respecto al centro"
  231: "aparecen y desaparecen según la potencia de las señales presentes"
  232: "cuando el suelo de ruido sube de golpe y aparecen señales por todas partes"
  233: "subir la ganancia hasta saturar el receptor con las fuertes"
  242: "Las emisoras aparecen con su anchura de unos 200 kHz"
  243: "los 48 kHz del receptor del capítulo no abarcan ni una emisora de FM"
  244: "La pantalla de una SDR en la banda de FM comercial"
  245: "con emisiones breves visibles solo en la segunda"

modelo:
  valores:
    c_m: { sim: "mínimo", nombre: "mínimo del margen de color", unidad: dB, valor: -75 }
    s_f: { sim: "suelo", nombre: "suelo de ruido de ejemplo", unidad: dB, valor: -60 }
  calculos:
    d_c: { expr: "c_m - s_f", sim: "Δ", nombre: "mínimo sobre el suelo", unidad: dB }

tarjetas:
  - id: explore-pantalla
    tipo: explorar
    titulo: "Dos vistas del mismo dato"
    texto: "La pantalla de una SDR en la FM comercial. Toque las dos mitades."
    libro: [207, 209, 215, 244]
    widget:
      tipo: figura
      figura: fig-52.10
      zonas:
        - { id: espectro, rotulo: "Mitad de arriba", rect: [0, 0, 1600, 405], texto: "El espectro instantáneo: amplitud frente a frecuencia, por FFT de la última captura. Muestra lo que hay ahora." }
        - { id: cascada, rotulo: "Mitad de abajo", rect: [0, 415, 1600, 350], texto: "La cascada: cada línea es un instante y el color, la intensidad. Cada emisora deja una franja vertical." }
    requiere: { mover: [espectro, cascada] }

  - id: toque-estrecha
    tipo: tocar
    titulo: "Cuánta banda ocupa"
    texto: "En el espectro, la anchura de cada pico dice su ocupación de banda. Toque la emisión que ocupa menos."
    libro: [210, 242]
    widget:
      tipo: figura
      figura: fig-52.10
      zonas:
        - { id: izquierda, rotulo: "Pico de la izquierda", rect: [150, 160, 190, 200] }
        - { id: centro, rotulo: "Pico del centro", rect: [720, 150, 160, 210] }
        - { id: derecha, rotulo: "Pico de la derecha", rect: [1280, 110, 190, 250] }
    tocar:
      bien: [centro]
      porque:
        izquierda: "Esta es más ancha: ocupa los unos 200 kHz de una emisora de FM comercial."
        derecha: "Es la más fuerte, no la más estrecha: la altura dice el nivel; la anchura, la banda."
    exito: "La del centro, la sintonizada: su pico es más estrecho que el de las otras dos."
    escalera:
      - "Mire la base de cada pico, no su altura."
    solucion: "La del centro."

  - id: pregunta-resolucion
    tipo: porque
    titulo: "Los dos ajustes del espectro"
    texto: "Sube la resolución del espectro instantáneo para separar dos señales próximas. ¿Qué precio paga?"
    libro: [212, 213]
    widget:
      tipo: figura
      figura: fig-52.11
      zonas:
        - { id: todo, rotulo: "Espectro instantáneo y cascada", rect: [0, 0, 434, 283] }
    opciones:
      - texto: "Capturar más tiempo: el espectro responde más despacio"
        bien: true
        porque: "La resolución es el inverso del tiempo capturado: el compromiso del espectrograma."
      - texto: "Más ruido en la pantalla"
        porque: "El ruido lo suaviza el promediado; la resolución se paga en tiempo."
      - texto: "Ninguno: es un ajuste gratuito"
        porque: "Más resolución exige capturar más tiempo, siempre."
    escalera:
      - "Resolución en frecuencia y tiempo de observación van juntos."
    solucion: "Más tiempo de captura y respuesta más lenta."

  - id: predecir-breve
    tipo: predecir
    titulo: "Un sensor que despierta"
    texto: "Un sensor inalámbrico transmite un segundo cada minuto. ¿Dónde lo verá?"
    libro: [216, 218, 245]
    widget:
      tipo: figura
      figura: fig-52.11
      zonas:
        - { id: todo, rotulo: "Espectro instantáneo y cascada", rect: [0, 0, 434, 283] }
    opciones:
      - texto: "En la cascada, que guarda el historial"
        bien: true
        porque: "En el espectro instantáneo pasa desapercibido; en la cascada deja una marca visible."
      - texto: "En el espectro instantáneo, como un pico más"
        porque: "Solo si mira justo en ese segundo, y el promediado lo oculta."
      - texto: "En ninguno: es demasiado breve"
        porque: "Para eso existe la cascada: muestra el historial."
    escalera:
      - "¿Cuál de las dos vistas recuerda lo que pasó hace un rato?"
    solucion: "En la cascada."

  - id: ajuste-color
    tipo: ajuste
    titulo: "El margen de color"
    texto: "Mal ajustado, o todo es ruido o todo es señal. Lleve el mínimo del margen de color justo por encima del suelo de ruido."
    nota: "Espectro de ejemplo."
    libro: [223, 224, 225, 226]
    inicio: { c_m: -75 }
    widget:
      tipo: grafica
      x: { id: nu, min: 97200000, max: 99400000, unidad: Hz, rotulo: "f", muestras: 1200 }
      y: { min: -80, max: 0, unidad: dB, rotulo: "nivel" }
      curvas:
        - { expr: "s_f + 2*ruido(nu, 5) + 25*exp(-((nu - 97500000)/50000)^2) + 28*exp(-((nu - 98300000)/30000)^2) + 34*exp(-((nu - 99100000)/50000)^2)", color: naranja, rotulo: "espectro" }
        - { expr: "c_m", color: azul, rotulo: "mínimo del color", discontinua: true }
      lectura: { valor: d_c, rotulo: "Mínimo sobre el suelo" }
      mandos:
        - { valor: c_m, min: -80, max: -20, paso: 1, rotulo: "Mínimo del margen de color" }
    ajuste:
      valor: d_c
      min: 0
      max: 5
      rotulo: "Mínimo sobre el suelo"
      escala: { min: -20, max: 40 }
      bajo: "Por debajo del suelo: el ruido se pinta y todo parece señal. Súbalo."
      alto: "Demasiado alto: las señales débiles se quedan sin color. Bájelo."
      dentro: "Justo encima del suelo: el ruido queda oscuro y cualquier emisión destaca."
    comprobar:
      - { s_f: -60 }

  - id: empareje-reconocer
    tipo: pregunta
    titulo: "Lo que es del receptor"
    texto: "Empareje cada cosa que aparece en la pantalla con su firma."
    libro: [229, 230, 231, 232]
    widget:
      tipo: figura
      figura: fig-52.11
      zonas:
        - { id: todo, rotulo: "Espectro instantáneo y cascada", rect: [0, 0, 434, 283] }
    emparejar:
      - ["Offset de continua", "Un pico fijo en el centro"]
      - ["Imágenes", "Simétricas respecto al centro"]
      - ["Intermodulación", "Aparece y desaparece con la potencia de otras señales"]
      - ["Saturación", "El suelo sube de golpe y hay señales por todas partes"]
    exito: "Así la pantalla se vuelve un instrumento de diagnóstico."
    pistas:
      - { texto: "Lo que depende de la potencia de las demás señales es intermodulación." }
    escalera:
      - "Empiece por lo que está siempre en el mismo sitio."
    solucion: "Continua, el centro; imágenes, simétricas; intermodulación, con la potencia; saturación, el suelo que sube."

  - id: predecir-ganancia
    tipo: predecir
    titulo: "Una señal débil"
    texto: "Busca una señal débil y sube la ganancia; de pronto el suelo de ruido sube y aparecen señales por todas partes. ¿Qué hace?"
    libro: [232, 233]
    widget:
      tipo: figura
      figura: fig-52.11
      zonas:
        - { id: todo, rotulo: "Espectro instantáneo y cascada", rect: [0, 0, 434, 283] }
    opciones:
      - texto: "Bajar la ganancia: el receptor está saturado por las señales fuertes"
        bien: true
        porque: "Es el error más común: la débil queda enterrada entre productos espurios."
      - texto: "Subirla más, hasta que la débil destaque"
        porque: "Satura todavía más: aparecen más espurios y la débil se entierra."
      - texto: "Estrechar el filtro de canal"
        porque: "La saturación ya ocurrió antes del convertidor; ningún filtro digital la deshace."
    escalera:
      - "¿Qué indica que el suelo de ruido suba de golpe?"
    solucion: "Bajar la ganancia."

  - id: pregunta-banda
    tipo: pregunta
    titulo: "Leer una banda conocida"
    texto: "Para leer la pantalla con el receptor del capítulo, de 48 kHz de banda, ¿qué banda conviene recorrer?"
    libro: [242, 243]
    widget:
      tipo: figura
      figura: fig-52.10
      zonas:
        - { id: todo, rotulo: "Espectro y cascada de la FM comercial", rect: [0, 0, 1600, 765] }
    opciones:
      - texto: "La de 41 m: emisoras de AM de unos 9 kHz sobre una rejilla de 5 kHz"
        bien: true
        porque: "En 48 kHz caben varias a la vez, con su portadora y sus dos bandas laterales."
      - texto: "La FM comercial"
        porque: "Cada emisora ocupa unos 200 kHz: en 48 kHz no cabe ni una. Esa pide una llave USB."
      - texto: "Cualquiera: todas caben en 48 kHz"
        porque: "Una emisora de FM ya no cabe; hay que elegir una banda de emisiones estrechas."
    escalera:
      - "Compare 48 kHz con la anchura de una emisora de FM."
    solucion: "La de radiodifusión de 41 m."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [210, 216, 224, 233]
    ideas:
      - { titulo: "Espectro.", texto: "Lo que hay ahora: cada pico es una emisión y su anchura, su banda." }
      - { titulo: "Cascada.", texto: "El historial: lo breve e intermitente deja su marca." }
      - { titulo: "Margen de color.", texto: "Mínimo justo sobre el suelo, máximo en la señal más fuerte." }
      - { titulo: "Diagnóstico.", texto: "Si el suelo sube de golpe, baje la ganancia." }
