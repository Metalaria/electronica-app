# Lección 1.2 de la sección 53.10 «Ampliaciones» (cap52, sec-52.9). Formato: GUIA.md.
# Sección de criterios: las cinco ampliaciones y lo que enseña cada una (figura 53.18), lo que conviene hacer primero y
# la conexión con el resto del libro. Sin paso práctico nuevo (es una sección de criterios); el banco del libro (medir
# el propio banco con la SDR) va como pregunta.
# 1.2.1 (autor121-senpro, «aprender haciendo», GUIA §13): en la figura 53.18 se tocan la ampliación que recorre I/Q al
# revés, la de las imágenes, la verificable y la que lleva al capítulo 38; se busca el primer armónico de una fuente
# conmutada de 100 kHz (de ejemplo) que cae en la banda del receptor (la de la 53.1). La dificultad de transmitir, lo
# que enseña cada ampliación y el cierre del libro se funden en los éxitos. Queda una pregunta de opciones (lo primero).
leccion: cap52/sec-52.9

libro:
  313: "hay cinco direcciones para ampliarlo, cada una con su enseñanza propia"
  315: "la misma arquitectura I/Q recorrida al revés"
  316: "que exige licencia y respetar las bandas"
  317: "la conmutación entre transmisión y recepción sin destruir el receptor"
  320: "mezcladores, planificación de frecuencias y el problema de las imágenes"
  322: "liberando el ordenador y garantizando la latencia"
  323: "Es el proyecto que más enseña sobre lógica programable, y el más laborioso"
  326: "sincronización, corrección de errores"
  327: "los datos decodificados tienen sentido o no lo tienen"
  329: "Usar la SDR como instrumento"
  330: "la que no requiere construir nada"
  332: "mejorar la antena y el filtrado antes que cualquier ampliación"
  333: "Ambas cosas cuestan poco y se notan de inmediato"
  335: "el procesado en tiempo real al 38, los modos digitales al 29 y al 30"
  336: "es donde casi todos los capítulos se encuentran"
  338: "usar la SDR para medir el propio banco"
  339: "enseña de compatibilidad electromagnética más en una tarde que cualquier lectura"
  340: "Las cinco ampliaciones de la SDR"
  "cap52#5": "Banda: 3,5 a 7,5 MHz"

modelo:
  valores:
    f_c: { sim: "f_{conm}", nombre: "frecuencia de conmutación de la fuente", unidad: Hz, valor: 100000 }
    n_a: { sim: "n", nombre: "armónico", unidad: "", valor: 1 }
  calculos:
    f_h: { expr: "n_a*f_c", sim: "f", nombre: "frecuencia del armónico", unidad: Hz }

tarjetas:
  - id: explore-ampliaciones
    tipo: tocar
    titulo: "Hasta dónde se puede llegar"
    texto: "El receptor funciona, y hay cinco direcciones para ampliarlo. Toque la que es la misma arquitectura I/Q recorrida al revés."
    libro: [313, 315, 316, 317, 340]
    widget:
      tipo: figura
      figura: fig-52.15
      zonas: &zonas-amp
        - { id: transmitir, rotulo: "Arriba a la izquierda", rect: [8, 4, 141, 60] }
        - { id: cobertura, rotulo: "Arriba en el centro", rect: [156, 4, 142, 60] }
        - { id: tiemporeal, rotulo: "Arriba a la derecha", rect: [305, 4, 141, 60] }
        - { id: modos, rotulo: "Abajo a la izquierda", rect: [8, 72, 141, 61] }
        - { id: medida, rotulo: "Abajo en el centro", rect: [156, 72, 142, 61] }
    tocar:
      bien: [transmitir]
      porque:
        cobertura: "Más cobertura es un conversor o muestreo directo."
        tiemporeal: "Tiempo real es llevar el procesado a una FPGA."
        modos: "Los modos digitales son decodificar."
        medida: "La medida es usar la SDR como instrumento."
    exito: "Transmitir: exige licencia, linealidad, filtrar armónicos y conmutar entre transmisión y recepción sin destruir el receptor."
    escalera:
      - "¿Qué ampliación hace lo contrario que recibir?"
    solucion: "Arriba a la izquierda, transmitir."

  - id: empareje-ensenanzas
    tipo: tocar
    titulo: "Lo que enseña cada una"
    texto: "Toque la ampliación que enseña mezcladores, planificación de frecuencias y el problema de las imágenes."
    libro: [320, 322, 323, 329, 330]
    widget:
      tipo: figura
      figura: fig-52.15
      zonas: *zonas-amp
    tocar:
      bien: [cobertura]
      porque:
        transmitir: "Transmitir enseña linealidad y filtrado de armónicos."
        tiemporeal: "El tiempo real enseña lógica programable, con mucho trabajo."
        modos: "Los modos enseñan sincronización y protocolos."
        medida: "La medida enseña instrumentación, sin construir nada."
    exito: "Más cobertura: con un conversor, el problema de las imágenes se multiplica."
    escalera:
      - "¿Qué ampliación añade otra mezcla?"
    solucion: "Arriba en el centro, más cobertura."

  - id: porque-modos
    tipo: tocar
    titulo: "Una virtud didáctica"
    texto: "Una ampliación tiene un resultado verificable: los datos decodificados tienen sentido o no lo tienen. Tóquela."
    libro: [326, 327]
    widget:
      tipo: figura
      figura: fig-52.15
      zonas: *zonas-amp
    tocar:
      bien: [modos]
      porque:
        transmitir: "Transmitir no decodifica datos."
        cobertura: "Más cobertura no decodifica nada."
        tiemporeal: "El tiempo real cambia dónde se calcula, no qué."
        medida: "La medida mira el espectro, no decodifica."
    exito: "Modos digitales: telemetría, aeronaves o satélites. Un error de sincronización o de corrección se ve enseguida."
    escalera:
      - "¿Cuál produce datos?"
    solucion: "Abajo a la izquierda, modos digitales."

  - id: predecir-primero
    tipo: predecir
    titulo: "Lo que conviene hacer primero"
    texto: "Antes de cualquier ampliación, ¿qué recomienda el libro?"
    libro: [332, 333]
    widget:
      tipo: figura
      figura: fig-52.15
      zonas:
        - { id: todo, rotulo: "Las cinco ampliaciones", rect: [0, 0, 453, 188] }
    opciones:
      - texto: "Mejorar la antena y el filtrado"
        bien: true
        porque: "Cuestan poco y se notan de inmediato; el filtro resuelve la saturación, dominante en la ciudad."
      - texto: "Pasar el procesado a una FPGA"
        porque: "Es la más laboriosa; no mejora lo que la antena no capta."
      - texto: "Añadir un transmisor"
        porque: "Exige licencia y otro nivel de trabajo; no mejora la recepción."
    escalera:
      - "¿Qué mejoraba más que un receptor cuatro veces más caro?"
    solucion: "Antena y filtrado."

  - id: empareje-capitulos
    tipo: tocar
    titulo: "La conexión con el resto del libro"
    texto: "El procesado en tiempo real lleva al capítulo 38, el de lógica programable. Toque la ampliación correspondiente."
    libro: [335, 336]
    widget:
      tipo: figura
      figura: fig-52.15
      zonas: *zonas-amp
    tocar:
      bien: [tiemporeal]
      porque:
        transmitir: "Transmitir lleva al 37 y al 33."
        cobertura: "Más cobertura sigue en la radiofrecuencia."
        modos: "Los modos digitales llevan al 29 y al 30."
        medida: "La medida lleva al 20 y al 32."
    exito: "Tiempo real, con una FPGA. La SDR cierra los proyectos: en ella se encuentran casi todos los capítulos."
    escalera:
      - "¿Cuál pide una FPGA?"
    solucion: "Arriba a la derecha, tiempo real."

  - id: pregunta-banco
    tipo: explorar
    titulo: "Medir el propio banco"
    texto: "Una fuente conmutada de 100 kHz emite armónicos. Busque el primero que cae en la banda del receptor, de 3,5 a 7,5 MHz."
    nota: "Fuente de ejemplo."
    libro: [338, 339, "cap52#5"]
    fijar: { f_c: 100000 }
    inicio: { n_a: 1 }
    widget:
      tipo: grafica
      x: { id: k, min: 0, max: 80, unidad: "", rotulo: "armónico" }
      y: { min: 0, max: 8000000, unidad: Hz, rotulo: "f" }
      curvas:
        - { expr: "k*f_c", color: naranja, rotulo: "armónicos" }
        - { expr: "3500000", color: verde, rotulo: "banda del receptor", discontinua: true }
        - { expr: "7500000", color: verde, rotulo: "banda del receptor", discontinua: true }
      marcas:
        - { x: "n_a", y: "f_h", rotulo: "{{f_h}}" }
      lectura: { valor: f_h, rotulo: "Frecuencia del armónico" }
      mandos:
        - { valor: n_a, min: 1, max: 80, paso: 1, rotulo: "Armónico" }
    objetivo:
      condiciones:
        - { valor: f_h, min: 3500000, rotulo: "{{f_h}}" }
        - { valor: f_h, max: 7500000, rotulo: "Dentro de la banda" }
      logrado: "El armónico {{n_a}} ya cae en la banda: mirar el propio banco enseña compatibilidad electromagnética en una tarde, sin construir nada."
      pistas:
        - { cuando: { valor: f_h, mayor: 7500000 }, texto: "Se ha pasado de la banda: baje." }
        - { texto: "Aún por debajo de la banda: suba de armónico." }
    escalera:
      - "3,5 MHz entre 100 kHz."
    solucion: "El 35: 3,5 MHz."
    comprobar:
      - { con: { n_a: 35 }, f_h: 3500000 }

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [313, 327, 332, 336]
    ideas:
      - { titulo: "Cinco direcciones.", texto: "Transmitir, más cobertura, tiempo real, modos digitales y medida." }
      - { titulo: "Lo primero.", texto: "Antena y filtrado: poco coste y efecto inmediato." }
      - { titulo: "Verificable.", texto: "Los modos digitales dicen enseguida si funciona." }
      - { titulo: "El cierre.", texto: "En la SDR se encuentran casi todos los capítulos." }
