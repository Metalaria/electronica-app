# Lección 1.2 de la sección 53.10 «Ampliaciones» (cap52, sec-52.9). Formato: GUIA.md.
# Sección de criterios: las cinco ampliaciones y lo que enseña cada una (figura 53.18), lo que conviene hacer primero y
# la conexión con el resto del libro. Sin paso práctico nuevo (es una sección de criterios); el banco del libro (medir
# el propio banco con la SDR) va como pregunta.
leccion: cap52/sec-52.9

libro:
  313: "hay cinco direcciones para ampliarlo, cada una con su enseñanza propia"
  315: "la misma arquitectura I/Q recorrida al revés"
  316: "que exige licencia y respetar las bandas"
  317: "la conmutación entre transmisión y recepción sin destruir el receptor"
  320: "mezcladores, planificación de frecuencias y el problema de las imágenes"
  322: "liberando el ordenador y garantizando la latencia"
  323: "Es el proyecto que más enseña sobre lógica programable, y el más laborioso"
  326: "sincronización, corrección de errores"
  327: "los datos decodificados tienen sentido o no lo tienen"
  329: "Usar la SDR como instrumento"
  330: "la que no requiere construir nada"
  332: "mejorar la antena y el filtrado antes que cualquier ampliación"
  333: "Ambas cosas cuestan poco y se notan de inmediato"
  335: "el procesado en tiempo real al 38, los modos digitales al 29 y al 30"
  336: "es donde casi todos los capítulos se encuentran"
  338: "usar la SDR para medir el propio banco"
  339: "enseña de compatibilidad electromagnética más en una tarde que cualquier lectura"
  340: "Las cinco ampliaciones de la SDR"

modelo:
  valores: {}
  calculos: {}

tarjetas:
  - id: explore-ampliaciones
    tipo: explorar
    titulo: "Hasta dónde se puede llegar"
    texto: "El receptor funciona, y hay cinco direcciones para ampliarlo. Toque transmitir y el tiempo real."
    libro: [313, 340]
    widget:
      tipo: figura
      figura: fig-52.15
      zonas:
        - { id: transmitir, rotulo: "Arriba a la izquierda", rect: [8, 4, 141, 60], texto: "Transmitir: la misma arquitectura I/Q recorrida al revés." }
        - { id: cobertura, rotulo: "Arriba en el centro", rect: [156, 4, 142, 60], texto: "Más cobertura: un conversor o un receptor de muestreo directo." }
        - { id: tiemporeal, rotulo: "Arriba a la derecha", rect: [305, 4, 141, 60], texto: "Tiempo real: el diezmado y el filtrado en una FPGA." }
        - { id: modos, rotulo: "Abajo a la izquierda", rect: [8, 72, 141, 61], texto: "Modos digitales: telemetría, identificación de aeronaves, meteorología por satélite." }
        - { id: medida, rotulo: "Abajo en el centro", rect: [156, 72, 142, 61], texto: "Medida: la SDR como analizador de espectro, sin construir nada." }
    requiere: { mover: [transmitir, tiemporeal] }

  - id: empareje-ensenanzas
    tipo: pregunta
    titulo: "Lo que enseña cada una"
    texto: "Empareje cada ampliación con lo que enseña."
    libro: [316, 320, 322, 323, 326, 329, 330]
    widget:
      tipo: figura
      figura: fig-52.15
      zonas:
        - { id: todo, rotulo: "Las cinco ampliaciones", rect: [0, 0, 453, 188] }
    emparejar:
      - ["Transmitir", "Linealidad de la etapa de potencia y filtrado de armónicos"]
      - ["Más cobertura", "Mezcladores, planificación de frecuencias e imágenes"]
      - ["Tiempo real", "Lógica programable, con mucho trabajo"]
      - ["Modos digitales", "Sincronización, corrección de errores y protocolos"]
      - ["Medida", "Instrumentación, sin construir nada"]
    exito: "Cada ampliación lleva a un capítulo del libro."
    pistas:
      - { texto: "Con cobertura amplia, el problema de las imágenes se multiplica." }
    escalera:
      - "Empiece por la que no requiere construir nada."
    solucion: "Transmitir, linealidad; cobertura, imágenes; tiempo real, FPGA; modos, sincronización; medida, instrumentación."

  - id: pregunta-transmitir
    tipo: pregunta
    titulo: "La dificultad de transmitir"
    texto: "Además de la licencia, ¿cuál es la dificultad característica de añadir un transmisor?"
    libro: [315, 316, 317]
    widget:
      tipo: figura
      figura: fig-52.15
      zonas:
        - { id: todo, rotulo: "Las cinco ampliaciones", rect: [0, 0, 453, 188] }
    opciones:
      - texto: "Conmutar entre transmisión y recepción sin destruir el receptor"
        bien: true
        porque: "La potencia emitida, metida en la entrada de un receptor de microvoltios, lo destruye."
      - texto: "Generar I y Q en el transmisor"
        porque: "Es la misma arquitectura I/Q recorrida al revés: lo conocido."
      - texto: "Encontrar un programa que transmita"
        porque: "La dificultad es de hardware: la conmutación y la etapa de potencia."
    escalera:
      - "¿Qué le pasa al receptor si le llega la potencia del propio transmisor?"
    solucion: "La conmutación transmisión-recepción."

  - id: porque-modos
    tipo: porque
    titulo: "Una virtud didáctica"
    texto: "Decodificar telemetría o meteorología por satélite tiene una virtud para aprender. ¿Cuál?"
    libro: [326, 327]
    widget:
      tipo: figura
      figura: fig-52.15
      zonas:
        - { id: todo, rotulo: "Las cinco ampliaciones", rect: [0, 0, 453, 188] }
    opciones:
      - texto: "El resultado es verificable: los datos tienen sentido o no lo tienen"
        bien: true
        porque: "Un error de sincronización o de corrección se ve enseguida en los datos."
      - texto: "Que no hace falta antena"
        porque: "Hace falta, como en cualquier recepción."
      - texto: "Que es la ampliación más fácil"
        porque: "Pide sincronización, corrección de errores y protocolos reales: no es la más fácil."
    escalera:
      - "¿Cómo sabe que ha decodificado bien?"
    solucion: "Es verificable."

  - id: predecir-primero
    tipo: predecir
    titulo: "Lo que conviene hacer primero"
    texto: "Antes de cualquier ampliación, ¿qué recomienda el libro?"
    libro: [332, 333]
    widget:
      tipo: figura
      figura: fig-52.15
      zonas:
        - { id: todo, rotulo: "Las cinco ampliaciones", rect: [0, 0, 453, 188] }
    opciones:
      - texto: "Mejorar la antena y el filtrado"
        bien: true
        porque: "Cuestan poco y se notan de inmediato; el filtro resuelve la saturación, dominante en la ciudad."
      - texto: "Pasar el procesado a una FPGA"
        porque: "Es la más laboriosa; no mejora lo que la antena no capta."
      - texto: "Añadir un transmisor"
        porque: "Exige licencia y otro nivel de trabajo; no mejora la recepción."
    escalera:
      - "¿Qué mejoraba más que un receptor cuatro veces más caro?"
    solucion: "Antena y filtrado."

  - id: empareje-capitulos
    tipo: pregunta
    titulo: "La conexión con el resto del libro"
    texto: "Empareje cada ampliación con los capítulos a los que lleva."
    libro: [335]
    widget:
      tipo: figura
      figura: fig-52.15
      zonas:
        - { id: todo, rotulo: "Las cinco ampliaciones", rect: [0, 0, 453, 188] }
    emparejar:
      - ["Transmitir", "Capítulos 37 y 33"]
      - ["Tiempo real", "Capítulo 38"]
      - ["Modos digitales", "Capítulos 29 y 30"]
      - ["Medida", "Capítulos 20 y 32"]
    exito: "La SDR cierra los proyectos: en ella se encuentran casi todos los capítulos."
    pistas:
      - { texto: "Los modos digitales vuelven a las señales y las comunicaciones." }
    escalera:
      - "La FPGA está en el capítulo de lógica programable."
    solucion: "Transmitir, 37 y 33; tiempo real, 38; modos, 29 y 30; medida, 20 y 32."

  - id: pregunta-banco
    tipo: pregunta
    titulo: "Medir el propio banco"
    texto: "La primera ampliación por esfuerzo y aprendizaje: mirar con la SDR lo que emite una fuente conmutada o una placa propia. ¿Qué enseña?"
    libro: [338, 339]
    widget:
      tipo: figura
      figura: fig-52.15
      zonas:
        - { id: todo, rotulo: "Las cinco ampliaciones", rect: [0, 0, 453, 188] }
    opciones:
      - texto: "Compatibilidad electromagnética, en una tarde y sin montar nada"
        bien: true
        porque: "Ver el espectro que emite cada aparato enseña más que cualquier lectura."
      - texto: "A transmitir"
        porque: "Solo se recibe: se mira lo que emiten los aparatos."
      - texto: "A programar la FPGA"
        porque: "No hace falta tocar el procesado: basta la pantalla de espectro."
    escalera:
      - "¿Qué se ve al poner la antena junto a un cargador?"
    solucion: "Compatibilidad electromagnética."

  - id: porque-cierre
    tipo: porque
    titulo: "Por qué la SDR cierra el libro"
    texto: "¿Por qué es la SDR el proyecto que cierra los proyectos del libro?"
    libro: [335, 336]
    widget:
      tipo: figura
      figura: fig-52.15
      zonas:
        - { id: todo, rotulo: "Las cinco ampliaciones", rect: [0, 0, 453, 188] }
    opciones:
      - texto: "Porque en ella se encuentran casi todos los capítulos"
        bien: true
        porque: "Muestreo, radiofrecuencia, procesado, lógica programable, medida: todo converge."
      - texto: "Porque es el más caro"
        porque: "Se puede montar con componentes asequibles; lo que la distingue es la convergencia."
      - texto: "Porque sustituye a todos los anteriores"
        porque: "No los sustituye: los reúne. Lo digital complementa a lo analógico."
    escalera:
      - "Cuente cuántos capítulos aparecen en sus ampliaciones."
    solucion: "Porque reúne casi todo el libro."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [313, 327, 332, 336]
    ideas:
      - { titulo: "Cinco direcciones.", texto: "Transmitir, más cobertura, tiempo real, modos digitales y medida." }
      - { titulo: "Lo primero.", texto: "Antena y filtrado: poco coste y efecto inmediato." }
      - { titulo: "Verificable.", texto: "Los modos digitales dicen enseguida si funciona." }
      - { titulo: "El cierre.", texto: "En la SDR se encuentran casi todos los capítulos." }
