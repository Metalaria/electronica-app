# Lección 1.2 de la sección 55.6 «Las Tensiones de Alimentación, Primero Siempre» (cap53; etiqueta interna sec-53.6).
# Formato: contenido/lecciones11/GUIA.md. Circuitos de EJEMPLO: (1) un raíl de 3,3 V (bloque 39 de la 55.1) que llega
# a un integrado de 33 Ω equivalentes por una pista (0,1 Ω), un conector (0,05 Ω limpio, 0,5 Ω sucio, 3 Ω oxidado) y la
# vuelta de masa (0,1 Ω), en el esquema «serie»; (2) un raíl de 5 V con rizado senoidal de 100 Hz (gráfica): el
# multímetro lee la media. La figura 55.21 (latiguillo frente a muelle) con zonas en su svg_vista (442,9 × 187,8).
# Paso práctico: «averia» midiendo en el regulador, en los pines del integrado y en las caídas de pista y conector.
leccion: cap53/sec-53.6

libro:
  176: "Una alimentación incorrecta explica casi cualquier síntoma"
  179: "medir en la carga, no en la fuente"
  180: "la medida se hace en los pines del propio integrado"
  183: "El multímetro promedia"
  185: "Rizado a 100 Hz —fuente lineal— o a la frecuencia de conmutación."
  186: "Picos de conmutación, que indican desacoplo insuficiente"
  187: "Caídas sincronizadas con la actividad del circuito, que indican una PDN insuficiente"
  188: "Oscilación de alta frecuencia, que indica un regulador inestable"
  190: "Con latiguillo largo, lo que se mide es sobre todo la captación de la sonda"
  193: "un sistema que arranca a veces sí y a veces no"
  197: "Lo segundo es mucho peor y es lo que el supervisor de alimentación evita."
  200: "Tensión continua en los pines del integrado."
  201: "Rizado y ruido en AC con masa corta."
  202: "Consumo."
  203: "Comportamiento al arrancar, en disparo único."
  "cap53#39": "un circuito al que le faltan 3,3 V"
  "cap53#8": "el rizado de la línea de 5 V excede lo admisible"
  "cap53#305": "El mismo rizado de una fuente conmutada medido con el latiguillo largo de masa"

modelo:
  valores:
    V_s: { sim: "V_{reg}", nombre: "salida del regulador", unidad: V, valor: 3.3 }
    R_p: { sim: "R_{pista}", nombre: "pista y ferrita", unidad: Ω, valor: 0.1 }
    R_k: { sim: "R_{con}", nombre: "conector", unidad: Ω, valor: 0.05 }
    R_ic: { sim: "R_{IC}", nombre: "el integrado, como carga", unidad: Ω, valor: 33 }
    R_m: { sim: "R_{masa}", nombre: "vuelta de masa", unidad: Ω, valor: 0.1 }
    V_cc: { sim: "V", nombre: "raíl de 5 V", unidad: V, valor: 5 }
    a_r: { sim: "a", nombre: "amplitud del rizado", unidad: V, valor: 0.1 }
    f_r: { sim: "f", nombre: "frecuencia del rizado", unidad: Hz, valor: 100 }
  calculos:
    I_s: { expr: "V_s/(R_p + R_k + R_ic + R_m)", sim: "I", nombre: "consumo", unidad: A }
    V_1: { expr: "I_s*R_p", sim: "V_{pista}", nombre: "caída en la pista", unidad: V }
    V_2: { expr: "I_s*R_k", sim: "V_{con}", nombre: "caída en el conector", unidad: V }
    V_ic: { expr: "I_s*R_ic", sim: "V_{IC}", nombre: "tensión en los pines del integrado", unidad: V }
    V_4: { expr: "I_s*R_m", sim: "V_{masa}", nombre: "caída en la vuelta de masa", unidad: V }
    V_med: { expr: "V_cc", sim: "V_{media}", nombre: "lo que lee el multímetro", unidad: V }
    V_pp: { expr: "2*a_r", sim: "V_{pp}", nombre: "rizado pico a pico", unidad: V }

tarjetas:
  - id: explore-carga
    tipo: explorar
    titulo: "En la fuente o en la carga"
    texto: "Un raíl de 3,3 V llega al integrado por una pista y un conector. Ensucie el conector y compare las dos medidas."
    nota: "Circuito de ejemplo: el integrado, como una resistencia."
    libro: [179, "cap53#39"]
    widget:
      tipo: circuito
      esquema: serie
      piezas: { fuente: V_s, r1: R_p, r2: R_k, r3: R_ic, r4: R_m }
      lectura: { valor: V_ic, rotulo: "En los pines del integrado" }
      datos:
        - { valor: V_s, rotulo: "En el regulador: {{V_s}}" }
        - { valor: V_2, rotulo: "Caída en el conector: {{V_2}}" }
      corriente: I_s
      mide: { corriente: I_s, v1: V_1, v2: V_2, v3: V_ic, v4: V_4 }
      mandos:
        - { valor: R_k, lista: [0.05, 0.5, 3], nombres: [limpio, sucio, oxidado], rotulo: "Conector" }
    requiere: { mover: [R_k] }

  - id: donde-medir
    tipo: pregunta
    titulo: "Dónde se mide"
    texto: "¿Dónde se mide la tensión de alimentación de un integrado?"
    libro: [179, 180]
    fijar: { R_k: 3 }
    widget:
      tipo: circuito
      esquema: serie
      piezas: { fuente: V_s, r1: R_p, r2: R_k, r3: R_ic, r4: R_m }
      lectura: { valor: V_ic, rotulo: "En los pines del integrado" }
      datos:
        - { valor: V_s, rotulo: "En el regulador: {{V_s}}" }
      corriente: I_s
      mide: { corriente: I_s, v1: V_1, v2: V_2, v3: V_ic, v4: V_4 }
    opciones:
      - texto: "En los pines del propio integrado"
        bien: true
        porque: "Ahí se ve la caída de pistas, conectores y ferritas, y se comprueba de paso que llega."
      - texto: "En la salida del regulador"
        porque: "Ahí puede estar correcta y llegar baja al integrado: aquí 3,3 V frente a 3,00 V."
      - texto: "En el condensador de filtro principal"
        porque: "Está aún más lejos de la carga: no ve las caídas del camino."
    escalera:
      - "Compare la lectura del regulador con la de los pines con el conector oxidado."
    solucion: "En la carga: en los pines del integrado."
    comprobar:
      - { V_ic: 3.0, tol: 0.01 }

  - id: averia-raiz
    tipo: averia
    titulo: "Al integrado no le llega"
    texto: "El regulador da sus 3,3 V, pero el integrado no funciona. Mida y diga qué falla."
    libro: [179, 180, "cap53#39"]
    fijar: { V_s: 3.3, R_p: 0.1, R_k: 0.05, R_ic: 33, R_m: 0.1 }
    widget:
      tipo: circuito
      esquema: serie
      piezas: { fuente: V_s, r1: R_p, r2: R_k, r3: R_ic, r4: R_m }
      mide: { corriente: I_s, v1: V_1, v2: V_2, v3: V_ic, v4: V_4 }
      mandos: []
    averia:
      pasos: 2
      sospechosos:
        - { id: r1, rotulo: "La pista" }
        - { id: r2, rotulo: "El conector" }
        - { id: r3, rotulo: "El integrado" }
      sondas:
        - { id: regulador, rotulo: "En el regulador", valor: V_s }
        - { id: pines, rotulo: "En los pines del integrado", valor: V_ic }
        - { id: conector, rotulo: "Caída en el conector", valor: V_2 }
        - { id: pista, rotulo: "Caída en la pista", valor: V_1 }
      fallos:
        - { id: conector-oxidado, pieza: r2, tipo: alto, con: { R_k: 3 }, texto: "Conector oxidado: se lleva unos 0,27 V y al integrado le llegan 3,0 V." }
        - { id: pista-cortada, pieza: r1, tipo: abierta, con: { R_p: 1e9 }, texto: "Pista cortada: toda la tensión cae en ella y al integrado no llega nada." }
        - { id: integrado-corto, pieza: r3, tipo: corto, con: { R_ic: 0.01 }, texto: "Integrado en corto: el consumo se dispara y la tensión se queda en la pista y el conector." }
    pistas:
      - { texto: "En el regulador siempre lee bien: la medida que decide es en la carga." }
    escalera:
      - "Sano, en los pines hay 3,28 V y las caídas son de milivoltios."
      - "Si en los pines falta tensión, mire dónde se queda: en la pista o en el conector."
    solucion: "Mida en los pines del integrado y luego la caída del camino: la que se lleva la tensión es la culpable."
    comprobar:
      - { V_ic: 3.28, V_1: 0.01, V_2: 0.005, tol: 0.01 }
      - { con: { R_k: 3 }, V_2: 0.273, V_ic: 3.0, tol: 0.01 }

  - id: explore-rizado
    tipo: explorar
    titulo: "El multímetro promedia"
    texto: "Un raíl de 5 V con rizado de 100 Hz. Suba el rizado y mire qué lee el multímetro."
    nota: "Rizado de ejemplo."
    libro: [183, 185, "cap53#8"]
    fijar: { V_cc: 5, f_r: 100 }
    widget:
      tipo: grafica
      x: { id: t, min: 0, max: 0.03, unidad: s, rotulo: "t" }
      y: { min: 4, max: 6, unidad: V, rotulo: "v" }
      curvas:
        - { expr: "V_cc + a_r*sin(2*pi*f_r*t)", color: azul, rotulo: "raíl" }
        - { expr: "V_med", color: naranja, rotulo: "multímetro", discontinua: true }
      lectura: { valor: V_med, rotulo: "Lee el multímetro" }
      datos:
        - { valor: V_pp, rotulo: "Rizado: {{V_pp}} pico a pico" }
      mandos:
        - { valor: a_r, lista: [0, 0.1, 0.3, 0.5], rotulo: "Amplitud del rizado" }
    requiere: { mover: [a_r] }

  - id: prediga-media
    tipo: predecir
    titulo: "Rizado de un voltio"
    texto: "El raíl de 5 V lleva un voltio de rizado pico a pico. ¿Qué lee el multímetro en continua?"
    libro: [183, "cap53#8"]
    fijar: { V_cc: 5, a_r: 0.5, f_r: 100 }
    widget:
      tipo: grafica
      x: { id: t, min: 0, max: 0.03, unidad: s, rotulo: "t" }
      y: { min: 4, max: 6, unidad: V, rotulo: "v" }
      curvas:
        - { expr: "V_cc + a_r*sin(2*pi*f_r*t)", color: azul, rotulo: "raíl" }
      lectura: { valor: V_med, rotulo: "Lee el multímetro" }
      ocultar: true
    opciones:
      - texto: "5 V: una lectura media perfecta"
        bien: true
        porque: "Promedia: el rizado no se ve. Hace falta el osciloscopio en AC sobre el mismo punto."
      - texto: "Menos de 5 V, porque el rizado resta"
        porque: "El rizado sube tanto como baja: la media no cambia."
      - texto: "Oscila sin parar"
        porque: "A 100 Hz es demasiado rápido para los dígitos: lo promedia."
    escalera:
      - "¿Cuánto vale la media de una senoide?"
    solucion: "5 V: el multímetro promedia y oculta el rizado."
    comprobar:
      - { V_med: 5, V_pp: 1 }

  - id: que-buscar
    tipo: pregunta
    fase: "Empareje"
    titulo: "Con el osciloscopio en AC"
    texto: "Una cada cosa que se ve en el raíl con lo que indica."
    libro: [185, 186, 187, 188]
    emparejar:
      - ["Rizado a 100 Hz", "Fuente lineal"]
      - ["Picos de conmutación", "Desacoplo insuficiente"]
      - ["Caídas al compás de la actividad", "PDN insuficiente"]
      - ["Oscilación de alta frecuencia", "Regulador inestable"]
    exito: "Un raíl con rizado excesivo produce síntomas que parecen de otra cosa."
    pistas:
      - { texto: "Lo que oscila solo, sin relación con la carga, es el regulador." }
    escalera:
      - "100 Hz es el doble de la red: rectificación."
    solucion: "100 Hz: lineal; picos: desacoplo; caídas sincronizadas: PDN; oscilación: regulador inestable."

  - id: masa-corta
    tipo: pregunta
    titulo: "La masa corta no es opcional"
    texto: "Con el latiguillo largo se ven picos en el raíl; con el muelle de masa, no. ¿Cuál es la medida buena?"
    libro: [190, "cap53#305"]
    widget:
      tipo: figura
      figura: fig-53.14
      zonas:
        - { id: latiguillo, rotulo: "Gráfica de la izquierda", rect: [0, 0, 215, 187] }
        - { id: muelle, rotulo: "Gráfica de la derecha", rect: [225, 0, 217, 187] }
    opciones:
      - texto: "La del muelle: los picos son captación del bucle del latiguillo"
        bien: true
        porque: "Con latiguillo largo se mide sobre todo la captación de la sonda: ruido que no existe."
      - texto: "La del latiguillo: el muelle filtra los picos"
        porque: "El muelle no filtra: deja de formar el bucle que capta la conmutación."
      - texto: "Las dos: los picos son intermitentes"
        porque: "Aparecen siempre con el latiguillo y nunca con el muelle: son de la sonda."
    escalera:
      - "Es el error más frecuente al medir alimentaciones."
    solucion: "La del muelle de masa apoyado en la masa del integrado."

  - id: arranca-a-veces
    tipo: pregunta
    titulo: "Arranca a veces sí y a veces no"
    texto: "Un sistema con varios raíles arranca unas veces y otras no. ¿Qué se sospecha y cómo se ve?"
    libro: [193]
    widget:
      tipo: figura
      figura: fig-53.14
      zonas:
        - { id: latiguillo, rotulo: "Gráfica de la izquierda", rect: [0, 0, 215, 187] }
        - { id: muelle, rotulo: "Gráfica de la derecha", rect: [225, 0, 217, 187] }
    opciones:
      - texto: "La secuencia de arranque: disparo único al encender, un canal por raíl"
        bien: true
        porque: "Muchos integrados exigen un orden; falla según qué regulador llegue antes."
      - texto: "El rizado: el multímetro en continua"
        porque: "El multímetro no ve el orden ni el tiempo en que aparecen los raíles."
      - texto: "Un electrolítico seco: la prueba de diodos"
        porque: "Es una sospecha de otro síntoma, y no se comprueba con la prueba de diodos."
    escalera:
      - "El fallo depende de cuál de los reguladores llega antes."
    solucion: "La secuencia de arranque, en disparo único con un canal por raíl."

  - id: brown-out
    tipo: porque
    titulo: "El brown-out"
    texto: "Al bajar la tensión despacio, el circuito puede pararse limpiamente o comportarse de forma errática. ¿Por qué es peor lo segundo?"
    libro: [197]
    widget:
      tipo: grafica
      x: { id: t, min: 0, max: 0.03, unidad: s, rotulo: "t" }
      y: { min: 4, max: 6, unidad: V, rotulo: "v" }
      curvas:
        - { expr: "V_cc + a_r*sin(2*pi*f_r*t)", color: azul, rotulo: "raíl" }
      lectura: { valor: V_med, rotulo: "Lee el multímetro" }
    opciones:
      - texto: "Un sistema errático hace cosas imprevisibles; uno parado, no"
        bien: true
        porque: "Es lo que evita el supervisor de alimentación: parar limpiamente por debajo de la tensión segura."
      - texto: "Porque consume más"
        porque: "El problema no es el consumo, sino lo que hace mientras no tiene tensión suficiente."
      - texto: "No es peor: sigue funcionando"
        porque: "Funcionar de forma errática es peor que pararse."
    escalera:
      - "¿Qué evita el supervisor de alimentación?"
    solucion: "Lo errático es imprevisible; el supervisor lo evita."

  - id: ordene-raiz
    tipo: pregunta
    fase: "Ordene"
    titulo: "Cuatro medidas por raíl"
    texto: "Ordene la comprobación completa de una alimentación."
    libro: [200, 201, 202, 203]
    ordenar:
      - "Tensión continua en los pines del integrado."
      - "Rizado y ruido en AC con masa corta."
      - "Consumo."
      - "Comportamiento al arrancar, en disparo único."
    exito: "Si alguna no está bien, no merece la pena mirar nada más hasta arreglarla."
    pistas:
      - { texto: "Primero el multímetro, luego el osciloscopio en AC; el arranque, al final." }
    escalera:
      - "El valor continuo va antes que el rizado."
    solucion: "Continua en los pines, rizado con masa corta, consumo y arranque en disparo único."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [176, 179, 183, 190]
    ideas:
      - { titulo: "Lo primero.", texto: "Una alimentación incorrecta explica casi cualquier síntoma." }
      - { titulo: "En la carga.", texto: "En los pines del integrado: el regulador puede estar bien y no llegar." }
      - { titulo: "Dos medidas.", texto: "El multímetro promedia; el osciloscopio en AC ve el rizado." }
      - { titulo: "Masa corta.", texto: "Con latiguillo largo se mide la captación de la sonda." }
