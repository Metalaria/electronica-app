# Lección 1.2 de la sección 55.22 «Diagnóstico por Tipo de Equipo» (cap53; etiqueta interna sec-53.21).
# Formato: contenido/lecciones11/GUIA.md. La figura 55.42 (fig-14.11, 453,6 × 230,4) con una zona por familia y la
# lista universal; las listas de cada familia como preguntas de primer sospechoso; la lista universal como ordenar.
# Sin paso práctico propio: la sección es un catálogo de primeras hipótesis (el método y las medidas están en las
# secciones anteriores y siguientes).
leccion: cap53/sec-53.21

libro:
  694: "orienta la primera hipótesis"
  696: "un raíl con rizado alto produce síntomas que parecen de cualquier otro bloque"
  697: "Culpables por orden: electrolíticos de salida (ESR), resistencia de arranque, optoacoplador y semiconductor de conmutación"
  699: "causa del crujido al girar"
  700: "Un canal sí y otro no es el síntoma más útil que existe"
  703: "produce comportamientos aleatorios que parecen de hardware"
  704: "reprogramar es más rápido que diagnosticar"
  707: "las soldaduras de los relés son una de las averías más comunes de esta familia"
  708: "Los fusibles térmicos disparados son a menudo la consecuencia y no la causa"
  710: "una avería mecánica que se manifiesta como eléctrica"
  713: "iluminando la pantalla con una linterna se ve algo"
  715: "El cable, en el punto donde entra al conector, donde se dobla."
  716: "el síntoma responde a la manipulación"
  719: "Condensadores electrolíticos"
  720: "los cuatro primeros suelen dejar huella visible"
  724: "esa lista personal es más útil que cualquier tabla general"
  725: "Puntos débiles característicos de cada tipo de equipo"

modelo: { valores: {}, calculos: {} }

tarjetas:
  - id: explore-familias
    tipo: explorar
    titulo: "Cada familia falla a su manera"
    texto: "Lo que trabaja cerca del límite falla primero. Toque las familias y la lista universal."
    libro: [694, 696, 697, 725]
    widget:
      tipo: figura
      figura: fig-14.11
      zonas:
        - { id: fuentes, rotulo: "Arriba, a lo ancho", rect: [3, 2, 283, 40], texto: "Fuentes: lo primero que se mira, siempre. Electrolíticos de salida, arranque, optoacoplador y conmutación." }
        - { id: audio, rotulo: "Segunda fila, izquierda", rect: [3, 45, 141, 58], texto: "Audio: salida en corto, electrolíticos, potenciómetros sucios, soldaduras de conectores." }
        - { id: pantallas, rotulo: "Segunda fila, derecha", rect: [145, 45, 141, 58], texto: "Pantallas: la fuente, la retroiluminación y las soldaduras del conector del panel." }
        - { id: motores, rotulo: "Tercera fila, izquierda", rect: [3, 106, 141, 58], texto: "Motores: escobillas, driver en corto, condensador de arranque y rodamientos." }
        - { id: calor, rotulo: "Tercera fila, derecha", rect: [145, 106, 141, 58], texto: "Electrodomésticos: sensores, relés, calefactores; el fusible térmico es la consecuencia." }
        - { id: cables, rotulo: "Cuarta fila, izquierda", rect: [3, 167, 141, 60], texto: "Cables móviles: el cable donde entra al conector, contactos y soldaduras." }
        - { id: micro, rotulo: "Cuarta fila, derecha", rect: [145, 167, 141, 60], texto: "Microcontrolador: alimentación, memoria agotada, cristal en frío, tarjeta SD." }
        - { id: lista, rotulo: "La columna de la derecha", rect: [290, 2, 162, 225], texto: "La lista universal, de más a menos probable: los cuatro primeros dejan huella visible." }
    requiere: { mover: [fuentes, audio, lista] }

  - id: ordene-universal
    tipo: pregunta
    fase: "Ordene"
    titulo: "Sin saber nada del aparato"
    texto: "Ordene los sospechosos de más a menos probable."
    libro: [719]
    ordenar:
      - "Condensadores electrolíticos"
      - "Soldaduras"
      - "Fuente de alimentación en su conjunto"
      - "Conectores y cables móviles"
      - "Semiconductores de potencia"
      - "Componentes mecánicos"
    exito: "Esa lista cubre la enorme mayoría de las averías reales."
    pistas:
      - { texto: "El componente que más envejece va primero; los mecánicos, al final." }
    escalera:
      - "Los electrolíticos se secan con el calor y los años."
    solucion: "Electrolíticos, soldaduras, fuente, conectores y cables, potencia y mecánicos."

  - id: canal-si-no
    tipo: pregunta
    titulo: "Un canal sí y otro no"
    texto: "Un amplificador estéreo suena por un canal y no por el otro. ¿Por qué es una suerte?"
    libro: [700]
    widget:
      tipo: figura
      figura: fig-14.11
      zonas:
        - { id: audio, rotulo: "Segunda fila, izquierda", rect: [3, 45, 141, 58] }
        - { id: lista, rotulo: "La columna de la derecha", rect: [290, 2, 162, 225] }
    opciones:
      - texto: "Midiendo lo mismo en ambos canales se localiza la diferencia"
        bien: true
        porque: "No hace falta entender el circuito: el canal bueno es la referencia."
      - texto: "Descarta la fuente de alimentación"
        porque: "Ayuda, pero lo valioso es tener una referencia idéntica para comparar."
      - texto: "Indica que el fallo es del altavoz"
        porque: "Puede estar en cualquier etapa del canal mudo; la comparación lo localiza."
    escalera:
      - "¿Qué tiene el aparato que sirve de placa de referencia?"
    solucion: "El canal sano es la referencia: medir lo mismo en ambos localiza la diferencia."

  - id: empareje-audio
    tipo: pregunta
    fase: "Empareje"
    titulo: "Síntomas de un equipo de audio"
    texto: "Una cada síntoma con su sospechoso."
    libro: [699, 700]
    emparejar:
      - ["Crujido al girar el mando", "Potenciómetro sucio"]
      - ["Pérdida de graves y zumbido", "Electrolíticos degradados"]
      - ["Fusible fundido", "Etapa de salida en cortocircuito"]
      - ["Distorsión de cruce", "Corriente de reposo desajustada"]
      - ["Se calienta en silencio", "Oscilación"]
    exito: "El procedimiento completo está en la sección 55.27."
    pistas:
      - { texto: "La distorsión de cruce aparece cuando a la etapa AB le falta corriente de reposo." }
    escalera:
      - "El fusible se funde por un corto; el calor sin señal, por algo que oscila."
    solucion: "Crujido: potenciómetro; graves y zumbido: electrolíticos; fusible: salida en corto; cruce: reposo; calor: oscilación."

  - id: pantalla
    tipo: pregunta
    titulo: "Se oye pero no se ve"
    texto: "Un televisor suena, pero la pantalla queda negra. ¿Adónde apunta?"
    libro: [713]
    widget:
      tipo: figura
      figura: fig-14.11
      zonas:
        - { id: pantallas, rotulo: "Segunda fila, derecha", rect: [145, 45, 141, 58] }
        - { id: fuentes, rotulo: "Arriba, a lo ancho", rect: [3, 2, 283, 40] }
    opciones:
      - texto: "A la retroiluminación o su alimentación, no al panel"
        bien: true
        porque: "Con una linterna sobre la pantalla se ve algo: el panel funciona y falta la luz."
      - texto: "Al panel, que hay que cambiar"
        porque: "La linterna lo descarta: si se ve la imagen al iluminarla, el panel está bien."
      - texto: "Al procesador de vídeo"
        porque: "Sin luz no se ve nada aunque la imagen llegue; primero, la retroiluminación."
    escalera:
      - "¿Cómo comprobar que el panel dibuja sin su luz?"
    solucion: "La retroiluminación o su alimentación; la linterna confirma que el panel funciona."

  - id: fusible-termico
    tipo: pregunta
    titulo: "Un fusible térmico disparado"
    texto: "En una lavadora encuentra el fusible térmico disparado. ¿Basta con cambiarlo?"
    libro: [707, 708]
    widget:
      tipo: figura
      figura: fig-14.11
      zonas:
        - { id: calor, rotulo: "Tercera fila, derecha", rect: [145, 106, 141, 58] }
        - { id: motores, rotulo: "Tercera fila, izquierda", rect: [3, 106, 141, 58] }
    opciones:
      - texto: "No: es la consecuencia; hay que averiguar por qué se calentó"
        bien: true
        porque: "Un termostato desajustado o un relé pegado volverán a dispararlo."
      - texto: "Sí: es la avería más común de la familia"
        porque: "Lo más común son las soldaduras de los relés; el fusible térmico suele ser la consecuencia."
      - texto: "Sí, y por uno de más temperatura"
        porque: "Eso quita la protección y deja la causa: el próximo calentamiento hará más daño."
    escalera:
      - "Un fusible térmico salta porque algo se calentó."
    solucion: "No: es la consecuencia; busque por qué se calentó."

  - id: rodamientos
    tipo: pregunta
    titulo: "Un driver que trabaja de más"
    texto: "El driver de un motor se calienta más de lo previsto y el motor gira duro. ¿Qué se sospecha?"
    libro: [710]
    widget:
      tipo: figura
      figura: fig-14.11
      zonas:
        - { id: motores, rotulo: "Tercera fila, izquierda", rect: [3, 106, 141, 58] }
        - { id: calor, rotulo: "Tercera fila, derecha", rect: [145, 106, 141, 58] }
    opciones:
      - texto: "Los rodamientos: una avería mecánica que parece eléctrica"
        bien: true
        porque: "Aumentan el par resistente y el driver trabaja por encima de lo previsto."
      - texto: "El driver, que hay que sustituir"
        porque: "El driver sufre la avería, no la causa: con los rodamientos duros volverá a calentarse."
      - texto: "El condensador de arranque"
        porque: "Es de motores de alterna; aquí el síntoma es el par resistente."
    escalera:
      - "¿Qué hace que un motor necesite más par para girar?"
    solucion: "Los rodamientos: avería mecánica que se manifiesta como eléctrica."

  - id: cargador
    tipo: pregunta
    titulo: "Un cargador caprichoso"
    texto: "El cargador funciona o no según cómo se coloque el cable. ¿Dónde se mira primero?"
    libro: [715, 716]
    widget:
      tipo: figura
      figura: fig-14.11
      zonas:
        - { id: cables, rotulo: "Cuarta fila, izquierda", rect: [3, 167, 141, 60] }
        - { id: fuentes, rotulo: "Arriba, a lo ancho", rect: [3, 2, 283, 40] }
    opciones:
      - texto: "En el cable, donde entra al conector y se dobla"
        bien: true
        porque: "Responde a la manipulación: un intermitente mecánico, a menudo toda la avería."
      - texto: "En los electrolíticos de salida"
        porque: "Envejecen, pero no dependen de cómo se mueva el cable."
      - texto: "En el semiconductor de conmutación"
        porque: "Un fallo suyo no aparece y desaparece al mover el cable."
    escalera:
      - "El síntoma responde a la manipulación: ¿qué parte se mueve?"
    solucion: "El cable donde entra al conector: técnica de presión y vibración."

  - id: micro-aleatorio
    tipo: pregunta
    titulo: "Un aparato con microcontrolador que hace cosas raras"
    texto: "Alimentación, reloj y reset están bien, pero el aparato se comporta de forma aleatoria. ¿Qué es lo más rápido?"
    libro: [703, 704]
    widget:
      tipo: figura
      figura: fig-14.11
      zonas:
        - { id: micro, rotulo: "Cuarta fila, derecha", rect: [145, 167, 141, 60] }
        - { id: cables, rotulo: "Cuarta fila, izquierda", rect: [3, 167, 141, 60] }
    opciones:
      - texto: "Reprogramar el firmware"
        bien: true
        porque: "Muchos fallos son de firmware corrupto o memoria degradada: reprogramar es más rápido que diagnosticar."
      - texto: "Cambiar el microcontrolador"
        porque: "Rara vez es él: una memoria agotada da síntomas que parecen de hardware."
      - texto: "Trazar el esquema completo"
        porque: "Lleva horas; reprogramar descarta el firmware en minutos."
    escalera:
      - "¿Qué falla más en estos equipos que el propio hardware?"
    solucion: "Reprogramar: más rápido que diagnosticar."

  - id: por-que-visual
    tipo: porque
    titulo: "Por qué tantos casos se resuelven mirando"
    texto: "La inspección visual resuelve muchos casos. ¿Por qué?"
    libro: [720]
    widget:
      tipo: figura
      figura: fig-14.11
      zonas:
        - { id: lista, rotulo: "La columna de la derecha", rect: [290, 2, 162, 225] }
        - { id: fuentes, rotulo: "Arriba, a lo ancho", rect: [3, 2, 283, 40] }
    opciones:
      - texto: "Los cuatro sospechosos más probables suelen dejar huella visible"
        bien: true
        porque: "Electrolíticos abombados, soldaduras agrietadas, fuentes quemadas, conectores oxidados."
      - texto: "Porque las averías electrónicas no se pueden medir"
        porque: "Se miden; pero las más frecuentes, además, se ven."
      - texto: "Porque los integrados fallan mucho y se ven quemados"
        porque: "Los integrados de señal son relativamente raros entre las averías."
    escalera:
      - "Mire los cuatro primeros de la lista universal."
    solucion: "Los cuatro primeros de la lista dejan huella visible."

  - id: lista-propia
    tipo: pregunta
    titulo: "La lista que más vale"
    texto: "¿Qué lista de sospechas es más útil para las familias que usted repara?"
    libro: [724]
    widget:
      tipo: figura
      figura: fig-14.11
      zonas:
        - { id: lista, rotulo: "La columna de la derecha", rect: [290, 2, 162, 225] }
        - { id: audio, rotulo: "Segunda fila, izquierda", rect: [3, 45, 141, 58] }
    opciones:
      - texto: "La propia, del cuaderno de averías"
        bien: true
        porque: "Aparato, síntoma, causa y solución: en un año, hecha con los aparatos que de verdad llegan al banco."
      - texto: "La lista universal del libro"
        porque: "Orienta cuando no se sabe nada; la propia está hecha con sus aparatos."
      - texto: "La de un foro de reparación"
        porque: "Es general como cualquier tabla; la propia refleja lo que llega a su banco."
    escalera:
      - "¿Qué datos reflejan los aparatos que usted repara?"
    solucion: "La propia, construida con el cuaderno de averías."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [694, 700, 719, 724]
    ideas:
      - { titulo: "La primera hipótesis.", texto: "Cada familia tiene sus puntos débiles: orientan, no sustituyen al método." }
      - { titulo: "La lista universal.", texto: "Electrolíticos, soldaduras, fuente, conectores, potencia y mecánicos." }
      - { titulo: "Comparar.", texto: "Un canal sí y otro no: el canal sano es la referencia." }
      - { titulo: "La propia.", texto: "El cuaderno de averías construye la lista que más vale." }
