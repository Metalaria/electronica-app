# Lección 1.2 de la sección 55.28 «Un Caso Completo, de Principio a Fin» (cap53; etiqueta interna sec-53.27).
# Formato: contenido/lecciones11/GUIA.md. La figura 55.49 (fig-53.38, 450,7 × 202,3) con zonas; la resistencia de
# arranque como dos de 220 kΩ en serie (esquema `serie`) con la tensión que soportan entre los unos 320 V del primario
# y los unos 13 V del controlador: la fuente del esquema son esos 307 V (el controlador no se dibuja). Paso práctico:
# «simular» la corriente de arranque (unos 700 µA del libro; errores típicos: olvidar los 13 V del controlador, contar
# una sola resistencia). La ESR de la segunda avería, estimada con los 310 mV y los 0,6 A del libro.
leccion: cap53/sec-53.27

libro:
  841: "Una fuente conmutada de 12 V y 2 A de un equipo doméstico, «muerta»"
  842: "la edad apunta a envejecimiento"
  846: "Una lee 220 kΩ; la otra lee OL. Abierta."
  847: "con el controlador a unos 13 V, es de unos 700 µA, con unos 215 mW de disipación repartidos en dos cuerpos"
  848: "Antes hay que comprobar que no hay una segunda avería que la resistencia nueva vaya a alimentar."
  849: "cada una soporta unos 150 V permanentes"
  850: "la bombilla da un destello breve (carga del condensador de primario) y queda apenas encendida"
  852: "para 12 V el límite razonable son 120 mV, el 1 %"
  853: "apunta a una ESR de unos 0,5 Ω en el condensador de salida"
  855: "la verificación completa después de reparar no es un trámite"
  856: "La secuencia de siete pasos del caso completo"
  "cap53#727": "unos 320 V de continua en Europa"
  843: "se verifica con el Brymen que ha bajado de 30 V"

modelo:
  valores:
    V_p: { sim: "V_{prim}", nombre: "tensión del condensador de primario", unidad: V, valor: 320 }
    V_cc: { sim: "V_{CC}", nombre: "tensión del controlador", unidad: V, valor: 13 }
    R_a1: { sim: "R_{a1}", nombre: "primera resistencia de arranque", unidad: Ω, valor: 220000 }
    R_a2: { sim: "R_{a2}", nombre: "segunda resistencia de arranque", unidad: Ω, valor: 220000 }
    V_rz: { sim: "V_{rizado}", nombre: "rizado de salida medido", unidad: V, valor: 0.31 }
    I_rz: { sim: "I_{rizado}", nombre: "rizado de corriente en la bobina", unidad: A, valor: 0.6 }
    V_out: { sim: "V_{salida}", nombre: "salida de la fuente", unidad: V, valor: 12 }
    R_pr: { sim: "R_{prueba}", nombre: "carga de prueba", unidad: Ω, valor: 6 }
  calculos:
    V_ra: { expr: "V_p - V_cc", sim: "V_{arranque}", nombre: "tensión sobre la resistencia de arranque", unidad: V }
    I_a: { expr: "V_ra/(R_a1 + R_a2)", sim: "I", nombre: "corriente de arranque", unidad: A }
    V_a1: { expr: "I_a*R_a1", sim: "V₁", nombre: "tensión en la primera", unidad: V }
    V_a2: { expr: "I_a*R_a2", sim: "V₂", nombre: "tensión en la segunda", unidad: V }
    P_a: { expr: "I_a^2*(R_a1 + R_a2)", sim: "P", nombre: "disipación de las dos", unidad: W }
    I_sin13: { expr: "V_p/(R_a1 + R_a2)", sim: "I", nombre: "corriente olvidando el controlador", unidad: A }
    I_una: { expr: "V_ra/R_a1", sim: "I", nombre: "corriente con una sola resistencia", unidad: A }
    ESR: { expr: "V_rz/I_rz", sim: "ESR", nombre: "resistencia serie equivalente estimada", unidad: Ω }
    I_pr: { expr: "V_out/R_pr", sim: "I", nombre: "corriente de la carga de prueba", unidad: A }
    P_pr: { expr: "V_out^2/R_pr", sim: "P", nombre: "potencia en la carga de prueba", unidad: W }
    V_sq: { expr: "V_out^2", sim: "V²", nombre: "tensión al cuadrado", unidad: "" }
    R_tot: { expr: "R_a1 + R_a2", sim: "R", nombre: "las dos en serie", unidad: Ω }

tarjetas:
  - id: explore-caso
    tipo: explorar
    titulo: "Una fuente muerta, de principio a fin"
    texto: "Una fuente conmutada de 12 V y 2 A, muerta. Siga los siete pasos del capítulo: toque las filas."
    libro: [841, 842, 843, 846, 856]
    widget:
      tipo: figura
      figura: fig-53.38
      zonas:
        - { id: sintoma, rotulo: "Filas uno y dos", rect: [4, 15, 444, 40], texto: "Fallo permanente tras años: envejecimiento. Descarga con 1 kΩ y 5 W; comprobar que baja de 30 V." }
        - { id: inspeccion, rotulo: "Filas tres y cuatro", rect: [4, 55, 444, 38], texto: "Resistencia de arranque oscurecida, anotada sin concluir. De las dos de 220 kΩ, una lee OL." }
        - { id: hipotesis, rotulo: "Filas cinco y seis", rect: [4, 93, 444, 37], texto: "Explica el síntoma; el condensador de arranque está bien. Se cambian las dos y arranca: 12,08 V." }
        - { id: verificar, rotulo: "Fila siete y el recuadro de abajo", rect: [4, 128, 444, 70], texto: "Verificar todo: 310 mV de rizado, con un límite de 120 mV. Condensador seco: la segunda avería." }
    requiere: { mover: [sintoma, inspeccion, hipotesis, verificar] }

  - id: ordene-pasos
    tipo: pregunta
    fase: "Ordene"
    titulo: "Los siete pasos"
    texto: "Ordene los pasos del caso, tal como se aplicaron."
    libro: [856]
    ordenar:
      - "Recoger el síntoma"
      - "Seguridad: descargar y verificar"
      - "Inspección"
      - "Medidas sin alimentar"
      - "Hipótesis y segunda comprobación"
      - "Reparar y encender con la lámpara"
      - "Verificar todo"
    exito: "El último paso valió más que el diagnóstico: encontró la segunda avería."
    pistas:
      - { texto: "Antes de tocar nada, la seguridad; antes de medir, mirar." }
    escalera:
      - "Nada se alimenta hasta haber reparado lo encontrado en frío."
    solucion: "Síntoma, seguridad, inspección, medidas en frío, hipótesis, reparar y encender, verificar."

  - id: simule-arranque
    tipo: simular
    titulo: "La corriente de arranque"
    texto: "Las dos resistencias de 220 kΩ, entre los unos 320 V del primario y los unos 13 V del controlador. ¿Qué corriente las recorre?"
    libro: ["cap53#727", 847]
    fijar: { V_p: 320, V_cc: 13, R_a1: 220000, R_a2: 220000 }
    widget:
      tipo: circuito
      esquema: serie
      piezas: { fuente: V_ra, r1: R_a1, r2: R_a2 }
      lectura: { valor: I_a, rotulo: "Corriente de arranque" }
      mide: { corriente: I_a, v1: V_a1, v2: V_a2 }
      ocultar: true
      mandos: []
    simular:
      objetivo: I_a
      unidad: A
      tol: 0.03
      rotulo: "Corriente de arranque, I"
      medida: corriente
      errores:
        - { expr: "I_sin13", texto: "Ha usado los 320 V enteros: el controlador está a unos 13 V, que hay que restar." }
        - { expr: "I_una", texto: "Ha contado una sola resistencia: son dos de 220 kΩ en serie, 440 kΩ." }
    exito: "Unos 700 µA, con unos 215 mW repartidos en dos cuerpos: envejecimiento, no sobrecarga."
    escalera:
      - "Sobre las resistencias queda la diferencia entre el primario y el controlador."
      - "Las dos en serie suman 440 kΩ."
    solucion: "(320 − 13) V / 440 kΩ = 698 µA."
    comprobar:
      - { I_a: 0.000698, V_ra: 307, P_a: 0.214, V_a1: 153.5, R_tot: 440000, tol: 0.003 }

  - id: margen-tension
    tipo: pregunta
    titulo: "El repuesto con margen"
    texto: "Cada resistencia soporta unos 150 V permanentes, y una de 1/4 W admite de 200 a 250 V. ¿Qué pone?"
    libro: [849]
    fijar: { V_p: 320, V_cc: 13, R_a1: 220000, R_a2: 220000 }
    widget:
      tipo: circuito
      esquema: serie
      piezas: { fuente: V_ra, r1: R_a1, r2: R_a2 }
      lectura: { valor: V_a1, rotulo: "Tensión en cada resistencia" }
      mide: { corriente: I_a, v1: V_a1, v2: V_a2 }
      mandos: []
    opciones:
      - texto: "Dos de 220 kΩ y 1/2 W, con 350 V o más"
        bien: true
        porque: "Cabe en una de 1/4 W, pero con poco margen y durante años: justo lo que envejeció a la original."
      - texto: "Las mismas de 1/4 W"
        porque: "Caben, pero con poco margen durante años: volverían a abrirse."
      - texto: "Solo la abierta, de 1/2 W"
        porque: "La que aún mide bien ha sufrido lo mismo: se cambian las dos."
    escalera:
      - "¿Qué envejeció a la original: la potencia o la tensión de años?"
    solucion: "Las dos, de 1/2 W y 350 V o más de tensión de trabajo."
    comprobar:
      - { V_a1: 153.5, tol: 0.003 }

  - id: segunda-averia
    tipo: porque
    titulo: "No se cambia todavía"
    texto: "La resistencia abierta explica el síntoma por completo. ¿Por qué medir antes el condensador de arranque?"
    libro: [848]
    widget:
      tipo: figura
      figura: fig-53.38
      zonas:
        - { id: hipotesis, rotulo: "Filas cinco y seis", rect: [4, 93, 444, 37] }
        - { id: inspeccion, rotulo: "Filas tres y cuatro", rect: [4, 55, 444, 38] }
    opciones:
      - texto: "Para no alimentar una segunda avería con la resistencia nueva"
        bien: true
        porque: "47 µF que leen 44 µF: aceptable. Ahora sí se repara."
      - texto: "Porque la resistencia no explica el síntoma"
        porque: "Lo explica por completo; la duda es si hay otra avería detrás."
      - texto: "Por costumbre: no aporta nada"
        porque: "Una segunda avería destruiría la reparación en el primer encendido."
    escalera:
      - "¿Qué alimentará la resistencia nueva en cuanto se encienda?"
    solucion: "Para descartar una segunda avería que la resistencia nueva fuera a alimentar."

  - id: lampara
    tipo: pregunta
    titulo: "El primer encendido"
    texto: "Con la lámpara de 60 W en serie, al enchufar da un destello breve y queda apenas encendida. ¿Qué significa?"
    libro: [850]
    widget:
      tipo: figura
      figura: fig-53.38
      zonas:
        - { id: hipotesis, rotulo: "Filas cinco y seis", rect: [4, 93, 444, 37] }
        - { id: verificar, rotulo: "Fila siete y el recuadro de abajo", rect: [4, 128, 444, 70] }
    opciones:
      - texto: "Buena señal: el destello es la carga del condensador de primario"
        bien: true
        porque: "Después la fuente consume poco: la bombilla queda apenas encendida."
      - texto: "Hay un cortocircuito en el primario"
        porque: "Entonces la lámpara luciría a plena potencia y se quedaría así."
      - texto: "La lámpara es demasiado pequeña"
        porque: "La de 60 W es la adecuada; el destello es la carga del condensador."
    escalera:
      - "¿Qué consume corriente un instante al enchufar?"
    solucion: "Buena señal: destello de carga y consumo bajo."

  - id: carga-prueba
    tipo: pregunta
    titulo: "Verificar con 2 A"
    texto: "Para probar la salida de 12 V a 2 A usa una resistencia de 6 Ω. ¿Por qué de 50 W y sobre disipador?"
    libro: [852]
    fijar: { V_out: 12, R_pr: 6 }
    widget:
      tipo: figura
      figura: fig-53.38
      zonas:
        - { id: verificar, rotulo: "Fila siete y el recuadro de abajo", rect: [4, 128, 444, 70] }
    opciones:
      - texto: "Porque disipa 24 W"
        bien: true
        porque: "12 V por 2 A: 24 W, que una resistencia pequeña no aguanta."
      - texto: "Porque disipa 2 W"
        porque: "Eso es la corriente leída como potencia: 12 V · 2 A son 24 W."
      - texto: "Porque disipa 144 W"
        porque: "Es V² sin dividir entre R: 144 / 6 = 24 W."
    escalera:
      - "P = V · I, o V²/R."
    solucion: "12 V · 2 A = 24 W."
    comprobar:
      - { P_pr: 24, I_pr: 2, V_sq: 144 }

  - id: estime-esr
    tipo: pregunta
    fase: "Estime"
    titulo: "La segunda avería"
    texto: "La verificación da 310 mV de rizado con unos 0,6 A de rizado de corriente en la bobina. Estime la ESR del condensador de salida."
    libro: [852, 853]
    fijar: { V_rz: 0.31, I_rz: 0.6 }
    widget:
      tipo: figura
      figura: fig-53.38
      zonas:
        - { id: verificar, rotulo: "Fila siete y el recuadro de abajo", rect: [4, 128, 444, 70] }
    estimar:
      objetivo: "ESR"
      unidad: Ω
      min: 0
      max: 2
      paso: 0.01
      inicio: 1.5
      tol: 0.05
      rotulo: "ESR = ΔV / ΔI"
    exito: "Unos 0,5 Ω, cuando uno sano de 1000 µF debería estar por debajo de 0,1 Ω: está seco."
    pistas:
      - { cuando: { valor: estimacion, mayor: 0.543 }, texto: "Se ha pasado: 0,31 V entre 0,6 A es algo más de medio ohmio, no mucho más." }
      - { texto: "Se ha quedado corto: divida el rizado de tensión entre el de corriente." }
    escalera:
      - "El rizado de tensión es el de corriente por la ESR."
    solucion: "0,31 V / 0,6 A ≈ 0,5 Ω."
    comprobar:
      - { ESR: 0.517 }

  - id: leccion-verificar
    tipo: porque
    titulo: "Lo que valió más que el diagnóstico"
    texto: "La fuente ya daba 12,08 V. ¿Por qué medir todavía el rizado?"
    libro: [853, 855]
    widget:
      tipo: figura
      figura: fig-53.38
      zonas:
        - { id: verificar, rotulo: "Fila siete y el recuadro de abajo", rect: [4, 128, 444, 70] }
    opciones:
      - texto: "Porque el condensador seco mide bien de capacidad y solo el rizado lo delata"
        bien: true
        porque: "La avería silenciosa habría reventado el equipo en unos meses."
      - texto: "Por cumplir el procedimiento"
        porque: "No es un trámite: aquí encontró la segunda avería."
      - texto: "Porque 12,08 V es demasiado"
        porque: "Es una salida correcta; el problema estaba en el rizado."
    escalera:
      - "¿Qué medida delata un electrolítico con la capacidad correcta y la ESR alta?"
    solucion: "Solo el rizado delata el condensador seco: la verificación no es un trámite."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [847, 848, 853, 855]
    ideas:
      - { titulo: "El método.", texto: "Síntoma, seguridad, inspección, medidas en frío, hipótesis, reparar, verificar." }
      - { titulo: "La causa.", texto: "Resistencia de arranque abierta por envejecimiento: unos 700 µA durante años." }
      - { titulo: "La segunda avería.", texto: "Se busca antes de reparar y se encuentra al verificar." }
      - { titulo: "Verificar.", texto: "El rizado delató el condensador seco: no es un trámite." }
