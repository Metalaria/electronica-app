# Lección 1.2 de la sección 55.21 «Transformadores, Bobinas y Cristales» (cap53; etiqueta interna sec-53.20).
# Formato: contenido/lecciones11/GUIA.md. La figura 55.41 (fig-53.30, 450,7 × 198,7) con zonas; la constante de tiempo
# de una bobina con `carga-rl` y la resonancia con un condensador conocido con `rlc-paralelo` (bloque 686: «en paralelo
# con un condensador conocido, se barre la frecuencia hasta el máximo de amplitud»). Paso práctico: «ajuste» de la
# frecuencia del generador hasta el máximo (98 % del pico) y «banco» con la ficha 36 del cuaderno. Los valores (bobina
# de 10 mH, 100 nF, 1 kΩ desde el generador, pérdidas de 10 kΩ, 1 V) son de ejemplo, como los de la ficha 36.
leccion: cap53/sec-53.20

libro:
  681: "Son los componentes que peor se dejan medir con un multímetro"
  683: "Un transformador sano en vacío apenas calienta"
  684: "La resistencia del bobinado apenas cambia"
  686: "se barre la frecuencia hasta el máximo de amplitud y se calcula L = 1/(4π²f²C)"
  687: "La saturación no se ve sin corriente."
  689: "Un cristal no se puede medir en continua: es un abierto y siempre lo será."
  690: "conviene medir en una salida bufferizada del oscilador"
  691: "Cómo comprobar transformadores, bobinas y cristales"

modelo:
  valores:
    V_g: { sim: "V", nombre: "amplitud del generador", unidad: V, valor: 1 }
    R_b: { sim: "R", nombre: "resistencia en serie", unidad: Ω, valor: 100 }
    L_b: { sim: "L", nombre: "inductancia de la bobina", unidad: H, valor: 0.01 }
    f_g: { sim: "f", nombre: "frecuencia del generador", unidad: Hz, valor: 2000 }
    R_gs: { sim: "R_{s}", nombre: "resistencia desde el generador", unidad: Ω, valor: 1000 }
    C_k: { sim: "C", nombre: "condensador conocido", unidad: F, valor: 100e-9 }
    R_pp: { sim: "R_{p}", nombre: "pérdidas del tanque", unidad: Ω, valor: 10000 }
  calculos:
    tau_b: { expr: "L_b/R_b", sim: "τ", nombre: "constante de tiempo", unidad: s }
    I_bf: { expr: "V_g/R_b", sim: "I_{final}", nombre: "corriente final", unidad: A }
    f_0: { expr: "1/(2*pi*sqrt(L_b*C_k))", sim: "f₀", nombre: "frecuencia de resonancia", unidad: Hz }
    A_t: { expr: "V_g/sqrt((1 + R_gs/R_pp)^2 + (R_gs*(2*pi*f_g*C_k - 1/(2*pi*f_g*L_b)))^2)", sim: "V_{t}", nombre: "amplitud en el tanque", unidad: V }
    L_de: { expr: "1/(4*pi^2*f_g^2*C_k)", sim: "L", nombre: "inductancia deducida", unidad: H }
    k_4: { expr: "4*pi^2", sim: "4π²", nombre: "cuatro pi al cuadrado", unidad: "", cifras: 3 }
    f_cuad: { expr: "f_g^2/1000000", sim: "f²", nombre: "frecuencia al cuadrado, en millones", unidad: "", cifras: 3 }

tarjetas:
  - id: explore-mapa
    tipo: explorar
    titulo: "Lo que el multímetro no ve"
    texto: "Transformadores, bobinas y cristales se dejan medir mal con el multímetro. Toque los cuatro cuadros."
    libro: [681, 691]
    widget:
      tipo: figura
      figura: fig-53.30
      zonas:
        - { id: transformador, rotulo: "Arriba a la izquierda", rect: [4, 4, 145, 118], texto: "Continuidad, aislamiento, relación de tensiones y corriente de vacío." }
        - { id: bobina, rotulo: "Arriba en el centro", rect: [153, 4, 146, 118], texto: "La inductancia, por resonancia o por τ = L/R; la saturación, solo con carga." }
        - { id: cristal, rotulo: "Arriba a la derecha", rect: [302, 4, 145, 118], texto: "En continua es un abierto: hay que verlo oscilar con la sonda ×10." }
        - { id: espiras, rotulo: "Abajo, a todo lo ancho", rect: [4, 127, 443, 68], texto: "Unas espiras en corto apenas cambian la resistencia, pero forman un secundario cortocircuitado." }
    requiere: { mover: [transformador, bobina, cristal, espiras] }

  - id: empareje-transformador
    tipo: pregunta
    fase: "Empareje"
    titulo: "Las comprobaciones de un transformador"
    texto: "Una cada comprobación con lo que indica."
    libro: [683]
    emparejar:
      - ["Continuidad de cada bobinado", "Un abierto es concluyente"]
      - ["Aislamiento primario-secundario", "Debe ser infinito"]
      - ["Relación de espiras", "La relación de tensiones"]
      - ["Corriente de vacío a tensión reducida", "Anormalmente alta: cortocircuito interno"]
      - ["Calentamiento en vacío", "Sano, apenas calienta"]
    exito: "Las tres primeras con el Brymen y el generador; las dos últimas cazan las espiras en corto."
    pistas:
      - { texto: "El aislamiento entre bobinados se mide con el óhmetro en escala alta." }
    escalera:
      - "Un transformador sano en vacío apenas consume ni calienta."
    solucion: "Continuidad: abierto; aislamiento: infinito; espiras: relación de tensiones; vacío: corriente alta; calor: apenas."

  - id: espiras-corto
    tipo: pregunta
    titulo: "Unas pocas espiras en corto"
    texto: "La resistencia del bobinado mide lo de siempre, pero el transformador se calienta en vacío. ¿Cómo se confirma?"
    libro: [684]
    widget:
      tipo: figura
      figura: fig-53.30
      zonas:
        - { id: espiras, rotulo: "Abajo, a todo lo ancho", rect: [4, 127, 443, 68] }
        - { id: transformador, rotulo: "Arriba a la izquierda", rect: [4, 4, 145, 118] }
    opciones:
      - texto: "Corriente de vacío, o relación de tensiones con el generador"
        bien: true
        porque: "Las espiras forman un secundario en corto: consume mucho en vacío y la relación sale muy por debajo."
      - texto: "Midiendo la resistencia con más resolución"
        porque: "Son unas espiras entre cientos: la resistencia apenas cambia, el multímetro no lo ve."
      - texto: "Con el aislamiento primario-secundario"
        porque: "El corto es entre espiras del mismo bobinado: el aislamiento entre bobinados sigue infinito."
    escalera:
      - "¿Qué hace un secundario en cortocircuito con la corriente del primario?"
    solucion: "Midiendo la corriente de vacío, o la relación de tensiones con el generador."

  - id: explore-tau
    tipo: explorar
    titulo: "Una bobina por su constante de tiempo"
    texto: "Cuadrada lenta del generador sobre la bobina con una resistencia en serie: τ = L/R. Cambie la bobina."
    libro: [686]
    widget:
      tipo: circuito
      esquema: carga-rl
      piezas: { fuente: V_g, r: R_b, l: L_b }
      lectura: { valor: tau_b, rotulo: "Constante de tiempo" }
      grafica:
        x: { id: t, min: 0, max: 0.001, unidad: s, rotulo: "t" }
        y: { min: 0, max: 0.012, unidad: A, rotulo: "i" }
        curvas:
          - { expr: "I_bf*(1 - exp(-t/tau_b))", color: naranja, rotulo: "i(t)", mide: i }
        marcas:
          - { x: "tau_b", y: "I_bf*(1 - exp(-1))", rotulo: "τ" }
      mandos:
        - { valor: L_b, lista: [0.0047, 0.01, 0.022] }

  - id: ajuste-resonancia
    tipo: ajuste
    titulo: "Barra hasta el máximo"
    texto: "La bobina, en paralelo con un condensador conocido de 100 nF. Mueva la frecuencia del generador hasta el máximo de amplitud."
    libro: [686]
    fijar: { V_g: 1, R_gs: 1000, L_b: 0.01, C_k: 100e-9, R_pp: 10000 }
    inicio: { f_g: 2000 }
    widget:
      tipo: circuito
      esquema: rlc-paralelo
      piezas: { fuente: V_g, f: f_g, rs: R_gs, l: L_b, c: C_k, r: R_pp }
      lectura: { valor: A_t, rotulo: "Amplitud en el tanque" }
      mide: { vt_amp: A_t }
      mandos:
        - { valor: f_g, min: 1000, max: 20000, paso: 50, rotulo: "Frecuencia del generador" }
    ajuste:
      valor: A_t
      min: 0.89
      max: 0.95
      rotulo: "Amplitud en el tanque"
      escala: { min: 0, max: 1 }
      bajo: "Aún no es el máximo: siga barriendo la frecuencia, hacia arriba o hacia abajo."
      alto: "Más que el máximo posible: revise el montaje."
      dentro: "En el máximo: anote esa frecuencia."
    comprobar:
      - { con: { f_g: 5050 }, A_t: 0.909, tol: 0.002 }

  - id: estime-l
    tipo: pregunta
    fase: "Estime"
    titulo: "La inductancia, de la resonancia"
    texto: "El máximo sale en 5 033 Hz con el condensador de 100 nF. ¿Cuánto vale L?"
    libro: [686]
    fijar: { f_g: 5033, C_k: 100e-9 }
    widget:
      tipo: figura
      figura: fig-53.30
      zonas:
        - { id: bobina, rotulo: "Arriba en el centro", rect: [153, 4, 146, 118] }
    estimar:
      objetivo: "L_de"
      unidad: H
      min: 0
      max: 0.05
      paso: 0.0005
      inicio: 0.04
      tol: 0.05
      rotulo: "L = 1/(4π²f²C)"
    exito: "10 mH: una bobina de milihenrios, al alcance del generador."
    pistas:
      - { cuando: { valor: estimacion, mayor: 0.0105 }, texto: "Se ha pasado: con f al cuadrado en el denominador, sale una centésima de henrio." }
      - { texto: "Se ha quedado corto: revise los exponentes de f² y de C." }
    escalera:
      - "4π² vale unos {{k_4}}; f² son unos {{f_cuad}} millones."
    solucion: "1 / ({{k_4}} · 5033² · 100 nF) = 10 mH."
    comprobar:
      - { L_de: 0.01, k_4: 39.48, f_cuad: 25.33, tol: 0.005 }
      - { con: { f_g: 1 }, L_de: 253303, tol: 0.01 }

  - id: microhenrios
    tipo: pregunta
    titulo: "El techo de 50 kHz"
    texto: "Con el generador limitado a 50 kHz, ¿qué bobinas se miden por resonancia?"
    libro: [686]
    widget:
      tipo: figura
      figura: fig-53.30
      zonas:
        - { id: bobina, rotulo: "Arriba en el centro", rect: [153, 4, 146, 118] }
        - { id: cristal, rotulo: "Arriba a la derecha", rect: [302, 4, 145, 118] }
    opciones:
      - texto: "Las de milihenrios"
        bien: true
        porque: "Resuenan dentro del alcance; para microhenrios haría falta más frecuencia."
      - texto: "Las de microhenrios"
        porque: "Con una L pequeña la resonancia sube por encima de 50 kHz."
      - texto: "Cualquiera, cambiando el condensador"
        porque: "Hay un límite práctico: con microhenrios la frecuencia se escapa del generador."
    escalera:
      - "Menos inductancia, más frecuencia de resonancia."
    solucion: "Las de milihenrios; para microhenrios hace falta más frecuencia."

  - id: saturacion
    tipo: pregunta
    titulo: "Una bobina que mide bien"
    texto: "La bobina da su inductancia en vacío, pero el aparato falla con carga. ¿Cómo se busca la saturación?"
    libro: [687]
    widget:
      tipo: figura
      figura: fig-53.30
      zonas:
        - { id: bobina, rotulo: "Arriba en el centro", rect: [153, 4, 146, 118] }
        - { id: transformador, rotulo: "Arriba a la izquierda", rect: [4, 4, 145, 118] }
    opciones:
      - texto: "Con carga, mirando su corriente con el shunt"
        bien: true
        porque: "La saturación no se ve sin corriente: en funcionamiento, la corriente se dobla hacia arriba en los picos."
      - texto: "Repitiendo la resonancia con más amplitud"
        porque: "El generador no da la corriente de trabajo: la bobina seguirá sin saturar."
      - texto: "Midiendo su resistencia en continua"
        porque: "La resistencia no cambia con la saturación: hay que ver la corriente con carga."
    escalera:
      - "¿Qué hace falta que circule para que el núcleo se sature?"
    solucion: "Con carga y el shunt de la sección 55.18: la corriente se dobla en los picos."

  - id: cristal
    tipo: porque
    titulo: "Un cristal en el óhmetro"
    texto: "El óhmetro marca OL en un cristal. ¿Por qué esa lectura no concluye nada?"
    libro: [689]
    widget:
      tipo: figura
      figura: fig-53.30
      zonas:
        - { id: cristal, rotulo: "Arriba a la derecha", rect: [302, 4, 145, 118] }
        - { id: bobina, rotulo: "Arriba en el centro", rect: [153, 4, 146, 118] }
    opciones:
      - texto: "En continua es un abierto, sano o roto"
        bien: true
        porque: "La única comprobación válida es verlo oscilar en su circuito con la sonda ×10."
      - texto: "Porque el óhmetro no llega a megaohmios"
        porque: "Sí llega: el cristal no conduce nada en continua, ni sano ni roto."
      - texto: "Porque OL indica que está bien"
        porque: "Uno que no oscila marca lo mismo: OL no distingue."
    escalera:
      - "¿Conduce un cristal en continua cuando está sano?"
    solucion: "Nada: hay que verlo oscilar con la sonda ×10."

  - id: ordene-sospecha
    tipo: pregunta
    fase: "Ordene"
    titulo: "No oscila: el orden de sospecha"
    texto: "Un oscilador de cristal no arranca. Ordene los sospechosos como el libro."
    libro: [689]
    ordenar:
      - "El cristal"
      - "Los condensadores de carga"
      - "El circuito activo"
    exito: "Y los condensadores deben corresponder a la capacidad de carga del cristal."
    pistas:
      - { texto: "Empiece por el que más falla de los tres." }
    escalera:
      - "Del componente más delicado al circuito que lo hace oscilar."
    solucion: "Cristal, condensadores de carga y circuito activo."

  - id: sonda-desplaza
    tipo: pregunta
    titulo: "Leer la frecuencia con exactitud"
    texto: "La sonda añade capacidad y desplaza la frecuencia mientras mide. ¿Dónde se mide para leerla exacta?"
    libro: [690]
    widget:
      tipo: figura
      figura: fig-53.30
      zonas:
        - { id: cristal, rotulo: "Arriba a la derecha", rect: [302, 4, 145, 118] }
        - { id: espiras, rotulo: "Abajo, a todo lo ancho", rect: [4, 127, 443, 68] }
    opciones:
      - texto: "En una salida bufferizada del oscilador"
        bien: true
        porque: "El buffer separa la sonda del cristal: su capacidad ya no tira de la frecuencia."
      - texto: "Sobre el propio cristal, con la ×1"
        porque: "La ×1 carga tanto que puede pararlo; y sobre el cristal desplaza la frecuencia."
      - texto: "Sobre el cristal, con el latiguillo largo"
        porque: "El latiguillo no cambia la capacidad que la sonda añade al cristal."
    escalera:
      - "¿Dónde no le afecta al cristal la capacidad de la sonda?"
    solucion: "En una salida bufferizada, no en el propio cristal."

  - id: banco-resonancia
    tipo: banco
    titulo: "Mida una bobina por resonancia"
    texto: "Bobina de 10 mH en paralelo con 100 nF, alimentados desde el generador a través de 1 kΩ. Busque el máximo de amplitud."
    libro: [686]
    fijar: { L_b: 0.01, C_k: 100e-9, R_gs: 1000 }
    banco:
      piezas: ["Bobina de 10 mH", "Condensador de 100 nF medido con el Brymen", "R = 1 kΩ", "Generador y osciloscopio del FNIRSI"]
      medir: "La frecuencia del máximo de amplitud en el tanque."
      esperado: f_0
      unidad: Hz
      tol: 0.1
      consejos:
        - { cuando: { valor: desviacion, mayor: 0.1 }, texto: "Sale alta: ¿la bobina tiene menos inductancia de la marcada? Calcúlela con su frecuencia." }
        - { texto: "Sale baja: la sonda y los cables añaden capacidad; o la bobina tiene más inductancia." }
      ficha: { n: 36, titulo: "Práctica 12 · Medir L y C sin medidor LCR" }
    comprobar:
      - { f_0: 5033, tol: 0.002 }

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [684, 686, 687, 689]
    ideas:
      - { titulo: "Transformadores.", texto: "Las espiras en corto no se ven en ohmios: corriente de vacío y relación de tensiones." }
      - { titulo: "Bobinas.", texto: "Resonancia con un C conocido: L = 1/(4π²f²C), hasta milihenrios con 50 kHz." }
      - { titulo: "Saturación.", texto: "Solo con carga y corriente: el shunt." }
      - { titulo: "Cristales.", texto: "Verlos oscilar con la sonda ×10, mejor en una salida bufferizada." }
