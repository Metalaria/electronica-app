# Lección 1.2 de la sección 55.10 «La Cámara Térmica y la Detección de Puntos Calientes» (cap53; etiqueta interna
# sec-14.8). Formato: contenido/lecciones11/GUIA.md. La lectura de la cámara (ajustada a ε = 0,95, entorno a 25 °C)
# frente a la temperatura real, con la ley de Stefan-Boltzmann: la radiación que recibe es ε·T⁴ + (1 − ε)·T_a⁴ y la
# cámara la convierte suponiendo 0,95 (temperaturas en kelvin). Da los valores de la figura 55.23 (29,6 °C con 0,05;
# 34 °C con 0,10; 81,9 °C con 0,80; la figura los trunca a 29, 34 y 81) y los «unos 30 °C» del bloque 353. El modelo
# es mío; la figura y el texto, del libro. Sin paso práctico propio (la sección es de criterio).
leccion: cap53/sec-14.8

libro:
  341: "Casi todo fallo en electrónica se manifiesta como calor"
  344: "no sirve por encima de unos 50 °C"
  348: "la medida más útil no es la absoluta sino la diferencial, componente frente a ambiente"
  350: "localiza el punto más caliente entre cientos"
  352: "Aluminio pulido"
  353: "Con emisividad 0,05, un disipador de aluminio a 90 °C puede leerse como si estuviera a unos 30 °C"
  355: "un componente 20 °C por encima de sus vecinos merece investigación; 40 °C es una avería casi segura"
  356: "un regulador frío en un circuito que debería consumir significa que no está entregando corriente"
  357: "una imagen al encender y otra a los cinco minutos"
  360: "el componente en cortocircuito se calienta y aparece en la cámara en segundos"
  362: "el termopar apoyado en cada uno resuelve la duda"
  364: "imagen térmica a los treinta segundos y a los cinco minutos del encendido"
  365: "La emisividad de cada superficie y el error que introduce en una medida térmica."

modelo:
  valores:
    T_o: { sim: "T", nombre: "temperatura real del objeto", unidad: "°C", valor: 90 }
    T_a: { sim: "T_{a}", nombre: "temperatura del entorno", unidad: "°C", valor: 25 }
    eps: { sim: "ε", nombre: "emisividad de la superficie", unidad: "", valor: 0.05 }
    eps_c: { sim: "ε_{cám}", nombre: "emisividad que supone la cámara", unidad: "", valor: 0.95 }
  calculos:
    T_r: { expr: "((eps*(T_o + 273.15)^4 + (1 - eps)*(T_a + 273.15)^4 - (1 - eps_c)*(T_a + 273.15)^4)/eps_c)^0.25 - 273.15", sim: "T_{lee}", nombre: "lo que lee la cámara", unidad: "°C" }

tarjetas:
  - id: explore-emisividad
    tipo: explorar
    titulo: "La emisividad"
    texto: "La cámara mide radiación y supone una emisividad de 0,95. Cambie la superficie y compare lo que lee con la temperatura real."
    libro: [352, 365]
    fijar: { T_a: 25, eps_c: 0.95 }
    widget:
      tipo: grafica
      x: { id: tx, min: 25, max: 120, unidad: "°C", rotulo: "temperatura real" }
      y: { min: 20, max: 120, unidad: "°C", rotulo: "lee la cámara" }
      curvas:
        - { expr: "((eps*(tx + 273.15)^4 + (1 - eps)*(T_a + 273.15)^4 - (1 - eps_c)*(T_a + 273.15)^4)/eps_c)^0.25 - 273.15", color: naranja, rotulo: "lectura" }
        - { expr: "tx", color: tinta, rotulo: "lectura exacta", discontinua: true }
      marcas:
        - { x: "T_o", y: "T_r", rotulo: "{{T_r}}" }
      lectura: { valor: T_r, rotulo: "Un objeto a 90 °C se lee a" }
      mandos:
        - { valor: eps, lista: [0.05, 0.1, 0.8, 0.95], nombres: [aluminio pulido, estaño brillante, acero oxidado, cinta mate], rotulo: "Superficie" }
    requiere: { mover: [eps] }

  - id: prediga-disipador
    tipo: predecir
    titulo: "Un disipador de aluminio pulido"
    texto: "Un disipador de aluminio pulido está a 90 °C, en un entorno a 25 °C. ¿Qué lee la cámara?"
    libro: [352, 353]
    fijar: { T_o: 90, T_a: 25, eps: 0.05, eps_c: 0.95 }
    widget:
      tipo: grafica
      x: { id: tx, min: 25, max: 120, unidad: "°C", rotulo: "temperatura real" }
      y: { min: 20, max: 120, unidad: "°C", rotulo: "lee la cámara" }
      curvas:
        - { expr: "tx", color: tinta, rotulo: "lectura exacta", discontinua: true }
      lectura: { valor: T_r, rotulo: "Lee la cámara" }
      ocultar: true
    opciones:
      - texto: "Unos 30 °C: casi la temperatura del entorno"
        bien: true
        porque: "Con 0,05 la ve casi como un espejo: mide el reflejo del entorno, incluida la persona que sostiene la cámara."
      - texto: "Unos 90 °C"
        porque: "Solo si la superficie tuviera la emisividad que supone la cámara, 0,95."
      - texto: "Más de 90 °C, porque el metal brilla"
        porque: "Brillar en el visible no es emitir en el infrarrojo: un metal pulido emite muy poco."
    escalera:
      - "Una emisividad de 0,05 significa que emite muy poco y refleja casi todo."
    solucion: "Unos 30 °C: lee el reflejo del entorno."
    comprobar:
      - { T_r: 29.6, tol: 0.01 }

  - id: remedio-metal
    tipo: pregunta
    titulo: "Medir un metal"
    texto: "¿Cómo se mide con la cámara la temperatura de un disipador de aluminio pulido?"
    libro: [353]
    fijar: { T_a: 25, eps_c: 0.95 }
    widget:
      tipo: grafica
      x: { id: tx, min: 25, max: 120, unidad: "°C", rotulo: "temperatura real" }
      y: { min: 20, max: 120, unidad: "°C", rotulo: "lee la cámara" }
      curvas:
        - { expr: "((eps*(tx + 273.15)^4 + (1 - eps)*(T_a + 273.15)^4 - (1 - eps_c)*(T_a + 273.15)^4)/eps_c)^0.25 - 273.15", color: naranja, rotulo: "lectura" }
        - { expr: "tx", color: tinta, rotulo: "lectura exacta", discontinua: true }
      lectura: { valor: T_r, rotulo: "Un objeto a 90 °C se lee a" }
      mandos:
        - { valor: eps, lista: [0.05, 0.1, 0.8, 0.95], nombres: [aluminio pulido, estaño brillante, acero oxidado, cinta mate], rotulo: "Superficie" }
    opciones:
      - texto: "Pegando un trozo de cinta mate y apuntando a ella"
        bien: true
        porque: "La cinta tiene una emisividad de 0,95, la que supone la cámara: lee la temperatura real."
      - texto: "Acercando mucho la cámara"
        porque: "La distancia no cambia la emisividad: seguiría leyendo el reflejo."
      - texto: "Midiendo a la vez el aire de alrededor"
        porque: "El aire no dice la temperatura del disipador."
    escalera:
      - "Elija en la gráfica la superficie con la que la lectura coincide con la real."
    solucion: "Cinta mate o pintura negra mate en la zona."

  - id: el-dedo
    tipo: pregunta
    titulo: "El dedo, con reservas"
    texto: "¿Cuándo no se usa el dedo para buscar calor?"
    libro: [344]
    widget:
      tipo: figura
      figura: fig-14.15
      zonas:
        - { id: barras, rotulo: "Las barras", rect: [80, 15, 245, 140] }
        - { id: lecturas, rotulo: "Lo que lee la cámara", rect: [330, 0, 64, 160] }
    opciones:
      - texto: "En circuitos con tensiones peligrosas, como el primario de una fuente"
        bien: true
        porque: "Y por encima de unos 50 °C solo dice que quema."
      - texto: "En placas de baja tensión"
        porque: "Ahí es útil: encuentra en segundos el componente más caliente que sus vecinos."
      - texto: "Cuando hay diferencias de pocos grados"
        porque: "El dedo detecta diferencias de pocos grados: es su fuerte."
    escalera:
      - "El dedo toca: ¿qué tensiones no se tocan nunca?"
    solucion: "Con tensiones peligrosas, y por encima de unos 50 °C."

  - id: termopar-diferencial
    tipo: pregunta
    titulo: "El termopar del multímetro"
    texto: "Con dos termopares en el BM869s, ¿cuál es la medida más útil?"
    libro: [348]
    widget:
      tipo: figura
      figura: fig-53.9
      zonas:
        - { id: pantalla, rotulo: "La pantalla", rect: [120, 95, 580, 350] }
        - { id: bornes, rotulo: "Los cuatro bornes", rect: [110, 1235, 600, 110] }
    opciones:
      - texto: "La diferencial: componente frente a ambiente"
        bien: true
        porque: "Da directamente el salto térmico, que se compara con el calculado por pérdidas y resistencia térmica."
      - texto: "La absoluta del componente"
        porque: "Depende del ambiente: la diferencia es la que se compara con el cálculo."
      - texto: "La de los propios bornes"
        porque: "En los bornes está la unión fría: no hay que calentarlos."
    escalera:
      - "Con T1 − T2 se obtiene el salto, no la temperatura."
    solucion: "La diferencial, T1 − T2."

  - id: criterio
    tipo: pregunta
    fase: "Empareje"
    titulo: "Qué buscar en la imagen"
    texto: "Una cada observación con lo que indica."
    libro: [355, 356, 357]
    emparejar:
      - ["20 °C por encima de sus vecinos", "Merece investigación"]
      - ["40 °C por encima", "Avería casi segura"]
      - ["Se calienta de golpe al encender", "Cortocircuito"]
      - ["Regulador frío que debería consumir", "No entrega corriente"]
    exito: "El criterio es comparativo: frente a los vecinos y frente al tiempo."
    pistas:
      - { texto: "Despacio es disipación normal; de golpe, un corto." }
    escalera:
      - "El doble de diferencia es casi una certeza."
    solucion: "20 °C: investigar; 40 °C: avería; de golpe: corto; regulador frío: no entrega."

  - id: regulador-frio
    tipo: porque
    titulo: "Lo que debería estar caliente"
    texto: "Un regulador que en este circuito debería calentarse está frío. ¿Por qué es tan informativo?"
    libro: [356]
    widget:
      tipo: figura
      figura: fig-14.15
      zonas:
        - { id: barras, rotulo: "Las barras", rect: [80, 15, 245, 140] }
        - { id: lecturas, rotulo: "Lo que lee la cámara", rect: [330, 0, 64, 160] }
    opciones:
      - texto: "Porque no entrega corriente: el fallo está antes, o la carga no consume"
        bien: true
        porque: "Es la lectura que más se olvida y a menudo la más informativa."
      - texto: "Porque está bien refrigerado"
        porque: "Si debería disipar y no lo hace, no está trabajando."
      - texto: "Porque está en cortocircuito"
        porque: "Un corto se calienta de golpe: no estaría frío."
    escalera:
      - "Un regulador lineal disipa la corriente que entrega por la caída que soporta."
    solucion: "No entrega corriente: el fallo está antes o la carga no consume."

  - id: dos-vecinos
    tipo: pregunta
    titulo: "Dos vecinos muy juntos"
    texto: "La cámara no distingue cuál de dos componentes vecinos es el caliente. ¿Qué se hace?"
    libro: [362]
    widget:
      tipo: figura
      figura: fig-14.15
      zonas:
        - { id: barras, rotulo: "Las barras", rect: [80, 15, 245, 140] }
        - { id: lecturas, rotulo: "Lo que lee la cámara", rect: [330, 0, 64, 160] }
    opciones:
      - texto: "Apoyar el termopar en cada uno"
        bien: true
        porque: "La resolución espacial de la cámara no basta; el termopar da la cifra de cada uno."
      - texto: "Alejar la cámara"
        porque: "Alejándose, la resolución sobre la placa empeora."
      - texto: "Cambiar los dos"
        porque: "Sería sustituir por sospecha."
    escalera:
      - "¿Qué instrumento mide en un solo punto?"
    solucion: "El termopar apoyado en cada uno."

  - id: ordene-banco
    tipo: pregunta
    fase: "Ordene"
    titulo: "La secuencia práctica"
    texto: "Ordene la búsqueda de una avería de consumo anormal."
    libro: [360, 364]
    ordenar:
      - "Inspección visual."
      - "Imagen térmica a los treinta segundos del encendido."
      - "Imagen térmica a los cinco minutos."
      - "Termopar sobre los dos o tres candidatos."
    exito: "Así quedan localizadas antes de sacar el osciloscopio."
    pistas:
      - { texto: "Las cifras del termopar van al final, sobre los candidatos." }
    escalera:
      - "Mirar sin alimentar va siempre primero."
    solucion: "Inspección, imagen a los treinta segundos y a los cinco minutos, y termopar en los candidatos."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [341, 350, 353, 355, 364]
    ideas:
      - { titulo: "El calor informa.", texto: "Casi todo fallo se manifiesta como calor." }
      - { titulo: "Emisividad.", texto: "Un metal pulido a 90 °C se lee a unos 30 °C: cinta mate." }
      - { titulo: "Criterio.", texto: "20 °C sobre los vecinos, investigar; 40 °C, avería; y lo que debería estar caliente y no lo está." }
      - { titulo: "Secuencia.", texto: "Inspección, imagen a los treinta segundos y a los cinco minutos, y termopar." }
