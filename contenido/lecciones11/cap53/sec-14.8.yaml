# Lección 1.2 de la sección 55.10 «La Cámara Térmica y la Detección de Puntos Calientes» (cap53; etiqueta interna
# sec-14.8). Formato: contenido/lecciones11/GUIA.md. La lectura de la cámara (ajustada a ε = 0,95, entorno a 25 °C)
# frente a la temperatura real, con la ley de Stefan-Boltzmann: la radiación que recibe es ε·T⁴ + (1 − ε)·T_a⁴ y la
# cámara la convierte suponiendo 0,95 (temperaturas en kelvin). Da los valores de la figura 55.23 (29,6 °C con 0,05;
# 34 °C con 0,10; 81,9 °C con 0,80; la figura los trunca a 29, 34 y 81) y los «unos 30 °C» del bloque 353. El modelo
# es mío; la figura y el texto, del libro. Sin paso práctico propio (la sección es de criterio).
# 1.2.1 (aprender haciendo): emisividad con objetivo, la lectura calculada en el modelo, la secuencia en orden y listados que se tocan.
# 1.2.1, segunda pasada: sin listas de respuestas disfrazadas; quedan las tarjetas que se hacen y dos preguntas.
# 1.3 (contenido13): el remedio de la cinta pasa a hacerse sobre la gráfica (era un listado de texto), entra leer el
# error con acero oxidado en la fig-55.23 (81 °C) y la imagen a los treinta segundos frente a los cinco minutos (curvas
# de ejemplo) y la cifra del termopar frente a la prevista (bloque 348): 2/4 → 6/7.
leccion: cap53/sec-14.8

libro:
  341: "Casi todo fallo en electrónica se manifiesta como calor"
  344: "no sirve por encima de unos 50 °C"
  347: "admite dos termopares tipo K y da la diferencia entre ambos"
  348: "la medida más útil no es la absoluta sino la diferencial, componente frente a ambiente"
  350: "localiza el punto más caliente entre cientos"
  351: "los materiales difieren mucho"
  352: "Aluminio pulido"
  353: "Con emisividad 0,05, un disipador de aluminio a 90 °C puede leerse como si estuviera a unos 30 °C"
  355: "un componente 20 °C por encima de sus vecinos merece investigación; 40 °C es una avería casi segura"
  356: "un regulador frío en un circuito que debería consumir significa que no está entregando corriente"
  357: "una imagen al encender y otra a los cinco minutos"
  360: "el componente en cortocircuito se calienta y aparece en la cámara en segundos"
  362: "el termopar apoyado en cada uno resuelve la duda"
  364: "imagen térmica a los treinta segundos y a los cinco minutos del encendido"
  365: "La emisividad de cada superficie y el error que introduce en una medida térmica."

modelo:
  valores:
    T_o: { sim: "T", nombre: "temperatura real del objeto", unidad: "°C", valor: 90 }
    T_a: { sim: "T_{a}", nombre: "temperatura del entorno", unidad: "°C", valor: 25 }
    eps: { sim: "ε", nombre: "emisividad de la superficie", unidad: "", valor: 0.05 }
    eps_c: { sim: "ε_{cám}", nombre: "emisividad que supone la cámara", unidad: "", valor: 0.95 }
    k_t: { tipo: interruptor, nombre: "cinta mate pegada en el disipador", valor: 0 }
    T_81: { sim: "T_{lee}", nombre: "lectura con acero oxidado (figura 55.23)", unidad: "°C", valor: 81 }
    e_ac: { sim: "ε", nombre: "emisividad del acero oxidado (figura 55.23)", unidad: "", valor: 0.8 }
    t_i: { sim: "t", nombre: "tiempo desde el encendido", unidad: s, valor: 300 }
    T_pv: { sim: "T_{prevista}", nombre: "temperatura prevista del transistor", unidad: "°C", valor: 60 }
    T_md: { sim: "T_{medida}", nombre: "temperatura medida con el termopar", unidad: "°C", valor: 95 }
  calculos:
    e_k: { si: k_t, entonces: "0.95", sino: "0.05", sim: "ε", nombre: "emisividad de lo que mira la cámara", unidad: "" }
    T_k: { expr: "((e_k*(T_o + 273.15)^4 + (1 - e_k)*(T_a + 273.15)^4 - (1 - eps_c)*(T_a + 273.15)^4)/eps_c)^0.25 - 273.15", sim: "T_{lee}", nombre: "lo que lee la cámara sobre el disipador", unidad: "°C" }
    e_81: { expr: "T_o - T_81", sim: "error", nombre: "error de la lectura con acero oxidado", unidad: "°C" }
    T_n: { expr: "25 + 40*(1 - exp(-t_i/120))", sim: "T", nombre: "componente que disipa con normalidad (ejemplo)", unidad: "°C" }
    T_cc: { expr: "25 + 60*(1 - exp(-t_i/5))", sim: "T", nombre: "componente en cortocircuito (ejemplo)", unidad: "°C" }
    d_tm: { expr: "T_md - T_pv", sim: "ΔT", nombre: "grados de más", unidad: "°C" }
    T_r: { expr: "((eps*(T_o + 273.15)^4 + (1 - eps)*(T_a + 273.15)^4 - (1 - eps_c)*(T_a + 273.15)^4)/eps_c)^0.25 - 273.15", sim: "T_{lee}", nombre: "lo que lee la cámara", unidad: "°C" }

tarjetas:
  - id: explore-emisividad
    tipo: explorar
    titulo: "La emisividad"
    texto: "La cámara mide radiación y supone una emisividad de 0,95. Consiga que lea casi la temperatura real."
    libro: [352, 365]
    fijar: { T_a: 25, eps_c: 0.95 }
    widget:
      tipo: grafica
      x: { id: tx, min: 25, max: 120, unidad: "°C", rotulo: "temperatura real" }
      y: { min: 20, max: 120, unidad: "°C", rotulo: "lee la cámara" }
      curvas:
        - { expr: "((eps*(tx + 273.15)^4 + (1 - eps)*(T_a + 273.15)^4 - (1 - eps_c)*(T_a + 273.15)^4)/eps_c)^0.25 - 273.15", color: naranja, rotulo: "lectura" }
        - { expr: "tx", color: tinta, rotulo: "lectura exacta", discontinua: true }
      marcas:
        - { x: "T_o", y: "T_r", rotulo: "{{T_r}}" }
      lectura: { valor: T_r, rotulo: "Un objeto a 90 °C se lee a" }
      mandos:
        - { valor: eps, lista: [0.05, 0.1, 0.8, 0.95], nombres: [aluminio pulido, estaño brillante, acero oxidado, cinta mate], rotulo: "Superficie" }
    objetivo:
      condiciones:
        - { valor: T_r, min: 85, rotulo: "Lee: {{T_r}}" }
      logrado: "Solo cuando la superficie emite lo que supone la cámara, la lectura es la real."
      pistas:
        - { texto: "Pruebe otra superficie." }
    escalera:
      - "La cámara supone 0,95: busque la superficie que se le acerca."
    solucion: "La cinta mate."

  - id: prediga-disipador
    tipo: simular
    titulo: "Un disipador de aluminio pulido"
    texto: "Un disipador de aluminio pulido está a 90 °C, en un entorno a 25 °C. ¿Qué lee la cámara?"
    libro: [352, 353]
    fijar: { T_o: 90, T_a: 25, eps: 0.05, eps_c: 0.95 }
    simular:
      objetivo: T_r
      unidad: "°C"
      tol: 0.05
      rotulo: "Lee la cámara"
      errores:
        - { expr: "T_o", texto: "Solo si la superficie tuviera la emisividad que supone la cámara, 0,95." }
    exito: "Con 0,05 la ve casi como un espejo: mide el reflejo del entorno."
    escalera:
      - "Una emisividad de 0,05 significa que emite muy poco y refleja casi todo."
    solucion: "Unos 30 °C: lee el reflejo del entorno."
    comprobar:
      - { T_r: 29.6, tol: 0.01 }

  - id: remedio-metal
    tipo: explorar
    titulo: "Medir un metal"
    texto: "El disipador de aluminio pulido sigue a 90 °C y la cámara lee unos 30 °C. Haga lo que manda el libro para medir metales."
    libro: [353]
    fijar: { T_o: 90, T_a: 25, eps_c: 0.95 }
    inicio: { k_t: 0 }
    widget:
      tipo: grafica
      x: { id: tx, min: 25, max: 120, unidad: "°C", rotulo: "temperatura real" }
      y: { min: 20, max: 120, unidad: "°C", rotulo: "lee la cámara" }
      curvas:
        - { expr: "((e_k*(tx + 273.15)^4 + (1 - e_k)*(T_a + 273.15)^4 - (1 - eps_c)*(T_a + 273.15)^4)/eps_c)^0.25 - 273.15", color: naranja, rotulo: "lectura" }
        - { expr: "tx", color: tinta, rotulo: "lectura exacta", discontinua: true }
      marcas:
        - { x: "T_o", y: "T_k", rotulo: "{{T_k}}" }
      lectura: { valor: T_k, rotulo: "Lee la cámara" }
      mandos:
        - { valor: k_t, tipo: interruptor, rotulo: "Cinta mate pegada" }
    objetivo:
      condiciones:
        - { valor: T_k, min: 85, rotulo: "Lee: {{T_k}}" }
      logrado: "Con la cinta, la cámara mira una superficie de 0,95, la que supone, y lee {{T_k}}. Pintar la zona de negro mate vale igual."
      pistas:
        - { texto: "Sin tocar la cámara: cambie la superficie a la que apunta." }
    escalera:
      - "Un trozo de cinta mate sobre el metal."
    solucion: "Pegue la cinta mate y apunte a ella."
    comprobar:
      - { T_k: 29.6, tol: 0.01 }
      - { con: { k_t: 1 }, T_k: 90, tol: 0.001 }

  - id: lea-acero
    tipo: simular
    titulo: "Casi bien no es bien"
    texto: "En la figura, lea qué marca la cámara sobre acero oxidado, ε = 0,80, a 90 °C. ¿Cuántos grados se equivoca?"
    libro: [351, 365]
    fijar: { T_o: 90 }
    widget:
      tipo: figura
      figura: fig-14.15
      zonas:
        - { id: lee, rotulo: "Columna de la derecha", rect: [335, 0, 59, 160], texto: "Lo que lee la cámara con cada superficie, para un objeto a 90 °C." }
    simular:
      objetivo: e_81
      unidad: "°C"
      tol: 0.05
      rotulo: "Error"
      errores:
        - { expr: "T_81", texto: "Esa es la lectura. El error es lo que le falta hasta los 90 °C reales." }
    exito: "9 °C de menos aun con 0,80. Por encima de 0,9 la lectura es fiable: plástico, epoxi, máscara y cinta mate."
    escalera:
      - "Busque la fila del acero oxidado en la columna de la derecha."
    solucion: "Marca 81 °C: 90 − 81 = 9 °C."
    comprobar:
      - { e_81: 9, T_81: 81, e_ac: 0.8 }

  - id: explore-tiempo
    tipo: explorar
    titulo: "Al encender y a los cinco minutos"
    texto: "Dos componentes se calientan al encender: uno disipa con normalidad y otro está en cortocircuito. Haga la imagen a los treinta segundos."
    nota: "Curvas de calentamiento de ejemplo."
    libro: [357, 364]
    inicio: { t_i: 300 }
    widget:
      tipo: grafica
      x: { id: tt, min: 0, max: 320, unidad: s, rotulo: "tiempo desde el encendido" }
      y: { min: 20, max: 90, unidad: "°C", rotulo: "temperatura" }
      curvas:
        - { expr: "25 + 40*(1 - exp(-tt/120))", color: azul, rotulo: "disipa con normalidad" }
        - { expr: "25 + 60*(1 - exp(-tt/5))", color: naranja, rotulo: "cortocircuito" }
      marcas:
        - { x: "t_i", y: "T_cc", rotulo: "{{T_cc}}" }
        - { x: "t_i", y: "T_n", rotulo: "{{T_n}}" }
      lectura: { valor: t_i, rotulo: "Imagen a los" }
      mandos:
        - { valor: t_i, lista: [30, 300], rotulo: "Imagen a los" }
    objetivo:
      condiciones:
        - { valor: t_i, max: 30, rotulo: "Imagen a los treinta segundos" }
      logrado: "A los treinta segundos el del corto ya está a {{T_cc}} y el otro, a {{T_n}}: uno se calienta de golpe y el otro despacio. Las dos imágenes juntas lo distinguen."
      pistas:
        - { texto: "Elija la imagen de los treinta segundos." }
    escalera:
      - "Compare las dos curvas al principio."
    solucion: "La imagen de los treinta segundos."
    comprobar:
      - { con: { t_i: 30 }, T_cc: 85, T_n: 33.85, tol: 0.01 }

  - id: simule-termopar
    tipo: simular
    titulo: "La cifra del termopar"
    texto: "Por sus pérdidas y su resistencia térmica, un transistor debería estar a 60 °C, y el termopar del BM869s marca 95 °C. ¿Cuántos grados de más tiene?"
    libro: [347, 348, 355]
    simular:
      objetivo: d_tm
      unidad: "°C"
      tol: 0.03
      rotulo: "Grados de más"
      errores:
        - { expr: "T_md", texto: "Esa es la temperatura medida. Lo que informa es la diferencia con la prevista." }
    exito: "35 °C de más: algo consume más de lo previsto. El termopar convierte «está caliente» en una cifra que se compara con la calculada."
    escalera:
      - "Medida menos prevista."
    solucion: "95 − 60 = 35 °C."
    comprobar:
      - { d_tm: 35, T_pv: 60, T_md: 95 }

  - id: regulador-frio
    tipo: porque
    titulo: "Lo que debería estar caliente"
    texto: "Un regulador que en este circuito debería calentarse está frío. ¿Por qué es tan informativo?"
    libro: [356]
    widget:
      tipo: figura
      figura: fig-14.15
      zonas:
        - { id: barras, rotulo: "Las barras", rect: [80, 15, 245, 140] }
        - { id: lecturas, rotulo: "Lo que lee la cámara", rect: [330, 0, 64, 160] }
    opciones:
      - texto: "Porque no entrega corriente: el fallo está antes, o la carga no consume"
        bien: true
        porque: "Es la lectura que más se olvida y a menudo la más informativa."
      - texto: "Porque está bien refrigerado"
        porque: "Si debería disipar y no lo hace, no está trabajando."
      - texto: "Porque está en cortocircuito"
        porque: "Un corto se calienta de golpe: no estaría frío."
    escalera:
      - "Un regulador lineal disipa la corriente que entrega por la caída que soporta."
    solucion: "No entrega corriente: el fallo está antes o la carga no consume."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [341, 350, 353, 355, 364, 344, 348, 357, 360, 362]
    ideas:
      - { titulo: "El calor informa.", texto: "Casi todo fallo se manifiesta como calor." }
      - { titulo: "Emisividad.", texto: "Un metal pulido a 90 °C se lee a unos 30 °C: cinta mate." }
      - { titulo: "Criterio.", texto: "20 °C sobre los vecinos, investigar; 40 °C, avería; y lo que debería estar caliente y no lo está." }
      - { titulo: "Secuencia.", texto: "Inspección, imagen a los treinta segundos y a los cinco minutos, y termopar." }
