# Lección 1.2 de la sección 55.29 «Sin Esquema: Ingeniería Inversa Mínima y Sustitutos» (cap53; etiqueta interna
# sec-53.28). Formato: contenido/lecciones11/GUIA.md. La figura 55.50 (fig-53.39, 450,7 × 166,3) con zonas; el código
# SMD «472» como predicción sobre una resistencia viva (con 5 V de ejemplo, solo para que el esquema tenga fuente); las
# tablas de identificación y de sustitutos como emparejar y preguntas. Sin paso práctico simulable: la sección es de
# criterio (qué trazar, cómo identificar, qué igualar).
leccion: cap53/sec-53.28

libro:
  858: "de ella se extrae lo suficiente para reparar"
  860: "Las alimentaciones primero."
  861: "Un reparador experimentado traza el 10 % de la placa, el que rodea al fallo."
  863: "«472» es 47 × 10² = 4,7 kΩ"
  864: "la luz rasante saca los grabados láser sin tinta"
  866: "Hay parámetros que deben igualarse, otros que pueden mejorarse y otros que no se pueden tocar sin rediseñar."
  867: "Uno lento por uno rápido deja de proteger lo que protegía"
  869: "nunca hay problema en sobredimensionar lo que aguanta"
  871: "Orden de reconstrucción sin esquema y qué comparar al buscar sustitutos."

modelo:
  valores:
    V_r: { sim: "V", nombre: "tensión de prueba", unidad: V, valor: 5 }
    c_1: { sim: "c₁", nombre: "primera cifra", unidad: "", valor: 4 }
    c_2: { sim: "c₂", nombre: "segunda cifra", unidad: "", valor: 7 }
    c_m: { sim: "m", nombre: "multiplicador", unidad: "", valor: 2 }
  calculos:
    R_c: { expr: "(10*c_1 + c_2)*10^c_m", sim: "R", nombre: "resistencia del código", unidad: Ω }
    I_c: { expr: "V_r/R_c", sim: "I", nombre: "corriente", unidad: A }

tarjetas:
  - id: explore-orden
    tipo: explorar
    titulo: "Casi nunca hay esquema"
    texto: "Pero siempre está la placa. Toque el orden de reconstrucción y los sustitutos."
    libro: [858, 871]
    widget:
      tipo: figura
      figura: fig-53.39
      zonas:
        - { id: alimentaciones, rotulo: "Primer cuadro de arriba", rect: [4, 22, 104, 58], texto: "Las alimentaciones, desde el conector con la continuidad: raíles, tensión y a quién van." }
        - { id: masa, rotulo: "Segundo cuadro de arriba", rect: [117, 22, 104, 58], texto: "La masa: el plano mayor; marcar un punto para la pinza." }
        - { id: bloques, rotulo: "Tercer cuadro de arriba", rect: [231, 22, 104, 58], texto: "Los bloques: cada integrado y su hoja de datos dan una función." }
        - { id: senal, rotulo: "Cuarto cuadro de arriba", rect: [344, 22, 104, 58], texto: "La señal, solo en la zona sospechosa." }
        - { id: sustitutos, rotulo: "El cuadro grande de abajo", rect: [4, 84, 444, 80], texto: "Igual o mejor en lo que soporta; igual en lo que define el funcionamiento." }
    requiere: { mover: [alimentaciones, masa, bloques, senal] }

  - id: ordene-trazar
    tipo: pregunta
    fase: "Ordene"
    titulo: "Trazar lo imprescindible"
    texto: "Ordene lo que se reconstruye de una placa sin esquema."
    libro: [860]
    ordenar:
      - "Las alimentaciones"
      - "La masa"
      - "Los bloques, por sus integrados"
      - "El camino de la señal en la zona sospechosa"
    exito: "Con tres o cuatro hojas de datos se tiene el diagrama de bloques sin trazar una sola señal."
    pistas:
      - { texto: "La señal va al final, y solo donde está el fallo." }
    escalera:
      - "Primero lo que alimenta todo; después, la referencia para medir."
    solucion: "Alimentaciones, masa, bloques y señal."

  - id: cuanto-trazar
    tipo: pregunta
    titulo: "Cuánto trazar"
    texto: "¿Qué parte de la placa traza un reparador experimentado?"
    libro: [861]
    widget:
      tipo: figura
      figura: fig-53.39
      zonas:
        - { id: senal, rotulo: "Cuarto cuadro de arriba", rect: [344, 22, 104, 58] }
        - { id: bloques, rotulo: "Tercer cuadro de arriba", rect: [231, 22, 104, 58] }
    opciones:
      - texto: "El 10 %, el que rodea al fallo"
        bien: true
        porque: "Dibujar el esquema completo no hace falta: lleva mucho más tiempo que reparar."
      - texto: "Toda, para entender el aparato"
        porque: "Es lo que no hace falta: se repara en una fracción de ese tiempo."
      - texto: "Ninguna: se cambian piezas hasta que funcione"
        porque: "Eso es sustituir por sospecha; un trazado mínimo orienta las medidas."
    escalera:
      - "¿Hace falta el esquema de lo que funciona?"
    solucion: "El 10 % que rodea al fallo."

  - id: prediga-codigo
    tipo: predecir
    titulo: "Una resistencia SMD marcada «472»"
    texto: "Dos cifras y un multiplicador. ¿Cuánto vale?"
    libro: [863]
    fijar: { V_r: 5, c_1: 4, c_2: 7, c_m: 2 }
    widget:
      tipo: circuito
      esquema: resistencia
      piezas: { fuente: V_r, r: R_c }
      lectura: { valor: R_c, rotulo: "Resistencia" }
      mide: { corriente: I_c, tension: V_r }
      ocultar: true
      mandos: []
    opciones:
      - texto: "4,7 kΩ"
        bien: true
        porque: "47 × 10²: las dos primeras cifras y dos ceros."
      - texto: "472 Ω"
        porque: "La última cifra no es una cifra más: es el número de ceros."
      - texto: "47 Ω"
        porque: "La última cifra cuenta ceros que se añaden: con «2», dos ceros más."
    escalera:
      - "La tercera cifra dice cuántos ceros se añaden."
    solucion: "47 × 10² = 4,7 kΩ."
    comprobar:
      - { R_c: 4700 }
      - { con: { c_m: 0 }, R_c: 47 }

  - id: codigo-r
    tipo: pregunta
    titulo: "Con una R en medio"
    texto: "Otra resistencia SMD lleva «4R7». ¿Cuánto vale?"
    libro: [863]
    widget:
      tipo: figura
      figura: fig-53.39
      zonas:
        - { id: bloques, rotulo: "Tercer cuadro de arriba", rect: [231, 22, 104, 58] }
    opciones:
      - texto: "4,7 Ω"
        bien: true
        porque: "La «R» hace de coma decimal."
      - texto: "4,7 kΩ"
        porque: "Ese es «472». La R no es un multiplicador: es la coma."
      - texto: "47 Ω"
        porque: "La R va entre las dos cifras: marca la coma, no un cero."
    escalera:
      - "La R ocupa el lugar de la coma."
    solucion: "4R7 = 4,7 Ω."

  - id: empareje-diodos
    tipo: pregunta
    fase: "Empareje"
    titulo: "Un diodo con una banda y nada más"
    texto: "Una cada lectura de la prueba de diodos con el tipo de diodo."
    libro: [863]
    emparejar:
      - ["0,3 V", "Schottky"]
      - ["0,6–0,7 V", "Silicio"]
      - ["Más de 1,5 V", "LED o Zener bajo"]
    exito: "La corriente que admite se estima por el tamaño."
    pistas:
      - { texto: "El Schottky es el de menor caída." }
    escalera:
      - "Un diodo de silicio corriente cae unos 0,6–0,7 V."
    solucion: "0,3 V: Schottky; 0,6–0,7 V: silicio; más de 1,5 V: LED o Zener bajo."

  - id: lijado
    tipo: pregunta
    titulo: "Un marcaje lijado a propósito"
    texto: "Un integrado tiene el marcaje lijado a propósito. ¿Qué suele ser?"
    libro: [863, 864]
    widget:
      tipo: figura
      figura: fig-53.39
      zonas:
        - { id: bloques, rotulo: "Tercer cuadro de arriba", rect: [231, 22, 104, 58] }
        - { id: masa, rotulo: "Segundo cuadro de arriba", rect: [117, 22, 104, 58] }
    opciones:
      - texto: "Un microcontrolador, que rara vez es lo que ha fallado"
        bien: true
        porque: "Se identifica por el encapsulado y los pines de programación."
      - texto: "El culpable de la avería"
        porque: "Que esté lijado no lo hace sospechoso: rara vez es lo que falla."
      - texto: "Un regulador"
        porque: "Un regulador se reconoce por su entorno y no se suele lijar."
    escalera:
      - "¿Qué pieza querría ocultar un fabricante a la competencia?"
    solucion: "Un microcontrolador, rara vez el culpable."

  - id: empareje-sustitutos
    tipo: pregunta
    fase: "Empareje"
    titulo: "Lo que no se toca sin rediseñar"
    texto: "Una cada componente con el cambio que lo convierte en un rediseño."
    libro: [866, 867]
    emparejar:
      - ["Fusible", "Uno lento por uno rápido"]
      - ["Condensador cerámico", "X7R por Y5V en un filtro sensible"]
      - ["Cristal", "Otra capacidad de carga"]
      - ["Regulador lineal", "Un LDO sin comprobar la ESR requerida"]
      - ["Operacional", "Uno rail to rail con la misma compensación"]
    exito: "Cada uno cambia lo que define el funcionamiento: protección, valor real, frecuencia o estabilidad."
    pistas:
      - { texto: "El cristal se desplaza de frecuencia con otra capacidad de carga." }
    escalera:
      - "Un fusible lento deja de proteger lo que protegía."
    solucion: "Fusible: lento por rápido; cerámico: Y5V; cristal: carga; LDO: ESR; operacional: rail to rail."

  - id: electrolitico
    tipo: pregunta
    titulo: "Un electrolítico de repuesto"
    texto: "Tiene un electrolítico de la misma capacidad, más tensión y 105 °C. ¿Sirve?"
    libro: [867, 869]
    widget:
      tipo: figura
      figura: fig-53.39
      zonas:
        - { id: sustitutos, rotulo: "El cuadro grande de abajo", rect: [4, 84, 444, 80] }
    opciones:
      - texto: "Sí: igual o mejor en lo que soporta"
        bien: true
        porque: "Sobredimensionar lo que aguanta nunca es un problema; casi siempre se puede mejorar."
      - texto: "No: la tensión debe ser idéntica"
        porque: "La tensión debe ser igual o mayor: más tensión es más margen."
      - texto: "Solo si es del mismo fabricante"
        porque: "Se compara lo que el circuito usa: capacidad, tensión, ESR y temperatura."
    escalera:
      - "¿Hay algún problema en que aguante más?"
    solucion: "Sí: igual o mejor en tensión y temperatura."

  - id: por-que-parecido
    tipo: porque
    titulo: "Un «parecido» que no vale"
    texto: "Un transistor de otra patilla o un MOSFET de otro umbral. ¿Por qué un parecido ahí es un rediseño?"
    libro: [866, 869]
    widget:
      tipo: figura
      figura: fig-53.39
      zonas:
        - { id: sustitutos, rotulo: "El cuadro grande de abajo", rect: [4, 84, 444, 80] }
        - { id: bloques, rotulo: "Tercer cuadro de arriba", rect: [231, 22, 104, 58] }
    opciones:
      - texto: "Porque cambia lo que define el funcionamiento"
        bien: true
        porque: "Valor, patillaje, tipo, umbral y capacidad de carga deben ser iguales."
      - texto: "Porque soporta menos"
        porque: "Puede soportar igual o más; el problema es que no funciona igual."
      - texto: "Porque es más caro"
        porque: "El precio no cambia el circuito; el umbral o el patillaje, sí."
    escalera:
      - "Hay lo que se puede mejorar y lo que debe ser igual."
    solucion: "Cambia lo que define el funcionamiento: ahí, parecido es rediseñar."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [860, 861, 863, 869]
    ideas:
      - { titulo: "Trazar poco.", texto: "Alimentaciones, masa, bloques y la señal solo donde está el fallo." }
      - { titulo: "Identificar.", texto: "Códigos SMD, prueba de diodos y lupa con luz rasante." }
      - { titulo: "Sustituir.", texto: "Igual o mejor en lo que soporta; igual en lo que define el funcionamiento." }
      - { titulo: "Ante la duda.", texto: "Las dos hojas de datos lado a lado: cinco minutos que evitan otra avería." }
