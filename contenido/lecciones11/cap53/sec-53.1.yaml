# Lección 1.2 de la sección 55.1 «El Método antes que el Instrumento» (cap53; etiqueta interna sec-53.1).
# Formato: contenido/lecciones11/GUIA.md. La figura 55.1 (el ciclo del método, con zonas en las coordenadas de su
# svg_vista, 453,6 × 237,6) y la foto 55.3 (tres instrumentos de diagnóstico, en píxeles de la foto de 1600 × 494).
# Sin modelo numérico: la sección es de método; el paso práctico de la bisección está en la 55.11.
leccion: cap53/sec-53.1

libro:
  3: "acota en lugar de acumular datos"
  4: "Un banco modesto con buen método repara más que uno excelente sin él."
  6: "Un aparato que dejó de funcionar tras una tormenta apunta a sobretensión"
  7: "Antes de la primera hipótesis van siempre dos comprobaciones que no necesitan ninguna"
  8: "Una hipótesis debe ser falsable con una medida"
  9: "la mejor comprobación es la que divide el problema en dos"
  12: "encontrar un componente defectuoso no es lo mismo que encontrar la causa"
  14: "Cambiar dos cosas a la vez impide saber cuál era."
  18: "la explicación más probable es una sola causa que los produce todos"
  19: "si las medidas empiezan a contradecirse, es señal de que hay más de un fallo"
  22: "Los ojos y la lupa responden a «¿qué se ve?»"
  23: "El multímetro responde a «¿cuánto vale?»"
  24: "El osciloscopio responde a «¿qué está pasando?»"
  25: "El analizador lógico responde a «¿qué dicen los datos?»"
  26: "La cámara térmica responde a «¿dónde se disipa?»"
  30: "Con el circuito apagado"
  31: "Alimentaciones, con el multímetro"
  32: "Alimentaciones, con el osciloscopio"
  33: "Señales de reloj y reset"
  34: "La cadena de señal por bisección"
  35: "Componentes concretos, solo cuando la etapa está localizada"
  38: "Sustituir por sospecha, sin medida que lo respalde. Es el más caro"
  39: "diagnosticar durante una hora un circuito al que le faltan 3,3 V"
  41: "Una medida rara que no cuadra con la hipótesis es información, no un estorbo."
  52: "Sin avance tras dos horas y sin esquema, toca replantearse si el aparato lo merece."
  54: "escribir la hipótesis antes de medir"
  55: "muchas veces al escribirla se ve que era vaga"
  56: "El ciclo del método de diagnóstico"
  58: "termómetro de infrarrojos, que localiza sin contacto los componentes que se calientan"

modelo: { valores: {}, calculos: {} }

tarjetas:
  - id: explore-ciclo
    tipo: explorar
    titulo: "El ciclo del método"
    texto: "Hipótesis, comprobación, conclusión. Toque los pasos del ciclo y lea qué pide cada uno."
    libro: [3, 4, 56]
    widget:
      tipo: figura
      figura: fig-53.1
      zonas:
        - { id: sintomas, rotulo: "Paso 1", rect: [25, 3.5, 224, 37], texto: "Qué hace y qué no, desde cuándo y qué cambió. ¿Qué pasó justo antes de fallar?" }
        - { id: hipotesis, rotulo: "Paso 2", rect: [25, 51, 224, 37], texto: "Una hipótesis concreta, que una medida pueda desmentir." }
        - { id: comprobacion, rotulo: "Paso 3", rect: [25, 98.5, 224, 37], texto: "La mejor comprobación divide el problema en dos." }
        - { id: medir, rotulo: "Paso 4", rect: [25, 146, 224, 37], texto: "Medir y anotar según se mide, no después." }
        - { id: concluir, rotulo: "Paso 5", rect: [25, 194, 224, 37], texto: "Concluir y volver al paso 2 con lo aprendido." }
        - { id: errores, rotulo: "Recuadro rojo", rect: [259, 75, 191, 101], texto: "Los errores de método: el más sutil, ignorar lo que no encaja." }
    requiere: { mover: [sintomas, hipotesis, comprobacion] }

  - id: antes-de-hipotesis
    tipo: pregunta
    titulo: "Antes de la primera hipótesis"
    texto: "Dos comprobaciones van siempre antes de formular ninguna hipótesis. ¿Cuáles?"
    libro: [7, 39]
    widget:
      tipo: figura
      figura: fig-14.3
      zonas:
        - { id: alimentacion, rotulo: "Primera pregunta", rect: [3, 33, 240, 47] }
        - { id: consumo, rotulo: "Segunda pregunta", rect: [3, 100, 240, 47] }
        - { id: salida, rotulo: "Tercera pregunta", rect: [3, 166, 240, 47] }
        - { id: tocar, rotulo: "Cuarta pregunta", rect: [3, 233, 240, 47] }
        - { id: aislar, rotulo: "Abajo, en verde", rect: [3, 296, 240, 35] }
    opciones:
      - texto: "La inspección visual y la alimentación, con su valor y su rizado"
        bien: true
        porque: "Cinco minutos de inspección resuelven muchos casos, y un raíl caído explica cualquier síntoma."
      - texto: "El osciloscopio en disparo único y la FFT"
        porque: "Son herramientas para una hipótesis ya formada, no lo primero."
      - texto: "Sustituir el fusible y los electrolíticos"
        porque: "Eso es sustituir por sospecha, el error más caro: no comprueba nada."
    escalera:
      - "Son las dos que no necesitan hipótesis: una se hace con los ojos."
    solucion: "La inspección visual y la alimentación."

  - id: hipotesis-falsable
    tipo: pregunta
    titulo: "Una hipótesis que sirva"
    texto: "¿Cuál de estas hipótesis está bien planteada?"
    libro: [8]
    widget:
      tipo: figura
      figura: fig-53.1
      zonas:
        - { id: sintomas, rotulo: "Paso 1", rect: [25, 3.5, 224, 37] }
        - { id: hipotesis, rotulo: "Paso 2", rect: [25, 51, 224, 37] }
        - { id: comprobacion, rotulo: "Paso 3", rect: [25, 98.5, 224, 37] }
        - { id: medir, rotulo: "Paso 4", rect: [25, 146, 224, 37] }
        - { id: concluir, rotulo: "Paso 5", rect: [25, 194, 224, 37] }
    opciones:
      - texto: "El amplificador no recibe señal porque la etapa previa no la entrega"
        bien: true
        porque: "Es concreta y una medida puede desmentirla: la señal a la salida de la etapa previa."
      - texto: "La fuente está mal"
        porque: "Es vaga: no dice qué medir ni qué valor la desmentiría."
      - texto: "Algo falla en algún sitio del amplificador"
        porque: "No es falsable: ninguna medida concreta la confirma o la descarta."
    escalera:
      - "Una hipótesis debe ser falsable con una medida."
    solucion: "La de la etapa previa que no entrega señal: dice qué medir."

  - id: historial
    tipo: pregunta
    fase: "Empareje"
    titulo: "Lo que pasó antes"
    texto: "Una cada dato del usuario con lo que indica."
    libro: [6]
    emparejar:
      - ["Dejó de funcionar tras una tormenta", "Apunta a sobretensión"]
      - ["Falla al calentarse", "Apunta a dilatación"]
      - ["Unas veces falla y otras no", "Diagnóstico de intermitente"]
    exito: "Dos preguntas al usuario valen por media hora de medidas."
    pistas:
      - { texto: "La tormenta y el calor señalan causas; la pregunta de siempre o a veces, el tipo de diagnóstico." }
    escalera:
      - "Lo que pasó justo antes apunta a la causa; si falla siempre o a veces decide el tipo de diagnóstico."
    solucion: "Tormenta: sobretensión; calor: dilatación; a veces: intermitente."

  - id: ordene-ciclo
    tipo: pregunta
    fase: "Ordene"
    titulo: "El ciclo, en orden"
    texto: "Ordene los pasos del ciclo de diagnóstico."
    libro: [12, 56]
    ordenar:
      - "Recoger los síntomas con precisión."
      - "Formar una hipótesis concreta y comprobable."
      - "Diseñar la comprobación que la confirme o la descarte."
      - "Medir y anotar."
      - "Concluir y volver a la hipótesis con lo aprendido."
    exito: "Y al salir del ciclo, confirmar la causa antes de reparar."
    pistas:
      - { texto: "La medida va después de diseñar la comprobación, y la conclusión al final." }
    escalera:
      - "Sin síntomas no hay hipótesis, y sin hipótesis no hay qué comprobar."
    solucion: "Síntomas, hipótesis, comprobación, medida y conclusión."

  - id: toque-disipa
    tipo: tocar
    titulo: "¿Dónde se disipa?"
    texto: "Cada instrumento responde a una pregunta. Toque el que responde a «¿dónde se disipa?»."
    libro: [26, 58]
    widget:
      tipo: figura
      figura: fig-14.8
      zonas:
        - { id: multimetro, rotulo: "A la izquierda", rect: [0, 0, 292, 440] }
        - { id: sonda, rotulo: "En el centro", rect: [325, 0, 655, 440] }
        - { id: termometro, rotulo: "A la derecha", rect: [1015, 0, 585, 440] }
    tocar:
      bien: [termometro]
      porque:
        multimetro: "El multímetro responde a «¿cuánto vale?»: tensiones, resistencias, continuidad."
        sonda: "La sonda lógica dice si un punto está alto, bajo o pulsa, no dónde se calienta nada."
    exito: "El termómetro de infrarrojos localiza sin contacto lo que se calienta, como la cámara térmica."
    escalera:
      - "Busque el que mide sin contacto la temperatura."
    solucion: "El termómetro de infrarrojos, a la derecha."

  - id: instrumento-pregunta
    tipo: pregunta
    fase: "Empareje"
    titulo: "Cada instrumento, su pregunta"
    texto: "Una cada instrumento con la pregunta que responde."
    libro: [22, 23, 24, 25, 26]
    emparejar:
      - ["Ojos y lupa", "¿Qué se ve?"]
      - ["Multímetro", "¿Cuánto vale?"]
      - ["Osciloscopio", "¿Qué está pasando?"]
      - ["Analizador lógico", "¿Qué dicen los datos?"]
      - ["Cámara térmica", "¿Dónde se disipa?"]
    exito: "Casi todo el tiempo perdido viene de usar el instrumento que no corresponde."
    pistas:
      - { texto: "El multímetro da un número; el osciloscopio, una forma." }
    escalera:
      - "El osciloscopio ve lo que el multímetro promedia: formas y transitorios."
    solucion: "Lupa: qué se ve; multímetro: cuánto vale; osciloscopio: qué pasa; analizador: datos; cámara: disipación."

  - id: ordene-secuencia
    tipo: pregunta
    fase: "Ordene"
    titulo: "El orden que funciona"
    texto: "Ordene la secuencia que resuelve la mayoría de las averías."
    libro: [30, 31, 32, 33, 34, 35]
    ordenar:
      - "Con el circuito apagado: cortos, fusibles y diodos."
      - "Alimentaciones, con el multímetro."
      - "Alimentaciones, con el osciloscopio."
      - "Reloj y reset, si es digital."
      - "La cadena de señal por bisección."
      - "Componentes concretos."
    exito: "De lo general a lo particular: cada paso acota."
    pistas:
      - { texto: "Las alimentaciones van antes que cualquier señal, y los componentes al final." }
    escalera:
      - "Lo primero no necesita encender nada; lo último, la etapa ya localizada."
    solucion: "Apagado, alimentaciones con el multímetro y con el osciloscopio, reloj, bisección y componentes."

  - id: causa-unica
    tipo: pregunta
    titulo: "Varios síntomas a la vez"
    texto: "Un aparato presenta tres síntomas distintos. ¿Qué es lo más probable?"
    libro: [18, 19]
    widget:
      tipo: figura
      figura: fig-14.3
      zonas:
        - { id: alimentacion, rotulo: "Primera pregunta", rect: [3, 33, 240, 47] }
        - { id: consumo, rotulo: "Segunda pregunta", rect: [3, 100, 240, 47] }
        - { id: salida, rotulo: "Tercera pregunta", rect: [3, 166, 240, 47] }
        - { id: tocar, rotulo: "Cuarta pregunta", rect: [3, 233, 240, 47] }
        - { id: aislar, rotulo: "Abajo, en verde", rect: [3, 296, 240, 35] }
    opciones:
      - texto: "Una sola causa que los produce todos"
        bien: true
        porque: "Es el principio de la causa única: buscar la común es más eficiente que tratarlos por separado."
      - texto: "Tres averías independientes"
        porque: "Es posible, pero menos probable; la señal sería que las medidas se contradicen."
      - texto: "Que los síntomas no tienen relación con la avería"
        porque: "Los síntomas son la información de partida: ignorarlos alarga la búsqueda."
    escalera:
      - "Piense en un raíl caído: ¿cuántos síntomas puede producir?"
    solucion: "Una sola causa común."

  - id: medidas-contradicen
    tipo: porque
    titulo: "Cuando las medidas se contradicen"
    texto: "Tras una sobretensión, las medidas empiezan a contradecirse. ¿Qué indica?"
    libro: [19, 41]
    widget:
      tipo: figura
      figura: fig-53.1
      zonas:
        - { id: sintomas, rotulo: "Paso 1", rect: [25, 3.5, 224, 37] }
        - { id: hipotesis, rotulo: "Paso 2", rect: [25, 51, 224, 37] }
        - { id: comprobacion, rotulo: "Paso 3", rect: [25, 98.5, 224, 37] }
        - { id: medir, rotulo: "Paso 4", rect: [25, 146, 224, 37] }
        - { id: concluir, rotulo: "Paso 5", rect: [25, 194, 224, 37] }
    opciones:
      - texto: "Que hay más de un fallo y hay que cambiar de estrategia"
        bien: true
        porque: "Tras una sobretensión o un cortocircuito, los fallos múltiples son la norma."
      - texto: "Que una de las medidas está mal y hay que descartarla"
        porque: "Una medida que no encaja es información, no un estorbo: descartarla alarga la reparación."
      - texto: "Que el multímetro necesita calibración"
        porque: "Antes que el instrumento, la explicación probable es un segundo fallo."
    escalera:
      - "¿Qué pasa con la bisección si hay dos averías?"
    solucion: "Más de un fallo: hay que cambiar de estrategia."

  - id: error-caro
    tipo: pregunta
    titulo: "El error más caro"
    texto: "El aparato funciona tras cambiar tres componentes por sospecha. ¿Qué se sabe?"
    libro: [14, 38]
    widget:
      tipo: figura
      figura: fig-14.9
      zonas:
        - { id: orden, rotulo: "Columna de la izquierda", rect: [28, 3, 252, 222] }
        - { id: rojo, rotulo: "Recuadro rojo", rect: [291, 3, 153, 118] }
        - { id: verde, rotulo: "Recuadro verde", rect: [291, 132, 153, 93] }
    opciones:
      - texto: "Nada: no se sabe cuál de los tres era"
        bien: true
        porque: "Cambiar varias cosas a la vez impide saber cuál era, y no se aprende nada."
      - texto: "Que los tres estaban averiados"
        porque: "Basta con que lo estuviera uno: los otros dos eran sanos y se cambiaron sin motivo."
      - texto: "Que la avería no volverá"
        porque: "Sin conocer la causa, el fallo puede repetirse."
    escalera:
      - "Una hipótesis cada vez: ¿por qué?"
    solucion: "Nada: sustituir por sospecha introduce variables y no enseña."

  - id: tiempos
    tipo: pregunta
    fase: "Empareje"
    titulo: "Saber cuándo parar"
    texto: "Una cada fase con su tiempo de referencia."
    libro: [52]
    emparejar:
      - ["Inspección visual", "De 5 a 15 minutos"]
      - ["Comprobar las alimentaciones", "Unos 10 minutos"]
      - ["Bisección con documentación", "Media hora"]
      - ["Sin avance ni esquema", "Replantearse a las dos horas"]
    exito: "Reconocer pronto un caso perdido es parte del oficio, no un fracaso."
    pistas:
      - { texto: "La inspección es lo más rápido y las dos horas son el límite para replantearse." }
    escalera:
      - "La bisección es la más larga de las tres medidas."
    solucion: "Inspección, 5–15 min; alimentaciones, 10 min; bisección, media hora; sin avance, dos horas."

  - id: escribir-hipotesis
    tipo: pregunta
    titulo: "La costumbre de treinta segundos"
    texto: "¿Por qué escribir la hipótesis antes de medir?"
    libro: [54, 55]
    widget:
      tipo: figura
      figura: fig-53.1
      zonas:
        - { id: sintomas, rotulo: "Paso 1", rect: [25, 3.5, 224, 37] }
        - { id: hipotesis, rotulo: "Paso 2", rect: [25, 51, 224, 37] }
        - { id: comprobacion, rotulo: "Paso 3", rect: [25, 98.5, 224, 37] }
        - { id: medir, rotulo: "Paso 4", rect: [25, 146, 224, 37] }
        - { id: concluir, rotulo: "Paso 5", rect: [25, 194, 224, 37] }
    opciones:
      - texto: "Obliga a precisarla, y a menudo se ve que era vaga o ya estaba descartada"
        bien: true
        porque: "Es la costumbre que más mejora el diagnóstico y cuesta segundos."
      - texto: "Para tener un informe para el cliente"
        porque: "El informe es otro uso; el valor está en pensar antes de medir."
      - texto: "Porque el multímetro lo exige"
        porque: "Ningún instrumento lo pide: es método, no equipo."
    escalera:
      - "Al escribirla, ¿qué se descubre a menudo de ella?"
    solucion: "Obliga a formularla con precisión."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [3, 9, 18, 38]
    ideas:
      - { titulo: "El método acota.", texto: "Síntomas, hipótesis falsable, comprobación que divide en dos, medida y conclusión." }
      - { titulo: "Antes de todo.", texto: "Inspección visual y alimentación, con su valor y su rizado." }
      - { titulo: "Causa única.", texto: "Varios síntomas suelen tener una sola causa; medidas contradictorias delatan más de un fallo." }
      - { titulo: "El error más caro.", texto: "Sustituir por sospecha: no resuelve y no enseña." }
