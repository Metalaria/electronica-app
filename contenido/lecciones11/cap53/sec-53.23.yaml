# Lección 1.2 de la sección 55.24 «Reparación SMD: lo que Exige Aire Caliente» (cap53; etiqueta interna sec-53.23).
# Formato: contenido/lecciones11/GUIA.md. La sección no tiene figura propia: usa las dos a las que remite, la de las
# cinco técnicas de SMD con soldador (fig-53.34, en cap13, 450,7 × 141,1) y la foto del BGA con su radiografía
# (figura 13.8, fig-13.8, 1600 × 504 píxeles). Sin paso práctico: la sección es una decisión (cuándo bastan el soldador
# y sus técnicas, cuándo hace falta aire caliente y dónde está el límite), con dos «tocar».
leccion: cap53/sec-53.23

libro:
  756: "Un pasivo de dos terminales sale con dos soldadores o con un puente de estaño"
  757: "a menudo es más fácil sacarlo y medirlo fuera"
  760: "Encapsulados con terminales debajo (QFN, BGA): no hay acceso con el soldador."
  761: "Retirar componentes grandes sin dañar la placa."
  764: "sus uniones solo se ven con rayos X"
  "cap13#129": "Las cinco técnicas de SMD con soldador."
  "cap13#97": "la única forma de inspeccionarlas sin desoldar"

modelo: { valores: {}, calculos: {} }

tarjetas:
  - id: explore-tecnicas
    tipo: explorar
    titulo: "Decidir antes de calentar"
    texto: "Muchas averías SMD se resuelven sin aire caliente. Toque las cinco técnicas con soldador."
    libro: [756, "cap13#129"]
    widget:
      tipo: figura
      figura: fig-53.34
      zonas:
        - { id: puente, rotulo: "Primer panel", rect: [4, 4, 94, 132], texto: "Puente de estaño: un pasivo de dos terminales sale con una sola gota que une ambos." }
        - { id: malla, rotulo: "Segundo panel", rect: [100, 4, 84, 132], texto: "Malla: retirar el estaño y despegar las patillas una a una; lento y seguro." }
        - { id: hilo, rotulo: "Tercer panel", rect: [187, 4, 84, 132], texto: "Hilo de acero bajo las patillas: se tira al fundir cada unión." }
        - { id: baja, rotulo: "Cuarto panel", rect: [274, 4, 84, 132], texto: "Aleación de bajo punto de fusión: funde todas las uniones a la vez; hay que limpiar después." }
        - { id: arrastre, rotulo: "Quinto panel", rect: [360, 4, 86, 132], texto: "Arrastre: flux y punta de cincel a lo largo de la fila, para soldar el repuesto." }
    requiere: { mover: [puente, malla, arrastre] }

  - id: pasivo
    tipo: pregunta
    titulo: "Un pasivo de dos terminales"
    texto: "Hay que retirar un condensador SMD de dos terminales. ¿Hace falta la estación de aire caliente?"
    libro: [756]
    widget:
      tipo: figura
      figura: fig-53.34
      zonas:
        - { id: puente, rotulo: "Primer panel", rect: [4, 4, 94, 132] }
        - { id: baja, rotulo: "Cuarto panel", rect: [274, 4, 84, 132] }
    opciones:
      - texto: "No: dos soldadores o un puente de estaño"
        bien: true
        porque: "Calentar los dos terminales a la vez lo suelta sin aire caliente."
      - texto: "Sí: todo SMD exige aire caliente"
        porque: "El aire caliente es la herramienta adecuada, pero en reparación muchas averías se resuelven sin ella."
      - texto: "Sí, o una malla en cada terminal"
        porque: "La malla quita estaño, pero con dos terminales basta calentar ambos a la vez."
    escalera:
      - "Lo que hace falta es calentar los dos terminales a la vez."
    solucion: "No: dos soldadores o un puente de estaño."

  - id: toque-arrastre
    tipo: tocar
    titulo: "Soldar el repuesto"
    texto: "Toque la técnica con la que se suelda el repuesto de un integrado de patillas laterales."
    libro: [756, "cap13#129"]
    widget:
      tipo: figura
      figura: fig-53.34
      zonas:
        - { id: puente, rotulo: "Primer panel", rect: [4, 4, 94, 132] }
        - { id: malla, rotulo: "Segundo panel", rect: [100, 4, 84, 132] }
        - { id: hilo, rotulo: "Tercer panel", rect: [187, 4, 84, 132] }
        - { id: baja, rotulo: "Cuarto panel", rect: [274, 4, 84, 132] }
        - { id: arrastre, rotulo: "Quinto panel", rect: [360, 4, 86, 132] }
    tocar:
      bien: [arrastre]
      porque:
        puente: "Sirve para retirar un pasivo de dos terminales, no para soldar una fila."
        malla: "Retira el estaño para quitar el integrado, no para soldar el nuevo."
        hilo: "Despega las patillas del integrado viejo: es para retirar."
        baja: "Funde todas las uniones para retirar; luego hay que limpiar."
    exito: "El arrastre: flux y punta de cincel a lo largo de cada fila."
    escalera:
      - "Cuatro técnicas sirven para quitar; solo una, para poner."
    solucion: "Quinto panel: la técnica de arrastre."

  - id: medir-fuera
    tipo: pregunta
    titulo: "Un SMD sospechoso"
    texto: "Quiere medir un SMD sospechoso sin el resto del circuito en paralelo. ¿Qué suele ser más fácil?"
    libro: [757]
    widget:
      tipo: figura
      figura: fig-53.34
      zonas:
        - { id: puente, rotulo: "Primer panel", rect: [4, 4, 94, 132] }
        - { id: malla, rotulo: "Segundo panel", rect: [100, 4, 84, 132] }
    opciones:
      - texto: "Sacarlo y medirlo fuera"
        bien: true
        porque: "Con terminales tan pequeños, levantar uno es más difícil que sacar la pieza entera."
      - texto: "Levantar un terminal, como en THT"
        porque: "Con un SMD a menudo es más difícil que sacarlo: el terminal es diminuto y pegado a la placa."
      - texto: "Medirlo en circuito y fiarse"
        porque: "En circuito se mide el conjunto: una lectura mala hay que confirmarla fuera."
    escalera:
      - "¿Qué es más fácil con una pieza diminuta: doblar un terminal o soltar los dos?"
    solucion: "Sacarlo y medirlo fuera."

  - id: exige-aire
    tipo: pregunta
    titulo: "Lo que sí exige aire caliente"
    texto: "¿Cuál de estos trabajos no se puede hacer con el soldador?"
    libro: [760, 761]
    widget:
      tipo: figura
      figura: fig-13.8
      zonas:
        - { id: cara, rotulo: "Foto de la izquierda", rect: [0, 0, 510, 460] }
        - { id: seccion, rotulo: "Foto del centro", rect: [520, 0, 590, 460] }
    opciones:
      - texto: "Un QFN, con los terminales debajo"
        bien: true
        porque: "No hay acceso con el soldador: hacen falta aire caliente o reflujo."
      - texto: "Un integrado de patillas laterales"
        porque: "Sale con malla, hilo de acero o aleación de baja fusión, y se suelda por arrastre."
      - texto: "Una resistencia de dos terminales"
        porque: "Sale con dos soldadores o con un puente de estaño."
    escalera:
      - "¿Dónde están los terminales de un QFN?"
    solucion: "El QFN: sus terminales están debajo."

  - id: almohadilla
    tipo: porque
    titulo: "La almohadilla que no se ve"
    texto: "Un QFN o un DPAK con la almohadilla térmica inferior sin soldar parece bien montado. ¿Por qué es un problema?"
    libro: [760]
    widget:
      tipo: figura
      figura: fig-13.8
      zonas:
        - { id: cara, rotulo: "Foto de la izquierda", rect: [0, 0, 510, 460] }
        - { id: seccion, rotulo: "Foto del centro", rect: [520, 0, 590, 460] }
    opciones:
      - texto: "Su resistencia térmica es muy superior a la prevista"
        bien: true
        porque: "Por esa almohadilla sale el calor: sin soldar, el componente se calienta mucho más."
      - texto: "Queda en cortocircuito con la placa"
        porque: "Sin soldar no hay corto: lo que falta es el camino del calor."
      - texto: "No arranca nunca"
        porque: "Puede funcionar: aparentemente bien, pero caliente de más."
    escalera:
      - "¿Para qué sirve una almohadilla térmica?"
    solucion: "Sin soldar, el calor no sale: resistencia térmica muy superior."

  - id: toque-rayos-x
    tipo: tocar
    titulo: "Un BGA no se inspecciona con lupa"
    texto: "Toque la única forma de ver sus uniones sin desoldarlo."
    libro: [764, "cap13#97"]
    widget:
      tipo: figura
      figura: fig-13.8
      zonas:
        - { id: cara, rotulo: "Foto de la izquierda", rect: [0, 0, 510, 460] }
        - { id: seccion, rotulo: "Foto del centro", rect: [520, 0, 590, 460] }
        - { id: radiografia, rotulo: "Foto de la derecha", rect: [1140, 0, 460, 460] }
    tocar:
      bien: [radiografia]
      porque:
        cara: "La cara inferior, con las bolas: así solo se ve antes de soldarlo."
        seccion: "Una sección cortada: para verla hay que destruir la pieza."
    exito: "La radiografía: las uniones de un BGA solo se ven con rayos X."
    escalera:
      - "Las bolas quedan tapadas por el propio encapsulado."
    solucion: "La de la derecha: la radiografía."

  - id: bga-diagnostico
    tipo: pregunta
    titulo: "El diagnóstico apunta al BGA"
    texto: "Todo indica que falla un BGA. ¿Qué se puede hacer en un banco modesto?"
    libro: [764]
    widget:
      tipo: figura
      figura: fig-13.8
      zonas:
        - { id: cara, rotulo: "Foto de la izquierda", rect: [0, 0, 510, 460] }
        - { id: radiografia, rotulo: "Foto de la derecha", rect: [1140, 0, 460, 460] }
    opciones:
      - texto: "Comprobar alimentaciones, entradas y salidas, y concluir que falla"
        bien: true
        porque: "Se puede concluir que falla, no repararlo; si compensa, lo decide el método de la sección 55.1."
      - texto: "Recalentarlo con el soldador por los bordes"
        porque: "Las uniones están debajo: el soldador no llega."
      - texto: "Inspeccionar las bolas con la lupa"
        porque: "Sus uniones solo se ven con rayos X."
    escalera:
      - "Sin rayos X ni reflujo, ¿qué se puede medir de un integrado?"
    solucion: "Comprobar sus alimentaciones, entradas y salidas, y concluir que falla."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [756, 757, 760, 764]
    ideas:
      - { titulo: "Sin aire caliente.", texto: "Pasivos con dos soldadores o puente; integrados con malla, hilo o baja fusión; arrastre para soldar." }
      - { titulo: "Medir fuera.", texto: "Un SMD sospechoso se saca y se mide fuera." }
      - { titulo: "Lo que lo exige.", texto: "QFN y BGA, con terminales debajo; piezas grandes; trabajo en volumen." }
      - { titulo: "El límite.", texto: "Un BGA solo se ve con rayos X: se concluye que falla, no se repara." }
