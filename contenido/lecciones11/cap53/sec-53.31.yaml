# Lección 1.2 de la sección 55.32 «Seguridad en la Reparación: Litio y Electricidad Estática» (cap53; etiqueta interna
# sec-53.31). Formato: contenido/lecciones11/GUIA.md. La figura 55.55 (fig-53.44, 453,6 × 234,0) con zonas; la tabla
# de signos como emparejar. Paso práctico: «simular» la corriente que deja pasar la resistencia de 1 MΩ de la pulsera
# si se toca tensión (bloque 913: «limita la corriente si se toca tensión»), con los 230 V de la red como ejemplo (el
# libro no da el número en esta sección; el esquema `resistencia` es de continua y la cuenta vale igual en eficaces).
leccion: cap53/sec-53.31

libro:
  904: "una celda dañada puede entrar en fuga térmica"
  907: "No intentar recargarla: puede cortocircuitarse al cargar"
  909: "Un destornillador que cae sobre una placa con la batería conectada produce un cortocircuito de decenas de amperios."
  911: "un MOSFET de puerta fina se daña con 50 a 100 V"
  913: "Pulsera antiestática conectada a tierra a través de su resistencia de 1 MΩ"
  914: "La precaución va dirigida a MOSFET, integrados CMOS, microcontroladores, memorias"
  905: "Celda de litio sana frente a hinchada, y las reglas de manipulación."

modelo:
  valores:
    V_t: { sim: "V", nombre: "tensión que se toca", unidad: V, valor: 230 }
    R_p: { sim: "R_{pulsera}", nombre: "resistencia de la pulsera", unidad: Ω, valor: 1000000 }
  calculos:
    I_p: { expr: "V_t/R_p", sim: "I", nombre: "corriente por la pulsera", unidad: A }
    I_k: { expr: "V_t/1000", sim: "I", nombre: "corriente con 1 kΩ", unidad: A }

tarjetas:
  - id: explore-celda
    tipo: explorar
    titulo: "El mayor riesgo del banco doméstico"
    texto: "Una celda de litio dañada puede entrar en fuga térmica y arder. Toque la celda hinchada y las reglas."
    libro: [904, 905]
    widget:
      tipo: figura
      figura: fig-53.44
      zonas:
        - { id: sana, rotulo: "Arriba a la izquierda", rect: [4, 8, 190, 98], texto: "Sana: plana, bordes uniformes; la tapa asienta." }
        - { id: hinchada, rotulo: "Arriba a la derecha", rect: [210, 8, 200, 98], texto: "Hinchada: bolsa abombada por gas interno, y la tapa levantada." }
        - { id: nunca, rotulo: "Abajo a la izquierda", rect: [2, 112, 223, 120], texto: "Nunca: cargarla hinchada, hacer palanca, soldar sobre ella, dejar terminales al aire, tirarla." }
        - { id: siempre, rotulo: "Abajo a la derecha", rect: [229, 112, 223, 120], texto: "Siempre: desconectar primero, alcohol y paciencia, aislar terminales; si se calienta, arena y al exterior." }
    requiere: { mover: [hinchada, nunca, siempre] }

  - id: empareje-signos
    tipo: pregunta
    fase: "Empareje"
    titulo: "Reconocer una celda peligrosa"
    texto: "Una cada signo con lo que hay que hacer."
    libro: [907]
    emparejar:
      - ["Hinchada", "No cargar, no perforar, no presionar; sustituirla"]
      - ["Olor dulzón", "Sacarla al exterior y no volver a usarla"]
      - ["Caliente sin estar en uso", "Alejarla de todo lo inflamable"]
      - ["Por debajo de 2,5 V", "No intentar recargarla"]
      - ["Envoltura dañada", "No usar"]
    exito: "Caliente sin uso es un cortocircuito interno incipiente: no hay tiempo que perder."
    pistas:
      - { texto: "El olor dulzón es electrolito que escapa." }
    escalera:
      - "Una celda hinchada tiene gas dentro: nada de presión ni carga."
    solucion: "Hinchada: no tocar; olor: fuera; caliente: lejos de lo inflamable; bajo 2,5 V: no cargar; dañada: no usar."

  - id: por-que-descarga
    tipo: porque
    titulo: "Una celda muy descargada"
    texto: "Una celda está por debajo de 2,5 V. ¿Por qué no se intenta recargarla?"
    libro: [907]
    widget:
      tipo: figura
      figura: fig-53.44
      zonas:
        - { id: nunca, rotulo: "Abajo a la izquierda", rect: [2, 112, 223, 120] }
        - { id: hinchada, rotulo: "Arriba a la derecha", rect: [210, 8, 200, 98] }
    opciones:
      - texto: "El cobre interno puede haberse disuelto y cortocircuitarse al cargar"
        bien: true
        porque: "Es una descarga profunda: al cargarla puede formarse un cortocircuito interno."
      - texto: "Porque ya no admite carga"
        porque: "La admite, y ese es el peligro: puede cortocircuitarse al cargar."
      - texto: "Porque tardaría demasiado"
        porque: "No es cuestión de tiempo, sino de un cortocircuito interno."
    escalera:
      - "¿Qué le pasa por dentro a una celda en descarga profunda?"
    solucion: "Puede haberse disuelto el cobre interno: se cortocircuitaría al cargar."

  - id: desconectar
    tipo: pregunta
    titulo: "Antes de cualquier otra cosa"
    texto: "Abre un portátil para cambiar un conector. ¿Qué hace primero?"
    libro: [909]
    widget:
      tipo: figura
      figura: fig-53.44
      zonas:
        - { id: siempre, rotulo: "Abajo a la derecha", rect: [229, 112, 223, 120] }
        - { id: nunca, rotulo: "Abajo a la izquierda", rect: [2, 112, 223, 120] }
    opciones:
      - texto: "Desconectar la batería, no solo apagarlo"
        bien: true
        porque: "Un destornillador que cae sobre la placa con la batería conectada produce decenas de amperios."
      - texto: "Apagarlo"
        porque: "Apagado, la batería sigue conectada a la placa."
      - texto: "Ponerse la pulsera antiestática"
        porque: "También, pero el primer riesgo es la batería conectada."
    escalera:
      - "¿Qué sigue dando corriente con el equipo apagado?"
    solucion: "Desconectar la batería antes que nada."

  - id: fuga-termica
    tipo: pregunta
    titulo: "Una celda que empieza a calentarse"
    texto: "La celda que ha sacado empieza a calentarse sobre la mesa. ¿Qué hace?"
    libro: [904, 909]
    widget:
      tipo: figura
      figura: fig-53.44
      zonas:
        - { id: siempre, rotulo: "Abajo a la derecha", rect: [229, 112, 223, 120] }
        - { id: hinchada, rotulo: "Arriba a la derecha", rect: [210, 8, 200, 98] }
    opciones:
      - texto: "A un recipiente metálico o arena, y al exterior"
        bien: true
        porque: "Ni agua ni CO₂ resuelven una fuga térmica: solo aislarla y dejar que se consuma."
      - texto: "Echarle agua"
        porque: "El agua no apaga una fuga térmica de litio."
      - texto: "El extintor de CO₂"
        porque: "Tampoco la resuelve: hay que aislarla y dejar que se consuma."
    escalera:
      - "¿Se puede apagar una fuga térmica, o solo aislarla?"
    solucion: "Arena o recipiente metálico, y al exterior."

  - id: simule-pulsera
    tipo: simular
    titulo: "Lo que hace segura la pulsera"
    texto: "Con la pulsera puesta, toca por descuido 230 V. ¿Qué corriente deja pasar su resistencia de 1 MΩ?"
    libro: [913]
    fijar: { V_t: 230, R_p: 1000000 }
    widget:
      tipo: circuito
      esquema: resistencia
      piezas: { fuente: V_t, r: R_p }
      lectura: { valor: I_p, rotulo: "Corriente" }
      mide: { corriente: I_p, tension: V_t }
      ocultar: true
      mandos: []
    simular:
      objetivo: I_p
      unidad: A
      tol: 0.03
      rotulo: "Corriente por la pulsera, I"
      medida: corriente
      errores:
        - { expr: "I_k", texto: "Ha dividido entre 1 kΩ: la pulsera tiene 1 MΩ, mil veces más." }
    exito: "Unos 230 µA: la resistencia limita la corriente. Por eso la pulsera es segura."
    escalera:
      - "I = V / R, con la resistencia en ohmios."
    solucion: "230 V / 1 MΩ = 230 µA."
    comprobar:
      - { I_p: 0.00023, I_k: 0.23 }

  - id: latente
    tipo: pregunta
    titulo: "Una reparación que no duró"
    texto: "Cambió un MOSFET sin precauciones; funcionó, y falló semanas después. ¿Qué pudo pasar?"
    libro: [911]
    widget:
      tipo: figura
      figura: fig-53.44
      zonas:
        - { id: nunca, rotulo: "Abajo a la izquierda", rect: [2, 112, 223, 120] }
    opciones:
      - texto: "Un daño latente por electricidad estática"
        bien: true
        porque: "El cuerpo acumula decenas de kilovoltios; un MOSFET de puerta fina se daña con 50 a 100 V."
      - texto: "Nada que ver: fue otra avería"
        porque: "El daño latente es una causa habitual de reparación que no ha durado."
      - texto: "Que el repuesto era falso"
        porque: "Puede ser, pero el daño latente por estática explica justo ese patrón."
    escalera:
      - "El daño de la estática puede no notarse al principio."
    solucion: "Un daño latente por estática: funciona, con la vida reducida."

  - id: tapete
    tipo: pregunta
    titulo: "La superficie de trabajo"
    texto: "¿Sirve un tapete de goma normal como superficie antiestática?"
    libro: [913]
    widget:
      tipo: figura
      figura: fig-53.44
      zonas:
        - { id: siempre, rotulo: "Abajo a la derecha", rect: [229, 112, 223, 120] }
    opciones:
      - texto: "No: aísla, y se busca lo contrario"
        bien: true
        porque: "Hace falta una superficie disipativa conectada a la misma tierra que la pulsera."
      - texto: "Sí: la goma no se carga"
        porque: "Aísla: la carga no se va a ninguna parte."
      - texto: "Sí, si está limpia"
        porque: "Limpia o no, aísla; hace falta una disipativa conectada a tierra."
    escalera:
      - "¿Adónde tiene que ir la carga?"
    solucion: "No: aísla. Hace falta una superficie disipativa a tierra."

  - id: que-proteger
    tipo: pregunta
    titulo: "A qué va dirigida la precaución"
    texto: "¿Cuál de estos componentes necesita de verdad la precaución antiestática?"
    libro: [914]
    widget:
      tipo: figura
      figura: fig-53.44
      zonas:
        - { id: siempre, rotulo: "Abajo a la derecha", rect: [229, 112, 223, 120] }
    opciones:
      - texto: "Una memoria o un integrado CMOS"
        bien: true
        porque: "Todo lo que tiene puerta o entrada de alta impedancia."
      - texto: "Un electrolítico"
        porque: "No sufre: la precaución no va dirigida a él."
      - texto: "Un transistor de potencia"
        porque: "Los componentes robustos no sufren; no hace falta obsesionarse."
    escalera:
      - "¿Qué tiene una «puerta» que una descarga puede perforar?"
    solucion: "Memorias, CMOS, MOSFET, microcontroladores."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [904, 909, 911, 913]
    ideas:
      - { titulo: "Litio.", texto: "Desconectar primero; nunca palanca ni soldar sobre la celda." }
      - { titulo: "Signos.", texto: "Hinchada, olor dulzón, caliente o bajo 2,5 V: no cargar ni usar." }
      - { titulo: "Estática.", texto: "Daño inmediato o latente: falla semanas después." }
      - { titulo: "La pulsera.", texto: "Su 1 MΩ limita la corriente; superficie disipativa, no goma." }
