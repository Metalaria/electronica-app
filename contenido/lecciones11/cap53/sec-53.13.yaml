# Lección 1.2 de la sección 55.14 «La Reparación: Desoldar, Sustituir, Verificar» (cap53; etiqueta interna sec-53.13).
# Formato: contenido/lecciones11/GUIA.md. Figuras 55.33 (las tres fases y la pista levantada) y 55.32 (juntas buena,
# fría, en bola y agrietada) con zonas en su svg_vista. Sin modelo numérico ni paso práctico propio: la sección es de
# procedimiento (dos «ordenar»); la búsqueda de defectos de soldadura con el multímetro está en la 13.10.
leccion: cap53/sec-53.13

libro:
  494: "es donde se dañan placas que estaban sanas"
  496: "Fotografiar la zona, con la orientación de los componentes polarizados"
  497: "Anotar el valor y la referencia del componente que sale"
  498: "Comprobar el repuesto: medirlo antes de montarlo"
  500: "añadir estaño primero, aunque parezca contradictorio"
  501: "Ocurre por exceso de tiempo o de fuerza"
  504: "si no entran, el taladro está obstruido y hay que limpiarlo"
  506: "puede ser corrosivo o conductor a largo plazo"
  509: "Inspección visual de la nueva soldadura, con lupa y luz rasante"
  510: "ausencia de puentes con las almohadillas vecinas"
  511: "Primer encendido con límite de corriente o lámpara serie"
  512: "Comprobar que el síntoma original ha desaparecido, no algo parecido"
  513: "Dejarlo funcionando unas horas antes de darlo por bueno"
  514: "la verificación encontró una segunda avería"
  517: "Un puente de estaño invisible a simple vista destruye lo que se acaba de reparar"
  518: "Aspecto de una junta buena, fría, en bola y agrietada"
  519: "Las tres fases de una sustitución y la reparación de una pista levantada."

modelo: { valores: {}, calculos: {} }

tarjetas:
  - id: explore-fases
    tipo: explorar
    titulo: "Cambiar sin crear un problema nuevo"
    texto: "Sustituir parece mecánico, y es donde se dañan placas sanas. Toque las tres fases."
    libro: [494, 519]
    widget:
      tipo: figura
      figura: fig-53.23
      zonas:
        - { id: antes, rotulo: "Primer recuadro", rect: [2, 4, 140, 80], texto: "Antes de desoldar: anotar el valor real y medir el repuesto." }
        - { id: desoldar, rotulo: "Segundo recuadro", rect: [155, 4, 138, 80], texto: "Desoldar sin dañar: estaño primero, malla con flux, poco tiempo y sin fuerza." }
        - { id: montar, rotulo: "Tercer recuadro", rect: [306, 4, 138, 80], texto: "Al montar: polaridad dos veces, sin forzar, cono cóncavo y flux limpio." }
        - { id: pista, rotulo: "Recuadro de abajo", rect: [4, 92, 441, 127], texto: "Una pista levantada: raspar, puentear con hilo fino y fijarlo con adhesivo." }
    requiere: { mover: [antes, desoldar, montar] }

  - id: ordene-antes
    tipo: pregunta
    fase: "Ordene"
    titulo: "Antes de desoldar"
    texto: "Ordene lo que se hace antes de quitar el componente."
    libro: [496, 497, 498]
    ordenar:
      - "Fotografiar la zona, con la orientación de los polarizados."
      - "Anotar el valor y la referencia del que sale."
      - "Medir el repuesto."
      - "Desoldar."
    exito: "El que sale a veces no coincide con la serigrafía, por reparaciones previas."
    pistas:
      - { texto: "La foto se hace antes de tocar nada." }
    escalera:
      - "El repuesto se comprueba antes de montarlo, y lo viejo se anota antes de quitarlo."
    solucion: "Foto, anotar, medir el repuesto y desoldar."

  - id: estano-primero
    tipo: porque
    titulo: "Añadir estaño para quitarlo"
    texto: "Para desoldar se añade estaño primero, aunque parezca contradictorio. ¿Por qué?"
    libro: [500]
    widget:
      tipo: figura
      figura: fig-53.23
      zonas:
        - { id: desoldar, rotulo: "Segundo recuadro", rect: [155, 4, 138, 80] }
        - { id: pista, rotulo: "Recuadro de abajo", rect: [4, 92, 441, 127] }
    opciones:
      - texto: "Conduce mejor el calor y funde toda la junta con menos tiempo de contacto"
        bien: true
        porque: "Menos tiempo de soldador es menos riesgo de levantar la almohadilla."
      - texto: "Para que la malla tenga más que absorber"
        porque: "La malla no necesita más estaño: lo que se busca es fundir antes la junta entera."
      - texto: "Para tapar la junta vieja"
        porque: "No se tapa nada: se va a retirar."
    escalera:
      - "¿Qué pasa con el calor del soldador sobre una junta casi seca?"
    solucion: "Mejora la conducción térmica: funde la junta con menos tiempo."

  - id: almohadilla
    tipo: pregunta
    titulo: "El riesgo que hay que evitar"
    texto: "¿Qué levanta la almohadilla al desoldar?"
    libro: [501]
    widget:
      tipo: figura
      figura: fig-53.23
      zonas:
        - { id: desoldar, rotulo: "Segundo recuadro", rect: [155, 4, 138, 80] }
        - { id: pista, rotulo: "Recuadro de abajo", rect: [4, 92, 441, 127] }
    opciones:
      - texto: "El exceso de tiempo o de fuerza"
        bien: true
        porque: "En doble cara con vía metalizada suele arruinar la conexión a la otra capa."
      - texto: "Usar malla con flux"
        porque: "La malla con flux abundante es la técnica recomendada."
      - texto: "Cortar las patillas del componente descartado"
        porque: "Es lo menos agresivo con la placa cuando no se va a reutilizar."
    escalera:
      - "La almohadilla está pegada al sustrato: ¿qué la despega?"
    solucion: "Exceso de tiempo o de fuerza."

  - id: no-entra
    tipo: pregunta
    titulo: "Al montar el nuevo"
    texto: "La patilla del componente nuevo no entra en el taladro. ¿Qué se hace?"
    libro: [504, 506]
    widget:
      tipo: figura
      figura: fig-53.23
      zonas:
        - { id: montar, rotulo: "Tercer recuadro", rect: [306, 4, 138, 80] }
        - { id: pista, rotulo: "Recuadro de abajo", rect: [4, 92, 441, 127] }
    opciones:
      - texto: "Limpiar el taladro obstruido, sin forzar"
        bien: true
        porque: "Forzar la patilla puede arrancar la metalización del taladro."
      - texto: "Empujar más fuerte"
        porque: "Forzar es lo que levanta almohadillas y rompe vías."
      - texto: "Soldarla por encima, sin meterla"
        porque: "La junta no tendría la patilla dentro ni el cono cóncavo."
    escalera:
      - "Si no entra, algo lo tapa."
    solucion: "Limpiar el taladro."

  - id: junta-sin-plomo
    tipo: pregunta
    titulo: "La nueva soldadura, con lupa"
    texto: "Con estaño sin plomo, la junta nueva sale mate. ¿Cómo se sabe si es buena?"
    libro: [509, 518]
    widget:
      tipo: figura
      figura: fig-53.22
      zonas:
        - { id: buena, rotulo: "Primera", rect: [0, 0, 112, 140] }
        - { id: fria, rotulo: "Segunda", rect: [113, 0, 112, 140] }
        - { id: bola, rotulo: "Tercera", rect: [226, 0, 112, 140] }
        - { id: agrietada, rotulo: "Cuarta", rect: [339, 0, 111, 140] }
    opciones:
      - texto: "Por la forma: cóncava, mojando pad y patilla"
        bien: true
        porque: "Con sin plomo el mate es normal: la fría se reconoce por la forma, no por el brillo."
      - texto: "Por el brillo: si es mate, está fría"
        porque: "Con estaño sin plomo, el acabado mate es normal."
      - texto: "Por el tamaño: cuanto más estaño, mejor"
        porque: "Más estaño no mejora nada: la bola es precisamente un exceso que no moja."
    escalera:
      - "Fíjese en el perfil de la junta buena."
    solucion: "Por la forma: el cono cóncavo."

  - id: ordene-verificacion
    tipo: pregunta
    fase: "Ordene"
    titulo: "La verificación tras el cambio"
    texto: "Ordene lo que cierra el trabajo."
    libro: [509, 510, 511, 512, 513]
    ordenar:
      - "Inspección visual con lupa y luz rasante."
      - "Continuidad, y ningún puente con las almohadillas vecinas."
      - "Primer encendido con límite de corriente o lámpara serie."
      - "Comprobar el síntoma original y el resto de funciones."
      - "Dejarlo unas horas funcionando y medir temperaturas."
    exito: "No es un trámite: en el caso completo del capítulo, la verificación encontró una segunda avería."
    pistas:
      - { texto: "Todo lo que se hace sin alimentar va antes del primer encendido." }
    escalera:
      - "Las horas de funcionamiento son lo último: el burn-in doméstico."
    solucion: "Lupa, continuidad, encendido limitado, funciones y unas horas de prueba."

  - id: no-encender-ya
    tipo: porque
    titulo: "Encender nada más soldar"
    texto: "Es el error que conviene no cometer y que se comete a menudo. ¿Por qué no encender en cuanto se suelda?"
    libro: [514, 517]
    widget:
      tipo: figura
      figura: fig-53.22
      zonas:
        - { id: buena, rotulo: "Primera", rect: [0, 0, 112, 140] }
        - { id: agrietada, rotulo: "Cuarta", rect: [339, 0, 111, 140] }
    opciones:
      - texto: "Un puente de estaño invisible destruye lo que se acaba de reparar"
        bien: true
        porque: "Mirarlo con lupa cuesta veinte segundos."
      - texto: "Porque el estaño tiene que enfriarse una hora"
        porque: "Solidifica en segundos: lo que falta es inspeccionar."
      - texto: "Porque el flux conduce mientras está caliente"
        porque: "El flux se limpia después, pero el riesgo inmediato es el puente."
    escalera:
      - "¿Qué defecto de soldadura no se ve a simple vista y une dos pads?"
    solucion: "Un puente de estaño: veinte segundos de lupa lo evitan."

  - id: pista-levantada
    tipo: pregunta
    titulo: "Una pista levantada"
    texto: "Se ha reparado una pista con un hilo fino soldado a ambos lados. ¿De qué depende que dure?"
    libro: [519]
    widget:
      tipo: figura
      figura: fig-53.23
      zonas:
        - { id: pista, rotulo: "Recuadro de abajo", rect: [4, 92, 441, 127] }
    opciones:
      - texto: "De fijar el hilo con adhesivo: si no, la fatiga lo rompe en meses"
        bien: true
        porque: "Bien fijada dura indefinidamente; mal fijada, falla por fatiga."
      - texto: "Del grosor del hilo: cuanto más grueso, mejor"
        porque: "Un hilo fino basta; lo que falla es la fijación."
      - texto: "De soldarlo muy caliente"
        porque: "Más calor arriesga levantar más pista."
    escalera:
      - "¿Qué hace la vibración con un hilo suelto?"
    solucion: "De fijarlo con adhesivo."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [494, 500, 509, 517]
    ideas:
      - { titulo: "Antes.", texto: "Foto, valor real anotado y repuesto medido." }
      - { titulo: "Desoldar.", texto: "Estaño primero, malla con flux, poco tiempo y sin fuerza." }
      - { titulo: "Montar.", texto: "Polaridad dos veces, sin forzar, cono cóncavo y flux limpio." }
      - { titulo: "Verificar.", texto: "Lupa, continuidad, encendido limitado, funciones y horas de prueba." }
