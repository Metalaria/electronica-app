# Lección 1.2 de la sección 55.30 «Reparar la Placa Misma» (cap53; etiqueta interna sec-53.29).
# Formato: contenido/lecciones11/GUIA.md. La figura 55.51 (fig-53.40, 450,7 × 156,2) con zonas; los dos procedimientos
# (pad y pista) como ordenar; la tabla de «cuándo darla por perdida» como emparejar. Sin paso práctico simulable: es un
# procedimiento de banco con soldador (la medida de continuidad no tiene un valor que simular).
leccion: cap53/sec-53.29

libro:
  873: "A veces el componente está bien y lo que ha fallado es la placa"
  874: "Reparación de un pad desprendido y de una pista cortada con puente de hilo."
  877: "Limpiar los restos y comprobar con la lupa si la pista que llegaba al pad sigue intacta."
  880: "Confirmar el corte con continuidad entre los dos extremos, no por encima del sitio."
  881: "Una pista quemada es un síntoma, no la avería"
  883: "Se detecta midiendo continuidad entre las dos caras en el mismo punto."
  884: "hay que puentear a otro punto de la misma red que sea accesible"
  886: "Hay que retirar el material carbonizado antes de puentear, o la fuga seguirá"
  888: "un puente suelto se rompe con la primera vibración"

modelo: { valores: {}, calculos: {} }

tarjetas:
  - id: explore-reparaciones
    tipo: explorar
    titulo: "Cuando lo que falla es la placa"
    texto: "Un pad levantado, una pista cortada: se reparan con un puente de hilo. Toque las dos reparaciones."
    libro: [873, 874]
    widget:
      tipo: figura
      figura: fig-53.40
      zonas:
        - { id: pad, rotulo: "La placa de la izquierda", rect: [4, 6, 216, 145], texto: "Pad desprendido: la patilla se suelda con un hilo fino a la pista raspada, no al hueco, y se fija con adhesivo." }
        - { id: pista, rotulo: "La placa de la derecha", rect: [230, 6, 216, 145], texto: "Pista cortada: raspar, estañar, puentear con hilo de la sección adecuada, fijar y barnizar." }
    requiere: { mover: [pad, pista] }

  - id: ordene-pad
    tipo: pregunta
    fase: "Ordene"
    titulo: "Un pad que se ha ido"
    texto: "Ordene la reparación de un pad desprendido."
    libro: [877]
    ordenar:
      - "Limpiar y comprobar con la lupa que la pista sigue intacta"
      - "Raspar el esmalte de la pista hasta ver cobre limpio"
      - "Soldar la patilla a la pista con un hilo fino"
      - "Fijar el hilo con adhesivo o esmalte"
    exito: "Y si el pad conectaba con una vía, hay que llegar a la otra cara."
    pistas:
      - { texto: "No se suelda nada antes de tener cobre limpio." }
    escalera:
      - "Antes de reparar, hay que saber si la pista sigue ahí."
    solucion: "Comprobar la pista, raspar, soldar el hilo y fijarlo."

  - id: ordene-pista
    tipo: pregunta
    fase: "Ordene"
    titulo: "Una pista cortada"
    texto: "Ordene la reparación de una pista cortada."
    libro: [880]
    ordenar:
      - "Confirmar el corte con continuidad entre los dos extremos"
      - "Raspar el esmalte a ambos lados"
      - "Estañar los extremos y puentear con hilo"
      - "Fijar el hilo y cubrir con esmalte o barniz"
    exito: "El hilo, de sección acorde a la corriente; fijado, para que no trabaje."
    pistas:
      - { texto: "Primero se confirma; lo último es proteger." }
    escalera:
      - "Antes de reparar un corte hay que confirmar que existe."
    solucion: "Confirmar, raspar, estañar y puentear, fijar y barnizar."

  - id: confirmar-corte
    tipo: pregunta
    titulo: "Dónde se mide la continuidad"
    texto: "Sospecha un corte en una pista. ¿Dónde pone las puntas del óhmetro?"
    libro: [880]
    widget:
      tipo: figura
      figura: fig-53.40
      zonas:
        - { id: pista, rotulo: "La placa de la derecha", rect: [230, 6, 216, 145] }
    opciones:
      - texto: "En los dos extremos de la pista"
        bien: true
        porque: "Así se mide la pista entera: si hay un corte en cualquier punto, se ve."
      - texto: "A ambos lados de la marca que se ve"
        porque: "Por encima del sitio no basta: el corte puede estar en otro punto, bajo el esmalte."
      - texto: "Entre la pista y masa"
        porque: "Eso buscaría un corto a masa, no un corte."
    escalera:
      - "Lo que importa es que la señal llegue de un extremo al otro."
    solucion: "Entre los dos extremos, no por encima del sitio."

  - id: por-que-sintoma
    tipo: porque
    titulo: "Una pista quemada"
    texto: "Ha puenteado una pista quemada. ¿Por qué no basta?"
    libro: [881]
    widget:
      tipo: figura
      figura: fig-53.40
      zonas:
        - { id: pista, rotulo: "La placa de la derecha", rect: [230, 6, 216, 145] }
        - { id: pad, rotulo: "La placa de la izquierda", rect: [4, 6, 216, 145] }
    opciones:
      - texto: "Es un síntoma: algo hizo pasar una corriente que no debía"
        bien: true
        porque: "Reparar la pista sin encontrar la causa garantiza que vuelva a abrirse."
      - texto: "Porque el hilo es más fino que la pista"
        porque: "Se elige de la sección adecuada; el problema es la causa que sigue ahí."
      - texto: "Porque las pistas quemadas no se reparan"
        porque: "Se reparan; pero antes hay que encontrar por qué se quemó."
    escalera:
      - "¿Qué quema una pista?"
    solucion: "Es un síntoma: hay que encontrar la sobrecorriente que la quemó."

  - id: via-multicapa
    tipo: pregunta
    titulo: "Una vía a una capa interna"
    texto: "Una vía abierta conecta con una capa interna de una placa multicapa. ¿Qué se hace?"
    libro: [883, 884]
    widget:
      tipo: figura
      figura: fig-53.40
      zonas:
        - { id: pad, rotulo: "La placa de la izquierda", rect: [4, 6, 216, 145] }
        - { id: pista, rotulo: "La placa de la derecha", rect: [230, 6, 216, 145] }
    opciones:
      - texto: "Puentear a otro punto accesible de la misma red"
        bien: true
        porque: "La capa interna no se puede reparar: se rodea por fuera."
      - texto: "Pasar un hilo por el agujero"
        porque: "Une las dos caras, pero no llega a la capa interna."
      - texto: "Rellenar la vía de estaño"
        porque: "No restablece la conexión con la capa interna."
    escalera:
      - "Si no se puede llegar a la capa interna, ¿por dónde se llega a esa red?"
    solucion: "Puentear a otro punto accesible de la misma red."

  - id: empareje-perdida
    tipo: pregunta
    fase: "Empareje"
    titulo: "Cuándo darla por perdida"
    texto: "Una cada situación con su veredicto."
    libro: [886]
    emparejar:
      - ["Uno o dos pads o pistas exteriores", "Se repara"]
      - ["Vías a capas internas dañadas", "Solo si hay otro acceso a la red"]
      - ["Delaminación", "Placa perdida"]
      - ["Más de cinco o seis reparaciones en la zona", "Buscar una placa de repuesto"]
    exito: "Y una zona carbonizada: retirar el material antes de puentear; si es extensa, la placa no vale."
    pistas:
      - { texto: "El sustrato abierto en capas no tiene arreglo." }
    escalera:
      - "Con muchas reparaciones en la misma zona, el coste supera al de la placa."
    solucion: "Pocas: se repara; vías internas: otro acceso; delaminación: perdida; muchas: repuesto."

  - id: carbonizada
    tipo: pregunta
    titulo: "Una zona carbonizada"
    texto: "El sustrato bajo una pista quemada se ha vuelto negro. ¿Qué hay que hacer antes de puentear?"
    libro: [886]
    widget:
      tipo: figura
      figura: fig-53.40
      zonas:
        - { id: pista, rotulo: "La placa de la derecha", rect: [230, 6, 216, 145] }
    opciones:
      - texto: "Retirar el material carbonizado"
        bien: true
        porque: "El carbón conduce: si se deja, la fuga seguirá."
      - texto: "Barnizarlo encima"
        porque: "El barniz no corta la fuga: el sustrato carbonizado sigue conduciendo."
      - texto: "Nada: el puente lo resuelve"
        porque: "El puente une el corte, pero la fuga por el carbón sigue."
    escalera:
      - "¿Qué le pasa al sustrato cuando se carboniza?"
    solucion: "Retirar el material carbonizado, o la fuga seguirá."

  - id: fijar-hilo
    tipo: pregunta
    titulo: "Un puente sin fijar"
    texto: "Ha soldado el puente y funciona. ¿Por qué fijarlo con adhesivo?"
    libro: [888]
    widget:
      tipo: figura
      figura: fig-53.40
      zonas:
        - { id: pad, rotulo: "La placa de la izquierda", rect: [4, 6, 216, 145] }
        - { id: pista, rotulo: "La placa de la derecha", rect: [230, 6, 216, 145] }
    opciones:
      - texto: "Suelto, se rompe con la vibración y da un intermitente"
        bien: true
        porque: "Una avería intermitente peor que la original; bien fijado, dura indefinidamente."
      - texto: "Para aislarlo"
        porque: "El aislamiento lo da el esmalte o el barniz; el adhesivo evita que trabaje."
      - texto: "Por estética"
        porque: "Es mecánica: un hilo que trabaja falla por fatiga en meses."
    escalera:
      - "¿Qué le pasa a un hilo que se mueve con cada vibración?"
    solucion: "Para que no trabaje: suelto, se rompe y da un intermitente."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [877, 880, 881, 888]
    ideas:
      - { titulo: "Pad levantado.", texto: "La patilla, con un hilo fino a la pista raspada, no al hueco." }
      - { titulo: "Pista cortada.", texto: "Confirmar entre extremos, raspar, estañar, puentear, fijar y barnizar." }
      - { titulo: "El síntoma.", texto: "Una pista quemada es un síntoma: busque la causa." }
      - { titulo: "En el banco.", texto: "Continuidad tras cada puente, hilo fijado y una foto del arreglo." }
