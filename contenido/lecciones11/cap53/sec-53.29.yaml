# Lección 1.2 de la sección 55.30 «Reparar la Placa Misma» (cap53; etiqueta interna sec-53.29).
# Formato: contenido/lecciones11/GUIA.md. La figura 55.51 (fig-53.40, 450,7 × 156,2) con zonas; los dos procedimientos
# (pad y pista) como ordenar; la tabla de «cuándo darla por perdida» como emparejar. Sin paso práctico simulable: es un
# procedimiento de banco con soldador (la medida de continuidad no tiene un valor que simular).
# 1.2.1 (aprender haciendo): las secuencias en orden y las preguntas como listados que se tocan.
# 1.2.1, segunda pasada: sin listas de respuestas disfrazadas; quedan las tarjetas que se hacen y dos preguntas.
# 1.3 (contenido13b): la exploración pasa a objetivo de zonas: 3/5 → 4/5.
leccion: cap53/sec-53.29

libro:
  876: "Ocurre al desoldar con demasiado calor o al forzar un"
  873: "A veces el componente está bien y lo que ha fallado es la placa"
  874: "Reparación de un pad desprendido y de una pista cortada con puente de hilo."
  877: "Limpiar los restos y comprobar con la lupa si la pista que llegaba al pad sigue intacta."
  880: "Confirmar el corte con continuidad entre los dos extremos, no por encima del sitio."
  881: "Una pista quemada es un síntoma, no la avería"
  883: "Se detecta midiendo continuidad entre las dos caras en el mismo punto."
  884: "hay que puentear a otro punto de la misma red que sea accesible"
  886: "Hay que retirar el material carbonizado antes de puentear, o la fuga seguirá"
  888: "un puente suelto se rompe con la primera vibración"

modelo: { valores: {}, calculos: {} }

tarjetas:
  - id: explore-reparaciones
    tipo: explorar
    titulo: "Cuando lo que falla es la placa"
    texto: "Un pad levantado, una pista cortada: se reparan con un puente de hilo. Toque las dos reparaciones."
    libro: [873, 874]
    widget:
      tipo: figura
      figura: fig-53.40
      zonas:
        - { id: pad, rotulo: "La placa de la izquierda", rect: [4, 6, 216, 145], texto: "Pad desprendido: la patilla se suelda con un hilo fino a la pista raspada, no al hueco, y se fija con adhesivo." }
        - { id: pista, rotulo: "La placa de la derecha", rect: [230, 6, 216, 145], texto: "Pista cortada: raspar, estañar, puentear con hilo de la sección adecuada, fijar y barnizar." }
    objetivo:
      condiciones:
        - { zona: pad, rotulo: "Una reparación" }
        - { zona: pista, rotulo: "La otra" }
      logrado: "Pad desprendido y pista cortada: los dos se arreglan con un puente de hilo fino sobre cobre raspado, fijado después."
      pistas:
        - { texto: "Toque las dos placas." }
    escalera:
      - "Una placa a cada lado."
    solucion: "La placa de la izquierda y la de la derecha."

  - id: ordene-pad
    tipo: tocar
    titulo: "Un pad que se ha ido"
    texto: "En la placa de la izquierda, toque los rótulos en el orden de la reparación."
    libro: [877]
    widget:
      tipo: figura
      figura: fig-53.40
      zonas:
        - { id: ladhesivo, rotulo: "Rótulo «adhesivo / esmalte»", rect: [84, 10, 46, 36] }
        - { id: lhilo, rotulo: "Rótulo «hilo fino soldado»", rect: [18, 32, 64, 36] }
        - { id: lraspado, rotulo: "Rótulo «esmalte raspado»", rect: [35, 94, 66, 36] }
    tocar:
      bien: [lraspado, lhilo, ladhesivo]
      orden: true
      porque:
        ladhesivo: "Fijar va al final."
        lhilo: "No se suelda nada antes de tener cobre limpio."
    exito: "Y si el pad conectaba con una vía, hay que llegar a la otra cara."
    escalera:
      - "Antes de soldar, cobre limpio."
    solucion: "Raspar, soldar el hilo y fijarlo."

  - id: donde-soldar
    tipo: tocar
    titulo: "La patilla, a la pista"
    texto: "El pad se ha desprendido. Toque dónde se suelda el hilo que viene de la patilla."
    libro: [876, 877]
    widget:
      tipo: figura
      figura: fig-53.40
      zonas:
        - { id: hueco, rotulo: "Círculo de trazos", rect: [124, 70, 36, 36] }
        - { id: raspado, rotulo: "Punto en la pista, a la izquierda", rect: [76, 72, 36, 36] }
        - { id: componente, rotulo: "El componente", rect: [126, 8, 62, 36] }
    tocar:
      bien: [raspado]
      porque:
        hueco: "Ahí ya no queda cobre: es el pad desprendido."
        componente: "De ahí sale el hilo; no es su destino."
    exito: "La patilla a la pista, no al hueco, y el hilo fijado con adhesivo."
    escalera:
      - "Busque el cobre que sigue unido a la placa."
    solucion: "En la pista raspada."

  - id: ultimo-paso
    tipo: tocar
    titulo: "Lo último en una pista cortada"
    texto: "En la placa de la derecha, toque lo que se hace al final."
    libro: [880]
    widget:
      tipo: figura
      figura: fig-53.40
      zonas:
        - { id: corte, rotulo: "Tramo negro de la pista", rect: [318, 72, 40, 36] }
        - { id: extremo, rotulo: "Extremo derecho de la pista", rect: [358, 70, 36, 36] }
        - { id: fijar, rotulo: "Óvalo sobre el puente", rect: [318, 34, 48, 36] }
    tocar:
      bien: [fijar]
      porque:
        corte: "Es lo primero: confirmar el corte con continuidad."
        extremo: "Raspar y estañar va antes del puente."
    exito: "Fijar y barnizar, para que el hilo no trabaje."
    escalera:
      - "Primero se confirma; lo último es proteger."
    solucion: "El adhesivo o esmalte sobre el puente."

  - id: por-que-sintoma
    tipo: porque
    titulo: "Una pista quemada"
    texto: "Ha puenteado una pista quemada. ¿Por qué no basta?"
    libro: [881]
    widget:
      tipo: figura
      figura: fig-53.40
      zonas:
        - { id: pista, rotulo: "La placa de la derecha", rect: [230, 6, 216, 145] }
        - { id: pad, rotulo: "La placa de la izquierda", rect: [4, 6, 216, 145] }
    opciones:
      - texto: "Es un síntoma: algo hizo pasar una corriente que no debía"
        bien: true
        porque: "Reparar la pista sin encontrar la causa garantiza que vuelva a abrirse."
      - texto: "Porque el hilo es más fino que la pista"
        porque: "Se elige de la sección adecuada; el problema es la causa que sigue ahí."
      - texto: "Porque las pistas quemadas no se reparan"
        porque: "Se reparan; pero antes hay que encontrar por qué se quemó."
    escalera:
      - "¿Qué quema una pista?"
    solucion: "Es un síntoma: hay que encontrar la sobrecorriente que la quemó."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [877, 880, 881, 888, 883, 884, 886]
    ideas:
      - { titulo: "Pad levantado.", texto: "La patilla, con un hilo fino a la pista raspada, no al hueco." }
      - { titulo: "Pista cortada.", texto: "Confirmar entre extremos, raspar, estañar, puentear, fijar y barnizar." }
      - { titulo: "El síntoma.", texto: "Una pista quemada es un síntoma: busque la causa." }
      - { titulo: "En el banco.", texto: "Continuidad tras cada puente, hilo fijado y una foto del arreglo." }
