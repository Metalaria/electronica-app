# Lección 1.2 de la sección 55.3 «Inspección sin Alimentar: lo que se Ve» (cap53; etiqueta interna sec-53.3).
# Formato: contenido/lecciones11/GUIA.md. Figuras con zonas: 55.6 (los cuatro estados de un electrolítico), 55.8 (luz
# frontal y rasante) y 55.9 (qué buscar), en las coordenadas de su svg_vista; fotos 55.7 (1600 × 505) y 55.10
# (1600 × 313), en píxeles. Sin modelo numérico. Pasos prácticos: dos «tocar» sobre las fotos de averías reales.
leccion: cap53/sec-53.3

libro:
  68: "La inspección visual es el paso que más averías resuelve por minuto invertido"
  69: "no requiere alimentar el aparato"
  71: "El exterior: golpes, manchas, olores, cable dañado, conector suelto."
  72: "La placa en conjunto, con luz buena y a distancia"
  73: "Zona por zona con lupa"
  74: "La cara de soldaduras, con luz rasante."
  75: "de lo general a lo particular"
  79: "Iluminar la placa casi paralelamente a su superficie hace que cualquier irregularidad proyecte sombra."
  80: "Grietas en las soldaduras, invisibles con luz frontal."
  81: "Anillos alrededor de las patillas, que indican fatiga."
  86: "Reponerlo sin averiguarlo lo vuelve a quemar"
  87: "Es el fallo más común de todos"
  89: "la flexión de la placa los parte"
  96: "presionar suavemente cada componente y cada conector con una punta de plástico"
  97: "Cualquier movimiento indica una soldadura rota."
  100: "Quemado agrio y penetrante: una resistencia o una resina sobrecalentada."
  101: "Olor a pescado: el aislamiento de un transformador o de una bobina que ha sufrido."
  102: "Olor característico y persistente: un electrolítico reventado"
  106: "Semiconductores muertos sin marca externa, que es lo habitual."
  107: "Componentes fuera de valor sin señal visible."
  110: "la inspección es el primer paso, no el único"
  112: "una vez desoldado un componente ya no se puede volver a observar en su estado original"
  113: "fotografiar la placa por ambas caras antes de desmontar nada"
  114: "Cuatro estados de un electrolítico a simple vista"
  115: "uno que ha reventado"
  116: "Iluminación frontal frente a rasante"
  117: "Qué buscar en una inspección visual y lo que no puede ver."
  118: "resistencia completamente carbonizada"

modelo: { valores: {}, calculos: {} }

tarjetas:
  - id: explore-electroliticos
    tipo: explorar
    titulo: "El electrolítico, a simple vista"
    texto: "Es el fallo más común de todos, y se ve. Toque cada estado y lea su firma."
    libro: [87, 114]
    widget:
      tipo: figura
      figura: fig-53.3
      zonas:
        - { id: sano, rotulo: "Primero", rect: [0, 0, 112, 234], texto: "Sano: tapa plana, ranuras cerradas, sin restos." }
        - { id: abombado, rotulo: "Segundo", rect: [113, 0, 112, 234], texto: "Abombado: el gas interno ha empujado la tapa." }
        - { id: reventado, rotulo: "Tercero", rect: [226, 0, 113, 234], texto: "Reventado: las ranuras se abren en pétalos." }
        - { id: fugado, rotulo: "Cuarto", rect: [340, 0, 113, 234], texto: "Fugado por la base: una mancha marrón que corroe las pistas." }
    requiere: { mover: [abombado, reventado, fugado] }

  - id: toque-reventado
    tipo: tocar
    titulo: "En una placa de verdad"
    texto: "Toque el electrolítico que ha reventado."
    libro: [115]
    widget:
      tipo: figura
      figura: fig-14.5
      zonas:
        - { id: sanos, rotulo: "Foto de la izquierda", rect: [0, 0, 905, 450] }
        - { id: izquierda, rotulo: "Derecha, el de detrás", rect: [940, 0, 170, 300] }
        - { id: reventado, rotulo: "Derecha, el del centro", rect: [1025, 160, 180, 285] }
        - { id: derecha, rotulo: "Derecha, los dos de la derecha", rect: [1205, 90, 390, 355] }
    tocar:
      bien: [reventado]
      porque:
        sanos: "Tapas planas con la cruz de rotura intacta: están sanos."
        izquierda: "Su tapa está abombada, pero la cruz no se ha abierto."
        derecha: "Abombados por la presión del electrolito degradado, pero aún cerrados."
    exito: "El del centro ha reventado: la envoltura se ha abierto y se ve el bobinado."
    escalera:
      - "Busque el que ya no tiene la forma de un cilindro."
    solucion: "El del centro de la foto de la derecha, en primer plano."

  - id: ordene-inspeccion
    tipo: pregunta
    fase: "Ordene"
    titulo: "El orden de la inspección"
    texto: "Ordene la inspección, de lo general a lo particular."
    libro: [71, 72, 73, 74, 75]
    ordenar:
      - "El exterior: golpes, manchas, olores, cables."
      - "La placa en conjunto, con luz buena y a distancia."
      - "Zona por zona con lupa."
      - "La cara de soldaduras, con luz rasante."
    exito: "De lo general a lo particular, en lugar de ir directamente donde se sospecha."
    pistas:
      - { texto: "Primero lo que se ve sin abrir; la lupa, después de la vista de conjunto." }
    escalera:
      - "La luz rasante busca lo más pequeño: va al final."
    solucion: "Exterior, placa en conjunto, zona por zona con lupa y soldaduras con luz rasante."

  - id: luz-rasante
    tipo: pregunta
    titulo: "La luz casi paralela"
    texto: "Con la linterna apoyada en el borde de la mesa, ¿qué aparece que con luz frontal no se ve?"
    libro: [79, 80, 81, 116]
    widget:
      tipo: figura
      figura: fig-53.4
      zonas:
        - { id: frontal, rotulo: "Mitad izquierda", rect: [0, 0, 225, 195] }
        - { id: rasante, rotulo: "Mitad derecha", rect: [237, 0, 216, 195] }
    opciones:
      - texto: "Grietas y anillos alrededor de las patillas"
        bien: true
        porque: "Cualquier irregularidad proyecta sombra: la grieta anular se ve."
      - texto: "Los semiconductores muertos"
        porque: "Mueren sin marca externa: ninguna luz los delata."
      - texto: "Las resistencias fuera de valor"
        porque: "Un valor no se ve: se mide."
    escalera:
      - "Piense en lo que hace una luz casi horizontal con cualquier relieve."
    solucion: "Grietas, anillos de fatiga, componentes levantados y restos de flux."

  - id: explore-buscar
    tipo: explorar
    titulo: "Qué buscar"
    texto: "Toque la lista, la inspección por el olfato y lo que la inspección no ve."
    libro: [110, 117]
    widget:
      tipo: figura
      figura: fig-14.6
      zonas:
        - { id: lista, rotulo: "La lista de la izquierda", rect: [3, 17, 250, 168], texto: "Calor, electrolíticos, soldaduras, corrosión, daños, fusibles y reparaciones previas." }
        - { id: no-ve, rotulo: "Recuadro rojo", rect: [264, 2, 188, 83], texto: "Semiconductores muertos, valores fuera de tolerancia, pistas rotas bajo la máscara: el primer paso, no el único." }
        - { id: olfato, rotulo: "Recuadro naranja", rect: [264, 150, 188, 66], texto: "Abrir el aparato y oler antes de nada: los olores son diagnósticos." }
    requiere: { mover: [lista, no-ve] }

  - id: toque-carbonizada
    tipo: tocar
    titulo: "Señales de calor"
    texto: "La pista más valiosa: señala dónde se disipó lo que no debía. Toque la resistencia completamente carbonizada."
    libro: [86, 118]
    widget:
      tipo: figura
      figura: fig-14.7
      zonas:
        - { id: punto, rotulo: "Foto de la izquierda", rect: [0, 0, 700, 260] }
        - { id: carbonizada, rotulo: "Foto del centro", rect: [735, 0, 455, 260] }
        - { id: seccion, rotulo: "Foto de la derecha", rect: [1222, 0, 378, 260] }
    tocar:
      bien: [carbonizada]
      porque:
        punto: "Solo tiene un punto quemado en la capa de laca."
        seccion: "Es la sección de dos resistencias: el núcleo sigue blanco y solo la película se ha ennegrecido."
    exito: "Y la pregunta no es solo qué la sustituye, sino qué la llevó a disipar tanto: si no, se vuelve a quemar."
    escalera:
      - "Busque la que ha perdido el color y las bandas por completo."
    solucion: "La del centro."

  - id: olores
    tipo: pregunta
    fase: "Empareje"
    titulo: "El olfato también diagnostica"
    texto: "Una cada olor con lo que delata."
    libro: [100, 101, 102]
    emparejar:
      - ["Quemado agrio y penetrante", "Resistencia o resina sobrecalentada"]
      - ["Olor a pescado", "Aislamiento de un transformador o una bobina"]
      - ["Característico y persistente", "Electrolítico reventado"]
    exito: "A menudo el olfato acota la zona más deprisa que el multímetro."
    pistas:
      - { texto: "El pescado es el del aislamiento de un bobinado." }
    escalera:
      - "Lo inconfundible una vez conocido es el electrolito."
    solucion: "Agrio: resistencia o resina; pescado: transformador o bobina; persistente: electrolítico."

  - id: prueba-mecanica
    tipo: pregunta
    titulo: "La prueba mecánica"
    texto: "Sin alimentar, se presiona cada componente con una punta de plástico y el transformador se mueve. ¿Qué indica?"
    libro: [96, 97]
    widget:
      tipo: figura
      figura: fig-14.6
      zonas:
        - { id: lista, rotulo: "La lista de la izquierda", rect: [3, 17, 250, 168] }
        - { id: herramientas, rotulo: "Recuadro azul", rect: [264, 90, 188, 57] }
    opciones:
      - texto: "Una soldadura rota: probable causa de un fallo intermitente"
        bien: true
        porque: "En componentes pesados es la causa más probable de un intermitente."
      - texto: "Que el transformador está quemado"
        porque: "Moverse no dice nada de su bobinado: dice que su sujeción, la soldadura, ha cedido."
      - texto: "Nada: los transformadores siempre tienen holgura"
        porque: "Cualquier movimiento indica una soldadura rota."
    escalera:
      - "¿Qué sujeta un componente a la placa?"
    solucion: "Una soldadura rota."

  - id: ceramicos
    tipo: pregunta
    titulo: "Los cerámicos del borde"
    texto: "¿Dónde se buscan grietas en los condensadores cerámicos, y por qué?"
    libro: [89, 117]
    widget:
      tipo: figura
      figura: fig-14.6
      zonas:
        - { id: lista, rotulo: "La lista de la izquierda", rect: [3, 17, 250, 168] }
        - { id: no-ve, rotulo: "Recuadro rojo", rect: [264, 2, 188, 83] }
    opciones:
      - texto: "En los grandes cerca del borde: la flexión de la placa los parte"
        bien: true
        porque: "Los cerámicos son frágiles y el borde es lo que más se flexiona."
      - texto: "Junto al regulador, por el calor"
        porque: "El calor degrada electrolíticos; a los cerámicos los parte la flexión."
      - texto: "En ninguno: los cerámicos no se agrietan"
        porque: "Sí: son frágiles, sobre todo los grandes."
    escalera:
      - "¿Qué zona de la placa se dobla más al manipularla?"
    solucion: "Los grandes, cerca del borde."

  - id: no-ve
    tipo: pregunta
    titulo: "Lo que la inspección no ve"
    texto: "Una placa sin ninguna marca visible. ¿Qué avería puede tener igualmente?"
    libro: [106, 107, 110]
    widget:
      tipo: figura
      figura: fig-53.4
      zonas:
        - { id: frontal, rotulo: "Mitad izquierda", rect: [0, 0, 225, 195] }
        - { id: rasante, rotulo: "Mitad derecha", rect: [237, 0, 216, 195] }
    opciones:
      - texto: "Un semiconductor muerto"
        bien: true
        porque: "Lo habitual es que muera sin marca externa: por eso la inspección es el primer paso, no el único."
      - texto: "Un electrolítico reventado"
        porque: "Ese se ve: ranuras abiertas en pétalos."
      - texto: "Un puente de estaño"
        porque: "El estaño donde no debe se ve con lupa."
    escalera:
      - "Piense en lo que falla por dentro sin cambiar de aspecto."
    solucion: "Un semiconductor muerto, o un componente fuera de valor."

  - id: antes-de-tocar
    tipo: porque
    titulo: "Antes de desmontar"
    texto: "Lo encontrado se anota y la placa se fotografía por las dos caras antes de desoldar nada. ¿Por qué?"
    libro: [112, 113]
    widget:
      tipo: figura
      figura: fig-14.7
      zonas:
        - { id: punto, rotulo: "Foto de la izquierda", rect: [0, 0, 700, 260] }
        - { id: carbonizada, rotulo: "Foto del centro", rect: [735, 0, 455, 260] }
    opciones:
      - texto: "Porque desoldado, un componente ya no muestra su estado original"
        bien: true
        porque: "Y la foto sirve además para el montaje y para ver si algo cambia durante la reparación."
      - texto: "Porque lo exige el cliente"
        porque: "Es para el propio diagnóstico: lo que se pierde al desoldar es la pista."
      - texto: "Para poder limpiarla después con alcohol"
        porque: "El alcohol ayuda a ver; anotar y fotografiar es para no perder lo que había."
    escalera:
      - "¿Qué se pierde para siempre al desoldar?"
    solucion: "Desoldado, ya no se puede volver a observar en su estado original."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [68, 69, 75, 79, 110]
    ideas:
      - { titulo: "Primero mirar.", texto: "Es lo que más averías resuelve por minuto, y no puede empeorar nada." }
      - { titulo: "En orden.", texto: "Exterior, placa, zona por zona con lupa y soldaduras con luz rasante." }
      - { titulo: "Qué buscar.", texto: "Calor, electrolíticos, soldaduras, cerámicos, corrosión; y oler." }
      - { titulo: "Lo que no ve.", texto: "Semiconductores muertos y valores derivados: es el primer paso, no el único." }
