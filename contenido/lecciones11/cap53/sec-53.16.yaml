# Lección 1.2 de la sección 55.17 «El Generador del FNIRSI: la Tercera Herramienta que Casi Nadie Usa» (cap53;
# etiqueta interna sec-53.16). Formato: contenido/lecciones11/GUIA.md. El circuito es el del bloque 599: 10 kΩ y
# 100 nF (τ = 1 ms); el mismo RC, como paso bajo, sirve de filtro que se barre con el generador (corte en 159 Hz,
# calculado). Amplitud de 1 V, dentro de los 0,1–3 V del generador.
# Pasos prácticos: «dibujar» la respuesta en frecuencia del barrido y «banco» del τ con la cuadrada del generador
# (ficha 26 del cuaderno, la práctica de carga y descarga).
leccion: cap53/sec-53.16

libro:
  594: "frecuencia de 1 Hz a 50 kHz en pasos de 1 Hz, amplitud de 0,1 a 3 V"
  596: "se inyecta una conocida y se mira qué sale"
  597: "Barrido de 20 Hz a 50 kHz"
  598: "se recorre la frecuencia en pasos (100 Hz, 1 kHz, 10 kHz, 50 kHz)"
  599: "Con un condensador de 100 nF y 10 kΩ, τ = 1 ms: perfectamente visible."
  600: "Para inyectar los 10,7 MHz de la FI de un receptor hace falta otro generador"
  602: "Inyectar 3 V en la entrada de un preamplificador lo satura y no aprende nada."

modelo:
  valores:
    V_g: { sim: "V_{p}", nombre: "amplitud del generador", unidad: V, valor: 1 }
    f_g: { sim: "f", nombre: "frecuencia del generador", unidad: Hz, valor: 100 }
    R_g: { sim: "R", nombre: "resistencia", unidad: Ω, valor: 10000 }
    C_g: { sim: "C", nombre: "condensador", unidad: F, valor: 100e-9 }
    V_q: { sim: "V", nombre: "nivel de la cuadrada", unidad: V, valor: 1 }
    q_on: { tipo: interruptor, nombre: "cuadrada en alto", valor: 1 }
  calculos:
    x_g: { expr: "2*pi*f_g*R_g*C_g", sim: "ωRC", nombre: "ωRC", unidad: "" }
    A_g: { expr: "V_g/sqrt(1 + x_g^2)", sim: "V_{salida}", nombre: "amplitud a la salida", unidad: V }
    ph_g: { expr: "-atan(x_g)*180/pi", sim: "φ", nombre: "fase a la salida", unidad: "°" }
    f_c: { expr: "1/(2*pi*R_g*C_g)", sim: "f_{c}", nombre: "corte a −3 dB", unidad: Hz }
    tau_g: { expr: "R_g*C_g", sim: "τ", nombre: "constante de tiempo", unidad: s }
    v_tau: { expr: "0.632*V_q", sim: "v(τ)", nombre: "tensión en un τ", unidad: V }

tarjetas:
  - id: explore-barrido
    tipo: explorar
    titulo: "Respuesta en frecuencia sin analizador"
    texto: "Fije la amplitud y recorra la frecuencia en pasos, como en el libro. Mire cuánto sale de este RC."
    libro: [594, 598]
    fijar: { V_g: 1, R_g: 10000, C_g: 100e-9 }
    widget:
      tipo: circuito
      esquema: filtro-rc
      piezas: { fuente: V_g, f: f_g, r: R_g, c: C_g }
      lectura: { valor: A_g, rotulo: "Amplitud a la salida" }
      datos:
        - { valor: f_c, rotulo: "Corte: {{f_c}}" }
      grafica:
        x: { id: nu, min: 10, max: 50000, unidad: Hz, rotulo: "f", escala: log }
        y: { min: 0, max: 1.1, unidad: V, rotulo: "amplitud" }
        curvas:
          - { expr: "V_g/sqrt(1 + (2*pi*nu*R_g*C_g)^2)", color: naranja, rotulo: "salida", mide: vc_amp }
        marcas:
          - { x: "f_g", y: "A_g", rotulo: "{{f_g}}" }
      mide: { vc_amp: A_g, vc_fase: ph_g }
      mandos:
        - { valor: f_g, lista: [100, 1000, 10000, 50000], rotulo: "Frecuencia del generador" }
    requiere: { mover: [f_g] }

  - id: dibuje-barrido
    tipo: dibujar
    titulo: "Dibuje lo que da el barrido"
    texto: "Con 1 V del generador sobre 10 kΩ y 100 nF, dibuje la amplitud de salida de 20 Hz a 50 kHz."
    libro: [597, 598, 599]
    fijar: { V_g: 1, R_g: 10000, C_g: 100e-9 }
    dibujar:
      x: { id: nu, min: 20, max: 50000, unidad: Hz, rotulo: "f", escala: log }
      y: { min: 0, max: 1.1, unidad: V, rotulo: "amplitud" }
      curva: "V_g/sqrt(1 + (2*pi*nu*R_g*C_g)^2)"
      puntos: 17
      tol: 0.08
      holgura: 0.05
      rotulo: "Salida del RC frente a la frecuencia"
    exito: "Plana abajo, cae en torno al corte de 159 Hz y sigue cayendo: con cuatro o cinco puntos se localiza el −3 dB."
    pistas:
      - { cuando: { valor: desfase, mayor: 0.1 }, texto: "Cae demasiado tarde: con 10 kΩ y 100 nF, el corte está por debajo de 1 kHz." }
      - { cuando: { valor: desfase, menor: -0.1 }, texto: "Cae demasiado pronto: a 20 Hz casi todo pasa." }
      - { texto: "Es un paso bajo: plana a frecuencias bajas y cayendo por encima del corte." }
    escalera:
      - "El corte está donde la reactancia del condensador iguala a la resistencia."
    solucion: "Unos 0,99 V a 20 Hz, 0,71 V a 159 Hz y casi nada a 50 kHz."
    comprobar:
      - { f_c: 159, tol: 0.01 }
      - { con: { f_g: 20 }, A_g: 0.99, tol: 0.01 }
      - { con: { f_g: 159.15 }, A_g: 0.707, tol: 0.01 }

  - id: que-inyectar
    tipo: pregunta
    fase: "Empareje"
    titulo: "Qué inyectar en cada etapa"
    texto: "Una cada etapa con la señal que se le inyecta."
    libro: [596, 597]
    emparejar:
      - ["Amplificador de audio", "Senoide de 1 kHz, 100 mV"]
      - ["Filtro", "Barrido de 20 Hz a 50 kHz"]
      - ["Comparador o lógica", "Cuadrada de 1 kHz"]
      - ["Integrador o red RC", "Cuadrada lenta"]
      - ["Entrada de un ADC", "Continua ajustable"]
    exito: "Con el generador en un canal y el osciloscopio en el otro, se ve entrada y salida a la vez."
    pistas:
      - { texto: "La red RC muestra su exponencial con una cuadrada lenta." }
    escalera:
      - "Un filtro se caracteriza recorriendo frecuencias."
    solucion: "Audio: senoide de 1 kHz; filtro: barrido; lógica: cuadrada; RC: cuadrada lenta; ADC: continua."

  - id: explore-tau
    tipo: explorar
    titulo: "Un condensador por su constante de tiempo"
    texto: "Una cuadrada lenta del generador, a través de 10 kΩ, hacia 100 nF: el osciloscopio muestra la carga."
    libro: [599]
    fijar: { V_q: 1, R_g: 10000, q_on: 1 }
    widget:
      tipo: circuito
      esquema: carga-rc
      piezas: { fuente: V_q, r: R_g, c: C_g, interruptor: q_on }
      lectura: { valor: tau_g, rotulo: "Constante de tiempo" }
      grafica:
        x: { id: t, min: 0, max: 0.005, unidad: s, rotulo: "t" }
        y: { min: 0, max: 1.1, unidad: V, rotulo: "v_{C}" }
        curvas:
          - { expr: "V_q*(1 - exp(-t/tau_g))", color: naranja, rotulo: "v_{C}", mide: vc }
        marcas:
          - { x: "tau_g", y: "v_tau", rotulo: "63 %" }
      mandos:
        - { valor: C_g, lista: [47e-9, 100e-9, 220e-9], rotulo: "Condensador" }
    requiere: { mover: [C_g] }

  - id: estime-tau
    tipo: pregunta
    fase: "Estime"
    titulo: "El tiempo hasta el 63 %"
    texto: "Con 100 nF y 10 kΩ, ¿cuánto tarda en llegar al 63 %?"
    libro: [599]
    fijar: { R_g: 10000, C_g: 100e-9 }
    estimar:
      objetivo: "tau_g"
      unidad: s
      min: 0
      max: 0.005
      paso: 0.00005
      inicio: 0.004
      tol: 0.05
      rotulo: "τ = R · C"
    exito: "1 ms: perfectamente visible en el osciloscopio. Midiendo τ se obtiene el valor del condensador."
    pistas:
      - { cuando: { valor: estimacion, mayor: 0.00105 }, texto: "Se ha pasado: 10 kΩ por 100 nF da milisegundos, pocos." }
      - { texto: "Se ha quedado corto: 10⁴ Ω · 10⁻⁷ F." }
    escalera:
      - "τ = R · C, en ohmios y faradios."
    solucion: "10 kΩ · 100 nF = 1 ms."
    comprobar:
      - { tau_g: 0.001 }

  - id: banco-tau
    tipo: banco
    titulo: "Mídalo en el banco"
    texto: "Con la cuadrada lenta del generador del FNIRSI, 10 kΩ y 100 nF, mida τ con los cursores."
    libro: [599]
    fijar: { R_g: 10000, C_g: 100e-9 }
    banco:
      piezas: ["FNIRSI 2C53T: generador en un canal, osciloscopio en el otro", "Resistencia de 10 kΩ", "Condensador de 100 nF"]
      medir: "El tiempo desde el flanco hasta que el condensador llega al 63 % de la cuadrada."
      esperado: tau_g
      unidad: s
      tol: 0.15
      consejos:
        - { cuando: { valor: desviacion, menor: -0.15 }, texto: "Sale corto: el condensador tiene menos capacidad de la marcada, o la cuadrada es demasiado rápida." }
        - { cuando: { valor: desviacion, mayor: 0.15 }, texto: "Sale largo: compruebe la resistencia y el 63 % del nivel alto, no del pico a pico." }
        - { texto: "Dentro de lo esperado: τ da directamente el valor del condensador." }
      ficha: { n: 26, titulo: "Práctica 2 · Carga y descarga de un condensador" }

  - id: techo
    tipo: pregunta
    titulo: "El techo de 50 kHz"
    texto: "Hay que inyectar los 10,7 MHz de la FI de un receptor. ¿Qué se puede hacer con el FNIRSI?"
    libro: [594, 600]
    fijar: { V_g: 1, R_g: 10000, C_g: 100e-9, f_g: 50000 }
    widget:
      tipo: circuito
      esquema: filtro-rc
      piezas: { fuente: V_g, f: f_g, r: R_g, c: C_g }
      lectura: { valor: A_g, rotulo: "Amplitud a la salida" }
      mide: { vc_amp: A_g }
    opciones:
      - texto: "Usar los armónicos de una cuadrada de 50 kHz, aunque débiles"
        bien: true
        porque: "Es el truco clásico; si no, hace falta otro generador."
      - texto: "Ponerlo a 10,7 MHz"
        porque: "Llega a 50 kHz: no alcanza la radiofrecuencia."
      - texto: "Subir la amplitud a 3 V"
        porque: "La amplitud no cambia la frecuencia máxima."
    escalera:
      - "Una cuadrada tiene armónicos impares hasta bastante arriba."
    solucion: "Los armónicos de una cuadrada de 50 kHz, o otro generador."

  - id: amplitud-baja
    tipo: pregunta
    titulo: "Empezar con amplitud baja"
    texto: "¿Por qué no inyectar los 3 V del generador en la entrada de un preamplificador?"
    libro: [602]
    fijar: { V_g: 1, R_g: 10000, C_g: 100e-9 }
    widget:
      tipo: circuito
      esquema: filtro-rc
      piezas: { fuente: V_g, f: f_g, r: R_g, c: C_g }
      lectura: { valor: A_g, rotulo: "Amplitud a la salida" }
      mide: { vc_amp: A_g }
    opciones:
      - texto: "Lo satura y no se aprende nada"
        bien: true
        porque: "Se empieza con amplitud baja y se sube."
      - texto: "Porque el generador no da tanto"
        porque: "Da hasta 3 V; el problema es la etapa, no el generador."
      - texto: "Porque se mide peor la frecuencia"
        porque: "La frecuencia se ve igual; la saturación deforma la salida."
    escalera:
      - "¿Qué hace una etapa de ganancia alta con una entrada grande?"
    solucion: "Lo satura: amplitud baja y subir."

  - id: acoplar
    tipo: porque
    titulo: "Acoplar con un condensador"
    texto: "Si la entrada tiene continua, se inyecta a través de un condensador. ¿Por qué con este generador?"
    libro: [602]
    fijar: { V_g: 1, R_g: 10000, C_g: 100e-9 }
    widget:
      tipo: circuito
      esquema: filtro-rc
      piezas: { fuente: V_g, f: f_g, r: R_g, c: C_g }
      lectura: { valor: A_g, rotulo: "Amplitud a la salida" }
      mide: { vc_amp: A_g }
    opciones:
      - texto: "Su salida es siempre positiva, con una continua igual a la mitad de su amplitud"
        bien: true
        porque: "Esa continua desplaza el punto de trabajo de la etapa."
      - texto: "Porque su salida es de alta frecuencia"
        porque: "La frecuencia no tiene que ver: es la continua lo que molesta."
      - texto: "Para que no se descargue la batería"
        porque: "El condensador bloquea la continua, no ahorra batería."
    escalera:
      - "¿Qué componente de la señal del generador no es alterna?"
    solucion: "Su continua desplaza el punto de trabajo."

  - id: otro-canal
    tipo: pregunta
    titulo: "Mire el generador, no lo suponga"
    texto: "¿Para qué ver la salida del generador en el otro canal mientras se prueba?"
    libro: [602]
    fijar: { V_g: 1, R_g: 10000, C_g: 100e-9 }
    widget:
      tipo: circuito
      esquema: filtro-rc
      piezas: { fuente: V_g, f: f_g, r: R_g, c: C_g }
      lectura: { valor: A_g, rotulo: "Amplitud a la salida" }
      mide: { vc_amp: A_g }
    opciones:
      - texto: "Para ver si el circuito lo carga y le deforma la señal"
        bien: true
        porque: "Lo que se inyecta de verdad puede no ser lo que marca el generador."
      - texto: "Para tener el disparo en ese canal"
        porque: "Puede servir, pero la razón del libro es ver si el circuito lo carga."
      - texto: "No hace falta: el generador es exacto"
        porque: "Exacto en vacío; cargado por el circuito, la señal cambia."
    escalera:
      - "¿Qué le pasa a una fuente cuando se le conecta una carga?"
    solucion: "Para ver si el circuito lo carga."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [594, 598, 599, 602]
    ideas:
      - { titulo: "Ensayo activo.", texto: "Se inyecta una señal conocida y se mira qué sale." }
      - { titulo: "Barrido.", texto: "Cuatro o cinco frecuencias bastan para el corte a −3 dB." }
      - { titulo: "τ.", texto: "Con una cuadrada lenta: 10 kΩ y 100 nF dan 1 ms." }
      - { titulo: "En el banco.", texto: "Amplitud baja, condensador de acoplo y el generador a la vista en el otro canal." }
