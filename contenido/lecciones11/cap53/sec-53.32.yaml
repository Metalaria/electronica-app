# Lección 1.2 de la sección 55.33 «Ecodiseño y Derecho a Reparar: el Marco que lo Respalda» (cap53; etiqueta interna
# sec-53.32). Formato: contenido/lecciones11/GUIA.md. La figura 55.56 (fig-53.45, 450,7 × 232,6) con zonas; lo que
# establece la directiva como emparejar; fechas, alcance y consecuencias como preguntas. Sin paso práctico simulable:
# el banco de la sección (buscar la documentación y el precio de los repuestos de un aparato propio) va como pregunta.
leccion: cap53/sec-53.32

libro:
  917: "en buena parte una obligación legal"
  919: "El ecodiseño regula cómo debe ser el producto"
  920: "Entró en vigor el 30 de julio de 2024, con veinticuatro meses para su transposición, de modo que su aplicación plena llegó el 31 de julio de 2026."
  922: "el fabricante debe ofrecer reparación también cuando la garantía legal ya ha vencido"
  923: "en algunas llega hasta diez años desde que la última unidad salió al mercado"
  925: "incluida la vinculación de una pieza a un número de serie concreto"
  926: "Extensión de la garantía cuando el consumidor opta por reparar en lugar de sustituir."
  927: "para que se puedan comparar presupuestos"
  929: "Nacido en Francia en 2021"
  935: "Desde mediados de 2025, teléfonos y tabletas muestran esa puntuación en el punto de venta."
  940: "Emparejar una batería de cinco años con una carcasa de quince en una pieza inseparable condena el producto entero."
  942: "La política de precios de repuestos es lo que determina si la reparación ocurre."
  947: "Un instrumento de laboratorio, un equipo industrial o una placa de desarrollo no están cubiertos."
  953: "hacerlo antes de comprar el siguiente aparato"
  954: "El marco normativo de ecodiseño y reparación, y lo que implica al diseñar."

modelo: { valores: {}, calculos: {} }

tarjetas:
  - id: explore-marco
    tipo: explorar
    titulo: "Reparar, ahora con respaldo legal"
    texto: "En la Unión Europea, reparar es en buena parte una obligación legal. Toque las dos piezas del marco."
    libro: [917, 954]
    widget:
      tipo: figura
      figura: fig-53.45
      zonas:
        - { id: ecodiseno, rotulo: "Arriba a la izquierda", rect: [2, 3, 147, 122], texto: "Ecodiseño: cómo debe ser el producto. Repuestos, documentación y diseño desmontable, por categorías." }
        - { id: directiva, rotulo: "Arriba a la derecha", rect: [153, 3, 295, 122], texto: "La directiva de reparación: reparar tras la garantía, repuestos razonables, sin bloqueo por número de serie, formulario normalizado." }
        - { id: disena, rotulo: "Abajo, a lo ancho", rect: [2, 130, 446, 60], texto: "Para quien diseña: prever repuestos, documentar, diseñar para desmontar, sin serializar piezas." }
        - { id: precio, rotulo: "La línea roja del final", rect: [2, 192, 446, 39], texto: "Si el repuesto cuesta casi lo mismo que el producto nuevo, nadie repara." }
    requiere: { mover: [ecodiseno, directiva, disena] }

  - id: empareje-directiva
    tipo: pregunta
    fase: "Empareje"
    titulo: "Qué establece la directiva"
    texto: "Una cada asunto con lo que dispone la directiva."
    libro: [922, 925, 926, 927]
    emparejar:
      - ["Garantía vencida", "El fabricante debe ofrecer reparación"]
      - ["Pieza vinculada a un número de serie", "Prohibido"]
      - ["Reparar en lugar de sustituir", "Extiende la garantía"]
      - ["Formulario europeo normalizado", "Presupuestos comparables"]
    exito: "Y repuestos a precio razonable, también para reparadores independientes."
    pistas:
      - { texto: "La vinculación al número de serie es una técnica que impide reparar." }
    escalera:
      - "La directiva premia reparar: alarga la garantía de quien lo elige."
    solucion: "Garantía vencida: reparar; número de serie: prohibido; reparar: más garantía; formulario: comparar."

  - id: fechas
    tipo: pregunta
    titulo: "Desde cuándo"
    texto: "La Directiva (UE) 2024/1799 dio veinticuatro meses para su transposición. ¿Cuándo llegó su aplicación plena?"
    libro: [920]
    widget:
      tipo: figura
      figura: fig-53.45
      zonas:
        - { id: directiva, rotulo: "Arriba a la derecha", rect: [153, 3, 295, 122] }
    opciones:
      - texto: "El 31 de julio de 2026"
        bien: true
        porque: "Veinticuatro meses después de su entrada en vigor, el 30 de julio de 2024."
      - texto: "El 30 de julio de 2024"
        porque: "Es su entrada en vigor; la aplicación plena llegó dos años después."
      - texto: "En junio de 2024"
        porque: "Es la fecha de la directiva; luego vinieron la entrada en vigor y la transposición."
    escalera:
      - "Entró en vigor en julio de 2024; sume dos años."
    solucion: "El 31 de julio de 2026."

  - id: cuanto-dura
    tipo: pregunta
    titulo: "Cuánto tiempo hay que reparar"
    texto: "¿Hasta cuándo debe ofrecer reparación el fabricante?"
    libro: [923]
    widget:
      tipo: figura
      figura: fig-53.45
      zonas:
        - { id: ecodiseno, rotulo: "Arriba a la izquierda", rect: [2, 3, 147, 122] }
        - { id: directiva, rotulo: "Arriba a la derecha", rect: [153, 3, 295, 122] }
    opciones:
      - texto: "Lo que fije el ecodiseño de su categoría: hasta diez años"
        bien: true
        porque: "Va ligado al periodo de repuestos; en algunas, diez años desde la última unidad."
      - texto: "Lo que dure la garantía legal"
        porque: "Al contrario: la obligación sigue cuando la garantía ya ha vencido."
      - texto: "Siempre diez años, en todo"
        porque: "Depende de la categoría; diez años es el máximo de algunas."
    escalera:
      - "¿Qué pieza del marco fija los años de repuestos?"
    solucion: "El periodo de repuestos del ecodiseño de cada categoría: hasta diez años."

  - id: indice
    tipo: pregunta
    titulo: "El índice de reparabilidad"
    texto: "Nació en Francia en 2021. ¿Dónde lo ve hoy un comprador de un teléfono?"
    libro: [929, 935]
    widget:
      tipo: figura
      figura: fig-53.45
      zonas:
        - { id: ecodiseno, rotulo: "Arriba a la izquierda", rect: [2, 3, 147, 122] }
    opciones:
      - texto: "En el punto de venta, desde mediados de 2025"
        bien: true
        porque: "Teléfonos y tabletas muestran la puntuación al comprarlos."
      - texto: "Solo en la documentación técnica"
        porque: "Se muestra en el punto de venta: es para comparar antes de comprar."
      - texto: "En ninguna parte: es solo francés"
        porque: "Se adoptó después en el marco europeo de ecodiseño."
    escalera:
      - "Un índice sirve para comparar antes de comprar."
    solucion: "En el punto de venta, desde mediados de 2025."

  - id: disenar
    tipo: pregunta
    titulo: "Para quien diseña"
    texto: "Una batería que dura cinco años, sellada con una carcasa que dura quince. ¿Qué pasa?"
    libro: [940]
    widget:
      tipo: figura
      figura: fig-53.45
      zonas:
        - { id: disena, rotulo: "Abajo, a lo ancho", rect: [2, 130, 446, 60] }
    opciones:
      - texto: "Condena el producto entero"
        bien: true
        porque: "Cuando falla la batería, no se puede cambiar: el desmontaje es un requisito de diseño."
      - texto: "Nada: se cambia la batería"
        porque: "En una pieza inseparable no se puede cambiar sola."
      - texto: "Solo afecta a la garantía"
        porque: "Afecta a todo el producto: se tira entero por una pieza."
    escalera:
      - "¿Se puede cambiar una pieza sellada con otra?"
    solucion: "Condena el producto entero: tornillos, conectores y nada sellado."

  - id: por-que-precio
    tipo: porque
    titulo: "Lo que decide más que la norma"
    texto: "La ley obliga a ofrecer repuestos. ¿Por qué, aun así, a veces nadie repara?"
    libro: [942]
    widget:
      tipo: figura
      figura: fig-53.45
      zonas:
        - { id: precio, rotulo: "La línea roja del final", rect: [2, 192, 446, 39] }
        - { id: disena, rotulo: "Abajo, a lo ancho", rect: [2, 130, 446, 60] }
    opciones:
      - texto: "Porque el repuesto cuesta casi lo mismo que el producto nuevo"
        bien: true
        porque: "La política de precios de repuestos es lo que determina si la reparación ocurre."
      - texto: "Porque la ley no se cumple"
        porque: "Aun cumpliéndose, si el repuesto es caro nadie repara."
      - texto: "Porque reparar es difícil"
        porque: "Con documentación y repuestos se repara; lo que frena es el precio."
    escalera:
      - "Ponga en una balanza el repuesto y el aparato nuevo."
    solucion: "El precio del repuesto frente al del producto nuevo."

  - id: no-cubre
    tipo: pregunta
    titulo: "Lo que la norma no resuelve"
    texto: "¿Cuál de estos aparatos no está cubierto por las obligaciones de reparación?"
    libro: [947]
    widget:
      tipo: figura
      figura: fig-53.45
      zonas:
        - { id: directiva, rotulo: "Arriba a la derecha", rect: [153, 3, 295, 122] }
    opciones:
      - texto: "Un instrumento de laboratorio"
        bien: true
        porque: "Fuera de las categorías del anexo, todo sigue dependiendo del fabricante."
      - texto: "Un teléfono"
        porque: "Está en el anexo, con las tabletas."
      - texto: "Una lavadora"
        porque: "Está en el anexo, con lavavajillas y frigoríficos."
    escalera:
      - "El anexo cubre electrodomésticos, teléfonos, pantallas y poco más."
    solucion: "Un instrumento de laboratorio: no está en el anexo."

  - id: en-el-banco
    tipo: pregunta
    titulo: "La aplicación más útil"
    texto: "¿Cuándo conviene buscar la documentación de reparación y el precio de los repuestos de un aparato?"
    libro: [953]
    widget:
      tipo: figura
      figura: fig-53.45
      zonas:
        - { id: precio, rotulo: "La línea roja del final", rect: [2, 192, 446, 39] }
    opciones:
      - texto: "Antes de comprar el siguiente"
        bien: true
        porque: "Comparar lo que se encuentra con lo que la norma exige dice mucho del fabricante."
      - texto: "Solo cuando se estropea"
        porque: "Entonces ya está comprado; antes de comprar es cuando más sirve."
      - texto: "Nunca: lo resuelve el servicio técnico"
        porque: "La norma también da derechos a quien repara por su cuenta."
    escalera:
      - "¿Cuándo puede todavía elegir otro fabricante?"
    solucion: "Antes de comprar el siguiente aparato."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [919, 920, 922, 942]
    ideas:
      - { titulo: "Dos piezas.", texto: "El ecodiseño dice cómo es el producto; la directiva, qué se puede exigir." }
      - { titulo: "Desde 2026.", texto: "Reparación tras la garantía, repuestos razonables, sin bloqueo por número de serie." }
      - { titulo: "Al diseñar.", texto: "Repuestos previstos, documentación entregable y desmontaje como requisito." }
      - { titulo: "El precio.", texto: "Si el repuesto cuesta como el nuevo, nadie repara." }
