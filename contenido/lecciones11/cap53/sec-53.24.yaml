# Lección 1.2 de la sección 55.25 «Los Límites de tu Instrumental, Dicho Honestamente» (cap53; etiqueta interna
# sec-53.24). Formato: contenido/lecciones11/GUIA.md. La figura 55.46 (fig-53.35, 450,7 × 180,7) con zonas; la
# conversión de decibelios a tanto por ciento como gráfica viva con el suelo de la tarjeta de sonido (−80 dB) y el de la
# FFT de 8 bits (−50 a −60 dB). Sin paso práctico simulable: el banco de la sección (medir el suelo de cada instrumento)
# no tiene un valor esperado en el libro; va como pregunta.
leccion: cap53/sec-53.24

libro:
  767: "conviene saber dónde están sus límites, para no sacar conclusiones equivocadas"
  769: "Por encima, la lectura es incorrecta sin avisar."
  774: "Un instrumento de 100 MHz mide bien flancos de más de 10 ns, y falsea los más rápidos."
  775: "Resolución vertical de 8 bits, que limita la medida de señales pequeñas sobre grandes"
  780: "Lo que sí se puede es comparar, que para diagnóstico basta."
  771: "Impedancia de entrada de 10 MΩ"
  782: "Medir distorsión por debajo de unos −80 dB (0,01 %)"
  787: "Análisis de firma comparativo con dos componentes"
  795: "Un dato sin incertidumbre no es una medida"
  797: "Un multímetro del 1 % basta para casi todo, porque las diferencias que importan son de decenas de por ciento."
  801: "lo único que se sabe es que está por debajo de ese valor"
  802: "Lo que el instrumental modesto no puede hacer y lo que sí."

modelo:
  valores:
    S_db: { sim: "suelo", nombre: "suelo del instrumento", unidad: dB, valor: -80 }
  calculos:
    S_pc: { expr: "100*10^(S_db/20)", sim: "suelo", nombre: "suelo en tanto por ciento", unidad: "%", cifras: 2 }

tarjetas:
  - id: explore-limites
    tipo: explorar
    titulo: "Lo que no se puede, y lo que sí"
    texto: "Un banco modesto cubre casi todo, si se conocen sus límites. Toque los tres cuadros."
    libro: [767, 802]
    widget:
      tipo: figura
      figura: fig-53.35
      zonas:
        - { id: no, rotulo: "Arriba a la izquierda", rect: [4, 4, 220, 108], texto: "Emisiones para certificación, ruido de fase, distorsión muy baja, dentro de un BGA, un integrado por dentro." }
        - { id: si, rotulo: "Arriba a la derecha", rect: [228, 4, 220, 108], texto: "Firma comparativa, ESR en circuito, suelo de ruido, tiempos de ns, preconformidad EMC, puntos calientes." }
        - { id: honestidad, rotulo: "Abajo, a lo ancho", rect: [4, 115, 444, 63], texto: "Un dato sin incertidumbre no es una medida: medir una vez el suelo de cada instrumento." }
    requiere: { mover: [no, si, honestidad] }

  - id: multimetro-alterna
    tipo: pregunta
    titulo: "El multímetro en alterna"
    texto: "Mide con el multímetro una senoide de decenas de kilohercios. ¿Qué pasa con la lectura?"
    libro: [769]
    widget:
      tipo: figura
      figura: fig-53.35
      zonas:
        - { id: no, rotulo: "Arriba a la izquierda", rect: [4, 4, 220, 108] }
        - { id: honestidad, rotulo: "Abajo, a lo ancho", rect: [4, 115, 444, 63] }
    opciones:
      - texto: "Es incorrecta, y no avisa"
        bien: true
        porque: "La mayoría mide bien hasta unos pocos kilohercios; por encima, se equivoca en silencio."
      - texto: "Marca OL"
        porque: "No hay aviso: da un número, y está mal."
      - texto: "Es correcta si el multímetro es de verdadero valor eficaz"
        porque: "El verdadero valor eficaz no amplía el ancho de banda: también tiene su límite."
    escalera:
      - "¿Hasta qué frecuencia mide bien un multímetro corriente en alterna?"
    solucion: "Incorrecta sin avisar: el ancho de banda llega a unos pocos kilohercios."

  - id: flanco-rapido
    tipo: pregunta
    titulo: "Un flanco más rápido que el osciloscopio"
    texto: "Con un osciloscopio de 100 MHz mira un flanco más rápido que 10 ns. ¿Qué ve?"
    libro: [774]
    widget:
      tipo: figura
      figura: fig-53.35
      zonas:
        - { id: no, rotulo: "Arriba a la izquierda", rect: [4, 4, 220, 108] }
        - { id: si, rotulo: "Arriba a la derecha", rect: [228, 4, 220, 108] }
    opciones:
      - texto: "Un flanco falseado, más lento de lo que es"
        bien: true
        porque: "Es la regla de tres veces: por debajo de 10 ns, el ancho de banda lo falsea."
      - texto: "El flanco real, con menos resolución vertical"
        porque: "La resolución vertical es otro límite; el ancho de banda deforma el flanco en el tiempo."
      - texto: "Nada: la pantalla queda en blanco"
        porque: "Se ve una traza, y parece buena: por eso hay que conocer el límite."
    escalera:
      - "Un instrumento lento redondea lo que es más rápido que él."
    solucion: "Un flanco falseado: 100 MHz mide bien a partir de 10 ns."

  - id: ocho-bits
    tipo: pregunta
    titulo: "Señal pequeña sobre una grande"
    texto: "Quiere ver un rizado pequeño montado sobre una continua grande con el osciloscopio de 8 bits. ¿Qué lo limita?"
    libro: [775]
    widget:
      tipo: figura
      figura: fig-53.35
      zonas:
        - { id: no, rotulo: "Arriba a la izquierda", rect: [4, 4, 220, 108] }
        - { id: si, rotulo: "Arriba a la derecha", rect: [228, 4, 220, 108] }
    opciones:
      - texto: "La resolución vertical de 8 bits"
        bien: true
        porque: "Con la escala para la grande, la pequeña cabe en pocos escalones."
      - texto: "El ancho de banda"
        porque: "El rizado es lento; el problema es cuántos niveles le tocan."
      - texto: "La profundidad de memoria"
        porque: "Esa decide los detalles rápidos en capturas largas, no los pequeños sobre grandes."
    escalera:
      - "¿Cuántos niveles distintos tiene un convertidor de 8 bits para toda la pantalla?"
    solucion: "La resolución vertical de 8 bits."

  - id: explore-suelo
    tipo: explorar
    titulo: "Decibelios y tanto por ciento"
    texto: "Una distorsión de −80 dB es un 0,01 %. Cambie el suelo y mire cuánto es en tanto por ciento."
    libro: [782]
    widget:
      tipo: grafica
      x: { id: db, min: -100, max: -20, unidad: dB, rotulo: "nivel" }
      y: { min: 0.001, max: 10, unidad: "%", rotulo: "tanto por ciento", escala: log }
      curvas:
        - { expr: "100*10^(db/20)", color: azul, rotulo: "nivel en %" }
      marcas:
        - { x: "S_db", y: "S_pc", rotulo: "suelo: {{S_pc}}" }
      lectura: { valor: S_pc, rotulo: "Suelo en tanto por ciento" }
      mandos:
        - { valor: S_db, rotulo: "Suelo del instrumento", lista: [-80, -60, -50], nombres: [tarjeta de sonido, FFT de 8 bits, FFT de 8 bits peor] }
    comprobar:
      - { S_pc: 0.01 }

  - id: estime-fft
    tipo: pregunta
    fase: "Estime"
    titulo: "El suelo de la FFT"
    texto: "La FFT de un osciloscopio de 8 bits tiene el suelo hacia −60 dB. ¿Qué distorsión es eso, en tanto por ciento?"
    libro: [782]
    fijar: { S_db: -60 }
    estimar:
      objetivo: "S_pc"
      unidad: "%"
      min: 0
      max: 1
      paso: 0.01
      inicio: 0.8
      tol: 0.05
      rotulo: "100 · 10^{dB/20}"
    exito: "0,1 %: basta para ver la distorsión de cruce o el recorte, no para medir una distorsión baja."
    pistas:
      - { cuando: { valor: estimacion, mayor: 0.105 }, texto: "Se ha pasado: −60 dB es mayor que −80 dB, pero no tanto." }
      - { texto: "Se ha quedado corto: −80 dB son un 0,01 %, y −60 dB, diez veces más." }
    escalera:
      - "Veinte decibelios más son un factor diez en amplitud."
    solucion: "−60 dB es una milésima: 0,1 %."
    comprobar:
      - { S_pc: 0.1 }

  - id: empareje-sorprende
    tipo: pregunta
    fase: "Empareje"
    titulo: "Lo que sí se puede, y sorprende"
    texto: "Una cada medida con el modo de hacerla en un banco modesto."
    libro: [787]
    emparejar:
      - ["Análisis de firma", "Comparativo, con dos componentes"]
      - ["ESR", "En circuito, con su medidor"]
      - ["Suelo de ruido", "Con la entrada terminada"]
      - ["Tiempos de nanosegundos", "Con la captura de un temporizador"]
      - ["Preconformidad EMC", "Comparativa, con una sonda casera"]
      - ["Puntos calientes", "Con una cámara térmica de móvil"]
    exito: "Ninguna exige un laboratorio: solo saber cómo."
    pistas:
      - { texto: "La EMC no se certifica en casa, pero sí se compara." }
    escalera:
      - "La firma se compara; la ESR se mide sin desoldar."
    solucion: "Firma: comparativo; ESR: en circuito; ruido: entrada terminada; ns: temporizador; EMC: sonda casera; calor: cámara."

  - id: certificacion
    tipo: pregunta
    titulo: "Emisiones electromagnéticas"
    texto: "Un aparato quizá emite de más. ¿Qué puede hacer con su banco?"
    libro: [780]
    widget:
      tipo: figura
      figura: fig-53.35
      zonas:
        - { id: no, rotulo: "Arriba a la izquierda", rect: [4, 4, 220, 108] }
        - { id: si, rotulo: "Arriba a la derecha", rect: [228, 4, 220, 108] }
    opciones:
      - texto: "Comparar, que para diagnóstico basta"
        bien: true
        porque: "Certificar exige cámara y receptor calibrado; comparar antes y después, no."
      - texto: "Certificarlo con la FFT del osciloscopio"
        porque: "Hace falta cámara y receptor calibrado: no se certifica en un banco."
      - texto: "Nada"
        porque: "La preconformidad comparativa con una sonda casera sí está al alcance."
    escalera:
      - "¿Hace falta un valor absoluto para saber si un cambio mejora?"
    solucion: "Comparar: la preconformidad comparativa basta para diagnosticar."

  - id: por-que-suelo
    tipo: porque
    titulo: "Exactitud o suelo"
    texto: "Para diagnosticar no hace falta exactitud metrológica. ¿Qué sí hace falta saber?"
    libro: [797, 801]
    widget:
      tipo: figura
      figura: fig-53.35
      zonas:
        - { id: honestidad, rotulo: "Abajo, a lo ancho", rect: [4, 115, 444, 63] }
        - { id: si, rotulo: "Arriba a la derecha", rect: [228, 4, 220, 108] }
    opciones:
      - texto: "El suelo del instrumento, para no confundir su ruido con el del circuito"
        bien: true
        porque: "Si lo medido está en el suelo, solo se sabe que el valor real está por debajo."
      - texto: "Su calibración, con certificado"
        porque: "Un multímetro del 1 % basta: las diferencias que importan son de decenas de por ciento."
      - texto: "El número de cifras de la pantalla"
        porque: "Las cifras no dicen dónde empieza el ruido del propio instrumento."
    escalera:
      - "¿Qué se sabe de una medida que coincide con el ruido del instrumento?"
    solucion: "El suelo de cada instrumento."

  - id: anotar
    tipo: pregunta
    titulo: "Cómo se anota una medida dudosa"
    texto: "Mide −45 dB de distorsión con su montaje y sospecha que es el suelo del instrumento. ¿Qué anota en el cuaderno?"
    libro: [795]
    widget:
      tipo: figura
      figura: fig-53.35
      zonas:
        - { id: honestidad, rotulo: "Abajo, a lo ancho", rect: [4, 115, 444, 63] }
        - { id: no, rotulo: "Arriba a la izquierda", rect: [4, 4, 220, 108] }
    opciones:
      - texto: "−45 dB con mi montaje, probablemente el suelo del instrumento"
        bien: true
        porque: "Dentro de un año esa nota sigue valiendo; un número a secas parecería definitivo."
      - texto: "−45 dB"
        porque: "Un dato sin incertidumbre no es una medida: no dice que puede ser el instrumento."
      - texto: "Nada, porque no es fiable"
        porque: "Saber que está por debajo de ese valor también es información."
    escalera:
      - "¿Qué necesitará saber usted mismo dentro de un año?"
    solucion: "La medida con su contexto: con mi montaje, probablemente el suelo."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [767, 771, 780, 795, 797]
    ideas:
      - { titulo: "Multímetro.", texto: "Pocos kilohercios en alterna, factor de cresta, 10 MΩ y burden." }
      - { titulo: "Osciloscopio.", texto: "Ancho de banda, 8 bits, memoria y la sonda." }
      - { titulo: "Comparar.", texto: "Lo que no se puede medir en absoluto, a menudo se puede comparar." }
      - { titulo: "Honestidad.", texto: "Conocer el suelo de cada instrumento y anotar con qué se midió." }
