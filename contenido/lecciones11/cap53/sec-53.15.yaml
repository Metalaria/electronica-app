# Lección 1.2 de la sección 55.16 «El Cuaderno de Averías» (cap53; etiqueta interna sec-53.15).
# Formato: contenido/lecciones11/GUIA.md. La figura 55.35 (una ficha de ejemplo y lo que emerge con el tiempo) con
# zonas en su svg_vista (453,6 × 255,6). Sin modelo numérico ni paso práctico propio: la sección es de hábito.
leccion: cap53/sec-53.15

libro:
  554: "al cabo de un año se convierte en la mejor referencia disponible"
  558: "no «la fuente estaba mal», sino «5 V con 800 mV de rizado, ESR de C12 = 8 Ω»"
  559: "La causa, no solo el componente sustituido"
  561: "El tiempo empleado, que sirve para decidir en el futuro si compensa."
  562: "Lo que no funcionó: las hipótesis descartadas"
  564: "Anotar los callejones sin salida evita repetirlos, y es lo que nunca se anota."
  568: "El punto exacto, con su designador"
  569: "El valor medido y el esperado."
  570: "Las condiciones: alimentado o no, con carga o sin ella, frío o caliente."
  571: "El instrumento y su escala, porque afecta a la medida"
  572: "detecta las incoherencias que delatan una segunda avería"
  574: "esa referencia propia vale más que cualquier tabla general"
  578: "Buscable, para poder encontrar por modelo o por síntoma."
  583: "a la tercera vez se diagnostica en minutos"
  587: "las averías reparadas son la mejor lista de lo que hay que evitar al diseñar"
  591: "lo que se anota de memoria pierde precisamente los detalles que lo hacían útil"
  592: "Los campos de un cuaderno de averías y lo que emerge con el tiempo."

modelo: { valores: {}, calculos: {} }

tarjetas:
  - id: explore-emerge
    tipo: explorar
    titulo: "Lo que emerge con el tiempo"
    texto: "Su valor crece con el tiempo: al cabo de un año es la mejor referencia. Toque lo que aparece."
    libro: [554, 583, 587, 592]
    widget:
      tipo: figura
      figura: fig-53.25
      zonas:
        - { id: modelo, rotulo: "Primer recuadro verde", rect: [264, 80, 188, 38], texto: "Patrones por modelo: el mismo aparato falla igual; a la tercera, minutos." }
        - { id: componente, rotulo: "Segundo recuadro verde", rect: [264, 122, 188, 38], texto: "Patrones por componente: una serie de condensadores que falla sistemáticamente." }
        - { id: progreso, rotulo: "Tercer recuadro verde", rect: [264, 165, 188, 38], texto: "El propio progreso, y los errores de método que se repiten." }
        - { id: disenar, rotulo: "Recuadro azul", rect: [264, 208, 188, 45], texto: "Su otro uso: las averías reparadas son la mejor lista de lo que hay que evitar al diseñar." }
    requiere: { mover: [modelo, componente, disenar] }

  - id: toque-causa
    tipo: tocar
    titulo: "El campo que separa cambiar de reparar"
    texto: "En la ficha de ejemplo, toque el campo que dice por qué falló, no solo qué se cambió."
    libro: [559, 592]
    widget:
      tipo: figura
      figura: fig-53.25
      zonas:
        - { id: medido, rotulo: "Tercera fila de la ficha", rect: [5, 66, 245, 38] }
        - { id: causa, rotulo: "Cuarta fila de la ficha", rect: [5, 104, 245, 38] }
        - { id: nofunciono, rotulo: "Última fila de la ficha", rect: [5, 180, 245, 38] }
    tocar:
      bien: [causa]
      porque:
        medido: "Lo medido son los valores concretos: dicen qué se vio, no por qué falló."
        nofunciono: "Son las hipótesis descartadas: valiosas, pero no la causa."
    exito: "«C12 secado por el calor del diodo de salida», no solo «C12 malo»."
    escalera:
      - "Busque la fila que habla de lo que mató al componente."
    solucion: "La fila «Causa»."

  - id: que-anotar
    tipo: pregunta
    fase: "Empareje"
    titulo: "Qué anotar de cada avería"
    texto: "Una cada campo de la ficha con lo que debe decir."
    libro: [558, 559, 561, 562]
    emparejar:
      - ["Lo medido", "Valores concretos, no «estaba mal»"]
      - ["La causa", "Por qué falló, no solo qué se cambió"]
      - ["El tiempo empleado", "Para decidir si compensa"]
      - ["Lo que no funcionó", "Las hipótesis descartadas"]
    exito: "«5 V con 800 mV de rizado, ESR de C12 = 8 Ω» vale; «la fuente estaba mal», no."
    pistas:
      - { texto: "El tiempo sirve para decidir en el futuro si compensa." }
    escalera:
      - "Lo descartado es tan útil como lo acertado."
    solucion: "Medido: valores; causa: el porqué; tiempo: si compensa; no funcionó: lo descartado."

  - id: callejones
    tipo: porque
    titulo: "Lo que nunca se anota"
    texto: "¿Por qué anotar las hipótesis que no funcionaron?"
    libro: [562, 564]
    widget:
      tipo: figura
      figura: fig-53.25
      zonas:
        - { id: ficha, rotulo: "La ficha", rect: [3, 25, 247, 215] }
        - { id: modelo, rotulo: "Primer recuadro verde", rect: [264, 80, 188, 38] }
    opciones:
      - texto: "Ahorra exactamente el tiempo que costó descartarlas"
        bien: true
        porque: "Dentro de seis meses, ante el mismo síntoma, el cuaderno dice «probé esto y no era»."
      - texto: "Para justificar el tiempo ante el cliente"
        porque: "El valor es para quien repara: no repetir callejones."
      - texto: "No hace falta: lo útil es lo que funcionó"
        porque: "Los callejones sin salida se repiten si no se anotan."
    escalera:
      - "¿Qué pasa la próxima vez que llegue el mismo síntoma?"
    solucion: "Evita repetirlas: ahorra lo que costó descartarlas."

  - id: cuatro-datos
    tipo: pregunta
    titulo: "El registro de cada medida"
    texto: "Cada medida se anota con cuatro datos. ¿Cuál de estos NO es uno de ellos?"
    libro: [568, 569, 570, 571]
    widget:
      tipo: figura
      figura: fig-53.25
      zonas:
        - { id: ficha, rotulo: "La ficha", rect: [3, 25, 247, 215] }
        - { id: recuadros, rotulo: "Los recuadros", rect: [262, 75, 190, 180] }
    opciones:
      - texto: "La hora del día"
        bien: true
        porque: "Los cuatro son el punto, el valor medido y el esperado, las condiciones y el instrumento con su escala."
      - texto: "El punto exacto, con su designador"
        porque: "Sí es uno: sin él no se puede repetir la medida."
      - texto: "El instrumento y su escala"
        porque: "Sí es uno: el instrumento afecta a la medida."
      - texto: "Las condiciones: con carga o sin ella, frío o caliente"
        porque: "Sí es uno: la misma medida cambia con ellas."
    escalera:
      - "Punto, valores, condiciones e instrumento."
    solucion: "La hora del día no es uno de los cuatro."

  - id: tabla-medidas
    tipo: pregunta
    titulo: "Con más de tres o cuatro medidas"
    texto: "Una tabla con punto, valor esperado, valor medido y conclusión. ¿Qué detecta además de evitar repetir medidas?"
    libro: [572]
    widget:
      tipo: figura
      figura: fig-53.25
      zonas:
        - { id: ficha, rotulo: "La ficha", rect: [3, 25, 247, 215] }
        - { id: recuadros, rotulo: "Los recuadros", rect: [262, 75, 190, 180] }
    opciones:
      - texto: "Las incoherencias que delatan una segunda avería"
        bien: true
        porque: "Medidas que no cuadran entre sí son la señal de más de un fallo."
      - texto: "Los errores del multímetro"
        porque: "Para eso se verifica el instrumento con una referencia."
      - texto: "Qué componente cambiar"
        porque: "La tabla acota y confirma; la sustitución viene después."
    escalera:
      - "Medidas que se contradicen: ¿cuántos fallos indican?"
    solucion: "Las incoherencias que delatan una segunda avería."

  - id: referencias-propias
    tipo: pregunta
    titulo: "Las referencias propias"
    texto: "¿Qué vale más que cualquier tabla general a la hora de comparar?"
    libro: [574]
    widget:
      tipo: figura
      figura: fig-53.25
      zonas:
        - { id: modelo, rotulo: "Primer recuadro verde", rect: [264, 80, 188, 38] }
        - { id: componente, rotulo: "Segundo recuadro verde", rect: [264, 122, 188, 38] }
    opciones:
      - texto: "Las medidas tomadas en aparatos que funcionan"
        bien: true
        porque: "Rizado, temperaturas y caídas de un equipo sano: la referencia con la que comparar."
      - texto: "Los valores típicos de internet"
        porque: "Son generales; el aparato concreto sano es la mejor referencia."
      - texto: "La memoria de la última reparación"
        porque: "La memoria reordena los hechos: hay que anotarlo."
    escalera:
      - "¿Con qué se compara mejor un aparato averiado?"
    solucion: "Las medidas de aparatos que funcionan."

  - id: formato
    tipo: pregunta
    titulo: "El formato"
    texto: "Papel, texto u hoja de cálculo: sirve cualquiera que se use. ¿Qué conviene que tenga?"
    libro: [578]
    widget:
      tipo: figura
      figura: fig-53.25
      zonas:
        - { id: progreso, rotulo: "Tercer recuadro verde", rect: [264, 165, 188, 38] }
        - { id: disenar, rotulo: "Recuadro azul", rect: [264, 208, 188, 45] }
    opciones:
      - texto: "Que sea buscable, con fotos y con fecha"
        bien: true
        porque: "Por modelo o por síntoma; las fotos son gratis; la fecha deja ver patrones."
      - texto: "Que sea bonito"
        porque: "Lo que importa es encontrar las cosas, no la presentación."
      - texto: "Que esté en un programa especializado"
        porque: "Cualquier formato vale si se usa de verdad."
    escalera:
      - "¿Cómo encontrará dentro de un año la avería de un modelo?"
    solucion: "Buscable, con fotos y con fecha."

  - id: mientras-se-repara
    tipo: porque
    titulo: "Mientras se repara, no después"
    texto: "¿Por qué el cuaderno se escribe mientras se repara?"
    libro: [591]
    widget:
      tipo: figura
      figura: fig-53.25
      zonas:
        - { id: ficha, rotulo: "La ficha", rect: [3, 25, 247, 215] }
        - { id: recuadros, rotulo: "Los recuadros", rect: [262, 75, 190, 180] }
    opciones:
      - texto: "Lo anotado de memoria pierde los detalles que lo hacían útil"
        bien: true
        porque: "Los valores medidos, el orden de las comprobaciones y las hipótesis descartadas. Y después no se hace."
      - texto: "Porque después se olvida el modelo del aparato"
        porque: "El modelo se recuerda; lo que se pierde son los valores y el orden."
      - texto: "Da igual cuándo"
        porque: "Después no se hace, y si se hace, sin los detalles."
    escalera:
      - "¿Qué se recuerda mal media hora después?"
    solucion: "De memoria se pierden los detalles útiles."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [554, 559, 564, 591]
    ideas:
      - { titulo: "Qué anotar.", texto: "Aparato, síntoma, valores medidos, causa, solución, tiempo y lo que no funcionó." }
      - { titulo: "Cada medida.", texto: "Punto, valor esperado y medido, condiciones e instrumento." }
      - { titulo: "Lo que emerge.", texto: "Patrones por modelo y por componente, y lo que evitar al diseñar." }
      - { titulo: "Cuándo.", texto: "Mientras se repara: después se pierden los detalles." }
