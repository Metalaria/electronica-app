# Lección 1.2 de la sección 55.31 «Líquidos, Corrosión y Desmontaje» (cap53; etiqueta interna sec-53.30).
# Formato: contenido/lecciones11/GUIA.md. La figura 55.52 (fig-53.41, 450,7 × 193,0) con zonas; la foto 55.53 de la
# corrosión por una batería de NiCd (fig-53.42, 1600 × 1200 píxeles) y la 55.54 de los conectores ZIF (fig-53.43,
# 1600 × 1055 píxeles) para «tocar». Pasos prácticos: los dos «tocar» sobre fotos reales.
leccion: cap53/sec-53.30

libro:
  891: "se pierde casi siempre si se actúa en el equivocado"
  892: "Lo que destruye no es el agua, es la electrólisis con tensión aplicada."
  894: "El electrolito de un condensador reventado es especialmente dañino: es conductor y ácido."
  895: "Lo que se ve es menos de lo que hay."
  898: "Tirar sin abrir la pestaña rompe el conector o el cable"
  899: "Tipos de líquido según su agresividad y el procedimiento de limpieza."
  900: "el electrolito ataca las pistas y las patillas de su alrededor"
  901: "el cable se inserta y se retira con la pestaña de bloqueo abierta"

modelo: { valores: {}, calculos: {} }

tarjetas:
  - id: explore-liquidos
    tipo: explorar
    titulo: "Según el líquido"
    texto: "Un equipo mojado se salva si se actúa en el orden correcto. Toque los líquidos y el procedimiento."
    libro: [891, 899]
    widget:
      tipo: figura
      figura: fig-53.41
      zonas:
        - { id: agua, rotulo: "Primer cuadro de arriba", rect: [3, 27, 108, 68], texto: "Agua limpia, poco conductora: alcohol isopropílico y secar a fondo." }
        - { id: refresco, rotulo: "Segundo cuadro de arriba", rect: [115, 27, 108, 68], texto: "Refresco o café: azúcares conductores; alcohol y cepillo, insistiendo." }
        - { id: mar, rotulo: "Tercer cuadro de arriba", rect: [227, 27, 108, 68], texto: "Agua de mar: sales; agua desionizada y luego alcohol." }
        - { id: electrolito, rotulo: "Cuarto cuadro de arriba", rect: [339, 27, 108, 68], texto: "Electrolito, conductor y ácido: bicarbonato diluido, aclarar, secar y alcohol." }
        - { id: procedimiento, rotulo: "La fila de abajo", rect: [3, 115, 444, 76], texto: "Sin corriente, desmontar, lavar, secar, inspeccionar y encender con límite de corriente." }
    requiere: { mover: [agua, electrolito, procedimiento] }

  - id: ordene-mojada
    tipo: pregunta
    fase: "Ordene"
    titulo: "Una placa mojada"
    texto: "Ordene lo que se hace con un equipo que ha recibido líquido."
    libro: [892]
    ordenar:
      - "Quitar la pila y desconectar"
      - "Desmontar hasta llegar a la placa"
      - "Lavar con alcohol isopropílico y cepillo"
      - "Secar de verdad"
      - "Inspeccionar con lupa"
      - "Primer encendido con límite de corriente"
    exito: "Encenderlo «para ver si funciona» es el error que más equipos mata."
    pistas:
      - { texto: "Lo primero, antes que nada, es quitar la tensión." }
    escalera:
      - "No se da tensión hasta haber lavado, secado e inspeccionado."
    solucion: "Sin corriente, desmontar, lavar, secar, inspeccionar y encender con límite."

  - id: por-que-pila
    tipo: porque
    titulo: "Lo que destruye"
    texto: "Un móvil cae al agua. ¿Por qué hay que quitar la pila inmediatamente?"
    libro: [892]
    widget:
      tipo: figura
      figura: fig-53.41
      zonas:
        - { id: procedimiento, rotulo: "La fila de abajo", rect: [3, 115, 444, 76] }
        - { id: agua, rotulo: "Primer cuadro de arriba", rect: [3, 27, 108, 68] }
    opciones:
      - texto: "Lo que destruye es la electrólisis con tensión aplicada"
        bien: true
        porque: "El agua sola daña poco; con tensión, la electrólisis corroe pistas y patillas."
      - texto: "Para que se seque antes"
        porque: "Quitar la pila no seca nada: corta la electrólisis."
      - texto: "Porque la pila se moja y explota"
        porque: "El riesgo está en la placa: con tensión aplicada, la electrólisis."
    escalera:
      - "¿Qué hace la corriente al pasar por agua entre dos pistas?"
    solucion: "La electrólisis con tensión aplicada, no el agua."

  - id: empareje-limpieza
    tipo: pregunta
    fase: "Empareje"
    titulo: "Cada líquido, su limpieza"
    texto: "Una cada líquido con su limpieza."
    libro: [892, 895]
    emparejar:
      - ["Agua limpia", "Alcohol isopropílico y secar a fondo"]
      - ["Refresco o café", "Alcohol y cepillo, insistiendo en los azúcares"]
      - ["Agua de mar", "Agua desionizada primero, luego alcohol"]
      - ["Electrolito de un condensador", "Bicarbonato diluido, aclarar, secar y alcohol"]
    exito: "De menos a más agresivo: cada uno deja algo distinto sobre la placa."
    pistas:
      - { texto: "El electrolito es ácido: hay que neutralizarlo." }
    escalera:
      - "Las sales del agua de mar se disuelven en agua, no en alcohol."
    solucion: "Agua: alcohol; refresco: alcohol y cepillo; mar: agua desionizada; electrolito: bicarbonato."

  - id: secar
    tipo: pregunta
    titulo: "Secar de verdad"
    texto: "Ha lavado la placa con alcohol. ¿Cómo la seca?"
    libro: [892]
    widget:
      tipo: figura
      figura: fig-53.41
      zonas:
        - { id: procedimiento, rotulo: "La fila de abajo", rect: [3, 115, 444, 76] }
    opciones:
      - texto: "24 horas al aire tibio, o 2 horas a 50–60 °C"
        bien: true
        porque: "Y luego, lupa antes de dar tensión."
      - texto: "Dentro de una bolsa de arroz"
        porque: "El arroz no hace nada útil."
      - texto: "Con el secador al máximo, cinco minutos"
        porque: "Cinco minutos no secan bajo los integrados ni dentro de los conectores."
    escalera:
      - "El líquido queda bajo los componentes: hace falta tiempo."
    solucion: "24 h al aire tibio o 2 h a 50–60 °C."

  - id: toque-origen
    tipo: tocar
    titulo: "El electrolito avanza"
    texto: "Lo que se ve es menos de lo que hay. Toque el origen de esta corrosión."
    libro: [895, 900]
    widget:
      tipo: figura
      figura: fig-53.42
      zonas:
        - { id: bateria, rotulo: "Cilindro azul, arriba a la derecha", rect: [660, 0, 740, 720] }
        - { id: integrado, rotulo: "Integrado negro, abajo a la izquierda", rect: [0, 690, 500, 380] }
        - { id: pista, rotulo: "Pistas verdes, abajo en el centro", rect: [860, 820, 380, 240] }
        - { id: sano, rotulo: "Chip de arriba a la izquierda", rect: [0, 0, 640, 240] }
    tocar:
      bien: [bateria]
      porque:
        integrado: "Sus patillas están atacadas, pero el electrolito le ha llegado de la batería."
        pista: "Es corrosión que ha avanzado por capilaridad desde la fuga."
        sano: "Está lejos del ataque; lo que importa es de dónde salió el electrolito."
    exito: "La batería de NiCd: su electrolito ataca las pistas y las patillas de su alrededor."
    escalera:
      - "Busque la pieza que contenía el líquido."
    solucion: "El cilindro azul: la batería de NiCd soldada en la placa."

  - id: continuidad
    tipo: pregunta
    titulo: "Pistas que parecen enteras"
    texto: "Limpia la zona corroída y las pistas parecen intactas. ¿Qué falta?"
    libro: [895]
    widget:
      tipo: figura
      figura: fig-53.42
      zonas:
        - { id: pista, rotulo: "Pistas verdes, abajo en el centro", rect: [860, 820, 380, 240] }
        - { id: integrado, rotulo: "Integrado negro, abajo a la izquierda", rect: [0, 690, 500, 380] }
    opciones:
      - texto: "Continuidad de todas las pistas de la zona, extremo a extremo"
        bien: true
        porque: "Una pista corroída puede parecer entera y estar abierta bajo el esmalte."
      - texto: "Nada: si se ven bien, están bien"
        porque: "La corrosión avanza bajo el esmalte: la inspección no basta."
      - texto: "Encender y ver si funciona"
        porque: "Primero se comprueba en frío; luego, encendido con límite de corriente."
    escalera:
      - "¿Por dónde avanza la corrosión sin que se vea?"
    solucion: "Medir continuidad extremo a extremo, y proteger con barniz."

  - id: toque-pestana
    tipo: tocar
    titulo: "Un cable plano"
    texto: "Va a sacar un cable plano. Toque lo que hay que abrir primero."
    libro: [898, 901]
    widget:
      tipo: figura
      figura: fig-53.43
      zonas:
        - { id: zif-izq, rotulo: "Conector de la izquierda, en la placa", rect: [200, 260, 460, 140] }
        - { id: zif-der, rotulo: "Conector de la derecha, en la placa", rect: [740, 260, 600, 230] }
        - { id: cable-izq, rotulo: "Cable de la izquierda", rect: [60, 420, 580, 630] }
        - { id: cable-der, rotulo: "Cable de la derecha", rect: [840, 520, 620, 530] }
    tocar:
      bien: [zif-izq, zif-der]
      porque:
        cable-izq: "El cable sale sin fuerza, pero solo con la pestaña del conector abierta."
        cable-der: "Tirar del cable sin abrir la pestaña rompe el conector o el cable."
    exito: "La pestaña de bloqueo del conector: se levanta o se desliza, y el cable sale sin fuerza."
    escalera:
      - "Lo que sujeta el cable está en el conector, no en el cable."
    solucion: "La pestaña de cualquiera de los dos conectores ZIF."

  - id: empareje-desmontaje
    tipo: pregunta
    fase: "Empareje"
    titulo: "Desmontar sin romper"
    texto: "Una cada elemento con la regla que lo protege."
    libro: [898]
    emparejar:
      - ["Cada paso", "Fotografiarlo antes"]
      - ["Tornillos", "En un cartón con el dibujo de la carcasa"]
      - ["Clips", "Espátula de plástico, desde una esquina"]
      - ["Adhesivos", "Calor suave"]
      - ["Baterías pegadas", "Alcohol isopropílico por el borde"]
    exito: "Y al montar, en orden inverso siguiendo las fotos."
    pistas:
      - { texto: "Un destornillador metálico rompe los clips; uno roto no se repara." }
    escalera:
      - "La foto es la documentación que no existe."
    solucion: "Paso: foto; tornillos: cartón; clips: espátula; adhesivos: calor; baterías: alcohol."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [892, 894, 895, 898]
    ideas:
      - { titulo: "Sin corriente.", texto: "Lo que destruye es la electrólisis: quitar la pila y no encender." }
      - { titulo: "Lavar y secar.", texto: "Según el líquido; secar de verdad e inspeccionar antes de dar tensión." }
      - { titulo: "La corrosión.", texto: "Avanza bajo el esmalte: continuidad extremo a extremo." }
      - { titulo: "Desmontar.", texto: "Fotos, tornillos en orden, espátula de plástico y la pestaña abierta." }
