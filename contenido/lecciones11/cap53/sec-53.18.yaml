# Lección 1.2 de la sección 55.19 «Un Trazador de Curvas con lo que Tienes» (cap53; etiqueta interna sec-53.18).
# Formato: contenido/lecciones11/GUIA.md. Las firmas de las figuras 55.37 (fig-53.27, generador y 1 kΩ, 447,9 × 301,5)
# y 55.38 (fig-53.28, transformador de 6 V y 1 kΩ, 447,9 × 311,6) con zonas en cada panel; la recta de una resistencia
# como gráfica viva (I = V/R frente a la tensión del componente). Paso práctico: «banco» con la ficha 38 del cuaderno
# (el mismo montaje): con las puntas unidas, el pico en la resistencia es el del secundario, 6 V · √2 = 8,49 V.
leccion: cap53/sec-53.18

libro:
  616: "con un osciloscopio en modo XY y dos componentes se improvisa uno perfectamente utilizable"
  618: "en serie con una resistencia y el componente bajo prueba"
  619: "Al eje X: la tensión sobre el componente."
  620: "la caída en la resistencia, que es proporcional a la corriente"
  622: "ambos canales comparten masa"
  624: "una recta cuya pendiente es 1/R"
  625: "una elipse, porque la corriente adelanta 90° a la tensión"
  626: "al subirla, la elipse de la bobina se aplana y la del condensador crece en vertical"
  628: "con su tensión leída directamente del eje"
  630: "Cortocircuito: una recta vertical. Circuito abierto: una recta horizontal."
  633: "dos trazas superpuestas revelan diferencias que ningún multímetro detecta"
  634: "la traza es la del conjunto"
  635: "Detectar semiconductores marginales"
  636: "no interpretar la traza, sino compararla con la de una placa que funcione"
  638: "unos miliamperios bastan y evitan destruir el componente"
  639: "Tensión baja, de unos pocos voltios"
  641: "Nunca con el circuito alimentado."
  643: "transformador de 6 V, resistencia de 1 kΩ y dos sondas"
  644: "El bueno tiene la inversa pegada al eje"
  646: "cada tipo de componente y cada fallo tiene la suya"
  647: "el condensador y la bobina dan la misma elipse"

modelo:
  valores:
    R_t: { sim: "R", nombre: "resistencia bajo prueba", unidad: Ω, valor: 1000 }
    V_tr: { sim: "V_{ef}", nombre: "secundario del transformador, eficaz", unidad: V, valor: 6 }
    R_s: { sim: "R_{s}", nombre: "resistencia en serie del trazador", unidad: Ω, valor: 1000 }
  calculos:
    G_t: { expr: "1/R_t", sim: "1/R", nombre: "pendiente de la recta", unidad: S }
    V_pk: { expr: "V_tr*sqrt(2)", sim: "V_{p}", nombre: "pico del secundario", unidad: V }
    I_max: { expr: "V_pk/R_s", sim: "I_{máx}", nombre: "corriente máxima, con el componente en corto", unidad: A }

tarjetas:
  - id: explore-firmas
    tipo: explorar
    titulo: "Cada componente tiene su firma"
    texto: "En modo XY: la tensión del componente en X, la corriente en Y. Toque los paneles."
    libro: [619, 620, 646]
    widget:
      tipo: figura
      figura: fig-53.27
      zonas:
        - { id: resistencia, rotulo: "Arriba a la izquierda", rect: [35, 30, 128, 112], texto: "Resistencia: una recta de pendiente 1/R." }
        - { id: fugas, rotulo: "Arriba en el centro", rect: [177, 30, 125, 112], texto: "Diodo sano: el codo y la inversa pegada al eje. Con fugas: pendiente en inversa." }
        - { id: corto, rotulo: "Arriba a la derecha", rect: [320, 30, 125, 112], texto: "Cortocircuito: una recta vertical." }
        - { id: abierto, rotulo: "Abajo a la izquierda", rect: [35, 165, 128, 110], texto: "Abierto: una recta horizontal." }
        - { id: condensador, rotulo: "Abajo en el centro", rect: [177, 165, 125, 110], texto: "Condensador: una elipse, porque la corriente adelanta 90°." }
    requiere: { mover: [resistencia, fugas, corto, abierto] }

  - id: explore-recta
    tipo: explorar
    titulo: "La resistencia: una recta"
    texto: "La corriente es la tensión entre R. Suba R y mire cómo se tumba la recta."
    libro: [624]
    widget:
      tipo: grafica
      x: { id: v, min: -8, max: 8, unidad: V, rotulo: "tensión en el componente" }
      y: { min: -0.009, max: 0.009, unidad: A, rotulo: "corriente" }
      curvas:
        - { expr: "v/R_t", color: verde, rotulo: "recta de pendiente 1/R" }
      lectura: { valor: G_t, rotulo: "Pendiente" }
      mandos:
        - { valor: R_t, min: 1000, max: 10000, paso: 100, rotulo: "Resistencia, R" }

  - id: montaje
    tipo: pregunta
    titulo: "Qué va a cada eje"
    texto: "Fuente de alterna, resistencia en serie y componente. ¿Qué lleva cada eje en modo XY?"
    libro: [618, 619, 620, 622]
    widget:
      tipo: figura
      figura: fig-53.28
      zonas:
        - { id: resistencia, rotulo: "Arriba a la izquierda", rect: [35, 32, 128, 112] }
        - { id: diodo, rotulo: "Abajo a la izquierda", rect: [35, 168, 128, 112] }
    opciones:
      - texto: "X, la tensión del componente; Y, la caída en la resistencia"
        bien: true
        porque: "La caída en la resistencia es proporcional a la corriente: Y es la corriente."
      - texto: "X, la caída en la resistencia; Y, la tensión del componente"
        porque: "Con los ejes cambiados, la firma sale girada y no se compara con las de referencia."
      - texto: "X, el tiempo; Y, la tensión del componente"
        porque: "Eso es el modo normal. El trazador necesita el modo XY: tensión contra corriente."
    escalera:
      - "La curva característica es corriente frente a tensión."
    solucion: "X: tensión del componente. Y: caída en la resistencia, proporcional a la corriente."

  - id: empareje-firmas
    tipo: pregunta
    fase: "Empareje"
    titulo: "Lea la firma"
    texto: "Una cada componente con lo que dibuja."
    libro: [624, 625, 628, 630]
    emparejar:
      - ["Resistencia", "Recta de pendiente 1/R"]
      - ["Condensador", "Elipse"]
      - ["Zener", "Codo en directa y rodilla en inversa"]
      - ["Cortocircuito", "Recta vertical"]
      - ["Circuito abierto", "Recta horizontal"]
    exito: "Y la tensión del Zener se lee directamente del eje."
    pistas:
      - { texto: "Un corto no deja tensión en el componente: la traza no se aparta del eje vertical." }
    escalera:
      - "Abierto: no pasa corriente, así que la traza se queda sobre el eje horizontal."
    solucion: "Resistencia: recta 1/R; condensador: elipse; Zener: codo y rodilla; corto: vertical; abierto: horizontal."

  - id: toque-zener
    tipo: tocar
    titulo: "La tensión, leída del eje"
    texto: "Toque la firma de la que se lee una tensión de ruptura directamente en el eje horizontal."
    libro: [628, 647]
    widget:
      tipo: figura
      figura: fig-53.28
      zonas:
        - { id: resistencia, rotulo: "Arriba a la izquierda", rect: [35, 32, 128, 112] }
        - { id: condensador, rotulo: "Arriba en el centro", rect: [177, 32, 125, 112] }
        - { id: bobina, rotulo: "Arriba a la derecha", rect: [320, 32, 125, 112] }
        - { id: diodo, rotulo: "Abajo a la izquierda", rect: [35, 168, 128, 112] }
        - { id: zener, rotulo: "Abajo en el centro", rect: [177, 168, 125, 112] }
        - { id: corto, rotulo: "Abajo a la derecha", rect: [320, 168, 125, 112] }
    tocar:
      bien: [zener]
      porque:
        resistencia: "Una recta: no tiene codo ni rodilla."
        condensador: "Una elipse: corriente y tensión desfasadas, sin ruptura."
        bobina: "La misma elipse que el condensador, recorrida al revés."
        diodo: "Solo el codo en directa: con 6 V no llega a la ruptura."
        corto: "Una recta vertical: la tensión es siempre cero."
    exito: "El Zener: codo en directa y rodilla en inversa, con su tensión leída en el eje."
    escalera:
      - "Busque una traza que se doble también en tensiones negativas."
    solucion: "Abajo en el centro: el Zener."

  - id: bobina-condensador
    tipo: pregunta
    titulo: "Dos elipses iguales"
    texto: "Condensador y bobina dan la misma elipse. Con el generador en lugar del transformador, ¿cómo se distinguen?"
    libro: [626, 647]
    widget:
      tipo: figura
      figura: fig-53.28
      zonas:
        - { id: condensador, rotulo: "Arriba en el centro", rect: [177, 32, 125, 112] }
        - { id: bobina, rotulo: "Arriba a la derecha", rect: [320, 32, 125, 112] }
    opciones:
      - texto: "Subiendo la frecuencia: la de la bobina se aplana"
        bien: true
        porque: "La reactancia de la bobina crece con la frecuencia y la del condensador baja: la del condensador crece en vertical."
      - texto: "Por el tamaño de la elipse"
        porque: "Depende de los valores: con la frecuencia fija, el tamaño no dice cuál es."
      - texto: "No se distinguen en XY"
        porque: "Se recorren en sentidos opuestos, y la frecuencia lo confirma."
    escalera:
      - "¿Qué le pasa a la reactancia de cada uno al subir la frecuencia?"
    solucion: "Al subir la frecuencia, la elipse de la bobina se aplana y la del condensador crece en vertical."

  - id: comparar
    tipo: pregunta
    titulo: "Para qué sirve de verdad"
    texto: "El trazador no mide con precisión. ¿Cuál es su uso profesional?"
    libro: [633, 635, 636]
    widget:
      tipo: figura
      figura: fig-53.27
      zonas:
        - { id: fugas, rotulo: "Arriba en el centro", rect: [177, 30, 125, 112] }
        - { id: transistor, rotulo: "Abajo a la derecha", rect: [320, 165, 125, 110] }
    opciones:
      - texto: "Comparar con la traza de un componente o una placa buenos"
        bien: true
        porque: "Es el análisis de firma analógica: dos trazas superpuestas revelan lo que el multímetro no ve."
      - texto: "Medir la tensión exacta del codo de un diodo"
        porque: "Su virtud no es la medida precisa: para eso está la prueba de diodos."
      - texto: "Interpretar cada traza sin referencia"
        porque: "Al revés: no se interpreta, se compara con la de una placa que funcione."
    escalera:
      - "Piense en el diodo con fugas: ¿cómo se ve mejor?"
    solucion: "Comparar: el análisis de firma analógica."

  - id: en-circuito
    tipo: porque
    titulo: "Con el componente montado"
    texto: "En circuito, la traza es la del conjunto. ¿Por qué sigue sirviendo?"
    libro: [634, 636]
    widget:
      tipo: figura
      figura: fig-53.27
      zonas:
        - { id: resistencia, rotulo: "Arriba a la izquierda", rect: [35, 30, 128, 112] }
        - { id: fugas, rotulo: "Arriba en el centro", rect: [177, 30, 125, 112] }
    opciones:
      - texto: "Porque se compara con la misma medida en una placa buena"
        bien: true
        porque: "No hace falta entender el conjunto: basta ver dónde difieren las dos trazas."
      - texto: "Porque el resto del circuito no influye"
        porque: "Sí influye: la traza es la del conjunto. Por eso se compara."
      - texto: "Porque con alterna los paralelos desaparecen"
        porque: "Siguen ahí. Lo que salva la medida es la comparación con una placa que funcione."
    escalera:
      - "¿Qué haría falta para saber cómo debe ser la traza del conjunto?"
    solucion: "Se compara con la de una placa buena: la diferencia localiza el fallo."

  - id: precauciones
    tipo: pregunta
    titulo: "La resistencia en serie"
    texto: "Además de convertir la corriente en tensión, ¿qué hace la resistencia en serie?"
    libro: [638, 639, 641]
    widget:
      tipo: figura
      figura: fig-53.28
      zonas:
        - { id: corto, rotulo: "Abajo a la derecha", rect: [320, 168, 125, 112] }
        - { id: diodo, rotulo: "Abajo a la izquierda", rect: [35, 168, 128, 112] }
    opciones:
      - texto: "Limita la corriente a unos miliamperios"
        bien: true
        porque: "Unos miliamperios bastan y evitan destruir el componente, incluso en corto."
      - texto: "Protege el circuito si está alimentado"
        porque: "Nunca se prueba con el circuito alimentado, con resistencia o sin ella."
      - texto: "Permite subir la tensión para ver la ruptura"
        porque: "La tensión se deja baja, de unos pocos voltios, salvo que se busque la ruptura a propósito."
    escalera:
      - "¿Qué pasaría con un componente en corto sin la resistencia?"
    solucion: "Limita la corriente: unos miliamperios bastan."

  - id: banco-trazador
    tipo: banco
    titulo: "Móntelo: cinco minutos"
    texto: "Transformador de 6 V, resistencia de 1 kΩ y dos sondas. Antes de probar componentes, compruebe el extremo del cortocircuito."
    libro: [643, 644]
    fijar: { V_tr: 6, R_s: 1000 }
    banco:
      piezas: ["Transformador de 6 V con fusible", "R = 1 kΩ", "FNIRSI en modo XY"]
      medir: "Con las puntas del componente unidas, la tensión de pico en la resistencia (eje Y)."
      esperado: V_pk
      unidad: V
      tol: 0.15
      consejos:
        - { cuando: { valor: desviacion, mayor: 0.15 }, texto: "Mide de más: ¿lee pico a pico? El pico es la mitad." }
        - { texto: "Mide de menos: ¿lee el valor eficaz? El pico es mayor." }
      ficha: { n: 38, titulo: "Un trazador de curvas con lo que tienes" }
    comprobar:
      - { V_pk: 8.49, I_max: 0.00849, tol: 0.002 }

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [616, 620, 630, 636]
    ideas:
      - { titulo: "El montaje.", texto: "Fuente de alterna, resistencia en serie y componente; modo XY." }
      - { titulo: "Las firmas.", texto: "Recta 1/R, elipse, codo y rodilla; corto vertical, abierto horizontal." }
      - { titulo: "Comparar.", texto: "No se interpreta la traza: se compara con la de una placa buena." }
      - { titulo: "Precauciones.", texto: "Unos miliamperios, pocos voltios, descargado y nunca alimentado." }
