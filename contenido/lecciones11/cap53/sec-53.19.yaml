# Lección 1.2 de la sección 55.20 «Componentes en Circuito: Qué se Puede Concluir sin Desoldar» (cap53; etiqueta
# interna sec-53.19). Formato: contenido/lecciones11/GUIA.md. La figura 55.39 (fig-53.29, 450,7 × 169,9) con zonas y la
# foto 55.40 del medidor de ESR (fig-14.14, 1600 × 1200 píxeles). Paso práctico: «dibujar» la lectura del óhmetro sobre
# una resistencia de 10 kΩ en circuito frente a lo que tiene en paralelo (eje logarítmico): nunca pasa de 10 kΩ, la
# asimetría del bloque 654. Los 10 kΩ son de ejemplo (el libro no da un valor en esta sección); en la 55.4 ya se midió
# un caso concreto (10 kΩ con 22 kΩ), aquí se dibuja la curva entera.
leccion: cap53/sec-53.19

libro:
  650: "lo que se mide es el conjunto, no el componente"
  652: "Cualquier medida en circuito está afectada por lo que hay en paralelo."
  653: "Un valor MENOR del esperado no dice nada"
  654: "nada en paralelo puede aumentar una resistencia"
  655: "saberla evita desoldar componentes sanos"
  657: "Si sale mayor que la marcada, está mal."
  658: "trabaja a frecuencia alta y con tensión pequeña, que no enciende las uniones semiconductoras"
  659: "Un electrolítico con ESR alta se detecta sin desoldarlo"
  660: "cero ohmios en ambos sentidos indica cortocircuito, con casi total seguridad"
  661: "no detecta espiras en cortocircuito"
  662: "una lectura buena en circuito es fiable; una lectura mala hay que confirmarla fuera"
  664: "Descargar los condensadores, o el óhmetro dará lecturas absurdas y puede dañarse."
  669: "basta con ver dónde difieren"
  670: "la comparación posible es entre canales o entre secciones idénticas del mismo aparato"
  673: "Levantar una patilla basta en la mayoría de los casos"
  674: "con SMD, a menudo es más fácil sacarlo y medirlo"
  677: "Los que destaquen son los candidatos"
  678: "La asimetría de las medidas en circuito y la utilidad del medidor de ESR."
  679: "Medidor de ESR y capacidad de bolsillo"

modelo:
  valores:
    R_m: { sim: "R", nombre: "resistencia marcada", unidad: Ω, valor: 10000 }
  calculos:
    R_m2: { expr: "R_m", sim: "R", nombre: "la resistencia sola", unidad: Ω }

tarjetas:
  - id: explore-asimetria
    tipo: explorar
    titulo: "Se mide el conjunto"
    texto: "En circuito, el instrumento ve el componente y todo lo que tiene en paralelo. Toque los cuadros."
    libro: [650, 652, 655, 678]
    widget:
      tipo: figura
      figura: fig-53.29
      zonas:
        - { id: menor, rotulo: "Arriba a la izquierda", rect: [4, 18, 210, 47], texto: "Un valor menor no dice nada: puede ser el componente o algo en paralelo." }
        - { id: mayor, rotulo: "En medio a la izquierda", rect: [4, 68, 210, 47], texto: "Un valor mayor sí es concluyente: nada en paralelo puede aumentar una resistencia." }
        - { id: antes, rotulo: "Abajo a la izquierda", rect: [4, 118, 210, 48], texto: "Antes de medir: sin alimentación, baterías desconectadas y condensadores descargados." }
        - { id: esr, rotulo: "Arriba a la derecha", rect: [230, 18, 218, 57], texto: "El medidor de ESR trabaja en circuito sin encender las uniones." }
        - { id: comparar, rotulo: "En medio a la derecha", rect: [230, 78, 218, 49], texto: "Comparar con una placa idéntica que funcione, o entre canales iguales." }
        - { id: patilla, rotulo: "Abajo a la derecha", rect: [230, 129, 218, 38], texto: "Si la medida no concluye: levantar una patilla." }
    requiere: { mover: [menor, mayor] }

  - id: dibuje-lectura
    tipo: dibujar
    titulo: "Dibuje lo que lee el óhmetro"
    texto: "Una resistencia de 10 kΩ en circuito. Dibuje la lectura frente a lo que tiene en paralelo, de muy poco a muchísimo."
    libro: [652, 653, 654]
    fijar: { R_m: 10000 }
    dibujar:
      x: { id: rp, min: 100, max: 10000000, unidad: Ω, rotulo: "lo que hay en paralelo", escala: log }
      y: { min: 0, max: 12000, unidad: Ω, rotulo: "lectura del óhmetro" }
      curva: "R_m*rp/(R_m + rp)"
      puntos: 21
      tol: 0.08
      holgura: 0.03
      rotulo: "La lectura en circuito"
    exito: "Sube hacia los 10 kΩ sin pasar nunca de ellos: nada en paralelo puede aumentar una resistencia."
    pistas:
      - { cuando: { valor: media, mayor: 0.05 }, texto: "Ha dibujado alto: la lectura nunca supera la resistencia marcada." }
      - { texto: "Con poco en paralelo la lectura es casi ese poco; con mucho, se acerca a la marcada." }
    escalera:
      - "Dos resistencias en paralelo dan menos que la menor de las dos."
      - "A la izquierda, la lectura es casi la del paralelo; a la derecha, casi 10 kΩ."
    solucion: "Una curva que sube y se aplana justo por debajo de 10 kΩ."
    comprobar:
      - { R_m2: 10000 }

  - id: empareje-componentes
    tipo: pregunta
    fase: "Empareje"
    titulo: "Componente a componente"
    texto: "Una cada componente con lo que sí se concluye midiéndolo montado."
    libro: [657, 658, 660, 661]
    emparejar:
      - ["Resistencia", "Si lee más que la marcada, está mal"]
      - ["Electrolítico", "La ESR sí; la capacidad, casi imposible"]
      - ["Semiconductor", "Cero en ambos sentidos: cortocircuito"]
      - ["Bobina", "Resistencia en continua; no las espiras en corto"]
    exito: "Lo concluyente es lo extremo: lo mayor que lo marcado, o el corto en ambos sentidos."
    pistas:
      - { texto: "La capacidad en circuito es la suma de todos los condensadores en paralelo." }
    escalera:
      - "¿Qué medida de cada uno no se deja engañar por lo que hay en paralelo?"
    solucion: "Resistencia: más que la marcada; electrolítico: ESR; semiconductor: cero en ambos sentidos; bobina: R en continua."

  - id: por-que-esr
    tipo: porque
    titulo: "El medidor de ESR, en circuito"
    texto: "El óhmetro se confunde con lo que hay en paralelo. ¿Por qué el medidor de ESR mide montado?"
    libro: [658, 679]
    widget:
      tipo: figura
      figura: fig-14.14
      zonas:
        - { id: puntas, rotulo: "Las puntas, arriba a la izquierda", rect: [80, 180, 520, 220] }
        - { id: pantalla, rotulo: "La pantalla", rect: [320, 450, 480, 170] }
    opciones:
      - texto: "Frecuencia alta y tensión pequeña: no enciende las uniones"
        bien: true
        porque: "Con tan poca tensión, diodos y transistores en paralelo no conducen y no falsean la lectura."
      - texto: "Desconecta el resto del circuito"
        porque: "No desconecta nada: simplemente la señal es tan pequeña que las uniones no conducen."
      - texto: "Mide la capacidad, que no depende del paralelo"
        porque: "La capacidad en circuito es la suma de todas las que hay en paralelo: casi imposible de medir."
    escalera:
      - "¿Qué tensión hace falta para que una unión semiconductora conduzca?"
    solucion: "Trabaja a frecuencia alta y con tensión pequeña, que no enciende las uniones semiconductoras."

  - id: candidatos
    tipo: pregunta
    titulo: "Dos minutos por placa"
    texto: "Con el medidor de ESR recorre todos los electrolíticos de una placa sospechosa. ¿Cuáles son los candidatos?"
    libro: [659, 677]
    widget:
      tipo: figura
      figura: fig-14.14
      zonas:
        - { id: puntas, rotulo: "Las puntas, arriba a la izquierda", rect: [80, 180, 520, 220] }
        - { id: pantalla, rotulo: "La pantalla", rect: [320, 450, 480, 170] }
    opciones:
      - texto: "Los que destacan frente a lo típico para su capacidad y tensión"
        bien: true
        porque: "Se compara con los valores típicos: un electrolítico con ESR alta se detecta sin desoldarlo."
      - texto: "Los de menor capacidad"
        porque: "El medidor busca la ESR; la capacidad en circuito no se puede medir bien."
      - texto: "Todos: se cambian por si acaso"
        porque: "Eso es sustituir por sospecha. La medida dice cuáles están secos."
    escalera:
      - "Una medida aislada no dice nada: ¿con qué se compara?"
    solucion: "Los que destacan frente a lo típico para su capacidad y tensión."

  - id: lectura-mala
    tipo: pregunta
    titulo: "Una lectura sospechosa"
    texto: "La prueba de diodos en circuito da una lectura rara en una unión, pero no cero en ambos sentidos. ¿Qué hace?"
    libro: [660, 662, 673]
    widget:
      tipo: figura
      figura: fig-53.29
      zonas:
        - { id: menor, rotulo: "Arriba a la izquierda", rect: [4, 18, 210, 47] }
        - { id: patilla, rotulo: "Abajo a la derecha", rect: [230, 129, 218, 38] }
    opciones:
      - texto: "Levantar una patilla y confirmarla fuera"
        bien: true
        porque: "Una lectura mala en circuito hay que confirmarla fuera: los caminos en paralelo la alteran."
      - texto: "Sustituir el semiconductor"
        porque: "Los caminos en paralelo pueden simular continuidad: quizá esté sano."
      - texto: "Darlo por bueno"
        porque: "Solo una lectura buena es fiable en circuito; la mala hay que confirmarla."
    escalera:
      - "¿Qué lecturas son fiables en circuito: las buenas o las malas?"
    solucion: "Confirmarla fuera: levantar una patilla."

  - id: antes-de-medir
    tipo: pregunta
    titulo: "Antes de medir, siempre"
    texto: "Va a medir resistencias en una placa recién desenchufada. ¿Qué pasa si no descarga los condensadores?"
    libro: [664]
    widget:
      tipo: figura
      figura: fig-53.29
      zonas:
        - { id: antes, rotulo: "Abajo a la izquierda", rect: [4, 118, 210, 48] }
        - { id: esr, rotulo: "Arriba a la derecha", rect: [230, 18, 218, 57] }
    opciones:
      - texto: "Lecturas absurdas, y el óhmetro puede dañarse"
        bien: true
        porque: "El óhmetro inyecta una corriente pequeña; un condensador cargado le impone su tensión."
      - texto: "Nada: el óhmetro no ve la carga"
        porque: "La ve: la tensión del condensador se suma a la medida y la falsea."
      - texto: "Solo tarda más en estabilizarse"
        porque: "No es cuestión de esperar: la lectura es absurda y el instrumento corre riesgo."
    escalera:
      - "Un condensador cargado es una fuente de tensión."
    solucion: "Lecturas absurdas y riesgo para el óhmetro."

  - id: comparar-canales
    tipo: pregunta
    titulo: "Sin placa de referencia"
    texto: "No tiene una placa igual que funcione. ¿Con qué compara?"
    libro: [669, 670]
    widget:
      tipo: figura
      figura: fig-53.29
      zonas:
        - { id: comparar, rotulo: "En medio a la derecha", rect: [230, 78, 218, 49] }
        - { id: mayor, rotulo: "En medio a la izquierda", rect: [4, 68, 210, 47] }
    opciones:
      - texto: "Con un canal o una sección idéntica del mismo aparato"
        bien: true
        porque: "Los dos canales de un estéreo o las dos ramas de una fuente simétrica: basta ver dónde difieren."
      - texto: "Con los valores de la hoja de datos de cada pieza"
        porque: "En circuito se mide el conjunto: la hoja de datos de una pieza no dice cuánto debe leer."
      - texto: "Con nada: hay que dibujar el esquema"
        porque: "La comparación entre secciones iguales es viable y muy eficaz sin esquema."
    escalera:
      - "Busque dentro del aparato algo que esté repetido."
    solucion: "Entre canales o secciones idénticas: dos canales, dos ramas, varias salidas."

  - id: cuando-desoldar
    tipo: pregunta
    titulo: "Cuándo desoldar"
    texto: "La medida en circuito no concluye y el componente es sospechoso. ¿Qué es lo menos agresivo?"
    libro: [673, 674]
    widget:
      tipo: figura
      figura: fig-53.29
      zonas:
        - { id: patilla, rotulo: "Abajo a la derecha", rect: [230, 129, 218, 38] }
        - { id: comparar, rotulo: "En medio a la derecha", rect: [230, 78, 218, 49] }
    opciones:
      - texto: "Levantar una patilla; con SMD, a menudo sacarlo entero"
        bien: true
        porque: "Basta en la mayoría de los casos; con SMD suele ser más fácil sacarlo y medirlo."
      - texto: "Sacarlo entero siempre"
        porque: "Es más agresivo para la placa; una patilla al aire ya lo aísla."
      - texto: "Cortar la pista que llega a él"
        porque: "Eso es dañar la placa: levantar una patilla aísla igual y se deshace."
    escalera:
      - "¿Qué basta para que el componente quede aislado del paralelo?"
    solucion: "Levantar una patilla; con SMD, sacarlo y medirlo fuera."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [653, 654, 658, 669]
    ideas:
      - { titulo: "La asimetría.", texto: "Menor no dice nada; mayor es concluyente: el paralelo nunca sube una resistencia." }
      - { titulo: "La ESR.", texto: "El medidor de ESR trabaja en circuito: el ahorro de tiempo más grande del capítulo." }
      - { titulo: "Lo extremo.", texto: "Cero en ambos sentidos es corto; una lectura mala se confirma fuera." }
      - { titulo: "Comparar.", texto: "Con una placa igual o entre canales: basta ver dónde difieren." }
