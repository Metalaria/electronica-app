# «Consolas por dentro» · Master System II 1: la placa de un vistazo, sobre la foto principal del explorador (IC BD
# M4Jr. PAL montada, 1992, ConsoleMods Wiki, CC BY) y el escaneo de la 171-5922A sin componentes, la del manual de
# servicio de Sega. Fuentes: los datos de la consola (sms#n, scripts/consolas11.mjs).
leccion: consola-sms/sms-placa

libro:
  "sms#2": "Ejecuta la ROM de arranque o el cartucho; ve el VDP, el PSG y los mandos como puertos de E/S"
  "sms#3": "ROM de máscara de 1 Mbit (128 KB) con el juego integrado y su propio paginador"
  "sms#4": "8 KB en $C000–$DFFF"
  "sms#5": "Procesador de vídeo (modo 4, 64 colores, 64 sprites) con el generador de sonido SN76489 dentro"
  "sms#6": "genera las selecciones /CE0–/CE4 según el puerto $3E, lee los dos mandos"
  "sms#7": "Guarda los bytes pares de los 16 KB de VRAM"
  "sms#8": "La otra mitad de la VRAM"
  "sms#11": "El SMS II no tiene ranura de tarjeta ni puerto de expansión"
  "sms#21": "Foto «171-5922A sin componentes» 171-5922A, la del manual"
  "sms#22": "Huella de 40 patas del Z80"
  "sms#25": "Huella de 48 patas"
  "sms#26": "Huella de 64 patas del VDP"
  "sms#61": "la serigrafía (IC1–IC9, CN1–CN4…) coincide con las referencias del manual"
  "sms#70": "el arranque de Sega y un juego integrado"

modelo:
  valores: {}
  calculos: {}

tarjetas:
  - id: explore-chips
    tipo: explorar
    titulo: "Los chips del Master System II"
    texto: "Toque la CPU, el VDP, el chip de E/S y la ROM de arranque."
    libro: ["sms#2", "sms#5", "sms#6", "sms#3"]
    requiere: { mover: [z80, vdp, io, bios] }
    widget:
      tipo: figura
      consola: { maquina: sms }
      zonas:
        - { id: z80, hotspot: z80, rotulo: "CPU Z80", texto: "Ejecuta la ROM de arranque o el cartucho." }
        - { id: vdp, hotspot: vdp, rotulo: "VDP 315-5246", texto: "El vídeo, con el sonido SN76489 dentro." }
        - { id: io, hotspot: io, rotulo: "E/S 315-5237", texto: "Las selecciones /CE0–/CE4 y los mandos." }
        - { id: bios, hotspot: bios, rotulo: "ROM de arranque", texto: "128 KB: el arranque y un juego integrado." }

  - id: toque-cpu
    tipo: tocar
    titulo: "¿Cuál es la CPU?"
    texto: "Toque el procesador que ejecuta el juego."
    libro: ["sms#2", "sms#5", "sms#3"]
    widget:
      tipo: figura
      consola: { maquina: sms }
      zonas:
        - { id: z80, hotspot: z80, rotulo: "Chip largo vertical, arriba en el centro" }
        - { id: bios, hotspot: bios, rotulo: "Chip vertical, arriba a la derecha" }
        - { id: vdp, hotspot: vdp, rotulo: "Chip largo, en el centro" }
        - { id: io, hotspot: io, rotulo: "Chip largo, a la derecha" }
    tocar:
      bien: [z80]
      porque:
        bios: "Es la ROM de arranque: guarda el programa, no lo ejecuta."
        vdp: "Es el VDP: hace la imagen y el sonido."
        io: "Es el 315-5237: elige memorias y lee mandos."
    exito: "El Zilog Z80: una sola CPU de 8 bits para todo."
    escalera:
      - "Lea las marcas: busque «Z80»."
    solucion: "Arriba en el centro, en vertical: Zilog Z80 (IC1)."

  - id: prediga-memoria
    tipo: predecir
    titulo: "Poca memoria"
    texto: "¿Cuánta RAM tiene el Master System II para el programa y para el vídeo?"
    libro: ["sms#4", "sms#7", "sms#8"]
    widget:
      tipo: figura
      consola: { maquina: sms }
      zonas:
        - { id: ram, hotspot: ram, rotulo: "RAM de trabajo" }
        - { id: vram1, hotspot: vram1, rotulo: "VRAM, byte bajo" }
        - { id: vram2, hotspot: vram2, rotulo: "VRAM, byte alto" }
    opciones:
      - texto: "8 KB de trabajo y 16 KB de vídeo."
        bien: true
        porque: "Una RAM de 8 KB para el Z80 y dos de 8K × 8 que forman los 16 KB de VRAM."
      - texto: "16 KB de trabajo y 8 KB de vídeo."
        porque: "Al revés: la VRAM son dos chips, 16 KB; la de trabajo, uno de 8 KB."
      - texto: "128 KB: la ROM de arranque."
        porque: "La ROM no es RAM: no se escribe. La RAM son 8 KB de trabajo y 16 KB de vídeo."
    escalera:
      - "La VRAM son dos chips iguales; la de trabajo, uno."
    solucion: "8 KB de trabajo (IC3) y 16 KB de VRAM (IC6 e IC7)."

  - id: empareje-chips
    tipo: pregunta
    fase: "Empareje"
    titulo: "Cada chip, su papel"
    texto: "Empareje cada chip de la placa con lo que hace."
    libro: ["sms#2", "sms#5", "sms#6", "sms#3"]
    emparejar:
      - ["Z80", "Ejecuta el programa"]
      - ["315-5246", "Vídeo y sonido"]
      - ["315-5237", "Selecciones y mandos"]
      - ["MPR-12808", "Arranque y juego integrado"]
    exito: "Cuatro chips, cuatro papeles: procesar, dibujar, elegir y arrancar."
    pistas:
      - { texto: "Los dos «315-» son de Sega: el VDP y el de E/S." }
    escalera:
      - "Toque los chips de la foto de la primera tarjeta para leer sus fichas."
    solucion: "Z80: programa. 315-5246: vídeo y sonido. 315-5237: selecciones y mandos. MPR-12808: arranque."

  - id: por-que-sin-cartucho
    tipo: porque
    titulo: "Arranca sin cartucho"
    texto: "Sin cartucho, el Master System II arranca un juego. ¿Por qué?"
    libro: ["sms#3", "sms#70"]
    widget:
      tipo: figura
      consola: { maquina: sms }
      zonas:
        - { id: bios, hotspot: bios, rotulo: "ROM de arranque" }
        - { id: cart, hotspot: cart, rotulo: "Ranura de cartucho" }
    opciones:
      - texto: "La ROM de arranque lleva un juego integrado."
        bien: true
        porque: "La MPR-12808 tiene 1 Mbit: el arranque de Sega y un juego, con su propio paginador."
      - texto: "Lee el juego de la RAM, que lo conserva."
        porque: "La RAM se borra al apagar. El juego está en la ROM de arranque."
      - texto: "Lo genera el VDP solo."
        porque: "El VDP dibuja lo que le manda el Z80; el programa del juego está en la ROM."
    escalera:
      - "Lea la ficha de la ROM de arranque."
    solucion: "La ROM de arranque, de 128 KB, lleva un juego integrado."

  - id: toque-huella
    tipo: tocar
    titulo: "La placa del manual, desnuda"
    texto: "Esta es la 171-5922A sin piezas, la del manual. Toque la huella del VDP, de 64 patas."
    libro: ["sms#21", "sms#61", "sms#26", "sms#22", "sms#25"]
    widget:
      tipo: figura
      consola: { maquina: sms, foto: 5922a }
      zonas:
        - { id: ic5, hotspot: b-ic5, rotulo: "Huella larga, en el centro" }
        - { id: ic1, hotspot: b-ic1, rotulo: "Huella vertical, arriba" }
        - { id: ic4, hotspot: b-ic4, rotulo: "Huella larga, a la derecha" }
    tocar:
      bien: [ic5]
      porque:
        ic1: "Es IC1, la huella de 40 patas del Z80."
        ic4: "Es IC4, la huella de 48 patas del 315-5237."
    exito: "IC5: la serigrafía coincide con las referencias del manual."
    escalera:
      - "Lea la serigrafía: busque «IC5»."
    solucion: "IC5, en el centro: la huella de 64 patas del VDP."

  - id: prediga-puertos
    tipo: predecir
    titulo: "Lo que no tiene"
    texto: "El Master System II tiene ranura de cartucho. ¿Qué más tiene para ampliar?"
    libro: ["sms#11"]
    widget:
      tipo: figura
      consola: { maquina: sms }
      zonas:
        - { id: cart, hotspot: cart, rotulo: "Ranura de cartucho" }
    opciones:
      - texto: "Nada más: ni ranura de tarjeta ni puerto de expansión."
        bien: true
        porque: "El SMS II solo tiene la ranura de cartucho, con el bus completo del Z80."
      - texto: "Una ranura de tarjeta."
        porque: "El SMS II no la tiene: solo la ranura de cartucho."
      - texto: "Un puerto de expansión."
        porque: "Tampoco: el bus solo sale por la ranura de cartucho."
    escalera:
      - "Busque en la foto otros conectores de borde."
    solucion: "Nada más: la ranura de cartucho es la única."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: ["sms#2", "sms#5", "sms#4", "sms#3"]
    ideas:
      - { titulo: "Una CPU.", texto: "Un Z80 ejecuta el arranque y el juego." }
      - { titulo: "El VDP.", texto: "Hace la imagen y lleva el sonido dentro." }
      - { titulo: "Poca RAM.", texto: "8 KB de trabajo y 16 KB de vídeo." }
      - { titulo: "Un juego dentro.", texto: "La ROM de arranque trae un juego integrado." }
