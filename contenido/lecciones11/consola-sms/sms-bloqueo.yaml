# «Consolas por dentro» · Master System II 6: la cabecera «TMR SEGA» y la región. El SMS no tiene chip de bloqueo: la
# ROM de arranque de los modelos de exportación busca la cabecera «TMR SEGA» en $7FF0 y compara la suma de
# comprobación; los cartuchos japoneses son de 44 contactos y los occidentales de 50; y un juego de 60 Hz va más lento
# en una PAL. Fuentes: SMS Power «ROM header», ConsoleMods «Master System:Region Information» y los datos de la consola
# (sms#n).
# 1.2.1: se tocan la ROM que mira el cartucho y el chip que marca los cuadros; la dirección de la cabecera se escribe
# en hexadecimal, como el código de región de exportación; el circuito
# lógico tiene meta. Quedan dos preguntas: el cartucho japonés y el adaptador.
leccion: consola-sms/sms-bloqueo

libro:
  "sms#11": "CN1 (50 contactos)"
  "sms#77": "Durante el arranque es la ROM de arranque (/CE0) la que responde a estas direcciones"
  "sms#5": "Procesador de vídeo"
  "sms#87": "Los ocho primeros bytes de la cabecera son el texto ASCII «TMR SEGA»; la cabecera está en $7FF0"
  "sms#88": "Las BIOS de los Master System de exportación y de la Game Gear piden la cabecera para dar los datos por válidos"
  "sms#89": "La palabra de $7FFA es la suma de comprobación de la ROM para las BIOS de exportación"
  "sms#90": "$3, SMS Japón; $4, SMS exportación; $5, Game Gear Japón"
  "sms#91": "Solo la BIOS de los SMS de exportación comprueba el código de región"
  "sms#92": "La BIOS del SMS no distingue entre regiones para la mayoría de los juegos, pero sí comprueba que el juego tenga una cabecera"
  "sms#93": "Los cartuchos japoneses tienen 44 contactos y los occidentales 50"
  "sms#94": "Los juegos no optimizados para 50 Hz van más lentos en una consola PAL"
  "sms#95": "con un adaptador que lleva una pequeña ROM de arranque con la cabecera"

modelo:
  valores: {}
  calculos: {}

tarjetas:
  - id: explore-sin-chip
    tipo: tocar
    titulo: "Sin chip de bloqueo"
    texto: "El SMS no lleva un CIC: quien mira el cartucho al encender es un programa. Toque el chip donde está."
    libro: ["sms#92", "sms#77", "sms#11"]
    widget:
      tipo: figura
      consola: { maquina: sms }
      zonas:
        - { id: z80, hotspot: z80, rotulo: "Chip largo vertical, arriba en el centro" }
        - { id: bios, hotspot: bios, rotulo: "Chip vertical, arriba a la derecha" }
        - { id: ram, hotspot: ram, rotulo: "Chip vertical, arriba del todo a la derecha" }
        - { id: vdp, hotspot: vdp, rotulo: "Chip largo, en el centro" }
        - { id: cart, hotspot: cart, rotulo: "Ranura, en el centro" }
    tocar:
      bien: [bios]
      porque:
        z80: "El Z80 ejecuta la comprobación, pero el programa está guardado en otro chip."
        ram: "La RAM se borra al apagar."
        vdp: "El VDP hace la imagen y el sonido."
        cart: "El cartucho es lo que se comprueba."
    exito: "La ROM de arranque: contesta al encender (/CE0) y no distingue regiones en la mayoría de los juegos, pero sí comprueba que el juego tenga una cabecera."
    escalera:
      - "Es la ROM, junto a la CPU."
    solucion: "La ROM de arranque."

  - id: prediga-cabecera
    tipo: leer
    titulo: "¿Qué busca la ROM de arranque?"
    texto: "La ROM de arranque de un SMS de exportación busca el texto «TMR SEGA» en la cabecera del cartucho. Escriba en hexadecimal dónde está la cabecera."
    libro: ["sms#87", "sms#88"]
    widget:
      tipo: figura
      consola: { maquina: sms }
      zonas:
        - { id: cart, hotspot: cart, rotulo: "Ranura de cartucho" }
    leer:
      objetivo: "0x7FF0"
      base: 16
      cifras: 16
      rotulo: "Dirección de la cabecera"
      errores:
        - { expr: "32762", texto: "Esa es la palabra de la suma de comprobación, $7FFA: la cabecera empieza antes." }
    exito: "$7FF0: sus ocho primeros bytes son «TMR SEGA». Sin cabecera, no da los datos por válidos."
    escalera:
      - "Es la dirección de la cabecera que usa el software conocido; la suma va diez bytes después."
    solucion: "$7FF0."

  - id: explore-comprobacion
    tipo: explorar
    titulo: "Dos comprobaciones"
    texto: "La ROM de exportación pide la cabecera y una suma de comprobación correcta. Consiga que dé el cartucho por válido."
    libro: ["sms#88", "sms#89"]
    widget:
      tipo: logica
      entradas: [{ id: TMR, rotulo: "Cabecera «TMR SEGA»" }, { id: SUMA, rotulo: "Suma correcta" }]
      piezas:
        - { id: y1, tipo: and, entradas: [TMR, SUMA] }
      salidas:
        - { id: VALIDO, de: y1, rotulo: "Datos válidos" }
    objetivo:
      condiciones:
        - { led: VALIDO, valor: 1, rotulo: "Datos válidos" }
      logrado: "Cabecera y suma correctas: la ROM de arranque da los datos por válidos y pasa al juego."
      pistas:
        - { texto: "Falta una de las dos: la suma está en la palabra de $7FFA." }
    escalera:
      - "Hacen falta las dos."
    solucion: "Cabecera y suma correctas."

  - id: tabla-comprobacion
    tipo: tabla
    titulo: "La tabla de la ROM de arranque"
    texto: "Rellene cuándo da el cartucho por válido (1)."
    libro: ["sms#88", "sms#89"]
    widget:
      tipo: logica
      entradas: [{ id: TMR, rotulo: "Cabecera «TMR SEGA»" }, { id: SUMA, rotulo: "Suma correcta" }]
      piezas:
        - { id: y1, tipo: and, entradas: [TMR, SUMA] }
      salidas:
        - { id: VALIDO, de: y1, rotulo: "Datos válidos" }
      ocultar: true
    tabla:
      salidas: [VALIDO]
    exito: "Una AND: hacen falta las dos cosas."
    escalera:
      - "Con una de las dos mal, no sigue."
    solucion: "Solo en la fila con las dos entradas a 1."

  - id: empareje-regiones
    tipo: leer
    titulo: "El código de región"
    texto: "Los 4 bits altos del byte 16 de la cabecera dicen para qué sistema es: $3, SMS Japón; $5, Game Gear Japón. Escriba en hexadecimal el de un SMS de exportación."
    libro: ["sms#90", "sms#91"]
    widget:
      tipo: figura
      consola: { maquina: sms }
      zonas:
        - { id: cart, hotspot: cart, rotulo: "Ranura de cartucho" }
    leer:
      objetivo: "0x4"
      base: 16
      cifras: 4
      rotulo: "Código de región"
      errores:
        - { expr: "3", texto: "$3 es SMS Japón." }
        - { expr: "5", texto: "$5 es Game Gear Japón." }
    exito: "$4: SMS exportación. Solo la ROM de los SMS de exportación mira este código."
    escalera:
      - "Los dos de SMS van seguidos."
    solucion: "$4."

  - id: prediga-japones
    tipo: predecir
    titulo: "Un cartucho japonés"
    texto: "Tiene un cartucho japonés de Master System. ¿Lo puede meter en el SMS II PAL?"
    libro: ["sms#93", "sms#11"]
    widget:
      tipo: figura
      consola: { maquina: sms }
      zonas:
        - { id: cart, hotspot: cart, rotulo: "Ranura de cartucho" }
    opciones:
      - texto: "No: tiene 44 contactos y otra forma; la ranura es de 50."
        bien: true
        porque: "Los japoneses son más altos, más estrechos y más gruesos, con 44 contactos."
      - texto: "Sí: la ranura es la misma en todo el mundo."
        porque: "No lo es: los occidentales tienen 50 contactos y los japoneses 44."
      - texto: "Sí, pero la ROM de arranque lo bloquea."
        porque: "Ni siquiera entra: el formato del cartucho es otro."
    escalera:
      - "Cuente los contactos de la ranura del SMS II."
    solucion: "No: el japonés tiene 44 contactos y la ranura occidental, 50."

  - id: por-que-adaptador
    tipo: porque
    titulo: "El truco del adaptador"
    texto: "Un adaptador con una pequeña ROM de arranque deja jugar juegos sin cabecera. ¿Por qué?"
    libro: ["sms#95", "sms#88"]
    widget:
      tipo: figura
      consola: { maquina: sms }
      zonas:
        - { id: bios, hotspot: bios, rotulo: "ROM de arranque" }
    opciones:
      - texto: "Su ROM lleva la cabecera que pide la ROM de arranque de la consola."
        bien: true
        porque: "La consola encuentra una cabecera válida en el adaptador y sigue."
      - texto: "Desactiva el chip de bloqueo de la consola."
        porque: "No hay chip de bloqueo: lo que falta es la cabecera, y el adaptador la aporta."
      - texto: "Convierte el juego a PAL."
        porque: "No cambia la norma: solo le da a la ROM de arranque la cabecera que busca."
    escalera:
      - "¿Qué le falta a un juego sin cabecera?"
    solucion: "Aporta la cabecera que la ROM de arranque necesita ver."

  - id: lento-pal
    tipo: tocar
    titulo: "Un juego que va lento"
    texto: "Un juego norteamericano va más lento en el SMS II PAL: no está optimizado para 50 Hz. Toque el chip que marca los cuadros."
    libro: ["sms#94", "sms#5"]
    widget:
      tipo: figura
      consola: { maquina: sms }
      zonas:
        - { id: z80, hotspot: z80, rotulo: "Chip largo vertical, arriba en el centro" }
        - { id: bios, hotspot: bios, rotulo: "Chip vertical, arriba a la derecha" }
        - { id: ram, hotspot: ram, rotulo: "Chip vertical, arriba del todo a la derecha" }
        - { id: vdp, hotspot: vdp, rotulo: "Chip largo, en el centro" }
        - { id: cart, hotspot: cart, rotulo: "Ranura, en el centro" }
    tocar:
      bien: [vdp]
      porque:
        z80: "El Z80 ejecuta el juego al ritmo que le marcan los cuadros del VDP."
        bios: "La ROM de arranque solo comprueba la cabecera y pasa al juego."
        ram: "La RAM no marca ningún ritmo."
        cart: "El juego es el mismo; lo que cambia son los cuadros por segundo."
    exito: "El VDP: en una PAL da unos 50 cuadros por segundo. Un juego que cuenta cuadros avanza menos por segundo: no es una avería."
    escalera:
      - "El chip de vídeo cuenta las líneas y los cuadros."
    solucion: "El VDP."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: ["sms#92", "sms#87", "sms#93", "sms#94"]
    ideas:
      - { titulo: "Sin chip.", texto: "La ROM de arranque mira la cabecera, no un CIC." }
      - { titulo: "«TMR SEGA».", texto: "Cabecera y suma correctas: los dos hacen falta." }
      - { titulo: "Otro cartucho.", texto: "44 contactos en Japón, 50 en el resto." }
      - { titulo: "50 Hz.", texto: "Un juego no optimizado para 50 Hz va más lento en una PAL." }
