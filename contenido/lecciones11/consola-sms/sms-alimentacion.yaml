# «Consolas por dentro» · Master System II 2: la alimentación. El camino del esquema del manual de Sega (CN4 → ferrita
# JV → interruptor → diodo D2 → 7805 IC8 → red VCC), el adaptador de 9 V, el 7805 atornillado al blindaje, la potencia
# que disipa y su dropout (libro, sección 8.4). Fuentes: los datos de la consola (sms#n), ConsoleMods «Comparison of
# Power Supplies» y el libro.
# 1.2.1: el camino se toca en orden en la foto; el 7805 es un circuito vivo (esquema «regulador-lineal», como en la
# piloto de la SNES): se mide la caída con los 9 V del adaptador (sin contar el diodo D2), se escribe el calor con una
# carga de ejemplo de 0,5 A, se toca la pieza que lo disipa y se sube la entrada hasta que regula. Quedan dos preguntas:
# el adaptador y lo que se apaga si muere el 7805.
leccion: consola-sms/sms-alimentacion

libro:
  "sms#16": "Regulador lineal de +5 V atornillado al blindaje, que hace de disipador"
  "sms#17": "Pasa por la ferrita JV, el interruptor y el diodo D2 antes del regulador"
  "sms#19": "Corta la entrada de continua antes del diodo y el regulador"
  "sms#76": "el regulador 7805 (IC8) da los +5 V de toda la placa"
  "sms#96": "Sega Master System: 9 V de continua, 1 A, punta negativa, clavija de 5,5 × 2,1 mm"
  "sms#101": "Red VCC del esquema (alimentación)"
  "sms#104": "Red VIN del esquema (alimentación): llega a C41, CP4, D2, IC8"
  "cap08#65": "P_(\"disipada\")"
  "cap08#66": "Más de la mitad de la energía se convierte en calor"
  "cap08#67": "necesita unos 2 V de diferencia entre entrada y salida para funcionar"

modelo:
  valores:
    V_in: { sim: "V_{entrada}", nombre: "tensión en la entrada del 7805", unidad: V, valor: 5 }
    V_ad: { sim: "V_{adaptador}", nombre: "tensión del adaptador", unidad: V, valor: 9 }
    V_o: { sim: "V_{salida}", nombre: "salida del 7805", unidad: V, valor: 5 }
    I: { sim: "I", nombre: "corriente de la consola (ejemplo)", unidad: A, valor: 0.5 }
    V_dr: { sim: "V_{do}", nombre: "dropout del 78xx", unidad: V, valor: 2 }
    R_c: { sim: "R_{L}", nombre: "carga de ejemplo: la que pide 0,5 A a 5 V", unidad: Ω, valor: 10 }
    on_c: { tipo: interruptor, nombre: "consola encendida", valor: 1 }
  calculos:
    I_reg: { si: on_c, entonces: "V_reg/R_c", sino: "0", sim: "I", nombre: "corriente del 7805 al subir la entrada", unidad: A }
    V_sa: { expr: "min(V_o, V_ad - V_dr)", sim: "V_{salida}", nombre: "salida del 7805 con el adaptador", unidad: V }
    I_a: { si: on_c, entonces: "V_sa/R_c", sino: "0", sim: "I", nombre: "corriente con el adaptador", unidad: A }
    V_pa: { expr: "V_ad - V_sa", sim: "V_{entrada} − V_{salida}", nombre: "caída en el 7805", unidad: V }
    P_a: { expr: "V_pa*I_a", sim: "P_{disipada}", nombre: "calor que disipa el 7805 con el adaptador", unidad: W, cifras: 3 }
    P_mal: { expr: "V_ad*I_a", sim: "V · I", nombre: "los 9 V enteros por la corriente", unidad: W }
    V_reg: { expr: "min(V_o, max(0, V_in - 2))", sim: "V_{salida}", nombre: "tensión de salida del 7805 (modelo)", unidad: V, cifras: 3 }
    P_d: { expr: "(V_ad - V_o)*I", sim: "P_{disipada}", nombre: "potencia que disipa el 7805", unidad: W, cifras: 3 }

tarjetas:
  - id: ordene-camino
    tipo: tocar
    fase: "Ordene"
    titulo: "El camino de la corriente"
    texto: "Según el esquema del manual, toque en el orden de la corriente: la toma, el interruptor y el regulador."
    libro: ["sms#17", "sms#19", "sms#104", "sms#76", "sms#16"]
    widget:
      tipo: figura
      consola: { maquina: sms }
      zonas:
        - { id: dc, hotspot: dc, rotulo: "Conector, arriba a la izquierda" }
        - { id: power, hotspot: power, rotulo: "Interruptor, abajo a la izquierda" }
        - { id: reg, hotspot: reg, rotulo: "Pieza atornillada, a la izquierda" }
        - { id: pausa, hotspot: pausa, rotulo: "Pulsador, a la izquierda" }
    tocar:
      bien: [dc, power, reg]
      orden: true
      porque:
        pausa: "Es el botón de pausa: lleva /NMI-IN a masa, no la corriente."
    pistas:
      - { texto: "Lo primero, la toma; lo último, el regulador." }
    exito: "CN4, la ferrita JV, el interruptor, el diodo D2 y el 7805 (IC8): un solo regulador para los 5 V de toda la placa."
    escalera:
      - "El interruptor corta la entrada antes del diodo y el regulador."
    solucion: "Toma CN4, interruptor y 7805."

  - id: prediga-adaptador
    tipo: predecir
    titulo: "El adaptador"
    texto: "¿Qué adaptador pide el Master System?"
    libro: ["sms#96", "sms#17"]
    widget:
      tipo: figura
      consola: { maquina: sms }
      zonas:
        - { id: dc, hotspot: dc, rotulo: "Toma CN4" }
    opciones:
      - texto: "9 V de continua, 1 A, punta negativa."
        bien: true
        porque: "Lo dice la tabla de ConsoleMods: 9 V, 1 A, punta negativa y clavija de 5,5 × 2,1 mm."
      - texto: "5 V de continua: los que usa la placa."
        porque: "Los 5 V los hace el 7805 dentro; necesita más tensión en la entrada: 9 V."
      - texto: "9 V de alterna."
        porque: "Es de continua: la toma pasa directamente por la ferrita, el interruptor y un diodo hasta el 7805."
    escalera:
      - "El regulador necesita más tensión en la entrada que los 5 V que da."
    solucion: "9 V de continua, 1 A, punta negativa."

  - id: mida-caida
    tipo: medir
    titulo: "Lo que sobra"
    texto: "Sin contar el diodo, al 7805 le llegan los 9 V del adaptador y da 5 V. Mida lo que cae en él."
    nota: "El 7805 por dentro: elemento de paso, referencia y amplificador de error."
    libro: ["sms#96", "sms#16", "cap08#67"]
    fijar: { V_ad: 9, V_o: 5, on_c: 1 }
    widget:
      tipo: circuito
      esquema: regulador-lineal
      piezas: { entrada: V_ad, ref: V_o, dropout: V_dr, carga: R_c, interruptor: on_c }
      corriente: I_a
      mide: { vout: V_sa, iin: I_a, iout: I_a, icarga: I_a, vpaso: V_pa, p_paso: P_a }
      instrumento:
        tipo: multimetro
        modos: [V]
        puntos: { in: "Entrada del 7805", out: "Salida del 7805", "0": "Masa" }
      mandos: []
    medir:
      magnitud: tension
      entre: [in, out]
      valor: V_pa
      porque:
        "in/0": "Así mide la entrada respecto a masa: los 9 V del adaptador."
        "out/0": "Así mide la salida respecto a masa: los 5 V regulados."
    exito: "4 V: lo que sobra entre los 9 V del adaptador y los 5 V de la placa."
    escalera:
      - "Lo que cae en el 7805 se mide entre sus dos patas: la entrada y la salida."
    solucion: "Roja en la entrada y negra en la salida del 7805."

  - id: formula-disipa
    tipo: leer
    titulo: "Lo que sobra, en calor"
    texto: "Con una carga de ejemplo que pide 0,5 A, mida la corriente que pasa por el 7805 y escriba el calor que disipa."
    libro: ["cap08#65", "cap08#66", "sms#96"]
    fijar: { V_ad: 9, V_o: 5, on_c: 1 }
    widget:
      tipo: circuito
      esquema: regulador-lineal
      piezas: { entrada: V_ad, ref: V_o, dropout: V_dr, carga: R_c, interruptor: on_c }
      corriente: I_a
      mide: { vout: V_sa, iin: I_a, iout: I_a, icarga: I_a, vpaso: V_pa, p_paso: P_a }
      instrumento:
        tipo: multimetro
        puntos: { in: "Entrada del 7805", out: "Salida del 7805", "0": "Masa" }
        ramas: { vmi: "Entre el adaptador y el 7805", vml: "Hacia la consola" }
      mandos: []
    leer:
      objetivo: P_a
      unidad: W
      rotulo: "Calor en el 7805"
      errores:
        - { expr: "P_mal", texto: "Ha multiplicado los 9 V enteros. El 7805 solo quema la diferencia entre entrada y salida." }
    exito: "(9 − 5) V · 0,5 A = 2 W: más de la mitad de la energía se convierte en calor."
    escalera:
      - "El calor es la caída en el 7805 por la corriente que lo atraviesa."
    solucion: "(9 − 5) V · 0,5 A = 2 W."
    comprobar:
      - { P_a: 2, I_a: 0.5, V_pa: 4, P_mal: 4.5 }

  - id: por-que-blindaje
    tipo: elegir
    titulo: "¿Quién se calienta?"
    texto: "Ese calor sale de una sola pieza: la que va en serie con la consola y se queda la diferencia. Tóquela en el esquema."
    libro: ["sms#16", "cap08#66", "cap08#65"]
    fijar: { V_ad: 9, V_o: 5, on_c: 1 }
    widget:
      tipo: circuito
      esquema: regulador-lineal
      piezas: { entrada: V_ad, ref: V_o, dropout: V_dr, carga: R_c, interruptor: on_c }
      corriente: I_a
      mide: { vout: V_sa, iin: I_a, iout: I_a, icarga: I_a, vpaso: V_pa, p_paso: P_a }
      mandos: []
    elegir:
      zonas: { paso: "Transistor de arriba", ao: "Triángulo del centro", entrada: "Fuente de la izquierda", carga: "Resistencia de la derecha" }
      bien: [paso]
      porque:
        ao: "Es el amplificador de error: compara la salida con la referencia y gobierna el paso, pero apenas lleva corriente."
        entrada: "Es el adaptador: entrega la energía, no la quema."
        carga: "Es la consola: la que usa los 5 V."
    exito: "El elemento de paso del 7805: por eso va atornillado al blindaje, que le hace de disipador."
    escalera:
      - "Busque la pieza que está entre la entrada y la salida, por la que pasa toda la corriente."
    solucion: "El transistor de arriba, el elemento de paso."

  - id: ajuste-dropout
    tipo: explorar
    titulo: "¿Cuánta entrada necesita?"
    texto: "El 78xx necesita unos 2 V más en la entrada que en la salida. Suba la entrada hasta que el 7805 dé sus 5 V."
    libro: ["cap08#67", "sms#16"]
    fijar: { V_o: 5, on_c: 1 }
    inicio: { V_in: 5 }
    widget:
      tipo: circuito
      esquema: regulador-lineal
      piezas: { entrada: V_in, ref: V_o, dropout: V_dr, carga: R_c, interruptor: on_c }
      lectura: { valor: V_reg, rotulo: "Salida del 7805" }
      corriente: I_reg
      mide: { vout: V_reg, iin: I_reg, iout: I_reg, icarga: I_reg }
      mandos: [ { valor: V_in, min: 5, max: 10, paso: 0.5, rotulo: "Entrada, V_{entrada}" } ]
    objetivo:
      condiciones:
        - { valor: V_reg, mayor: 4.99, rotulo: "Salida: {{V_reg}}" }
      logrado: "Con {{V_in}} en la entrada ya da sus 5 V: la entrada supera la salida en unos 2 V. Los 9 V del adaptador sobran."
      pistas:
        - { texto: "Todavía no regula: a la entrada le faltan voltios. Súbala." }
    escalera:
      - "Salida + margen: 5 + 2."
    solucion: "Con unos 7 V o más en la entrada."
    comprobar:
      - { con: { V_in: 7 }, V_reg: 5 }

  - id: prediga-vcc
    tipo: predecir
    titulo: "Un solo regulador"
    texto: "En el esquema, la red VCC del 7805 llega a IC1–IC9. Si el 7805 muere, ¿qué se apaga?"
    libro: ["sms#101", "sms#76"]
    widget:
      tipo: figura
      consola: { maquina: sms }
      zonas:
        - { id: reg, hotspot: reg, rotulo: "Regulador 7805" }
        - { id: z80, hotspot: z80, rotulo: "Z80" }
        - { id: vdp, hotspot: vdp, rotulo: "VDP" }
    opciones:
      - texto: "Toda la placa: todos los chips cuelgan de la red VCC."
        bien: true
        porque: "IC8 da los +5 V de toda la placa: la CPU, el VDP, las memorias y el codificador."
      - texto: "Solo el sonido."
        porque: "El sonido está dentro del VDP, que también cuelga de VCC. Se apaga todo."
      - texto: "Media placa: hay otro regulador."
        porque: "El SMS II tiene un solo 7805, IC8, para toda la placa."
    escalera:
      - "¿Cuántos reguladores hay en la placa?"
    solucion: "Toda la placa: el único 7805 alimenta IC1–IC9."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: ["sms#17", "sms#96", "sms#16", "cap08#67"]
    ideas:
      - { titulo: "El camino.", texto: "CN4, ferrita, interruptor, diodo y 7805." }
      - { titulo: "El adaptador.", texto: "9 V de continua y punta negativa." }
      - { titulo: "El calor.", texto: "El blindaje hace de disipador del 7805." }
      - { titulo: "Un regulador.", texto: "IC8 da los 5 V de toda la placa." }
