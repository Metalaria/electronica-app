# «Consolas por dentro» · Master System II 4: memoria, puertos y decodificación. El decodificador del explorador
# (arquitectura sms.ts sobre sus direcciones de ejemplo: manual de Sega y SMS Power): los puertos de E/S elegidos por
# A7 y A6 (circuito lógico y su tabla), /CSRAM = /MREQ · A15 · A14 (una AND), el espejo de la RAM por no decodificar
# A13, el paginador en $FFFF y el puerto $3E que pasa de la ROM de arranque al cartucho. Fuentes: sms#n y el libro
# (decodificador, 28.3; los espejos, 38.11).
# 1.2.1: se tocan los dos chips que deciden y quién contesta al encender; los dos circuitos lógicos tienen meta (los
# mandos; la RAM, subiendo A14); el espejo y la celda de $FFFF se escriben en hexadecimal.
leccion: consola-sms/sms-buses

libro:
  "sms#2": "ve el VDP, el PSG y los mandos como puertos de E/S"
  "sms#5": "Decodifica sus propios puertos ($7E/$7F, $BE/$BF) con A0, A6, A7 e /IOREQ"
  "sms#11": "Lleva el bus completo del Z80 (A0–A15, D0–D7 y todo el control)"
  "sms#71": "Espejada en $E000–$FFFF porque no se decodifica A13"
  "sms#77": "Durante el arranque es la ROM de arranque (/CE0) la que responde a estas direcciones"
  "sms#78": "$8123 cae en la ventana 2"
  "sms#79": "VDP: /CSRAM = /MREQ · A15 · A14"
  "sms#80": "La RAM no ve A13, así que $E010 es la celda $C010"
  "sms#81": "el paginador del cartucho (o el de la ROM de arranque) captura el dato como registro de banco de la ventana 2 ($FFFF)"
  "sms#82": "A7 A6 = 10 → VDP: datos / control"
  "sms#84": "A7 A6 = 01 → VDP: contadores / PSG"
  "sms#85": "A7 A6 = 11 → 315-5237: mandos"
  "sms#86": "A7 A6 = 00 → 315-5237 ($3E/$3F)"
  "sms#67": "guarda el puerto $3E y con él convierte /MREQ y las líneas de dirección en /CE0 (BIOS), /CE1 (RAM, a partir de /CSRAM del VDP) y /CE3 (cartucho)"
  "cap29#76": "Decodificador: de n entradas a 2ⁿ salidas, con una sola activa"
  "cap37#359": "aparecen porque la decodificación de direcciones es incompleta"

modelo:
  valores: {}
  calculos: {}

tarjetas:
  - id: explore-buses
    tipo: tocar
    titulo: "Quién decide"
    texto: "El Z80 pone A0–A15 y D0–D7 en el bus, que llega entero a la ranura. Toque los dos chips que deciden quién contesta."
    libro: ["sms#11", "sms#5", "sms#67", "sms#2"]
    widget:
      tipo: figura
      consola: { maquina: sms }
      ampliar: 2.65
      zonas:
        - { id: z80, hotspot: z80, rotulo: "Chip largo vertical, arriba en el centro" }
        - { id: bios, hotspot: bios, rotulo: "Chip vertical, arriba a la derecha" }
        - { id: ram, hotspot: ram, rotulo: "Chip vertical, arriba del todo a la derecha" }
        - { id: vdp, hotspot: vdp, rotulo: "Chip largo, en el centro" }
        - { id: io, hotspot: io, rotulo: "Chip largo, a la derecha" }
        - { id: cart, hotspot: cart, rotulo: "Ranura, en el centro" }
    tocar:
      bien: [vdp, io]
      todas: true
      porque:
        z80: "El Z80 pone la dirección; deciden otros."
        bios: "La ROM de arranque contesta cuando la eligen."
        ram: "La RAM contesta cuando la eligen."
        cart: "El cartucho recibe el bus y contesta cuando lo eligen."
    exito: "El VDP decodifica sus propios puertos y baja /CSRAM; el 315-5237, con el puerto $3E, elige la ROM de arranque, la RAM o el cartucho."
    escalera:
      - "Uno es el de vídeo; el otro, el de E/S."
    solucion: "El VDP y el 315-5237."

  - id: explore-puertos
    tipo: explorar
    titulo: "Los puertos, por dos bits"
    texto: "En una instrucción IN u OUT, A7 y A6 eligen quién contesta. Consiga leer los mandos."
    libro: ["sms#82", "sms#84", "sms#85", "sms#86", "cap29#76"]
    widget:
      tipo: logica
      entradas: [{ id: A7, rotulo: "A7" }, { id: A6, rotulo: "A6" }]
      piezas:
        - { id: dec, tipo: decodificador, bits: 2, entradas: [A6, A7] }
      salidas:
        - { id: CTRL, de: dec.y0, rotulo: "Control $3E" }
        - { id: PSG, de: dec.y1, rotulo: "PSG" }
        - { id: VDP, de: dec.y2, rotulo: "VDP" }
        - { id: MANDOS, de: dec.y3, rotulo: "Mandos" }
    objetivo:
      condiciones:
        - { led: MANDOS, valor: 1, rotulo: "Contestan los mandos" }
      logrado: "A7 y A6 a 1: puertos $C0–$FF, como $DC y $DD."
      pistas:
        - { cuando: { led: VDP, valor: 1 }, texto: "Con A7 = 1 y A6 = 0 contesta el VDP: suba A6." }
        - { texto: "Los mandos están arriba del todo: A7 y A6 a 1." }
    escalera:
      - "Los mandos son $DC y $DD: mire sus dos bits altos."
    solucion: "A7 = 1, A6 = 1."

  - id: tabla-puertos
    tipo: tabla
    titulo: "La tabla de los puertos"
    texto: "Rellene cuándo contestan el VDP (1) y los mandos (1)."
    libro: ["sms#82", "sms#85", "cap29#76"]
    widget:
      tipo: logica
      entradas: [{ id: A7, rotulo: "A7" }, { id: A6, rotulo: "A6" }]
      piezas:
        - { id: dec, tipo: decodificador, bits: 2, entradas: [A6, A7] }
      salidas:
        - { id: VDP, de: dec.y2, rotulo: "VDP" }
        - { id: MANDOS, de: dec.y3, rotulo: "Mandos" }
      ocultar: true
    tabla:
      salidas: [VDP, MANDOS]
    exito: "A7 = 1 y A6 = 0: el VDP. Los dos a 1: los mandos."
    escalera:
      - "Los puertos del VDP son $BE y $BF: A7 = 1."
      - "Los mandos son $DC y $DD: A7 y A6 a 1."
    solucion: "VDP: solo en la fila A7 = 1, A6 = 0. Mandos: solo en la fila A7 = 1, A6 = 1."

  - id: empareje-puertos
    tipo: pregunta
    fase: "Empareje"
    titulo: "Cada puerto, su chip"
    texto: "Empareje cada puerto con quien contesta."
    libro: ["sms#82", "sms#84", "sms#85", "sms#86"]
    emparejar:
      - ["Escribir en $BE", "Los datos del VDP"]
      - ["Escribir en $7F", "El PSG"]
      - ["Leer $DC", "El mando 1"]
      - ["Escribir en $3E", "El control de memoria"]
    exito: "Ocho bits de puerto, pero dos bastan para elegir."
    pistas:
      - { texto: "$BE tiene A7 = 1 y A6 = 0; $7F, A7 = 0 y A6 = 1." }
    escalera:
      - "Mire los dos bits altos de cada puerto."
    solucion: "$BE: VDP. $7F: PSG. $DC: mando 1. $3E: control de memoria."

  - id: prediga-ram
    tipo: explorar
    titulo: "¿Se elige la RAM?"
    texto: "El VDP elige la RAM con /MREQ, A15 y A14; el Z80 lee $8123, del cartucho. Consiga que se elija la RAM."
    libro: ["sms#79", "sms#67", "sms#78"]
    widget:
      tipo: logica
      entradas: [{ id: MREQ, rotulo: "Acceso a memoria", valor: 1 }, { id: A15, rotulo: "A15", valor: 1 }, { id: A14, rotulo: "A14", valor: 0 }]
      piezas:
        - { id: y1, tipo: and, entradas: [MREQ, A15, A14] }
      salidas:
        - { id: RAM, de: y1, rotulo: "RAM elegida" }
    objetivo:
      condiciones:
        - { led: RAM, valor: 1, rotulo: "RAM elegida" }
      logrado: "Acceso a memoria con A15 y A14 a 1: $C000–$FFFF. En $8123, A14 = 0 y contesta el cartucho."
      pistas:
        - { texto: "/CSRAM pide A15 y A14 a 1, y un acceso a memoria." }
    escalera:
      - "Escriba $8123 en binario: ¿cómo son los dos bits altos?"
    solucion: "Suba A14: la AND necesita los tres a 1."

  - id: por-que-espejo
    tipo: leer
    titulo: "La misma RAM, dos direcciones"
    texto: "La RAM no ve A13, así que se repite en $E000–$FFFF. Escriba en hexadecimal la celda a la que llega $E010."
    libro: ["sms#80", "sms#71", "cap37#359"]
    widget:
      tipo: figura
      consola: { maquina: sms }
      zonas:
        - { id: ram, hotspot: ram, rotulo: "RAM de trabajo" }
    leer:
      objetivo: "0xC010"
      base: 16
      cifras: 16
      rotulo: "Celda de la RAM"
    exito: "$C010: las dos direcciones solo se distinguen en A13, que la RAM no ve. Decodificación incompleta."
    escalera:
      - "Ponga A13 a 0 en $E010."
    solucion: "$C010."

  - id: escribir-ffff
    tipo: leer
    titulo: "Escribir en $FFFF"
    texto: "El Z80 escribe en $FFFF, en el espejo de la RAM. Escriba en hexadecimal la celda de $C000–$DFFF que guarda el dato."
    libro: ["sms#81", "sms#71", "sms#80"]
    widget:
      tipo: figura
      consola: { maquina: sms }
      ampliar: 2.65
      zonas:
        - { id: ram, hotspot: ram, rotulo: "RAM" }
        - { id: cart, hotspot: cart, rotulo: "Cartucho" }
    leer:
      objetivo: "0xDFFF"
      base: 16
      cifras: 16
      rotulo: "Celda de la RAM"
    exito: "$DFFF. Y a la vez, el paginador del cartucho (o el de la ROM de arranque) toma el dato como registro de banco de la ventana 2: los dos se quedan con él."
    escalera:
      - "Ponga A13 a 0 en $FFFF."
    solucion: "$DFFF."

  - id: prediga-arranque
    tipo: tocar
    titulo: "Al encender"
    texto: "Nada más encender, el Z80 lee $0100. Toque lo que contesta."
    libro: ["sms#77", "sms#67"]
    widget:
      tipo: figura
      consola: { maquina: sms }
      ampliar: 2.65
      zonas:
        - { id: z80, hotspot: z80, rotulo: "Chip largo vertical, arriba en el centro" }
        - { id: bios, hotspot: bios, rotulo: "Chip vertical, arriba a la derecha" }
        - { id: ram, hotspot: ram, rotulo: "Chip vertical, arriba del todo a la derecha" }
        - { id: vdp, hotspot: vdp, rotulo: "Chip largo, en el centro" }
        - { id: io, hotspot: io, rotulo: "Chip largo, a la derecha" }
        - { id: cart, hotspot: cart, rotulo: "Ranura, en el centro" }
    tocar:
      bien: [bios]
      porque:
        z80: "El Z80 es quien lee."
        ram: "La RAM está en $C000–$DFFF; $0100 es zona de ROM."
        vdp: "El VDP contesta en puertos de E/S, no en $0100."
        io: "El 315-5237 elige quién contesta; no guarda el programa."
        cart: "Eso es después del arranque: el puerto $3E pasa entonces esas direcciones al cartucho (/CE3)."
    exito: "La ROM de arranque, con /CE0. Después, el puerto $3E pasa esas direcciones al cartucho (/CE3)."
    escalera:
      - "¿Qué programa se ejecuta antes que el juego?"
    solucion: "La ROM de arranque."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: ["sms#82", "sms#79", "sms#80", "sms#77"]
    ideas:
      - { titulo: "Puertos.", texto: "A7 y A6 eligen control, PSG, VDP o mandos." }
      - { titulo: "Una AND.", texto: "La RAM se elige con /MREQ, A15 y A14." }
      - { titulo: "Espejos.", texto: "Sin A13, la RAM se repite en $E000–$FFFF." }
      - { titulo: "El arranque.", texto: "Primero la ROM de arranque; luego, el cartucho." }
