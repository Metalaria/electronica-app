# Lección 1.2 de la sección 18.7 «Fiabilidad de un Sistema 24/7: Watchdog, Reinicio y Registro» (cap19; sec-19.N =
# impresas 18.N).
# - El watchdog refrescado desde una interrupción frente al esquema de banderas por tarea (figura 18.7, fig-19.8),
#   con zonas.
# - Sin modelo de circuito: la sección es de firmware.
# Paso práctico: «tocar» la causa de que el watchdog mal usado nunca dispare.
# 1.2.1 (autor121-sens, «aprender haciendo», GUIA §13): el watchdog con banderas se explora en un circuito «logica»
# (una AND de las tres banderas refresca; sin refresco, dispara); en otro se compara con el refresco desde varios sitios
# (una OR); el detector de alimentación baja, en un tercero (con él, reset; sin él, errático). Los malos usos de plazo
# pasan al «exito» de la interrupción y las tres pruebas del banco, a los «logrado». Quedan dos preguntas de opciones
# (la red de seguridad, el modo degradado) y las causas, por emparejar: 4 de 7
# haciendo (las causas y el modo degradado no tienen números ni montaje en el libro).
# 1.3 (contenido13): + rellenar la tabla de los dos montajes (varios sitios y banderas); el emparejamiento de las causas
# de reinicio pasa al resumen: 4/7 → 5/7.
leccion: cap19/sec-19.7

libro:
  164: "reinicia el sistema si el programa no lo refresca a tiempo"
  165: "Un sistema que se reinicia cada diez minutos tiene un problema que el watchdog está ocultando"
  167: "la interrupción sigue ejecutándose aunque el programa principal esté bloqueado"
  168: "basta que uno funcione para que el watchdog quede satisfecho"
  169: "el sistema pasa minutos inútil antes de reiniciar"
  170: "reinicios espurios durante operaciones legítimamente lentas"
  172: "lo hace solo si todas las banderas están puestas, borrándolas después"
  175: "es lo que convierte un fallo misterioso en uno clasificado"
  176: "por watchdog (bloqueo del programa), por caída de alimentación (problema eléctrico) o por reset externo (ruido en el pin)"
  180: "conviene arrancar en modo degradado en lugar de reintentar la misma operación"
  182: "ejecuta instrucciones de forma errática, y puede corromper su propia memoria no volátil"
  183: "Activarlo es una línea de configuración"
  185: "Reintentos con espera creciente"
  190: "provocar deliberadamente los fallos"
  191: "no está validado, por bien que funcione en condiciones normales"
  192: "El watchdog refrescado desde una interrupción frente al esquema de banderas por tarea."

modelo: { valores: {}, calculos: {} }

tarjetas:
  - id: explore-watchdog
    tipo: explorar
    titulo: "Un temporizador vigilante"
    texto: "Cada tarea pone su bandera al completar su ciclo, y el watchdog solo se refresca si están todas. Bloquee una tarea y consiga que el watchdog dispare."
    libro: [164, 172, 190, 192]
    widget:
      tipo: logica
      entradas:
        - { id: A, valor: 1, rotulo: "Tarea A completa" }
        - { id: B, valor: 1, rotulo: "Tarea B completa" }
        - { id: C, valor: 1, rotulo: "Tarea C completa" }
      piezas:
        - { id: y1, tipo: and, entradas: [A, B, C], rotulo: "Todas las banderas" }
        - { id: n1, tipo: not, entradas: [y1], rotulo: "Sin refresco" }
      salidas:
        - { id: REF, de: y1, rotulo: "Refresco" }
        - { id: WDT, de: n1, rotulo: "Watchdog dispara" }
    objetivo:
      condiciones:
        - { led: WDT, valor: 1, rotulo: "El watchdog dispara" }
      logrado: "Una tarea colgada basta: falta su bandera, no se refresca y el watchdog reinicia. Es la primera prueba del banco: bloquear el programa y comprobar que dispara."
      pistas:
        - { texto: "Con las tres banderas puestas, se refresca: cuelgue una tarea." }
    escalera:
      - "El refresco pide todas las banderas a la vez."
    solucion: "Cualquier tarea a cero."

  - id: porque-red
    tipo: porque
    titulo: "Red de seguridad"
    texto: "Un sistema con watchdog se reinicia cada diez minutos, pero sigue funcionando. ¿Por qué es una trampa?"
    libro: [164, 165]
    widget:
      tipo: figura
      figura: fig-19.8
      zonas:
        - { id: todo, rotulo: "Los dos montajes", rect: [4, 3, 443, 190] }
    opciones:
      - texto: "El watchdog está ocultando un problema que sigue ahí"
        bien: true
        porque: "No arregla el fallo: lo convierte en un reinicio. El bloqueo sigue sin resolver."
      - texto: "Porque el watchdog está averiado"
        porque: "Hace exactamente su trabajo: reiniciar. Lo que falla es el programa."
      - texto: "No es ninguna trampa: así debe funcionar"
        porque: "Es una red de seguridad, no una solución: diez minutos entre reinicios delatan un fallo."
    escalera:
      - "¿El watchdog arregla el bloqueo o solo sale de él?"
    solucion: "Está ocultando un problema: no arregla el fallo, lo convierte en un reinicio."

  - id: toque-interrupcion
    tipo: tocar
    titulo: "Un watchdog que nunca dispara"
    texto: "En el montaje de la izquierda el bucle principal está bloqueado y el watchdog no reinicia. Toque la causa."
    libro: [167, 169, 170]
    widget:
      tipo: figura
      figura: fig-19.8
      zonas:
        - { id: bucle, rotulo: "Recuadro discontinuo de arriba", rect: [12, 50, 102, 40] }
        - { id: interrupcion, rotulo: "Recuadro verde de abajo", rect: [12, 114, 102, 40] }
        - { id: perro, rotulo: "Recuadro gris de la derecha", rect: [148, 114, 64, 40] }
    tocar:
      bien: [interrupcion]
      porque:
        bucle: "El bucle bloqueado es el fallo que habría que detectar, no la causa de que no se detecte."
        perro: "El watchdog funciona: le llegan refrescos y por eso no dispara."
    exito: "La interrupción sigue ejecutándose aunque el bucle esté bloqueado: refresca y el watchdog deja de proteger. Y el plazo: ni minutos inútil, ni tan corto que reinicie al escribir en Flash."
    escalera:
      - "¿De dónde le llegan los refrescos al watchdog?"
    solucion: "La interrupción del temporizador."

  - id: prediga-banderas
    tipo: explorar
    titulo: "Desde varios sitios"
    texto: "Dos montajes: uno refresca el watchdog desde varios sitios, cualquiera vale; otro, con banderas. Cuelgue tareas hasta que el de banderas dispare y el otro no."
    libro: [168, 172]
    widget:
      tipo: logica
      entradas:
        - { id: A, valor: 1, rotulo: "Tarea A viva" }
        - { id: B, valor: 1, rotulo: "Tarea B viva" }
        - { id: C, valor: 1, rotulo: "Tarea C viva" }
      piezas:
        - { id: o1, tipo: or, entradas: [A, B, C], rotulo: "Desde varios sitios" }
        - { id: n1, tipo: not, entradas: [o1] }
        - { id: y1, tipo: and, entradas: [A, B, C], rotulo: "Con banderas" }
        - { id: n2, tipo: not, entradas: [y1] }
      salidas:
        - { id: W1, de: n1, rotulo: "Dispara: varios sitios" }
        - { id: W2, de: n2, rotulo: "Dispara: banderas" }
    objetivo:
      condiciones:
        - { led: W2, valor: 1, rotulo: "El de banderas dispara" }
        - { led: W1, valor: 0, rotulo: "El de varios sitios no" }
      logrado: "Desde varios sitios basta que uno funcione para que el watchdog quede satisfecho aunque el resto esté parado. Con banderas, solo se refresca si están todas."
      pistas:
        - { texto: "Cuelgue una tarea." }
    escalera:
      - "Uno pide una cualquiera; el otro, todas."
    solucion: "Una o dos tareas colgadas, no las tres."

  - id: tabla-banderas
    tipo: tabla
    titulo: "Cuándo dispara cada uno"
    texto: "Los mismos dos montajes, sin ver los LED. Rellene cuándo dispara cada watchdog según las tareas vivas."
    libro: [168, 172]
    widget:
      tipo: logica
      entradas:
        - { id: A, rotulo: "Tarea A viva" }
        - { id: B, rotulo: "Tarea B viva" }
        - { id: C, rotulo: "Tarea C viva" }
      piezas:
        - { id: o1, tipo: or, entradas: [A, B, C], rotulo: "Desde varios sitios" }
        - { id: n1, tipo: not, entradas: [o1] }
        - { id: y1, tipo: and, entradas: [A, B, C], rotulo: "Con banderas" }
        - { id: n2, tipo: not, entradas: [y1] }
      salidas:
        - { id: W1, de: n1, rotulo: "Dispara: varios sitios" }
        - { id: W2, de: n2, rotulo: "Dispara: banderas" }
      ocultar: true
    tabla:
      salidas: [W1, W2]
    exito: "El de varios sitios solo dispara con todo parado; el de banderas, en cuanto se cuelga una sola tarea. Esa es la protección real."
    escalera:
      - "Varios sitios: basta una tarea viva para refrescar. Banderas: hacen falta las tres."
    solucion: "El de varios sitios dispara solo con las tres paradas; el de banderas, en todas las filas salvo la de las tres vivas."

  - id: modo-degradado
    tipo: pregunta
    titulo: "Reinicios en bucle"
    texto: "El sistema se reinicia, vuelve a intentar la misma operación y vuelve a reiniciarse. ¿Qué conviene?"
    libro: [180, 185]
    widget:
      tipo: figura
      figura: fig-19.8
      zonas:
        - { id: todo, rotulo: "Los dos montajes", rect: [4, 3, 443, 190] }
    opciones:
      - texto: "Arrancar en modo degradado"
        bien: true
        porque: "Así no repite la operación que provocó el fallo y sale del bucle de reinicios."
      - texto: "Reintentar sin pausa"
        porque: "Es justo lo que mantiene el bucle; incluso en comunicaciones se reintenta con espera creciente."
      - texto: "Desactivar el watchdog"
        porque: "Quitaría la red de seguridad sin arreglar nada."
    escalera:
      - "¿Qué debe evitar el arranque tras varios reinicios iguales?"
    solucion: "Arrancar en modo degradado en lugar de reintentar lo mismo."

  - id: prediga-brownout
    tipo: explorar
    titulo: "A media tensión"
    texto: "La alimentación baja por debajo de lo que el microcontrolador necesita. Consiga que se pare limpiamente en lugar de seguir ejecutando."
    libro: [182, 183, 190]
    widget:
      tipo: logica
      entradas:
        - { id: V, valor: 1, rotulo: "Tensión suficiente" }
        - { id: BOD, valor: 0, rotulo: "Detector de alimentación baja" }
      piezas:
        - { id: nv, tipo: not, entradas: [V] }
        - { id: nb, tipo: not, entradas: [BOD] }
        - { id: r1, tipo: and, entradas: [nv, BOD], rotulo: "En reset" }
        - { id: e1, tipo: and, entradas: [nv, nb], rotulo: "Errático" }
      salidas:
        - { id: RST, de: r1, rotulo: "En reset" }
        - { id: ERR, de: e1, rotulo: "Ejecuta de forma errática" }
    objetivo:
      condiciones:
        - { led: RST, valor: 1, rotulo: "Parado en reset" }
        - { led: ERR, valor: 0, rotulo: "Nada errático" }
      logrado: "Con el detector, se queda en reset mientras la tensión esté baja. Sin él, ejecuta de forma errática y puede corromper su memoria no volátil. Activarlo es una línea de configuración."
      pistas:
        - { cuando: { led: ERR, valor: 1 }, texto: "Sin detector, a media tensión sigue ejecutando mal: actívelo." }
        - { texto: "Baje la tensión." }
    escalera:
      - "¿Qué mantiene el sistema en reset mientras la alimentación está baja?"
    solucion: "Detector activado y tensión baja."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [165, 172, 175, 176, 190, 191]
    ideas:
      - { titulo: "El watchdog.", texto: "Red de seguridad: no arregla el fallo, lo convierte en un reinicio." }
      - { titulo: "Bien usado.", texto: "Una bandera por tarea, refresco en el bucle principal, nunca en una interrupción." }
      - { titulo: "El registro.", texto: "La causa de cada reinicio clasifica el fallo: watchdog, bloqueo; alimentación, problema eléctrico; reset externo, ruido en el pin." }
      - { titulo: "Provocar los fallos.", texto: "Bloquear, bajar la tensión y cortar el enlace: sin esas pruebas, no está validado." }
