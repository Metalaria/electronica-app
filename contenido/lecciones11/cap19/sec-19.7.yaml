# Lección 1.2 de la sección 18.7 «Fiabilidad de un Sistema 24/7: Watchdog, Reinicio y Registro» (cap19; sec-19.N =
# impresas 18.N).
# - El watchdog refrescado desde una interrupción frente al esquema de banderas por tarea (figura 18.7, fig-19.8),
#   con zonas.
# - Sin modelo de circuito: la sección es de firmware.
# Paso práctico: «tocar» la causa de que el watchdog mal usado nunca dispare.
leccion: cap19/sec-19.7

libro:
  164: "reinicia el sistema si el programa no lo refresca a tiempo"
  165: "Un sistema que se reinicia cada diez minutos tiene un problema que el watchdog está ocultando"
  167: "la interrupción sigue ejecutándose aunque el programa principal esté bloqueado"
  168: "basta que uno funcione para que el watchdog quede satisfecho"
  169: "el sistema pasa minutos inútil antes de reiniciar"
  170: "reinicios espurios durante operaciones legítimamente lentas"
  172: "lo hace solo si todas las banderas están puestas, borrándolas después"
  175: "es lo que convierte un fallo misterioso en uno clasificado"
  176: "por watchdog (bloqueo del programa), por caída de alimentación (problema eléctrico) o por reset externo (ruido en el pin)"
  180: "conviene arrancar en modo degradado en lugar de reintentar la misma operación"
  182: "ejecuta instrucciones de forma errática, y puede corromper su propia memoria no volátil"
  183: "Activarlo es una línea de configuración"
  185: "Reintentos con espera creciente"
  190: "provocar deliberadamente los fallos"
  191: "no está validado, por bien que funcione en condiciones normales"
  192: "El watchdog refrescado desde una interrupción frente al esquema de banderas por tarea."

modelo: { valores: {}, calculos: {} }

tarjetas:
  - id: explore-watchdog
    tipo: explorar
    titulo: "Un temporizador vigilante"
    texto: "Un watchdog reinicia el sistema si el programa no lo refresca a tiempo. Toque los dos montajes de la figura."
    libro: [164, 192]
    widget:
      tipo: figura
      figura: fig-19.8
      zonas:
        - { id: mal, rotulo: "Recuadro rojo de la izquierda", rect: [4, 3, 216, 190], texto: "Mal: el refresco sale de una interrupción de temporizador, que sigue aunque el bucle principal esté bloqueado." }
        - { id: bien, rotulo: "Recuadro verde de la derecha", rect: [231, 3, 216, 190], texto: "Bien: cada tarea pone su bandera y solo se refresca si están todas." }
    requiere: { mover: [mal, bien] }

  - id: porque-red
    tipo: porque
    titulo: "Red de seguridad"
    texto: "Un sistema con watchdog se reinicia cada diez minutos, pero sigue funcionando. ¿Por qué es una trampa?"
    libro: [164, 165]
    widget:
      tipo: figura
      figura: fig-19.8
      zonas:
        - { id: todo, rotulo: "Los dos montajes", rect: [4, 3, 443, 190] }
    opciones:
      - texto: "El watchdog está ocultando un problema que sigue ahí"
        bien: true
        porque: "No arregla el fallo: lo convierte en un reinicio. El bloqueo sigue sin resolver."
      - texto: "Porque el watchdog está averiado"
        porque: "Hace exactamente su trabajo: reiniciar. Lo que falla es el programa."
      - texto: "No es ninguna trampa: así debe funcionar"
        porque: "Es una red de seguridad, no una solución: diez minutos entre reinicios delatan un fallo."
    escalera:
      - "¿El watchdog arregla el bloqueo o solo sale de él?"
    solucion: "Está ocultando un problema: no arregla el fallo, lo convierte en un reinicio."

  - id: toque-interrupcion
    tipo: tocar
    titulo: "Un watchdog que nunca dispara"
    texto: "En el montaje de la izquierda el bucle principal está bloqueado y el watchdog no reinicia. Toque la causa."
    libro: [167]
    widget:
      tipo: figura
      figura: fig-19.8
      zonas:
        - { id: bucle, rotulo: "Recuadro discontinuo de arriba", rect: [16, 55, 94, 33] }
        - { id: interrupcion, rotulo: "Recuadro verde de abajo", rect: [16, 120, 94, 33] }
        - { id: perro, rotulo: "Recuadro gris de la derecha", rect: [153, 120, 55, 33] }
    tocar:
      bien: [interrupcion]
      porque:
        bucle: "El bucle bloqueado es el fallo que habría que detectar, no la causa de que no se detecte."
        perro: "El watchdog funciona: le llegan refrescos y por eso no dispara."
    exito: "La interrupción sigue ejecutándose aunque el bucle esté bloqueado: refresca y el watchdog deja de proteger."
    escalera:
      - "¿De dónde le llegan los refrescos al watchdog?"
    solucion: "La interrupción del temporizador."

  - id: empareje-mal
    tipo: pregunta
    titulo: "Cuatro malos usos"
    texto: "Empareje cada mal uso del watchdog con su consecuencia."
    libro: [167, 168, 169, 170]
    widget:
      tipo: figura
      figura: fig-19.8
      zonas:
        - { id: mal, rotulo: "Recuadro rojo de la izquierda", rect: [4, 3, 216, 190] }
    emparejar:
      - ["Refrescarlo desde una interrupción", "Nunca dispara aunque el programa se bloquee"]
      - ["Refrescarlo desde varios sitios", "Basta que uno funcione"]
      - ["Plazo demasiado largo", "Minutos inútil antes de reiniciar"]
      - ["Plazo demasiado corto", "Reinicios espurios al escribir en Flash"]
    exito: "El refresco va en el bucle principal, en el camino que solo se recorre si todo funciona."
    pistas:
      - { texto: "Escribir en Flash es una operación legítimamente lenta." }
    escalera:
      - "Empiece por los plazos: uno tarda en reiniciar y otro reinicia de más."
    solucion: "Interrupción, nunca dispara; varios sitios, basta uno; largo, minutos inútil; corto, reinicios espurios."

  - id: prediga-banderas
    tipo: predecir
    titulo: "Una tarea colgada"
    texto: "Con el esquema de banderas, las tareas A y B siguen bien y la C se cuelga. ¿Qué hace el watchdog?"
    libro: [172]
    widget:
      tipo: figura
      figura: fig-19.8
      zonas:
        - { id: bien, rotulo: "Recuadro verde de la derecha", rect: [231, 3, 216, 190] }
    opciones:
      - texto: "Dispara: falta una bandera y no se refresca"
        bien: true
        porque: "Solo se refresca si todas las banderas están puestas: una tarea colgada basta."
      - texto: "Nada: dos de tres funcionan"
        porque: "Eso pasaría refrescando desde varios sitios; con banderas hacen falta todas."
      - texto: "Reinicia solo la tarea C"
        porque: "El watchdog reinicia el sistema entero, no una tarea."
    escalera:
      - "¿Con cuántas banderas puestas se refresca?"
    solucion: "Dispara: la bandera de C no llega y el watchdog reinicia."

  - id: empareje-causas
    tipo: pregunta
    titulo: "Por qué se reinició"
    texto: "Un contador de reinicios por causa clasifica el fallo en una semana. Empareje cada causa con su diagnóstico."
    libro: [175, 176]
    widget:
      tipo: figura
      figura: fig-19.8
      zonas:
        - { id: todo, rotulo: "Los dos montajes", rect: [4, 3, 443, 190] }
    emparejar:
      - ["Watchdog", "Bloqueo del programa"]
      - ["Caída de alimentación", "Problema eléctrico"]
      - ["Reset externo", "Ruido en el pin"]
    exito: "Leer el registro de causa al arrancar convierte un fallo misterioso en uno clasificado."
    pistas:
      - { texto: "El watchdog dispara cuando el programa deja de refrescarlo." }
    escalera:
      - "¿Qué hace que el watchdog dispare?"
    solucion: "Watchdog, bloqueo; alimentación, problema eléctrico; reset externo, ruido en el pin."

  - id: modo-degradado
    tipo: pregunta
    titulo: "Reinicios en bucle"
    texto: "El sistema se reinicia, vuelve a intentar la misma operación y vuelve a reiniciarse. ¿Qué conviene?"
    libro: [180, 185]
    widget:
      tipo: figura
      figura: fig-19.8
      zonas:
        - { id: todo, rotulo: "Los dos montajes", rect: [4, 3, 443, 190] }
    opciones:
      - texto: "Arrancar en modo degradado"
        bien: true
        porque: "Así no repite la operación que provocó el fallo y sale del bucle de reinicios."
      - texto: "Reintentar sin pausa"
        porque: "Es justo lo que mantiene el bucle; incluso en comunicaciones se reintenta con espera creciente."
      - texto: "Desactivar el watchdog"
        porque: "Quitaría la red de seguridad sin arreglar nada."
    escalera:
      - "¿Qué debe evitar el arranque tras varios reinicios iguales?"
    solucion: "Arrancar en modo degradado en lugar de reintentar lo mismo."

  - id: prediga-brownout
    tipo: predecir
    titulo: "A media tensión"
    texto: "Un microcontrolador sin detector de alimentación baja recibe media tensión durante un rato. ¿Qué hace?"
    libro: [182, 183]
    widget:
      tipo: figura
      figura: fig-19.8
      zonas:
        - { id: todo, rotulo: "Los dos montajes", rect: [4, 3, 443, 190] }
    opciones:
      - texto: "Ejecuta instrucciones de forma errática y puede corromper su memoria"
        bien: true
        porque: "No se para: funciona mal, y si escribe en la memoria no volátil puede estropearla."
      - texto: "Se para limpiamente"
        porque: "Eso hace con el detector de alimentación baja, que lo mantiene en reset."
      - texto: "Funciona igual, solo más despacio"
        porque: "Por debajo de su tensión mínima no funciona bien: ejecuta de forma errática."
    escalera:
      - "¿Qué hace el detector de alimentación baja cuando está activado?"
    solucion: "Ejecuta instrucciones de forma errática y puede corromper su memoria no volátil."

  - id: empareje-pruebas
    tipo: pregunta
    titulo: "Provocar los fallos"
    texto: "Un sistema 24/7 se valida provocando fallos a propósito. Empareje cada prueba con lo que debe pasar."
    libro: [190, 191]
    widget:
      tipo: figura
      figura: fig-19.8
      zonas:
        - { id: todo, rotulo: "Los dos montajes", rect: [4, 3, 443, 190] }
    emparejar:
      - ["Bloquear el programa con un bucle infinito", "El watchdog dispara"]
      - ["Bajar la alimentación lentamente", "Se para limpiamente y no escribe basura"]
      - ["Desconectar el enlace", "Reintenta y se recupera al reconectar"]
    exito: "Sin esas tres pruebas no está validado, por bien que funcione en condiciones normales."
    pistas:
      - { texto: "La alimentación que baja despacio pone a prueba el detector de alimentación baja." }
    escalera:
      - "Cada prueba comprueba uno de los mecanismos de la sección."
    solucion: "Bucle, watchdog; alimentación, parada limpia; enlace, reintento y recuperación."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [165, 172, 176, 182]
    ideas:
      - { titulo: "El watchdog.", texto: "Red de seguridad: no arregla el fallo, lo convierte en un reinicio." }
      - { titulo: "Bien usado.", texto: "Una bandera por tarea, refresco en el bucle principal, nunca en una interrupción." }
      - { titulo: "El registro.", texto: "La causa de cada reinicio clasifica el fallo." }
      - { titulo: "La tensión baja.", texto: "El detector la mantiene en reset: una línea de configuración." }
