# Lección 1.2 de la sección 18.6 «Comunicación Robusta entre Placas» (cap19; sec-19.N = impresas 18.N).
# - La trama robusta y sus cuatro mecanismos de la figura 18.6 (fig-19.7), con zonas en cada campo y cada mecanismo.
# - Sin modelo de circuito: la sección es de protocolo (el nivel físico se empareja).
# Paso práctico: «tocar» el campo de la trama que evita procesar dos veces una retransmisión.
# 1.2.1 (autor121-sens, «aprender haciendo», GUIA §13): en la figura 18.7 se tocan el mecanismo que recupera un byte
# perdido (con la predicción del byte perdido en el «exito»), el campo que protege a los demás, la secuencia y el plazo;
# se escriben en hexadecimal la suma de comprobación de dos bytes de ejemplo (0x12 y 0x34, del autor) y lo que avanza
# el robot. «Detectar no es corregir» se toca (el mecanismo que consigue la trama buena). Quedan una
# pregunta de opciones (errores sistemáticos) y el nivel físico, por emparejar.
leccion: cap19/sec-19.6

libro:
  142: "Cada trama recibida correctamente se confirma"
  124: "funciona en el banco y falla en el equipo real"
  125: "un bit alterado cambia el significado del mensaje"
  126: "todo lo que sigue es basura"
  128: "el receptor puede quedarse esperando indefinidamente"
  129: "Un protocolo resuelve las cuatro con cuatro mecanismos"
  131: "Cada uno de esos mensajes es una trama (frame)"
  133: "Es la más común y la más eficiente."
  136: "buscando el siguiente delimitador, sin quedarse desfasado para siempre"
  138: "no detecta dos errores que se compensen ni un reordenamiento"
  139: "todas las ráfagas de hasta 16 bits"
  140: "detectar no es corregir"
  144: "en un comando de «avanzar 10 cm», eso son 20 cm"
  145: "Reintentar indefinidamente es una forma de bloqueo."
  147: "el sistema parece muerto sin que nada haya fallado visiblemente"
  148: "descartar la trama parcial, resincronizar y seguir"
  151: "solo para distancias cortas dentro de la misma caja y con masa común"
  152: "niveles de ±12 V, mejor inmunidad, hasta unos 15 m"
  153: "Alcanza cientos de metros"
  154: "rompe el bucle de tierra"
  157: "[inicio][longitud][tipo][secuencia][datos…][CRC-16]"
  158: "hasta tres reintentos"
  160: "Un error de velocidad del 3 % ya produce fallos"
  161: "Estructura de una trama robusta y los cuatro mecanismos que la protegen."

modelo:
  valores:
    b_1: { sim: "b_{1}", nombre: "primer byte de ejemplo", unidad: "", valor: 18 }
    b_2: { sim: "b_{2}", nombre: "segundo byte de ejemplo", unidad: "", valor: 52 }
    d_av: { sim: "d", nombre: "avance de la orden", unidad: m, valor: 0.1 }
  calculos:
    s_ck: { expr: "b_1 + b_2 - 256*floor((b_1 + b_2)/256)", sim: "suma", nombre: "suma de comprobación", unidad: "" }
    d_2: { expr: "2*d_av", sim: "d_{total}", nombre: "avance con la orden repetida", unidad: m }

tarjetas:
  - id: explore-mecanismos
    tipo: explorar
    titulo: "Bytes sueltos no bastan"
    texto: "Enviar bytes por una UART funciona en el banco y falla en el equipo real. Toque los cuatro mecanismos que lo arreglan."
    libro: [124, 125, 128, 129, 161]
    widget:
      tipo: figura
      figura: fig-19.7
      zonas:
        - { id: delimitar, rotulo: "Recuadro rojo de la izquierda", rect: [6, 67, 216, 42], texto: "Delimitar: el receptor sabe dónde empieza y acaba cada trama, y se recupera si se pierde." }
        - { id: detectar, rotulo: "Recuadro verde de la derecha", rect: [228, 67, 216, 42], texto: "Detectar: un CRC dice que la trama llegó mal." }
        - { id: confirmar, rotulo: "Recuadro morado de la izquierda", rect: [6, 115, 216, 42], texto: "Confirmar y reintentar: cada trama buena se confirma; sin confirmación, se retransmite." }
        - { id: plazos, rotulo: "Recuadro naranja de la derecha", rect: [228, 115, 216, 42], texto: "Plazos: todo lo que espera algo tiene un límite y una acción de recuperación." }
    requiere: { mover: [delimitar, detectar, confirmar, plazos] }

  - id: empareje-razones
    tipo: tocar
    titulo: "Un byte perdido"
    texto: "Se pierde un solo byte y el receptor interpreta los siguientes desplazados. Toque el mecanismo que le permite recuperarse."
    libro: [126, 131, 136]
    widget:
      tipo: figura
      figura: fig-19.7
      zonas:
        - { id: delimitar, rotulo: "Recuadro rojo de la izquierda", rect: [6, 67, 216, 42] }
        - { id: detectar, rotulo: "Recuadro verde de la derecha", rect: [228, 67, 216, 42] }
        - { id: confirmar, rotulo: "Recuadro morado de la izquierda", rect: [6, 115, 216, 42] }
        - { id: plazos, rotulo: "Recuadro naranja de la derecha", rect: [228, 115, 216, 42] }
    tocar:
      bien: [delimitar]
      porque:
        detectar: "El CRC diría que las tramas llegan mal, pero el receptor seguiría desfasado."
        confirmar: "Reintentar no sirve si el receptor no sabe dónde empieza cada trama."
        plazos: "El plazo saca de una espera; no le dice dónde empieza la trama siguiente."
    exito: "Delimitar: sin delimitador, todo lo que sigue es basura; con él, el receptor busca el siguiente inicio y no se queda desfasado para siempre."
    escalera:
      - "¿Cómo sabe el receptor dónde empieza cada mensaje?"
    solucion: "Delimitar las tramas."

  - id: ordene-trama
    tipo: tocar
    titulo: "El diseño mínimo"
    texto: "La trama mínima razonable entre dos placas. Toque el campo que comprueba todos los demás."
    libro: [133, 139, 157, 158]
    widget:
      tipo: figura
      figura: fig-19.7
      zonas:
        - { id: inicio, rotulo: "Primer campo", rect: [31, 18, 47, 36] }
        - { id: longitud, rotulo: "Segundo campo", rect: [78, 18, 54, 36] }
        - { id: tipo, rotulo: "Tercer campo", rect: [132, 18, 43, 36] }
        - { id: secuencia, rotulo: "Cuarto campo", rect: [175, 18, 58, 36] }
        - { id: datos, rotulo: "Quinto campo", rect: [233, 18, 122, 36] }
        - { id: crc, rotulo: "Último campo", rect: [355, 18, 65, 36] }
    tocar:
      bien: [crc]
      porque:
        inicio: "El inicio marca el comienzo y sirve para resincronizar."
        longitud: "La longitud dice cuántos bytes leer."
        tipo: "El tipo separa sondeos, eventos y órdenes."
        secuencia: "La secuencia distingue un reenvío de un mensaje nuevo."
        datos: "Son lo que se protege, no lo que protege."
    exito: "El CRC-16, al final, protege lo que va antes. Con plazo, confirmación, hasta tres reintentos y resincronización por el byte de inicio."
    escalera:
      - "Lo que protege va al final."
    solucion: "El último, el CRC-16."

  - id: checksum
    tipo: leer
    titulo: "Suma o CRC"
    texto: "Una trama lleva los bytes 0x12 y 0x34. Escriba en hexadecimal su suma de comprobación, truncada a un byte."
    libro: [138, 139]
    widget:
      tipo: figura
      figura: fig-19.7
      zonas:
        - { id: inicio, rotulo: "Primer campo", rect: [31, 18, 47, 36] }
        - { id: longitud, rotulo: "Segundo campo", rect: [78, 18, 54, 36] }
        - { id: tipo, rotulo: "Tercer campo", rect: [132, 18, 43, 36] }
        - { id: secuencia, rotulo: "Cuarto campo", rect: [175, 18, 58, 36] }
        - { id: datos, rotulo: "Quinto campo", rect: [233, 18, 122, 36] }
        - { id: crc, rotulo: "Último campo", rect: [355, 18, 65, 36] }
    leer:
      objetivo: s_ck
      base: 16
      cifras: 8
      rotulo: "Suma de comprobación"
    exito: "0x46. Con los bytes al revés, 0x34 y 0x12, la suma es la misma: no detecta un reordenamiento ni dos errores que se compensen. Un CRC de 16 bits sí."
    escalera:
      - "Sume los dos bytes: 0x12 + 0x34."
    solucion: "0x12 + 0x34 = 0x46."
    comprobar:
      - { s_ck: 70 }

  - id: porque-detectar
    tipo: tocar
    titulo: "Detectar no es corregir"
    texto: "Un CRC dice que la trama está mal, pero no la arregla. Toque el mecanismo con el que el receptor acaba teniendo la trama buena."
    libro: [140, 142]
    widget:
      tipo: figura
      figura: fig-19.7
      zonas:
        - { id: delimitar, rotulo: "Recuadro rojo de la izquierda", rect: [6, 67, 216, 42] }
        - { id: detectar, rotulo: "Recuadro verde de la derecha", rect: [228, 67, 216, 42] }
        - { id: confirmar, rotulo: "Recuadro morado de la izquierda", rect: [6, 115, 216, 42] }
        - { id: plazos, rotulo: "Recuadro naranja de la derecha", rect: [228, 115, 216, 42] }
    tocar:
      bien: [confirmar]
      porque:
        delimitar: "Delimitar dice dónde empieza la trama, no la repara."
        detectar: "Ese es el CRC: dice que está mal, pero no la arregla."
        plazos: "El plazo saca de una espera; no trae la trama buena."
    exito: "Confirmar y reintentar: sin confirmación, el emisor la retransmite. Detectar y pedirla otra vez es casi siempre más eficiente que corregir, que exige redundancia adicional."
    escalera:
      - "Si no puede repararla, ¿cómo la consigue?"
    solucion: "Confirmar y reintentar."

  - id: prediga-avanzar
    tipo: leer
    titulo: "Avanzar 10 cm"
    texto: "Sin número de secuencia, la orden «avanzar 10 cm» llega, pero se pierde su confirmación y el emisor la reenvía. Escriba cuánto avanza el robot."
    libro: [142, 144]
    widget:
      tipo: figura
      figura: fig-19.7
      zonas:
        - { id: inicio, rotulo: "Primer campo", rect: [31, 18, 47, 36] }
        - { id: longitud, rotulo: "Segundo campo", rect: [78, 18, 54, 36] }
        - { id: tipo, rotulo: "Tercer campo", rect: [132, 18, 43, 36] }
        - { id: secuencia, rotulo: "Cuarto campo", rect: [175, 18, 58, 36] }
        - { id: datos, rotulo: "Quinto campo", rect: [233, 18, 122, 36] }
        - { id: crc, rotulo: "Último campo", rect: [355, 18, 65, 36] }
    leer:
      objetivo: d_2
      unidad: m
      tol: 0.02
      rotulo: "Avance del robot"
      errores:
        - { expr: "d_av", texto: "Eso haría con número de secuencia: reconocería el reenvío y no lo repetiría." }
    exito: "20 cm: el receptor no distingue la retransmisión de una orden nueva y la ejecuta dos veces."
    escalera:
      - "La orden llegó bien las dos veces."
    solucion: "Dos veces 10 cm: 20 cm."
    comprobar:
      - { d_2: 0.2 }

  - id: toque-secuencia
    tipo: tocar
    titulo: "El campo que lo evita"
    texto: "Toque el campo de la trama que permite distinguir una retransmisión de un mensaje nuevo."
    libro: [144, 157]
    widget:
      tipo: figura
      figura: fig-19.7
      zonas:
        - { id: inicio, rotulo: "Primer campo", rect: [31, 18, 47, 36] }
        - { id: longitud, rotulo: "Segundo campo", rect: [78, 18, 54, 36] }
        - { id: tipo, rotulo: "Tercer campo", rect: [132, 18, 43, 36] }
        - { id: secuencia, rotulo: "Cuarto campo", rect: [175, 18, 58, 36] }
        - { id: datos, rotulo: "Quinto campo", rect: [233, 18, 122, 36] }
        - { id: crc, rotulo: "Último campo", rect: [355, 18, 65, 36] }
    tocar:
      bien: [secuencia]
      porque:
        inicio: "El inicio sirve para resincronizar, no para reconocer un reenvío."
        longitud: "La longitud dice cuánto leer."
        tipo: "El tipo separa sondeos, eventos y órdenes."
        datos: "Los datos de un reenvío son iguales a los del original: no lo distinguen."
        crc: "El CRC dice si la trama llegó bien, no si ya se había recibido."
    exito: "El número de secuencia: un reenvío lleva el mismo número y no se procesa dos veces."
    escalera:
      - "El campo morado de la trama."
    solucion: "El cuarto campo, la secuencia."

  - id: plazos
    tipo: tocar
    titulo: "Una trama a medias"
    texto: "Un receptor espera el resto de una trama que nunca llegará, y el sistema parece muerto. Toque el mecanismo que le falta."
    libro: [145, 147, 148]
    widget:
      tipo: figura
      figura: fig-19.7
      zonas:
        - { id: delimitar, rotulo: "Recuadro rojo de la izquierda", rect: [6, 67, 216, 42] }
        - { id: detectar, rotulo: "Recuadro verde de la derecha", rect: [228, 67, 216, 42] }
        - { id: confirmar, rotulo: "Recuadro morado de la izquierda", rect: [6, 115, 216, 42] }
        - { id: plazos, rotulo: "Recuadro naranja de la derecha", rect: [228, 115, 216, 42] }
    tocar:
      bien: [plazos]
      porque:
        delimitar: "Ya sabe dónde empezó la trama; lo que no sabe es cuánto esperar."
        detectar: "El CRC comprueba lo que llega; aquí no llega nada."
        confirmar: "Reintentar indefinidamente es otra forma de bloqueo."
    exito: "Un plazo, con su acción de recuperación: descartar la trama parcial, resincronizar y seguir. Es la regla que más bloqueos evita y la que más se olvida."
    escalera:
      - "¿Qué pone límite a una espera?"
    solucion: "Los plazos."

  - id: empareje-fisico
    tipo: pregunta
    titulo: "El nivel físico"
    texto: "Con los datos protegidos, queda el medio. Empareje cada uno con su uso."
    libro: [151, 152, 153, 154]
    widget:
      tipo: figura
      figura: fig-19.7
      zonas:
        - { id: todo, rotulo: "La trama y sus mecanismos", rect: [4, 3, 443, 156] }
    emparejar:
      - ["UART directa (TTL)", "Dentro de la misma caja, con masa común"]
      - ["RS-232", "Niveles de ±12 V, hasta unos 15 m"]
      - ["RS-485", "Par diferencial, cientos de metros"]
      - ["Aislamiento galvánico", "Masas a potenciales distintos"]
    exito: "El par diferencial cancela el ruido de modo común: es el estándar industrial."
    pistas:
      - { texto: "El que mide la diferencia entre dos hilos es el que llega más lejos." }
    escalera:
      - "Empiece por el más corto: la UART sin más."
    solucion: "TTL en la caja, RS-232 hasta 15 m, RS-485 cientos de metros, aislamiento con masas distintas."

  - id: sistematico
    tipo: pregunta
    titulo: "Errores sistemáticos"
    texto: "En el osciloscopio, los bytes se reciben mal siempre igual, no al azar. ¿Qué sospecha primero?"
    libro: [160]
    widget:
      tipo: figura
      figura: fig-19.7
      zonas:
        - { id: todo, rotulo: "La trama y sus mecanismos", rect: [4, 3, 443, 156] }
    opciones:
      - texto: "Un problema de reloj: la velocidad no coincide"
        bien: true
        porque: "Un error de velocidad del 3 % ya produce fallos, y son sistemáticos."
      - texto: "Ruido en el cable"
        porque: "El ruido produce errores aleatorios, no sistemáticos."
      - texto: "Un CRC mal calculado"
        porque: "El CRC dice que hay error; no explica que los bytes salgan mal siempre igual."
    escalera:
      - "¿Qué distingue un problema de reloj de uno de ruido?"
    solucion: "Un problema de reloj: errores sistemáticos frente a aleatorios."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [129, 140, 144, 147]
    ideas:
      - { titulo: "Cuatro mecanismos.", texto: "Delimitar, detectar con CRC, confirmar y reintentar, y plazos." }
      - { titulo: "La secuencia.", texto: "Distingue un reenvío de un mensaje nuevo: 10 cm no se vuelven 20." }
      - { titulo: "Los plazos.", texto: "Toda espera tiene un límite y una acción de recuperación." }
      - { titulo: "El medio.", texto: "TTL en la caja, RS-485 lejos, aislamiento si las masas difieren." }
