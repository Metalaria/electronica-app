# Lección 1.2 de la sección 18.3 «Proyecto Integrador: Estación de Monitorización Ambiental» (cap19; sec-19.N =
# impresas 18.N).
# - La figura del ciclo de trabajo de la estación a pilas (fig-19.4, que el libro imprime en el capítulo 50, bloque
#   cap49#43) con zonas: dormido, medir y guardar, enviar el lote, la media y las tres validaciones.
# - La cadena MQTT de la figura 50.18 (fig-49.18, cap49#383) para el reparto llevado a la red.
# - Sin modelo de circuito: la sección es de arquitectura.
# Paso práctico: «tocar» en la figura del ciclo lo que ahorra en la radio (el envío por lotes).
# 1.2.1 (autor121-sens, «aprender haciendo», GUIA §13): se escribe cuántas veces baja el consumo al dormir con el
# ciclo de la sección 17.9 (20 mA despierta, 38 µA de media); el envío por lotes se toca en la figura 18.4 (el explorar
# ya no lo cuenta); en el flujo de la figura 48.18 se toca lo que está mal resuelto si faltan medidas; la validación que
# descubre los fallos reales se toca en la fila de fases (cajas de 19.4.py). ¿Una Pi en el nodo? se escribe con los
# 600 mA de una Pi 4 en reposo (bloque 135 del capítulo 17). La supervivencia queda por emparejar.
leccion: cap19/sec-19.3

libro:
  52: "¿hacen falta las dos placas?"
  54: "el consumo medio baja dos o tres órdenes de magnitud respecto a estar despierto"
  55: "su arranque de medio minuto (sección 18.2) no encaja en un ciclo que dura unos segundos"
  57: "un ordenador de placa siempre alimentado hace de servidor"
  58: "cada una necesita almacenamiento local, que cubre los cortes de red y del servidor"
  60: "reiniciar el servidor con las estaciones en marcha"
  61: "y de campo, dejándolo instalado semanas"
  "cap49#43": "el ciclo de trabajo del microcontrolador (dormir, medir y guardar, enviar por lotes)"
  "cap49#383": "Flujo de datos a la nube por MQTT, del ESP32 al panel."
  "cap18#244": "Con 20 mA activo durante 100 ms cada minuto y 5 µA durmiendo"
  "cap18#245": "38 µA"
  "cap18#135": "unos 600 mA una Raspberry Pi 4 sin hacer nada"

modelo:
  valores:
    I_ac: { sim: "I_{activa}", nombre: "corriente despierta", unidad: A, valor: 0.02 }
    I_me: { sim: "I_{media}", nombre: "consumo medio durmiendo entre medidas", unidad: A, valor: 0.0000383 }
    I_pi4: { sim: "I_{Pi}", nombre: "Pi 4 en reposo", unidad: A, valor: 0.6 }
  calculos:
    k_dor: { expr: "I_ac/I_me", sim: "k", nombre: "veces que baja el consumo", unidad: "" }
    k_pi: { expr: "I_pi4/I_me", sim: "k", nombre: "veces que gasta más la Pi", unidad: "" }

tarjetas:
  - id: explore-ciclo
    tipo: explorar
    titulo: "Despertar, medir, dormir"
    texto: "La estación a pilas despierta, lee los sensores, guarda y vuelve a dormir. Toque cada parte de su ciclo."
    libro: [52, 54, "cap49#43"]
    widget:
      tipo: figura
      figura: fig-19.4
      zonas:
        - { id: dormido, rotulo: "Línea de abajo de la gráfica", rect: [48, 140, 215, 38], texto: "Dormido casi todo el tiempo: así el consumo medio baja dos o tres órdenes de magnitud." }
        - { id: medir, rotulo: "Picos cortos de la gráfica", rect: [50, 60, 125, 86], texto: "Medir y guardar: despierta, lee los sensores y vuelve a dormir." }
        - { id: decisiones, rotulo: "Columna de recuadros naranjas", rect: [281, 26, 160, 160], texto: "La cadena de decisiones que arranca en la frecuencia de medida." }
    requiere: { mover: [dormido, medir] }

  - id: prediga-dormir
    tipo: leer
    titulo: "Lo que ahorra dormir"
    texto: "Con el ciclo de los criterios cuantitativos, despierta gasta 20 mA y, durmiendo entre medidas, 38 µA de media. Escriba cuántas veces baja el consumo."
    libro: [54, "cap18#244", "cap18#245"]
    widget:
      tipo: figura
      figura: fig-19.4
      zonas:
        - { id: grafica, rotulo: "Gráfica del ciclo de trabajo", rect: [48, 15, 215, 150], texto: "Despierta unos instantes; dormida, el resto." }
    leer:
      objetivo: k_dor
      unidad: ""
      tol: 0.03
      rotulo: "Veces"
    exito: "Más de quinientas veces: entre dos y tres órdenes de magnitud, lo que el libro da para dormir entre medidas."
    escalera:
      - "Divida 20 mA entre 38 µA."
    solucion: "20 mA / 38 µA ≈ 522."
    comprobar:
      - { k_dor: 522 }

  - id: toque-lote
    tipo: tocar
    titulo: "Lo que domina el consumo"
    texto: "Transmitir cuesta mucho más que medir. Toque lo que hace la estación para gastar menos en la radio."
    libro: [54, "cap49#43"]
    widget:
      tipo: figura
      figura: fig-19.4
      zonas:
        - { id: dormido, rotulo: "Línea de abajo de la gráfica", rect: [48, 140, 215, 38] }
        - { id: medir, rotulo: "Picos cortos de la gráfica", rect: [50, 60, 125, 86] }
        - { id: lote, rotulo: "Pico más alto, a la derecha", rect: [178, 38, 84, 108] }
    tocar:
      bien: [lote]
      porque:
        dormido: "Dormir ahorra en todo el ciclo, pero la radio se ahorra de otra manera."
        medir: "Medir cuesta poco; lo caro es transmitir."
    exito: "Envía por lotes: acumula varias medidas y las transmite juntas."
    escalera:
      - "Busque el pico que no se repite en cada medida."
    solucion: "El pico más alto, a la derecha: el envío del lote."

  - id: sin-pi
    tipo: leer
    titulo: "¿Una Pi en el nodo?"
    texto: "Una Raspberry Pi 4 sin hacer nada gasta unos 600 mA; el nodo, 38 µA de media. Escriba cuántas veces más gastaría la Pi."
    libro: [55, "cap18#135"]
    widget:
      tipo: figura
      figura: fig-19.4
      zonas:
        - { id: grafica, rotulo: "Gráfica del ciclo de trabajo", rect: [48, 15, 215, 150], texto: "El ciclo del nodo: casi todo el tiempo dormido." }
    leer:
      objetivo: k_pi
      unidad: ""
      tol: 0.03
      rotulo: "Veces"
    exito: "Más de quince mil veces: encendida siempre, consume más que todo el presupuesto de la estación, y su arranque de medio minuto no cabe en un ciclo de unos segundos."
    escalera:
      - "Divida 600 mA entre 38 µA."
    solucion: "600 mA / 38 µA: más de quince mil."
    comprobar:
      - { k_pi: 15666 }

  - id: toque-servidor
    tipo: tocar
    titulo: "Donde reaparece el ordenador"
    texto: "Con varias estaciones, los nodos miden y publican por MQTT. Toque dónde vuelve el ordenador de placa, siempre alimentado."
    libro: [57, "cap49#383"]
    widget:
      tipo: figura
      figura: fig-49.18
      zonas:
        - { id: esp32, rotulo: "Primer recuadro, a la izquierda", rect: [4, 57, 80, 47] }
        - { id: broker, rotulo: "Segundo recuadro", rect: [125, 57, 80, 47] }
        - { id: base, rotulo: "Tercer recuadro", rect: [246, 57, 80, 47] }
        - { id: panel, rotulo: "Último recuadro, a la derecha", rect: [367, 57, 80, 47] }
    tocar:
      bien: [broker, base, panel]
      todas: true
      porque:
        esp32: "Ese es el nodo de microcontrolador: mide y publica, nada más."
    exito: "El servidor recibe los mensajes por MQTT, los almacena y sirve el panel."
    escalera:
      - "Todo lo que está después del nodo lo hace el servidor."
    solucion: "Broker, base de datos y panel: el ordenador de placa hace de servidor."

  - id: empareje-supervivencia
    tipo: pregunta
    titulo: "Si el servidor se cae"
    texto: "Las estaciones deben seguir midiendo aunque el servidor se cuelgue. Empareje cada medida con lo que resuelve."
    libro: [58]
    widget:
      tipo: figura
      figura: fig-49.18
      zonas:
        - { id: esp32, rotulo: "Primer recuadro, a la izquierda", rect: [4, 57, 80, 47] }
    emparejar:
      - ["Almacenamiento local", "Cubre los cortes de red y del servidor"]
      - ["Marcas de tiempo propias", "Los datos enviados con retraso quedan en su sitio"]
      - ["Watchdog y causa de reinicio", "Funcionar sin nadie delante"]
    exito: "Así se conserva la propiedad del reparto: si el servidor se reinicia, las estaciones siguen midiendo."
    pistas:
      - { texto: "Lo que llega tarde necesita saber cuándo se midió." }
    escalera:
      - "Empiece por lo que guarda las medidas mientras no hay servidor."
    solucion: "Almacenamiento para los cortes, marcas para el retraso, watchdog para funcionar sin nadie."

  - id: prueba-servidor
    tipo: tocar
    titulo: "La prueba, en red"
    texto: "Tras reiniciar el servidor con las estaciones en marcha, faltan medidas del intervalo. Toque dónde está lo mal resuelto."
    libro: [58, 60, "cap49#383"]
    widget:
      tipo: figura
      figura: fig-49.18
      zonas:
        - { id: esp32, rotulo: "Primer recuadro, a la izquierda", rect: [4, 57, 80, 47] }
        - { id: broker, rotulo: "Segundo recuadro", rect: [125, 57, 80, 47] }
        - { id: base, rotulo: "Tercer recuadro", rect: [246, 57, 80, 47] }
        - { id: panel, rotulo: "Último recuadro, a la derecha", rect: [367, 57, 80, 47] }
    tocar:
      bien: [esp32]
      porque:
        broker: "El broker se reinició con el servidor: es normal que no recibiera nada."
        base: "La base guarda lo que le llega; las medidas se perdieron antes de llegar."
        panel: "El panel solo representa lo que hay."
    exito: "En la estación: su almacenamiento local debía guardar las medidas durante el corte y reenviarlas, con sus marcas de tiempo."
    escalera:
      - "¿Quién debía guardar las medidas mientras el servidor no estaba?"
    solucion: "La estación, el primer recuadro."

  - id: ordene-validacion
    tipo: tocar
    titulo: "Las tres validaciones"
    texto: "Antes de dar el sistema por bueno hay tres validaciones. Toque la única que descubre los fallos reales."
    libro: [61, "cap49#43"]
    widget:
      tipo: figura
      figura: fig-19.4
      zonas:
        - { id: mesa, rotulo: "Primera caja de abajo", rect: [71, 208, 116, 36] }
        - { id: consumo, rotulo: "Segunda caja de abajo", rect: [199, 208, 116, 36] }
        - { id: campo, rotulo: "Tercera caja de abajo", rect: [327, 208, 116, 36] }
    tocar:
      bien: [campo]
      porque:
        mesa: "En la mesa se ve que funciona, pero no lo que pasa con el frío, la humedad o los cortes."
        consumo: "El perfil de un ciclo dice cuánto gasta, no cómo falla en su sitio."
    exito: "La de campo, instalado durante semanas: funcional en la mesa, de consumo midiendo un ciclo, y de campo al final."
    escalera:
      - "¿Cuál pone el sistema en su sitio real?"
    solucion: "La de campo."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [54, 55, 57, 61]
    ideas:
      - { titulo: "El nodo.", texto: "Un microcontrolador con radio: despierta, mide, guarda y duerme." }
      - { titulo: "La radio.", texto: "Transmitir cuesta más que medir: se envía por lotes." }
      - { titulo: "La red.", texto: "Con varias estaciones, un ordenador de placa hace de servidor por MQTT." }
      - { titulo: "Sin servidor.", texto: "Almacenamiento local y marcas de tiempo propias; validación de campo." }
