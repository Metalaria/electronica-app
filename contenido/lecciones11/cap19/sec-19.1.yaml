# Lección 1.2 de la sección 18.1 «Lo Mejor de Ambos Mundos» (cap19; etiquetas sec-19.N = impresas 18.N).
# - El reparto de la figura 18.1 (fig-19.1) con zonas: microcontrolador, enlace y ordenador de placa.
# - Sin modelo de circuito: la sección es de arquitectura.
# Paso práctico: «tocar» en la figura 18.1 el lado que vigila la seguridad; ordenar la prueba del banco (bloque 23).
leccion: cap19/sec-19.1

libro:
  4: "Un microcontrolador es determinista, arranca al instante y consume microamperios"
  5: "La arquitectura combinada no es un apaño"
  7: "Al microcontrolador lo que exige puntualidad y fiabilidad"
  8: "Vigilar la seguridad: cortar si algo se sale de márgenes"
  9: "Al ordenador lo que exige potencia y servicios"
  10: "Almacenamiento y bases de datos"
  12: "si el ordenador se cuelga, se actualiza o se reinicia, el microcontrolador sigue controlando el proceso"
  13: "la parte compleja y frágil no puede tumbar la parte simple y fiable"
  15: "Cuanto más clara sea, más fácil será depurar y sustituir cualquiera de los dos"
  17: "Debe tener un modo autónomo razonable, no quedarse esperando"
  18: "el microcontrolador debe poder seguir vivo si aquel se apaga"
  20: "Un ESP32 con wifi cubre la mayoría de los proyectos conectados"
  21: "tiempo real estricto y servicios que solo un sistema operativo da"
  23: "reiniciar el ordenador con el sistema en marcha"
  24: "Si no, la frontera estaba mal trazada."
  "cap19#0": "Reparto de tareas entre microcontrolador y ordenador de placa."

modelo: { valores: {}, calculos: {} }

tarjetas:
  - id: explore-reparto
    tipo: explorar
    titulo: "Dos naturalezas"
    texto: "Un microcontrolador es determinista y arranca al instante; un ordenador de placa tiene red, ficheros y potencia. Toque cada lado."
    libro: ["cap19#0", 4, 5, 7, 9, 10]
    widget:
      tipo: figura
      figura: fig-19.1
      zonas:
        - { id: micro, rotulo: "Recuadro azul de la izquierda", rect: [3, 3, 178, 105], texto: "Microcontrolador: lo que exige puntualidad y fiabilidad. Sensores a intervalos exactos, actuadores, seguridad." }
        - { id: enlace, rotulo: "Flechas del centro", rect: [183, 20, 86, 75], texto: "El enlace: qué información cruza la frontera, con su protocolo." }
        - { id: ordenador, rotulo: "Recuadro morado de la derecha", rect: [271, 3, 177, 105], texto: "Ordenador de placa: lo que exige potencia y servicios. Red, almacenamiento, interfaz y procesado pesado." }
    requiere: { mover: [micro, ordenador] }

  - id: toque-seguridad
    tipo: tocar
    titulo: "Quién vigila la seguridad"
    texto: "Cortar si algo se sale de márgenes, con un watchdog propio. Toque el lado que debe hacerlo."
    libro: [7, 8]
    widget:
      tipo: figura
      figura: fig-19.1
      zonas:
        - { id: micro, rotulo: "Recuadro azul de la izquierda", rect: [3, 3, 178, 105] }
        - { id: enlace, rotulo: "Flechas del centro", rect: [183, 20, 86, 75] }
        - { id: ordenador, rotulo: "Recuadro morado de la derecha", rect: [271, 3, 177, 105] }
    tocar:
      bien: [micro]
      porque:
        enlace: "El enlace lleva información; la decisión de cortar tiene que tomarse en una de las dos placas."
        ordenador: "El ordenador puede colgarse o reiniciarse: lo que exige puntualidad y fiabilidad no va ahí."
    exito: "El microcontrolador: la vigilancia de la seguridad exige puntualidad y fiabilidad."
    escalera:
      - "¿Qué lado arranca al instante y no depende de un sistema operativo?"
    solucion: "El recuadro azul, el microcontrolador."

  - id: prediga-reinicio
    tipo: predecir
    titulo: "El ordenador se reinicia"
    texto: "Un sistema combinado está en marcha y el ordenador de placa se actualiza y se reinicia. ¿Qué le pasa al proceso?"
    libro: [12]
    widget:
      tipo: figura
      figura: fig-19.1
      zonas:
        - { id: micro, rotulo: "Recuadro azul de la izquierda", rect: [3, 3, 178, 105] }
    opciones:
      - texto: "El microcontrolador sigue controlándolo"
        bien: true
        porque: "Es la propiedad que justifica la arquitectura: el control no depende del ordenador."
      - texto: "Se detiene hasta que el ordenador vuelve"
        porque: "Eso pasaría si el control estuviera en el ordenador; aquí lo lleva el microcontrolador."
      - texto: "Se reinicia también el microcontrolador"
        porque: "Son dos placas independientes: el reinicio de una no arrastra a la otra."
    escalera:
      - "¿En qué placa está el control del proceso?"
    solucion: "El microcontrolador sigue controlando el proceso."

  - id: porque-capas
    tipo: porque
    titulo: "Dos capas"
    texto: "¿Por qué esa propiedad convierte el sistema en algo seguro por construcción?"
    libro: [13]
    widget:
      tipo: figura
      figura: fig-19.1
      zonas:
        - { id: ordenador, rotulo: "Recuadro morado de la derecha", rect: [271, 3, 177, 105] }
    opciones:
      - texto: "La parte compleja y frágil no puede tumbar la simple y fiable"
        bien: true
        porque: "Dos capas con grados de criticidad distintos, como el cargador de arranque y la aplicación."
      - texto: "Porque el ordenador nunca se cuelga"
        porque: "Al contrario: se cuelga, se actualiza y se reinicia. El diseño cuenta con ello."
      - texto: "Porque el microcontrolador es más rápido"
        porque: "No es cuestión de velocidad, sino de qué parte puede fallar sin arrastrar a la otra."
    escalera:
      - "¿Cuál de las dos es la parte compleja?"
    solucion: "La parte compleja y frágil no puede tumbar la parte simple y fiable."

  - id: degradado
    tipo: pregunta
    titulo: "Si el ordenador no responde"
    texto: "Hay que definir el comportamiento degradado. ¿Qué debe hacer el microcontrolador si el ordenador no contesta?"
    libro: [15, 17]
    widget:
      tipo: figura
      figura: fig-19.1
      zonas:
        - { id: enlace, rotulo: "Flechas del centro", rect: [183, 20, 86, 75] }
    opciones:
      - texto: "Pasar a un modo autónomo razonable"
        bien: true
        porque: "No debe quedarse esperando: sigue con lo que le toca hasta que el otro vuelva."
      - texto: "Esperar la siguiente orden"
        porque: "Esperar indefinidamente es justo lo que hay que evitar: el proceso quedaría sin control."
      - texto: "Reiniciarse para recuperar el enlace"
        porque: "Reiniciarse no arregla al otro y deja el proceso sin control mientras arranca."
    escalera:
      - "¿Qué es peor: seguir solo o quedarse parado?"
    solucion: "Un modo autónomo razonable, sin quedarse esperando."

  - id: alimentacion
    tipo: pregunta
    titulo: "La alimentación"
    texto: "El ordenador de placa consume mucho más. ¿Qué hay que garantizar al diseñar la alimentación?"
    libro: [18]
    widget:
      tipo: figura
      figura: fig-19.1
      zonas:
        - { id: micro, rotulo: "Recuadro azul de la izquierda", rect: [3, 3, 178, 105] }
    opciones:
      - texto: "Que el microcontrolador siga vivo si el ordenador se apaga"
        bien: true
        porque: "Si comparten una alimentación que cae con el ordenador, la propiedad del reparto se pierde."
      - texto: "Que los dos se apaguen a la vez"
        porque: "Eso arrastra al microcontrolador con el ordenador: justo lo contrario."
      - texto: "Que el ordenador alimente al microcontrolador"
        porque: "Entonces, si el ordenador se apaga, el microcontrolador cae con él."
    escalera:
      - "¿Cuál de los dos tiene que sobrevivir al otro?"
    solucion: "El microcontrolador debe poder seguir vivo si el ordenador se apaga."

  - id: cuando-no
    tipo: pregunta
    titulo: "Cuándo sobra"
    texto: "Un proyecto conectado lee unos sensores y los publica por wifi, sin tiempo real estricto. ¿Qué arquitectura le basta?"
    libro: [20, 21]
    widget:
      tipo: figura
      figura: fig-19.1
      zonas:
        - { id: enlace, rotulo: "Flechas del centro", rect: [183, 20, 86, 75] }
    opciones:
      - texto: "Un microcontrolador con red, como un ESP32 con wifi"
        bien: true
        porque: "Si cabe entero en un microcontrolador con red, esa es la respuesta: una placa, un programa."
      - texto: "Microcontrolador y ordenador de placa"
        porque: "Dos placas, dos programas y un protocolo solo se justifican si hacen falta las dos naturalezas."
      - texto: "Solo un ordenador de placa"
        porque: "Funcionaría, pero no se pide nada que exija un sistema operativo: sobra potencia y consumo."
    escalera:
      - "¿Hace falta aquí tiempo real estricto y servicios de un sistema operativo a la vez?"
    solucion: "Un microcontrolador con red, como un ESP32 con wifi."

  - id: ordene-prueba
    tipo: pregunta
    titulo: "La prueba del banco"
    texto: "Ordene la prueba que valida una arquitectura combinada."
    libro: [23, 24]
    widget:
      tipo: figura
      figura: fig-19.1
      zonas:
        - { id: ordenador, rotulo: "Recuadro morado de la derecha", rect: [271, 3, 177, 105] }
    ordenar:
      - "Poner el sistema en marcha"
      - "Reiniciar el ordenador"
      - "Comprobar que el proceso sigue controlado"
      - "Ver que el microcontrolador entra en modo autónomo"
      - "Comprobar que al volver se resincronizan solos"
    exito: "Si funciona, el reparto está bien hecho. Si no, la frontera estaba mal trazada."
    pistas:
      - { texto: "El reinicio se provoca con el sistema ya funcionando." }
    escalera:
      - "Primero el sistema funcionando; después, el fallo; al final, la vuelta."
    solucion: "Marcha, reinicio, control, modo autónomo y resincronización."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [7, 9, 12, 20]
    ideas:
      - { titulo: "El reparto.", texto: "Al microcontrolador, la puntualidad y la fiabilidad; al ordenador, la potencia y los servicios." }
      - { titulo: "La propiedad.", texto: "Si el ordenador se cuelga o se reinicia, el microcontrolador sigue controlando." }
      - { titulo: "Lo degradado.", texto: "Modo autónomo razonable y alimentación que no arrastre al microcontrolador." }
      - { titulo: "Cuándo sobra.", texto: "Si cabe en un microcontrolador con red, una sola placa." }
