# Lección 1.2 de la sección 18.1 «Lo Mejor de Ambos Mundos» (cap19; etiquetas sec-19.N = impresas 18.N).
# - El reparto de la figura 18.1 (fig-19.1) con zonas: microcontrolador, enlace y ordenador de placa.
# - Sin modelo de circuito: la sección es de arquitectura.
# Paso práctico: «tocar» en la figura 18.1 el lado que vigila la seguridad; ordenar la prueba del banco (bloque 23).
# 1.2.1 (autor121-sens, «aprender haciendo», GUIA §13): en la figura 18.1 se tocan el lado que vigila la seguridad,
# el que guarda la base de datos y la parte frágil; la prueba del banco (reiniciar el ordenador en marcha) se hace en un
# circuito «logica» donde la alimentación compartida arrastra al microcontrolador; el modo autónomo, en otro donde el
# microcontrolador elige entre la orden del ordenador y su modo propio (un multiplexor). La alimentación y la prueba
# ordenada pasan a esos circuitos. Queda una pregunta de opciones: cuándo sobra.
leccion: cap19/sec-19.1

libro:
  4: "Un microcontrolador es determinista, arranca al instante y consume microamperios"
  5: "La arquitectura combinada no es un apaño"
  7: "Al microcontrolador lo que exige puntualidad y fiabilidad"
  8: "Vigilar la seguridad: cortar si algo se sale de márgenes"
  9: "Al ordenador lo que exige potencia y servicios"
  10: "Almacenamiento y bases de datos"
  12: "si el ordenador se cuelga, se actualiza o se reinicia, el microcontrolador sigue controlando el proceso"
  13: "la parte compleja y frágil no puede tumbar la parte simple y fiable"
  15: "Cuanto más clara sea, más fácil será depurar y sustituir cualquiera de los dos"
  17: "Debe tener un modo autónomo razonable, no quedarse esperando"
  18: "el microcontrolador debe poder seguir vivo si aquel se apaga"
  20: "Un ESP32 con wifi cubre la mayoría de los proyectos conectados"
  21: "tiempo real estricto y servicios que solo un sistema operativo da"
  23: "reiniciar el ordenador con el sistema en marcha"
  24: "Si no, la frontera estaba mal trazada."
  "cap19#0": "Reparto de tareas entre microcontrolador y ordenador de placa."

modelo: { valores: {}, calculos: {} }

tarjetas:
  - id: explore-reparto
    tipo: explorar
    titulo: "Dos naturalezas"
    texto: "Un microcontrolador es determinista y arranca al instante; un ordenador de placa tiene red, ficheros y potencia. Toque cada lado."
    libro: ["cap19#0", 4, 5, 7, 9, 10]
    widget:
      tipo: figura
      figura: fig-19.1
      zonas:
        - { id: micro, rotulo: "Recuadro azul de la izquierda", rect: [3, 3, 178, 105], texto: "Microcontrolador: lo que exige puntualidad y fiabilidad. Sensores a intervalos exactos, actuadores, seguridad." }
        - { id: enlace, rotulo: "Flechas del centro", rect: [183, 20, 86, 75], texto: "El enlace: qué información cruza la frontera, con su protocolo." }
        - { id: ordenador, rotulo: "Recuadro morado de la derecha", rect: [271, 3, 177, 105], texto: "Ordenador de placa: lo que exige potencia y servicios. Red, almacenamiento, interfaz y procesado pesado." }
    requiere: { mover: [micro, ordenador] }

  - id: toque-seguridad
    tipo: tocar
    titulo: "Quién vigila la seguridad"
    texto: "Cortar si algo se sale de márgenes, con un watchdog propio. Toque el lado que debe hacerlo."
    libro: [7, 8]
    widget:
      tipo: figura
      figura: fig-19.1
      zonas:
        - { id: micro, rotulo: "Recuadro azul de la izquierda", rect: [3, 3, 178, 105] }
        - { id: enlace, rotulo: "Flechas del centro", rect: [183, 20, 86, 75] }
        - { id: ordenador, rotulo: "Recuadro morado de la derecha", rect: [271, 3, 177, 105] }
    tocar:
      bien: [micro]
      porque:
        enlace: "El enlace lleva información; la decisión de cortar tiene que tomarse en una de las dos placas."
        ordenador: "El ordenador puede colgarse o reiniciarse: lo que exige puntualidad y fiabilidad no va ahí."
    exito: "El microcontrolador: la vigilancia de la seguridad exige puntualidad y fiabilidad."
    escalera:
      - "¿Qué lado arranca al instante y no depende de un sistema operativo?"
    solucion: "El recuadro azul, el microcontrolador."

  - id: toque-base-datos
    tipo: tocar
    titulo: "Quién guarda los datos"
    texto: "El sistema guarda meses de medidas en una base de datos y las sirve por la red. Toque el lado que lo hace."
    libro: [9, 10]
    widget:
      tipo: figura
      figura: fig-19.1
      zonas:
        - { id: micro, rotulo: "Recuadro azul de la izquierda", rect: [3, 3, 178, 105] }
        - { id: enlace, rotulo: "Flechas del centro", rect: [183, 20, 86, 75] }
        - { id: ordenador, rotulo: "Recuadro morado de la derecha", rect: [271, 3, 177, 105] }
    tocar:
      bien: [ordenador]
      porque:
        micro: "El microcontrolador lee y gobierna a tiempo; ficheros, bases de datos y red los trae el sistema operativo."
        enlace: "Por el enlace pasan las medidas, pero alguien tiene que guardarlas."
    exito: "El ordenador de placa: lo que exige potencia y servicios, como red, almacenamiento, interfaz y procesado pesado."
    escalera:
      - "¿Qué lado tiene sistema de ficheros?"
    solucion: "El recuadro morado, el ordenador."

  - id: prediga-reinicio
    tipo: explorar
    titulo: "El ordenador se reinicia"
    texto: "La prueba del banco: con el sistema en marcha, apague el ordenador y consiga que el proceso siga controlado."
    libro: [12, 18, 23, 24]
    widget:
      tipo: logica
      entradas:
        - { id: PC, valor: 1, rotulo: "Ordenador en marcha" }
        - { id: FC, valor: 1, rotulo: "Fuente compartida" }
      piezas:
        - { id: n1, tipo: not, entradas: [FC] }
        - { id: o1, tipo: or, entradas: [PC, n1], rotulo: "Microcontrolador vivo" }
      salidas:
        - { id: WEB, de: PC, rotulo: "Panel web" }
        - { id: CTRL, de: o1, rotulo: "Proceso controlado" }
    objetivo:
      condiciones:
        - { led: WEB, valor: 0, rotulo: "Ordenador apagado" }
        - { led: CTRL, valor: 1, rotulo: "Proceso controlado" }
      logrado: "Con su propia alimentación, el microcontrolador sigue controlando aunque el ordenador se cuelgue o se reinicie: la propiedad que justifica la arquitectura. Si la prueba falla, la frontera estaba mal trazada."
      pistas:
        - { cuando: { led: CTRL, valor: 0 }, texto: "La fuente que cae con el ordenador arrastra al microcontrolador: sepárelas." }
        - { texto: "Apague el ordenador." }
    escalera:
      - "El microcontrolador debe poder seguir vivo si el ordenador se apaga."
    solucion: "Fuente separada y ordenador apagado."

  - id: porque-capas
    tipo: tocar
    titulo: "Dos capas"
    texto: "El sistema es seguro por construcción: la parte compleja y frágil no puede tumbar a la simple y fiable. Toque la frágil."
    libro: [13]
    widget:
      tipo: figura
      figura: fig-19.1
      zonas:
        - { id: micro, rotulo: "Recuadro azul de la izquierda", rect: [3, 3, 178, 105] }
        - { id: enlace, rotulo: "Flechas del centro", rect: [183, 20, 86, 75] }
        - { id: ordenador, rotulo: "Recuadro morado de la derecha", rect: [271, 3, 177, 105] }
    tocar:
      bien: [ordenador]
      porque:
        micro: "Es la parte simple y fiable: determinista, arranca al instante."
        enlace: "El enlace une las dos capas; la frágil es una de ellas."
    exito: "El ordenador: se cuelga, se actualiza y se reinicia, y el diseño cuenta con ello. Dos capas de criticidad distinta, como el cargador de arranque y la aplicación."
    escalera:
      - "¿Cuál de las dos lleva un sistema operativo entero?"
    solucion: "El ordenador de placa."

  - id: degradado
    tipo: explorar
    titulo: "Si el ordenador no responde"
    texto: "Dos diseños gobiernan la misma bomba: uno solo obedece al ordenador; otro tiene un modo autónomo. Corte el enlace y consiga que la bomba siga trabajando."
    libro: [15, 17]
    widget:
      tipo: logica
      entradas:
        - { id: ENL, valor: 1, rotulo: "El ordenador responde" }
        - { id: ORD, valor: 0, rotulo: "Orden: bomba en marcha" }
      piezas:
        - { id: a1, tipo: and, entradas: [ORD, ENL], rotulo: "Solo obedece" }
        - { id: m1, tipo: mux, bits: 1, entradas: [ENL, 1, ORD], rotulo: "Con modo autónomo" }
      salidas:
        - { id: ENLACE, de: ENL, rotulo: "Enlace" }
        - { id: B1, de: a1, rotulo: "Bomba, solo obedece" }
        - { id: B2, de: m1, rotulo: "Bomba, modo autónomo" }
    objetivo:
      condiciones:
        - { led: ENLACE, valor: 0, rotulo: "Enlace cortado" }
        - { led: B2, valor: 1, rotulo: "Bomba con modo autónomo en marcha" }
      logrado: "Sin respuesta, el multiplexor pasa al modo autónomo y la bomba sigue; el diseño que solo obedece se queda esperando. No debe quedarse esperando."
      pistas:
        - { texto: "Corte el enlace: el ordenador deja de responder." }
    escalera:
      - "¿Qué hace cada diseño cuando falta la orden?"
    solucion: "Enlace cortado: el modo autónomo mantiene la bomba."

  - id: cuando-no
    tipo: pregunta
    titulo: "Cuándo sobra"
    texto: "Un proyecto conectado lee unos sensores y los publica por wifi, sin tiempo real estricto. ¿Qué arquitectura le basta?"
    libro: [20, 21]
    widget:
      tipo: figura
      figura: fig-19.1
      zonas:
        - { id: enlace, rotulo: "Flechas del centro", rect: [183, 20, 86, 75] }
    opciones:
      - texto: "Un microcontrolador con red, como un ESP32 con wifi"
        bien: true
        porque: "Si cabe entero en un microcontrolador con red, esa es la respuesta: una placa, un programa."
      - texto: "Microcontrolador y ordenador de placa"
        porque: "Dos placas, dos programas y un protocolo solo se justifican si hacen falta las dos naturalezas."
      - texto: "Solo un ordenador de placa"
        porque: "Funcionaría, pero no se pide nada que exija un sistema operativo: sobra potencia y consumo."
    escalera:
      - "¿Hace falta aquí tiempo real estricto y servicios de un sistema operativo a la vez?"
    solucion: "Un microcontrolador con red, como un ESP32 con wifi."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [7, 9, 12, 20]
    ideas:
      - { titulo: "El reparto.", texto: "Al microcontrolador, la puntualidad y la fiabilidad; al ordenador, la potencia y los servicios." }
      - { titulo: "La propiedad.", texto: "Si el ordenador se cuelga o se reinicia, el microcontrolador sigue controlando." }
      - { titulo: "Lo degradado.", texto: "Modo autónomo razonable y alimentación que no arrastre al microcontrolador." }
      - { titulo: "Cuándo sobra.", texto: "Si cabe en un microcontrolador con red, una sola placa." }
