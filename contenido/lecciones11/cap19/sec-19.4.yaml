# Lección 1.2 de la sección 18.4 «Más Allá: el Camino por Delante» (cap19; sec-19.N = impresas 18.N).
# - Los cuatro caminos de la figura 18.4 (fig-19.5) con zonas, y lo que no cambia con la tecnología.
# - Sin modelo de circuito: la sección es de orientación.
# Paso práctico: «tocar» el camino que separa un prototipo de un producto; ordenar el ejercicio final de reparación.
# 1.2.1 (autor121-sens, «aprender haciendo», GUIA §13): los cuatro caminos de la figura 18.5 se tocan uno a uno
# (diseñar en lugar de copiar, el aparato que funciona, el producto, las especialidades) en lugar de explorarlos; los
# errores, el mecanismo y la discrepancia pasan al resumen. Queda una pregunta de opciones (reparar) y el método de
# reparación, por ordenar. Sección de reflexión, sin circuito ni cálculo: 4 de 7 haciendo.
# 1.3 (contenido13): la exploración de la figura lleva objetivo de zonas («explorar sin modelo», GUIA §13.3): 4/7 → 5/7.
leccion: cap19/sec-19.4

libro:
  64: "Lo que sigue son direcciones en las que profundizar"
  66: "Es lo que permite diseñar en lugar de copiar, y predecir en lugar de probar."
  67: "Es donde un circuito correcto se convierte en un aparato que funciona"
  68: "Es lo que separa un prototipo de un producto."
  69: "Cada una es un campo entero."
  72: "Un circuito montado enseña más que diez leídos"
  73: "Es probablemente la forma más eficiente de aprender electrónica práctica."
  74: "La discrepancia entre lo calculado y lo medido es donde está el aprendizaje"
  76: "Un cajón lleno no enseña."
  77: "Se aprende más de un montaje mediocre terminado que de uno excelente pensado."
  78: "funciona en circuitos de cinco componentes y falla en todos los demás"
  79: "Lo que se hizo hace seis meses y no se anotó está perdido"
  82: "el mecanismo sirve para el que no lo estaba, que es la mayoría"
  83: "ahí está exactamente lo que falta por entender"
  85: "elegir un aparato averiado"
  86: "leer el esquema si lo hay o deducirlo si no, medir con criterio, formar hipótesis, comprobarlas y confirmar la reparación"
  87: "Los cuatro caminos que se abren y lo que no cambia con la tecnología."

modelo: { valores: {}, calculos: {} }

tarjetas:
  - id: explore-caminos
    tipo: explorar
    titulo: "Cuatro direcciones"
    texto: "Con componentes, circuitos, instrumentos y microcontroladores se aborda la mayoría de los proyectos. Toque los cuatro caminos."
    libro: [64, 87]
    widget:
      tipo: figura
      figura: fig-19.5
      zonas:
        - { id: analisis, rotulo: "Primer recuadro azul", rect: [4, 3, 107, 89], texto: "Hacia el análisis." }
        - { id: fisica, rotulo: "Segundo recuadro azul", rect: [117, 3, 106, 89], texto: "Hacia la realización física." }
        - { id: sistemas, rotulo: "Tercer recuadro azul", rect: [229, 3, 106, 89], texto: "Hacia los sistemas." }
        - { id: especialidades, rotulo: "Cuarto recuadro azul", rect: [341, 3, 106, 89], texto: "Hacia especialidades." }
        - { id: nocambia, rotulo: "Recuadro naranja de abajo", rect: [4, 99, 443, 58], texto: "Lo que no cambia con la tecnología: construir, reparar y medir." }
    objetivo:
      condiciones:
        - { zona: analisis, rotulo: "Primer camino" }
        - { zona: fisica, rotulo: "Segundo camino" }
        - { zona: sistemas, rotulo: "Tercer camino" }
        - { zona: especialidades, rotulo: "Cuarto camino" }
        - { zona: nocambia, rotulo: "Lo que no cambia" }
      logrado: "Cuatro caminos hacia delante, y lo que no cambia con la tecnología: construir, reparar y medir."
      pistas:
        - { texto: "Toque los recuadros que faltan." }
    escalera:
      - "Cuatro recuadros azules y el naranja de abajo."
    solucion: "Toque los cuatro recuadros azules y el naranja."

  - id: toque-copiar
    tipo: tocar
    titulo: "Diseñar en lugar de copiar"
    texto: "Toque el camino que enseña a diseñar en lugar de copiar."
    libro: [64, 66, 87]
    widget:
      tipo: figura
      figura: fig-19.5
      zonas:
        - { id: analisis, rotulo: "Primer recuadro azul", rect: [4, 3, 107, 89] }
        - { id: fisica, rotulo: "Segundo recuadro azul", rect: [117, 3, 106, 89] }
        - { id: sistemas, rotulo: "Tercer recuadro azul", rect: [229, 3, 106, 89] }
        - { id: especialidades, rotulo: "Cuarto recuadro azul", rect: [341, 3, 106, 89] }
    tocar:
      bien: [analisis]
      porque:
        fisica: "La realización física convierte un circuito correcto en un aparato; no enseña a diseñarlo."
        sistemas: "Los sistemas separan un prototipo de un producto."
        especialidades: "Cada especialidad es un campo entero, no la base para diseñar."
    exito: "Hacia el análisis, con las herramientas formales de los capítulos 22 a 30: diseñar en lugar de copiar, y predecir en lugar de probar."
    escalera:
      - "¿Qué camino explica por qué los circuitos hacen lo que hacen?"
    solucion: "El primero, hacia el análisis."

  - id: toque-aparato
    tipo: tocar
    titulo: "Un circuito correcto que no funciona"
    texto: "El esquema es correcto, pero el aparato montado no funciona bien: interferencias, ruido de la alimentación. Toque el camino que lo resuelve."
    libro: [67]
    widget:
      tipo: figura
      figura: fig-19.5
      zonas:
        - { id: analisis, rotulo: "Primer recuadro azul", rect: [4, 3, 107, 89] }
        - { id: fisica, rotulo: "Segundo recuadro azul", rect: [117, 3, 106, 89] }
        - { id: sistemas, rotulo: "Tercer recuadro azul", rect: [229, 3, 106, 89] }
        - { id: especialidades, rotulo: "Cuarto recuadro azul", rect: [341, 3, 106, 89] }
    tocar:
      bien: [fisica]
      porque:
        analisis: "El análisis ya dio un esquema correcto; lo que falla es cómo se ha realizado."
        sistemas: "Fiabilidad y producción vienen después de que el aparato funcione."
        especialidades: "No hace falta otra especialidad: es la placa y su compatibilidad electromagnética."
    exito: "Hacia la realización física: placas, integridad de señal y de alimentación, y compatibilidad electromagnética. Ahí un circuito correcto se convierte en un aparato que funciona."
    escalera:
      - "Interferencias y alimentación son cuestión de la placa."
    solucion: "El segundo, hacia la realización física."

  - id: toque-producto
    tipo: tocar
    titulo: "Del prototipo al producto"
    texto: "Toque el camino que separa un prototipo de un producto."
    libro: [66, 67, 68]
    widget:
      tipo: figura
      figura: fig-19.5
      zonas:
        - { id: analisis, rotulo: "Primer recuadro azul", rect: [4, 3, 107, 89] }
        - { id: fisica, rotulo: "Segundo recuadro azul", rect: [117, 3, 106, 89] }
        - { id: sistemas, rotulo: "Tercer recuadro azul", rect: [229, 3, 106, 89] }
        - { id: especialidades, rotulo: "Cuarto recuadro azul", rect: [341, 3, 106, 89] }
    tocar:
      bien: [sistemas]
      porque:
        analisis: "El análisis enseña a diseñar en lugar de copiar, no a convertir un prototipo en producto."
        fisica: "La realización física hace que un circuito correcto funcione como aparato; producto es más: fiabilidad, producción, mantenimiento."
        especialidades: "Las especialidades son campos enteros, no el paso de prototipo a producto."
    exito: "Hacia los sistemas: fiabilidad, seguridad, producción y mantenimiento."
    escalera:
      - "¿Qué camino habla de producción y mantenimiento?"
    solucion: "El tercer recuadro, hacia los sistemas."

  - id: toque-especialidad
    tipo: tocar
    titulo: "Un campo entero"
    texto: "Quiere dedicarse a la radiofrecuencia o a las FPGA. Toque el camino."
    libro: [69]
    widget:
      tipo: figura
      figura: fig-19.5
      zonas:
        - { id: analisis, rotulo: "Primer recuadro azul", rect: [4, 3, 107, 89] }
        - { id: fisica, rotulo: "Segundo recuadro azul", rect: [117, 3, 106, 89] }
        - { id: sistemas, rotulo: "Tercer recuadro azul", rect: [229, 3, 106, 89] }
        - { id: especialidades, rotulo: "Cuarto recuadro azul", rect: [341, 3, 106, 89] }
    tocar:
      bien: [especialidades]
      porque:
        analisis: "Es la base de todas, pero no es una especialidad."
        fisica: "La placa y la compatibilidad electromagnética las necesitan todas."
        sistemas: "Fiabilidad y producción también son comunes a todas."
    exito: "Hacia especialidades: radiofrecuencia, FPGA, potencia, audio, sensores e instrumentación. Cada una es un campo entero."
    escalera:
      - "Busque el camino que nombra campos concretos."
    solucion: "El cuarto, hacia especialidades."

  - id: reparando
    tipo: pregunta
    titulo: "Cómo se aprende"
    texto: "Construyendo, reparando y midiendo. ¿Cuál es probablemente la forma más eficiente de aprender electrónica práctica?"
    libro: [72, 73, 74]
    widget:
      tipo: figura
      figura: fig-19.5
      zonas:
        - { id: nocambia, rotulo: "Recuadro naranja de abajo", rect: [4, 99, 443, 58] }
    opciones:
      - texto: "Reparando lo que otro construyó"
        bien: true
        porque: "Enseña a la vez el circuito, el método y los modos de fallo reales."
      - texto: "Leyendo muchos esquemas"
        porque: "Un circuito montado enseña más que diez leídos: obliga a decidir."
      - texto: "Acumulando componentes"
        porque: "Es uno de los errores que conviene evitar: un cajón lleno no enseña."
    escalera:
      - "¿Qué actividad enseña a la vez el circuito, el método y los fallos reales?"
    solucion: "Reparando."

  - id: ordene-reparar
    tipo: pregunta
    titulo: "El ejercicio de cierre"
    texto: "Elija un aparato averiado del cajón y repárelo. Ordene los pasos del método."
    libro: [85, 86]
    widget:
      tipo: figura
      figura: fig-19.5
      zonas:
        - { id: nocambia, rotulo: "Recuadro naranja de abajo", rect: [4, 99, 443, 58] }
    ordenar:
      - "Leer el esquema, o deducirlo"
      - "Medir con criterio"
      - "Formar hipótesis"
      - "Comprobarlas"
      - "Confirmar la reparación"
    exito: "El circuito no lo diseñó usted: hay que entenderlo de verdad."
    pistas:
      - { texto: "Sin saber qué es el circuito no se sabe qué medir." }
    escalera:
      - "Primero entender, luego medir, luego suponer y comprobar."
    solucion: "Esquema, medir, hipótesis, comprobar y confirmar."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [66, 68, 73, 76, 77, 78, 79, 82, 83]
    ideas:
      - { titulo: "Cuatro caminos.", texto: "Análisis, realización física, sistemas y especialidades." }
      - { titulo: "Aprender.", texto: "Construyendo, reparando y midiendo; reparar es probablemente lo más eficiente." }
      - { titulo: "La actitud.", texto: "Entender el mecanismo, que sirve para lo imprevisto, y medir antes que suponer." }
      - { titulo: "Los errores.", texto: "Un cajón lleno no enseña; un montaje mediocre terminado, sí. Papel antes de montar, y anotarlo todo." }
