# Lección 1.2 de la sección 18.4 «Más Allá: el Camino por Delante» (cap19; sec-19.N = impresas 18.N).
# - Los cuatro caminos de la figura 18.4 (fig-19.5) con zonas, y lo que no cambia con la tecnología.
# - Sin modelo de circuito: la sección es de orientación.
# Paso práctico: «tocar» el camino que separa un prototipo de un producto; ordenar el ejercicio final de reparación.
leccion: cap19/sec-19.4

libro:
  64: "Lo que sigue son direcciones en las que profundizar"
  66: "Es lo que permite diseñar en lugar de copiar, y predecir en lugar de probar."
  67: "Es donde un circuito correcto se convierte en un aparato que funciona"
  68: "Es lo que separa un prototipo de un producto."
  69: "Cada una es un campo entero."
  72: "Un circuito montado enseña más que diez leídos"
  73: "Es probablemente la forma más eficiente de aprender electrónica práctica."
  74: "La discrepancia entre lo calculado y lo medido es donde está el aprendizaje"
  76: "Un cajón lleno no enseña."
  77: "Se aprende más de un montaje mediocre terminado que de uno excelente pensado."
  78: "funciona en circuitos de cinco componentes y falla en todos los demás"
  79: "Lo que se hizo hace seis meses y no se anotó está perdido"
  82: "el mecanismo sirve para el que no lo estaba, que es la mayoría"
  83: "ahí está exactamente lo que falta por entender"
  85: "elegir un aparato averiado"
  86: "leer el esquema si lo hay o deducirlo si no, medir con criterio, formar hipótesis, comprobarlas y confirmar la reparación"
  87: "Los cuatro caminos que se abren y lo que no cambia con la tecnología."

modelo: { valores: {}, calculos: {} }

tarjetas:
  - id: explore-caminos
    tipo: explorar
    titulo: "Cuatro direcciones"
    texto: "Con componentes, circuitos, instrumentos y microcontroladores se aborda la mayoría de los proyectos. Toque cada camino para profundizar."
    libro: [64, 66, 67, 69, 87]
    widget:
      tipo: figura
      figura: fig-19.5
      zonas:
        - { id: analisis, rotulo: "Primer recuadro azul", rect: [4, 3, 107, 89], texto: "Hacia el análisis: diseñar en lugar de copiar, y predecir en lugar de probar." }
        - { id: fisica, rotulo: "Segundo recuadro azul", rect: [117, 3, 106, 89], texto: "Hacia la realización física: donde un circuito correcto se convierte en un aparato que funciona." }
        - { id: sistemas, rotulo: "Tercer recuadro azul", rect: [229, 3, 106, 89], texto: "Hacia los sistemas: fiabilidad, seguridad, producción y mantenimiento." }
        - { id: especialidades, rotulo: "Cuarto recuadro azul", rect: [341, 3, 106, 89], texto: "Hacia especialidades: radiofrecuencia, FPGA, potencia, audio, sensores. Cada una es un campo entero." }
    requiere: { mover: [analisis, sistemas] }

  - id: toque-producto
    tipo: tocar
    titulo: "Del prototipo al producto"
    texto: "Toque el camino que separa un prototipo de un producto."
    libro: [66, 67, 68]
    widget:
      tipo: figura
      figura: fig-19.5
      zonas:
        - { id: analisis, rotulo: "Primer recuadro azul", rect: [4, 3, 107, 89] }
        - { id: fisica, rotulo: "Segundo recuadro azul", rect: [117, 3, 106, 89] }
        - { id: sistemas, rotulo: "Tercer recuadro azul", rect: [229, 3, 106, 89] }
        - { id: especialidades, rotulo: "Cuarto recuadro azul", rect: [341, 3, 106, 89] }
    tocar:
      bien: [sistemas]
      porque:
        analisis: "El análisis enseña a diseñar en lugar de copiar, no a convertir un prototipo en producto."
        fisica: "La realización física hace que un circuito correcto funcione como aparato; producto es más: fiabilidad, producción, mantenimiento."
        especialidades: "Las especialidades son campos enteros, no el paso de prototipo a producto."
    exito: "Hacia los sistemas: fiabilidad, seguridad, producción y mantenimiento."
    escalera:
      - "¿Qué camino habla de producción y mantenimiento?"
    solucion: "El tercer recuadro, hacia los sistemas."

  - id: reparando
    tipo: pregunta
    titulo: "Cómo se aprende"
    texto: "Construyendo, reparando y midiendo. ¿Cuál es probablemente la forma más eficiente de aprender electrónica práctica?"
    libro: [72, 73, 74]
    widget:
      tipo: figura
      figura: fig-19.5
      zonas:
        - { id: nocambia, rotulo: "Recuadro naranja de abajo", rect: [4, 99, 443, 58] }
    opciones:
      - texto: "Reparando lo que otro construyó"
        bien: true
        porque: "Enseña a la vez el circuito, el método y los modos de fallo reales."
      - texto: "Leyendo muchos esquemas"
        porque: "Un circuito montado enseña más que diez leídos: obliga a decidir."
      - texto: "Acumulando componentes"
        porque: "Es uno de los errores que conviene evitar: un cajón lleno no enseña."
    escalera:
      - "¿Qué actividad enseña a la vez el circuito, el método y los fallos reales?"
    solucion: "Reparando."

  - id: empareje-errores
    tipo: pregunta
    titulo: "Los errores que conviene evitar"
    texto: "Empareje cada error con lo que dice el libro de él."
    libro: [76, 77, 78, 79]
    widget:
      tipo: figura
      figura: fig-19.5
      zonas:
        - { id: nocambia, rotulo: "Recuadro naranja de abajo", rect: [4, 99, 443, 58] }
    emparejar:
      - ["Acumular componentes sin construir", "Un cajón lleno no enseña"]
      - ["Buscar el circuito perfecto antes de montar", "Enseña más un montaje mediocre terminado"]
      - ["Saltarse el papel", "Funciona con cinco componentes y falla en los demás"]
      - ["No documentar", "Lo que no se anotó está perdido"]
    exito: "Y la documentación vuelve en la sección 18.8: es lo que hace reparable un aparato."
    pistas:
      - { texto: "El del papel es el de diseñar de cabeza y montar directamente." }
    escalera:
      - "Empiece por el cajón: es el de acumular."
    solucion: "Cajón lleno, montaje mediocre terminado, cinco componentes y lo no anotado."

  - id: prediga-discrepancia
    tipo: predecir
    titulo: "Lo medido no cuadra"
    texto: "Mide un circuito y el resultado no cuadra con lo que calculó. ¿Qué le dice eso?"
    libro: [74, 83]
    widget:
      tipo: figura
      figura: fig-19.5
      zonas:
        - { id: nocambia, rotulo: "Recuadro naranja de abajo", rect: [4, 99, 443, 58] }
    opciones:
      - texto: "Que ahí está lo que falta por entender"
        bien: true
        porque: "Medir antes que suponer: la discrepancia es donde está el aprendizaje."
      - texto: "Que el instrumento se equivoca"
        porque: "El instrumento no miente: lo que no cuadra es la suposición."
      - texto: "Nada: el cálculo manda"
        porque: "Al revés: un número medido vale más que uno supuesto."
    escalera:
      - "¿Quién miente, el instrumento o la suposición?"
    solucion: "Que ahí está exactamente lo que falta por entender."

  - id: porque-mecanismo
    tipo: porque
    titulo: "El mecanismo"
    texto: "El libro insiste en entender el mecanismo y no memorizar el procedimiento. ¿Por qué?"
    libro: [82]
    widget:
      tipo: figura
      figura: fig-19.5
      zonas:
        - { id: nocambia, rotulo: "Recuadro naranja de abajo", rect: [4, 99, 443, 58] }
    opciones:
      - texto: "El mecanismo sirve para el caso no previsto, que es la mayoría"
        bien: true
        porque: "Un procedimiento sirve para el caso previsto; los reales casi nunca lo están."
      - texto: "Porque los procedimientos están mal"
        porque: "No están mal: sirven, pero solo para el caso previsto."
      - texto: "Porque memorizar cuesta más"
        porque: "No es cuestión de esfuerzo, sino de qué sirve ante lo imprevisto."
    escalera:
      - "¿Para qué caso sirve un procedimiento?"
    solucion: "El mecanismo sirve para el caso que no estaba previsto, que es la mayoría."

  - id: ordene-reparar
    tipo: pregunta
    titulo: "El ejercicio de cierre"
    texto: "Elija un aparato averiado del cajón y repárelo. Ordene los pasos del método."
    libro: [85, 86]
    widget:
      tipo: figura
      figura: fig-19.5
      zonas:
        - { id: nocambia, rotulo: "Recuadro naranja de abajo", rect: [4, 99, 443, 58] }
    ordenar:
      - "Leer el esquema, o deducirlo"
      - "Medir con criterio"
      - "Formar hipótesis"
      - "Comprobarlas"
      - "Confirmar la reparación"
    exito: "El circuito no lo diseñó usted: hay que entenderlo de verdad."
    pistas:
      - { texto: "Sin saber qué es el circuito no se sabe qué medir." }
    escalera:
      - "Primero entender, luego medir, luego suponer y comprobar."
    solucion: "Esquema, medir, hipótesis, comprobar y confirmar."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [66, 68, 73, 83]
    ideas:
      - { titulo: "Cuatro caminos.", texto: "Análisis, realización física, sistemas y especialidades." }
      - { titulo: "Aprender.", texto: "Construyendo, reparando y midiendo; reparar es probablemente lo más eficiente." }
      - { titulo: "La actitud.", texto: "Entender el mecanismo y medir antes que suponer." }
