# Lección 1.2 de la sección 18.8 «Del Prototipo al Producto: Alimentación, Caja y Despliegue» (cap19; sec-19.N =
# impresas 18.N).
# - Las tres decisiones no eléctricas y la documentación de la figura 18.8 (fig-19.9), con zonas.
# - Sin modelo de circuito: la sección es de producto.
# Paso práctico: «tocar» en la figura 18.8 el documento que falta cuando no se sabe qué firmware lleva un aparato.
leccion: cap19/sec-19.8

libro:
  195: "un producto funciona en manos de otra persona, en un sitio desconocido y durante años"
  199: "Cuánto consume de verdad, medido en las condiciones reales y no estimado"
  200: "apagado ordenado, retención de datos, aviso"
  203: "proteger, disipar (sección 48.11), aislar eléctricamente"
  205: "Material: plástico (barato, aislante, no apantalla) o metal (apantalla y disipa, y exige aislamiento y toma de tierra)"
  207: "necesita autenticación y cifrado, no solo funcionamiento"
  209: "Cómo se actualiza, previsto desde el principio y con vuelta atrás."
  211: "es lo que hace que el producto sobreviva"
  212: "Firmware con su versión y su código fuente."
  213: "Un aparato sin esa documentación es irreparable en cuanto pasen dos años"
  215: "Si el aparato se va a vender o a ceder, hay requisitos que no son opcionales"
  216: "Para uso propio no aplican"
  219: "dárselo a alguien que no lo haya diseñado y ver qué hace con él"
  220: "Las tres decisiones no eléctricas al pasar a producto, y la documentación que lo hace reparable."

modelo: { valores: {}, calculos: {} }

tarjetas:
  - id: explore-producto
    tipo: explorar
    titulo: "Del prototipo al producto"
    texto: "Un producto funciona en manos de otra persona, en un sitio desconocido y durante años. Toque las decisiones que no son de circuito."
    libro: [195, 220]
    widget:
      tipo: figura
      figura: fig-19.9
      zonas:
        - { id: alimentacion, rotulo: "Recuadro azul", rect: [4, 3, 145, 126], texto: "La alimentación definitiva: de dónde viene, cuánto consume de verdad y qué pasa cuando falta." }
        - { id: caja, rotulo: "Recuadro naranja", rect: [153, 3, 145, 126], texto: "La caja: proteger, disipar, aislar, apantallar, sujetar y permitir el uso." }
        - { id: datos, rotulo: "Recuadro morado", rect: [303, 3, 144, 126], texto: "Conectividad y datos: protocolo seguro, integridad de lo guardado y actualización con vuelta atrás." }
        - { id: documentacion, rotulo: "Recuadro verde de abajo", rect: [4, 137, 443, 70], texto: "La documentación: lo que más se descuida y lo que hace que el producto sobreviva." }
    requiere: { mover: [alimentacion, caja, datos, documentacion] }

  - id: consumo
    tipo: pregunta
    titulo: "Cuánto consume"
    texto: "Para decidir la alimentación definitiva, ¿cómo se obtiene el consumo del aparato?"
    libro: [199, 200]
    widget:
      tipo: figura
      figura: fig-19.9
      zonas:
        - { id: alimentacion, rotulo: "Recuadro azul", rect: [4, 3, 145, 126] }
    opciones:
      - texto: "Medido en las condiciones reales"
        bien: true
        porque: "Lo que manda es lo que consume de verdad, no lo que se estimó."
      - texto: "Estimado con las hojas de datos"
        porque: "La estimación orienta, pero el libro pide el consumo medido en condiciones reales."
      - texto: "El de la fuente de laboratorio del prototipo"
        porque: "La fuente del prototipo dice lo que puede dar, no lo que consume el aparato."
    escalera:
      - "¿Estimar o medir?"
    solucion: "Medido en las condiciones reales, no estimado."

  - id: empareje-caja
    tipo: pregunta
    titulo: "Las decisiones de la caja"
    texto: "Condicionan la placa, así que se toman pronto. Empareje cada decisión con lo que implica."
    libro: [203, 205]
    widget:
      tipo: figura
      figura: fig-19.9
      zonas:
        - { id: caja, rotulo: "Recuadro naranja", rect: [153, 3, 145, 126] }
    emparejar:
      - ["Caja de plástico", "Barata y aislante, pero no apantalla"]
      - ["Caja de metal", "Apantalla y disipa; exige toma de tierra"]
      - ["Sujeción de los cables", "Alivio de tensión"]
      - ["Grado de protección IP", "Juntas y prensaestopas"]
    exito: "Proteger, disipar, aislar, apantallar, sujetar y permitir el uso: más funciones de las que parece."
    pistas:
      - { texto: "La caja que apantalla es la conductora." }
    escalera:
      - "Empiece por los materiales: ¿cuál conduce?"
    solucion: "Plástico aísla sin apantallar; metal apantalla con tierra; cables con alivio de tensión; IP con juntas."

  - id: conectado
    tipo: pregunta
    titulo: "Conectado a internet"
    texto: "El aparato va a estar conectado a internet. Además de que funcione, ¿qué necesita su protocolo?"
    libro: [207, 209]
    widget:
      tipo: figura
      figura: fig-19.9
      zonas:
        - { id: datos, rotulo: "Recuadro morado", rect: [303, 3, 144, 126] }
    opciones:
      - texto: "Autenticación y cifrado"
        bien: true
        porque: "Un aparato conectado a internet necesita garantías, no solo funcionamiento."
      - texto: "Más velocidad"
        porque: "La velocidad no protege nada: lo que falta son garantías de seguridad."
      - texto: "Nada más, si funciona"
        porque: "Funcionar no basta en internet: hacen falta autenticación y cifrado."
    escalera:
      - "¿Qué impide que otro lo controle o lea sus datos?"
    solucion: "Autenticación y cifrado."

  - id: toque-firmware
    tipo: tocar
    titulo: "Lo que faltó apuntar"
    texto: "Dos años después, el aparato falla y no sabe qué versión del programa lleva ni dónde está el código. Toque lo que faltó documentar."
    libro: [211, 212]
    widget:
      tipo: figura
      figura: fig-19.9
      zonas:
        - { id: esquema, rotulo: "Primer documento", rect: [11, 157, 82, 44] }
        - { id: materiales, rotulo: "Segundo documento", rect: [98, 157, 82, 44] }
        - { id: firmware, rotulo: "Tercer documento", rect: [185, 157, 82, 44] }
        - { id: prueba, rotulo: "Cuarto documento", rect: [271, 157, 82, 44] }
        - { id: instrucciones, rotulo: "Quinto documento", rect: [358, 157, 82, 44] }
    tocar:
      bien: [firmware]
      porque:
        esquema: "El esquema y la placa dicen el hardware, no qué programa lleva."
        materiales: "La lista de materiales dice qué comprar, no qué versión del programa hay."
        prueba: "El procedimiento de prueba dice cómo comprobarlo, no qué firmware tiene."
        instrucciones: "Las instrucciones son para usarlo y mantenerlo, no para saber su firmware."
    exito: "El firmware, con su versión y su código fuente."
    escalera:
      - "¿Qué documento guarda el programa?"
    solucion: "El tercer documento: firmware con su versión y su código fuente."

  - id: prediga-dos-anos
    tipo: predecir
    titulo: "Sin documentación"
    texto: "Un aparato hecho por uno mismo, sin documentación, funciona bien. ¿Qué pasará cuando haya que repararlo?"
    libro: [213]
    widget:
      tipo: figura
      figura: fig-19.9
      zonas:
        - { id: documentacion, rotulo: "Recuadro verde de abajo", rect: [4, 137, 443, 70] }
    opciones:
      - texto: "Será irreparable en cuanto pasen dos años"
        bien: true
        porque: "Aunque lo haya hecho uno mismo: lo que no se anotó se olvida."
      - texto: "Nada: quien lo hizo lo recordará"
        porque: "Es justo lo que no pasa: en dos años se ha olvidado lo que no se anotó."
      - texto: "Se reparará midiendo, sin más"
        porque: "Sin esquema, versión ni procedimiento, medir no basta para saber qué debía haber."
    escalera:
      - "¿Cuánto recuerda de un montaje de hace dos años?"
    solucion: "Irreparable en cuanto pasen dos años, aunque lo haya hecho uno mismo."

  - id: obligaciones
    tipo: pregunta
    titulo: "Si se cede"
    texto: "Un aparato de uso propio se va a ceder a otra persona. ¿Qué cambia?"
    libro: [215, 216]
    widget:
      tipo: figura
      figura: fig-19.9
      zonas:
        - { id: todo, rotulo: "Las decisiones y la documentación", rect: [4, 3, 443, 204] }
    opciones:
      - texto: "Aplican requisitos que no son opcionales: CE, compatibilidad, seguridad, RoHS"
        bien: true
        porque: "Para uso propio no aplican; al vender o ceder, sí: marcan la frontera con un producto."
      - texto: "Nada: solo aplican si se vende"
        porque: "El libro dice vender o ceder: también al cederlo."
      - texto: "Solo la garantía"
        porque: "Lo que aparece son requisitos legales: marcado CE, compatibilidad electromagnética, seguridad, RoHS y residuos."
    escalera:
      - "¿Dónde está la frontera entre proyecto personal y producto?"
    solucion: "Aplican el marcado CE, la compatibilidad electromagnética, la seguridad eléctrica, RoHS y los residuos."

  - id: porque-otro
    tipo: porque
    titulo: "La prueba más reveladora"
    texto: "Al validar un producto, la prueba más reveladora es dárselo a alguien que no lo haya diseñado. ¿Por qué?"
    libro: [219]
    widget:
      tipo: figura
      figura: fig-19.9
      zonas:
        - { id: todo, rotulo: "Las decisiones y la documentación", rect: [4, 3, 443, 204] }
    opciones:
      - texto: "Los fallos que aparecen son los que aparecerían en campo"
        bien: true
        porque: "Quien lo diseñó lo usa como lo pensó; otra persona lo usa como lo usará el mundo."
      - texto: "Porque es más barato que probarlo uno mismo"
        porque: "No es cuestión de coste: el diseñador no ve los usos que no imaginó."
      - texto: "Porque así no hace falta probar temperatura ni tensión"
        porque: "Esas pruebas siguen haciendo falta; esta descubre otra clase de fallos."
    escalera:
      - "¿Quién usa el aparato como no se previó?"
    solucion: "Los fallos que aparecen son exactamente los que aparecerían en campo."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [199, 205, 213, 219]
    ideas:
      - { titulo: "Alimentación.", texto: "De dónde viene, cuánto consume medido y qué pasa cuando falta." }
      - { titulo: "Caja y datos.", texto: "Material, aperturas, IP; protocolo seguro y actualización con vuelta atrás." }
      - { titulo: "Documentación.", texto: "Sin ella, irreparable en dos años." }
      - { titulo: "Validar.", texto: "En condiciones adversas, y en manos de otro." }
