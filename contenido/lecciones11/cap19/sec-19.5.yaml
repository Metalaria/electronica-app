# Lección 1.2 de la sección 18.5 «Repartir el Trabajo: MCU para el Tiempo Real, SBC para Todo lo Demás» (cap19;
# sec-19.N = impresas 18.N).
# - El reparto y los dos errores de la figura 18.5 (fig-19.6), con zonas.
# - Sin modelo de circuito: la sección es de arquitectura.
# Paso práctico: «tocar» en la figura 18.5 el error de una parada de emergencia que depende del ordenador.
leccion: cap19/sec-19.5

libro:
  90: "esa frontera bien trazada es lo que separa un sistema robusto de uno frágil"
  92: "Al microcontrolador, lo que no puede esperar; al ordenador, lo que no cabe en un microcontrolador."
  95: "Vigilancia de seguridad: límites, watchdog, parada de emergencia"
  97: "Actualizaciones y configuración."
  100: "desperdicia ancho de banda si los datos cambian poco"
  101: "exige que el ordenador esté escuchando siempre y que haya un mecanismo de confirmación"
  102: "el ordenador manda hacer algo y el microcontrolador confirma"
  103: "En un sistema real coexisten los tres"
  106: "con unidades y escalas fijadas por escrito"
  107: "el ordenador debe distinguir «sin datos» de «cero»"
  108: "¿pierde la configuración o la recupera del microcontrolador?"
  112: "Esa función va en el microcontrolador, siempre."
  113: "acaba con un firmware enorme, difícil de actualizar"
  114: "La frontera se traza por naturaleza de la tarea, no por conveniencia momentánea."
  116: "cada lado se puede desarrollar y probar por separado"
  117: "es imposible si la frontera es difusa"
  120: "Si algo se descontrola, hay una función en el lado equivocado."
  121: "El reparto entre microcontrolador y ordenador, y los dos errores al trazarlo."

modelo: { valores: {}, calculos: {} }

tarjetas:
  - id: explore-criterio
    tipo: explorar
    titulo: "El criterio, en una frase"
    texto: "Al microcontrolador, lo que no puede esperar; al ordenador, lo que no cabe en un microcontrolador. Toque cada lado y cada error."
    libro: [90, 92, 95, 97, 121]
    widget:
      tipo: figura
      figura: fig-19.6
      zonas:
        - { id: micro, rotulo: "Recuadro azul de arriba", rect: [4, 3, 218, 115], texto: "Muestreo exacto, señales con temporización estricta, lazos rápidos, seguridad y gestión de la alimentación." }
        - { id: ordenador, rotulo: "Recuadro morado de arriba", rect: [229, 3, 218, 115], texto: "Red, almacenamiento, interfaz, procesado pesado, actualizaciones y configuración." }
        - { id: error1, rotulo: "Recuadro rojo de la izquierda", rect: [4, 125, 218, 70], texto: "Primer error: poner la seguridad en el ordenador." }
        - { id: error2, rotulo: "Recuadro rojo de la derecha", rect: [229, 125, 218, 70], texto: "Segundo error: lógica compleja en el microcontrolador «porque ya está ahí»." }
    requiere: { mover: [micro, ordenador] }

  - id: empareje-patrones
    tipo: pregunta
    titulo: "Tres patrones"
    texto: "Según quién toma la iniciativa, hay tres patrones de comunicación. Empareje cada uno con cómo funciona."
    libro: [100, 101, 102, 103]
    widget:
      tipo: figura
      figura: fig-19.6
      zonas:
        - { id: todo, rotulo: "El reparto completo", rect: [4, 3, 443, 192] }
    emparejar:
      - ["Sondeo", "El ordenador pregunta periódicamente"]
      - ["Envío por evento", "El microcontrolador habla cuando tiene algo que decir"]
      - ["Órdenes y respuestas", "El ordenador manda hacer algo y el microcontrolador confirma"]
    exito: "En un sistema real coexisten los tres, separados en el protocolo para que no se confundan."
    pistas:
      - { texto: "El de actuar es el de mandar y confirmar." }
    escalera:
      - "¿En cuál de los tres toma la iniciativa el microcontrolador?"
    solucion: "Sondeo pregunta, evento avisa, órdenes y respuestas confirman."

  - id: sondeo
    tipo: pregunta
    titulo: "Datos que cambian poco"
    texto: "Una temperatura cambia muy despacio. ¿Qué patrón desperdicia ancho de banda con ella?"
    libro: [100, 101]
    widget:
      tipo: figura
      figura: fig-19.6
      zonas:
        - { id: todo, rotulo: "El reparto completo", rect: [4, 3, 443, 192] }
    opciones:
      - texto: "El sondeo"
        bien: true
        porque: "Preguntar periódicamente por algo que no cambia trae casi siempre la misma respuesta."
      - texto: "El envío por evento"
        porque: "Ese solo habla cuando hay algo que decir: es el eficiente aquí."
      - texto: "Órdenes y respuestas"
        porque: "Ese es para actuar, no para leer una magnitud."
    escalera:
      - "¿Cuál de ellos pregunta aunque no haya novedades?"
    solucion: "El sondeo."

  - id: toque-seguridad
    tipo: tocar
    titulo: "Una parada que no para"
    texto: "La parada de emergencia de una máquina depende de un programa que corre en el ordenador de placa. Toque el error."
    libro: [112, 113]
    widget:
      tipo: figura
      figura: fig-19.6
      zonas:
        - { id: micro, rotulo: "Recuadro azul de arriba", rect: [4, 3, 218, 115] }
        - { id: ordenador, rotulo: "Recuadro morado de arriba", rect: [229, 3, 218, 115] }
        - { id: error1, rotulo: "Recuadro rojo de la izquierda", rect: [4, 125, 218, 70] }
        - { id: error2, rotulo: "Recuadro rojo de la derecha", rect: [229, 125, 218, 70] }
    tocar:
      bien: [error1]
      porque:
        micro: "Ahí es donde debería estar la parada; el error es haberla sacado de ahí."
        ordenador: "Es el lado donde está mal puesta, pero se pide el error que lo describe."
        error2: "Ese es el contrario: lógica compleja metida en el microcontrolador."
    exito: "Si la parada depende de un sistema operativo, el sistema no es seguro: va en el microcontrolador, siempre."
    escalera:
      - "Busque el error que habla de seguridad."
    solucion: "El recuadro rojo de la izquierda: la seguridad en el ordenador."

  - id: sin-datos
    tipo: pregunta
    titulo: "Sin datos no es cero"
    texto: "El microcontrolador deja de responder. ¿Qué debe hacer el ordenador con la medida que esperaba?"
    libro: [106, 107]
    widget:
      tipo: figura
      figura: fig-19.6
      zonas:
        - { id: ordenador, rotulo: "Recuadro morado de arriba", rect: [229, 3, 218, 115] }
    opciones:
      - texto: "Marcarla como «sin datos», no como cero"
        bien: true
        porque: "Un cero es una medida; la ausencia de respuesta no lo es, y confundirlas engaña."
      - texto: "Guardar un cero"
        porque: "Un cero haría creer que se midió cero: hay que distinguir «sin datos» de «cero»."
      - texto: "Repetir el último valor"
        porque: "Repetirlo inventa una medida que no existe."
    escalera:
      - "¿Es lo mismo medir cero que no medir?"
    solucion: "Distinguir «sin datos» de «cero»."

  - id: estado
    tipo: pregunta
    titulo: "Quién guarda el estado"
    texto: "Para que un reinicio del ordenador no traiga sorpresas, ¿qué hay que haber decidido antes?"
    libro: [108]
    widget:
      tipo: figura
      figura: fig-19.6
      zonas:
        - { id: ordenador, rotulo: "Recuadro morado de arriba", rect: [229, 3, 218, 115] }
    opciones:
      - texto: "Si pierde la configuración o la recupera del microcontrolador"
        bien: true
        porque: "Una respuesta clara sobre quién guarda el estado evita comportamientos sorprendentes."
      - texto: "Qué color tiene el panel"
        porque: "La interfaz no decide nada aquí: se trata del estado del sistema."
      - texto: "Nada: el ordenador lo sabe todo"
        porque: "Tras un reinicio, el ordenador solo sabe lo que haya guardado o lo que le dé el otro."
    escalera:
      - "¿Dónde vive la configuración tras el reinicio?"
    solucion: "Decidir si pierde la configuración o la recupera del microcontrolador."

  - id: porque-separado
    tipo: porque
    titulo: "La ventaja que se olvida"
    texto: "Con la frontera bien definida, el firmware se prueba con un ordenador simulado y el software con un microcontrolador simulado. ¿Por qué acelera tanto?"
    libro: [116, 117]
    widget:
      tipo: figura
      figura: fig-19.6
      zonas:
        - { id: todo, rotulo: "El reparto completo", rect: [4, 3, 443, 192] }
    opciones:
      - texto: "Cada lado se desarrolla y prueba por separado"
        bien: true
        porque: "No hace falta tener el otro lado terminado: basta un sustituto que hable el protocolo."
      - texto: "Porque se necesita menos código"
        porque: "El código es el mismo; lo que cambia es que se puede probar cada mitad sola."
      - texto: "Porque los simuladores son más rápidos que el hardware"
        porque: "No es la velocidad del simulador: es poder trabajar en un lado sin esperar al otro."
    escalera:
      - "¿Qué hace falta para probar un lado si la frontera es difusa?"
    solucion: "Cada lado se desarrolla y prueba por separado; con frontera difusa es imposible."

  - id: prueba-reinicio
    tipo: predecir
    titulo: "La prueba del reparto"
    texto: "Se reinicia el ordenador con el sistema en marcha y un actuador se descontrola. ¿Qué indica?"
    libro: [114, 120]
    widget:
      tipo: figura
      figura: fig-19.6
      zonas:
        - { id: todo, rotulo: "El reparto completo", rect: [4, 3, 443, 192] }
    opciones:
      - texto: "Que hay una función en el lado equivocado"
        bien: true
        porque: "Algo que no puede esperar estaba en el ordenador: la frontera está mal trazada."
      - texto: "Que el microcontrolador está averiado"
        porque: "Si el reparto fuera bueno, el microcontrolador seguiría controlando: falla el reparto."
      - texto: "Nada: es normal durante un reinicio"
        porque: "No: el proceso debe seguir controlado mientras el ordenador vuelve."
    escalera:
      - "Si el control estuviera todo en el microcontrolador, ¿se descontrolaría?"
    solucion: "Hay una función en el lado equivocado."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [92, 103, 112, 116]
    ideas:
      - { titulo: "El criterio.", texto: "Al microcontrolador, lo que no puede esperar; al ordenador, lo que no cabe." }
      - { titulo: "Los patrones.", texto: "Sondeo, envío por evento y órdenes con respuesta, separados en el protocolo." }
      - { titulo: "Los errores.", texto: "La seguridad en el ordenador, o lógica compleja en el microcontrolador." }
      - { titulo: "La ventaja.", texto: "Cada lado se prueba por separado con el otro simulado." }
