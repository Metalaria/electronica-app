# Lección de la sección 11.2 «Los Símbolos Fundamentales» (cap11). Formato: contenido/lecciones11/GUIA.md.
# 1.2.1 (aprender haciendo, GUIA §13): se da la vuelta al diodo hasta que no conduce, se mide V_CE localizando el
# emisor por su flecha, se tocan en las figuras 11.3 y 11.4 la variante del diodo, la marca que destruye la pieza, la
# que invierte la fase y las alimentaciones ocultas del operacional. Dos preguntas: por qué el símbolo calla la
# potencia y las tres masas.
# Los símbolos se leen sobre esquemas del kit de la app. Valores de ejemplo (el libro no da números en la sección):
# diodo con 5 V y 1 kΩ (caída de 0,7 V del libro, sección 5.3); transistor NPN con 12 V, 1 kΩ de colector, 5 V por
# 100 kΩ en la base y β = 100; transformador de 230 V con 230 y 12 espiras y 12 Ω; resistencia de 100 Ω con la
# potencia de un cuarto de vatio y de cincuenta (los dos extremos del bloque 27).
# 1.2.1, segunda pasada: sin listas de respuestas disfrazadas; quedan las tarjetas que se hacen y dos preguntas.
leccion: cap11/sec-11.2

libro:
  27: "una resistencia de un cuarto de vatio y para una de cincuenta"
  35: "Sin polaridad, sin orientación obligatoria."
  36: "esa marca no es decorativa"
  37: "continuas para núcleo de hierro y discontinuas para ferrita"
  38: "los puntos de polaridad"
  40: "apunta en el sentido de la corriente directa"
  41: "su sentido distingue NPN de PNP"
  42: "el diodo de cuerpo"
  43: "se omiten con frecuencia"
  45: "no son intercambiables"
  49: "La potencia"
  50: "no es suficiente para construir el circuito"
  54: "Símbolos esquemáticos fundamentales"
  55: "lo que no dicen y las marcas que no son decorativas"

modelo:
  valores:
    V_d: { sim: "V", nombre: "tensión de la pila", unidad: V, valor: 5 }
    R_d: { sim: "R", nombre: "resistencia en serie", unidad: Ω, valor: 1000 }
    V_D: { sim: "V_{D}", nombre: "caída del diodo", unidad: V, valor: 0.7 }
    rev: { tipo: interruptor, nombre: "diodo al revés", valor: 0 }
    V_cc: { sim: "V_{CC}", nombre: "alimentación", unidad: V, valor: 12 }
    R_c: { sim: "R_{C}", nombre: "resistencia de colector", unidad: Ω, valor: 1000 }
    V_b: { sim: "V_{entrada}", nombre: "tensión de mando", unidad: V, valor: 5 }
    R_b: { sim: "R_{B}", nombre: "resistencia de base", unidad: Ω, valor: 100000 }
    beta: { sim: "β", nombre: "ganancia de corriente", unidad: "", valor: 100 }
    V_BE: { sim: "V_{BE}", nombre: "tensión base-emisor", unidad: V, valor: 0.7 }
    V_CEs: { sim: "V_{CE(sat)}", nombre: "tensión de saturación", unidad: V, valor: 0.2 }
    V_1: { sim: "V₁", nombre: "tensión del primario", unidad: V, valor: 230 }
    N_1: { sim: "N₁", nombre: "espiras del primario", unidad: "", valor: 230 }
    N_2: { sim: "N₂", nombre: "espiras del secundario", unidad: "", valor: 12 }
    R_t: { sim: "R_{L}", nombre: "carga del secundario", unidad: Ω, valor: 12 }
    P_n: { sim: "P", nombre: "potencia de la resistencia", unidad: W, valor: 0.25 }
    R_p: { sim: "R", nombre: "resistencia", unidad: Ω, valor: 100 }
  calculos:
    I_dc: { expr: "(1 - rev)*max(0, (V_d - V_D)/R_d)", sim: "I_{D}", nombre: "corriente del diodo", unidad: A }
    V_dc: { expr: "V_d - I_dc*R_d", sim: "V_{D}", nombre: "tensión del diodo", unidad: V }
    I_B: { expr: "max(0, (V_b - V_BE)/R_b)", sim: "I_{B}", nombre: "corriente de base", unidad: A }
    I_C: { expr: "min(beta*I_B, (V_cc - V_CEs)/R_c)", sim: "I_{C}", nombre: "corriente de colector", unidad: A }
    V_CE: { expr: "V_cc - I_C*R_c", sim: "V_{CE}", nombre: "tensión colector-emisor", unidad: V }
    V_2: { expr: "V_1*N_2/N_1", sim: "V₂", nombre: "tensión del secundario", unidad: V }
    I_2: { expr: "V_2/R_t", sim: "I₂", nombre: "corriente del secundario", unidad: A }
    I_1: { expr: "I_2*N_2/N_1", sim: "I₁", nombre: "corriente del primario", unidad: A }
    V_p: { expr: "sqrt(P_n*R_p)", sim: "V", nombre: "tensión aplicada", unidad: V }
    I_p: { expr: "V_p/R_p", sim: "I", nombre: "corriente", unidad: A }

tarjetas:
  - id: explore-diodo
    tipo: explorar
    titulo: "El triángulo señala el camino"
    texto: "El triángulo del diodo apunta en el sentido de la corriente directa. Colóquelo de forma que no pase corriente."
    nota: "Valores de ejemplo."
    libro: [40]
    inicio: { rev: 0 }
    widget:
      tipo: circuito
      esquema: diodo
      piezas: { fuente: V_d, r: R_d, vd: V_D, reves: rev }
      lectura: { valor: I_dc, rotulo: "Corriente del diodo" }
      corriente: I_dc
      mide: { corriente: I_dc, vd: V_dc }
      mandos:
        - { valor: rev, tipo: interruptor, rotulo: "Diodo al revés" }
    objetivo:
      condiciones:
        - { valor: I_dc, max: 0.000001, rotulo: "Corriente: {{I_dc}}" }
      logrado: "Con el triángulo contra la corriente, el diodo bloquea: el símbolo dice solo por dónde conduce."
      pistas:
        - { texto: "El triángulo apunta hacia donde va la corriente: dele la vuelta." }
    escalera:
      - "Ahora el triángulo apunta a favor de la corriente."
    solucion: "Diodo al revés: la corriente cae a cero."
    comprobar:
      - { con: { rev: 1 }, I_dc: 0 }

  - id: prediga-npn
    tipo: medir
    titulo: "La flecha marca el emisor"
    texto: "En el transistor, la flecha va en el emisor. Mida la tensión entre colector y emisor: la negra, en el emisor."
    nota: "Valores de ejemplo."
    libro: [41]
    widget:
      tipo: circuito
      esquema: bjt-interruptor
      piezas: { vcc: V_cc, rc: R_c, entrada: V_b, rb: R_b, beta: beta, vbe: V_BE, vcesat: V_CEs }
      corriente: I_C
      mide: { ib: I_B, ic: I_C, vce: V_CE }
      instrumento: { tipo: multimetro, modos: [V], puntos: [vcc, b, c, "0"] }
      mandos: []
    medir:
      magnitud: tension
      entre: [c, "0"]
      polaridad: true
      porque:
        b: "Esa es la base, la patilla de la izquierda, sin flecha."
        vcc: "Esa es la alimentación, por encima de la resistencia de colector."
        "0/c": "Las puntas van al revés: la negra va en el emisor, el de la flecha, unido a masa."
    exito: "El emisor es la patilla con flecha, unida a masa. Su flecha sale: en el NPN «no apunta hacia dentro»."
    escalera:
      - "La flecha está en la patilla de abajo, unida a masa."
    solucion: "Roja en el colector, negra en masa, donde está el emisor."
    comprobar:
      - { V_CE: 7.7 }

  - id: variantes-diodo
    tipo: tocar
    titulo: "La barra cambia"
    texto: "Las variantes del diodo modifican la barra. Toque la que tiene los extremos doblados en Z."
    libro: [40, 54]
    widget:
      tipo: figura
      figura: fig-11.3
      zonas:
        - { id: diodo, rotulo: "Primero de la segunda fila", rect: [10, 92, 70, 58] }
        - { id: zener, rotulo: "Segundo de la segunda fila", rect: [100, 92, 70, 58] }
        - { id: led, rotulo: "Tercero de la segunda fila", rect: [190, 88, 70, 62] }
    tocar:
      bien: [zener]
      porque:
        diodo: "Es el diodo normal: triángulo con barra recta."
        led: "Su barra es recta; lo que añade son las flechas salientes de la luz."
    exito: "El Zener dobla la barra en Z; el Schottky, en S; el LED añade flechas salientes."
    escalera:
      - "Mire los extremos de la barra de cada diodo."
    solucion: "El segundo: el diodo Zener."

  - id: pasivos
    tipo: tocar
    titulo: "Una marca que no es decorativa"
    texto: "Montar esta pieza al revés la destruye, y su símbolo lo avisa. Tóquela."
    libro: [35, 36, 54]
    widget:
      tipo: figura
      figura: fig-11.3
      zonas:
        - { id: r-iec, rotulo: "Primero de la primera fila", rect: [10, 14, 70, 56] }
        - { id: r-ansi, rotulo: "Segundo de la primera fila", rect: [100, 14, 70, 56] }
        - { id: cond, rotulo: "Tercero de la primera fila", rect: [190, 14, 70, 56] }
        - { id: polar, rotulo: "Cuarto de la primera fila", rect: [282, 14, 70, 60] }
        - { id: bobina, rotulo: "Quinto de la primera fila", rect: [372, 14, 70, 56] }
    tocar:
      bien: [polar]
      porque:
        r-iec: "Una resistencia no tiene polaridad ni orientación obligatoria."
        r-ansi: "La misma resistencia, en zigzag: sin polaridad."
        cond: "Dos líneas paralelas: un condensador no polarizado, se monta en cualquier sentido."
        bobina: "Las espiras no llevan polaridad; las líneas de núcleo dirían de qué es."
    exito: "La placa curva o el signo más marcan el electrolítico o el tántalo: al revés se destruye."
    escalera:
      - "Busque una placa curva o un signo más."
    solucion: "El cuarto: el condensador polarizado."

  - id: activos
    tipo: tocar
    titulo: "Están, aunque no se vean"
    texto: "En muchos esquemas el operacional sale sin alimentaciones. En este se dibujan a trazos: toque las dos."
    libro: [43, 55]
    widget:
      tipo: figura
      figura: fig-11.4
      zonas:
        - { id: masv, rotulo: "Trazo de arriba del triángulo", rect: [374, 0, 36, 36] }
        - { id: menosv, rotulo: "Trazo de abajo del triángulo", rect: [374, 44, 36, 36] }
        - { id: inversora, rotulo: "Entrada de arriba", rect: [326, 16, 46, 36] }
        - { id: salida, rotulo: "Salida, a la derecha", rect: [410, 14, 40, 36] }
    tocar:
      bien: [masv, menosv]
      todas: true
      porque:
        inversora: "Es la entrada inversora, marcada con «−»: una señal, no una alimentación."
        salida: "Es la salida del operacional."
    exito: "+V y −V: se omiten para no ensuciar el dibujo, una convención cómoda y una trampa para quien empieza."
    escalera:
      - "Busque las líneas a trazos que salen por arriba y por abajo."
    solucion: "Los dos trazos verticales: +V arriba y −V abajo."

  - id: sorpresa-potencia
    tipo: sorpresa
    titulo: "El mismo rectángulo"
    texto: "Pase la resistencia de un cuarto de vatio a cincuenta, doscientas veces más, y mire el símbolo."
    nota: "Valores de ejemplo."
    libro: [27]
    inicio: { P_n: 0.25 }
    widget:
      tipo: circuito
      esquema: resistencia
      piezas: { fuente: V_p, r: R_p }
      lectura: { valor: P_n, rotulo: "Potencia" }
      corriente: I_p
      mide: { corriente: I_p, tension: V_p }
      mandos:
        - { valor: P_n, lista: [0.25, 50], rotulo: "Potencia de la resistencia" }
    objetivo:
      condiciones:
        - { valor: P_n, min: 50, rotulo: "Resistencia de cincuenta vatios" }
      logrado: "Doscientas veces más potencia y el símbolo es idéntico: dice qué hace la pieza, no cómo es."
      pistas:
        - { texto: "Elija la potencia mayor en el mando." }
    escalera:
      - "El mando de debajo cambia la potencia."
    solucion: "Con 50 W, el mismo rectángulo."
    comprobar:
      - { con: { P_n: 50 }, P_n: 50 }

  - id: por-que-no-avisa
    tipo: porque
    titulo: "¿Por qué no cambia?"
    texto: "Doscientas veces más potencia y el símbolo es idéntico. ¿Por qué?"
    libro: [27, 49, 50]
    widget:
      tipo: circuito
      esquema: resistencia
      piezas: { fuente: V_p, r: R_p }
      lectura: { valor: P_n, rotulo: "Potencia" }
      corriente: I_p
      mide: { corriente: I_p, tension: V_p }
      mandos: []
    opciones:
      - texto: "El símbolo dice qué hace la pieza; la potencia va en las anotaciones"
        bien: true
        porque: "Es una abstracción funcional. Potencia, tensión, encapsulado y tolerancia hay que buscarlos en las anotaciones y en la lista de materiales."
      - texto: "Porque la potencia no importa en un esquema"
        porque: "Importa tanto que sin ella no se puede construir el circuito: por eso se anota."
      - texto: "Porque se deduce del tamaño del dibujo"
        porque: "El tamaño del símbolo no dice nada: el mismo vale para un cuarto de vatio y para cincuenta."
    escalera:
      - "Un símbolo representa el comportamiento, no el aspecto ni el encapsulado."
    solucion: "El símbolo es funcional: la potencia va escrita junto a él."
    comprobar:
      - { con: { P_n: 50 }, P_n: 50 }

  - id: masas
    tipo: pregunta
    titulo: "Tres masas distintas"
    texto: "Masa de señal, masa de chasis y tierra de protección. ¿Se puede dibujar una por otra?"
    libro: [45, 55]
    widget:
      tipo: figura
      figura: fig-11.4
      zonas:
        - { id: masas, rotulo: "Fila de abajo", rect: [0, 180, 453, 41] }
    opciones:
      - texto: "No: son tres cosas distintas"
        bien: true
        porque: "Confundirlas en el dibujo lleva a confundirlas en el montaje."
      - texto: "Sí: todas son la misma referencia"
        porque: "No son intercambiables: la de chasis va a la caja y la de protección al conductor de protección de la red."
      - texto: "Solo en equipos de red"
        porque: "La distinción vale siempre: cada símbolo es una red distinta."
    escalera:
      - "Piense en a qué se une cada una: el circuito, la caja, la red."
    solucion: "No: señal, chasis y protección son redes distintas."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [27, 36, 40, 42, 50, 37, 38]
    ideas:
      - { titulo: "Qué hace, no cómo es.", texto: "El mismo símbolo vale para un cuarto de vatio y para cincuenta." }
      - { titulo: "Marcas que importan.", texto: "Polaridad del electrolítico, núcleo, puntos del transformador, flecha del emisor." }
      - { titulo: "Lo que no se ve.", texto: "Alimentaciones del operacional y diodo de cuerpo: están." }
      - { titulo: "No basta.", texto: "Potencia, tensión, encapsulado y tolerancia van en las anotaciones." }
