# Lección de la sección 11.3 «Designadores de Referencia» (cap11). Formato: contenido/lecciones11/GUIA.md.
# 1.2.1 (aprender haciendo): ajustar Q1 leyendo junto a cada designador, tocar funciones en la figura 11.5, tocar
# Q1 en el esquema, buscar condensadores y bloques en listados, medir y anotar con designador. Dos preguntas: R7 y DNP.
# El esquema que se lee es la etapa en emisor común del libro (sección 6.5: 12 V, R₁ = 47 kΩ, R₂ = 10 kΩ,
# R_C = 3,3 kΩ, R_E = 1 kΩ, β = 150), con designadores por orden de lectura: R1 y R2 el divisor, R3 el colector,
# R4 el emisor. Esa numeración es mía (el libro la llama R₁, R₂, R_C, R_E).
# 1.2.1, segunda pasada: sin listas de respuestas disfrazadas; quedan las tarjetas que se hacen y dos preguntas.
leccion: cap11/sec-11.3

libro:
  58: "R1, C7, U3"
  59: "Referirse a él sin ambigüedad"
  60: "Enlazar el esquema con la placa"
  61: "Enlazar con la lista de materiales"
  62: "hace irreparable un aparato sin documentación"
  64: "IEEE 315 / ASME Y14.44"
  65: "Circuito integrado"
  66: "para relés"
  69: "Por orden de lectura"
  70: "R1xx para la fuente, R2xx para la entrada, R3xx para la salida"
  71: "saber que C304 está en la etapa de salida"
  73: "Los designadores no se reutilizan"
  74: "una reanotación automática que renumere todo"
  76: "la lista indica DNP"
  77: "conserva la trazabilidad entre versiones"
  79: "anotar cada lectura junto al designador"
  80: "R14 en circuito: 980 Ω, marcada 1 kΩ"
  81: "Las tres funciones de un designador"
  "cap11#306": "En un esquema ves el designador «Q3»"
  "cap06#452": "R₁ = 47 kΩ, R₂ = 10 kΩ, RE = 1 kΩ, RC = 3,3 kΩ"
  "cap06#184": "Con β = 150 el punto Q está en 1,324 mA y 6,31 V."

modelo:
  valores:
    V_cc: { sim: "V_{CC}", nombre: "alimentación", unidad: V, valor: 12 }
    R_p1: { sim: "R1", nombre: "divisor, arriba", unidad: Ω, valor: 47000 }
    R_p2: { sim: "R2", nombre: "divisor, abajo", unidad: Ω, valor: 10000 }
    R_pc: { sim: "R3", nombre: "resistencia de colector", unidad: Ω, valor: 3300 }
    R_pe: { sim: "R4", nombre: "resistencia de emisor", unidad: Ω, valor: 1000 }
    beta: { sim: "β", nombre: "ganancia de corriente de Q1", unidad: "", valor: 150 }
    V_BE: { sim: "V_{BE}", nombre: "tensión base-emisor", unidad: V, valor: 0.7 }
  calculos:
    V_pth: { expr: "V_cc*R_p2/(R_p1 + R_p2)", sim: "V_{Th}", nombre: "tensión Thévenin del divisor", unidad: V }
    R_pth: { expr: "par(R_p1, R_p2)", sim: "R_{Th}", nombre: "resistencia Thévenin del divisor", unidad: Ω }
    I_pb: { expr: "(V_pth - V_BE)/(R_pth + (beta + 1)*R_pe)", sim: "I_{B}", nombre: "corriente de base", unidad: A }
    I_pc: { expr: "beta*I_pb", sim: "I_{C}", nombre: "corriente de colector", unidad: A, cifras: 4 }
    V_pe: { expr: "(beta + 1)*I_pb*R_pe", sim: "V_{E}", nombre: "tensión de emisor", unidad: V }
    V_pb: { expr: "V_pe + V_BE", sim: "V_{B}", nombre: "tensión de base", unidad: V }
    V_pc: { expr: "V_cc - I_pc*R_pc", sim: "V_{C}", nombre: "tensión de colector", unidad: V }
    V_pce: { expr: "V_pc - V_pe", sim: "V_{CE}", nombre: "tensión colector-emisor", unidad: V }

tarjetas:
  - id: explore-designadores
    tipo: explorar
    titulo: "Cada lectura, con su designador"
    texto: "El libro da 6,31 V entre colector y emisor con β = 150. Cambie el ejemplar de Q1 hasta leerlo junto a su designador."
    nota: "La etapa en emisor común del libro, numerada por orden de lectura."
    libro: [58, 69, 79, "cap06#452", "cap06#184"]
    inicio: { beta: 50 }
    widget:
      tipo: circuito
      esquema: bjt-polarizacion
      piezas: { vcc: V_cc, r1: R_p1, r2: R_p2, rc: R_pc, re: R_pe, beta: beta, vbe: V_BE }
      lectura: { valor: I_pc, rotulo: "Corriente de Q1" }
      datos:
        - { valor: V_pb, rotulo: "Unión de R1 y R2: {{V_pb}}" }
        - { valor: V_pce, rotulo: "Q1, colector-emisor: {{V_pce}}" }
        - { valor: V_pe, rotulo: "Sobre R4: {{V_pe}}" }
      corriente: I_pc
      mide: { ib: I_pb, ic: I_pc, vb: V_pb, ve: V_pe, vc: V_pc, vce: V_pce }
      mandos:
        - { valor: beta, lista: [50, 100, 150, 300], rotulo: "β de Q1" }
    objetivo:
      condiciones:
        - { valor: V_pce, objetivo: 6.31, tol: 0.02, rotulo: "Q1: {{V_pce}}" }
      logrado: "Q1 con β = 150: {{V_pce}} y {{I_pc}}. Leído junto a «Q1», el dato no se confunde con ningún otro."
      pistas:
        - { cuando: { valor: V_pce, menor: 6.18 }, texto: "Demasiada corriente: pruebe un ejemplar de β menor." }
        - { texto: "Falta corriente: pruebe un ejemplar de β mayor." }
    escalera:
      - "El libro da ese punto con β = 150."
    solucion: "β = 150: 1,324 mA y 6,31 V."
    comprobar:
      - { con: { beta: 150 }, V_pce: 6.31, I_pc: 0.001324 }

  - id: tres-funciones
    tipo: tocar
    titulo: "Del papel a la placa"
    texto: "Ha identificado una pieza en el esquema y la busca en la placa. Toque la función del designador que lo permite."
    libro: [59, 60, 61, 81]
    widget:
      tipo: figura
      figura: fig-11.5
      zonas:
        - { id: ambig, rotulo: "Recuadro de arriba", rect: [20, 4, 212, 46] }
        - { id: placa, rotulo: "Recuadro de abajo a la izquierda", rect: [2, 158, 120, 56] }
        - { id: lista, rotulo: "Recuadro de abajo a la derecha", rect: [130, 158, 122, 56] }
    tocar:
      bien: [placa]
      porque:
        ambig: "Referirse sin ambigüedad sirve en el texto y en el diagnóstico; en la placa lo encuentra la serigrafía."
        lista: "La lista de materiales da valor, encapsulado y referencia, no el sitio en la placa."
    exito: "La serigrafía lleva el mismo designador: así se localiza en la placa lo identificado en el papel."
    escalera:
      - "¿Qué está impreso en la placa junto a cada pieza?"
    solucion: "Esquema ↔ placa: la serigrafía."

  - id: toque-bom
    tipo: tocar
    titulo: "Para comprarla"
    texto: "Necesita la referencia comprable y el encapsulado de R14. Toque la función del designador que lo da."
    libro: [61, 62, 81]
    widget:
      tipo: figura
      figura: fig-11.5
      zonas:
        - { id: ambig, rotulo: "Recuadro de arriba", rect: [20, 4, 212, 46] }
        - { id: placa, rotulo: "Recuadro de abajo a la izquierda", rect: [2, 158, 120, 56] }
        - { id: lista, rotulo: "Recuadro de abajo a la derecha", rect: [130, 158, 122, 56] }
    tocar:
      bien: [lista]
      porque:
        ambig: "Nombrarla sin ambigüedad no dice qué comprar."
        placa: "La serigrafía dice dónde está, no qué encapsulado lleva."
    exito: "En la lista de materiales, cada designador tiene su valor, su encapsulado y su referencia comprable."
    escalera:
      - "¿Qué documento dice qué pieza comprar?"
    solucion: "Esquema ↔ lista de materiales."

  - id: letras-uno
    tipo: elegir
    titulo: "Q1 en el esquema"
    texto: "La lista de materiales nombra Q1. Toque en el esquema la pieza que es."
    libro: [64, 65]
    widget:
      tipo: circuito
      esquema: bjt-polarizacion
      piezas: { vcc: V_cc, r1: R_p1, r2: R_p2, rc: R_pc, re: R_pe, beta: beta, vbe: V_BE }
      corriente: I_pc
      mide: { ib: I_pb, ic: I_pc, vb: V_pb, ve: V_pe, vc: V_pc, vce: V_pce }
      mandos: []
    elegir:
      zonas: [r1, r2, rc, re, transistor]
      bien: [transistor]
      porque:
        r1: "Es una resistencia: llevaría una R."
        r2: "Es una resistencia: llevaría una R."
        rc: "Es una resistencia: llevaría una R."
        re: "Es una resistencia: llevaría una R."
    exito: "Q es el transistor; U o IC, el integrado; L, la bobina."
    escalera:
      - "Q no es de «quartz»: el cristal es la Y."
    solucion: "El transistor."

  - id: r7-eliminada
    tipo: pregunta
    titulo: "Se elimina R7"
    texto: "En una revisión se quita R7 y se añade una resistencia nueva. ¿Qué designador lleva la nueva?"
    libro: [73, 74]
    widget:
      tipo: circuito
      esquema: bjt-polarizacion
      piezas: { vcc: V_cc, r1: R_p1, r2: R_p2, rc: R_pc, re: R_pe, beta: beta, vbe: V_BE }
      lectura: { valor: I_pc, rotulo: "Corriente de Q1" }
      corriente: I_pc
      mide: { ib: I_pb, ic: I_pc, vb: V_pb, ve: V_pe, vc: V_pc, vce: V_pce }
      mandos: []
    opciones:
      - texto: "Uno nuevo, sin usar; R7 queda libre"
        bien: true
        porque: "Los designadores no se reutilizan: documentos, listas y notas antiguas seguirían refiriéndose a R7."
      - texto: "R7, que ha quedado libre"
        porque: "Reutilizarlo haría que las notas antiguas sobre R7 hablaran de otra pieza."
      - texto: "Se renumeran todas para no dejar huecos"
        porque: "Renumerar todo deja inservible cualquier documentación previa."
    exito: "R7 queda libre para siempre. Y anotar solo lo nuevo: renumerar todo deja inservible la documentación previa."
    escalera:
      - "Piense en las notas antiguas que nombran a R7."
    solucion: "Un designador nuevo; R7 no se asigna a otra pieza."

  - id: dnp
    tipo: pregunta
    titulo: "Una posición sin montar"
    texto: "Una pieza no se monta en una de las versiones de la placa. ¿Qué se hace con ella en el esquema?"
    libro: [76, 77]
    widget:
      tipo: circuito
      esquema: bjt-polarizacion
      piezas: { vcc: V_cc, r1: R_p1, r2: R_p2, rc: R_pc, re: R_pe, beta: beta, vbe: V_BE }
      lectura: { valor: I_pc, rotulo: "Corriente de Q1" }
      corriente: I_pc
      mide: { ib: I_pb, ic: I_pc, vb: V_pb, ve: V_pe, vc: V_pc, vce: V_pce }
      mandos: []
    opciones:
      - texto: "Se deja con su designador y la lista indica DNP"
        bien: true
        porque: "Conserva la trazabilidad entre versiones y explica las almohadillas vacías de la placa."
      - texto: "Se borra del esquema"
        porque: "Se pierde la trazabilidad y nadie sabe por qué hay almohadillas vacías."
      - texto: "Se le da un designador especial"
        porque: "El designador se mantiene; lo que cambia es la marca DNP en la lista."
    escalera:
      - "DNP: «do not populate»."
    solucion: "Mismo designador, marcado DNP en la lista."

  - id: anote-lectura
    tipo: medir
    titulo: "Una nota que sirva"
    texto: "Va a anotar en el cuaderno la tensión sobre R4, la resistencia de emisor. Ponga las puntas donde la mide."
    libro: [79, 80]
    widget:
      tipo: circuito
      esquema: bjt-polarizacion
      piezas: { vcc: V_cc, r1: R_p1, r2: R_p2, rc: R_pc, re: R_pe, beta: beta, vbe: V_BE }
      corriente: I_pc
      mide: { ib: I_pb, ic: I_pc, vb: V_pb, ve: V_pe, vc: V_pc, vce: V_pce }
      instrumento: { tipo: multimetro, modos: [V], puntos: [vcc, b, c, e, "0"] }
      mandos: []
    medir:
      magnitud: tension
      entre: [e, "0"]
      valor: V_pe
      porque:
        b: "Esa es la base: mide la unión de R1 y R2, no R4."
        c: "Ese es el colector: la tensión de R3 y Q1."
        vcc: "Esa es la alimentación, arriba del todo."
        "c/e": "Así mide Q1, colector-emisor; R4 va del emisor a masa."
    exito: "«R4: {{V_pe}}» es un dato reutilizable dentro de seis meses; «la de abajo mide bien», no."
    escalera:
      - "R4 va del emisor a masa."
    solucion: "Roja en el emisor, negra en masa."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [59, 65, 73, 79, 66, 70, 71, "cap11#306"]
    ideas:
      - { titulo: "Tres funciones.", texto: "Referirse a la pieza, enlazar con la placa y con la BOM." }
      - { titulo: "Letras.", texto: "R, C, L, D, Q, U, J, SW, F, Y, TP, K." }
      - { titulo: "Numeración.", texto: "Por orden de lectura o por bloque; los designadores no se reutilizan." }
      - { titulo: "En el banco.", texto: "Cada lectura, junto a su designador." }
