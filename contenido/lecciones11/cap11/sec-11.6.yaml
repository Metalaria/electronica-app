# Lección de la sección 11.6 «Nudos, Etiquetas de Red y Símbolos de Alimentación» (cap11). Formato: GUIA.md.
# El esquema es el divisor del libro con su carga (sección 1.4: 12 V, 10 kΩ y 5 kΩ; 4,00 V en vacío y 3,00 V con
# 10 kΩ conectados). El interruptor de la carga hace de punto de unión (explorar) y de etiqueta de red bien o mal
# escrita (sorpresa): con él abierto, la carga cruza el nodo sin conectarse. 1.2.1 (aprender haciendo): objetivos
# sobre el punto y la etiqueta, tocar en la figura 11.8 la unión de cuatro, las que conectan y la etiqueta culpable,
# los raíles MOS y la tierra de protección; el bus se calcula. Dos preguntas: el error invisible y la masa a red.
# 1.2.1, segunda pasada: sin listas de respuestas disfrazadas; quedan las tarjetas que se hacen y dos preguntas.
leccion: cap11/sec-11.6

libro:
  160: "Puntos, cruces y uniones de cuatro líneas"
  "cap11#55": "Símbolos fundamentales, lo que no dicen"
  141: "un punto grueso indica conexión; su ausencia, cruce sin contacto"
  142: "arco de salto"
  144: "dos puntos con el mismo nombre están conectados"
  146: "una etiqueta mal escrita crea una red nueva"
  147: "Una red con un solo nodo es casi siempre una etiqueta mal escrita."
  149: "todos los símbolos de VCC del esquema están conectados entre sí"
  150: "VCC es la alimentación de los colectores"
  152: "Masa de chasis, unida a la caja metálica"
  154: "puede estar a la tensión de red"
  156: "D[0..7]"
  157: "un número mal puesto conecta la línea equivocada"
  "cap01#103": "4,00 V en vacío y 3,00 V con 10 kΩ conectados"

modelo:
  valores:
    V_in: { sim: "V_{entrada}", nombre: "tensión de la pila", unidad: V, valor: 12 }
    R_1: { sim: "R₁", nombre: "resistencia de arriba", unidad: Ω, valor: 10000 }
    R_2: { sim: "R₂", nombre: "resistencia de abajo", unidad: Ω, valor: 5000 }
    R_L: { sim: "R_{L}", nombre: "carga", unidad: Ω, valor: 10000 }
    carga: { tipo: interruptor, sim: "SALIDA", nombre: "carga unida al nodo de salida", valor: 1 }
    et2: { sim: "SALIDA_", nombre: "etiqueta mal escrita", unidad: "", valor: 0 }
    b_hi: { sim: "último", nombre: "índice de la última línea del bus", unidad: "", valor: 7 }
  calculos:
    R_ab: { si: carga, entonces: "par(R_2, R_L)", sino: "R_2", sim: "R_{abajo}", nombre: "resistencia de la rama de abajo", unidad: Ω }
    V_out: { expr: "V_in*R_ab/(R_1 + R_ab)", sim: "V_{salida}", nombre: "tensión de salida", unidad: V }
    I: { expr: "V_in/(R_1 + R_ab)", sim: "I", nombre: "corriente", unidad: A }
    I_L: { si: carga, entonces: "V_out/R_L", sino: "0", sim: "I_{L}", nombre: "corriente de la carga", unidad: A }
    n_bus: { expr: "b_hi + 1", sim: "líneas", nombre: "líneas del bus", unidad: "" }

tarjetas:
  - id: explore-punto
    tipo: explorar
    titulo: "El punto decide"
    texto: "La línea de la carga cruza la salida. Quite el punto de unión del cruce hasta que la carga no reciba corriente."
    libro: [141, "cap01#103"]
    widget:
      tipo: circuito
      esquema: divisor
      piezas: { fuente: V_in, arriba: R_1, abajo: R_2, carga: R_L, union: carga }
      lectura: { valor: V_out, rotulo: "Tensión de salida" }
      datos:
        - { valor: I_L, rotulo: "Corriente de la carga: {{I_L}}" }
      corriente: I
      mide: { salida: V_out, corriente: I, carga: I_L }
      mandos:
        - { valor: carga, tipo: interruptor, rotulo: "Punto de unión en el cruce" }
    objetivo:
      condiciones:
        - { valor: I_L, max: 0.0000001, rotulo: "Carga: {{I_L}}" }
      logrado: "Sin punto, la línea cruza sin contacto: la carga no recibe nada y la salida vuelve a {{V_out}}."
      pistas:
        - { texto: "Quite el punto de unión del cruce." }
    escalera:
      - "Un punto grueso indica conexión; su ausencia, cruce sin contacto."
    solucion: "Sin punto: la carga queda fuera y la salida sube a 4,00 V."
    comprobar:
      - { con: { carga: 0 }, V_out: 4, I_L: 0 }

  - id: prediga-cuatro
    tipo: tocar
    titulo: "Uniones de cuatro líneas"
    texto: "Un borrón de impresión o una fotocopia mediocre puede hacer aparecer o desaparecer un punto. Toque la unión que eso vuelve ambigua."
    libro: [141, 160]
    widget:
      tipo: figura
      figura: fig-11.8
      zonas:
        - { id: cruce, rotulo: "Primer dibujo, a la izquierda", rect: [28, 4, 60, 56] }
        - { id: t, rotulo: "Segundo dibujo", rect: [138, 4, 60, 56] }
        - { id: cuatro, rotulo: "Tercer dibujo", rect: [254, 4, 60, 56] }
        - { id: dost, rotulo: "Cuarto dibujo, a la derecha", rect: [366, 4, 60, 56] }
    tocar:
      bien: [cuatro]
      porque:
        cruce: "Sin punto ni unión en T: un borrón no lo confunde con una conexión de tres."
        t: "Una unión en T no deja dudas: tres líneas solo pueden estar unidas."
        dost: "Esa es la solución: dos uniones de tres líneas, inequívocas."
    exito: "En la de cuatro, perder el punto la convierte en un cruce. Por eso las herramientas la desplazan a dos uniones en T."
    escalera:
      - "¿Dónde decide todo un único punto?"
    solucion: "La unión de cuatro líneas."

  - id: cruces
    tipo: tocar
    titulo: "¿Dónde hay conexión?"
    texto: "Toque todos los dibujos en los que las líneas sí están conectadas."
    libro: [141, 142, 160]
    widget:
      tipo: figura
      figura: fig-11.8
      zonas:
        - { id: cruce, rotulo: "Primer dibujo, a la izquierda", rect: [28, 4, 60, 56] }
        - { id: t, rotulo: "Segundo dibujo", rect: [138, 4, 60, 56] }
        - { id: cuatro, rotulo: "Tercer dibujo", rect: [254, 4, 60, 56] }
        - { id: dost, rotulo: "Cuarto dibujo, a la derecha", rect: [366, 4, 60, 56] }
    tocar:
      bien: [t, cuatro, dost]
      todas: true
      porque:
        cruce: "Sin punto, cruce sin contacto. El arco de salto de los esquemas antiguos dice lo mismo."
    exito: "El punto grueso indica conexión. La de cuatro también conecta, pero se evita: el punto se puede perder."
    escalera:
      - "Busque los puntos gruesos."
    solucion: "La unión en T, la de cuatro y las dos uniones en T."

  - id: sorpresa-etiqueta
    tipo: sorpresa
    titulo: "Una letra de más"
    texto: "Ahora la carga se une por una etiqueta de red. Escríbala mal en uno de los dos sitios, de forma que la carga quede suelta."
    libro: [144, 146]
    inicio: { carga: 1 }
    widget:
      tipo: circuito
      esquema: divisor
      piezas: { fuente: V_in, arriba: R_1, abajo: R_2, carga: R_L, etiqueta: carga, etiqueta2: et2 }
      lectura: { valor: V_out, rotulo: "Tensión de salida" }
      datos:
        - { valor: I_L, rotulo: "Corriente de la carga: {{I_L}}" }
      corriente: I
      mide: { salida: V_out, corriente: I, carga: I_L }
      mandos:
        - { valor: carga, tipo: interruptor, rotulo: "Etiqueta igual en los dos sitios" }
    objetivo:
      condiciones:
        - { valor: I_L, max: 0.0000001, rotulo: "Carga: {{I_L}}" }
      logrado: "Una letra de más y la carga queda en otra red: la salida sube a {{V_out}}, y el dibujo parece correcto."
      pistas:
        - { texto: "Haga que las dos etiquetas no sean iguales." }
    escalera:
      - "Dos puntos con el mismo nombre están conectados; con nombres distintos, no."
    solucion: "Etiquetas distintas: la carga deja de recibir corriente."

  - id: por-que-invisible
    tipo: porque
    titulo: "¿Por qué es tan peligrosa?"
    texto: "Con la etiqueta mal escrita, la carga quedó suelta. ¿Por qué es un error tan frecuente en placas fabricadas?"
    libro: [146]
    widget:
      tipo: circuito
      esquema: divisor
      piezas: { fuente: V_in, arriba: R_1, abajo: R_2, carga: R_L, etiqueta: carga, etiqueta2: et2 }
      lectura: { valor: V_out, rotulo: "Tensión de salida" }
      mide: { salida: V_out, corriente: I, carga: I_L }
      mandos: []
    opciones:
      - texto: "Porque crea una red nueva y el dibujo parece correcto"
        bien: true
        porque: "El error es invisible en el dibujo: las dos etiquetas están ahí, solo que no se llaman igual."
      - texto: "Porque la herramienta borra la conexión"
        porque: "La herramienta hace lo que dice el nombre: dos nombres distintos son dos redes."
      - texto: "Porque las etiquetas no conectan de verdad"
        porque: "Sí conectan, si el nombre es idéntico: ese es su poder y su peligro."
    escalera:
      - "¿Qué ve quien revisa el dibujo?"
    solucion: "Una red nueva que no se ve en el dibujo."

  - id: un-solo-nodo
    tipo: tocar
    titulo: "Red con un solo nodo"
    texto: "La comprobación de reglas avisa de una red con un solo nodo. Toque la etiqueta que la ha creado."
    libro: [146, 147, 160]
    widget:
      tipo: figura
      figura: fig-11.8
      zonas:
        - { id: reset1, rotulo: "Etiqueta junto a U1", rect: [56, 148, 42, 36] }
        - { id: reset2, rotulo: "Etiqueta junto a U2", rect: [356, 148, 44, 36] }
        - { id: rest, rotulo: "Etiqueta junto a U3", rect: [56, 186, 42, 36] }
        - { id: u3, rotulo: "Bloque U3", rect: [10, 186, 36, 36] }
    tocar:
      bien: [rest]
      porque:
        reset1: "RESET aparece dos veces: es una red de dos nodos, la misma que junto a U2."
        reset2: "Se une con la de U1 por el nombre, sin línea: está bien."
        u3: "El bloque no crea redes; las crea una etiqueta."
    exito: "«REST» en lugar de «RESET»: una red nueva de un solo nodo, invisible en el dibujo. Defensa: nombres significativos y el ERC."
    escalera:
      - "Compare las letras de las tres etiquetas."
    solucion: "La de U3: REST, mal escrita."

  - id: masas
    tipo: tocar
    titulo: "Los tipos de masa"
    texto: "Toque el símbolo que se une al conductor de protección de la red."
    libro: [152, "cap11#55"]
    widget:
      tipo: figura
      figura: fig-11.4
      zonas:
        - { id: senal, rotulo: "Primer símbolo de abajo", rect: [108, 180, 40, 40] }
        - { id: chasis, rotulo: "Segundo símbolo de abajo", rect: [210, 180, 40, 40] }
        - { id: tierra, rotulo: "Tercer símbolo de abajo", rect: [312, 180, 46, 40] }
    tocar:
      bien: [tierra]
      porque:
        senal: "El triángulo es la masa de señal: la referencia del circuito."
        chasis: "El rastrillo es la masa de chasis: va a la caja metálica."
    exito: "La tierra rodeada por un círculo. Y AGND/DGND: masas separadas que se unen en un solo punto, una decisión de trazado."
    escalera:
      - "Busque la tierra rodeada por un círculo."
    solucion: "El tercero: tierra de protección."

  - id: seguridad
    tipo: pregunta
    titulo: "Antes de la pinza"
    texto: "Va a medir un equipo con una fuente conmutada sin aislamiento. ¿Qué mira antes de conectar la pinza del osciloscopio?"
    libro: [154]
    widget:
      tipo: circuito
      esquema: divisor
      piezas: { fuente: V_in, arriba: R_1, abajo: R_2, carga: R_L, interruptor: carga }
      lectura: { valor: V_out, rotulo: "Tensión de salida" }
      mide: { salida: V_out, corriente: I, carga: I_L }
      mandos: []
    opciones:
      - texto: "Si la masa de señal está a la tensión de red"
        bien: true
        porque: "Sin transformador, la masa del circuito puede estar a tensión de red. El esquema debe indicarlo."
      - texto: "Nada: la masa siempre es tierra"
        porque: "No siempre: con transformador puede no estar a tierra, y sin él puede estar a la tensión de red."
      - texto: "Solo el color del cable"
        porque: "El color no dice el potencial: lo dice el esquema."
    escalera:
      - "Sin transformador, ¿qué separa el circuito de la red?"
    solucion: "Comprobar en el esquema si la masa puede estar a tensión de red."

  - id: estime-bus
    tipo: simular
    titulo: "Un bus abreviado"
    texto: "Una línea gruesa lleva la etiqueta D[0..7]. ¿Cuántas señales agrupa?"
    libro: [156, 157]
    simular:
      objetivo: n_bus
      unidad: ""
      tol: 0.02
      rotulo: "Señales del bus"
      errores:
        - { expr: "b_hi", texto: "Siete es la última; falta contar la línea 0." }
    exito: "Ocho señales, de D0 a D7. Un número mal puesto conecta la línea equivocada: fíese del ERC."
    escalera:
      - "Cuente de 0 a 7, las dos incluidas."
    solucion: "De 0 a 7: 8 señales."
    comprobar:
      - { n_bus: 8, b_hi: 7 }

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [141, 146, 150, 152, 149]
    ideas:
      - { titulo: "El punto.", texto: "Con punto, conexión; sin él, cruce. Nunca uniones de cuatro líneas." }
      - { titulo: "Etiquetas.", texto: "Conectan sin línea; mal escritas, crean una red nueva e invisible." }
      - { titulo: "Raíles.", texto: "Mejor +3V3 o +5V que VCC o VDD: dicen la tensión." }
      - { titulo: "Masas.", texto: "Señal, chasis y protección son redes distintas." }
