# Lección de la sección 11.7 «Del Esquema al Circuito Físico: Netlist, BOM y Ratsnest» (cap11). Formato: GUIA.md.
# El esquema es el divisor del libro (sección 1.4: 12 V, 10 kΩ y 5 kΩ) con designadores R1 y R2 y redes de nombre
# +12V, SALIDA y GND; esos nombres de red y la numeración de pines (R1-1, R1-2…) son míos, al estilo del bloque 166.
# 1.2.1 (aprender haciendo): cambiar R2 hasta un objetivo, tocar la red SALIDA, tocar el campo de compra, contar las
# unidades de una línea, tocar la regla común en la figura 11.9. Dos preguntas: el ratsnest y «100 nF».
# 1.2.1, segunda pasada: sin listas de respuestas disfrazadas; quedan las tarjetas que se hacen y dos preguntas.
# 1.3 (contenido13b): +explorar con objetivo la línea del ratsnest que queda (bloque 168), con la carga de 10 kΩ de la
# sección 1.4 (cap01#103): 4/6 → 5/7.
leccion: cap11/sec-11.7

libro:
  172: "La BOM dice qué comprar y dónde va"
  176: "Una BOM bien hecha agrupa componentes idénticos en una sola"
  185: "Junto a los dos anteriores, la fabricación necesita"
  190: "Netlist y lista de materiales"
  163: "son la única definición formal del circuito"
  165: "cada red con los pines que la forman"
  166: "N$12: R14-1, C7-2, U3-5"
  167: "no tiene ambigüedad"
  168: "Una línea del ratsnest que queda al final es una conexión sin hacer."
  "cap01#103": "4,00 V en vacío y 3,00 V con 10 kΩ conectados"
  169: "cada conexión del netlist existe"
  170: "se genera del esquema y no se edita a mano"
  173: "Un 1 % y un 5 % no son lo mismo"
  174: "obliga a volver a decidir"
  177: "C1, C4, C9, C12 — 100 nF, X7R, 50 V, 0805 — 4 uds."
  178: "revela la variedad real"
  180: "Editar la BOM a mano"
  181: "deben aparecer marcados como DNP"
  186: "se generan, no se escriben"
  "cap01#83": "Con 12 V, 10 kΩ y 5 kΩ, la salida es 4,00 V"

modelo:
  valores:
    V_in: { sim: "V_{entrada}", nombre: "tensión de la pila", unidad: V, valor: 12 }
    R_1: { sim: "R1", nombre: "resistencia de arriba", unidad: Ω, valor: 10000 }
    R_2: { sim: "R2", nombre: "resistencia de abajo", unidad: Ω, valor: 5000 }
    n_c: { sim: "n", nombre: "condensadores de la línea", unidad: "", valor: 4 }
    R_L: { sim: "R_{L}", nombre: "carga", unidad: Ω, valor: 10000 }
    carga: { tipo: interruptor, sim: "SALIDA", nombre: "pista de la carga hecha", valor: 0 }
  calculos:
    R_ab: { si: carga, entonces: "par(R_2, R_L)", sino: "R_2", sim: "R_{abajo}", nombre: "resistencia de la rama de abajo", unidad: Ω }
    V_out: { expr: "V_in*R_ab/(R_1 + R_ab)", sim: "V_{salida}", nombre: "tensión de salida", unidad: V }
    I: { expr: "V_in/(R_1 + R_ab)", sim: "I", nombre: "corriente", unidad: A }
    I_L: { si: carga, entonces: "V_out/R_L", sino: "0", sim: "I_{L}", nombre: "corriente de la carga", unidad: A }

tarjetas:
  - id: explore-topologia
    tipo: explorar
    titulo: "El netlist no ve los valores"
    texto: "Cambie R2 hasta que la salida marque la mitad de la pila. Las conexiones no cambian: el netlist es el mismo."
    libro: [165, 167, "cap01#83"]
    widget:
      tipo: circuito
      esquema: divisor
      piezas: { fuente: V_in, arriba: R_1, abajo: R_2 }
      lectura: { valor: V_out, rotulo: "Red SALIDA" }
      corriente: I
      mide: { salida: V_out, corriente: I }
      mandos:
        - { valor: R_2, lista: [5000, 10000, 20000], rotulo: "Valor de R2" }
    objetivo:
      condiciones:
        - { valor: V_out, objetivo: 6, tol: 0.02, rotulo: "Salida: {{V_out}}" }
      logrado: "Con R2 = R1, la mitad. Ha cambiado un valor, no una conexión: el netlist es topología pura."
      pistas:
        - { cuando: { valor: V_out, mayor: 6.12 }, texto: "Sobra tensión: baje R2." }
        - { texto: "Falta tensión: suba R2." }
    escalera:
      - "La mitad cae en R2 cuando vale lo mismo que R1."
    solucion: "R2 = 10 kΩ: 6 V."
    comprobar:
      - { con: { R_2: 10000 }, V_out: 6 }

  - id: netlist-divisor
    tipo: elegir
    titulo: "Una red del netlist"
    texto: "El netlist dice: SALIDA está formada por R1-2 y R2-1. Toque esa red en el esquema."
    libro: [165, 166]
    widget:
      tipo: circuito
      esquema: divisor
      piezas: { fuente: V_in, arriba: R_1, abajo: R_2 }
      lectura: { valor: V_out, rotulo: "Tensión de salida" }
      mide: { salida: V_out, corriente: I }
      mandos: []
    elegir:
      zonas: { "red:fte": "Nodo de arriba", "red:salida": "Nodo del centro", "red:0": "Nodo de abajo" }
      bien: ["red:salida"]
      porque:
        "red:fte": "Esa red une el positivo de la pila con R1-1: sería +12V."
        "red:0": "Esa une R2-2 con el negativo de la pila: GND."
    exito: "Cada red con los pines que la forman, nada más: sin posición ni dibujo, el trazado sabe qué pistas unir."
    escalera:
      - "El pin 2 de R1 y el 1 de R2 se tocan entre las dos resistencias."
    solucion: "El nodo entre las dos resistencias."

  - id: prediga-ratsnest
    tipo: predecir
    titulo: "Una línea que queda"
    texto: "Ha trazado la placa y aún se ve una línea recta fina entre dos almohadillas. ¿Qué es?"
    libro: [168, 169]
    widget:
      tipo: circuito
      esquema: divisor
      piezas: { fuente: V_in, arriba: R_1, abajo: R_2 }
      lectura: { valor: V_out, rotulo: "Red SALIDA" }
      mide: { salida: V_out, corriente: I }
      ocultar: true
      mandos: []
    opciones:
      - texto: "Una conexión del netlist sin hacer"
        bien: true
        porque: "El ratsnest muestra lo que falta por rutar y desaparece conforme se trazan las pistas."
      - texto: "Una pista ya trazada"
        porque: "Las pistas trazadas dejan de mostrarse como ratsnest: la que queda está pendiente."
      - texto: "Un error del dibujo sin importancia"
        porque: "Es una conexión del circuito que la placa aún no tiene: sin ella, no funciona."
    escalera:
      - "Ratsnest: «nido de ratas», lo pendiente de rutar."
    solucion: "Una conexión del netlist que aún no tiene pista."

  - id: explore-ratsnest
    tipo: explorar
    titulo: "La línea que queda"
    texto: "Trazada la placa, queda una línea del ratsnest entre la salida y la carga: una conexión del netlist sin hacer. Hágala hasta que la carga reciba corriente."
    libro: [168, 169, "cap01#103"]
    widget:
      tipo: circuito
      esquema: divisor
      piezas: { fuente: V_in, arriba: R_1, abajo: R_2, carga: R_L, union: carga }
      lectura: { valor: V_out, rotulo: "Salida" }
      corriente: I
      mide: { salida: V_out, corriente: I, carga: I_L }
      mandos:
        - { valor: carga, tipo: interruptor, rotulo: "Pista entre la salida y la carga" }
    objetivo:
      condiciones:
        - { valor: I_L, min: 0.0001, rotulo: "Carga: {{I_L}}" }
      logrado: "Con la pista hecha, la carga de 10 kΩ recibe {{I_L}} y la salida baja a {{V_out}}: lo que dice el netlist ya existe en la placa."
      pistas:
        - { texto: "Haga la pista que une la salida con la carga." }
    escalera:
      - "Una línea del ratsnest une dos pines que el netlist dice que van juntos."
    solucion: "Haga la pista: la salida baja de 4,00 V a 3,00 V."
    comprobar:
      - { con: { carga: 1 }, V_out: 3, I_L: 0.0003 }

  - id: cien-nano
    tipo: pregunta
    titulo: "Una BOM que dice «100 nF»"
    texto: "La lista de materiales solo dice «100 nF». ¿Qué problema crea al comprar?"
    libro: [174]
    widget:
      tipo: circuito
      esquema: divisor
      piezas: { fuente: V_in, arriba: R_1, abajo: R_2 }
      lectura: { valor: V_out, rotulo: "Red SALIDA" }
      mide: { salida: V_out, corriente: I }
      mandos: []
    opciones:
      - texto: "Obliga a decidir otra vez el dieléctrico y la tensión"
        bien: true
        porque: "Esa decisión ya se tomó al diseñar; repetirla al comprar es donde entran los errores."
      - texto: "Ninguno: el valor es lo único que importa"
        porque: "Dos condensadores de 100 nF con distinto dieléctrico o tensión no son intercambiables."
      - texto: "Que no se sabe cuántos comprar"
        porque: "La cantidad sale de la agrupación por línea; lo que falta es dieléctrico y tensión."
    escalera:
      - "¿Qué más hay que saber de un condensador además de su capacidad?"
    solucion: "Hay que volver a decidir dieléctrico y tensión."

  - id: estime-linea
    tipo: simular
    titulo: "Una línea de la BOM"
    texto: "La línea agrupa los componentes idénticos: C1, C4, C9, C12 — 100 nF, X7R, 50 V, 0805. ¿Cuántas unidades hay que pedir?"
    libro: [176, 177, 178, 190]
    fijar: { n_c: 4 }
    widget:
      tipo: figura
      figura: fig-11.9
      zonas:
        - { id: bom, rotulo: "Recuadro de la derecha", rect: [230, 62, 220, 112] }
    simular:
      objetivo: n_c
      unidad: ""
      tol: 0.02
      rotulo: "Unidades"
      errores:
        - { expr: "12", texto: "Doce es el número del último designador: se cuentan los designadores." }
    exito: "Cuatro designadores, cuatro unidades: una línea de pedido, y la variedad real del diseño a la vista."
    escalera:
      - "Cada designador es una unidad."
    solucion: "Cuatro designadores: 4 uds."
    comprobar:
      - { n_c: 4 }

  - id: salidas
    tipo: tocar
    titulo: "Se generan, no se escriben"
    texto: "Gerbers, taladro, posiciones, netlist y BOM comparten una regla. Toque, en la figura, dónde está."
    libro: [170, 180, 185, 186, 190]
    widget:
      tipo: figura
      figura: fig-11.9
      zonas:
        - { id: esquema, rotulo: "Recuadro de arriba", rect: [164, 2, 126, 36] }
        - { id: netlist, rotulo: "Recuadro de la izquierda", rect: [2, 62, 220, 112] }
        - { id: bom, rotulo: "Recuadro de la derecha", rect: [230, 62, 220, 112] }
        - { id: regla, rotulo: "Franja de abajo", rect: [2, 182, 448, 46] }
    tocar:
      bien: [regla]
      porque:
        esquema: "El esquema es el documento para humanos del que salen los demás."
        netlist: "Dice qué pines forman cada red; la regla común está aparte."
        bom: "Dice qué comprar y dónde va; la regla común está aparte."
    exito: "Se generan, no se escriben: editada a mano tras cambiar el esquema, la BOM se desincroniza y ninguno de los dos es fiable."
    escalera:
      - "Busque lo que vale para todos los ficheros a la vez."
    solucion: "La franja de abajo: ambos se generan, no se escriben."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [163, 168, 174, 186, 172, 173, 181]
    ideas:
      - { titulo: "Netlist.", texto: "Cada red con sus pines: topología pura, sin ambigüedad." }
      - { titulo: "Ratsnest.", texto: "Lo que falta por rutar; una línea al final es una conexión sin hacer." }
      - { titulo: "BOM.", texto: "Qué comprar y dónde va: tolerancia, tensión, encapsulado y referencia." }
      - { titulo: "Se generan.", texto: "Ningún fichero de salida se edita a mano." }
