# Lección 1.2 de la sección 11.1 «¿Por qué Símbolos y no Dibujos?» (cap11). Formato: contenido/lecciones11/GUIA.md.
# El esquema que se lee es el divisor del libro (sección 1.4: 12 V, 10 kΩ y 5 kΩ, 4,00 V), dibujado con el kit de la
# app. El mando «tipo de R₂» (axial, SMD, bobinada) no cambia ningún cálculo: es la abstracción del bloque 9.
leccion: cap11/sec-11.1

libro:
  4: "no representa cómo es un circuito"
  5: "Un plano de montaje dice dónde va cada pieza"
  6: "el conector de entrada y el de salida pueden ir uno al lado del otro"
  9: "Un símbolo de resistencia representa a todas las resistencias"
  10: "un ojo entrenado ve «divisor de tensión»"
  11: "IEC 60617 en Europa, ANSI Y32.2 en América"
  12: "es una base de datos de conexiones"
  15: "resistencia en zigzag"
  16: "Lo importante es no mezclarlas dentro del mismo esquema."
  19: "Entender la función"
  20: "El cuarto criterio es el que más se descuida"
  22: "idea → esquema → simulación"
  23: "anotar en el esquema las tensiones y formas de onda esperadas"
  "cap01#83": "Con 12 V, 10 kΩ y 5 kΩ, la salida es 4,00 V"

modelo:
  valores:
    V_in: { sim: "V_{entrada}", nombre: "tensión de la pila", unidad: V, valor: 12 }
    R_1: { sim: "R₁", nombre: "resistencia de arriba", unidad: Ω, valor: 10000 }
    R_2: { sim: "R₂", nombre: "resistencia de abajo", unidad: Ω, valor: 5000 }
    tipo_r: { sim: "tipo", nombre: "tipo de resistencia de R₂", unidad: "", valor: 1 }
  calculos:
    V_out: { expr: "V_in*R_2/(R_1 + R_2)", sim: "V_{salida}", nombre: "tensión de salida", unidad: V }
    I: { expr: "V_in/(R_1 + R_2)", sim: "I", nombre: "corriente", unidad: A }

tarjetas:
  - id: explore-abstraccion
    tipo: explorar
    titulo: "Un símbolo para todas"
    texto: "Cambie el tipo de R₂: axial, SMD o bobinada. Fíjese en el dibujo y en la lectura."
    nota: "El divisor del libro: {{V_in}}, {{R_1}} y {{R_2}}."
    libro: [9, "cap01#83"]
    widget:
      tipo: circuito
      esquema: divisor
      piezas: { fuente: V_in, arriba: R_1, abajo: R_2 }
      lectura: { valor: V_out, rotulo: "Tensión de salida" }
      corriente: I
      mide: { salida: V_out, corriente: I }
      mandos:
        - { valor: tipo_r, lista: [1, 2, 3], nombres: [axial, SMD, bobinada], rotulo: "Tipo de R₂" }
    requiere: { mover: [tipo_r] }

  - id: que-dice
    tipo: pregunta
    titulo: "Qué cuenta un esquema"
    texto: "Un plano de montaje dice dónde va cada pieza. ¿Qué dice un esquema?"
    libro: [4, 5]
    widget:
      tipo: circuito
      esquema: divisor
      piezas: { fuente: V_in, arriba: R_1, abajo: R_2 }
      lectura: { valor: V_out, rotulo: "Tensión de salida" }
      mide: { salida: V_out, corriente: I }
      mandos: []
    opciones:
      - texto: "Qué está conectado con qué y qué función cumple cada bloque"
        bien: true
        porque: "El esquema dice cómo funciona el circuito, no cómo es. Exigirle el aspecto de la placa es la raíz de casi todas las dificultades de lectura."
      - texto: "Cómo es cada pieza y cuánto ocupa"
        porque: "Eso no lo dice ni el plano: el símbolo es el mismo para una pieza grande o pequeña. El esquema cuenta conexiones y funciones."
      - texto: "Dónde se suelda cada pieza en la placa"
        porque: "Eso es el plano de montaje. Son dos documentos con propósitos distintos."
    escalera:
      - "Un esquema no representa cómo es un circuito."
    solucion: "Qué está conectado con qué y qué hace cada bloque: cómo funciona, no cómo es."

  - id: prediga-conectores
    tipo: predecir
    titulo: "Dos conectores juntos"
    texto: "En la placa, el conector de entrada y el de salida van uno al lado del otro. ¿Dónde los dibuja un buen esquema?"
    libro: [6]
    widget:
      tipo: circuito
      esquema: divisor
      piezas: { fuente: V_in, arriba: R_1, abajo: R_2 }
      lectura: { valor: V_out, rotulo: "Tensión de salida" }
      mide: { salida: V_out, corriente: I }
      ocultar: true
      mandos: []
    opciones:
      - texto: "La entrada a la izquierda y la salida a la derecha"
        bien: true
        porque: "En el esquema importa el recorrido de la señal y entre qué nodos está cada pieza, no dónde se monta."
      - texto: "Juntos, como en la placa"
        porque: "Eso copia la disposición física. El esquema sigue el camino de la señal, aunque separe lo que en la placa está junto."
      - texto: "Donde quepan, el orden da igual"
        porque: "El orden sí importa: la señal se lee de izquierda a derecha, de la entrada a la salida."
    escalera:
      - "¿Qué importa en el esquema: dónde se monta o por dónde pasa la señal?"
    solucion: "En extremos opuestos de la hoja: la entrada a la izquierda y la salida a la derecha."

  - id: cuatro-razones
    tipo: pregunta
    fase: "Empareje"
    titulo: "Cuatro razones"
    texto: "Una cada razón de usar símbolos con lo que aporta."
    libro: [9, 10, 11, 12]
    emparejar:
      - ["Abstracción", "Un símbolo representa a todas las resistencias"]
      - ["Legibilidad", "Una configuración se reconoce de un vistazo"]
      - ["Universalidad", "Normas IEC 60617 y ANSI Y32.2"]
      - ["Procesabilidad", "Una base de datos de conexiones"]
    exito: "Un esquema de 1970 se lee hoy sin dificultad, y en CAD de él salen netlist, BOM y comprobaciones."
    pistas:
      - { texto: "La legibilidad es la del ojo entrenado que lee «divisor» como una palabra." }
    escalera:
      - "La universalidad viene de las normas; la procesabilidad, de la herramienta CAD."
    solucion: "Abstracción–todas las resistencias; legibilidad–de un vistazo; universalidad–normas; procesabilidad–base de datos."

  - id: por-que-procesable
    tipo: porque
    titulo: "El argumento más fuerte"
    texto: "De las cuatro razones, el libro dice que la procesabilidad es hoy la de más peso. ¿Por qué?"
    libro: [12]
    widget:
      tipo: circuito
      esquema: divisor
      piezas: { fuente: V_in, arriba: R_1, abajo: R_2 }
      lectura: { valor: V_out, rotulo: "Tensión de salida" }
      mide: { salida: V_out, corriente: I }
      mandos: []
    opciones:
      - texto: "Porque del esquema salen solos el netlist, la BOM y las comprobaciones"
        bien: true
        porque: "En una herramienta CAD el esquema es la fuente de la que se deriva todo lo demás."
      - texto: "Porque los símbolos se dibujan más deprisa"
        porque: "La rapidez no es el argumento: lo que importa es que el dibujo es una base de datos de conexiones."
      - texto: "Porque la impresora lo entiende mejor"
        porque: "No se trata de imprimir: la herramienta lee las conexiones y genera netlist, BOM y comprobaciones."
    escalera:
      - "En CAD, un esquema no es un dibujo."
    solucion: "Es una base de datos de conexiones: de ella salen netlist, BOM y ERC."

  - id: convenciones
    tipo: pregunta
    fase: "Empareje"
    titulo: "Dos familias de símbolos"
    texto: "Una cada símbolo con su convención."
    libro: [15, 16]
    emparejar:
      - ["Resistencia en zigzag", "Americana (ANSI)"]
      - ["Resistencia como rectángulo", "Europea (IEC)"]
      - ["AND redondeada, OR con punta", "Puertas ANSI de forma distintiva"]
      - ["Rectángulo con &, ≥1", "Puertas IEC"]
    exito: "Ninguna es la correcta. Lo importante es no mezclarlas dentro del mismo esquema."
    pistas:
      - { texto: "El rectángulo es europeo; el zigzag, americano." }
    escalera:
      - "Las puertas de forma distintiva son ANSI y dominan incluso en Europa."
    solucion: "Zigzag–ANSI; rectángulo–IEC; formas distintivas–puertas ANSI; rectángulo con símbolo–puertas IEC."

  - id: cuatro-cosas
    tipo: pregunta
    titulo: "El criterio olvidado"
    texto: "Un buen esquema permite entender la función, construir, diagnosticar y modificar. ¿Cuál de los cuatro se descuida más?"
    libro: [19, 20]
    widget:
      tipo: circuito
      esquema: divisor
      piezas: { fuente: V_in, arriba: R_1, abajo: R_2 }
      lectura: { valor: V_out, rotulo: "Tensión de salida" }
      mide: { salida: V_out, corriente: I }
      mandos: []
    opciones:
      - texto: "Modificarlo años después, alguien que no lo diseñó"
        bien: true
        porque: "Es el que más se descuida y el que más se agradece: sin esquema, una avería de veinte minutos ocupa una tarde."
      - texto: "Entender la función"
        porque: "Es lo primero que se busca al dibujar: bloques distinguibles y señal que se sigue."
      - texto: "Construir el circuito"
        porque: "Valor, encapsulado y designador se suelen poner porque sin ellos no se fabrica."
    escalera:
      - "Piense en quien abre el esquema mucho después y no lo dibujó."
    solucion: "El cuarto: modificarlo años después, por alguien que no lo diseñó."

  - id: flujo-diseno
    tipo: pregunta
    fase: "Ordene"
    titulo: "El esquema en el proceso"
    texto: "Ordene el flujo típico de diseño."
    libro: [22]
    ordenar:
      - "Idea"
      - "Esquema"
      - "Simulación"
      - "Placa"
      - "Prototipo"
      - "Prueba"
      - "Revisión del esquema"
    exito: "El esquema no es el primer paso ni el último: es el documento vivo que acompaña todo el proceso."
    pistas:
      - { texto: "Se simula antes de hacer la placa; se prueba el prototipo." }
    escalera:
      - "El flujo empieza en la idea y vuelve al esquema al final."
    solucion: "Idea, esquema, simulación, placa, prototipo, prueba y revisión del esquema."

  - id: anote-tension
    tipo: pregunta
    fase: "Estime"
    titulo: "Anote la tensión esperada"
    texto: "Con 12 V, 10 kΩ y 5 kΩ, ¿qué tensión anotaría junto a la salida del divisor?"
    libro: [23, "cap01#83"]
    fijar: { V_in: 12, R_1: 10000, R_2: 5000 }
    estimar:
      objetivo: "V_out"
      unidad: V
      min: 0
      max: 12
      paso: 0.1
      inicio: 9
      tol: 0.03
      rotulo: "Tensión anotada"
    exito: "4,00 V. Anotada en el esquema, la depuración se convierte en una comparación."
    pistas:
      - { cuando: { valor: estimacion, mayor: 4.12 }, texto: "Se ha pasado: R₂ es la tercera parte de R₁ + R₂." }
      - { texto: "Se ha quedado corto: a R₂ le toca la tercera parte de los 12 V." }
    escalera:
      - "La tensión se reparte en proporción a las resistencias."
    solucion: "12 V · 5 kΩ / (10 kΩ + 5 kΩ) = 4,00 V."
    comprobar:
      - { V_out: 4.0 }

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [4, 12, 16, 23]
    ideas:
      - { titulo: "Cómo funciona.", texto: "El esquema dice qué está conectado con qué, no dónde va cada pieza." }
      - { titulo: "Símbolos.", texto: "Abstracción, legibilidad, universalidad y, sobre todo, procesabilidad." }
      - { titulo: "Dos familias.", texto: "ANSI e IEC conviven; no se mezclan en el mismo esquema." }
      - { titulo: "Tensiones esperadas.", texto: "Anotarlas convierte la depuración en una comparación." }
