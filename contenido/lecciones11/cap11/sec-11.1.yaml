# Lección de la sección 11.1 «¿Por qué Símbolos y no Dibujos?» (cap11). Formato: contenido/lecciones11/GUIA.md.
# 1.2.1 (aprender haciendo, GUIA §13): el lector cambia la resistencia del divisor del libro (sección 1.4: 12 V, 10 kΩ
# y 5 kΩ, 4,00 V) sin que cambie la salida, toca en el esquema dónde se dibuja la salida, toca en la figura 11.2 las
# razones y los símbolos, ordena el flujo de diseño tocando y anota y mide la tensión esperada. Solo el criterio que
# más se descuida queda como pregunta de opciones.
leccion: cap11/sec-11.1

libro:
  4: "no representa cómo es un circuito"
  5: "Un plano de montaje dice dónde va cada pieza"
  6: "el conector de entrada y el de salida pueden ir uno al lado del otro"
  9: "Un símbolo de resistencia representa a todas las resistencias"
  10: "un ojo entrenado ve «divisor de tensión»"
  11: "IEC 60617 en Europa, ANSI Y32.2 en América"
  12: "es una base de datos de conexiones"
  15: "resistencia en zigzag"
  16: "Lo importante es no mezclarlas dentro del mismo esquema."
  19: "Entender la función"
  20: "El cuarto criterio es el que más se descuida"
  22: "idea → esquema → simulación"
  23: "anotar en el esquema las tensiones y formas de onda esperadas"
  "cap01#83": "Con 12 V, 10 kΩ y 5 kΩ, la salida es 4,00 V"

modelo:
  valores:
    V_in: { sim: "V_{entrada}", nombre: "tensión de la pila", unidad: V, valor: 12 }
    R_1: { sim: "R₁", nombre: "resistencia de arriba", unidad: Ω, valor: 10000 }
    R_2: { sim: "R₂", nombre: "resistencia de abajo", unidad: Ω, valor: 5000 }
    tipo_r: { sim: "tipo", nombre: "tipo de resistencia de R₂", unidad: "", valor: 1 }
  calculos:
    V_out: { expr: "V_in*R_2/(R_1 + R_2)", sim: "V_{salida}", nombre: "tensión de salida", unidad: V }
    I: { expr: "V_in/(R_1 + R_2)", sim: "I", nombre: "corriente", unidad: A }

tarjetas:
  - id: explore-abstraccion
    tipo: explorar
    titulo: "Un símbolo para todas"
    texto: "R₂ puede ser axial, SMD o bobinada. Cámbiela por una bobinada y mire si la salida se entera."
    nota: "El divisor del libro: {{V_in}}, {{R_1}} y {{R_2}}."
    libro: [9, "cap01#83"]
    inicio: { tipo_r: 1 }
    widget:
      tipo: circuito
      esquema: divisor
      piezas: { fuente: V_in, arriba: R_1, abajo: R_2 }
      lectura: { valor: V_out, rotulo: "Tensión de salida" }
      corriente: I
      mide: { salida: V_out, corriente: I }
      mandos:
        - { valor: tipo_r, lista: [1, 2, 3], nombres: [axial, SMD, bobinada], rotulo: "Tipo de R₂" }
    objetivo:
      condiciones:
        - { valor: tipo_r, min: 3, rotulo: "R₂ bobinada" }
      logrado: "La salida sigue en {{V_out}}: el circuito funciona igual con cualquiera, y el símbolo recoge lo que es común."
      pistas:
        - { texto: "Elija «bobinada» en el tipo de R₂." }
    escalera:
      - "El mando de debajo cambia el tipo de R₂."
    solucion: "Con R₂ bobinada la salida sigue en 4,00 V."

  - id: prediga-conectores
    tipo: elegir
    titulo: "Dos conectores juntos"
    texto: "En la placa, el conector de salida va junto al de entrada. Toque en el esquema el punto donde se dibuja la salida."
    libro: [5, 6]
    widget:
      tipo: circuito
      esquema: divisor
      piezas: { fuente: V_in, arriba: R_1, abajo: R_2 }
      lectura: { valor: V_out, rotulo: "Tensión de salida" }
      mide: { salida: V_out, corriente: I }
      mandos: []
    elegir:
      zonas: { "red:salida": "Nodo entre las dos resistencias", fuente: "Fuente, a la izquierda", "red:0": "Masa, abajo" }
      bien: ["red:salida"]
      porque:
        fuente: "Esa es la entrada: la pila, a la izquierda de la hoja."
        "red:0": "Masa es la referencia común, no la salida."
    exito: "La salida queda a la derecha, lejos de la entrada: el esquema sigue la señal, no la placa."
    escalera:
      - "Un esquema se lee de izquierda a derecha, de la entrada a la salida."
    solucion: "El nodo entre las dos resistencias, a la derecha."

  - id: por-que-procesable
    tipo: tocar
    titulo: "El argumento más fuerte"
    texto: "De las cuatro razones de la figura, una es hoy la de más peso. Tóquela."
    libro: [9, 10, 11, 12]
    widget:
      tipo: figura
      figura: fig-11.2
      zonas:
        - { id: abstraccion, rotulo: "Primer recuadro, a la izquierda", rect: [4, 4, 108, 150] }
        - { id: legibilidad, rotulo: "Segundo recuadro", rect: [118, 4, 108, 150] }
        - { id: universalidad, rotulo: "Tercer recuadro", rect: [231, 4, 108, 150] }
        - { id: procesabilidad, rotulo: "Cuarto recuadro, a la derecha", rect: [343, 4, 108, 150] }
    tocar:
      bien: [procesabilidad]
      porque:
        abstraccion: "Es la primera en orden, pero no la de más peso: no ata el diseño a una pieza concreta."
        legibilidad: "Leer un divisor de un vistazo ayuda, pero no genera nada por sí solo."
        universalidad: "Las normas hacen legible un esquema de 1970; no es el argumento más fuerte."
    exito: "En CAD el esquema es una base de datos de conexiones: de ella salen el netlist, la BOM y las comprobaciones."
    escalera:
      - "¿Cuál convierte el esquema en la fuente de todo lo demás?"
    solucion: "La procesabilidad: de la base de datos de conexiones sale todo lo demás."

  - id: toque-universal
    tipo: tocar
    titulo: "Un esquema de 1970"
    texto: "Un esquema de 1970 se lee hoy sin dificultad en cualquier país. Toque la razón que lo hace posible."
    libro: [11]
    widget:
      tipo: figura
      figura: fig-11.2
      zonas:
        - { id: abstraccion, rotulo: "Primer recuadro, a la izquierda", rect: [4, 4, 108, 150] }
        - { id: legibilidad, rotulo: "Segundo recuadro", rect: [118, 4, 108, 150] }
        - { id: universalidad, rotulo: "Tercer recuadro", rect: [231, 4, 108, 150] }
        - { id: procesabilidad, rotulo: "Cuarto recuadro, a la derecha", rect: [343, 4, 108, 150] }
    tocar:
      bien: [universalidad]
      porque:
        abstraccion: "Un símbolo para todas las resistencias no garantiza que otro país lo entienda."
        legibilidad: "Los trazos rectos se leen deprisa, pero lo que cruza fronteras y décadas es la norma."
        procesabilidad: "La base de datos de conexiones es del CAD; un esquema de 1970 era papel."
    exito: "Los símbolos están normalizados: IEC 60617 en Europa y ANSI Y32.2 en América."
    escalera:
      - "Piense en lo que comparten todos los dibujantes: una norma."
    solucion: "La universalidad: los símbolos normalizados."

  - id: convenciones
    tipo: tocar
    titulo: "Dos familias de símbolos"
    texto: "Su esquema usa la convención europea. Toque la resistencia que debe dibujar en él."
    libro: [15, 16]
    widget:
      tipo: figura
      figura: fig-11.2
      zonas:
        - { id: iec, rotulo: "Símbolo de arriba, tercer recuadro", rect: [246, 32, 74, 37] }
        - { id: ansi, rotulo: "Símbolo de abajo, tercer recuadro", rect: [246, 70, 74, 37] }
        - { id: real, rotulo: "Piezas reales, primer recuadro", rect: [6, 38, 56, 74] }
    tocar:
      bien: [iec]
      porque:
        ansi: "El zigzag es la resistencia americana (ANSI). Ninguna es la correcta, pero no se mezclan en el mismo esquema."
        real: "Es el componente físico: el esquema no dibuja el aspecto, dibuja el símbolo."
    exito: "El rectángulo es la resistencia europea (IEC). Elegida una familia, todo el esquema la sigue."
    escalera:
      - "IEC es la norma europea."
    solucion: "El rectángulo de arriba, con IEC 60617 debajo."

  - id: cuatro-cosas
    tipo: pregunta
    titulo: "El criterio olvidado"
    texto: "Un buen esquema permite entender la función, construir, diagnosticar y modificar. ¿Cuál de los cuatro se descuida más?"
    libro: [19, 20]
    widget:
      tipo: circuito
      esquema: divisor
      piezas: { fuente: V_in, arriba: R_1, abajo: R_2 }
      lectura: { valor: V_out, rotulo: "Tensión de salida" }
      mide: { salida: V_out, corriente: I }
      mandos: []
    opciones:
      - texto: "Modificarlo años después, alguien que no lo diseñó"
        bien: true
        porque: "Es el que más se descuida y el que más se agradece: sin esquema, una avería de veinte minutos ocupa una tarde."
      - texto: "Entender la función"
        porque: "Es lo primero que se busca al dibujar: bloques distinguibles y señal que se sigue."
      - texto: "Construir el circuito"
        porque: "Valor, encapsulado y designador se suelen poner porque sin ellos no se fabrica."
    escalera:
      - "Piense en quien abre el esquema mucho después y no lo dibujó."
    solucion: "El cuarto: modificarlo años después, por alguien que no lo diseñó."

  - id: flujo-diseno
    tipo: tocar
    titulo: "El esquema en el proceso"
    texto: "Toque las etapas del flujo típico de diseño en su orden, de la idea a la última."
    libro: [22]
    widget:
      tipo: figura
      codigo:
        lenguaje: texto
        texto: |-
          Placa
          Revisión del esquema
          Idea
          Prueba
          Simulación
          Esquema
          Prototipo
      zonas:
        - { id: placa, lineas: [1], rotulo: "Placa" }
        - { id: revision, lineas: [2], rotulo: "Revisión del esquema" }
        - { id: idea, lineas: [3], rotulo: "Idea" }
        - { id: prueba, lineas: [4], rotulo: "Prueba" }
        - { id: simulacion, lineas: [5], rotulo: "Simulación" }
        - { id: esquema, lineas: [6], rotulo: "Esquema" }
        - { id: prototipo, lineas: [7], rotulo: "Prototipo" }
    tocar:
      bien: [idea, esquema, simulacion, placa, prototipo, prueba, revision]
      orden: true
    exito: "El esquema no es el primer paso ni el último: es el documento vivo que se revisa cuando el prototipo obliga."
    escalera:
      - "Se simula antes de hacer la placa; se prueba el prototipo."
    solucion: "Idea, esquema, simulación, placa, prototipo, prueba y revisión del esquema."

  - id: anote-tension
    tipo: simular
    titulo: "Anote la tensión esperada"
    texto: "Con 12 V, 10 kΩ y 5 kΩ, ¿qué tensión anotaría junto a la salida del divisor?"
    libro: [23, "cap01#83"]
    fijar: { V_in: 12, R_1: 10000, R_2: 5000 }
    widget:
      tipo: circuito
      esquema: divisor
      piezas: { fuente: V_in, arriba: R_1, abajo: R_2 }
      lectura: { valor: V_out, rotulo: "Tensión de salida" }
      mide: { salida: V_out, corriente: I }
      ocultar: true
      mandos: []
    simular:
      objetivo: V_out
      unidad: V
      tol: 0.03
      rotulo: "Tensión anotada en la salida"
      medida: salida
      errores:
        - { expr: "V_in*R_1/(R_1 + R_2)", texto: "Esos 8 V son los de R₁, la de arriba: la salida es la caída en R₂." }
        - { expr: "V_in/2", texto: "La mitad sería con dos resistencias iguales; aquí R₂ es la tercera parte del total." }
    exito: "4,00 V. Anotada en el esquema, la depuración se convierte en una comparación."
    escalera:
      - "La tensión se reparte en proporción a las resistencias."
    solucion: "12 V · 5 kΩ / (10 kΩ + 5 kΩ) = 4,00 V."
    comprobar:
      - { V_out: 4.0 }

  - id: mida-anotada
    tipo: medir
    titulo: "Compare con lo anotado"
    texto: "En el banco, compruebe la anotación: ponga las puntas del multímetro donde se mide la tensión anotada."
    libro: [23]
    widget:
      tipo: circuito
      esquema: divisor
      piezas: { fuente: V_in, arriba: R_1, abajo: R_2 }
      corriente: I
      mide: { salida: V_out, corriente: I }
      instrumento: { tipo: multimetro, modos: [V] }
      mandos: []
    medir:
      magnitud: tension
      entre: [salida, "0"]
      valor: V_out
      porque:
        fte: "Esa punta está en la pila: mide sus 12 V, no la salida."
        "fte/salida": "Así mide la caída en R₁: 8 V."
    exito: "Marca lo anotado, 4,00 V: comparar es mucho más rápido que deducir."
    escalera:
      - "La salida es el nodo entre las dos resistencias; la referencia, masa."
    solucion: "Roja en la salida y negra en masa: 4,00 V."
    comprobar:
      - { V_out: 4.0 }

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [4, 12, 16, 23]
    ideas:
      - { titulo: "Cómo funciona.", texto: "El esquema dice qué está conectado con qué, no dónde va cada pieza." }
      - { titulo: "Símbolos.", texto: "Abstracción, legibilidad, universalidad y, sobre todo, procesabilidad." }
      - { titulo: "Dos familias.", texto: "ANSI e IEC conviven; no se mezclan en el mismo esquema." }
      - { titulo: "Tensiones esperadas.", texto: "Anotarlas convierte la depuración en una comparación." }
