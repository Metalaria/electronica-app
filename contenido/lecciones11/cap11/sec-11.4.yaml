# Lección 1.2 de la sección 11.4 «Convenciones de Dibujo» (cap11). Formato: contenido/lecciones11/GUIA.md.
# El esquema que se lee es el divisor del libro (sección 1.4: 12 V, 10 kΩ y 5 kΩ), dibujado como pide la sección:
# la pila arriba, la masa abajo. Los 120 componentes de la estimación de hojas son un ejemplo.
leccion: cap11/sec-11.4

libro:
  84: "reconoce configuraciones de un vistazo"
  85: "produce uno que hay que analizar en lugar de leer"
  87: "La señal fluye de izquierda a derecha."
  88: "la posición vertical sugiere el nivel de tensión"
  89: "Los símbolos de alimentación se repiten"
  90: "Las realimentaciones van de derecha a izquierda"
  92: "veinte a cuarenta componentes por hoja A4"
  93: "repartirlo en hojas por función"
  95: "Cada cruce es una oportunidad de confusión"
  96: "Un componente boca abajo o en diagonal cuesta reconocerlo"
  98: "Mezclar convenciones"
  99: "debe dibujarse junto al chip que desacopla"
  101: "Bloque de título"
  102: "100 nF / 50 V / X7R"
  104: "Tensiones esperadas"
  105: "Notas de diseño"
  107: "identificar los bloques funcionales"
  108: "el problema es del dibujo, no del lector"
  "cap01#83": "Con 12 V, 10 kΩ y 5 kΩ, la salida es 4,00 V"

modelo:
  valores:
    V_in: { sim: "V_{entrada}", nombre: "tensión de la pila", unidad: V, valor: 12 }
    R_1: { sim: "R₁", nombre: "resistencia de arriba", unidad: Ω, valor: 10000 }
    R_2: { sim: "R₂", nombre: "resistencia de abajo", unidad: Ω, valor: 5000 }
    N_c: { sim: "N", nombre: "componentes del circuito", unidad: "", valor: 120 }
  calculos:
    V_out: { expr: "V_in*R_2/(R_1 + R_2)", sim: "V_{salida}", nombre: "tensión de salida", unidad: V }
    V_r1: { expr: "V_in - V_out", sim: "V_{R1}", nombre: "tensión en R₁", unidad: V }
    I: { expr: "V_in/(R_1 + R_2)", sim: "I", nombre: "corriente", unidad: A }
    h_min: { expr: "N_c/40", sim: "hojas", nombre: "hojas A4 como mínimo", unidad: "" }

tarjetas:
  - id: explore-vertical
    tipo: explorar
    titulo: "Arriba, la tensión alta"
    texto: "La pila arriba y la masa abajo: la altura de cada nodo sugiere su tensión. Mueva R₂ y lea las caídas."
    libro: [88, "cap01#83"]
    widget:
      tipo: circuito
      esquema: divisor
      piezas: { fuente: V_in, arriba: R_1, abajo: R_2 }
      lectura: { valor: V_out, rotulo: "Nodo central" }
      barras:
        - { valor: V_r1, rotulo: "R₁ se queda {{V_r1}}", color: azul }
        - { valor: V_out, rotulo: "R₂ se queda {{V_out}}", color: naranja }
      corriente: I
      mide: { salida: V_out, corriente: I }
      mandos:
        - { valor: R_2, min: 1000, max: 20000, paso: 1000 }

  - id: cuatro-reglas
    tipo: pregunta
    fase: "Empareje"
    titulo: "Las cuatro reglas"
    texto: "Una cada elemento con cómo se dibuja."
    libro: [87, 88, 89, 90]
    emparejar:
      - ["La señal", "De izquierda a derecha"]
      - ["La alimentación positiva", "Arriba, con la masa abajo"]
      - ["Los símbolos de alimentación", "Repetidos, sin líneas largas"]
      - ["Las realimentaciones", "De derecha a izquierda, por encima o por debajo"]
    exito: "Dibujadas así, un lector entrenado reconoce las configuraciones de un vistazo."
    pistas:
      - { texto: "Lo único que va de derecha a izquierda es la realimentación." }
    escalera:
      - "Entrada a la izquierda, salida a la derecha; positivo arriba, masa abajo."
    solucion: "Señal a la derecha, positivo arriba, alimentaciones repetidas, realimentación de vuelta."

  - id: prediga-contra
    tipo: predecir
    titulo: "Contra las convenciones"
    texto: "Un circuito correcto se dibuja sin respetar las convenciones. ¿Qué se obtiene?"
    libro: [84, 85]
    widget:
      tipo: circuito
      esquema: divisor
      piezas: { fuente: V_in, arriba: R_1, abajo: R_2 }
      lectura: { valor: V_out, rotulo: "Nodo central" }
      mide: { salida: V_out, corriente: I }
      ocultar: true
      mandos: []
    opciones:
      - texto: "Un esquema que hay que analizar en lugar de leer"
        bien: true
        porque: "No es incorrecto: es lento. El lector ya no reconoce las configuraciones de un vistazo."
      - texto: "Un esquema eléctricamente incorrecto"
        porque: "Las conexiones siguen siendo las mismas: el circuito es correcto, solo cuesta leerlo."
      - texto: "Lo mismo: las convenciones son estética"
        porque: "No son estética: unas disposiciones se leen y otras no."
    escalera:
      - "Las convenciones no cambian las conexiones."
    solucion: "Un esquema correcto que hay que analizar, no leer."

  - id: estime-hojas
    tipo: pregunta
    fase: "Estime"
    titulo: "¿Cuántas hojas?"
    texto: "Un circuito tiene 120 componentes. Con la densidad máxima recomendada por hoja A4, ¿cuántas hojas necesita como mínimo?"
    libro: [92, 93]
    fijar: { N_c: 120 }
    estimar:
      objetivo: "h_min"
      unidad: ""
      min: 1
      max: 12
      paso: 1
      inicio: 10
      tol: 0.1
      rotulo: "Hojas A4"
    exito: "Tres hojas, repartidas por función: reducir los símbolos no es la respuesta."
    pistas:
      - { cuando: { valor: estimacion, mayor: 3 }, texto: "Se ha pasado: caben hasta cuarenta componentes por hoja." }
      - { texto: "Se ha quedado corto: más de cuarenta por hoja la hace ilegible." }
    escalera:
      - "La referencia es de veinte a cuarenta componentes por hoja A4."
    solucion: "120 componentes, cuarenta por hoja: 3 hojas."
    comprobar:
      - { h_min: 3 }

  - id: evitar
    tipo: pregunta
    fase: "Empareje"
    titulo: "Lo que hay que evitar"
    texto: "Una cada defecto con su problema."
    libro: [95, 96, 98, 99]
    emparejar:
      - ["Líneas que cruzan sin necesidad", "Cada cruce es una oportunidad de confusión"]
      - ["Símbolos girados", "Boca abajo o en diagonal cuesta reconocerlos"]
      - ["Mezclar convenciones", "ANSI e IEC en el mismo esquema"]
      - ["Componentes lejos de su función", "El desacoplo en la otra esquina"]
    exito: "Reordenando los componentes casi siempre desaparecen los cruces."
    pistas:
      - { texto: "Los símbolos se dibujan horizontales o verticales, con su orientación habitual." }
    escalera:
      - "Un defecto es de geometría, otro de familias de símbolos, otro de cercanía."
    solucion: "Cruces–confusión; girados–reconocerlos; mezclar–ANSI e IEC; lejos–desacoplo en la esquina."

  - id: por-que-desacoplo
    tipo: porque
    titulo: "El desacoplo, junto al chip"
    texto: "Eléctricamente, el condensador de desacoplo daría igual en cualquier punto de la red. ¿Por qué se dibuja junto al chip?"
    libro: [99]
    widget:
      tipo: circuito
      esquema: divisor
      piezas: { fuente: V_in, arriba: R_1, abajo: R_2 }
      lectura: { valor: V_out, rotulo: "Nodo central" }
      mide: { salida: V_out, corriente: I }
      mandos: []
    opciones:
      - texto: "Porque es donde irá en la placa"
        bien: true
        porque: "El dibujo cuenta su función y recuerda a quien traza la placa que ese condensador va pegado al chip."
      - texto: "Porque así funciona mejor"
        porque: "En el esquema da igual dónde se dibuje: las conexiones son las mismas. Es una cuestión de legibilidad."
      - texto: "Porque la herramienta lo exige"
        porque: "La herramienta no lo exige; es una convención para que el esquema se entienda."
    escalera:
      - "Piense en quién lee el esquema después: el que diseña la placa."
    solucion: "Dibujado junto al chip, dice dónde debe ir en la placa."

  - id: valor-completo
    tipo: pregunta
    titulo: "Un valor completo"
    texto: "¿Cuál de estas anotaciones de un condensador está completa?"
    libro: [102]
    widget:
      tipo: circuito
      esquema: divisor
      piezas: { fuente: V_in, arriba: R_1, abajo: R_2 }
      lectura: { valor: V_out, rotulo: "Nodo central" }
      mide: { salida: V_out, corriente: I }
      mandos: []
    opciones:
      - texto: "«100 nF / 50 V / X7R»"
        bien: true
        porque: "Valor, tensión y dieléctrico: lo que hace falta donde importa."
      - texto: "«100n»"
        porque: "Solo da el valor: faltan la tensión y el dieléctrico."
      - texto: "«100 nF / 50 V»"
        porque: "Falta el dieléctrico, que decide cómo se comporta el cerámico."
    escalera:
      - "Un condensador necesita valor, tensión y dieléctrico."
    solucion: "«100 nF / 50 V / X7R»."

  - id: incluir
    tipo: pregunta
    fase: "Empareje"
    titulo: "Lo que hay que incluir"
    texto: "Una cada elemento con lo que aporta."
    libro: [101, 104, 105]
    emparejar:
      - ["Bloque de título", "Revisión: evita fabricar la versión equivocada"]
      - ["Tensiones esperadas", "Convierten la depuración en una comparación"]
      - ["Notas de diseño", "Las decisiones que no son obvias"]
    exito: "Las notas guardan la información que dentro de un año no estará en ninguna otra parte."
    pistas:
      - { texto: "La revisión va en el bloque de título." }
    escalera:
      - "Las notas explican el porqué; las tensiones, qué debe medirse."
    solucion: "Título–revisión; tensiones–comparar; notas–decisiones no obvias."

  - id: prueba-legibilidad
    tipo: pregunta
    titulo: "La prueba de legibilidad"
    texto: "Alguien que no hizo el esquema lo mira cinco minutos, sin ayuda. ¿Qué debe poder hacer?"
    libro: [107, 108]
    widget:
      tipo: circuito
      esquema: divisor
      piezas: { fuente: V_in, arriba: R_1, abajo: R_2 }
      lectura: { valor: V_out, rotulo: "Nodo central" }
      mide: { salida: V_out, corriente: I }
      mandos: []
    opciones:
      - texto: "Ver los bloques, seguir la señal y localizar la alimentación"
        bien: true
        porque: "Si no puede, el problema es del dibujo, no del lector."
      - texto: "Calcular la tensión de cada nodo"
        porque: "Eso es análisis, no lectura: la prueba pide reconocer bloques, señal y alimentación."
      - texto: "Saber el fabricante de cada pieza"
        porque: "Eso está en la lista de materiales; la prueba es de legibilidad del dibujo."
    escalera:
      - "Son tres cosas: bloques, camino de la señal, alimentación."
    solucion: "Identificar los bloques, seguir la señal y localizar la alimentación."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [87, 88, 92, 107]
    ideas:
      - { titulo: "Disposición.", texto: "Señal a la derecha, positivo arriba, alimentaciones repetidas, realimentación de vuelta." }
      - { titulo: "Densidad.", texto: "De veinte a cuarenta componentes por hoja; si no cabe, hojas por función." }
      - { titulo: "Incluir.", texto: "Título con revisión, valores completos, designadores, tensiones y notas." }
      - { titulo: "Legibilidad.", texto: "Si otro no lo entiende en cinco minutos, el problema es del dibujo." }
