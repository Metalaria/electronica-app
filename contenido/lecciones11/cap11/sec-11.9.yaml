# Lección de la sección 11.9 «Buenas Prácticas y Errores Frecuentes al Dibujar» (cap11). Formato: GUIA.md.
# Las etiquetas inconsistentes (VCC en un sitio y +5V en otro, bloque 227) se ven con el LED del libro (sección 5.4:
# LED rojo de 2,0 V a 20 mA desde 5 V, con 150 Ω): con los nombres distintos, el LED se queda sin alimentación.
# 1.2 (esquemas12d): el `led` con `etiqueta` (+5V, la de la fuente) y `etiqueta2` (VCC, la mal escrita del LED): el
# dibujo enseña las dos etiquetas y un toque en la del LED la corrige. 1.2.1 (aprender haciendo): apagar el LED con
# el nombre equivocado, ordenar tocando los defectos y las tres pasadas, tocar la práctica de RESET y el error que
# delata una etiqueta. Dos preguntas: por qué se apaga y lo que ningún ERC ve.
# 1.2.1, segunda pasada: sin listas de respuestas disfrazadas; quedan las tarjetas que se hacen y dos preguntas.
leccion: cap11/sec-11.9

libro:
  251: "Lo que hace ilegible un esquema frente a lo que lo hace"
  236: "Es la prueba de legibilidad de la sección 11.4 vista desde"
  239: "Los anteriores afectan a la legibilidad"
  246: "La revisión de un esquema propio antes de darlo por bueno"
  221: "Un esquema que funciona pero no se entiende es un esquema mal hecho"
  222: "Señales que van de derecha a izquierda"
  223: "Líneas que se cruzan innecesariamente"
  224: "Uniones ambiguas"
  225: "Componentes dispersos"
  226: "Anotaciones ausentes"
  227: "que el ERC detectará como dos redes distintas"
  229: "entradas a la izquierda, salidas a la derecha"
  230: "Agrupar por función"
  231: "Una señal etiquetada"
  232: "Poner el desacoplo junto a su integrado"
  234: "Incluir un bloque de título"
  237: "Si necesita preguntar más de dos cosas, el esquema no comunica."
  240: "Pines de entrada al aire"
  241: "Salidas conectadas entre sí"
  242: "Alimentaciones sin fuente"
  243: "Componentes polarizados sin polaridad indicada"
  244: "un símbolo con el patillaje equivocado"
  247: "Primera, de estructura"
  248: "Segunda, de conexiones"
  249: "Tercera, de anotaciones"
  250: "las tres pasadas encuentran lo que el ERC no puede ver"
  "cap05#133": "Alimentar un LED rojo de 2,0 V nominales a 20 mA desde 5 V."

modelo:
  valores:
    V_e: { sim: "+5V", nombre: "tensión de la fuente", unidad: V, valor: 5 }
    R_e: { sim: "R1", nombre: "resistencia del LED", unidad: Ω, valor: 150 }
    V_fe: { sim: "V_{f}", nombre: "tensión del LED", unidad: V, valor: 2 }
    igual: { tipo: interruptor, sim: "+5V", nombre: "la etiqueta del LED se llama como la de la fuente", valor: 1 }
    et2: { sim: "VCC", nombre: "etiqueta del LED mal escrita", unidad: "", valor: 0 }
  calculos:
    I_e: { expr: "igual*max(0, (V_e - V_fe)/R_e)", sim: "I", nombre: "corriente del LED", unidad: A }
    V_a: { expr: "igual*(V_e - I_e*R_e)", sim: "V_{LED}", nombre: "tensión del LED", unidad: V }

tarjetas:
  - id: explore-etiquetas
    tipo: explorar
    titulo: "Dos nombres, dos redes"
    texto: "La fuente se llama +5V y el LED cuelga de una etiqueta. Llámela VCC, por descuido, hasta que el LED se apague."
    nota: "El LED rojo del libro: 2,0 V a 20 mA desde 5 V."
    libro: [227, "cap05#133"]
    widget:
      tipo: circuito
      esquema: led
      piezas: { fuente: V_e, r: R_e, vf: V_fe, etiqueta: igual, etiqueta2: et2 }
      lectura: { valor: I_e, rotulo: "Corriente del LED" }
      corriente: I_e
      mide: { corriente: I_e, vf: V_a }
      mandos:
        - { valor: igual, tipo: interruptor, rotulo: "Etiqueta del LED: +5V" }
    objetivo:
      condiciones:
        - { valor: I_e, max: 0.000001, rotulo: "LED: {{I_e}}" }
      logrado: "Con VCC en un sitio y +5V en otro, el LED se queda sin alimentación: el ERC los ve como dos redes."
      pistas:
        - { texto: "Cambie el nombre de la etiqueta del LED." }
    escalera:
      - "Un toque en la etiqueta del LED, o el interruptor de debajo, cambia su nombre."
    solucion: "Etiqueta del LED en VCC: el LED se apaga."
    comprobar:
      - { con: { igual: 0 }, I_e: 0 }
      - { I_e: 0.02 }

  - id: por-que-dos-redes
    tipo: porque
    titulo: "¿Por qué se apaga?"
    texto: "Para quien lo dibujó, VCC y +5V eran la misma señal. ¿Por qué el LED se queda sin alimentación?"
    libro: [227]
    widget:
      tipo: circuito
      esquema: led
      piezas: { fuente: V_e, r: R_e, vf: V_fe, etiqueta: igual, etiqueta2: et2 }
      lectura: { valor: I_e, rotulo: "Corriente del LED" }
      corriente: I_e
      mide: { corriente: I_e, vf: V_a }
      mandos: []
    opciones:
      - texto: "Para la herramienta, dos nombres son dos redes distintas"
        bien: true
        porque: "La herramienta conecta por el nombre, no por la intención. El ERC las detectará como dos redes."
      - texto: "Porque VCC es de bipolares y el LED no lo es"
        porque: "El nombre no cambia la electricidad: lo que cuenta es que no coincide con el otro."
      - texto: "Porque el LED está al revés"
        porque: "El LED está bien; lo que no llega es la alimentación, por la etiqueta."
    escalera:
      - "¿Cómo sabe la herramienta que dos puntos están unidos sin línea?"
    solucion: "Nombres distintos son redes distintas: el LED queda sin fuente."

  - id: prediga-patillaje
    tipo: tocar
    titulo: "Lo que ningún ERC ve"
    texto: "Un símbolo tiene el patillaje equivocado y el ERC no dice nada. Toque dónde lo sitúa la figura."
    libro: [244, 251]
    widget:
      tipo: figura
      figura: fig-11.11
      zonas:
        - { id: ilegible, rotulo: "Recuadro «Lo que lo hace ilegible»", rect: [4, 4, 220, 148] }
        - { id: util, rotulo: "Recuadro «Lo que lo hace útil»", rect: [230, 4, 220, 148] }
        - { id: prueba, rotulo: "Recuadro «Prueba de legibilidad»", rect: [4, 160, 272, 82] }
        - { id: erc, rotulo: "Recuadro «Lo que ningún ERC detecta»", rect: [284, 160, 166, 82] }
    tocar:
      bien: [erc]
      porque:
        ilegible: "Esos errores afean el esquema, pero se ven."
        util: "Son buenas prácticas, no errores."
        prueba: "La prueba de legibilidad no revisa patillas."
    exito: "El esquema es coherente y la placa, inservible."
    escalera:
      - "Ninguna herramienta compara el símbolo con el componente real."
    solucion: "Lo que ningún ERC detecta."

  - id: tres-preguntas
    tipo: tocar
    titulo: "La prueba de legibilidad"
    texto: "Un compañero necesita preguntarle tres cosas para entender su esquema. Toque lo que dice la figura."
    libro: [236, 237, 251]
    widget:
      tipo: figura
      figura: fig-11.11
      zonas:
        - { id: ilegible, rotulo: "Recuadro «Lo que lo hace ilegible»", rect: [4, 4, 220, 148] }
        - { id: util, rotulo: "Recuadro «Lo que lo hace útil»", rect: [230, 4, 220, 148] }
        - { id: prueba, rotulo: "Recuadro «Prueba de legibilidad»", rect: [4, 160, 272, 82] }
        - { id: erc, rotulo: "Recuadro «Lo que ningún ERC detecta»", rect: [284, 160, 166, 82] }
    tocar:
      bien: [prueba]
      porque:
        ilegible: "Es la lista de errores, no la prueba."
        util: "Es la lista de buenas prácticas."
        erc: "El ERC no mide si el esquema comunica."
    exito: "Si necesita preguntar más de dos cosas, el esquema no comunica."
    escalera:
      - "Busque la prueba con otra persona."
    solucion: "La prueba de legibilidad."

  - id: desacoplo
    tipo: tocar
    titulo: "Junto a su integrado"
    texto: "Dibuja el condensador de desacoplo junto a su integrado, aunque eléctricamente daría igual. Toque dónde lo sitúa la figura."
    libro: [232, 251]
    widget:
      tipo: figura
      figura: fig-11.11
      zonas:
        - { id: ilegible, rotulo: "Recuadro «Lo que lo hace ilegible»", rect: [4, 4, 220, 148] }
        - { id: util, rotulo: "Recuadro «Lo que lo hace útil»", rect: [230, 4, 220, 148] }
    tocar:
      bien: [util]
      porque:
        ilegible: "Al revés: es una buena práctica."
    exito: "El dibujo dice a quién desacopla, aunque eléctricamente dé igual."
    escalera:
      - "¿Ayuda a entenderlo?"
    solucion: "Lo que lo hace útil."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [221, 227, 244, 250, 222, 223, 224, 225, 226, 229, 230, 231, 232, 234, 236, 237, 239, 240, 241, 242, 243, 246, 247, 248, 249]
    ideas:
      - { titulo: "Comunicar.", texto: "Un esquema que no se entiende está mal hecho, aunque funcione." }
      - { titulo: "Etiquetas coherentes.", texto: "VCC y +5V son dos redes para la herramienta." }
      - { titulo: "Lo que el ERC no ve.", texto: "Un patillaje equivocado da un esquema coherente y una placa inservible." }
      - { titulo: "Tres pasadas.", texto: "Estructura, conexiones, anotaciones; después, el ERC." }
