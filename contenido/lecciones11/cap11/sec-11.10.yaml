# Lección 1.2 de la sección 11.10 «Criterios Cuantitativos» (cap11). Formato: contenido/lecciones11/GUIA.md.
# La potencia que hay que anotar se calcula con el ejemplo del libro (sección 1.1: 220 Ω con 12 V, 0,655 W) y el
# esquema «resistencia». Paso práctico: «ajuste» (subir R hasta que una 0603 de 0,1 W baste sin anotar la potencia).
# Los 12 V del cerámico de la estimación son un ejemplo.
leccion: cap11/sec-11.10

libro:
  254: "cuantitativamente suficiente"
  256: "Valor, tensión y dieléctrico"
  257: "si al comprar hay que decidir algo, falta una anotación"
  259: "anotarla siempre que supere 1/8 W, o antes si el encapsulado previsto es más pequeño (0,1 W en 0603, 1/16 W en 0402)"
  260: "al menos el doble de la tensión de trabajo en cerámicos de clase 2"
  261: "que se sabe con un barrido paramétrico"
  262: "la saturación no aparece en el símbolo"
  265: "Tensiones de nodo"
  266: "Formas de onda"
  267: "Los márgenes de ajuste"
  268: "temperatura, carga, alimentación"
  271: "intentar hacer el pedido de componentes usando solo el esquema"
  "cap01#33": "Una resistencia de 220 Ω se conecta a una fuente de 12 V."

modelo:
  valores:
    V_r: { sim: "V", nombre: "tensión de la fuente", unidad: V, valor: 12 }
    R_r: { sim: "R", nombre: "resistencia", unidad: Ω, valor: 220 }
    V_t: { sim: "V_{trabajo}", nombre: "tensión de trabajo del condensador", unidad: V, valor: 12 }
  calculos:
    I_r: { expr: "V_r/R_r", sim: "I", nombre: "corriente", unidad: A }
    P_r: { expr: "V_r^2/R_r", sim: "P", nombre: "potencia disipada", unidad: W }
    V_cn: { expr: "2*V_t", sim: "V_{nominal}", nombre: "tensión nominal mínima del cerámico", unidad: V }

tarjetas:
  - id: explore-potencia
    tipo: explorar
    titulo: "Cuánto disipa"
    texto: "Con 12 V, cambie la resistencia y mire la potencia que disipa."
    libro: [254, 259, "cap01#33"]
    fijar: { V_r: 12 }
    widget:
      tipo: circuito
      esquema: resistencia
      piezas: { fuente: V_r, r: R_r }
      lectura: { valor: P_r, rotulo: "Potencia" }
      datos:
        - { valor: I_r, rotulo: "Corriente: {{I_r}}" }
      corriente: I_r
      mide: { corriente: I_r, tension: V_r }
      mandos:
        - { valor: R_r, serie: E12, min: 100, max: 10000, rotulo: "R (E12)" }

  - id: prediga-220
    tipo: predecir
    titulo: "¿Hay que anotarla?"
    texto: "Una resistencia de 220 Ω se conecta a 12 V. ¿Hay que anotar su potencia en el esquema?"
    libro: [259, "cap01#33"]
    fijar: { V_r: 12, R_r: 220 }
    widget:
      tipo: circuito
      esquema: resistencia
      piezas: { fuente: V_r, r: R_r }
      lectura: { valor: P_r, rotulo: "Potencia" }
      corriente: I_r
      mide: { corriente: I_r, tension: V_r }
      ocultar: true
      mandos: []
    opciones:
      - texto: "Sí: disipa 0,655 W, mucho más de 1/8 W"
        bien: true
        porque: "Se anota siempre que supere 1/8 W, y se calcula con el peor caso."
      - texto: "No: la potencia nunca se anota"
        porque: "Se anota cuando supera 1/8 W, o antes con encapsulados pequeños."
      - texto: "No: una resistencia de 220 Ω es pequeña"
        porque: "Lo que decide es la potencia, no el valor: con 12 V, 220 Ω disipan 0,655 W."
    escalera:
      - "P = V²/R."
    solucion: "144 / 220 = 0,655 W: más de 1/8 W, se anota."
    comprobar:
      - { P_r: 0.655, tol: 0.002 }

  - id: ajuste-0603
    tipo: ajuste
    titulo: "Que baste una 0603"
    texto: "La placa usa resistencias 0603, de 0,1 W. Suba R hasta que no haga falta anotar la potencia."
    libro: [259]
    fijar: { V_r: 12 }
    inicio: { R_r: 220 }
    widget:
      tipo: circuito
      esquema: resistencia
      piezas: { fuente: V_r, r: R_r }
      lectura: { valor: P_r, rotulo: "Potencia" }
      corriente: I_r
      mide: { corriente: I_r, tension: V_r }
      mandos:
        - { valor: R_r, serie: E12, min: 100, max: 10000, rotulo: "R (E12)" }
    ajuste:
      valor: P_r
      min: 0
      max: 0.1
      rotulo: "Potencia frente a 0,1 W"
      escala: { min: 0, max: 0.8 }
      bajo: "Por debajo: no hace falta anotarla."
      alto: "Disipa demasiado para una 0603: suba R."
      dentro: "Por debajo de 0,1 W: la 0603 basta y no hace falta anotarla."

  - id: minimo
    tipo: pregunta
    fase: "Empareje"
    titulo: "Lo mínimo de cada uno"
    texto: "Una cada componente con lo mínimo que debe llevar anotado."
    libro: [256]
    emparejar:
      - ["Resistencia", "Valor; tolerancia si es de precisión"]
      - ["Condensador", "Valor, tensión y dieléctrico"]
      - ["Bobina", "Valor y corriente de saturación"]
      - ["Integrado", "Referencia con sufijo"]
      - ["Conector", "Tipo y paso"]
    exito: "El criterio que lo unifica: si al comprar hay que decidir algo, falta una anotación."
    pistas:
      - { texto: "Del conector importan el tipo y el paso." }
    escalera:
      - "La bobina se satura: hay que dar su corriente."
    solucion: "Resistencia–valor y tolerancia; condensador–tensión y dieléctrico; bobina–saturación; integrado–sufijo; conector–tipo y paso."

  - id: estime-ceramico
    tipo: pregunta
    fase: "Estime"
    titulo: "La tensión del cerámico"
    texto: "Un cerámico de clase 2 trabaja a 12 V. ¿Qué tensión nominal mínima debe anotarse?"
    nota: "Tensión de trabajo de ejemplo."
    libro: [260]
    fijar: { V_t: 12 }
    estimar:
      objetivo: "V_cn"
      unidad: V
      min: 0
      max: 60
      paso: 1
      inicio: 50
      tol: 0.05
      rotulo: "Tensión nominal"
    exito: "24 V como mínimo: al menos el doble de la de trabajo."
    pistas:
      - { cuando: { valor: estimacion, mayor: 25 }, texto: "Se ha pasado: basta con el doble de la tensión de trabajo." }
      - { texto: "Se ha quedado corto: hace falta al menos el doble." }
    escalera:
      - "Al menos el doble de la tensión de trabajo."
    solucion: "2 · 12 V = 24 V."
    comprobar:
      - { V_cn: 24 }

  - id: por-que-doble
    tipo: porque
    titulo: "¿Por qué el doble?"
    texto: "Un cerámico de clase 2 a la mitad de su tensión nominal. ¿Por qué tanto margen?"
    libro: [260]
    widget:
      tipo: circuito
      esquema: resistencia
      piezas: { fuente: V_r, r: R_r }
      lectura: { valor: P_r, rotulo: "Potencia" }
      mide: { corriente: I_r, tension: V_r }
      mandos: []
    opciones:
      - texto: "Porque pierde capacidad con la tensión aplicada"
        bien: true
        porque: "Cerca de su tensión nominal le queda mucha menos capacidad de la marcada."
      - texto: "Porque a la tensión nominal explota"
        porque: "La razón del doble no es la rotura: es la capacidad que pierde con la tensión."
      - texto: "Porque la norma lo exige en todos los condensadores"
        porque: "La regla es para los cerámicos de clase 2, por su pérdida de capacidad."
    escalera:
      - "La capacidad de un cerámico de clase 2 cambia con la tensión."
    solucion: "Pierde capacidad con la tensión aplicada."

  - id: umbrales
    tipo: pregunta
    fase: "Empareje"
    titulo: "Cuándo anotarlo"
    texto: "Una cada dato con el umbral que obliga a anotarlo."
    libro: [259, 260, 261, 262]
    emparejar:
      - ["Potencia", "Si supera 1/8 W, con el peor caso"]
      - ["Tensión de un cerámico de clase 2", "Al menos el doble de la de trabajo"]
      - ["Tolerancia", "Cuando lo pida un barrido paramétrico"]
      - ["Corriente de una bobina", "Siempre: la saturación no se ve"]
    exito: "En el resto de las resistencias basta la tolerancia estándar."
    pistas:
      - { texto: "La bobina se anota siempre." }
    escalera:
      - "Solo la tolerancia depende de lo que diga un barrido paramétrico."
    solucion: "Potencia–1/8 W; cerámico–doble; tolerancia–barrido; bobina–siempre."

  - id: contexto
    tipo: pregunta
    fase: "Empareje"
    titulo: "Las anotaciones de contexto"
    texto: "Una cada anotación con lo que aporta."
    libro: [265, 266, 267, 268]
    emparejar:
      - ["Tensiones de nodo", "El diagnóstico pasa a comparar"]
      - ["Formas de onda", "En los puntos de prueba, si es dinámico"]
      - ["Márgenes de ajuste", "De cada potenciómetro"]
      - ["Condiciones", "Temperatura, carga y alimentación"]
    exito: "Sin las condiciones, una cifra no dice en qué caso vale."
    pistas:
      - { texto: "Las condiciones dicen cuándo valen las cifras." }
    escalera:
      - "Las formas de onda solo hacen falta si el circuito es dinámico."
    solucion: "Tensiones–comparar; ondas–puntos de prueba; márgenes–potenciómetros; condiciones–temperatura, carga, alimentación."

  - id: suficiencia
    tipo: pregunta
    titulo: "Si no hay a quién dárselo"
    texto: "La prueba de suficiencia es dar el esquema a alguien para que lo construya. ¿Y si trabaja solo?"
    libro: [271]
    widget:
      tipo: circuito
      esquema: resistencia
      piezas: { fuente: V_r, r: R_r }
      lectura: { valor: P_r, rotulo: "Potencia" }
      mide: { corriente: I_r, tension: V_r }
      mandos: []
    opciones:
      - texto: "Intente hacer el pedido de componentes con solo el esquema"
        bien: true
        porque: "Cada vez que tenga que decidir algo al comprar, falta una anotación."
      - texto: "Repase el esquema de memoria"
        porque: "De memoria se rellena lo que falta sin darse cuenta: el pedido lo pone a prueba."
      - texto: "Pase el ERC"
        porque: "El ERC no sabe si falta una tensión o un dieléctrico."
    escalera:
      - "¿Qué tarea obliga a decidir cada dato?"
    solucion: "Hacer el pedido usando solo el esquema."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [257, 259, 260, 271]
    ideas:
      - { titulo: "Lo mínimo.", texto: "Si al comprar hay que decidir algo, falta una anotación." }
      - { titulo: "Potencia.", texto: "Por encima de 1/8 W, o de 0,1 W en 0603: se anota." }
      - { titulo: "Cerámicos de clase 2.", texto: "Al menos el doble de la tensión de trabajo." }
      - { titulo: "Suficiencia.", texto: "Haga el pedido solo con el esquema." }
