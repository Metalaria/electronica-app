# Lección de la sección 11.11 «Problemas de Diseño» (cap11): problemas 11.A (qué encuentra el ERC) y 11.B
# (etiquetas de red o hilos dibujados). Formato: contenido/lecciones11/GUIA.md.
# La etiqueta mal escrita se ve con el divisor del libro y su carga (sección 1.4: 12 V, 10 kΩ, 5 kΩ y 10 kΩ): el
# interruptor de la carga es la etiqueta «SALIDA» escrita igual o con una errata en el otro extremo. 1.2.1 (aprender
# haciendo): la errata deja la carga suelta, se tocan los errores que el ERC no ve, se calcula la cobertura, se corrige
# el símbolo del LED, se tocan los casos de etiqueta y la red que delata la errata. Dos preguntas: fabricar y RESET_.
# 1.2.1, segunda pasada: sin listas de respuestas disfrazadas; quedan las tarjetas que se hacen y dos preguntas.
# 1.3 (contenido13b): +medir la salida que delata la errata (4,00 V en vacío) y +medir la alimentación primero
# (bloque 291) antes de corregir el símbolo: 3/5 → 5/7.
leccion: cap11/sec-11.11

libro:
  301: "La regla que funciona"
  305: "Resultado"
  280: "Qué encuentra el ERC y qué no"
  282: "Un esquema pasa la comprobación de reglas eléctricas sin ningún aviso"
  285: "Dos pines de salida conectados entre sí"
  286: "cobertura del ERC"
  287: "Y la mitad que no cubre es la peor"
  289: "Revisar la asignación de pines"
  291: "Comprueba las alimentaciones primero, antes que nada"
  292: "el ERC cubre la mitad de los errores"
  293: "Etiquetas de red o hilos dibujados"
  300: "Si cada una tiene dos, el ERC no dice nada"
  302: "Hilos dibujados para las conexiones locales dentro de un bloque funcional"
  304: "ordénala por número de nodos"
  "cap01#103": "4,00 V en vacío y 3,00 V con 10 kΩ conectados"

modelo:
  valores:
    V_in: { sim: "V_{entrada}", nombre: "tensión de la pila", unidad: V, valor: 12 }
    R_1: { sim: "R1", nombre: "resistencia de arriba", unidad: Ω, valor: 10000 }
    R_2: { sim: "R2", nombre: "resistencia de abajo", unidad: Ω, valor: 5000 }
    R_L: { sim: "R3", nombre: "carga", unidad: Ω, valor: 10000 }
    igual: { tipo: interruptor, sim: "SALIDA", nombre: "etiqueta escrita igual en los dos extremos", valor: 1 }
    et2: { sim: "SALIDA_", nombre: "etiqueta con la errata", unidad: "", valor: 0 }
    V_l: { sim: "+5V", nombre: "tensión de la fuente del LED", unidad: V, valor: 5 }
    R_l: { sim: "R4", nombre: "resistencia del LED", unidad: Ω, valor: 150 }
    Vf_l: { sim: "V_{f}", nombre: "caída del LED", unidad: V, valor: 2 }
    rev_l: { tipo: interruptor, nombre: "ánodo y cátodo cambiados en el símbolo", valor: 1 }
    n_det: { sim: "detectados", nombre: "errores que detecta el ERC", unidad: "", valor: 4 }
    n_tot: { sim: "total", nombre: "errores habituales", unidad: "", valor: 8 }
  calculos:
    R_ab: { si: igual, entonces: "par(R_2, R_L)", sino: "R_2", sim: "R_{abajo}", nombre: "resistencia de la rama de abajo", unidad: Ω }
    V_out: { expr: "V_in*R_ab/(R_1 + R_ab)", sim: "V_{salida}", nombre: "tensión de salida", unidad: V }
    I: { expr: "V_in/(R_1 + R_ab)", sim: "I", nombre: "corriente", unidad: A }
    I_L: { si: igual, entonces: "V_out/R_L", sino: "0", sim: "I_{L}", nombre: "corriente de la carga", unidad: A }
    I_l: { expr: "(1 - rev_l)*max(0, (V_l - Vf_l)/R_l)", sim: "I", nombre: "corriente del LED", unidad: A }
    cob: { expr: "100*n_det/n_tot", sim: "cobertura", nombre: "cobertura del ERC", unidad: "%" }

tarjetas:
  - id: explore-errata
    tipo: explorar
    titulo: "Una errata en la etiqueta"
    texto: "La carga R3 se une a la salida con la etiqueta SALIDA. Escríbala SALIDA_ en un extremo hasta dejar R3 sin corriente."
    libro: [300, "cap01#103"]
    widget:
      tipo: circuito
      esquema: divisor
      piezas: { fuente: V_in, arriba: R_1, abajo: R_2, carga: R_L, etiqueta: igual, etiqueta2: et2 }
      lectura: { valor: V_out, rotulo: "Tensión de salida" }
      datos:
        - { valor: I_L, rotulo: "Corriente de R3: {{I_L}}" }
      corriente: I
      mide: { salida: V_out, corriente: I, carga: I_L }
      mandos:
        - { valor: igual, tipo: interruptor, rotulo: "SALIDA igual en los dos extremos" }
    objetivo:
      condiciones:
        - { valor: I_L, max: 0.0000001, rotulo: "R3: {{I_L}}" }
      logrado: "Una errata y R3 queda en otra red: la salida sube a {{V_out}}, sin que el dibujo cambie."
      pistas:
        - { texto: "Cambie el nombre de la etiqueta en uno de los extremos." }
    escalera:
      - "Dos nombres distintos son dos redes."
    solucion: "SALIDA_ en un extremo: R3 deja de recibir corriente."
    comprobar:
      - { con: { igual: 0 }, I_L: 0 }

  - id: mida-errata
    tipo: medir
    titulo: "Lo que delata la errata"
    texto: "Con SALIDA_ en un extremo, el dibujo sigue pareciendo correcto. Ponga las puntas donde una medida delata que R3 no está conectada."
    libro: [300, "cap01#103"]
    fijar: { igual: 0 }
    widget:
      tipo: circuito
      esquema: divisor
      piezas: { fuente: V_in, arriba: R_1, abajo: R_2, carga: R_L, etiqueta: igual, etiqueta2: et2 }
      mide: { salida: V_out, corriente: I, carga: I_L }
      instrumento:
        tipo: multimetro
        modos: [V]
        puntos: [fte, salida, "0"]
      mandos: []
    medir:
      magnitud: tension
      entre: [salida, "0"]
      valor: V_out
      porque:
        fte: "Esa es la pila: 12 V con o sin carga. La que cambia es la salida."
    exito: "{{V_out}}: la salida en vacío, no los 3,00 V con R3. La errata dejó la carga en otra red."
    escalera:
      - "Con la carga conectada, la salida baja a 3,00 V."
    solucion: "Roja en la salida y negra en masa: 4,00 V, como sin carga."
    comprobar:
      - { V_out: 4, I_L: 0 }

  - id: formula-cobertura
    tipo: simular
    titulo: "La cobertura"
    texto: "De los ocho errores habituales del problema, el ERC detecta cuatro. Escriba su cobertura."
    libro: [286, 292]
    simular:
      objetivo: cob
      unidad: "%"
      tol: 0.02
      rotulo: "Cobertura del ERC"
      errores:
        - { expr: "n_det", texto: "Esos son los errores que detecta; la cobertura es la fracción del total, en porcentaje." }
    exito: "El 50 %: la otra mitad exige revisión manual estructurada."
    escalera:
      - "Cuatro de ocho, en porcentaje."
    solucion: "4/8 = 50 %."
    comprobar:
      - { cob: 50 }

  - id: prediga-fabricar
    tipo: predecir
    titulo: "Sin ningún aviso"
    texto: "Un esquema pasa el ERC sin un solo aviso. ¿Se puede fabricar ya la placa?"
    libro: [282, 292]
    widget:
      tipo: circuito
      esquema: divisor
      piezas: { fuente: V_in, arriba: R_1, abajo: R_2, carga: R_L, etiqueta: igual, etiqueta2: et2 }
      lectura: { valor: V_out, rotulo: "Tensión de salida" }
      mide: { salida: V_out, corriente: I, carga: I_L }
      ocultar: true
      mandos: []
    opciones:
      - texto: "Todavía no: el ERC cubre solo la mitad de los errores"
        bien: true
        porque: "La otra mitad exige una revisión manual estructurada."
      - texto: "Sí: sin avisos no hay errores"
        porque: "Valores, polaridades, encapsulados y patillajes equivocados pasan el ERC sin avisos."
      - texto: "Solo si además pasa el DRC"
        porque: "El DRC comprueba la geometría de la placa; tampoco ve un valor o un patillaje equivocado."
    escalera:
      - "Recuerde qué cuatro errores del problema no ve el ERC."
    solucion: "No: el ERC cubre el 50 %; el resto exige revisión manual."
    comprobar:
      - { cob: 50 }

  - id: mida-alimentacion
    tipo: medir
    titulo: "Primero, la alimentación"
    texto: "El LED no enciende. Antes que nada, compruebe que llega la alimentación: ponga las puntas donde se ve."
    libro: [291]
    fijar: { rev_l: 1 }
    widget:
      tipo: circuito
      esquema: led
      piezas: { fuente: V_l, r: R_l, vf: Vf_l, reves: rev_l }
      mide: { corriente: I_l }
      instrumento:
        tipo: multimetro
        modos: [V]
      mandos: []
    medir:
      magnitud: tension
      entre: [fte, "0"]
      valor: V_l
      porque:
        an: "Ahí se mide lo que llega al LED tras la resistencia; la alimentación se comprueba en la fuente."
    exito: "Llegan los 5 V: la mayoría de los desastres son de polaridad o tensión equivocada, y esta vez la alimentación está bien. Queda el símbolo."
    escalera:
      - "La alimentación es la tensión de la fuente respecto a masa."
    solucion: "Roja arriba de la fuente y negra en masa: 5 V."
    comprobar:
      - { V_l: 5, I_l: 0 }

  - id: complemento
    tipo: explorar
    titulo: "El complemento"
    texto: "El símbolo de este LED tiene el ánodo y el cátodo cambiados, y el ERC no dice nada. Corríjalo contra la hoja de datos hasta que encienda."
    libro: [289]
    inicio: { rev_l: 1 }
    widget:
      tipo: circuito
      esquema: led
      piezas: { fuente: V_l, r: R_l, vf: Vf_l, reves: rev_l }
      lectura: { valor: I_l, rotulo: "Corriente del LED" }
      corriente: I_l
      mide: { corriente: I_l }
      mandos:
        - { valor: rev_l, tipo: interruptor, rotulo: "Ánodo y cátodo cambiados" }
    objetivo:
      condiciones:
        - { valor: I_l, min: 0.015, rotulo: "LED: {{I_l}}" }
      logrado: "Con los pines bien asignados, {{I_l}}. Ningún programa lo hace por usted: revise cada símbolo contra la hoja de datos."
      pistas:
        - { texto: "Deshaga el cambio de ánodo y cátodo." }
    escalera:
      - "Con el símbolo al revés, el LED queda polarizado en inverso."
    solucion: "Pines bien asignados: el LED enciende con 20 mA."
    comprobar:
      - { con: { rev_l: 0 }, I_l: 0.02 }

  - id: prediga-silencio
    tipo: predecir
    titulo: "11.B: RESET y RESET_"
    texto: "Una errata deja dos redes, RESET y RESET_, y cada una con dos pines. ¿Avisa el ERC?"
    libro: [293, 300]
    widget:
      tipo: circuito
      esquema: divisor
      piezas: { fuente: V_in, arriba: R_1, abajo: R_2, carga: R_L, etiqueta: igual, etiqueta2: et2 }
      lectura: { valor: V_out, rotulo: "Tensión de salida" }
      mide: { salida: V_out, corriente: I, carga: I_L }
      ocultar: true
      mandos: []
    opciones:
      - texto: "No: ninguna de las dos es de un solo nodo"
        bien: true
        porque: "El ERC no dice nada y la conexión sencillamente no existe."
      - texto: "Sí: detecta el nombre parecido"
        porque: "El ERC no compara nombres: solo cuenta nodos y tipos de pin."
      - texto: "Sí: siempre avisa de una etiqueta mal escrita"
        porque: "Solo si una de las redes queda con un único pin."
    escalera:
      - "¿Cuándo detecta el ERC una etiqueta mal escrita?"
    solucion: "No avisa: las dos redes tienen dos pines."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [280, 287, 289, 293, 300, 302, 285, 301, 304, 305]
    ideas:
      - { titulo: "11.A.", texto: "El ERC cubre la mitad de los errores, y la otra mitad es la peor." }
      - { titulo: "El complemento.", texto: "Patillaje contra la hoja de datos, recorrido en voz alta, otra persona." }
      - { titulo: "11.B.", texto: "Hilos dentro del bloque, etiquetas entre bloques." }
      - { titulo: "La lista de redes.", texto: "Ordenada por nodos, delata las erratas." }
