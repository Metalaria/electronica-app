# Lección de la sección 11.5 «Cómo Leer un Esquema: Método Sistemático» (cap11). Formato: contenido/lecciones11/GUIA.md.
# El esquema que se lee es la etapa en emisor común del libro (sección 6.5: 12 V, 47 kΩ, 10 kΩ, 3,3 kΩ, 1 kΩ,
# β = 150, V_E = 1,33 V). La alimentación de 6 V del primer mando es un ejemplo para ver que todo cuelga de ella.
# 1.2.1 (aprender haciendo): bajar la alimentación hasta un objetivo, ordenar los cinco pasos tocando, tocar en la
# figura 11.7 el paso de las hojas de datos, tocar el divisor en el esquema, contar el servicio de la criba, tocar los
# cruces sin conexión en la figura 11.3, predecir y medir el emisor. Dos preguntas: por qué primero y la discrepancia.
# 1.2.1, segunda pasada: sin listas de respuestas disfrazadas; quedan las tarjetas que se hacen y dos preguntas.
leccion: cap11/sec-11.5

libro:
  115: "El método que funciona tiene cinco pasos"
  120: "Buscar los integrados"
  123: "trazar el camino entre ambas"
  126: "La señal (los que procesan la información) y el servicio"
  137: "Los cinco pasos para leer un esquema"
  "cap11#54": "Obsérvese la distinción crucial entre un cruce con punto"
  114: "Es la peor forma de abordarlo"
  117: "identificar de dónde viene la energía"
  118: "la mayoría de los diagnósticos empiezan y terminan en la alimentación"
  121: "cada uno define una función"
  124: "Los condensadores de acoplo en serie marcan el camino de una señal de alterna"
  127: "Un condensador de 100 nF entre alimentación y masa junto a un chip es desacoplo"
  129: "ahí está la mitad de la información útil"
  131: "Dos líneas que se cruzan sin punto"
  132: "una etiqueta con el mismo nombre conecta puntos"
  133: "Suponer que la posición implica proximidad física."
  134: "los números son la única referencia válida"
  136: "se predice la tensión que debería haber"
  "cap11#306": "Describe los cinco pasos del método sistemático"
  "cap06#452": "R₁ = 47 kΩ, R₂ = 10 kΩ, RE = 1 kΩ, RC = 3,3 kΩ"
  "cap06#182": "Con VE = 1,33 V"

modelo:
  valores:
    n_t: { sim: "N", nombre: "componentes del esquema", unidad: "", valor: 60 }
    n_u: { sim: "n", nombre: "componentes que hacen algo", unidad: "", valor: 15 }
    V_cc: { sim: "V_{CC}", nombre: "alimentación", unidad: V, valor: 12 }
    R_p1: { sim: "R₁", nombre: "divisor, arriba", unidad: Ω, valor: 47000 }
    R_p2: { sim: "R₂", nombre: "divisor, abajo", unidad: Ω, valor: 10000 }
    R_pc: { sim: "R_{C}", nombre: "resistencia de colector", unidad: Ω, valor: 3300 }
    R_pe: { sim: "R_{E}", nombre: "resistencia de emisor", unidad: Ω, valor: 1000 }
    beta: { sim: "β", nombre: "ganancia de corriente", unidad: "", valor: 150 }
    V_BE: { sim: "V_{BE}", nombre: "tensión base-emisor", unidad: V, valor: 0.7 }
  calculos:
    n_s: { expr: "n_t - n_u", sim: "n_{servicio}", nombre: "componentes de servicio", unidad: "" }
    V_pth: { expr: "V_cc*R_p2/(R_p1 + R_p2)", sim: "V_{Th}", nombre: "tensión del divisor en vacío", unidad: V }
    R_pth: { expr: "par(R_p1, R_p2)", sim: "R_{Th}", nombre: "resistencia Thévenin del divisor", unidad: Ω }
    I_pb: { expr: "(V_pth - V_BE)/(R_pth + (beta + 1)*R_pe)", sim: "I_{B}", nombre: "corriente de base", unidad: A }
    I_pc: { expr: "beta*I_pb", sim: "I_{C}", nombre: "corriente de colector", unidad: A, cifras: 4 }
    V_pe: { expr: "(beta + 1)*I_pb*R_pe", sim: "V_{E}", nombre: "tensión de emisor", unidad: V }
    V_pb: { expr: "V_pe + V_BE", sim: "V_{B}", nombre: "tensión de base", unidad: V }
    V_pc: { expr: "V_cc - I_pc*R_pc", sim: "V_{C}", nombre: "tensión de colector", unidad: V }
    V_pce: { expr: "V_pc - V_pe", sim: "V_{CE}", nombre: "tensión colector-emisor", unidad: V }
    V_eth: { expr: "V_pth - V_BE", sim: "V_{E}", nombre: "emisor con el divisor en vacío", unidad: V }

tarjetas:
  - id: explore-alimentacion
    tipo: explorar
    titulo: "Paso 1: la alimentación"
    texto: "Primero, de dónde viene la energía. Baje V_{CC} hasta que el emisor quede por debajo de medio voltio."
    nota: "La etapa en emisor común del libro; los 6 V son de ejemplo."
    libro: [117, 118, "cap06#452"]
    widget:
      tipo: circuito
      esquema: bjt-polarizacion
      piezas: { vcc: V_cc, r1: R_p1, r2: R_p2, rc: R_pc, re: R_pe, beta: beta, vbe: V_BE }
      lectura: { valor: I_pc, rotulo: "Corriente de colector" }
      datos:
        - { valor: V_pb, rotulo: "Base: {{V_pb}}" }
        - { valor: V_pe, rotulo: "Emisor: {{V_pe}}" }
        - { valor: V_pc, rotulo: "Colector: {{V_pc}}" }
      corriente: I_pc
      mide: { ib: I_pb, ic: I_pc, vb: V_pb, ve: V_pe, vc: V_pc, vce: V_pce }
      mandos:
        - { valor: V_cc, lista: [6, 12], rotulo: "Alimentación" }
    objetivo:
      condiciones:
        - { valor: V_pe, max: 0.5, rotulo: "Emisor: {{V_pe}}" }
      logrado: "Base, emisor y colector han cambiado a la vez: todo cuelga de la alimentación."
      pistas:
        - { texto: "Elija la alimentación menor." }
    escalera:
      - "El mando de debajo cambia la alimentación."
    solucion: "Con 6 V, el emisor cae por debajo de medio voltio."
    comprobar:
      - { con: { V_cc: 6 }, V_pth: 1.0526 }

  - id: por-que-primero
    tipo: predecir
    titulo: "¿Por qué primero?"
    texto: "Todos los nodos han cambiado con la alimentación. ¿Por qué el método empieza localizándola?"
    libro: [118]
    widget:
      tipo: circuito
      esquema: bjt-polarizacion
      piezas: { vcc: V_cc, r1: R_p1, r2: R_p2, rc: R_pc, re: R_pe, beta: beta, vbe: V_BE }
      lectura: { valor: I_pc, rotulo: "Corriente de colector" }
      corriente: I_pc
      mide: { ib: I_pb, ic: I_pc, vb: V_pb, ve: V_pe, vc: V_pc, vce: V_pce }
      ocultar: true
      mandos: []
    opciones:
      - texto: "Porque la mayoría de los diagnósticos empiezan y terminan en ella"
        bien: true
        porque: "Saber qué raíles hay y qué alimenta cada uno orienta todo lo demás."
      - texto: "Porque es lo que está arriba a la izquierda"
        porque: "El orden no es el de lectura de un texto: la alimentación va primero por su peso en el diagnóstico."
      - texto: "Porque es el bloque más complicado"
        porque: "No es por complicada, sino porque de ella depende todo y es donde empiezan casi todas las averías."
    escalera:
      - "Piense en dónde empiezan casi todas las averías."
    solucion: "La mayoría de los diagnósticos empiezan y terminan en la alimentación."

  - id: integrados
    tipo: tocar
    titulo: "Por los integrados"
    texto: "Con tres o cuatro hojas de datos se tiene el diagrama de bloques sin trazar una conexión. Toque el paso que lo aprovecha."
    libro: [120, 121, 137]
    widget:
      tipo: figura
      figura: fig-11.7
      zonas:
        - { id: p1, rotulo: "Primer recuadro", rect: [2, 2, 82, 86] }
        - { id: p2, rotulo: "Segundo recuadro", rect: [94, 2, 82, 86] }
        - { id: p3, rotulo: "Tercer recuadro", rect: [186, 2, 82, 86] }
        - { id: p4, rotulo: "Cuarto recuadro", rect: [278, 2, 82, 86] }
        - { id: p5, rotulo: "Quinto recuadro", rect: [370, 2, 82, 86] }
    tocar:
      bien: [p2]
      porque:
        p1: "Ese es la alimentación: qué raíles hay y qué alimenta cada uno."
        p3: "Ese sigue la señal a través de los bloques que ya están identificados."
        p4: "Ese aparta el servicio; los integrados ya se han usado antes."
        p5: "Ese lee las notas y el bloque de título."
    exito: "Cada integrado define una función, y su referencia se puede buscar: por eso son el mejor punto de partida."
    escalera:
      - "¿En qué paso se buscan las funciones reconocibles?"
    solucion: "El segundo: identificar los bloques."

  - id: camino
    tipo: elegir
    titulo: "Dónde se ajusta el nivel"
    texto: "Los divisores marcan dónde se ajusta el nivel de una señal. Toque las piezas que forman el divisor de esta etapa."
    libro: [124]
    widget:
      tipo: circuito
      esquema: bjt-polarizacion
      piezas: { vcc: V_cc, r1: R_p1, r2: R_p2, rc: R_pc, re: R_pe, beta: beta, vbe: V_BE }
      corriente: I_pc
      mide: { ib: I_pb, ic: I_pc, vb: V_pb, ve: V_pe, vc: V_pc, vce: V_pce }
      mandos: []
    elegir:
      zonas: [r1, r2, rc, re, transistor]
      bien: [r1, r2]
      todas: true
      porque:
        rc: "La resistencia de colector convierte la corriente en tensión de salida; no divide la alimentación."
        re: "La de emisor estabiliza el punto de trabajo; no forma el divisor."
        transistor: "El transistor es el que amplifica; el divisor le fija la base."
    exito: "R₁ y R₂ reparten la alimentación y fijan la base. Los condensadores de acoplo en serie marcarían el camino de la alterna."
    escalera:
      - "Un divisor son dos resistencias en serie entre la alimentación y masa."
    solucion: "R₁ y R₂, las dos de la base."

  - id: servicio
    tipo: simular
    titulo: "La criba"
    texto: "Con la criba, un esquema de sesenta componentes se reduce a quince que hacen algo. ¿Cuántos ha apartado como servicio?"
    libro: [126, 127, 137]
    widget:
      tipo: figura
      figura: fig-11.7
      zonas:
        - { id: criba, rotulo: "El paso cuatro: la criba", rect: [2, 98, 280, 122] }
    simular:
      objetivo: n_s
      unidad: ""
      tol: 0.02
      rotulo: "Componentes de servicio"
      errores:
        - { expr: "n_u", texto: "Esos quince son los que hacen algo: el servicio es el resto." }
        - { expr: "n_t", texto: "Esos son todos: quince no son de servicio." }
    exito: "Cuarenta y cinco de servicio: mayoría en número y ninguno en importancia funcional. Un 100 nF junto a un chip se aparta sin pensarlo."
    escalera:
      - "Reste a los sesenta los que hacen algo."
    solucion: "60 − 15 = 45 de servicio."
    comprobar:
      - { n_s: 45, n_u: 15, n_t: 60 }

  - id: errores-lectura
    tipo: tocar
    titulo: "Cruce o conexión"
    texto: "Confundir cruce con conexión es el error de lectura más frecuente. Toque las dos formas de dibujar un cruce sin conexión."
    libro: [131, 132, 133, 134, "cap11#54"]
    widget:
      tipo: figura
      figura: fig-11.3
      zonas:
        - { id: union, rotulo: "Tercero de la última fila", rect: [190, 252, 70, 50] }
        - { id: cruce, rotulo: "Cuarto de la última fila", rect: [282, 252, 70, 50] }
        - { id: arco, rotulo: "Quinto de la última fila", rect: [372, 252, 70, 50] }
        - { id: fusible, rotulo: "Segundo de la última fila", rect: [100, 252, 70, 50] }
    tocar:
      bien: [cruce, arco]
      todas: true
      porque:
        union: "Con punto, las líneas están conectadas."
        fusible: "Es un fusible: una protección, no un cruce."
    exito: "Sin punto, o con arco de salto, no conectan. Por eso las herramientas evitan las uniones de cuatro líneas. Y una etiqueta igual conecta sin línea."
    escalera:
      - "El punto es la conexión."
    solucion: "El cruce sin punto y el arco de salto."

  - id: prediga-emisor
    tipo: simular
    titulo: "Prediga y mida"
    texto: "Antes de medir con el Brymen, prediga la tensión del emisor de esta etapa, con β = 150."
    libro: [136, "cap06#182"]
    fijar: { V_cc: 12, beta: 150 }
    widget:
      tipo: circuito
      esquema: bjt-polarizacion
      piezas: { vcc: V_cc, r1: R_p1, r2: R_p2, rc: R_pc, re: R_pe, beta: beta, vbe: V_BE }
      lectura: { valor: V_pe, rotulo: "Tensión de emisor" }
      corriente: I_pc
      mide: { ib: I_pb, ic: I_pc, vb: V_pb, ve: V_pe, vc: V_pc, vce: V_pce }
      ocultar: true
      mandos: []
    simular:
      objetivo: V_pe
      unidad: V
      tol: 0.03
      rotulo: "Tensión de emisor, V_{E}"
      medida: ve
      errores:
        - { expr: "V_pb", texto: "Esa es la tensión de la base: el emisor queda V_{BE} por debajo." }
        - { expr: "V_eth", texto: "Ha tomado el divisor en vacío: la corriente de base lo carga a través de R_{Th}." }
        - { expr: "V_pth", texto: "Esa es la del divisor sin carga, y además falta restar V_{BE}." }
    exito: "1,33 V: si la medida coincide, el esquema se ha entendido."
    escalera:
      - "El emisor queda V_{BE} por debajo de la base."
      - "La base no llega a la tensión del divisor en vacío: la corriente de base lo carga."
    solucion: "V_{E} = 1,33 V con β = 150."
    comprobar:
      - { V_pe: 1.33, tol: 0.01 }

  - id: mida-emisor
    tipo: medir
    titulo: "Compruebe con el Brymen"
    texto: "Ahora compruebe la predicción: ponga las puntas donde se mide la tensión del emisor."
    libro: [136]
    fijar: { V_cc: 12, beta: 150 }
    widget:
      tipo: circuito
      esquema: bjt-polarizacion
      piezas: { vcc: V_cc, r1: R_p1, r2: R_p2, rc: R_pc, re: R_pe, beta: beta, vbe: V_BE }
      corriente: I_pc
      mide: { ib: I_pb, ic: I_pc, vb: V_pb, ve: V_pe, vc: V_pc, vce: V_pce }
      instrumento: { tipo: multimetro, modos: [V], puntos: [vcc, b, c, e, "0"] }
      mandos: []
    medir:
      magnitud: tension
      entre: [e, "0"]
      valor: V_pe
      porque:
        b: "Esa es la base: queda V_{BE} por encima del emisor."
        c: "Ese es el colector."
        vcc: "Esa es la alimentación."
        "b/e": "Así mide V_{BE}, la unión base-emisor; el emisor se mide frente a masa."
    exito: "Coincide con lo predicho: el esquema se ha entendido. Es el método que convierte la lectura pasiva en comprensión."
    escalera:
      - "El emisor es la patilla de abajo del transistor; la referencia, masa."
    solucion: "Roja en el emisor, negra en masa."

  - id: discrepancia
    tipo: porque
    titulo: "Si no coincide"
    texto: "Predijo 1,33 V en el emisor y el Brymen marca otra cosa. ¿Ha perdido el tiempo?"
    libro: [136]
    widget:
      tipo: circuito
      esquema: bjt-polarizacion
      piezas: { vcc: V_cc, r1: R_p1, r2: R_p2, rc: R_pc, re: R_pe, beta: beta, vbe: V_BE }
      lectura: { valor: V_pe, rotulo: "Tensión de emisor" }
      corriente: I_pc
      mide: { ib: I_pb, ic: I_pc, vb: V_pb, ve: V_pe, vc: V_pc, vce: V_pce }
      mandos: []
    opciones:
      - texto: "No: o el circuito falla o la lectura era equivocada, y ambas cosas enseñan"
        bien: true
        porque: "Es el método que convierte la lectura pasiva en comprensión."
      - texto: "Sí: la predicción no sirve si no acierta"
        porque: "La discrepancia es información: señala una avería o un error de lectura."
      - texto: "Sí: hay que medir sin predecir"
        porque: "Sin predicción no hay con qué comparar la medida."
    escalera:
      - "¿Qué dos explicaciones caben cuando la medida no coincide?"
    solucion: "La discrepancia enseña: o falla el circuito, o falló la lectura."
    comprobar:
      - { V_pe: 1.33, tol: 0.01 }

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [114, 118, 127, 136, 115, 123, 129, "cap11#306"]
    ideas:
      - { titulo: "Bloques, no texto.", texto: "Alimentación, bloques, señal, señal frente a servicio y notas." }
      - { titulo: "La alimentación primero.", texto: "Casi todos los diagnósticos empiezan y terminan en ella." }
      - { titulo: "Criba.", texto: "El desacoplo y la polarización se identifican y se apartan." }
      - { titulo: "Verifique midiendo.", texto: "Prediga tres o cuatro nodos y compruébelos." }
