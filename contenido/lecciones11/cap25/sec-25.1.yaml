# Lección 1.2 de la sección 24.1 «El Circuito como Caja de Dos Puertos» (cap25). Formato: contenido/lecciones11/GUIA.md.
# El bloque que se mide es el RC de la práctica de la sección 21.5 (cap22#133: 1,6 kΩ y 100 nF).
# 1.2.1 (autor121-pot, «aprender haciendo», GUIA §13): la caja se mide desde fuera, como dice el libro: se busca la
# frecuencia de −3 dB y la de una décima (objetivos), la sonda se pone en el puerto de salida, y la relación de
# amplitudes y el desfase se leen en la gráfica y se escriben. Quedan dos preguntas de opciones (ABCD en cascada y los S
# en radiofrecuencia); los juegos emparejados, las magnitudes independientes, h_fe y la reciprocidad pasan al resumen.
leccion: cap25/sec-25.1

libro:
  4: "Se puede describir por completo por lo que hace en esos cuatro terminales, sin conocer su interior."
  7: "hay cuatro magnitudes"
  8: "Las dos corrientes"
  9: "se elige el que haga fácil el problema"
  11: "hfe es la β en pequeña señal"
  12: "al encadenar bloques, sus matrices se multiplican"
  14: "exigen abrir o cortocircuitar terminales"
  15: "midiendo con todos los puertos terminados en 50 Ω"
  18: "no lo cumple una red con elementos activos o con ferritas magnetizadas"
  20: "En una red recíproca y simétrica, los cuatro parámetros se reducen a dos"
  23: "quedar descritos por cuatro números por frecuencia"
  25: "se mide la relación de amplitudes y el desfase entre entrada y salida a varias frecuencias"
  "cap22#133": "Con R = 1,6 kΩ y C = 100 nF"

modelo:
  valores:
    V_p: { sim: "V_{p}", nombre: "amplitud de la entrada", unidad: V, valor: 1 }
    f_f: { sim: "f", nombre: "frecuencia", unidad: Hz, valor: 1000 }
    R_f: { sim: "R", nombre: "resistencia", unidad: Ω, valor: 1600 }
    C_f: { sim: "C", nombre: "capacidad", unidad: F, valor: 100e-9 }
  calculos:
    w_f: { expr: "2*pi*f_f", sim: "ω", nombre: "frecuencia angular", unidad: "rad/s" }
    x_c: { expr: "w_f*R_f*C_f", sim: "ωRC", nombre: "ωRC", unidad: "" }
    A_c: { expr: "V_p/sqrt(1 + x_c^2)", sim: "V_{salida}", nombre: "amplitud de la salida", unidad: V }
    ph_c: { expr: "-atan(x_c)*180/pi", sim: "φ", nombre: "desfase de la salida", unidad: "°" }
    H_c: { expr: "1/sqrt(2)", sim: "1/√2", nombre: "relación en el corte", unidad: "" }
    x_cs: { expr: "x_c", sim: "ωRC", nombre: "ωRC", unidad: "" }
    H: { expr: "A_c/V_p", sim: "|H|", nombre: "relación de amplitudes", unidad: "", cifras: 3 }

tarjetas:
  - id: explore-caja
    tipo: explorar
    titulo: "Medir la caja desde fuera"
    texto: "Un bloque con entrada y salida: se describe por lo que hace en sus terminales. Recorra las frecuencias hasta que la salida caiga a 0,707 veces la entrada."
    libro: [4, 25, "cap22#133"]
    inicio: { f_f: 100 }
    widget:
      tipo: circuito
      esquema: filtro-rc
      piezas: { fuente: V_p, f: f_f, r: R_f, c: C_f }
      lectura: { valor: H, rotulo: "Salida / entrada" }
      datos:
        - { valor: ph_c, rotulo: "Desfase: {{ph_c}}" }
      mide: { vc_amp: A_c, vc_fase: ph_c }
      grafica:
        x: { id: t, min: 0, max: 0.01, unidad: s, rotulo: "t" }
        y: { min: -1.2, max: 1.2, unidad: V, rotulo: "v" }
        curvas:
          - { expr: "V_p*sin(w_f*t)", color: tinta, rotulo: "entrada", mide: entrada, discontinua: true }
          - { expr: "A_c*sin(w_f*t + ph_c*pi/180)", color: naranja, rotulo: "salida", mide: vc }
      mandos:
        - { valor: f_f, lista: [100, 200, 500, 1000, 2000, 5000, 10000] }
    objetivo:
      condiciones:
        - { valor: H, objetivo: 0.707, tol: 0.02, rotulo: "Salida / entrada: {{H}}" }
      logrado: "A {{f_f}}: relación {{H}} y desfase {{ph_c}}. Sin abrir la caja, ya se sabe dónde corta."
      pistas:
        - { cuando: { valor: H, mayor: 0.72 }, texto: "Todavía pasa casi todo: suba la frecuencia." }
        - { texto: "Se ha pasado: baje la frecuencia." }
    escalera:
      - "La salida baja al subir la frecuencia."
    solucion: "A 1 kHz: 0,705 y −45°."
    comprobar:
      - { con: { f_f: 1000 }, H: 0.7052, ph_c: -45.2, tol: 0.003 }
      - { V_p: 1, H_c: 0.707 }

  - id: cuatro-magnitudes
    tipo: medir
    titulo: "El puerto de salida"
    texto: "A 1 kHz, ponga la sonda del osciloscopio en el puerto de salida del bloque."
    libro: [4, 7]
    fijar: { f_f: 1000 }
    widget:
      tipo: circuito
      esquema: filtro-rc
      piezas: { fuente: V_p, f: f_f, r: R_f, c: C_f }
      mide: { vc_amp: A_c, vc_fase: ph_c }
      grafica:
        x: { id: t, min: 0, max: 0.01, unidad: s, rotulo: "t" }
        y: { min: -1.2, max: 1.2, unidad: V, rotulo: "v" }
        curvas:
          - { expr: "V_p*sin(w_f*t)", color: tinta, rotulo: "entrada", mide: entrada, discontinua: true }
          - { expr: "A_c*sin(w_f*t + ph_c*pi/180)", color: naranja, rotulo: "salida", mide: vc }
      instrumento:
        tipo: osciloscopio
        puntos: { fte: "Puerto de entrada", c: "Puerto de salida" }
        curvas: { fte: 0, c: 1 }
      mandos: []
    medir:
      magnitud: senal
      punto: c
      porque:
        fte: "Esa es la entrada: la señal que se aplica, la referencia."
    exito: "Más pequeña y retrasada. Entrada y salida tienen cada una su tensión y su corriente: cuatro magnitudes, de las que dos son independientes."
    escalera:
      - "La salida está entre la resistencia y el condensador."
    solucion: "La sonda entre R y C, el puerto de salida."

  - id: juegos
    tipo: leer
    titulo: "La relación de amplitudes"
    texto: "A 2 kHz, mida en la gráfica la amplitud de la salida y escriba la relación salida / entrada."
    libro: [25]
    fijar: { f_f: 2000 }
    widget:
      tipo: circuito
      esquema: filtro-rc
      piezas: { fuente: V_p, f: f_f, r: R_f, c: C_f }
      mide: { vc_amp: A_c, vc_fase: ph_c }
      grafica:
        x: { id: t, min: 0, max: 0.01, unidad: s, rotulo: "t" }
        y: { min: -1.2, max: 1.2, unidad: V, rotulo: "v" }
        curvas:
          - { expr: "V_p*sin(w_f*t)", color: tinta, rotulo: "entrada", mide: entrada, discontinua: true }
          - { expr: "A_c*sin(w_f*t + ph_c*pi/180)", color: naranja, rotulo: "salida", mide: vc }
      mandos: []
    leer:
      objetivo: H
      unidad: ""
      tol: 0.03
      rotulo: "Salida / entrada"
      errores:
        - { expr: "1/H", texto: "Ha dividido al revés: entrada entre salida. La relación es salida / entrada." }
    exito: "Unos 0,45: a 2 kHz el bloque deja pasar menos de la mitad. Con varias frecuencias se tiene su descripción completa."
    escalera:
      - "La entrada tiene un voltio de pico: la relación es el pico de la curva naranja."
    solucion: "0,445."
    comprobar:
      - { H: 0.445, x_cs: 2.01, tol: 0.005 }

  - id: desfase
    tipo: leer
    titulo: "El desfase"
    texto: "A 500 Hz, el desfase entre entrada y salida es la otra mitad de la medida. Escríbalo con su signo, en grados."
    libro: [25]
    fijar: { f_f: 500 }
    widget:
      tipo: circuito
      esquema: filtro-rc
      piezas: { fuente: V_p, f: f_f, r: R_f, c: C_f }
      lectura: { valor: H, rotulo: "Salida / entrada" }
      mide: { vc_amp: A_c, vc_fase: ph_c }
      grafica:
        x: { id: t, min: 0, max: 0.01, unidad: s, rotulo: "t" }
        y: { min: -1.2, max: 1.2, unidad: V, rotulo: "v" }
        curvas:
          - { expr: "V_p*sin(w_f*t)", color: tinta, rotulo: "entrada", mide: entrada, discontinua: true }
          - { expr: "A_c*sin(w_f*t + ph_c*pi/180)", color: naranja, rotulo: "salida", mide: vc }
      mandos: []
    leer:
      objetivo: ph_c
      unidad: "°"
      tol: 0.04
      rotulo: "Desfase de la salida"
      errores:
        - { expr: "-ph_c - 90", texto: "Ese es el complemento. El desfase es −arctan(ωRC)." }
    exito: "Unos −27°: la salida va retrasada. Relación de amplitudes y desfase, a cada frecuencia, describen el bloque sin abrirlo."
    escalera:
      - "ωRC ≈ 0,50 a 500 Hz; φ = −arctan(ωRC)."
    solucion: "−26,7°."
    comprobar:
      - { ph_c: -26.7, x_cs: 0.503, tol: 0.005 }

  - id: decima
    tipo: explorar
    titulo: "Una décima"
    texto: "Busque la frecuencia con la que el bloque deja pasar solo una décima de la entrada."
    libro: [23, 25]
    inicio: { f_f: 1000 }
    widget:
      tipo: circuito
      esquema: filtro-rc
      piezas: { fuente: V_p, f: f_f, r: R_f, c: C_f }
      lectura: { valor: H, rotulo: "Salida / entrada" }
      datos:
        - { valor: ph_c, rotulo: "Desfase: {{ph_c}}" }
      mide: { vc_amp: A_c, vc_fase: ph_c }
      grafica:
        x: { id: t, min: 0, max: 0.01, unidad: s, rotulo: "t" }
        y: { min: -1.2, max: 1.2, unidad: V, rotulo: "v" }
        curvas:
          - { expr: "V_p*sin(w_f*t)", color: tinta, rotulo: "entrada", mide: entrada, discontinua: true }
          - { expr: "A_c*sin(w_f*t + ph_c*pi/180)", color: naranja, rotulo: "salida", mide: vc }
      mandos:
        - { valor: f_f, lista: [100, 200, 500, 1000, 2000, 5000, 10000] }
    objetivo:
      condiciones:
        - { valor: H, max: 0.1, rotulo: "Salida / entrada: {{H}}" }
      logrado: "A {{f_f}}, {{H}} con {{ph_c}}. Cuatro números por frecuencia describen el bloque: predecir qué hará en un sistema es aritmética."
      pistas:
        - { texto: "Todavía pasa más: suba la frecuencia." }
    escalera:
      - "La relación es 1/√(1 + (ωRC)²): una décima pide ωRC ≈ 10."
    solucion: "A 10 kHz: 0,099."
    comprobar:
      - { con: { f_f: 10000 }, H: 0.099, tol: 0.01 }

  - id: abcd
    tipo: pregunta
    titulo: "Encadenar bloques"
    texto: "¿Qué propiedad hace útiles los parámetros ABCD en cascadas, líneas y filtros en escalera?"
    libro: [12]
    widget:
      tipo: circuito
      esquema: filtro-rc
      piezas: { fuente: V_p, f: f_f, r: R_f, c: C_f }
      lectura: { valor: H, rotulo: "Salida / entrada" }
      mide: { vc_amp: A_c }
      mandos: []
    opciones:
      - texto: "Al encadenar bloques, sus matrices se multiplican"
        bien: true
        porque: "La respuesta de toda la cadena sale de un producto de matrices, sin resolver el circuito entero."
      - texto: "Se miden sin abrir ni cortocircuitar terminales"
        porque: "Esa es la virtud de los S. Los ABCD sí exigen esas condiciones."
      - texto: "Cada uno se mide con una condición sencilla"
        porque: "Esa es la virtud de los h: entrada abierta o salida en cortocircuito."
    escalera:
      - "Piense en una cadena de bloques uno tras otro."
    solucion: "En cascada sus matrices se multiplican."

  - id: parametros-s
    tipo: porque
    titulo: "En radiofrecuencia"
    texto: "¿Por qué en radiofrecuencia se usan los parámetros S y no Z, Y, h o ABCD?"
    libro: [14, 15]
    widget:
      tipo: circuito
      esquema: filtro-rc
      piezas: { fuente: V_p, f: f_f, r: R_f, c: C_f }
      lectura: { valor: H, rotulo: "Salida / entrada" }
      mide: { vc_amp: A_c }
      mandos: []
    opciones:
      - texto: "Los otros exigen abrir o cortocircuitar terminales, imposible a frecuencias altas"
        bien: true
        porque: "Y puede hacer oscilar el dispositivo. Los S se miden con todos los puertos terminados en 50 Ω, algo realizable."
      - texto: "Porque los S dan más información"
        porque: "Todos describen lo mismo y se convierten unos en otros. La razón es que los S se pueden medir."
      - texto: "Porque en RF no hay corrientes"
        porque: "Las hay; lo que no se puede hacer bien es dejar un puerto abierto o en corto a esas frecuencias."
    escalera:
      - "¿Cómo se mide cada parámetro Z o h?"
    solucion: "Abrir o cortocircuitar no es realizable en RF; terminar en 50 Ω, sí."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [4, 7, 8, 9, 11, 12, 15, 18, 20]
    ideas:
      - { titulo: "Una caja.", texto: "Cuatro terminales, cuatro magnitudes, dos independientes. Recíproca si transmite igual en los dos sentidos (un circulador, no)." }
      - { titulo: "Juegos.", texto: "Z toma las corrientes; Y, las tensiones; h, I de entrada y V de salida; S, ondas. Se convierten unos en otros." }
      - { titulo: "Cada uno, para algo.", texto: "h en transistores (h_{fe} es la β), ABCD en cascadas (se multiplican), S en radiofrecuencia." }
      - { titulo: "Se mide.", texto: "Relación de amplitudes y desfase a varias frecuencias, con la carga real." }
