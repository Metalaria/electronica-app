# Lección 1.2 de la sección 24.2 «El Decibelio» (cap25). Formato: contenido/lecciones11/GUIA.md.
# El RC del paso «simular» es el de la práctica de la sección 21.5 (cap22#133, 1,6 kΩ y 100 nF, corte en 995 Hz).
leccion: cap25/sec-25.2

libro:
  30: "Un decibelio es una relación, no una cantidad."
  31: '"para potencias"'
  32: '"para tensiones"'
  33: "la potencia va con el cuadrado de la tensión"
  34: "6 dB son el doble de tensión y cuatro veces la potencia"
  37: "Tres etapas de 20, 15 y −6 dB dan 29 dB, sin multiplicar nada."
  41: "0,707"
  42: "cada 6 dB dobla la tensión y cada 20 la multiplica por diez"
  45: "0,775 V"
  46: "0 dBm sobre 50 Ω son 224 mV eficaces"
  48: "da 3 dBm, porque las potencias se suman en lineal"
  49: "Un amplificador de 20 dB con una entrada de −30 dBm da −10 dBm"
  "cap22#133": "Con R = 1,6 kΩ y C = 100 nF"
  "cap22#135": "En el corte, la salida debe ser 0,707 veces la entrada (−3 dB)"

modelo:
  valores:
    r_v: { sim: "V₂/V₁", nombre: "relación de tensiones", unidad: "", valor: 2 }
    V_p: { sim: "V_{p}", nombre: "amplitud de la entrada", unidad: V, valor: 1 }
    f_f: { sim: "f", nombre: "frecuencia", unidad: Hz, valor: 994.72 }
    R_f: { sim: "R", nombre: "resistencia", unidad: Ω, valor: 1600 }
    C_f: { sim: "C", nombre: "capacidad", unidad: F, valor: 100e-9 }
    G_1: { sim: "G₁", nombre: "primera etapa", unidad: dB, valor: 20 }
    G_2: { sim: "G₂", nombre: "segunda etapa", unidad: dB, valor: 15 }
    G_3: { sim: "G₃", nombre: "tercera etapa", unidad: dB, valor: -6 }
    R_50: { sim: "R", nombre: "impedancia", unidad: Ω, valor: 50 }
  calculos:
    dB_v: { expr: "20*log10(r_v)", sim: "dB", nombre: "decibelios de tensión", unidad: dB, cifras: 3 }
    r_p: { expr: "r_v^2", sim: "P₂/P₁", nombre: "relación de potencias", unidad: "", cifras: 3 }
    w_f: { expr: "2*pi*f_f", sim: "ω", nombre: "frecuencia angular", unidad: "rad/s" }
    x_c: { expr: "w_f*R_f*C_f", sim: "ωRC", nombre: "ωRC", unidad: "" }
    A_c: { expr: "V_p/sqrt(1 + x_c^2)", sim: "V_{salida}", nombre: "amplitud de la salida", unidad: V }
    H: { expr: "A_c/V_p", sim: "|H|", nombre: "relación de amplitudes", unidad: "", cifras: 3 }
    D_c: { expr: "20*log10(H)", sim: "|H|", nombre: "atenuación en decibelios", unidad: dB, cifras: 3 }
    G_t: { expr: "G_1 + G_2 + G_3", sim: "G", nombre: "ganancia total", unidad: dB }
    V_0dBm: { expr: "sqrt(0.001*R_50)", sim: "V", nombre: "tensión eficaz de 0 dBm", unidad: V }

tarjetas:
  - id: explore-escala
    tipo: explorar
    titulo: "Una relación en escala logarítmica"
    texto: "Arrastre la relación de tensiones. Fíjese en cuántos decibelios añade cada vez que la dobla o la multiplica por diez."
    libro: [30, 42]
    widget:
      tipo: grafica
      x: { id: q, min: 0.01, max: 100, unidad: "", rotulo: "V₂/V₁", escala: log }
      y: { min: -40, max: 40, unidad: dB, rotulo: "dB" }
      curvas:
        - { expr: "20*log10(q)", color: azul, rotulo: "20 · log₁₀(V₂/V₁)" }
      asas:
        - { mueve: r_v, x: "r_v", y: "dB_v", rotulo: "Su relación" }
      lectura: { valor: dB_v, rotulo: "Decibelios" }
      datos:
        - { valor: r_p, rotulo: "Relación de potencias: {{r_p}}" }
      mandos:
        - { valor: r_v, lista: [0.01, 0.1, 0.5, 0.707, 1, 1.41, 2, 3.16, 10, 100], rotulo: "V₂/V₁" }

  - id: veinte
    tipo: formula
    titulo: "Por qué un 20"
    texto: "La potencia va con el cuadrado de la tensión, y el cuadrado dentro del logaritmo sale multiplicando por dos."
    libro: [32, 33]
    ec: 32
    sustitucion: "20 · log₁₀({{r_v}}) = {{dB_v}}"
    widget:
      tipo: grafica
      x: { id: q, min: 0.01, max: 100, unidad: "", rotulo: "V₂/V₁", escala: log }
      y: { min: -40, max: 40, unidad: dB, rotulo: "dB" }
      curvas:
        - { expr: "20*log10(q)", color: azul, rotulo: "20 · log₁₀(V₂/V₁)" }
      asas:
        - { mueve: r_v, x: "r_v", y: "dB_v", rotulo: "Su relación" }
      lectura: { valor: dB_v, rotulo: "Decibelios" }
      mandos:
        - { valor: r_v, lista: [0.01, 0.1, 0.5, 0.707, 1, 1.41, 2, 3.16, 10, 100], rotulo: "V₂/V₁" }

  - id: seis-db
    tipo: predecir
    titulo: "¿Qué son 6 dB?"
    texto: "Una etapa da 6 dB. ¿Qué hace con la tensión y con la potencia?"
    libro: [34, 41]
    fijar: { r_v: 2 }
    widget:
      tipo: grafica
      x: { id: q, min: 0.01, max: 100, unidad: "", rotulo: "V₂/V₁", escala: log }
      y: { min: -40, max: 40, unidad: dB, rotulo: "dB" }
      curvas:
        - { expr: "20*log10(q)", color: azul, rotulo: "20 · log₁₀(V₂/V₁)" }
      lectura: { valor: r_p, rotulo: "Relación de potencias" }
      ocultar: true
    opciones:
      - texto: "Dobla la tensión y multiplica por cuatro la potencia"
        bien: true
        porque: "El mismo número de decibelios significa lo mismo en los dos casos: 20 · log₁₀ 2 y 10 · log₁₀ 4 dan 6 dB."
      - texto: "Dobla la potencia"
        porque: "Eso son 3 dB. Confundir cuál de las dos magnitudes se compara es el error más frecuente."
      - texto: "Multiplica por seis la tensión"
        porque: "Los decibelios son logarítmicos: ×10 en tensión ya son 20 dB."
    escalera:
      - "Mire en la tabla de memoria la fila de 6 dB."
    solucion: "6 dB: el doble de tensión y cuatro veces la potencia."
    comprobar:
      - { dB_v: 6.02, r_p: 4 }

  - id: cascada
    tipo: pregunta
    fase: "Estime"
    titulo: "Etapas en cascada"
    texto: "Tres etapas de 20, 15 y −6 dB, una tras otra. ¿Qué ganancia total dan?"
    libro: [37]
    estimar:
      objetivo: "G_t"
      unidad: dB
      min: -10
      max: 60
      paso: 1
      inicio: 50
      tol: 0.03
      rotulo: "Ganancia total"
    exito: "29 dB, sumando y sin multiplicar nada: es la razón principal de usar decibelios."
    pistas:
      - { cuando: { valor: estimacion, mayor: 29.8 }, texto: "Se ha pasado: la tercera etapa resta 6 dB." }
      - { texto: "Se ha quedado corto: solo la tercera etapa es negativa." }
    escalera:
      - "En decibelios, las ganancias de una cascada se suman."
    solucion: "20 + 15 − 6 = 29 dB."
    comprobar:
      - { G_t: 29 }

  - id: simule-corte
    tipo: simular
    titulo: "Prediga y simule"
    texto: "En el corte de este RC la salida es 0,707 veces la entrada. ¿Cuántos decibelios son?"
    libro: ["cap22#133", "cap22#135", 32]
    fijar: { V_p: 1, f_f: 994.72, R_f: 1600, C_f: 100e-9 }
    widget:
      tipo: circuito
      esquema: filtro-rc
      piezas: { fuente: V_p, f: f_f, r: R_f, c: C_f }
      lectura: { valor: D_c, rotulo: "Salida respecto a la entrada" }
      mide: { vc_db: D_c }
      ocultar: true
      mandos: []
    simular:
      objetivo: D_c
      unidad: dB
      tol: 0.03
      rotulo: "Salida respecto a la entrada"
      medida: vc_db
      errores:
        - { expr: "10*log10(H)", texto: "Ha usado 10 · log₁₀, el de potencias. Para una relación de tensiones el factor es 20." }
    exito: "20 · log₁₀ 0,707 = −3 dB: la mitad de la potencia."
    escalera:
      - "Es una relación de tensiones: use el factor 20."
    solucion: "20 · log₁₀ 0,707 ≈ −3 dB."
    comprobar:
      - { D_c: -3.01, H: 0.707 }

  - id: suma-dbm
    tipo: pregunta
    titulo: "Sumar dBm"
    texto: "Se suman dos señales incorreladas de 0 dBm cada una. ¿Qué potencia resulta?"
    libro: [48]
    widget:
      tipo: grafica
      x: { id: q, min: 0.01, max: 100, unidad: "", rotulo: "P₂/P₁", escala: log }
      y: { min: -20, max: 20, unidad: dB, rotulo: "dB" }
      curvas:
        - { expr: "10*log10(q)", color: naranja, rotulo: "10 · log₁₀(P₂/P₁)" }
    opciones:
      - texto: "3 dBm"
        bien: true
        porque: "Las potencias se suman en lineal: 1 mW + 1 mW = 2 mW, que son 3 dBm."
      - texto: "0 dBm"
        porque: "Sumar 0 dBm y 0 dBm como si fueran dB daría 0; pero son potencias absolutas que se suman en lineal."
      - texto: "6 dBm"
        porque: "Eso darían dos señales idénticas y en fase. Las incorreladas suman potencias, no amplitudes."
    escalera:
      - "Pase cada una a milivatios antes de sumar."
    solucion: "1 mW + 1 mW = 2 mW: 3 dBm."

  - id: referencias
    tipo: pregunta
    fase: "Empareje"
    titulo: "Decibelios con referencia"
    texto: "Una cada unidad con su referencia."
    libro: [45]
    emparejar:
      - ["dBm", "1 mW"]
      - ["dBW", "1 W"]
      - ["dBV", "1 V eficaz"]
      - ["dBu", "0,775 V"]
      - ["dBc", "La portadora"]
    exito: "Con referencia fija el valor es una cantidad absoluta; dBc y dBi siguen siendo relaciones."
    pistas:
      - { texto: "La letra dice la referencia: m de milivatio, W de vatio, V de voltio." }
    escalera:
      - "dBc se usa para espurios: la c es de portadora («carrier»)."
    solucion: "dBm–1 mW, dBW–1 W, dBV–1 V eficaz, dBu–0,775 V, dBc–la portadora."

  - id: cero-dbm
    tipo: pregunta
    fase: "Estime"
    titulo: "0 dBm en tensión"
    texto: "Sobre 50 Ω, ¿qué tensión eficaz corresponde a 0 dBm?"
    libro: [46]
    fijar: { R_50: 50 }
    estimar:
      objetivo: "V_0dBm"
      unidad: V
      min: 0
      max: 1
      paso: 0.005
      inicio: 0.8
      tol: 0.05
      rotulo: "Tensión eficaz"
    exito: "224 mV eficaces: la equivalencia que pasa de un analizador de espectro a un osciloscopio."
    pistas:
      - { cuando: { valor: estimacion, mayor: 0.235 }, texto: "Se ha pasado: 1 mW sobre 50 Ω es una tensión pequeña, V = √(P·R)." }
      - { texto: "Se ha quedado corto: V = √(P·R), con 1 mW y 50 Ω." }
    escalera:
      - "0 dBm es 1 mW; V = √(P·R)."
    solucion: "√(1 mW · 50 Ω) = 224 mV."
    comprobar:
      - { V_0dBm: 0.2236 }

  - id: absolutos
    tipo: porque
    titulo: "Absolutos y relativos"
    texto: "Un amplificador de 20 dB con −30 dBm a la entrada da −10 dBm. ¿Por qué esa suma sí es correcta?"
    libro: [49]
    widget:
      tipo: grafica
      x: { id: q, min: 0.01, max: 100, unidad: "", rotulo: "P₂/P₁", escala: log }
      y: { min: -20, max: 20, unidad: dB, rotulo: "dB" }
      curvas:
        - { expr: "10*log10(q)", color: naranja, rotulo: "10 · log₁₀(P₂/P₁)" }
    opciones:
      - texto: "Se suma una ganancia relativa a un nivel absoluto: es multiplicar la potencia"
        bien: true
        porque: "Los absolutos son un punto de partida al que se suman los relativos."
      - texto: "Porque los dBm siempre se suman"
        porque: "Dos niveles absolutos no se suman así: dos señales de 0 dBm dan 3 dBm."
      - texto: "Porque el amplificador es lineal"
        porque: "La linealidad no es la razón: la suma es correcta porque 20 dB es una relación, no un nivel."
    escalera:
      - "¿Cuál de los dos números es una relación?"
    solucion: "−30 dBm + 20 dB: un nivel más una relación, −10 dBm."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [31, 32, 34, 48]
    ideas:
      - { titulo: "Una relación.", texto: "10 · log₁₀ para potencias, 20 · log₁₀ para tensiones: 6 dB son el doble de tensión." }
      - { titulo: "Se suman.", texto: "Las etapas en cascada suman sus decibelios." }
      - { titulo: "Con referencia.", texto: "dBm, dBW, dBV o dBu son cantidades absolutas: 0 dBm sobre 50 Ω, 224 mV." }
      - { titulo: "El error.", texto: "Dos señales de 0 dBm no dan 0 dBm: las potencias se suman en lineal." }
