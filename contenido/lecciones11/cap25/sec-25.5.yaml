# Lección 1.2 de la sección 24.5 «Filtros Activos» (cap25). Formato: contenido/lecciones11/GUIA.md.
# El filtro es el Sallen-Key paso bajo de ganancia unidad del ejercicio 24.11 (cap25#312: R₁ = R₂ = 11 kΩ, C₁ = 22 nF,
# C₂ = 10 nF, operacional de 1 MHz de GBW), con el esquema «sallen-key». Q = √(C₁/C₂)/2, f₀ = 1/(2π·R·√(C₁·C₂)). Lo
# que deja pasar muy por encima del corte (bloque 147) sale del operacional real del esquema (gbw y rsal), con la
# resistencia de salida en lazo abierto «de 20 a 100 Ω» de la sección 26.7 (cap27#304).
leccion: cap25/sec-25.5

libro:
  137: "encadenar dos filtros pasivos no da la suma de sus respuestas"
  140: "Q alto sin bobinas, sintetizado con realimentación"
  143: "dos células RC en cascada darían como mucho Q = 0,5"
  146: "un Q de 10 exige componentes muy precisos"
  147: "un paso bajo Sallen-Key puede dejar pasar señales muy por encima de su corte"
  150: "la topología inversora no tiene ese camino directo de entrada a salida"
  152: "MFB para Q alto, para frecuencias altas y cuando la inversión no moleste"
  154: "paso alto a la salida del sumador, paso banda tras el primer integrador y paso bajo tras el segundo"
  158: "el GBW del operacional sea al menos 100 veces la frecuencia de corte multiplicada por el Q"
  164: "Ordenar las secciones de menor a mayor Q"
  "cap25#312": "Se quiere un filtro activo paso bajo Sallen-Key de ganancia unidad"
  "cap25#75": "El valor 0,707 es el que separa las respuestas con pico de las que no lo tienen"
  "cap27#304": "del orden de 20 a 100 Ω"

modelo:
  valores:
    R_s: { sim: "R", nombre: "resistencias iguales", unidad: Ω, valor: 11000 }
    C_1: { sim: "C₁", nombre: "condensador a la salida", unidad: F, valor: 22e-9 }
    C_2: { sim: "C₂", nombre: "condensador a masa", unidad: F, valor: 10e-9 }
    f_g: { sim: "f_{c}", nombre: "frecuencia de corte", unidad: Hz, valor: 20000 }
    Q_g: { sim: "Q", nombre: "factor de calidad", unidad: "", valor: 2 }
    V_p: { sim: "V_{p}", nombre: "amplitud de la entrada", unidad: V, valor: 1 }
    f_s: { sim: "f", nombre: "frecuencia de la entrada", unidad: Hz, valor: 1000 }
    G_bw: { sim: "GBW", nombre: "producto ganancia-ancho de banda del operacional", unidad: Hz, valor: 1000000 }
    R_o: { sim: "R_{o}", nombre: "resistencia de salida en lazo abierto", unidad: Ω, valor: 100 }
  calculos:
    Q_s: { expr: "sqrt(C_1/C_2)/2", sim: "Q", nombre: "factor de calidad", unidad: "", cifras: 3 }
    f_0: { expr: "1/(2*pi*R_s*sqrt(C_1*C_2))", sim: "f₀", nombre: "frecuencia natural", unidad: Hz }
    k_q: { expr: "1 - 1/(2*Q_s^2)", sim: "k", nombre: "término auxiliar", unidad: "" }
    f_3: { expr: "f_0*sqrt(k_q + sqrt(k_q^2 + 1))", sim: "f_{−3 dB}", nombre: "corte a −3 dB", unidad: Hz }
    GBW: { expr: "100*f_g*Q_g", sim: "GBW", nombre: "producto ganancia por ancho de banda mínimo", unidad: Hz }
    # the real op amp (one pole, A₀ = 10⁵, output resistance R_o): H = N(s)/D(s), coefficients of GUIA.md §5.4
    wp: { expr: "2*pi*G_bw/100000", sim: "ω_{p}", nombre: "polo del operacional", unidad: "rad/s" }
    n0: { expr: "100000*wp", sim: "n₀", nombre: "coeficiente n₀", unidad: "" }
    n1: { expr: "C_1*R_o*wp", sim: "n₁", nombre: "coeficiente n₁", unidad: "" }
    n2: { expr: "C_1*R_o*(1 + C_2*R_s*wp)", sim: "n₂", nombre: "coeficiente n₂", unidad: "" }
    n3: { expr: "C_1*C_2*R_s*R_o", sim: "n₃", nombre: "coeficiente n₃", unidad: "" }
    d0: { expr: "100001*wp", sim: "d₀", nombre: "coeficiente d₀", unidad: "" }
    d1: { expr: "1 + wp*(100001*C_2*2*R_s + C_1*(R_s + R_o))", sim: "d₁", nombre: "coeficiente d₁", unidad: "" }
    d2: { expr: "C_1*(R_s + R_o) + C_2*2*R_s + wp*C_1*C_2*(100001*R_s^2 + R_o*2*R_s)", sim: "d₂", nombre: "coeficiente d₂", unidad: "" }
    d3: { expr: "C_1*C_2*(R_s^2 + R_o*2*R_s)", sim: "d₃", nombre: "coeficiente d₃", unidad: "" }
    D_suelo: { expr: "20*log10(n3/d3)", sim: "suelo", nombre: "suelo de la atenuación", unidad: dB, cifras: 3 }

tarjetas:
  - id: explore-q
    tipo: explorar
    titulo: "El Q sale de la realimentación"
    texto: "Paso bajo Sallen-Key de ganancia unidad. Cambie C₁, el que realimenta desde la salida: con él crece el Q y aparece el pico."
    libro: [140, "cap25#312"]
    widget:
      tipo: circuito
      esquema: sallen-key
      piezas: { fuente: V_p, f: f_s, r1: R_s, r2: R_s, c1: C_1, c2: C_2 }
      grafica:
        x: { id: nu, min: 10, max: 100000, unidad: Hz, rotulo: "f", escala: log }
        y: { min: -60, max: 15, unidad: dB, rotulo: "|H|" }
        curvas:
          - { expr: "20*log10(V_p) - 10*log10((1 - (nu/f_0)^2)^2 + (nu/(f_0*Q_s))^2)", color: azul, rotulo: "|H|", mide: salida_db }
      lectura: { valor: Q_s, rotulo: "Q" }
      datos:
        - { valor: f_0, rotulo: "f₀ = {{f_0}}" }
      mandos:
        - { valor: C_1, lista: [10e-9, 22e-9, 47e-9, 100e-9, 220e-9, 470e-9, 1e-6], rotulo: "C₁" }

  - id: prediga-sin
    tipo: predecir
    titulo: "Sin realimentación"
    texto: "Dos células RC pasivas en cascada, sin el operacional. ¿Qué Q pueden dar como mucho?"
    libro: [143, "cap25#75"]
    widget:
      tipo: grafica
      x: { id: nu, min: 10, max: 100000, unidad: Hz, rotulo: "f", escala: log }
      y: { min: -60, max: 15, unidad: dB, rotulo: "|H|" }
      curvas:
        - { expr: "-10*log10((1 - (nu/f_0)^2)^2 + (nu/(f_0*Q_s))^2)", color: azul, rotulo: "|H|" }
      lectura: { valor: Q_s, rotulo: "Q" }
      ocultar: true
    opciones:
      - texto: "0,5, y menos si la segunda carga a la primera"
        bien: true
        porque: "Sin pico posible. La realimentación positiva del Sallen-Key es la que crea el Q que se quiera."
      - texto: "El que se quiera, eligiendo bien R y C"
        porque: "Con solo R y C pasivos no hay pico: el Q queda limitado a 0,5."
      - texto: "0,707, el de Butterworth"
        porque: "0,707 ya necesita la realimentación: dos RC solas no llegan."
    escalera:
      - "Dos polos reales: ¿puede haber pico?"
    solucion: "Como mucho Q = 0,5."

  - id: ajuste-q
    tipo: ajuste
    titulo: "Casi Butterworth"
    texto: "Con C₂ = 10 nF, elija C₁ de la serie E12 hasta que Q quede entre 0,65 y 0,75, sin pico apreciable."
    libro: ["cap25#312", "cap25#75"]
    fijar: { R_s: 11000, C_2: 10e-9 }
    inicio: { C_1: 10e-9 }
    widget:
      tipo: circuito
      esquema: sallen-key
      piezas: { fuente: V_p, f: f_s, r1: R_s, r2: R_s, c1: C_1, c2: C_2 }
      grafica:
        x: { id: nu, min: 10, max: 100000, unidad: Hz, rotulo: "f", escala: log }
        y: { min: -60, max: 15, unidad: dB, rotulo: "|H|" }
        curvas:
          - { expr: "20*log10(V_p) - 10*log10((1 - (nu/f_0)^2)^2 + (nu/(f_0*Q_s))^2)", color: azul, rotulo: "|H|", mide: salida_db }
      mandos:
        - { valor: C_1, lista: [10e-9, 12e-9, 15e-9, 18e-9, 22e-9, 27e-9, 33e-9, 47e-9], rotulo: "C₁ (E12)" }
    ajuste:
      valor: Q_s
      min: 0.65
      max: 0.75
      rotulo: "Factor de calidad Q"
      escala: { min: 0.4, max: 1.2 }
      bajo: "Q bajo: la caída empieza pronto. Suba C₁."
      alto: "Q alto: aparece el pico. Baje C₁."
      dentro: "Dentro: 18 o 22 nF. El libro elige 22 nF, Q ≈ 0,74."
    comprobar:
      - { con: { C_1: 18e-9 }, Q_s: 0.671, tol: 0.002 }
      - { con: { C_1: 22e-9 }, Q_s: 0.742, tol: 0.002 }

  - id: reto-sallen
    tipo: reto
    titulo: "Reto: el corte en 1 kHz"
    texto: "Con C₁ = 22 nF y C₂ = 10 nF (Q ≈ 0,74), elija R de la serie E24 para el corte a −3 dB en 1 kHz ± 5 %."
    libro: ["cap25#312"]
    fijar: { C_1: 22e-9, C_2: 10e-9 }
    inicio: { R_s: 1000 }
    widget:
      tipo: circuito
      esquema: sallen-key
      piezas: { fuente: V_p, f: f_s, r1: R_s, r2: R_s, c1: C_1, c2: C_2 }
      grafica:
        x: { id: nu, min: 10, max: 100000, unidad: Hz, rotulo: "f", escala: log }
        y: { min: -60, max: 15, unidad: dB, rotulo: "|H|" }
        curvas:
          - { expr: "20*log10(V_p) - 10*log10((1 - (nu/f_0)^2)^2 + (nu/(f_0*Q_s))^2)", color: azul, rotulo: "|H|", mide: salida_db }
        marcas:
          - { x: "f_3", y: "-3", rotulo: "−3 dB" }
      lectura: { valor: f_3, rotulo: "Corte a −3 dB" }
      mandos:
        - { valor: R_s, serie: E24, min: 1000, max: 100000, rotulo: "R (E24)" }
    condiciones:
      - { valor: f_3, objetivo: 1000, tol: 0.05, rotulo: "Corte: {{f_3}}" }
    exito: "El E24 de 11 kΩ da f₀ ≈ 975 Hz y un corte de unos 1 020 Hz. El E12 de 10 kΩ lo llevaría a 1,12 kHz."
    pistas:
      - { cuando: { valor: f_3, mayor: 1050 }, texto: "El corte sale alto: suba R." }
      - { cuando: { valor: f_3, menor: 950 }, texto: "El corte sale bajo: baje R." }
    escalera:
      - "Con Q = 0,74, el corte a −3 dB queda un 4,6 % por encima de f₀."
      - "Para 1 kHz hace falta f₀ ≈ 956 Hz: R ≈ 11,2 kΩ."
    solucion: "R = 11 kΩ: corte en unos 1 020 Hz."
    comprobar:
      - { Q_s: 0.74, tol: 0.01 }
      - { con: { R_s: 11000 }, f_0: 975, f_3: 1020, tol: 0.01 }
      - { con: { R_s: 10000 }, f_3: 1120, tol: 0.01 }

  - id: gbw
    tipo: pregunta
    fase: "Estime"
    titulo: "El operacional condiciona el filtro"
    texto: "Un paso bajo activo de segundo orden con el corte en 20 kHz y Q = 2. ¿Qué GBW mínimo pide al operacional?"
    libro: [158, "cap25#312"]
    fijar: { f_g: 20000, Q_g: 2 }
    estimar:
      objetivo: "GBW"
      unidad: Hz
      min: 0
      max: 10000000
      paso: 100000
      inicio: 200000
      tol: 0.05
      rotulo: "GBW mínimo"
    exito: "100 · 20 kHz · 2 = 4 MHz."
    pistas:
      - { cuando: { valor: estimacion, mayor: 4200000 }, texto: "Se ha pasado: la regla es 100 veces el corte por el Q." }
      - { texto: "Se ha quedado corto: multiplique el corte por 100 y por el Q." }
    escalera:
      - "GBW ≥ 100 · f_{c} · Q."
    solucion: "100 · 20 kHz · 2 = 4 MHz."
    comprobar:
      - { GBW: 4000000 }

  - id: fuga-arriba
    tipo: sorpresa
    titulo: "Muy por encima del corte"
    texto: "El mismo filtro con el operacional real del ejercicio, de 1 MHz de GBW. Cambie su resistencia de salida y mire la atenuación arriba."
    libro: [147, "cap25#312", "cap27#304"]
    fijar: { R_s: 11000, C_1: 22e-9, C_2: 10e-9, G_bw: 1000000 }
    inicio: { R_o: 100 }
    widget:
      tipo: circuito
      esquema: sallen-key
      piezas: { fuente: V_p, f: f_s, r1: R_s, r2: R_s, c1: C_1, c2: C_2, gbw: G_bw, rsal: R_o }
      grafica:
        x: { id: nu, min: 100, max: 10000000, unidad: Hz, rotulo: "f", escala: log }
        y: { min: -80, max: 10, unidad: dB, rotulo: "|H|" }
        curvas:
          - { expr: "20*log10(V_p*sqrt((n0 - n2*(2*pi*nu)^2)^2 + (n1*2*pi*nu - n3*(2*pi*nu)^3)^2)/sqrt((d0 - d2*(2*pi*nu)^2)^2 + (d1*2*pi*nu - d3*(2*pi*nu)^3)^2))", color: naranja, rotulo: "operacional real", mide: salida_db }
          - { expr: "20*log10(V_p) - 10*log10((1 - (nu/f_0)^2)^2 + (nu/(f_0*Q_s))^2)", color: tinta, rotulo: "ideal", discontinua: true }
      lectura: { valor: D_suelo, rotulo: "Donde se detiene la atenuación" }
      mandos:
        - { valor: R_o, lista: [20, 50, 100], rotulo: "R_{o} del operacional" }
    comprobar:
      - { D_suelo: -40.9, tol: 0.01 }

  - id: alta-frecuencia
    tipo: porque
    titulo: "¿Por qué deja de filtrar?"
    texto: "Un paso bajo Sallen-Key deja pasar señales muy por encima de su corte. ¿Por qué?"
    libro: [147, 150]
    fijar: { R_s: 11000, C_1: 22e-9, C_2: 10e-9, G_bw: 1000000 }
    widget:
      tipo: circuito
      esquema: sallen-key
      piezas: { fuente: V_p, f: f_s, r1: R_s, r2: R_s, c1: C_1, c2: C_2, gbw: G_bw, rsal: R_o }
      grafica:
        x: { id: nu, min: 100, max: 10000000, unidad: Hz, rotulo: "f", escala: log }
        y: { min: -80, max: 10, unidad: dB, rotulo: "|H|" }
        curvas:
          - { expr: "20*log10(V_p*sqrt((n0 - n2*(2*pi*nu)^2)^2 + (n1*2*pi*nu - n3*(2*pi*nu)^3)^2)/sqrt((d0 - d2*(2*pi*nu)^2)^2 + (d1*2*pi*nu - d3*(2*pi*nu)^3)^2))", color: naranja, rotulo: "operacional real", mide: salida_db }
    opciones:
      - texto: "Por encima del ancho de banda del operacional, C₁ acopla la entrada a la salida"
        bien: true
        porque: "La ganancia del amplificador cae y la atenuación se detiene o revierte. La MFB, inversora, no tiene ese camino."
      - texto: "Porque el Q es demasiado alto"
        porque: "Pasa con cualquier Q: es un camino directo por el condensador de realimentación."
      - texto: "Porque los condensadores tienen tolerancia"
        porque: "Las tolerancias mueven el corte y el Q; el efecto de alta frecuencia es del operacional."
    escalera:
      - "¿Qué pasa con la ganancia del operacional muy arriba en frecuencia?"
    solucion: "El operacional ya no amplifica y C₁ deja pasar la entrada a la salida."

  - id: que-topologia
    tipo: pregunta
    titulo: "Sallen-Key o MFB"
    texto: "Hace falta un Q alto, a frecuencia alta, y la inversión de la señal no molesta. ¿Qué topología conviene?"
    libro: [146, 150, 152]
    widget:
      tipo: grafica
      x: { id: nu, min: 10, max: 100000, unidad: Hz, rotulo: "f", escala: log }
      y: { min: -60, max: 15, unidad: dB, rotulo: "|H|" }
      curvas:
        - { expr: "-10*log10((1 - (nu/f_0)^2)^2 + (nu/(f_0*Q_s))^2)", color: azul, rotulo: "|H|" }
    opciones:
      - texto: "Realimentación múltiple (MFB)"
        bien: true
        porque: "Menos sensible a las tolerancias y sin camino directo de entrada a salida. A cambio invierte la señal."
      - texto: "Sallen-Key"
        porque: "Conviene con Q moderado y cuando importa la impedancia de entrada; con Q alto, la dispersión se amplifica."
      - texto: "Dos RC pasivas"
        porque: "No llegan a Q alto: como mucho 0,5."
    escalera:
      - "¿Cuál no tiene camino directo de la entrada a la salida?"
    solucion: "MFB: Q alto, frecuencia alta, y la inversión no importa."

  - id: orden-secciones
    tipo: pregunta
    titulo: "Encadenar secciones"
    texto: "Un filtro de orden 4 se monta con dos secciones de segundo orden, de Q distinto. ¿Cuál va primero?"
    libro: [164]
    widget:
      tipo: grafica
      x: { id: nu, min: 10, max: 100000, unidad: Hz, rotulo: "f", escala: log }
      y: { min: -60, max: 15, unidad: dB, rotulo: "|H|" }
      curvas:
        - { expr: "-10*log10((1 - (nu/f_0)^2)^2 + (nu/(f_0*Q_s))^2)", color: azul, rotulo: "|H|" }
      mandos:
        - { valor: C_1, lista: [10e-9, 22e-9, 47e-9, 100e-9, 220e-9, 470e-9, 1e-6], rotulo: "C₁" }
    opciones:
      - texto: "La de menor Q"
        bien: true
        porque: "Así la de Q alto no recibe una señal ya amplificada por el pico y no satura."
      - texto: "La de mayor Q"
        porque: "Su pico amplificaría la señal antes de la segunda sección, que podría saturar."
      - texto: "Da igual: es un sistema lineal"
        porque: "En lineal daría igual, pero el operacional satura: el orden importa con señal real."
    escalera:
      - "Piense en el pico de la sección de Q alto."
    solucion: "De menor a mayor Q."

  - id: variable-estado
    tipo: pregunta
    fase: "Empareje"
    titulo: "Variable de estado"
    texto: "Un sumador y dos integradores en cascada. Una cada salida con la respuesta que entrega."
    libro: [154]
    emparejar:
      - ["Salida del sumador", "Paso alto"]
      - ["Tras el primer integrador", "Paso banda"]
      - ["Tras el segundo integrador", "Paso bajo"]
    exito: "Tres respuestas a la vez, y f₀ y Q se ajustan por separado."
    pistas:
      - { texto: "Cada integrador quita frecuencias altas." }
    escalera:
      - "Tras dos integradores, solo queda lo más lento."
    solucion: "Sumador–paso alto, primer integrador–paso banda, segundo–paso bajo."

  - id: por-que-activo
    tipo: pregunta
    titulo: "Por qué no basta el pasivo"
    texto: "¿Qué resuelve un filtro activo frente a uno pasivo?"
    libro: [137, 140]
    widget:
      tipo: grafica
      x: { id: nu, min: 10, max: 100000, unidad: Hz, rotulo: "f", escala: log }
      y: { min: -60, max: 15, unidad: dB, rotulo: "|H|" }
      curvas:
        - { expr: "-10*log10((1 - (nu/f_0)^2)^2 + (nu/(f_0*Q_s))^2)", color: azul, rotulo: "|H|" }
    opciones:
      - texto: "No depende de la carga, puede dar ganancia y consigue Q alto sin bobinas"
        bien: true
        porque: "El operacional da entrada alta y salida baja, y la realimentación sintetiza el Q."
      - texto: "Solo que no necesita condensadores"
        porque: "Sigue usando condensadores: lo que evita son las bobinas."
      - texto: "Que tiene un corte más abrupto con el mismo orden"
        porque: "La pendiente la da el orden, igual que en uno pasivo."
    escalera:
      - "Recuerde las tres limitaciones del filtro pasivo."
    solucion: "Independencia de la carga, ganancia y Q alto sin bobinas."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [140, 147, 158, 164]
    ideas:
      - { titulo: "Activo.", texto: "Un operacional: sin depender de la carga, con ganancia y con Q alto sin bobinas." }
      - { titulo: "Sallen-Key.", texto: "La realimentación por C₁ crea el Q; muy por encima del corte puede dejar pasar la señal." }
      - { titulo: "El operacional.", texto: "GBW de al menos 100 veces el corte por el Q." }
      - { titulo: "Montaje.", texto: "Secciones de menor a mayor Q; condensadores primero, resistencias después." }
