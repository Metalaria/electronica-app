# Lección 1.2 de la sección 24.6 «Filtros de Condensadores Conmutados» (cap25). Formato: contenido/lecciones11/GUIA.md.
leccion: cap25/sec-25.6

libro:
  174: "sustituyen la resistencia por un condensador que se conmuta"
  176: "transporta una carga C·ΔV en cada ciclo"
  177: 'R_("equivalente") = ("1")/(C dot.op f)'
  178: "Con C = 1 pF y f = 100 kHz: 10 MΩ."
  180: "la frecuencia de corte resulta proporcional a f y depende solo de una relación entre condensadores"
  181: "las relaciones entre componentes vecinos se controlan al 0,1 %"
  182: "típicamente en una relación de 50:1 o 100:1"
  184: "Necesita un filtro antialiasing analógico a la entrada"
  185: "Hace falta un filtro de reconstrucción"
  186: "por el ruido de conmutación y por el plegado del ruido de banda ancha al muestrear"
  197: "se cambia un componente difícil por conmutación y filtrado"
  200: "Barrer la frecuencia del reloj y verificar que el corte la sigue proporcionalmente"
  "cap25#312": "Un filtro de condensadores conmutados conmuta un condensador de 2 pF a 250 kHz"

modelo:
  valores:
    C_s: { sim: "C", nombre: "condensador conmutado", unidad: F, valor: 1e-12 }
    f_k: { sim: "f", nombre: "frecuencia de conmutación", unidad: Hz, valor: 100000 }
    k_r: { sim: "f/f_{c}", nombre: "relación entre reloj y corte", unidad: "", valor: 100 }
  calculos:
    R_eq: { expr: "1/(C_s*f_k)", sim: "R_{equivalente}", nombre: "resistencia equivalente", unidad: Ω }
    R_mal: { expr: "C_s*f_k", sim: "C · f", nombre: "producto C · f", unidad: S }
    R_k: { expr: "1/(C_s*f_k*1000)", sim: "R", nombre: "mil veces menos", unidad: Ω }
    f_cs: { expr: "f_k/k_r", sim: "f_{c}", nombre: "frecuencia de corte", unidad: Hz }

tarjetas:
  - id: explore-conmutado
    tipo: explorar
    titulo: "Una resistencia hecha de conmutar"
    texto: "Un condensador que se conmuta entre dos nodos transporta C·ΔV por ciclo: equivale a una resistencia. Cambie C y la frecuencia."
    libro: [174, 176]
    widget:
      tipo: grafica
      x: { id: nu, min: 1000, max: 1000000, unidad: Hz, rotulo: "f de conmutación", escala: log }
      y: { min: 100000, max: 1000000000, unidad: Ω, rotulo: "R_{equivalente}", escala: log }
      curvas:
        - { expr: "1/(C_s*nu)", color: azul, rotulo: "1/(C · f)" }
      asas:
        - { mueve: f_k, x: "f_k", y: "R_eq", rotulo: "Su reloj" }
      lectura: { valor: R_eq, rotulo: "Resistencia equivalente" }
      mandos:
        - { valor: f_k, lista: [10000, 40000, 100000, 250000, 1000000], rotulo: "Frecuencia de conmutación" }
        - { valor: C_s, lista: [1e-12, 2e-12, 10e-12], rotulo: "C" }

  - id: prediga-r
    tipo: predecir
    titulo: "Prediga la resistencia"
    texto: "Se conmuta un condensador de 1 pF a 100 kHz. ¿A qué resistencia equivale?"
    libro: [177, 178]
    fijar: { C_s: 1e-12, f_k: 100000 }
    widget:
      tipo: grafica
      x: { id: nu, min: 1000, max: 1000000, unidad: Hz, rotulo: "f de conmutación", escala: log }
      y: { min: 100000, max: 1000000000, unidad: Ω, rotulo: "R_{equivalente}", escala: log }
      curvas:
        - { expr: "1/(C_s*nu)", color: azul, rotulo: "1/(C · f)" }
      lectura: { valor: R_eq, rotulo: "Resistencia equivalente" }
      ocultar: true
    opciones:
      - texto: "10 MΩ"
        bien: true
        porque: "1/(1 pF · 100 kHz) = 10 MΩ: en un chip ocupa un espacio ridículo; fabricada de verdad sería inviable."
      - texto: "10 kΩ"
        porque: "Sobra un factor mil: revise los prefijos, 10⁻¹² por 10⁵ son 10⁻⁷."
      - texto: "1 Ω"
        porque: "Ha olvidado la frecuencia: la carga se transporta 100 000 veces por segundo."
    escalera:
      - "R_{equivalente} = 1/(C · f)."
    solucion: "1/(10⁻¹² · 10⁵) = 10⁷ Ω = 10 MΩ."
    comprobar:
      - { R_eq: 10000000, R_k: 10000 }

  - id: regla
    tipo: formula
    titulo: "La resistencia equivalente"
    texto: "La corriente media es C·ΔV·f: como una resistencia de valor 1/(C·f)."
    libro: [176, 177]
    ec: 177
    sustitucion: "1 / ({{C_s}} · {{f_k}}) = {{R_eq}}"
    widget:
      tipo: grafica
      x: { id: nu, min: 1000, max: 1000000, unidad: Hz, rotulo: "f de conmutación", escala: log }
      y: { min: 100000, max: 1000000000, unidad: Ω, rotulo: "R_{equivalente}", escala: log }
      curvas:
        - { expr: "1/(C_s*nu)", color: azul, rotulo: "1/(C · f)" }
      asas:
        - { mueve: f_k, x: "f_k", y: "R_eq", rotulo: "Su reloj" }
      lectura: { valor: R_eq, rotulo: "Resistencia equivalente" }
      mandos:
        - { valor: f_k, lista: [10000, 40000, 100000, 250000, 1000000], rotulo: "Frecuencia de conmutación" }

  - id: ajuste-reloj
    tipo: ajuste
    titulo: "Sintonice con el reloj"
    texto: "El corte sigue al reloj en una relación de 100:1. Mueva la frecuencia del reloj hasta llevar el corte a 400 Hz."
    libro: [182, "cap25#312"]
    fijar: { k_r: 100, C_s: 2e-12 }
    inicio: { f_k: 250000 }
    widget:
      tipo: grafica
      x: { id: nu, min: 1000, max: 1000000, unidad: Hz, rotulo: "f de conmutación", escala: log }
      y: { min: 1, max: 100000, unidad: Hz, rotulo: "corte", escala: log }
      curvas:
        - { expr: "nu/k_r", color: azul, rotulo: "corte = reloj / 100" }
      lectura: { valor: f_cs, rotulo: "Frecuencia de corte" }
      mandos:
        - { valor: f_k, min: 10000, max: 300000, paso: 5000, rotulo: "Reloj" }
    ajuste:
      valor: f_cs
      objetivo: 400
      tol: 0.02
      rotulo: "Corte"
      bajo: "Corte demasiado bajo: suba el reloj."
      alto: "Corte demasiado alto: baje el reloj."
      dentro: "En 400 Hz, sin tocar ningún componente."
    comprobar:
      - { f_cs: 2500, R_eq: 2000000 }

  - id: por-que-preciso
    tipo: porque
    titulo: "¿Por qué es tan preciso?"
    texto: "En un chip los valores absolutos tienen tolerancias del 20 %. ¿Por qué un filtro de condensadores conmutados es preciso sin ajustes?"
    libro: [180, 181]
    widget:
      tipo: grafica
      x: { id: nu, min: 1000, max: 1000000, unidad: Hz, rotulo: "f de conmutación", escala: log }
      y: { min: 100000, max: 1000000000, unidad: Ω, rotulo: "R_{equivalente}", escala: log }
      curvas:
        - { expr: "1/(C_s*nu)", color: azul, rotulo: "1/(C · f)" }
    opciones:
      - texto: "Su corte depende del reloj y de una relación entre condensadores, que se controla al 0,1 %"
        bien: true
        porque: "Las relaciones entre componentes vecinos de un chip son mucho más precisas que sus valores absolutos."
      - texto: "Porque sus condensadores son de precisión"
        porque: "Sus valores absolutos tienen tolerancias del 20 %. Lo que se controla son las relaciones."
      - texto: "Porque no tiene resistencias"
        porque: "No tenerlas ayuda al tamaño; la precisión sale de depender solo de relaciones y del reloj."
    escalera:
      - "¿De qué depende el corte: de valores absolutos o de relaciones?"
    solucion: "Solo de una relación entre condensadores y del reloj."

  - id: limitaciones
    tipo: pregunta
    fase: "Empareje"
    titulo: "Sus tres limitaciones"
    texto: "Una cada limitación con su causa o su remedio."
    libro: [184, 185, 186]
    emparejar:
      - ["Sufre aliasing", "Un filtro antialiasing analógico a la entrada"]
      - ["El reloj se cuela en la salida", "Un filtro de reconstrucción"]
      - ["Más ruido que uno activo", "Conmutación y plegado del ruido al muestrear"]
    exito: "Los dos filtros auxiliares pueden ser muy simples: el reloj es rápido frente a la señal."
    pistas:
      - { texto: "Es un sistema muestreado: lo que vale para un convertidor vale aquí." }
    escalera:
      - "Antes del muestreo se evita el aliasing; después, se quitan los escalones."
    solucion: "Aliasing–antialiasing, reloj–reconstrucción, ruido–conmutación y plegado."

  - id: principio
    tipo: pregunta
    titulo: "La misma idea en tres sitios"
    texto: "Una resistencia enorme, una fuente conmutada, un sigma-delta. ¿Qué tienen en común?"
    libro: [197]
    widget:
      tipo: grafica
      x: { id: nu, min: 1000, max: 1000000, unidad: Hz, rotulo: "f de conmutación", escala: log }
      y: { min: 100000, max: 1000000000, unidad: Ω, rotulo: "R_{equivalente}", escala: log }
      curvas:
        - { expr: "1/(C_s*nu)", color: azul, rotulo: "1/(C · f)" }
    opciones:
      - texto: "Cambian un componente difícil por conmutación y filtrado"
        bien: true
        porque: "Es una de las ideas más productivas de la electrónica moderna."
      - texto: "Todos son filtros"
        porque: "Una fuente conmutada transforma tensión y un sigma-delta convierte: lo común es conmutar para sintetizar."
      - texto: "Todos evitan el uso de reloj"
        porque: "Al contrario: todos dependen de conmutar a una frecuencia."
    escalera:
      - "¿Qué hacen los tres muy deprisa?"
    solucion: "Conmutar y filtrar para sintetizar lo que sería inviable."

  - id: banco
    tipo: pregunta
    titulo: "En el banco"
    texto: "¿Qué comprobación define a un filtro de condensadores conmutados?"
    libro: [200]
    widget:
      tipo: grafica
      x: { id: nu, min: 1000, max: 1000000, unidad: Hz, rotulo: "f de conmutación", escala: log }
      y: { min: 1, max: 100000, unidad: Hz, rotulo: "corte", escala: log }
      curvas:
        - { expr: "nu/k_r", color: azul, rotulo: "corte = reloj / 100" }
    opciones:
      - texto: "Barrer el reloj y ver que el corte lo sigue proporcionalmente"
        bien: true
        porque: "Es su propiedad definitoria. Además, en escala pequeña se ven los escalones y el residuo del reloj."
      - texto: "Medir el valor de su condensador"
        porque: "Está dentro del chip, y su valor absoluto no importa: importan las relaciones."
      - texto: "Medir su resistencia con el óhmetro"
        porque: "No hay una resistencia que medir: es un condensador conmutado."
    escalera:
      - "¿Qué fija el corte?"
    solucion: "Que el corte siga al reloj."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [177, 180, 182, 184]
    ideas:
      - { titulo: "Una resistencia.", texto: "Un condensador conmutado equivale a R = 1/(C·f): megaohmios en un chip." }
      - { titulo: "El reloj manda.", texto: "El corte es proporcional al reloj y depende de relaciones entre condensadores." }
      - { titulo: "Sus costes.", texto: "Aliasing, residuo del reloj y más ruido: antialiasing y reconstrucción simples." }
