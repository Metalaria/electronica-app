# «Consolas por dentro» · GameCube 2: la alimentación. Solo entran 12 V; una tarjeta CC-CC hace el resto y lo lleva
# por P1. Fuentes: los datos de la consola (gamecube#n: fotos de iFixit, tensiones de ConsoleArtisan, la hoja de datos
# de U13) y los hechos externos del manifiesto (ConsoleArtisan).
leccion: consola-gamecube/gamecube-alimentacion

libro:
  "gamecube#6": "Regulador de tensión de baja pérdida de Sharp"
  "gamecube#18": "Aquí se enchufa la tarjeta CC-CC"
  "gamecube#22": "La tarjeta que fabrica las tensiones"
  "gamecube#23": "por aquí salen todas las tensiones que la tarjeta fabrica a partir de los 12 V"
  "gamecube#24": "Es la única tensión que entra en la consola"
  "gamecube#25": "unos 1,8 V del núcleo y 3,3 V de las entradas y salidas"
  "gamecube#27": "Condensadores de las salidas, de baja tensión"
  "gamecube#61": "una tarjeta CC-CC interna fabrica todas las demás tensiones"
  "gamecube#62": "el núcleo va a unos 1,8 V"
  "gamecube#64": "3,43 V de lógica en la patilla 6"
  "gamecube#65": "La patilla 5 de la salida digital lleva +12 V"
  "gamecube#69": "las DOL-101 no tienen ninguno de los dos"
  "gamecube#91": "La única tensión que entra"

modelo:
  valores:
    V_in: { sim: "V_{entrada}", nombre: "tensión de la fuente DOL-002", unidad: V, valor: 12 }
    I_in: { sim: "I_{máx}", nombre: "corriente de la fuente de EE. UU.", unidad: A, valor: 3.25 }
    V_n: { sim: "V_{núcleo}", nombre: "tensión del núcleo", unidad: V, valor: 1.8 }
  calculos:
    P_in: { expr: "V_in*I_in", sim: "P", nombre: "potencia que puede dar la fuente", unidad: W, cifras: 3 }
    k_n: { expr: "V_in/V_n", sim: "k", nombre: "veces que baja la tensión para el núcleo", unidad: "veces", cifras: 3 }

tarjetas:
  - id: explore-tarjeta
    tipo: explorar
    titulo: "La tarjeta CC-CC"
    texto: "Toque la entrada, el conector de salida y los condensadores. Lea qué hace cada pieza."
    libro: ["gamecube#22", "gamecube#23", "gamecube#24", "gamecube#25", "gamecube#27"]
    requiere: { mover: [entrada12, jp1, electroliticos] }
    widget:
      tipo: figura
      consola: { maquina: gamecube, foto: cc-cc }
      recorte: [140, 130, 1320, 1060]
      ampliar: 1.8
      zonas:
        - { id: entrada12, hotspot: entrada12, rotulo: "Entrada de 12 V", texto: "La única tensión que entra en la consola." }
        - { id: conmutados, hotspot: conmutados, rotulo: "Controladores", texto: "Bajan los 12 V a 1,8 V, 3,3 V y otras." }
        - { id: bobinas, hotspot: bobinas, rotulo: "Bobinas", texto: "Las de los convertidores conmutados." }
        - { id: electroliticos, hotspot: electroliticos, rotulo: "Condensadores de salida", texto: "De baja tensión; con los años se secan." }
        - { id: jp1, hotspot: jp1, rotulo: "Conector JP1", texto: "Por aquí salen todas las tensiones hacia la placa." }

  - id: toque-entrada
    tipo: tocar
    titulo: "Por dónde entra"
    texto: "Toque por dónde entra la única tensión que recibe la consola."
    libro: ["gamecube#24", "gamecube#91"]
    widget:
      tipo: figura
      consola: { maquina: gamecube, foto: cc-cc }
      zonas:
        - { id: entrada12, hotspot: entrada12, rotulo: "Conector de dos hilos, abajo a la derecha" }
        - { id: jp1, hotspot: jp1, rotulo: "Conector ancho, abajo a la izquierda" }
        - { id: electroliticos, hotspot: electroliticos, rotulo: "Cilindros metálicos, abajo" }
    tocar:
      bien: [entrada12]
      porque:
        jp1: "Por JP1 salen las tensiones hacia la placa base; no entran."
        electroliticos: "Son los condensadores de las salidas."
    exito: "Los dos hilos, rojo y negro: los 12 V de la fuente DOL-002."
    escalera:
      - "Busque los cables que vienen de fuera de la tarjeta."
    solucion: "El conector de dos hilos de abajo a la derecha."

  - id: lea-potencia
    tipo: leer
    titulo: "Lo que puede dar la fuente"
    texto: "La fuente de Estados Unidos da 12 V y hasta 3,25 A. Escriba la potencia que puede entregar."
    libro: ["gamecube#24", "gamecube#61"]
    widget:
      tipo: figura
      consola: { maquina: gamecube, foto: cc-cc }
      zonas:
        - { id: entrada12, hotspot: entrada12, rotulo: "Entrada de 12 V" }
    leer:
      objetivo: P_in
      unidad: W
      tol: 0.02
      rotulo: "Potencia"
      errores:
        - { expr: "V_in/I_in", texto: "Ha dividido: eso serían ohmios. La potencia es tensión por corriente." }
        - { expr: "V_in+I_in", texto: "La potencia no se suma: se multiplica la tensión por la corriente." }
    exito: "39 W: P = V · I."
    escalera:
      - "P = V · I."
    solucion: "12 V × 3,25 A = 39 W."
    comprobar:
      - { P_in: 39 }

  - id: lea-bajada
    tipo: leer
    titulo: "Cuánto baja"
    texto: "El núcleo de los chips va a unos 1,8 V. Escriba cuántas veces más pequeña es esa tensión que la de entrada."
    libro: ["gamecube#25", "gamecube#62"]
    widget:
      tipo: figura
      consola: { maquina: gamecube, foto: cc-cc }
      recorte: [780, 120, 520, 180]
      zonas:
        - { id: conmutados, hotspot: conmutados, rotulo: "Controladores de los convertidores" }
    leer:
      objetivo: k_n
      unidad: "veces"
      tol: 0.03
      rotulo: "Veces"
      errores:
        - { expr: "V_n/V_in", texto: "Al revés: divida la tensión de entrada entre la del núcleo." }
        - { expr: "V_in-V_n", texto: "Eso es la diferencia en voltios, no cuántas veces." }
    exito: "Unas 6,7 veces: por eso se usan convertidores conmutados y no reguladores lineales, que quemarían el resto."
    escalera:
      - "Divida 12 V entre 1,8 V."
    solucion: "12 V ÷ 1,8 V ≈ 6,67."
    comprobar:
      - { k_n: 6.667 }

  - id: toque-p1
    tipo: tocar
    titulo: "Dónde se enchufa"
    texto: "La tarjeta CC-CC se enchufa en la placa base por debajo. Toque el conector donde entra."
    libro: ["gamecube#18", "gamecube#23"]
    widget:
      tipo: figura
      consola: { maquina: gamecube, foto: soldaduras }
      recorte: [330, 480, 1150, 720]
      ampliar: 1.6
      zonas:
        - { id: p1, hotspot: p1, rotulo: "Conector negro ancho, abajo a la derecha" }
        - { id: serie2, hotspot: serie2, rotulo: "Conector pequeño, abajo a la izquierda" }
        - { id: ave, hotspot: ave, rotulo: "Chip alargado, a la derecha" }
    tocar:
      bien: [p1]
      porque:
        serie2: "Es el puerto serie 2 de la base de la consola."
        ave: "Es el codificador de vídeo."
    exito: "P1, de 22 vías: por él llegan todas las tensiones de la placa."
    escalera:
      - "Tiene que tener tantas vías como JP1, el conector de la tarjeta: 22."
    solucion: "P1, el conector negro de abajo a la derecha."

  - id: toque-u13
    tipo: tocar
    titulo: "Un regulador en la placa"
    texto: "Además de la tarjeta, la placa lleva un regulador de baja pérdida de Sharp. Tóquelo."
    libro: ["gamecube#6"]
    widget:
      tipo: figura
      consola: { maquina: gamecube, foto: componentes }
      recorte: [340, 20, 760, 360]
      ampliar: 1.6
      zonas:
        - { id: u13, hotspot: u13, rotulo: "Pieza de cinco patas, arriba del todo" }
        - { id: aram, hotspot: aram, rotulo: "Chip alargado, a la izquierda" }
        - { id: splash, hotspot: splash, rotulo: "Dos chips negros iguales" }
    tocar:
      bien: [u13]
      porque:
        aram: "Es la ARAM, una memoria."
        splash: "Son la memoria principal."
    exito: "U13, marcado 070XZ1H: un regulador de Sharp de cinco patas con la salida ajustable."
    escalera:
      - "Busque la marca de Sharp."
    solucion: "U13, la pieza de cinco patas de arriba a la izquierda."

  - id: toque-peligro
    tipo: tocar
    titulo: "Doce voltios donde no se espera"
    texto: "Toque el conector que tiene +12 V en su patilla 5: un corto al soldar en él mata la consola."
    libro: ["gamecube#65", "gamecube#69"]
    widget:
      tipo: figura
      consola: { maquina: gamecube, foto: componentes }
      zonas:
        - { id: digital, hotspot: av-digital, rotulo: "Conector metálico, abajo a la izquierda" }
        - { id: analogico, hotspot: av-analogico, rotulo: "Conector metálico, arriba a la izquierda" }
        - { id: tarjetas, hotspot: tarjetas, rotulo: "Ranuras a la derecha" }
    tocar:
      bien: [digital]
      porque:
        analogico: "Es la salida analógica: en las PAL también puede tener 12 V en su patilla 3, pero la de la patilla 5 es la digital."
        tarjetas: "Son las ranuras de las tarjetas: 3,3 V y 5 V."
    exito: "La salida digital P2: los adaptadores HDMI se sueldan aquí, y un corto con la patilla 5 no tiene arreglo."
    escalera:
      - "Es el conector que las DOL-101 ya no llevan."
    solucion: "P2, la salida de vídeo digital, abajo a la izquierda."

  - id: tension-mando
    tipo: pregunta
    titulo: "En el puerto del mando"
    texto: "¿Qué tensión espera en la patilla 6 de un puerto de mando sano?"
    libro: ["gamecube#64"]
    widget:
      tipo: figura
      consola: { maquina: gamecube, foto: componentes }
      recorte: [1200, 420, 400, 330]
      zonas:
        - { id: mandos, hotspot: mandos, rotulo: "Conector de la placa de los mandos" }
    opciones:
      - texto: "3,43 V"
        bien: true
        porque: "Es la de la lógica del mando."
      - texto: "5 V"
        porque: "Esa es la patilla 1, la del motor de vibración."
      - texto: "12 V"
        porque: "Los 12 V solo llegan a la tarjeta CC-CC y a las salidas de vídeo."
    escalera:
      - "La patilla 1 es la de la vibración; la 6, la de la lógica."
    solucion: "3,43 V."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: ["gamecube#24", "gamecube#25", "gamecube#65"]
    ideas:
      - { titulo: "Solo 12 V.", texto: "Es la única tensión que entra." }
      - { titulo: "La tarjeta CC-CC.", texto: "Hace 1,8 V, 3,3 V y las demás, y las lleva por P1." }
      - { titulo: "Cuidado con P2.", texto: "Su patilla 5 lleva +12 V." }
