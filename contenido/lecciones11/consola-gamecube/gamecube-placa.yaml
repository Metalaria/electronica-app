# «Consolas por dentro» · GameCube 1: la placa de un vistazo, sobre las fotos del explorador (DOL-CPU(P)-01 PAL,
# iFixit, CC BY-NC-SA 3.0). No hay esquema de esta consola: las piezas se identifican por sus marcas y por las
# referencias que dan YAGCD y ConsoleArtisan. Fuentes: los datos de la consola (gamecube#n, scripts/consolas11.mjs).
leccion: consola-gamecube/gamecube-placa

libro:
  "gamecube#0": "No hay esquema"
  "gamecube#1": "La placa sin el disipador, desde arriba"
  "gamecube#2": "Gráficos, sonido, memoria y entradas y salidas en un solo chip a 162 MHz"
  "gamecube#3": "PowerPC de IBM derivado del 750CXe a 486 MHz"
  "gamecube#4": "24 MB de 1T-SRAM de MoSys en dos chips de 12 MB"
  "gamecube#5": "16 MB de memoria auxiliar en un bus de 8 bits a 81 MHz"
  "gamecube#7": "guarda el programa de arranque (IPL)"
  "gamecube#8": "X1 es un oscilador de 54 MHz"
  "gamecube#16": "Convierte el vídeo digital que manda Flipper en las señales analógicas del conector P7"
  "gamecube#60": "No hay manual de servicio ni esquema del fabricante para la GameCube"
  "gamecube#78": "va en la cara de abajo de la placa"
  "gamecube#86": "U3 y U4 las dos 1T-SRAM de 12 MB"

modelo:
  valores:
    m_c: { sim: "m_{chip}", nombre: "megabytes de cada 1T-SRAM", unidad: "", valor: 12 }
    n_c: { sim: "n", nombre: "chips de 1T-SRAM", unidad: "", valor: 2 }
    m_a: { sim: "m_{ARAM}", nombre: "megabytes de la ARAM", unidad: "", valor: 16 }
  calculos:
    m_p: { expr: "m_c*n_c", sim: "m_{principal}", nombre: "megabytes de memoria principal", unidad: "", cifras: 2 }

tarjetas:
  - id: explore-chips
    tipo: explorar
    titulo: "Los chips grandes"
    texto: "Toque Flipper, el Gekko y las dos memorias. Lea qué hace cada uno."
    libro: ["gamecube#1", "gamecube#2", "gamecube#3", "gamecube#4", "gamecube#5"]
    requiere: { mover: [flipper, gekko, splash, aram] }
    widget:
      tipo: figura
      consola: { maquina: gamecube, foto: componentes }
      zonas:
        - { id: flipper, hotspot: flipper, rotulo: "Flipper", texto: "Gráficos, sonido, memoria y E/S en un solo chip a 162 MHz." }
        - { id: gekko, hotspot: gekko, rotulo: "CPU Gekko", texto: "Un PowerPC de IBM a 486 MHz." }
        - { id: splash, hotspot: splash, rotulo: "1T-SRAM (2 × 12 MB)", texto: "La memoria principal, en dos chips de 12 MB." }
        - { id: aram, hotspot: aram, rotulo: "ARAM (16 MB)", texto: "Memoria auxiliar de 16 MB en un bus de 8 bits." }

  - id: toque-cpu
    tipo: tocar
    titulo: "¿Cuál es la CPU?"
    texto: "Toque el chip que ejecuta el programa del juego."
    libro: ["gamecube#2", "gamecube#3", "gamecube#4", "gamecube#5"]
    widget:
      tipo: figura
      consola: { maquina: gamecube, foto: componentes }
      zonas:
        - { id: gekko, hotspot: gekko, rotulo: "Chip cuadrado plateado, abajo en el centro" }
        - { id: flipper, hotspot: flipper, rotulo: "Chip cuadrado grande, en el centro" }
        - { id: splash, hotspot: splash, rotulo: "Dos chips negros iguales, arriba" }
        - { id: aram, hotspot: aram, rotulo: "Chip alargado, arriba a la izquierda" }
    tocar:
      bien: [gekko]
      porque:
        flipper: "Es Flipper: dibuja, mezcla el sonido y controla la memoria; el programa lo ejecuta otro."
        splash: "Son la memoria principal: guardan el programa, no lo ejecutan."
        aram: "Es la ARAM, una memoria auxiliar."
    exito: "El Gekko de IBM: un PowerPC a 486 MHz."
    escalera:
      - "Lea las marcas: busque «IBM»."
    solucion: "El chip plateado de abajo, marcado IBM: el Gekko (U2)."

  - id: toque-memoria
    tipo: tocar
    titulo: "La memoria principal"
    texto: "Toque la memoria principal, la que guarda el programa, los datos y las texturas."
    libro: ["gamecube#4", "gamecube#5", "gamecube#86"]
    widget:
      tipo: figura
      consola: { maquina: gamecube, foto: componentes }
      recorte: [340, 20, 760, 360]
      ampliar: 1.6
      zonas:
        - { id: splash, hotspot: splash, rotulo: "Dos chips negros iguales, arriba" }
        - { id: aram, hotspot: aram, rotulo: "Chip alargado, arriba a la izquierda" }
        - { id: u13, hotspot: u13, rotulo: "Pieza de cinco patas, arriba del todo" }
    tocar:
      bien: [splash]
      porque:
        aram: "Es la ARAM: 16 MB de memoria auxiliar, lenta, a la que solo se llega por DMA."
        u13: "Es un regulador de tensión, no una memoria."
    exito: "Las dos 1T-SRAM de MoSys, U3 y U4: 12 MB cada una."
    escalera:
      - "Son dos chips iguales, marcados MoSys."
    solucion: "Los dos chips negros de arriba, U3 y U4."

  - id: lea-memoria
    tipo: leer
    titulo: "Cuánta memoria principal"
    texto: "Cada 1T-SRAM tiene 12 MB. Escriba cuántos megabytes de memoria principal tiene la consola."
    libro: ["gamecube#4", "gamecube#86"]
    widget:
      tipo: figura
      consola: { maquina: gamecube, foto: componentes }
      zonas:
        - { id: splash, hotspot: splash, rotulo: "1T-SRAM (U3 y U4)" }
    leer:
      objetivo: m_p
      unidad: ""
      tol: 0.01
      rotulo: "Memoria principal (MB)"
      errores:
        - { expr: "m_c", texto: "Es lo que tiene un solo chip: hay dos." }
        - { expr: "m_p + m_a", texto: "Ha sumado la ARAM, que no es memoria principal: el Gekko no la lee directamente." }
    exito: "24 MB: dos chips de 12 MB en el mismo bus de 64 bits."
    escalera:
      - "Multiplique 12 MB por los dos chips."
    solucion: "2 × 12 MB = 24 MB."
    comprobar:
      - { m_p: 24 }

  - id: orden-papeles
    tipo: tocar
    fase: "Ordene"
    titulo: "Cada chip, su papel"
    texto: "Toque, por este orden: el que dibuja, el que ejecuta el programa, la memoria principal y la memoria del sonido."
    libro: ["gamecube#2", "gamecube#3", "gamecube#4", "gamecube#5"]
    widget:
      tipo: figura
      consola: { maquina: gamecube, foto: componentes }
      zonas:
        - { id: flipper, hotspot: flipper, rotulo: "Chip cuadrado grande, en el centro" }
        - { id: gekko, hotspot: gekko, rotulo: "Chip cuadrado plateado, abajo en el centro" }
        - { id: splash, hotspot: splash, rotulo: "Dos chips negros iguales, arriba" }
        - { id: aram, hotspot: aram, rotulo: "Chip alargado, arriba a la izquierda" }
    tocar:
      bien: [flipper, gekko, splash, aram]
      orden: true
    exito: "Flipper, el Gekko, la 1T-SRAM y la ARAM, donde los juegos guardan las muestras de sonido."
    escalera:
      - "Toque cada zona en la primera tarjeta y lea su ficha."
    solucion: "Flipper, el Gekko, la 1T-SRAM (U3, U4) y la ARAM (U5)."

  - id: toque-arranque
    tipo: tocar
    titulo: "El que arranca la consola"
    texto: "Toque el chip que guarda el programa de arranque."
    libro: ["gamecube#7", "gamecube#8"]
    widget:
      tipo: figura
      consola: { maquina: gamecube, foto: componentes }
      recorte: [400, 650, 760, 320]
      ampliar: 2
      zonas:
        - { id: ipl, hotspot: ipl, rotulo: "Chip de 14 patas, a la derecha" }
        - { id: reloj, hotspot: reloj, rotulo: "Chip y cápsula metálica, a la izquierda" }
    tocar:
      bien: [ipl]
      porque:
        reloj: "Es el generador de reloj, con el oscilador de 54 MHz."
    exito: "U10, de Macronix: la ROM de arranque, el reloj de tiempo real y la SRAM de la configuración."
    escalera:
      - "Está junto a un cristal pequeño y cilíndrico, el de su reloj."
    solucion: "U10, a la derecha de Flipper, junto al cristal X2."

  - id: toque-ave
    tipo: tocar
    titulo: "La otra cara"
    texto: "En la cara de soldaduras también hay chips. Toque el que convierte el vídeo digital de Flipper en las señales de la tele."
    libro: ["gamecube#16", "gamecube#78"]
    widget:
      tipo: figura
      consola: { maquina: gamecube, foto: soldaduras }
      recorte: [1080, 470, 420, 730]
      ampliar: 1.6
      zonas:
        - { id: ave, hotspot: ave, rotulo: "Chip alargado, a la derecha" }
        - { id: amp, hotspot: amp, rotulo: "Chip pequeño, abajo a la derecha" }
        - { id: p1, hotspot: p1, rotulo: "Conector negro, abajo a la derecha" }
    tocar:
      bien: [ave]
      porque:
        amp: "Es U7, «AMP-DOL»: YAGCD lo supone un amplificador, sin confirmarlo."
        p1: "Es el conector de la tarjeta de alimentación."
    exito: "U6, el codificador AVE: en esta PAL, «AVE P-DOL A»."
    escalera:
      - "Lea las marcas: busque «AVE»."
    solucion: "U6, el chip alargado de la derecha."

  - id: sin-esquema
    tipo: porque
    titulo: "Sin esquema"
    texto: "En las otras consolas hay pestaña «Esquema». ¿Por qué en esta no?"
    libro: ["gamecube#60", "gamecube#0"]
    widget:
      tipo: figura
      consola: { maquina: gamecube, foto: componentes }
      zonas:
        - { id: flipper, hotspot: flipper, rotulo: "Flipper" }
    opciones:
      - texto: "Porque no existe: Nintendo no publicó manual de servicio y nadie ha redibujado la placa."
        bien: true
        porque: "Lo que se sabe sale de las fotos, de las marcas de los chips y de quienes la han estudiado."
      - texto: "Porque es secreto y no se puede publicar."
        porque: "No es que esté prohibido: es que no hay ninguno, ni del fabricante ni recreado."
      - texto: "Porque la placa no tiene componentes discretos."
        porque: "Los tiene, como cualquier placa: lo que falta es quien la haya dibujado."
    escalera:
      - "Lea qué dice ConsoleArtisan del manual de servicio."
    solucion: "No hay esquema del fabricante ni recreación: solo fotos, marcas y documentación."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: ["gamecube#2", "gamecube#3", "gamecube#4", "gamecube#60"]
    ideas:
      - { titulo: "Flipper en el centro.", texto: "Dibuja, mezcla el sonido y controla la memoria y la E/S." }
      - { titulo: "El Gekko.", texto: "Un PowerPC a 486 MHz que solo habla con Flipper." }
      - { titulo: "Dos memorias.", texto: "24 MB de 1T-SRAM y 16 MB de ARAM, más lenta." }
      - { titulo: "Sin esquema.", texto: "Las piezas se reconocen por sus marcas y por la documentación." }
