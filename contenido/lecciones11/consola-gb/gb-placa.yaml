# «Consolas por dentro» · Game Boy 1: la placa de un vistazo, sobre la foto principal del explorador (DMG-CPU-05
# montada, gbhwdb, CC BY-SA 4.0) y las dos caras de la placa de la pantalla (DMG-LCD-06): un solo chip con la CPU, la
# imagen y el sonido, dos memorias iguales con papeles distintos, el cristal, el amplificador y una segunda placa con
# la pantalla y los botones. Fuentes: los datos de la consola (gb#n, scripts/consolas11.mjs).
leccion: consola-gb/gb-placa

libro:
  "gb#2": "Todo en un chip: núcleo SM83 (parecido al Z80), PPU, APU de 4 canales"
  "gb#3": "RAM de vídeo en el bus MA0–MA12/MD0–MD7, propio de la PPU"
  "gb#4": "RAM de trabajo en el bus del cartucho ($C000–$DFFF)"
  "gb#5": "2²² Hz entre CK1 y CK2"
  "gb#6": "Amplifica SO1/SO2 para el altavoz y los auriculares"
  "gb#25": "Genera las tensiones de polarización V1–V5 de la pantalla"
  "gb#27": "Potenciómetro de contraste"
  "gb#30": "LD0, LD1, CP, CPL, ST, S, FR, CPG, las seis líneas de botones"
  "gb#35": "Cristal líquido monocromo de 4 tonos"
  "gb#36": "Cuatro contactos de membrana"
  "gb#37": "Se leen con P15 a nivel bajo"
  "gb#52": "Hacia fuera tiene dos buses"
  "gb#53": "la PPU la lee mientras dibuja (modo 3)"
  "gb#24": "Placa de la pantalla DMG-LCD-06 (dorso)"

modelo:
  valores: {}
  calculos: {}

tarjetas:
  - id: explore-chips
    tipo: explorar
    titulo: "Pocos chips"
    texto: "Toque el chip grande, las dos memorias y el cristal de esta Game Boy."
    libro: ["gb#2", "gb#3", "gb#4", "gb#5"]
    requiere: { mover: [soc, vram, wram, xtal] }
    widget:
      tipo: figura
      consola: { maquina: gb }
      zonas:
        - { id: soc, hotspot: soc, rotulo: "SoC DMG-CPU B", texto: "CPU, imagen, sonido y ROM de arranque en un chip." }
        - { id: vram, hotspot: vram, rotulo: "VRAM", texto: "La memoria de la imagen, en su propio bus." }
        - { id: wram, hotspot: wram, rotulo: "WRAM", texto: "La memoria de trabajo, en el bus del cartucho." }
        - { id: xtal, hotspot: xtal, rotulo: "Cristal", texto: "2²² Hz: el reloj de todo." }

  - id: toque-soc
    tipo: tocar
    titulo: "¿Dónde está la CPU?"
    texto: "Toque el chip que ejecuta el juego."
    libro: ["gb#2", "gb#3", "gb#4", "gb#6"]
    widget:
      tipo: figura
      consola: { maquina: gb }
      zonas:
        - { id: soc, hotspot: soc, rotulo: "Chip cuadrado, en el centro" }
        - { id: vram, hotspot: vram, rotulo: "Chip alargado, arriba a la derecha" }
        - { id: wram, hotspot: wram, rotulo: "Chip alargado, en el centro a la derecha" }
        - { id: amp, hotspot: amp, rotulo: "Chip pequeño, a la derecha" }
    tocar:
      bien: [soc]
      porque:
        vram: "Es una memoria, la VRAM: guarda la imagen, no ejecuta nada."
        wram: "Es la otra memoria, la WRAM: la CPU la usa, pero está fuera de ella."
        amp: "Es el amplificador de audio: solo sube el sonido para el altavoz."
    exito: "El DMG-CPU B: la CPU está dentro, junto a la imagen y el sonido."
    escalera:
      - "Lea las marcas: busque «DMG-CPU»."
      - "Es el chip con patillas en los cuatro lados."
    solucion: "En el centro: el SoC DMG-CPU B."

  - id: prediga-dentro
    tipo: predecir
    titulo: "Un chip para casi todo"
    texto: "El DMG-CPU B lleva la CPU. ¿Qué más hay dentro?"
    libro: ["gb#2"]
    widget:
      tipo: figura
      consola: { maquina: gb }
      zonas:
        - { id: soc, hotspot: soc, rotulo: "DMG-CPU B" }
    opciones:
      - texto: "La imagen (PPU), el sonido (APU) y una ROM de arranque de 256 bytes."
        bien: true
        porque: "Es un SoC: CPU SM83, PPU, APU de 4 canales, temporizador, puerto serie, HRAM y ROM de arranque."
      - texto: "Solo la CPU: la imagen y el sonido van en otros chips."
        porque: "No hay chip de vídeo ni de sonido aparte: la PPU y la APU están dentro del SoC."
      - texto: "La CPU y toda la memoria del juego."
        porque: "La VRAM y la WRAM son los dos chips de al lado; dentro solo hay la OAM y 127 bytes de HRAM."
    escalera:
      - "Busque en la placa otro chip de vídeo o de sonido: ¿lo hay?"
    solucion: "CPU, PPU, APU, temporizador, puerto serie, HRAM, OAM y ROM de arranque."

  - id: por-que-iguales
    tipo: porque
    titulo: "Dos chips iguales"
    texto: "La VRAM y la WRAM llevan la misma marca, LH5264. ¿Por qué hacen papeles distintos?"
    libro: ["gb#3", "gb#4", "gb#52", "gb#53"]
    widget:
      tipo: figura
      consola: { maquina: gb }
      zonas:
        - { id: vram, hotspot: vram, rotulo: "VRAM" }
        - { id: wram, hotspot: wram, rotulo: "WRAM" }
    opciones:
      - texto: "Cada una cuelga de un bus distinto del SoC."
        bien: true
        porque: "La VRAM está en el bus MA/MD, el de la PPU; la WRAM, en el bus del cartucho."
      - texto: "Una es más rápida que la otra."
        porque: "Son el mismo chip. Lo que cambia es a qué bus se conectan."
      - texto: "La VRAM es de solo lectura."
        porque: "Es RAM: la CPU la escribe fuera del modo 3 y la PPU la lee al dibujar."
    escalera:
      - "Siga sus pistas: ¿van las dos a las mismas patillas del SoC?"
    solucion: "El papel lo da el bus: VRAM en MA/MD, WRAM en el bus del cartucho."

  - id: empareje-chips
    tipo: pregunta
    fase: "Empareje"
    titulo: "Cada pieza, su papel"
    texto: "Empareje cada marca con lo que hace."
    libro: ["gb#2", "gb#3", "gb#6", "gb#5"]
    emparejar:
      - ["DMG-CPU B", "CPU, imagen y sonido"]
      - ["LH5264 junto al SoC", "La VRAM"]
      - ["IR3R40", "El amplificador"]
      - ["4.194304MHz", "El reloj"]
    exito: "Un SoC, dos memorias, un cristal y un amplificador: casi toda la placa."
    pistas:
      - { texto: "La serigrafía del cristal es su frecuencia." }
    escalera:
      - "Toque las piezas de la foto en la primera tarjeta para leer sus fichas."
    solucion: "DMG-CPU B: CPU, imagen y sonido. LH5264: VRAM. IR3R40: amplificador. 4.194304MHz: reloj."

  - id: explore-pantalla
    tipo: explorar
    titulo: "La segunda placa"
    texto: "La pantalla va en otra placa. Toque su cable, su regulador y el contraste."
    libro: ["gb#30", "gb#25", "gb#27"]
    requiere: { mover: [cable, reg, vr] }
    widget:
      tipo: figura
      consola: { maquina: gb, foto: lcd-b }
      zonas:
        - { id: cable, hotspot: l-cable, rotulo: "Cable plano", texto: "21 vías: la imagen, los botones, el altavoz y la alimentación." }
        - { id: reg, hotspot: l-reg, rotulo: "Regulador IR3E02", texto: "Las tensiones de polarización de la pantalla." }
        - { id: vr, hotspot: l-vr, rotulo: "Contraste", texto: "Un potenciómetro de 30 k." }

  - id: toque-botones
    tipo: tocar
    titulo: "Los botones, en la pantalla"
    texto: "En la cara de delante de la placa de la pantalla, toque los contactos de A y B."
    libro: ["gb#36", "gb#37", "gb#35"]
    widget:
      tipo: figura
      consola: { maquina: gb, foto: lcd-f }
      zonas:
        - { id: ab, hotspot: f-ab, rotulo: "Dos círculos, a la derecha" }
        - { id: dpad, hotspot: f-dpad, rotulo: "Cruz de contactos, a la izquierda" }
        - { id: lcd, hotspot: f-lcd, rotulo: "Rectángulo grande, arriba" }
    tocar:
      bien: [ab]
      porque:
        dpad: "Es la cruceta: cuatro contactos que se leen con P14 a nivel bajo."
        lcd: "Es la pantalla de 160 × 144."
    exito: "Los botones son contactos de membrana en la misma placa que la pantalla."
    escalera:
      - "A y B son dos botones redondos, a la derecha de la consola."
    solucion: "Los dos círculos de la derecha: A y B."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: ["gb#2", "gb#3", "gb#4", "gb#24"]
    ideas:
      - { titulo: "Un SoC.", texto: "CPU, imagen y sonido van en el DMG-CPU B." }
      - { titulo: "Dos memorias.", texto: "La misma RAM hace de VRAM o de WRAM según su bus." }
      - { titulo: "Dos placas.", texto: "La pantalla y los botones van en la DMG-LCD-06." }
