# «Consolas por dentro» · Game Boy 4: dos buses y la decodificación. El SoC tiene un bus para el cartucho y la WRAM
# (A0–A15, D0–D7, /RD, /WR, /CS) y otro solo para la VRAM (MA0–MA12, MD0–MD7), que trabajan a la vez. La ROM del
# cartucho se elige con A15 baja; /CS baja de $A000 a $FDFF y A14 separa la RAM del cartucho (A14 = 0) de la WRAM
# (CE2 = A14): circuito lógico y su tabla. El espejo de la WRAM, el MBC que captura escrituras y la HRAM interna.
# Fuentes: el decodificador del explorador (arquitectura gb.ts sobre sus direcciones de ejemplo; Gekkio, Pan Docs) y
# el libro (el decodificador, 28.3; los espejos, 38.11).
# 1.2.1: se toca en la foto qué cuelga del bus del cartucho, quién contesta a $0150, dónde está el MBC que recoge la
# escritura en $2000 y dónde está la HRAM; el circuito de /CS y A14 tiene meta; el espejo se escribe en hexadecimal.
# Queda una pregunta: para qué dos buses.
leccion: consola-gb/gb-buses

libro:
  "gb#2": "127 bytes de HRAM"
  "gb#3": "RAM de vídeo en el bus MA0–MA12/MD0–MD7, propio de la PPU"
  "gb#13": "A0–A15, D0–D7, /RD, /WR, /CS, /RES, PHI y VIN"
  "gb#52": "Hacia fuera tiene dos buses: A0–A15/D0–D7 (cartucho y WRAM) y MA0–MA12/MD0–MD7 (VRAM), que trabajan a la vez"
  "gb#53": "la PPU la lee mientras dibuja (modo 3) y la CPU, en el resto de modos"
  "gb#55": "/CE1 = /CS y CE2 = A14, así que solo responde en $C000–$FDFF (con espejo en $E000–$FDFF)"
  "gb#56": "La ROM responde con A15 bajo ($0000–$7FFF); la RAM del cartucho con /CS bajo y A14 bajo ($A000–$BFFF)"
  "gb#61": "Decodificador, lectura en $0150"
  "gb#63": "el MBC del cartucho la captura como registro (por ejemplo, $2000–$3FFF elige el banco de ROM)"
  "gb#64": "Decodificador, escritura en $9800"
  "gb#65": "Decodificador, escritura en $A000"
  "gb#66": "Decodificador, lectura en $C000"
  "gb#67": "Decodificador, lectura en $E123"
  "gb#69": "RAM interna de 127 bytes. Sin selección de chip"
  "cap29#76": "Decodificador: de n entradas a 2ⁿ salidas, con una sola activa"
  "cap37#359": "aparecen porque la decodificación de direcciones es incompleta"

modelo:
  valores: {}
  calculos: {}

tarjetas:
  - id: explore-buses
    tipo: tocar
    titulo: "Dos buses"
    texto: "El SoC tiene dos buses que trabajan a la vez. Toque las dos piezas que cuelgan del bus A0–A15, D0–D7."
    libro: ["gb#52", "gb#3", "gb#55", "gb#13"]
    widget:
      tipo: figura
      consola: { maquina: gb }
      zonas:
        - { id: soc, hotspot: soc, rotulo: "Chip cuadrado, en el centro" }
        - { id: vram, hotspot: vram, rotulo: "Chip alargado, arriba a la derecha" }
        - { id: wram, hotspot: wram, rotulo: "Chip alargado, en el centro a la derecha" }
        - { id: cart, hotspot: cart, rotulo: "Ranura, abajo" }
    tocar:
      bien: [wram, cart]
      todas: true
      porque:
        soc: "El SoC es quien gobierna los dos buses, no cuelga de ellos."
        vram: "La VRAM va sola en el otro bus, MA0–MA12 y MD0–MD7."
    exito: "La WRAM y el cartucho comparten A0–A15, D0–D7, /RD, /WR y /CS; la VRAM tiene su bus propio."
    escalera:
      - "Una memoria y un conector."
    solucion: "La WRAM y la ranura."

  - id: por-que-dos
    tipo: porque
    titulo: "¿Para qué dos buses?"
    texto: "¿Qué gana la Game Boy con un bus solo para la VRAM?"
    libro: ["gb#52", "gb#53"]
    widget:
      tipo: figura
      consola: { maquina: gb }
      zonas:
        - { id: vram, hotspot: vram, rotulo: "VRAM" }
        - { id: soc, hotspot: soc, rotulo: "SoC" }
    opciones:
      - texto: "La PPU lee la imagen mientras la CPU usa el cartucho."
        bien: true
        porque: "Los dos buses trabajan a la vez: dibujar no para al programa."
      - texto: "La VRAM es más rápida que la WRAM."
        porque: "Son el mismo chip. La ventaja es tener dos caminos a la vez."
      - texto: "Así el cartucho puede leer la VRAM."
        porque: "Al revés: el cartucho no ve la VRAM; solo la ve el SoC por MA/MD."
    escalera:
      - "¿Quién lee la VRAM mientras se dibuja la pantalla?"
    solucion: "Dibujar y ejecutar a la vez: cada uno por su bus."

  - id: prediga-rom
    tipo: tocar
    titulo: "Leer la ROM"
    texto: "La CPU lee $0150: A15 baja, sin /CS. Toque lo que contesta."
    libro: ["gb#56", "gb#61"]
    widget:
      tipo: figura
      consola: { maquina: gb }
      zonas:
        - { id: soc, hotspot: soc, rotulo: "Chip cuadrado, en el centro" }
        - { id: vram, hotspot: vram, rotulo: "Chip alargado, arriba a la derecha" }
        - { id: wram, hotspot: wram, rotulo: "Chip alargado, en el centro a la derecha" }
        - { id: cart, hotspot: cart, rotulo: "Ranura, abajo" }
    tocar:
      bien: [cart]
      porque:
        soc: "El SoC pide el dato; contesta otro."
        vram: "La VRAM no está en este bus: la busca el SoC por MA/MD."
        wram: "La WRAM necesita /CS baja; con A15 baja y sin /CS contesta la ROM."
    exito: "La ROM del cartucho: ocupa $0000–$7FFF y contesta con A15 a 0."
    escalera:
      - "$0150 está en la zona de la ROM."
    solucion: "El cartucho."

  - id: explore-ram
    tipo: explorar
    titulo: "/CS y A14"
    texto: "Con /CS baja, A14 decide quién contesta: la RAM del cartucho o la WRAM. Consiga que conteste la WRAM."
    libro: ["gb#55", "gb#56", "cap29#76"]
    widget:
      tipo: logica
      entradas: [{ id: CS, rotulo: "/CS baja", valor: 1 }, { id: A14, rotulo: "A14" }]
      piezas:
        - { id: n14, tipo: not, entradas: [A14] }
        - { id: w, tipo: and, entradas: [CS, A14] }
        - { id: c, tipo: and, entradas: [CS, n14] }
      salidas:
        - { id: WRAM, de: w, rotulo: "WRAM" }
        - { id: RAMC, de: c, rotulo: "RAM del cartucho" }
    objetivo:
      condiciones:
        - { led: WRAM, valor: 1, rotulo: "Contesta la WRAM" }
      logrado: "/CS baja y A14 = 1: CE2 de U3 está alto y la WRAM responde. La RAM del cartucho, no: mira A14 = 0."
      pistas:
        - { cuando: { led: RAMC, valor: 1 }, texto: "Con A14 = 0 contesta la RAM del cartucho: súbala." }
        - { texto: "Sin /CS no contesta ninguna." }
    escalera:
      - "La WRAM está en $C000: A14 = 1."
    solucion: "/CS baja y A14 = 1."

  - id: tabla-ram
    tipo: tabla
    titulo: "La tabla de la selección"
    texto: "Rellene cuándo contesta cada memoria (1)."
    libro: ["gb#55", "gb#56", "gb#65", "gb#66"]
    widget:
      tipo: logica
      entradas: [{ id: CS, rotulo: "/CS baja" }, { id: A14, rotulo: "A14" }]
      piezas:
        - { id: n14, tipo: not, entradas: [A14] }
        - { id: w, tipo: and, entradas: [CS, A14] }
        - { id: c, tipo: and, entradas: [CS, n14] }
      salidas:
        - { id: WRAM, de: w, rotulo: "WRAM" }
        - { id: RAMC, de: c, rotulo: "RAM del cartucho" }
      ocultar: true
    tabla:
      salidas: [WRAM, RAMC]
    exito: "Sin /CS no contesta ninguna; con /CS, A14 elige."
    escalera:
      - "Si /CS no baja, ninguna de las dos contesta."
      - "$A000 tiene A14 = 0; $C000, A14 = 1."
    solucion: "WRAM: solo con /CS baja y A14 = 1. RAM del cartucho: solo con /CS baja y A14 = 0."

  - id: empareje-dirs
    tipo: pregunta
    fase: "Empareje"
    titulo: "Cada dirección, su selección"
    texto: "Empareje cada dirección con lo que la elige."
    libro: ["gb#61", "gb#64", "gb#65", "gb#66"]
    emparejar:
      - ["Leer $0150", "A15 baja: ROM"]
      - ["Escribir en $9800", "/MCS: VRAM"]
      - ["Escribir en $A000", "/CS y A14 = 0"]
      - ["Leer $C000", "/CS y A14 = 1"]
    exito: "A15, /CS con A14 y, aparte, /MCS en el bus de la VRAM."
    pistas:
      - { texto: "$9800 no pasa por el bus del cartucho." }
    escalera:
      - "La VRAM está en $8000–$9FFF, en su propio bus."
    solucion: "$0150: A15. $9800: /MCS. $A000: /CS y A14 = 0. $C000: /CS y A14 = 1."

  - id: por-que-espejo
    tipo: leer
    titulo: "La misma celda, dos direcciones"
    texto: "La WRAM solo mira /CS y A14, y se repite en $E000–$FDFF. Escriba en hexadecimal la dirección de $C000–$DFFF a la que llega $E123."
    libro: ["gb#67", "gb#55", "cap37#359"]
    widget:
      tipo: figura
      consola: { maquina: gb }
      zonas:
        - { id: wram, hotspot: wram, rotulo: "WRAM" }
    leer:
      objetivo: "0xC123"
      base: 16
      cifras: 16
      rotulo: "Dirección en la WRAM"
    exito: "$C123: es la misma celda. Decodificación incompleta: nadie copia nada."
    escalera:
      - "Entre $C123 y $E123 no cambian ni /CS ni A14."
    solucion: "$C123."

  - id: escribir-2000
    tipo: tocar
    titulo: "Escribir en la ROM"
    texto: "El juego escribe en $2000, en la zona de la ROM. La ROM no se escribe, pero alguien recoge el dato: toque dónde está."
    libro: ["gb#63", "gb#56"]
    widget:
      tipo: figura
      consola: { maquina: gb }
      zonas:
        - { id: soc, hotspot: soc, rotulo: "Chip cuadrado, en el centro" }
        - { id: vram, hotspot: vram, rotulo: "Chip alargado, arriba a la derecha" }
        - { id: wram, hotspot: wram, rotulo: "Chip alargado, en el centro a la derecha" }
        - { id: cart, hotspot: cart, rotulo: "Ranura, abajo" }
    tocar:
      bien: [cart]
      porque:
        soc: "El SoC hace la escritura; quien la captura está fuera."
        vram: "La VRAM está en $8000–$9FFF y en otro bus."
        wram: "$2000 tiene A15 = 0: va al cartucho, no a la WRAM."
    exito: "El MBC del cartucho la captura como registro: $2000–$3FFF elige el banco de ROM."
    escalera:
      - "¿Qué chip del cartucho, además de la ROM, mira esas direcciones?"
    solucion: "En el cartucho: su MBC."

  - id: prediga-hram
    tipo: tocar
    titulo: "Una escritura que no sale"
    texto: "La CPU escribe en $FF80, la HRAM, y no se elige nada fuera. Toque dónde está esa memoria."
    libro: ["gb#69", "gb#52", "gb#2"]
    widget:
      tipo: figura
      consola: { maquina: gb }
      zonas:
        - { id: soc, hotspot: soc, rotulo: "Chip cuadrado, en el centro" }
        - { id: vram, hotspot: vram, rotulo: "Chip alargado, arriba a la derecha" }
        - { id: wram, hotspot: wram, rotulo: "Chip alargado, en el centro a la derecha" }
        - { id: cart, hotspot: cart, rotulo: "Ranura, abajo" }
    tocar:
      bien: [soc]
      porque:
        vram: "La VRAM está en $8000–$9FFF."
        wram: "La WRAM necesita /CS, que solo baja hasta $FDFF."
        cart: "Al cartucho le llega A15 baja o /CS; con $FF80 no le llega ninguna."
    exito: "Dentro del SoC: 127 bytes de RAM interna, sin selección de chip."
    escalera:
      - "Si no se selecciona nada fuera, la memoria está dentro."
    solucion: "El SoC."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: ["gb#52", "gb#56", "gb#55", "gb#67"]
    ideas:
      - { titulo: "Dos buses.", texto: "Cartucho y WRAM por uno; la VRAM, por el suyo." }
      - { titulo: "A15.", texto: "Elige la ROM del cartucho." }
      - { titulo: "/CS y A14.", texto: "Separan la RAM del cartucho de la WRAM." }
      - { titulo: "Espejos.", texto: "La WRAM se repite en $E000–$FDFF." }
