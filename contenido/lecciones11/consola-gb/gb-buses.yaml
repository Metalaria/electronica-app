# «Consolas por dentro» · Game Boy 4: dos buses y la decodificación. El SoC tiene un bus para el cartucho y la WRAM
# (A0–A15, D0–D7, /RD, /WR, /CS) y otro solo para la VRAM (MA0–MA12, MD0–MD7), que trabajan a la vez. La ROM del
# cartucho se elige con A15 baja; /CS baja de $A000 a $FDFF y A14 separa la RAM del cartucho (A14 = 0) de la WRAM
# (CE2 = A14): circuito lógico y su tabla. El espejo de la WRAM, el MBC que captura escrituras y la HRAM interna.
# Fuentes: el decodificador del explorador (arquitectura gb.ts sobre sus direcciones de ejemplo; Gekkio, Pan Docs) y
# el libro (el decodificador, 28.3; los espejos, 38.11).
leccion: consola-gb/gb-buses

libro:
  "gb#3": "RAM de vídeo en el bus MA0–MA12/MD0–MD7, propio de la PPU"
  "gb#13": "A0–A15, D0–D7, /RD, /WR, /CS, /RES, PHI y VIN"
  "gb#52": "Hacia fuera tiene dos buses: A0–A15/D0–D7 (cartucho y WRAM) y MA0–MA12/MD0–MD7 (VRAM), que trabajan a la vez"
  "gb#53": "la PPU la lee mientras dibuja (modo 3) y la CPU, en el resto de modos"
  "gb#55": "/CE1 = /CS y CE2 = A14, así que solo responde en $C000–$FDFF (con espejo en $E000–$FDFF)"
  "gb#56": "La ROM responde con A15 bajo ($0000–$7FFF); la RAM del cartucho con /CS bajo y A14 bajo ($A000–$BFFF)"
  "gb#61": "Decodificador, lectura en $0150"
  "gb#63": "el MBC del cartucho la captura como registro (por ejemplo, $2000–$3FFF elige el banco de ROM)"
  "gb#64": "Decodificador, escritura en $9800"
  "gb#65": "Decodificador, escritura en $A000"
  "gb#66": "Decodificador, lectura en $C000"
  "gb#67": "Decodificador, lectura en $E123"
  "gb#69": "RAM interna de 127 bytes. Sin selección de chip"
  "cap29#76": "Decodificador: de n entradas a 2ⁿ salidas, con una sola activa"
  "cap37#359": "aparecen porque la decodificación de direcciones es incompleta"

modelo:
  valores: {}
  calculos: {}

tarjetas:
  - id: explore-buses
    tipo: explorar
    titulo: "Dos buses"
    texto: "El SoC tiene dos buses que trabajan a la vez. Toque el SoC, la VRAM, la WRAM y la ranura."
    libro: ["gb#52", "gb#3", "gb#55", "gb#13"]
    requiere: { mover: [soc, vram, wram, cart] }
    widget:
      tipo: figura
      consola: { maquina: gb }
      zonas:
        - { id: soc, hotspot: soc, rotulo: "SoC", texto: "Dos buses: A/D y MA/MD." }
        - { id: vram, hotspot: vram, rotulo: "VRAM", texto: "Sola en el bus MA0–MA12, MD0–MD7." }
        - { id: wram, hotspot: wram, rotulo: "WRAM", texto: "En el bus del cartucho." }
        - { id: cart, hotspot: cart, rotulo: "Ranura", texto: "A0–A15, D0–D7, /RD, /WR, /CS." }

  - id: por-que-dos
    tipo: porque
    titulo: "¿Para qué dos buses?"
    texto: "¿Qué gana la Game Boy con un bus solo para la VRAM?"
    libro: ["gb#52", "gb#53"]
    widget:
      tipo: figura
      consola: { maquina: gb }
      zonas:
        - { id: vram, hotspot: vram, rotulo: "VRAM" }
        - { id: soc, hotspot: soc, rotulo: "SoC" }
    opciones:
      - texto: "La PPU lee la imagen mientras la CPU usa el cartucho."
        bien: true
        porque: "Los dos buses trabajan a la vez: dibujar no para al programa."
      - texto: "La VRAM es más rápida que la WRAM."
        porque: "Son el mismo chip. La ventaja es tener dos caminos a la vez."
      - texto: "Así el cartucho puede leer la VRAM."
        porque: "Al revés: el cartucho no ve la VRAM; solo la ve el SoC por MA/MD."
    escalera:
      - "¿Quién lee la VRAM mientras se dibuja la pantalla?"
    solucion: "Dibujar y ejecutar a la vez: cada uno por su bus."

  - id: prediga-rom
    tipo: predecir
    titulo: "Leer la ROM"
    texto: "La CPU lee $0150, en la ROM del cartucho. ¿Qué línea elige la ROM?"
    libro: ["gb#56", "gb#61"]
    widget:
      tipo: figura
      consola: { maquina: gb }
      zonas:
        - { id: cart, hotspot: cart, rotulo: "Ranura" }
    opciones:
      - texto: "A15, que baja."
        bien: true
        porque: "La ROM ocupa $0000–$7FFF: con A15 a 0 contesta, sin /CS."
      - texto: "/CS, que baja."
        porque: "/CS solo baja de $A000 a $FDFF; la ROM se elige con A15."
      - texto: "Ninguna: la ROM siempre contesta."
        porque: "Entonces chocaría con la WRAM. A15 la aparta del resto del mapa."
    escalera:
      - "Escriba $0150 en binario: ¿cómo es el bit más alto?"
    solucion: "A15 = 0: la ROM del cartucho."

  - id: explore-ram
    tipo: explorar
    titulo: "/CS y A14"
    texto: "Con /CS baja, A14 decide quién contesta: la RAM del cartucho o la WRAM. Muévalas."
    libro: ["gb#55", "gb#56", "cap29#76"]
    requiere: { mover: [CS, A14] }
    widget:
      tipo: logica
      entradas: [{ id: CS, rotulo: "/CS baja", valor: 1 }, { id: A14, rotulo: "A14" }]
      piezas:
        - { id: n14, tipo: not, entradas: [A14] }
        - { id: w, tipo: and, entradas: [CS, A14] }
        - { id: c, tipo: and, entradas: [CS, n14] }
      salidas:
        - { id: WRAM, de: w, rotulo: "WRAM" }
        - { id: RAMC, de: c, rotulo: "RAM del cartucho" }

  - id: tabla-ram
    tipo: tabla
    titulo: "La tabla de la selección"
    texto: "Rellene cuándo contesta cada memoria (1)."
    libro: ["gb#55", "gb#56", "gb#65", "gb#66"]
    widget:
      tipo: logica
      entradas: [{ id: CS, rotulo: "/CS baja" }, { id: A14, rotulo: "A14" }]
      piezas:
        - { id: n14, tipo: not, entradas: [A14] }
        - { id: w, tipo: and, entradas: [CS, A14] }
        - { id: c, tipo: and, entradas: [CS, n14] }
      salidas:
        - { id: WRAM, de: w, rotulo: "WRAM" }
        - { id: RAMC, de: c, rotulo: "RAM del cartucho" }
      ocultar: true
    tabla:
      salidas: [WRAM, RAMC]
    exito: "Sin /CS no contesta ninguna; con /CS, A14 elige."
    escalera:
      - "Si /CS no baja, ninguna de las dos contesta."
      - "$A000 tiene A14 = 0; $C000, A14 = 1."
    solucion: "WRAM: solo con /CS baja y A14 = 1. RAM del cartucho: solo con /CS baja y A14 = 0."

  - id: empareje-dirs
    tipo: pregunta
    fase: "Empareje"
    titulo: "Cada dirección, su selección"
    texto: "Empareje cada dirección con lo que la elige."
    libro: ["gb#61", "gb#64", "gb#65", "gb#66"]
    emparejar:
      - ["Leer $0150", "A15 baja: ROM"]
      - ["Escribir en $9800", "/MCS: VRAM"]
      - ["Escribir en $A000", "/CS y A14 = 0"]
      - ["Leer $C000", "/CS y A14 = 1"]
    exito: "A15, /CS con A14 y, aparte, /MCS en el bus de la VRAM."
    pistas:
      - { texto: "$9800 no pasa por el bus del cartucho." }
    escalera:
      - "La VRAM está en $8000–$9FFF, en su propio bus."
    solucion: "$0150: A15. $9800: /MCS. $A000: /CS y A14 = 0. $C000: /CS y A14 = 1."

  - id: por-que-espejo
    tipo: porque
    titulo: "La misma celda, dos direcciones"
    texto: "Leer $E123 da lo mismo que leer $C123. ¿Por qué?"
    libro: ["gb#67", "gb#55", "cap37#359"]
    widget:
      tipo: figura
      consola: { maquina: gb }
      zonas:
        - { id: wram, hotspot: wram, rotulo: "WRAM" }
    opciones:
      - texto: "Las dos tienen /CS baja y A14 = 1, y la WRAM no mira más."
        bien: true
        porque: "Decodificación incompleta: la WRAM se repite en $E000–$FDFF."
      - texto: "Hay otra WRAM en $E000."
        porque: "Solo hay una WRAM de 8 KB: $E123 llega a la misma celda que $C123."
      - texto: "El SoC copia los datos de una zona a la otra."
        porque: "Nadie copia: las dos direcciones eligen la misma celda."
    escalera:
      - "¿Cambia /CS o A14 entre $C123 y $E123?"
    solucion: "Es un espejo: la selección solo mira /CS y A14."

  - id: escribir-2000
    tipo: pregunta
    titulo: "Escribir en la ROM"
    texto: "El juego escribe en $2000, en la zona de la ROM. ¿Qué pasa?"
    libro: ["gb#63", "gb#56"]
    widget:
      tipo: figura
      consola: { maquina: gb }
      zonas:
        - { id: cart, hotspot: cart, rotulo: "Cartucho" }
    opciones:
      - texto: "El MBC del cartucho lo toma como número de banco."
        bien: true
        porque: "La ROM no se escribe, pero el MBC captura esa escritura: $2000–$3FFF elige el banco de ROM."
      - texto: "Nada: la ROM no se puede escribir."
        porque: "La ROM no, pero el MBC del cartucho sí recoge el dato."
      - texto: "Se escribe en la WRAM."
        porque: "$2000 tiene A15 = 0: va al cartucho, no a la WRAM."
    escalera:
      - "¿Qué chip del cartucho, además de la ROM, mira esas direcciones?"
    solucion: "El MBC cambia el banco de ROM."

  - id: prediga-hram
    tipo: predecir
    titulo: "Una escritura que no sale"
    texto: "La CPU escribe en $FF80. ¿Qué se mueve en el bus del cartucho?"
    libro: ["gb#69", "gb#52"]
    widget:
      tipo: figura
      consola: { maquina: gb }
      zonas:
        - { id: soc, hotspot: soc, rotulo: "SoC" }
        - { id: cart, hotspot: cart, rotulo: "Ranura" }
    opciones:
      - texto: "No se elige nada fuera: es la HRAM, dentro del SoC."
        bien: true
        porque: "$FF80 es RAM interna de 127 bytes: no hay selección de chip."
      - texto: "Baja /CS, como en la WRAM."
        porque: "/CS solo baja hasta $FDFF. $FF80 es interna."
      - texto: "Baja A15."
        porque: "A15 baja solo para la ROM, de $0000 a $7FFF."
    escalera:
      - "¿En qué zona del mapa está $FF80?"
    solucion: "Nada fuera: la HRAM está dentro del SoC."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: ["gb#52", "gb#56", "gb#55", "gb#67"]
    ideas:
      - { titulo: "Dos buses.", texto: "Cartucho y WRAM por uno; la VRAM, por el suyo." }
      - { titulo: "A15.", texto: "Elige la ROM del cartucho." }
      - { titulo: "/CS y A14.", texto: "Separan la RAM del cartucho de la WRAM." }
      - { titulo: "Espejos.", texto: "La WRAM se repite en $E000–$FDFF." }
