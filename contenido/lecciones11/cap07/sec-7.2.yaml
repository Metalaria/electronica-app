# Lección 1.2 de la sección 7.2 «Las Regiones de Operación» (cap07). Formato: contenido/lecciones11/GUIA.md.
# Curvas con k = 0,5 A/V² y V_th = 2 V (los de la figura 7.3). La forma de la región óhmica, k·(V_ov·V_DS − V_DS²/2),
# es la del modelo de canal largo que dibuja la figura: da ½·k·V_ov² en la frontera y 1/(k·V_ov) cerca del origen.
# 1.2: la predicción va sobre el esquema «mosfet» con la carga de 6 Ω y 12 V del ejemplo de la sección 7.5 (cap07#93).
leccion: cap07/sec-7.2

libro:
  37: "el canal se comporta como una resistencia controlada por VGS"
  38: "la corriente de drenador sigue una ley cuadrática"
  39: 'I_("D") = ("1")/("2") dot.op k'
  40: "(k = 0,5 A/V², Vth = 2 V)"
  42: "por debajo de ella hay una región de subumbral donde la corriente crece exponencialmente"
  43: "Con k = 0,5 A/V² y VGS = 10 V (Vov = 8 V), 250 mΩ"
  44: "en el ejemplo con VGS = 3 V está en 1 V"
  45: "Con VGS = 3 V y Vth = 2 V, 250 mA"
  46: "«Saturación» en el MOSFET es la región de amplificación"
  47: "Como interruptor, el MOSFET debe quedar en óhmica con holgura"
  48: "El producto de dos efectos lineales da la ley cuadrática"
  "cap07#93": "la carga resistiva de 6 Ω"

modelo:
  valores:
    V_gs: { sim: "V_{GS}", nombre: "tensión de puerta", unidad: V, valor: 4 }
    V_ds: { sim: "V_{DS}", nombre: "tensión drenador-fuente", unidad: V, valor: 6 }
    V_th: { sim: "V_{th}", nombre: "tensión umbral", unidad: V, valor: 2 }
    k_m: { sim: "k", nombre: "parámetro del transistor", unidad: "A/V²", valor: 0.5 }
    V_gr: { sim: "V_{GS}", nombre: "tensión de puerta del interruptor", unidad: V, valor: 10 }
    Vc_dd: { sim: "V_{DD}", nombre: "alimentación de la carga", unidad: V, valor: 12 }
    Rc_d: { sim: "R_{D}", nombre: "carga", unidad: Ω, valor: 6 }
  calculos:
    bc_m: { expr: "k_m*V_ov + 1/Rc_d", sim: "b", nombre: "coeficiente", unidad: "" }
    Vc_tri: { expr: "(bc_m - sqrt(max(0, bc_m^2 - 2*k_m*Vc_dd/Rc_d)))/k_m", sim: "V_{tri}", nombre: "V_DS en zona óhmica", unidad: V }
    Vc_sat: { expr: "Vc_dd - Rc_d*k_m*V_ov^2/2", sim: "V_{sat}", nombre: "V_DS en saturación", unidad: V }
    Vc_ds: { expr: "max(Vc_sat, min(V_ov, Vc_tri))", sim: "V_{DS}", nombre: "tensión drenador-fuente del circuito", unidad: V }
    Ic_d: { expr: "(Vc_dd - Vc_ds)/Rc_d", sim: "I_{D}", nombre: "corriente de la carga", unidad: A }
    V_ov: { expr: "max(0, V_gs - V_th)", sim: "V_{ov}", nombre: "tensión de sobreexcitación", unidad: V }
    m_d: { expr: "min(V_ds, V_ov)", sim: "V_{DS}", nombre: "tensión útil del canal", unidad: V }
    I_d: { expr: "k_m*(V_ov*m_d - m_d^2/2)", sim: "I_{D}", nombre: "corriente de drenador", unidad: A }
    I_sat: { expr: "0.5*k_m*V_ov^2", sim: "I_{D}", nombre: "corriente en saturación", unidad: A }
    I_mal: { expr: "k_m*V_ov^2", sim: "I", nombre: "sin el factor un medio", unidad: A }
    R_on: { expr: "1/(k_m*(V_gr - V_th))", sim: "R_{DS(on)}", nombre: "resistencia en conducción", unidad: Ω }

tarjetas:
  - id: explore-curvas
    tipo: explorar
    titulo: "Las curvas de salida"
    texto: "Arrastre V_{DS} a lo largo de la curva y cambie V_{GS}. Fíjese en dónde deja de subir la corriente."
    libro: [37, 40]
    widget:
      tipo: grafica
      x: { id: vd, min: 0, max: 10, unidad: V, rotulo: "V_{DS}" }
      y: { min: 0, max: 4.5, unidad: A, rotulo: "I_{D}" }
      curvas:
        - { expr: "k_m*(V_ov*min(vd, V_ov) - min(vd, V_ov)^2/2)", color: azul, rotulo: "I_{D} con su V_{GS}" }
        - { expr: "0.5*k_m*vd^2", color: tinta, rotulo: "frontera V_{DS} = V_{ov}", discontinua: true }
      asas:
        - { mueve: V_ds, x: "V_ds", y: "I_d", rotulo: "Su V_{DS}" }
      lectura: { valor: I_d, rotulo: "Corriente de drenador" }
      datos:
        - { valor: V_ov, rotulo: "Frontera en V_{DS} = {{V_ov}}" }
      mandos:
        - { valor: V_ds, min: 0, max: 10, paso: 0.25, rotulo: "V_{DS}" }
        - { valor: V_gs, min: 2, max: 6, paso: 0.5, rotulo: "V_{GS}" }
    requiere: { mover: [V_ds, V_gs] }

  - id: prediga-saturacion
    tipo: predecir
    titulo: "Prediga la corriente"
    texto: "k = 0,5 A/V², V_{th} = 2 V y V_{GS} = 3 V, con 12 V sobre una carga de 6 Ω. ¿Qué corriente circula?"
    libro: [40, 45, "cap07#93"]
    fijar: { V_gs: 3, V_ds: 8 }
    widget:
      tipo: circuito
      esquema: mosfet
      piezas: { vdd: Vc_dd, rd: Rc_d, entrada: V_gs, k: k_m, vth: V_th }
      lectura: { valor: Ic_d, rotulo: "Corriente de drenador" }
      datos:
        - { valor: Vc_ds, rotulo: "V_{DS} = {{Vc_ds}}" }
      corriente: Ic_d
      mide: { id: Ic_d, vds: Vc_ds, vgs: V_gs }
      ocultar: true
    opciones:
      - texto: "250 mA"
        bien: true
        porque: "En saturación: ½ · 0,5 · (3 − 2)² = 250 mA, sin importar V_{DS}."
      - texto: "500 mA"
        porque: "Ha olvidado el ½ de la ley cuadrática: k · V_{ov}² da el doble."
      - texto: "2 A, lo que pide la carga: 12 V / 6 Ω"
        porque: "Eso sería con el canal a fondo. Con 1 V de sobreexcitación el canal solo deja pasar ½ · k · V_{ov}²."
    escalera:
      - "Quedan voltios de sobra entre drenador y fuente: el transistor está en saturación."
      - "En saturación, I_{D} = ½ · k · (V_{GS} − V_{th})²."
    solucion: "½ · 0,5 · 1² = 0,25 A; el drenador queda en 10,5 V, muy por encima de la frontera de 1 V."
    comprobar:
      - { I_d: 0.25, I_sat: 0.25, I_mal: 0.5, Ic_d: 0.25, Vc_ds: 10.5, V_ov: 1 }
      - { con: { V_gs: 12 }, Ic_d: 2, tol: 0.05 }

  - id: ley-cuadratica
    tipo: formula
    titulo: "La ley cuadrática"
    texto: "En saturación, la corriente depende del cuadrado de la sobreexcitación. Mueva la puerta."
    libro: [38, 39]
    ec: 39
    sustitucion: "½ · {{k_m}} · ({{V_gs}} − {{V_th}})² = {{I_sat}}"
    widget:
      tipo: grafica
      x: { id: vq, min: 0, max: 6, unidad: V, rotulo: "V_{GS}" }
      y: { min: 0, max: 4.5, unidad: A, rotulo: "I_{D}" }
      curvas:
        - { expr: "0.5*k_m*max(0, vq - V_th)^2", color: azul, rotulo: "curva de transferencia" }
      asas:
        - { mueve: V_gs, x: "V_gs", y: "I_sat", rotulo: "Su puerta" }
      lectura: { valor: I_sat, rotulo: "Corriente en saturación" }
      mandos:
        - { valor: V_gs, min: 2, max: 6, paso: 0.5, rotulo: "V_{GS}" }

  - id: dibuje-transferencia
    tipo: dibujar
    titulo: "Dibuje la transferencia"
    texto: "Con k = 0,5 A/V² y V_{th} = 2 V, dibuje la corriente en saturación al subir V_{GS} desde cero."
    libro: [38, 40]
    fijar: { V_th: 2, k_m: 0.5 }
    dibujar:
      x: { id: vq, min: 0, max: 6, unidad: V, rotulo: "V_{GS}" }
      y: { min: 0, max: 4.5, unidad: A, rotulo: "I_{D}" }
      curva: "0.5*k_m*max(0, vq - V_th)^2"
      puntos: 25
      tol: 0.08
      holgura: 0.03
      rotulo: "I_{D} frente a V_{GS}"
    exito: "Nada hasta el umbral y luego una parábola: cuadrática, no exponencial como el bipolar."
    pistas:
      - { cuando: { valor: media, mayor: 0.05 }, texto: "Ha dibujado alto: por debajo del umbral no circula nada." }
      - { texto: "Por encima del umbral crece con el cuadrado de V_{GS} − V_{th}: cada vez más deprisa." }
    escalera:
      - "Hasta el umbral, cero."
      - "Con V_{GS} = 6 V la sobreexcitación es 4 V: ½ · 0,5 · 4²."
    solucion: "Cero hasta el umbral y luego ½ · k · (V_{GS} − V_{th})², hasta 4 A."
    comprobar:
      - { con: { V_gs: 6 }, I_sat: 4 }

  - id: estime-ron
    tipo: pregunta
    fase: "Estime"
    titulo: "El interruptor cerrado"
    texto: "En la región óhmica, R_{DS(on)} ≈ 1/(k · V_{ov}). Con k = 0,5 A/V², V_{th} = 2 V y V_{GS} = 10 V, ¿cuánto vale?"
    libro: [43]
    estimar:
      objetivo: "R_on"
      unidad: Ω
      min: 0
      max: 1
      paso: 0.01
      inicio: 0.8
      tol: 0.05
      rotulo: "R_{DS(on)}"
    exito: "1/(0,5 · 8) = 250 mΩ. Por eso la puerta se lleva a la tensión más alta disponible."
    pistas:
      - { cuando: { valor: estimacion, mayor: 0.263 }, texto: "Se ha pasado: la sobreexcitación es 10 − 2 = 8 V, no 2 V." }
      - { texto: "Se ha quedado corto: es 1/(0,5 · 8)." }
    escalera:
      - "V_{ov} = V_{GS} − V_{th}."
    solucion: "V_{ov} = 8 V: 1/(0,5 · 8) = 0,25 Ω."
    comprobar:
      - { R_on: 0.25 }

  - id: frontera
    tipo: pregunta
    titulo: "¿Dónde está la frontera?"
    texto: "Con V_{GS} = 3 V y V_{th} = 2 V, ¿a qué V_{DS} se estrangula el canal junto al drenador?"
    libro: [44]
    fijar: { V_gs: 3 }
    widget:
      tipo: grafica
      x: { id: vd, min: 0, max: 10, unidad: V, rotulo: "V_{DS}" }
      y: { min: 0, max: 4.5, unidad: A, rotulo: "I_{D}" }
      curvas:
        - { expr: "k_m*(V_ov*min(vd, V_ov) - min(vd, V_ov)^2/2)", color: azul, rotulo: "I_{D} con su V_{GS}" }
        - { expr: "0.5*k_m*vd^2", color: tinta, rotulo: "frontera", discontinua: true }
    opciones:
      - texto: "1 V"
        bien: true
        porque: "La frontera es V_{DS} = V_{GS} − V_{th}: el pinch-off llega cuando V_{DS} alcanza la sobreexcitación."
      - texto: "3 V"
        porque: "Esa es V_{GS}. El canal se estrangula cuando la puerta solo supera al drenador en V_{th}."
      - texto: "2 V"
        porque: "Esa es la tensión umbral; la frontera es V_{GS} − V_{th}."
    escalera:
      - "Junto al drenador, la puerta ve V_{GS} − V_{DS}."
    solucion: "V_{DS} = V_{GS} − V_{th} = 1 V."
    comprobar:
      - { V_ov: 1 }

  - id: sorpresa-pinch
    tipo: sorpresa
    titulo: "Más tensión, la misma corriente"
    texto: "V_{GS} = 4 V. Suba V_{DS} desde la región óhmica hasta pasar la frontera, y mire la corriente."
    libro: [44, 45]
    fijar: { V_gs: 4 }
    inicio: { V_ds: 0.5 }
    widget:
      tipo: grafica
      x: { id: vd, min: 0, max: 10, unidad: V, rotulo: "V_{DS}" }
      y: { min: 0, max: 4.5, unidad: A, rotulo: "I_{D}" }
      curvas:
        - { expr: "k_m*(V_ov*min(vd, V_ov) - min(vd, V_ov)^2/2)", color: azul, rotulo: "I_{D} con su V_{GS}" }
      asas:
        - { mueve: V_ds, x: "V_ds", y: "I_d", rotulo: "Su V_{DS}" }
      lectura: { valor: I_d, rotulo: "Corriente de drenador" }
      mandos:
        - { valor: V_ds, min: 0, max: 10, paso: 0.25, rotulo: "V_{DS}" }
    requiere: { mover: [V_ds] }

  - id: por-que-plana
    tipo: porque
    titulo: "¿Por qué deja de subir?"
    texto: "Por encima de la frontera, subir V_{DS} ya no sube la corriente. ¿Por qué?"
    libro: [44]
    fijar: { V_gs: 4 }
    widget:
      tipo: grafica
      x: { id: vd, min: 0, max: 10, unidad: V, rotulo: "V_{DS}" }
      y: { min: 0, max: 4.5, unidad: A, rotulo: "I_{D}" }
      curvas:
        - { expr: "k_m*(V_ov*min(vd, V_ov) - min(vd, V_ov)^2/2)", color: azul, rotulo: "I_{D} con su V_{GS}" }
    opciones:
      - texto: "El estrechamiento junto al drenador absorbe el exceso de tensión"
        bien: true
        porque: "La corriente la fija lo que deja pasar la parte no estrangulada del canal, y esa solo depende de la puerta."
      - texto: "Porque el canal desaparece"
        porque: "No desaparece: se estrangula en el extremo del drenador y sigue conduciendo."
      - texto: "Porque el transistor pasa a corte"
        porque: "En corte no habría corriente. Aquí circula la de saturación, ½ · k · V_{ov}²."
    escalera:
      - "¿Qué pasa con la tensión entre la puerta y el extremo del canal junto al drenador?"
    solucion: "El canal se estrangula junto al drenador y ese estrechamiento absorbe el exceso de V_{DS}."

  - id: nombre-confunde
    tipo: pregunta
    titulo: "«El MOSFET está saturado»"
    texto: "Una hoja de datos dice que el MOSFET trabaja en saturación. ¿Qué está haciendo?"
    libro: [46, 47]
    widget:
      tipo: grafica
      x: { id: vd, min: 0, max: 10, unidad: V, rotulo: "V_{DS}" }
      y: { min: 0, max: 4.5, unidad: A, rotulo: "I_{D}" }
      curvas:
        - { expr: "k_m*(V_ov*min(vd, V_ov) - min(vd, V_ov)^2/2)", color: azul, rotulo: "I_{D} con su V_{GS}" }
        - { expr: "0.5*k_m*vd^2", color: tinta, rotulo: "frontera", discontinua: true }
    opciones:
      - texto: "Amplificar: su corriente la fija la puerta"
        bien: true
        porque: "En el MOSFET, saturación es la región de amplificación; el interruptor cerrado es la óhmica."
      - texto: "Conducir a fondo, como un interruptor cerrado"
        porque: "Eso es «saturado» en un bipolar. En el MOSFET, el interruptor cerrado es la región óhmica."
      - texto: "Estar apagado"
        porque: "Apagado es corte, por debajo del umbral."
    escalera:
      - "Los nombres de las regiones no coinciden con los del bipolar."
    solucion: "Amplifica: en el MOSFET, saturación es la región de amplificación."

  - id: regiones
    tipo: pregunta
    fase: "Empareje"
    titulo: "Cuatro regiones"
    texto: "Una cada región con lo que pasa en ella."
    libro: [37, 42]
    emparejar:
      - ["Corte", "Sin canal: solo la fuga, de nanoamperios"]
      - ["Subumbral", "Corriente exponencial: circuitos de ultra bajo consumo"]
      - ["Óhmica", "Resistencia controlada por V_{GS}: interruptor cerrado"]
      - ["Saturación", "Corriente casi independiente de V_{DS}: amplificación"]
    exito: "El umbral no es una frontera nítida: por debajo hay una región exponencial."
    pistas:
      - { texto: "Ordene por V_{GS} creciente: primero no hay canal; al final, la corriente la fija la puerta." }
    escalera:
      - "La región óhmica es la del interruptor cerrado."
    solucion: "Corte–fuga, subumbral–exponencial, óhmica–interruptor, saturación–amplificación."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [37, 39, 44, 46, 48]
    ideas:
      - { titulo: "Tres regiones.", texto: "Corte sin canal, óhmica como resistencia y saturación como fuente de corriente." }
      - { titulo: "Ley cuadrática.", texto: "En saturación, I_{D} = ½ · k · (V_{GS} − V_{th})²." }
      - { titulo: "La frontera.", texto: "V_{DS} = V_{GS} − V_{th}: el canal se estrangula junto al drenador." }
      - { titulo: "Nombres cruzados.", texto: "Saturación en el MOSFET es amplificar; en el bipolar, conducir a fondo." }
