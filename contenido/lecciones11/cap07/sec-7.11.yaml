  - id: degeneracion
    tipo: explorar
    titulo: "Con degeneración"
    texto: "Ahora con R_{S} = 4 Ω y la puerta a 4 V. Busque el ejemplar de la hoja que da la mayor corriente."
    libro: [231, 232]
    fijar: { s_d: 1 }
    inicio: { V_th: 2 }
    widget:
      tipo: circuito
      esquema: mosfet
      piezas: { vdd: V_dd, rd: R_d, entrada: V_G, rs: R_S, k: k_m, vth: V_th }
      lectura: { valor: I_f, rotulo: "Corriente de la fuente" }
      datos:
        - { valor: V_gsf, rotulo: "V_{GS} = {{V_gsf}}" }
      corriente: I_f
      mide: { id: I_f, vs: V_sf, vgs: V_gsf, vds: V_dsf }
      mandos:
        - { valor: V_th, lista: [1.5, 2, 2.5], rotulo: "Umbral del ejemplar" }
    objetivo:
      condiciones:
        - { valor: I_f, min: 0.33, rotulo: "Fuente: {{I_f}}" }
      logrado: "Entre 169 y {{I_f}}: un factor dos en lugar de nueve. Mejor, pero la solución real es cerrar un lazo con un amplificador de error."
      pistas:
        - { texto: "Ese no es el extremo de más corriente: pruebe el umbral más bajo." }
    escalera:
      - "Si la corriente sube, cae más en R_{S} y V_{GS} baja: la dispersión se encoge."
    solucion: "Umbral de 1,5 V: 335 mA, frente a 169 mA con 2,5 V."
    comprobar:
      - { con: { V_th: 1.5 }, I_f: 0.335, tol: 0.01 }
      - { con: { V_th: 2.5 }, I_f: 0.169, tol: 0.01 }

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [201, 216, 230, 232]
    ideas:
      - { titulo: "7.A.", texto: "No hay ganador absoluto: por debajo del cruce, R_{DS(on)}; por encima, Q_{g} y tiempos." }
      - { titulo: "7.B.", texto: "La puerta es un RC: R_{g} reparte entre pérdidas e interferencia." }
      - { titulo: "7.C.", texto: "La ley cuadrática amplifica la dispersión del umbral: hace falta un lazo." }
