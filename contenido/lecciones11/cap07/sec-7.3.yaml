# Lección 1.2 de la sección 7.3 «Identificación Física y Símbolos» (cap07). Formato: contenido/lecciones11/GUIA.md.
# Los dos transistores «misteriosos» (umbral de 1,5 V y de 3,5 V, con k = 0,5 A/V² de la figura 7.3) son un ejemplo
# ilustrativo dentro de los márgenes de la sección 7.1 (de 1 a 2 V los de nivel lógico, de 3 a 4 V los estándar).
# 1.2: todo sobre el esquema «mosfet» (el diodo de cuerpo dibujado), con la carga de 6 Ω y 12 V de la sección 7.5.
# 1.2.1 (autor121-ana, «aprender haciendo», GUIA §13): el umbral se busca con la fuente de laboratorio (objetivo) y el
# del segundo se escribe (leer); la puerta, la punta roja, la puerta aislada y el diodo de cuerpo se tocan en el
# símbolo de la figura 7.4, y la lengüeta viva en la foto 7.5(a). Quedan los encapsulados SMD emparejados y una
# pregunta de opciones (kilohmios entre puerta y fuente); el orden del procedimiento y la familia FET salen (el
# procedimiento ya se hace tocando).
leccion: cap07/sec-7.3

libro:
  52: "La flecha del sustrato apunta hacia dentro en los de canal N"
  53: "buscar el diodo de cuerpo"
  55: "La lengüeta metálica es el drenador en la práctica totalidad de los casos"
  56: "la lengüeta está encapsulada y aislada de fábrica"
  57: "Aquí la placa es el disipador"
  58: "una soldadura parcial en esa almohadilla dobla o triplica la resistencia térmica"
  59: "con marcaje de dos o tres caracteres que no es deducible"
  62: "es el terminal que da OL contra los otros dos en ambos sentidos"
  63: "hay que descargar la puerta entre pruebas cortocircuitándola con la fuente"
  70: "si mide kilohmios o menos, la puerta está dañada"
  71: "el canal en tres tramos indica enriquecimiento"
  72: "IRLZ24N en encapsulado TO-220"
  "cap07#12": "de 1 a 2 V en los de nivel lógico, de 3 a 4 V en los estándar"
  "cap07#40": "(k = 0,5 A/V², Vth = 2 V)"
  "cap07#93": "la carga resistiva de 6 Ω"

modelo:
  valores:
    V_gs: { sim: "V_{GS}", nombre: "tensión de la fuente de laboratorio", unidad: V, valor: 0 }
    s_t: { tipo: interruptor, nombre: "segundo transistor", valor: 0 }
    k_m: { sim: "k", nombre: "parámetro del transistor", unidad: "A/V²", valor: 0.5 }
    V_dd: { sim: "V_{DD}", nombre: "alimentación de la carga", unidad: V, valor: 12 }
    R_d: { sim: "R_{D}", nombre: "carga", unidad: Ω, valor: 6 }
  calculos:
    V_t: { si: s_t, entonces: "3.5", sino: "1.5", sim: "V_{th}", nombre: "tensión umbral del transistor", unidad: V }
    V_ov: { expr: "max(0, V_gs - V_t)", sim: "V_{ov}", nombre: "tensión de sobreexcitación", unidad: V }
    b_m: { expr: "k_m*V_ov + 1/R_d", sim: "b", nombre: "coeficiente", unidad: "" }
    V_tri: { expr: "(b_m - sqrt(max(0, b_m^2 - 2*k_m*V_dd/R_d)))/k_m", sim: "V_{tri}", nombre: "V_DS en zona óhmica", unidad: V }
    V_sat: { expr: "V_dd - R_d*k_m*V_ov^2/2", sim: "V_{sat}", nombre: "V_DS en saturación", unidad: V }
    V_ds: { expr: "max(V_sat, min(V_ov, V_tri))", sim: "V_{DS}", nombre: "tensión drenador-fuente", unidad: V }
    I_d: { expr: "(V_dd - V_ds)/R_d", sim: "I_{D}", nombre: "corriente del canal", unidad: A }

tarjetas:
  - id: explore-umbral
    tipo: explorar
    titulo: "Busque el umbral"
    texto: "Un MOSFET sin hoja de datos. Suba V_{GS} con la fuente de laboratorio y deténgase justo cuando el canal empiece a conducir."
    nota: "Dos transistores de ejemplo, con k = 0,5 A/V², sobre una carga de 6 Ω."
    libro: [62, "cap07#40", "cap07#12", "cap07#93"]
    fijar: { s_t: 0 }
    inicio: { V_gs: 0 }
    widget:
      tipo: circuito
      esquema: mosfet
      piezas: { vdd: V_dd, rd: R_d, entrada: V_gs, k: k_m, vth: V_t }
      lectura: { valor: I_d, rotulo: "Corriente del canal" }
      corriente: I_d
      mide: { id: I_d, vds: V_ds, vgs: V_gs }
      mandos:
        - { valor: V_gs, min: 0, max: 6, paso: 0.1, rotulo: "Tensión de la fuente" }
    objetivo:
      condiciones:
        - { valor: I_d, min: 0.001, rotulo: "Conduce" }
        - { valor: V_gs, max: 1.6, rotulo: "Puerta: {{V_gs}}" }
      logrado: "Empieza hacia {{V_gs}}: de 1 a 2 V, es de nivel lógico."
      pistas:
        - { cuando: { valor: I_d, max: 0 }, texto: "Todavía no conduce: suba la tensión poco a poco." }
        - { texto: "Ya conduce de sobra: baje hasta el primer paso en que aparece corriente." }
    escalera:
      - "El umbral es la tensión a la que aparece la primera corriente."
    solucion: "Hacia 1,5 V: nivel lógico."
    comprobar:
      - { con: { V_gs: 1.6 }, I_d: 0.0025, tol: 0.01 }
      - { V_t: 1.5 }

  - id: nivel-logico
    tipo: leer
    titulo: "El segundo transistor"
    texto: "Ahora otro transistor. Busque igual dónde empieza a conducir y escriba su umbral."
    libro: [62, "cap07#12"]
    fijar: { s_t: 1 }
    inicio: { V_gs: 0 }
    widget:
      tipo: circuito
      esquema: mosfet
      piezas: { vdd: V_dd, rd: R_d, entrada: V_gs, k: k_m, vth: V_t }
      lectura: { valor: I_d, rotulo: "Corriente del canal" }
      corriente: I_d
      mide: { id: I_d, vgs: V_gs }
      mandos:
        - { valor: V_gs, min: 0, max: 6, paso: 0.1, rotulo: "Tensión de la fuente" }
    leer:
      objetivo: V_t
      unidad: V
      tol: 0.04
      rotulo: "Umbral del segundo transistor"
    exito: "3,5 V: entre 3 y 4 V, un MOSFET estándar."
    escalera:
      - "Suba la tensión hasta el primer paso con corriente: ese es el umbral."
    solucion: "3,5 V: estándar."
    comprobar:
      - { V_t: 3.5 }

  - id: localice-puerta
    tipo: tocar
    titulo: "¿Cuál es la puerta?"
    texto: "Con el Brymen, un terminal da OL contra los otros dos en ambos sentidos. Toque en el símbolo cuál es."
    libro: [62, 71]
    widget:
      tipo: figura
      figura: fig-7.4
      zonas:
        - { id: g, rect: [148, 136, 52, 36], rotulo: "Terminal de la izquierda" }
        - { id: d, rect: [242, 32, 36, 36], rotulo: "Terminal de arriba" }
        - { id: s, rect: [242, 172, 36, 36], rotulo: "Terminal de abajo" }
    tocar:
      bien: [g]
      porque:
        d: "Entre drenador y fuente está el diodo de cuerpo: en un sentido conduce."
        s: "La fuente está unida al drenador por el diodo de cuerpo: no da OL en los dos sentidos."
    exito: "La puerta: separada del canal por el óxido, no conduce hacia nada."
    escalera:
      - "¿Qué terminal no toca el canal en el dibujo?"
    solucion: "G, la puerta, aislada por el óxido."

  - id: punta-roja
    tipo: tocar
    titulo: "La punta roja"
    texto: "Prueba de diodos entre los otros dos: conduce con la roja en uno de ellos. Toque ese terminal en el canal N."
    libro: [62, 71]
    widget:
      tipo: figura
      figura: fig-7.4
      zonas:
        - { id: g, rect: [148, 136, 52, 36], rotulo: "Terminal de la izquierda" }
        - { id: d, rect: [242, 32, 36, 36], rotulo: "Terminal de arriba" }
        - { id: s, rect: [242, 172, 36, 36], rotulo: "Terminal de abajo" }
    tocar:
      bien: [s]
      porque:
        d: "El drenador es el cátodo del diodo de cuerpo. Eso valdría para un canal P."
        g: "La puerta da OL en ambos sentidos: está aislada por el óxido."
    exito: "La roja está en el ánodo del diodo de cuerpo, y en un canal N el ánodo es la fuente."
    escalera:
      - "Con la prueba de diodos, la punta roja está en el ánodo. Siga el diodo del dibujo."
    solucion: "La fuente, S: el ánodo del diodo de cuerpo."

  - id: por-que-descargar
    tipo: tocar
    titulo: "¿Por qué descargarla?"
    texto: "Entre medida y medida hay que unir la puerta con la fuente: guarda carga y falsea la lectura. Toque el detalle del símbolo que lo explica."
    libro: [63, 71]
    widget:
      tipo: figura
      figura: fig-7.4
      zonas:
        - { id: puerta, rect: [186, 76, 36, 92], rotulo: "Línea vertical de la izquierda" }
        - { id: flecha, rect: [224, 105, 36, 36], rotulo: "Flecha del centro" }
        - { id: diodo, rect: [270, 98, 36, 46], rotulo: "Símbolo de la derecha" }
    tocar:
      bien: [puerta]
      porque:
        flecha: "La flecha dice el tipo de canal, no por qué la puerta guarda carga."
        diodo: "El diodo de cuerpo une fuente y drenador; la puerta no lo toca."
    exito: "La puerta separada del canal es un condensador aislado: guarda la carga y deja el canal encendido."
    escalera:
      - "¿Qué forman dos placas separadas por un aislante?"
    solucion: "La puerta, separada del canal: un condensador."

  - id: simbolo
    tipo: tocar
    titulo: "Leer el símbolo"
    texto: "Sin memorizar variantes: toque el detalle que orienta el dispositivo sin ambigüedad."
    libro: [52, 53, 71]
    widget:
      tipo: figura
      figura: fig-7.4
      zonas:
        - { id: puerta, rect: [186, 76, 36, 92], rotulo: "Línea vertical de la izquierda" }
        - { id: flecha, rect: [224, 105, 36, 36], rotulo: "Flecha del centro" }
        - { id: diodo, rect: [270, 98, 36, 46], rotulo: "Símbolo de la derecha" }
    tocar:
      bien: [diodo]
      porque:
        flecha: "La flecha dice el canal, pero en los símbolos de tres terminales se traslada a la fuente y despista."
        puerta: "La puerta dice que está aislada, no hacia dónde va la corriente."
    exito: "El diodo de cuerpo casi siempre está dibujado: su cátodo marca el drenador de un canal N."
    escalera:
      - "Busque lo que distingue fuente de drenador."
    solucion: "El diodo de cuerpo."

  - id: encapsulados
    tipo: tocar
    titulo: "La lengüeta"
    texto: "Un IRLZ24N en TO-220. Toque la parte que está a la tensión de conmutación y hay que aislar del disipador."
    libro: [55, 72]
    widget:
      tipo: figura
      figura: fig-7.5
      zonas:
        - { id: lengueta, rect: [80, 50, 285, 190], rotulo: "Arriba, la parte metálica" }
        - { id: cuerpo, rect: [89, 240, 268, 230], rotulo: "El cuerpo negro" }
        - { id: patillas, rect: [100, 471, 230, 240], rotulo: "Abajo, las tres patas" }
        - { id: otros, rect: [470, 0, 1130, 800], rotulo: "La foto de la derecha" }
    tocar:
      bien: [lengueta]
      porque:
        cuerpo: "El plástico aísla; lo que está vivo es el metal de detrás."
        patillas: "La central sí es el drenador, pero la que toca el disipador es otra parte."
        otros: "Busque en el TO-220 de la foto (a)."
    exito: "La lengüeta es el drenador: se aísla con mica o silicona, o se usa un TO-220FP, aislado de fábrica."
    escalera:
      - "¿Qué parte se atornilla al disipador?"
    solucion: "La lengüeta metálica: es el drenador."

  - id: smd
    tipo: pregunta
    fase: "Empareje"
    titulo: "Lo que hay debajo"
    texto: "Una cada encapsulado con lo que hay que vigilar al montarlo."
    libro: [56, 57, 58, 59]
    emparejar:
      - ["TO-220FP", "Aislado de fábrica, a costa de resistencia térmica"]
      - ["D²PAK", "La placa es el disipador: área de cobre y vías"]
      - ["PowerPAK", "Soldar bien la almohadilla de la cara inferior"]
      - ["SOT-23", "El marcaje no es deducible: hay que consultarlo"]
    exito: "Una soldadura parcial de la almohadilla dobla o triplica la resistencia térmica."
    pistas:
      - { texto: "Los SMD de potencia usan la placa como disipador." }
    escalera:
      - "FP significa «cuerpo aislado»."
    solucion: "FP–aislado, D²PAK–cobre, PowerPAK–almohadilla, SOT-23–marcaje."

  - id: puerta-fuente
    tipo: pregunta
    titulo: "Antes de montarlo"
    texto: "Un MOSFET recuperado mide unos kilohmios entre puerta y fuente. ¿Qué indica?"
    libro: [70]
    widget:
      tipo: figura
      figura: fig-7.4
      zonas:
        - { id: puerta, rect: [186, 76, 36, 92], rotulo: "Línea vertical de la izquierda" }
    opciones:
      - texto: "La puerta está dañada"
        bien: true
        porque: "Debe ser infinita. Kilohmios o menos es una puerta perforada: montarlo podría destruir el driver."
      - texto: "Lleva un Zener de protección: aceptable"
        porque: "Un Zener o una resistencia interna dan megaohmios, no kilohmios."
      - texto: "Es normal: la puerta es un condensador"
        porque: "Un condensador mide infinito en continua. Kilohmios es una fuga."
    escalera:
      - "¿Qué debería medir una puerta aislada por óxido?"
    solucion: "Dañada: una puerta sana mide infinito, o megaohmios si lleva protección."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [52, 55, 62, 70]
    ideas:
      - { titulo: "El símbolo.", texto: "Canal continuo o en tramos, la flecha y el diodo de cuerpo dicen el tipo." }
      - { titulo: "La lengüeta.", texto: "Casi siempre es el drenador: está viva y hay que aislarla." }
      - { titulo: "Con el Brymen.", texto: "La puerta da OL; el diodo da fuente, drenador y tipo; la tensión, el umbral." }
      - { titulo: "Puerta sana.", texto: "Infinita entre puerta y fuente; kilohmios es una puerta dañada." }
