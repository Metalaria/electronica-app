# Lección 1.2 de la sección 7.3 «Identificación Física y Símbolos» (cap07). Formato: contenido/lecciones11/GUIA.md.
# Los dos transistores «misteriosos» (umbral de 1,5 V y de 3,5 V, con k = 0,5 A/V² de la figura 7.3) son un ejemplo
# ilustrativo dentro de los márgenes de la sección 7.1 (de 1 a 2 V los de nivel lógico, de 3 a 4 V los estándar).
leccion: cap07/sec-7.3

libro:
  52: "La flecha del sustrato apunta hacia dentro en los de canal N"
  53: "buscar el diodo de cuerpo"
  55: "La lengüeta metálica es el drenador en la práctica totalidad de los casos"
  56: "la lengüeta está encapsulada y aislada de fábrica"
  57: "Aquí la placa es el disipador"
  58: "una soldadura parcial en esa almohadilla dobla o triplica la resistencia térmica"
  59: "con marcaje de dos o tres caracteres que no es deducible"
  62: "es el terminal que da OL contra los otros dos en ambos sentidos"
  63: "hay que descargar la puerta entre pruebas cortocircuitándola con la fuente"
  66: "no tiene óxido que perforar y es mucho más robusto frente a estática"
  67: "Dominan la radiofrecuencia y las microondas"
  68: "Es la tecnología que está desplazando al IGBT en vehículos eléctricos y solar"
  70: "si mide kilohmios o menos, la puerta está dañada"
  "cap07#12": "de 1 a 2 V en los de nivel lógico, de 3 a 4 V en los estándar"
  "cap07#40": "(k = 0,5 A/V², Vth = 2 V)"

modelo:
  valores:
    V_gs: { sim: "V_{GS}", nombre: "tensión de la fuente de laboratorio", unidad: V, valor: 0 }
    s_t: { tipo: interruptor, nombre: "segundo transistor", valor: 0 }
    k_m: { sim: "k", nombre: "parámetro del transistor", unidad: "A/V²", valor: 0.5 }
  calculos:
    V_t: { si: s_t, entonces: "3.5", sino: "1.5", sim: "V_{th}", nombre: "tensión umbral del transistor", unidad: V }
    I_d: { expr: "0.5*k_m*max(0, V_gs - V_t)^2", sim: "I_{D}", nombre: "corriente del canal", unidad: A }

tarjetas:
  - id: explore-umbral
    tipo: explorar
    titulo: "Busque el umbral"
    texto: "Suba V_{GS} con la fuente de laboratorio y mire cuándo empieza a conducir el canal. Cambie de transistor y repita."
    nota: "Dos transistores de ejemplo, con k = 0,5 A/V²."
    libro: ["cap07#40", "cap07#12"]
    widget:
      tipo: grafica
      x: { id: vg, min: 0, max: 6, unidad: V, rotulo: "V_{GS}" }
      y: { min: 0, max: 2, unidad: A, rotulo: "I_{D}" }
      curvas:
        - { expr: "0.5*k_m*max(0, vg - V_t)^2", color: azul, rotulo: "corriente del canal" }
      asas:
        - { mueve: V_gs, x: "V_gs", y: "I_d", rotulo: "Su fuente" }
      lectura: { valor: I_d, rotulo: "Corriente del canal" }
      mandos:
        - { valor: V_gs, min: 0, max: 6, paso: 0.1, rotulo: "Tensión de la fuente" }
        - { valor: s_t, tipo: interruptor, rotulo: "Segundo transistor" }
    requiere: { mover: [V_gs, s_t] }

  - id: nivel-logico
    tipo: predecir
    titulo: "¿De qué familia es?"
    texto: "Un transistor desconocido empieza a conducir hacia 1,5 V de puerta. ¿De qué familia es?"
    libro: ["cap07#12"]
    fijar: { s_t: 0 }
    widget:
      tipo: grafica
      x: { id: vg, min: 0, max: 6, unidad: V, rotulo: "V_{GS}" }
      y: { min: 0, max: 2, unidad: A, rotulo: "I_{D}" }
      curvas:
        - { expr: "0.5*k_m*max(0, vg - V_t)^2", color: azul, rotulo: "corriente del canal" }
      lectura: { valor: V_t, rotulo: "Umbral de este transistor" }
      ocultar: true
    opciones:
      - texto: "Nivel lógico"
        bien: true
        porque: "Los de nivel lógico tienen el umbral entre 1 y 2 V."
      - texto: "Estándar"
        porque: "Los estándar empiezan a conducir de 3 a 4 V."
      - texto: "De empobrecimiento"
        porque: "Uno de empobrecimiento conduciría ya sin tensión de puerta."
    escalera:
      - "Compare con los márgenes de umbral de las dos familias."
    solucion: "Nivel lógico: umbral de 1 a 2 V."
    comprobar:
      - { V_t: 1.5 }

  - id: ordene-identificar
    tipo: pregunta
    fase: "Ordene"
    titulo: "Un MOSFET sin hoja de datos"
    texto: "Ordene el procedimiento con el Brymen."
    libro: [62, 63]
    ordenar:
      - "Buscar el terminal que da OL contra los otros dos: la puerta."
      - "Medir el diodo entre los otros dos terminales."
      - "Por el ánodo del diodo, deducir fuente, drenador y tipo de canal."
      - "Descargar la puerta uniéndola a la fuente."
      - "Subir la tensión de puerta hasta que conduzca: el umbral."
    exito: "Con tres terminales y un tipo identificados, el umbral dice si es de nivel lógico."
    pistas:
      - { texto: "La puerta se reconoce primero: está aislada de todo." }
    escalera:
      - "El diodo de cuerpo aparece entre los dos terminales que no son la puerta."
    solucion: "Puerta, diodo, tipo, descarga y umbral."

  - id: punta-roja
    tipo: pregunta
    titulo: "La punta roja"
    texto: "En un canal N, el diodo conduce con la punta roja en un terminal. ¿Qué terminal es?"
    libro: [62]
    widget:
      tipo: grafica
      x: { id: vg, min: 0, max: 6, unidad: V, rotulo: "V_{GS}" }
      y: { min: 0, max: 2, unidad: A, rotulo: "I_{D}" }
      curvas:
        - { expr: "0.5*k_m*max(0, vg - V_t)^2", color: azul, rotulo: "corriente del canal" }
    opciones:
      - texto: "La fuente"
        bien: true
        porque: "La punta roja está en el ánodo del diodo de cuerpo, y en un canal N el ánodo es la fuente."
      - texto: "El drenador"
        porque: "Eso valdría para un canal P. En un canal N, el cátodo del diodo es el drenador."
      - texto: "La puerta"
        porque: "La puerta da OL en ambos sentidos: está aislada por el óxido."
    escalera:
      - "Con la prueba de diodos, la punta roja está en el ánodo."
    solucion: "La fuente, ánodo del diodo de cuerpo en un canal N."

  - id: por-que-descargar
    tipo: porque
    titulo: "¿Por qué descargarla?"
    texto: "Entre medida y medida hay que unir la puerta con la fuente. ¿Por qué?"
    libro: [63]
    widget:
      tipo: grafica
      x: { id: vg, min: 0, max: 6, unidad: V, rotulo: "V_{GS}" }
      y: { min: 0, max: 2, unidad: A, rotulo: "I_{D}" }
      curvas:
        - { expr: "0.5*k_m*max(0, vg - V_t)^2", color: azul, rotulo: "corriente del canal" }
    opciones:
      - texto: "Su capacidad conserva la carga y falsea las lecturas siguientes"
        bien: true
        porque: "Una puerta cargada deja el canal conduciendo. Ese mismo efecto es la prueba funcional más rápida."
      - texto: "Para proteger el Brymen"
        porque: "El Brymen no corre peligro. El problema es que la puerta cargada mantiene el canal encendido."
      - texto: "Porque la puerta conduce hacia la fuente"
        porque: "No conduce: está aislada. Precisamente por eso guarda la carga."
    escalera:
      - "La puerta es un condensador aislado."
    solucion: "La carga que guarda la puerta deja el canal encendido y falsea la siguiente medida."

  - id: simbolo
    tipo: pregunta
    fase: "Empareje"
    titulo: "Leer el símbolo"
    texto: "Una cada detalle del símbolo con lo que dice del transistor."
    libro: [52, 53]
    emparejar:
      - ["Canal en una línea continua", "Empobrecimiento: el canal existe en reposo"]
      - ["Canal en tres tramos", "Enriquecimiento: hay que crear el canal"]
      - ["Flecha del sustrato hacia dentro", "Canal N"]
      - ["Diodo con el cátodo en el drenador", "Canal N de potencia"]
    exito: "En la duda, el diodo de cuerpo orienta el dispositivo sin ambigüedad."
    pistas:
      - { texto: "La flecha sigue la unión PN, como la del emisor de un bipolar." }
    escalera:
      - "Una línea continua dibuja un canal que ya está ahí."
    solucion: "Continua–empobrecimiento, tramos–enriquecimiento, flecha hacia dentro–N, cátodo en drenador–N."

  - id: encapsulados
    tipo: pregunta
    fase: "Empareje"
    titulo: "Lo que hay debajo"
    texto: "Una cada encapsulado con lo que hay que vigilar al montarlo."
    libro: [55, 56, 57, 58, 59]
    emparejar:
      - ["TO-220", "La lengüeta es el drenador: aislarla del disipador"]
      - ["TO-220FP", "Aislado de fábrica, a costa de resistencia térmica"]
      - ["D²PAK", "La placa es el disipador: área de cobre y vías"]
      - ["PowerPAK", "Soldar bien la almohadilla de la cara inferior"]
      - ["SOT-23", "El marcaje no es deducible: hay que consultarlo"]
    exito: "Una soldadura parcial de la almohadilla dobla o triplica la resistencia térmica."
    pistas:
      - { texto: "Los de patillas tienen la lengüeta viva; los SMD usan la placa." }
    escalera:
      - "FP significa «cuerpo aislado»."
    solucion: "TO-220–lengüeta viva, FP–aislado, D²PAK–cobre, PowerPAK–almohadilla, SOT-23–marcaje."

  - id: familia
    tipo: pregunta
    fase: "Empareje"
    titulo: "Los parientes"
    texto: "Una cada transistor de efecto de campo con su punto fuerte."
    libro: [66, 67, 68]
    emparejar:
      - ["JFET", "Sin óxido: robusto frente a la estática y de poco ruido"]
      - ["HEMT de GaN", "Radiofrecuencia y conversión de alta frecuencia"]
      - ["MOSFET de SiC", "R_{DS(on)} baja a tensiones muy altas"]
    exito: "El SiC está desplazando al IGBT en vehículos eléctricos y solar."
    pistas:
      - { texto: "El carburo de silicio soporta un campo de ruptura diez veces mayor." }
    escalera:
      - "Solo uno de los tres tiene una unión PN como puerta."
    solucion: "JFET–robusto y silencioso, GaN–alta frecuencia, SiC–alta tensión."

  - id: puerta-fuente
    tipo: pregunta
    titulo: "Antes de montarlo"
    texto: "Un MOSFET recuperado mide unos kilohmios entre puerta y fuente. ¿Qué indica?"
    libro: [70]
    widget:
      tipo: grafica
      x: { id: vg, min: 0, max: 6, unidad: V, rotulo: "V_{GS}" }
      y: { min: 0, max: 2, unidad: A, rotulo: "I_{D}" }
      curvas:
        - { expr: "0.5*k_m*max(0, vg - V_t)^2", color: azul, rotulo: "corriente del canal" }
    opciones:
      - texto: "La puerta está dañada"
        bien: true
        porque: "Debe ser infinita. Kilohmios o menos es una puerta perforada: montarlo podría destruir el driver."
      - texto: "Lleva un Zener de protección: aceptable"
        porque: "Un Zener o una resistencia interna dan megaohmios, no kilohmios."
      - texto: "Es normal: la puerta es un condensador"
        porque: "Un condensador mide infinito en continua. Kilohmios es una fuga."
    escalera:
      - "¿Qué debería medir una puerta aislada por óxido?"
    solucion: "Dañada: una puerta sana mide infinito, o megaohmios si lleva protección."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [52, 55, 62, 70]
    ideas:
      - { titulo: "El símbolo.", texto: "Canal continuo o en tramos, la flecha y el diodo de cuerpo dicen el tipo." }
      - { titulo: "La lengüeta.", texto: "Casi siempre es el drenador: está viva y hay que aislarla." }
      - { titulo: "Con el Brymen.", texto: "La puerta da OL; el diodo da fuente, drenador y tipo; la tensión, el umbral." }
      - { titulo: "Puerta sana.", texto: "Infinita entre puerta y fuente; kilohmios es una puerta dañada." }
