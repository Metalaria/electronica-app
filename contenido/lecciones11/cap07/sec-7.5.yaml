# Lección 1.2 de la sección 7.5 «El MOSFET como Interruptor de Potencia» (cap07). Formato: contenido/lecciones11/GUIA.md.
# El PWM se dibuja a 1 kHz (la frecuencia del ejemplo del libro). La carga es la de 12 V y 2 A (6 Ω) del libro.
# 1.2: el interruptor es el esquema «mosfet» (PWM, pull-down de 10 kΩ). El transistor es de ejemplo: V_th = 2 V y
# k = 6,25 A/V², elegido para que R_DS(on) ≈ 1/(k·V_ov) dé los 20 mΩ del libro con 10 V de puerta (sección 7.2).
# El lineal es el mismo MOSFET en saturación con la V_GS que da la mitad de potencia; «en el osciloscopio», 2,5 V de
# puerta (ejemplo de puerta insuficiente).
# 1.2.1 (autor121-ana, «aprender haciendo», GUIA §13): la media se consigue con el ciclo de trabajo (objetivo; la
# fórmula D·V va en su explicación), el motor se ajusta, la disipación del lineal se mide (V_DS e I con el multímetro)
# y se escribe, el peor punto del lineal (6 W) se busca en la curva, el calefactor se predice, el pull-down se toca en
# el esquema y la puerta de 2,5 V se mide en conducción. Quedan dos preguntas de opciones (por qué tan eficiente, sin
# driver) y un emparejamiento que junta qué ve la carga y su frecuencia.
leccion: cap07/sec-7.5

libro:
  89: "o está totalmente apagado (no disipa porque no hay corriente), o totalmente encendido"
  90: 'V_("promedio") = D dot.op V_("alimentación")'
  91: "conviene una resistencia de pull-down (de unos 10 kΩ) entre compuerta y fuente"
  93: "el transistor deja caer 3,5 V y disipa 5 W, con un rendimiento del 71 %"
  94: "por eso los amplificadores de clase D conmutan por encima de 300 kHz"
  95: "Los motores se gobiernan entre 1 y 20 kHz"
  96: "A un kilohercio se puede vivir sin él; a cien, no."
  98: "un VDS de varios voltios en conducción es un transistor en saturación por puerta insuficiente"
  100: "la potencia depende del eficaz: P = V²·D/R, no de Vmedia²/R"
  "cap07#236": "con ciclo de trabajo del 60 % desde una fuente de 24 V"

modelo:
  valores:
    V_al: { sim: "V_{alimentación}", nombre: "tensión de alimentación", unidad: V, valor: 12 }
    D: { sim: "D", nombre: "ciclo de trabajo", unidad: "", valor: 0.5 }
    T_p: { sim: "T", nombre: "periodo del PWM", unidad: s, valor: 0.001 }
    R_L: { sim: "R_{L}", nombre: "carga", unidad: Ω, valor: 6 }
    R_on: { sim: "R_{DS(on)}", nombre: "resistencia en conducción", unidad: Ω, valor: 0.02 }
    x_p: { sim: "P/P_{máx}", nombre: "fracción de la potencia", unidad: "", valor: 0.5 }
    V_gx: { sim: "V_{G}", nombre: "nivel alto de la puerta", unidad: V, valor: 10 }
    V_ts: { sim: "V_{th}", nombre: "tensión umbral (ejemplo)", unidad: V, valor: 2 }
    k_s: { sim: "k", nombre: "parámetro del transistor (ejemplo)", unidad: "A/V²", valor: 6.25 }
    R_pd: { sim: "R_{GS}", nombre: "pull-down de puerta", unidad: Ω, valor: 10000 }
  calculos:
    f_p: { expr: "1/T_p", sim: "f", nombre: "frecuencia del PWM", unidad: Hz }
    V_ox: { expr: "max(0, V_gx - V_ts)", sim: "V_{ov}", nombre: "sobreexcitación con la puerta alta", unidad: V }
    b_x: { expr: "k_s*V_ox + 1/R_L", sim: "b", nombre: "coeficiente", unidad: "" }
    V_trx: { expr: "(b_x - sqrt(max(0, b_x^2 - 2*k_s*V_al/R_L)))/k_s", sim: "V_{tri}", nombre: "V_DS en zona óhmica", unidad: V }
    V_stx: { expr: "V_al - R_L*k_s*V_ox^2/2", sim: "V_{sat}", nombre: "V_DS en saturación", unidad: V }
    V_on: { expr: "max(V_stx, min(V_ox, V_trx))", sim: "V_{DS(on)}", nombre: "V_DS con la puerta alta", unidad: V }
    I_on: { expr: "(V_al - V_on)/R_L", sim: "I_{D}", nombre: "corriente con la puerta alta", unidad: A }
    V_pr: { expr: "D*V_al", sim: "V_{promedio}", nombre: "tensión media", unidad: V }
    t_on: { expr: "D*T_p", sim: "t_{on}", nombre: "tiempo encendido", unidad: s }
    V_lin: { expr: "V_al*sqrt(x_p)", sim: "V_{carga}", nombre: "tensión en la carga con el lineal", unidad: V }
    I_lin: { expr: "V_lin/R_L", sim: "I", nombre: "corriente con el lineal", unidad: A }
    P_lin: { expr: "(V_al - V_lin)*I_lin", sim: "P_{lineal}", nombre: "disipación del elemento lineal", unidad: W }
    P_pwm: { expr: "(V_al/R_L)^2*R_on*x_p", sim: "P_{PWM}", nombre: "disipación del MOSFET con PWM", unidad: W }
    ren: { expr: "100*x_p*V_al^2/R_L/(x_p*V_al^2/R_L + P_lin)", sim: "η", nombre: "rendimiento del lineal", unidad: "%", cifras: 2 }
    P_rms: { expr: "V_al^2*D/R_L", sim: "P", nombre: "potencia en la carga", unidad: W }
    P_med: { expr: "(D*V_al)^2/R_L", sim: "P", nombre: "con la tensión media", unidad: W }
    V_gl: { expr: "V_ts + sqrt(2*I_lin/k_s)", sim: "V_{GS}", nombre: "puerta del lineal", unidad: V }
    V_tl: { expr: "V_al - V_lin", sim: "V_{DS}", nombre: "caída en el transistor lineal", unidad: V }
    P_car: { expr: "x_p*V_al^2/R_L", sim: "P_{carga}", nombre: "potencia de la carga", unidad: W }
    P_ple: { expr: "V_al^2/R_L", sim: "P", nombre: "potencia plena", unidad: W }

tarjetas:
  - id: explore-pwm
    tipo: explorar
    titulo: "Encendido o apagado"
    texto: "La carga de 6 Ω con PWM a 1 kHz. Mueva el ciclo de trabajo hasta que la carga reciba 9 V de media."
    nota: "Transistor de ejemplo de 20 mΩ en conducción."
    libro: [89, 90, 93]
    fijar: { V_al: 12, T_p: 0.001, R_L: 6, V_gx: 10 }
    inicio: { D: 0.5 }
    widget:
      tipo: circuito
      esquema: mosfet
      piezas: { vdd: V_al, rd: R_L, entrada: V_gx, rgs: R_pd, k: k_s, vth: V_ts, f: f_p, ciclo: D }
      lectura: { valor: V_pr, rotulo: "Tensión media en la carga" }
      grafica:
        x: { id: t, min: 0, max: 0.002, unidad: s, rotulo: "t" }
        y: { min: 0, max: 14, unidad: V, rotulo: "v" }
        curvas:
          - { expr: "V_al - (1 - ceil(t*f_p - floor(t*f_p) - D))*(V_al - V_on)", color: naranja, rotulo: "v_{D}", mide: drenador }
          - { expr: "V_gx*(1 - ceil(t*f_p - floor(t*f_p) - D))", color: azul, rotulo: "v_{G}", mide: puerta, discontinua: true }
      mandos:
        - { valor: D, min: 0.05, max: 0.95, paso: 0.05, rotulo: "Ciclo de trabajo" }
    objetivo:
      condiciones:
        - { valor: V_pr, objetivo: 9, tol: 0.02, rotulo: "Media: {{V_pr}}" }
      logrado: "V_{promedio} = D · V_{alimentación} = {{V_pr}}. El drenador sigue siendo todo o nada: solo cambia cuánto dura."
      pistas:
        - { cuando: { valor: V_pr, mayor: 9.18 }, texto: "Sobra media: acorte el tiempo encendido." }
        - { texto: "Falta media: alargue el tiempo encendido." }
    escalera:
      - "La media es la fracción del periodo encendida por la tensión de la fuente."
    solucion: "D = 0,75: 0,75 · 12 = 9 V."
    comprobar:
      - { con: { D: 0.75 }, V_pr: 9 }

  - id: ajuste-motor
    tipo: ajuste
    titulo: "Un motor a 14,4 V"
    texto: "Un motor con PWM desde 24 V debe recibir 14,4 V de media. Ajuste el ciclo de trabajo."
    libro: [90, "cap07#236"]
    fijar: { V_al: 24, T_p: 0.001 }
    inicio: { D: 0.3 }
    widget:
      tipo: grafica
      x: { id: t, min: 0, max: 0.002, unidad: s, rotulo: "t" }
      y: { min: 0, max: 26, unidad: V, rotulo: "v_{motor}" }
      curvas:
        - { expr: "V_al*floor(1 + D - (t/T_p - floor(t/T_p)))", color: azul, rotulo: "PWM" }
        - { expr: "D*V_al", color: naranja, rotulo: "media", discontinua: true }
      lectura: { valor: V_pr, rotulo: "Tensión media" }
      mandos:
        - { valor: D, min: 0.05, max: 0.95, paso: 0.05, rotulo: "Ciclo de trabajo" }
    ajuste:
      valor: V_pr
      objetivo: 14.4
      tol: 0.01
      rotulo: "Tensión media"
      escala: { min: 0, max: 24 }
      bajo: "Le falta tensión: alargue el tiempo encendido."
      alto: "Le sobra tensión: acorte el tiempo encendido."
      dentro: "Ciclo del 60 %: el motor promedia los pulsos por su inercia."
    comprobar:
      - { con: { D: 0.6 }, V_pr: 14.4 }

  - id: prediga-lineal
    tipo: leer
    titulo: "Con un transistor lineal"
    texto: "La carga de 6 Ω recibe la mitad de potencia con el MOSFET en zona activa. Mida lo que cae en el transistor y escríbalo."
    libro: [93]
    fijar: { V_al: 12, R_L: 6, R_on: 0.02, x_p: 0.5 }
    widget:
      tipo: circuito
      esquema: mosfet
      piezas: { vdd: V_al, rd: R_L, entrada: V_gl, k: k_s, vth: V_ts }
      corriente: I_lin
      mide: { id: I_lin, vds: V_tl }
      instrumento: { tipo: multimetro, modos: [V], puntos: [vdd, d, "0"] }
      mandos: []
    leer:
      objetivo: V_tl
      unidad: V
      tol: 0.03
      rotulo: "V_{DS} del transistor"
      medida: { entre: [d, "0"] }
      errores:
        - { expr: "V_lin", texto: "Esos 8,5 V son los de la carga, entre el raíl y el drenador. El transistor va del drenador a masa." }
    exito: "3,5 V con 1,41 A: el transistor disipa 5 W mientras la carga recibe 12 W. Rendimiento del 71 %."
    escalera:
      - "El transistor va del drenador a la fuente, que está en masa."
    solucion: "Roja en el drenador, negra en masa: unos 3,5 V."
    comprobar:
      - { P_lin: 4.97, V_lin: 8.49, V_tl: 3.51, I_lin: 1.414, ren: 70.7, tol: 0.01 }
      - { P_car: 12 }

  - id: sorpresa-pwm
    tipo: sorpresa
    titulo: "El peor punto"
    texto: "Recorra la potencia de la carga y busque dónde disipa más el lineal. Compárelo con el MOSFET de 20 mΩ con PWM."
    libro: [93]
    fijar: { V_al: 12, R_L: 6, R_on: 0.02 }
    inicio: { x_p: 0.5 }
    widget:
      tipo: grafica
      x: { id: xf, min: 0, max: 1, unidad: "", rotulo: "fracción de la potencia" }
      y: { min: 0, max: 7, unidad: W, rotulo: "disipación" }
      curvas:
        - { expr: "(V_al - V_al*sqrt(xf))*V_al*sqrt(xf)/R_L", color: azul, rotulo: "lineal" }
        - { expr: "(V_al/R_L)^2*R_on*xf", color: naranja, rotulo: "PWM" }
      asas:
        - { mueve: x_p, x: "x_p", y: "P_lin", rotulo: "Su punto" }
      lectura: { valor: P_lin, rotulo: "Disipación del lineal" }
      datos:
        - { valor: P_pwm, rotulo: "Con PWM: {{P_pwm}}" }
      mandos:
        - { valor: x_p, min: 0.05, max: 1, paso: 0.05, rotulo: "Fracción de la potencia" }
    objetivo:
      condiciones:
        - { valor: P_lin, objetivo: 6, tol: 0.005, rotulo: "Lineal: {{P_lin}}" }
      logrado: "Con la carga al 25 %, el lineal disipa {{P_lin}}; el PWM, {{P_pwm}}. Más de cien veces menos."
      pistas:
        - { cuando: { valor: x_p, mayor: 0.25 }, texto: "Aquí el lineal aún no está en su peor punto: baje la potencia." }
        - { texto: "Se ha pasado de largo: suba un poco la potencia." }
    escalera:
      - "Busque el máximo de la curva azul."
    solucion: "Al 25 % de la potencia: 6 W en el lineal, 0,02 W con PWM."
    comprobar:
      - { con: { x_p: 0.25 }, P_lin: 6, P_pwm: 0.02 }

  - id: por-que-pwm
    tipo: porque
    titulo: "¿Por qué tan eficiente?"
    texto: "Con PWM el MOSFET disipa más de cien veces menos que el lineal. ¿Por qué?"
    libro: [89, 93]
    fijar: { V_al: 12, R_L: 6, R_on: 0.02 }
    widget:
      tipo: grafica
      x: { id: xf, min: 0, max: 1, unidad: "", rotulo: "fracción de la potencia" }
      y: { min: 0, max: 7, unidad: W, rotulo: "disipación" }
      curvas:
        - { expr: "(V_al - V_al*sqrt(xf))*V_al*sqrt(xf)/R_L", color: azul, rotulo: "lineal" }
        - { expr: "(V_al/R_L)^2*R_on*xf", color: naranja, rotulo: "PWM" }
    opciones:
      - texto: "Nunca tiene a la vez tensión y corriente apreciables"
        bien: true
        porque: "Apagado no hay corriente; encendido, la caída es mínima. Solo pierde I² · R · D y las conmutaciones."
      - texto: "Porque la carga recibe menos potencia"
        porque: "La carga recibe la misma potencia media. Lo que cambia es lo que se pierde en el elemento de control."
      - texto: "Porque el MOSFET no tiene resistencia"
        porque: "Tiene sus 20 mΩ. Su pérdida es pequeña porque la caída en conducción es pequeña."
    escalera:
      - "Disipación = tensión por corriente. ¿Cuándo son grandes las dos?"
    solucion: "O está apagado o encendido a fondo: nunca tensión y corriente a la vez."

  - id: estime-calefactor
    tipo: simular
    fase: "Estime"
    titulo: "Un calefactor con PWM"
    texto: "Un calefactor de 6 Ω con PWM al 50 % desde 12 V. ¿Qué potencia recibe?"
    libro: [100]
    fijar: { V_al: 12, R_L: 6, D: 0.5 }
    simular:
      objetivo: P_rms
      unidad: W
      tol: 0.05
      rotulo: "Potencia del calefactor"
      errores:
        - { expr: "P_med", texto: "Ha usado la tensión media al cuadrado: 6² / 6. La potencia depende del eficaz." }
        - { expr: "P_ple", texto: "Esos 24 W son con la tensión plena todo el tiempo: aquí, solo la mitad." }
    exito: "P = V² · D/R = 12 W. Con la tensión media, 6 V, saldrían 6 W: el error clásico."
    escalera:
      - "Durante el 50 % del tiempo recibe la potencia plena."
    solucion: "12² · 0,5 / 6 = 12 W."
    comprobar:
      - { P_rms: 12, P_med: 6, V_pr: 6, P_ple: 24 }

  - id: que-ve-la-carga
    tipo: pregunta
    fase: "Empareje"
    titulo: "Qué ve la carga"
    texto: "Una cada carga con cómo responde a los pulsos."
    libro: [94, 95]
    emparejar:
      - ["Motor de continua", "Promedia por su inercia: de 1 a 20 kHz"]
      - ["LED", "Responde ciclo a ciclo; promedia el ojo"]
      - ["Resistencia calefactora", "Promedia por su inercia térmica"]
      - ["Altavoz", "Reproduciría el PWM: clase D por encima de 300 kHz"]
    exito: "Lo que no promedia es lo que hay que filtrar. Demasiado alta, en cambio, mandan las pérdidas de conmutación."
    pistas:
      - { texto: "Busque qué inercia tiene cada carga: mecánica, térmica o ninguna." }
    escalera:
      - "Un altavoz no tiene inercia suficiente en la banda audible."
    solucion: "Motor–inercia, LED–ojo, calefactor–térmica, altavoz–clase D."

  - id: pull-down
    tipo: elegir
    titulo: "La resistencia de 10 kΩ"
    texto: "Mientras el microcontrolador arranca, su pin flota. Toque la pieza que mantiene apagado el MOSFET."
    libro: [91]
    fijar: { V_al: 12, R_L: 6, V_gx: 10 }
    widget:
      tipo: circuito
      esquema: mosfet
      piezas: { vdd: V_al, rd: R_L, entrada: V_gx, rgs: R_pd, k: k_s, vth: V_ts }
      corriente: I_on
      mide: { id: I_on, vds: V_on, vgs: V_gx }
      mandos: []
    elegir:
      zonas: [rgs, rd, entrada, transistor]
      bien: [rgs]
      porque:
        rd: "Es la carga: va al drenador, no fija la puerta."
        entrada: "Es el pin que flota mientras arranca: justo lo que hay que suplir."
        transistor: "El MOSFET guarda carga en su puerta: sin algo que la descargue, puede encenderse."
    exito: "La de 10 kΩ entre puerta y fuente: sin control, deja la puerta a 0 V y el MOSFET apagado."
    escalera:
      - "Busque lo que une la puerta con la fuente."
    solucion: "La resistencia de puerta a masa, el pull-down."

  - id: driver
    tipo: pregunta
    titulo: "Sin driver"
    texto: "Un pin de microcontrolador gobierna directamente la puerta de un MOSFET de potencia a cien kilohercios. ¿Qué pasa?"
    libro: [96]
    fijar: { V_al: 12, R_L: 6, V_gx: 10 }
    widget:
      tipo: circuito
      esquema: mosfet
      piezas: { vdd: V_al, rd: R_L, entrada: V_gx, rgs: R_pd, k: k_s, vth: V_ts }
      corriente: I_on
      mide: { id: I_on, vds: V_on }
    opciones:
      - texto: "Las transiciones duran microsegundos y el transistor se calienta"
        bien: true
        porque: "Con unos 20 mA, mover decenas de nanoculombios cuesta microsegundos de transición disipando."
      - texto: "Nada: la puerta no consume corriente"
        porque: "No en continua; pero cada conmutación mueve la carga de puerta, y eso pide amperios de pico."
      - texto: "El pin se quema por la tensión de drenador"
        porque: "La puerta está aislada del drenador. El problema es la corriente de pico, no la tensión."
    escalera:
      - "Cada conmutación mueve la carga de puerta Q_{g}."
    solucion: "Conmuta lento y se calienta: a cien kilohercios el driver es imprescindible."

  - id: banco-drenador
    tipo: leer
    titulo: "En el osciloscopio"
    texto: "La puerta solo llega a 2,5 V. Mida la V_{DS} del transistor encendido y escriba lo que marca."
    nota: "Puerta de ejemplo de 2,5 V."
    libro: [98]
    fijar: { V_al: 12, R_L: 6, V_gx: 2.5 }
    widget:
      tipo: circuito
      esquema: mosfet
      piezas: { vdd: V_al, rd: R_L, entrada: V_gx, k: k_s, vth: V_ts }
      corriente: I_on
      mide: { id: I_on, vds: V_on }
      instrumento: { tipo: multimetro, modos: [V], puntos: [vdd, in, d, "0"] }
      mandos: []
    leer:
      objetivo: V_on
      unidad: V
      tol: 0.03
      rotulo: "V_{DS} encendido"
      medida: { entre: [d, "0"] }
    exito: "Varios voltios con corriente: está en saturación por puerta insuficiente y disipa como un lineal."
    escalera:
      - "Roja en el drenador, negra en la fuente, que es masa."
    solucion: "Unos 7,3 V: no llega a la región óhmica."
    comprobar:
      - { V_on: 7.31, tol: 0.01 }

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [89, 90, 93, 100]
    ideas:
      - { titulo: "PWM.", texto: "La media es D · V; la carga promedia si tiene inercia." }
      - { titulo: "Eficiencia.", texto: "Apagado o encendido a fondo: cien veces menos calor que un lineal." }
      - { titulo: "Media no es eficaz.", texto: "En una resistencia, P = V² · D/R." }
      - { titulo: "La puerta.", texto: "Pull-down de 10 kΩ y, a frecuencias altas, un driver." }
