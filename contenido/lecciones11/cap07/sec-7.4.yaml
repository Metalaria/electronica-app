# Lección 1.2 de la sección 7.4 «Parámetros Clave de los MOSFET de Potencia» (cap07). Formato: contenido/lecciones11/GUIA.md.
# La subida de R_DS(on) con la temperatura es la lineal del libro (0,7 % por grado, ×1,5 a 100 °C). En la tarjeta del
# umbral, k = 0,5 A/V² (figura 7.3) es un ejemplo para ver la tendencia, no un dato del transistor.
# 1.2: el umbral y el Arduino van sobre el esquema «mosfet» con la tira de LED de 12 V y 2 A del ejercicio 7.3 (6 Ω).
# 1.2.1 (autor121-ana, «aprender haciendo», GUIA §13): la pérdida se lleva a 1,5 W calentando la unión (objetivo), la
# de 15 A se predice (simular), la V_DSS se elige (reto), la tira se apaga moviendo solo el umbral del ejemplar, y el
# Arduino y los 33 mΩ a 3,3 V se hacen sobre la gráfica derecha de la figura 7.6: R_DS(on) = 20 mΩ·(V_spec − V_th)/
# (V_GS − V_th), la forma que da esos 33 mΩ (nivel lógico, V_th ≈ 1,5 V, 20 mΩ a 4,5 V; estándar, V_th ≈ 3,5 V, 20 mΩ
# a 10 V). Quedan dos preguntas de opciones (el umbral, Q_g frente a R_DS(on)); salen el emparejamiento de los
# extremos (va en la explicación del umbral) y la I_D de portada (va en el éxito de la temperatura).
leccion: cap07/sec-7.4

libro:
  75: "Carga necesaria para conmutar (afecta a la velocidad)"
  76: "determina las pérdidas por conducción (P = I²·RDS(on))"
  77: "como el IRLZ44N"
  79: "para 24 V se elige un transistor de 60 V (el doble son 48 V), no de 30"
  80: "Casi siempre es un valor teórico calculado con la lengüeta a 25 °C"
  81: "Un transistor de 10 mΩ que conmuta 10 A disipa 1 W en frío y 1,5 W en régimen"
  82: "Un transistor con umbral de 4 V gobernado desde 3,3 V apenas conduce"
  83: "conmuta más deprisa y disipa menos en alta frecuencia"
  85: "del orden de 1 °C/W en un TO-220"
  86: "MOSFET estándar frente a nivel lógico según la tensión de puerta"
  "cap07#40": "(k = 0,5 A/V², Vth = 2 V)"
  "cap07#236": "Un MOSFET con RDS(on) = 20 mΩ conduce 15 A en estado encendido"

modelo:
  valores:
    R_25: { sim: "R_{DS(on)}", nombre: "resistencia a 25 °C", unidad: Ω, valor: 0.01 }
    T_j: { sim: "T_{j}", nombre: "temperatura de unión", unidad: "°C", valor: 25 }
    I_c: { sim: "I", nombre: "corriente conmutada", unidad: A, valor: 10 }
    R_a: { sim: "R_{DS(on)}", nombre: "resistencia en conducción", unidad: Ω, valor: 0.02 }
    I_a: { sim: "I", nombre: "corriente", unidad: A, valor: 15 }
    V_al: { sim: "V_{alimentación}", nombre: "tensión de alimentación", unidad: V, valor: 24 }
    V_dss: { sim: "V_{DSS}", nombre: "tensión máxima del transistor", unidad: V, valor: 30 }
    V_mc: { sim: "V_{GS}", nombre: "tensión de mando", unidad: V, valor: 3.3 }
    V_th: { sim: "V_{th}", nombre: "umbral de este ejemplar", unidad: V, valor: 2 }
    k_m: { sim: "k", nombre: "parámetro del transistor", unidad: "A/V²", valor: 0.5 }
    V_dd: { sim: "V_{DD}", nombre: "alimentación de la tira", unidad: V, valor: 12 }
    R_d: { sim: "R_{D}", nombre: "tira de LED (12 V, 2 A)", unidad: Ω, valor: 6 }
    R_sp: { sim: "R_{DS(on)}", nombre: "resistencia especificada de los dos de la figura", unidad: Ω, valor: 0.02 }
    V_tl: { sim: "V_{th}", nombre: "umbral del de nivel lógico", unidad: V, valor: 1.5 }
    V_sl: { sim: "V_{GS}", nombre: "puerta a la que se especifica el de nivel lógico", unidad: V, valor: 4.5 }
    V_ts: { sim: "V_{th}", nombre: "umbral del estándar", unidad: V, valor: 3.5 }
    V_ss: { sim: "V_{GS}", nombre: "puerta a la que se especifica el estándar", unidad: V, valor: 10 }
    s_ll: { tipo: interruptor, nombre: "transistor de nivel lógico", valor: 0 }
    V_g: { sim: "V_{GS}", nombre: "tensión del pin", unidad: V, valor: 5 }
  calculos:
    V_ov: { expr: "max(0, V_mc - V_th)", sim: "V_{ov}", nombre: "tensión de sobreexcitación", unidad: V }
    b_m: { expr: "k_m*V_ov + 1/R_d", sim: "b", nombre: "coeficiente", unidad: "" }
    V_tri: { expr: "(b_m - sqrt(max(0, b_m^2 - 2*k_m*V_dd/R_d)))/k_m", sim: "V_{tri}", nombre: "V_DS en zona óhmica", unidad: V }
    V_sat: { expr: "V_dd - R_d*k_m*V_ov^2/2", sim: "V_{sat}", nombre: "V_DS en saturación", unidad: V }
    V_ds: { expr: "max(V_sat, min(V_ov, V_tri))", sim: "V_{DS}", nombre: "tensión drenador-fuente", unidad: V }
    I_d: { expr: "(V_dd - V_ds)/R_d", sim: "I_{D}", nombre: "corriente de la tira", unidad: A }
    R_T: { expr: "R_25*(1 + 0.007*(T_j - 25))", sim: "R_{DS(on)}", nombre: "resistencia a esa temperatura", unidad: Ω }
    P_c: { expr: "I_c^2*R_T", sim: "P", nombre: "pérdida de conducción", unidad: W }
    P_a: { expr: "I_a^2*R_a", sim: "P", nombre: "pérdida de conducción", unidad: W }
    P_b: { expr: "I_a^2*R_a*10", sim: "P", nombre: "con diez veces más resistencia", unidad: W }
    V_reg: { expr: "0.8*V_dss", sim: "0,8 · V_{DSS}", nombre: "tensión de trabajo admisible", unidad: V }
    V_pk: { expr: "2*V_al", sim: "V_{pico}", nombre: "picos de conmutación", unidad: V }
    I_mc: { expr: "0.5*k_m*max(0, V_mc - V_th)^2", sim: "I_{D}", nombre: "corriente que admite el canal", unidad: A }
    R_ll: { expr: "R_sp*(V_sl - V_tl)/max(0.0001, V_g - V_tl)", sim: "R_{DS(on)}", nombre: "resistencia del de nivel lógico", unidad: Ω }
    R_st: { expr: "R_sp*(V_ss - V_ts)/max(0.0001, V_g - V_ts)", sim: "R_{DS(on)}", nombre: "resistencia del estándar", unidad: Ω }
    R_sel: { si: s_ll, entonces: "R_ll", sino: "R_st", sim: "R_{DS(on)}", nombre: "resistencia del transistor elegido", unidad: Ω }
    R_l33: { expr: "R_sp*(V_sl - V_tl)/(V_mc - V_tl)", sim: "R_{DS(on)}", nombre: "resistencia del de nivel lógico con 3,3 V", unidad: Ω }
    P_1: { expr: "I_a*R_a", sim: "I · R", nombre: "sin elevar al cuadrado", unidad: W }

tarjetas:
  - id: explore-temperatura
    tipo: explorar
    titulo: "R_{DS(on)} se calienta"
    texto: "Un transistor de 10 mΩ conduce 10 A: 1 W en frío. Suba la temperatura de unión hasta que disipe 1,5 W."
    libro: [76, 80, 81]
    fijar: { R_25: 0.01, I_c: 10 }
    inicio: { T_j: 25 }
    widget:
      tipo: grafica
      x: { id: tx, min: 25, max: 150, unidad: "°C", rotulo: "T_{j}" }
      y: { min: 0, max: 0.02, unidad: Ω, rotulo: "R_{DS(on)}" }
      curvas:
        - { expr: "R_25*(1 + 0.007*(tx - 25))", color: azul, rotulo: "R_{DS(on)}" }
      asas:
        - { mueve: T_j, x: "T_j", y: "R_T", rotulo: "Su unión" }
      lectura: { valor: P_c, rotulo: "Pérdida de conducción" }
      datos:
        - { valor: R_T, rotulo: "R_{DS(on)} = {{R_T}}" }
      mandos:
        - { valor: T_j, min: 25, max: 150, paso: 5, rotulo: "Temperatura de unión" }
    objetivo:
      condiciones:
        - { valor: P_c, objetivo: 1.5, tol: 0.02, rotulo: "Pérdida: {{P_c}}" }
      logrado: "Hacia {{T_j}}: un 0,7 % por grado, ×1,5 a 100 °C. Ni la R_{DS(on)} ni la I_{D} de portada, ambas a 25 °C, lo cuentan."
      pistas:
        - { cuando: { valor: P_c, mayor: 1.53 }, texto: "Se ha pasado: baje la temperatura." }
        - { texto: "Todavía disipa poco: caliente más la unión." }
    escalera:
      - "La pérdida sube lo mismo que la resistencia: busque dónde vale ×1,5, a 0,7 % por grado."
    solucion: "Hacia 100 °C: unos 15 mΩ y 1,5 W."
    comprobar:
      - { con: { T_j: 100 }, P_c: 1.525, R_T: 0.01525, tol: 0.001 }
      - { P_c: 1 }

  - id: estime-conduccion
    tipo: simular
    fase: "Estime"
    titulo: "Pérdida por conducción"
    texto: "Un MOSFET de 20 mΩ conduce 15 A. ¿Qué potencia disipa por conducción?"
    libro: [76, "cap07#236"]
    simular:
      objetivo: P_a
      unidad: W
      tol: 0.05
      rotulo: "Pérdida"
      errores:
        - { expr: "P_1", texto: "Ha multiplicado I · R: la corriente va al cuadrado, 15² = 225." }
    exito: "15² · 0,020 = 4,5 W. Con 200 mΩ serían 45 W: la diferencia entre calentarse y destruirse."
    escalera:
      - "P = I² · R_{DS(on)}, con R en ohmios."
    solucion: "225 · 0,020 = 4,5 W."
    comprobar:
      - { P_a: 4.5, P_b: 45, P_1: 0.3 }

  - id: reto-vds
    tipo: reto
    titulo: "Elija la V_{DSS}"
    texto: "Se conmutan 24 V con inductancias parásitas. Elija un transistor que trabaje como mucho al 80 % y cubra picos del doble."
    libro: [79]
    fijar: { V_al: 24 }
    inicio: { V_dss: 30 }
    widget:
      tipo: grafica
      x: { id: vx, min: 0, max: 120, unidad: V, rotulo: "V_{DSS}" }
      y: { min: 0, max: 100, unidad: V, rotulo: "tensión" }
      curvas:
        - { expr: "0.8*vx", color: azul, rotulo: "80 % de V_{DSS}" }
        - { expr: "V_pk", color: tinta, rotulo: "picos: el doble de 24 V", discontinua: true }
      asas:
        - { mueve: V_dss, x: "V_dss", y: "V_reg", rotulo: "Su transistor" }
      lectura: { valor: V_reg, rotulo: "Tensión admisible" }
      mandos:
        - { valor: V_dss, lista: [24, 30, 60, 100], rotulo: "V_{DSS}" }
    condiciones:
      - { valor: V_reg, mayor: 47.9, rotulo: "80 %: {{V_reg}}" }
    exito: "Su 80 % cubre los picos de 48 V. El libro elige el menor que cumple: 60 V, no 30."
    pistas:
      - { texto: "Se queda corto: los picos llegan al doble de 24 V y el 80 % de este transistor no los cubre." }
    escalera:
      - "Los picos llegan a 48 V; busque el transistor cuyo 80 % sea eso."
    solucion: "48 V es el 80 % de 60 V."
    comprobar:
      - { con: { V_dss: 60 }, V_reg: 48, V_pk: 48 }

  - id: sorpresa-umbral
    tipo: sorpresa
    titulo: "El mismo modelo, otro umbral"
    texto: "La hoja da un umbral de 2 a 4 V; el mando es de 3,3 V. Moviendo solo el umbral del ejemplar, consiga que la tira no encienda."
    nota: "k = 0,5 A/V², de ejemplo."
    libro: [82, "cap07#40", "cap07#236"]
    fijar: { V_mc: 3.3, k_m: 0.5 }
    inicio: { V_th: 2 }
    widget:
      tipo: circuito
      esquema: mosfet
      piezas: { vdd: V_dd, rd: R_d, entrada: V_mc, k: k_m, vth: V_th }
      lectura: { valor: I_d, rotulo: "Corriente de la tira" }
      datos:
        - { valor: V_ds, rotulo: "V_{DS} = {{V_ds}}" }
      corriente: I_d
      mide: { id: I_d, vds: V_ds, vgs: V_mc }
      mandos:
        - { valor: V_th, min: 2, max: 4, paso: 0.1, rotulo: "Umbral del ejemplar" }
    objetivo:
      condiciones:
        - { valor: I_d, max: 0, rotulo: "Tira: {{I_d}}" }
      logrado: "Con un umbral de {{V_th}}, los 3,3 V no lo superan: la tira apagada. Y es un ejemplar legal, dentro de la hoja."
      pistas:
        - { texto: "Aún conduce: suba el umbral del ejemplar." }
    escalera:
      - "El canal no se forma mientras la puerta no supere el umbral."
    solucion: "Con un umbral de 3,3 V o más: el extremo alto de la hoja no conduce con 3,3 V."
    comprobar:
      - { con: { V_th: 3.3 }, I_d: 0 }
      - { I_d: 0.4225, tol: 0.01 }

  - id: por-que-umbral
    tipo: porque
    titulo: "¿Por qué tanta diferencia?"
    texto: "Con el mismo mando, un ejemplar conduce y otro del mismo modelo no. ¿Por qué, y qué hay que comprobar?"
    libro: [82]
    fijar: { V_mc: 3.3, k_m: 0.5, V_th: 4 }
    widget:
      tipo: circuito
      esquema: mosfet
      piezas: { vdd: V_dd, rd: R_d, entrada: V_mc, k: k_m, vth: V_th }
      lectura: { valor: I_d, rotulo: "Corriente de la tira" }
      corriente: I_d
      mide: { id: I_d, vds: V_ds }
    opciones:
      - texto: "Cuenta V_{GS} − V_{th}: diseñe con el umbral alto para conducir y con el bajo para cortar"
        bien: true
        porque: "Con 4 V de umbral, 3,3 V apenas conducen; con 1 V, el ruido de una entrada flotante lo enciende."
      - texto: "Uno de los dos está averiado: se cambia"
        porque: "Ambos cumplen la hoja: el umbral se da como un intervalo, y los dos extremos son legales."
      - texto: "La puerta consume más corriente en uno: se pone una resistencia"
        porque: "La puerta no consume corriente en continua; decide la tensión por encima del umbral."
    escalera:
      - "¿Cuánto supera 3,3 V a un umbral de 4 V?"
    solucion: "Decide la sobreexcitación: el diseño debe funcionar con los dos extremos del intervalo."

  - id: arduino
    tipo: explorar
    titulo: "Desde un Arduino"
    texto: "Una tira de 12 V y 2 A desde un pin de 5 V como mucho. Elija transistor y tensión de puerta hasta lograr sus 20 mΩ."
    libro: [77, 81, 86, "cap07#236"]
    inicio: { s_ll: 0, V_g: 5 }
    widget:
      tipo: grafica
      x: { id: vg, min: 0, max: 12, unidad: V, rotulo: "V_{GS}" }
      y: { min: 0.005, max: 10, unidad: Ω, rotulo: "R_{DS(on)}", escala: log }
      curvas:
        - { expr: "R_sp*(V_sl - V_tl)/max(0.0001, vg - V_tl)", color: verde, rotulo: "nivel lógico" }
        - { expr: "R_sp*(V_ss - V_ts)/max(0.0001, vg - V_ts)", color: naranja, rotulo: "estándar" }
      lectura: { valor: R_sel, rotulo: "R_{DS(on)} del elegido" }
      mandos:
        - { valor: s_ll, tipo: interruptor, rotulo: "De nivel lógico" }
        - { valor: V_g, min: 2, max: 5, paso: 0.1, rotulo: "Tensión del pin" }
    objetivo:
      condiciones:
        - { valor: R_sel, max: 0.0201, rotulo: "R_{DS(on)}: {{R_sel}}" }
      logrado: "Un nivel lógico, como el IRLZ44N, da {{R_sel}} con {{V_g}}. El estándar necesita unos 10 V."
      pistas:
        - { cuando: { valor: s_ll, max: 0 }, texto: "Con el estándar, ni con 5 V baja de 20 mΩ: con 5 V queda a medio conducir." }
        - { texto: "Suba la tensión del pin: el de nivel lógico se especifica a 4,5 V." }
    escalera:
      - "Los estándar se especifican con 10 V en la puerta; los de nivel lógico, con 4,5 V."
    solucion: "De nivel lógico y el pin a 4,5 V o más."
    comprobar:
      - { con: { s_ll: 1, V_g: 4.5 }, R_sel: 0.02 }
      - { R_sel: 0.08667, tol: 0.01 }

  - id: lea-tres-tres
    tipo: marcar
    titulo: "Con 3,3 V"
    texto: "Desde un microcontrolador de 3,3 V, la R_{DS(on)} es mayor que la del catálogo. Marque la que da el de nivel lógico."
    libro: [81, 86]
    fijar: { V_mc: 3.3 }
    widget:
      tipo: grafica
      x: { id: vg, min: 0, max: 12, unidad: V, rotulo: "V_{GS}" }
      y: { min: 0.005, max: 10, unidad: Ω, rotulo: "R_{DS(on)}", escala: log }
      curvas:
        - { expr: "R_sp*(V_sl - V_tl)/max(0.0001, vg - V_tl)", color: verde, rotulo: "nivel lógico" }
        - { expr: "R_sp*(V_ss - V_ts)/max(0.0001, vg - V_ts)", color: naranja, rotulo: "estándar" }
      mandos: []
    marcar:
      modo: y
      y: "R_l33"
      tol: 0.03
      inicio: { x: 6, y: 1 }
      rotulo: "La R_{DS(on)} a 3,3 V"
    pistas:
      - { cuando: { valor: marca_y, menor: 0.025 }, texto: "Esa es la de la especificación, a 4,5 V. A 3,3 V la curva está más arriba." }
      - { texto: "Demasiado alto: siga la curva verde hasta 3,3 V y lea su altura." }
    exito: "Unos 33 mΩ: más de los 20 del catálogo. Con menos V_{GS}, más resistencia y más calor."
    escalera:
      - "Suba en vertical desde 3,3 V hasta la curva verde."
    solucion: "Unos 33 mΩ: la curva verde a la altura de 3,3 V."
    comprobar:
      - { R_l33: 0.03333, tol: 0.001 }

  - id: qg-o-ron
    tipo: pregunta
    titulo: "Igual R_{DS(on)}"
    texto: "Dos MOSFET con la misma R_{DS(on)}. ¿Cuál disipa menos conmutando a alta frecuencia?"
    libro: [75, 83, 85]
    widget:
      tipo: grafica
      x: { id: tx, min: 25, max: 150, unidad: "°C", rotulo: "T_{j}" }
      y: { min: 0, max: 0.02, unidad: Ω, rotulo: "R_{DS(on)}" }
      curvas:
        - { expr: "R_25*(1 + 0.007*(tx - 25))", color: azul, rotulo: "R_{DS(on)}" }
    opciones:
      - texto: "El de menor carga de puerta Q_{g}"
        bien: true
        porque: "Conmuta más deprisa y disipa menos en alta frecuencia; con igual Q_{g}, mandaría la R_{DS(on)}."
      - texto: "El de mayor I_{D} máxima"
        porque: "La I_{D} de portada es teórica, a 25 °C, y no dice nada de la velocidad."
      - texto: "Disipan lo mismo"
        porque: "En conducción sí; al conmutar, el de menor Q_{g} pasa menos tiempo en la transición."
    escalera:
      - "¿Qué parámetro decide la velocidad de conmutación?"
    solucion: "El de menor Q_{g}."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [76, 79, 81, 82, 83]
    ideas:
      - { titulo: "Conducción.", texto: "P = I² · R_{DS(on)}, y R_{DS(on)} sube ×1,5 a 100 °C." }
      - { titulo: "Tensión.", texto: "Como mucho el 80 %, con picos del doble: para 24 V, 60 V." }
      - { titulo: "Umbral.", texto: "Diseñe con los dos extremos del intervalo, no con el típico." }
      - { titulo: "Q_{g} frente a R_{DS(on)}.", texto: "Menos carga de puerta conmuta más deprisa; menos resistencia conduce mejor." }
