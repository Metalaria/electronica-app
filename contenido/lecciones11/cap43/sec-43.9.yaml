# Lección 1.2 de la sección 44.9 «El Ruido en el Amplificador Discreto» (cap43; etiqueta sec-43.9).
# Formato: contenido/lecciones11/GUIA.md. Sección cualitativa: la figura 44.17 (fig-43.17: ruido referido a la entrada
# frente a la corriente de colector con tres resistencias de fuente, y qué dispositivo elegir) con zonas en sus tres
# mínimos y en sus recuadros; el resto, opciones y emparejar con los argumentos del libro.
# 1.2.1 (autor121-ana, «aprender haciendo», GUIA §13): el mínimo de una fuente alta y el dispositivo de una baja se
# tocan en la figura 44.18; la primera etapa (dos etapas iguales sumadas en cuadratura, el ruido de la segunda dividido
# por la ganancia de la primera), la realimentación (un no inversor cuya relación señal/ruido no cambia con la
# ganancia) y el √B se exploran con objetivo. Las dos etapas iguales, los 100 mV de señal y el milivoltio de ruido
# del no inversor son de ejemplo. «Bajo ruido en abstracto» pasa al éxito del mínimo; queda una pregunta de opciones
# (la medida en el banco) y el emparejamiento de fuentes.
leccion: cap43/sec-43.9

libro:
  308: "es el suelo del transistor"
  309: "Es proporcional a √IB"
  310: "referido a la entrada se divide por gm"
  314: "hay una corriente óptima, y depende de la impedancia de la fuente"
  315: "Conviene menos corriente"
  319: "JFET, cuya corriente de entrada es despreciable"
  320: "su ruido de corriente es minúsculo"
  322: "dividido el de las siguientes por la ganancia acumulada"
  324: "Las resistencias de la entrada deben ser bajas en lo posible"
  325: "la realimentación no reduce el ruido de entrada"
  327: "el ruido crece con √B"
  334: "existe uno adecuado para una impedancia de fuente concreta"
  336: "nunca al aire"
  337: "El mínimo cae en corrientes distintas en cada caso"
  338: "con su mínimo, y qué dispositivo elegir"

modelo:
  valores:
    G_1: { sim: "G_{1}", nombre: "ganancia de la primera etapa", unidad: "", valor: 1 }
    B_p: { sim: "B", nombre: "banda, en tanto por ciento de la original", unidad: "%", valor: 100 }
    V_i9: { sim: "v_{in}", nombre: "señal de entrada", unidad: V, valor: 0.1 }
    e_9: { sim: "e_{n}", nombre: "ruido de la primera etapa, referido a la entrada", unidad: V, valor: 0.001 }
    R_19: { sim: "R_{1}", nombre: "resistencia a masa", unidad: Ω, valor: 1000 }
    R_29: { sim: "R_{2}", nombre: "resistencia de realimentación", unidad: Ω, valor: 99000 }
    A_09: { sim: "A_{0}", nombre: "ganancia en lazo abierto", unidad: "", valor: 100000 }
    V_s9: { sim: "V_{sat}", nombre: "salida máxima", unidad: V, valor: 12 }
  calculos:
    e_p: { expr: "100*sqrt(1 + 1/G_1^2)", sim: "e_{total}", nombre: "ruido total referido a la entrada, frente al de la primera sola", unidad: "%" }
    n_p: { expr: "100*sqrt(B_p/100)", sim: "e_{n}", nombre: "ruido frente al de la banda original", unidad: "%" }
    G_9: { expr: "1 + R_29/R_19", sim: "G", nombre: "ganancia del no inversor", unidad: "" }
    V_o9: { expr: "V_i9*G_9/(1 + G_9/A_09)", sim: "v_{o}", nombre: "señal a la salida", unidad: V }
    N_o9: { expr: "e_9*G_9/(1 + G_9/A_09)", sim: "e_{o}", nombre: "ruido a la salida", unidad: V }
    snr9: { expr: "V_o9/N_o9", sim: "S/N", nombre: "relación señal a ruido", unidad: "" }

tarjetas:
  - id: empareje-fuentes
    tipo: pregunta
    fase: "Empareje"
    titulo: "Dónde nace el ruido"
    texto: "Una cada fuente de ruido del transistor con cómo depende de la corriente."
    libro: [308, 309, 310]
    emparejar:
      - ["Resistencia de base r_{bb'}", "Ruido térmico: el suelo del transistor"]
      - ["Disparo de la corriente de base", "Crece con la corriente, como √I_{B}"]
      - ["Disparo de la corriente de colector", "Referido a la entrada se divide por g_{m}: baja con la corriente"]
    exito: "Dos de ellas tiran en sentidos opuestos: por eso hay una corriente óptima."
    pistas:
      - { texto: "g_{m} sube con la corriente, así que lo que se divide por g_{m} baja." }
    escalera:
      - "Una no depende de la corriente: la que solo se mejora cambiando de transistor."
    solucion: "r_{bb'}–suelo térmico, base–crece con √I_{B}, colector–baja al dividirse por g_{m}."

  - id: explore-optimo
    tipo: tocar
    titulo: "Existe una corriente óptima"
    texto: "Un piezo: fuente de impedancia alta, por la que circula el ruido de corriente. Toque el punto de trabajo de menos ruido para esa fuente."
    libro: [314, 315, 334, 337, 338]
    widget:
      tipo: figura
      figura: fig-43.17
      zonas:
        - { id: alta, rotulo: "Mínimo de la curva de arriba", rect: [47, 98, 36, 36] }
        - { id: media, rotulo: "Mínimo de la curva del medio", rect: [113, 131, 36, 36] }
        - { id: baja, rotulo: "Mínimo de la curva de abajo", rect: [178, 155, 36, 36] }
    tocar:
      bien: [alta]
      porque:
        media: "Ese es el mínimo de la fuente intermedia."
        baja: "Ese es el de la fuente de impedancia baja: con tanta corriente, el ruido de corriente del piezo se dispara."
    exito: "Menos corriente: con impedancia alta domina el ruido de corriente. Cada fuente tiene su mínimo: no existe «bajo ruido» en abstracto."
    escalera:
      - "Al subir la corriente, el ruido de corriente sube."
    solucion: "El mínimo de la curva de arriba, a corriente muy baja."

  - id: pregunta-dispositivo
    tipo: tocar
    titulo: "Para un micrófono dinámico"
    texto: "Un micrófono dinámico, fuente de impedancia baja. Toque el dispositivo de entrada que le da menos ruido."
    libro: [319, 320]
    widget:
      tipo: figura
      figura: fig-43.17
      zonas:
        - { id: baja, rotulo: "Primer recuadro", rect: [267, 28, 182, 46] }
        - { id: alta, rotulo: "Segundo recuadro", rect: [267, 78, 182, 45] }
        - { id: mbf, rotulo: "Tercer recuadro", rect: [267, 127, 182, 36] }
    tocar:
      bien: [baja]
      porque:
        alta: "El JFET es para fuentes de impedancia alta: su ruido de corriente es minúsculo, pero aquí manda el de tensión."
        mbf: "Esa elección es para muy baja frecuencia, por la esquina 1/f."
    exito: "Bipolar con corriente alta: con impedancia baja domina el ruido de tensión. Para un fotodiodo o un piezo, un JFET: no tiene corriente de base que produzca disparo."
    escalera:
      - "Con impedancia baja, ¿qué ruido domina?"
    solucion: "El primer recuadro: bipolar, con corriente alta."

  - id: pregunta-primera
    tipo: explorar
    titulo: "La primera etapa"
    texto: "Dos etapas iguales en cadena: el ruido de la segunda se divide por la ganancia de la primera. Súbala hasta que el total no pase del 1 % sobre la primera sola."
    libro: [322, 324]
    nota: "Etapas de ejemplo, sumadas en cuadratura."
    inicio: { G_1: 1 }
    widget:
      tipo: grafica
      x: { id: g, min: 1, max: 100, escala: log, unidad: "", rotulo: "G_{1}" }
      y: { min: 95, max: 145, unidad: "%", rotulo: "ruido total" }
      curvas:
        - { expr: "100*sqrt(1 + 1/g^2)", color: naranja, rotulo: "total, referido a la entrada" }
        - { expr: "100", color: tinta, rotulo: "primera etapa sola", discontinua: true }
      marcas:
        - { x: "G_1", y: "e_p", rotulo: "{{e_p}}" }
      lectura: { valor: e_p, rotulo: "Ruido total" }
      mandos:
        - { valor: G_1, lista: [1, 2, 5, 10, 100], rotulo: "Ganancia de la primera etapa" }
    objetivo:
      condiciones:
        - { valor: e_p, max: 101, rotulo: "Total: {{e_p}}" }
      logrado: "Con {{G_1}} de ganancia, la segunda ya no se nota: la primera debe ganar lo bastante para enterrarla, con resistencias de entrada bajas."
      pistas:
        - { texto: "Más ganancia en la primera." }
    escalera:
      - "Referido a la entrada, el ruido de la segunda se divide por G_{1}."
    solucion: "Con 10 de ganancia, la segunda ya casi no añade."
    comprobar:
      - { con: { G_1: 1 }, e_p: 141.42, tol: 0.001 }
      - { con: { G_1: 10 }, e_p: 100.5, tol: 0.001 }

  - id: porque-realimentacion
    tipo: sorpresa
    titulo: "¿Y la realimentación?"
    texto: "Un no inversor de primera etapa ruidosa. Baje su ganancia hasta 2 y vigile la relación señal/ruido."
    libro: [325]
    nota: "Señal y ruido de ejemplo."
    inicio: { R_29: 99000 }
    widget:
      tipo: circuito
      esquema: ao-no-inversor
      piezas: { entrada: V_i9, r1: R_19, r2: R_29, a0: A_09, vsat: V_s9 }
      lectura: { valor: V_o9, rotulo: "Señal a la salida" }
      datos:
        - { valor: N_o9, rotulo: "Ruido a la salida: {{N_o9}}" }
        - { valor: snr9, rotulo: "Señal/ruido: {{snr9}}" }
      mide: { vo: V_o9 }
      mandos:
        - { valor: R_29, lista: [99000, 9000, 1000], rotulo: "Realimentación, R_{2}" }
    objetivo:
      condiciones:
        - { valor: G_9, max: 2, rotulo: "Ganancia: {{G_9}}" }
      logrado: "La señal y el ruido han bajado juntos: la relación sigue en {{snr9}}. La realimentación no reduce el ruido de entrada; una primera etapa ruidosa sigue siendo ruidosa."
      pistas:
        - { texto: "Menos R_{2}, más realimentación." }
    escalera:
      - "El ruido entra por el mismo punto que la señal."
    solucion: "R_{2} igual a R_{1}: ganancia 2, misma relación señal/ruido."
    comprobar:
      - { G_9: 100, snr9: 100, tol: 0.001 }
      - { con: { R_29: 1000 }, G_9: 2, snr9: 100, tol: 0.001 }

  - id: pregunta-banda
    tipo: explorar
    titulo: "La medida más barata"
    texto: "La medida más eficaz y la más barata: limitar la banda, porque el ruido crece con √B. Recórtela hasta dejar el ruido en la mitad."
    libro: [327]
    inicio: { B_p: 100 }
    widget:
      tipo: grafica
      x: { id: b, min: 5, max: 100, unidad: "%", rotulo: "banda" }
      y: { min: 0, max: 110, unidad: "%", rotulo: "ruido" }
      curvas:
        - { expr: "100*sqrt(b/100)", color: naranja, rotulo: "ruido, con √B" }
      marcas:
        - { x: "B_p", y: "n_p", rotulo: "{{n_p}}" }
      lectura: { valor: n_p, rotulo: "Ruido" }
      mandos:
        - { valor: B_p, lista: [100, 50, 25, 10], rotulo: "Banda que se deja" }
    objetivo:
      condiciones:
        - { valor: n_p, max: 50, rotulo: "Ruido: {{n_p}}" }
      logrado: "Con el {{B_p}} de la banda, el ruido queda en {{n_p}}: la banda que sobra solo aporta ruido."
      pistas:
        - { texto: "Por la mitad de banda no basta: el ruido va con la raíz." }
    escalera:
      - "Para la mitad de √B, la cuarta parte de B."
    solucion: "La cuarta parte de la banda: la mitad del ruido."
    comprobar:
      - { con: { B_p: 25 }, n_p: 50, tol: 0.001 }
      - { con: { B_p: 50 }, n_p: 70.71, tol: 0.001 }

  - id: pregunta-banco
    tipo: pregunta
    titulo: "Medir el ruido"
    texto: "Para medir el ruido de un amplificador en el banco, ¿cómo se deja la entrada?"
    libro: [336]
    widget:
      tipo: figura
      figura: fig-43.17
      zonas:
        - { id: grafica, rotulo: "La gráfica", rect: [47, 20, 195, 165] }
    opciones:
      - texto: "Terminada en una resistencia del valor de la fuente real"
        bien: true
        porque: "El ruido depende de la impedancia de la fuente; con la real, se mide el que tendrá el montaje."
      - texto: "Al aire"
        porque: "Con la entrada abierta se mide la captación de interferencia, no el ruido."
      - texto: "En cortocircuito siempre"
        porque: "Solo vale si la fuente real es de impedancia casi nula; si no, falta el ruido de corriente."
    escalera:
      - "¿De qué depende el ruido, según la figura?"
    solucion: "Con una resistencia del valor de la fuente real, nunca al aire."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [314, 319, 322, 325, 327, 334]
    ideas:
      - { titulo: "Corriente óptima.", texto: "El ruido de tensión baja con la corriente y el de corriente sube: el óptimo depende de la fuente." }
      - { titulo: "El dispositivo.", texto: "Bipolar para fuentes bajas; JFET para fuentes altas." }
      - { titulo: "La primera etapa.", texto: "Domina el ruido; la realimentación no lo reduce." }
      - { titulo: "Lo más barato.", texto: "Limitar la banda: el ruido crece con √B." }
