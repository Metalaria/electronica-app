# Lección 1.2 de la sección 44.9 «El Ruido en el Amplificador Discreto» (cap43; etiqueta sec-43.9).
# Formato: contenido/lecciones11/GUIA.md. Sección cualitativa: la figura 44.17 (fig-43.17: ruido referido a la entrada
# frente a la corriente de colector con tres resistencias de fuente, y qué dispositivo elegir) con zonas en sus tres
# mínimos y en sus recuadros; el resto, opciones y emparejar con los argumentos del libro.
leccion: cap43/sec-43.9

libro:
  308: "es el suelo del transistor"
  309: "Es proporcional a √IB"
  310: "referido a la entrada se divide por gm"
  314: "hay una corriente óptima, y depende de la impedancia de la fuente"
  315: "Conviene menos corriente"
  319: "JFET, cuya corriente de entrada es despreciable"
  320: "su ruido de corriente es minúsculo"
  322: "dividido el de las siguientes por la ganancia acumulada"
  324: "Las resistencias de la entrada deben ser bajas en lo posible"
  325: "la realimentación no reduce el ruido de entrada"
  327: "el ruido crece con √B"
  334: "existe uno adecuado para una impedancia de fuente concreta"
  336: "nunca al aire"
  337: "El mínimo cae en corrientes distintas en cada caso"
  338: "con su mínimo, y qué dispositivo elegir"

modelo:
  valores: {}
  calculos: {}

tarjetas:
  - id: empareje-fuentes
    tipo: pregunta
    fase: "Empareje"
    titulo: "Dónde nace el ruido"
    texto: "Una cada fuente de ruido del transistor con cómo depende de la corriente."
    libro: [308, 309, 310]
    emparejar:
      - ["Resistencia de base r_{bb'}", "Ruido térmico: el suelo del transistor"]
      - ["Disparo de la corriente de base", "Crece con la corriente, como √I_{B}"]
      - ["Disparo de la corriente de colector", "Referido a la entrada se divide por g_{m}: baja con la corriente"]
    exito: "Dos de ellas tiran en sentidos opuestos: por eso hay una corriente óptima."
    pistas:
      - { texto: "g_{m} sube con la corriente, así que lo que se divide por g_{m} baja." }
    escalera:
      - "Una no depende de la corriente: la que solo se mejora cambiando de transistor."
    solucion: "r_{bb'}–suelo térmico, base–crece con √I_{B}, colector–baja al dividirse por g_{m}."

  - id: explore-optimo
    tipo: explorar
    titulo: "Existe una corriente óptima"
    texto: "Toque el mínimo de cada curva: cada resistencia de fuente tiene su corriente de colector óptima."
    libro: [314, 337, 338]
    widget:
      tipo: figura
      figura: fig-43.17
      zonas:
        - { id: alta, rotulo: "Mínimo de la curva de arriba", rect: [47, 98, 36, 36], texto: "La fuente de impedancia más alta: domina el ruido de corriente y el mínimo cae a corriente muy baja." }
        - { id: media, rotulo: "Mínimo de la curva del medio", rect: [113, 131, 36, 36], texto: "Una fuente intermedia: su mínimo cae entre los otros dos." }
        - { id: baja, rotulo: "Mínimo de la curva de abajo", rect: [178, 155, 36, 36], texto: "La fuente de impedancia más baja: domina el ruido de tensión y conviene más corriente." }
    requiere: { mover: [alta, media, baja] }

  - id: prediga-alta
    tipo: predecir
    titulo: "Una fuente de impedancia alta"
    texto: "Al subir la corriente, el ruido de tensión baja y el de corriente sube. Con una fuente de impedancia alta, ¿qué conviene?"
    libro: [314, 315]
    widget:
      tipo: figura
      figura: fig-43.17
      zonas:
        - { id: alta, rotulo: "Mínimo de la curva de arriba", rect: [47, 98, 36, 36] }
    opciones:
      - texto: "Menos corriente: el ruido de corriente domina"
        bien: true
        porque: "Circula por la impedancia alta y produce mucha tensión de ruido; hay que reducirlo."
      - texto: "Más corriente: más g_{m}, menos ruido"
        porque: "Eso vale con fuente de impedancia baja, donde domina el ruido de tensión."
      - texto: "Da igual la corriente"
        porque: "Hay un óptimo, y depende de la impedancia de la fuente."
    escalera:
      - "El ruido de corriente se convierte en tensión al pasar por la impedancia de la fuente."
    solucion: "Menos corriente: con impedancia alta domina el ruido de corriente."

  - id: pregunta-dispositivo
    tipo: pregunta
    titulo: "Para un fotodiodo"
    texto: "Una fuente de alta impedancia, como un fotodiodo o un piezo. ¿Qué dispositivo de entrada da menos ruido?"
    libro: [319, 320]
    widget:
      tipo: figura
      figura: fig-43.17
      zonas:
        - { id: grafica, rotulo: "La gráfica", rect: [47, 20, 195, 165] }
    opciones:
      - texto: "Un JFET: su ruido de corriente es minúsculo"
        bien: true
        porque: "No tiene corriente de base que produzca disparo."
      - texto: "Un bipolar con corriente alta"
        porque: "Es la elección para fuentes de impedancia baja, como bobinas o micrófonos dinámicos."
      - texto: "Un bipolar, por su esquina 1/f baja"
        porque: "Esa es la razón para muy baja frecuencia, no para impedancia alta."
    escalera:
      - "Con impedancia alta manda el ruido de corriente. ¿Qué dispositivo casi no tiene corriente de entrada?"
    solucion: "Un JFET."

  - id: pregunta-primera
    tipo: pregunta
    titulo: "La primera etapa lo decide todo"
    texto: "En una cadena de etapas, ¿por qué toda la atención va a la primera?"
    libro: [322, 324]
    widget:
      tipo: figura
      figura: fig-43.17
      zonas:
        - { id: grafica, rotulo: "La gráfica", rect: [47, 20, 195, 165] }
    opciones:
      - texto: "Su ruido domina: el de las siguientes se divide por la ganancia acumulada"
        bien: true
        porque: "Por eso debe ganar lo bastante para enterrar el ruido de las siguientes, con resistencias de entrada bajas."
      - texto: "Porque es la que más corriente consume"
        porque: "No es cuestión de consumo, sino de dónde se suma el ruido respecto a la ganancia."
      - texto: "Porque las siguientes no tienen ruido"
        porque: "Lo tienen, pero llega dividido por la ganancia de las anteriores."
    escalera:
      - "Referido a la entrada, ¿por qué se divide el ruido de la segunda etapa?"
    solucion: "El ruido de las siguientes se divide por la ganancia acumulada: la primera domina."

  - id: porque-realimentacion
    tipo: porque
    titulo: "¿Y la realimentación?"
    texto: "Una primera etapa ruidosa, metida en un lazo de realimentación negativa. ¿Por qué sigue siendo ruidosa?"
    libro: [325]
    widget:
      tipo: figura
      figura: fig-43.17
      zonas:
        - { id: grafica, rotulo: "La gráfica", rect: [47, 20, 195, 165] }
    opciones:
      - texto: "La realimentación no reduce el ruido de entrada: lo trata como la señal"
        bien: true
        porque: "El ruido nace en la entrada, junto a la señal; el lazo no los distingue."
      - texto: "Porque el lazo añade su propio ruido"
        porque: "Las resistencias del lazo añaden algo, pero la razón es que el ruido de entrada no se corrige."
      - texto: "Sí lo reduce, por (1 + Aβ)"
        porque: "Ese factor reduce la distorsión que nace dentro del amplificador, no el ruido de su entrada."
    escalera:
      - "El ruido de la primera etapa entra en el mismo punto que la señal."
    solucion: "La realimentación no reduce el ruido de entrada."

  - id: pregunta-banda
    tipo: pregunta
    titulo: "La medida más barata"
    texto: "De las medidas prácticas contra el ruido, ¿cuál es la más eficaz y la más barata?"
    libro: [327]
    widget:
      tipo: figura
      figura: fig-43.17
      zonas:
        - { id: grafica, rotulo: "La gráfica", rect: [47, 20, 195, 165] }
    opciones:
      - texto: "Limitar el ancho de banda a lo necesario"
        bien: true
        porque: "El ruido crece con √B: la banda que sobra solo aporta ruido."
      - texto: "Subir la corriente de todas las etapas"
        porque: "En etapas de alta impedancia, más corriente es más ruido."
      - texto: "Usar resistencias de carbón"
        porque: "Al revés: las de película metálica tienen mucho menos ruido de exceso."
    escalera:
      - "¿Con qué crece el ruido además de con la temperatura y la resistencia?"
    solucion: "Limitar el ancho de banda: el ruido crece con √B."

  - id: pregunta-banco
    tipo: pregunta
    titulo: "Medir el ruido"
    texto: "Para medir el ruido de un amplificador en el banco, ¿cómo se deja la entrada?"
    libro: [336]
    widget:
      tipo: figura
      figura: fig-43.17
      zonas:
        - { id: grafica, rotulo: "La gráfica", rect: [47, 20, 195, 165] }
    opciones:
      - texto: "Terminada en una resistencia del valor de la fuente real"
        bien: true
        porque: "El ruido depende de la impedancia de la fuente; con la real, se mide el que tendrá el montaje."
      - texto: "Al aire"
        porque: "Con la entrada abierta se mide la captación de interferencia, no el ruido."
      - texto: "En cortocircuito siempre"
        porque: "Solo vale si la fuente real es de impedancia casi nula; si no, falta el ruido de corriente."
    escalera:
      - "¿De qué depende el ruido, según la figura?"
    solucion: "Con una resistencia del valor de la fuente real, nunca al aire."

  - id: pregunta-abstracto
    tipo: pregunta
    titulo: "Un amplificador de bajo ruido"
    texto: "Una hoja de datos anuncia «amplificador de bajo ruido». ¿Qué falta para saber si lo es para usted?"
    libro: [334]
    widget:
      tipo: figura
      figura: fig-43.17
      zonas:
        - { id: grafica, rotulo: "La gráfica", rect: [47, 20, 195, 165] }
    opciones:
      - texto: "La impedancia de su fuente"
        bien: true
        porque: "No existe uno de bajo ruido en abstracto: lo es para una impedancia de fuente concreta."
      - texto: "Nada: el bajo ruido es una propiedad del chip"
        porque: "Fuera de su impedancia óptima la figura de ruido empeora varios decibelios."
      - texto: "Solo su ganancia"
        porque: "La ganancia importa para las etapas siguientes, pero el ruido de esta depende de la fuente."
    escalera:
      - "Mire cómo cambia el mínimo de una curva a otra."
    solucion: "La impedancia de la fuente: el mínimo depende de ella."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [314, 319, 322, 325]
    ideas:
      - { titulo: "Corriente óptima.", texto: "El ruido de tensión baja con la corriente y el de corriente sube: el óptimo depende de la fuente." }
      - { titulo: "El dispositivo.", texto: "Bipolar para fuentes bajas; JFET para fuentes altas." }
      - { titulo: "La primera etapa.", texto: "Domina el ruido; la realimentación no lo reduce." }
      - { titulo: "Lo más barato.", texto: "Limitar la banda: el ruido crece con √B." }
