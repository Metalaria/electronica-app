# Lección 1.2 de la sección 44.4 «Análisis en Pequeña Señal» (cap43; etiqueta sec-43.4).
# Formato: contenido/lecciones11/GUIA.md. El emisor común en pequeña señal como amplificador de tensión: el esquema
# «fuente-controlada» en su forma Thévenin (VCVS), A_v·v con r_o = R_C en serie (la salida del emisor común es R_C,
# sección 44.3) y la carga desconectada, así que la salida es exactamente A_v·v. La lectura es el módulo: el esquema
# no invierte; la inversión la dicen el texto y el libro.
# - El segundo punto de trabajo del libro (bloques 116–121): 1 mA, β = 200, V_T = 25,9 mV, V_A = 100 V, R_C = 4,7 kΩ.
# - La resistencia de emisor sin puentear (bloque 129), sobre la etapa de la sección 44.3 (1,324 mA, R_C = 3,3 kΩ,
#   R_E = 1 kΩ): con V_T = 25,9 mV, g_m·R_C = 169 y R_C/(r_e + R_E) = 3,24. En ese caso el control v es la señal en
#   la base (la transconductancia efectiva de la etapa degenerada).
# - Los límites del modelo: la exponencial de la unión frente a su recta tangente (gráfica del modelo, 1 mA).
leccion: cap43/sec-43.4

libro:
  109: "el comportamiento es aproximadamente lineal en su entorno"
  111: "Los condensadores son circuitos abiertos y las fuentes de señal, cortocircuitos"
  112: "Los condensadores de acoplo y desvío son cortocircuitos, las fuentes de continua son masa"
  113: "la alimentación es masa para la señal"
  116: "Con IC = 1 mA y VT = 25,9 mV, gm = 38,6 mS"
  117: "Con β = 200, unos 5,2 kΩ"
  118: "Con VA = 100 V e IC = 1 mA, 100 kΩ"
  120: "A_(\"v\") = - g_(m) dot.op R_(\"C\")"
  121: "Con RC = 4,7 kΩ: −181"
  123: "Dos transistores con β de 50 y de 300, polarizados a la misma corriente, dan la misma ganancia"
  125: "el máximo es 5/0,0259 = 193"
  128: "A_(\"v\") = - (R_(\"C\"))/(r_(\"e\") + R_(\"E\"))"
  129: "lleva la ganancia de −169 a −3,24"
  135: "unos pocos milivoltios"
  136: "gm cambia y con ella la ganancia"
  139: "compararla con −gm·RC calculada a partir de la corriente de colector medida"
  140: "suele estar bastante antes del recorte"

modelo:
  valores:
    V_T: { sim: "V_{T}", nombre: "tensión térmica", unidad: V, valor: 0.0259 }
    I_q: { sim: "I_{C}", nombre: "corriente de colector", unidad: A, valor: 0.001 }
    b_t: { sim: "β", nombre: "ganancia de corriente", unidad: "", valor: 200 }
    V_A: { sim: "V_{A}", nombre: "tensión de Early", unidad: V, valor: 100 }
    R_C: { sim: "R_{C}", nombre: "resistencia de colector", unidad: Ω, valor: 4700 }
    R_E: { sim: "R_{E}", nombre: "resistencia de emisor", unidad: Ω, valor: 1000 }
    pte: { tipo: interruptor, nombre: "emisor desviado por el condensador", valor: 1 }
    v_s: { sim: "v", nombre: "señal en la base", unidad: V, valor: 0.001 }
    R_L: { sim: "R_{L}", nombre: "carga", unidad: Ω, valor: 10000 }
    c_on: { tipo: interruptor, nombre: "carga conectada", valor: 0 }
    V_Rc: { sim: "V_{RC}", nombre: "caída en R_C", unidad: V, valor: 5 }
    a_u: { sim: "v_{be}", nombre: "amplitud de la señal base-emisor", unidad: V, valor: 0.002 }
  calculos:
    g_m: { expr: "I_q/V_T", sim: "g_{m}", nombre: "transconductancia", unidad: S }
    r_pi: { expr: "b_t/g_m", sim: "r_{π}", nombre: "resistencia de entrada desde la base", unidad: Ω }
    r_oo: { expr: "V_A/I_q", sim: "r_{o}", nombre: "resistencia de salida (Early)", unidad: Ω }
    A_v: { expr: "g_m*R_C", sim: "|A_{v}|", nombre: "ganancia con el emisor desviado", unidad: "", cifras: 3 }
    r_e: { expr: "1/g_m", sim: "r_{e}", nombre: "resistencia de emisor intrínseca", unidad: Ω }
    A_d: { expr: "R_C/(r_e + R_E)", sim: "|A_{v}|", nombre: "ganancia sin desviar R_E", unidad: "", cifras: 3 }
    A_x: { si: pte, entonces: "A_v", sino: "A_d", sim: "|A_{v}|", nombre: "ganancia de la etapa", unidad: "", cifras: 3 }
    I_L: { si: c_on, entonces: "A_x*v_s/(R_C + R_L)", sino: "0", sim: "i_{L}", nombre: "corriente por la carga", unidad: A }
    V_o: { expr: "A_x*v_s - I_L*R_C", sim: "v_{o}", nombre: "señal de salida (módulo)", unidad: V }
    V_oa: { expr: "A_v*v_s", sim: "g_{m} · R_{C} · v", nombre: "salida si se olvida R_E", unidad: V }
    A_max: { expr: "V_Rc/V_T", sim: "A_{máx}", nombre: "techo de la ganancia", unidad: "", cifras: 3 }
    i_ex: { expr: "I_q*(exp(a_u/V_T) - 1)", sim: "Δi_{C}", nombre: "variación real", unidad: A }
    i_ln: { expr: "g_m*a_u", sim: "g_{m} · v_{be}", nombre: "variación del modelo lineal", unidad: A }
    e_ln: { expr: "(i_ex - i_ln)/i_ln*100", sim: "error", nombre: "error del modelo lineal", unidad: "%", cifras: 2 }

tarjetas:
  - id: empareje-dos-analisis
    tipo: pregunta
    fase: "Empareje"
    titulo: "Reposo y movimiento"
    texto: "El problema se separa en dos análisis. Una cada uno con lo que se hace con las piezas."
    libro: [111, 112]
    emparejar:
      - ["En continua, los condensadores", "Circuitos abiertos"]
      - ["En continua, las fuentes de señal", "Cortocircuitos"]
      - ["En pequeña señal, los condensadores", "Cortocircuitos"]
      - ["En pequeña señal, las fuentes de continua", "Masa"]
    exito: "Continua para el punto de trabajo; pequeña señal para las variaciones, con el transistor lineal."
    pistas:
      - { texto: "Un condensador no deja pasar la continua, pero para la señal es un cortocircuito." }
    escalera:
      - "Lo que no varía no existe para la señal; lo que solo varía no existe en continua."
    solucion: "Continua: condensadores abiertos, fuentes de señal en corto. Señal: condensadores en corto, fuentes de continua a masa."

  - id: porque-alimentacion
    tipo: porque
    titulo: "La alimentación es masa"
    texto: "Para la señal, el +V_{CC} se une a masa. ¿Por qué?"
    libro: [113]
    widget:
      tipo: figura
      figura: fig-43.11
      zonas:
        - { id: vcc, rotulo: "Alimentación del circuito central", rect: [200, 0, 80, 35] }
    opciones:
      - texto: "Una fuente ideal no varía: para la señal es un potencial fijo, como la masa"
        bien: true
        porque: "La señal son variaciones; donde nada varía, la señal ve masa."
      - texto: "Porque se desconecta durante la señal"
        porque: "Sigue alimentando el circuito; solo que su tensión no cambia."
      - texto: "Porque su tensión es pequeña frente a la señal"
        porque: "Al contrario, suele ser mucho mayor. Lo que cuenta es que no varía."
    escalera:
      - "¿Cuánto varía la tensión de una fuente ideal cuando entra la señal?"
    solucion: "No varía nada: para la señal es un punto fijo, igual que la masa."

  - id: explore-hibrido
    tipo: explorar
    titulo: "El modelo lineal"
    texto: "En pequeña señal el emisor común es un amplificador de tensión. Cambie la corriente de colector y R_{C}."
    libro: [116, 117, 118]
    widget:
      tipo: circuito
      esquema: fuente-controlada
      piezas: { control: v_s, av: A_x, ro: R_C, carga: R_L, interruptor: c_on }
      lectura: { valor: V_o, rotulo: "Salida (módulo)" }
      datos:
        - { valor: g_m, rotulo: "g_{m} = {{g_m}}" }
        - { valor: r_pi, rotulo: "r_{π} = {{r_pi}}" }
        - { valor: r_oo, rotulo: "r_{o} = {{r_oo}}" }
      corriente: I_L
      mide: { salida: V_o, carga: I_L, controlada: I_L }
      mandos:
        - { valor: I_q, lista: [0.0005, 0.001, 0.0015] }
        - { valor: R_C, lista: [2200, 3300, 4700] }
    requiere: { mover: [I_q, R_C] }

  - id: formula-ganancia
    tipo: formula
    titulo: "La ganancia del emisor común"
    texto: "Con 1 mA y R_{C} = 4,7 kΩ sale −181. El signo menos es la inversión."
    libro: [120, 121]
    ec: 120
    sustitucion: "−{{g_m}} · {{R_C}} = −{{A_v}}"
    widget:
      tipo: circuito
      esquema: fuente-controlada
      piezas: { control: v_s, av: A_x, ro: R_C, carga: R_L, interruptor: c_on }
      lectura: { valor: V_o, rotulo: "Salida (módulo)" }
      corriente: I_L
      mide: { salida: V_o, carga: I_L, controlada: I_L }
      mandos:
        - { valor: I_q, lista: [0.0005, 0.001, 0.0015] }
        - { valor: R_C, lista: [2200, 3300, 4700] }

  - id: prediga-beta
    tipo: predecir
    titulo: "¿Y la β?"
    texto: "Dos transistores, uno con β = 50 y otro con β = 300, polarizados a la misma corriente. ¿Qué ganancia dan?"
    libro: [123]
    fijar: { I_q: 0.001, R_C: 4700, b_t: 300 }
    widget:
      tipo: circuito
      esquema: fuente-controlada
      piezas: { control: v_s, av: A_x, ro: R_C, carga: R_L, interruptor: c_on }
      lectura: { valor: V_o, rotulo: "Salida (módulo)" }
      datos:
        - { valor: r_pi, rotulo: "r_{π} = {{r_pi}}" }
      corriente: I_L
      mide: { salida: V_o, carga: I_L, controlada: I_L }
      ocultar: true
    opciones:
      - texto: "La misma"
        bien: true
        porque: "La ganancia depende de g_{m}, que depende solo de I_{C}. La β cambia r_{π}, la entrada, no la ganancia."
      - texto: "Seis veces más la de β = 300"
        porque: "Eso pasaría con la corriente de colector, no con la ganancia a corriente fija."
      - texto: "Más la de β = 50"
        porque: "La β no aparece en −g_{m}·R_{C}."
    escalera:
      - "¿Aparece β en A_{v} = −g_{m}·R_{C}? ¿De qué depende g_{m}?"
    solucion: "La misma: g_{m} = I_{C}/V_{T} no depende de β."

  - id: estime-techo
    tipo: pregunta
    fase: "Estime"
    titulo: "El techo de la ganancia"
    texto: "Como g_{m}·R_{C} = I_{C}·R_{C}/V_{T}, la ganancia vale V_{RC}/V_{T}. Con 5 V de caída en R_{C}, ¿cuánto como máximo?"
    libro: [125]
    estimar:
      objetivo: "A_max"
      unidad: ""
      min: 0
      max: 500
      paso: 1
      inicio: 400
      tol: 0.04
      rotulo: "Ganancia máxima"
    exito: "193, con las resistencias que sean: el techo lo pone la tensión disponible."
    pistas:
      - { cuando: { valor: estimacion, mayor: 200 }, texto: "Se ha pasado: 5 V entre 25,9 mV." }
      - { texto: "Se ha quedado corto: 5 V entre 25,9 mV." }
    escalera:
      - "Divida la caída en R_{C} entre V_{T}."
    solucion: "5/0,0259 = 193."
    comprobar:
      - { A_max: 193, tol: 0.005 }

  - id: simule-sin-desvio
    tipo: simular
    titulo: "Sin el condensador de emisor"
    texto: "La etapa de la sección 44.3 da 169 con el emisor desviado. Quite el condensador (R_{E} = 1 kΩ) y meta 1 mV: ¿cuánto sale?"
    libro: [128, 129]
    fijar: { I_q: 0.001324, R_C: 3300, R_E: 1000, pte: 0, v_s: 0.001 }
    widget:
      tipo: circuito
      esquema: fuente-controlada
      piezas: { control: v_s, av: A_x, ro: R_C, carga: R_L, interruptor: c_on }
      lectura: { valor: V_o, rotulo: "Salida (módulo)" }
      mide: { salida: V_o, carga: I_L, controlada: I_L }
      ocultar: true
      mandos: []
    simular:
      objetivo: V_o
      unidad: V
      tol: 0.03
      rotulo: "Señal de salida"
      medida: salida
      errores:
        - { expr: "V_oa", texto: "Esos 169 mV son con el emisor desviado. Sin el condensador, R_{E} entra en la ganancia: R_{C}/(r_{e} + R_{E})." }
    exito: "Unos 3,24 mV: cincuenta veces menos ganancia, que ya no depende del transistor."
    escalera:
      - "Sin desviar, A_{v} = −R_{C}/(r_{e} + R_{E}), con r_{e} de unos 20 Ω."
    solucion: "3300/(19,6 + 1000) ≈ 3,24: salen unos 3,24 mV."
    comprobar:
      - { V_o: 0.003237, V_oa: 0.1687, A_d: 3.24, A_v: 169, r_e: 19.56, tol: 0.006 }

  - id: formula-degenerada
    tipo: formula
    titulo: "La ganancia degenerada"
    texto: "Sin desviar el emisor, la ganancia es casi R_{C}/R_{E}. Cambie R_{E}."
    libro: [128, 129]
    fijar: { I_q: 0.001324, R_C: 3300, pte: 0 }
    ec: 128
    sustitucion: "−{{R_C}} / ({{r_e}} + {{R_E}}) = −{{A_d}}"
    widget:
      tipo: circuito
      esquema: fuente-controlada
      piezas: { control: v_s, av: A_x, ro: R_C, carga: R_L, interruptor: c_on }
      lectura: { valor: V_o, rotulo: "Salida (módulo)" }
      corriente: I_L
      mide: { salida: V_o, carga: I_L, controlada: I_L }
      mandos:
        - { valor: R_E, lista: [100, 470, 1000] }

  - id: porque-degeneracion
    tipo: porque
    titulo: "¿Qué se gana perdiendo ganancia?"
    texto: "Dejar R_{E} sin puentear divide la ganancia por cincuenta. ¿Qué se compra con ella?"
    libro: [129]
    fijar: { I_q: 0.001324, R_C: 3300, R_E: 1000, pte: 0 }
    widget:
      tipo: circuito
      esquema: fuente-controlada
      piezas: { control: v_s, av: A_x, ro: R_C, carga: R_L, interruptor: c_on }
      lectura: { valor: V_o, rotulo: "Salida (módulo)" }
      corriente: I_L
      mide: { salida: V_o, carga: I_L, controlada: I_L }
    opciones:
      - texto: "Una ganancia que solo depende de dos resistencias, más entrada y menos distorsión"
        bien: true
        porque: "Ya no depende de r_{e}: ni de la corriente, ni de la temperatura, ni del ejemplar. La entrada sube de 2,16 a 7,8 kΩ."
      - texto: "Más ancho de banda, y nada más"
        porque: "La banda mejora, pero lo decisivo es que la ganancia deja de depender del transistor."
      - texto: "Nada: es un error de diseño"
        porque: "Es el intercambio de la realimentación: ganancia a cambio de precisión y linealidad."
    escalera:
      - "En R_{C}/(r_{e} + R_{E}) con R_{E} ≫ r_{e}, ¿qué queda del transistor?"
    solucion: "Una ganancia ≈ R_{C}/R_{E}, de resistencias al 1 %, con más entrada y menos distorsión."

  - id: explore-limites
    tipo: explorar
    titulo: "¿Cuánto es pequeña?"
    texto: "La recta es el modelo lineal; la curva, la exponencial de la unión. Aumente la señal y mire cuándo se separan."
    libro: [109, 135]
    fijar: { I_q: 0.001 }
    widget:
      tipo: grafica
      x: { id: u, min: -0.03, max: 0.03, unidad: V, rotulo: "v_{be}" }
      y: { min: -0.001, max: 0.0025, unidad: A, rotulo: "Δi_{C}" }
      curvas:
        - { expr: "I_q*(exp(u/V_T) - 1)", color: naranja, rotulo: "exponencial" }
        - { expr: "g_m*u", color: azul, rotulo: "recta del modelo", discontinua: true }
      marcas:
        - { x: "a_u", y: "i_ex", rotulo: "real: {{i_ex}}" }
      lectura: { valor: e_ln, rotulo: "Error de la recta" }
      mandos:
        - { valor: a_u, min: 0.001, max: 0.025, paso: 0.001, rotulo: "Amplitud de v_{be}" }
    requiere: { mover: [a_u] }

  - id: pregunta-pequena
    tipo: pregunta
    titulo: "El límite del modelo"
    texto: "¿Cuándo vale el análisis en pequeña señal?"
    libro: [135, 136]
    widget:
      tipo: grafica
      x: { id: u, min: -0.03, max: 0.03, unidad: V, rotulo: "v_{be}" }
      y: { min: -0.001, max: 0.0025, unidad: A, rotulo: "Δi_{C}" }
      curvas:
        - { expr: "I_q*(exp(u/V_T) - 1)", color: naranja, rotulo: "exponencial" }
        - { expr: "g_m*u", color: azul, rotulo: "recta del modelo", discontinua: true }
    opciones:
      - texto: "Con variaciones de V_{BE} mucho menores que V_{T}: unos pocos milivoltios"
        bien: true
        porque: "Con más, la exponencial se nota: g_{m} cambia con la señal y aparece distorsión."
      - texto: "Mientras la salida no recorte"
        porque: "La salida deja de ser proporcional bastante antes del recorte."
      - texto: "Siempre: el transistor es lineal"
        porque: "Es no lineal; solo se comporta como lineal en el entorno del punto de trabajo."
    escalera:
      - "Compare la amplitud de v_{be} con V_{T} = 25,9 mV."
    solucion: "Variaciones de V_{BE} mucho menores que 25,9 mV: unos pocos milivoltios."

  - id: pregunta-banco
    tipo: pregunta
    titulo: "Validar el modelo en el banco"
    texto: "Mide la ganancia de un emisor común. ¿Con qué la compara para validar el modelo?"
    libro: [139, 140]
    widget:
      tipo: circuito
      esquema: fuente-controlada
      piezas: { control: v_s, av: A_x, ro: R_C, carga: R_L, interruptor: c_on }
      lectura: { valor: V_o, rotulo: "Salida (módulo)" }
      corriente: I_L
      mide: { salida: V_o, carga: I_L, controlada: I_L }
    opciones:
      - texto: "Con −g_{m}·R_{C}, con g_{m} de la corriente de colector medida"
        bien: true
        porque: "Deben coincidir dentro de un margen razonable: es la prueba de todo el modelo."
      - texto: "Con la β de la hoja de datos"
        porque: "La ganancia no depende de β: depende de la corriente de colector."
      - texto: "Con el recorte de la salida"
        porque: "El recorte enseña el límite de gran señal, no la ganancia de pequeña señal."
    escalera:
      - "¿De qué medida sale g_{m}?"
    solucion: "Con −g_{m}·R_{C}, calculada a partir de la I_{C} medida."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [112, 123, 125, 129]
    ideas:
      - { titulo: "Dos análisis.", texto: "Continua para el punto de trabajo; pequeña señal con condensadores en corto y alimentación a masa." }
      - { titulo: "A_{v} = −g_{m}·R_{C}.", texto: "No depende de β; su techo es V_{RC}/V_{T}." }
      - { titulo: "R_{E} sin puentear.", texto: "De −169 a −3,24, pero solo depende de resistencias y distorsiona menos." }
      - { titulo: "Pequeña de verdad.", texto: "Unos pocos milivoltios de V_{BE}: más, y la exponencial se nota." }
