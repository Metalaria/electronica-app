# Lección 1.2 de la sección 44.2 «El Punto de Trabajo y la Polarización» (cap43; etiqueta sec-43.2).
# Formato: contenido/lecciones11/GUIA.md. La etapa de ejemplo del libro (12 V, divisor de 47 kΩ y 10 kΩ, R_C = 3,3 kΩ,
# R_E = 1 kΩ, β = 150, I_C = 1,324 mA; bloque 67 de la sección 44.3, de la sección 6.5) en el esquema vivo
# «bjt-polarizacion», con el modelo de 0,7 V del libro. La polarización por base fija, en «bjt-interruptor» en zona
# activa con la misma I_C a β = 150 (R_B = 11,3 V / 8,83 µA = 1,28 MΩ, el valor de la figura 44.4 del libro).
# Paso práctico: «ajuste» del colector a la mitad de la alimentación (la regla del bloque 43).
leccion: cap43/sec-43.2

libro:
  36: "un transistor tiene que estar polarizado"
  37: "el diseño de un amplificador discreto empieza por él"
  39: "Con 1 mA y VT de 26 mV, gm = 38 mA/V"
  40: "No es «cuanta más, mejor»"
  43: "polarizar el colector a la mitad de la alimentación"
  45: "una β que varía de 50 a 300"
  46: "el punto de trabajo no debe depender de la β"
  48: "varía en la misma proporción que β"
  49: "frente al factor seis de la base fija"
  50: "Divisor de base con resistencia de emisor: la estándar"
  51: "la corriente de colector varía solo un 15 %"
  52: "Fuente de corriente: la mejor de todas"
  54: "la unión base-emisor cae 2 mV/°C"
  55: "más corriente, más caída en ella"
  56: "se pierde la linealidad que esa realimentación aportaba"
  59: "tensión de base, de emisor y de colector"
  60: "De la de emisor sale la corriente"
  61: "calentar el transistor con los dedos"
  "cap43#67": "divisor de 47 kΩ y 10 kΩ, RC = 3,3 kΩ, RE = 1 kΩ, β = 150 e IC = 1,324 mA"

modelo:
  valores:
    V_cc: { sim: "V_{CC}", nombre: "alimentación", unidad: V, valor: 12 }
    R_1: { sim: "R₁", nombre: "divisor, arriba", unidad: Ω, valor: 47000 }
    R_2: { sim: "R₂", nombre: "divisor, abajo", unidad: Ω, valor: 10000 }
    R_C: { sim: "R_{C}", nombre: "resistencia de colector", unidad: Ω, valor: 3300 }
    R_E: { sim: "R_{E}", nombre: "resistencia de emisor", unidad: Ω, valor: 1000 }
    beta: { sim: "β", nombre: "ganancia de corriente", unidad: "", valor: 150 }
    V_BE: { sim: "V_{BE}", nombre: "tensión base-emisor", unidad: V, valor: 0.7 }
    R_bf: { sim: "R_{B}", nombre: "resistencia de base fija", unidad: Ω, valor: 1280000 }
    b_f: { sim: "β", nombre: "ganancia de corriente", unidad: "", valor: 150 }
    V_CEs: { sim: "V_{CE(sat)}", nombre: "tensión de saturación", unidad: V, valor: 0.2 }
    I_g: { sim: "I_{C}", nombre: "corriente de reposo", unidad: A, valor: 0.001 }
    V_T: { sim: "V_{T}", nombre: "tensión térmica", unidad: V, valor: 0.026 }
  calculos:
    V_th: { expr: "V_cc*R_2/(R_1 + R_2)", sim: "V_{Th}", nombre: "tensión del divisor en vacío", unidad: V }
    I_B: { expr: "(V_th - V_BE)/(par(R_1, R_2) + (beta + 1)*R_E)", sim: "I_{B}", nombre: "corriente de base", unidad: A }
    I_C: { expr: "beta*I_B", sim: "I_{C}", nombre: "corriente de colector", unidad: A }
    V_E: { expr: "(beta + 1)*I_B*R_E", sim: "V_{E}", nombre: "tensión de emisor", unidad: V }
    V_B: { expr: "V_E + V_BE", sim: "V_{B}", nombre: "tensión de base", unidad: V }
    V_C: { expr: "V_cc - I_C*R_C", sim: "V_{C}", nombre: "tensión de colector", unidad: V }
    V_CE: { expr: "V_C - V_E", sim: "V_{CE}", nombre: "tensión colector-emisor", unidad: V }
    I_d: { expr: "V_B/R_2", sim: "I_{R₂}", nombre: "corriente del divisor", unidad: A }
    k_d: { expr: "I_d/I_B", sim: "×", nombre: "veces la corriente de base", unidad: "", cifras: 2 }
    I_E1: { expr: "V_E/R_E", sim: "V_{E}/R_{E}", nombre: "corriente de emisor medida", unidad: A }
    I_bf: { expr: "max(0, (V_cc - V_BE)/R_bf)", sim: "I_{B}", nombre: "corriente de base fija", unidad: A }
    I_cf: { expr: "min(b_f*I_bf, (V_cc - V_CEs)/R_C)", sim: "I_{C}", nombre: "corriente de colector con base fija", unidad: A }
    V_cef: { expr: "V_cc - I_cf*R_C", sim: "V_{CE}", nombre: "tensión colector-emisor con base fija", unidad: V }
    I_wr: { expr: "V_C/R_C", sim: "V_{C}/R_{C}", nombre: "cociente equivocado", unidad: A }
    g_m: { expr: "I_g/V_T", sim: "g_{m}", nombre: "transconductancia", unidad: "A/V" }

tarjetas:
  - id: explore-beta
    tipo: explorar
    titulo: "Cambie de transistor"
    texto: "La β varía de 50 a 300 entre unidades del mismo modelo. Muévala y mire la corriente de colector."
    libro: [45, 46, "cap43#67"]
    widget:
      tipo: circuito
      esquema: bjt-polarizacion
      piezas: { vcc: V_cc, r1: R_1, r2: R_2, rc: R_C, re: R_E, beta: beta, vbe: V_BE }
      lectura: { valor: I_C, rotulo: "I_{C}" }
      datos:
        - { valor: V_CE, rotulo: "V_{CE} = {{V_CE}}" }
        - { valor: I_B, rotulo: "I_{B} = {{I_B}}" }
      corriente: I_C
      mide: { ib: I_B, ic: I_C, vb: V_B, ve: V_E, vc: V_C, vce: V_CE }
      mandos:
        - { valor: beta, lista: [50, 100, 150, 200, 300] }
    requiere: { mover: [beta] }

  - id: prediga-base-fija
    tipo: predecir
    titulo: "Polarización por base fija"
    texto: "Una resistencia de la alimentación a la base da 1,32 mA con β = 150. ¿Y si el transistor trae β = 300?"
    libro: [48, "cap43#67"]
    fijar: { b_f: 300 }
    widget:
      tipo: circuito
      esquema: bjt-interruptor
      piezas: { vcc: V_cc, rc: R_C, entrada: V_cc, rb: R_bf, beta: b_f, vbe: V_BE, vcesat: V_CEs }
      lectura: { valor: I_cf, rotulo: "I_{C}" }
      corriente: I_cf
      mide: { ib: I_bf, ic: I_cf, vce: V_cef, vbe: V_BE }
      ocultar: true
    opciones:
      - texto: "Se duplica: 2,65 mA"
        bien: true
        porque: "La base recibe la misma corriente, y la de colector es β veces ella: varía en la misma proporción que β."
      - texto: "Sube solo un 15 %"
        porque: "Eso hace el divisor con resistencia de emisor. La base fija no corrige nada."
      - texto: "No cambia: 1,32 mA"
        porque: "La resistencia de base fija I_{B}, no I_{C}; I_{C} es β · I_{B}."
    escalera:
      - "¿Qué fija la resistencia de base: la corriente de base o la de colector?"
    solucion: "I_{B} no cambia y I_{C} = β · I_{B}: de 1,32 a 2,65 mA, el doble."
    comprobar:
      - { I_cf: 0.002648, b_f: 300, tol: 0.005 }
      - { con: { b_f: 150 }, I_cf: 0.001324, b_f: 150, tol: 0.005 }

  - id: empareje-polarizaciones
    tipo: pregunta
    fase: "Empareje"
    titulo: "Las cuatro polarizaciones"
    texto: "Con β entre 50 y 300, una cada polarización con lo que le pasa a la corriente de colector."
    libro: [48, 49, 51, 52]
    emparejar:
      - ["Base fija", "Varía como β: un factor seis"]
      - ["Realimentación de colector", "Se autocorrige: aún un factor tres"]
      - ["Divisor con resistencia de emisor", "Varía solo un 15 %"]
      - ["Fuente de corriente", "La mejor: la de los integrados"]
    exito: "El criterio: el punto de trabajo no debe depender de la β."
    pistas:
      - { texto: "La realimentación de colector mejora la base fija, pero no tanto como el divisor con R_{E}." }
    escalera:
      - "Ordénelas de peor a mejor: base fija, realimentación de colector, divisor, fuente de corriente."
    solucion: "Base fija–factor seis, realimentación–factor tres, divisor–15 %, fuente de corriente–la mejor."

  - id: porque-divisor
    tipo: porque
    titulo: "Por qué no aparece la β"
    texto: "El divisor fija la base; menos 0,7 V, el emisor; y R_{E} da la corriente. ¿Qué condición lo hace valer?"
    libro: [50, 51]
    widget:
      tipo: circuito
      esquema: bjt-polarizacion
      piezas: { vcc: V_cc, r1: R_1, r2: R_2, rc: R_C, re: R_E, beta: beta, vbe: V_BE }
      lectura: { valor: I_C, rotulo: "I_{C}" }
      datos:
        - { valor: I_d, rotulo: "Corriente por R₂: {{I_d}}" }
        - { valor: k_d, rotulo: "{{k_d}} veces la de base" }
      corriente: I_C
      mide: { ib: I_B, ic: I_C, vb: V_B, ve: V_E, vc: V_C, vce: V_CE }
    opciones:
      - texto: "Que la corriente del divisor sea bastante mayor que la de base"
        bien: true
        porque: "Diez veces es la regla: así la corriente de base no desequilibra el divisor."
      - texto: "Que β sea alta"
        porque: "Justo lo contrario: el diseño busca que β no importe."
      - texto: "Que R_{C} sea igual a R_{E}"
        porque: "R_{C} no entra en el cálculo de la corriente: fija dónde queda el colector."
    escalera:
      - "Si la base tirase mucha corriente del divisor, ¿seguiría fija su tensión?"
    solucion: "La corriente del divisor debe ser unas diez veces la de base."

  - id: explore-reposo
    tipo: explorar
    titulo: "Lo que fija la corriente de reposo"
    texto: "Toque cada recuadro: el punto de trabajo decide mucho más que la ganancia."
    libro: [36, 37, 39, 40, 43]
    widget:
      tipo: figura
      figura: fig-43.4
      zonas:
        - { id: gm, rotulo: "Transconductancia", rect: [268, 17, 178, 35], texto: "g_{m} = I_{C}/V_{T}: más corriente, más ganancia." }
        - { id: ruido, rotulo: "Ruido", rect: [268, 50, 178, 35], texto: "Hay una corriente óptima según la impedancia de la fuente: no es «cuanta más, mejor»." }
        - { id: banda, rotulo: "Ancho de banda", rect: [268, 84, 178, 35], texto: "Más corriente carga y descarga antes las capacidades de unión." }
        - { id: consumo, rotulo: "Consumo", rect: [268, 117, 178, 35], texto: "Proporcional a la corriente." }
        - { id: excursion, rotulo: "Excursión", rect: [268, 148, 178, 35], texto: "Con el colector a la mitad de la alimentación, la excursión simétrica es máxima." }
    requiere: { mover: [gm, ruido, excursion] }

  - id: estime-gm
    tipo: pregunta
    fase: "Estime"
    titulo: "La transconductancia"
    texto: "g_{m} = I_{C}/V_{T}. Con 1 mA de reposo y V_{T} = 26 mV, ¿cuánto vale?"
    libro: [39]
    estimar:
      objetivo: "g_m"
      unidad: "A/V"
      min: 0
      max: 0.1
      paso: 0.001
      inicio: 0.075
      tol: 0.05
      rotulo: "g_{m}"
    exito: "38 mA/V: cada milivoltio de más en la base da 38 µA más de colector."
    pistas:
      - { cuando: { valor: estimacion, mayor: 0.0405 }, texto: "Se ha pasado: divida 1 mA entre 26 mV." }
      - { texto: "Se ha quedado corto: 1 mA entre 26 mV da bastante más." }
    escalera:
      - "1 mA / 26 mV: las unidades salen en mA/V."
    solucion: "g_{m} = 1 mA / 26 mV = 38 mA/V."
    comprobar:
      - { g_m: 0.03846, tol: 0.01 }

  - id: ajuste-colector
    tipo: ajuste
    titulo: "El colector a la mitad"
    texto: "La regla habitual: el colector a la mitad de la alimentación, para la máxima excursión simétrica. Ajuste R_{C}."
    libro: [43, "cap43#67"]
    fijar: { beta: 150 }
    inicio: { R_C: 2000 }
    widget:
      tipo: circuito
      esquema: bjt-polarizacion
      piezas: { vcc: V_cc, r1: R_1, r2: R_2, rc: R_C, re: R_E, beta: beta, vbe: V_BE }
      lectura: { valor: V_C, rotulo: "V_{C}" }
      corriente: I_C
      mide: { ib: I_B, ic: I_C, vb: V_B, ve: V_E, vc: V_C, vce: V_CE }
      mandos:
        - { valor: R_C, min: 1000, max: 6800, paso: 100 }
    ajuste:
      valor: V_C
      objetivo: 6
      tol: 0.04
      rotulo: "Tensión de colector"
      escala: { min: 0, max: 12 }
      bajo: "El colector ha bajado demasiado: reduzca R_{C}."
      alto: "El colector está demasiado alto: aumente R_{C}."
      dentro: "A media alimentación: la señal puede subir y bajar lo mismo."

  - id: porque-temperatura
    tipo: porque
    titulo: "El embalamiento térmico"
    texto: "La unión base-emisor cae 2 mV/°C: al calentarse, el transistor conduce más. ¿Cómo lo frena R_{E}?"
    libro: [54, 55]
    widget:
      tipo: circuito
      esquema: bjt-polarizacion
      piezas: { vcc: V_cc, r1: R_1, r2: R_2, rc: R_C, re: R_E, beta: beta, vbe: V_BE }
      lectura: { valor: V_E, rotulo: "V_{E}" }
      corriente: I_C
      mide: { ib: I_B, ic: I_C, vb: V_B, ve: V_E, vc: V_C, vce: V_CE }
    opciones:
      - texto: "Más corriente da más caída en R_{E}, y queda menos V_{BE} efectiva"
        bien: true
        porque: "Es realimentación: la base está fija, y el emisor que sube le resta tensión a la unión."
      - texto: "R_{E} enfría el transistor"
        porque: "R_{E} no disipa el calor del transistor; corrige la corriente con su caída."
      - texto: "R_{E} limita la corriente como un fusible"
        porque: "No corta nada: compensa de forma continua, restando la tensión que gana la unión."
    escalera:
      - "La base está sujeta por el divisor. Si el emisor sube, ¿qué le pasa a V_{BE}?"
    solucion: "Más I_{C}, más V_{E}, menos V_{BE}: la corriente vuelve atrás."

  - id: pregunta-desvio
    tipo: pregunta
    titulo: "El condensador de desvío"
    texto: "R_{E} reduce la ganancia; un condensador la cortocircuita en alterna. ¿Qué se paga?"
    libro: [56]
    widget:
      tipo: circuito
      esquema: bjt-polarizacion
      piezas: { vcc: V_cc, r1: R_1, r2: R_2, rc: R_C, re: R_E, beta: beta, vbe: V_BE }
      lectura: { valor: I_C, rotulo: "I_{C}" }
      corriente: I_C
      mide: { ib: I_B, ic: I_C, vb: V_B, ve: V_E, vc: V_C, vce: V_CE }
    opciones:
      - texto: "La linealidad que aportaba esa realimentación"
        bien: true
        porque: "El compromiso se ajusta desviando solo una parte de R_{E}."
      - texto: "La estabilidad del punto de trabajo"
        porque: "En continua el condensador no conduce: R_{E} sigue estabilizando el punto."
      - texto: "Nada: solo se gana ganancia"
        porque: "La realimentación en serie también linealizaba; sin ella en alterna, la distorsión crece."
    escalera:
      - "El condensador solo actúa sobre la señal. ¿Qué hacía R_{E} sobre la señal?"
    solucion: "Se pierde la linealidad de la realimentación; por eso a menudo se desvía solo una parte."

  - id: pregunta-banco
    tipo: pregunta
    titulo: "Tres medidas en el banco"
    texto: "Con el multímetro: V_{B} = 2,02 V, V_{E} = 1,32 V y V_{C} = 7,63 V, con R_{E} = 1 kΩ. ¿Cuánto vale I_{C}?"
    libro: [59, 60, 61, "cap43#67"]
    fijar: { beta: 150, R_C: 3300 }
    widget:
      tipo: circuito
      esquema: bjt-polarizacion
      piezas: { vcc: V_cc, r1: R_1, r2: R_2, rc: R_C, re: R_E, beta: beta, vbe: V_BE }
      lectura: { valor: V_E, rotulo: "V_{E}" }
      datos:
        - { valor: V_B, rotulo: "V_{B} = {{V_B}}" }
        - { valor: V_C, rotulo: "V_{C} = {{V_C}}" }
      corriente: I_C
      mide: { ib: I_B, ic: I_C, vb: V_B, ve: V_E, vc: V_C, vce: V_CE }
    opciones:
      - texto: "Unos 1,32 mA: V_{E} entre R_{E}"
        bien: true
        porque: "De la de emisor sale la corriente. Y base 0,7 V sobre el emisor, colector muy por encima: zona activa."
      - texto: "Unos 2,02 mA: V_{B} entre R_{E}"
        porque: "Entre la base y el emisor caen 0,7 V: R_{E} solo ve V_{E}."
      - texto: "Unos 2,31 mA: V_{C} entre R_{C}"
        porque: "V_{C} es la tensión del colector a masa; R_{C} ve lo que falta hasta los 12 V."
    escalera:
      - "¿Qué resistencia tiene una tensión conocida en sus extremos y su valor marcado?"
    solucion: "I_{C} ≈ I_{E} = 1,32 V / 1 kΩ = 1,32 mA."
    comprobar:
      - { V_B: 2.02, V_E: 1.32, V_C: 7.63, I_E1: 0.00132, I_C: 0.001324, I_wr: 0.00231, tol: 0.01 }
      - { V_cc: 12, R_E: 1000, V_BE: 0.7 }

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [37, 46, 51, 55]
    ideas:
      - { titulo: "El punto de trabajo lo decide todo.", texto: "Ganancia, excursión, ruido, ancho de banda y consumo: se diseña primero." }
      - { titulo: "Sin depender de β.", texto: "Con el divisor y R_{E}, β de 50 a 300 mueve I_{C} solo un 15 %." }
      - { titulo: "R_{E} estabiliza.", texto: "Más corriente, más caída en R_{E}: frena el embalamiento térmico." }
      - { titulo: "Tres medidas.", texto: "Base, emisor y colector: I_{C} sale de V_{E}/R_{E}." }
