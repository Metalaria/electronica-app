# Lección 1.2 de la sección 44.1 «Por Qué Discretos Hoy» (cap43; etiqueta sec-43.1).
# Formato: contenido/lecciones11/GUIA.md. Sección sin cálculos: las cinco razones (y la sexta, didáctica) sobre la
# figura 44.2 del libro (fig-43.2, con zonas), la válvula, el precio del discreto y el criterio de elección.
leccion: cap43/sec-43.1

libro:
  4: "hay cinco situaciones donde son la respuesta correcta"
  6: "mandan los transistores sueltos"
  7: "un transistor discreto elegido para el caso supera"
  8: "puede tener menos ruido que cualquier operacional"
  9: "los integrados de propósito general quedan fuera"
  10: "es más barato y ocupa menos que un integrado"
  11: "Ese último caso es el más frecuente en la práctica"
  13: "un cátodo calentado al rojo emite electrones"
  14: "Sus defectos explican su desaparición"
  17: "Un operacional es un par diferencial"
  18: "ese entendimiento es lo que permite elegirlo bien"
  21: "ya está hecha y compensada"
  22: "nunca están tan igualados como dos de un mismo chip"
  23: "Compensación térmica, que exige componentes adicionales"
  24: "Estabilidad, que hay que asegurar en lugar de venir dada"
  26: "integrado por defecto, discreto cuando haya una razón concreta"
  31: "montar un emisor común, medir su ganancia"
  32: "El operacional gana en casi todo"

modelo:
  valores: {}
  calculos: {}

tarjetas:
  - id: explore-razones
    tipo: explorar
    titulo: "Seis razones para un transistor suelto"
    texto: "Toque cada recuadro de la figura y lea cuándo un transistor discreto es la respuesta correcta."
    libro: [4, 6, 7, 8, 9, 10, 17]
    widget:
      tipo: figura
      figura: fig-43.2
      zonas:
        - { id: potencia, rotulo: "Recuadro «Potencia»", rect: [2, 1, 145, 52], texto: "Potencia: por encima de decenas de vatios, o amperios a cientos de voltios, mandan los transistores sueltos." }
        - { id: frecuencia, rotulo: "Recuadro «Frecuencia»", rect: [155, 1, 145, 52], texto: "Frecuencia: en radiofrecuencia, uno elegido para el caso supera a un integrado de propósito general." }
        - { id: ruido, rotulo: "Recuadro «Ruido»", rect: [308, 1, 145, 52], texto: "Ruido: en la primera etapa, un transistor seleccionado puede tener menos ruido que cualquier operacional." }
        - { id: tension, rotulo: "Recuadro «Tensión»", rect: [2, 59, 145, 51], texto: "Tensión: con decenas o cientos de voltios, los integrados de propósito general quedan fuera." }
        - { id: simple, rotulo: "Recuadro «Función simple»", rect: [155, 59, 145, 51], texto: "Función simple: invertir, adaptar niveles, un relé o un LED. Más barato y ocupa menos que un integrado." }
        - { id: entender, rotulo: "Recuadro «Entender»", rect: [308, 59, 145, 51], texto: "Entender: un operacional es un par diferencial, un espejo de corriente y una etapa clase AB." }
    requiere: { mover: [potencia, simple, entender] }

  - id: empareje-casos
    tipo: pregunta
    fase: "Empareje"
    titulo: "Cada caso, su ejemplo"
    texto: "Una cada razón para usar un discreto con el ejemplo que da el libro."
    libro: [6, 7, 8, 9, 10]
    emparejar:
      - ["Potencia", "Un MOSFET de potencia o un IGBT, sin equivalente integrado"]
      - ["Frecuencia", "Un transistor elegido para radiofrecuencia"]
      - ["Ruido", "La primera etapa de un amplificador muy exigente"]
      - ["Tensión", "Decenas o cientos de voltios"]
      - ["Función simple", "Gobernar un relé o encender un LED"]
    exito: "Cinco situaciones; en todas, el integrado de propósito general se queda corto o sobra."
    pistas:
      - { texto: "El relé y el LED no piden potencia ni frecuencia: piden poco, y un transistor basta." }
    escalera:
      - "Busque en cada ejemplo qué magnitud se sale de lo normal: vatios, megahercios, nanovoltios o voltios."
    solucion: "Potencia–MOSFET o IGBT, frecuencia–radiofrecuencia, ruido–primera etapa, tensión–cientos de voltios, función simple–relé o LED."

  - id: pregunta-frecuente
    tipo: pregunta
    titulo: "El caso más frecuente"
    texto: "En una placa moderna hay transistores sueltos entre los integrados. ¿Cuál de los cinco casos lo explica sobre todo?"
    libro: [10, 11]
    widget:
      tipo: figura
      figura: fig-43.2
      zonas:
        - { id: simple, rotulo: "Recuadro «Función simple»", rect: [155, 59, 145, 51] }
    opciones:
      - texto: "La función simple: invertir, adaptar niveles, un relé, un LED"
        bien: true
        porque: "Es el caso más frecuente en la práctica: un transistor es más barato y ocupa menos que un integrado."
      - texto: "La potencia"
        porque: "La potencia pide transistores sueltos, pero solo en las etapas de salida: no explica los de cualquier placa."
      - texto: "El ruido"
        porque: "El bajo ruido justifica un discreto en una primera etapa exigente, un caso raro, no el de cada placa."
    escalera:
      - "Piense en lo que hace la mayoría de esos transistores: encender algo, invertir un nivel."
    solucion: "La función simple: es el caso más frecuente, y explica los transistores sueltos de cualquier placa."

  - id: pregunta-valvula
    tipo: pregunta
    titulo: "Antes del transistor"
    texto: "La válvula de vacío amplificó durante medio siglo. ¿Por qué desapareció?"
    libro: [13, 14]
    widget:
      tipo: figura
      figura: fig-43.2
      zonas:
        - { id: potencia, rotulo: "Recuadro «Potencia»", rect: [2, 1, 145, 52] }
    opciones:
      - texto: "El filamento consume vatios, pide tensiones altas, se calienta y se agota"
        bien: true
        porque: "Son sus defectos; aun así sobrevive en audio, por cómo satura, y en radiofrecuencia de gran potencia."
      - texto: "Porque no amplificaba: solo rectificaba"
        porque: "Eso era el diodo de Fleming. Con una rejilla, el triodo controla una corriente de placa grande con una tensión pequeña."
      - texto: "Porque su impedancia de entrada era muy baja"
        porque: "Al revés: se controla por tensión en la rejilla, con impedancia de entrada altísima."
    escalera:
      - "Un cátodo calentado al rojo, una placa a cientos de voltios: ¿qué cuesta eso?"
    solucion: "Consumo del filamento, tensiones altas, tamaño y calor, y desgaste con las horas."

  - id: porque-operacional
    tipo: porque
    titulo: "La sexta razón"
    texto: "Un operacional es un par diferencial, un espejo de corriente y una etapa clase AB. ¿Por qué importa eso al usarlo?"
    libro: [17, 18]
    widget:
      tipo: figura
      figura: fig-43.2
      zonas:
        - { id: entender, rotulo: "Recuadro «Entender»", rect: [308, 59, 145, 51] }
    opciones:
      - texto: "Sus límites —offset, slew rate, polarización, ruido— salen de esos bloques"
        bien: true
        porque: "Quien entiende los bloques entiende por qué se comporta así, y lo elige y diagnostica bien."
      - texto: "Porque se puede sustituir siempre por tres transistores sueltos"
        porque: "No: dentro van transistores apareados en el mismo chip, algo que tres sueltos no igualan."
      - texto: "No importa: es una caja negra ideal"
        porque: "Como caja negra se usa, pero sus límites reales vienen de lo que lleva dentro."
    escalera:
      - "¿De dónde vienen el offset o el slew rate de un operacional?"
    solucion: "De sus bloques internos: por eso entenderlos permite elegir el operacional y diagnosticarlo."

  - id: empareje-precio
    tipo: pregunta
    fase: "Empareje"
    titulo: "El precio del discreto"
    texto: "Una cada cosa que un discreto exige con lo que el integrado ya trae."
    libro: [21, 22, 23, 24]
    emparejar:
      - ["Polarización", "Ya hecha y compensada"]
      - ["Apareamiento", "Mismo chip, misma temperatura"]
      - ["Compensación térmica", "Resuelta, sin componentes adicionales"]
      - ["Estabilidad", "Viene dada"]
    exito: "Con discretos todo eso hay que diseñarlo; dentro de un integrado viene resuelto."
    pistas:
      - { texto: "Dos transistores sueltos nunca están tan igualados como dos del mismo chip." }
    escalera:
      - "El apareamiento depende de dónde están los transistores: en el mismo chip, iguales y a la misma temperatura."
    solucion: "Polarización–ya hecha, apareamiento–mismo chip, compensación térmica–resuelta, estabilidad–viene dada."

  - id: pregunta-criterio
    tipo: pregunta
    titulo: "El criterio"
    texto: "Hay que amplificar una señal sin ninguna exigencia especial. ¿Integrado o discreto?"
    libro: [26]
    widget:
      tipo: figura
      figura: fig-43.2
      zonas:
        - { id: tension, rotulo: "Recuadro «Tensión»", rect: [2, 59, 145, 51] }
    opciones:
      - texto: "Integrado: es el que va por defecto"
        bien: true
        porque: "Integrado por defecto, discreto cuando haya una razón concreta: aquí no hay ninguna."
      - texto: "Discreto: siempre es más barato"
        porque: "Solo en una función simple. Para amplificar sin más, el integrado ahorra polarizar, aparear y estabilizar."
      - texto: "Discreto: suena mejor"
        porque: "Sin una razón concreta (potencia, frecuencia, ruido, tensión), el integrado hace casi todo mejor."
    escalera:
      - "¿Se da alguna de las cinco razones?"
    solucion: "Integrado: discreto solo cuando haya una razón concreta."

  - id: prediga-banco
    tipo: predecir
    titulo: "En el banco"
    texto: "Un emisor común frente a un operacional con la misma ganancia: se miden ganancia, impedancia de entrada y distorsión. ¿Quién gana?"
    libro: [31, 32]
    widget:
      tipo: figura
      figura: fig-43.2
      zonas:
        - { id: entender, rotulo: "Recuadro «Entender»", rect: [308, 59, 145, 51] }
    opciones:
      - texto: "El operacional, en casi todo"
        bien: true
        porque: "Lleva dentro veinte transistores apareados haciendo lo que uno solo no puede."
      - texto: "El emisor común, por ser más sencillo"
        porque: "Lo sencillo es su debilidad: un solo transistor no corrige su distorsión ni su deriva."
      - texto: "Empatan: los dos amplifican igual"
        porque: "La ganancia puede ser la misma, pero la impedancia de entrada y la distorsión del operacional son mucho mejores."
    escalera:
      - "¿Cuántos transistores apareados trabajan dentro de un operacional?"
    solucion: "El operacional gana en casi todo: veinte transistores apareados frente a uno."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [4, 11, 17, 26]
    ideas:
      - { titulo: "Cinco casos.", texto: "Potencia, frecuencia, ruido, tensión y función simple; la última es la más frecuente." }
      - { titulo: "La sexta razón.", texto: "Un operacional es un par diferencial, un espejo y una etapa AB: sus límites salen de ahí." }
      - { titulo: "El precio.", texto: "Polarización, apareamiento, compensación térmica y estabilidad, que el integrado ya trae." }
      - { titulo: "El criterio.", texto: "Integrado por defecto, discreto cuando haya una razón concreta." }
