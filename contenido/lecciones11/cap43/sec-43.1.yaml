# Lección 1.2 de la sección 44.1 «Por Qué Discretos Hoy» (cap43; etiqueta sec-43.1).
# Formato: contenido/lecciones11/GUIA.md. Sección sin cálculos: las cinco razones (y la sexta, didáctica) sobre la
# figura 44.2 del libro (fig-43.2, con zonas), la válvula, el precio del discreto y el criterio de elección.
# 1.2.1 (autor121-ana, «aprender haciendo», GUIA §13): la función simple se hace con un transistor que satura (valores
# de ejemplo: 12 V, 1 kΩ, 47 kΩ, β = 100), los casos se tocan en orden en la fig. 44.2 y la sexta razón también; el caso
# más frecuente, el criterio y el banco pasan a explicaciones y resumen. Quedan una pregunta de opciones (la válvula) y
# el emparejamiento del precio.
# 1.3 (contenido13): + medir la corriente de la carga saturado y + medir la salida con el mando a 0 V (el inversor del
# bloque 10), sobre el mismo circuito de ejemplo: 3/5 → 5/7.
leccion: cap43/sec-43.1

libro:
  4: "hay cinco situaciones donde son la respuesta correcta"
  6: "mandan los transistores sueltos"
  7: "un transistor discreto elegido para el caso supera"
  8: "puede tener menos ruido que cualquier operacional"
  9: "los integrados de propósito general quedan fuera"
  10: "es más barato y ocupa menos que un integrado"
  11: "Ese último caso es el más frecuente en la práctica"
  13: "un cátodo calentado al rojo emite electrones"
  14: "Sus defectos explican su desaparición"
  17: "Un operacional es un par diferencial"
  18: "ese entendimiento es lo que permite elegirlo bien"
  21: "ya está hecha y compensada"
  22: "nunca están tan igualados como dos de un mismo chip"
  23: "Compensación térmica, que exige componentes adicionales"
  24: "Estabilidad, que hay que asegurar en lugar de venir dada"
  26: "integrado por defecto, discreto cuando haya una razón concreta"
  31: "montar un emisor común, medir su ganancia"
  32: "El operacional gana en casi todo"
  33: "Las seis razones para usar transistores discretos"

modelo:
  valores:
    V_cc: { sim: "V_{CC}", nombre: "alimentación", unidad: V, valor: 12 }
    R_c: { sim: "R_{C}", nombre: "carga: relé o LED con su resistencia", unidad: Ω, valor: 1000 }
    V_b: { sim: "V_{in}", nombre: "tensión de mando", unidad: V, valor: 0 }
    R_b: { sim: "R_{B}", nombre: "resistencia de base", unidad: Ω, valor: 47000 }
    beta: { sim: "β", nombre: "ganancia de corriente", unidad: "", valor: 100 }
    V_BE: { sim: "V_{BE}", nombre: "tensión base-emisor", unidad: V, valor: 0.7 }
    V_CEs: { sim: "V_{CE(sat)}", nombre: "tensión de saturación", unidad: V, valor: 0.2 }
  calculos:
    I_b: { expr: "max(0, (V_b - V_BE)/R_b)", sim: "I_{B}", nombre: "corriente de base", unidad: A }
    I_cm: { expr: "(V_cc - V_CEs)/R_c", sim: "I_{C,máx}", nombre: "corriente de saturación", unidad: A }
    I_c: { expr: "min(beta*I_b, I_cm)", sim: "I_{C}", nombre: "corriente de colector", unidad: A }
    V_ce: { expr: "V_cc - I_c*R_c", sim: "V_{CE}", nombre: "tensión colector-emisor", unidad: V }

tarjetas:
  - id: explore-razones
    tipo: explorar
    titulo: "Una función simple"
    texto: "Un solo transistor gobierna una carga, un relé o un LED. Suba la tensión de mando hasta que el transistor sature y la carga reciba toda la corriente."
    nota: "Valores de ejemplo."
    libro: [10, 11]
    inicio: { V_b: 0 }
    widget:
      tipo: circuito
      esquema: bjt-interruptor
      piezas: { vcc: V_cc, rc: R_c, entrada: V_b, rb: R_b, beta: beta, vbe: V_BE, vcesat: V_CEs }
      lectura: { valor: I_c, rotulo: "I_{C}" }
      datos:
        - { valor: V_ce, rotulo: "V_{CE} = {{V_ce}}" }
      corriente: I_c
      mide: { ib: I_b, ic: I_c, vce: V_ce }
      mandos:
        - { valor: V_b, min: 0, max: 10, paso: 0.5, rotulo: "Tensión de mando" }
    objetivo:
      condiciones:
        - { valor: V_ce, max: 0.2, rotulo: "V_{CE}: {{V_ce}}" }
      logrado: "Saturado: la carga recibe {{I_c}}. Un transistor es más barato y ocupa menos que un integrado: es el caso más frecuente, y por eso hay transistores sueltos en cualquier placa."
      pistas:
        - { texto: "Aún no satura: más mando." }
    escalera:
      - "Satura cuando β · I_{B} supera lo que deja la carga."
    solucion: "Desde unos 6 V de mando, satura."
    comprobar:
      - { con: { V_b: 6.5 }, V_ce: 0.2, I_c: 0.0118, tol: 0.01 }

  - id: mida-carga
    tipo: medir
    titulo: "Lo que recibe la carga"
    texto: "Con 6,5 V de mando el transistor está saturado. Meta el amperímetro en la rama por la que pasa la corriente de la carga."
    nota: "Valores de ejemplo."
    libro: [10]
    fijar: { V_b: 6.5 }
    widget:
      tipo: circuito
      esquema: bjt-interruptor
      piezas: { vcc: V_cc, rc: R_c, entrada: V_b, rb: R_b, beta: beta, vbe: V_BE, vcesat: V_CEs }
      corriente: I_c
      mide: { ib: I_b, ic: I_c, vce: V_ce }
      instrumento:
        tipo: multimetro
        modos: [A]
      mandos: []
    medir:
      magnitud: corriente
      rama: vcm
      valor: I_c
      porque:
        vbm: "Esa es la corriente de base, unas cien veces menor: el mando apenas gasta."
    exito: "{{I_c}}: casi toda la que deja la carga, 12 V entre 1 kΩ. Un mando de microamperios gobierna miliamperios."
    escalera:
      - "La carga está en el colector."
    solucion: "El amperímetro en la rama del colector: unos 11,8 mA."
    comprobar:
      - { I_c: 0.0118, R_c: 1000, V_cc: 12, tol: 0.01 }

  - id: mida-inversor
    tipo: medir
    titulo: "Invertir una señal"
    texto: "Ahora el mando está a 0 V. Ponga las puntas donde se lee la salida del transistor, en el colector."
    nota: "Valores de ejemplo."
    libro: [10]
    fijar: { V_b: 0 }
    widget:
      tipo: circuito
      esquema: bjt-interruptor
      piezas: { vcc: V_cc, rc: R_c, entrada: V_b, rb: R_b, beta: beta, vbe: V_BE, vcesat: V_CEs }
      corriente: I_c
      mide: { ib: I_b, ic: I_c, vce: V_ce }
      instrumento:
        tipo: multimetro
        modos: [V]
      mandos: []
    medir:
      magnitud: tension
      entre: [c, "0"]
      valor: V_ce
      porque:
        vcc: "Esa punta está en el raíl: marca 12 V mande lo que mande la entrada."
        b: "Esa es la base, la entrada del transistor, no su salida."
        in: "Esa es la propia tensión de mando."
    exito: "12 V con la entrada a 0, y 0,2 V con la entrada alta: un solo transistor invierte la señal, más barato que un integrado."
    escalera:
      - "La salida es el colector, entre la resistencia de carga y el transistor."
    solucion: "Roja en el colector y negra en masa: 12 V."
    comprobar:
      - { V_ce: 12 }
      - { con: { V_b: 6.5 }, V_ce: 0.2, tol: 0.01 }

  - id: empareje-casos
    tipo: tocar
    fase: "Elija"
    titulo: "Cada caso, su razón"
    texto: "Toque, por este orden, la razón de usar un MOSFET de potencia, un transistor elegido para radiofrecuencia y un transistor que enciende un LED."
    libro: [6, 7, 8, 9, 10, 33]
    widget:
      tipo: figura
      figura: fig-43.2
      zonas:
        - { id: potencia, rotulo: "Recuadro «Potencia»", rect: [2, 1, 145, 52] }
        - { id: frecuencia, rotulo: "Recuadro «Frecuencia»", rect: [155, 1, 145, 52] }
        - { id: ruido, rotulo: "Recuadro «Ruido»", rect: [308, 1, 145, 52] }
        - { id: tension, rotulo: "Recuadro «Tensión»", rect: [2, 59, 145, 51] }
        - { id: simple, rotulo: "Recuadro «Función simple»", rect: [155, 59, 145, 51] }
        - { id: entender, rotulo: "Recuadro «Entender»", rect: [308, 59, 145, 51] }
    tocar:
      bien: [potencia, frecuencia, simple]
      orden: true
      porque:
        ruido: "El ruido justifica un transistor seleccionado en la primera etapa de un amplificador muy exigente."
        tension: "La tensión, con decenas o cientos de voltios, deja fuera a los integrados de propósito general."
        entender: "Entender lo que hay dentro de un integrado es la razón didáctica, no la de un montaje."
    exito: "Potencia, frecuencia y función simple. Con el ruido y la tensión, son los cinco casos donde un discreto es la respuesta correcta."
    escalera:
      - "Busque qué magnitud se sale de lo normal en cada ejemplo."
    solucion: "Potencia; frecuencia; función simple."

  - id: pregunta-valvula
    tipo: pregunta
    titulo: "Antes del transistor"
    texto: "La válvula de vacío amplificó durante medio siglo. ¿Por qué desapareció?"
    libro: [13, 14]
    widget:
      tipo: figura
      figura: fig-43.2
      zonas:
        - { id: potencia, rotulo: "Recuadro «Potencia»", rect: [2, 1, 145, 52] }
    opciones:
      - texto: "El filamento consume vatios, pide tensiones altas, se calienta y se agota"
        bien: true
        porque: "Son sus defectos; aun así sobrevive en audio, por cómo satura, y en radiofrecuencia de gran potencia."
      - texto: "Porque no amplificaba: solo rectificaba"
        porque: "Eso era el diodo de Fleming. Con una rejilla, el triodo controla una corriente de placa grande con una tensión pequeña."
      - texto: "Porque su impedancia de entrada era muy baja"
        porque: "Al revés: se controla por tensión en la rejilla, con impedancia de entrada altísima."
    escalera:
      - "Un cátodo calentado al rojo, una placa a cientos de voltios: ¿qué cuesta eso?"
    solucion: "Consumo del filamento, tensiones altas, tamaño y calor, y desgaste con las horas."

  - id: porque-operacional
    tipo: tocar
    titulo: "La sexta razón"
    texto: "Un operacional es un par diferencial, un espejo de corriente y una etapa clase AB, y de ahí salen su offset y su slew rate. Toque la razón que justifica este capítulo."
    libro: [17, 18, 32]
    widget:
      tipo: figura
      figura: fig-43.2
      zonas:
        - { id: potencia, rotulo: "Recuadro «Potencia»", rect: [2, 1, 145, 52] }
        - { id: ruido, rotulo: "Recuadro «Ruido»", rect: [308, 1, 145, 52] }
        - { id: simple, rotulo: "Recuadro «Función simple»", rect: [155, 59, 145, 51] }
        - { id: entender, rotulo: "Recuadro «Entender»", rect: [308, 59, 145, 51] }
    tocar:
      bien: [entender]
      porque:
        potencia: "La potencia justifica un discreto en un montaje, no el estudio del capítulo."
        ruido: "El ruido es uno de los cinco casos de montaje."
        simple: "La función simple es el caso más frecuente en una placa, no la razón didáctica."
    exito: "Entender lo que hay dentro permite elegir bien el operacional y diagnosticarlo. En el banco, frente a un emisor común, gana en casi todo: lleva veinte transistores apareados."
    escalera:
      - "¿Qué razón no es un caso de montaje?"
    solucion: "Entender lo que hay dentro de los integrados."

  - id: empareje-precio
    tipo: pregunta
    fase: "Empareje"
    titulo: "El precio del discreto"
    texto: "Una cada cosa que un discreto exige con lo que el integrado ya trae."
    libro: [21, 22, 23, 24]
    emparejar:
      - ["Polarización", "Ya hecha y compensada"]
      - ["Apareamiento", "Mismo chip, misma temperatura"]
      - ["Compensación térmica", "Resuelta, sin componentes adicionales"]
      - ["Estabilidad", "Viene dada"]
    exito: "Con discretos todo eso hay que diseñarlo; dentro de un integrado viene resuelto."
    pistas:
      - { texto: "Dos transistores sueltos nunca están tan igualados como dos del mismo chip." }
    escalera:
      - "El apareamiento depende de dónde están los transistores: en el mismo chip, iguales y a la misma temperatura."
    solucion: "Polarización–ya hecha, apareamiento–mismo chip, compensación térmica–resuelta, estabilidad–viene dada."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [4, 11, 17, 26, 31]
    ideas:
      - { titulo: "Cinco casos.", texto: "Potencia, frecuencia, ruido, tensión y función simple; la última es la más frecuente." }
      - { titulo: "La sexta razón.", texto: "Un operacional es un par diferencial, un espejo y una etapa AB: sus límites salen de ahí." }
      - { titulo: "El precio.", texto: "Polarización, apareamiento, compensación térmica y estabilidad, que el integrado ya trae." }
      - { titulo: "El criterio.", texto: "Integrado por defecto, discreto cuando haya una razón concreta." }
