# Lección 1.2 de la sección 44.6 «Etapas Múltiples y el Par Diferencial» (cap43; etiqueta sec-43.6).
# Formato: contenido/lecciones11/GUIA.md.
# - Etapas que se cargan: el emisor común de la sección 44.3 (ganancia 169, Z_out ≈ R_C = 3,3 kΩ) como fuente de
#   tensión controlada (Thévenin) en «fuente-controlada», y la entrada de una segunda etapa igual (Z_in = 2,16 kΩ) como
#   su carga: 169 · 2,16/(3,3 + 2,16) ≈ 67 (invertida, `invierte` 1.2). «prediga-comun» va sobre el «par-diferencial»
#   vivo (cola ideal de 2 mA, R_C = 10 kΩ y ±12 V de ejemplo).
# - La banda de n etapas iguales (bloque 178): gráfica normalizada a f/f_c de cada etapa.
# - El CMRR frente a la impedancia de la fuente de cola: la gráfica de la figura 44.12 (fig-43.10, bloque 206), con su
#   fórmula CMRR ≈ g_m·R_EE a 1 mA por transistor (g_m = 1 mA / 25,9 mV, sección 44.4); sus tres puntos (5,6 kΩ, 50 kΩ y
#   5 MΩ) son los de la figura.
# 1.2.1 (autor121-ana, «aprender haciendo», GUIA §13): la salida cargada se predice y se simula y la segunda etapa se
# conecta, la fracción de banda con tres etapas se predice y se añaden etapas hasta bajar de la mitad, la carga activa se
# toca en la fig. 44.12, las bases se suben a la vez sin que cambie la salida y la fuente de cola se mejora hasta 100 dB
# (objetivos). El apareamiento y el banco pasan a explicación y resumen. Quedan dos preguntas de opciones (el seguidor,
# la deriva) y el emparejamiento del acoplo.
leccion: cap43/sec-43.6

libro:
  176: "es el producto de sus ganancias, lo que en decibelios es una suma"
  177: "se intercala un seguidor"
  178: "con tres etapas, la mitad"
  181: "su precio es un corte inferior de frecuencia"
  182: "una deriva en la primera se amplifica en todas las siguientes"
  185: "Dos transistores con los emisores unidos a una fuente de corriente común"
  187: "el reparto no cambia y la salida tampoco"
  188: "sus derivas se cancelan"
  189: "No necesita condensador de desvío"
  192: "el CMRR es aproximadamente proporcional a ella"
  193: "Cualquier asimetría hace que una señal común se convierta parcialmente en diferencial"
  194: "el amplificador de instrumentación se compre y no se haga"
  196: "Sustituyendo las resistencias de colector por un espejo de corriente"
  197: "tenga ganancia de mil o más"
  198: "convierte la salida diferencial en salida única"
  203: "Su cociente es el CMRR"
  204: "El CMRR cae drásticamente"
  206: "dependencia del CMRR con la impedancia de la fuente de corriente"
  "cap43#70": "Av = −gm·RC = −RC/re = −169"
  "cap43#72": '"2,16 kΩ"'
  "cap43#74": "Zout ≈ 3,3 kΩ"
  "cap43#116": "Con IC = 1 mA y VT = 25,9 mV, gm = 38,6 mS"

modelo:
  valores:
    v_1: { sim: "v", nombre: "señal de entrada", unidad: V, valor: 0.001 }
    A_1: { sim: "A_{v}", nombre: "ganancia en vacío de la primera etapa", unidad: "", valor: 169 }
    R_o1: { sim: "Z_{out}", nombre: "salida de la primera etapa", unidad: Ω, valor: 3300 }
    Z_2: { sim: "Z_{in}", nombre: "entrada de la segunda etapa", unidad: Ω, valor: 2160 }
    c_on: { tipo: interruptor, nombre: "segunda etapa conectada", valor: 0 }
    n_e: { sim: "n", nombre: "número de etapas iguales", unidad: "", valor: 1 }
    g_d: { sim: "g_{m}", nombre: "transconductancia a 1 mA", unidad: S, valor: 0.0386 }
    R_EE: { sim: "R_{EE}", nombre: "impedancia de la fuente de cola", unidad: Ω, valor: 5000000 }
    inv: { tipo: interruptor, nombre: "fuente invertida (emisor común)", valor: 1 }
    Vcc6: { sim: "V_{CC}", nombre: "alimentación positiva", unidad: V, valor: 12 }
    Vee6: { sim: "V_{EE}", nombre: "alimentación negativa", unidad: V, valor: 12 }
    Rc6: { sim: "R_{C}", nombre: "resistencia de colector", unidad: Ω, valor: 10000 }
    I6: { sim: "I", nombre: "corriente de la fuente de cola", unidad: A, valor: 0.002 }
    b6: { sim: "β", nombre: "ganancia de corriente", unidad: "", valor: 100 }
    Vbe6: { sim: "V_{BE}", nombre: "tensión base-emisor", unidad: V, valor: 0.7 }
    v06: { sim: "V_{B}", nombre: "continua de las bases", unidad: V, valor: 0 }
    acm6: { sim: "v_{cm}", nombre: "lo que suben a la vez las dos bases", unidad: V, valor: 0.1 }
    f6: { sim: "f", nombre: "frecuencia", unidad: Hz, valor: 1000 }
  calculos:
    I_L: { si: c_on, entonces: "(1 - 2*inv)*A_1*v_1/(R_o1 + Z_2)", sino: "0", sim: "i", nombre: "corriente hacia la segunda etapa", unidad: A }
    V_o: { expr: "(1 - 2*inv)*A_1*v_1 - I_L*R_o1", sim: "v_{o}", nombre: "salida de la primera etapa", unidad: V }
    A_t: { expr: "abs(V_o/v_1)", sim: "|A_{v}|", nombre: "ganancia real de la primera etapa", unidad: "", cifras: 3 }
    Ic6: { expr: "b6/(b6 + 1)*I6/2", sim: "I_{C}", nombre: "corriente de cada colector", unidad: A }
    Vc6: { expr: "Vcc6 - Ic6*Rc6", sim: "V_{C}", nombre: "tensión de colector", unidad: V }
    Vcm6: { expr: "0*acm6", sim: "v_{c}", nombre: "señal de modo común en cada colector", unidad: V }
    k_n: { expr: "sqrt(2^(1/n_e) - 1)", sim: "f_{c,total}/f_{c}", nombre: "fracción del corte que queda", unidad: "", cifras: 3 }
    f_40: { expr: "Z_2/(R_o1 + Z_2)*100", sim: "fracción", nombre: "parte de la tensión en vacío que llega", unidad: "%", cifras: 2 }
    r_3: { expr: "2^(1/n_e)", sim: "2^{1/n}", nombre: "raíz n-ésima de dos", unidad: "", cifras: 3 }
    C_dB: { expr: "20*log10(g_d*R_EE)", sim: "CMRR", nombre: "rechazo de modo común", unidad: dB, cifras: 3 }
    V_v: { expr: "-A_1*v_1", sim: "v_{o}", nombre: "salida en vacío", unidad: V }

tarjetas:
  - id: prediga-carga
    tipo: simular
    titulo: "Dos etapas en cascada"
    texto: "El emisor común gana 169 en vacío, con salida de 3,3 kΩ; se le conecta otro igual, de entrada 2,16 kΩ. Con 1 mV a la entrada, ¿qué da la primera?"
    libro: ["cap43#70", "cap43#72", "cap43#74", 177]
    fijar: { c_on: 1 }
    widget:
      tipo: circuito
      esquema: fuente-controlada
      piezas: { control: v_1, av: A_1, ro: R_o1, carga: Z_2, interruptor: c_on, invierte: inv }
      lectura: { valor: V_o, rotulo: "Salida de la primera etapa" }
      corriente: I_L
      mide: { salida: V_o, carga: I_L, controlada: I_L }
      ocultar: true
      mandos: []
    simular:
      objetivo: V_o
      unidad: V
      tol: 0.02
      rotulo: "Salida"
      medida: salida
      errores:
        - { expr: "V_v", texto: "Eso es en vacío. La entrada de la segunda forma un divisor con la salida de la primera." }
        - { expr: "-V_o", texto: "El emisor común invierte." }
    exito: "Unos −67 mV: solo llega el 40 % de la tensión en vacío. La ganancia calculada aislada no es la real."
    escalera:
      - "Divisor: 2,16 kΩ frente a 3,3 + 2,16 kΩ."
    solucion: "−169 mV · 2,16/(3,3 + 2,16) ≈ −67 mV."
    comprobar:
      - { A_t: 66.86, V_o: -0.06686, v_1: 0.001, tol: 0.01 }
      - { con: { c_on: 1 }, Z_2: 2160, R_o1: 3300, f_40: 39.56, tol: 0.03 }

  - id: sorpresa-carga
    tipo: sorpresa
    titulo: "Conecte la segunda etapa"
    texto: "La ganancia calculada aislada no es la real. Conecte la entrada siguiente y mire la salida."
    libro: [177]
    inicio: { c_on: 0 }
    widget:
      tipo: circuito
      esquema: fuente-controlada
      piezas: { control: v_1, av: A_1, ro: R_o1, carga: Z_2, interruptor: c_on, invierte: inv }
      lectura: { valor: V_o, rotulo: "Salida de la primera etapa" }
      datos:
        - { valor: A_t, rotulo: "Ganancia: {{A_t}}" }
      corriente: I_L
      mide: { salida: V_o, carga: I_L, controlada: I_L }
      mandos:
        - { valor: c_on, tipo: conectar, boton: "Conectar la segunda etapa" }
    objetivo:
      condiciones:
        - { valor: c_on, min: 1, rotulo: "Segunda etapa conectada" }
      logrado: "La salida cae a {{V_o}}: ganancia {{A_t}} en lugar de 169. Las ganancias en cascada se multiplican, pero cada entrada carga la salida anterior."
      pistas:
        - { texto: "Conecte la segunda etapa." }
    escalera:
      - "La entrada de la segunda es menor que la salida de la primera."
    solucion: "Conectada: la ganancia baja a unos 67."
    comprobar:
      - { con: { c_on: 1 }, A_t: 66.86, tol: 0.01 }

  - id: pregunta-seguidor
    tipo: pregunta
    titulo: "El remedio"
    texto: "La entrada de la siguiente no es mucho mayor que la salida de la anterior. ¿Qué se hace?"
    libro: [177]
    fijar: { c_on: 1 }
    widget:
      tipo: circuito
      esquema: fuente-controlada
      piezas: { control: v_1, av: A_1, ro: R_o1, carga: Z_2, interruptor: c_on, invierte: inv }
      lectura: { valor: V_o, rotulo: "Salida de la primera etapa" }
      corriente: I_L
      mide: { salida: V_o, carga: I_L, controlada: I_L }
    opciones:
      - texto: "Intercalar un seguidor"
        bien: true
        porque: "Entrada alta y salida baja: la primera ve una carga ligera y la segunda una fuente fuerte."
      - texto: "Subir R_{C} de la primera etapa"
        porque: "Sube la ganancia en vacío, pero también su salida, y la carga pesa aún más."
      - texto: "Añadir otra etapa de emisor común"
        porque: "Tendría el mismo problema: entrada media frente a salida alta."
    escalera:
      - "¿Qué configuración tiene entrada alta y salida baja?"
    solucion: "Un seguidor entre las dos etapas."

  - id: estime-tres
    tipo: simular
    fase: "Estime"
    titulo: "Tres etapas"
    texto: "n etapas iguales de corte f_{c} cortan juntas en f_{c} · √(2^{1/n} − 1). Con tres, ¿qué fracción del corte queda?"
    libro: [178]
    fijar: { n_e: 3 }
    simular:
      objetivo: k_n
      unidad: ""
      tol: 0.02
      rotulo: "Fracción de f_{c}"
      errores:
        - { expr: "1/n_e", texto: "No se divide por el número de etapas: √(2^{1/n} − 1)." }
    exito: "La mitad: por eso se sobredimensiona la banda de cada etapa."
    escalera:
      - "La raíz cúbica de 2 es algo más de 1,26."
    solucion: "√(1,26 − 1) ≈ 0,51: la mitad."
    comprobar:
      - { k_n: 0.51, tol: 0.01 }
      - { con: { n_e: 3 }, r_3: 1.26, tol: 0.01 }

  - id: explore-banda
    tipo: explorar
    titulo: "La banda se estrecha"
    texto: "Cada etapa aporta su corte. Añada etapas iguales hasta que el corte del conjunto baje de la mitad del de una."
    libro: [178]
    inicio: { n_e: 1 }
    widget:
      tipo: grafica
      x: { id: q, min: 0.05, max: 5, unidad: "", rotulo: "f / f_{c}", escala: log }
      y: { min: 0, max: 1.1, unidad: "", rotulo: "ganancia relativa" }
      curvas:
        - { expr: "1/sqrt(1 + q^2)", color: tinta, rotulo: "una etapa", discontinua: true }
        - { expr: "(1 + q^2)^(-n_e/2)", color: naranja, rotulo: "n etapas" }
      marcas:
        - { x: "k_n", y: "0.7071", rotulo: "corte" }
      lectura: { valor: k_n, rotulo: "Corte del conjunto, en f_{c}" }
      mandos:
        - { valor: n_e, lista: [1, 2, 3, 4, 5], rotulo: "Etapas" }
    objetivo:
      condiciones:
        - { valor: k_n, max: 0.5, rotulo: "Corte: {{k_n}}" }
      logrado: "Con {{n_e}} etapas el corte del conjunto queda en {{k_n}} del de cada una: cada etapa debe tener mucha más banda que la pedida."
      pistas:
        - { texto: "Añada etapas." }
    escalera:
      - "Con tres, aún algo más de la mitad."
    solucion: "Cuatro etapas: unos 0,43."
    comprobar:
      - { con: { n_e: 4 }, k_n: 0.435, tol: 0.01 }

  - id: empareje-acoplo
    tipo: pregunta
    fase: "Empareje"
    titulo: "El acoplamiento entre etapas"
    texto: "Una cada forma de acoplar con su ventaja y su precio."
    libro: [181, 182]
    emparejar:
      - ["Por condensador", "Cada etapa conserva su punto de trabajo"]
      - ["Precio del condensador", "Un corte inferior de frecuencia"]
      - ["Directo", "Amplifica continua con menos piezas"]
      - ["Precio del directo", "La deriva de la primera se amplifica en todas"]
    exito: "El par diferencial resuelve el precio del acoplamiento directo."
    pistas:
      - { texto: "El condensador bloquea la continua: eso aísla los puntos de trabajo y corta las frecuencias bajas." }
    escalera:
      - "Sin condensador, la continua de una etapa entra en la siguiente."
    solucion: "Condensador–puntos independientes, con corte inferior. Directo–continua, con deriva acumulada."

  - id: explore-par
    tipo: tocar
    titulo: "El par diferencial"
    texto: "Dos transistores con los emisores unidos a una fuente de corriente. Toque la parte que da ganancia de mil o más en una etapa y convierte la salida en única."
    libro: [185, 196, 197, 198, 206]
    widget:
      tipo: figura
      figura: fig-43.10
      zonas:
        - { id: q1, rotulo: "Transistor de la izquierda, abajo", rect: [20, 100, 45, 45] }
        - { id: q2, rotulo: "Transistor de la derecha, abajo", rect: [115, 100, 45, 45] }
        - { id: fuente, rotulo: "Fuente de abajo", rect: [70, 168, 45, 40] }
        - { id: espejo, rotulo: "Recuadro de arriba", rect: [22, 22, 140, 58] }
    tocar:
      bien: [espejo]
      porque:
        q1: "Q₁ es una entrada: la corriente de la fuente se reparte según la diferencia entre las bases."
        q2: "Q₂ es la otra entrada."
        fuente: "La fuente de corriente común decide el rechazo de lo común, no la ganancia."
    exito: "La carga activa, un espejo: carga altísima, ganancia de mil o más y salida única. Por eso un operacional llega a 10⁵ con solo dos etapas."
    escalera:
      - "¿Qué sustituye a las resistencias de colector?"
    solucion: "El espejo de corriente de arriba."

  - id: prediga-comun
    tipo: explorar
    titulo: "Las dos bases a la vez"
    texto: "Suba a la vez las dos bases del par, con la misma señal, y mire la señal en cada colector."
    libro: [185, 187]
    inicio: { acm6: 0.1 }
    widget:
      tipo: circuito
      esquema: par-diferencial
      piezas: { vcc: Vcc6, vee: Vee6, rc: Rc6, icola: I6, beta: b6, vbe: Vbe6, v1: v06, v2: v06, acm: acm6, f: f6 }
      lectura: { valor: Vcm6, rotulo: "Señal en cada colector" }
      corriente: Ic6
      mide: { ic1: Ic6, ic2: Ic6, vc1: Vc6, vc2: Vc6, salida1_amp: Vcm6, salida2_amp: Vcm6 }
      mandos:
        - { valor: acm6, lista: [0.1, 0.5, 1], rotulo: "Señal común en las bases" }
    objetivo:
      condiciones:
        - { valor: acm6, min: 1, rotulo: "Señal común: {{acm6}}" }
      logrado: "Con 1 V común, los colectores siguen quietos: el reparto de la corriente no cambia. Amplifica la diferencia y rechaza lo común."
      pistas:
        - { texto: "Suba más la señal común." }
    escalera:
      - "Lo que suben juntas no altera el reparto, y la salida depende del reparto."
    solucion: "Con 1 V común, nada en los colectores."
    comprobar:
      - { con: { acm6: 1 }, Vcm6: 0 }

  - id: porque-deriva
    tipo: porque
    titulo: "Continua sin deriva"
    texto: "¿Por qué un par diferencial permite el acoplamiento directo sin que se acumule deriva?"
    libro: [188, 189]
    widget:
      tipo: figura
      figura: fig-43.10
      zonas:
        - { id: par, rotulo: "Los dos transistores de abajo", rect: [20, 100, 140, 45] }
    opciones:
      - texto: "Los dos derivan igual, en el mismo chip y a la misma temperatura, y se cancelan"
        bien: true
        porque: "Por eso un operacional amplifica continua con offset de microvoltios."
      - texto: "Porque lleva condensador de desvío"
        porque: "No lo necesita: el punto medio es una masa virtual para la señal diferencial."
      - texto: "Porque no amplifica la continua"
        porque: "Sí la amplifica; lo que cancela es la deriva común a los dos."
    escalera:
      - "La deriva es igual en los dos transistores. ¿Cómo se ve eso desde la diferencia?"
    solucion: "Las derivas iguales son una señal común: se cancelan."

  - id: explore-cmrr
    tipo: explorar
    titulo: "De qué depende el CMRR"
    texto: "Si la fuente de cola fuese ideal, una señal común no cambiaría nada. Elija la fuente real que pasa de cien decibelios de rechazo."
    libro: [192, 193, 194, 204, 206, "cap43#116"]
    inicio: { R_EE: 5600 }
    widget:
      tipo: grafica
      x: { id: r, min: 1000, max: 100000000, unidad: Ω, rotulo: "R_{EE}", escala: log }
      y: { min: 20, max: 140, unidad: dB, rotulo: "CMRR" }
      curvas:
        - { expr: "20*log10(g_d*r)", color: azul, rotulo: "g_{m}·R_{EE}" }
      marcas:
        - { x: "R_EE", y: "C_dB", rotulo: "{{C_dB}}" }
      lectura: { valor: C_dB, rotulo: "CMRR" }
      mandos:
        - { valor: R_EE, lista: [5600, 50000, 5000000], nombres: [resistencia, espejo simple, espejo cascodo], rotulo: "Fuente de cola" }
    objetivo:
      condiciones:
        - { valor: C_dB, min: 100, rotulo: "CMRR: {{C_dB}}" }
      logrado: "{{C_dB}} con la mejor fuente. Y aun así manda el apareamiento: con transistores sueltos el CMRR es modesto, y por eso el amplificador de instrumentación se compra y no se hace."
      pistas:
        - { texto: "Una fuente de cola de más impedancia." }
    escalera:
      - "El CMRR es aproximadamente g_{m} · R_{EE}."
    solucion: "El espejo cascodo: unos 106 dB."
    comprobar:
      - { con: { R_EE: 5000000 }, C_dB: 105.7, tol: 0.005 }

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [176, 177, 187, 192, 203]
    ideas:
      - { titulo: "En cascada.", texto: "Las ganancias se multiplican, pero cada entrada carga la salida anterior; con tres etapas, la mitad de banda." }
      - { titulo: "El par diferencial.", texto: "Amplifica la diferencia, rechaza lo común y permite acoplar en continua sin deriva." }
      - { titulo: "El CMRR.", texto: "Ganancia diferencial entre la de modo común: crece con la impedancia de la fuente de cola y lo limita el apareamiento." }
      - { titulo: "La carga activa.", texto: "Un espejo da ganancia de mil o más por etapa." }
