# Lección 1.2 de la sección 40.9 «Envejecimiento y Vida Útil de la Batería» (cap39; sec-39.N = impresas 40.N).
# - La regla de Arrhenius del bloque 290 (cada 10 °C de más, el doble de velocidad de degradación) como gráfica del
#   factor de aceleración; la referencia de 25 °C es la del ejemplo de almacenamiento del bloque 296.
# - La figura 40.17 (fig-39.17) con zonas.
# Paso práctico: «banco» del bloque 307: medir la resistencia interna de una 18650 en vacío y con una carga conocida;
# sana, de 50 a 100 mΩ (esperado 75 mΩ ± 33 %); el doble o más indica degradación.
leccion: cap39/sec-39.9

libro:
  282: "Su causa es el crecimiento de la capa SEI"
  283: "Envejecimiento por ciclado: cada carga y descarga produce dilatación y contracción de los electrodos"
  284: "una batería guardada también envejece"
  286: "El criterio habitual de fin de vida es el 80 % de la capacidad nominal."
  287: "Es la explicación de que un teléfono viejo se apague al 30 %."
  290: "cada 10 °C de más multiplica por dos la velocidad de degradación"
  292: "dos ciclos del 50 % dañan menos que uno del 100 %"
  296: "Una celda guardada a 25 °C y al 100 % puede perder un 20 % de capacidad en un año; guardada a 15 °C y al 40 %, menos del 4 %."
  298: "Nunca dejar una batería descargada mucho tiempo"
  301: "baterías de vehículo reutilizadas en almacenamiento estacionario"
  305: "Su aumento es el mejor indicador temprano de degradación."
  307: "En una celda 18650 sana ronda los 50 a 100 mΩ; el doble o más indica degradación."
  309: "Degradación por almacenamiento según temperatura y carga"

modelo:
  valores:
    T_c: { sim: "T", nombre: "temperatura de la celda", unidad: "°C", valor: 25 }
    T_ref: { sim: "T_{ref}", nombre: "temperatura de referencia", unidad: "°C", valor: 25 }
    R_san: { sim: "R_{int}", nombre: "resistencia interna de una 18650 sana", unidad: Ω, valor: 0.075 }
  calculos:
    f_ar: { expr: "2^((T_c - T_ref)/10)", sim: "×", nombre: "velocidad de degradación relativa", unidad: "", cifras: 3 }

tarjetas:
  - id: explore-arrhenius
    tipo: explorar
    titulo: "El factor dominante"
    texto: "La temperatura acelera la degradación más que nada. Cambie la temperatura de la celda y mire cuánto más deprisa envejece."
    libro: [290]
    widget:
      tipo: grafica
      x: { id: tx, min: 0, max: 60, unidad: "°C", rotulo: "T" }
      y: { min: 0, max: 12, unidad: "", rotulo: "velocidad relativa" }
      curvas:
        - { expr: "2^((tx - T_ref)/10)", color: naranja, rotulo: "degradación frente a 25 °C" }
      marcas:
        - { x: "T_c", y: "f_ar", rotulo: "×{{f_ar}}" }
      lectura: { valor: f_ar, rotulo: "Envejece más deprisa por" }
      mandos:
        - { valor: T_c, min: 5, max: 55, paso: 10, rotulo: "Temperatura" }
    requiere: { mover: [T_c] }

  - id: prediga-45
    tipo: predecir
    titulo: "A 45 °C"
    texto: "Una celda trabaja a 45 °C en lugar de a 25 °C. ¿Cuánto más deprisa se degrada?"
    libro: [290]
    fijar: { T_c: 45 }
    widget:
      tipo: grafica
      x: { id: tx, min: 0, max: 60, unidad: "°C", rotulo: "T" }
      y: { min: 0, max: 12, unidad: "", rotulo: "velocidad relativa" }
      curvas:
        - { expr: "2^((tx - T_ref)/10)", color: naranja, rotulo: "degradación frente a 25 °C" }
      lectura: { valor: f_ar, rotulo: "Envejece más deprisa por" }
      ocultar: true
    opciones:
      - texto: "Unas cuatro veces"
        bien: true
        porque: "Son 20 °C más: dos veces el doble."
      - texto: "Unas dos veces"
        porque: "El doble es por cada 10 °C; aquí son 20 °C."
      - texto: "Un 80 % más, en proporción a la temperatura"
        porque: "No es proporcional: cada 10 °C multiplican por dos."
    escalera:
      - "Cuente cuántos escalones de 10 °C hay de 25 a 45 °C."
    solucion: "Dos escalones de 10 °C: el doble del doble, cuatro veces."
    comprobar:
      - { f_ar: 4 }

  - id: empareje-caminos
    tipo: pregunta
    titulo: "Dos envejecimientos"
    texto: "Empareje cada camino de degradación con su causa."
    libro: [282, 283]
    widget:
      tipo: figura
      figura: fig-39.17
      zonas:
        - { id: grafica, rotulo: "La figura", rect: [0, 0, 446, 199] }
    emparejar:
      - ["Por calendario", "La capa SEI crece con el tiempo, se use o no"]
      - ["Por ciclado", "Los electrodos se dilatan y contraen en cada ciclo"]
    exito: "Los dos actúan a la vez: una batería guardada también envejece."
    pistas:
      - { texto: "Uno no necesita usar la batería." }
    escalera:
      - "¿Cuál ocurre aunque la batería esté en un cajón?"
    solucion: "Calendario, la SEI con el tiempo; ciclado, la dilatación de los electrodos."

  - id: almacenar
    tipo: pregunta
    titulo: "Guardarla un año"
    texto: "Hay que guardar una celda de litio un año. ¿Cómo pierde menos?"
    libro: [296, 298, 309]
    widget:
      tipo: figura
      figura: fig-39.17
      zonas:
        - { id: izquierda, rotulo: "Gráfica de la izquierda", rect: [0, 0, 223, 199] }
    opciones:
      - texto: "Al 40 % y en fresco, a unos 15 °C"
        bien: true
        porque: "Así pierde menos del 4 % en un año."
      - texto: "Llena, para que dure más"
        porque: "Al 100 % y a 25 °C puede perder un 20 % en un año: la tensión alta acelera la degradación."
      - texto: "Vacía del todo"
        porque: "Descargada mucho tiempo puede caer por debajo del umbral de seguridad y no deber recargarse."
    escalera:
      - "Dos factores: el estado de carga y la temperatura."
    solucion: "Al 40-60 % y en un sitio fresco: menos del 4 % en un año."

  - id: profundidad
    tipo: pregunta
    titulo: "Ciclos parciales"
    texto: "Dos ciclos del 50 % frente a uno del 100 %, con la misma energía. ¿Cuál daña menos la celda?"
    libro: [292]
    widget:
      tipo: figura
      figura: fig-39.17
      zonas:
        - { id: derecha, rotulo: "Gráfica de la derecha", rect: [223, 0, 223, 199] }
    opciones:
      - texto: "Los dos ciclos del 50 %"
        bien: true
        porque: "Es contraintuitivo pero está bien medido: los ciclos parciales degradan mucho menos."
      - texto: "El ciclo del 100 %, porque es uno solo"
        porque: "Contar ciclos engaña: la profundidad pesa más que el número."
      - texto: "Igual: es la misma energía"
        porque: "La misma energía, pero la descarga profunda daña mucho más."
    escalera:
      - "¿Qué pesa más en el desgaste: el número de ciclos o lo profundos que son?"
    solucion: "Los dos del 50 %."

  - id: telefono-30
    tipo: porque
    titulo: "Se apaga al 30 %"
    texto: "Un teléfono viejo se apaga marcando un 30 % de carga. ¿Por qué?"
    libro: [287]
    widget:
      tipo: figura
      figura: fig-39.17
      zonas:
        - { id: grafica, rotulo: "La figura", rect: [0, 0, 446, 199] }
    opciones:
      - texto: "Su resistencia interna ha crecido y hunde la tensión bajo carga"
        bien: true
        porque: "La tensión cae al corte con un pico de consumo aunque quede carga."
      - texto: "Porque el indicador está estropeado"
        porque: "La carga está ahí; lo que falla es la tensión bajo carga."
      - texto: "Porque ha perdido el 30 % de capacidad"
        porque: "La capacidad perdida no se marca como carga; lo que lo apaga es la caída de tensión."
    escalera:
      - "¿Qué segundo efecto, además de perder capacidad, trae el envejecimiento?"
    solucion: "La resistencia interna alta hunde la tensión bajo carga y el equipo se apaga."

  - id: empareje-diagnostico
    tipo: pregunta
    titulo: "El diagnóstico"
    texto: "Empareje cada comprobación con lo que dice de la batería."
    libro: [305]
    widget:
      tipo: figura
      figura: fig-39.18
      zonas:
        - { id: foto, rotulo: "La foto", rect: [0, 0, 1411, 900] }
    emparejar:
      - ["Tensión en reposo", "Si es muy baja o las celdas difieren, hay un problema"]
      - ["Capacidad real", "La medida definitiva"]
      - ["Resistencia interna", "El mejor indicador temprano"]
      - ["Inspección física", "Hinchazón o fugas: retirada inmediata"]
    exito: "La de la foto no necesita más análisis: hinchada, se retira."
    pistas:
      - { texto: "La definitiva es la que mide lo que de verdad entrega." }
    escalera:
      - "Una se mira, otra se mide en reposo, otra descargando y otra con un escalón de corriente."
    solucion: "Reposo, problema; capacidad, definitiva; resistencia, temprana; inspección, retirada."

  - id: banco-rint
    tipo: banco
    titulo: "Su 18650, medida"
    texto: "Mida una 18650 en vacío, conecte una carga conocida, vuelva a medir y aplique la ley de Ohm a la diferencia."
    libro: [307]
    banco:
      piezas: ["Una celda 18650 cargada", "Una resistencia de potencia conocida como carga", "Brymen en V⎓"]
      medir: "La resistencia interna: la caída de tensión al conectar la carga dividida por la corriente."
      esperado: R_san
      unidad: Ω
      tol: 0.34
      consejos:
        - { cuando: { valor: desviacion, mayor: 1 }, texto: "El doble o más de lo sano: la celda está degradada. Anótelo y sígala." }
        - { cuando: { valor: desviacion, mayor: 0.34 }, texto: "Algo alta: repita con la celda a temperatura ambiente; en frío sube." }
        - { cuando: { valor: desviacion, menor: -0.34 }, texto: "Muy baja: compruebe que mide la tensión en los bornes de la celda, no en la carga." }
        - { texto: "Entre 50 y 100 mΩ: sana. Anote la cifra para seguir su envejecimiento." }
    comprobar:
      - { R_san: 0.075 }

  - id: segunda-vida
    tipo: pregunta
    titulo: "La segunda vida"
    texto: "Una batería de vehículo baja del 80 % de su capacidad. ¿Qué se hace con ella?"
    libro: [286, 301]
    widget:
      tipo: figura
      figura: fig-39.17
      zonas:
        - { id: grafica, rotulo: "La figura", rect: [0, 0, 446, 199] }
    opciones:
      - texto: "Almacenamiento estacionario, donde el peso no importa"
        bien: true
        porque: "Conserva el 80 % de su capacidad, que es mucho."
      - texto: "A la basura"
        porque: "Las de litio nunca van a la basura; y esta aún sirve."
      - texto: "Se sigue usando en el vehículo"
        porque: "El 80 % es el criterio de fin de vida en su aplicación original."
    escalera:
      - "Ya no sirve en el vehículo, pero ¿dónde no importan el peso ni el volumen?"
    solucion: "Segunda vida en almacenamiento estacionario."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [284, 287, 290, 296]
    ideas:
      - { titulo: "Dos caminos.", texto: "Calendario y ciclado, a la vez: guardada también envejece." }
      - { titulo: "Temperatura.", texto: "Cada 10 °C de más, el doble de deprisa." }
      - { titulo: "Ni llena ni vacía.", texto: "Guardar al 40-60 % y en fresco; usar entre el 20 y el 80 %." }
      - { titulo: "Resistencia interna.", texto: "Su aumento avisa antes que nada; una 18650 sana, de 50 a 100 mΩ." }
