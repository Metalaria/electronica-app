# Lección 1.2 de la sección 40.2 «Química: Primarias y Secundarias» (cap39; etiquetas sec-39.N = impresas 40.N).
# - Las curvas de descarga de la figura 40.5 (fig-39.5) con zonas en las tres curvas; la foto 40.6 (fig-39.6) con
#   zonas en cada batería.
# - Sin modelo numérico: la sección es descriptiva; sus números (1,5 a 0,9 V, 4,2 a 3,4 V, 1,0 V por célula) salen de
#   los bloques citados.
# Paso práctico: «tocar» la curva peor para estimar la carga y la batería de arranque en la foto.
leccion: cap39/sec-39.2

libro:
  31: "Su tensión cae de forma continua durante la descarga"
  33: "lo que obliga a añadir un condensador para los picos de transmisión"
  34: "Empieza a agotarse en cuanto se abre, esté o no en uso"
  36: "Su nicho es el arranque y los sistemas estacionarios de respaldo"
  38: "Es reversible con uno o dos ciclos de descarga completa, hasta 1,0 V por célula y nunca a cero"
  40: "Es la elección cuando la seguridad y la longevidad importan más que el peso"
  44: "Alcalina: pendiente continua de 1,5 a 0,9 V"
  45: "relativamente plana entre 4,2 y 3,4 V, con caída brusca al final"
  46: "LiFePO₄: aún más plana, lo que agrava lo anterior"
  47: "no se haga por tensión sino contando culombios"
  49: "Décadas sin cambiar"
  52: "el punto de rodilla, que es donde hay que cortar"
  55: "Curvas de descarga de tres químicas y el criterio de elección"
  56: "batería de plomo-ácido sellada (VRLA) de 12 V"

modelo: { valores: {}, calculos: {} }

tarjetas:
  - id: explore-curvas
    tipo: explorar
    titulo: "La curva de descarga"
    texto: "Es el dato que más afecta al diseño y menos se mira. Toque las tres curvas."
    libro: [31, 44, 45, 46, 55]
    widget:
      tipo: figura
      figura: fig-39.5
      zonas:
        - { id: liion, rotulo: "Curva de arriba", rect: [50, 28, 150, 35], texto: "Ion-litio: casi plana entre 4,2 y 3,4 V, con caída brusca al final." }
        - { id: lfp, rotulo: "Curva del medio", rect: [50, 64, 150, 35], texto: "LiFePO₄: aún más plana." }
        - { id: alcalina, rotulo: "Curva de abajo", rect: [50, 135, 150, 36], texto: "Alcalina: baja de forma continua de 1,5 a 0,9 V. El circuito debe funcionar en todo ese margen." }
    requiere: { mover: [liion, alcalina] }

  - id: toque-plana
    tipo: tocar
    titulo: "La peor para estimar"
    texto: "Toque la curva con la que es más difícil saber cuánta carga queda midiendo la tensión."
    libro: [45, 46]
    widget:
      tipo: figura
      figura: fig-39.5
      zonas:
        - { id: liion, rotulo: "Curva de arriba", rect: [50, 28, 150, 35] }
        - { id: lfp, rotulo: "Curva del medio", rect: [50, 64, 150, 35] }
        - { id: alcalina, rotulo: "Curva de abajo", rect: [50, 135, 150, 36] }
    tocar:
      bien: [lfp]
      porque:
        liion: "El ion-litio ya es casi plano, pero la LiFePO₄ lo es aún más."
        alcalina: "Su pendiente continua es justo lo que permite estimar la carga por tensión."
    exito: "La LiFePO₄: su meseta, aún más plana, agrava el problema del ion-litio."
    escalera:
      - "Cuanto menos cambia la tensión al descargarse, menos dice de la carga."
    solucion: "La del medio, LiFePO₄: la más plana de las tres."

  - id: por-que-culombios
    tipo: porque
    titulo: "Contar culombios"
    texto: "En litio la carga restante no se estima por la tensión. ¿Por qué se cuentan culombios?"
    libro: [45, 47]
    widget:
      tipo: figura
      figura: fig-39.5
      zonas:
        - { id: liion, rotulo: "Curva de arriba", rect: [50, 28, 150, 35] }
    opciones:
      - texto: "La curva es casi plana: la tensión apenas cambia mientras la carga baja"
        bien: true
        porque: "En la meseta, unas décimas de voltio cubren casi toda la carga; integrar la corriente sí la sigue."
      - texto: "Porque el litio no tiene tensión estable"
        porque: "Al contrario: es tan estable que no informa de la carga."
      - texto: "Porque medir tensión gasta la batería"
        porque: "No es eso: el problema es la forma plana de la curva."
    escalera:
      - "¿Cuánto cambia la tensión del ion-litio en la mayor parte de la descarga?"
    solucion: "La meseta casi plana: la tensión no sigue a la carga; la corriente integrada, sí."

  - id: empareje-criterio
    tipo: pregunta
    titulo: "El criterio de elección"
    texto: "Empareje cada prioridad con la química que elige."
    libro: [49]
    widget:
      tipo: figura
      figura: fig-39.5
      zonas:
        - { id: tabla, rotulo: "Tabla de la derecha", rect: [260, 0, 187, 220] }
    emparejar:
      - ["Décadas sin cambiar", "Litio-tionilo"]
      - ["Densidad de energía", "Litio-ion"]
      - ["Vida y seguridad", "LiFePO₄"]
      - ["Corriente de arranque", "Plomo"]
      - ["Muchos ciclos rápidos", "Supercondensador"]
    exito: "Y por coste y disponibilidad, la alcalina."
    pistas:
      - { texto: "El supercondensador no es una batería: gana en ciclos y potencia." }
    escalera:
      - "La de arranque es la pesada y robusta; la de décadas, la de los contadores."
    solucion: "Décadas, tionilo; densidad, litio-ion; vida, LiFePO₄; arranque, plomo; ciclos, supercondensador."

  - id: tionilo-picos
    tipo: pregunta
    titulo: "Veinte años en un contador"
    texto: "Un sensor industrial usa litio-cloruro de tionilo, que entrega poca corriente. ¿Qué hay que añadirle?"
    libro: [33]
    widget:
      tipo: figura
      figura: fig-39.5
      zonas:
        - { id: tabla, rotulo: "Tabla de la derecha", rect: [260, 0, 187, 220] }
    opciones:
      - texto: "Un condensador para los picos de transmisión"
        bien: true
        porque: "La pila carga el condensador despacio y el condensador entrega el pico al transmitir."
      - texto: "Un cargador"
        porque: "Es una primaria: no se recarga. Lo que le falta es corriente de pico."
      - texto: "Nada: su densidad de energía lo cubre todo"
        porque: "Tiene mucha energía, pero entrega poca corriente: los picos no los aguanta sola."
    escalera:
      - "Su limitación no es la energía, sino la corriente que puede dar de golpe."
    solucion: "Un condensador que cubra los picos de transmisión."

  - id: efecto-memoria
    tipo: pregunta
    titulo: "El efecto memoria"
    texto: "Una NiCd descargada siempre hasta el mismo punto muestra un escalón de tensión ahí. ¿Cómo se corrige?"
    libro: [38]
    widget:
      tipo: figura
      figura: fig-39.5
      zonas:
        - { id: alcalina, rotulo: "Curva de abajo", rect: [50, 135, 150, 36] }
    opciones:
      - texto: "Con uno o dos ciclos de descarga completa hasta 1,0 V por célula"
        bien: true
        porque: "Es reversible así, y nunca descargando a cero: invertir una célula de un pack la daña."
      - texto: "Descargándola del todo, hasta cero"
        porque: "A cero no: invertir una célula de un pack la daña. Se para en 1,0 V por célula."
      - texto: "No se corrige: la célula queda dañada"
        porque: "Es reversible con uno o dos ciclos de descarga completa."
    escalera:
      - "Es reversible, pero hay un límite que no se debe pasar."
    solucion: "Uno o dos ciclos de descarga completa, hasta 1,0 V por célula y nunca a cero."

  - id: toque-arranque
    tipo: tocar
    titulo: "La batería de arranque"
    texto: "Toque la batería cuyo nicho es el arranque y el respaldo estacionario: barata, robusta y pesada."
    libro: [36, 56]
    widget:
      tipo: figura
      figura: fig-39.6
      zonas:
        - { id: cilindrica, rotulo: "Celda verde alta, a la izquierda", rect: [30, 55, 125, 455] }
        - { id: aa, rotulo: "Pila mediana, a la izquierda", rect: [140, 165, 125, 330] }
        - { id: bolsa, rotulo: "Paquete plateado, en el centro", rect: [380, 40, 330, 470] }
        - { id: plomo, rotulo: "Caja negra, a la derecha", rect: [930, 40, 530, 450] }
    tocar:
      bien: [plomo]
      porque:
        cilindrica: "Es una celda de ion-litio 18650: densidad alta, pero exige control estricto."
        aa: "Es una alcalina: barata, pero de resistencia interna alta."
        bolsa: "Es de polímero de litio en bolsa: ligera, no la de arranque."
    exito: "La de plomo-ácido sellada de 12 V: tolera corrientes altas, pero no la descarga profunda."
    escalera:
      - "Busque la más pesada de las cuatro."
    solucion: "La caja negra: plomo-ácido sellada (VRLA) de 12 V."

  - id: zinc-aire
    tipo: pregunta
    titulo: "La pila del audífono"
    texto: "La zinc-aire tiene la mayor densidad de todas. ¿Qué la distingue al usarla?"
    libro: [34]
    widget:
      tipo: figura
      figura: fig-39.6
      zonas:
        - { id: aa, rotulo: "Pila mediana, a la izquierda", rect: [140, 165, 125, 330] }
    opciones:
      - texto: "Empieza a agotarse en cuanto se abre, se use o no"
        bien: true
        porque: "Así es: abrirla la pone en marcha, esté o no en uso."
      - texto: "Que se puede recargar muchas veces"
        porque: "No es una secundaria: es una primaria de densidad muy alta."
      - texto: "Que dura décadas guardada"
        porque: "Esa es la litio-tionilo; la zinc-aire se agota en cuanto se abre."
    escalera:
      - "Su nombre dice qué necesita para funcionar."
    solucion: "Se agota en cuanto se abre, esté o no en uso."

  - id: lfp-cuando
    tipo: pregunta
    titulo: "Cuándo LiFePO₄"
    texto: "La LiFePO₄ tiene menos densidad que el ion-litio. ¿Cuándo es la elección?"
    libro: [40]
    widget:
      tipo: figura
      figura: fig-39.5
      zonas:
        - { id: lfp, rotulo: "Curva del medio", rect: [50, 64, 150, 35] }
    opciones:
      - texto: "Cuando la seguridad y la longevidad importan más que el peso"
        bien: true
        porque: "Da miles de ciclos y no entra en fuga térmica con facilidad."
      - texto: "Cuando hay que estimar la carga por tensión"
        porque: "Al revés: su meseta, aún más plana, lo hace más difícil."
      - texto: "Cuando el peso es lo que más importa"
        porque: "Entonces gana el ion-litio, de más densidad de energía."
    escalera:
      - "¿Qué gana a cambio de su menor densidad?"
    solucion: "Cuando la seguridad y la vida importan más que el peso."

  - id: banco-rodilla
    tipo: pregunta
    titulo: "Una tarde de medida"
    texto: "Se descarga una celda a corriente constante registrando la tensión. ¿Qué dice el punto de rodilla de la curva?"
    libro: [52]
    widget:
      tipo: figura
      figura: fig-39.5
      zonas:
        - { id: liion, rotulo: "Curva de arriba", rect: [50, 28, 150, 35] }
    opciones:
      - texto: "Dónde hay que cortar la descarga"
        bien: true
        porque: "Pasada la rodilla la tensión cae en picado: ahí se corta."
      - texto: "La capacidad nominal del fabricante"
        porque: "La curva da la capacidad real, que es lo que interesa; la rodilla marca el corte."
      - texto: "La tensión nominal"
        porque: "La nominal es la de la meseta; la rodilla está al final."
    escalera:
      - "Mire qué hace la tensión justo después de la rodilla."
    solucion: "El punto donde hay que cortar la descarga."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [44, 45, 47, 49]
    ideas:
      - { titulo: "Primarias y secundarias.", texto: "La química fija tensión, densidad, vida y comportamiento." }
      - { titulo: "La curva decide.", texto: "La alcalina cae de 1,5 a 0,9 V; el litio es casi plano hasta el final." }
      - { titulo: "Culombios.", texto: "En litio la carga se estima integrando la corriente, no por tensión." }
      - { titulo: "Sin química mejor.", texto: "Cada prioridad elige la suya: décadas, densidad, vida, arranque o ciclos." }
