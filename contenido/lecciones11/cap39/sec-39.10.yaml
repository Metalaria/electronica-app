# Lección 1.2 de la sección 40.10 «Transporte y Seguridad de las Baterías de Litio» (cap39; sec-39.N = impresas 40.N).
# - La fuga térmica y las reglas sobre la figura 40.19 (fig-39.19), con zonas en cada recuadro; la foto 40.18 de la
#   batería hinchada.
# - Sin modelo numérico: la sección es de reglas.
# Paso práctico: «tocar» el recuadro de qué hacer si una celda arde.
# El bloque 346 descarta una celda «por debajo de 1,5 V», y la figura 40.19 dice lo mismo desde la errata 4.1.2, N
# (antes decía 2,5 V, el corte de descarga).
# 1.2.1 (autor121-pot, «aprender haciendo», GUIA §13): sección de reglas; se deja una celda lista para guardar (objetivo
# sobre el rango del 40-60 % y los terminales) y se localiza en la figura 40.19 el paso que realimenta el lazo y la regla que corresponde a cada situación (cinco «tocar»).
# Quedan dos preguntas (por qué no se sofoca y la batería hinchada); el avión y la soldadura, al resumen.
leccion: cap39/sec-39.10

libro:
  315: "el proceso se realimenta hasta la destrucción con emisión de gases inflamables"
  317: "Sobrecarga, superando la tensión de corte"
  318: "Cortocircuito externo, con corrientes enormes."
  321: "Daño mecánico: perforación o aplastamiento"
  322: "la reacción genera su propio oxígeno, con lo que sofocarla no funciona"
  325: "Nunca cargar una celda hinchada"
  328: "Se usan soldadura por puntos o celdas con lengüetas."
  313: "almacena mucha energía en poco volumen, y eso la hace útil y potencialmente peligrosa"
  330: "Al 40-60 % de carga"
  332: "En recipiente no inflamable si son celdas sueltas, y con los terminales protegidos."
  "cap39#298": "la autodescarga puede llevarla por debajo del umbral de seguridad"
  333: "Nunca en un bolsillo con llaves o monedas"
  "cap39#190": "muchas celdas 18650 sueltas del mercado no llevan protección"
  336: "las de repuesto en cabina y nunca facturadas"
  339: "Las dañadas o hinchadas no se pueden transportar por vía aérea en absoluto."
  341: "contienen materiales recuperables y son un riesgo de incendio en la cadena de residuos"
  342: "buena parte de los incendios en plantas de tratamiento de residuos tienen como origen baterías desechadas incorrectamente"
  343: "Se llevan a puntos limpios o a los contenedores específicos, con los terminales aislados."
  345: "una caja metálica o de cerámica donde dejar las celdas mientras se cargan o se prueban"
  346: "Una celda muy descargada —por debajo de 1,5 V— o con resistencia interna anormalmente alta debe descartarse, no recuperarse."
  347: "La fuga térmica y las reglas de manipulación, almacenamiento y transporte."
  "cap39#310": "Se retira sin perforarla y sin volver a cargarla."

modelo:
  valores:
    carga: { sim: "SoC", nombre: "estado de carga", unidad: "%", valor: 100 }
    aislado: { tipo: interruptor, nombre: "terminales aislados", valor: 0 }
  calculos:
    rango: { expr: "ceil(max(0, (carga - 40)*(60 - carga + 0.001))/1e9)", sim: "SoC ok", nombre: "carga en el rango de almacenamiento", unidad: "" }

tarjetas:
  - id: explore-guardar
    tipo: explorar
    titulo: "Lista para guardar"
    texto: "Mucha energía en poco volumen: útil y peligrosa. Deje esta celda suelta lista para guardarla."
    libro: [313, 330, 332, "cap39#298"]
    inicio: { carga: 100, aislado: 0 }
    widget:
      tipo: grafica
      x: { id: cg, min: 0, max: 100, unidad: "%", rotulo: "Estado de carga" }
      y: { min: 0, max: 1.2, unidad: "", rotulo: "Rango de almacenamiento" }
      curvas:
        - { expr: "ceil(max(0, (cg - 40)*(60 - cg + 0.001))/1e9)", color: verde, rotulo: "rango recomendado" }
      marcas:
        - { x: "carga", y: "rango", rotulo: "{{carga}}" }
      mandos:
        - { valor: carga, lista: [0, 50, 100], nombres: ["vacía", "a medias", "llena"], rotulo: "Estado de carga" }
        - { valor: aislado, tipo: interruptor, rotulo: "Terminales aislados" }
    objetivo:
      condiciones:
        - { valor: rango, min: 1, rotulo: "Carga: {{carga}}" }
        - { valor: aislado, min: 1, rotulo: "Terminales" }
      logrado: "Al {{carga}}, ni llena ni vacía, y con los terminales protegidos: así se guarda una celda suelta."
      pistas:
        - { cuando: { valor: carga, mayor: 60 }, texto: "Llena, el envejecimiento calendario es mucho mayor." }
        - { cuando: { valor: carga, menor: 40 }, texto: "Vacía, la autodescarga puede llevarla por debajo del umbral de seguridad." }
        - { texto: "Falta proteger los terminales: una celda suelta se cortocircuita con cualquier cosa metálica." }
    escalera:
      - "No llena ni vacía; y una celda suelta, con los terminales protegidos."
    solucion: "A medias y con los terminales aislados."
    comprobar:
      - { con: { carga: 50 }, rango: 1 }
      - { con: { carga: 100 }, rango: 0 }

  - id: toque-lazo
    tipo: tocar
    titulo: "Se realimenta"
    texto: "Si una celda se calienta lo suficiente, el proceso ya no se para solo. Toque el paso que vuelve a calentarla."
    libro: [315, 317, 321, 347]
    widget:
      tipo: figura
      figura: fig-39.19
      zonas:
        - { id: causas, rotulo: "Recuadro de la izquierda", rect: [3, 21, 92, 88] }
        - { id: calienta, rotulo: "Recuadro de arriba del lazo", rect: [128, 16, 69, 36] }
        - { id: reacciones, rotulo: "Recuadro de la derecha del lazo", rect: [165, 72, 66, 36] }
        - { id: calor, rotulo: "Recuadro de la izquierda del lazo", rect: [97, 72, 64, 36] }
    tocar:
      bien: [calor]
      porque:
        causas: "Son los desencadenantes, desde fuera: sobrecarga, cortocircuitos, temperatura o daño mecánico."
        calienta: "Ese es el punto de partida; lo que cierra el lazo viene después."
        reacciones: "Las reacciones internas son las que dan el calor, pero el paso siguiente es el que vuelve atrás."
    exito: "Las reacciones dan más calor y gases inflamables, y el proceso se realimenta hasta la destrucción."
    escalera:
      - "Siga las flechas: ¿cuál vuelve a la celda que se calienta?"
    solucion: "Más calor y gases: la flecha vuelve a calentar la celda."

  - id: toque-arde
    tipo: tocar
    titulo: "Si una celda arde"
    texto: "Toque el recuadro que dice qué hacer si una celda de litio entra en fuga térmica."
    libro: [322]
    widget:
      tipo: figura
      figura: fig-39.19
      zonas:
        - { id: causas, rotulo: "Recuadro de arriba a la izquierda", rect: [3, 21, 92, 88] }
        - { id: sofocar, rotulo: "Recuadro rojo de abajo", rect: [3, 118, 225, 50] }
        - { id: banco, rotulo: "Recuadro azul", rect: [3, 175, 225, 62] }
        - { id: manipular, rotulo: "Recuadro verde de arriba", rect: [238, 21, 213, 74] }
    tocar:
      bien: [sofocar]
      porque:
        causas: "Ahí están los desencadenantes: sirven para prevenir, no para apagarla."
        banco: "Es la precaución al cargar y probar, antes de que pase nada."
        manipular: "Son reglas para que no empiece."
    exito: "Genera su propio oxígeno: sofocarla no sirve. Enfriar con mucha agua, o aislarla y dejar que se consuma."
    escalera:
      - "Busque el que habla del oxígeno."
    solucion: "El recuadro rojo de abajo: no se puede sofocar."

  - id: por-que-agua
    tipo: porque
    titulo: "Ni manta ni tapa"
    texto: "Tapar una celda que arde no la apaga. ¿Por qué?"
    libro: [322]
    widget:
      tipo: figura
      figura: fig-39.19
      zonas:
        - { id: sofocar, rotulo: "Recuadro rojo de abajo", rect: [3, 118, 225, 50] }
    opciones:
      - texto: "La reacción genera su propio oxígeno"
        bien: true
        porque: "No necesita el aire: lo que funciona es enfriar con mucha agua, o aislarla."
      - texto: "Porque el litio no arde"
        porque: "Arde, y emite gases inflamables."
      - texto: "Porque el fuego es eléctrico"
        porque: "El problema es químico: la reacción se da a sí misma el oxígeno."
    escalera:
      - "¿Qué le quita al fuego una tapa?"
    solucion: "Genera su propio oxígeno: sofocarla no funciona."

  - id: bolsillo
    tipo: tocar
    titulo: "En el bolsillo"
    texto: "Una 18650 suelta, sin protección, va en un bolsillo con las llaves. Toque la regla que lo prohíbe."
    libro: [318, 333, "cap39#190"]
    widget:
      tipo: figura
      figura: fig-39.19
      zonas:
        - { id: causas, rotulo: "Recuadro de arriba a la izquierda", rect: [3, 21, 92, 88] }
        - { id: manipular, rotulo: "Recuadro verde de arriba", rect: [238, 21, 213, 74] }
        - { id: guardar, rotulo: "Recuadro verde del medio", rect: [238, 103, 213, 68] }
        - { id: reciclaje, rotulo: "Recuadro naranja", rect: [238, 175, 213, 62] }
    tocar:
      bien: [guardar]
      porque:
        causas: "Ahí está el riesgo, el cortocircuito externo; la regla que lo evita está en otro sitio."
        manipular: "Son reglas sobre perforar, cargar y soldar, no sobre llevarla encima."
        reciclaje: "Es para cuando se desecha."
    exito: "Terminales aislados: unas llaves entre los polos son un cortocircuito externo, con corrientes enormes."
    escalera:
      - "¿Qué pueden unir unas llaves entre los dos polos?"
    solucion: "Almacenamiento y transporte: terminales aislados, nunca con llaves o monedas."

  - id: hinchada
    tipo: pregunta
    titulo: "Una batería hinchada"
    texto: "La batería de un teléfono está hinchada y ha deformado la carcasa. ¿Qué se hace?"
    libro: [325, "cap39#310"]
    widget:
      tipo: figura
      figura: fig-39.18
      zonas:
        - { id: foto, rotulo: "La foto", rect: [0, 0, 1411, 900] }
    opciones:
      - texto: "Se retira sin perforarla y sin volver a cargarla"
        bien: true
        porque: "Los gases internos dicen que ya está dañada; luego, al punto limpio con los terminales aislados."
      - texto: "Se pincha para sacar el gas y se vuelve a usar"
        porque: "Perforarla crea un cortocircuito interno: nunca."
      - texto: "Se carga a poca corriente para recuperarla"
        porque: "Nunca se carga una celda hinchada."
    escalera:
      - "Hinchada quiere decir gases internos: la celda ya está dañada."
    solucion: "Se retira, sin perforarla ni cargarla, y se lleva a un punto de recogida."

  - id: banco-descartar
    tipo: tocar
    titulo: "Antes de usarla"
    texto: "Una celda recuperada marca muy poca tensión, por debajo de 1,5 V. Toque lo que dice la figura que se haga con ella."
    libro: [345, 346]
    widget:
      tipo: figura
      figura: fig-39.19
      zonas:
        - { id: sofocar, rotulo: "Recuadro rojo de abajo", rect: [3, 118, 225, 50] }
        - { id: banco, rotulo: "Recuadro azul", rect: [3, 175, 225, 62] }
        - { id: manipular, rotulo: "Recuadro verde de arriba", rect: [238, 21, 213, 74] }
        - { id: guardar, rotulo: "Recuadro verde del medio", rect: [238, 103, 213, 68] }
    tocar:
      bien: [banco]
      porque:
        sofocar: "Es para cuando ya arde; esta todavía no."
        manipular: "Reglas generales; la de la celda muy descargada es una comprobación de banco."
        guardar: "Guardarla no la arregla: tan descargada, es peligrosa."
    exito: "Se descarta, no se recupera; igual con resistencia interna anormalmente alta."
    escalera:
      - "Es una comprobación que se hace en el banco antes de usarla."
    solucion: "El recuadro azul: por debajo de 1,5 V, se descarta."

  - id: reciclar
    tipo: tocar
    titulo: "Al final"
    texto: "Una pila de litio agotada va camino de la bolsa de basura. Toque la regla que lo impide."
    libro: [341, 342, 343]
    widget:
      tipo: figura
      figura: fig-39.19
      zonas:
        - { id: banco, rotulo: "Recuadro azul", rect: [3, 175, 225, 62] }
        - { id: guardar, rotulo: "Recuadro verde del medio", rect: [238, 103, 213, 68] }
        - { id: reciclaje, rotulo: "Recuadro naranja", rect: [238, 175, 213, 62] }
    tocar:
      bien: [reciclaje]
      porque:
        banco: "Es para cargar y probar celdas, no para desecharlas."
        guardar: "Guardarla al 40-60 % es para seguir usándola."
    exito: "Buena parte de los incendios en plantas de residuos empiezan así: al punto limpio, con los terminales aislados."
    escalera:
      - "Busque el recuadro de lo que pasa al final."
    solucion: "El recuadro naranja: nunca a la basura."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [315, 322, 328, 330, 336, 339, 346]
    ideas:
      - { titulo: "Fuga térmica.", texto: "Un lazo de calor que se realimenta; genera su propio oxígeno." }
      - { titulo: "Manipular.", texto: "Ni perforar, ni cargar hinchada o bajo cero, ni soldar sobre la celda: soldadura por puntos o lengüetas." }
      - { titulo: "Guardar y viajar.", texto: "Al 40-60 %, en fresco, aislada; en avión, las de repuesto en cabina y nunca facturadas. Las hinchadas no vuelan." }
      - { titulo: "Descartar.", texto: "Por debajo de 1,5 V o con resistencia anormal, no se recupera." }
