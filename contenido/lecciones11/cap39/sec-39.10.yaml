# Lección 1.2 de la sección 40.10 «Transporte y Seguridad de las Baterías de Litio» (cap39; sec-39.N = impresas 40.N).
# - La fuga térmica y las reglas sobre la figura 40.19 (fig-39.19), con zonas en cada recuadro; la foto 40.18 de la
#   batería hinchada.
# - Sin modelo numérico: la sección es de reglas.
# Paso práctico: «tocar» el recuadro de qué hacer si una celda arde.
# El bloque 346 descarta una celda «por debajo de 1,5 V», y la figura 40.19 dice lo mismo desde la errata 4.1.2, N
# (antes decía 2,5 V, el corte de descarga).
leccion: cap39/sec-39.10

libro:
  315: "el proceso se realimenta hasta la destrucción con emisión de gases inflamables"
  317: "Sobrecarga, superando la tensión de corte"
  321: "Daño mecánico: perforación o aplastamiento"
  322: "la reacción genera su propio oxígeno, con lo que sofocarla no funciona"
  325: "Nunca cargar una celda hinchada"
  328: "Se usan soldadura por puntos o celdas con lengüetas."
  330: "Al 40-60 % de carga"
  333: "Nunca en un bolsillo con llaves o monedas"
  "cap39#190": "muchas celdas 18650 sueltas del mercado no llevan protección"
  336: "las de repuesto en cabina y nunca facturadas"
  339: "Las dañadas o hinchadas no se pueden transportar por vía aérea en absoluto."
  342: "buena parte de los incendios en plantas de tratamiento de residuos tienen como origen baterías desechadas incorrectamente"
  345: "una caja metálica o de cerámica donde dejar las celdas mientras se cargan o se prueban"
  346: "Una celda muy descargada —por debajo de 1,5 V— o con resistencia interna anormalmente alta debe descartarse, no recuperarse."
  347: "La fuga térmica y las reglas de manipulación, almacenamiento y transporte."
  "cap39#310": "Se retira sin perforarla y sin volver a cargarla."

modelo: { valores: {}, calculos: {} }

tarjetas:
  - id: explore-fuga
    tipo: explorar
    titulo: "La fuga térmica"
    texto: "Mucha energía en poco volumen: útil y peligrosa. Toque el lazo y las reglas que salen de él."
    libro: [315, 317, 321, 322, 330, 347]
    widget:
      tipo: figura
      figura: fig-39.19
      zonas:
        - { id: lazo, rotulo: "El lazo de flechas", rect: [98, 20, 130, 85], texto: "Si la celda se calienta lo bastante, sus reacciones dan más calor, y el proceso se realimenta hasta destruirla." }
        - { id: causas, rotulo: "Recuadro de arriba a la izquierda", rect: [3, 21, 92, 88], texto: "Sobrecarga, cortocircuito externo o interno, temperatura excesiva y daño mecánico." }
        - { id: manipular, rotulo: "Recuadro verde de arriba", rect: [238, 21, 213, 74], texto: "Nunca perforar, cargar hinchada, cargar bajo cero, dejar sin vigilancia ni soldar sobre la celda." }
        - { id: guardar, rotulo: "Recuadro verde del medio", rect: [238, 103, 213, 68], texto: "Al 40-60 %, en fresco, con los terminales aislados; en avión, en cabina." }
    requiere: { mover: [lazo, causas] }

  - id: ordene-lazo
    tipo: pregunta
    titulo: "Se realimenta"
    texto: "Ordene la fuga térmica desde que la celda se calienta."
    libro: [315]
    widget:
      tipo: figura
      figura: fig-39.19
      zonas:
        - { id: lazo, rotulo: "El lazo de flechas", rect: [98, 20, 130, 85] }
    ordenar:
      - "La celda se calienta lo suficiente."
      - "Empiezan reacciones internas."
      - "Generan más calor y gases inflamables."
      - "La celda se calienta aún más, hasta destruirse."
    exito: "Un lazo que se realimenta: por eso hay que evitar que empiece."
    pistas:
      - { texto: "Las reacciones vienen después del calor, y dan más calor." }
    escalera:
      - "Todo empieza por la temperatura."
    solucion: "Calor, reacciones, más calor y gases, y otra vez, hasta la destrucción."

  - id: toque-arde
    tipo: tocar
    titulo: "Si una celda arde"
    texto: "Toque el recuadro que dice qué hacer si una celda de litio entra en fuga térmica."
    libro: [322]
    widget:
      tipo: figura
      figura: fig-39.19
      zonas:
        - { id: causas, rotulo: "Recuadro de arriba a la izquierda", rect: [3, 21, 92, 88] }
        - { id: sofocar, rotulo: "Recuadro rojo de abajo", rect: [3, 118, 225, 50] }
        - { id: banco, rotulo: "Recuadro azul", rect: [3, 175, 225, 62] }
        - { id: manipular, rotulo: "Recuadro verde de arriba", rect: [238, 21, 213, 74] }
    tocar:
      bien: [sofocar]
      porque:
        causas: "Ahí están los desencadenantes: sirven para prevenir, no para apagarla."
        banco: "Es la precaución al cargar y probar, antes de que pase nada."
        manipular: "Son reglas para que no empiece."
    exito: "Genera su propio oxígeno: sofocarla no sirve. Enfriar con mucha agua, o aislarla y dejar que se consuma."
    escalera:
      - "Busque el que habla del oxígeno."
    solucion: "El recuadro rojo de abajo: no se puede sofocar."

  - id: por-que-agua
    tipo: porque
    titulo: "Ni manta ni tapa"
    texto: "Tapar una celda que arde no la apaga. ¿Por qué?"
    libro: [322]
    widget:
      tipo: figura
      figura: fig-39.19
      zonas:
        - { id: sofocar, rotulo: "Recuadro rojo de abajo", rect: [3, 118, 225, 50] }
    opciones:
      - texto: "La reacción genera su propio oxígeno"
        bien: true
        porque: "No necesita el aire: lo que funciona es enfriar con mucha agua, o aislarla."
      - texto: "Porque el litio no arde"
        porque: "Arde, y emite gases inflamables."
      - texto: "Porque el fuego es eléctrico"
        porque: "El problema es químico: la reacción se da a sí misma el oxígeno."
    escalera:
      - "¿Qué le quita al fuego una tapa?"
    solucion: "Genera su propio oxígeno: sofocarla no funciona."

  - id: soldar
    tipo: pregunta
    titulo: "Unir celdas cilíndricas"
    texto: "Hay que unir varias celdas cilíndricas en un pack. ¿Cómo?"
    libro: [328]
    widget:
      tipo: figura
      figura: fig-39.19
      zonas:
        - { id: manipular, rotulo: "Recuadro verde de arriba", rect: [238, 21, 213, 74] }
    opciones:
      - texto: "Con soldadura por puntos, o con celdas con lengüetas"
        bien: true
        porque: "Así el calor no daña la celda."
      - texto: "Con el soldador, directamente sobre la celda"
        porque: "El calor del soldador daña la celda: nunca directamente."
      - texto: "Con cinta adhesiva y presión"
        porque: "No es una unión fiable; el libro indica soldadura por puntos o lengüetas."
    escalera:
      - "¿Qué le hace a la celda el calor de un soldador?"
    solucion: "Soldadura por puntos o celdas con lengüetas."

  - id: bolsillo
    tipo: pregunta
    titulo: "En el bolsillo"
    texto: "Una 18650 suelta va en un bolsillo con las llaves. ¿Cuál es el riesgo?"
    libro: [333, "cap39#190"]
    widget:
      tipo: figura
      figura: fig-39.19
      zonas:
        - { id: guardar, rotulo: "Recuadro verde del medio", rect: [238, 103, 213, 68] }
    opciones:
      - texto: "Un cortocircuito externo, con corrientes enormes"
        bien: true
        porque: "Es una situación real y peligrosa: por eso los terminales van protegidos."
      - texto: "Ninguno: la celda lleva protección"
        porque: "Muchas 18650 sueltas no la llevan."
      - texto: "Que se descarga un poco"
        porque: "El problema no es la carga perdida: es el cortocircuito y el calor."
    escalera:
      - "¿Qué pueden unir unas llaves entre los dos polos?"
    solucion: "Un cortocircuito externo: terminales aislados y nunca con llaves o monedas."

  - id: avion
    tipo: pregunta
    titulo: "En el avión"
    texto: "Viaja en avión con baterías de repuesto. ¿Dónde van?"
    libro: [336, 339]
    widget:
      tipo: figura
      figura: fig-39.19
      zonas:
        - { id: guardar, rotulo: "Recuadro verde del medio", rect: [238, 103, 213, 68] }
    opciones:
      - texto: "En cabina, nunca facturadas, con los terminales aislados"
        bien: true
        porque: "En cabina un incidente es detectable y atendible."
      - texto: "Facturadas, lejos de los pasajeros"
        porque: "Al revés: en la bodega un incidente no se detecta ni se atiende."
      - texto: "Donde sea, si están hinchadas pero cargadas"
        porque: "Las dañadas o hinchadas no se pueden transportar por vía aérea en absoluto."
    escalera:
      - "¿Dónde se puede ver y atender un incidente?"
    solucion: "En cabina y nunca facturadas; las dañadas, no viajan."

  - id: hinchada
    tipo: pregunta
    titulo: "Una batería hinchada"
    texto: "La batería de un teléfono está hinchada y ha deformado la carcasa. ¿Qué se hace?"
    libro: [325, "cap39#310"]
    widget:
      tipo: figura
      figura: fig-39.18
      zonas:
        - { id: foto, rotulo: "La foto", rect: [0, 0, 1411, 900] }
    opciones:
      - texto: "Se retira sin perforarla y sin volver a cargarla"
        bien: true
        porque: "Los gases internos dicen que ya está dañada; luego, al punto limpio con los terminales aislados."
      - texto: "Se pincha para sacar el gas y se vuelve a usar"
        porque: "Perforarla crea un cortocircuito interno: nunca."
      - texto: "Se carga a poca corriente para recuperarla"
        porque: "Nunca se carga una celda hinchada."
    escalera:
      - "Hinchada quiere decir gases internos: la celda ya está dañada."
    solucion: "Se retira, sin perforarla ni cargarla, y se lleva a un punto de recogida."

  - id: banco-descartar
    tipo: pregunta
    titulo: "Antes de usarla"
    texto: "Una celda recuperada marca muy poca tensión, por debajo de 1,5 V. ¿Qué se hace con ella?"
    libro: [345, 346]
    widget:
      tipo: figura
      figura: fig-39.19
      zonas:
        - { id: banco, rotulo: "Recuadro azul", rect: [3, 175, 225, 62] }
    opciones:
      - texto: "Se descarta: no se recupera"
        bien: true
        porque: "Tan descargada, o con resistencia interna anormalmente alta, es una celda peligrosa."
      - texto: "Se recarga despacio en una caja metálica"
        porque: "La caja es para cargar y probar celdas sanas; esta se descarta."
      - texto: "Se recarga con un cargador con modo de recuperación"
        porque: "Ese modo es para un pack cortado por su BMS, no para una celda por debajo de 1,5 V."
    escalera:
      - "¿Se recupera una celda muy descargada, o se descarta?"
    solucion: "Se descarta, no se recupera."

  - id: reciclar
    tipo: pregunta
    titulo: "Al final"
    texto: "Una pila de litio agotada. ¿Por qué no va a la basura?"
    libro: [342]
    widget:
      tipo: figura
      figura: fig-39.19
      zonas:
        - { id: reciclaje, rotulo: "Recuadro naranja", rect: [238, 175, 213, 62] }
    opciones:
      - texto: "Provoca incendios en la cadena de residuos"
        bien: true
        porque: "Buena parte de los incendios en plantas de residuos empiezan así; y sus materiales se recuperan."
      - texto: "Solo por los materiales valiosos"
        porque: "También, pero además son un riesgo de incendio en la cadena de residuos."
      - texto: "Porque contamina el agua"
        porque: "El riesgo que destaca el libro es el incendio en las plantas de residuos."
    escalera:
      - "¿Qué puede hacer una celda aplastada en un camión de basura?"
    solucion: "Por el riesgo de incendio en la cadena de residuos: al punto limpio, con los terminales aislados."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [315, 322, 330, 336, 346]
    ideas:
      - { titulo: "Fuga térmica.", texto: "Un lazo de calor que se realimenta; genera su propio oxígeno." }
      - { titulo: "Manipular.", texto: "Ni perforar, ni cargar hinchada o bajo cero, ni soldar sobre la celda." }
      - { titulo: "Guardar y viajar.", texto: "Al 40-60 %, en fresco, aislada; en avión, en cabina." }
      - { titulo: "Descartar.", texto: "Por debajo de 1,5 V o con resistencia anormal, no se recupera." }
