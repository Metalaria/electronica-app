# Lección 1.2 de la sección 40.5 «Carga del Li-ion: CC-CV» (cap39; etiquetas sec-39.N = impresas 40.N).
# - Las cuatro fases sobre la figura 40.11 (fig-39.11), con zonas en cada fase; la figura 40.10 (fig-39.10) como apoyo.
# - Sin modelo de la carga: la sección da las fases con fracciones de C y porcentajes aproximados, que se citan.
# Paso práctico: «banco» del bloque 163: registrar una carga completa con un cargador propio y anotar la tensión
# máxima de la celda; debe quedar en 4,20 V ± 50 mV (bloque 139), y por encima de 4,25 V el cargador no sirve.
leccion: cap39/sec-39.5

libro:
  138: "ese depósito forma dendritas que pueden perforar el separador"
  139: "4,20 V por celda con una tolerancia de ±50 mV"
  141: "Se aplica una corriente pequeña (0,05 a 0,1 C) hasta superar ese umbral"
  142: "En esta fase entra en torno al 80 % de la capacidad"
  143: "la corriente empieza a decaer exponencialmente por sí sola"
  144: "no se hace carga de mantenimiento"
  146: "0 a 45 °C"
  147: "cargar por debajo de 0 °C produce depósito de litio metálico"
  150: "~85 %"
  151: "se renuncia a un 20 % de autonomía a cambio de multiplicar la vida por tres o cuatro"
  158: "Es lo que hacen los medidores de combustible integrados"
  160: "Un cargador de litio no es una fuente ajustada a 4,2 V"
  161: "Los integrados de carga cuestan poco y traen todo lo anterior verificado"
  163: "Si la tensión sobrepasa 4,25 V en algún momento, el cargador no sirve"
  165: "Las cuatro fases de la carga CC-CV de una celda de litio"

modelo:
  valores:
    V_c: { sim: "V_{carga}", nombre: "tensión de carga", unidad: V, valor: 4.2 }
  calculos:
    V_max: { expr: "V_c + 0.05", sim: "V", nombre: "tolerancia por arriba", unidad: V }

tarjetas:
  - id: explore-fases
    tipo: explorar
    titulo: "Cuatro fases"
    texto: "La carga de litio es un procedimiento estricto. Toque las cuatro fases."
    libro: [141, 142, 143, 144, 165]
    widget:
      tipo: figura
      figura: fig-39.11
      zonas:
        - { id: precarga, rotulo: "Primera franja", rect: [31, 5, 34, 190], texto: "Precarga: por debajo de unos 2,8 V, una corriente pequeña, de 0,05 a 0,1 C." }
        - { id: cc, rotulo: "Segunda franja", rect: [65, 5, 152, 190], texto: "Corriente constante, de 0,5 a 1 C: la tensión sube y entra en torno al 80 %." }
        - { id: cv, rotulo: "Tercera franja", rect: [219, 5, 145, 190], texto: "Tensión constante en 4,20 V: la corriente decae sola. Completa el 20 % restante, despacio." }
        - { id: corte, rotulo: "Cuarta franja", rect: [365, 5, 52, 190], texto: "Corte: la corriente baja de 0,05 a 0,1 C y la carga termina." }
    requiere: { mover: [cc, cv] }

  - id: toque-80
    tipo: tocar
    titulo: "Dónde entra casi todo"
    texto: "Toque la fase en la que entra en torno al 80 % de la capacidad."
    libro: [142, 143]
    widget:
      tipo: figura
      figura: fig-39.11
      zonas:
        - { id: precarga, rotulo: "Primera franja", rect: [31, 5, 34, 190] }
        - { id: cc, rotulo: "Segunda franja", rect: [65, 5, 152, 190] }
        - { id: cv, rotulo: "Tercera franja", rect: [219, 5, 145, 190] }
        - { id: corte, rotulo: "Cuarta franja", rect: [365, 5, 52, 190] }
    tocar:
      bien: [cc]
      porque:
        precarga: "La precarga solo saca la celda de la descarga profunda, con muy poca corriente."
        cv: "La tensión constante completa el 20 % restante, y despacio."
        corte: "En el corte ya no entra carga: la carga ha terminado."
    exito: "La corriente constante: su duración la dicta la corriente elegida."
    escalera:
      - "Busque la fase con la corriente alta y fija."
    solucion: "La segunda, corriente constante: en torno al 80 %."

  - id: en-4v2
    tipo: pregunta
    titulo: "Al llegar a 4,20 V"
    texto: "La celda llega a 4,20 V durante la carga. ¿Qué hace el cargador?"
    libro: [143]
    widget:
      tipo: figura
      figura: fig-39.11
      zonas:
        - { id: cv, rotulo: "Tercera franja", rect: [219, 5, 145, 190] }
    opciones:
      - texto: "Mantiene la tensión fija y deja que la corriente decaiga sola"
        bien: true
        porque: "Es la fase de tensión constante: la corriente cae exponencialmente por sí sola."
      - texto: "Sigue con la misma corriente hasta llenarla"
        porque: "Pasaría de 4,20 V: el límite no admite margen."
      - texto: "Corta en ese momento"
        porque: "Faltaría el 20 % restante: el corte llega cuando la corriente cae a 0,05–0,1 C."
    escalera:
      - "El límite de tensión no admite margen: ¿qué no puede seguir subiendo?"
    solucion: "Fija la tensión en 4,20 V; la corriente decae sola hasta el corte."

  - id: por-que-estricto
    tipo: porque
    titulo: "Sin margen"
    texto: "El plomo tolera algo de sobrecarga. ¿Por qué el litio no admite pasar de 4,20 V ± 50 mV?"
    libro: [138, 139]
    widget:
      tipo: figura
      figura: fig-39.11
      zonas:
        - { id: tolerancia, rotulo: "Franja de arriba", rect: [31, 30, 386, 36] }
    opciones:
      - texto: "Se deposita litio metálico que forma dendritas y puede cortocircuitar la celda"
        bien: true
        porque: "Las dendritas perforan el separador: un cortocircuito interno, con el resultado conocido."
      - texto: "Porque el exceso se convierte en calor y agua"
        porque: "Eso le pasa al plomo o al níquel, que lo toleran. En el litio el daño es otro."
      - texto: "Porque se reduce algo la capacidad"
        porque: "Es mucho peor: un cortocircuito interno."
    escalera:
      - "¿Qué se deposita en el ánodo al pasar de la tensión máxima?"
    solucion: "Litio metálico en dendritas que perforan el separador y cortocircuitan la celda."

  - id: mantenimiento
    tipo: pregunta
    titulo: "¿Y después?"
    texto: "La carga ha terminado y el equipo sigue enchufado. ¿Se mantiene la celda a 4,2 V?"
    libro: [144]
    widget:
      tipo: figura
      figura: fig-39.11
      zonas:
        - { id: corte, rotulo: "Cuarta franja", rect: [365, 5, 52, 190] }
    opciones:
      - texto: "No: si la tensión baja con el tiempo, se recarga"
        bien: true
        porque: "Mantenerla a 4,2 V indefinidamente la degrada: no hay carga de mantenimiento."
      - texto: "Sí, con una corriente de goteo"
        porque: "Eso vale para otras químicas; al litio sostenerlo a 4,2 V lo degrada."
      - texto: "Sí, para que esté siempre llena"
        porque: "Llena y sostenida es justo lo que la degrada."
    escalera:
      - "Una celda de litio a tensión de carga todo el tiempo, ¿envejece más o menos?"
    solucion: "No se sostiene: se corta y, si baja, se recarga."

  - id: empareje-tension
    tipo: pregunta
    titulo: "Capacidad o vida"
    texto: "Empareje cada tensión de carga con lo que da."
    libro: [150, 151]
    widget:
      tipo: figura
      figura: fig-39.10
      zonas:
        - { id: cv, rotulo: "Mitad derecha", rect: [137, 0, 160, 175] }
    emparejar:
      - ["4,20 V", "100 % y de 300 a 500 ciclos"]
      - ["4,10 V", "~85 % y de 600 a 1 000 ciclos"]
      - ["4,00 V", "~70 % y de 1 200 a 2 000 ciclos"]
    exito: "Limitar la carga al 80 % renuncia a un 20 % de autonomía y multiplica la vida por tres o cuatro."
    pistas:
      - { texto: "A menos tensión, menos capacidad y más ciclos." }
    escalera:
      - "Cada décima de voltio menos cuesta capacidad y regala ciclos."
    solucion: "4,20 V: 100 %; 4,10 V: ~85 %; 4,00 V: ~70 %, con más ciclos cuanto más baja."

  - id: en-frio
    tipo: pregunta
    titulo: "Cargar en frío"
    texto: "Un equipo de exterior se carga bajo cero, con tensión y corriente correctas. ¿Qué pasa?"
    libro: [146, 147]
    widget:
      tipo: figura
      figura: fig-39.11
      zonas:
        - { id: cc, rotulo: "Segunda franja", rect: [65, 5, 152, 190] }
    opciones:
      - texto: "Se deposita litio metálico: hay que bloquear la carga en frío"
        bien: true
        porque: "El margen de carga, de 0 a 45 °C, es más estrecho que el de descarga, y se ignora."
      - texto: "Nada, si la tensión y la corriente son las correctas"
        porque: "Por debajo de 0 °C se deposita litio metálico aunque lo sean."
      - texto: "Solo carga más despacio"
        porque: "No es cuestión de velocidad: el daño es el depósito de litio metálico."
    escalera:
      - "Compare el margen de temperatura de carga con el de descarga."
    solucion: "Por debajo de 0 °C se deposita litio metálico: se mide la temperatura y se bloquea la carga."

  - id: ordene-soc
    tipo: pregunta
    titulo: "Cuánta carga queda"
    texto: "Ordene los métodos para estimar el estado de carga, del más burdo al mejor."
    libro: [158]
    widget:
      tipo: figura
      figura: fig-39.10
      zonas:
        - { id: grafica, rotulo: "La gráfica", rect: [30, 0, 270, 175] }
    ordenar:
      - "Por tensión en reposo"
      - "Contador de culombios"
      - "Modelo con corrección"
    exito: "El modelo con corrección es lo que hacen los medidores integrados: la única forma de acercarse al ±3 %."
    pistas:
      - { texto: "El contador acumula deriva; el modelo lo corrige." }
    escalera:
      - "La tensión es plana en la mayor parte; el mejor combina los otros dos."
    solucion: "Tensión en reposo, contador de culombios, modelo con corrección."

  - id: cargador-propio
    tipo: pregunta
    titulo: "No es una fuente de 4,2 V"
    texto: "Hace falta cargar una celda de litio en un montaje propio. ¿Qué es lo sensato?"
    libro: [160, 161]
    widget:
      tipo: figura
      figura: fig-39.11
      zonas:
        - { id: fases, rotulo: "La gráfica", rect: [31, 5, 386, 190] }
    opciones:
      - texto: "Un integrado de carga: trae CC-CV, temperatura, temporizador y celda dañada"
        bien: true
        porque: "Cuestan poco y traen todo verificado; un cargador improvisado puede causar un incendio."
      - texto: "Una fuente ajustada a 4,2 V con una resistencia"
        porque: "Le falta el control CC-CV con su tolerancia, la temperatura, el temporizador y la detección de celda dañada."
      - texto: "Un regulador lineal de 4,2 V"
        porque: "Fija la tensión, pero no hace el resto de lo que debe hacer un cargador."
    escalera:
      - "Cuente lo que debe incluir un cargador de litio como mínimo."
    solucion: "Un integrado de carga: no hay razón para hacerlo a mano."

  - id: banco-cargador
    tipo: banco
    titulo: "Registre una carga"
    texto: "Con un cargador propio, registre la tensión de la celda durante una carga completa y anote la máxima."
    libro: [139, 163]
    banco:
      piezas: ["Celda de litio con su cargador propio", "Brymen en modo REC, o shunt y osciloscopio", "Una caja metálica o cerámica para la celda"]
      medir: "La tensión máxima de la celda en toda la carga: debe verse la corriente constante, el codo y la caída."
      esperado: V_c
      unidad: V
      tol: 0.0119
      consejos:
        - { cuando: { valor: desviacion, mayor: 0.0119 }, texto: "Pasa de 4,25 V: ese cargador no sirve. No lo use." }
        - { cuando: { valor: desviacion, menor: -0.0119 }, texto: "Se queda corto: la celda no llega a cargarse del todo. Revise la tensión del cargador." }
        - { texto: "Dentro de 4,20 V ± 50 mV: la comprobación de una hora que es obligatoria." }
    comprobar:
      - { V_max: 4.25 }

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [139, 142, 143, 144]
    ideas:
      - { titulo: "CC-CV.", texto: "Precarga, corriente constante (80 %), tensión constante (el resto, lento) y corte." }
      - { titulo: "4,20 V ± 50 mV.", texto: "Sin margen: pasarse deposita litio metálico." }
      - { titulo: "Sin mantenimiento.", texto: "Se corta y, si baja, se recarga." }
      - { titulo: "Ni en frío.", texto: "Por debajo de 0 °C no se carga." }
