# Lección 1.2 de la sección 40.5 «Carga del Li-ion: CC-CV» (cap39; etiquetas sec-39.N = impresas 40.N).
# - Las cuatro fases sobre la figura 40.11 (fig-39.11), con zonas en cada fase; la figura 40.10 (fig-39.10) como apoyo.
# - Sin modelo de la carga: la sección da las fases con fracciones de C y porcentajes aproximados, que se citan.
# Paso práctico: «banco» del bloque 163: registrar una carga completa con un cargador propio y anotar la tensión
# máxima de la celda; debe quedar en 4,20 V ± 50 mV (bloque 139), y por encima de 4,25 V el cargador no sirve.
# - 1.2.1 (autor121-pot, «aprender haciendo», GUIA §13): la corriente de carga de la figura 40.11 en el modelo, con
#   sus fronteras (10,1, 57,9 y 103,5 min) y la caída de la fase CV ajustada a sus datos (dos exponenciales, error de
#   0,005 C): se avanza la carga hasta el codo (objetivo, ~81 % dentro), se marca el corte en 0,05 C, se toca la fase
#   del 80 % y se calcula la precarga de una celda de 2 Ah (ejemplo). Quedan dos preguntas (las dendritas y el frío).
leccion: cap39/sec-39.5

libro:
  138: "ese depósito forma dendritas que pueden perforar el separador"
  139: "4,20 V por celda con una tolerancia de ±50 mV"
  141: "Se aplica una corriente pequeña (0,05 a 0,1 C) hasta superar ese umbral"
  142: "En esta fase entra en torno al 80 % de la capacidad"
  143: "la corriente empieza a decaer exponencialmente por sí sola"
  144: "no se hace carga de mantenimiento"
  146: "0 a 45 °C"
  147: "cargar por debajo de 0 °C produce depósito de litio metálico"
  150: "~85 %"
  151: "se renuncia a un 20 % de autonomía a cambio de multiplicar la vida por tres o cuatro"
  158: "Es lo que hacen los medidores de combustible integrados"
  160: "Un cargador de litio no es una fuente ajustada a 4,2 V"
  161: "Los integrados de carga cuestan poco y traen todo lo anterior verificado"
  163: "Si la tensión sobrepasa 4,25 V en algún momento, el cargador no sirve"
  165: "Las cuatro fases de la carga CC-CV de una celda de litio"

modelo:
  valores:
    V_c: { sim: "V_{carga}", nombre: "tensión de carga", unidad: V, valor: 4.2 }
    t_c: { sim: "t", nombre: "tiempo de carga", unidad: min, valor: 30 }
    Q_cel: { sim: "C", nombre: "capacidad de la celda (ejemplo)", unidad: Ah, valor: 2 }
    t_fin: { sim: "t_{corte}", nombre: "corte de la figura", unidad: min, valor: 103.464 }
  calculos:
    I_t: { expr: "0.1*(1 - ceil(max(0, t_c - 10.146)/1e9)) + ceil(max(0, t_c - 10.146)/1e9)*(1 - ceil(max(0, t_c - 57.87)/1e9)) + ceil(max(0, t_c - 57.87)/1e9)*(1 - ceil(max(0, t_c - 103.464)/1e9))*(0.9479*exp(-(t_c - 57.87)/10.242) + 0.0521*exp(-(t_c - 57.87)/213.54))", sim: "I", nombre: "corriente de carga", unidad: "C", cifras: 2 }
    Q_t: { expr: "100*(0.1*min(t_c, 10.146)/60 + max(0, min(t_c, 57.87) - 10.146)/60 + (0.9479*10.242*(1 - exp(-max(0, min(t_c, 103.464) - 57.87)/10.242)) + 0.0521*213.54*(1 - exp(-max(0, min(t_c, 103.464) - 57.87)/213.54)))/60)", sim: "Q", nombre: "carga que ha entrado", unidad: "%", cifras: 2 }
    I_pre: { expr: "0.1*Q_cel", sim: "I_{pre}", nombre: "precarga máxima", unidad: A }
    V_max: { expr: "V_c + 0.05", sim: "V", nombre: "tolerancia por arriba", unidad: V }

tarjetas:
  - id: explore-fases
    tipo: explorar
    titulo: "Las fases de la carga"
    texto: "Precarga, corriente constante, tensión constante y corte. Avance la carga hasta que la celda llegue a 4,20 V y la corriente empiece a caer."
    libro: [141, 142, 143, 165]
    inicio: { t_c: 30 }
    widget:
      tipo: grafica
      x: { id: x, min: 0, max: 115, unidad: min, rotulo: "t" }
      y: { min: 0, max: 1.2, unidad: "C", rotulo: "corriente de carga" }
      curvas:
        - { expr: "0.1*(1 - ceil(max(0, x - 10.146)/1e9)) + ceil(max(0, x - 10.146)/1e9)*(1 - ceil(max(0, x - 57.87)/1e9)) + ceil(max(0, x - 57.87)/1e9)*(1 - ceil(max(0, x - 103.464)/1e9))*(0.9479*exp(-(x - 57.87)/10.242) + 0.0521*exp(-(x - 57.87)/213.54))", color: naranja, rotulo: "corriente" }
        - { expr: "0.05 + 0*x", color: tinta, rotulo: "0,05 C", discontinua: true }
      marcas:
        - { x: "t_c", y: "I_t", rotulo: "{{Q_t}} dentro" }
      lectura: { valor: I_t, rotulo: "Corriente" }
      datos:
        - { valor: Q_t, rotulo: "Ha entrado: {{Q_t}}" }
      mandos:
        - { valor: t_c, min: 0, max: 115, paso: 1, rotulo: "Tiempo de carga" }
    objetivo:
      condiciones:
        - { valor: t_c, min: 20, rotulo: "Tiempo: {{t_c}}" }
        - { valor: I_t, max: 0.95, rotulo: "Corriente: {{I_t}}" }
      logrado: "A {{t_c}} ya ha entrado {{Q_t}}: desde aquí el cargador mantiene 4,20 V y la corriente decae sola, despacio."
      pistas:
        - { texto: "Todavía en corriente constante: avance." }
    escalera:
      - "La corriente baja cuando la tensión llega a 4,20 V."
    solucion: "Hacia los 59 min, con un 81 % dentro."
    comprobar:
      - { con: { t_c: 59 }, I_t: 0.90, Q_t: 82.9, tol: 0.02 }
      - { con: { t_c: 57.87 }, Q_t: 81.2, tol: 0.003 }
      - { I_t: 1 }

  - id: marque-corte
    tipo: marcar
    titulo: "El corte"
    texto: "En tensión constante la corriente decae sola. Marque el instante en que cae por debajo de 0,05 C y la carga termina."
    libro: [143, 144, 146]
    widget:
      tipo: grafica
      x: { id: x, min: 0, max: 115, unidad: min, rotulo: "t" }
      y: { min: 0, max: 1.2, unidad: "C", rotulo: "corriente de carga" }
      curvas:
        - { expr: "0.1*(1 - ceil(max(0, x - 10.146)/1e9)) + ceil(max(0, x - 10.146)/1e9)*(1 - ceil(max(0, x - 57.87)/1e9)) + ceil(max(0, x - 57.87)/1e9)*(1 - ceil(max(0, x - 103.464)/1e9))*(0.9479*exp(-(x - 57.87)/10.242) + 0.0521*exp(-(x - 57.87)/213.54))", color: naranja, rotulo: "corriente" }
        - { expr: "0.05 + 0*x", color: tinta, rotulo: "0,05 C", discontinua: true }
      mandos: []
    marcar:
      modo: x
      curva: 0
      x: "t_fin"
      tol: 0.03
      inicio: { x: 70, y: 0 }
      rotulo: "El corte"
    pistas:
      - { cuando: { valor: marca_x, mayor: 103.5 }, texto: "Más a la izquierda: ahí ya ha cortado." }
      - { texto: "Más a la derecha: la corriente todavía pasa de 0,05 C." }
    exito: "Hacia los 103 min. Y no se hace carga de mantenimiento: si la tensión baja con el tiempo, se recarga."
    escalera:
      - "Donde la naranja cruza la línea discontinua."
    solucion: "Hacia los 103,5 min."
    comprobar:
      - { con: { t_c: 103.4 }, I_t: 0.053, tol: 0.05 }

  - id: simule-precarga
    tipo: simular
    titulo: "La precarga"
    texto: "Valores de ejemplo: una celda de 2 Ah, por debajo de unos 2,8 V. La precarga va de 0,05 a 0,1 C: ¿cuánta corriente, como mucho?"
    libro: [141]
    widget:
      tipo: grafica
      x: { id: x, min: 0, max: 115, unidad: min, rotulo: "t" }
      y: { min: 0, max: 1.2, unidad: "C", rotulo: "corriente de carga" }
      curvas:
        - { expr: "0.1*(1 - ceil(max(0, x - 10.146)/1e9)) + ceil(max(0, x - 10.146)/1e9)*(1 - ceil(max(0, x - 57.87)/1e9)) + ceil(max(0, x - 57.87)/1e9)*(1 - ceil(max(0, x - 103.464)/1e9))*(0.9479*exp(-(x - 57.87)/10.242) + 0.0521*exp(-(x - 57.87)/213.54))", color: naranja, rotulo: "corriente" }
        - { expr: "0.05 + 0*x", color: tinta, rotulo: "0,05 C", discontinua: true }
      lectura: { valor: I_pre, rotulo: "Precarga" }
      ocultar: true
    simular:
      objetivo: I_pre
      unidad: A
      tol: 0.03
      rotulo: "Corriente de precarga máxima"
      errores:
        - { expr: "Q_cel", texto: "Eso es 1C, corriente plena: peligroso en una celda profundamente descargada." }
    exito: "200 mA: una corriente pequeña hasta superar los 2,8 V; después, la corriente constante."
    escalera:
      - "0,1 C de 2 Ah."
    solucion: "0,1 × 2 Ah = 0,2 A."
    comprobar:
      - { I_pre: 0.2 }

  - id: toque-80
    tipo: tocar
    titulo: "Dónde entra casi todo"
    texto: "Toque la fase en la que entra en torno al 80 % de la capacidad."
    libro: [142, 143]
    widget:
      tipo: figura
      figura: fig-39.11
      zonas:
        - { id: precarga, rotulo: "Primera franja", rect: [31, 5, 34, 190] }
        - { id: cc, rotulo: "Segunda franja", rect: [65, 5, 152, 190] }
        - { id: cv, rotulo: "Tercera franja", rect: [219, 5, 145, 190] }
        - { id: corte, rotulo: "Cuarta franja", rect: [365, 5, 52, 190] }
    tocar:
      bien: [cc]
      porque:
        precarga: "La precarga solo saca la celda de la descarga profunda, con muy poca corriente."
        cv: "La tensión constante completa el 20 % restante, y despacio."
        corte: "En el corte ya no entra carga: la carga ha terminado."
    exito: "La corriente constante: su duración la dicta la corriente elegida."
    escalera:
      - "Busque la fase con la corriente alta y fija."
    solucion: "La segunda, corriente constante: en torno al 80 %."

  - id: por-que-estricto
    tipo: porque
    titulo: "Sin margen"
    texto: "El plomo tolera algo de sobrecarga. ¿Por qué el litio no admite pasar de 4,20 V ± 50 mV?"
    libro: [138, 139]
    widget:
      tipo: figura
      figura: fig-39.11
      zonas:
        - { id: tolerancia, rotulo: "Franja de arriba", rect: [31, 30, 386, 36] }
    opciones:
      - texto: "Se deposita litio metálico que forma dendritas y puede cortocircuitar la celda"
        bien: true
        porque: "Las dendritas perforan el separador: un cortocircuito interno, con el resultado conocido."
      - texto: "Porque el exceso se convierte en calor y agua"
        porque: "Eso le pasa al plomo o al níquel, que lo toleran. En el litio el daño es otro."
      - texto: "Porque se reduce algo la capacidad"
        porque: "Es mucho peor: un cortocircuito interno."
    escalera:
      - "¿Qué se deposita en el ánodo al pasar de la tensión máxima?"
    solucion: "Litio metálico en dendritas que perforan el separador y cortocircuitan la celda."

  - id: en-frio
    tipo: pregunta
    titulo: "Cargar en frío"
    texto: "Un equipo de exterior se carga bajo cero, con tensión y corriente correctas. ¿Qué pasa?"
    libro: [146, 147]
    widget:
      tipo: figura
      figura: fig-39.11
      zonas:
        - { id: cc, rotulo: "Segunda franja", rect: [65, 5, 152, 190] }
    opciones:
      - texto: "Se deposita litio metálico: hay que bloquear la carga en frío"
        bien: true
        porque: "El margen de carga, de 0 a 45 °C, es más estrecho que el de descarga, y se ignora."
      - texto: "Nada, si la tensión y la corriente son las correctas"
        porque: "Por debajo de 0 °C se deposita litio metálico aunque lo sean."
      - texto: "Solo carga más despacio"
        porque: "No es cuestión de velocidad: el daño es el depósito de litio metálico."
    escalera:
      - "Compare el margen de temperatura de carga con el de descarga."
    solucion: "Por debajo de 0 °C se deposita litio metálico: se mide la temperatura y se bloquea la carga."

  - id: banco-cargador
    tipo: banco
    titulo: "Registre una carga"
    texto: "Con un cargador propio, registre la tensión de la celda durante una carga completa y anote la máxima."
    libro: [139, 163]
    banco:
      piezas: ["Celda de litio con su cargador propio", "Brymen en modo REC, o shunt y osciloscopio", "Una caja metálica o cerámica para la celda"]
      medir: "La tensión máxima de la celda en toda la carga: debe verse la corriente constante, el codo y la caída."
      esperado: V_c
      unidad: V
      tol: 0.0119
      consejos:
        - { cuando: { valor: desviacion, mayor: 0.0119 }, texto: "Pasa de 4,25 V: ese cargador no sirve. No lo use." }
        - { cuando: { valor: desviacion, menor: -0.0119 }, texto: "Se queda corto: la celda no llega a cargarse del todo. Revise la tensión del cargador." }
        - { texto: "Dentro de 4,20 V ± 50 mV: la comprobación de una hora que es obligatoria." }
    comprobar:
      - { V_max: 4.25 }

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [139, 142, 143, 144, 147, 150, 151, 158, 160, 161]
    ideas:
      - { titulo: "CC-CV.", texto: "Precarga, corriente constante (80 %), tensión constante (el resto, lento) y corte." }
      - { titulo: "4,20 V ± 50 mV.", texto: "Sin margen: pasarse deposita litio metálico." }
      - { titulo: "Sin mantenimiento.", texto: "Se corta y, si baja, se recarga. Cargar a 4,10 V da ~85 % y mucha más vida." }
      - { titulo: "Ni en frío, ni a mano.", texto: "Por debajo de 0 °C no se carga. Un integrado de carga trae todo verificado; la carga se estima con culombios." }
