# Lección 1.2 de la sección 21.6 «Práctica 6 — Formas de Onda y Armónicos con la FFT» (cap22; etiqueta interna
# sec-22.6). Formato: contenido/lecciones11/GUIA.md. El espectro es el de la serie de Fourier del libro (cuadrada y
# sierra 1/n, triangular 1/n² solo impares), dibujado como líneas de anchura 0,12 armónicos hasta el noveno, en dB
# respecto a la fundamental y con el suelo en −40 dB (escala logarítmica) o en amplitud (lineal). La reconstrucción
# suma los impares hasta el armónico elegido (hasta el 31): la sobreoscilación de Gibbs se ve en las esquinas.
leccion: cap22/sec-22.6

libro:
  159: "La serie de Fourier dice que cualquier señal periódica es una suma de senoides."
  161: "Onda cuadrada: solo armónicos impares, con amplitud 1/n. El tercero está 9,5 dB por debajo de la fundamental"
  162: "también solo impares, con amplitud 1/n². Caen mucho más rápido: el tercero, 19 dB por debajo."
  163: "Diente de sierra: todos los armónicos, pares e impares, con amplitud 1/n."
  164: "los armónicos que aparezcan son distorsión del generador o del propio osciloscopio"
  165: "cuanto más suave es la forma de onda, más rápido caen sus armónicos"
  168: "un armónico par tiene el mismo valor en ambas mitades y rompería la simetría"
  169: "La cuadrada y la triangular la tienen; la sierra no."
  172: "Capturar un número entero de ciclos, en lo posible, para reducir la fuga espectral."
  173: "Escala logarítmica en amplitud, o los armónicos altos, sobre todo los de la triangular, apenas se distinguen del suelo."
  177: "Añadiendo el tercero: aparece el aplanamiento."
  178: "su sobreoscilación se estabiliza en el 9 % de la altura del salto"
  181: "armónicos de la fundamental indican distorsión (no linealidad); picos a frecuencias no relacionadas indican interferencia; un fondo continuo es ruido"
  183: "medir la amplitud del tercer armónico de una cuadrada y comprobar que está 9,5 dB por debajo de la fundamental"
  184: "20·log(1/3) = −9,54 dB"
  "cap22#370": "el nivel del noveno armónico respecto a la fundamental"

modelo:
  valores:
    s_f: { sim: "forma", nombre: "forma de onda", unidad: "", valor: 1 }
    esc: { sim: "escala", nombre: "escala logarítmica", unidad: "", valor: 1 }
    N_a: { sim: "N", nombre: "último armónico sumado", unidad: "", valor: 1 }
  calculos:
    f_q: { expr: "max(0, 1 - abs(s_f - 1))", sim: "q", nombre: "es la cuadrada", unidad: "" }
    f_t: { expr: "max(0, 1 - abs(s_f - 2))", sim: "t", nombre: "es la triangular", unidad: "" }
    f_s: { expr: "max(0, 1 - abs(s_f - 3))", sim: "s", nombre: "es la sierra", unidad: "" }
    L_3: { expr: "20*log10(f_q/3 + f_t/9 + f_s/3)", sim: "A₃", nombre: "tercer armónico", unidad: dB, cifras: 2 }
    L_2: { expr: "20*log10(max(0.0001, f_s/2))", sim: "A₂", nombre: "segundo armónico", unidad: dB, cifras: 2 }

tarjetas:
  - id: explore-espectros
    tipo: explorar
    titulo: "Tres formas, tres espectros"
    texto: "Cambie la forma de onda y mire qué armónicos aparecen y cuánto caen."
    libro: [159, 161, 162, 163]
    inicio: { s_f: 1 }
    widget:
      tipo: grafica
      x: { id: nu, min: 0, max: 10, unidad: "", rotulo: "armónico" }
      y: { min: -40, max: 5, unidad: dB, rotulo: "nivel" }
      curvas:
        - { expr: "20*log10(max(0.01, ((f_q/1 + f_t/1) + f_s/1)*exp(-((nu - 1)/0.12)^2) + (f_s/2)*exp(-((nu - 2)/0.12)^2) + ((f_q/3 + f_t/9) + f_s/3)*exp(-((nu - 3)/0.12)^2) + (f_s/4)*exp(-((nu - 4)/0.12)^2) + ((f_q/5 + f_t/25) + f_s/5)*exp(-((nu - 5)/0.12)^2) + (f_s/6)*exp(-((nu - 6)/0.12)^2) + ((f_q/7 + f_t/49) + f_s/7)*exp(-((nu - 7)/0.12)^2) + (f_s/8)*exp(-((nu - 8)/0.12)^2) + ((f_q/9 + f_t/81) + f_s/9)*exp(-((nu - 9)/0.12)^2)))", color: naranja, rotulo: "FFT" }
      lectura: { valor: L_3, rotulo: "Tercer armónico" }
      mandos:
        - { valor: s_f, lista: [1, 2, 3], nombres: [cuadrada, triangular, sierra], rotulo: "Forma" }
    requiere: { mover: [s_f] }

  - id: prediga-tercero
    tipo: predecir
    titulo: "El tercero de la cuadrada"
    texto: "En la FFT de una onda cuadrada, ¿a cuántos decibelios por debajo de la fundamental está el tercer armónico?"
    libro: [161, 184]
    fijar: { s_f: 1 }
    widget:
      tipo: grafica
      x: { id: nu, min: 0, max: 10, unidad: "", rotulo: "armónico" }
      y: { min: -40, max: 5, unidad: dB, rotulo: "nivel" }
      curvas:
        - { expr: "20*log10(max(0.01, ((f_q/1 + f_t/1) + f_s/1)*exp(-((nu - 1)/0.12)^2) + (f_s/2)*exp(-((nu - 2)/0.12)^2) + ((f_q/3 + f_t/9) + f_s/3)*exp(-((nu - 3)/0.12)^2) + (f_s/4)*exp(-((nu - 4)/0.12)^2) + ((f_q/5 + f_t/25) + f_s/5)*exp(-((nu - 5)/0.12)^2) + (f_s/6)*exp(-((nu - 6)/0.12)^2) + ((f_q/7 + f_t/49) + f_s/7)*exp(-((nu - 7)/0.12)^2) + (f_s/8)*exp(-((nu - 8)/0.12)^2) + ((f_q/9 + f_t/81) + f_s/9)*exp(-((nu - 9)/0.12)^2)))", color: naranja, rotulo: "FFT" }
      lectura: { valor: L_3, rotulo: "Tercer armónico" }
      ocultar: true
    opciones:
      - texto: "Unos 9,5 dB"
        bien: true
        porque: "Su amplitud es 1/3 de la fundamental: 20·log(1/3) = −9,54 dB."
      - texto: "Unos 19 dB"
        porque: "Eso es en la triangular, que cae con 1/n². La cuadrada cae con 1/n."
      - texto: "Unos 3 dB"
        porque: "Un tercio de la amplitud no es −3 dB: en amplitud, 20·log(1/3)."
    escalera:
      - "En la cuadrada, la amplitud del armónico n es 1/n de la fundamental."
    solucion: "20·log(1/3) = −9,54 dB: unos 9,5 dB por debajo."
    comprobar:
      - { L_3: -9.54 }

  - id: estime-noveno
    tipo: pregunta
    titulo: "El noveno armónico"
    texto: "Una cuadrada en la FFT con escala logarítmica. ¿A qué nivel respecto a la fundamental está el noveno armónico?"
    libro: [161, "cap22#370"]
    estimar:
      objetivo: "20*log10(1/9)"
      unidad: dB
      min: -40
      max: 0
      paso: 0.1
      inicio: -5
      tol: 0.03
      rotulo: "Noveno armónico"
    exito: "1/9 de la fundamental: 20·log(1/9) ≈ −19,1 dB."
    pistas:
      - { cuando: { valor: estimacion, mayor: -18.5 }, texto: "Se ha quedado corto: un noveno de la amplitud cae más que el tercio del tercero." }
      - { texto: "Se ha pasado: eso sería con 1/n², como la triangular. La cuadrada cae con 1/n." }
    escalera:
      - "La amplitud del noveno es 1/9 de la fundamental."
      - "En decibelios de amplitud: 20·log(1/9)."
    solucion: "20·log(1/9) ≈ −19,1 dB."

  - id: gibbs
    tipo: sorpresa
    titulo: "La esquina que no desaparece"
    texto: "Sume armónicos impares a la fundamental. La esquina sigue rebasando por muchos que añada."
    libro: [177, 178]
    inicio: { N_a: 1 }
    widget:
      tipo: grafica
      x: { id: n, min: 0, max: 1, unidad: "", rotulo: "ciclos" }
      y: { min: -1.4, max: 1.4, unidad: "", rotulo: "señal" }
      curvas:
        - { expr: "1 - 2*floor(2*(n - floor(n)))", color: tinta, rotulo: "cuadrada", discontinua: true }
        - { expr: "4/pi*(min(1, max(0, N_a - 1 + 1))*sin(2*pi*1*n)/1 + min(1, max(0, N_a - 3 + 1))*sin(2*pi*3*n)/3 + min(1, max(0, N_a - 5 + 1))*sin(2*pi*5*n)/5 + min(1, max(0, N_a - 7 + 1))*sin(2*pi*7*n)/7 + min(1, max(0, N_a - 9 + 1))*sin(2*pi*9*n)/9 + min(1, max(0, N_a - 11 + 1))*sin(2*pi*11*n)/11 + min(1, max(0, N_a - 13 + 1))*sin(2*pi*13*n)/13 + min(1, max(0, N_a - 15 + 1))*sin(2*pi*15*n)/15 + min(1, max(0, N_a - 17 + 1))*sin(2*pi*17*n)/17 + min(1, max(0, N_a - 19 + 1))*sin(2*pi*19*n)/19 + min(1, max(0, N_a - 21 + 1))*sin(2*pi*21*n)/21 + min(1, max(0, N_a - 23 + 1))*sin(2*pi*23*n)/23 + min(1, max(0, N_a - 25 + 1))*sin(2*pi*25*n)/25 + min(1, max(0, N_a - 27 + 1))*sin(2*pi*27*n)/27 + min(1, max(0, N_a - 29 + 1))*sin(2*pi*29*n)/29 + min(1, max(0, N_a - 31 + 1))*sin(2*pi*31*n)/31)", color: naranja, rotulo: "suma" }
      lectura: { valor: N_a, rotulo: "Último armónico" }
      mandos:
        - { valor: N_a, lista: [1, 3, 5, 7, 15, 31], rotulo: "Hasta el armónico" }
    requiere: { mover: [N_a] }

  - id: dibuje-tercero
    tipo: dibujar
    titulo: "Dibuje la fundamental más el tercero"
    texto: "Dibuje un ciclo de la fundamental de una cuadrada sumada a su tercer armónico, con un tercio de amplitud."
    libro: [161, 177]
    dibujar:
      x: { id: n, min: 0, max: 1, unidad: "", rotulo: "ciclos" }
      y: { min: -1.4, max: 1.4, unidad: "", rotulo: "señal" }
      curva: "4/pi*(sin(2*pi*n) + sin(6*pi*n)/3)"
      puntos: 25
      tol: 0.08
      holgura: 0.03
      rotulo: "Fundamental y tercero"
    exito: "Con el tercero, las crestas se aplanan con un pequeño valle en medio: la forma empieza a cuadrarse."
    escalera:
      - "Parte de una senoide; el tercero, tres veces más rápido, resta en el centro de cada cresta."
    solucion: "Una senoide con las crestas aplanadas y un valle suave en medio de cada una."

  - id: triangular
    tipo: pregunta
    titulo: "La triangular"
    texto: "¿Qué armónicos tiene una onda triangular y con qué amplitud?"
    libro: [162, 165]
    fijar: { s_f: 2 }
    widget:
      tipo: grafica
      x: { id: nu, min: 0, max: 10, unidad: "", rotulo: "armónico" }
      y: { min: -40, max: 5, unidad: dB, rotulo: "nivel" }
      curvas:
        - { expr: "20*log10(max(0.01, ((f_q/1 + f_t/1) + f_s/1)*exp(-((nu - 1)/0.12)^2) + (f_s/2)*exp(-((nu - 2)/0.12)^2) + ((f_q/3 + f_t/9) + f_s/3)*exp(-((nu - 3)/0.12)^2) + (f_s/4)*exp(-((nu - 4)/0.12)^2) + ((f_q/5 + f_t/25) + f_s/5)*exp(-((nu - 5)/0.12)^2) + (f_s/6)*exp(-((nu - 6)/0.12)^2) + ((f_q/7 + f_t/49) + f_s/7)*exp(-((nu - 7)/0.12)^2) + (f_s/8)*exp(-((nu - 8)/0.12)^2) + ((f_q/9 + f_t/81) + f_s/9)*exp(-((nu - 9)/0.12)^2)))", color: naranja, rotulo: "FFT" }
    opciones:
      - texto: "Solo impares, con amplitud 1/n²"
        bien: true
        porque: "Es continua, más suave que la cuadrada: sus armónicos caen más deprisa, el tercero ya 19 dB abajo."
      - texto: "Solo impares, con amplitud 1/n"
        porque: "Esa es la cuadrada, que tiene saltos. La triangular es continua y cae con 1/n²."
      - texto: "Todos, pares e impares, con amplitud 1/n"
        porque: "Ese es el diente de sierra, que no tiene simetría de media onda."
    escalera:
      - "Cuanto más suave la forma, más rápido caen sus armónicos."
    solucion: "Solo impares, con amplitud 1/n²."

  - id: simetria
    tipo: porque
    titulo: "¿Por qué la sierra tiene pares?"
    texto: "La cuadrada y la triangular no tienen armónicos pares; la sierra, sí. ¿Por qué?"
    libro: [168, 169]
    fijar: { s_f: 3 }
    widget:
      tipo: grafica
      x: { id: u, min: 0, max: 2, unidad: "", rotulo: "ciclos" }
      y: { min: -1.3, max: 1.3, unidad: "", rotulo: "señal" }
      curvas:
        - { expr: "f_q*(1 - 2*floor(2*(u - floor(u)))) + f_t*(1 - 4*abs(u - floor(u) - 0.5)) + f_s*(2*(u - floor(u)) - 1)", color: azul, rotulo: "forma" }
    opciones:
      - texto: "No tiene simetría de media onda, y un par la rompería"
        bien: true
        porque: "En la cuadrada y la triangular la segunda mitad es la primera invertida; un armónico par vale lo mismo en las dos mitades."
      - texto: "Porque los pares se cancelan con la continua"
        porque: "La continua no cancela armónicos. Lo que los prohíbe es la simetría de media onda."
      - texto: "Porque el osciloscopio no muestra los pares"
        porque: "La FFT muestra todos. En la cuadrada no aparecen porque no están."
    escalera:
      - "Compare la segunda mitad del ciclo con la primera invertida."
    solucion: "La sierra no tiene simetría de media onda; un armónico par tiene el mismo valor en las dos mitades y la rompería."

  - id: escala-log
    tipo: explorar
    titulo: "Los armónicos de la triangular"
    texto: "La triangular en escala lineal. Pase a escala logarítmica."
    libro: [173]
    fijar: { s_f: 2 }
    inicio: { esc: 0 }
    widget:
      tipo: grafica
      x: { id: nu, min: 0, max: 10, unidad: "", rotulo: "armónico" }
      y: { min: 0, max: 1.1, unidad: "", rotulo: "nivel" }
      curvas:
        - { expr: "(1 - esc)*(((f_q/1 + f_t/1) + f_s/1)*exp(-((nu - 1)/0.12)^2) + (f_s/2)*exp(-((nu - 2)/0.12)^2) + ((f_q/3 + f_t/9) + f_s/3)*exp(-((nu - 3)/0.12)^2) + (f_s/4)*exp(-((nu - 4)/0.12)^2) + ((f_q/5 + f_t/25) + f_s/5)*exp(-((nu - 5)/0.12)^2) + (f_s/6)*exp(-((nu - 6)/0.12)^2) + ((f_q/7 + f_t/49) + f_s/7)*exp(-((nu - 7)/0.12)^2) + (f_s/8)*exp(-((nu - 8)/0.12)^2) + ((f_q/9 + f_t/81) + f_s/9)*exp(-((nu - 9)/0.12)^2)) + esc*max(0, 1 + (20*log10(max(0.01, ((f_q/1 + f_t/1) + f_s/1)*exp(-((nu - 1)/0.12)^2) + (f_s/2)*exp(-((nu - 2)/0.12)^2) + ((f_q/3 + f_t/9) + f_s/3)*exp(-((nu - 3)/0.12)^2) + (f_s/4)*exp(-((nu - 4)/0.12)^2) + ((f_q/5 + f_t/25) + f_s/5)*exp(-((nu - 5)/0.12)^2) + (f_s/6)*exp(-((nu - 6)/0.12)^2) + ((f_q/7 + f_t/49) + f_s/7)*exp(-((nu - 7)/0.12)^2) + (f_s/8)*exp(-((nu - 8)/0.12)^2) + ((f_q/9 + f_t/81) + f_s/9)*exp(-((nu - 9)/0.12)^2))))/40)", color: naranja, rotulo: "FFT" }
      mandos:
        - { valor: esc, lista: [0, 1], nombres: [lineal, logarítmica], rotulo: "Escala vertical" }
    requiere: { mover: [esc] }

  - id: por-que-log
    tipo: porque
    titulo: "¿Por qué la escala logarítmica?"
    texto: "En escala lineal, la FFT de la triangular parece tener solo la fundamental. ¿Por qué?"
    libro: [162, 173]
    fijar: { s_f: 2, esc: 0 }
    widget:
      tipo: grafica
      x: { id: nu, min: 0, max: 10, unidad: "", rotulo: "armónico" }
      y: { min: 0, max: 1.1, unidad: "", rotulo: "nivel" }
      curvas:
        - { expr: "(1 - esc)*(((f_q/1 + f_t/1) + f_s/1)*exp(-((nu - 1)/0.12)^2) + (f_s/2)*exp(-((nu - 2)/0.12)^2) + ((f_q/3 + f_t/9) + f_s/3)*exp(-((nu - 3)/0.12)^2) + (f_s/4)*exp(-((nu - 4)/0.12)^2) + ((f_q/5 + f_t/25) + f_s/5)*exp(-((nu - 5)/0.12)^2) + (f_s/6)*exp(-((nu - 6)/0.12)^2) + ((f_q/7 + f_t/49) + f_s/7)*exp(-((nu - 7)/0.12)^2) + (f_s/8)*exp(-((nu - 8)/0.12)^2) + ((f_q/9 + f_t/81) + f_s/9)*exp(-((nu - 9)/0.12)^2)) + esc*max(0, 1 + (20*log10(max(0.01, ((f_q/1 + f_t/1) + f_s/1)*exp(-((nu - 1)/0.12)^2) + (f_s/2)*exp(-((nu - 2)/0.12)^2) + ((f_q/3 + f_t/9) + f_s/3)*exp(-((nu - 3)/0.12)^2) + (f_s/4)*exp(-((nu - 4)/0.12)^2) + ((f_q/5 + f_t/25) + f_s/5)*exp(-((nu - 5)/0.12)^2) + (f_s/6)*exp(-((nu - 6)/0.12)^2) + ((f_q/7 + f_t/49) + f_s/7)*exp(-((nu - 7)/0.12)^2) + (f_s/8)*exp(-((nu - 8)/0.12)^2) + ((f_q/9 + f_t/81) + f_s/9)*exp(-((nu - 9)/0.12)^2))))/40)", color: naranja, rotulo: "FFT" }
    opciones:
      - texto: "Sus armónicos caen con 1/n² y apenas se distinguen del suelo"
        bien: true
        porque: "El tercero es 1/9 de la fundamental y el quinto 1/25: en escala lineal casi no se ven; en dB, sí."
      - texto: "Porque la triangular no tiene armónicos"
        porque: "Tiene todos los impares, con amplitud 1/n². Solo son pequeños."
      - texto: "Porque la ventana de la FFT los borra"
        porque: "La ventana reduce la fuga, no borra armónicos. Lo que pasa es que son pequeños frente a la fundamental."
    escalera:
      - "¿Qué fracción de la fundamental es el tercer armónico de la triangular?"
    solucion: "Caen con 1/n²: tan pequeños que en escala lineal se confunden con el suelo. Hace falta la escala logarítmica."

  - id: diagnostico
    tipo: pregunta
    titulo: "Diagnóstico por espectro"
    texto: "Empareje lo que se ve en el espectro de una señal sucia con lo que indica."
    libro: [164, 181]
    emparejar:
      - ["Armónicos de la fundamental", "Distorsión, una no linealidad"]
      - ["Picos a frecuencias no relacionadas", "Interferencia"]
      - ["Un fondo continuo", "Ruido"]
      - ["Armónicos en una senoide del generador", "Distorsión del generador o del osciloscopio"]
    exito: "Cada forma de onda tiene su firma espectral: el espectro dice de dónde viene el problema."
    pistas:
      - { texto: "Lo que guarda relación con la fundamental viene de la propia señal." }
    escalera:
      - "Una no linealidad crea múltiplos de la frecuencia que la atraviesa."
    solucion: "Armónicos: distorsión. Picos no relacionados: interferencia. Fondo continuo: ruido. En una senoide: distorsión del equipo."

  - id: banco-fft
    tipo: banco
    titulo: "Compruébelo en el banco"
    texto: "Genere una cuadrada, mírela con la FFT en escala logarítmica y mida el tercer armónico respecto a la fundamental."
    libro: [172, 183, 184]
    fijar: { s_f: 1 }
    banco:
      piezas: ["Generador DDS del 2C53T: cuadrada", "Osciloscopio con FFT", "Un número entero de ciclos capturados"]
      medir: "El nivel del tercer armónico menos el de la fundamental."
      esperado: L_3
      unidad: dB
      tol: 0.05
      consejos:
        - { cuando: { valor: desviacion, mayor: 0.05 }, texto: "Le sale más abajo: compruebe la escala logarítmica y capture un número entero de ciclos." }
        - { cuando: { valor: desviacion, menor: -0.05 }, texto: "Le sale más arriba: ¿mide la fundamental en su pico? La fuga espectral la ensancha y la rebaja." }
        - { texto: "Unas décimas de decibelio de acuerdo con −9,54 dB: tan convincente como el álgebra." }
      ficha: { n: 30, titulo: "Práctica 6 · Formas de onda y armónicos con la FFT" }

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [161, 165, 168, 178]
    ideas:
      - { titulo: "Cuadrada.", texto: "Solo impares, con 1/n: el tercero a −9,54 dB." }
      - { titulo: "Suavidad.", texto: "Cuanto más suave la forma, más deprisa caen los armónicos: la triangular, con 1/n²." }
      - { titulo: "Simetría.", texto: "La simetría de media onda prohíbe los pares; la sierra no la tiene y los tiene todos." }
      - { titulo: "Gibbs.", texto: "Sumando armónicos, las esquinas rebasan un 9 % del salto, por muchos que se añadan." }
