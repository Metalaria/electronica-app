# Lección 1.2 de la sección 45.11 «Aislamiento Galvánico de los Buses» (cap44; etiqueta interna sec-44.9).
# Formato: contenido/lecciones11/GUIA.md (§11). Figura 45.15 (44.12.svg, svg_vista 453,6 × 255,6): las tres
# tecnologías arriba y, abajo, el bus aislado con su DC-DC y el cable de alimentación que anularía la barrera.
leccion: cap44/sec-44.9

libro:
  339: "Masas a distinto potencial, que producen bucles de tierra"
  340: "un transitorio en un extremo (un rayo, una descarga, un fallo) viaja por el bus y destruye el otro extremo"
  341: "la barrera es un requisito normativo y no una mejora"
  342: "El aislamiento galvánico rompe el camino de corriente conservando la información"
  344: "Un LED y un fototransistor enfrentados dentro del encapsulado."
  346: "uno que dependa del CTR típico fallará al cabo de años"
  352: "sin degradación con el tiempo, porque no hay LED que envejezca"
  353: "Hoy son la elección por defecto salvo por precio o por disponibilidad."
  355: "aísla, adapta impedancias y bloquea la continua con un solo componente"
  356: "no pasa continua, así que solo sirve con codificaciones equilibradas"
  358: "esa alimentación no puede venir del lado no aislado por un cable, o la barrera no serviría de nada"
  360: "Convertidor DC-DC aislado, con su transformador."
  363: "dos canales unidireccionales"
  364: "un aislador genérico no sirve, y hay que usar los diseñados para él"
  366: "tensión de aislamiento (la que soporta en un ensayo breve), tensión de trabajo (la continua que puede soportar durante toda su vida)"
  367: "Un aislador de 5 kV con pistas que pasan por debajo a un milímetro no aísla 5 kV"
  369: "las masas de las sondas están unidas dentro del osciloscopio, así que esa medida puentea la barrera"
  370: "el error de olvidar la alimentación del lado aislado"

modelo: { valores: {}, calculos: {} }

tarjetas:
  - id: explore-tecnologias
    tipo: explorar
    titulo: "Romper el camino"
    texto: "El aislamiento galvánico rompe el camino de la corriente y conserva la información. Toque las tres tecnologías."
    libro: [342, 344, 352, 355, 370]
    widget:
      tipo: figura
      figura: fig-44.12
      zonas:
        - { id: opto, rotulo: "Recuadro naranja, arriba", rect: [3, 2, 145, 68], texto: "Un LED y un fototransistor: la información pasa como luz. De 10 a 100 kbit/s." }
        - { id: digital, rotulo: "Recuadro verde, arriba", rect: [153, 2, 145, 68], texto: "Condensadores o transformadores integrados: decenas o cientos de Mbit/s, sin degradación." }
        - { id: trafo, rotulo: "Recuadro azul, arriba", rect: [306, 2, 145, 68], texto: "De pulsos, como en Ethernet: aísla, adapta impedancias y bloquea la continua." }
    requiere: { mover: [opto, digital, trafo] }

  - id: empareje-cuando
    tipo: pregunta
    fase: "Empareje"
    titulo: "Cuándo hace falta"
    texto: "Una cada situación con su problema."
    libro: [339, 340, 341]
    emparejar:
      - ["Masas a distinto potencial", "Bucles de tierra y corrientes por el bus"]
      - ["Riesgo de sobretensión", "Un transitorio viaja y destruye el otro extremo"]
      - ["Un lado a tensión peligrosa", "La barrera es un requisito normativo"]
    exito: "En las tres, la unión eléctrica del bus es el problema."
    pistas:
      - { texto: "Un rayo o una descarga es un transitorio." }
    escalera: ["¿Cuál de las tres la exige una norma?"]
    solucion: "Masas distintas, bucles de tierra; sobretensión, el transitorio viaja; seguridad, requisito normativo."

  - id: prediga-ctr
    tipo: predecir
    titulo: "Un optoacoplador que envejece"
    texto: "Un enlace con optoacoplador, calculado con el CTR típico, funciona bien en el banco. ¿Qué pasa al cabo de años?"
    libro: [346]
    widget:
      tipo: figura
      figura: fig-44.12
      zonas:
        - { id: opto, rotulo: "Recuadro naranja, arriba", rect: [3, 2, 145, 68], texto: "El CTR se degrada con el tiempo." }
    opciones:
      - { texto: "Puede fallar: el CTR decae con el tiempo", bien: true, porque: "Un diseño robusto funciona con el CTR mínimo del final de vida." }
      - { texto: "Nada: si funciona hoy, funcionará siempre", porque: "El CTR decae con el tiempo y con la corriente del LED." }
      - { texto: "Va más rápido", porque: "Lo que cambia es la ganancia del acoplamiento, que baja." }
    escalera: ["¿Qué componente del optoacoplador envejece?"]
    solucion: "Fallará al cabo de años: hay que diseñar con el CTR mínimo del final de vida."

  - id: toque-alimentacion
    tipo: tocar
    titulo: "Alimentar el otro lado"
    texto: "El transceptor del lado aislado necesita alimentación. Toque lo que se la da sin anular la barrera."
    libro: [358, 360]
    widget:
      tipo: figura
      figura: fig-44.12
      zonas:
        - { id: cable, rotulo: "Línea discontinua de arriba", rect: [60, 96, 330, 36] }
        - { id: aislador, rotulo: "Bloque del centro", rect: [178, 134, 96, 36] }
        - { id: dcdc, rotulo: "Bloque de abajo", rect: [178, 192, 96, 36] }
        - { id: micro, rotulo: "Bloque de la izquierda", rect: [5, 138, 112, 46] }
    tocar:
      bien: [dcdc]
      porque:
        cable: "Un cable desde el lado no aislado anularía la barrera."
        aislador: "Aísla los datos; la energía tiene que cruzar por otro camino aislado."
        micro: "Está en el lado no aislado: darle de ahí por un cable rompe el aislamiento."
    exito: "Un DC-DC aislado, con su transformador. Olvidarlo es el error más frecuente al aislar un bus."
    escalera: ["Busque el bloque que cruza la barrera llevando energía."]
    solucion: "El DC-DC aislado, abajo en el centro."

  - id: empareje-tecnologias
    tipo: pregunta
    fase: "Empareje"
    titulo: "Tres tecnologías"
    texto: "Una cada tecnología con su límite o su virtud."
    libro: [346, 352, 356]
    emparejar:
      - ["Optoacoplador", "De 10 a 100 kbit/s, CTR que se degrada"]
      - ["Aislador digital", "Cientos de Mbit/s, sin degradación"]
      - ["Transformador", "No pasa continua: codificaciones equilibradas"]
    exito: "Hoy el aislador digital es la elección por defecto, salvo por precio o disponibilidad."
    pistas:
      - { texto: "Solo uno lleva un LED que envejece." }
    escalera: ["¿Cuál bloquea la continua?"]
    solucion: "Opto, lento y se degrada; digital, rápido y estable; transformador, sin continua."

  - id: porque-i2c
    tipo: porque
    titulo: "Aislar I²C"
    texto: "Una UART se aísla con dos canales unidireccionales. ¿Por qué un aislador genérico no sirve para I²C?"
    libro: [363, 364]
    widget:
      tipo: figura
      figura: fig-44.12
      zonas:
        - { id: aislador, rotulo: "Bloque del centro", rect: [178, 134, 96, 36], texto: "Un aislador digital genérico." }
    opciones:
      - { texto: "I²C es bidireccional en la misma línea, de drenador abierto", bien: true, porque: "Los aisladores para I²C resuelven la dirección con un truco de niveles." }
      - { texto: "I²C es demasiado rápido", porque: "Es un bus lento: la dificultad es la dirección, no la velocidad." }
      - { texto: "I²C no tiene masa", porque: "Tiene masa como todos; el problema es que cada línea va en los dos sentidos." }
    escalera: ["¿En qué sentido viaja la señal por SDA?"]
    solucion: "Es bidireccional en la misma línea: hacen falta aisladores específicos."

  - id: empareje-buses
    tipo: pregunta
    fase: "Empareje"
    titulo: "Aislar cada bus"
    texto: "Una cada bus con cómo se aísla."
    libro: [363]
    emparejar:
      - ["UART", "Dos canales unidireccionales"]
      - ["SPI", "Cuatro canales unidireccionales"]
      - ["CAN", "Entre el controlador y el transceptor"]
      - ["Ethernet", "Ya viene aislado por sus transformadores"]
    exito: "RS-485 se aísla igual que CAN, y es muy habitual en la industria."
    pistas:
      - { texto: "Cuente las líneas de cada bus, y su sentido." }
    escalera: ["¿Cuál ya trae transformadores en cada puerto?"]
    solucion: "UART, dos canales; SPI, cuatro; CAN, entre controlador y transceptor; Ethernet, ya aislado."

  - id: empareje-tensiones
    tipo: pregunta
    fase: "Empareje"
    titulo: "No es todo o nada"
    texto: "Una cada tensión de la hoja de datos con lo que significa."
    libro: [366]
    emparejar:
      - ["Tensión de aislamiento", "La que soporta en un ensayo breve"]
      - ["Tensión de trabajo", "La continua que soporta toda su vida"]
    exito: "Confundirlas lleva a un componente que pasa el ensayo y falla en servicio."
    pistas:
      - { texto: "Un ensayo dura poco; la vida del equipo, años." }
    escalera: ["¿Cuál de las dos importa para el servicio continuo?"]
    solucion: "Aislamiento, ensayo breve; trabajo, continua durante toda su vida."

  - id: pregunta-fuga
    tipo: pregunta
    titulo: "La distancia de fuga"
    texto: "Un aislador de 5 kV con pistas que pasan por debajo a un milímetro. ¿Cuánto aísla?"
    libro: [367]
    widget:
      tipo: figura
      figura: fig-44.12
      zonas:
        - { id: barrera, rotulo: "Franja vertical del centro", rect: [210, 106, 36, 148], texto: "La barrera, también en la placa." }
    opciones:
      - { texto: "Lo que aguante ese milímetro de sustrato", bien: true, porque: "La distancia de fuga en la placa debe respetar el aislamiento del componente." }
      - { texto: "Los 5 kV del aislador", porque: "El aislador los aguanta, pero la placa crea un camino más corto por debajo." }
      - { texto: "El doble, por ir en serie", porque: "Las pistas van en paralelo con la barrera: manda el camino más débil." }
    escalera: ["¿Por dónde puede saltar la tensión si no es por el aislador?"]
    solucion: "Lo que aguante ese milímetro de sustrato, no 5 kV."

  - id: pregunta-banco
    tipo: pregunta
    titulo: "En el banco"
    texto: "Se mide la entrada y la salida del aislador con dos canales del osciloscopio, cada pinza en su lado. ¿Cuándo es admisible?"
    libro: [369]
    widget:
      tipo: figura
      figura: fig-44.12
      zonas:
        - { id: barrera, rotulo: "Franja vertical del centro", rect: [210, 106, 36, 148], texto: "La barrera." }
    opciones:
      - { texto: "Solo con los dos lados a baja tensión", bien: true, porque: "Las masas de las sondas se unen dentro del osciloscopio y puentean la barrera." }
      - { texto: "Siempre: cada pinza va en su lado", porque: "Dentro del osciloscopio las dos masas están unidas: la barrera queda puenteada." }
      - { texto: "Nunca: un aislador no se puede medir", porque: "Se mide, con cuidado: y con un lado peligroso, con sonda diferencial." }
    escalera: ["¿Están separadas las masas de los dos canales dentro del osciloscopio?"]
    solucion: "Solo con ambos lados a baja tensión; con un lado peligroso, sonda diferencial."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [342, 353, 358, 364]
    ideas:
      - { titulo: "Aislar.", texto: "Romper el camino de la corriente y conservar la información." }
      - { titulo: "Tecnología.", texto: "Hoy, el aislador digital; el optoacoplador envejece." }
      - { titulo: "La alimentación.", texto: "El lado aislado necesita la suya: un DC-DC aislado." }
      - { titulo: "I²C.", texto: "Bidireccional en la misma línea: aisladores específicos." }
