# Lección 1.2 de la sección 45.11 «Aislamiento Galvánico de los Buses» (cap44; etiqueta interna sec-44.9).
# Formato: contenido/lecciones11/GUIA.md (§11). Figura 45.15 (44.12.svg, svg_vista 453,6 × 255,6): las tres
# tecnologías arriba y, abajo, el bus aislado con su DC-DC y el cable de alimentación que anularía la barrera.
# 1.2.1 («aprender haciendo», GUIA §13): las tres tecnologías se tocan (la que no envejece, la que envejece y la que no
# pasa continua); alimentar el lado aislado es un objetivo lógico ilustrativo (transceptor alimentado y barrera
# intacta); en el banco se toca lo que puentea el osciloscopio. Quedan dos preguntas de opciones: I²C y la fuga.
leccion: cap44/sec-44.9

libro:
  339: "Masas a distinto potencial, que producen bucles de tierra"
  340: "un transitorio en un extremo (un rayo, una descarga, un fallo) viaja por el bus y destruye el otro extremo"
  341: "la barrera es un requisito normativo y no una mejora"
  342: "El aislamiento galvánico rompe el camino de corriente conservando la información"
  344: "Un LED y un fototransistor enfrentados dentro del encapsulado."
  346: "uno que dependa del CTR típico fallará al cabo de años"
  352: "sin degradación con el tiempo, porque no hay LED que envejezca"
  353: "Hoy son la elección por defecto salvo por precio o por disponibilidad."
  355: "aísla, adapta impedancias y bloquea la continua con un solo componente"
  356: "no pasa continua, así que solo sirve con codificaciones equilibradas"
  358: "esa alimentación no puede venir del lado no aislado por un cable, o la barrera no serviría de nada"
  360: "Convertidor DC-DC aislado, con su transformador."
  361: "Olvidar este punto es el error de diseño más frecuente al aislar un bus"
  363: "dos canales unidireccionales"
  364: "un aislador genérico no sirve, y hay que usar los diseñados para él"
  366: "tensión de aislamiento (la que soporta en un ensayo breve), tensión de trabajo (la continua que puede soportar durante toda su vida)"
  367: "Un aislador de 5 kV con pistas que pasan por debajo a un milímetro no aísla 5 kV"
  369: "las masas de las sondas están unidas dentro del osciloscopio, así que esa medida puentea la barrera"
  370: "el error de olvidar la alimentación del lado aislado"

modelo: { valores: {}, calculos: {} }

tarjetas:
  - id: explore-tecnologias
    tipo: tocar
    titulo: "Romper el camino"
    texto: "El aislamiento galvánico rompe el camino de la corriente y conserva la información. Para decenas de Mbit/s durante años sin degradarse, toque la tecnología."
    libro: [342, 344, 352, 353, 370]
    widget:
      tipo: figura
      figura: fig-44.12
      zonas:
        - { id: opto, rotulo: "Recuadro naranja, arriba", rect: [3, 2, 145, 68] }
        - { id: digital, rotulo: "Recuadro verde, arriba", rect: [153, 2, 145, 68] }
        - { id: trafo, rotulo: "Recuadro azul, arriba", rect: [306, 2, 145, 68] }
    tocar:
      bien: [digital]
      porque:
        opto: "Llega a 100 kbit/s con los comunes, y su CTR se degrada con el tiempo."
        trafo: "Solo sirve con codificaciones equilibradas: no pasa continua."
    exito: "El aislador digital, capacitivo o magnético: sin LED que envejezca. Hoy es la elección por defecto, salvo por precio o disponibilidad."
    escalera: ["¿Cuál no lleva nada que envejezca?"]
    solucion: "El recuadro verde: el aislador digital."

  - id: prediga-ctr
    tipo: tocar
    titulo: "Un enlace que envejece"
    texto: "Un enlace calculado con el CTR típico funciona bien en el banco y falla al cabo de años. Toque la tecnología que usa."
    libro: [346]
    widget:
      tipo: figura
      figura: fig-44.12
      zonas:
        - { id: opto, rotulo: "Recuadro naranja, arriba", rect: [3, 2, 145, 68] }
        - { id: digital, rotulo: "Recuadro verde, arriba", rect: [153, 2, 145, 68] }
        - { id: trafo, rotulo: "Recuadro azul, arriba", rect: [306, 2, 145, 68] }
    tocar:
      bien: [opto]
      porque:
        digital: "No tiene CTR ni LED: no se degrada con el tiempo."
        trafo: "Un transformador no tiene CTR que decaiga."
    exito: "El optoacoplador: su CTR decae con el tiempo y con la corriente del LED. Un diseño robusto funciona con el CTR mínimo del final de vida."
    escalera: ["¿Cuál lleva un LED?"]
    solucion: "El recuadro naranja: el optoacoplador."

  - id: toque-alimentacion
    tipo: explorar
    titulo: "Alimentar el otro lado"
    texto: "Aislar los datos no basta: el transceptor del lado aislado necesita alimentación. Désela sin anular la barrera."
    libro: [358, 360, 361]
    widget:
      tipo: logica
      entradas: [{ id: C, valor: 0, rotulo: "Cable desde el lado no aislado" }, { id: D, valor: 0, rotulo: "DC-DC aislado" }]
      piezas:
        - { id: alim, tipo: or, entradas: [C, D], rotulo: "Alimentación del transceptor" }
        - { id: barrera, tipo: not, entradas: [C], rotulo: "Barrera" }
      salidas:
        - { id: TRX, de: alim, rotulo: "Transceptor alimentado" }
        - { id: BAR, de: barrera, rotulo: "Barrera intacta" }
    objetivo:
      condiciones:
        - { led: TRX, valor: 1, rotulo: "Transceptor alimentado" }
        - { led: BAR, valor: 1, rotulo: "Barrera intacta" }
      logrado: "Con un DC-DC aislado, que cruza la barrera con su transformador. Olvidarlo es el error más frecuente al aislar un bus."
      pistas:
        - { cuando: { senal: C, valor: 1 }, texto: "Un cable desde el lado no aislado anula la barrera: quítelo." }
        - { texto: "El transceptor sigue sin alimentación." }
    escalera: ["Conecte el DC-DC aislado, y no el cable."]
    solucion: "Solo el DC-DC aislado: alimenta el lado aislado sin unir los dos lados."

  - id: empareje-tecnologias
    tipo: tocar
    titulo: "Sin continua"
    texto: "Un transformador de pulsos aísla, adapta impedancias y bloquea la continua con un solo componente. Toque el que no sirve para una codificación con componente continua."
    libro: [355, 356]
    widget:
      tipo: figura
      figura: fig-44.12
      zonas:
        - { id: opto, rotulo: "Recuadro naranja, arriba", rect: [3, 2, 145, 68] }
        - { id: digital, rotulo: "Recuadro verde, arriba", rect: [153, 2, 145, 68] }
        - { id: trafo, rotulo: "Recuadro azul, arriba", rect: [306, 2, 145, 68] }
    tocar:
      bien: [trafo]
      porque:
        opto: "Lleva la información como luz: no hay transformador que bloquee la continua."
        digital: "Con canales como los suyos se aíslan UART y SPI, con sus niveles mantenidos: el límite de la continua es de otro."
    exito: "El transformador no pasa continua: solo sirve con codificaciones equilibradas. Ethernet, diferencial y sin continua, lo lleva en cada puerto."
    escalera: ["¿Cuál bloquea la continua?"]
    solucion: "El recuadro azul: el transformador."

  - id: porque-i2c
    tipo: porque
    titulo: "Aislar I²C"
    texto: "Una UART se aísla con dos canales unidireccionales. ¿Por qué un aislador genérico no sirve para I²C?"
    libro: [363, 364]
    widget:
      tipo: figura
      figura: fig-44.12
      zonas:
        - { id: aislador, rotulo: "Bloque del centro", rect: [178, 134, 96, 36], texto: "Un aislador digital genérico." }
    opciones:
      - { texto: "I²C es bidireccional en la misma línea, de drenador abierto", bien: true, porque: "Los aisladores para I²C resuelven la dirección con un truco de niveles." }
      - { texto: "I²C es demasiado rápido", porque: "Es un bus lento: la dificultad es la dirección, no la velocidad." }
      - { texto: "I²C no tiene masa", porque: "Tiene masa como todos; el problema es que cada línea va en los dos sentidos." }
    escalera: ["¿En qué sentido viaja la señal por SDA?"]
    solucion: "Es bidireccional en la misma línea: hacen falta aisladores específicos."

  - id: pregunta-fuga
    tipo: pregunta
    titulo: "La distancia de fuga"
    texto: "Un aislador de 5 kV con pistas que pasan por debajo a un milímetro. ¿Cuánto aísla?"
    libro: [366, 367]
    widget:
      tipo: figura
      figura: fig-44.12
      zonas:
        - { id: barrera, rotulo: "Franja vertical del centro", rect: [210, 106, 36, 148], texto: "La barrera, también en la placa." }
    opciones:
      - { texto: "Lo que aguante ese milímetro de sustrato", bien: true, porque: "La distancia de fuga en la placa debe respetar el aislamiento del componente." }
      - { texto: "Los 5 kV del aislador", porque: "El aislador los aguanta, pero la placa crea un camino más corto por debajo." }
      - { texto: "El doble, por ir en serie", porque: "Las pistas van en paralelo con la barrera: manda el camino más débil." }
    exito: "Y en la hoja de datos, la tensión de aislamiento es la de un ensayo breve; la de trabajo, la que soporta toda su vida."
    escalera: ["¿Por dónde puede saltar la tensión si no es por el aislador?"]
    solucion: "Lo que aguante ese milímetro de sustrato, no 5 kV."

  - id: pregunta-banco
    tipo: tocar
    titulo: "En el banco"
    texto: "Un canal del osciloscopio en la entrada del aislador y otro en la salida, cada pinza en su lado. Las masas de las sondas están unidas dentro: toque lo que se puentea."
    libro: [369]
    widget:
      tipo: figura
      figura: fig-44.12
      zonas:
        - { id: micro, rotulo: "Bloque de la izquierda", rect: [5, 138, 112, 46] }
        - { id: aislador, rotulo: "Bloque del centro", rect: [178, 134, 96, 36] }
        - { id: barrera, rotulo: "Franja vertical del centro", rect: [210, 172, 36, 82] }
        - { id: trx, rotulo: "Bloque de la derecha", rect: [338, 138, 110, 46] }
    tocar:
      bien: [barrera]
      porque:
        micro: "Es un lado, con su masa A: lo puenteado es lo que la separa de la otra."
        aislador: "El aislador sigue igual; lo que se salta es la separación entre las masas."
        trx: "Es el otro lado, con su masa B: lo puenteado está entre las dos."
    exito: "La barrera: solo es admisible con los dos lados a baja tensión. Con un lado peligroso, el de potencia se mide con sonda diferencial."
    escalera: ["¿Qué separa la masa A de la masa B?"]
    solucion: "La barrera, la franja del centro."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [339, 340, 341, 342, 353, 358, 363, 364]
    ideas:
      - { titulo: "Aislar.", texto: "Con masas distintas, riesgo de sobretensión o un lado peligroso: romper el camino y conservar la información." }
      - { titulo: "Tecnología.", texto: "Hoy, el aislador digital; el optoacoplador envejece." }
      - { titulo: "La alimentación.", texto: "El lado aislado necesita la suya: un DC-DC aislado." }
      - { titulo: "I²C.", texto: "Bidireccional en la misma línea: aisladores específicos." }
