# Lección 1.2 de la sección 45.1 «Serie o Paralelo, Síncrono o Asíncrono» (cap44; etiqueta interna sec-44.1).
# Formato: contenido/lecciones11/GUIA.md (§11). La figura 45.1 (w_441.svg, svg_vista 453,6 × 226,8) es la tabla de
# las cuatro decisiones; sus filas son las zonas. El reloj compartido se ve en un registro D vivo: el emisor pone el
# dato y el receptor lo lee en cada flanco de subida (bloque 9).
# 1.2.1 («aprender haciendo», GUIA §13): las columnas y filas de la tabla se tocan; el registro D se carga con un
# objetivo y se dibuja su salida; los 27 ciclos de I²C se escriben. Quedan dos preguntas de opciones: el margen de
# la UART y dónde suelen estar los fallos. Emparejar y ordenar pasan a los textos de éxito.
leccion: cap44/sec-44.1

libro:
  5: "Paralelo: varios bits a la vez por líneas distintas."
  6: "Serie: un bit tras otro."
  7: "hoy prácticamente todo lo rápido es serie"
  9: "Síncrono: hay una línea de reloj que marca cuándo leer cada bit."
  10: "menos del 2 % de error total entre los dos extremos, con un límite teórico de alrededor del 5 %"
  11: "codificación autosincronizada, donde el reloj va embebido en las transiciones de los propios datos"
  13: "Un maestro: uno gobierna y los demás responden."
  14: "Varios maestros: cualquiera puede iniciar, y hace falta resolver las colisiones."
  16: "Simple y limitado a distancias cortas y entornos limpios."
  17: "Diferencial: la señal es la diferencia entre dos conductores"
  21: "Un enlace símplex transmite en un solo sentido, como un receptor GPS que solo emite sus frases."
  25: "escribir un byte en un registro cuesta 27 ciclos de reloj"
  27: "SPI si sobran pines y hace falta velocidad; I²C si escasean los pines y hay muchos dispositivos lentos."
  28: "Entre placas del mismo equipo: UART con protocolo"
  29: "Entre equipos o en entorno ruidoso: CAN o RS-485."
  30: "Con un ordenador: USB"
  32: "nivel físico con el osciloscopio"
  33: "la mayoría de los problemas de bus son de nivel físico, no de protocolo"
  34: "Clasificación de los buses según las cuatro decisiones de diseño."

modelo:
  valores:
    n_campos: { sim: "n", nombre: "bytes de la escritura (dirección, registro y dato)", valor: 3 }
  calculos:
    ciclos_i2c: { expr: "n_campos*(8 + 1)", sim: "ciclos", nombre: "ciclos de reloj de la escritura", cifras: 2 }

tarjetas:
  - id: porque-serie
    tipo: tocar
    titulo: "La misma respuesta"
    texto: "Todo bus se clasifica con cuatro preguntas, las columnas de la tabla. Toque la columna que tiene la misma respuesta en todos."
    libro: [34, 5, 6, 7]
    widget:
      tipo: figura
      figura: fig-44.1
      zonas:
        - { id: serie, rotulo: "Columna «¿Serie o paralelo?»", rect: [76, 0, 49, 192] }
        - { id: reloj, rotulo: "Columna «¿Síncrono o asíncrono?»", rect: [126, 0, 86, 192] }
        - { id: maestros, rotulo: "Columna «¿Uno o varios maestros?»", rect: [214, 0, 72, 192] }
        - { id: masa, rotulo: "Columna «¿Referido a masa o diferencial?»", rect: [288, 0, 74, 192] }
    tocar:
      bien: [serie]
      porque:
        reloj: "Aquí hay de todo: asíncrono, síncrono y autosincronizado."
        maestros: "Unos tienen un maestro y otros varios."
        masa: "Unos van referidos a masa y otros son diferenciales."
    exito: "Todos serie: es más fácil llevar una línea a diez gigabits que dieciséis alineadas a mil. El paralelo sufre skew, diafonía y rebote de masa."
    escalera: ["Busque la columna en la que se repite la misma palabra."]
    solucion: "La columna «¿Serie o paralelo?»: todos son serie."

  - id: explore-mapa
    tipo: tocar
    titulo: "Metros de cable y ruido"
    texto: "Dos equipos de una nave con motores se unen con varios metros de cable. Toque la columna que decide si eso funciona."
    libro: [16, 17, 13, 14, 29]
    widget:
      tipo: figura
      figura: fig-44.1
      zonas:
        - { id: serie, rotulo: "Columna «¿Serie o paralelo?»", rect: [76, 0, 49, 192] }
        - { id: reloj, rotulo: "Columna «¿Síncrono o asíncrono?»", rect: [126, 0, 86, 192] }
        - { id: maestros, rotulo: "Columna «¿Uno o varios maestros?»", rect: [214, 0, 72, 192] }
        - { id: masa, rotulo: "Columna «¿Referido a masa o diferencial?»", rect: [288, 0, 74, 192] }
    tocar:
      bien: [masa]
      porque:
        serie: "Todos son serie; el ruido se combate con otra decisión."
        reloj: "El reloj marca cuándo leer, no protege del ruido."
        maestros: "Decide quién habla: uno gobierna o cualquiera inicia. No dice si la señal llega limpia."
    exito: "Diferencial, obligatoria con metros de cable o ruido: entre equipos, CAN o RS-485. Referida a masa se limita a distancias cortas y entornos limpios."
    escalera: ["¿Qué columna dice cómo se mide la señal?"]
    solucion: "«¿Referido a masa o diferencial?»: hace falta diferencial."

  - id: explore-sincrono
    tipo: explorar
    titulo: "Con reloj"
    texto: "Síncrono: el emisor da el dato D y el reloj; el receptor lee D en cada flanco de subida. Haga que el receptor capture un uno."
    libro: [9]
    widget:
      tipo: logica
      entradas: [{ id: CLK, reloj: true }, D]
      piezas:
        - { id: rx, tipo: d, entradas: [D, CLK], rotulo: "Receptor" }
      salidas:
        - { id: Q, de: rx.q }
    objetivo:
      condiciones:
        - { led: Q, valor: 1, rotulo: "El receptor tiene un uno" }
      logrado: "D solo entra con el flanco: emisor y receptor comparten el reloj, así que no hace falta que los suyos coincidan."
      pistas:
        - { cuando: { senal: D, valor: 0 }, texto: "Primero, el dato: ponga D a uno." }
        - { texto: "Ahora dé un flanco de reloj." }
    escalera: ["D a uno y un flanco de subida de CLK."]
    solucion: "D a uno y un pulso de reloj: Q pasa a uno."

  - id: dibuje-receptor
    tipo: dibujar
    titulo: "Bit a bit"
    texto: "El emisor envía ocho bits, uno por ciclo. Dibuje lo que tiene el receptor tras cada flanco."
    libro: [9]
    widget:
      tipo: logica
      entradas: [{ id: CLK, reloj: true }, D]
      piezas:
        - { id: rx, tipo: d, entradas: [D, CLK], rotulo: "Receptor" }
      salidas:
        - { id: Q, de: rx.q }
      cronograma: { ciclos: 8, estimulo: { D: "10110010" }, senales: [CLK, D] }
      dibujo: false
    dibujar:
      senal: Q
    exito: "Q copia D en cada flanco y la conserva hasta el siguiente: el reloj marca cuándo leer cada bit."
    escalera: ["En cada flanco de subida, Q toma el valor que D tiene en ese instante."]
    solucion: "Q repite la secuencia de D, cambiando solo en los flancos."

  - id: pregunta-asincrono
    tipo: pregunta
    titulo: "Sin línea de reloj"
    texto: "Una UART no tiene reloj compartido: cada extremo usa el suyo. ¿Qué exige eso?"
    libro: [10]
    widget:
      tipo: figura
      figura: fig-44.1
      zonas:
        - { id: reloj, rotulo: "Columna «¿Síncrono o asíncrono?»", rect: [126, 0, 86, 192], texto: "La UART, la única asíncrona." }
    opciones:
      - { texto: "Que los dos relojes coincidan: en la práctica, menos del 2 % de error total", bien: true, porque: "El límite teórico ronda el 5 %; el 2 % deja margen." }
      - { texto: "Nada: el bit de inicio lo arregla todo", porque: "El inicio marca la referencia, pero desde ahí cada extremo cuenta con su reloj: deben coincidir." }
      - { texto: "Que haya un maestro que reparta el reloj", porque: "Eso sería síncrono; el asíncrono ahorra precisamente esa línea." }
    escalera: ["Si no hay reloj común, ¿con qué cuenta cada extremo los bits?"]
    solucion: "Que ambos relojes coincidan: menos del 2 % de error en la práctica, con un límite teórico de alrededor del 5 %."

  - id: porque-autosincronizado
    tipo: tocar
    titulo: "La tercera vía"
    texto: "Algunos buses van rápido sin línea de reloj y sin exigir relojes iguales. Toque todos los que lo consiguen."
    libro: [11]
    widget:
      tipo: figura
      figura: fig-44.1
      zonas:
        - { id: uart, rotulo: "Fila UART", rect: [0, 25.0, 453, 35] }
        - { id: spi, rotulo: "Fila SPI", rect: [0, 48.0, 453, 35] }
        - { id: i2c, rotulo: "Fila I²C", rect: [0, 71.0, 453, 35] }
        - { id: can, rotulo: "Fila CAN", rect: [0, 94.0, 453, 35] }
        - { id: rs485, rotulo: "Fila RS-485", rect: [0, 117.0, 453, 35] }
        - { id: usb, rotulo: "Fila USB", rect: [0, 140.0, 453, 35] }
        - { id: eth, rotulo: "Fila Ethernet", rect: [0, 163.0, 453, 35] }
    tocar:
      bien: [can, usb, eth]
      todas: true
      porque:
        uart: "No lleva reloj, pero exige que los dos relojes coincidan: es asíncrona."
        spi: "Lleva línea de reloj: es síncrono."
        i2c: "Lleva línea de reloj: es síncrono."
        rs485: "La tabla dice «depende»: por sí solo no lleva el reloj en los datos."
    exito: "CAN, USB y Ethernet: el reloj va en las transiciones de los datos y el receptor lo recupera, con un PLL o resincronizando en cada flanco."
    escalera: ["Busque «autosincronizado» en la columna del reloj."]
    solucion: "CAN, USB y Ethernet: autosincronizados."

  - id: empareje-sentido
    tipo: explorar
    titulo: "Por turnos"
    texto: "Semidúplex: A y B hablan por turnos sobre la misma línea, y ahora habla A. Dé la palabra a B, que quiere enviar un cero."
    libro: [21]
    widget:
      tipo: logica
      entradas: [{ id: DA, valor: 1, rotulo: "Dato de A" }, { id: EA, valor: 1, rotulo: "A habla" }, { id: DB, rotulo: "Dato de B" }, { id: EB, rotulo: "B habla" }]
      piezas:
        - { id: ta, tipo: tri, entradas: [DA, EA], rotulo: "Emisor A" }
        - { id: tb, tipo: tri, entradas: [DB, EB], rotulo: "Emisor B" }
        - { id: linea, tipo: bus, entradas: [ta, tb], pullup: 1 }
      salidas:
        - { id: L, de: linea, rotulo: "Línea" }
    objetivo:
      condiciones:
        - { senal: EA, valor: 0, rotulo: "A ha soltado la línea" }
        - { led: L, valor: 0, rotulo: "La línea lleva el cero de B" }
      logrado: "Por turnos y sobre el mismo medio, como I²C, CAN o RS-485 a dos hilos: alguien decide quién habla y el emisor suelta la línea a tiempo."
      pistas:
        - { cuando: { senal: EA, valor: 1 }, texto: "A sigue conduciendo la línea: si B habla ya, chocan. Que A la suelte primero." }
        - { texto: "Ahora, que B conduzca la línea." }
    escalera: ["Apague «A habla» y encienda «B habla»."]
    solucion: "A suelta la línea y B la conduce con su cero. La UART y el SPI, con un camino por sentido, no esperan turno."

  - id: estime-ciclos
    tipo: leer
    titulo: "El caudal útil"
    texto: "Escribir un byte en un registro de un sensor I²C envía dirección, registro y dato, cada uno con su ACK. Calcule los ciclos de reloj, sin inicio ni parada."
    libro: [25]
    fijar: { n_campos: 3 }
    widget:
      tipo: figura
      figura: fig-44.1
      zonas:
        - { id: reloj, rotulo: "Columna «¿Síncrono o asíncrono?»", rect: [126, 0, 86, 192] }
    leer:
      objetivo: ciclos_i2c
      unidad: ciclos
      tol: 0.02
      rotulo: "Ciclos de reloj"
      errores:
        - { expr: "n_campos*8", texto: "Falta el ACK de cada byte: son 9 ciclos por byte." }
    exito: "{{ciclos_i2c}} ciclos para 8 bits útiles: en transferencias cortas, el caudal útil ronda la mitad de la velocidad nominal, o menos."
    escalera: ["Cada byte de I²C cuesta 9 ciclos: 8 bits y el ACK."]
    solucion: "Tres bytes de 9 ciclos: {{ciclos_i2c}}."
    comprobar:
      - { ciclos_i2c: 27 }

  - id: pregunta-nivel-fisico
    tipo: pregunta
    titulo: "Dónde está el fallo"
    texto: "Un bus no funciona. ¿Dónde está, casi siempre, el problema?"
    libro: [32, 33]
    widget:
      tipo: figura
      figura: fig-44.1
      zonas:
        - { id: masa, rotulo: "Columna «¿Referido a masa o diferencial?»", rect: [288, 0, 74, 192], texto: "Parte de la capa física." }
    opciones:
      - { texto: "En el nivel físico", bien: true, porque: "Pull-ups mal dimensionados, terminación ausente, niveles incompatibles o masas distintas explican más fallos que el software." }
      - { texto: "En el protocolo", porque: "Los errores de protocolo existen, pero son menos que los físicos." }
      - { texto: "En el analizador lógico", porque: "El analizador decodifica; si el nivel físico falla, decodifica basura." }
    exito: "Por eso se empieza con el osciloscopio: señal, amplitud y flancos; luego la velocidad, y al final el contenido con el analizador lógico."
    escalera: ["Piense en pull-ups, terminaciones, niveles y masas."]
    solucion: "En el nivel físico, no en el protocolo."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [7, 10, 11, 27, 28, 29, 30, 33]
    ideas:
      - { titulo: "Cuatro decisiones.", texto: "Serie o paralelo, reloj o no, uno o varios maestros, masa o diferencial." }
      - { titulo: "Elección.", texto: "En la placa, SPI o I²C; entre placas, UART; entre equipos, CAN o RS-485; con un ordenador, USB." }
      - { titulo: "Relojes.", texto: "Asíncrono: menos del 2 % de error; autosincronizado: el reloj va en los datos." }
      - { titulo: "Diagnóstico.", texto: "La mayoría de los fallos son del nivel físico." }
