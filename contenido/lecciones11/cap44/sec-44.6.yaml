# Lección 1.2 de la sección 45.8 «USB: Universal pero Complejo» (cap44; etiqueta interna sec-44.6).
# Formato: contenido/lecciones11/GUIA.md (§11). Sección sin circuito: todo gira alrededor de la figura 45.12 (44.9.svg,
# svg_vista 453,6 × 216): las cuatro fases de la enumeración arriba y las tres clases abajo.
# 1.2.1 («aprender haciendo», GUIA §13): las fases se tocan (el descriptor que falla, la velocidad, la corriente); las
# clases, también (filas de 35 de alto que se solapan menos de la mitad). Las resistencias del pin CC son un objetivo
# lógico: la fuente da 5 V cuando ve la resistencia (bloque 262). Queda una pregunta de opciones: la asimetría.
leccion: cap44/sec-44.6

libro:
  244: "es lo que permite que un aparato desconocido se conecte a un ordenador desconocido y funcione sin instalar nada"
  247: "Ningún dispositivo transmite si el host no le pregunta, y dos dispositivos no pueden hablar entre sí."
  248: "Para eso está USB OTG"
  250: "el host detecta el cambio de impedancia en las líneas, lo resetea y le hace una serie de preguntas"
  251: "El dispositivo responde con sus descriptores"
  252: "Un descriptor mal construido produce un dispositivo que el host detecta pero rechaza."
  254: "Un dispositivo que declara pertenecer a una clase estándar usa el controlador que el sistema ya tiene."
  255: "no necesita controlador ni permisos especiales"
  256: "CDC (comunicaciones): crea un puerto serie virtual."
  257: "MSC (almacenamiento masivo): el dispositivo aparece como una unidad de disco."
  258: "si CDC basta, usar CDC"
  260: "USB 2.0 ofrece 5 V y 100 mA garantizados al conectar, ampliables a 500 mA si el dispositivo los solicita durante la enumeración"
  262: "Un cable o un adaptador sin ellas produce un dispositivo que no se alimenta"
  264: "con impedancia diferencial de 90 Ω"
  265: "son las que le dicen al host a qué velocidad hablar"
  267: "cuando el interlocutor es un ordenador, cuando hace falta caudal alto"
  268: "entre dos microcontroladores (mucho más simple una UART o SPI)"
  269: "un conversor USB-serie, que da un puerto serie virtual en el ordenador y una UART sencilla en el microcontrolador"
  271: "comprobar la alimentación en el conector"
  272: "cable o alimentación, nivel físico, y descriptores"
  273: "Las cuatro fases de la enumeración USB"

modelo: { valores: {}, calculos: {} }

tarjetas:
  - id: explore-enumeracion
    tipo: tocar
    titulo: "Un dispositivo desconocido"
    texto: "Al conectar, el host pregunta y el dispositivo se describe. El sistema lo detecta, pero lo rechaza como desconocido: toque la fase que falla."
    libro: [244, 250, 251, 252, 273]
    widget:
      tipo: figura
      figura: fig-44.9
      zonas:
        - { id: deteccion, rotulo: "Primer recuadro de arriba", rect: [3, 24, 100, 55] }
        - { id: reset, rotulo: "Segundo recuadro de arriba", rect: [117, 24, 100, 55] }
        - { id: descriptores, rotulo: "Tercer recuadro de arriba", rect: [231, 24, 100, 55] }
        - { id: configuracion, rotulo: "Cuarto recuadro de arriba", rect: [345, 24, 100, 55] }
    tocar:
      bien: [descriptores]
      porque:
        deteccion: "La detección ha funcionado: el sistema lo ve."
        reset: "Si lo detecta y lo resetea, el nivel físico funciona."
        configuracion: "No llega: sin un descriptor válido, el host no puede elegir controlador."
    exito: "Un descriptor mal construido: el host lo detecta pero lo rechaza. Si un dispositivo no aparece, casi siempre falla la enumeración."
    escalera: ["Si el host lo detecta, ¿qué parte ya funciona?"]
    solucion: "La tercera fase: los descriptores."

  - id: pregunta-asimetria
    tipo: pregunta
    titulo: "Host y dispositivos"
    texto: "Se quieren unir directamente dos dispositivos USB, un sensor y una memoria. ¿Se puede?"
    libro: [247, 248]
    widget:
      tipo: figura
      figura: fig-44.9
      zonas:
        - { id: configuracion, rotulo: "Cuarto recuadro de arriba", rect: [345, 24, 100, 55], texto: "Todo lo decide el host." }
    opciones:
      - { texto: "No, salvo que uno haga de host con USB OTG", bien: true, porque: "USB no es un bus entre iguales: ningún dispositivo transmite si el host no le pregunta." }
      - { texto: "Sí: se arbitran como en CAN", porque: "USB no tiene arbitraje entre dispositivos: todo lo gobierna el host." }
      - { texto: "Sí, con un cable cruzado", porque: "No es cuestión de cable: dos dispositivos no pueden hablar entre sí." }
    escalera: ["¿Quién inicia cada transacción en USB?"]
    solucion: "No: hace falta un host. USB OTG deja que uno de los dos lo sea."

  - id: pregunta-cdc
    tipo: tocar
    titulo: "La elección práctica"
    texto: "Una clase estándar usa el controlador que el sistema ya tiene. Una placa propia debe mandar medidas a un ordenador: toque la clase que conviene."
    libro: [254, 255, 256, 257, 258]
    widget:
      tipo: figura
      figura: fig-44.9
      zonas:
        - { id: hid, rotulo: "Primera fila de abajo", rect: [3, 133.5, 445, 35] }
        - { id: cdc, rotulo: "Segunda fila de abajo", rect: [3, 152.5, 445, 35] }
        - { id: msc, rotulo: "Tercera fila de abajo", rect: [3, 170.5, 445, 35] }
    tocar:
      bien: [cdc]
      porque:
        hid: "Vale para instrumentos de bajo caudal sin controlador, pero hay una más simple para un flujo de datos."
        msc: "Expone ficheros como una unidad de disco; para un flujo de medidas hay otra más directa."
    exito: "CDC, un puerto serie virtual: si basta, usar CDC. Es lo más simple y convierte el problema en el de una UART conocida."
    escalera: ["¿Qué clase usa cualquier placa de desarrollo?"]
    solucion: "CDC, la segunda fila."

  - id: prediga-corriente
    tipo: tocar
    titulo: "Más corriente"
    texto: "USB 2.0 garantiza 100 mA al conectar. Un dispositivo necesita 500 mA: toque la fase en que debe pedirlos."
    libro: [260]
    widget:
      tipo: figura
      figura: fig-44.9
      zonas:
        - { id: deteccion, rotulo: "Primer recuadro de arriba", rect: [3, 24, 100, 55] }
        - { id: reset, rotulo: "Segundo recuadro de arriba", rect: [117, 24, 100, 55] }
        - { id: descriptores, rotulo: "Tercer recuadro de arriba", rect: [231, 24, 100, 55] }
        - { id: configuracion, rotulo: "Cuarto recuadro de arriba", rect: [345, 24, 100, 55] }
    tocar:
      bien: [descriptores]
      porque:
        deteccion: "Ahí el host solo ve que hay algo conectado."
        reset: "El reset fija la velocidad, no la corriente."
        configuracion: "La corriente se pide antes, al describirse."
    exito: "Se piden en la enumeración y el host los concede. Consumirlos sin negociar a menudo funciona, y a veces el puerto se desconecta."
    escalera: ["¿En qué fase dice el dispositivo cuánta corriente necesita?"]
    solucion: "Los descriptores: cuánta corriente."

  - id: pregunta-usbc
    tipo: explorar
    titulo: "Un montaje USB-C que no arranca"
    texto: "En USB-C, las resistencias del pin CC anuncian el papel y la corriente; sin ellas, el montaje no se alimenta. Haga que el suyo reciba los 5 V."
    libro: [262]
    widget:
      tipo: logica
      entradas: [{ id: F, valor: 1, rotulo: "Adaptador conectado" }, { id: R, valor: 0, rotulo: "Resistencias en CC" }]
      piezas:
        - { id: fuente, tipo: and, entradas: [F, R], rotulo: "La fuente da tensión" }
      salidas:
        - { id: VBUS, de: fuente, rotulo: "5 V en el montaje" }
    objetivo:
      condiciones:
        - { led: VBUS, valor: 1, rotulo: "El montaje se alimenta" }
      logrado: "Con las resistencias en CC, la fuente sabe que hay un dispositivo. Faltar es un fallo muy común en montajes propios."
      pistas:
        - { texto: "El adaptador ya está conectado: falta lo que anuncia el papel del montaje." }
    escalera: ["Ponga las resistencias en el pin CC."]
    solucion: "Resistencias en CC: el montaje recibe sus 5 V."

  - id: porque-fisico
    tipo: tocar
    titulo: "El nivel físico"
    texto: "Las resistencias de identificación de velocidad deben tener los valores exactos del estándar. Toque la fase en que el host las usa."
    libro: [264, 265]
    widget:
      tipo: figura
      figura: fig-44.9
      zonas:
        - { id: deteccion, rotulo: "Primer recuadro de arriba", rect: [3, 24, 100, 55] }
        - { id: reset, rotulo: "Segundo recuadro de arriba", rect: [117, 24, 100, 55] }
        - { id: descriptores, rotulo: "Tercer recuadro de arriba", rect: [231, 24, 100, 55] }
        - { id: configuracion, rotulo: "Cuarto recuadro de arriba", rect: [345, 24, 100, 55] }
    tocar:
      bien: [reset]
      porque:
        deteccion: "Ahí solo ve el cambio de impedancia: aún no fija nada."
        descriptores: "Para preguntar ya hace falta hablar a una velocidad."
        configuracion: "Al configurar, la velocidad ya está fijada."
    exito: "El host lo resetea y fija la velocidad: las resistencias le dicen a cuál hablar. El par D+/D−, además, es de 90 Ω diferenciales."
    escalera: ["¿En qué fase fija el host la velocidad?"]
    solucion: "La segunda fase: el reset."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [244, 247, 267, 268, 269, 271, 272]
    ideas:
      - { titulo: "Sin configuración.", texto: "El host pregunta; el dispositivo se describe con sus descriptores." }
      - { titulo: "Asimetría.", texto: "Un host gobierna; dos dispositivos no hablan entre sí." }
      - { titulo: "Diagnóstico.", texto: "Alimentación en el conector, detección en el sistema y D+/D− en el osciloscopio: cable, nivel físico o descriptores." }
      - { titulo: "Cuándo.", texto: "Con un ordenador; entre micros, UART o SPI. Un conversor USB-serie evita USB en el firmware." }
