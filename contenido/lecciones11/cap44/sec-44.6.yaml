# Lección 1.2 de la sección 45.8 «USB: Universal pero Complejo» (cap44; etiqueta interna sec-44.6).
# Formato: contenido/lecciones11/GUIA.md (§11). Sección sin circuito: todo gira alrededor de la figura 45.12 (44.9.svg,
# svg_vista 453,6 × 216): las cuatro fases de la enumeración arriba y las tres clases abajo.
leccion: cap44/sec-44.6

libro:
  244: "es lo que permite que un aparato desconocido se conecte a un ordenador desconocido y funcione sin instalar nada"
  247: "Ningún dispositivo transmite si el host no le pregunta, y dos dispositivos no pueden hablar entre sí."
  248: "Para eso está USB OTG"
  250: "el host detecta el cambio de impedancia en las líneas, lo resetea y le hace una serie de preguntas"
  251: "El dispositivo responde con sus descriptores"
  252: "Un descriptor mal construido produce un dispositivo que el host detecta pero rechaza."
  255: "no necesita controlador ni permisos especiales"
  256: "CDC (comunicaciones): crea un puerto serie virtual."
  257: "MSC (almacenamiento masivo): el dispositivo aparece como una unidad de disco."
  258: "si CDC basta, usar CDC"
  260: "USB 2.0 ofrece 5 V y 100 mA garantizados al conectar, ampliables a 500 mA si el dispositivo los solicita durante la enumeración"
  262: "Un cable o un adaptador sin ellas produce un dispositivo que no se alimenta"
  264: "con impedancia diferencial de 90 Ω"
  265: "son las que le dicen al host a qué velocidad hablar"
  267: "cuando el interlocutor es un ordenador, cuando hace falta caudal alto"
  268: "entre dos microcontroladores (mucho más simple una UART o SPI)"
  269: "un conversor USB-serie, que da un puerto serie virtual en el ordenador y una UART sencilla en el microcontrolador"
  271: "comprobar la alimentación en el conector"
  272: "cable o alimentación, nivel físico, y descriptores"
  273: "Las cuatro fases de la enumeración USB"

modelo: { valores: {}, calculos: {} }

tarjetas:
  - id: explore-enumeracion
    tipo: explorar
    titulo: "La enumeración"
    texto: "USB funciona sin configuración porque el host pregunta y el dispositivo se describe. Toque las cuatro fases."
    libro: [244, 250, 251, 273]
    widget:
      tipo: figura
      figura: fig-44.9
      zonas:
        - { id: deteccion, rotulo: "Primer recuadro de arriba", rect: [3, 24, 100, 55], texto: "El host ve el cambio de impedancia en las líneas." }
        - { id: reset, rotulo: "Segundo recuadro de arriba", rect: [117, 24, 100, 55], texto: "El host lo resetea." }
        - { id: descriptores, rotulo: "Tercer recuadro de arriba", rect: [231, 24, 100, 55], texto: "Quién eres, qué clase, cuántas interfaces, cuánta corriente: responde con sus descriptores." }
        - { id: configuracion, rotulo: "Cuarto recuadro de arriba", rect: [345, 24, 100, 55], texto: "El host elige el controlador y lo configura." }
    requiere: { mover: [deteccion, descriptores] }

  - id: ordene-enumeracion
    tipo: pregunta
    fase: "Ordene"
    titulo: "Al conectar"
    texto: "Ordene lo que pasa al conectar un dispositivo USB."
    libro: [250, 251]
    ordenar:
      - "El host detecta el cambio de impedancia en las líneas."
      - "Lo resetea."
      - "Le pregunta y el dispositivo responde con sus descriptores."
      - "El host elige el controlador y lo configura."
    exito: "Si un dispositivo no aparece, casi siempre falla en la enumeración, y el sistema suele decir en qué punto."
    pistas:
      - { texto: "Sin los descriptores, el host no sabe qué controlador elegir." }
    escalera: ["Antes de preguntar nada, el host tiene que notar que hay algo."]
    solucion: "Detección, reset, descriptores y configuración."

  - id: pregunta-asimetria
    tipo: pregunta
    titulo: "Host y dispositivos"
    texto: "Se quieren unir directamente dos dispositivos USB, un sensor y una memoria. ¿Se puede?"
    libro: [247, 248]
    widget:
      tipo: figura
      figura: fig-44.9
      zonas:
        - { id: configuracion, rotulo: "Cuarto recuadro de arriba", rect: [345, 24, 100, 55], texto: "Todo lo decide el host." }
    opciones:
      - { texto: "No, salvo que uno haga de host con USB OTG", bien: true, porque: "USB no es un bus entre iguales: ningún dispositivo transmite si el host no le pregunta." }
      - { texto: "Sí: se arbitran como en CAN", porque: "USB no tiene arbitraje entre dispositivos: todo lo gobierna el host." }
      - { texto: "Sí, con un cable cruzado", porque: "No es cuestión de cable: dos dispositivos no pueden hablar entre sí." }
    escalera: ["¿Quién inicia cada transacción en USB?"]
    solucion: "No: hace falta un host. USB OTG deja que uno de los dos lo sea."

  - id: pregunta-desconocido
    tipo: pregunta
    titulo: "Un dispositivo desconocido"
    texto: "El sistema operativo detecta un dispositivo, pero lo rechaza como desconocido. ¿Qué falla?"
    libro: [252, 271]
    widget:
      tipo: figura
      figura: fig-44.9
      zonas:
        - { id: descriptores, rotulo: "Tercer recuadro de arriba", rect: [231, 24, 100, 55], texto: "Las preguntas y sus respuestas." }
    opciones:
      - { texto: "Un descriptor mal construido", bien: true, porque: "Si lo detecta, el nivel físico funciona: falla la enumeración." }
      - { texto: "La alimentación", porque: "Sin alimentación no lo detectaría en absoluto." }
      - { texto: "El cable", porque: "Con un cable roto no habría ni detección." }
    escalera: ["Si el host lo detecta, ¿qué parte ya funciona?"]
    solucion: "Un descriptor: el host lo detecta pero lo rechaza."

  - id: empareje-clases
    tipo: pregunta
    fase: "Empareje"
    titulo: "Las clases"
    texto: "Una cada clase con lo que el ordenador ve."
    libro: [255, 256, 257]
    emparejar:
      - ["HID", "Teclados, mandos o instrumentos, sin controlador ni permisos"]
      - ["CDC", "Un puerto serie virtual"]
      - ["MSC", "Una unidad de disco"]
    exito: "Una clase estándar usa el controlador que el sistema ya tiene."
    pistas:
      - { texto: "CDC convierte el problema en el de una UART conocida." }
    escalera: ["¿Cuál expone ficheros sin escribir software de ordenador?"]
    solucion: "HID, interfaz humana; CDC, puerto serie virtual; MSC, unidad de disco."

  - id: pregunta-cdc
    tipo: pregunta
    titulo: "La elección práctica"
    texto: "Una placa propia debe mandar medidas a un ordenador. ¿Qué clase?"
    libro: [256, 258]
    widget:
      tipo: figura
      figura: fig-44.9
      zonas:
        - { id: clases, rotulo: "Lista de abajo", rect: [3, 140, 445, 60], texto: "Las tres clases más útiles." }
    opciones:
      - { texto: "CDC, si basta", bien: true, porque: "Es lo más simple y lo que menos problemas da: un puerto serie virtual." }
      - { texto: "Una clase propia con su controlador", porque: "Obliga a escribir un controlador: justo lo que las clases evitan." }
      - { texto: "MSC siempre", porque: "Sirve para exponer ficheros; para un flujo de medidas, CDC es más directa." }
    escalera: ["¿Qué clase usa cualquier placa de desarrollo?"]
    solucion: "CDC: si basta, usar CDC."

  - id: prediga-corriente
    tipo: predecir
    titulo: "Más corriente sin pedirla"
    texto: "Un dispositivo USB 2.0 consume 500 mA nada más conectarse, sin negociarlos. ¿Qué pasa?"
    libro: [260]
    widget:
      tipo: figura
      figura: fig-44.9
      zonas:
        - { id: descriptores, rotulo: "Tercer recuadro de arriba", rect: [231, 24, 100, 55], texto: "Cuánta corriente: se pregunta aquí." }
    opciones:
      - { texto: "A menudo funciona, y a veces el puerto se desconecta", bien: true, porque: "Solo hay 100 mA garantizados al conectar: los 500 mA se solicitan en la enumeración." }
      - { texto: "Nunca funciona", porque: "Es una violación del estándar que a menudo funciona: por eso engaña." }
      - { texto: "Funciona siempre: USB da 500 mA", porque: "Al conectar solo garantiza 100 mA; el resto hay que pedirlo y que el host lo conceda." }
    escalera: ["¿Cuánta corriente garantiza USB 2.0 antes de la enumeración?"]
    solucion: "A menudo funciona y a veces el puerto se desconecta: hay que pedirlos en la enumeración."

  - id: pregunta-usbc
    tipo: pregunta
    titulo: "Un montaje USB-C que no arranca"
    texto: "Un montaje propio con conector USB-C no se alimenta con ciertos cables o adaptadores. ¿Qué falta?"
    libro: [262]
    widget:
      tipo: figura
      figura: fig-44.9
      zonas:
        - { id: deteccion, rotulo: "Primer recuadro de arriba", rect: [3, 24, 100, 55], texto: "Lo primero: que el host vea algo." }
    opciones:
      - { texto: "Las resistencias del pin CC, que anuncian el papel y la corriente", bien: true, porque: "Sin ellas no se alimenta: un fallo muy común en montajes propios." }
      - { texto: "Un controlador de Power Delivery", porque: "PD negocia tensiones mayores; para 5 V basta con las resistencias del CC." }
      - { texto: "Un descriptor de corriente", porque: "Los descriptores llegan después; sin alimentación no hay enumeración." }
    escalera: ["¿Qué pin de USB-C anuncia quién es host y cuánta corriente hay?"]
    solucion: "Las resistencias del pin CC."

  - id: porque-fisico
    tipo: porque
    titulo: "El nivel físico"
    texto: "En un diseño propio, ¿por qué las resistencias de identificación de velocidad deben tener los valores exactos?"
    libro: [264, 265]
    widget:
      tipo: figura
      figura: fig-44.9
      zonas:
        - { id: reset, rotulo: "Segundo recuadro de arriba", rect: [117, 24, 100, 55], texto: "Reset y velocidad." }
    opciones:
      - { texto: "Le dicen al host a qué velocidad hablar", bien: true, porque: "Son parte del estándar, como el par diferencial de 90 Ω con longitudes igualadas." }
      - { texto: "Limitan la corriente del dispositivo", porque: "La corriente se negocia en la enumeración; estas resistencias identifican la velocidad." }
      - { texto: "Son la terminación del bus, como en CAN", porque: "Identifican la velocidad; el par USB, además, es de 90 Ω diferenciales." }
    escalera: ["¿Cómo sabe el host a qué velocidad hablar con un dispositivo nuevo?"]
    solucion: "Le dicen al host a qué velocidad hablar."

  - id: empareje-cuando
    tipo: pregunta
    fase: "Empareje"
    titulo: "Cuándo usarlo"
    texto: "Una cada situación con la solución del libro."
    libro: [267, 268, 269]
    emparejar:
      - ["Con un ordenador, caudal alto", "USB"]
      - ["Entre dos microcontroladores", "UART o SPI"]
      - ["Entorno industrial ruidoso", "RS-485 o CAN"]
      - ["Microcontrolador y ordenador, sin USB en el firmware", "Conversor USB-serie"]
    exito: "El conversor USB-serie es lo que llevan casi todas las placas de desarrollo."
    pistas:
      - { texto: "USB tampoco va más allá de unos metros." }
    escalera: ["¿Cuál evita implementar USB en el microcontrolador?"]
    solucion: "Ordenador, USB; dos micros, UART o SPI; ruido, RS-485 o CAN; sin USB en firmware, conversor."

  - id: ordene-banco
    tipo: pregunta
    fase: "Ordene"
    titulo: "Diagnosticar USB"
    texto: "Ordene los tres pasos del diagnóstico."
    libro: [271, 272]
    ordenar:
      - "La alimentación en el conector."
      - "Si el sistema operativo detecta algo."
      - "D+ y D− en el osciloscopio, en modo diferencial."
    exito: "El orden distingue los tres fallos típicos: cable o alimentación, nivel físico y descriptores."
    pistas:
      - { texto: "Sin alimentación, nada de lo demás tiene sentido." }
    escalera: ["Empiece por lo que se mide con el multímetro."]
    solucion: "Alimentación, detección en el sistema y actividad en D+ y D−."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [244, 247, 252, 258]
    ideas:
      - { titulo: "Sin configuración.", texto: "El host pregunta; el dispositivo se describe con sus descriptores." }
      - { titulo: "Asimetría.", texto: "Un host gobierna; dos dispositivos no hablan entre sí." }
      - { titulo: "Diagnóstico.", texto: "Si no aparece, casi siempre falla la enumeración." }
      - { titulo: "Clases.", texto: "Si CDC basta, usar CDC." }
