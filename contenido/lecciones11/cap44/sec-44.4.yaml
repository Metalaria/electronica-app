# Lección 1.2 de la sección 45.4 «I²C: Dos Hilos para Muchos» (cap44; etiqueta interna sec-44.4).
# Formato: contenido/lecciones11/GUIA.md (§11). El drenador abierto (bloques 112–113) es una Y cableada: cada
# dispositivo solo puede bajar la línea (su interruptor a 0) y el pull-up la sube si todos la sueltan (a 1); se dibuja
# con una AND de tres entradas, una por dispositivo, tras el «buf» de su salida. El bus bloqueado (bloque 127) es la
# salida de un esclavo atascada a 0. El flanco de subida (bloque 122, figura 45.7) es la carga RC del modelo con 200 pF;
# el nivel alto válido del 70 % de VDD es el de la norma citada en la sección 45.13 (bloque 407).
# 1.2.1 («aprender haciendo», GUIA §13): el drenador abierto usa las piezas `od` y `bus` con un objetivo; el inicio, el
# pull-up que fija el nivel y el estiramiento se tocan; el ACK se marca en el cronograma (dirección de la EEPROM de la
# figura 45.6 y el bit de escritura); el pull-up se elige con un objetivo y la constante de tiempo se escribe. Quedan
# dos preguntas de opciones: el pull-up pequeño y la recuperación del bus. I3C y el banco van en los textos de éxito.
leccion: cap44/sec-44.4

libro:
  112: "ambas en drenador abierto con resistencias de pull-up"
  113: "cualquiera puede poner un cero forzando la línea a masa, nadie puede forzar un uno"
  115: "Condición de inicio: SDA baja mientras SCL está alto."
  116: "Dirección de 7 bits más el bit de lectura/escritura."
  117: "el esclavo baja SDA durante el noveno pulso"
  118: "Bytes de datos, cada uno con su ACK."
  119: "Condición de parada: SDA sube con SCL alto."
  122: "Con 10 kΩ y 200 pF, la constante es de 2 µs, inservible a 400 kHz."
  123: "el dispositivo no consigue bajar la línea por debajo del nivel bajo válido"
  124: "El margen práctico: 2,2 a 4,7 kΩ a 100 kHz, y 1 a 2,2 kΩ a 400 kHz."
  125: "la capacidad total no debe superar los 400 pF"
  127: "puede estar manteniendo SDA bajo, y entonces ninguna transferencia posterior funciona"
  128: "generar hasta nueve pulsos de reloj manualmente hasta que SDA se libere, y después una condición de parada"
  129: "la solución es un multiplexor de I²C o un segundo bus"
  130: "Ausencia de ACK: dirección equivocada, dispositivo sin alimentar, o pull-ups ausentes."
  131: "un esclavo lento mantiene SCL bajo para pedir tiempo"
  133: "un bus a 3,3 V puede hablar con dispositivos de 5 V si sus entradas admiten 3,3 V como nivel alto"
  134: "hacen falta traductores, y los de I²C son específicos porque deben ser bidireccionales"
  136: "el reloj llega a 12,5 MHz en el modo normal (SDR)"
  140: "Con el multímetro, sin actividad: ambas líneas deben estar en alto."
  141: "mirar la forma del flanco de subida"
  142: "decodificar la trama y comprobar si hay ACK"
  143: "condiciones de START y STOP marcadas por transiciones de SDA mientras SCL está alto"
  144: "Flanco de subida de I²C según los pull-ups"
  "cap44#407": "La norma especifica el tiempo entre el 30 % y el 70 % de VDD"

modelo:
  valores:
    R_p: { sim: "R_{p}", nombre: "resistencia de pull-up", unidad: Ω, valor: 4700 }
    C_bus: { sim: "C", nombre: "capacidad del bus", unidad: F, valor: 200e-12 }
    V_dd: { sim: "V_{DD}", nombre: "alimentación del bus", unidad: V, valor: 3.3 }
  calculos:
    tau_i2c: { expr: "R_p*C_bus", sim: "τ", nombre: "constante de tiempo", unidad: s, cifras: 2 }
    v_alto: { expr: "0.7*V_dd", sim: "V_{IH}", nombre: "nivel alto válido", unidad: V, cifras: 3 }
    t_alto: { expr: "R_p*C_bus*ln(1/0.3)", sim: "t", nombre: "tiempo hasta el nivel alto válido", unidad: s, cifras: 2 }
    t_medio: { expr: "1/(2*400000)", sim: "T/2", nombre: "medio bit a 400 kHz", unidad: s, cifras: 3 }

tarjetas:
  - id: explore-drenador
    tipo: explorar
    titulo: "Nadie fuerza un uno"
    texto: "Cada dispositivo solo puede bajar la línea; el pull-up la sube cuando todos la sueltan. Ponga SDA a cero sin que el maestro la baje."
    libro: [112, 113]
    widget:
      tipo: logica
      entradas: [{ id: M, valor: 1, rotulo: "Maestro suelta" }, { id: S, valor: 1, rotulo: "Sensor suelta" }, { id: E, valor: 1, rotulo: "EEPROM suelta" }]
      piezas:
        - { id: om, tipo: od, entradas: [M], rotulo: "Maestro" }
        - { id: os, tipo: od, entradas: [S], rotulo: "Sensor" }
        - { id: oe, tipo: od, entradas: [E], rotulo: "EEPROM" }
        - { id: linea, tipo: bus, entradas: [om, os, oe], pullup: 1 }
      salidas:
        - { id: SDA, de: linea }
    objetivo:
      condiciones:
        - { senal: M, valor: 1, rotulo: "El maestro suelta la línea" }
        - { led: SDA, valor: 0, rotulo: "SDA a cero" }
      logrado: "Basta uno que baje: el maestro suelta, quiere un uno, y la línea queda a cero. Sin conflicto eléctrico, por muchos dispositivos que haya."
      pistas:
        - { cuando: { senal: M, valor: 0 }, texto: "El maestro debe soltar la línea: que la baje otro." }
        - { texto: "Haga que el sensor o la EEPROM bajen la línea." }
    escalera: ["Apague el interruptor del sensor o el de la EEPROM."]
    solucion: "El sensor o la EEPROM la bajan: cualquiera pone un cero."

  - id: explore-trama
    tipo: tocar
    titulo: "La condición de inicio"
    texto: "SDA solo cambia con SCL bajo. Toque el instante en que cambia con SCL alto para empezar una transferencia."
    libro: [115, 119, 143]
    widget:
      tipo: figura
      figura: fig-44.6
      zonas:
        - { id: pullups, rotulo: "Arriba a la izquierda", rect: [25, 5, 60, 55] }
        - { id: start, rotulo: "Cronograma, a la izquierda", rect: [85, 120, 40, 95] }
        - { id: datos, rotulo: "Cronograma, en el centro", rect: [130, 120, 240, 95] }
        - { id: stop, rotulo: "Cronograma, a la derecha", rect: [368, 120, 45, 95] }
    tocar:
      bien: [start]
      porque:
        pullups: "Los pull-ups dan el nivel alto; no marcan la trama."
        datos: "Ahí SDA cambia con SCL bajo, y se lee con SCL alto."
        stop: "Ahí SDA sube con SCL alto: es la parada."
    exito: "El inicio: SDA baja con SCL alto. Es la única vez que SDA baja con el reloj alto, y por eso es inconfundible."
    escalera: ["Busque una bajada de SDA con SCL arriba."]
    solucion: "A la izquierda del cronograma: START."

  - id: ordene-trama
    tipo: marcar
    titulo: "La confirmación"
    texto: "Tras el inicio, el maestro envía la dirección de 7 bits y el bit de escritura. Marque el ciclo en que el esclavo confirma."
    libro: [116, 117, 118, 130, 142]
    widget:
      tipo: logica
      entradas: [{ id: SCL, reloj: true }, SDA]
      piezas:
        - { id: rx, tipo: buf, entradas: [SDA], rotulo: "Línea" }
      salidas:
        - { id: L, de: rx }
      cronograma: { ciclos: 9, estimulo: { SDA: "101000000" }, senales: [SCL, SDA] }
    marcar:
      cronograma: true
      ciclo: 9
      senal: SDA
      rotulo: "El ciclo del ACK"
      porque:
        7: "Ese es el último bit de la dirección."
        8: "Ese es el bit de lectura o escritura: el ACK viene después."
    exito: "El noveno pulso: el esclavo baja SDA. Si no, no hay nadie en esa dirección, o está sin alimentar, o faltan los pull-ups."
    escalera: ["Siete bits de dirección y uno de lectura o escritura: ¿qué pulso viene después?"]
    solucion: "El noveno ciclo: el ACK."

  - id: explore-flanco
    tipo: explorar
    titulo: "El flanco lo dan los pull-ups"
    texto: "La línea se carga a través del pull-up contra los 200 pF del bus. Elija uno con el que cruce el nivel alto válido antes de medio bit a 400 kHz."
    libro: [122, 124, 136, 144, "cap44#407"]
    inicio: { R_p: 10000 }
    widget:
      tipo: grafica
      x: { id: t, min: 0, max: 0.000006, unidad: s, rotulo: "t" }
      y: { min: 0, max: 3.6, unidad: V, rotulo: "v_{SDA}" }
      curvas:
        - { expr: "V_dd*(1 - exp(-t/(R_p*C_bus)))", color: azul, rotulo: "SDA" }
        - { expr: "v_alto", color: naranja, rotulo: "nivel alto válido", discontinua: true }
      marcas:
        - { x: "t_alto", y: "v_alto", rotulo: "{{t_alto}}" }
      lectura: { valor: tau_i2c, rotulo: "Constante de tiempo" }
      datos:
        - { valor: t_alto, rotulo: "Llega al nivel alto en {{t_alto}}" }
      mandos:
        - { valor: R_p, lista: [1500, 2200, 4700, 10000], rotulo: "Pull-up, R_{p}" }
    objetivo:
      condiciones:
        - { valor: t_alto, max: 0.00000125, rotulo: "Nivel alto en {{t_alto}}" }
      logrado: "{{t_alto}}: a tiempo. El margen práctico a 400 kHz es de 1 a 2,2 kΩ. I3C pasa los datos a push-pull para dejar atrás esta exponencial."
      pistas:
        - { texto: "Con 10 kΩ la línea tarda demasiado: baje el pull-up." }
    escalera: ["Medio bit a 400 kHz son {{t_medio}}: el tiempo marcado debe ser menor."]
    solucion: "4,7 kΩ o menos: con 10 kΩ, τ = 2 µs, inservible a 400 kHz."
    comprobar:
      - { v_alto: 2.31 }
      - { con: { R_p: 10000 }, t_alto: 0.00000241 }
      - { con: { R_p: 4700 }, t_alto: 0.00000113, t_medio: 0.00000125 }

  - id: estime-tau
    tipo: leer
    titulo: "Un pull-up demasiado grande"
    texto: "Pull-up de 10 kΩ y 200 pF de bus. Calcule la constante de tiempo."
    libro: [122, 141]
    fijar: { R_p: 10000, C_bus: 200e-12 }
    widget:
      tipo: grafica
      x: { id: t, min: 0, max: 0.000006, unidad: s, rotulo: "t" }
      y: { min: 0, max: 3.6, unidad: V, rotulo: "v_{SDA}" }
      curvas:
        - { expr: "V_dd*(1 - exp(-t/(R_p*C_bus)))", color: azul, rotulo: "SDA" }
      mandos: []
    leer:
      objetivo: tau_i2c
      unidad: s
      tol: 0.03
      rotulo: "Constante de tiempo"
      errores:
        - { expr: "t_alto", texto: "Ese es el tiempo hasta el nivel alto válido; τ es R · C." }
    exito: "2 µs: inservible a 400 kHz. En el osciloscopio, una exponencial lenta que apenas llega al nivel alto es el problema más frecuente."
    escalera: ["τ = R · C, con R en ohmios y C en faradios."]
    solucion: "10 kΩ × 200 pF = 2 µs."
    comprobar:
      - { tau_i2c: 0.000002 }

  - id: porque-pequeno
    tipo: porque
    titulo: "Y si es demasiado pequeño"
    texto: "Un pull-up pequeño da flancos rápidos. ¿Por qué no se pone siempre el menor posible?"
    libro: [123, 124]
    widget:
      tipo: grafica
      x: { id: t, min: 0, max: 0.000006, unidad: s, rotulo: "t" }
      y: { min: 0, max: 3.6, unidad: V, rotulo: "v_{SDA}" }
      curvas:
        - { expr: "V_dd*(1 - exp(-t/(R_p*C_bus)))", color: azul, rotulo: "SDA" }
      lectura: { valor: tau_i2c, rotulo: "Constante de tiempo" }
      mandos:
        - { valor: R_p, lista: [1500, 2200, 4700, 10000], rotulo: "Pull-up, R_{p}" }
    opciones:
      - { texto: "El dispositivo no consigue bajar la línea al nivel bajo válido", bien: true, porque: "Su transistor de salida tiene una corriente máxima. Por eso el margen práctico es de 1 a 2,2 kΩ a 400 kHz." }
      - { texto: "Nada: cuanto más pequeño, mejor", porque: "El flanco de subida mejora, pero el de bajada exige hundir más corriente." }
      - { texto: "El flanco de subida se vuelve lento", porque: "Eso pasa con el pull-up demasiado grande." }
    escalera: ["Con la línea a cero, ¿quién absorbe la corriente del pull-up?"]
    solucion: "El dispositivo no la baja al nivel bajo válido: su transistor tiene una corriente máxima."

  - id: averia-bloqueado
    tipo: averia
    titulo: "El bus bloqueado"
    texto: "Tras un reinicio del maestro, SDA se queda bajo con todos soltando la línea. Mida con la sonda y diga qué esclavo la retiene."
    libro: [127, 140]
    widget:
      tipo: logica
      entradas: [{ id: M, valor: 1, rotulo: "Maestro" }, { id: S, valor: 1, rotulo: "Sensor" }, { id: E, valor: 1, rotulo: "EEPROM" }]
      piezas:
        - { id: sal-m, tipo: buf, entradas: [M], rotulo: "Salida del maestro" }
        - { id: sal-s, tipo: buf, entradas: [S], rotulo: "Salida del sensor" }
        - { id: sal-e, tipo: buf, entradas: [E], rotulo: "Salida de la EEPROM" }
        - { id: linea, tipo: and, entradas: [sal-m, sal-s, sal-e], rotulo: "Línea con pull-up" }
      salidas:
        - { id: SDA, de: linea }
    averia:
      sospechosos:
        - { id: sal-s, rotulo: "El sensor" }
        - { id: sal-e, rotulo: "La EEPROM" }
      fallos:
        - { id: sensor-bajo, pieza: sal-s, tipo: atascada-0, texto: "El sensor quedó a mitad de una transferencia y mantiene SDA bajo: ninguna transferencia posterior funciona." }
        - { id: eeprom-baja, pieza: sal-e, tipo: atascada-0, texto: "La EEPROM quedó a mitad de una transferencia y mantiene SDA bajo." }
      eleccion: fija
      preguntar_tipo: false
    exito: "Con el multímetro, sin actividad, ambas líneas deben estar en alto: una baja delata un bus bloqueado."
    escalera:
      - "Con todos los interruptores a uno, mida la salida de cada dispositivo."
      - "La que está a cero sin que su dispositivo baje la línea es la culpable."
    solucion: "La salida que mide cero con su interruptor a uno: ese esclavo retiene SDA."

  - id: pregunta-recuperar
    tipo: pregunta
    titulo: "Recuperar el bus"
    texto: "Un esclavo mantiene SDA bajo tras un reinicio del maestro. ¿Cómo se libera, sin tocar el hardware?"
    libro: [128]
    widget:
      tipo: figura
      figura: fig-44.7
      zonas:
        - { id: bloqueado, rotulo: "Recuadro rojo, arriba a la derecha", rect: [255, 25, 195, 55], texto: "El bus bloqueado y su recuperación." }
    opciones:
      - { texto: "Hasta nueve pulsos de SCL y después una parada", bien: true, porque: "Así el esclavo termina su byte y suelta SDA. Diez líneas de código que salvan un producto en campo." }
      - { texto: "Esperar: se libera solo", porque: "No: el esclavo espera los pulsos que le faltan, y ninguna transferencia funciona." }
      - { texto: "Una condición de inicio", porque: "Con SDA retenida a cero no se puede generar: hay que dar antes los pulsos de reloj." }
    escalera: ["El esclavo se quedó esperando pulsos de reloj de su transferencia."]
    solucion: "Hasta nueve pulsos de reloj hasta que SDA se libere, y luego una parada."

  - id: pregunta-niveles
    tipo: tocar
    titulo: "Un dispositivo de 5 V"
    texto: "Un bus a 3,3 V puede hablar con un dispositivo de 5 V si sus entradas admiten 3,3 V como nivel alto. Toque lo que fija ese nivel."
    libro: [133, 134]
    widget:
      tipo: figura
      figura: fig-44.6
      zonas:
        - { id: pullups, rotulo: "Arriba a la izquierda", rect: [25, 5, 60, 55] }
        - { id: dispositivos, rotulo: "Las cajas del centro", rect: [110, 40, 290, 70] }
        - { id: cronograma, rotulo: "Abajo", rect: [55, 120, 370, 100] }
    tocar:
      bien: [pullups]
      porque:
        dispositivos: "Ninguno puede forzar un uno: solo bajan la línea."
        cronograma: "Es la trama; el nivel alto lo pone otro."
    exito: "Los pull-ups, conectados a la tensión que se quiera. Si la entrada no admite 3,3 V, hacen falta traductores bidireccionales."
    escalera: ["¿Quién sube la línea cuando todos la sueltan?"]
    solucion: "Los pull-ups, arriba a la izquierda."

  - id: empareje-problemas
    tipo: tocar
    titulo: "Un esclavo lento"
    texto: "Un esclavo lento mantiene SCL bajo para pedir tiempo, y un maestro por software no lo espera. Toque el problema."
    libro: [129, 131]
    widget:
      tipo: figura
      figura: fig-44.7
      zonas:
        - { id: bloqueado, rotulo: "Primer recuadro de la derecha", rect: [255, 25, 195, 55] }
        - { id: duplicadas, rotulo: "Segundo recuadro de la derecha", rect: [255, 85, 195, 42] }
        - { id: ack, rotulo: "Tercer recuadro de la derecha", rect: [255, 131, 195, 42] }
        - { id: estiramiento, rotulo: "Cuarto recuadro de la derecha", rect: [255, 177, 195, 42] }
    tocar:
      bien: [estiramiento]
      porque:
        bloqueado: "En el bus bloqueado es SDA la que queda baja, y nada funciona."
        duplicadas: "Eso es tener dos sensores de dirección fija iguales."
        ack: "Sin ACK, el esclavo no responde; aquí responde, pero lento."
    exito: "El estiramiento del reloj: es parte del estándar, y muchos maestros por software no lo implementan."
    escalera: ["¿Qué línea retiene el esclavo?"]
    solucion: "El cuarto recuadro: el estiramiento del reloj."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [113, 122, 124, 125, 128, 129]
    ideas:
      - { titulo: "Drenador abierto.", texto: "Cualquiera pone un cero, nadie fuerza un uno: el pull-up da el alto." }
      - { titulo: "Pull-ups.", texto: "Grandes, flanco lento; pequeños, no baja. De 1 a 2,2 kΩ a 400 kHz." }
      - { titulo: "Bloqueo.", texto: "Hasta nueve pulsos de reloj y una parada liberan SDA." }
      - { titulo: "Capacidad.", texto: "No más de 400 pF: un bus de placa." }
