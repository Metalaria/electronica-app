# Lección 1.2 de la sección 45.9 «Buses Especializados: 1-Wire e I²S» (cap44; etiqueta interna sec-44.7).
# Formato: contenido/lecciones11/GUIA.md (§11). Figura 45.13 (44.10.svg, svg_vista 453,6 × 198): 1-Wire a la
# izquierda, I²S a la derecha. Las tres líneas de I²S (bloque 283) se ven en pequeño en un cronograma: BCLK es el
# reloj y WS sale de un contador de tres bits (cambia de canal cada cuatro bits); el tamaño de palabra es de ejemplo.
# 1.2.1 («aprender haciendo», GUIA §13): los recuadros de la figura se tocan (la causa del fallo, el identificador, la
# temporización, el bus dedicado y las líneas del banco); WS se consigue con pulsos y se dibuja. Queda una pregunta de
# opciones: quién genera el reloj. SMBus, LIN, Modbus y RS-232 van al resumen.
leccion: cap44/sec-44.7

libro:
  276: "un sensor de temperatura a treinta metros con dos hilos en lugar de cuatro"
  277: "el maestro debe mantener la línea en alto con un pull-up fuerte o el dispositivo se queda sin energía a medias"
  278: "el sensor responde a la lectura de su identificador y falla al pedirle una medida"
  279: "Cada dispositivo tiene un identificador único de 64 bits grabado de fábrica"
  280: "es lento (unos 16 kbit/s) y su temporización es estricta"
  283: "WS (word select): indica si el dato es del canal izquierdo o derecho, y su frecuencia es la de muestreo."
  284: "cualquier irregularidad en la temporización se traduce en jitter y con él en distorsión"
  285: "el dispositivo que lo genera impone su calidad al sistema"
  288: "Es lo que usan las baterías inteligentes"
  289: "LIN: un bus de un hilo para automoción, mucho más lento y barato que CAN"
  290: "no es un bus físico sino un protocolo que corre sobre RS-485 o sobre TCP"
  291: "Prácticamente desaparecido de los ordenadores y muy vivo en equipos industriales y de laboratorio."
  293: "si el problema es exactamente el suyo, son la respuesta; si no, un bus general será más fácil"
  296: "un maestro implementado por software con interrupciones activas los incumple con facilidad"
  297: "Un desajuste entre ambos produce audio con ruido o con los canales intercambiados"
  298: "1-Wire e I²S con sus rasgos característicos."

modelo: { valores: {}, calculos: {} }

tarjetas:
  - id: explore-nicho
    tipo: tocar
    titulo: "Un fallo desconcertante"
    texto: "1-Wire lleva datos y alimentación por un hilo más la masa. Un sensor responde al leer su identificador y falla al pedirle una temperatura: toque la causa."
    libro: [276, 277, 278, 298]
    widget:
      tipo: figura
      figura: fig-44.10
      zonas:
        - { id: parasita, rotulo: "Primer recuadro de la izquierda", rect: [3, 20, 218, 42] }
        - { id: fallo, rotulo: "Segundo recuadro de la izquierda", rect: [3, 66, 218, 42] }
        - { id: id64, rotulo: "Tercer recuadro de la izquierda", rect: [3, 113, 218, 42] }
        - { id: lento, rotulo: "Cuarto recuadro de la izquierda", rect: [3, 158, 218, 36] }
    tocar:
      bien: [parasita]
      porque:
        fallo: "Ese recuadro describe el síntoma; toque lo que lo causa."
        id64: "El identificador responde bien: no es el problema."
        lento: "La lentitud no cambia entre leer el identificador y medir."
    exito: "La alimentación parásita: la conversión consume, y sin un pull-up fuerte que mantenga la línea en alto se queda sin energía a medias."
    escalera: ["¿De dónde saca la energía el sensor mientras la línea está baja?"]
    solucion: "El primer recuadro: la alimentación parásita."

  - id: pregunta-1wire-uso
    tipo: tocar
    titulo: "Decenas en el mismo cable"
    texto: "Se cuelgan decenas de sensores 1-Wire del mismo cable sin configurar ninguna dirección. Toque lo que lo permite."
    libro: [279]
    widget:
      tipo: figura
      figura: fig-44.10
      zonas:
        - { id: parasita, rotulo: "Primer recuadro de la izquierda", rect: [3, 20, 218, 42] }
        - { id: fallo, rotulo: "Segundo recuadro de la izquierda", rect: [3, 66, 218, 42] }
        - { id: id64, rotulo: "Tercer recuadro de la izquierda", rect: [3, 113, 218, 42] }
        - { id: lento, rotulo: "Cuarto recuadro de la izquierda", rect: [3, 158, 218, 36] }
    tocar:
      bien: [id64]
      porque:
        parasita: "La alimentación parásita ahorra un hilo, no direcciones."
        fallo: "Es un fallo, no lo que permite compartir el cable."
        lento: "La velocidad no distingue a un sensor de otro."
    exito: "Un identificador único de 64 bits grabado de fábrica. El maestro los enumera con una búsqueda binaria."
    escalera: ["¿Qué distingue a cada sensor sin configurarlo?"]
    solucion: "El tercer recuadro: el identificador de 64 bits."

  - id: explore-i2s
    tipo: explorar
    titulo: "Las tres líneas de I²S"
    texto: "BCLK da un flanco por bit; WS dice si el dato es del canal izquierdo o del derecho. En pequeño, cuatro bits por canal: lleve WS al otro canal."
    libro: [283]
    widget:
      tipo: logica
      entradas: [{ id: BCLK, reloj: true }]
      piezas:
        - { id: cuenta, tipo: contador, bits: 3, entradas: [BCLK], rotulo: "Bits de la trama" }
      salidas:
        - { id: WS, de: cuenta.q2 }
    objetivo:
      condiciones:
        - { led: WS, valor: 1, rotulo: "WS en el otro canal" }
      logrado: "Tras los bits de un canal, WS cambia al otro. Una vuelta completa de WS es una muestra de cada canal."
      pistas:
        - { texto: "Dé pulsos de BCLK: un bit por pulso." }
    escalera: ["Cuatro pulsos de BCLK."]
    solucion: "Cuatro pulsos: WS pasa al otro canal."

  - id: dibuje-ws
    tipo: dibujar
    titulo: "Un canal tras otro"
    texto: "Con el mismo reparto, cuatro bits por canal, dibuje WS durante dos muestras de cada canal."
    libro: [283]
    widget:
      tipo: logica
      entradas: [{ id: BCLK, reloj: true }]
      piezas:
        - { id: cuenta, tipo: contador, bits: 3, entradas: [BCLK], rotulo: "Bits de la trama" }
      salidas:
        - { id: WS, de: cuenta.q2 }
      cronograma: { ciclos: 16, senales: [BCLK] }
      dibujo: false
    dibujar:
      senal: WS
    exito: "Una onda cuadrada: su frecuencia es la de muestreo, y BCLK da el número de pulsos de cada trama."
    escalera:
      - "WS se queda en un canal durante cuatro pulsos de BCLK."
      - "Luego cambia al otro durante otros cuatro, y vuelve."
    solucion: "Cuatro ciclos abajo, cuatro arriba, y otra vez."

  - id: porque-reloj-continuo
    tipo: tocar
    titulo: "Por qué un bus dedicado"
    texto: "I²S tiene un reloj continuo y una trama estrictamente periódica, cosa que un bus genérico no garantiza. Toque la razón."
    libro: [284]
    widget:
      tipo: figura
      figura: fig-44.10
      zonas:
        - { id: lineas, rotulo: "Primer recuadro de la derecha", rect: [228, 20, 222, 50] }
        - { id: dedicado, rotulo: "Segundo recuadro de la derecha", rect: [228, 74, 222, 42] }
        - { id: reloj, rotulo: "Tercer recuadro de la derecha", rect: [228, 120, 222, 45] }
    tocar:
      bien: [dedicado]
      porque:
        lineas: "Las tres líneas son el cómo; la razón está en otro recuadro."
        reloj: "Quién genera el reloj es una decisión de diseño, no la razón del bus."
    exito: "El audio es un flujo regular: cualquier irregularidad en la temporización se traduce en jitter, y con él en distorsión."
    escalera: ["¿Qué le hace al sonido un reloj irregular?"]
    solucion: "El segundo recuadro de la derecha."

  - id: pregunta-quien-reloj
    tipo: pregunta
    titulo: "Quién genera el reloj"
    texto: "Un microcontrolador y un convertidor de audio de calidad por I²S. ¿Quién debe generar el reloj?"
    libro: [285]
    widget:
      tipo: figura
      figura: fig-44.10
      zonas:
        - { id: reloj, rotulo: "Recuadro verde de la derecha", rect: [228, 120, 222, 45], texto: "El que genera el reloj." }
    opciones:
      - { texto: "El convertidor, desde su propio cristal, con el microcontrolador de esclavo", bien: true, porque: "El que genera el reloj impone su calidad: así el jitter es el mejor posible." }
      - { texto: "El microcontrolador, que es el maestro", porque: "Su reloj suele ser peor; la calidad la impone quien lo genera." }
      - { texto: "Da igual", porque: "No da igual: el jitter del reloj se traduce en distorsión." }
    escalera: ["¿Quién tiene el mejor cristal para audio?"]
    solucion: "El convertidor, desde su cristal; el microcontrolador, esclavo."

  - id: pregunta-banco
    tipo: tocar
    titulo: "En el banco"
    texto: "Un audio I²S suena con ruido o con los canales intercambiados. Toque lo que hay que comprobar con el osciloscopio."
    libro: [297]
    widget:
      tipo: figura
      figura: fig-44.10
      zonas:
        - { id: lineas, rotulo: "Primer recuadro de la derecha", rect: [228, 20, 222, 50] }
        - { id: dedicado, rotulo: "Segundo recuadro de la derecha", rect: [228, 74, 222, 42] }
        - { id: reloj, rotulo: "Tercer recuadro de la derecha", rect: [228, 120, 222, 45] }
    tocar:
      bien: [lineas]
      porque:
        dedicado: "Explica por qué existe el bus; lo que se mide son sus líneas."
        reloj: "Quién lo genera fija la calidad, pero el síntoma apunta a la relación entre dos líneas."
    exito: "Que WS va a la frecuencia de muestreo y BCLK da el número correcto de pulsos por trama: un desajuste da esos síntomas."
    escalera: ["¿Qué dos líneas deben estar en proporción?"]
    solucion: "Las tres líneas: WS y BCLK."

  - id: porque-software
    tipo: tocar
    titulo: "Un maestro 1-Wire por software"
    texto: "Un maestro 1-Wire hecho por software falla de vez en cuando, sobre todo con otras interrupciones activas. Toque el rasgo que lo explica."
    libro: [280, 296]
    widget:
      tipo: figura
      figura: fig-44.10
      zonas:
        - { id: parasita, rotulo: "Primer recuadro de la izquierda", rect: [3, 20, 218, 42] }
        - { id: fallo, rotulo: "Segundo recuadro de la izquierda", rect: [3, 66, 218, 42] }
        - { id: id64, rotulo: "Tercer recuadro de la izquierda", rect: [3, 113, 218, 42] }
        - { id: lento, rotulo: "Cuarto recuadro de la izquierda", rect: [3, 158, 218, 36] }
    tocar:
      bien: [lento]
      porque:
        parasita: "La alimentación falla al convertir, no según las interrupciones."
        fallo: "Ese fallo es de energía, no de interrupciones."
        id64: "Los identificadores son únicos: no dependen del software."
    exito: "Pulsos de decenas de microsegundos con tiempos estrictos: una interrupción los alarga. Se depura con el osciloscopio, mirando la temporización."
    escalera: ["¿Qué le pasa a un pulso de decenas de microsegundos si llega una interrupción a mitad?"]
    solucion: "El cuarto recuadro: la temporización estricta."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [277, 279, 285, 288, 289, 290, 291, 293]
    ideas:
      - { titulo: "1-Wire.", texto: "Un hilo y masa; alimentación parásita con pull-up fuerte al convertir." }
      - { titulo: "Sin direcciones.", texto: "Un identificador único de 64 bits de fábrica." }
      - { titulo: "I²S.", texto: "BCLK, WS y SD; quien genera el reloj impone su calidad." }
      - { titulo: "Nicho.", texto: "SMBus, LIN, Modbus o RS-232: si el problema es exactamente el suyo, son la respuesta." }
