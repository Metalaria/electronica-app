# Lección 1.2 de la sección 45.14 «Ampliación: Fibra Óptica» (cap44; etiqueta interna sec-44.12).
# Formato: contenido/lecciones11/GUIA.md (§11). El presupuesto de enlace (bloques 435–436) con los valores de la
# figura 45.17 (44.14.svg): emisor a 0 dB, dos conectores de 0,5 dB, un empalme de 0,1 dB, fibra de 0,2 dB/km
# (bloque 425), margen de 3 dB y receptor de −8 dB de sensibilidad; con 10 km quedan −6,1 dB y sobran 1,9 dB. La
# foto 45.18 (img/foto_fibra.jpg, 1600 × 643 px): la roseta a la izquierda, el conector MIC a la derecha.
leccion: cap44/sec-44.12

libro:
  424: "una sola fibra transporta terabits con multiplexación por longitud de onda"
  425: "0,2 dB/km frente a los decibelios por metro de un coaxial"
  426: "no capta ni emite, y no crea bucles de tierra"
  427: "no propaga sobretensiones"
  429: "Los conectores y su limpieza, que es la causa número uno de fallos"
  430: "El radio de curvatura, por debajo del cual la luz escapa."
  432: "No transporta energía, así que el equipo remoto necesita su propia alimentación."
  435: "potencia emitida − pérdidas > sensibilidad del receptor"
  436: "empalmes (0,1 dB) y un margen para envejecimiento, temperatura y futuras reparaciones, típicamente 3 dB"
  437: "un enlace calculado sin él funcionará el primer día y fallará tras el primer empalme de reparación"
  439: "monomodo o multimodo, y no son intercambiables"
  440: "un módulo de largo alcance en un enlace corto puede saturar el receptor. Hace falta un atenuador."
  442: "núcleo de plástico de 1 mm, LED rojo en lugar de láser"
  443: "Es la fibra de los enlaces de audio digital ópticos."
  445: "Un enlace óptico se diagnostica con medidor de potencia en ambos extremos"
  446: "limpiar los conectores —que arregla más fallos que cualquier otra acción—"
  447: "Presupuesto de un enlace óptico con sus pérdidas acumuladas y el margen."
  448: "la fibra se enrolla respetando su radio mínimo de curvatura"

modelo:
  valores:
    L_f: { sim: "L", nombre: "longitud de la fibra", unidad: m, valor: 10000 }
    a_km: { sim: "α", nombre: "atenuación de la fibra por kilómetro", unidad: dB, valor: 0.2 }
    n_con: { sim: "n", nombre: "conectores", valor: 2 }
    a_con: { sim: "a_{con}", nombre: "pérdida de cada conector", unidad: dB, valor: 0.5 }
    a_emp: { sim: "a_{emp}", nombre: "pérdida del empalme", unidad: dB, valor: 0.1 }
    margen: { sim: "M", nombre: "margen", unidad: dB, valor: 3 }
    sens: { sim: "S", nombre: "sensibilidad del receptor", unidad: dB, valor: -8 }
  calculos:
    perdidas: { expr: "a_km*L_f/1000 + n_con*a_con + a_emp + margen", sim: "pérdidas", nombre: "pérdidas con el margen", unidad: dB, cifras: 2 }
    p_rx: { expr: "-(a_km*L_f/1000 + n_con*a_con + a_emp + margen)", sim: "P", nombre: "potencia tras pérdidas y margen", unidad: dB, cifras: 2 }
    sobra: { expr: "-(a_km*L_f/1000 + n_con*a_con + a_emp + margen) - sens", sim: "sobra", nombre: "lo que sobra sobre la sensibilidad", unidad: dB, cifras: 2 }
    p_fibra: { expr: "a_km*L_f/1000", sim: "fibra", nombre: "pérdida de la fibra", unidad: dB, cifras: 2 }

tarjetas:
  - id: explore-practica
    tipo: explorar
    titulo: "La fibra en la práctica"
    texto: "La fibra no capta ni emite, y no propaga sobretensiones; a cambio, pide cuidado. Toque las dos fotos."
    libro: [426, 427, 448]
    widget:
      tipo: figura
      figura: fig-44.15
      zonas:
        - { id: roseta, rotulo: "Foto de la izquierda", rect: [0, 0, 790, 600], texto: "Una roseta doméstica: la fibra se enrolla respetando su radio mínimo de curvatura y acaba en un conector SC/APC." }
        - { id: mic, rotulo: "Foto de la derecha", rect: [810, 0, 790, 600], texto: "Un conector dúplex MIC de la red FDDI, hoy sustituido por el LC dúplex." }
    requiere: { mover: [roseta, mic] }

  - id: empareje-ventajas
    tipo: pregunta
    fase: "Empareje"
    titulo: "Por qué cambia las reglas"
    texto: "Una cada ventaja de la fibra frente al cobre con su porqué."
    libro: [424, 425, 426, 427]
    emparejar:
      - ["Ancho de banda", "Terabits por una fibra, multiplexando longitudes de onda"]
      - ["Distancia", "0,2 dB/km frente a dB por metro del coaxial"]
      - ["Inmunidad", "No capta ni emite, sin bucles de tierra"]
      - ["Seguridad", "No propaga sobretensiones entre edificios"]
    exito: "Ideal entre edificios o con riesgo de rayo."
    pistas:
      - { texto: "Un rayo es una sobretensión." }
    escalera: ["¿Cuál tiene que ver con los decibelios por kilómetro?"]
    solucion: "Ancho de banda, terabits; distancia, 0,2 dB/km; inmunidad, ni capta ni emite; seguridad, sin sobretensiones."

  - id: explore-presupuesto
    tipo: explorar
    titulo: "El presupuesto de enlace"
    texto: "Potencia emitida menos pérdidas debe quedar por encima de la sensibilidad. Arrastre la longitud de la fibra y mire lo que sobra."
    libro: [435, 436, 447]
    widget:
      tipo: grafica
      x: { id: ll, min: 0, max: 25000, unidad: m, rotulo: "L" }
      y: { min: -12, max: 0, unidad: dB, rotulo: "potencia relativa" }
      curvas:
        - { expr: "-(a_km*ll/1000 + n_con*a_con + a_emp + margen)", color: azul, rotulo: "tras pérdidas y margen" }
        - { expr: "sens", color: naranja, rotulo: "sensibilidad", discontinua: true }
      asas:
        - { mueve: L_f, x: "L_f", y: "p_rx", rotulo: "Su enlace" }
      lectura: { valor: sobra, rotulo: "Sobra" }
      datos:
        - { valor: p_rx, rotulo: "Tras pérdidas y margen: {{p_rx}}" }
      mandos:
        - { valor: L_f, min: 1000, max: 25000, paso: 500, rotulo: "Longitud de la fibra" }
    requiere: { mover: [L_f] }

  - id: estime-sobra
    tipo: pregunta
    fase: "Estime"
    titulo: "El enlace de la figura"
    texto: "Dos conectores de 0,5 dB, 10 km de fibra a 0,2 dB/km, un empalme de 0,1 dB y 3 dB de margen, con un receptor de −8 dB. ¿Cuánto sobra?"
    libro: [425, 436, 447]
    fijar: { L_f: 10000, n_con: 2, a_con: 0.5, a_emp: 0.1, margen: 3, sens: -8 }
    estimar:
      objetivo: "sobra"
      unidad: dB
      min: 0
      max: 6
      paso: 0.1
      inicio: 4.9
      tol: 0.03
      rotulo: "Sobra"
    exito: "Las pérdidas con el margen suman 6,1 dB: sobran 1,9 dB y el enlace funciona."
    pistas:
      - { cuando: { valor: estimacion, mayor: 1.96 }, texto: "Demasiado: ¿ha restado los 3 dB de margen y los 2,0 dB de la fibra?" }
      - { texto: "Demasiado poco: sume 0,5 + 2,0 + 0,1 + 0,5 + 3 y réstelo de los 8 dB." }
    escalera: ["Sume todas las pérdidas, margen incluido, y compárelas con los −8 dB."]
    solucion: "8 − 6,1 = 1,9 dB."
    comprobar:
      - { sobra: 1.9, perdidas: 6.1, p_fibra: 2.0 }

  - id: ajuste-longitud
    tipo: ajuste
    titulo: "Hasta dónde llega"
    texto: "Con los mismos conectores, empalme, margen y receptor, alargue la fibra hasta que casi no sobre nada."
    libro: [435, 436]
    fijar: { n_con: 2, a_con: 0.5, a_emp: 0.1, margen: 3, sens: -8 }
    inicio: { L_f: 10000 }
    widget:
      tipo: grafica
      x: { id: ll, min: 0, max: 25000, unidad: m, rotulo: "L" }
      y: { min: -12, max: 0, unidad: dB, rotulo: "potencia relativa" }
      curvas:
        - { expr: "-(a_km*ll/1000 + n_con*a_con + a_emp + margen)", color: azul, rotulo: "tras pérdidas y margen" }
        - { expr: "sens", color: naranja, rotulo: "sensibilidad", discontinua: true }
      asas:
        - { mueve: L_f, x: "L_f", y: "p_rx", rotulo: "Su enlace" }
      lectura: { valor: sobra, rotulo: "Sobra" }
      mandos:
        - { valor: L_f, min: 1000, max: 25000, paso: 500, rotulo: "Longitud de la fibra" }
    ajuste:
      valor: sobra
      min: 0
      max: 0.2
      rotulo: "Sobra"
      escala: { min: -2, max: 4 }
      bajo: "Ya no llega: acorte la fibra."
      alto: "Aún sobra potencia: alargue la fibra."
      dentro: "Al límite, con los 3 dB de margen intactos."

  - id: porque-margen
    tipo: porque
    titulo: "El margen no es opcional"
    texto: "¿Por qué se reservan unos 3 dB de margen, si el enlace ya funciona sin ellos?"
    libro: [436, 437]
    widget:
      tipo: figura
      figura: fig-44.14
      zonas:
        - { id: margen, rotulo: "Barra rayada", rect: [338, 60, 40, 70], texto: "El margen de 3 dB." }
    opciones:
      - { texto: "Sin él funciona el primer día y falla tras el primer empalme de reparación", bien: true, porque: "Cubre envejecimiento, temperatura y futuras reparaciones." }
      - { texto: "Porque lo exige el conector", porque: "El conector tiene su propia pérdida; el margen es para lo que vendrá." }
      - { texto: "Para que el receptor no se sature", porque: "La saturación es el problema contrario: sobra potencia en un enlace corto." }
    escalera: ["¿Qué le pasará al enlace a lo largo de los años?"]
    solucion: "Envejecimiento, temperatura y reparaciones: sin margen, falla tras el primer empalme."

  - id: prediga-saturacion
    tipo: predecir
    titulo: "Más potencia no siempre es mejor"
    texto: "En un enlace corto se monta un módulo de largo alcance, el de más potencia del catálogo. ¿Qué pasa?"
    libro: [440]
    widget:
      tipo: figura
      figura: fig-44.14
      zonas:
        - { id: receptor, rotulo: "Columna del receptor", rect: [392, 60, 45, 120], texto: "El receptor." }
    opciones:
      - { texto: "Puede saturar el receptor: hace falta un atenuador", bien: true, porque: "Un fallo desconcertante, porque más potencia parece siempre mejor." }
      - { texto: "Funciona mejor, con más margen", porque: "El receptor tiene un máximo además de su sensibilidad: con demasiada luz se satura." }
      - { texto: "Nada: la fibra absorbe lo que sobra", porque: "En un enlace corto la fibra apenas atenúa: casi todo llega al receptor." }
    escalera: ["¿Tiene el receptor solo un mínimo de potencia?"]
    solucion: "Puede saturar el receptor: se pone un atenuador."

  - id: pregunta-modulos
    tipo: pregunta
    titulo: "Los transceptores"
    texto: "Se cambia un módulo para fibra multimodo por uno para monomodo de la misma longitud de onda. ¿Funciona?"
    libro: [439]
    widget:
      tipo: figura
      figura: fig-44.15
      zonas:
        - { id: mic, rotulo: "Foto de la derecha", rect: [810, 0, 790, 600], texto: "Un conector dúplex." }
    opciones:
      - { texto: "No: monomodo y multimodo no son intercambiables", bien: true, porque: "El módulo está hecho para un tipo de fibra, una longitud de onda y un alcance." }
      - { texto: "Sí: basta con la misma longitud de onda", porque: "Además de la longitud de onda, importa el tipo de fibra." }
      - { texto: "Sí, con un atenuador", porque: "El atenuador resuelve la saturación, no el tipo de fibra." }
    escalera: ["¿Cuáles son los parámetros de un módulo?"]
    solucion: "No: monomodo y multimodo no son intercambiables."

  - id: pregunta-plastica
    tipo: pregunta
    titulo: "La fibra plástica"
    texto: "Núcleo de plástico de 1 mm, LED rojo y conectores que se montan con un cúter. ¿Dónde se usa?"
    libro: [442, 443]
    widget:
      tipo: figura
      figura: fig-44.15
      zonas:
        - { id: roseta, rotulo: "Foto de la izquierda", rect: [0, 0, 790, 600], texto: "Fibra de vidrio doméstica." }
    opciones:
      - { texto: "En los enlaces de audio digital ópticos", bien: true, porque: "Resuelve el aislamiento y la interferencia con un coste ínfimo, a decenas de metros." }
      - { texto: "Entre centrales, a decenas de kilómetros", porque: "Alcanza decenas de metros a unos megabits." }
      - { texto: "Para transportar energía al equipo remoto", porque: "Ninguna fibra transporta energía." }
    escalera: ["¿Qué alcance tiene la fibra plástica?"]
    solucion: "En los enlaces de audio digital ópticos."

  - id: pregunta-banco
    tipo: pregunta
    titulo: "Un enlace que pierde de más"
    texto: "Con el medidor de potencia en ambos extremos, la pérdida real supera a la calculada. ¿Qué se hace primero?"
    libro: [429, 430, 445, 446]
    widget:
      tipo: figura
      figura: fig-44.15
      zonas:
        - { id: roseta, rotulo: "Foto de la izquierda", rect: [0, 0, 790, 600], texto: "Conector y curvas de la fibra." }
    opciones:
      - { texto: "Limpiar los conectores", bien: true, porque: "Arregla más fallos que cualquier otra acción; después, el radio de curvatura en armarios y esquinas." }
      - { texto: "Poner un módulo de más alcance", porque: "No arregla la causa, y en un enlace corto puede saturar el receptor." }
      - { texto: "Rehacer el cálculo sin margen", porque: "El margen no es opcional: la pérdida de más tiene una causa física." }
    escalera: ["¿Cuál es la causa número uno de fallos de la fibra?"]
    solucion: "Limpiar los conectores; luego, comprobar el radio de curvatura."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [425, 432, 436, 440]
    ideas:
      - { titulo: "Ventajas.", texto: "Ancho de banda, 0,2 dB/km, inmunidad y seguridad." }
      - { titulo: "Presupuesto.", texto: "Emitida menos pérdidas, con 3 dB de margen, por encima de la sensibilidad." }
      - { titulo: "Exceso.", texto: "Un módulo potente en un enlace corto satura: atenuador." }
      - { titulo: "Energía.", texto: "No la transporta: el equipo remoto necesita la suya." }
