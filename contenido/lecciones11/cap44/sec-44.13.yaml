# Lección 1.2 de la sección 45.15 «Problemas de Diseño» (cap44; etiqueta interna sec-44.13).
# Formato: contenido/lecciones11/GUIA.md (§11). Los cuatro problemas del capítulo, en corto: 45.A (el bus I²C que
# crece: 10 pF por dispositivo y 1 pF/cm, R_máx = 300 ns/(0,8473·C)), 45.B (la polarización de 720 Ω por lado y la
# velocidad), 45.C (SPI por 2 m de cable: ida y vuelta de 20 ns frente a 50 ns) y 45.D (el nodo Modbus: polarización
# con 26 cargas unidad y 1/8 en el lazo serie R_p–Z_d–R_p de la sección 45.6; el DE; los tiempos). El ejercicio 45.6
# (bloque 513) da la duración de una trama a 9 600 bit/s.
# 1.2 (esquemas12d): el esquema `rs485` en simule-nodo (45.D) y en dos tarjetas nuevas de los ejercicios del bloque
# 513: ajuste-45-11 (63 transceptores de 1/4 y un maestro, n = 16,75: 244,5 mV con 560 Ω; R_p máxima 691 Ω) y
# pregunta-45-14 (PROFIBUS con las dos terminaciones activas y 32 cargas: 0,99 V; con un extremo apagado, 0,49 V, que
# el esquema no dibuja: su terminación sin alimentar sigue en el bus con 0 V, y por eso la tarjeta no la simula).
# 1.2.1 («aprender haciendo», GUIA §13): el bus que crece es un objetivo (que los 4,7 kΩ dejen de cumplir); el pull-up
# máximo, la polarización, la ida y vuelta del SPI, el retardo a 1 MHz y la trama se escriben; el puente de la
# terminación se toca. Quedan dos preguntas de opciones: soltar DE y PROFIBUS. 100 m a 1 Mbit/s, el ciclo con un
# nodo caído y las pruebas van al resumen.
leccion: cap44/sec-44.13

libro:
  452: "Estima 10 pF por dispositivo y 1 pF por centímetro de pista; el bus va a 3,3 V."
  456: "2724 Ω"
  458: "esos 4,7 kΩ cumplían con 4 dispositivos (por debajo de 7081) y dejaron de cumplir al llegar a 8 (por encima de 2724)"
  459: "nadie tocó los pull-up, pero el margen se consumió al añadir dispositivos y alargar pistas"
  460: "La corrección: bajar los pull-up a 1,5 kΩ"
  466: "Hay que conectar dos equipos separados 100 metros con RS-485 a 1 Mbit/s"
  470: "Hay que forzar una diferencia mínima de 200 mV con resistencias de polarización. Las dos terminaciones en paralelo dan 60 Ω"
  471: 'R = "720 Ω" space "a cada lado"'
  472: "Con el valor comercial de 680 Ω resulta una diferencia de 211 mV"
  474: "120 m"
  475: "Con 100 metros, 1 Mbit/s está cerca del límite (100 m frente a 120 m) y funcionará, pero con muy poco margen."
  482: "Un SPI que funciona perfectamente a 20 MHz dentro de la placa falla al llevarlo por un cable de 2 metros."
  485: "Con un retardo de propagación de 5 ns por metro"
  488: "El maestro muestrea después de un retardo de ida y vuelta, es decir, 20 ns con 2 metros, casi medio periodo."
  490: "A 1 MHz el retardo es el 1 % del periodo y el problema desaparece."
  493: "a 2 m y 20 MHz el retardo de ida y vuelta es del 40 % del periodo"
  496: "a 19 200 bit/s y 8E1, polarizado con 680 Ω a 5 V"
  502: "un transceptor de 3,3 V y 1/8 de carga unidad, con DE y REn unidos a una salida del microcontrolador"
  503: "con 680 Ω quedan 198,8 mV en reposo, justo por debajo de los 200 mV"
  506: "desactiva DE en la interrupción de transmisión completa, cuando ha salido el bit de parada del último byte"
  507: "16,2 ms por nodo y 422 ms por vuelta con 26 nodos: cabe en los 500 ms"
  511: "con el consejo de subir a 38 400 bit/s para tener margen con un nodo caído"
  512: "La interfaz del nodo del problema"
  "cap44#513": "La trama tiene 8 bytes de 11 bits: 88 bits, que a 9 600 bit/s duran 9,17 ms."

modelo:
  valores:
    n_disp: { sim: "n", nombre: "dispositivos", valor: 4 }
    cm_pista: { sim: "l", nombre: "centímetros de pista", valor: 10 }
    V_th: { sim: "V_{mín}", nombre: "diferencia mínima en reposo", unidad: V, valor: 0.2 }
    R_T2: { sim: "R_{T}/2", nombre: "las dos terminaciones en paralelo", unidad: Ω, valor: 60 }
    L_spi: { sim: "L", nombre: "longitud del cable", unidad: m, valor: 2 }
    f_spi: { sim: "f", nombre: "reloj del SPI", unidad: Hz, valor: 20000000 }
    V_d: { sim: "V_{CC}", nombre: "alimentación de la polarización", unidad: V, valor: 5 }
    R_pd: { sim: "R_{p}", nombre: "polarización del maestro", unidad: Ω, valor: 470 }
    n_cud: { sim: "n", nombre: "cargas unidad", valor: 26.125 }
    bytes_t: { sim: "bytes", nombre: "bytes de la trama", valor: 8 }
    v_t: { sim: "v", nombre: "velocidad", unidad: "bit/s", valor: 9600 }
    R_T: { sim: "R_{T}", nombre: "terminación", unidad: Ω, valor: 120 }
    R_p11: { sim: "R_{p}", nombre: "polarización del ejercicio 45.11", unidad: Ω, valor: 560 }
    n_11: { sim: "n", nombre: "cargas unidad del ejercicio 45.11", valor: 16.75 }
    R_pp: { sim: "R_{p}", nombre: "polarización de PROFIBUS", unidad: Ω, valor: 390 }
    R_tp: { sim: "R_{T}", nombre: "terminación de PROFIBUS", unidad: Ω, valor: 220 }
    n_pp: { sim: "n", nombre: "cargas unidad en PROFIBUS", valor: 32 }
    act: { tipo: interruptor, nombre: "terminación activa en los dos extremos", valor: 1 }
  calculos:
    C_i2c: { expr: "(10*n_disp + cm_pista)*1e-12", sim: "C", nombre: "capacidad del bus", unidad: F, cifras: 3 }
    Rmax_i2c: { expr: "3e-7/(0.8473*(10*n_disp + cm_pista)*1e-12)", sim: "R_{máx}", nombre: "pull-up máximo a 400 kHz", unidad: Ω, cifras: 4 }
    I_pol: { expr: "V_th/R_T2", sim: "I", nombre: "corriente de polarización", unidad: A, cifras: 3 }
    R_lado: { expr: "(V_d - V_th)/(V_th/R_T2)/2", sim: "R", nombre: "resistencia a cada lado", unidad: Ω, cifras: 3 }
    rel_spi: { expr: "2*L_spi*5e-9*f_spi*100", sim: "retardo", nombre: "ida y vuelta frente al periodo", unidad: "%", cifras: 2 }
    rel_ida: { expr: "L_spi*5e-9*f_spi*100", sim: "retardo", nombre: "retardo de ida frente al periodo", unidad: "%", cifras: 2 }
    Z_dd: { expr: "1/(2/120 + n_cud/24000)", sim: "Z_{d}", nombre: "bus visto entre hilos", unidad: Ω, cifras: 3 }
    I_d: { expr: "V_d/(2*R_pd + Z_dd)", sim: "I", nombre: "corriente de polarización", unidad: A }
    V_rd: { expr: "I_d*R_pd", nombre: "tensión en cada resistencia de polarización", unidad: V }
    V_BAd: { expr: "I_d*Z_dd", sim: "V_{BA}", nombre: "tensión diferencial en reposo", unidad: V, cifras: 4 }
    V_680: { expr: "V_d*Z_dd/(2*680 + Z_dd)", nombre: "con 680 Ω", unidad: V, cifras: 4 }
    V_d1: { expr: "V_d - V_rd", sim: "V_{D1}", nombre: "tensión de D1", unidad: V }
    I_tt: { expr: "V_BAd/R_T", sim: "I_{T}", nombre: "corriente de una terminación", unidad: A }
    Z_11: { expr: "1/(2/R_T + n_11/24000)", sim: "Z_{d}", nombre: "bus del ejercicio 45.11 entre hilos", unidad: Ω, cifras: 3 }
    I_11: { expr: "V_d/(2*R_p11 + Z_11)", sim: "I", nombre: "corriente de polarización", unidad: A }
    V_11: { expr: "I_11*Z_11", sim: "V_{BA}", nombre: "tensión de reposo del ejercicio 45.11", unidad: V, cifras: 4 }
    Rmax_11: { expr: "(V_d*Z_11/0.2 - Z_11)/2", sim: "R_{p}", nombre: "mayor polarización para 200 mV", unidad: Ω, cifras: 3 }
    Z_pp: { expr: "1/(2/R_tp + n_pp/24000)", sim: "Z_{d}", nombre: "bus de PROFIBUS entre hilos", unidad: Ω, cifras: 3 }
    V_pp: { expr: "V_d*Z_pp/(2*R_pp/(1 + act) + Z_pp)", sim: "V_{BA}", nombre: "tensión de reposo de PROFIBUS", unidad: V, cifras: 3 }
    t_trama: { expr: "bytes_t*11/v_t", sim: "t", nombre: "duración de la trama", unidad: s, cifras: 3 }
    bits_t: { expr: "bytes_t*11", nombre: "bits de la trama", cifras: 2 }

tarjetas:
  - id: explore-crece
    tipo: explorar
    titulo: "45.A: un bus I²C que crece"
    texto: "Con 10 pF por dispositivo y 1 pF por centímetro de pista, el bus I²C crece. Haga crecer el bus hasta que los 4,7 kΩ habituales dejen de cumplir a 400 kHz."
    libro: [452, 456]
    widget:
      tipo: grafica
      x: { id: cc, min: 2e-11, max: 2e-10, unidad: F, rotulo: "C" }
      y: { min: 0, max: 16000, unidad: Ω, rotulo: "R_{máx}" }
      curvas:
        - { expr: "3e-7/(0.8473*cc)", color: azul, rotulo: "R_{máx} a 400 kHz" }
        - { expr: "4700", color: naranja, rotulo: "4,7 kΩ", discontinua: true }
      asas:
        - { mueve: n_disp, x: "C_i2c", y: "Rmax_i2c", rotulo: "Su bus" }
      lectura: { valor: Rmax_i2c, rotulo: "Pull-up máximo" }
      datos:
        - { valor: C_i2c, rotulo: "Capacidad: {{C_i2c}}" }
      mandos:
        - { valor: n_disp, lista: [4, 8], rotulo: "Dispositivos" }
        - { valor: cm_pista, lista: [10, 50], rotulo: "Pista (cm)" }
    objetivo:
      condiciones:
        - { valor: Rmax_i2c, max: 4700, rotulo: "Pull-up máximo: {{Rmax_i2c}}" }
      logrado: "El máximo baja a {{Rmax_i2c}}, por debajo de 4,7 kΩ. Nadie tocó los pull-ups: el margen se consumió al añadir dispositivos y alargar pistas."
      pistas:
        - { texto: "Con 4 dispositivos y 10 cm aún cumplen: añada dispositivos o pista." }
    escalera: ["Más dispositivos o más pista suben la capacidad y bajan el pull-up máximo."]
    solucion: "Más dispositivos o más pista: el máximo baja de 4,7 kΩ."
    comprobar:
      - { C_i2c: 5e-11, Rmax_i2c: 7081 }
      - { con: { n_disp: 8, cm_pista: 50 }, C_i2c: 1.3e-10, Rmax_i2c: 2724 }

  - id: pregunta-solo
    tipo: leer
    titulo: "Dejó de funcionar solo"
    texto: "El bus llega a 8 dispositivos y 50 cm de pista. Calcule el pull-up máximo a 400 kHz."
    libro: [452, 456, 458, 459, 460]
    fijar: { n_disp: 8, cm_pista: 50 }
    widget:
      tipo: grafica
      x: { id: cc, min: 2e-11, max: 2e-10, unidad: F, rotulo: "C" }
      y: { min: 0, max: 16000, unidad: Ω, rotulo: "R_{máx}" }
      curvas:
        - { expr: "3e-7/(0.8473*cc)", color: azul, rotulo: "R_{máx} a 400 kHz" }
        - { expr: "4700", color: naranja, rotulo: "4,7 kΩ", discontinua: true }
      mandos: []
    leer:
      objetivo: Rmax_i2c
      unidad: Ω
      tol: 0.02
      rotulo: "Pull-up máximo"
      errores:
        - { expr: "3e-7/(0.8473*50e-12)", texto: "Ese es el del bus original, con 4 dispositivos y 10 cm." }
    exito: "{{Rmax_i2c}} con 130 pF: los 4,7 kΩ ya no cumplen. La corrección: bajar los pull-up a 1,5 kΩ."
    escalera: ["Sume 10 pF por dispositivo y 1 pF por centímetro de pista: 130 pF."]
    solucion: "130 pF: R_{máx} = {{Rmax_i2c}}."
    comprobar:
      - { C_i2c: 1.3e-10, Rmax_i2c: 2724 }

  - id: estime-polarizacion
    tipo: leer
    titulo: "45.B: la polarización a prueba de fallo"
    texto: "Las dos terminaciones dan 60 Ω, y en reposo deben quedar al menos 200 mV con 5 V. Calcule la resistencia de polarización de cada lado."
    libro: [466, 470, 471, 472, 474, 475]
    fijar: { V_th: 0.2, R_T2: 60, V_d: 5 }
    widget:
      tipo: figura
      figura: fig-new-44-nodo
      zonas:
        - { id: maestro, rotulo: "Recuadro de arriba a la derecha", rect: [186, 4, 140, 40] }
    leer:
      objetivo: R_lado
      unidad: Ω
      tol: 0.02
      rotulo: "Resistencia a cada lado"
      errores:
        - { expr: "(V_d - V_th)/(V_th/R_T2)", texto: "Esa es la suma de las dos: va la mitad a cada lado." }
    exito: "720 Ω; con el valor comercial de 680 Ω quedan 211 mV. Y a 1 Mbit/s, 100 m frente a 120 m: funciona, con muy poco margen."
    escalera: ["Con 200 mV sobre 60 Ω circulan 3,33 mA; el resto de los 5 V cae en las dos resistencias."]
    solucion: "(5 − 0,2) V / 3,33 mA = 1440 Ω: 720 Ω a cada lado."
    comprobar:
      - { R_lado: 720, I_pol: 0.00333 }

  - id: estime-spi
    tipo: leer
    titulo: "45.C: SPI fuera de la placa"
    texto: "Un SPI a 20 MHz por un cable de 2 m, a 5 ns por metro: el maestro muestrea MISO tras la ida y vuelta. Calcule qué parte del periodo se come."
    libro: [482, 485, 488, 493]
    fijar: { L_spi: 2, f_spi: 20000000 }
    widget:
      tipo: grafica
      x: { id: ff, min: 1000000, max: 20000000, unidad: Hz, rotulo: "f" }
      y: { min: 0, max: 50, unidad: "%", rotulo: "ida y vuelta / periodo" }
      curvas:
        - { expr: "2*L_spi*5e-9*ff*100", color: azul, rotulo: "retardo relativo" }
      mandos: []
    leer:
      objetivo: rel_spi
      unidad: "%"
      tol: 0.03
      rotulo: "Ida y vuelta / periodo"
      errores:
        - { expr: "L_spi*5e-9*f_spi*100", texto: "Solo ha contado la ida: el maestro muestrea tras la ida y la vuelta." }
    exito: "El 40 %: 20 ns de 50 ns, casi medio periodo."
    escalera: ["Ida: 2 m × 5 ns/m = 10 ns; vuelta, otros 10."]
    solucion: "20 ns / 50 ns = 40 %."
    comprobar:
      - { rel_spi: 40 }

  - id: prediga-1mhz
    tipo: leer
    titulo: "La solución más sencilla"
    texto: "Se baja el reloj del SPI a 1 MHz con el mismo cable de 2 m. Calcule qué parte del periodo es ahora el retardo de ida."
    libro: [490]
    fijar: { L_spi: 2, f_spi: 1000000 }
    widget:
      tipo: grafica
      x: { id: ff, min: 1000000, max: 20000000, unidad: Hz, rotulo: "f" }
      y: { min: 0, max: 50, unidad: "%", rotulo: "ida y vuelta / periodo" }
      curvas:
        - { expr: "2*L_spi*5e-9*ff*100", color: azul, rotulo: "retardo relativo" }
      mandos: []
    leer:
      objetivo: rel_ida
      unidad: "%"
      tol: 0.03
      rotulo: "Retardo de ida / periodo"
      errores:
        - { expr: "L_spi*5e-9*20000000*100", texto: "Ese es a 20 MHz: el periodo es ahora veinte veces más largo." }
    exito: "El 1 %: el problema desaparece. Es lo más sencillo y casi siempre suficiente; si no, un bus pensado para distancia."
    escalera: ["10 ns de ida en un periodo de 1 µs."]
    solucion: "10 ns / 1 µs = 1 %."
    comprobar:
      - { rel_ida: 1 }

  - id: explore-nodo
    tipo: tocar
    titulo: "45.D: el nodo Modbus"
    texto: "Un equipo de medida se une, en mitad del recorrido, a un bus RS-485 de 600 m. Toque lo que se deja abierto en su interfaz."
    libro: [496, 502, 512]
    widget:
      tipo: figura
      figura: fig-new-44-nodo
      zonas:
        - { id: micro, rotulo: "Bloque de la izquierda", rect: [2, 22, 78, 108] }
        - { id: transceptor, rotulo: "Bloque del centro", rect: [118, 22, 64, 108] }
        - { id: tvs, rotulo: "Diodos de abajo", rect: [185, 108, 40, 40] }
        - { id: puente, rotulo: "Resistencia de la derecha", rect: [235, 55, 30, 45] }
        - { id: maestro, rotulo: "Recuadro de arriba a la derecha", rect: [186, 4, 140, 40] }
    tocar:
      bien: [puente]
      porque:
        micro: "El microcontrolador gobierna DE y RE con una sola salida: hace falta en cualquier sitio."
        transceptor: "Sin transceptor no hay nodo."
        tvs: "Los diodos supresores protegen los dos hilos en cualquier posición."
        maestro: "Esa polarización ya está en el maestro, una sola vez por bus: el nodo no la lleva."
    exito: "El puente de la terminación de 120 Ω: solo se cierra si el nodo queda en un extremo. El nodo tampoco polariza."
    escalera: ["¿Qué solo va en los dos extremos del bus?"]
    solucion: "El puente de la terminación, a la derecha."

  - id: simule-nodo
    tipo: simular
    titulo: "La polarización existente"
    texto: "El bus tiene 26 cargas unidad más 1/8 y lo polariza el maestro. Con 470 Ω a cada lado y 5 V, ¿cuánto vale V_{BA} en reposo?"
    libro: [496, 503]
    fijar: { V_d: 5, R_pd: 470, n_cud: 26.125, R_T: 120 }
    widget:
      tipo: circuito
      esquema: rs485
      piezas: { vcc: V_d, rp: R_pd, rt: R_T, n: n_cud }
      lectura: { valor: V_BAd, rotulo: "V_{BA} en reposo" }
      mide: { vba: V_BAd, vd1: V_d1, vd0: V_rd, ipol: I_d, it: I_tt }
      ocultar: true
      mandos: []
    simular:
      objetivo: V_BAd
      unidad: V
      tol: 0.03
      rotulo: "Tensión en reposo, V_{BA}"
      medida: vba
      errores:
        - { expr: "V_680", texto: "Esos 198,8 mV son con los 680 Ω de antes: justo por debajo de 200 mV." }
    exito: "282,6 mV: con 680 Ω quedaban 198,8 mV, y el bus funcionaba por el margen de los receptores reales, no por diseño."
    escalera: ["Las cargas suman 2 × 12 kΩ / n entre hilos, en paralelo con los 60 Ω: Z_{d} = 56,3 Ω."]
    solucion: "5 × 56,3 / (2 × 470 + 56,3) = 282,6 mV."
    comprobar:
      - { V_BAd: 0.2826, V_680: 0.1988, Z_dd: 56.3 }

  - id: porque-de
    tipo: porque
    titulo: "Soltar el bus a tiempo"
    texto: "El nodo desactiva DE cuando ha salido el bit de parada del último byte, no en la interrupción de registro vacío. ¿Por qué?"
    libro: [506]
    widget:
      tipo: figura
      figura: fig-new-44-nodo
      zonas:
        - { id: micro, rotulo: "Bloque de la izquierda", rect: [2, 22, 78, 108], texto: "La salida que gobierna DE." }
    opciones:
      - { texto: "El registro vacío llega un carácter antes: soltar ahí corta el final del CRC", bien: true, porque: "Y el autómata ve de vez en cuando una respuesta errónea." }
      - { texto: "Para ahorrar energía", porque: "Es cuestión de no cortar el último byte, no de consumo." }
      - { texto: "Porque el registro vacío no existe en 8E1", porque: "Existe; el problema es que llega antes de que salga el último carácter." }
    escalera: ["Cuando el registro de transmisión se vacía, ¿ha salido ya el último carácter por la línea?"]
    solucion: "La interrupción de registro vacío llega un carácter antes: soltar DE ahí corta el CRC."

  - id: ajuste-45-11
    tipo: ajuste
    titulo: "Ejercicio 45.11: la mayor polarización"
    texto: "63 transceptores de 1/4 de carga unidad y un maestro: 16,75 cargas unidad, 120 Ω en cada extremo y 5 V. Suba R_{p} hasta el límite de 200 mV."
    libro: ["cap44#513"]
    fijar: { V_d: 5, n_11: 16.75, R_T: 120 }
    inicio: { R_p11: 560 }
    widget:
      tipo: circuito
      esquema: rs485
      piezas: { vcc: V_d, rp: R_p11, rt: R_T, n: n_11 }
      lectura: { valor: V_11, rotulo: "V_{BA} en reposo" }
      corriente: I_11
      mide: { vba: V_11, ipol: I_11 }
      mandos:
        - { valor: R_p11, min: 470, max: 1000, paso: 1, rotulo: "R_{p}" }
    ajuste:
      valor: V_11
      objetivo: 0.2
      tol: 0.01
      rotulo: "V_{BA} en reposo"
      escala: { min: 0.1, max: 0.3 }
      bajo: "Por debajo de 200 mV: se ha pasado de resistencia. Bájela."
      alto: "Todavía sobra margen: puede subir R_{p}."
      dentro: "En el límite de 200 mV."
    exito: "691 Ω. Con los 560 Ω del enunciado quedan 244,5 mV: las cargas reducidas dejan margen a la polarización."
    escalera:
      - "Z_{d} = 57,6 Ω: las 16,75 cargas en paralelo con los 60 Ω de las terminaciones."
    solucion: "200 mV = 5 × 57,6/(2R_{p} + 57,6): R_{p} = 691 Ω."
    comprobar:
      - { V_11: 0.2445, Z_11: 57.6, Rmax_11: 691, tol: 0.003 }

  - id: pregunta-45-14
    tipo: pregunta
    titulo: "PROFIBUS con un extremo apagado"
    texto: "Un PROFIBUS con las dos terminaciones activas y 32 cargas unidad queda a 0,99 V en reposo. ¿Y si se apaga la estación de un extremo?"
    libro: ["cap44#513"]
    fijar: { V_d: 5, R_pp: 390, R_tp: 220, n_pp: 32, act: 1 }
    widget:
      tipo: circuito
      esquema: rs485
      piezas: { vcc: V_d, rp: R_pp, rt: R_tp, n: n_pp, activa: act }
      lectura: { valor: V_pp, rotulo: "V_{BA} con las dos" }
      mide: { vba: V_pp }
      mandos: []
    opciones:
      - texto: "Baja a unos 0,49 V, pero sigue por encima de 200 mV: el bus funciona"
        bien: true
        porque: "La terminación apagada sigue en el bus con 0 V: la polarización se reduce a la mitad."
      - texto: "Cae a cero: el reposo queda indefinido"
        porque: "Eso pasa si se apagan las dos; con una, la otra sigue polarizando."
      - texto: "No cambia: la otra terminación polariza igual"
        porque: "La apagada no desaparece: sus resistencias a 0 V tiran del reposo hacia abajo."
    escalera:
