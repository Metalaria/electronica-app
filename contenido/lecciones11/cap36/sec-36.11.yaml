# Lección 1.2 de la sección 37.12 «Diagnóstico de un Receptor: Sensibilidad, Ruido de Fase y Calor» (cap36, sec-36.11).
# Formato: GUIA.md.
# - Friis (bloque 413) con dos etapas: F = F₁ + (F₂ − 1)/G₁, en lineal. LNA de 15 dB y 2 dB de figura, segunda etapa de
#   10 dB: 2,7 dB (bloque 414); sin LNA, 10 dB.
# - Sonda casera: 1 kΩ en serie con una entrada de 50 Ω atenúa 1050/50 = 21 veces (bloque 424).
# Paso práctico: «simular» la figura de ruido de la cadena (errores: sumar los dB, olvidar dividir por G₁).
# 1.2.1 (autor121-senpro, «aprender haciendo», GUIA §13): la ganancia del LNA se sube hasta dejar la cadena por debajo
# de 2,5 dB (se quita la tarjeta de fórmula: Friis va en el «simular»); la cadena sin ganancia y la sonda de 1 kΩ se
# predicen; la sonda se elige por cuánto desintoniza un tanque de ejemplo de 20 pF a 100 MHz (10 pF de la ×10 o 1 pF);
# la falda que tapa a la débil se toca en la figura 37.16; y el generador se baja hasta una SINAD de 12 dB con un suelo
# de ejemplo de −120 dBm. Quedan el orden de las comprobaciones y el calor y el oscilador, por ordenar y emparejar.
leccion: cap36/sec-36.11

libro:
  410: "Un receptor que «recibe poco» tiene una causa localizable"
  413: 'F_("total") = F_("1")'
  414: "Con un LNA de 15 dB de ganancia y 2 dB de figura, una segunda etapa de 10 dB de figura solo sube el total de 2 a 2,7 dB"
  415: "la sensibilidad se hunde sin que nada parezca roto"
  417: "Antes de nada, el consumo"
  418: "es la avería que más despista"
  419: "inyectar en la entrada de cada etapa desde la última hacia la primera"
  420: "Su nivel en el mezclador es crítico"
  422: "Sus 10 pF desintonizan cualquier tanque y cargan cualquier etapa"
  424: "Atenúa unas 20 veces (1050/50 = 21)"
  425: "un condensador de 1 pF desde el nodo a la entrada del instrumento"
  426: "No da valor absoluto y sí da comparación"
  428: "una emisora fuerte cercana se mezcla con las faldas del oscilador y cae dentro del canal deseado como ruido"
  429: "el ruido de fondo del receptor sube cuando hay una señal fuerte cerca, y baja cuando desaparece"
  432: "Cambiando el oscilador por uno mejor —un módulo con TCXO—"
  433: "alimentación ruidosa del oscilador"
  436: "midiendo la frecuencia desde el encendido en frío durante media hora"
  437: "un componente de radio tibio suele estar oscilando parásitamente o mal polarizado"
  440: "se reduce el nivel hasta que la relación señal-ruido-y-distorsión cae a 12 dB"

modelo:
  valores:
    N_1: { sim: "NF₁", nombre: "figura de ruido del LNA", unidad: dB, valor: 2 }
    G_1: { sim: "G₁", nombre: "ganancia del LNA", unidad: dB, valor: 15 }
    N_2: { sim: "NF₂", nombre: "figura de ruido de la segunda etapa", unidad: dB, valor: 10 }
    R_s: { sim: "R", nombre: "resistencia de la sonda", unidad: Ω, valor: 1000 }
    C_t: { sim: "C", nombre: "condensador del tanque, de ejemplo", unidad: F, valor: 20e-12 }
    C_p: { sim: "C_{sonda}", nombre: "capacidad de la sonda", unidad: F, valor: 10e-12 }
    P_g: { sim: "P", nombre: "nivel del generador", unidad: dBm, valor: -100 }
    N_r: { sim: "suelo", nombre: "suelo de ruido, de ejemplo", unidad: dBm, valor: -120 }
  calculos:
    F_1: { expr: "10^(N_1/10)", sim: "F₁", nombre: "factor de ruido del LNA", unidad: "" }
    F_2: { expr: "10^(N_2/10)", sim: "F₂", nombre: "factor de ruido de la segunda etapa", unidad: "" }
    g_1: { expr: "10^(G_1/10)", sim: "G₁", nombre: "ganancia del LNA en veces", unidad: "" }
    F_t: { expr: "F_1 + (F_2 - 1)/g_1", sim: "F", nombre: "factor de ruido total", unidad: "" }
    N_t: { expr: "10*log10(F_t)", sim: "NF", nombre: "figura de ruido de la cadena", unidad: dB }
    N_suma: { expr: "N_1 + N_2", sim: "NF", nombre: "suma de figuras en dB", unidad: dB }
    N_sin: { expr: "10*log10(F_1 + F_2 - 1)", sim: "NF", nombre: "sin dividir por G₁", unidad: dB }
    k_s: { expr: "(R_s + 50)/50", sim: "k", nombre: "atenuación de la sonda", unidad: "" }
    d_f: { expr: "100*(1 - sqrt(C_t/(C_t + C_p)))", sim: "Δf/f", nombre: "desintonía del tanque", unidad: "%", cifras: 2 }
    S_N: { expr: "P_g - N_r", sim: "SINAD", nombre: "SINAD", unidad: dB }
    k_x: { expr: "R_s/50", sim: "k", nombre: "sin sumar los 50 Ω", unidad: "" }

tarjetas:
  - id: explore-friis
    tipo: explorar
    titulo: "La primera etapa manda"
    texto: "Un LNA de 2 dB de figura delante de una etapa de 10 dB. Suba la ganancia del LNA hasta que la cadena quede a menos de medio decibelio de la del LNA."
    libro: [413, 414]
    inicio: { G_1: 0 }
    widget:
      tipo: grafica
      x: { id: g, min: 0, max: 25, unidad: dB, rotulo: "G₁" }
      y: { min: 0, max: 12, unidad: dB, rotulo: "NF" }
      curvas:
        - { expr: "10*log10(F_1 + (F_2 - 1)/10^(g/10))", color: naranja, rotulo: "figura de ruido de la cadena" }
        - { expr: "N_1", color: tinta, rotulo: "la del LNA", discontinua: true }
      marcas:
        - { x: "G_1", y: "N_t", rotulo: "{{N_t}}" }
      lectura: { valor: N_t, rotulo: "Figura de ruido de la cadena" }
      mandos:
        - { valor: G_1, lista: [0, 5, 10, 20], rotulo: "Ganancia del LNA, G₁" }
    objetivo:
      condiciones:
        - { valor: N_t, max: 2.5, rotulo: "Cadena: {{N_t}}" }
      logrado: "Con {{G_1}} de ganancia, la cadena queda en {{N_t}}, casi la del LNA: la primera etapa manda."
      pistas:
        - { texto: "La segunda etapa aún pesa: más ganancia delante." }
    escalera:
      - "El ruido de la segunda etapa llega dividido por la ganancia de la primera."
    solucion: "20 dB."
    comprobar:
      - { con: { G_1: 20 }, N_t: 2.24, tol: 0.01 }

  - id: simule-friis
    tipo: simular
    titulo: "La cadena con LNA"
    texto: "LNA de 15 dB de ganancia y 2 dB de figura; después, una etapa de 10 dB de figura. ¿Qué figura de ruido tiene la cadena?"
    libro: [413, 414]
    fijar: { N_1: 2, G_1: 15, N_2: 10 }
    simular:
      objetivo: N_t
      unidad: dB
      tol: 0.03
      rotulo: "Figura de ruido de la cadena"
      errores:
        - { expr: "N_suma", texto: "Ha sumado los decibelios: Friis se aplica en factores lineales y el segundo se divide por G₁." }
        - { expr: "N_sin", texto: "Le falta dividir por G₁: los 15 dB del LNA aplastan el ruido de la segunda etapa." }
    exito: "2,7 dB: la segunda etapa apenas cuenta. Sin el LNA, al menos 10 dB."
    escalera:
      - "En lineal, F = F₁ + (F₂ − 1)/G₁: 2 dB son 1,585; 10 dB, 10; 15 dB, 31,6."
      - "F = 1,585 + (10 − 1)/31,6."
    solucion: "F = 1,87: 2,7 dB."
    comprobar:
      - { F_1: 1.585, F_2: 10, g_1: 31.62, F_t: 1.87, N_t: 2.717, N_suma: 12, N_sin: 10.25 }

  - id: predecir-lna-roto
    tipo: simular
    titulo: "Un LNA que pierde ganancia"
    texto: "El LNA de esa cadena baja de 15 a 0 dB de ganancia, pero sigue funcionando. ¿Qué figura de ruido tiene ahora la cadena?"
    libro: [415, 418]
    fijar: { G_1: 0 }
    widget:
      tipo: grafica
      x: { id: g, min: 0, max: 25, unidad: dB, rotulo: "G₁" }
      y: { min: 0, max: 12, unidad: dB, rotulo: "NF" }
      curvas:
        - { expr: "10*log10(F_1 + (F_2 - 1)/10^(g/10))", color: naranja, rotulo: "figura de ruido de la cadena" }
      lectura: { valor: N_t, rotulo: "Figura de ruido de la cadena" }
      ocultar: true
      mandos: []
    simular:
      objetivo: N_t
      unidad: dB
      tol: 0.03
      rotulo: "Figura de ruido de la cadena"
      errores:
        - { expr: "N_1", texto: "El LNA fija la figura mientras tiene ganancia; sin ella, aparece toda la etapa siguiente." }
        - { expr: "N_suma", texto: "Las figuras no se suman en dB: con G₁ = 1, F = F₁ + F₂ − 1 en lineal." }
    exito: "10,25 dB: la sensibilidad se hunde sin que nada parezca roto. Es la avería que más despista."
    escalera:
      - "Con G₁ = 0 dB, el divisor de Friis es uno."
    solucion: "F = F₁ + F₂ − 1 = {{F_t}}: {{N_t}}."
    comprobar:
      - { N_t: 10.25 }

  - id: ordene-comprobaciones
    tipo: pregunta
    titulo: "El orden de las comprobaciones"
    texto: "Ordene las comprobaciones de un receptor que recibe poco."
    libro: [417, 418, 419, 420]
    widget:
      tipo: figura
      figura: fig-36.13
      zonas:
        - { id: todo, rotulo: "Ruido de fase y mezcla recíproca", rect: [0, 0, 443, 193] }
    ordenar:
      - "El consumo de cada bloque."
      - "Las tensiones de polarización."
      - "La inyección progresiva, de la última etapa a la primera."
      - "El nivel del oscilador local en el mezclador."
    exito: "El consumo localiza una etapa muerta en dos minutos sin tocar la señal."
    pistas:
      - { texto: "Lo primero no toca la señal en absoluto." }
    escalera:
      - "De lo que no toca la radiofrecuencia a lo que sí."
    solucion: "Consumo, polarización, inyección progresiva, oscilador local."

  - id: estime-sonda
    tipo: simular
    titulo: "Una sonda casera"
    texto: "Una resistencia de 1 kΩ en serie con un coaxial que acaba en una entrada de 50 Ω. ¿Cuántas veces atenúa?"
    libro: [424]
    fijar: { R_s: 1000 }
    widget:
      tipo: figura
      figura: fig-36.13
      zonas:
        - { id: todo, rotulo: "Ruido de fase y mezcla recíproca", rect: [0, 0, 443, 193] }
    simular:
      objetivo: k_s
      unidad: ""
      tol: 0.03
      rotulo: "Atenuación"
      errores:
        - { expr: "k_x", texto: "Falta sumar los 50 Ω de la entrada: el divisor es (1000 + 50)/50." }
    exito: "21 veces, y carga el nodo con 1 kΩ y menos de 1 pF."
    escalera:
      - "Un divisor: la tensión total cae en 1050 Ω y se mide en 50."
    solucion: "1050/50 = 21."
    comprobar:
      - { k_s: 21, k_x: 20 }

  - id: porque-sonda
    tipo: explorar
    titulo: "Por qué no una sonda ×10"
    texto: "Un tanque de ejemplo de 20 pF, sintonizado. Elija con qué tocarlo para que se desintonice menos de un 3 %."
    nota: "Tanque de ejemplo."
    libro: [422, 425, 426]
    inicio: { C_p: 10e-12 }
    widget:
      tipo: grafica
      x: { id: c, min: 0, max: 12e-12, unidad: F, rotulo: "capacidad añadida" }
      y: { min: 0, max: 25, unidad: "%", rotulo: "desintonía" }
      curvas:
        - { expr: "100*(1 - sqrt(C_t/(C_t + c)))", color: naranja, rotulo: "desplazamiento de la sintonía" }
      marcas:
        - { x: "C_p", y: "d_f", rotulo: "{{d_f}}" }
      lectura: { valor: d_f, rotulo: "Desintonía" }
      mandos:
        - { valor: C_p, lista: [10e-12, 1e-12], nombres: [sonda ×10, condensador de 1 pF], rotulo: "Con qué se mira" }
    objetivo:
      condiciones:
        - { valor: d_f, max: 3, rotulo: "Desintonía: {{d_f}}" }
      logrado: "Con 1 pF apenas se mueve; los 10 pF de la ×10 desintonizan cualquier tanque. No da valor absoluto, pero sí comparación."
      pistas:
        - { texto: "La ×10 desplaza la sintonía: la medida destruye lo que mide." }
    escalera:
      - "Menos capacidad añadida, menos desintonía."
    solucion: "El condensador de 1 pF."
    comprobar:
      - { con: { C_p: 1e-12 }, d_f: 2.4, tol: 0.02 }

  - id: pregunta-ruido-fase
    tipo: tocar
    titulo: "El síntoma del ruido de fase"
    texto: "El ruido de fondo sube cuando hay una señal fuerte cerca y baja cuando desaparece. Toque en la mezcla recíproca lo que tapa a la débil."
    libro: [428, 429]
    widget:
      tipo: figura
      figura: fig-36.13
      zonas:
        - { id: fuerte, rotulo: "Arriba a la derecha, el pico alto", rect: [340, 8, 55, 40] }
        - { id: falda, rotulo: "Centro de la gráfica derecha", rect: [312, 48, 52, 40] }
        - { id: debil, rotulo: "Izquierda de la gráfica derecha", rect: [268, 84, 42, 40] }
        - { id: suelo, rotulo: "Abajo a la derecha", rect: [393, 122, 44, 40] }
    tocar:
      bien: [falda]
      porque:
        fuerte: "Esa es la emisora fuerte; por sí sola no cae en el canal."
        debil: "Esa es la emisora deseada, la víctima."
        suelo: "Ese es el suelo que habría con un oscilador ideal."
    exito: "La falda de ruido de fase: la emisora fuerte se mezcla con las faldas del oscilador y cae en el canal como ruido."
    escalera:
      - "Busque lo que se extiende de la fuerte hacia el canal deseado."
    solucion: "La falda que cae en el canal."

  - id: empareje-diagnostico
    tipo: pregunta
    titulo: "Calor y oscilador"
    texto: "Empareje cada síntoma con su diagnóstico."
    libro: [432, 433, 436, 437]
    widget:
      tipo: figura
      figura: fig-36.13
      zonas:
        - { id: todo, rotulo: "Ruido de fase y mezcla recíproca", rect: [0, 0, 443, 193] }
    emparejar:
      - ["La sintonía se va al calentarse", "Medir la frecuencia desde frío media hora"]
      - ["Un componente de radio tibio", "Oscila parásitamente o está mal polarizado"]
      - ["Sospecha del oscilador", "Cambiarlo por un módulo con TCXO"]
      - ["Faldas de ruido de fase", "Primero, la alimentación del oscilador"]
    exito: "La cámara térmica de móvil compara el equipo bueno con el averiado en segundos."
    pistas:
      - { texto: "La curva de deriva dice si es el cristal o su circuito." }
    escalera:
      - "Un componente de radio no debería calentarse."
    solucion: "Deriva, medir desde frío; tibio, oscila; TCXO, sustituir; faldas, alimentación."

  - id: pregunta-sinad
    tipo: explorar
    titulo: "La sensibilidad, medida"
    texto: "Con un generador y un atenuador se baja el nivel hasta que la relación señal-ruido-y-distorsión cae a 12 dB. Hágalo."
    nota: "Suelo de ruido de ejemplo."
    libro: [440]
    inicio: { P_g: -100 }
    widget:
      tipo: grafica
      x: { id: p, min: -125, max: -95, unidad: dBm, rotulo: "nivel del generador" }
      y: { min: 0, max: 30, unidad: dB, rotulo: "SINAD" }
      curvas:
        - { expr: "max(0, p - N_r)", color: naranja, rotulo: "SINAD" }
        - { expr: "12", color: tinta, rotulo: "12 dB", discontinua: true }
      marcas:
        - { x: "P_g", y: "S_N", rotulo: "{{S_N}}" }
      lectura: { valor: S_N, rotulo: "SINAD" }
      mandos:
        - { valor: P_g, min: -120, max: -100, paso: 1, rotulo: "Nivel del generador" }
    objetivo:
      condiciones:
        - { valor: S_N, objetivo: 12, tol: 0.03, rotulo: "SINAD: {{S_N}}" }
      logrado: "Con {{P_g}} la SINAD es de 12 dB: ese nivel es la sensibilidad. Comparado con la especificación o con otro receptor, dice si hay un problema real."
      pistas:
        - { cuando: { valor: S_N, mayor: 12.4 }, texto: "Aún sobra señal: baje el generador." }
        - { texto: "Se ha pasado: suba un poco." }
    escalera:
      - "La SINAD baja decibelio a decibelio con el generador."
    solucion: "Unos −108 dBm."
    comprobar:
      - { con: { P_g: -108 }, S_N: 12 }

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [410, 414, 415, 417, 422, 429]
    ideas:
      - { titulo: "Friis.", texto: "Con un LNA de 15 dB, la cadena queda en 2,7 dB." }
      - { titulo: "La avería que despista.", texto: "Un LNA sin ganancia hunde la sensibilidad sin parecer roto." }
      - { titulo: "Mirar sin estropear.", texto: "Consumo primero; sonda de 1 kΩ o 1 pF, nunca la ×10." }
      - { titulo: "Ruido de fase.", texto: "El fondo sube con una señal fuerte vecina." }
