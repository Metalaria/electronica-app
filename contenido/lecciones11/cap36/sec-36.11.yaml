# Lección 1.2 de la sección 37.12 «Diagnóstico de un Receptor: Sensibilidad, Ruido de Fase y Calor» (cap36, sec-36.11).
# Formato: GUIA.md.
# - Friis (bloque 413) con dos etapas: F = F₁ + (F₂ − 1)/G₁, en lineal. LNA de 15 dB y 2 dB de figura, segunda etapa de
#   10 dB: 2,7 dB (bloque 414); sin LNA, 10 dB.
# - Sonda casera: 1 kΩ en serie con una entrada de 50 Ω atenúa 1050/50 = 21 veces (bloque 424).
# Paso práctico: «simular» la figura de ruido de la cadena (errores: sumar los dB, olvidar dividir por G₁).
leccion: cap36/sec-36.11

libro:
  410: "Un receptor que «recibe poco» tiene una causa localizable"
  413: 'F_("total") = F_("1")'
  414: "Con un LNA de 15 dB de ganancia y 2 dB de figura, una segunda etapa de 10 dB de figura solo sube el total de 2 a 2,7 dB"
  415: "la sensibilidad se hunde sin que nada parezca roto"
  417: "Antes de nada, el consumo"
  418: "es la avería que más despista"
  419: "inyectar en la entrada de cada etapa desde la última hacia la primera"
  420: "Su nivel en el mezclador es crítico"
  422: "Sus 10 pF desintonizan cualquier tanque y cargan cualquier etapa"
  424: "Atenúa unas 20 veces (1050/50 = 21)"
  425: "un condensador de 1 pF desde el nodo a la entrada del instrumento"
  426: "No da valor absoluto y sí da comparación"
  428: "una emisora fuerte cercana se mezcla con las faldas del oscilador y cae dentro del canal deseado como ruido"
  429: "el ruido de fondo del receptor sube cuando hay una señal fuerte cerca, y baja cuando desaparece"
  432: "Cambiando el oscilador por uno mejor —un módulo con TCXO—"
  433: "alimentación ruidosa del oscilador"
  436: "midiendo la frecuencia desde el encendido en frío durante media hora"
  437: "un componente de radio tibio suele estar oscilando parásitamente o mal polarizado"
  440: "se reduce el nivel hasta que la relación señal-ruido-y-distorsión cae a 12 dB"

modelo:
  valores:
    N_1: { sim: "NF₁", nombre: "figura de ruido del LNA", unidad: dB, valor: 2 }
    G_1: { sim: "G₁", nombre: "ganancia del LNA", unidad: dB, valor: 15 }
    N_2: { sim: "NF₂", nombre: "figura de ruido de la segunda etapa", unidad: dB, valor: 10 }
    R_s: { sim: "R", nombre: "resistencia de la sonda", unidad: Ω, valor: 1000 }
  calculos:
    F_1: { expr: "10^(N_1/10)", sim: "F₁", nombre: "factor de ruido del LNA", unidad: "" }
    F_2: { expr: "10^(N_2/10)", sim: "F₂", nombre: "factor de ruido de la segunda etapa", unidad: "" }
    g_1: { expr: "10^(G_1/10)", sim: "G₁", nombre: "ganancia del LNA en veces", unidad: "" }
    F_t: { expr: "F_1 + (F_2 - 1)/g_1", sim: "F", nombre: "factor de ruido total", unidad: "" }
    N_t: { expr: "10*log10(F_t)", sim: "NF", nombre: "figura de ruido de la cadena", unidad: dB }
    N_suma: { expr: "N_1 + N_2", sim: "NF", nombre: "suma de figuras en dB", unidad: dB }
    N_sin: { expr: "10*log10(F_1 + F_2 - 1)", sim: "NF", nombre: "sin dividir por G₁", unidad: dB }
    k_s: { expr: "(R_s + 50)/50", sim: "k", nombre: "atenuación de la sonda", unidad: "" }

tarjetas:
  - id: explore-friis
    tipo: explorar
    titulo: "La primera etapa manda"
    texto: "Un LNA de 2 dB de figura delante de una etapa de 10 dB. Cambie la ganancia del LNA."
    libro: [413, 414]
    widget:
      tipo: grafica
      x: { id: g, min: 0, max: 25, unidad: dB, rotulo: "G₁" }
      y: { min: 0, max: 12, unidad: dB, rotulo: "NF" }
      curvas:
        - { expr: "10*log10(F_1 + (F_2 - 1)/10^(g/10))", color: naranja, rotulo: "figura de ruido de la cadena" }
        - { expr: "N_1", color: tinta, rotulo: "la del LNA", discontinua: true }
      marcas:
        - { x: "G_1", y: "N_t", rotulo: "{{N_t}}" }
      lectura: { valor: N_t, rotulo: "Figura de ruido de la cadena" }
      mandos:
        - { valor: G_1, lista: [0, 5, 10, 15, 20], rotulo: "Ganancia del LNA, G₁" }
    requiere: { mover: [G_1] }

  - id: formula-friis
    tipo: formula
    titulo: "La fórmula de Friis"
    texto: "En factores lineales: el ruido de la segunda etapa llega dividido por la ganancia de la primera."
    libro: [413, 414]
    ec: 413
    sustitucion: "{{F_1}} + ({{F_2}} − 1)/{{g_1}} = {{F_t}}"
    widget:
      tipo: grafica
      x: { id: g, min: 0, max: 25, unidad: dB, rotulo: "G₁" }
      y: { min: 0, max: 12, unidad: dB, rotulo: "NF" }
      curvas:
        - { expr: "10*log10(F_1 + (F_2 - 1)/10^(g/10))", color: naranja, rotulo: "figura de ruido de la cadena" }
      marcas:
        - { x: "G_1", y: "N_t", rotulo: "{{N_t}}" }
      lectura: { valor: F_t, rotulo: "Factor de ruido total" }
      mandos:
        - { valor: G_1, lista: [0, 5, 10, 15, 20], rotulo: "Ganancia del LNA, G₁" }

  - id: simule-friis
    tipo: simular
    titulo: "La cadena con LNA"
    texto: "LNA de 15 dB de ganancia y 2 dB de figura; después, una etapa de 10 dB de figura. ¿Qué figura de ruido tiene la cadena?"
    libro: [413, 414]
    fijar: { N_1: 2, G_1: 15, N_2: 10 }
    simular:
      objetivo: N_t
      unidad: dB
      tol: 0.03
      rotulo: "Figura de ruido de la cadena"
      errores:
        - { expr: "N_suma", texto: "Ha sumado los decibelios: Friis se aplica en factores lineales y el segundo se divide por G₁." }
        - { expr: "N_sin", texto: "Le falta dividir por G₁: los 15 dB del LNA aplastan el ruido de la segunda etapa." }
    exito: "2,7 dB: la segunda etapa apenas cuenta. Sin el LNA, al menos 10 dB."
    escalera:
      - "Pase a lineal: 2 dB son 1,585; 10 dB, 10; 15 dB, 31,6."
      - "F = 1,585 + (10 − 1)/31,6."
    solucion: "F = 1,87: 2,7 dB."
    comprobar:
      - { F_1: 1.585, F_2: 10, g_1: 31.62, F_t: 1.87, N_t: 2.717, N_suma: 12, N_sin: 10.25 }

  - id: predecir-lna-roto
    tipo: predecir
    titulo: "Un LNA que pierde ganancia"
    texto: "El LNA de esa cadena baja de 15 a 0 dB de ganancia, pero sigue funcionando. ¿Qué se nota?"
    libro: [415, 418]
    fijar: { G_1: 0 }
    widget:
      tipo: grafica
      x: { id: g, min: 0, max: 25, unidad: dB, rotulo: "G₁" }
      y: { min: 0, max: 12, unidad: dB, rotulo: "NF" }
      curvas:
        - { expr: "10*log10(F_1 + (F_2 - 1)/10^(g/10))", color: naranja, rotulo: "figura de ruido de la cadena" }
      lectura: { valor: N_t, rotulo: "Figura de ruido de la cadena" }
      ocultar: true
    opciones:
      - texto: "La sensibilidad se hunde sin que nada parezca roto"
        bien: true
        porque: "Toda la cadena aparece de golpe en la figura de ruido: pasa de 2,7 a 10,25 dB."
      - texto: "El receptor se queda mudo"
        porque: "Sigue recibiendo: solo pierde las señales débiles. Por eso despista."
      - texto: "Nada: la figura la fija el LNA"
        porque: "La fija el LNA mientras tiene ganancia; sin ella, manda la etapa siguiente."
    escalera:
      - "Mire qué pasa en la fórmula cuando G₁ vale uno."
    solucion: "La figura sube a unos 10 dB: la sensibilidad cae sin síntomas visibles."
    comprobar:
      - { N_t: 10.25 }

  - id: ordene-comprobaciones
    tipo: pregunta
    titulo: "El orden de las comprobaciones"
    texto: "Ordene las comprobaciones de un receptor que recibe poco."
    libro: [417, 418, 419, 420]
    widget:
      tipo: figura
      figura: fig-36.13
      zonas:
        - { id: todo, rotulo: "Ruido de fase y mezcla recíproca", rect: [0, 0, 443, 193] }
    ordenar:
      - "El consumo de cada bloque."
      - "Las tensiones de polarización."
      - "La inyección progresiva, de la última etapa a la primera."
      - "El nivel del oscilador local en el mezclador."
    exito: "El consumo localiza una etapa muerta en dos minutos sin tocar la señal."
    pistas:
      - { texto: "Lo primero no toca la señal en absoluto." }
    escalera:
      - "De lo que no toca la radiofrecuencia a lo que sí."
    solucion: "Consumo, polarización, inyección progresiva, oscilador local."

  - id: estime-sonda
    tipo: pregunta
    titulo: "Una sonda casera"
    texto: "Una resistencia de 1 kΩ en serie con un coaxial que acaba en una entrada de 50 Ω. ¿Cuántas veces atenúa?"
    libro: [424]
    fijar: { R_s: 1000 }
    widget:
      tipo: figura
      figura: fig-36.13
      zonas:
        - { id: todo, rotulo: "Ruido de fase y mezcla recíproca", rect: [0, 0, 443, 193] }
    estimar:
      objetivo: "k_s"
      unidad: ""
      min: 1
      max: 50
      paso: 1
      inicio: 42
      tol: 0.05
      rotulo: "Atenuación"
    exito: "21 veces, y carga el nodo con 1 kΩ y menos de 1 pF."
    pistas:
      - { cuando: { valor: estimacion, mayor: 22 }, texto: "Demasiado: es un divisor de 1050 a 50." }
      - { texto: "Demasiado poco: el divisor es (1000 + 50)/50." }
    escalera:
      - "Un divisor: la tensión total cae en 1050 Ω y se mide en 50."
    solucion: "1050/50 = 21."
    comprobar:
      - { k_s: 21 }

  - id: porque-sonda
    tipo: porque
    titulo: "Por qué no una sonda ×10"
    texto: "¿Por qué no se pone una sonda ×10 en un nodo de radiofrecuencia?"
    libro: [422, 425, 426]
    widget:
      tipo: figura
      figura: fig-36.13
      zonas:
        - { id: todo, rotulo: "Ruido de fase y mezcla recíproca", rect: [0, 0, 443, 193] }
    opciones:
      - texto: "Sus 10 pF desintonizan cualquier tanque y cargan la etapa"
        bien: true
        porque: "La medida destruye lo que mide: hace falta 1 pF o menos, o una sonda de campo cercano."
      - texto: "Porque atenúa demasiado"
        porque: "La atenuación se compensa sabiéndola; el problema es su capacidad."
      - texto: "Porque no llega a esa frecuencia"
        porque: "Aunque llegara, sus 10 pF cambiarían el circuito."
    escalera:
      - "¿Qué le hacen 10 pF a un tanque sintonizado?"
    solucion: "Su capacidad desintoniza y carga: se mira con 1 kΩ, 1 pF o un lazo."

  - id: pregunta-ruido-fase
    tipo: pregunta
    titulo: "El síntoma del ruido de fase"
    texto: "¿Qué síntoma distingue el ruido de fase del oscilador de una falta de sensibilidad?"
    libro: [428, 429]
    widget:
      tipo: figura
      figura: fig-36.13
      zonas:
        - { id: todo, rotulo: "Ruido de fase y mezcla recíproca", rect: [0, 0, 443, 193] }
    opciones:
      - texto: "El ruido de fondo sube con una señal fuerte cercana y baja cuando desaparece"
        bien: true
        porque: "Es la mezcla recíproca: la señal fuerte se mezcla con las faldas del oscilador."
      - texto: "El ruido de fondo es constante"
        porque: "Con suelo constante con y sin señal fuerte, el problema no es el ruido de fase."
      - texto: "La emisora deseada desaparece de golpe"
        porque: "Eso parece compresión cruzada; el ruido de fase llena el canal de ruido."
    escalera:
      - "Pruebe con y sin una emisora fuerte cerca."
    solucion: "Un suelo de ruido que sigue a la señal fuerte vecina."

  - id: empareje-diagnostico
    tipo: pregunta
    titulo: "Calor y oscilador"
    texto: "Empareje cada síntoma con su diagnóstico."
    libro: [432, 433, 436, 437]
    widget:
      tipo: figura
      figura: fig-36.13
      zonas:
        - { id: todo, rotulo: "Ruido de fase y mezcla recíproca", rect: [0, 0, 443, 193] }
    emparejar:
      - ["La sintonía se va al calentarse", "Medir la frecuencia desde frío media hora"]
      - ["Un componente de radio tibio", "Oscila parásitamente o está mal polarizado"]
      - ["Sospecha del oscilador", "Cambiarlo por un módulo con TCXO"]
      - ["Faldas de ruido de fase", "Primero, la alimentación del oscilador"]
    exito: "La cámara térmica de móvil compara el equipo bueno con el averiado en segundos."
    pistas:
      - { texto: "La curva de deriva dice si es el cristal o su circuito." }
    escalera:
      - "Un componente de radio no debería calentarse."
    solucion: "Deriva, medir desde frío; tibio, oscila; TCXO, sustituir; faldas, alimentación."

  - id: pregunta-sinad
    tipo: pregunta
    titulo: "La sensibilidad, medida"
    texto: "Con un generador y un atenuador, ¿qué medida resume la sensibilidad de un receptor?"
    libro: [440]
    widget:
      tipo: figura
      figura: fig-36.13
      zonas:
        - { id: todo, rotulo: "Ruido de fase y mezcla recíproca", rect: [0, 0, 443, 193] }
    opciones:
      - texto: "El nivel al que la SINAD cae a 12 dB"
        bien: true
        porque: "Comparado con la especificación u otro receptor, dice si hay un problema real."
      - texto: "La tensión de la antena con el multímetro"
        porque: "Son microvoltios de radiofrecuencia: el multímetro no los ve."
      - texto: "El consumo del receptor"
        porque: "El consumo localiza una etapa muerta, no mide sensibilidad."
    escalera:
      - "Señal, ruido y distorsión: una relación."
    solucion: "La SINAD de 12 dB: el nivel de entrada que la da es la sensibilidad."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [410, 414, 415, 417, 422, 429]
    ideas:
      - { titulo: "Friis.", texto: "Con un LNA de 15 dB, la cadena queda en 2,7 dB." }
      - { titulo: "La avería que despista.", texto: "Un LNA sin ganancia hunde la sensibilidad sin parecer roto." }
      - { titulo: "Mirar sin estropear.", texto: "Consumo primero; sonda de 1 kΩ o 1 pF, nunca la ×10." }
      - { titulo: "Ruido de fase.", texto: "El fondo sube con una señal fuerte vecina." }
