# Lección 1.2 de la sección 37.1 «Del Campo a la Onda: las Ecuaciones de Maxwell» (cap36, sec-new-36-maxwell).
# Formato: GUIA.md.
# - Ampère alrededor de un hilo: H = I/(2πr), B = µ0·H con µ0 = 1,257e-6 H/m (bloques 6 y 17).
# - Onda en un medio: v = c/√εr y η = 376,7/√εr (bloques 37 a 40); coaxial: Z0 = (60/√εr)·ln(b/a) (bloque 46).
# - Profundidad de penetración en cobre: δ = √(ρ/(π·f·µ0)) con ρ = 1,72e-8 Ω·m (la del ejercicio 37.11); da los 9,33 mm
#   a 50 Hz, 66,0 µm a 1 MHz y 2,087 µm a 1 GHz de la tabla del bloque 56.
# - Campo lejano de una fuente isótropa: E = √(30·P)/r (bloque 65): 5,48 mV/m con 1 W a 1 km (bloque 66).
# Paso práctico: «simular» el campo a 1 km (errores típicos: olvidar la raíz, dividir por r²).
leccion: cap36/sec-new-36-maxwell

libro:
  6: "µ0 = 1,257 × 10⁻⁶ H/m"
  10: "En el condensador de placas se envuelve la placa positiva"
  11: "En un coaxial la superficie es un cilindro de radio r alrededor del vivo"
  16: 'integral.cont_C bold(H)'
  17: "Con 10 A a 1 cm, H = 159 A/m y B = µ0·H = 200 µT, cuatro veces el campo terrestre"
  22: "una bolsa que pasa entre las placas no corta ningún conductor y encierra cero"
  23: "Maxwell lo resolvió sumando a la corriente de conducción la variación del flujo de D"
  25: "el circuito se cierra sin que ninguna carga atraviese el aislante"
  34: "un campo eléctrico que cambia crea campo magnético"
  37: '"299 792 458 m/s"'
  38: "así concluyó Maxwell que la luz es una onda electromagnética"
  40: "en polietileno (εr = 2,25) la onda va a 0,667 c con η = 251,2 Ω"
  46: '60/sqrt(ε_r)'
  47: "L’·C’ vale µ·ε sea cual sea la geometría"
  52: "los mismos 2,087 µm en el cobre a 1 GHz"
  53: "La pérdida del coaxial crece con √f"
  55: "Pesan lo mismo a la distancia r = λ/2π"
  56: "Frecuencia"
  57: "un lector NFC de 13,56 MHz, a pocos centímetros y muy dentro de sus 3,52 m"
  58: "solo vale η0 en el campo lejano"
  65: 'sqrt(30 dot.op P)/r'
  66: "Un vatio a 1 km deja 79,6 nW/m² y 5,48 mV/m"
  72: "Uno de 2 cm a 433 MHz (λ = 69,2 cm) tiene 0,165 Ω y necesita 246 mA para radiar 10 mW"

modelo:
  valores:
    I_h: { sim: "I", nombre: "corriente del hilo", unidad: A, valor: 10 }
    r_h: { sim: "r", nombre: "distancia al hilo", unidad: m, valor: 0.01 }
    e_r: { sim: "ε_{r}", nombre: "permitividad relativa", unidad: "", valor: 1 }
    ba: { sim: "b/a", nombre: "cociente de radios", unidad: "", valor: 3.49 }
    f_d: { sim: "f", nombre: "frecuencia", unidad: Hz, valor: 1000000000 }
    P_t: { sim: "P", nombre: "potencia radiada", unidad: W, valor: 1 }
    d_t: { sim: "r", nombre: "distancia a la fuente", unidad: m, valor: 1000 }
  calculos:
    H_h: { expr: "I_h/(2*pi*r_h)", sim: "H", nombre: "campo magnético", unidad: "A/m" }
    B_h: { expr: "1.257e-6*H_h", sim: "B", nombre: "densidad de flujo", unidad: T }
    v_m: { expr: "299792458/sqrt(e_r)", sim: "v", nombre: "velocidad de la onda", unidad: "m/s" }
    eta: { expr: "376.7/sqrt(e_r)", sim: "η", nombre: "impedancia del medio", unidad: Ω }
    Z_k: { expr: "60/sqrt(e_r)", sim: "k", nombre: "coeficiente del dieléctrico", unidad: Ω }
    Z_c: { expr: "60/sqrt(e_r)*ln(ba)", sim: "Z_{0}", nombre: "impedancia del coaxial", unidad: Ω }
    delta: { expr: "sqrt(1.72e-8/(pi*f_d*1.257e-6))", sim: "δ", nombre: "profundidad de penetración", unidad: m }
    E_l: { expr: "sqrt(30*P_t)/d_t", sim: "E", nombre: "campo eléctrico", unidad: "V/m" }
    E_sin: { expr: "30*P_t/d_t", sim: "E", nombre: "campo sin la raíz", unidad: "V/m" }
    E_r2: { expr: "sqrt(30*P_t)/d_t^2", sim: "E", nombre: "campo con r al cuadrado", unidad: "V/m" }

tarjetas:
  - id: explore-superficies
    tipo: explorar
    titulo: "Superficies que dan fórmulas"
    texto: "Gauss y Ampère se aplican eligiendo una superficie o un camino con simetría. Toque los tres casos."
    libro: [10, 11, 17]
    widget:
      tipo: figura
      figura: fig-new-36-gauss
      zonas:
        - { id: placas, rotulo: "a) Condensador de placas", rect: [0, 0, 150, 175], texto: "La superficie envuelve la placa positiva: D·A = Q. De ahí E = Q/(ε·A) y C = ε·A/d." }
        - { id: hilo, rotulo: "b) Hilo recto", rect: [150, 0, 152, 175], texto: "El camino es una circunferencia: H·2πr = I. El campo cae con la distancia." }
        - { id: coaxial, rotulo: "c) Coaxial", rect: [302, 0, 151, 175], texto: "E radial y H en círculos, los dos solo en el dieléctrico: por él viaja la energía." }
    requiere: { mover: [placas, hilo, coaxial] }

  - id: explore-hilo
    tipo: explorar
    titulo: "El campo de un hilo"
    texto: "Por el hilo circulan 10 A. Aleje el punto y mire cómo cae el campo."
    libro: [16, 17, 6]
    widget:
      tipo: grafica
      x: { id: r, min: 0.004, max: 0.05, unidad: m, rotulo: "r" }
      y: { min: 0, max: 0.0006, unidad: T, rotulo: "B" }
      curvas:
        - { expr: "1.257e-6*I_h/(2*pi*r)", color: naranja, rotulo: "B = µ₀·I/(2πr)" }
      marcas:
        - { x: "r_h", y: "B_h", rotulo: "{{B_h}}" }
      lectura: { valor: B_h, rotulo: "Densidad de flujo" }
      datos:
        - { valor: H_h, rotulo: "H = {{H_h}}" }
      mandos:
        - { valor: r_h, lista: [0.005, 0.01, 0.02, 0.05], rotulo: "Distancia, r" }
    requiere: { mover: [r_h] }

  - id: estime-hilo
    tipo: pregunta
    titulo: "El doble de lejos"
    texto: "Con 10 A, a 1 cm del hilo hay 200 µT. ¿Cuánto hay a 2 cm?"
    libro: [17]
    fijar: { r_h: 0.02, I_h: 10 }
    widget:
      tipo: figura
      figura: fig-new-36-gauss
      zonas:
        - { id: hilo, rotulo: "b) Hilo recto", rect: [150, 0, 152, 175] }
    estimar:
      objetivo: "B_h"
      unidad: T
      min: 0
      max: 0.0004
      paso: 0.00001
      inicio: 0.00032
      tol: 0.05
      rotulo: "B a 2 cm"
    exito: "100 µT: la circunferencia es el doble de larga y el campo, la mitad."
    pistas:
      - { cuando: { valor: estimacion, mayor: 0.000105 }, texto: "Demasiado: el campo cae como 1/r, no se queda igual." }
      - { texto: "Demasiado poco: cae como 1/r, no como 1/r²." }
    escalera:
      - "H·2πr = I: con el doble de r, la mitad de H."
    solucion: "200 µT entre dos: 100 µT."
    comprobar:
      - { B_h: 0.0001, tol: 0.003 }

  - id: predecir-desplazamiento
    tipo: predecir
    titulo: "Una bolsa entre las placas"
    texto: "Un condensador se carga con una corriente i. ¿Qué corriente encierra una bolsa que pasa entre las placas, sin cortar ningún hilo?"
    libro: [22, 23, 25]
    widget:
      tipo: figura
      figura: fig-new-36-gauss
      zonas:
        - { id: placas, rotulo: "a) Condensador de placas", rect: [0, 0, 150, 175] }
    opciones:
      - texto: "La misma i, como corriente de desplazamiento"
        bien: true
        porque: "Maxwell sumó la variación del flujo de D: entre las placas vale dQ/dt = i, y el circuito se cierra."
      - texto: "Cero: ninguna carga cruza el aislante"
        porque: "Es la contradicción de Ampère sin corregir: el disco que corta el hilo daría i y la bolsa cero."
      - texto: "La mitad de i"
        porque: "No se reparte: toda la corriente de los hilos sigue por el dieléctrico como desplazamiento."
    escalera:
      - "Sin cargas que crucen, ¿qué cambia entre las placas mientras se carga?"
    solucion: "El flujo de D crece al ritmo dQ/dt = i: esa es la corriente de desplazamiento."

  - id: explore-medio
    tipo: explorar
    titulo: "La onda en un medio"
    texto: "Un campo eléctrico que cambia crea uno magnético, y al revés: la onda viaja sola. Cambie el medio y mire su velocidad."
    libro: [34, 37, 38, 40]
    widget:
      tipo: grafica
      x: { id: e, min: 1, max: 100, unidad: "", rotulo: "ε_{r}", escala: log }
      y: { min: 0, max: 320000000, unidad: "m/s", rotulo: "v" }
      curvas:
        - { expr: "299792458/sqrt(e)", color: azul, rotulo: "v = c/√ε_{r}" }
      marcas:
        - { x: "e_r", y: "v_m", rotulo: "{{v_m}}" }
      lectura: { valor: v_m, rotulo: "Velocidad" }
      datos:
        - { valor: eta, rotulo: "η = {{eta}}" }
      mandos:
        - { valor: e_r, lista: [1, 2.25, 4.4, 81], nombres: [vacío, polietileno, FR4, agua], rotulo: "Medio" }
    requiere: { mover: [e_r] }

  - id: formula-coaxial
    tipo: formula
    titulo: "La impedancia del coaxial"
    texto: "La geometría fija la impedancia del coaxial; el dieléctrico, también. Mueva los dos."
    libro: [46, 47]
    ec: 46
    sustitucion: "60/√{{e_r}} · ln {{ba}} = {{Z_c}}"
    widget:
      tipo: grafica
      x: { id: q, min: 1.5, max: 10, unidad: "", rotulo: "b/a" }
      y: { min: 0, max: 150, unidad: Ω, rotulo: "Z_{0}" }
      curvas:
        - { expr: "60/sqrt(e_r)*ln(q)", color: naranja, rotulo: "Z_{0}" }
      marcas:
        - { x: "ba", y: "Z_c", rotulo: "{{Z_c}}" }
      lectura: { valor: Z_c, rotulo: "Impedancia característica" }
      mandos:
        - { valor: ba, min: 1.5, max: 10, paso: 0.01, rotulo: "Cociente de radios, b/a" }
        - { valor: e_r, lista: [1, 2.25], nombres: [aire, polietileno], rotulo: "Dieléctrico" }

  - id: reto-50-ohmios
    tipo: reto
    titulo: "Un coaxial de 50 Ω"
    texto: "Con polietileno macizo, elija el cociente de radios que da 50 Ω."
    libro: [40, 46, 47]
    fijar: { e_r: 2.25 }
    inicio: { ba: 2 }
    widget:
      tipo: grafica
      x: { id: q, min: 1.5, max: 10, unidad: "", rotulo: "b/a" }
      y: { min: 0, max: 100, unidad: Ω, rotulo: "Z_{0}" }
      curvas:
        - { expr: "40*ln(q)", color: naranja, rotulo: "Z_{0} con polietileno" }
      marcas:
        - { x: "ba", y: "Z_c", rotulo: "{{Z_c}}" }
      mandos:
        - { valor: ba, min: 1.5, max: 10, paso: 0.01, rotulo: "Cociente de radios, b/a" }
    condiciones:
      - { valor: Z_c, objetivo: 50, tol: 0.01, rotulo: "Z₀: {{Z_c}}" }
    exito: "b/a = 3,49: un vivo de 0,45 mm de radio dentro de 1,57 mm de polietileno."
    pistas:
      - { cuando: { valor: Z_c, mayor: 50.5 }, texto: "Sobran ohmios: acerque la malla al vivo, baje b/a." }
      - { cuando: { valor: Z_c, menor: 49.5 }, texto: "Faltan ohmios: separe la malla, suba b/a." }
    escalera:
      - "Con polietileno, Z₀ = 40·ln(b/a)."
    solucion: "ln(b/a) = 1,251: b/a = 3,49."
    comprobar:
      - { con: { ba: 3.49 }, Z_c: 50, Z_k: 40 }

  - id: porque-velocidad
    tipo: porque
    titulo: "Lo que decide la geometría"
    texto: "Cambiar el cociente de radios cambia la impedancia del coaxial. ¿Por qué no cambia la velocidad?"
    libro: [47]
    widget:
      tipo: figura
      figura: fig-new-36-gauss
      zonas:
        - { id: coaxial, rotulo: "c) Coaxial", rect: [302, 0, 151, 175] }
    opciones:
      - texto: "Porque L’·C’ vale siempre µ·ε: lo que sube una, lo baja la otra"
        bien: true
        porque: "La velocidad, 1/√(L’·C’), la decide solo el dieléctrico; la geometría, solo la impedancia."
      - texto: "Porque la onda viaja por el cobre del vivo"
        porque: "La energía viaja por el dieléctrico; el cobre solo la guía y se queda sus pérdidas."
      - texto: "Sí cambia: con más b/a la onda va más deprisa"
        porque: "Con b/a mayor sube L’ y baja C’ en la misma proporción: el producto no se mueve."
    escalera:
      - "La velocidad es 1/√(L’·C’). ¿Qué hace cada una al separar la malla?"
    solucion: "L’ sube y C’ baja: L’·C’ = µ·ε y la velocidad queda igual."

  - id: explore-piel
    tipo: explorar
    titulo: "Hasta dónde entra la onda"
    texto: "En un conductor la onda decae desde la superficie. Suba la frecuencia y mire la profundidad de penetración en el cobre."
    libro: [52, 53, 56]
    widget:
      tipo: grafica
      x: { id: nu, min: 10, max: 10000000000, unidad: Hz, rotulo: "f", escala: log }
      y: { min: 0.0000001, max: 0.1, unidad: m, rotulo: "δ", escala: log }
      curvas:
        - { expr: "sqrt(1.72e-8/(pi*nu*1.257e-6))", color: naranja, rotulo: "δ en cobre" }
      marcas:
        - { x: "f_d", y: "delta", rotulo: "{{delta}}" }
      lectura: { valor: delta, rotulo: "Profundidad de penetración" }
      mandos:
        - { valor: f_d, lista: [50, 1000000, 100000000, 1000000000], rotulo: "Frecuencia" }
    requiere: { mover: [f_d] }

  - id: explore-cercano
    tipo: explorar
    titulo: "Campo cercano y campo lejano"
    texto: "Cerca de la fuente el campo es el de un condensador o una bobina; lejos, la onda que se va. Toque las dos gráficas."
    libro: [55, 58]
    widget:
      tipo: figura
      figura: fig-new-36-cercano
      zonas:
        - { id: impedancia, rotulo: "a) Impedancia de onda", rect: [0, 0, 227, 204], texto: "Solo en el campo lejano E/H vale η₀ = 377 Ω. Cerca de una fuente eléctrica es mayor; de una magnética, menor." }
        - { id: terminos, rotulo: "b) Los tres términos", rect: [227, 0, 226, 204], texto: "Términos en 1/r³, 1/r² y 1/r: pesan lo mismo en r = λ/2π, la frontera." }
    requiere: { mover: [impedancia, terminos] }

  - id: pregunta-nfc
    tipo: pregunta
    titulo: "Un lector NFC"
    texto: "Un lector NFC de 13,56 MHz lee una tarjeta a pocos centímetros. ¿Qué es ese enlace?"
    libro: [56, 57]
    widget:
      tipo: figura
      figura: fig-new-36-cercano
      zonas:
        - { id: impedancia, rotulo: "a) Impedancia de onda", rect: [0, 0, 227, 204] }
    opciones:
      - texto: "Dos bobinas acopladas: campo cercano"
        bien: true
        porque: "A 13,56 MHz la frontera λ/2π está en 3,52 m: unos centímetros quedan muy dentro."
      - texto: "Una radio: la onda viaja de una antena a otra"
        porque: "Para ser radio tendría que estar más allá de λ/2π, a varios metros."
      - texto: "Un enlace óptico"
        porque: "No hay luz: son dos bucles que comparten el campo magnético cuasiestático."
    escalera:
      - "Compare unos centímetros con λ/2π a 13,56 MHz."
    solucion: "λ/2π = 3,52 m: la tarjeta está en el campo cercano, acoplada como un transformador."

  - id: simule-campo
    tipo: simular
    titulo: "Un vatio a un kilómetro"
    texto: "Una fuente isótropa radia 1 W. ¿Qué campo eléctrico hay a 1 km, en campo lejano?"
    libro: [65, 66]
    fijar: { P_t: 1, d_t: 1000 }
    simular:
      objetivo: E_l
      unidad: "V/m"
      tol: 0.03
      rotulo: "Campo eléctrico, E"
      errores:
        - { expr: "E_sin", texto: "Le falta la raíz: la densidad de potencia va con E², así que E va con √(30·P)." }
        - { expr: "E_r2", texto: "Ha dividido por r²: eso cae la densidad de potencia; el campo cae solo como 1/r." }
    exito: "5,48 mV/m: la densidad de potencia es de 79,6 nW/m²."
    escalera:
      - "E = √(30·P)/r, con P en vatios y r en metros."
    solucion: "√30 / 1000 = 5,48 mV/m."
    comprobar:
      - { E_l: 0.005477, E_sin: 0.03, E_r2: 0.000005477 }

  - id: porque-antena-pequena
    tipo: porque
    titulo: "Una antena de 2 cm"
    texto: "Un dipolo corto de 2 cm a 433 MHz tiene 0,165 Ω de resistencia de radiación. ¿Por qué funciona mal?"
    libro: [72]
    widget:
      tipo: figura
      figura: fig-new-36-cercano
      zonas:
        - { id: terminos, rotulo: "b) Los tres términos", rect: [227, 0, 226, 204] }
    opciones:
      - texto: "Necesita mucha corriente, y unas décimas de ohmio en serie disipan tanto como radia"
        bien: true
        porque: "Pide 246 mA para radiar 10 mW: la bobina de adaptación o un contacto se comen la mitad."
      - texto: "Porque no llega a radiar nada"
        porque: "Radia: su resistencia de radiación es pequeña, pero no nula."
      - texto: "Porque su campo es solo cercano"
        porque: "Toda antena tiene campo cercano y lejano; el problema es la poca resistencia de radiación."
    escalera:
      - "P = I²·R_{rad}: con R_{rad} pequeña, ¿qué tiene que crecer?"
    solucion: "Mucha corriente: las pérdidas en serie igualan a lo radiado."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [17, 23, 38, 47, 55, 66]
    ideas:
      - { titulo: "Gauss y Ampère.", texto: "Con simetría dan C, L y el campo de un hilo." }
      - { titulo: "El desplazamiento.", texto: "Cierra el circuito por el dieléctrico, y con él los campos forman una onda." }
      - { titulo: "La línea.", texto: "Guía esa onda: el dieléctrico fija la velocidad; la geometría, Z₀." }
      - { titulo: "Cerca y lejos.", texto: "La frontera es λ/2π; más allá, E/H = 377 Ω." }
