# Lección 1.2 de la sección 37.2 «Cuando el Cable Deja de Ser un Cable» (cap36, sec-36.1). Formato: GUIA.md.
# - Longitud crítica = t_subida·v/6 (bloque 82), con 18 cm/ns de la tabla (coaxial) o 15 cm/ns en FR4 (bloque 83):
#   30, 15, 3 y 1,5 cm con 10, 5, 1 y 0,5 ns; 2,5 cm con 1 ns en FR4.
# Sin paso práctico aparte: sección de criterios (el banco del libro es mirar timbre o escalones con el osciloscopio).
# 1.2.1 (autor121-senpro, «aprender haciendo», GUIA §13): el flanco se acorta hasta que la longitud crítica baja de
# 5 cm; con 5 ns se pasa del coaxial al FR4 (12,5 cm); la de FR4 con 1 ns, el límite a 2,4 GHz y la Z₀ de una pista
# alargada se predicen; y en las barras de la figura 37.4 se tocan la impedancia del vídeo, la de USB y el compromiso
# de 50 Ω. Quedan dos preguntas de opciones (el reloj lento y el sexto) y los síntomas, por emparejar.
leccion: cap36/sec-36.1

libro:
  80: "Un cable es un cable mientras sea corto comparado con la longitud de onda"
  81: "El criterio práctico no depende de la frecuencia sino del tiempo de subida"
  82: '"longitud crítica"'
  83: "en una pista de FR4 la señal va a unos 15 cm/ns"
  84: "Tiempo de subida"
  85: "lo que decide es el flanco, no la frecuencia de repetición"
  86: "casi todas las pistas sean líneas de transmisión"
  87: "Un sexto del recorrido (5 cm en ese caso) deja margen"
  88: "a 2,4 GHz, λ es de 12,5 cm en el aire y unos 6,9 cm en FR4, y el límite baja a poco menos de 7 mm"
  96: "puede hacer cruzar el umbral varias veces y producir bits duplicados"
  97: "Escalones en la subida, que son la reflexión de un ramal"
  98: "Errores que aparecen al alargar el cable o al subir la velocidad"
  99: "el circuito funciona en la mesa y falla montado"
  101: "Depende solo de la geometría y del dieléctrico, no de la longitud"
  103: "No es una resistencia: no disipa"
  104: "50 Ω en instrumentación y radiofrecuencia, 75 Ω en vídeo"
  105: "50 Ω es un compromiso entre la máxima potencia (que se conseguiría con 30) y la mínima atenuación (con 77)"

modelo:
  valores:
    t_r: { sim: "t_{subida}", nombre: "tiempo de subida", unidad: s, valor: 0.000000005 }
    v_s: { sim: "v", nombre: "velocidad de la señal", unidad: "m/s", valor: 180000000 }
    l_F: { sim: "λ", nombre: "longitud de onda a 2,4 GHz en FR4", unidad: m, valor: 0.069 }
    l_A: { sim: "λ", nombre: "longitud de onda a 2,4 GHz en el aire", unidad: m, valor: 0.125 }
    Z_0: { sim: "Z₀", nombre: "impedancia característica de la pista", unidad: Ω, valor: 50 }
  calculos:
    l_c: { expr: "t_r*v_s/6", sim: "l_{crítica}", nombre: "longitud crítica", unidad: m }
    l_10: { expr: "l_F/10", sim: "λ/10", nombre: "límite de línea a 2,4 GHz", unidad: m }
    r_f: { expr: "t_r*v_s", sim: "recorrido", nombre: "lo que recorre el flanco", unidad: m }

tarjetas:
  - id: explore-longitud
    tipo: explorar
    titulo: "Lo que decide es el flanco"
    texto: "Una pista deja de ser un nudo cuando es larga frente a lo que recorre el flanco. Acorte el tiempo de subida hasta que la longitud crítica baje de 5 cm."
    libro: [80, 81, 84]
    inicio: { t_r: 0.00000001 }
    widget:
      tipo: grafica
      x: { id: tt, min: 0.0000000001, max: 0.0000001, unidad: s, rotulo: "t_{subida}", escala: log }
      y: { min: 0.001, max: 3, unidad: m, rotulo: "l_{crítica}", escala: log }
      curvas:
        - { expr: "tt*v_s/6", color: naranja, rotulo: "t_{subida}·v/6" }
      marcas:
        - { x: "t_r", y: "l_c", rotulo: "{{l_c}}" }
      lectura: { valor: l_c, rotulo: "Longitud crítica" }
      mandos:
        - { valor: t_r, lista: [0.00000001, 0.000000005, 0.000000001, 0.0000000005], rotulo: "Tiempo de subida" }
    objetivo:
      condiciones:
        - { valor: l_c, max: 0.05, rotulo: "l_{crítica} = {{l_c}}" }
      logrado: "Con flancos de {{t_r}}, {{l_c}}: con los dispositivos actuales, casi todas las pistas son líneas de transmisión."
      pistas:
        - { texto: "Aún cabe una pista larga: acorte el flanco." }
    escalera:
      - "La longitud crítica es proporcional al tiempo de subida."
    solucion: "1 ns: 3 cm."
    comprobar:
      - { con: { t_r: 0.000000001 }, l_c: 0.03 }

  - id: predecir-reloj-lento
    tipo: predecir
    titulo: "Un reloj de 1 kHz"
    texto: "Una señal de 1 kHz con flancos de 1 ns y otra de 100 MHz. ¿Cuál exige más cuidado con las pistas?"
    libro: [85, 86]
    widget:
      tipo: figura
      figura: fig-36.1
      zonas:
        - { id: grafica, rotulo: "Longitud crítica y flanco", rect: [0, 0, 213, 197] }
    opciones:
      - texto: "Las dos lo mismo: el flanco es el mismo"
        bien: true
        porque: "El contenido espectral del flanco es el mismo; la frecuencia de repetición no cuenta."
      - texto: "La de 100 MHz, que es más rápida"
        porque: "Rápida es la repetición, no el flanco: con 1 ns, las dos llevan las mismas frecuencias altas."
      - texto: "La de 1 kHz, porque tarda más"
        porque: "Lo que tarda es el periodo; lo que importa es lo que dura la subida."
    escalera:
      - "¿Qué tienen igual las dos señales?"
    solucion: "Las dos piden lo mismo: decide el flanco de 1 ns."

  - id: formula-longitud
    tipo: explorar
    titulo: "La longitud crítica"
    texto: "La longitud crítica es lo que recorre el flanco, dividido por seis. Con flancos de 5 ns, pase del coaxial a una pista de FR4."
    libro: [82, 83]
    fijar: { t_r: 0.000000005 }
    inicio: { v_s: 180000000 }
    widget:
      tipo: grafica
      x: { id: tt, min: 0.0000000001, max: 0.0000001, unidad: s, rotulo: "t_{subida}", escala: log }
      y: { min: 0.001, max: 3, unidad: m, rotulo: "l_{crítica}", escala: log }
      curvas:
        - { expr: "tt*v_s/6", color: naranja, rotulo: "t_{subida}·v/6" }
      marcas:
        - { x: "t_r", y: "l_c", rotulo: "{{l_c}}" }
      lectura: { valor: l_c, rotulo: "Longitud crítica" }
      mandos:
        - { valor: v_s, lista: [180000000, 150000000], nombres: [coaxial, pista en FR4], rotulo: "Medio" }
    objetivo:
      condiciones:
        - { valor: l_c, max: 0.13, rotulo: "l_{crítica} = {{l_c}}" }
      logrado: "{{t_r}} × {{v_s}} / 6 = {{l_c}}: en FR4 la señal va a unos 15 cm/ns y la longitud crítica se acorta."
      pistas:
        - { texto: "Sigue en el coaxial, a 18 cm/ns." }
    escalera:
      - "En FR4 la señal es más lenta."
    solucion: "Pista en FR4: 12,5 cm."
    comprobar:
      - { con: { v_s: 150000000 }, l_c: 0.125 }

  - id: estime-fr4
    tipo: simular
    titulo: "Una pista en FR4"
    texto: "En FR4 la señal va a unos 15 cm/ns. Con flancos de 1 ns, ¿cuál es la longitud crítica?"
    libro: [82, 83]
    fijar: { t_r: 0.000000001, v_s: 150000000 }
    widget:
      tipo: figura
      figura: fig-36.1
      zonas:
        - { id: grafica, rotulo: "Longitud crítica y flanco", rect: [0, 0, 213, 197] }
    simular:
      objetivo: l_c
      unidad: m
      tol: 0.04
      rotulo: "Longitud crítica"
      errores:
        - { expr: "r_f", texto: "Ese es el recorrido entero del flanco: divida por seis." }
        - { expr: "0.03", texto: "Esos 3 cm son del coaxial, a 18 cm/ns; en FR4 va más despacio." }
    exito: "2,5 cm: un sexto más corta que los 3 cm del coaxial."
    escalera:
      - "Recorrido del flanco: 1 ns × 15 cm/ns."
    solucion: "15 cm / 6 = 2,5 cm."
    comprobar:
      - { l_c: 0.025, r_f: 0.15 }

  - id: porque-un-sexto
    tipo: porque
    titulo: "Por qué un sexto"
    texto: "Un flanco de 2 ns recorre unos 30 cm en FR4. ¿Por qué el criterio no admite pistas hasta 15 cm?"
    libro: [87]
    widget:
      tipo: figura
      figura: fig-36.1
      zonas:
        - { id: grafica, rotulo: "Longitud crítica y flanco", rect: [0, 0, 213, 197] }
    opciones:
      - texto: "Con más de 15 cm la reflexión ya sale como escalones; un sexto deja margen"
        bien: true
        porque: "Si la ida y vuelta supera el flanco, se ven escalones; con 5 cm la reflexión ni deforma el flanco."
      - texto: "Porque a partir de 15 cm la señal se atenúa"
        porque: "El problema no es la pérdida: son las reflexiones que deforman el flanco."
      - texto: "Porque el reloj es de 1 MHz"
        porque: "La frecuencia del reloj no entra: los escalones salen igual con un reloj lento."
    escalera:
      - "Compare el tiempo de ida y vuelta por la pista con el de subida."
    solucion: "Por encima de 15 cm hay escalones; un sexto, 5 cm, deja margen."

  - id: pregunta-24ghz
    tipo: simular
    titulo: "Una señal de 2,4 GHz"
    texto: "Con senoides, es línea todo conductor de más de λ/10. A 2,4 GHz, con λ de unos 6,9 cm en FR4, ¿dónde está el límite?"
    libro: [88]
    widget:
      tipo: figura
      figura: fig-36.1
      zonas:
        - { id: grafica, rotulo: "Longitud crítica y flanco", rect: [0, 0, 213, 197] }
    simular:
      objetivo: l_10
      unidad: m
      tol: 0.04
      rotulo: "Límite de línea"
      errores:
        - { expr: "l_A", texto: "Esa es λ entera, y en el aire; el límite es una décima de λ en FR4." }
        - { expr: "l_F", texto: "Esa es λ entera: el límite es una décima." }
    exito: "Poco menos de 7 mm: casi cualquier pista de una placa de 2,4 GHz es una línea."
    escalera:
      - "Divida la λ en FR4 por diez."
    solucion: "6,9 cm / 10: poco menos de 7 mm."
    comprobar:
      - { l_10: 0.0069, l_A: 0.125, l_F: 0.069 }

  - id: empareje-sintomas
    tipo: pregunta
    titulo: "Los síntomas de ignorarlo"
    texto: "Empareje cada síntoma con lo que lo provoca."
    libro: [96, 97, 98, 99]
    widget:
      tipo: figura
      figura: fig-36.1
      zonas:
        - { id: grafica, rotulo: "Longitud crítica y flanco", rect: [0, 0, 213, 197] }
    emparejar:
      - ["Timbre en los flancos", "Cruza el umbral varias veces: bits duplicados"]
      - ["Escalones en la subida", "La reflexión de un ramal"]
      - ["Falla al alargar el cable", "La línea ha pasado a ser larga"]
      - ["Funciona en la mesa y falla montado", "El cableado cambió las longitudes"]
    exito: "Reconocerlos ahorra tiempo: todos son reflexiones de una línea larga."
    pistas:
      - { texto: "Un escalón en la subida es una onda que vuelve de un sitio concreto." }
    escalera:
      - "El timbre es una oscilación; el escalón, un eco."
    solucion: "Timbre, bits duplicados; escalones, un ramal; al alargar, línea larga; montado, otras longitudes."

  - id: explore-impedancias
    tipo: tocar
    titulo: "La impedancia característica"
    texto: "La inductancia y la capacidad repartidas fijan Z₀ = √(L/C), y cada uso tiene su valor redondo. Toque la barra del vídeo."
    libro: [101, 104, 86]
    widget:
      tipo: figura
      figura: fig-36.1
      zonas: &zonas-z0
        - { id: z50, rotulo: "Primera barra", rect: [291, 10, 143, 36] }
        - { id: z75, rotulo: "Segunda barra", rect: [291, 46, 143, 36] }
        - { id: z90, rotulo: "Tercera barra", rect: [291, 82, 143, 36] }
        - { id: z100, rotulo: "Cuarta barra", rect: [291, 118, 143, 36] }
    tocar:
      bien: [z75]
      porque:
        z50: "50 Ω es la de instrumentación y radiofrecuencia."
        z90: "90 Ω diferencial es la de USB."
        z100: "100 Ω diferencial, Ethernet y casi todos los buses rápidos."
    exito: "75 Ω: el cable de la antena de la televisión."
    escalera:
      - "Busque la segunda de las impedancias habituales."
    solucion: "La segunda barra, 75 Ω."

  - id: empareje-impedancias
    tipo: tocar
    titulo: "Cada uso, su impedancia"
    texto: "Toque la impedancia diferencial de USB."
    libro: [104]
    widget:
      tipo: figura
      figura: fig-36.1
      zonas: *zonas-z0
    tocar:
      bien: [z90]
      porque:
        z50: "50 Ω no es diferencial: instrumentación y radiofrecuencia."
        z75: "75 Ω, vídeo."
        z100: "100 Ω diferencial es Ethernet; USB va algo por debajo."
    exito: "90 Ω diferencial, USB; 100 Ω, Ethernet. Valores redondos, y no por casualidad."
    escalera:
      - "Los dos diferenciales son los dos de abajo."
    solucion: "La tercera barra, 90 Ω."

  - id: porque-50
    tipo: tocar
    titulo: "Por qué 50 Ω"
    texto: "En un coaxial, la máxima potencia se lograría con 30 Ω y la mínima atenuación con 77 Ω. Toque el compromiso entre los dos."
    libro: [105]
    widget:
      tipo: figura
      figura: fig-36.1
      zonas: *zonas-z0
    tocar:
      bien: [z50]
      porque:
        z75: "75 Ω está cerca de la mínima atenuación: por eso el vídeo, con poca potencia, la usa."
        z90: "90 Ω es diferencial, de USB."
        z100: "100 Ω es diferencial, de Ethernet."
    exito: "50 Ω: ni el mejor para potencia ni el mejor para pérdidas, razonable para los dos."
    escalera:
      - "Busque el valor que queda entre 30 y 77."
    solucion: "La primera barra, 50 Ω."

  - id: pregunta-z0
    tipo: simular
    titulo: "De qué depende Z₀"
    texto: "Una pista de 50 Ω se alarga al doble. ¿Qué impedancia característica tiene ahora?"
    libro: [101, 103]
    widget:
      tipo: figura
      figura: fig-36.1
      zonas: *zonas-z0
    simular:
      objetivo: Z_0
      unidad: Ω
      tol: 0.02
      rotulo: "Z₀ de la pista larga"
      errores:
        - { expr: "2*Z_0", texto: "Eso haría una resistencia; Z₀ no disipa ni depende de la longitud." }
        - { expr: "Z_0/2", texto: "La longitud no entra en Z₀: solo la anchura, el espesor y el plano." }
    exito: "50 Ω: L y C por metro son las mismas. Z₀ es el cociente tensión/corriente de la onda que viaja."
    escalera:
      - "Z₀ = √(L/C) con L y C por unidad de longitud."
    solucion: "La misma, 50 Ω."
    comprobar:
      - { Z_0: 50 }

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [81, 85, 88, 101, 105]
    ideas:
      - { titulo: "El flanco decide.", texto: "Longitud crítica ≈ t_{subida}·v/6, no la frecuencia del reloj." }
      - { titulo: "En radio, λ/10.", texto: "A 2,4 GHz en FR4, poco menos de 7 mm." }
      - { titulo: "Z₀ = √(L/C).", texto: "Geometría y dieléctrico; no disipa ni depende de la longitud." }
      - { titulo: "Los síntomas.", texto: "Timbre, escalones y fallos al alargar o al montar." }
