# Lección 1.2 de la sección 37.2 «Cuando el Cable Deja de Ser un Cable» (cap36, sec-36.1). Formato: GUIA.md.
# - Longitud crítica = t_subida·v/6 (bloque 82), con 18 cm/ns de la tabla (coaxial) o 15 cm/ns en FR4 (bloque 83):
#   30, 15, 3 y 1,5 cm con 10, 5, 1 y 0,5 ns; 2,5 cm con 1 ns en FR4.
# Sin paso práctico aparte: sección de criterios (el banco del libro es mirar timbre o escalones con el osciloscopio).
leccion: cap36/sec-36.1

libro:
  80: "Un cable es un cable mientras sea corto comparado con la longitud de onda"
  81: "El criterio práctico no depende de la frecuencia sino del tiempo de subida"
  82: '"longitud crítica"'
  83: "en una pista de FR4 la señal va a unos 15 cm/ns"
  84: "Tiempo de subida"
  85: "lo que decide es el flanco, no la frecuencia de repetición"
  86: "casi todas las pistas sean líneas de transmisión"
  87: "Un sexto del recorrido (5 cm en ese caso) deja margen"
  88: "a 2,4 GHz, λ es de 12,5 cm en el aire y unos 6,9 cm en FR4, y el límite baja a poco menos de 7 mm"
  96: "puede hacer cruzar el umbral varias veces y producir bits duplicados"
  97: "Escalones en la subida, que son la reflexión de un ramal"
  98: "Errores que aparecen al alargar el cable o al subir la velocidad"
  99: "el circuito funciona en la mesa y falla montado"
  101: "Depende solo de la geometría y del dieléctrico, no de la longitud"
  103: "No es una resistencia: no disipa"
  104: "50 Ω en instrumentación y radiofrecuencia, 75 Ω en vídeo"
  105: "50 Ω es un compromiso entre la máxima potencia (que se conseguiría con 30) y la mínima atenuación (con 77)"

modelo:
  valores:
    t_r: { sim: "t_{subida}", nombre: "tiempo de subida", unidad: s, valor: 0.000000005 }
    v_s: { sim: "v", nombre: "velocidad de la señal", unidad: "m/s", valor: 180000000 }
  calculos:
    l_c: { expr: "t_r*v_s/6", sim: "l_{crítica}", nombre: "longitud crítica", unidad: m }

tarjetas:
  - id: explore-longitud
    tipo: explorar
    titulo: "Lo que decide es el flanco"
    texto: "Una pista deja de ser un nudo cuando es larga frente a lo que recorre el flanco. Acorte el tiempo de subida."
    libro: [80, 81, 84]
    widget:
      tipo: grafica
      x: { id: tt, min: 0.0000000001, max: 0.0000001, unidad: s, rotulo: "t_{subida}", escala: log }
      y: { min: 0.001, max: 3, unidad: m, rotulo: "l_{crítica}", escala: log }
      curvas:
        - { expr: "tt*v_s/6", color: naranja, rotulo: "t_{subida}·v/6" }
      marcas:
        - { x: "t_r", y: "l_c", rotulo: "{{l_c}}" }
      lectura: { valor: l_c, rotulo: "Longitud crítica" }
      mandos:
        - { valor: t_r, lista: [0.00000001, 0.000000005, 0.000000001, 0.0000000005], rotulo: "Tiempo de subida" }
    requiere: { mover: [t_r] }

  - id: predecir-reloj-lento
    tipo: predecir
    titulo: "Un reloj de 1 kHz"
    texto: "Una señal de 1 kHz con flancos de 1 ns y otra de 100 MHz. ¿Cuál exige más cuidado con las pistas?"
    libro: [85, 86]
    widget:
      tipo: figura
      figura: fig-36.1
      zonas:
        - { id: grafica, rotulo: "Longitud crítica y flanco", rect: [0, 0, 213, 197] }
    opciones:
      - texto: "Las dos lo mismo: el flanco es el mismo"
        bien: true
        porque: "El contenido espectral del flanco es el mismo; la frecuencia de repetición no cuenta."
      - texto: "La de 100 MHz, que es más rápida"
        porque: "Rápida es la repetición, no el flanco: con 1 ns, las dos llevan las mismas frecuencias altas."
      - texto: "La de 1 kHz, porque tarda más"
        porque: "Lo que tarda es el periodo; lo que importa es lo que dura la subida."
    escalera:
      - "¿Qué tienen igual las dos señales?"
    solucion: "Las dos piden lo mismo: decide el flanco de 1 ns."

  - id: formula-longitud
    tipo: formula
    titulo: "La longitud crítica"
    texto: "Lo que recorre el flanco, dividido por seis. Cambie el medio y el tiempo de subida."
    libro: [82, 83]
    ec: 82
    sustitucion: "{{t_r}} × {{v_s}} / 6 = {{l_c}}"
    widget:
      tipo: grafica
      x: { id: tt, min: 0.0000000001, max: 0.0000001, unidad: s, rotulo: "t_{subida}", escala: log }
      y: { min: 0.001, max: 3, unidad: m, rotulo: "l_{crítica}", escala: log }
      curvas:
        - { expr: "tt*v_s/6", color: naranja, rotulo: "t_{subida}·v/6" }
      marcas:
        - { x: "t_r", y: "l_c", rotulo: "{{l_c}}" }
      lectura: { valor: l_c, rotulo: "Longitud crítica" }
      mandos:
        - { valor: t_r, lista: [0.00000001, 0.000000005, 0.000000001, 0.0000000005], rotulo: "Tiempo de subida" }
        - { valor: v_s, lista: [180000000, 150000000], nombres: [coaxial, pista en FR4], rotulo: "Medio" }

  - id: estime-fr4
    tipo: pregunta
    titulo: "Una pista en FR4"
    texto: "En FR4 la señal va a unos 15 cm/ns. Con flancos de 1 ns, ¿cuál es la longitud crítica?"
    libro: [82, 83]
    fijar: { t_r: 0.000000001, v_s: 150000000 }
    widget:
      tipo: figura
      figura: fig-36.1
      zonas:
        - { id: grafica, rotulo: "Longitud crítica y flanco", rect: [0, 0, 213, 197] }
    estimar:
      objetivo: "l_c"
      unidad: m
      min: 0
      max: 0.1
      paso: 0.001
      inicio: 0.08
      tol: 0.05
      rotulo: "Longitud crítica"
    exito: "2,5 cm: un sexto más corta que los 3 cm del coaxial."
    pistas:
      - { cuando: { valor: estimacion, mayor: 0.0263 }, texto: "Demasiado: ha usado el recorrido entero. Divida por seis." }
      - { texto: "Demasiado corta: 1 ns a 15 cm/ns son 15 cm de recorrido; un sexto." }
    escalera:
      - "Recorrido del flanco: 1 ns × 15 cm/ns."
    solucion: "15 cm / 6 = 2,5 cm."
    comprobar:
      - { l_c: 0.025 }

  - id: porque-un-sexto
    tipo: porque
    titulo: "Por qué un sexto"
    texto: "Un flanco de 2 ns recorre unos 30 cm en FR4. ¿Por qué el criterio no admite pistas hasta 15 cm?"
    libro: [87]
    widget:
      tipo: figura
      figura: fig-36.1
      zonas:
        - { id: grafica, rotulo: "Longitud crítica y flanco", rect: [0, 0, 213, 197] }
    opciones:
      - texto: "Con más de 15 cm la reflexión ya sale como escalones; un sexto deja margen"
        bien: true
        porque: "Si la ida y vuelta supera el flanco, se ven escalones; con 5 cm la reflexión ni deforma el flanco."
      - texto: "Porque a partir de 15 cm la señal se atenúa"
        porque: "El problema no es la pérdida: son las reflexiones que deforman el flanco."
      - texto: "Porque el reloj es de 1 MHz"
        porque: "La frecuencia del reloj no entra: los escalones salen igual con un reloj lento."
    escalera:
      - "Compare el tiempo de ida y vuelta por la pista con el de subida."
    solucion: "Por encima de 15 cm hay escalones; un sexto, 5 cm, deja margen."

  - id: pregunta-24ghz
    tipo: pregunta
    titulo: "Una señal de 2,4 GHz"
    texto: "Con senoides, es línea todo conductor de más de λ/10. A 2,4 GHz, con λ de unos 6,9 cm en FR4, ¿dónde está el límite?"
    libro: [88]
    widget:
      tipo: figura
      figura: fig-36.1
      zonas:
        - { id: grafica, rotulo: "Longitud crítica y flanco", rect: [0, 0, 213, 197] }
    opciones:
      - texto: "En poco menos de 7 mm"
        bien: true
        porque: "Una décima de 6,9 cm: casi cualquier pista de una placa de 2,4 GHz es una línea."
      - texto: "En 12,5 cm"
        porque: "Esa es λ entera, y en el aire; el límite es una décima de λ en FR4."
      - texto: "En 16 cm"
        porque: "Ese es el límite a 100 MHz; a 2,4 GHz baja mucho."
    escalera:
      - "Divida la λ en FR4 por diez."
    solucion: "6,9 cm / 10: poco menos de 7 mm."

  - id: empareje-sintomas
    tipo: pregunta
    titulo: "Los síntomas de ignorarlo"
    texto: "Empareje cada síntoma con lo que lo provoca."
    libro: [96, 97, 98, 99]
    widget:
      tipo: figura
      figura: fig-36.1
      zonas:
        - { id: grafica, rotulo: "Longitud crítica y flanco", rect: [0, 0, 213, 197] }
    emparejar:
      - ["Timbre en los flancos", "Cruza el umbral varias veces: bits duplicados"]
      - ["Escalones en la subida", "La reflexión de un ramal"]
      - ["Falla al alargar el cable", "La línea ha pasado a ser larga"]
      - ["Funciona en la mesa y falla montado", "El cableado cambió las longitudes"]
    exito: "Reconocerlos ahorra tiempo: todos son reflexiones de una línea larga."
    pistas:
      - { texto: "Un escalón en la subida es una onda que vuelve de un sitio concreto." }
    escalera:
      - "El timbre es una oscilación; el escalón, un eco."
    solucion: "Timbre, bits duplicados; escalones, un ramal; al alargar, línea larga; montado, otras longitudes."

  - id: explore-impedancias
    tipo: explorar
    titulo: "La impedancia característica"
    texto: "La inductancia y la capacidad repartidas fijan Z₀ = √(L/C). Toque la zona sombreada y las impedancias habituales."
    libro: [101, 104, 86]
    widget:
      tipo: figura
      figura: fig-36.1
      zonas:
        - { id: actuales, rotulo: "Zona sombreada de la gráfica", rect: [31, 14, 61, 153], texto: "Los flancos actuales son de fracciones de nanosegundo: casi todas las pistas son líneas de transmisión." }
        - { id: barras, rotulo: "Barras de la derecha", rect: [232, 14, 203, 160], texto: "50 Ω en RF e instrumentación, 75 Ω en vídeo; 90 y 100 Ω diferenciales en USB y Ethernet." }
    requiere: { mover: [actuales, barras] }

  - id: empareje-impedancias
    tipo: pregunta
    titulo: "Cada uso, su impedancia"
    texto: "Empareje cada impedancia con dónde se usa."
    libro: [104]
    widget:
      tipo: figura
      figura: fig-36.1
      zonas:
        - { id: barras, rotulo: "Barras de la derecha", rect: [232, 14, 203, 160] }
    emparejar:
      - ["50 Ω", "Instrumentación y radiofrecuencia"]
      - ["75 Ω", "Vídeo"]
      - ["90 Ω diferencial", "USB"]
      - ["100 Ω diferencial", "Ethernet y casi todos los buses rápidos"]
    exito: "Valores redondos, y no por casualidad."
    pistas:
      - { texto: "Los dos diferenciales son de buses de datos." }
    escalera:
      - "El cable de la antena de la televisión es el de vídeo."
    solucion: "50, RF; 75, vídeo; 90 dif., USB; 100 dif., Ethernet."

  - id: porque-50
    tipo: porque
    titulo: "Por qué 50 Ω"
    texto: "En un coaxial, la máxima potencia se lograría con 30 Ω y la mínima atenuación con 77 Ω. ¿Por qué se usa 50?"
    libro: [105]
    widget:
      tipo: figura
      figura: fig-36.1
      zonas:
        - { id: barras, rotulo: "Barras de la derecha", rect: [232, 14, 203, 160] }
    opciones:
      - texto: "Es un compromiso entre esos dos óptimos"
        bien: true
        porque: "Ni el mejor para potencia ni el mejor para pérdidas: razonable para los dos."
      - texto: "Es la media exacta entre 30 y 77"
        porque: "No es una media: es un compromiso redondo entre dos criterios."
      - texto: "Es la impedancia de una antena"
        porque: "No viene de las antenas: viene del propio cable coaxial."
    escalera:
      - "Ninguno de los dos óptimos es 50."
    solucion: "Un compromiso entre máxima potencia (30) y mínima atenuación (77)."

  - id: pregunta-z0
    tipo: pregunta
    titulo: "De qué depende Z₀"
    texto: "Una pista de 50 Ω se alarga al doble. ¿Qué le pasa a su impedancia característica?"
    libro: [101, 103]
    widget:
      tipo: figura
      figura: fig-36.1
      zonas:
        - { id: barras, rotulo: "Barras de la derecha", rect: [232, 14, 203, 160] }
    opciones:
      - texto: "Nada: depende de la geometría y del dieléctrico"
        bien: true
        porque: "Es el cociente tensión/corriente de la onda que viaja, no una resistencia."
      - texto: "Se duplica"
        porque: "Eso haría una resistencia; Z₀ no disipa ni depende de la longitud."
      - texto: "Se reduce a la mitad"
        porque: "La longitud no entra en Z₀: solo la anchura, el espesor y el plano."
    escalera:
      - "Z₀ = √(L/C) con L y C por unidad de longitud."
    solucion: "No cambia: L y C por metro son las mismas."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [81, 85, 88, 101, 105]
    ideas:
      - { titulo: "El flanco decide.", texto: "Longitud crítica ≈ t_{subida}·v/6, no la frecuencia del reloj." }
      - { titulo: "En radio, λ/10.", texto: "A 2,4 GHz en FR4, poco menos de 7 mm." }
      - { titulo: "Z₀ = √(L/C).", texto: "Geometría y dieléctrico; no disipa ni depende de la longitud." }
      - { titulo: "Los síntomas.", texto: "Timbre, escalones y fallos al alargar o al montar." }
