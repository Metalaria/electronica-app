# Lección 1.2 de la sección 37.8 «Los Bloques de RF» (cap36, sec-36.7). Formato: GUIA.md.
# Sin modelo numérico: la figura 37.12 (los ocho bloques y las tres reglas del presupuesto) con zonas.
# Paso práctico: «tocar» el bloque que crea frecuencias nuevas (el mezclador).
# 1.2.1 (autor121-senpro, «aprender haciendo», GUIA §13): cada papel se toca en su bloque de la figura 37.12 (el
# oscilador local por su ruido de fase, el PA por la energía y la linealidad, el mezclador, el LNA por el ruido y el
# filtro de entrada, lo antes posible); la entrada se sube hasta que los productos de tercer orden asoman (IIP3 de 0 dBm y suelo de −100 dBm, de ejemplo). Quedan dos preguntas de
# opciones: la distorsión y el receptor en la ciudad.
leccion: cap36/sec-36.7

libro:
  280: "Conocerlos permite leer cualquier esquema de radio"
  281: "Su figura de ruido determina la del sistema entero"
  282: "En la entrada evita que señales fuertes fuera de banda saturen el LNA"
  283: "es la única forma de crear frecuencias nuevas"
  284: "cuyo ruido de fase se traslada a la señal"
  285: "donde se concentra la ganancia y la selectividad"
  286: "Demodulador, que extrae la información"
  287: "donde se va la energía y donde importa la linealidad"
  288: "adapta el sistema al margen enorme de niveles de señal"
  291: "La ganancia se suma en decibelios"
  292: "El ruido lo domina la primera etapa"
  293: "la distorsión la domina la última, porque es donde la señal es mayor"
  294: "un preselector de pocas pérdidas, después el LNA"
  298: "el nivel de entrada al que la ganancia cae 1 dB"
  299: "Los productos de intermodulación crecen tres veces más rápido que la señal"
  300: "dos señales fuertes fuera de banda pueden generar un producto de intermodulación dentro de banda"
  303: "Es lo que separa la señal más débil detectable"
  304: "más ganancia baja el suelo y también el techo"
  305: "Por eso existe el AGC, y por eso el filtro va lo antes posible"

modelo:
  valores:
    d_s: { sim: "ΔP_{entrada}", nombre: "subida de la señal de entrada", unidad: dB, valor: 1 }
    P_in: { sim: "P_{entrada}", nombre: "nivel de cada señal de entrada", unidad: dBm, valor: -60 }
    I_3: { sim: "IIP3", nombre: "punto de intercepción, de ejemplo", unidad: dBm, valor: 0 }
    N_f: { sim: "suelo", nombre: "suelo de ruido, de ejemplo", unidad: dBm, valor: -100 }
  calculos:
    d_3: { expr: "3*d_s", sim: "ΔP_{IM3}", nombre: "subida de los productos de tercer orden", unidad: dB }
    P_3: { expr: "3*P_in - 2*I_3", sim: "P_{IM3}", nombre: "nivel de los productos de tercer orden", unidad: dBm }

tarjetas:
  - id: explore-bloques
    tipo: tocar
    titulo: "Ocho bloques para cualquier radio"
    texto: "Receptor, transmisor o transceptor: el mismo repertorio de bloques. Toque el que se sintetiza con un PLL y cuyo ruido de fase se traslada a la señal."
    libro: [280, 284, 285, 286, 288]
    widget:
      tipo: figura
      figura: fig-36.9
      zonas: &zonas-rf
        - { id: filtro, rotulo: "Primer bloque de arriba", rect: [41, 32, 69, 39] }
        - { id: lna, rotulo: "Segundo bloque de arriba", rect: [121, 32, 69, 39] }
        - { id: mezclador, rotulo: "Tercer bloque de arriba", rect: [201, 32, 69, 39] }
        - { id: fi, rotulo: "Cuarto bloque de arriba", rect: [281, 32, 69, 39] }
        - { id: demodulador, rotulo: "Quinto bloque de arriba", rect: [361, 32, 69, 39] }
        - { id: pa, rotulo: "Primer bloque de abajo", rect: [41, 101, 69, 39] }
        - { id: oscilador, rotulo: "Bloque de abajo en el centro", rect: [201, 101, 69, 39] }
        - { id: agc, rotulo: "Bloque de abajo a la derecha", rect: [361, 101, 69, 39] }
    tocar:
      bien: [oscilador]
      porque:
        filtro: "El filtro selecciona la banda; en la entrada evita que lo fuerte sature el LNA."
        lna: "El LNA amplifica lo débil con poco ruido: su figura de ruido fija la del sistema."
        mezclador: "El mezclador multiplica por el oscilador local y traslada la señal en frecuencia."
        fi: "El amplificador de FI concentra la ganancia y la selectividad."
        demodulador: "El demodulador extrae la información."
        pa: "El PA da la potencia: ahí se va la energía e importa la linealidad."
        agc: "El AGC adapta el sistema al margen enorme de niveles de señal."
    exito: "El oscilador local. Con los ocho bloques se lee cualquier esquema de radio."
    escalera:
      - "Busque el bloque que alimenta al mezclador desde abajo."
    solucion: "El bloque de abajo en el centro, el oscilador local."

  - id: empareje-bloques
    tipo: tocar
    titulo: "Cada bloque, su trabajo"
    texto: "Toque el bloque del transmisor donde se va la energía y donde importa la linealidad."
    libro: [287]
    widget:
      tipo: figura
      figura: fig-36.9
      zonas: *zonas-rf
    tocar:
      bien: [pa]
      porque:
        filtro: "El filtro selecciona la banda; en la entrada evita que lo fuerte sature el LNA."
        lna: "El LNA amplifica lo débil con poco ruido: su figura de ruido fija la del sistema."
        mezclador: "El mezclador multiplica por el oscilador local y traslada la señal en frecuencia."
        fi: "El amplificador de FI concentra la ganancia y la selectividad."
        demodulador: "El demodulador extrae la información."
        oscilador: "El oscilador local, sintetizado con un PLL: su ruido de fase pasa a la señal."
        agc: "El AGC adapta el sistema al margen enorme de niveles de señal."
    exito: "El PA, el amplificador de potencia."
    escalera:
      - "Está en la fila del transmisor."
    solucion: "El primer bloque de abajo, el PA."

  - id: toque-frecuencias-nuevas
    tipo: tocar
    titulo: "Crear frecuencias nuevas"
    texto: "Un circuito lineal no crea frecuencias que no estaban. Toque el bloque que sí lo hace, a propósito."
    libro: [283]
    widget:
      tipo: figura
      figura: fig-36.9
      zonas:
        - { id: filtro, rotulo: "Primer bloque de arriba", rect: [41, 32, 69, 39] }
        - { id: lna, rotulo: "Segundo bloque de arriba", rect: [121, 32, 69, 39] }
        - { id: mezclador, rotulo: "Tercer bloque de arriba", rect: [201, 32, 69, 39] }
        - { id: fi, rotulo: "Cuarto bloque de arriba", rect: [281, 32, 69, 39] }
        - { id: agc, rotulo: "Bloque de abajo a la derecha", rect: [361, 101, 69, 39] }
    tocar:
      bien: [mezclador]
      porque:
        filtro: "El filtro selecciona: deja pasar unas frecuencias y rechaza otras, sin crear ninguna."
        lna: "El LNA amplifica; si es bueno, lo hace de forma lineal."
        fi: "El amplificador de FI amplifica y selecciona en una frecuencia fija."
        agc: "El AGC ajusta la ganancia según el nivel; no crea frecuencias."
    exito: "El mezclador: deliberadamente no lineal, multiplica por el oscilador local."
    escalera:
      - "Busque el bloque que recibe dos señales."
    solucion: "El mezclador, el tercero de arriba."

  - id: predecir-ruido
    tipo: tocar
    titulo: "Quién manda en el ruido"
    texto: "La ganancia se suma en decibelios, y el ruido lo domina la primera etapa. Toque la etapa amplificadora que fija la figura de ruido del sistema."
    libro: [281, 291, 292]
    widget:
      tipo: figura
      figura: fig-36.9
      zonas: *zonas-rf
    tocar:
      bien: [lna]
      porque:
        filtro: "El filtro selecciona la banda; en la entrada evita que lo fuerte sature el LNA."
        mezclador: "El mezclador multiplica por el oscilador local y traslada la señal en frecuencia."
        fi: "El amplificador de FI concentra la ganancia y la selectividad."
        demodulador: "El demodulador extrae la información."
        pa: "El PA da la potencia: ahí se va la energía e importa la linealidad."
        oscilador: "El oscilador local, sintetizado con un PLL: su ruido de fase pasa a la señal."
        agc: "El AGC adapta el sistema al margen enorme de niveles de señal."
    exito: "El LNA: su ruido se amplifica con todo lo demás; el de las siguientes llega dividido por su ganancia."
    escalera:
      - "Es la primera que amplifica."
    solucion: "El segundo bloque de arriba, el LNA."

  - id: pregunta-distorsion
    tipo: pregunta
    titulo: "Quién manda en la distorsión"
    texto: "¿Y qué etapa domina la distorsión de la cadena?"
    libro: [293, 294]
    widget:
      tipo: figura
      figura: fig-36.9
      zonas:
        - { id: reglas, rotulo: "Las tres reglas, abajo", rect: [0, 160, 450, 60] }
    opciones:
      - texto: "La última, donde la señal es mayor"
        bien: true
        porque: "La no linealidad aparece con señal grande: por eso la ganancia se reparte."
      - texto: "La primera, como el ruido"
        porque: "El ruido sí; la distorsión crece donde la señal ya es grande, al final."
      - texto: "El filtro de entrada"
        porque: "Un filtro pasivo de pocas pérdidas apenas distorsiona."
    escalera:
      - "¿Dónde llega la señal más amplificada?"
    solucion: "La última: ninguna etapa debe trabajar cerca de su compresión."

  - id: pregunta-ip3
    tipo: explorar
    titulo: "Los productos de intermodulación"
    texto: "Dos señales fuertes generan productos de tercer orden, que crecen tres veces más rápido. Suba la entrada hasta que asomen sobre el suelo de ruido."
    nota: "Punto de intercepción y suelo de ejemplo."
    libro: [298, 299, 300]
    inicio: { P_in: -60 }
    widget:
      tipo: grafica
      x: { id: p, min: -60, max: 0, unidad: dBm, rotulo: "entrada" }
      y: { min: -140, max: 10, unidad: dBm, rotulo: "salida" }
      curvas:
        - { expr: "p", color: azul, rotulo: "señal, 1 dB por dB" }
        - { expr: "3*p - 2*I_3", color: naranja, rotulo: "tercer orden, 3 dB por dB" }
        - { expr: "N_f", color: tinta, rotulo: "suelo de ruido", discontinua: true }
      marcas:
        - { x: "P_in", y: "P_3", rotulo: "{{P_3}}" }
      lectura: { valor: P_3, rotulo: "Productos de tercer orden" }
      mandos:
        - { valor: P_in, min: -60, max: 0, paso: 5, rotulo: "Nivel de entrada" }
    objetivo:
      condiciones:
        - { valor: P_3, min: -100, rotulo: "Tercer orden: {{P_3}}" }
      logrado: "Con {{P_in}} asoman: cada decibelio de señal les da tres. Si caen dentro de banda, parecen señales. El IP3 es donde las dos rectas se cortarían."
      pistas:
        - { texto: "Aún bajo el suelo: suba la entrada." }
    escalera:
      - "La recta naranja sube tres veces más deprisa que la azul."
    solucion: "Unos −30 dBm."
    comprobar:
      - { con: { P_in: -30 }, P_3: -90 }
      - { d_3: 3, d_s: 1 }

  - id: predecir-ciudad
    tipo: predecir
    titulo: "Un receptor en la ciudad"
    texto: "Un receptor con mucha ganancia inicial oye muy bien las señales débiles. ¿Qué le pasa cerca de un transmisor potente?"
    libro: [300, 303, 304]
    widget:
      tipo: figura
      figura: fig-36.9
      zonas:
        - { id: cadena, rotulo: "La cadena de bloques", rect: [0, 0, 450, 150] }
    opciones:
      - texto: "Se satura, y aparecen productos dentro de banda que parecen señales"
        bien: true
        porque: "Más ganancia baja el suelo y también el techo: el margen dinámico se desplaza."
      - texto: "Nada: el filtro de FI lo elimina"
        porque: "El producto de intermodulación cae dentro de banda: ningún filtro posterior lo distingue."
      - texto: "Oye todavía mejor"
        porque: "Lo fuerte no ayuda: comprime la ganancia y genera espurios."
    escalera:
      - "El margen dinámico va del suelo de ruido a la compresión."
    solucion: "Se satura y genera productos en banda: es lo que ocurre en una ciudad."

  - id: porque-filtro-pronto
    tipo: tocar
    titulo: "El filtro, lo antes posible"
    texto: "Más ganancia baja el suelo y también el techo. Toque el bloque que debe ir antes del LNA para que lo fuerte fuera de banda no lo sature."
    libro: [282, 305]
    widget:
      tipo: figura
      figura: fig-36.9
      zonas: *zonas-rf
    tocar:
      bien: [filtro]
      porque:
        lna: "El LNA amplifica lo débil con poco ruido: su figura de ruido fija la del sistema."
        mezclador: "El mezclador multiplica por el oscilador local y traslada la señal en frecuencia."
        fi: "El amplificador de FI concentra la ganancia y la selectividad."
        demodulador: "El demodulador extrae la información."
        pa: "El PA da la potencia: ahí se va la energía e importa la linealidad."
        oscilador: "El oscilador local, sintetizado con un PLL: su ruido de fase pasa a la señal."
        agc: "El AGC adapta el sistema al margen enorme de niveles de señal."
    exito: "El filtro de entrada, de pocas pérdidas: quitar lo fuerte antes de amplificar protege todo el margen dinámico. Por eso existen también el AGC y el preselector."
    escalera:
      - "Va el primero de la cadena."
    solucion: "El primer bloque de arriba, el filtro."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [283, 291, 292, 293, 304]
    ideas:
      - { titulo: "Ocho bloques.", texto: "Filtro, LNA, mezclador, oscilador local, FI, demodulador, PA y AGC." }
      - { titulo: "El presupuesto.", texto: "Ganancia en dB; ruido, la primera etapa; distorsión, la última." }
      - { titulo: "IP3.", texto: "Los productos de tercer orden crecen tres veces más rápido que la señal." }
      - { titulo: "Margen dinámico.", texto: "Más ganancia baja el suelo y el techo: filtro pronto y AGC." }
