# Lección 1.2 de la sección 37.8 «Los Bloques de RF» (cap36, sec-36.7). Formato: GUIA.md.
# Sin modelo numérico: la figura 37.12 (los ocho bloques y las tres reglas del presupuesto) con zonas.
# Paso práctico: «tocar» el bloque que crea frecuencias nuevas (el mezclador).
leccion: cap36/sec-36.7

libro:
  280: "Conocerlos permite leer cualquier esquema de radio"
  281: "Su figura de ruido determina la del sistema entero"
  282: "En la entrada evita que señales fuertes fuera de banda saturen el LNA"
  283: "es la única forma de crear frecuencias nuevas"
  284: "cuyo ruido de fase se traslada a la señal"
  285: "donde se concentra la ganancia y la selectividad"
  286: "Demodulador, que extrae la información"
  287: "donde se va la energía y donde importa la linealidad"
  288: "adapta el sistema al margen enorme de niveles de señal"
  291: "La ganancia se suma en decibelios"
  292: "El ruido lo domina la primera etapa"
  293: "la distorsión la domina la última, porque es donde la señal es mayor"
  294: "un preselector de pocas pérdidas, después el LNA"
  298: "el nivel de entrada al que la ganancia cae 1 dB"
  299: "Los productos de intermodulación crecen tres veces más rápido que la señal"
  300: "dos señales fuertes fuera de banda pueden generar un producto de intermodulación dentro de banda"
  303: "Es lo que separa la señal más débil detectable"
  304: "más ganancia baja el suelo y también el techo"
  305: "Por eso existe el AGC, y por eso el filtro va lo antes posible"

modelo: { valores: {}, calculos: {} }

tarjetas:
  - id: explore-bloques
    tipo: explorar
    titulo: "Ocho bloques para cualquier radio"
    texto: "Receptor, transmisor o transceptor: el mismo repertorio. Toque los bloques."
    libro: [280, 281, 282, 283, 284, 285, 286, 287, 288]
    widget:
      tipo: figura
      figura: fig-36.9
      zonas:
        - { id: filtro, rotulo: "Filtro", rect: [41, 32, 69, 39], texto: "Selecciona la banda. En la entrada evita que señales fuertes fuera de banda saturen el LNA." }
        - { id: lna, rotulo: "LNA", rect: [121, 32, 69, 39], texto: "Amplificador de bajo ruido: su figura de ruido fija la del sistema entero." }
        - { id: mezclador, rotulo: "Mezclador", rect: [201, 32, 69, 39], texto: "Multiplica la señal por el oscilador local y la traslada en frecuencia. Es deliberadamente no lineal." }
        - { id: fi, rotulo: "Amplificador de FI", rect: [281, 32, 69, 39], texto: "Concentra la ganancia y la selectividad." }
        - { id: demodulador, rotulo: "Demodulador", rect: [361, 32, 69, 39], texto: "Extrae la información." }
        - { id: pa, rotulo: "PA", rect: [41, 101, 69, 39], texto: "Amplificador de potencia del transmisor: donde se va la energía y donde importa la linealidad." }
        - { id: oscilador, rotulo: "Oscilador local", rect: [201, 101, 69, 39], texto: "Sintetizado con un PLL; su ruido de fase se traslada a la señal." }
        - { id: agc, rotulo: "AGC", rect: [361, 101, 69, 39], texto: "Control automático de ganancia: adapta el sistema al margen enorme de niveles de señal." }
    requiere: { mover: [lna, mezclador, oscilador, fi] }

  - id: empareje-bloques
    tipo: pregunta
    titulo: "Cada bloque, su trabajo"
    texto: "Empareje cada bloque con su función."
    libro: [281, 282, 283, 287]
    widget:
      tipo: figura
      figura: fig-36.9
      zonas:
        - { id: cadena, rotulo: "La cadena de bloques", rect: [0, 0, 450, 150] }
    emparejar:
      - ["Filtro de entrada", "Rechazar lo que está fuera de banda"]
      - ["LNA", "Fijar la figura de ruido del sistema"]
      - ["Mezclador", "Trasladar la señal en frecuencia"]
      - ["PA", "Dar la potencia, con linealidad"]
    exito: "Con estos bloques se lee cualquier esquema de radio del libro."
    pistas:
      - { texto: "El mezclador necesita el oscilador local." }
    escalera:
      - "El LNA es la primera etapa que amplifica."
    solucion: "Filtro, rechazar; LNA, ruido; mezclador, trasladar; PA, potencia."

  - id: toque-frecuencias-nuevas
    tipo: tocar
    titulo: "Crear frecuencias nuevas"
    texto: "Un circuito lineal no crea frecuencias que no estaban. Toque el bloque que sí lo hace, a propósito."
    libro: [283]
    widget:
      tipo: figura
      figura: fig-36.9
      zonas:
        - { id: filtro, rotulo: "Primer bloque de arriba", rect: [41, 32, 69, 39] }
        - { id: lna, rotulo: "Segundo bloque de arriba", rect: [121, 32, 69, 39] }
        - { id: mezclador, rotulo: "Tercer bloque de arriba", rect: [201, 32, 69, 39] }
        - { id: fi, rotulo: "Cuarto bloque de arriba", rect: [281, 32, 69, 39] }
        - { id: agc, rotulo: "Bloque de abajo a la derecha", rect: [361, 101, 69, 39] }
    tocar:
      bien: [mezclador]
      porque:
        filtro: "El filtro selecciona: deja pasar unas frecuencias y rechaza otras, sin crear ninguna."
        lna: "El LNA amplifica; si es bueno, lo hace de forma lineal."
        fi: "El amplificador de FI amplifica y selecciona en una frecuencia fija."
        agc: "El AGC ajusta la ganancia según el nivel; no crea frecuencias."
    exito: "El mezclador: deliberadamente no lineal, multiplica por el oscilador local."
    escalera:
      - "Busque el bloque que recibe dos señales."
    solucion: "El mezclador, el tercero de arriba."

  - id: predecir-ruido
    tipo: predecir
    titulo: "Quién manda en el ruido"
    texto: "En una cadena de varias etapas, ¿cuál decide el ruido del conjunto?"
    libro: [292, 281]
    widget:
      tipo: figura
      figura: fig-36.9
      zonas:
        - { id: reglas, rotulo: "Las tres reglas, abajo", rect: [0, 160, 450, 60] }
    opciones:
      - texto: "La primera"
        bien: true
        porque: "Su ruido se amplifica con todo lo demás; el de las siguientes llega dividido por su ganancia."
      - texto: "La última"
        porque: "La última manda en la distorsión, no en el ruido."
      - texto: "Todas por igual"
        porque: "No pesan igual: la ganancia de la primera aplasta el ruido de las demás."
    escalera:
      - "Piense en dónde es más débil la señal."
    solucion: "La primera: por eso el esfuerzo va en el LNA."

  - id: pregunta-distorsion
    tipo: pregunta
    titulo: "Quién manda en la distorsión"
    texto: "¿Y qué etapa domina la distorsión de la cadena?"
    libro: [293, 294]
    widget:
      tipo: figura
      figura: fig-36.9
      zonas:
        - { id: reglas, rotulo: "Las tres reglas, abajo", rect: [0, 160, 450, 60] }
    opciones:
      - texto: "La última, donde la señal es mayor"
        bien: true
        porque: "La no linealidad aparece con señal grande: por eso la ganancia se reparte."
      - texto: "La primera, como el ruido"
        porque: "El ruido sí; la distorsión crece donde la señal ya es grande, al final."
      - texto: "El filtro de entrada"
        porque: "Un filtro pasivo de pocas pérdidas apenas distorsiona."
    escalera:
      - "¿Dónde llega la señal más amplificada?"
    solucion: "La última: ninguna etapa debe trabajar cerca de su compresión."

  - id: pregunta-ip3
    tipo: pregunta
    titulo: "Los productos de intermodulación"
    texto: "Si la señal de entrada sube 1 dB, ¿cuánto suben los productos de tercer orden?"
    libro: [298, 299]
    widget:
      tipo: figura
      figura: fig-36.9
      zonas:
        - { id: reglas, rotulo: "Las tres reglas, abajo", rect: [0, 160, 450, 60] }
    opciones:
      - texto: "Tres decibelios"
        bien: true
        porque: "Crecen tres veces más rápido: el IP3 es donde se igualarían al extrapolar."
      - texto: "1 dB, como la señal"
        porque: "Eso haría un sistema lineal; los productos de tercer orden van al cubo."
      - texto: "Nada hasta la compresión"
        porque: "Existen siempre; con señal débil quedan bajo el ruido."
    escalera:
      - "Tercer orden: la señal elevada al cubo."
    solucion: "Tres decibelios por cada uno de la señal."

  - id: predecir-ciudad
    tipo: predecir
    titulo: "Un receptor en la ciudad"
    texto: "Un receptor con mucha ganancia inicial oye muy bien las señales débiles. ¿Qué le pasa cerca de un transmisor potente?"
    libro: [300, 303, 304]
    widget:
      tipo: figura
      figura: fig-36.9
      zonas:
        - { id: cadena, rotulo: "La cadena de bloques", rect: [0, 0, 450, 150] }
    opciones:
      - texto: "Se satura, y aparecen productos dentro de banda que parecen señales"
        bien: true
        porque: "Más ganancia baja el suelo y también el techo: el margen dinámico se desplaza."
      - texto: "Nada: el filtro de FI lo elimina"
        porque: "El producto de intermodulación cae dentro de banda: ningún filtro posterior lo distingue."
      - texto: "Oye todavía mejor"
        porque: "Lo fuerte no ayuda: comprime la ganancia y genera espurios."
    escalera:
      - "El margen dinámico va del suelo de ruido a la compresión."
    solucion: "Se satura y genera productos en banda: es lo que ocurre en una ciudad."

  - id: porque-filtro-pronto
    tipo: porque
    titulo: "El filtro, lo antes posible"
    texto: "¿Por qué el filtro de entrada va antes del LNA?"
    libro: [282, 305]
    widget:
      tipo: figura
      figura: fig-36.9
      zonas:
        - { id: filtro, rotulo: "Primer bloque de arriba", rect: [41, 32, 69, 39] }
    opciones:
      - texto: "Para que las señales fuertes fuera de banda no saturen el LNA"
        bien: true
        porque: "Quitarlas antes de amplificar protege todo el margen dinámico."
      - texto: "Porque así mejora la figura de ruido"
        porque: "Al revés: sus pérdidas suman ruido; por eso debe tener pocas."
      - texto: "Por comodidad de trazado"
        porque: "Es una decisión de presupuesto, no de trazado."
    escalera:
      - "¿Qué llega al LNA si no hay filtro delante?"
    solucion: "Para que nada fuerte fuera de banda llegue al LNA."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [283, 291, 292, 293, 304]
    ideas:
      - { titulo: "Ocho bloques.", texto: "Filtro, LNA, mezclador, oscilador local, FI, demodulador, PA y AGC." }
      - { titulo: "El presupuesto.", texto: "Ganancia en dB; ruido, la primera etapa; distorsión, la última." }
      - { titulo: "IP3.", texto: "Los productos de tercer orden crecen tres veces más rápido que la señal." }
      - { titulo: "Margen dinámico.", texto: "Más ganancia baja el suelo y el techo: filtro pronto y AGC." }
