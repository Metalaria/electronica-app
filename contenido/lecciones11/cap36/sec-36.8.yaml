# Lección 1.2 de la sección 37.9 «Antenas» (cap36, sec-36.8). Formato: GUIA.md.
# - λ = c/f con c = 3 × 10⁸ m/s (bloque 321) y la tabla del bloque 322 (433 MHz: 69,3 y 17,3 cm; 868 MHz: 34,6 y
#   8,6 cm; 2,4 GHz: 12,5 y 3,1 cm). Antena impresa en microstrip sobre FR4: un 55 % (bloque 323).
# Paso práctico: «simular» el monopolo de λ/4 a 868 MHz (errores: λ entera, λ/2) y «tocar» el nulo del dipolo en la
# figura 37.13.
leccion: cap36/sec-36.8

libro:
  312: "un transformador entre la impedancia de una línea (50 Ω) y la del espacio libre (377 Ω)"
  313: "una antena mal adaptada devuelva la energía al transmisor"
  315: "Un dipolo de media longitud de onda presenta unos 73 Ω; un monopolo de cuarto de onda sobre plano de masa, unos 36 Ω"
  316: "fuera de ella su impedancia se vuelve reactiva y la adaptación empeora"
  317: "la ganancia de una antena pasiva no amplifica"
  318: "con nulos en la dirección del propio hilo"
  319: "entre 20 y 30 dB de pérdida por desajuste de polarización"
  321: 'λ = (c)/(f)'
  322: "868 MHz"
  323: "un 55 % con εeff ≈ 3,3"
  326: "esa resistencia es muy pequeña (fracciones de ohmio)"
  327: "el rendimiento puede ser de un pequeño porcentaje"
  328: "una antena pequeña tiene reactancia grande y Q alto"
  329: "un módulo con antena integrada y certificada suela ser mejor idea"
  331: "necesita un plano de masa que actúe como la otra mitad del dipolo"
  332: "bajo la antena no debe haber plano de masa"
  335: "la antena se ajusta con el producto montado, no sobre la mesa"
  337: "el cable radia, el diagrama se deforma"
  338: "el de 4:1 adapta los unos 300 Ω de un dipolo plegado a los 75 Ω del cable de televisión"

modelo:
  valores:
    f_a: { sim: "f", nombre: "frecuencia", unidad: Hz, valor: 868000000 }
    k_v: { sim: "k", nombre: "factor de velocidad", unidad: "", valor: 0.55 }
  calculos:
    lam: { expr: "300000000/f_a", sim: "λ", nombre: "longitud de onda", unidad: m }
    l_4: { expr: "lam/4", sim: "λ/4", nombre: "monopolo de cuarto de onda", unidad: m }
    l_2: { expr: "lam/2", sim: "λ/2", nombre: "media onda", unidad: m }
    l_p: { expr: "k_v*lam/4", sim: "λ/4", nombre: "cuarto de onda impreso", unidad: m }

tarjetas:
  - id: explore-longitudes
    tipo: explorar
    titulo: "Las longitudes, con números"
    texto: "Una antena se dimensiona por su longitud de onda. Cambie la frecuencia y mire el monopolo de cuarto de onda."
    libro: [321, 322]
    widget:
      tipo: grafica
      x: { id: nu, min: 100000000, max: 3000000000, unidad: Hz, rotulo: "f", escala: log }
      y: { min: 0, max: 0.8, unidad: m, rotulo: "λ/4" }
      curvas:
        - { expr: "300000000/nu/4", color: naranja, rotulo: "λ/4" }
      marcas:
        - { x: "f_a", y: "l_4", rotulo: "{{l_4}}" }
      lectura: { valor: l_4, rotulo: "Cuarto de onda" }
      datos:
        - { valor: lam, rotulo: "λ = {{lam}}" }
      mandos:
        - { valor: f_a, lista: [433000000, 868000000, 2400000000], rotulo: "Frecuencia" }
    requiere: { mover: [f_a] }

  - id: formula-lambda
    tipo: formula
    titulo: "La longitud de onda"
    texto: "La velocidad de la luz entre la frecuencia."
    libro: [321, 322]
    ec: 321
    sustitucion: "3 × 10⁸ / {{f_a}} = {{lam}}"
    widget:
      tipo: grafica
      x: { id: nu, min: 100000000, max: 3000000000, unidad: Hz, rotulo: "f", escala: log }
      y: { min: 0, max: 3, unidad: m, rotulo: "λ" }
      curvas:
        - { expr: "300000000/nu", color: azul, rotulo: "λ" }
      marcas:
        - { x: "f_a", y: "lam", rotulo: "{{lam}}" }
      lectura: { valor: lam, rotulo: "Longitud de onda" }
      mandos:
        - { valor: f_a, lista: [433000000, 868000000, 2400000000], rotulo: "Frecuencia" }

  - id: simule-monopolo
    tipo: simular
    titulo: "Un monopolo a 868 MHz"
    texto: "Un monopolo de cuarto de onda sobre plano de masa, en el aire, para 868 MHz. ¿Cuánto mide?"
    libro: [315, 321, 322]
    fijar: { f_a: 868000000 }
    simular:
      objetivo: l_4
      unidad: m
      tol: 0.03
      rotulo: "Longitud del monopolo"
      errores:
        - { expr: "lam", texto: "Esa es λ entera: un monopolo de cuarto de onda mide la cuarta parte." }
        - { expr: "l_2", texto: "Esa es la media onda, la de un dipolo; el monopolo es la mitad de un dipolo." }
    exito: "8,6 cm: λ = 34,6 cm entre cuatro."
    escalera:
      - "λ = c/f; el monopolo es λ/4."
    solucion: "c / 868 MHz = 34,6 cm; entre cuatro, 8,6 cm."
    comprobar:
      - { lam: 0.3456, l_4: 0.0864, l_2: 0.1728 }

  - id: estime-impresa
    tipo: pregunta
    titulo: "Una antena impresa"
    texto: "En una pista microstrip sobre FR4 la señal va a un 55 % de la velocidad de la luz. ¿Cuánto mide el cuarto de onda a 2,4 GHz?"
    libro: [322, 323]
    fijar: { f_a: 2400000000, k_v: 0.55 }
    widget:
      tipo: figura
      figura: fig-36.10
      zonas:
        - { id: grafica, rotulo: "Resistencia de radiación", rect: [0, 0, 260, 203] }
    estimar:
      objetivo: "l_p"
      unidad: m
      min: 0
      max: 0.04
      paso: 0.0005
      inicio: 0.035
      tol: 0.05
      rotulo: "Cuarto de onda impreso"
    exito: "Unos 17,2 mm, frente a 3,1 cm en el aire: la antena impresa es sensiblemente menor."
    pistas:
      - { cuando: { valor: estimacion, mayor: 0.018 }, texto: "Demasiado: ese es el del aire, o casi. Aplique el 55 %." }
      - { texto: "Demasiado poco: es el 55 % de 3,1 cm, algo más de la mitad." }
    escalera:
      - "En el aire, 3,1 cm. En la pista, el 55 %."
    solucion: "3,1 cm × 0,55: unos 17,2 mm."
    comprobar:
      - { l_p: 0.0172, l_4: 0.03125 }

  - id: empareje-parametros
    tipo: pregunta
    titulo: "Los parámetros que importan"
    texto: "Empareje cada antena o situación con su cifra."
    libro: [315, 317, 319]
    widget:
      tipo: figura
      figura: fig-36.10
      zonas:
        - { id: diagrama, rotulo: "Diagrama del dipolo", rect: [275, 0, 170, 203] }
    emparejar:
      - ["Dipolo de media onda", "Unos 73 Ω"]
      - ["Monopolo de λ/4 sobre plano de masa", "Unos 36 Ω"]
      - ["Ganancia de un dipolo", "2,15 dBi"]
      - ["Una antena vertical y otra horizontal", "De 20 a 30 dB de pérdida"]
    exito: "73 y 36 Ω quedan cerca de 50: por eso son las antenas de referencia."
    pistas:
      - { texto: "El monopolo es medio dipolo: la mitad de impedancia." }
    escalera:
      - "dBi es ganancia respecto al radiador isótropo."
    solucion: "Dipolo 73 Ω; monopolo 36 Ω; 2,15 dBi; polarización cruzada, 20 a 30 dB."

  - id: explore-figura
    tipo: explorar
    titulo: "Pequeña frente a cuarto de onda"
    texto: "La resistencia de radiación es la parte de la impedancia que se va como onda. Toque los puntos y el diagrama."
    libro: [315, 318, 326]
    widget:
      tipo: figura
      figura: fig-36.10
      zonas:
        - { id: veinte, rotulo: "Punto rojo, abajo", rect: [52, 113, 35, 35], texto: "Antena muy corta: su resistencia de radiación queda por debajo de las pérdidas del cobre, y casi todo se pierde." }
        - { id: cuarto, rotulo: "Punto verde, arriba", rect: [198, 43, 35, 35], texto: "λ/4: unos 36 Ω. Buen rendimiento." }
        - { id: diagrama, rotulo: "Diagrama del dipolo", rect: [275, 0, 170, 203], texto: "Un toroide perpendicular al hilo, con nulos en su dirección." }
    requiere: { mover: [veinte, cuarto, diagrama] }

  - id: toque-nulo
    tipo: tocar
    titulo: "Hacia dónde no radia"
    texto: "Toque en el diagrama una dirección en la que el dipolo no radia nada."
    libro: [318]
    widget:
      tipo: figura
      figura: fig-36.10
      zonas:
        - { id: nulo, rotulo: "A la izquierda del centro", rect: [300, 90, 38, 35] }
        - { id: arriba, rotulo: "Lóbulo de arriba", rect: [345, 40, 40, 45] }
        - { id: abajo, rotulo: "Lóbulo de abajo", rect: [345, 125, 40, 45] }
    tocar:
      bien: [nulo]
      porque:
        arriba: "Ahí radia el máximo: perpendicular al hilo."
        abajo: "También es un máximo: el toroide rodea el hilo por los dos lados."
    exito: "En la dirección del propio hilo hay un nulo: orientar la antena importa."
    escalera:
      - "Busque la dirección del hilo, la barra horizontal."
    solucion: "A los lados, en la dirección del hilo: los nulos."

  - id: pregunta-ganancia
    tipo: pregunta
    titulo: "La ganancia de una antena pasiva"
    texto: "Una antena tiene más ganancia que otra. ¿Qué significa?"
    libro: [317]
    widget:
      tipo: figura
      figura: fig-36.10
      zonas:
        - { id: diagrama, rotulo: "Diagrama del dipolo", rect: [275, 0, 170, 203] }
    opciones:
      - texto: "Que concentra la energía en unas direcciones a costa de otras"
        bien: true
        porque: "Una antena pasiva no añade energía: la reparte de otra forma."
      - texto: "Que amplifica la señal"
        porque: "Pasiva no amplifica: lo que gana en una dirección lo pierde en otras."
      - texto: "Que radia en todas direcciones por igual"
        porque: "Eso es el radiador isótropo, la referencia de los dBi; la ganancia es justo lo contrario."
    escalera:
      - "¿De dónde sacaría energía una antena sin alimentación propia?"
    solucion: "Concentra: más en unas direcciones, menos en otras."

  - id: porque-pequena
    tipo: porque
    titulo: "Por qué una antena pequeña funciona mal"
    texto: "En una antena mucho menor que λ/4, ¿qué se lleva la energía?"
    libro: [326, 327, 328, 329]
    widget:
      tipo: figura
      figura: fig-36.10
      zonas:
        - { id: grafica, rotulo: "Resistencia de radiación", rect: [0, 0, 260, 203] }
    opciones:
      - texto: "El cobre: su resistencia de radiación es de fracciones de ohmio"
        bien: true
        porque: "Las pérdidas óhmicas no bajan; el rendimiento queda en un pequeño porcentaje, y su Q alto la desintoniza."
      - texto: "La reflexión, aunque esté bien adaptada"
        porque: "Bien adaptada no refleja; el problema es que disipa en lugar de radiar."
      - texto: "Nada: radia igual, solo cambia el diagrama"
        porque: "Funciona, pero mal: casi toda la energía se queda como calor."
    escalera:
      - "La potencia radiada es I²·R_{rad}; la perdida, I²·R_{pérdidas}."
    solucion: "El cobre: R_{rad} muy pequeña frente a las pérdidas."

  - id: pregunta-plano
    tipo: pregunta
    titulo: "El plano de masa"
    texto: "Un módulo con monopolo impreso. ¿Qué dice la regla de trazado sobre el plano de masa?"
    libro: [331, 332, 335]
    widget:
      tipo: figura
      figura: fig-36.10
      zonas:
        - { id: grafica, rotulo: "Resistencia de radiación", rect: [0, 0, 260, 203] }
    opciones:
      - texto: "Nada de plano bajo la antena, y continuo y de buen tamaño alrededor"
        bien: true
        porque: "El plano es la otra mitad del dipolo: hay que seguir la nota de aplicación al milímetro."
      - texto: "Plano de masa también bajo la antena, para blindarla"
        porque: "Bajo la antena el plano la cortocircuita; es la regla que más se incumple."
      - texto: "Da igual: la antena funciona sola"
        porque: "Un monopolo no funciona solo: el plano hace de imagen, la otra mitad."
    escalera:
      - "¿Qué papel hace el plano en un monopolo?"
    solucion: "Sin plano debajo y con plano continuo alrededor."

  - id: pregunta-balun
    tipo: predecir
    titulo: "Coaxial directo a un dipolo"
    texto: "Se une un coaxial directamente a un dipolo, sin balun. ¿Qué pasa?"
    libro: [337, 338]
    widget:
      tipo: figura
      figura: fig-36.10
      zonas:
        - { id: diagrama, rotulo: "Diagrama del dipolo", rect: [275, 0, 170, 203] }
    opciones:
      - texto: "Circula corriente por fuera de la malla: el cable radia"
        bien: true
        porque: "Es una corriente de modo común: deforma el diagrama y mete ruido. La corrige un balun de corriente."
      - texto: "Nada, el coaxial ya es equilibrado"
        porque: "El coaxial es desequilibrado: el vivo dentro y la malla, a masa, por fuera."
      - texto: "La impedancia se multiplica por cuatro"
        porque: "Eso lo hace un balun de transformador de 4:1, a propósito."
    escalera:
      - "El dipolo es simétrico; el coaxial, no."
    solucion: "La malla lleva corriente por fuera y el cable pasa a ser antena."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [312, 313, 315, 316, 317, 327, 331, 337]
    ideas:
      - { titulo: "Un adaptador.", texto: "Entre los 50 Ω de la línea y los 377 Ω del espacio." }
      - { titulo: "Las longitudes.", texto: "λ/4 = 8,6 cm a 868 MHz; en una pista, un 55 %." }
      - { titulo: "Pequeña, mal.", texto: "R_{rad} de fracciones de ohmio: el cobre se lleva la energía." }
      - { titulo: "El entorno es antena.", texto: "Plano de masa, caja y cable: balun y ajuste montado." }
