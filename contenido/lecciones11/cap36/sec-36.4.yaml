# Lección 1.2 de la sección 37.5 «La Carta de Smith» (cap36, sec-36.4). Formato: GUIA.md.
# - El plano de Γ: una carga resistiva Z_L sobre 50 Ω da Γ₀ = (Z_L − 50)/(Z_L + 50); un tramo de línea de longitud l
#   la gira en sentido horario alrededor del centro, Γ = Γ₀·e^(−j·4π·l/λ) (bloques 185 y 189: una vuelta es λ/2).
#   La impedancia vista, Z = 50·(1 + Γ)/(1 − Γ): R = 50·(1 − a² − b²)/((1 − a)² + b²), X = 100·b/((1 − a)² + b²).
#   Con 100 Ω y λ/4, 25 Ω. 1.2 (motor12e): el borde y el círculo de VSWR constante son curvas paramétricas con
#   `aspecto: igual` (redondos, sin las semicurvas con max(0, …) que se aplastaban sobre el eje).
# Paso práctico: «tocar» en la carta de la figura 37.8 la región capacitiva.
leccion: cap36/sec-36.4

libro:
  175: "operaciones que serían aritmética compleja se convierten en movimientos gráficos"
  176: "se comprime dentro de un círculo de radio uno"
  178: "El centro es la impedancia de referencia, normalmente 50 Ω"
  179: "El borde es |Γ| = 1"
  180: "el extremo izquierdo es el cortocircuito, el derecho el circuito abierto"
  181: "La mitad superior es inductiva; la inferior, capacitiva"
  185: "En círculo alrededor del centro, en sentido horario"
  186: "diseñar una red de adaptación (sección 37.6) es dibujar un camino desde la impedancia de la carga hasta el centro"
  188: "los círculos concéntricos alrededor del centro son de VSWR constante"
  189: "Una vuelta completa es media longitud de onda, y media vuelta, un cuarto de onda"
  194: "cualquier analizador de redes representa S11 sobre una carta de Smith"
  195: "Da intuición"
  198: "El punto recorre un círculo alrededor del centro"

modelo:
  valores:
    Z_L: { sim: "Z_{L}", nombre: "carga resistiva", unidad: Ω, valor: 100 }
    l_l: { sim: "l/λ", nombre: "longitud de la línea en longitudes de onda", unidad: "", valor: 0 }
  calculos:
    G_0: { expr: "(Z_L - 50)/(Z_L + 50)", sim: "Γ₀", nombre: "coeficiente de reflexión de la carga", unidad: "" }
    g_a: { expr: "G_0*cos(4*pi*l_l)", sim: "Re Γ", nombre: "parte real de Γ", unidad: "" }
    g_b: { expr: "-G_0*sin(4*pi*l_l)", sim: "Im Γ", nombre: "parte imaginaria de Γ", unidad: "" }
    d_n: { expr: "(1 - g_a)^2 + g_b^2", sim: "d", nombre: "denominador", unidad: "" }
    R_v: { expr: "50*(1 - g_a^2 - g_b^2)/d_n", sim: "R", nombre: "resistencia vista", unidad: Ω }
    X_v: { expr: "100*g_b/d_n", sim: "X", nombre: "reactancia vista", unidad: Ω }
    G_ab: { expr: "abs(G_0)", sim: "|Γ|", nombre: "módulo de Γ", unidad: "" }

tarjetas:
  - id: explore-carta
    tipo: explorar
    titulo: "Cómo se lee"
    texto: "La carta es el plano de Γ con las curvas de impedancia constante dibujadas encima. Toque sus puntos y regiones."
    libro: [175, 176, 178, 179, 180, 181]
    widget:
      tipo: figura
      figura: fig-36.5
      zonas:
        - { id: centro, rotulo: "El punto del centro", rect: [93, 100, 35, 35], texto: "La impedancia de referencia, 50 Ω: adaptación perfecta, Γ = 0." }
        - { id: corto, rotulo: "Extremo izquierdo", rect: [3, 100, 35, 35], texto: "El cortocircuito, en el borde: |Γ| = 1." }
        - { id: abierto, rotulo: "Extremo derecho", rect: [185, 100, 35, 35], texto: "El circuito abierto, en el borde: |Γ| = 1." }
        - { id: arriba, rotulo: "Mitad de arriba", rect: [45, 30, 130, 60], texto: "Las impedancias inductivas." }
        - { id: abajo, rotulo: "Mitad de abajo", rect: [45, 145, 130, 60], texto: "Las impedancias capacitivas." }
    requiere: { mover: [centro, corto, abierto, arriba] }

  - id: empareje-movimientos
    tipo: pregunta
    titulo: "Cada componente, un movimiento"
    texto: "Empareje cada componente con su movimiento en la carta."
    libro: [185, 186]
    widget:
      tipo: figura
      figura: fig-36.5
      zonas:
        - { id: leyenda, rotulo: "Leyenda de la derecha", rect: [230, 0, 217, 234] }
    emparejar:
      - ["Bobina en serie", "Arriba, por el círculo de R constante"]
      - ["Condensador en serie", "Abajo, por el círculo de R constante"]
      - ["Bobina en paralelo", "Arriba, por el círculo de G constante"]
      - ["Línea de transmisión", "En círculo alrededor del centro, horario"]
    exito: "Con estas reglas, adaptar es dibujar un camino hasta el centro."
    pistas:
      - { texto: "En serie se suma reactancia a R constante; en paralelo, susceptancia a G constante." }
    escalera:
      - "Las bobinas suben (inductivo arriba); los condensadores bajan."
    solucion: "Serie por R constante, paralelo por G constante; la línea gira alrededor del centro."

  - id: explore-linea
    tipo: explorar
    titulo: "Añadir un tramo de cable"
    texto: "Una carga de 100 Ω en el plano de Γ. Alargue la línea y siga el punto."
    nota: "Ejes Re Γ e Im Γ, a la misma escala."
    libro: [185, 188, 198]
    fijar: { Z_L: 100 }
    widget:
      tipo: grafica
      aspecto: igual
      x: { id: x, min: -1, max: 1, unidad: "", rotulo: "Re Γ" }
      y: { min: -1, max: 1, unidad: "", rotulo: "Im Γ" }
      curvas:
        - { param: { id: th, min: 0, max: "2*pi" }, x: "cos(th)", y: "sin(th)", color: tinta, rotulo: "borde, |Γ| = 1" }
        - { param: { id: th, min: 0, max: "2*pi" }, x: "G_0*cos(th)", y: "G_0*sin(th)", color: naranja, rotulo: "VSWR constante", discontinua: true }
      marcas:
        - { x: "g_a", y: "g_b", rotulo: "carga" }
      lectura: { valor: R_v, rotulo: "Resistencia vista" }
      datos:
        - { valor: X_v, rotulo: "Reactancia: {{X_v}}" }
      mandos:
        - { valor: l_l, lista: [0, 0.0625, 0.125, 0.1875, 0.25], rotulo: "Longitud de la línea, l/λ" }
    requiere: { mover: [l_l] }

  - id: predecir-cuarto
    tipo: predecir
    titulo: "Un cuarto de onda"
    texto: "La carga de 100 Ω se mira a través de un cuarto de onda de línea de 50 Ω: media vuelta. ¿Qué resistencia se ve?"
    libro: [185, 189]
    fijar: { Z_L: 100, l_l: 0.25 }
    widget:
      tipo: grafica
      aspecto: igual
      x: { id: x, min: -1, max: 1, unidad: "", rotulo: "Re Γ" }
      y: { min: -1, max: 1, unidad: "", rotulo: "Im Γ" }
      curvas:
        - { param: { id: th, min: 0, max: "2*pi" }, x: "cos(th)", y: "sin(th)", color: tinta, rotulo: "borde, |Γ| = 1" }
      lectura: { valor: R_v, rotulo: "Resistencia vista" }
      ocultar: true
    opciones:
      - texto: "25 Ω"
        bien: true
        porque: "Media vuelta lleva Γ de +0,333 a −0,333: al otro lado del centro, a la izquierda."
      - texto: "100 Ω"
        porque: "Eso sería una vuelta entera, media longitud de onda: el punto vuelve a su sitio."
      - texto: "50 Ω"
        porque: "La línea gira el punto, no lo acerca al centro: |Γ| se conserva."
    escalera:
      - "Media vuelta: el punto pasa al lado opuesto del centro, a la misma distancia."
    solucion: "Γ = −0,333: el punto queda a la izquierda del centro, en 25 Ω."
    comprobar:
      - { G_0: 0.3333, g_a: -0.3333, R_v: 25, tol: 0.003 }

  - id: pregunta-vuelta
    tipo: pregunta
    titulo: "La escala del borde"
    texto: "Al añadir cable, el punto gira alrededor del centro. ¿Cuánta línea es una vuelta completa?"
    libro: [189, 198]
    widget:
      tipo: figura
      figura: fig-36.5
      zonas:
        - { id: carta, rotulo: "La carta", rect: [0, 0, 225, 234] }
    opciones:
      - texto: "Media longitud de onda"
        bien: true
        porque: "La onda va y vuelve: el desfase de Γ es el doble del recorrido."
      - texto: "Una longitud de onda"
        porque: "Γ compara la onda que vuelve con la que va: el camino cuenta dos veces."
      - texto: "Un cuarto de longitud de onda"
        porque: "Un cuarto de onda es media vuelta: lleva al lado opuesto del centro."
    escalera:
      - "Γ mide ida y vuelta, no solo ida."
    solucion: "Media longitud de onda; media vuelta es un cuarto."

  - id: toque-capacitiva
    tipo: tocar
    titulo: "Una carga capacitiva"
    texto: "Una antena mide 30 Ω con algo de condensador en serie. Toque la región de la carta donde cae."
    libro: [181, 180]
    widget:
      tipo: figura
      figura: fig-36.5
      zonas:
        - { id: arriba, rotulo: "Mitad de arriba", rect: [45, 30, 130, 60] }
        - { id: abajo, rotulo: "Mitad de abajo", rect: [45, 145, 130, 60] }
        - { id: centro, rotulo: "El punto del centro", rect: [93, 100, 35, 35] }
        - { id: abierto, rotulo: "Extremo derecho", rect: [185, 100, 35, 35] }
    tocar:
      bien: [abajo]
      porque:
        arriba: "Arriba están las inductivas: una bobina en serie sube, un condensador baja."
        centro: "El centro es 50 Ω puros: sin reactancia y sin reflexión."
        abierto: "El extremo derecho es el circuito abierto, en el borde."
    exito: "Abajo: la mitad inferior es capacitiva."
    escalera:
      - "Un condensador en serie mueve hacia abajo."
    solucion: "La mitad de abajo, la capacitiva."
    comprobar:
      - { con: { Z_L: 30 }, G_0: -0.25 }

  - id: pregunta-borde
    tipo: pregunta
    titulo: "Un punto en el borde"
    texto: "Un analizador marca un punto justo en el borde de la carta. ¿Qué carga es?"
    libro: [179, 188]
    widget:
      tipo: figura
      figura: fig-36.5
      zonas:
        - { id: carta, rotulo: "La carta", rect: [0, 0, 225, 234] }
    opciones:
      - texto: "Un corto, un abierto o una reactancia pura: refleja todo"
        bien: true
        porque: "El borde es |Γ| = 1: no se absorbe nada."
      - texto: "Una carga adaptada"
        porque: "La adaptada está en el centro, Γ = 0."
      - texto: "Una resistencia de 50 Ω con algo de bobina"
        porque: "Esa queda dentro, en la mitad de arriba: tiene parte resistiva."
    escalera:
      - "Los círculos alrededor del centro son de VSWR constante. ¿Y el último?"
    solucion: "|Γ| = 1: reflexión total."

  - id: porque-vigencia
    tipo: porque
    titulo: "Por qué sigue en uso"
    texto: "Con calculadoras y simuladores, ya no hace falta para calcular. ¿Por qué se sigue usando?"
    libro: [194, 195]
    widget:
      tipo: figura
      figura: fig-36.5
      zonas:
        - { id: carta, rotulo: "La carta", rect: [0, 0, 225, 234] }
    opciones:
      - texto: "Los analizadores muestran S₁₁ sobre ella, y da intuición del camino"
        bien: true
        porque: "Leerla es imprescindible para interpretar la medida, y enseña lo que una lista de números no."
      - texto: "Porque es más exacta que un simulador"
        porque: "No es más exacta: es una representación, no una herramienta de precisión."
      - texto: "Por tradición, sin otra razón"
        porque: "Tiene dos razones prácticas: los instrumentos y la intuición."
    escalera:
      - "¿Cómo enseña un analizador de redes su medida?"
    solucion: "Es la pantalla del analizador y enseña el camino de la adaptación."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [175, 178, 181, 185, 189]
    ideas:
      - { titulo: "El plano de Γ.", texto: "Centro 50 Ω; borde, reflexión total; arriba inductivo, abajo capacitivo." }
      - { titulo: "Movimientos.", texto: "Serie por R constante, paralelo por G constante." }
      - { titulo: "La línea gira.", texto: "Horario alrededor del centro; una vuelta es media longitud de onda." }
      - { titulo: "Adaptar.", texto: "Un camino desde la carga hasta el centro." }
