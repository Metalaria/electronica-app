# Lección 1.2 de la sección 10.3 «Fusibles: la Primera Línea de Defensa» (cap10). Formato: contenido/lecciones11/GUIA.md.
# - Sección sin ecuaciones ni circuito: las curvas tiempo-corriente se leen en la figura 10.5 (fig-10.4) y los fusibles
#   reales en la foto de la figura 10.6 (img/foto_fusible.jpg, 1600 × 318: tres fotos de unos 533 px).
# - Reutiliza el ejercicio 10.2 (el procedimiento ante un fusible fundido) como «ordenar».
leccion: cap10/sec-10.3

libro:
  78: "un hilo metálico calibrado que se funde"
  80: "Tolera picos breves"
  81: "Un fusible fundido es casi siempre un SÍNTOMA, no la causa de la avería"
  83: "Un fusible rápido de 1 A aguanta 1 A indefinidamente, funde en torno a un segundo al doble y en unos 10 ms a diez veces"
  84: "un fusible de 32 V en un circuito de 230 V funde, pero el arco no se apaga"
  85: "entre 1,5 y 2 veces la corriente normal"
  86: "El PTC rearmable"
  87: "primer encendido con lámpara en serie"
  88: "el lento tolera la irrupción y ambos cortan la sobrecarga sostenida"
  89: "de vidrio fundido: a trasluz se ve el hilo cortado"
  "cap10#285": "Medir con el multímetro la resistencia entre los puntos del circuito alimentados por el fusible"

modelo:
  valores: {}
  calculos: {}

tarjetas:
  - id: explore-curvas
    tipo: explorar
    titulo: "Cuánto aguanta y cuánto tarda"
    texto: "Toque los puntos de la curva. Cuanto más supera la corriente al valor nominal, antes funde."
    libro: [83, 88]
    widget:
      tipo: figura
      figura: fig-10.4
      zonas:
        - { id: nominal, rotulo: "Arriba a la izquierda", rect: [50, 25, 40, 45], texto: "Cerca de su corriente nominal, el fusible aguanta indefinidamente." }
        - { id: doble, rotulo: "Los dos puntos azules", rect: [117, 72, 40, 46], texto: "Al doble, sobrecarga sostenida: el rápido funde en torno a un segundo, el lento en segundos." }
        - { id: irrupcion, rotulo: "El rombo naranja", rect: [326, 140, 42, 36], texto: "Diez veces durante 10 ms, la irrupción típica: el rápido funde y el lento aguanta." }
    requiere: { mover: [nominal, doble, irrupcion] }

  - id: toque-fundido
    tipo: tocar
    titulo: "Un fusible fundido"
    texto: "Toque el fusible que se ha fundido."
    libro: [78, 89]
    widget:
      tipo: figura
      imagen: img/foto_fusible.jpg
      zonas:
        - { id: portafusibles, rotulo: "Foto de la izquierda", rect: [0, 0, 530, 318] }
        - { id: ceramico, rotulo: "Foto del centro", rect: [536, 0, 530, 318] }
        - { id: fundido, rotulo: "Foto de la derecha", rect: [1072, 0, 528, 318] }
    tocar:
      bien: [fundido]
      porque:
        portafusibles: "Es un cartucho de vidrio en su portafusibles; nada indica que esté fundido."
        ceramico: "Es cerámico y opaco: no deja ver el hilo. Es el de alta capacidad de ruptura."
    exito: "A trasluz se ve el hilo cortado. Y recuerde: el fusible fundido es casi siempre un síntoma."
    escalera:
      - "En un fusible de vidrio se ve el hilo calibrado."
    solucion: "El de la derecha, de vidrio: el hilo está cortado."

  - id: prediga-4700
    tipo: predecir
    titulo: "Fusible rápido en una fuente"
    texto: "Una fuente con condensadores de 4700 µF lleva un fusible rápido de valor correcto. ¿Qué pasa?"
    libro: [85]
    widget:
      tipo: figura
      figura: fig-10.4
      zonas:
        - { id: irrupcion, rotulo: "El rombo naranja", rect: [326, 140, 42, 36] }
    opciones:
      - texto: "Funde cada pocos encendidos"
        bien: true
        porque: "La corriente de irrupción de los condensadores lo funde: ahí va uno lento."
      - texto: "Nada: el valor es el correcto"
        porque: "El valor sí, el tipo no: el rápido no tolera la irrupción."
      - texto: "No protege la fuente ante un cortocircuito"
        porque: "La protege de sobra; el problema es que funde sin fallo."
    escalera:
      - "¿Qué pide un condensador grande al conectar?"
    solucion: "Funde cada tres encendidos, por la irrupción: hace falta uno lento."

  - id: tipos
    tipo: pregunta
    titulo: "Los tipos por velocidad"
    texto: "Empareje cada marca con su aplicación."
    libro: [80]
    widget:
      tipo: figura
      figura: fig-10.4
      zonas:
        - { id: curvas, rotulo: "Las curvas", rect: [45, 5, 395, 180] }
    emparejar:
      - ["F, rápido", "Electrónica sensible"]
      - ["T, lento", "Motores, fuentes (arranque)"]
      - ["FF, ultrarrápido", "Diodos, tiristores"]
      - ["M, medio", "Uso general"]
    exito: "El tipo se elige por la carga, igual que el valor."
    pistas:
      - { texto: "El lento tolera picos breves: los del arranque." }
    escalera:
      - "Empiece por el que tolera picos breves."
    solucion: "F: electrónica; T: motores y fuentes; FF: semiconductores de potencia; M: uso general."

  - id: valor
    tipo: pregunta
    titulo: "Elegir el valor"
    texto: "Un circuito consume 1 A en régimen normal. ¿Qué valor de fusible?"
    libro: [83, 85]
    widget:
      tipo: figura
      figura: fig-10.4
      zonas:
        - { id: curvas, rotulo: "Las curvas", rect: [45, 5, 395, 180] }
    opciones:
      - texto: "Entre 1,5 y 2 veces la corriente normal"
        bien: true
        porque: "Con margen: cerca de su valor el hilo se degrada, y el calor ambiente rebaja lo que admite."
      - texto: "Exactamente 1 A"
        porque: "Trabajaría cerca de su valor: el hilo se recristaliza y acaba fundiendo sin motivo."
      - texto: "Diez veces más, por si acaso"
        porque: "Ya no protege: una sobrecarga sostenida no lo fundiría."
    escalera:
      - "¿Qué le pasa a un fusible que trabaja siempre cerca de su valor?"
    solucion: "Entre 1,5 y 2 A: margen sin perder la protección."

  - id: por-que-tension
    tipo: porque
    titulo: "Un fusible de 32 V en la red"
    texto: "Funde a su corriente como cualquier otro. ¿Por qué es peligroso un fusible de 32 V en un circuito de 230 V?"
    libro: [84]
    widget:
      tipo: figura
      imagen: img/foto_fusible.jpg
      zonas:
        - { id: fotos, rotulo: "Las tres fotos", rect: [0, 0, 1600, 318] }
    opciones:
      - texto: "Funde, pero el arco no se apaga: sigue conduciendo y puede incendiarse"
        bien: true
        porque: "La tensión nominal es la máxima a la que interrumpe el arco."
      - texto: "Funde antes de tiempo"
        porque: "El instante de fundir lo decide la corriente, no la tensión."
      - texto: "No funde nunca"
        porque: "Funde: el hilo se calienta por I²·R. El problema viene después."
    escalera:
      - "¿Qué queda entre los extremos del hilo justo al fundirse?"
    solucion: "El arco no se extingue: el fusible sigue conduciendo y puede arder."

  - id: ordene-fundido
    tipo: pregunta
    titulo: "Ante un fusible fundido"
    texto: "Ordene el procedimiento antes de reponerlo."
    libro: [81, 87, "cap10#285"]
    widget:
      tipo: figura
      imagen: img/foto_fusible.jpg
      zonas:
        - { id: fundido, rotulo: "Foto de la derecha", rect: [1072, 0, 528, 318] }
    ordenar:
      - "Desconectar el equipo de la red"
      - "Medir la resistencia entre los terminales de alimentación"
      - "Probar rectificador y transistor con la prueba de diodos"
      - "Primer encendido con lámpara en serie"
      - "Fusible nuevo idéntico: tipo, valor, tensión y ruptura"
    exito: "Primero la causa; solo entonces el fusible, y del mismo tipo: cualquier otro cambia lo que protege."
    pistas:
      - { texto: "El fusible nuevo es lo último." }
    escalera:
      - "Antes de medir, el equipo sin red."
    solucion: "Desconectar, medir resistencia, prueba de diodos, encendido con lámpara y, al final, el fusible idéntico."

  - id: otros
    tipo: pregunta
    titulo: "Los otros fusibles"
    texto: "Empareje cada uno con lo que hace."
    libro: [86]
    widget:
      tipo: figura
      imagen: img/foto_fusible.jpg
      zonas:
        - { id: fotos, rotulo: "Las tres fotos", rect: [0, 0, 1600, 318] }
    emparejar:
      - ["PTC rearmable", "Sobrecargas moderadas; USB y baterías"]
      - ["Fusible térmico", "Funde por temperatura: un fallo de ventilación"]
      - ["Fusible electrónico", "Corta en microsegundos y se rearma"]
    exito: "Ninguno sustituye en la red al fusible de verdad, con su capacidad de ruptura."
    pistas:
      - { texto: "Solo uno reacciona a la temperatura y no a la corriente." }
    escalera:
      - "¿Cuál se restablece solo con segundos de retraso?"
    solucion: "PTC: USB y baterías. Térmico: temperatura. Electrónico: microsegundos y rearme."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [81, 83, 84, 85]
    ideas:
      - { titulo: "Curva.", texto: "Cuanto más supera la corriente al valor nominal, antes funde; el lento tolera la irrupción." }
      - { titulo: "Valor y tipo.", texto: "Entre 1,5 y 2 veces la corriente normal; lento o rápido según la carga." }
      - { titulo: "Tensión y ruptura.", texto: "Debe apagar el arco y cortar el cortocircuito posible." }
      - { titulo: "Síntoma.", texto: "Antes de reponerlo, busque la causa." }
