# Lección 1.2 de la sección 10.8 «Limitación de Corriente de Arranque (Inrush)» (cap10). Formato: GUIA.md.
# - La irrupción del bloque 168 (la red conectada en su pico, 325 V, sobre 470 µF a través de 1 Ω) en el esquema
#   «carga-rc»: el pico V/R y la energía en la resistencia, ½·C·V² = 24,8 J, que no depende de R (bloques 189–193).
#   La conexión en el pico se modela como un escalón de 325 V: es el peor caso del libro (bloque 176).
# - Sin paso práctico propio: el ajuste del retardo del relé y la simulación de la NTC van en la lección de los
#   problemas (sec-10.11, problemas 10.A y 10.C).
leccion: cap10/sec-10.8

libro:
  167: "un condensador descargado es un cortocircuito"
  168: "Conectando la red de 230 V en su pico, 325 V, con 1 Ω de resistencia total"
  171: "Fundir un fusible sano, si es rápido."
  176: "La corriente de irrupción es máxima conectando en el pico de la onda de red"
  183: "No protege en un rearranque rápido"
  185: "debe cerrar después de que los condensadores estén cargados y no antes"
  186: "permite fijar la corriente máxima con precisión"
  189: 'I_("pico") = (V_("pico"))/(R)'
  190: '"energía en la resistencia" = "½" dot.op C dot.op V_("pico")^("2")'
  191: "es independiente de R"
  192: '"24,8 J"'
  193: "hace falta una de pulso, capaz de absorber decenas de julios sin abrirse"
  196: "Con irrupción, fusible lento (T)"
  197: "la I²t de la irrupción debe quedar por debajo de la I²t de fusión del fusible, con margen"
  201: "Si ahí la corriente se dispara, hace falta relé de puenteo o arranque activo"
  202: "Corriente de irrupción al cargar 470 µF a 325 V"

modelo:
  valores:
    V_p: { sim: "V_{pico}", nombre: "pico de la red", unidad: V, valor: 325 }
    R_a: { sim: "R", nombre: "resistencia del camino", unidad: Ω, valor: 1 }
    C_f: { sim: "C", nombre: "condensador de filtro", unidad: F, valor: 470e-6 }
  calculos:
    tau: { expr: "R_a*C_f", sim: "τ", nombre: "constante de tiempo", unidad: s }
    I_pico: { expr: "V_p/R_a", sim: "I_{pico}", nombre: "pico de la irrupción", unidad: A }
    E_R: { expr: "C_f*V_p^2/2", sim: "E", nombre: "energía en la resistencia", unidad: J, cifras: 3 }

tarjetas:
  - id: explore-irrupcion
    tipo: explorar
    titulo: "Un cortocircuito de milisegundos"
    texto: "Se conecta la red en su pico sobre el condensador descargado. Suba la resistencia del camino y mire el pico de corriente."
    libro: [167, 168, 202]
    widget:
      tipo: circuito
      esquema: carga-rc
      piezas: { fuente: V_p, r: R_a, c: C_f }
      lectura: { valor: I_pico, rotulo: "Pico de corriente" }
      datos:
        - { valor: tau, rotulo: "τ = {{tau}}" }
      grafica:
        x: { id: t, min: 0, max: 0.02, unidad: s, rotulo: "t" }
        y: { min: 0, max: 350, unidad: A, rotulo: "i" }
        curvas:
          - { expr: "V_p/R_a*exp(-t/tau)", color: naranja, rotulo: "i", mide: i }
      mandos:
        - { valor: R_a, lista: [1, 10, 47], rotulo: "Resistencia del camino" }
    requiere: { mover: [R_a] }

  - id: formula-pico
    tipo: formula
    titulo: "El pico"
    texto: "En el primer instante el condensador es un cortocircuito: solo frena la resistencia."
    libro: [168, 189]
    fijar: { R_a: 1 }
    ec: 189
    sustitucion: "{{V_p}} / {{R_a}} = {{I_pico}}"
    widget:
      tipo: circuito
      esquema: carga-rc
      piezas: { fuente: V_p, r: R_a, c: C_f }
      lectura: { valor: I_pico, rotulo: "Pico de corriente" }
      grafica:
        x: { id: t, min: 0, max: 0.003, unidad: s, rotulo: "t" }
        y: { min: 0, max: 350, unidad: A, rotulo: "i" }
        curvas:
          - { expr: "V_p/R_a*exp(-t/tau)", color: naranja, rotulo: "i", mide: i }
    comprobar:
      - { I_pico: 325 }

  - id: prediga-energia
    tipo: predecir
    titulo: "Diez veces más resistencia"
    texto: "Con 10 Ω en lugar de 1 Ω, el pico baja diez veces. ¿Y la energía que se disipa en la resistencia?"
    libro: [168, 190, 191]
    fijar: { R_a: 10 }
    widget:
      tipo: circuito
      esquema: carga-rc
      piezas: { fuente: V_p, r: R_a, c: C_f }
      lectura: { valor: E_R, rotulo: "Energía en la resistencia" }
      ocultar: true
      grafica:
        x: { id: t, min: 0, max: 0.02, unidad: s, rotulo: "t" }
        y: { min: 0, max: 350, unidad: A, rotulo: "i" }
        curvas:
          - { expr: "V_p/R_a*exp(-t/tau)", color: naranja, rotulo: "i", mide: i }
    opciones:
      - texto: "La misma"
        bien: true
        porque: "Es independiente de R: ½·C·V². El limitador reparte la energía en más tiempo."
      - texto: "Diez veces menos"
        porque: "La corriente baja diez veces, pero dura diez veces más: la energía no cambia."
      - texto: "Diez veces más"
        porque: "Más R no acumula más energía: la que se disipa es la que acaba en el condensador."
    escalera:
      - "Fíjese en la fórmula de la energía: ¿aparece R?"
    solucion: "La misma: ½·C·V², independiente de R."

  - id: estime-energia
    tipo: pregunta
    titulo: "Cuántos julios"
    texto: "Con 470 µF y 325 V de pico, ¿qué energía se disipa en la resistencia de arranque en cada conexión?"
    libro: [190, 192, 193]
    widget:
      tipo: circuito
      esquema: carga-rc
      piezas: { fuente: V_p, r: R_a, c: C_f }
      lectura: { valor: tau, rotulo: "Constante de tiempo" }
      grafica:
        x: { id: t, min: 0, max: 0.02, unidad: s, rotulo: "t" }
        y: { min: 0, max: 350, unidad: V, rotulo: "v_{C}" }
        curvas:
          - { expr: "V_p*(1 - exp(-t/tau))", color: verde, rotulo: "v_{C}", mide: vc }
    estimar:
      objetivo: "E_R"
      unidad: J
      min: 0
      max: 60
      paso: 0.5
      inicio: 50
      tol: 0.04
      rotulo: "Energía"
    exito: "24,8 J: hace falta una resistencia de pulso, no una de película del mismo valor."
    pistas:
      - { cuando: { valor: estimacion, mayor: 25.8 }, texto: "Se ha pasado: es la mitad de C·V²." }
      - { texto: "Se ha quedado corto: la tensión va al cuadrado." }
    escalera:
      - "E = ½ · C · V²."
    solucion: "½ × 470 µF × 325² = 24,8 J."
    comprobar:
      - { E_R: 24.8 }

  - id: soluciones
    tipo: pregunta
    titulo: "Tres soluciones"
    texto: "Empareje cada limitador con lo que hay que vigilar."
    libro: [183, 185, 186]
    widget:
      tipo: figura
      figura: fig-10.13
      zonas:
        - { id: grafica, rotulo: "La gráfica", rect: [0, 0, 446, 202] }
    emparejar:
      - ["NTC", "No protege en un rearranque rápido"]
      - ["Resistencia con relé", "Que cierre después de cargarse los condensadores"]
      - ["Arranque suave activo", "Un MOSFET que fija la corriente máxima"]
    exito: "La NTC es la más barata; el relé y el MOSFET funcionan igual en frío que en caliente."
    pistas:
      - { texto: "La NTC caliente tiene poca resistencia." }
    escalera:
      - "¿Cuál depende de su temperatura?"
    solucion: "NTC: el rearranque. Relé: cerrar tras la carga. Activo: fija la corriente."

  - id: por-que-ntc
    tipo: porque
    titulo: "Apagar y encender"
    texto: "Un equipo con NTC se apaga y se enciende en un segundo, y el fusible funde. ¿Por qué?"
    libro: [183, 201]
    widget:
      tipo: figura
      figura: fig-10.13
      zonas:
        - { id: grafica, rotulo: "La gráfica", rect: [0, 0, 446, 202] }
    opciones:
      - texto: "La NTC sigue caliente, su resistencia es baja y la corriente pasa entera"
        bien: true
        porque: "Es su limitación más seria: limita en frío, no en caliente."
      - texto: "Los condensadores siguen cargados y piden más corriente"
        porque: "Algo cargados, ayudan; el problema es que la NTC ya no limita."
      - texto: "La NTC se ha abierto"
        porque: "Abierta no dejaría pasar nada: el equipo no encendería."
    escalera:
      - "¿Qué resistencia tiene una NTC caliente?"
    solucion: "La NTC caliente casi no limita: la irrupción llega entera."

  - id: peor-caso
    tipo: pregunta
    titulo: "El peor caso"
    texto: "¿Cuándo es máxima la corriente de irrupción?"
    libro: [176]
    widget:
      tipo: figura
      figura: fig-10.12
      zonas:
        - { id: grafica, rotulo: "La gráfica", rect: [0, 0, 443, 210] }
    opciones:
      - texto: "Conectando en el pico de la onda de red"
        bien: true
        porque: "Y casi nula en el paso por cero. Como el instante es aleatorio, se diseña para el pico."
      - texto: "Conectando en el paso por cero"
        porque: "Ahí es prácticamente nula: el condensador sube con la onda."
      - texto: "Siempre igual"
        porque: "Depende del instante: por eso las pruebas se repiten muchas veces."
    escalera:
      - "¿Con qué tensión se encuentra el condensador descargado en cada instante?"
    solucion: "En el pico de la onda; casi nula en el paso por cero."

  - id: fusible
    tipo: pregunta
    titulo: "El fusible de una fuente con irrupción"
    texto: "¿Qué fusible y qué comprobación?"
    libro: [171, 196, 197]
    widget:
      tipo: figura
      figura: fig-10.12
      zonas:
        - { id: grafica, rotulo: "La gráfica", rect: [0, 0, 443, 210] }
    opciones:
      - texto: "Lento (T), con la I²t de la irrupción por debajo de la de fusión, con margen"
        bien: true
        porque: "Tolera la irrupción y actúa ante un fallo real."
      - texto: "Rápido del mismo valor"
        porque: "Se funde al primer encendido."
      - texto: "Lento de mucho más valor, por si acaso"
        porque: "Ya no protegería ante un fallo real."
    escalera:
      - "¿Qué tipo de fusible tolera sobrecorrientes breves?"
    solucion: "Lento, y la I²t de la irrupción por debajo de la de fusión."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [167, 189, 191, 196]
    ideas:
      - { titulo: "Irrupción.", texto: "Un condensador descargado es un cortocircuito: solo frena la resistencia del camino." }
      - { titulo: "Energía.", texto: "½·C·V² en la resistencia, sea cual sea R: el limitador reparte, no reduce." }
      - { titulo: "Soluciones.", texto: "NTC (no en rearranque), resistencia con relé o arranque activo." }
      - { titulo: "Fusible.", texto: "Lento, con la I²t de la irrupción por debajo de la suya." }
