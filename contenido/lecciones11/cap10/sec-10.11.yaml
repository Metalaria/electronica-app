# Lección 1.2 de la sección 10.11 «Problemas de Diseño» (cap10): los problemas 10.A, 10.B y 10.C.
# Formato: contenido/lecciones11/GUIA.md.
# - 10.A (12 V, 470 µF, 0,1 Ω de cables y ESR: 120 A y τ = 47 µs; NTC de 5 y 10 Ω: 2,40 y 1,20 A, 33,8 mJ las dos)
#   en el esquema «carga-rc»; la energía de la NTC, ½·C·V², con un «simular» sin circuito (el esquema no mide energía).
# - 10.B (7 W, R_jc = 3, radiador de 5 °C/W, 40 °C; R_cs 0,5 con pasta, 1,5 sin ella, unos 4 con mica sin pasta:
#   99,5, 106,5 y 124 °C) en una gráfica del modelo.
# - 10.C (24 V, 4700 µF, 10 Ω: τ = 47 ms, 5τ = 235 ms, 2,4 A, 1,35 J; relé a los 300 ms) en «carga-rc».
# Pasos prácticos: «simular» la energía de la NTC de 10 Ω (el error típico, que se reparte con R) y «ajuste» del
# retardo del relé hasta que el condensador pase de 5τ (99,3 % de la carga) antes de cerrar.
leccion: cap10/sec-10.11

libro:
  249: "Un equipo de 12 V con 470 µF de condensador de entrada"
  253: "1 J en 10 ms son 100 W medios"
  255: "con 0,1 Ω de cables y ESR, 120 A de pico que decaen con τ = RC ≈ 47 µs"
  256: "33,8 mJ"
  257: "el limitador no reduce la energía, la reparte en más tiempo"
  260: "fusible, diodo de polaridad, TVS dimensionado por energía y NTC de 10 Ω, en ese orden"
  263: "Un componente TO-220 disipa 7 W sobre un radiador de 5 °C/W, con 40 °C de ambiente. Rjc = 3 °C/W"
  266: "106,5 °C"
  267: "esos 7 °C acortan la vida en torno a un 33 %"
  268: "Rcs llega a unos 4 °C/W y Tj subiría a 124 °C, por encima de los 110 °C"
  270: "la diferencia entre ambas es P·Rcs"
  274: "Una fuente con 4700 µF de filtro a 24 V debe arrancar"
  277: '"1,35 J"'
  278: "103 ms"
  279: "más resistencia baja el pico pero alarga el arranque"
  280: "Con 10 Ω, un retardo de 300 ms es suficiente"
  281: "si el relé cierra demasiado pronto, el condensador aún no está cargado y el pico aparece de todos modos"

modelo:
  valores:
    V_a: { sim: "V", nombre: "alimentación del equipo", unidad: V, valor: 12 }
    C_a: { sim: "C", nombre: "condensador de entrada", unidad: F, valor: 470e-6 }
    R_a: { sim: "R", nombre: "resistencia del camino", unidad: Ω, valor: 0.1 }
    E_t: { sim: "E", nombre: "energía del transitorio", unidad: J, valor: 1 }
    t_t: { sim: "t", nombre: "duración del transitorio", unidad: s, valor: 0.01 }
    P_b: { sim: "P", nombre: "potencia disipada", unidad: W, valor: 7 }
    Ta_b: { sim: "T_{amb}", nombre: "ambiente", unidad: "°C", valor: 40 }
    Rjc_b: { sim: "R_{jc}", nombre: "unión-cápsula", unidad: "°C/W", valor: 3 }
    Rcs_b: { sim: "R_{cs}", nombre: "cápsula-radiador", unidad: "°C/W", valor: 0.5 }
    Rsa_b: { sim: "R_{sa}", nombre: "radiador", unidad: "°C/W", valor: 5 }
    V_c: { sim: "V", nombre: "tensión de la fuente", unidad: V, valor: 24 }
    C_c: { sim: "C", nombre: "filtro", unidad: F, valor: 0.0047 }
    R_c: { sim: "R", nombre: "resistencia de arranque", unidad: Ω, valor: 10 }
    t_rel: { sim: "t_{relé}", nombre: "retardo del relé", unidad: s, valor: 0.1 }
  calculos:
    tau_a: { expr: "R_a*C_a", sim: "τ", nombre: "constante de tiempo", unidad: s }
    I_a: { expr: "V_a/R_a", sim: "I_{pico}", nombre: "pico de irrupción", unidad: A }
    E_a: { expr: "C_a*V_a^2/2", sim: "E", nombre: "energía en la resistencia", unidad: J }
    E_mal: { expr: "C_a*V_a^2/2*5/R_a", sim: "E", nombre: "la energía de 5 Ω repartida con R (error)", unidad: J }
    P_t: { expr: "E_t/t_t", sim: "P", nombre: "potencia media del transitorio", unidad: W }
    Rt_b: { expr: "Rjc_b + Rcs_b + Rsa_b", sim: "R_{total}", nombre: "resistencia térmica total", unidad: "°C/W" }
    dT_b: { expr: "P_b*Rt_b", sim: "ΔT", nombre: "calentamiento sobre el ambiente", unidad: "°C" }
    Tj_b: { expr: "Ta_b + P_b*(Rjc_b + Rcs_b + Rsa_b)", sim: "T_{j}", nombre: "temperatura de la unión", unidad: "°C" }
    tau_c: { expr: "R_c*C_c", sim: "τ", nombre: "constante de tiempo", unidad: s }
    I_c: { expr: "V_c/R_c", sim: "I_{pico}", nombre: "pico de arranque", unidad: A }
    E_c: { expr: "C_c*V_c^2/2", sim: "E", nombre: "energía", unidad: J, cifras: 3 }
    carga: { expr: "100*(1 - exp(-t_rel/tau_c))", sim: "carga", nombre: "carga del condensador al cerrar el relé", unidad: "%", cifras: 3 }
    v_rel: { expr: "V_c*(1 - exp(-t_rel/tau_c))", sim: "v_{C}", nombre: "tensión del condensador al cerrar el relé", unidad: V }

tarjetas:
  - id: explore-10a
    tipo: explorar
    titulo: "Problema 10.A: la irrupción"
    texto: "12 V sobre 470 µF: pruebe sin limitar (0,1 Ω de cables y ESR) y con una NTC, y mire el pico y el tiempo de carga."
    libro: [249, 255, 256]
    widget:
      tipo: circuito
      esquema: carga-rc
      piezas: { fuente: V_a, r: R_a, c: C_a }
      lectura: { valor: I_a, rotulo: "Pico de corriente" }
      datos:
        - { valor: tau_a, rotulo: "τ = {{tau_a}}" }
      grafica:
        x: { id: t, min: 0, max: 0.025, unidad: s, rotulo: "t" }
        y: { min: 0, max: 13, unidad: V, rotulo: "v_{C}" }
        curvas:
          - { expr: "V_a*(1 - exp(-t/tau_a))", color: verde, rotulo: "v_{C}", mide: vc }
      mandos:
        - { valor: R_a, lista: [0.1, 5, 10], nombres: ["sin limitar", "NTC de 5 Ω", "NTC de 10 Ω"], rotulo: "Limitador" }
    requiere: { mover: [R_a] }
    comprobar:
      - { I_a: 120, tau_a: 0.000047 }
      - { con: { R_a: 5 }, I_a: 2.4 }
      - { con: { R_a: 10 }, I_a: 1.2 }

  - id: simule-ntc
    tipo: simular
    titulo: "La energía en la NTC"
    texto: "Con la NTC de 5 Ω se disipan 33,8 mJ en cada arranque. ¿Cuánta energía se disipa con la de 10 Ω?"
    libro: [256, 257]
    fijar: { R_a: 10 }
    widget:
      tipo: grafica
      x: { id: t, min: 0, max: 0.025, unidad: s, rotulo: "t" }
      y: { min: 0, max: 2.5, unidad: A, rotulo: "i" }
      curvas:
        - { expr: "V_a/R_a*exp(-t/tau_a)", color: naranja, rotulo: "i" }
      lectura: { valor: E_a, rotulo: "Energía en la NTC" }
      ocultar: true
    simular:
      objetivo: E_a
      unidad: J
      tol: 0.03
      rotulo: "Energía en la NTC de 10 Ω"
      errores:
        - { expr: "E_mal", texto: "Ha supuesto que doble resistencia es mitad de energía. La corriente baja a la mitad, pero dura el doble." }
    exito: "Los mismos 33,8 mJ: es ½·C·V², la energía del condensador. El limitador no la reduce: la reparte en más tiempo."
    escalera:
      - "¿Aparece R en ½·C·V²?"
    solucion: "½ × 470 µF × 12² = 33,8 mJ, con 5 Ω o con 10 Ω."
    comprobar:
      - { E_a: 0.0338, E_mal: 0.0169, tol: 0.01 }

  - id: estime-tvs
    tipo: pregunta
    titulo: "El TVS se dimensiona por energía"
    texto: "Un transitorio de 1 J dura 10 ms. ¿Qué potencia media tiene que absorber el TVS?"
    libro: [253]
    widget:
      tipo: grafica
      x: { id: t, min: 0, max: 0.02, unidad: s, rotulo: "t" }
      y: { min: 0, max: 150, unidad: W, rotulo: "P" }
      curvas:
        - { expr: "P_t*ceil((t_t - t)/1e9)", color: naranja, rotulo: "potencia media" }
      ocultar: false
    estimar:
      objetivo: "P_t"
      unidad: W
      min: 0
      max: 150
      paso: 5
      inicio: 10
      tol: 0.03
      rotulo: "Potencia media"
    exito: "100 W medios: ahí es donde muchos TVS pequeños se quedan cortos."
    pistas:
      - { cuando: { valor: estimacion, mayor: 103 }, texto: "Se ha pasado: es la energía entre la duración." }
      - { texto: "Se ha quedado corto: 10 ms es una centésima de segundo." }
    escalera:
      - "P = E / t."
    solucion: "1 J / 10 ms = 100 W."
    comprobar:
      - { P_t: 100 }

  - id: ordene-10a
    tipo: pregunta
    titulo: "La cadena de la entrada"
    texto: "Ordene los elementos de protección de la entrada de 12 V, desde el conector."
    libro: [260]
    widget:
      tipo: circuito
      esquema: carga-rc
      piezas: { fuente: V_a, r: R_a, c: C_a }
      grafica:
        x: { id: t, min: 0, max: 0.025, unidad: s, rotulo: "t" }
        y: { min: 0, max: 13, unidad: V, rotulo: "v_{C}" }
        curvas:
          - { expr: "V_a*(1 - exp(-t/tau_a))", color: verde, rotulo: "v_{C}", mide: vc }
    ordenar:
      - "Fusible"
      - "Diodo de polaridad"
      - "TVS dimensionado por energía"
      - "NTC de 10 Ω"
    exito: "El fusible primero, para que cualquier fallo posterior quede acotado."
    pistas:
      - { texto: "Lo primero acota cualquier fallo que venga detrás." }
    escalera:
      - "El limitador va justo antes del condensador."
    solucion: "Fusible, diodo de polaridad, TVS y NTC."

  - id: estime-10b
    tipo: pregunta
    titulo: "Problema 10.B: sin pasta"
    texto: "7 W, R_{jc} = 3 y radiador de 5 °C/W a 40 °C de ambiente; sin pasta, R_{cs} es 1,5 °C/W. ¿Temperatura de la unión?"
    libro: [263, 266]
    fijar: { Rcs_b: 1.5 }
    widget:
      tipo: grafica
      x: { id: r, min: 0, max: 5, unidad: "°C/W", rotulo: "R_{cs}" }
      y: { min: 80, max: 140, unidad: "°C", rotulo: "T_{j}" }
      curvas:
        - { expr: "110", color: tinta, rotulo: "límite de diseño", discontinua: true }
    estimar:
      objetivo: "Tj_b"
      unidad: "°C"
      min: 80
      max: 140
      paso: 0.5
      inicio: 130
      tol: 0.01
      rotulo: "Unión"
    exito: "106,5 °C, siete grados más que con pasta (99,5 °C), por una capa que cuesta céntimos."
    pistas:
      - { cuando: { valor: estimacion, mayor: 107.6 }, texto: "Se ha pasado: la total es 3 + 1,5 + 5 = 9,5 °C/W." }
      - { texto: "Se ha quedado corto: 7 W por 9,5 °C/W, más los 40 °C del ambiente." }
    escalera:
      - "Sume las tres resistencias y multiplique por 7 W."
    solucion: "40 + 7 × (3 + 1,5 + 5) = 106,5 °C."
    comprobar:
      - { Tj_b: 106.5, Rt_b: 9.5 }
      - { con: { Rcs_b: 0.5 }, Tj_b: 99.5 }

  - id: prediga-mica
    tipo: predecir
    titulo: "Y con mica sin pasta"
    texto: "Una arandela de mica sin pasta lleva R_{cs} a unos 4 °C/W. ¿Cumple el límite de diseño de 110 °C?"
    libro: [268]
    fijar: { Rcs_b: 4 }
    widget:
      tipo: grafica
      x: { id: r, min: 0, max: 1, unidad: "°C/W", rotulo: "R_{cs}" }
      y: { min: 80, max: 140, unidad: "°C", rotulo: "T_{j}" }
      curvas:
        - { expr: "Ta_b + P_b*(Rjc_b + r + Rsa_b)", color: naranja, rotulo: "T_{j}" }
        - { expr: "110", color: tinta, rotulo: "límite de diseño", discontinua: true }
      lectura: { valor: Tj_b, rotulo: "Unión" }
      ocultar: true
    opciones:
      - texto: "No: la unión sube a unos 124 °C"
        bien: true
        porque: "7 W por 12 °C/W son 84 °C sobre los 40 del ambiente."
      - texto: "Sí, por poco"
        porque: "Con 4 °C/W la cápsula suma casi tanto como el radiador: muy por encima de 110 °C."
      - texto: "Da igual, mientras no se destruya"
        porque: "110 °C es el límite de diseño, no el de destrucción: se diseña con margen."
    escalera:
      - "Calcule con R_{cs} = 4: la total es 12 °C/W."
    solucion: "40 + 7 × 12 = 124 °C: por encima de 110 °C."
    comprobar:
      - { Tj_b: 124, dT_b: 84 }
      - { con: { Rcs_b: 0.5 }, Tj_b: 99.5 }

  - id: por-que-siete
    tipo: porque
    titulo: "Siete grados"
    texto: "Sin pasta la unión solo sube siete grados. ¿Por qué importa?"
    libro: [267, 270]
    widget:
      tipo: grafica
      x: { id: r, min: 0, max: 5, unidad: "°C/W", rotulo: "R_{cs}" }
      y: { min: 80, max: 140, unidad: "°C", rotulo: "T_{j}" }
      curvas:
        - { expr: "Ta_b + P_b*(Rjc_b + r + Rsa_b)", color: naranja, rotulo: "T_{j}" }
    opciones:
      - texto: "Con Arrhenius, esos 7 °C acortan la vida en torno a un 33 %"
        bien: true
        porque: "La vida depende exponencialmente de la temperatura: pocos grados cuestan mucho."
      - texto: "Porque a 106,5 °C el TO-220 se destruye"
        porque: "No se destruye: dura menos."
      - texto: "No importa: siete grados están dentro del margen"
        porque: "Están dentro del límite, pero la vida se acorta en torno a un 33 %."
    escalera:
      - "¿Cómo depende la vida de un semiconductor de su temperatura?"
    solucion: "Acortan la vida en torno a un 33 %."

  - id: ajuste-rele
    tipo: ajuste
    titulo: "Problema 10.C: el retardo del relé"
    texto: "24 V, 4700 µF y 10 Ω de arranque. Ajuste el retardo del relé para que cierre con el condensador ya cargado: más de 5τ."
    libro: [274, 277, 280, 281]
    fijar: { V_c: 24, C_c: 0.0047, R_c: 10 }
    inicio: { t_rel: 0.1 }
    widget:
      tipo: circuito
      esquema: carga-rc
      piezas: { fuente: V_c, r: R_c, c: C_c }
      lectura: { valor: carga, rotulo: "Carga al cerrar el relé" }
      datos:
        - { valor: tau_c, rotulo: "τ = {{tau_c}}" }
      grafica:
        x: { id: t, min: 0, max: 0.6, unidad: s, rotulo: "t" }
        y: { min: 0, max: 25, unidad: V, rotulo: "v_{C}" }
        curvas:
          - { expr: "V_c*(1 - exp(-t/tau_c))", color: verde, rotulo: "v_{C}", mide: vc }
        marcas:
          - { x: "t_rel", y: "v_rel", rotulo: "relé" }
      mandos:
        - { valor: t_rel, min: 0.05, max: 0.6, paso: 0.025, rotulo: "Retardo del relé" }
    ajuste:
      valor: carga
      min: 99.3
      max: 100
      rotulo: "Carga al cerrar"
      escala: { min: 60, max: 100 }
      bajo: "Cierra demasiado pronto: el pico aparecería igual, y en el contacto del relé. Alargue el retardo."
      alto: "Más que suficiente."
      dentro: "Más de 5τ: el condensador está cargado cuando cierra el relé."
    comprobar:
      - { tau_c: 0.047, I_c: 2.4, E_c: 1.35 }
      - { con: { t_rel: 0.3 }, carga: 99.83, tol: 0.001 }

  - id: compromiso
    tipo: pregunta
    titulo: "¿Y con 22 Ω?"
    texto: "Con 22 Ω, τ sube a 103 ms y el pico baja a 1,1 A. ¿Cuál es el precio?"
    libro: [278, 279]
    widget:
      tipo: circuito
      esquema: carga-rc
      piezas: { fuente: V_c, r: R_c, c: C_c }
      grafica:
        x: { id: t, min: 0, max: 0.6, unidad: s, rotulo: "t" }
        y: { min: 0, max: 25, unidad: V, rotulo: "v_{C}" }
        curvas:
          - { expr: "V_c*(1 - exp(-t/tau_c))", color: verde, rotulo: "v_{C}", mide: vc }
    opciones:
      - texto: "Un arranque más largo, en el que la fuente no puede entregar corriente"
        bien: true
        porque: "Medio segundo es aceptable en un equipo de banco y molesto en uno que se enciende a menudo."
      - texto: "Más energía disipada en la resistencia"
        porque: "La energía es la misma, ½·C·V²: solo se reparte en más tiempo."
      - texto: "Un pico mayor al cerrar el relé"
        porque: "Si el relé cierra tras 5τ no hay pico: el condensador ya está cargado."
    escalera:
      - "Más τ: ¿qué le pasa al tiempo de carga?"
    solucion: "Más tiempo de arranque."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [257, 260, 267, 280]
    ideas:
      - { titulo: "10.A.", texto: "Fusible, polaridad, TVS por energía y NTC: la NTC reparte la energía, no la reduce." }
      - { titulo: "10.B.", texto: "Sin pasta, siete grados más y en torno a un 33 % menos de vida." }
      - { titulo: "10.C.", texto: "Resistencia de arranque y relé a más de 5τ: 300 ms con 10 Ω." }
