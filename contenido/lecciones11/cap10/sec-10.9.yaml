# Lección 1.2 de la sección 10.9 «Crowbar y Fusibles Electrónicos» (cap10). Formato: contenido/lecciones11/GUIA.md.
# - Sección sin números ni ecuaciones: la figura 10.16 (fig-10.15) con zonas en sus cinco capas; preguntas sobre el
#   crowbar (el enclavamiento del SCR de la sección 10.1 como virtud), el eFuse y su combinación.
# - 1.2 (esquemas12d): el esquema `crowbar` vivo en la nueva explore-crowbar, por-que-scr y dos-condiciones (el raíl
#   de 3,3 V que recibe 12 V del bloque 208). Se comparan las corrientes del fusible y del SCR, no la tensión del raíl.
#   Valores de ejemplo, no del libro: V_Z 3,9 V, R_s = R_f = 50 mΩ, carga 10 Ω, R_G 100 Ω, V_T 1 V, I²t de 1 a 10 A²·s.
# 1.2.1 (autor121-pot, «aprender haciendo», GUIA §13): se toca en la figura 10.16 la capa que protege también al
# semiconductor, se toca en el esquema la pieza que cortocircuita el raíl, se lee la corriente del cortocircuito, se
# calcula cuánto tarda en fundir el fusible y se elige el que menos castiga al SCR (objetivo). Quedan dos preguntas (la
# virtud del SCR y la ventaja del eFuse); qué protege cada uno, sus límites, el orden de las capas y la prueba en el
# banco pasan a explicaciones y resumen.
leccion: cap10/sec-10.9

libro:
  207: "cortocircuita deliberadamente la alimentación"
  208: "Se pierde el fusible y quizá el regulador, pero se salva todo lo demás."
  209: "el cortocircuito debe mantenerse hasta que alguien intervenga"
  210: "debe disparar antes de que la carga se dañe, y el fusible debe fundir antes de que el SCR se destruya"
  211: "sigue siendo la solución donde la carga es mucho más cara que la fuente"
  213: "Un eFuse es un MOSFET con medida de corriente y control integrados"
  214: "Programable con una resistencia"
  215: "Su ventaja decisiva no es el rearme sino la velocidad"
  216: "sustituye a la NTC y a su problema del reencendido en caliente"
  217: "En la entrada de red hace falta un fusible de verdad; el eFuse pertenece a los raíles internos."
  220: "eFuse o limitación electrónica en cada raíl interno, con arranque suave"
  221: "Cada capa cubre lo que la anterior no puede"
  223: "se verifica que la corriente queda limitada por la propia fuente en lugar de por el fusible"
  224: "Fusible, crowbar y eFuse comparados"
  "cap10#285": "Es «agresiva» porque sacrifica el fusible"

modelo:
  valores:
    V_n: { sim: "V", nombre: "tensión normal del raíl", unidad: V, valor: 3.3 }
    V_f: { sim: "V_{falla}", nombre: "tensión tras la avería del regulador", unidad: V, valor: 12 }
    t_0: { sim: "t_{0}", nombre: "instante de la avería", unidad: s, valor: 0.001 }
    R_s: { sim: "R_{s}", nombre: "resistencia de la fuente (ejemplo)", unidad: Ω, valor: 0.05 }
    R_f: { sim: "R_{f}", nombre: "resistencia del fusible (ejemplo)", unidad: Ω, valor: 0.05 }
    I2t: { sim: "I²t", nombre: "integral de fusión del fusible (ejemplo)", unidad: "A²·s", valor: 2 }
    R_L: { sim: "R_{L}", nombre: "carga (ejemplo)", unidad: Ω, valor: 10 }
    V_Z: { sim: "V_{Z}", nombre: "tensión del Zener (ejemplo)", unidad: V, valor: 3.9 }
    R_G: { sim: "R_{G}", nombre: "resistencia de puerta (ejemplo)", unidad: Ω, valor: 100 }
    V_T: { sim: "V_{T}", nombre: "caída del SCR (ejemplo)", unidad: V, valor: 1 }
  calculos:
    V_o: { expr: "V_n*R_L/(R_L + R_s + R_f)", sim: "V_{o}", nombre: "tensión del raíl", unidad: V }
    I_o: { expr: "V_o/R_L", sim: "I", nombre: "corriente normal", unidad: A }
    I_cc: { expr: "(V_f - V_T)/(R_s + R_f + 0.001)", sim: "I_{cc}", nombre: "corriente del cortocircuito", unidad: A }
    t_f: { expr: "t_0 + I2t/I_cc^2", sim: "t_{f}", nombre: "instante en que funde el fusible", unidad: s }
    d_f: { expr: "t_f - t_0", sim: "Δt", nombre: "tiempo que el SCR sostiene el cortocircuito", unidad: s }

tarjetas:
  - id: explore-capas
    tipo: tocar
    titulo: "Capas de protección"
    texto: "Un equipo bien protegido combina capas. Toque la que corta en microsegundos y protege también a los semiconductores."
    libro: [215, 216, 220, 224]
    widget:
      tipo: figura
      figura: fig-10.15
      zonas:
        - { id: fusible, rotulo: "Primera caja", rect: [5, 150, 80, 36] }
        - { id: varistor, rotulo: "Segunda caja", rect: [96, 150, 80, 36] }
        - { id: efuse, rotulo: "Tercera caja", rect: [186, 150, 80, 36] }
        - { id: crowbar, rotulo: "Cuarta caja", rect: [276, 150, 80, 36] }
        - { id: regulador, rotulo: "Quinta caja", rect: [367, 150, 82, 36] }
    tocar:
      bien: [efuse]
      porque:
        fusible: "El fusible, en la entrada de red, tarda de ms a s: protege el cableado, no el semiconductor."
        varistor: "El varistor o el TVS van contra la sobretensión, no contra la sobrecorriente."
        crowbar: "El crowbar protege la carga ante una sobretensión, a costa del fusible."
        regulador: "Es la protección térmica y de corriente de cada regulador, la última capa."
    exito: "El eFuse, en cada raíl interno: limita la I²t que llega al fallo y, con arranque suave, sustituye a la NTC."
    escalera:
      - "Busque el que tiene medida de corriente y un MOSFET."
    solucion: "La tercera caja, el eFuse."

  - id: prediga-crowbar
    tipo: elegir
    titulo: "La palanqueta"
    texto: "Al microcontrolador de 3,3 V le llegan 12 V. El crowbar cortocircuita deliberadamente el raíl: toque la pieza que lo hace."
    libro: [207, 208, 210, "cap10#285"]
    widget:
      tipo: circuito
      esquema: crowbar
      piezas: { fuente: V_n, falla: V_f, t0: t_0, rs: R_s, rf: R_f, i2t: I2t, carga: R_L, vz: V_Z, rg: R_G, vt: V_T }
      corriente: I_cc
      mide: { vo: V_o, ifus: I_o }
      grafica:
        x: { id: t, min: 0, max: 0.003, unidad: s, rotulo: "t" }
        y: { min: 0, max: 120, unidad: A, rotulo: "i" }
        curvas:
          - { expr: "I_o + (I_cc - I_o)*ceil((t - t_0)/1e9) - I_cc*ceil((t - t_f)/1e9)", color: azul, rotulo: "i_{fusible}", mide: fusible }
          - { expr: "I_cc*ceil((t - t_0)/1e9) - I_cc*ceil((t - t_f)/1e9)", color: naranja, rotulo: "i_{SCR}", discontinua: true, mide: scr }
      mandos: []
    elegir:
      zonas: [fuente, i2t, vz, rg, scr, carga]
      bien: [scr]
      porque:
        fuente: "Es la fuente, con el regulador que ha fallado."
        i2t: "Es el fusible: el cortocircuito lo funde, pero no lo provoca."
        vz: "El Zener fija el umbral de detección: decide cuándo, no cortocircuita."
        rg: "La resistencia lleva la corriente a la puerta del SCR."
        carga: "Es lo que se quiere salvar."
    exito: "El SCR: se pierde el fusible y quizá el regulador, pero se salva todo lo demás."
    escalera:
      - "El que cortocircuita es el que puede conducir mucha corriente y no soltar."
    solucion: "El SCR."

  - id: lea-cortocircuito
    tipo: leer
    titulo: "La corriente del cortocircuito"
    texto: "Valores de ejemplo. Lea en la gráfica la corriente que pasa por el fusible mientras el SCR cortocircuita el raíl."
    libro: [208, 210]
    widget:
      tipo: circuito
      esquema: crowbar
      piezas: { fuente: V_n, falla: V_f, t0: t_0, rs: R_s, rf: R_f, i2t: I2t, carga: R_L, vz: V_Z, rg: R_G, vt: V_T }
      corriente: I_cc
      mide: { vo: V_o, ifus: I_o }
      grafica:
        x: { id: t, min: 0, max: 0.003, unidad: s, rotulo: "t" }
        y: { min: 0, max: 120, unidad: A, rotulo: "i" }
        curvas:
          - { expr: "I_o + (I_cc - I_o)*ceil((t - t_0)/1e9) - I_cc*ceil((t - t_f)/1e9)", color: azul, rotulo: "i_{fusible}", mide: fusible }
          - { expr: "I_cc*ceil((t - t_0)/1e9) - I_cc*ceil((t - t_f)/1e9)", color: naranja, rotulo: "i_{SCR}", discontinua: true, mide: scr }
      mandos: []
    leer:
      objetivo: I_cc
      unidad: A
      tol: 0.05
      rotulo: "Corriente del cortocircuito"
      errores:
        - { expr: "I_o", texto: "Esa es la corriente normal del raíl, antes de la avería." }
    exito: "Unos {{I_cc}}: solo los frenan las resistencias de la fuente y del fusible. Eso funde el fusible."
    escalera:
      - "Mire la altura de la azul entre la avería y la fusión."
    solucion: "Unos 109 A."
    comprobar:
      - { I_cc: 108.9, tol: 0.01 }

  - id: simule-fusion
    tipo: simular
    titulo: "Cuánto tarda en fundir"
    texto: "Valores de ejemplo: un fusible de I²t = 2 A²·s con esa corriente. ¿Cuánto tiempo sostiene el SCR el cortocircuito?"
    libro: [210]
    fijar: { I2t: 2 }
    widget:
      tipo: grafica
      x: { id: t, min: 0, max: 0.003, unidad: s, rotulo: "t" }
      y: { min: 0, max: 120, unidad: A, rotulo: "i" }
      curvas:
        - { expr: "I_cc*ceil((t - t_0)/1e9) - I_cc*ceil((t - t_f)/1e9)", color: naranja, rotulo: "i_{SCR}" }
      lectura: { valor: d_f, rotulo: "El SCR conduce durante" }
      ocultar: true
    simular:
      objetivo: d_f
      unidad: s
      tol: 0.05
      rotulo: "Tiempo hasta fundir"
      errores:
        - { expr: "I2t/I_cc", texto: "La corriente va al cuadrado: t = I²t / I²." }
    exito: "Unos {{d_f}}: ese es el tiempo que el SCR debe aguantar. Su I²t tiene que ser mayor que la del fusible."
    escalera:
      - "t = I²t / I²."
    solucion: "2 / 109² ≈ 0,17 ms."
    comprobar:
      - { d_f: 0.000169, tol: 0.01 }

  - id: explore-crowbar
    tipo: explorar
    titulo: "El fusible que menos castiga"
    texto: "El fusible debe fundir antes de que el SCR se destruya. Elija el fusible que deja al SCR conduciendo menos tiempo."
    libro: [208, 210]
    inicio: { I2t: 5 }
    widget:
      tipo: circuito
      esquema: crowbar
      piezas: { fuente: V_n, falla: V_f, t0: t_0, rs: R_s, rf: R_f, i2t: I2t, carga: R_L, vz: V_Z, rg: R_G, vt: V_T }
      lectura: { valor: d_f, rotulo: "El SCR conduce durante" }
      corriente: I_cc
      mide: { vo: V_o, ifus: I_o }
      grafica:
        x: { id: t, min: 0, max: 0.003, unidad: s, rotulo: "t" }
        y: { min: 0, max: 120, unidad: A, rotulo: "i" }
        curvas:
          - { expr: "I_o + (I_cc - I_o)*ceil((t - t_0)/1e9) - I_cc*ceil((t - t_f)/1e9)", color: azul, rotulo: "i_{fusible}", mide: fusible }
          - { expr: "I_cc*ceil((t - t_0)/1e9) - I_cc*ceil((t - t_f)/1e9)", color: naranja, rotulo: "i_{SCR}", discontinua: true, mide: scr }
      mandos:
        - { valor: I2t, min: 1, max: 10, paso: 1, rotulo: "Fusible, I²t" }
    objetivo:
      condiciones:
        - { valor: d_f, max: 0.0001, rotulo: "El SCR conduce: {{d_f}}" }
      logrado: "Con I²t = {{I2t}}, el SCR solo conduce {{d_f}}: cuanto menor la I²t del fusible, menos sufre el tiristor."
      pistas:
        - { texto: "El SCR todavía conduce mucho rato: un fusible de menos I²t." }
    escalera:
      - "El tiempo es proporcional a la I²t del fusible."
    solucion: "El de I²t = 1 A²·s: unos 0,08 ms."
    comprobar:
      - { con: { I2t: 1 }, d_f: 0.0000843, tol: 0.01 }

  - id: por-que-scr
    tipo: porque
    titulo: "La virtud del SCR"
    texto: "En la sección 10.1 que el SCR no se apague parecía una limitación. ¿Por qué aquí es justo lo que se necesita?"
    libro: [209]
    widget:
      tipo: circuito
      esquema: crowbar
      piezas: { fuente: V_n, falla: V_f, t0: t_0, rs: R_s, rf: R_f, i2t: I2t, carga: R_L, vz: V_Z, rg: R_G, vt: V_T }
      corriente: I_cc
      grafica:
        x: { id: t, min: 0, max: 0.003, unidad: s, rotulo: "t" }
        y: { min: 0, max: 120, unidad: A, rotulo: "i" }
        curvas:
          - { expr: "I_cc*ceil((t - t_0)/1e9) - I_cc*ceil((t - t_f)/1e9)", color: naranja, rotulo: "i_{SCR}", mide: scr }
      mandos: []
    opciones:
      - texto: "El cortocircuito debe mantenerse hasta que alguien intervenga, no soltarse al bajar la tensión"
        bien: true
        porque: "Disparado, el SCR sigue conduciendo hasta que el fusible funde."
      - texto: "Porque el SCR se apaga solo al fundir el fusible, y eso es más rápido"
        porque: "Se apaga cuando falta corriente, sí; lo que importa es que no suelte antes."
      - texto: "Porque el SCR disipa menos que un MOSFET"
        porque: "Lo que se busca aquí es el enclavamiento, no la disipación."
    escalera:
      - "¿Qué pasaría si soltara en cuanto la tensión baja?"
    solucion: "Porque el cortocircuito debe mantenerse: una vez disparado, el SCR no suelta."

  - id: ventaja
    tipo: pregunta
    titulo: "La ventaja decisiva"
    texto: "Un eFuse se rearma solo y su umbral se programa con una resistencia. ¿Cuál es su ventaja decisiva?"
    libro: [214, 215, 216]
    widget:
      tipo: figura
      figura: fig-10.15
      zonas:
        - { id: efuse, rotulo: "Tercera caja", rect: [186, 150, 80, 36] }
    opciones:
      - texto: "La velocidad: limita la I²t que llega al fallo"
        bien: true
        porque: "Eso protege a los semiconductores, lo que un fusible no consigue."
      - texto: "El rearme automático"
        porque: "Cómodo, pero el libro dice que lo decisivo no es el rearme sino la velocidad."
      - texto: "Su capacidad de ruptura"
        porque: "Es un semiconductor: no la tiene como un fusible cerámico. Por eso no va en la red."
    escalera:
      - "¿Qué consigue cortar en microsegundos?"
    solucion: "La velocidad: corta en microsegundos y limita la I²t."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [207, 209, 215, 217, 220, 221, 223, 211, 213]
    ideas:
      - { titulo: "Crowbar.", texto: "Ante una sobretensión cortocircuita el raíl y funde el fusible: el mal menor. Se prueba con la fuente en corriente limitada." }
      - { titulo: "El SCR.", texto: "Que no suelte es su virtud aquí; el fusible debe fundir antes de que se destruya." }
      - { titulo: "eFuse.", texto: "Corta en microsegundos y protege también al semiconductor; sin capacidad de ruptura, no va en la red." }
      - { titulo: "En capas.", texto: "Fusible, varistor o TVS, eFuse, crowbar y regulador: cada una cubre lo que la anterior no puede." }
