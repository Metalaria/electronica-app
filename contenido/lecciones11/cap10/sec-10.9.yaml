# Lección 1.2 de la sección 10.9 «Crowbar y Fusibles Electrónicos» (cap10). Formato: contenido/lecciones11/GUIA.md.
# - Sección sin números ni ecuaciones: la figura 10.16 (fig-10.15) con zonas en sus cinco capas; preguntas sobre el
#   crowbar (el enclavamiento del SCR de la sección 10.1 como virtud), el eFuse y su combinación.
# - No hay esquema de SCR en la app (petición en peticiones-motor12.md), así que el crowbar no es un circuito vivo.
leccion: cap10/sec-10.9

libro:
  207: "cortocircuita deliberadamente la alimentación"
  208: "Se pierde el fusible y quizá el regulador, pero se salva todo lo demás."
  209: "el cortocircuito debe mantenerse hasta que alguien intervenga"
  210: "debe disparar antes de que la carga se dañe, y el fusible debe fundir antes de que el SCR se destruya"
  211: "sigue siendo la solución donde la carga es mucho más cara que la fuente"
  213: "Un eFuse es un MOSFET con medida de corriente y control integrados"
  214: "Programable con una resistencia"
  215: "Su ventaja decisiva no es el rearme sino la velocidad"
  216: "sustituye a la NTC y a su problema del reencendido en caliente"
  217: "En la entrada de red hace falta un fusible de verdad; el eFuse pertenece a los raíles internos."
  220: "eFuse o limitación electrónica en cada raíl interno, con arranque suave"
  221: "Cada capa cubre lo que la anterior no puede"
  223: "se verifica que la corriente queda limitada por la propia fuente en lugar de por el fusible"
  224: "Fusible, crowbar y eFuse comparados"
  "cap10#285": "Es «agresiva» porque sacrifica el fusible"

modelo:
  valores: {}
  calculos: {}

tarjetas:
  - id: explore-capas
    tipo: explorar
    titulo: "Capas de protección"
    texto: "Toque cada capa. Un equipo bien protegido no elige entre ellas: las combina."
    libro: [220, 221, 224]
    widget:
      tipo: figura
      figura: fig-10.15
      zonas:
        - { id: fusible, rotulo: "Primera caja", rect: [5, 150, 80, 36], texto: "Fusible en la entrada de red, con la capacidad de ruptura adecuada." }
        - { id: varistor, rotulo: "Segunda caja", rect: [96, 150, 80, 36], texto: "Varistor o TVS contra la sobretensión." }
        - { id: efuse, rotulo: "Tercera caja", rect: [186, 150, 80, 36], texto: "eFuse en cada raíl interno, con arranque suave." }
        - { id: crowbar, rotulo: "Cuarta caja", rect: [276, 150, 80, 36], texto: "Crowbar donde la carga es valiosa o la sobretensión probable." }
        - { id: regulador, rotulo: "Quinta caja", rect: [367, 150, 82, 36], texto: "La protección térmica y de corriente de cada regulador." }
    requiere: { mover: [fusible, efuse, crowbar] }

  - id: prediga-crowbar
    tipo: predecir
    titulo: "El regulador falla"
    texto: "El regulador de un microcontrolador de 3,3 V falla en cortocircuito y le llegan 12 V. ¿Qué hace el crowbar?"
    libro: [207, 208, 211, "cap10#285"]
    widget:
      tipo: figura
      figura: fig-10.15
      zonas:
        - { id: crowbar, rotulo: "Cuarta caja", rect: [276, 150, 80, 36] }
    opciones:
      - texto: "Dispara un SCR que cortocircuita el raíl y funde el fusible"
        bien: true
        porque: "Se pierde el fusible y quizá el regulador, pero se salva todo lo demás."
      - texto: "Recorta el raíl a 3,3 V, como un Zener"
        porque: "No recorta: cortocircuita deliberadamente la alimentación."
      - texto: "Desconecta la carga y se rearma"
        porque: "Eso lo haría un eFuse; el crowbar se queda en cortocircuito."
    escalera:
      - "El nombre viene de arrojar una palanqueta sobre las barras."
    solucion: "Cortocircuita el raíl con un SCR y el fusible funde."

  - id: por-que-scr
    tipo: porque
    titulo: "La virtud del SCR"
    texto: "En la sección 10.1 que el SCR no se apague parecía una limitación. ¿Por qué aquí es justo lo que se necesita?"
    libro: [209]
    widget:
      tipo: figura
      figura: fig-10.15
      zonas:
        - { id: crowbar, rotulo: "Cuarta caja", rect: [276, 150, 80, 36] }
    opciones:
      - texto: "El cortocircuito debe mantenerse hasta que alguien intervenga, no soltarse al bajar la tensión"
        bien: true
        porque: "Disparado, el SCR sigue conduciendo hasta que el fusible funde."
      - texto: "Porque el SCR se apaga solo al fundir el fusible, y eso es más rápido"
        porque: "Se apaga cuando falta corriente, sí; lo que importa es que no suelte antes."
      - texto: "Porque el SCR disipa menos que un MOSFET"
        porque: "Lo que se busca aquí es el enclavamiento, no la disipación."
    escalera:
      - "¿Qué pasaría si soltara en cuanto la tensión baja?"
    solucion: "Porque el cortocircuito debe mantenerse: una vez disparado, el SCR no suelta."

  - id: dos-condiciones
    tipo: pregunta
    titulo: "Dos condiciones a la vez"
    texto: "Un crowbar es un Zener, una resistencia a la puerta y un SCR. ¿Qué dos condiciones debe cumplir?"
    libro: [210]
    widget:
      tipo: figura
      figura: fig-10.15
      zonas:
        - { id: crowbar, rotulo: "Cuarta caja", rect: [276, 150, 80, 36] }
    opciones:
      - texto: "Disparar antes de que la carga se dañe, y que el fusible funda antes de que el SCR se destruya"
        bien: true
        porque: "La segunda exige comparar la I²t del fusible con la del tiristor."
      - texto: "Disparar con cualquier transitorio, y no fundir nunca el fusible"
        porque: "Fundir el fusible es lo que se busca; y dispararse sin motivo sería un problema."
      - texto: "Que el SCR se apague solo y que la carga no note nada"
        porque: "El SCR no debe apagarse: el cortocircuito se mantiene hasta que se interviene."
    escalera:
      - "Piense en quién debe sobrevivir: la carga y el SCR."
    solucion: "Disparar antes del daño, y fundir el fusible antes de que el SCR se destruya (las I²t)."

  - id: quien-protege
    tipo: pregunta
    titulo: "Qué protege cada uno"
    texto: "Empareje cada protección con lo que protege de verdad."
    libro: [208, 213, 215]
    widget:
      tipo: figura
      figura: fig-10.15
      zonas:
        - { id: tabla, rotulo: "La tabla", rect: [0, 0, 453, 130] }
    emparejar:
      - ["Fusible", "El cableado, no el semiconductor"]
      - ["Crowbar", "La carga ante una sobretensión"]
      - ["eFuse", "También al semiconductor: limita la I²t"]
    exito: "Cortar en microsegundos limita la I²t a una fracción minúscula de la que deja pasar un fusible."
    pistas:
      - { texto: "Solo uno corta en microsegundos con medida de corriente." }
    escalera:
      - "¿Cuál limita la energía que llega al fallo?"
    solucion: "Fusible: el cableado. Crowbar: la carga. eFuse: también el semiconductor."

  - id: ventaja
    tipo: pregunta
    titulo: "La ventaja decisiva"
    texto: "Un eFuse se rearma solo y su umbral se programa con una resistencia. ¿Cuál es su ventaja decisiva?"
    libro: [214, 215, 216]
    widget:
      tipo: figura
      figura: fig-10.15
      zonas:
        - { id: efuse, rotulo: "Tercera caja", rect: [186, 150, 80, 36] }
    opciones:
      - texto: "La velocidad: limita la I²t que llega al fallo"
        bien: true
        porque: "Y además suele traer arranque suave, que sustituye a la NTC y a su problema en caliente."
      - texto: "El rearme automático"
        porque: "Cómodo, pero el libro dice que lo decisivo no es el rearme sino la velocidad."
      - texto: "Su capacidad de ruptura"
        porque: "Es un semiconductor: no la tiene como un fusible cerámico."
    escalera:
      - "¿Qué consigue cortar en microsegundos?"
    solucion: "La velocidad: corta en microsegundos y limita la I²t."

  - id: limites
    tipo: pregunta
    titulo: "Dónde no va"
    texto: "¿Por qué un eFuse no sustituye al fusible de la entrada de red?"
    libro: [217]
    widget:
      tipo: figura
      figura: fig-10.15
      zonas:
        - { id: fusible, rotulo: "Primera caja", rect: [5, 150, 80, 36] }
    opciones:
      - texto: "Es un semiconductor de tensión y corriente moderadas, sin capacidad de ruptura"
        bien: true
        porque: "Pertenece a los raíles internos; en la red hace falta un fusible de verdad."
      - texto: "Porque es demasiado lento para la red"
        porque: "Corta en microsegundos: es mucho más rápido que un fusible."
      - texto: "Porque no se puede rearmar"
        porque: "Se rearma, automáticamente o por señal."
    escalera:
      - "¿Qué corta un fusible cerámico y un semiconductor no?"
    solucion: "No tiene capacidad de ruptura y maneja tensiones y corrientes moderadas."

  - id: ordene-capas
    tipo: pregunta
    titulo: "En orden, desde la red"
    texto: "Ordene las capas de un equipo bien protegido, desde la entrada de red hacia dentro."
    libro: [220]
    widget:
      tipo: figura
      imagen: img/potencia_foto.jpg
      zonas:
        - { id: fotos, rotulo: "Las cuatro fotos", rect: [0, 0, 1600, 1200] }
    ordenar:
      - "Fusible en la entrada de red"
      - "Varistor o TVS"
      - "eFuse en cada raíl interno"
      - "Crowbar si la carga es valiosa"
      - "Protección térmica y de corriente del regulador"
    exito: "Cada capa cubre lo que la anterior no puede: un fallo queda en avería localizada."
    pistas:
      - { texto: "Lo primero es el fusible, para acotar cualquier fallo posterior." }
    escalera:
      - "La protección del propio regulador va al final, dentro."
    solucion: "Fusible, varistor o TVS, eFuse, crowbar y la protección del regulador."

  - id: banco-crowbar
    tipo: pregunta
    titulo: "Probar un crowbar"
    texto: "¿Cómo se prueba un crowbar en el banco sin gastar un fusible en cada prueba?"
    libro: [223]
    widget:
      tipo: figura
      figura: fig-10.15
      zonas:
        - { id: crowbar, rotulo: "Cuarta caja", rect: [276, 150, 80, 36] }
    opciones:
      - texto: "Con la fuente en corriente limitada, subiendo despacio hasta que dispara"
        bien: true
        porque: "Se comprueba el umbral, y la corriente la limita la fuente, no el fusible."
      - texto: "Con un fusible de mucho más valor"
        porque: "Cambiaría lo que se prueba: y el SCR podría no aguantar."
      - texto: "Puenteando el fusible"
        porque: "Sin límite de corriente, el SCR cortocircuitaría la fuente sin protección."
    escalera:
      - "¿Quién puede limitar la corriente en lugar del fusible?"
    solucion: "Con la fuente en corriente limitada, subiendo la tensión hasta el disparo."

  - id: resumen
    tipo: resumen
    titulo: "Lección completada"
    libro: [207, 209, 215, 221]
    ideas:
      - { titulo: "Crowbar.", texto: "Ante una sobretensión cortocircuita el raíl y funde el fusible: el mal menor." }
      - { titulo: "El SCR.", texto: "Que no suelte es su virtud aquí." }
      - { titulo: "eFuse.", texto: "Corta en microsegundos y protege también al semiconductor; no va en la red." }
      - { titulo: "En capas.", texto: "Cada una cubre lo que la anterior no puede." }
