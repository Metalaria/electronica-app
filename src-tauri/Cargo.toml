[package]
name = "electronica-practica-avanzada"
version = "0.11.0"
description = "Lector privado y sin conexión de «Electrónica Práctica Avanzada»"
authors = ["Gonzalo Mejías"]
edition = "2021"
rust-version = "1.77.2"

[lib]
# The library form is what Android (and iOS) load; the desktop binary just calls run().
name = "electronica_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-store = "2"
# Opens the release page of a new version in the system browser (update notice).
tauri-plugin-opener = "2"

# Mobile only (0.11): vibration feedback (the plugin's Android library declares VIBRATE) and the daily
# reminder (local notification scheduled with AlarmManager; its library declares POST_NOTIFICATIONS and
# the boot receiver that restores it). Desktop builds do not link them: the web front end hides the
# reminder there and falls back to navigator.vibrate, and capabilities/movil.json only applies to
# android/iOS, so tauri-build does not look for their permissions on desktop.
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-haptics = "2"
tauri-plugin-notification = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
