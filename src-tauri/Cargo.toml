[package]
name = "electronica-practica-avanzada"
version = "0.3.0"
description = "Lector privado y sin conexión de «Electrónica Práctica Avanzada»"
authors = ["Gonzalo Mejías"]
edition = "2021"
rust-version = "1.77.2"

[lib]
# The library form is what Android (and iOS) load; the desktop binary just calls run().
name = "electronica_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-store = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
