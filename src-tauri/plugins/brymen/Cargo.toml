[package]
# 1.3: the real Brymen BM869s through its BU-86X USB cable. A local Tauri plugin of the app (never published): on
# Windows, macOS and Linux it talks to the cable through hidapi; on Android through its own Kotlin class
# (android/, android.hardware.usb), which the project generated by `tauri android init` picks up like any other
# plugin's Android library (the `links` key below and build.rs: tauri-build reads DEP_TAURI_PLUGIN_BRYMEN_* and writes
# the module into gen/android/tauri.settings.gradle and app/tauri.build.gradle.kts). It only moves raw bytes: the
# packet is decoded by the web front end (web/src/lib/brymen-real/protocolo.ts), the same on every platform.
name = "tauri-plugin-brymen"
version = "1.3.0"
edition = "2021"
rust-version = "1.77.2"
publish = false
links = "tauri-plugin-brymen"
description = "Lectura del Brymen BM869s por el cable BU-86X (HID USB)"

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# hidapi's C library (the one sigrok uses with this cable): Windows hid.dll/SetupAPI, macOS IOKit. No driver is
# installed on either: the cable is a standard HID device.
[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
hidapi = { version = "2.6.5", default-features = false }

# Linux (not a release target; it lets `cargo check` and the desktop dev build work here): hidraw through the
# pure-Rust udev enumeration, so no libudev-dev is needed.
[target.'cfg(target_os = "linux")'.dependencies]
hidapi = { version = "2.6.5", default-features = false, features = ["linux-native-basic-udev"] }

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
