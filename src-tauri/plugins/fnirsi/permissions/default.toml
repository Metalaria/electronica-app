"$schema" = "schemas/schema.json"

[default]
description = "Lectura del FNIRSI 2C53T por su enlace USB «stock-link»: buscar el instrumento, abrirlo, pedirle su identificación, suscribirse a sus medidas, leerlas y cerrarlo. Nada más: solo se abre el dispositivo USB 1209:0001 cuyo nombre es «2C53T stock-link», y solo se le envían las órdenes de identificación y de suscripción (nunca la de lectura de memoria)."
permissions = ["allow-listar", "allow-abrir", "allow-enviar", "allow-leer", "allow-cerrar"]
