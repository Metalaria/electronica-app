[package]
# The real FNIRSI 2C53T through «stock-link», the USB HID link a small patch adds to FNIRSI's own V1.2.0 firmware
# (github.com/Metalaria/fnirsi-2c53t-link). A local Tauri plugin of the app (never published), built like
# plugins/brymen: on Windows, macOS and Linux it talks to the instrument through hidapi; on Android through its own
# Kotlin class (android/, android.hardware.usb), which the project generated by `tauri android init` picks up like
# any other plugin's Android library (the `links` key below and build.rs). It only moves raw 64-byte reports: they
# are decoded by the web front end (web/src/lib/fnirsi-real/), the same on every platform.
name = "tauri-plugin-fnirsi"
version = "0.1.0"
edition = "2021"
rust-version = "1.77.2"
publish = false
links = "tauri-plugin-fnirsi"
description = "Lectura del FNIRSI 2C53T (multímetro y osciloscopio) por el enlace USB «stock-link»"

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# hidapi's C library: Windows hid.dll/SetupAPI, macOS IOKit. No driver is installed on either: the link is a
# standard HID device (vendor-defined reports).
[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
hidapi = { version = "2.6.5", default-features = false }

# Linux (not a release target; it lets `cargo check` and the desktop dev build work here): hidraw through the
# pure-Rust udev enumeration, so no libudev-dev is needed.
[target.'cfg(target_os = "linux")'.dependencies]
hidapi = { version = "2.6.5", default-features = false, features = ["linux-native-basic-udev"] }

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
